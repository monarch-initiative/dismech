- name: Reduced Dopamine Beta-Hydroxylase Abundance
  biological_scale: MOLECULAR
  description: >-
    CTR1 knockout neuroblastoma cells have reduced abundance of the
    copper-dependent Golgi enzyme dopamine beta-hydroxylase. No plasma
    catecholamine measurements in patients are reported in the sources cited
    here, so whether this cuproenzyme deficit has a clinical counterpart, as it
    does in Menkes disease, is unknown.
  molecular_functions:
  - preferred_term: dopamine beta-monooxygenase activity
    term:
      id: GO:0004500
      label: dopamine beta-monooxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39878654
    reference_title: "Adaptive protein synthesis in genetic models of copper deficiency and childhood neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CTR1 KO clones were characterized by their increased resistance to copper (Supplemental Figure S1B) and reduced abundance of the copper-dependent Golgi enzyme dopamine-β-hydroxylase"
    explanation: Reduced DBH protein in CTR1 knockout neuronal cells.
  - reference: PMID:11391005
    reference_title: "Essential role for mammalian copper transporter Ctr1 in copper homeostasis and embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that the mouse Ctr1 gene encodes a component of the Cu transport machinery and that mice heterozygous for Ctr1 exhibit tissue-specific defects in copper accumulation and in the activities of copper-dependent enzymes."
    explanation: Reduced Ctr1 dosage lowers cuproenzyme activities in mouse tissues; the specific enzymes are not named in the abstract.
- name: Systemic Copper Deficiency
  biological_scale: ORGANISM
  description: >-
    Low serum copper and ceruloplasmin have been seen only in the congenital
    p.Leu79Pro case and in one 2025 patient who also carried a homozygous ATP7B
    variant of uncertain significance. Serum copper and ceruloplasmin were
    normal in the other patients tested, so normal values do not exclude the
    diagnosis. Intestine-specific Ctr1 knockout mice show that CTR1 drives
    dietary copper absorption, a plausible route to systemic deficiency for
    severe alleles.
  biological_processes:
  - preferred_term: copper ion homeostasis
    term:
      id: GO:0055070
      label: copper ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36562171
    reference_title: "Fatal congenital copper transport defect caused by a homozygous likely pathogenic variant of SLC31A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations revealed very low serum concentrations of copper and ceruloplasmin."
    explanation: Low circulating copper and ceruloplasmin in the congenital case.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, these levels were measured in four out of five individuals harbouring the c.360C > G (p.His120Gln) variant, and all showed normal values."
    explanation: Patients homozygous for p.His120Gln had normal serum copper and ceruloplasmin, so systemic deficiency is not a general feature.
  - reference: PMID:16950140
    reference_title: "Ctr1 drives intestinal copper absorption and is essential for growth, iron metabolism, and neonatal cardiac function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These studies identify Ctr1 as the major factor driving intestinal Cu absorption in mammals."
    explanation: Establishes intestinal CTR1 as the main route of dietary copper absorption in mice.
  downstream:

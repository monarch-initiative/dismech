name: Neurodegeneration and Seizures Due to Copper Transport Defect
creation_date: '2026-10-15T19:30:00Z'
category: Genetic
synonyms:
- NSCT
- CTR1 deficiency
- SLC31A1 deficiency
- SLC31A1-related developmental and epileptic encephalopathy
description: >-
  Autosomal recessive developmental and epileptic encephalopathy caused by
  biallelic variants in SLC31A1, which encodes CTR1, the high-affinity copper
  importer of the plasma membrane. Onset is neonatal to infantile, with
  intractable seizures, profound hypotonia, severe developmental delay with
  regression, progressive global brain atrophy and white matter signal change,
  elevated lactate, and death in early childhood in about half of reported
  patients. The first patients were described as having central nervous system
  copper deficiency, and the clinical picture overlaps with Menkes disease
  without its hair and connective tissue signs. Serum copper and ceruloplasmin
  are normal in most tested patients and low only in the most severe, congenital
  presentation. Fewer than twenty patients have been reported.
notes: >-
  All phenotype frequencies come from one pooled table of 16 retrospectively
  ascertained patients (13 from Julia-Palacios et al. 2025, PMID:41040850, plus
  the Batzios twins and the Dame infant), with many features assessed in fewer
  than 16; treat them as estimates from a very small series. The p.His120Gln
  case count is inconsistent within PMID:41040850 (six cases in the abstract,
  five in the results text). No GeneReviews chapter or Orphanet record was found
  for this disorder in the committed caches, and no ClinGen gene-disease validity
  record for SLC31A1 is cached.

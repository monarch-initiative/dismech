- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Sixteen patients had been described as of 2025. This is a count of published
    cases, not a population rate.
  evidence:
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only 16 patients have been described, and clinical information remains limited, particularly regarding circulating copper and ceruloplasmin levels."
    explanation: States the total number of reported patients.
progression:
- phase: Onset
  notes: >-
    Seizures begin at a mean of about 6 months (range 1 to 24 months) in the
    largest series. The Dame infant presented at birth with pulmonary hypoplasia
    and had intracranial disease and seizures from 2 weeks. Most children are
    already delayed before seizures begin; only 3 of 13 developed normally until
    seizure onset.
  evidence:
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented with severe neurological impairment characterized by early-onset epileptic encephalopathy (EOEE), with an average age of onset of 6 months (range, 1-24 months)."
    explanation: Gives the age of seizure onset across the 13-patient series.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only three out of 13 patients had normal neurodevelopment prior to seizure onset."
    explanation: Shows that developmental impairment usually precedes seizure onset.
  - reference: PMID:36562171
    reference_title: "Fatal congenital copper transport defect caused by a homozygous likely pathogenic variant of SLC31A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 2 weeks of age, multifocal brain hemorrhages were diagnosed by cerebral ultrasound and magnetic resonance imaging, together with increased tortuosity of cerebral arteries."
    explanation: Documents neonatal onset of intracranial disease in the most severe reported case.
- phase: Progressive course and early death
  notes: >-
    The course is progressive, with regression, dysphagia and respiratory
    compromise. Seven of 13 patients in the largest series died at a mean age of
    2.7 years (range 1 to 6 years), mostly from respiratory failure or epileptic
    decompensation, and the Dame infant died at 1 month.
  evidence:
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven cases died prematurely at an average age of 2.7 years (range, 1-6 years), mostly due to respiratory failure or epileptic decompensation."
    explanation: Documents early childhood mortality and its main causes.
  - reference: PMID:36562171
    reference_title: "Fatal congenital copper transport defect caused by a homozygous likely pathogenic variant of SLC31A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The infant died after redirection of care and elective cessation of invasive mechanical ventilation at 1 month of age."
    explanation: Documents neonatal death in the congenital presentation.
genetic:
- name: SLC31A1
  gene_term:
    preferred_term: SLC31A1
    term:
      id: hgnc:11016
      label: SLC31A1
  association: Biallelic germline variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    SLC31A1 encodes CTR1, a homotrimeric plasma-membrane copper importer. Most
    reported variants are missense changes in the first intracellular loop
    (Arg95, Arg102, His120); the one truncating allele seen in homozygous form
    (p.Glu187*) removes only the last three residues. No homozygous null allele
    has been reported, and Ctr1 null mice die in mid-gestation, so the disease
    alleles are presumed hypomorphic. The authors of PMID:41040850 scored the
    gene-disease relationship as Moderate using the ClinGen framework; that is
    their own assessment, not a published ClinGen classification, so no
    gene_disease_validity record is entered here.
  evidence:
  - reference: PMID:35913762
    reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CTR1 deficiency represents a newly defined inherited disorder of brain copper metabolism."
    explanation: Establishes biallelic CTR1 (SLC31A1) variants as the cause of a distinct inherited disorder.
  - reference: PMID:36562171
    reference_title: "Fatal congenital copper transport defect caused by a homozygous likely pathogenic variant of SLC31A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report a newborn infant of consanguineous parents with a homozygous pathogenic variant in a highly conserved sequence of SLC31A1, coding for the copper influx transporter 1, CTR1."
    explanation: An independent family with a homozygous SLC31A1 variant.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For SLC31A1, we determined a Moderate level of evidence, confirming its association with autosomal recessive SLC31A1-related neurodevelopmental disorder."
    explanation: Authors' own ClinGen-framework assessment of the gene-disease relationship across 10 further families; not a ClinGen record.
  variants:
  - name: p.Arg95His
    description: >-
      NM_001859.4:c.284G>A, homozygous in the index twins; a second change at
      the same residue (p.Arg95Cys) was found in the 2025 series. Arg95 sits at
      the cytoplasmic gate of the CTR1 pore.
    gene:
      preferred_term: SLC31A1
      term:
        id: hgnc:11016
        label: SLC31A1
    evidence:
    - reference: PMID:35913762
      reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe identical twin male infants homozygous for a novel missense variant NM_001859.4:c.284 G > A (p.Arg95His) in CTR1 with a distinctive autosomal recessive syndrome of infantile seizures and neurodegeneration, consistent with profound central nervous system copper deficiency."
      explanation: Identifies p.Arg95His in the index family.
  - name: p.His120Gln
    description: >-
      NM_001859.4:c.360C>G, the recurrent variant of the 2025 series, found
      homozygous in Spanish and Mexican families on a shared haplotype that the
      authors suggest reflects a founder effect. CTR1 protein level and copper
      uptake were normal in one patient's fibroblasts.
    gene:
      preferred_term: SLC31A1
      term:
        id: hgnc:11016
        label: SLC31A1
    evidence:
    - reference: PMID:41040850
      reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five cases from three unrelated families (P7-11) bear the same transversion c.360C > G, which leads to a missense change of the electrically charged His to the non-charged hydrophilic Gln at residue 120 (p.His120Gln)."
      explanation: Documents the recurrent p.His120Gln allele across unrelated families.
  - name: p.Leu79Pro
    description: >-
      Reported as c.236T>C, homozygous in the infant with the congenital, fatal
      presentation and low serum copper and ceruloplasmin. The substitution
      places a proline in the first transmembrane helix, which the 2025 authors
      propose disrupts the pore.
    gene:
      preferred_term: SLC31A1
      term:
        id: hgnc:11016
        label: SLC31A1
    evidence:
    - reference: PMID:36562171
      reference_title: "Fatal congenital copper transport defect caused by a homozygous likely pathogenic variant of SLC31A1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This missense variant, c.236T > C, was detected by whole exome sequencing."
      explanation: Identifies the c.236T>C variant in the congenital case.
pathophysiology:
- name: CTR1 Copper Import Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC31A1 variants impair CTR1, the high-affinity transporter that
    brings copper across the plasma membrane. Mouse genetics shows CTR1 is the
    main route of cellular copper entry, and the index patients were described
    as having central nervous system copper deficiency. Whether reduced import
    is the primary defect for every allele is not settled: fibroblasts
    homozygous for p.His120Gln showed normal CTR1 protein and normal copper
    uptake, and the 2025 authors suggest that cytoplasmic-loop variants may
    instead disturb copper handoff to intracellular chaperones.
  genes:
  - preferred_term: SLC31A1
    term:
      id: hgnc:11016
      label: SLC31A1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION

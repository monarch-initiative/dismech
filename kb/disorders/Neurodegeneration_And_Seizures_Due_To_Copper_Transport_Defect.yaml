animal_models:
- name: Ctr1 knockout mouse (heterozygous and null)
  species: Mouse
  genotype: Ctr1 targeted null allele, heterozygous and homozygous
  genes:
  - preferred_term: SLC31A1
    term:
      id: hgnc:11016
      label: SLC31A1
  publication: PMID:11391004
  description: >-
    Homozygous Ctr1 null embryos die in mid-gestation. Heterozygous adults are
    phenotypically normal at 16 months but have about half the normal brain
    copper and reduced cuproenzyme activities in some tissues.
  modeled_mechanisms:
  - target: Brain Copper Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Halving Ctr1 dosage halves brain copper.
    limitations: >-
      Heterozygous mice carry one null allele, whereas patients carry two
      presumed hypomorphic alleles; the mice have no neurological phenotype, and
      the null genotype is embryonic lethal rather than a model of the human
      disease.
    evidence:
    - reference: PMID:11391004
      reference_title: "The copper transporter CTR1 provides an essential function in mammalian embryonic development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the brains of heterozygous adult mice, which at 16 months are phenotypically normal, copper is reduced to approximately half compared with control littermates, implicating CTR1 as the required port for copper entry into at least this organ."
      explanation: Supports the model as informative for brain copper entry.
  evidence:
  - reference: PMID:11391005
    reference_title: "Essential role for mammalian copper transporter Ctr1 in copper homeostasis and embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice completely deficient for Ctr1 exhibit profound growth and developmental defects and die in utero in mid-gestation."
    explanation: Complete Ctr1 loss is embryonic lethal in mice.
- name: Intestine-specific Ctr1 knockout mouse
  species: Mouse
  genotype: Intestinal epithelial cell-specific Ctr1 deletion
  genes:
  - preferred_term: SLC31A1
    term:
      id: hgnc:11016
      label: SLC31A1
  publication: PMID:16950140
  description: >-
    Loss of Ctr1 in intestinal epithelium blocks dietary copper absorption,
    causing neonatal copper deficiency in peripheral tissues, growth failure and
    early death that are partly rescued by a single postnatal copper dose.
    Oral elesclomol, which delivers copper independently of CTR1, rescued these
    mice from early postnatal lethality; it has not been reported in patients.
  modeled_mechanisms:
  - target: Systemic Copper Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Reproduces systemic copper deficiency from an intestinal CTR1 absorption block.
    limitations: >-
      A tissue-restricted null deletion, not a germline hypomorphic allele; most
      patients have normal serum copper, so this models only the severe
      pore-variant arm, and brain involvement is not the focus of the study.
    evidence:
    - reference: PMID:16950140
      reference_title: "Ctr1 drives intestinal copper absorption and is essential for growth, iron metabolism, and neonatal cardiac function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These mice exhibit striking neonatal defects in Cu accumulation in peripheral tissues, hepatic Fe overload, cardiac hypertrophy, and severe growth and viability defects."
      explanation: Documents systemic copper deficiency after intestinal Ctr1 loss.
  evidence:
  - reference: PMID:16950140
    reference_title: "Ctr1 drives intestinal copper absorption and is essential for growth, iron metabolism, and neonatal cardiac function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Consistent with an intestinal Cu absorption block, the growth and viability defects can be partially rescued by a single postnatal Cu administration, indicative of a critical neonatal metabolic requirement for Cu that is provided by intestinal Ctr1."
    explanation: Postnatal copper partly rescues the model.
  - reference: PMID:35433682
    reference_title: "Oral Elesclomol Treatment Alleviates Copper Deficiency in Animal Models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Oral gavage with ES rescued intestine-specific Ctr1 knockout mice from early postnatal lethality without additional copper supplementation."
    explanation: Elesclomol rescues the intestinal Ctr1 knockout mouse.
discussions:
- discussion_id: gap_slc31a1_import_vs_trafficking
  prompt: >-
    Do SLC31A1 cytoplasmic-loop variants such as p.His120Gln reduce copper
    import, or do they leave import intact and impair copper handoff to
    intracellular chaperones and mitochondria?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#CTR1 Copper Import Dysfunction
  - pathophysiology#Cytochrome c Oxidase Deficiency
  rationale: >-
    Fibroblasts homozygous for p.His120Gln had normal CTR1 protein and normal
    copper uptake but impaired respiration, and most patients have normal serum
    copper. Only total cellular copper was measured, not mitochondrial copper or
    complex IV activity, so the step between the variant and the respiratory
    defect is unresolved for these alleles. The answer bears on whether copper
    supplementation can be expected to help.
  evidence:
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that, for most pathogenic variants, copper (Cu) impairment is likely not primarily due to cellular import."
    explanation: The authors state the open question directly.

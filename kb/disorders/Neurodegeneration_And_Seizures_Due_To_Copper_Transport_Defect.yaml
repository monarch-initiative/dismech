- name: Adaptive mTORC1-S6K Activation
  biological_scale: CELLULAR
  role: compensation
  description: >-
    In CTR1 knockout neuroblastoma cells, copper deficiency activates
    mTORC1-S6K signaling and increases protein synthesis. Genetic experiments in
    flies indicate this response is protective rather than injurious, and it is
    not seen when copper delivery is blocked only at complex IV (COX17
    knockout). This is model-system evidence; it has not been studied in
    patients.
  biological_processes:
  - preferred_term: positive regulation of TORC1 signaling
    term:
      id: GO:1904263
      label: positive regulation of TORC1 signaling
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:39878654
    reference_title: "Adaptive protein synthesis in genetic models of copper deficiency and childhood neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteomic and transcriptomic analysis of CTR1 knockout (KO) cells revealed simultaneous up-regulation of mTORC1 and S6K signaling and reduced PERK signaling."
    explanation: mTORC1-S6K activation in CTR1 knockout neuronal cells.
  - reference: PMID:42126960
    reference_title: "Distinct signaling mechanisms and proteome phenotypes are elicited by compartment-specific genetic defects of copper homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased mTOR activity and downstream protein synthesis are adaptive in models of copper deficiency but deleterious in COX17-deficient cells and flies."
    explanation: Contrasts CTR1-null and COX17-null models, placing the mTOR response downstream of whole-cell copper deficiency rather than complex IV loss alone.
- name: Neuronal Dysfunction and Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Progressive neuronal dysfunction and loss produce early-onset epileptic
    encephalopathy, profound hypotonia, developmental delay and regression, and
    progressive global brain atrophy with white matter, thalamic and basal
    ganglia signal change. The clinical spectrum resembles Menkes disease and
    other intracellular copper trafficking disorders.

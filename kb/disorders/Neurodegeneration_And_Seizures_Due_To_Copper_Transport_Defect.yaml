treatments:
- name: Copper histidinate
  description: >-
    Given to the index twins under a formal clinical protocol. In their cultured
    cells it normalized cytochrome c oxidase activity and enhanced respiration,
    and in the patients it was associated with modest clinical improvement. In
    fibroblasts from a p.His120Gln patient, 50 uM for 24 h did not improve
    respiration and 100 uM for 72 h gave a slight improvement; the authors
    describe their result overall as not reproducing the earlier response.
    Clinical experience is limited to the two treated twins, and the cited
    abstract gives no dose, route, age at start or outcome measures.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: copper histidinate therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: copper histidinate
      term:
        id: CHEBI:757183
        label: copper histidine
  target_mechanisms:
  - target: Cytochrome c Oxidase Deficiency
    treatment_effect: RESTORES
    description: Copper supplementation restores cytochrome c oxidase activity in patient cells.
    evidence:
    - reference: PMID:35913762
      reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment normalized CCO activity and enhanced mitochondrial respiration in vitro"
      explanation: Copper histidinate normalized CCO activity in the index patients' cultured cells.
  - target: Impaired Mitochondrial Respiration
    treatment_effect: RESTORES
    description: Partial and inconsistent restoration of respiration in patient fibroblasts.
    evidence:
    - reference: PMID:41040850
      reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, increasing the treatment dose up to 100 μM CuHis for 72 h resulted in a slight but significant improvement in respiratory capacity for the basal respiratory rate (P < 0.05) and for the maximal respiratory capacity (P < 0.05)."
      explanation: Slight improvement in fibroblast respiration at the higher dose.
    - reference: PMID:41040850
      reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "Treatment of P7 cells with 50 μM copper histidinate (CuHis) for 24 h did not show any significant respiration improvement."
      explanation: No improvement at the lower dose in p.His120Gln fibroblasts.
  evidence:
  - reference: PMID:35913762
    reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also assessed the effects of Copper Histidinate in the patients' cultured cells and in the patients, under a formal clinical protocol."
    explanation: Copper histidinate was given to the index patients under a clinical protocol.
  - reference: PMID:35913762
    reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and was associated with modest clinical improvements"
    explanation: Clinical response in the two treated twins was modest.

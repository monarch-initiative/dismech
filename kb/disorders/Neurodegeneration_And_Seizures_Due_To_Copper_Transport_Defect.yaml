  evidence:
  - reference: PMID:35913762
    reference_title: "Newly identified disorder of copper metabolism caused by variants in CTR1, a high-affinity copper transporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe identical twin male infants homozygous for a novel missense variant NM_001859.4:c.284 G > A (p.Arg95His) in CTR1 with a distinctive autosomal recessive syndrome of infantile seizures and neurodegeneration, consistent with profound central nervous system copper deficiency."
    explanation: Links a CTR1 variant in patients to a copper-deficiency phenotype.
  - reference: PMID:11391004
    reference_title: "The copper transporter CTR1 provides an essential function in mammalian embryonic development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that CTR1 is the primary avenue for copper uptake in mammalian cells."
    explanation: Mouse knockout data establishing CTR1 as the main cellular copper importer.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, no loss-of-function homozygous cases have been identified so far, and no heterozygous cases with truncating variants leading to null alleles have been reported, suggesting that complete ablation of the SLC31A1 protein could be incompatible with life."
    explanation: Basis for treating the disease alleles as partial rather than complete loss of function.
  - reference: PMID:41040850
    reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Cu intracellular uptake was analysed in fibroblasts of P7, and no significant alterations were observed compared with controls studied in parallel"
    explanation: >-
      In fibroblasts homozygous for p.His120Gln, copper uptake was not reduced,
      which argues against impaired import as the primary defect for this allele
      in this cell type.
  downstream:
  - target: Brain Copper Deficiency
    causal_link_type: DIRECT
    description: Reduced CTR1-mediated import limits copper entry into the brain.
    evidence:
    - reference: PMID:11391004
      reference_title: "The copper transporter CTR1 provides an essential function in mammalian embryonic development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observe early embryonic lethality in homozygous mutant embryos and a deficiency in copper uptake in the brains of heterozygous animals."
      explanation: Reduced Ctr1 dosage lowers brain copper uptake in mice.
  - target: Cytochrome c Oxidase Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of cellular copper import depletes mitochondrial copper and reduces
      the copper-dependent respiratory complex IV.
    evidence:
    - reference: PMID:39878654
      reference_title: "Adaptive protein synthesis in genetic models of copper deficiency and childhood neurodegeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mitochondrial-enriched fractions were also selectively depleted of copper but not zinc in CTR1 KO cells"
      explanation: CTR1 knockout neuroblastoma cells lose mitochondrial copper, the intermediate step to complex IV loss.
  - target: Reduced Dopamine Beta-Hydroxylase Abundance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced copper supply to the secretory pathway lowers the copper-dependent enzyme DBH.
    evidence:
    - reference: PMID:39878654
      reference_title: "Adaptive protein synthesis in genetic models of copper deficiency and childhood neurodegeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CTR1 KO clones were characterized by their increased resistance to copper (Supplemental Figure S1B) and reduced abundance of the copper-dependent Golgi enzyme dopamine-β-hydroxylase"
      explanation: CTR1 knockout in neuroblastoma cells lowers DBH protein, linking loss of CTR1 to the DBH node.
  - target: Systemic Copper Deficiency
    causal_link_type: DIRECT
    description: >-
      Alleles proposed to disrupt the CTR1 pore have been associated with low
      circulating copper and ceruloplasmin. The cited genotype-phenotype
      correlation is proposed only for pore-disrupting alleles; cytoplasmic-loop
      variants are not expected to produce systemic copper deficiency.
    evidence:
    - reference: PMID:41040850
      reference_title: "Clinical and molecular characterization of SLC31A1-related developmental and epileptic encephalopathy: insights from 13 new cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Severe variants that disrupt the pore structure of the CTR1 channel appear to be associated with a more severe phenotype, characterized by low circulating copper and ceruloplasmin levels."
      explanation: The authors' proposed genotype-phenotype correlation linking pore-disrupting alleles to low circulating copper.
  - target: Adaptive mTORC1-S6K Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Copper deficiency after CTR1 loss activates mTORC1-S6K signaling in neuronal cells.
    evidence:
    - reference: PMID:39878654
      reference_title: "Adaptive protein synthesis in genetic models of copper deficiency and childhood neurodegeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Proteomic and transcriptomic analysis of CTR1 knockout (KO) cells revealed simultaneous up-regulation of mTORC1 and S6K signaling and reduced PERK signaling."
      explanation: CTR1 knockout neuroblastoma cells show mTORC1 and S6K up-regulation.

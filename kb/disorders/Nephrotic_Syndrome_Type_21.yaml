name: Nephrotic Syndrome Type 21
description: >-
  Autosomal recessive steroid-resistant nephrotic syndrome caused by biallelic loss-of-function variants in AVIL, which
  encodes advillin, a gelsolin/villin-family actin-regulatory protein expressed in podocytes. The founding report described
  four variants in three families. Patient alleles abolish actin bundling, and the truncating allele also loses actin
  binding and severing. In cultured human podocytes advillin interacts with PLCE1 and the ARP2/3 complex, and its loss
  prevents recruitment of PLCE1 to lamellipodia, blocks EGF-induced diacylglycerol generation and slows podocyte
  migration. The two biopsied patients had diffuse mesangial sclerosis, onset of nephrotic syndrome in the first year of
  life and kidney failure by age 3; extrarenal features included retinal dystrophy, deafness, cataract, microcephaly,
  intellectual disability and short stature. ClinGen classifies the gene-disease relationship as Limited.
category: Mendelian

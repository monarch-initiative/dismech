  biological_scale: TISSUE
  description: >-
    Electron microscopy in the homozygous p.Leu425Met patient showed diffuse foot process effacement, and both biopsied
    patients had diffuse mesangial sclerosis. Disruption of the podocyte layer of the glomerular filtration barrier
    produces nephrotic-range proteinuria.

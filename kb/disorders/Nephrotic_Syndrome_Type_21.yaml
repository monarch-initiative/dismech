animal_models:
- name: Zebrafish avil CRISPR knockdown
  species: Zebrafish
  genotype: avil CRISPR knockdown
  publication: PMID:29058690
  description: >-
    The founding report generated a CRISPR avil knockdown in zebrafish to look for a renal phenotype; initial experiments
    showed no larval edema.
  modeled_mechanisms:
  - target: Podocyte Injury and Glomerular Filtration Barrier Failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: No larval edema, the usual zebrafish readout of a leaky glomerular filter.
    limitations: >-
      Reported as initial experiments only, without glomerular histology, ultrastructure or proteinuria measurement. The
      authors note that earlier positive zebrafish models of nephrotic syndrome genes relied on morpholinos, whose
      phenotypes often fail to reproduce in stable mutants, so a negative CRISPR result does not show that AVIL is
      dispensable for the zebrafish filter.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we also generated a CRISPR model of Avil knockdown in zebrafish, but our initial experiments did not show a larval
        edema phenotype
      explanation: Negative result for the renal phenotype in the only reported animal model.
experimental_models:
- name: AVIL-depleted human podocyte line
  experimental_model_type: CELL_LINE
  description: >-
    Cultured human podocytes with AVIL shRNA or siRNA knockdown, rescued with wild-type or patient-allele constructs;
    co-immunoprecipitation was done in HEK293T cells.
  publication: PMID:29058690
  modeled_mechanisms:
  - target: Impaired PLCE1 Recruitment to Podocyte Lamellipodia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Knockdown blocks EGF-induced PLCE1 recruitment and DAG generation; patient alleles fail to rescue.
    limitations: >-
      Immortalized podocytes in two dimensions with knockdown rather than endogenous patient alleles; the mutant proteins
      were tested by overexpression.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These effects were reversed by overexpression of WT AVIL but not by overexpression of any of the 3 patient-derived
        AVIL mutants.
      explanation: Rescue design links the cellular defect to the patient alleles.
  - target: Reduced Podocyte Migration
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Migration rate falls after AVIL knockdown.
    limitations: >-
      Migration rate is a cell-culture proxy; its correspondence to foot process maintenance in vivo is assumed from other
      monogenic SRNS genes rather than shown for AVIL.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Knockdown of AVIL in human podocytes reduced actin stress fibers at the cell periphery, prevented recruitment of
        PLCE1 to the ARP3-rich lamellipodia, blocked EGF-induced generation of diacylglycerol (DAG) by PLCE1, and
        attenuated the podocyte migration rate (PMR).
      explanation: Migration readout in the knockdown line.
discussions:
- discussion_id: avil_single_report_replication
  kind: KNOWLEDGE_GAP
  prompt: Is AVIL-related nephrotic syndrome a reproducible entity beyond the three founding families?
  rationale: >-
    All four variants come from one publication, ClinGen rates the relationship Limited, and the only animal model showed
    no renal phenotype. A 2026 Indonesian SRNS cohort lists AVIL among genes carrying a pathogenic or likely pathogenic
    variant, but its abstract gives no genotype or phenotype for that child.
  attaches_to:
  - genetic#AVIL
  evidence:
  - reference: PMID:42420527
    reference_title: Genetic mutation patterns in Indonesian children with primary steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 60 children with primary SRNS, 9 subjects (15%) harbored pathogenic or likely pathogenic variants across 8
      genes (CUBN, AVIL, TRPC6, INF2, COL4A4, LAMA5, INVS, and FGA).
    explanation: Possible further AVIL case; details are not in the abstract.
  - reference: CGGV:assertion_04806c21-071c-4a74-96c2-ab89ef5ba0e0-2024-08-27T180000.000Z
    reference_title: "AVIL / nephrotic syndrome, type 21 (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This curation includes four variants (frameshift and missense) identified in three probands, all described in a single
      publication (Rao et al., PMID: 29058690).
    explanation: ClinGen states the evidence base is a single publication.
notes: >-
  No dedicated GeneReviews chapter exists for this disorder; it is covered as one row of the Genetic Steroid-Resistant
  Nephrotic Syndrome Overview (PMID:34436835). The founding report describes a spectrum from early-onset disease with
  diffuse mesangial sclerosis to later-onset FSGS, by analogy with PLCE1 disease, but none of its AVIL patients is
  documented with FSGS, so FSGS is not recorded as a phenotype here.

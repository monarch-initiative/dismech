    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, we detected 4 different homozygous or compound heterozygous mutations of AVIL in 3 families affected by NS
    explanation: The only published case series.
pathophysiology:
- name: Biallelic AVIL Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous AVIL variants (p.Leu425Met homozygous; p.Arg135Gln with p.Phe656Valfs*7;
    p.Leu425Met with p.Arg446His) were found in three families with SRNS. ClinGen records loss of function as the
    proposed mechanism. Advillin's molecular function is actin filament binding; the activity is marked ABNORMAL
    rather than DECREASED because every tested patient allele loses filament bundling, but only the truncating allele
    loses F-actin binding itself.
  genes:
  - preferred_term: AVIL
    term:
      id: hgnc:14188
      label: AVIL
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

  downstream:
  - target: Loss of Advillin Actin-Bundling Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        While all AVIL mutations resulted in a marked loss of its actin-bundling ability, truncation of AVIL also
        disrupted colocalization with F-actin, thereby leading to impaired actin binding and severing.
      explanation: All three tested patient alleles lose actin bundling in vitro.
- name: Loss of Advillin Actin-Bundling Activity
  biological_scale: MOLECULAR
  description: >-
    Recombinant advillin carrying any of the three tested patient alleles fails to bundle F-actin in a low-speed
    sedimentation assay. Only the truncating p.Phe656Valfs*7 allele, which lacks the C-terminal F-actin-binding domain,
    also loses actin binding and severing; the two missense alleles keep normal severing.
  biological_processes:
  - preferred_term: actin filament bundle assembly
    modifier: DECREASED
    term:
      id: GO:0051017
      label: actin filament bundle assembly
  evidence:
  - reference: PMID:29058690
    reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      in all 3 AVIL mutants (Arg135Gln, Leu425Met, and Phe656Valfs*7) that represented the mutations found in patients
      with SRNS, a majority of the actin filaments now appeared in the supernatant (S) fraction, demonstrating a severe
      defect in actin bundling.
    explanation: Sedimentation assay showing loss of bundling for every tested patient allele.
  - reference: PMID:29058690
    reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whereas the WT AVIL and 2 mutants representing missense alleles showed normal actin- severing function, the
      truncating mutant exhibited a complete loss of the actin-severing ability of AVIL
    explanation: Severing loss is restricted to the truncating allele.
  downstream:
  - target: Impaired PLCE1 Recruitment to Podocyte Lamellipodia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Patient alleles weaken the AVIL-PLCE1 interaction and fail to rescue PLCE1-dependent DAG generation; whether loss
      of bundling itself, rather than another property of the mutant protein, causes the recruitment defect is not shown.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We showed that the mutants Leu425Met and Phe656Valfs*7 , reflecting the alleles found in the patients with NS,
        weakened this interaction
      explanation: Two patient alleles weaken the AVIL-PLCE1 co-immunoprecipitation in HEK293T cells.
- name: Impaired PLCE1 Recruitment to Podocyte Lamellipodia
  biological_scale: CELLULAR
  description: >-
    Advillin colocalizes with PLCE1 and the ARP2/3 complex at the podocyte periphery and co-immunoprecipitates with both.
    In AVIL-depleted podocytes, EGF stimulation fails to recruit PLCE1 to ARP3-rich lamellipodia and fails to raise
    diacylglycerol; wild-type AVIL rescues this, and the three patient alleles do not.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  genes:
  - preferred_term: PLCE1
    term:
      id: hgnc:17175
      label: PLCE1
  molecular_functions:
  - preferred_term: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
    modifier: DECREASED
    term:
      id: GO:0004435
      label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  evidence:
  - reference: PMID:29058690
    reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Knockdown of AVIL in human podocytes reduced actin stress fibers at the cell periphery, prevented recruitment of
      PLCE1 to the ARP3-rich lamellipodia, blocked EGF-induced generation of diacylglycerol (DAG) by PLCE1, and
      attenuated the podocyte migration rate (PMR).
    explanation: Knockdown phenotype in cultured human podocytes.
  - reference: PMID:29058690
    reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These effects were reversed by overexpression of WT AVIL but not by overexpression of any of the 3 patient-derived
      AVIL mutants.
    explanation: Rescue experiment ties the defect to the patient alleles.
  downstream:
  - target: Reduced Podocyte Migration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      PLCE1 acts downstream of AVIL for migration: PLCE1 overexpression rescues the AVIL-knockdown migration defect, but
      AVIL overexpression does not rescue PLCE1 knockdown. Inhibiting ARP2/3 abrogates the increase in migration,
      placing lamellipodia formation downstream of both.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we observed that the decreased PMR upon knockdown of AVIL was rescued by overex- pression of human PLCE1
      explanation: Epistasis experiment placing PLCE1 downstream of AVIL in podocyte migration.
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        this increased PMR was ameliorated by inhibition of the ARP2/3 complex, indicating that ARP-dependent lamellipodia
        formation occurs downstream of AVIL and PLCE1 function.
      explanation: ARP2/3 inhibition places lamellipodia formation downstream of AVIL and PLCE1.
- name: Reduced Podocyte Migration
  biological_scale: CELLULAR
  description: >-
    AVIL knockdown lowers the podocyte migration rate in culture and reduces peripheral actin stress fibers, and the
    patient alleles fail to rescue it. Knockdown did not significantly change overall podocyte morphology. The authors treat
    migration rate as an established intermediate phenotype of monogenic SRNS; it is a cell-culture readout, and how it
    maps onto foot process failure in vivo is not shown for AVIL.

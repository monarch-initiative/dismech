  notes: >-
    Three families in the founding report: a consanguineous Turkish family (index), a UK patient and a second Turkish
    patient, the latter two found by resequencing AVIL in about 800 individuals with SRNS. A 2026 Indonesian SRNS cohort
    lists AVIL among its diagnostic genes without per-patient detail in the abstract.
  evidence:

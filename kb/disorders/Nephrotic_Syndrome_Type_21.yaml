genetic:
- name: AVIL
  gene_term:
    preferred_term: AVIL
    term:
      id: hgnc:14188
      label: AVIL
  notes: >-
    The founding report proposed the symbol NPHS25 for this disorder; OMIM (618594) and MONDO list it as nephrotic
    syndrome type 21. All four reported variants come from one publication. relationship_type is left unset because
    CAUSATIVE is defined as Definitive or Strong validity and ClinGen rates AVIL Limited.
  variants:
  - name: c.1273C>A p.Leu425Met
    description: >-
      Homozygous in the index patient of a consanguineous Turkish family (A2438_22), and compound heterozygous with
      p.Arg446His in an unrelated Turkish patient (A2647_21). Located in the GH4 gelsolin-homology domain; abolishes actin
      bundling and weakens the PLCE1 interaction in vitro.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we detected a homozygous missense mutation (c.1273C>A; p.Leu425Met
      explanation: Variant identified by homozygosity mapping and exome sequencing in the index family.
  - name: c.404G>A p.Arg135Gln
    description: >-
      Compound heterozygous in trans with p.Phe656Valfs*7 in a UK patient (A913_21). Located in the GH2 domain; abolishes
      actin bundling in vitro.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we detected 2 compound heterozygous mutations in AVIL: c.404G>A (p.Arg135Gln) and c.1964dupT"
      explanation: Variant pair found by resequencing an SRNS cohort.
  - name: c.1964dupT p.Phe656Valfs*7
    description: >-
      Frameshift in trans with p.Arg135Gln (phase confirmed by TA cloning). The truncated protein lacks the C-terminal
      F-actin-binding region and loses actin binding, bundling and severing.
    evidence:
    - reference: PMID:29058690
      reference_title: Advillin acts upstream of phospholipase C ϵ1 in steroid-resistant nephrotic syndrome.
      supports: SUPPORT

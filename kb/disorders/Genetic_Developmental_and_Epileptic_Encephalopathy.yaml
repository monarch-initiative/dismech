  notes: Identified by GEO DataSets index search for Genetic Developmental and Epileptic Encephalopathy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE281622
  title: Cortical versus hippocampal network dysfunction in a human brain assembloid model of epilepsy and intellectual disability
  description: Neurodevelopmental disorders often impair multiple cognitive domains. For instance, a genetic epilepsy syndrome might cause seizures due to cortical hyperexcitability and present with memory impairments arising from hippocampal dysfunction. This study examines how a single disorder differentially affects distinct brain regions by using human patient iPSC-derived cortical- and hippocampal-ganglionic eminence assembloids to model Developmental and Epileptic Encephalopathy 13 (DEE-13), a condition arising from gain-of-function mutations in the SCN8A gene.

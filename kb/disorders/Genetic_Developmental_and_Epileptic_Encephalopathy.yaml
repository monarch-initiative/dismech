prevalence:
- population: Italy (15 tertiary epilepsy centres, molecular diagnoses 2012-2022)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.6
  notes: >-
    Genetic-DEE-specific figure derived from molecularly diagnosed patients
    across 98 genes, accumulated over the 11-year window 2012-2022 and used by
    the authors as a proxy for the prevalence rate. The source calls this a
    "mean incidence proportion", but it is a cumulative diagnosed proportion
    over a defined interval rather than an annual rate, so it is recorded as
    PERIOD_PREVALENCE with the observation window stated here. This is a lower
    bound: it counts only patients who received a molecular diagnosis within the
    surveyed gene panel, so undiagnosed and non-panel genetic DEE are not
    captured.
  evidence:
  - reference: PMID:39613335
    reference_title: National survey on the prevalence of single-gene aetiologies for genetic developmental and epileptic encephalopathies in Italy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We included 1568 unique patients and found a mean incidence proportion
      of 2.6 patients for 100.000 inhabitants (SD=1.13) with consistent values
      across most Italian regions.
    explanation: >-
      The only population-scale estimate specific to genetic DEE rather than DEE
      of all etiologies.
- population: Wellington region, New Zealand (population-based paediatric cohort)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 112.0
  notes: >-
    Point prevalence of DEE among children in a population-based cohort. This
    figure is for DEE overall rather than the genetic subgroup specifically,
    which comprises the majority of DEE once sequencing is applied.
  evidence:
  - reference: PMID:36581463
    reference_title: Epidemiology of Developmental and Epileptic Encephalopathy and of Intellectual Disability and Epilepsy in Children.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Point prevalence for the broad group of children with epilepsy and
      developmental impairment was 175/100,000 children (95% CI 149-203; DEE 112
      and ID+E 63/100,000 children).
    explanation: >-
      Reports DEE point prevalence of 112 per 100,000 children. Marked PARTIAL
      because the study measures DEE overall, not the genetic subgroup alone.
- population: Wellington region, New Zealand (population-based paediatric cohort)
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 169.0
  rate_low: 144.0
  rate_high: 199.0
  notes: >-
    Cumulative incidence of DEE per 100,000 children (approximately 1 in 590),
    accrued to age 16 years, for DEE overall rather than the genetic subgroup
    specifically. Recorded as LIFETIME_PREVALENCE rather than ANNUAL_INCIDENCE:
    the source reports a cumulative proportion affected by age 16, not a rate of
    new cases per year, and reading it as an annual rate would overstate DEE
    occurrence by roughly an order of magnitude.
  evidence:
  - reference: PMID:36581463
    reference_title: Epidemiology of Developmental and Epileptic Encephalopathy and of Intellectual Disability and Epilepsy in Children.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cumulative incidence for DEE was 169/100,000 children (95% CI
      144-199)
    explanation: >-
      Reports cumulative incidence of DEE. Marked PARTIAL because the measure
      covers DEE of all etiologies, not only genetic DEE.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Genetic DEE is most commonly regarded as a de novo dominant disease class,
    and the highest-prevalence individual entities (SCN1A, SCN2A, STXBP1,
    KCNQ2, SCN8A) are indeed de novo autosomal dominant, so affected children
    typically have unaffected parents. Parental germline mosaicism gives a small
    but non-zero sibling recurrence risk. Note that this reflects the
    distribution of *cases*: counted by *gene*, more DEE genes follow autosomal
    recessive than dominant inheritance.
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic DEEs are most commonly regarded as de novo  dominant disorders ;
      however, more DEE genes follow autosomal recessive than dominant
      inheritance, with a small number
      following X-linked or mitochondrial inheritance patterns
    explanation: >-
      Establishes de novo dominant inheritance as the prevailing mode while
      making explicit the gene-count versus case-count distinction that this
      description records.
  - reference: PMID:39613335
    reference_title: National survey on the prevalence of single-gene aetiologies for genetic developmental and epileptic encephalopathies in Italy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic or likely pathogenic variants in genes with an autosomal
      dominant inheritance pattern occurred in 77% (n=1207) patients; 17%
      (n=271) in X-linked genes and 6% (n=90) in genes with autosomal recessive
      inheritance.
    explanation: >-
      Quantifies the case-level distribution of inheritance modes across 1568
      molecularly diagnosed genetic DEE patients, confirming autosomal dominant
      as the predominant mode by case count.
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parental mosaicism places parents at an
      increased risk of having a second child with a DEE, as a small population
      of their sperm or ova carry the
      pathogenic variant.
    explanation: >-
      Supports the non-zero sibling recurrence risk stated in this description,
      which would otherwise be an uncited claim.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Counted by gene rather than by case, more DEE genes follow autosomal
    recessive than dominant inheritance. Biallelic forms are individually rarer
    but collectively numerous, and are enriched in consanguineous families and
    among metabolic and glycosylation-pathway DEE genes.
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more DEE genes follow autosomal recessive than dominant inheritance
    explanation: >-
      Directly supports autosomal recessive inheritance as the most common mode
      when DEE genes are counted individually.
  - reference: PMID:39613335
    reference_title: National survey on the prevalence of single-gene aetiologies for genetic developmental and epileptic encephalopathies in Italy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      6%
      (n=90) in genes with autosomal recessive inheritance.
    explanation: >-
      Quantifies the autosomal recessive share of molecularly diagnosed genetic
      DEE cases, contrasting with its larger share of the gene count.
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    A small number of genetic DEE genes are X-linked, including CDKL5, PCDH19,
    and ARX, together accounting for 17% of molecularly diagnosed cases.
    X-linked disease and mosaicism complicate cellular targeting for emerging
    gene therapies. PCDH19 departs from the usual X-linked pattern in that
    heterozygous females are affected while hemizygous males are typically
    unaffected transmitting carriers; that observation is recorded in the
    PCDH19 genetic entry, while its mechanistic explanation (cellular
    interference) is left to the PCDH19 Clustering Epilepsy child entry, since
    no source cached here states it.
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with a small number
      following X-linked or mitochondrial inheritance patterns
    explanation: >-
      Establishes X-linked inheritance as a recognized but numerically minor
      mode among DEE genes.
  - reference: PMID:39613335
    reference_title: National survey on the prevalence of single-gene aetiologies for genetic developmental and epileptic encephalopathies in Italy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      17%
      (n=271) in X-linked genes
    explanation: >-
      Quantifies the X-linked share of molecularly diagnosed genetic DEE cases.
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mosaicism and X-linked disorders further complicate cellular targeting.
    explanation: >-
      Supports the therapeutic-targeting caveat noted for X-linked genetic DEE.
pathophysiology:
- name: Genetic Lesion in an Ion Channel or Synaptic Gene
  biological_scale: MOLECULAR
  description: >-
    A de novo or inherited pathogenic variant in one of a large and growing
    set of genes encoding voltage-gated ion channels (e.g. SCN1A, SCN2A,
    SCN8A, KCNQ2, KCNA2, KCNT1, CACNA1E, HCN1), presynaptic vesicle-cycle
    and neurotransmitter-release machinery (STXBP1, DNM1, SNAP25, CPLX1,
    UNC13A), postsynaptic glutamate or GABA receptors (GRIN1, GRIN2A,
    GRIN2B, GABRA1, GABRB3), or chromatin/transcriptional regulators active
    in neurodevelopment (CDKL5, FOXG1, CHD2) disrupts normal neuronal
    excitability or synaptic signaling.
  molecular_functions:
  - preferred_term: ion channel activity
    term:
      id: GO:0005216
      label: monoatomic ion channel activity
  evidence:
  - reference: PMID:39237642
    reference_title: Developmental and epileptic encephalopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      900 genes have been identified as monogenic causes of DEEs and many cell
      components and processes
    explanation: >-
      Establishes the extreme monogenic heterogeneity of the DEE umbrella, the
      defining upstream trigger of this entry.
  - reference: PMID:35951482
    reference_title: 'Developmental and epileptic encephalopathies: from genetic heterogeneity to phenotypic continuum.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic DEEs have been associated with mutations in many genes involved in
      different functions including cell migration, proliferation, and
      organization, neuronal excitability, and synapse transmission and
      plasticity.
    explanation: >-
      Enumerates the functional gene classes affected, matching the ion-channel,
      synaptic, and neurodevelopmental categories described in this node.
  downstream:
  - target: Neuronal Excitation-Inhibition Imbalance
    description: >-
      The gene-level lesion alters neuronal excitability or synaptic signalling,
      shifting the excitation-inhibition balance of the network.
    evidence:
    - reference: PMID:35951482
      reference_title: 'Developmental and epileptic encephalopathies: from genetic heterogeneity to phenotypic continuum.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Genetic DEEs have been associated with mutations in many genes involved
        in different functions including cell migration, proliferation, and
        organization, neuronal excitability, and synapse transmission and
        plasticity.
      explanation: >-
        Connects the causal genes to neuronal excitability and synaptic
        transmission, the substrate of excitation-inhibition balance.
- name: Neuronal Excitation-Inhibition Imbalance
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    Depending on the specific gene and variant, the molecular lesion produces
    either a gain- or loss-of-function shift in neuronal excitability (e.g.
    gain-of-function SCN2A/SCN8A sodium-channel variants causing neuronal
    hyperexcitability versus loss-of-function SCN1A variants preferentially
    impairing GABAergic interneuron firing), converging on a common circuit-level
    disruption of the balance between excitatory and inhibitory synaptic drive.
  cell_types:
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA Signaling Pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:39858526
    reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many genes mutated in DEEs encode ion channels, causing current conduction
      disruptions known as channelopathies.
    explanation: >-
      Supports the channelopathy arm in which the genetic lesion alters neuronal
      excitability, the proximate cause of excitation-inhibition imbalance.
  downstream:
  - target: Hypersynchronous Network Activity and Seizures
    description: >-
      Excitation-inhibition imbalance drives the seizure arm of the DEE
      mechanism.
    evidence:
    - reference: PMID:39858526
      reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Many genes mutated in DEEs encode ion channels, causing current
        conduction disruptions known as channelopathies.
      explanation: >-
        Links the channel-level conduction disruption to the epileptic output of
        the disease.
  - target: Impaired Synaptic Maturation and Neurodevelopment
    description: >-
      The same molecular lesion independently disrupts circuit maturation,
      producing the developmental arm.
    evidence:
    - reference: PMID:39858526
      reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These two aspects
        influence one another but can develop independently, creating diagnostic
        and therapeutic challenges.
      explanation: >-
        Supports branching the mechanism into two arms that can develop
        independently of one another.
- name: Hypersynchronous Network Activity and Seizures
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Excitation-inhibition imbalance produces hypersynchronous, epileptiform
    cortical network activity, manifesting clinically as frequent,
    often multiple, drug-resistant seizure types with an abnormal
    interictal EEG background.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Action Potential
    term:
      id: GO:0001508
      label: action potential
    modifier: INCREASED
  evidence:
  - reference: PMID:40013914
    reference_title: Operational definition of developmental and epileptic encephalopathies to underpin the design of therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental and epileptic encephalopathies (DEEs) are the most severe
      group of epilepsies, characterized by drug-resistant seizures and
      developmental slowing or regression.
    explanation: >-
      The ILAE operational definition identifies drug-resistant seizures as a
      defining clinical output of the DEE network mechanism.
  downstream:
  - target: Epileptic Encephalopathy Component
    description: >-
      Ongoing seizures and epileptiform activity themselves degrade cognitive
      and behavioural function.
    evidence:
    - reference: PMID:35951482
      reference_title: 'Developmental and epileptic encephalopathies: from genetic heterogeneity to phenotypic continuum.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        on a background of developmental impairment that tends to worsen as a
        consequence of epilepsy
      explanation: >-
        States that the epilepsy itself worsens developmental impairment, the
        defining claim of this causal edge.
- name: Impaired Synaptic Maturation and Neurodevelopment
  biological_scale: TISSUE
  description: >-
    Independent of seizure activity, the same channel or synaptic-gene
    defect disrupts activity-dependent synaptic pruning, circuit
    maturation, and neuronal migration/connectivity during critical
    developmental windows, producing a developmental encephalopathy
    component that is not fully reversible by seizure control alone.
  evidence:
  - reference: PMID:39858526
    reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      many other mechanisms have been identified: impaired neurogenesis,
      metabolic disorders, disruption of dendrite and axon growth, maintenance
      and synapse formation abnormalities -synaptopathies.
    explanation: >-
      Documents the non-channelopathy, neurodevelopmental mechanisms that
      constitute this seizure-independent arm of the DEE mechanism.
  downstream:
  - target: Developmental Encephalopathy Component
    description: >-
      Disrupted circuit maturation yields developmental delay and intellectual
      disability independently of seizure burden.
    evidence:
    - reference: PMID:39858526
      reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        many other mechanisms have been identified: impaired neurogenesis,
        metabolic disorders, disruption of dendrite and axon growth, maintenance
        and synapse formation abnormalities -synaptopathies.
      explanation: >-
        Identifies the neurodevelopmental mechanisms that generate the
        developmental encephalopathy component.
- name: Epileptic Encephalopathy Component
  biological_scale: ORGANISM
  description: >-
    Frequent seizures and ongoing epileptiform discharges themselves
    contribute to cognitive slowing, developmental regression, and
    behavioral disturbance, over and above the effect of the underlying
    genetic lesion. This component can partially improve with effective
    seizure control.
  evidence:
  - reference: PMID:35951482
    reference_title: 'Developmental and epileptic encephalopathies: from genetic heterogeneity to phenotypic continuum.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      on a background of developmental impairment that tends to worsen as a
      consequence of epilepsy
    explanation: >-
      States the epileptic-encephalopathy component explicitly: the epilepsy
      itself worsens developmental impairment.
  - reference: PMID:28276062
    reference_title: 'ILAE classification of the epilepsies: Position paper of the ILAE Commission for Classification and Terminology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      New terminology is introduced such as developmental and epileptic
      encephalopathy.
    explanation: >-
      The 2017 ILAE classification introduced the DEE term precisely to separate
      the epileptic from the developmental contribution to the encephalopathy.
- name: Developmental Encephalopathy Component
  biological_scale: ORGANISM
  description: >-
    Developmental delay, intellectual disability, and often autistic
    features that arise directly from the genetic etiology's disruption of
    neurodevelopment, and that may be present even before seizure onset or
    persist despite adequate seizure control.
  evidence:
  - reference: PMID:39858526
    reference_title: 'Developmental and Epileptic Encephalopathy: Pathogenesis of Intellectual Disability Beyond Channelopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      What sets DEEs apart is their complex interplay of epilepsy and
      developmental delay, often driven by genetic factors. These two aspects
      influence one another but can develop independently, creating diagnostic
      and therapeutic challenges.
    explanation: >-
      Directly supports modeling the developmental component as a separate arm
      that can arise independently of the seizure burden - the conceptual basis
      for splitting these two nodes.

- accession: geo:GSE256142
  title: 'Variability vs. phenotype: Multimodal analysis of Dravet syndrome brain organoids powered by deep learning'
  description: Dravet Syndrome (DS) is a developmental epileptic encephalopathy (DEE) driven by pathogenic variants in SCN1A gene. Brain organoids (BO) have emerged as reliable models for neurodevelopmental genetic disorders, reproducing human brain developmental milestones and rising as a promising drug testing tool. Here, we determined the underlying molecular DS pathophysiology affecting neuronal connectivity, revealing an early onset excitatory-inhibitory imbalance in maturing DS organoids circuitry. However, neuronal circuitry modeling in BO remains hampered by the notorious inter- and intra-organoid variability.

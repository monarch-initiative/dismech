    protein. De novo heterozygous gain-of-function variants increase ER stress signalling and stress-induced
    apoptosis, causing congenital microcephaly with infantile epileptic encephalopathy and blindness.
  evidence:
  - reference: PMID:30595371
    reference_title: Heterozygous RNF13 Gain-of-Function Variants Are Associated with Congenital Microcephaly,
      Epileptic Encephalopathy, Blindness, and Failure to Thrive.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These results indicate that the RNF13 variants confer gain of function to the encoded
      protein and thereby lead to altered signaling of the ER stress response associated with severe
      neurodegeneration in infancy.
    explanation: States the gain-of-function ER-stress mechanism by which the RNF13 lesion acts.
- name: PARS2
  gene_term:
    preferred_term: PARS2
    term:
      id: hgnc:30563
      label: PARS2
  relationship_type: CAUSATIVE
  subtype: DEE75
  notes: Prolyl-tRNA synthetase 2, a member of the mitochondrial aminoacyl-tRNA synthetase family
    that the cited report describes as critical to protein biosynthesis. Biallelic variants cause
    an infantile-onset encephalopathy with epileptic spasms, postnatal microcephaly, elevated lactate
    and progressive cerebral atrophy.
  evidence:
  - reference: PMID:29915213
    reference_title: The genotypic and phenotypic spectrum of PARS2-related infantile-onset encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study provides further evidence for validating the role of PARS2 in the pathology
      of related infantile-onset encephalopathy, contributing to the phenotypic features of this condition,
      and providing clinical and molecular insight for the diagnosis of this disease entity.
    explanation: Establishes PARS2 as causal for infantile-onset encephalopathy, in the report that
      widened its phenotype.
- name: ACTL6B
  gene_term:
    preferred_term: ACTL6B
    term:
      id: hgnc:160
      label: ACTL6B
  relationship_type: CAUSATIVE
  subtype: DEE76
  notes: HGNC names this gene actin like 6B; the cited report describes it as a subunit of the neuron-specific
    nBAF chromatin remodelling complex. Biallelic variants cause early-onset severe DEE with brain
    hypomyelination and cerebellar atrophy.
  evidence:
  - reference: PMID:30656450
    reference_title: Mutations in ACTL6B, coding for a subunit of the neuron-specific chromatin remodeling
      complex nBAF, cause early onset severe developmental and epileptic encephalopathy with brain
      hypomyelination and cerebellar atrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we provide additional genetic and clinical data on three new cases that support
      the pathogenic role of ACTL6B gene mutation in a syndromic form of DEE.
    explanation: Establishes ACTL6B as causal for a syndromic DEE.
- name: FGF13
  gene_term:
    preferred_term: FGF13
    term:
      id: hgnc:3670
      label: FGF13
  relationship_type: CAUSATIVE
  subtype: DEE90
  notes: Fibroblast growth factor homologous factor 2 (FHF2), whose FHF2A isoform the cited report

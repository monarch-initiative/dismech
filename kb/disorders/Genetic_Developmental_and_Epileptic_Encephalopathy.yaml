notes: >-
  Two MONDO classes that are direct children of this entry's disease_term are
  deliberately given no has_subtypes row. MONDO:0100079 (developmental and
  epileptic encephalopathy, 6A) asserts RO:0004003 HGNC:10585 SCN1A and is
  linked to MONDO:0100135 (Dravet syndrome) by
  mondo#disease_shares_features_of; dismech curates the SCN1A developmental and
  epileptic encephalopathy phenotype as the separate Dravet_syndrome entry,
  which is bound to MONDO:0100135, and SCN1A is carried in this entry's genetic
  section and wired to the pathograph, so a subtype row for MONDO:0100079 would
  duplicate an existing entry rather than record anything new. Whether those two
  MONDO classes describe one concept and should be merged is a question for
  MONDO rather than one this entry should settle. MONDO:0032880 (developmental
  and epileptic encephalopathy, 82, GOT2) already has its own dismech entry,
  Developmental_And_Epileptic_Encephalopathy_82, and likewise gets no subtype
  row here.

  PCDH19 is the one gene in the genetic section that is not wired to a
  pathophysiology node. Its record notes that the female-restricted mechanism is
  curated on the PCDH19 clustering epilepsy child entry, and no reference cited
  in this entry characterises the protein's function, so a node assignment here
  would not be sourced.

  GeneReviews baseline: just check-genereviews matches this entry against
  NBK582335, "GRIN2D-Related Developmental and Epileptic Encephalopathy"
  (PMID:35914066), through this entry's synonym "developmental and epileptic
  encephalopathy". That chapter is about GRIN2D and is not this umbrella's
  chapter. Searching the committed Bookshelf index
  (cache/bookshelf/genereviews.csv, snapshot 2026-09-10) case-insensitively for
  "epileptic encephalopath" returns that one chapter and no other, so
  GeneReviews has no chapter for the DEE umbrella itself; its DEE coverage is
  per-gene, and the gene-specific chapters belong on the child entries.

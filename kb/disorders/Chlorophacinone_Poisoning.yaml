  notes: >-
    Proteins C and S are listed as substrates of the same carboxylase and are
    lost alongside the procoagulant factors. Their loss is the accepted
    explanation offered for the paradoxical thrombotic events reported in this
    class of poisoning, but no cited reference here demonstrates that
    mechanism, so it is recorded as a hypothesis in `discussions` rather than
    as a curated causal edge.
  evidence:
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Anticoagulant rodenticides inhibit vitamin K(1)-2,3 epoxide reductase and thus the synthesis of vitamin K and subsequently clotting factors II, VII, IX and X."
    explanation: >-
      Identifies factors II, VII, IX and X as the affected proteins. Marked indirect
      because the abstract does not itself use the term gamma-carboxylation.
  downstream:
  - target: Functional Deficiency of Coagulation Factors II, VII, IX and X
    causal_link_type: DIRECT
    description: >-
      Under-carboxylated factors are secreted but cannot assemble on
      membranes, so measured factor activity falls.
    evidence:
    - reference: PMID:3222685
      reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
      supports: SUPPORT

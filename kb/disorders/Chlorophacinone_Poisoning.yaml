pathophysiology:
- name: Systemic Chlorophacinone Exposure
  biological_scale: ORGANISM
  description: >-
    Chlorophacinone enters the body by ingestion of bait or concentrate.
    Inhalational and transcutaneous routes are documented for the
    anticoagulant rodenticides as a class; the cited source does not attribute
    either specifically to chlorophacinone. Ingested doses reported in human
    cases span roughly 100 mg to nearly 2 g, and plasma concentrations after a
    large deliberate ingestion reach the tens of mg/L.
  chemical_entities:
  - preferred_term: chlorophacinone
    term:
      id: CHEBI:81796
      label: Chlorophacinone
  evidence:

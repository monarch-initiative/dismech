      chlorophacinone poisoning.
  downstream:
  - target: Multicompartment Hemorrhage
    causal_link_type: DIRECT
    description: >-
      With thrombin generation crippled, haemostatic plugs cannot be
      stabilized, so bleeding occurs at mucosal surfaces, into soft tissue and
      into any internal organ.
    evidence:
    - reference: PMID:16499407
      reference_title: "Anticoagulant rodenticides."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Substantial ingestion produces epistaxis, gingival bleeding, widespread bruising, haematomas, haematuria with flank pain, menorrhagia, gastrointestinal bleeding, rectal bleeding and haemorrhage into any internal organ; anaemia may result."
      explanation: >-
        Enumerates the bleeding manifestations that follow substantial
        anticoagulant rodenticide ingestion.

  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "If active bleeding occurs, prothrombin complex concentrate (which contains factors II, VII, IX and X) 50 units/kg, or recombinant activated factor VII 1.2-4.8 mg or fresh frozen plasma 15 mL/kg (if no concentrate is available) and phytomenadione 10mg intravenously (100 microg/kg bodyweight for a child) should be given."
    explanation: >-
      Replacing exactly factors II, VII, IX and X is the recommended
      haemostatic response, which corroborates that those four are the
      deficient proteins. Marked indirect because this is a therapeutic
      recommendation, not a direct measurement of factor levels.
  downstream:
  - target: Prolonged Coagulopathy
    causal_link_type: DIRECT
    description: >-
      Loss of the four factors disables both the extrinsic and the common
      coagulation pathway, giving a global clotting defect.
    evidence:
    - reference: PMID:40974629
      reference_title: "A retrospective analysis of 88 anticoagulant rodenticide poisoning cases: Characteristics and forensic implications."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Coagulation function tests revealed average values of aPTT, PT, and INR of aPTT: 110 (3.71 ∼ 212) s, PT: 100 (11.6 ∼ 300) s and INR: 9 (0.98 ∼ 38.2), respectively, all significantly exceeding normal ranges."
      explanation: >-
        Both PT and aPTT are grossly prolonged, which is the expected pattern
        when the shared factors of the extrinsic and common pathways are lost.
        Marked indirect because the case series covers anticoagulant
        rodenticides collectively and reports no chlorophacinone stratum.
- name: Hepatic Accumulation and Prolonged Elimination
  biological_scale: ORGANISM
  description: >-
    Chlorophacinone is lipid-soluble, accumulates in liver and undergoes
    enterohepatic recirculation, so its biological half-life is long and grows
    longer with larger ingested doses. This is the property that separates the
    long-acting rodenticides from warfarin clinically, and it is what makes
    the coagulopathy last weeks rather than days. Chlorophacinone is
    nevertheless shorter-acting than the second-generation compounds: the
    class treatment durations reported in reviews are driven by brodifacoum
    and should not be read as a chlorophacinone expectation.
  notes: >-
    Because enterohepatic recirculation is part of what sustains this node,
    interrupting it is a plausible therapeutic target. A bile sequestrant,
    cholestyramine, cut mortality from 67 per cent to 11 per cent in a rabbit
    model of brodifacoum poisoning (PMID:29897553). That is a different
    compound in a different species, and no chlorophacinone data exist, so no
    treatment is curated from it. Recorded because the node names the mechanism
    the intervention would act on.
  chemical_entities:
  - preferred_term: chlorophacinone
    term:
      id: CHEBI:81796
      label: Chlorophacinone
  evidence:
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The greater potency and duration of action of long-acting anticoagulant rodenticides is attributed to their: (i) greater affinity for vitamin K(1)-2,3-epoxide reductase; (ii) ability to disrupt the vitamin K(1)-epoxide cycle at more than one point; (iii) hepatic accumulation; and (iv) unusually long biological half-lives due to high lipid solubility and enterohepatic circulation."
    explanation: >-
      Names hepatic accumulation, lipid solubility and enterohepatic
      circulation as the basis for the prolonged action of the long-acting
      group, to which the same review assigns chlorophacinone. Marked indirect
      because the sentence is about the class. Only clauses (iii) and (iv),
      hepatic accumulation and long biological half-life, are curated on this
      node. Clauses (i) and (ii), greater VKOR affinity and disruption of the
      cycle at more than one point, are deliberately not carried over: this
      entry also records that rodent-efficacy sources call chlorophacinone
      first-generation, which is a statement about lower potency, so a
      class-level affinity claim cannot be asserted for it here.
  - reference: PMID:2769823
    reference_title: "Chlorophacinone intoxication. A biological and toxicological study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The determination of half-lives was investigated and the results indicate that the greater the quantity absorbed, the longer the half-life."
    explanation: >-
      Measures chlorophacinone half-life in three human poisonings and shows
      it lengthens with dose, the kinetic behaviour of a saturable
      accumulating compartment.
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chlorophacinone accumulation in target cells or existence of an unidentified metabolite may explain persistence of the hypocoagulability syndrome at low plasmatic concentrations of chlorophacinone."
    explanation: >-
      Observes that the coagulopathy outlasts measurable plasma
      chlorophacinone. Marked indirect because the authors offer tissue accumulation
      as one of two candidate explanations rather than demonstrating it.
  downstream:
  - target: Prolonged Coagulopathy
    causal_link_type: DIRECT
    description: >-
      Because drug persists in liver after plasma levels fall, inhibition of
      the vitamin K cycle continues and the coagulopathy rebounds whenever
      vitamin K replacement stops.
    evidence:
    - reference: PMID:26239439
      reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Long-acting anticoagulant rodenticides have an extremely high affinity for VKOR compared with warfarin, characterized by rebound coagulopathy and bleeding after initial treatment and the need for high-dose, long-term therapy with vitamin K1."
      explanation: >-
        Links the persistent drug-target interaction to rebound coagulopathy
        and to the need for prolonged vitamin K1. Marked indirect because the
        review speaks for the class and does not report a chlorophacinone
        stratum.
- name: Prolonged Coagulopathy
  biological_scale: ORGANISM
  description: >-
    The clotting defect is global, severe and long-lived. Prothrombin time,
    INR and activated partial thromboplastin time are grossly prolonged, often
    beyond the measurable range of the assay, and normalization can take weeks
    to months after a single large ingestion.
  biological_processes:

    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive testing for abused and therapeutic drugs in blood confirmed chlorophacinone (maximum plasma level: 27.6 mg/L), an antivitamin K (AVK) rodenticide."
    explanation: >-
      Documents measured systemic chlorophacinone exposure in a human
      poisoning and identifies the compound as a vitamin K antagonist.
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 33-year-old man was admitted 8 hours after voluntary ingestion of 1875 mg of chlorophacinone (C'Operat 750 mL)."
    explanation: >-
      Gives the ingested dose in a deliberate human chlorophacinone poisoning.
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhalational, transcutaneous, and oral routes of exposure have been documented."
    explanation: >-
      Establishes the routes of exposure for the long-acting anticoagulant
      rodenticide class. Marked indirect because the review reports routes for
      the class as a whole and does not attribute each route to
      chlorophacinone specifically.
  downstream:
  - target: Vitamin K Epoxide Reductase Inhibition
    causal_link_type: DIRECT
    description: >-
      Absorbed chlorophacinone reaches the hepatocyte endoplasmic reticulum
      and binds the vitamin K epoxide reductase complex.
    evidence:
    - reference: PMID:16499407
      reference_title: "Anticoagulant rodenticides."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Anticoagulant rodenticides inhibit vitamin K(1)-2,3 epoxide reductase and thus the synthesis of vitamin K and subsequently clotting factors II, VII, IX and X."
      explanation: >-
        States the pharmacological target of the anticoagulant rodenticides,
        the class to which the same review assigns chlorophacinone. Tagged
        OTHER because the sentence is a pharmacological assertion in a
        narrative review rather than a reported study result.
  - target: Hepatic Accumulation and Prolonged Elimination
    causal_link_type: DIRECT
    description: >-
      The absorbed compound partitions into liver, where it is retained far
      longer than plasma concentrations alone would suggest.
    evidence:
    - reference: PMID:2769823
      reference_title: "Chlorophacinone intoxication. A biological and toxicological study."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The determination of half-lives was investigated and the results indicate that the greater the quantity absorbed, the longer the half-life."
      explanation: >-
        Links the absorbed chlorophacinone burden to the duration of its own
        elimination in human poisoning cases.
- name: Vitamin K Epoxide Reductase Inhibition
  biological_scale: MOLECULAR
  description: >-
    Chlorophacinone inhibits the vitamin K 2,3-epoxide reductase complex
    (VKORC1) in the hepatocyte endoplasmic reticulum. VKORC1 normally reduces
    vitamin K 2,3-epoxide back to vitamin K hydroquinone; blocking it halts
    the vitamin K cycle at the epoxide step.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: vitamin K epoxide reductase activity
    modifier: DECREASED
    term:
      id: GO:0047057
      label: vitamin-K-epoxide reductase (warfarin-sensitive) activity
  genes:
  - preferred_term: VKORC1
    term:
      id: hgnc:23663
      label: VKORC1
  evidence:
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Long-acting anticoagulant rodenticides (LAARs) inhibit vitamin K epoxide reductase (VKOR)."
    explanation: >-
      Names VKOR as the molecular target for the long-acting anticoagulant
      rodenticides. Marked indirect because the sentence is class-level and does not
      name chlorophacinone.
  - reference: PMID:35970209
    reference_title: "VKORC1 single nucleotide polymorphisms in rodents in Spain."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Computational analysis of binding predictions found out that the brown rat S149I mutation predicted a high reduction of the binding affinity of chlorophacinone and brodifacoum ARs"
    explanation: >-
      Chlorophacinone is modelled as a VKORC1 ligand whose binding is
      abolished by a VKORC1 active-site substitution, which is evidence that
      VKORC1 is its target. Marked indirect because the binding is predicted
      computationally, in rat VKORC1 rather than human.
  - reference: PMID:31857739
    reference_title: "Superwarfarin (Long-Acting Anticoagulant Rodenticides) Poisoning: from Pathophysiology to Laboratory-Guided Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The mechanism of action is by inhibition of vitamin K epoxide reductase, resulting in the inability of the body to recycle vitamin K."
    explanation: >-
      States epoxide reductase inhibition and the resulting failure to recycle
      vitamin K. Marked indirect because the review covers the long-acting
      rodenticides as a class. Note also that the review frames the class as
      warfarin derivatives, which chlorophacinone is not: it is an indanedione,
      so the review's structural reasoning about bulky aromatic sidechains does
      not carry over even though the enzyme target does.
  - reference: PMID:24781908
    reference_title: "[Rodenticide resistance and consequences]."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Polymorphisms in the vitamin K epoxide reductase complex subunit 1 (VKORC1) gene and respective substitutions of amino acids in the VKOR enzyme are the major cause for rodenticide resistance."
    explanation: >-
      Rodenticide resistance maps to VKORC1 coding changes, which is genetic
      corroboration that VKORC1 is the drug target. Marked indirect on two
      steps: the quoted sentence says "rodenticide" rather than naming
      chlorophacinone, and it concerns rodent resistance genetics rather than
      human poisoning.
  downstream:
  - target: Depletion of the Reduced Vitamin K Pool
    causal_link_type: DIRECT
    description: >-
      With the epoxide reductase blocked, vitamin K 2,3-epoxide accumulates
      and the hydroquinone pool available as carboxylase cofactor falls.
    evidence:
    - reference: PMID:16499407
      reference_title: "Anticoagulant rodenticides."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Anticoagulant rodenticides inhibit vitamin K(1)-2,3 epoxide reductase and thus the synthesis of vitamin K and subsequently clotting factors II, VII, IX and X."
      explanation: >-
        States that epoxide reductase inhibition curtails vitamin K supply,
        which is this edge.
- name: Depletion of the Reduced Vitamin K Pool
  biological_scale: MOLECULAR
  description: >-
    The hepatic pool of reduced vitamin K (hydroquinone) is depleted because
    the epoxide formed at each carboxylation cycle cannot be recycled. Dietary
    vitamin K intake alone does not replace it at the rate the cycle consumes
    it, which is why exogenous vitamin K1 in gram-scale cumulative doses is
    the antidote.
  biological_processes:
  - preferred_term: vitamin K metabolic process
    modifier: DECREASED
    term:
      id: GO:0042373
      label: vitamin K metabolic process
  chemical_entities:
  - preferred_term: phylloquinone
    term:
      id: CHEBI:18067
      label: phylloquinone
  evidence:
  - reference: PMID:3222685
    reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under high dose vitamin K therapy the Quick was rapidly corrected but fell again on each vitamin K withdrawal."
    explanation: >-
      Correction on exogenous vitamin K and relapse on its withdrawal is the
      clinical signature of a depleted, pharmacologically unreplenishable
      reduced vitamin K pool in a chlorophacinone-poisoned patient.
  downstream:
  - target: Impaired Gamma-Carboxylation of Vitamin K-Dependent Clotting Factors
    causal_link_type: DIRECT
    description: >-
      Gamma-glutamyl carboxylase requires vitamin K hydroquinone as cofactor,
      so the depleted pool limits carboxylation directly.
    evidence:
    - reference: PMID:16499407
      reference_title: "Anticoagulant rodenticides."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "Anticoagulant rodenticides inhibit vitamin K(1)-2,3 epoxide reductase and thus the synthesis of vitamin K and subsequently clotting factors II, VII, IX and X."
      explanation: >-
        The review couples loss of vitamin K to loss of the four factors.
        Marked indirect because the abstract states the consequence for the
        factors without naming gamma-carboxylation as the intervening step.
- name: Impaired Gamma-Carboxylation of Vitamin K-Dependent Clotting Factors
  biological_scale: CELLULAR
  description: >-
    Hepatic gamma-glutamyl carboxylase can no longer convert glutamate
    residues in the Gla domains of the vitamin K-dependent proteins to
    gamma-carboxyglutamate. The affected proteins are prothrombin (factor II)
    and factors VII, IX and X, together with the anticoagulant proteins C and
    S. Under-carboxylated Gla domains cannot chelate calcium and so cannot
    dock the factor onto anionic phospholipid membranes.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: peptidyl-glutamic acid carboxylation
    modifier: DECREASED
    term:
      id: GO:0017187
      label: peptidyl-glutamic acid carboxylation

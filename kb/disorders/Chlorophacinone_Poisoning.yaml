      evidence_source: HUMAN_CLINICAL
      snippet: "Prothrombin time (and vitamin K dependent factors VII and X) finally normalized only 7 weeks after chlorophacinone ingestion."
      explanation: >-
        Directly measures loss of vitamin K-dependent factor activity, and its
        recovery, in a chlorophacinone-poisoned patient.
- name: Functional Deficiency of Coagulation Factors II, VII, IX and X
  biological_scale: MOLECULAR
  description: >-
    Circulating activity of prothrombin and factors VII, IX and X falls.
    Because factor VII has the shortest half-life of the four, the prothrombin
    time and INR move first; the activated partial thromboplastin time follows
    as factors IX, X and II decline.
  notes: >-
    The order in which the four factors fall, and the resulting fact that the
    prothrombin time moves before the activated partial thromboplastin time,
    follows from their differing plasma half-lives. That is standard
    coagulation physiology and is not demonstrated in any source cited in this
    entry, which report the depressed factor activities without measuring the
    sequence. The ordering is stated because it explains the delayed onset and
    the assay pattern, not because a cited paper establishes it.

name: Chlorophacinone Poisoning
creation_date: "2026-09-03T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Rodenticide Poisoning
- Acquired Coagulopathy
synonyms:
- chlorophacinone intoxication
- indanedione anticoagulant rodenticide poisoning
description: >-
  Chlorophacinone poisoning is an acquired, vitamin K-antagonist coagulopathy
  caused by ingestion of, or other exposure to, the indanedione anticoagulant
  rodenticide chlorophacinone. Chlorophacinone inhibits vitamin K 2,3-epoxide
  reductase, so the reduced vitamin K needed as cofactor for hepatic
  gamma-carboxylation is not regenerated and the vitamin K-dependent
  coagulation factors II, VII, IX and X are secreted in an
  under-carboxylated, functionally inactive form. The resulting coagulopathy
  presents after a latent interval with mucocutaneous and internal bleeding
  and, because chlorophacinone accumulates in liver and is eliminated slowly,
  it can persist for weeks to months and rebound whenever vitamin K
  replacement is withdrawn.
notes: >-
  MONDO has no term for chlorophacinone poisoning, for indanedione or
  anticoagulant rodenticide poisoning, or for rodenticide poisoning generally.
  The entry therefore carries no primary disease_term; the only mapping
  recorded is a broad cross-reference to MONDO:0029000 (poisoning), which
  deliberately does not retire the concept from the MONDO curation queue. A
  request for a specific MONDO term is the right follow-up. PIVKA-II is the
  mechanistically specific marker of vitamin K antagonism and is not curated
  as a phenotype here, because no source cited in this entry reports PIVKA-II
  measurement in chlorophacinone poisoning. No datasets are curated: no
  transcriptomic, proteomic, metabolomic or perturbation dataset for
  chlorophacinone exposure was found, only residue chemistry in wildlife and
  livestock tissue, which measures the compound rather than any host response.
mappings:
  mondo_mappings:
  - term:

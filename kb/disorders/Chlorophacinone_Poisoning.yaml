      label: poisoning
    mapping_predicate: skos:broadMatch
    mapping_source: dismech
    mapping_justification: >-
      MONDO has no chlorophacinone-, indanedione-, or rodenticide-specific
      poisoning term. MONDO:0029000 is the nearest ancestor concept and is
      recorded as a broad cross-reference only.

  - reference: PMID:2769823
    reference_title: "Chlorophacinone intoxication. A biological and toxicological study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data collected in this study confirm the particularly prolonged anticoagulant effect of this compound and show that the knowledge of plasma concentrations may be very useful for clinicians"
    explanation: >-
      Confirms the prolonged anticoagulant effect from serial measurements in
      three human chlorophacinone intoxications.
  - reference: PMID:3222685
    reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her Quick time at admission was less than 10% (Prothrombin time 79 sec., normal control 12 sec.)."
    explanation: >-

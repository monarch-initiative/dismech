treatments:
- name: High-Dose Prolonged Vitamin K1 (Phytomenadione)
  description: >-
    Phytomenadione (vitamin K1) is the antidote. Supplying vitamin K from
    outside restores the carboxylase cofactor that the inhibited epoxide
    reductase can no longer regenerate, and the coagulation profile corrects
    within hours. Because chlorophacinone persists, the dose required is far
    above ordinary warfarin reversal doses and treatment must continue for
    weeks; withdrawal before the drug has cleared produces rebound
    coagulopathy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phylloquinone
      term:
        id: CHEBI:18067
        label: phylloquinone
  target_mechanisms:
  - target: Depletion of the Reduced Vitamin K Pool
    treatment_effect: RESTORES
    description: >-
      Exogenous vitamin K1 replenishes the substrate for the carboxylase
      cofactor pool without requiring the inhibited epoxide reductase.
    evidence:
    - reference: PMID:3222685
      reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Under high dose vitamin K therapy the Quick was rapidly corrected but fell again on each vitamin K withdrawal."
      explanation: >-
        Correction on vitamin K and relapse off it, in a chlorophacinone
        poisoning, is a direct demonstration that vitamin K supply is the
        limiting quantity this treatment restores.
  evidence:
  - reference: PMID:3222685
    reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case emphasizes the need for prolonged clinical and laboratory follow-up for rodenticide intoxications and for vitamin K administration for several weeks."
    explanation: >-
      States the duration of vitamin K therapy required after chlorophacinone
      poisoning.
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of acute hemorrhagic symptoms often required intravenous vitamin K1 in excess of 50 to 100 mg; chronic maintenance with 100 mg PO vitamin K1 daily was the most frequently used dose required to suppress coagulopathy."
    explanation: >-
      Gives the dose magnitude actually used across reported cases. Marked indirect
      because the doses are pooled across long-acting anticoagulant
      rodenticides rather than reported for chlorophacinone alone.
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment courses averaged 168 days."
    explanation: >-
      Quantifies treatment duration across the reviewed cases. Marked indirect
      for the same class-level reason, and the figure should not be read as a
      chlorophacinone expectation: the reviewed long-acting cases are dominated
      by brodifacoum, whose effect outlasts chlorophacinone's.
  - reference: PMID:31857739
    reference_title: "Superwarfarin (Long-Acting Anticoagulant Rodenticides) Poisoning: from Pathophysiology to Laboratory-Guided Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Treatment for superwarfarin poisoning includes rapid correction of factor deficiencies with either 4-factor prothrombin complex concentrate or fresh frozen plasma in patients with active bleeding, and high dose vitamin K therapy given multiple times per day for a prolonged period of weeks to months."
    explanation: >-
      Gives the dosing frequency and the duration of high-dose vitamin K.
      Marked indirect because the review speaks for the long-acting class.
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "If there is no active bleeding and the INR is < or =4.0, no treatment is required; if the INR is > or =4.0 phytomenadione 10mg should be administered intravenously."
    explanation: >-
      Gives the INR threshold at which vitamin K is started in a patient who
      is not bleeding, which is the decision this treatment turns on.
- name: Coagulation Factor Replacement
  description: >-
    For active bleeding, immediate replacement of the missing factors is given
    alongside vitamin K1, since vitamin K takes hours to restore carboxylation.
    Prothrombin complex concentrate is preferred because it contains exactly
    the four deficient factors; fresh frozen plasma is the fallback, and
    recombinant activated factor VII has also been used.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Functional Deficiency of Coagulation Factors II, VII, IX and X
    treatment_effect: BYPASSES
    description: >-
      Transfused factor concentrate supplies fully carboxylated factors
      directly, bypassing the blocked hepatic carboxylation step.
    evidence:
    - reference: PMID:16499407
      reference_title: "Anticoagulant rodenticides."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "If active bleeding occurs, prothrombin complex concentrate (which contains factors II, VII, IX and X) 50 units/kg, or recombinant activated factor VII 1.2-4.8 mg or fresh frozen plasma 15 mL/kg (if no concentrate is available) and phytomenadione 10mg intravenously (100 microg/kg bodyweight for a child) should be given."
      explanation: >-
        Specifies replacement of precisely the four deficient factors as the
        treatment for active bleeding.
  evidence:
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adjunctive hemostatic therapy with recombinant factor VIIa and prothrombin complex concentrate has been reported, and phenobarbital has been used to expedite LAAR metabolism."
    explanation: >-
      Confirms the adjunctive haemostatic agents used in practice. Marked indirect
      because the review pools long-acting anticoagulant rodenticides.
  - reference: PMID:31857739
    reference_title: "Superwarfarin (Long-Acting Anticoagulant Rodenticides) Poisoning: from Pathophysiology to Laboratory-Guided Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Treatment for superwarfarin poisoning includes rapid correction of factor deficiencies with either 4-factor prothrombin complex concentrate or fresh frozen plasma in patients with active bleeding"
    explanation: >-
      Names four-factor prothrombin complex concentrate ahead of fresh frozen
      plasma and confines factor replacement to patients who are bleeding.
      Marked indirect because the review speaks for the long-acting class.
  notes: >-
    Thrombotic complications accompanying haemostatic therapy have been
    reported in this class of poisoning, so factor replacement is reserved for
    active bleeding rather than used to correct a number. No therapeutic_agent
    is bound: the agents involved are prothrombin complex concentrate,
    recombinant activated factor VII and fresh frozen plasma, which are
    biological products rather than the small molecules the agent slot is
    reliably bound to, and no suitable term was resolved.
- name: Phenobarbital Enzyme Induction
  description: >-
    Phenobarbital has been used to accelerate hepatic metabolism of
    chlorophacinone and shorten the coagulopathy. In one human case the
    apparent elimination half-life under phenobarbital was 3.27 days, shorter
    than in previously reported cases. This is an adjunct with limited
    evidence, not standard care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
  target_mechanisms:
  - target: Hepatic Accumulation and Prolonged Elimination
    treatment_effect: INHIBITS
    description: >-
      Cytochrome P450 induction increases the rate at which chlorophacinone is
      cleared, shortening the period over which it can inhibit the vitamin K
      cycle.
    evidence:
    - reference: PMID:2769823
      reference_title: "Chlorophacinone intoxication. A biological and toxicological study."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "An increased elimination was noted when phenobarbital was administered."
      explanation: >-
        Reports increased chlorophacinone elimination on phenobarbital. The
        observation is from a single uncontrolled case within a three-patient
        series, so it is weak evidence for a directly stated result.
  evidence:
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under phenobarbital 200 mg/day, chlorophacinone exhibited an apparent elimination half-life (3.27 days) shorter than in previously reported cases."
    explanation: >-
      Quantifies the half-life observed under phenobarbital against a
      historical comparison. The comparison is with previously
      reported cases rather than a control arm, so the effect size is not
      established.
  notes: >-
    Recorded because it is the specific adjunct repeatedly tried in
    chlorophacinone poisoning, not because the evidence is strong. Both
    supporting reports are uncontrolled single-patient observations with
    historical comparators.
diagnosis:
- name: Delayed coagulation testing after exposure
  description: >-
    The coagulopathy is not present at the moment of exposure. Prothrombin
    time and INR should be measured 36 to 48 hours after exposure, because an
    earlier normal result does not exclude poisoning. In a case series the
    median latency to presentation was four days.
  evidence:
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "There are now sufficient data in young children exposed to anticoagulant rodenticides to conclude that routine measurement of the international normalised ratio (INR) is unnecessary."
    explanation: >-
      States that the small unintentional paediatric ingestions which dominate
      reported exposures do not need routine coagulation testing, the
      counterweight to the 36 to 48 hour rule above. Marked indirect because it
      is a recommendation for the class rather than a chlorophacinone finding.
  - reference: PMID:17357377
    reference_title: "Long-acting anticoagulant rodenticide poisoning: an evidence-based consensus guideline for out-of-hospital management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Patients with unintentional ingestion of less than 1 mg of LAAR active ingredient can be safely observed at home without laboratory monitoring."
    explanation: >-
      The consensus out-of-hospital guideline puts a dose threshold on that
      recommendation. Marked indirect because the guideline covers long-acting
      anticoagulant rodenticides collectively.
  - reference: PMID:17357377
    reference_title: "Long-acting anticoagulant rodenticide poisoning: an evidence-based consensus guideline for out-of-hospital management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Patients with unintentional ingestion of 1 mg or more of active ingredient and are asymptomatic should be evaluated for coagulopathy at 48-72 hours after exposure (Grade B)."
    explanation: >-
      Gives the graded recommendation and testing window above that threshold.
      Marked indirect for the same class-level reason.
  - reference: PMID:2729812
    reference_title: "[Prolonged hypocoagulability following the ingestion of anticoagulant raticides]."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The duration of the abnormalities is unpredictable; the prothrombin time should therefore be checked 48 hours after stopping Vitamin K therapy to detect any recurrence."
    explanation: >-
      Names the test that catches the rebound this entry models: a prothrombin
      time 48 hours after vitamin K is stopped. Marked indirect because the
      eleven-patient Paris series pools chlorophacinone with bromadiolone and
      warfarin.
  - reference: PMID:2729812
    reference_title: "[Prolonged hypocoagulability following the ingestion of anticoagulant raticides]."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of early clinical signs probably explains the number of late admissions."
    explanation: >-
      Attributes late presentation to the silent latent phase. Marked indirect
      because the series pools three anticoagulants.
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "In all other cases, the INR should be measured 36-48 hours post exposure."
    explanation: >-
      States the recommended timing of coagulation testing after exposure.
  - reference: PMID:40974629
    reference_title: "A retrospective analysis of 88 anticoagulant rodenticide poisoning cases: Characteristics and forensic implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median latency period was 4 days (range: 1 ∼ 30)."
    explanation: >-
      Quantifies the delay between exposure and clinical presentation.
      Marked indirect because the series pools anticoagulant rodenticides.
  notes: >-
    In young children with the small unintentional ingestions that dominate
    reported exposures, routine INR measurement is considered unnecessary.
- name: Suspicion on unexplained prothrombin time prolongation
  description: >-
    Where no exposure is reported, the poisoning is found by suspecting it.
    An unexplained prolonged prothrombin time is the trigger to send a
    rodenticide assay.
  evidence:
  - reference: PMID:31857739
    reference_title: "Superwarfarin (Long-Acting Anticoagulant Rodenticides) Poisoning: from Pathophysiology to Laboratory-Guided Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Superwarfarin poisoning should therefore be suspected in all patients with unexplained prolongation of prothrombin time, and can be confirmed by their detection in serum."
    explanation: >-
      States the diagnostic posture for this class of poisoning when the
      history is absent. Marked indirect because the review addresses the
      long-acting rodenticides collectively.
- name: Analytical confirmation of chlorophacinone
  description: >-
    Chlorophacinone is identified and quantified in plasma or serum by HPLC or
    LC-MS/MS. Analytical confirmation is what distinguishes chlorophacinone
    poisoning from the other anticoagulant rodenticides and from warfarin,
    since the coagulation profile alone cannot.
  evidence:
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "A simple HPLC procedure for the determination of chlorophacinone in human plasma is reported for that purpose."
    explanation: >-
      Describes the analytical method by which chlorophacinone is confirmed in
      human plasma.
  - reference: PMID:39893780
    reference_title: "Simultaneous quantification of eighteen therapeutic oral anticoagulants, rodenticides, and antiplatelet agents by LC-MS/MS and its application in post-mortem forensic cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "The method was validated according to the FDA recommendations for all compounds, with an eight-min run time in human whole blood, the gold standard in toxicological forensic investigation."
    explanation: >-
      Reports the validation result for a panel whose eighteen analytes
      include chlorophacinone, which is what allows the specific agent to be
      named rather than inferred. Marked indirect because performance is
      reported for all compounds together rather than for chlorophacinone
      alone.
progression:
- phase: Latent
  duration: 0 to 24 hours after exposure
  notes: >-
    Coagulation is still normal. Non-specific symptoms such as nausea may
    occur. A normal coagulation panel drawn in this window excludes nothing.
  evidence:
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The examination revealed excitation and nausea, with a normal prothrombin index (PI)."
    explanation: >-
      Eight hours after ingesting 1875 mg of chlorophacinone the prothrombin
      index was still normal, which fixes the latent phase.
- phase: Coagulopathy onset
  duration: about 1 to 4 days after exposure
  notes: >-
    Prothrombin time and INR rise as factor VII, the shortest-lived of the
    affected factors, is depleted. Bleeding may begin. The reported median
    latency to clinical presentation is four days.
  evidence:
  - reference: PMID:40974629
    reference_title: "A retrospective analysis of 88 anticoagulant rodenticide poisoning cases: Characteristics and forensic implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median latency period was 4 days (range: 1 ∼ 30)."
    explanation: >-
      Gives the interval from exposure to presentation. Marked indirect because
      the series pools anticoagulant rodenticides.
- phase: Resolution with rebound
  duration: weeks to months
  notes: >-
    Under vitamin K1 the coagulation profile corrects and relapses on each
    withdrawal. Full normalization took seven weeks in the reported case.
    Relapse here is the expected course, not a complication.
  evidence:
  - reference: PMID:3222685
    reference_title: "[Prolonged anticoagulation following chlorophacinone poisoning]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prothrombin time (and vitamin K dependent factors VII and X) finally normalized only 7 weeks after chlorophacinone ingestion."
    explanation: >-
      Fixes the duration of the resolution phase in a chlorophacinone
      poisoning.
epidemiology:
- name: Registered field use in France
  description: >-
    Chlorophacinone's share of human poisoning is small and country-dependent,
    because it tracks the compound's registration. In France it is one of only
    two anticoagulants registered for field use, so it appears there far more
    than in series from countries where the second-generation compounds
    dominate.
  evidence:
  - reference: PMID:21171851
    reference_title: "Prevalence of anticoagulant rodenticide poisoning in humans and animals in France and substances involved."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In wildlife, bromadiolone and chlorophacinone are by far the most important products, being the only ones registered for field use."
    explanation: >-
      States chlorophacinone's registration position in France, which is why
      the human case literature clusters there.
- name: Exposure circumstances and severity
  description: >-
    Reported anticoagulant rodenticide exposures are dominated by young
    children and are mostly accidental and clinically trivial. The severe cases
    come from deliberate adult ingestion.
  evidence:
  - reference: PMID:21171851
    reference_title: "Prevalence of anticoagulant rodenticide poisoning in humans and animals in France and substances involved."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the proportion of anticoagulant exposure reported to the Lyon poison control center appeared very limited and mostly occurred in young children, with no or very limited clinical severity."
    explanation: >-
      Characterizes the exposure population and its severity in the French
      poison-centre data. Marked indirect because the figures cover
      anticoagulant rodenticides collectively.
  - reference: PMID:21171851
    reference_title: "Prevalence of anticoagulant rodenticide poisoning in humans and animals in France and substances involved."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no report of mortality in the human data, and less than 1% of all exposure cases in domestic animals were fatal."
    explanation: >-
      Records the absence of deaths in four years of French human data, which
      is the counterweight to the severity of the published case reports.
      Marked indirect because agents are pooled.
- name: Reported burden in the United States
  description: >-
    United States poison-centre data for the long-acting anticoagulant
    rodenticides as a class give the order of magnitude of reported exposure.
    No chlorophacinone-specific incidence or prevalence figure exists.
  evidence:
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the United States, on average, there were 10413 exposures reported with 2750 patients treated annually."
    explanation: >-
      Gives annual reported exposures and treated patients. Marked indirect
      because the figure covers the long-acting class, not chlorophacinone.
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fortunately, only 2% of all exposures result in morbidity or mortality."
    explanation: >-
      Quantifies the proportion of reported exposures that matter clinically.
      Marked indirect for the same class-level reason.
  notes: >-
    These are reported exposures, not diagnosed cases of poisoning, and they
    cannot be separated by agent.
differential_diagnoses:
- name: Vitamin K-Dependent Coagulation Factor Deficiency
  disease_term:
    preferred_term: congenital vitamin K-dependent coagulation factors deficiency
    term:
      id: MONDO:0015722
      label: congenital vitamin K-dependent coagulation factors deficiency
  description: >-
    Biallelic germline variants in VKORC1 or GGCX produce the same combined
    deficiency of the vitamin K-dependent factors by disabling the same two
    steps that chlorophacinone blocks pharmacologically.
  distinguishing_features:
  - Germline VKORC1 or GGCX variants are present and the presentation is lifelong rather than following a single exposure.
  - No anticoagulant rodenticide is detectable on toxicological analysis.
  - Skeletal and other extra-haemostatic features of GGCX deficiency have no counterpart in an acute poisoning.
  notes: >-
    The genetic counterpart of the acquired lesion here, so an unexplained
    combined deficiency of the vitamin K-dependent factors should be worked up
    against both.
- name: Warfarin or other coumarin anticoagulant
  description: >-
    Therapeutic warfarin, warfarin overdose, and the other coumarin oral
    anticoagulants produce the same vitamin K antagonist coagulopathy through
    the same enzyme.
  distinguishing_features:
  - A drug history and a therapeutic indication are usually present.
  - Warfarin coagulopathy resolves within days of stopping the drug and responds to ordinary reversal doses of vitamin K, not to months of high-dose therapy.
  - Analytical confirmation separates the compounds.
  evidence:
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Long-acting anticoagulant rodenticides have an extremely high affinity for VKOR compared with warfarin, characterized by rebound coagulopathy and bleeding after initial treatment and the need for high-dose, long-term therapy with vitamin K1."
    explanation: >-
      Contrasts the rodenticide course with warfarin's, which is the
      distinguishing feature. Marked indirect because the review speaks for the
      long-acting class.
- name: Liver failure
  description: >-
    Hepatic synthetic failure also depresses the vitamin K-dependent factors
    and prolongs the prothrombin time.
  distinguishing_features:
  - Factor V is synthesized in the liver but is not vitamin K dependent, so it is reduced in liver failure and unaffected by a vitamin K antagonist. This factor V versus factor VII pattern is the standard discriminator; no source cited in this entry reports it, so it is recorded as clinical convention rather than curated as evidenced content.
  - Other markers of hepatic failure, such as bilirubin, albumin and transaminases, are deranged.
  - The coagulopathy of liver failure does not correct on high-dose vitamin K1 and does not rebound on its withdrawal.
- name: Disseminated intravascular coagulation
  description: >-
    Consumptive coagulopathy also prolongs the prothrombin time and causes
    multi-site bleeding.
  distinguishing_features:
  - Platelet count and fibrinogen are low and D-dimer is raised in disseminated intravascular coagulation; a vitamin K antagonist leaves the platelet count and fibrinogen untouched.
  - A precipitating illness such as sepsis, malignancy or obstetric catastrophe is present.
  - Recorded as clinical convention. No source cited in this entry reports these discriminating values.
- name: Other anticoagulant rodenticide poisoning
  description: >-
    Brodifacoum, bromadiolone, difenacoum, difethialone, flocoumafen and
    coumatetralyl produce a clinically indistinguishable coagulopathy through
    the same target. In pooled case series brodifacoum and bromadiolone are the
    agents most often identified.
  distinguishing_features:
  - Only analytical confirmation separates the agents; the coagulation profile does not.
  - The second-generation compounds persist far longer, so treatment courses run months rather than weeks.
  evidence:
  - reference: PMID:40974629
    reference_title: "A retrospective analysis of 88 anticoagulant rodenticide poisoning cases: Characteristics and forensic implications."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "About the types of rodenticides, a total of 38 cases reported 7 distinct types, with brodifacoum and bromadiolone being the most common"
    explanation: >-
      Establishes that several agents in this class present the same way and
      that the commonest identified are not chlorophacinone. Marked indirect
      because the sentence is about agent distribution rather than about
      distinguishing them clinically.
animal_models:
- name: Accidental chlorophacinone poisoning in calves
  species: Cattle
  genotype: wild type
  description: >-
    Fourteen crossbred calves ingested chlorophacinone powder present in their
    housing. Three were submitted for necropsy, with chlorophacinone confirmed
    in liver at 2.9 to 4.2 ppm. This is a naturally occurring, dose-uncontrolled
    veterinary poisoning rather than a designed experimental model, and it is
    recorded here because it couples a confirmed chlorophacinone tissue burden
    to a documented anatomical distribution of haemorrhage.
  publication: PMID:35000500
  evidence:
  - reference: PMID:35000500
    reference_title: "Acute hemorrhage and death in calves following chlorophacinone exposure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Three calves were submitted to the Iowa State University Veterinary Diagnostic Laboratory for diagnostic evaluation following an abrupt increase in morbidity and mortality in a calf herd associated with epistaxis and widespread hemorrhage."
    explanation: >-
      Establishes the exposure event and the animals examined, which is what
      this entry records as a naturally occurring chlorophacinone poisoning.
  modeled_mechanisms:
  - target: Multicompartment Hemorrhage
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the multicompartment haemorrhage of human chlorophacinone
      poisoning, with the same agent confirmed analytically in tissue.
    limitations: >-
      An uncontrolled accidental exposure in a ruminant, with no measured
      ingested dose, no coagulation assays reported, and no treatment arm.
      Bovine vitamin K handling and rumen microbial vitamin K synthesis differ
      from human, so the dose-response cannot be carried across.
    readouts:
    - name: Chlorophacinone concentration in liver
      target: Multicompartment Hemorrhage
      direction: INCREASED
      interpretation: >-
        Confirms that the haemorrhage occurred against a measured
        chlorophacinone tissue burden rather than a presumed exposure.
      evidence:
      - reference: PMID:35000500
        reference_title: "Acute hemorrhage and death in calves following chlorophacinone exposure."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "Significant concentrations of chlorophacinone were detected at 4.2, 3.6, and 2.9 ppm in liver."
        explanation: >-
          Reports the measured hepatic chlorophacinone concentrations.
    evidence:
    - reference: PMID:35000500
      reference_title: "Acute hemorrhage and death in calves following chlorophacinone exposure."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Acute hemorrhage and death occurred in fourteen 1.5-mo-old, crossbred calves following ingestion of the vitamin K antagonist chlorophacinone."
      explanation: >-
        Attributes acute haemorrhage and death to chlorophacinone ingestion,
        which is what makes this exposure informative for the haemorrhage node.
- name: Accidental chlorophacinone poisoning in lambs
  species: Sheep
  genotype: wild type
  description: >-
    Eleven lambs reached old bait placed between the wall studs of their
    housing through a hole in the plywood. Two were necropsied, with
    chlorophacinone confirmed in liver at 0.58 and 0.50 ppm. A second species
    with a confirmed chlorophacinone tissue burden, and the source of the
    tempo: these animals died within one to two hours of the first sign.
  publication: PMID:17037620
  evidence:
  - reference: PMID:17037620
    reference_title: "Chlorophacinone exposure causing an epizootic of acute fatal hemorrhage in lambs."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The anticoagulant chlorophacinone was detected in the livers at 0.58 ppm and 0.50 ppm (wet weight), respectively."
    explanation: >-
      Confirms chlorophacinone analytically in the affected animals, which is
      what makes this exposure informative rather than presumptive.
  modeled_mechanisms:
  - target: Multicompartment Hemorrhage
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces multicompartment haemorrhage with epistaxis as the presenting
      sign, in a second ruminant species and at liver concentrations roughly
      sixfold below the calf series.
    limitations: >-
      An uncontrolled accidental exposure with no measured ingested dose, no
      coagulation assays, and no treatment arm. The liver concentrations differ
      sixfold from the calf epizootic, and age, species and dose timing all
      differ, so no lethal threshold can be derived from the pair. The
      centrilobular hepatocellular necrosis reported at necropsy is most
      parsimoniously hypoxic in an exsanguinating animal and is deliberately
      not curated as chlorophacinone hepatotoxicity. Ovine vitamin K handling,
      including rumen microbial synthesis, differs from human.
    readouts:
    - name: Time from first clinical sign to death
      target: Multicompartment Hemorrhage
      direction: DECREASED
      interpretation: >-
        Records how fast the haemorrhagic phase can run once it declares
        itself in a heavily exposed animal.
      evidence:
      - reference: PMID:17037620
        reference_title: "Chlorophacinone exposure causing an epizootic of acute fatal hemorrhage in lambs."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "Affected animals died within 1-2 hours from the onset of clinical signs."
        explanation: >-
          Reports the interval measured in the affected lambs.
    evidence:
    - reference: PMID:17037620
      reference_title: "Chlorophacinone exposure causing an epizootic of acute fatal hemorrhage in lambs."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Eleven lambs, approximately 1-2 months of age, suddenly developed epistaxis, respiratory distress, and facial and cervical swelling."
      explanation: >-
        Documents the presenting haemorrhagic syndrome attributed to
        chlorophacinone in this epizootic.
discussions:
- discussion_id: protein_c_s_paradoxical_thrombosis
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does loss of gamma-carboxylation of the anticoagulant proteins C and S
    explain the thrombotic events reported in anticoagulant rodenticide
    poisoning?
  attaches_to:
  - "pathophysiology#Impaired Gamma-Carboxylation of Vitamin K-Dependent Clotting Factors"
  rationale: >-
    Proteins C and S are vitamin K-dependent substrates of the same hepatic
    carboxylase as factors II, VII, IX and X, so a vitamin K antagonist
    depletes anticoagulant and procoagulant proteins together. Thrombotic
    events, including a fatal cerebral vein thrombosis reported as a suspected
    chlorophacinone poisoning, occur in this class and are difficult to
    reconcile with pure anticoagulation. No cited source here measures protein
    C or protein S activity in a chlorophacinone poisoning, so the mechanism
    is left as an open question rather than curated as a causal edge.
  evidence:
  - reference: PMID:16716547
    reference_title: "Lethal paradoxical cerebral vein thrombosis due to suspicious anticoagulant rodenticide intoxication with chlorophacinone."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors report a case of suspicious chlorophacinone poisoning with a problematic diagnosis."
    explanation: >-
      Reports a fatal thrombotic event in a chlorophacinone poisoning. The
      paper's own wording is "suspicious" with a "problematic diagnosis", so
      it is cited here as a case that raises the question, not as a settled
      attribution.
  - reference: PMID:26239439
    reference_title: "Long-Acting Anticoagulant Rodenticide (Superwarfarin) Poisoning: A Review of Its Historical Development, Epidemiology, and Clinical Management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-acting anticoagulant rodenticide-induced paradoxical thrombosis and thrombotic complications accompanying hemostatic therapy have also been observed."
    explanation: >-
      Confirms paradoxical thrombosis is observed across the class and
      separates it from thrombosis caused by haemostatic therapy. Marked indirect
      because it reports the observation without testing a mechanism.
- discussion_id: persistence_after_plasma_clearance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does chlorophacinone-induced hypocoagulability persist after plasma
    chlorophacinone concentrations have fallen to low values?
  attaches_to:
  - "pathophysiology#Hepatic Accumulation and Prolonged Elimination"
  rationale: >-
    In a monitored human poisoning the hypocoagulability outlasted the
    measurable plasma concentration. The treating authors offered two
    candidate explanations, accumulation in target cells and an unidentified
    active metabolite, and distinguished neither. Which of the two operates
    determines whether plasma chlorophacinone concentration is a usable guide
    to stopping vitamin K therapy.
  proposed_experiments:
  - experiment_id: chlorophacinone_metabolite_vs_compartment
    name: Paired hepatic and plasma chlorophacinone measurement with metabolite profiling
    description: >-
      Measure chlorophacinone and its metabolites in plasma alongside INR
      through the resolution phase of human poisonings, with untargeted
      metabolite profiling, to determine whether a persisting parent compound
      compartment or an active metabolite accounts for the residual effect.
  evidence:
  - reference: PMID:23109180
    reference_title: "Bioaccumulation of chlorophacinone in strains of rats resistant to anticoagulants."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Extensive metabolism of chlorophacinone was also found, and was similar (in nature and proportion of metabolites) across strains (3 OH-metabolites identified)."
    explanation: >-
      Three hydroxy-metabolites of chlorophacinone have been identified in rat,
      so the metabolite arm of this question is not that no metabolite is known
      but that none has been shown active in humans. Marked indirect because
      the work is in rat.
  - reference: PMID:23109180
    reference_title: "Bioaccumulation of chlorophacinone in strains of rats resistant to anticoagulants."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Accumulation of chlorophacinone occurs from day 1 to day 4, and an equilibrium is reached, suggesting rapid elimination."
    explanation: >-
      Cuts against the tissue-accumulation arm: hepatic chlorophacinone reaches
      a plateau within four days in rat, which the authors read as rapid
      elimination rather than indefinite retention. Marked indirect because the
      work is in rat and because the human coagulopathy is what needs
      explaining.
  - reference: PMID:10216974
    reference_title: "Toxicological management of chlorophacinone poisoning."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chlorophacinone accumulation in target cells or existence of an unidentified metabolite may explain persistence of the hypocoagulability syndrome at low plasmatic concentrations of chlorophacinone."
    explanation: >-
      States the unresolved alternative explanations directly.
- discussion_id: first_generation_versus_long_acting
  kind: INTERPRETATION
  prompt: >-
    Should chlorophacinone be curated as a first-generation anticoagulant
    rodenticide or as a long-acting anticoagulant rodenticide?
  rationale: >-
    Two authoritative sources place chlorophacinone in opposite groups, and
    both are right on their own terms. Watt and colleagues group it with the
    long-acting rodenticides on human duration of effect. Esther and
    colleagues list it with warfarin and coumatetralyl as first-generation,
    which is a statement about rodent potency and the number of feeds needed
    to kill a rat. "Generation" is a rodent-efficacy term and "long-acting" is
    a human-toxicology term, so chlorophacinone is first-generation by potency
    and long-acting by duration. The distinction matters clinically, because
    the first-generation label wrongly implies a warfarin-length course of
    treatment. This entry curates the human-toxicology reading and records the
    conflict rather than resolving it silently.
  evidence:
  - reference: PMID:16499407
    reference_title: "Anticoagulant rodenticides."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "This group includes the second generation 4-hydroxycoumarins brodifacoum, bromadiolone, difenacoum, flocoumafen and the indanedione derivatives chlorophacinone and diphacinone."
    explanation: >-
      Places chlorophacinone in the long-acting anticoagulant rodenticide
      group.
  - reference: PMID:24781908
    reference_title: "[Rodenticide resistance and consequences]."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Anticoagulants of the first generation (warfarin, chlorophacinone, coumatetralyl) as well as bromadiolone and difenacoum are not an option for the control of resistant Norway rats."
    explanation: >-
      Places chlorophacinone in the first-generation group, in a
      rodent-control context.
- discussion_id: indandione_mitochondrial_uncoupling
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do indandione anticoagulants, chlorophacinone among them, uncouple
    oxidative phosphorylation, and does that contribute to human toxicity
    beyond the coagulopathy?
  attaches_to:
  - "pathophysiology#Systemic Chlorophacinone Exposure"
  rationale: >-
    Toxicology reference texts repeatedly describe the indandiones as
    uncouplers of oxidative phosphorylation, a property the 4-hydroxycoumarins
    are said to lack, and attribute cardiopulmonary and neurologic injury in
    laboratory rodents to it. The claim is not curated here because no primary
    source for it could be located: PubMed queries pairing chlorophacinone,
    and separately indandione, diphacinone and pindone, with uncoupling,
    mitochondria and oxidative phosphorylation returned no records. The gap is
    recorded rather than the claim, because a widely repeated mechanism with
    no retrievable primary citation is worth flagging. Note that
    chlorophacinone does have a documented off-target activity, FXR
    antagonism, cited below; the absent evidence is for uncoupling in
    particular, not for off-target action in general.
  proposed_experiments:
  - experiment_id: chlorophacinone_mitochondrial_respirometry
    name: Respirometry of isolated mitochondria exposed to chlorophacinone
    description: >-
      Measure oxygen consumption, membrane potential and ATP synthesis in
      isolated hepatic and cardiac mitochondria across a chlorophacinone
      concentration range spanning those reached in human poisoning, against a
      4-hydroxycoumarin comparator and a known uncoupler control, to establish
      whether the uncoupling property exists and at what concentration.
  evidence:
  - reference: PMID:27773686
    reference_title: "Differential modulation of FXR activity by chlorophacinone and ivermectin analogs."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Our results showed that chlorophacinone and ivermectin had distinct modes of action (MOA) in modulating FXR-coregulator interactions and compound selectivity against the four aforementioned functionally-relevant nuclear receptors."
    explanation: >-
      Chlorophacinone has a documented off-target activity, antagonism of the
      nuclear receptor FXR in a validated screen. It is cited here so this gap
      is not read as "chlorophacinone has no off-target activity"; what lacks a
      primary source is uncoupling specifically. Marked indirect because the
      assays are cell-based and the paper makes no claim about human poisoning.
  notes: >-
    The cited evidence item records a different off-target mechanism rather
    than the uncoupling claim itself. No source is offered for uncoupling,
    because that is the point of the entry: attaching a reference that does
    not make the claim would defeat it.
- discussion_id: cyp_induction_transferability
  kind: INTERPRETATION
  prompt: >-
    Does the published argument against using cytochrome P450 inducers in
    long-acting anticoagulant rodenticide poisoning apply to chlorophacinone?
  attaches_to:
  - "pathophysiology#Hepatic Accumulation and Prolonged Elimination"
  rationale: >-
    This entry curates phenobarbital enzyme induction as a reported adjunct.
    A published position argues against CYP inducers in this poisoning, but its
    reasoning is specific to brodifacoum, which the authors state does not
    undergo significant hepatic metabolism. Chlorophacinone does: three
    hydroxy-metabolites have been identified and metabolism is described as
    extensive in rat. The argument therefore does not obviously transfer, and
    the two chlorophacinone reports that used phenobarbital are uncontrolled
    single patients. Recorded as an open interpretation rather than settled
    either way, because the safety objection about sedating a bleeding patient
    stands regardless of the metabolism question.
  evidence:
  - reference: PMID:30689138
    reference_title: "Should Cytochrome P450 Inducers be Used to Accelerate Clearance of Brodifacoum from Poisoned Patients?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Therefore, we propose that CYP inducers should not be used to accelerate the clearance of brodifacoum from poisoned patients, but that alternative approaches such as reducing enterohepatic recirculation of brodifacoum, or using lipid emulsions to scavenge brodifacoum throughout the body, be considered."
    explanation: >-
      States the position being weighed, in full: the authors do not simply
      reject enzyme induction, they redirect to interrupting enterohepatic
      recirculation or scavenging the drug. Marked indirect because it is a
      proposal about brodifacoum, not chlorophacinone.
  - reference: PMID:30689138
    reference_title: "Should Cytochrome P450 Inducers be Used to Accelerate Clearance of Brodifacoum from Poisoned Patients?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "unlike warfarin, brodifacoum does not undergo significant metabolism in the liver, nor have the effects of phenobarbital on vitamin K1 metabolism been previously determined"
    explanation: >-
      Gives the premise on which that position rests, which is the premise that
      may not hold for chlorophacinone. Marked indirect for the same reason.
  - reference: PMID:23109180
    reference_title: "Bioaccumulation of chlorophacinone in strains of rats resistant to anticoagulants."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Extensive metabolism of chlorophacinone was also found, and was similar (in nature and proportion of metabolites) across strains (3 OH-metabolites identified)."
    explanation: >-
      Chlorophacinone, unlike brodifacoum, is extensively metabolised, which is
      why the argument may not transfer. Marked indirect because the work is in
      rat.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose a fifth, female-specific phenotype for MED12, and suggest that nonsense and frameshift loss-of-function MED12 variants in females cause HS."
    explanation: Establishes the female-specific Hardikar syndrome as a distinct MED12 loss-of-function phenotype.
- name: Female syndromic NDD
  display_name: MED12-related syndromic neurodevelopmental disorder in females
  classification: molecular
  description: >-
    A syndromic neurodevelopmental disorder in heterozygous females with de novo MED12 variants.
    Protein-truncating variants produce a severe syndromic phenotype (intellectual disability,
    facial dysmorphism, short stature, skeletal abnormalities, feeding difficulties); de novo
    missense variants produce a less specific but homogeneous phenotype with severe ID and
    autistic features.
  subtype_term:
    preferred_term: MED12-related syndromic neurodevelopmental disorder in females
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  inheritance:
  - name: X-linked Dominant
  evidence:
  - reference: PMID:33244165
    reference_title: "De novo variants in MED12 cause X-linked syndromic neurodevelopmental disorders in 18 females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Protein truncating variants were associated with a severe, syndromic phenotype consisting of intellectual disability (ID), facial dysmorphism, short stature, skeletal abnormalities, feeding difficulties, and variable other abnormalities."
    explanation: Establishes a syndromic neurodevelopmental disorder in females with de novo MED12 variants.
pathophysiology:
- name: Disrupted Mediator complex transcriptional regulation
  description: >
    MED12 is the scaffold subunit of the CDK8 kinase module (CKM) of the Mediator complex,
    the dissociable regulatory cap that reversibly associates with the Mediator core to gate
    RNA polymerase II-dependent transcription. MED12 variants disrupt Mediator-dependent
    transcriptional control of developmental gene-expression programs. MED12 belongs to the
    group of CDK8-kinase module-associated disease genes, alongside MED12L, MED13, MED13L,
    CDK8, and CDK19.
  genes:
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:23091001
    reference_title: "MED12 mutations link intellectual disability syndromes with dysregulated GLI3-dependent Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MED12 mutations R961W and N1007S causing FG and Lujan syndromes, respectively, disrupt a Mediator-imposed constraint on GLI3-dependent Sonic Hedgehog (SHH) signaling."
    explanation: Establishes the shared molecular mechanism uniting the FG and Lujan MED12 alleles through impaired MED12-CDK8 control of GLI3/SHH signaling.
  downstream:
  - target: Dysregulated GLI3-dependent Sonic Hedgehog signaling
    description: >-
      FG and Lujan MED12 missense variants impair MED12-CDK8 interaction, relieving a
      Mediator constraint on GLI3 and enhancing Sonic Hedgehog target-gene induction.
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Mediator/CKM dysfunction perturbs neuronal developmental gene-expression programs
      contributing to intellectual disability and the syndromic features.
- name: Dysregulated GLI3-dependent Sonic Hedgehog signaling
  description: >
    The FG (p.R961W) and Lujan (p.N1007S) MED12 variants disrupt the gene-specific association
    of MED12 with CDK8, a suppressor of GLI3 transactivation. In patient-derived cells this
    enhances Sonic Hedgehog pathway activation and GLI3-target gene induction, coincident with
    impaired CDK8 recruitment onto GLI3-target promoters, providing a molecular basis for the
    craniofacial, musculoskeletal, and behavioral defects.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:23091001
    reference_title: "MED12 mutations link intellectual disability syndromes with dysregulated GLI3-dependent Sonic Hedgehog signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the FG/R961W and Lujan/N1007S mutations disrupt the gene-specific association of MED12 with a second Mediator subunit, CDK8, identified herein to be a suppressor of GLI3 transactivation activity."
    explanation: Demonstrates the mechanistic link between MED12 missense variants, loss of CDK8 recruitment, and GLI3/SHH dysregulation.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: Aberrant SHH/GLI3 signaling perturbs developmental programs contributing to the syndromic phenotype.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of MED12/Mediator dysfunction, neuronal gene-expression programs are dysregulated
    during brain development, contributing to intellectual disability, hypotonia, corpus callosum
    anomalies, and behavioral phenotypes across the MED12 allelic series.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most characteristic anomalies were agenesis or hypoplasia of the corpus callosum (13 of 13), anal fistula, stenosis and atresia (11 of 19), and congenital cardiac anomalies (11 of 18)."
    explanation: Documents the recurrent structural/developmental anomalies produced by MED12 dysfunction in confirmed FG syndrome.
  downstream:
  - target: Intellectual disability
    description: Disrupted neuronal developmental programs contribute to the core cognitive impairment.
  - target: Congenital hypotonia
    description: Disrupted neurodevelopmental programs contribute to congenital hypotonia.
  - target: Corpus callosum abnormalities
    description: Disturbed midline/commissural morphogenesis contributes to corpus callosum agenesis or hypoplasia.
  - target: Characteristic facial features
    description: Disrupted craniofacial developmental programs produce the characteristic MED12 facies.
  - target: Anal anomalies
    description: Disrupted hindgut/anorectal developmental programs contribute to imperforate anus and anal anomalies.
  - target: Relative macrocephaly
    description: Disrupted brain-growth transcriptional programs contribute to relative or absolute macrocephaly.

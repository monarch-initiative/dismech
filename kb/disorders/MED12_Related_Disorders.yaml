    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The original Lujan syndrome family has a novel missense mutation (p.N1007S) in the MED12 gene."
    explanation: Gene-discovery paper establishing the MED12 p.N1007S variant as the cause of Lujan syndrome.
- name: X-linked Ohdo syndrome
  display_name: X-linked Ohdo syndrome, Maat-Kievit-Brunner type
  classification: molecular
  description: >-
    Caused by hemizygous C-terminal MED12 missense variants (e.g., p.R1148H, p.S1165P).
    Blepharophimosis with ptosis, intellectual disability, and distinctive facies with facial
    coarsening at older age, distinguishing it from the autosomal (KAT6B) Ohdo forms.
  subtype_term:

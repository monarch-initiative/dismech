    reference_title: "Mutations in MED12 cause X-linked Ohdo syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The occurrence of three different hemizygous missense mutations in three unrelated families affected by Ohdo syndrome MKB type shows that mutations in MED12 are the underlying cause of this X-linked form of Ohdo syndrome."
    explanation: Establishes MED12 as the cause of X-linked Ohdo syndrome, Maat-Kievit-Brunner type.
- name: Hardikar syndrome
  display_name: Hardikar syndrome (female-specific MED12 disorder)
  classification: molecular
  description: >-
    A female-specific MED12 phenotype caused by de novo loss-of-function (nonsense/frameshift)
    variants with extremely skewed X-inactivation. Multiple congenital anomalies with typically
    preserved cognition: facial clefting, pigmentary retinopathy, biliary anomalies, and
    intestinal malrotation. Mechanistically distinct from the male missense syndromes.
  subtype_term:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Opitz-Kaveggia syndrome (also known as FG syndrome) is an X-linked disorder characterized by mental retardation, relative macrocephaly, hypotonia and constipation."

name: MED12-Related Disorders
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- MED12-related intellectual disability syndrome
- MED12-related X-linked intellectual disability
- MED12 allelic disorders
description: >
  MED12-related disorders are a group of X-linked conditions caused by variants in MED12,
  which encodes the scaffold subunit of the CDK8 kinase module of the Mediator transcriptional
  coactivator complex. Rather than a single syndrome, MED12 produces an allelic series. In
  hemizygous males, recurrent missense hotspots define distinct syndromes: p.R961W causes FG
  syndrome type 1 (Opitz-Kaveggia syndrome), characterized by relative macrocephaly, congenital
  hypotonia, constipation/anal anomalies, corpus callosum agenesis or hypoplasia, a
  characteristic facies with tall forehead and small ears, an affable personality, and cognitive
  impairment; p.N1007S causes Lujan (Lujan-Fryns) syndrome, with a marfanoid habitus; and
  C-terminal missense variants (e.g., p.R1148H, p.S1165P) cause X-linked Ohdo syndrome,
  Maat-Kievit-Brunner type, with blepharophimosis and facial coarsening with age. The FG and
  Lujan alleles share a mechanism, disrupting a Mediator-imposed constraint on GLI3-dependent
  Sonic Hedgehog signaling through impaired MED12-CDK8 interaction. In heterozygous females,
  de novo loss-of-function variants cause a female-specific Hardikar syndrome (facial clefting,
  pigmentary retinopathy, biliary anomalies, intestinal malrotation, with typically preserved
  cognition), and de novo missense or truncating variants cause a syndromic neurodevelopmental
  disorder. Somatic MED12 exon-2 gain-of-function mutations are a separate, non-heritable tumor
  mechanism (uterine leiomyoma, breast fibroadenoma) modeled in the respective tumor entries.

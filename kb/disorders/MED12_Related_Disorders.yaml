  classification: molecular
  description: >-
    Caused by the recurrent hemizygous MED12 p.R961W missense variant. The best-characterized
    MED12 phenotype: relative or absolute macrocephaly, congenital hypotonia, constipation and
    anal anomalies, corpus callosum agenesis or hypoplasia, broad thumbs and halluces, a
    characteristic facies (tall forehead, downslanting palpebral fissures, small simple ears),
    an affable/attention-seeking personality, and cognitive impairment.
  subtype_term:

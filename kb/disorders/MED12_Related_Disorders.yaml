prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    FG syndrome type 1, the best-characterized MED12 phenotype, has several hundred
    historical clinical diagnoses, though molecular confirmation of the p.R961W variant
    is far rarer. Lujan, X-linked Ohdo, Hardikar, and the female syndromic NDD are each
    individually ultra-rare. No population-based prevalence estimate is available.
  evidence:
  - reference: PMID:19938245
    reference_title: "FG syndrome, an X-linked multiple congenital anomaly syndrome: the clinical phenotype and an algorithm for diagnostic testing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 23 male patients have been identified from 10 families"
    explanation: Documents the molecularly confirmed p.R961W FG syndrome cohort size at time of this defining clinical review.

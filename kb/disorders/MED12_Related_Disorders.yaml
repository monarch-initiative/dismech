- name: Lujan syndrome
  display_name: Lujan syndrome (Lujan-Fryns syndrome)
  classification: molecular
  description: >-
    Caused by the hemizygous MED12 p.N1007S missense variant. Marfanoid habitus (tall, thin,
    long face, high narrow palate), macrocephaly, intellectual disability, hypotonia, corpus
    callosum anomalies, and behavioral/psychiatric features. Only the p.N1007S-defined subset
    of the clinically heterogeneous "Lujan-Fryns" label is MED12-related.
  subtype_term:
    preferred_term: X-linked intellectual disability with marfanoid habitus
    term:

name: Streptobacillary Rat-Bite Fever
creation_date: "2026-09-25T16:32:32Z"
category: Infectious Disease
disease_term:
  preferred_term: streptobacillary rat-bite fever
  term:
    id: MONDO:0020533
    label: streptobacillary rat-bite fever
description: >-
  Streptobacillary rat-bite fever is a zoonotic Streptobacillus moniliformis
  infection acquired after rodent bites, scratches, infected-rodent body-fluid
  contact, or ingestion of contaminated food or water; systemic spread produces
  fever, rash, and arthralgia and can progress to severe focal infection when
  diagnosis and antibiotic treatment are delayed.
parents:
- Rat-Bite Fever
synonyms:
- Haverhill fever
- Streptobacillary fever
infectious_agent:
- name: Streptobacillus moniliformis
  infectious_agent_term:
    preferred_term: Streptobacillus moniliformis
    term:
      id: NCBITaxon:34105
      label: Streptobacillus moniliformis
  description: >-
    Fastidious Gram-negative bacillus that causes streptobacillary rat-bite
    fever.
  evidence:
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
      illness classically characterized by fever, rigors, and polyarthralgias.
    explanation: >-
      Identifies S. moniliformis as the causative organism of streptobacillary
      rat-bite fever.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:17223620
      reference_title: Rat bite fever and Streptobacillus moniliformis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
        illness classically characterized by fever, rigors, and polyarthralgias.
      explanation: >-
        Streptobacillary rat-bite fever is a systemic bacterial infectious disease.
pathophysiology:
- name: Rodent Exposure and Streptobacillus Moniliformis Inoculation
  description: >-
    Rat bites, scratches, contaminated rodent body fluids, or rodent-contaminated
    food or water introduce S. moniliformis into a susceptible human host.
  biological_scale: TISSUE
  downstream:
  - target: Streptobacillus Moniliformis Systemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Inoculated S. moniliformis can disseminate systemically, producing
      culture-positive bacteremia in rat-bite fever.
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat-bite fever follows exposure to contaminated bodily fluids of infected
      rodents
    explanation: >-
      Supports infected-rodent body-fluid exposure as an initiating exposure for
      rat-bite fever.
- name: Streptobacillus Moniliformis Systemic Dissemination
  description: >-
    S. moniliformis spreads beyond the inoculation exposure to cause a systemic
    febrile illness with inflammatory skin and joint manifestations.
  biological_scale: ORGANISM
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection and host inflammation produce fever.
  - target: Skin Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inflammatory skin involvement produces the polymorphous acral rash of
      rat-bite fever.
  - target: Arthralgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Articular inflammation produces arthralgia and polyarthralgia.
  evidence:
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
      illness classically characterized by fever, rigors, and polyarthralgias.
    explanation: >-
      Supports systemic febrile and articular manifestations downstream of
      S. moniliformis infection.
phenotypes:
- name: Fever
  category: Constitutional
  description: >-
    Fever is a core constitutional feature of streptobacillary rat-bite fever.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:11724672
    reference_title: "Rat-bite fever (Streptobacillus moniliformis): a potential emerging disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physicians should consider RBF as a possible diagnosis when fever, rash, and
      exposure to rats are part of the patient's history.
    explanation: >-
      Supports fever as part of the clinical presentation that should raise
      suspicion for rat-bite fever after rat exposure.
- name: Skin Rash
  category: Dermatologic
  description: >-
    Streptobacillary rat-bite fever can produce polymorphous acral skin lesions,
    including hemorrhagic pustules and purpuric lesions on the hands and feet.
  phenotype_term:
    preferred_term: Skin rash
    term:
      id: HP:0000988
      label: Skin rash
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A female patient presented with painful hemorrhagic pustules and purpuric
      lesions on hands and feet. She developed fever and migratory polyarthralgia.
    explanation: >-
      Describes the cutaneous acral rash and migratory arthralgia observed in a
      human S. moniliformis rat-bite fever case.
- name: Arthralgia
  category: Musculoskeletal
  description: >-
    Arthralgia and polyarthralgia are classic articular manifestations and can
    progress to frank septic arthritis in complicated cases.
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
      illness classically characterized by fever, rigors, and polyarthralgias.
    explanation: >-
      Supports polyarthralgia as part of the classic systemic syndrome of
      streptobacillary rat-bite fever.
treatments:
- name: Antibiotic therapy
  description: >-
    Prompt antibiotic therapy is effective for S. moniliformis rat-bite fever and
    prevents complications from delayed therapy.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34672901
    reference_title: "Rat bite fever: a case report review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thanks to the almost omnisensitive susceptibility pattern of Streptobacillus
      moniliformis, timely antibiotic administration prevented an unfavorable
      outcome in all these cases.
    explanation: >-
      A case-report review links timely antibiotic administration to favorable
      outcomes in S. moniliformis rat-bite fever.
transmission:
- name: Rodent Body-Fluid and Foodborne Exposure
  description: >-
    Streptobacillary rat-bite fever follows rodent bites or scratches, handling
    of infected-rodent body fluids or excreta, and ingestion of rodent-contaminated
    food or water in the Haverhill fever form.
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat-bite fever follows exposure to contaminated bodily fluids of infected
      rodents
    explanation: >-
      Supports infected-rodent body-fluid exposure as a route of
      S. moniliformis rat-bite fever transmission.

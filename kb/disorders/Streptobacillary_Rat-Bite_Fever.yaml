name: Streptobacillary Rat-Bite Fever
creation_date: "2026-09-25T16:32:32Z"
category: Infectious Disease
disease_term:
  preferred_term: streptobacillary rat-bite fever
  term:
    id: MONDO:0020533
    label: streptobacillary rat-bite fever
description: >-
  Streptobacillary rat-bite fever is a zoonotic Streptobacillus moniliformis
  infection acquired after rodent bites, scratches, or infected-rodent body-fluid
  contact; systemic spread produces fever, rash, and arthralgia and can progress
  to severe focal infection when diagnosis and antibiotic treatment are delayed.
  The foodborne Haverhill fever variant is recognized but is not separately cited
  in this entry.
parents:
- Rat-Bite Fever
synonyms:
- Haverhill fever
- Streptobacillary fever
infectious_agent:
- name: Streptobacillus moniliformis
  infectious_agent_term:
    preferred_term: Streptobacillus moniliformis
    term:
      id: NCBITaxon:34105
      label: Streptobacillus moniliformis
  description: >-
    Fastidious Gram-negative bacillus that causes streptobacillary rat-bite
    fever.
  evidence:
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
      illness classically characterized by fever, rigors, and polyarthralgias.
    explanation: >-
      Identifies S. moniliformis as the causative organism of streptobacillary
      rat-bite fever.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:17223620
      reference_title: Rat bite fever and Streptobacillus moniliformis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
        illness classically characterized by fever, rigors, and polyarthralgias.
      explanation: >-
        Streptobacillary rat-bite fever is a systemic bacterial infectious disease.
pathophysiology:
- name: Rodent Exposure and Streptobacillus Moniliformis Inoculation
  description: >-
    Rat bites, scratches, or contaminated rodent body fluids introduce
    S. moniliformis into a susceptible human host.
  biological_scale: ORGANISM
  downstream:
  - target: Streptobacillus Moniliformis Bacteremia
    causal_link_type: DIRECT
    description: >-
      Inoculated S. moniliformis reaches the bloodstream, producing
      culture-positive bacteremia.
    evidence:
    - reference: PMID:34323361
      reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Blood culture yielded growth with Streptobacillus moniliformis.
      explanation: >-
        Culture-positive bacteremia after rodent exposure in a human case.
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat-bite fever follows exposure to contaminated bodily fluids of infected
      rodents
    explanation: >-
      Supports infected-rodent body-fluid exposure as an initiating exposure for
      rat-bite fever.
- name: Streptobacillus Moniliformis Bacteremia
  description: >-
    S. moniliformis reaches and grows in the bloodstream, the culture-positive
    bacteremic phase from which the organism seeds distant sites and drives the
    systemic febrile syndrome.
  biological_scale: ORGANISM
  downstream:
  - target: Streptobacillus Moniliformis Systemic Dissemination
    causal_link_type: DIRECT
    description: >-
      Bacteremia drives the systemic febrile, cutaneous, and articular syndrome.
  - target: Septic Seeding of Joints and Cardiac Valves
    causal_link_type: DIRECT
    description: >-
      Bacteremic spread seeds joints, cardiac valves, and bone, producing the
      focal suppurative complications of untreated disease.
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood culture yielded growth with Streptobacillus moniliformis.
    explanation: >-
      Documents the culture-positive bacteremic phase in a human S. moniliformis case.
- name: Streptobacillus Moniliformis Systemic Dissemination
  description: >-
    S. moniliformis spreads beyond the inoculation exposure to cause a systemic
    febrile illness with inflammatory skin and joint manifestations.
  biological_scale: ORGANISM
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection and host inflammation produce fever.
  - target: Chills
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection and host inflammation produce rigors.
  - target: Skin Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inflammatory skin involvement produces the polymorphous acral rash of
      rat-bite fever.
  - target: Arthralgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Articular inflammation produces arthralgia and polyarthralgia.
  evidence:
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rat bite fever, caused by Streptobacillus moniliformis, is a systemic
      illness classically characterized by fever, rigors, and polyarthralgias.
    explanation: >-
      Supports systemic febrile and articular manifestations downstream of
      S. moniliformis infection.
- name: Septic Seeding of Joints and Cardiac Valves
  description: >-
    Untreated bacteremia seeds distant sites, producing suppurative focal
    infection: septic arthritis and infective endocarditis are the complications
    that account for the disease's mortality.
  biological_scale: TISSUE
  downstream:
  - target: Septic arthritis
    causal_link_type: DIRECT
    description: Bacteremic seeding of a joint produces septic arthritis.
  - target: Bacterial endocarditis
    causal_link_type: DIRECT
    description: Bacteremic seeding of a cardiac valve produces infective endocarditis.
  evidence:
  - reference: PMID:16858964
    reference_title: Rat-bite fever presenting with rash and septic arthritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who presented with fever petechial rash, and septic arthritis following a
      rat bite
    explanation: >-
      Documents bacteremic seeding of a joint producing septic arthritis in a
      rat-bite fever case.
  - reference: PMID:15029568
    reference_title: Fatal rat bite fever in a pet shop employee.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease progressed from a flu-like illness to endocarditis involving
      first the aortic valve and then the mitral valve and septum.
    explanation: >-
      Documents bacteremic seeding of cardiac valves producing fatal endocarditis
      in a rat-bite fever case.

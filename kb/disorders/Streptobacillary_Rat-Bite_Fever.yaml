treatments:
- name: Antibiotic therapy
  description: >-
    Prompt antibiotic therapy is effective for S. moniliformis rat-bite fever and
    prevents complications from delayed therapy.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: penicillin
      term:
        id: CHEBI:17334
        label: penicillin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Streptobacillus Moniliformis Bacteremia
    treatment_effect: INHIBITS
    description: >-
      Penicillin clears the bacteremic organism, aborting systemic dissemination
      and the septic-seeding complications.
    evidence:
    - reference: PMID:34672901
      reference_title: "Rat bite fever: a case report review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        a commonly available standard therapy (penicillin)
      explanation: >-
        Names penicillin as the standard antibiotic therapy for the infection.
  evidence:
  - reference: PMID:34672901
    reference_title: "Rat bite fever: a case report review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thanks to the almost omnisensitive susceptibility pattern of Streptobacillus
      moniliformis, timely antibiotic administration prevented an unfavorable
      outcome in all these cases.
    explanation: >-
      A case-report review links timely antibiotic administration to favorable
      outcomes in S. moniliformis rat-bite fever.
diagnosis:
- name: Blood culture
  description: >-
    Blood culture is the primary means of isolating the fastidious organism;
    sampling is recommended in a persistent post-rodent-exposure fever even
    without systemic inflammatory signs, though the organism is difficult to
    culture.
  diagnosis_term:
    preferred_term: blood culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:34672901
    reference_title: "Rat bite fever: a case report review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the case of persistent fever, blood culture sampling should be performed
      even in the absence of a systemic inflammatory response.
    explanation: >-
      States the blood-culture diagnostic recommendation for suspected rat-bite fever.
  - reference: PMID:17223620
    reference_title: Rat bite fever and Streptobacillus moniliformis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      difficulties in culturing its causative organism
    explanation: >-
      Records that the organism is fastidious and difficult to culture, the reason
      culture-based diagnosis is often delayed.
- name: 16S ribosomal RNA PCR
  description: >-
    A bacterial 16S rRNA PCR on blood or joint aspirate is more sensitive than
    culture for identifying S. moniliformis.
  diagnosis_term:
    preferred_term: 16S ribosomal RNA PCR
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:34672901
    reference_title: "Rat bite fever: a case report review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A bacterial 16S ribosomal RNA PCR on blood or joint aspiration (cultures) is
      an even more sensitive diagnostic test.
    explanation: >-
      States that 16S rRNA PCR is a more sensitive diagnostic than culture.
prevalence:
- population: Reported human isolates (all ages)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Half of reported S. moniliformis isolates come from children (9 years old or
    younger); children and people of low socioeconomic status are the vulnerable
    groups. No general-population prevalence estimate exists.
  evidence:
  - reference: PMID:11724672
    reference_title: "Rat-bite fever (Streptobacillus moniliformis): a potential emerging disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      50% of the isolates from patients 9 years old or younger
    explanation: >-
      Quantifies the pediatric predominance among reported isolates.
notes: >-
  Untreated streptobacillary rat-bite fever carries roughly a 10% mortality
  (PMID:17223620), rising in reports of complicated disease; death is driven by
  the septic-seeding complications (endocarditis, septic arthritis). Osteomyelitis
  is a recognized Streptobacillus rat-bite-fever complication, but the fullest
  recent osteomyelitis case (PMID:40472936) was caused by Streptobacillus
  notomytis, a species only recently split from S. moniliformis; it is recorded
  here rather than bound as an S. moniliformis phenotype to avoid asserting a
  cross-species finding.
transmission:
- name: Rodent Bite and Body-Fluid Exposure
  description: >-
    Streptobacillary rat-bite fever follows rodent bites or scratches and handling
    of infected-rodent body fluids or excreta. A foodborne Haverhill fever variant
    is recognized but is not separately cited in this entry.
  evidence:
  - reference: PMID:34323361
    reference_title: "Rat bite fever, a diagnostic challenge: case report and review of 29 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat-bite fever follows exposure to contaminated bodily fluids of infected
      rodents
    explanation: >-
      Supports infected-rodent body-fluid exposure as a route of
      S. moniliformis rat-bite fever transmission.
  - reference: PMID:11724672
    reference_title: "Rat-bite fever (Streptobacillus moniliformis): a potential emerging disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      83% of these suspected cases involved either a known rat bite or exposure
      to rodents
    explanation: >-
      Supports the rat-bite and rodent-exposure routes of transmission.

treatments:
- name: Enzyme Replacement Therapy (olipudase alfa)
  description: >-
    Olipudase alfa (recombinant human acid sphingomyelinase) is FDA-approved
    for the non-CNS (visceral and pulmonary) manifestations of ASMD across
    subtypes; because it does not cross the blood-brain barrier, it reduces
    liver, spleen, and lung sphingomyelin storage without impacting CNS
    neurocognitive or motor manifestations in NPD-A/B.
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Visceral and Pulmonary Reticuloendothelial Foam-Cell Pathology
    treatment_effect: RESTORES
    description: >-
      Olipudase alfa supplies exogenous acid sphingomyelinase to clear
      accumulated sphingomyelin in hepatic, splenic, and pulmonary macrophages.
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: olipudase alfa
      term:
        id: CHEBI:755825
        label: olipudase alfa
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Olipudase alfa (Xenpozyme®) enzyme replacement therapy (ERT) helps to reduce the accumulation of sphingomyelin in the lung, liver, spleen, and other non-central nervous system organs. It does not impact the central nervous system and therefore does not impact the neurocognitive issues seen in individuals with NPD-A or NPD-A/B."
    explanation: "Explicitly documents olipudase alfa's visceral/pulmonary efficacy and lack of CNS effect in NPD-A/B."
  - reference: PMID:38397448
    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzyme replacement therapy with Olipudase α is the first and only approved disease-modifying therapy for patients with ASMD."
    explanation: "Confirms olipudase alfa as the approved disease-modifying ERT for ASMD."
- name: Supportive Care
  description: >-
    Multidisciplinary supportive management addresses neurological,
    developmental, pulmonary, hepatic, hematologic, and metabolic
    complications, including physical/occupational therapy, early
    developmental intervention, supplemental oxygen, lipid management, and
    bone health support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "physical and occupational therapy to maximize function and to prevent contractures; early intervention and developmental support for those with developmental issues; treatment of hyperlipidemia in adults; calcium and vitamin D for osteopenia/osteoporosis"
    explanation: "GeneReviews details neurodevelopmental, physical, and metabolic supportive interventions for ASMD."
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses autosomal recessive inheritance (25% sibling
    recurrence risk), carrier testing for at-risk relatives, and prenatal or
    preimplantation genetic testing once familial SMPD1 variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All forms of ASMD (NPD-A, NPD-A/B, and NPD-B) are inherited in an autosomal recessive manner. If both parents are known to be heterozygous for an SMPD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: "Establishes autosomal recessive genetic counseling for NPD-A/B families."
clinical_trials:
- name: NCT02004691
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ASCEND randomized, double-blind, placebo-controlled 52-week pivotal study
    of intravenous olipudase alfa every 2 weeks (dose-escalated to 3 mg/kg) in
    36 adults with chronic ASMD, demonstrating significant improvements in
    pulmonary diffusing capacity (DLCO), spleen volume, liver volume, platelet
    counts, and lipid profiles.
  notes: >-
    Registered on ClinicalTrials.gov as a combined Phase 2/3 trial; encoded as
    PHASE_III under the single-value phase enum.
  evidence:
  - reference: clinicaltrials:NCT02004691

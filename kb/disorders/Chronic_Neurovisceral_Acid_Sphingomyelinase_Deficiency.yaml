name: Chronic Neurovisceral Acid Sphingomyelinase Deficiency
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Chronic neurovisceral acid sphingomyelinase deficiency (ASMD; Niemann-Pick
  disease type A/B or variant NPD-B) is the intermediate autosomal recessive
  form of SMPD1-related disease on the ASMD continuum between fatal infantile
  neurovisceral ASMD (type A) and chronic visceral non-neuronopathic ASMD
  (type B). Biallelic SMPD1 variants leave intermediate residual acid
  sphingomyelinase activity that prevents rapid infantile neurodegeneration but
  is insufficient to fully protect the central nervous system, producing
  visceral and pulmonary macrophage sphingomyelin storage (hepatosplenomegaly,
  cytopenias, atherogenic dyslipidemia, interstitial lung disease) combined
  with variable, later-onset neurological manifestations. Enzyme replacement
  therapy with olipudase alfa treats the non-CNS visceral and pulmonary
  manifestations but does not cross the blood-brain barrier to impact CNS
  disease.

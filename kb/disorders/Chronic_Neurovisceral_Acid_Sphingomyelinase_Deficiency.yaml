definitions:
- name: Clinical case definition of chronic neurovisceral ASMD
  definition_type: CASE_DEFINITION
  description: >-
    Chronic neurovisceral ASMD (Niemann-Pick disease type A/B) is the
    intermediate form of acid sphingomyelinase deficiency, defined by biallelic
    SMPD1 variants with intermediate residual enzyme activity producing
    visceral sphingomyelin storage together with later-onset, variable
    neurological involvement.
  scope: Disease-level case definition for the intermediate (type A/B) ASMD subtype.
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A phenotype with intermediate severity is also known as chronic neurovisceral ASMD (NPD-A/B)."
    explanation: "Defines chronic neurovisceral ASMD (NPD-A/B) as the intermediate-severity phenotype on the ASMD spectrum."
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: "Anchors the intermediate phenotype on the ASMD continuum."
notes: >-
  Chronic neurovisceral acid sphingomyelinase deficiency (NPD-A/B) is covered
  alongside NPD-A and NPD-B in the shared Acid Sphingomyelinase Deficiency
  GeneReviews chapter (PMID:20301544, NBK1370).

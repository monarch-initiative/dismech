    modifier: INCREASED
    term:
      id: GO:0019915
      label: lipid storage
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The eponym Niemann-Pick disease (NPD) refers to a group of patients who present with varying degrees of lipid storage and foam cell infiltration in tissues, as well as overlapping clinical features including hepatosplenomegaly, pulmonary insufficiency and/or central nervous system (CNS) involvement."
    explanation: "Establishes cellular lipid storage and foam-cell infiltration underlying combined visceral, pulmonary, and CNS disease."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The principal accumulating lipid is sphingomyelin, but cholesterol and ganglioside storage also has been observed."
    explanation: "Demonstrates primary sphingomyelin accumulation accompanied by secondary cholesterol and ganglioside storage in acid sphingomyelinase deficiency."
  downstream:
  - target: Visceral and Pulmonary Reticuloendothelial Foam-Cell Pathology
    causal_link_type: DIRECT
    description: "Foam-cell accumulation infiltrates the spleen, liver, lung, and bone marrow."
    evidence:
    - reference: PMID:28164782
      reference_title: "Types A and B Niemann-Pick disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The primary organ systems affected in all ASM-deficient patients are the spleen, liver and lung. As noted above, lipid filled foam cells can be readily detected in these tissues, as well as in the pulmonary airways."
      explanation: "Directly links cellular sphingomyelin storage to foam-cell infiltration of spleen, liver, and lung."
  - target: Central Nervous System Dysfunction
    causal_link_type: DIRECT
    description: "Incomplete enzymatic protection allows progressive lysosomal sphingomyelin storage in central nervous system neurons, driving variable neurological dysfunction."
    evidence:
    - reference: PMID:28228103
      reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Some patients with ASMD who survive beyond early childhood have intermediate phenotypes (variant NPD B) characterized by combinations of non-neurologic and mild to severe neurologic symptoms."
      explanation: "Links intermediate residual ASM deficiency and storage to mild-to-severe CNS symptoms."
  - target: Cherry red spot of the macula
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: "Retinal lipid storage produces a macular halo or distinct macular cherry-red spot in a subset of chronic ASMD patients."
    evidence:
    - reference: PMID:28164782
      reference_title: "Types A and B Niemann-Pick disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "There also may be a reddish-brown halo surrounding the macula in the eyes of these patients, and in some cases a distinct cherry red spot can be identified."
      explanation: "Documents macular cherry-red spot formation in chronic ASMD."
- name: Visceral and Pulmonary Reticuloendothelial Foam-Cell Pathology
  biological_scale: TISSUE
  description: >-
    Lipid-laden foam cells infiltrate the spleen, liver, bone marrow, and
    pulmonary alveoli/interstitium, producing splenomegaly, hepatomegaly,
    progressive liver dysfunction, interstitial lung disease, osteopenia,
    thrombocytopenia, and atherogenic dyslipidemia (low HDL cholesterol with
    elevated LDL cholesterol and triglycerides).

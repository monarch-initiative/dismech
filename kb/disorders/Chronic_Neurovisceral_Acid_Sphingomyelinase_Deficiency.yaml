pathophysiology:
- name: Partial Acid Sphingomyelinase Deficiency from SMPD1 Variants
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic SMPD1 variants leave low intermediate residual acid
    sphingomyelinase activity (<10% of normal controls): higher than in
    infantile neurovisceral NPD-A, preventing rapid infantile psychomotor
    collapse, yet insufficient for normal sphingomyelin turnover in macrophages
    and vulnerable central nervous system neurons.
  genes:
  - preferred_term: SMPD1
    term:
      id: hgnc:11120
      label: SMPD1
  molecular_functions:
  - preferred_term: acid sphingomyelin phosphodiesterase activity
    term:
      id: GO:0061750
      label: acid sphingomyelin phosphodiesterase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: sphingomyelin catabolic process
    modifier: DECREASED
    term:
      id: GO:0006685
      label: sphingomyelin catabolic process
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: "SMPD1 mutations and deficient acid sphingomyelinase activity underlie all forms of ASMD including the intermediate neurovisceral subtype."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ASMD is established by detection of biallelic pathogenic variants in SMPD1 by molecular genetic testing and residual acid sphingomyelinase enzyme activity that is less than 10% of controls (in peripheral blood lymphocytes or cultured skin fibroblasts)."
    explanation: "Confirms markedly reduced (<10% of control) acid sphingomyelinase catalytic activity in ASMD."
  downstream:

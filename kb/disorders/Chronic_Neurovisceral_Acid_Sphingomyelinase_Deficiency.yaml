- name: Intermediate Neurovisceral Sphingomyelin Storage
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Undegraded sphingomyelin and secondary lipids (cholesterol and
    gangliosides) accumulate in lysosomes of tissue macrophages (forming
    lipid-laden foam cells) and, to an intermediate degree, within central
    nervous system and retinal neurons, driving parallel visceral and
    neurologic pathology.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: macrophage derived foam cell
    term:
      id: CL:0000517
      label: macrophage derived foam cell
  - preferred_term: neuron
    term:

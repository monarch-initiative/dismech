    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary objective of this phase 2/3 study was to evaluate the efficacy of olipudase alfa (recombinant human acid sphingomyelinase) administered intravenously once every 2 weeks for 52 weeks in adult participants with acid sphingomyelinase deficiency (ASMD)"
    explanation: "ClinicalTrials.gov registration record for the adult ASCEND trial of olipudase alfa in ASMD."
  - reference: PMID:35471153
    reference_title: "A randomized, placebo-controlled clinical trial evaluating olipudase alfa enzyme replacement therapy for chronic acid sphingomyelinase deficiency (ASMD) in adults: One-year results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A phase 2/3, 52 week, international, double-blind, placebo-controlled trial (ASCEND; NCT02004691/EudraCT 2015-000371-26) enrolled 36 adults with ASMD randomized 1:1 to receive olipudase alfa or placebo intravenously every 2 weeks with intrapatient dose escalation to 3 mg/kg."

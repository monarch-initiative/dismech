progression:
- phase: Intermediate, variable course with survival beyond early childhood
  notes: >-
    The clinical spectrum of ASMD is a continuum; chronic neurovisceral disease
    (NPD-A/B) presents with later-onset and more variable neurological signs
    than infantile NPD-A, and survival into adulthood can occur.
  evidence:
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: "ASMD forms a phenotypic continuum on which chronic neurovisceral disease is intermediate."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Survival to adulthood can occur in individuals with NPD-B and NPD-A/B, even when untreated."
    explanation: "Documents survival into adulthood in chronic neurovisceral ASMD (NPD-A/B)."

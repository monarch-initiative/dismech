    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with NPD-A/B have symptoms that are intermediate between NPD-A and NPD-B. The presentation in individuals with NPD-A/B varies greatly, although all are characterized by the presence of some central nervous system manifestations."
    explanation: "Establishes variable CNS involvement as the defining feature of chronic neurovisceral ASMD (NPD-A/B)."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with a variant form of type B have neurologic features such as ataxia, learning difficulties, and gross motor delays; these patients generally have more severe systemic manifestations as well"
    explanation: "Details the characteristic neurological manifestations (ataxia, learning difficulties, and gross motor delays) of chronic neurovisceral ASMD (variant NPD-B)."

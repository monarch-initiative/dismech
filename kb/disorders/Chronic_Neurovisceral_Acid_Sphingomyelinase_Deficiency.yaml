- name: Central Nervous System Dysfunction
  biological_scale: TISSUE
  description: >-
    Progressive central nervous system dysfunction arising from neuronal
    sphingomyelin storage manifests after infancy with variable neurological
    signs—particularly cerebellar ataxia, gross motor developmental delay, and
    learning difficulties—distinguishing chronic neurovisceral ASMD (NPD-A/B)
    from non-neuronopathic NPD-B.
  cell_types:
  - preferred_term: neuron

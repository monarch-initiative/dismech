      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the cause for attendance at the orthopaedic outpatient department was pain and stiffness as a result of tarsal coalitions and fixed planovalgus feet"
      explanation: The family's foot pain is attributed to the tarsal coalitions and planovalgus feet.
- category: Musculoskeletal

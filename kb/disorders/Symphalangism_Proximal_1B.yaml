name: Symphalangism Proximal 1B
creation_date: "2026-10-22T13:25:13Z"
category: Mendelian
synonyms:
- SYM1B
- GDF5 proximal symphalangism
- proximal symphalangism caused by mutation in GDF5
- symphalangism, proximal, type 1B
description: >-
  Proximal symphalangism 1B (SYM1B) is the autosomal dominant disorder of joint
  formation caused by heterozygous activating missense variants in GDF5, which
  encodes growth and differentiation factor 5, a BMP-family ligand expressed at
  sites of future joints. The proximal interphalangeal joints, most often of the
  ring and little fingers, fail to form, so the proximal and middle phalanges
  are fused and the fingers cannot bend and lack flexion creases. Tarsal
  coalitions, absence of the cuboid and flat feet are reported, and in one
  family the painful, fixed planovalgus feet caused more disability than the
  hands. Expression varies within families. The variants increase GDF5
  activity, by changing which type I BMP receptor it binds (p.Arg438Leu) or by
  increasing processing of the precursor (p.Leu373Arg), so BMP signalling is
  excessive where a joint interzone should form. The same gene causes
  proximal symphalangism, multiple synostoses syndrome 2 and, through
  loss-of-function alleles, brachydactyly types A2 and C, depending on how the
  variant changes GDF5 activity.
disease_term:
  preferred_term: symphalangism, proximal, 1B
  term:
    id: MONDO:0014125
    label: symphalangism, proximal, 1B
parents:
- Joint Disorders
- Limb Development Disorders
notes: >-
  Three GDF5 variants have been reported in families with SYM1B: p.Arg438Leu
  (an American family and a British family), p.Glu491Lys (two Chinese families)
  and p.Leu373Arg (a Chinese family). The NOG-caused form, SYM1A, is curated
  in NOG-Related_Symphalangism_Spectrum_Disorder, and GDF5-caused multiple
  synostoses syndrome 2 is a subtype of Multiple_Synostoses_Syndrome. The
  noggin-resistant GDF5 p.Asn445Lys and p.Asn445Thr variants (PMID:19956691)
  belong to multiple synostoses syndrome, not to this entry, although one
  later paper counts them among SYM1 variants. Carpal coalition and conductive
  hearing loss belong to the broader proximal symphalangism phenotype but
  have not been documented in a GDF5 family, and hearing was normal in the
  British family. No GeneReviews chapter covers this disorder (see
  `just check-genereviews`). No mechanism module in kb/modules/ describes
  joint-interzone formation, so no conforms_to is declared.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Heterozygous GDF5 variants segregate dominantly through five generations in
    the two Chinese p.Glu491Lys families. Expression varies within a family: in
    the British p.Arg438Leu family two children had proximal symphalangism of
    the little fingers, while their mother and another child had brachydactyly
    without finger fusion, and all four had tarsal coalitions.
  evidence:
  - reference: PMID:16892395
    reference_title: "A novel mutation in GDF5 causes autosomal dominant symphalangism in two Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The E491K mutation co-segregated with the affected individuals in the two families, and did not exist in unaffected family members or 200 normal controls."
    explanation: Cosegregation of a heterozygous GDF5 variant with the disease across two five-generation families.
  - reference: PMID:28032038
    reference_title: "Recurrent missense mutation of GDF5 (p.R438L) causes proximal symphalangism in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had multiple tarsal coalitions and hand involvement in the form of either brachydactyly or symphalangism of the proximal and middle phalanx of the little fingers."
    explanation: Relatives carrying the same variant differ in whether the hands show symphalangism or only brachydactyly, showing variable expressivity.
pathophysiology:
- name: GDF5 Gain of Function
  description: >-
    The SYM1B variants make GDF5 more active rather than less. p.Arg438Leu, in
    the receptor-binding surface of the mature ligand, keeps normal binding to
    BMPR1B and to noggin but gains binding to BMPR1A, the receptor normally used
    by BMP2, so the ligand acquires BMP2-like activity. p.Leu373Arg, in the
    prodomain, increases proteolytic release of the mature ligand.
    p.Glu491Lys alters a conserved residue of the mature domain; its
    biochemical effect has not been described in the cited sources.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  molecular_functions:
  - preferred_term: BMP receptor binding
    term:
      id: GO:0070700
      label: BMP receptor binding
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the R438L mutant showed normal binding to BMPR1B but increased binding to BMPR1A, the receptor normally activated by BMP2. The binding to NOGGIN was normal for both mutants."
    explanation: Biosensor binding shows the symphalangism variant gains BMPR1A binding without losing BMPR1B or noggin binding.
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the symphalangism phenotype (R438L) is caused by a loss of receptor-binding specificity, resulting in a gain of function by the acquisition of BMP2-like properties."
    explanation: The authors' conclusion that the variant is a gain of function through altered receptor specificity.
  - reference: PMID:29371961
    reference_title: "Knock-in human GDF5 proregion L373R mutation as a mouse model for proximal symphalangism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variant caused proteolysis efficiency of GDF5 increased in ATDC5 cells."
    explanation: The prodomain variant increases processing of the GDF5 precursor in a chondrogenic cell line.
  downstream:
  - target: Excess BMP Signaling at Prospective Joint Sites
    causal_link_type: DIRECT
    description: More active GDF5 drives more SMAD1/5/8 signalling and more chondrogenic gene expression.
    evidence:
    - reference: PMID:29371961
      reference_title: "Knock-in human GDF5 proregion L373R mutation as a mouse model for proximal symphalangism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The variant also caused upregulation of SMAD1/5/8 phosphorylation and increased expression of target genes SMURF1, along with COL2A1 and SOX9 which are factors associated with chondrosis."
      explanation: The variant raises SMAD1/5/8 phosphorylation and chondrogenic target-gene expression.
    - reference: PMID:16127465
      reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The R438L mutant, in contrast, showed increased biological activity when compared with WT GDF5."
      explanation: The p.Arg438Leu ligand is more active than wild type in cell-based assays.
- name: Excess BMP Signaling at Prospective Joint Sites
  description: >-
    The overactive ligand raises BMP-SMAD signalling in the condensing
    cartilage of the digit rays and pushes cells toward chondrogenic
    differentiation, so the region where a joint should form stays
    chondrogenic.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: INCREASED
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: INCREASED
  - preferred_term: chondrocyte differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: INCREASED
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:29371961
    reference_title: "Knock-in human GDF5 proregion L373R mutation as a mouse model for proximal symphalangism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variant also caused upregulation of SMAD1/5/8 phosphorylation and increased expression of target genes SMURF1, along with COL2A1 and SOX9 which are factors associated with chondrosis."
    explanation: Increased SMAD1/5/8 signalling and chondrogenic gene expression in cells expressing the variant.
  - reference: PMID:17994231
    reference_title: "Cushing proximal symphalangism and the NOG and GDF5 genes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "too little expression of NOG, a growth antagonist, or overexpression of GDF5, a growth agonist, results in cartilage overgrowth and bony fusion."
    explanation: Review placing GDF5 overactivity and NOG deficiency on the same mechanism of excess growth-factor signalling at joint sites.
  downstream:
  - target: Failure of Joint Interzone Formation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16127465
      reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overexpression of WT Gdf5 as well as the R438L mutant resulted in thickening of skeletal anlagen as well as in the fusion of joints"
      explanation: In the chick limb, excess GDF5 activity thickens cartilage anlagen and fuses joints.
- name: Failure of Joint Interzone Formation
  description: >-
    The joint interzone between adjacent phalanges, and between some tarsal
    bones, does not form or is not maintained. The cartilage elements stay
    continuous and ossify as one, giving bony fusion of the proximal
    interphalangeal joint and tarsal coalition. In knock-in mice carrying the
    p.Leu373Arg equivalent, embryonic joint development is abnormal and the
    phalanx joints are stiff and adherent.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: embryonic skeletal joint development
    term:
      id: GO:0072498
      label: embryonic skeletal joint development
    modifier: DECREASED
  locations:
  - preferred_term: proximal interphalangeal joint
    term:
      id: UBERON:0009767
      label: proximal interphalangeal joint
  - preferred_term: intertarsal joint
    term:
      id: UBERON:0008447
      label: intertarsal joint
  evidence:
  - reference: PMID:29371961
    reference_title: "Knock-in human GDF5 proregion L373R mutation as a mouse model for proximal symphalangism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It was also confirmed the joint formation and development was abnormal in Gdf5L367R/+ and Gdf5L367R/L367R mice, including the failure to develop the primary ossification center and be hypertrophic chondrocytes during embryonic development."
    explanation: Knock-in mice show abnormal embryonic joint formation, including in heterozygotes, which match the human genotype.
  downstream:
  - target: Proximal Symphalangism
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29371961
      reference_title: "Knock-in human GDF5 proregion L373R mutation as a mouse model for proximal symphalangism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "displayed stiffness and adhesions across the proximal phalanx joint which were in complete accord with SYM1"
      explanation: The joint-formation defect in knock-in mice produces adhesion across the proximal phalanx joint, the mouse counterpart of symphalangism.
  - target: Tarsal Synostosis
    causal_link_type: DIRECT
    description: >-
      Inferred by analogy with the interphalangeal joint. No cited source
      examines interzone formation at the tarsal joints in SYM1B or in the
      knock-in mouse, so this edge carries no evidence of its own.
phenotypes:
- category: Musculoskeletal
  name: Proximal Symphalangism
  description: >-
    Bony fusion of the proximal and middle phalanges at the proximal
    interphalangeal joint, most often of the ring and little fingers and
    sparing the thumb. In the Chinese p.Glu491Lys families the second to fourth
    fingers were fused.
  phenotype_term:
    preferred_term: Proximal symphalangism
    term:
      id: HP:0100264
      label: Proximal symphalangism
  evidence:
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-rays of the hands showed a complete bony fusion between the proximal and middle phalanges of digit V and, to a lesser extent, digit IV."
    explanation: Radiographic proximal symphalangism in the p.Arg438Leu family.
  - reference: PMID:16892395
    reference_title: "A novel mutation in GDF5 causes autosomal dominant symphalangism in two Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "osseous fusion of interphalangeal joints of the 2-4 fingers"
    explanation: Interphalangeal fusion of the second to fourth fingers in the p.Glu491Lys families.
  - reference: PMID:28032038
    reference_title: "Recurrent missense mutation of GDF5 (p.R438L) causes proximal symphalangism in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It is characterized by variable fusions of the proximal interphalangeal joints of the hands, typically of the ring and little finger, with the thumb typically being spared."
    explanation: Describes the usual distribution of the fusions in SYM1B.
  sequelae:
  - target: Limited Mobility of Proximal Interphalangeal Joints
    description: A fused proximal interphalangeal joint cannot flex.
    evidence:
    - reference: PMID:16127465
      reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SYM1 was diagnosed on the basis of patients’ inability to bend fingers IV and V in their interphalangeal joints"
      explanation: The affected fingers could not bend at the fused joints.
  - target: Absent Proximal Finger Flexion Creases
    description: Without movement at the joint, the overlying flexion crease is lost.
- category: Musculoskeletal
  name: Limited Mobility of Proximal Interphalangeal Joints
  description: >-
    Inability to bend the affected fingers at the fused joints, which can limit
    writing and grip.
  phenotype_term:
    preferred_term: Limited mobility of proximal interphalangeal joint
    term:
      id: HP:0006217
      label: Limited mobility of proximal interphalangeal joint
  evidence:
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SYM1 was diagnosed on the basis of patients’ inability to bend fingers IV and V in their interphalangeal joints"
    explanation: Inability to flex the ring and little fingers in the p.Arg438Leu family.
- category: Musculoskeletal
  name: Absent Proximal Finger Flexion Creases
  description: Loss of the flexion creases over the fused proximal interphalangeal joints.
  phenotype_term:
    preferred_term: Absent proximal finger flexion creases
    term:
      id: HP:0006077
      label: Absent proximal finger flexion creases
  evidence:
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inability to bend fingers IV and V in their interphalangeal joints and loss of flexion creases"
    explanation: Flexion creases were absent over the fused joints of the ring and little fingers.
- category: Musculoskeletal
  name: Brachydactyly
  description: >-
    Short digits without finger fusion, seen in relatives who carry the same
    variant as relatives with symphalangism.
  phenotype_term:
    preferred_term: Brachydactyly
    term:
      id: HP:0001156
      label: Brachydactyly
  evidence:
  - reference: PMID:28032038
    reference_title: "Recurrent missense mutation of GDF5 (p.R438L) causes proximal symphalangism in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had multiple tarsal coalitions and hand involvement in the form of either brachydactyly or symphalangism of the proximal and middle phalanx of the little fingers."
    explanation: Some carriers in the British family had brachydactyly rather than symphalangism.
- category: Musculoskeletal
  name: Tarsal Synostosis
  description: >-
    Multiple tarsal coalitions. In the British family they were present in

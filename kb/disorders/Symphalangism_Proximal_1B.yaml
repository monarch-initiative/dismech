genetic:
- name: GDF5
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The SYM1B alleles are heterozygous missense variants that increase GDF5
    activity. Loss-of-function GDF5 alleles cause different disorders
    (brachydactyly types A2 and C, and, when biallelic, the Grebe and Du Pan
    acromesomelic dysplasias), so a GDF5 variant is only consistent with SYM1B
    if its effect is activating. No ClinGen gene-disease validity curation for
    GDF5 and SYM1B is cached in this repository.
  variants:
  - name: NM_000557.5:c.1313G>T (p.Arg438Leu)
    type: missense
    description: >-
      Reported in an American family and, recurrently, in a British family.
      Changes receptor specificity of the mature ligand.
  - name: NM_000557.5:c.1471G>A (p.Glu491Lys)
    type: missense
    description: Reported in two five-generation Chinese families.
  - name: NM_000557.5:c.1118T>G (p.Leu373Arg)
    type: missense
    description: Prodomain variant reported in one Chinese family; increases precursor processing.
  evidence:
  - reference: PMID:16127465
    reference_title: "Activating and deactivating mutations in the receptor interaction site of GDF5 cause symphalangism or brachydactyly type A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They cause brachydactyly type A2 (L441P) and symphalangism (R438L)"
    explanation: First report of a GDF5 variant causing proximal symphalangism.
  - reference: PMID:16892395
    reference_title: "A novel mutation in GDF5 causes autosomal dominant symphalangism in two Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analysis revealed a novel E491K mutation in the GDF5 gene in both families."
    explanation: Second SYM1B allele, identified by linkage and sequencing.
  - reference: PMID:18283415
    reference_title: "Novel point mutations in GDF5 associated with two distinct limb malformations in Chinese: brachydactyly type C and proximal symphalangism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one family with SYM1, we found a novel missense mutation, c.1118T > G (p.L373R), which changes a highly conserved amino acid in the prodomain of GDF5."
    explanation: Third SYM1B allele, in the GDF5 prodomain.
  - reference: PMID:28032038
    reference_title: "Recurrent missense mutation of GDF5 (p.R438L) causes proximal symphalangism in a British family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing in the eldest child and his mother identified a heterozygous missense mutation in GDF5 c.1313G>T (p.R438L), thereby establishing SYM1B as the cause of the orthopaedic problems in this family."
    explanation: Recurrence of p.Arg438Leu in an unrelated family.

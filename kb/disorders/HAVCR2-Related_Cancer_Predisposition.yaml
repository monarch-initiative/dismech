    reference_title: Subcutaneous Panniculitis-like T-Cell Lymphoma With Hemophagocytic Lymphohistiocytosis Syndrome in Children and Its Essential Role of HAVCR2 Gene Mutation Analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The role of molecular analysis by identification of germline hepatitis A virus cellular receptor 2 (HAVCR2) gene mutation can be much valuable in classifying susceptible patients."

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using IPD from the present and the other three eligible cohorts (N=127), male sex, heterozygous and homozygous/compound heterozygous HAVCR2 mutations were associated with HLH by the adjusted odds ratio of 2.93 (95% confidence interval [CI]: 1.22-7.06), 4.77 (95% CI: 1.05-21.63) and 8.48 (95% CI: 2.98-24.10), respectively."
    explanation: >-
      Shows a dosage gradient for HLH risk, with heterozygous carriage also
      associated with HLH, which qualifies a strictly recessive model.
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis: results from a multicenter study and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, a positive family history in SPTCL and idiopathic HLH is unusual."
    explanation: >-
      Most patients present as simplex cases, as expected for a recessive

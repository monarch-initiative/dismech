    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest Tyr82Cys TIM-3 germline mutations are not only limited in SPTCL, and also occurred in other types of T-cell lymphoma, especially complicated HLH."
    explanation: >-
      Extends the lymphoma spectrum beyond SPTCL, on the basis of a small
      case series.
- name: Hemophagocytic lymphohistiocytosis
  category: Hematologic
  frequency: FREQUENT
  description: >-
    HLH or an HLH-like systemic illness (fever, cytopenias, ferritin of at
    least 500 micrograms per litre, and bone marrow hemophagocytosis) occurs
    with or without SPTCL. It is the main source of severity in this disease.
    In an adult HLH series, the germline p.Tyr82Cys subgroup had better
    survival than other HLH. Male sex is an additional risk factor for HLH in
    carriers and in SPTCL generally.
  notes: >-
    Bound to HP:0012156 Hemophagocytosis because HPO has no HLH term. OLS
    searches of hp on 2026-11-03 for "hemophagocytic lymphohistiocytosis",
    "lymphohistiocytosis", "hemophagocytic syndrome" and "macrophage
    activation syndrome" returned only HP:0012156 Hemophagocytosis,
    HP:0033041 Cytokine storm and HP:5210288 EBV-driven HLH; the last is
    EBV-specific and does not fit. The separate Hemophagocytosis phenotype
    below records the bone marrow finding (HP:6000980), which is one
    component of the HLH syndrome recorded here.
  phenotype_term:
    preferred_term: hemophagocytic lymphohistiocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:39538229

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "86.4% harbored germline HAVCR2 mutation, either homozygous (77.3%) or heterozygous (9.1%) p.Y82C variant, while 68.2% developed HLH/HLH-like systemic illnesses."
    explanation: >-
      HLH/HLH-like illness in about two thirds of a predominantly
      HAVCR2-positive paediatric cohort.

- phase: Relapsing course
  notes: >-
    SPTCL in carriers tends to relapse, and lymphoma can recur as clonally
    unrelated episodes. In the Korean nationwide cohort p.Tyr82Cys was
    associated with shorter relapse-free survival as well as with HLH.
  evidence:
  - reference: PMID:34535012

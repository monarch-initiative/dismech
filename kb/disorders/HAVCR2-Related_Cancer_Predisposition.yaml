discussions:
- discussion_id: havcr2_neoplastic_versus_inflammatory
  prompt: >-
    Is the HAVCR2-mutant lesion a lymphoma, or an inflammatory panniculitis
    with an HLH-prone immune defect?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Cytotoxic T-cell Infiltration of Subcutaneous Fat
  rationale: >-
    Clonal T-cell infiltrates with somatic mutations, and clonally unrelated
    recurrent lymphomas, argue for a true neoplasm. Panniculitis short of a
    lymphoma diagnosis and striking responses to cytokine blockade in
    homozygous children argue that much of the phenotype is inflammatory. The
    answer affects whether chemotherapy is ever first line.
  evidence:
  - reference: PMID:37062931
    reference_title: Efficacy of ruxolitinib for HAVCR2 mutation-associated hemophagocytic lymphohistiocytosis and panniculitis manifestations in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The excellent efficacy of ruxolitinib highlights this disease as an inflammatory condition instead of neoplastic nature and indicates novel agents targeting key inflammatory pathways as an encouraging approach for this disease entity."
    explanation: >-
      Authors' argument for an inflammatory reading.
  - reference: PMID:32285995
    reference_title: TIM-3 deficiency presenting with two clonally unrelated episodes of mesenteric and subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that mesenteric fatty tissue localization of SPTCL can be the presenting manifestation of TIM-3 deficiency, that this condition predisposes to recurrent lymphoma, and that flow cytometry is a possible screening tool."
    explanation: >-
      Recurrent, clonally unrelated lymphoma supports a neoplastic
      predisposition.
- discussion_id: havcr2_heterozygote_risk
  prompt: >-
    What is the risk of SPTCL or HLH in heterozygous HAVCR2 carriers?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal recessive
  rationale: >-
    Heterozygotes are over-represented among patients with HLH in pooled
    analyses, while in a Korean cohort heterozygous p.Tyr82Cys carriers had no
    systemic complications and the authors judged one allele insufficient for
    SPTCL. The cohorts are ascertained through affected patients, and
    no population-based penetrance estimate exists for heterozygous or
    biallelic carriers. This matters for cascade testing and for counselling
    parents and heterozygous siblings.
  evidence:
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis: results from a multicenter study and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the pathogenic consequences of homozygous or compound heterozygous HAVCR2 mutations have been described, the effects of heterozygous HAVCR2 mutations on clinical manifestations of SPTCL and associated HLH remain undetermined."
    explanation: >-
      States the heterozygote question as open.
  - reference: PMID:34535012
    reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to patients with homozygous HAVCR2Y82C, none of those with heterozygous HAVCR2Y82C experienced systemic complications (Fisher’s exact test, P = .031)."
    explanation: >-
      Counter-evidence: heterozygous p.Tyr82Cys carriers had no systemic
      complications in the Korean cohort (n=4).
  - reference: PMID:34535012
    reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the minor allele frequency of HAVCRY82C in East Asian subjects is reportedly as high as 0.0036,6 we consider that monoallelic HAVCRY82C alterations alone are not sufficient to cause SPTCL."
    explanation: >-
      Counter-evidence: the authors judge a single p.Tyr82Cys allele
      insufficient to cause SPTCL.
notes: >-
  Lump/split: this entry is the germline predisposition and is kept separate
  from the somatic tumor entry Subcutaneous_Panniculitis-like_T-cell_Lymphoma
  (design decisions §3a). That entry owns tumor histology, somatic drivers and
  SPTCL in patients without a germline variant; this entry owns the germline
  genotype, inheritance, lymphoma-free HLH and family implications. ClinGen
  curates SPTCL and HLH predisposition under one disease assertion without
  splitting, and HAVCR2-related HLH without lymphoma is kept here in the
  phenotype spectrum rather than as a subtype. The discovery report flags
  therapeutic TIM-3 blockade as potentially harmful in this setting
  (PMID:30374066); no report of such exposure in a carrier was found.

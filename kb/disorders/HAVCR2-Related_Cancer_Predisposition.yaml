phenotypes:
- name: Subcutaneous panniculitis-like T-cell lymphoma
  category: Neoplasm
  frequency: FREQUENT
  description: >-
    The defining neoplasm. Carriers develop SPTCL, often in childhood or
    adolescence, and may develop further clonally unrelated lymphomas. A
    compound heterozygote with p.Tyr82Cys and p.Arg89Cys developed EBV-positive
    peripheral T-cell lymphoma, not otherwise specified, so the tumor spectrum
    is not confined to SPTCL. The somatic tumor is curated separately as
    Subcutaneous_Panniculitis-like_T-cell_Lymphoma.
  phenotype_term:
    preferred_term: subcutaneous panniculitis-like T-cell lymphoma
    term:
      id: HP:0012190
      label: T-cell lymphoma
  evidence:
  - reference: PMID:30374066
    reference_title: Germline HAVCR2 mutations altering TIM-3 characterize subcutaneous panniculitis-like T cell lymphomas with hemophagocytic lymphohistiocytic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings highlight HLH-SPTCL as a new genetic entity and identify mutations causing TIM-3 alterations as a causative genetic defect in SPTCL."
    explanation: >-
      Defines SPTCL as the lymphoma of this genetic entity.
  - reference: PMID:30792187
    reference_title: Frequent germline mutations of HAVCR2 in sporadic subcutaneous panniculitis-like T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with a recent report, germline mutations in HAVCR2, encoding T-cell immunoglobulin mucin 3 (TIM3), were identified in 11 of 13 (85%) cases."
    explanation: >-
      Replication of the germline HAVCR2-SPTCL association.
  - reference: PMID:36212426
    reference_title: A novel germline HAVCR2 (TIM-3) compound heterozygous mutation is related to hemophagocytic lymphohistiocytic syndrome in EBV-positive peripheral T-cell lymphoma (NOS) with down-regulated TIM-3 signaling.

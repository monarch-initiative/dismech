  evidence:
  - reference: PMID:30374066
    reference_title: Germline HAVCR2 mutations altering TIM-3 characterize subcutaneous panniculitis-like T cell lymphomas with hemophagocytic lymphohistiocytic syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both variants induce protein misfolding and abrogate TIM-3's plasma membrane expression, leading to persistent immune activation and increased production of inflammatory cytokines, including tumor necrosis factor-α and interleukin-1β, promoting HLH and SPTCL."
    explanation: >-
      Functional studies show misfolding and loss of surface expression for
      both founder alleles.
  - reference: PMID:32285995
    reference_title: TIM-3 deficiency presenting with two clonally unrelated episodes of mesenteric and subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retrospectively, he was found to carry germline mutations in HAVCR2 associated with reduced T-cell immunoglobulin mucin-3 (TIM-3) expression."
    explanation: >-
      Reduced TIM-3 expression in a patient carrying germline HAVCR2 variants.
  downstream:
  - target: Persistent Immune Activation and Inflammatory Cytokine Release
    description: >-
      Loss of the inhibitory checkpoint releases restraint on T-cell and
      myeloid activation.
- name: Persistent Immune Activation and Inflammatory Cytokine Release
  biological_scale: CELLULAR
  description: >-
    Without surface TIM-3, T cells and innate immune cells remain activated
    and overproduce inflammatory cytokines, including TNF-alpha and IL-1beta.
    This hyperinflammatory state is the shared upstream step of both
    branches of the phenotype, HLH and SPTCL. Patients with HAVCR2-associated
    HLH also have elevated serum IL-1 receptor antagonist.

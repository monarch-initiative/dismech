inheritance:
- name: Autosomal recessive
  description: >-
    ClinGen curates the predisposition as autosomal recessive, and the
    discovery cohorts were dominated by homozygous or compound heterozygous
    patients who were clinically sporadic, without a family history.
    The evidence on heterozygotes points both ways. In a pooled
    individual-patient analysis a single HAVCR2 variant was associated with
    HLH, with a smaller effect than a biallelic genotype. In the Korean
    nationwide cohort, by contrast, none of the four heterozygous p.Tyr82Cys
    patients had systemic complications, and the authors concluded from the
    East Asian allele frequency that a single p.Tyr82Cys allele is not
    sufficient to cause SPTCL. Heterozygote risk is unresolved (see the
    havcr2_heterozygote_risk discussion).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

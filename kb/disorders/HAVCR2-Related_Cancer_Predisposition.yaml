histopathology:
- name: Adipocyte rimming by cytotoxic T cells
  description: >-
    Atypical CD3-positive, CD8-positive, TIA-1-positive, betaF1-positive
    lymphoid cells rimming adipocytes within subcutaneous nodules.
  diagnostic: true
  evidence:
  - reference: PMID:39538229
    reference_title: Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite its rarity, SPTCL can affect both male and female individuals in all age groups, with the classical manifestation of subcutaneous nodules infiltrated by atypical lymphoid cells rimming adipocytes with positive immunohistochemistry for CD3, CD8, T-cell intracytoplasmic antigen-1 (TIA-1) and T-cell receptor beta F1 (BF1)."
    explanation: >-
      The classical histology and immunophenotype.

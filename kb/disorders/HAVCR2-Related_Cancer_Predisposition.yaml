pathophysiology:
- name: Germline HAVCR2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline missense variants substitute highly conserved residues in the
    extracellular immunoglobulin variable-like domain of TIM-3. The two most
    frequent, c.245A>G p.Tyr82Cys and c.291A>G p.Ile97Met, have distinct
    ancestral distributions, and are carried homozygously or in compound
    heterozygosity in most affected patients.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

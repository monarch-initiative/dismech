- name: Cytotoxic T-cell Infiltration of Subcutaneous Fat
  biological_scale: TISSUE
  description: >-
    Cytotoxic CD8-positive alpha-beta T cells infiltrate the subcutaneous fat
    lobule and rim individual adipocytes, producing lobular panniculitis and,
    when clonal, SPTCL. Tumor cells in carriers acquire additional somatic
    mutations in epigenetic-regulation and signal-transduction genes. Lymphoma
    can recur as clonally unrelated episodes in the same patient, and the
    spectrum extends to other T-cell lymphomas in a few carriers; some
    paediatric biopsies show panniculitis without sufficient evidence of
    lymphoma, which is why the neoplastic nature of the lesion is debated.

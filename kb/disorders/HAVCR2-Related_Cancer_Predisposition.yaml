epidemiology:
- name: Age at onset
  description: >-
    Onset is predominantly in childhood, adolescence and young adulthood. In
    a Thai series of 22 patients aged 20 years or younger, 86.4% carried a
    germline HAVCR2 variant and the median age at SPTCL diagnosis was 11.5
    years; in a Thai multicentre cohort of all ages the median was 20.5 years,
    and carriers were younger than non-carriers. In a Chinese paediatric
    series of six homozygous p.Tyr82Cys patients the median age at onset was
    10.5 years, with one infant presenting with HLH alone. Adult onset is also
    common: the Korean nationwide cohort, unselected for age, had a median age
    at diagnosis of 32 years (range 8-74), and p.Tyr82Cys carriers were younger
    than non-carriers.
  minimum_value: 0.8
  maximum_value: 74.0
  unit: years
  notes: >-
    The minimum is the youngest onset in the Chinese paediatric series
    (PMID:37062931); the maximum is the oldest patient in the Korean
    nationwide cohort (PMID:34535012), which includes SPTCL without a germline
    HAVCR2 variant, so the upper bound is for SPTCL overall rather than for
    carriers specifically.
  evidence:
  - reference: PMID:39538229
    reference_title: Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at the time of diagnosis was 11.5 years (range, 6.0 to 19.0) with a male sex predominance (63.6%)."
    explanation: >-
      Median age at diagnosis in a Thai paediatric series in which 86.4% were
      germline HAVCR2 carriers.
  - reference: PMID:37062931
    reference_title: Efficacy of ruxolitinib for HAVCR2 mutation-associated hemophagocytic lymphohistiocytosis and panniculitis manifestations in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at onset was 10.5 years (range, 0.8-12.4)."
    explanation: >-
      Childhood onset, down to infancy, in homozygous p.Tyr82Cys patients.
  - reference: PMID:37051767
    reference_title: "Germline HAVCR2 mutations and their relation to the clinical spectrum of subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis: results from a multicenter study and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The earlier onset of illnesses was associated with homozygous or compound heterozygous HAVCR2 mutations."
    explanation: >-
      Biallelic genotype is associated with earlier onset.
  - reference: PMID:34535012
    reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age at diagnosis was 32 years (range, 8-74 years), and 37 (69.8%) patients were women."
    explanation: >-
      Adult median age in an all-ages Korean cohort, balancing the paediatric
      series.
  - reference: PMID:34535012
    reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HAVCR2Y82C was associated with younger age (P = .001), development of hemophagocytic lymphohistiocytosis or hemophagocytic lymphohistiocytosis-like systemic illness (P < .001), and short relapse-free survival (RFS) (P = .023)."
    explanation: >-
      p.Tyr82Cys carriers were younger than non-carriers.

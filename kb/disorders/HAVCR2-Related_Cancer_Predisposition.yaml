  - preferred_term: HAVCR2
    term:
      id: hgnc:18437
      label: HAVCR2
  molecular_functions:
  - preferred_term: TIM-3 inhibitory checkpoint receptor activity
    modifier: DECREASED
    term:
      id: GO:0004888
      label: transmembrane signaling receptor activity
  evidence:
  - reference: PMID:30374066
    reference_title: Germline HAVCR2 mutations altering TIM-3 characterize subcutaneous panniculitis-like T cell lymphomas with hemophagocytic lymphohistiocytic syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify in ~60% of SPTCL cases germline, loss-of-function, missense variants altering highly conserved residues of TIM-3, c.245A>G (p.Tyr82Cys) and c.291A>G (p.Ile97Met), each with specific geographic distribution."
    explanation: >-
      Discovery report naming the germline loss-of-function alleles.
  - reference: PMID:38867583
    reference_title: An investigation of germline variants of HAVCR2 in subcutaneous panniculitis-like T-cell lymphoma and related lesions in a North American population.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Hepatitis A Virus Cellular Receptor 2 (HAVCR2/TIM3) encodes a transmembrane protein expressed by T cells and natural killer cells that acts as a negative immune checkpoint inhibitor."
    explanation: >-
      Background statement that TIM-3 is a transmembrane inhibitory checkpoint
      receptor, grounding the molecular function bound on this node.
  - reference: PMID:30792187
    reference_title: Frequent germline mutations of HAVCR2 in sporadic subcutaneous panniculitis-like T-cell lymphoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both missense mutations altered highly conserved residues located in the extracellular immunoglobulin variable-like domain."
    explanation: >-
      Localizes p.Tyr82Cys and p.Thr101Ile to the IgV domain.
  downstream:
  - target: TIM-3 Misfolding and Loss of Plasma Membrane Expression
    description: >-
      The substituted residues destabilize the IgV domain, so the protein
      misfolds and is not delivered to the cell surface.
- name: TIM-3 Misfolding and Loss of Plasma Membrane Expression
  biological_scale: MOLECULAR
  description: >-
    Variant TIM-3 misfolds and fails to reach the plasma membrane, so the
    inhibitory receptor is functionally absent from the surface of T cells and
    innate immune cells. Reduced TIM-3 expression is measurable by flow
    cytometry.

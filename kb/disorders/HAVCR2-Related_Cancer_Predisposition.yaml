    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For those patients who were not suitable for high-throughput sequencing, direct sequencing of HAVCR2 exon 2 was performed, covering all of the previously reported variants in patients with SPTCL (Y82C, I97M, T101I)."
    explanation: >-
      Direct exon 2 sequencing as the fallback genotyping method in an
      independent cohort.

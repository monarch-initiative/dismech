    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which could cover all 3 pathogenic variants reported in the literature (p.Y82C, p.I97M and p.T101I)."
    explanation: >-
      Exon 2 sequencing primers cover the three recurrent alleles.

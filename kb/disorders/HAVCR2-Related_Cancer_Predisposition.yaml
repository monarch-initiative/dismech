  downstream:
  - target: Macrophage Activation and Hemophagocytosis
    description: >-
      Cytokine excess activates macrophages, producing the HLH branch of the
      phenotype. The step from cytokine excess to clinical HLH is supported by
      genotype-phenotype association rather than by direct experiment.
  - target: Cytotoxic T-cell Infiltration of Subcutaneous Fat
    description: >-
      Chronic activation of cytotoxic alpha-beta T cells in the subcutis
      produces the panniculitic, lymphoma branch. The ordering of this step
      relative to the somatic mutations found in the tumor cells is inferred.
- name: Macrophage Activation and Hemophagocytosis
  biological_scale: TISSUE
  description: >-
    Activated macrophages phagocytose blood cells in bone marrow and other
    tissues, causing the HLH picture of fever, cytopenias,
    hyperferritinemia and organomegaly. HLH can complicate SPTCL or occur
    without lymphoma ("idiopathic" HLH), and its risk rises with the number
    of variant alleles.

name: HAVCR2-Related Cancer Predisposition
creation_date: "2026-11-03T19:15:04Z"
category: Mendelian
categories:
- Hereditary Cancer Predisposition
- Primary Immune Dysregulation
parents:
- Hereditary neoplastic syndrome
synonyms:
- HAVCR2-related SPTCL and/or HLH predisposition
- HAVCR2-related subcutaneous panniculitis-like T-cell lymphoma and/or hemophagocytic lymphohistiocytosis predisposition
- TIM-3 deficiency
- HLH-SPTCL
description: >-
  An autosomal recessive germline predisposition caused by loss-of-function
  missense variants in HAVCR2, which encodes the inhibitory immune checkpoint
  receptor TIM-3. The recurrent alleles (p.Tyr82Cys on an East Asian and
  Polynesian founder chromosome, p.Ile97Met in patients of European ancestry,
  and the rarer p.Thr101Ile) misfold the TIM-3 IgV domain and abolish its
  plasma membrane expression, removing a brake on T-cell and innate immune
  activation. The clinical spectrum runs from subcutaneous panniculitis-like
  T-cell lymphoma (SPTCL) alone, through SPTCL complicated by hemophagocytic
  lymphohistiocytosis (HLH), to HLH with no lymphoma at all. Onset is usually
  in childhood, adolescence or young adulthood, earlier in biallelic carriers
  than in patients without a germline variant. Disease typically responds to
  immunosuppression and to JAK inhibition, and lymphoma can recur as clonally
  unrelated episodes, which is why the condition is treated as a constitutional
  predisposition rather than as a property of one tumor.

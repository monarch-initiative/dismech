    explanation: >-
      Heterozygous p.Tyr82Cys carriers lacked the systemic complications seen
      in homozygotes, consistent with a recessive model.
  - reference: PMID:34535012
    reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering the minor allele frequency of HAVCRY82C in East Asian subjects is reportedly as high as 0.0036,6 we consider that monoallelic HAVCRY82C alterations alone are not sufficient to cause SPTCL."
    explanation: >-
      Authors' inference from population allele frequency that one

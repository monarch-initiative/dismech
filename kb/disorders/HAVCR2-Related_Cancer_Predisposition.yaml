  - reference: PMID:37840116
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma associated with hemophagocytic lymphohistiocytosis: a systematic review of 63 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The corticosteroid monotherapy experienced a higher recurrence rate than the corticosteroids plus other immunoregulatory agents therapy (66.7 vs. 0.0%, p = 0.029)."
    explanation: >-
      Favors combination over corticosteroid monotherapy in SPTCL-HLH; the
      review is not restricted to HAVCR2 carriers.
- name: Ruxolitinib
  description: >-
    JAK1/JAK2 inhibition has produced rapid and durable responses in children
    with homozygous p.Tyr82Cys who had failed corticosteroids,
    immunosuppressants or chemotherapy. Evidence is limited to case series and
    case reports.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Persistent Immune Activation and Inflammatory Cytokine Release
    description: >-
      Blocks JAK-dependent cytokine signalling downstream of the
      hyperinflammatory state.
    evidence:
    - reference: PMID:34535012
      reference_title: Genetic profiles of subcutaneous panniculitis-like T-cell lymphoma and clinicopathological impact of HAVCR2 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At the gene expression level, HAVCR2Y82C SPTCLs were enriched in genes involved in IL6-JAK-STAT3 signaling and in tumor necrosis factor-α signaling via NF-κB."
      explanation: >-
        Shows the JAK-STAT3 pathway that ruxolitinib targets is activated in
        p.Tyr82Cys tumors.
  evidence:
  - reference: PMID:37062931
    reference_title: Efficacy of ruxolitinib for HAVCR2 mutation-associated hemophagocytic lymphohistiocytosis and panniculitis manifestations in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, they responded well to ruxolitinib targeting inflammatory cytokines, allowing rapid disease resolution and/or long-term maintenance of remission."
    explanation: >-
      Responses to ruxolitinib in six children with homozygous p.Tyr82Cys.
  - reference: PMID:38748615
    reference_title: "Ruxolitinib Monotherapy for a Child With HAVCR2 Gene Mutation Associated Subcutaneous Panniculitis-like T-cell Lymphoma: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ruxolitinib, with its relatively low toxic side effects, can provide favorable outcomes."
    explanation: >-
      Single paediatric case treated with ruxolitinib monotherapy.
- name: Multiagent Chemotherapy
  description: >-
    Anthracycline-based chemotherapy is used for aggressive or refractory
    disease. In the Thai paediatric cohort it gave a numerically higher durable
    complete remission rate than immunosuppression, with more adverse events.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:39538229
    reference_title: Characteristics and therapeutic outcomes of subcutaneous panniculitis-like T-cell lymphoma with and without germline HAVCR2 mutations in Thai children and adolescents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Durable complete remission (CR) was achieved in 71.4% and 50.0% after first-line chemotherapy and IST, respectively (P=0.45); however, chemotherapy tended to increase any AEs compared to IST (57.1% vs. 12.5%; P=0.07)."
    explanation: >-
      Efficacy and toxicity of chemotherapy against immunosuppression.
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic transplantation is used for relapsed or refractory disease. In
    one reported case, a sibling donor matched for HLA turned out to be
    homozygous for an HAVCR2 variant and the recipient relapsed, so related
    donors should be genotyped.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: TIM-3 Misfolding and Loss of Plasma Membrane Expression
    description: >-
      Replacing the hematopoietic system with donor cells that express normal
      TIM-3; this link is inferred and depends on a donor without biallelic
      variants.
  evidence:
  - reference: PMID:37840116
    reference_title: "Subcutaneous panniculitis-like T-cell lymphoma associated with hemophagocytic lymphohistiocytosis: a systematic review of 63 patients reported in the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One case who received a sibling-identical SCT relapsed. Further analysis revealed a homozygous HAVCR2 mutation with the donor."
    explanation: >-
      Relapse after transplant from a homozygous sibling donor.
  - reference: PMID:32285995
    reference_title: TIM-3 deficiency presenting with two clonally unrelated episodes of mesenteric and subcutaneous panniculitis-like T-cell lymphoma and hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five years later, he developed a clonally unrelated SPTCL and underwent hematopoietic stem cell transplantation."
    explanation: >-
      Transplantation after a second, clonally unrelated lymphoma.
- name: Genetic Counseling and Family Testing
  description: >-
    Recessive inheritance gives siblings of an affected patient a 25% chance of
    a biallelic genotype, and the genotype matters for sibling donor
    selection.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34398459
    reference_title: Subcutaneous panniculitis-like T-cell lymphoma in a 14-year-old female homozygous for HAVCR2 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dermatologists should be aware of the diagnostic, management and familial genetic counselling utility of HAVCR2 for investigating and managing patients with SPTCL."
    explanation: >-

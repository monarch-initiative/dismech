name: IL6ST-Related Hyper-IgE Syndrome (Autosomal Dominant)
creation_date: "2026-11-06T18:30:00Z"
category: Mendelian
synonyms:
- HIES4A
- hyper-IgE recurrent infection syndrome 4A, autosomal dominant
- gp130-dependent hyper-IgE syndrome
- autosomal dominant IL6ST deficiency
disease_term:
  preferred_term: hyper-IgE recurrent infection syndrome 4A, autosomal dominant
  term:
    id: MONDO:0800131
    label: hyper-IgE recurrent infection syndrome 4A, autosomal dominant
description: >-
  IL6ST-related autosomal-dominant hyper-IgE syndrome (hyper-IgE recurrent
  infection syndrome 4A, HIES4A) is a primary immunodeficiency and connective-tissue
  disorder caused by heterozygous truncating variants in IL6ST encoding the
  shared cytokine receptor subunit gp130. Truncating variants distal to the
  transmembrane domain remove the internalization motif and STAT3-recruiting
  tyrosines, causing cell-surface accumulation of mutant gp130 and dominant-negative
  impairment of IL-6, IL-11, LIF, and OSM signaling. Affected individuals present
  with markedly elevated serum IgE, eosinophilia, chronic eczema, recurrent
  sinopulmonary and staphylococcal cutaneous infections complicated by cystic
  bronchiectasis and pneumatoceles, and skeletal/dental anomalies including
  scoliosis, joint hypermobility, and retained primary teeth, while preserving
  hepatic acute-phase responses.

notes: >-
  Hyper-IgE recurrent infection syndrome 4A (HIES4A, OMIM 619752;
  MONDO:0800131) is autosomal-dominant hyper-IgE syndrome caused by heterozygous
  truncating IL6ST variants. The mutant gp130 keeps its transmembrane domain but
  loses the recycling motif and the four STAT3-binding tyrosines, accumulates at
  the cell surface, and acts dominant-negatively on IL-6, IL-11, LIF and OSM
  signalling (not by haploinsufficiency - heterozygous IL6ST truncations occur
  in gnomAD without disease). The clinical picture phenocopies STAT3
  dominant-negative HIES (elevated IgE, eosinophilia, eczema, recurrent
  sinopulmonary and cold skin infections with pneumatoceles and bronchiectasis,
  scoliosis and retained deciduous teeth), but the acute-phase response is
  preserved and, unlike partial-LOF HIES4B, craniosynostosis is generally
  absent.

  IL6ST is pleiotropic and the allelic disorders are distinct entities: the
  recessive partial-LOF HIES4B (OMIM 618523), the recessive complete-LOF
  extended Stuve-Wiedemann syndrome (STWS2, OMIM 619751), and somatic
  gain-of-function inflammatory hepatocellular adenoma. Fewer than 30 patients
  with dominant-negative IL6ST HIES have been reported. The founding cohort is
  Beziat et al. 2020 (PMID:32207811, J Exp Med; 12 patients, 8 kindreds).
  No GeneReviews chapter covers IL6ST-related hyper-IgE syndrome.

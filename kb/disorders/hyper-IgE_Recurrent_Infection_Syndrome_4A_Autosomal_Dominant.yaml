    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Moreover, the patients' heterozygous leukocytes and fibroblasts respond poorly to IL-6 and IL-11."
    explanation: Patient cells show impaired IL-6 and IL-11 responses, the core signalling defect.
  downstream:

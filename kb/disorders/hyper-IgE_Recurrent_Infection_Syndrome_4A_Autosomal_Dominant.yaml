genetic:
- name: IL6ST
  presence: PRESENT
  gene_term:
    preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
  features: >-
    IL6ST (chromosome 5q11.2; gp130, the shared signal transducer of the IL-6
    cytokine family) causes autosomal-dominant hyper-IgE syndrome 4A (HIES4A,
    OMIM 619752) through heterozygous truncating variants acting by a
    dominant-negative mechanism. IL6ST is pleiotropic: biallelic partial
    loss-of-function causes autosomal-recessive HIES4B (OMIM 618523, with
    craniosynostosis and impaired acute-phase response), biallelic complete
    loss-of-function causes an extended Stuve-Wiedemann syndrome (STWS2, OMIM
    619751), and somatic gain-of-function drives inflammatory hepatocellular
    adenoma - all distinct entities.
  variants:
  - name: p.Thr761IlefsTer29
    description: Recurrent frameshift (c.2281dup) truncating gp130 after the transmembrane domain; accumulates at the cell surface and is dominant-negative.
    evidence:
    - reference: PMID:32207811
      reference_title: "Dominant-negative mutations in human IL6ST underlie hyper-IgE syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "The I719fs and T761fs IL6ST mutants accumulate at the cell surface and are LOF."
      explanation: Shows the recurrent T761fs mutant accumulates at the cell surface and is loss of function.
  - name: p.Tyr759Ter
    description: Nonsense variant truncating gp130 distal to the transmembrane domain, removing the STAT3-binding tyrosines; dominant-negative.
    evidence:
    - reference: PMID:32207811
      reference_title: "Dominant-negative mutations in human IL6ST underlie hyper-IgE syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "L708*, I719fs, C733*, S742fs, S754*, Y759*, and T761fs mutants, the only mutants identified that accumulate at the cell surface, exert a strong DN effect for all GP130-dependent cytokines tested, including IL-6 trans-signaling (IL-6/IL-6Rα)."
      explanation: Lists the seven truncating mutants (including Y759*) that act dominant-negatively.
  evidence:
  - reference: PMID:32207811
    reference_title: "Dominant-negative mutations in human IL6ST underlie hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified seven different truncating mutations, one of which was recurrent."
    explanation: Establishes IL6ST truncating variants as the cause in the cohort.

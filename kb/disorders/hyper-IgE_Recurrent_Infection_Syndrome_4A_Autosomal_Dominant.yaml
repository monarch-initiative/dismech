pathophysiology:
- name: gp130 (IL6ST) Dominant-Negative Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Heterozygous truncating IL6ST variants encode a gp130 receptor that keeps
    its extracellular and transmembrane domains but loses the distal cytoplasmic
    tail (the recycling motif and the four STAT3-recruiting tyrosines). The
    mutant receptor accumulates at the cell surface and poisons signalling
    complexes formed with wild-type gp130 - a dominant-negative, not a
    haploinsufficiency, mechanism.
  genes:
  - preferred_term: IL6ST
    term:
      id: hgnc:6021
      label: IL6ST
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: gp130 cytokine receptor activity
    modifier: DECREASED
    term:
      id: GO:0004896
      label: cytokine receptor activity
  evidence:
  - reference: PMID:32207811
    reference_title: "Dominant-negative mutations in human IL6ST underlie hyper-IgE syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Upon overexpression, the mutant proteins accumulate at the cell surface and are loss of function and DN for cellular responses to IL-6, IL-11, LIF, and OSM."
    explanation: Establishes the dominant-negative loss-of-function mechanism of the mutant gp130 receptor.
  downstream:
  - target: Impaired IL-6 Family (gp130) Cytokine Signaling
    causal_link_type: DIRECT
    description: Dominant-negative gp130 blocks signalling by IL-6, IL-11, LIF and OSM.
- name: Impaired IL-6 Family (gp130) Cytokine Signaling
  biological_scale: MOLECULAR
  description: >-
    gp130 is the shared signal transducer of the IL-6 cytokine family. Patient
    leukocytes and fibroblasts respond poorly to IL-6 and IL-11, with impaired
    STAT3 activation; LIF and OSM responses are also reduced, while residual
    signalling preserves the hepatic acute-phase response.
  biological_processes:
  - preferred_term: interleukin-6-mediated signaling pathway
    modifier: DECREASED
    term:
      id: GO:0070102
      label: interleukin-6-mediated signaling pathway
  evidence:

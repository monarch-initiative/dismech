name: Bamforth-Lazarus Syndrome
creation_date: "2026-11-02T00:00:00Z"
category: Mendelian
description: >-
  Bamforth-Lazarus syndrome is a rare autosomal recessive syndromic form of
  congenital hypothyroidism caused by biallelic pathogenic variants in FOXE1
  (TTF-2 / FKHL15), a forkhead/winged-helix-domain transcription factor required
  for thyroid gland morphogenesis and secondary palate fusion. The cardinal
  features are congenital hypothyroidism from thyroid dysgenesis (usually
  athyreosis), cleft palate and spiky hair, with variable choanal atresia and
  bifid epiglottis. ClinGen's Craniofacial Malformations GCEP splits the FOXE1
  disease associations into three entities; this entry is scoped to the
  autosomal recessive Bamforth-Lazarus syndrome (MIM 241850), distinct from
  FOXE1-associated nonmedullary thyroid cancer and from isolated athyreosis.
synonyms:
- thyroid agenesis-cleft palate-spiky hair syndrome
- Bamforth syndrome
- thyroid dysgenesis-cleft palate syndrome
- FOXE1-related athyreosis with cleft palate
parents:
- Hereditary disease
- Endocrine system disorder
- Syndromic disease
notes: >-
  FOXE1 is the human homologue of mouse Titf2 (TTF-2). The classic triad is
  thyroid agenesis, cleft palate and spiky hair; choanal atresia and bifid
  epiglottis are variable. ClinGen records the mechanism of pathogenicity as not
  yet established: most reported forkhead-domain variants impair DNA binding and
  transcriptional function (loss of function), but at least one variant (p.R73S)
  enhances target-gene activity, so a single functional_impact_category is not
  asserted here. "Spiky hair" is a characteristic feature with no exact HPO term;
  it is recorded with a free-text preferred_term rather than bound to a coarser
  hair-morphology term.
disease_term:
  preferred_term: Bamforth-Lazarus syndrome
  term:
    id: MONDO:0009437
    label: Bamforth-Lazarus syndrome
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Bamforth-Lazarus syndrome is caused by biallelic (usually homozygous)
    pathogenic variants in FOXE1, typically in consanguineous families.
  evidence:
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings with thyroid agenesis, cleft palate and choanal atresia are homozygous for a missense mutation (Ala65Val) within its forkhead domain."
    explanation: Establishes recessive, homozygous FOXE1 inheritance in the founding sibling pair.
pathophysiology:
- name: FOXE1 Forkhead Transcription Factor Dysfunction
  description: >-
    Biallelic FOXE1 variants disrupt the function of the forkhead/winged-helix
    transcription factor TTF-2. Most reported forkhead-domain mutations impair
    DNA binding and transcriptional activity; FOXE1 is expressed in the
    developing thyroid, foregut endoderm and craniopharyngeal ectoderm, so its
    dysfunction is the shared initiating lesion across the thyroid and
    craniofacial features of the syndrome.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FOXE1
    term:
      id: hgnc:3806
      label: FOXE1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  downstream:
  - target: Thyroid Dysgenesis
    causal_link_type: DIRECT
  - target: Impaired Palatal Shelf Fusion
    causal_link_type: DIRECT
  - target: Choanal atresia
    causal_link_type: DIRECT
    description: FOXE1 expression in foregut/craniofacial development; its loss produces choanal atresia.
  - target: Bifid epiglottis
    causal_link_type: DIRECT
    description: Variable laryngeal developmental defect from FOXE1 dysfunction.
  evidence:
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant protein exhibits impaired DNA binding and loss of transcriptional function."
    explanation: Establishes impaired DNA binding and transcriptional loss of function for the founding FOXE1 forkhead-domain variant.
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TTF-2 is a member of the forkhead/winged-helix domain transcription factor family, many of which are key regulators of embryogenesis."
    explanation: Identifies FOXE1/TTF-2 as a forkhead transcription factor regulating embryogenesis.
- name: Thyroid Dysgenesis
  description: >-
    FOXE1 drives thyroid gland morphogenesis; its expression in thyroid
    precursors is down-regulated as they cease migration. Loss of FOXE1 function
    arrests thyroid development, producing thyroid agenesis (athyreosis) or a
    sublingual/hypoplastic gland.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  biological_processes:
  - preferred_term: thyroid gland development
    term:
      id: GO:0030878
      label: thyroid gland development
    modifier: DECREASED
  downstream:
  - target: Thyroid agenesis
    causal_link_type: DIRECT
  - target: Thyroid Hormone Deficiency from Thyroid Dysgenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9697704
    reference_title: "A mouse model for hereditary thyroid dysgenesis and cleft palate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of Titf2 in thyroid cell precursors is down-regulated as they cease migration, suggesting that this factor is involved in the process of thyroid gland morphogenesis."
    explanation: Establishes the role of FOXE1/Titf2 in thyroid gland morphogenesis whose loss causes dysgenesis.
  - reference: PMID:9697704
    reference_title: "A mouse model for hereditary thyroid dysgenesis and cleft palate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Titf2-null mutant mice exhibit cleft palate and either a sublingual or completely absent thyroid gland."
    explanation: The Titf2-null mouse recapitulates thyroid dysgenesis (sublingual or absent gland) and cleft palate.
- name: Thyroid Hormone Deficiency from Thyroid Dysgenesis
  conforms_to: "hypothyroidism_thyroid_hormone_deficiency#Impaired Thyroid Hormone Synthesis"
  description: >-
    With the thyroid gland absent or severely hypoplastic, thyroid hormone cannot
    be synthesised, producing congenital hypothyroidism. Here the disorder-specific
    lesion substituted into the conserved hypothyroidism pathway is thyroid
    agenesis rather than dyshormonogenesis or autoimmune destruction.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: thyroid hormone generation
    term:
      id: GO:0006590
      label: thyroid hormone generation
    modifier: DECREASED
  downstream:
  - target: Congenital hypothyroidism
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9697704
    reference_title: "A mouse model for hereditary thyroid dysgenesis and cleft palate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutation of Titf2-/- results in neonatal hypothyroidism that shows similarity to thyroid dysgenesis in humans."
    explanation: Links the thyroid dysgenesis to neonatal (congenital) hypothyroidism.
- name: Impaired Palatal Shelf Fusion
  description: >-
    FOXE1 directly regulates MSX1 and TGF-beta3, which are required for secondary
    palate fusion. Loss of FOXE1 function reduces palatal MSX1 and TGF-beta3
    expression and prevents palatal shelf fusion, causing cleft palate.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: DECREASED
  downstream:
  - target: Cleft palate
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21177256
    reference_title: "MSX1 and TGF-beta3 are novel target genes functionally regulated by FOXE1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In 14-day Foxe1(-/-) mice embryos, Tgf-β3 and Msx1 mRNAs were almost absent in palatal shelves compared with Foxe1(+/-) embryos."
    explanation: Shows FOXE1 loss depletes the palatal MSX1/TGF-beta3 program required for palate fusion.
  - reference: PMID:21177256
    reference_title: "MSX1 and TGF-beta3 are novel target genes functionally regulated by FOXE1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MSX1 and TGF-β3 are direct FOXE1 targets."
    explanation: Establishes MSX1 and TGF-beta3 as direct FOXE1 transcriptional targets in palatogenesis.

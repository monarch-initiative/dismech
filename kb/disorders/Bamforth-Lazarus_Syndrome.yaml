diagnosis:
- name: Newborn congenital hypothyroidism screening
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Congenital hypothyroidism is detected on newborn screening; thyroid imaging
    then demonstrates thyroid agenesis or hypoplasia.
  results: >-
    Elevated TSH with low thyroid hormone on newborn screening; absent or
    hypoplastic thyroid on imaging.
  evidence:
  - reference: PMID:9697704
    reference_title: "A mouse model for hereditary thyroid dysgenesis and cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the one in three to four thousand newborns in which congenital hypothyroidism is detected, 80% have either an ectopic, small and sublingual thyroid, or have no thyroid tissue."
    explanation: Establishes newborn detection of congenital hypothyroidism and the structural thyroid findings.
- name: FOXE1 molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Sequencing of FOXE1 identifies biallelic pathogenic variants, confirming the
    syndromic (rather than isolated) basis of the congenital hypothyroidism.
  results: >-
    Identification of biallelic pathogenic FOXE1 variants confirms the diagnosis.
  evidence:
  - reference: PMID:24219130
    reference_title: "A novel FOXE1 mutation (R73S) in Bamforth-Lazarus syndrome causing increased thyroidal gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FOXE1 was sequenced in eight patients with thyroid dysgenesis and cleft palate."
    explanation: Illustrates FOXE1 sequencing in patients with the thyroid-dysgenesis-plus-cleft-palate phenotype.
epidemiology:
- name: Rarity
  description: >-
    Bamforth-Lazarus syndrome is rare; it is a syndromic minority among the
    congenital hypothyroidism caused by thyroid dysgenesis, which itself affects
    roughly one in three to four thousand newborns.
  evidence:
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital hypothyroidism occurs in one of every three to four thousand newborns, owing to complete or partial failure of thyroid gland development."
    explanation: Gives the population frequency of congenital hypothyroidism, of which this syndrome is a rare syndromic cause.

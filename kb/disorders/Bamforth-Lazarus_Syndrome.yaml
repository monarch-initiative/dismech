genetic:
- name: FOXE1
  gene_term:
    preferred_term: FOXE1
    term:
      id: hgnc:3806
      label: FOXE1
  relationship_type: CAUSATIVE
  features: >-
    Biallelic FOXE1 variants cluster in the forkhead DNA-binding domain. The
    founding allele is the homozygous missense Ala65Val; most reported
    forkhead-domain mutations impair DNA binding and transcriptional function,
    while the atypical p.R73S allele instead enhances target-gene activity, so a
    single loss-vs-gain functional category is not assigned at the gene level.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_0a00a763-90dc-4d36-8b34-54cf4f477269-2024-05-16T160000.000Z
    evidence:
    - reference: CGGV:assertion_0a00a763-90dc-4d36-8b34-54cf4f477269-2024-05-16T160000.000Z
      reference_title: "FOXE1 / Bamforth-Lazarus syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "FOXE1 | HGNC:3806 | Bamforth-Lazarus syndrome | MONDO:0009437 | AR | Definitive | SOP10 | Craniofacial Malformations Gene Curation Expert Panel | 2024-05-16T16:00:00.000Z"
      explanation: ClinGen Craniofacial Malformations GCEP classifies the FOXE1-Bamforth-Lazarus relationship as Definitive (AR).
  variants:
  - name: Ala65Val
    description: Homozygous forkhead-domain missense allele in the founding sibling pair; impairs DNA binding and transcription.
    evidence:
    - reference: PMID:9697705
      reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two siblings with thyroid agenesis, cleft palate and choanal atresia are homozygous for a missense mutation (Ala65Val) within its forkhead domain."
      explanation: Reports the founding homozygous Ala65Val forkhead-domain allele.
  - name: p.R73S
    description: Atypical homozygous forkhead-domain missense allele that enhances TG and TPO promoter activity rather than causing loss of function.
    evidence:
    - reference: PMID:24219130
      reference_title: "A novel FOXE1 mutation (R73S) in Bamforth-Lazarus syndrome causing increased thyroidal gene expression."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "this mutant gene enhanced the activity of the TG and TPO gene promoters (1.5-fold and 1.7-fold respectively vs. wild type FOXE1; p<0.05), unlike the five mutations previously reported in Bamforth-Lazarus syndrome."
      explanation: Reports the atypical gain-of-activity p.R73S allele, distinct from the usual loss-of-function variants.
  evidence:
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that the transcription factor FKHL15 (ref. 11) is the human homologue of mouse TTF-2 (encoded by the Titf2 gene)"
    explanation: Establishes FOXE1 (FKHL15 / TTF-2) as the causative gene for the syndrome.
treatments:
- name: Levothyroxine replacement
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Congenital hypothyroidism from thyroid agenesis requires lifelong thyroid
    hormone (levothyroxine) replacement, started as early as possible after
    newborn screening to prevent neurodevelopmental sequelae.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:18332
        label: L-thyroxine
  evidence:
  - reference: PMID:9697704
    reference_title: "A mouse model for hereditary thyroid dysgenesis and cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal screening and early thyroid hormone therapy have eliminated most of the clinical consequences of hypothyroidism"
    explanation: Supports early thyroid hormone replacement as the mainstay of managing the congenital hypothyroidism.
- name: Cleft palate surgical repair
  therapeutic_modality: SURGERY
  description: >-
    Cleft palate is managed with surgical repair and multidisciplinary
    craniofacial care; choanal atresia may require surgical correction.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:24219130
    reference_title: "A novel FOXE1 mutation (R73S) in Bamforth-Lazarus syndrome causing increased thyroidal gene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital hypothyroidism (CH) with thyroid dysgenesis (usually athyreosis), cleft palate, spiky hair, with or without choanal atresia, and bifid epiglottis."
    explanation: Establishes cleft palate (and choanal atresia) as the surgically managed structural features.
- name: Genetic counseling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance, often in consanguineous families, warrants
    genetic counseling and molecular confirmation of biallelic FOXE1 variants.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:9697705
    reference_title: "Mutation of the gene encoding human TTF-2 associated with thyroid agenesis, cleft palate and choanal atresia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings with thyroid agenesis, cleft palate and choanal atresia are homozygous for a missense mutation (Ala65Val) within its forkhead domain."
    explanation: The homozygous recessive inheritance underlies genetic counseling.

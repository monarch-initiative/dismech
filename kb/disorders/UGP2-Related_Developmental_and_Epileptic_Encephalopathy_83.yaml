discussions:
- discussion_id: mismatch_ugp2_knockin_lamp2_glycosylation
  prompt: Does the recurrent patient-genotype start-loss allele cause protein hypoglycosylation in a model with a complete brain-like isoform switch?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Protein hypoglycosylation
  rationale: >-
    Complete-knockout NSCs show rescued LAMP2 hypoglycosylation, but the
    patient-genotype knock-in model retains residual UGP2 and shows no LAMP2
    glycosylation change. A model completing the fetal-brain isoform switch is
    needed to determine whether this branch applies to the human genotype.
  evidence:
  - reference: PMID:31820119
    reference_title: "Loss of UGP2 in brain leads to a severe epileptic encephalopathy, emphasizing that bi-allelic isoform-specific start-loss mutations of essential genes can cause genetic diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The absence of changes in LAMP2 glycosylation in KI cells is likely
      explained by a non-complete isoform switch upon in vitro NSC
      differentiation, resulting in residual UGP2 levels
    explanation: The figure legend explicitly records the patient-genotype model's negative LAMP2 result and its proposed technical explanation.
references:
- reference: PMID:31820119
  title: "Loss of UGP2 in brain leads to a severe epileptic encephalopathy, emphasizing that bi-allelic isoform-specific start-loss mutations of essential genes can cause genetic diseases."
review_notes: >-
  This review deliberately limits DEE83 to the recurrent isoform-specific
  short-transcript start-loss syndrome reported in 22 individuals from 15
  families; it does not generalize these findings to every possible biallelic
  UGP2 disorder. The sole disease-specific primary publication supplies a rich
  clinical cohort, engineered and patient-derived neural models, zebrafish
  modeling, and public RNA-seq dataset GSE137129. No matching GeneReviews chapter
  or repository deep-research artifact was found. Mechanism nodes were atomized
  and all serialized causal edges retain evidence calibrated to their source.
  The disease-defining and visual endpoints are linked through explicitly
  unknown intermediates; other phenotypes remain unwired where the study offers
  only biologic plausibility. Cohort-wide frequencies for many additional HPO
  annotations reside in supplementary material that is not present in the
  cached main text, so those frequency claims are intentionally not imported;
  the main-text-quotable nystagmus, hypermetropia, hyperreflexia, infant feeding
  difficulty, sloping forehead, bitemporal narrowing, high hairline, and arched
  eyebrow findings are retained without fabricated cohort frequency bands. The
  main text says foveal hypopigmentation, not the
  HPOA near-neighbor foveal hypoplasia, so that term is not promoted. The
  complete-knockout glycosylation result and
  patient-genotype knock-in null result are both retained, and the contradicted
  hypoglycosylation-to-UPR dependency was removed. Treatment evidence is
  limited to unsuccessful symptomatic seizure management; no disease-modifying
  therapy or disorder-specific clinical trial is established.

- congenital disorder of glycosylation
classifications:
  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: >-
      UGP2 produces UDP-glucose, a substrate for glycogen synthesis and protein
      glycosylation; the classification describes the biochemical pathway and
      does not broaden this entry beyond isoform-specific DEE83. The
      classification is provisional because LAMP2 hypoglycosylation was observed
      in complete-knockout, not patient-genotype knock-in, neural stem cells.
    evidence:
    - reference: PMID:31820119
      reference_title: "Loss of UGP2 in brain leads to a severe epileptic encephalopathy, emphasizing that bi-allelic isoform-specific start-loss mutations of essential genes can cause genetic diseases."
      supports: PARTIAL

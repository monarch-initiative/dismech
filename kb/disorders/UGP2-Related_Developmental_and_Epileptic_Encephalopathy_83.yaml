name: UGP2-related developmental and epileptic encephalopathy 83
creation_date: "2026-07-06T06:04:18Z"
description: >-
  Developmental and epileptic encephalopathy 83 (DEE83) is a severe autosomal
  recessive disorder caused in the reported cohort by a recurrent homozygous
  UGP2 variant that abolishes the short, brain-predominant isoform while leaving
  the long isoform functional. Reduced UGP2 and UDP-glucose in neural-lineage
  cells impair glycogen synthesis, activate the unfolded-protein response, and
  alter neuronal differentiation. Complete-knockout neural stem cells also show
  protein hypoglycosylation, but that readout was unchanged in the
  patient-genotype knock-in model. The clinical
  syndrome begins in early infancy with intractable seizures, profound
  developmental impairment, progressive microcephaly, cerebral atrophy, and
  visual dysfunction.
category: Mendelian

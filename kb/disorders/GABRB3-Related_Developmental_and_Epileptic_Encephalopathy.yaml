      Evidence source is OTHER because this sentence states the field's
      background assumption rather than reporting the study's own data.
  downstream:
  - target: Impaired Receptor Trafficking and Postsynaptic Clustering
    description: >-
      A recurrent cellular route to loss of function is failure to deliver and
      retain receptors at inhibitory synapses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31435640
      reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This suggests that impaired receptor localization to synapses is a common pathophysiological mechanism for GABRB3 mutations, although the extent of impairment may be different among mutant subunits.
      explanation: >-
        Identifies impaired synaptic receptor localization as the common cellular
        route by which GABRB3 variants lose function.
  - target: Disrupted Excitation-Inhibition Balance in Developing Networks
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

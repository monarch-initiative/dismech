genetic:
- name: GABRB3
  gene_term:
    preferred_term: GABRB3
    term:
      id: hgnc:4083
      label: GABRB3
  association: >-
    GABRB3 (15q12) encodes the GABA-A receptor beta-3 subunit. Heterozygous,
    almost always de novo, variants — predominantly missense, less often
    nonsense or truncating — cause developmental and epileptic encephalopathy
    43. Variants segregate into functionally opposite gain-of-function and
    loss-of-function classes that both cause encephalopathy but with distinct
    clinical profiles, and phenotype additionally correlates with the variant's
    position in the three-dimensional subunit structure (extracellular domain
    versus pore-lining transmembrane domain).
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal dominant (almost always de novo)
    evidence:
    - reference: PMID:34698933
      reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thirteen GABRB3 variants were novel, and 25 were de novo.
      explanation: >-
        Supports the dominant, predominantly de novo mode of inheritance for
        pathogenic GABRB3 variants.
  evidence:
  - reference: PMID:26645412
    reference_title: "GABRB3 mutations: a new and emerging cause of early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a SureSelectXT custom multiple gene panel covering 48 early infantile epileptic encephalopathy/developmental delay genes, a novel de novo GABRB3 heterozygous missense mutation, c.860C>T (p.Thr287Ile), was identified and confirmed on Sanger sequencing.
    explanation: >-
      Documents a de novo heterozygous GABRB3 missense variant causing early
      infantile epileptic encephalopathy.
  - reference: PMID:35383156
    reference_title: "Gain-of-function and loss-of-function GABRB3 variants lead to distinct clinical phenotypes in patients with developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that 44 pathogenic GABRB3 missense variants segregate into gain-of-function and loss-of-function groups and respective patients display distinct clinical phenotypes.
    explanation: >-
      Establishes the two-class functional architecture of the GABRB3 variant
      landscape across 74 patients.
  - reference: PMID:34906499
    reference_title: "Structural mapping of GABRB3 variants reveals genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in GABRB3 have been associated with a spectrum of phenotypes from severe developmental disorders and epileptic encephalopathies to milder epilepsy syndromes and mild intellectual disability (ID).
    explanation: >-
      Summarizes the allelic spectrum of GABRB3, of which this entry curates the
      encephalopathic end.

diagnosis:
- name: Trio exome/genome sequencing or epilepsy gene panel
  description: >-
    Diagnosis is molecular: identification of a heterozygous pathogenic GABRB3
    variant on a targeted epilepsy gene panel or on exome/genome sequencing,
    ideally in a proband-plus-parents (trio) design so that de novo status can be
    established. Chromosomal microarray should also be considered to exclude the
    mechanistically distinct 15q11.2-q13.1 deletion that also removes GABRB3.
  evidence:
  - reference: PMID:26645412
    reference_title: "GABRB3 mutations: a new and emerging cause of early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel genetic technologies, such as whole-exome/genome sequencing and multiple gene panels, will undoubtedly identify further cases, allowing more detailed electroclinical delineation of the GABRB3-related genotypic and phenotypic spectra.
    explanation: >-
      Supports gene panels and exome/genome sequencing as the diagnostic route
      for GABRB3-related epileptic encephalopathy.

- name: Functional (electrophysiological) variant classification
  description: >-
    Beyond confirming a variant, determining whether it is gain-of-function or
    loss-of-function has direct therapeutic consequences, because the two classes
    respond oppositely to drugs that raise tonic GABAergic current. Classification
    is done by two-electrode voltage-clamp or patch-clamp electrophysiology of
    the variant receptor, and the variant's structural location (extracellular
    domain versus pore-lining transmembrane domain) provides partial prediction
    when functional data are unavailable.
  evidence:
  - reference: PMID:34906499
    reference_title: "Structural mapping of GABRB3 variants reveals genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genotype-phenotype correlations will aid the genetic counseling and treatment of individuals affected by GABRB3-related disorders.
    explanation: >-
      Supports using variant structural/functional classification to inform
      counselling and treatment.
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This study demonstrates that functional genomics can explain beneficial and adverse anti-epileptic drug effects, and propose that vigabatrin should be considered in patients with clear loss-of-function GABRB3 variants.
    explanation: >-
      Directly ties functional classification of the variant to a drug-selection
      decision.

differential_diagnoses:
- name: Angelman syndrome (15q11.2-q13.1 deletion)
  description: >-
    Large maternal 15q11.2-q13.1 deletions remove GABRB3 together with UBE3A,
    GABRA5, GABRG3, and OCA2, and produce developmental delay, seizures, and
    hypotonia that overlap DEE43 clinically. The mechanism is different — a
    contiguous-gene deletion with UBE3A loss as the primary driver and GABRB3
    co-deletion as a severity modifier — and management and counselling differ,
    so chromosomal microarray should be used to separate the two. Ocular
    hypopigmentation, long attributed to OCA2 deletion, is at least partly a
    GABRB3 effect: deleting Gabrb3 alone causes near-complete loss of retinal
    pigmentation in mice.
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  evidence:
  - reference: PMID:9763493
    reference_title: "Mice lacking the beta3 subunit of the GABAA receptor have the epilepsy phenotype and many of the behavioral characteristics of Angelman syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study examines whether a loss or reduction in the GABAA receptor beta3 subunit (GABRB3) gene, contained within the AS deletion region, may contribute to the overall severity of AS.
    explanation: >-
      Frames GABRB3 as a gene within the Angelman deletion region contributing to
      that syndrome's severity — the basis for the clinical overlap and for
      keeping the two entities distinct.
  - reference: PMID:28009282
    reference_title: "Beyond Epilepsy and Autism: Disruption of GABRB3 Causes Ocular Hypopigmentation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report here a robust phenotype in the mouse in which deletion of Gabrb3 alone causes nearly complete loss of retinal pigmentation due to atrophied melanosomes, as evidenced by electron microscopy.
    explanation: >-
      Shows that GABRB3 loss alone drives ocular hypopigmentation, refining how
      the Angelman-region pigmentary phenotype should be attributed.

- name: Childhood absence epilepsy
  description: >-
    GABRB3 has a long-standing association with childhood absence epilepsy, a
    far milder, non-encephalopathic phenotype identified through family-based
    association rather than through de novo pathogenic variants. It sits at the
    opposite end of the GABRB3 allelic spectrum from DEE43 and is deliberately
    outside this entry's scope.
  disease_term:
    preferred_term: childhood absence epilepsy
    term:
      id: MONDO:0010826
      label: childhood absence epilepsy
  evidence:
  - reference: PMID:10509183
    reference_title: "Possible association between childhood absence epilepsy and the gene encoding GABRB3."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present data suggest that the tested polymorphism may be either directly involved in the etiology of CAE or in linkage disequilibrium with disease-predisposing sites.
    explanation: >-
      Supports a GABRB3 association with childhood absence epilepsy. Marked
      PARTIAL because the authors themselves cannot distinguish direct
      involvement from linkage disequilibrium.

- name: Lennox-Gastaut syndrome
  description: >-
    Lennox-Gastaut syndrome is an electroclinical syndrome diagnosis, not an
    alternative aetiology: a proportion of GABRB3-related DEE patients are
    labelled with it, and the two mouse knock-ins that model specific human
    GABRB3 variants (D120N, N328D) were both built to model GABRB3-associated
    Lennox-Gastaut syndrome. It is listed here because the syndromic label is
    what a patient usually carries before genetic testing, and it does not by
    itself identify the gene or predict the vigabatrin hazard, which depends on
    the variant's functional class.
  distinguishing_features:
  - >-
    The syndromic diagnosis describes seizure semiology and EEG pattern; it does
    not specify aetiology, and Lennox-Gastaut syndrome has many other genetic
    and structural causes.
  - >-
    Establishing GABRB3 as the cause requires molecular testing; the
    gain-of-function versus loss-of-function classification of the variant then
    determines whether vigabatrin is appropriate or hazardous.
  disease_term:
    preferred_term: Lennox-Gastaut syndrome
    term:
      id: MONDO:0016532
      label: Lennox-Gastaut syndrome
  evidence:
  - reference: PMID:31435640
    reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in GABRB3 have been increasingly recognized as a major cause for severe paediatric epilepsy syndromes such as Lennox-Gastaut syndrome, Dravet syndrome and infantile spasms with intellectual disability as well as relatively mild epilepsy syndromes such as childhood absence epilepsy.
    explanation: >-
      Places Lennox-Gastaut syndrome among the syndromic presentations GABRB3
      variants produce. Evidence source is OTHER because this sentence
      summarizes the field rather than reporting the study's own data.

- name: Epilepsy of infancy with migrating focal seizures
  description: >-
    EIMFS is likewise a syndromic presentation rather than a competing
    aetiology, and within GABRB3 it is not randomly distributed: it marks the
    most severe gain-of-function subgroup, whose variants reduce receptor
    desensitization at equilibrium and which also carries the earliest seizure
    onset, movement disorder, and risk of early mortality. Three of 26 patients
    in one GABRB3 cohort were diagnosed with EIMFS.
  distinguishing_features:
  - >-
    EIMFS has many genetic causes, KCNT1 being the most common; a GABRB3 cause
    is established only by sequencing.
  - >-
    Within GABRB3, an EIMFS presentation should raise suspicion of a
    reduced-desensitization gain-of-function variant, which is precisely the
    group in which vigabatrin is hazardous.
  disease_term:
    preferred_term: epilepsy of infancy with migrating focal seizures
    term:
      id: MONDO:0017385
      label: malignant migrating partial seizures of infancy
  evidence:
  - reference: PMID:37647766
    reference_title: "Correlations of receptor desensitization of gain-of-function GABRB3 variants with clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This included younger age of first seizure onset (median 0.5 months), movement disorders (dystonia and dyskinesia), epilepsy of infancy with migrating focal seizures (EIMFS) and risk of early mortality.
    explanation: >-
      Ties the EIMFS presentation to the reduced-desensitization gain-of-function
      subgroup rather than to GABRB3 disease generally.
  - reference: PMID:34698933
    reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven patients were diagnosed with developmental and epileptic encephalopathy (DEE), four with West syndrome, three with epilepsy of infancy with migrating focal seizures (EIMFS), one with epilepsy with myoclonic-atonic seizures (EMAS), one with Dravet syndrome, and one with febrile seizures plus (FS+).
    explanation: >-
      Quantifies EIMFS as 3 of 26 patients in a GABRB3 cohort.

treatments:
- name: Broad-spectrum antiseizure medication (valproate, levetiracetam, perampanel)
  description: >-
    Conventional antiseizure medications remain the mainstay, usually as
    polytherapy. In a 26-patient cohort, seizures were controlled in 57.7% of
    patients, most often with valproate, levetiracetam, or perampanel, so
    drug-resistance is common but far from universal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

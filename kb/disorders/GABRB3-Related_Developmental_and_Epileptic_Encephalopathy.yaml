      snippet: >-
        Hyperactivity, lack of coordination, and seizures are consistent with reduced presynaptic inhibition in spinal cord and impaired inhibition in higher cortical centers and/or pleiotropic developmental defects.
      explanation: >-
        Attributes the in vivo consequences of beta-3 subunit loss to impaired
        inhibition in cortical centres, the network-balance node.

- name: Impaired Receptor Trafficking and Postsynaptic Clustering
  role: intermediate
  biological_scale: CELLULAR
  description: >-
    Mutant beta-3 subunits reduce surface and synaptic receptor levels and, more
    strikingly, act in trans on the wild-type receptor pool: they impair
    postsynaptic clustering of wild-type gamma-2 subunits and prevent gamma-2
    from being incorporated into synaptic GABA-A receptors. Because gamma-2 is
    what anchors GABA-A receptors at the synapse, this converts a heterozygous
    subunit defect into a broader loss of synaptic inhibitory receptors. The same
    reduction in synaptic gamma-2 clustering is seen in Gabrb3 heterozygous
    knockout mice.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA-A receptor localization to the plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  cellular_components:
  - preferred_term: GABA-ergic synapse
    term:
      id: GO:0098982
      label: GABA-ergic synapse
  evidence:
  - reference: PMID:31435640
    reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, both mutant β3 subunits impaired postsynaptic clustering of wild-type GABAA receptor γ2 subunits and prevented γ2 subunits from incorporating into GABAA receptors at synapses, although by different cellular mechanisms.
    explanation: >-
      Demonstrates the trans-acting clustering defect by which mutant beta-3
      subunits deplete synaptic receptors beyond simple haploinsufficiency.
  - reference: PMID:31435640
    reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This suggests that impaired receptor localization to synapses is a common pathophysiological mechanism for GABRB3 mutations, although the extent of impairment may be different among mutant subunits.
    explanation: >-
      Generalizes impaired synaptic localization as a shared cellular mechanism
      across GABRB3 variants, with variant-dependent severity.
  - reference: PMID:31435640
    reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, wild-type γ2 subunits were reduced and less clustered at inhibitory synapses in Gabrb3+/- knockout mice.
    explanation: >-
      Confirms the synaptic clustering deficit in vivo in a heterozygous Gabrb3
      mouse, showing it is not an artifact of heterologous expression.
  downstream:
  - target: Disrupted Excitation-Inhibition Balance in Developing Networks
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31435640
      reference_title: "Synaptic clustering differences due to different GABRB3 mutations cause variable epilepsy syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, wild-type γ2 subunits were reduced and less clustered at inhibitory synapses in Gabrb3+/- knockout mice.
      explanation: >-
        Shows in vivo that the clustering defect depletes receptors at inhibitory
        synapses, which is what reduces inhibitory drive at the network node.

- name: Disrupted Excitation-Inhibition Balance in Developing Networks
  role: amplifier
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  biological_scale: CELLULAR
  description: >-
    Both functional classes converge here. GABA-A receptor signalling in
    developing cortical, hippocampal, and thalamocortical circuits is displaced
    from its normal set point — reduced in loss-of-function variants, excessive
    and mistimed (particularly in the tonic, extrasynaptic compartment) in
    gain-of-function variants. Either displacement destabilizes the balance
    between excitation and inhibition. In the Gabrb3 D120N knock-in mouse this
    manifests as reduced miniature inhibitory postsynaptic current amplitude in
    cortical neurons and prolonged spontaneous thalamocortical oscillations.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: ABNORMAL
  - preferred_term: synaptic transmission, GABAergic
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: ABNORMAL
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:32467926
    reference_title: "GABA(A) receptor β3 subunit mutation D120N causes Lennox-Gastaut syndrome in knock-in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, cortical neurons in thalamocortical slices from knock-in mice had reduced miniature inhibitory post-synaptic current amplitude and prolonged spontaneous thalamocortical oscillations.
    explanation: >-
      Provides direct circuit-level evidence that a disease-causing GABRB3
      variant shifts inhibitory synaptic drive and prolongs thalamocortical
      oscillations.
  - reference: PMID:32467926
    reference_title: "GABA(A) receptor β3 subunit mutation D120N causes Lennox-Gastaut syndrome in knock-in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, the Gabrb3+/D120N knock-in mouse recapitulated human Lennox-Gastaut syndrome seizure types and behavioural abnormalities and was caused by impaired inhibitory GABAergic signalling in the thalamocortical loop.
    explanation: >-
      Attributes the modelled human seizure phenotype specifically to impaired
      inhibitory GABAergic signalling in the thalamocortical loop.
  - reference: PMID:9108119
    reference_title: "Mice devoid of gamma-aminobutyrate type A receptor beta3 subunit have epilepsy, cleft palate, and hypersensitive behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GABA(A)-R density is approximately halved in brain of beta3-deficient mice, and GABA(A)-R function is severely impaired.
    explanation: >-
      Shows that removing the beta-3 subunit halves brain GABA-A receptor density
      and severely impairs receptor function, the loss-of-function extreme of
      this node.

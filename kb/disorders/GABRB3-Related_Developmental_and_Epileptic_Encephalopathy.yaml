- name: Drug-Resistant Epilepsy with Developmental Impairment
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint is chronic epilepsy that frequently resists
    antiseizure medication, together with global developmental delay and
    intellectual disability that ranges from mild to profound. Seizure control
    is achievable in a substantial minority — 57.7% in one cohort — and severity
    tracks with the variant's functional class and structural location rather
    than being uniform across the disease.
  cell_types:

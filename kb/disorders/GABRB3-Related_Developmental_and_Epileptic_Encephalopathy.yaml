inheritance:
- name: Autosomal dominant (almost always de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    DEE43 is inherited in an autosomal dominant manner, but affected individuals
    almost always carry a de novo heterozygous variant rather than an inherited
    one. In a Chinese multicenter cohort, 25 of 26 GABRB3 variants were de novo.
    Rare inherited transmission occurs, including from a clinically unaffected
    parent; a reported nonsense variant (p.Trp2Ter) was maternally inherited.
    Because most variants are de novo, recurrence-risk counselling should
    consider the possibility of undetected parental gonadal mosaicism.
  evidence:
  - reference: PMID:34698933
    reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen GABRB3 variants were novel, and 25 were de novo.
    explanation: >-
      Quantifies the de novo fraction (25 of 26 variants) in a multicenter
      GABRB3 epilepsy cohort, supporting a dominant, predominantly de novo
      mechanism.
  - reference: PMID:29390378
    reference_title: "Early onset epileptic encephalopathy with a novel GABRB3 mutation treated effectively with clonazepam: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing showed the mutation was present in her mother and absent in her father, indicating a maternal origin.
    explanation: >-
      Documents the exception to the de novo rule — an inherited (maternally
      transmitted) GABRB3 nonsense variant in a child with early-onset epileptic
      encephalopathy. Marked PARTIAL because a single case report establishes
      that inherited transmission occurs without quantifying how often.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence or incidence estimate exists for DEE43. The
    disorder was only molecularly delineated from 2015 onward and the published
    evidence base consists of multicenter case series of tens of patients
    (n = 26 to 74 per series), which describe the phenotype but cannot support a
    population rate. The prevalence_class is recorded as the qualitative
    ULTRA_RARE tier rather than a numeric band for this reason.
  evidence:
  - reference: PMID:26645412
    reference_title: "GABRB3 mutations: a new and emerging cause of early infantile epileptic encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GABRB3 is an emerging cause of early-onset epilepsy.
    explanation: >-
      Supports the characterization of DEE43 as a recently delineated and
      under-ascertained cause of early-onset epilepsy. Marked PARTIAL because it
      supports the rarity/emerging-diagnosis framing but provides no rate.

pathophysiology:
- name: GABRB3 Variant and Beta-3 Subunit Dysfunction
  role: trigger
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous, usually de novo, GABRB3 variant (predominantly missense,
    less often nonsense or truncating) alters the beta-3 subunit of the GABA-A
    receptor. The beta-3 subunit is highly expressed in the developing brain and
    is a component of the principal native synaptic (alpha1-beta3-gamma2) and
    extrasynaptic (alpha5-beta3-gamma2) receptor assemblies, so a single
    heterozygous variant perturbs a large fraction of brain GABA-A receptors.

discussions:
- discussion_id: controversy_gabrb3_gof_paradox
  prompt: >-
    Why do gain-of-function GABRB3 variants — which increase the potency of an
    inhibitory neurotransmitter receptor — produce an earlier-onset and more
    severe epileptic encephalopathy than loss-of-function variants?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Increase in GABA Sensitivity
  - pathophysiology#Disrupted Excitation-Inhibition Balance in Developing Networks
  rationale: >-
    The excitation-inhibition framework predicts that reduced GABAergic
    inhibition causes seizures, and GABA-A receptor epilepsy variants were
    presumed to act that way. GABRB3 breaks the prediction: the class of variants
    that increases GABAergic activity has the worse outcome. Candidate
    explanations include preferential amplification of tonic extrasynaptic
    current, depolarizing GABA responses in immature neurons with high
    intracellular chloride, and disruption of the developmental patterning role
    of GABAergic signalling — but these have not been discriminated
    experimentally, and the answer determines whether GABA-enhancing drugs help
    or harm a given patient.
  evidence:
  - reference: PMID:35383156
    reference_title: "Gain-of-function and loss-of-function GABRB3 variants lead to distinct clinical phenotypes in patients with developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, patients with GABRB3 variants that increase GABAergic activity have more severe developmental and epileptic encephalopathies. This paradoxical finding challenges our current understanding of the GABAergic system in epilepsy and how patients should be treated.
    explanation: >-
      States the paradox and its unresolved status in the authors' own words.

- discussion_id: mismatch_gabrb3_mouse_models_lof_only
  prompt: >-
    Do the available Gabrb3 mouse models represent the human gain-of-function
    arm of DEE43, or only its loss-of-function arm — and can drug-response
    findings from them (notably cannabidiol) be generalized across the two
    functional classes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Gain-of-Function Increase in GABA Sensitivity
  rationale: >-
    Every in vivo Gabrb3 model in current use sits on one side of the human
    disease. The constitutive knockout removes the subunit entirely, which is a
    loss-of-function extreme and additionally produces an Angelman-like
    phenotype rather than DEE43. The two knock-in lines (D120N, N328D) each model
    a single Lennox-Gastaut-associated human variant. No published model
    reproduces the reduced-desensitization gain-of-function subgroup that carries
    the earliest onset, movement disorder, and early-mortality risk in patients.
    This matters concretely: cannabidiol efficacy has been shown in the D120N
    line and is being read as a rationale for human use, but the functional class
    of D120N cannot be assumed to represent the gain-of-function patients in whom
    GABA-directed drugs behave oppositely.
  evidence:
  - reference: PMID:9763493
    reference_title: "Mice lacking the beta3 subunit of the GABAA receptor have the epilepsy phenotype and many of the behavioral characteristics of Angelman syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The loss of the single gene, gabrb3, in these mice is sufficient to cause phenotypic traits that have marked similarities to the clinical features of AS, indicating that impaired expression of the GABRB3 gene in humans probably contributes to the overall phenotype of Angelman syndrome.
    explanation: >-
      Shows the knockout is framed and validated as an Angelman syndrome model,
      not as a model of the human GABRB3 DEE gain-of-function spectrum.
  - reference: PMID:42274296
    reference_title: "Cannabidiol reduces atypical absence seizures and epileptic spasms in a Gabrb3(+/D120N) mouse model of Lennox-Gastaut syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gabrb3+/D120N mice display robust atypical absence seizures and neonatal spasms that respond to antiseizure agents, supporting the predictive validity of this model as a preclinical platform for LGS drug discovery.
    explanation: >-
      States the predictive-validity claim that this mismatch discussion asks to
      be tested across functional classes rather than assumed.

notes: >-
  Scope. This entry curates DEE43, the encephalopathic end of the GABRB3 allelic
  spectrum, anchored on MONDO:0014921. GABRB3's milder associations (childhood
  absence epilepsy, febrile seizures) and its role as a co-deleted severity
  modifier in Angelman syndrome are recorded as differentials rather than as
  subtypes, because those are separate disease entities with different
  mechanisms, not gradations of this one.

  Frequency provenance and its scope limit. The percentage-backed frequency
  bands come from published GABRB3-related-epilepsy cohorts, not from
  DEE43-restricted series. The 26-patient Yang cohort supplying most of them
  (focal seizures 92.3%, developmental delay 96.2%, fever sensitivity 53.8%,
  generalized tonic-clonic 23.1%, epileptic spasms 15.4%) is predominantly but
  not exclusively encephalopathic: it also contains one febrile-seizures-plus,
  one Dravet, and one myoclonic-atonic case. The bands should therefore be read
  as applying to GABRB3-related epilepsy broadly, and as close to but not
  identical with the DEE43 subset this entry is scoped to. A DEE43-restricted
  frequency set would need a cohort that has not yet been published.

  Curation provenance. Built from a claude_code deep-research report
  (research/GABRB3-Related_Developmental_and_Epileptic_Encephalopathy-deep-research-claude_code.md).
  Three errors in that report were caught and corrected during curation and are
  recorded here so they are not reintroduced: it gave GABRB3 as HGNC:4082 (that
  is GABRB2; the correct identifier is hgnc:4083), and it proposed HP:0032500
  for migrating focal seizures and HP:0002518 for Lennox-Gastaut syndrome, both
  of which are unrelated HPO terms (Exacerbated by tobacco use, and Abnormal
  periventricular white matter morphology respectively). Every ontology term in
  this entry was verified against OAK.

  Not curated for lack of citable evidence. Cluster seizures (80.8% in the Yang
  cohort) have no suitable HPO term and are described in prose instead. A
  ClinGen gene-disease validity assertion could not be cited because the pinned
  ClinGen gene_validity.csv checksum in data/clingen/MANIFEST.yaml no longer
  matches the upstream file, so `just clingen-refresh` fails; that is a
  repository maintenance issue independent of this entry.

  Datasets. `just discover-datasets` returned 12 candidates, all tagged DIRECT,
  and none of them is about GABRB3: they cover GLUL, CDKL5, SCN1A/Dravet, SCN8A,
  and PNPLA8 disease models and were surfaced by a text match on the phrase
  "developmental epileptic encephalopathy" in the entry name. That is the Named
  Entity Confusion pattern the curation SOP warns about reached through dataset
  search, so `datasets` is deliberately left empty rather than populated with
  accessions that resolve but describe a different disease. A GABRB3-specific
  omics dataset should be added if one is published; the receptor is studied
  almost entirely by targeted electrophysiology rather than by unbiased omics,
  so none may exist yet.

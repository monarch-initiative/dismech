- name: Gain-of-Function Increase in GABA Sensitivity
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    Gain-of-function variants raise the potency of GABA at the receptor (a
    leftward shift in the GABA concentration-response relationship) without
    necessarily changing maximal open probability or absolute current. Because
    tonic, extrasynaptic inhibition is driven by low ambient GABA
    concentrations, a potency increase disproportionately amplifies tonic
    chloride flux. Counterintuitively for a receptor whose job is inhibition,
    this class carries the more severe clinical phenotype: younger seizure
    onset, higher risk of severe intellectual disability, focal seizures at
    onset, hypotonia, and lower likelihood of seizure freedom.
  molecular_functions:
  - preferred_term: GABA-A receptor activity
    term:
      id: GO:0004890
      label: GABA-A receptor activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: chloride transmembrane transport
    term:
      id: GO:1902476
      label: chloride transmembrane transport
    modifier: INCREASED
  evidence:
  - reference: PMID:35383156
    reference_title: "Gain-of-function and loss-of-function GABRB3 variants lead to distinct clinical phenotypes in patients with developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gain-of-function cohort (n = 27 patients) presented with a younger age of seizure onset, higher risk of severe intellectual disability, focal seizures at onset, hypotonia, and lower likelihood of seizure freedom in response to treatment.
    explanation: >-
      Defines the gain-of-function class and its distinct, more severe clinical
      profile in a 74-patient cohort.
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Results showed an atypical gain-of-function molecular phenotype in the GABRB3 p.Glu77Lys and p.Thr287Ile variants characterized by increased potency of γ-aminobutyric acid A without change to the estimated maximum open channel probability, deactivation kinetics or absolute currents.
    explanation: >-
      Provides the electrophysiological definition of the gain-of-function
      phenotype as increased GABA potency rather than increased maximal current.
  downstream:
  - target: Altered Receptor Desensitization
    description: >-
      Within the gain-of-function class, desensitization kinetics further tune
      how much excess chloride flux persists at equilibrium.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37647766
      reference_title: "Correlations of receptor desensitization of gain-of-function GABRB3 variants with clinical severity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Of the 20 gain-of-function variants assessed, 13 were found to alter receptor desensitization properties.
      explanation: >-
        Shows that most gain-of-function variants additionally alter
        desensitization, supporting this edge from the gain-of-function node to
        the desensitization modifier.
  - target: Disrupted Excitation-Inhibition Balance in Developing Networks
    description: >-
      Excess tonic GABAergic conductance in immature cortical and thalamocortical
      circuits disturbs, rather than restores, network balance.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - gof_tonic_current_excess
    evidence:
    - reference: PMID:33585817
      reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Modelling of the activation properties of the receptors indicated that either variant caused increased chloride flux in response to low concentrations of γ-aminobutyric acid that mediate tonic currents.
      explanation: >-
        Provides the mechanistic step from increased GABA potency to excess tonic
        chloride flux, the change that displaces network excitation-inhibition
        balance. The link is marked INDIRECT_KNOWN_INTERMEDIATES because the
        measurement is of receptor-level flux, not of network balance itself.

- name: Altered Receptor Desensitization
  role: modifier
  biological_scale: MOLECULAR
  description: >-
    Desensitization — the decline of current during sustained agonist exposure —
    is a second, independent axis of gain-of-function severity. Variants that
    reduce desensitization at equilibrium sustain the excess conductance and
    worsen gain-of-function traits; these cluster in the pore-forming
    transmembrane region and are associated with the most severe outcomes
    (median first-seizure onset 0.5 months, movement disorder, migrating focal
    seizures, and risk of early mortality). Variants that instead accelerate
    current decay limit the gain-of-function effect, cluster in the activation
    coupling loops, and are associated with later onset and milder phenotypes.
  molecular_functions:
  - preferred_term: GABA-A receptor activity
    term:
      id: GO:0004890
      label: GABA-A receptor activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37647766
    reference_title: "Correlations of receptor desensitization of gain-of-function GABRB3 variants with clinical severity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Of the 20 gain-of-function variants assessed, 13 were found to alter receptor desensitization properties. Seven variants reduced desensitization at equilibrium, which acts to worsen gain-of-function traits. Six variants accelerated current decay kinetics, which limits gain-of-function traits.
    explanation: >-
      Establishes desensitization as a distinct modifier of the gain-of-function
      molecular phenotype, in two opposite directions.
  - reference: PMID:37647766
    reference_title: "Correlations of receptor desensitization of gain-of-function GABRB3 variants with clinical severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This included younger age of first seizure onset (median 0.5 months), movement disorders (dystonia and dyskinesia), epilepsy of infancy with migrating focal seizures (EIMFS) and risk of early mortality.
    explanation: >-
      Links reduced desensitization at equilibrium to the most severe clinical
      subgroup, including movement disorder and early-mortality risk.
  downstream:
  - target: Disrupted Excitation-Inhibition Balance in Developing Networks
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37647766
      reference_title: "Correlations of receptor desensitization of gain-of-function GABRB3 variants with clinical severity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Variants that reduced the desensitization at equilibrium were clustered in the transmembrane regions that constitute the channel pore and correlated with greater disease severity, while variants that accelerated current decay were clustered in the coupling loops responsible for receptor activation and correlated with lesser severity.
      explanation: >-
        Ties the direction of the desensitization change to the magnitude of
        downstream disease severity, supporting desensitization as a modifier of
        the network-level consequence.

- name: Loss-of-Function Reduction in GABA-A Receptor Function
  role: intermediate
  biological_scale: MOLECULAR
  description: >-
    The other functional class reduces GABA-A receptor function, the mechanism
    originally presumed to account for all GABA-A receptor epilepsies. These
    patients have a distinct clinical signature: febrile seizures at onset occur
    exclusively in this group, and treatment response is comparatively better.
  molecular_functions:
  - preferred_term: GABA-A receptor activity

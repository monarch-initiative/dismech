      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here we show that 44 pathogenic GABRB3 missense variants segregate into gain-of-function and loss-of-function groups and respective patients display distinct clinical phenotypes.
      explanation: >-
        Establishes the second of the two functional outcomes a GABRB3 variant

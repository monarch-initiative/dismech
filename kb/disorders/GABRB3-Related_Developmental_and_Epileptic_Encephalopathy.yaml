mechanistic_hypotheses:
- hypothesis_group_id: gof_tonic_current_excess
  hypothesis_label: >-
    Gain-of-function severity arises from excess tonic (extrasynaptic) GABAergic
    current during development
  status: EMERGING
  description: >-
    Under this model, the reason gain-of-function GABRB3 variants cause the more
    severe encephalopathy is that increased GABA potency preferentially
    amplifies tonic currents carried by extrasynaptic receptors responding to
    low ambient GABA. Excess tonic inhibition during the period when GABAergic
    signalling patterns developing circuits is proposed to be as damaging as too
    little. The strongest support is pharmacological and indirect: vigabatrin,
    which raises tonic GABA current, produces hypotonia, sedation, and
    respiratory suppression specifically in gain-of-function patients, whereas
    benzodiazepines, which act mainly on phasic synaptic currents, do not. It is
    recorded as EMERGING rather than canonical because no study has yet measured
    the proposed tonic-current excess in patient neurons or shown that
    normalizing it reverses the phenotype.
  evidence:
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We therefore propose that the hypersensitivity reaction to vigabatrin is a result of GABRB3 variants that exacerbate GABAergic tonic currents and caution is required when prescribing vigabatrin.
    explanation: >-
      States the tonic-current-excess model directly, as the proposed explanation
      for the gain-of-function vigabatrin hypersensitivity.


      GABRB3 is highly expressed early in the developing brain, and its encoded β3 subunit is critical for GABAA receptor assembly and trafficking as well as stem cell differentiation in embryonic brain.
    explanation: >-
      Supports the developmental expression and assembly/trafficking role of the
      beta-3 subunit that makes a heterozygous variant consequential. Evidence
      source is OTHER because this sentence is background framing citing prior
      work rather than a result of this study's own experiments.
  downstream:

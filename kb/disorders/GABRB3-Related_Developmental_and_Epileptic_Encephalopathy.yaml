      tonic compartment.
    evidence:
    - reference: PMID:33585817
      reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Benzodiazepines, including nitrazepam, are positive allosteric modulators of GABAA receptors that predominately affect phasic currents, usually through prolonging inhibitory postsynaptic currents
      explanation: >-
        Specifies the compartment (phasic, not tonic) in which benzodiazepines
        modulate inhibitory signalling, which is why they act on this node
        without the vigabatrin hazard.
  evidence:
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Benzodiazepines, including nitrazepam, are positive allosteric modulators of GABAA receptors that predominately affect phasic currents, usually through prolonging inhibitory postsynaptic currents
    explanation: >-
      Gives the pharmacological basis for why benzodiazepines behave differently

name: GABRB3-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-08-08T00:00:00Z"
category: Mendelian
description: >-
  A severe early-onset developmental and epileptic encephalopathy (DEE43,
  OMIM:617113) caused by heterozygous, almost always de novo, variants in
  GABRB3, which encodes the beta-3 subunit of the GABA-A receptor — the
  pentameric ligand-gated chloride channel that mediates most fast inhibitory
  neurotransmission in the brain. Seizures usually begin in the first year of
  life, are typically multiple in type and drug-resistant, and are accompanied
  by global developmental delay and intellectual disability. The defining
  mechanistic feature of this entry is that GABRB3 variants split into two
  functionally opposite classes that both cause epileptic encephalopathy:
  loss-of-function variants reduce GABA-gated current (often through impaired
  receptor trafficking and postsynaptic clustering), while gain-of-function
  variants increase GABA potency — and, paradoxically, it is the
  gain-of-function group that has the earlier onset and the more severe
  phenotype. This is not a curiosity: it inverts the expected pharmacology, so
  that vigabatrin, a standard infantile-spasms drug that raises tonic GABAergic
  current, is beneficial in loss-of-function patients but produces a
  hypersensitivity reaction in gain-of-function patients. This entry is scoped
  to the encephalopathic (DEE43) end of the GABRB3 allelic spectrum; the milder
  GABRB3-associated phenotypes (childhood absence epilepsy, febrile seizures)
  and the mechanistically distinct 15q11.2-q13.1 contiguous-gene deletion
  (Angelman syndrome, which also removes GABRB3) are recorded as differentials
  rather than as subtypes here.

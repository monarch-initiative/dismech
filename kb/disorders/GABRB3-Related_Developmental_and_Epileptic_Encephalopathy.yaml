    modifier: DECREASED
  evidence:
  - reference: PMID:35383156
    reference_title: "Gain-of-function and loss-of-function GABRB3 variants lead to distinct clinical phenotypes in patients with developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Febrile seizures at onset are exclusive to the loss-of-function cohort (n = 47 patients).
    explanation: >-
      Defines the loss-of-function class as a separable cohort with its own
      clinical onset signature.
  - reference: PMID:35383156
    reference_title: "Gain-of-function and loss-of-function GABRB3 variants lead to distinct clinical phenotypes in patients with developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These variants are presumed to cause loss-of-function receptors leading to reduced neuronal GABAergic activity.
    explanation: >-
      States the prior assumption that GABA-A receptor epilepsy variants act by

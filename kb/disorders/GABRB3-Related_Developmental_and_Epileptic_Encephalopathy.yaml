    reference_title: "GABRB3 mutations: a new and emerging cause of early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gamma-aminobutyric acid type A receptor β3 gene (GABRB3) encodes the β3-subunit of the gamma-aminobutyric acid type A (GABAA ) receptor, which mediates inhibitory signalling within the central nervous system.
    explanation: >-
      Establishes the gene product and its role as a subunit of the receptor
      mediating inhibitory signalling, the molecular starting point of this

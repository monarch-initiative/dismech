    - preferred_term: perampanel
      term:
        id: CHEBI:71013
        label: perampanel
  target_mechanisms:
  - target: Neuronal Hyperexcitability and Thalamocortical Hypersynchrony
    treatment_effect: INHIBITS
    description: >-
      These agents act downstream of the receptor lesion, suppressing network
      hyperexcitability rather than correcting the GABA-A receptor defect.
    evidence:
    - reference: PMID:34698933
      reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Seizures were controlled in 57.7% of patients by valproate, levetiracetam, or perampanel in the majority.
      explanation: >-
        Shows these agents suppress the seizure output of the hyperexcitable
        network in a majority of the patients who achieved control, without
        addressing the receptor lesion itself.
  evidence:
  - reference: PMID:34698933
    reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures were controlled in 57.7% of patients by valproate, levetiracetam, or perampanel in the majority.
    explanation: >-
      Directly reports the agents most often associated with seizure control and
      the proportion of patients controlled.
  - reference: PMID:34698933
    reference_title: "GABRB3-related epilepsy: novel variants, clinical features and therapeutic implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Valproate, levetiracetam and perampanel seem to have positive effects on seizure control for patients with GABRB3 variants.
    explanation: >-
      The authors' own summary of which agents appear effective in GABRB3-related
      epilepsy.

- name: Vigabatrin (variant-class dependent — contraindicated in gain-of-function)
  description: >-
    Vigabatrin inhibits GABA transaminase and thereby raises tonic GABAergic
    current. Its effect in GABRB3-related DEE depends on which functional class
    the variant belongs to, and getting this wrong is harmful rather than merely
    ineffective. In loss-of-function variants it is expected to be safe and
    effective and a truncating-variant patient responded well. In
    gain-of-function variants it produces a hypersensitivity reaction with
    hypotonia, sedation, and respiratory suppression, because it further
    exaggerates an already excessive tonic current. Functional or structural
    classification of the variant should therefore precede a vigabatrin trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  target_mechanisms:
  - target: Loss-of-Function Reduction in GABA-A Receptor Function
    treatment_effect: RESTORES
    description: >-
      By raising ambient GABA, vigabatrin compensates for reduced GABA-gated
      current in loss-of-function variants. The same action is the reason it is
      hazardous in gain-of-function variants.
    evidence:
    - reference: PMID:33585817
      reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In contrast, drug strategies increasing tonic currents in loss-of-function variants are likely to be a safe and effective therapy.
      explanation: >-
        States that raising tonic current is the appropriate corrective strategy
        specifically for loss-of-function variants. Evidence source is OTHER
        because this is the authors' therapeutic recommendation inferred from
        their electrophysiology, not a measured clinical or in vitro result.
  evidence:
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, vigabatrin, a drug that inhibits γ-aminobutyric acid transaminase to increase tonic γ-aminobutyric acid currents, has mixed success in treating seizures in patients with GABRB3 variants: some patients experience seizure cessation, but there is hypersensitivity in some patients associated with hypotonia, sedation and respiratory suppression.
    explanation: >-
      Documents both the benefit and the specific adverse reaction — hypotonia,
      sedation, respiratory suppression — that make vigabatrin variant-class
      dependent.
  - reference: PMID:33585817
    reference_title: "Gain-of-function GABRB3 variants identified in vigabatrin-hypersensitive epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We therefore propose that the hypersensitivity reaction to vigabatrin is a result of GABRB3 variants that exacerbate GABAergic tonic currents and caution is required when prescribing vigabatrin.
    explanation: >-
      Gives the mechanistic reason for the contraindication in gain-of-function
      variants and the explicit prescribing caution.

- name: Benzodiazepines (nitrazepam, clonazepam)
  description: >-
    Benzodiazepines are also GABA-potentiating, but they act predominantly on
    phasic synaptic currents rather than the tonic extrasynaptic currents that
    vigabatrin raises — which is the mechanistic reason they were tolerated by a
    gain-of-function patient who could not tolerate vigabatrin. A patient with
    the gain-of-function p.Glu77Lys variant stabilized on nitrazepam plus the
    ketogenic diet, and a separate case report describes complete seizure
    cessation on clonazepam.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

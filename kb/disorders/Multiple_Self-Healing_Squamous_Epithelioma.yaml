diagnosis:
- name: TGFBR1 genetic testing
  description: >-
    Detection of a constitutional TGFBR1 variant confirms the diagnosis. The
    variant class has to be read against the Loeys-Dietz spectrum, and some
    families with familial self-healing tumors have no detectable TGFBR1
    variant.
  diagnosis_term:
    preferred_term: TGFBR1 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of MSSE can be confirmed by detection of constitutional TGFBR1 mutations"
    explanation: >-
      Molecular confirmation of the diagnosis.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "No pathogenic TGFBR1 sequence variants or larger scale deletions or duplications of the TGFBR1 gene were detected in affected members of four families with familial self-healing skin tumors"
    explanation: >-
      A negative test does not exclude a familial self-healing tumor
      phenotype.
- name: Clinical and histopathological recognition
  description: >-
    Multiple tumors, onset at younger ages than sporadic keratoacanthoma, and a
    family history distinguish MSSE from sporadic keratoacanthoma, whose
    histology it shares.
  diagnosis_term:
    preferred_term: histopathologic examination of skin tumor
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MSSE tumors can usually be distinguished from keratoacanthomas because of the occurrence of multiple lesions, the earlier ages at which tumors develop and the familial nature of the condition."
    explanation: >-
      Clinical features that separate MSSE from sporadic keratoacanthoma.
differential_diagnoses:
- name: Loeys-Dietz syndrome 1
  disease_term:
    preferred_term: Loeys-Dietz syndrome 1
    term:
      id: MONDO:0012212
      label: Loeys-Dietz syndrome 1
  description: >-
    The allelic TGFBR1 aortopathy (kb entry Loeys-Dietz_Syndrome_1). It is
    separated from MSSE by variant class: Loeys-Dietz alleles are mostly
    missense variants in or near the kinase domain, whereas MSSE alleles are
    truncating or extracellular-domain missense loss-of-function alleles. Two
    patients with both conditions carried kinase-domain missense variants.
  distinguishing_features:
  - >-
    Aortic and arterial aneurysm and tortuosity, hypertelorism and bifid
    uvula, absent in MSSE.
  - >-
    Kinase-domain missense TGFBR1 alleles versus truncating or
    extracellular-domain missense alleles in MSSE.
  evidence:
  - reference: PMID:29706644
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results support the previously proposed but not yet approved mechanism that dominant-negative and truncating variants in STK domain induce LDS and MSSE, respectively."
    explanation: >-
      Splicing assays comparing an LDS and an MSSE splice variant.
  - reference: PMID:30513140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Multiple self-healing squamous epithelioma (MSSE, Ferguson-Smith disease) and Loeys-Dietz syndrome (LDS) are allelic conditions associated with pathogenic variants in the transforming growth factor beta receptor 1 gene (TGFBR1)."
    explanation: >-
      States that the two conditions are allelic at TGFBR1. The same report
      describes a p.Gly222Arg kinase-domain missense variant in a patient with
      features of both.

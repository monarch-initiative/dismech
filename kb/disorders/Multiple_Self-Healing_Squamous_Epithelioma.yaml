name: Multiple Self-Healing Squamous Epithelioma
creation_date: "2026-11-06T20:30:00Z"
category: Mendelian
description: >-
  Multiple self-healing squamous epithelioma (MSSE, Ferguson-Smith disease) is
  an autosomal dominant skin tumor predisposition caused by heterozygous
  germline loss-of-function variants in TGFBR1, the type I TGF-beta receptor.
  Carriers develop crops of rapidly growing, locally invasive skin tumors that
  resemble well-differentiated squamous cell carcinoma or keratoacanthoma,
  mostly on sun-exposed skin of the face, ears and limbs. Each tumor regresses
  spontaneously after several months and leaves a pitted scar; distant
  metastasis has not been reported. The first tumor appears between 8 and 81
  years of age in genotyped carriers, so onset can be in childhood or
  adolescence. Tumors show somatic loss of heterozygosity at TGFBR1 with loss
  of the wild-type allele, so TGFBR1 behaves as a tumor suppressor here. The
  disease is allelic with Loeys-Dietz syndrome 1 and is separated from it by
  variant class: MSSE alleles are truncating variants throughout the gene or
  missense variants in the extracellular ligand-binding domain, whereas
  Loeys-Dietz alleles are mostly missense variants in the kinase domain, and
  MSSE carriers are not reported to develop aortic aneurysms. Haplotype studies
  in Scottish families support a requirement for a permissive variant at a
  second, unidentified locus on 9q22.3. Radiotherapy is contraindicated because
  it provokes more numerous and more invasive tumors in the irradiated field.
synonyms:
- multiple self-healing squamous epithelioma
- MSSE
- Ferguson-Smith disease
- Ferguson-Smith syndrome
- multiple self-healing epithelioma of Ferguson-Smith
- multiple keratoacanthoma, Ferguson-Smith type
parents:
- hereditary neoplastic syndrome
disease_term:
  preferred_term: multiple self-healing squamous epithelioma
  term:
    id: MONDO:0007566
    label: multiple self-healing squamous epithelioma
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  Scope. This entry is the constitutional predisposition. The tumors are
  curated as its phenotype rather than as a separate somatic entry, following
  design decision 3a; sporadic keratoacanthoma and sporadic cutaneous squamous
  cell carcinoma are not covered here. The allelic boundary with Loeys-Dietz
  syndrome 1 follows ClinGen, which curates TGFBR1 separately for the two
  conditions and assigns MSSE a loss-of-function mechanism; the few patients
  with both conditions carry kinase-domain missense variants and are described
  under differential_diagnoses rather than as a subtype. The predilection for
  sun-exposed skin is recorded as a distribution of the tumors; no source read
  for this entry tests ultraviolet exposure as a cause, so no environmental
  link to ultraviolet light is asserted. Penetrance is not recorded as a value:
  the one segregation figure (37 of 74 offspring of obligate carriers affected)
  and the 16 asymptomatic mutation carriers found in the gene-discovery cohort
  come from families ascertained through affected members. No GeneReviews
  chapter covers MSSE: `just check-genereviews --online` returned only the
  TGFBR1-scoped Loeys-Dietz Syndrome chapter (PMID:20301312) and the
  Heritable Thoracic Aortic Disease Overview (PMID:20301299), both about the
  allelic aortopathy, so the phenotype baseline here is the 2020 review by
  Goudie (PMID:33256177), cached as full text.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous germline TGFBR1 loss-of-function variants segregate as an
    autosomal dominant trait with high penetrance and variable age of onset.
  evidence:
  - reference: CGGV:assertion_570947a0-3e45-419c-bc22-0fdc60ca6009-2019-12-20T212550.834Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFBR1 | HGNC:11772 | multiple self-healing squamous epithelioma | MONDO:0007566 | AD | Definitive"
    explanation: >-
      ClinGen records autosomal dominant inheritance for this MONDO class.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In a study of 11 independently ascertained Scottish families including 62 affected family members, MSSE was found to segregate as an autosomal dominant trait"
    explanation: >-
      The review restates the original segregation study in Scottish families.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of the 74 offspring of obligate carriers, 37 were affected and 37 unaffected; among affected offspring 19 were male and 18 female."
    explanation: >-
      A one-to-one segregation ratio with no sex difference, as expected for an
      autosomal dominant trait.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    Haplotype studies indicate that tumor development in TGFBR1 carriers also
    needs a permissive variant at a second, unidentified locus in 9q22.3,
    within the haplotype shared by Scottish families and more than 1.5 Mb from
    TGFBR1. Because the two loci are tightly linked they are usually inherited
    together, which is why the trait segregates as a high-penetrance dominant.
    The second locus has not been identified, so no second gene can be named.
  evidence:
  - reference: PMID:24747516
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MSSE can now be regarded as a digenic/multilocus disease in view of the evidence of a second linked locus necessary for pathogenesis located within the Scottish haplotype."
    explanation: >-
      The authors of the gene-discovery study state the digenic model.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The condition is inherited as a high penetrance dominant trait because permissive variants in TGFBR1 and the second linked locus are usually inherited together in affected families."
    explanation: >-
      Explains why a digenic trait segregates as an autosomal dominant one.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The second locus has not been identified with sequencing coding and non-coding sequences within the shared 4 Mb haplotype but coverage has been incomplete"
    explanation: >-
      The second locus is inferred from haplotype sharing and remains
      unidentified.
pathophysiology:
- name: Germline TGFBR1 Loss-of-Function
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline TGFBR1 variant inactivates one allele in every
    cell. MSSE variants are nonsense, frameshift and splice variants spread
    through the gene, some of which abolish expression of the mutant mRNA, or
    missense variants in the extracellular ligand-binding domain. One
    functional copy is enough for normal development.
  genes:
  - preferred_term: TGFBR1
    modifier: DECREASED
    term:
      id: hgnc:11772
      label: TGFBR1
  genetic_context:
    gene:
      preferred_term: TGFBR1
      term:
        id: hgnc:11772
        label: TGFBR1
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Truncating variants (nonsense, frameshift, splice) or missense variants
      in the extracellular ligand-binding domain.
  molecular_functions:
  - preferred_term: TGF-beta type I receptor activity
    modifier: DECREASED
    term:
      id: GO:0005025
      label: transforming growth factor beta receptor activity, type I
  evidence:
  - reference: PMID:21358634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent dideoxy sequencing of TGFBR1 identified 11 distinct monoallelic mutations in 18 affected families, firmly establishing TGFBR1 as the causative gene."
    explanation: >-
      The gene-discovery study, with heterozygous TGFBR1 variants in 18
      families.
  - reference: PMID:21358634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nature of the sequence variants, which include mutations in the extracellular ligand-binding domain and a series of truncating mutations in the kinase domain, indicates a clear genotype-phenotype correlation between loss-of-function TGFBR1 mutations and MSSE."
    explanation: >-
      Names the two variant classes and the loss-of-function mechanism.
  - reference: CGGV:assertion_570947a0-3e45-419c-bc22-0fdc60ca6009-2019-12-20T212550.834Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whereas truncating variants or missense variants in the receptor domain of TGFBR1 cause multiple self-healing squamous epithelioma (MSSE; OMIM 132800) with loss of function mechanism."
    explanation: >-
      ClinGen assigns a loss-of-function mechanism to this condition.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Two of the truncating mutations have been confirmed to abolish expression of the mutant mRNA in EBV-transformed lymphocytes from MSSE patients"
    explanation: >-
      Truncating MSSE alleles are null at the mRNA level.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Constitutional heterozygous loss of function TGFBR1 mutations do not appear to have any effect on development, suggesting that transforming growth factor beta (TGFβ) signaling is not seriously perturbed in most cells with a single functional copy of the TGFBR1 gene."
    explanation: >-
      Heterozygous loss is tolerated developmentally, which is why a second
      hit is needed for a tumor.
  - reference: PMID:29706644
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The MSSE variant activated a cryptic acceptor site at 76 bp downstream of the 3' natural splice acceptor site, which produced an out-of-frame transcript (r.807_882del, p.Asn270Thrfs*8)."
    explanation: >-
      Minigene assays show that an MSSE splice variant yields a frameshifted
      transcript, unlike the in-frame products of a nearby Loeys-Dietz splice
      variant.
  downstream:
  - target: Somatic Loss of the Wild-Type TGFBR1 Allele
    causal_link_type: DIRECT
    description: >-
      Every keratinocyte already carries one inactive allele, so one somatic
      event at the TGFBR1 locus removes all receptor function.
- name: Somatic Loss of the Wild-Type TGFBR1 Allele
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  biological_scale: MOLECULAR
  description: >-
    DNA from microdissected MSSE tumors shows loss of heterozygosity at the
    TGFBR1 locus with retention of the mutant allele, so the wild-type allele is
    lost in the tumor. The second hit arises in skin keratinocytes.
  genes:
  - preferred_term: TGFBR1
    modifier: DECREASED
    term:
      id: hgnc:11772
      label: TGFBR1
  genetic_context:
    gene:
      preferred_term: TGFBR1
      term:
        id: hgnc:11772
        label: TGFBR1
    variant_origin: SOMATIC
    allelic_hit_role: SECOND_HIT
    allelic_events:
    - LOSS_OF_HETEROZYGOSITY
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Somatic loss of heterozygosity at the TGFBR1 locus removing the
      wild-type allele.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:16170343
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report the first molecular analysis of MSSE tumours showing loss of heterozygosity of the MSSE region, with loss of the normal allele, providing the first evidence that MSSE is a tumour suppressor gene."
    explanation: >-
      Loss of the normal allele in MSSE tumors, shown before the gene was
      identified.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Analysis of DNA from micro-dissected tumors from MSSE patients with constitutional TGFBR1 mutations shows somatic loss of heterozygosity at the TGFBR1 locus with retention of the mutant allele consistent with TGFBR1 behaving as a tumor suppressor gene"
    explanation: >-
      Places the loss of heterozygosity at TGFBR1 itself in carriers of known
      germline variants.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tumors develop from skin keratinocytes where a “second hit” has resulted in loss of the remaining functional TGFBR1 allele."
    explanation: >-
      Names the keratinocyte as the cell in which the second hit occurs.
  downstream:
  - target: Loss of TGF-beta Receptor Signaling in Keratinocytes
    causal_link_type: DIRECT
    description: >-
      With both alleles inactive, the keratinocyte has no functional type I
      TGF-beta receptor.
- name: Loss of TGF-beta Receptor Signaling in Keratinocytes
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  biological_scale: CELLULAR
  description: >-
    Biallelic TGFBR1 loss removes TGF-beta receptor signaling from the
    keratinocyte, and with it the growth-suppressive action TGF-beta has in
    normal skin. That this releases an invasive, self-limited keratinocyte
    tumor is inferred: the growth-suppression evidence comes from sporadic
    cutaneous squamous cell carcinoma and mouse skin, not from MSSE tumors
    themselves. The permissive second locus on 9q22.3 is also thought to be
    required, and how it acts is unknown.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: TGF-beta receptor signaling
    modifier: DECREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:29581863
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Inactivating mutations in transforming growth factor beta (TGF-β) receptors have been identified amongst genetic drivers of sporadic tumours and murine models of cSCC, suggesting a tumour suppressor function for TGF-β in normal skin"
    explanation: >-
      Supports a tumor-suppressor role for TGF-beta receptor signaling in
      skin. The statement is about sporadic and murine cutaneous squamous cell
      carcinoma, so applying it to MSSE is an inference step.
  - reference: CGGV:assertion_570947a0-3e45-419c-bc22-0fdc60ca6009-2019-12-20T212550.834Z
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Deletion of Tgfbr1 coupled with BRAF/KRAS activation or Tp53 mutation/deletion leads to skin tumorigenesis in mice."
    explanation: >-
      ClinGen's summary of mouse data in which Tgfbr1 loss contributes to skin
      tumors when combined with other lesions; not an MSSE model.
  downstream:
  - target: Self-healing squamous epithelioma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Keratinocytes lacking TGF-beta receptor signaling give rise to the
      invasive tumors. The intermediate steps, including the role of the
      second 9q22.3 locus, are not characterized.
- name: Spontaneous Tumor Involution
  biological_scale: TISSUE
  description: >-
    Each tumor stops growing after weeks and involutes over several months.
    The invasive epithelial columns keratinize centrally and coalesce into a
    horny plug that falls out, and the base shows dermal fibrosis with loss of
    elastic fibers, leaving a pitted scar. Lymphocytes often infiltrate the
    tumors, and one regressed tumor carried more plasmacytoid dendritic cells
    than a mature one from the same patient, but what drives regression is
    not known.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lymphocytes often infiltrate the tumors but their role in tumor resolution is not known."
    explanation: >-
      The review states that the cause of regression is unknown.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The base of the resolving lesion shows marked fibrosis of the dermis with loss of elastic fibers."
    explanation: >-
      Histology of the resolving lesion, the substrate of the scar.
  - reference: PMID:28101021
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histological comparison between mature and regressed keratoacanthomas (KA) revealed an increased inflammatory infiltrate with numerous plasmacytoid dendritic cells in the regressed KA in comparison to the mature one, speaking in favor of an inflammation-mediated regression process."
    explanation: >-
      A single-patient comparison suggesting inflammation-mediated regression;
      one case, not a demonstrated mechanism.
  downstream:
  - target: Pitted skin scars
    causal_link_type: DIRECT
    description: >-
      Involution with dermal fibrosis leaves a scar at each tumor site.
phenotypes:
- name: Self-healing squamous epithelioma
  category: Neoplasm
  frequency: VERY_FREQUENT
  description: >-
    Multiple skin tumors that start as a red macule, become papular, enlarge
    and ulcerate, invade the dermis over a few weeks and then regress
    spontaneously after several months. Histologically they resemble
    well-differentiated squamous cell carcinoma or keratoacanthoma. They arise
    mostly on sun-exposed skin of the head, neck and limbs, most often the
    nose, ears and perioral skin; the trunk is seldom affected. Lesion number
    ranges from one or two in a lifetime to more than 100. Age at first tumor
    ranges from 8 to 81 years. Distant metastasis has not been reported.
  phenotype_term:
    preferred_term: Multiple self-healing squamous epitheliomas
    term:
      id: HP:0034720
      label: Self-healing squamous epithelioma
  evidence:
  - reference: PMID:21358634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by multiple squamous-carcinoma-like locally invasive skin tumors that grow rapidly for a few weeks before spontaneously regressing, leaving scars"
    explanation: >-
      Defines the tumor phenotype in the gene-discovery study.
  - reference: PMID:17554363
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected patients suffer from recurrent skin lesions, which clinically and histologically resemble keratoacanthomas or well-differentiated squamous cell carcinomas, but which, if left, undergo spontaneous regression, leaving pronounced scarring."
    explanation: >-
      Clinical and histological resemblance to keratoacanthoma and
      well-differentiated squamous cell carcinoma.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tumors arise most frequently on the sun-exposed skin of the head, neck and limbs. The nose, ears and circumoral regions are most frequently affected. The trunk is seldom affected."
    explanation: >-
      Distribution of the tumors.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some affected individuals have one or two tumors during their lifetime while others have had over 100 primary skin tumors"
    explanation: >-
      Range of lesion burden.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The age of onset of a first tumor in mutation carriers was between 8 and 81 years."
    explanation: >-
      Age at first tumor in genotyped carriers from the gene-discovery cohort.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the tumors are invasive and can be locally destructive, distant metastases have not been reported."
    explanation: >-
      Local invasion without reported metastasis.
  sequelae:
  - target: Pitted skin scars
    causal_link_type: DIRECT
    description: >-
      Each tumor that is left to regress leaves a scar.
- name: Pitted skin scars
  category: Dermatologic
  frequency: VERY_FREQUENT
  description: >-
    Scars left at the site of each regressed tumor. Facial lesions typically
    leave deep pits with irregular, overhanging edges, while larger limb
    lesions leave flatter scars. The accumulated scarring can be severely
    disfiguring and is the main source of morbidity.
  phenotype_term:
    preferred_term: Pitted scars after tumor regression
    term:
      id: HP:0100699
      label: Scarring
  evidence:
  - reference: PMID:24747516
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "multiple tumours resembling crateriform squamous carcinomas are locally invasive but regress spontaneously after several months, leaving deep disfiguring facial scars and shallower scars on the limbs"
    explanation: >-
      Deep facial and shallower limb scars after regression.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As each tumor involutes it forms a horny plug that falls out often leaving a deep pit with irregular, over-hanging edges"
    explanation: >-
      Describes the pitted scar.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The condition can be very disfiguring in severely affected individuals."
    explanation: >-
      Disfigurement as the principal burden.
genetic:
- name: TGFBR1
  association: Germline tumor suppressor predisposition
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TGFBR1
    term:
      id: hgnc:11772
      label: TGFBR1
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_570947a0-3e45-419c-bc22-0fdc60ca6009-2019-12-20T212550.834Z
    evidence:
    - reference: CGGV:assertion_570947a0-3e45-419c-bc22-0fdc60ca6009-2019-12-20T212550.834Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TGFBR1 | HGNC:11772 | multiple self-healing squamous epithelioma | MONDO:0007566 | AD | Definitive | SOP6 | Hereditary Cancer Gene Curation Expert Panel"
      explanation: >-
        ClinGen gene-disease validity row for this entry's MONDO term.
  notes: >-
    TGFBR1 is at 9q22.33. Variant class, not the gene, separates this
    condition from Loeys-Dietz syndrome 1, so a positive TGFBR1 result has to
    be interpreted by variant class. Two patients with both MSSE and an
    arteriopathy carried kinase-domain missense variants of the Loeys-Dietz
    type. A second, unidentified locus in 9q22.3 is thought to be needed for
    tumors to form; it is not recorded as a gene because no gene has been
    named.
  evidence:
  - reference: PMID:36599937
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Conversely, nonsense, frameshift, or specific missense changes in the ligand-binding extracellular domain cause multiple self-healing squamous epithelioma (MSSE) lacking the cardiovascular phenotype."
    explanation: >-
      States the allelic split with Loeys-Dietz syndrome by variant class.
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We know of over 80 patients with MSSE carrying truncating mutations in TGFBR1 or missense mutations in the ligand-binding extracellular domain of the gene. None of these patients have been reported to have thoracic aortic aneurysms."
    explanation: >-
      MSSE alleles are not associated with the aortic phenotype of
      Loeys-Dietz syndrome.
environmental:

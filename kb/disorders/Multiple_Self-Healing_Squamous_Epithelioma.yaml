animal_models:
- name: Tgfbr1 p.Y378* heterozygous mouse
  species: Mouse
  genotype: Tgfbr1 p.Y378* nonsense allele, heterozygous
  description: >-
    Heterozygous mice carrying a Tgfbr1 nonsense allele degraded by
    nonsense-mediated decay are morphologically normal and did not show
    MSSE-like scars at 12 months.
  modeled_mechanisms:
  - target: Germline TGFBR1 Loss-of-Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse carries an MSSE-type null allele but does not develop the
      tumors or scars.
    limitations: >-
      The mouse lacks the permissive second 9q22.3 locus thought to be needed
      for tumors in human carriers, and only macroscopic skin examination at 12
      months is reported. The primary study is cited here only through a
      review.
    evidence:
    - reference: PMID:33256177
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "A macroscopic evaluation of the skin of fifteen 12-month-old heterozygous Tgfbr1 mutant mice did not reveal any scars similar to those observed in human MSSE patients after spontaneous regression of the skin tumors."
      explanation: >-
        Reports the absence of the MSSE phenotype in heterozygous null mice.
  evidence:
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "In this model, the mutant allele is degraded by nonsense mediated mRNA decay."
    explanation: >-
      The model allele is a null, like truncating MSSE alleles.
discussions:
- discussion_id: msse_second_locus_and_regression
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the permissive second locus on 9q22.3 that TGFBR1 carriers need
    in order to develop tumors, and what makes the tumors regress?
  rationale: >-
    The second locus is inferred from haplotype sharing in Scottish families
    and has not been identified despite sequencing of the shared region.
    Regression is the defining feature of the disease, but the only cellular
    evidence is lymphocytic infiltration and one case comparison of mature and
    regressed tumors; whether regression is immune-mediated or intrinsic to
    TGFBR1-null keratinocytes is open.
  attaches_to:
  - inheritance#Digenic inheritance
  - pathophysiology#Spontaneous Tumor Involution
  evidence:
  - reference: PMID:33256177
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The second locus has not been identified with sequencing coding and non-coding sequences within the shared 4 Mb haplotype but coverage has been incomplete"
    explanation: >-
      The locus remains unidentified.

    evidence:
    - reference: PMID:33256177
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Treatment with radiotherapy must be avoided because more numerous, more invasive tumors arise in previously irradiated skin"
      explanation: >-

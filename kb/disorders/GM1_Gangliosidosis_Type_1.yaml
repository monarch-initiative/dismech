name: GM1 Gangliosidosis Type 1
creation_date: "2026-06-13T00:00:00Z"
description: >-
  GM1 gangliosidosis type 1 (infantile GM1 gangliosidosis) is an ultra-rare, rapidly
  progressive neuronopathic lysosomal storage disorder caused by biallelic
  loss-of-function variants in GLB1 encoding lysosomal beta-galactosidase. Near-absent
  enzyme activity prevents cleavage of the terminal galactose from GM1 ganglioside, so
  GM1 ganglioside and other beta-galactose-terminal glycoconjugates (GA1, oligosaccharides,
  keratan sulfate) accumulate in neurons and somatic tissues. The infantile form presents
  in early infancy (mean first-symptom onset ~2.8 months) with rapidly progressive
  neurodegeneration, hypotonia, developmental regression, hepatosplenomegaly, dysostosis
  multiplex, coarse facial features, and a macular cherry-red spot, with a life expectancy
  of two to three years (mean age at death ~18.9 months). No FDA-approved disease-modifying
  therapy exists; AAV-mediated GLB1 gene therapy is in clinical trials.
category: Mendelian

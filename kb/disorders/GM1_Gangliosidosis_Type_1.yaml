- name: Neuronal Apoptosis
  conforms_to: "lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation"
  biological_scale: CELLULAR
  description: >-
    Toxic lysosomal storage of GM1 ganglioside and related substrates precipitates
    neuronal apoptotic cell death, a key route to the progressive neuron loss of the
    disease. (Model-system work in beta-gal-deficient mice further implicates GM1-driven
    ER-stress/unfolded-protein-response and mitochondrial calcium dysregulation upstream
    of this apoptosis, but that specific cascade is model-derived and not asserted here
    as a human-established mechanism.)
  cell_types:

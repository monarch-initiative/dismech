- name: Multidisciplinary Surveillance and Symptom Management
  description: >-
    GeneReviews-recommended surveillance for GM1 gangliosidosis: assess yearly for
    seizure risk (neurologist), cervical spine stability, and hip dislocation risk, plus
    quality of life; perform electrocardiogram, echocardiogram, and eye examination every
    one to three years. Agents/circumstances to avoid include unplanned anesthesia,
    psychotropic medications (risk of worsening neurologic disease), aspiration-risk
    feeding positioning, and over-sedating seizure-medication dosing.

  description: >-
    GM1 ganglioside and other beta-galactose-terminal glycoconjugates accumulate in
    neuronal lysosomes (and, via keratan sulfate/oligosaccharide storage, in somatic
    tissues such as heart, bone, liver, and spleen), impairing cell physiology.

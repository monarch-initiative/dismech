progression:
- phase: Onset and diagnosis
  notes: >-
    First symptom onset is typically in early infancy (mean 2.8 months, range 0-11), with a
    diagnostic delay so that the mean age at diagnosis is ~8.7 months. Marked
    neurodevelopmental regression and multi-organ deterioration occur in the 6-18 month window.
  evidence:
  - reference: PMID:31937438
    reference_title: "The natural history of Type 1 infantile GM1 gangliosidosis: A literature-based meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "average age of diagnosis was 8.7 months, and average age of death was 18.9 months"
    explanation: "Documents the mean ages at diagnosis and death from the natural-history meta-analysis."
- phase: Fatal infantile course
  notes: >-
    Type 1 GM1 gangliosidosis is rapidly fatal, with a life expectancy of two to three years
    (mean age at death ~18.9 months; median survival ~19 months).
  evidence:
  - reference: PMID:31937438
    reference_title: "The natural history of Type 1 infantile GM1 gangliosidosis: A literature-based meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type 1 GM1 gangliosidosis is an ultra-rare, rapidly fatal lysosomal storage disorder, with life expectancy of <3 years of age."
    explanation: "Documents the rapidly fatal infantile prognosis."
  - reference: PMID:24156116
    reference_title: "GLB1-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Life expectancy is two to three years."
    explanation: "GeneReviews states the two-to-three-year life expectancy of infantile GM1."
  - reference: PMID:39639297
    reference_title: "A natural history study of pediatric patients with early onset of GM1 gangliosidosis, GM2 gangliosidoses, or gaucher disease type 2 (RETRIEVE)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median (95% CI) survival was 19.0 (18.0, 22.0)"
    explanation: >-
      The RETRIEVE natural-history study reports ~19-month median survival in early-onset
      GM1. Note the RETRIEVE cohort defines early onset as first neurological manifestation
      before 24 months, spanning type 1 and type 2a, so this figure is slightly broader than
      the strict infantile (type 1) subtype.
  - reference: PMID:31937438
    reference_title: "The natural history of Type 1 infantile GM1 gangliosidosis: A literature-based meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "96% of patients were alive at 12 months and 63% of patients were alive at 18 months, only 19% of patients were alive at 24 months"
    explanation: "Quantifies the survival curve: mortality risk rises sharply after 12 months."

notes: >-
  Curation note: Niemann-Pick disease type E (MONDO:0020384) is a historical nosologic term for
  adult-onset non-neuronopathic Niemann-Pick disease. In contemporary classification, adult
  visceral Niemann-Pick disease caused by acid sphingomyelinase deficiency is classified within
  chronic visceral ASMD (Niemann-Pick disease type B; SMPD1), whereas adult cases caused by
  defective intracellular cholesterol transport are classified as Niemann-Pick disease type C
  (NPC1/NPC2). All evidence snippets in this entry are restricted to publication abstracts and
  structured Orphanet records for full compatibility with abstract-only CI reference validation.

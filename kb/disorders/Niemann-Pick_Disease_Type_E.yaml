name: Niemann-Pick Disease Type E
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Niemann-Pick disease type E is a historical, ill-defined nosologic label that was
  applied to patients with Niemann-Pick-like lipid storage who did not fit the classic
  types A or B. In historical classification schemes, patients grouped under types C, D,
  or E presented with hepatomegaly, foamy macrophage infiltration of tissues and bone
  marrow, partial deficiency of acid sphingomyelinase (ASM) activity, and moderate
  sphingomyelin accumulation, together with chronic and often severe neurological
  deterioration. Subsequent biochemical and genetic studies showed that the partial ASM
  deficiency in these patients was often secondary to a primary defect in intracellular
  cholesterol esterification and transport. In the molecular era, Niemann-Pick disease
  has been redefined as acid sphingomyelinase deficiency (ASMD; caused by SMPD1 variants)
  and Niemann-Pick disease type C (caused by NPC1 or NPC2 variants), and the nosology of
  types D and E is no longer used. Patients historically labeled "type E" should be
  reclassified to ASMD, Niemann-Pick disease type C, or another lysosomal storage
  disorder using enzymatic activity, biomarker, and molecular genetic testing.

name: Niemann-Pick Disease Type E
creation_date: "2026-06-13T00:00:00Z"
updated_date: "2026-10-16T09:45:00Z"
description: >-
  Niemann-Pick disease type E is a historical nosologic designation originally applied to
  adult-onset, non-neuronopathic patients presenting with hepatosplenomegaly, foamy macrophage
  (foam cell) infiltration of visceral tissues and bone marrow, and lysosomal sphingomyelin
  and lipid accumulation without childhood neurological signs. In the molecular era,
  Niemann-Pick disease has been resolved into two distinct metabolic entities: acid
  sphingomyelinase deficiency (ASMD; caused by biallelic SMPD1 variants and encompassing
  historically designated types A and B) and Niemann-Pick disease type C (caused by NPC1 or
  NPC2 variants). The historical type E designation is no longer used as an independent
  biochemical disorder; adult-onset non-neuronopathic visceral cases formerly labeled type E
  correspond primarily to adult-onset chronic visceral ASMD (Niemann-Pick disease type B) or,
  when accompanied by later-onset neuropsychiatric or cholesterol-trafficking defects, adult
  Niemann-Pick disease type C.

  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The eponym Niemann-Pick disease (NPD) refers to a group of patients who present with varying degrees of lipid storage and foam cell infiltration in tissues, as well as overlapping clinical features including hepatosplenomegaly, pulmonary insufficiency and/or central nervous system (CNS) involvement."
    explanation: Describes tissue lipid storage and macrophage foam cell infiltration across the Niemann-Pick disease spectrum.
  - reference: PMID:11732877
    reference_title: "Sea-blue histiocytosis secondary to Niemann-Pick disease type B: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis was guided by the morphological finding in bone marrow smears of foamy and sea-blue histiocytes and confirmed by the measurement of acid lysosomal sphingomyelinase activity below normal values."
    explanation: Demonstrates adult-onset visceral Niemann-Pick disease with bone marrow foamy and sea-blue histiocytes caused by deficient lysosomal sphingomyelinase activity.
  downstream:
  - target: Hepatomegaly
    description: >-
      Infiltration of hepatic sinusoids and parenchyma by lipid-laden foamy macrophages
      causes liver enlargement.
    causal_link_type: DIRECT
    evidence:
    - reference: ORPHA:77293
      reference_title: "Chronic visceral acid sphingomyelinase deficiency"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "| HP:0002240 | Hepatomegaly | Frequent (79-30%) |"
      explanation: Documents hepatomegaly as a frequent visceral manifestation of chronic acid sphingomyelinase deficiency.
  - target: Splenomegaly
    description: >-
      Accumulation of sphingomyelin-laden foam cells and sea-blue histiocytes in the red pulp
      produces splenomegaly, frequently presenting in adulthood.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11732877
      reference_title: "Sea-blue histiocytosis secondary to Niemann-Pick disease type B: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a rare case of sea-blue histiocytosis associated with a mild phenotype of Niemann-Pick disease (NPD) type B in a 44-year-old man who presented with splenomegaly and mild thrombocytopenia."
      explanation: Links foam-cell and sea-blue histiocyte storage directly to adult-onset splenomegaly.
  - target: Hepatosplenomegaly
    description: >-
      Combined hepatic and splenic foam-cell infiltration produces hepatosplenomegaly, the
      hallmark visceral sign of chronic non-neuronopathic Niemann-Pick disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28164782
      reference_title: "Types A and B Niemann-Pick disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The eponym Niemann-Pick disease (NPD) refers to a group of patients who present with varying degrees of lipid storage and foam cell infiltration in tissues, as well as overlapping clinical features including hepatosplenomegaly, pulmonary insufficiency and/or central nervous system (CNS) involvement."
      explanation: Directly connects lipid storage and foam cell infiltration in tissues to hepatosplenomegaly.
  - target: Abnormal pulmonary interstitial morphology
    description: >-
      Alveolar and interstitial infiltration by lipid-laden macrophages leads to interstitial
      lung disease and pulmonary insufficiency.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28228103
      reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Almost all patients have hepatosplenomegaly and an atherogenic lipid profile, and most patients have interstitial lung disease with progressive impairment of pulmonary function and hematologic abnormalities including cytopenias."
      explanation: Identifies interstitial lung disease with progressive impairment of pulmonary function as a major consequence of ASMD storage pathology.
  - target: Thrombocytopenia
    description: >-
      Splenomegaly with hypersplenism and bone marrow infiltration by foam cells and sea-blue
      histiocytes leads to peripheral thrombocytopenia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:11732877
      reference_title: "Sea-blue histiocytosis secondary to Niemann-Pick disease type B: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a rare case of sea-blue histiocytosis associated with a mild phenotype of Niemann-Pick disease (NPD) type B in a 44-year-old man who presented with splenomegaly and mild thrombocytopenia."
      explanation: Documents thrombocytopenia accompanying splenomegaly and bone marrow sea-blue histiocytosis in adult visceral Niemann-Pick disease.
  - target: Abnormal circulating lipid concentration
    description: >-
      Disrupted sphingomyelin and sterol catabolism in macrophages and hepatocytes produces
      an atherogenic lipid profile with abnormal circulating lipid concentrations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28228103
      reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Almost all patients have hepatosplenomegaly and an atherogenic lipid profile, and most patients have interstitial lung disease with progressive impairment of pulmonary function and hematologic abnormalities including cytopenias."
      explanation: Supports an atherogenic lipid profile as a near-universal systemic manifestation of lysosomal sphingomyelin storage in ASMD.

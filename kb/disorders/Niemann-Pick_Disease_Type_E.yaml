differential_diagnoses:
- name: Acid sphingomyelinase deficiency (Niemann-Pick disease type B)
  description: >-
    The modern chronic visceral form of ASMD caused by biallelic SMPD1 variants, into which
    adult-onset non-neuronopathic cases historically labeled type E are now classified.
  disease_term:
    preferred_term: Niemann-Pick disease type B
    term:
      id: MONDO:0011871
      label: Niemann-Pick disease type B
  distinguishing_features:
  - Defined biochemically by deficient acid sphingomyelinase activity and molecularly by biallelic SMPD1 variants, superseding the historical type E eponym.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B patients also have hepatosplenomegaly and pathologic alterations of their lungs, but there are usually no CNS signs. The age of onset and rate of disease progression varies greatly among type B patients, and they frequently live into adulthood."
    explanation: Describes the adult-surviving non-neuronopathic visceral phenotype of type B NPD that encompasses historical type E cases.
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: Confirms that adult-onset chronic visceral disease is part of the modern ASMD (types A, B, and A/B) continuum.
- name: Niemann-Pick disease type C
  description: >-
    An autosomal recessive neurovisceral lysosomal cholesterol and glycosphingolipid
    trafficking disorder caused by NPC1 or NPC2 variants, into which some historical adult
    Niemann-Pick cases with partial secondary ASM reduction are reclassified.
  disease_term:
    preferred_term: Niemann-Pick disease type C
    term:
      id: MONDO:0018982
      label: Niemann-Pick disease type C
  distinguishing_features:
  - Caused by biallelic NPC1 or NPC2 mutations affecting intracellular cholesterol trafficking and esterification rather than primary SMPD1-mediated acid sphingomyelinase deficiency.
  - Adult-onset patients typically develop vertical supranuclear gaze palsy, cerebellar ataxia, dysarthria, dysphagia, or psychiatric disturbances in addition to splenomegaly or hepatosplenomegaly.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the pioneering work of Roscoe Brady and co-workers, we now know that there are two distinct metabolic abnormalities that account for NPD. The first is due to the deficient activity of the enzyme acid sphingomyelinase (ASM; \"types A & B\" NPD), and the second is due to defective function in cholesterol transport (\"type C\" NPD)."
    explanation: Distinguishes primary acid sphingomyelinase deficiency (types A and B) from defective cholesterol transport in Niemann-Pick disease type C.
  - reference: PMID:20525256
    reference_title: "Niemann-Pick disease type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NP-C is transmitted in an autosomal recessive manner and is caused by mutations of either the NPC1 (95% of families) or the NPC2 genes."
    explanation: Establishes NPC1 and NPC2 mutations as the molecular basis of Niemann-Pick disease type C.
- name: Niemann-Pick disease type A
  description: >-
    The severe infantile neurovisceral form of acid sphingomyelinase deficiency caused by
    SMPD1 variants.
  disease_term:
    preferred_term: Niemann-Pick disease type A
    term:
      id: MONDO:0009756
      label: Niemann-Pick disease type A
  distinguishing_features:
  - Presents in infancy with hepatosplenomegaly, rapid neurodegeneration, and death by 2 to 3 years of age, contrasting with the adult-onset non-neuronopathic presentation historically labeled type E.
  evidence:

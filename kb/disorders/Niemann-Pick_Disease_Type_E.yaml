    evidence_source: HUMAN_CLINICAL
    snippet: "Type A NPD patients exhibit hepatosplenomegaly in infancy and profound CNS involvement. They rarely survive beyond 2-3years of age."
    explanation: Contrasts the fatal infantile neurovisceral course of type A NPD with adult visceral disease.

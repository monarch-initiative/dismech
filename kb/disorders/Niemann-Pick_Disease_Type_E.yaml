    term:
      id: GO:0006684
      label: sphingomyelin metabolic process
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients presented with hepatomegaly, foamy macrophage infiltration into tissues and bone marrow, partial deficiency of ASM activity, and moderate accumulation of sphingomyelin, but also exhibited chronic and often severe neurological deterioration. They were therefore classified as having types C, D or E NPD."
    explanation: "Describes the visceral foam-cell storage, partial ASM deficiency, and chronic neurological deterioration of patients historically grouped as types C, D, or E Niemann-Pick disease."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In 1980 Brady and Pentchev reported a mouse model with similar clinical and biochemical features to these patients, and went on to show that the ASM deficiency in these mice was secondary to a primary defect in cholesterol esterification"
    explanation: "Demonstrates that the partial ASM deficiency observed in this historical C/D/E patient group was often secondary to a primary defect in cholesterol esterification."
  downstream:

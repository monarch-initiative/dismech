inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Inherited in an autosomal recessive manner; all modern molecularly defined forms of
    Niemann-Pick disease into which historical type E cases are classified (ASMD due to
    SMPD1 and NPC due to NPC1/NPC2) follow autosomal recessive inheritance.
  evidence:
  - reference: PMID:38397448
    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Niemann-Pick Disease (NPD) is a rare autosomal recessive disease belonging to lysosomal storage disorders."
    explanation: Establishes autosomal recessive inheritance across Niemann-Pick disease.
prevalence:
- subtype: Chronic visceral acid sphingomyelinase deficiency (modern classification encompassing adult visceral type E cases)
  population: Europe
  prevalence_class: BAND_1_9_PER_1000000
  notes: >-
    No separate epidemiological prevalence exists for the obsolete "type E" label; prevalence
    is tracked under chronic visceral acid sphingomyelinase deficiency (ASMD / type B), which
    is estimated at 1-9 per 1,000,000 at birth in Orphanet.
  evidence:
  - reference: ORPHA:77293
    reference_title: "Chronic visceral acid sphingomyelinase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| 1-9 / 1 000 000 | Europe | Prevalence at birth | PMID:23412609 |"
    explanation: Orphanet reports a birth prevalence of 1-9 per 1,000,000 in Europe for chronic visceral acid sphingomyelinase deficiency.
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acid Sphingomyelinase Deficiency (ASMD) is a rare autosomal recessive disorder caused by mutations in the SMPD1 gene. This rarity contributes to misdiagnosis, delayed diagnosis and barriers to good care."
    explanation: Consensus guidelines characterize ASMD as a rare autosomal recessive disorder prone to delayed or missed diagnosis.
progression:
- phase: Onset
  age_range: Adulthood (within the broad infancy-to-adulthood ASMD spectrum)
  notes: >-
    The historical "type E" label specifically designated patients whose visceral Niemann-Pick
    storage manifestations were recognized in adulthood without infant/childhood neurovisceral
    disease; modern consensus guidelines recognize this adult-onset chronic visceral
    presentation as the milder end of the continuous ASMD severity spectrum.
  evidence:
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: Explicitly documents the adult-onset chronic visceral disease phenotype within the ASMD continuum.
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of onset and rate of disease progression varies greatly among type B patients, and they frequently live into adulthood."
    explanation: Confirms variable age of onset and survival into adulthood in non-neuronopathic ASMD.
biochemical:
- name: Acid sphingomyelinase activity
  presence: Decreased
  context: >-
    Deficient acid sphingomyelinase catalytic activity in peripheral blood leukocytes, dried
    blood spots, or cultured skin fibroblasts establishes acid sphingomyelinase deficiency in
    adult visceral cases historically labeled type E.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the pioneering work of Roscoe Brady and co-workers, we now know that there are two distinct metabolic abnormalities that account for NPD. The first is due to the deficient activity of the enzyme acid sphingomyelinase (ASM; \"types A & B\" NPD), and the second is due to defective function in cholesterol transport (\"type C\" NPD)."
    explanation: Identifies deficient acid sphingomyelinase enzyme activity as the defining biochemical abnormality of ASMD.
  - reference: PMID:11732877
    reference_title: "Sea-blue histiocytosis secondary to Niemann-Pick disease type B: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our patient diagnosis was confirmed by the specific enzyme assay of leukocytes (deficiency in sphingomyelinase activity)."
    explanation: Confirms deficient leukocyte sphingomyelinase activity in an adult visceral Niemann-Pick patient.
- name: Plasma lyso-sphingomyelin
  presence: Elevated
  context: >-
    Deacylated sphingomyelin (lyso-sphingomyelin) is elevated in plasma in ASMD and decreases
    substantially in response to olipudase alfa enzyme replacement therapy.
  evidence:
  - reference: PMID:42047222
    reference_title: "Adults With Acid Sphingomyelinase Deficiency Have Sustained Improvements in Clinical Outcomes With up to 5 Years of Olipudase Alfa Enzyme Replacement Therapy: ASCEND Trial Final Results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma lyso-sphingomyelin levels decreased by 72% from baseline to final assessment."
    explanation: Demonstrates that plasma lyso-sphingomyelin is a quantitative biomarker of substrate burden in adults with ASMD.
genetic:
- name: SMPD1
  gene_term:
    preferred_term: SMPD1
    term:
      id: hgnc:11120
      label: SMPD1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic pathogenic variants in SMPD1 cause acid sphingomyelinase deficiency, the modern
    molecular diagnosis corresponding to adult-onset non-neuronopathic visceral cases
    historically designated Niemann-Pick disease type E. (Historical cases found instead to
    have defective intracellular cholesterol trafficking carry biallelic variants in NPC1 or
    NPC2 and are reclassified to Niemann-Pick disease type C.)
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: Establishes SMPD1 mutations as the genetic cause of acid sphingomyelinase deficiency.
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acid Sphingomyelinase Deficiency (ASMD) is a rare autosomal recessive disorder caused by mutations in the SMPD1 gene."
    explanation: Confirms mutations in SMPD1 as causative for ASMD across its clinical spectrum.
diagnosis:

differential_diagnoses:
- name: Acid sphingomyelinase deficiency (Niemann-Pick type B)
  description: >-
    The chronic visceral form of acid sphingomyelinase deficiency (SMPD1), one of the
    modern molecularly defined entities into which historical type E cases with primary
    acid sphingomyelinase deficiency are reclassified.
  disease_term:
    preferred_term: Niemann-Pick disease type B
    term:
      id: MONDO:0011871
      label: Niemann-Pick disease type B
  distinguishing_features:
  - Defined molecularly by biallelic SMPD1 variants and primary deficiency of acid sphingomyelinase activity, providing a precise diagnosis where the obsolete "type E" label did not.
  - Typically presents with chronic visceral hepatosplenomegaly and pulmonary involvement without overt central nervous system signs.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nosology of types D and E NPD are no longer used."
    explanation: "Type E is an obsolete nosologic label; patients are reclassified into modern molecularly defined entities such as ASMD or NPC."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: "Establishes that modern ASMD (including type B) is defined by SMPD1 mutations and primary ASM deficiency."
- name: Niemann-Pick disease type C
  description: >-
    A neurovisceral atypical lysosomal lipid storage disorder caused by biallelic NPC1 or
    NPC2 variants affecting intracellular cholesterol trafficking, into which historical
    types C, D, or E patients with secondary partial ASM deficiency and neurological
    deterioration are reclassified.
  disease_term:
    preferred_term: Niemann-Pick disease type C
    term:
      id: MONDO:0018982
      label: Niemann-Pick disease type C
  distinguishing_features:
  - Defined molecularly by biallelic NPC1 or NPC2 defects of intracellular cholesterol transport, with accumulation of unesterified cholesterol in perinuclear vesicles (lysosomes) demonstrated by filipin staining in living skin fibroblasts.
  - Characterized clinically by vertical supranuclear gaze palsy, cerebellar ataxia, dysarthria, dysphagia, and progressive dementia.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1985 these same investigators demonstrated a cholesterol esterification defect in cultured cells from type C NPD patients, clearly distinguishing them from types A and B NPD"
    explanation: "Distinguishes Niemann-Pick disease type C by its primary cholesterol esterification defect in cultured cells."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now know that type C NPD is due to defects in two distinct cholesterol-binding proteins (NPC1 and NPC2)."
    explanation: "Identifies biallelic NPC1 and NPC2 defects as the molecular basis of Niemann-Pick disease type C."
  - reference: PMID:20525256
    reference_title: "Niemann-Pick disease type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most characteristic sign is vertical supranuclear gaze palsy. The neurological disorder consists mainly of cerebellar ataxia, dysarthria, dysphagia, and progressive dementia."
    explanation: "Supports the characteristic neurological features of Niemann-Pick disease type C."
  - reference: PMID:20525256
    reference_title: "Niemann-Pick disease type C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary laboratory diagnosis requires living skin fibroblasts to demonstrate accumulation of unesterified cholesterol in perinuclear vesicles (lysosomes) after staining with filipin."
    explanation: "Supports diagnostic confirmation of Niemann-Pick disease type C via filipin staining of unesterified cholesterol accumulation in cultured skin fibroblasts."
- name: Niemann-Pick disease type A
  description: >-
    The severe infantile neurovisceral form of acid sphingomyelinase deficiency (SMPD1),
    distinguished by infantile onset and rapidly fatal neurodegeneration.
  disease_term:
    preferred_term: Niemann-Pick disease type A
    term:
      id: MONDO:0009756
      label: Niemann-Pick disease type A
  distinguishing_features:
  - Presents in infancy with massive hepatosplenomegaly, profound central nervous system involvement, and death typically before 2 to 3 years of age.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type A NPD patients exhibit hepatosplenomegaly in infancy and profound CNS involvement. They rarely survive beyond 2-3years of age."
    explanation: "Distinguishes Niemann-Pick disease type A by its infantile onset, profound CNS involvement, and death by 2 to 3 years of age."
definitions:
- name: Historical (deprecated) definition of Niemann-Pick disease type E
  definition_type: CASE_DEFINITION
  description: >-
    Niemann-Pick disease type E was a historical label applied to patients with
    Niemann-Pick-like lipid storage (hepatomegaly, foamy macrophage infiltration of
    tissues and bone marrow, partial acid sphingomyelinase deficiency, moderate
    sphingomyelin accumulation, and chronic neurological deterioration) who were grouped
    under types C, D, or E. The label is obsolete; modern diagnosis reclassifies such
    patients into acid sphingomyelinase deficiency (ASMD) or Niemann-Pick disease type C
    (NPC).
  scope: Disease-level historical case definition flagged as a deprecated nosologic label.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients presented with hepatomegaly, foamy macrophage infiltration into tissues and bone marrow, partial deficiency of ASM activity, and moderate accumulation of sphingomyelin, but also exhibited chronic and often severe neurological deterioration. They were therefore classified as having types C, D or E NPD."
    explanation: "Documents the clinical and pathological presentation historically grouped under types C, D, or E Niemann-Pick disease."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nosology of types D and E NPD are no longer used."
    explanation: "Authoritative review states that the type D and E Niemann-Pick disease nosology is obsolete."
discussions:
- discussion_id: gap_npe_obsolete_nosology
  prompt: >-
    Is "Niemann-Pick disease type E" a distinct disease entity, or an obsolete historical
    label whose cases should be reclassified into acid sphingomyelinase deficiency (SMPD1),
    Niemann-Pick disease type C (NPC1/NPC2), or another lysosomal disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Sphingomyelin and Lipid Storage with Foam Cell Infiltration
  rationale: >-
    Authoritative review states the nosology of types D and E Niemann-Pick disease is no
    longer used, and later case literature notes the biochemical nature of "type E" remains
    unclarified. The MONDO term is retained for historical mapping, but the entity has no
    established causal gene and should be resolved by enzyme, biomarker, and molecular
    testing into a modern diagnosis.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nosology of types D and E NPD are no longer used."
    explanation: "Authoritative review confirming that the type D and E Niemann-Pick disease nosology is obsolete."

definitions:
- name: Historical (deprecated) definition of Niemann-Pick disease type E
  definition_type: CASE_DEFINITION
  description: >-
    Niemann-Pick disease type E was a historical nosologic label applied to adult-onset
    patients with visceral Niemann-Pick lipid storage and foam-cell infiltration without
    childhood neurological involvement. Because Niemann-Pick disease is now defined
    biochemically and molecularly as either acid sphingomyelinase deficiency (SMPD1; types A,
    B, and A/B, including adult-onset chronic visceral disease) or cholesterol-trafficking
    deficiency (NPC1/NPC2; type C), the type E label is obsolete and such cases are classified
    under adult-onset chronic visceral ASMD or NPC.
  scope: Disease-level historical case definition flagged as a deprecated nosologic label.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the pioneering work of Roscoe Brady and co-workers, we now know that there are two distinct metabolic abnormalities that account for NPD. The first is due to the deficient activity of the enzyme acid sphingomyelinase (ASM; \"types A & B\" NPD), and the second is due to defective function in cholesterol transport (\"type C\" NPD)."
    explanation: Demonstrates that modern biochemical classification divides Niemann-Pick disease into ASM deficiency (types A and B) and cholesterol transport deficiency (type C), superseding historical type E terminology.
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: Shows that adult-onset chronic visceral presentation is now recognized as part of the continuous ASMD phenotype spectrum rather than a separate type E entity.
discussions:
- discussion_id: gap_npe_obsolete_nosology
  prompt: >-
    Is "Niemann-Pick disease type E" a distinct disease entity, or an obsolete historical
    label whose cases should be reclassified into acid sphingomyelinase deficiency (SMPD1),
    Niemann-Pick disease type C (NPC1/NPC2), or another lysosomal disorder?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lysosomal Sphingomyelin and Lipid Storage with Foam Cell Infiltration
  rationale: >-
    In the historical Crocker/Fredrickson classification, "type E" designated adult-onset
    non-neuronopathic Niemann-Pick disease. Modern biochemical and molecular genetics resolved
    Niemann-Pick disease into SMPD1-related acid sphingomyelinase deficiency (ASMD, spanning
    infantile neurovisceral type A to adult-onset chronic visceral type B) and NPC1/NPC2-related
    Niemann-Pick disease type C. The MONDO:0020384 term is retained for historical mapping,
    with its clinical, biochemical, genetic, and therapeutic profile anchored to adult-onset
    chronic visceral ASMD while noting reclassification to ASMD or NPC via enzymatic and
    molecular testing.

pathophysiology:
- name: Deficient Acid Sphingomyelinase Activity
  description: >-
    Biallelic pathogenic variants in SMPD1 reduce lysosomal acid sphingomyelinase (ASM)
    catalytic activity. In adult-onset chronic visceral cases historically designated as
    Niemann-Pick disease type E (now classified within chronic visceral ASMD / type B),
    residual ASM activity spares the central nervous system during childhood while still
    impairing lysosomal sphingomyelin catabolism in visceral organs.
  gene:
    preferred_term: SMPD1
    term:
      id: hgnc:11120
      label: SMPD1
  molecular_functions:
  - preferred_term: acid sphingomyelin phosphodiesterase activity
    modifier: DECREASED
    term:
      id: GO:0061750
      label: acid sphingomyelin phosphodiesterase activity
  biological_processes:
  - preferred_term: sphingomyelin catabolic process
    modifier: DECREASED
    term:
      id: GO:0006685
      label: sphingomyelin catabolic process
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the pioneering work of Roscoe Brady and co-workers, we now know that there are two distinct metabolic abnormalities that account for NPD. The first is due to the deficient activity of the enzyme acid sphingomyelinase (ASM; \"types A & B\" NPD), and the second is due to defective function in cholesterol transport (\"type C\" NPD)."
    explanation: Establishes that deficient acid sphingomyelinase activity is the primary enzymatic defect underlying the ASMD spectrum of Niemann-Pick disease.
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: Links SMPD1 mutations directly to deficient acid sphingomyelinase activity in non-type-C Niemann-Pick disease.
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical spectrum of ASMD, although a continuum, varies substantially with subtypes ranging from a fatal infantile neurovisceral disorder to an adult-onset chronic visceral disease."
    explanation: Confirms that SMPD1-related acid sphingomyelinase deficiency encompasses the adult-onset chronic visceral phenotype historically designated as Niemann-Pick disease type E.
  downstream:
  - target: Lysosomal Sphingomyelin and Lipid Storage with Foam Cell Infiltration
    description: >-
      Reduced lysosomal acid sphingomyelinase activity impairs sphingomyelin hydrolysis,
      causing progressive intralysosomal sphingomyelin and lipid accumulation in macrophages.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38397448
      reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase 1, with a consequent lack of acid sphingomyelinase activity."
      explanation: Connects SMPD1 mutations and lack of acid sphingomyelinase activity to the lysosomal storage disorder in Niemann-Pick disease.
- name: Lysosomal Sphingomyelin and Lipid Storage with Foam Cell Infiltration
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >-
    Deficient sphingomyelin degradation leads to progressive lysosomal sphingomyelin and
    secondary lipid accumulation within cells of the monocyte-macrophage system, transforming
    them into lipid-laden foam cells and sea-blue histiocytes that infiltrate the spleen,
    liver, lungs, and bone marrow in adult visceral Niemann-Pick disease.

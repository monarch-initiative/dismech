  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Measurement of acid sphingomyelinase activity in peripheral blood leukocytes is the
    primary biochemical test to establish ASMD and reclassify patients historically labeled
    as Niemann-Pick disease type E.
  presence: Positive
  evidence:
  - reference: PMID:11732877
    reference_title: "Sea-blue histiocytosis secondary to Niemann-Pick disease type B: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In our patient diagnosis was confirmed by the specific enzyme assay of leukocytes (deficiency in sphingomyelinase activity). This is a simple and noninvasive method that is useful whenever clinical and morphological finding are relevant, and a primary hematological disorder has been ruled out."
    explanation: Demonstrates diagnostic confirmation via specific enzyme assay of leukocytes showing sphingomyelinase deficiency.

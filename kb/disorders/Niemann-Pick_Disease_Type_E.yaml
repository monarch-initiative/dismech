    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase 1, with a consequent lack of acid sphingomyelinase activity. These diseases have been thus classified as acid sphingomyelinase deficiencies (ASMDs)."
    explanation: Supports molecular identification of SMPD1 mutations to establish a definitive diagnosis of ASMD.

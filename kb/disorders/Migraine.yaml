- accession: geo:GSE318177
  title: DNA methylation in episodic migraine and medication overuse headache.
  description: These data were generated within the Epimode project - a pilot, longitudinal, prospective, observational study designed to investigate DNA methylation in headache disorders. 20 episodic migraineurs (EM), 25 medication overuse headache patients (MOH) and 13 healthy controls (HC) were enrolled in the study. EM and HC samples were collected at baseline (T0) and ath the follow-up visit 6 months later (T1). MOH samples were collected at baseline (T0), at treatment time point (T1) and at the follow-up visits after 2 (T2) and 6 (T3) months from the therapeutic intervention.

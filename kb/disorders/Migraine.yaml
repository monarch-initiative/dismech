- accession: geo:GSE197289
  title: Human and mouse trigeminal ganglia cell atlas implicates multiple cell types in migraine
  description: The sensitization of trigeminal ganglion neurons contributes to primary headache disorders such as migraine, but the specific neuronal and non-neuronal trigeminal subtypes involved remain unclear. We thus developed a cell atlas in which human and mouse trigeminal ganglia are transcriptionally and epigenomically profiled at single-cell resolution. These data describe evolutionarily conserved and human-specific gene expression patterns within each trigeminal ganglion cell type, as well as the transcription factors and gene regulatory elements that contribute to cell-type-specific gene expression.

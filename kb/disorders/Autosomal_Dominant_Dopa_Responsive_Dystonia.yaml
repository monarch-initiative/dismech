inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Classic GTPCH1-deficient DRD is autosomal dominant with reduced and
    sex-biased penetrance. Dominant segregation was also reported for the
    IMPDH2 family; one of the two reported NR4A2 frameshift variants arose de
    novo, consistent with a dominant loss-of-function mechanism.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER

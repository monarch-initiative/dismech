- name: Reduced Tetrahydrobiopterin Availability
  subtypes:
  - GCH1-related GTPCH1-deficient DRD
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced GTPCH1 activity lowers tetrahydrobiopterin availability. BH4 is an
    obligate cofactor for tyrosine hydroxylase, so its deficiency limits
    catecholamine and dopamine synthesis. Hyperphenylalaninemia is not modeled
    in this dominant subtype because the systematic DRD review found it in PTS
    and QDPR disease and only rarely in autosomal recessive GCH1 disease.

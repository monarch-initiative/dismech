discussions:
- discussion_id: scope_orphanet_aggregate_rare_genes
  prompt: >-
    How should IMPDH2 and NR4A2 be represented when Orphanet includes them in an
    autosomal dominant DRD concept dominated by classic GCH1 disease?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - genetic#IMPDH2 heterozygous truncating variant
  - genetic#NR4A2 loss-of-function variants
  rationale: >-
    Treating all three genes as one mechanism would incorrectly transfer the
    classic BH4 deficiency, phenotype frequencies, and proven levodopa response
    to two very small and biologically distinct reports.
  evidence:
  - reference: ORPHA:98808
    reference_title: Autosomal dominant dopa-responsive dystonia
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      | GCH1 | GTP cyclohydrolase 1 | hgnc:4193 | Disease-causing germline
      mutation(s) in | | IMPDH2 | inosine monophosphate dehydrogenase 2 |
      hgnc:6053 | Disease-causing germline mutation(s) (loss of function) in |
      | NR4A2 | nuclear receptor subfamily 4 group A member 2 | hgnc:7981 |
      Disease-causing germline mutation(s) (loss of function) in |
    explanation: Orphanet places GCH1, IMPDH2, and NR4A2 in the same source record.
  - reference: DOI:10.1038/s41431-021-00939-1
    reference_title: "IMPDH2: a new gene associated with dominant juvenile-onset dystonia-tremor disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report IMPDH2 as a new gene to the dystonia disease entity.
    explanation: The primary report is framed as dystonia-tremor, not established classic DRD.
  resolved_date: "2026-07-21T00:00:00Z"
  resolution_note: >-
    Retain the ontology's aggregate boundary but use explicit molecular
    subtypes. GCH1 is canonical; IMPDH2 and NR4A2 are provisional branches with
    branch-specific mechanisms, phenotypes, and evidence limitations.
- discussion_id: phenotype_scope_hpa_ataxia_hearing
  prompt: >-
    Should Orphanet's aggregate hyperphenylalaninemia, ataxia, gait ataxia, and
    hearing-impairment annotations be treated as canonical dominant GCH1 features?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Reduced Tetrahydrobiopterin Availability
  rationale: >-
    The aggregate annotations conflict with gene-specific evidence and likely
    conflate different BH4 disorders or rare branches with classic GCH1 disease.
  evidence:
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperphenylalaninemia was seen in DYT/PARK-PTS, DYT/PARK-QDPR, and rarely
      reported in autosomal recessive DYT/PARK-GCH1.
    explanation: The systematic review excludes hyperphenylalaninemia from the canonical AD-GCH1 pattern.
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intellectual, cerebellar, sensory, and autonomic disturbances generally
      do not occur.
    explanation: GeneReviews argues against canonical cerebellar ataxia in GCH1-related disease.
  resolved_date: "2026-07-21T00:00:00Z"
  resolution_note: >-
    Do not model hyperphenylalaninemia, ataxia/gait ataxia, or hearing
    impairment as canonical phenotypes of this dominant entry. Retain the
    source discrepancy in curation provenance rather than the causal graph.
- discussion_id: impdh2_dopamine_and_levodopa_gap
  prompt: >-
    Does IMPDH2 deficiency actually reduce brain dopamine synthesis and produce
    a clinically meaningful levodopa response?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#IMPDH2 Deficiency in Guanine Nucleotide Biosynthesis
  rationale: >-
    The dopamine pathway was proposed from metabolic topology and patient-cell
    protein deficiency, but the reported family did not provide direct central
    dopamine measurements or a therapeutic levodopa challenge.
  evidence:
  - reference: DOI:10.1038/s41431-021-00939-1
    reference_title: "IMPDH2: a new gene associated with dominant juvenile-onset dystonia-tremor disorder"
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      IMPDH2 is a novel dystonia gene linked to the dopamine synthesis pathway,
      implying that the symptoms may be L-DOPA responsive.
    explanation: The primary paper explicitly states the response as an implication rather than an observation.
- discussion_id: gch1_regional_bioenergetic_imaging
  prompt: >-
    Are the basal-ganglia NAD reduction and cerebellar high-energy-phosphate
    changes observed in GCH1 carriers causal modifiers, compensatory changes, or
    treatment-related correlates?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Nigrostriatal Dopamine Synthesis Deficiency
  rationale: >-
    A 2026 cross-sectional imaging study found carrier- and symptom-specific
    metabolic and volumetric signals, but its modest sample and observational
    design cannot establish directionality or independence from levodopa exposure.
  evidence:
  - reference: PMID:42036356
    reference_title: Metabolic and Volumetric Alterations in the Basal Ganglia and the Cerebellum in Dopa-Responsive Dystonia in Symptomatic and Asymptomatic GCH1 Mutation Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Volumetric MRI and 31P-MRSI reveal region- and subgroup-specific
      metabolic and structural alterations in GCH1 MCs, linking basal ganglia
      vulnerability and cerebellar adaptation to clinical severity.
    explanation: The new imaging cohort motivates, but does not resolve, this mechanistic question.
- discussion_id: gch1_nonmotor_phenotype_uncertainty
  prompt: >-
    Are depression, sleep disturbance, or cognitive change intrinsic and
    recurrent manifestations of GCH1-related disease, or family- and
    treatment-context associations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#GCH1-related GTPCH1-deficient DRD
  rationale: >-
    Orphanet assigns several broad nonmotor phenotypes, but an intrafamilial
    study of one GCH1 family found no sleep or cognitive difference and only a
    pre-levodopa past-depression signal. This is insufficient for a stable
    disease-wide phenotype frequency.
  evidence:
  - reference: PMID:35782624
    reference_title: Neuropsychiatric and sleep study in autosomal dominant dopa-responsive dystonia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No significant difference was found between the groups in the prevalence
      of sleep disorders and in cognitive function.
    explanation: A single-family controlled study argues against broad sleep or cognitive assignments.
  - reference: PMID:35782624
    reference_title: Neuropsychiatric and sleep study in autosomal dominant dopa-responsive dystonia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of depression was higher in individuals with the molecular
      variant prior to the L-Dopa treatment.
    explanation: The same study found a limited depression signal that requires replication.
review_notes: >-
  Comprehensive review completed 2026-07-21. PubMed and primary full-text
  sources were checked through that date. ClinicalTrials.gov searches for
  "Dopa Responsive Dystonia", "GCH1 dystonia", and "Segawa disease" were
  fully paginated (one page each; 15, 5, and 4 raw hits respectively); active
  or recruiting records with direct or explicitly stated relevance are included
  above, while the status-unknown DYT5 sensorimotor study NCT05713721 and
  unrelated lexical matches were excluded. NCBI GEO/GDS, BioProject, and SRA
  searches for GCH1/dopa-responsive dystonia found no dedicated public omics
  accession. The MDSGene individual-level collection and the 2026 imaging
  cohort are therefore represented by PMID accessions with their limitations.
  The legacy updated_date is intentionally preserved for review provenance.

synonyms:
- Autosomal dominant Segawa syndrome
- DYT5a
- GTPCH1-deficient dopa-responsive dystonia
- Hereditary progressive dystonia with marked diurnal fluctuation
disease_term:
  preferred_term: autosomal dominant dopa-responsive dystonia
  term:
    id: MONDO:0971063
    label: autosomal dominant dopa-responsive dystonia
description: >-
  Autosomal dominant dopa-responsive dystonia is an Orphanet/MONDO disease
  concept centered on classic GTP cyclohydrolase 1 (GTPCH1)-deficient disease.
  Heterozygous pathogenic GCH1 variants reduce tetrahydrobiopterin-dependent
  nigrostriatal dopamine synthesis, usually causing childhood foot or limb
  dystonia with diurnal fluctuation and a dramatic, sustained response to
  low-dose levodopa. Penetrance and expression are variable and sex biased.
  The source ontology also places rare IMPDH2-associated dystonia-tremor and
  NR4A2-associated dystonia-parkinsonism in this concept; these are represented
  as provisional, subtype-specific branches because neither has the same depth
  of evidence as classic GCH1-related disease, and levodopa responsiveness was
  proposed rather than demonstrated in the reported IMPDH2 family.
has_subtypes:
- name: GCH1-related GTPCH1-deficient DRD
  display_name: Classic GCH1-related dopa-responsive dystonia (Segawa disease)
  classification: molecular
  description: >-
    The canonical form, caused by heterozygous GCH1 pathogenic variants and
    characterized by childhood lower-limb dystonia, diurnal fluctuation,
    variable progression to generalized dystonia or parkinsonism, and a marked
    sustained response to low-dose levodopa.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GTP cyclohydrolase 1-deficient dopa-responsive dystonia (GTPCH1-deficient
      DRD) is characterized by childhood-onset dystonia and a dramatic and
      sustained response to low doses of oral administration of levodopa.
    explanation: GeneReviews defines the canonical GCH1-related clinical form.
- name: IMPDH2-associated dystonia-tremor
  display_name: IMPDH2-associated dominant juvenile-onset dystonia-tremor
  classification: molecular_provisional
  description: >-
    A provisional branch based on one large Finnish family with a segregating
    heterozygous truncating IMPDH2 variant and reduced IMPDH2 protein in patient
    cells. The phenotype was juvenile-onset dystonia and tremor; impaired
    guanine-dependent dopamine synthesis and levodopa responsiveness remain
    proposed rather than clinically demonstrated.
  evidence:
  - reference: DOI:10.1038/s41431-021-00939-1
    reference_title: "IMPDH2: a new gene associated with dominant juvenile-onset dystonia-tremor disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a deleterious heterozygous truncating variant in the
      inosine monophosphate dehydrogenase gene (IMPDH2) by whole-exome
      sequencing, co-segregating with a dominantly inherited dystonia-tremor
      disease in a large Finnish family.
    explanation: The family study establishes the rare dominant dystonia-tremor association.
- name: NR4A2-associated dystonia-parkinsonism
  display_name: NR4A2 haploinsufficiency-associated dystonia-parkinsonism
  classification: molecular_provisional
  description: >-
    A provisional branch reported in two families. Childhood mild intellectual
    disability preceded early-adult dystonia-parkinsonism, with normal brain MRI
    and bilateral dopaminergic denervation on dopamine-transporter imaging.
  evidence:
  - reference: PMID:31922365
    reference_title: Loss-of-Function Mutations in NR4A2 Cause Dopa-Responsive Dystonia Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 patients reported here both had a history of mild intellectual
      disability in childhood and subsequently developed dystonia parkinsonism
      in early adulthood.
    explanation: Two molecularly characterized patients define this rare branch.

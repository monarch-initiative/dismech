diagnosis:
- name: Clinical recognition and low-dose levodopa trial
  presence: Positive
  description: >-
    Early-onset dystonia, diurnal fluctuation, and a dramatic sustained response
    to a carefully monitored low-dose levodopa/decarboxylase-inhibitor trial are
    major diagnostic red flags. A response does not by itself assign the gene or
    distinguish all DRD subtypes.
  evidence:
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dystonia, L-Dopa responsiveness, early age at onset, and diurnal
      fluctuations were identified as red flags.
    explanation: The systematic review identifies the key diagnostic pattern.
- name: Molecular genetic testing
  presence: Positive
  description: >-
    Identify a heterozygous pathogenic GCH1 variant to establish classic
    GTPCH1-deficient DRD. In atypical dystonia-tremor or
    neurodevelopmental dystonia-parkinsonism, a broader movement-disorder panel
    or genome-scale test can assess alternative genes, but IMPDH2 and NR4A2
    findings require phenotype-aware interpretation because their associations
    are based on very small numbers.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of GTPCH1-deficient DRD is established in a proband by
      identification of a heterozygous pathogenic variant in GCH1 by molecular
      genetic testing.
    explanation: GeneReviews supports GCH1 molecular confirmation.
- name: CSF neurotransmitter and pterin testing
  presence: Supportive
  description: >-
    When the classic phenotype is present but GCH1 testing is unrevealing,
    biochemical testing of CSF neurotransmitter metabolites and pterins can
    support a dopamine/BH4 synthesis disorder and help redirect testing toward
    recessive DRD or other BH4 defects. Hyperphenylalaninemia should not be used
    as a positive marker of classic dominant GCH1 disease.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with a suspected diagnosis of GTPCH1-deficient DRD and no
      identifiable GCH1 pathogenic variants, biochemical testing may be necessary.
    explanation: GeneReviews supports biochemical testing after negative molecular testing.
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hyperphenylalaninemia was seen in DYT/PARK-PTS, DYT/PARK-QDPR, and rarely
      reported in autosomal recessive DYT/PARK-GCH1.
    explanation: The systematic review refutes hyperphenylalaninemia as a canonical AD-GCH1 marker.
differential_diagnoses:
- name: Autosomal recessive dopa-responsive dystonia and other BH4 disorders
  disease_term:
    preferred_term: TH-deficient dopa-responsive dystonia
    term:
      id: MONDO:0011551
      label: TH-deficient dopa-responsive dystonia
  description: >-
    Biallelic TH, PTS, SPR, QDPR, or recessive GCH1 disorders can also cause a
    levodopa-responsive movement disorder and may include infantile
    parkinsonism, encephalopathy, seizures, microcephaly, oculogyric crises, or
    autonomic features.
  distinguishing_features:
  - Molecular testing shows a recessive genotype rather than a heterozygous GCH1 cause.
  - Hyperphenylalaninemia favors PTS, QDPR, or rare recessive GCH1 disease, not classic dominant GCH1 disease.
  - Severe infantile neurodevelopmental, autonomic, seizure, or oculogyric-crisis phenotypes are red flags for another DRD subtype.
  evidence:
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants in 5 genes (GCH1, TH, PTS, SPR, and QDPR), involved
      in dopamine/tetrahydrobiopterin biosynthesis or recycling, have been linked
      to Dopa-responsive dystonia (DRD).
    explanation: The systematic review defines the genetic differential and subtype-specific indicators.
- name: Hereditary spastic paraplegia
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  description: >-
    Childhood gait difficulty, brisk reflexes, ankle clonus, and leg spasticity
    can make GCH1-related disease appear to be pure hereditary spastic paraplegia.
  distinguishing_features:
  - Diurnal fluctuation, dystonia, bradykinesia, rigidity, or a marked levodopa response favor GCH1-related disease.
  - Atypical GCH1 disease can retain residual spasticity despite improvement of basal-ganglia signs on levodopa.
  - Include GCH1 in genetic testing when an HSP-like presentation has basal-ganglia signs or diurnal fluctuation.
  evidence:
  - reference: PMID:32278297
    reference_title: Autosomal dominant GCH1 mutations causing spastic paraplegia at disease onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCH1 mutations may cause a phenotype initially resembling hereditary
      spastic paraplegia (HSP) rather than DRD, with basal ganglia signs
      developing only after decades.
    explanation: The four-patient series directly establishes this diagnostic mimic.
treatments:
- name: Low-dose levodopa with a peripheral decarboxylase inhibitor
  description: >-
    Low-dose levodopa, usually combined with carbidopa or another peripheral
    decarboxylase inhibitor, bypasses the upstream BH4/tyrosine-hydroxylase
    bottleneck and usually produces rapid, near-complete, sustained motor benefit
    in classic GCH1-related disease. Dose changes should be gradual, chronic
    adverse motor fluctuations are uncommon, and abrupt discontinuation should
    be avoided. Evidence for the rare branches is much thinner: NR4A2 cases were
    reported as dopa responsive, whereas response was only hypothesized for the
    published IMPDH2 family.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  target_phenotypes:
  - preferred_term: Limb dystonia
    term:
      id: HP:0002451
      label: Limb dystonia
  - preferred_term: Parkinsonism
    term:
      id: HP:0001300
      label: Parkinsonism
  target_mechanisms:
  - target: Nigrostriatal Dopamine Synthesis Deficiency
    treatment_effect: BYPASSES
    evidence:
    - reference: PMID:41965601
      reference_title: "Genetic analysis reveals phenotypic variability in three Colombian families with dopa-responsive dystonia: novel genotype-phenotype correlations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All symptomatic individuals responded well to low-dose levodopa.
      explanation: The GCH1 family series supports bypass of the dopamine-synthesis deficit.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Motor benefit occurs immediately or within a few days of starting
      levodopa; full benefit occurs within several days to a few months.
    explanation: GeneReviews supports rapid clinical benefit.
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Discontinuation of levodopa treatment."
    explanation: GeneReviews supports avoiding discontinuation.

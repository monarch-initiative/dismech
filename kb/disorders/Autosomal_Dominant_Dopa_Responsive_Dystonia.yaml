progression:
- phase: Childhood presentation
  subtype: GCH1-related GTPCH1-deficient DRD
  age_range: Childhood, commonly before age 15 years
  notes: >-
    Gait disturbance from flexion-inversion foot dystonia is typical. Symptoms
    characteristically worsen later in the day and improve after sleep; arm
    dystonia, postural tremor, or slowness can occasionally be the first sign.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Initial symptoms are often gait difficulties attributable to
      flexion-inversion (equinovarus posture) of the foot.
    explanation: GeneReviews describes the usual presenting motor pattern.
- phase: Untreated evolution and later manifestations
  subtype: GCH1-related GTPCH1-deficient DRD
  age_range: Childhood through adulthood
  notes: >-
    Untreated dystonia may gradually generalize and parkinsonism can emerge
    later. Long diagnostic delay is associated with persistent residual motor
    signs even after levodopa treatment, although most symptoms remain highly
    levodopa responsive.
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In general, gradual progression to generalized dystonia is observed.
    explanation: GeneReviews supports untreated spread of dystonia.
  - reference: PMID:33875303
    reference_title: "Early-onset autosomal dominant GTP-cyclohydrolase I deficiency: Diagnostic delay and residual motor signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean duration of diagnostic delay was 14.6 years overall: 12.0 years
      in RMS-negative patients and 21.2 years in RMS-positive patients.
    explanation: The meta-analysis links longer delay with residual motor signs.
- phase: Juvenile-onset progressive dystonia-tremor
  subtype: IMPDH2-associated dystonia-tremor
  age_range: 9-20 years in the reported family
  notes: >-
    The single reported kindred developed dystonia and tremor from late
    childhood through young adulthood, with progressive motor symptoms in some
    relatives. This trajectory should not be generalized beyond that family.
  evidence:
  - reference: DOI:10.1038/s41431-021-00939-1
    reference_title: "IMPDH2: a new gene associated with dominant juvenile-onset dystonia-tremor disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disease-onset was between 9 and 20 years of age.
    explanation: The primary family report gives the observed onset range.
- phase: Neurodevelopmental presentation followed by movement disorder
  subtype: NR4A2-associated dystonia-parkinsonism
  age_range: Childhood to early adulthood
  notes: >-
    Mild intellectual disability was present in childhood, with dystonia and
    parkinsonism appearing in early adulthood in both reported patients.
  evidence:
  - reference: PMID:31922365
    reference_title: Loss-of-Function Mutations in NR4A2 Cause Dopa-Responsive Dystonia Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 patients reported here both had a history of mild intellectual
      disability in childhood and subsequently developed dystonia parkinsonism
      in early adulthood.
    explanation: The two cases establish this branch-specific sequence.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Classic GCH1-related disease is usually rapidly and durably treatable, but
    delayed recognition can cause years of impaired gait, unnecessary
    orthopedic procedures, and persistent residual motor signs. Treatment is
    generally lifelong. Burden is more variable in the very rare IMPDH2 and
    NR4A2 branches, for which the evidence base is small.
  evidence:
  - reference: PMID:33875303
    reference_title: "Early-onset autosomal dominant GTP-cyclohydrolase I deficiency: Diagnostic delay and residual motor signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients exhibited RMS, and four patients underwent orthopedic
      surgery.
    explanation: Diagnostic delay can produce avoidable procedures and persistent disability.
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maximum benefit (complete or near-complete responsiveness of symptoms) is
      generally achieved by <300-400 mg/day of levodopa/DCI.
    explanation: The excellent treatment response moderates typical long-term burden.
mechanistic_hypotheses:
- hypothesis_group_id: gch1_bh4_dopamine_model
  hypothesis_label: GCH1-BH4-nigrostriatal dopamine deficiency model
  status: CANONICAL
  applies_to_subtypes:
  - GCH1-related GTPCH1-deficient DRD
  description: >-
    GCH1 haploinsufficiency lowers GTP cyclohydrolase I activity and BH4
    availability, limiting tyrosine-hydroxylase-dependent dopamine synthesis in
    nigrostriatal motor circuits.
  evidence:
  - reference: PMID:41965601
    reference_title: "Genetic analysis reveals phenotypic variability in three Colombian families with dopa-responsive dystonia: novel genotype-phenotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tetrahydrobiopterin (BH4) deficiency impairs dopamine synthesis in the
      basal ganglia, leading to childhood-onset dystonia with excellent
      response to levodopa.
    explanation: Recent human family evidence states the canonical pathway.
- hypothesis_group_id: impdh2_guanine_dopamine_hypothesis
  hypothesis_label: IMPDH2 deficiency limits guanine-dependent dopamine synthesis
  status: EMERGING
  applies_to_subtypes:
  - IMPDH2-associated dystonia-tremor
  description: >-
    Reduced IMPDH2 may make guanine nucleotide production rate limiting in
    post-mitotic neural cells and thereby constrain GTP supply to BH4 and
    dopamine synthesis. This was proposed from one family and patient-cell
    study; dopamine deficiency and levodopa response were not directly tested.
  evidence:
  - reference: DOI:10.1038/s41431-021-00939-1
    reference_title: "IMPDH2: a new gene associated with dominant juvenile-onset dystonia-tremor disorder"
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We propose that in post-mitotic cells of the CNS, with considerably lower
      nucleotide pools than in cultured fibroblasts and high IMPDH2 expression,
      the enzyme defect becomes rate-limiting, challenging guanine and dopamine
      synthesis and resulting in dystonia and tremor.
    explanation: The authors explicitly frame the dopamine link as a proposal.
- hypothesis_group_id: nr4a2_denervation_model
  hypothesis_label: NR4A2 haploinsufficiency causes dopaminergic denervation
  status: EMERGING
  applies_to_subtypes:
  - NR4A2-associated dystonia-parkinsonism
  description: >-
    NR4A2 loss of function may impair development or maintenance of the
    dopaminergic system, producing a neurodevelopmental phenotype followed by
    dystonia-parkinsonism and dopamine-transporter evidence of denervation.
  evidence:
  - reference: PMID:31922365
    reference_title: Loss-of-Function Mutations in NR4A2 Cause Dopa-Responsive Dystonia Parkinsonism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging was normal, and DATscan suggested
      bilateral dopaminergic denervation.
    explanation: The two patients provide direct imaging evidence for this model.

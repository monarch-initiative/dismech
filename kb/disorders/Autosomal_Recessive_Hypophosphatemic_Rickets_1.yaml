    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five Chinese patients from three unrelated pedigrees presented with lower extremity deformity and short stature."
    explanation: >-
      All five patients in these three selected families had short stature; this does not estimate population-wide
      penetrance.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients were a 53-year-old woman and a 50-year-old man with short stature and skeletal deformities who were the offspring of a first-cousin marriage."
    explanation: Short stature persisting into adulthood.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The affected individual in F-2 had a final adult height of 172 cm (90th–95th percentile), 3 cm above

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  description: >-
    Affected individuals are homozygous, typically in consanguineous or
    endogamous families, or rarely compound heterozygous. Heterozygous parents
    are clinically unaffected but are not biochemically inert: carriers in one
    family showed mild hypophosphatemia and focal osteomalacia on biopsy, and
    carriers in two further kindreds had normal phosphate with an intermediate
    bone density and a mild histomorphometric mineralization defect. Numerical
    penetrance of biallelic genotypes is not established; expressivity between
    families is wide.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we mapped an autosomal recessive form (designated ARHP) to chromosome 4q21 and identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous bone matrix protein expressed in osteoblasts and osteocytes."
    explanation: The discovery study mapped the disorder as autosomal recessive and found homozygous DMP1 mutations in the affected individuals.
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents and available unaffected siblings were heterozygous for c.485Tdel."
    explanation: Heterozygous parents and siblings were unaffected, the segregation pattern of a recessive trait.
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the parents of the three affected children are first-degree cousins"
    explanation: Consanguinity is the usual route to homozygosity in reported families.
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two heterozygous carriers of the mutation also showed mild hypophosphatemia, and bone biopsy in one of these individuals showed focal areas of osteomalacia."
    explanation: Supports a subclinical carrier phenotype, which is why penetrance is recorded as unknown rather than as a clean recessive pattern.
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report for the first time compound heterozygous DMP1 mutations consisting of a large deletion and a novel start codon mutation (c.1A > T, p.Met1Leu) in a Chinese patient with ARHR1."
    explanation: Compound heterozygosity in a non-consanguineous family confirms that biallelic loss, not homozygosity per se, is what causes disease.
prevalence:
- population: Worldwide, reported cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence has been measured. Reviews in 2020
    and 2023 count about 30 reported patients from a few dozen families of
    European, Middle Eastern, Turkish, Finnish, Japanese, Chinese, Indian and
    South American origin; the disorder is described as extremely rare.
  evidence:
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autosomal recessive hypophosphatemic rickets type 1 (ARHR1), caused by a homozygous mutation of dentin matrix protein 1 (DMP1), is extremely rare, with only 30 reported patients"
    explanation: Gives the literature case count that supports the ultra-rare class and the cases-in-literature measure.
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype correlation analysis including 30 cases (25 from literature review and 5 from our study)"
    explanation: An independent 2020 literature census reaches the same order of magnitude.
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal recessive hypophosphatemic rickets (ARHR) is an extremely rare disorder of autosomal recessive inheritance, characterized by hypophosphatemia resulting from renal phosphate wasting."
    explanation: Qualitative rarity statement from a family report.
progression:
- phase: Early childhood onset
  age_range: First three years of life
  notes: >-
    Disease declares itself with weight bearing: leg bowing, painful legs,
    short stature and abnormal gait, with rickets on radiographs and
    hypophosphatemia on first testing.
  evidence:
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case presented at the age of 3 years with bowing of his legs and showed hypophosphatemia due to insufficient renal phosphate retention."
    explanation: Typical age and mode of presentation in a family report.
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband is a 4-year-old boy, who developed genu varum when he was able to walk at age 1 year and tooth loss after a mild hit at age 3.5 years."
    explanation: Onset with walking, and early dental involvement, in an independent case.
- phase: Adult disease
  age_range: Adulthood into the seventh and eighth decades
  notes: >-
    Osteomalacia, pseudofractures and bone pain persist, and in the longest
    followed family joint pain, contractures, cranial hyperostosis,
    enthesopathy, paraspinal ligament calcification and complete spinal
    immobilization accumulated over decades. Survival into old age is
    documented; mortality has not been quantified.
  evidence:
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With increasing age, both patients developed severe joint pain, contractures, and complete immobilization of the spine."
    explanation: Documents the progressive adult musculoskeletal course in the 78-year-old and 66-year-old siblings.
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal phenotype in ARHP may be significantly more severe than in other forms of hypophosphatemic rickets."
    explanation: The authors' own comparison with XLH and ADHR, drawn from the adult course.
pathophysiology:
- name: Biallelic DMP1 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion. Homozygous or compound heterozygous DMP1 variants
    abolish dentin matrix protein 1, a secreted SIBLING-family acidic
    phosphoprotein expressed by osteocytes, mature osteoblasts and odontoblasts.
    Reported alleles include start-codon substitutions (p.Met1Val, p.Met1Leu),
    nonsense variants (p.Trp33Ter, p.Glu32Ter, p.Glu186Ter), frameshifts
    (p.Glu163ArgfsTer53), splice-site changes (IVS5-1G>A, c.184-1G>A), a 7-bp
    C-terminal deletion that replaces the last 18 residues with 33 non-native
    ones, and a 49-kb deletion removing most of the gene. In cells the
    start-codon mutant never enters the secretory pathway, whereas the
    C-terminal deletion mutant is secreted but abnormally processed. DMP1 is
    cleaved in the matrix into a 37-kDa N-terminal and a 57-kDa C-terminal
    fragment, and the C-terminal fragment alone rescues the null mouse, which
    matches the observation that patients with C-terminal-affecting alleles
    are shorter and more hypophosphatemic.
  genes:
  - preferred_term: DMP1
    term:
      id: hgnc:2932
      label: DMP1
  genetic_context:
    gene:
      preferred_term: DMP1
      term:
        id: hgnc:2932
        label: DMP1
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      Biallelic germline loss of function; homozygous in most families, compound
      heterozygous in one reported patient.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analyses showed that autosomal recessive hypophosphatemic rickets family carried a mutation affecting the DMP1 start codon, and a second family carried a 7-bp deletion disrupting the highly conserved DMP1 C terminus."
    explanation: One of the two simultaneous discovery reports; identifies the start-codon and C-terminal deletion alleles.
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous bone matrix protein expressed in osteoblasts and osteocytes"
    explanation: The companion discovery report; establishes the gene and its expression in the mineralizing lineage.
  - reference: PMID:19007919
    reference_title: Molecular analysis of DMP1 mutants causing autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These analyses showed that the M1V DMP1 mutant was not sorted to the trans-Golgi network (TGN) and secretory pathway, but filled the entire cytoplasm."
    explanation: Direct cellular demonstration that the start-codon allele is a loss of the secreted protein.
  - reference: PMID:19007919
    reference_title: Molecular analysis of DMP1 mutants causing autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analyses of this family demonstrated that the affected members had elevated serum FGF23 and carried a large, biallelic deletion that removed the majority of DMP1."
    explanation: A whole-gene deletion produces the same disease, confirming that the mechanism is loss of function rather than a specific altered protein.
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients harboring mutations affecting C-terminal fragment of DMP1 presented with shorter stature (Z score of height = - 3.4 ± 1.6 vs - 1.0 ± 1.6, p = 0.001) and lower serum phosphate level (0.70 ± 0.15 vs 0.84 ± 0.16, p = 0.03) than those harboring mutations only affecting N-terminal fragment"
    explanation: Genotype-phenotype pooling across 30 cases; localizes the disease-critical function to the C-terminal fragment.
  - reference: PMID:20734454
    reference_title: The biological function of DMP-1 in osteocyte maturation is mediated by its 57-kDa C-terminal fragment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Not only did expression of the full-length DMP-1 in bone cells fully rescue the skeletal abnormalities of Dmp1 null mice, but the 57-kDa fragment also had similar results."
    explanation: Identifies the C-terminal fragment as the functional domain whose loss is sufficient for disease, consistent with the human genotype-phenotype pattern.
  downstream:
  - target: Defective Osteocyte Maturation and Pericellular Mineralization
    causal_link_type: DIRECT
    description: >-
      DMP1 is deposited in the pericellular and canalicular matrix of the
      osteocyte; without it osteoid osteocytes fail to mature and the matrix
      around them is not mineralized.
    evidence:
    - reference: PMID:17033621
      reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in defective osteocyte maturation and increased FGF23 expression, leading to pathological changes in bone mineralization."
      explanation: States the causal step from DMP1 absence to defective osteocyte maturation.
  - target: Increased Osteocytic FGF23 Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DMP1 loss de-represses Fgf23 transcription in osteocytes. The coupling is
      not direct; mouse work implicates activation of FGF receptor signalling
      shared with PHEX loss, but the molecular intermediates are unresolved.
    evidence:
    - reference: PMID:21507898
      reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inactivating mutations of the endopeptidase PHEX or the SIBLING protein DMP1 result in equivalent intrinsic bone mineralization defects and increased Fgf23 expression in osteocytes."
      explanation: States that DMP1 inactivation increases osteocytic Fgf23 expression, the edge this link records.
    - reference: PMID:21507898
      reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mechanisms whereby PHEX and DMP1 regulate Fgf23 expression are unknown."
      explanation: Justifies the unknown-intermediates link type.
- name: Defective Osteocyte Maturation and Pericellular Mineralization
  biological_scale: CELLULAR
  description: >-
    Osteocytes in DMP1-deficient bone, newly embedded or deep, keep expressing
    osteoblast and osteoid-osteocyte markers, have an abnormal
    lacunocanalicular network, and sit in matrix whose mineral-to-matrix ratio
    is reduced. This is a cell-autonomous defect: DMP1-deficient
    osteoprogenitors mineralize poorly in vitro at normal phosphate and in the
    absence of FGF23, and heterozygous carriers with normal serum phosphate
    show dysmorphic osteocytes and a mild histomorphometric mineralization
    defect. The node feeds both arms of the disease, the endocrine arm through
    FGF23 and the local arm through matrix mineralization.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: osteoblast to osteocyte differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  - preferred_term: pericellular bone matrix mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in defective osteocyte maturation and increased FGF23 expression, leading to pathological changes in bone mineralization."
    explanation: Establishes defective osteocyte maturation as the primary cellular lesion in the null mouse.
  - reference: PMID:16294270
    reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mineral-to-matrix ratios (spectroscopic parameter of relative mineral content) were significantly lower in dmp1 KO mice tibias compared with WT and HET at 4 and 16 weeks."
    explanation: Quantifies the matrix hypomineralization of DMP1-deficient bone by infrared imaging.
  - reference: PMID:20734454
    reference_title: The biological function of DMP-1 in osteocyte maturation is mediated by its 57-kDa C-terminal fragment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This included rescue of growth plate defects, osteomalacia, abnormal osteocyte maturation, and the abnormal osteocyte lacunocanalicular system."
    explanation: Names the abnormal osteocyte maturation and lacunocanalicular system as DMP1-dependent, since restoring DMP1 in bone cells corrects them.
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro, we show that FGF23 directly impaired osteoprogenitors' differentiation and that DMP1 deficiency contributed to impaired mineralization independent of FGF23 or Pi levels."
    explanation: Shows the mineralization defect is intrinsic to DMP1 deficiency and not only a consequence of FGF23 or hypophosphatemia.
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A trans-iliac bone biopsy from one of the ARHR1 carriers showed histomorphometric signs of a mild mineralization defect despite euphosphatemia, plus distinct osteocyte dysmorphology."
    explanation: Human evidence that DMP1 haploinsufficiency alters osteocytes and mineralization even when phosphate is normal, supporting a phosphate-independent local defect.
  downstream:
  - target: Increased Osteocytic FGF23 Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Immature, poorly mineralized osteocytes overproduce FGF23; whether the
      trigger is the maturation arrest itself, the unmineralized pericellular
      matrix, or altered phosphate sensing through FGFR is not settled.
    evidence:
    - reference: PMID:21542006
      reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Finally, a working hypothesis is proposed to explain how phosphate and DMP1 control osteocyte maturation."
      explanation: The authors treat the maturation-FGF23 relationship as a hypothesis, which is why this edge is typed unknown-intermediates.
  - target: Skeletal Mineralization Failure
    causal_link_type: DIRECT
    description: >-
      The local, phosphate-independent contribution: DMP1-deficient matrix
      mineralizes poorly even when phosphate and FGF23 are corrected. This is
      the edge that distinguishes ARHR1 from purely endocrine phosphate wasting.
    evidence:
    - reference: PMID:37943605
      reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, osteocyte-specific deletion of Fgf23 resulted in a partial correction of FGF23 excess, which was sufficient to fully restore serum Pi levels but only partially corrected the bone phenotype."
      explanation: Normalizing phosphate leaves part of the bone defect in place, so a DMP1-intrinsic route to mineralization failure exists alongside the endocrine one.
- name: Increased Osteocytic FGF23 Production
  biological_scale: CELLULAR
  description: >-
    Fgf23 transcription in osteocytes rises more than a hundredfold in
    DMP1-deficient bone, with little of the protein cleaved, so intact hormone
    is released. Compound Phex/Dmp1 mutant mice show no additive increase, and
    an FGFR inhibitor blocks the induction in both, so DMP1 and PHEX appear to
    restrain FGF23 through a common pathway that involves FGF receptor
    signalling in the osteocyte. In human bone, FGF23 expression is increased
    in the homozygote and, less so, in the heterozygous carrier. The set point
    is also shifted: when serum phosphate is raised, DMP1-deficient bone
    responds by producing still more FGF23.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  genes:
  - preferred_term: FGF23
    term:
      id: hgnc:3680
      label: FGF23
  biological_processes:
  - preferred_term: FGF receptor signalling in osteocytes
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: INCREASED

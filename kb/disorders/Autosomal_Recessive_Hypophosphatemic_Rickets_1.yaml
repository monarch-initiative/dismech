    not established by these reports.
  review_notes: >-
    NEEDS_TERM: HP:0100686 denotes inflammatory enthesitis and would
    misrepresent the calcific, ossifying enthesopathy of ARHR1; no suitably
    specific HPO term is assigned, matching the decision in the XLH entry.

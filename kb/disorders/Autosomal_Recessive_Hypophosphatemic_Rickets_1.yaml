        not correct the impaired mineralization observed in Dmp1-null osteoblast cultures, suggesting that
        DMP1 deficiency directly contributes to the mineralization defect despite adequate Pi supply and normal
        FGF23 production.
      explanation: >-
        Mineralization remained impaired after differentiation and FGF23 production were corrected in cultured
        cells.
- name: Increased Bone FGFR Signaling
  biological_scale: CELLULAR
  description: >-

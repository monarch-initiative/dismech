  - reference: PMID:39011543
    reference_title: Lessons learned from the real-world diagnosis and management of hereditary hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Genetic testing showed a homozygous pathogenic variant in DMP1 (c.1122 T > G, p.(Tyr374*)) confirming
      a genetic diagnosis of autosomal recessive hypophosphatemic rickets.
    explanation: >-
      The 17-year-old with persistent deformity had this DMP1 nonsense variant.
biochemical:
- name: Serum Phosphate
  presence: Decreased below the age-related reference range
  context: >-
    Fasting, interpreted against age-specific intervals; in the pooled series
    mean serum phosphate was 0.70 mmol/L with C-terminal alleles and 0.84
    mmol/L with N-terminal alleles.
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical examination revealed hypophosphatemia with renal phosphate excretion and low levels of 1,25(OH)(2)D."
    explanation: The core biochemical finding.
    quote_role: PRIMARY_RESULT
- name: Renal Phosphate Wasting (TmP/GFR)
  presence: Decreased tubular reabsorption of phosphate despite hypophosphatemia
  context: >-
    Paired fasting serum and urine phosphate and creatinine give TmP/GFR;
    phosphate wasting is isolated, without glycosuria, aminoaciduria or
    acidosis, and with normal calcium excretion.
  evidence:
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed hypophosphatemia due to insufficient renal phosphate retention"
    explanation: Renal phosphate wasting documented at presentation.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "isolated renal phosphate-wasting associated with elevated fibroblast growth factor 23 (FGF23) levels and normocalciuria"
    explanation: Isolated wasting with normocalciuria distinguishes it from generalized tubulopathy and from calciopenic rickets.
    quote_role: PRIMARY_RESULT
- name: Intact FGF23
  presence: Elevated or inappropriately normal for the degree of hypophosphatemia
  specificity: >-
    Interpret in relation to phosphate, assay and treatment. Intact FGF23 and C-terminal FGF23 are not interchangeable:
    C-terminal assays detect fragments as well as full-length hormone. Neither establishes the causal gene.
    Burosumab affects assay interpretation, so serial measured FGF23 is not a reliable treatment-response target.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intact plasma levels of the phosphaturic protein FGF23 were clearly elevated in two of four affected individuals"
    explanation: Elevated in half of the discovery cohort, inappropriately normal in the rest.
    quote_role: PRIMARY_RESULT
- name: 1,25-Dihydroxyvitamin D
  presence: Often inappropriately normal or low; elevated values can occur
  context: >-
    FGF23 restrains calcitriol synthesis and increases catabolism, but net levels depend on PTH, age and treatment.
    Elevated calcitriol was measured in the compound-heterozygote and in adult Dmp1-null mice.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "providing a possible explanation for the phosphaturia and inappropriately normal 1,25(OH)2D levels"
    explanation: Inappropriately normal calcitriol in the discovery families.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical examination revealed hypophosphatemia with renal phosphate excretion and low levels of 1,25(OH)(2)D."
    explanation: Frankly low calcitriol in the Japanese siblings.
    quote_role: PRIMARY_RESULT
- name: Alkaline Phosphatase
  presence: Elevated with active rickets or osteomalacia
  context: >-
    Interpret with age-specific ranges and clinical response. Total ALP may reflect liver disease; bone-specific
    measurements can help. During conventional treatment, normalization of serum phosphate is not the sole
    therapeutic target.
  evidence:
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum alkaline phosphatase activity was elevated, with initially normal PTH."
    explanation: Elevated ALP at diagnosis.
    quote_role: PRIMARY_RESULT
- name: Parathyroid Hormone and Calcium
  presence: Calcium and PTH may be normal; secondary hyperparathyroidism or hypocalcemia can occur
  context: >-
    Normal PTH supports a phosphopenic pattern but does not distinguish all cases. Elevated PTH occurs in affected
    children and adults and can reflect phosphate treatment, inadequate calcium/vitamin D or the disease context.
    Monitor both minerals and PTH during therapy.
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum calcium, parathyroid hormone, and urinary calcium excretion were within the normal range, leading to clinical diagnosis of ARHR."
    explanation: Normal calcium, PTH and calciuria in the Japanese siblings.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analysis was consistent with normal serum calcium and 1-25(OH)2D levels, low to normal serum phosphorus and elevated PTH values."
    explanation: Elevated PTH in the Lebanese adult sisters, the exception that the presence field records.
    quote_role: PRIMARY_RESULT
diagnosis:
- name: Clinical and Biochemical Evaluation for FGF23-Mediated Phosphate Wasting
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Evaluate rickets, limb deformity or adult osteomalacia with age-adjusted fasting serum phosphate, paired
    urine/serum measurements for renal phosphate handling, calcium, ALP, PTH, vitamin D status, renal function
    and FGF23 interpreted by assay. Normal calcium/PTH and inappropriately normal or low calcitriol are common
    patterns, not requirements. A recessive pedigree is suggestive but absent family history does not exclude
    compound heterozygosity. Assess generalized tubular abnormalities, nutritional causes and other genetic
    phosphate-wasting disorders.
  results: >-
    Inappropriate renal phosphate loss and nonsuppressed FGF23 support an FGF23-mediated disorder; molecular
    testing distinguishes DMP1 from phenocopies.
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum calcium, parathyroid hormone, and urinary calcium excretion were within the normal range, leading to clinical diagnosis of ARHR."
    explanation: The biochemical pattern that led to the clinical diagnosis before sequencing.
    quote_role: PRIMARY_RESULT
- name: DMP1 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Confirm biallelic pathogenic or likely pathogenic DMP1 variants, with segregation/phase assessment. Use
    a hereditary hypophosphatemia panel or exome analysis that includes copy-number detection, with orthogonal
    confirmation of deletions when indicated. A deletion may make the remaining allele appear homozygous; discordant
    parental segregation should prompt investigation. A VUS alone is not diagnostic. Broader analysis helps
    distinguish PHEX, FGF23, ENPP1, FAM20C and transporter-gene disease.
  results: Homozygous or compound heterozygous pathogenic DMP1 variants, with deletion analysis.
  evidence:
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maternally inherited deletion was validated by Cytoscan and qPCR, and the breakpoint was finally identified by long-range PCR and Sanger sequencing."
    explanation: Shows that copy-number analysis was needed to find the second allele.
    quote_role: PRIMARY_RESULT
  - reference: PMID:39011543
    reference_title: Lessons learned from the real-world diagnosis and management of hereditary hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cases prompt consideration of the (i) frequent misdiagnosis of hypophosphatemic rickets in clinical practice and the importance of comprehensive genetic testing"
    explanation: Real-world series including a DMP1 case, arguing for comprehensive rather than restricted testing.
    quote_role: PRIMARY_RESULT
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/6806102
    reference_title: "https://oup.silverchair-cdn.com/article-minimal/6806102"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      this mutation was absent in the proband’s mother (I-2), suggesting that the existence of the CNV in the
      proband that he might have inherited from his mother made the mutation appear homozygous in the proband.
    explanation: >-
      The apparently homozygous start-codon call was resolved to paternal sequence variant plus maternal deletion
      by copy-number and segregation studies.
differential_diagnoses:
- name: X-Linked Hypophosphatemia
  disease_term:
    preferred_term: X-linked dominant hypophosphatemic rickets
    term:
      id: MONDO:0010619
      label: X-linked dominant hypophosphatemic rickets
  description: >-
    The common FGF23-mediated phosphate-wasting rickets, biochemically
    indistinguishable from ARHR1; PHEX and DMP1 restrain FGF23 through a common
    osteocyte pathway.
  distinguishing_features:
  - X-linked dominant pedigree with affected heterozygous females, versus unaffected carrier parents.
  - PHEX rather than biallelic DMP1 variants.
  - The adult hyperostotic-osteosclerotic and severe enthesopathic phenotype is more prominent in ARHR1 families.
  evidence:
  - reference: PMID:21507898
    reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that PHEX and DMP1 control a common pathway regulating bone mineralization and FGF23 production, the latter involving activation of the FGFR signaling in osteocytes."
    explanation: Explains why the two disorders are biochemically alike and must be separated by pedigree and genotype.
    quote_role: PRIMARY_RESULT
- name: Autosomal Recessive Hypophosphatemic Rickets 2
  disease_term:
    preferred_term: ENPP1-related autosomal recessive hypophosphatemic rickets
    term:
      id: MONDO:0013219
      label: hypophosphatemic rickets, autosomal recessive, 2
  description: >-
    The ENPP1-related recessive form, with the same FGF23-driven renal
    phenotype but a different initiating lesion in pyrophosphate metabolism.
  distinguishing_features:
  - Biallelic ENPP1 rather than DMP1 variants.
  - ENPP1 disease spans neonatal arterial calcification to rickets or osteoporosis; arterial calcification is not a feature of ARHR1.
  evidence:
  - reference: PMID:42412262
    reference_title: "When X Does Not Mark the Spot: Autosomal Dominant and Recessive Forms of Renal Hypophosphatemic Rickets and Osteomalacia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in multiple genes cause dominant (FGF23, SGK3, FGFR1), recessive (DMP1, ENPP1, FAM20C, INPPL1) or even somatic (NRAS, HRAS, GNAS, gene fusions) conditions of FGF23 excess, with important phenotypic differences."
    explanation: Places DMP1 and ENPP1 as separate recessive causes of FGF23 excess. Evidence source is OTHER because this is a review article.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:42412262
    reference_title: "When X Does Not Mark the Spot: Autosomal Dominant and Recessive Forms of Renal Hypophosphatemic Rickets and Osteomalacia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ENPP1 variants cause phenotypes ranging from severe neonatal vascular calcifications to rickets or osteoporosis"
    explanation: The vascular calcification spectrum that separates ARHR2 clinically. Evidence source is OTHER because this is a review article.
    quote_role: REVIEW_SYNTHESIS
- name: Sclerosing Bone Dysplasias
  description: >-
    Adult ARHR1 with cranial hyperostosis and high axial bone density has been
    misdiagnosed as a familial sclerosing bone dysplasia and worked up for
    osteopetrosis.
  distinguishing_features:
  - Hypophosphatemia with renal phosphate wasting and elevated FGF23 are absent in the primary sclerosing dysplasias.
  - Childhood rickets and osteomalacia precede the sclerosis.
  evidence:
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of known genes involved in osteopetrosis showed normal results."
    explanation: The sisters were first investigated as a sclerosing dysplasia before exome sequencing found DMP1.
    quote_role: PRIMARY_RESULT
treatments:
- name: Oral Phosphate with Active Vitamin D
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Divided oral phosphate with calcitriol or alfacalcidol is conventional treatment for FGF23-mediated rickets,
    including ARHR1. Adjust treatment to growth, symptoms, healing and ALP/PTH while monitoring calcium, urinary
    calcium and renal function; sustained normal phosphate is not the sole target. Clinical reports document
    healing of rickets but variable growth and residual disease. Gastrointestinal intolerance, hypercalciuria,
    nephrocalcinosis and hyperparathyroidism limit treatment. Adult mouse phosphate loading without active
    vitamin D worsened disease under that protocol; this does not by itself define a human regimen.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phosphate
      term:
        id: CHEBI:26020
        label: phosphate
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Chronic Hypophosphatemia
    treatment_effect: MODULATES
    description: Divided phosphate doses transiently raise available phosphate without correcting the upstream FGF23 excess or the lowered set point.
  - target: Suppressed Renal Calcitriol Synthesis
    treatment_effect: BYPASSES
    description: >-
      Active vitamin D supports intestinal mineral absorption in the setting of FGF23-mediated suppression
      of renal calcitriol production; measured calcitriol is not invariably low.
  - target: Skeletal Mineralization Failure
    treatment_effect: MODULATES
    description: Together phosphate and active vitamin D partly improve rickets and osteomalacia.
    evidence:
    - reference: PMID:35896139
      reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Traditionally, treatment consists of oral phosphate replacement and the addition of calcitriol but this approach is limited by modest efficacy and potential renal and gastrointestinal side effects."
      explanation: Conventional therapy acts on the mineralization defect with modest efficacy, which is what the MODULATES effect records.
      quote_role: BACKGROUND
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Traditionally, treatment consists of oral phosphate replacement and the addition of calcitriol but this approach is limited by modest efficacy and potential renal and gastrointestinal side effects."
    explanation: States the conventional regimen for ARHR1 and its limits.
    quote_role: BACKGROUND
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibroblast-growth factor 23 (FGF23)-associated hypophosphatemic rickets was historically treated with frequent doses of oral phosphate salts in combination with active vitamin D, whereas tumor-induced osteomalacia (TIO) should primarily undergo tumor resection, if possible."
    explanation: Guidance for the FGF23-associated class to which ARHR1 belongs. Evidence source is OTHER because this is a guidance document.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adjustment of medication should be done with consideration of treatment-associated side effects, including diarrhea, gastrointestinal discomfort, hypercalciuria, secondary hyperparathyroidism, and development of nephrocalcinosis or nephrolithiasis."
    explanation: The monitoring trade-off of conventional therapy. Evidence source is OTHER because this is a guidance document.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Six weeks of dietary Pi supplementation exacerbated FGF23 production, hyperparathyroidism, renal Pi excretion, and osteomalacia."
    explanation: Model evidence that phosphate loading alone is counterproductive in DMP1 deficiency.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Resolution of rickets and normalization of alkaline phosphatase were observed during treatment with phosphate
      supplementation and calcitriol; however, the TmP/GFR remained low.
    explanation: >-
      Observed response in the discovery families supports clinical benefit without establishing complete correction
      of all skeletal disease.
- name: Burosumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    FGF23-neutralizing antibody used off-label for ARHR1 in specialist care. The August 2025 US label covers
    XLH from six months and unresectable or unlocalizable phosphaturic-mesenchymal-tumor-associated TIO from
    two years; it does not include ARHR1. Two adult brothers receiving monthly treatment had improved pain/function
    and phosphate, with near-healing of one pseudofracture after five months. The younger brother still had
    subnormal phosphate before the next dose; improvement in mouth opening followed concurrent corrective surgery
    and does not establish reversal of ossification by the drug. Follow-up was one and two years, with no reported
    adverse effects; these cases cannot establish long-term safety or pediatric efficacy. A later adult report
    describes treatment after conventional therapy, but its available abstract does not quantify response.
    Genetic reduction of osteocytic FGF23 in mice is not equivalent to antibody treatment and left residual
    FGF23 excess and skeletal defects.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: burosumab
      term:
        id: NCIT:C119744
        label: Burosumab
  target_mechanisms:
  - target: Elevated Circulating Intact FGF23
    treatment_effect: INHIBITS
    description: Burosumab binds circulating FGF23 and blocks its renal phosphaturic and calcitriol-suppressing actions.
    evidence:
    - reference: PMID:35896139
      reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Monthly administration of burosumab to 2 brothers afflicted with the disorder resulted in normalization of serum phosphate, healing of pseudofracture, diminished fatigue, less bone pain, and reduced incapacity arising from the extensive enthesopathy and soft tissue fibrosis/calcification that characterizes this disorder."
      explanation: Phosphate normalized when FGF23 was neutralized, the on-target effect in ARHR1 patients.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The advent of burosumab (Crysvita), a fully humanized monoclonal antibody to FGF23 for the treatment of X-linked hypophosphatemia and tumor-induced osteomalacia, offers a unique opportunity to evaluate its safety and efficacy in patients with ARHR1."
    explanation: >-
      Historical background motivating ARHR1 treatment, not the current regulatory authority.
    quote_role: BACKGROUND
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No adverse effects were reported following burosumab administration."
    explanation: Short-term tolerability in two patients; not a safety study.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as her clinical response to conventional therapy (phosphate supplementation and active vitamin D) followed by burosumab"
    explanation: A further adult treated with burosumab after conventional therapy.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, osteocyte-specific deletion of Fgf23 resulted in a partial correction of FGF23 excess, which was sufficient to fully restore serum Pi levels but only partially corrected the bone phenotype."
    explanation: Genetic FGF23 removal in the model corrects phosphate but not all of the bone, the caution recorded in the description.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At the time, 5 months into the treatment with burosumab, the hip pain had diminished significantly and
      a repeat radiographic examination revealed near-complete healing of the pseudofracture (seeFig. 2D, right
      panel).
    explanation: >-
      Five-month pseudofracture response in the younger brother; uncontrolled individual observation.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf
    reference_title: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CRYSVITA is indicated for the treatment of X-linked hypophosphatemia (XLH) in adult and pediatric patients
      6 months of age and older. 1.2 Tumor-induced Osteomalacia CRYSVITA is indicated for the treatment of
      FGF23- related hypophosphatemia in tumor-induced osteomalacia (TIO) associated with phosphaturic mesenchymal
      tumors that cannot be curatively resected or localized in adult and pediatric patients 2 years of age
      and older.
    explanation: >-
      Complete US indication list in the August 2025 label; ARHR1 use falls outside these indications.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf
    reference_title: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prior to starting CRYSVITA, discontinue oral phosphate and/or active vitamin D analogs for one week
    explanation: >-
      Label instruction to stop phosphate/active vitamin D before starting; the contraindications section also
      prohibits concomitant use.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf
    reference_title: "https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761068s009lbl.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Increases in serum calcium have been reported in patients treated with CRYSVITA. Patients with risk factors
      such as, pre-existing hyperparathyroidism, prolonged immobilization, dehydration, hypervitaminosis D,
      or renal impairment, are at higher risk of hypercalcemia. Monitor these patients for serum calcium and
      parathyroid hormone levels before and during CRYSVITA treatment for moderate to severe hypercalcemia.
      In patients with moderate to severe hypercalcemia, CRYSVITA should not be administered until hypercalcemia
      is adequately managed.
    explanation: >-
      2025 hypercalcemia warning applies to specialist safety assessment; ARHR1-specific safety has not been
      established.
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Monitoring of FGF23 serum levels is not recommended in patients on burosumab treatment, as current assays
      cannot discriminate between burosumab-bound and free FGF23, resulting in unreliable results [21].
    explanation: >-
      Guidance explains assay interference; fasting phosphate and clinical/mineral measurements guide monitoring.
  notes: >-
    If used off-label, apply specialist monitoring and the product safety restrictions: stop oral phosphate
    and active vitamin D analogs one week before initiation and do not coadminister them; avoid use with normal/high
    baseline fasting phosphate or severe renal impairment. Monitor fasting phosphate with attention to dose
    timing, calcium/PTH, urine calcium and renal status. Hyperphosphatemia/nephrocalcinosis and hypercalcemia
    are relevant risks, especially with hyperparathyroidism, immobilization, dehydration or renal impairment.
    FGF23 measurements can be misleading because assays may detect antibody-bound hormone; the 2022 guidance
    advises against using them to monitor burosumab.
- name: Corrective Orthopedic Surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Osteotomy or guided growth for persistent lower-limb deformity after
    metabolic treatment has been optimized, and fracture fixation, joint
    replacement or spinal decompression in adults with advanced disease. The
    Finnish patient underwent osteotomies from age six and more than thirty
    orthopedic procedures over her life. Surgery does not alter the
    biochemical disease.

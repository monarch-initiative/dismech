    and trauma-associated tooth injury. Both systemic phosphate deficit and local DMP1 loss may contribute;
    the relative mechanisms remain uncertain. Recurrent abscesses and tooth loss are documented, while a later
    single adult jaw-necrosis report does not establish the same causal pathway.

notes: >-
  This entry covers biallelic DMP1-related ARHR1 (MONDO:0009430; OMIM 241520). PHEX-, ENPP1- and FAM20C-related
  disorders are differential diagnoses, not subtypes of this disease. Subclinical findings in some heterozygous
  carriers are recorded separately from the biallelic clinical disorder and do not establish dominant ARHR1.
  The phosphopenic downstream mechanisms conform to the defective skeletal mineralization module. The causes
  of the adult hyperostotic and enthesopathic phenotype remain incompletely resolved.

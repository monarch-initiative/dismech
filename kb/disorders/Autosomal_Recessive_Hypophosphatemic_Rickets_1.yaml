name: Autosomal Recessive Hypophosphatemic Rickets 1
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
description: >-
  Autosomal recessive hypophosphatemic rickets 1 (ARHR1) is the DMP1-related
  member of the hereditary FGF23-excess phosphate-wasting disorders. Biallelic
  loss-of-function variants in DMP1, which encodes dentin matrix protein 1, a
  SIBLING-family acidic phosphoprotein secreted into the matrix by osteocytes,
  mature osteoblasts and odontoblasts, remove a protein that bone needs for two
  separate things: to mature osteocytes and mineralize the matrix around them,
  and to restrain FGF23 transcription in those same cells. The second failure
  gives the disease its endocrine signature. Osteocytic FGF23 rises, circulating
  intact FGF23 is elevated or inappropriately normal, the proximal tubule stops
  reclaiming phosphate, renal calcitriol synthesis is held down rather than
  rising as it should, and the result is lifelong hypophosphatemia with normal
  calcium and parathyroid hormone. Downstream of that point the physiology is
  the one shared with X-linked hypophosphatemia: hydroxyapatite is not laid
  down at the mineralization front, the hypertrophic zone of the growth plate
  fails to involute, and the child develops rickets while the adult carries
  osteomalacia.

  What distinguishes ARHR1 from its X-linked sibling is the local, DMP1-intrinsic
  half of the disease. In the Dmp1-null mouse, deleting Fgf23 from osteocytes
  normalizes serum phosphate but only partly corrects the bone, and DMP1-deficient
  osteoprogenitors mineralize poorly in culture even when phosphate and FGF23
  are held constant; in patients, heterozygous carriers with normal phosphate
  can still show a mild mineralization defect and dysmorphic osteocytes on
  biopsy. The adult picture in reported families is also more severe and more
  paradoxical than in XLH: alongside osteomalacia, pseudofractures, bone pain,
  short stature and lower-limb varus deformity, several kindreds have developed
  cranial hyperostosis, paraspinal ligament calcification, extensive
  enthesopathy with spinal immobilization, and a high axial bone density that
  led to an initial diagnosis of a sclerosing bone dysplasia. Dental disease
  (enlarged pulp chambers, abscesses, early tooth loss) and hearing impairment
  are reported in a subset.

  The entry is organised as a single causal chain from the DMP1 lesion through
  the osteocyte to the kidney and back to the skeleton, with the downstream
  mineralization nodes conforming to the defective skeletal mineralization
  module. Treatment is conventional oral phosphate with active vitamin D;
  burosumab is approved for XLH and tumour-induced osteomalacia, not for ARHR1,
  and its use here rests on case reports.

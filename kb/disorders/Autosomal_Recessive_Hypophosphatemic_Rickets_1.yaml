- name: Defective Osteocyte Maturation
  biological_scale: CELLULAR
  description: >-
    Dmp1-null osteocytes retain osteoblast and early osteocyte markers and have enlarged, disorganized lacunae
    and abnormal canaliculi. These observations support impaired osteoblast-to-osteocyte maturation. The separate
    contribution of matrix mineralization and FGF23 signaling to that maturation defect is incompletely resolved;
    carrier biopsy observations do not establish a uniform haploinsufficiency phenotype.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  biological_processes:
  - preferred_term: osteoblast to osteocyte differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in defective osteocyte maturation and increased FGF23 expression, leading to pathological changes in bone mineralization."
    explanation: Establishes defective osteocyte maturation as the primary cellular lesion in the null mouse.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20734454
    reference_title: The biological function of DMP-1 in osteocyte maturation is mediated by its 57-kDa C-terminal fragment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This included rescue of growth plate defects, osteomalacia, abnormal osteocyte maturation, and the abnormal osteocyte lacunocanalicular system."
    explanation: Names the abnormal osteocyte maturation and lacunocanalicular system as DMP1-dependent, since restoring DMP1 in bone cells corrects them.
    quote_role: PRIMARY_RESULT
- name: DMP1-Dependent Matrix Mineralization Defect
  biological_scale: TISSUE
  description: >-
    DMP1-deficient osteoblast cultures mineralize poorly despite adequate phosphate substrate and correction
    of excess FGF23 by lineage-specific deletion. Exogenous DMP1 supplied in coculture restores mineralization.
    This supports an extracellular DMP1-dependent defect; it should not be described as strictly cell-autonomous
    or inferred solely from incomplete whole-animal rescue.
  biological_processes:
  - preferred_term: bone mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  evidence:
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the present study, although genetic deletion of Fgf23 restored osteoblast differentiation, it did
      not correct the impaired mineralization observed in Dmp1-null osteoblast cultures, suggesting that DMP1
      deficiency directly contributes to the mineralization defect despite adequate Pi supply and normal FGF23
      production.
    explanation: >-
      Mineralization remained impaired after differentiation and FGF23 production were corrected in cultured
      cells.
  downstream:
  - target: Skeletal Mineralization Failure
    causal_link_type: DIRECT
    description: >-
      The local DMP1-dependent defect contributes to failure to mineralize bone matrix.
    evidence:
    - reference: PMID:37943605
      reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-

- name: Genetic Counseling and Family Testing
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    When both parents carry a pathogenic DMP1 allele, each pregnancy has a 25% risk of biallelic disease, 50%
    chance of carrier status and 25% chance of inheriting neither familial allele. Confirm parental segregation
    and offer targeted family and reproductive-partner testing with genetic counseling. Evaluate at-risk children
    early. Apparent homozygosity without the expected parental allele requires consideration of a deletion,
    as demonstrated in a compound-heterozygous family. Mild findings in selected carriers do not establish
    dominant ARHR1 or a universal carrier-surveillance protocol.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36315908
    reference_title: First report in Argentina of a pathogenic DMP1 variant associated with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In recessive forms, both parents are carriers and the risk of recurrence is 25% for new children of the
      couple.
    explanation: >-
      Conditional recurrence risk for a couple in which both parents carry an ARHR1 allele.
  - reference: PMID:39011543
    reference_title: Lessons learned from the real-world diagnosis and management of hereditary hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypophosphatemic rickets, which is often hereditary, is still under- or misdiagnosed in both children and adults, denying these individuals access to optimal management and genetic counseling."
    explanation: Misdiagnosis denies families counselling, the reason molecular diagnosis is sought.
    quote_role: BACKGROUND
- name: Metabolic and Renal Surveillance
  action_category: MONITORING
  description: >-
    Monitor growth, limb alignment, pain, mobility, dental status and hearing symptoms alongside age-adjusted
    phosphate, ALP, calcium, PTH, renal function, vitamin D status and urinary calcium. General rickets guidance
    suggests kidney ultrasonography every one to two years during phosphate, active vitamin D or burosumab
    treatment, adjusted to individual findings. Biochemical improvement alone does not exclude progressive
    enthesopathy or skeletal disability.
  evidence:
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Management includes close monitoring of growth, the degree of leg bowing, bone pain, serum phosphate,
      calcium, alkaline phosphatase as a surrogate marker of osteoblast activity and thus degree of rickets,
      parathyroid hormone, 25-hydroxyvitamin D3, and calciuria.
    explanation: >-
      General management guidance applies to long-term monitoring of ARHR1.
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Kidney ultrasonographyEvery 1–2 years on phosphate, active vitamin D or burosumab treatment
    explanation: >-
      Table 1 surveillance interval, extrapolated from general rickets guidance.
- name: Cinacalcet (Reported Adjunctive Trial)
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    One adult received adjunctive cinacalcet with active/native vitamin D and dietary calcium before burosumab.
    PTH fell and phosphate trended upward, but the authors judged the changes clinically minor; higher doses
    were not tolerated and treatment stopped. This unsuccessful individual treatment course does not establish
    routine efficacy or an ARHR1-specific recommended regimen.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Cinacalcet
      term:
        id: NCIT:C74100
        label: Cinacalcet
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although PTH levels did decrease and serum PO4levels trended higher, the changes were judged to be of
      minor clinical significance. Higher doses of cinacalcet were not tolerated and treatment with cinacalcet
      was terminated.
    explanation: >-
      Direct negative/limited treatment experience in the younger brother, with concomitant therapy and intolerance.
animal_models:
- name: Dmp1-null mouse
  species: Mouse
  genotype: Dmp1 homozygous null
  publication: PMID:17033621
  genes:
  - preferred_term: Dmp1
    term:
      id: hgnc:2932
      label: DMP1
  description: >-
    Dmp1-null mice reproduce osteocyte maturation defects, impaired matrix mineralization, increased bone Fgf23,
    phosphate wasting, rickets and osteomalacia. Transgenic full-length DMP1 or its 57-kDa fragment rescues
    several skeletal and biochemical endpoints. Early anti-FGF23 antibody treatment improves growth plates
    and secondary ossification more fully than cortical mineralization; adult osteocytic Fgf23 deletion reduces
    excess hormone and partly corrects bone despite normalized phosphate. Outcomes depend on developmental
    timing, genetic background, diet and intervention.
  modeled_mechanisms:
  - target: Defective Osteocyte Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The osteocyte maturation arrest and lacunocanalicular defect were defined
      in this model and are DMP1-dependent, since bone-cell DMP1 expression
      rescues them.
    limitations: >-
      Complete null alleles and transgenic rescue do not reproduce every human start-loss or C-terminal allele.
    evidence:
    - reference: PMID:17033621
      reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in defective osteocyte maturation and increased FGF23 expression, leading to pathological changes in bone mineralization."
      explanation: The model defines this node.
      quote_role: PRIMARY_RESULT
  - target: DMP1-Dependent Matrix Mineralization Defect
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Dmp1-null tibias have reduced mineral-to-matrix ratio at 4 and 16 weeks by FTIR imaging.
    limitations: >-
      FTIR is a matrix endpoint, distinct from osteocyte maturation markers. Relative mineral content does
      not measure every aspect of mineral crystal composition.
    readouts:
    - name: Tibial mineral-to-matrix ratio by FTIR imaging
      target: DMP1-Dependent Matrix Mineralization Defect
      direction: DECREASED
      interpretation: Relative mineral content of bone matrix in the null mouse at 4 and 16 weeks.
      evidence:
      - reference: PMID:16294270
        reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mineral-to-matrix ratios (spectroscopic parameter of relative mineral content) were significantly lower in dmp1 KO mice tibias compared with WT and HET at 4 and 16 weeks."
        explanation: The measurement behind this readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:16294270
      reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mineral-to-matrix ratios (spectroscopic parameter of relative mineral content) were significantly lower in dmp1 KO mice tibias compared with WT and HET at 4 and 16 weeks."
      explanation: The measurement behind this readout.
      quote_role: PRIMARY_RESULT
  - target: Increased Osteocytic FGF23 Production
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Osteocytic Fgf23 induction, its FGFR dependence and its non-additivity
      with Phex loss were all established in this model.
    limitations: >-
      The magnitude of induction in the null mouse exceeds what is inferred
      from human bone, where FGF23 expression is increased but has not been
      quantified; whether FGFR signalling drives human osteocytic FGF23 is not
      demonstrated.
    readouts:
    - name: Fgf23 mRNA in bone marrow stromal cells
      target: Increased Osteocytic FGF23 Production
      direction: INCREASED
      interpretation: >-
        124-fold induction in differentiated marrow stromal cultures; SU5402 reduced this to 2.5-fold. This
        is an in-vitro assay using cells derived from mutant mice.
      evidence:
      - reference: PMID:21507898
        reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Furthermore, inhibiting FGFR signaling using SU5402 in Hyp- and Dmp1(-/-)-derived bone marrow stromal cells prevented the increase in Fgf23 mRNA expression (129- and 124-fold increase in Hyp and Dmp1(-/-) vs. 1.3-fold in Hyp+SU5402 and 2.5-fold in Dmp1(-/-)+SU5402, P<0.05)."
        explanation: The measurement behind this readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:28005411
      reference_title: A Mutation in the Dmp1 Gene Alters Phosphate Responsiveness in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, Dmp1 knockout mice had little Fgf23 cleavage and increased femoral Fgf23 expression, resulting in hypophosphatemia and low femoral bone mineral density (BMD)."
      explanation: Increased bone Fgf23 expression driving hypophosphatemia in the model.
      quote_role: PRIMARY_RESULT
  - target: Chronic Hypophosphatemia
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Hypophosphatemia with a lowered set point that is maintained through
      Fgf23 expression and cleavage; raising phosphate provokes more FGF23.
    limitations: >-
      Adult null mice also develop hyperparathyroidism, which most patients do
      not; the mouse therefore overstates the calciopenic component.
    readouts:
    - name: Serum phosphate
      target: Chronic Hypophosphatemia
      direction: DECREASED
      interpretation: Hypophosphatemia at 12 weeks with elevated serum FGF23 and PTH.
      evidence:
      - reference: PMID:37943605
        reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "At 12 weeks, Dmp1KO mice showed increased serum FGF23 and parathyroid hormone levels, hypophosphatemia, impaired growth, rickets, and osteomalacia."
        explanation: The measurement behind this readout.
        quote_role: PRIMARY_RESULT
    evidence:
    - reference: PMID:28005411
      reference_title: A Mutation in the Dmp1 Gene Alters Phosphate Responsiveness in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data indicate that a Dmp1 mutation creates a lower set point for extracellular phosphate and maintains it through the regulation of Fgf23 cleavage and expression."
      explanation: Characterizes the hypophosphatemia as a set-point defect, which is the informative feature of the model for this node.
      quote_role: PRIMARY_RESULT
  - target: Skeletal Mineralization Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Osteomalacia and excess osteoid are partly corrected by osteocytic Fgf23 deletion even when phosphate
      normalizes. Residual FGF23 and PTH elevation limit causal attribution solely to a local matrix defect.
    limitations: >-
      A 2011 study observed age-dependent bony protuberances at one year, but this does not establish equivalence
      to every adult human sclerosis or enthesopathy phenotype. Different treatment ages and endpoints limit
      comparison of experiments.
    evidence:
    - reference: PMID:37943605
      reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, FGF23-induced hypophosphatemia is only partially responsible for the bone defects observed in Dmp1KO mice."
      explanation: The two-route result that makes this model informative for the node.
      quote_role: PRIMARY_RESULT
  - target: Growth Plate Hypertrophic Zone Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Expanded, disorganized growth plates with rickets, rescued by bone-cell
      expression of DMP1 or its 57-kDa fragment, and shown to be
      phosphate-dependent in metatarsal organ culture.
    limitations: >-
      Neonatal organ culture and early postnatal mouse antibody treatment test developing growth plates; these
      endpoints cannot measure reversal of established adult human enthesopathy.
    evidence:
    - reference: PMID:20734454
      reference_title: The biological function of DMP-1 in osteocyte maturation is mediated by its 57-kDa C-terminal fragment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This included rescue of growth plate defects, osteomalacia, abnormal osteocyte maturation, and the abnormal osteocyte lacunocanalicular system."
      explanation: The growth plate defect of the model and its DMP1 dependence.
      quote_role: PRIMARY_RESULT
    - reference: PMID:21542006
      reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we used Dmp1 null mice, a hypophosphatemic rickets/osteomalacia model, combined with a metatarsal organ culture and an application of neutralizing fibroblast growth factor 23 (FGF-23) antibodies to gain insight into the roles of P(i) in bone biology."
      explanation: The model used as the ARHR1 rickets model, with FGF23 neutralization as an experimental arm.
      quote_role: PRIMARY_RESULT
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dentin matrix protein 1 (encoded by DMP1) is highly expressed in osteocytes and, when deleted in mice, results in a hypomineralized bone phenotype."
    explanation: Establishes the model and its baseline phenotype.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed (1) that abnormal bone remodeling in Dmp1 null mice is due to reduced osteoclast number, which is secondary to a reduced ratio of RANKL/OPG expressed by osteoclast supporting cells"
    explanation: Reduced osteoclast number and remodeling in the model, a feature with no established human counterpart that is recorded here rather than as a human node.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      In the aged animal at 1 year, the development of large bony protuberances occurs in all bones examined
      (Fig. 1C, middle and right panels, D and Supplemental Fig. S1), suggesting that the abnormality of bone
      remodeling progresses with age.
    explanation: >-
      Age-dependent remodeling abnormalities were followed to one year; equivalence to specific human enthesopathy
      remains uncertain.
  notes: >-
    Related experiments include Dmp1/Galnt3 double knockout, which changes Fgf23 cleavage and phosphate responsiveness,
    and non-additive Hyp/Dmp1 double mutants. Rescue by a 3.6-kb Col1a1-driven 57-kDa DMP1 fragment establishes
    experimental sufficiency, not a human replacement therapy. The 2011 culture study found normal mineralization
    with sufficient phosphate in neonatal calvarial cells, whereas the 2023 marrow stromal cultures retained
    impaired matrix mineralization; these differ in cell source, age and protocol. FTIR analysis used female
    mice at four and sixteen weeks; heterozygotes had altered crystallinity despite preserved mineral-to-matrix
    ratio. A separate 2011 study used CD-1 mice and observed bony protuberances by one year.
discussions:
- discussion_id: arhr1_dmp1_to_fgf23_coupling
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic DMP1 Loss of Function
  - pathophysiology#Increased Bone FGFR Signaling
  - pathophysiology#Increased Osteocytic FGF23 Production
  prompt: >-
    By what molecular route does loss of an extracellular matrix phosphoprotein
    in the osteocyte de-repress Fgf23 transcription, and is the FGFR-dependent
    mechanism shown in mouse bone cells the one operating in human ARHR1?
  rationale: >-
    Mouse bone shows increased FGFR1/FRS2/PI3K phosphorylation, and an FGFR inhibitor suppresses Fgf23 induction
    in mutant marrow stromal cultures. These results implicate FGFR signaling but do not identify how extracellular
    DMP1 loss activates it, exclude other FGFRs or demonstrate the mechanism in human osteocytes. Non-additivity
    with Phex loss supports pathway convergence without proving a direct DMP1-PHEX interaction. Matrix/integrin
    signaling, phosphate sensing and maturation state remain candidate intermediates.
  evidence:
  - reference: PMID:21507898
    reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mechanisms whereby PHEX and DMP1 regulate Fgf23 expression are unknown."
    explanation: The gap stated in the paper that came closest to closing it.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that DMP1 may regulate FGF23 expression"
    explanation: The hypothesis as first stated; it has been confirmed as a relationship but not explained as a mechanism.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: arhr1_human_osteocyte_fgfr_dependence
    name: FGFR dependence of FGF23 induction in human DMP1-deficient osteocytes
    description: >-
      Differentiate osteocytes from patient-derived or DMP1-edited human iPSCs
      and test whether FGF23 induction is abolished by FGFR1 inhibition, and
      whether it is restored by exogenous 57-kDa C-terminal DMP1 added to the
      matrix, to establish that the mouse pathway operates in human cells and
      that the extracellular fragment is sufficient.
- discussion_id: arhr1_fgf23_blockade_versus_matrix_defect
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal Mineralization Failure
  - treatments#Burosumab
  prompt: >-
    In the Dmp1-null mouse, removing osteocytic Fgf23 normalizes serum phosphate
    but leaves part of the bone phenotype uncorrected; does the same residual,
    DMP1-intrinsic mineralization defect limit what burosumab can achieve in
    patients with ARHR1?
  rationale: >-
    Partial human clinical benefit is compatible with partial rescue in mouse models. The 2023 lineage-specific
    deletion leaves residual circulating FGF23 excess, so persistent bone defects cannot all be assigned to
    DMP1-independent-of-FGF23 effects from that experiment alone. Its cultured-cell results distinguish FGF23-sensitive
    differentiation from persistent matrix mineralization failure. Earlier newborn calvarial cultures mineralized
    with sufficient phosphate, indicating that age, cell source and culture conditions matter. The two-brother
    human report documents clinical and radiographic improvement but not paired bone histomorphometry. The
    later adult report is available here only as an abstract. Whether clinically important residual matrix
    defects persist after adequate FGF23 blockade remains unresolved.
  evidence:
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data suggest that combined DMP1 repletion and FGF23 blockade could effectively correct ARHR-associated mineral and bone disorders."
    explanation: The authors' inference that FGF23 blockade alone will be incomplete in ARHR1.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present report highlights the beneficial biochemical and clinical outcomes associated with the use of burosumab in patients with ARHR1."
    explanation: >-
      Human clinical benefit is compatible with incomplete skeletal correction; this is not a demonstrated
      human-model contradiction.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      This defect in osteoblast differentiation apparently is caused by hypophosphatemia because the isolated
      calvarial osteoblasts mineralize normally ex vivo if sufficient phosphate is provided (Fig. 3D).
    explanation: >-
      Earlier neonatal calvarial cultures differ from the 2023 marrow stromal cultures; this is the authors'
      interpretation of their experiment, not a universal conclusion.
  proposed_experiments:
  - experiment_id: arhr1_burosumab_histomorphometry
    name: Paired bone histomorphometry before and after burosumab in ARHR1
    description: >-
      Where clinically justified and consented, compare paired bone histomorphometry and imaging before and
      after specialist-directed burosumab, with phosphate, PTH, drug exposure, genotype, age and prior therapy
      documented. Residual osteoid would establish incomplete response, but would not by itself prove a solely
      DMP1-intrinsic cause. Complement clinical observations with matched patient-derived matrix and differentiation
      assays.
- discussion_id: arhr1_hyperostosis_osteosclerosis_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Increased Axial Bone Density
  - phenotypes#Generalized Osteosclerosis
  - phenotypes#Cranial Hyperostosis
  - phenotypes#Enthesopathy
  - phenotypes#Paraspinal Ligament Ossification
  prompt: >-
    Why do adults with a mineralization-failure disease develop cranial
    hyperostosis, a high axial bone density and ossifying enthesopathy severe
    enough to immobilize the spine, and are these one process or several?
  rationale: >-
    Increased axial areal density can coexist with poor peripheral microstructure and mineralization defects.
    Cortical thickening and extraosseous calcification can complicate DXA interpretation; unmineralized osteoid
    itself is not a demonstrated cause of increased measured mineral density. One untreated Finnish adult also
    developed extensive ossification, so conventional therapy is not a sufficient explanation. Reduced osteoclast
    support and age-dependent bony protuberances in mice suggest candidate remodeling mechanisms, but their
    relationship to human enthesopathy is unresolved. The Indian family carried an SPP1 variant of uncertain
    significance; no modifier effect was established. Clinical improvement with burosumab does not establish
    prevention or reversal of ectopic ossification.
  evidence:
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cases show that some ARHR cases may develop with age an unaccountable increase in bone density and bone overgrowth."
    explanation: The gap as stated by the reporters.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High aBMD and local osteosclerosis in axial bone with low vBMD and damaged microstructure in peripheral bone were featured."
    explanation: The axial-peripheral discordance that makes the sclerosis hard to interpret.
    quote_role: PRIMARY_RESULT
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed (1) that abnormal bone remodeling in Dmp1 null mice is due to reduced osteoclast number, which is secondary to a reduced ratio of RANKL/OPG expressed by osteoclast supporting cells"
    explanation: A candidate mechanism, reduced resorption, from the model.
    quote_role: PRIMARY_RESULT
  proposed_experiments:
  - experiment_id: arhr1_bone_quality_hrpqct_histology
    name: Volumetric density, microstructure and histology of sclerotic ARHR1 bone
    description: >-
      Compare volumetric density, peripheral microstructure and, when available, undecalcified histomorphometry
      with osteoclast counts in adults with radiographic sclerosis. Distinguish mineralized bone quantity from
      excess osteoid and adjacent ligament ossification; assess longitudinal relationships to age, genotype,
      treatment and FGF23 rather than inferring strength from DXA alone.
- discussion_id: arhr1_carrier_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#Biallelic DMP1 Pathogenic Variants
  prompt: >-
    Is the DMP1 heterozygous carrier state a subclinical bone disorder that
    warrants surveillance, and does it explain the carriers with mild
    hypophosphatemia?
  rationale: >-
    Selected families show mild carrier biochemical or histomorphometric abnormalities, whereas other carrier
    relatives are clinically and biochemically normal. The 2026 report describes normal biochemistry with differing
    bone density between families and one carrier biopsy showing a mild mineralization defect. These observations
    warrant study of an unselected carrier cohort; they do not estimate penetrance, change biallelic ARHR1
    to dominant inheritance or establish routine bone-density screening for all carriers. In heterozygous mice,
    normal phosphate and mineral-to-matrix ratio coexist with altered mineral crystallinity and reduced serum
    calcium; they are not normal in every measured bone endpoint.
  evidence:
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two heterozygous carriers of the mutation also showed mild hypophosphatemia, and bone biopsy in one of these individuals showed focal areas of osteomalacia."
    explanation: The first report of a carrier phenotype.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data expand the description of the clinical phenotype in fully affected individuals with ARHR1 and provide further evidence of a subclinical phenotype in the ARHR1 carrier state."
    explanation: Independent confirmation of a subclinical carrier phenotype.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16294270
    reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dmp1 KO mice had significantly lower ionic calcium and phosphate concentrations relative to WT, whereas in the HET, values for phosphate were equivalent, and calcium values were decreased relative to WT values."
    explanation: Heterozygous mice keep normal phosphate, so the human carrier hypophosphatemia is not reproduced by the model.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16294270
    reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mineral crystallinity (crystal size/perfection) was significantly increased in dmp1 KO and HET mice
      relative to WT.
    explanation: >-
      Heterozygotes have a crystallinity phenotype despite preserved relative mineral quantity, so the model
      does not support a wholly normal carrier skeleton.

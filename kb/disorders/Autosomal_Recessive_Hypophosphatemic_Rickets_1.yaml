    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "isolated renal phosphate-wasting associated with elevated fibroblast growth factor 23 (FGF23) levels and normocalciuria"
    explanation: Isolated wasting with normocalciuria distinguishes it from generalized tubulopathy and from calciopenic rickets.

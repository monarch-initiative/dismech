name: Autosomal Recessive Hypophosphatemic Rickets 1
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
description: >-
  Autosomal recessive hypophosphatemic rickets 1 (ARHR1) is a DMP1-related disorder of skeletal mineralization
  and FGF23-mediated renal phosphate wasting. Biallelic loss-of-function variants impair a secreted matrix
  protein required for normal osteocyte maturation and mineralization. Depending on the allele, protein secretion,
  abundance or processing is altered; complete protein absence is not universal. Increased bone FGF23 production
  promotes renal phosphate loss and restrains the expected calcitriol response to hypophosphatemia. Calcium
  and PTH can be normal, but secondary hyperparathyroidism and variable calcitriol concentrations occur.

  Model experiments distinguish systemic phosphate deficiency, direct FGF23 effects on osteoprogenitor differentiation,
  and a DMP1-dependent mineralization defect. Correction of serum phosphate alone does not isolate these mechanisms,
  because residual FGF23 excess may persist. Cultured-cell rescue experiments provide stronger evidence for
  a mineralization defect independent of phosphate availability and FGF23 production. PHEX-related disease
  also has intrinsic bone abnormalities; this is not a clean distinction between local and purely endocrine
  disease.

  Reported manifestations range from childhood rickets and limb deformity to adult osteomalacia, pain, fractures
  or pseudofractures, dental abnormalities and hearing impairment. Some older patients develop marked cranial
  hyperostosis, enthesopathy, ligament ossification and spinal ankylosis. High axial areal bone density can
  coexist with impaired mineralization and poor peripheral bone microstructure. Short stature and severe adult
  disability are variable. Conventional treatment combines phosphate and active vitamin D, with monitoring
  for renal and parathyroid complications. Burosumab use in ARHR1 is supported by limited case reports; long-term
  effects on established enthesopathy remain uncertain.

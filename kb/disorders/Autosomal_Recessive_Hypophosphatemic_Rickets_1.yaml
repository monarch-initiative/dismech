    phosphate and calcitriol treatment has been recorded in an affected child.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intact plasma levels of the phosphaturic protein FGF23 were clearly elevated in two of four affected individuals"
    explanation: Elevated in half of the discovery cohort, inappropriately normal in the rest.

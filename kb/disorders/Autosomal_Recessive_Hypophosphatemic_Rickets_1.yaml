- name: 1,25-Dihydroxyvitamin D
  presence: Inappropriately normal or low for the degree of hypophosphatemia
  context: FGF23 suppresses synthesis and increases degradation of calcitriol, blunting the expected rise with hypophosphatemia.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "providing a possible explanation for the phosphaturia and inappropriately normal 1,25(OH)2D levels"
    explanation: Inappropriately normal calcitriol in the discovery families.
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical examination revealed hypophosphatemia with renal phosphate excretion and low levels of 1,25(OH)(2)D."
    explanation: Frankly low calcitriol in the Japanese siblings.
- name: Alkaline Phosphatase
  presence: Elevated with active rickets or osteomalacia
  context: The surrogate of mineralization disease activity used to titrate conventional treatment, since serum phosphate is not a treatment target.
  evidence:
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum alkaline phosphatase activity was elevated, with initially normal PTH."
    explanation: Elevated ALP at diagnosis.
- name: Parathyroid Hormone and Calcium
  presence: Normal calcium; PTH normal in most reports, elevated in some adults and in adult null mice
  context: >-
    Normal PTH is what separates the phosphopenic from the calciopenic arm of
    rickets at the bedside. Elevated PTH was recorded in the Lebanese sisters
    and rises further with phosphate loading, so it is monitored during
    treatment.
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum calcium, parathyroid hormone, and urinary calcium excretion were within the normal range, leading to clinical diagnosis of ARHR."
    explanation: Normal calcium, PTH and calciuria in the Japanese siblings.
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical analysis was consistent with normal serum calcium and 1-25(OH)2D levels, low to normal serum phosphorus and elevated PTH values."
    explanation: Elevated PTH in the Lebanese adult sisters, the exception that the presence field records.
diagnosis:
- name: Clinical and Biochemical Evaluation for FGF23-Mediated Phosphate Wasting
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Suspect the disorder in a child with rickets, leg bowing, short stature or
    bone pain, or an adult with osteomalacia, pseudofractures, enthesopathy or
    unexplained osteosclerosis, when fasting phosphate is low against
    age-specific ranges with renal phosphate wasting, normal calcium and PTH,
    calcitriol inappropriately normal or low, and intact FGF23 elevated or not
    suppressed. Consanguinity or an affected sibling with unaffected parents
    points to the recessive form.
  results: >-
    Hypophosphatemia with isolated renal phosphate wasting, normocalciuria, normal
    PTH, non-suppressed FGF23 and a recessive pedigree.
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum calcium, parathyroid hormone, and urinary calcium excretion were within the normal range, leading to clinical diagnosis of ARHR."
    explanation: The biochemical pattern that led to the clinical diagnosis before sequencing.
- name: DMP1 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Confirmation requires biallelic DMP1 variants. A hereditary hypophosphatemia
    panel with copy-number analysis, or exome sequencing, is preferred to
    single-gene testing because large deletions occur and because PHEX, FGF23,
    ENPP1, FAM20C and the transporter genes are phenocopies; restricted testing
    has missed DMP1 disease in practice.
  results: Homozygous or compound heterozygous pathogenic DMP1 variants, with deletion analysis.
  evidence:
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The maternally inherited deletion was validated by Cytoscan and qPCR, and the breakpoint was finally identified by long-range PCR and Sanger sequencing."
    explanation: Shows that copy-number analysis was needed to find the second allele.
  - reference: PMID:39011543
    reference_title: Lessons learned from the real-world diagnosis and management of hereditary hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cases prompt consideration of the (i) frequent misdiagnosis of hypophosphatemic rickets in clinical practice and the importance of comprehensive genetic testing"
    explanation: Real-world series including a DMP1 case, arguing for comprehensive rather than restricted testing.
differential_diagnoses:
- name: X-Linked Hypophosphatemia
  disease_term:
    preferred_term: X-linked dominant hypophosphatemic rickets
    term:
      id: MONDO:0010619
      label: X-linked dominant hypophosphatemic rickets
  description: >-
    The common FGF23-mediated phosphate-wasting rickets, biochemically
    indistinguishable from ARHR1; PHEX and DMP1 restrain FGF23 through a common
    osteocyte pathway.
  distinguishing_features:
  - X-linked dominant pedigree with affected heterozygous females, versus unaffected carrier parents.
  - PHEX rather than biallelic DMP1 variants.
  - The adult hyperostotic-osteosclerotic and severe enthesopathic phenotype is more prominent in ARHR1 families.
  evidence:
  - reference: PMID:21507898
    reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings indicate that PHEX and DMP1 control a common pathway regulating bone mineralization and FGF23 production, the latter involving activation of the FGFR signaling in osteocytes."
    explanation: Explains why the two disorders are biochemically alike and must be separated by pedigree and genotype.
- name: Autosomal Recessive Hypophosphatemic Rickets 2
  disease_term:
    preferred_term: ENPP1-related autosomal recessive hypophosphatemic rickets
    term:
      id: MONDO:0013219
      label: hypophosphatemic rickets, autosomal recessive, 2
  description: >-
    The ENPP1-related recessive form, with the same FGF23-driven renal
    phenotype but a different initiating lesion in pyrophosphate metabolism.
  distinguishing_features:
  - Biallelic ENPP1 rather than DMP1 variants.
  - ENPP1 disease spans neonatal arterial calcification to rickets or osteoporosis; arterial calcification is not a feature of ARHR1.
  evidence:
  - reference: PMID:42412262
    reference_title: "When X Does Not Mark the Spot: Autosomal Dominant and Recessive Forms of Renal Hypophosphatemic Rickets and Osteomalacia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in multiple genes cause dominant (FGF23, SGK3, FGFR1), recessive (DMP1, ENPP1, FAM20C, INPPL1) or even somatic (NRAS, HRAS, GNAS, gene fusions) conditions of FGF23 excess, with important phenotypic differences."
    explanation: Places DMP1 and ENPP1 as separate recessive causes of FGF23 excess. Evidence source is OTHER because this is a review article.
  - reference: PMID:42412262
    reference_title: "When X Does Not Mark the Spot: Autosomal Dominant and Recessive Forms of Renal Hypophosphatemic Rickets and Osteomalacia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ENPP1 variants cause phenotypes ranging from severe neonatal vascular calcifications to rickets or osteoporosis"
    explanation: The vascular calcification spectrum that separates ARHR2 clinically. Evidence source is OTHER because this is a review article.
- name: Sclerosing Bone Dysplasias
  description: >-
    Adult ARHR1 with cranial hyperostosis and high axial bone density has been
    misdiagnosed as a familial sclerosing bone dysplasia and worked up for
    osteopetrosis.
  distinguishing_features:
  - Hypophosphatemia with renal phosphate wasting and elevated FGF23 are absent in the primary sclerosing dysplasias.
  - Childhood rickets and osteomalacia precede the sclerosis.
  evidence:
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis of known genes involved in osteopetrosis showed normal results."
    explanation: The sisters were first investigated as a sclerosing dysplasia before exome sequencing found DMP1.
treatments:
- name: Oral Phosphate with Active Vitamin D
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Conventional therapy for FGF23-mediated rickets: divided oral phosphate
    salts with calcitriol or alfacalcidol, titrated to healing of rickets,
    alkaline phosphatase and parathyroid hormone rather than to serum
    phosphate. Efficacy in ARHR1 is described as modest, and adult null mice
    given phosphate alone develop more FGF23, hyperparathyroidism and worse
    osteomalacia, which is the mechanistic argument for never giving phosphate
    without active vitamin D. Side effects are gastrointestinal intolerance,
    hypercalciuria, nephrocalcinosis and secondary hyperparathyroidism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phosphate
      term:
        id: CHEBI:26020
        label: phosphate
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Chronic Hypophosphatemia
    treatment_effect: MODULATES
    description: Divided phosphate doses transiently raise available phosphate without correcting the upstream FGF23 excess or the lowered set point.
  - target: Suppressed Renal Calcitriol Synthesis
    treatment_effect: BYPASSES
    description: Active vitamin D replaces the calcitriol the FGF23-suppressed kidney does not make, restoring intestinal mineral absorption.
  - target: Skeletal Mineralization Failure
    treatment_effect: MODULATES
    description: Together phosphate and active vitamin D partly improve rickets and osteomalacia.
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Traditionally, treatment consists of oral phosphate replacement and the addition of calcitriol but this approach is limited by modest efficacy and potential renal and gastrointestinal side effects."
    explanation: States the conventional regimen for ARHR1 and its limits.
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fibroblast-growth factor 23 (FGF23)-associated hypophosphatemic rickets was historically treated with frequent doses of oral phosphate salts in combination with active vitamin D, whereas tumor-induced osteomalacia (TIO) should primarily undergo tumor resection, if possible."
    explanation: Guidance for the FGF23-associated class to which ARHR1 belongs. Evidence source is OTHER because this is a guidance document.
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adjustment of medication should be done with consideration of treatment-associated side effects, including diarrhea, gastrointestinal discomfort, hypercalciuria, secondary hyperparathyroidism, and development of nephrocalcinosis or nephrolithiasis."
    explanation: The monitoring trade-off of conventional therapy. Evidence source is OTHER because this is a guidance document.
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Six weeks of dietary Pi supplementation exacerbated FGF23 production, hyperparathyroidism, renal Pi excretion, and osteomalacia."
    explanation: Model evidence that phosphate loading alone is counterproductive in DMP1 deficiency.
- name: Burosumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    A fully human anti-FGF23 monoclonal antibody approved for X-linked
    hypophosphatemia and tumour-induced osteomalacia. It is not approved for
    ARHR1: the evidence is case reports, two brothers treated monthly with
    normalization of phosphate, pseudofracture healing, less pain and fatigue
    and improved function, and an adult treated after conventional therapy. Use
    is off-label, through a metabolic bone specialist, with fasting phosphate
    and TmP/GFR rather than FGF23 assays for monitoring. The Dmp1-null mouse
    supplies a caution: removing osteocytic FGF23 normalizes phosphate but only
    partly corrects the bone, because the DMP1-intrinsic matrix defect remains.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: burosumab
      term:
        id: NCIT:C119744
        label: Burosumab
  target_mechanisms:
  - target: Elevated Circulating Intact FGF23
    treatment_effect: INHIBITS
    description: Burosumab binds circulating FGF23 and blocks its renal phosphaturic and calcitriol-suppressing actions.
    evidence:
    - reference: PMID:35896139
      reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Monthly administration of burosumab to 2 brothers afflicted with the disorder resulted in normalization of serum phosphate, healing of pseudofracture, diminished fatigue, less bone pain, and reduced incapacity arising from the extensive enthesopathy and soft tissue fibrosis/calcification that characterizes this disorder."
      explanation: Phosphate normalized when FGF23 was neutralized, the on-target effect in ARHR1 patients.
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The advent of burosumab (Crysvita), a fully humanized monoclonal antibody to FGF23 for the treatment of X-linked hypophosphatemia and tumor-induced osteomalacia, offers a unique opportunity to evaluate its safety and efficacy in patients with ARHR1."
    explanation: Records that the approved indications are XLH and TIO, and that ARHR1 use was an evaluation.
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No adverse effects were reported following burosumab administration."
    explanation: Short-term tolerability in two patients; not a safety study.
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as her clinical response to conventional therapy (phosphate supplementation and active vitamin D) followed by burosumab"
    explanation: A further adult treated with burosumab after conventional therapy.
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blocking FGF23 became an effective therapeutic strategy in X-linked hypophosphatemia, but testing remains limited in autosomal recessive hypophosphatemic rickets (ARHR)."
    explanation: States the limited state of the ARHR evidence base; this background sentence summarizes the human clinical record.
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, osteocyte-specific deletion of Fgf23 resulted in a partial correction of FGF23 excess, which was sufficient to fully restore serum Pi levels but only partially corrected the bone phenotype."
    explanation: Genetic FGF23 removal in the model corrects phosphate but not all of the bone, the caution recorded in the description.
  - reference: PMID:35352187
    reference_title: "Rickets guidance: part II-management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Burosumab, a fully humanized FGF23-antibody, was recently approved for treatment of X-linked hypophosphatemia (XLH) and TIO and shown to be superior for treatment of XLH compared to conventional treatment."
    explanation: The approved indications; ARHR1 is not among them. Evidence source is OTHER because this is a guidance document.
- name: Corrective Orthopedic Surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Osteotomy or guided growth for persistent lower-limb deformity after
    metabolic treatment has been optimized, and fracture fixation, joint
    replacement or spinal decompression in adults with advanced disease. The
    Finnish patient underwent osteotomies from age six and more than thirty
    orthopedic procedures over her life. Surgery does not alter the
    biochemical disease.
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Bowing of the legs
    term:
      id: HP:0002979
      label: Bowing of the legs
  evidence:
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short stature, prominent bowing of the legs, fractures/pseudofractures, and severe enthesopathy are prominent in this patient population."
    explanation: The deformity and fracture burden that surgical care addresses; the operative history itself is in the full text of the Finnish family report rather than its abstract. Indirect.
- name: Dental Surveillance and Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Regular dental review from tooth eruption, with prompt treatment of pulpal
    infection and abscess, because dentin is hypomineralized with enlarged pulp
    chambers and teeth are lost early. Systemic therapy should be optimized
    before orthodontic or implant work, as for XLH.
  treatment_term:
    preferred_term: Dental Procedure
    term:
      id: NCIT:C38052
      label: Dental Procedure
  target_phenotypes:
  - preferred_term: Tooth abscess
    term:
      id: HP:0030757
      label: Tooth abscess
  evidence:
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tooth growth and shape were normal for the index case, his affected brother and cousin, but their permanent and deciduous teeth displayed enlarged pulp chambers."
    explanation: The structural dental defect that makes surveillance necessary. Indirect, since the source documents the finding rather than the care.
- name: Genetic Counseling and Family Testing
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Recessive recurrence risk of one in four for carrier parents, carrier
    testing of siblings and partners, and early biochemical evaluation of
    at-risk infants so treatment starts before deformity. Molecular diagnosis
    is what makes the family-centred approach possible.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36315908
    reference_title: First report in Argentina of a pathogenic DMP1 variant associated with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the phenotypic overlapping and the difficulty in analyzing reduced genealogies, molecular studies are important to establish the genetic cause and implement a family-centered approach."
    explanation: Molecular confirmation as the basis of family counselling.
  - reference: PMID:39011543
    reference_title: Lessons learned from the real-world diagnosis and management of hereditary hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypophosphatemic rickets, which is often hereditary, is still under- or misdiagnosed in both children and adults, denying these individuals access to optimal management and genetic counseling."
    explanation: Misdiagnosis denies families counselling, the reason molecular diagnosis is sought.
animal_models:
- name: Dmp1-null mouse
  species: Mouse
  genotype: Dmp1 homozygous null
  publication: PMID:17033621
  genes:
  - preferred_term: Dmp1
    term:
      id: hgnc:2932
      label: DMP1
  description: >-
    The reference model, from which the human disease was recognized: the
    hypomineralized bone of the null mouse was known before DMP1 patients were
    found, and the discovery paper characterized both together. The mouse
    reproduces defective osteocyte maturation with an abnormal
    lacunocanalicular system, more than hundredfold osteocytic Fgf23 induction,
    elevated serum FGF23, hypophosphatemia with a lowered phosphate set point,
    expanded disorganized growth plates, rickets and osteomalacia, short
    stature, and cortical porosity. Rescue by bone-cell expression of DMP1 or
    its 57-kDa fragment, exacerbation by phosphate loading in adults, and
    partial correction by osteocyte-specific Fgf23 deletion are its main
    experimental results.
  modeled_mechanisms:
  - target: Defective Osteocyte Maturation and Pericellular Mineralization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The osteocyte maturation arrest and lacunocanalicular defect were defined
      in this model and are DMP1-dependent, since bone-cell DMP1 expression
      rescues them.
    limitations: >-
      A complete null on an inbred background; human alleles include hypomorphic
      and C-terminal-altering variants, and human carrier osteocyte dysmorphology
      has no direct counterpart in heterozygous mice, which mineralize normally.
    readouts:
    - name: Tibial mineral-to-matrix ratio by FTIR imaging
      target: Defective Osteocyte Maturation and Pericellular Mineralization
      direction: DECREASED
      interpretation: Relative mineral content of bone matrix in the null mouse at 4 and 16 weeks.
      evidence:
      - reference: PMID:16294270
        reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mineral-to-matrix ratios (spectroscopic parameter of relative mineral content) were significantly lower in dmp1 KO mice tibias compared with WT and HET at 4 and 16 weeks."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:17033621
      reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in defective osteocyte maturation and increased FGF23 expression, leading to pathological changes in bone mineralization."
      explanation: The model defines this node.
  - target: Increased Osteocytic FGF23 Production
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Osteocytic Fgf23 induction, its FGFR dependence and its non-additivity
      with Phex loss were all established in this model.
    limitations: >-
      The magnitude of induction in the null mouse exceeds what is inferred
      from human bone, where FGF23 expression is increased but has not been
      quantified; whether FGFR signalling drives human osteocytic FGF23 is not
      demonstrated.
    readouts:
    - name: Fgf23 mRNA in bone marrow stromal cells
      target: Increased Osteocytic FGF23 Production
      direction: INCREASED
      interpretation: 124-fold induction, abolished by the FGFR inhibitor SU5402.
      evidence:
      - reference: PMID:21507898
        reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, inhibiting FGFR signaling using SU5402 in Hyp- and Dmp1(-/-)-derived bone marrow stromal cells prevented the increase in Fgf23 mRNA expression (129- and 124-fold increase in Hyp and Dmp1(-/-) vs. 1.3-fold in Hyp+SU5402 and 2.5-fold in Dmp1(-/-)+SU5402, P<0.05)."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:28005411
      reference_title: A Mutation in the Dmp1 Gene Alters Phosphate Responsiveness in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, Dmp1 knockout mice had little Fgf23 cleavage and increased femoral Fgf23 expression, resulting in hypophosphatemia and low femoral bone mineral density (BMD)."
      explanation: Increased bone Fgf23 expression driving hypophosphatemia in the model.
  - target: Chronic Hypophosphatemia
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Hypophosphatemia with a lowered set point that is maintained through
      Fgf23 expression and cleavage; raising phosphate provokes more FGF23.
    limitations: >-
      Adult null mice also develop hyperparathyroidism, which most patients do
      not; the mouse therefore overstates the calciopenic component.
    readouts:
    - name: Serum phosphate
      target: Chronic Hypophosphatemia
      direction: DECREASED
      interpretation: Hypophosphatemia at 12 weeks with elevated serum FGF23 and PTH.
      evidence:
      - reference: PMID:37943605
        reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "At 12 weeks, Dmp1KO mice showed increased serum FGF23 and parathyroid hormone levels, hypophosphatemia, impaired growth, rickets, and osteomalacia."
        explanation: The measurement behind this readout.
    evidence:
    - reference: PMID:28005411
      reference_title: A Mutation in the Dmp1 Gene Alters Phosphate Responsiveness in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data indicate that a Dmp1 mutation creates a lower set point for extracellular phosphate and maintains it through the regulation of Fgf23 cleavage and expression."
      explanation: Characterizes the hypophosphatemia as a set-point defect, which is the informative feature of the model for this node.
  - target: Skeletal Mineralization Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Osteomalacia with accumulated osteoid, only partly corrected when
      phosphate is normalized by osteocytic Fgf23 deletion, which is the
      experiment that separates the endocrine from the local route into this
      node.
    limitations: >-
      The model has not been followed long enough to show whether the adult
      human hyperostosis, osteosclerosis and enthesopathy have a murine
      counterpart; those features are not modelled.
    evidence:
    - reference: PMID:37943605
      reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In conclusion, FGF23-induced hypophosphatemia is only partially responsible for the bone defects observed in Dmp1KO mice."
      explanation: The two-route result that makes this model informative for the node.
  - target: Growth Plate Hypertrophic Zone Expansion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Expanded, disorganized growth plates with rickets, rescued by bone-cell
      expression of DMP1 or its 57-kDa fragment, and shown to be
      phosphate-dependent in metatarsal organ culture.
    limitations: >-
      Murine growth plates remain open through adult life, so the model does
      not reproduce the human transition from rickets to osteomalacia at
      skeletal maturity.
    evidence:
    - reference: PMID:20734454
      reference_title: The biological function of DMP-1 in osteocyte maturation is mediated by its 57-kDa C-terminal fragment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This included rescue of growth plate defects, osteomalacia, abnormal osteocyte maturation, and the abnormal osteocyte lacunocanalicular system."
      explanation: The growth plate defect of the model and its DMP1 dependence.
    - reference: PMID:21542006
      reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we used Dmp1 null mice, a hypophosphatemic rickets/osteomalacia model, combined with a metatarsal organ culture and an application of neutralizing fibroblast growth factor 23 (FGF-23) antibodies to gain insight into the roles of P(i) in bone biology."
      explanation: The model used as the ARHR1 rickets model, with FGF23 neutralization as an experimental arm.
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dentin matrix protein 1 (encoded by DMP1) is highly expressed in osteocytes and, when deleted in mice, results in a hypomineralized bone phenotype."
    explanation: Establishes the model and its baseline phenotype.
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed (1) that abnormal bone remodeling in Dmp1 null mice is due to reduced osteoclast number, which is secondary to a reduced ratio of RANKL/OPG expressed by osteoclast supporting cells"
    explanation: Reduced osteoclast number and remodeling in the model, a feature with no established human counterpart that is recorded here rather than as a human node.
  notes: >-
    Related models. The Dmp1/Galnt3 double knockout (PMID:28005411) raises serum
    phosphate by increasing Fgf23 cleavage and normalizes bone density while
    Fgf23 expression climbs further, the experiment that defines the lowered set
    point. Compound Hyp/Dmp1 mutants (PMID:21507898) show non-additive FGF23 and
    rickets, placing PHEX and DMP1 on one pathway. A DMP1-deficient rabbit with
    elevated FGF23 and hypophosphatemic rickets is described in the osteocyte
    review (PMID:36246908) but its primary report was not curated here. No
    naturally occurring animal disease equivalent to human ARHR1 is known.
discussions:
- discussion_id: arhr1_dmp1_to_fgf23_coupling
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic DMP1 Loss of Function
  - pathophysiology#Defective Osteocyte Maturation and Pericellular Mineralization
  - pathophysiology#Increased Osteocytic FGF23 Production
  prompt: >-
    By what molecular route does loss of an extracellular matrix phosphoprotein
    in the osteocyte de-repress Fgf23 transcription, and is the FGFR-dependent
    mechanism shown in mouse bone cells the one operating in human ARHR1?
  rationale: >-
    The two edges into the FGF23 node are typed unknown-intermediates for a
    reason: the discovery papers proposed that DMP1 regulates FGF23, the mouse
    genetics show FGFR signalling is required for the induction and that PHEX
    and DMP1 share the pathway, and the set-point studies show the induction
    is phosphate-responsive, but none of this says what DMP1 in the matrix
    does to the cell to keep Fgf23 off. Candidate explanations include a loss
    of matrix-derived signalling through integrins or the ASARM peptide,
    abnormal local phosphate sensing by immature osteocytes through FGFR, and
    a maturation-stage effect in which osteoid osteocytes are simply
    FGF23-competent. Until it is known, the upstream target for a
    disease-modifying therapy other than FGF23 neutralization cannot be named.
  evidence:
  - reference: PMID:21507898
    reference_title: Bone proteins PHEX and DMP1 regulate fibroblastic growth factor Fgf23 expression in osteocytes through a common pathway involving FGF receptor (FGFR) signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mechanisms whereby PHEX and DMP1 regulate Fgf23 expression are unknown."
    explanation: The gap stated in the paper that came closest to closing it.
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that DMP1 may regulate FGF23 expression"
    explanation: The hypothesis as first stated; it has been confirmed as a relationship but not explained as a mechanism.
  proposed_experiments:
  - experiment_id: arhr1_human_osteocyte_fgfr_dependence
    name: FGFR dependence of FGF23 induction in human DMP1-deficient osteocytes
    description: >-
      Differentiate osteocytes from patient-derived or DMP1-edited human iPSCs
      and test whether FGF23 induction is abolished by FGFR1 inhibition, and
      whether it is restored by exogenous 57-kDa C-terminal DMP1 added to the
      matrix, to establish that the mouse pathway operates in human cells and
      that the extracellular fragment is sufficient.
- discussion_id: arhr1_fgf23_blockade_versus_matrix_defect
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal Mineralization Failure
  - treatments#Burosumab
  prompt: >-
    In the Dmp1-null mouse, removing osteocytic Fgf23 normalizes serum phosphate
    but leaves part of the bone phenotype uncorrected; does the same residual,
    DMP1-intrinsic mineralization defect limit what burosumab can achieve in
    patients with ARHR1?
  rationale: >-
    The model result is unambiguous and is the basis for the local
    mineralization edge in this entry. The human evidence points the other way
    but is thin: two brothers and one further adult improved biochemically and
    clinically on burosumab, with pseudofracture healing, but no histology, no
    bone density trajectory and no growth data in a child exist. If the mouse
    is right, ARHR1 patients on burosumab should show slower or incomplete
    healing of osteomalacia than XLH patients at matched phosphate, and a
    DMP1-replacement or matrix-directed therapy would be needed in addition. If
    the mouse overstates the local defect, because the complete null exaggerates
    what hypomorphic human alleles do, FGF23 neutralization alone may suffice.
    The two carrier biopsies showing a mild mineralization defect at normal
    phosphate favour the mouse.
  evidence:
  - reference: PMID:37943605
    reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data suggest that combined DMP1 repletion and FGF23 blockade could effectively correct ARHR-associated mineral and bone disorders."
    explanation: The authors' inference that FGF23 blockade alone will be incomplete in ARHR1.
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present report highlights the beneficial biochemical and clinical outcomes associated with the use of burosumab in patients with ARHR1."
    explanation: The human observation that must be reconciled with the model.
  proposed_experiments:
  - experiment_id: arhr1_burosumab_histomorphometry
    name: Paired bone histomorphometry before and after burosumab in ARHR1
    description: >-
      Tetracycline-labelled trans-iliac biopsies before and after twelve months
      of burosumab in adults with ARHR1, compared with the published XLH
      response at matched serum phosphate, with osteoid thickness,
      mineralization lag time and osteocyte morphology as endpoints. Residual
      osteoid at normal phosphate would confirm the DMP1-intrinsic defect in
      humans.
- discussion_id: arhr1_hyperostosis_osteosclerosis_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Osteosclerosis with Increased Axial Bone Density
  - phenotypes#Cranial Hyperostosis
  - phenotypes#Enthesopathy and Paraspinal Ligament Calcification
  prompt: >-
    Why do adults with a mineralization-failure disease develop cranial
    hyperostosis, a high axial bone density and ossifying enthesopathy severe
    enough to immobilize the spine, and are these one process or several?
  rationale: >-
    These features are curated as phenotypes without a causal edge because no
    source explains them and their reporters call the density increase
    unaccountable. Osteosclerosis coexisting with osteomalacia is
    radiographically established, but areal density on DXA can be inflated by
    accumulated unmineralized osteoid volume, ligamentous ossification and
    cortical thickening, and one HR-pQCT study found damaged peripheral
    microstructure despite high axial density, so it is not clear that bone is
    genuinely stronger. Candidate mechanisms include the reduced osteoclast
    number and RANKL/OPG ratio seen in the null mouse, decades of conventional
    phosphate and calcitriol treatment, direct FGF23 or sclerostin effects on
    bone formation, and loss of a SIBLING-protein brake on ectopic
    mineralization at entheses; the Indian family carried an additional SPP1
    variant, which confounds attribution to DMP1 alone. Whether FGF23
    neutralization slows the enthesopathy is untested.
  evidence:
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our cases show that some ARHR cases may develop with age an unaccountable increase in bone density and bone overgrowth."
    explanation: The gap as stated by the reporters.
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High aBMD and local osteosclerosis in axial bone with low vBMD and damaged microstructure in peripheral bone were featured."
    explanation: The axial-peripheral discordance that makes the sclerosis hard to interpret.
  - reference: PMID:21542006
    reference_title: Unique roles of phosphorus in endochondral bone formation and osteocyte maturation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We showed (1) that abnormal bone remodeling in Dmp1 null mice is due to reduced osteoclast number, which is secondary to a reduced ratio of RANKL/OPG expressed by osteoclast supporting cells"
    explanation: A candidate mechanism, reduced resorption, from the model.
  proposed_experiments:
  - experiment_id: arhr1_bone_quality_hrpqct_histology
    name: Volumetric density, microstructure and histology of sclerotic ARHR1 bone
    description: >-
      HR-pQCT and, where biopsy is obtainable, quantitative histomorphometry
      with osteoclast counts in adults with radiographic osteosclerosis, to
      test whether the sclerosis is mineralized bone with reduced resorption or
      accumulated osteoid, and whether enthesopathy correlates with FGF23,
      treatment exposure or genotype.
- discussion_id: arhr1_carrier_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#Biallelic DMP1 Pathogenic Variants
  prompt: >-
    Is the DMP1 heterozygous carrier state a subclinical bone disorder that
    warrants surveillance, and does it explain the carriers with mild
    hypophosphatemia?
  rationale: >-
    Carriers in the Finnish family had mild hypophosphatemia and focal
    osteomalacia on biopsy with increased bone FGF23 expression; carriers in
    two later kindreds had normal biochemistry but intermediate bone density
    and, on one biopsy, a mild mineralization defect with dysmorphic
    osteocytes. Heterozygous mice mineralize normally on FTIR. The finding
    matters for the inheritance label, which is recessive at the clinical
    level but not at the histological one, and for whether carrier relatives
    should have phosphate and bone density checked.
  evidence:
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two heterozygous carriers of the mutation also showed mild hypophosphatemia, and bone biopsy in one of these individuals showed focal areas of osteomalacia."
    explanation: The first report of a carrier phenotype.
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data expand the description of the clinical phenotype in fully affected individuals with ARHR1 and provide further evidence of a subclinical phenotype in the ARHR1 carrier state."
    explanation: Independent confirmation of a subclinical carrier phenotype.
  - reference: PMID:16294270
    reference_title: "DMP1 depletion decreases bone mineralization in vivo: an FTIR imaging analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Dmp1 KO mice had significantly lower ionic calcium and phosphate concentrations relative to WT, whereas in the HET, values for phosphate were equivalent, and calcium values were decreased relative to WT values."
    explanation: Heterozygous mice keep normal phosphate, so the human carrier hypophosphatemia is not reproduced by the model.

- FGF23-Mediated Hypophosphatemia
notes: >-
  Scope and lump/split. This entry is the DMP1-related disease only
  (MONDO:0009430, OMIM 241520). ARHR2 (ENPP1, MONDO:0013219) and the
  FAM20C-related form are mechanistically distinct recessive FGF23-excess
  disorders and are not modelled here; X-linked hypophosphatemia (PHEX) has its
  own entry, `X-Linked_Hypophosphatemia`. All three share the renal and
  skeletal physiology downstream of FGF23 excess; what is specific to ARHR1 is
  the initiating lesion and the DMP1-intrinsic osteocyte and matrix defect,
  which is why the entry carries a separate local mineralization edge that the
  XLH entry does not.

  Module conformance. The four downstream nodes conform to
  `defective_skeletal_mineralization` (Phosphopenic Substrate Deficiency,
  Impaired Hydroxyapatite Deposition at the Mineralization Front, Growth Plate
  Hypertrophic Zone Expansion, Rickets and Osteomalacia), entering by the
  phosphopenic arm with parathyroid hormone characteristically normal. The
  disorder-specific substitution is DMP1 loss in osteocytes driving FGF23 excess.

  Deliberately unbound. Enthesopathy is left without an HP term because
  HP:0100686 is inflammatory enthesitis and the ARHR1 lesion is calcific and
  ossifying, the same decision the XLH entry records. The adult
  hyperostotic-osteosclerotic phenotype is curated as phenotypes and a
  knowledge gap rather than as a causal edge, because no source explains it.

  No GeneReviews chapter exists for ARHR1; the XLH chapter (PMID:22319799) is
  cached but is not cited here, since every sentence usable from it is
  XLH-specific. Provenance: the Falcon (Edison) deep-research report
  `research/Autosomal_Recessive_Hypophosphatemic_Rickets_1-deep-research-falcon.md`
  was used as a lead list (11/11 references resolved, 44/46 terms resolved;
  `preflight-dr` WARN because FGF23 is mentioned more often than DMP1, which is
  the downstream hormone rather than a rival disease gene, OMIM 241520 matched).
  Its DOI-keyed citations were resolved to PMIDs through the PMC ID converter
  (10.1038/ng1868 to PMID:17033625, 10.1002/jbmr.105 to PMID:20499351,
  10.1210/en.2016-1642 to PMID:28005411, 10.1172/jci.insight.156850 to
  PMID:37943605, 10.1016/j.bonr.2024.101753 to PMID:39011543,
  10.3389/fendo.2022.1005189 to PMID:36246908, 10.1007/s00467-022-05505-5 to
  PMID:35352187); 10.3892/ijmm.2018.3730 (Gu 2018) and 10.3390/endocrines3020025
  have no PubMed record and are not cited. The discovery papers, the family
  reports and the Dmp1-null mouse mechanism papers were found directly in
  PubMed.

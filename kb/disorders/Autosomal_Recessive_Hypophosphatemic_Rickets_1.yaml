    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FGF23 was inappropriately normal at an older age while being treated with oral phosphate and 1,25(OH)(2)D."

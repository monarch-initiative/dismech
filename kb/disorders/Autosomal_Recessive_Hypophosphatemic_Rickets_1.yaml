phenotypes:
- name: Rickets
  category: Skeletal
  description: >-
    Growth-plate disease in childhood, with metaphyseal widening, cupping or fraying and limb deformity. Age
    at recognition and severity vary, including later childhood presentation; published case series do not
    establish population penetrance.
  phenotype_term:
    preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both Dmp1-null mice and individuals with a newly identified disorder, autosomal recessive hypophosphatemic rickets, manifest rickets and osteomalacia with isolated renal phosphate-wasting associated with elevated fibroblast growth factor 23 (FGF23) levels and normocalciuria."
    explanation: Rickets is the defining childhood manifestation named in the disorder itself.
    quote_role: PRIMARY_RESULT
  - reference: PMID:35896139
    reference_title: Burosumab Treatment for Autosomal Recessive Hypophosphatemic Rickets Type 1 (ARHR1).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "leading to impaired bone mineralization (rickets and osteomalacia)"
    explanation: >-
      Rickets is the skeletal mineralization manifestation described by this source.
    quote_role: BACKGROUND
- name: Osteomalacia
  category: Skeletal
  description: >-
    Impaired mineralization of osteoid in children or adults, documented by bone biopsy in selected affected
    individuals. Focal subclinical mineralization abnormalities also occur in some heterozygous carriers; these
    do not establish the same disease severity.
  phenotype_term:
    preferred_term: Osteomalacia
    term:
      id: HP:0002749
      label: Osteomalacia
  evidence:
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both Dmp1-null mice and individuals with a newly identified disorder, autosomal recessive hypophosphatemic rickets, manifest rickets and osteomalacia with isolated renal phosphate-wasting associated with elevated fibroblast growth factor 23 (FGF23) levels and normocalciuria."
    explanation: Osteomalacia named as a manifestation in the discovery families.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-ray uncovered coexistence of osteomalacia and osteosclerosis."
    explanation: Radiographic osteomalacia in the Chinese cases, coexisting with sclerosis.
    quote_role: PRIMARY_RESULT
- name: Hypophosphatemia
  category: Laboratory
  description: >-
    Renal phosphate wasting generally lowers serum phosphate relative to age-specific ranges. Low-normal values
    have been reported in adults and treatment can normalize concentrations, so persistent hypophosphatemia
    at every measurement is not obligatory.
  phenotype_term:
    preferred_term: Hypophosphatemia
    term:
      id: HP:0002148
      label: Hypophosphatemia
  evidence:
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Autosomal recessive hypophosphatemic rickets (ARHR) is an extremely rare disorder of autosomal recessive inheritance, characterized by hypophosphatemia resulting from renal phosphate wasting."
    explanation: >-
      Renal phosphate wasting and hypophosphatemia characterize the disorder; treatment and sampling time affect
      measured phosphate.
    quote_role: BACKGROUND
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypophosphatemia, elevated alkaline phosphatase, high intact fibroblast growth factor 23 and sclerostin were found."
    explanation: Present in all five Chinese patients.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Biochemical analysis was consistent with normal serum calcium and 1-25(OH)2D levels, low to normal serum
      phosphorus and elevated PTH values.
    explanation: >-
      The two adult sisters had low-to-normal phosphate values, limiting an obligatory lifelong low-concentration
      claim.
- name: Elevated Circulating FGF23
  category: Laboratory
  description: >-
    Elevated measured FGF23 is reported, but values can remain within the assay reference interval despite
    inappropriate nonsuppression during hypophosphatemia. Intact and C-terminal assays measure different analytes.
    The phenotype term refers to actual elevation; inappropriately normal measurements support the mechanism
    rather than this literal abnormality.
  phenotype_term:
    preferred_term: Elevated circulating FGF23
    term:
      id: HP:6000407
      label: Elevated circulating fibroblast growth factor 23 concentration
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intact plasma levels of the phosphaturic protein FGF23 were clearly elevated in two of four affected individuals"
    explanation: >-
      Intact FGF23 was elevated in two of four individuals at discovery; other values were inappropriately
      normal for the hypophosphatemia.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypophosphatemia, elevated alkaline phosphatase, high intact fibroblast growth factor 23 and sclerostin were found."
    explanation: High intact FGF23 in the Chinese series.
    quote_role: PRIMARY_RESULT
- name: Short Stature
  category: Growth
  description: >-
    Growth impairment and disproportionate short stature occur in many reported patients, but normal or tall
    adult stature is documented. Selected pooled genotype groups differed in mean height, without establishing
    an individual prognosis independent of treatment, age and family background.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:32920683

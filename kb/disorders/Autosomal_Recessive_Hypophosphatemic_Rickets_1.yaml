      explanation: States the causal step from DMP1 absence to defective osteocyte maturation.
      quote_role: PRIMARY_RESULT
  - target: DMP1-Dependent Matrix Mineralization Defect
    causal_link_type: DIRECT
    description: >-
      Loss of functional extracellular DMP1 impairs matrix mineralization independently of phosphate substrate
      and excess FGF23 in culture.
    evidence:
    - reference: PMID:37943605
      reference_title: FGF23 directly inhibits osteoprogenitor differentiation in Dmp1-knockout mice.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        In the present study, although genetic deletion of Fgf23 restored osteoblast differentiation, it did

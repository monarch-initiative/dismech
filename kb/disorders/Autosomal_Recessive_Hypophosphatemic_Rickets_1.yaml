genetic:
- name: Biallelic DMP1 Pathogenic Variants
  gene_term:
    preferred_term: DMP1
    term:
      id: hgnc:2932
      label: DMP1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:17033625
      reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we mapped an autosomal recessive form (designated ARHP) to chromosome 4q21 and identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous bone matrix protein expressed in osteoblasts and osteocytes."
      explanation: Recessive mapping with homozygous DMP1 mutations.
      quote_role: PRIMARY_RESULT
  notes: >-
    Reported DMP1 alleles include nonsense, frameshift, splice-site and start-codon variants, a deletion of
    at least 49 kb removing exons 3–6 and adjacent sequence, and a larger deletion spanning DSPP, DMP1, IBSP
    and part of MEPE in trans with c.1A>T. Start-codon variants are start-loss alleles: historical p.Met1Val/p.Met1Leu
    notation does not imply simple replacement in an otherwise intact protein. c.1A>T permits downstream initiation
    and secretion of a shorter protein with altered processing in vitro. c.730G>T (p.Glu244Ter) and c.1122T>G
    (p.Tyr374Ter) were reported in separate Chinese and adolescent cases. Selected pooled genotype-phenotype
    associations do not establish causal severity rules. Normal carrier examinations occur alongside subclinical
    biochemical or biopsy findings in some families; biallelic penetrance is not quantified.
  evidence:
  - reference: PMID:17033625
    reference_title: DMP1 mutations in autosomal recessive hypophosphatemia implicate a bone matrix protein in the regulation of phosphate homeostasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we mapped an autosomal recessive form (designated ARHP) to chromosome 4q21 and identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous bone matrix protein expressed in osteoblasts and osteocytes."
    explanation: Linkage mapping and homozygous mutation identification establishing DMP1 as the causal gene.
    quote_role: PRIMARY_RESULT
  - reference: PMID:17033621
    reference_title: Loss of DMP1 causes rickets and osteomalacia and identifies a role for osteocytes in mineral metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analyses showed that autosomal recessive hypophosphatemic rickets family carried a mutation affecting the DMP1 start codon, and a second family carried a 7-bp deletion disrupting the highly conserved DMP1 C terminus."
    explanation: Independent simultaneous identification of the gene with two allele classes.
    quote_role: PRIMARY_RESULT
  - reference: PMID:19007919
    reference_title: Molecular analysis of DMP1 mutants causing autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At a minimum, this deletion encompassed 49 kb between DMP1 exon 3 and an intergenic region 5' to the next telomeric gene, integrin-binding sialoprotein (IBSP)."
    explanation: A large biallelic deletion, confirming loss of function as the mechanism.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20213538
    reference_title: A novel nonsense mutation in the DMP1 gene in a Japanese family with autosomal recessive hypophosphatemic rickets.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of peripheral leukocytes from the patients revealed that they carried a novel homozygous nonsense mutation in the DMP1 gene (98G>A, W33X), which leads to a truncated DMP protein with no putative biological function."
    explanation: Nonsense allele in the Japanese family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:19796717
    reference_title: Identification of a novel dentin matrix protein-1 (DMP-1) mutation and dental anomalies in a kindred with autosomal recessive hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous frame-shift mutation (c.485Tdel; p.Glu163ArgfsX53) in exon 6 resulting in a premature stop codon was identified in all effected individuals."
    explanation: Frameshift allele in the Turkish kindred.
    quote_role: PRIMARY_RESULT
  - reference: PMID:20499351
    reference_title: Long-term clinical outcome and carrier phenotype in autosomal recessive hypophosphatemia caused by a novel DMP1 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nucleotide sequence analysis of DMP1 revealed a novel homozygous mutation at the splice acceptor junction of exon 6 (IVS5-1G > A)."
    explanation: Splice-site allele in the Finnish family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25180662
    reference_title: Exome sequencing reveals a mutation in DMP1 in a family with familial sclerosing bone dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A homozygous mutation disrupting the initiation codon of the DMP1 gene (OMIM 600980), NM_001079911.2: c.1A>G, p.Met1Val, was identified by exome sequencing and confirmed by Sanger sequencing."
    explanation: Recurrent start-codon allele in the Lebanese family.
    quote_role: PRIMARY_RESULT
  - reference: PMID:36334264
    reference_title: The First Compound Heterozygous Mutations of DMP1 Causing Rare Autosomal Recessive Hypophosphatemic Rickets Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES performed on the proband revealed a novel start codon mutation (c.1A > T, p.Met1Leu) in DMP1 and a large deletion involving most of the small integrin-binding ligand N-linked glycoprotein (SIBLING) family gene, including DSPP, DMP1, IBSP, and MEPE."
    explanation: Compound heterozygosity for a start-codon variant and a multigene deletion.
    quote_role: PRIMARY_RESULT
  - reference: PMID:32920683
    reference_title: "Clinical Characteristics and Bone Features of Autosomal Recessive Hypophosphatemic Rickets Type 1 in Three Chinese Families: Report of Five Chinese Cases and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analyses of DMP1 revealed three homozygous mutations including two novel mutations, c.54 + 1G > C and c.94C > A (p.E32X), and a reported mutation c.184-1G > A."
    explanation: Three further homozygous alleles in the Chinese families.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41820620
    reference_title: Expanding the Autosomal Recessive Hypophosphatemic Rickets Type I Carrier Phenotype and Adult Treatment with Burosumab.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we describe deep phenotyping in ARHR1 carriers from two unrelated kindreds who had normal clinical and serum biochemical profiles but lumbar spine bone mineral density (BMD) Z-scores that, while attenuated relative to fully affected family members, were considerably higher than a family member with two normal alleles."
    explanation: Subclinical carrier phenotype, recorded so the recessive label is not read as heterozygotes being biologically normal.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.spandidos-publications.com/10.3892/ijmm.2018.3730/download
    reference_title: https://www.spandidos-publications.com/10.3892/ijmm.2018.3730/download
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The homozygous c.730G>T mutation from the DMP1 gene was found in patient 8, although both of his parents
      were heterozygous carriers.
    explanation: >-
      The publisher full text of Gu et al. 2018 (PMID:29901142) establishes the homozygous nonsense variant

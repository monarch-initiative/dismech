name: Pigment Dispersion Syndrome
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Pigment dispersion syndrome is an acquired anterior-segment disorder in which
  pigment is rubbed off the back of the iris and washed forward into the eye's
  drainage system. The mechanism is unusually mechanical for an eye disease: the
  mid-peripheral iris bows backwards into a concave configuration, which brings
  its pigmented posterior surface into contact with the zonular fibres that
  suspend the lens. Every accommodation and every blink chafes iris against
  zonule, liberating granules from the iris pigment epithelium. The released
  pigment circulates in the aqueous humour and settles wherever that fluid goes,
  producing the classical triad: a vertical band of pigment on the corneal
  endothelium, radial spoke-like transillumination defects where the iris has
  been scoured through, and a densely pigmented trabecular meshwork on
  gonioscopy.

  The distinction that organises this entry is that pigment dispersion is a risk
  state, not a glaucoma. Trabecular cells phagocytose small amounts of pigment
  without consequence, and many people carry a heavily pigmented meshwork and
  normal pressure for life. The disease becomes pigmentary glaucoma only when
  sustained pigment loading overwhelms that clearance capacity, outflow
  resistance rises, intraocular pressure climbs, and the optic nerve is damaged.
  The literature is explicit that the same deposited pigment behaves benignly in
  one eye and malignantly in another, and what determines which remains
  unexplained.

  The disease is polygenic rather than Mendelian, with a strong and probably
  causal relationship to myopia, and it presents young, in the third to fifth
  decade, in a population that is disproportionately male when glaucoma
  develops.
category: Complex
disease_term:
  preferred_term: Pigment Dispersion Syndrome
  term:
    id: MONDO:0010896
    label: pigment dispersion syndrome
synonyms:
- PDS
- Pigmentary dispersion syndrome
notes: >-
  Scope. This entry covers the dispersion syndrome and its progression to
  pigmentary glaucoma as one spectrum, because the literature treats them as two
  stages of a single disease and the mechanistic chain is continuous. The
  boundary is nonetheless made explicit at the node level: everything up to and
  including elevated intraocular pressure is dispersion syndrome, and pigmentary
  glaucoma requires glaucomatous optic neuropathy in addition. Curating them as
  separate entries would sever a chain that the pathophysiology does not sever.

  Module conformance. The outflow and optic-neuropathy arm conforms to
  `glaucoma_optic_neuropathy` at three nodes. The disorder-specific substitution
  is the cause of the trabecular dysfunction: here it is progressive loading of
  the meshwork with liberated iris pigment rather than the primary trabecular
  pathology of open-angle glaucoma.

  Genetics deliberately not asserted. This is a polygenic susceptibility, not a
  Mendelian disease. No causal gene is bound, no candidate locus is entered as
  causal, and in particular the melanosomal genes identified in the DBA/2J mouse
  are not curated as human disease genes; that inference is a known error in this
  area and the source deep-research report flags it explicitly.

  Provenance. Built from an Edison Falcon deep-research report. Falcon cites by
  DOI and by internal corpus keys rather than by PMID, and the reference
  validator skips DOI-prefixed snippets, so every DOI in the report was resolved
  to its PubMed record and all evidence here is cited and verified against PMIDs
  instead. The report's own analysis is reflected in the node structure; none of
  its unresolvable corpus-key citations are curated.
pathophysiology:
- name: Posterior Iris Concavity and Iridozonular Contact
  biological_scale: TISSUE
  description: >-
    The initiating mechanical fault. The mid-peripheral iris bows posteriorly
    into a concave configuration, which presses its pigmented back surface
    against the zonular fibres suspending the lens. This is anatomy rather than
    biochemistry: a deep anterior chamber, a wide-open angle, and the axial
    geometry that accompanies myopia all increase the contact, and the movements
    of ordinary life supply the repetition.
  evidence:
  - reference: PMID:10150864
    reference_title: "Pathophysiology of pigment dispersion syndrome and pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The concavity of the midperipheral iris allows iridozonular contact."
    explanation: >-
      States the geometric fault and the contact it permits, which is the whole
      of this node.
  downstream:
  - target: Liberation of Iris Pigment Epithelial Granules
    causal_link_type: DIRECT
    description: >-
      Repeated mechanical contact abrades the pigmented posterior surface.
- name: Liberation of Iris Pigment Epithelial Granules
  biological_scale: CELLULAR
  description: >-
    Pigment granules are released from the iris pigment epithelium, the densely
    pigmented layer on the posterior iris surface. The loss is structural and
    visible: where the epithelium has been scoured away, light passes through the
    iris in radial spoke-like defects, so the damage can be read directly at the
    slit lamp.
  cell_types:
  - preferred_term: iris pigment epithelial cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  evidence:
  - reference: PMID:26871761
    reference_title: "Peripheral iridotomy for pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigment dispersion syndrome is characterized by a structural disturbance in the iris pigment epithelium"
    explanation: >-
      Locates the structural disturbance in the iris pigment epithelium, which is
      the cell layer this node describes.
  downstream:
  - target: Pigment Dispersion Through the Aqueous Humour
    causal_link_type: DIRECT
    description: >-
      Liberated granules enter the aqueous and are carried by its circulation.
  - target: Abnormal iris pigmentation
    causal_link_type: DIRECT
    description: >-
      Loss of the pigmented layer produces the transillumination defects.
- name: Pigment Dispersion Through the Aqueous Humour
  biological_scale: TISSUE
  description: >-
    Released granules circulate in the aqueous humour and deposit wherever that
    fluid carries them: on the corneal endothelium as a vertically oriented
    Krukenberg spindle, on the lens and zonules, and in the trabecular meshwork.
    The distribution is a map of aqueous flow rather than of disease severity,
    which is why the corneal and iris signs are diagnostic without being harmful.
  evidence:
  - reference: PMID:29721842
    reference_title: "Pigment dispersion syndrome and pigmentary glaucoma: a review and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of PDS is defined by the presence of pigmented cells on the corneal endothelium, an increase of pigmentation of the trabecular meshwork, and mid-periphery transillumination defects of the iris."
    explanation: >-
      Enumerates the three deposition sites that define the clinical
      presentation, which is what this node distributes pigment to.
  downstream:
  - target: Trabecular Meshwork Pigment Loading and Outflow Dysfunction
    causal_link_type: DIRECT
    description: >-
      The consequential destination, because the meshwork is the drain.
- name: Trabecular Meshwork Pigment Loading and Outflow Dysfunction
  biological_scale: TISSUE
  description: >-
    The node where a cosmetic finding becomes a disease, and the point at which
    the two possible courses separate. Trabecular cells phagocytose small amounts
    of pigment and dispose of it without consequence, which is why a densely
    pigmented meshwork is compatible with a lifetime of normal pressure.
    Sustained loading is different: phagocytic and migratory capacity falls,
    trabecular cells are lost, and aqueous outflow resistance rises. The
    literature states the divergence directly, describing the same deposited
    pigment as behaving benignly in some eyes and malignantly in others.
  conforms_to: "glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction"
  cell_types:
  - preferred_term: trabecular meshwork cell
    term:
      id: CL:0002367
      label: trabecular meshwork cell
  biological_processes:
  - preferred_term: phagocytosis of pigment granules by trabecular cells
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:10150864
    reference_title: "Pathophysiology of pigment dispersion syndrome and pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Small amounts of pigment are quickly phagocytized."
    explanation: >-
      Establishes the clearance capacity that must be exceeded before pigment
      loading matters, which is why this node is a threshold rather than a step.
  - reference: PMID:10150864
    reference_title: "Pathophysiology of pigment dispersion syndrome and pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Released pigment is carried to the trabecular meshwork where it resides: (1) benignly, not affecting the intraocular pressure, as in pigment dispersion syndrome; or (2) malignantly, elevating the intraocular pressure, as in pigmentary glaucoma."
    explanation: >-
      The decisive sentence of the entry: the same pigment in the same place has
      two possible consequences, and which one occurs is what separates the
      syndrome from the glaucoma.
  downstream:
  - target: Ocular hypertension
    causal_link_type: DIRECT
    description: >-
      Rising outflow resistance raises intraocular pressure. This edge fires only
      in the malignant course; in the benign course the node has no downstream
      consequence at all.
- name: Glaucomatous Optic Neuropathy
  biological_scale: ORGANISM
  description: >-
    Retinal ganglion cell loss with optic disc and nerve fibre layer damage, and
    the point at which the diagnosis changes name. Pigmentary glaucoma requires
    this node; dispersion syndrome with a heavily pigmented meshwork and a normal
    disc does not qualify, however dramatic the anterior-segment findings.
  conforms_to: "glaucoma_optic_neuropathy#Progressive Glaucomatous Optic Neuropathy"
  evidence:
  - reference: PMID:36518550
    reference_title: "Pigment dispersion syndrome: A brief overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmentary glaucoma (PG) can develop from PDS in the presence of elevated IOP coupled with glaucomatous optic neuropathy, retinal nerve fiber thinning, and/or visual field defects."
    explanation: >-
      States the diagnostic requirement precisely: elevated pressure together
      with optic neuropathy, not pigment alone.
  - reference: PMID:26871761
    reference_title: "Peripheral iridotomy for pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmentary glaucoma is a specific form of open-angle glaucoma found in patients with pigment dispersion syndrome."
    explanation: >-
      Places pigmentary glaucoma as a subset arising within the dispersion
      population rather than as a separate disease.
  downstream:
  - target: Visual field defect
    causal_link_type: DIRECT
    description: >-
      Ganglion cell loss produces the characteristic field defects.
phenotypes:
- name: Abnormal iris pigmentation
  category: Ophthalmic
  description: >-
    Radial, spoke-like mid-peripheral transillumination defects where the iris
    pigment epithelium has been abraded away, together with pigment deposited on
    the corneal endothelium as a Krukenberg spindle. HPO has no term for
    transillumination defects specifically, so this is bound to the nearest
    available concept and described precisely in prose rather than forced onto a
    poorly fitting term.
  phenotype_term:
    preferred_term: Iris transillumination defects and corneal pigment deposition
    term:
      id: HP:0008034
      label: Abnormal iris pigmentation
  evidence:
  - reference: PMID:29721842
    reference_title: "Pigment dispersion syndrome and pigmentary glaucoma: a review and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of PDS is defined by the presence of pigmented cells on the corneal endothelium, an increase of pigmentation of the trabecular meshwork, and mid-periphery transillumination defects of the iris."
    explanation: >-
      Names both the corneal deposition and the iris transillumination defects
      that this phenotype covers.
- name: Ocular hypertension
  category: Ophthalmic
  description: >-
    Raised intraocular pressure from increased outflow resistance. It may be
    intermittent, and pigment showers after exercise or pharmacological dilation
    can produce transient spikes, so a single normal reading does not exclude the
    problem.
  phenotype_term:
    preferred_term: Ocular hypertension
    term:
      id: HP:0007906
      label: Ocular hypertension
  evidence:
  - reference: PMID:36518550
    reference_title: "Pigment dispersion syndrome: A brief overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PDS is a risk factor and can give lead to a rise in intraocular pressure (IOP) and secondary glaucoma."
    explanation: >-
      Establishes raised intraocular pressure as a consequence of the dispersion
      rather than an independent finding. Quoted verbatim including the source's
      grammatical slip.
- name: Glaucoma
  category: Ophthalmic
  description: >-
    Pigmentary glaucoma, the outcome that defines the malignant course. It is an
    open-angle glaucoma occurring specifically within the dispersion population.
  phenotype_term:
    preferred_term: Pigmentary glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:26871761
    reference_title: "Peripheral iridotomy for pigmentary glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmentary glaucoma is a specific form of open-angle glaucoma found in patients with pigment dispersion syndrome."
    explanation: >-
      Defines the phenotype as an open-angle glaucoma arising in this specific
      population.
- name: Myopia
  category: Ophthalmic
  description: >-
    Short-sightedness, present in the great majority of affected people and
    probably causal rather than merely associated. Mendelian randomisation has
    been used specifically to test whether refractive error exerts a causal
    effect on the dispersion syndrome, which is a stronger claim than the usual
    observational association.
  phenotype_term:
    preferred_term: Myopia
    term:
      id: HP:0000545
      label: Myopia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:36518550
    reference_title: "Pigment dispersion syndrome: A brief overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is more common in myopic patients with a predominance in young males in the third to fifth decade of life that affects about 1-2% of the population."
    explanation: >-
      Gives the myopic predominance, the sex skew, and the age of presentation in
      one sentence. The VERY_FREQUENT band reflects the strength of the myopic
      association reported across this literature.
- name: Visual field defect
  category: Ophthalmic
  description: >-
    Glaucomatous field loss, typically arcuate or nasal-step, and usually
    asymptomatic until advanced. Its presence marks established optic nerve
    damage rather than dispersion alone.
  phenotype_term:
    preferred_term: Visual field defect
    term:
      id: HP:0001123
      label: Visual field defect
  evidence:
  - reference: PMID:36518550
    reference_title: "Pigment dispersion syndrome: A brief overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigmentary glaucoma (PG) can develop from PDS in the presence of elevated IOP coupled with glaucomatous optic neuropathy, retinal nerve fiber thinning, and/or visual field defects."
    explanation: >-
      Names visual field defects among the findings that establish glaucomatous
      damage.
genetic:
- name: Polygenic susceptibility to pigment dispersion
  relationship_type: SUSCEPTIBILITY
  notes: >-
    No causal gene is bound because none is established. Familial clustering has
    sometimes looked autosomal dominant with reduced penetrance, and heritability
    has been measured directly in relatives, but genome-wide association work
    identifies common susceptibility loci rather than a Mendelian gene. The same
    work used Mendelian randomisation to test whether refractive error is
    causally upstream of the disease, which reframes myopia as part of the
    mechanism rather than a co-occurring trait.

    Deliberately not curated: the melanosomal genes identified in the DBA/2J
    mouse model of pigment dispersion. Inferring human causal genes from that
    model is a recognised error in this literature, and the source deep-research
    report flags it explicitly as something not to enter.
  evidence:
  - reference: PMID:30796891
    reference_title: "The Heritability of Pigment Dispersion Syndrome and Pigmentary Glaucoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigment dispersion syndrome (PDS) and pigmentary glaucoma (PG) are presumed to be inherited in an autosomal dominant manner."
    explanation: >-
      PARTIAL and quoted deliberately at the word "presumed": this is the
      hypothesis the study set out to examine by measuring heritability in
      relatives, not a finding of Mendelian inheritance.
  - reference: PMID:35031440
    reference_title: "Genome-Wide Association Study Identifies Two Common Loci Associated with Pigment Dispersion Syndrome/Pigmentary Glaucoma and Implicates Myopia in its Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-sample Mendelian randomization was used to determine whether refractive error and intraocular pressure exert causal effects over PDS."
    explanation: >-
      Establishes that the genetic architecture was analysed for causal
      relationships with myopia and pressure rather than for a single causal
      gene.
treatments:
- name: Intraocular Pressure Lowering Therapy
  description: >-
    The mainstay, and note what it treats: pressure, not pigment. No therapy
    removes deposited pigment or restores trabecular cells, so management is the
    same pressure-lowering repertoire used in other open-angle glaucomas, applied
    once pressure is raised. Options run from topical medication through laser
    trabeculoplasty to filtration surgery.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Ocular hypertension
    treatment_effect: MODULATES
    description: >-
      Lowers pressure by increasing outflow or reducing aqueous production,
      acting downstream of the trabecular obstruction rather than clearing it.
    evidence:
    - reference: PMID:29721842
      reference_title: "Pigment dispersion syndrome and pigmentary glaucoma: a review and update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Management is based on medical therapy, laser iridotomy, selective laser trabeculoplasty, and filtration procedures."
      explanation: >-
        Enumerates the management options, all of which act on pressure rather
        than on the pigment burden.
  evidence:
  - reference: PMID:29721842
    reference_title: "Pigment dispersion syndrome and pigmentary glaucoma: a review and update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management is based on medical therapy, laser iridotomy, selective laser trabeculoplasty, and filtration procedures."
    explanation: >-
      The management repertoire as stated in a contemporary review.
- name: Peripheral Laser Iridotomy
  description: >-
    The one intervention aimed at the mechanism rather than the consequence. By
    equalising pressure between the posterior and anterior chambers it is
    intended to flatten the concave iris, break the iridozonular contact, and
    stop further pigment release. The rationale is coherent and the effect on
    iris configuration is real; whether it changes clinical outcome is not
    established, and that gap is curated rather than glossed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Posterior Iris Concavity and Iridozonular Contact
    treatment_effect: MODULATES
    description: >-
      Aims to abolish the reverse pressure gradient that bows the iris backwards,
      removing the contact that liberates pigment. This is the only treatment in
      the entry that addresses the initiating node.
    evidence:
    - reference: PMID:26871761
      reference_title: "Peripheral iridotomy for pigmentary glaucoma."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Topcial medical therapy is usually the first-line treatment; however, peripheral laser iridotomy has been proposed as an alternate treatment."
      explanation: >-
        PARTIAL because the source describes the procedure as proposed rather
        than established. Quoted verbatim including the source's typographical
        error in the first word.
  evidence:
  - reference: PMID:26871761
    reference_title: "Peripheral iridotomy for pigmentary glaucoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the effectiveness of peripheral laser iridotomy in reducing the development or progression of pigmentary glaucoma is unknown."
    explanation: >-
      A systematic review concluding that effectiveness is unknown. Recorded as
      REFUTE of an efficacy claim rather than omitted, because the mechanistic
      appeal of this procedure is exactly what makes an unevidenced
      recommendation likely.
discussions:
- discussion_id: pds_benign_versus_malignant_course
  prompt: >-
    Why does trabecular pigment loading raise intraocular pressure in some eyes
    and not others, when the deposited pigment looks the same?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Trabecular Meshwork Pigment Loading and Outflow Dysfunction
  rationale: >-
    This is the central unresolved question of the disease and it is unusually
    sharply posed, because the literature states the divergence explicitly: the
    same pigment carried to the same structure behaves benignly in some eyes and
    malignantly in others. A person may carry a densely pigmented meshwork for
    decades with normal pressure while another with comparable gonioscopic
    findings develops glaucoma. Candidate explanations include differences in
    trabecular phagocytic reserve, in the rate rather than the total burden of
    pigment delivery, in baseline outflow facility, and in genetic susceptibility
    at the identified association loci, but none has been shown to determine the
    outcome. Until it is understood, pigment burden on gonioscopy cannot be used
    to predict who needs treatment, which is precisely the clinical question the
    finding appears to answer and does not.
  proposed_experiments:
  - experiment_id: pds_longitudinal_outflow_facility
    name: Longitudinal outflow facility against pigment burden in dispersion syndrome
    description: >-
      Follow a cohort with gonioscopically graded pigment burden using serial
      tonography or equivalent measures of outflow facility, rather than pressure
      alone, and test whether baseline or declining facility separates those who
      convert to ocular hypertension from those who do not at equivalent pigment
      load. Pressure is a late and buffered readout; facility is the quantity the
      mechanism actually predicts.
- discussion_id: pds_iridotomy_mechanism_versus_outcome
  prompt: >-
    Does flattening the iris with peripheral laser iridotomy, which
    demonstrably alters iris configuration, change the clinical course of
    pigment dispersion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Posterior Iris Concavity and Iridozonular Contact
  - treatments#Peripheral Laser Iridotomy
  rationale: >-
    The procedure targets the initiating mechanism directly and its anatomical
    effect is not in doubt, which makes it unusually persuasive. A systematic
    review nonetheless concludes that its effectiveness in reducing the
    development or progression of pigmentary glaucoma is unknown. The gap matters
    because mechanistic plausibility is doing the work that evidence normally
    would: the intervention is offered on the strength of the mechanism curated
    in this entry, and if pigment liberation is not in fact rate-limiting for
    conversion, flattening the iris could alter the anatomy without altering the
    outcome.
  proposed_experiments:
  - experiment_id: pds_iridotomy_conversion_trial
    name: Randomised trial of iridotomy with conversion to ocular hypertension as endpoint
    description: >-
      Randomise people with dispersion syndrome and normal pressure to iridotomy
      or observation, with conversion to ocular hypertension and to glaucomatous
      optic neuropathy as endpoints rather than iris configuration or pigment
      score. The anatomical effect is already established; what is missing is
      whether it propagates to the outcome.
differential_diagnoses:
- name: Primary open-angle glaucoma
  description: >-
    The main differential once pressure is raised, and distinguished by the
    anterior segment rather than the disc. Primary open-angle glaucoma lacks the
    dense homogeneous trabecular pigmentation, the Krukenberg spindle, and the
    radial iris transillumination defects, and typically presents later than the
    third to fifth decade.
- name: Pseudoexfoliation syndrome
  description: >-
    The other pigment-associated secondary open-angle glaucoma, and the closest
    mimic on gonioscopy. Distinguished by the fibrillar white exfoliative
    material on the lens capsule and pupil margin, by more irregular and often
    asymmetric angle pigmentation, and by an older population.
- name: Uveitis with pigment release
  description: >-
    Inflammation can liberate pigment and deposit it on the endothelium,
    producing superficial resemblance. Distinguished by the presence of cells and
    flare, by inflammatory rather than pigmented keratic precipitates, and by the
    absence of the iridozonular mechanical geometry.
prevalence:
- population: General population
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1500.0
  notes: >-
    Roughly 1 to 2 per cent, recorded here at the midpoint. The figure should be
    read as the prevalence of the dispersion syndrome, not of pigmentary
    glaucoma, which is substantially rarer. Ascertainment is a real problem: the
    syndrome is largely asymptomatic and is usually found incidentally at slit
    lamp examination, so prevalence tracks how carefully people are examined.
    Prevalence also differs markedly by ancestry, being reported several times
    higher in people of European than of African or Asian descent.
  evidence:
  - reference: PMID:36518550
    reference_title: "Pigment dispersion syndrome: A brief overview."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is more common in myopic patients with a predominance in young males in the third to fifth decade of life that affects about 1-2% of the population."
    explanation: >-
      Gives the population prevalence range from which the recorded rate is
      taken.
  - reference: PMID:36085315
    reference_title: "Pigment dispersion syndrome and pigmentary glaucoma: overview and racial disparities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pigment dispersion syndrome (PDS) and pigmentary glaucoma (PG) are two stages within the same ophthalmic disease spectrum, which are known to be affected by race."
    explanation: >-
      Supports both the two-stage framing used throughout this entry and the
      ancestry dependence recorded in the notes.

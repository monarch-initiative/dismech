name: Retinitis Pigmentosa With or Without Situs Inversus
creation_date: "2026-09-06T19:15:00Z"
category: Mendelian
description: >-
  Retinitis pigmentosa with or without situs inversus (RP66) is an ultra-rare
  autosomal recessive ciliopathy caused by biallelic loss-of-function variants
  in ARL2BP, an effector of the small GTPases ARL2 and ARL3 that localises to
  the basal body and connecting cilium of photoreceptors.

  The disease is an unusually clean natural experiment in how one ciliary gene
  divides into organ-specific consequences. Rod-cone degeneration is present in
  every reported patient, because the photoreceptor outer segment is a modified
  primary cilium whose maintenance depends on continuous ARL2/ARL3-directed
  trafficking. The other manifestations follow the same protein's role in
  motile cilia, and each is variable: situs inversus totalis from failed
  left-right determination at the embryonic node, oligo- and asthenozoospermia
  from sperm flagellar defects, anosmia, and in one patient unilateral renal
  agenesis with microcysts. The disease name carries the variability in it.

  There is no disease-modifying therapy. Management is supportive: low-vision
  rehabilitation, assisted reproduction, and surveillance for the extra-ocular
  features that have been added to the phenotype one case at a time.

progression:
- phase: Symptomatic onset in early adulthood
  age_range: Around 20 years
  notes: >-
    The reported opening symptoms are not the classic ones. In the
    longest-followed case photophobia and episodes of photopsia came first, a
    decade before night blindness.
  evidence:
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "preceded by photophobia and episodes of photopsia already noted ten years before"
    explanation: >-
      Places photophobia and photopsia a decade ahead of night blindness.
- phase: Night blindness, field constriction and diagnosis
  age_range: 30 to 39 years
  notes: >-
    Night blindness and visual field constriction begin around 30 and become
    prominent at 35; molecular diagnosis followed at 32 in this case, and
    driving stopped at 39.
  evidence:
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient reported a history of night blindness (NB) and visual field constriction (VFC) since he was 30 years old, preceded by photophobia and episodes of photopsia already noted ten years before. Diagnosis of arRP was made when he was 32 years old and both NB and VFC became prominent at 35, when light aversion also developed. The patient could no longer drive by the age of 39."
    explanation: >-
      The staged natural history for this phase, including age at diagnosis.
- phase: Advanced retinal degeneration with retained residual vision
  age_range: 49 to 63 years
  notes: >-
    Acuity reaches 20/200 with fields under 10 degrees by 49, yet useful
    residual vision persists into the seventh decade. The slow tail matters
    clinically: it is the window any future therapy would have to act in.
  evidence:
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When he was 49 years old, visual acuity was 20/200 in both eyes with a fundus characterized by attenuated vessels, rare bone spicule-like deposits scattered in mid-periphery and prominent patches of 360° chorioretinal nummular atrophy in far periphery."
    explanation: >-
      Establishes the level of impairment at 49.

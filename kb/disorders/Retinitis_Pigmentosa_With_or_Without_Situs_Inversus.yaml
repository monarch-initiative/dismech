inheritance:
- name: Autosomal Recessive
  description: >-
    Autosomal recessive. Every reported family is consanguineous with a
    homozygous ARL2BP variant.

    Penetrance and expressivity pull apart by organ, which is why they are
    recorded separately here. The retinal disease is present in every reported
    biallelic patient, so penetrance is COMPLETE for the feature that defines
    the disease. The extra-ocular features are not: two sisters carrying a
    homozygous ARL2BP splice variant and affected by rod-cone dystrophy had no
    situs inversus on chest radiography. Recording a single INCOMPLETE value
    would understate the retinal arm and a single COMPLETE value would
    overstate the rest, so the disease-defining feature sets `penetrance` and
    the organ-to-organ variability sets `expressivity`.
  penetrance: COMPLETE
  expressivity: VARIABLE
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we used a combination of homozygosity mapping and exome sequencing to identify mutations in ARL2BP, which encodes an effector protein of the small GTPases ARL2 and ARL3, as causative for autosomal-recessive RP (RP66)."
    explanation: >-
      States the inheritance mode, the gene, and the RP66 designation this
      entry uses as a synonym.
  - reference: PMID:36507858
    reference_title: "Novel homozygous variant in ARL2BP associated with retinitis pigmentosa, situs inversus, and male infertility in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a Chinese patient from a consanguineous family carrying a novel homozygous variant c.22_23delAG (p.S8Lfs*10) in ARL2BP, presenting with retinitis pigmentosa (RP), situs inversus totalis, and oligozoospermia"
    explanation: >-
      An independent consanguineous family with a homozygous variant,
      consistent with recessive inheritance.
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, chest radiographs did not show situs inversus but one of them, at the age of 36, had 20/200 BCVA in the RE and counting fingers in the LE with a visual field inferior to 10 degrees while her 27 years old sister, showed 20/25 BCVA in both eyes and visual field less than 30 degrees."
    explanation: >-
      Two biallelic patients with the retinal disease and no situs inversus,
      which is the evidence for `expressivity: VARIABLE` rather than for
      incomplete penetrance of the disease itself.
pathophysiology:
- name: Biallelic ARL2BP Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Reported alleles are homozygous and heterogeneous in class: a splice
    acceptor variant that alters pre-mRNA splicing demonstrably in blood RNA, a
    frameshift, and a missense substitution (p.Met45Arg) that reduces ARL2
    binding. All converge on loss of ARL2BP function at the ciliary base.
  genetic_context:
    gene:
      preferred_term: ARL2BP
      term:
        id: hgnc:17146
        label: ARL2BP
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family affected by RP and situs inversus, a homozygous, splice-acceptor mutation, c.101-1G>C, which alters pre-mRNA splicing of ARLBP2 in blood RNA, was identified."
    explanation: >-
      The founding splice allele, with its effect demonstrated at the RNA level
      rather than predicted. The source contains a transposition, "ARLBP2" for
      ARL2BP, reproduced here rather than corrected.
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This hypothesis is supported by the finding that the p.Met45Arg amino acid substitution reduced binding to ARL2 and caused the loss of ARL2BP localization at the basal body in ciliated nasal epithelial cells."
    explanation: >-
      Shows the missense allele acts by losing ARL2 binding and basal-body
      localisation, which is the functional definition of loss of function
      here.
  downstream:
  - target: Loss of ARL2BP from the Photoreceptor Basal Body and Connecting Cilium
    description: >-
      ARL2 anchors ARL2BP at the ciliary base; without binding, ARL2BP is not
      recruited.
- name: Loss of ARL2BP from the Photoreceptor Basal Body and Connecting Cilium
  biological_scale: MOLECULAR
  description: >-
    ARL2BP normally localises to the basal body, the cilium-associated
    centriole and the periciliary extension of the photoreceptor inner segment.
    ARL2, not ARL3, is what recruits or anchors it there: depleting ARL2
    displaces ARL2BP from the basal body while depleting ARL3 does not. That
    asymmetry is the reason this node names ARL2 specifically.
  cell_types:
  - preferred_term: Photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  - preferred_term: Retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In the mouse retina, ARL2BP localized to the basal body and cilium-associated centriole of photoreceptors and the periciliary extension of the inner segment."
    explanation: >-
      Establishes the normal localisation this node describes losing. Indirect
      because the localisation was mapped in mouse retina.
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, depletion of ARL2, but not ARL3, caused displacement of ARL2BP from the basal body, suggesting that ARL2 is vital for recruiting or anchoring ARL2BP at the base of the cilium."
    explanation: >-
      The experiment that distinguishes ARL2 from ARL3 as the anchoring
      partner, quoted with the authors' "suggesting".
  downstream:
  - target: Defective Ciliary Axoneme and Doublet Microtubule Assembly
    description: >-
      ARL2BP at the ciliary base is required for normal axoneme structure and
      elongation.
- name: Defective Ciliary Axoneme and Doublet Microtubule Assembly
  biological_scale: CELLULAR
  description: >-
    The structural lesion. Depleting ARL2BP shortens cilia. In the knockout
    mouse retina, photoreceptor axonemes are shortened and the ciliary doublet
    microtubules are malformed, with open B-tubules and loss of the singlet
    microtubules. This is a defect in building the ciliary skeleton, not merely
    in cargo delivery along it.
  biological_processes:
  - preferred_term: axoneme assembly
    term:
      id: GO:0035082
      label: axoneme assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depletion of ARL2BP caused cilia shortening."
    explanation: >-
      The simplest direct demonstration that ARL2BP is needed to build a
      normal-length cilium.
  - reference: PMID:29718757
    reference_title: "ARL2BP, a protein linked to retinitis pigmentosa, is needed for normal photoreceptor cilia doublets and outer segment structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, ciliary doublet microtubule (MT) structure was also impaired, displaying open B-tubule doublets, paired with loss of singlet MTs."
    explanation: >-
      The specific ultrastructural lesion in the axoneme, from the knockout
      mouse.
  - reference: PMID:29718757
    reference_title: "ARL2BP, a protein linked to retinitis pigmentosa, is needed for normal photoreceptor cilia doublets and outer segment structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "On the basis of results from this study, we conclude that ARL2BP is necessary for photoreceptor ciliary doublet formation and axoneme elongation, which is required for OS morphogenesis and vision."
    explanation: >-
      The authors' conclusion, which is exactly the causal claim this node and
      its downstream edge make.
  downstream:
  - target: Photoreceptor Outer Segment Disorganization
    description: >-
      A shortened, malformed axoneme cannot template a normal outer segment.
  - target: Motile Cilia and Flagellar Dysfunction
    description: >-
      The same axonemal requirement applies to motile cilia at the embryonic
      node and to the sperm flagellum.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Photoreceptor Outer Segment Disorganization
  biological_scale: CELLULAR
  description: >-
    Outer segment disks are vertically aligned rather than stacked normally,
    and this is present before any photoreceptor is lost. Structure fails
    first; degeneration follows.
  cell_types:
  - preferred_term: Retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:29718757
    reference_title: "ARL2BP, a protein linked to retinitis pigmentosa, is needed for normal photoreceptor cilia doublets and outer segment structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Before photoreceptor degeneration, we observed disorganization of the photoreceptor OS, with vertically aligned disks and shortened axonemes."
    explanation: >-
      Establishes both the lesion and, importantly, that it precedes cell loss,
      which is what orders this node before the degeneration node.
  downstream:
  - target: Progressive Rod and Cone Photoreceptor Degeneration
    description: >-
      A photoreceptor that cannot maintain its outer segment does not survive.
- name: Progressive Rod and Cone Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    Progressive loss of rods and then cones, producing the classic retinitis
    pigmentosa sequence of night blindness, peripheral field loss and finally
    central acuity loss. Progression can be slow: one patient retained useful
    residual vision at 63.
  cell_types:
  - preferred_term: Photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinitis pigmentosa (RP) is a genetically heterogeneous retinal degeneration characterized by photoreceptor death, which results in visual failure."
    explanation: >-
      Defines the degeneration process this node records.
  - reference: PMID:29718757
    reference_title: "ARL2BP, a protein linked to retinitis pigmentosa, is needed for normal photoreceptor cilia doublets and outer segment structure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The KO mice display an early and progressive reduction in visual response."
    explanation: >-
      The functional correlate of the degeneration in the knockout model.
  downstream:
  - target: Rod-cone dystrophy
  - target: Nyctalopia
  - target: Abnormal electroretinogram
  - target: Photophobia
- name: Motile Cilia and Flagellar Dysfunction
  biological_scale: CELLULAR
  description: >-
    The extra-ocular arm. The same axonemal requirement applies to the motile
    cilia of the embryonic node, which establish left-right asymmetry, and to
    the sperm flagellum. Unlike the retinal arm, these features are variable
    between patients, which is what the disease name records.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36507858
    reference_title: "Novel homozygous variant in ARL2BP associated with retinitis pigmentosa, situs inversus, and male infertility in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Situs inversus and male infertility have never been reported in the same patient with ARL2BP variants; therefore, this a novel ARL2BP-associated phenotypic triad of RP, situs inversus, and male infertility."
    explanation: >-
      Establishes that the motile-cilia manifestations co-occur in a single
      patient, which is what licenses treating them as one mechanistic arm
      rather than separate associations.
  - reference: PMID:36507858
    reference_title: "Novel homozygous variant in ARL2BP associated with retinitis pigmentosa, situs inversus, and male infertility in a Chinese patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found reduced patient-derived fibroblast proliferation and ciliary length."
    explanation: >-
      Shortened cilia in the patient's own cells, linking the human phenotype
      to the ciliary lesion.
  downstream:
  - target: Situs inversus totalis
  - target: Oligozoospermia
  - target: Abnormal sperm motility
  - target: Anosmia

genetic:
- name: ARL2BP
  gene_term:
    preferred_term: ARL2BP
    term:
      id: hgnc:17146
      label: ARL2BP
  relationship_type: CAUSATIVE
  notes: >-
    ARL2BP is an effector of ARL2 and ARL3. Functionally it is ARL2 that
    anchors it at the ciliary base: ARL3 depletion does not displace it. That
    matters when reading the wider ARL2/ARL3 photoreceptor-trafficking
    literature, much of which concerns ARL3 and its GAP RP2 in a different
    disease.
  evidence:
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we used a combination of homozygosity mapping and exome sequencing to identify mutations in ARL2BP, which encodes an effector protein of the small GTPases ARL2 and ARL3, as causative for autosomal-recessive RP (RP66)."
    explanation: >-
      Establishes the gene-disease relationship and ARL2BP's role as an
      ARL2/ARL3 effector.
  - reference: PMID:23849777
    reference_title: "Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause autosomal-recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data demonstrate a role for ARL2BP and ARL2 in primary cilia function and that this role is essential for normal photoreceptor maintenance and function."
    explanation: >-
      Supports the notes claim that the functional partner is ARL2.

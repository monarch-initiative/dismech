animal_models:
- name: Arl2bp knockout mouse
  species: Mouse
  genotype: Arl2bp knockout, homozygous
  publication: PMID:29718757
  description: >-
    Constitutive Arl2bp knockout generated specifically to ask how a ciliary
    protein contributes to outer segment formation. It gives the structural
    detail that human tissue cannot: axoneme length, disk orientation, and
    doublet microtubule architecture.
  modeled_mechanisms:
  - target: Defective Ciliary Axoneme and Doublet Microtubule Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The model is where the axonemal and doublet-microtubule lesion was
      characterised at all; the human evidence for this node is limited to
      shortened cilia in cultured cells.
    limitations: >-
      A constitutive knockout, whereas the reported human alleles include a
      missense substitution that reduces rather than abolishes ARL2 binding, so
      the mouse likely models the severe end of the allelic spectrum. The mouse
      is also not reported here to show situs inversus or infertility, so it
      speaks only to the retinal arm.
    readouts:
    - name: Photoreceptor axoneme length and doublet microtubule architecture
      target: Defective Ciliary Axoneme and Doublet Microtubule Assembly

- name: Motile Cilia and Flagellar Dysfunction
  biological_scale: ORGANISM
  description: >-
    The extra-ocular arm. The same axonemal requirement applies to the motile
    cilia of the embryonic node, which establish left-right asymmetry, and to
    the sperm flagellum. Unlike the retinal arm, these features are variable
    between patients, which is what the disease name records.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36507858
    reference_title: "Novel homozygous variant in ARL2BP associated with retinitis pigmentosa, situs inversus, and male infertility in a Chinese patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Situs inversus and male infertility have never been reported in the same patient with ARL2BP variants; therefore, this a novel ARL2BP-associated phenotypic triad of RP, situs inversus, and male infertility."
    explanation: >-
      Establishes that the motile-cilia manifestations co-occur in a single
      patient, which is what licenses treating them as one mechanistic arm
      rather than separate associations.
  - reference: PMID:36507858

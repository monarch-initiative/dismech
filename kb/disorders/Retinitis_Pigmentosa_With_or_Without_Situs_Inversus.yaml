diagnosis:
- name: Ophthalmic phenotyping with next-generation sequencing
  description: >-
    Retinal phenotyping (electroretinography, full-field stimulus threshold,
    multimodal imaging) establishes the dystrophy; sequencing establishes the
    gene. The extra-ocular features are what should prompt looking at ARL2BP
    specifically rather than a generic RP panel result: a patient with RP plus
    situs inversus is a very short differential.
  evidence:
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reported symptoms together with full-field stimulus threshold testing, electroretinogram and advanced multimodal imaging allowed us to recognize the typical characteristics of a mixed retinal dystrophy."
    explanation: >-
      Names the phenotyping modalities that establish the retinal diagnosis.
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified a likely pathogenic homozygous variant (c.294-1G > C) involving the splicing acceptor site of intron 4."
    explanation: >-
      The molecular confirmation step, in a real diagnostic sequence.
differential_diagnoses:
- name: Senior-Loken, Bardet-Biedl and Joubert syndromes
  description: >-
    All are ciliopathies combining retinal dystrophy with renal disease, and
    the renal cysts reported in one ARL2BP patient put them directly in the
    frame. The authors who reported that patient say so explicitly.
  evidence:
  - reference: PMID:38649918
    reference_title: "A novel homozygous splice site variant in ARL2BP causes a syndromic autosomal recessive rod-cone dystrophy with situs inversus, asthenozoospermia, unilateral renal agenesis and microcysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of renal cysts warrants consideration of a differential diagnosis, particularly with Senior-Loken (SLS), Bardet-Biedl (BBS) and Joubert syndromes (JS) but also with Short Rib Thoracic Dysplasia 9, highlighting the need for careful phenotypic evaluation in these cases."
    explanation: >-
      Names this differential and its trigger.
- name: Primary ciliary dyskinesia
  description: >-
    Shares situs inversus and male infertility from motile ciliary dysfunction.
    Retinal degeneration is not a feature of PCD, so the retinal arm separates
    them.
- name: Non-syndromic autosomal recessive retinitis pigmentosa
  description: >-
    RP66 will look non-syndromic in any patient without situs inversus, which
    is roughly what "with or without situs inversus" means. Separating them
    requires asking about laterality, fertility and renal anatomy, none of
    which an ophthalmic workup covers.
discussions:
- discussion_id: rp66_incomplete_penetrance_of_the_motile_cilia_arm
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Motile Cilia and Flagellar Dysfunction
  - phenotypes#Situs inversus totalis
  prompt: >-
    Why is the retinal arm obligate while the motile-cilia arm is variable, if
    both follow from the same axonemal defect?
  rationale: >-
    Every reported ARL2BP patient has retinal degeneration; only some have
    situs inversus, and the disease name records that. If one protein is
    required for both primary and motile ciliary axonemes, the difference needs
    an explanation. Candidates include allele severity, the stochastic nature
    of nodal flow (where partial function gives randomised rather than reversed
    situs, so half of affected embryos would look normal), and redundancy in
    motile-cilia axoneme assembly that photoreceptors lack. None has been
    tested: no ARL2BP genotype-laterality correlation has been reported, and
    situs has not been scored in the knockout mouse in the source used here.
    The entry therefore models one shared upstream node branching into two
    arms, without asserting a reason for the asymmetry.
  proposed_experiments:
  - experiment_id: rp66_nodal_cilia_in_arl2bp_ko
    name: Nodal ciliary motility and laterality scoring in Arl2bp knockout embryos
    description: >-
      Score situs and nodal ciliary beat in a cohort of Arl2bp knockout
      embryos, to test whether laterality is randomised (stochastic nodal
      failure) or consistently reversed.
    readouts:
    - name: Proportion of embryos with reversed situs
      target: pathophysiology#Motile Cilia and Flagellar Dysfunction
      direction: ALTERED
      interpretation: >-
        Approximately half reversed would support stochastic nodal failure and
        explain the human variability without invoking allele severity.
- discussion_id: rp66_phenotype_expanding_one_case_at_a_time
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Unilateral renal agenesis
  - phenotypes#Renal cyst
  - phenotypes#Anosmia
  prompt: >-
    Are the renal, olfactory and cryptorchidism findings features of RP66, or
    coincidences in consanguineous pedigrees?
  rationale: >-
    Renal agenesis, renal microcysts, cryptorchidism and anosmia each rest on a
    single patient, and every reported family is consanguineous, which is
    exactly the setting in which a second recessive condition can segregate
    unnoticed. The reporting authors are appropriately careful, describing
    these as expanding the manifestations rather than as established features,
    and one writes only that the patient "likely had olfactory dysfunction
    susceptibility". They are curated because a ciliopathy mechanism makes them
    plausible and because omitting them would hide real observations, but each
    is a single case and the entry does not assert a frequency for any of them.
notes: >-
  On the deep-research report. An openscientist report was generated and used
  as leads. `just preflight-dr` returned WARN on two counts, both of which
  changed what was curated.

  First, ARL2 is mentioned 19 times against 61 for ARL2BP. Much of the
  ARL2/ARL3 photoreceptor-trafficking literature the report draws on concerns a
  different disease: PMID:25422369, which the report cites, is about RP2 and
  X-linked retinitis pigmentosa 2, not this disorder. It is not cited here and
  not committed.

  Second, the report gives the OMIM identifier as 615407, while MONDO:0014186
  xrefs OMIM 615434. 615407 is the ARL2BP *gene* MIM number; 615434 is the RP66
  *phenotype* MIM. This entry carries no OMIM `external_assertions` entry
  rather than record a number taken from a source that confused the two.

  Every PMID used from the report was verified against PubMed before citation.

  On two source typographies reproduced rather than corrected. PMID:23849777
  writes "ARLBP2" for ARL2BP in the abstract sentence quoted on the
  loss-of-function node. Snippets are exact quotes, so it stands, and the
  explanation says so.

  Not curated, and why. No `treatments:` - no disease-modifying therapy exists
  for this disorder, and the supportive measures the report lists (low-vision
  rehabilitation, assisted reproduction) are generic to retinal dystrophy and
  male infertility rather than evidenced for RP66, so asserting them here with
  a citation that does not mention this disease would be worse than omitting
  them. No `datasets:` or `clinical_trials:` - no verified accession or
  registration. No `environmental:` - no exposure implicated. `directness` is
  set on three items only, where it was actually assessed.

has_subtypes:
- name: Spastic
  display_name: Spastic cerebral palsy
  subtype_term:
    preferred_term: spastic cerebral palsy
    term:
      id: MONDO:0000396
      label: spastic cerebral palsy
  description: >-
    Most common form (~80% of cases), characterized by increased muscle tone
    (hypertonia/spasticity) from upper motor neuron / corticospinal tract
    injury. Topographically subdivided into spastic diplegia (legs > arms,
    classically associated with periventricular leukomalacia of prematurity),
    spastic hemiplegia (unilateral, often perinatal arterial ischemic stroke),
    and spastic quadriplegia (all four limbs, the most severe form).
- name: Dyskinetic
  display_name: Dyskinetic cerebral palsy
  subtype_term:
    preferred_term: dyskinetic cerebral palsy
    term:
      id: MONDO:0022697
      label: athetoid cerebral palsy
  description: >-
    Characterized by involuntary movements (dystonia, choreoathetosis) from
    injury to the basal ganglia and thalamus, classically caused by acute
    profound perinatal asphyxia or bilirubin encephalopathy (kernicterus).
    (MONDO has no distinct "dyskinetic cerebral palsy" class; athetoid
    cerebral palsy is the closest available term.)
- name: Ataxic
  display_name: Ataxic cerebral palsy
  subtype_term:
    preferred_term: ataxic cerebral palsy
    term:
      id: MONDO:0000397
      label: ataxic cerebral palsy
  description: >-
    Least common form, characterized by impaired balance and coordination from
    cerebellar dysfunction.
- name: Mixed
  display_name: Mixed cerebral palsy
  subtype_term:
    preferred_term: mixed cerebral palsy
    term:
      id: MONDO:0000400
      label: mixed cerebral palsy
  description: >-
    Combination of motor patterns (most often spastic-dyskinetic) reflecting
    injury to multiple motor systems.
pathophysiology:
- name: Non-Progressive Developing-Brain Injury
  description: >-
    Cerebral palsy results from a static (non-progressive) disturbance or lesion
    of the developing fetal or infant brain. Although the underlying brain lesion
    is fixed, its clinical expression evolves as the child grows. The injury is
    heterogeneous in timing and mechanism (antenatal, perinatal, or early
    postnatal) and defines the motor phenotype.
  biological_scale: ORGANISM
  downstream:
  - target: Periventricular White Matter Injury
    causal_link_type: DIRECT
    description: In preterm infants the developing-brain insult manifests predominantly as periventricular white matter injury.
  - target: Hypoxic-Ischemic Encephalopathy
    causal_link_type: DIRECT
    description: In term infants an acute hypoxic-ischemic insult produces the encephalopathy underlying CP.
  - target: Perinatal Neuroinflammation
    causal_link_type: DIRECT
    description: Intrauterine infection/inflammation is an independent injury pathway contributing to the developing-brain lesion.
  evidence:
  - reference: PMID:32989326
    reference_title: "Mutations disrupting neuritogenesis genes confer risk for cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CP was thus defined as a non-progressive developmental disorder of movement and/or posture impairing motor function."
    explanation: States the operational non-progressive, movement/posture definition of cerebral palsy.
  - reference: PMID:32989326
    reference_title: "Mutations disrupting neuritogenesis genes confer risk for cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This operational definition thus excluded progressive neurological disorders such as neurodegenerative diseases."
    explanation: Reinforces that CP is defined by a static (non-progressive) lesion, distinguishing it from neurodegeneration.
  - reference: PMID:17370477
    reference_title: "A report: the definition and classification of cerebral palsy April 2006."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "at the workshop, it was agreed that the concept 'cerebral palsy' should be retained"
    explanation: International consensus workshop that produced the retained definition and classification of CP.
- name: Periventricular White Matter Injury
  description: >-
    In preterm infants, hypoxia-ischemia and inflammation injure the
    periventricular white matter (periventricular leukomalacia). Pre-myelinating
    oligodendrocyte precursor cells are selectively vulnerable to glutamate
    excitotoxicity, free-radical (oxidative/nitrative) attack, and cytokine
    injury, producing focal necrosis and diffuse hypomyelination of the white
    matter tracts carrying descending motor fibers to the legs — the substrate
    of spastic diplegia.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: pre-myelinating oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
    modifier: DECREASED
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  locations:
  - preferred_term: periventricular white matter
    term:
      id: UBERON:0002316
      label: white matter
  downstream:
  - target: Corticospinal Tract Disruption
    causal_link_type: DIRECT
    description: Injury to periventricular white matter damages the descending corticospinal motor fibers carrying descending motor output to the legs.
  evidence:
  - reference: PMID:19081519
    reference_title: "Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This type of brain injury is generally thought to consist primarily of periventricular leukomalacia (PVL), a distinctive form of cerebral white matter injury."
    explanation: Identifies periventricular leukomalacia (white matter injury) as the primary brain injury of prematurity underlying spastic CP.
  - reference: PMID:19081519
    reference_title: "Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PVL is frequently accompanied by neuronal/axonal disease, affecting the cerebral white matter, thalamus, basal ganglia, cerebral cortex, brain stem, and cerebellum."
    explanation: Describes the encephalopathy of prematurity — PVL plus neuronal/axonal injury — that produces the CP motor phenotype.
- name: Hypoxic-Ischemic Encephalopathy
  description: >-
    In term infants, an acute perinatal hypoxic-ischemic insult causes energy
    failure, glutamate excitotoxicity, and a delayed phase of oxidative stress,
    mitochondrial dysfunction, and apoptotic/necrotic neuronal death.
    Depending on severity and duration, injury targets the cerebral cortex,
    watershed white matter, and — in acute profound asphyxia — the deep grey
    nuclei (basal ganglia and thalamus).
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
    modifier: DECREASED
  biological_processes:
  - preferred_term: response to hypoxia
    term:
      id: GO:0001666
      label: response to hypoxia
    modifier: INCREASED
  - preferred_term: glutamate excitotoxicity
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
    modifier: INCREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Basal Ganglia and Thalamic Injury
    causal_link_type: DIRECT
    description: Acute profound asphyxia preferentially injures the metabolically active deep grey nuclei, producing the dyskinetic phenotype.
  evidence:
  - reference: PMID:32112349
    reference_title: "Pathophysiology of hypoxic-ischemic encephalopathy: a review of the past and a view on the future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIE pathophysiology involves oxidative stress, mitochondrial energy production failure, glutaminergic excitotoxicity, and apoptosis."
    explanation: Review of neonatal HIE pathophysiology confirming energy failure, excitotoxicity, oxidative stress, and apoptosis as the injury cascade.
  notes: >-
    The glutamate excitotoxicity process is annotated with the generic GO term
    "glutamate receptor signaling pathway" (GO:0007215); the pathological claim
    here is excessive/overactivated signaling (captured by the INCREASED
    modifier), as GO has no dedicated excitotoxicity term.
- name: Perinatal Neuroinflammation
  description: >-
    Intrauterine infection/inflammation (chorioamnionitis) and the fetal
    inflammatory response syndrome sensitize the developing brain.
    Pro-inflammatory cytokines and activated microglia amplify white matter and
    neuronal injury and are an independent pathway to cerebral palsy,
    synergizing with hypoxia-ischemia.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
    modifier: INCREASED
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
    modifier: INCREASED
  downstream:
  - target: Periventricular White Matter Injury
    causal_link_type: DIRECT
    description: Pro-inflammatory cytokines and activated microglia sensitize and injure the vulnerable pre-myelinating oligodendrocytes of the periventricular white matter, amplifying cystic PVL.
  - target: Hypoxic-Ischemic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Fetal inflammation synergizes with and lowers the threshold for hypoxic-ischemic neuronal injury.
  evidence:
  - reference: PMID:10989405
    reference_title: "Chorioamnionitis as a risk factor for cerebral palsy: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical chorioamnionitis was significantly associated with both cerebral palsy (RR, 1.9; 95% CI, 1.4-2.5) and cPVL (RR, 3.0; 95% CI, 2.2-4.0) in preterm infants."
    explanation: Meta-analysis establishing chorioamnionitis (intrauterine inflammation) as a significant risk factor for CP and cystic PVL, supporting the inflammatory pathway.
- name: Basal Ganglia and Thalamic Injury
  description: >-
    Injury to the basal ganglia and thalamus — from acute profound perinatal
    asphyxia or bilirubin encephalopathy — disrupts motor control circuits and
    produces the involuntary movements (dystonia, choreoathetosis) of
    dyskinetic cerebral palsy.
  biological_scale: TISSUE
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:19081519
    reference_title: "Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PVL is frequently accompanied by neuronal/axonal disease, affecting the cerebral white matter, thalamus, basal ganglia, cerebral cortex, brain stem, and cerebellum."
    explanation: Documents thalamic and basal ganglia neuronal injury as part of the encephalopathy underlying cerebral palsy.
- name: Bilirubin Encephalopathy (Kernicterus)
  description: >-
    Severe unconjugated hyperbilirubinemia in the neonate allows lipophilic
    bilirubin to cross the blood-brain barrier and deposit selectively in the
    globus pallidus, subthalamic nucleus, and other deep grey structures,
    causing neurotoxic injury that manifests as dyskinetic (choreoathetoid)
    cerebral palsy, often with auditory neuropathy and gaze abnormalities.
  biological_scale: TISSUE
  locations:
  - preferred_term: basal ganglia
    term:
      id: UBERON:0002420
      label: basal ganglion
  downstream:
  - target: Basal Ganglia and Thalamic Injury
    causal_link_type: DIRECT
    description: Bilirubin deposits selectively in the globus pallidus and subthalamic nucleus, injuring the basal ganglia and producing dyskinetic CP.
  evidence:
  - reference: PMID:15578034
    reference_title: "Definition of the clinical spectrum of kernicterus and bilirubin-induced neurologic dysfunction (BIND)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "traditional and evolving definitions ranging from classical kernicterus with athetoid cerebral palsy, impaired upward gaze and deafness"
    explanation: Defines classical kernicterus (bilirubin encephalopathy) as producing athetoid (dyskinetic) cerebral palsy with impaired upgaze and deafness.
  notes: >-
    Modeled as a distinct postnatal etiologic root (no upstream edge from the
    developing-brain-injury node) because bilirubin encephalopathy is a
    metabolic/toxic insult mechanistically independent of the antenatal and
    intrapartum injury pathways; it converges downstream on basal ganglia and
    thalamic injury.
- name: Corticospinal Tract Disruption
  description: >-
    Damage to the corticospinal (pyramidal) motor pathways is the anatomic
    lesion underlying spastic cerebral palsy, removing descending motor output
    and inhibitory control over the spinal motor apparatus.
  biological_scale: TISSUE
  locations:
  - preferred_term: corticospinal tract
    term:
      id: UBERON:0002707
      label: corticospinal tract
  downstream:
  - target: Upper Motor Neuron Syndrome
    causal_link_type: DIRECT
    description: Loss of descending corticospinal control disinhibits the spinal motor apparatus, producing the clinical upper motor neuron syndrome.
- name: Upper Motor Neuron Syndrome
  description: >-
    Loss of descending corticospinal control produces the clinical upper motor
    neuron syndrome: velocity-dependent hypertonia (spasticity), hyperreflexia,
    and extensor plantar responses. This is the direct clinical substrate of the
    spastic motor phenotype.
  biological_scale: ORGANISM
  downstream:
  - target: Secondary Musculoskeletal Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic spasticity acting on the growing skeleton drives progressive contractures, hip displacement, and neuromuscular scoliosis.
  evidence:
  - reference: PMID:32989326
    reference_title: "Mutations disrupting neuritogenesis genes confer risk for cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Movement disorder (spasticity, dystonia, choreoathetosis and/or ataxia) onset occurs within the first few years of life as a manifestation of disrupted brain development"
    explanation: Identifies spasticity — the cardinal upper motor neuron feature — as an early clinical manifestation of the developing-brain lesion.
- name: Secondary Musculoskeletal Pathology
  description: >-
    Chronic spasticity and abnormal muscle tone acting on a growing skeleton
    lead to progressive secondary musculoskeletal deformities: muscle-tendon
    contractures, hip subluxation/dislocation, and neuromuscular scoliosis.
    These are secondary consequences of the fixed brain lesion, not progression
    of the lesion itself.
  biological_scale: ORGANISM

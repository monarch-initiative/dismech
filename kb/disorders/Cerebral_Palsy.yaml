  influences_mechanisms:
  - target: Perinatal Neuroinflammation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Maternal intrauterine infection can initiate inflammation relevant to premature brain injury.
    evidence:
    - reference: PMID:19081519
      reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'

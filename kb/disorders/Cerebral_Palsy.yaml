- name: Preterm fetal sheep cerebral ischemia
  species: Sheep
  publication: PMID:30149778
  description: >-
    Mid-gestation fetal sheep cerebral ischemia models premature white-matter injury and subsequent oligodendrocyte
    maturation failure.
  notes: >-
    Developmental stage and insult severity determine injury distribution. This model informs a proximal injury
    mechanism rather than reproducing the heterogeneous clinical CP syndrome. Intrauterine recovery differs from
    the human neonatal transition.
  modeled_mechanisms:
  - target: Oligodendrocyte Maturation Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Progenitor proliferation without maturation after fetal cerebral ischemia models the maturation-failure component
      of premature white-matter injury.
    limitations: >-
      Developmental stage and ischemic severity constrain extrapolation to human CP; the model does not reproduce
      the full clinical syndrome.
    evidence:
    - reference: PMID:30149778
      reference_title: 'Perinatal hypoxic-ischemic brain injury in large animal models: Relevance to human neonatal encephalopathy.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        late progenitors proliferate but fail to mature into myelin producing oligodendrocytes after cerebral ischemia.
      explanation: >-
        The full-text fetal-sheep section reports maturation failure after ischemia.
discussions:
- discussion_id: xcx_hypoxia_translation_to_cerebral_palsy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Can hypoxic injury in the xenocortication platform model the persistent motor dysfunction of cerebral palsy?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Non-Progressive Developing-Brain Disturbance
  rationale: >-
    The paper introduces a human cortical development and circuit platform and demonstrates
    hypoxic injury as an application. Its cerebral-palsy connection is prospective. The demonstrated
    cellular responses and short-term mouse gait changes do not establish the persistent human
    motor syndrome, the full hypoxic-ischemic injury cascade, or a causal chain from HIF1α
    through gliosis to impaired gait. Immature cortical organization, mixed human and mouse
    cellular contributions, and unresolved graft-specific behavioural causality constrain
    translation. Longitudinal motor assessment and graft-specific perturbations would be needed
    to assess that connection.
  evidence:
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      For example, XCX mice display gait deficits following hypoxic injury, highlighting the
      potential for modelling perinatal hypoxia and associated cerebral palsy49 as well as
      human neurodevelopmental disorders more broadly.
    explanation: >-
      The authors explicitly frame perinatal hypoxia and associated cerebral palsy as potential
      applications, supporting inclusion as a prospective connection.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The observed behavioural outputs probably reflect interactions between the human graft
      and preserved mouse subcortical circuits, but whether graft-derived neurons are necessary
      or sufficient for specific behaviours remains unclear.
    explanation: The authors leave graft-neuron necessity and sufficiency for behaviour unresolved.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At the timepoints examined, the XCX graft lacked several features of mature cortical
      circuitry, including complete areal patterning, a well-defined laminar cortical plate,
      full representation of GABAergic interneurons and a mature transcriptional profile.
    explanation: Documents incomplete areal patterning, lamination, interneuron representation and transcriptional maturity.
- discussion_id: ctnnb1_clinical_umbrella_relationship
  kind: OPEN_QUESTION
  status: OPEN
  prompt: How should CTNNB1 causation be represented on the clinical CP umbrella alongside CTNNB1-related neurodevelopmental disorder?
  attaches_to:
  - genetic#CTNNB1
  rationale: >-
    Primary CP-ascertained evidence supports recurrent damaging CTNNB1 variants, whereas the larger CTNNB1 phenotype
    comparison does not identify a separate CP subgroup. The unresolved question is how to distinguish causation
    of the molecular disorder from its representation under a clinical motor-syndrome umbrella. See issue #11823.
  evidence:
  - reference: PMID:32989326
    reference_title: Mutations disrupting neuritogenesis genes confer risk for cerebral palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CTNNB1, encoding β-catenin, harbors three LoF DNMs
    explanation: >-
      Primary results identify loss-of-function de novo variants in CP-ascertained individuals.
  - reference: PMID:36083290
    reference_title: Genomic and phenotypic characterization of 404 individuals with neurodevelopmental disorders caused by CTNNB1 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, individuals with P/LP CTNNB1 variants were similarly affected irrespective of their CP diagnosis.
    explanation: >-
      The later phenotype comparison does not support CP as a separate CTNNB1 molecular subgroup.
notes: >-
  Cerebral palsy is a clinical umbrella for permanent disorders of movement and posture attributed to non-progressive
  disturbances in the developing brain. Etiologies include acquired injury and genetic developmental disorders.
  A progressive neurodegenerative disorder requires reconsideration of the CP diagnosis; a genetic finding alone
  does not. Functional domains are assessed separately, including GMFCS for gross motor function, MACS for manual
  ability, CFCS for communication and EDACS for eating and drinking. Secondary complications and functional needs
  can evolve despite the non-progressive underlying disturbance.
diagnosis:
- name: Clinical assessment with age-appropriate standardized tools
  description: >-
    Diagnosis integrates the movement and posture phenotype, developmental history, neurological examination and
    exclusion of a progressive disorder. Before five months corrected age, General Movements Assessment, HINE and
    MRI are complementary tools. A high-risk designation can support early intervention while diagnostic certainty
    develops.
  evidence:
  - reference: PMID:28715518
    reference_title: 'Early, Accurate Diagnosis and Early Intervention in Cerebral Palsy: Advances in Diagnosis and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a combination of assessments with strong predictive validity coupled with clinical reasoning is recommended.
    explanation: >-
      Supports combined assessment rather than a single diagnostic test.
- name: Brain MRI
  description: >-
    MRI helps identify white-matter injury, deep gray-matter lesions, stroke or maldevelopment. Normal neuroimaging
    does not exclude clinical CP.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:28715518
    reference_title: 'Early, Accurate Diagnosis and Early Intervention in Cerebral Palsy: Advances in Diagnosis and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 10% have normal neuroimaging
    explanation: >-
      A normal scan cannot rule out the clinical syndrome.
- name: Etiologic genomic assessment
  description: >-
    Genomic testing can identify a molecular etiology and refine counseling. A pathogenic result and a clinical
    CP diagnosis can coexist when the phenotype meets CP criteria; progressive disorders require diagnostic reconsideration.
    Variants of uncertain significance do not establish an etiology.
  diagnosis_term:
    preferred_term: etiologic genomic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38553553
    reference_title: Comprehensive whole-genome sequence analyses provide insights into the genomic architecture of cerebral palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We classified 37 of 327 (11.3%) children as having pathogenic/likely pathogenic (P/LP) variants
    explanation: >-
      The 327-trio whole-genome study supports a genetic diagnostic yield in a subset, not a universal genetic cause.
progression:
- phase: Evolving motor phenotype
  notes: >-
    The underlying disturbance is non-progressive, but motor type and functional severity can change during early
    development. Early severity predictions require caution.
  evidence:
  - reference: PMID:28715518
    reference_title: 'Early, Accurate Diagnosis and Early Intervention in Cerebral Palsy: Advances in Diagnosis and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The motor types and topography of cerebral palsy may emerge and change during the first 2 years of life.
    explanation: >-
      Distinguishes evolution of the clinical phenotype from progressive neurodegeneration.
- phase: Secondary musculoskeletal complications
  notes: >-
    Contractures and hip displacement may progress during growth and require ongoing surveillance and individualized
    management.
  evidence:
  - reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contracture is a common complication, particularly for children with spastic cerebral palsy.
    explanation: >-
      Supports contracture as an evolving complication.
  - reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One in three children in high-income countries experience progressive hip displacement as a complication of
      their cerebral palsy
    explanation: >-
      Supports progressive secondary hip pathology in the populations discussed.

environmental:
- name: Preterm birth and low birth weight
  influences_mechanisms:
  - target: Periventricular White Matter Injury
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Prematurity is not a generic risk factor here: the immature
      periventricular white matter is selectively vulnerable to ischaemia
      because pre-myelinating oligodendrocytes are at their most sensitive and
      the vascular watershed sits there. That is why this exposure produces a
      characteristic lesion rather than diffuse injury.
    evidence:
    - reference: PMID:23346889
      reference_title: "An update on the prevalence of cerebral palsy: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The prevalence of CP expressed by gestational age was highest in children born before 28 weeks' gestation (111.80 per 1000 live births; 95% CI 69.53-179.78; p<0.0327)."
      explanation: >-
        Reports cerebral palsy prevalence highest in children born before 28
        weeks, at 111.80 per 1000 live births, the extreme-prematurity group
        in which this lesion predominates.
  description: >-
    Prematurity is the single strongest risk factor for cerebral palsy; risk
    rises steeply with decreasing gestational age and birth weight, largely via
    vulnerability of periventricular white matter.
  evidence:
  - reference: PMID:23346889
    reference_title: "An update on the prevalence of cerebral palsy: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of CP expressed by gestational age was highest in children born before 28 weeks' gestation (111.80 per 1000 live births; 95% CI 69.53-179.78; p<0.0327)."
    explanation: The >50-fold higher CP prevalence in extremely preterm infants establishes prematurity as the dominant risk factor.
  - reference: PMID:19081519
    reference_title: "Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain injury in premature infants is of enormous public health importance because of the large number of such infants who survive with serious neurodevelopmental disability, including major cognitive deficits and motor disability."
    explanation: Links premature brain injury to the motor disability that manifests as cerebral palsy.
- name: Perinatal asphyxia / hypoxic-ischemic insult
  influences_mechanisms:
  - target: Hypoxic-Ischemic Encephalopathy
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure and the node are the same event described clinically and
      pathologically; interruption of oxygen and blood supply around birth is
      what hypoxic-ischaemic encephalopathy consists of.
    evidence:
    - reference: PMID:32112349
      reference_title: "Pathophysiology of hypoxic-ischemic encephalopathy: a review of the past and a view on the future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypoxic-ischemic encephalopathy, also referred as HIE, is a type of brain injury or damage that is caused by a lack of oxygen to the brain during neonatal period."
      explanation: >-
        States that the injury is caused by a lack of oxygen to the brain during
        the neonatal period, which is the causal claim this link makes rather
        than merely a definition of the entity.
  description: >-
    Intrapartum hypoxic-ischemic events producing neonatal encephalopathy are a
    recognized cause, particularly of dyskinetic and spastic-quadriplegic forms.
  evidence:
  - reference: PMID:32112349
    reference_title: "Pathophysiology of hypoxic-ischemic encephalopathy: a review of the past and a view on the future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypoxic-ischemic encephalopathy, also referred as HIE, is a type of brain injury"
    explanation: Defines perinatal hypoxic-ischemic encephalopathy — the sequela of perinatal asphyxia — as a neonatal brain injury, the etiologic anchor of the HIE → deep-grey-nuclei → dyskinetic CP branch.
  - reference: PMID:23440789
    reference_title: "Cooling for newborns with hypoxic ischaemic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "newborns with hypoxic ischaemic encephalopathy"
    explanation: Cochrane review of therapeutic hypothermia for perinatal hypoxic-ischemic encephalopathy, confirming it as a defined perinatal insult with long-term neurodevelopmental sequelae.
- name: Intrauterine infection and inflammation
  influences_mechanisms:
  - target: Perinatal Neuroinflammation
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Maternal intrauterine infection reaches the fetal brain through a
      cytokine response rather than direct invasion, which is why the entry
      models a neuroinflammation node distinct from the ischaemic ones.
    evidence:
    - reference: PMID:10989405
      reference_title: "Chorioamnionitis as a risk factor for cerebral palsy: A meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among full-term infants, a positive association was found between clinical chorioamnionitis and cerebral palsy (RR, 4.7; 95% CI, 1.3-16.2)."
      explanation: >-
        Reports a relative risk of 4.7 for cerebral palsy with clinical
        chorioamnionitis among full-term infants, an inflammatory rather than
        ischaemic route.
  description: >-
    Chorioamnionitis and maternal/fetal inflammation increase cerebral palsy
    risk independent of, and synergistically with, hypoxia-ischemia.
  evidence:

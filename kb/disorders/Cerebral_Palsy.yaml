- name: Perinatal stroke
  influences_mechanisms:
  - target: Non-Progressive Developing-Brain Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      A focal arterial infarct produces a fixed, non-progressive lesion, which
      is the defining feature of cerebral palsy as a category and typically
      presents as hemiplegia reflecting the territory involved.
    evidence:
    - reference: PMID:20497457

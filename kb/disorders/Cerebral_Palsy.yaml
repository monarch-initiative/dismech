    explanation: Demonstrates the steep inverse relationship between gestational age and CP prevalence.
has_subtypes:
- name: Spastic
  display_name: Spastic cerebral palsy
  subtype_term:
    preferred_term: spastic cerebral palsy
    term:
      id: MONDO:0000396
      label: spastic cerebral palsy
  description: >-
    Increased muscle tone and spasticity, with unilateral hemiplegic or bilateral diplegic/quadriplegic distributions.
    This is the most common motor type; severity varies within each topographic category.
  evidence:
  - reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-five percent of children with cerebral palsy have spasticity as their primary motor type
    explanation: >-
      Supports predominance of the spastic motor type in the population summarized.
- name: Dyskinetic
  display_name: Dyskinetic cerebral palsy
  subtype_term:
    preferred_term: dyskinetic cerebral palsy
    term:
      id: MONDO:0022697
      label: athetoid cerebral palsy
  description: >-
    Involuntary dystonic or athetoid movements, often with deep gray-matter abnormalities. MONDO lists dyskinetic
    cerebral palsy as an exact synonym of athetoid cerebral palsy; the clinical description includes dystonia as
    well as athetosis.
  evidence:
  - reference: PMID:28715518
    reference_title: 'Early, Accurate Diagnosis and Early Intervention in Cerebral Palsy: Advances in Diagnosis and Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      dyskinesia (4%−7%), including dystonia and athetosis
    explanation: >-
      The clinical review defines the dyskinetic motor category.
- name: Ataxic
  display_name: Ataxic cerebral palsy
  subtype_term:
    preferred_term: ataxic cerebral palsy
    term:
      id: MONDO:0000397
      label: ataxic cerebral palsy
  description: >-
    Least common form, characterized by impaired balance and coordination from
    cerebellar dysfunction.
- name: Mixed
  display_name: Mixed cerebral palsy
  subtype_term:
    preferred_term: mixed cerebral palsy
    term:
      id: MONDO:0000400
      label: mixed cerebral palsy
  description: >-
    Coexisting motor types, commonly spasticity and dyskinesia. Mixed motor findings need not imply multiple separate
    acquired lesions.
  evidence:
  - reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many children have a mixed presentation involving both motor types
    explanation: >-
      Supports coexistence of spasticity and dyskinesia.
pathophysiology:
- name: Non-Progressive Developing-Brain Disturbance
  description: >-
    The clinical cerebral palsy syndrome reflects a non-progressive disturbance of the developing brain. This encompasses
    abnormal development as well as acquired injury; a demonstrable fixed lesion or birth asphyxia is not required.
    Motor function and secondary complications can change during growth.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32989326
    reference_title: "Mutations disrupting neuritogenesis genes confer risk for cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CP was thus defined as a non-progressive developmental disorder of movement and/or posture impairing motor function."
    explanation: States the operational non-progressive, movement/posture definition of cerebral palsy.
  - reference: PMID:30963790
    reference_title: Genetic or Other Causation Should Not Change the Clinical Diagnosis of Cerebral Palsy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cerebral palsy is, and should remain, an umbrella concept and clinical diagnosis that encompasses the diverse
      motor phenotypes/topographies and etiologies of this disorder
    explanation: >-
      Consensus discussion supports retaining a clinical umbrella across distinct etiologies; it does not establish
      a single causal pathway.
  downstream:
  - target: Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted early brain development can manifest with this motor pattern; it is not present in every CP subtype.
    evidence:
    - &id001
      reference: PMID:32989326
      reference_title: Mutations disrupting neuritogenesis genes confer risk for cerebral palsy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Movement disorder (spasticity, dystonia, choreoathetosis and/or ataxia) onset occurs within the first few
        years of life as a manifestation of disrupted brain development
      explanation: >-
        Connects early motor manifestations to disrupted brain development, with different motor patterns in different
        individuals.
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted early brain development can manifest with this motor pattern; it is not present in every CP subtype.
    evidence:
    - *id001
  - target: Choreoathetosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted early brain development can manifest with this motor pattern; it is not present in every CP subtype.
    evidence:
    - *id001
  - target: Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disrupted early brain development can manifest with this motor pattern; it is not present in every CP subtype.
    evidence:
    - *id001
  - target: Secondary Musculoskeletal Pathology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Contractures and hip displacement develop during growth as complications of the CP motor disorder; the
      intermediate neuromuscular and biomechanical steps are not resolved here.
    evidence:
    - reference: PMID:32086598
      reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Contracture is a common complication, particularly for children with spastic cerebral palsy.
      explanation: >-
        Places contracture as a complication of cerebral palsy, most often of the spastic motor type.
- name: Periventricular White Matter Injury
  description: >-
    Periventricular leukomalacia includes focal white-matter necrosis and diffuse glial injury in the premature
    brain. Cystic lesions can interrupt motor pathways and are associated with spastic diplegia; diffuse noncystic
    injury often has cognitive sequelae without major motor deficits.
  biological_scale: TISSUE
  locations:
  - preferred_term: periventricular white matter
    term:
      id: UBERON:0002316
      label: white matter
  downstream:
  - target: Non-Progressive Developing-Brain Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Periventricular injury can leave persistent developmental brain abnormalities; a cerebral palsy diagnosis
      additionally requires the clinical motor syndrome.
    evidence:
    - &id002
      reference: PMID:19081519
      reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        With regard to PVL, cystic PVL probably accounts for the small group of infants who show spastic diplegia.
      explanation: >-
        The full text ties the spastic diplegic phenotype specifically to cystic PVL.
  - target: Spastic diplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cystic PVL is associated with the spastic diplegic phenotype; this inference does not extend to all noncystic
      white-matter injury.
    evidence:
    - *id002
  evidence:
  - *id002
  - reference: PMID:19081519
    reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-cystic PVL correlates with the cognitive deficits observed later, usually in the absence of major motor
      deficits.
    explanation: >-
      Prevents treating all white-matter injury as sufficient for a motor CP diagnosis.
- name: Premyelinating Oligodendrocyte Injury
  description: >-
    Vulnerable premyelinating oligodendrocytes in premature white matter undergo cell loss or process injury. This
    is a cellular component of diffuse PVL, distinct from focal tissue necrosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: premyelinating oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
    modifier: DECREASED
  notes: >-
    Premyelinating oligodendrocytes are bound to the broader CL:0002453 oligodendrocyte precursor cell because no
    pre-oligodendrocyte term is present in cache/cl/terms.csv; preferred_term keeps the developmental stage.
  downstream:
  - target: Oligodendrocyte Maturation Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Following initial injury, oligodendroglial progenitors may repopulate but fail to mature; the regenerative
      failure is particularly well documented in experimental PVL.
    evidence:
    - &id003
      reference: PMID:19081519
      reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        However, in PVL, these cells, which often lack processes, seem not to have the capacity for full differentiation
        to mature myelin-producing cells, and hypomyelination with ventriculomegaly is the later sequela.
      explanation: >-
        Full-text account of oligodendroglial repopulation without effective maturation and subsequent hypomyelination.
  evidence:
  - reference: PMID:19081519
    reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Injury of pre-OLs consists of cell loss or process loss (with intact soma).
    explanation: >-
      The review distinguishes loss of precursor cells from loss of their processes; it synthesizes human pathology
      and experimental mechanisms.
- name: Oligodendrocyte Maturation Failure
  description: >-
    Regenerating oligodendroglial progenitors fail to complete differentiation into mature myelin-producing cells
    after premature white-matter injury. The precise cause of this maturation disturbance remains unresolved.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: oligodendrocyte differentiation
    term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    modifier: DECREASED
  downstream:
  - target: White Matter Hypomyelination
    causal_link_type: DIRECT
    description: >-
      An inadequate mature oligodendrocyte population impairs subsequent myelination.
    evidence:
    - *id003
  evidence:
  - *id003
- name: White Matter Hypomyelination
  description: >-
    Reduced myelination is a developmental consequence of oligodendroglial injury and maturation failure in diffuse

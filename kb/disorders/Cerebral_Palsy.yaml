animal_models:
- name: Developmental xenocortication with human cortical organoids (XCX)
  species: Mouse
  genotype: Emx1-cre+/−; Esco2fl/fl; Prkdcscid/scid
  background: Immunodeficient SCID host with neonatal human cortical organoid engraftment.
  publication: PMID:42749812
  description: >-
    Platform for studying developing human cortical cells, circuit integration and host behaviour
    in vivo. Conditional Esco2 deletion in the Emx1 lineage depletes mouse neocortical and
    hippocampal glutamatergic neurons, creating space for human stem-cell-derived cortical
    organoids. The grafts grow extensively, generate diverse cortical cell types and exhibit
    organized activity. Hypoxic injury to the developing human graft is a proof-of-concept
    application. The authors identify perinatal hypoxia and associated cerebral palsy as potential
    future modelling applications; this record does not establish XCX mice as a validated
    model of cerebral palsy.
  associated_phenotypes:
  - Human graft HIF1α immunoreactivity after hypoxia
  - Increased intragraft astroglial and microglial density and altered morphology after hypoxia
  - Enhanced graft vascular hypointensities on susceptibility-weighted MRI after hypoxia
  - Altered mouse paw-support strategy and hindpaw contact after hypoxia
  notes: >-
    Figure 5 uses 5% O2 for 5 hours, preceded by a 1-hour graded descent, as specified by
    the figure legend and Methods. HIF1α was assessed immediately after exposure and SWI at
    10 days; each finding was reported in three XCX mice. Glial measurements at 20 days compared
    four normoxic and four hypoxia-exposed XCX mice. GFAP-positive astroglia were human graft-derived;
    IBA1-positive microglia were mouse host-derived. CatWalk measurements compared each animal
    at baseline and two days after injury: 11 control, nine apallial and nine XCX mice. The
    apallial hypoxia group contained only females, preventing a complete sex-by-genotype analysis.
    Reported gait changes were not accompanied by detected group differences in running-speed
    or step-cadence changes; this is not an equivalence result. Esco2 deletion is host engineering,
    not evidence for an ESCO2 cause of cerebral palsy. Mechanism links are deliberately unassigned:
    the existing hypoxic-ischemic encephalopathy node includes mechanisms not established
    by this hypoxia experiment, and the perinatal neuroinflammation node describes a different
    initiating context. Acute behavioural readouts do not establish a permanent motor disorder.
    Graft-neuron necessity or sufficiency for specific behaviours remains unresolved. These
    model observations are not added as human phenotypes.
  evidence:
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we establish a transplantation platform using a genetic strategy to effectively
      deplete glutamatergic neurons from mouse neocortex and hippocampus (apallial) and neonatally
      engraft the cortical cavity with human stem-cell-derived cortical organoids (hCO) to
      generate xenocortical mice.
    explanation: Establishes the platform design and the human graft in an apallial mouse host.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This leads to robust graft growth with hCOs occupying most of the cortical volume and
      generating a diversity of human cortical cell types, including layer 5 extratelencephalic
      projection neurons.
    explanation: Supports graft expansion and cortical cell-type diversity as platform characteristics.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Human cortical neurons integrate with the mouse nervous system, and in vivo cortical
      graft-wide calcium imaging and electrophysiological analyses revealed patterns of organized
      activity resembling developing circuits.
    explanation: >-
      Reports organized graft activity and integration; it does not demonstrate that graft
      neurons cause particular host behaviours.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We deleted the sister chromatid cohesion factor Esco2 specifically in cells expressing
      the dorsal and medial pallium marker Emx1 in an immunocompromised SCID background4,5,6
      (apallial mice: Emx1-cre+/−Esco2fl/flPrkdcscid/scid;
    explanation: Identifies the conditional host genotype and SCID background used to generate the platform.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice were exposed to 5% O2 for 5 h preceded by a 1 h run-in period during which the
      oxygen percentage was gradually decreased to the 5% target.
    explanation: Figure 5 legend specifies five hours at the target oxygen concentration after the one-hour run-in.
  - reference: PMID:42749812
    reference_title: Developmental xenocortication using human-derived organoids in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In 3 out of 3 XCX mice exposed to 5% O2 for 5 h, HIF1α immunoreactivity was detected
      in the human graft, whereas HIF1α signal was not appreciable in the adjacent mouse palaeocortex
    explanation: >-
      Reports the immediate HIF1α response localized to the human graft. This is a hypoxia-response

        statistic is not assigned to this narrower phenotype.
- name: Genetically Mediated Neuritogenesis Disturbance
  description: >-
    A subset of CP-associated variants may disturb early neuronal process formation and circuit connectivity. This
    is a convergent mechanistic hypothesis from genetic and functional studies, not a proven common mechanism in
    all CP.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: neuron projection development
    term:
      id: GO:0031175
      label: neuron projection development
    modifier: ABNORMAL
  downstream:
  - target: Non-Progressive Developing-Brain Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

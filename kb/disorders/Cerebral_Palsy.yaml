genetic:
- name: Monogenic and de novo genetic contributions
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Sequence variants and copy-number variants contribute to a subset of clinically ascertained CP. Diagnostic yields
    depend on cohort selection and variant interpretation; they do not establish one genetic cause across this heterogeneous
    syndrome.
  evidence:
  - reference: PMID:32989326
    reference_title: "Mutations disrupting neuritogenesis genes confer risk for cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found an enrichment of damaging DNMs in CP cases, which became more apparent when focusing the analysis on genes intolerant to LoF variation"
    explanation: Whole-exome sequencing of 250 CP trios shows enrichment of damaging de novo mutations, implicating monogenic genetic contributions (e.g., CTNNB1, TUBA1A).
  - reference: PMID:30564460
    reference_title: "Pathogenic copy number variants that affect gene expression contribute to genomic burden in cerebral palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined SNV and CNV analysis revealed pathogenic and likely pathogenic variants in 22.7% of unselected individuals with CP."
    explanation: >-
      Combined prior sequence-variant analyses with the CNV analysis of an unselected Australian CP cohort. The
      full text reports seven additional cases among 186 analyzed (3.7%) and a combined yield of 22.7%; this is
      not a universal CP prevalence estimate.
  - reference: PMID:38553553
    reference_title: Comprehensive whole-genome sequence analyses provide insights into the genomic architecture of cerebral palsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple classes of P/LP variants included single-nucleotide variants (SNVs)/indels (6.7%), copy number variations
      (3.4%) and mitochondrial mutations (1.5%).
    explanation: >-
      The whole-genome cohort illustrates variant-class diversity; these are cohort-specific yields and categories
      need not be mutually exclusive.
- name: CTNNB1
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Damaging de novo CTNNB1 variants were enriched in a CP-ascertained trio cohort, and affected individuals had
    spasticity, intellectual disability and language disorders. CTNNB1-related neurodevelopmental disorder provides
    an etiologic diagnosis in these individuals. The CP label did not identify a distinct subgroup in a later CTNNB1
    cohort. The relationship applies to the clinically ascertained subset rather than to CP generally; its representation

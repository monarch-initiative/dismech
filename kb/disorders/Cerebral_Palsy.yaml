- name: Secondary Musculoskeletal Pathology
  description: >-
    Contractures and progressive hip displacement may develop during growth despite a non-progressive underlying
    brain disturbance. Their course reflects multiple neuromuscular and biomechanical factors; reducing spasticity
    alone does not establish prevention of deformity.
  biological_scale: ORGANISM
  evidence:
  - &id008
    reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contracture is a common complication, particularly for children with spastic cerebral palsy.
    explanation: >-
      Supports contracture as an evolving complication.
  - reference: PMID:32086598
    reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One in three children in high-income countries experience progressive hip displacement as a complication of
      their cerebral palsy
    explanation: >-
      Supports progressive secondary hip pathology in the populations discussed.
  downstream:
  - target: Joint contractures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Secondary musculoskeletal change can restrict joint range.
    evidence:
    - *id008
  - target: Hip dislocation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Progressive displacement can culminate in dislocation; surveillance aims to prevent this outcome.
    evidence:
    - &id010
      reference: PMID:32086598
      reference_title: 'State of the Evidence Traffic Lights 2019: Systematic Review of Interventions for Preventing and Treating Children with Cerebral Palsy.'

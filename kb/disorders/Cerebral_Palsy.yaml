environmental:
- name: Preterm birth and low birth weight
  influences_mechanisms:
  - target: Periventricular White Matter Injury
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Developmental vulnerability of premature white matter predisposes to injury; prematurity does not invariably
      trigger a lesion.
    evidence:
    - reference: PMID:19081519
      reference_title: 'Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Various maturation-dependent factors, including a propensity for premature infants to experience episodes
        of cerebral ischaemia and infection or inflammation, and an intrinsic susceptibility to excitotoxicity and
        free-radical accumulation, converge to accentuate vulnerability.
      explanation: >-
        Mechanistic review supports developmental susceptibility in premature white matter.
  description: >-
    CP risk rises with decreasing gestational age and birth weight. Premature white matter is developmentally vulnerable
    to injury.
  evidence:
  - reference: PMID:23346889
    reference_title: "An update on the prevalence of cerebral palsy: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of CP expressed by gestational age was highest in children born before 28 weeks' gestation (111.80 per 1000 live births; 95% CI 69.53-179.78; p<0.0327)."
    explanation: >-
      Supports the high CP prevalence in children born before 28 weeks; this association does not itself prove a
      specific cellular mechanism.
  - reference: PMID:19081519
    reference_title: "Brain injury in premature infants: a complex amalgam of destructive and developmental disturbances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain injury in premature infants is of enormous public health importance because of the large number of such infants who survive with serious neurodevelopmental disability, including major cognitive deficits and motor disability."
    explanation: Links premature brain injury to the motor disability that manifests as cerebral palsy.
- name: Perinatal asphyxia / hypoxic-ischemic insult
  influences_mechanisms:
  - target: Hypoxic-Ischemic Encephalopathy
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inadequate oxygen delivery during the neonatal period can cause hypoxic-ischemic brain injury.
    evidence:
    - reference: PMID:32112349
      reference_title: "Pathophysiology of hypoxic-ischemic encephalopathy: a review of the past and a view on the future."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hypoxic-ischemic encephalopathy, also referred as HIE, is a type of brain injury or damage that is caused by a lack of oxygen to the brain during neonatal period."
      explanation: >-
        States that the injury is caused by a lack of oxygen to the brain during
        the neonatal period, which is the causal claim this link makes rather
        than merely a definition of the entity.
  description: >-
    A hypoxic-ischemic insult around birth can cause neonatal encephalopathy, one recognized etiologic pathway to
    CP.
  evidence:
  - reference: PMID:32112349
    reference_title: "Pathophysiology of hypoxic-ischemic encephalopathy: a review of the past and a view on the future."
    supports: SUPPORT

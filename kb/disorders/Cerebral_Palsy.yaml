notes: >-
  Cerebral palsy is a clinical/descriptive umbrella term for a group of
  permanent disorders of movement and posture attributed to non-progressive
  disturbances in the developing fetal or infant brain. It is defined by its
  motor phenotype and static-lesion natural history rather than by a single
  etiology; the same clinical picture arises from diverse antenatal, perinatal,
  and postnatal causes.
  Functional severity is graded with standardized ordinal systems rather than a
  single global score: the Gross Motor Function Classification System (GMFCS,
  levels I-V) for gross motor/mobility, the Manual Ability Classification System
  (MACS) for hand use, the Communication Function Classification System (CFCS),
  and the Eating and Drinking Ability Classification System (EDACS). GMFCS level
  is a primary determinant of prognosis and treatment selection (e.g., ambulant
  spastic-diplegic children are the candidates for selective dorsal rhizotomy).

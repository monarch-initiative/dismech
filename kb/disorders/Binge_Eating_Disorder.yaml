diagnosis:
- name: Structured clinical assessment for BED
  description: >-
    Diagnosis is clinical and should establish objective binge episodes, loss of
    control, marked distress, frequency and duration, associated features, and
    absence of recurrent compensatory behavior. A structured eating-disorder
    interview such as the Eating Disorder Examination can support assessment;
    body weight, a questionnaire score, or a research biomarker cannot establish
    BED on its own.
  evidence:
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the criteria in both diagnostic manuals, these episodes must
      occur at least once a week for a minimum of three months and be
      accompanied by distress regarding the binge eating.
    explanation: >-
      The diagnostic review supplies the current frequency, duration, and
      distress requirements.
  - reference: DOI:10.2196/40472
    reference_title: "Efficacy of Web-Based, Guided Self-help Cognitive Behavioral Therapy–Enhanced for Binge Eating Disorder: Randomized Controlled Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The secondary outcome was full recovery at the end of treatment, as
      measured using the Eating Disorder Examination during the last 4 weeks of
      treatment.
    explanation: >-
      RCT evidence supports use of the Eating Disorder Examination to measure
      BED recovery and symptom status.
- name: BEDS-7 screening followed by diagnostic evaluation
  description: >-
    The seven-item BEDS-7 is a brief patient-reported screen for probable BED
    and can prompt a clinical interview or specialist referral. It is not a
    stand-alone diagnostic test: the development study prioritized sensitivity
    and reported low specificity, while later cross-cultural work supported
    reliability across many languages without replacing diagnostic assessment.
  evidence:
  - reference: PMID:27486542
    reference_title: Development of the 7-Item Binge-Eating Disorder Screener (BEDS-7).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven BEDS items (BEDS-7) yielded 100% sensitivity and 38.7% specificity."
    explanation: >-
      The development study supports sensitive case finding but also shows why a
      positive result requires confirmatory clinical evaluation.
  - reference: PMID:40040591
    reference_title: Cross-Cultural Validation of the Binge Eating Disorder Screener-7 (BEDS-7) Across 42 Countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings provide further evidence of the reliability and validity of
      the BEDS-7 as a potential screening tool for identifying probable cases of
      BED globally, facilitating early intervention in primary care settings.
    explanation: >-
      Cross-cultural validation supports broad screening use while retaining the
      study's own "probable cases" boundary.
- name: Psychiatric comorbidity and safety assessment
  description: >-
    Clinical evaluation should assess mood, anxiety, substance-use and other
    psychiatric disorders, as well as suicidality and sleep problems, because
    these commonly coexist with BED and can alter severity, treatment selection,
    and safety monitoring.
  evidence:
  - reference: PMID:39138440
    reference_title: "Comorbidity of binge eating disorder and other psychiatric disorders: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequently observed comorbidities associated with BED were mood
      disorders, anxiety disorders and substance use disorders.
    explanation: >-
      The systematic review supports routine assessment of common psychiatric
      comorbidities in people evaluated for BED.
differential_diagnoses:
- name: Bulimia Nervosa
  description: >-
    Bulimia nervosa overlaps with BED through recurrent binge eating and loss
    of control.
  distinguishing_features:
  - >-
    Bulimia nervosa includes regular compensatory behaviors such as vomiting,
    fasting, laxative misuse, or excessive exercise; BED lacks regular
    compensatory behaviors.
  disease_term:
    preferred_term: bulimia nervosa
    term:
      id: MONDO:0005452
      label: bulimia nervosa
  evidence:
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While BED and bulimia nervosa (BN) share similarities in terms of regular
      binge-eating episodes, BN is distinguished by the recurrent use of
      inappropriate compensatory behaviors
    explanation: >-
      The diagnostic review directly identifies recurrent compensatory behavior
      as the principal boundary between bulimia nervosa and BED.
- name: Anorexia Nervosa
  description: >-
    Anorexia nervosa binge-eating/purging presentations can include binge-like
    episodes and compensatory behaviors.
  distinguishing_features:
  - >-
    Anorexia nervosa requires significantly low body weight or persistent
    restriction leading to low weight; BED does not require low body weight and
    lacks regular compensatory behaviors.
  disease_term:
    preferred_term: anorexia nervosa
    term:
      id: MONDO:0005351
      label: anorexia nervosa
  evidence:
  - reference: PMID:25591200
    reference_title: Initial evaluation, diagnosis, and treatment of anorexia nervosa and bulimia nervosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For low-weight patients with anorexia nervosa, virtually all physiologic
      systems are affected, ranging from hypotension and osteopenia to
      life-threatening arrhythmias, often requiring emergent assessment and
      hospitalization for metabolic stabilization.
    explanation: >-
      Clinical review evidence supports anorexia nervosa as a low-weight
      differential diagnosis when binge/purge-like symptoms overlap with BED.
- name: Obesity Without Binge Eating Disorder
  description: >-
    Obesity and BED frequently coexist, but neither diagnosis implies the other.
    Obesity without BED lacks the recurrent, distressing loss-of-control binge
    episodes required for BED, and BED can occur without obesity.
  distinguishing_features:
  - >-
    Establish whether recurrent objective binge episodes include loss of control
    and marked distress; higher body weight alone does not satisfy BED criteria.
  disease_term:
    preferred_term: obesity disorder
    term:
      id: MONDO:0011122
      label: obesity disorder
  evidence:
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, although being overweight or obese is not an criterion, BED is
      commonly associated with a high body mass index (BMI)
    explanation: >-
      The source explicitly separates diagnostic criteria from the common
      association with higher body weight.
animal_models:
- species: Mus musculus
  genotype: >-
    Female Vglut2-Cre (Slc17a6tm2(cre)Lowl/J; The Jackson Laboratory stock
    016963) mice with pathway-specific chemogenetic inhibition
  alleles:
  - Slc17a6tm2(cre)Lowl/J (The Jackson Laboratory stock 016963)
  background: Intermittent palatable-food access followed by an acute emotional stressor
  category: Stress-induced binge-like eating model
  description: >-
    Female mice exposed to an acute emotional stressor after intermittent access
    to palatable food show binge-like overconsumption. A glutamatergic projection
    from paraventricular thalamus to medial insular cortex is activated, and
    chemogenetic inhibition suppresses overconsumption. The model supports
    causal circuit experiments for stress-triggered binge-like eating but cannot
    reproduce subjective loss of control, diagnostic distress, stigma, or
    body-image concerns.
  associated_phenotypes:
  - Stress-triggered binge-like overconsumption of palatable food
  - Female-specific behavioral response in this paradigm
  evidence:
  - reference: PMID:37474763
    reference_title: A paraventricular thalamus to insular cortex glutamatergic projection gates "emotional" stress-induced binge eating in females.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "originally purchased from The Jackson Laboratory (stock #016963)"
    explanation: >-
      The methods identify the Vglut2-Cre stock used in this model, making the
      transgenic background traceable to the reported experimental line.
  - reference: PMID:37474763
    reference_title: A paraventricular thalamus to insular cortex glutamatergic projection gates "emotional" stress-induced binge eating in females.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Subsequent chemogenetic inhibition of this pathway suppressed
      stress-induced binge eating.
    explanation: >-
      Pathway-specific perturbation directly supports a causal circuit within
      this female-mouse stress paradigm.
  - reference: DOI:10.1038/s41398-026-04035-0
    reference_title: "Advancing translational research in binge-eating: Integrating insights from clinical practice into animal models"
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Limitations include the inability of animal models to fully capture the
      psychological and sociocultural dimensions of binge eating, such as the
      sense of loss of control, stigma, distress, and body-image concerns.
    explanation: >-
      The translational review defines the model's boundary relative to human
      BED rather than treating binge-like intake as a complete disease model.
datasets:
- accession: dbgap:phs001672
  title: Million Veteran Program model-derived BED GWAS summary statistics
  description: >-
    BMI-adjusted, bi-ancestry GWAS summary statistics for a machine-learning
    model-derived BED phenotype in the Million Veteran Program. The publication
    reports 77,574 participants of African ancestry and 285,138 of European
    ancestry and identifies loci near HFE, MCHR2, and LRP11. Access is governed
    by dbGaP; the phenotype is probabilistic and is not equivalent to a
    clinician-confirmed BED cohort.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: GWAS
  sample_count: 362712
  conditions:
  - Model-derived probability of binge eating disorder
  - BMI-adjusted African-ancestry GWAS
  - BMI-adjusted European-ancestry GWAS
  publication: PMID:37550530
  evidence:
  - reference: PMID:37550530
    reference_title: Genome-wide analysis of a model-derived binge eating disorder phenotype identifies risk loci and implicates iron metabolism.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We perform a genome-wide association study of individuals of African
      (n = 77,574) and European (n = 285,138) ancestry while controlling for
      body mass index to identify three independent loci near the HFE, MCHR2
      and LRP11 genes and suggest APOE as a risk gene for BED.
    explanation: >-
      The publication documents the ancestry-specific sample counts, phenotype
      construction, and principal GWAS findings represented by this accession.

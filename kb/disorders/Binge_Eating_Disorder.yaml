name: Binge Eating Disorder
creation_date: "2026-04-28T00:00:00Z"
category: Psychiatric
description: >-
  Binge eating disorder (BED) is a feeding and eating disorder characterized by
  recurrent binge episodes with loss of control and marked distress, typically
  involving an unusually large amount of food in a discrete period. Episodes
  occur at least weekly for three months and are not accompanied by the
  recurrent inappropriate compensatory behaviors that define bulimia nervosa.
  BED can occur at any body size; higher body weight is common in studied
  cohorts but is not a diagnostic requirement.

discussions:
- discussion_id: causal_status_of_reward_and_control_abnormalities
  prompt: >-
    Are altered reward responsivity and impaired inhibitory control pre-existing
    causal liabilities for BED, consequences of recurrent binge eating, or
    correlates shared with higher body weight?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reward Hypersensitivity
  - pathophysiology#Impaired Inhibitory Control
  rationale: >-
    Human studies use heterogeneous tasks, often have small samples, and do not
    always include weight-matched controls. The nodes and their phenotype edges
    therefore remain provisional and use indirect causal links.
  evidence:
  - reference: DOI:10.1007/s11920-024-01534-z
    reference_title: Reward and Inhibitory Control as Mechanisms and Treatment Targets for Binge Eating Disorder
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Greater research is needed evaluating reward and inhibitory control
      simultaneously and with weight-matched comparison groups, as well as
      larger randomized trials that target both processes simultaneously.
    explanation: >-
      The review directly identifies the comparator and study-design gaps that
      prevent stronger causal interpretation.
- discussion_id: human_fidelity_of_binge_like_animal_models
  prompt: >-
    Which preclinical binge-like eating paradigms predict mechanisms and
    treatment responses that generalize to diagnostically defined human BED?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Binge Eating Episodes
  - phenotypes#Loss of Control Over Eating
  - phenotypes#Marked Distress About Binge Eating
  rationale: >-
    Rodent paradigms can manipulate stress, food access, and neural circuits,
    but they cannot directly measure the subjective loss of control, marked
    distress, or sociocultural dimensions that define human BED.
  evidence:
  - reference: DOI:10.1038/s41398-026-04035-0
    reference_title: "Advancing translational research in binge-eating: Integrating insights from clinical practice into animal models"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While existing models capture key biological and behavioral components of
      binge eating, closer alignment with clinically defining features, for
      example, through the inclusion of emotional stressors and varied outcome
      measures, could improve translational impact.
    explanation: >-
      The review explicitly frames alignment with clinically defining features
      as an unresolved translational priority.
- discussion_id: bed_obesity_boundary_and_treatment_outcomes
  prompt: >-
    How much of BED's observed metabolic burden and treatment response is
    independent of co-occurring obesity and weight-focused ascertainment?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - phenotypes#Increased Body Weight
  rationale: >-
    Higher body weight is common but not required for BED. Many mechanism and
    treatment studies enroll participants with obesity, while psychological
    treatment can reduce binge eating without materially changing weight.
    Disease-specific and weight-specific outcomes should remain separate.
  evidence:
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, although being overweight or obese is not an criterion, BED is
      commonly associated with a high body mass index (BMI)
    explanation: >-
      The diagnostic review supports separating the common body-weight
      association from the disease definition.
review_notes: >-
  Reviewed against current literature through 2026-07-23. BED is modeled as a
  multifactorial, polygenic psychiatric disorder, not a Mendelian condition.
  MCHR2 denotes a GWAS-proximal susceptibility locus rather than an established
  causal gene. The familial-liability and GWAS records are therefore not forced
  into gene-to-mechanism edges that their evidence cannot establish. Reward and
  inhibitory-control nodes are provisional because much human evidence is
  cross-sectional and partly shared with obesity. HP:0100738 and HP:0100851 are
  broad ontology mappings, so preferred terms retain the BED-specific clinical
  meaning. GO:0007631 is intentionally retained on the organism-scale
  maintenance-cycle node because feeding behavior is itself a valid GO
  biological-process term, not a molecular-process surrogate. Increased body
  weight is intentionally retained as an associated, non-diagnostic phenotype
  and is not forced into a causal path. The animal model is labeled binge-like
  and is not treated as a complete model of human diagnostic phenomenology.
notes: >-
  Psychiatric comorbidity is clinically important in BED and is represented in
  the diagnosis section because the current schema has no disease-level
  comorbidities slot. Treatment descriptions summarize study-level evidence and
  are not individualized medical advice; medication selection and monitoring
  require current jurisdiction-specific labeling and patient-level assessment.

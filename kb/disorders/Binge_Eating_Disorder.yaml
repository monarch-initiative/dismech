definitions:
- name: DSM-5-TR and ICD-11 clinical diagnostic boundary
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Clinical diagnosis requires recurrent binge-eating episodes with loss of
    control and marked distress. Episodes occur at least weekly for at least
    three months. DSM-5-TR additionally requires at least three associated
    features. Recurrent inappropriate compensatory behavior is absent, and the
    episode pattern must not be better explained by bulimia nervosa or the
    binge-eating/purging presentation of anorexia nervosa. Specific wording
    differs between the two manuals; body size and overvaluation of shape or
    weight are not required criteria.
  scope: Clinical diagnosis under current DSM-5-TR and ICD-11 criteria
  evidence:
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the criteria in both diagnostic manuals, these episodes must
      occur at least once a week for a minimum of three months and be
      accompanied by distress regarding the binge eating.
    explanation: >-
      The review summarizes the shared frequency, duration, and distress
      boundary in current DSM-5-TR and ICD-11 criteria.
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      binge-eating episodes must manifest at least three of the following
      characteristics: eating rapidly, eating until uncomfortably full, eating
      despite not feeling physically hungry, eating alone due to embarrassment,
      and experiencing negative emotions after overeating
    explanation: >-
      The review lists the associated-feature threshold used by DSM-5-TR.
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While BED and bulimia nervosa (BN) share similarities in terms of regular
      binge-eating episodes, BN is distinguished by the recurrent use of
      inappropriate compensatory behaviors, such as self-induced vomiting,
      misuse of laxatives or fasting, to prevent weight gain which is not
      present in BED
    explanation: >-
      The review supports absence of recurrent compensatory behavior as a key
      BED boundary.
  - reference: DOI:10.1186/s40337-025-01187-0
    reference_title: "Redefining diagnostic parameters: the role of overvaluation of shape and weight in binge-eating disorder: a systematic review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this concept is not a criterion for binge-eating disorder
    explanation: >-
      The review confirms that overvaluation of shape and weight is clinically
      relevant but is not a required criterion in the current definition.

      evidence-based therapeutic approaches with peer support.
  - reference: PPR:PPR1274137
    reference_title: "A randomized controlled trial (RCT) of Juniver, a new digital intervention for eating disorder symptoms"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juniver participants (n=179) showed significantly greater reductions than
      control (n=178) on the primary outcome as well as binge eating, clinical
      impairment, depression and anxiety.
    explanation: >-
      RCT results demonstrate efficacy of Juniver for reducing eating disorder
      symptoms, binge eating episodes, and comorbid depression and anxiety in
      participants aged 16 years and older.
  - reference: PPR:PPR1274137
    reference_title: "A randomized controlled trial (RCT) of Juniver, a new digital intervention for eating disorder symptoms"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events were n=18 for Juniver and n=32 for control, including 1x
      control participant emergency hospitalization. Results support the efficacy
      and safety of Juniver for eating disorder symptoms.
    explanation: >-
      Safety profile from the RCT supports tolerability of the digital
      intervention with comparable or lower adverse event rates than control
      condition.
  notes: >-
    Evidence from a preprint publication (not yet peer-reviewed). The trial
    enrolled participants aged ≥16 years with eating disorder symptoms; results
    may not generalize to younger individuals or severe eating disorders requiring

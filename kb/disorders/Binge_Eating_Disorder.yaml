progression:
- phase: Clinical course
  age_range: Adulthood
  notes: >-
    In a community cohort enriched for adults with higher BMI, 61.3% retained
    full BED at 2.5 years and 45.7% at 5 years; median time to remission exceeded
    60 months and median time to relapse after remission was 30 months. These
    estimates should not be generalized to all ages or body sizes.
  evidence:
  - reference: DOI:10.1017/S0033291724000977
    reference_title: "The natural course of binge-eating disorder: findings from a prospective, community-based study of adults"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median time to remission (i.e. no BED) exceeded 60 months, and median time
      to relapse (i.e. sub-threshold or full BED) after remission was 30 months.
    explanation: >-
      Prospective community-based follow-up supports a persistent, relapsing
      clinical course in adults with BED and higher BMI.

      (70.2%) followed by CBT (44.7%) and LDX (40.4%).
    explanation: >-
      Randomized trial evidence supports combined CBT+LDX as the highest-
      remission treatment arm among the tested interventions.
- name: Juniver (App-Based Digital Intervention)
  description: >-
    Juniver is a smartphone app-based program combining neuroscience-informed CBT,
    an AI support tool configured for eating disorder symptoms, and moderated peer
    groups to provide just-in-time interventions during moments of eating disorder
    urges. The intervention is tailored to individual context and motivation, aiming
    to support self-management and recovery.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive behavior therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  target_phenotypes:

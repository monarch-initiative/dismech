pathophysiology:
- name: Reward Hypersensitivity
  description: >-
    BED is modeled as altered reward processing, including higher initial and
    anticipatory food reward followed by lower experienced reward as episodes
    recur. Most human evidence is cross-sectional and not sufficient to
    establish whether these changes precede illness or result from recurrent
    binge eating or higher body weight.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: G protein-coupled dopamine receptor signaling pathway
    term:
      id: GO:0007212
      label: G protein-coupled dopamine receptor signaling pathway

    description: >-
      Reward hypersensitivity is represented upstream of recurrent binge-eating
      episodes, while causal direction and intervening processes remain
      unresolved in human studies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: DOI:10.1007/s11920-024-01534-z
      reference_title: Reward and Inhibitory Control as Mechanisms and Treatment Targets for Binge Eating Disorder
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with binge eating disorder experience higher initial reward
        to food, and later, higher anticipatory reward but lower experienced
        food reward which maintains binge eating behavior.
      explanation: >-
        The review supports a reward-maintenance association but does not
        establish a direct causal edge in humans.
  evidence:

- name: Cognitive-Behavioral Binge-Maintenance Cycle
  description: >-
    A cognitive-behavioral model links dietary restraint and negative affect to
    binge episodes, which then reinforce distress and renewed restriction. This
    organism-level maintenance cycle is provisional because the cited
    translational review describes a conceptual model rather than establishing
    temporal causality in a prospective human study.
  mechanism_confidence: PROVISIONAL
  biological_scale: ORGANISM

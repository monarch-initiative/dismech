    term:
      id: HP:0100738
      label: Abnormal eating behavior
  evidence:
  - reference: PPR:PPR1274137
    reference_title: "A randomized controlled trial (RCT) of Juniver, a new digital intervention for eating disorder symptoms"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juniver is an app-based program for eating disorder symptoms combining
      neuroscience, CBT, an AI support tool configured specifically for eating

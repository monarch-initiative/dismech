- name: VLDLR-ApoER2-DAB1 Signal Transduction Failure
  conforms_to: reelin_terminal_translocation_lamination_failure#VLDLR-ApoER2-DAB1 Signal Transduction Failure
  description: Reelin binding to the transmembrane lipoprotein receptors VLDLR and ApoER2 (LRP8) recruits the cytoplasmic adaptor protein DAB1 to their intracellular NPxY motif and induces DAB1 phosphorylation, initiating the intracellular signaling cascade required for neuronal positioning. Loss of either secreted Reelin ligand or cell-surface VLDLR receptor prevents DAB1 recruitment and phosphorylation, uncoupling extracellular Reelin cues from downstream migration and lamination effectors.

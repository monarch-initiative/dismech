description: "Reelin-pathway lissencephaly is an autosomal recessive malformation of cortical development whose coherent pathomechanism skeleton is failure of extracellular Reelin signaling rather than the microtubule/dynein-based neuronal-migration arrest of classical lissencephaly. Reelin is a large glycoprotein secreted by Cajal-Retzius cells in the cortical marginal zone; it binds the lipoprotein receptors VLDLR and ApoER2/LRP8 on migrating postmitotic neurons, activating the intracellular adaptor DAB1 and downstream adhesion/cytoskeletal effectors that drive glia-independent terminal somal translocation and inside-out cortical lamination. Biallelic loss of the ligand (RELN) or the receptor (VLDLR) collapses this signal, producing a cortex with simplified/thickened gyration together with the hallmark cerebellar hypoplasia, and—because the same pathway organizes the hippocampus, cerebellum, and brainstem—recurring hippocampal disorganization and pontine/brainstem hypoplasia. The two principal human lesions define the disease's subtype branches: RELN mutations (Hong et al. 2000) cause a more severe lissencephaly-with-cerebellar-hypoplasia phenotype with hippocampal and brainstem involvement,\
  \ whereas VLDLR deletion (Boycott et al. 2005; the \"dysequilibrium syndrome\"/CAMRQ1 spectrum) causes nonprogressive cerebellar ataxia with milder cerebral gyral simplification. This is the exemplar Reelin-signaling cortical malformation and conforms to the reelin terminal-translocation lamination-failure module rather than to the tubulinopathy or generic migration-arrest modules."
has_subtypes:
- name: RELN-related
  display_name: RELN-related lissencephaly with cerebellar hypoplasia
  description: 'Biallelic loss-of-function RELN variants reduce or eliminate the secreted Reelin ligand produced by Cajal-Retzius cells, producing the more severe end of the spectrum: lissencephaly/pachygyria with severe cerebellar hypoplasia, hippocampal malformation, and brainstem (pontine) hypoplasia. Corresponds historically to lissencephaly with cerebellar hypoplasia type B (LCHB).'
- name: VLDLR-related
  display_name: VLDLR-associated cerebellar hypoplasia with gyral simplification
  description: 'Homozygous VLDLR loss (classically a 199-kb deletion in the Hutterite "cerebellar hypoplasia and dysequilibrium" / CAMRQ1 syndrome) removes one of the Reelin receptors, producing a generally milder phenotype: nonprogressive cerebellar ataxia and intellectual disability with inferior cerebellar hypoplasia and mild cerebral gyral simplification rather than frank lissencephaly.'
pathophysiology:
- name: Cajal-Retzius Reelin Ligand Deficiency
  conforms_to: reelin_terminal_translocation_lamination_failure#Cajal-Retzius Reelin Ligand Deficiency
  description: Pathogenic biallelic RELN variants reduce or abolish the secreted Reelin cue normally produced by Cajal-Retzius cells in the developing cortical marginal zone and by granule cells in the developing cerebellum. Loss of this ligand deprives postmitotic neurons of the extracellular positioning signal required for terminal somal translocation and inside-out lamination, the proximal trigger of the RELN subtype branch.

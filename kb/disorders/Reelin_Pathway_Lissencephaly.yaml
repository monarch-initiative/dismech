- name: VLDLR Receptor Deficiency
  description: Homozygous loss-of-function variants or whole-gene deletion of VLDLR abolish the cell-surface very low-density lipoprotein receptor on migrating cortical and cerebellar neuroblasts, including migrating Purkinje cells. Because VLDLR serves as one of the two core Reelin receptors (alongside ApoER2/LRP8), receptor loss impairs Reelin-guided neuroblast migration in the cerebral cortex and cerebellum while leaving partial ApoER2-mediated signaling intact, explaining the milder gyral-simplification and inferior cerebellar hypoplasia phenotype of the VLDLR subtype branch.

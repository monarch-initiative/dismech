  description: With Reelin signaling lost, developing cortical neurons fail to complete the glia-independent terminal somal translocation step, retracting or destabilizing leading processes after contact with the marginal zone. This is the central cellular mechanism distinguishing Reelin-pathway lissencephaly from earlier locomotion or microtubule-based migration arrest.

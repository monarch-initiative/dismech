    evidence_source: HUMAN_CLINICAL
    snippet: In the cortex, Cajal-Retzius cells in the preplate secrete reelin to guide the cells of the cortical plate. In the cerebellum, the granule cells secrete reelin, which guides migration of Purkinje cells.
    explanation: Identifies cortical Cajal-Retzius cells and cerebellar granule cells as the cellular sources of secreted Reelin ligand guiding cortical and Purkinje cell migration.

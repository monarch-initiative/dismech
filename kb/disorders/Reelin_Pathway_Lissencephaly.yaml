notes: 'Entry boundary follows the cortical-malformation epic 4098 modeling stance: a dismech entry should correspond to a coherent shared pathomechanism skeleton, here extracellular Reelin signaling / terminal somal translocation failure, rather than MONDO/OMIM granularity. RELN and VLDLR are represented as subtype branches of the shared skeleton. The entry conforms to the reelin_terminal_translocation_lamination_failure module. Created from issue 4081, seeded by Romero, Bahi-Buisson & Francis (Semin Cell Dev Biol 2018) but curated against verified primary papers (Hong et al. 2000; Boycott et al. 2005; Valence et al. 2016; Franco et al. 2011). PubMed GeneReviews searches for Reelin Pathway Lissencephaly and lissencephaly with cerebellar hypoplasia found no GeneReviews baseline article.'
discussions:
- discussion_id: gap_reelin_reeler_mouse_gyrencephaly_mismatch
  prompt: Does the reeler (Reln-null) mouse — the principal animal model of Reelin-pathway disruption — faithfully recapitulate the human RELN/VLDLR lissencephaly-with-cerebellar-hypoplasia (LCH) phenotype, or does the fact that the mouse is a natively lissencephalic (agyric) species, lacking the expanded outer subventricular zone (OSVZ) and outer radial glia (oRG) that drive gyrencephalic cortical expansion in humans, mean that the model captures the inside-out lamination and cerebellar defects but cannot reproduce the human gyral-simplification/pachygyria component of the malformation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cajal-Retzius Reelin Ligand Deficiency
  - pathophysiology#Cortical Lamination and Gyral Simplification
  rationale: 'The reeler mouse establishes the molecular logic of this entry: loss of Reelin causes inverted (outside-in) cortical lamination, cerebellar hypoplasia, and abnormal axonal connectivity, paralleling the human LCH syndrome that defines RELN-related disease. However, the human RELN/VLDLR phenotype additionally includes lissencephaly with markedly simplified gyration (pachygyria), a feature that a baseline-agyric rodent cortex cannot phenocopy because mouse cortical development lacks the human-enriched OSVZ/oRG amplification tier responsible for gyrencephalic surface expansion. Mouse data therefore robustly validate the Reelin-DAB1 signaling lesion and the lamination/terminal-translocation defect, but they systematically underdetermine the severity and gyral pattern of the human cortical malformation. Resolving whether the human gyral-simplification arm is a distinct, human-specific consequence of Reelin loss (versus a quantitative extension of the same lamination defect) is mechanistically meaningful for interpreting model-derived evidence and for module conformance.'
  proposed_experiments:
  - experiment_id: exp_reelin_human_cortical_organoid
    experiment_design: TARGETED_PERTURBATION
    name: RELN- or VLDLR-null human cortical organoid lamination and oRG analysis
    description: Generate isogenic RELN-null or VLDLR-null human iPSC-derived cortical organoids and quantify radial-glia/oRG composition, terminal somal translocation, and inside-out laminar positioning relative to controls, testing whether human-specific outer radial glia behave differently from the apical-progenitor-dominated reeler mouse cortex and whether gyrencephalic surface-area phenotypes emerge only in the human model.
    experiment_type:
      preferred_term: iPSC organoid perturbation assay
    model_systems:
    - name: Human iPSC-derived cortical organoid
      description: Cortical organoid differentiated from gene-edited human iPSCs, preserving human-specific outer radial glia and OSVZ biology absent from the mouse.
      experimental_model_type: ORGANOID
  - experiment_id: exp_reelin_gyrencephalic_ferret
    name: Reelin-pathway perturbation in a gyrencephalic ferret cortex
    description: Disrupt Reelin signaling (RELN or VLDLR) in the developing ferret cortex, a gyrencephalic carnivore model possessing an OSVZ with oRG-like cells, to test whether Reelin loss produces gyral simplification closer to the human LCH phenotype than is seen in the lissencephalic reeler mouse.
    experiment_type:
      preferred_term: in vivo gyrencephalic model study
    model_systems:
    - name: Gyrencephalic ferret cortex
      description: Ferret (Mustela putorius furo) developing cortex, containing a prominent OSVZ with oRG-like progenitors, used as a bridge between the lissencephalic mouse and the gyrencephalic human cortex.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:10973257
    reference_title: Autosomal recessive lissencephaly with cerebellar hypoplasia is associated with human RELN mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: LCH parallels the reeler mouse mutant (Reln(rl)), in which Reln mutations cause cerebellar hypoplasia, abnormal cerebral cortical neuronal migration and abnormal axonal connectivity.
    explanation: Establishes the reeler mouse as the parallel model for human RELN disease, recapitulating cerebellar hypoplasia and disordered cortical migration — the shared arm of the mismatch — while leaving the human gyral phenotype as the divergent feature.
  - reference: PMID:28951247
    reference_title: Genetics and mechanisms leading to human cortical malformations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We finish by describing the advantages of human in vitro cell culture models, to examine human-specific cells and transcripts
    explanation: The Romero et al. review highlights human in vitro models as the route to examine human-specific cortical cells and transcripts that animal models do not reproduce, motivating the proposed organoid resolution of this gap.

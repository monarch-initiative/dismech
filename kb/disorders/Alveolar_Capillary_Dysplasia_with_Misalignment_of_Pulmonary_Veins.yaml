progression:
- phase: Neonatal presentation and death
  notes: >-
    Term infants with normal birth parameters deteriorate within the first day
    of life and almost all die within days to weeks of hypoxaemic respiratory
    failure, despite maximal support including ECMO. Atypical milder cases
    presenting after 24 hours or surviving beyond the neonatal period are
    sporadically described.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Irrespective of the co-morbidities, the mortality of ACD/MPV is almost 100%."
    explanation: >-
      The defining prognostic fact of the disorder.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority succumb to hypoxemic respiratory failure within days to weeks after presentation despite receiving supportive care including extracorporeal membrane oxygenation"
    explanation: >-
      Establishes the mode and timing of death and the failure of maximal
      supportive care.
diagnosis:
- name: Lung biopsy histopathology
  description: >-
    Definitive diagnosis rests on lung histology showing the misaligned pulmonary
    veins within bronchovascular bundles together with a deficient, poorly
    apposed alveolar capillary bed. Historically this was made at autopsy; open
    lung biopsy is used antemortem when the diagnosis would change management.
  diagnosis_term:
    preferred_term: lung biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current gold standard to unambiguously diagnose ACD/MPV is histological examination of the lungs."
    explanation: >-
      States the diagnostic gold standard directly, replacing a sentence about
      the review's own structure.
- name: Molecular testing including copy-number analysis
  description: >-
    Molecular confirmation requires sequencing FOXF1 together with copy-number
    analysis spanning the upstream enhancer region. Sequencing alone will miss
    the substantial fraction of patients whose lesion is an enhancer deletion
    leaving the coding sequence intact.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using custom-designed array comparative genomic hybridization, Sanger sequencing, whole exome sequencing (WES), and bioinformatic analyses, we studied 22 new unrelated families (20 postnatal and two prenatal) with clinically diagnosed ACDMPV."
    explanation: >-
      Documents the combined copy-number and sequencing strategy required to
      detect both lesion classes.
treatments:
- name: Lung transplantation
  description: >-
    The only intervention that alters survival. Everything else is supportive,
    and the pulmonary hypertension is characteristically refractory to
    vasodilator therapy because the vascular bed is absent rather than
    constricted.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Impaired Alveolar Gas Exchange
    treatment_effect: INHIBITS
    description: >-
      Transplant replaces the maldeveloped gas-exchange surface rather than
      addressing the FOXF1 lesion.
  evidence:
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no effective treatments for ACDMPV other than lung transplant, and new therapeutic approaches are urgently needed."
    explanation: >-
      Establishes transplant as the only effective treatment. Tagged OTHER
      because this is the framing sentence of a mouse study rather than a
      clinical result reported by it.
- name: Nanoparticle STAT3 delivery (investigational)
  description: >-
    Not a current therapy. Because FOXF1 drives neonatal lung angiogenesis
    through STAT3, nanoparticle delivery of STAT3 has been proposed as a strategy
    for the subset of ACDMPV with reduced STAT3 signalling. This is preclinical
    and mechanism-directed rather than supportive, which is what makes it notable
    in a disease whose only other option is transplant.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Failed Pulmonary Microvascular Angiogenesis
    treatment_effect: ACTIVATES
    description: >-
      Restoring STAT3 signalling aims to reactivate the angiogenic programme that
      the FOXF1 lesion silenced.
  evidence:
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Nanoparticle delivery of STAT3 is a promising strategy to treat ACDMPV associated with decreased STAT3 signaling."
    explanation: >-
      Identifies the candidate therapeutic direction; the evidence is preclinical
      mouse work, not clinical.
differential_diagnoses:
- name: Idiopathic pulmonary arterial hypertension
  description: >-
    The differential that matters most in practice. ACDMPV presents as severe
    neonatal pulmonary hypertension refractory to vasodilators, which is exactly
    how idiopathic pulmonary hypertension looks at the bedside, and because
    confirmation requires lung biopsy or autopsy the misattribution both delays
    diagnosis and hides cases from incidence estimates.
  disease_term:
    preferred_term: idiopathic pulmonary arterial hypertension
    term:
      id: MONDO:0001999
      label: idiopathic pulmonary arterial hypertension
  distinguishing_features:
  - Misaligned pulmonary veins and a deficient, malpositioned alveolar capillary bed on lung histology
  - A pathogenic FOXF1 coding variant or 16q24.1 deletion spanning the gene or its upstream enhancer
  - Associated gastrointestinal, cardiovascular or urogenital malformations in up to 80% of cases
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is likely that ACD/MPV is underdiagnosed and sometimes misdiagnosed as idiopathic PH due to the lack of autopsies"
    explanation: >-
      Documents the misdiagnosis directly and its effect on ascertainment.
discussions:
- discussion_id: gap_acdmpv_imprinting_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What silences the paternal FOXF1 allele in human lung, and why do a minority
    of pathogenic lesions on the paternal chromosome still cause ACDMPV?
  attaches_to:
  - pathophysiology#Genomic Imprinting of the FOXF1 Locus
  rationale: >-
    Thirty of thirty-one parentally resolved deletions arose on the maternal
    chromosome, which is a strong imprinting signal, yet four families carry
    pathogenic paternal-chromosome lesions. So the paternal allele is neither
    fully silenced nor fully active. The imprinting control element, the tissue
    and developmental window over which it operates, and what determines
    escape are all unresolved. This matters practically because it governs
    recurrence counselling and the interpretation of an apparently benign
    paternal deletion found incidentally.
  proposed_experiments:
  - experiment_id: exp_acdmpv_allele_specific_lung_expression
    name: Allele-specific FOXF1 expression across human fetal lung development
    description: >-
      Perform allele-specific expression and methylation profiling across the
      16q24.1 locus in human fetal lung at successive gestational ages, in
      parallel with the same measurements in intestine and heart, to map where
      and when the imprint is established and whether escape correlates with
      lesion position relative to the enhancer.
    decision_criterion: >-
      A developmental window or lesion-position dependence that separates the
      four paternal cases from the maternal majority would define the escape
      condition.
    would_support:
    - Paternal silencing is partial and window-dependent, so paternal lesions cause disease when they remove enhancer sequence needed by both alleles
    would_refute:
    - Paternal silencing is uniform, implicating a second modifier locus in the escape cases
- discussion_id: gap_acdmpv_developmental_window_for_rescue
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any postnatal window in which restoring FOXF1 or STAT3 signalling
    can build a functional alveolar capillary bed, or is the defect fixed before
    birth?
  attaches_to:
  - pathophysiology#Failed Pulmonary Microvascular Angiogenesis
  - pathophysiology#Impaired Alveolar Gas Exchange
  rationale: >-
    The STAT3 nanoparticle strategy presupposes that neonatal lung angiogenesis
    is still tractable after birth, and FOXF1 is described as stimulating
    neonatal rather than purely fetal angiogenesis, which is encouraging. But
    ACDMPV also involves a fixed architectural error, the misalignment of the
    pulmonary veins, which no angiogenic stimulus can re-route. Whether restoring
    capillary density in a lung with misaligned veins yields usable gas exchange
    is the question that determines whether any medical therapy is possible at
    all, or whether transplant will remain the only option.
  proposed_experiments:
  - experiment_id: exp_acdmpv_postnatal_rescue_window
    name: Staged postnatal STAT3 restoration in the Foxf1 S52F knock-in mouse
    description: >-
      Deliver STAT3 to Foxf1 S52F knock-in mice at a series of postnatal
      timepoints and measure capillary density, capillary-to-epithelium
      apposition, venous position, pulmonary artery pressure and survival, to
      establish whether a rescue window exists and whether corrected capillary
      density is sufficient without corrected venous anatomy.
    decision_criterion: >-
      Survival benefit with restored gas exchange despite persistent venous
      misalignment would show the capillary deficit is the rate-limiting lesion.
    would_support:
    - Capillary density is rate-limiting and postnatal angiogenic rescue is viable
    would_refute:
    - Venous misalignment alone sustains lethal physiology, confining treatment to transplant
references:
- reference: PMID:27071622
  title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins"
- reference: PMID:30058937
  title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects"

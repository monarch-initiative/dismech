    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous point mutations in FOXF1 (OMIM 601089) and genomic deletion copy-number variants (CNVs) at chromosomal region 16q24.1 including FOXF1 or its upstream regulatory region have been identified in the vast majority of patients with ACDMPV"
    explanation: >-
      Human genetic evidence establishes FOXF1 sequence variants and locus
      deletions as the recurrent cause of ACDMPV.
- name: ESRP1
  gene_term:
    preferred_term: ESRP1
    term:
      id: hgnc:25966
      label: ESRP1
  association: Candidate Gene
  relationship_type: UNKNOWN
  notes: >-
    A single de novo missense variant reported in one ACDMPV family, raising the
    possibility of FGF signalling involvement. Recorded as UNKNOWN rather than
    DISPUTED because it is unreplicated rather than actively refuted. The
    candidacy is weaker than a single variant implies: ESRP1 was one of four de
    novo variants in that proband and the authors did not establish which, if
    any, was causal.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in one family, WES revealed a de novo missense variant in ESRP1, potentially implicating FGF signaling in the etiology of ACDMPV"
    explanation: >-
      The authors themselves frame this as a single-family, potential
      implication, so the association is recorded as partial and unknown.
histopathology:
- name: Reduced and malpositioned alveolar capillaries
  description: >-
    The diagnostic microscopic picture: diffuse thickening of the interalveolar
    septa with a marked reduction in alveolar capillaries, and the few
    capillaries that are present sitting away from the alveolar epithelium,
    which is itself composed predominantly of hyperplastic cuboidal type 2
    pneumocytes rather than the flattened type 1 cells needed for gas exchange.
  diagnostic: true
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lung tissue is characterized by diffuse thickening of interalveolar septa and marked reduction of pulmonary alveolar capillaries"
    explanation: >-
      The core histological finding on which the diagnosis rests.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these scanty alveolar capillaries are located away from the alveolar epithelium which is predominantly composed of hyperplastic cuboidal type 2 pneumocytes"
    explanation: >-
      Documents both the malposition of the capillaries and the type 2
      pneumocyte hyperplasia of the overlying epithelium.
- name: Muscularized peripheral pulmonary arteries
  description: >-
    The walls of small peripheral pulmonary arteries are thickened by
    hypertrophic medial smooth muscle, the structural correlate of the raised
    pulmonary vascular resistance.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the walls of small peripheral pulmonary arteries are thickened due to hypertrophic smooth muscle cells in the media"
    explanation: >-
      Histological basis for the arteriolar contribution to raised resistance.
- name: Misaligned pulmonary veins in the bronchovascular bundle
  description: >-
    Pulmonary veins sit in the bronchovascular bundle beside the arteries
    instead of within the interlobular septa. This is the eponymous finding and
    what a pathologist looks for to confirm the diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of ACD/MPV patients present with peripheral veins in the bronchovascular bundle adjacent to the pulmonary arteries outside the interlobular septa while normally they are located within the septa"
    explanation: >-
      Defines the misalignment lesion against its normal comparator.
- name: Aberrant intrapulmonary arteriovenous vessels
  description: >-
    Marked aberrant arteriovenous vessels within the lung are reported in cases
    with atypical clinical presentations. This finding is distinct from the
    focal-versus-diffuse distribution of classic ACDMPV lesions.
  evidence:
  - reference: PMID:32949727
    reference_title: "Histopathologic features of alveolar capillary dysplasia with misalignment of pulmonary veins with atypical clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marked intrapulmonary aberrant arteriovenous vessels were present in all atypical cases."
    explanation: >-
      Directly documents the vascular finding in the clinically atypical
      subgroup without conflating it with patchy histologic distribution.
prevalence:
- population: Manitoba, Canada (autopsy-based)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  notes: >-
    Estimated from two ACD/MPV cases among 226 infants autopsied over ten years
    against 170,000 deliveries. An independent Dutch estimate gives 1/200,000,
    and both are likely underestimates: diagnosis requires autopsy or biopsy,
    and the review notes the disorder is underdiagnosed and sometimes
    misdiagnosed as idiopathic pulmonary hypertension.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on this study, the incidence can be estimated at approximately 1/100,000."
    explanation: >-
      The autopsy-based Manitoba incidence estimate.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In The Netherlands, the incidence can be estimated at 1/200,000"
    explanation: >-
      An independent national estimate, roughly half the Manitoba figure,
      illustrating the ascertainment uncertainty.
progression:
- phase: Neonatal presentation and death
  notes: >-
    Term infants with normal birth parameters deteriorate within the first day
    of life and almost all die within days to weeks of hypoxaemic respiratory
    failure, despite maximal support including ECMO. Atypical milder cases
    presenting after 24 hours or surviving beyond the neonatal period are
    sporadically described.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Irrespective of the co-morbidities, the mortality of ACD/MPV is almost 100%."
    explanation: >-
      The defining prognostic fact of the disorder.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority succumb to hypoxemic respiratory failure within days to weeks after presentation despite receiving supportive care including extracorporeal membrane oxygenation"
    explanation: >-
      Establishes the mode and timing of death and the failure of maximal
      supportive care.
- phase: Atypical delayed presentation and prolonged survival
  notes: >-
    A minority present after the neonatal period and can survive long enough for
    transplantation, so neonatal presentation and lethality must not be treated
    as universal diagnostic criteria.
  evidence:
  - reference: PMID:29198536
    reference_title: "Infants with Atypical Presentations of Alveolar Capillary Dysplasia with Misalignment of the Pulmonary Veins Who Underwent Bilateral Lung Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three other infants had no respiratory symptoms at birth and presented with hypoxemia and pulmonary hypertension at 2-3 months of age."
    explanation: >-
      Documents delayed presentation in a transplant cohort with atypical
      ACDMPV.
diagnosis:
- name: Lung biopsy histopathology
  description: >-
    Definitive diagnosis rests on lung histology showing the misaligned pulmonary
    veins within bronchovascular bundles together with a deficient, poorly
    apposed alveolar capillary bed. Historically this was made at autopsy; open
    lung biopsy is used antemortem when the diagnosis would change management.
    Focal or patchy disease can produce a false-negative single-site biopsy.
  diagnosis_term:
    preferred_term: lung biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current gold standard to unambiguously diagnose ACD/MPV is histological examination of the lungs."
    explanation: >-
      States the diagnostic gold standard directly, replacing a sentence about
      the review's own structure.
  - reference: PMID:32949727
    reference_title: "Histopathologic features of alveolar capillary dysplasia with misalignment of pulmonary veins with atypical clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 16 cases exhibited classic diffuse abnormalities, while 6 of 16 had a nonclassic focal/patchy distribution."
    explanation: >-
      Establishes sampling limitations for biopsy and the need to recognize
      nonuniform histology.
  - reference: PMID:32949727
    reference_title: "Histopathologic features of alveolar capillary dysplasia with misalignment of pulmonary veins with atypical clinical presentation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical presentation is not always correlated with histopathology in ACD/MPV."
    explanation: >-
      Establishes that focal or patchy histology is an independent diagnostic
      axis and must not be assumed from delayed clinical presentation.
- name: Molecular testing including copy-number analysis
  description: >-
    Molecular confirmation requires sequencing FOXF1 together with copy-number
    analysis spanning the upstream enhancer region. Sequencing alone will miss
    the substantial fraction of patients whose lesion is an enhancer deletion
    leaving the coding sequence intact.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous point mutations in FOXF1 (OMIM 601089) and genomic deletion copy-number variants (CNVs) at chromosomal region 16q24.1 including FOXF1 or its upstream regulatory region have been identified in the vast majority of patients with ACDMPV"
    explanation: >-
      Establishes that both sequence variants and copy-number changes involving
      the distant regulatory region must be covered by molecular testing.
treatments:
- name: Supportive cardiorespiratory care, pulmonary vasodilators, and ECMO
  description: >-
    Mechanical ventilation, inhaled nitric oxide and other pulmonary
    vasodilators can transiently stabilize oxygenation, while ECMO may provide
    short-term rescue or a bridge to transplantation. These measures do not
    correct the malformed capillary bed, and most infants with classic ACDMPV
    cannot be weaned from escalating support.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Increased Pulmonary Vascular Resistance
    treatment_effect: MODULATES
    description: >-
      Pulmonary vasodilators can temporarily reduce vascular resistance but do
      not replace the missing distal capillary bed.
  - target: Impaired Alveolar Gas Exchange
    treatment_effect: BYPASSES
    description: >-
      ECMO temporarily provides extracorporeal oxygenation while diagnosis or
      transplant candidacy is established.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the short term, this can improve the saturation levels, but literature shows that the dosage needs to be increased repeatedly and that eventually the severe hypoxemia will be fatal."
    explanation: >-
      Establishes that vasodilator benefit is temporary rather than
      disease-modifying.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ECMO therapy can provide an excellent bridge to lung transplantation in ACD/MPV patients with a mild phenotype."
    explanation: >-
      Supports the restricted bridging role of ECMO in selected patients.
- name: Lung transplantation
  description: >-
    The only disease-modifying intervention with published long-term survival,
    and an option only for selected infants—principally those with an atypical,
    slower course who can reach transplantation. Vasodilators and ECMO remain
    supportive or bridging measures rather than repairs of the malformed lung.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Impaired Alveolar Gas Exchange
    treatment_effect: BYPASSES
    description: >-
      Transplant replaces the maldeveloped gas-exchange surface rather than
      addressing the FOXF1 lesion.
  evidence:
  - reference: PMID:29198536
    reference_title: "Infants with Atypical Presentations of Alveolar Capillary Dysplasia with Misalignment of the Pulmonary Veins Who Underwent Bilateral Lung Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three transplanted children are alive at 5-16 years of age, similar to outcomes for infants transplanted for other indications."
    explanation: >-
      Directly documents durable post-transplant survival in selected infants
      with atypical ACDMPV.
- name: Nanoparticle STAT3 delivery (investigational)
  description: >-
    Not a current therapy. Because FOXF1 drives neonatal lung angiogenesis
    through STAT3, nanoparticle delivery of STAT3 has been proposed as a strategy
    for the subset of ACDMPV with reduced STAT3 signalling. This is preclinical
    and mechanism-directed rather than supportive, which is what makes it notable
    in a disease whose only other option is transplant.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failed Pulmonary Microvascular Angiogenesis
    treatment_effect: RESTORES
    description: >-
      Restoring STAT3 signalling aims to reactivate the angiogenic programme that
      the FOXF1 lesion silenced.
  evidence:
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Nanoparticle delivery of STAT3 is a promising strategy to treat ACDMPV associated with decreased STAT3 signaling."
    explanation: >-
      Identifies the candidate therapeutic direction; the evidence is preclinical
      mouse work, not clinical.
differential_diagnoses:
- name: Idiopathic pulmonary arterial hypertension
  description: >-
    The differential that matters most in practice. ACDMPV presents as severe
    neonatal pulmonary hypertension refractory to vasodilators, which is exactly
    how idiopathic pulmonary hypertension looks at the bedside, and because
    confirmation requires lung biopsy or autopsy the misattribution both delays
    diagnosis and hides cases from incidence estimates.
  disease_term:
    preferred_term: idiopathic pulmonary arterial hypertension
    term:
      id: MONDO:0001999
      label: idiopathic pulmonary arterial hypertension
  distinguishing_features:
  - Misaligned pulmonary veins and a deficient, malpositioned alveolar capillary bed on lung histology
  - A pathogenic FOXF1 coding variant or 16q24.1 deletion spanning the gene or its upstream enhancer
  - Associated gastrointestinal, cardiovascular or urogenital malformations in up to 80% of cases
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is likely that ACD/MPV is underdiagnosed and sometimes misdiagnosed as idiopathic PH due to the lack of autopsies"
    explanation: >-
      Documents the misdiagnosis directly and its effect on ascertainment.
discussions:
- discussion_id: gap_acdmpv_imprinting_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What molecular mechanism creates parent-specific activity across the two
    FOXF1 enhancer units, and how does it vary by lung cell type and
    developmental stage?
  attaches_to:
  - pathophysiology#Parent-Specific FOXF1 Enhancer Activity
  rationale: >-
    Thirty of thirty-one parentally resolved deletions arose on the maternal
    chromosome, yet paternal-chromosome pathogenic lesions occur and FOXF1 is
    transcribed from both alleles. Methylation data exclude a simple maternal
    enhancer-imprinting model, while later work proposes a bipartite enhancer
    with opposing parent-specific activity. Resolving the mechanism matters for
    recurrence counselling and interpretation of inherited enhancer variants.
  evidence:
  - reference: PMID:34325731
    reference_title: "Genome wide DNA methylation analysis of alveolar capillary dysplasia lung tissue reveals aberrant methylation of genes involved in development including the FOXF1 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FOXF1 seems to be similarly transcribed from both alleles, which opposes imprinting of the FOXF1 transcription region itself"
    explanation: >-
      Shows why complete paternal-locus silencing is not an adequate model.
  - reference: PMID:37865798
    reference_title: "Further refinement of the differentially methylated distant lung-specific FOXF1 enhancer in a neonate with alveolar capillary dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, we proposed bimodal structure and parental functional dimorphism of the lung-specific FOXF1 enhancer, with Unit 1 having higher activity on the paternal chr16 and Unit 2 on the maternal chr16."
    explanation: >-
      Defines the more specific emerging model that future experiments need to
      test.
  proposed_experiments:
  - experiment_id: exp_acdmpv_allele_specific_lung_expression
    name: Allele-specific FOXF1 expression across human fetal lung development
    description: >-
      Perform allele-specific expression and methylation profiling across the
      16q24.1 locus in human fetal lung at successive gestational ages, in
      parallel with the same measurements in intestine and heart, to map where
      and when enhancer-unit asymmetry is established and whether effect size
      correlates with deletion position.
    decision_criterion: >-
      Reproducible parent-specific expression and chromatin activity that maps
      separately to enhancer Units 1 and 2 would support functional dimorphism.
    supporting_outcome:
    - Parent-specific enhancer-unit activity is cell-type- and developmental-stage-dependent
    refuting_outcome:
    - Both enhancer units have equivalent activity on maternal and paternal chromosomes
- discussion_id: gap_acdmpv_developmental_window_for_rescue
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any postnatal window in which restoring FOXF1 or STAT3 signalling
    can build a functional alveolar capillary bed, or is the defect fixed before
    birth?
  attaches_to:
  - pathophysiology#Failed Pulmonary Microvascular Angiogenesis
  - pathophysiology#Impaired Alveolar Gas Exchange
  rationale: >-
    The STAT3 nanoparticle strategy presupposes that neonatal lung angiogenesis
    is still tractable after birth, and FOXF1 is described as stimulating
    neonatal rather than purely fetal angiogenesis, which is encouraging. But
    ACDMPV also involves a fixed architectural error, the misalignment of the
    pulmonary veins, which no angiogenic stimulus can re-route. Whether restoring
    capillary density in a lung with misaligned veins yields usable gas exchange
    is the question that determines whether any medical therapy is possible at
    all, or whether transplant will remain the only option.
  proposed_experiments:
  - experiment_id: exp_acdmpv_postnatal_rescue_window
    name: Staged postnatal STAT3 restoration in the Foxf1 S52F knock-in mouse
    description: >-
      Deliver STAT3 to Foxf1 S52F knock-in mice at a series of postnatal
      timepoints and measure capillary density, capillary-to-epithelium
      apposition, venous position, pulmonary artery pressure and survival, to
      establish whether a rescue window exists and whether corrected capillary
      density is sufficient without corrected venous anatomy.
    decision_criterion: >-
      Survival benefit with restored gas exchange despite persistent venous
      misalignment would show the capillary deficit is the rate-limiting lesion.
    supporting_outcome:
    - Capillary density is rate-limiting and postnatal angiogenic rescue is viable
    refuting_outcome:
    - Venous misalignment alone sustains lethal physiology, confining treatment to transplant
- discussion_id: gap_acdmpv_direction_of_angiogenic_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should experimental therapy restore capillary angiogenesis through STAT3,
    or suppress maladaptive intussusceptive angiogenesis and TIE2 signalling?
  attaches_to:
  - pathophysiology#Failed Pulmonary Microvascular Angiogenesis
  rationale: >-
    STAT3 delivery restored endothelial proliferation and stimulated lung
    angiogenesis in one Foxf1 S52F neonatal mouse model. Human ACD lung tissue,
    however, shows abundant intussusceptive angiogenesis with increased CXCR4,
    HIF1A and angiopoietin signalling and has prompted the opposite therapeutic
    proposal—anti-angiogenic intervention. These findings may reflect different
    vessel compartments, disease stages or productive versus nonproductive
    angiogenesis; treating them as interchangeable would be unsafe.
  evidence:
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "nanoparticle delivery of STAT3 cDNA into the neonatal circulation restored endothelial proliferation and stimulated lung angiogenesis in Foxf1WT/S52F mice."
    explanation: >-
      Supports pro-angiogenic rescue in a specific neonatal knock-in model.
  - reference: PMID:35649494
    reference_title: "A Morphomolecular Approach to Alveolar Capillary Dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "ACD is characterized by dysfunctional capillaries and a high prevalence of intussusceptive angiogenesis."
    explanation: >-
      Human tissue shows that abundant angiogenic activity can coexist with a
      dysfunctional capillary network, complicating simple pro-angiogenic rescue.
  - reference: PMID:35649494
    reference_title: "A Morphomolecular Approach to Alveolar Capillary Dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Future studies should address the use of anti-angiogenic agents in ACD, where TIE2 appears as a promising target."
    explanation: >-
      Directly supports the anti-angiogenic/TIE2 arm as a proposal for future
      study, not an established treatment.
  proposed_experiments:
  - experiment_id: exp_acdmpv_compartment_resolved_angiogenic_rescue
    name: Compartment-resolved comparison of pro- and anti-angiogenic intervention
    description: >-
      Compare STAT3 restoration with selective CXCR4 or TIE2 modulation in
      patient-derived vascular organoids and Foxf1 S52F mice, separating
      alveolar capillary endothelial cells, systemic bronchial endothelium and
      intussusceptive pillars over developmental time.
    decision_criterion: >-
      A useful intervention must increase correctly apposed alveolar capillaries
      and gas exchange without expanding dysfunctional bronchial or
      intussusceptive vessels.
    supporting_outcome:
    - Productive capillary differentiation, rather than total angiogenic activity, is the therapeutic target
    refuting_outcome:
    - Total angiogenic activity alone predicts restoration of gas exchange

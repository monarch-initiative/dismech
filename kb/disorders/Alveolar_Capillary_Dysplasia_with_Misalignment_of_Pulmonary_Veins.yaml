  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  notes: >-
    Estimated from two ACD/MPV cases among 226 infants autopsied over ten years
    against 170,000 deliveries. An independent Dutch estimate gives 1/200,000,
    and both are likely underestimates: diagnosis requires autopsy or biopsy,
    and the review notes the disorder is underdiagnosed and sometimes
    misdiagnosed as idiopathic pulmonary hypertension.

name: Alveolar capillary dysplasia with misalignment of pulmonary veins
creation_date: "2026-08-01T05:14:29Z"
description: >-
  Alveolar capillary dysplasia with misalignment of pulmonary veins (ACDMPV) is a
  lethal congenital lung developmental disorder caused by loss of the mesenchymal
  transcription factor FOXF1 or of its distant upstream lung enhancer. The
  alveolar capillary bed fails to form and appose itself to the alveolar
  epithelium, and pulmonary veins run misplaced alongside the arteries in the
  bronchovascular bundle rather than in the interlobular septa. Term infants
  present within hours to days with refractory hypoxaemia and suprasystemic
  pulmonary hypertension. Two features make it unusual among Mendelian disorders:
  the causal lesion is very often a deletion of a non-coding enhancer rather than
  of the gene itself, and the pathogenic events are overwhelmingly de novo on the
  maternally inherited chromosome, implicating genomic imprinting.
category: Mendelian
parents:
- congenital lung disorder
- autosomal dominant disease
synonyms:
- ACDMPV
- ACD/MPV
- alveolar capillary dysplasia
- congenital alveolar capillary dysplasia
disease_term:
  preferred_term: alveolar capillary dysplasia with misalignment of pulmonary veins
  term:
    id: MONDO:0009934
    label: alveolar capillary dysplasia with misalignment of pulmonary veins
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    ACDMPV results from heterozygous point mutations or deletion copy-number
    variants at the FOXF1 locus, so inheritance is formally autosomal dominant,
    but essentially all cases are de novo and parental transmission is
    exceptional given the lethality.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: "Essentially all reported cases are de novo"
  parent_of_origin_effect: >-
    Maternal-allele bias from imprinting of the FOXF1 locus in lung: 30 of 31
    parentally resolved pathogenic 16q24.1 deletions arose on the maternally
    inherited chromosome 16. Four families with pathogenic paternal-chromosome
    lesions are known, so the imprint is not absolute.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alveolar capillary dysplasia with misalignment of pulmonary veins (ACDMPV) is a lethal lung developmental disorder caused by heterozygous point mutations or genomic deletion copy-number variants (CNVs) of FOXF1 or its upstream enhancer involving fetal lung-expressed long noncoding RNA genes LINC01081 and LINC01082."
    explanation: >-
      Establishes heterozygous coding and enhancer lesions at the FOXF1 locus as
      the cause, including the long non-coding RNA enhancer element.
pathophysiology:
- name: FOXF1 Coding or Upstream Enhancer Lesion
  biological_scale: MOLECULAR
  description: >-
    The causal lesion is either a heterozygous point mutation in FOXF1 itself or,
    frequently, a deletion of the distant upstream enhancer region at 16q24.1
    that contains the fetal lung-expressed long non-coding RNA genes LINC01081
    and LINC01082. The enhancer route is what makes exome-only testing an
    incomplete strategy here: the coding sequence can be entirely normal while
    the gene is functionally silenced in lung.
  genes:
  - preferred_term: FOXF1
    term:
      id: hgnc:3809
      label: FOXF1
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe novel deletion CNVs at the FOXF1 locus in 13 unrelated ACDMPV patients."
    explanation: >-
      Documents the deletion copy-number variant class at the FOXF1 locus in a
      large ACDMPV series.
  downstream:
  - target: Loss of Mesenchymal FOXF1 Transcriptional Output
    description: >-
      Either lesion class reduces FOXF1 protein available to drive its
      transcriptional programme in lung mesenchyme.
- name: Genomic Imprinting of the FOXF1 Locus
  biological_scale: MOLECULAR
  description: >-
    A striking parent-of-origin effect: of 31 pathogenic 16q24.1 deletions with
    determined parental origin, all arose de novo and 30 were on the maternally
    inherited chromosome 16. The paternal allele appears to be silenced in human
    lung, so only a maternally inherited hit removes the expressed copy. A small
    number of paternal-chromosome cases exist, so the imprint is not absolute.
    This also explains why maternal uniparental disomy 16 shares key phenotypic
    features.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all 31 genomic deletions in 16q24.1, pathogenic for ACDMPV, for which parental origin was determined, arose de novo with 30 of them occurring on the maternally inherited chromosome 16, strongly implicating genomic imprinting of the FOXF1 locus in human lungs"
    explanation: >-
      Quantifies the parent-of-origin skew that implicates imprinting at the
      FOXF1 locus.
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, we have also identified four ACDMPV families with the pathogenic variants in the FOXF1 locus that arose on paternal chromosome 16."
    explanation: >-
      Qualifies the imprinting model: a minority of pathogenic lesions arise on
      the paternal chromosome, so silencing is incomplete.
  downstream:
  - target: FOXF1 Coding or Upstream Enhancer Lesion
    description: >-
      The imprint gates the lesion rather than following from it: silencing of
      the paternal allele in lung is what makes a maternally inherited hit
      sufficient to cause disease.
  - target: Loss of Mesenchymal FOXF1 Transcriptional Output
    description: >-
      A maternally inherited lesion removes the transcriptionally active copy in
      lung.
- name: Loss of Mesenchymal FOXF1 Transcriptional Output
  biological_scale: CELLULAR
  description: >-
    FOXF1 is expressed in lung mesenchyme and endothelium and drives the
    angiogenic programme that builds the pulmonary microvasculature. Mouse
    haploinsufficiency reproduces alveolar capillary dysplasia together with
    intestinal and gall bladder maldevelopment, matching the extrapulmonary
    anomalies seen in patients.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25091710
    reference_title: "FOXF1 transcription factor is required for formation of embryonic vasculature by regulating VEGF signaling in endothelial cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, haploinsufficiency of the Foxf1 gene causes alveolar capillary dysplasia and developmental defects in lung, intestinal, and gall bladder morphogenesis."
    explanation: >-
      Model-organism evidence that FOXF1 dosage reduction is sufficient to cause
      the pulmonary and extrapulmonary phenotype.
  - reference: PMID:25091710
    reference_title: "FOXF1 transcription factor is required for formation of embryonic vasculature by regulating VEGF signaling in endothelial cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FOXF1 transcription factor is required for formation of embryonic vasculature by regulating VEGF signaling in endothelial cells."
    explanation: >-
      Identifies VEGF signalling in endothelium as the transcriptional output
      through which FOXF1 builds the vasculature.
  downstream:
  - target: Failed Pulmonary Microvascular Angiogenesis
    description: >-
      Loss of the FOXF1-driven angiogenic programme prevents formation of the
      alveolar capillary network.
  - target: Misalignment of Pulmonary Veins
    description: >-
      The same mesenchymal patterning programme positions the pulmonary veins,
      so its loss misplaces them into the bronchovascular bundle.
- name: Failed Pulmonary Microvascular Angiogenesis
  biological_scale: TISSUE
  description: >-
    The alveolar capillary bed fails to form in adequate density and, critically,
    fails to appose itself to the alveolar epithelium. FOXF1 acts through STAT3
    to drive neonatal lung angiogenesis, and a knock-in mouse carrying the human
    S52F FOXF1 mutation recapitulates the histopathology, establishing that a
    single patient allele is sufficient.
  biological_processes:
  - preferred_term: angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DECREASED
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "FOXF1 acts through STAT3 to stimulate neonatal lung angiogenesis."
    explanation: >-
      Identifies STAT3 as the signalling intermediary through which FOXF1 drives
      neonatal lung angiogenesis.
  - reference: PMID:31199666
    reference_title: "The S52F FOXF1 Mutation Inhibits STAT3 Signaling and Causes Alveolar Capillary Dysplasia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated a clinically relevant mouse model of ACDMPV by introducing the S52F FOXF1 mutation into the mouse Foxf1 gene locus using CRISPR/Cas9 technology."
    explanation: >-
      Establishes a knock-in model carrying an actual patient allele rather than
      a generic null.
  downstream:
  - target: Impaired Alveolar Gas Exchange
    description: >-
      A capillary bed that is sparse and not apposed to alveolar epithelium
      cannot support gas exchange.
  - target: Increased Pulmonary Vascular Resistance
    description: >-
      An absent distal capillary bed and abnormally muscularized arterioles raise
      resistance across the pulmonary circulation.
- name: Misalignment of Pulmonary Veins
  biological_scale: TISSUE
  description: >-
    The eponymous and diagnostically decisive lesion: pulmonary veins run
    anomalously within the bronchovascular bundle alongside the arteries, instead
    of in the interlobular septa where they belong. It is a patterning failure of
    the same mesenchymal programme, and it is what a pathologist looks for to
    confirm the diagnosis on lung biopsy or at autopsy.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of ACD/MPV patients present with peripheral veins in the bronchovascular bundle adjacent to the pulmonary arteries outside the interlobular septa while normally they are located within the septa"
    explanation: >-
      States the misalignment lesion directly, including the normal comparator,
      rather than implying it from a general definition of the disorder.
- name: Impaired Alveolar Gas Exchange
  biological_scale: ORGANISM
  description: >-
    Because the capillaries are neither numerous enough nor close enough to the
    alveolar epithelium, the diffusion barrier is effectively unusable. This
    produces the refractory hypoxaemia that does not respond to ventilation or
    oxygen, and is the reason ACDMPV is fatal without transplant.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these scanty alveolar capillaries are located away from the alveolar epithelium"
    explanation: >-
      The decisive histological fact for gas exchange: the capillaries that do
      form are not apposed to the alveolar epithelium.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of alveolar capillary dysplasia with misalignment of the pulmonary veins (ACD/MPV) is characterized by respiratory distress and cyanosis caused by severe pulmonary hypertension (PH) and insufficient oxygen uptake"
    explanation: >-
      Human clinical description of the presenting picture, replacing a
      background sentence previously borrowed from a mouse study.
- name: Increased Pulmonary Vascular Resistance
  biological_scale: ORGANISM
  conforms_to: "pulmonary_vascular_remodeling#Increased Pulmonary Vascular Resistance"
  description: >-
    ACDMPV enters the conserved pulmonary hypertension pathway at this node
    rather than at its usual trigger. In the module, raised resistance follows
    obstructive remodeling of a vascular bed that formed normally and then
    degenerated; in ACDMPV the distal bed was never built, so the substitution is
    developmental absence in place of acquired obstruction, with muscularized
    arterioles compounding it.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the walls of small peripheral pulmonary arteries are thickened due to hypertrophic smooth muscle cells in the media"
    explanation: >-
      Human histological evidence for the arteriolar muscularization that
      compounds the resistance rise; the resistance measurement itself is
      supplied by the conserved module, hence PARTIAL.
  downstream:
  - target: Suprasystemic Pulmonary Arterial Hypertension
    description: >-
      Raised resistance across an absent distal bed drives pulmonary artery
      pressure above systemic.
- name: Suprasystemic Pulmonary Arterial Hypertension
  biological_scale: ORGANISM
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Arterial Hypertension"
  biological_processes:
  - preferred_term: cardiac muscle hypertrophy
    term:
      id: GO:0003300
      label: cardiac muscle hypertrophy
    modifier: INCREASED
  description: >-
    Severe, typically suprasystemic pulmonary arterial hypertension with
    right-to-left shunting, presenting within hours to days of birth in a term
    infant and characteristically refractory to inhaled nitric oxide and other
    pulmonary vasodilators, because the problem is a missing vascular bed rather
    than a constricted one.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority succumb to hypoxemic respiratory failure within days to weeks after presentation despite receiving supportive care including extracorporeal membrane oxygenation"
    explanation: >-
      Human outcome data showing that maximal supportive care, including ECMO,
      does not overcome the physiology.

name: Alveolar capillary dysplasia with misalignment of pulmonary veins
creation_date: "2026-08-01T05:14:29Z"
description: >-
  Alveolar capillary dysplasia with misalignment of pulmonary veins (ACDMPV) is a
  lethal congenital lung developmental disorder caused by loss of the mesenchymal
  transcription factor FOXF1 or of its distant upstream lung enhancer. The
  alveolar capillary bed fails to form and appose itself to the alveolar
  epithelium, and pulmonary veins run misplaced alongside the arteries in the
  bronchovascular bundle rather than in the interlobular septa. Term infants
  present within hours to days with refractory hypoxaemia and severe
  pulmonary hypertension. Two features make it unusual among Mendelian disorders:
  many causal lesions are deletions of a non-coding enhancer rather than of the
  gene itself. Enhancer deletions show a strong maternal-chromosome bias, but
  current evidence supports parent-specific enhancer activity rather than simple
  silencing of the entire paternal FOXF1 locus.
category: Mendelian
parents:
- congenital lung disorder
- autosomal dominant disease
synonyms:
- ACDMPV
- ACD/MPV
- alveolar capillary dysplasia
- congenital alveolar capillary dysplasia
disease_term:
  preferred_term: alveolar capillary dysplasia with misalignment of pulmonary veins
  term:
    id: MONDO:0009934
    label: alveolar capillary dysplasia with misalignment of pulmonary veins
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    ACDMPV results from heterozygous FOXF1 sequence variants or deletion
    copy-number variants affecting FOXF1 or its distant enhancer, so inheritance
    is formally autosomal dominant. Most affected children have a de novo lesion,
    although parental transmission from an unaffected or mosaic parent and
    familial recurrence are documented.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    All 31 parentally resolved pathogenic 16q24.1 deletions in the cited cohort
    were de novo; this estimate does not apply to every FOXF1 sequence variant.
  parent_of_origin_effect: >-
    Thirty of 31 parentally resolved pathogenic 16q24.1 deletions arose on the
    maternally inherited chromosome 16. This strongly supports parent-specific
    regulation of the distant enhancer, but it does not establish complete
    paternal-allele silencing: pathogenic paternal-chromosome lesions occur,
    FOXF1 is transcribed from both alleles, and enhancer methylation studies do
    not support a simple whole-locus imprinting model.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alveolar capillary dysplasia with misalignment of pulmonary veins (ACDMPV) is a lethal lung developmental disorder caused by heterozygous point mutations or genomic deletion copy-number variants (CNVs) of FOXF1 or its upstream enhancer involving fetal lung-expressed long noncoding RNA genes LINC01081 and LINC01082."
    explanation: >-
      Establishes heterozygous coding and enhancer lesions at the FOXF1 locus as
      the cause, including the long non-coding RNA enhancer element.
mechanistic_hypotheses:
- hypothesis_group_id: parent_specific_foxf1_enhancer_activity
  hypothesis_label: Parent-Specific FOXF1 Enhancer Activity
  status: EMERGING
  description: >-
    The marked maternal-chromosome bias of pathogenic enhancer deletions is best
    treated as evidence for parent-specific functional asymmetry within the
    bipartite lung enhancer, not as proof that the paternal FOXF1 allele is
    globally silenced. Unit 1 may be more active on paternal chromosome 16 and
    Unit 2 on maternal chromosome 16; the molecular basis, developmental window,
    and penetrance of this asymmetry remain unresolved.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all 31 genomic deletions in 16q24.1, pathogenic for ACDMPV, for which parental origin was determined, arose de novo with 30 of them occurring on the maternally inherited chromosome 16, strongly implicating genomic imprinting of the FOXF1 locus in human lungs"
    explanation: >-
      Establishes the parent-of-origin skew that motivated the hypothesis.
  - reference: PMID:34325731
    reference_title: "Genome wide DNA methylation analysis of alveolar capillary dysplasia lung tissue reveals aberrant methylation of genes involved in development including the FOXF1 locus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "FOXF1 seems to be similarly transcribed from both alleles, which opposes imprinting of the FOXF1 transcription region itself"
    explanation: >-
      Refutes the simple model of whole-locus or complete paternal-allele
      silencing while leaving enhancer-specific asymmetry possible.
  - reference: PMID:37865798
    reference_title: "Further refinement of the differentially methylated distant lung-specific FOXF1 enhancer in a neonate with alveolar capillary dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, we proposed bimodal structure and parental functional dimorphism of the lung-specific FOXF1 enhancer, with Unit 1 having higher activity on the paternal chr16 and Unit 2 on the maternal chr16."
    explanation: >-
      Provides a more specific, testable parent-dependent enhancer model, but
      does not establish complete allelic silencing.
pathophysiology:
- name: FOXF1 Coding or Upstream Enhancer Lesion
  biological_scale: MOLECULAR
  description: >-
    The causal lesion is either a heterozygous point mutation in FOXF1 itself or,
    frequently, a deletion of the distant upstream enhancer region at 16q24.1
    that contains the fetal lung-expressed long non-coding RNA genes LINC01081
    and LINC01082. The enhancer route is what makes exome-only testing an
    incomplete strategy here: the coding sequence can be entirely normal while
    the gene is functionally silenced in lung.
  genes:
  - preferred_term: FOXF1
    term:
      id: hgnc:3809
      label: FOXF1
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe novel deletion CNVs at the FOXF1 locus in 13 unrelated ACDMPV patients."
    explanation: >-
      Documents the deletion copy-number variant class at the FOXF1 locus in a
      large ACDMPV series.
  downstream:
  - target: Loss of Mesenchymal FOXF1 Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      Either lesion class reduces FOXF1 protein available to drive its
      transcriptional programme in lung mesenchyme.
- name: Parent-Specific FOXF1 Enhancer Activity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Pathogenic deletions of the distant enhancer show a strong bias toward the
    maternally inherited chromosome. The current model assigns different
    activity to two enhancer units on the maternal and paternal chromosomes;
    this is more nuanced than whole-locus imprinting because FOXF1 is transcribed
    from both alleles and paternal-chromosome pathogenic lesions occur.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all 31 genomic deletions in 16q24.1, pathogenic for ACDMPV, for which parental origin was determined, arose de novo with 30 of them occurring on the maternally inherited chromosome 16, strongly implicating genomic imprinting of the FOXF1 locus in human lungs"
    explanation: >-
      Quantifies the parent-of-origin skew that implicates imprinting at the
      FOXF1 locus.
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, we have also identified four ACDMPV families with the pathogenic variants in the FOXF1 locus that arose on paternal chromosome 16."
    explanation: >-
      Qualifies the imprinting model: a minority of pathogenic lesions arise on
      the paternal chromosome, so silencing is incomplete.
  - reference: PMID:34325731
    reference_title: "Genome wide DNA methylation analysis of alveolar capillary dysplasia lung tissue reveals aberrant methylation of genes involved in development including the FOXF1 locus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA methylation analyses in the FOXF1 locus excludes maternal imprinting of the 60 kb FOXF1 enhancer."
    explanation: >-
      Rules out one simple enhancer-imprinting model and requires a more
      qualified parent-specific regulatory interpretation.
  - reference: PMID:37865798
    reference_title: "Further refinement of the differentially methylated distant lung-specific FOXF1 enhancer in a neonate with alveolar capillary dysplasia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, we proposed bimodal structure and parental functional dimorphism of the lung-specific FOXF1 enhancer, with Unit 1 having higher activity on the paternal chr16 and Unit 2 on the maternal chr16."
    explanation: >-
      Supports enhancer-unit asymmetry as an emerging replacement for simple
      whole-locus imprinting.
  downstream:
  - target: Loss of Mesenchymal FOXF1 Transcriptional Output
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - parent_specific_foxf1_enhancer_activity
    description: >-
      Parent-specific enhancer activity may explain why otherwise similar
      deletions have different consequences depending on parental chromosome.
- name: Loss of Mesenchymal FOXF1 Transcriptional Output
  biological_scale: CELLULAR
  description: >-
    FOXF1 is expressed in lung mesenchyme and endothelium and drives the
    angiogenic programme that builds the pulmonary microvasculature. Mouse
    haploinsufficiency reproduces alveolar capillary dysplasia together with
    intestinal and gall bladder maldevelopment, matching the extrapulmonary
    anomalies seen in patients.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: pericyte
    term:
      id: CL:0000669
      label: pericyte
  molecular_functions:

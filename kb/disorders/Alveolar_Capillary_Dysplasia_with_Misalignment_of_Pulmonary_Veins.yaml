genetic:
- name: FOXF1
  gene_term:
    preferred_term: FOXF1
    term:
      id: hgnc:3809
      label: FOXF1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    A forkhead box transcription factor expressed in lung mesenchyme and
    endothelium. Both coding point mutations and 16q24.1 deletion copy-number
    variants cause ACDMPV, and the deletions frequently spare the gene entirely
    while removing its upstream enhancer. The locus is imprinted in human lung,
    so parent of origin governs whether a lesion is pathogenic.
  evidence:
  - reference: PMID:25091710
    reference_title: "FOXF1 transcription factor is required for formation of embryonic vasculature by regulating VEGF signaling in endothelial cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inactivating mutations in the Forkhead Box transcription factor F1 (FOXF1) gene locus are frequently found in patients with alveolar capillary dysplasia with misalignment of pulmonary veins"
    explanation: >-
      Establishes FOXF1 locus inactivation as the recurrent cause of ACDMPV.
      Tagged OTHER because this is the framing sentence of a mouse study rather
      than a human result reported by it.
- name: ESRP1
  gene_term:
    preferred_term: ESRP1
    term:
      id: hgnc:25966
      label: ESRP1
  association: Candidate Gene
  relationship_type: UNKNOWN
  notes: >-
    A single de novo missense variant reported in one ACDMPV family, raising the
    possibility of FGF signalling involvement. Recorded as UNKNOWN rather than
    DISPUTED: nobody has actively contested it, it is simply unreplicated, which
    corresponds to a ClinGen Limited rather than Disputed classification. The
    candidacy is weaker than a single variant implies, since ESRP1 was one of
    four de novo variants in that same proband and the authors declined to
    exclude any of them.
  evidence:
  - reference: PMID:27071622
    reference_title: "Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in one family, WES revealed a de novo missense variant in ESRP1, potentially implicating FGF signaling in the etiology of ACDMPV"
    explanation: >-
      The authors themselves frame this as a single-family, potential
      implication, so the association is recorded as partial and disputed.
histopathology:
- name: Reduced and malpositioned alveolar capillaries
  description: >-
    The diagnostic microscopic picture: diffuse thickening of the interalveolar
    septa with a marked reduction in alveolar capillaries, and the few
    capillaries that are present sitting away from the alveolar epithelium,
    which is itself composed predominantly of hyperplastic cuboidal type 2
    pneumocytes rather than the flattened type 1 cells needed for gas exchange.
  diagnostic: true
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lung tissue is characterized by diffuse thickening of interalveolar septa and marked reduction of pulmonary alveolar capillaries"
    explanation: >-
      The core histological finding on which the diagnosis rests.
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these scanty alveolar capillaries are located away from the alveolar epithelium which is predominantly composed of hyperplastic cuboidal type 2 pneumocytes"
    explanation: >-
      Documents both the malposition of the capillaries and the type 2
      pneumocyte hyperplasia of the overlying epithelium.
- name: Muscularized peripheral pulmonary arteries
  description: >-
    The walls of small peripheral pulmonary arteries are thickened by
    hypertrophic medial smooth muscle, the structural correlate of the raised
    pulmonary vascular resistance.
  evidence:
  - reference: PMID:30058937
    reference_title: "Alveolar capillary dysplasia with misalignment of the pulmonary veins: clinical, histological, and genetic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the walls of small peripheral pulmonary arteries are thickened due to hypertrophic smooth muscle cells in the media"
    explanation: >-
      Histological basis for the arteriolar contribution to raised resistance.
- name: Misaligned pulmonary veins in the bronchovascular bundle
  description: >-
    Pulmonary veins sit in the bronchovascular bundle beside the arteries
    instead of within the interlobular septa. This is the eponymous finding and
    what a pathologist looks for to confirm the diagnosis.
  diagnostic: true
  evidence:
  - reference: PMID:30058937

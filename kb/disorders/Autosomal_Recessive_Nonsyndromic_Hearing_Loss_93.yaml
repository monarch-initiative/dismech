diagnosis:
- name: Genetic testing for biallelic CABP2 variants
  description: >-
    Evaluate CABP2 in a comprehensive hearing-loss panel or genomic analysis, with interpretation
    of both alleles and family segregation. Homozygosity is not required. Phenotype and ancestry
    can inform interpretation, but variants of uncertain significance alone do not establish DFNB93.
  evidence:
  - reference: PMID:32860223
    reference_title: Spectrum and frequencies of non GJB2 gene mutations in Czech patients with early non-syndromic hearing loss detected by gene panel NGS and whole-exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other genes (AIFM1, CABP2, DIAPH1, PTPRQ, RDX, SLC26A4, TBC1D24, TECTA, TMC1) that explained
      the cause of hearing impairment were further detected in only one patient for each gene.
    explanation: >-
      CABP2 explained one case in this selected Czech cohort after GJB2 testing. This is not an unselected
      population diagnostic yield.

  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of ... uncertain significance ... cannot be used to confirm
      or rule out the diagnosis.
    explanation: >-
      General genetic-hearing-loss interpretation guidance applies to CABP2 testing.
- name: Audiological testing including otoacoustic emissions
  description: >-
    Combine age-appropriate behavioral audiometry, tympanometry, otoacoustic emissions and auditory
    evoked responses to characterize hearing sensitivity and possible synaptic dysfunction. Emissions
    can be present or absent in DFNB93; passing newborn emissions screening does not exclude later
    recognition of hearing impairment.
  evidence:
  - reference: PMID:35150090
    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Physical examination, transient otoacoustic emissions (TEOAE), and pure-tone audiometry were
      performed at 125–8000 Hz for the affected children of FINHEAR1. TEOAE, auditory steady-state
      response (ASSR), and auditory brainstem response (ABR) were evaluated for the affected child
      of FINHEAR2.
    explanation: >-
      The clinical study documents complementary assessments.

- name: Cochlear Gene Replacement (investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    AAV-mediated Cabp2 delivery improved inner-hair-cell calcium currents and hearing in neonatal
    Cabp2-null mice, and partially restored synaptic function in Cabp1/Cabp2 double-knockout mice.
    These are preclinical experiments. Early treatment, incomplete rescue, contralateral vector spread
    and adverse auditory findings in some treated wild-type mice limit extrapolation to human efficacy,
    durability and safety.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    description: >-
      Delivering a functional CABP2 coding sequence to inner hair cells restores the missing channel
      regulator, which is the one node in this pathograph that a replacement therapy can act on directly.
    evidence:
    - reference: PMID:34489639
      reference_title: Cabp2-Gene Therapy Restores Inner Hair Cell Calcium Currents and Improves Hearing in a DFNB93 Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We used AAV2/1 and AAV-PHP.eB viral vectors to deliver the Cabp2 coding sequence into IHCs
        of early postnatal Cabp2-/- mice and assessed the level of restoration of hair cell function
        and hearing.
      explanation: >-
        The intervention this treatment describes, performed in the single-knockout genotype that
        matches the human disease.
    - reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic expression of CaBP2 leads to substantial recovery of IHC synaptic function and
        hearing sensitivity.
      explanation: >-
        A second rescue result, in the double knockout, supporting the same target.

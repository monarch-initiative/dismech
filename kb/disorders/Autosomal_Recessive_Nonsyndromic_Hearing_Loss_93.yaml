  notes: >-
    Reported CABP2 alleles include splice-site, nonsense, missense and frameshift variants. The recurrent
    splice allele NM_016366.3:c.637+1G>T is enriched in Finland; the 2022 study reports allele frequencies
    of 3.3 × 10−3 in Finnish gnomAD participants and 4.2 × 10−3 in FinnGen. These are allele frequencies,
    not carrier or disease frequencies. A shared haplotype was demonstrated in the founding Iranian
    families, whereas the Danish case had a run of homozygosity suggesting shared ancestry. These
    observations do not establish one shared founder haplotype across all populations. CABP1 compensation
    is supported in mice but is not an established human genetic modifier.

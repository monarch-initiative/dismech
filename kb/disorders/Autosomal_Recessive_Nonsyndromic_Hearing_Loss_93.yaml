pathophysiology:
- name: Biallelic CABP2 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic pathogenic CABP2 variants impair CaBP2 function. Reported alleles include splice-site,
    nonsense and missense variants. For the recurrent c.637+1G>T allele, exon skipping was demonstrated
    in a minigene assay and truncation is predicted if the abnormal transcript escapes nonsense-mediated
    decay; endogenous mutant protein abundance in patient hair cells was not measured.
  genetic_context:
    gene:
      preferred_term: CABP2
      term:
        id: hgnc:1385
        label: CABP2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Both homozygous and compound-heterozygous CABP2 genotypes have been reported. Functional loss
      may be partial or complete depending on the allele; biochemical tests of an engineered truncation
      do not establish the amount of residual protein in patients.
  downstream:
  - target: CABP2 Exon 6 Skipping
    causal_link_type: DIRECT
    description: >-
      The c.637+1G>T splice-donor allele causes exon 6 skipping in a COS-7 minigene assay.
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    description: >-
      Other pathogenic alleles can impair CaBP2 function through mechanisms that need not involve
      exon 6 skipping.
  evidence:
  - reference: PMID:22981119
    reference_title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a splice-site mutation (c.637+1G>T) in Ca(2+)-binding protein 2 (CABP2) in three
      consanguineous Iranian families affected by moderate-to-severe hearing loss.
    explanation: >-
      The founding families and the recurrent allele.
- name: CABP2 Exon 6 Skipping
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The recurrent c.637+1G>T allele disrupts splicing in a COS-7 exon-trapping assay. Skipping exon
    6 predicts a frameshift, p.Phe164Serfs*4, and loss of the last two EF hands if the RNA escapes
    degradation. This assay establishes a splice defect, not the abundance or stability of the transcript
    in human inner hair cells.
  downstream:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    description: >-
      The predicted truncation removes C-terminal EF hands. An engineered p.Phe164Ter proxy has altered
      calcium binding and weakened, residual CaV1.3 regulation.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3484643/
    reference_title: A Mutation in CABP2, Expressed in Cochlear Hair Cells, Causes Autosomal-Recessive Hearing Impairment - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Skipping of exon 6, if RNA is not degraded by nonsense-mediated mRNA decay, is predicted to
      lead to a shifted reading frame, a premature truncation of the protein
    explanation: >-
      Exon trapping and the predicted translation consequence; patient RNA and protein were not measured.
- name: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    CaBP2 regulates presynaptic calcium channels in cochlear inner hair cells. The founding truncation
    proxy showed altered calcium binding and weaker, but retained, inhibition of CaV1.3 inactivation.
    In mice, a genetic expression reporter localized Cabp2 to inner and outer hair cells but not
    spiral ganglion neurons, supporting a presynaptic site of the principal sound-encoding defect.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: CaV1.3 calcium channel regulation by CaBP2
    term:
      id: GO:0005246
      label: calcium channel regulator activity
    modifier: DECREASED
  downstream:
  - target: Enhanced CaV1.3 Calcium-Channel Inactivation
    causal_link_type: DIRECT
    description: >-
      CaBP2's specific action is to suppress inactivation; without it the suppression is lifted.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CaBP2 was expressed by cochlear hair cells, preferentially in inner hair cells (IHCs), and
      was lacking from the postsynaptic spiral ganglion neurons (SGNs).
    explanation: >-
      Localises the protein to the presynaptic side, which is what makes the rest of the chain a
      presynaptic account.

  - reference: PMID:22981119
    reference_title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with wild-type CaBP2, the truncated CaBP2 showed altered Ca(2+) binding in isothermal
      titration calorimetry and less potent regulation of Ca(v)1.3 Ca(2+) channels.
    explanation: >-
      An engineered truncation models loss of the C-terminal EF hands; its residual activity must
      not be equated with the amount of mutant protein in patient hair cells.
- name: Enhanced CaV1.3 Calcium-Channel Inactivation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Cabp2-deficient mouse inner hair cells show increased CaV1.3 inactivation despite preserved peak
    calcium-current amplitude and voltage dependence of activation under the tested conditions. At
    room temperature, the single knockout primarily increases voltage-dependent inactivation; its
    increase in calcium-dependent inactivation did not reach significance. Removing both CaBP1 and
    CaBP2 markedly enhances both components. Normal peak current does not directly measure channel
    number, and double-knockout effects do not establish the magnitude of a CABP2-only human defect.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: available presynaptic CaV1.3 current
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  downstream:
  - target: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
    causal_link_type: UNKNOWN
    description: >-
      Greater steady-state inactivation is proposed to reduce the calcium-channel pool available
      to support presynaptic transmission in vivo.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Patch-clamp recordings from Cabp2LacZ/LacZ IHCs revealed enhanced Ca2+-channel inactivation.
    explanation: >-
      The direct measurement of the inactivation defect in the cell type that matters.
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains the availability
      of CaV1.3 Ca2+ channels for synaptic sound encoding.
    explanation: >-
      States the mechanism in the availability terms this node uses.

  - reference: url:https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    reference_title: https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we found significantly increased VDI and a nonsignificant trend toward increased CDI in IHCs
      of 2- to 3-wk-old
    explanation: >-
      The single-knockout room-temperature measurements distinguish the two components of inactivation.
- name: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Reduced availability of presynaptic CaV1.3 channels is proposed to decrease effective transmitter
    delivery to auditory afferents. Whole-cell capacitance assays did not show reduced exocytosis
    in Cabp2-only knockout hair cells; some sustained responses were increased, possibly through
    extrasynaptic release. In contrast, combined Cabp1/Cabp2 deletion directly reduces sustained
    exocytosis, especially at depolarized holding potentials. The double-knockout result supports
    the mechanism but cannot be assigned unchanged to human DFNB93.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: sustained synaptic vesicle exocytosis at the hair cell ribbon synapse
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  downstream:
  - target: Reduced Spiral Ganglion Neuron Firing
    causal_link_type: UNKNOWN
    description: >-
      Reduced effective presynaptic drive is proposed to account for lower afferent firing rates.
  - target: Reduced Temporal Precision of Auditory Nerve Firing
    causal_link_type: UNKNOWN
    description: >-
      Impaired presynaptic encoding is proposed to delay and desynchronize afferent responses.
  evidence:
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation, slowed recovery
      from inactivation and impaired sustained exocytosis.
    explanation: >-
      Links the channel defect to the exocytosis defect in the same preparation. Note this is the
      double knockout, so it overstates what loss of CaBP2 alone does; the single-knockout severity
      is recorded on the animal model entry.

  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previously, patch-clamp recordings surprisingly revealed normal whole-cell exocytosis in CaBP2-deficient
      IHCs despite enhanced inactivation of calcium channels
    explanation: >-
      The paper explicitly contrasts preserved single-knockout capacitance responses with the double-knockout
      release deficit.
- name: Reduced Spiral Ganglion Neuron Firing
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Single-unit recordings in Cabp2-null mice show reduced spontaneous and sound-evoked spiral ganglion
    neuron firing. In the single knockout, neural frequency tuning and spike-rate thresholds can
    remain normal despite reduced maximal firing. The more severe rate dependence in Cabp1/Cabp2
    double-knockout mice provides additional mechanistic evidence, with the limitation that some
    recorded units could be cochlear-nucleus neurons.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:
  - preferred_term: afferent auditory nerve firing
    term:
      id: GO:0019228
      label: neuronal action potential
    modifier: DECREASED
  downstream:
  - target: Impaired Synaptic Sound Encoding
    causal_link_type: DIRECT
    description: >-
      Reduced auditory-nerve activity degrades the neural representation of sound.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Recordings from single SGNs showed reduced spontaneous and sound-evoked firing rates.
    explanation: >-
      The afferent firing measurement itself.
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spontaneous and sound-evoked responses of spiral ganglion neurons in vivo are strikingly reduced
      and strongly depend on stimulation rates.
    explanation: >-
      Adds the rate dependence, which is the in vivo signature of a channel pool that recovers too
      slowly from inactivation.

- name: Reduced Temporal Precision of Auditory Nerve Firing
  role: consequence
  biological_scale: CELLULAR
  description: >-
    In Cabp2-null mice, first spikes after sound onset occur later and with greater trial-to-trial
    variability. Reduced timing precision, together with lower firing rates, provides a physiological
    explanation for reduced auditory brainstem response amplitudes and elevated response thresholds.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  downstream:
  - target: Impaired Synaptic Sound Encoding
    causal_link_type: DIRECT
    description: >-
      Delayed and less synchronized auditory-nerve responses impair population sound encoding.
  evidence:
  - reference: url:https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    reference_title: https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Rate reduction and increased jitter of SGN firing at sound onset likely explain the impaired
      ABR wave I amplitude and threshold.
    explanation: >-
      The authors link reduced firing and temporal precision to the brainstem response phenotype.
- name: Impaired Synaptic Sound Encoding
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Impaired presynaptic encoding produces abnormal auditory brainstem responses and hearing impairment.
    Cabp2-null mice retain cochlear amplification under the reported conditions. Transient otoacoustic
    emissions were present in an Italian child, but were absent in founding Iranian cases and in
    two Finnish children. Preserved emissions support synaptopathy when present; their absence does
    not exclude genetically confirmed DFNB93.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, we conclude that human deafness DFNB93 is an auditory synaptopathy.
    explanation: >-
      The classification stated by the paper that established the mechanism.
  - reference: PMID:35150090
    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 4 months of age, TEOAE showed no responses, and ASSR (Figure 1d) and ABR results revealed
      responses on average at 40–55 dB levels which led to a diagnosis of moderate sensorineural
      HI.
    explanation: >-
      A genetically confirmed Finnish infant had absent emissions and elevated evoked-response thresholds,
      limiting any universal preserved-emissions claim.
  downstream:
  - target: Bilateral Sensorineural Hearing Loss
    causal_link_type: UNKNOWN
    description: >-
      The synaptic defect is the principal model-supported mechanism for human hearing impairment.
  - target: Abnormal Auditory Brainstem Response
    causal_link_type: DIRECT
    description: >-
      Reduced and desynchronized afferent activity alters evoked population responses.
phenotypes:
- category: Otologic
  name: Bilateral Sensorineural Hearing Loss
  description: >-
    Bilateral hearing loss is commonly moderate to severe and symmetric, although severity varies
    between families. Mid-frequency loss is frequent in the published descriptions. Serial audiograms
    in two Finnish children showed nonprogressive loss over the observed childhood intervals; these
    observations do not establish lifelong stability for all genotypes.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:22981119
    reference_title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that genetic defects in CABP2 cause moderate-to-severe sensorineural hearing impairment.
    explanation: >-
      The severity range stated by the founding report.
  - reference: PMID:33666369
    reference_title: First reported CABP2-related non-syndromic hearing loss in Northern Europe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing loss was in these cases described as prelingual, symmetrical, and moderate to severe.
    explanation: >-
      Confirms prelingual onset and symmetry alongside the severity band.

  - reference: PMID:35150090
    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiograms taken at the ages of 6.0 and 13.7 years for II:1 and at 2.4, 3.0, and 3.5 years
      for II:4 (Figure 1c) feature symmetrical, moderate-to-severe non-progressive HI that is more
      conspicuous in the mid-frequencies forming a U-shaped audiogram
    explanation: >-
      Serial childhood audiograms establish stability in these two siblings, not across all patients.
- category: Otologic
  name: Prelingual Onset
  description: >-
    Congenital or prelingual onset is documented in several families, including the Danish child
    detected by newborn screening. Onset is not established in every patient: an older Finnish sibling
    passed newborn emissions screening and was diagnosed at six years.
  phenotype_term:
    preferred_term: Prelingual sensorineural hearing impairment
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
  evidence:
  - reference: PMID:33666369
    reference_title: First reported CABP2-related non-syndromic hearing loss in Northern Europe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bilateral hearing loss was detected when the patient was 3 days old by the national standardized
      hearing screening.
    explanation: >-
      The Danish case had neonatal detection.
  - reference: PMID:35150090
    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although FINHEAR1 II:4 presented with congenital HI, we cannot confirm her brother II:1 has
      congenital HI since he was not diagnosed until 6 years of age.
    explanation: >-
      Onset uncertainty prevents an obligatory prelingual classification.
- category: Otologic
  name: Severe Hearing Loss in a Subset of Families
  severity: SEVERE
  description: >-
    Severe hearing loss was reported in a consanguineous Iranian family with the c.311G>A missense
    variant. The report extends the severity spectrum without establishing a frequency or deterministic
    genotype–severity relationship.
  phenotype_term:
    preferred_term: Severe sensorineural hearing impairment
    term:
      id: HP:0008625
      label: Severe sensorineural hearing impairment
  evidence:
  - reference: PMID:31661684
    reference_title: A Novel Pathogenic Variant in the CABP2 Gene Causes Severe Nonsyndromic Hearing Loss in a Consanguineous Iranian Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that CABP2variantsalso cause severe ARNSHL, adding CABP2to the growing list
      of genes that exhibit phenotypic heterogeneity.
    explanation: >-
      Reports the severe end of the range. The missing spaces are in the source text.

- category: Otologic
  name: Abnormal Auditory Brainstem Response
  description: >-
    Elevated auditory evoked-response thresholds were documented in a Finnish infant with biallelic
    CABP2 variants. Responses should be interpreted together with behavioral audiometry, middle-ear
    assessment and otoacoustic emissions; a preserved-emissions pattern is not required for the molecular
    diagnosis.
  phenotype_term:
    preferred_term: Abnormal auditory evoked potentials
    term:
      id: HP:0006958
      label: Abnormal auditory evoked potentials
  evidence:
  - reference: PMID:35150090
    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 4 months of age, TEOAE showed no responses, and ASSR (Figure 1d) and ABR results revealed
      responses on average at 40–55 dB levels which led to a diagnosis of moderate sensorineural
      HI.
    explanation: >-
      Direct human evoked-response measurements rather than an inference from the synaptopathy label.
- category: Otologic
  name: Preserved Otoacoustic Emissions
  description: >-
    Transient evoked otoacoustic emissions were observed at age four in the affected Italian boy.
    His affected sister was not tested. Preserved emissions support functioning cochlear amplification
    in that individual at that age; other genetically confirmed patients have absent emissions.
  phenotype_term:
    preferred_term: Preserved otoacoustic emissions
  evidence:
  - reference: url:https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    reference_title: https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a transitory evoked otoacoustic emission (TEOAE) was observed in subject III:1 in the course
      of clinical examination at the age of 4 y (subject III:3 was not tested for TEOAE).
    explanation: >-
      The primary report specifies the individual, age and untested sibling.
- category: Otologic
  name: U-Shaped (Mid-Frequency) Audiometric Configuration
  description: >-
    A U-shaped audiogram with greatest loss in middle frequencies is documented in the founding families
    and in the Finnish children. It is a useful clinical clue but does not uniquely identify CABP2-related

    reference_title: Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      symmetrical, moderate-to-severe non-progressive HI that is more conspicuous in the mid-frequencies
      forming a U-shaped audiogram
    explanation: >-
      Direct longitudinal audiometry in the Finnish family.
- category: Otologic
  name: Reverse-Slope Audiometric Configuration
  description: >-
    A reverse-slope pattern, with lower frequencies more affected, was reported in the 2026 North
    American case. Audiometric configuration alone should not exclude CABP2 from molecular evaluation.
  phenotype_term:
    preferred_term: Low-frequency hearing loss
    term:
      id: HP:0008542
      label: Low-frequency hearing loss
  evidence:
  - reference: PMID:42448438
    reference_title: First reported North American calcium binding protein 2-related non-syndromic hearing loss.
    supports: SUPPORT

name: Autosomal Recessive Nonsyndromic Hearing Loss 93
creation_date: "2026-08-28T19:30:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 93
  term:
    id: MONDO:0013963
    label: autosomal recessive nonsyndromic hearing loss 93
synonyms:
- DFNB93
- deafness, autosomal recessive 93
- CABP2-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 93
description: >-
  Prelingual, symmetric, moderate-to-severe sensorineural hearing loss caused by biallelic
  variants in CABP2, which encodes calcium-binding protein 2. The lesion is at one synapse.
  CaBP2 sits presynaptically in the cochlear inner hair cell and holds the CaV1.3 calcium
  channel open: it suppresses the channel's inactivation, so that a hair cell depolarised
  continuously by an ongoing sound keeps enough channels available to keep releasing
  transmitter. Remove CaBP2 and the channels inactivate; the sustained component of
  exocytosis collapses; the spiral ganglion neurons downstream fire less, spontaneously and
  to sound.

  What follows from that is the feature which makes this entry worth separating from the
  rest of the DFNB series. Outer hair cells are untouched, so cochlear amplification is
  preserved and otoacoustic emissions are present while the auditory brainstem response is
  abnormal. That combination is the definition of auditory synaptopathy, and the mouse
  paper that established the mechanism says so in its own conclusion. DFNB93 is therefore a
  synaptopathy that happens to sit in the nonsyndromic-deafness nomenclature, and it belongs
  beside OTOF rather than beside the hair-bundle genes it is numbered among.

  Clinically this matters twice over. Amplification addresses sensitivity, and sensitivity
  is not the deficit here. And because the organ of Corti is structurally intact, DFNB93 is
  a named candidate for cochlear gene replacement, with a mouse rescue already demonstrated.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


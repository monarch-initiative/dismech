    explanation: >-
      Reports the severe end of the range. The missing spaces are in the source text.

- category: Otologic
  name: Preserved Otoacoustic Emissions
  frequency: FREQUENT
  description: >-
    Emissions are present because the outer hair cells are not part of the mechanism. This is
    the finding that separates DFNB93 from a cochlear hair-cell deafness at the audiology
    bench, and it is why the entry classifies the disease as a synaptopathy.
  phenotype_term:

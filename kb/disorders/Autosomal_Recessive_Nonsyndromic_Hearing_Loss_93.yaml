differential_diagnoses:
- name: OTOF-related auditory neuropathy (DFNB9)
  description: >-
    OTOF-related disease is another presynaptic auditory synaptopathy. Audiometric severity and emissions
    can overlap, and molecular testing distinguishes the causal gene. Results from OTOF gene-therapy
    trials do not establish efficacy for CABP2.
  evidence:
  - reference: PMID:40927552
    reference_title: Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As growing evidence from OTOF clinical trials confirms synaptopathies as promising therapeutic
      targets for hearing restoration, CABP2 ranks highly among the candidate genes for virus-mediated
      gene therapy to restore hearing.
    explanation: >-
      Places the two diseases in the same mechanistic class, which is why OTOF is the differential
      that matters.

- name: GJB2-related nonsyndromic hearing loss (DFNB1)
  description: >-
    GJB2-related hearing loss is a common alternative molecular diagnosis. The Iranian severe-CABP2
    family underwent GJB2 and other-gene testing before exome sequencing. This family-specific diagnostic
    sequence is not a requirement that every patient undergo isolated GJB2 testing first.
  evidence:
  - reference: PMID:31661684
    reference_title: A Novel Pathogenic Variant in the CABP2 Gene Causes Severe Nonsyndromic Hearing Loss in a Consanguineous Iranian Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After excluding mutations in the GJB2 gene and 7 other most common autosomal recessive nonsyndromic
      HL (ARNSHL) genes via Sanger sequencing and genetic linkage analysis in the family, WES was
      utilized to find the possible etiology of the disease.
    explanation: >-
      Records that GJB2 and seven other common recessive deafness genes were excluded before the
      CABP2 diagnosis was accepted in this family.

discussions:
- discussion_id: gap_hearing_aid_benefit_in_dfnb93
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Hearing Aids
  - pathophysiology#Impaired Synaptic Sound Encoding
  prompt: >-
    Do DFNB93 patients benefit from amplification, given that auditory synaptopathy as a class is
    described as responding poorly to it?
  rationale: >-
    Clinical reports describe benefit from hearing aids, whereas mechanistic work predicts that pronounced
    channel inactivation could limit benefit from amplification alone. Comparative aided speech-perception
    measurements would clarify the range of benefit and the value of signal-to-noise improvement
    in DFNB93.
  proposed_experiments:
  - experiment_id: dfnb93_aided_speech_perception
    name: Aided speech perception versus aided threshold in a genotyped DFNB93 cohort
    description: >-
      Assemble the reported CABP2-biallelic patients through the existing patient registry and measure
      speech perception in noise against aided pure-tone thresholds, comparing against OTOF-related
      synaptopathy patients and against sensitivity-matched cochlear hearing loss.
    would_support:
    - treatments#Hearing Aids
    supporting_outcome:
    - >-
      Aided speech perception in DFNB93 tracks aided threshold in the way it does for cochlear hearing
      loss, which would mean amplification does the expected work here and the class generalisation
      does not apply.
    refuting_outcome:
    - >-
      Speech perception is disproportionately poor for the aided threshold, matching the OTOF pattern,
      which would mean the reported positive prognoses rest on audiometric gain that is not translating
      into communication and would move cochlear implantation earlier in counselling.

- discussion_id: gap_dfnb93_progression
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Bilateral Sensorineural Hearing Loss
  prompt: >-
    How does hearing change from childhood into adulthood across CABP2 genotypes?
  rationale: >-
    Serial audiograms in two Finnish children demonstrate stable hearing over the reported childhood
    intervals. Longer-term, genotype-stratified natural-history data are needed to establish whether
    this stability persists across adulthood and across other alleles. Progressive mouse hearing
    impairment should not be treated as proof of human progression.
  proposed_experiments:
  - experiment_id: dfnb93_longitudinal_audiometry
    name: Longitudinal audiometry across the reported CABP2 families
    description: >-
      Retrieve serial audiograms from the Iranian, Turkish, Pakistani, Italian, Danish, Finnish and
      North American probands and their affected relatives, and plot threshold against age by allele
      class.
    would_support:
    - phenotypes#Bilateral Sensorineural Hearing Loss
    supporting_outcome:
    - >-
      Thresholds are stable across decades, confirming the disease as a fixed prelingual loss and
      making the mouse progression a species difference to record.
    refuting_outcome:
    - >-
      Thresholds worsen with age in humans as they do in the mouse, which would add a progressive
      clinical course to the phenotype and make the timing of any future gene therapy the central
      clinical question.


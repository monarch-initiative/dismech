experimental_models:
- name: COS-7 CABP2 exon-trapping assay
  experimental_model_type: CELL_LINE
  description: >-
    Wild-type and c.637+1G>T exon-6 constructs were tested in COS-7 cells because CABP2 transcript
    could not be detected in accessible patient blood or saliva. Mutant minigene splicing skipped
    exon 6.
  modeled_mechanisms:
  - target: CABP2 Exon 6 Skipping
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The minigene does not establish transcript abundance, nonsense-mediated decay or protein expression
      in patient cochlear hair cells.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3484643/
      reference_title: A Mutation in CABP2, Expressed in Cochlear Hair Cells, Causes Autosomal-Recessive Hearing Impairment - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of cDNA prepared from COS-7 cells transfected with a MT ... donor site only revealed
        a PCR product of 177 bp, indicating that the mutation ... leads to a complete skipping of
        exon 6
      explanation: >-
        The mutant exon-trapping construct skipped exon 6 in COS-7 cells; this does not establish
        transcript stability in patient hair cells.
- name: Heterologous CaV1.3 regulation by CABP2
  experimental_model_type: CELL_LINE
  description: >-
    HEK293T expression assays compared wild-type CaBP2 with an engineered p.Phe164Ter truncation
    proxy. The mutant retained some suppression of calcium-dependent inactivation. Later HEK293/hSK3-1
    experiments showed that channel regulation depends on the expression system and does not fully
    reproduce inner-hair-cell physiology.
  modeled_mechanisms:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The engineered p.Phe164Ter construct approximates the predicted frameshift truncation and is
      not patient-derived protein. Initial mutant expression exceeded wild type; expression levels
      were adjusted for the comparison. Heterologous voltage-activation and current-density effects
      should not be imported directly into the hair-cell mechanism.
    evidence:
    - reference: PMID:22981119
      reference_title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Compared with wild-type CaBP2, the truncated CaBP2 showed altered Ca(2+) binding in isothermal
        titration calorimetry and less potent regulation of Ca(v)1.3 Ca(2+) channels.
      explanation: >-
        Heterologous channel measurements demonstrate residual regulatory activity.
    - reference: url:https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
      reference_title: https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we did not observe the previously reported decrease of Ca 2+-current density upon CABP2 coexpression
      explanation: >-
        The later expression system did not reproduce the earlier current-density effect.
- name: Purified CaBP2 calcium-binding assay
  experimental_model_type: OTHER
  description: >-
    Isothermal titration calorimetry compared purified wild-type CaBP2 with the engineered C-terminal
    truncation proxy, demonstrating altered calcium binding.
  modeled_mechanisms:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    relationship: MEASURES
    fidelity: MODERATE
    limitations: >-
      Purified-protein behavior does not determine the abundance or calcium-buffering contribution
      of mutant CaBP2 in patient hair cells.
    evidence:
    - reference: PMID:22981119
      reference_title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-

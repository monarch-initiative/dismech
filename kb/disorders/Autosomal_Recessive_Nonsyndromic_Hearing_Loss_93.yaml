- name: Cabp2 knockout mouse with AAV-mediated Cabp2 gene replacement
  species: Mouse
  genotype: Cabp2-/- (constitutive knockout) with AAV2/1 or AAV-PHP.eB Cabp2 delivered by round-window injection at postnatal day 5-7
  publication: PMID:34489639
  description: >-
    AAV2/1 or AAV-PHP.eB delivery of the Cabp2 long isoform through the round window at postnatal
    days 5–7 partially improved hearing in Cabp2-null mice assessed at 5–8 weeks. With AAV2/1, 16
    of 24 animals improved by at least 20 dB SPL at one or more tested frequencies. PHP.eB transduced
    both injected and contralateral cochleae. The experiments establish preclinical feasibility,
    with incomplete rescue and a need to control vector spread and expression.
  modeled_mechanisms:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Delivering the Cabp2 coding sequence into inner hair cells restores the missing channel regulator
      in the genotype that matches the human disease, recovering the non-inactivating CaV1.3 current
      and improving hearing.
    limitations: >-
      Delivery preceded hearing onset in mice, and efficacy after adult-onset treatment was not tested.
      PHP.eB produced contralateral transduction, so that ear is not an independent untreated control.
      The eGFP marker does not directly quantify CaBP2 protein. Some injected wild-type animals had
      impaired hearing or otoacoustic emissions; the contributions of surgery, vector, eGFP and CaBP2
      expression were not resolved.
    readouts:
    - name: Restored CaBP2 function, read out as inner hair cell CaV1.3 current inactivation
      target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
      direction: RESTORED
      interpretation: >-
        Restoration of the calcium-current inactivation phenotype is a functional measure of channel
        regulation after Cabp2 delivery; it does not directly quantify protein expression.
      evidence:
      - reference: PMID:34489639
        reference_title: Cabp2-Gene Therapy Restores Inner Hair Cell Calcium Currents and Improves Hearing in a DFNB93 Mouse Model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we observed high transduction efficiency, and restoration of IHC CaV1.3 function resulting
          in improved hearing of Cabp2-/- mice.
        explanation: >-
          The channel and hearing measurements behind this readout.
    evidence:
    - reference: PMID:34489639
      reference_title: Cabp2-Gene Therapy Restores Inner Hair Cell Calcium Currents and Improves Hearing in a DFNB93 Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These preclinical results prove the feasibility of DFNB93 gene therapy.
      explanation: >-
        The paper's own conclusion, which is the claim this link makes.

  evidence:
  - reference: PMID:34489639

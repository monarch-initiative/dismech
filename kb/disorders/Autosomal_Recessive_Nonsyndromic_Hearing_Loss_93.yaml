prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Fewer than a dozen families were on record when the most recent count was published:
    four variants across eight families from Iran, Turkey, Pakistan, Italy and Denmark,
    subsequently joined by two Finnish families and a first North American case. No
    population prevalence estimate exists and none would be meaningful at this evidence
    base. The one place where a rate has been measured is the Finnish founder allele, which
    is recorded separately below.
  evidence:
  - reference: PMID:35150090
    reference_title: "Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four CABP2 variants have been reported to underlie autosomal recessive nonsyndromic
      hearing impairment in eight families from Iran, Turkey, Pakistan, Italy, and Denmark.
    explanation: >-
      The published family count and its geographic spread at the time of writing.

- population: Finland
  measure_type: CARRIER_FREQUENCY
  prevalence_class: UNKNOWN
  notes: >-
    The recurrent splice allele c.637+1G>T is enriched in the Finnish population by founder
    effect, where it is reported as the second most frequent autosomal recessive
    nonsyndromic hearing impairment allele after GJB2. The source gives an allele frequency
    rather than a disease rate, so no prevalence class is asserted.
  evidence:
  - reference: PMID:35150090
    reference_title: "Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The c.637+1G>T variant is enriched in the Finnish population, which has undergone
      multiple bottlenecks that can lead to the higher frequency of certain variants
      including those involved in disease.
    explanation: >-
      States the enrichment and attributes it to the Finnish population bottleneck.

pathophysiology:

- name: Biallelic CABP2 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The recurrent allele, and the one that accounts for most reported families, is the
    splice-donor variant c.637+1G>T. It causes skipping of exon 6 and a frameshift,
    p.Phe164Serfs*4, truncating the protein. Nonsense and missense alleles have also been
    reported.

    The truncated product is not simply absent from the cell: it was made and tested, and it
    binds calcium abnormally and regulates CaV1.3 less effectively than wild type. The
    functional claim of this entry therefore rests on a measured hypomorph, not only on an
    inferred null.
  genetic_context:
    gene:
      preferred_term: CABP2
      term:
        id: hgnc:1385
        label: CABP2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in every reported family. The founding families were consanguineous; the
      Danish and Finnish cases were not, and reflect a shared founder haplotype instead.
  downstream:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    description: >-
      The truncated protein cannot perform the CaV1.3 regulation that is CaBP2's job in the
      inner hair cell.
  evidence:
  - reference: PMID:22981119
    reference_title: "A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a splice-site mutation (c.637+1G>T) in Ca(2+)-binding protein 2 (CABP2)
      in three consanguineous Iranian families affected by moderate-to-severe hearing loss.
    explanation: >-
      The founding families and the recurrent allele.
  - reference: PMID:22981119
    reference_title: "A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with wild-type CaBP2, the truncated CaBP2 showed altered Ca(2+) binding in
      isothermal titration calorimetry and less potent regulation of Ca(v)1.3 Ca(2+)
      channels.
    explanation: >-
      The biochemical and channel-regulation consequence of the truncation, measured outside
      an organism, which is why this item is graded IN_VITRO while the family report above
      from the same paper is HUMAN_CLINICAL.

- name: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    CaBP2 is expressed by cochlear hair cells and preferentially by inner hair cells. It is
    not in the postsynaptic spiral ganglion neuron, which fixes the lesion on the presynaptic
    side of the synapse and is the reason this disease is a synaptopathy rather than a
    neuropathy of the auditory nerve itself.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: CaV1.3 calcium channel regulation by CaBP2
    term:
      id: GO:0005246
      label: calcium channel regulator activity
    modifier: DECREASED
  downstream:
  - target: Enhanced CaV1.3 Calcium-Channel Inactivation
    causal_link_type: DIRECT
    description: >-
      CaBP2's specific action is to suppress inactivation; without it the suppression is
      lifted.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CaBP2 was expressed by cochlear hair cells, preferentially in inner hair cells (IHCs),
      and was lacking from the postsynaptic spiral ganglion neurons (SGNs).
    explanation: >-
      Localises the protein to the presynaptic side, which is what makes the rest of the
      chain a presynaptic account.

- name: Enhanced CaV1.3 Calcium-Channel Inactivation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    In inner hair cells lacking CaBP2 the CaV1.3 current inactivates more than it should.
    The channels are not fewer and they do not open at the wrong voltage - channel number
    and the voltage dependence of activation are normal, and so is the ribbon synapse count.
    What changes is availability over time. A hair cell responding to a continuing sound is
    held depolarised, and under that condition an inactivating channel population steadily
    withdraws from service.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  molecular_functions:
  - preferred_term: available presynaptic CaV1.3 current
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  downstream:
  - target: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
    causal_link_type: DIRECT
    description: >-
      Transmitter release at this synapse is driven by the calcium that enters through these
      channels, so a shrinking available current is a shrinking release drive.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Patch-clamp recordings from Cabp2LacZ/LacZ IHCs revealed enhanced Ca2+-channel
      inactivation.
    explanation: >-
      The direct measurement of the inactivation defect in the cell type that matters.
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains the
      availability of CaV1.3 Ca2+ channels for synaptic sound encoding.
    explanation: >-
      States the mechanism in the availability terms this node uses.

- name: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The consequence of reduced channel availability is that the sustained component of
    vesicle release fails. In the double-knockout preparation, where the phenotype is most
    severe because the partially redundant CaBP1 is removed as well, even mild activation
    reduces the channel pool enough that synapses may be effectively silenced.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: sustained synaptic vesicle exocytosis at the hair cell ribbon synapse
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  downstream:
  - target: Reduced Spiral Ganglion Neuron Firing
    causal_link_type: DIRECT
    description: >-
      Less transmitter released onto the afferent terminal means less afferent drive.
  evidence:
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation, slowed
      recovery from inactivation and impaired sustained exocytosis.
    explanation: >-
      Links the channel defect to the exocytosis defect in the same preparation. Note this
      is the double knockout, so it overstates what loss of CaBP2 alone does; the
      single-knockout severity is recorded on the animal model entry.

- name: Reduced Spiral Ganglion Neuron Firing
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Single-unit recordings from spiral ganglion neurons show reduced spontaneous and
    sound-evoked firing. The neurons themselves are not the lesion - CaBP2 is not expressed
    in them - so this is a readout of presynaptic failure, and it is the step at which the
    defect becomes something an auditory brainstem response can see.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  biological_processes:
  - preferred_term: afferent auditory nerve firing
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: DECREASED
  downstream:
  - target: Auditory Synaptopathy with Preserved Cochlear Amplification
    causal_link_type: DIRECT
    description: >-
      Degraded afferent encoding with an intact cochlear amplifier upstream of it.
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Recordings from single SGNs showed reduced spontaneous and sound-evoked firing rates.
    explanation: >-
      The afferent firing measurement itself.
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Spontaneous and sound-evoked responses of spiral ganglion neurons in vivo are
      strikingly reduced and strongly depend on stimulation rates.
    explanation: >-
      Adds the rate dependence, which is the in vivo signature of a channel pool that
      recovers too slowly from inactivation.

- name: Auditory Synaptopathy with Preserved Cochlear Amplification
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The end state is a dissociation. Outer hair cells never enter the mechanism, so
    otoacoustic emissions are present and cochlear amplification is intact, while the
    auditory brainstem response is abnormal because what reaches the brainstem has been
    degraded at the synapse. That pattern is the operational definition of auditory
    synaptopathy, and both the mouse work and the clinical perspective paper state the
    classification explicitly rather than leaving it to be inferred.
  biological_processes:
  - preferred_term: sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:28183797
    reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, we conclude that human deafness DFNB93 is an auditory synaptopathy.
    explanation: >-
      The classification stated by the paper that established the mechanism.
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
      variant, indicating preservation of outer hair cell-mediated cochlear amplification.
    explanation: >-
      The human observation of preserved outer hair cell function, which is what makes the
      mouse classification transferable rather than assumed.
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, DFNB93 belongs to the hearing disorders caused by impairment of IHC synapses,
      termed auditory synaptopathy.
    explanation: >-
      States the classification for the human disease.

phenotypes:

- category: Otologic
  name: Prelingual Moderate-to-Severe Sensorineural Hearing Loss
  frequency: OBLIGATE
  severity: MODERATE
  description: >-
    The characteristic presentation is bilateral, symmetric, prelingual and in the
    moderate-to-severe range - milder than most DFNB forms, which is itself a diagnostic
    clue. Severity is not uniform: one Iranian family is reported with severe loss, and the
    entry records that separately rather than flattening the range.
  phenotype_term:
    preferred_term: Moderate sensorineural hearing impairment
    term:
      id: HP:0008504
      label: Moderate sensorineural hearing impairment
  evidence:
  - reference: PMID:22981119
    reference_title: "A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that genetic defects in CABP2 cause moderate-to-severe sensorineural hearing
      impairment.
    explanation: >-
      The severity range stated by the founding report.
  - reference: PMID:33666369
    reference_title: First reported CABP2-related non-syndromic hearing loss in Northern Europe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing loss was in these cases described as prelingual, symmetrical, and moderate
      to severe.
    explanation: >-
      Confirms prelingual onset and symmetry alongside the severity band.

- category: Otologic
  name: Prelingual Onset
  frequency: OBLIGATE
  description: >-
    Onset before speech acquisition. This is what puts the diagnosis inside the newborn and
    infant screening window and makes the choice of habilitation an early decision rather
    than a later one.
  phenotype_term:
    preferred_term: Prelingual sensorineural hearing impairment
    term:
      id: HP:0000399
      label: Prelingual sensorineural hearing impairment
  evidence:
  - reference: PMID:33666369
    reference_title: First reported CABP2-related non-syndromic hearing loss in Northern Europe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first Northern European individual with CABP2-related hearing loss: an
      8-year-old Danish Caucasian boy with non-syndromic, prelingual, and sensorineural
      hearing loss, who is homozygous for the splice site variant CABP2: c.
    explanation: >-
      A case with prelingual onset explicitly stated.

- category: Otologic
  name: Bilateral Symmetric Involvement
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  description: >-
    Both ears, and to a similar degree. Asymmetry should prompt a search for a different
    cause.
  evidence:
  - reference: PMID:33666369
    reference_title: First reported CABP2-related non-syndromic hearing loss in Northern Europe.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing loss was in these cases described as prelingual, symmetrical, and moderate
      to severe.
    explanation: >-
      States symmetry across the previously reported families.

- category: Otologic
  name: Severe Hearing Loss in a Subset of Families
  frequency: OCCASIONAL
  severity: SEVERE
  description: >-
    A missense allele, c.311G>A, was reported in an Iranian family with severe rather than
    moderate loss. The report frames this as widening the CABP2 phenotypic range, so the
    moderate band above should be read as typical rather than defining.
  phenotype_term:
    preferred_term: Severe sensorineural hearing impairment
    term:
      id: HP:0008625
      label: Severe sensorineural hearing impairment
  evidence:
  - reference: PMID:31661684
    reference_title: A Novel Pathogenic Variant in the CABP2 Gene Causes Severe Nonsyndromic Hearing Loss in a Consanguineous Iranian Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that CABP2variantsalso cause severe ARNSHL, adding CABP2to the growing

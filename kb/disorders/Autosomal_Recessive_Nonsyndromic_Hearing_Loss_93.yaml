name: Autosomal Recessive Nonsyndromic Hearing Loss 93
creation_date: '2026-08-28T19:30:00Z'
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 93
  term:
    id: MONDO:0013963
    label: autosomal recessive nonsyndromic hearing loss 93
synonyms:
- DFNB93
- deafness, autosomal recessive 93
- CABP2-related autosomal recessive nonsyndromic hearing loss
- autosomal recessive nonsyndromic deafness 93
description: >-
  Autosomal recessive nonsyndromic hearing loss caused by biallelic pathogenic CABP2 variants. Hearing
  loss is usually bilateral and prelingual, often moderate to severe with greatest involvement of
  middle frequencies; onset, severity and audiogram configuration vary. CaBP2 normally limits CaV1.3
  channel inactivation in cochlear inner hair cells. Mouse and heterologous-cell studies support
  impaired presynaptic sound encoding, with reduced auditory-nerve firing and temporal precision.
  Preserved otoacoustic emissions in some patients support auditory synaptopathy, but absent emissions
  in other affected individuals show that preserved cochlear amplification is not a universal clinical
  feature. Hearing aids and communication support are used clinically; cochlear CABP2 gene replacement
  remains preclinical.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss


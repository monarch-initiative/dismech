inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance is supported by segregation of biallelic CABP2 variants. Homozygous
    and compound-heterozygous genotypes are reported. Consanguinity is common in the initial families
    but is not required. Hearing impairment in ungenotyped relatives should not be attributed to
    a single CABP2 allele: the Danish mother and other maternal relatives remained genetically unresolved.
  evidence:
  - reference: PMID:22981119

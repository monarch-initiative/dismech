  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
      variant, indicating preservation of outer hair cell-mediated cochlear amplification.
    explanation: >-
      The human observation of preserved emissions.

- category: Otologic
  name: Reverse-Slope Audiometric Configuration
  frequency: OCCASIONAL
  description: >-
    The audiogram shape reported in DFNB93 has usually been U-shaped. The first North
    American case had a reverse-slope configuration instead, with low frequencies worse
    affected. One case is not a pattern, but it is recorded because audiogram shape is used
    in practice to decide which genes to sequence.
  phenotype_term:
    preferred_term: Low-frequency hearing loss
    term:
      id: HP:0008542
      label: Low-frequency hearing loss
  evidence:
  - reference: PMID:42448438
    reference_title: First reported North American calcium binding protein 2-related non-syndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiological testing revealed a reverse-slope pattern of hearing loss, differing from
      the U-shaped pattern associated with previous reports of DFNB93.
    explanation: >-
      Reports the configuration and explicitly contrasts it with the previously reported one.

genetic:

- name: CABP2
  gene_term:
    preferred_term: CABP2
    term:
      id: hgnc:1385
      label: CABP2
  relationship_type: CAUSATIVE
  notes: >-
    The single causal gene. It encodes calcium-binding protein 2, a calmodulin-related
    EF-hand protein of the CaBP family expressed in the cochlea and retina, whose relevant
    effector here is the CaV1.3 channel of the inner hair cell.

    Four variants across eight families were on record at the last published count; the
    splice-donor allele c.637+1G>T recurs across most of them and is a founder allele in
    both the Middle Eastern and the Northern European families, where a shared haplotype was
    demonstrated rather than assumed.
  evidence:
  - reference: PMID:35150090
    reference_title: "Autosomal recessive nonsyndromic hearing impairment in two Finnish families due to the population enriched CABP2 c.637+1G>T variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both Finnish families, we identified a homozygous pathogenic splice site variant
      c.637+1G>T in CAPB2 that is known to cause autosomal recessive nonsyndromic hearing
      impairment.
    explanation: >-
      Independent replication of the recurrent allele in a further population. The gene
      symbol is transposed in the source.
  - reference: CGGV:assertion_20de88d2-6681-4522-9e11-26cdf66a2c15-2020-02-06T170000.000Z
    reference_title: CABP2 / nonsyndromic genetic hearing loss (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variants in this gene segregated with disease in at least 12 additional family
      members.
    explanation: >-
      The segregation total behind the Definitive classification.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported proband is homozygous and heterozygous relatives are unaffected. The
    founding families were consanguineous Iranian kindreds; the Danish and Finnish cases were
    not consanguineous, and in the Danish case a run of homozygosity spanning CABP2 pointed
    to a distant shared ancestor instead.
  evidence:
  - reference: PMID:22981119
    reference_title: "A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a splice-site mutation (c.637+1G>T) in Ca(2+)-binding protein 2 (CABP2)
      in three consanguineous Iranian families affected by moderate-to-severe hearing loss.
    explanation: >-
      Homozygosity in consanguineous kindreds, the founding recessive observation.

animal_models:

- name: Cabp2 knockout mouse
  species: Mouse
  genotype: Cabp2 LacZ/LacZ (constitutive knockout, homozygous)
  publication: PMID:28183797
  description: >-
    The single-gene knockout, matching the human genotype in kind. It is the source of the
    mechanism: the localisation of CaBP2 to inner hair cells, the enhanced channel
    inactivation, the normal channel number and ribbon count, and the reduced afferent
    firing. Crucially it also reproduces the human dissociation - intact cochlear
    amplification with abnormal brainstem responses - which is what licenses reading the
    mouse mechanism across to the patients.
  modeled_mechanisms:
  - target: Enhanced CaV1.3 Calcium-Channel Inactivation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The defining channel defect, measured directly by patch clamp in the correct cell
      type.
    limitations: >-
      A constitutive null, whereas the commonest human allele produces a truncated protein
      with residual, weakened CaV1.3 regulation rather than none. The mouse therefore models
      the severe end of the allelic range. The cochlear apex is also mildly affected relative
      to more basal positions, so a whole-cochlea statement flattens a tonotopic gradient.
    readouts:
    - name: CaV1.3 calcium-current inactivation in inner hair cells
      target: Enhanced CaV1.3 Calcium-Channel Inactivation
      direction: INCREASED
      interpretation: >-
        Inactivation of the presynaptic calcium current is increased in the absence of
        CaBP2, which is the primary channel-level defect of this disease.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Patch-clamp recordings from Cabp2LacZ/LacZ IHCs revealed enhanced Ca2+-channel
          inactivation.
        explanation: >-
          The patch-clamp measurement behind this readout.
    evidence:
    - reference: PMID:28183797
      reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains
        the availability of CaV1.3 Ca2+ channels for synaptic sound encoding.
      explanation: >-
        Supports treating this model as the definitional system for the channel node.
  - target: Auditory Synaptopathy with Preserved Cochlear Amplification
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse shows the same dissociation as the patients: the cochlear amplifier works
      and the brainstem response does not.
    limitations: >-
      Cochlear amplification is assayed in the mouse by distortion-product otoacoustic
      emissions and in patients by clinical emissions testing; the two are analogous rather
      than identical measurements, and the human observation comes from a single family.
    readouts:
    - name: Cochlear amplification (otoacoustic emissions)
      target: Auditory Synaptopathy with Preserved Cochlear Amplification
      direction: UNCHANGED
      interpretation: >-
        Outer hair cell amplification is preserved, establishing that the lesion is
        downstream of the cochlear amplifier. A deliberate negative result.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cabp2LacZ/LacZ mice displayed intact cochlear amplification but impaired auditory
          brainstem responses.
        explanation: >-
          The measurement of preserved amplification.
    - name: Auditory brainstem response threshold
      target: Auditory Synaptopathy with Preserved Cochlear Amplification
      direction: DECREASED
      interpretation: >-
        Brainstem responses are impaired despite the intact amplifier, which is the
        synaptopathic pattern.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cabp2LacZ/LacZ mice displayed intact cochlear amplification but impaired auditory
          brainstem responses.
        explanation: >-
          The same sentence reports both halves of the dissociation.
    evidence:
    - reference: PMID:40927552
      reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        DFNB93 mouse models have recapitulated findings and demonstrated that lack of CaBP2
        impairs synaptic sound encoding by enhanced steady-state inactivation of CaV1.3 Ca2+
        channels.
      explanation: >-
        An independent statement that the mouse models recapitulate the human findings, which
        is the claim this link makes.

- name: Cabp1/Cabp2 double-knockout mouse with AAV CaBP2 rescue
  species: Mouse
  genotype: Cabp1-/-; Cabp2-/- double knockout, with and without AAV-PHP.eB-mediated Cabp2 transgene delivery
  publication: PMID:39718549
  description: >-
    Removing the partially redundant paralogue CaBP1 as well produces a much more severe
    synaptic phenotype than the single knockout, and that severity is the point: it makes
    the exocytosis deficit and the afferent-firing deficit large enough to measure cleanly,
    and it provides a window in which a rescue can be seen. Delivering Cabp2 into the inner
    ear substantially recovers both synaptic function and hearing sensitivity, which is the
    experiment underlying the claim that DFNB93 is a gene-therapy candidate.
  modeled_mechanisms:
  - target: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The sustained component of exocytosis fails, and afferent responses become strongly
      rate-dependent.
    limitations: >-
      Two genes are removed, not one. Human DFNB93 patients are CABP2-biallelic with intact
      CABP1, so this animal is more severely affected than the disease it stands for and its
      quantitative deficits should not be read as DFNB93 magnitudes. It earns its place by
      isolating the mechanism, not by matching the genotype.
    readouts:
    - name: Sustained exocytosis in inner hair cells
      target: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
      direction: DECREASED
      interpretation: >-
        Sustained vesicle release is reduced when CaV1.3 inactivation is unopposed.
      evidence:
      - reference: PMID:39718549
        reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation,
          slowed recovery from inactivation and impaired sustained exocytosis.
        explanation: >-
          The exocytosis measurement behind this readout.
    evidence:
    - reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To encode continuous sound stimuli, the inner hair cell (IHC) ribbon synapses utilize
        calcium-binding proteins (CaBPs), which reduce the inactivation of their CaV1.3
        calcium channels.
      explanation: >-
        States the function this model was built to interrogate.
  - target: Auditory Synaptopathy with Preserved Cochlear Amplification
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Transgenic re-expression of CaBP2 in the inner ear substantially restores synaptic
      function and hearing sensitivity, showing that the deficit is reversible by replacing
      the missing protein and not the consequence of an irreversible developmental defect.
    limitations: >-
      Recovery is substantial but partial, the rescue restores only CaBP2 in an animal
      lacking both paralogues, and the voltage shift in channel activation persists after
      re-expression. Timing relative to the human therapeutic window is not addressed.
    readouts:
    - name: Hearing sensitivity and inner hair cell synaptic function after Cabp2 delivery
      target: Auditory Synaptopathy with Preserved Cochlear Amplification
      direction: RESTORED
      interpretation: >-
        Both synaptic function and hearing sensitivity improve after gene delivery, which is
        the preclinical basis for treating DFNB93 as a gene replacement target.
      evidence:
      - reference: PMID:39718549
        reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Transgenic expression of CaBP2 leads to substantial recovery of IHC synaptic
          function and hearing sensitivity.
        explanation: >-
          The rescue result behind this readout.
    evidence:
    - reference: PMID:40927552
      reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, preclinical studies have demonstrated feasibility of gene therapy.
      explanation: >-
        Independent confirmation that the rescue is read by the field as preclinical
        feasibility evidence.

diagnosis:
- name: Genetic testing for biallelic CABP2 variants
  description: >-
    The diagnosis is molecular. CABP2 is small and is on comprehensive hearing-loss gene
    panels and exome pipelines; in every reported case the finding was a homozygous variant,
    most often c.637+1G>T. Ancestry matters to the pretest probability: the allele is a
    founder in Iranian, Turkish and Pakistani families and is enriched in Finland.
  evidence:
  - reference: PMID:32860223
    reference_title: "Spectrum and frequencies of non GJB2 gene mutations in Czech patients with early non-syndromic hearing loss detected by gene panel NGS and whole-exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other genes (AIFM1, CABP2, DIAPH1, PTPRQ, RDX, SLC26A4, TBC1D24, TECTA, TMC1) that
      explained the cause of hearing impairment were further detected in only one patient
      for each gene.
    explanation: >-
      A measured panel/exome yield: CABP2 explained one of the 54 solved cases in an
      unselected Czech prelingual hearing-loss cohort, which is the diagnostic frequency to
      expect from this test rather than a general statement about sequencing.

- name: Audiological testing including otoacoustic emissions
  description: >-
    Because the outer hair cells are spared, emissions testing is the discriminating study.
    Emissions present alongside an abnormal auditory brainstem response places the patient in
    the synaptopathy group and changes what to expect from amplification. Recording
    emissions is not optional in a suspected DFNB93 case; it is the finding that
    distinguishes it.
  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
      variant, indicating preservation of outer hair cell-mediated cochlear amplification.
    explanation: >-
      The human emissions finding this test is looking for.

treatments:

- name: Hearing Aids
  therapeutic_modality: DEVICE
  description: >-
    Amplification is what patients receive in practice, and the reported outcomes are good -
    the North American case describes a positive prognosis with hearing aids and
    multidisciplinary follow-up.

    It is worth stating the tension rather than smoothing it. As a class, auditory
    synaptopathy patients are described as gaining little from amplification, because the
    problem is neural encoding rather than sensitivity. DFNB93 sits at the mild end of that
    class - moderate thresholds and a partial rather than abolished synaptic function - and
    the individual reports are of benefit. Both statements are cited below; neither is
    dropped.
  treatment_term:
    preferred_term: hearing aid usage
  target_mechanisms:
  - target: Auditory Synaptopathy with Preserved Cochlear Amplification
    description: >-
      Amplification raises the stimulus reaching an inner hair cell whose transmitter release
      is reduced. It compensates for the consequence and does nothing to the channel defect
      that produces it.
    evidence:
    - reference: PMID:42448438
      reference_title: First reported North American calcium binding protein 2-related non-syndromic hearing loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hearing aids and multidisciplinary follow-up have led to a positive prognosis.
      explanation: >-
        A reported outcome of amplification in a genetically confirmed DFNB93 patient.
  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with auditory synaptopathy and auditory neuropathy typically gain little
      benefit from using hearing aids, as the functional problem is not hearing sensitivity
      but neural sound processing.
    explanation: >-
      Graded PARTIAL because it is the general statement about the disease class this entry
      places DFNB93 in, and it qualifies rather than supports the use of amplification here.

- name: Cochlear Gene Replacement (investigational)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Not available to patients. It is listed because the preclinical case is specific and
    published: CaBP2 re-expression in the double-knockout mouse restores synaptic function
    and hearing sensitivity, the cochlea is structurally intact in this disease so there is
    something left to rescue, and a patient registry has been set up to support future
    trials. The read-across from the otoferlin trials is the field's own argument, and it is
    an argument about a disease class rather than a result in DFNB93 patients.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
    description: >-
      Delivering a functional CABP2 coding sequence to inner hair cells restores the missing
      channel regulator, which is the one node in this pathograph that a replacement therapy
      can act on directly.
    evidence:
    - reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic expression of CaBP2 leads to substantial recovery of IHC synaptic function
        and hearing sensitivity.
      explanation: >-
        The rescue experiment supporting this target.
  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, preclinical studies have demonstrated feasibility of gene therapy.
    explanation: >-
      States the preclinical feasibility that is the whole basis for listing this treatment.

differential_diagnoses:
- name: OTOF-related auditory neuropathy (DFNB9)
  description: >-
    The other genetic auditory synaptopathy, and the one DFNB93 is repeatedly compared to.
    Both present with preserved otoacoustic emissions and abnormal brainstem responses, and
    both are presynaptic inner hair cell disorders. OTOF is usually profound and congenital
    where DFNB93 is moderate, and OTOF is the one with an approved gene therapy. Separation
    is by sequencing, not by audiology.
  evidence:
  - reference: PMID:40927552
    reference_title: "Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress and Patient Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As growing evidence from OTOF clinical trials confirms synaptopathies as promising
      therapeutic targets for hearing restoration, CABP2 ranks highly among the candidate
      genes for virus-mediated gene therapy to restore hearing.
    explanation: >-
      Places the two diseases in the same mechanistic class, which is why OTOF is the
      differential that matters.

- name: GJB2-related nonsyndromic hearing loss (DFNB1)
  description: >-
    The commonest cause of autosomal recessive nonsyndromic hearing loss, and the one that
    is excluded first in every reported DFNB93 family before the CABP2 finding is accepted.
    It is a gap-junction disease of the cochlear supporting-cell network, not a synaptopathy,
    and otoacoustic emissions are absent.
  evidence:
  - reference: PMID:31661684
    reference_title: A Novel Pathogenic Variant in the CABP2 Gene Causes Severe Nonsyndromic Hearing Loss in a Consanguineous Iranian Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After excluding mutations in the GJB2 gene an
    explanation: >-
      Records that GJB2 exclusion preceded the CABP2 diagnosis in this family. The truncation
      is a line break in the source text.

discussions:

- discussion_id: gap_hearing_aid_benefit_in_dfnb93
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Hearing Aids
  - pathophysiology#Auditory Synaptopathy with Preserved Cochlear Amplification
  prompt: >-
    Do DFNB93 patients benefit from amplification, given that auditory synaptopathy as a
    class is described as responding poorly to it?
  rationale: >-
    The entry cites both halves of a genuine tension. Auditory synaptopathy and auditory
    neuropathy patients are described in the review literature as gaining little from hearing
    aids, because amplification addresses sensitivity and the deficit is neural encoding. Yet
    the individual DFNB93 case reports describe amplification being fitted and outcomes
    being good, and the disease is milder than the synaptopathies that generalisation was
    built on.

    Both readings are defensible from what is published. DFNB93 may be the mild corner of
    the class where partial synaptic function leaves enough encoding for amplification to
    work with; or the reported good outcomes may reflect early fitting and small numbers
    rather than genuine class-atypical benefit. Nobody has measured speech perception in a
    DFNB93 cohort against aided thresholds, which is what would separate the two.

    The stake is immediate and clinical. If amplification genuinely works here, the class
    generalisation should not be applied to these patients when counselling. If it does not,
    the reported positive prognoses are measuring the wrong thing and cochlear implantation
    should be discussed earlier.
  proposed_experiments:
  - experiment_id: dfnb93_aided_speech_perception
    name: Aided speech perception versus aided threshold in a genotyped DFNB93 cohort
    description: >-
      Assemble the reported CABP2-biallelic patients through the existing patient registry
      and measure speech perception in noise against aided pure-tone thresholds, comparing
      against OTOF-related synaptopathy patients and against sensitivity-matched cochlear
      hearing loss.
    would_support:
    - treatments#Hearing Aids
    supporting_outcome:
    - >-
      Aided speech perception in DFNB93 tracks aided threshold in the way it does for
      cochlear hearing loss, which would mean amplification does the expected work here and
      the class generalisation does not apply.
    refuting_outcome:
    - >-
      Speech perception is disproportionately poor for the aided threshold, matching the
      OTOF pattern, which would mean the reported positive prognoses rest on audiometric
      gain that is not translating into communication and would move cochlear implantation
      earlier in counselling.

- discussion_id: gap_dfnb93_progression
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Prelingual Moderate-to-Severe Sensorineural Hearing Loss
  prompt: >-
    Is DFNB93 hearing loss stable after onset, or does it progress?
  rationale: >-
    The mouse is described as having early-onset progressive hearing impairment. The human
    reports are cross-sectional - a proband is described at the age they were assessed - and
    none of the published families has serial audiometry across years. So the entry asserts
    prelingual onset and a severity band and deliberately asserts no clinical course, because
    the only progression evidence available is from the model.

    This is not a technicality. Progression determines whether a moderate childhood loss will
    still be moderate in adulthood, and it determines when a gene replacement therapy would
    have to be given to be worth giving. A disease that is stable at moderate thresholds has
    a very different therapeutic window from one that is sliding.
  proposed_experiments:
  - experiment_id: dfnb93_longitudinal_audiometry
    name: Longitudinal audiometry across the reported CABP2 families
    description: >-
      Retrieve serial audiograms from the Iranian, Turkish, Pakistani, Italian, Danish,
      Finnish and North American probands and their affected relatives, and plot threshold
      against age by allele class.
    would_support:
    - phenotypes#Prelingual Moderate-to-Severe Sensorineural Hearing Loss
    supporting_outcome:
    - >-
      Thresholds are stable across decades, confirming the disease as a fixed prelingual loss
      and making the mouse progression a species difference to record.
    refuting_outcome:
    - >-
      Thresholds worsen with age in humans as they do in the mouse, which would add a
      progressive clinical course to the phenotype and make the timing of any future gene
      therapy the central clinical question.

notes: >-
  Named entity check. CABP2 causes one disease. There is no second CABP2 phenotype to be
  confused with, unlike the other three loci curated in this batch, and nothing in the
  knowledge base mentioned CABP2 before this entry. The related gene CABP4 causes a
  congenital stationary night blindness and is not curated here; the CaBP1 knockout appears
  only inside the double-knockout model, where it is part of the animal's genotype rather
  than a disease claim.

  Relationship to Auditory Neuropathy. DFNB93 is a genetic auditory synaptopathy and belongs
  inside the mechanism that the Auditory Neuropathy entry describes: presynaptic inner hair
  cell failure with preserved outer hair cell function. It is recorded here rather than as a
  subtype of that entry because MONDO carries it as its own disease with its own OMIM entry
  and the DFNB numbering, and because the pathograph is gene-specific down to the CaV1.3
  channel. The classification is asserted in the pathophysiology section with the two
  citations that state it, so the relationship is machine-visible rather than left in prose.

  Evidence grading. The mechanism is mouse. Every step from channel inactivation to afferent
  firing is graded MODEL_ORGANISM, and the two human anchors - the moderate-to-severe
  phenotype and the preserved otoacoustic emissions - are the only things holding the mouse
  account to the patients. Human inner ear tissue is not obtainable, so this is a permanent
  feature of the evidence base rather than a curation shortcut. The founding paper's
  biochemistry on the truncated protein is graded IN_VITRO rather than HUMAN_CLINICAL even
  though it appears in a clinical genetics paper, because evidence_source describes the
  experiment and not the paper it sits in.

  What is deliberately absent. No progression, because only the mouse has it. No
  clinical_trials, because there are none. No datasets, because no CABP2-specific omics
  dataset was found and a gene-symbol search would return the retinal CaBP literature.


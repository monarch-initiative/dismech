animal_models:
- name: Cabp2 knockout mouse
  species: Mouse
  genotype: Cabp2 LacZ/LacZ (constitutive knockout, homozygous)
  publication: PMID:28183797
  description: >-
    Constitutive Cabp2 disruption produces impaired auditory brainstem responses with preserved distortion-product
    otoacoustic emissions, enhanced inner-hair-cell calcium-current inactivation and reduced afferent
    firing. Inner hair cells and ribbon synapses were retained at the examined ages. These findings
    support presynaptic dysfunction without requiring early sensory-cell degeneration.
  modeled_mechanisms:
  - target: Enhanced CaV1.3 Calcium-Channel Inactivation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The defining channel defect, measured directly by patch clamp in the correct cell type.
    limitations: >-
      A constitutive knockout does not reproduce every human allele. An engineered human truncation
      retains some channel-regulatory activity, but residual protein in patient hair cells is unknown.
      Mouse single-neuron thresholds were relatively preserved and do not reproduce the full human
      audiometric phenotype. Assay temperature, age and cochlear position affect the observed channel
      phenotype.
    readouts:
    - name: CaV1.3 calcium-current inactivation in inner hair cells
      target: Enhanced CaV1.3 Calcium-Channel Inactivation
      direction: INCREASED
      interpretation: >-
        Inactivation of the presynaptic calcium current is increased in the absence of CaBP2, which
        is the primary channel-level defect of this disease.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Patch-clamp recordings from Cabp2LacZ/LacZ IHCs revealed enhanced Ca2+-channel inactivation.
        explanation: >-
          The patch-clamp measurement behind this readout.
    evidence:
    - reference: PMID:28183797
      reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains the availability
        of CaV1.3 Ca2+ channels for synaptic sound encoding.
      explanation: >-
        Supports treating this model as the definitional system for the channel node.
  - target: Impaired Synaptic Sound Encoding
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse combines preserved otoacoustic emissions with abnormal brainstem responses, supporting
      a presynaptic defect. This resembles an observed human pattern without implying that all patients
      retain emissions.
    limitations: >-
      Human emissions were documented in one Italian child but were absent in other confirmed cases.
      The mouse findings are age- and assay-specific.
    readouts:
    - name: Cochlear amplification (otoacoustic emissions)
      target: Impaired Synaptic Sound Encoding
      direction: UNCHANGED
      interpretation: >-
        Outer hair cell amplification is preserved, establishing that the lesion is downstream of
        the cochlear amplifier. A deliberate negative result.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cabp2LacZ/LacZ mice displayed intact cochlear amplification but impaired auditory brainstem
          responses.
        explanation: >-
          The measurement of preserved amplification.
    - name: Auditory brainstem response threshold
      target: Impaired Synaptic Sound Encoding
      direction: INCREASED
      interpretation: >-
        Brainstem response thresholds are elevated despite the intact amplifier, which is the synaptopathic
        pattern. The direction is INCREASED because the readout is a threshold: an impaired ABR means
        more sound is needed to evoke a response, and the review literature describes the human finding
        the same way - reduced responses with increased thresholds.
      evidence:
      - reference: PMID:28183797
        reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Cabp2LacZ/LacZ mice displayed intact cochlear amplification but impaired auditory brainstem
          responses.
        explanation: >-
          The same sentence reports both halves of the dissociation.
    evidence:
    - reference: PMID:28183797
      reference_title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cabp2LacZ/LacZ mice displayed intact cochlear amplification but impaired auditory brainstem
        responses.
      explanation: >-
        Primary measurements support the observed mouse phenotype.
  - target: Reduced Temporal Precision of Auditory Nerve Firing
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Single-neuron recordings show delayed and more variable first-spike timing at sound onset.
    limitations: >-
      These are mouse recordings, not direct measurements of human auditory-nerve firing.
    evidence:
    - reference: url:https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
      reference_title: https://pure.mpg.de/rest/items/item_2419839_5/component/file_2419838/content
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Rate reduction and increased jitter of SGN firing at sound onset likely explain the impaired
        ABR wave I amplitude and threshold.
      explanation: >-
        The source links temporal imprecision with the evoked-response phenotype.
- name: Cabp1/Cabp2 double-knockout mouse with AAV CaBP2 rescue
  species: Mouse
  genotype: Cabp1-/-; Cabp2-/- double knockout, with and without AAV-PHP.eB-mediated Cabp2 transgene delivery
  publication: PMID:39718549
  description: >-
    Combined deletion of Cabp1 and Cabp2 produces much greater calcium-channel inactivation and sustained-release
    impairment than Cabp2 deletion alone. At depolarized holding potentials, sustained exocytosis
    can be abolished. Recovery after prolonged sinusoidal stimulation is delayed, whereas recovery
    after a shorter strong depolarization behaves differently. Ribbon-synapse abundance is retained
    at the examined early age, but BK-channel clusters are smaller. Neonatal Cabp2 delivery partially
    rescues channel function, synaptic release and hearing.
  modeled_mechanisms:
  - target: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The sustained component of exocytosis fails, and afferent responses become strongly rate-dependent.
    limitations: >-
      The model removes two genes and is more severe than the Cabp2-only mouse. Its effect sizes
      cannot be assigned to human DFNB93. Capacitance changes depend strongly on holding potential
      and stimulus waveform; the single knockout does not show the same whole-cell exocytosis deficit
      under the published recording conditions.
    readouts:
    - name: Sustained exocytosis in inner hair cells
      target: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
      direction: DECREASED
      interpretation: >-
        Sustained vesicle release is reduced when CaV1.3 inactivation is unopposed.
      evidence:
      - reference: PMID:39718549
        reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation, slowed
          recovery from inactivation and impaired sustained exocytosis.
        explanation: >-
          The exocytosis measurement behind this readout.
    evidence:
    - reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To encode continuous sound stimuli, the inner hair cell (IHC) ribbon synapses utilize calcium-binding
        proteins (CaBPs), which reduce the inactivation of their CaV1.3 calcium channels.
      explanation: >-
        States the function this model was built to interrogate.
  - target: Impaired Synaptic Sound Encoding
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Cabp2 delivery at postnatal day six improves channel regulation, exocytosis and auditory responses.
      This demonstrates rescue after neonatal treatment, not reversal of established adult human
      deafness.
    limitations: >-
      Rescue is partial and restores CaBP2 in an animal still lacking CaBP1. Treatment precedes mouse
      hearing onset; a human therapeutic window and long-term durability are not established. Contralateral
      transgene expression occurs, limiting the use of the opposite ear as an untreated control.
    readouts:
    - name: Hearing sensitivity and inner hair cell synaptic function after Cabp2 delivery
      target: Impaired Synaptic Sound Encoding
      direction: RESTORED
      interpretation: >-
        Both synaptic function and hearing sensitivity improve after gene delivery, which is the
        preclinical basis for treating DFNB93 as a gene replacement target.
      evidence:
      - reference: PMID:39718549
        reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Transgenic expression of CaBP2 leads to substantial recovery of IHC synaptic function and
          hearing sensitivity.
        explanation: >-
          The rescue result behind this readout.
    evidence:
    - reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic expression of CaBP2 leads to substantial recovery of IHC synaptic function and
        hearing sensitivity.
      explanation: >-
        Primary double-knockout rescue result.
  evidence:
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In these conditions, however, the recovery from inactivation was slowest in the DKO IHCs
    explanation: >-
      Recovery was slow after prolonged sinusoidal conditioning; this was not a uniform result across
      all conditioning stimuli.
  - reference: PMID:39718549
    reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission in inner hair cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the BK channel clusters appeared smaller in the DKO IHCs as compared to controls, which could
      be partially reversed by virally mediated expression of CaBP2
    explanation: >-
      An additional model-specific cellular finding; direct transcriptional regulation of BK by CaBPs

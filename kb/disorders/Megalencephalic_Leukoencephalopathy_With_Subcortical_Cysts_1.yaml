- name: AAV MLC1 Gene Replacement (preclinical)
  description: >-
    Experimental. Astrocyte-promoter AAV delivery of human MLC1 reduced cerebellar myelin vacuolation in Mlc1 knockout
    mice treated before or after onset, and a blood-brain-barrier-crossing vector given to 10-month-old knockout mice
    normalized MRI water accumulation and reversed locomotor deficits. Overexpression of MLC1 can itself cause
    vacuolation in mice, so dosing matters. No human data.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic MLC1 Loss of Function
  evidence:
  - reference: PMID:40051162
    reference_title: Gene therapy rescues brain edema and motor function in a mouse model of megalencephalic leukoencephalopathy with subcortical cysts.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite the late-stage intervention, in vivo magnetic resonance imaging revealed normalization of water
      accumulation. Notably, our therapy successfully reversed locomotor deficits in Mlc1-/- mice
    explanation: Late-stage gene replacement in knockout mice.
  - reference: PMID:32372403
    reference_title: Cerebellar Astrocyte Transduction as Gene Therapy for Megalencephalic Leukoencephalopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      myelin vacuolation was extremely reduced in treated mice at all ages and correlated with the amount of expressed
      MLC1 in Bergmann glia
    explanation: Cerebellar subarachnoid AAV-GFAP-MLC1 in knockout mice.
animal_models:
- name: Mlc1 null mouse
  species: Mouse
  genotype: Mlc1(-/-)
  publication: PMID:25382142
  description: >-
    Constitutive Mlc1 knockout with early megalencephaly, increased brain water, swollen astrocyte processes at
    fluid-brain barriers from 3 weeks and widespread intramyelinic vacuolation from 3 months. Astrocytes show slowed
    regulatory volume decrease and reduced VRAC currents.
  modeled_mechanisms:
  - target: Impaired Astrocyte Regulatory Volume Decrease
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    evidence:
    - reference: PMID:25382142
      reference_title: "Mice with megalencephalic leukoencephalopathy with cysts: a developmental angle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The cellular functional defects, described for human MLC, were confirmed.
      explanation: The knockout reproduces the volume-regulation defect seen in patient cells.
  - target: Intramyelinic Edema and Myelin Vacuolation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Replicates the early stages of the human disease; vacuolation is more prominent in cerebellar white matter than in
      the cerebral hemispheric white matter that dominates in patients, and subcortical cysts are not described.
    evidence:
    - reference: PMID:25382142
      reference_title: "Mice with megalencephalic leukoencephalopathy with cysts: a developmental angle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mlc1-null mice replicate early stages of the human disease with early onset intramyelinic edema.
      explanation: Authors' assessment of how far the model reproduces the human lesion.
- name: Mlc1 and Glialcam mouse models of MLC (seizure studies)
  species: Mouse
  genotype: Mlc1(-/-) and Glialcam loss-of-function
  publication: PMID:29466841
  description: >-
    Two genetic MLC mouse models used for wireless field-potential recordings and brain-slice electrophysiology,
    showing spontaneous epileptiform activity, a lowered seizure threshold and abnormal extracellular potassium dynamics.
  modeled_mechanisms:
  - target: Disturbed Extracellular Potassium Dynamics and Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    evidence:
    - reference: PMID:29466841
      reference_title: Seizures and disturbed brain potassium dynamics in the leukodystrophy megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the cellular level, we found that although passive and active properties of individual pyramidal neurons are
        unchanged, extracellular K+ dynamics and neuronal network activity are abnormal in MLC mice.
      explanation: Potassium and network findings in the mouse models.
experimental_models:
- name: MLC patient lymphoblasts and MLC1-knockdown astrocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:22006981
  description: >-
    Patch-clamp and cell-volume measurements in patient lymphoblasts and in astrocytes with siRNA knock-down of MLC1,
    with rescue by normal MLC1.
  modeled_mechanisms:
  - target: Impaired Astrocyte Regulatory Volume Decrease
    relationship: MEASURES
    fidelity: MODERATE
    limitations: >-

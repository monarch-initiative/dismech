- name: Disrupted MLC1-GlialCAM-ClC-2 Junctional Complex
  biological_scale: MOLECULAR
  description: >-
    GlialCAM (HGNC symbol HEPACAM) binds MLC1 directly and is required to localize it at astrocytic junctions; GlialCAM
    is also an auxiliary subunit of the ClC-2 chloride channel. In Mlc1-null mice GlialCAM and ClC-2 are mislocalized
    and expressed at lower levels, and ClC-2 currents are altered. The human evidence differs: in the post-mortem brain
    of a p.Ser69Leu homozygote GlialCAM amount and localization were nearly normal. How far loss of the complex, as
    opposed to loss of MLC1 alone, drives the human disease is therefore unresolved. MLC1 also associates with the
    dystrophin-glycoprotein complex and Kir4.1 at astrocytic endfeet.

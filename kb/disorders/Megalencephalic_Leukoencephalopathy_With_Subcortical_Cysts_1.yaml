      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Down regulation of endogenous MLC1 expression in astrocytes by small interfering RNA greatly reduced the activity
        of this channel, which was rescued by overexpression of normal MLC1.
      explanation: Astrocyte knock-down and rescue arm of the study.

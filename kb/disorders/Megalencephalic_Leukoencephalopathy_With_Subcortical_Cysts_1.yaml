- name: Swelling of Perivascular Astrocyte Endfeet
  biological_scale: CELLULAR
  description: >-
    Astrocyte processes abutting blood vessels and other fluid-brain barriers swell. In Mlc1-null mice this precedes
    myelin vacuolation, and loss of MLC1 also disturbs postnatal maturation of perivascular astrocytic processes,
    vascular smooth muscle contractility, neurovascular coupling and interstitial fluid clearance. Patient biopsies show
    vacuoles in perivascular astrocyte endfeet as well as in myelin.

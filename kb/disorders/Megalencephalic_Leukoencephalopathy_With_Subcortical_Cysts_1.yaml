name: Megalencephalic Leukoencephalopathy With Subcortical Cysts 1
creation_date: "2026-10-16T11:33:09Z"
category: Mendelian
description: >-
  Autosomal recessive leukodystrophy caused by biallelic loss-of-function variants in MLC1, which encodes an
  astrocyte membrane protein with eight predicted transmembrane domains. MLC1 sits with GlialCAM (HEPACAM) at
  astrocyte-astrocyte junctions of perivascular and subpial endfeet facing the blood-brain and CSF-brain barriers. Most
  missense alleles misfold and are degraded, so little MLC1 reaches the plasma membrane. Without it astrocytes show
  reduced volume-regulated anion channel (VRAC) currents and slowed regulatory volume decrease, their endfeet swell,
  and fluid accumulates between the outermost myelin lamellae, giving a spongiform, vacuolating myelinopathy with
  increased white matter water content. Macrocephaly develops in the first year of life, while MRI shows diffusely
  swollen cerebral hemispheric white matter and subcortical cysts in the anterior temporal and often frontoparietal
  regions. After a few years a slowly progressive cerebellar ataxia and spasticity appear, with early-onset seizures
  that are usually well controlled but with relatively frequent status epilepticus, and later mild cognitive decline.
  Minor head trauma can provoke transient or lasting deterioration, including prolonged coma. MLC1 accounts for about
  three quarters of classic MLC; classic MLC caused by recessive HEPACAM variants (MLC2A) is clinically and
  radiologically indistinguishable, while dominant HEPACAM variants (MLC2B) and the GPRC5B and AQP4 forms are
  separate disorders.

- name: Disturbed Extracellular Potassium Dynamics and Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    In two genetic mouse models of MLC, single pyramidal neurons are normal but extracellular potassium dynamics and
    network activity are abnormal, with spontaneous epileptiform activity and a lowered threshold for induced seizures.
    A disturbed potassium uptake is proposed to hamper recovery of ion gradients after a seizure, which would fit the
    frequent status epilepticus in patients.

notes: >-
  The clinical frequencies below come mainly from the 2018 international cross-sectional cohort of 242 patients
  (PMID:29661901), of whom 187 had MLC1-related disease; several of its figures (seizures, cognitive decline) are
  reported for MLC1 and MLC2A combined because the two did not differ. The GeneReviews chapter covers all forms of MLC
  together. No population incidence or prevalence specific to MLC1 has been published. The gene-disease relationship
  is long established (mapping and identification in 2001, many unrelated families since); a ClinGen gene-disease
  validity record for MLC1 was not found in the local cache, so no validity tier is recorded.
pathophysiology:
- name: Biallelic MLC1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous MLC1 variants - nonsense, frameshift, splice-site and missense alleles, the
    latter affecting residues in predicted transmembrane domains - cause the disease. Within the brain MLC1 is
    expressed only in astrocytes, most strongly in those facing fluid-brain barriers.

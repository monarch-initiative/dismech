  description: >-
    Brain MRI is the key investigation and suffices for a clinical diagnosis together with the clinical picture:
    diffusely abnormal, mildly swollen cerebral hemispheric white matter with subcortical cysts almost invariably in the
    anterior temporal region and often frontoparietally. Over time swelling decreases, cerebral atrophy ensues and cysts
    may enlarge. No MRI feature distinguishes MLC1 from recessive HEPACAM disease (MLC2A).

    reference_title: "Megalencephalic leucoencephalopathy with cysts: defect in chloride currents and cell volume regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The currents were absent in chloride-free medium and in cells with disease-causing MLC1 mutations.
    explanation: >-
      Grounds the decreased ion channel regulator activity. MLC1 is not shown to be the pore itself; its expression
      confers a volume-regulated anion current that disease-causing alleles fail to confer.
  - reference: PMID:38141856
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts protein-1: A new calcium-sensitive protein functionally activated by endoplasmic reticulum calcium release and calmodulin binding in astrocytes."

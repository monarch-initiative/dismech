- name: MLC1 Misfolding and Loss from the Astrocyte Plasma Membrane
  biological_scale: CELLULAR
  description: >-
    Mutant MLC1 is cleared by ER-associated and endolysosomal degradation, so total and plasma-membrane MLC1 levels
    fall; the defect can be partly rescued in culture by low temperature or the chemical chaperone glycerol, which led
    the authors to class MLC as a conformational disease. In the post-mortem brain of a patient homozygous for
    p.Ser69Leu, MLC1 protein was almost undetectable. Truncating alleles remove the protein outright.
  cell_types:

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Walking is often unstable, followed by ataxia of the trunk and extremities, pyramidal dysfunction, and brisk deep
      tendon reflexes.
    explanation: GeneReviews description of the motor phenotype.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."

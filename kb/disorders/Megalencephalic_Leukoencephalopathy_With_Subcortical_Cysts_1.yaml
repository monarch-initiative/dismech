genetic:
- name: MLC1
  gene_term:
    preferred_term: MLC1
    term:
      id: hgnc:17082
      label: MLC1
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic germline MLC1 variants account for about 75% of patients with MLC. A 2024 variant update catalogued 151
    unique MLC1 variants among 508 MRI-confirmed MLC patients, including splice, deep-intronic and promoter variants;
    that catalogue includes variants of uncertain significance.
  evidence:
  - reference: PMID:11254442
    reference_title: "Mutations of MLC1 (KIAA0027), encoding a putative membrane protein, cause megalencephalic leukoencephalopathy with subcortical cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve different mutations in seven informative and six uninformative families were found in one of the candidate
      genes, KIAA0027, which we renamed "MLC1."
    explanation: Identification of MLC1 by linkage and mutation screening.
  - reference: PMID:21419380
    reference_title: "Mutant GlialCAM causes megalencephalic leukoencephalopathy with subcortical cysts, benign familial macrocephaly, and macrocephaly with retardation and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Recessive MLC1 mutations are observed in 75% of patients with MLC.
    explanation: Share of MLC explained by MLC1.
  - reference: PMID:38487253
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: a variant update and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 151 unique MLC1 variants, 29 GLIALCAM variants, 2 GPRC5B variants and 1 AQP4 variant observed in these
      MLC patients.
    explanation: Size of the MLC1 variant spectrum.
  variants:
  - name: Exon 2 cytosine insertion (320insC; Agarwal founder allele)
    description: >-
      Frameshift allele homozygous in all 31 tested affected members of the North Indian Agarwal community, indicating a
      founder effect; the disease in this community follows a mildly progressive course.
    evidence:
    - reference: PMID:15037685
      reference_title: Indian Agarwal megalencephalic leukodystrophy with cysts is caused by a common MLC1 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All 31 Agarwal patients tested positive for a homozygous insertion of a cytosine in exon 2.
      explanation: Founder allele in Agarwal patients.
  - name: p.Gly59Glu
    description: Found in the vast majority of MLC patients in Israel; enriched among Libyan Jews.
    evidence:
    - reference: PMID:12189496
      reference_title: Megalencephalic leukoencephalopathy with subcortical cysts; a founder effect in Israeli patients and a higher than expected carrier rate among Libyan Jews.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: One of these mutations, p.G59E, was found in the vast majority of MLC patients in Israel.
      explanation: Founder allele in Israeli patients.
  - name: p.Ser69Leu
    description: >-
      Missense allele that destabilizes MLC1; in the brain of a homozygous patient MLC1 protein was almost undetectable.
    evidence:
    - reference: PMID:21624973
      reference_title: Molecular mechanisms of MLC1 and GLIALCAM mutations in megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: reduces MLC1 protein levels in the brain to almost undetectable
      explanation: Post-mortem evidence for the allele.
    - reference: PMID:21624973
      reference_title: Molecular mechanisms of MLC1 and GLIALCAM mutations in megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We showed that this mutation affects the stability of MLC1 in vitro
      explanation: Functional evidence for the allele in cultured cells.

- name: Impaired Astrocyte Regulatory Volume Decrease
  biological_scale: CELLULAR
  description: >-
    MLC1 expression is associated with a volume-regulated anion current that is enhanced by hypotonic swelling and
    abolished by disease-causing mutations or MLC1 knock-down. Patient lymphoblasts and MLC1-deficient astrocytes show
    hampered regulatory volume decrease, and Mlc1-null astrocytes show slowed regulatory volume decrease that improves
    on MLC1 re-expression. MLC1 activity is itself tuned by ER calcium release and calmodulin binding.

  - target: Cerebral Subcortical Cysts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cysts are fluid-filled spaces in the most swollen subcortical white matter; their formation from the
      vacuolating process is inferred and has not been studied directly.
  - target: Progressive Cerebellar Ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Motor impairment is attributed to white matter injury. In the knockout mouse, restoring MLC1 reversed vacuolation
      and ataxia-like motor deficits together, which supports but does not prove the link.
    evidence:
    - reference: PMID:40051162
      reference_title: Gene therapy rescues brain edema and motor function in a mouse model of megalencephalic leukoencephalopathy with subcortical cysts.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        these findings not only demonstrate the sustained efficacy of our gene therapy but also highlight the
        reversibility of vacuolation and motor impairments in Mlc1-/- mice
      explanation: Vacuolation and motor impairment reverse together after MLC1 gene replacement.
  - target: Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Pyramidal involvement is attributed to the white matter disease; the intermediate steps are not known.
  - target: Mental Deterioration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Late, usually mild cognitive decline is attributed to progressive white matter injury; mechanism unknown.
phenotypes:
- category: Neurological
  name: Macrocephaly
  description: >-
    The usual first sign, present at birth or more often developing during the first year, with head circumference up to
    four to six standard deviations above the mean. Head growth then runs parallel to the centiles; macrocephaly
    persists in more than half of patients.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
    onset:
      onset_category: INFANTILE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macrocephaly in the first year of life was the most common first disease sign and had been present in almost all
      patients in infancy.
    explanation: Cohort of 242 genetically confirmed patients, 187 with MLC1.
  - reference: PMID:20301707
    reference_title: Megalencephalic Leukoencephalopathy with Subcortical Cysts.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The degree of macrocephaly is variable, with head circumferences reaching four to six standard deviations greater
      than the mean.
    explanation: GeneReviews description of the degree of macrocephaly.
- category: Neurological
  name: Megalencephaly
  description: Enlarged brain from infancy, attributed to white matter edema.
  phenotype_term:
    preferred_term: Megalencephaly
    term:
      id: HP:0001355
      label: Megalencephaly
    onset:
      onset_category: INFANTILE
  sequelae:
  - target: Macrocephaly
  evidence:
  - reference: PMID:7695231
    reference_title: Leukoencephalopathy with swelling and a discrepantly mild clinical course in eight children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An identical syndrome of cerebral leukoencephalopathy and megalencephaly with infantile onset was discovered in 8
      children, including 2 siblings.
    explanation: Original clinical delineation of the disorder, before the gene was known.
- category: Neurological
  name: Diffuse Swelling of Cerebral White Matter
  description: >-
    Diffuse signal abnormality and swelling of the cerebral hemispheric white matter on MRI, most prominent in the first
    years; in MLC1 it persists or increases, and improvement is rare.
  phenotype_term:
    preferred_term: Diffuse swelling of cerebral white matter
    term:
      id: HP:0007341
      label: Diffuse swelling of cerebral white matter
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:11254442
    reference_title: "Mutations of MLC1 (KIAA0027), encoding a putative membrane protein, cause megalencephalic leukoencephalopathy with subcortical cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brain appears swollen on magnetic resonance imaging, with diffuse white-matter abnormalities and the invariable
      presence of subcortical cysts.
    explanation: MRI definition of the disorder in the gene-identification study.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with MLC1 and patients with MLC2A, the white matter signal abnormalities persisted or increased, with
      the exception of 2 patients with MLC1 who showed improvement.
    explanation: Course of the white matter abnormality in the MLC1 cohort.
- category: Neurological
  name: Cerebral Subcortical Cysts
  description: >-
    Subcortical cysts are present in all patients with MLC1, almost invariably in both anterior temporal lobes and often
    also frontal and parietal, never occipital. Their number stays the same or increases over time.
  phenotype_term:
    preferred_term: Cerebral subcortical cyst
    term:
      id: HP:6000461
      label: Cerebral subcortical cyst
  frequency: OBLIGATE
  evidence:
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Subcortical cysts were present in all patients with MLC1 and almost all patients with MLC2A.
    explanation: Cyst frequency in the 187-patient MLC1 subgroup with MRI review.
  - reference: PMID:29661901
    reference_title: "Megalencephalic leukoencephalopathy with subcortical cysts: Characterization of disease variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

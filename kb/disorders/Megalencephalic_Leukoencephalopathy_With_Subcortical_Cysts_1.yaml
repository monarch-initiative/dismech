    evidence_source: IN_VITRO
    snippet: >-
      following Ca2+ release, MLC1 binds the Ca2+ effector protein calmodulin (CaM) at the carboxyl terminal where a
      CaM binding sequence was identified.
    explanation: >-
      Grounds calmodulin binding as a normal MLC1 activity; no modifier is given because the study tested engineered
      CaM-site mutants, not patient alleles.
  - reference: PMID:11254442
    reference_title: "Mutations of MLC1 (KIAA0027), encoding a putative membrane protein, cause megalencephalic leukoencephalopathy with subcortical cysts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations further included frameshifts, splice-acceptor mutations, a putative splice-donor mutation, and
      amino acid substitutions of residues in predicted transmembrane domains. These data provide strong evidence that
      mutations of MLC1 cause the disease.
    explanation: Gene identification study in families with MLC.
  - reference: PMID:25382142
    reference_title: "Mice with megalencephalic leukoencephalopathy with cysts: a developmental angle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Like humans, mice expressed MLC1 only in astrocytes, especially those facing fluid-brain barriers.
    explanation: Places the primary lesion in astrocytes at fluid-brain barriers in both species.

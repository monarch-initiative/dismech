- accession: dbgap:phs000543
  title: Exome Sequencing of Pleuropulmonary Blastoma
  description: Pleuropulmonary blastoma (PPB) is a rare, aggressive pediatric cancer arising from the lung or pleural cavity. In this study, we sequenced and analyzed the exomes of 15 PPB matched tumor and normal pairs. This study is part of a larger effort to characterize pediatric cancers as part of the Slim Initiative for Genomic Medicine (SIGMA) project.

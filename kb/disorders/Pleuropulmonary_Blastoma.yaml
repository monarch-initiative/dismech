inheritance:
- name: Autosomal dominant predisposition
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous germline loss-of-function variants in DICER1 underlie the
    majority of pleuropulmonary blastoma cases. DICER1-related tumor
    predisposition is inherited in an autosomal dominant manner with reduced,
    age-related penetrance, and each child of an affected individual has a 50%
    chance of inheriting the pathogenic variant.
  evidence:
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      DICER1 is inherited in an autosomal dominant manner with reduced,
      age-related penetrance.
    explanation: >-
      GeneReviews establishes autosomal dominant inheritance with reduced,
      age-related penetrance for DICER1-related tumor predisposition.
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a germline constitutional DICER1
      pathogenic variant has a 50% chance of inheriting the pathogenic variant.
      Because the penetrance of heterozygous germline DICER1 pathogenic variants
      is reduced, many individuals with a germline DICER1 pathogenic variant
      remain clinically unaffected.
    explanation: >-
      Documents the 50% autosomal dominant transmission risk and reduced
      penetrance in germline DICER1 carriers.
  - reference: PMID:19556464
    reference_title: DICER1 mutations in familial pleuropulmonary blastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that 11 multiplex PPB families harbor heterozygous germline
      mutations in DICER1, a gene encoding an endoribonuclease critical to the
      generation of small noncoding regulatory RNAs.
    explanation: >-
      Establishes heterozygous germline DICER1 mutations in familial PPB.
  - reference: PMID:25209242
    reference_title: "Pleuropulmonary blastoma: a report on 350 central pathology-confirmed pleuropulmonary blastoma cases by the International Pleuropulmonary Blastoma Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A germline mutation in DICER1 is the genetic cause in the majority of PPB cases.
    explanation: >-
      Confirms that germline DICER1 predisposition underlies the majority of PPB cases.

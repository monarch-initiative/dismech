diagnosis:
- name: Histopathologic examination of resected tumor
  diagnosis_term:
    preferred_term: histopathologic examination of resected lung lesion
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  description: >-
    Definitive diagnosis and subtype classification (Type I, Ir, II, or III)
    require histopathologic evaluation of the resected lung or pleural lesion to
    identify primitive mesenchymal cells and sarcomatous components.
  results: Identification of Type I cystic, Type II mixed cystic/solid, or Type III solid pleuropulmonary blastoma architecture.
  evidence:
  - reference: PMID:25209242
    reference_title: "Pleuropulmonary blastoma: a report on 350 central pathology-confirmed pleuropulmonary blastoma cases by the International Pleuropulmonary Blastoma Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the newborn or older infant, purely cystic type I PPB is readily
      mistaken for one of several congenital cystic lesions of the lungs such as
      congenital pulmonary airway malformation (CPAM). Such lesions are more
      likely to be PPB if there is a family history of PPB or associated tumors,
      but ultimately, a pathological examination is required.
    explanation: Registry study establishes that pathological examination is required to definitively diagnose PPB and distinguish it from congenital cystic lung lesions.
  - reference: PMID:33826235
    reference_title: "Pleuropulmonary blastoma in children and adolescents: The EXPeRT/PARTNER diagnostic and therapeutic recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is classified by the macroscopic appearance into three interrelated
      clinico-pathologic entities on a developmental continuum.
    explanation: European consensus recommendations confirm clinico-pathologic classification across the three PPB subtypes.
  - reference: PMID:37119756
    reference_title: "Type II pleuropulmonary blastoma mistaken for rhabdomyosarcoma: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathology of the tumor retained a definitive diagnosis of PPB type II."
    explanation: Demonstrates that histopathologic examination of the resected tumor establishes the definitive diagnosis and subtype of PPB.
- name: DICER1 molecular genetic testing
  diagnosis_term:
    preferred_term: DICER1 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline and somatic DICER1 sequencing identifies predisposing loss-of-function
    variants and somatic RNase IIIb hotspot mutations characteristic of PPB.
  results: Germline loss-of-function DICER1 variant and/or somatic RNase IIIb hotspot missense variant.
  evidence:
  - reference: PMID:24761742
    reference_title: DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DICER1 is established by identification of a heterozygous
      germline DICER1 pathogenic variant that is known or suspected to cause
      loss of function.
    explanation: GeneReviews establishes germline DICER1 molecular genetic testing as diagnostic for DICER1-related tumor predisposition.
  - reference: PMID:25209242
    reference_title: "Pleuropulmonary blastoma: a report on 350 central pathology-confirmed pleuropulmonary blastoma cases by the International Pleuropulmonary Blastoma Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A germline mutation in DICER1 is the genetic cause in the majority of PPB cases."
    explanation: Supports DICER1 genetic testing to identify the underlying germline predisposition in most PPB cases.
differential_diagnoses:
- name: Congenital pulmonary airway malformation
  disease_term:
    preferred_term: congenital pulmonary airway malformation
    term:
      id: MONDO:0016580
      label: congenital pulmonary airway malformation
  description: >-
    Cystic Type I PPB closely mimics congenital cystic lung lesions and
    developmental malformations both clinically and radiographically.
  distinguishing_features:
  - Subepithelial primitive mesenchymal cell layer, rhabdomyoblastic or cartilaginous nodules, and pathogenic DICER1 variants distinguish Type I PPB from developmental lung cysts.
  evidence:
  - reference: PMID:18223332
    reference_title: "Type I pleuropulmonary blastoma: pathology and biology study of 51 cases from the international pleuropulmonary blastoma registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The early form of the disease, cystic type I PPB, can be clinically and pathologically deceptive because of its resemblance to some developmental lung cysts."
    explanation: Establishes developmental lung cysts as a key differential diagnosis for cystic Type I PPB.
- name: Rhabdomyosarcoma
  disease_term:
    preferred_term: rhabdomyosarcoma
    term:
      id: MONDO:0005212
      label: rhabdomyosarcoma
  description: >-
    Because PPB frequently exhibits rhabdomyoblastic differentiation within its
    sarcomatous stroma, limited biopsy specimens of Type II or Type III PPB can
    be mistaken for primary intrathoracic rhabdomyosarcoma.
  distinguishing_features:
  - Complete tumor histopathology showing mixed primitive blastomatous and multipatterned sarcomatous elements (including cartilage and cystic epithelial-lined spaces) together with DICER1 mutations distinguishes PPB from rhabdomyosarcoma.
  evidence:
  - reference: PMID:37119756
    reference_title: "Type II pleuropulmonary blastoma mistaken for rhabdomyosarcoma: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biopsy followed by histological analysis suggested rhabdomyosarcoma."
    explanation: Documents clinical and histologic mimicry between Type II PPB and rhabdomyosarcoma on initial biopsy.
treatments:
- name: Complete Tumor Resection
  description: >-
    Complete surgical excision is a central therapeutic goal across PPB and is
    especially important for cystic type I disease to prevent progression.
  treatment_term:
    preferred_term: complete tumor resection
    term:
      id: NCIT:C175027
      label: Complete Resection
  target_mechanisms:
  - target: Multicystic Type I Lesion
    treatment_effect: INHIBITS
    description: Complete surgical excision removes the cystic Type I PPB lesion and prevents progression to high-grade sarcoma.
    evidence:
    - reference: PMID:36541021
      reference_title: "Type I and Ir pleuropulmonary blastoma (PPB): A report from the International PPB/DICER1 Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        For young children with type I PPB, outcomes are favorable, but complete
        resection is indicated because of the risk for progression.
      explanation: Supports complete surgical excision of cystic Type I PPB to prevent progression to Type II/III sarcoma.
  - target: Sarcomatous Progression
    treatment_effect: INHIBITS
    description: Complete surgical resection removes progressive Type II/III sarcomatous tissue.
    evidence:

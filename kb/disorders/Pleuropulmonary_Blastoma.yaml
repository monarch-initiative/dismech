datasets:
- accession: ega:EGAS00001000662
  title: Biallelic DICER1 mutations in sporadic pleuropulmonary blastoma
  description: Pleuropulmonary blastoma (PPB) is an extremely rare pediatric malignancy in the lung, whose pathogenesis is poorly understood, except for recent reports of frequent germline heterozygous DICER1 mutations. To investigate the genetic basis of PPB, we performed whole-exome sequencing in 7 representative PPB cases, followed by targeted deep sequencing in 12 cases with PPB. DICER1 mutations were found in 11/12 cases. Biallelic DICER1 mutations were common in PPB, in which RNase IIIb domain mutations were found in all cases with or without nonsense/frameshift mutations and were somatic in all evaluable cases.

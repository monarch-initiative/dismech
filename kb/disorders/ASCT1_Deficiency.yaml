notes: >-
  Named ASCT1 Deficiency rather than after the MONDO label: the dyad is a MONDO
  EXACT synonym (from Orphanet:447997), recurs in the primary literature, and
  names the single gene the entry is about, while the descriptive triad is kept
  in synonyms. No GeneReviews chapter covers SLC1A4; the GeneReviews chapter
  Serine Deficiency Disorders (PMID:37347880) is scoped to the PHGDH, PSAT1 and
  PSPH biosynthesis defects, and its cached record does not mention SLC1A4 or
  ASCT1, so the phenotype baseline here is Orphanet ORPHA:447997 plus the
  primary case reports. PMID:37194416 reports a de novo heterozygous
  three-amino-acid duplication acting as a dominant negative and causing an
  autosomal dominant epilepsy syndrome; that is a separate dominant entity, not
  this recessive disorder, so it is cited only in these notes and no genetic row
  asserts it here. Systemic amino acid measurements are typically normal, which
  is why the disorder is reached by sequencing rather than metabolic screening;
  cerebrospinal fluid serine has not been systematically reported across the
  cohort, so no biochemical section is given.

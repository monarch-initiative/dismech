pathophysiology:
- name: SLC1A4 Transporter Loss of Function
  role: trigger
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  node_class: TRANSPORT_ACTIVITY
  description: >-
    Biallelic SLC1A4 variants reduce or abolish the neutral amino acid exchange
    activity of ASCT1 without preventing its delivery to the plasma membrane.
    The recurrent p.Glu256Lys allele lowers maximal transport rate while
    retaining substrate selectivity; nonsense and frameshift alleles are
    expected to abolish the protein.
  genes:
  - preferred_term: SLC1A4
    term:
      id: hgnc:10942
      label: SLC1A4
  molecular_functions:
  - preferred_term: L-serine transmembrane transporter activity
    term:
      id: GO:0015194
      label: L-serine transmembrane transporter activity
    modifier: DECREASED
  - preferred_term: neutral amino acid exchange activity of ASCT1
    term:
      id: GO:0015175
      label: neutral L-amino acid transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26041762
    reference_title: Mutations in SLC1A4, encoding the brain serine transporter, are associated with developmental delay, microcephaly and hypomyelination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the mutations did not affect the protein level at the plasma membrane but abolished or markedly reduced L-serine transport
    explanation: Heterologous expression shows the disease alleles impair L-serine transport rather than protein trafficking.
  downstream:
  - target: Reduced L-Serine Influx Across the Blood-Brain Barrier
    causal_link_type: DIRECT
    description: ASCT1 is the L-serine transporter of the blood-brain barrier, so loss of its activity reduces serine entry into the brain.
    evidence:
    - reference: PMID:38662784
      reference_title: A new type of blood-brain barrier aminoacidopathy underlies metabolic microcephaly associated with SLC1A4 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: acute inhibition or deletion of Slc1a4 leads to a decrease in serine influx into the brain
      explanation: Endothelial deletion and acute inhibition of the transporter directly reduce brain serine influx in mice.
  - target: Loss of the Astrocyte-to-Neuron L-Serine Shuttle
    causal_link_type: DIRECT
    description: ASCT1 is the dedicated transporter shuttling astrocyte-derived L-serine to neurons, so its loss interrupts that supply route.
    evidence:
    - reference: PMID:26041762
      reference_title: Mutations in SLC1A4, encoding the brain serine transporter, are associated with developmental delay, microcephaly and hypomyelination.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: its shuttle to neuronal cells is performed by a dedicated neutral amino acid transporter, ASCT1
      explanation: Identifies ASCT1 as the transporter carrying glia-derived serine to neurons.
  - target: Brain D-Serine Deficiency and NMDA Receptor Co-agonist Loss
    causal_link_type: DIRECT
    description: ASCT1 is the major astrocytic D-serine uptake system, so loss of the transporter alters brain D-serine handling.
    evidence:
    - reference: PMID:30185558
      reference_title: ASCT1 (Slc1a4) transporter is a physiologic regulator of brain d-serine and neurodevelopment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: ASCT1 is a major d-serine uptake system in astrocytes and can also export l-serine via heteroexchange
      explanation: Knockout work assigns astrocytic D-serine uptake to ASCT1.

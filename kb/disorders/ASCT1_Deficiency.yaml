genetic:
- name: SLC1A4
  gene_term:
    preferred_term: SLC1A4
    term:
      id: hgnc:10942
      label: SLC1A4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Biallelic SLC1A4 variants cause this disorder. At least nine distinct
    alleles are reported, including missense, nonsense and small frameshifting
    deletions. The p.Glu256Lys missense allele recurs as a founder variant in
    the Ashkenazi Jewish population; frameshift and nonsense alleles have been
    described in other ancestries. Whether loss-of-function alleles produce a
    more severe phenotype than missense alleles has been suggested but not
    formally tested.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_8cff4bb6-caab-4696-a061-1f9a40c56c80-2021-05-14T160000.000Z
    evidence:
    - reference: CGGV:assertion_8cff4bb6-caab-4696-a061-1f9a40c56c80-2021-05-14T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: SLC1A4 | HGNC:10942 | spastic tetraplegia-thin corpus callosum-progressive postnatal microcephaly syndrome | MONDO:0014725 | AR | Definitive
      explanation: The ClinGen Aminoacidopathy GCEP classifies this gene-disease relationship as Definitive for autosomal recessive inheritance.
  evidence:
  - reference: CGGV:assertion_8cff4bb6-caab-4696-a061-1f9a40c56c80-2021-05-14T160000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At least 9 unique variants (missense, nonsense and small deletions) have been reported in humans.
    explanation: Summarises the allelic spectrum underpinning the causative relationship.
  - reference: PMID:26041762
    reference_title: Mutations in SLC1A4, encoding the brain serine transporter, are associated with developmental delay, microcephaly and hypomyelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified the recessive mutations, p.E256K, p.L315fs, and p.R457W, in SLC1A4, the gene encoding ASCT1
    explanation: Establishes multiple recessive SLC1A4 alleles in affected individuals.
  variants:
  - name: NM_003038.4:c.766G>A (p.Glu256Lys)
    clinical_significance: PATHOGENIC
    description: >-
      Founder missense allele recurring in the Ashkenazi Jewish population,
      found homozygous and in compound heterozygosity. It reaches the plasma
      membrane but has a reduced maximal transport rate.
    evidence:
    - reference: PMID:26138499
      reference_title: SLC1A4 mutations cause a novel disorder of intellectual disability, progressive microcephaly, spasticity and thin corpus callosum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The Ashkenazi patient is homozygous for a deleterious missense c.766G>A, p.(E256K) mutation
      explanation: Reports the founder allele in homozygous state.
  - name: c.945delTT (p.Leu315Hisfs*42)
    clinical_significance: PATHOGENIC
    description: Frameshifting deletion truncating a substantial part of the transporter, reported in compound heterozygosity with p.Glu256Lys.
    evidence:
    - reference: PMID:26138499
      reference_title: SLC1A4 mutations cause a novel disorder of intellectual disability, progressive microcephaly, spasticity and thin corpus callosum.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: compound heterozygous for this mutation and a nonsense c.945delTT, p.(Leu315Hisfs*42) mutation
      explanation: Reports the truncating allele in trans with the founder variant.
  - name: p.Arg457Trp
    clinical_significance: PATHOGENIC
    description: Missense allele at a residue where two different substitutions have been reported; p.Arg457Trp abolished L-serine transport in vitro.
    evidence:
    - reference: PMID:41934118
      reference_title: "Expanding the Phenotypic Spectrum of SLC1A4-Related Spastic Tetraplegia: A Case With Novel Multisystem Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Genetic testing confirmed a homozygous pathogenic variant in SLC1A4 (p.Arg457Trp).
      explanation: Reports the homozygous allele in a recent patient.
  - name: p.Trp453*
    clinical_significance: PATHOGENIC
    description: Nonsense allele in an Irish proband with infantile spasms, the first non-Ashkenazi European case.
    evidence:
    - reference: PMID:27193218
      reference_title: "Novel European SLC1A4 variant: infantile spasms and population ancestry analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing performed in an Irish proband identified a novel homozygous nonsense SLC1A4 variant [p.Trp453*]"
      explanation: Reports the nonsense allele outside the founder population.
  - name: "c.1141G>A (p.Gly381Arg)"
    clinical_significance: PATHOGENIC
    description: Homozygous missense allele in a Southern Italian family with epileptic encephalopathy and congenital microcephaly.
    evidence:
    - reference: PMID:29989513
      reference_title: "A novel SLC1A4 homozygous mutation causing congenital microcephaly, epileptic encephalopathy and spastic tetraparesis: a video-EEG and tractography - case study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing identified a novel segregating SLC1A4 gene homozygous mutation (c.1141G > A: p.Gly381Arg)"
      explanation: Reports the allele and its segregation in the family.
  - name: "c.971delA (p.Asn324Thrfs*29)"
    clinical_significance: PATHOGENIC
    description: >-
      Maternal frameshift allele reported in compound heterozygosity with the
      paternal missense c.542C>T; transcript analysis supported degradation by
      nonsense-mediated decay.
    evidence:
    - reference: PMID:37502193
      reference_title: "Novel compound heterozygous variants (c.971delA/c.542C > T) in SLC1A4 causes spastic tetraplegia, thin corpus callosum, and progressive microcephaly: a case report and mutational analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: leading to the generation of a premature stop codon and its subsequent degradation by nonsense-mediated mRNA decay as detected through expression analysis
      explanation: Reports the frameshift allele and the expression evidence for transcript loss.
animal_models:
- name: Slc1a4 constitutive knockout mouse
  species: Mouse
  genotype: Slc1a4 null (ASCT1-KO), homozygous
  publication: PMID:30185558
  genes:
  - preferred_term: Slc1a4
    term:
      id: MGI:2135601
      label: Slc1a4
  description: >-
    Constitutive ASCT1 knockout mice have low brain D-serine with raised
    L-alanine, L-threonine and glycine, smaller hippocampal and striatal
    volumes, altered expression of neurodevelopmental genes, and deficits in
    motor function, spatial learning and affective behaviour.
  modeled_mechanisms:
  - target: Brain D-Serine Deficiency and NMDA Receptor Co-agonist Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: Whole-animal deletion establishes the transporter's role in setting brain D-serine levels and NMDA co-agonism.
    limitations: >-
      A complete null is a more severe lesion than the hypomorphic missense
      alleles most patients carry, so the size of the D-serine deficit may not
      represent the human disease.
    evidence:
    - reference: PMID:30185558
      reference_title: ASCT1 (Slc1a4) transporter is a physiologic regulator of brain d-serine and neurodevelopment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In vivo microdialysis demonstrated lower levels of extracellular d-serine in ASCT1-KO mice, confirming altered d-serine metabolism.
      explanation: Direct in vivo measurement of the deficit this node describes.
  - target: Impaired Neuronal Differentiation and Cortical Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Regional brain volumes are reduced and neurodevelopmental gene expression altered, but the model is not reported as microcephalic in the way patients are.
    limitations: Volume loss is reported for hippocampus and striatum rather than as the global progressive microcephaly that defines the human disorder.
    evidence:
    - reference: PMID:30185558
      reference_title: ASCT1 (Slc1a4) transporter is a physiologic regulator of brain d-serine and neurodevelopment.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These alterations are reminiscent of some of the neurodevelopmental phenotypes exhibited by patients with ASCT1 mutations.
      explanation: The authors themselves limit the claim to partial resemblance.
  evidence:
  - reference: PMID:30185558
    reference_title: ASCT1 (Slc1a4) transporter is a physiologic regulator of brain d-serine and neurodevelopment.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Using ASCT1 and ASCT2 KO mice, we report that ASCT1, rather than ASCT2, is a physiologic regulator of d-serine metabolism
    explanation: Establishes the model and its specificity against the ASCT2 paralogue.
- name: Slc1a4 p.Glu256Lys knock-in mouse
  species: Mouse
  genotype: Slc1a4 p.Glu256Lys (E256K) homozygous knock-in
  background: C57BL/6J
  publication: PMID:37642681
  genes:
  - preferred_term: Slc1a4
    term:
      id: MGI:2135601
      label: Slc1a4
  description: >-
    CRISPR knock-in of the common human allele. Homozygotes are microcephalic
    with a thin corpus callosum and thin cortical layer 1, but perform normally
    in motor, learning and memory assays and show no long-term potentiation
    deficit, so the model separates the structural from the cognitive phenotype.
  modeled_mechanisms:
  - target: Impaired Neuronal Differentiation and Cortical Growth
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: The allele-matched model reproduces microcephaly and the thin corpus callosum but not the severe cognitive and motor impairment of patients.
    limitations: >-
      Cognition and motor function are essentially spared in the mouse while
      they are severely impaired in patients homozygous for the same allele,
      which the authors attribute to species difference or genetic background.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The same missense allele produces structural but not behavioural
        disease in mouse, so the model supports the growth phenotype while
        saying little about the human cognitive outcome.
    evidence:
    - reference: PMID:37642681
      reference_title: "Generation and characterization of a knock-in mouse model for spastic tetraplegia, thin corpus callosum, and progressive microcephaly (SPATCCM)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: these results indicate that the impact of the p.E256K mutation on cognition and motor function is minimal in mice, but other aspects of SLC1A4 function in the brain are conserved
      explanation: States exactly which facets the model does and does not reproduce.
  evidence:
  - reference: PMID:37642681
    reference_title: "Generation and characterization of a knock-in mouse model for spastic tetraplegia, thin corpus callosum, and progressive microcephaly (SPATCCM)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We generated and characterized a knock-in mouse model for the most common mutant allele, which results in a single amino acid change (p.Glu256Lys, or E256K).
    explanation: Establishes the model as allele-matched to the common human variant.
- name: Brain endothelial Slc1a4 conditional knockout mouse
  species: Mouse
  genotype: Slc1a4 conditional knockout in brain endothelial cells (Slc1a4 tie2-cre)
  publication: PMID:38662784
  genes:
  - preferred_term: Slc1a4
    term:
      id: MGI:2135601
      label: Slc1a4
  description: >-
    Endothelium-restricted deletion isolates the blood-brain barrier
    contribution of the transporter, and shows that loss of barrier serine
    influx alone lowers brain serine and brain growth.
  modeled_mechanisms:
  - target: Reduced L-Serine Influx Across the Blood-Brain Barrier
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Cell-type-restricted deletion establishes the barrier transport step as the locus of the defect rather than an incidental site of expression.
    limitations: >-
      Tie2-cre also targets haematopoietic lineages, and the model cannot
      separate prenatal from postnatal loss of barrier transport.
    evidence:
    - reference: PMID:38662784
      reference_title: A new type of blood-brain barrier aminoacidopathy underlies metabolic microcephaly associated with SLC1A4 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: a selective knockout of Slc1a4 in brain endothelial cells
      explanation: Identifies the endothelium-restricted model used to localise the transport defect.
  evidence:
  - reference: PMID:38662784
    reference_title: A new type of blood-brain barrier aminoacidopathy underlies metabolic microcephaly associated with SLC1A4 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we examined the phenotype and metabolic profile of three Slc1a4 mouse models
    explanation: Establishes the three-model comparison from which the barrier conclusion is drawn.
diagnosis:
- name: Molecular genetic testing of SLC1A4
  description: >-
    Diagnosis rests on finding biallelic pathogenic SLC1A4 variants. Routine
    metabolic investigation is typically normal, so the disorder is reached by
    exome or genome sequencing rather than by biochemical screening, and
    targeted epilepsy gene panels have missed it.
  evidence:
  - reference: PMID:34174466
    reference_title: Severe neurodevelopmental disorder with intractable seizures due to a novel SLC1A4 homozygous variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: whose condition remained undiagnosed despite access to clinical experience and standard diagnostic methods including examination with an epilepsy targeted NGS gene panel
    explanation: Shows that a targeted panel failed and sequencing was required.
  - reference: PMID:35605507
    reference_title: A rare cause of microcephaly, thin corpus callosum and refractory epilepsy due to a novel SLC1A4 gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there are no abnormalities in basal metabolic investigations
    explanation: States that basic metabolic testing does not flag the disorder.
- name: Brain MRI
  description: >-
    MRI shows a thin corpus callosum, often with delayed myelination, cerebral
    atrophy and ventricular enlargement, and is the finding that most often
    prompts testing.
  evidence:
  - reference: PMID:35605507
    reference_title: A rare cause of microcephaly, thin corpus callosum and refractory epilepsy due to a novel SLC1A4 gene mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the thin corpus callosum and myelination delay is seen on the MRI
    explanation: Names the characteristic MRI findings.
- name: Carrier screening for the Ashkenazi Jewish founder allele
  description: >-
    Because p.Glu256Lys carriage is around 0.7% in the Ashkenazi Jewish
    population, the founding report proposed adding SLC1A4 to that community's
    carrier screening panel.
  evidence:
  - reference: PMID:26041762
    reference_title: Mutations in SLC1A4, encoding the brain serine transporter, are associated with developmental delay, microcephaly and hypomyelination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: should be added to the carrier screening panel in this community
    explanation: States the carrier-screening recommendation.
progression:
- phase: Neonatal to infantile onset of global developmental delay
  age_range: Neonatal period to infancy
  notes: >-
    Onset is neonatal to infantile, with global developmental delay recognised
    in the first months of life.
  evidence:
  - reference: ORPHA:447997
    supports: SUPPORT
    evidence_source: OTHER
    snippet: neonatal to infantile onset of global developmental delay
    explanation: Orphanet describes the onset window for this disorder.
- phase: Progressive postnatal microcephaly and spastic tetraplegia
  age_range: Infancy through childhood
  notes: >-
    Microcephaly worsens after birth and spastic tetraplegia, mainly affecting
    the lower extremities, develops slowly during infancy and childhood.
  evidence:
  - reference: ORPHA:447997
    supports: SUPPORT
    evidence_source: OTHER
    snippet: slowly progressive spastic tetraplegia mainly affecting the lower extremities
    explanation: Orphanet records the progressive motor course.
differential_diagnoses:
- name: PHGDH deficiency
  disease_term:
    preferred_term: PHGDH deficiency
    term:
      id: MONDO:0011152
      label: PHGDH deficiency
  description: >-
    The serine-biosynthesis defect that ASCT1 deficiency most closely mimics:
    congenital microcephaly, seizures and psychomotor retardation with a low
    serine pool.
  distinguishing_features:
  - Low L-serine in plasma and cerebrospinal fluid, whereas systemic amino acids are typically normal in ASCT1 deficiency.
  - Biallelic PHGDH variants rather than biallelic SLC1A4 variants.
  evidence:
  - reference: PMID:27161889
    reference_title: Serine biosynthesis and transport defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Serine biosynthesis defects result from impairments of PGDH, PSAT, or PSP leading to systemic serine deficiency.
    explanation: Contrasts the systemic deficiency of the biosynthesis defects with a transport defect.
- name: PSAT deficiency
  disease_term:
    preferred_term: PSAT deficiency
    term:
      id: MONDO:0012596
      label: PSAT deficiency
  description: Second enzyme of the phosphorylated serine pathway; produces an overlapping infantile neurological picture with low serine.
  distinguishing_features:
  - Biallelic PSAT1 variants, with systemic serine deficiency on amino acid analysis.
  evidence:
  - reference: PMID:27161889
    reference_title: Serine biosynthesis and transport defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: l-serine is a non-essential amino acid that is biosynthesized via the enzymes phosphoglycerate dehydrogenase (PGDH), phosphoserine aminotransferase (PSAT), and phosphoserine phosphatase (PSP)
    explanation: Names the three biosynthetic enzymes whose defects are the differential group.
- name: PSPH deficiency
  disease_term:
    preferred_term: PSPH deficiency
    term:
      id: MONDO:0013531
      label: PSPH deficiency
  description: Third enzyme of the pathway; rarer, with the same overlapping neurological phenotype.
  distinguishing_features:
  - Biallelic PSPH variants, with systemic serine deficiency on amino acid analysis.
  evidence:
  - reference: PMID:27161889
    reference_title: Serine biosynthesis and transport defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A serine transport defect resulting from deficiency of the ASCT1, the main transporter for serine in the central nervous system, has been recently described in children with neurological manifestations that overlap with those observed in serine biosynthesis defects
    explanation: States explicitly that the transport defect overlaps clinically with the biosynthesis defects.
treatments:
- name: L-Serine supplementation (investigational)
  description: >-
    L-serine supplementation is the obvious candidate therapy and rescues
    biochemical, growth and behavioural endpoints in Slc1a4 mouse models when
    given prenatally or in the first postnatal weeks. In patients it remains
    unproven: no cohort has reported an outcome, and the main neurological
    injury may already be established before birth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: amino acid supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: Brain L-Serine Deficiency
    description: Oral L-serine at doses that replenish the brain serine pool corrects the proximate metabolic defect in mouse models.
    evidence:
    - reference: PMID:38662784
      reference_title: A new type of blood-brain barrier aminoacidopathy underlies metabolic microcephaly associated with SLC1A4 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Prenatal and early postnatal oral administration of L-serine at levels that replenish the serine pool in the brain rescued the observed biochemical and behavioural changes.
      explanation: Shows the supplement acts on this node, in mice.
  - target: Impaired Neuronal Differentiation and Cortical Growth
    description: In the allele-matched knock-in, early L-serine normalised brain weight, linking the therapy to the growth phenotype.
    evidence:
    - reference: PMID:38662784
      reference_title: A new type of blood-brain barrier aminoacidopathy underlies metabolic microcephaly associated with SLC1A4 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Administration of L-serine until the second postnatal week also normalized brain weight in Slc1a4-E256K mice.
      explanation: Reports the growth endpoint rescued by early treatment.
  evidence:
  - reference: PMID:27161889
    reference_title: Serine biosynthesis and transport defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: l-serine therapy may be beneficial in preventing or ameliorating symptoms in serine biosynthesis and transport defects, if started before neurological damage occurs
    explanation: States the conditional expectation for serine therapy, including transport defects.
  - reference: PMID:41934118
    reference_title: "Expanding the Phenotypic Spectrum of SLC1A4-Related Spastic Tetraplegia: A Case With Novel Multisystem Features."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: however, its efficacy in SLC1A4 deficiency has not been established
    explanation: Records that no human efficacy has been demonstrated, against treating this as established therapy.
  notes: >-
    Recorded as investigational. No patient series reporting an outcome of
    L-serine treatment in ASCT1 deficiency was found; the supporting evidence is
    from mouse models and from the related biosynthesis defects.
- name: Antiseizure medication
  description: >-
    Seizures are treated symptomatically. Response is variable and several
    patients have refractory epilepsy; one reported patient responded
    reasonably to oxcarbazepine with added valproate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:31763347
    reference_title: A Novel SLC1A4 Mutation (p.Y191*) Causes Spastic Tetraplegia, Thin Corpus Callosum, and Progressive Microcephaly (SPATCCM) With Seizure Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He was treated with oxcarbazepine initially, then sodium valporate was added and he showed reasonable response.
    explanation: Documents the antiseizure regimen and response in one patient.
  - reference: PMID:34174466
    reference_title: Severe neurodevelopmental disorder with intractable seizures due to a novel SLC1A4 homozygous variant.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Czech patient with microcephaly, severe global developmental delay and intractable seizures
    explanation: Shows seizures can be intractable despite treatment, limiting the claim of symptomatic control.
discussions:
- discussion_id: serine_supplementation_window
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does L-serine supplementation change outcome in children with ASCT1
    deficiency, and is there a developmental window after which it cannot?
  attaches_to:
  - treatments#L-Serine supplementation (investigational)
  - pathophysiology#Brain L-Serine Deficiency
  rationale: >-
    Mouse rescue required prenatal or early postnatal dosing, and the human
    microcephaly is already present or incipient at birth in part of the cohort,
    so a treatment that works in mice may arrive too late in patients. No
    published patient series reports an outcome of supplementation, which leaves
    the clinically decisive question unanswered.
  evidence:
  - reference: PMID:41934118
    reference_title: "Expanding the Phenotypic Spectrum of SLC1A4-Related Spastic Tetraplegia: A Case With Novel Multisystem Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the benefit of serine supplementation in serine transport defects remains uncertain, as the major neurological abnormalities are thought to arise during early intrauterine development
    explanation: States the window problem that makes this a gap rather than a trial design detail.
  posed_by: "dismech curation (issue #17040)"
- discussion_id: l_versus_d_serine_axis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the human phenotype driven by the L-serine supply deficit, by the
    D-serine and NMDA co-agonist deficit, or by both?
  attaches_to:
  - pathophysiology#Brain D-Serine Deficiency and NMDA Receptor Co-agonist Loss
  - pathophysiology#Brain L-Serine Deficiency
  rationale: >-
    The knock-in mouse carrying the common human allele has the structural
    phenotype without a cognitive or long-term-potentiation deficit, while the
    constitutive knockout has the D-serine and behavioural phenotype. Patients
    homozygous for that same allele are severely cognitively impaired, so mouse
    data cannot currently apportion the human disease between the two axes, and
    which axis a therapy should target follows from the answer.
  evidence:
  - reference: PMID:37642681
    reference_title: "Generation and characterization of a knock-in mouse model for spastic tetraplegia, thin corpus callosum, and progressive microcephaly (SPATCCM)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: our results suggest that either there may be species differences in the role or importance of SLC1A4 in the CNS, or that expressivity of these phenotypes is influenced by genetic background
    explanation: The authors state the translational mismatch this gap records.
  posed_by: "dismech curation (issue #17040)"

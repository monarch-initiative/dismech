name: ASCT1 Deficiency
creation_date: "2026-11-11T21:58:31Z"
category: Mendelian
synonyms:
- spastic tetraplegia-thin corpus callosum-progressive postnatal microcephaly syndrome
- spastic quadriplegia-thin corpus callosum-progressive postnatal microcephaly syndrome
- SPATCCM
- SLC1A4 deficiency
description: >-
  ASCT1 deficiency is an autosomal recessive neurodevelopmental disorder caused
  by biallelic pathogenic variants in SLC1A4, which encodes the sodium-dependent
  neutral amino acid exchanger ASCT1. ASCT1 carries L-serine across the
  blood-brain barrier and between astrocytes and neurons, and takes up D-serine
  into astrocytes, so loss of transport lowers brain serine without producing a
  consistent systemic amino acid abnormality. Affected children have global
  developmental delay, progressive postnatal microcephaly, spastic tetraplegia
  with hyperreflexia and a thin corpus callosum, often with seizures, delayed
  myelination and cerebral atrophy. The recurrent p.Glu256Lys allele is a
  founder variant in the Ashkenazi Jewish population, but affected individuals
  of Irish, Italian, Czech, Palestinian and Pakistani ancestry are reported.
  Mouse work shows microcephaly is driven by reduced serine influx into the
  brain and is rescued by early L-serine; whether supplementation helps human
  patients is unresolved.
classifications:
  icimd_category:
  - classification_value: gly_and_ser
    notes: >-
      ASCT1 deficiency is a defect of L-serine transport rather than of serine
      biosynthesis, and is grouped with the serine-deficiency disorders on that
      basis.
    evidence:
    - reference: PMID:27161889
      reference_title: Serine biosynthesis and transport defects.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: A serine transport defect resulting from deficiency of the ASCT1, the main transporter for serine in the central nervous system
      explanation: Places ASCT1 deficiency with the serine biosynthesis and transport defects.

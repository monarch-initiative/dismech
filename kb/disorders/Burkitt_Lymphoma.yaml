phenotypes:
- category: Neoplastic
  name: B-Cell Lymphoma
  description: >-
    Burkitt lymphoma is an aggressive neoplasm of mature B lymphocytes and is
    classified as a B-cell non-Hodgkin lymphoma.
  phenotype_term:
    preferred_term: B-cell lymphoma
    term:
      id: HP:0012191
      label: B-cell lymphoma
  evidence:

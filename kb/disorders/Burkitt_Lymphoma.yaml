      snippet: Burkitt lymphoma remains an area of clinical and biological research with specificities due to the high incidence of CNS involvement and tumour lysis syndrome in patients with a high tumour burden.
      explanation: The clinical guideline review directly links high tumor burden in Burkitt lymphoma to tumor lysis syndrome.

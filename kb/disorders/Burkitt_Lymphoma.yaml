    snippet: "In about 80% of Burkitt's lymphoma cases, the tumour cell harbours a reciprocal chromosomal translocation which invariably transposes the coding exons 2 and 3 of c-myc from chromosome 8 to the immunoglobulin heavy chain locus on chromosome 14."
    explanation: This cell-line study documents the defining MYC-IGH translocation in most Burkitt lymphoma cases.
- name: TP53
  association: Somatic Mutation
  relationship_type: COOPERATING
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: >-
    TP53 is among the recurrent cooperating somatic alterations in Burkitt
    lymphoma; loss of p53 pathway function can facilitate survival under

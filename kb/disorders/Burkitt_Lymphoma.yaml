      reference_title: "Translocation Tales: Unraveling the MYC Deregulation in Burkitt Lymphoma for Innovative Therapeutic Strategies"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The t(8;14)(q24;q32) chromosomal translocation commonly observed in hematological malignancies results in MYC deregulation, endowing cancer cells with a competitive edge through heightened cell proliferation, cell cycle progression, apoptosis evasion, and metabolic reprogramming.
      explanation: The review directly links MYC deregulation caused by t(8;14) to increased proliferation and cell-cycle progression.

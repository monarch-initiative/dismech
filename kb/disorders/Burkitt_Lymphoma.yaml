      explanation: The review includes apoptosis evasion among the consequences of translocation-driven MYC deregulation.
- name: Uncontrolled B-Cell Proliferation
  description: >-
    Constitutive MYC activity drives cell-cycle progression. Cooperating ID3
    loss-of-function or TCF3 activating mutations reinforce tonic B-cell-receptor
    and PI3K signaling and promote cyclin-D3-dependent G1-S progression.
  evidence:
  - reference: PMID:24492847
    reference_title: Oncogenic mechanisms in Burkitt lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Tonic B-cell-receptor signaling sustains Burkitt lymphoma survival by engaging the PI3 kinase pathway. In addition, TCF-3 promotes cell-cycle progression by transactivating CCND3, encoding a D-type cyclin that regulates the G1-S phase transition.
    explanation: This mechanistic review connects constitutive TCF3 activity to tonic BCR/PI3K survival signaling and cyclin-D3-mediated cell-cycle progression.

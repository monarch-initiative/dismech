datasets:
- accession: ega:EGAS00001001067
  title: Integrated genomic, transcriptional and epigenomic analyses in germinal center-cell lymphomas link the mutation landscape with differential DNA methylation in Burkitt lymphoma
  description: Biologically and clinically diverse B-cell neoplasms, including Burkitt, follicular and diffuse large B-cell lymphoma, show features of germinal center (GC) B-cells. Here we present a comprehensive analysis of the epigenetic landscape of GC-B-cell lymphomas using whole genome bisulfite sequencing paired with genome and transcriptome sequencing from 29 primary tumor samples and four normal GC-B-cell samples. All lymphomas studied showed extensive genome-wide methylation losses as well as intragenic regions where DNA methylation levels were strongly correlated with expression of associated genes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Burkitt Lymphoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001199
  title: MINCR is a MYC-induced lncRNA able to modulate MYC’s transcriptional network in Burkitt lymphoma cells
  description: Despite the established role of the transcription factor MYC in cancer, little is known about the involvement of lncRNAs in mediating MYC’s function. Here we have intersected RNA-sequencing data from MYC-inducible cell lines, from a cohort of 91 mature B-cell lymphomas and from sorted germinal-center B-cells. By this approach, we identified 13 lncRNAs differentially expressed in IG-MYC-positive Burkitt lymphoma and regulated by MYC in the model cell lines. Among them we focused on a lncRNA that we named MINCR, showing a strong correlation with MYC expression in MYC-positive lymphomas and in pancreatic ductal adenocarcinomas.

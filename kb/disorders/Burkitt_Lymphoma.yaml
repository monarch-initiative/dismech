- accession: massive:MSV000080781
  title: HSP90 promotes Burkitt lymphoma cell survival by maintaining tonic B cell receptor signaling
  description: 'Burkitt’s lymphoma (BL) is an aggressive B-cell neoplasm that is currently treated by intensive chemotherapy in combination with anti-CD20 antibodies. Because of their toxicity, current treatment regimens are often not suitable for elderly patients or for patients in developing countries where BL is endemic. Hence, there is a need for targeted therapies. In this study, we performed a compound screen in 17 BL cell lines to identify small molecule inhibitors affecting cell survival.'
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Burkitt Lymphoma"). Retrieved 2026-08-02.
- accession: dbgap:phs001282
  title: Genomics of Endemic Burkitt Lymphoma
  description:  This genomic landscape of Burkitt lymphoma represents a multimodal sequencing of tumors and control tissues and individuals to better understand the etiology, and molecular pathogenesis of Burkitt lymphoma including the roles of the associated Plasmodium falciparum malaria and EBV infections. Comprehensive sequencing set includes genomic, transcriptomic, and epigenomic datasets in concert with variable clinical phenotypes and outcome information such as anatomical presentation site, in-hospital survival rates, and EBV genome type.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Burkitt Lymphoma"). Retrieved 2026-08-02.
- accession: dbgap:phs000562
  title: The Genetic Landscape of Mutations in Burkitt Lymphoma
  description:  Burkitt lymphoma (BL) is characterized by deregulation of  MYC , but the contribution of other genetic mutations to the disease is largely unknown. We sequenced exomes of 59 BL tumors, 14 of which had paired normal tissue. Our work elucidates commonly occurring gene-coding mutations in Burkitt lymphoma and implicates  ID3  as a novel tumor suppressor gene.

genetic:
- name: MYC
  association: Somatic Translocation
  relationship_type: SOMATIC_DRIVER
  gene_term:
    preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  notes: >-
    MYC translocation to immunoglobulin loci is the defining genetic abnormality.
    t(8;14)(q24;q32) involving IGH occurs in ~80% of cases. t(2;8) involving
    IGK and t(8;22) involving IGL occur in the remainder. MYC overexpression
    drives the malignant phenotype.
  evidence:
  - reference: PMID:1301171
    reference_title: "Variable breakpoints in Burkitt lymphoma cells with chromosomal t(8;14) translocation separate c-myc and the IgH locus up to several hundred kb."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In about 80% of Burkitt's lymphoma cases, the tumour cell harbours a reciprocal chromosomal translocation which invariably transposes the coding exons 2 and 3 of c-myc from chromosome 8 to the immunoglobulin heavy chain locus on chromosome 14."
    explanation: This cell-line study documents the defining MYC-IGH translocation in most Burkitt lymphoma cases.
- name: TP53
  association: Somatic Mutation
  relationship_type: COOPERATING
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: >-
    TP53 is among the recurrent cooperating somatic alterations in Burkitt
    lymphoma; loss of p53 pathway function can facilitate survival under
    oncogenic stress.
  evidence:
  - reference: DOI:10.3390/lymphatics1020010
    reference_title: "Translocation Tales: Unraveling the MYC Deregulation in Burkitt Lymphoma for Innovative Therapeutic Strategies"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: However, the intricate genetic landscape of BL, featuring additional alterations, such as mutations in TP53, TCF3, and ID3, may necessitate a combinatorial approach targeting multiple oncogenic pathways for effective intervention.
    explanation: This review identifies TP53 mutations among the additional genetic alterations in Burkitt lymphoma.
- name: ID3
  association: Somatic Mutation
  relationship_type: COOPERATING
  gene_term:
    preferred_term: ID3
    term:
      id: hgnc:5362
      label: ID3
  notes: >-
    Inactivating ID3 mutations release TCF3 from negative regulation, promoting
    tonic B-cell-receptor and PI3K survival signaling.
  evidence:
  - reference: PMID:24492847
    reference_title: Oncogenic mechanisms in Burkitt lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TCF-3 is rendered constitutively active in Burkitt lymphoma by two related mechanisms: (1) somatic mutations that inactivate its negative regulator ID3, and (2) somatic mutations in TCF-3 that block the ability of ID3 to bind and interfere with its activity as a transcription factor."
    explanation: This mechanistic review directly describes ID3-inactivating mutations as one route to constitutive TCF3 activity.
- name: TCF3
  association: Somatic Mutation
  relationship_type: COOPERATING
  gene_term:
    preferred_term: TCF3
    term:
      id: hgnc:11633
      label: TCF3
  notes: >-
    TCF3 mutations can prevent ID3-mediated inhibition, sustaining tonic
    B-cell-receptor signaling and cyclin-D3-mediated cell-cycle progression.
  evidence:
  - reference: PMID:24492847
    reference_title: Oncogenic mechanisms in Burkitt lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TCF-3 is rendered constitutively active in Burkitt lymphoma by two related mechanisms: (1) somatic mutations that inactivate its negative regulator ID3, and (2) somatic mutations in TCF-3 that block the ability of ID3 to bind and interfere with its activity as a transcription factor."
    explanation: This mechanistic review directly describes TCF3 mutations that prevent its negative regulation by ID3.
diagnosis:
- name: Morphology and MYC-centered diagnostic confirmation
  description: >-
    Burkitt lymphoma diagnosis integrates tumor morphology, MYC expression or
    rearrangement, and B-cell immunophenotyping; extranodal cases still require
    tissue confirmation with lymphoma markers.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: MAXO:0000487
      label: clinical assessment
  results: High-grade B-cell lymphoma morphology with high MYC expression and/or MYC translocation.
  evidence:
  - reference: PMID:36522349
    reference_title: "Burkitt lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BL is diagnosed on the basis of morphology and high expression of MYC."
    explanation: The disease primer summarizes morphology and MYC expression as core diagnostic criteria.
  - reference: PMID:40893393
    reference_title: "Navigating Rare Presentations: Recurrent Burkitt Lymphoma Presenting as a Jejunal Mass."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Push enteroscopy with biopsy confirmed the recurrence of BL in the jejunum, with positive markers for CD45, CD20, BCL6, and c-Myc."
    explanation: This case illustrates tissue confirmation with B-cell and MYC immunophenotypic markers.
treatments:
- name: Intensive Chemotherapy
  description: >-
    Intensive, short-duration chemotherapy regimens achieve high cure rates
    (>90% in children, 60-80% in adults). Regimens include CODOX-M/IVAC,
    hyper-CVAD, and DA-EPOCH-R. CNS prophylaxis is essential given high
    risk of CNS involvement.
  evidence:
  - reference: PMID:36522349
    reference_title: "Burkitt lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BL can be effectively treated in children and adolescents with short durations of high dose-intensity multiagent chemotherapy regimens."
    explanation: Nature Reviews Disease Primers directly supports intensive, short-duration, high-dose chemotherapy as the standard-of-care for pediatric BL.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: MAXO:0000647
      label: chemotherapy
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody added to chemotherapy improves outcomes,
    particularly in adults. Standard component of modern treatment regimens.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  evidence:
  - reference: PMID:32492302
    reference_title: Rituximab for High-Risk, Mature B-Cell Non-Hodgkin's Lymphoma in Children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Rituximab added to standard LMB chemotherapy markedly prolonged event-free survival and overall survival among children and adolescents with high-grade, high-risk, mature B-cell non-Hodgkin's lymphoma
    explanation: In this randomized phase 3 trial, 85.7% of participants had Burkitt lymphoma and adding rituximab substantially improved survival outcomes.
- name: Tumor Lysis Syndrome Prophylaxis
  description: >-
    Aggressive hydration, allopurinol or rasburicase, and electrolyte monitoring

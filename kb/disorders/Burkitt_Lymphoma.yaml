- name: Apoptosis Resistance
  description: >-
    While MYC normally sensitizes cells to apoptosis, Burkitt lymphoma cells
    acquire mutations or alterations that counteract MYC-induced apoptosis.
    Cooperating TP53 alterations and EBV-associated survival signals can
    counteract cell death in subsets of Burkitt lymphoma.
  evidence:
  - reference: DOI:10.3390/lymphatics1020010
    reference_title: "Translocation Tales: Unraveling the MYC Deregulation in Burkitt Lymphoma for Innovative Therapeutic Strategies"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: However, the intricate genetic landscape of BL, featuring additional alterations, such as mutations in TP53, TCF3, and ID3, may necessitate a combinatorial approach targeting multiple oncogenic pathways for effective intervention.
    explanation: The review identifies TP53 mutations as recurrent cooperating alterations in the Burkitt lymphoma genetic landscape.

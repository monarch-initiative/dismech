      snippet: "170 (37.2%) had lactate dehydrogenase (LDH) levels ≥ 1000 U/L at initial diagnosis, and 137 (30%) had tumor lysis syndrome."
      explanation: The pediatric cohort quantifies marked LDH elevation at diagnosis.
  - target: Tumor Lysis Syndrome
    description: High tumor burden and rapid cell turnover create a substantial risk of spontaneous or treatment-associated tumor lysis.
    evidence:

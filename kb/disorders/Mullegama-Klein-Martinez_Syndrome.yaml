pathophysiology:
- name: STAG2 Loss-of-Function Variation
  description: >-
    The initiating lesion is a germline (or somatic-mosaic) loss-of-function
    STAG2 variant. STAG2 encodes an integral, dosage-sensitive subunit of the
    cohesin complex; heterozygous de novo truncating variants reduce STAG2
    protein and produce a cohesinopathy, establishing STAG2 as haploinsufficient
    for neurodevelopment.
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  genes:
  - preferred_term: STAG2
    term:
      id: hgnc:11355
      label: STAG2
  evidence:
  - reference: PMID:28296084
    reference_title: "De novo loss-of-function variants in STAG2 are associated with developmental delay, microcephaly, and congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe a heterozygous de novo variant (c.205C>T; p.(Arg69*)) in the
      integral cohesin structural protein, STAG2. This variant is associated
      with decreased STAG2 protein expression.
    explanation: >-
      Identifies a de novo truncating STAG2 variant with reduced protein as the
      causal lesion.
  - reference: PMID:28296084
    reference_title: "De novo loss-of-function variants in STAG2 are associated with developmental delay, microcephaly, and congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we suggest that STAG2 is a dosage-sensitive gene and that
      heterozygous loss-of-function variants lead to a cohesinopathy.
    explanation: >-
      Establishes STAG2 dosage sensitivity and loss-of-function as the disease
      mechanism.
  downstream:
  - target: Cohesin Complex Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29263825
      reference_title: "Familial STAG2 germline mutation defines a new human cohesinopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the STAG2 p.Ser327Asn mutant is defective in binding to SCC1 and other
        cohesin subunits and regulators. Thus, decreased amount of intact
        cohesin likely underlies the phenotypes of STAG2-SXLID.
      explanation: >-
        Pathogenic STAG2 variants reduce the amount of assembled, intact cohesin.
- name: Cohesin Complex Deficiency
  description: >-
    Reduced STAG2 lowers the amount of intact, functional cohesin. The cohesin
    complex is a conserved multi-subunit ring that mediates sister chromatid
    cohesion and organizes chromatin; STAG2 is one of two mutually exclusive
    HEAT-repeat subunits (STAG1/STAG2) that direct cohesin to genomic loci.
  mechanism_confidence: ESTABLISHED
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: sister chromatid cohesion
    term:
      id: GO:0007062
      label: sister chromatid cohesion
    modifier: DECREASED
  evidence:
  - reference: PMID:28296084
    reference_title: "De novo loss-of-function variants in STAG2 are associated with developmental delay, microcephaly, and congenital anomalies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The cohesin complex is an evolutionarily conserved multi-subunit protein
      complex which regulates sister chromatid cohesion during mitosis and
      meiosis. Additionally, the cohesin complex regulates DNA replication, DNA
      repair, and transcription.
    explanation: >-
      Defines the functions of cohesin that STAG2 deficiency perturbs.
  downstream:
  - target: Transcriptional and Chromatin-Organization Dysregulation
    causal_link_type: DIRECT

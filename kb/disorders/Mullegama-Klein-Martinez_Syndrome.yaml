genetic:
- name: STAG2
  gene_term:
    preferred_term: STAG2
    term:
      id: hgnc:11355
      label: STAG2
  relationship_type: CAUSATIVE
  notes: >-
    STAG2 (Xq25) encodes stromal antigen 2, a HEAT-repeat subunit of the cohesin
    complex. De novo loss-of-function variants (nonsense, frameshift, splice,
    and copy-number deletions), hemizygous variants, and somatic mosaicism cause
    MKMS; a hypomorphic missense allele (p.Ser327Asn) causes a milder X-linked
    recessive syndromic intellectual disability at the mild end of the spectrum.
  evidence:
  - reference: PMID:30158690
    reference_title: "Clinical exome sequencing reveals locus heterogeneity and phenotypic variability of cohesinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Candidate or recently reported cohesinopathy genes were supported by de
      novo SNVs/indels in STAG1 (N = 3), STAG2 (N = 5), PDS5A (N = 1), and WAPL
      (N = 1)
    explanation: >-
      Independent clinical-exome cohort supports de novo STAG2 variants as a
      cause of cohesinopathy.
  - reference: PMID:34580287
    reference_title: "Expanding the known phenotype of Mullegama-Klein-Martinez syndrome in male patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He shares distinct clinical features with a previously reported male
      patient carrying the STAG2 variant p.Tyr159Cys, suggesting that this
      phenotype is determined by the position of the mutation.
    explanation: >-
      Documents that surviving affected males carry missense variants and that
      phenotype correlates with variant position.


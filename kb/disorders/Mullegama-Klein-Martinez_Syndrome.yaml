diagnosis:
- name: Trio Whole-Exome Sequencing
  description: >-
    Molecular confirmation of a pathogenic STAG2 variant is the diagnostic gold
    standard; rapid trio whole-exome sequencing identifies the causal de novo
    variant, and chromosomal microarray is typically normal in point-variant
    cases. Multi-tissue deep sequencing is used when mosaicism is suspected.
  evidence:
  - reference: PMID:41300816
    reference_title: "A Novel STAG2 Frameshift Variant in Mullegama-Klein-Martinez Syndrome with Complex Conotruncal Heart Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

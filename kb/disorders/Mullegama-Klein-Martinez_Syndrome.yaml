genetic:
- name: STAG2
  gene_term:
    preferred_term: STAG2
    term:
      id: hgnc:11355
      label: STAG2
  relationship_type: CAUSATIVE
  notes: >-
    STAG2 (Xq25) encodes stromal antigen 2, a HEAT-repeat subunit of the cohesin
    complex. De novo loss-of-function variants (nonsense, frameshift, splice,
    and copy-number deletions), hemizygous variants, and somatic mosaicism cause
    MKMS; a hypomorphic missense allele (p.Ser327Asn) causes a milder X-linked
    recessive syndromic intellectual disability at the mild end of the spectrum.
    Scope note: this entry models the loss-of-function/haploinsufficiency arm.
    A phenotypically overlapping but molecularly distinct gain-of-dosage entity
    from Xq25 microduplication spanning STAG2 (Leroy et al. 2016, PMID:25677961)
    is not modeled here, and somatically acquired STAG2 mutation in cancer is a
    separate, clinically distinct phenomenon.
  evidence:
  - reference: PMID:30158690
    reference_title: "Clinical exome sequencing reveals locus heterogeneity and phenotypic variability of cohesinopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Candidate or recently reported cohesinopathy genes were supported by de
      novo SNVs/indels in STAG1 (N = 3), STAG2 (N = 5), PDS5A (N = 1), and WAPL
      (N = 1)
    explanation: >-
      Independent clinical-exome cohort supports de novo STAG2 variants as a
      cause of cohesinopathy.
  - reference: PMID:34580287
    reference_title: "Expanding the known phenotype of Mullegama-Klein-Martinez syndrome in male patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He shares distinct clinical features with a previously reported male
      patient carrying the STAG2 variant p.Tyr159Cys, suggesting that this
      phenotype is determined by the position of the mutation.
    explanation: >-
      Documents that surviving affected males carry missense variants and that
      phenotype correlates with variant position.
  - reference: PMID:28296084
    reference_title: "De novo loss-of-function variants in STAG2 are associated with developmental delay, microcephaly, and congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a female that carries a pathogenic STAG2 variant but has favorably skewed
      XCi may have mild or no symptoms
    explanation: >-
      X-chromosome-inactivation skewing modulates phenotype severity in
      heterozygous females.
- name: STAG2 somatic mosaicism
  gene_term:
    preferred_term: STAG2
    term:
      id: hgnc:11355
      label: STAG2
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  notes: >-
    Postzygotic somatic mosaicism for a STAG2 variant is a distinct disease
    mechanism, producing tissue-variable variant allele fractions and
    asymmetric phenotype expression. Multi-tissue deep sequencing is required to
    characterize the degree of mosaicism.
  evidence:
  - reference: PMID:36467423
    reference_title: "Somatic mosaicism in STAG2-associated cohesinopathies: Expansion of the genotypic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we describe for the first time a mosaic STAG2 variant in an individual
      with developmental delay, microcephaly, and hemihypotrophy of the right
      side
    explanation: >-
      Documents somatic mosaicism as a genetic mechanism in STAG2 cohesinopathy.

treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    There is no disease-specific or curative therapy for MKMS. Management is
    symptomatic and multidisciplinary, following general practice for syndromic
    neurodevelopmental and congenital-malformation disorders: developmental,
    physical, occupational, and speech therapy; audiologic management of hearing
    loss; ophthalmologic care; and echocardiographic and neuroimaging
    surveillance with cardiac surgical repair as needed.
  treatment_term:

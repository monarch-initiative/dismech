  description: >-
    STAG2 maps to Xq25. MKMS most often arises from de novo loss-of-function
    STAG2 variants, reported predominantly in affected females; hemizygous and
    somatic-mosaic variants also occur. An allelic hypomorphic missense variant
    (p.Ser327Asn) segregates in a family as classic X-linked recessive syndromic
    intellectual disability.
  evidence:
  - reference: PMID:29263825
    reference_title: "Familial STAG2 germline mutation defines a new human cohesinopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five individuals carry a STAG2 p.Ser327Asn (c.980 G > A) variant that
      perfectly cosegregates with a phenotype of syndromic mental retardation in
      a characteristic X-linked recessive pattern.
    explanation: >-
      Documents cosegregation of a STAG2 germline variant with syndromic
      intellectual disability in an X-linked pattern.
  penetrance: UNKNOWN
  expressivity: VARIABLE

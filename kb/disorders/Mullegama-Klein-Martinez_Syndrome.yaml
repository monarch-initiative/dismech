name: Mullegama-Klein-Martinez Syndrome
creation_date: "2026-07-30T00:00:00Z"
synonyms:
- MKMS
- STAG2-related X-linked intellectual deficiency
- STAG2-related cohesinopathy
description: >-
  Mullegama-Klein-Martinez syndrome (MKMS) is a rare X-linked cohesinopathy
  caused by loss-of-function germline variants in STAG2, which encodes stromal
  antigen 2, a subunit of the evolutionarily conserved cohesin complex. Cohesin
  (core subunits SMC1A, SMC3, RAD21, and STAG1/STAG2) regulates sister chromatid
  cohesion during mitosis and meiosis and, critically for development, also
  governs DNA replication, DNA repair, three-dimensional genome organization,
  and transcription. STAG2 is dosage-sensitive: de novo heterozygous
  loss-of-function variants (frequently in females) and hemizygous or mosaic
  variants produce a multisystem neurodevelopmental disorder whose core features
  are global developmental delay, intellectual disability, microcephaly, growth
  restriction (undergrowth), ear anomalies (microtia) with hearing loss, and
  dysmorphic facial features, overlapping the broader cohesinopathy spectrum
  (notably Cornelia de Lange syndrome) but generally without CdLS-characteristic
  facies. An allelic milder phenotype segregating as classic X-linked recessive
  syndromic intellectual disability (the STAG2 p.Ser327Asn family described by
  Soardi et al.) sits at the mild end of the same spectrum. The developmental
  phenotype is attributed primarily to cohesin-dependent transcriptional and
  chromatin-organization dysregulation rather than to overt mitotic cohesion
  failure: patient cells typically show delayed—not prematurely separated—sister
  chromatids alongside altered cell-cycle and gene-expression profiles.
category: Mendelian

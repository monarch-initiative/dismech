      complex which regulates sister chromatid cohesion during mitosis and
      meiosis. Additionally, the cohesin complex regulates DNA replication, DNA
      repair, and transcription.
    explanation: >-
      Defines the functions of cohesin that STAG2 deficiency perturbs.
  downstream:

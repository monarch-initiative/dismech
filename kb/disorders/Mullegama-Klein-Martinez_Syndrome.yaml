mechanistic_hypotheses:
- hypothesis_group_id: sex_differential_viability
  hypothesis_label: Sex-Differential Viability and Male Embryonic Lethality
  status: EMERGING
  description: >-
    A proposed model for the disorder's X-linked genetics: because STAG2 is
    dosage-sensitive and undergoes X-inactivation, heterozygous females can
    survive severe (truncating) loss-of-function alleles—buffered, though often
    imperfectly, by the wild-type X and modulated by X-inactivation skewing—
    whereas hemizygous males with equivalent severe alleles are proposed to be
    largely non-viable, so surviving affected males instead carry milder
    missense alleles. This is inferential rather than directly proven in humans.
  evidence:
  - reference: PMID:28296084
    reference_title: "De novo loss-of-function variants in STAG2 are associated with developmental delay, microcephaly, and congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic loss-of-function STAG2 variants that affect canonical STAG, SCD
      and GR domains are lethal in males with a 46,XY karyotype
    explanation: >-
      States the proposed male-lethality basis of the sex-differential
      viability model.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    MKMS is ultra-rare; approximately 19-20 patients had been reported in the
    peer-reviewed literature as of 2025. No formal prevalence/incidence rate has
    been established, and no ORPHA code exists yet.
  evidence:
  - reference: PMID:41300816
    reference_title: "A Novel STAG2 Frameshift Variant in Mullegama-Klein-Martinez Syndrome with Complex Conotruncal Heart Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case expands the phenotypic spectrum of STAG2-related MKM and
      highlights the role of STAG2 in cardiac development.
    explanation: >-
      Single-case reports are the evidence tier for this ultra-rare disorder.


  proposed_experiments:
  - experiment_id: exp_vddr2b_stratum_resolution
    name: Prospective resolution of receptor-positive vitamin D-resistance strata
    description: >-
      Ascertain VDR-coding-negative patients prospectively and record alopecia,
      mineral biochemistry, endogenous VDR localization, calcitriol-responsive
      transcription, HNRNPC abundance, and VDRE occupancy under a common protocol,
      followed by genome and transcriptome sequencing.
    decision_criterion: >-
      Recurrent shared molecular and genetic findings across phenotypic strata
      would support lumping; reproducible stratum-specific mechanisms would
      support splitting the umbrella concept.
- discussion_id: knowledge_gap_vddr2b_hnrnpc_cause
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Index-Case Endogenous VDR Nuclear-Localization Failure
  - pathophysiology#Index-Case HNRNPC C1/C2 Competition at Vitamin D Response Elements
  prompt: >-
    What caused HNRNPC C1/C2 overexpression in the single index case, and how is
    VDRE competition related to the earlier endogenous VDR localization failure?
  rationale: >-
    Reciprocal overexpression and siRNA experiments support HNRNPC C1/C2 as a
    transcriptional actor, but no causal germline lesion or upstream regulatory
    event was identified. The earlier localization result and the later occupancy
    result were not placed in one experimentally tested causal sequence. Germline
    HNRNPC haploinsufficiency has since been associated with a distinct
    neurodevelopmental disorder, not with this rachitic phenotype, so it cannot be
    imported as evidence for VDDR2B inheritance.
  evidence:
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When overexpressed in vitamin D-responsive cells, cDNAs for both hnRNPC1 and
      hnRNPC2 inhibited VDR-VDRE-directed transactivation (28 and 43%,
      respectively; both p < 0.005).
    explanation: >-
      Supports the actor-level mechanism without establishing its upstream cause.
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      No gene has yet been identified as the cause of VDDR2b so it is impossible
      to state with precision the number of affected subjects.
    explanation: >-
      Explicitly documents the absent causal-gene assignment.
  - reference: PMID:37541189
    reference_title: HNRNPC haploinsufficiency affects alternative splicing of intellectual disability-associated genes and causes a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe 13 individuals with global developmental delay,
      intellectual disability, behavioral abnormalities, and subtle facial
      dysmorphology with heterozygous HNRNPC germline variants.
    explanation: >-
      Demonstrates that established germline HNRNPC disease has a distinct
      neurodevelopmental phenotype and does not validate HNRNPC inheritance for
      this rickets umbrella.
  proposed_experiments:
  - experiment_id: exp_vddr2b_genome_sequencing_hnrnpc_regulation
    name: Causal analysis of HNRNPC regulation in the index lineage
    description: >-
      Perform genome, transcriptome, copy-number, chromatin, and allele-specific
      expression analysis on archived index-lineage material; perturb candidate
      regulatory events and normalize HNRNPC expression to test rescue of VDRE
      occupancy, VDR localization, and calcitriol-responsive transcription.
notes: >-
  This entry intentionally has empty `genetic` and `inheritance` sections: no
  causal gene or mode of inheritance has been demonstrated. HNRNPC is a molecular
  actor only. MONDO:0010931 remains the ontology anchor, but its combined
  HNRNPC/no-alopecia/sporadic framing does not map cleanly onto the unlinked
  primary strata and is not propagated as fact. No prevalence or global
  phenotype frequencies are calculated. The historical index-case phrase
  "HVDRR type III" is not modern CYP3A4-related VDDR3. No disease-specific
  imaging finding or clinical-trial enrollment was verified; both sections are
  explicitly empty.

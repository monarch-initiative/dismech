treatments:
- name: Index-Case High-Dose Calcitriol Plus Calcium
  action_category: THERAPEUTIC
  description: >-
    In the single alopecic index child, a regimen of calcitriol at 12 micrograms
    per day plus calcium at 1 gram per day was reported to correct rachitic bone
    disease, while alopecia persisted. This is an observed n=1 combined regimen,
    not evidence that either component was sufficient alone and not a general
    dosing recommendation for the unresolved umbrella entity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
  target_phenotypes:
  - preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  target_mechanisms:
  - target: Defective Skeletal Mineralization
    treatment_effect: RESTORES
    description: >-
      The rachitic bone disease was reported corrected during the combined
      regimen. RESTORES describes that observed skeletal outcome and does not
      isolate the contribution of high-dose calcitriol from calcium or imply a
      treatment response in the Cauca stratum.
  notes: >-
    The exact regimen and outcomes are stated in the full text of PMID:12716975
    (PMCID:PMC156334). The sanctioned `just fetch-reference PMID:12716975` cache
    is abstract-only, so no purportedly verbatim evidence snippet is attached.
    Baseline hypocalcemia is recorded elsewhere, but no post-treatment calcium
    value is asserted here. Persistent alopecia is a nonresponse outcome, not a
    target of the successful skeletal regimen.
diagnosis:
- name: Clinical and biochemical assessment of receptor-positive vitamin D resistance
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Rickets or lower-limb deformity together with relatively low calcium, high
    alkaline phosphatase, normal 25-hydroxyvitamin D, and elevated calcitriol can
    support suspicion of target-organ vitamin D resistance. The documented
    pattern comes from the Cauca cohort and does not by itself establish that an
    individual has the index-case HNRNPC mechanism.
  results: >-
    A vitamin-D-resistant rachitic biochemical pattern supports further
    evaluation but is not specific for VDDR2B or either evidence stratum.
  evidence:
  - reference: PMID:7586652
    reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum analysis showed significantly lower serum calcium as compared to
      normal relatives, though in the normal low range, normal phosphorus, high
      alkaline phosphatase, normal 25-hydroxyvitamin D3 and high
      1,25-dihydroxyvitamin D3, indicating target organ resistance.
    explanation: >-
      Defines the directly observed cluster biochemical pattern.
- name: VDR coding-sequence analysis as an exclusionary test
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Demonstrating a normal VDR coding sequence helps distinguish these reports
    from VDR-related vitamin D-dependent rickets type 2A. A negative VDR result
    does not confirm VDDR2B, identify HNRNPC dysregulation, or prove that the two
    evidence strata share a disorder.
  results: >-
    A normal VDR coding sequence is exclusionary for a coding lesion in VDR; it is
    not a positive molecular test for VDDR2B.
  evidence:
  - reference: PMID:8287584
    reference_title: Tissue resistance to 1,25-dihydroxyvitamin D without a mutation of the vitamin D receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing revealed that the VDR coding region was normal. Expression
      studies of the patient's VDR showed functionally normal VDR as evidenced by
      normal transactivation in the presence of 1,25(OH)2D3.
    explanation: >-
      Directly supports normal VDR coding and transferred function in the index
      case.
  - reference: PMID:7586652
    reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cDNA analysis showed normal nucleotide sequence.
    explanation: >-
      Directly supports a normal VDR cDNA sequence in the Cauca cohort.
- name: HNRNPC-VDRE functional assays (research only)
  description: >-
    VDRE mobility-shift, chromatin-occupancy, transactivation, HNRNPC
    overexpression, and siRNA assays characterized the index-case mechanism.
    These are research assays with no validated clinical threshold or evidence
    of diagnostic sensitivity or specificity.
  results: >-
    Excess HNRNPC C1/C2 occupancy with impaired VDR transactivation can reproduce
    the index-case cellular phenotype but is not a validated confirmatory test.
  evidence:
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, transient expression of an hnRNP C1/C2 small interfering RNA
      increased VDR transactivation by 39% (p < 0.005).
    explanation: >-
      Documents one of the reciprocal functional perturbations; it supports
      mechanism research, not clinical validation.
differential_diagnoses:
- name: Vitamin D-Dependent Rickets Type 2A
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 2A
    term:
      id: MONDO:0010186
      label: vitamin D-dependent rickets, type 2A
  description: >-
    Type 2A can share rickets, elevated calcitriol, hypocalcemia, and alopecia,
    but it is caused by biallelic loss-of-function variants in VDR.
  distinguishing_features:
  - A pathogenic biallelic VDR genotype supports type 2A rather than this receptor-positive umbrella.
  - A normal VDR coding sequence only excludes a coding lesion; it does not confirm type 2B.
  evidence:
  - reference: PMID:32596195
    reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VDDR2a (OMIM 277440) is due to biallelic loss-of-function mutations in the
      gene encoding the vitamin D receptor (VDR; 601769) on chromosome 12q13.11,
      and therefore represents a bona fide form of tissue resistance to vitamin D.
    explanation: >-
      Establishes the causal VDR genotype that distinguishes type 2A.
- name: Vitamin D-Dependent Rickets Type 3
  disease_term:
    preferred_term: vitamin D-dependent rickets, type 3
    term:
      id: MONDO:0033640
      label: vitamin D-dependent rickets, type 3
  description: >-
    Modern VDDR3 is a distinct, dominantly acting CYP3A4 p.Ile301Thr
    gain-of-function disorder with accelerated inactivation and low
    25-hydroxyvitamin D and calcitriol. Conventional dosing can be inadequate,
    although the original subjects maintained normal mineral biochemistry with
    sufficiently high calcitriol or vitamin D dosing. It must not be inferred
    from the historical phrase "HVDRR type III" used for the receptor-positive
    index case before modern VDDR3 was defined.
  distinguishing_features:
  - Modern VDDR3 has a heterozygous CYP3A4 p.Ile301Thr gain-of-function variant; de novo occurrence in the original subjects is not asserted as universal.
  - Both major circulating vitamin D metabolites are reduced rather than the elevated calcitriol reported in the Cauca receptor-positive cluster.
  evidence:
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe two unrelated patients with early-onset rickets, reduced
      serum levels of the vitamin D metabolites 25-hydroxyvitamin D and
      1,25-dihydroxyvitamin D, and deficient responsiveness to parent and
      activated forms of vitamin D.
    explanation: >-
      Defines the modern type 3 clinical and biochemical pattern.
  - reference: PMID:29461981
    reference_title: CYP3A4 mutation causes vitamin D-dependent rickets type 3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      using whole exome sequencing analysis, we identified a recurrent de novo
      missense mutation, c.902T>C (p.I301T), in CYP3A4 in both subjects that
      alters the conformation of substrate recognition site 4 (SRS-4).
    explanation: >-
      Establishes the molecular identity of modern VDDR3 and scopes de novo
      occurrence to the two original subjects rather than the whole disorder.

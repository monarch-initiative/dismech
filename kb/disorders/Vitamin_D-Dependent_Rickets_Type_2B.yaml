name: Vitamin D-Dependent Rickets Type 2B
synonyms:
- VDDR2B
- Hereditary vitamin D-resistant rickets with normal vitamin D receptor
- Receptor-positive vitamin D-resistant rickets
creation_date: "2026-08-19T00:00:00Z"
category: Metabolic Disorder
description: >-
  MONDO:0010931 is curated here as an unresolved umbrella. Two principal
  evidence strata modeled in this entry have not been genetically or
  epidemiologically connected.
  One is a 1995 rural-Cauca cluster of more than 200 children with lower-limb
  deformities, receptor-positive vitamin D resistance, normal VDR cDNA sequence,
  and no alopecia. The other is a single alopecic child first reported in 1993:
  the child's endogenous VDR bound calcitriol but failed to localize normally to
  the nucleus, whereas the normal VDR coding sequence functioned after transfer
  to a heterologous cell context. Follow-up studies of cells from that index case
  identified overexpressed HNRNPC C1/C2 competing with VDR-RXR at vitamin D
  response elements and broadly suppressing vitamin-D-responsive transcription.

  HNRNPC is therefore represented only as a molecular actor in the index-case
  mechanism, not as a disease-causal gene. No causal germline lesion, inheritance
  pattern, or shared molecular basis for the two strata is established. The
  historical label "HVDRR type III" used for the index case predates and is not
  equivalent to modern CYP3A4-related vitamin D-dependent rickets type 3.

discussions:
- discussion_id: knowledge_gap_vddr2b_germline_lesion
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Response Element Competition by hnRNP C1/C2 Overexpression
  prompt: >-
    What germline lesion causes the constitutive hnRNP C1/C2 overexpression in
    vitamin D-dependent rickets type 2B, and is the disorder heritable in the
    Mendelian sense the name implies?
  rationale: >-
    The mechanism is established functionally - overexpression is sufficient to
    reproduce vitamin D resistance in cells - but no causal gene or germline
    variant has been identified, and the reported case material is very small. The
    entry therefore asserts a mechanism without an aetiology, and the inheritance
    block is deliberately left empty rather than assigned an autosomal recessive
    term by analogy with type 2A. This matters for the grouping: type 2B satisfies
    the vitamin D-dependent rickets criteria by mechanism, not by gene.
  proposed_experiments:
  - experiment_id: exp_vddr2b_genome_sequencing_hnrnpc_regulation
    name: Genome sequencing and regulatory analysis of hnRNP C1/C2 in HVDRR without VDR variants
    description: >-
      Perform genome and transcriptome sequencing on individuals with the HVDRR
      phenotype in whom VDR sequencing is normal, looking for regulatory or
      structural variants affecting HNRNPC expression, and quantify hnRNP C1/C2
      protein against controls.
notes: >-
  Curated at deliberately limited strength. There is no gene block because no
  causal gene is established, no inheritance block because the mode is not
  demonstrated, and two evidence items are marked PARTIAL because the single
  available molecular paper reports the mechanism rather than the clinical
  findings. Do not upgrade these without new primary evidence.

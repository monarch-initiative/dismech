review_notes: >-
  The 2026 deep review separates the Cauca cluster, the alopecic HNRNPC/VDRE
  index lineage, and other historical receptor-positive cases; it does not infer
  one shared disease mechanism. Primary evidence is used for clinical and cell
  claims, with the 2020 review limited to general mineral physiology and explicit
  uncertainty. The exact index treatment and laboratory values were inspected in
  the full text of PMID:12716975 but are recorded without snippet blocks because
  the sanctioned cache is abstract-only. All reference-cache additions were
  generated with `just fetch-reference`; no cache was hand-edited.

  For current-classification context, the relevant PMID:36779427 nosology table
  was inspected, but the sanctioned cache omits that table; its "HNRNPC-related"
  and "AD?" classification and its single-patient qualification are therefore
  recorded without an invented snippet and are not propagated into `genetic` or
  `inheritance`. The sanctioned PMID:38365463 cache is abstract-only; its full
  VDDR2B discussion was inspected for the separate index/Cauca account,
  less-well-defined status, and lack-of-replication observation, again without a
  purportedly cache-verifiable quotation. PMID:38706696 was excluded because its
  summary table appears to assign VDR to VDDR2B; PMID:39893280 has no
  VDDR2B-specific abstract content; PMID:33438017 is VDR/type-2A focused; and
  PMID:36475338/Endotext are broad, redundant summaries.

  The shared Vitamin D-Dependent Rickets grouping is corrected in this review.
  The reciprocal note in `Vitamin_D-Dependent_Rickets_Type_2A.yaml` still says
  type 2B has the same clinical phenotype with a structurally normal receptor;
  parent scope reserves that file for the immediate next campaign target, so the
  stale statement is documented here rather than changed in this review.

pathophysiology:
- name: Response Element Competition by hnRNP C1/C2 Overexpression
  description: >-
    Overexpressed heterogeneous nuclear ribonucleoprotein C1/C2 acts as a
    response-element-binding protein, occupying vitamin D response elements in
    target gene promoters. The vitamin D receptor-retinoid X receptor dimer binds
    hormone normally and is recruited normally, but the normal cyclical exchange
    of receptor on and off the response element is displaced by the competing
    protein, so transactivation fails. The mechanism is a transcriptional
    interference effect rather than a defect in any component of the vitamin D
    pathway itself.
  role: trigger
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Vitamin D Response Element Binding by hnRNP C1/C2
    term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    modifier: INCREASED
  biological_processes:
  - preferred_term: Vitamin D Receptor Signaling
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hormone resistance resulted from constitutive overexpression of
      heterogeneous nuclear ribonucleoprotein (hnRNP) that competed with a
      normally functioning VDR-retinoid X receptor (RXR) dimer for binding to the
      vitamin D response element (VDRE).
    explanation: >-
      States the competition mechanism in the affected individual, with the
      receptor explicitly functioning normally.
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When overexpressed in vitamin D-responsive cells, cDNAs for both hnRNPC1 and
      hnRNPC2 inhibited VDR-VDRE-directed transactivation (28 and 43%,
      respectively; both p < 0.005).
    explanation: >-
      Reconstitutes the resistance in cells by overexpression alone, showing the
      effect is sufficient rather than merely correlated.
  downstream:
  - target: Calcitriol-Unresponsive Intestinal Calcium Malabsorption
    causal_link_type: DIRECT
    description: >-
      Loss of vitamin D-directed transcription removes the calcium-absorptive
      response despite intact hormone and intact receptor.
- name: Calcitriol-Unresponsive Intestinal Calcium Malabsorption
  description: >-
    As in type 2A, active intestinal calcium absorption fails in the presence of
    abundant calcitriol, producing hypocalcemia, secondary hyperparathyroidism and
    phosphaturia. This is the disorder-specific instance of the module's
    calciopenic trigger arm; the substitution relative to type 2A is that the
    block is at response-element occupancy rather than at the receptor protein.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"

discussions:
- discussion_id: controversy_vddr2b_entity_boundary
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Cauca-Cohort Receptor-Positive Vitamin D Resistance
  - pathophysiology#Index-Case Endogenous VDR Nuclear-Localization Failure
  - pathophysiology#Index-Case HNRNPC C1/C2 Competition at Vitamin D Response Elements
  prompt: >-
    Do the Cauca cluster, the alopecic HNRNPC/VDRE index case, and other historical
    receptor-positive postreceptor cases represent one disease entity or several
    mechanistically distinct forms of vitamin D resistance?
  rationale: >-
    The evidence strata are not connected by pedigree, genotype, or a shared
    molecular assay. The 1983 postreceptor case had normal cytosolic and nuclear
    ligand binding but impaired 24-hydroxylase induction. The 1993 alopecic index
    case instead lacked normal endogenous VDR nuclear localization, and only its
    later cell lineage was tied to HNRNPC C1/C2 competition. The Cauca cohort had
    no alopecia, low-normal calcium, normal phosphate, and no HNRNPC study. MONDO
    currently combines a postreceptor/HNRNPC description, no-alopecia synonyms,
    and "Sporadic" metadata that do not jointly fit the primary strata; those
    ontology assertions are treated as an unresolved source mismatch, not as
    proof of one entity or a demonstrated inheritance mode. Modern classification
    has not resolved the mismatch: the 2023 skeletal-disorder nosology table
    labels the entity HNRNPC-related and "AD?" while qualifying the proposed
    HNRNPC dominant-negative basis as coming from a single patient, and the 2024
    review recounts the index case and Cauca cluster separately, calls VDDR2B
    less well defined, and notes that the cluster phosphorus pattern lacks
    replication. These later summaries are treated as classification context,
    not as new causal-gene or inheritance evidence.

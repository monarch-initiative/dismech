  evidence:
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically apparent hereditary vitamin D-resistant rickets (HVDRR) usually
      results from a loss of function mutation in the vitamin D receptor (VDR). We
      recently described a human with the classical HVDRR phenotype but normal VDR
      function.
    explanation: >-
      Establishes that the affected individual has the full clinical HVDRR
      phenotype, of which calcium malabsorption is the mechanism; support is
      PARTIAL because the abstract states the phenotype rather than measuring
      intestinal calcium absorption directly.
  downstream:

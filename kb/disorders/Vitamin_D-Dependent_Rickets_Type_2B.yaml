pathophysiology:
- name: Cauca-Cohort Receptor-Positive Vitamin D Resistance
  description: >-
    The 1995 Cauca study described more than 200 children with lower-limb
    deformities, elevated calcitriol, normal 25-hydroxyvitamin D, and a normal VDR
    cDNA sequence. The authors called this a distinct receptor-positive form of
    vitamin D resistance. HNRNPC abundance, VDRE occupancy, and the index-case
    cellular mechanism were not studied in this cohort, so its proximal molecular
    block remains unknown.
  role: trigger
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:7586652
    reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 200 patients with different types of lower limb deformities were
      detected in a rural area of the Cauca department in the southwest part of
      Colombia.
    explanation: >-
      Defines the size, geography, and skeletal presentation of the cluster
      stratum without linking it to the later index case.
  - reference: PMID:7586652
    reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cDNA analysis showed normal nucleotide sequence. We suggest that our
      patients represent a distinct form of receptor-positive resistance to
      vitamin D.
    explanation: >-
      Supports receptor-positive resistance and a normal VDR coding sequence, but
      does not identify the molecular cause.
  downstream:
  - target: Defective Skeletal Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cluster's biochemical resistance was associated with lower-limb
      deformities, but calcium remained within the low-normal range and phosphate
      was normal. The causal mineral intermediates were not resolved.
    evidence:
    - reference: PMID:7586652
      reference_title: Vitamin D dependent rickets type II and normal vitamin D receptor cDNA sequence. A cluster in a rural area of Cauca, Colombia, with more than 200 affected children.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        More than 200 patients with different types of lower limb deformities were
        detected in a rural area of the Cauca department in the southwest part of
        Colombia.
      explanation: >-
        Documents the associated skeletal endpoint. PARTIAL marks that this
        sentence does not itself establish the resistance-to-mineralization link
        or an unmeasured calciopenic intermediate.
- name: Index-Case Endogenous VDR Nuclear-Localization Failure
  description: >-
    In cells from the single alopecic child, endogenous VDR bound calcitriol but
    failed to show normal nuclear localization or a functional response. The VDR
    coding sequence was normal, and transfer of the patient's VDR cDNA into a
    different cellular context restored normal transactivation. This establishes
    a cell-contextual receptor-handling phenotype, not a causal VDR variant.
  role: trigger
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:8287584
    reference_title: Tissue resistance to 1,25-dihydroxyvitamin D without a mutation of the vitamin D receptor gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      VDR from the patient were able to bind 1,25(OH)2D3 but showed no nuclear
      localization resulting in an absence of functional response to
      1,25(OH)2D3.
    explanation: >-
      Directly records the abnormal endogenous localization and functional
      response observed in patient cells.
  - reference: PMID:8287584
    reference_title: Tissue resistance to 1,25-dihydroxyvitamin D without a mutation of the vitamin D receptor gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Sequencing revealed that the VDR coding region was normal. Expression
      studies of the patient's VDR showed functionally normal VDR as evidenced by
      normal transactivation in the presence of 1,25(OH)2D3.
    explanation: >-
      Separates the patient-cell phenotype from an intrinsic coding or functional
      defect of the VDR molecule.
  downstream:
  - target: Index-Case Loss of Vitamin D-Responsive Transcription
    causal_link_type: DIRECT
    description: >-
      Failure of endogenous ligand-bound VDR to localize normally was accompanied
      by absent calcitriol-responsive 24-hydroxylase activity in the same cells.
    evidence:
    - reference: PMID:8287584
      reference_title: Tissue resistance to 1,25-dihydroxyvitamin D without a mutation of the vitamin D receptor gene.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        VDR from the patient were able to bind 1,25(OH)2D3 but showed no nuclear
        localization resulting in an absence of functional response to
        1,25(OH)2D3.
      explanation: >-
        The authors explicitly connect failed localization to the absent
        functional response.
- name: Index-Case HNRNPC C1/C2 Competition at Vitamin D Response Elements
  description: >-
    Follow-up work on the index-case cells first detected an overexpressed
    response-element-binding protein and provisionally assigned it to the hnRNPA
    family. The protein was subsequently purified and cloned as HNRNPC C1/C2.
    Overexpressed HNRNPC competed with VDR-RXR for VDRE occupancy, disrupted the
    normal reciprocal occupancy cycle, and suppressed vitamin-D-directed
    transcription. HNRNPC is annotated here as the experimentally implicated
    actor; these studies did not identify a germline HNRNPC lesion.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  gene:
    preferred_term: HNRNPC
    term:
      id: hgnc:5035
      label: HNRNPC
  molecular_functions:
  - preferred_term: Vitamin D response-element binding by HNRNPC C1/C2
    term:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    modifier: INCREASED
  biological_processes:
  - preferred_term: Vitamin D receptor signaling
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:12716975
    reference_title: 'Heterogeneous nuclear ribonucleoprotein (hnRNP) binding to hormone response elements: a cause of vitamin D resistance.'
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Ab blocking in electrophoretic mobility-shift assays indicated that this
      dominant-negative acting protein was in the hnRNPA family of nucleic
      acid-binding proteins.
    explanation: >-
      Preserves the 2003 intermediate assignment; PARTIAL marks that the study had
      not yet identified the later HNRNPC C1/C2 molecular species.
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we describe the purification, molecular cloning, and expression of
      this vitamin D resistance-causing, competitive response element-binding
      protein (REBiP) hnRNP C1/C2.
    explanation: >-
      Supplies the later molecular identification that superseded the preliminary
      hnRNPA-family assignment.
  - reference: PMID:17071612
    reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When overexpressed in vitamin D-responsive cells, cDNAs for both hnRNPC1 and
      hnRNPC2 inhibited VDR-VDRE-directed transactivation (28 and 43%,
      respectively; both p < 0.005).
    explanation: >-
      Reconstitutes transcriptional suppression by HNRNPC C1 or C2
      overexpression.
  downstream:
  - target: Index-Case Loss of Vitamin D-Responsive Transcription
    causal_link_type: DIRECT
    description: >-
      Competitive VDRE occupancy limits VDR-RXR access and suppresses target-gene
      transactivation in index-case and engineered cell systems.
    evidence:
    - reference: PMID:17071612
      reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Hormone resistance resulted from constitutive overexpression of
        heterogeneous nuclear ribonucleoprotein (hnRNP) that competed with a
        normally functioning VDR-retinoid X receptor (RXR) dimer for binding to
        the vitamin D response element (VDRE).
      explanation: >-
        Directly links HNRNPC overexpression and competitive VDRE occupancy to
        the transcriptional hormone-resistance phenotype.
- name: Index-Case Loss of Vitamin D-Responsive Transcription
  description: >-
    Patient-derived cells were broadly insensitive to calcitriol-responsive gene
    regulation. The later transcriptomic study found that 113 of 114 genes
    regulated by calcitriol in control cells became insensitive in the
    VDRE-binding-protein-overexpressing patient cells.
  role: central_effector
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: Vitamin D receptor signaling
    term:
      id: GO:0070561
      label: vitamin D receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:21123297
    reference_title: Gene targeting by the vitamin D response element binding protein reveals a role for vitamin D in osteoblast mTOR signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DNA array analysis showed that of 114 genes regulated by
      1,25(OH)(2)D(3) in control cells, almost all (113) were rendered insensitive
      to the hormone in VDRE-BP-overexpressing HVDRR cells.
    explanation: >-
      Quantifies the breadth of the transcriptional resistance in the index-case
      cell system.
  downstream:
  - target: Index-Case Hypocalcemic Mineral Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cellular transcriptional resistance is consistent with the index
      child's hypocalcemic rickets, but intestinal calcium transport and the
      intervening organism-level steps were not directly measured in these
      mechanistic studies.
    evidence:
    - reference: PMID:17071612
      reference_title: 'Functional characterization of heterogeneous nuclear ribonuclear protein C1/C2 in vitamin D resistance: a novel response element-binding protein.'
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We recently described a human with the classical HVDRR phenotype but
        normal VDR function.
      explanation: >-
        Links the studied cells to the human HVDRR phenotype; PARTIAL marks that
        the mineral intermediary was not assayed in this paper.
- name: Index-Case Hypocalcemic Mineral Disturbance
  description: >-
    The index child had albumin-corrected calcium of 2.03 mmol/L against a stated
    reference interval of 2.25-2.55 mmol/L, elevated alkaline phosphatase, and
    elevated calcitriol. This stratum-specific node does not absorb the Cauca
    cohort, whose calcium was low-normal and whose phosphate was normal, and it
    avoids asserting directly measured intestinal malabsorption.
  role: central_effector
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  conforms_to: "defective_skeletal_mineralization#Calciopenic Substrate Deficiency"
  notes: >-
    Exact index-case laboratory values are reported in the full text of
    PMID:12716975 (PMCID:PMC156334). The sanctioned PMID cache is abstract-only,
    so no purportedly verbatim snippet is attached to this node.
  downstream:
  - target: Hypocalcemia
    causal_link_type: DIRECT
    description: >-
      The measured low serum calcium is the defining clinical phenotype of this
      stratum-specific mineral disturbance.
  - target: Defective Skeletal Mineralization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced calcium availability can impair skeletal mineralization. The exact
      intermediate physiology, including the growth-plate route, was not fully
      measured in the index-case mechanistic studies.
    evidence:
    - reference: PMID:32596195
      reference_title: Diagnosis and Management of Vitamin D Dependent Rickets.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Reduced serum levels of calcium and/or phosphorus can produce osteomalacia,
        as the low concentrations of these minerals are insufficient to induce or
        propagate hydroxyapatite cystral deposition in the skeleton.
      explanation: >-
        Supplies a general calcium-or-phosphorus mechanism for impaired skeletal
        mineralization. PARTIAL marks that it is narrative-review evidence, does
        not establish the index child's growth-plate intermediate, and is not a
        stratum-specific measurement.
    - reference: PMID:8287584
      reference_title: Tissue resistance to 1,25-dihydroxyvitamin D without a mutation of the vitamin D receptor gene.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A child with alopecia diagnosed as having rickets due to resistance to
        1,25(OH)2D3.
      explanation: >-
        Documents the index child's skeletal endpoint; PARTIAL marks that it does
        not establish the causal mineral-ion step.

name: Vitamin D-Dependent Rickets Type 2B
synonyms:
- VDDR2B
- Hereditary vitamin D-resistant rickets with normal vitamin D receptor
- Vitamin D resistance due to hnRNP overexpression
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
description: >-
  Vitamin D-dependent rickets type 2B produces the clinical and biochemical
  picture of hereditary vitamin D-resistant rickets - hypocalcemic rickets with
  elevated calcitriol - in an individual whose vitamin D receptor is structurally
  and functionally normal. Resistance arises one step further downstream, at the
  DNA: constitutive overexpression of heterogeneous nuclear ribonucleoprotein
  C1/C2 competes with the vitamin D receptor-retinoid X receptor heterodimer for
  occupancy of vitamin D response elements, so hormone-bound receptor cannot
  transactivate its target genes. This is the only member of the vitamin
  D-dependent rickets series whose lesion is not in a vitamin D pathway gene.
  Evidence rests on a small number of reported individuals and the corresponding
  cell-based experiments; no causal germline gene has been established, and the
  entry is curated at that strength deliberately.

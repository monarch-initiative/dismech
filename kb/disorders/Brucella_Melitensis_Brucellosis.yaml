agent_life_cycle:
  description: >-
    B. melitensis is maintained primarily in infected small ruminants, especially
    sheep and goats, which seed human food-borne, contact, and aerosol exposure.
    Humans are incidental clinical hosts and do not maintain onward transmission.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: sheep
    role: primary small-ruminant reservoir host
    term:
      id: NCBITaxon:9940
      label: Ovis aries
  - preferred_term: goat
    role: primary small-ruminant reservoir host
    term:
      id: NCBITaxon:9925
      label: Capra hircus
  evidence:
  - reference: PMID:36653223
    reference_title: "Vaccine properties of Brucella melitensis 16MΔwzm and reactivation of placental infection in pregnant sheep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In endemic regions, small ruminants infected by Brucella melitensis are the main source of human brucellosis."
    explanation: >-
      The B. melitensis livestock-vaccine paper's background identifies infected
      small ruminants as the reservoir source for endemic human disease.
transmission:
- name: Small-ruminant dairy and livestock zoonotic exposure
  description: >-
    Human B. melitensis infection is acquired from infected sheep and goats or
    their products, especially through raw milk, unpasteurized dairy, and direct
    contact with infected herds or abortion materials.
  evidence:
  - reference: PMID:23236528
    reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals, particularly aborted foetuses"
    explanation: >-
      The systematic review captures the major ingestion and direct-contact
      routes for zoonotic human brucellosis.
progression:
- phase: Acute brucellosis
  notes: >-
    Acute disease is the early inflammatory presentation and can respond well to
    appropriately prolonged combination therapy.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, acute brucellosis presents with a more pronounced inflammatory profile than subacute/chronic forms."
    explanation: >-
      The phase-comparison cohort distinguishes acute from subacute/chronic
      disease and describes acute brucellosis as a more inflammatory phase.
- phase: Subacute and chronic brucellosis
  notes: >-
    Later presentations can be harder to treat than acute disease and may
    reflect persistent or focalized infection.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While patients with acute brucellosis demonstrated a significantly higher therapeutic response rate, the serological response was also more pronounced in this group."
    explanation: >-
      The comparison of acute versus subacute/chronic cases supports later
      disease as a clinically distinct, less treatment-responsive phase.
- phase: Relapse after apparent therapy response
  notes: >-
    Relapse can follow therapy even for uncomplicated brucellosis, which is why
    standard adult treatment uses multi-week combination antibiotic courses.
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More importantly, these regimens still allow for a small, albeit significant percentage of therapeutic failures, most commonly in the form of relapses, ranging from 5% to 15% of uncomplicated cases."
    explanation: >-
      The treatment recommendations describe relapse as the commonest form of
      therapeutic failure after standard regimens.
pathophysiology:
- name: Brucella melitensis zoonotic acquisition
  description: >-
    Exposure to infected small ruminants or their unpasteurized dairy products
    introduces B. melitensis into the human host and initiates the intracellular
    brucellosis infection program.
  biological_scale: ORGANISM
  role: trigger
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is endemic in Israel, affecting mainly sheep and goats, dairy cattle, and humans"
    explanation: >-
      The culture-confirmed B. melitensis epidemiology series places human
      disease in the same endemic sheep, goat, and cattle setting that seeds
      zoonotic exposure.
  downstream:
  - target: Phagocyte Brucella-containing vacuole formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acquired B. melitensis crosses a mucosal or cutaneous barrier and is
      internalized by phagocytes, creating the Brucella-containing vacuole in
      which the intracellular cycle begins.
    evidence:
    - reference: PMID:27899503
      reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "The ability of Brucella spp. to cause disease depends on their intracellular cycle within host phagocytes, such as macrophages or dendritic cells (8, 9), in which the bacterium resides in a membrane-bound compartment called the Brucella-containing vacuole (BCV) (10)."
      explanation: >-
        The Brucella intracellular-cycle paper's background links disease
        causation to residence within a BCV in macrophages and dendritic cells,
        connecting acquisition to the intracellular niche.
- name: Phagocyte Brucella-containing vacuole formation
  description: >-
    Internalized Brucella spp. reside in Brucella-containing vacuoles inside
    host macrophages and dendritic cells, setting up the intracellular trafficking
    program required for persistent brucellosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: defense response to Gram-negative bacterium
    modifier: DYSREGULATED
    term:
      id: GO:0050829
      label: defense response to Gram-negative bacterium
  evidence:
  - reference: PMID:27899503
    reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Upon their initial formation following phagocytic uptake, BCVs undergo maturation events along the endocytic pathway to become an endosomal BCV (eBCV) (10–12)."
    explanation: >-
      The Brucella cell-biology paper describes formation of endosomal
      Brucella-containing vacuoles after phagocytic uptake.
  downstream:
  - target: VirB-dependent ER-derived replicative vacuole maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The early endosomal BCV is converted into an endoplasmic-reticulum-derived
      replicative organelle through Brucella VirB type IV secretion system
      activity.
    evidence:
    - reference: PMID:27899503
      reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "BCVs are remodeled into replication-permissive organelles (rBCV) derived from the host endoplasmic reticulum, a process that requires modulation of host secretory functions via delivery of effector proteins by the Brucella VirB type IV secretion system (T4SS)."
      explanation: >-
        This experimental B. abortus macrophage study documents the VirB T4SS
        step that remodels endosomal BCVs into ER-derived replicative BCVs, a
        conserved Brucella intracellular-cycle step used here for the B.
        melitensis syndrome.
- name: VirB-dependent ER-derived replicative vacuole maturation
  description: >-
    Brucella VirB type IV secretion remodels the endosomal Brucella-containing
    vacuole into a host endoplasmic-reticulum-derived replicative organelle,
    allowing intracellular expansion rather than lysosomal elimination.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:27899503
    reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The VirB T4SS is essential for rBCV biogenesis, as VirB-deficient mutants are stalled in eBCVs and cannot mediate rBCV biogenesis."
    explanation: >-
      Conditional VirB11 expression in B. abortus shows that VirB type IV
      secretion is required for formation of the replicative BCV stage.
  downstream:
  - target: Chronic splenic myeloid reservoir formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intracellular replication supports dissemination into tissue reservoirs,
      including splenic reservoir cells observed directly in a chronic-phase B.
      melitensis mouse infection model.
    evidence:
    - reference: PMID:26376185
      reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This characterization of B. melitensis reservoir cells could provide a better understanding of Brucella persistence in the host and lead to the design of more efficient therapeutic strategies."
      explanation: >-
        The B. melitensis mouse study supports splenic reservoir biology as a
        model of host persistence after intracellular replication.
- name: Chronic splenic myeloid reservoir formation
  description: >-
    In a susceptible IL-12p40-deficient mouse model, chronic B. melitensis
    infection persists in lipid-rich splenic myeloid reservoir cells that express
    dendritic-cell markers and Arginase1.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:26376185
    reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Most of the infected spleen cells contained high levels of lipids and expressed CD11c and CD205 dendritic cell markers and Arginase1, but were negative for the M2a markers Fizz1 or CD301."
    explanation: >-
      The susceptible-mouse study directly observed the phenotype of chronic B.
      melitensis-infected splenic reservoir cells.
  downstream:
  - target: Persistent multisystem infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Long-lived intracellular myeloid reservoirs are a model for the difficult
      clearance and relapse-prone persistence of human brucellosis.
    evidence:
    - reference: PMID:26376185
      reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "This characterization of B. melitensis reservoir cells could provide a better understanding of Brucella persistence in the host and lead to the design of more efficient therapeutic strategies."
      explanation: >-
        The model-organism result is indirect support for how splenic reservoir
        biology can contribute to persistent human B. melitensis infection.
- name: Persistent multisystem infection
  description: >-
    Intracellular B. melitensis infection produces a persistent, relapse-prone,
    systemic brucellosis syndrome that can disseminate hematogenously and seed
    focal complications.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: defense response to bacterium
    modifier: DYSREGULATED
    term:
      id: GO:0042742
      label: defense response to bacterium
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More importantly, these regimens still allow for a small, albeit significant percentage of therapeutic failures, most commonly in the form of relapses, ranging from 5% to 15% of uncomplicated cases."
    explanation: >-
      The treatment recommendations summarize relapse after otherwise standard
      regimens, supporting relapse-prone persistence as a clinical property of
      human brucellosis.
  downstream:
  - target: Fever
    description: Systemic brucellosis commonly manifests with fever.
    evidence:
    - reference: PMID:29863218
      reference_title: "Brucellosis in Adults and Children: A 10-Year Case Series at Two Large Academic Hospitals in Houston, Texas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Common clinical features included fever (83%), arthralgias or arthritis (67%), and hepatosplenomegaly (61%)."
      explanation: >-
        The case series identifies fever as a common clinical feature of human
        brucellosis.
  - target: Joint pain
    description: The multisystem syndrome commonly includes arthralgia or arthritis.
    evidence:
    - reference: PMID:29863218
      reference_title: "Brucellosis in Adults and Children: A 10-Year Case Series at Two Large Academic Hospitals in Houston, Texas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Common clinical features included fever (83%), arthralgias or arthritis (67%), and hepatosplenomegaly (61%)."
      explanation: >-
        The case series identifies arthralgias or arthritis as common
        musculoskeletal manifestations of human brucellosis.
  - target: Hepatosplenomegaly
    description: Reticuloendothelial infection can enlarge the liver and spleen.
    evidence:
    - reference: PMID:29863218
      reference_title: "Brucellosis in Adults and Children: A 10-Year Case Series at Two Large Academic Hospitals in Houston, Texas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Common clinical features included fever (83%), arthralgias or arthritis (67%), and hepatosplenomegaly (61%)."
      explanation: >-
        The case series identifies hepatosplenomegaly as one of the common
        clinical findings in human brucellosis.
  - target: Elevated transaminases
    description: Systemic brucellosis can involve hepatic inflammation reflected by elevated transaminases.
    evidence:
    - reference: PMID:29863218
      reference_title: "Brucellosis in Adults and Children: A 10-Year Case Series at Two Large Academic Hospitals in Houston, Texas."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common laboratory finding was mildly elevated transaminases."
      explanation: >-
        The case series reports elevated transaminases as the most common
        laboratory abnormality.

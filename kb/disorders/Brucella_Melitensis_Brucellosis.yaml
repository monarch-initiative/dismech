      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals"
      explanation: >-
        Species-specific B. melitensis disease is a zoonotic bacterial
        infectious disease within the broader human brucellosis syndrome.

name: Brucella Melitensis Brucellosis
creation_date: "2026-09-29T05:55:32Z"
category: Infectious Disease
description: >-
  Brucella melitensis brucellosis is a small-ruminant-associated form of human
  brucellosis caused by the facultatively intracellular bacterium Brucella
  melitensis. Humans are infected through unpasteurized sheep/goat dairy
  products, contact with infected animals or birth products, and occupational or
  laboratory aerosol exposure; the resulting disease is a systemic febrile
  brucellosis syndrome that can relapse or seed focal complications when it is
  not treated with prolonged combination antibiotics.
disease_term:
  preferred_term: Brucella melitensis brucellosis
  term:
    id: MONDO:0001972
    label: Brucella melitensis brucellosis
parents:
- Brucellosis
synonyms:
- Brucella melitensis infection
definitions:
- name: B. melitensis zoonotic brucellosis
  definition_type: CASE_DEFINITION
  description: >-
    Brucella melitensis brucellosis is human brucellosis caused by B. melitensis
    after zoonotic exposure to infected small ruminants or contaminated animal
    products.
  scope: Species-specific human brucellosis definition
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucella melitensis was the dominant species (99.6%)."
    explanation: >-
      In a national culture-confirmed human brucellosis series, nearly every
      isolate was B. melitensis, supporting this MONDO child as a human
      brucellosis entity caused by that species.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:

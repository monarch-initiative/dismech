treatments:
- name: Doxycycline-rifampicin combination therapy
  description: >-
    Six-week all-oral combination therapy used for uncomplicated human
    brucellosis, with convenience advantages but more relapse than
    aminoglycoside-containing regimens in some comparative analyses.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  target_mechanisms:
  - target: Persistent multisystem infection
    treatment_effect: INHIBITS
    description: Prolonged intracellularly active antibiotic therapy clears infection and limits relapse.
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The author panel suggests that the optimal treatment of uncomplicated brucellosis should be based on a six-week regimen of doxycycline combined either with streptomycin for 2–3 weeks, or rifampicin for six weeks."
    explanation: >-
      The expert recommendation lists doxycycline plus six weeks of rifampicin as
      one optimal uncomplicated-brucellosis regimen.
- name: Doxycycline-streptomycin combination therapy
  description: >-
    Aminoglycoside-containing combination therapy for uncomplicated human
    brucellosis that is generally more efficacious than doxycycline-rifampicin
    but requires parenteral streptomycin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: streptomycin
      term:
        id: CHEBI:17076
        label: streptomycin
  target_mechanisms:
  - target: Persistent multisystem infection
    treatment_effect: INHIBITS
    description: The doxycycline-aminoglycoside combination improves clearance and relapse prevention.
  evidence:
  - reference: PMID:39172763
    reference_title: "Updated therapeutic options for human brucellosis: A systematic review and network meta-analysis of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Doxycycline + Gentamicin ranked the best in efficacy (SUCRA values: 0.94), the second is Triple (SUCRA values: 0.87), and the third is Doxycycline + Streptomycin (SUCRA values: 0.78)."
    explanation: >-
      The randomized-trial network meta-analysis ranked doxycycline-streptomycin
      among the high-efficacy treatment strategies.
- name: Doxycycline-gentamicin combination therapy
  description: >-
    Aminoglycoside-containing combination therapy that ranked highest for
    efficacy in a network meta-analysis of randomized brucellosis trials, with
    the usual tetracycline/aminoglycoside caveats for children, pregnancy, and
    focal disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: gentamicin
      term:
        id: CHEBI:759884
        label: gentamicin
  target_mechanisms:
  - target: Persistent multisystem infection
    treatment_effect: INHIBITS
    description: The doxycycline-aminoglycoside combination improves clearance and relapse prevention.
  evidence:
  - reference: PMID:39172763
    reference_title: "Updated therapeutic options for human brucellosis: A systematic review and network meta-analysis of randomized controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Doxycycline + Gentamicin ranked the best in efficacy (SUCRA values: 0.94), the second is Triple (SUCRA values: 0.87), and the third is Doxycycline + Streptomycin (SUCRA values: 0.78)."
    explanation: >-
      The randomized-trial network meta-analysis ranked doxycycline-gentamicin
      highest for efficacy among compared brucellosis regimens.

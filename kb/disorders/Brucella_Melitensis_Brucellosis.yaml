animal_models:
- name: IL-12p40-deficient B. melitensis chronic splenic reservoir mouse
  species: Mouse
  genotype: IL-12p40-/- BALB/c
  description: >-
    Intranasal challenge of IL-12p40-deficient BALB/c mice with fluorescent
    B. melitensis creates high chronic splenic burdens that permit in situ
    microscopy of lipid-rich, CD11c+/CD205+/Arginase1+ reservoir cells.
  publication: PMID:26376185
  modeled_mechanisms:
  - target: Chronic splenic myeloid reservoir formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model reproduces durable splenic B. melitensis infection and exposes
      the phenotype of infected myeloid reservoir cells.
    limitations: >-
      The model requires an IL-12p40 knockout background and a high intranasal
      inoculum to make infected splenic cells abundant enough for direct
      microscopy, so it models reservoir-cell biology under impaired Th1/Th17
      control rather than the full immunocompetent human syndrome.
    evidence:
    - reference: PMID:26376185
      reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we used a model in which infected cells can be observed directly in situ and where the differentiation of M2a macrophages is favored by the absence of an IL-12-dependent Th1 response."
      explanation: >-
        The study describes the IL-12p40-deficient mouse model and the reason it
        was selected for direct observation of chronic B. melitensis reservoir
        cells in situ.

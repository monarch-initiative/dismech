name: Brucella Melitensis Brucellosis
creation_date: "2026-09-29T05:55:32Z"
updated_date: "2026-09-29T08:53:17Z"
category: Infectious Disease
description: >-
  Brucella melitensis brucellosis is a small-ruminant-associated form of human
  brucellosis caused by the facultatively intracellular bacterium Brucella
  melitensis. Humans are infected through unpasteurized sheep/goat dairy
  products, contact with infected animals or birth products, and occupational or
  laboratory aerosol exposure; the resulting disease is a systemic febrile
  brucellosis syndrome that can relapse or seed focal complications when it is
  not treated with prolonged combination antibiotics.
disease_term:
  preferred_term: Brucella melitensis brucellosis
  term:
    id: MONDO:0001972
    label: Brucella melitensis brucellosis
parents:
- Brucellosis
synonyms:
- Brucella melitensis infection
definitions:
- name: B. melitensis zoonotic brucellosis
  definition_type: CASE_DEFINITION
  description: >-
    Brucella melitensis brucellosis is human brucellosis caused by B. melitensis
    after zoonotic exposure to infected small ruminants or contaminated animal
    products; it is tracked at this MONDO child because a species-specific
    sheep/goat reservoir and high human-disease prominence distinguish it from
    all-cause brucellosis.
  scope: Species-specific human brucellosis definition
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucella melitensis was the dominant species (99.6%)."
    explanation: >-
      In a national culture-confirmed human brucellosis series, nearly every
      isolate was B. melitensis, supporting this MONDO child as a human
      brucellosis entity caused by that species.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:23236528
      reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals"
      explanation: >-
        Species-specific B. melitensis disease is a zoonotic bacterial
        infectious disease within the broader human brucellosis syndrome.
prevalence:
- population: Culture-confirmed predominantly B. melitensis cases in Israel, 2004-2022
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.6
  rate_denominator: POPULATION_PER_YEAR
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average annual incidence rates overall and for the Arab, Druze, and Jewish sectors were 1.6/100,000, 6.6/100,000, 5.5/100,000, and 0.18/100,000, respectively."
    explanation: >-
      The national culture-confirmed series gives an annual population incidence
      for a cohort in which 99.6% of typed isolates were B. melitensis.
- population: Reported human brucellosis in Ningxia, China, 2010-2024
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 35.08
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    This surveillance estimate is not species-stratified; it is retained as a
    regional human brucellosis burden estimate and should not be read as a
    culture-confirmed B. melitensis-only incidence rate.
  evidence:
  - reference: PMID:41632803
    reference_title: "Prevalence and spatial distribution characteristics of human brucellosis in Ningxia from 2010 to 2024."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 35 665 human brucellosis cases were reported in Ningxia, with no associated deaths, during the study period. The average annual incidence rates was 35.08/100,000, ranging from 3.31 to 84.80 per 100,000."
    explanation: >-
      Provides a 2010-2024 regional annual incidence estimate for reported human
      brucellosis in a high-endemicity province.
- population: Ethiopian human serosurveys, 2015-2024
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 6900.0
  notes: >-
    This pooled seroprevalence is not species-stratified and reflects
    heterogeneous Ethiopian human serosurveys, not a culture-confirmed
    population prevalence of B. melitensis alone.
  evidence:
  - reference: PMID:39696174
    reference_title: "Human and animal brucellosis and risk factors for human infection in Ethiopia: a systematic review and meta-analysis (2015-2024)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seroprevalence of brucellosis was higher in humans at 6.9% (95% CI: 4.9, 8.8) and lower in cattle at 3.5% (95% CI: 2.2, 4.7)."
    explanation: >-
      The Ethiopian One Health meta-analysis estimates human brucellosis
      seropositivity; the rate is normalized from 6.9% to 6,900 per 100,000.
infectious_agent:
- name: Brucella melitensis
  infectious_agent_term:
    preferred_term: Brucella melitensis
    term:
      id: NCBITaxon:29459
      label: Brucella melitensis
  description: >-
    Facultatively intracellular Brucella species whose preferred animal hosts
    are sheep and goats and that causes human brucellosis after zoonotic
    spillover.
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucella melitensis was the dominant species (99.6%)."
    explanation: >-
      In a national culture-confirmed human brucellosis series, nearly every
      isolate was B. melitensis.
agent_life_cycle:
  description: >-
    B. melitensis is maintained primarily in infected small ruminants, especially
    sheep and goats, which seed human food-borne, contact, and aerosol exposure.
    Humans are incidental clinical hosts and do not maintain onward transmission.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: sheep
    role: primary small-ruminant reservoir host
    term:
      id: NCBITaxon:9940
      label: Ovis aries
  - preferred_term: goat
    role: primary small-ruminant reservoir host
    term:
      id: NCBITaxon:9925
      label: Capra hircus
  evidence:
  - reference: PMID:36653223
    reference_title: "Vaccine properties of Brucella melitensis 16MΔwzm and reactivation of placental infection in pregnant sheep."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In endemic regions, small ruminants infected by Brucella melitensis are the main source of human brucellosis."
    explanation: >-
      The B. melitensis livestock-vaccine paper's background identifies infected
      small ruminants as the reservoir source for endemic human disease.
transmission:
- name: Small-ruminant dairy and livestock zoonotic exposure
  description: >-
    Human B. melitensis infection is acquired from infected sheep and goats or
    their products, especially through raw milk, unpasteurized dairy, and direct
    contact with infected herds or abortion materials.
  evidence:
  - reference: PMID:23236528
    reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is a bacterial disease transmitted to humans by consumption of infected, unpasteurised animal milk or through direct contact with infected animals, particularly aborted foetuses"
    explanation: >-
      The systematic review captures the major ingestion and direct-contact
      routes for zoonotic human brucellosis.
progression:
- phase: Acute brucellosis
  notes: >-
    Acute disease is the early inflammatory presentation and can respond well to
    appropriately prolonged combination therapy.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, acute brucellosis presents with a more pronounced inflammatory profile than subacute/chronic forms."
    explanation: >-
      The phase-comparison cohort distinguishes acute from subacute/chronic
      disease and describes acute brucellosis as a more inflammatory phase.
- phase: Subacute and chronic brucellosis
  notes: >-
    Later presentations can be harder to treat than acute disease and may
    reflect persistent or focalized infection.
  evidence:
  - reference: PMID:41241000
    reference_title: "Laboratory parameters and serum tube agglutination test as markers for brucellosis treatment response."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While patients with acute brucellosis demonstrated a significantly higher therapeutic response rate, the serological response was also more pronounced in this group."
    explanation: >-
      The comparison of acute versus subacute/chronic cases supports later
      disease as a clinically distinct, less treatment-responsive phase.
- phase: Relapse after apparent therapy response
  notes: >-
    Relapse can follow therapy even for uncomplicated brucellosis, which is why
    standard adult treatment uses multi-week combination antibiotic courses.
  evidence:
  - reference: PMID:18162038
    reference_title: "Perspectives for the treatment of brucellosis in the 21st century: the Ioannina recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More importantly, these regimens still allow for a small, albeit significant percentage of therapeutic failures, most commonly in the form of relapses, ranging from 5% to 15% of uncomplicated cases."
    explanation: >-
      The treatment recommendations describe relapse as the commonest form of
      therapeutic failure after standard regimens.
pathophysiology:
- name: Brucella melitensis zoonotic acquisition
  description: >-
    Exposure to infected small ruminants or their unpasteurized dairy products
    introduces B. melitensis into the human host and initiates the intracellular
    brucellosis infection program.
  biological_scale: ORGANISM
  role: trigger
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brucellosis is endemic in Israel, affecting mainly sheep and goats, dairy cattle, and humans"
    explanation: >-
      The culture-confirmed B. melitensis epidemiology series places human
      disease in the same endemic sheep, goat, and cattle setting that seeds
      zoonotic exposure.
  downstream:
  - target: Phagocyte Brucella-containing vacuole formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acquired B. melitensis crosses a mucosal or cutaneous barrier and is
      internalized by phagocytes, creating the Brucella-containing vacuole in
      which the intracellular cycle begins.
    evidence:
    - reference: PMID:27899503
      reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "The ability of Brucella spp. to cause disease depends on their intracellular cycle within host phagocytes, such as macrophages or dendritic cells (8, 9), in which the bacterium resides in a membrane-bound compartment called the Brucella-containing vacuole (BCV) (10)."
      explanation: >-
        The Brucella intracellular-cycle paper's background links disease
        causation to residence within a BCV in macrophages and dendritic cells,
        connecting acquisition to the intracellular niche.
- name: Phagocyte Brucella-containing vacuole formation
  description: >-
    Internalized Brucella spp. reside in Brucella-containing vacuoles inside
    host macrophages and dendritic cells, setting up the intracellular trafficking
    program required for persistent brucellosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  evidence:
  - reference: PMID:27899503
    reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Upon their initial formation following phagocytic uptake, BCVs undergo maturation events along the endocytic pathway to become an endosomal BCV (eBCV) (10–12)."
    explanation: >-
      The Brucella cell-biology paper describes formation of endosomal
      Brucella-containing vacuoles after phagocytic uptake.
  downstream:
  - target: VirB-dependent ER-derived replicative vacuole maturation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The early endosomal BCV is converted into an endoplasmic-reticulum-derived
      replicative organelle through Brucella VirB type IV secretion system
      activity.
    evidence:
    - reference: PMID:27899503
      reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "BCVs are remodeled into replication-permissive organelles (rBCV) derived from the host endoplasmic reticulum, a process that requires modulation of host secretory functions via delivery of effector proteins by the Brucella VirB type IV secretion system (T4SS)."
      explanation: >-
        This experimental B. abortus macrophage study documents the VirB T4SS
        step that remodels endosomal BCVs into ER-derived replicative BCVs, a
        conserved Brucella intracellular-cycle step used here for the B.
        melitensis syndrome.
  - target: Brucella Omp25-dependent macrophage immune evasion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Brucella intracellular macrophage residence is reinforced by innate immune
      evasion, including Omp25-associated TNF-alpha suppression and impaired
      infected-phagocyte apoptosis.
    evidence:
    - reference: PMID:12414158
      reference_title: "The innate immune response against Brucella in humans."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "By constructing null mutants, we demonstrated that this inhibition involves the outer membrane protein Omp25 of Brucella, however the mechanism regulating the inhibition has not yet been clearly defined."
      explanation: >-
        The Brucella innate-immunity review links Omp25 to macrophage
        TNF-alpha inhibition; the edge uses this as genus-level support for
        innate immune evasion downstream of the BCV niche.
- name: VirB-dependent ER-derived replicative vacuole maturation
  description: >-
    Brucella VirB type IV secretion remodels the endosomal Brucella-containing
    vacuole into a host endoplasmic-reticulum-derived replicative organelle,
    allowing intracellular expansion rather than lysosomal elimination.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:27899503
    reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The VirB T4SS is essential for rBCV biogenesis, as VirB-deficient mutants are stalled in eBCVs and cannot mediate rBCV biogenesis."
    explanation: >-
      Conditional VirB11 expression in B. abortus shows that VirB type IV
      secretion is required for formation of the replicative BCV stage.
  downstream:
  - target: Autophagic Brucella-containing vacuole egress
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Post-replicative Brucella-containing vacuoles become autophagic vacuoles
      that enable bacterial egress and subsequent cell-to-cell infection.
    evidence:
    - reference: PMID:27899503
      reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Following replication, rBCVs are converted into autophagic vacuoles (aBCVs) that facilitate bacterial egress and subsequent infections, arguing that the bacterium sequentially manipulates multiple cellular pathways to complete its cycle."
      explanation: >-
        Conditional VirB11 experiments and Brucella cell biology connect the
        post-replicative vacuole state to bacterial egress and reinfection.
- name: Brucella Omp25-dependent macrophage immune evasion
  description: >-
    Brucella outer-membrane and intracellular programs blunt human macrophage
    antimicrobial defense by suppressing TNF-alpha secretion and preventing
    monocyte/macrophage apoptosis, extending the infected phagocyte niche.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:12414158
    reference_title: "The innate immune response against Brucella in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "in humans, Brucella suis impairs the apoptosis of monocytes and macrophages, thus preventing its host cell elimination."
    explanation: >-
      The review summarizes Brucella anti-apoptotic effects in human monocytes
      and macrophages as one mechanism extending survival of infected host cells.
  downstream:
  - target: Th1 cytokine-dependent containment failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Omp25-associated TNF-alpha suppression can reduce IL-12 and Th1 cytokine
      development, counteracting IFN-gamma/TNF-alpha-dependent clearance.
    evidence:
    - reference: PMID:12414158
      reference_title: "The innate immune response against Brucella in humans."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "It is likely that the Omp25-induced effect on TNF-alpha production assists bacterial evasion of antimicrobial defences at different levels."
      explanation: >-
        The review interprets Omp25-dependent TNF-alpha suppression as
        antimicrobial-defense evasion that can weaken innate activation and Th1
        development.
- name: Th1 cytokine-dependent containment failure
  description: >-
    Clearance of Brucella depends on early TNF-alpha, IFN-gamma, and IL-12
    cellular immunity; inadequate Th1 containment permits persistence rather
    than resolution.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12414158
    reference_title: "The innate immune response against Brucella in humans."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Brucella infection results in Type1 (Th1) cellular immune response which promotes a clearance of the bacterial organism."
    explanation: >-
      The innate-immunity review identifies the Th1 response as a clearance axis,
      supporting persistence when this axis is blunted.
  downstream:
  - target: Chronic splenic myeloid reservoir formation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A susceptible IL-12p40-deficient mouse model makes it possible to observe
      chronic B. melitensis splenic reservoir cells when protective Th1/Th17
      control is impaired.
    evidence:
    - reference: PMID:26376185
      reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To bypass this problem, we have previously used highly susceptible IL-12p40-/- BALB/c mice."
      explanation: >-
        The reservoir-cell study used IL-12p40-deficient mice to expose splenic
        infected cells during chronic B. melitensis infection.
- name: Autophagic Brucella-containing vacuole egress
  description: >-
    Replication-stage Brucella-containing vacuoles convert into
    autophagosome-like vacuoles that complete the intracellular cycle by
    releasing bacteria for subsequent infections.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:27899503
    reference_title: "Postreplication Roles of the Brucella VirB Type IV Secretion System Uncovered via Conditional Expression of the VirB11 ATPase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Considering that aBCVs facilitate Brucella release from macrophages (12), these findings clearly demonstrate that aBCV formation and subsequent bacterial egress are VirB T4SS-dependent processes."
    explanation: >-
      The conditional VirB11 B. abortus macrophage study places autophagic BCVs
      after replication and ties them to bacterial egress.
  downstream:
  - target: Hematogenous dissemination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cell egress enables ongoing intracellular spread; in human B. melitensis
      brucellosis, culture-confirmed cases commonly have bacteraemia that can
      seed distant focal sites.
    evidence:
    - reference: DOI:10.1017/S0950268824000803
      reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of 2,489 unique cases, 99.8% were bacteraemic"
      explanation: >-
        Bacteraemia in the culture-confirmed, almost entirely B. melitensis
        cohort supports bloodstream dissemination after intracellular spread.
- name: Hematogenous dissemination
  description: >-
    B. melitensis frequently enters the bloodstream, distributing intracellular
    bacteria from the systemic reservoir to bone, joints, cardiac valves, the
    genitourinary tract, and reticuloendothelial organs.
  biological_scale: ORGANISM
  evidence:
  - reference: DOI:10.1017/S0950268824000803
    reference_title: "National epidemiology of culture-confirmed brucellosis in Israel, 2004-2022"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 2,489 unique cases, 99.8% were bacteraemic"
    explanation: >-
      A national culture-confirmed cohort in which 99.6% of Brucella isolates
      were B. melitensis documented bloodstream infection in nearly all cases.
  downstream:
  - target: Osteoarticular seeding
    description: >-
      Bloodstream spread can establish focal infection in peripheral joints,
      sacroiliac joints, and vertebral structures.
    evidence:
    - reference: PMID:42603185
      reference_title: "Pediatric brucellosis: predictors of hospitalization, complications, and relapse in a nationwide multicenter cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Complications occurred in 87 patients (8.3%), most frequently osteoarticular (spondylitis, sacroiliitis, and osteomyelitis), whereas neurobrucellosis was rare (0.9%); relapse occurred in 34 patients (3.2%)."
      explanation: >-
        The nationwide pediatric cohort identifies osteoarticular disease as the
        most frequent complication, supporting focal skeletal seeding.
  - target: Cardiac valve seeding
    description: Bloodstream spread can establish focal Brucella infection on cardiac valves.
    evidence:
    - reference: PMID:11910696
      reference_title: "[Brucella endocarditis of native valves. Report of 3 cases]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brucella endocarditis is a rare but a serious complication of human brucellosis."
      explanation: >-
        The native-valve case series supports endocarditis as a rare focal
        brucellosis complication.
  - target: Genitourinary seeding
    description: Bloodstream spread can establish focal infection in the epididymis and testis.
    evidence:
    - reference: PMID:40350681
      reference_title: "Clinical and therapeutic insights into brucellar epididymo-orchitis: a retrospective analysis in a brucellosis endemic area."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Involvement of testis and epididymis can occur in acute and chronic forms of systemic brucellosis."
      explanation: >-
        The endemic-area retrospective series supports testicular and epididymal
        involvement as focal genitourinary disease.
  - target: Chronic splenic myeloid reservoir formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hematogenous infection can reach reticuloendothelial organs; susceptible
      mice then expose splenic B. melitensis myeloid reservoirs as a model of
      chronic persistence.
    evidence:
    - reference: PMID:26376185
      reference_title: "In Situ Characterization of Splenic Brucella melitensis Reservoir Cells during the Chronic Phase of Infection in Susceptible Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This characterization of B. melitensis reservoir cells could provide a better understanding of Brucella persistence in the host and lead to the design of more efficient therapeutic strategies."
      explanation: >-
        The B. melitensis mouse study supports the spleen as a durably colonized
        reticuloendothelial site during chronic model-organism infection.
- name: Osteoarticular seeding
  description: >-
    Focal osteoarticular infection affects peripheral joints, sacroiliac joints,
    or vertebral structures after dissemination.
  biological_scale: ORGANISM
  downstream:
  - target: Arthritis
    description: Peripheral joint infection may manifest as arthritis.
    evidence:
    - reference: PMID:23236528
      reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Arthralgia was common, affecting 65% patients overall, whereas arthritis affected only 26% patients"
      explanation: The systematic review found arthritis in 26% of brucellosis cases.
  - target: Sacroiliitis
    description: Sacroiliac focal infection manifests as sacroiliitis.
    evidence:
    - reference: PMID:23236528
      reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, spondylitis and sacroiliitis were detected in 12–36% adults"
      explanation: The systematic review documents sacroiliitis as an adult focal manifestation.
  - target: Spondylitis
    description: Vertebral focal infection manifests as spondylitis.
    evidence:
    - reference: PMID:23236528
      reference_title: "Clinical manifestations of human brucellosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Spondylitis 1 18 (1; 28)* 6 12 (7, 19) 9 11 (6; 18) 16 12 (8; 17)"
      explanation: The systematic review found spondylitis in 12% of all-age cases.
- name: Cardiac valve seeding
  description: Focal Brucella infection of cardiac valves produces endocarditis.
  biological_scale: ORGANISM
  downstream:
  - target: Endocarditis
    description: Valvular infection manifests as endocarditis.
    evidence:
    - reference: PMID:11910696
      reference_title: "[Brucella endocarditis of native valves. Report of 3 cases]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Brucella endocarditis is a rare but a serious complication of human brucellosis."
      explanation: The native-valve case series documents endocarditis as rare but severe focal disease.
- name: Genitourinary seeding
  description: Focal genitourinary infection affects the epididymis and testis.
  biological_scale: ORGANISM
  downstream:
  - target: Epididymo-orchitis
    description: Epididymal and testicular infection manifests as epididymo-orchitis.
    evidence:
    - reference: PMID:40350681
      reference_title: "Clinical and therapeutic insights into brucellar epididymo-orchitis: a retrospective analysis in a brucellosis endemic area."

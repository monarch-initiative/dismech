    snippet: "A wide FS is robustly predictive of a high risk for mortality, cardiac dysfunction, brain parenchymal abnormalities at birth, and short- and intermediate-term neurodevelopmental delay."
    explanation: >-
      Directly supports the fetal MRI finding and its prognostic rather than

treatments:
- name: Endovascular Embolization
  description: >-
    The primary treatment closes arterial feeders or the venous side of the shunt
    with liquid embolic material and/or coils, often across staged procedures.
    Timing balances neonatal cardiopulmonary instability against procedural risk.
    Outcomes have improved, but long-term results remain worse than medium-term
    follow-up implies.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Endovascular embolization
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_mechanisms:
  - target: Persistent Embryonic Arteriovenous Shunt
    treatment_effect: INHIBITS
    description: >-
      Occludes the arteriovenous connection directly, which is why it addresses
      the cardiac, venous and steal consequences together rather than one at a
      time.
    evidence:
    - reference: PMID:38747605
      reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Current methods for closing the AV shunt rely on percutaneous transarterial or transvenous access with microcatheters, followed by vascular occlusion with liquid embolics and/or coils."
      explanation: >-
        Directly supports the procedure's route and mechanism at the shunt.
    - reference: PMID:35547535
      reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While endovascular embolization has clearly improved the outcome, several recent case series (7, 8) have shown that the long-term prognosis in this malformation is more severe than the usually described medium-term prognosis (9-11)."
      explanation: >-
        States both halves honestly: embolization has clearly improved outcome,
        and long-term prognosis is nonetheless more severe than medium-term
        reports suggest.
  evidence:
  - reference: PMID:38747605
    reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endovascular embolization represents the primary treatment but typically requires several procedures, staged over months to years."
    explanation: >-
      Establishes embolization as primary treatment and documents the commonly
      staged treatment course.
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term outcome of patients with VGAM appears to be less favourable than outcome described at the short- and medium-term, even in the absence of encephalomalacia at birth."
    explanation: >-
      PARTIAL and recorded as a limit on the treatment rather than support for it.
      Survivors of successful treatment still do worse than earlier follow-up
      predicted, which is what a family needs told.
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is lethal in almost 100% of cases if left untreated."
    explanation: >-
      The comparator that gives the previous caveat its proportion. Long-term
      outcomes after treatment are worse than medium-term follow-up implies, and
      the alternative is near-certain death.
- name: Long-term neurodevelopmental rehabilitation
  description: >-
    School-age survivors can have neuropsychological disorders that affect
    learning even when earlier outcome was classified as good, and may require

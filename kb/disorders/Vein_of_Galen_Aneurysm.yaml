progression:
- phase: Long-term outcome after treatment
  notes: >-
    School-age follow-up shows that survival and an initially reassuring scan do
    not guarantee normal function. In a VOGM-specific cohort, 33 of 52 patients
    were alive at long-term assessment; 14 of the 33 survivors had a poor outcome,
    and neurodevelopmental alterations were common even among those classified as
    having a good outcome. Results were less favorable than short- and
    medium-term reports, including among children without encephalomalacia at
    birth.
  evidence:
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the long-term evaluation time-point, 33 patients were alive and 19 patients had died."
    explanation: >-
      Gives the VOGM-specific long-term survival count.
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among survivors, 19 had a good outcome with normal schooling and 14 had a poor outcome."
    explanation: >-
      Supports the outcome split stated for the 33 survivors.
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term outcome of patients with VGAM appears to be less favourable than outcome described at the short- and medium-term, even in the absence of encephalomalacia at birth."
    explanation: >-
      The counterweight: later assessment is worse than earlier assessment, and a
      normal neonatal brain does not exclude it.
discussions:
- discussion_id: vogm_second_hit_requirement
  prompt: >-
    Does vein of Galen malformation require a somatic second hit on top of an
    inherited variant, and if so what and where is it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated Endothelial Developmental Signaling
  rationale: >-
    Mice carrying a patient-derived EPHB4 kinase-domain variant developed the
    angiogenic defect only when a second-hit allele was present. That single
    conditional clause reconciles inherited susceptibility alleles with a disease
    that often appears only once in a family. If a second event is required, the
    identity of that event is unknown in humans. It could
    be a somatic mutation confined to the developing cerebral endothelium, in
    which case it would be invisible to blood-derived sequencing and would explain
    both the non-penetrant carrier parents and the focal, single-lesion anatomy of
    a disease whose germline variant is present in every cell. It could equally be
    a second germline variant elsewhere, or a non-genetic developmental
    contingency. Endoluminal coil sampling has now recovered lesional endothelial
    cells safely enough for single-cell RNA sequencing, but the published study
    presents somatic and second-hit DNA analysis as future work rather than a
    completed result. The biological question therefore remains open while the
    sampling barrier has become experimentally tractable.
  evidence:
  - reference: PMID:38747605
    reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No periprocedural complications related to ETS were encountered, and no subjects were lost to follow-up."
    explanation: >-
      Supports feasibility and observed procedural safety of lesion-cell sampling
      in the six-patient cohort, not the unperformed second-hit analysis.
  - reference: PMID:38747605
    reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigrees were assembled to eventually compare germline DNA against EC's retrieved by ETS to identify somatic and second-hit mutations."
    explanation: >-
      The word "eventually" makes the evidence boundary explicit: matched DNA
      analysis was planned, not reported as a positive finding.
  proposed_experiments:
  - experiment_id: vogm_lesion_somatic_sequencing
    name: Matched deep DNA sequencing of coil-sampled lesional endothelium and blood
    description: >-
      During clinically indicated embolization, use endoluminal coils to obtain
      lesional endothelial cells and sequence their DNA against matched blood from
      patients carrying a germline EPHB4 or RASA1 variant, with methods validated
      for picogram input and low variant fractions. Recurrent second hits present
      in lesion and absent from blood would support the two-hit model in humans;
      adequate negative results across a series would weaken it. Single-cell RNA
      clusters alone cannot adjudicate this DNA-level question.
    evidence:
    - reference: PMID:38747605
      reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All 6 families that were solicited to participate in the study agreed and provided informed consent. ETS was performed a total of 10 times (owing to staged procedures involving the same subject), in 3 arteries and 7 veins."
      explanation: >-
        Demonstrates repeated in situ sampling in the exact patient population and
        therefore supports feasibility of the proposed matched-DNA experiment.
- discussion_id: vogm_long_term_deterioration
  prompt: >-
    Why do children with vein of Galen malformation do worse at school age than
    medium-term follow-up predicts, even when no encephalomalacia was present at
    birth?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebral Arterial Steal
  - pathophysiology#Cerebral Venous Hypertension
  rationale: >-
    The outcome literature states plainly that long-term results are less
    favourable than short- and medium-term assessment suggests, and that this
    holds even in the absence of encephalomalacia at birth. That combination is
    the interesting part: a normal-looking neonatal brain does not guarantee a
    normal-functioning school-age child. Several explanations are compatible with
    it and none is established. Chronic hypoperfusion and venous hypertension may
    injure developing tissue in ways that structural imaging does not show; the
    cognitive demands that reveal impairment may simply not exist in infancy; or
    residual shunting after treatment may continue to affect a brain that is
    still developing. Distinguishing them matters directly for what families are
    told at discharge and for how long children are followed.
  proposed_experiments:
  - experiment_id: vogm_school_age_imaging_correlation
    name: School-age neurocognitive outcome against neonatal and follow-up imaging
    description: >-
      Follow a treated cohort to school age with formal neurocognitive assessment
      and serial imaging, testing whether later impairment is predicted by
      residual shunt, by interval imaging change, or by neither. If neither
      predicts it, the injury is occurring below the resolution of structural
      imaging, which is itself the finding.
differential_diagnoses:
- name: Pial arteriovenous fistula draining into an enlarged vein of Galen
  description: >-
    The critical differential, and the reason the distinction is curated rather
    than assumed. A pial arteriovenous fistula or malformation may drain into a
    secondarily dilated vein of Galen and look similar on imaging, but it is a
    different lesion with different anatomy, different genetics, and a different
    risk profile for intervention. Calling it a vein of Galen malformation would
    import the wrong treatment expectations.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Misclassifications of AVFs or arteriovenous malformations that drain into a dilated vein of Galen as true VGAMs are also frequent"
    explanation: >-
      Directly identifies the recurrent diagnostic misclassification represented
      by this differential.
- name: Dural arteriovenous fistula of infancy
  description: >-
    Another high-flow shunt presenting with cardiac failure and venous
    hypertension in infancy, arising in dural rather than pial or choroidal
    vessels. Distinguished angiographically by the feeding vessels and the site
    of the shunt.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the shunt is located in the torcular, and the arterial feeders belong to the dural branches, suggesting a dural sinus malformation."
    explanation: >-
      A case-level example shows the angiographic features that redirect a
      presumed VOGM diagnosis to a dural lesion; graded PARTIAL because it is not
      a cohort-wide diagnostic study.

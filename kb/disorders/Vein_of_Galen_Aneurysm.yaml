inheritance:
- name: Autosomal dominant susceptibility in a gene-associated subset
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    This inheritance pattern applies to the subset associated with genes such as
    EPHB4, RASA1, and ACVRL1, not to every person with VOGM. A heterozygous allele
    can be transmitted in an autosomal dominant manner, but unaffected carriers
    demonstrate incomplete penetrance and variable expressivity; Mendelian allele
    transmission must not be presented as the child's probability of developing
    VOGM. That disease recurrence risk is not quantified. The EPHB4 mouse work
    supports a possible second-hit mechanism, but it does not prove that every
    human lesion requires a somatic second event.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings together show incomplete penetrance and variable expressivity of transmitted variants in the related CM-AVM genes RASA1 and EPHB4 in VOGM."
    explanation: >-
      Direct human family evidence that transmitted EPHB4 and RASA1 variants do
      not determine the focal lesion with complete penetrance.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: 'Mice expressing a VOGM-specific EPHB4 kinase-domain missense variant (Phe867Leu) exhibited disrupted developmental angiogenesis and impaired hierarchical development of arterial-capillary-venous networks, but only in the presence of a "second-hit" allele.'
    explanation: >-
      PARTIAL and deliberately so. This is a mouse result offered as a candidate
      explanation for incomplete penetrance in humans, not a demonstration that
      human non-penetrance is caused by a second hit.
diagnosis:
- name: Prenatal ultrasonography
  diagnosis_term:
    preferred_term: Fetal Ultrasound Imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  description: >-
    Prenatal ultrasound can reveal deep cerebral arteriovenous shunts when the
    venous drainage is markedly dilated. Cortical cerebral fistulas can be more
    difficult to identify with this modality.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A likely reason is that most AV-shunts caused by HHT-associated or RASA1 variants are related to cortical cerebral fistulas, difficult to identify in prenatal imaging, especially by ultrasound, compared to deep cerebral AV-shunts with large dilatations of the venous drainage."
    explanation: >-
      Supports prenatal ultrasound as an imaging modality for the deep,
      dilated-venous-drainage pattern while preserving the source's contrast with
      less conspicuous cortical fistulas.
- name: Fetal magnetic resonance imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Establishes the prenatal diagnosis, evaluates the brain and venous anatomy,
    and measures the falcine sinus. Falcine-sinus width is a prognostic marker,
    not a standalone definition of the lesion.
  evidence:
  - reference: PMID:40171650
    reference_title: "Mediolateral Diameter of the Falcine Sinus as a Predictor of Clinical Outcomes in Fetal Vein of Galen Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 59 patients (55% male and 45% female) diagnosed with vein of Galen malformation via fetal magnetic resonance imaging from 2002 to 2024 were included."
    explanation: >-
      Directly documents fetal MRI as the modality by which this clinical cohort
      was diagnosed.
- name: Fetal echocardiography
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Assesses the fetal haemodynamic burden of the shunt by measuring cardiac
    output and its change around intervention. It complements neurovascular
    imaging rather than defining the cerebral anatomy.
  evidence:
  - reference: PMID:40788723
    reference_title: "Early Results of Fetal Embolization for Vein of Galen Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetal echocardiography showed a mean 33.4% reduction (range, 16%-46%) in cardiac output."
    explanation: >-
      Directly documents fetal echocardiography measuring cardiac output in the
      VOGM intervention cohort.
- name: Magnetic resonance angiography
  diagnosis_term:
    preferred_term: Magnetic Resonance Angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  description: >-
    Defines the shunt and deep venous drainage anatomy needed to distinguish a
    true VOGM from a fistula that drains into an enlarged mature vein of Galen.
    The defining finding is disconnection from normal deep cerebral venous
    drainage, which instead uses alternative routes.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A true VGAM corresponded to a choroidal arteriovenous shunt draining directly into the embryonic precursor of the vein of Galen with normal deep cerebral venous drainage via alternative venous delivery routes, and without identifiable connection between the vascular malformation and the deep venous drainage on angiography, or on MRI or MRA."
    explanation: >-
      Directly states the vascular and deep-venous anatomy that MRI or MRA can
      demonstrate to classify a genuine VOGM.
- name: Catheter angiography
  diagnosis_term:
    preferred_term: Angiography
    term:
      id: NCIT:C190556
      label: Angiography
  description: >-
    Confirms the direct shunt and delineates arterial feeders and venous drainage
    before endovascular treatment. Angiographic anatomy also distinguishes a true
    malformation, whose deep cerebral veins use alternative drainage routes, from
    a pial or choroidal fistula that drains into an enlarged mature vein of Galen.
  evidence:
  - reference: PMID:38747605
    reference_title: "Endoluminal Biopsy for Vein of Galen Malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis was confirmed by catheter angiography."
    explanation: >-
      Direct statement that catheter angiography confirmed VOGM in the prospective
      endoluminal-sampling cohort.
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A true VGAM corresponded to a choroidal arteriovenous shunt draining directly into the embryonic precursor of the vein of Galen with normal deep cerebral venous drainage via alternative venous delivery routes, and without identifiable connection between the vascular malformation and the deep venous drainage on angiography, or on MRI or MRA."
    explanation: >-
      Defines the anatomy that angiography or MR angiography must establish to
      separate a genuine VOGM from a fistula draining into the mature vein.
- name: Bicêtre score assessment
  diagnosis_term:
    preferred_term: Bicêtre neonatal evaluation score
  description: >-
    A clinical assessment used to judge suitability for intervention in
    neonates and infants with VOGM. The cited six-patient cohort reports that the
    score supported intervention, but does not supply score components,
    thresholds, or independent performance validation; none are inferred here.
  evidence:

- name: Macrocephaly
  category: Neurological
  description: >-
    Enlargement of the head, driven both by hydrocephalus and by the mass of the
    dilated venous pouch itself. It is one of the two commonest features at
    diagnosis and, in an infant presenting outside the neonatal cardiac window,
    often the finding that prompts imaging.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  frequency: FREQUENT

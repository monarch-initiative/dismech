genetic:
- name: EPHB4
  gene_term:
    preferred_term: EPHB4
    term:
      id: hgnc:3395
      label: EPHB4
  relationship_type: CAUSATIVE
  notes: >-
    Ephrin receptor B4, the most prominently implicated gene. Heterozygous
    loss-of-function variants, including de novo frameshift and inherited splice
    and missense changes, were found in a minority of a patient cohort, and
    damaging transmitted variants were enriched in the larger exome analysis. The
    functional case is unusually strong for a developmental vascular
    malformation, because the disease-associated alleles fail to rescue a
    vascular defect that wild-type protein corrects.
  evidence:
  - reference: PMID:29444212
    reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a cohort of 51 patients, we found five affected individuals with heterozygous mutations in EPHB4 including de novo frameshift"
    explanation: >-
      Reports the variant findings in a defined cohort, including a de novo
      frameshift, which is the strongest form of genetic evidence available in a
      sporadic malformation.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rare, damaging transmitted variants were enriched in Ephrin receptor-B4 (EPHB4) (17.5-fold, p = 1.22 x 10-5), which cooperates with p120 RasGAP to regulate vascular development."
    explanation: >-
      Quantifies the enrichment rather than asserting it, and names the
      functional relationship with RASA1 that makes the two genes one mechanism
      rather than two coincidences.
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "on the contrary, EPHB4 variants were only seen in genuine vein of Galen aneurysmal malformation."
    explanation: >-
      A genotype-phenotype distinction with direct management consequences: an
      EPHB4 variant argues for a true malformation rather than a pial fistula
      draining into the vein of Galen, and the two are treated differently.
  case_fractions:
  - population: Children with cerebral high-flow shunts, four-centre cohort
    case_fraction_percent: 8.0
    cohort_size: 115
    notes: >-
      Second commonest gene in the cohort. Note the denominator is all cerebral
      high-flow shunts, not vein of Galen malformation specifically, and EPHB4
      variants in this series fell only in the true malformation, so the share
      within genuine cases is higher than 8 per cent.
    evidence:
    - reference: PMID:35547535
      reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most frequent variant affected was the RASA1 gene (25%) followed by EPHB4 (8%) and the HHT-associated genes (5%)."
      explanation: >-
        Gives the per-gene shares in the 115-child cohort.
- name: RASA1
  gene_term:
    preferred_term: RASA1
    term:
      id: hgnc:9871
      label: RASA1
  relationship_type: CAUSATIVE
  notes: >-
    RAS p21 protein activator 1, a negative regulator of Ras signalling and a
    recognised cause of capillary malformation-arteriovenous malformation
    syndrome. In cerebral high-flow shunts its variants are not confined to one
    lesion type, which supports a shared upstream mechanism across the shunt
    spectrum rather than a lesion-specific genotype.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RASA1 variants were identified in all types of shunts."
    explanation: >-
      Establishes that RASA1 variation spans shunt types, which is the basis for
      treating endothelial Ras dysregulation as the shared upstream node rather
      than assigning genotypes to lesion subtypes.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found the Ras suppressor p120 RasGAP (RASA1) harbored a genome-wide significant burden of loss-of-function de novo variants (2042.5-fold, p = 4.79 x 10-7)."
    explanation: >-
      The single strongest genetic statement in this disease. A two-thousand-fold
      de novo burden reaching genome-wide significance is not a candidate-gene
      association; it is close to the ceiling of what exome burden testing can
      show.
  case_fractions:

    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Salient features at diagnosis included developmental delay (54%), macrocephaly (48%), hydrocephalus (48%), prominent face and/or scalp vasculature (45%), cutaneous vascular lesions (22%), and congestive heart failure (40%)."
    explanation: >-
      Developmental delay in 54 per cent at diagnosis, the commonest single

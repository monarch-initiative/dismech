name: Vein of Galen malformation
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Vein of Galen malformation is a congenital high-flow arteriovenous shunt in
  which primitive choroidal or subependymal cerebral arteries connect directly
  to the median prosencephalic vein of Markowski without an intervening capillary
  network. The traditional name "aneurysm" is misleading: the dilated venous
  collector is the embryonic precursor of the vein of Galen rather than an
  aneurysmal mature vein. The lesion is thought to arise during the sixth to
  eleventh weeks of fetal development.

  The low-resistance shunt can divert a large share of cardiac output, producing
  high-output cardiac failure and pulmonary hypertension, while arterial steal
  and cerebral venous hypertension contribute to brain injury, hydrocephalus,
  seizures, and later neurodevelopmental impairment. Cardiac and neurological
  consequences are therefore parallel expressions of the same high-flow lesion.

  Human genetic and functional studies implicate dysregulated signaling in
  developing endothelium. Loss of RASA1-mediated Ras suppression and impaired
  EPHB4 kinase-dependent signaling are compatible with excessive downstream
  Ras/ERK/MAPK activity rather than a simple failure of Ras signaling; other
  vascular-development genes have different levels of evidence. These changes
  disturb angiogenesis and arterial-venous specification before the anatomical
  shunt and its hemodynamic consequences emerge.

  A caution that the outcome literature makes explicit: long-term results are
  worse than medium-term follow-up suggests, even in children who had no
  encephalomalacia at birth.
category: Congenital
disease_term:
  preferred_term: Vein of Galen malformation
  term:
    id: MONDO:0015196
    label: vein of Galen aneurysm
synonyms:
- Vein of Galen aneurysmal malformation
- VGAM
- VOGM
- Vein of Galen aneurysm
notes: >-
  Nomenclature, which matters here more than usual. The disease name contains two
  inaccuracies that shape how it is misunderstood: it is not an aneurysm, and the
  dilated vessel in the true malformation is the embryonic median prosencephalic
  vein of Markowski rather than the mature vein of Galen. The MONDO label is
  retained as the disease term because that is the ontology's identifier for the
  concept, but the description and nodes use the anatomically accurate account.

  A scope distinction that changes management. True vein of Galen aneurysmal
  malformation must be separated from a pial arteriovenous fistula or
  arteriovenous malformation that merely drains into a secondarily enlarged vein
  of Galen. The two look similar on imaging and are not the same lesion: their
  anatomy, their genetics, and the risk profile of treating them differ. That
  distinction is curated as a differential rather than left implicit.

  Provider note. Built from an Edison Falcon deep-research report. Falcon cites
  by DOI and internal corpus keys rather than PMIDs, so its cited DOIs were
  resolved to PubMed records and all evidence verified against those. Every
  ontology identifier was verified independently against the ontologies rather
  than taken from the report, following identifier errors found in other entries
  built from this provider in the same batch.

  Dataset audit. The exome, developmental-cerebrovasculature transcriptomic, and
  endoluminal-biopsy studies support mechanisms in this entry, but no stable
  public accession for a VOGM-specific reusable dataset was verified. Publications
  are therefore cited as evidence without fabricating a `datasets` record.

  Population epidemiology audit. No population-based incidence estimate is
  asserted because none could be verified in the cached sources reviewed for
  this entry. A previously curated 30% figure described VOGM as a proportion of
  pediatric vascular malformations, not population prevalence or incidence, and
  was removed rather than relabelled as a population measure.
pathophysiology:
- name: Dysregulated Endothelial Developmental Signaling
  biological_scale: CELLULAR
  description: >-
    VOGM-associated variants converge on signaling programs active in developing
    cerebral endothelium, but their effects are not accurately described as a
    uniform loss of Ras signaling. RASA1 is a Ras suppressor, EPHB4 kinase-domain
    variants lack detectable phosphotyrosine and impair kinase-dependent control,
    and the PTPN11 variant reported in one proband constitutively activates Ras
    signaling. ACVRL1, NOTCH1, and ITGB1 implicate additional endothelial
    developmental pathways. Integrated exome and single-cell transcriptomic
    analysis places this susceptibility in developing endothelial cells.
  genes:
  - preferred_term: EPHB4
    term:
      id: hgnc:3395
      label: EPHB4
  - preferred_term: RASA1
    term:
      id: hgnc:9871
      label: RASA1
  - preferred_term: ACVRL1
    term:
      id: hgnc:175
      label: ACVRL1
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  - preferred_term: ITGB1
    term:
      id: hgnc:6153
      label: ITGB1
  - preferred_term: PTPN11
    term:
      id: hgnc:9644
      label: PTPN11
  cell_types:
  - preferred_term: endothelial cell of the developing cerebral vasculature
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed an integrated analysis of 310 VOGM proband-family exomes and 336,326 human cerebrovasculature single-cell transcriptomes"
    explanation: >-
      Establishes the scale and design of the analysis that identified the
      signalling regulators and localised them to a cell type.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrative genomic analysis defined developing endothelial cells as a likely spatio-temporal locus of VOGM pathophysiology."
    explanation: >-
      States the conclusion this node is built on: the pathophysiology is located
      in developing endothelial cells, a cell type at a time, rather than in an
      anatomical structure.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data suggest that genetic dysregulation of Ras signaling is an important driver of VOGM pathogenesis"
    explanation: >-
      Supports dysregulation rather than the incorrect claim of uniformly reduced
      Ras signaling.
  downstream:
  - target: Impaired Developmental Angiogenesis and Arteriovenous Specification
    causal_link_type: DIRECT
    description: >-
      Dysregulated signaling in fetal endothelium impairs remodeling of primitive
      vascular plexuses and development of the arterial-capillary-venous hierarchy.
  - target: Cutaneous vascular lesions
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the gene-associated subset, pleiotropic endothelial susceptibility can
      also manifest as capillary malformations or other cutaneous vascular
      lesions; the variant-specific intermediates and relationship to the focal
      cerebral lesion remain unresolved.
- name: Impaired Developmental Angiogenesis and Arteriovenous Specification
  biological_scale: TISSUE
  description: >-
    Failure to remodel primitive vascular plexuses through sprouting angiogenesis
    disrupts the normal arterial-capillary-venous hierarchy. This separates the
    molecular signaling abnormality from the later anatomical lesion: the
    developmental process is impaired before a focal artery-to-vein connection
    persists.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Pathway analysis showed VOGM genes are enriched in growth-factor-regulated, tyrosine receptor kinase-associated signaling, which regulates vasculogenesis, angiogenesis, and arterio-venous specification"
    explanation: >-
      Links the human genetic signal to the specific developmental vascular
      processes represented by this node.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impaired remodeling of primitive vascular plexuses by VEGF-regulated sprouting angiogenesis, a process required for development of hierarchical arterial-capillary-venous networks"
    explanation: >-
      Directly identifies the developmental process disrupted by the
      patient-derived EPHB4 kinase-domain variant in fetal endothelial cells.
  downstream:
  - target: Persistent Embryonic Arteriovenous Shunt
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Failure of angiogenesis and arteriovenous specification provides the
      developmental context for a direct shunt to persist, although the steps
      that make the human lesion focal remain unresolved.
- name: Persistent Embryonic Arteriovenous Shunt
  biological_scale: TISSUE
  description: >-
    The anatomical lesion. Primitive choroidal or subependymal arteries connect
    directly to the median prosencephalic vein of Markowski without an
    intervening capillary network. The embryonic venous collector persists and
    dilates under high flow. The resulting low-resistance circuit produces the
    cardiac, arterial-steal, and venous-hypertension branches modeled downstream.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vein of Galen malformations (VOGMs), the most common and severe arteriovenous malformations (AVMs) of the human neonatal brain11,12, directly connect primitive choroidal or subependymal cerebral arteries to the MPV without an intervening capillary network."
    explanation: >-
      Defines the arterial feeders, embryonic venous collector, and absent
      capillary network that distinguish the lesion.
  - reference: PMID:36588762
    reference_title: "Recurrent Vein of Galen Aneurysmal Malformation as a Presentation of Hereditary Hemorrhagic Telangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The congenital malformation develops during weeks 6-11 of fetal development."
    explanation: >-
      Gives the developmental window in which the shunt forms, which is what makes
      this an embryonic persistence rather than an acquired lesion.
  - reference: PMID:36588762
    reference_title: "Recurrent Vein of Galen Aneurysmal Malformation as a Presentation of Hereditary Hemorrhagic Telangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vein of Galen malformation (VGM) results from an aneurysmal aberration with an arteriovenous shunting of blood and is the most frequent arteriovenous malformation in infants and fetuses."
    explanation: >-
      States the arteriovenous shunting that defines the lesion and its standing
      as the commonest such malformation in this age group.
  downstream:
  - target: High-Output Circulatory Overload
    causal_link_type: DIRECT
    description: >-
      A low-resistance arteriovenous channel returns a large volume to the right
      heart without perfusing tissue.
  - target: Cerebral Venous Hypertension
    causal_link_type: DIRECT
    description: >-
      Arterial pressure transmitted to the venous side raises cerebral venous
      pressure.
  - target: Cerebral Arterial Steal
    causal_link_type: DIRECT
    description: >-
      Flow preferentially entering the low-resistance shunt is flow not delivered
      to brain parenchyma.
- name: High-Output Circulatory Overload
  biological_scale: ORGANISM
  description: >-
    The dominant threat to the newborn. A large fraction of cardiac output passes
    through the low-resistance shunt and returns rapidly to the right heart, which
    raises venous return, cardiac workload, and pulmonary blood flow. The heart
    may be structurally normal yet unable to sustain this volume demand.
  evidence:
  - reference: PMID:36588762
    reference_title: "Recurrent Vein of Galen Aneurysmal Malformation as a Presentation of Hereditary Hemorrhagic Telangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants often die from high-output congestive heart failure."
    explanation: >-
      States both the mechanism and that it is the usual cause of death, which is
      why this node rather than the neurological arm dominates neonatal
      management.
  downstream:
  - target: Congestive heart failure
    causal_link_type: DIRECT
    description: >-
      The clinical syndrome, presenting in the neonatal period.
  - target: Pulmonary arterial hypertension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through sustained pulmonary overcirculation.
  - target: Hydrops fetalis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe fetal high-output cardiac failure can progress through venous
      congestion to generalized edema and effusions. The phenotype evidence is
      case-level and establishes occurrence, not frequency.
  - target: Cardiomegaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained fetal volume overload can produce dilation of the cardiac
      chambers and outflow tracts. The phenotype evidence is case-level and does
      not establish how often this occurs.
  - target: Tricuspid regurgitation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Modelled through the chamber dilation and haemodynamic strain of fetal
      high-output failure. The cited case documents the finding but does not by
      itself establish its frequency or an invariant causal sequence.
- name: Cerebral Venous Hypertension
  biological_scale: TISSUE
  description: >-
    Raised pressure throughout the cerebral venous system, transmitted from the
    arterial side across the shunt. It impairs cerebrospinal fluid absorption and
    produces hydrocephalus, and contributes to the parenchymal injury that
    determines long-term neurological outcome.
  notes: >-
    A limit on what the cited sources actually demonstrate, kept explicit. That
    venous hypertension exists locoregionally and injures tissue is directly
    stated in the literature quoted below. The specific route to hydrocephalus,
    impaired cerebrospinal fluid absorption against a raised venous pressure, is
    the conventional physiological account and is not itself demonstrated by any
    source cited in this entry; the downstream edge is graded accordingly.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Locoregional venous hypertension associated with cerebral arteriovenous malformations is likely to lead to an epileptic seizure or neurological deficit due to vascular steal or chronic venous ischemia in all types of malformations."
    explanation: >-
      States the mechanism directly rather than listing it: venous hypertension
      around the malformation injures brain through steal and chronic venous
      ischaemia. The authors hedge with "is likely to", and that hedge is left
      standing rather than sharpened.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Salient features at diagnosis included developmental delay (54%), macrocephaly (48%), hydrocephalus (48%), prominent face and/or scalp vasculature (45%), cutaneous vascular lesions (22%), and congestive heart failure (40%)."
    explanation: >-
      Puts hydrocephalus at roughly half of probands at diagnosis, which is what
      makes this arm worth modelling separately from the cardiac one.
  downstream:
  - target: Hydrocephalus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Modelled provisionally as predominantly impaired cerebrospinal fluid
      absorption under raised venous pressure. Obstruction by the dilated venous
      pouch, haemorrhage-related obstruction, or ex-vacuo ventricular enlargement
      after parenchymal injury may instead or additionally contribute in an
      individual patient.
  - target: Macrocephaly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through hydrocephalus and the mass of the dilated venous pouch in a
      skull whose sutures have not yet fused. The compliance of the infant skull
      is what makes this a visible sign rather than a pressure crisis.
  - target: Prominent scalp veins
    causal_link_type: DIRECT
    description: >-
      Raised pressure in the cerebral venous system is decompressed through
      emissary veins into the scalp, so the collateral route becomes visible on
      the surface. The sign is the venous hypertension made external.
  - target: Intracranial hemorrhage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A recognised event in this disease rather than a demonstrated consequence
      of this node. Both raised venous pressure and the fragility of an
      abnormally constructed vasculature are plausible routes, and the cited
      evidence describes haemorrhage in individual patients without establishing
      which. The intermediates are marked unknown for that reason.
- name: Cerebral Arterial Steal
  biological_scale: TISSUE
  description: >-
    Blood entering the low-resistance shunt is blood not delivered to brain
    parenchyma, producing chronic hypoperfusion of developing tissue. Together
    with venous hypertension this is the route to the parenchymal injury,
    seizures, and developmental impairment that dominate outcome in survivors of
    the cardiac phase.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Locoregional venous hypertension associated with cerebral arteriovenous malformations is likely to lead to an epileptic seizure or neurological deficit due to vascular steal or chronic venous ischemia in all types of malformations."
    explanation: >-
      Names vascular steal explicitly as a route from the malformation to
      seizure and neurological deficit, which is exactly the claim this node
      makes. The authors' own hedge is preserved.
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our case series confirms the higher risk of bleeding in AVFs related to HHT-associated variants (p = 0.034) and the risk of neurological deficit or seizure at onset (p < 0.0001)"
    explanation: >-
      Quantifies neurological deficit and seizure as presenting events in these
      shunts, giving the node a measured clinical consequence rather than an
      inferred one.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through chronic hypoperfusion and parenchymal injury of the
      developing brain.
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Consequent on cortical injury.
phenotypes:
- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    High-output cardiac failure presenting in the neonatal period, and the
    commonest cause of death. The heart is structurally normal; it is failing
    against a volume load imposed by a lesion in the head.
  phenotype_term:
    preferred_term: High-output congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  frequency: FREQUENT
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Salient features at diagnosis included developmental delay (54%), macrocephaly (48%), hydrocephalus (48%), prominent face and/or scalp vasculature (45%), cutaneous vascular lesions (22%), and congestive heart failure (40%)."
    explanation: >-
      Gives 40 per cent of 114 probands at diagnosis, which supports the
      FREQUENT band. Note this counts the feature at diagnosis in a cohort that
      reached endovascular treatment, so it will understate the burden among
      neonates who present in extremis.
  - reference: PMID:36588762
    reference_title: "Recurrent Vein of Galen Aneurysmal Malformation as a Presentation of Hereditary Hemorrhagic Telangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants often die from high-output congestive heart failure."
    explanation: >-
      Establishes both the phenotype and its lethality in infancy.
- name: Pulmonary arterial hypertension
  category: Cardiovascular
  description: >-
    Raised pulmonary arterial pressure from sustained overcirculation, compounding
    the cardiac failure.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  evidence:
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Risk of postnatal death was associated with severe neonatal cardiac failure (p=0.007) or isosystemic or suprasystemic pulmonary hypertension (p=0.014)."
    explanation: >-
      Directly reports pulmonary hypertension and its association with postnatal
      mortality in a long-term cohort.
- name: Hydrops fetalis
  category: Prenatal
  description: >-
    Generalized fetal edema with effusions and ascites can accompany severe
    high-output cardiac failure from the cerebral shunt. Evidence here is a
    directly observed VOGM case; no frequency is inferred from it.
  phenotype_term:
    preferred_term: Hydrops fetalis
    term:
      id: HP:0001789
      label: Hydrops fetalis
  evidence:
  - reference: PMID:18299642
    reference_title: "Nonimmune hydrops fetalis secondary to aneurysm of the vein of Galen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An ultrasonographic scan repeated in our institution confirmed the presence of hydrops fetalis with generalized skin edema, mild pericardial effusion and ascites."
    explanation: >-
      Direct case-level evidence of hydrops in a fetus with the malformation. It
      establishes occurrence without supporting a population frequency.
- name: Cardiomegaly
  category: Cardiovascular
  description: >-
    Fetal cardiac enlargement with dilation of all four chambers and the outflow
    tracts, observed during high-output failure despite a structurally normal
    heart. The evidence is case-level, so no frequency is assigned.
  phenotype_term:
    preferred_term: Cardiomegaly
    term:
      id: HP:0001640
      label: Cardiomegaly
  evidence:
  - reference: PMID:18299642
    reference_title: "Nonimmune hydrops fetalis secondary to aneurysm of the vein of Galen."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sonographic examination also revealed cardiomegaly with dilatation of all the four chambers and outflow tracts, tricuspid regurgitation and mild pericardial effusion."
    explanation: >-
      Directly documents fetal cardiomegaly and chamber dilation in one VOGM
      case; it does not support a frequency estimate.
- name: Tricuspid regurgitation
  category: Cardiovascular
  description: >-
    Fetal tricuspid regurgitation can accompany chamber dilation and high-output

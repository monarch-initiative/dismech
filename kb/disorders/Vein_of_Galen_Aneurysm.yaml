genetic:
- name: EPHB4
  gene_term:
    preferred_term: EPHB4
    term:
      id: hgnc:3395
      label: EPHB4
  relationship_type: CAUSATIVE
  notes: >-
    Ephrin receptor B4, the most prominently implicated gene. Heterozygous
    loss-of-function variants, including de novo frameshift and inherited splice
    and missense changes, were found in a minority of a patient cohort, and
    damaging transmitted variants were enriched in the larger exome analysis. The
    functional case is unusually strong for a developmental vascular
    malformation, because the disease-associated alleles fail to rescue a
    vascular defect that wild-type protein corrects.
  evidence:
  - reference: PMID:29444212
    reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a cohort of 51 patients, we found five affected individuals with heterozygous mutations in EPHB4 including de novo frameshift"
    explanation: >-
      Reports the variant findings in a defined cohort, including a de novo
      frameshift, which is the strongest form of genetic evidence available in a
      sporadic malformation.
- name: RASA1
  gene_term:
    preferred_term: RASA1
    term:
      id: hgnc:9871
      label: RASA1
  relationship_type: CAUSATIVE
  notes: >-
    RAS p21 protein activator 1, a negative regulator of Ras signalling and a
    recognised cause of capillary malformation-arteriovenous malformation
    syndrome. In cerebral high-flow shunts its variants are not confined to one
    lesion type, which supports a shared upstream mechanism across the shunt
    spectrum rather than a lesion-specific genotype.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RASA1 variants were identified in all types of shunts."
    explanation: >-
      Establishes that RASA1 variation spans shunt types, which is the basis for
      treating endothelial Ras dysregulation as the shared upstream node rather
      than assigning genotypes to lesion subtypes.
- name: ACVRL1
  gene_term:
    preferred_term: ACVRL1
    term:
      id: hgnc:175
      label: ACVRL1
  relationship_type: CAUSATIVE
  notes: >-
    Activin A receptor like type 1, the hereditary haemorrhagic telangiectasia
    type 2 gene, also implicated in this malformation. Its involvement places
    vein of Galen malformation within the broader family of hereditary
    arteriovenous malformation syndromes rather than treating it as an isolated
    anomaly.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrative genomic analysis defined developing endothelial cells as a likely spatio-temporal locus of VOGM pathophysiology."
    explanation: >-
      PARTIAL: this gene was among those implicated by the analysis, but the
      quoted sentence reports the cell-type localisation rather than the
      gene-specific statistics, so the evidence supports its inclusion in the
      endothelial mechanism rather than quantifying its contribution.
animal_models:
- name: EPHB4-knockdown zebrafish with human allele rescue
  species: Zebrafish
  genotype: ephb4 morpholino knockdown, rescued with wild-type or truncated human EPHB4
  publication: PMID:29444212
  description: >-
    A knockdown model used as a functional assay rather than as a phenocopy of
    the human malformation. Its value is the rescue design: wild-type human EPHB4
    corrects the brain vascular defect and the truncated disease-associated form
    does not, which converts a candidate variant into a demonstrated
    loss-of-function.
  modeled_mechanisms:
  - target: Failure of Endothelial Ras Signalling in Fetal Cerebrovascular Development
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Establishes that the patient alleles are functionally deficient, by showing
      that wild-type protein rescues the vascular defect while the truncated
      variant fails to.
    limitations: >-
      The zebrafish defect is a general brain vascular abnormality rather than a
      vein of Galen malformation; no median prosencephalic vein of Markowski
      exists to persist, so the model tests allele function rather than
      reproducing the human lesion. It is also a morpholino knockdown rather than
      a germline mutant.
    evidence:
    - reference: PMID:29444212
      reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This model allowed us to investigate EPHB4 loss-of-function mutations in this disease by the ability to rescue the brain vascular defect in knockdown zebrafish co-injected with wild-type, but not truncated EPHB4"
      explanation: >-
        States the rescue design and its result, which is what makes the model a
        functional test of the human alleles.
  evidence:
  - reference: PMID:29444212
    reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This model allowed us to investigate EPHB4 loss-of-function mutations in this disease by the ability to rescue the brain vascular defect in knockdown zebrafish co-injected with wild-type, but not truncated EPHB4"
    explanation: >-
      Supports treating this model as informative for the functional consequence
      of the patient variants.
treatments:
- name: Endovascular Embolization
  description: >-
    The standard treatment, and mechanically the right one: it occludes the shunt
    itself, removing the low-resistance channel that drives every downstream
    consequence. Timing is the difficult judgement, balancing the cardiac
    emergency in a neonate against the technical and haemodynamic risks of
    intervening on a very small patient. Outcomes have improved substantially
    with it, but the long-term results remain worse than medium-term follow-up
    implies.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Persistent Embryonic Arteriovenous Shunt
    treatment_effect: INHIBITS
    description: >-
      Occludes the arteriovenous connection directly, which is why it addresses
      the cardiac, venous and steal consequences together rather than one at a
      time.
    evidence:
    - reference: PMID:35547535
      reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While endovascular embolization has clearly improved the outcome, several recent case series (7, 8) have shown that the long-term prognosis in this malformation is more severe than the usually described medium-term prognosis (9-11)."
      explanation: >-
        States both halves honestly: embolization has clearly improved outcome,
        and long-term prognosis is nonetheless more severe than medium-term
        reports suggest.
  evidence:
  - reference: PMID:31713850
    reference_title: "Long-term outcome of vein of Galen malformation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term outcome of patients with VGAM appears to be less favourable than outcome described at the short- and medium-term, even in the absence of encephalomalacia at birth."
    explanation: >-
      PARTIAL and recorded as a limit on the treatment rather than support for it.
      Survivors of successful treatment still do worse than earlier follow-up
      predicted, which is what a family needs told.
discussions:
- discussion_id: vogm_long_term_deterioration
  prompt: >-
    Why do children with vein of Galen malformation do worse at school age than
    medium-term follow-up predicts, even when no encephalomalacia was present at
    birth?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cerebral Arterial Steal
  - pathophysiology#Cerebral Venous Hypertension
  rationale: >-
    The outcome literature states plainly that long-term results are less
    favourable than short- and medium-term assessment suggests, and that this
    holds even in the absence of encephalomalacia at birth. That combination is
    the interesting part: a normal-looking neonatal brain does not guarantee a
    normal-functioning school-age child. Several explanations are compatible with
    it and none is established. Chronic hypoperfusion and venous hypertension may
    injure developing tissue in ways that structural imaging does not show; the
    cognitive demands that reveal impairment may simply not exist in infancy; or
    residual shunting after treatment may continue to affect a brain that is
    still developing. Distinguishing them matters directly for what families are
    told at discharge and for how long children are followed.
  proposed_experiments:
  - experiment_id: vogm_school_age_imaging_correlation
    name: School-age neurocognitive outcome against neonatal and follow-up imaging
    description: >-
      Follow a treated cohort to school age with formal neurocognitive assessment
      and serial imaging, testing whether later impairment is predicted by
      residual shunt, by interval imaging change, or by neither. If neither
      predicts it, the injury is occurring below the resolution of structural
      imaging, which is itself the finding.
differential_diagnoses:
- name: Pial arteriovenous fistula draining into an enlarged vein of Galen
  description: >-
    The critical differential, and the reason the distinction is curated rather
    than assumed. A pial arteriovenous fistula or malformation may drain into a
    secondarily dilated vein of Galen and look similar on imaging, but it is a
    different lesion with different anatomy, different genetics, and a different
    risk profile for intervention. Calling it a vein of Galen malformation would
    import the wrong treatment expectations.
- name: Dural arteriovenous fistula of infancy
  description: >-
    Another high-flow shunt presenting with cardiac failure and venous
    hypertension in infancy, arising in dural rather than pial or choroidal
    vessels. Distinguished angiographically by the feeding vessels and the site
    of the shunt.
- name: Hereditary haemorrhagic telangiectasia
  description: >-
    A systemic arteriovenous malformation syndrome sharing genes with this
    disease, including ACVRL1. Relevant both as a differential and as context: it
    places vein of Galen malformation in a family of endothelial signalling
    disorders rather than treating it as an isolated anomaly, and a cerebral
    shunt in a child should prompt a look for telangiectasia and other
    malformations.
prevalence:
- population: Paediatric vascular malformations
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Recorded as a proportion of paediatric vascular malformations rather than as
    a population rate, because that is what the literature reliably supports: the
    malformation represents about 30 per cent of all paediatric vascular
    malformations and is the commonest arteriovenous malformation in fetuses and
    infants. Population incidence figures circulating for this disease vary
    several-fold between sources and are not curated here.
  evidence:
  - reference: PMID:29444212
    reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vein of Galen aneurysmal malformation is a congenital anomaly of the cerebral vasculature representing 30% of all paediatric vascular malformations."
    explanation: >-
      Gives the proportion of paediatric vascular malformations, which is the
      measure this record carries.
  - reference: PMID:36588762
    reference_title: "Recurrent Vein of Galen Aneurysmal Malformation as a Presentation of Hereditary Hemorrhagic Telangiectasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vein of Galen malformation (VGM) results from an aneurysmal aberration with an arteriovenous shunting of blood and is the most frequent arteriovenous malformation in infants and fetuses."
    explanation: >-
      Independent statement that this is the commonest arteriovenous malformation
      in the fetal and infant population.

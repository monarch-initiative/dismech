inheritance:
- name: Autosomal dominant with incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    The counselling picture is genuinely awkward, and the awkwardness is
    mechanistic rather than a gap in the data. The implicated variants are
    dominantly inherited with a fifty per cent transmission risk, yet most
    affected children are the only affected person in the family, and unaffected
    parents carry the same variant. The mouse work gives a reason: a
    patient-derived EPHB4 variant produced the developmental defect only when a
    second-hit allele was present. A dominant variant that needs a second event
    behaves, at the level of a family, like sporadic disease. Variants were
    identified in 39 per cent of a 115-child cohort, so a negative genetic test
    does not exclude the diagnosis either.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since all variants show dominant inheritance with a 50% risk of transmission to the offspring and possible affection of multiple organs, genetic screening of EPHB4, RASA1, and the three HHT-associated genes has to be considered for a high-flow intracerebral vascular malformation"
    explanation: >-
      States the mode of inheritance and the transmission risk, and draws the
      practical conclusion the authors draw from it, which is to test.
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant variants were identified in 39% of patients."
    explanation: >-
      Sets the diagnostic yield, which is what makes a negative result
      uninformative rather than reassuring.
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: 'Mice expressing a VOGM-specific EPHB4 kinase-domain missense variant (Phe867Leu) exhibited disrupted developmental angiogenesis and impaired hierarchical development of arterial-capillary-venous networks, but only in the presence of a "second-hit" allele.'
    explanation: >-
      PARTIAL and deliberately so. This is a mouse result offered as a candidate
      explanation for incomplete penetrance in humans, not a demonstration that
      human non-penetrance is caused by a second hit.
diagnosis:
- name: Fetal ultrasound and prenatal detection
  diagnosis_term:
    preferred_term: Fetal Ultrasound Imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  description: >-
    Most of these lesions are found before or just after birth, which is the
    single most consequential fact about their diagnosis: it makes delivery
    planning, not diagnosis, the clinical problem. The malformation appears as a
    midline cystic structure with turbulent high-velocity flow, and the same study
    assesses cardiomegaly and hydrops.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "60% of probands were diagnosed prenatally or within 1 month after birth; only 3.8% were diagnosed after age 2."
    explanation: >-
      Quantifies how early these lesions declare themselves, which is what makes
      prenatal imaging the dominant diagnostic modality.
- name: Doppler echocardiography
  diagnosis_term:
    preferred_term: Doppler Echocardiography Test
    term:
      id: NCIT:C38634
      label: Doppler Echocardiography Test
  description: >-
    Quantifies the haemodynamic consequence rather than the lesion: ventricular
    function, the degree of pulmonary overcirculation, and pulmonary pressures.
    In a neonate this is often what determines whether embolization happens now
    or after growth, so it functions as a treatment-timing instrument as much as
    a diagnostic one.
  notes: >-
    Curated from the entry's deep-research report and standard practice; the
    cached references in this entry do not contain a quotable sentence
    describing echocardiographic assessment, so no evidence is attached rather
    than attaching a quote that does not say this.
- name: Magnetic resonance angiography and venography
  diagnosis_term:
    preferred_term: Magnetic Resonance Angiography
    term:
      id: NCIT:C190557
      label: Magnetic Resonance Angiography
  description: >-
    Defines arterial supply, venous drainage, hydrocephalus and, decisively,
    whether brain parenchyma is intact. The parenchymal question is what
    separates a child who should be treated from one for whom treatment cannot
    help, so this is the study that carries the prognostic weight.
  notes: >-
    Curated from the deep-research report; no quotable sentence in the cached
    references describes the MRI protocol, so no evidence is attached.
- name: Catheter angiography
  diagnosis_term:
    preferred_term: Angiography
    term:
      id: NCIT:C190556
      label: Angiography
  description: >-
    The reference standard, and in practice the same procedure as treatment.
    Its specific job here is the distinction this entry curates as a
    differential: whether the venous drainage is that of a true malformation or
    of a pial fistula competing with the normal deep venous system. Getting that
    wrong and occluding the collector risks venous infarction or haemorrhage.
  evidence:
  - reference: PMID:35547535
    reference_title: "Arteriovenous Cerebral High Flow Shunts in Children: From Genotype to Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic data helps to classify these malformations and to guide treatment toward lowest risk of post-operative cerebral ischemic-hemorrhagic complications."
    explanation: >-
      States the stake in classifying the lesion correctly before occluding it,
      which is the question angiography is asked to settle.

  status: ACTIVE_NOT_RECRUITING
  description: >-
    The first-in-human fetal embolization study, and a genuine departure in
    strategy. Rather than resuscitating a decompensating newborn, it treats the
    shunt before birth, in fetuses expected to decompensate as soon as the
    placenta stops absorbing the extra flow. Seven pregnancies, single-arm,
    compared against historical cohorts, with neurological assessment every six
    months to two years.

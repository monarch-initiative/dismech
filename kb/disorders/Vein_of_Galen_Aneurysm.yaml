animal_models:
- name: EPHB4 p.Phe867Leu knock-in mouse
  species: Mouse
  genotype: Ephb4 kinase-domain missense p.Phe867Leu, with a second-hit allele
  publication: PMID:37978175
  description: >-
    The mechanistic centrepiece of the current genetics, and the model that
    explains why a dominantly inherited variant produces a sporadic-looking
    disease. Mice carrying a patient-derived EPHB4 kinase-domain missense change
    develop disordered angiogenesis and fail to build a proper
    artery-capillary-vein hierarchy, which is the developmental process this
    entry places at the top of its pathograph. The finding that matters most is
    conditional: the phenotype appeared only when a second-hit allele was also
    present. That converts incomplete penetrance from a shrug into a testable
    two-hit requirement, and it is the reason an inherited variant can sit
    silently in a parent.
  modeled_mechanisms:
  - target: Impaired Developmental Angiogenesis and Arteriovenous Specification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the developmental process this node asserts is disturbed,
      disordered angiogenesis and loss of arterial-capillary-venous hierarchy,
      using a variant taken from a patient rather than a null allele.
    limitations: >-
      The mice show disrupted developmental angiogenesis, not a vein of Galen
      aneurysmal malformation, so the model supports the upstream node and not
      the lesion itself. The phenotype also requires a second-hit allele, which
      means the model demonstrates a sensitised genetic context rather than the
      sufficiency of the patient variant alone.
    readouts:
    - name: Hierarchical development of arterial-capillary-venous networks
      target: Impaired Developmental Angiogenesis and Arteriovenous Specification
      direction: ALTERED
      interpretation: >-
        Structural correlate of disordered endothelial development, observed only
        in the presence of a second-hit allele.
      evidence:
      - reference: PMID:37978175
        reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: 'Mice expressing a VOGM-specific EPHB4 kinase-domain missense variant (Phe867Leu) exhibited disrupted developmental angiogenesis and impaired hierarchical development of arterial-capillary-venous networks, but only in the presence of a "second-hit" allele.'
        explanation: >-
          Reports the measurement and, critically, its condition.
    evidence:
    - reference: PMID:37978175
      reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Mice expressing a VOGM-specific EPHB4 kinase-domain missense variant (Phe867Leu) exhibited disrupted developmental angiogenesis and impaired hierarchical development of arterial-capillary-venous networks, but only in the presence of a "second-hit" allele.'
      explanation: >-
        Supports treating this model as informative for the endothelial
        developmental node, with the second-hit condition carried alongside
        rather than dropped.
- name: acvrl1a/b-depleted zebrafish with human allele rescue
  species: Zebrafish
  genotype: acvrl1a/b depletion in the Tg(kdr:gfp)zn1 reporter line, rescued with wild-type or Cys344Tyr human ACVRL1 mRNA
  publication: PMID:37978175
  description: >-
    The functional test behind the ACVRL1 assignment, built on the same rescue
    logic as the EPHB4 fish model. Depleting the two zebrafish acvrl1 paralogues
    produced massive dilation of a cranial vein, and the defect was corrected by
    wild-type human ACVRL1 messenger RNA but not by the patient Cys344Tyr form.
    That asymmetry is the whole argument: it shows the human variant is not
    merely rare but functionally deficient.
  modeled_mechanisms:
  - target: Impaired Developmental Angiogenesis and Arteriovenous Specification
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Wild-type human ACVRL1 rescues the venous dilation while the patient allele
      does not, establishing the variant as loss of function.
    limitations: >-
      The dilated vessel is the primordial hindbrain channel, not a median
      prosencephalic vein of Markowski, which zebrafish do not have. The model
      therefore tests allele function against a broadly analogous venous
      phenotype rather than reproducing the human lesion, and depletion is not
      the heterozygous state patients carry.
    readouts:
    - name: Calibre of the venous primordial hindbrain channel and posterior connecting segment
      target: Impaired Developmental Angiogenesis and Arteriovenous Specification
      direction: RESTORED
      interpretation: >-
        Restored by wild-type human ACVRL1 and not by the patient allele, which
        is what converts the variant into a demonstrated loss of function.
      evidence:
      - reference: PMID:37978175
        reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These phenotypes were rescued by mRNA co-injection of wild-type human ACVRL1 but not of VOGM-mutant human ACVRL1 Cys344Tyr"
        explanation: >-
          States the rescue result and its allele specificity.
    evidence:
    - reference: PMID:37978175
      reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we found that Acvrl1a/b depletion in the Tg(kdr:gfp)zn1 reporter fish line (see Methods) resulted in VOGM-like massive dilation of the venous primordial hindbrain channel and posterior connecting segment"
      explanation: >-
        Establishes the model and the vascular phenotype it produces.
- name: EPHB4-knockdown zebrafish with human allele rescue
  species: Zebrafish
  genotype: ephb4 morpholino knockdown, rescued with wild-type or truncated human EPHB4
  publication: PMID:29444212
  description: >-
    A knockdown model used as a functional assay rather than as a phenocopy of
    the human malformation. Its value is the rescue design: wild-type human EPHB4
    corrects the brain vascular defect and the truncated disease-associated form
    does not, which converts a candidate variant into a demonstrated
    loss-of-function.
  modeled_mechanisms:
  - target: Impaired Developmental Angiogenesis and Arteriovenous Specification
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Establishes that the patient alleles are functionally deficient, by showing
      that wild-type protein rescues the vascular defect while the truncated
      variant fails to.
    limitations: >-
      The zebrafish defect is a general brain vascular abnormality rather than a
      vein of Galen malformation; no median prosencephalic vein of Markowski
      exists to persist, so the model tests allele function rather than
      reproducing the human lesion. It is also a morpholino knockdown rather than
      a germline mutant.
    evidence:
    - reference: PMID:29444212
      reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This model allowed us to investigate EPHB4 loss-of-function mutations in this disease by the ability to rescue the brain vascular defect in knockdown zebrafish co-injected with wild-type, but not truncated EPHB4"
      explanation: >-
        States the rescue design and its result, which is what makes the model a
        functional test of the human alleles.
  evidence:
  - reference: PMID:29444212
    reference_title: "Loss of function mutations in EPHB4 are responsible for vein of Galen aneurysmal malformation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This model allowed us to investigate EPHB4 loss-of-function mutations in this disease by the ability to rescue the brain vascular defect in knockdown zebrafish co-injected with wild-type, but not truncated EPHB4"
    explanation: >-
      Supports treating this model as informative for the functional consequence

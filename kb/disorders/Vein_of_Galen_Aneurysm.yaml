- name: Global developmental delay
  category: Neurological
  description: >-
    Developmental impairment in survivors, and the outcome that matters most once
    the cardiac crisis is past. Long-term results are explicitly worse than
    medium-term follow-up suggests, and that applies even to children who had no
    encephalomalacia at birth, which means an initially reassuring neonatal
    assessment does not settle the prognosis.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263

experimental_models:
- name: COS-7 cells expressing VOGM-associated EPHB4 kinase-domain variants
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: African green monkey
    term:
      id: NCBITaxon:9534
      label: Chlorocebus aethiops
  cell_source: COS-7 immortalized cell line
  culture_system: Transient expression of wild-type or mutant EPHB4 followed by immunoblotting and immunoprecipitation
  conditions:
  - Wild-type EPHB4
  - EPHB4 p.Lys650Asn
  - EPHB4 p.Arg838Trp
  - EPHB4 p.Phe867Leu
  publication: PMID:37978175
  description: >-
    A reductionist cell-line assay used to separate mutant-protein abundance from
    kinase function. The three VOGM-associated kinase-domain variants had
    abundance and decay comparable to wild type but lacked detectable
    phosphotyrosine, supporting impaired EPHB4 kinase-dependent signaling rather
    than protein instability.
  modeled_mechanisms:
  - target: Dysregulated Endothelial Developmental Signaling
    relationship: MEASURES
    fidelity: LOW
    description: >-
      Measures stability and phosphorylation of patient-associated EPHB4 variants
      to define the proximal molecular defect.
    limitations: >-
      COS-7 is a nonhuman, non-endothelial immortalized cell line and does not
      reproduce fetal cerebrovascular development or the anatomical shunt. The
      assay distinguishes protein stability from phosphorylation but cannot alone
      resolve whether absent phosphotyrosine reflects blocked kinase activity or
      faster dephosphorylation.
    readouts:
    - name: EPHB4 steady-state abundance and protein decay
      target: Dysregulated Endothelial Developmental Signaling
      direction: UNCHANGED
      interpretation: >-
        Comparable abundance and decay indicate that the kinase-domain variants
        do not primarily act by destabilizing EPHB4 protein.

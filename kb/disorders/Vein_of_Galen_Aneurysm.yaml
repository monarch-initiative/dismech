  relationship_type: CAUSATIVE
  notes: >-
    Activin A receptor like type 1, the hereditary haemorrhagic telangiectasia
    type 2 gene, also implicated in this malformation. Its involvement places
    vein of Galen malformation within the broader family of hereditary

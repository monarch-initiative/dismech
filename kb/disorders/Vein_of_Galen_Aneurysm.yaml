      evidence:
      - reference: PMID:37978175
        reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "none of the VOGM-associated EPHB4 kinase domain mutants contained detectable phosphotyrosine as detected by anti-pTyr immunoblotting of whole-cell lysates and anti-EPHB4 immunoprecipitates"
        explanation: >-
          Direct assay result for the mutant proteins.
    evidence:
    - reference: PMID:37978175
      reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These findings strongly suggest that VOGM-associated EPHB4 D-mis variants block the protein tyrosine kinase activity of EPHB4 or render EPHB4 phospho-sites more susceptible to dephosphorylation."
      explanation: >-
        States the mechanistic interpretation and retains the source's alternative
        explanation rather than resolving it beyond the assay.
  evidence:
  - reference: PMID:37978175
    reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The steady-state abundance of Lys650Asn, Arg838Trp, and Phe867Leu EPHB4 variants expressed in Cos-7 cells approximated that of WT EPHB4"
    explanation: >-
      Establishes the cell-line expression experiment and the preserved-abundance

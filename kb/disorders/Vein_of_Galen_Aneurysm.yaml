    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Salient features at diagnosis included developmental delay (54%), macrocephaly (48%), hydrocephalus (48%), prominent face and/or scalp vasculature (45%), cutaneous vascular lesions (22%), and congestive heart failure (40%)."
    explanation: >-
      Reports hydrocephalus in 48 per cent of 114 probands at diagnosis, which is

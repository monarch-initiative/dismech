      - reference: PMID:37978175
        reference_title: "Mutation of key signaling regulators of cerebrovascular development in vein of Galen malformations."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Cycloheximide block of protein translation revealed polypeptide decay rates of EPHB4 VOGM mutants similar to that of WT EPHB4"
        explanation: >-
          Direct comparison of mutant and wild-type decay rates in transfected
          COS-7 cells.
    - name: EPHB4 phosphotyrosine signal
      target: Dysregulated Endothelial Developmental Signaling
      direction: ABOLISHED
      interpretation: >-
        Absence of detectable phosphotyrosine supports compromised
        kinase-dependent signaling while leaving increased dephosphorylation as

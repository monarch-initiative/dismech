  notes: Food-allergy-related anxiety can extend avoidance to tolerated foods. Clinically necessary allergen avoidance is not itself ARFID; additional restriction and impairment must exceed what the medical condition explains. Care integrates appropriate allergy management with nutritional and behavioral support.
- name: Neurodevelopmental and Anxiety-Disorder Comorbidity
  description: Autism spectrum disorder, ADHD and anxiety disorders can co-occur with ARFID. Autism was more frequent in sensory and combined presentations, while anxiety was more frequent in the fear presentation in a secondary-care surveillance cohort. These associations provide clinical context, not proof that a comorbid diagnosis causes a particular ARFID presentation.
  biological_scale: ORGANISM
  downstream:
  - target: Sensory Sensitivity and Food Selectivity
    description: Proposed modifying context; observational comorbidity does not establish causal direction.
  - target: Fear of Aversive Consequences of Eating
    description: Proposed modifying context; observational comorbidity does not establish causal direction.

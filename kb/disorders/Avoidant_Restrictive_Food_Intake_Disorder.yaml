genetic:
- name: Complex polygenic liability (no single causal gene)
  association: Risk Factor
  notes: >-
    ARFID is not a monogenic disease and has no OMIM/ClinVar causal gene. Twin
    data place its genetic architecture (heritability ~0.79) close to
    neurodevelopmental disorders; a dedicated genome-wide association study
    (ARFID-GEN) is underway to characterize the polygenic architecture.
  evidence:
  - reference: PMID:36723946
    reference_title: "Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heritability of ARFID was 0.79 (95% CI, 0.70-0.85), with significant
      contributions from nonshared environmental factors (0.21; 95% CI,
      0.15-0.30).
    explanation: >-
      Nationwide twin-study evidence supports a highly heritable, polygenic
      liability rather than a single causal gene.

- name: Family-Based Treatment (FBT-ARFID)
  description: Family-based treatment adapted for ARFID trains caregivers to change restrictive eating, followed by return to age-appropriate self-management. A randomized trial of 98 medically stable, underweight children aged 6-12 compared 14 telehealth sessions over four months with individual psychoeducational motivational therapy. FBT-ARFID produced greater weight gain, but overall ARFID symptom severity improved similarly in both groups. This trial does not establish efficacy across adult or non-underweight populations.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Family Therapy
    term:
      id: NCIT:C93347
      label: Family Therapy
  evidence:
  - reference: PMID:42019720
    reference_title: 'Family vs Individual Treatment for Children With Avoidant/Restrictive Food Intake Disorder: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 98 children with ARFID were randomized to 14 sessions of telehealth FBT-ARFID or PMT conducted over 4 months.
    explanation: Randomized active-comparator trial in underweight children aged 6-12; assessments were masked, but weight, height and behavioral outcomes relied on parent reports.
  - reference: PMID:42019720
    reference_title: 'Family vs Individual Treatment for Children With Avoidant/Restrictive Food Intake Disorder: A Randomized Clinical Trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: FBT-ARFID was superior to PMT at EOT in promoting increased %EBW. There were no differences between groups regarding improvements in overall severity of ARFID symptoms or other related ARFID symptoms
    explanation: Preserves the distinction between the positive primary weight outcome and the absence of overall symptom superiority. Baseline-severity moderation was exploratory.
- name: Nutritional Rehabilitation and Enteral Feeding
  description: Individualized dietetic rehabilitation restores adequate energy, fluids and micronutrients, initially using accepted foods and oral supplements when needed. Enteral support may be necessary for severe restriction or malnutrition and is reassessed as oral intake improves. Refeeding requires monitoring for electrolyte abnormalities and clinical instability.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: nutritional rehabilitation with enteral tube feeding
    term:
      id: NCIT:C67022
      label: Nutritional Intervention
  evidence:
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This can be achieved through the consumption of foods that are more readily accepted by the individual, as well as the prescription of nutritional supplements via oral or enteral nutrition.
    explanation: Supports accepted foods and individualized supplementation during nutritional rehabilitation.
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: close monitoring for electrolyte abnormalities, which may arise from refeeding syndrome—a serious and potentially fatal complication—is essential
    explanation: Supports monitoring during nutritional rehabilitation because refeeding can cause dangerous electrolyte abnormalities.
  target_mechanisms:
  - target: Failure to Meet Nutritional and Energy Needs
    description: Accepted foods and oral or enteral supplementation restore nutritional intake.
    evidence:
    - reference: PMID:38849953
      reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This can be achieved through the consumption of foods that are more readily accepted by the individual, as well as the prescription of nutritional supplements via oral or enteral nutrition.
      explanation: Supports accepted foods and individualized supplementation during nutritional rehabilitation.
- name: Adjunctive Off-Label Pharmacotherapy
  description: Medication is used selectively alongside behavioral and nutritional treatment to address appetite, nausea, anxiety or psychiatric comorbidity. Mirtazapine has case-based and retrospective inpatient evidence. Olanzapine, buspirone, fluoxetine and cyproheptadine have been described in small reports or combined-treatment series, which cannot isolate drug effects. No ARFID-specific medication is established by these studies.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mirtazapine
      term:
        id: CHEBI:6950
        label: mirtazapine
  evidence:
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There is currently no psychotropic medication for treatment of ARFID approved by the U.S. Food and Drug Administration.
    explanation: The 2024 review reports no FDA-approved ARFID pharmacotherapy; the cited medication evidence concerns off-label use.
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: reported the use of mirtazapine to enhance appetite and facilitate weight gain while reducing nausea and vomiting
    explanation: Narrative-review evidence supports off-label mirtazapine as an appetite-stimulating agent used in ARFID.
  - reference: PMID:40265508
    reference_title: Mirtazapine Is Associated With Shorter Hospital Stay in Pediatric Avoidant Restrictive Food Intake Disorder-A Retrospective Chart Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hospital records from 87 children and adolescents with ARFID treated in an inpatient medical stabilization program were analyzed.
    explanation: Retrospective inpatient study; 38 patients received mirtazapine. Prescribing was not randomized, concurrent treatment was intensive, and systematic adverse-effect assessment was unavailable.
  - reference: PMID:40265508
    reference_title: Mirtazapine Is Associated With Shorter Hospital Stay in Pediatric Avoidant Restrictive Food Intake Disorder-A Retrospective Chart Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The results of this retrospective chart review suggest that treatment with mirtazapine is associated with reduced length of inpatient stay and total NG tube feeding days throughout a patient's stay.
    explanation: Association with shorter hospitalization and fewer total tube-feeding days; discharge BMI change and the proportion of hospitalization spent on tube feeding did not differ. This does not prove drug efficacy.
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The treatment approach included family therapy, cognitive-behavioural therapy, medical monitoring, and pharmacological treatment with olanzapine, fluoxetine, and cyproheptadine
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Small combined-treatment series summarized by the review; the individual medication contributions cannot be separated.'
differential_diagnoses:
- name: Anorexia Nervosa
  description: Anorexia nervosa also involves restricted intake and low weight, but is driven by fear of weight gain and body-image disturbance — the motivation that ARFID lacks. A minority of ARFID cases cross over to anorexia nervosa.
  distinguishing_features:
  - ARFID restriction occurs without drive for thinness, fear of weight gain, or body-image disturbance; anorexia nervosa is defined by exactly this weight/shape motivation.
  disease_term:
    preferred_term: anorexia nervosa
    term:
      id: MONDO:0005351
      label: anorexia nervosa
  evidence:
  - reference: PMID:38718975
    reference_title: Prospective 2-Year Course and Predictors of Outcome in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: half the participants persisted with their original diagnosis, and 3% of participants experienced a diagnostic shift to anorexia nervosa
    explanation: Prospective-course evidence supports anorexia nervosa as a distinct diagnosis with only a small ARFID-to-AN diagnostic crossover.
- name: Pica
  description: Pica also involves abnormal eating without body-image disturbance, but is defined by ingestion of non-nutritive, non-food substances rather than by restriction/avoidance of normal food.
  distinguishing_features:
  - ARFID is defined by restriction/avoidance of food intake; pica is defined by persistent ingestion of non-nutritive, non-food substances.
  disease_term:
    preferred_term: pica disease
    term:
      id: MONDO:0001441
      label: pica disease
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Pica is defined by the American Psychiatric Association's Diagnostic and Statistical Manual, 5th edition (DSM 5) as the ongoing ingestion of materials with no nutritive or food value.
    explanation: Supports the defining ingestion behavior that distinguishes pica from restriction or avoidance of ordinary food.

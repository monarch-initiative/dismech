treatments:
- name: Cognitive-Behavioral Therapy for ARFID (CBT-AR)
  description: CBT-AR combines regular eating, nutritional planning, presentation-specific exposure and relapse prevention. Sensory sensitivity is addressed through repeated food tasting, fear through graded exposure, and lack of interest through interoceptive exposure. Small uncontrolled outpatient studies in youth and adults reported lower ARFID severity and greater food variety; these studies establish feasibility and preliminary benefit, not comparative efficacy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive behavior therapy for ARFID (CBT-AR)
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:34423319
    reference_title: Cognitive-behavioral therapy for adults with avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with sensory sensitivity taste five novel foods per session; patients with fear of aversive consequences work through a fear and avoidance hierarchy; and patients with lack of interest practice interoceptive exposures.
    explanation: The treatment manual selects exposure modules according to the maintaining presentation; more than one module can be used.
  - reference: PMID:32776570
    reference_title: 'Cognitive-behavioral therapy for avoidant/restrictive food intake disorder: Feasibility, acceptability, and proof-of-concept for children and adolescents.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 25 eligible individuals, 20 initiated treatment, including 17 completers and 3 dropouts.
    explanation: Uncontrolled feasibility study in medically stable youth aged 10-17; most received family-supported CBT-AR with medical monitoring.
  - reference: PMID:32776570
    reference_title: 'Cognitive-behavioral therapy for avoidant/restrictive food intake disorder: Feasibility, acceptability, and proof-of-concept for children and adolescents.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ARFID severity scores (on the Pica, ARFID, and Rumination Disorder Interview) significantly decreased per both patient and parent report. Patients incorporated a mean of 16.7 (SD = 12.1) new foods from pre- to post-treatment.
    explanation: Within-person improvements in the youth pilot; the absence of a control group prevents attribution of improvement specifically to CBT-AR.
  - reference: PMID:34423319
    reference_title: Cognitive-behavioral therapy for adults with avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of 18 eligible adults offered CBT-AR, 15 chose to participate and 14 completed treatment.
    explanation: Adult open trial, predominantly individual treatment; small, demographically homogeneous sample limits generalizability.
  - reference: PMID:34423319
    reference_title: Cognitive-behavioral therapy for adults with avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At post-treatment, 47% of patients no longer met criteria for ARFID.
    explanation: Diagnostic remission in the adult intent-to-treat sample; not a randomized comparison or evidence of long-term durability.
  - reference: PMID:34423319
    reference_title: Cognitive-behavioral therapy for adults with avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Second, with no control group we cannot rule out alternative rival hypotheses for the observed improvements (e.g., therapist attention, passage of time).
    explanation: Authors explicitly identify the causal limitation of the adult open trial.

- name: Psychosocial Impairment Related to Eating
  biological_scale: ORGANISM
  description: Restricted eating can interfere with school, peer and family activities involving food. Marked psychosocial interference can satisfy the impairment criterion even without low weight or another nutritional consequence.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Selectivity and extreme food avoidance can hinder a child’s experiences in social settings, including interactions related to eating at school or with peers.
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Psychosocial impairment is a direct consequence of restrictive eating, not necessarily a consequence of undernutrition.'

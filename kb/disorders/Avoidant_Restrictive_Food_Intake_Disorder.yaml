diagnosis:
- name: Clinical diagnostic assessment
  description: 'Assess persistent restriction or avoidance with at least one significant consequence: weight loss or growth faltering, nutrient deficiency, reliance on supplements or enteral feeding, or marked psychosocial impairment. Assess food availability and cultural practices, weight/shape motivations, and medical or psychiatric explanations. A coexisting disorder does not preclude ARFID when the feeding disturbance exceeds what that condition usually explains and warrants additional attention.'
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Criterion B states that the eating disorder cannot be better explained by the unavailability of food or a culturally accepted practice.
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Food access and cultural practice are diagnostic exclusions.'
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: When an eating disorder occurs in the context of another condition or disorder, its severity exceeds that usually associated with the condition or disorder and warrants additional clinical attention
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Clarifies diagnostic coexistence with medical and psychiatric conditions.'
  - reference: PMID:38718975
    reference_title: Prospective 2-Year Course and Predictors of Outcome in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'avoidant/restrictive eating by volume/variety resulting in any of the following consequences: (a) weight loss/failure to gain weight; (b) nutritional deficiency; (c) supplemental feeding dependence; and (d) psychosocial impairment'
    explanation: Operational diagnostic assessment in a primary clinical study; impairment is not restricted to underweight.
- name: PARDI interview and dimensional screening
  description: The Pica, ARFID, and Rumination Disorder Interview assesses diagnosis, severity and all three overlapping presentations. NIAS and PARDI-AR-Q questionnaires can support screening and monitoring; screening alone does not establish that diagnostic exclusions are met.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PARDI is a structured interview developed to assess the presence and severity of diagnoses for evaluation and treatment planning in clinical and research settings, specifically focusing on ARFID.
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Supports the structured interview.'
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC11157884/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The NIAS addresses food restriction behaviors associated with the three eating patterns related to ARFID, namely appetite, fear, and sensory sensitivity.
    explanation: 'Full text of PMID:38849953 (Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.) retrieved through PMC/BioC. Supports dimensional screening rather than a stand-alone diagnostic biomarker.'
- name: Nutritional and medical evaluation
  description: Review growth trajectories, weight change, diet variety, vital signs and signs of nutrient deficiency. Laboratory evaluation is guided by dietary omissions, nutritional status and possible alternative diagnoses; brain imaging and appetite-hormone assays are research measures rather than established ARFID diagnostic tests.
  evidence:
  - reference: PMID:38753906
    reference_title: Avoidant Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis involves a comprehensive medical, nutritional, and psychological evaluation to assess the patient's physical health, eating behaviors, and mental well-being.
    explanation: Supports multidisciplinary assessment of the clinical syndrome.
progression:
- phase: Variable persistence and remission
  age_range: 9-23 years at baseline in the prospective cohort
  notes: In a prospective cohort of 100 participants with full or subthreshold ARFID, 44% retained their original diagnosis across both annual follow-ups. Outcome estimates depended on how subthreshold illness was classified. Follow-up combined structured interviews and chart review; the sample was predominantly White and was not a population prevalence sample. Three participants developed anorexia nervosa while retaining restrictive eating symptoms, emphasizing reassessment of weight/shape motivation over time.
  evidence:
  - reference: PMID:38718975
    reference_title: Prospective 2-Year Course and Predictors of Outcome in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the full sample (N = 100), 44% (n = 44) persisted in their original diagnosis across both follow-ups, while 12% (n = 12) achieved remission at Year 1 that was sustained through Year 2.
    explanation: Uses the full-text longitudinal trajectory counts rather than converting the abstract wording of roughly half into an exact universal prognosis.
  - reference: PMID:38718975
    reference_title: Prospective 2-Year Course and Predictors of Outcome in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: three participants (3%) experienced diagnostic shift to another the restricting type of AN (ANr) at Year 1 and retained ANr at Year 2.
    explanation: Observed crossover in this cohort; not a lifetime risk estimate.
biochemical:
- name: Fasting plasma cholecystokinin
  notes: Research association, not a diagnostic test. A case-control study found higher fasting CCK in full/subthreshold ARFID after adjustment for age, sex and BMI percentile, but no within-ARFID association with subjective appetite or symptom severity. A later two-year observational study linked decreases in CCK to improvement in lack-of-interest severity, not overall ARFID severity. Higher CCK in the lack-of-interest group was significant at year 1 only, with no significant difference at baseline or year 2. Causality and the contribution of nutritional state remain unresolved.
  evidence:
  - reference: PMID:35830620
    reference_title: Elevated Fasting Satiety-Promoting Cholecystokinin (CCK) in Avoidant/Restrictive Food Intake Disorder Compared to Healthy Controls.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fasting CCK was higher in those with full/subthreshold ARFID versus HCs with a large effect
    explanation: Case-control elevation after adjustment for age, sex and BMI percentile.
  - reference: PMID:35830620
    reference_title: Elevated Fasting Satiety-Promoting Cholecystokinin (CCK) in Avoidant/Restrictive Food Intake Disorder Compared to Healthy Controls.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Within the ARFID group, CCK was not significantly related to BMI percentile, subjective appetite ratings, or ARFID characteristic measures.
    explanation: The initial study did not establish that higher CCK tracked subjective appetite or clinical severity within ARFID.
  - reference: PMID:42159358
    reference_title: Differential Impact of Cholecystokinin and Ghrelin on 2-Year Avoidant/Restrictive Food Intake Disorder Symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, there was no significant difference between the groups in fasting CCK at Baseline or Year 2.
    explanation: The lack-of-interest presentation contrast was significant at only one follow-up, not consistently across timepoints.
  - reference: PMID:42159358
    reference_title: Differential Impact of Cholecystokinin and Ghrelin on 2-Year Avoidant/Restrictive Food Intake Disorder Symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: greater decreases in fasting CCK from Baseline to Years 1 and 2 were associated with greater decreases in lack of interest severity scores
    explanation: Longitudinal association in a cohort with substantial attrition and complete-case endocrine analyses; not experimental evidence that lowering CCK treats ARFID.
- name: Fasting plasma ghrelin
  notes: Research measure rather than an established diagnostic biomarker. In a two-year ARFID cohort, fasting ghrelin did not differ by lack-of-interest presentation. Increases in ghrelin were associated with lower overall ARFID severity at follow-up, while associations with lack-of-interest severity were not significant. These observational findings do not establish a generalized ghrelin deficiency or efficacy of ghrelin treatment.
  evidence:
  - reference: PMID:42159358
    reference_title: Differential Impact of Cholecystokinin and Ghrelin on 2-Year Avoidant/Restrictive Food Intake Disorder Symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: there were no differences in fasting ghrelin between participants that met versus did not meet cut-off for ARFID-lack of interest across timepoints.
    explanation: Preserves the negative presentation-specific comparison.
  - reference: PMID:42159358
    reference_title: Differential Impact of Cholecystokinin and Ghrelin on 2-Year Avoidant/Restrictive Food Intake Disorder Symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: greater increases in fasting ghrelin from Baseline to Years 1 and 2 were associated with greater decreases in ARFID severity scores at Years 1 (f2 = .15) and 2 (f2 = .23), respectively.
    explanation: The reported association held at both annual follow-ups, but causal direction and treatment relevance remain untested.
imaging_findings:
- name: Greater frontal cortical thickness in children with ARFID-like symptoms
  modality: MRI
  diagnostic: false
  located_in:
    preferred_term: frontal cortex
    term:
      id: UBERON:0001870
      label: frontal cortex
  description: Cross-sectional Generation R analysis found greater frontal and superior frontal cortical thickness in children with ARFID-like symptoms; the differences persisted after BMI adjustment. Classification used an index rather than a diagnostic interview. No significant regional volume or surface-area differences were found in the prespecified regions, and exploratory findings did not survive multiple-comparison correction.
  notes: Research association, not an individual diagnostic marker. The study does not establish impaired synaptic pruning or causal executive dysfunction. Full-text results and Table 1 report 121 children with symptoms and 1,856 without; the abstract has an inconsistent comparator count.
  evidence:
  - reference: PMID:39623765
    reference_title: 'Neural correlates of children with avoidant restrictive food intake disorder symptoms: large-scale neuroanatomical analysis of a paediatric population.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neuroanatomical findings identified significantly greater frontal (p = .00743; d = 0.21) and superior frontal (p = 6.56E-04; d = 0.28) cortical thickness among children with ARFID symptoms.
    explanation: The abstract reports a cortical-thickness association, not evidence for a cellular lesion.
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC12062856/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC12062856/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No observable differences in the regional surface area or volume of hypothesised regions were identified.
    explanation: 'Full text of PMID:39623765 (Neural correlates of children with avoidant restrictive food intake disorder symptoms: large-scale neuroanatomical analysis of a paediatric population.) retrieved through PMC/BioC. Preserves the negative anatomical outcomes.'
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC12062856/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC12062856/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As such, the work in this study is unable to provide conclusive information regarding neural correlates associated with a clinical ARFID diagnosis, meaning the full generalisability to youth formally diagnosed with ARFID is unknown.
    explanation: 'Full text of PMID:39623765 (Neural correlates of children with avoidant restrictive food intake disorder symptoms: large-scale neuroanatomical analysis of a paediatric population.) retrieved through PMC/BioC. Index-defined symptom group in a population cohort; clinical diagnostic generalization remains unresolved.'
- name: Reduced food-cue anterior cingulate response following CBT-AR
  modality: FUNCTIONAL_MRI
  diagnostic: false
  located_in:
    preferred_term: anterior cingulate cortex
    term:
      id: UBERON:0009835
      label: anterior cingulate cortex
  description: An exploratory analysis of an uncontrolled CBT-AR pilot found reduced right anterior cingulate food-versus-object activation in participants with paired scans. Baseline activation did not significantly predict symptom change or remission; anterior insula and amygdala activation did not significantly change. The anterior cingulate change no longer reached conventional significance after exploratory adjustment for trait anxiety.
  notes: Research treatment correlate, not proof of a causal treatment mechanism or a treatment-selection biomarker. This is a subset of previously published CBT-AR and neurobiology participants, not an independent replication.
  evidence:
  - reference: PMID:41803077
    reference_title: An Exploratory Study of Neural Response to Food Cues Following Cognitive-Behavioral Therapy for Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: youth with ARFID viewed images of food and non-food in a fasted state at pre-treatment (N = 24) and a subset (N = 14) also completed post-treatment scans.
    explanation: Small paired-imaging subset of the open trial.
  - reference: PMID:41803077
    reference_title: An Exploratory Study of Neural Response to Food Cues Following Cognitive-Behavioral Therapy for Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pre-treatment activation in response to food versus objects was not associated with changes in ARFID severity or remission post-treatment.
    explanation: The baseline measure did not significantly predict clinical response.
  - reference: PMID:41803077
    reference_title: An Exploratory Study of Neural Response to Food Cues Following Cognitive-Behavioral Therapy for Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There were no significant pre- to post-treatment changes in the aINS or the amygdala.
    explanation: Negative regional results prevent generalized salience-network normalization claims.
  - reference: PMID:41803077
    reference_title: An Exploratory Study of Neural Response to Food Cues Following Cognitive-Behavioral Therapy for Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with lower activation in the neural response to food cues from pre- to post-treatment in the ACC, with a slight attenuation in the significance level p(FWE)=.082 (cluster level) and effect size (d=.66).  # codespell:ignore fwe
    explanation: The anxiety-adjusted exploratory result did not meet conventional statistical significance.
has_subtypes:
- name: Sensory-sensitivity presentation
  description: Avoidance based on sensory properties of food and rigid preferences. A clinical presentation that can overlap with the other dimensions, not a separate Mendelian disorder.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Sensory subtype was characterised by high probabilities of sensory sensitivity (0.83) and rigid eating behaviours (0.73)
    explanation: 'Full text of PMID:38333539 (Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.) retrieved through PMC/BioC. Empirically derived sensory class in secondary-care children and adolescents.'
- name: Lack-of-interest presentation
  description: Low appetite or interest in eating and difficulty consuming sufficient amounts; can coexist with sensory sensitivity or fear.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Lack of Interest subtype was characterised by high probabilities of lack of appetite (0.85) and lack of interest in eating or food (1.0)
    explanation: 'Full text of PMID:38333539 (Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.) retrieved through PMC/BioC. The class distinguishes low appetite from other reasons for restriction.'
- name: Fear-of-aversive-consequences presentation
  description: Avoidance motivated by anticipated choking, vomiting, pain or other aversive effects; may have relatively acute onset in clinical cohorts.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Fear subtype was characterised by high probability of fear of aversive consequences of eating (0.97)
    explanation: 'Full text of PMID:38333539 (Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.) retrieved through PMC/BioC. Empirical clinical grouping; not a separate diagnostic category or proof that every case follows a traumatic event.'
- name: Combined presentation
  description: Co-occurring dimensions are common. The largest class in a UK and Republic of Ireland secondary-care study combined sensory sensitivity and lack of interest. That study-specific class does not define a universal fourth biological subtype.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    reference_title: https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_xml/PMC10850399/unicode
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the most prevalent class, comprising 38% of the sample, was the Combined Subtype characterised by a combination of Lack of Interest Subtype and Sensory Subtype.
    explanation: 'Full text of PMID:38333539 (Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.) retrieved through PMC/BioC. The class distribution depends on the study population and ascertainment.'

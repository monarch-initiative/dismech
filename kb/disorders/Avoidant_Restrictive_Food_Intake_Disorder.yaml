name: Avoidant Restrictive Food Intake Disorder
creation_date: "2026-07-29T00:00:00Z"
category: Psychiatric
description: >-
  Avoidant/restrictive food intake disorder (ARFID) is a feeding and eating
  disorder characterized by persistent failure to meet nutritional and/or
  energy needs due to avoidance or restriction of food intake, in the absence
  of body-image disturbance or drive for thinness. Restriction is driven by one
  or more of three DSM-5 presentations: sensory sensitivity to the taste,
  texture, smell, or appearance of food; an apparent lack of interest in eating
  or low appetite; and fear of aversive consequences of eating (such as choking
  or vomiting). The absence of weight- and shape-related motivation is the key
  contrast with anorexia nervosa. ARFID was introduced in DSM-5 (2013),
  replacing and expanding the former "feeding disorder of infancy or early
  childhood," and shows strong neurodevelopmental (autism, ADHD) and
  anxiety-disorder comorbidity.
disease_term:
  preferred_term: avoidant/restrictive food intake disorder
  term:
    id: MONDO:7770002
    label: avoidant/restrictive food intake disorder
parents:
- Eating Disorder
- Mental Health Disorder
pathophysiology:
- name: Multifactorial Genetic and Environmental Liability
  description: >-
    ARFID is modeled as a complex, highly heritable behavioral-psychiatric
    trait arising from interacting genetic predisposition and nonshared
    environmental factors, with a twin-based heritability estimate near 0.79 —
    an architecture closer to neurodevelopmental disorders than to a monogenic
    condition. It is not attributable to a single causal gene.
  biological_scale: ORGANISM
  downstream:
  - target: Sensory Sensitivity and Food Selectivity
    description: >-
      Heritable liability is modeled upstream of the sensory-sensitivity
      presentation.
  - target: Low Appetite and Lack of Interest in Eating
    description: >-
      Heritable liability is modeled upstream of the low-appetite /
      lack-of-interest presentation.
  - target: Fear of Aversive Consequences of Eating
    description: >-
      Heritable liability is modeled upstream of the fear-driven presentation.
  evidence:
  - reference: PMID:36723946
    reference_title: "Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heritability of ARFID was 0.79 (95% CI, 0.70-0.85), with significant
      contributions from nonshared environmental factors (0.21; 95% CI,
      0.15-0.30).
    explanation: >-
      Nationwide twin-study evidence supports high heritability with a
      nonshared environmental contribution for the broad ARFID phenotype.
  - reference: PMID:37990202
    reference_title: "ARFID Genes and Environment (ARFID-GEN): study protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic and environmental factors that contribute to risk for developing
      ARFID in children and adults
    explanation: >-
      The ARFID-GEN study design frames ARFID risk as arising from combined
      genetic and environmental contributions.
- name: Sensory Sensitivity and Food Selectivity
  description: >-
    The sensory-sensitivity presentation: heightened, aversive responses to the
    taste, texture, smell, temperature, or appearance of food produce a narrow
    accepted-food repertoire and avoidance of non-preferred foods. Neuroimaging
    implicates hyperactivation of cortical sensory-processing regions rather
    than a simple insula-hyperactivation model.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Taste receptor cell
    term:
      id: CL:0000209
      label: taste receptor cell
  biological_processes:
  - preferred_term: Sensory perception of taste
    term:
      id: GO:0050909
      label: sensory perception of taste
    modifier: ABNORMAL
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: >-
      Sensory aversion is modeled as one upstream driver of the core
      restriction/avoidance behavior.
  evidence:
  - reference: PMID:38849953
    reference_title: "Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with ARFID may limit food variety and intake due to avoidance
      based on the sensory characteristics of the food
    explanation: >-
      Narrative-review evidence supports sensory-based avoidance as one of the
      core drivers of restricted intake in ARFID.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ARFID-sensory sensitivity group did not show greater insula
      activation vs HC but showed greater activation of the ACC
    explanation: >-
      fMRI food-cue evidence supports a distinct cortical sensory-processing
      activation pattern in the sensory-sensitivity ARFID phenotype.
- name: Low Appetite and Lack of Interest in Eating
  description: >-
    The low-interest/inappetence presentation: blunted hunger and interoceptive
    drive with an apparent lack of interest in eating, easy satiety, and
    forgetting to eat. Greater lack-of-interest severity tracks with lower
    hypothalamic activation to food cues, and reduced anticipatory food reward
    (diminished anticipatory pleasure) is specifically associated with the
    lack-of-interest profile rather than with generalized anhedonia.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Enteroendocrine cell
    term:
      id: CL:0000164
      label: enteroendocrine cell
  biological_processes:
  - preferred_term: Regulation of appetite
    term:
      id: GO:0032098
      label: regulation of appetite
    modifier: ABNORMAL
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: >-
      Low appetite / lack of interest is modeled as a second upstream driver of
      restricted intake.
  evidence:
  - reference: PMID:39623765
    reference_title: "Neural correlates of children with avoidant restrictive food intake disorder symptoms: large-scale neuroanatomical analysis of a paediatric population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterised by a lack of interest and motivation to eat
    explanation: >-
      Population-cohort neuroimaging study characterizes ARFID by a lack of
      interest and motivation to eat, supporting the inappetence driver.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      greater lack of interest was associated with lower hypothalamus
      activation in the ARFID-lack of interest group
    explanation: >-
      fMRI evidence links greater lack-of-interest severity to reduced
      appetite-region (hypothalamus) activation.
  - reference: PMID:37950288
    reference_title: "Anticipatory and consummatory pleasure in avoidant/restrictive food intake disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      greater endorsement of the lack of interest in food profile was related
      to lower anticipatory pleasure
    explanation: >-
      Clinical case-control evidence links the lack-of-interest profile
      specifically to reduced anticipatory (reward) pleasure, supporting a
      low-food-reward mechanism for the inappetence driver.
  - reference: PMID:37950288
    reference_title: "Anticipatory and consummatory pleasure in avoidant/restrictive food intake disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ARFID group reported significantly lower anticipatory and
      consummatory pleasure compared to HCs, but these differences were no
      longer significant after controlling for depression
    explanation: >-
      The same study shows the low-pleasure signal is not a generalized
      anhedonia (it attenuates after adjusting for depression), constraining
      the mechanism to food-specific, lack-of-interest-linked reward.
- name: Fear of Aversive Consequences of Eating
  description: >-
    The fear-driven presentation: conditioned avoidance following (or in
    anticipation of) an aversive eating event such as choking, vomiting, or
    pain, often emerging later than the other presentations. Documented
    precipitants include gastrointestinal disease and symptoms (a major
    antecedent in adults with GI disorders, where food-symptom associations
    drive restriction) and food allergy (fear of an allergic reaction). Youth
    with this phenotype show heightened amygdala (fear-circuit) activation to
    food cues.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: Amygdalar neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Behavioral fear response
    term:
      id: GO:0001662
      label: behavioral fear response
    modifier: INCREASED
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: >-
      Fear of aversive consequences is modeled as a third upstream driver of
      restricted intake.
  evidence:
  - reference: PMID:38849953
    reference_title: "Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      related to any adverse consequences of eating
    explanation: >-
      Narrative-review evidence identifies fear of adverse consequences of
      eating as a distinct driver of avoidance in ARFID.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ARFID-fear group showed greater amygdala activation vs HC
    explanation: >-
      fMRI evidence supports fear-circuit (amygdala) hyperactivation in the
      fear-of-aversive-consequences ARFID phenotype.
  - reference: PMID:40568462
    reference_title: "Avoidant/Restrictive Food Intake Disorder in Adult Patients with Gastrointestinal Diseases: A Concept Analysis Using Evolutionary Approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antecedents include gastrointestinal diseases and symptoms, traumatic
      events and experiences, dietary adversities history, and nutritional
      misconceptions.
    explanation: >-
      Concept-analysis evidence in adults with GI disease identifies
      gastrointestinal disease/symptoms and prior aversive experiences as
      antecedents of ARFID-type restriction, supporting the aversive-consequence
      driver beyond pediatric samples.
  - reference: PMID:39275348
    reference_title: "Development and Management of Avoidant/Restrictive Food Intake Disorder and Food Neophobia in Pediatric Patients with Food Allergy: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the fear of allergic reactions exacerbates avoidance and restrictive
      patterns
    explanation: >-
      Review evidence in food-allergic children supports fear of an allergic
      reaction as a precipitant that amplifies avoidant/restrictive eating.
- name: Neurodevelopmental and Anxiety-Disorder Comorbidity
  description: >-
    ARFID co-occurs at high rates with autism spectrum disorder, ADHD, and
    anxiety disorders. This neurodevelopmental/anxious liability is modeled as
    a modifying context that amplifies the sensory-sensitivity and fear-driven
    presentations rather than as a downstream consequence.
  biological_scale: ORGANISM
  downstream:
  - target: Sensory Sensitivity and Food Selectivity
    description: >-
      Autism-associated sensory hyperreactivity is modeled as amplifying the
      sensory-sensitivity driver.
  - target: Fear of Aversive Consequences of Eating
    description: >-
      Anxiety-disorder liability is modeled as amplifying the fear-driven
      presentation.
  evidence:
  - reference: PMID:36527163
    reference_title: "What do we know about the epidemiology of avoidant/restrictive food intake disorder in children and adolescents? A systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Psychiatric comorbidity was common, especially anxiety disorders
      (9.1%-72%) and autism spectrum disorder (8.2%-54.75%).
    explanation: >-
      Systematic-review evidence supports high anxiety-disorder and autism
      comorbidity in children and adolescents with ARFID.
- name: Restriction and Avoidance of Food Intake
  description: >-
    The convergent core behavior: persistent avoidance or restriction of food
    intake reached by any of the three drivers, critically without the drive
    for thinness, fear of weight gain, or body-image disturbance that defines
    anorexia nervosa. This absence of weight/shape motivation is the defining
    contrast with anorexia nervosa. The three drivers are dimensional and
    frequently co-occur rather than being mutually exclusive subtypes: an
    empirical latent-class analysis of 319 children/adolescents found a mixed
    (combined) presentation to be the single most common class.
  biological_scale: ORGANISM
  downstream:
  - target: Failure to Meet Nutritional and Energy Needs
    description: >-
      Restricted/avoidant intake is modeled upstream of nutritional and energy
      failure.
  - target: Restrictive Eating
    description: >-
      The pathophysiologic restriction behavior maps to the clinical
      restrictive-eating phenotype.
  evidence:
  - reference: PMID:38849953
    reference_title: "Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      without the intention of losing weight and concerns of body image
    explanation: >-
      Narrative-review evidence supports the defining feature that ARFID
      restriction occurs without weight-loss intent or body-image concern,
      distinguishing it from anorexia nervosa.
  - reference: PMID:36723946
    reference_title: "Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with fear of weight gain as an exclusion
    explanation: >-
      The twin-study ARFID phenotype definition explicitly excludes fear of
      weight gain, reinforcing the absence of weight/shape motivation.
  - reference: PMID:38333539
    reference_title: "Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LCA revealed four distinct classes which were labelled as Fear subtype,
      Lack of Interest subtype, Sensory subtype, and Combined subtype.
    explanation: >-
      National-surveillance latent-class analysis empirically recovers the
      three DSM-5 drivers plus a combined class, supporting the convergent
      multi-driver model of ARFID restriction.
  - reference: PMID:38333539
    reference_title: "Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Combined Subtype, a mixed presentation was the most common.
    explanation: >-
      The most common empirically identified class was a mixed/combined
      presentation, indicating the three drivers are overlapping dimensions
      rather than mutually exclusive subtypes.
- name: Failure to Meet Nutritional and Energy Needs
  description: >-
    The restricted intake produces persistent failure to meet nutritional
    and/or energy needs, manifest as significant weight loss or faltering
    growth, nutritional deficiency, dependence on enteral feeding or oral
    supplements, and/or marked psychosocial impairment.
  biological_scale: ORGANISM
  downstream:
  - target: Weight Loss
    description: Nutritional/energy failure manifests as weight loss.
  - target: Feeding Difficulties
    description: Restricted range and amount of food eaten manifests clinically as feeding difficulty.
  - target: Poor Appetite
    description: Low interest/appetite is a clinical manifestation of the inappetence driver.
  evidence:
  - reference: PMID:36723946
    reference_title: "Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an extremely limited range and/or amount of food eaten, resulting in the
      persistent failure to meet nutritional and/or energy needs
    explanation: >-
      Twin-study evidence supports restricted intake producing persistent
      failure to meet nutritional and energy needs.

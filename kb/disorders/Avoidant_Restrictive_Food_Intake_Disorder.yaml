treatments:
- name: Cognitive-Behavioral Therapy for ARFID (CBT-AR)
  description: >-
    CBT adapted for ARFID (CBT-AR) applies inhibitory-learning principles and
    repeated food exposure across all three presentations; open-trial evidence
    reports reduced ARFID severity, increased dietary variety, and weight gain
    in underweight patients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive behavior therapy for ARFID (CBT-AR)
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:38849953
    reference_title: "Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients also exhibited increased variety in their food consumption,
      incorporating new foods into their routines following treatment
    explanation: >-
      Narrative-review evidence supports CBT-AR increasing dietary variety and
      food acceptance in ARFID.
- name: Family-Based Treatment (FBT-ARFID)
  description: >-
    Family-based treatment adapted for ARFID trains caregivers as agents of
    behavioral change to support renourishment and expansion of accepted foods,
    particularly in children and adolescents.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Family Therapy
    term:
      id: NCIT:C93347

  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: related to any adverse consequences of eating
    explanation: Narrative-review evidence identifies fear of adverse consequences of eating as a distinct driver of avoidance in ARFID.
  - reference: PMID:39964683

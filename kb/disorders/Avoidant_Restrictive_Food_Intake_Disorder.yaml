    explanation: Review evidence in food-allergic children supports fear of an allergic reaction as a precipitant that amplifies avoidant/restrictive eating.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, within the ARFID-fear group, the PARDI fear of aversive consequences subscale was not significantly associated with amgydala activation.  # codespell:ignore amgydala

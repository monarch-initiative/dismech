- name: Restriction and Avoidance of Food Intake
  description: 'The convergent core behavior: persistent avoidance or restriction of food intake reached by any of the three drivers, critically without the drive for thinness, fear of weight gain, or body-image disturbance that defines anorexia nervosa. This absence of weight/shape motivation is the defining contrast with anorexia nervosa. The three drivers are dimensional and frequently co-occur rather than being mutually exclusive subtypes: an empirical latent-class analysis of 319 children/adolescents found a mixed (combined) presentation to be the single most common class.'
  biological_scale: ORGANISM
  downstream:
  - target: Failure to Meet Nutritional and Energy Needs
    description: Restricted/avoidant intake is modeled upstream of nutritional and energy failure.
  - target: Restrictive Eating
    description: The pathophysiologic restriction behavior maps to the clinical restrictive-eating phenotype.
  - target: Feeding Difficulties
    description: Restricted range and amount of food manifest as feeding difficulties.
  - target: Psychosocial Impairment Related to Eating
    description: Avoidance of food and eating situations can impair social participation and family functioning.
  evidence:
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: without the intention of losing weight and concerns of body image
    explanation: Narrative-review evidence supports the defining feature that ARFID restriction occurs without weight-loss intent or body-image concern, distinguishing it from anorexia nervosa.
  - reference: PMID:36723946
    reference_title: Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: with fear of weight gain as an exclusion
    explanation: The twin-study ARFID phenotype definition explicitly excludes fear of weight gain, reinforcing the absence of weight/shape motivation.
  - reference: PMID:38333539
    reference_title: 'Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: LCA revealed four distinct classes which were labelled as Fear subtype, Lack of Interest subtype, Sensory subtype, and Combined subtype.
    explanation: National-surveillance latent-class analysis empirically recovers the three DSM-5 drivers plus a combined class, supporting the convergent multi-driver model of ARFID restriction.
  - reference: PMID:38333539
    reference_title: 'Subtypes of avoidant/restrictive food intake disorder in children and adolescents: a latent class analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Combined Subtype, a mixed presentation was the most common.
    explanation: The most common empirically identified class was a mixed/combined presentation, indicating the three drivers are overlapping dimensions rather than mutually exclusive subtypes.
  notes: The latent-class study used clinician-reported secondary-care cases in the UK and Republic of Ireland, without independent PARDI confirmation. Its combined class chiefly mixed sensory sensitivity and lack of interest; the observed proportions are not population-wide subtype prevalence.
- name: Failure to Meet Nutritional and Energy Needs
  description: Inadequate energy or nutrient intake can cause weight loss, growth faltering and nutrient deficiencies. Severe or prolonged undernutrition can impair cardiovascular, gastrointestinal, skeletal and pubertal function. These consequences vary with the degree and pattern of restriction; ARFID can also present through psychosocial impairment without low weight.
  biological_scale: ORGANISM
  downstream:

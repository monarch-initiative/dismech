    snippet: These behaviors are not limited to the avoidance of allergens but may extend to normally tolerated foods.
    explanation: 'Full text of PMID:39275348 (Development and Management of Avoidant/Restrictive Food Intake Disorder and Food Neophobia in Pediatric Patients with Food Allergy: A Comprehensive Review.) retrieved through PMC/BioC. The review distinguishes generalized avoidance from avoidance of confirmed allergens; it does not justify exposure to an allergen as ARFID treatment.'

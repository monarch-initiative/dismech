genetic:
- name: ADCY3 association with avoidant/restrictive food-intake traits
  gene_term:
    preferred_term: ADCY3
    term:
      id: hgnc:234
      label: ADCY3
  relationship_type: UNKNOWN
  association: Genome-wide association with an ARFI-clinical trait definition; relationship to formally diagnosed ARFID remains unresolved
  notes: The Norwegian MoBa study identified rs11676272 and a gene-based ADCY3 association for mother-reported avoidant/restrictive eating with clinical indicators at age 3 or 8. Its definition did not assess all ARFID diagnostic requirements, including fear of aversive consequences, psychosocial impairment and several exclusion criteria. Ancestry, ascertainment, replication and causal mechanism limit translation to ARFID; no Mendelian inheritance or molecular loss/gain of function is inferred.
  evidence:
  - reference: PMID:41284261
    reference_title: Prevalence, Characteristics, and Genetic Architecture of Avoidant/Restrictive Food Intake Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One gene, ADCY3, located on chromosome 2, was associated with ARFI-clinical at 3 or 8 years
    explanation: Gene-based association after multiple-testing correction; the phenotype is explicitly narrower in diagnostic ascertainment than ARFID.
  - reference: PMID:41284261
    reference_title: Prevalence, Characteristics, and Genetic Architecture of Avoidant/Restrictive Food Intake Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, phenotypes should not be interpreted as ARFID diagnoses, but as ARFID traits, accompanied by additional co-occurring indicators of clinical significance for ARFI-clinical.
    explanation: Authors explicitly limit the diagnostic interpretation of the association.
  - reference: PMID:41284261
    reference_title: Prevalence, Characteristics, and Genetic Architecture of Avoidant/Restrictive Food Intake Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Future studies are needed to replicate associations between individual genetic variants and avoidant/restrictive eating and investigate the biological mechanisms underlying these associations.
    explanation: No specific ARFID causal mechanism or clinically validated genetic test is established.
- name: Locus near ZSWIM6 associated with an ARFID risk score in autism
  gene_term:
    preferred_term: ZSWIM6
    term:
      id: hgnc:29316
      label: ZSWIM6
  relationship_type: UNKNOWN
  association: Nearest-gene annotation of a genome-wide signal for an algorithm-derived ARFID score in autistic probands
  notes: The SPARK analysis found rs13177031 near ZSWIM6 using an eating-behavior score trained on reported ARFID diagnoses. Genotyped probands were of European ancestry; the score was not an independently confirmed ARFID diagnosis. Physical proximity does not establish ZSWIM6 as the regulatory target or causal gene. Other reported loci did not reach genome-wide significance and are not treated as established associations.
  evidence:
  - reference: PMID:34177659
    reference_title: Estimating the Prevalence and Genetic Risk Mechanisms of ARFID in a Large Autism Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One SNP on chromosome 5, rs13177031 (p = 1.6 × 10−8), reached genome wide significance
    explanation: Genome-wide association with the proband risk score, not a Mendelian disease variant.
  - reference: PMID:34177659
    reference_title: Estimating the Prevalence and Genetic Risk Mechanisms of ARFID in a Large Autism Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genome-wide association revealed a single hit near ZSWIM6, a gene previously implicated in neurodevelopmental conditions.
    explanation: Nearest-gene annotation only; neither variant-to-gene regulation nor a causal ARFID role was demonstrated.
  - reference: PMID:34177659
    reference_title: Estimating the Prevalence and Genetic Risk Mechanisms of ARFID in a Large Autism Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: it was not well-situated to conclusively distinguish ARFID risk factors from those of other eating disorders.
    explanation: The study acknowledges diagnostic specificity limitations of self- and parent-reported phenotyping.
prevalence:
- population: Non-clinical samples of children and adolescents
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 300.0
  rate_high: 15500.0
  notes: Range across heterogeneous non-clinical pediatric studies, 0.3%-15.5% (300-15,500 per 100,000); not a pooled prevalence or a confidence interval. Studies mixed diagnostic interviews and screening questionnaires. The lower estimate was six-month prevalence in Taiwanese schoolchildren, while the two highest estimates came from parent questionnaires that did not assess DSM-5 exclusion criteria.
  evidence:
  - reference: PMID:36527163
    reference_title: What do we know about the epidemiology of avoidant/restrictive food intake disorder in children and adolescents? A systematic review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Studies from non-clinical samples reported ARFID prevalence estimates ranging from 0.3% to 15.5%.
    explanation: Reported range across separate studies, not a pooled estimate; the lower endpoint must not be presented as the point prevalence.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC10108140/
    reference_title: What do we know about the epidemiology of avoidant/restrictive food intake disorder in children and adolescents? A systematic review of the literature - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The two studies that reported the highest prevalence in community samples (i.e., 10.9% and 15.5%) used instruments that did not include items assessing the DSM‐5 exclusion criteria in the parent questionnaires.
    explanation: The full-text methodological caveat prevents interpreting the upper screening estimates as confirmed diagnostic prevalence.
  measure_type: UNKNOWN

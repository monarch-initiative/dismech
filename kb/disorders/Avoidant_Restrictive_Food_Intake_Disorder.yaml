pathophysiology:
- name: Multifactorial Genetic and Environmental Liability
  description: 'A Swedish twin study estimated substantial genetic liability for a broad childhood ARFID phenotype defined from parent reports and health registers. Its best-fitting model estimated heritability of 0.79 (95% CI 0.70-0.85) and a nonshared environmental contribution of 0.21 (95% CI 0.15-0.30). Ascertainment emphasized sensory restriction, did not directly assess every diagnostic exclusion, and included a sibling-contrast parameter. These estimates do not identify causal genes or establish equal heritability across ages and ARFID presentations. Common-variant studies also support genetic contributions to avoidant/restrictive eating, but use different ascertainment: ARFI traits in a Norwegian population cohort and an algorithm-derived risk score in an autism cohort. Neither establishes a single causal pathway or a diagnostic genetic test for ARFID.'
  biological_scale: ORGANISM
  downstream:
  - target: Sensory Sensitivity and Food Selectivity
    description: Conceptual placement of shared liability upstream of this presentation; the twin study did not estimate presentation-specific genetic effects.
  - target: Low Appetite and Lack of Interest in Eating
    description: Conceptual placement of shared liability upstream of this presentation; the twin study did not estimate presentation-specific genetic effects.
  - target: Fear of Aversive Consequences of Eating
    description: Conceptual placement of shared liability upstream of this presentation; the twin study did not estimate presentation-specific genetic effects.
  evidence:
  - reference: PMID:36723946
    reference_title: Etiology of the Broad Avoidant Restrictive Food Intake Disorder Phenotype in Swedish Twins Aged 6 to 12 Years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The heritability of ARFID was 0.79 (95% CI, 0.70-0.85), with significant contributions from nonshared environmental factors (0.21; 95% CI, 0.15-0.30).
    explanation: Estimate for a broadly defined phenotype in Swedish twins aged 6-12 years; this is population-level variance partitioning, not individual risk or molecular evidence of a polygenic mechanism.
  - reference: PMID:41284261
    reference_title: Prevalence, Characteristics, and Genetic Architecture of Avoidant/Restrictive Food Intake Phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SNV heritability (SNV-h2) estimates on the liability scale ranged from 8% to 16%
    explanation: Common-variant estimates for parent-reported restrictive-eating phenotypes; these are not directly comparable with the Swedish twin heritability estimate.
  - reference: PMID:34177659
    reference_title: Estimating the Prevalence and Genetic Risk Mechanisms of ARFID in a Large Autism Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'the proband ARFID Score was estimated to have significant SNP h2 of 0.45 (95% CI: 0.13–0.76)'
    explanation: Estimate for an algorithm-derived score in autistic probands, with a wide interval; it is not heritability of clinically diagnosed ARFID in the general population.
- name: Sensory Sensitivity and Food Selectivity
  description: Sensory-based avoidance of food limits accepted variety. A fasting visual-food-cue fMRI study found higher anterior cingulate and sensory association cortex activation in the sensory-sensitivity group, but no greater insula activation than healthy controls. These are brain-region associations from a passive viewing task, not evidence of taste-receptor-cell dysfunction or a proven causal sensory circuit. Full and subthreshold ARFID were included, and phenotype groups overlapped.
  biological_scale: ORGANISM
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: Sensory aversion is modeled as one upstream driver of the core restriction/avoidance behavior.
  evidence:
  - reference: PMID:38849953
    reference_title: 'Avoidant restrictive food intake disorder: recent advances in neurobiology and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with ARFID may limit food variety and intake due to avoidance based on the sensory characteristics of the food
    explanation: Narrative-review evidence supports sensory-based avoidance as one of the core drivers of restricted intake in ARFID.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ARFID-sensory sensitivity group did not show greater insula activation vs HC but showed greater activation of the ACC
    explanation: fMRI food-cue evidence supports a distinct cortical sensory-processing activation pattern in the sensory-sensitivity ARFID phenotype.
- name: Low Appetite and Lack of Interest in Eating
  description: Low interest in eating, low hunger and early satiation can limit intake. Within the lack-of-interest phenotype group, greater symptom severity correlated with lower right hypothalamus activation during a fasting visual-food-cue task. The group did not show lower hypothalamus activation than healthy controls overall. This cross-sectional association does not establish hypothalamic dysfunction as the cause of restriction or identify the responsible endocrine cell type. In a separate self-report study, ARFID severity correlated with lower anticipatory pleasure even after food items were removed. This broader reward association and the contribution of depressive symptoms do not establish a food-specific reward defect or its causal direction.
  biological_scale: ORGANISM
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: Low appetite / lack of interest is modeled as a second upstream driver of restricted intake.
  - target: Poor Appetite
    description: The low-interest/appetite presentation has poor appetite as a clinical manifestation.
  evidence:
  - reference: PMID:34423319
    reference_title: Cognitive-behavioral therapy for adults with avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: including sensory sensitivity, lack of interest in eating or food, and fear of aversive consequences.
    explanation: The structured interview assesses lack of interest as one presentation; ARFID as a whole is not limited to low appetite.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: greater lack of interest was associated with lower hypothalamus activation in the ARFID-lack of interest group
    explanation: Within-group association between symptom severity and lower right hypothalamus response; the lack-of-interest group did not differ from controls overall.
  - reference: PMID:37950288
    reference_title: Anticipatory and consummatory pleasure in avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: greater endorsement of the lack of interest in food profile was related to lower anticipatory pleasure
    explanation: Exploratory association with self-reported anticipatory pleasure, including analyses without food items. The full-scale profile association was not significant after covariate adjustment; this is not proof of a food-specific reward mechanism.
  - reference: PMID:37950288
    reference_title: Anticipatory and consummatory pleasure in avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ARFID group reported significantly lower anticipatory and consummatory pleasure compared to HCs, but these differences were no longer significant after controlling for depression
    explanation: The case-control difference attenuated with adjustment for depression and BMI. Neither this negative result nor removal of food questions proves the absence of generalized anhedonia.
  - reference: PMID:39964683
    reference_title: Neural Response to Food Cues in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Contrary to hypotheses, at the ROI level, the ARFID–lack of interest group did not show lower hypothalamus activation vs HC while viewing food (vs nonfood) images.
    explanation: The within-group severity correlation must not be represented as a case-control hypothalamic deficit.
  - reference: PMID:37950288
    reference_title: Anticipatory and consummatory pleasure in avoidant/restrictive food intake disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Within the ARFID sample, individuals with more severe ARFID reported less anticipatory pleasure, even after removing questions about enjoyment of food.
    explanation: The severity association extends beyond food-related questionnaire items; the cross-sectional study cannot resolve whether altered pleasure precedes or follows ARFID.
  notes: Appetite-hormone studies provide a possible biological correlate, summarized under biochemical findings. They measure circulating hormones, not pathology of enteroendocrine cells, and do not establish hormone dysregulation as an initiating cause. Several neuroimaging, pleasure, endocrine and course papers draw from the same NIMH-funded ARFID cohort and should not be treated as independent replications.
- name: Fear of Aversive Consequences of Eating
  description: Fear of choking, vomiting, pain or another aversive consequence can maintain food avoidance. In a fasting visual-food-cue study, participants with the fear phenotype showed greater left-amygdala activation than healthy controls at the region-of-interest level. Fear severity did not correlate significantly with amygdala activation, and the phenotype contrast was not significant in the whole-brain analysis. Findings are associations and do not establish a specific neuronal subtype or prove that a prior adverse event caused the observed response.
  biological_scale: ORGANISM
  downstream:
  - target: Restriction and Avoidance of Food Intake
    description: Fear of aversive consequences is modeled as a third upstream driver of restricted intake.

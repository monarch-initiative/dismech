      Narrative-review evidence supports off-label mirtazapine as an
      appetite-stimulating agent used in ARFID.
differential_diagnoses:
- name: Anorexia Nervosa
  description: >-
    Anorexia nervosa also involves restricted intake and low weight, but is
    driven by fear of weight gain and body-image disturbance — the motivation
    that ARFID lacks. A minority of ARFID cases cross over to anorexia nervosa.
  distinguishing_features:
  - >-
    ARFID restriction occurs without drive for thinness, fear of weight gain, or
    body-image disturbance; anorexia nervosa is defined by exactly this
    weight/shape motivation.
  disease_term:
    preferred_term: anorexia nervosa
    term:
      id: MONDO:0005351
      label: anorexia nervosa
  evidence:
  - reference: PMID:38718975
    reference_title: Prospective 2-Year Course and Predictors of Outcome in Avoidant/Restrictive Food Intake Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      half the participants persisted with their original diagnosis, and 3% of
      participants experienced a diagnostic shift to anorexia nervosa
    explanation: >-
      Prospective-course evidence supports anorexia nervosa as a distinct
      diagnosis with only a small ARFID-to-AN diagnostic crossover.
- name: Pica
  description: >-
    Pica also involves abnormal eating without body-image disturbance, but is
    defined by ingestion of non-nutritive, non-food substances rather than by
    restriction/avoidance of normal food.
  distinguishing_features:
  - >-
    ARFID is defined by restriction/avoidance of food intake; pica is defined by
    persistent ingestion of non-nutritive, non-food substances.
  disease_term:
    preferred_term: pica disease
    term:
      id: MONDO:0001441
      label: pica disease

environmental:
- name: Aedes mosquito exposure
  exposure_term:
    preferred_term: viral exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  description: >-
    Living in or travelling through areas with infected Aedes mosquitoes triggers
    the mosquito-bite route into acquired ZIKV infection.
  effect: Increases risk of mosquito-borne ZIKV infection.
  notes: >-
    The binding intentionally uses ECTO:3000001 for the infective viral
    exposure rather than a mosquito-specific exposure term. Local searches of
    ECTO for `l~mosquito` found no term, and `l~arthropod` returned only
    taxonomy/anatomy hits rather than an exposure class.
  influences_mechanisms:
  - target: Cutaneous Inoculation and Local ZIKV Replication
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The infected mosquito bite deposits ZIKV into the skin.
    evidence:
    - reference: PMID:39472938
      reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This virus is primarily spread by mosquitoes, especially those belonging to the Aedes genus"
      explanation: Supports Aedes mosquito exposure as the trigger for cutaneous inoculation.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aedes aegypti is considered the primary vector for outbreaks in the Americas, the Pacific, and Asia"
    explanation: Supports the geographic outbreak risk mediated by Aedes mosquito exposure.
treatments:
- name: Supportive Care
  description: >-
    No ZIKV-specific antiviral or publicly available vaccine exists; treatment
    of uncomplicated acute infection is supportive.

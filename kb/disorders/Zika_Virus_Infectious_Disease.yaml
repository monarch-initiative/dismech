name: Zika Virus Infectious Disease
creation_date: "2026-11-14T00:00:00Z"
category: Infectious Disease
description: >-
  Zika virus infectious disease is an acquired arboviral flavivirus infection
  caused by Zika virus and transmitted to humans primarily by Aedes mosquitoes,
  with additional sexual, blood-borne and vertical routes. Most infections are
  asymptomatic or mild; symptomatic acute disease follows a short incubation and
  presents with fever, maculopapular rash, arthralgia, myalgia, conjunctivitis
  and headache that usually resolve within a week. The entry represents the
  acquired maternal, vector-borne, sexual and transfusion-transmitted infection;
  congenital fetal disease after transplacental transmission is curated
  separately in Congenital Zika Syndrome.
disease_term:
  preferred_term: Zika virus infectious disease
  term:
    id: MONDO:0018661
    label: Zika virus infectious disease
parents:
- Flaviviridae infectious disease
- Vector-borne disease
synonyms:
- Zika virus infection
- Zika virus disease
- Zika
- ZIKV infection
has_subtypes:
- name: Congenital Zika syndrome
  display_name: Congenital Zika Syndrome
  classification: congenital_timing_and_organ_system
  curated_in: Congenital_Zika_Syndrome
  subtype_term:
    preferred_term: Zika virus congenital syndrome
    term:
      id: MONDO:0000890
      label: Zika virus congenital syndrome
  description: >-
    Fetal infection after transplacental ZIKV transmission has a distinct tempo
    and organ target: virus crosses the maternal-fetal interface during
    pregnancy, infects the developing fetal CNS, and produces a congenital
    cortical-malformation syndrome rather than the self-limited
    rash-fever-arthralgia illness typical of acquired postnatal infection. That
    syndrome is curated as its own disorder entry.
  evidence:
  - reference: PMID:33320867
    reference_title: "Congenital Zika syndrome: A systematic review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Zika virus infection during pregnancy can cause a series of changes in the
      growth and development of children, while impacting the healthcare system
      due to the severity of cases.
    explanation: >-
      Identifies congenital Zika syndrome as the fetal disease caused by ZIKV
      infection in pregnancy.
infectious_agent:
- name: Zika virus
  infectious_agent_term:
    preferred_term: Zika virus
    term:
      id: NCBITaxon:64320
      label: Zika virus
  description: >-
    Zika virus is a positive-sense, single-stranded RNA flavivirus carried by
    Aedes mosquitoes.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Zika virus (ZIKV) is classified within the Flavivirus genus of the Flaviviridae family and is categorized as an arbovirus."
    explanation: Grounds the NCBITaxon-bound infectious agent as the Zika flavivirus.
agent_life_cycle:
  description: >-
    ZIKV is maintained in enzootic non-human-primate and mosquito cycles and can
    spill into an epidemic human cycle driven by urban Aedes mosquitoes; humans
    then act as viremic hosts that infect mosquitoes and, less commonly, transmit
    the virus sexually, through blood products or across the placenta. The
    cosmopolitan Aedes aegypti and Aedes albopictus vectors are the major
    epidemic vectors in the Americas, Asia and the Pacific, while Aedes hensilli
    was the predominant mosquito identified during the 2007 Yap Island outbreak.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: viremic host
  - preferred_term: Aedes aegypti
    term:
      id: NCBITaxon:7159
      label: Aedes aegypti
    role: epidemic vector
  - preferred_term: Aedes albopictus
    term:
      id: NCBITaxon:7160
      label: Aedes albopictus
    role: epidemic vector
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aedes aegypti and Aedes albopictus are regarded as significant transmitters of ZIKV"
    explanation: Identifies the two Aedes species curated as epidemic vectors.
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We estimated that 73% (95% confidence interval, 68 to 77) of Yap residents
      3 years of age or older had been recently infected with Zika virus. Aedes
      hensilli was the predominant mosquito species identified.
    explanation: >-
      Names the Pacific Aedes species recovered as the predominant mosquito
      during the 2007 Yap Island ZIKV outbreak.
transmission:
- name: Aedes mosquito-borne transmission
  description: >-
    Infected Aedes mosquitoes are the dominant route by which ZIKV reaches
    humans during outbreaks.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This virus is primarily spread by mosquitoes, especially those belonging to the Aedes genus"
    explanation: Supports Aedes mosquitoes as the primary transmission route.
- name: Sexual transmission
  description: >-
    ZIKV can persist in semen and can be transmitted by sexual contact, allowing
    infection outside direct vector exposure.
  evidence:
  - reference: PMID:25625872
    reference_title: Potential sexual transmission of Zika virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Replicative ZIKV particles were found in the 2 semen samples but none were detected in the urine sample."
    explanation: >-
      Recovery of replication-competent virus from semen supplies a plausible
      human route for sexual transmission after acute infection.
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the virus can also be transmitted through blood, vertical mother-to-child, and sexual contact"
    explanation: Names sexual contact as a non-vector route of human ZIKV transmission.
- name: Blood-borne transmission
  description: >-
    Asymptomatic viremic donors can introduce ZIKV into blood products, making
    transfusion a documented non-vector transmission risk.
  evidence:
  - reference: PMID:24739982
    reference_title: >-
      Potential for Zika virus transmission through blood transfusion
      demonstrated during an outbreak in French Polynesia, November 2013 to
      February 2014.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "42 (3%) of 1,505 blood donors, although asymptomatic at the time of blood donation, were found positive for ZIKAV by PCR"
    explanation: >-
      Documents occult ZIKV RNA in asymptomatic blood donors during the French
      Polynesian outbreak, the prerequisite for transfusion transmission.
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the virus can also be transmitted through blood, vertical mother-to-child, and sexual contact"
    explanation: Names blood as a non-vector route of human ZIKV transmission.
- name: Vertical transmission during pregnancy
  description: >-
    Maternal ZIKV infection can cross the placenta to the fetus and initiate
    congenital Zika syndrome.
  evidence:
  - reference: PMID:26862926
    reference_title: "Zika Virus Associated with Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ZIKV was found in the fetal brain tissue on reverse-transcriptase-polymerase-chain-reaction (RT-PCR) assay, with consistent findings on electron microscopy."
    explanation: >-
      Detection of ZIKV in fetal brain after maternal symptomatic infection
      establishes completion of the vertical route.
progression:
- phase: Incubation
  incubation_days: "3-14"
  notes: The symptomatic incubation period is measured in days after infection.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incubation period of ZIKV infection in humans is estimated to span from 3 to 14 days"
    explanation: Gives the incubation window for acute ZIKV infection in humans.
- phase: Acute rash-fever illness
  duration_days: 2-7
  notes: >-
    Most infections remain asymptomatic; the minority of symptomatic cases are
    usually mild and self-limited.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is estimated that 20–25% of people infected with ZIKV exhibit
      noticeable symptoms ... They exhibit the following symptoms: fatigue ...
      arthralgia ... temporary and moderate fever ... accompanied by
      maculopapular, itchy rashes
    explanation: >-
      Places the phenotype frequencies on a symptomatic-case denominator by
      showing that most ZIKV infections do not produce noticeable acute
      symptoms.
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "severe illness and case fatality rates associated with ZIKV infection are remarkably low, and the symptoms of the illness typically abate within a relatively short timeframe of 2–7 days"
    explanation: Supports the usual self-limited acute duration.
- phase: Post-infectious and congenital complications
  notes: >-
    A minority of infections are followed by neurologic autoimmunity in the
    infected person; infections during pregnancy can instead seed the fetal
    compartment and cause the separate congenital syndrome.
  evidence:
  - reference: PMID:26948433
    reference_title: "Guillain-Barré Syndrome outbreak associated with Zika virus infection in French Polynesia: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (88%) had a recent history of viral syndrome, in median 6 days prior to the onset of neurological manifestations."
    explanation: >-
      Places ZIKV-like viral illness before neurologic onset in the outbreak GBS
      series.
  - reference: PMID:26862926
    reference_title: "Zika Virus Associated with Microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The complete genome of ZIKV was recovered from the fetal brain."
    explanation: Supports fetal disease as a complication of maternal ZIKV infection.
prevalence:
- population: Yap Island residents age 3 years or older, 2007 outbreak
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 73000.0
  notes: >-
    Household-serosurvey estimate of recent infection during the Yap Island
    outbreak; this is an outbreak-period, IgM-informed seroprevalence estimate
    for a highly exposed island population rather than a standing global
    prevalence for endemic transmission.
  evidence:
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We estimated that 73% (95% confidence interval, 68 to 77) of Yap residents
      3 years of age or older had been recently infected with Zika virus.
    explanation: >-
      Gives the recent-infection seroprevalence estimate used for the
      outbreak-period prevalence row.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Acquired ZIKV infection is usually asymptomatic or mild and self-limited,
    with no Zika-attributed hospitalization, hemorrhage or death in the Yap
    outbreak, but a small fraction of infections are followed by neurologic
    autoimmunity and maternal viremia can seed the separate congenital fetal
    syndrome.
  evidence:
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rash, fever, arthralgia, and conjunctivitis were common symptoms. No
      hospitalizations, hemorrhagic manifestations, or deaths due to Zika virus
      were reported. We estimated that 73% (95% confidence interval, 68 to 77)
      of Yap residents 3 years of age or older had been recently infected with
      Zika virus.
    explanation: >-
      Directly reports the absence of hospitalizations, hemorrhagic
      manifestations and Zika-attributed deaths in the Yap outbreak that also
      produced a high recent-infection seroprevalence.
diagnosis:
- name: RNA and neutralizing-antibody confirmation
  description: >-
    Acute ZIKV infection is confirmed by finding Zika virus RNA in serum or a
    ZIKV-specific neutralizing-antibody response. IgM with a potentially
    cross-reactive neutralizing-antibody response supports probable disease but
    must be interpreted against dengue and other flavivirus cross-reactivity.
  evidence:
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Zika virus disease was confirmed by a finding of Zika virus RNA or a
      specific neutralizing antibody response to Zika virus in the serum.
    explanation: >-
      Defines the molecular or specific neutralization evidence used to confirm
      disease in the Yap outbreak.
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with IgM antibody against Zika virus who had a potentially
      cross-reactive neutralizing-antibody response were classified as having
      probable Zika virus disease.
    explanation: >-
      Captures the probable-case category driven by IgM plus potentially
      cross-reactive neutralization.
  - reference: PMID:19516034
    reference_title: "Zika virus outbreak on Yap Island, Federated States of Micronesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although serum from some patients had IgM antibody against dengue virus,
      the illness seemed clinically distinct from previously detected dengue.
    explanation: >-
      Documents the dengue-serology cross-reactivity problem that complicates
      ZIKV diagnosis in flavivirus-exposed populations.
pathophysiology:
- name: Cutaneous Inoculation and Local ZIKV Replication
  biological_scale: CELLULAR
  description: >-
    Mosquito inoculation deposits ZIKV into skin, where dermal fibroblasts,
    epidermal keratinocytes and skin-resident dendritic cells are permissive for
    entry and replication before systemic spread.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: viral entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
    modifier: INCREASED
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED
  evidence:
  - reference: PMID:26085147
    reference_title: Biology of Zika Virus Infection in Human Skin Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human dermal fibroblasts, epidermal keratinocytes, and immature dendritic cells are permissive to the most recent ZIKV isolate, responsible for the epidemic in French Polynesia"
    explanation: >-
      Primary human fibroblasts, keratinocytes and immature dendritic cells are
      the skin cell targets curated on this node.
  downstream:
  - target: ZIKV NS5-Mediated STAT2 Degradation
- name: ZIKV NS5-Mediated STAT2 Degradation
  conforms_to: innate_antiviral_interferon_response#Viral Interferon Antagonism and Innate Immune Evasion
  biological_scale: CELLULAR
  description: >-
    ZIKV nonstructural protein NS5 binds human STAT2 and induces its
    proteasomal degradation, suppressing type I interferon signaling that would
    otherwise induce an antiviral state in infected human cells.
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
    term:
      id: GO:0039502
      label: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:27212660
    reference_title: Zika Virus Targets Human STAT2 to Inhibit Type I Interferon Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ZIKV NS5 expression resulted in proteasomal degradation of the
      IFN-regulated transcriptional activator STAT2 from humans, but not mice
    explanation: >-
      Primary human-cell experiments identify ZIKV NS5 as a viral interferon
      antagonist that degrades STAT2.
  downstream:
  - target: Bloodstream Dissemination and Systemic Tropism
- name: Bloodstream Dissemination and Systemic Tropism
  biological_scale: ORGANISM
  description: >-
    Virus leaving the inoculation site produces a short viremic phase that
    disseminates ZIKV to immune, neural, urogenital and placental compartments,
    explaining acute systemic symptoms as well as sexual and vertical
    transmission.
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
    modifier: INCREASED
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After entering the body, the virus is disseminated to other parts of the body through the bloodstream"
    explanation: Describes viremic dissemination after initial infection.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Viremic systemic spread and infected-tissue innate immune activation drive
      the acute febrile illness.
  - target: Skin rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dissemination from the inoculation site produces the systemic
      rash-fever-arthralgia syndrome recorded in Yap and later outbreaks.
  - target: Arthralgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Bloodstream dissemination reaches joints and peripheral tissues, yielding
      the arthralgia component of acute ZIKV disease.
  - target: Myalgia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic infection and innate immune activation explain myalgia during
      acute ZIKV illness.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disseminated acute arboviral infection explains headache as a systemic
      symptom of the febrile illness.
  - target: Conjunctivitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Disseminated acute ZIKV infection explains non-purulent conjunctivitis as
      part of the classic rash-fever-arthralgia-conjunctivitis syndrome.
  - target: Post-ZIKV Guillain-Barre Predisposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Outbreak and case-control data link ZIKV infection with later
      immune-mediated peripheral neuropathy, but the exact cross-reactive target
      has not been established.
  - target: Transplacental Seeding of the Fetal Compartment
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Viremia in pregnancy precedes infection of decidual and chorionic cells
      that move virus into the fetal compartment.
- name: Post-ZIKV Guillain-Barre Predisposition
  biological_scale: ORGANISM
  description: >-
    ZIKV infection can precede Guillain-Barre syndrome, probably through
    post-infectious immune mechanisms analogous to other infection-triggered GBS
    routes; this entry records the acquired infection that triggers risk, while
    the peripheral-nerve autoimmune syndrome is curated in Guillain-Barre
    Syndrome.
  evidence:
  - reference: PMID:26948433
    reference_title: "Guillain-Barré Syndrome outbreak associated with Zika virus infection in French Polynesia: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The serological investigations conducted on the blood samples from the 42 patients who developed a GBS during the French Polynesian ZIKV outbreak confirm that all these patients have experienced ZIKV infection."
    explanation: >-
      Case-control serology links all 42 outbreak GBS cases to prior ZIKV
      infection.
- name: Transplacental Seeding of the Fetal Compartment
  biological_scale: TISSUE
  description: >-
    Maternal infection supplies the viremic source for ZIKV to cross the
    maternal-fetal interface, infect placental cells and reach the fetus; the
    fetal neural-progenitor cytopathy that produces cortical malformation is
    curated in Congenital Zika Syndrome.
  locations:
  - preferred_term: placenta
    term:
      id: UBERON:0001987
      label: placenta
  evidence:
  - reference: PMID:27443522
    reference_title: "Zika Virus Targets Different Primary Human Placental Cells, Suggesting Two Routes for Vertical Transmission."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that ZIKV spreads from basal and parietal decidua to chorionic villi and amniochorionic membranes and that targeting TIM1 could suppress infection at the uterine-placental interface."
    explanation: >-
      Primary human placental cell and explant data support maternal-fetal
      spread across the uterine-placental interface.

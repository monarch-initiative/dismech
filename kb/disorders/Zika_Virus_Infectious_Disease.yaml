review_notes: >-
  Congenital synonyms from the MONDO stub were intentionally kept out of this
  acquired-infection entry because MONDO:0000890 is already represented by
  Congenital_Zika_Syndrome. That entry is listed as a pointer subtype here to
  keep the acquired maternal infection, the vertical transmission route, and the
  downstream fetal disease connected without duplicating the fetal
  neural-progenitor mechanism. A covering grouping was not added because
  MONDO:0018661 is the acquired infection rather than a parent union, and the
  existing Congenital_Zika_Syndrome entry already covers the distinct fetal
  disease.

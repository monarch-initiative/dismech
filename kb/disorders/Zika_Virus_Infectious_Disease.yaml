environmental:
- name: Aedes mosquito exposure
  exposure_term:
    preferred_term: viral exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  description: >-
    Living in or travelling through areas with infected Aedes mosquitoes triggers
    the mosquito-bite route into acquired ZIKV infection.
  effect: Increases risk of mosquito-borne ZIKV infection.
  influences_mechanisms:
  - target: Cutaneous Inoculation and Local ZIKV Replication
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The infected mosquito bite deposits ZIKV into the skin.
    evidence:
    - reference: PMID:39472938
      reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This virus is primarily spread by mosquitoes, especially those belonging to the Aedes genus"
      explanation: Supports Aedes mosquito exposure as the trigger for cutaneous inoculation.
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aedes aegypti is considered the primary vector for outbreaks in the Americas, the Pacific, and Asia"
    explanation: Supports the geographic outbreak risk mediated by Aedes mosquito exposure.
treatments:
- name: Supportive Care
  description: >-
    No ZIKV-specific antiviral or publicly available vaccine exists; treatment
    of uncomplicated acute infection is supportive.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39472938
    reference_title: "Zika virus tropism and pathogenesis: understanding clinical impacts and transmission dynamics."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Currently, there is no specific treatment or publicly available vaccine for the ZIKV."
    explanation: Establishes the absence of disease-specific therapy or a public vaccine.
review_notes: >-
  Congenital synonyms from the MONDO stub were intentionally kept out of this
  acquired-infection entry because MONDO:0000890 is already represented by
  Congenital_Zika_Syndrome. That entry is listed as a pointer subtype here to
  keep the acquired maternal infection, the vertical transmission route, and the
  downstream fetal disease connected without duplicating the fetal
  neural-progenitor mechanism. A covering grouping was not added because
  MONDO:0018661 is the acquired infection rather than a parent union, and the
  existing Congenital_Zika_Syndrome entry already covers the distinct fetal
  disease.

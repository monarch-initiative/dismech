  - target: Cerebral cortex with spongiform changes
  evidence:
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 21-kDa fragment, similar to the PrP-res type 1 described in Creutzfeldt-Jakob disease, was found in five of the seven subjects and correlated with the presence of spongiform degeneration and \"synaptic\" pattern of PrP deposition"
    explanation: The 21 kDa fragment correlates with spongiform degeneration and a synaptic PrP-deposition pattern.

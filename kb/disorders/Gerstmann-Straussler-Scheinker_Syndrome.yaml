    evidence_source: HUMAN_CLINICAL
    snippet: "No treatment of the underlying cause of genetic prion disease is available."
    explanation: GeneReviews confirms only supportive management is available.
- name: Genetic counseling and predictive testing
  description: >-
    Autosomal dominant risk counseling, predictive testing protocols for at-risk
    relatives, and reproductive options; the psychological burden on 50%-at-risk
    relatives is a distinctive management dimension.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

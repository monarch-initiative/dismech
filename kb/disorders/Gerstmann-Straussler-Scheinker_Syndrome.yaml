description: >-
  Gerstmann-Straussler-Scheinker syndrome (GSS) is a very rare, invariably fatal,
  autosomal dominant genetic prion disease caused by germline variants in the prion
  protein gene PRNP. It is one of the three classic inherited prion phenotypes
  (alongside genetic Creutzfeldt-Jakob disease and fatal familial insomnia). A
  pathogenic PRNP variant renders PrP-C susceptible to conversion into a
  self-templating misfolded conformer (PrP-Sc), so that over decades a stochastic
  nucleation event propagates autocatalytically. (For the classic P102L variant
  this is not explained by loss of native-state thermodynamic stability - see the
  deprecated `native_state_destabilization` mechanistic hypothesis.) The
  clinical signature is a slowly progressive cerebellar ataxia beginning in midlife
  followed by dementia, and the neuropathological hallmark is multicentric PrP
  amyloid plaques with a distinctive ~8 kDa protease-resistant PrP fragment. GSS is
  the rare Mendelian disease whose product is also, under laboratory inoculation, an
  infectious agent.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    GSS is inherited in an autosomal dominant manner. Penetrance is high for the
    most common allele (P102L) but is variable-to-reduced for much of the reported
    PRNP variant spectrum. Phenotype (and tempo) is co-determined by the PRNP
    codon-129 genotype and its cis/trans phase relative to the mutation.
  evidence:
  - reference: PMID:2564168

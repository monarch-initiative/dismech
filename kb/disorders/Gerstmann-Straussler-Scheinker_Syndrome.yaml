    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a PRNP pathogenic variant has a 50% chance of inheriting the variant."
    explanation: GeneReviews states each child of an affected individual has a 50% chance of inheriting the PRNP variant.
- name: PrP-lowering monoclonal antibody (PRN100)
  description: >-
    First-in-human anti-PrP monoclonal antibody; in six CJD patients it was well
    tolerated and reached target CSF concentration, but all patients still declined,
    consistent with the difficulty of reversing established neurodegeneration.
    Experimental.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Template-Directed Conversion of PrP-C to PrP-Sc
    treatment_effect: INHIBITS
    description: Anti-PrP monoclonal antibody binds cellular PrP-C to inhibit recruitment into templated PrP-Sc conversion.
    evidence:
    - reference: PMID:35305340
      reference_title: "Prion protein monoclonal antibody (PRN100) therapy for Creutzfeldt-Jakob disease: evaluation of a first-in-human treatment programme."
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "PRN100 was well tolerated and reached the target CSF drug concentration (50 nM)"
      explanation: Demonstrates CSF target engagement of anti-PrP antibody PRN100 in human prion disease.
  evidence:
  - reference: PMID:35305340
    reference_title: "Prion protein monoclonal antibody (PRN100) therapy for Creutzfeldt-Jakob disease: evaluation of a first-in-human treatment programme."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRN100 was well tolerated and reached the target CSF drug concentration (50 nM)"
    explanation: Demonstrates target engagement of the anti-PrP antibody, though clinical decline continued.


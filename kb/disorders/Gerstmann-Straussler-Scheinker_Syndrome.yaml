genetic:
- name: PRNP
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Causal gene. The most common GSS allele is P102L (c.305C>T); A117V (in the
    transmembrane-determining region) is second-most-common; F198S defines the
    Indiana kindred with co-occurring neurofibrillary tangles. Many further reported
    variants have uncertain pathogenicity/penetrance.
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PrP is implicated in the pathogenesis and transmission of the condition"
    explanation: Prion protein is implicated in GSS pathogenesis.
- name: PRNP codon 129 (M129V) and APOE modifiers
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    The common PRNP codon-129 polymorphism (M129V), including its cis/trans phase
    relative to the mutation, is the best-characterized modifier of age at onset and
    phenotype; APOE genotype has also been examined as a modifier. Mechanisms remain
    incompletely explained.
  evidence:
  - reference: PMID:18757886
    reference_title: "Phenotypic heterogeneity and genetic modification of P102L inherited prion disease in an international series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the earliest eight clinical onsets were all MM homozygotes and overall age at onset was 7 years earlier for MM compared with MV heterozygotes"
    explanation: Quantifies the PRNP codon-129 modifier effect on age at onset in P102L GSS.
  - reference: PMID:18757886
    reference_title: "Phenotypic heterogeneity and genetic modification of P102L inherited prion disease in an international series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "apolipoprotein E4 carriers have a delayed age of onset by 10 years"
    explanation: Documents the paradoxical APOE4-delays-onset modifier effect in P102L GSS.

pathophysiology:
- name: PRNP Germline Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous PRNP coding variant is present from conception in every cell. It
    does not break the gene; it renders the encoded protein conformationally
    unfaithful, a gain-of-toxic-function rather than a loss-of-function lesion.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  genes:
  - preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  molecular_functions:
  - preferred_term: identical protein binding
    modifier: ABNORMAL
    term:
      id: GO:0042802
      label: identical protein binding
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show here that PrP codon 102 is linked to the putative gene for the syndrome in two pedigrees, providing the best evidence to date that this familial condition is inherited despite also being infectious, and that substitution of leucine for proline at PrP codon 102 may lead to the development of Gerstmann-Sträussler syndrome."
    explanation: Establishes germline PRNP missense substitution (such as P102L) as the initiating molecular lesion in GSS.
  downstream:
  - target: Acquisition of a Conversion-Competent PrP-C Conformer
- name: Acquisition of a Conversion-Competent PrP-C Conformer
  biological_scale: MOLECULAR
  conforms_to: "amyloidogenesis#Amyloidogenic Precursor Protein"
  description: >-
    The substitution renders PrP-C susceptible to a stochastic conformational
    conversion into the PrP-Sc-templating fold, eventually making a misfolding event
    possible over years to decades. For the classic P102L GSS variant this is not
    explained by loss of native-state thermodynamic stability: recombinant human
    PrP(90-231) carrying P102L is recovered soluble, with secondary structure and
    guanidine/thermal unfolding stability indistinguishable from wild-type. (For
    A117V, an alternative upstream trigger is aberrant C-terminal-transmembrane PrP
    topogenesis rather than a globular-domain conformational change.)
  notes: >-
    This node does not attribute conversion susceptibility in GSS to lowering of the
    thermodynamic or kinetic barrier separating native PrP-C from beta-sheet
    conformers, because primary biophysical studies refute that model for P102L:
    Swietnicki et al. (PMID:9813003) assayed recombinant P102L PrP(90-231) directly
    and found its unfolding stability indistinguishable from wild-type, concluding that
    "some hereditary forms of prion disease cannot be rationalized using the concept
    of mutation-induced thermodynamic destabilization of the cellular prion protein."
    Liemann and Glockshuber (PMID:10079068) independently measured eight C-terminal
    familial PRNP substitutions and found that thermodynamic stability does not
    correlate with disease phenotype, and Wildegger et al. (Nat Struct Biol, 1999)
    showed PrP-C folds in ~170 microseconds with no detectable intermediate,
    undercutting a populated folding-intermediate route to PrP-Sc. See the
    disease-level `native_state_destabilization` mechanistic hypothesis (status
    DEPRECATED) for the retained refutation evidence; the proximate trigger for
    PrP-C-to-PrP-Sc conversion in P102L GSS remains unresolved.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9813003
    reference_title: "Familial mutations and the thermodynamic stability of the recombinant human prion protein."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "The stability properties of the P102L variant were indistinguishable from those of wild-type PrP"
    explanation: >-
      Establishes the actual observed biophysical property of the P102L variant used
      to replace the refuted destabilization claim: recovered soluble, with stability
      indistinguishable from wild-type, rather than an intrinsically destabilized fold.
  downstream:
  - target: Template-Directed Conversion of PrP-C to PrP-Sc
- name: Template-Directed Conversion of PrP-C to PrP-Sc
  biological_scale: MOLECULAR
  conforms_to: "amyloidogenesis#Protein Misfolding and Beta-Sheet Oligomerization"
  description: >-
    The autocatalytic core of the disease: a nucleated conformational conversion in
    which a misfolded PrP molecule recruits and refolds native PrP-C. This is the
    step that makes the disease self-propagating and experimentally transmissible.
  molecular_functions:
  - preferred_term: identical protein binding
    modifier: INCREASED
    term:
      id: GO:0042802
      label: identical protein binding
  biological_processes:
  - preferred_term: protein homooligomerization
    term:
      id: GO:0051260
      label: protein homooligomerization
    modifier: INCREASED
  downstream:
  - target: Generation of GSS-Specific Protease-Resistant PrP Fragments
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "It can also be horizontally transmitted to non-human primates and rodents through intracerebral inoculation of brain homogenates from patients with the disease."
    explanation: Experimental transmission into non-human primates and rodents demonstrates the self-propagating, transmissible nature of the misfolded conformer.
- name: Generation of GSS-Specific Protease-Resistant PrP Fragments
  biological_scale: MOLECULAR
  description: >-
    GSS brains carry two major protease-resistant PrP fragments: an ~8 kDa
    unglycosylated fragment with ragged N- and C-termini (derived from the center of
    PrP), which is the GSS-defining species and tracks with multicentric amyloid,
    and a 21 kDa (type-1-like) fragment present in the CJD-like variant. Which
    fragment forms in vivo determines the neuropathology.
  downstream:
  - target: Multicentric PrP Amyloid Plaque Formation
  - target: Spongiform Degeneration and Synaptic PrP Deposition
  evidence:
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed two major protease-resistant PrP fragments (PrP-res) with molecular masses of approximately 21 and 8 kDa"
    explanation: Identifies the two protease-resistant fragment species characteristic of GSS.
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "the formation of PrP-res fragments of 7-8 kDa with ragged N and C termini is not a feature of Creutzfeldt-Jakob disease or fatal familial insomnia"
    explanation: The ~8 kDa ragged fragment is a molecular marker distinguishing GSS from CJD/FFI.
- name: Multicentric PrP Amyloid Plaque Formation
  biological_scale: TISSUE
  conforms_to: "amyloidogenesis#Amyloid Fibril Formation and Extracellular Deposition"
  description: >-
    The 8 kDa fragment drives the pathognomonic lesion: multicentric PrP amyloid
    plaques (a dense core with satellite deposits) concentrated in the cerebellar
    molecular layer and cerebral cortex.
  locations:
  - preferred_term: cerebellum

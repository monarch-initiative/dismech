    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gerstmann-Sträussler syndrome is a rare familial neurodegenerative condition that is vertically transmitted, in an apparently autosomal dominant way."
    explanation: Establishes autosomal dominant vertical transmission.

has_subtypes:
- name: Typical GSS
  display_name: Typical GSS (ataxic)
  description: >-
    The classic Gerstmann/Straussler/Scheinker description: early gait ataxia with
    dementia developing later, and the longest disease duration among the clusters.
    One of four clinical phenotype clusters defined by cluster analysis of P102L cases.
  evidence:
  - reference: PMID:31397917
    reference_title: "Clinical Variability in P102L Gerstmann-Sträussler-Scheinker Syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis encompassing data from 7 Czech patients and 87 published cases suggests the existence of 4 clinical phenotypes (typical GSS, GSS with areflexia and paresthesia, pure dementia GSS, and Creutzfeldt-Jakob disease-like GSS); GSS may be more common than previously estimated."
    explanation: Cluster analysis of 94 P102L GSS cases defines the four clinical phenotype clusters, including typical GSS.
- name: Areflexic GSS
  display_name: GSS with areflexia and paresthesia
  description: >-
    Painful paraesthesiae/dysaesthesiae in the legs and loss of lower-limb reflexes
    precede ataxia and dementia; explained by caudal spinal cord pathology.
  evidence:
  - reference: PMID:31397917
    reference_title: "Clinical Variability in P102L Gerstmann-Sträussler-Scheinker Syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis encompassing data from 7 Czech patients and 87 published cases suggests the existence of 4 clinical phenotypes (typical GSS, GSS with areflexia and paresthesia, pure dementia GSS, and Creutzfeldt-Jakob disease-like GSS); GSS may be more common than previously estimated."
    explanation: Identifies GSS with areflexia and paresthesia as one of the four clinical clusters.
  - reference: PMID:30698738
    reference_title: "Early neurophysiological biomarkers and spinal cord pathology in inherited prion disease."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the sensory symptoms and loss of lower limb reflexes in Gerstmann-Sträussler-Scheinker syndrome is due to pathology in the caudal spinal cord."
    explanation: Establishes the caudal spinal cord basis of the areflexic and paresthetic GSS presentation.
- name: Pure Dementia GSS
  display_name: Pure dementia GSS
  description: >-
    Cognitive decline dominant with little ataxia and relatively early onset;
    overlaps clinically with frontotemporal dementia and Alzheimer disease.
  evidence:
  - reference: PMID:31397917
    reference_title: "Clinical Variability in P102L Gerstmann-Sträussler-Scheinker Syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cluster analysis encompassing data from 7 Czech patients and 87 published cases suggests the existence of 4 clinical phenotypes (typical GSS, GSS with areflexia and paresthesia, pure dementia GSS, and Creutzfeldt-Jakob disease-like GSS); GSS may be more common than previously estimated."
    explanation: Identifies pure dementia GSS as one of the four clinical phenotype clusters.
  - reference: PMID:18757886
    reference_title: "Phenotypic heterogeneity and genetic modification of P102L inherited prion disease in an international series."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A subset of patients present with prominent cognitive and psychiatric features and some have met diagnostic criteria for sporadic Creutzfeldt-Jakob disease."
    explanation: Documents cognitive-predominant presentations within P102L GSS kindreds.

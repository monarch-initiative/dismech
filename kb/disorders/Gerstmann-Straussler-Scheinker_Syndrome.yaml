    reference_title: "Dopaminergic neurodegeneration in Gerstmann-Sträussler-Scheinker (P102L) disease: insights from imaging and pathological examination."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy findings in one case confirmed prion protein plaques and dopaminergic neuron loss in the substantia nigra of a patient with GSS P102L. Additionally, reduced DAT immunostaining was observed in the putamen compared with a control."
    explanation: Human postmortem examination in P102L GSS directly demonstrates neuronal loss and presynaptic dopaminergic terminal loss (reduced DAT immunostaining) associated with PrP plaques.
  - reference: PMID:39376689

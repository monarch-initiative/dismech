  preferred_term: Gerstmann-Straussler-Scheinker syndrome
  term:
    id: MONDO:0007656
    label: Gerstmann-Straussler-Scheinker syndrome
synonyms:
- Gerstmann-Straussler-Scheinker disease
- prion dementia
- Gerstmann-Straussler disease
- GSS
references:
- reference: PMID:20301407
  title: "Genetic Prion Disease"
  tags:
  - GeneReviews
description: >-
  Gerstmann-Straussler-Scheinker syndrome (GSS) is a very rare, invariably fatal,
  autosomal dominant genetic prion disease caused by germline variants in the prion
  protein gene PRNP. It is one of the three classic inherited prion phenotypes
  (alongside genetic Creutzfeldt-Jakob disease and fatal familial insomnia). A
  pathogenic PRNP variant renders PrP-C susceptible to conversion into a
  self-templating misfolded conformer (PrP-Sc), so that over decades a stochastic
  nucleation event propagates autocatalytically. (For the classic P102L variant
  this is not explained by loss of native-state thermodynamic stability - see the
  deprecated `native_state_destabilization` mechanistic hypothesis.) The
  clinical signature is a slowly progressive cerebellar ataxia beginning in midlife
  followed by dementia, and the neuropathological hallmark is multicentric PrP
  amyloid plaques with a distinctive ~8 kDa protease-resistant PrP fragment. GSS is
  the rare Mendelian disease whose product is also, under laboratory inoculation, an
  infectious agent.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    GSS is inherited in an autosomal dominant manner. Penetrance is high for the
    most common allele (P102L) but is variable-to-reduced for much of the reported
    PRNP variant spectrum. Phenotype (and tempo) is co-determined by the PRNP
    codon-129 genotype and its cis/trans phase relative to the mutation.
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gerstmann-Sträussler syndrome is a rare familial neurodegenerative condition that is vertically transmitted, in an apparently autosomal dominant way."
    explanation: Establishes autosomal dominant vertical transmission.

has_subtypes:
- name: Typical GSS
  display_name: Typical GSS (ataxic)
  description: >-
    The classic Gerstmann/Straussler/Scheinker description: early gait ataxia with
    dementia developing later, and the longest disease duration among the clusters.
    One of four clinical phenotype clusters defined by cluster analysis of P102L cases.
  evidence:
  - reference: PMID:31397917
    reference_title: "Clinical Variability in P102L Gerstmann-Sträussler-Scheinker Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggests the existence of 4 clinical phenotypes (typical GSS, GSS with areflexia and paresthesia, pure dementia GSS, and Creutzfeldt-Jakob"
    explanation: Cluster analysis of P102L GSS cases defines the four clinical phenotype clusters used as subtypes here.
- name: Areflexic GSS
  display_name: GSS with areflexia and paresthesia
  description: >-
    Painful paraesthesiae/dysaesthesiae in the legs and loss of lower-limb reflexes
    precede ataxia and dementia; explained by caudal spinal cord pathology.
- name: Pure Dementia GSS
  display_name: Pure dementia GSS
  description: >-
    Cognitive decline dominant with little ataxia and relatively early onset;
    overlaps clinically with frontotemporal dementia and Alzheimer disease.
- name: CJD-like GSS
  display_name: Creutzfeldt-Jakob-disease-like GSS
  description: >-
    Rapid progression with myoclonus over a months-scale course, correlating with
    the presence of a 21 kDa (type-1) protease-resistant PrP fragment.

genetic:
- name: PRNP
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Causal gene. The most common GSS allele is P102L (c.305C>T); A117V (in the
    transmembrane-determining region) is second-most-common; F198S defines the
    Indiana kindred with co-occurring neurofibrillary tangles. Many further reported
    variants have uncertain pathogenicity/penetrance.
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PrP is implicated in the pathogenesis and transmission of the condition"
    explanation: Prion protein is implicated in GSS pathogenesis.
- name: PRNP codon 129 (M129V) and APOE modifiers
  gene_term:
    preferred_term: PRNP
    term:
      id: hgnc:9449
      label: PRNP
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  notes: >-
    The common PRNP codon-129 polymorphism (M129V), including its cis/trans phase
    relative to the mutation, is the best-characterized modifier of age at onset and
    phenotype; APOE genotype has also been examined as a modifier. Mechanisms remain
    incompletely explained.
  evidence:
  - reference: PMID:18757886
    reference_title: "Phenotypic heterogeneity and genetic modification of P102L inherited prion disease in an international series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the earliest eight clinical onsets were all MM homozygotes and overall age at onset was 7 years earlier for MM compared with MV heterozygotes"
    explanation: Quantifies the PRNP codon-129 modifier effect on age at onset in P102L GSS.
  - reference: PMID:18757886
    reference_title: "Phenotypic heterogeneity and genetic modification of P102L inherited prion disease in an international series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "apolipoprotein E4 carriers have a delayed age of onset by 10 years"
    explanation: Documents the paradoxical APOE4-delays-onset modifier effect in P102L GSS.

pathophysiology:
- name: PRNP Germline Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous PRNP coding variant is present from conception in every cell. It
    does not break the gene; it renders the encoded protein conformationally
    unfaithful, a gain-of-toxic-function rather than a loss-of-function lesion.
  downstream:
  - target: Acquisition of a Conversion-Competent PrP-C Conformer
- name: Acquisition of a Conversion-Competent PrP-C Conformer
  description: >-
    The substitution renders PrP-C susceptible to a stochastic conformational
    conversion into the PrP-Sc-templating fold, eventually making a misfolding event
    possible over years to decades. For the classic P102L GSS variant this is not
    explained by loss of native-state thermodynamic stability: recombinant human
    PrP(90-231) carrying P102L is recovered soluble, with secondary structure and
    guanidine/thermal unfolding stability indistinguishable from wild-type. (For
    A117V, an alternative upstream trigger is aberrant C-terminal-transmembrane PrP
    topogenesis rather than a globular-domain conformational change.)
  notes: >-
    Curation note on what this node deliberately does NOT claim. An earlier revision
    named this node "Destabilization of the PrP-C Native Fold" and asserted that the
    substitution "lowers the thermodynamic/kinetic barrier" separating the native fold
    from beta-sheet conformers. That framing states as mechanism a hypothesis the
    primary literature directly rejects for GSS: Swietnicki et al. (PMID:9813003)
    assayed the P102L variant itself and found its stability indistinguishable from
    wild-type, and conclude that "some hereditary forms of prion disease cannot be
    rationalized using the concept of mutation-induced thermodynamic destabilization
    of the cellular prion protein." Liemann and Glockshuber (PMID:10079068)
    independently measured all eight C-terminal familial substitutions and found
    stability does not correlate with disease phenotype. Wildegger et al. (Nat Struct
    Biol, 1999) additionally showed PrP-C folds in ~170 microseconds with no
    detectable intermediate, undercutting a populated folding-intermediate route to
    PrP-Sc as well. See the disease-level `native_state_destabilization` mechanistic
    hypothesis (status DEPRECATED) for the retained refutation evidence. The true
    proximate trigger for PrP-C-to-PrP-Sc conversion in P102L GSS remains an open
    question.
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9813003
    reference_title: "Familial mutations and the thermodynamic stability of the recombinant human prion protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The stability properties of the P102L variant were indistinguishable from those of wild-type PrP"
    explanation: >-
      Establishes the actual observed biophysical property of the P102L variant used
      to replace the refuted destabilization claim: recovered soluble, with stability
      indistinguishable from wild-type, rather than an intrinsically destabilized fold.
  downstream:
  - target: Template-Directed Conversion of PrP-C to PrP-Sc
- name: Template-Directed Conversion of PrP-C to PrP-Sc
  description: >-
    The autocatalytic core of the disease: a nucleated conformational conversion in
    which a misfolded PrP molecule recruits and refolds native PrP-C. This is the
    step that makes the disease self-propagating and experimentally transmissible.
  biological_processes:
  - preferred_term: protein homooligomerization
    term:
      id: GO:0051260
      label: protein homooligomerization
    modifier: INCREASED
  downstream:
  - target: Generation of GSS-Specific Protease-Resistant PrP Fragments
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It can also be horizontally transmitted to non-human primates and rodents through intracerebral inoculation of brain homogenates from patients with the disease."
    explanation: Experimental transmission into non-human primates and rodents demonstrates the self-propagating, transmissible nature of the misfolded conformer.
- name: Generation of GSS-Specific Protease-Resistant PrP Fragments
  description: >-
    GSS brains carry two major protease-resistant PrP fragments: an ~8 kDa
    unglycosylated fragment with ragged N- and C-termini (derived from the center of
    PrP), which is the GSS-defining species and tracks with multicentric amyloid,
    and a 21 kDa (type-1-like) fragment present in the CJD-like variant. Which
    fragment forms in vivo determines the neuropathology.
  downstream:
  - target: Multicentric PrP Amyloid Plaque Formation
  - target: Spongiform Degeneration and Synaptic PrP Deposition
  evidence:
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed two major protease-resistant PrP fragments (PrP-res) with molecular masses of approximately 21 and 8 kDa"
    explanation: Identifies the two protease-resistant fragment species characteristic of GSS.
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the formation of PrP-res fragments of 7-8 kDa with ragged N and C termini is not a feature of Creutzfeldt-Jakob disease or fatal familial insomnia"
    explanation: The ~8 kDa ragged fragment is a molecular marker distinguishing GSS from CJD/FFI.
- name: Multicentric PrP Amyloid Plaque Formation
  description: >-
    The 8 kDa fragment drives the pathognomonic lesion: multicentric PrP amyloid
    plaques (a dense core with satellite deposits) concentrated in the cerebellar
    molecular layer and cerebral cortex.
  biological_processes:
  - preferred_term: amyloid fibril formation
    term:
      id: GO:1990000
      label: amyloid fibril formation
    modifier: INCREASED
  downstream:
  - target: Synaptic Dysfunction and Neuronal Death
  evidence:
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the 8-kDa fragment, similar to those described in other variants of GSS, was found in all subjects in brain regions showing PrP-positive multicentric amyloid deposits"
    explanation: Links the 8 kDa fragment to the multicentric amyloid plaques.
- name: Spongiform Degeneration and Synaptic PrP Deposition
  description: >-
    The 21 kDa fragment drives a parallel, strain-dependent lesion of spongiform
    degeneration with a synaptic pattern of PrP deposition. It is present in the
    CJD-like variant and absent in some GSS variants (e.g. D202N without spongiform
    change), explaining much of the intra-mutation phenotypic variability.
  downstream:
  - target: Synaptic Dysfunction and Neuronal Death
  evidence:
  - reference: PMID:9653185
    reference_title: "Different patterns of truncated prion protein fragments correlate with distinct phenotypes in P102L Gerstmann-Sträussler-Scheinker disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "correlated with the presence of spongiform degeneration and"
    explanation: The 21 kDa fragment correlates with spongiform degeneration and a synaptic PrP-deposition pattern.
- name: Synaptic Dysfunction and Neuronal Death
  description: >-
    Both deposition routes converge on synaptotoxicity and neuronal apoptosis, the
    proximate cause of the clinical decline.
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Neuroinflammation
  - target: Regional Neuronal Loss and Clinical Syndrome
- name: Neuroinflammation
  description: >-
    Reactive astrogliosis and microglial activation track the PrP deposits, a purely
    innate neuroinflammatory response (PrP-Sc is a self-protein in a different fold
    and is not immunogenic, so no adaptive immune response occurs).
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: astrocyte activation
    term:
      id: GO:0048143
      label: astrocyte activation
    modifier: INCREASED
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
- name: Secondary Tau Pathology
  description: >-
    In the F198S (and Q217R) variants, neurofibrillary tangles indistinguishable
    from those of Alzheimer disease arise around PrP plaques. Bank-vole transmission
    shows the PrP amyloid and tau tangles are independent parallel pathologies rather
    than one driving the other, so this node is modeled parallel to the amyloid arm
    without a driving causal edge from it.
  evidence:
  - reference: PMID:2176119
    reference_title: "Neurofibrillary tangles of the Indiana kindred of Gerstmann-Sträussler-Scheinker disease share antigenic determinants with those of Alzheimer disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neurofibrillary tangles (NFT) with paired helical filaments (PHF) are numerous, widespread and consistently present in the cerebral cortex and several subcortical nuclei"
    explanation: The Indiana F198S kindred shows abundant Alzheimer-type neurofibrillary tangles co-occurring with the prion pathology.
- name: Regional Neuronal Loss and Clinical Syndrome
  description: >-
    Regionally selective neuronal loss maps to the clinical syndrome: cerebellar
    Purkinje/granule loss produces ataxia, cortical involvement produces dementia,
    substantia nigra loss produces parkinsonism, and caudal spinal cord pathology
    produces areflexia and painful dysaesthesiae.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients initially suffer from ataxia or dementia and deteriorate until they die, in one to ten years."
    explanation: The clinical syndrome and its slowly progressive fatal course.


  status: ACTIVE_NOT_RECRUITING
  description: >-
    PrProfile - a Phase 1/2a first-in-human study of the intrathecally administered
    antisense oligonucleotide ION717, which lowers PrP by degrading PRNP mRNA, in
    patients with prion disease.
  evidence:
  - reference: clinicaltrials:NCT06153966
    reference_title: "A Phase 1/2a Study to Evaluate the Safety, Tolerability, Pharmacokinetics and Pharmacodynamics of Intrathecally Administered ION717 in Patients With Prion Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to evaluate the safety, tolerability, pharmacokinetics and pharmacodynamics of intrathecal (IT) delivery of ION717."
    explanation: The active PrP-lowering ASO trial relevant to genetic prion disease including GSS.

mechanistic_hypotheses:
- hypothesis_group_id: native_state_destabilization
  hypothesis_label: Native-State Thermodynamic/Kinetic Destabilization Model
  status: DEPRECATED
  description: >-
    Familial PRNP substitutions cause disease by lowering the thermodynamic and/or
    kinetic barrier separating the native alpha-helical PrP-C fold from beta-sheet-rich
    conformers, so that a stochastic misfolding event becomes possible.
  notes: >-
    Deprecated for the GSS P102L variant specifically, not just as a general caveat:
    this is the one familial PRNP substitution in this literature that was directly
    assayed and found not to be thermodynamically destabilized. Swietnicki et al.
    (PMID:9813003) recovered recombinant P102L PrP(90-231) in soluble form with
    wild-type-like secondary structure and stability. Liemann and Glockshuber
    (PMID:10079068) independently found, across all eight C-terminal familial
    substitutions tested, that thermodynamic stability does not correlate with disease
    phenotype - not that no variant is destabilized: five of the eight substitutions
    they tested (none of them P102L) do destabilize PrP(121-231) relative to
    wild-type, while the other three do not. Retained as DEPRECATED
    for provenance so the barrier-lowering framing is not reintroduced as the
    explanation for P102L specifically.
  evidence:
  - reference: PMID:9813003
    reference_title: "Familial mutations and the thermodynamic stability of the recombinant human prion protein."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "some hereditary forms of prion disease cannot be rationalized using the concept of mutation-induced thermodynamic destabilization of the cellular prion protein"
    explanation: >-
      Direct test of the P102L GSS variant itself; its stability was indistinguishable
      from wild-type, so the destabilization model cannot explain this variant.
  - reference: PMID:10079068
    reference_title: "Influence of amino acid substitutions related to inherited human prion diseases on the thermodynamic stability of the cellular prion protein."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "These data suggest that destabilization of PrPC is neither a general mechanism underlying the formation of PrPSc nor the basis of disease phenotypes in inherited human TSEs."
    explanation: >-
      Independent replication across all eight C-terminal familial PRNP substitutions:
      measured thermodynamic stabilities do not correlate with disease phenotype.

discussions:
- discussion_id: gap_gss_prnp_penetrance_modifiers
  prompt: >-
    Why do many reported GSS-associated PRNP variants show markedly reduced or
    uncertain penetrance, and what determines the codon-129 and APOE modifier
    effects on age at onset - including the counterintuitive report that APOE4 may
    delay rather than hasten onset in P102L?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#PRNP codon 129 (M129V) and APOE modifiers
  - pathophysiology#Acquisition of a Conversion-Competent PrP-C Conformer
  rationale: >-
    Large population control cohorts show that PRNP variants previously reported as
    pathogenic are far more common than expected and confer a wide range of lifetime
    risks, so penetrance is variant-specific rather than uniformly high. The
    codon-129 genotype (and its cis/trans phase) and APOE genotype modify onset by
    incompletely understood mechanisms, and the reported APOE4-delays-onset effect is
    the opposite of its effect in Alzheimer disease. Resolving these would sharpen
    predictive counseling and the timing of any presymptomatic PrP-lowering therapy.
  proposed_experiments:
  - experiment_id: exp_gss_penetrance_modifier
    experiment_design: HUMAN_OBSERVATIONAL
    name: Population-scale penetrance and modifier mapping for PRNP variants
    description: >-
      Integrate large biobank/control cohorts with kindred data to estimate
      variant-specific penetrance and to test codon-129 phase and APOE genotype as
      quantitative modifiers of age at onset.
  evidence:
  - reference: PMID:26791950
    reference_title: "Quantifying prion disease penetrance using large population control cohorts."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although some of this excess can be attributed to benign variants falsely assigned as pathogenic, other variants have genuine effects on disease susceptibility but confer lifetime risks ranging from <0.1 to ~100%."
    explanation: Population-scale analysis showing PRNP variant penetrance is variant-specific, spanning a wide range of lifetime risks.
- discussion_id: emerging_gss_prp_lowering
  prompt: >-
    Given that GSS is a gain-of-toxic-function disease and PrP loss appears tolerated,
    will PrP-lowering therapies (antisense oligonucleotides, base editing) started
    before or early after symptom onset alter the disease course in humans?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Template-Directed Conversion of PrP-C to PrP-Sc
  rationale: >-
    Because the mutant allele actively templates misfolding and heterozygous PRNP
    loss-of-function is tolerated, lowering PrP is a mechanistically rational target.
    In vivo base editing lowered brain PrP and extended lifespan in a humanized prion
    mouse model, and the ION717 antisense oligonucleotide is in a first-in-human
    intrathecal trial. Whether these translate to clinical benefit - and how early
    they must start - is the central open therapeutic question.
  proposed_experiments:
  - experiment_id: exp_gss_prp_lowering_timing
    name: Timing-of-intervention study for PrP-lowering in genetic prion disease
    description: >-
      Use presymptomatic PrP and neurofilament biomarkers to define the therapeutic
      window in which PrP-lowering alters trajectory, in at-risk PRNP carriers and
      animal models.
  evidence:
  - reference: PMID:39810005
    reference_title: "In vivo base editing extends lifespan of a humanized mouse model of prion disease."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Systemic injection of dual-adeno-associated virus PHP.eB encoding BE3.9max and single guide RNA installing PRNP R37X resulted in 37% average installation of the desired edit, 50% reduction of PrP in the mouse brain and 52% extension of lifespan in transgenic human PRNP mice inoculated with pathogenic human prion isolates representing the most common sporadic and genetic subtypes of prion disease."
    explanation: Demonstrates that AAV base-editing knockdown of brain PrP by 50% extends lifespan by 52% in a humanized prion mouse model.

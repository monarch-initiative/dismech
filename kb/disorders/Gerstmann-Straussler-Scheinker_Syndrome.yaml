prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.005
  notes: >-
    Estimated at roughly 1-10 per hundred million (Hsiao et al. 1989); GSS is one of
    the rarest recognized human neurodegenerative diseases.
  evidence:
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exact incidence of the syndrome is unknown but is estimated to be between one and ten per hundred million."
    explanation: Source estimate for the extreme rarity of GSS.

diagnosis:
- name: PRNP molecular genetic testing
  description: >-
    Diagnosis is established by identifying a heterozygous pathogenic PRNP variant on
    molecular genetic testing (the single-exon ORF makes Sanger sequencing decisive);
    chromosomal microarray/karyotype have no role.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of genetic prion disease is established in a  proband with suggestive findings and a heterozygous PRNP pathogenic variant  identified by molecular genetic testing"
    explanation: GeneReviews diagnostic criterion for genetic prion disease including GSS.
- name: Early neurophysiological biomarkers (H-reflex, spinal cord)
  description: >-
    Neurophysiological testing detects early caudal spinal cord involvement; the
    H-reflex is lost around symptom onset in the areflexic phenotype, and MRI may show
    cerebellar/vermian atrophy.
  evidence:
  - reference: PMID:30698738
    reference_title: "Early neurophysiological biomarkers and spinal cord pathology in inherited prion disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "around the time of, or shortly after, symptom onset the  H-reflex was lost"
    explanation: H-reflex loss is an early neurophysiological biomarker of GSS spinal-cord involvement.

progression:
- notes: >-
    Onset is typically in midlife (about 50-60 years) with slowly progressive
    cerebellar ataxia followed by dementia; the CJD-like cluster progresses over
    months. The disease is invariably fatal, with survival ranging from about one to
    ten years from onset.
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "onset typically  ranges from 50 to 60 years"
    explanation: GeneReviews gives the typical midlife age at onset for GSS.
  - reference: PMID:2564168
    reference_title: "Linkage of a prion protein missense variant to Gerstmann-Sträussler syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "deteriorate until they die, in one to ten years"
    explanation: Source for the one-to-ten-year survival range from onset.

treatments:
- name: Multidisciplinary supportive and palliative care
  description: >-
    No disease-modifying treatment exists; management is supportive and symptomatic,
    with a multidisciplinary team, physical/occupational therapy, and advance care
    planning given the progressive cognitive trajectory.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No treatment of the underlying cause of genetic prion disease is available."
    explanation: GeneReviews confirms only supportive management is available.
- name: Genetic counseling and predictive testing
  description: >-
    Autosomal dominant risk counseling, predictive testing protocols for at-risk
    relatives, and reproductive options; the psychological burden on 50%-at-risk
    relatives is a distinctive management dimension.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301407
    reference_title: "Genetic Prion Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "50% chance of inheriting the variant"
    explanation: GeneReviews states each child of an affected individual has a 50% chance of inheriting the PRNP variant.
- name: PrP-lowering monoclonal antibody (PRN100)

- name: Cortical Hyperexcitability
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Patients show the neurophysiological signs of a hyperexcitable sensorimotor
    cortex typical of the progressive myoclonus epilepsies: giant or enlarged
    somatosensory evoked potentials, an enhanced long-latency C reflex, and
    myoclonic jerks preceded by a cortical potential on jerk-locked back
    averaging. Zebrafish carrying last-exon truncations of the sema6b orthologs
    were more sensitive to the convulsant pentylenetetrazole. How altered
    SEMA6B signalling produces this hyperexcitability, for example whether
    inhibitory interneurons are involved, is unknown.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex

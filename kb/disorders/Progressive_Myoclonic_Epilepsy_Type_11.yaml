    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients were divided into four different phenotypic groups according to their clinical presentations: PME (18/36), developmental and epileptic encephalopathy (13/36), neurodevelopmental disorder (4/36), and epilepsy (1/36), respectively."
    explanation: >-
      Number and phenotypic distribution of reported patients.
animal_models:
- name: Zebrafish sema6ba/sema6bb exon 17 F0 crispants
  species: Zebrafish
  genotype: >-
    Mosaic F0 CRISPR-Cas9 crispants carrying frameshifts in the last coding
    exon (exon 17) of sema6ba, sema6bb or both, compared with crispants
    targeting the start codon in exon 2
  publication: PMID:32169168
  description: >-
    The only in vivo model of the disease variant class. Embryos with
    last-exon truncations of the sema6b orthologs had small heads, short bodies
    and a smaller optic tectum, and larvae showed exaggerated responses to the
    convulsant pentylenetetrazole; crispants targeting the start codon had a
    much milder phenotype. No spontaneous seizures were reported, and the
    animals were mosaic first-generation crispants rather than stable
    heterozygous lines.
  modeled_mechanisms:
  - target: Abnormal Neural Circuit Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-

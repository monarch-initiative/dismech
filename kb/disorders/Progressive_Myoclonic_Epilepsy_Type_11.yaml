    snippet: "The variants p.(Val183Leu) and p.(Trp689*) led to a decrease of the total spine number compared with the wild-type."
    explanation: >-
      A recurrent last-exon nonsense variant reduces spine number in primary
      neurons.
  - reference: PMID:35604360
    reference_title: "SEMA6B variants cause intellectual disability and alter dendritic spine density and axon guidance."
    supports: SUPPORT

pathophysiology:
- name: SEMA6B Last-Exon Truncating Variant Escaping NMD
  biological_scale: MOLECULAR
  description: >-
    Disease-causing variants are heterozygous nonsense and frameshift variants
    clustered in exon 17, the last exon of SEMA6B, where a premature stop codon
    does not trigger nonsense-mediated mRNA decay. In lymphoblastoid cells from
    an affected individual the mutant transcript was present at a level
    comparable to the wild-type transcript. Truncating variants upstream of
    this region, which would be degraded, are seen in the general population,
    and SEMA6B is tolerant of loss-of-function variation; the pathogenic
    variant class is therefore defined by its position, not by truncation as
    such.
  genetic_context:
    gene:
      preferred_term: SEMA6B
      term:
        id: hgnc:10739
        label: SEMA6B
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Frameshift and nonsense variants in the nonsense-mediated decay escape
      region (exon 17). functional_impact_category is left UNKNOWN because
      dominant-negative, gain-of-function and loss-of-function readings of the
      truncated protein have each been proposed and none has been shown in a
      mammalian system; see the discussion sema6b_truncation_mechanism.
  downstream:
  - target: Stable Truncated SEMA6B Lacking the Intracellular Domain
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RNA analysis of lymphoblastoid cells established from an affected individual showed that the mutant allele escaped NMD, indicating stable production of the truncated protein."
    explanation: >-
      Patient-derived cells show the mutant transcript escapes nonsense-mediated
      decay.
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, heterozygous truncating variants in the NMD(+) region of SEMA6B are observed in general populations, and SEMA6B is most likely loss-of-function tolerant."
    explanation: >-
      Truncating variants that would be degraded are tolerated in the
      population, which argues against haploinsufficiency as the mechanism.
  - reference: PMID:38091987
    reference_title: "Systematic analysis of variants escaping nonsense-mediated decay uncovers candidate Mendelian diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PTVesc-enriched genes included those with PTVescs previously described to cause dominant Mendelian disease (e.g., SEMA6B, PPM1D, and DAGLA)."
    explanation: >-
      In 29,031 neurodevelopmental-disorder trios, de novo truncating variants
      in the decay-escape region of SEMA6B were significantly enriched,
      replicating the variant class independently of the discovery cohort.
- name: Stable Truncated SEMA6B Lacking the Intracellular Domain
  biological_scale: MOLECULAR
  description: >-
    The exon 17 variants remove the intracellular domain while leaving the
    extracellular sema domain, plexin-semaphorin-integrin domain and
    transmembrane segment encoded. When one truncating variant was expressed
    in cultured cells, the truncated protein accumulated to higher levels than
    wild-type SEMA6B and failed to reach the plasma membrane, and a truncating
    variant tested in a second study was likewise mislocalized.
  downstream:
  - target: Disrupted SEMA6B-Plexin Signalling
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four variants occurred in the last exon of SEMA6B and lead to truncation of the intracellular domain (ICD), the region closer to the C terminus than the transmembrane domain"
    explanation: >-
      Locates the pathogenic truncations to the intracellular domain.
  - reference: PMID:34017830
    reference_title: "Novel Truncating and Missense Variants in SEMA6B in Patients With Early-Onset Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "results in a truncated protein with remarkably increased expression compared to that of the wild type."
    explanation: >-
      In transfected cells the truncated protein is produced and is more
      abundant than the wild-type protein.
  - reference: PMID:34017830
    reference_title: "Novel Truncating and Missense Variants in SEMA6B in Patients With Early-Onset Epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The truncated protein presented more homogeneous and failed to locate in the plasma membrane."
    explanation: >-
      The truncated protein does not reach the cell surface, where SEMA6B
      normally acts.
  - reference: PMID:35604360
    reference_title: "SEMA6B variants cause intellectual disability and alter dendritic spine density and axon guidance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The overexpression of some variants leads to a subcellular mislocalization of SEMA6B protein in HEK293T cells"
    explanation: >-
      An independent group also found mislocalization of variant SEMA6B protein.
- name: Disrupted SEMA6B-Plexin Signalling
  biological_scale: MOLECULAR
  description: >-
    SEMA6B binds plexin-A2 and acts as a receptor whose intracellular domain
    carries reverse signalling into the cell; in chick commissural neurons a
    SEMA6B lacking that domain cannot substitute for the full-length protein.
    Disease variants alter SEMA6B binding to plexin-A2 in co-immunoprecipitation
    experiments. Whether the truncated protein blocks signalling by the
    wild-type protein, signals aberrantly, or simply fails to signal is not
    established, so the node records altered signalling without a direction.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35604360
    reference_title: "SEMA6B variants cause intellectual disability and alter dendritic spine density and axon guidance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed that expression of these variants in commissural neurons fails to rescue the normal axon pathway."
    explanation: >-
      Variant SEMA6B, including a recurrent exon 17 nonsense variant, cannot
      support normal commissural axon guidance in vivo.
  - reference: PMID:20484647
    reference_title: "Roles of semaphorin-6B and plexin-A2 in lamina-restricted projection of hippocampal mossy fibers."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Sema6B-deficient mice several mossy fibers aberrantly project to the stratum radiatum and the stratum oriens."
    explanation: >-
      Loss of Sema6b in mice misroutes axons in the hippocampus, showing that
      SEMA6B is needed for lamina-specific wiring in the mammalian brain.
- name: Abnormal Neural Circuit Development
  biological_scale: TISSUE
  description: >-
    SEMA6B is expressed broadly in the developing and mature brain, most
    strongly in cortical excitatory neurons and cerebellar Purkinje cells. In
    zebrafish, mosaic truncation of the last coding exon of both sema6b
    orthologs caused small heads, a smaller optic tectum and defective neuronal
    development, whereas truncation near the start codon caused only a mild
    phenotype. The developmental timing of the human disease, with delay before
    seizure onset, fits a disorder of circuit formation, but which circuits are
    miswired in patients has not been shown.

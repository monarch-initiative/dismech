- name: Defective Axon Guidance
  biological_scale: CELLULAR
  description: >-
    SEMA6B guides axons both as a receptor and as a repellent cue. In chick
    embryos depleted of endogenous SEMA6B, a recurrent truncating variant failed
    to restore the normal rostral turn of post-crossing commissural axons, and
    mice lacking Sema6b show misrouted hippocampal mossy fibres.
  biological_processes:
  - preferred_term: commissural neuron axon guidance
    modifier: DECREASED
    term:
      id: GO:0071679
      label: commissural neuron axon guidance
  downstream:

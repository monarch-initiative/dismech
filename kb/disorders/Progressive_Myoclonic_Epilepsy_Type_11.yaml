- name: Sema6b-deficient mouse
  species: Mouse
  genotype: Sema6b knockout
  publication: PMID:20484647
  description: >-
    A null allele, not the human variant class. It shows that loss of Sema6b
    misroutes hippocampal mossy fibres, which supports a role for SEMA6B in
    mammalian brain wiring; no seizure or behavioural phenotype relevant to
    EPM11 is reported in the cited study.
  modeled_mechanisms:

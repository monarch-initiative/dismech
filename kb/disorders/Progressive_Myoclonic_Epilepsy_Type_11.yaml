inheritance:
- name: Autosomal Dominant (predominantly de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous SEMA6B variant is sufficient to cause disease. Nearly
    all reported variants arose de novo, so recurrence within a family is
    unusual. Two exceptions are reported: a family with an adult-onset course
    and a missense variant shared by two affected siblings, and a family in
    which a splice-site variant outside the last exon segregated with epilepsy
    with marked incomplete penetrance. Penetrance of the classic exon 17
    truncations cannot be judged because they are almost never inherited.

genetic:
- name: SEMA6B
  gene_term:
    preferred_term: SEMA6B
    term:
      id: hgnc:10739
      label: SEMA6B
  association: De Novo Variant
  presence: Positive
  variant_origin: DE_NOVO
  relationship_type: CAUSATIVE
  notes: >-
    Nearly all pathogenic variants are frameshift or nonsense variants in exon
    17 (NM_032108), the last exon, where they escape nonsense-mediated decay.
    Missense variants, a splice-site variant and one upstream nonsense variant
    have also been reported, the last in a mildly affected patient with
    unavailable paternal DNA whose variant was also seen in unaffected adults;
    the pathogenicity of these non-truncating and upstream classes is less
    secure. ClinGen classifies SEMA6B in autosomal dominant progressive
    myoclonus epilepsy (MONDO:0020074) as Definitive; that record is filed
    against the parent class, so it is not copied into gene_disease_validity
    for this entry.
  variants:
  - name: SEMA6B c.1991del (p.Gly664Alafs*21)
    description: >-
      Recurrent exon 17 frameshift, found in two unrelated families in the
      discovery study and again in a later intellectual-disability cohort.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:32169168
      reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified two frameshift DNVs, c.1950_1969dup (p.Arg657Profs∗35) and c.1991del, the latter being identical to one of the variants found through the initial analysis of the 346 trios."
      explanation: >-
        Recurrence of the same de novo frameshift in unrelated families.
  - name: SEMA6B c.2066G>A (p.Trp689*)
    description: >-
      Recurrent exon 17 nonsense variant, reported in a patient with
      zonisamide-responsive progressive myoclonic epilepsy and in the
      intellectual-disability cohort, and the variant used in neuronal and
      chick functional studies.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35604360
      reference_title: "SEMA6B variants cause intellectual disability and alter dendritic spine density and axon guidance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three of these variants were previously described, c.1976_1982del p.(Ala659Valfs*24) and c. 1991del p.(Gly664Alafs*21) in Hamanaka et al. (14) and c.2066G>A p.(Trp689*) in Herzog et al. (10)."
      explanation: >-
        p.Trp689*, first reported by Herzog et al., recurred in this cohort,
        as did the two discovery-study frameshifts.
  evidence:
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, we show that truncating DNVs in the final exon of SEMA6B cause progressive myoclonic epilepsy."
    explanation: >-
      Discovery study establishing last-exon truncating SEMA6B variants as the
      cause of the disease.
  - reference: PMID:33798445
    reference_title: "Progressive myoclonus epilepsies-Residual unsolved cases have marked genetic heterogeneity including dolichol-dependent protein glycosylation pathway genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Second, we independently validate SEMA6B as a dominant PME gene in two unrelated individuals."
    explanation: >-
      Independent replication in a separate PME cohort.
  - reference: CGGV:assertion_dc080017-6a01-4da0-a9f5-e89710890a4c-2025-01-21T170000.000Z
    reference_title: "SEMA6B / progressive myoclonus epilepsy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The vast majority of reported variants are protein truncating variants found in the last exon of the gene (exon 17) that are either predicted or proven"
    explanation: >-
      ClinGen's summary of the variant spectrum across reported patients.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis rests on a heterozygous pathogenic SEMA6B variant, usually a de
    novo truncating variant in exon 17, found by exome sequencing or a
    multigene epilepsy panel. Because SEMA6B truncating variants outside the
    decay-escape region are tolerated, the position of a truncating variant
    is central to its interpretation. Supportive findings are giant or enlarged
    somatosensory evoked potentials, an enhanced C reflex and cortical
    myoclonus on polygraphy; brain MRI is usually normal.
  notes: >-
    Differential diagnosis includes the other progressive myoclonus epilepsies
    with developmental delay and the developmental and epileptic
    encephalopathies, notably Lennox-Gastaut syndrome and epilepsy with
    myoclonic-atonic seizures, which several SEMA6B patients were first
    diagnosed with. One reported patient's presentation was initially taken
    for Angelman syndrome.
  evidence:
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating variants in the NMD(−) region of SEMA6B were not observed in general populations (i.e., the “non-neuro” subset of gnomAD), except for one at the extreme C terminus, whreas truncating variants were observed in the NMD(+) region"
    explanation: >-
      The region of a truncating variant separates disease alleles from those
      tolerated in the population, which is what interpretation turns on.
  - reference: PMID:36719163
    reference_title: "Progressive myoclonus epilepsies due to SEMA6B mutations. New variants and appraisal of published phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The remaining six cases presented myoclonic jerks in the context of polymorphic seizures, suggestive of DEE (Lennox‐Gastaut or epilepsy with myoclonic atonic seizures)."
    explanation: >-
      Myoclonus in SEMA6B disease can present within a developmental and
      epileptic encephalopathy, which shapes the differential diagnosis.
treatments:
- name: Antiseizure and Antimyoclonic Pharmacotherapy
  description: >-
    Treatment is symptomatic with antiseizure medications. Valproate and
    levetiracetam have controlled seizures in some patients; zonisamide
    improved positive and negative truncal myoclonus and gait in one patient;
    and clobazam with valproate and piracetam ended non-convulsive status
    epilepticus in another. About half of patients have pharmacoresistant
    seizures, and no disease-modifying therapy exists.

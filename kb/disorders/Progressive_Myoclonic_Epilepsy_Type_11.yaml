      function, which is the domain removed by the disease variants.
- name: Impaired Dendritic Spine Formation and Maturation
  biological_scale: CELLULAR
  description: >-
    In cultured mouse hippocampal neurons, overexpression of a recurrent
    exon 17 nonsense variant (p.Trp689*) reduced dendritic spine number, with
    loss of mature spines, and knockdown of endogenous Sema6b had the same
    effect. Because over-expression of the mutant and reduction of the wild
    type converge on the same spine phenotype, these data do not on their own
    separate a dominant-negative from a loss-of-function mechanism.
  cell_types:

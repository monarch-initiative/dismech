name: Progressive Myoclonic Epilepsy Type 11
creation_date: "2026-10-20T19:17:31Z"
category: Mendelian
description: >-
  Progressive myoclonic epilepsy type 11 (EPM11) is an autosomal dominant
  neurodevelopmental and epileptic disorder caused by heterozygous, almost
  always de novo, truncating variants in the last exon (exon 17) of SEMA6B,
  which encodes the class 6 transmembrane semaphorin 6B. Because these variants
  lie in the region where a premature stop codon escapes nonsense-mediated mRNA
  decay, the mutant transcript is stable and is predicted to yield a truncated
  protein that keeps its extracellular sema domain and transmembrane segment
  but lacks the intracellular domain through which class 6 semaphorins signal
  as receptors. Heterozygous truncating variants earlier in the gene occur in
  the general population, so simple haploinsufficiency is not the accepted
  mechanism; whether the truncated protein acts as a dominant negative, gains a
  toxic function, or adds to a partial loss of SEMA6B signalling is unresolved.
  Development is mildly delayed from infancy and seizures usually begin between
  about 1 and 6 years. In the classic presentation, action and cortical
  myoclonus, generalized tonic-clonic, atonic and absence seizures, cerebellar
  ataxia, pyramidal signs and cognitive and motor regression follow, with loss
  of independent walking and speech in the second decade. The same class of
  variants also produces developmental and epileptic encephalopathy without a
  recognized progressive myoclonic course and, less often, intellectual
  disability without epilepsy. This entry treats these presentations as one
  SEMA6B-related disease spectrum rather than as separate disorders, because
  they share the genotype and no genotype-phenotype correlation separates them.
synonyms:
- EPM11
- epilepsy, progressive myoclonic, 11
- PME type 11
- SEMA6B-related progressive myoclonic epilepsy
- SEMA6B-related disorder

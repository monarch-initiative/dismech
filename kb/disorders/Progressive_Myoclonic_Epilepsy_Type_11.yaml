prevalence:
- population: Worldwide (published case reports)
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population estimate exists. A 2025 systematic review collected 36
    reported patients from 12 studies, of whom 18 had progressive myoclonus
    epilepsy, 13 developmental and epileptic encephalopathy, 4 a
    neurodevelopmental disorder without epilepsy and 1 epilepsy alone.
  evidence:
  - reference: PMID:39419291
    reference_title: "Progressive Myoclonus Epilepsy and Beyond: A Systematic Review of SEMA6B-related Disorders."
    supports: SUPPORT

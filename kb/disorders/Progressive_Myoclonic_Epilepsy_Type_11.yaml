discussions:
- discussion_id: sema6b_truncation_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do last-exon SEMA6B truncations cause disease by a dominant-negative
    effect on wild-type SEMA6B, by a new toxic function of the truncated
    protein, or by loss of function of the mutant allele that population data
    say is not sufficient on its own?
  attaches_to:
  - pathophysiology#SEMA6B Last-Exon Truncating Variant Escaping NMD
  - pathophysiology#Stable Truncated SEMA6B Lacking the Intracellular Domain
  - pathophysiology#Disrupted SEMA6B-Plexin Signalling
  rationale: >-
    The discovery study inferred a dominant-negative or gain-of-function
    mechanism from three facts: the variants escape decay, upstream truncating
    variants are tolerated, and zebrafish last-exon crispants were more severely
    affected than start-codon crispants. Later papers state the mechanism in
    different directions: one review calls it a toxic gain of function, while
    the neuronal study calls the tested variant loss-of-function and found that
    knockdown of wild-type Sema6b reproduced the spine defect. The truncated
    protein is overexpressed and mislocalized in transfected cells, which fits
    either retention of wild-type partners or a new activity. None of the
    experiments tested the variant at physiological heterozygous dosage in a
    mammalian neuron, and the zebrafish crispants were mosaic, so the field
    has a consistent observation (position matters) without a demonstrated
    mechanism. This is why functional_impact_category is UNKNOWN.
  proposed_experiments:
  - experiment_id: sema6b_heterozygous_knockin_vs_null
    name: Heterozygous exon 17 truncation knock-in compared with a heterozygous null
    description: >-
      Generate mice or human iPSC-derived cortical neurons heterozygous for a
      recurrent exon 17 truncation, and in parallel heterozygous and homozygous
      null alleles, then compare spine density, axon targeting, network
      excitability and, in mice, seizure susceptibility. Co-express wild-type
      and truncated SEMA6B to test whether the truncated protein retains
      wild-type SEMA6B or plexin-A2 intracellularly.
    would_support:
    - pathophysiology#Disrupted SEMA6B-Plexin Signalling
    supporting_outcome:
    - >-
      The heterozygous knock-in has a phenotype that the heterozygous null
      lacks, and the truncated protein retains wild-type SEMA6B or plexin-A2
      away from the membrane, favouring a dominant-negative effect.
    refuting_outcome:
    - >-
      Heterozygous knock-in and heterozygous null neurons are indistinguishable,
      which would argue against a dominant mechanism of the truncated protein.
  evidence:
  - reference: PMID:32169168
    reference_title: "De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, these results indicate that the pathomechanism of truncating DNVs in the NMD(−) region of SEMA6B was most likely dominant-negative or gain-of-function, but not haploinsufficiency."
    explanation: >-
      The discovery study's inference, which names two mechanisms without
      choosing between them.
  - reference: PMID:36719163
    reference_title: "Progressive myoclonus epilepsies due to SEMA6B mutations. New variants and appraisal of published phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The exon 17 is mainly involved, with truncating mutations causing the production of aberrant proteins with toxic gain of function."
    explanation: >-
      A later clinical series states a toxic gain of function as if settled,
      without new functional data.
  - reference: PMID:35604360
    reference_title: "SEMA6B variants cause intellectual disability and alter dendritic spine density and axon guidance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study confirms that loss-of-function variants in the last exon confer pathogenicity and shows that missense mutations also exert deleterious effects."
    explanation: >-
      The neuronal study describes the same variant class as loss-of-function,
      the opposite framing.
- discussion_id: sema6b_spectrum_lump
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Are SEMA6B-related developmental and epileptic encephalopathy and
    intellectual disability without epilepsy the same disease as EPM11?
  attaches_to:
  - disease#Progressive Myoclonic Epilepsy Type 11
  rationale: >-
    This entry lumps them. All presentations arise from the same heterozygous
    de novo variants, mostly the same exon 17 truncations, and recurrent
    variants appear in patients classed in different groups. No genotype
    correlates with the progressive myoclonic versus encephalopathy
    presentation, MONDO and OMIM carry only the EPM11 concept, and several
    patients first diagnosed with an encephalopathy later developed the
    progressive myoclonic course. Age at last examination may explain part of
    the difference, since progressive myoclonus usually becomes evident in the
    second decade. The lump should be revisited if a genotype-phenotype
    correlation emerges or if missense variants prove to cause a distinct
    disorder.
  evidence:
  - reference: PMID:36719163
    reference_title: "Progressive myoclonus epilepsies due to SEMA6B mutations. New variants and appraisal of published phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, by the revision of literature, severity does not clearly correlate with genotype, and patients with the same genetic alteration could present different phenotypes."
    explanation: >-
      The same variant can produce different presentations, which argues for a
      single disease spectrum.
  - reference: PMID:39419291
    reference_title: "Progressive Myoclonus Epilepsy and Beyond: A Systematic Review of SEMA6B-related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In conclusion, although SEMA6B has been associated with PME, it may actually cause a much broader phenotypic spectrum."
    explanation: >-
      Systematic review conclusion that SEMA6B disease is a spectrum broader
      than PME.
- discussion_id: sema6b_progression_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What drives the regression in EPM11: ongoing neurodegeneration, the
    cumulative effect of seizures and myoclonus, or a developmental lesion
    that becomes symptomatic with age?
  attaches_to:
  - phenotypes#Developmental Regression
  - phenotypes#Loss of Speech
  - phenotypes#Spasticity
  rationale: >-
    Patients lose motor and language skills, often in the second decade, yet
    brain MRI is normal in most and neither neuropathology nor a model has
    shown neuronal loss. One appraisal attributes motor regression partly to
    worsening myoclonus, and treating myoclonus improved gait in one patient,
    but cognitive regression and pyramidal signs have no explanation. These
    phenotypes are therefore left without a causal edge in this entry.
  evidence:
  - reference: PMID:36719163
    reference_title: "Progressive myoclonus epilepsies due to SEMA6B mutations. New variants and appraisal of published phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeated MRIs (from the age of 3 to 25 years) were normal."
    explanation: >-
      Normal serial imaging despite severe regression in one patient.

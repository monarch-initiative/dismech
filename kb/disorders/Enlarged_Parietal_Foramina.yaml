    reference_title: "Haploinsufficiency of the human homeobox gene ALX4 causes skull ossification defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we identify ALX4, which encodes a paired-related homeodomain transcription factor, as the PFM disease gene in P11pDS."
    explanation: >-
      Establishes ALX4 haploinsufficiency as the cause of the parietal foramina
      in proximal 11p deletions.
  - reference: PMID:11106354
    reference_title: "The ALX4 homeobox gene is mutated in patients with ossification defects of the skull (foramina parietalia permagna, OMIM 168500)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of the ALX4 gene in three unrelated FPP families without the MSX2 mutation identified mutations in two families, indicating that mutations in ALX4 could be responsible for these skull defects"
    explanation: >-
      Intragenic ALX4 variants in families with isolated parietal foramina.
- name: PFM3
  display_name: Parietal Foramina 3 (4q21-q23 locus)
  description: >-
    Autosomal dominant parietal foramina linked to chromosome 4q21-q23 in a
    single large Chinese pedigree in which MSX2 and ALX4 were excluded. No gene
    has been identified, so this subtype carries no gene and is not wired into
    the pathograph.
  subtype_term:
    preferred_term: parietal foramina 3
    term:
      id: MONDO:0012302
      label: parietal foramina 3
  evidence:
  - reference: PMID:12905082
    reference_title: "A novel locus for parietal foramina maps to chromosome 4q21-q23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After exclusion of both the above loci in a large Chinese pedigree with autosomal dominant PFM, a genome-wide search revealed a linkage of the PFM to markers at the 4q21-q23 region."
    explanation: >-
      Defines the third parietal foramina locus by linkage.
- name: PFMCCD
  display_name: Parietal Foramina with Cleidocranial Dysplasia (MSX2)
  description: >-
    Parietal foramina with hypoplasia of the distal clavicles, allelic with
    PFM1 and aetiologically distinct from classical RUNX2-related cleidocranial
    dysplasia. Macrocephaly and a high forehead have been reported.
  genes:
  - preferred_term: MSX2
    term:
      id: hgnc:7392
      label: MSX2
  subtype_term:
    preferred_term: parietal foramina with cleidocranial dysplasia
    term:
      id: MONDO:0008198
      label: parietal foramina with cleidocranial dysplasia
  evidence:

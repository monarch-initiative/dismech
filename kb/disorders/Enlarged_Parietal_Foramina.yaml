    reference_title: "Parietal foramina with cleidocranial dysplasia is caused by mutation in MSX2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PFMCCD is indeed aetiologically distinct from CCD, which is caused by mutations in the RUNX2 gene, but allelic with isolated PFM, in which MSX2 mutations were previously identified."
    explanation: >-
      Places PFMCCD as an MSX2 allelic subtype of parietal foramina rather than
      a form of cleidocranial dysplasia.

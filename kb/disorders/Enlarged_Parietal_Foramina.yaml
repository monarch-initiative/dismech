diagnosis:
- name: Skull imaging and molecular testing
  description: >-
    Diagnosis rests on the characteristic defects on skull imaging plus a
    heterozygous pathogenic variant in ALX4 or MSX2. Testing has a high yield
    in familial cases and a low one in sporadic cases.
  evidence:
  - reference: PMID:20301307
    reference_title: "Enlarged Parietal Foramina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of enlarged parietal foramina is established in a proband with characteristic clinical and imaging findings and a heterozygous pathogenic variant in ALX4 or MSX2 identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criteria.
  - reference: PMID:16319823
    reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation screening has a high pickup rate in PFM, especially in familial cases, but is not indicated in CRS."
    explanation: Diagnostic yield of molecular testing.
  - reference: PMID:16319823
    reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accounting for 11/13 familial, but only 1/6 sporadic cases"
    explanation: ALX4 or MSX2 variants were found in most familial and few sporadic cases.
treatments:
- name: Conservative management and injury avoidance
  description: >-
    Treatment is generally conservative. Families and teachers are educated to
    avoid activities that risk penetrating injury, contact sports are avoided
    while a midline defect persists, and the defect is reassessed every 6 to
    12 months until its natural history is clear.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:20301307
    reference_title: "Enlarged Parietal Foramina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Contact sports in those with a persistent midline bony defect."
    explanation: GeneReviews circumstance to avoid.
  - reference: PMID:20301307
    reference_title: "Enlarged Parietal Foramina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "education of parents, teachers, and the affected child to avoid risky behaviors that could result in injury suffices in most circumstances."
    explanation: Education is sufficient for most individuals.
  - reference: PMID:20301307
    reference_title: "Enlarged Parietal Foramina."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Assess osseous defect every six to 12 months until natural history is established"
    explanation: GeneReviews surveillance recommendation.

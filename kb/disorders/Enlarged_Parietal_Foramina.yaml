animal_models:
- name: Msx2-null mouse
  species: Mouse
  genotype: Msx2-/-
  publication: PMID:10742104
  description: >-
    Msx2-deficient mice have defective skull ossification with a persistent
    calvarial foramen, plus endochondral bone, tooth, hair follicle, mammary
    gland and cerebellar defects and seizures.
  evidence:
  - reference: PMID:10742104
    reference_title: "Msx2 deficiency in mice causes pleiotropic defects in bone growth and ectodermal organ formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that Msx2-deficient mice have defects of skull ossification and persistent calvarial foramen."
    explanation: The knockout reproduces the persistent calvarial foramen.
  modeled_mechanisms:
  - target: Reduced Calvarial Osteoprogenitor Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the osteoprogenitor proliferation defect behind the calvarial
      foramen.
    limitations: >-
      The reported foramen phenotype is in Msx2-/- mice, whereas the human
      disease is heterozygous; the knockout also has endochondral bone defects
      not seen in people with parietal foramina.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The calvarial foramen is described in homozygous Msx2 knockouts, while
        the human lesion follows loss of one MSX2 allele, so the model is read
        at a different gene dose from the disease.
    evidence:
    - reference: PMID:10742104
      reference_title: "Msx2 deficiency in mice causes pleiotropic defects in bone growth and ectodermal organ formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This phenotype results from defective proliferation of osteoprogenitors at the osteogenic front during calvarial morphogenesis, and closely resembles that associated with human MSX2 haploinsufficiency in parietal foramina (PFM)."
      explanation: Links the mouse lesion to the human mechanism.
- name: Alx4 and Msx2 compound mutant mice
  species: Mouse
  genotype: Alx4+/-;Msx2+/- intercross (compound genotypes)
  publication: PMID:15198690
  description: >-
    Compound Alx4/Msx2 mutants show a skull vault defect that worsens with
    each allele lost, modelling the additive action of the two human genes.
  evidence:
  - reference: PMID:15198690
    reference_title: "Alx4 and Msx2 play phenotypically similar and additive roles in skull vault differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of an increasing number of alleles correlated with an incremental exacerbation of the skull vault defect"
    explanation: Dose-dependent skull vault defect.
  modeled_mechanisms:
  - target: Reduced Calvarial Osteoprogenitor Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Models the shared, dose-dependent osteogenic defect.
    limitations: >-
      The main effect is on the frontal bones in mice and the parietal bones in
      humans, and the study reads out skull vault ossification rather than
      proliferation directly.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Loss of Alx4 or Msx2 mainly affects the frontal bones in mice but the
        parietal bones in humans.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The study measures the size of the skull vault defect and ossification
        markers, standing in for the osteoprogenitor proliferation rate that
        the target node describes.
    evidence:
    - reference: PMID:15198690
      reference_title: "Alx4 and Msx2 play phenotypically similar and additive roles in skull vault differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In both mice and humans, loss of function of either gene is associated with ossification defects of the skull vault, although the major effect is on the frontal bones in mice and the parietal bones in humans."
      explanation: States the shared defect and its species difference in location.

progression:
- phase: Infancy
  notes: >-
    The defect is often a single midline opening between the anterior and
    posterior fontanelles (cranium bifidum).
  evidence:
  - reference: PMID:16319823
    reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frequently, PFM can be traced back to a central defect in infancy, extending between the anterior and posterior fontanelles; when this persists it is termed cranium bifidum (CB)."
    explanation: Describes the infantile midline form of the defect.
- phase: Childhood to adulthood
  notes: >-
    A midline bony bridge divides the defect into two foramina, which shrink
    with age through circumferential bone growth.
  evidence:
  - reference: PMID:16319823
    reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a bony bridge usually develops along the midline axis, creating two separate foramina, which tend to decrease in size with age through circumferential bone growth (Figure 1)."
    explanation: Describes the later course of the skull defect.
mechanistic_hypotheses:
- hypothesis_group_id: ectomeninx_patterning
  hypothesis_label: >-
    Reduced MSX2 or ALX4 dosage disturbs patterning of the ectomeninx, the
    shared primordium of the calvaria and dura
  status: EMERGING
  description: >-
    The dural venous and posterior fossa anomalies seen with enlarged parietal
    foramina are proposed to arise from the same dosage defect as the bone
    lesion, acting on the ectomeninx that forms both the calvarial bones and
    the dura. The proposal rests on the co-occurrence of the two sets of
    findings and on shared expression; it has not been tested experimentally.
    Edges that belong to it carry hypothesis_groups: [ectomeninx_patterning].
  evidence:
  - reference: PMID:16319823
    reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The similarity of the dural and calvarial abnormalities consequent upon reduced expression of both ALX4 or MSX2 suggests that a comparable defect in patterning of the ectomeninx underlies both disorders."
    explanation: Source of the hypothesis.
pathophysiology:
- name: MSX2 Haploinsufficiency
  description: >-
    Heterozygous deletion of MSX2, or homeodomain variants that abolish its DNA
    binding, halve MSX2 activity. MSX2 dosage is critical for calvarial
    osteogenesis: loss of activity gives parietal foramina, while a
    DNA-binding gain-of-function variant gives craniosynostosis.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MSX2
    term:
      id: hgnc:7392
      label: MSX2
  molecular_functions:
  - preferred_term: MSX2 DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10742103
    reference_title: "Functional haploinsufficiency of the human homeobox gene MSX2 causes defects in skull ossification."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mouse Msx2 protein with either of the homeodomain mutations exhibited more than 85% reduction in binding to an optimal Msx2 DNA-binding site."
    explanation: >-
      The patient homeodomain variants abolish DNA binding, making them
      functional null alleles.
  - reference: PMID:10742103
    reference_title: "Functional haploinsufficiency of the human homeobox gene MSX2 causes defects in skull ossification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One is a deletion of approximately 206 kb including the entire gene"
    explanation: >-
      A whole-gene deletion gives the same phenotype, so the mechanism is
      haploinsufficiency.
  downstream:
  - target: Reduced Calvarial Osteoprogenitor Proliferation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10742104
      reference_title: "Msx2 deficiency in mice causes pleiotropic defects in bone growth and ectodermal organ formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This phenotype results from defective proliferation of osteoprogenitors at the osteogenic front during calvarial morphogenesis, and closely resembles that associated with human MSX2 haploinsufficiency in parietal foramina (PFM)."
      explanation: >-
        In Msx2-deficient mice the calvarial foramen arises from defective
        osteoprogenitor proliferation at the osteogenic front.
  - target: Deficient Clavicular Ossification
    description: >-
      Reported only in the PFMCCD subtype; the step between MSX2 loss and the
      clavicular defect is not described in the cited sources.
    evidence:
    - reference: PMID:14571277
      reference_title: "Parietal foramina with cleidocranial dysplasia is caused by mutation in MSX2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our observations highlight the role of MSX2 in clavicular development and the importance of radiological examination of the clavicles in subjects with PFM."
      explanation: >-
        An MSX2 variant segregating with parietal foramina and clavicular
        hypoplasia links MSX2 to clavicle development.
  - target: Ectomeninx Patterning Defect
    hypothesis_groups:
    - ectomeninx_patterning
    evidence:
    - reference: PMID:16319823
      reference_title: "Enlarged parietal foramina caused by mutations in the homeobox genes ALX4 and MSX2: from genotype to phenotype."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The similarity of the dural and calvarial abnormalities consequent upon reduced expression of both ALX4 or MSX2 suggests that a comparable defect in patterning of the ectomeninx underlies both disorders."
      explanation: >-
        Proposes, from the shared dural and calvarial phenotype, that reduced
        MSX2 or ALX4 also disturbs patterning of the ectomeninx.

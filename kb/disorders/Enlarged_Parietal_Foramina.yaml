- name: PFM2
  display_name: Parietal Foramina 2 (ALX4)
  description: >-
    Autosomal dominant enlarged parietal foramina caused by heterozygous ALX4
    loss-of-function variants or deletions. Clinically indistinguishable from
    PFM1 in defect size, although the ALX4 p.R218Q variant tends to leave a
    persistent cranium bifidum with posterior fossa anomalies.
  genes:
  - preferred_term: ALX4
    term:
      id: hgnc:450
      label: ALX4
  subtype_term:
    preferred_term: parietal foramina 2
    term:
      id: MONDO:0012309
      label: parietal foramina 2
  evidence:

name: Enlarged Parietal Foramina
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  Enlarged parietal foramina are symmetric, paired oval defects of the parietal
  bones near the junction of the sagittal and lambdoid sutures, left by
  deficient intramembranous ossification around the parietal notch. In infancy
  the defect is often a single midline gap (cranium bifidum) that a bony bridge
  later divides into two foramina, which then shrink with age and may close.
  Most cases are autosomal dominant and caused by heterozygous loss-of-function
  variants in the homeodomain transcription factor genes MSX2 or ALX4, which
  account for similar proportions of cases and give clinically
  indistinguishable skull defects. The defects are usually asymptomatic;
  headache, local pain, and posterior fossa brain malformations with epilepsy
  occur in a minority.
synonyms:
- parietal foramina
- foramina parietalia permagna
- Catlin marks
- hereditary cranium bifidum
- symmetric parietal foramina
disease_term:
  preferred_term: parietal foramina
  term:
    id: MONDO:0018953
    label: parietal foramina
parents:
- Dysostosis
notes: >-
  Allelic and contiguous-gene conditions kept out of this entry: heterozygous
  MSX2 gain-of-function variants cause Boston-type craniosynostosis, the
  opposite skull phenotype; biallelic ALX4 loss causes frontonasal dysplasia
  type 2 (kb/disorders/Frontonasal_Dysplasia.yaml); and 11p11.2 deletions that
  remove ALX4 together with EXT2 cause Potocki-Shaffer syndrome, in which
  parietal foramina occur alongside multiple exostoses and, with larger
  deletions, intellectual disability. Orphanet's very rare annotations for
  intellectual disability, multiple exostoses and craniosynostosis belong to
  Potocki-Shaffer syndrome or co-inherited TWIST1 variants and are not
  curated here; cleft lip, cleft palate and myelomeningocele are omitted
  because their only sources are early single-family reports.

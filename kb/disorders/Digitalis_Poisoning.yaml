  - target: Confusion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extracardiac_pump_inhibition
- name: Hemodynamic Collapse
  biological_scale: ORGANISM
  description: >-
    Failure of cardiac output from the combined bradyarrhythmia, block and
    ventricular tachyarrhythmia. The proximate cause of death in fatal digitalis
    poisoning; the myocardium is not structurally injured.
  downstream:
  - target: Cardiac arrest
    causal_link_type: DIRECT
phenotypes:
- category: Cardiovascular
  name: Bidirectional ventricular tachycardia
  description: >-
    Beat-to-beat alternation of QRS axis, produced by ectopic foci whose impulses
    travel alternately down different conduction pathways. It is an unusual
    arrhythmia and a recognised presentation of digoxin toxicity, but it is not
    specific to it: the same pattern occurs in myocarditis, myocardial infarction,
    Andersen-Tawil syndrome, arrhythmogenic right ventricular cardiomyopathy,
    catecholaminergic polymorphic ventricular tachycardia and aconite poisoning,
    the last of which this knowledge base curates as Aconitine_Poisoning.
  phenotype_term:
    preferred_term: Bidirectional ventricular tachycardia
    term:
      id: HP:0034040
      label: Bidirectional ventricular tachycardia
  evidence:
  - reference: PMID:34159036
    reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bidirectional ventricular tachycardia is an unusual arrhythmia wherein every other beat has a different QRS axis as it travels alternately down different conduction pathways."
    explanation: >-
      Defines the arrhythmia, in a case report of digoxin-induced bidirectional
      ventricular tachycardia.
  - reference: PMID:34159036
    reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The arrhythmia can be a manifestation of myocarditis, myocardial infarct, Andersen-Tawil syndrome, arrhythmogenic right ventricular cardiomyopathy, catecholaminergic polymorphic ventricular tachycardia, herbal aconite poisoning, and digoxin toxicity."
    explanation: >-
      The differential. Cited because it constrains the claim: an earlier draft of
      this description called the finding close to diagnostic, and this sentence
      names six other causes.

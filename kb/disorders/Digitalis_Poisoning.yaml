biochemical:
- name: Serum potassium
  subtype: Acute
  presence: Increased
  context: >-
    Prognostic stratification in acute poisoning, and the threshold on which the
    antidote decision is usually made.
  biomarker_term:
    preferred_term: Potassium
    term:
      id: NCIT:C765
      label: Potassium
  reference_ranges:
  - unit: mEq/L
    population: acute digitalis or cardiac glycoside poisoning, before antidote
    notes: >-
      No normal interval is recorded here because no cached source in this entry
      states one; only the prognostic bands, which are what the cited sentence
      carries. `loinc_term` is likewise omitted, because LOINC has no adapter in
      `conf/oak_config.yaml` and no `cache/` membership file, so a LOINC code
      written here could not be validated by anything in the repository. The bands
      are recorded in mEq/L, the unit serum potassium is reported in; note that the
      quoted sentence prints "meq/dl", which is not a serum potassium unit, and the
      snippet preserves that as the source wrote it.
    evidence:
    - reference: PMID:22737544
      reference_title: Good outcome after digoxin toxicity despite very high serum potassium level.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "mortality after digoxin toxicity have been reported to be zero in patients with acute digoxin toxicity and potassium levels less than 5.0 meq/dl, 50% in potassium levels between 5.0 and 5.5, and 100 percent in those with potassium levels above 5.5 meq/dl"
      explanation: >-
        The source of all three bands. Graded exactly as the same sentence is
        graded on the Hyperkalemia phenotype, since evidence_source classifies the
        publication and cannot change because the quote moved.
    interpretation_bands:
    - name: Below the antidote threshold
      upper_bound: 5.0
      unit: mEq/L
      abnormal_flag: NORMAL
      interpretation: >-
        No deaths in the cited pre-Fab series. This is the band in which the
        potassium is not itself an indication for antidote.
    - name: Intermediate
      lower_bound: 5.0
      upper_bound: 5.5
      unit: mEq/L
      abnormal_flag: HIGH
      severity: MODERATE
      phenotype_term:
        preferred_term: Hyperkalemia
        term:
          id: HP:0002153
          label: Hyperkalemia
      interpretation: >-
        Roughly 50% mortality without digoxin-specific Fab in the cited series.
    - name: Above the antidote threshold
      lower_bound: 5.5
      unit: mEq/L
      abnormal_flag: CRITICAL_HIGH
      severity: SEVERE
      phenotype_term:
        preferred_term: Hyperkalemia
        term:
          id: HP:0002153
          label: Hyperkalemia
      interpretation: >-
        100% mortality in the cited pre-Fab series, but read this band together
        with the `potassium_threshold_as_absolute_rule` discussion, where the same
        publication reports its own patient surviving above the threshold without
        Fab. The band describes an untreated historical cohort, not a rule.
  evidence:
  - reference: PMID:8492338
    reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Previous assessment of outcome has shown that mortality increases in patients exhibiting five prognostic factors: 1) advanced age; 2) heart disease; 3) male sex; 4) high-degree atrioventricular block; 5) hyperkalemia."
    explanation: >-
      Places potassium among five prognostic factors rather than above them, which
      is why the bands above are recorded as a stratification and not as a score.
  notes: >-
    Added in review. The bands were already quoted on the Hyperkalemia phenotype;
    this block is what makes them queryable. Review attributed them to
    PMID:7267327, which does not carry them - that abstract reports a 17%
    overall mortality and a 2-74% range across four clinical factors, and never
    names a potassium threshold. The bands come from PMID:22737544, which this
    entry already cited for exactly this sentence.
environmental:
- name: Ingestion of a cardiac-glycoside-containing plant or animal product
  description: >-
    Foxglove, oleander, yellow oleander, lily-of-the-valley and toad-derived
    bufadienolide preparations all deliver cardiac glycosides and produce the same
    toxidrome by the same mechanism. In South Asia, yellow oleander
    seed ingestion is a major route of self-poisoning, and it is the setting in
    which the only randomised antidote trials for this class have been run.
  exposure_term:
    preferred_term: dietary exposure to a plant or animal cardiac glycoside
    term:
      id: ECTO:0000537
      label: exposure to toxin
  influences_mechanisms:
  - target: Systemic Cardiac Glycoside Excess
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Non-pharmaceutical glycoside sources reach the same systemic exposure node as
      a digoxin overdose.
    evidence:
    - reference: PMID:17054261
      reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Because cardenolides from these plants are structurally similar, acute poisonings are managed using similar treatments."
      explanation: >-
        States the structural and management equivalence that justifies routing
        plant exposures to the same mechanism node as pharmaceutical digoxin.
        BACKGROUND because it is the review's framing sentence. Note the same review
        elsewhere says antidote results do not readily translate between
        cardenolides, which this entry records as a REFUTE in the transfer discussion.
  evidence:
  - reference: PMID:17054261
    reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "cardiotoxicity from other cardenolides such as the yellow oleander are also a major problem, with tens of thousands of cases of poisoning each year in South Asia"
    explanation: >-
      Establishes the scale and geography of the non-pharmaceutical route.
      BACKGROUND rather than REVIEW_SYNTHESIS because the sentence sits in the
      review's background section, stating context rather than its own synthesis;
      the review's synthesis is quoted on the treatments, from its results.
  notes: >-
    Bound to the genus ECTO:0000537 exposure to toxin, after rejecting two nearer
    terms on positive grounds. Searched the pinned local build with
    `uv run runoak -i sqlite:obo:ecto search` for `l~glycoside`, `l~digital`,
    `l~cardenolide`, `l~oleander`, `l~digoxin`, `l~bufadienolide` and `l~ouabain`
    on 2026-09-19. `l~cardenolide`, `l~oleander`, `l~digoxin`, `l~bufadienolide`
    and `l~ouabain` return no ECTO exposure class. Two do exist and were rejected.
    ECTO:9000003 exposure to digitalin is a real digitalis-glycoside exposure
    class, but digitalin is one specific compound of Digitalis purpurea; this entry
    covers digoxin, digitoxin, oleandrin and bufadienolides, and almost no patient
    in it is exposed to digitalin, so the term would be precise and wrong.
    ECTO:9000436 exposure to glycoside is its parent and would cover the whole
    entry, but `RO:0002309` relates it to CHEBI:24400 glycoside, a chemical class
    whose other members include the aminoglycoside antibiotics; nothing about the
    toxicity follows from the glycosidic bond, so it names the wrong feature of the
    molecule. ECTO:0000524 exposure to mycotoxin is wrong on its face - these are
    plant and amphibian toxins, not fungal. ECTO:0000537 matches the pattern of
    Ciguatera_Fish_Poisoning and Acute_Ackee_Fruit_Intoxication, which bind it and
    carry the agent in preferred_term.
treatments:
- name: Digoxin-Specific Antibody Fragments
  description: >-
    Ovine Fab fragments that bind free glycoside and remove it from the pump. The
    only treatment here that acts on the lesion rather than on its consequences.
    It is one of two interventions in this entry with randomised evidence behind
    it, the other being multiple-dose activated charcoal; both trials were in
    yellow oleander poisoning rather than in digoxin.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ovine digoxin immune Fab
      term:
        id: NCIT:C80835
        label: Ovine Digoxin Immune Fab
  target_mechanisms:
  - target: Sodium-Potassium ATPase Inhibition
    treatment_effect: RESTORES
    description: >-
      Binding free glycoside releases the pump, which is why the antidote reverses
      the dysrhythmias and the hyperkalemia together.
    evidence:
    - reference: PMID:8492338
      reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "a strong toxicodynamic effect due to quick reversal of digitalis-induced dysrhythmias, hyperkalemia, and myocardial depression, by reactivation of membrane ATPases"
      explanation: >-
        States the mechanism this edge asserts - reactivation of the pump - and
        names the three effects that reverse together, which is the signature of
        acting on the shared upstream lesion rather than on each downstream branch.
  evidence:
  - reference: PMID:17054261
    reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second study found a beneficial effect of anti-digoxin Fab antitoxin on the presence of cardiac dysrhythmias at two hours post-administration; the RR was 0.60 (95% CI 0.44 to 0.81)."
    explanation: >-
      The randomised evidence, from a systematic review. Note the endpoint is
      dysrhythmia at two hours, not mortality, and the trial was in yellow oleander
      poisoning.
  - reference: PMID:1993775
    reference_title: 'Digoxin Immune Fab therapy in the management of digitalis intoxication: safety and efficacy results of an observational surveillance study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifty percent of patients were reported to have a complete response to treatment, 24% a partial response and 12% no response."
    explanation: >-
      Response rates in 717 adults treated with the antidote in an observational
      surveillance study. Uncontrolled, and a complete response in half is a more
      measured picture than "antidote" suggests.
  - reference: PMID:1993775
    reference_title: 'Digoxin Immune Fab therapy in the management of digitalis intoxication: safety and efficacy results of an observational surveillance study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (0.8%, 95% confidence interval 0.3% to 1.8%) had an allergic reaction to digoxin-specific antibody fragments."
    explanation: >-
      The harm side of the same series: allergic reaction to an ovine product, with
      a confidence interval, which is what makes the rate usable.
- name: Multiple-Dose Activated Charcoal
  description: >-
    Repeated enteral charcoal, the only intervention in this entry with randomised
    evidence of a mortality benefit - again in yellow oleander poisoning rather
    than in digoxin.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multiple-dose activated charcoal
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
    therapeutic_agent:
    - preferred_term: activated charcoal
      term:
        id: CHEBI:91090
        label: charcoal
  evidence:
  - reference: PMID:17054261
    reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "One trial investigated the effect of MDAC on mortality, the relative risk (RR) was 0.31 (95% confidence interval (CI) 0.12 to 0.83) indicating a beneficial effect."
    explanation: >-
      A randomised mortality benefit, in yellow oleander poisoning. The confidence
      interval is wide and excludes 1 only just.
- name: Atropine
  description: >-
    A temporising measure for bradyarrhythmia and block, directed at the vagal
    limb of the toxidrome rather than at the pump.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Increased Vagal Tone
    treatment_effect: INHIBITS
    description: >-
      Muscarinic blockade opposes the vagal slowing of sinus rate and
      atrioventricular conduction. It does nothing about the ectopy.
    evidence:
    - reference: PMID:8492338
      reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "First-line antiarrhythmic therapy is usually atropine, because of bradycardia-induced arrhythmia."
      explanation: >-
        Places atropine as first-line and gives the indication - bradycardia-driven
        arrhythmia - which is the vagal limb this edge targets.
- name: Therapeutic Plasma Exchange
  description: >-
    Salvage for the specific case where the antidote is insufficient - a large
    tissue burden with renal failure, where Fab-glycoside complexes are cleared
    slowly and can dissociate. Not a treatment for ordinary poisoning, and
    conventional haemodialysis is ineffective for digoxin.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic plasma exchange
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  evidence:
  - reference: PMID:41399569
    reference_title: 'Digoxin Toxicity in Renal Failure: Resolution With Plasma Exchange After Fab Therapy Failure.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the delayed clearance of digoxin-Fab complexes can result in complex dissociation and rebound toxicity"
    explanation: >-
      States the failure mode this salvage addresses. A single case report, which
      is the whole of the evidence for it.
  - reference: PMID:41399569
    reference_title: 'Digoxin Toxicity in Renal Failure: Resolution With Plasma Exchange After Fab Therapy Failure.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conventional extracorporeal therapies such as hemodialysis are ineffective for removing digoxin or its antibody complexes due to their large molecular size and high volume of distribution"
    explanation: >-
      Sources the statement that ordinary haemodialysis does not work here, and
      gives the reason - distribution volume and molecular size - rather than
      leaving it as an assertion.
- name: Supportive Care and Electrolyte Management
  description: >-
    Correction of potassium and magnesium, rhythm monitoring, and avoidance of
    manoeuvres that make things worse - gastric lavage risks vagal stimulation in a
    patient already bradycardic, and cardioversion risks refractory ventricular
    fibrillation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Temporary Cardiac Pacing
  description: >-
    Ventricular pacing for bradycardia and high-degree atrioventricular block when
    the antidote is unavailable or has not yet worked. The cited review recommends
    it and warns about it in the same breath, which is how it is recorded here: it
    addresses the conduction limb of the toxidrome without touching the pump
    inhibition that produces it, and it is technically awkward in a myocardium that
    is already irritable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: temporary transvenous ventricular pacing
    term:
      id: NCIT:C99998
      label: Pacemaker Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cardiac pacemaker
        term:
          id: NCIT:C94198
          label: Cardiac Pacemaker
  target_mechanisms:
  - target: Atrioventricular Conduction Block
    treatment_effect: BYPASSES
    description: >-
      Paces through the block rather than relieving it; the pump inhibition
      upstream is untouched.
    evidence:
    - reference: PMID:8492338
      reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Ventricular pacing is a toxicodynamic treatment that may be helpful in both bradycardia-induced arrhythmia and high-degree atrioventricular block."
      explanation: >-
        Names both indications, and classes pacing as toxicodynamic - acting on the
        consequence rather than on the toxin.
  evidence:
  - reference: PMID:8492338
    reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pacing is difficult to handle and can result in serious adverse effects."
    explanation: >-
      The same review's warning, recorded beside the recommendation so the entry
      does not present pacing as a straightforward option.
genetic:
- name: ABCB1
  notes: >-
    P-glycoprotein, encoded by ABCB1, effluxes digoxin in the intestine and the
    kidney, and the drug interactions that precipitate chronic toxicity work
    largely by inhibiting it. Common ABCB1 variants are a susceptibility modifier,
    not a cause: this is not a heritable disease and there is no causal gene.
  relationship_type: MODIFIER
  gene_term:
    preferred_term: ABCB1
    term:
      id: hgnc:40
      label: ABCB1
  evidence:
  - reference: PMID:21311904
    reference_title: Post-mortem ABCB1 genotyping reveals an elevated toxicity for female digoxin users.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutant genotype frequencies showed a positive relationship with post-mortem digoxin concentration for all SNPs."
    explanation: >-
      Associates ABCB1 genotype with post-mortem digoxin concentration in 112
      deceased subjects. Graded INDIRECT because a post-mortem concentration
      association is several steps from a clinical susceptibility claim, and the
      design cannot separate exposure from disposition.
  - reference: PMID:12492608
    reference_title: MDR1 genotypes do not influence the absorption of a single oral dose of 1 mg digoxin in healthy white males.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "AUC(0,4 h), Cmax and tmax, used as indices of digoxin absorption, were not significantly different in any of the genotype groups tested."
    explanation: >-
      Scoped to the claim that ABCB1 genotype alters digoxin exposure. A negative
      pharmacokinetic result in fifty healthy volunteers, and the counterweight to
      the post-mortem association above; the two are not in direct conflict, since
      one measures single-dose absorption and the other a post-mortem
      concentration, but recording only the positive one would misstate the field.
      The paper's own title states the negative result, but a title is not quoted
      here as a finding - this is the result sentence from the abstract.
diagnosis:
- name: Serum potassium in acute poisoning
  description: >-
    Not a diagnostic test for the poisoning but a prognostic measurement in it, and
    an indication for antidote. It is informative because it reports on the
    mechanism: potassium leaves cells in proportion to how much of the body's pump
    capacity has been switched off. The cited series ranks it alongside age, sex,
    atrioventricular block and prior heart disease rather than above them, and does
    not compare it with the serum drug level.
  diagnosis_term:
    preferred_term: serum potassium measurement for risk stratification
    term:
      id: NCIT:C61030
      label: Serum Potassium Measurement
  evidence:
  - reference: PMID:7267327
    reference_title: '[Prognostic factors in acute digitalis poisoning (author''s transl)].'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It increased with age, with digitoxin and potassium serum levels and even more with persistent hyperkalemia."
    explanation: >-
      The prognostic association, in 179 patients. Persistent hyperkalemia carried
      more weight than the single value.
- name: Serum digoxin concentration
  description: >-
    Confirms exposure but is a poor guide to severity, and becomes uninterpretable
    once the antidote has been given because the assay cannot distinguish bound
    from free drug.
  diagnosis_term:
    preferred_term: serum digoxin concentration measurement
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  notes: >-
    NCIT has no digoxin measurement term. Searched the local build with
    `uv run runoak -i sqlite:obo:ncit search 'l~Digoxin'` and `'l~digoxin'` on
    2026-09-19; the hits are digoxin the substance, digoxin immune Fab and the
    gene/transporter terms, with no measurement or assay among them, where the
    sibling potassium entry binds the specific NCIT:C61030 Serum Potassium
    Measurement. This was bound to the branch root NCIT:C18020 Diagnostic
    Procedure until review pointed out that NCIT:C217390 Diagnostic Blood Testing
    is strictly narrower and still correct for a serum assay; `ancestors -p i`
    confirms C217390 is a child of C18020 and reaches NCIT:C25218, the
    TreatmentActionTerm root.
  evidence:
  - reference: PMID:37465455
    reference_title: 'Review: Failure of current digoxin monitoring for toxicity: new monitoring recommendations to maintain therapeutic levels for efficacy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The current recommendations for monitoring digoxin, a narrow therapeutic index drug, are limited to confirming medication use or investigating suspicion of toxicity"
    explanation: >-
      Describes what the level is actually used for, which is narrower than its
      reputation.
- name: Electrocardiography and continuous cardiac monitoring
  description: >-
    The front-line test, and the one that carries this entry's cardiac phenotypes:
    seven of them - atrioventricular block, bidirectional ventricular tachycardia,
    atrial tachycardia with block, junctional ectopic tachycardia, premature
    ventricular contractions, sinus bradycardia and ventricular fibrillation - are
    ECG diagnoses and had no diagnostic modality behind them until this entry was
    reviewed. It is not specific: no ECG pattern here is unique to digitalis, so
    the ECG localises and grades the rhythm disturbance while the history, the
    potassium and the drug level establish the cause.
  diagnosis_term:
    preferred_term: 12-lead electrocardiography and continuous cardiac monitoring
    term:
      id: NCIT:C217427
      label: Diagnostic Electrocardiography Testing
  evidence:
  - reference: PMID:8492338
    reference_title: Clinical features and management of digitalis poisoning--rationale for immunotherapy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The intensity of gastrointestinal and visual symptoms together with hyperkalemia and the characteristic ECG features make diagnosis of acute digitalis intoxication relatively easy."
    explanation: >-
      Names the ECG as one of the three findings that make the diagnosis, and
      scopes that statement to acute intoxication, which is why the sentence also
      supports the Acute subtype above.
  - reference: PMID:34159036
    reference_title: "A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "An electrocardiogram (EKG) revealed a wide complex tachycardia with alternating QRS axis, suggestive of bidirectional ventricular tachycardia (BDVT)"
    explanation: >-
      A worked instance of the modality making the rhythm diagnosis this entry
      curates as a phenotype.
  notes: >-
    NCIT:C217427 was offered in review and verified before binding: it resolves in
    the local NCIT build with that exact label, and `ancestors -p i` puts it under
    NCIT:C18020 Diagnostic Procedure and NCIT:C25218 Clinical Intervention or
    Procedure, so it is inside the TreatmentActionTerm root that diagnosis_term
    requires.
clinical_trials:
- name: ISRCTN71018309
  status: COMPLETED
  description: >-
    Fructose-1,6-diphosphate as a candidate antidote in yellow oleander poisoning -
    a double-blind randomised placebo-controlled trial in Sri Lanka, target 240
    patients. Recorded as a registered trial rather than as a treatment: the only
    cached publication for it (PMID:20587052) is the study protocol, which reports
    no results, so there is nothing here that could support an efficacy claim.
    Recorded because review asked why FDP was absent from the treatments, and this
    is the honest answer - the intervention was tested, and this entry has no
    result to cite.
  notes: >-
    `phase` is omitted rather than guessed. The WHO ICTRP record carries no phase
    field for this registration, and NOT_APPLICABLE is scoped to observational and
    device studies, which an interventional drug randomisation is not.
  evidence:
  - reference: ICTRP:ISRCTN71018309
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Study design | Double-blind randomised placebo controlled trial (Treatment)"
    explanation: >-
      WHO ICTRP registration record establishing the trial's design and identity.
      OTHER because a registration document is not study evidence.
  - reference: ICTRP:ISRCTN71018309
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recruitment status | Completed"
    explanation: >-
      The trial completed recruitment, which is why its absence from the treatment
      section is a missing result rather than a missing trial.
prevalence:
- population: United States, National Poison Control Center data 2012-2020
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    An absolute annual death count, not a rate - there is no denominator here, so
    no prevalence class can honestly be assigned. Recorded because it is the
    clearest available statement of the current burden in a country with
    comprehensive poison-centre reporting.
  evidence:
  - reference: PMID:37465455
    reference_title: 'Review: Failure of current digoxin monitoring for toxicity: new monitoring recommendations to maintain therapeutic levels for efficacy.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data from the United States National Poison Control Center (2012-2020) show annual deaths due to digoxin of 18-36"
    explanation: The annual death count this record exists to capture.
- population: Patients hospitalised after absorbing more than 2 mg of digitoxin
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Case fatality in a defined poisoned cohort, not a population rate. The agent is
    digitoxin rather than digoxin, and the series predates the antidote.
  evidence:
  - reference: PMID:7267327
    reference_title: '[Prognostic factors in acute digitalis poisoning (author''s transl)].'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mortality rate in this series was 17%."
    explanation: Case fatality in the 179-patient series.
animal_models:
- name: Canine Purkinje fibre strophanthidin preparation
  species: Dog
  description: >-
    Isolated canine Purkinje fibres exposed to strophanthidin under microelectrode
    recording, the classical preparation in which the diastolic oscillations that
    became known as delayed afterdepolarizations were characterised. It is an ex
    vivo tissue preparation from a dog rather than a whole-animal poisoning model.
  publication: PMID:1257581
  modeled_mechanisms:
  - target: Delayed Afterdepolarization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The oscillations and the spontaneous activity that follows them are directly
      recorded, which is the node itself rather than a proxy for it.
    limitations: >-
      The glycoside is strophanthidin, not digoxin, and the preparation is isolated
      tissue with no autonomic input, so it models the myocyte limb of this entry
      and says nothing about the vagal limb.
    evidence:
    - reference: PMID:1257581
      reference_title: On the mechanisms underlying digitalis toxicity in cardiac Purkinje fibers.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transmembrane potentials of quiescent, spontaneously active, or electrically driven fibers were recorded in the presence and absence of strophanthidin"
      explanation: The recording method, which is what makes this a direct observation of the node.
- name: Guinea pig lethal digoxin infusion with monoclonal Fab rescue
  species: Guinea pig
  description: >-
    Whole-animal digoxin poisoning taken to an otherwise lethal endpoint and
    reversed with digoxin-specific antibody fragments - the model that established
    the antidote concept before it reached patients.
  publication: PMID:6707937
  modeled_mechanisms:
  - target: Sodium-Potassium ATPase Inhibition
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Antibody fragments reverse otherwise lethal toxicity, which is the in vivo
      demonstration that sequestering the glycoside releases the lesion.
    limitations: >-
      The antibody here is monoclonal, whereas the clinical product is polyclonal
      ovine Fab, and guinea pig myocardial glycoside sensitivity is not identical to
      human.
    evidence:
    - reference: PMID:6707937
      reference_title: Reversal of lethal digoxin toxicity in guinea pigs using monoclonal antibodies and Fab fragments.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "reversal of advanced, otherwise lethal digoxin toxicity in guinea pigs"
      explanation: States the model and the rescue endpoint.
discussions:
- discussion_id: calcium_in_digitalis_hyperkalemia
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is intravenous calcium actually dangerous in digitalis-induced hyperkalemia, or
    is the contraindication inherited from older literature that controlled
    experiment does not support?
  attaches_to:
  - pathophysiology#Sarcoplasmic Reticulum Calcium Overload
  - treatments#Supportive Care and Electrolyte Management
  rationale: >-
    The mechanistic argument for withholding calcium is exactly this entry's
    canonical chain: the cell is already calcium-overloaded, so adding calcium
    should make the arrhythmia worse - the "stone heart" concern. It is a textbook
    contraindication. The only controlled test in the cached literature is a
    twelve-animal porcine study that found no difference in time to death, and its
    own background section describes the contraindication as resting on older
    literature rather than on controlled data. Twelve pigs do not overturn a
    contraindication, and the study reports a pilot; but the asymmetry is worth
    recording, because the reasoning behind the dogma is a mechanistic inference
    from the same model this entry curates, and mechanistic inference is precisely
    what an outcome study is supposed to check.
  evidence:
  - reference: PMID:15461240
    reference_title: The effect of calcium chloride in treating hyperkalemia due to acute digoxin toxicity in a porcine model.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "The administration of intravenous (IV) calcium to treat hyperkalemia resulting from digoxin poisoning is considered potentially dangerous, based on a body of older literature which, in sum, reported increased cardiac glycoside toxicity with calcium administration"
    explanation: >-
      States the contraindication and, in the same sentence, what it rests on.
      BACKGROUND because the sentence is this paper's framing of prior belief, not
      its own result - its result is the REFUTE item below.
  - reference: PMID:39219774
    reference_title: 'Stone heart syndrome: A curious case of digoxin toxicity and calcium infusion.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Research on this subject is conflicting, so it is imperative to approach it cautiously."
    explanation: >-
      An independent source characterising the evidence on this question as
      conflicting rather than settled, which is the state this discussion records.
  - reference: PMID:15461240
    reference_title: The effect of calcium chloride in treating hyperkalemia due to acute digoxin toxicity in a porcine model.
    supports: REFUTE
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The administration of intravenous CaCl in the setting of hyperkalemia from acute digoxin toxicity did not affect mortality or time to death at the dose administered."
    explanation: >-
      Scoped to the claim that calcium worsens outcome in this setting, and only to
      the dose and model tested - six animals per arm, in swine. It does not
      establish that calcium is safe in patients.
- discussion_id: potassium_threshold_as_absolute_rule
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does a serum potassium above 5.5 mEq/L in acute digitalis poisoning really
    carry the near-certain mortality the classic stratification reports?
  attaches_to:
  - phenotypes#Hyperkalemia
  rationale: >-
    The 0% / 50% / 100% stratification by potassium band is quoted throughout the
    clinical literature and drives the decision to give antidote. It comes from a
    pre-antidote era and, on its face, asserts a 100% mortality that a single
    survivor falsifies. The case report that restates the rule is itself such a
    survivor, treated without Fab. That does not make the threshold useless - it
    remains the best-validated marker available and the right trigger for treatment
    - but the entry records the figure and its counterexample together rather than
    the figure alone.
  evidence:
  - reference: PMID:22737544
    reference_title: Good outcome after digoxin toxicity despite very high serum potassium level.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case of acute digoxin toxicity with high potassium level and good outcome despite unavailability of digoxin-specific Fab fragments."
    explanation: >-
      Scoped narrowly to the "100% mortality above 5.5" claim, which a single
      survivor is sufficient to refute as an absolute. It does not refute the
      association between potassium and mortality, which the prognostic series
      supports and this entry records.
- discussion_id: no_randomised_evidence_for_digoxin_itself
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is every randomised antidote trial for this poisoning in yellow oleander
    rather than in digoxin, and does that evidence transfer?
  attaches_to:
  - treatments#Digoxin-Specific Antibody Fragments
  - treatments#Multiple-Dose Activated Charcoal
  rationale: >-
    Both randomised results this entry cites - charcoal on mortality, Fab on
    dysrhythmia - come from yellow oleander self-poisoning in South Asia, where the
    case numbers are large enough to run a trial and the antidote is too expensive
    to be standard. For pharmaceutical digoxin, where the antidote is standard of
    care, the evidence is observational. The systematic review states that no
    antidote studies in other cardenolides were identified at all. The transfer
    argument is mechanistic - the same pump, the same chain - which is the sort of
    argument the rest of this entry is built to make explicit rather than assume.
  evidence:
  - reference: PMID:17054261
    reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies assessing the effect of antidotes on other cardenolides were not identified."
    explanation: >-
      The gap stated by the systematic review itself: the randomised evidence base
      covers yellow oleander and nothing else in this class.
  - reference: PMID:17054261
    reference_title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given pharmacokinetic differences between individual cardenolides, the effect of antidotes administered to patients with yellow oleander poisoning cannot be readily translated to those of other cardenolides."
    explanation: >-
      Scoped to the transfer argument this discussion raises. The review the entry
      cites for the yellow-oleander trials says in so many words that their results
      do not readily translate to other cardenolides, which is the opposite of the
      mechanistic transfer argument, and is recorded here rather than left out.
references:
- reference: PMID:7267327
  title: '[Prognostic factors in acute digitalis poisoning (author''s transl)].'
- reference: PMID:17054261
  title: Antidotes for acute cardenolide (cardiac glycoside) poisoning.
- reference: PMID:28550304
  title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.

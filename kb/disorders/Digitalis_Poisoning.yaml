name: Digitalis Poisoning
creation_date: '2026-09-19T22:00:00Z'
description: >-
  Poisoning by digoxin or another cardiac glycoside. One molecular lesion accounts
  for nearly all of it: the drug binds the extracellular face of the
  sodium-potassium pump and stops it. That is also how the drug works at
  therapeutic dose, so unlike most poisonings there is no separate toxic mechanism
  to describe - only more of the intended one, in a drug whose therapeutic window
  is narrow enough that the two overlap.

  What follows is a chain of ion-gradient failures. Sodium accumulates inside the
  myocyte, which starves the sodium-calcium exchanger of the gradient it uses to
  pump calcium out, so calcium accumulates too. An overloaded sarcoplasmic
  reticulum releases calcium spontaneously after repolarization, the exchanger
  turns that release into an inward current, and the resulting afterdepolarization
  fires an unscheduled beat. Meanwhile the same drug raises vagal tone and slows
  conduction through the atrioventricular node. The combination - ectopic firing
  from below, block from above - is the classic description of the toxidrome as
  increased automaticity with decreased conduction, and it is why the
  electrocardiogram can show a fast rhythm and a blocked one at once.

  Two features set the clinical problem apart. Potassium leaks out of every cell
  whose pump is inhibited, so in acute poisoning the serum potassium is a readout
  of how comprehensively the pump has been shut down, and it carries prognostic
  information. And the poison is not confined to pharmacy shelves: foxglove, oleander, lily-of-the-valley and toad bufadienolides produce
  the same syndrome by the same mechanism.
categories:
- Toxic Exposure Disorder
- Treatment Toxicity
- Foodborne Toxin Exposure
category: Complex
parents:
- Poisoning
synonyms:
- digoxin toxicity
- digitalis intoxication
- cardiac glycoside poisoning
- digitalis glycoside overdose

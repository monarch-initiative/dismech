  - target: Hemodynamic Collapse
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Extracellular Potassium Shift
  biological_scale: ORGANISM
  description: >-
    Potassium moving out of cells body-wide because the pump that returns it is
    inhibited. This is a systemic readout of how thoroughly the pump has been
    blocked, and it carries prognostic information: the cited series found death
    risk rising with serum potassium and more steeply with hyperkalemia that
    persisted. It is described as a feature of acute poisoning rather than of slow
    accumulation, where renal handling has time to compensate, though no cached
    source in this entry states that contrast directly.
  biological_processes:
  - preferred_term: potassium ion homeostasis
    term:
      id: GO:0055075
      label: potassium ion homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:7267327
    reference_title: '[Prognostic factors in acute digitalis poisoning (author''s transl)].'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "It increased with age, with digitoxin and potassium serum levels and even more with persistent hyperkalemia."
    explanation: >-
      From a 179-patient series of digitoxin poisoning: death risk rose with serum
      potassium, and more steeply with hyperkalemia that persisted. Note the agent
      here is digitoxin rather than digoxin.
  downstream:
  - target: Hyperkalemia
    causal_link_type: DIRECT
- name: Direct Cardiac Ion Channel Block
  biological_scale: MOLECULAR
  description: >-
    Inhibition of the L-type calcium current and of the rapid delayed rectifier
    potassium current by the glycoside itself, demonstrated with cytosolic calcium
    chelated and the sodium pump already blocked - so neither the calcium-overload
    chain nor pump inhibition accounts for it.

    The agent caveat is large enough to state plainly: the effect was measured
    mostly in bufadienolides, which are toad-derived, and the two cardenolides
    tested - ouabain and pecilocerin A, the class digoxin belongs to - showed
    around 10 to 15 per cent inhibition with IC50s above 100 micromolar, which is
    to say essentially none at attainable concentrations. Digoxin itself was not
    tested. The node is retained because the mechanism is real and this entry
    covers bufadienolide sources, but it should not be read as operating in
    ordinary digoxin poisoning.
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  - preferred_term: delayed rectifier potassium channel activity
    term:
      id: GO:0005251
      label: delayed rectifier potassium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28550304
    reference_title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "BF and CBG demonstrated a concentration-dependent (0.1 to100 µM) I Ca,L inhibition (maximal ≥50%) without and with the NKA activity blocked by 10 µM Oua"
    explanation: >-
      The controlled result that makes this node separable from the canonical
      chain: the calcium-current inhibition is present both with and without the
      pump already blocked by ouabain, so pump inhibition cannot be producing it.
      The paper's conclusion sentence states this more directly but quotes a
      bracketed ion notation that the reference validator strips as a citation
      marker, so the result sentence is quoted instead.
  - reference: PMID:28550304
    reference_title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "BF and CBG at 100 µM demonstrated a strong inhibition (≥40%) of the rapidly activating component of the delayed rectifier K+ current (I Kr)"
    explanation: >-
      The measured potassium-current inhibition behind this node. Note the
      concentration is far above the therapeutic range, which is why the node is
      grouped under an EMERGING hypothesis rather than the canonical chain.
  - reference: PMID:28550304
    reference_title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "which were more remarkable than that of Oua and PEA (with maximized inhibition ~15% and ~10%, and estimated IC50s of way above 100 µM)"
    explanation: >-
      Scoped to the claim that this mechanism operates at the digitalis
      cardenolides. In the same experiment the two cardenolides tested inhibited
      the current by about 10 to 15 per cent with IC50s above 100 micromolar, so
      the pump-independent effect is essentially a bufadienolide finding. It does
      not refute the mechanism, which the bufadienolide arm establishes.
  downstream:
  - target: Triggered Automaticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - nka_independent_channel_block
    description: >-
      A second route to ectopy that does not run through calcium loading. The two
      currents pull in opposite directions in the source experiment - calcium-current
      block shortened the action potential at low micromolar concentrations, while
      potassium-current block prolonged it at 100 micromolar - so this edge asserts
      only that the glycoside is proarrhythmic by a pump-independent route, not which
      of the two currents carries it, and not that the resulting triggered activity
      is the same delayed-afterdepolarization mechanism as the canonical chain.
- name: Retinal Sodium-Potassium ATPase Inhibition
  biological_scale: CELLULAR
  description: >-
    Proposed inhibition of the same pump in retinal cells, offered as the
    explanation for the yellow-tinged vision and haloes. Retained as a node because
    the visual signs are real and old; marked as a hypothesis because the human
    retinal-level evidence is not there.
  molecular_functions:
  - preferred_term: P-type sodium:potassium-exchanging transporter activity
    term:
      id: GO:0005391
      label: P-type sodium:potassium-exchanging transporter activity
    modifier: DECREASED
  downstream:
  - target: Disturbed color vision
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extracardiac_pump_inhibition
- name: Central and Gastrointestinal Pump Inhibition
  biological_scale: CELLULAR
  description: >-
    Proposed inhibition of the sodium pump in the gastrointestinal tract and in the
    area postrema, offered as the explanation for the nausea, vomiting and
    confusion. Modelled as a node so that the non-cardiac features are not left
    unexplained in the graph, and grouped under the extracardiac hypothesis because
    the site of action is inferred rather than shown.
  molecular_functions:
  - preferred_term: P-type sodium:potassium-exchanging transporter activity
    term:
      id: GO:0005391
      label: P-type sodium:potassium-exchanging transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34159036
    reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Digoxin toxicity can manifest as a broad spectrum of symptoms such as nausea, vomiting, visual problems, altered mental status, and cardiac arrhythmias"
    explanation: >-
      Documents the non-cardiac features as part of the toxidrome. Graded INDIRECT
      because it establishes that the symptoms occur, not that pump inhibition at
      these sites produces them, which is the part this node leaves hypothetical.
  downstream:
  - target: Nausea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extracardiac_pump_inhibition
  - target: Vomiting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:

    causal_link_type: DIRECT
  - target: Bradycardia
    causal_link_type: DIRECT
- name: Atrioventricular Conduction Block
  biological_scale: TISSUE
  description: >-
    Slowed conduction and lengthened refractoriness at the atrioventricular node.
    Combined with the ectopy above this produces the entry's defining pattern: a

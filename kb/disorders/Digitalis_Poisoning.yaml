    nearest available term, with the intended finding in preferred_term.
- category: Cardiovascular
  name: Supraventricular tachycardia with atrioventricular block
  description: >-
    Paroxysmal atrial tachycardia with block - a fast atrial rate that the
    atrioventricular node does not conduct one-for-one. It is the combination that
    makes it characteristic: ectopy and block together are hard to produce by any
    other mechanism, which is why the classical literature calls it diagnostic.
  phenotype_term:
    preferred_term: paroxysmal atrial tachycardia with atrioventricular block
    term:
      id: HP:0004755
      label: Supraventricular tachycardia
  notes: >-
    Bound to HP:0004755 Supraventricular tachycardia because HPO has no term for
    atrial tachycardia with block. Searched HP for "Atrial tachycardia", which
    returns only HP:0011701 Multifocal atrial tachycardia and HP:0011699 Atrial
    reentry tachycardia, neither of which is this; the block component is carried
    separately by the Atrioventricular block phenotype and in preferred_term here.
  evidence:

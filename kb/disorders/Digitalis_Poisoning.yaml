- category: Cardiovascular
  name: Junctional ectopic tachycardia
  description: >-
    Accelerated junctional rhythm - an ectopic focus at the atrioventricular
    junction outpacing the sinus node.
  phenotype_term:
    preferred_term: accelerated junctional rhythm

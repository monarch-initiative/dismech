    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0800388 is the direct parent of MONDO:0017863 and covers non-digitalis
      cardenolides and the bufadienolides. The relation is recorded as broadMatch
      because that is the ontological relation between the two terms, not because
      the entry's content stops at digitalis - it does not: the environmental block
      and the channel-block node both cover oleander cardenolides and toad
      bufadienolides, so the content sits between the two terms. Per CLAUDE.md a
      broadMatch is a cross-reference and does not retire MONDO:0800388 from the
      curation queue, which is correct here, since a genuine cardiac-glycoside
      entry would still have work to do on the non-digitalis agents.
notes: >-
  The clinical picture is the same whichever glycoside delivers it, so the entry
  is written around the shared mechanism and names digoxin where a source is
  specifically about digoxin. Plant and animal sources are modelled in the
  `environmental:` block rather than as separate entries.

  `just check-genereviews` reports GeneReviews NO_CHAPTER, correct for an acquired
  poisoning with no genetic cause. It also reports StatPearls CITED_UNTAGGED,
  naming PMID:29262029 'Digoxin Toxicity' and PMID:29083729 'Cardiac Glycoside and
  Digoxin Toxicity'. Both chapters exist and neither is cited as evidence: the
  checker matches them through this entry's `digoxin toxicity` synonym, which is
  correct, and counts them as cited because this paragraph names their PMIDs - the
  `references:` block has three entries and neither PMID is among them. StatPearls
  is never a phenotype baseline in this repository, so nothing is missing here.
  This paragraph read UNTAGGED_CHAPTER until review pointed out that the class had
  changed; re-running `just check-genereviews` on this file confirms
  CITED_UNTAGGED.

  Twenty-two further references are committed because the deep-research report
  cites them, and are not cited by this entry. They fall into four groups:
  pharmacogenomic studies of ABCB1 and SLCO1B3 beyond the two already cited here,
  one positive and one negative (PMID:17377214, PMID:26531821, PMID:28208135);
  veterinary and wildlife cardenolide toxicity, which is a different host
  (PMID:31349685, PMID:32722138, PMID:23108514, PMID:40660117); endogenous
  digoxin-like immunoreactive substances as an assay interference, a real gap in
  the `diagnosis:` section rather than a screened-out topic
  (DOI:10.7326/0003-4819-99-5-604, DOI:10.1111/j.1651-2227.1989.tb11093.x,
  DOI:10.1007/BF02343220); and epidemiological, pharmacokinetic and
  mechanism-adjacent material not used for a specific claim (the remainder,
  including DOI:10.1126/sciadv.ady9596 on NCX1 Na-dependent inactivation, which
  would strengthen the exchanger node and was left for a later pass).
  PMID:20587052 is a study protocol with no results, so it cannot support an
  efficacy claim and is not cited as evidence for one. Review asked why
  fructose-1,6-diphosphate was absent; the protocol carries the trial's
  registration number, so the trial is now recorded in `clinical_trials:` against
  ICTRP:ISRCTN71018309, and the absence of a treatment entry for it is explicit
  rather than silent. PMID:28904341 is a
  non-substantive erratum to PMID:28550304 and does not change the quotes taken
  from it.

  The autonomic branch is curated on its parasympathetic limb only. Review asked
  for the sympathetic limb - enhanced central sympathetic outflow and inhibition of
  norepinephrine reuptake, which the deep-research report lists as step 8b - and it
  is deliberately still absent. The two cached sentences that state it are both in
  veterinary oleander papers (PMID:32722138, PMID:31349685), a different host,
  which this entry screens out for exactly that reason, and model-organism evidence
  should not be the sole support for a human mechanism node. A PubMed search for a
  human source ('digoxin sympathetic nerve activity humans', 2026-09-19) returns
  heart-failure pharmacology in which digoxin is sympatho-inhibitory at therapeutic
  concentrations, which is the opposite direction to the toxic-dose claim, so
  binding one of those would assert the wrong sign. The limb stays out until a
  human or experimental source for sympathoexcitation at toxic concentrations is in
  the cache.

  `GO:0055075 potassium ion homeostasis` sits on the ORGANISM-scale Extracellular
  Potassium Shift node, which review flagged as borderline against the
  GO-is-molecular-or-cellular expectation. Left as it is, on a second look: GO's
  only alternative is `GO:0030007 intracellular potassium ion homeostasis`, which
  asserts the wrong compartment for a node about potassium leaving cells, so
  GO:0055075 is the most specific term that is also accurate.
has_subtypes:
- name: Acute
  display_name: Acute poisoning
  description: >-
    A single large ingestion by someone not already taking the drug - usually
    deliberate self-poisoning, or a plant or animal cardenolide exposure.
    Gastrointestinal and cardiac features dominate. Potassium leaves cells faster
    than the kidney can redistribute it, so hyperkalemia and the potassium-based
    prognostic thresholds are features of this presentation rather than of
    digitalis toxicity in general, which is why the hyperkalemia phenotype and the
    serum potassium entries below are scoped to it.
  evidence:
  - reference: PMID:38505194
    reference_title: "Digoxin and Symptomatic Bradyarrhythmia: the 'demon' or a 'red herring'."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In acute toxicity, gastrointestinal symptoms of nausea, anorexia and vomiting, and cardiac manifestations dominates, whereas malaise, weakness and visual disturbances predominate in chronic toxicity."
    explanation: >-
      States the split in presenting features between the two presentations.
      BACKGROUND because the sentence is the case report's framing of established
      clinical teaching rather than an observation it made.
- name: Chronic
  display_name: Chronic toxicity
  description: >-
    Accumulation at an unchanged dose over days to months, when renal clearance
    falls or a P-glycoprotein inhibitor is added. Malaise, weakness and visual
    disturbance predominate over the gastrointestinal and cardiac features of the
    acute form, and the slower onset makes it the harder of the two to recognise.
  evidence:
  - reference: PMID:38505194
    reference_title: "Digoxin and Symptomatic Bradyarrhythmia: the 'demon' or a 'red herring'."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In acute toxicity, gastrointestinal symptoms of nausea, anorexia and vomiting, and cardiac manifestations dominates, whereas malaise, weakness and visual disturbances predominate in chronic toxicity."
    explanation: >-
      The same sentence read from the other side; it is the source for both
      subtype descriptions and is graded identically in each.
  - reference: PMID:39219774
    reference_title: "Stone heart syndrome: A curious case of digoxin toxicity and calcium infusion."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Chronic toxicity is more difficult to diagnose given a more protracted duration of onset: in the span of days to months."
    explanation: >-
      Gives the time course and the diagnostic difficulty that separate this
      subtype from the acute one.
- name: Acute-on-chronic
  display_name: Acute-on-chronic toxicity
  description: >-
    An extra dose, or an abrupt fall in clearance, on top of an existing body
    burden from chronic therapy. It presents much like the acute form but on a
    loaded compartment, and the entry curates it because the two cached cases of
    refractory toxicity after Fab both sit here.
  evidence:
  - reference: PMID:39219774
    reference_title: "Stone heart syndrome: A curious case of digoxin toxicity and calcium infusion."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Acute on chronic digoxin toxicity are similar; however, there are important differences in presentation."
    explanation: >-
      Establishes the third presentation as a recognised category rather than a
      curator's subdivision, while denying that it is simply the acute form.
  - reference: PMID:41399569
    reference_title: "Digoxin Toxicity in Renal Failure: Resolution With Plasma Exchange After Fab Therapy Failure."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a unique case of a 73-year-old woman with acute-on-chronic digoxin toxicity in the setting of acute renal failure who exhibited persistent toxicity symptoms despite Fab therapy."
    explanation: >-
      A worked instance, and the case behind this entry's plasma exchange
      treatment.
mechanistic_hypotheses:
- hypothesis_group_id: nka_calcium_overload_dad
  hypothesis_label: Pump inhibition causes arrhythmia through sodium-driven calcium overload and delayed afterdepolarizations
  status: CANONICAL
  description: >-
    The standard account, and the one the entry's chain follows: inhibition of the
    sodium-potassium pump raises intracellular sodium, which deprives the
    sodium-calcium exchanger of its driving gradient, which loads the
    sarcoplasmic reticulum with calcium, which releases it spontaneously in
    diastole, which the exchanger converts into a depolarizing current. It is
    supported by the fact that the same chain at lower occupancy is the drug's
    therapeutic inotropic mechanism.
- hypothesis_group_id: nka_independent_channel_block
  hypothesis_label: Cardiac glycosides are also directly proarrhythmic through channel block independent of pump inhibition
  status: EMERGING
  description: >-
    Bufadienolides and cardenolides inhibit the L-type calcium current and the
    rapid delayed rectifier potassium current directly. The experiment that shows
    this is properly controlled for the canonical account - cytosolic calcium was
    chelated and the pump was already blocked with ouabain, so neither the
    calcium-overload arm nor pump inhibition can explain the effect. It is graded
    EMERGING rather than ALTERNATIVE because it adds a mechanism rather than
    displacing one, and because the effect was strongest for bufadienolides, which
    are the toad-derived glycosides rather than the pharmaceutical ones.
- hypothesis_group_id: extracardiac_pump_inhibition
  hypothesis_label: The non-cardiac features arise from inhibition of the same pump outside the heart
  status: EMERGING
  description: >-
    Digitalis poisoning is not only a cardiac syndrome: nausea and vomiting,
    confusion, and yellow-tinged vision with haloes are all part of it, and the
    yellow vision is among its oldest recorded signs. The natural explanation is
    inhibition of the same sodium pump in the gut, the area postrema and the
    retina, since the pump is ubiquitous. The entry carries these as a hypothesis
    rather than as chain steps because the site-of-action evidence in humans is
    thin - the deep-research report this entry was built from marks the step
    "inferred" in its own causal chain, and no cached source localises the lesion.
    The symptoms themselves are well documented; what is hypothetical is where the
    drug acts to produce them.
pathophysiology:
- name: Systemic Cardiac Glycoside Excess
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Tissue concentrations of digoxin or another cardiac glycoside above what the
    myocardium tolerates. Reached three ways that behave differently: a single
    large ingestion in someone not already taking the drug, an extra dose on top of
    chronic therapy, and slow accumulation at an unchanged dose when renal
    clearance falls or a P-glycoprotein inhibitor is added. The distinction matters
    clinically, and the mechanism predicts why: a sudden large inhibition
    redistributes potassium faster than the kidney can compensate, which is the
    usual explanation for hyperkalemia being described as an acute-pattern finding.
  chemical_entities:
  - preferred_term: digoxin
    term:
      id: CHEBI:4551
      label: digoxin
    modifier: INCREASED
  evidence:
  - reference: PMID:322907
    reference_title: Clinical pharmacokinetics of digoxin.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main route of elimination is renal excretion of digoxin, which is closely correlated with the glomerular filtration rate."
    explanation: >-
      Establishes renal clearance as the dominant elimination route, which is why
      declining glomerular filtration is the commonest route to chronic accumulation.
  - reference: PMID:322907
    reference_title: Clinical pharmacokinetics of digoxin.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "High concentrations are found in the heart and kidneys, but the skeletal muscles form the largest digoxin storage."
    explanation: >-
      The tissue distribution that makes extracorporeal removal futile: almost none
      of the body burden is in the blood at any moment.
  downstream:
  - target: Sodium-Potassium ATPase Inhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
    description: >-
      The glycoside binds the extracellular face of the pump's alpha subunit at a
      site it shares with potassium, which is why hypokalemia deepens the block.
  - target: Direct Cardiac Ion Channel Block
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_independent_channel_block
    description: >-
      A second, pump-independent action on the L-type calcium and rapid delayed
      rectifier currents.
  - target: Increased Vagal Tone
    causal_link_type: DIRECT
    description: >-
      A separate action of the drug from its effect on the myocyte, and the limb
      responsible for slowing rather than for ectopy.
    evidence:
    - reference: PMID:34159036
      reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Inhibition of this pump causes increased intracellular calcium, resulting in increased myocardial contractility and cardiac output while augmenting cardiac vagal tone"
      explanation: >-
        Attributes the vagal augmentation to the drug, which is the edge this
        asserts. Without it the whole bradycardia and block limb hung off nothing.
  - target: Retinal Sodium-Potassium ATPase Inhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extracardiac_pump_inhibition
    description: >-
      The proposed basis of the visual disturbance, by the same pump in a different
      tissue.
  - target: Central and Gastrointestinal Pump Inhibition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extracardiac_pump_inhibition
    description: >-
      The proposed basis of the gastrointestinal and neurological features.
- name: Sodium-Potassium ATPase Inhibition
  biological_scale: MOLECULAR
  description: >-
    Blockade of the sarcolemmal sodium pump. This is simultaneously the
    therapeutic mechanism and the toxic one - what changes with dose is the
    fraction of pumps occupied, not the kind of effect - which is the structural
    reason digitalis has no margin between efficacy and harm.
  molecular_functions:
  - preferred_term: P-type sodium:potassium-exchanging transporter activity
    term:
      id: GO:0005391
      label: P-type sodium:potassium-exchanging transporter activity
    modifier: DECREASED
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  genes:
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  evidence:
  - reference: PMID:34159036
    reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Digoxin's primary mechanism of action is to inhibit the sodium-potassium ATPase pump in the heart's myocardium."
    explanation: >-
      Names the molecular lesion. Graded BACKGROUND because the sentence is in the
      introduction of a case report, restating established pharmacology rather than
      reporting this paper's own finding.
  downstream:
  - target: Intracellular Sodium Accumulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
  - target: Extracellular Potassium Shift
    causal_link_type: DIRECT
    description: >-
      Potassium the pump would have returned to the cell stays outside, in every
      tissue rather than only the heart.
- name: Intracellular Sodium Accumulation
  biological_scale: CELLULAR
  description: >-
    Rising cytosolic sodium in the cardiomyocyte, the immediate consequence of a
    pump that is no longer extruding it.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:28550304
    reference_title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "In cardiac myocytes, NKA inhibition causes an accumulation of cytosolic Na+ which in turn activates the reverse-mode of Na+/Ca2+-exchanger."
    explanation: >-
      States the pump-to-sodium-to-exchanger step in one sentence. Graded BACKGROUND
      because it is this paper's framing of established mechanism, not its own
      result - its own result is the pump-independent one cited elsewhere in this entry.
  downstream:
  - target: Reduced Sodium-Calcium Exchanger Calcium Extrusion
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
    description: >-
      The exchanger runs on the inward sodium gradient; collapsing the gradient
      removes the energy source for calcium export.
    evidence:
    - reference: PMID:28550304
      reference_title: Identification of Na+/K+-ATPase inhibition-independent proarrhythmic ionic mechanisms of cardiac glycosides.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "In cardiac myocytes, NKA inhibition causes an accumulation of cytosolic Na+ which in turn activates the reverse-mode of Na+/Ca2+-exchanger."
      explanation: Covers this edge specifically - rising cytosolic sodium acting on the exchanger.
- name: Reduced Sodium-Calcium Exchanger Calcium Extrusion
  biological_scale: CELLULAR
  description: >-
    Loss of calcium export through NCX1, the exchanger that normally trades three
    sodium ions inward for one calcium ion outward. Nothing is wrong with the
    exchanger; its driving gradient has been spent.
  molecular_functions:
  - preferred_term: calcium:sodium antiporter activity involved in regulation of cardiac muscle cell membrane potential
    term:
      id: GO:0086038
      label: calcium:sodium antiporter activity involved in regulation of cardiac muscle cell membrane potential
    modifier: DECREASED
  genes:
  - preferred_term: SLC8A1
    term:
      id: hgnc:11068
      label: SLC8A1
  downstream:
  - target: Sarcoplasmic Reticulum Calcium Overload
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
- name: Sarcoplasmic Reticulum Calcium Overload
  biological_scale: CELLULAR
  description: >-
    Calcium accumulating in the cytosol and, through SERCA, in the sarcoplasmic
    reticulum. At therapeutic occupancy this is the positive inotropic effect; past
    a threshold the store holds more than it can retain.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  genes:
  - preferred_term: ATP2A2
    term:
      id: hgnc:812
      label: ATP2A2
  evidence:
  - reference: PMID:34159036
    reference_title: 'A Visual Resolution of Cardiotoxicity: A Case Report of Digoxin-Induced Bidirectional Ventricular Tachycardia.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Inhibition of this pump causes increased intracellular calcium, resulting in increased myocardial contractility and cardiac output while augmenting cardiac vagal tone"
    explanation: >-
      Links pump inhibition to the calcium rise, and in the same sentence to the
      vagal limb, which is why it is cited on both nodes. BACKGROUND for the same
      reason as the pump node.
  downstream:
  - target: Spontaneous Diastolic Calcium Release
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
- name: Spontaneous Diastolic Calcium Release
  biological_scale: CELLULAR
  description: >-
    Unscheduled release of stored calcium through the ryanodine receptor after
    repolarization is complete - calcium arriving when the cell should be
    electrically quiet.
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: INCREASED
  genes:
  - preferred_term: RYR2
    term:
      id: hgnc:10484
      label: RYR2
  downstream:
  - target: Delayed Afterdepolarization
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
    description: >-
      The exchanger extrudes the released calcium electrogenically, three sodium in
      for one calcium out, which is a net inward current during phase 4.
- name: Delayed Afterdepolarization
  biological_scale: CELLULAR
  description: >-
    A depolarizing hump after repolarization. Below threshold it is invisible;
    above it, the cell fires a beat nobody asked for.
  cell_types:
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
  biological_processes:
  - preferred_term: cardiac muscle cell action potential
    term:
      id: GO:0086001
      label: cardiac muscle cell action potential
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:1257581
    reference_title: On the mechanisms underlying digitalis toxicity in cardiac Purkinje fibers.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In quiescent fibers, strophanthidin caused the membrane potential to depolarize and to develop oscillations of progressively larger magnitude which were followed by spontaneous activity."
    explanation: >-
      The classical microelectrode experiment behind this node: a cardiac glycoside
      produces growing diastolic oscillations that end in spontaneous firing, in
      canine Purkinje fibres. The glycoside here is strophanthidin, not digoxin.
  downstream:
  - target: Triggered Automaticity
    causal_link_type: DIRECT
    hypothesis_groups:
    - nka_calcium_overload_dad
- name: Triggered Automaticity
  biological_scale: TISSUE
  description: >-
    Ectopic beats arising from afterdepolarizations rather than from the sinus
    node. Named without a chamber because the foci are not confined to the
    ventricle: the same mechanism in the atrioventricular junction produces the
    accelerated junctional rhythm this entry also records, and the bound cell type
    CL:0002068 Purkinje myocyte spans the conduction system. When two foci with alternating exit pathways through the fascicles take
    turns, the result is bidirectional ventricular tachycardia. That pattern is a
    recognised presentation of this poisoning but is not specific to it; the
    phenotype entry of the same name records the differential and cites it.
  cell_types:
  - preferred_term: Purkinje myocyte
    term:
      id: CL:0002068
      label: Purkinje myocyte
  evidence:
  - reference: PMID:1257581
    reference_title: On the mechanisms underlying digitalis toxicity in cardiac Purkinje fibers.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In quiescent fibers, strophanthidin caused the membrane potential to depolarize and to develop oscillations of progressively larger magnitude which were followed by spontaneous activity."
    explanation: >-
      The classical microelectrode experiment behind this node: a cardiac glycoside
      produces growing diastolic oscillations that end in spontaneous firing, in
      canine Purkinje fibres. The glycoside here is strophanthidin, not digoxin.
  downstream:
  - target: Bidirectional ventricular tachycardia
    causal_link_type: DIRECT
  - target: Premature ventricular contraction
    causal_link_type: DIRECT
  - target: Junctional ectopic tachycardia
    causal_link_type: DIRECT
  - target: Supraventricular tachycardia with atrioventricular block
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The atrial ectopy half of the pattern.
  - target: Hemodynamic Collapse
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Increased Vagal Tone
  biological_scale: ORGANISM
  description: >-
    Enhanced parasympathetic outflow to the sinus and atrioventricular nodes, a
    separate action of the drug from its effect on the myocyte, and the half of the
    toxidrome responsible for slowing rather than for ectopy.
  downstream:

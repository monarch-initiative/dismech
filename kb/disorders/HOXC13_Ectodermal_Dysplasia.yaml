inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported ECTD9 families segregate biallelic HOXC13 variants, most often
    homozygous alleles in consanguineous kindreds. Heterozygous carriers are
    clinically unaffected.
  evidence:
  - reference: PMID:23063621
    reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, our results demonstrate that loss-of-function mutations in
      HOXC13 cause autosomal-recessive PHNED and further highlight the
      importance of HOXC13 in hair and nail development.
    explanation: >-
      The discovery paper's conclusion establishes autosomal recessive
      inheritance for HOXC13-related PHNED.
  - reference: PMID:28297138
    reference_title: "A Novel Homozygous Missense Mutation in HOXC13 Leads to Autosomal Recessive Pure Hair and Nail Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a homozygous novel missense mutation in the HOXC13 gene that
      resulted in autosomal recessive PHNED in a Hispanic child.
    explanation: >-
      Independent confirmation of autosomal recessive inheritance in a North
      American family, showing the mode is not an artifact of the consanguineous
      pedigrees through which the gene was discovered.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report a case of HOXC13-related PHNED with a rare homozygous
        variant, c.931C>T, p.Arg311Trp.
      explanation: >-
        Identifies the variant and its homozygous state in the affected
        individual.
    - reference: PMID:40225922
      reference_title: "Homozygous HOXC13 Variant Causes Pure Hair and Nail Ectodermal Dysplasia via Reduction in Protein Stability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        in vitro overexpression assays revealed that the p.Arg311Trp variant
        decreases HOXC13 protein stability
      explanation: >-
        Functional assay establishing reduced protein stability as this allele's
        mechanism, distinct from impaired DNA binding.
  evidence:
  - reference: PMID:23063621
    reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal-recessive PHNED has previously been mapped to chromosomal region
      12q12-q14.1, which contains the type II hair keratin and HOXC clusters.
    explanation: >-
      Explains why HOXC13 and the type II hair keratin genes (KRT85, KRT74) are
      all PHNED candidates: they share the same 12q linkage interval. This is
      also why ECTD4, ECTD7, and ECTD9 are readily confused in the literature.
  notes: >-
    HOXC13-related PHNED is exceptionally rare. The 2024 report describing
    p.Arg311Trp identifies its family as the ninth reported worldwide; that
    count appears in the paper's introduction rather than its abstract, so it is
    recorded as a note rather than a quoted evidence snippet. Two further
    published families (PMID:23461661, Ali et al. 2013; PMID:29278420,
    Humbatova et al. 2018) are not cited with evidence blocks here because both
    cache as Letters with no retrievable abstract text. PMID:41714886 (Sharma &
    Vinay 2026, "Pure Hair-Nail Ectodermal Dysplasia: Expanding the HOXC13
    Genotypic Spectrum") is cached by this entry's research pass for the same
    reason and likewise carries no quotable content - it caches with
    `content_type: unavailable` and an empty body - so it too is recorded here
    rather than cited. It is listed explicitly so a later curator does not read
    its presence in `references_cache/` as an uncited oversight.
pathophysiology:
- name: HOXC13 Transcription Factor Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic HOXC13 variants deplete the functional pool of HOXC13 protein in
    hair follicle and nail matrix nuclei. Three demonstrated routes converge
    here in human disease: truncating and whole-exon deletion alleles that
    trigger nonsense-mediated decay or yield a cytoplasmically mislocalized
    protein; homeodomain missense alleles that impair sequence-specific DNA
    binding; and at least one homeodomain missense allele that destabilizes the
    folded protein. The shared endpoint is reduced nuclear HOXC13 activity.

    A fourth route exists in the mouse but does not belong to this node. The
    Naked (N) allele is a terminal truncation whose transcript escapes
    nonsense-mediated decay, leaving a persistent truncated protein that is
    pathogenic in heterozygotes - a dominant-negative mechanism rather than a
    depletion of functional protein. No such allele has been reported in
    humans, and every human ECTD9 pedigree is recessive. The mouse allele is
    curated under `animal_models` and its divergence is one of the questions in
    the `hoxc13_model_fidelity_disagreement` discussion; it is deliberately not
    folded into this loss-of-function node, which would misdescribe it.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23063621
    reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We examined HOXC13 expression in scalp specimen obtained from the index
      individual of the Chinese family and detected dramatically reduced mRNA
      levels in skin tissue and nearly absent protein staining in hair
      follicles, suggesting a mechanism of nonsense-mediated mRNA decay.
    explanation: >-
      Direct patient-tissue demonstration that a truncating allele depletes
      HOXC13 transcript and protein in the affected appendage.
  - reference: PMID:23315978
    reference_title: "A homozygous frameshift mutation in the HOXC13 gene underlies pure hair and nail ectodermal dysplasia in a Syrian family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression studies in cultured cells revealed that the mutant HOXC13
      protein mislocalized within the cytoplasm, and failed to upregulate the
      promoter activities of its target genes.
    explanation: >-
      Functional demonstration that a truncating allele both mislocalizes the
      protein and abolishes transactivation.
  - reference: PMID:40225922
    reference_title: "Homozygous HOXC13 Variant Causes Pure Hair and Nail Ectodermal Dysplasia via Reduction in Protein Stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously reported biallelic HOXC13 pathogenic variants led to PHNED by
      either disrupting protein expression through nonsense-mediated decay or
      altering the DNA-binding affinity of the homeobox domain of HOXC13.
    explanation: >-
      Summarizes the two previously established molecular routes to HOXC13 loss
      of function that this node aggregates.
  downstream:
  - target: Reduced Transactivation of Hair and Nail Differentiation Genes
    causal_link_type: DIRECT
- name: Reduced Transactivation of Hair and Nail Differentiation Genes
  biological_scale: MOLECULAR
  description: >-
    HOXC13 drives the terminal differentiation program of hair- and nail-forming
    keratinocytes, including hair keratin genes. Reported HOXC13 target genes
    whose expression falls when HOXC13 is lost include KRT35, KRT85, and FOXN1.
    Loss of this transcriptional output deprives differentiating keratinocytes
    of the structural proteins needed to build a normal hair shaft or nail
    plate. Notably, KRT85 is itself the gene mutated in ECTD4, so the HOXC13 and
    keratin forms of PHNED are linked as regulator and target within one pathway
    rather than being merely phenocopies.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: DECREASED
  cell_types:
  - preferred_term: Hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  evidence:
  - reference: PMID:23063621
    reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also observed markedly decreased expression of four HOXC13 target genes
      in the specimen.
    explanation: >-
      Patient scalp tissue shows reduced target-gene expression, the defining
      step of this node, in vivo rather than only in reporter assays.
  - reference: PMID:23315978
    reference_title: "A homozygous frameshift mutation in the HOXC13 gene underlies pure hair and nail ectodermal dysplasia in a Syrian family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      failed to upregulate the promoter activities of its target genes
    explanation: >-
      Promoter-reporter assays confirm that mutant HOXC13 cannot transactivate
      its downstream targets.
  - reference: PMID:28011715
    reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hoxc13 was not expressed in pigs with all three mutation types, and the
      expression levels of Hoxc13-regulated genes, namely, Foxn1, Krt85 and
      Krt35, were decreased.
    explanation: >-
      Names the specific downstream targets (FOXN1, KRT85, KRT35) whose
      expression falls on HOXC13 loss, in a large-animal model whose skin
      phenotype closely matches the human disease.
  downstream:
  - target: Impaired Hair Follicle Differentiation
    causal_link_type: DIRECT
  - target: Impaired Nail Matrix Differentiation
    causal_link_type: DIRECT
- name: Impaired Hair Follicle Differentiation
  biological_scale: CELLULAR
  description: >-
    Without the HOXC13-dependent structural gene program, hair follicle
    keratinocytes fail to assemble a normal cortex and cuticle. Affected scalp
    skin shows reduced follicle numbers and disorganized hair shafts lacking
    normal layered architecture, producing hair that is sparse, fragile, or
    entirely absent from birth.
  cell_types:
  - preferred_term: Hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28011715
    reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The hair follicles displayed various abnormal phenotypes, such as reduced
      number of follicles and disarrayed hair follicle cable without normal hair
      all over the body.
    explanation: >-
      Direct histological characterization of the follicular defect caused by
      Hoxc13 loss, in the animal model that best matches the human phenotype.
  - reference: PMID:28297138
    reference_title: "A Novel Homozygous Missense Mutation in HOXC13 Leads to Autosomal Recessive Pure Hair and Nail Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings illustrate the critical role of HOXC13 in human hair and nail
      development.
    explanation: >-
      Supports HOXC13-dependence of human hair follicle development, the
      substrate of this node.
  notes: >-
    Scalp histology from an affected individual shows a reduced number of hair
    follicles with disorganized hair shafts lacking the normal layered
    structure. That description appears in the introduction of PMID:40225922
    rather than in any cached abstract, so it is recorded here as a note rather
    than as a quoted snippet.
  downstream:
  - target: Hypotrichosis and Alopecia
    causal_link_type: DIRECT
  - target: Abnormal Hair Shaft Morphology
    causal_link_type: DIRECT
- name: Impaired Nail Matrix Differentiation
  biological_scale: CELLULAR
  description: >-
    HOXC13 is also required in nail-forming epithelium, where the same
    target-gene program supplies the keratins of the nail plate. Loss of HOXC13
    activity yields a structurally defective nail plate, clinically evident as
    nail dystrophy typically involving all twenty nails. Mouse genetics places
    this requirement at the level of the whole HoxC cluster: deleting the
    cluster in the limb ectoderm abolishes nails entirely.
  cell_types:
  - preferred_term: Nail matrix keratinocyte
    term:
      id: CL:4052064
      label: nail matrix keratinocyte
  biological_processes:
  - preferred_term: keratinization
    term:
      id: GO:0031424
      label: keratinization
    modifier: DECREASED
  evidence:
  - reference: PMID:28403827
    reference_title: "A novel mutation in homeobox DNA binding domain of HOXC13 gene underlies pure hair and nail ectodermal dysplasia (ECTD9) in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected members exhibited PHNED phenotypes with involvement of complete
      hair loss and nail dysplasia.
    explanation: >-
      Documents nail dysplasia alongside hair loss as the paired consequence of
      HOXC13 loss of function.
  - reference: PMID:33199643
    reference_title: "Mammalian-specific ectodermal enhancers control the expression of Hoxc genes in developing nails and hair follicles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      deletion of the HoxC cluster led to mice lacking nails (anonychia), a
      condition stronger than the previously reported loss of function of
      Hoxc13, which is the causative gene of the ectodermal dysplasia 9 (ECTD9)
      in human patients
    explanation: >-
      Establishes HoxC-cluster dependence of nail formation and positions Hoxc13
      loss as a partial version of that requirement, consistent with nail
      dystrophy rather than anonychia in ECTD9 patients.
  downstream:
  - target: Nail Dystrophy
    causal_link_type: DIRECT

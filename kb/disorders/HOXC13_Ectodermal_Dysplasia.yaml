    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure hair and nail ectodermal dysplasia (PHNED) is a rare disorder that
      presents with hypotrichosis and nail dystrophy while sparing other
      ectodermal structures such as teeth and sweat glands.
    explanation: >-
      Explicitly states that sweat glands are spared in PHNED, the claim this
      excluded phenotype records.
  notes: >-
    Curated with `frequency: EXCLUDED` plus `modifier: ABSENT`, following the
    convention used in Osteogenesis_Imperfecta_Type_V and
    Epilepsy_with_Generalized_Tonic-Clonic_Seizures_Alone. `frequency: EXCLUDED`
    is what the HPOA exporter reads to emit a NOT-qualified row; `modifier:
    ABSENT` documents intent.
- category: Dental
  name: Hypodontia Absent
  frequency: EXCLUDED
  diagnostic: true
  description: >-
    The second defining exclusion. Dentition is normal in pure hair and nail
    ectodermal dysplasia. Tooth agenesis, conical teeth, and oligodontia belong
    to the hypohidrotic and TP63-related ectodermal dysplasias, and their
    presence should prompt reconsideration of the ECTD9 diagnosis.
  phenotype_term:
    preferred_term: Hypodontia
    term:
      id: HP:0000668
      label: Hypodontia
    modifier: ABSENT
  evidence:
  - reference: PMID:28297138
    reference_title: "A Novel Homozygous Missense Mutation in HOXC13 Leads to Autosomal Recessive Pure Hair and Nail Ectodermal Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure hair and nail ectodermal dysplasia (PHNED) is a rare disorder that
      presents with hypotrichosis and nail dystrophy while sparing other
      ectodermal structures such as teeth and sweat glands.
    explanation: >-
      Explicitly states that teeth are spared in PHNED, the claim this excluded
      phenotype records.
- category: Skeletal
  name: Skeletal Involvement Absent
  frequency: EXCLUDED
  diagnostic: true
  description: >-
    A third exclusion, and the one that separates the human disease from its
    founding animal model. Hoxc13-null mice develop skeletal defects,
    progressive weight loss, and low viability; reported human ECTD9 patients
    have none of these. This exclusion is therefore also the anchor of the
    human/model mismatch discussion recorded on this entry.

    Term-scope caveat: the bound term HP:0009121 is *Abnormal axial skeleton
    morphology*, which is narrower than the node name. The absence being
    asserted covers the skeleton generally - the murine phenotype is vertebral,
    so the axial term is the closest available match to the specific finding
    that is missing in humans, but it does not by itself exclude appendicular
    involvement. HP:0009121 was chosen over a broader skeletal term because it
    names what the mouse literature actually reports; read the exclusion as
    scoped to that.
  phenotype_term:
    preferred_term: Abnormal axial skeleton morphology
    term:
      id: HP:0009121
      label: Abnormal axial skeleton morphology
    modifier: ABSENT
  evidence:
  - reference: PMID:28011715
    reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ectodermal dysplasia-9 (ED-9) is a congenital condition characterized by
      hypotrichosis and nail dystrophy without other disorders, and Hoxc13 is a
      pathogenic gene for ED-9.
    explanation: >-
      States that ED-9 is hypotrichosis and nail dystrophy "without other
      disorders", which is the assertion that skeletal and systemic involvement
      is absent in the human disease. Evidence source is MODEL_ORGANISM because
      the citing paper reports an animal model, although this particular
      sentence describes the human condition being modeled.
diagnosis:
- name: Molecular Genetic Testing with Exon-Level Copy-Number Analysis
  description: >-
    Suspect ECTD9 when congenital generalized hypotrichosis or alopecia
    co-occurs with dystrophy or hypoplasia of most or all twenty nails while
    teeth and sweating are normal. Confirmation is molecular: a hereditary
    hypotrichosis / ectodermal-dysplasia panel containing HOXC13, KRT74, and
    KRT85, or targeted HOXC13 sequencing when the phenotype is highly specific,
    followed by trio or family-based exome/genome sequencing if the panel is
    negative.

    The step that changes management is copy-number analysis. A 27.6 kb
    homozygous deletion removing HOXC13 exon 1 is an established cause of this
    disease, and a sequence-only assay will not see it. Any panel or exome used
    to exclude ECTD9 must therefore include exon-level CNV calling; a negative
    sequencing-only result is not a negative test. Chromosomal microarray is a
    poor substitute at this scale unless probe coverage over HOXC13 happens to
    be adequate.
  evidence:
  - reference: PMID:23063621
    reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an additional affected female from a consanguineous Afghan family, we
      found a 27.6 kb homozygous microdeletion involving the first exon of
      HOXC13.
    explanation: >-
      Establishes that a whole-exon deletion is a real ECTD9 mechanism, which is
      what makes exon-level copy-number analysis necessary rather than optional.
  notes: >-
    No diagnostic blood chemistry, circulating protein, metabolite, imaging
    study, electrophysiologic test, or enzyme assay is established. Hair
    microscopy and skin biopsy may show abnormal follicular differentiation but
    are not specific enough to replace molecular testing. Karyotyping, FISH,
    mitochondrial sequencing, and repeat-expansion testing are not indicated by
    the known mechanism. There is no population or newborn screening programme;
    cascade carrier testing, prenatal diagnosis, and preimplantation genetic
    testing become available once the familial biallelic variants are known.
differential_diagnoses:
- name: KRT74- and KRT85-related PHNED
  description: >-
    The two sibling PHNED forms present identically and are separated only by
    the causal gene - which is why the recommended first-line test is a panel
    covering all three rather than single-gene HOXC13 sequencing. All three are
    collected in the `Pure_Hair_and_Nail_Ectodermal_Dysplasias` grouping.
- name: Hypohidrotic and hidrotic ectodermal dysplasias
  description: >-
    Normal teeth and sweating are the discriminator. Hypohidrosis with
    hypodontia or conical teeth points to the EDA/EDAR/EDARADD forms, curated as
    the `Hypohidrotic_Ectodermal_Dysplasias` grouping, not to ECTD9. This is the
    positive diagnostic use of the two EXCLUDED phenotypes curated above.
- name: Isolated nail disorders, including RSPO4-related anonychia
  description: >-
    Nail-only presentations without the congenital generalized hair involvement
    fall outside ECTD9; hair and nail involvement together is required.
- name: Other hereditary hypotrichoses and acquired alopecias
  description: >-
    Congenital onset, generalized hair involvement including eyebrows and
    eyelashes, accompanying nail dystrophy, and biallelic HOXC13 findings favour
    ECTD9 over an acquired alopecia or a hair-only hereditary hypotrichosis.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    HOXC13-related PHNED is ultra-rare and known only from individual families
    of multiple ancestries (Chinese, Afghan, Syrian, Pakistani, Hispanic North
    American, UK). As of the 2024 report of the p.Arg311Trp allele, nine
    families had been described worldwide; that count appears in the paper's
    introduction rather than its abstract. The umbrella Orphanet entry for pure
    hair and nail ectodermal dysplasia (ORPHA:69084, the source of
    MONDO:0019071's definition) records fewer than 20 reported cases across all
    molecular forms. No population-based registry or denominator-based study
    exists, so no rate is asserted here.
treatments:
- name: Symptomatic and Supportive Management
  description: >-
    No disease-modifying therapy exists. Management is supportive: gentle hair
    care avoiding traction and harsh chemical or heat treatment, protective care
    of dystrophic and fragile nails, and cosmetic measures such as wigs or
    hairpieces. Because sweating and dentition are normal, the thermoregulatory
    precautions and extensive dental rehabilitation required in hypohidrotic
    ectodermal dysplasia are not needed - a direct management consequence of the
    excluded phenotypes recorded above.
  treatment_term:
    preferred_term: Symptomatic Therapy
    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
  therapeutic_modality: OTHER
- name: Genetic Counseling
  description: >-
    Counseling for autosomal recessive inheritance with a 25% sibling recurrence
    risk, carrier testing for at-risk relatives, and prenatal or preimplantation
    diagnosis where the familial biallelic HOXC13 variants are known.
    Consanguinity is common in reported pedigrees and is directly relevant to
    recurrence-risk discussion.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
animal_models:
- name: Hoxc13 knockout pig
  species: Pig
  genotype: Hoxc13 biallelic knockout (c.396C>A homozygous and related alleles)
  publication: PMID:28011715
  description: >-
    CRISPR/Cas9 and somatic-cell nuclear transfer were used to generate cloned
    piglets carrying three classes of biallelic Hoxc13 mutation. The animals
    lose Hoxc13 expression, downregulate the Foxn1/Krt85/Krt35 target program,
    and show abnormal hair follicles with no normal hair, while skin structure,
    skeleton, weight gain, and growth remain normal. That combination is what
    makes the pig a closer match to human ECTD9 than the mouse.
  modeled_mechanisms:
  - target: Reduced Transactivation of Hair and Nail Differentiation Genes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Loss of Hoxc13 expression with measured downregulation of the FOXN1,
      KRT85, and KRT35 target genes, directly reproducing the transcriptional
      step of the human mechanism.
    limitations: >-
      Target-gene readout is bulk expression in pig skin, not human follicular
      tissue, and the alleles are engineered nulls rather than the homeodomain
      missense alleles that predominate in human patients.
    readouts:
    - name: Foxn1, Krt85 and Krt35 expression in skin
      target: Reduced Transactivation of Hair and Nail Differentiation Genes
      direction: DECREASED
      interpretation: >-
        Confirms that the HOXC13 target-gene program is the transcriptional
        output lost in this disease.
      evidence:
      - reference: PMID:28011715
        reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Hoxc13 was not expressed in pigs with all three mutation types, and
          the expression levels of Hoxc13-regulated genes, namely, Foxn1, Krt85
          and Krt35, were decreased.
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:28011715
      reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The phenotypes of Hoxc13 mutation in pigs were similar to those in ED-9
        patients.
      explanation: >-
        Supports treating this model as informative for the human mechanism.
  - target: Impaired Hair Follicle Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reduced follicle number and disarrayed hair follicle architecture with no
      normal hair anywhere on the body, matching the human follicular defect.
    limitations: >-
      Pig hair-follicle density and cycling differ from human scalp, so severity
      is not directly transferable. A later study of Hoxc13-null rabbits argues
      that neither mice nor pigs faithfully recapitulate human hypotrichosis;
      see the HUMAN_MODEL_MISMATCH discussion on this entry.
    readouts:
    - name: Hair follicle number and architecture
      target: Impaired Hair Follicle Differentiation
      direction: DECREASED
      interpretation: Structural correlate of the follicular differentiation node.
      evidence:
      - reference: PMID:28011715
        reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The hair follicles displayed various abnormal phenotypes, such as
          reduced number of follicles and disarrayed hair follicle cable without
          normal hair all over the body.
        explanation: Reports the histological measurement behind this readout.
- name: Hoxc13-null mouse
  species: Mouse
  genotype: Hoxc13 homozygous null
  publication: PMID:23063621
  description: >-
    The founding animal model, whose hair and nail defects motivated HOXC13 as a
    PHNED candidate gene within the 12q linkage interval. It also produces
    skeletal defects, progressive weight loss, and low viability that are not
    part of the human phenotype.
  modeled_mechanisms:
  - target: Impaired Hair Follicle Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hoxc13-null mice develop hair and nail defects closely resembling human
      PHNED, which is what identified HOXC13 as the candidate gene.
    limitations: >-
      The null mouse additionally shows skeletal defects, progressive weight
      loss, and low viability, none reported in human ECTD9 patients, so the
      model over-represents the systemic consequences of HOXC13 loss. Human
      disease is also caused chiefly by homeodomain missense alleles rather than
      by a complete null.
    evidence:
    - reference: PMID:23063621
      reference_title: "Loss-of-function mutations in HOXC13 cause pure hair and nail ectodermal dysplasia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hoxc13-null mice are known to develop hair and nail defects very similar
        to those seen in human PHNED.
      explanation: >-
        Supports treating the null mouse as informative for the human appendage
        phenotype.
    - reference: PMID:28011715
      reference_title: "Generation of Hoxc13 knockout pigs recapitulates human ectodermal dysplasia-9."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, mice carrying Hoxc13 mutation present several other serious
        disorders, such as skeletal defects, progressive weight loss and low
        viability. Mouse models cannot faithfully mimic human ED-9.
      explanation: >-
        States the limitation directly: the mouse carries extra phenotypes not
        seen in patients. Marked PARTIAL because it qualifies rather than
        supports the model's fidelity.
- name: Hoxc13-null rabbit
  species: Rabbit
  genotype: Hoxc13-/-
  publication: PMID:30125135
  description: >-
    Hoxc13-ablated rabbits show complete hair loss on head and dorsum with
    hypotrichosis of limbs and tail, and - the model's distinctive contribution
    - a shifted balance between hair follicles and sebaceous glands, with
    reduced follicles but enlarged and more numerous sebaceous glands.
  modeled_mechanisms:
  - target: Impaired Hair Follicle Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces regional hypotrichosis and proposes a specific cellular
      mechanism for it: a disrupted hair-follicle/sebaceous-gland balance.
    limitations: >-
      The sebaceous-gland expansion has not been demonstrated in human ECTD9
      skin, so the proposed mechanism for hypotrichosis remains model-derived.
      The authors' claim that mice and pigs do not faithfully recapitulate
      hypotrichosis conflicts with the pig paper's own conclusion; see the
      HUMAN_MODEL_MISMATCH discussion.
    readouts:
    - name: Hair follicle and sebaceous gland number
      target: Impaired Hair Follicle Differentiation
      direction: ALTERED
      interpretation: >-
        Reduced hair follicles with enlarged and increased sebaceous glands,
        proposed as the cellular basis of Hoxc13-related hypotrichosis.
      evidence:
      - reference: PMID:30125135
        reference_title: "The disrupted balance between hair follicles and sebaceous glands in Hoxc13-ablated rabbits."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In addition, reduced hair follicles (HFs) while the enlarged and
          increased number of sebaceous glands (SGs) were also found in the
          Hoxc13-/- rabbits
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:30125135
      reference_title: "The disrupted balance between hair follicles and sebaceous glands in Hoxc13-ablated rabbits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        our findings demonstrate that Hoxc13-/- rabbits can be used as a model
        for human ECTD-9, especially to understand the pathologic mechanism of
        hypotrichosis
      explanation: >-
        Supports treating the rabbit as informative for the human hypotrichosis
        mechanism.
- name: Naked (N) mouse (Hoxc13 terminal truncation)
  species: Mouse
  genotype: Hoxc13 Naked (N) terminal truncation, N/N and N/+
  publication: DOI:10.1111/exd.14469
  description: >-
    A spontaneous mouse mutation characterized as a terminal truncation of
    Hoxc13 and independently recreated by CRISPR/Cas9. It is the mechanistic
    outlier among the Hoxc13 animal models: the truncated transcript escapes
    nonsense-mediated decay, the truncated protein is present in follicles, and
    heterozygotes are affected - a semi-dominant, apparently dominant-negative
    behaviour unlike the recessive human pattern and unlike the heterozygous
    Hoxc13 knockout, which is unaffected.
  modeled_mechanisms:
  - target: HOXC13 Transcription Factor Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      N/N homozygotes reproduce the cardinal ECTD9 appendage phenotype
      (generalized alopecia with abnormal nails), and the allele is a better
      practical model than the poorly viable Hoxc13 knockout.
    limitations: >-
      The mechanism is not the human one. Human ECTD9 alleles act by
      nonsense-mediated decay, impaired DNA binding, or reduced protein
      stability, all recessive; the Naked allele instead escapes NMD and yields
      a persistent truncated protein that is pathogenic in heterozygotes. It
      therefore models the phenotype without modeling the loss-of-function
      route, and no dominant-negative HOXC13 allele has been reported in humans.
      N/N mice also have a short lifespan, which human patients do not.
    readouts:
    - name: Coat and nail phenotype in homozygotes
      target: HOXC13 Transcription Factor Loss of Function
      direction: ALTERED
      interpretation: >-
        Homozygous phenotype matching the human appendage presentation.
      evidence:
      - reference: DOI:10.1111/exd.14469
        reference_title: "Naked (N) mutant mice carry a nonsense mutation in the homeobox of Hoxc13"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          homozygous N/N mice exhibit generalized alopecia with abnormal nails
          and a short lifespan
        explanation: >-
          Reports the homozygous coat and nail phenotype together with the
          reduced lifespan that human patients do not share.
    - name: Heterozygote phenotype and truncated protein persistence
      target: HOXC13 Transcription Factor Loss of Function
      direction: ALTERED
      interpretation: >-
        Heterozygous involvement plus retained truncated protein is the
        signature of a dominant-negative allele rather than haploinsufficiency.
      evidence:
      - reference: DOI:10.1111/exd.14469
        reference_title: "Naked (N) mutant mice carry a nonsense mutation in the homeobox of Hoxc13"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          N/+ mice show generalized or partial alopecia, associated with loss of
          hair fibres, along with normal lifespan and fertility
        explanation: >-
          Establishes that heterozygotes are affected, in contrast to
          heterozygous Hoxc13 knockout mice and to human ECTD9 carriers.
      - reference: DOI:10.1111/exd.14469
        reference_title: "Naked (N) mutant mice carry a nonsense mutation in the homeobox of Hoxc13"
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the presence of the truncated mutant protein in N/N and N/+ hair
          follicles
        explanation: >-
          Demonstrates that the truncated product persists rather than being
          cleared, the basis of the dominant-negative interpretation.
  evidence:
  - reference: DOI:10.1111/exd.14469
    reference_title: "Naked (N) mutant mice carry a nonsense mutation in the homeobox of Hoxc13"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Considering the low viability of the Hoxc13 KO mice, the Naked mutation
      provides an attractive new model for studying ECTD9 disease mechanisms.
    explanation: >-
      The authors propose the allele as an ECTD9 model, which is the claim this
      link records; the limitations field carries the mechanistic caveat.
discussions:
- discussion_id: hoxc13_model_fidelity_disagreement
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which Hoxc13-null animal model, if any, faithfully represents human ECTD9,
    and does the mouse's skeletal phenotype mean HOXC13 loss has consequences in
    humans that dermatology-ascertained pedigrees have never looked for?
  attaches_to:
  - pathophysiology#HOXC13 Transcription Factor Loss of Function
  - pathophysiology#Impaired Hair Follicle Differentiation
  rationale: >-
    Three species carry Hoxc13 nulls and the literature does not agree on which
    one models the human disease. The mouse reproduces hair and nail defects but
    adds skeletal defects, progressive weight loss, and low viability that no
    human patient shows, and the pig paper concludes flatly that mouse models
    cannot faithfully mimic human ED-9. That same paper reports its own
    knockouts matching ED-9 patients with a normal skeleton and normal growth.
    The later rabbit paper contradicts it, asserting that Hoxc13-mutated mice
    and pigs do not faithfully recapitulate hypotrichosis, and proposing a
    hair-follicle/sebaceous-gland imbalance - never shown in human skin - as the
    real mechanism. Two questions remain open. First, which model to trust for
    mechanistic inference about human hypotrichosis. Second, whether the absence
    of human skeletal involvement is real or an ascertainment artifact: human
    ECTD9 is caused chiefly by homeodomain missense alleles that reduce DNA
    binding or protein stability rather than by complete nulls, so allele
    hypomorphism is a plausible explanation that has never been tested against
    systematic imaging.

    A third question comes from the fourth model, the Naked (N) mouse, and it is
    the sharpest of the three because the mismatch is mechanistic rather than
    phenotypic. N is a terminal truncation whose transcript escapes
    nonsense-mediated decay; the truncated protein persists in follicles and
    heterozygotes are affected, which the authors read as semi-dominant and
    dominant-negative. Human ECTD9 is uniformly recessive and no
    dominant-negative HOXC13 allele has been reported. So the model that is most
    practically usable - the Hoxc13 knockout is poorly viable, and the Naked
    allele is offered explicitly as the more tractable alternative - is also the
    one whose mode of action is furthest from the human disease. Any mechanistic
    inference drawn from N/+ animals is inference about a dominant-negative
    truncation, not about the loss of function that causes the human condition.
  proposed_experiments:
  - experiment_id: hoxc13_patient_skeletal_imaging
    name: Systematic skeletal imaging in molecularly confirmed ECTD9 patients
    description: >-
      Spine and long-bone imaging in a cohort of biallelic-HOXC13 patients to
      establish whether subclinical vertebral anomalies are present but
      unreported in dermatology-ascertained pedigrees. A negative result would
      make allele hypomorphism or species divergence the explanation; a positive
      result would reclassify ECTD9 as less "pure" than its name implies.
  - experiment_id: hoxc13_missense_knockin_mouse
    name: Knock-in mouse carrying a human homeodomain missense allele
    description: >-
      Generate a mouse carrying the orthologous p.Arg311Trp or p.Asn310Thr
      substitution and compare its skeletal, growth, and appendage phenotype
      with the complete null, testing directly whether allele class rather than
      species explains the divergence.
  - experiment_id: hoxc13_human_skin_sebaceous_histology
    name: Sebaceous gland quantification in human ECTD9 scalp biopsies
    description: >-
      Quantify hair follicle and sebaceous gland number and size in archived
      ECTD9 scalp specimens to test whether the rabbit model's proposed
      follicle/sebaceous imbalance occurs in human disease.
notes: >-
  Entry scope: this file covers only the HOXC13 (ECTD9, MONDO:0013976) form of
  pure hair and nail ectodermal dysplasia. The KRT85 (ECTD4, MONDO:0011177) and
  KRT74 (ECTD7, MONDO:0013975) forms are separate Disease entries. The
  MONDO:0019071 umbrella "pure hair and nail ectodermal dysplasia" is modeled as
  the `Pure_Hair_and_Nail_Ectodermal_Dysplasias` Grouping rather than as a
  subtyped Disease, following the precedent set by
  `Hypohidrotic_Ectodermal_Dysplasias`.

  Named Entity Confusion risk: ECTD4, ECTD7, and ECTD9 share the clinical label
  "pure hair and nail ectodermal dysplasia" and all three genes sit in the same
  12q linkage interval, so literature and deep-research reports mix them freely.
  The Edison report backing this entry passed `just preflight-dr` against
  MONDO:0013976 (HOXC13 mentioned 49 times against KRT85 5 and KRT74 3).

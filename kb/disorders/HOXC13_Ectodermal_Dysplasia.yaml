      snippet: >-
        In an additional affected female from a consanguineous Afghan family, we
        found a 27.6 kb homozygous microdeletion involving the first exon of
        HOXC13.
      explanation: >-
        Documents a whole-exon deletion allele, establishing that copy-number
        loss as well as point mutation causes ECTD9.
  - name: c.355delC (p.Leu119Trpfs*20) frameshift
    description: >-
      Homozygous single-nucleotide deletion in a consanguineous Syrian family.

        We performed whole-exome sequencing in a consanguineous Chinese family
        affected by PHNED and identified a homozygous nonsense mutation
      explanation: >-
        Identifies the nonsense allele and its homozygous state in all affected
        members of the discovery family. The quote is trimmed before the
        bracketed HGVS span `[p.Tyr130(∗)]`, which the reference validator
        strips before matching.
  - name: 27.6 kb microdeletion of HOXC13 exon 1
    description: >-
      Homozygous 27.6 kb deletion removing the first exon of HOXC13, found in an
      affected female from a consanguineous Afghan family. A predicted null
      allele, and the reason deletion analysis belongs in the diagnostic
      strategy alongside sequencing.

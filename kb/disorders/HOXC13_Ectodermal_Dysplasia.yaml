name: HOXC13-Related Pure Hair-Nail Ectodermal Dysplasia
creation_date: "2026-08-17T00:00:00Z"
description: >-
  Ectodermal dysplasia 9, hair/nail type (ECTD9) is a rare autosomal recessive
  pure hair and nail ectodermal dysplasia caused by biallelic loss-of-function
  variants in HOXC13, a homeodomain transcription factor expressed in hair
  follicle and nail-forming epithelium that transactivates the terminal
  differentiation program of those appendages, including hair keratin genes.
  Affected individuals have congenital hypotrichosis ranging to complete
  alopecia of scalp, eyebrows, and eyelashes, together with nail dystrophy that
  typically involves all twenty nails. The diagnostically decisive feature is
  what is not involved: unlike the hypohidrotic ectodermal dysplasias, sweat
  gland function and dentition are preserved, restricting the phenotype to hair
  and nail appendages. Reported alleles converge on reduced HOXC13 target-gene
  transactivation by three routes - nonsense-mediated decay of truncating and
  deletion alleles, impaired DNA binding by homeodomain missense alleles, and
  reduced protein stability.
category: Genetic
parents:
- Ectodermal Dysplasia

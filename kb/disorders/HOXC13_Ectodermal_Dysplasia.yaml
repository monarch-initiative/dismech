  - name: c.931C>T (p.Arg311Trp) protein-destabilizing missense
    description: >-
      Homozygous homeodomain missense variant that, unlike other homeodomain
      alleles, acts by reducing HOXC13 protein stability rather than by
      abolishing DNA binding, establishing a third molecular route to the same

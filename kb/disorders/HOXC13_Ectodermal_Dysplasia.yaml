  variants:
  - name: c.390C>A (p.Tyr130*) nonsense
    description: >-
      Homozygous nonsense allele identified by whole-exome sequencing in a
      consanguineous Chinese family, the first HOXC13 variant reported in PHNED.
      Scalp tissue from the index case showed dramatically reduced HOXC13 mRNA
      and nearly absent protein in hair follicles, indicating nonsense-mediated
      decay.
    type: NONSENSE

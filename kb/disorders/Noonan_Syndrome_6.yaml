      directness: INDIRECT
  - target: Developmental Lymphatic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Provisional extrapolation from other RAS/MAPK-associated Noonan models in which
      ERK-driven SOX18 overexpression produces excessive lymphatic endothelial
      proliferation.
    evidence:
    - reference: PMID:40041314
      reference_title: Trametinib as a targeted treatment in cardiac and lymphatic presentations of Noonan syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In preclinical mouse studies, gain-of-function variants in RAS/MAPK-associated

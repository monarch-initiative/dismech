- name: Disrupted Embryonic Cardiac Development
  biological_scale: TISSUE
  description: >-
    Embryonic NrasG12D activation disrupts cardiac morphogenesis in mice.
    Endothelial/endocardial expression recapitulates ventricular septal and pulmonary
    valve defects; cardiomyocyte-specific expression does not. These experiments
    support a candidate route for structural NS6 lesions, but do not explain human
    HCM: the mutant mouse myocardium is thin, and transfer across alleles, dosage and
    species remains uncertain.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  downstream:
  - target: Congenital Heart Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Provisional translation of NrasG12D mouse cardiac maldevelopment to the
      corresponding human structural lesion; the mouse does not reproduce the complete
      NRAS clinical spectrum.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, the mutant embryos exhibited cardiac malformations resembling human
        congenital cardiac defects seen in NS patients, including ventricular septal
        defects, double outlet right ventricle, the hypertrabeculation/thin myocardium, and
        pulmonary valve stenosis.
      explanation: >-
        Connects activated Nras-driven cardiac maldevelopment to the congenital heart
        lesions of Noonan syndrome.
  - target: Pulmonic Stenosis

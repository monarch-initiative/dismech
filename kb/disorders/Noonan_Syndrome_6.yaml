- category: Craniofacial
  name: Noonan Facial Gestalt
  description: >-
    The characteristic RASopathy face — hypertelorism, downslanting palpebral fissures,
    ptosis, and low-set posteriorly rotated ears — evolving with age. It is the feature
    that identifies affected individuals clinically as having Noonan syndrome before
    molecular testing.
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals exhibited features fitting Noonan syndrome, and the observed
      germline variants differed from the typical oncogenic NRAS changes occurring as
      somatic events in tumours.
    explanation: >-
      Establishes that individuals with germline NRAS variants present with the Noonan
      syndrome clinical gestalt.
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Noonan syndrome, a developmental disorder characterized by congenital heart defects,
      reduced growth, facial dysmorphism and variable cognitive deficits, is caused by
      constitutional dysregulation of the RAS-MAPK signaling pathway.
    explanation: >-
      Facial dysmorphism is named as a defining feature of the disorder in the paper
      that established NRAS as a cause - but this sentence is the paper's background
      definition of Noonan syndrome as a whole rather than a finding about its NRAS
      cohort, so it is graded INDIRECT on the same basis as the GeneReviews
      parent-entity statements elsewhere in this entry.
- category: Craniofacial
  name: Hypertelorism
  description: Widely spaced eyes, a component of the Noonan facial gestalt.
  phenotype_term:
    preferred_term: Hypertelorism
    term:
      id: HP:0000316
      label: Hypertelorism
  evidence:
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      At the age of
      24 years, she has the following features of NS (Fig. 1a): a
      large skull (62 cm) with a broad forehead, hypertelorism,
      down slanted palpebral fissures, bilateral ptosis (especially
      of her left eye), short and broad neck with a low hairline,
      and low-set ears with broad helices. Her hair is normal.
    explanation: >-
      Adult woman with familial p.G60E NRAS-associated Noonan syndrome; this is
      subtype-specific clinical examination.
- category: Craniofacial
  name: Ptosis
  description: >-
    Upper eyelid ptosis was present in 82% of assessed individuals in the 2017 NRAS
    series; the expanded literature comparison reported 63%.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      All assessed subjects had craniofacial features that were classi ﬁed as
      typical or suggestive for a RASopathy. Short and broad or webbed
      neck was found in 94%, and ocular ptosis in 82% of the cases.
    explanation: >-
      The 2017 series comprises 19 individuals from 13 families with NRAS-associated
      RASopathy, including NS, CFCS-like and Costello-like presentations. Aggregate
      statistics exclude the patient with a 22q11.23 duplication and hypoxic ischemic
      encephalopathy; denominators vary with ascertainment.
  frequency: VERY_FREQUENT
- category: Craniofacial
  name: Downslanted Palpebral Fissures

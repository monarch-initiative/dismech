      directness: INDIRECT
  - target: Learning Difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Constitutional RAS-MAPK dysregulation is implicated in Noonan cognitive deficits;
      the precise neuronal circuit and contribution of non-neural factors remain

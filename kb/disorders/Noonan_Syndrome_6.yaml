name: Noonan Syndrome 6
creation_date: '2026-08-18T00:00:00Z'
description: >-
  Noonan syndrome 6 (NS6, NRAS Noonan syndrome) is the rare NRAS-associated arm of
  the Noonan syndrome RASopathy spectrum. Heterozygous germline gain-of-function
  missense variants in NRAS — which encodes the canonical small GTPase N-Ras —
  increase flux through the RAS-MAPK (RAF-MEK-ERK) cascade during development,
  producing the recognizable Noonan phenotype of characteristic facies, short or
  webbed neck, ptosis, congenital heart disease (with hypertrophic cardiomyopathy
  over-represented relative to pulmonic stenosis), variable growth restriction, and
  variable neurodevelopmental involvement. NS6 is defined molecularly rather than
  clinically: its clinical picture sits within the broader Noonan/RASopathy
  spectrum, so the disease entity is delimited by the causal gene. Reported
  pathogenic residues include Ile24, Thr50, Thr58 and Gly60, and — unlike the
  originally described "restricted spectrum" — the classic somatic oncogenic hotspot
  Gly12, whose germline occurrence is associated with more severe disease and with
  tumors. NRAS is a rare molecular cause of Noonan syndrome; published cohorts
  remain small. See the Noonan Syndrome umbrella entry for the shared clinical and
  management picture of the parent disorder.
category: Mendelian
parents:
- Noonan Syndrome
- RASopathy

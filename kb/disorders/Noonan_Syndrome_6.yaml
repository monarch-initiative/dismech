        Names Noonan syndrome, of which NS6 is the NRAS-defined subtype, among the
        germline RASopathies, which is the mechanistic nosology assigned here. Graded
        INDIRECT for the same reason as the other use of this quote: it names the parent
        entity, so it reaches NS6 through Noonan syndrome rather than naming NRAS.
discussions:
- discussion_id: ns6_oncogenic_codon_tumor_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do germline NRAS alleles at the classic oncogenic codons (Gly12, and by extension
    Gly13/Gln61) carry a quantitatively higher tumor risk than the non-hotspot NS6 alleles,
    and how large is that risk?
  rationale: >-
    Published NRAS RASopathy series contain few tumor events with heterogeneous ages
    and follow-up. The 2015 familial literature review predates the expanded
    oncogenic-codon spectrum and cannot establish equal risk between NRAS and other
    Noonan genotypes. The 2017 brain mass was unbiopsied and possibly hamartomatous.
    Allele-stratified lifetime risk therefore remains unresolved.
  attaches_to:
  - pathophysiology#Oncogenic-Codon Germline Alleles and Tumor Predisposition
  evidence:
  - reference: PMID:31697451
    reference_title: "NRAS associated RASopathy and embryonal rhabdomyosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      analysis of previously reported NRAS-RASopathy cases suggests that mutations at
      traditionally oncogenic codons are associated with elevated cancer risk not present
      with mutations at other sites
    explanation: >-
      The codon-dependent risk claim is explicitly hedged as a suggestion from reanalysis
      of previously reported cases, which is the gap this discussion records.
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the risk for NS individuals with a germline NRAS mutation developing JMML is not
      different from the proportion seen in other NS cases
    explanation: >-
      Historical interpretation from a small, earlier case series; it cannot establish
      risk equivalence or refute later allele-specific susceptibility.
  proposed_experiments:
  - experiment_id: ns6_genotype_stratified_tumor_incidence
    name: Genotype-stratified tumor-incidence study across an international NS6 registry
    description: >-
      Pool NRAS-positive Noonan syndrome individuals internationally, stratify by hotspot
      versus non-hotspot codon, and compute age-adjusted tumor incidence with explicit
      denominators and person-years of follow-up.
- discussion_id: ns6_animal_model_allele_strength
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the available NRAS animal models faithfully represent human NS6, given that both
    use alleles or dosages stronger than the typical human constitutional lesion?
  rationale: >-
    The mouse model uses the oncogenic G12D allele expressed pan-embryonically and is
    lethal between E15.5 and E17.5, so it cannot model the postnatal NS6 course; the
    zebrafish model uses transient mRNA overexpression of human mutants rather than an
    endogenous heterozygous locus. Both give a clear MAPK-dependent developmental
    phenotype, but the quantitative relationship between their signalling gain and
    that of a human NS6 heterozygote is unknown - which matters directly for
    interpreting the MEK-inhibitor rescue as a therapeutic rationale.
  attaches_to:
  - pathophysiology#Disrupted Embryonic Cardiac Development
  - pathophysiology#Disrupted Early Developmental Patterning
  evidence:
  - reference: PMID:33681212
    reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, oncogenic NrasG12D mutation may not be compatible with embryonic survival.
    explanation: >-
      The authors' own conclusion that the modelled allele is embryonic-lethal is precisely
      the translational mismatch with living human NS6 individuals that this discussion records.
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of N-Ras-I24N, N-Ras-G60E or the strongly activating mutant N-Ras-G12V,
      which we included as a positive control, results in developmental defects in
      zebrafish embryos
    explanation: >-
      The zebrafish readout comes from injected expression benchmarked against a strongly
      activating positive control, not from an endogenous heterozygous locus - the dosage
      mismatch this discussion records.
  proposed_experiments:
  - experiment_id: ns6_endogenous_knockin_mouse
    name: Endogenous-locus heterozygous knock-in of a human NS6 allele
    description: >-
      Generate mice carrying a heterozygous knock-in of a non-hotspot human NS6 allele
      (e.g. Nras G60E) at the endogenous locus, and assess viability, cardiac phenotype,
      growth and craniofacial morphology against the G12D model.
- discussion_id: ns6_haploinsufficiency_versus_gain_of_function
  kind: KNOWLEDGE_GAP
  prompt: >-
    If NS6 is caused by gain-of-function NRAS alleles that raise RAS-MAPK flux, why do
    1p13.2 microdeletions that remove one NRAS copy produce an overlapping Noonan
    phenotype?
  rationale: >-
    This entry's whole causal chain runs through increased signal throughput into the
    RAF-MEK-ERK cascade, so a loss-of-dosage lesion converging on a similar clinical
    picture is a direct challenge to that model rather than an incidental observation.
    Three readings are open and the published data do not separate them: the deletion
    phenotype may be driven by other genes in the deleted segment rather than by NRAS;
    reduced N-Ras may perturb pathway output non-monotonically, so that both raising and
    lowering it degrades developmental signalling; or the shared features may be
    non-specific enough that clinical overlap does not imply mechanistic convergence. The
    same loss-and-gain pattern is reported for MAP2K2 and SHOC2, so this is a recurring
    question about RAS-MAPK dosage rather than an NRAS curiosity. Resolving it bears on
    whether MEK inhibition is a rational therapy for the deletion phenotype, where it
    could plausibly make matters worse.
  attaches_to:
  - pathophysiology#NRAS Germline Gain-of-Function Variant
  - pathophysiology#RAS-MAPK Cascade Hyperactivation
  evidence:
  - reference: PMID:27561113
    reference_title: "1p13.2 deletion displays clinical features overlapping Noonan syndrome, likely related to NRAS gene haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, it is conceivable that NRAS haploinsufficiency and gain-of-function mutations
      may have similar clinical consequences.
    explanation: >-
      The authors state the convergence as a conjecture ("it is conceivable"), which is
      precisely why it is recorded here as an open question rather than as a competing
      mechanism in the pathograph.
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report that germline NRAS mutations conferring enhanced stimulus-dependent
      MAPK activation account for some cases of this disorder.
    explanation: >-
      The enhanced MAPK activation component of this claim derives from transfected-cell
      assays; human sequencing establishes the germline diagnosis.
  proposed_experiments:
  - experiment_id: ns6_nras_dosage_series
    name: NRAS dosage series against developmental RAS-MAPK output
    description: >-
      Compare ERK pathway output and developmental phenotype across an allelic dosage
      series - NRAS null/heterozygous-null, wild type, and a knock-in non-hotspot NS6
      allele - in one system, to test whether pathway output responds non-monotonically to
      N-Ras dosage or whether the deletion phenotype is carried by neighbouring genes.
    perturbations:
    - name: Heterozygous NRAS loss versus knock-in NS6 gain-of-function allele
      target: pathophysiology#NRAS Germline Gain-of-Function Variant
      genes:
      - preferred_term: NRAS
        term:
          id: hgnc:7989
          label: NRAS
    readouts:
    - name: Phosphorylated ERK as developmental RAS-MAPK output
      target: pathophysiology#RAS-MAPK Cascade Hyperactivation
      biological_processes:
      - preferred_term: ERK1 and ERK2 cascade
        term:
          id: GO:0070371
          label: ERK1 and ERK2 cascade
      direction: ALTERED
      interpretation: >-
        A similar developmental phenotype arising from opposite directions of pathway
        output would support non-monotonic dosage sensitivity; output changing only in the
        gain-of-function arm would point to neighbouring genes carrying the deletion
        phenotype.
- discussion_id: ns6_neurodevelopmental_attribution
  kind: KNOWLEDGE_GAP
  prompt: Which neural, muscular or auditory mechanisms account for NRAS-associated findings?
  rationale: >-
    Motor delay and hypotonia are separable from intellect, and later catch-up is
    documented. The severe intellectual-disability case is allele-specific; the
    extreme 2017 Glu37dup developmental presentation also had a 22q11.23 duplication
    and hypoxic ischemic injury. The reviewed NRAS sources do not resolve the relative
    neural, muscular and sensory contributions. A specific causal tissue route for
    hearing loss is not established.
  attaches_to:
  - phenotypes#Motor Delay
  - phenotypes#Severe Intellectual Disability
  - phenotypes#Muscular Hypotonia
  - phenotypes#Hearing Impairment
  - phenotypes#Congenital Sensorineural Hearing Impairment
  evidence:
  - reference: PMID:28594414
    reference_title: Genotype and phenotype spectrum of NRAS germline variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Motor delay and
      intellectual or learning disabilities were recorded in 38 and 42% of
      patients, respectively.
    explanation: >-
      The 2017 series comprises 19 individuals from 13 families with NRAS-associated
      RASopathy, including NS, CFCS-like and Costello-like presentations. Aggregate
      statistics exclude the patient with a 22q11.23 duplication and hypoxic ischemic
      encephalopathy; denominators vary with ascertainment.
  - reference: PMID:31697451
    reference_title: NRAS associated RASopathy and embryonal rhabdomyosarcoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present the case of a germline heterozygous NRAS mutation producing a severe
      phenotype involving embryonal rhabdomyosarcoma, severe intellectual disability,
      and numerous melanocytic nevi in addition to more typical manifestations of Noonan
      syndrome.
    explanation: >-
      Single reported case documenting severe intellectual disability in NRAS-associated
      RASopathy. No frequency band is asserted: the report supplies no denominator, so
      the proportion of NS6 individuals reaching this severity cannot be estimated from
      it.
- discussion_id: ns6_anatomical_and_skin_attribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which NRAS-specific developmental mechanisms generate the remaining anatomical and
    cutaneous findings?
  rationale: >-
    The reviewed sources establish the clinical findings but do not assign distinct tissue mechanisms to these endpoints. The zebrafish craniofacial evidence supports widening, not every facial feature; the NrasG12D mouse demonstrates ventricular septation and pulmonary valve defects, not a ductal mechanism; the atrial septal pathway link is instead a qualified extrapolation from the RASopathy review. Somatic mosaic NRAS nevus biology cannot automatically establish the mechanism of pigmentation in constitutional NS6. Pectus carinatum remains supported indirectly by parent-Noonan evidence.
  attaches_to:

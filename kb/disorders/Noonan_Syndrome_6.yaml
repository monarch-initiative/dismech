      mutation in cancer cells, and analysis of previously reported NRAS-RASopathy cases
      suggests that mutations at traditionally oncogenic codons are associated with
      elevated cancer risk not present with mutations at other sites.
    explanation: >-
      States the codon-dependent tumor-risk pattern that motivates this node.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, one of the patients (c.35G>A; p.(Gly12Asp)) had a myeloproliferative
      disorder, and one subject (c.34G>C; p.(Gly12Arg)) exhibited an uncharacterized brain
      tumour.
    explanation: >-
      Reports the neoplastic events observed in Gly12 germline carriers in the largest
      NRAS RASopathy cohort.
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither of affected individuals in this family presented with juvenile myelomonocytic
      leukemia (JMML), which together with previously published results suggest that the
      risk for NS individuals with a germline NRAS mutation developing JMML is not
      different from the proportion seen in other NS cases.
    explanation: >-
      Counterweight to a blanket high-risk reading: JMML risk in NRAS-positive Noonan
      syndrome is not reported as elevated above Noonan syndrome generally.
  mechanism_confidence: PROVISIONAL
- name: Developmental Lymphatic Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Developmentally abnormal lymphatic channels and transport can impair lymph
    clearance, causing stasis, reflux and fluid accumulation. RAS-MAPK-driven
    lymphatic proliferation is established in other Noonan models; applying the route
    to NRAS disease is provisional. Prenatal lymphatic distension is also a published
    hypothesis for selected facial, neck and genital findings, rather than their
    proven universal cause.
  evidence:
  - reference: PMID:40041314
    reference_title: Trametinib as a targeted treatment in cardiac and lymphatic presentations of Noonan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A spectrum of complex anomalies such as enlargement of lymphatic channels
      (lymphangiectasia), dysmotility, or central conducting lymphatic anomaly (CCLA)
      cause inadequate clearing of lymph with resultant stasis and reflux, affecting
      various organ systems, and resulting in lymphedema, chylothorax, pericardial
      effusion, congenital pulmonary lymphangiectasia (CPL), exudative enteropathy,
      chylous ascites, cystic hygroma, hydrops and other manifestations, some of which
      are detectable as early as the second trimester of pregnancy and are potentially
      life-threatening in neonates (12–14).
    explanation: >-
      Review-level mechanism in Noonan syndrome: impaired lymph clearance, stasis and
      reflux cause these fluid findings. Applied indirectly to NRAS-associated lymphatic
      manifestations.
    directness: INDIRECT
  downstream:
  - target: Lymphedema
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired lymph drainage can produce this manifestation. The general Noonan
      mechanism is applied provisionally to NRAS cases, with possible additional cardiac

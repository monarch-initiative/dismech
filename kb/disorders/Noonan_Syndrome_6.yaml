name: Noonan Syndrome 6
creation_date: '2026-08-18T00:00:00Z'
description: >-
  Noonan syndrome 6 (NS6) is the rare arm of the Noonan syndrome (RASopathy)
  spectrum caused by heterozygous germline gain-of-function variants in NRAS,
  which encodes the canonical small GTPase N-Ras. Like other Noonan syndrome
  subtypes it is autosomal dominant and presents with distinctive facial
  features, short stature, congenital heart defects, and variable
  developmental delay, but NRAS accounts for well under 1% of molecularly
  confirmed Noonan syndrome.
category: Mendelian
parents:
- Noonan Syndrome
- RASopathy
disease_term:
  preferred_term: Noonan syndrome 6
  description: Noonan syndrome caused by a gain-of-function mutation in NRAS.
  term:
    id: MONDO:0013186
    label: Noonan syndrome 6
pathophysiology:
- name: NRAS Gain-of-Function Activation
  description: >-
    Germline missense NRAS variants shift N-Ras toward the GTP-bound active
    state, increasing stimulus-dependent RAS-MAPK signaling.
  biological_scale: MOLECULAR
phenotypes:
- category: Craniofacial
  name: Noonan Facial Gestalt
  description: >-
    Hypertelorism, downslanting palpebral fissures, ptosis, low-set
    posteriorly rotated ears, and webbed or short neck.

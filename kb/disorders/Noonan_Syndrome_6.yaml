genetic:
- name: NRAS
  gene_term:
    preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  frequency: VERY_RARE
  notes: >-
    NRAS encodes the canonical small GTPase N-Ras. NS6 is caused by heterozygous germline
    missense gain-of-function variants; reported residues include Ile24, Thr50, Thr58,
    Gly60 and the classic somatic oncogenic codon Gly12. Cohort screens place NRAS at a
    very small share of molecularly solved Noonan syndrome (3/115 and 2/125 in two
    mutation-negative screening cohorts). ClinGen's RASopathy expert panel classifies the
    NRAS-Noonan syndrome relationship as Definitive with autosomal dominant inheritance.
    Constitutional status must be confirmed in non-hematopoietic tissue when an
    oncogenic-hotspot allele is found in blood during a myeloid-neoplasia workup.
  case_fractions:
  - population: >-
      Noonan syndrome probands negative for PTPN11, SOS1, RAF1 and KRAS
    case_fraction_percent: 2.6
    cohort_size: 115
    notes: 3 NRAS mutations identified in 3 of 115 previously mutation-negative probands.
    evidence:
    - reference: PMID:22855653
      reference_title: "NRAS Mutations in Noonan Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we performed mutation analysis of NRAS and SHOC2 in 115 PTPN11, SOS1, RAF1,
        and KRAS mutation-negative individuals. No SHOC2 mutations were found, but we
        identified 3 NRAS mutations in 3 probands.
      explanation: >-
        Gives the numerator and denominator for the NRAS share of this screening cohort.
  - population: >-
      French Noonan syndrome cohort negative for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1,
      BRAF and SHOC2
    case_fraction_percent: 1.6
    cohort_size: 125
    notes: The recurrent c.179G>A (p.G60E) allele found in 2 of 125 screened patients.
    evidence:
    - reference: PMID:22887781
      reference_title: "Constitutional NRAS mutations are rare among patients with Noonan syndrome or juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report on the mutational analysis of NRAS in a cohort of 125 French patients
        with NS and no known mutation for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1, BRAF, and
        SHOC2. The c.179G>A (p.G60E) mutation was identified in two patients with typical
        NS, confirming that NRAS germline mutations are a rare cause of this syndrome.
      explanation: >-
        Gives the numerator and denominator for the NRAS share of this screening cohort.
  evidence:
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that germline NRAS mutations conferring enhanced stimulus-dependent
      MAPK activation account for some cases of this disorder.
    explanation: Establishes NRAS as a gain-of-function cause of Noonan syndrome.
  - reference: CGGV:assertion_34419b69-59c3-458b-a2a5-38a401679deb-2018-05-30T160000.000Z
    reference_title: "NRAS / Noonan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NRAS | HGNC:7989 | Noonan syndrome | MONDO:0018997 | AD | Definitive"
    explanation: >-
      ClinGen's RASopathy Gene Curation Expert Panel classifies the NRAS-Noonan syndrome
      relationship as Definitive with autosomal dominant inheritance.
  - reference: PMID:22855653
    reference_title: "NRAS Mutations in Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with germline NRAS mutations is variable. Our results
      confirm that a small proportion of Noonan syndrome patients carry germline NRAS
      mutations.
    explanation: >-
      Supports both the rarity of the NRAS subtype and its variable expressivity.
inheritance:
- name: Autosomal Dominant
  description: >-
    NS6 is inherited in an autosomal dominant manner. Many cases arise de novo, but
    familial transmission with cosegregation is documented, and parental mosaicism has been
    reported — so recurrence risk after an apparently de novo case is not necessarily zero.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The result revealed a recurrent mutation in NRAS, c.179G > A (p.G60E), in the index
      patient. This mutation was inherited from the index patient's father, who also showed
      signs of NS.
    explanation: >-
      Documents parent-to-child transmission of a heterozygous NRAS allele with affected
      status in both, consistent with autosomal dominant inheritance.
  - reference: CGGV:assertion_34419b69-59c3-458b-a2a5-38a401679deb-2018-05-30T160000.000Z
    reference_title: "NRAS / Noonan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NRAS | HGNC:7989 | Noonan syndrome | MONDO:0018997 | AD | Definitive"
    explanation: ClinGen records autosomal dominant inheritance for the NRAS-Noonan relationship.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate exists for NS6 specifically. Only a few dozen
    molecularly confirmed individuals have been reported; the largest single series added
    19 cases. The Noonan syndrome birth prevalence of roughly 1 in 1,000-2,500 belongs to
    the parent entity and must not be assigned to this subtype.
  evidence:
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A small number of RASopathy cases with disease-causing germline NRAS alterations have
      been reported.
    explanation: >-
      States that only a small number of germline NRAS RASopathy cases exist in the
      literature.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe 19 new cases with RASopathy due to disease-causing variants in NRAS.
    explanation: Gives the size of the largest reported NRAS RASopathy series.
animal_models:
- name: Nras G12D pan-embryonic knock-in mouse (Mox2-Cre)
  species: Mouse
  genotype: NrasG12D/+ ; Mox2-Cre
  description: >-
    Conditional endogenous-locus activation of Nras throughout the embryo, producing
    cardiac malformations that mirror the congenital heart lesions of Noonan syndrome,
    with lethality from E15.5. Lineage-restricted crosses localize the requirement to the
    endothelial/endocardial compartment.
  publication: PMID:33681212
  evidence:
  - reference: PMID:33681212
    reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At E13.5, NrasG12D/ + ; Mox2Cre/ + embryos displayed a moderate expansion of
      hematopoietic stem and progenitor cells without a significant impact on erythroid
      differentiation in the fetal liver.
    explanation: >-
      First-party characterization of what this specific model does and does not show,
      which is what establishes its scope as an informative system here.
  modeled_mechanisms:
  - target: Disrupted Embryonic Cardiac Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Activated Nras in the developing embryo produces septal, outflow-tract, myocardial
      and pulmonary-valve lesions matching the human Noonan cardiac spectrum, together
      with ERK pathway dysregulation in the mutant heart.
    limitations: >-
      G12D is an oncogenic somatic hotspot allele that is stronger than most human NS6
      alleles, and pan-embryonic expression is lethal by E15.5 — so the model cannot
      address the postnatal course. Human NS6 individuals with Gly12 alleles are reported
      but rare.
    readouts:
    - name: Cardiac morphology at E13.5-E15.5
      target: Disrupted Embryonic Cardiac Development
      direction: ALTERED
      interpretation: >-
        Structural cardiac malformations are the morphological correlate of the disrupted
        cardiac-development node.
      evidence:
      - reference: PMID:33681212
        reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Importantly, the mutant embryos exhibited cardiac malformations resembling human
          congenital cardiac defects seen in NS patients, including ventricular septal
          defects, double outlet right ventricle, the hypertrabeculation/thin myocardium,
          and pulmonary valve stenosis.
        explanation: Reports the histological/morphological cardiac measurement in this model.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that pan-embryonic expression of endogenous NrasG12D/ + by Mox2-Cre
        in mice caused embryonic lethality from embryonic day (E) 15.5 and developmental
        defects predominantly in the heart.
      explanation: >-
        Supports treating this model as informative for the cardiac-development node.
- name: Zebrafish N-Ras I24N / G60E overexpression embryo
  species: Zebrafish
  genotype: mRNA expression of human NRAS I24N or G60E
  description: >-
    Expression of Noonan-derived activating N-Ras mutants in zebrafish embryos produces
    gastrulation defects phenocopying those of other Noonan syndrome genes; MEK inhibition
    fully rescues them.
  publication: PMID:21263000
  evidence:
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The defects in zebrafish embryos are reminiscent of symptoms in individuals with
      Noonan syndrome and phenocopy the defects that other Noonan-syndrome-associated genes
      induce in zebrafish embryos.
    explanation: >-
      Supports treating this zebrafish system as an informative model of Noonan syndrome,
      benchmarked against other Noonan genes in the same assay.
  modeled_mechanisms:
  - target: Disrupted Early Developmental Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that the human NS6 alleles are sufficient to derail early embryonic
      patterning, and that the effect is MAPK-dependent.
    limitations: >-
      Transient mRNA overexpression rather than an endogenous heterozygous knock-in, so
      dosage exceeds the human constitutional state; gastrulation defects are a zebrafish
      developmental readout, not a human NS6 clinical feature.
    readouts:
    - name: MEK-inhibitor rescue of gastrulation phenotype
      target: Disrupted Early Developmental Patterning
      direction: RESTORED
      interpretation: >-
        Complete rescue by MEK inhibition establishes that the patterning defect is
        mediated by the RAS-MAPK cascade.
      evidence:
      - reference: PMID:21263000
        reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          MEK inhibition completely rescued the activated N-Ras-induced phenotypes,
          demonstrating that these defects are mediated exclusively by Ras-MAPK signaling.
        explanation: Reports the rescue measurement behind this readout.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, mutations in NRAS from individuals with Noonan syndrome activated
        N-Ras signaling and induced developmental defects in zebrafish embryos, indicating
        that activating mutations in NRAS cause Noonan syndrome.
      explanation: >-
        Supports treating this model as informative for the early-patterning node.
diagnosis:
- name: Molecular genetic testing of a RASopathy gene panel
  description: >-
    NS6 is a molecularly defined entity, so the diagnosis rests on identifying a
    heterozygous pathogenic NRAS variant in an individual with suggestive clinical
    findings. NRAS is one of the genes on the standard Noonan syndrome diagnostic panel;
    because NS6 is clinically indistinguishable from other Noonan subtypes, panel or
    exome testing rather than single-gene testing is the practical route.
  diagnosis_term:
    preferred_term: RASopathy gene-panel molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  notes: >-
    The NCIT term is generic; the preferred term records that diagnostic confirmation for
    this entry is detection of a pathogenic NRAS variant on a Noonan/RASopathy panel.
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Noonan is established in a proband with suggestive findings and a
      heterozygous pathogenic variant in BRAF, KRAS, MAP2K1, MRAS, NRAS, PTPN11, RAF1,
      RASA2, RIT1, RRAS2, SOS1, or SOS2 or either a heterozygous variant or biallelic
      pathogenic variants in LZTR1 identified by molecular genetic testing.
    explanation: >-
      GeneReviews names NRAS explicitly among the genes whose heterozygous pathogenic
      variants establish the diagnosis, which is what defines this entry's entity - so
      unlike the parent-entity clinical statements elsewhere in this file, this one is
      directly on point for NS6.
- name: Confirmation of constitutional (germline) origin in non-hematopoietic tissue
  description: >-
    Codons 12, 13 and 61 of NRAS are classic somatic hotspots in myeloid neoplasia, so an
    NRAS variant found in blood during a leukemia or myeloproliferative-disease workup does
    not by itself establish NS6. Constitutional status should be confirmed in a
    non-hematopoietic specimen (fibroblasts, buccal epithelium, nail, urine or saliva).
  diagnosis_term:
    preferred_term: germline confirmation testing on a non-hematopoietic specimen
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22887781
    reference_title: "Constitutional NRAS mutations are rare among patients with Noonan syndrome or juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the 11 JMML patients for which germline DNA was available had a
      constitutional NRAS mutation.
    explanation: >-
      Demonstrates empirically that NRAS variants in myeloid disease are typically somatic
      rather than constitutional, which is why germline confirmation is a distinct
      diagnostic step for this entry.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the observed germline variants differed from the typical oncogenic NRAS changes
      occurring as somatic events in tumours
    explanation: >-
      Frames the germline-versus-somatic distinction this diagnostic step addresses;
      PARTIAL because the same report goes on to show the distinction is not absolute
      (four germline Gly12 carriers).
- name: Baseline cardiac evaluation
  description: >-
    Echocardiographic assessment at diagnosis, with continued surveillance, because
    congenital heart disease is present in most affected individuals and hypertrophic
    cardiomyopathy may appear after infancy.
  diagnosis_term:
    preferred_term: echocardiographic evaluation
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In children age <5 years: if initial cardiac evaluation is normal, at least annual
      cardiac evaluations until age 5 years.
    explanation: >-
      GeneReviews surveillance guidance underpinning baseline and repeat cardiac
      assessment; PARTIAL because it is written for the parent entity.
treatments:
- name: Recombinant Growth Hormone (Somatropin) Therapy
  description: >-
    Growth hormone treatment increases growth velocity in Noonan syndrome and is used for
    the short stature of the syndrome. It is not NRAS-specific: no NS6 subgroup outcome
    data exist.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth hormone (GH) treatment increases growth velocity."
    explanation: >-
      GeneReviews supports growth hormone therapy in Noonan syndrome; PARTIAL because the
      recommendation is for the parent entity, not the NRAS subtype.
- name: MEK Inhibition (Trametinib, Experimental/Off-Label)
  description: >-
    MEK1/2 inhibition targets the step of the RAS-MAPK cascade immediately downstream of
    the activated N-Ras protein, and MEK inhibition fully rescues the developmental
    phenotypes of Noonan-associated N-Ras mutants in zebrafish. In humans it remains
    off-label and experimental, used in case reports for severe cardiac and lymphatic
    disease in Noonan syndrome; no NS6-specific outcome data exist and long-term follow-up
    is unavailable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: trametinib
      term:
        id: NCIT:C77908
        label: Trametinib
  target_mechanisms:
  - target: RAS-MAPK Cascade Hyperactivation
    treatment_effect: INHIBITS
    description: >-
      MEK1/2 inhibition blocks signal flow through the hyperactivated cascade downstream of
      the mutant N-Ras protein.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MEK inhibition completely rescued the activated N-Ras-induced phenotypes,
        demonstrating that these defects are mediated exclusively by Ras-MAPK signaling.
      explanation: >-
        Establishes MEK as the actionable node downstream of Noonan-associated activated
        N-Ras.
  evidence:
  - reference: PMID:40041314
    reference_title: "Trametinib as a targeted treatment in cardiac and lymphatic presentations of Noonan syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A short-term improvement of symptoms was reported in all cases, with three deaths
      presumably unrelated to trametinib. Moderate side effects were reported in a subset
      of patients. Long-term follow-up data were not available.
    explanation: >-
      Systematic review of off-label trametinib in severe Noonan syndrome; PARTIAL because
      the collected cases are Noonan syndrome generally (the index case was PTPN11), not
      NRAS-associated NS6.
  - reference: PMID:40041314
    reference_title: "Trametinib as a targeted treatment in cardiac and lymphatic presentations of Noonan syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No formal clinical trial of trametinib in neonatal/pediatric Noonan syndrome has been
      published to our knowledge.
    explanation: >-
      Records the experimental status of this therapy; PARTIAL for the same reason as above.
- name: Cardiac Surveillance and Management
  description: >-
    Cardiovascular anomalies are treated as in the general population, with scheduled
    echocardiographic surveillance because hypertrophic cardiomyopathy may appear after
    infancy.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiovascular anomalies in NS are usually treated as in the general population."
    explanation: >-
      GeneReviews management guidance for the parent entity; PARTIAL because it is not
      NRAS-specific.
- name: Perioperative Bleeding Assessment and Avoidance of Aspirin
  description: >-
    Because varied coagulation defects occur, bleeding history and coagulation testing are
    assessed before surgery, and aspirin therapy is avoided as it may exacerbate the
    bleeding diathesis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Aspirin therapy should be avoided because it may
      exacerbate a bleeding diathesis.
    explanation: >-
      GeneReviews drug-safety warning for Noonan syndrome; PARTIAL because it applies to
      the parent entity.
- name: Genetic Counseling
  description: >-
    Counseling covers the 50% transmission risk from an affected parent, the predominance
    of de novo events, and the residual recurrence risk from parental mosaicism.
    Constitutional versus somatic origin must be clarified when an oncogenic-hotspot NRAS
    allele is detected in blood.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with autosomal dominant NS has a 50% chance of inheriting
      the pathogenic variant.
    explanation: >-
      GeneReviews recurrence-risk statement underpinning counseling; PARTIAL because it is
      a parent-entity statement.
clinical_trials:
- name: NCT06555237
  phase: PHASE_II
  status: RECRUITING
  description: >-
    MEKinRAS - randomized controlled trial of trametinib added to standard therapy versus
    standard therapy alone for hypertrophic cardiomyopathy in patients with a molecularly
    confirmed RASopathy. Eligibility is defined by a RAS-MAPK pathway variant plus HCM
    rather than by a clinical Noonan syndrome diagnosis, so an individual with NS6 and HCM
    is eligible; no NRAS subgroup outcome is planned or reported.
  target_phenotypes:
  - preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: clinicaltrials:NCT06555237
    reference_title: "MEK Inhibitors for the Treatment of Hypertrophic Cardiomyopathy in Patients With RASopathies (MEKinRAS) - Randomized Controlled Trial"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this study is to evaluate the effectiveness of trametinib treatment in
      patients with Hyperthropic cardiomyopathy and a genetic mutation in the RAS/MAPK
      pathway.
    explanation: >-
      The registered objective substantiates the experimental MEK-inhibition treatment
      curated in this entry and admits NS6 patients by molecular criteria; PARTIAL because
      enrolment spans the RASopathies and no NRAS-specific result exists.
discussions:
- discussion_id: ns6_oncogenic_codon_tumor_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do germline NRAS alleles at the classic oncogenic codons (Gly12, and by extension
    Gly13/Gln61) carry a quantitatively higher tumor risk than the non-hotspot NS6 alleles,
    and how large is that risk?
  rationale: >-
    The published NRAS RASopathy series are small (tens of individuals), and the tumor
    events reported in Gly12 carriers - a myeloproliferative disorder, an uncharacterized
    brain tumor, and an embryonal rhabdomyosarcoma - are individual observations. The
    codon-dependent risk pattern is asserted from case-level pattern recognition, not from
    a cohort with denominators, while a separate familial report finds JMML risk in
    NRAS-positive Noonan syndrome no different from Noonan syndrome generally. Getting this
    wrong in either direction has direct surveillance consequences.
  attaches_to:
  - pathophysiology#Oncogenic-Codon Germline Alleles and Tumor Predisposition
  evidence:
  - reference: PMID:31697451
    reference_title: "NRAS associated RASopathy and embryonal rhabdomyosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      analysis of previously reported NRAS-RASopathy cases suggests that mutations at
      traditionally oncogenic codons are associated with elevated cancer risk not present
      with mutations at other sites
    explanation: >-
      The codon-dependent risk claim is explicitly hedged as a suggestion from reanalysis
      of previously reported cases, which is the gap this discussion records.
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the risk for NS individuals with a germline NRAS mutation developing JMML is not
      different from the proportion seen in other NS cases
    explanation: >-
      Countervailing report finding no elevated JMML risk in NRAS-positive Noonan syndrome,
      which is why the tumor-risk question is recorded as open rather than settled.
  proposed_experiments:
  - experiment_id: ns6_genotype_stratified_tumor_incidence
    name: Genotype-stratified tumor-incidence study across an international NS6 registry
    description: >-
      Pool NRAS-positive Noonan syndrome individuals internationally, stratify by hotspot
      versus non-hotspot codon, and compute age-adjusted tumor incidence with explicit
      denominators and person-years of follow-up.
- discussion_id: ns6_animal_model_allele_strength
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the available NRAS animal models faithfully represent human NS6, given that both
    use alleles or dosages stronger than the typical human constitutional lesion?
  rationale: >-
    The mouse model uses the oncogenic G12D allele expressed pan-embryonically and is
    lethal by E15.5, so it cannot model the postnatal NS6 course; the zebrafish model uses
    transient mRNA overexpression of human mutants rather than an endogenous heterozygous
    locus. Both give a clear MAPK-dependent developmental phenotype, but the quantitative
    relationship between their signalling gain and that of a human NS6 heterozygote is
    unknown - which matters directly for interpreting the MEK-inhibitor rescue as a
    therapeutic rationale.
  attaches_to:
  - pathophysiology#Disrupted Embryonic Cardiac Development
  - pathophysiology#Disrupted Early Developmental Patterning
  evidence:
  - reference: PMID:33681212
    reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, oncogenic NrasG12D mutation may not be compatible with embryonic survival.
    explanation: >-
      The authors' own conclusion that the modelled allele is embryonic-lethal is precisely
      the translational mismatch with living human NS6 individuals that this discussion records.
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of N-Ras-I24N, N-Ras-G60E or the strongly activating mutant N-Ras-G12V,
      which we included as a positive control, results in developmental defects in
      zebrafish embryos
    explanation: >-
      The zebrafish readout comes from injected expression benchmarked against a strongly
      activating positive control, not from an endogenous heterozygous locus - the dosage
      mismatch this discussion records.
  proposed_experiments:
  - experiment_id: ns6_endogenous_knockin_mouse
    name: Endogenous-locus heterozygous knock-in of a human NS6 allele
    description: >-
      Generate mice carrying a heterozygous knock-in of a non-hotspot human NS6 allele
      (e.g. Nras G60E) at the endogenous locus, and assess viability, cardiac phenotype,
      growth and craniofacial morphology against the G12D model.
notes: >-
  Scope note: NS6 is a molecularly defined subtype of Noonan syndrome. Clinical features
  shared with the parent entity are curated here with GeneReviews (PMID:20301303) evidence
  marked PARTIAL, because those statements characterize Noonan syndrome as a whole rather
  than the NRAS subtype; NRAS-specific claims are cited to the primary NRAS literature. See
  the Noonan Syndrome entry for the full parent-disorder picture. Detailed NRAS-cohort
  phenotype frequencies published by Altmuller et al. (PMID:28594414) sit in the paywalled
  full text rather than the abstract, so they are not asserted here as evidence-backed
  frequency bands. The statement that hypertrophic cardiomyopathy is over-represented and
  pulmonic stenosis under-represented relative to mixed-genotype Noonan syndrome likewise
  rests on that full-text cohort table and is carried as descriptive prose only, never as a
  frequency band. Also deliberately absent: a `datasets:` block (dataset discovery for this
  entry returns only somatic NRAS-mutant cancer series reached by gene-only matching - the
  Named Entity Confusion trap, not germline NS6 data) and most of the trials surfaced for this
  disorder (the growth hormone studies NCT01529840, NCT00452725, NCT03435627, the
  Norditropin registry NCT05308927 and the vosoritide study NCT06668805 all enrol Noonan
  syndrome generally, with no NRAS subgroup, and belong on the umbrella entry). The one
  curated exception is NCT06555237 (MEKinRAS), which selects on a molecularly confirmed
  RAS-MAPK variant plus hypertrophic cardiomyopathy rather than on a clinical Noonan
  syndrome diagnosis, and so admits NS6 by genotype and substantiates this entry's own
  experimental trametinib treatment.

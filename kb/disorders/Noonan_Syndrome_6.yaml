notes: >-
  Scope note: NS6 is a molecularly defined subtype of Noonan syndrome. Clinical
  features shared with the parent entity are curated here with GeneReviews
  (PMID:20301303) evidence carrying directness: INDIRECT, because those statements
  characterize Noonan syndrome as a whole rather than the NRAS subtype and so reach
  NS6 through the parent entity; NRAS-specific claims are cited to the primary NRAS
  literature. See the Noonan Syndrome entry for the full parent-disorder picture.
  The refreshed full text of Altmuller et al. (PMID:28594414) supports the
  NRAS-specific frequencies recorded here. These are small, variably assessed
  case-series proportions, not population estimates; the extreme Glu37dup case with
  additional genetic/perinatal findings was excluded from aggregate statistics. Also
  deliberately absent: a `datasets:` block (dataset discovery for this entry returns
  only somatic NRAS-mutant cancer series reached by gene-only matching - the Named
  Entity Confusion trap, not germline NS6 data) and most of the trials surfaced for
  this disorder (the growth hormone studies NCT01529840, NCT00452725, NCT03435627,
  the Norditropin registry NCT05308927 and the vosoritide study NCT06668805 all
  enrol Noonan syndrome generally, with no NRAS subgroup, and belong on the umbrella
  entry). The one curated exception is NCT06555237 (MEKinRAS), which selects on a
  molecularly confirmed RAS-MAPK variant plus hypertrophic cardiomyopathy rather
  than on a clinical Noonan syndrome diagnosis, and so admits NS6 by genotype and
  substantiates this entry's own experimental trametinib treatment. The falcon
  report also lists 22q11.2-related disorders among the principal differentials, and
  they are deliberately not curated as a differential_diagnoses entry: the only
  sources found that pair 22q11.2 with the Noonan phenotype are a dual-diagnosis
  case report whose one usable sentence is its own title, and a passing mention that
  chromosomal microarray may detect a second diagnosis. Neither supports a
  standalone differential claim, and the karyotype/microarray discriminator the
  Turner syndrome entry already carries covers the same diagnostic step.

  - phenotypes#Strabismus
  - phenotypes#Short Neck
  - phenotypes#Pectus Carinatum
  - phenotypes#Pectus Excavatum
  - phenotypes#Patent Ductus Arteriosus
  - phenotypes#Multiple Lentigines
  - phenotypes#Cafe-au-lait Macules
  - phenotypes#Multiple Melanocytic Nevi
  - phenotypes#Macrocephaly
  - phenotypes#Keratosis Pilaris
  - phenotypes#Low Posterior Hairline
  evidence:
  - reference: PMID:21263000
    reference_title: Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of N-Ras-I24N led to a significant increase in the angle of the
      ceratohyal (P<0.05; Student’s t-test) (Fig. 4C,D) and hence we conclude that
      N-Ras-I24N expression induced craniofacial defects in zebrafish embryos that are
      reminiscent of the symptoms in individuals with Noonan syndrome.
    explanation: >-
      Ceratohyal-angle changes in a transient-expression zebrafish model support
      craniofacial widening; translation to human hypertelorism is provisional.
    directness: INDIRECT
  - reference: PMID:26467218
    reference_title: Mutation in NRAS in familial Noonan syndrome--case report and review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      She has two large Café-au-lait spots on her back and >50

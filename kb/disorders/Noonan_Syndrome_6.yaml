  - classification_value: CARDIOVASCULAR
    notes: >-
      Congenital heart disease and hypertrophic cardiomyopathy carry the dominant
      surveillance and management burden in this entry, which is why the cardiovascular
      Part is assigned alongside the genetic one.
    evidence:
    - reference: PMID:40176696
      reference_title: "RASopathies and Cardiac Complications: Insights into Mechanisms, Diagnosis, and Innovative Treatments."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        While extensively studied for their role in cancer, RAS gene mutations also
        contribute significantly to cardiovascular diseases, such as hypertrophic
        cardiomyopathy, pulmonary valve stenosis, and atrial septal defects.
      explanation: >-
        Establishes the cardiovascular lesion set that drives management in RAS-pathway
        disease. Graded INDIRECT because it is asserted across the RAS genes; the same
        review notes N-Ras is the least studied of them in cardiac cells, so the
        cardiovascular assignment here rests on the shared RASopathy lesion spectrum and
        on this entry's own cardiac phenotypes rather than on NRAS-specific cardiac data.
  mechanistic_category:
  - classification_value: RASopathy
    notes: >-
      NS6 is a germline RASopathy in the strict sense - the causal lesion is a
      gain-of-function variant in a canonical RAS GTPase itself, not in an upstream
      regulator or downstream kinase.
    evidence:
    - reference: PMID:40518121
      reference_title: "RASopathies. Part I: Genetics and therapeutic considerations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

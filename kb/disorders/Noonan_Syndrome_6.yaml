- name: Disrupted Early Developmental Patterning
  biological_scale: ORGANISM
  description: >-
    Noonan-associated activating N-Ras mutants are sufficient to derail early
    morphogenesis. In zebrafish, expression of the human NS-derived I24N and G60E mutants
    causes gastrulation defects phenocopying those of other Noonan syndrome genes,
    indicating that the germline lesion acts on early embryonic patterning rather than
    only on postnatal growth.
  biological_processes:
  - preferred_term: gastrulation
    term:
      id: GO:0007369
      label: gastrulation
    modifier: ABNORMAL
  downstream:
  - target: Noonan Facial Gestalt
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The NRAS-I24N zebrafish experiments document altered craniofacial cartilage as
      well as gastrulation defects. They support a provisional developmental
      contribution to the human gestalt, without establishing every facial component.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression of N-Ras-I24N led to a significant increase in the angle of the
        ceratohyal (P<0.05; Student’s t-test) (Fig. 4C,D) and hence we conclude that
        N-Ras-I24N expression induced craniofacial defects in zebrafish embryos that are
        reminiscent of the symptoms in individuals with Noonan syndrome.
      explanation: >-
        Ceratohyal-angle changes in a transient-expression zebrafish model support
        craniofacial widening; translation to human hypertelorism is provisional.

genetic:
- name: NRAS
  gene_term:
    preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  frequency: VERY_RARE
  notes: >-
    NRAS encodes the canonical small GTPase N-Ras. NS6 is caused by heterozygous germline
    missense gain-of-function variants; reported residues include Ile24, Thr50, Thr58,
    Gly60 and the classic somatic oncogenic codon Gly12. Cohort screens place NRAS at a
    very small share of molecularly solved Noonan syndrome (3/115 and 2/125 in two
    mutation-negative screening cohorts). ClinGen's RASopathy expert panel classifies the
    NRAS-Noonan syndrome relationship as Definitive with autosomal dominant inheritance.
    Constitutional status must be confirmed in non-hematopoietic tissue when an
    oncogenic-hotspot allele is found in blood during a myeloid-neoplasia workup.
  case_fractions:
  - population: >-
      Noonan syndrome probands negative for PTPN11, SOS1, RAF1 and KRAS
    case_fraction_percent: 2.6
    cohort_size: 115
    notes: 3 NRAS mutations identified in 3 of 115 previously mutation-negative probands.
    evidence:
    - reference: PMID:22855653
      reference_title: "NRAS Mutations in Noonan Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we performed mutation analysis of NRAS and SHOC2 in 115 PTPN11, SOS1, RAF1,
        and KRAS mutation-negative individuals. No SHOC2 mutations were found, but we
        identified 3 NRAS mutations in 3 probands.
      explanation: >-
        Gives the numerator and denominator for the NRAS share of this screening cohort.
  - population: >-
      French Noonan syndrome cohort negative for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1,
      BRAF and SHOC2
    case_fraction_percent: 1.6
    cohort_size: 125
    notes: The recurrent c.179G>A (p.G60E) allele found in 2 of 125 screened patients.
    evidence:
    - reference: PMID:22887781
      reference_title: "Constitutional NRAS mutations are rare among patients with Noonan syndrome or juvenile myelomonocytic leukemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report on the mutational analysis of NRAS in a cohort of 125 French patients
        with NS and no known mutation for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1, BRAF, and
        SHOC2. The c.179G>A (p.G60E) mutation was identified in two patients with typical
        NS, confirming that NRAS germline mutations are a rare cause of this syndrome.
      explanation: >-
        Gives the numerator and denominator for the NRAS share of this screening cohort.
  evidence:
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report that germline NRAS mutations conferring enhanced stimulus-dependent
      MAPK activation account for some cases of this disorder.
    explanation: >-
      The enhanced MAPK activation component of this claim derives from transfected-cell
      assays; human sequencing establishes the germline diagnosis.
  - reference: CGGV:assertion_34419b69-59c3-458b-a2a5-38a401679deb-2018-05-30T160000.000Z
    reference_title: "NRAS / Noonan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NRAS | HGNC:7989 | Noonan syndrome | MONDO:0018997 | AD | Definitive"
    explanation: >-
      ClinGen's RASopathy Gene Curation Expert Panel classifies the NRAS-Noonan syndrome
      relationship as Definitive with autosomal dominant inheritance.
  - reference: PMID:22855653
    reference_title: "NRAS Mutations in Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with germline NRAS mutations is variable. Our results
      confirm that a small proportion of Noonan syndrome patients carry germline NRAS
      mutations.
    explanation: >-
      Supports both the rarity of the NRAS subtype and its variable expressivity.
inheritance:
- name: Autosomal Dominant
  description: >-
    NS6 is inherited in an autosomal dominant manner. Many cases arise de novo, but
    familial transmission with cosegregation is documented, and parental mosaicism has been
    reported — so recurrence risk after an apparently de novo case is not necessarily zero.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The result revealed a recurrent mutation in NRAS, c.179G > A (p.G60E), in the index
      patient. This mutation was inherited from the index patient's father, who also showed
      signs of NS.
    explanation: >-
      Documents parent-to-child transmission of a heterozygous NRAS allele with affected
      status in both, consistent with autosomal dominant inheritance.
  - reference: CGGV:assertion_34419b69-59c3-458b-a2a5-38a401679deb-2018-05-30T160000.000Z
    reference_title: "NRAS / Noonan syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NRAS | HGNC:7989 | Noonan syndrome | MONDO:0018997 | AD | Definitive"
    explanation: ClinGen records autosomal dominant inheritance for the NRAS-Noonan relationship.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate exists for NS6 specifically. Only a few dozen
    molecularly confirmed individuals have been reported; the largest single series added
    19 cases. The Noonan syndrome birth prevalence of roughly 1 in 1,000-2,500 belongs to
    the parent entity and must not be assigned to this subtype.
  evidence:
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A small number of RASopathy cases with disease-causing germline NRAS alterations have
      been reported.
    explanation: >-
      States that only a small number of germline NRAS RASopathy cases exist in the
      literature.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe 19 new cases with RASopathy due to disease-causing variants in NRAS.
    explanation: Gives the size of the largest reported NRAS RASopathy series.
animal_models:
- name: Nras G12D pan-embryonic knock-in mouse (Mox2-Cre)
  species: Mouse
  genotype: NrasG12D/+ ; Mox2-Cre
  description: >-
    Conditional endogenous-locus activation of Nras throughout the embryo, producing
    cardiac malformations that mirror the congenital heart lesions of Noonan syndrome,
    with lethality from E15.5. Lineage-restricted crosses localize the requirement to the
    endothelial/endocardial compartment.
  publication: PMID:33681212
  evidence:
  - reference: PMID:33681212
    reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At E13.5, NrasG12D/ + ; Mox2Cre/ + embryos displayed a moderate expansion of
      hematopoietic stem and progenitor cells without a significant impact on erythroid
      differentiation in the fetal liver.
    explanation: >-
      First-party characterization of what this specific model does and does not show,
      which is what establishes its scope as an informative system here.
  modeled_mechanisms:
  - target: Disrupted Embryonic Cardiac Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Activated Nras in the developing embryo produces septal, outflow-tract, myocardial
      and pulmonary-valve lesions matching the human Noonan cardiac spectrum, together
      with ERK pathway dysregulation in the mutant heart.
    limitations: >-
      G12D is an oncogenic somatic hotspot allele that is stronger than most human NS6
      alleles, and pan-embryonic expression is lethal between E15.5 and E17.5 — so the
      model cannot address the postnatal course. Human NS6 individuals with Gly12
      alleles are reported but rare.
    readouts:
    - name: Cardiac morphology at E13.5-E15.5
      target: Disrupted Embryonic Cardiac Development
      direction: ALTERED
      interpretation: >-
        Structural cardiac malformations are the morphological correlate of the disrupted
        cardiac-development node.
      evidence:
      - reference: PMID:33681212
        reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Importantly, the mutant embryos exhibited cardiac malformations resembling human
          congenital cardiac defects seen in NS patients, including ventricular septal
          defects, double outlet right ventricle, the hypertrabeculation/thin myocardium,
          and pulmonary valve stenosis.
        explanation: Reports the histological/morphological cardiac measurement in this model.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that pan-embryonic expression of endogenous NrasG12D/ + by Mox2-Cre
        in mice caused embryonic lethality from embryonic day (E) 15.5 and developmental
        defects predominantly in the heart.
      explanation: >-
        Supports treating this model as informative for the cardiac-development node.
- name: Zebrafish N-Ras I24N / G60E overexpression embryo
  species: Zebrafish
  genotype: mRNA expression of human NRAS I24N or G60E
  description: >-
    Expression of Noonan-derived activating N-Ras mutants in zebrafish embryos produces
    gastrulation defects phenocopying those of other Noonan syndrome genes; MEK inhibition
    fully rescues them.
  publication: PMID:21263000
  evidence:
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The defects in zebrafish embryos are reminiscent of symptoms in individuals with
      Noonan syndrome and phenocopy the defects that other Noonan-syndrome-associated genes
      induce in zebrafish embryos.
    explanation: >-
      Supports treating this zebrafish system as an informative model of Noonan syndrome,
      benchmarked against other Noonan genes in the same assay.
  modeled_mechanisms:
  - target: Disrupted Early Developmental Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that the human NS6 alleles are sufficient to derail early embryonic
      patterning, and that the effect is MAPK-dependent.
    limitations: >-
      Transient mRNA overexpression rather than an endogenous heterozygous knock-in, so
      dosage exceeds the human constitutional state; gastrulation defects are a zebrafish
      developmental readout, not a human NS6 clinical feature.
    readouts:
    - name: MEK-inhibitor rescue of gastrulation phenotype
      target: Disrupted Early Developmental Patterning
      direction: RESTORED
      interpretation: >-
        Complete rescue by MEK inhibition establishes that the patterning defect is
        mediated by the RAS-MAPK cascade.
      evidence:
      - reference: PMID:21263000
        reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          MEK inhibition completely rescued the activated N-Ras-induced phenotypes,
          demonstrating that these defects are mediated exclusively by Ras-MAPK signaling.
        explanation: Reports the rescue measurement behind this readout.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, mutations in NRAS from individuals with Noonan syndrome activated
        N-Ras signaling and induced developmental defects in zebrafish embryos, indicating
        that activating mutations in NRAS cause Noonan syndrome.
      explanation: >-
        Supports treating this model as informative for the early-patterning node.
diagnosis:
- name: Molecular genetic testing of a RASopathy gene panel
  description: >-
    NS6 is a molecularly defined entity, so the diagnosis rests on identifying a
    heterozygous pathogenic NRAS variant in an individual with suggestive clinical
    findings. NRAS is one of the genes on the standard Noonan syndrome diagnostic panel;
    because NS6 is clinically indistinguishable from other Noonan subtypes, panel or
    exome testing rather than single-gene testing is the practical route.
  diagnosis_term:
    preferred_term: RASopathy gene-panel molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  notes: >-
    The NCIT term is generic; the preferred term records that diagnostic confirmation for
    this entry is detection of a pathogenic NRAS variant on a Noonan/RASopathy panel.
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Noonan is established in a proband with suggestive findings and a
      heterozygous pathogenic variant in BRAF, KRAS, MAP2K1, MRAS, NRAS, PTPN11, RAF1,
      RASA2, RIT1, RRAS2, SOS1, or SOS2 or either a heterozygous variant or biallelic
      pathogenic variants in LZTR1 identified by molecular genetic testing.
    explanation: >-
      GeneReviews names NRAS explicitly among the genes whose heterozygous pathogenic
      variants establish the diagnosis, which is what defines this entry's entity - so
      unlike the parent-entity clinical statements elsewhere in this file, this one is
      directly on point for NS6.
- name: Confirmation of constitutional (germline) origin in non-hematopoietic tissue
  description: >-
    Codons 12, 13 and 61 of NRAS are classic somatic hotspots in myeloid neoplasia, so an
    NRAS variant found in blood during a leukemia or myeloproliferative-disease workup does
    not by itself establish NS6. Constitutional status should be confirmed in a
    non-hematopoietic specimen (fibroblasts, buccal epithelium, nail, urine or saliva).
  diagnosis_term:
    preferred_term: germline confirmation testing on a non-hematopoietic specimen
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22887781
    reference_title: "Constitutional NRAS mutations are rare among patients with Noonan syndrome or juvenile myelomonocytic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the 11 JMML patients for which germline DNA was available had a
      constitutional NRAS mutation.
    explanation: >-
      Demonstrates empirically that NRAS variants in myeloid disease are typically somatic
      rather than constitutional, which is why germline confirmation is a distinct
      diagnostic step for this entry.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the observed germline variants differed from the typical oncogenic NRAS changes
      occurring as somatic events in tumours
    explanation: >-
      Frames the germline-versus-somatic distinction this diagnostic step addresses. The
      same report goes on to show the distinction is not absolute (four germline Gly12
      carriers).
- name: Baseline cardiac evaluation
  description: >-
    Echocardiographic assessment at diagnosis, with continued surveillance, because
    congenital heart disease is present in most affected individuals and hypertrophic
    cardiomyopathy may appear after infancy.
  diagnosis_term:
    preferred_term: echocardiographic evaluation
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:20301303
    reference_title: "Noonan Syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In children age <5 years: if initial cardiac evaluation is normal, at least annual
      cardiac evaluations until age 5 years.
    explanation: >-
      GeneReviews surveillance guidance underpinning baseline and repeat cardiac
      assessment. Graded INDIRECT because it is written for the parent entity.
differential_diagnoses:
- name: >-
    Somatic NRAS-mutant myeloid neoplasia
  description: >-
    The NRAS codons mutated in NS6 - Gly12 above all - are the same codons mutated somatically in juvenile myelomonocytic leukemia and related myeloid neoplasms, so an NRAS variant found in blood or bone marrow does not by itself distinguish a constitutional RASopathy from an acquired clonal lesion. The distinction is made by demonstrating the variant in a non-hematopoietic tissue, and it is not academic: the germline-versus-somatic call carries different prognosis and different management. NS6 is additionally the entity in which the two can coexist, because a germline oncogenic-codon allele is itself a myeloid tumor-predisposing state.
  disease_term:
    preferred_term: juvenile myelomonocytic leukemia
    term:
      id: MONDO:0011908
      label: juvenile myelomonocytic leukemia
  distinguishing_features:
  - Demonstration of the NRAS variant in a non-hematopoietic tissue (skin fibroblasts, buccal cells) establishes constitutional origin and favors NS6.
  - Extra-hematopoietic Noonan features - characteristic facies, congenital heart disease, short stature - favor NS6 over an isolated somatic myeloid lesion.
  evidence:
  - reference: PMID:42193013
    reference_title: "Molecular Advances in Juvenile Myelomonocytic Leukemia and Associated RASopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The distinction between germline and somatic mutations profoundly influences
      prognosis
    explanation: >-
      Establishes that separating a constitutional RASopathy allele from an acquired
      myeloid one changes prognosis, which is why this differential is a management
      question and not just a labelling one. Graded INDIRECT because the statement is
      made across the RAS-pathway JMML genes rather than for NRAS specifically.
- name: >-
    Other molecularly defined Noonan syndrome subtypes
  description: >-
    NS6 is delimited by its gene, not by its clinical picture, which sits inside the shared Noonan phenotype. PTPN11, SOS1, RAF1, RIT1, KRAS, SOS2, LZTR1, BRAF, SHOC2, CBL and PPP1CB variants all produce an overlapping presentation, and PTPN11 alone accounts for a much larger share of Noonan syndrome than NRAS. Discrimination is molecular: a RASopathy gene panel, not the phenotype, assigns the subtype.
  disease_term:
    preferred_term: Noonan syndrome
    term:
      id: MONDO:0018997
      label: Noonan syndrome
  distinguishing_features:
  - Only a pathogenic NRAS variant assigns NS6; the clinical phenotype does not separate it from the other Noonan subtypes.
  - NRAS is among the rarest Noonan genes, so a Noonan phenotype is far more likely to carry a PTPN11 variant on prior probability alone.
  evidence:
  - reference: PMID:41988663
    reference_title: "Clinical and Genetic Characterization of Noonan Syndrome in a Colombian Pediatric Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic variants were identified across 13 genes, with PTPN11 being the most
      frequent (26/45, 57.8%), followed by PPP1CB and several less frequent genes
      including SOS1, SOS2, LZTR1, RAF1, MAP2K1, KRAS, NRAS, BRAF, CBL, NF1, and SHOC2
    explanation: >-
      A consecutive molecularly confirmed Noonan cohort in which NRAS is one of thirteen
      causal genes and PTPN11 dominates, which is the prior-probability point this
      differential rests on.
  - reference: PMID:41496802
    reference_title: "Molecular and Clinical Profiles of Patients with RASopathies: Targeted Next-Generation Sequencing Panel Results and Identification of 14 Novel Disease-Causing Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional variants, likely to represent clinically significant findings, were
      identified in PTPN11 (n = 11), RAF1 (n = 4), SOS1 (n = 3), RIT1 (n = 3), KRAS
      (n = 1), NRAS (n = 1), SOS2 (n = 1), and BRAF (n = 1).
    explanation: >-
      A referred RASopathy series in which a single NRAS case sits among the other Noonan
      genes, quantifying how rarely NRAS is the answer.
- name: >-
    Costello syndrome and other germline RASopathies
  description: >-
    Costello syndrome (HRAS) is the nearest neighbour conceptually, since it is the other RASopathy caused by a germline variant in a canonical RAS GTPase, and it shares the craniofacial, cardiac, growth and tumor-predisposition axes with NS6. Cardiofaciocutaneous syndrome, Noonan syndrome with multiple lentigines, Legius syndrome and neurofibromatosis type 1 complete the germline RASopathy differential. These are separated by their distinctive cutaneous findings and by gene, not by the shared RAS-MAPK phenotype.
  disease_term:
    preferred_term: Costello syndrome
    term:
      id: MONDO:0009026
      label: Costello syndrome
  distinguishing_features:
  - Costello syndrome carries deep palmar/plantar creases, papillomata and a characteristic solid-tumor risk profile not typical of NS6.
  - Cutaneous findings (lentigines, keratosis pilaris, cafe-au-lait macules) discriminate several germline RASopathies clinically before genotyping.
  evidence:
  - reference: PMID:40518121
    reference_title: "RASopathies. Part I: Genetics and therapeutic considerations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The germline RASopathies include neurofibromatosis type 1 (not discussed in detail
      in this review), Noonan syndrome, Noonan syndrome with multiple lentigines, Legius
      syndrome, capillary malformation-arteriovenous malformation syndrome, Costello
      syndrome, and cardiofaciocutaneous syndrome.
    explanation: >-
      Enumerates the germline RASopathy set that NS6 must be distinguished from. Graded
      INDIRECT because it defines the differential group at the RASopathy level rather
      than naming NRAS.
  - reference: PMID:40532825
    reference_title: "RASopathies. Part II: Cutaneous and extracutaneous manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Many RASopathies can be clinically diagnosed based on their cutaneous findings, thus
      it is essential for dermatologists to be comfortable differentiating RASopathies for
      accurate diagnosis and appropriate management.
    explanation: >-
      Supports the cutaneous axis as the clinical discriminator within this differential
      group. Graded INDIRECT for the same reason as above.
- name: >-
    1p13.2 microdeletion (NRAS haploinsufficiency)
  notes: >-
    Deliberately carries no disease_term. MONDO was searched for a 1p13.2 deletion concept and has none - the nearest hit is MONDO:0014825 chromosome 11p13 deletion syndrome, distal, which is a different locus. Per the term contract, no term beats a wrong one.
  description: >-
    Contiguous-gene deletions at 1p13.2 that remove NRAS produce a phenotype overlapping Noonan syndrome, and are not NS6. The distinction matters because the two are mechanistically opposite: NS6 is caused by a gain-of-function missense allele, whereas the deletion leaves one functional copy. A sequencing-only workflow that finds no pathogenic NRAS variant will miss the deletion, so copy-number analysis is the test that separates them.
  distinguishing_features:
  - A 1p13.2 copy-number loss with no pathogenic NRAS sequence variant identifies the deletion rather than NS6.
  - Deletion cases carry the phenotypes of the other genes in the deleted segment, so features outside the Noonan spectrum point away from NS6.
  evidence:
  - reference: PMID:27561113
    reference_title: "1p13.2 deletion displays clinical features overlapping Noonan syndrome, likely related to NRAS gene haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Retrospective analysis of other nine reported patients with 1p13.2 microdeletions
      showed that six of them also presented some characteristics of NS.
    explanation: >-
      Establishes that 1p13.2 microdeletion recurrently presents with Noonan features, which
      is what makes it a differential for a molecularly unconfirmed Noonan phenotype.
  - reference: PMID:27561113
    reference_title: "1p13.2 deletion displays clinical features overlapping Noonan syndrome, likely related to NRAS gene haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all these cases, the deleted segment included the NRAS gene.
    explanation: >-
      Identifies NRAS as the deleted gene common to the overlapping cases, which is why this
      differential sits specifically against NS6 rather than against Noonan syndrome generally.
- name: >-
    Turner syndrome
  description: >-
    The classic non-RASopathy mimic, and the one differential here that is not a RAS-MAPK disorder at all. Turner syndrome shares the features that make the Noonan phenotype recognizable - short stature, webbed neck, lymphedema and congenital heart disease - so the resemblance is with the clinical gestalt rather than with the mechanism. The two are separated by karyotype or chromosomal microarray, not by a RASopathy gene panel, which is why a sequencing-first workflow can miss it: a panel that finds no pathogenic RASopathy variant does not exclude Turner syndrome, because it was never testing for it. Historical usage reflected the overlap, Noonan syndrome having once been described in Turner-like terms before its genetic basis was known.
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  distinguishing_features:
  - Karyotype or chromosomal microarray showing 45,X or a structural X anomaly identifies Turner syndrome; NS6 has a normal karyotype.
  - Turner syndrome affects phenotypic females; NS6 is autosomal dominant and affects both sexes.
  - Left-sided obstructive lesions (bicuspid aortic valve, coarctation) typify Turner syndrome, whereas the Noonan spectrum is weighted toward pulmonic stenosis and hypertrophic cardiomyopathy.
  evidence:
  - reference: PMID:34858328
    reference_title: "GH Responsiveness in Children With Noonan Syndrome Compared to Turner Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Despite different genetic background, Noonan syndrome (NS) shares similar phenotype
      features to Turner syndrome (TS) such as short stature, webbed neck and congenital
      heart defects.
    explanation: >-
      States the phenotypic overlap that makes Turner syndrome a differential, and states
      explicitly that the genetic basis differs, which is what the karyotype discriminator
      rests on. Graded INDIRECT because it characterizes Noonan syndrome as a whole rather
      than the NRAS-defined subtype, reaching NS6 through the parent entity in the same way
      as the other parent-level statements in this entry.
treatments:
- name: Recombinant Growth Hormone (Somatropin) Therapy
  description: >-
    Growth hormone can increase growth velocity in Noonan syndrome. One p.G60E woman
    with partial GH deficiency had an excellent childhood response and reached 164.5
    cm; this single case does not establish average NS6 efficacy or long-term safety.

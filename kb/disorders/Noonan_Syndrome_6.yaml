- name: Coagulation Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Coagulation-factor or platelet abnormalities can produce bleeding in Noonan
    syndrome. In the NRAS series, von Willebrand disease was confirmed in one of the
    three individuals with bleeding; the other two had no defined coagulopathy. This
    node represents a contributing mechanism, without assuming that NRAS directly
    caused von Willebrand disease.
  evidence:
  - reference: PMID:23312968
    reference_title: Noonan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although infants with Noonan syndrome are predisposed to several haematological
      abnormalities, including transient monocytosis, thrombocytopenia, and
      myeloproliferative disorder,26 the most common haematologic disorders are
      abnormalities of bleeding caused by coagulation defects.
    explanation: >-
      Noonan-wide causal relationship between hemostatic defects and bleeding; the NRAS
      cohort identifies a confirmed coagulopathy in only one individual.
    directness: INDIRECT
  downstream:
  - target: Bleeding Diathesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A documented coagulopathy contributes to bleeding in a subset; causal attribution
      of the coagulopathy to NRAS itself remains uncertain.

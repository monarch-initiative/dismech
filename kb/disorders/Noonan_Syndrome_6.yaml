pathophysiology:
- name: NRAS Germline Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline variants in NRAS - predominantly missense substitutions
    (reported at Ile24, Thr50, Thr58, Gly60 and, less commonly, the classic oncogenic codon
    Gly12), with at least one reported in-frame duplication affecting the switch I region -
    alter conserved residues of the N-Ras GTPase. The substitutions shift the GTPase toward its active
    GTP-bound conformation — by perturbing switch-region nucleotide-exchange kinetics or,
    for Gly12 changes, by impairing intrinsic hydrolysis and GAP responsiveness — so that
    N-Ras signals more strongly in response to upstream stimulation. Constitutional origin
    must be established in non-hematopoietic tissue, because the same codons are somatic
    hotspots in myeloid neoplasia.
  genes:
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  molecular_functions:
  - preferred_term: N-Ras intrinsic GTP hydrolysis
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
    description: >-
      DECREASED describes the Gly12 alleles specifically, which impair intrinsic hydrolysis
      and GAP responsiveness. The non-hotspot NS6 alleles (Ile24, Thr50, Thr58, Gly60) act
      predominantly by enhancing stimulus-dependent nucleotide exchange rather than by
      losing hydrolytic activity; the shared consequence in both cases is more GTP-bound
      N-Ras, captured on the signalling term below.
  biological_processes:
  - preferred_term: positive regulation of Ras protein signal transduction
    term:
      id: GO:0046579
      label: positive regulation of Ras protein signal transduction
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: RAS-MAPK Cascade Hyperactivation
    causal_link_type: DIRECT
    description: >-
      The activated N-Ras GTPase increases signal throughput into the RAF-MEK-ERK cascade.
    evidence:
    - reference: PMID:19966803
      reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here we report that germline NRAS mutations conferring enhanced stimulus-dependent
        MAPK activation account for some cases of this disorder.
      explanation: >-
        Directly links the germline NRAS lesion to enhanced MAPK pathway activation as the
        proximate mechanism of this Noonan syndrome subtype.
  - target: Oncogenic-Codon Germline Alleles and Tumor Predisposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      When the germline allele occupies a classic somatic oncogenic codon, the same lesion
      additionally establishes a tumor-predisposing state; this branch is allele-dependent
      rather than a consequence of every NS6 genotype.
    evidence:
    - reference: PMID:31697451
      reference_title: "NRAS associated RASopathy and embryonal rhabdomyosarcoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        analysis of previously reported NRAS-RASopathy cases suggests that mutations at
        traditionally oncogenic codons are associated with elevated cancer risk not present
        with mutations at other sites
      explanation: >-
        Makes the allele-dependent link between the germline NRAS lesion and tumor risk that
        this edge encodes.
  evidence:
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide evidence for an obligate dependency on proper NRAS function in
      human development and growth.
    explanation: >-
      Establishes that constitutional perturbation of NRAS function is the causal lesion in
      this developmental disorder.
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a mutation in NRAS, resulting in an I24N amino acid substitution, that
      we identified in an individual bearing typical Noonan syndrome features.
    explanation: >-
      First-party identification of a germline NRAS substitution in an individual with
      typical Noonan syndrome features, extending the allelic spectrum of this subtype.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Importantly, four of them harbored missense changes affecting Gly12, which was
      previously described to occur exclusively in cancer.
    explanation: >-
      Documents that germline NS6 alleles extend to the classic somatic oncogenic codon
      Gly12, contradicting the earlier "restricted spectrum" model.
- name: RAS-MAPK Cascade Hyperactivation
  biological_scale: CELLULAR
  description: >-
    The activated N-Ras protein drives excessive signalling through the RAF-MEK-ERK
    (MAPK) cascade — the shared final common mechanism of the RASopathies. Enhanced ERK
    output during embryonic and postnatal development perturbs proliferation,
    differentiation and survival across multiple lineages, producing the multisystem
    Noonan phenotype.
  biological_processes:
  - preferred_term: positive regulation of MAPK cascade
    term:
      id: GO:0043410
      label: positive regulation of MAPK cascade
    modifier: INCREASED
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  downstream:
  - target: Disrupted Embryonic Cardiac Development
    causal_link_type: DIRECT
    description: >-
      Excess RAS-MAPK signalling in the developing heart disrupts cardiac morphogenesis.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutant heart showed dysregulation of ERK, BMP, and Wnt pathways, crucial
        signaling pathways for cardiac development.
      explanation: >-
        Shows that activated Nras dysregulates ERK signalling in the developing heart of a
        model organism, linking the pathway node to the cardiac developmental node.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Constitutive dysregulation of RAS-MAPK signalling underlies the reduced growth of the
      disorder.
    evidence:
    - reference: PMID:19966803
      reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These findings provide evidence for an obligate dependency on proper NRAS function in
        human development and growth.
      explanation: >-
        Ties proper NRAS function - and therefore its pathway output - to human growth;
        PARTIAL because the sentence asserts the dependency without dissecting the
        growth-restriction mechanism.
  - target: Noonan Facial Gestalt
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The characteristic craniofacial appearance emerges from RAS-MAPK dysregulation during
      development, as it does across the RASopathies.
    evidence:
    - reference: PMID:23875798
      reference_title: "The RASopathies."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Because of the common underlying Ras/MAPK pathway dysregulation, the RASopathies
        exhibit numerous overlapping phenotypic features.
      explanation: >-
        Attributes the shared RASopathy phenotypic features, of which the facial gestalt is
        the most recognizable, to common pathway dysregulation; PARTIAL because it is a
        review-level statement about the RASopathies collectively.
  - target: Disrupted Early Developmental Patterning
    causal_link_type: DIRECT
    description: >-
      Activated N-Ras signalling perturbs early embryonic morphogenetic movements; MEK
      inhibition fully reverses the effect, establishing that the defect is MAPK-mediated.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MEK inhibition completely rescued the activated N-Ras-induced phenotypes,
        demonstrating that these defects are mediated exclusively by Ras-MAPK signaling.
      explanation: >-
        Pharmacological epistasis showing the developmental defects caused by
        Noonan-associated N-Ras mutants run through the RAS-MAPK cascade.
  evidence:
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The I24N mutation activates N-Ras, resulting in enhanced downstream signaling.
    explanation: >-
      Functional demonstration that a Noonan-associated germline NRAS substitution
      activates the protein and increases downstream signalling.
  - reference: PMID:23875798
    reference_title: "The RASopathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is not surprising that Ras/MAPK pathway dysregulation has profound
      deleterious effects on both embryonic and later stages of development.
    explanation: >-
      Review-level support for the shared RASopathy mechanism into which NS6 falls;
      partial because it addresses the RASopathies collectively rather than NRAS
      specifically.
- name: Disrupted Embryonic Cardiac Development
  biological_scale: TISSUE
  description: >-
    Excess RAS-MAPK signalling during cardiac morphogenesis produces the structural and
    hypertrophic heart disease of NS6. Lineage-restricted mouse experiments localize the
    requirement to the endothelial/endocardial compartment rather than the myocardium.
  cell_types:
  - preferred_term: endocardial cell
    term:
      id: CL:0002350
      label: endocardial cell
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: ABNORMAL
  downstream:
  - target: Congenital Heart Disease
    causal_link_type: DIRECT
    description: >-
      Disturbed cardiac morphogenesis yields the septal, valvar and myocardial lesions
      seen clinically.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, the mutant embryos exhibited cardiac malformations resembling human
        congenital cardiac defects seen in NS patients, including ventricular septal
        defects, double outlet right ventricle, the hypertrabeculation/thin myocardium, and
        pulmonary valve stenosis.
      explanation: >-
        Connects activated Nras-driven cardiac maldevelopment to the congenital heart
        lesions of Noonan syndrome.
  - target: Pulmonic Stenosis
    causal_link_type: DIRECT
    description: >-
      Disturbed valvar morphogenesis in the outflow tract yields pulmonary valve stenosis,
      the commonest Noonan syndrome heart lesion.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, the mutant embryos exhibited cardiac malformations resembling human
        congenital cardiac defects seen in NS patients, including ventricular septal
        defects, double outlet right ventricle, the hypertrabeculation/thin myocardium, and
        pulmonary valve stenosis.
      explanation: >-
        Activated-Nras cardiac maldevelopment produces pulmonary valve stenosis in vivo;
        PARTIAL because the demonstration is model-organism rather than human NS6 evidence.
  - target: Septal Defects
    causal_link_type: DIRECT
    description: >-
      Failure of septation during cardiac morphogenesis yields the atrial and ventricular
      septal defects seen clinically.
    evidence:
    - reference: PMID:33681212
      reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, the mutant embryos exhibited cardiac malformations resembling human
        congenital cardiac defects seen in NS patients, including ventricular septal
        defects, double outlet right ventricle, the hypertrabeculation/thin myocardium, and
        pulmonary valve stenosis.
      explanation: >-
        Activated-Nras cardiac maldevelopment produces ventricular septal defects in vivo;
        PARTIAL because the demonstration is model-organism rather than human NS6 evidence.
  evidence:
  - reference: PMID:33681212
    reference_title: "Embryonic Expression of Nras(G 12 D) Leads to Embryonic Lethality and Cardiac Defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Endothelial/endocardial-specific expression of NrasG12D/ + caused the cardiac
      morphological defects and embryonic lethality as observed in NrasG12D/ + ; Mox2Cre/ +
      mutants, but myocardial-specific expression of NrasG12D/ + did not.
    explanation: >-
      Localizes the cardiac requirement for activated N-Ras to the endocardial/endothelial
      compartment, not the myocardium.
- name: Disrupted Early Developmental Patterning
  biological_scale: ORGANISM
  description: >-
    Noonan-associated activating N-Ras mutants are sufficient to derail early
    morphogenesis. In zebrafish, expression of the human NS-derived I24N and G60E mutants
    causes gastrulation defects phenocopying those of other Noonan syndrome genes,
    indicating that the germline lesion acts on early embryonic patterning rather than
    only on postnatal growth.
  biological_processes:
  - preferred_term: gastrulation
    term:
      id: GO:0007369
      label: gastrulation
    modifier: ABNORMAL
  downstream:
  - target: Noonan Facial Gestalt
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Derailed early morphogenesis is the developmental route by which the craniofacial
      dysmorphism arises; in vivo, the activating N-Ras mutants produce embryonic defects
      that resemble the human syndrome and phenocopy those of the other Noonan syndrome
      genes.
    evidence:
    - reference: PMID:21263000
      reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The defects in zebrafish embryos are reminiscent of symptoms in individuals with
        Noonan syndrome and phenocopy the defects that other Noonan-syndrome-associated
        genes induce in zebrafish embryos.
      explanation: >-
        Links the early-patterning defect to the Noonan syndrome phenotype in vivo; PARTIAL
        because the resemblance is asserted for the syndrome's embryonic defects as a whole
        and not specifically for the human facial gestalt this edge targets.
  evidence:
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of N-Ras-I24N, N-Ras-G60E or the strongly activating mutant N-Ras-G12V,
      which we included as a positive control, results in developmental defects in
      zebrafish embryos, demonstrating that these activating N-Ras mutants are sufficient
      to induce developmental disorders.
    explanation: >-
      Establishes sufficiency of the Noonan-associated N-Ras mutants to cause early
      developmental defects in vivo.
- name: Oncogenic-Codon Germline Alleles and Tumor Predisposition
  biological_scale: ORGANISM
  description: >-
    A subset of NS6 alleles occupies the codons that are classic somatic drivers in cancer
    (notably Gly12). Individuals carrying these alleles have been reported with
    myeloproliferative disease, an uncharacterized brain tumor, and embryonal
    rhabdomyosarcoma, and the available case series suggest that hotspot-codon germline
    alleles carry higher tumor risk than the non-hotspot NS6 alleles. Numbers are small,
    so this is a genotype-associated risk signal rather than a quantified risk estimate;
    the JMML risk in NRAS-positive Noonan syndrome overall does not appear elevated above
    that of Noonan syndrome generally.
  genes:
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  downstream:
  - target: Embryonal Rhabdomyosarcoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A germline p.G12R allele was reported in an individual who developed embryonal
      rhabdomyosarcoma.
    evidence:
    - reference: PMID:31697451
      reference_title: "NRAS associated RASopathy and embryonal rhabdomyosarcoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We present the case of a germline heterozygous NRAS mutation producing a severe
        phenotype involving embryonal rhabdomyosarcoma, severe intellectual disability, and
        numerous melanocytic nevi in addition to more typical manifestations of Noonan
        syndrome.
      explanation: >-
        The single reported instance linking a germline oncogenic-codon NRAS allele to
        embryonal rhabdomyosarcoma.
  - target: Myeloproliferative Disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A germline p.(Gly12Asp) carrier in the largest NRAS cohort had a myeloproliferative
      disorder.
    evidence:
    - reference: PMID:28594414
      reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Further, one of the patients (c.35G>A; p.(Gly12Asp)) had a myeloproliferative
        disorder, and one subject (c.34G>C; p.(Gly12Arg)) exhibited an uncharacterized brain
        tumour.
      explanation: >-
        Reports the myeloproliferative event in a germline oncogenic-codon carrier.
  - target: Brain Neoplasm
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A germline p.(Gly12Arg) carrier in the same cohort had an uncharacterized brain tumor.
    evidence:
    - reference: PMID:28594414
      reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        one subject (c.34G>C; p.(Gly12Arg)) exhibited an uncharacterized brain tumour
      explanation: >-
        Reports the brain tumor in a germline oncogenic-codon carrier.
  evidence:
  - reference: PMID:31697451
    reference_title: "NRAS associated RASopathy and embryonal rhabdomyosarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the specific p.G12R NRAS mutation in this case is a common somatic
      mutation in cancer cells, and analysis of previously reported NRAS-RASopathy cases
      suggests that mutations at traditionally oncogenic codons are associated with
      elevated cancer risk not present with mutations at other sites.
    explanation: >-
      States the codon-dependent tumor-risk pattern that motivates this node.
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further, one of the patients (c.35G>A; p.(Gly12Asp)) had a myeloproliferative
      disorder, and one subject (c.34G>C; p.(Gly12Arg)) exhibited an uncharacterized brain
      tumour.
    explanation: >-
      Reports the neoplastic events observed in Gly12 germline carriers in the largest
      NRAS RASopathy cohort.
  - reference: PMID:26467218
    reference_title: "Mutation in NRAS in familial Noonan syndrome--case report and review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither of affected individuals in this family presented with juvenile myelomonocytic
      leukemia (JMML), which together with previously published results suggest that the
      risk for NS individuals with a germline NRAS mutation developing JMML is not
      different from the proportion seen in other NS cases.
    explanation: >-
      Counterweight to a blanket high-risk reading: JMML risk in NRAS-positive Noonan
      syndrome is not reported as elevated above Noonan syndrome generally.
phenotypes:
- category: Craniofacial
  name: Noonan Facial Gestalt
  description: >-
    The characteristic RASopathy face — hypertelorism, downslanting palpebral fissures,
    ptosis, and low-set posteriorly rotated ears — evolving with age. It is the feature
    that identifies affected individuals clinically as having Noonan syndrome before
    molecular testing.
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:28594414
    reference_title: "Genotype and phenotype spectrum of NRAS germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals exhibited features fitting Noonan syndrome, and the observed
      germline variants differed from the typical oncogenic NRAS changes occurring as
      somatic events in tumours.
    explanation: >-
      Establishes that individuals with germline NRAS variants present with the Noonan
      syndrome clinical gestalt.
  - reference: PMID:19966803
    reference_title: "A restricted spectrum of NRAS mutations causes Noonan syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Noonan syndrome, a developmental disorder characterized by congenital heart defects,
      reduced growth, facial dysmorphism and variable cognitive deficits, is caused by
      constitutional dysregulation of the RAS-MAPK signaling pathway.
    explanation: >-
      Facial dysmorphism is named as a defining feature of the disorder in the paper that
      established NRAS as a cause - but this sentence is the
      paper's background definition of Noonan syndrome as a whole rather than a finding
      about its NRAS cohort, so it is marked PARTIAL on the same basis as the GeneReviews
      parent-entity statements elsewhere in this entry.

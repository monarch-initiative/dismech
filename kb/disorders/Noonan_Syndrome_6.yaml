      explanation: The review summarizes RAS/MAPK-associated mouse models, not an NRAS-specific lymphatic experiment.
      directness: INDIRECT
  - target: Atrial Septal Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Provisional application of the broader RASopathy mechanism: disrupted Ras signaling alters septal formation. This is not inferred from the NrasG12D mouse ventricular defect, and the NRAS-specific atrial lineage mechanism remains unresolved.
    evidence:
    - reference: PMID:40176696
      reference_title: 'RASopathies and Cardiac Complications: Insights into Mechanisms, Diagnosis, and Innovative Treatments.'
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        In PVS and ASD, disrupted Ras signaling impairs normal valvular and septal formation, contributing to structural heart defects.
      explanation: >-
        Review-level causal synthesis across RASopathies, applied indirectly to the atrial septal defect documented in the human NRAS cohort.
  evidence:
  - reference: PMID:21263000
    reference_title: "Noonan syndrome gain-of-function mutations in NRAS cause zebrafish gastrulation defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The I24N mutation activates N-Ras, resulting in enhanced downstream signaling.
    explanation: >-
      Functional demonstration that a Noonan-associated germline NRAS substitution
      activates the protein and increases downstream signalling.
  - reference: PMID:23875798
    reference_title: "The RASopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is not surprising that Ras/MAPK pathway dysregulation has profound
      deleterious effects on both embryonic and later stages of development.
    explanation: >-
      Review-level support for the shared RASopathy mechanism into which NS6 falls;

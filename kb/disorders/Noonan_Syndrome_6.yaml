    evidence:
    - reference: PMID:19966803
      reference_title: A restricted spectrum of NRAS mutations causes Noonan syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Noonan syndrome, a developmental disorder characterized by congenital heart

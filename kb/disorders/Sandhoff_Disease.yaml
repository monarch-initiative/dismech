- phase: Chronic progressive course
  subtype: Adult Sandhoff disease
  age_range: Older teen years or young adulthood
  duration: Multi-decade disease evolution; life expectancy not necessarily decreased
  notes: >-
    Late-onset Sandhoff disease begins in the older teen years or young
    adulthood after nearly normal psychomotor development and progresses with
    weakness, spasticity, dysarthria, cerebellar dysfunction, and executive
    function and memory deficits, without necessarily decreasing life
    expectancy. In a pooled adult GM2 gangliosidosis natural history cohort
    combining Tay-Sachs and Sandhoff patients, psychosis and/or severe mood
    disorder occurred only in the Tay-Sachs patients, whereas long-term
    functional prognosis across the combined cohort was mainly driven by gait
    disorder, with half of patients using a wheelchair beyond 20 years of
    disease evolution.
  evidence:
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Late-onset Sandhoff disease (onset older teen years or young adulthood).
      Nearly normal psychomotor development is followed by a range of neurologic
      findings (e.g., weakness, spasticity, dysarthria, and deficits in
      cerebellar function) and psychiatric findings (e.g., deficits in executive
      function and memory). Life expectancy is not necessarily decreased.
    explanation: >-
      GeneReviews chapter describing the adolescent/young-adult onset, motor and
      cerebellar manifestations, executive and memory deficits, and preserved
      life expectancy in late-onset Sandhoff disease.
  - reference: PMID:31995250
    reference_title: "Natural History of Adult Patients with GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients have childhood onset, but some experience the first symptoms
      during adolescence/adulthood.
    explanation: >-
      Adult GM2 gangliosidosis cohort documenting adolescent and adult symptom
      onset.
  - reference: PMID:31995250
    reference_title: "Natural History of Adult Patients with GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main brain magnetic resonance imaging feature was cerebellar atrophy,
      even in patients without cerebellar symptoms. The prognosis was mainly
      related to gait disorder, as we showed that beyond 20 years of disease
      evolution, half of the patients were wheelchair users.
    explanation: >-
      Pooled adult GM2 gangliosidosis natural history study showing that
      long-term functional prognosis is driven by gait impairment, with half of
      patients in the combined cohort requiring a wheelchair after 20 years of
      disease evolution.
  - reference: PMID:31995250
    reference_title: "Natural History of Adult Patients with GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed 4 typical presentations: (1) lower motoneuron disorder
      responsible for proximal lower limb weakness that subsequently expanded to
      the upper limbs, (2) cerebellar ataxia, (3) psychosis and/or severe mood
      disorder (only in the TS patients), and (4) a complex phenotype mixing the
      above 3 manifestations.
    explanation: >-
      Characterizes lower motor neuron weakness and cerebellar ataxia in the
      adult GM2 gangliosidosis cohort while clarifying that psychosis and/or
      severe mood disorder in this series was observed only in Tay-Sachs (TS)
      patients.
pathophysiology:
- name: Pathogenic HEXB variants
  description: >-
    Sandhoff disease is the HEXB-related form of GM2 gangliosidosis. Biallelic
    pathogenic variants in HEXB disrupt the beta subunit that participates in
    both hexosaminidase A and hexosaminidase B.
  gene:
    preferred_term: HEXB
    term:
      id: hgnc:4879
      label: HEXB
  downstream:
  - target: Hexosaminidase A and B deficiency
    description: >-
      Loss of the beta subunit reduces total beta-hexosaminidase activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31919734
      reference_title: "Clinical and Molecular Characteristics of Two Chinese Children with Infantile Sandhoff Disease and Review of the Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The pathogenic genetic defects of the HEXB gene, which encodes the β
        subunit of the hexosaminidase A (ɑβ) and hexosaminidase B (ββ) enzymes,
        cause deficiency of both the Hex A and Hex B enzymes, resulting in the
        deposition of GM2 ganglion glycerides in the lysosomes of the central
        nervous system and somatic cells.
      explanation: >-
        This directly links HEXB defects to combined Hex A and Hex B enzyme
        deficiency.
  evidence:
  - reference: PMID:31919734
    reference_title: "Clinical and Molecular Characteristics of Two Chinese Children with Infantile Sandhoff Disease and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic genetic defects of the HEXB gene, which encodes the β
      subunit of the hexosaminidase A (ɑβ) and hexosaminidase B (ββ) enzymes,
      cause deficiency of both the Hex A and Hex B enzymes, resulting in the
      deposition of GM2 ganglion glycerides in the lysosomes of the central
      nervous system and somatic cells.
    explanation: >-
      This disease-specific human report directly links pathogenic HEXB defects
      to combined Hex A and Hex B deficiency.

- name: Brain magnetic resonance imaging
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Brain MRI serves as a supplementary diagnostic and staging modality: in
    infantile Sandhoff disease, T2-weighted imaging can demonstrate basal
    ganglia hyperintensity and ventral thalamic hypointensity (alongside
    bilateral thalamic hyperdensity on CT), although characteristic cranial
    imaging findings are not present in all infantile patients. In pooled adult
    GM2 gangliosidosis cohorts, cerebellar atrophy is reported on conventional
    MRI, whereas quantitative volumetric MRI and diffusion tensor imaging
    comparing late-onset Sandhoff disease with late-onset Tay-Sachs
    disease (LOTS) found no statistically significant structural volume
    difference between late-onset Sandhoff disease and neurotypical controls and demonstrated a lower
    burden of cerebellar pathology in late-onset Sandhoff disease than in LOTS.
  results: >-
    Infantile T2-weighted basal ganglia hyperintensity and ventral thalamic
    hypointensity, or late-onset cerebellar findings with milder cerebellar
    pathology in late-onset Sandhoff disease than in late-onset Tay-Sachs
    disease
  presence: PRESENT
  evidence:
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axial T2-weighted imaging on MRI in our patient revealed hyperintensity of
      the basal ganglia and hypointensity of the ventral thalami. Beker-Acay et
      al. also reported as bilateral thalamic hyperdensity on computed
      tomography and hypointensity on T2-weighted MRI images as the earliest
      diagnostic markers of Sandhoff disease.
    explanation: >-
      Infantile Sandhoff disease report documenting T2-weighted basal ganglia
      hyperintensity and ventral thalamic hypointensity on brain MRI.
  - reference: PMID:31919734
    reference_title: "Clinical and Molecular Characteristics of Two Chinese Children with Infantile Sandhoff Disease and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, not all patients diagnosed with infantile Sandhoff disease
      had characteristic cranial imaging findings, which can only be used as
      supplementary information for diagnosis.
    explanation: >-
      Infantile Sandhoff disease report clarifying that characteristic cranial
      imaging findings are not universal and serve only as supplementary
      diagnostic information.
  - reference: PMID:31995250
    reference_title: "Natural History of Adult Patients with GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main brain magnetic resonance imaging feature was cerebellar atrophy,
      even in patients without cerebellar symptoms.
    explanation: >-
      Pooled adult GM2 gangliosidosis cohort (combining Tay-Sachs and Sandhoff
      patients) reporting cerebellar atrophy on conventional brain MRI.
  - reference: PMID:40266357
    reference_title: "Late-onset GM2 gangliosidosis: magnetic resonance imaging, diffusion tensor imaging, and correlational fiber tractography differentiate Tay-Sachs and Sandhoff diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LOTS patients had significantly smaller cerebellum volume compared to
      neurotypical controls (p < 0.0001) and LOSD patients (p < 0.0001). There
      was no statistical difference for the volume of any structure between LOSD
      and neurotypical controls.
    explanation: >-
      Quantitative T1-weighted volumetric MRI comparison showing that late-onset
      Sandhoff disease patients did not differ significantly in
      structural brain volumes from neurotypical controls and had larger
      cerebellar volume than late-onset Tay-Sachs (LOTS) patients.
  - reference: PMID:40266357
    reference_title: "Late-onset GM2 gangliosidosis: magnetic resonance imaging, diffusion tensor imaging, and correlational fiber tractography differentiate Tay-Sachs and Sandhoff diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This result indicates a greater burden of cerebellar pathology in LOTS
      patients compared with LOSD patients.
    explanation: >-
      Diffusion tensor imaging and correlational fiber tractography
      differentiate late-onset Sandhoff disease from late-onset Tay-Sachs
      disease by showing a lower burden of cerebellar pathology in late-onset Sandhoff disease.
differential_diagnoses:
- name: Tay-Sachs Disease
  description: >-
    Tay-Sachs disease is the parallel GM2 gangliosidosis caused by HEXA
    variants. It overlaps clinically and biochemically with Sandhoff disease
    across infantile, juvenile, and late-onset forms, but is distinguished by
    isolated HEX A deficiency (with preserved HEX B activity), biallelic HEXA
    variants, and the absence of hepatosplenomegaly, coarse facies, or elevated
    urinary N-acetylglucosamine-containing oligosaccharides.
  disease_term:
    preferred_term: Tay-Sachs disease
    term:
      id: MONDO:0010100
      label: Tay-Sachs disease
  evidence:
  - reference: PMID:40266357
    reference_title: "Late-onset GM2 gangliosidosis: magnetic resonance imaging, diffusion tensor imaging, and correlational fiber tractography differentiate Tay-Sachs and Sandhoff diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tay-Sachs disease is caused by variants in HEXA encoding the α-subunit and
      Sandhoff disease is caused by variants in HEXB encoding the β-subunit.
    explanation: >-
      This human imaging study explicitly separates the HEXA-related and
      HEXB-related GM2 disorders.
  - reference: PMID:40266357
    reference_title: "Late-onset GM2 gangliosidosis: magnetic resonance imaging, diffusion tensor imaging, and correlational fiber tractography differentiate Tay-Sachs and Sandhoff diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to shared clinical and biochemical findings, the two have been
      considered indistinguishable.
    explanation: >-
      This explains why Tay-Sachs remains an important diagnostic differential
      even though the diseases are genetically distinct.
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Closest differential diagnosis of Sandhoff disease is Tay–Sachs disease,
      which is characterized by the absence of coarse facies,
      hepatosplenomegaly, skeletal deformities, and signs of peripheral nerve
      involvement.
    explanation: >-
      Identifies Tay-Sachs disease as the closest differential diagnosis of
      Sandhoff disease and summarizes distinguishing clinical features.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In late-onset Sandhoff disease, avoid situations that increase the risk of
      falling (e.g., walking on uneven or unstable surfaces); and psychiatric
      medications that have been associated with worsening disease in late-onset
      Tay-Sachs disease, a similar disorder (e.g., haloperidol, risperidone,
      chlorpromazine).
    explanation: >-
      GeneReviews chapter noting late-onset Tay-Sachs disease as a closely
      similar disorder in the clinical differential and management of late-onset
      Sandhoff disease.
treatments:
- name: Supportive Care
  description: >-
    Current management is symptomatic and supportive across disease subtypes: in
    acute infantile Sandhoff disease, care focuses on adequate nutrition and
    hydration (including gastrostomy tube placement), managing infectious
    disease, airway protection to reduce aspiration risk, seizure control, motor
    development support, and preventing contractures or deformities; in subacute
    juvenile and late-onset disease, care focuses on maximizing motor function,
    speech and language therapy, and providing aids for daily living and
    communication, alongside periodic multidisciplinary surveillance, fall
    precautions, and avoidance of antipsychotics (such as haloperidol,
    risperidone, and chlorpromazine) associated with clinical worsening in
    late-onset GM2 gangliosidosis.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of manifestations: Treatment is symptomatic. Supportive care in
      acute infantile Sandhoff disease focuses on providing adequate nutrition
      and hydration, managing infectious disease, protecting the airway to
      reduce aspiration risk, controlling seizures, supporting motor
      development, and preventing deformities.
    explanation: >-
      GeneReviews management recommendations detailing multidisciplinary
      supportive care for acute infantile Sandhoff disease.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive care in subacute juvenile and late-onset Sandhoff disease
      focuses on maximizing motor function and speech and language as well as
      providing aids for activities of daily living and communication.
    explanation: >-
      GeneReviews management recommendations for rehabilitative, speech/language,
      and assistive-device supportive care in subacute juvenile and late-onset
      Sandhoff disease.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Surveillance: Periodic multidisciplinary evaluations to monitor existing
      disease manifestations and identify new manifestations requiring
      modification of supportive care.
    explanation: >-
      GeneReviews surveillance guidance supporting ongoing multidisciplinary
      monitoring to adapt supportive care.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In late-onset Sandhoff disease, avoid situations that increase the risk of
      falling (e.g., walking on uneven or unstable surfaces); and psychiatric
      medications that have been associated with worsening disease in late-onset
      Tay-Sachs disease, a similar disorder (e.g., haloperidol, risperidone,
      chlorpromazine).
    explanation: >-
      GeneReviews guidance on fall prevention and avoidance of specific
      neuroleptic/psychiatric medications in late-onset Sandhoff disease.
  - reference: PMID:29618308
    reference_title: "Genetics and Therapies for GM2 Gangliosidosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is no effective treatment beyond palliative care
    explanation: >-
      This GM2 gangliosidosis review states that standard care remains
      palliative, which applies to the HEXB-related Sandhoff branch.
  - reference: PMID:22025593
    reference_title: "Natural history of infantile G(M2) gangliosidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gastric tube placement was associated with prolonged survival.
    explanation: >-
      This infantile GM2 natural-history study reports a concrete supportive
      intervention associated with longer survival and found no difference
      between Tay Sachs and Sandhoff variants.
- name: Gene Therapy
  description: >-
    Investigational AAV-mediated HEXB replacement, or coordinated HEXA/HEXB
    delivery, has shown strong preclinical rescue of enzyme activity, storage
    pathology, gliosis, survival, and motor function in Sandhoff mouse models.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Hexosaminidase A and B deficiency
    treatment_effect: RESTORES
    description: >-
      Gene replacement aims to restore beta-hexosaminidase activity upstream of
      storage pathology.
    evidence:
    - reference: PMID:29325092
      reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Biochemical analyses in multiple tissues showed a significant increase
        in hexosaminidase A activity, which reached 10-15% of normal levels.
      explanation: >-
        AAV9-Hexb increased beta-hexosaminidase activity in the Sandhoff mouse
        model.
  - target: Lysosomal GM2 and GA2 accumulation in neural cells
    treatment_effect: INHIBITS
    description: >-
      Preclinical rescue reduces CNS GM2 and GA2 storage.
    evidence:
    - reference: PMID:29325092
      reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        AAV9 treatment was sufficient to prevent GM2 and GA2 storage almost
        completely in the cerebrum (less so in the cerebellum), as well as
        thalamic reactive gliosis and thalamocortical neuron loss in treated
        Hexb-/- mice.
      explanation: >-
        The preclinical gene therapy directly prevented the storage lesion.
  - target: Neuroinflammation and reactive gliosis
    treatment_effect: INHIBITS
    description: >-
      Successful rescue also attenuates astrocytic and thalamic gliosis.
    evidence:
    - reference: PMID:29325092
      reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        AAV9 treatment was sufficient to prevent GM2 and GA2 storage almost
        completely in the cerebrum (less so in the cerebellum), as well as
        thalamic reactive gliosis and thalamocortical neuron loss in treated
        Hexb-/- mice.
      explanation: >-
        The same rescue reduced thalamic reactive gliosis downstream of storage
        correction.
  - target: Neurodegeneration and circuit dysfunction
    treatment_effect: INHIBITS
    description: >-
      Rescue improves survival and motor performance in vivo.
    evidence:
    - reference: PMID:29325092
      reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, we demonstrate for the first time that this treatment results
        in a normal lifespan (over 700 days) and normalizes motor function
        assessed by a battery of behavioral tests, with scAAV9-treated SD mice
        being indistinguishable from wild-type littermates.
      explanation: >-
        Normalized motor function and lifespan support inhibition of the
        neurodegenerative functional branch in treated Sandhoff mice.
  evidence:
  - reference: PMID:29325092
    reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, we demonstrate for the first time that this treatment results
      in a normal lifespan (over 700 days) and normalizes motor function
      assessed by a battery of behavioral tests, with scAAV9-treated SD mice
      being indistinguishable from wild-type littermates.
    explanation: >-
      This neonatal AAV9-Hexb rescue study shows robust functional benefit in a
      Sandhoff mouse model.
  - reference: PMID:29325092
    reference_title: "Intravenous administration of scAAV9-Hexb normalizes lifespan and prevents pathology in Sandhoff disease mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      AAV9 treatment was sufficient to prevent GM2 and GA2 storage almost
      completely in the cerebrum (less so in the cerebellum), as well as
      thalamic reactive gliosis and thalamocortical neuron loss in treated
      Hexb-/- mice.
    explanation: >-
      This directly links gene therapy to reduced storage, gliosis, and neuron
      loss in the causal chain.
  - reference: PMID:31357902
    reference_title: "Brain endothelial specific gene therapy improves experimental Sandhoff disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overall, the data demonstrate that endothelial cells are a suitable target
      for intravenous gene therapy of GM2 gangliosidoses and possibly other
      lysosomal storage disorders.
    explanation: >-
      An independent Sandhoff mouse study supports intravenous gene therapy as a
      viable disease-modifying strategy.
- name: 4-Phenylbutyric Acid
  description: >-
    4-PBA is a preclinical pharmacologic strategy aimed at ER-stress-associated
    neuronal injury in Sandhoff disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 4-phenylbutyric acid
      term:
        id: CHEBI:41500
        label: 4-phenylbutyric acid
  target_mechanisms:
  - target: ER stress in spinal motor neurons
    treatment_effect: MODULATES
    description: >-
      4-PBA acts as a chemical chaperone in the Sandhoff mouse model and
      targets ER-stress-associated neuronal injury.
    evidence:
    - reference: PMID:39530163
      reference_title: "4-Phenylbutyric acid mitigates ER stress-induced neurodegeneration in the spinal cords of a GM2 gangliosidosis mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our studies also tested the impact of the chemical chaperone 4-PBA on ER
        stress in mice, and following administration, we observed significant
        improvements in motor neuromuscular function and life span throughout
        disease progression.
      explanation: >-
        The study frames 4-PBA as acting on the ER-stress branch of the Sandhoff
        mouse model.
  - target: Spinal motor neuron apoptosis
    treatment_effect: INHIBITS
    description: >-
      4-PBA reduces downstream spinal motor neuron apoptosis in vivo.
    evidence:
    - reference: PMID:39530163
      reference_title: "4-Phenylbutyric acid mitigates ER stress-induced neurodegeneration in the spinal cords of a GM2 gangliosidosis mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        4-PBA treatment significantly reduced apoptosis in spinal cord neurons and
        increased the number of choline acetyltransferase (ChAT)-positive neurons,
        with little effect on astrogliosis or sensory interneurons.
      explanation: >-
        This directly supports reduced spinal motor neuron apoptosis after
        4-PBA treatment.
  - target: Neurodegeneration and circuit dysfunction
    treatment_effect: MODULATES
    description: >-
      Preclinical treatment improved neuromuscular function and lifespan.
    evidence:
    - reference: PMID:39530163
      reference_title: "4-Phenylbutyric acid mitigates ER stress-induced neurodegeneration in the spinal cords of a GM2 gangliosidosis mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our studies also tested the impact of the chemical chaperone 4-PBA on ER
        stress in mice, and following administration, we observed significant
        improvements in motor neuromuscular function and life span throughout
        disease progression.
      explanation: >-
        Functional and lifespan improvements support modulation of the
        downstream neurodegenerative branch.
  evidence:
  - reference: PMID:39530163
    reference_title: "4-Phenylbutyric acid mitigates ER stress-induced neurodegeneration in the spinal cords of a GM2 gangliosidosis mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our studies also tested the impact of the chemical chaperone 4-PBA on ER
      stress in mice, and following administration, we observed significant
      improvements in motor neuromuscular function and life span throughout
      disease progression.
    explanation: >-
      This study supports 4-PBA as a preclinical intervention for ER-stress-linked
      neurologic decline in Sandhoff disease.
  - reference: PMID:39530163
    reference_title: "4-Phenylbutyric acid mitigates ER stress-induced neurodegeneration in the spinal cords of a GM2 gangliosidosis mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      4-PBA treatment significantly reduced apoptosis in spinal cord neurons and
      increased the number of choline acetyltransferase (ChAT)-positive neurons,
      with little effect on astrogliosis or sensory interneurons.
    explanation: >-
      The treatment is positioned specifically against the ER-stress / neuronal
      apoptosis branch rather than as a broad anti-gliosis therapy.

    bound on Tay-Sachs_Disease): the diagnostic claim here is a single
    combined total activity figure ("Serum levels of beta hexosaminidase
    total (A + B) were low"), not an interpreted A-versus-B comparison.
    Tay-Sachs is HexA-deficient with normal/raised HexB, so its own diagnosis
    row's claim genuinely is the A-vs-B comparison the interpretation panel
    reports; Sandhoff is deficient in both, so its own source reports a
    total quantity instead. No reference_ranges band is recorded: "low" is
    qualitative, with no numeric cut-off this entry could bound.

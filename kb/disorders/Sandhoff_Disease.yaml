diagnosis:
- name: Beta-hexosaminidase A and B enzyme activity assay
  diagnosis_term:
    preferred_term: beta-hexosaminidase A and B enzyme activity measurement
    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  description: >-
    Enzymatic activity measurement in serum, plasma, leukocytes, or cultured
    fibroblasts is the gold-standard biochemical test for GM2 gangliosidosis and
    demonstrates abnormally low activity of both beta-hexosaminidase A (HEX A)
    and beta-hexosaminidase B (HEX B) with an increased relative percentage
    contribution from HEX A in Sandhoff disease.
  results: >-
    Abnormally low beta-hexosaminidase A (HEX A) and beta-hexosaminidase B
    (HEX B) enzymatic activity with an increased relative contribution from
    HEX A
  presence: PRESENT
  evidence:
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In a proband, the diagnosis of Sandhoff disease is established by: (1)
      enzymatic testing that identifies abnormally low activity of the enzymes
      beta-hexosaminidase A (HEX A) and beta-hexosaminidase B (HEX B) combined
      with an increased contribution from HEX A; and (2) identification
      biallelic pathogenic variants in HEXB on molecular testing.
    explanation: >-
      GeneReviews diagnostic criteria establishing that abnormally low HEX A
      and HEX B enzymatic activity with an increased relative contribution from
      HEX A is a primary diagnostic criterion for Sandhoff disease.
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gold standard method for diagnosis of GM2 gangliosidosis is the
      measurement of β-HEX activity in plasma, serum, and/or fibroblasts.
    explanation: >-
      Clinical report identifying beta-hexosaminidase enzymatic assay in plasma,
      serum, or fibroblasts as the diagnostic gold standard.
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum levels of β hexosaminidase total (A + B) were low.
    explanation: >-
      Demonstrates reduced total beta-hexosaminidase (Hex A + B) activity as the
      diagnostic biochemical signature of Sandhoff disease.
  - reference: CGGV:assertion_7f53d03d-f936-4628-ab75-351ae4da012a-2022-09-15T160000.000Z
    reference_title: "HEXB / Sandhoff disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of Sandhoff disease is established by abnormally low
      enzymatic activity of hexosaminidases A and B, and identification of
      biallelic pathogenic variants in HEXB by molecular genetic testing (Xiao
      et al., 2022, PMID: 35420740).
    explanation: >-
      ClinGen expert panel summary confirming that abnormally low enzymatic
      activity of both hexosaminidases A and B establishes the biochemical
      diagnosis.

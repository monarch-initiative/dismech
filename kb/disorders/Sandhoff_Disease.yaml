inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Sandhoff disease follows autosomal recessive inheritance across infantile,
    juvenile, and adult presentations; when both parents are heterozygous for a
    HEXB pathogenic variant, each sibling of an affected individual has at
    conception a 25% chance of being affected, a 50% chance of being an
    asymptomatic carrier, and a 25% chance of inheriting neither familial
    variant.
  evidence:
  - reference: PMID:31919734
    reference_title: "Clinical and Molecular Characteristics of Two Chinese Children with Infantile Sandhoff Disease and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infantile Sandhoff disease is an autosomal recessive inherited disease
      primarily characterized by cherry red spots in the retina, muscle weakness,
      seizure, truncal hypotonia, hyperacusis, developmental delay and
      regression.
    explanation: >-
      This Sandhoff disease case series and literature review directly identifies
      autosomal recessive inheritance.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sandhoff disease is inherited in an autosomal recessive manner. If both
      parents are known to be heterozygous for a HEXB pathogenic variant, each
      sib of an affected individual has at conception a 25% chance of being
      affected, a 50% chance of being an asymptomatic carrier, and a 25% chance
      of inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews chapter on Sandhoff disease confirming autosomal recessive
      inheritance and the 25% sibling recurrence risk at conception.
has_subtypes:
- name: Infantile Sandhoff disease
  subtype_term:
    preferred_term: Sandhoff disease, infantile form
    term:
      id: MONDO:0017721
      label: Sandhoff disease, infantile form
  description: >-
    Classic acute infantile Sandhoff disease with onset typically before 6
    months of age (and within the first 6-18 months), normal appearance at birth
    followed by progressive weakness, developmental slowing and regression,
    seizures, severe neurologic impairment, and death usually between ages two
    and three years.
  evidence:
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has three clinical subtypes (infantile, juvenile, and adult forms) and
      represents around 7% of cases among all the lysosomal storage disorders.
    explanation: >-
      This clinical report confirms the infantile form as one of three recognized
      clinical subtypes of Sandhoff disease, defined by onset in the first
      6-18 months of life with rapid neurodegenerative progression.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute infantile Sandhoff disease (onset age <6 months). Infants are
      generally normal at birth followed by progressive weakness and slowing of
      developmental progress, then developmental regression and severe
      neurologic impairment. Seizures are common. Death usually occurs between
      ages two and three years.
    explanation: >-
      GeneReviews chapter defining the onset window, presenting clinical
      trajectory, and early childhood mortality of acute infantile Sandhoff
      disease.
- name: Juvenile Sandhoff disease
  subtype_term:
    preferred_term: Sandhoff disease, juvenile form
    term:
      id: MONDO:0017722
      label: Sandhoff disease, juvenile form
  description: >-
    Subacute juvenile Sandhoff disease with onset between ages 2 and 5 years
    after normal initial milestones, followed by slowing of developmental
    progress, developmental regression, abnormal gait, dysarthria, cognitive
    decline, and death (usually from aspiration) in the early to late teens.
  evidence:
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has three clinical subtypes (infantile, juvenile, and adult forms) and
      represents around 7% of cases among all the lysosomal storage disorders.
    explanation: >-
      This clinical report confirms the juvenile form as one of three recognized
      clinical subtypes of Sandhoff disease, with childhood onset and slower
      progression than the infantile form.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Subacute juvenile Sandhoff disease (onset age 2-5 years). After attaining
      normal developmental milestones, developmental progress slows, followed by
      developmental regression and neurologic impairment (abnormal gait,
      dysarthria, and cognitive decline). Death (usually from aspiration)
      typically occurs in the early to late teens.
    explanation: >-
      GeneReviews chapter defining the 2-5 year onset window, neurologic
      manifestations, and teenage mortality of subacute juvenile Sandhoff
      disease.
- name: Adult Sandhoff disease
  subtype_term:
    preferred_term: Sandhoff disease, adult form
    term:
      id: MONDO:0017723
      label: Sandhoff disease, adult form
  description: >-
    Late-onset Sandhoff disease with onset in the older teen years or young
    adulthood after nearly normal psychomotor development, presenting with
    weakness, spasticity, dysarthria, cerebellar dysfunction, and deficits in
    executive function and memory, with life expectancy not necessarily
    decreased.
  evidence:
  - reference: PMID:28553389
    reference_title: "Sandhoff Disease without Hepatosplenomegaly Due to Hexosaminidase B Gene Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has three clinical subtypes (infantile, juvenile, and adult forms) and
      represents around 7% of cases among all the lysosomal storage disorders.
    explanation: >-
      This clinical report confirms the adult (late-onset) form as one of three
      recognized clinical subtypes of Sandhoff disease, characterized by more
      variable progression and longer survival compared to infantile and juvenile
      forms.
  - reference: PMID:35420740
    reference_title: "Sandhoff Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Late-onset Sandhoff disease (onset older teen years or young adulthood).
      Nearly normal psychomotor development is followed by a range of neurologic
      findings (e.g., weakness, spasticity, dysarthria, and deficits in
      cerebellar function) and psychiatric findings (e.g., deficits in executive
      function and memory). Life expectancy is not necessarily decreased.
    explanation: >-
      GeneReviews chapter defining the adolescent/young-adult onset, motor and
      cerebellar features, executive/memory deficits, and preserved life
      expectancy of late-onset Sandhoff disease.

pathophysiology:
- name: Impaired SETBP1 degron-dependent degradation
  description: >-
    Classical Schinzel-Giedion syndrome is caused by missense variants within or
    immediately adjacent to the exon 4 canonical degron of SETBP1 (amino acids
    868 to 871), which disrupt ubiquitin-proteasome degradation and produce toxic
    accumulation of SETBP1 protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SETBP1
    term:
      id: hgnc:15573
      label: SETBP1
  evidence:
  - reference: PMID:37872881
    reference_title: "Cell-type-specific gene expression and regulation in the cerebral cortex and kidney of atypical Setbp1(S858R) Schinzel Giedion Syndrome mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SETBP1 variants causing classical SGS cluster at the degron, disrupting SETBP1 protein degradation and resulting in toxic accumulation, while those located outside cause milder atypical SGS.
    explanation: >-
      Directly states the core degron-disruption mechanism of classical SGS and
      contrasts it with variants outside the canonical degron in atypical SGS.
  - reference: PMID:38711130
    reference_title: "Novel SETBP1 D874V adjacent to the degron causes canonical schinzel-giedion syndrome: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a case of typical SGS caused by a novel heterozygous missense variant, D874V, adjacent to the degron.
    explanation: >-
      Shows that missense variants immediately adjacent to the canonical degron
      can also produce canonical SGS.
  - reference: PMID:39825586
    reference_title: "Reciprocal and non-reciprocal effects of clinically relevant SETBP1 protein dosage changes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To investigate if clinically relevant variation in protein levels impacts the same downstream pathways in human disease, we generated cell models of two SETBP1 syndromes: Schinzel-Giedion Syndrome (SGS) and SETBP1 haploinsufficiency disease (SHD), where SGS is caused by too much protein, and SHD is caused by not enough SETBP1.
    explanation: >-
      Supports excess SETBP1 protein accumulation as the molecular basis of SGS
      in human forebrain progenitor models.
  downstream:
  - target: Aberrant developmental gene transcription
    description: Excess stabilized SETBP1 protein alters epigenetic and transcriptional control over developmental gene networks
- name: Aberrant developmental gene transcription
  description: >-
    SETBP1 acts as an epigenetic hub at AT-rich promoter regions through
    recruitment of the HCF1/KMT2A/PHF8 chromatin-modifying complex and modulates
    intracellular signaling pathways such as AKT; excess SETBP1 protein
    dysregulates developmental gene-expression programs in neural and visceral
    progenitors.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SETBP1
    term:
      id: hgnc:15573
      label: SETBP1
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:29875417
    reference_title: "SETBP1 induces transcription of a network of development genes by acting as an epigenetic hub."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that SETBP1 binds to gDNA in AT-rich promoter regions, causing activation of gene expression through recruitment of a HCF1/KMT2A/PHF8 epigenetic complex.
    explanation: >-
      Directly supports SETBP1 as a DNA-binding transcriptional and epigenetic
      regulator recruiting HCF1/KMT2A/PHF8.
  - reference: PMID:29875417
    reference_title: "SETBP1 induces transcription of a network of development genes by acting as an epigenetic hub."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene ontology analysis of deregulated SETBP1 target genes indicates that they are also key controllers of visceral organ development and brain morphogenesis.
    explanation: >-
      Links dysregulated SETBP1 target gene networks to both brain morphogenesis
      and visceral organ development.
  - reference: PMID:39825586
    reference_title: "Reciprocal and non-reciprocal effects of clinically relevant SETBP1 protein dosage changes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that extremes of SETBP1 protein dose reciprocally influence important signalling molecules such as AKT, suggesting that the SETBP1 protein operates within a narrow dosage range and that extreme doses are detrimental.
    explanation: >-
      Demonstrates that elevated SETBP1 protein dosage perturbs downstream
      signaling pathways including AKT in human neural progenitor models.

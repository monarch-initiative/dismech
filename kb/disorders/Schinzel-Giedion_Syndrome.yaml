- name: Aberrant developmental gene transcription
  description: >-
    SETBP1 acts as an epigenetic hub at AT-rich promoter regions through
    recruitment of the HCF1/KMT2A/PHF8 chromatin-modifying complex, organizes
    higher-order chromatin interactions with the nuclear lamina, and modulates
    intracellular signaling pathways such as AKT; excess SETBP1 protein
    dysregulates developmental gene-expression programs in neural and visceral
    progenitors.

  - target: Disrupted visceral and craniofacial morphogenesis
    description: Deregulated SETBP1 target genes perturb kidney, skeletal, and craniofacial organogenesis
- name: Impaired neurogenesis and neuronal migration
  description: >-
    Pathogenic SETBP1 accumulation disrupts cortical neurogenesis, delays
    neuronal migration, and alters cell-type-specific transcriptional regulatory
    networks in cerebral cortex excitatory neurons and other neural cell types.
  biological_scale: CELLULAR

    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the SETBP1 pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      Supports reproductive genetic counseling and prenatal or preimplantation

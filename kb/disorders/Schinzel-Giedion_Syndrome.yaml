    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In line with these findings, in utero brain electroporation of mutated SETBP1 causes impairment of mouse neurogenesis with a profound delay in neuronal migration.
    explanation: >-
      Directly supports impaired neurogenesis and delayed neuronal migration
      downstream of mutant SETBP1 in vivo.
  - reference: PMID:37872881
    reference_title: "Cell-type-specific gene expression and regulation in the cerebral cortex and kidney of atypical Setbp1(S858R) Schinzel Giedion Syndrome mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Setbp1 was differentially expressed in excitatory neurons, but known SETBP1 targets were differentially expressed and regulated in many cell types. Our findings suggest molecular drivers underlying neurodevelopmental phenotypes in classical SGS also drive atypical SGS, persist after birth, and are present in the kidney.
    explanation: >-
      Demonstrates cell-type-specific dysregulation of SETBP1 targets in
      cerebral cortex excitatory neurons and other cell types.

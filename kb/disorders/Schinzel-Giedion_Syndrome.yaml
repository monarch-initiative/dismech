differential_diagnoses:
- name: intellectual disability, autosomal dominant 29
  disease_term:
    preferred_term: intellectual disability, autosomal dominant 29
    term:
      id: MONDO:0014482
      label: intellectual disability, autosomal dominant 29
  description: >-
    SETBP1 haploinsufficiency disorder (MRD29) is an allelic disorder caused by
    heterozygous loss-of-function or nonsense SETBP1 variants; it overlaps
    genetically with SGS but presents with a milder neurodevelopmental phenotype
    and lacks the canonical degron-mediated protein accumulation and severe
    visceral malformations.
  distinguishing_features:
  - Classical degron-region gain-of-stability missense variants with severe multisystem malformations and refractory epilepsy favor Schinzel-Giedion syndrome.
  - Truncating or haploinsufficiency variants with expressive speech impairment, milder developmental delay, and absence of severe congenital visceral anomalies favor intellectual disability, autosomal dominant 29.
  evidence:
  - reference: PMID:39825586
    reference_title: "Reciprocal and non-reciprocal effects of clinically relevant SETBP1 protein dosage changes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To investigate if clinically relevant variation in protein levels impacts the same downstream pathways in human disease, we generated cell models of two SETBP1 syndromes: Schinzel-Giedion Syndrome (SGS) and SETBP1 haploinsufficiency disease (SHD), where SGS is caused by too much protein, and SHD is caused by not enough SETBP1.
    explanation: >-
      Directly contrasts the excess SETBP1 protein mechanism of SGS with the
      reduced SETBP1 dosage mechanism of SETBP1 haploinsufficiency disorder.
  - reference: PMID:25217958
    reference_title: "Refining analyses of copy number variation identifies specific genes associated with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the likely loss-of-function, mutations, gain-of-function mutations cluster within a 12 amino domain and result in a more severe DD with multiple congenital abnormalities and death in infancy48,49.
    explanation: >-
      Distinguishes milder loss-of-function SETBP1 phenotypes from severe
      gain-of-function degron-hotspot SGS.
- name: Kabuki syndrome
  disease_term:
    preferred_term: Kabuki syndrome
    term:
      id: MONDO:0016512
      label: Kabuki syndrome
  description: >-
    Kabuki syndrome can overlap through developmental delay, seizures, congenital
    heart defects, and renal anomalies, but differs in its causal chromatin
    modifier genes (KMT2D, KDM6A) and characteristic palpebral fissure and
    dermatoglyphic features.
  distinguishing_features:
  - Progressive severe neurodegeneration, midface retrusion, and classical SETBP1 degron variants favor Schinzel-Giedion syndrome.
  - Persistent fetal fingertip pads, elongated palpebral fissures with eversion of the lateral lower eyelid, and KMT2D or KDM6A variants favor Kabuki syndrome.

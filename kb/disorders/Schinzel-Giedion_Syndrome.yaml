prevalence:
- subtype: Classic Schinzel-Giedion syndrome
  population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    More than 50 molecularly confirmed individuals with classic Schinzel-Giedion
    syndrome carrying pathogenic variants within the SETBP1 exon 4 degron hotspot
    have been reported in the published literature.
  evidence:
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To date, more than 50 individuals have been reported with molecularly confirmed classic SGS. Atypical SGS, reported in five individuals to date, is caused by pathogenic SETBP1 variants in proximity to – but not within – the mutational hot spot.
    explanation: >-
      GeneReviews summarizes the published case counts for molecularly confirmed
      classic and atypical Schinzel-Giedion syndrome.
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Classic Schinzel-Giedion syndrome (SGS), an ultra-rare multisystem disorder caused by gain-of-function pathogenic variants in a SETBP1 mutational hot spot, is characterized by global neurodevelopmental impairment leading to moderate-to-profound intellectual disability, epilepsy (often refractory to treatment), hypotonia, spasticity, dysautonomia, hearing loss, and cerebral visual impairment.
    explanation: >-
      Directly establishes classic Schinzel-Giedion syndrome as an ultra-rare
      multisystem disorder.
- subtype: Atypical Schinzel-Giedion syndrome
  population: Published literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five individuals have been reported with atypical Schinzel-Giedion syndrome
    caused by SETBP1 variants adjacent to the canonical degron hotspot.
  evidence:

notes: >-
  Genotype-phenotype correlation in SETBP1-related disorders reflects a strict
  dosage-sensitivity continuum: de novo missense variants within the 12-bp exon 4
  canonical degron (amino acids 868 to 871) cause classic Schinzel-Giedion
  syndrome via impaired ubiquitin-proteasome degradation and toxic SETBP1 protein
  accumulation, missense variants immediately adjacent to the degron (such as
  p.S867R or p.D874V) cause either canonical or milder atypical SGS, and
  heterozygous truncating or deletion variants cause SETBP1 haploinsufficiency
  disorder (MRD29).

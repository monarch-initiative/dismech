progression:
- phase: Neonatal
  age_range: Birth / neonatal period
  notes: >-
    Presentation at birth with distinctive craniofacial dysmorphism (midface
    retrusion, prominent forehead, hypertelorism), skeletal anomalies (talipes
    equinovarus), congenital heart defects, and congenital hydronephrosis.
  evidence:
  - reference: PMID:38711130
    reference_title: "Novel SETBP1 D874V adjacent to the degron causes canonical schinzel-giedion syndrome: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The female patient was diagnosed in the neonatal period and presented with characteristic facial phenotype (midface retraction, prominent forehead, and low-set ears), bilateral symmetrical talipes equinovarus, overlapping toes, and severe bilateral hydronephrosis accompanied by congenital heart disease, consistent with canonical SGS.
    explanation: >-
      Documents neonatal presentation with characteristic craniofacial features,
      clubfoot, congenital heart disease, and severe bilateral hydronephrosis.
  - reference: PMID:36147799
    reference_title: "Detection of a novel SETBP1 variant in a Chinese neonate with Schinzel-Giedion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A male Chinese neonate with dysmorphic facial features, nervous system disorders, and organ malformations at birth was examined in this study and long-term followed-up.
    explanation: >-
      Confirms congenital and neonatal onset of craniofacial, neurologic, and
      visceral anomalies at birth.
- phase: Infantile
  age_range: Infancy to early childhood
  notes: >-
    Progressive neurodegeneration, infantile-onset refractory seizures, severe
    feeding difficulties, ventriculomegaly, and elevated risk of embryonal or
    neuroepithelial tumors; affected individuals with classic SGS rarely survive
    past infancy or early childhood.
  evidence:
  - reference: PMID:36147799
    reference_title: "Detection of a novel SETBP1 variant in a Chinese neonate with Schinzel-Giedion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six months after birth, the patient had an epileptic seizure and experienced persistent neurodevelopmental delay with auditory and visual abnormalities. Color Doppler ultrasonography at 18 months revealed hydronephrosis and bilateral widening of the lateral ventricles. The patient died suddenly 20.5 months after birth.
    explanation: >-
      Illustrates infantile progression with seizure onset at 6 months,
      persistent neurodevelopmental delay, progressive ventriculomegaly, and
      death at 20.5 months.
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other features may include neuroepithelial neoplasia, severely disrupted sleep, choanal stenosis, inguinal hernia, sensitive skin, and increased risk of infection.
    explanation: >-
      Highlights neuroepithelial neoplasia and increased infection risk in
      classic SGS.
  - reference: PMID:25217958
    reference_title: "Refining analyses of copy number variation identifies specific genes associated with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the likely loss-of-function, mutations, gain-of-function mutations cluster within a 12 amino domain and result in a more severe DD with multiple congenital abnormalities and death in infancy48,49.
    explanation: >-
      Supports severe developmental delay, multiple congenital anomalies, and
      infantile mortality in gain-of-function SETBP1 hotspot mutations.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Classic Schinzel-Giedion syndrome imposes a very high clinical burden due to
    moderate-to-profound intellectual disability, drug-resistant epilepsy,
    feeding intolerance and poor weight gain, progressive brain atrophy,
    multiorgan congenital malformations (including severe hydronephrosis and
    cardiac defects), neuroepithelial tumor predisposition, and premature
    mortality in infancy.

      Agents/circumstances to avoid: Nephrotoxic drugs such as nonsteroidal anti-inflammatory drugs and vancomycin should be used with caution due to high frequency of chronic renal impairment from recurrent pyelonephritis and structural renal anomalies.
    explanation: >-
      GeneReviews explicitly recommends avoiding nephrotoxic agents including
      NSAIDs and vancomycin in individuals with SGS due to structural kidney
      abnormalities, recurrent pyelonephritis, and chronic kidney disease.
- name: Genetic counseling
  description: >-
    Genetic counseling is indicated for families of affected probands to discuss
    de novo autosomal dominant inheritance, low recurrence risk (accounting for
    rare parental germline mosaicism), and options for prenatal or
    preimplantation genetic testing once the familial SETBP1 variant is known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL

differential_diagnoses:
- name: intellectual disability, autosomal dominant 29
  disease_term:
    preferred_term: intellectual disability, autosomal dominant 29
    term:
      id: MONDO:0014482
      label: intellectual disability, autosomal dominant 29
  description: >-
    SETBP1 haploinsufficiency disorder (MRD29) is an allelic disorder caused by
    heterozygous loss-of-function or nonsense SETBP1 variants; it overlaps
    genetically with SGS but presents with speech apraxia and a milder
    neurodevelopmental phenotype without the canonical degron-mediated protein
    accumulation and severe visceral malformations of SGS.
  distinguishing_features:
  - Classical degron-region gain-of-stability missense variants with severe multisystem malformations and refractory epilepsy favor Schinzel-Giedion syndrome.
  - Truncating or haploinsufficiency variants with expressive speech impairment, milder developmental delay, and absence of severe congenital visceral anomalies favor intellectual disability, autosomal dominant 29.
  evidence:
  - reference: PMID:38585550
    reference_title: "Delayed Bone Age in a Child with a Novel Loss-of-Function Variant in SETBP1 Gene Sheds Light on the Potential Role of SETBP1 Protein in Skeletal Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      SETBP1 gene variants that decrease or eliminate protein activity have been associated with phenotypes characterized by speech apraxia and intellectual disabilities. This condition, distinctly separated from Schinzel-Giedion syndrome, is referred to as autosomal dominant mental retardation 29 (ADR29).
    explanation: >-
      Directly distinguishes SETBP1 loss-of-function variants causing autosomal
      dominant intellectual disability 29 (MRD29/ADR29) from Schinzel-Giedion
      syndrome.
  - reference: PMID:34807554
    reference_title: "SETBP1 Haploinsufficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of SETBP1-HD is established in a proband with suggestive findings and a heterozygous pathogenic loss-of-function variant in SETBP1 identified by molecular genetic testing.
    explanation: >-
      Establishes that SETBP1 haploinsufficiency disorder is defined by
      heterozygous loss-of-function SETBP1 variants, contrasting with the
      gain-of-function degron variants of SGS.
  - reference: PMID:25217958
    reference_title: "Refining analyses of copy number variation identifies specific genes associated with developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the likely loss-of-function, mutations, gain-of-function mutations cluster within a 12 amino domain and result in a more severe DD with multiple congenital abnormalities and death in infancy48,49.
    explanation: >-
      Distinguishes milder loss-of-function SETBP1 phenotypes from severe
      gain-of-function degron-hotspot SGS.

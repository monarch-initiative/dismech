has_subtypes:
- name: Classic
  display_name: Classic Schinzel-Giedion syndrome
  description: >-
    Canonical Schinzel-Giedion syndrome caused by heterozygous de novo
    gain-of-function variants within (or immediately adjacent to) the 12-base-pair
    exon 4 SETBP1 mutational hot spot encoding the canonical degron, presenting
    with severe global neurodevelopmental impairment, characteristic craniofacial
    and visceral malformations, and predisposition to neuroepithelial neoplasia.
  evidence:
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of classic SGS can be established in a proband based on published clinical diagnostic criteria, or the molecular diagnosis can be established in a proband with suggestive findings and a heterozygous SETBP1 pathogenic gain-of-function variant within the mutational hot spot (i.e., a 12-base-pair region in exon 4 encoding a canonical degron).
    explanation: >-
      Defines classic Schinzel-Giedion syndrome by clinical diagnostic criteria
      and pathogenic gain-of-function variants within the exon 4 canonical degron
      hot spot.
  - reference: PMID:38711130
    reference_title: "Novel SETBP1 D874V adjacent to the degron causes canonical schinzel-giedion syndrome: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a case of typical SGS caused by a novel heterozygous missense variant, D874V, adjacent to the degron.
    explanation: >-
      Documents that missense variants immediately adjacent to the canonical
      degron can also produce canonical (classic) SGS.
- name: Atypical
  display_name: Atypical Schinzel-Giedion syndrome
  description: >-
    Atypical Schinzel-Giedion syndrome caused by heterozygous pathogenic SETBP1
    variants in proximity to, but outside, the canonical exon 4 degron hot spot,
    characterized by a variable clinical spectrum overlapping classic SGS but
    without documented risk for neuroepithelial neoplasia to date.
  evidence:
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To date, more than 50 individuals have been reported with molecularly confirmed classic SGS. Atypical SGS, reported in five individuals to date, is caused by pathogenic SETBP1 variants in proximity to – but not within – the mutational hot spot.
    explanation: >-
      Defines atypical Schinzel-Giedion syndrome as caused by pathogenic SETBP1
      variants adjacent to but outside the mutational hot spot.
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The broad spectrum of clinical features of variable severity partially overlaps with classic SGS; however, this spectrum does not include risk for neuroepithelial neoplasia to date.
    explanation: >-
      Distinguishes atypical SGS by its variable clinical severity and absence of
      documented neuroepithelial neoplasia risk to date.

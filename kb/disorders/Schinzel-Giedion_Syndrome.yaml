      can also produce canonical SGS.
  - reference: PMID:38452171
    reference_title: Schinzel-Giedion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of classic SGS can be established in a proband based on published clinical diagnostic criteria, or the molecular diagnosis can be established in a proband with suggestive findings and a heterozygous SETBP1 pathogenic gain-of-function variant within the mutational hot spot (i.e., a 12-base-pair region in exon 4 encoding a canonical degron).
    explanation: >-
      GeneReviews directly establishes that classic SGS is caused by heterozygous
      pathogenic gain-of-function variants within the 12-bp exon 4 canonical
      degron hotspot of SETBP1.

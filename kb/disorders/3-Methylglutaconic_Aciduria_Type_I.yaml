- name: Reported adult leukoencephalopathy association of uncertain causality
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A small number of adults with biochemical and genetic MGA1 have been
    reported with progressive ataxia and extensive cerebral white-matter
    disease. The causal path from AUH deficiency or its metabolites to white-
    matter injury is unknown, and ascertainment bias remains a viable
    explanation. This clinical-association node is intentionally detached from
    the established biochemical causal chain.
  locations:
  - preferred_term: brain white matter
    term:
      id: UBERON:0003544
      label: brain white matter
  evidence:
  - reference: PMID:20855850
    reference_title: "3-Methylglutaconic aciduria type I redefined: a syndrome with late-onset leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both patients, MRI revealed extensive white matter disease.
    explanation: Supports the reported adult association in two patients.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is unclear whether the clinical features seen in reported patients are
      caused by the biochemical abnormalities, or whether they simply represent
      an ascertainment bias in patients that come to clinical attention.
    explanation: Directly states why the reported association cannot yet be modeled as established causation.

    explanation: Documents the allelic spectrum of pathogenic AUH variants.
  - reference: PMID:21840233
    reference_title: "Phenotypic heterogeneity in two siblings with 3-methylglutaconic aciduria type I caused by a novel intragenic deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was confirmed by a demonstration of 3-methylglutaconyl-CoA hydratase enzyme deficiency in the cultured skin fibroblasts and homozygous deletion of exons 1-3 within the AUH gene."

discussions:
- discussion_id: controversy_mga1_childhood_clinical_phenotype
  prompt: >-
    Does AUH deficiency cause a reproducible childhood clinical phenotype, or do
    the reported developmental, behavioral, and severe neurologic findings
    primarily reflect ascertainment and coincidental comorbidity?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reported pediatric neurodevelopmental association of uncertain causality
  - phenotypes#Delayed speech and language development
  - phenotypes#Severe global developmental delay
  rationale: >-
    Clinically ascertained cases report heterogeneous pediatric findings, but
    four newborn-screened patients, including three followed for more than 18
    years without treatment, remained asymptomatic. The current evidence cannot
    estimate clinical penetrance or separate AUH effects from background
    neurodevelopmental variation.
  evidence:
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is no clear evidence of a specific childhood-onset clinical phenotype associated with this disorder
    explanation: Defines the central controversy about childhood clinical attribution.
  - reference: PMID:21840233
    reference_title: Phenotypic heterogeneity in two siblings with 3-methylglutaconic aciduria type I caused by a novel intragenic deletion.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two siblings with 3-methylglutaconic aciduria type I with phenotypic heterogeneity.
    explanation: Shows why selected pediatric reports cannot define a consistent phenotype.
  proposed_experiments:
  - experiment_id: exp_mga1_family_controlled_natural_history
    name: Family-controlled longitudinal natural-history study
    description: >-
      Follow all molecularly confirmed individuals identified through screening,
      including untreated participants and variant-negative relatives, with
      standardized cognition, language, motor, psychiatric, metabolite, and MRI
      assessments. Prespecified family-control comparisons would quantify
      penetrance while limiting ascertainment bias.
- discussion_id: controversy_mga1_adult_leukoencephalopathy
  prompt: >-
    Is adult-onset progressive leukoencephalopathy a causal late manifestation
    of AUH deficiency, and if so, what biochemical mechanism injures white matter?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Reported adult leukoencephalopathy association of uncertain causality
  - imaging_findings#Extensive cerebral white-matter disease on adult MRI
  - phenotypes#Progressive ataxia
  - phenotypes#Leukoencephalopathy
  rationale: >-
    Adult case reports show a recurring ataxia/leukoencephalopathy pattern, and
    one patient had marked CSF 3-hydroxyisovalerate enrichment, but there are too
    few unbiased adult observations to establish causality. No validated chain
    links the diagnostic metabolites to myelin or axonal injury.
  evidence:
  - reference: PMID:20855850
    reference_title: "3-Methylglutaconic aciduria type I redefined: a syndrome with late-onset leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both patients, MRI revealed extensive white matter disease.
    explanation: Supports recurrence of the adult imaging association in the small clinical series.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      will be required to conclusively prove or disprove the association with adult-onset leukoencephalopathy
    explanation: Directly supports keeping the association unresolved.
  proposed_experiments:
  - experiment_id: exp_mga1_adult_screening_mri_metabolomics
    name: Adult biochemical-screening, MRI, and CNS-metabolite study
    description: >-
      Screen large adult biobank cohorts for the MGA1 biochemical and molecular
      phenotype independently of neurologic symptoms, then compare blinded MRI,
      neurologic examinations, plasma/CSF metabolites, and longitudinal change
      with matched controls. Patient-derived neural cultures could then test
      candidate metabolites at measured human CNS concentrations.
- discussion_id: gap_mga1_treatment_effectiveness
  prompt: >-
    Do leucine restriction or levocarnitine alter biochemical markers, neurologic
    penetrance, or long-term imaging outcomes in MGA1?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Leucine-restricted diet
  - treatments#Levocarnitine supplementation
  rationale: >-
    Treatment reports are uncontrolled and often begin in asymptomatic infants.
    Untreated newborn-screened individuals have also remained asymptomatic for
    more than 18 years, so normal development under treatment cannot establish
    efficacy. Intensive restriction carries nutritional and adherence burdens.
  evidence:
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The burdens of sustained treatment (particularly with intensive dietary
      leucine restriction) in asymptomatic individuals may be of little benefit
    explanation: Establishes the uncertainty and burden underlying the treatment gap.
  - reference: PMID:38077954
    reference_title: Asymptomatic 3-methylglutaconic aciduria type 1 detected by high C5-OH on newborn screening.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatments such as dietary leucine restriction and carnitine supplementation may have little effect on MGCA1 in childhood
    explanation: A modern untreated case and literature review question benefit while calling for further study.
  proposed_experiments:
  - experiment_id: exp_mga1_treatment_registry
    name: Prospective treatment-and-observation registry
    description: >-
      Use a multicenter protocol with standardized diet, carnitine status,
      urinary metabolites, neurodevelopment, neurologic examination, and MRI.
      Compare prespecified treated and conservatively observed groups with
      adjustment for indication and ascertainment; randomized treatment would be
      considered only if an actionable clinical phenotype is first established.
notes: >-
  Comprehensive re-review of the WP-001 AUH entry. The record deliberately
  separates the established biochemical lesion from two detached, provisional
  clinical-association branches. It does not apply the toxic-metabolite/energy-
  deficit or acute-decompensation module nodes because metabolite toxicity,
  energy failure, and acute crises are not established. Phenotype frequencies
  are omitted because the published cohorts are small and ascertainment-biased.

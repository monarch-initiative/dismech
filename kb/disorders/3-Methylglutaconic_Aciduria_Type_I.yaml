name: 3-Methylglutaconic Aciduria Type I
creation_date: '2026-07-08T00:00:00Z'
category: Mendelian
synonyms:
- 3-Methylglutaconyl-CoA hydratase deficiency
- 3-MG-CoA hydratase deficiency
- AUH defect
- MGA1
- MGCA1
- Primary 3-methylglutaconic aciduria
description: >
  3-Methylglutaconic aciduria type I (MGA1) is an autosomal recessive inborn
  error of leucine catabolism caused by biallelic variants in AUH, which encodes
  the mitochondrial enzyme 3-methylglutaconyl-CoA hydratase. The enzyme catalyzes
  the conversion of 3-methylglutaconyl-CoA to 3-hydroxy-3-methylglutaryl-CoA, the
  only step of leucine degradation that had long remained uncharacterized at the
  enzyme and gene level. Its deficiency produces a distinctive organic-acid
  profile with elevated urinary excretion of 3-methylglutaconic acid,
  3-methylglutaric acid, and 3-hydroxyisovaleric acid — the biochemical hallmark
  and diagnostic key. MGA1 is the only "primary" 3-methylglutaconic aciduria,
  mechanistically distinct from the "secondary" 3-methylglutaconic acidurias
  (e.g., Barth/TAZ, MEGDEL/SERAC1, Costeff/OPA3, DCMA/DNAJC19, TMEM70), in which
  the aciduria reflects mitochondrial membrane or phospholipid-remodeling defects
  rather than a leucine-pathway block. The clinical phenotype is strikingly
  variable, ranging from asymptomatic detection on newborn screening and isolated
  delayed speech in childhood to a highly characteristic, slowly progressive
  adult-onset leukoencephalopathy with ataxia, spasticity, optic atrophy, and
  dementia. The mechanism linking metabolite accumulation to white-matter injury
  is not established, and complete absence of the enzyme is compatible with
  normal development in some individuals.
classifications:
  icimd_category:

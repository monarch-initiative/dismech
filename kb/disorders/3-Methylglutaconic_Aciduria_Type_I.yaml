- name: Slowly Progressive Leukoencephalopathy
  description: >
    MGA1 is redefined as a slowly progressive leukoencephalopathy. Adult
    patients present with a highly characteristic clinical and neuroradiologic
    pattern — progressive ataxia, spasticity, optic atrophy, and dementia with
    extensive cerebral white-matter disease on MRI — whereas childhood
    presentation is nonspecific (delayed speech, learning problems) or absent.
    White-matter abnormalities may already begin in the first decades of life.
    This node is intentionally NOT declared to conform to the module's acute
    "Metabolic Decompensation"/"Acute Metabolic Encephalopathy" nodes, because
    MGA1 lacks the acute catabolic-crisis pattern of the classic
    intoxication-type organic acidemias.

        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:12655555
      reference_title: "Mutations in the AUH gene cause 3-methylglutaconic aciduria type I."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Molecular analyses in five patients from four independent families revealed homozygosity or compound heterozygosity for mutations in the AUH gene; most mutations are predicted to completely abolish protein function."
      explanation: Biallelic (homozygous/compound heterozygous) AUH variants support autosomal recessive inheritance.
  features: >
    Reported pathogenic AUH alleles span nonsense, splice-site, frameshift,
    missense, and large intragenic-deletion variants, generally biallelic and
    predicted to abolish protein function. Documented alleles include c.80delG,
    R197X, IVS8-1G>A, A240V, c.613_614insA, and a homozygous deletion of
    exons 1-3.
  evidence:
  - reference: PMID:12655555
    reference_title: "Mutations in the AUH gene cause 3-methylglutaconic aciduria type I."
    supports: SUPPORT

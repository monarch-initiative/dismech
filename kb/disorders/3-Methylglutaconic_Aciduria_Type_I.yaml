name: 3-Methylglutaconic Aciduria Type I
creation_date: '2026-07-08T00:00:00Z'
category: Mendelian
synonyms:
- 3-Methylglutaconyl-CoA hydratase deficiency
- 3-MG-CoA hydratase deficiency
- AUH defect
- MGA1
- MGCA1
- Primary 3-methylglutaconic aciduria
description: >-
  3-Methylglutaconic aciduria type I (MGA1) is an autosomal recessive defect of
  leucine catabolism caused by biallelic pathogenic variants in AUH, which
  encodes mitochondrial 3-methylglutaconyl-CoA hydratase. The established
  phenotype is biochemical: deficient enzyme activity causes persistent urinary
  3-methylglutaconic acid, variably accompanied by 3-methylglutaric and
  3-hydroxyisovaleric acids, and can produce an elevated C5-OH newborn-screening
  signal. Clinical penetrance is unresolved. Long-term newborn-screened
  individuals have remained asymptomatic without treatment, whereas small,
  clinically ascertained series and case reports describe nonspecific pediatric
  neurodevelopmental findings and a possible adult-onset progressive
  leukoencephalopathy. Ascertainment bias prevents treating those neurologic
  findings as established consequences of the biochemical defect. MGA1 is the
  disorder historically termed primary 3-methylglutaconic aciduria; secondary
  3-methylglutaconic acidurias arise through other mitochondrial mechanisms
  rather than an AUH-dependent leucine-pathway block.
classifications:
  icimd_category:
  - classification_value: organic_acidurias
    notes: >-
      ICIMD places AUH-related MGA1 among the organic acidurias caused by a block
      in branched-chain amino-acid catabolism.
    evidence:
    - reference: PMID:36341175
      reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        3-Methylglutaconyl-CoA hydratase deficiency (MGA1) is a defect in leucine catabolism
      explanation: Supports classification as an intermediary-metabolism organic aciduria of leucine catabolism.

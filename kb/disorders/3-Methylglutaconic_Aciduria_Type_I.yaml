- name: Reported pediatric neurodevelopmental association of uncertain causality
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Delayed speech, learning problems, and severe early neuromotor impairment
    have been reported in individual children with biochemical MGA1. Familial
    discordance, asymptomatic newborn-screened individuals, and the absence of a
    consistent childhood phenotype make causal attribution uncertain. This node
    is intentionally detached from the established biochemical causal chain.
  evidence:
  - reference: PMID:21840233
    reference_title: Phenotypic heterogeneity in two siblings with 3-methylglutaconic aciduria type I caused by a novel intragenic deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index case was a 14-year-old female with learning disability,
      attention deficit-hyperactivity and early onset subclinical leukoencephalopathy.
    explanation: Documents neurodevelopmental findings in one molecularly confirmed sibling.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is no clear evidence of a specific childhood-onset clinical phenotype associated with this disorder
    explanation: Qualifies the pediatric reports as associations of uncertain causality.
  downstream:

genetic:
- name: Biallelic AUH pathogenic variants
  gene_term:
    preferred_term: AUH
    term:
      id: hgnc:890
      label: AUH
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported pathogenic alleles include sequence variants affecting AUH
    function and intragenic or gene-encompassing deletions. The clinical outcome
    cannot be predicted from residual activity or variant class; copy-number
    analysis is important when a strong biochemical phenotype is not explained
    by routine sequencing.
  evidence:
  - reference: PMID:12655555
    reference_title: Mutations in the AUH gene cause 3-methylglutaconic aciduria type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analyses in five patients from four independent families
      revealed homozygosity or compound heterozygosity for mutations in the AUH gene
    explanation: Establishes the biallelic molecular basis.
  - reference: PMID:21840233
    reference_title: Phenotypic heterogeneity in two siblings with 3-methylglutaconic aciduria type I caused by a novel intragenic deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: homozygous deletion of exons 1-3 within the AUH gene
    explanation: Documents an intragenic deletion allele.
  - reference: PMID:35457240
    reference_title: "3-Methylglutaconic Aciduria Type I Due to AUH Defect: The Case Report of a Diagnostic Odyssey and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two microdeletions in compound heterozygosity encompassing the AUH gene,
      which confirmed the diagnosis
    explanation: Shows that compound structural variants can underlie MGA1.

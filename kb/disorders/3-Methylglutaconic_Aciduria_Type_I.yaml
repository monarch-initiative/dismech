- name: 3-Methylglutaconyl-CoA Hydratase Deficiency
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  description: >
    Biallelic loss-of-function variants in AUH reduce or abolish mitochondrial
    3-methylglutaconyl-CoA hydratase activity. This enzyme catalyzes the
    conversion of 3-methylglutaconyl-CoA to 3-hydroxy-3-methylglutaryl-CoA
    (HMG-CoA) within the leucine degradation pathway — the leucine-catabolic step
    that had remained the last to be characterized at the enzyme and DNA level
    until AUH was identified as its gene.

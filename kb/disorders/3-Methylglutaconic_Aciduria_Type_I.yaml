- name: Leucine loading as a primary-versus-secondary biochemical discriminator
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: MAXO:0000006
      label: clinical laboratory procedure
  description: >-
    In a specialist study of 21 patients with different 3-MGA-urias, urinary
    3-methylglutaconic acid increased after leucine loading only in AUH defect.
    This is evidence for pathway discrimination, not a routine first-line test
    or a substitute for molecular confirmation.
  results: Selective post-load increase of urinary 3-methylglutaconic acid in AUH deficiency.
  evidence:
  - reference: PMID:24757000
    reference_title: Leucine Loading Test is Only Discriminative for 3-Methylglutaconic Aciduria Due to AUH Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After leucine loading urinary 3-methylglutaconic acid levels increased only in the patients with an AUH defect.
    explanation: Demonstrates biochemical discrimination of primary MGA1 from secondary 3-MGA-urias.
differential_diagnoses:
- name: Secondary 3-methylglutaconic acidurias
  description: >-
    TAZ/Barth, SERAC1/MEGDEL, OPA3/Costeff, DNAJC19/DCMA, TMEM70-related disease,
    and other mitochondrial disorders can produce persistent
    3-methylglutaconic aciduria without an AUH-dependent leucine-catabolism
    block.
  distinguishing_features:
  - Biallelic AUH variants and deficient 3-methylglutaconyl-CoA hydratase establish primary MGA1.
  - Secondary disorders are classified by their causal protein and syndrome-specific phenotype rather than by a numbered 3-MGA type.
  - In a specialist series, leucine loading increased urinary 3-methylglutaconic acid only in AUH defect.
  evidence:
  - reference: PMID:23296368
    reference_title: "Inborn errors of metabolism with 3-methylglutaconic aciduria as discriminative feature: proper classification and nomenclature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One should distinguish between "primary 3-methylglutaconic aciduria"
      formerly known as type I (3-methylglutaconyl-CoA hydratase deficiency,
      AUH defect) due to defective leucine catabolism and the--currently
      known--three groups of "secondary 3-methylglutaconic aciduria".
    explanation: Establishes the mechanism-based primary-versus-secondary distinction.
  - reference: PMID:24757000
    reference_title: Leucine Loading Test is Only Discriminative for 3-Methylglutaconic Aciduria Due to AUH Defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After leucine loading urinary 3-methylglutaconic acid levels increased only in the patients with an AUH defect.
    explanation: Provides a biochemical discriminator supporting the mechanistic distinction.
- name: 3-hydroxy-3-methylglutaryl-CoA lyase deficiency
  description: >-
    HMGCL deficiency is an adjacent leucine-pathway disorder that can produce
    C5-OH, 3-methylglutaconic acid, 3-methylglutaric acid, and
    3-hydroxyisovaleric acid. Unlike the uncertain clinical penetrance of MGA1,
    HMGCL deficiency can cause severe acute hypoketotic metabolic crises.
  distinguishing_features:
  - Urinary 3-hydroxy-3-methylglutaric acid is a discriminating HMGCL-deficiency marker not expected in the core MGA1 profile.
  - Acute vomiting, acidosis, and hypoketotic hypoglycemia support HMGCL deficiency rather than uncomplicated MGA1.
  - HMGCL enzyme or molecular testing, rather than AUH testing, confirms the diagnosis.
  evidence:
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with HMGCLD present with a diagnostic urinary pattern of elevated
      organic acids such as 3‐hydroxyisovaleric acid (3HIV‐A),
      3‐methylglutaconic acid (3MGC‐A), 3‐hydroxy‐3‐methylglutaric acid
      (3H3MG‐A), 3‐methylglutaric acid (3MG‐A) and in some cases
      3‐methylcrotonylglycine.
    explanation: Establishes the overlapping profile and the distinguishing 3-hydroxy-3-methylglutaric acid marker.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients may suffer from severe attacks of metabolic decompensation with
      lethargy, seizures, hypotonia, vomiting and acidosis with hypoketotic
      hypoglycemia that may result in irreversible neurological damage.
    explanation: Supports the acute hypoketotic-crisis distinction from MGA1.
- name: Other disorders with an elevated C5-OH screening signal
  description: >-
    3-methylcrotonyl-CoA carboxylase deficiency, beta-ketothiolase deficiency,
    multiple carboxylase deficiencies, and several other organic and
    mitochondrial disorders share the isobaric C5-OH screening transition.
    C5-OH alone therefore cannot identify MGA1.
  distinguishing_features:
  - Resolve the signal with urine organic acids, enzyme assays, and molecular testing rather than C5-OH magnitude.
  - Confirm primary MGA1 with the characteristic urine profile plus deficient AUH activity or biallelic AUH variants.
  evidence:
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 3‐methylcrotonyl‐CoA carboxylase deficiency
    explanation: Identifies 3MCC deficiency in the shared isobaric acylcarnitine differential.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: β‐ketothiolase deficiency
    explanation: Identifies beta-ketothiolase deficiency in the shared isobaric acylcarnitine differential.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: multiple carboxylase deficiency
    explanation: Identifies multiple carboxylase deficiency in the shared isobaric acylcarnitine differential.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In order to distinguish between these disorders, a patient must be recalled
      for urine sampling and/or analysis of enzyme activities.
    explanation: Supports biochemical resolution beyond the screening marker.
- name: Not-otherwise-specified 3-methylglutaconic aciduria
  description: >-
    Significant, persistent 3-methylglutaconic aciduria can remain unexplained
    after AUH deficiency and known secondary syndromes are excluded. Such cases
    should not be assigned MGA1 without AUH or enzyme confirmation.
  distinguishing_features:
  - No confirmatory biallelic AUH variants or deficient AUH enzyme activity.
  - Known secondary 3-MGA syndromes have been excluded but the pathomechanism remains unresolved.
  evidence:
  - reference: PMID:23296368
    reference_title: "Inborn errors of metabolism with 3-methylglutaconic aciduria as discriminative feature: proper classification and nomenclature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      should be referred to as "not otherwise specified (NOS) 3-MGA-uria" until
      elucidation of the underlying pathomechanism enables proper (possibly extended) classification.
    explanation: Supports retaining an unresolved NOS category rather than misclassifying it as MGA1.
treatments:
- name: Leucine-restricted diet
  description: >-
    Leucine restriction has been proposed from pathway logic and used in case
    reports, but no controlled evidence demonstrates neurologic benefit.
    Sustained intensive restriction may offer little benefit to asymptomatic
    individuals on current evidence and should not be represented as routine
    therapy; any use requires individualized metabolic-dietitian oversight.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  target_mechanisms:
  - target: Leucine-pathway organic-acid accumulation
    treatment_effect: MODULATES
    description: Restriction is intended to reduce leucine substrate flux into the blocked pathway; clinical benefit is unproven.
  evidence:
  - reference: PMID:20855850
    reference_title: "3-Methylglutaconic aciduria type I redefined: a syndrome with late-onset leukoencephalopathy."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Dietary treatment with leucine restriction may be considered.
    explanation: Supports only a proposal, not demonstrated efficacy.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The burdens of sustained treatment (particularly with intensive dietary
      leucine restriction) in asymptomatic individuals may be of little benefit,
      and likely to result in poor compliance.
    explanation: Directly supports avoiding routine intensive restriction in asymptomatic individuals.
- name: Levocarnitine supplementation
  description: >-
    Levocarnitine has been given with protein or leucine restriction in pediatric
    reports. These uncontrolled observations do not establish clinical benefit
    or a universal indication, and long-term asymptomatic outcomes are also
    reported without treatment.
  treatment_term:
    preferred_term: carnitine supplementation
    term:
      id: MAXO:0010006
      label: carnitine supplementation
  evidence:
  - reference: PMID:35457240
    reference_title: "3-Methylglutaconic Aciduria Type I Due to AUH Defect: The Case Report of a Diagnostic Odyssey and a Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was then supplemented with levocarnitine and protein intake was slowly decreased.
    explanation: Documents use in one case without proving efficacy.
  - reference: PMID:34333924
    reference_title: "[Analysis of six children with 3-methylglutaconic aciduria]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After being treated with leucine diet restriction and L-carnitine, 4
      patients with AUH gene variation who were from asymptomatic phase developed normally
    explanation: Describes normal development under combined treatment but lacks an untreated comparison.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      remain asymptomatic in the absence of treatment
    explanation: Shows that normal outcome cannot be attributed to supplementation from uncontrolled treated cases.

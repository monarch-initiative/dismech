treatments:
- name: Leucine-restricted diet
  description: >
    Because MGA1 results from a block in leucine catabolism, dietary leucine
    (protein) restriction has been proposed as a rational treatment, though the
    evidence base is limited and benefit is not established.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  evidence:
  - reference: PMID:20855850
    reference_title: "3-Methylglutaconic aciduria type I redefined: a syndrome with late-onset leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dietary treatment with leucine restriction may be considered."
    explanation: The redefining clinical study proposes leucine restriction as a candidate dietary treatment.
discussions:
- discussion_id: gap_mga1_metabolite_to_leukoencephalopathy
  prompt: >
    By what mechanism does the leucine-pathway block in MGA1 cause slowly
    progressive white-matter disease, and why is complete loss of
    3-methylglutaconyl-CoA hydratase compatible with normal development in some
    individuals while others develop adult leukoencephalopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of Leucine-Pathway Organic Acids
  - pathophysiology#Slowly Progressive Leukoencephalopathy
  rationale: >
    The accumulating organic acids (3-methylglutaconic, 3-methylglutaric,
    3-hydroxyisovaleric) are diagnostic biomarkers, but their neurotoxic
    potential and the causal chain to oligodendrocyte/white-matter injury are
    unproven; MGA1 lacks the acute intoxication crises seen in classic organic
    acidemias, and the genotype-phenotype relationship is poor — complete enzyme
    absence can be asymptomatic. This makes the metabolite-to-leukoencephalopathy
    edge INDIRECT with unknown intermediates, and the disorder was historically
    even questioned as a "nondisease."
  proposed_experiments:
  - experiment_id: exp_mga1_natural_history_imaging_cohort
    name: Longitudinal AUH-genotyped natural-history and neuroimaging cohort
    description: >
      Enroll genetically confirmed AUH-deficient individuals across the age
      range (including asymptomatic newborn-screen-detected cases) with serial
      brain MRI, metabolite quantification, and neurologic/cognitive assessment
      to define the true natural history, test whether metabolite burden
      predicts white-matter progression, and search for genetic or environmental
      modifiers explaining the variable outcome.
notes: >
  WP-001 (IEMbase metabolic) new-entry increment for issue #5556, row 1.2.12.01
  (AUH-related 3-methylglutaconic aciduria type I; OMIM:250950). Anchored to
  MONDO:0009610 (NEC preflight: MONDO def/xref name AUH as the causal gene, OMIM
  matches). Distinct from the leucine-pathway neighbor 3-Hydroxy-3-Methylglutaric
  Aciduria (HMGCL, the next enzymatic step) already in the KB, and from the
  "secondary" 3-methylglutaconic acidurias (TAZ/Barth, SERAC1/MEGDEL, OPA3/Costeff,
  DNAJC19/DCMA, TMEM70). Conforms to the metabolic_intoxication_decompensation
  module only at the enzymatic-block and metabolite-accumulation nodes; the acute
  decompensation/encephalopathy module nodes are intentionally NOT applied because
  MGA1 is a slowly progressive leukoencephalopathy without acute catabolic crises.
  Frequency qualifiers were omitted except on the obligate biochemical hallmark,
  per the frequency-evidence SOP (the two primary phenotype cohorts are small and
  do not support quantitative frequency bands for the clinical features).

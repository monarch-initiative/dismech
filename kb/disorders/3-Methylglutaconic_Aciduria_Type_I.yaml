- name: Accumulation of Leucine-Pathway Organic Acids
  conforms_to: "metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit"
  description: >
    The metabolic block causes accumulation and excessive urinary excretion of
    3-methylglutaconic acid, 3-methylglutaric acid, and 3-hydroxyisovaleric acid
    — the abnormal organic-acid profile that is the biochemical hallmark of MGA1.
    Unlike the classic intoxication-type organic acidemias, the accumulating
    acids are not associated with recurrent acute acidotic/hyperammonemic
    crises, and their neurotoxic potential is not established.

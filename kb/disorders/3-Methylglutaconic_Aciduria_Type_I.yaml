inheritance:
- name: Autosomal recessive inheritance with incomplete clinical penetrance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Biallelic AUH variants establish the biochemical disorder, but a specific
    clinical phenotype is not consistently expressed. Complete enzyme absence
    and long follow-up after newborn-screening detection can be compatible with
    normal development and absence of neurologic symptoms.
  evidence:
  - reference: PMID:12655555
    reference_title: Mutations in the AUH gene cause 3-methylglutaconic aciduria type I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete absence of 3-methylglutaconyl-CoA hydratase/AUH appears to be
      compatible with normal development in some cases.
    explanation: Biallelic loss of AUH function does not invariably produce a clinical phenotype.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all four patients diagnosed through NBS (including three with over
      18 years of clinical follow-up) remain asymptomatic in the absence of treatment
    explanation: Long-term untreated follow-up directly supports incomplete clinical penetrance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate is available. A 2022 cohort review
    described fewer than 30 published cases; case counts vary across reviews
    because of duplicate reports and uncertain clinical ascertainment.
  evidence:
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is an ultra-rare condition, with <30 cases published in the literature.
    explanation: Provides the most recent explicit literature-count characterization.
progression:
- phase: Biochemical detection in infancy
  age_range: Newborn period
  notes: >-
    MGA1 can be detected in an asymptomatic infant through elevated C5-OH and a
    characteristic urine organic-acid profile. Detection does not predict later
    clinical disease.
  evidence:
  - reference: PMID:35457240
    reference_title: "3-Methylglutaconic Aciduria Type I Due to AUH Defect: The Case Report of a Diagnostic Odyssey and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      detection of increased 3-hydroxyisovalerylcarnitine levels at newborn
      screening, which were associated with increased urinary excretion of
      3-methylglutaconic acid, 3-hydroxyisovaleric acid, and 3-methylglutaric acid
    explanation: Documents biochemical detection through newborn screening and confirmatory urine metabolites.
- phase: Childhood course
  age_range: Infancy through adolescence
  notes: >-
    The best available long-term newborn-screening cohort found no specific
    childhood-onset clinical phenotype. Speech, learning, behavioral, and severe
    neurologic findings have been reported in clinically ascertained cases, but
    their causal attribution to AUH deficiency is uncertain.
  evidence:
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is no clear evidence of a specific childhood-onset clinical phenotype associated with this disorder
    explanation: Directly supports the conservative childhood natural-history framing.
  - reference: PMID:21840233
    reference_title: Phenotypic heterogeneity in two siblings with 3-methylglutaconic aciduria type I caused by a novel intragenic deletion.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: We describe two siblings with 3-methylglutaconic aciduria type I with phenotypic heterogeneity.
    explanation: Illustrates heterogeneous reported pediatric findings without establishing disease-wide penetrance.
  - reference: PMID:38077954
    reference_title: Asymptomatic 3-methylglutaconic aciduria type 1 detected by high C5-OH on newborn screening.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She is now two years and six months old, and her physical growth and
      psychomotor development have progressed normally.
    explanation: Adds a contemporary untreated newborn-screened case with normal early-childhood development.
- phase: Reported adult neurologic course
  age_range: Adulthood to late adulthood
  notes: >-
    Several clinically ascertained adults have developed slowly progressive
    ataxia and extensive white-matter disease, sometimes with optic atrophy,
    spasticity, or dementia. The number of cases is very small, and long-term
    newborn-screened cohorts have not yet proved that this association is causal.
  evidence:
  - reference: PMID:20855850
    reference_title: "3-Methylglutaconic aciduria type I redefined: a syndrome with late-onset leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two unrelated patients with the characteristic biochemical findings of
      3- methylglutaconic aciduria type I presented in adulthood with progressive ataxia.
    explanation: Documents the adult neurologic presentation in two clinically ascertained patients.
  - reference: PMID:36341175
    reference_title: "3-Methylglutaconyl-CoA hydratase deficiency: When ascertainment bias confounds a biochemical diagnosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Longer-term follow-up of patients detected via NBS (or biochemical screening
      of large cohorts of asymptomatic adult individuals) will be required to
      conclusively prove or disprove the association with adult-onset leukoencephalopathy.
    explanation: Qualifies the adult association as unproven rather than an inevitable disease phase.
pathophysiology:
- name: AUH-dependent 3-methylglutaconyl-CoA hydratase deficiency
  conforms_to: metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic pathogenic variants in AUH reduce or abolish mitochondrial
    3-methylglutaconyl-CoA hydratase activity. The enzyme catalyzes conversion of
    3-methylglutaconyl-CoA to 3-hydroxy-3-methylglutaryl-CoA in leucine
    degradation.
  genes:
  - preferred_term: AUH
    term:
      id: hgnc:890
      label: AUH
  molecular_functions:
  - preferred_term: methylglutaconyl-CoA hydratase activity
    term:
      id: GO:0004490
      label: methylglutaconyl-CoA hydratase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-leucine catabolic process
    term:
      id: GO:0006552
      label: L-leucine catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  evidence:
  - reference: PMID:12434311
    reference_title: 3-Methylglutaconic aciduria type I is caused by mutations in AUH.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we show that 3-methylglutaconyl-CoA hydratase is encoded by the AUH gene
    explanation: Establishes AUH as the gene encoding the deficient enzyme.
  - reference: PMID:16640564
    reference_title: Biochemical characterization of human 3-methylglutaconyl-CoA hydratase and its role in leucine metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The only missense mutation found in MGA1 phenotypes, c.719C>T, leading to
      the amino acid exchange A240V, produces an enzyme with only 9% of the
      wild-type 3-MG-CoA hydratase activity.
    explanation: Functional expression data show severe loss of hydratase activity from an AUH missense allele.
  downstream:
  - target: Leucine-pathway organic-acid accumulation
    description: The hydratase block causes the characteristic primary 3-methylglutaconic aciduria biochemical profile.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12434311
      reference_title: 3-Methylglutaconic aciduria type I is caused by mutations in AUH.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This results in elevated urinary levels of 3-methylglutaconic acid,
        3-methylglutaric acid, and 3-hydroxyisovaleric acid.
      explanation: Directly links the AUH-dependent enzyme deficiency to the urine organic-acid profile.
- name: Leucine-pathway organic-acid accumulation
  mechanism_confidence: ESTABLISHED
  description: >-
    The AUH-dependent leucine-catabolism block produces persistent urinary
    3-methylglutaconic acid, with variable 3-hydroxyisovaleric and
    3-methylglutaric acids. These metabolites are diagnostic readouts. Their
    toxicity and any causal connection to neurologic disease have not been
    demonstrated, so this node does not conform to a toxic-metabolite or energy-
    deficit mechanism module.
  chemical_entities:

    reference_title: Biallelic SHQ1 variants in early infantile hypotonia and paroxysmal dystonia as the leading manifestation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report eight individuals, from seven unrelated families, who
      exhibited neurodevelopmental disorder and/or dystonia, received
      whole-genome sequencing, and had inherited biallelic SHQ1 variants.
    explanation: Genome sequencing identified the variants in seven families.
  - reference: PMID:41885709
    reference_title: "A Revealing Case of SHQ1-Related Neurodevelopmental Disorder: Expanding the Genotypic and Phenotypic Frontier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case expands the clinical spectrum of SHQ1-related disorder by
      illustrating a milder phenotype with functional developmental gains and
      emphasis on the diagnostic value of WES reanalysis.
    explanation: Exome reanalysis made the diagnosis after a nondiagnostic first pass.

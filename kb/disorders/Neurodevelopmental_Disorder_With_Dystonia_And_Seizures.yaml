    explanation: Patient variants impair rRNA processing and ribosome production in yeast.
- name: Impaired Cortical Neuronal Migration and Neurite Growth
  description: >-
    SHQ1 is highly expressed in developing mouse cortex. Knockdown by in utero
    electroporation impairs migration and neurite morphology of cortical
    neurons, and patient variants expressed in SH-SY5Y cells slow neuronal
    migration.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cortical neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: DECREASED
    term:
      id: GO:0001764
      label: neuron migration
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  evidence:
  - reference: PMID:39326821
    reference_title: Pathogenic SHQ1 variants result in disruptions to neuronal development and the dopaminergic pathway.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SHQ1 knockdown impaired the migration and neurite morphology of cortical
      neurons during brain development.
    explanation: In utero knockdown in mouse cortex disrupts neuronal migration.
  - reference: PMID:36847845
    reference_title: Biallelic SHQ1 variants in early infantile hypotonia and paroxysmal dystonia as the leading manifestation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The four novel SHQ1 variants transfected into human SH-SY5Y neuronal

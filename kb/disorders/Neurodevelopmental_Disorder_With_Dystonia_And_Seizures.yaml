    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed link; dystonia did not respond clearly to levodopa, so a simple
      dopamine deficiency is unlikely to be the whole explanation.
    evidence:
    - reference: PMID:39326821
      reference_title: Pathogenic SHQ1 variants result in disruptions to neuronal development and the dopaminergic pathway.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SHQ1 plays an essential role in brain development and dopaminergic
        function by upregulating dopaminergic pathways and regulating the
        behaviors of neural progenitors and their neuronal progeny, potentially
        leading to dystonia and developmental delay in patients.
      explanation: The authors propose dopaminergic dysfunction as a route to dystonia.
  - target: Decreased CSF homovanillic acid concentration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36847845
      reference_title: Biallelic SHQ1 variants in early infantile hypotonia and paroxysmal dystonia as the leading manifestation.

name: Neurodevelopmental Disorder With Dystonia And Seizures
creation_date: '2026-10-16T23:00:00Z'
category: Mendelian
synonyms:
- SHQ1-related neurodevelopmental disorder
- SHQ1-related hypomyelinating leukodystrophy
description: >-
  Neurodevelopmental disorder with dystonia and seizures (NEDDS) is an autosomal
  recessive disorder caused by biallelic variants in SHQ1, the chaperone that
  binds the pseudouridine synthase dyskerin (NAP57) and is required for assembly
  of H/ACA small nucleolar ribonucleoproteins. These particles pseudouridylate
  ribosomal and spliceosomal RNAs, take part in pre-rRNA processing, and
  stabilize telomerase RNA. Onset is in infancy, at a median of about 3.5
  months in the largest series, with profound hypotonia and dystonia (often
  paroxysmal), global developmental delay, brisk reflexes, variable autonomic
  dysfunction and seizures. Cerebellar atrophy can appear or progress over
  follow-up, and diffuse white matter hypomyelination is reported, especially
  with the homozygous p.I278T variant. Severity ranges from early epileptic
  encephalopathy with neurodegeneration to milder disease with developmental
  gains. Cerebrospinal fluid homovanillic acid is low and striatal dopamine
  transporter uptake is reduced, implicating dopaminergic pathways; levodopa has
  not produced a clear response. Patient fibroblasts lose SHQ1 protein,
  disease variants weaken SHQ1 binding to dyskerin, and in yeast they deplete
  H/ACA snoRNAs and impair rRNA processing and ribosome production. In
  developing mouse cortex, Shq1 knockdown disturbs neuronal migration and
  neurite growth.
disease_term:
  preferred_term: neurodevelopmental disorder with dystonia and seizures
  term:
    id: MONDO:0859258
    label: neurodevelopmental disorder with dystonia and seizures
parents:
- Neurodevelopmental Disorder
notes: >-
  No GeneReviews chapter covers this disorder (checked with
  `just check-genereviews`). The hypomyelinating leukodystrophy reports
  (PMID:36810590, PMID:40837391) are treated as part of the same entity
  because MONDO has no separate SHQ1 leukodystrophy term and the reports
  describe overlapping developmental delay, hypotonia and seizures. Blood
  findings are inconsistent: the first patient had normal blood counts and
  no mucocutaneous signs of dyskeratosis congenita, while one p.I278T
  homozygous child developed neutropenia and thrombocytopenia at about 4
  years. Telomere length has not been reported in any patient.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals carry homozygous or compound heterozygous SHQ1
    variants, with unaffected heterozygous parents.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29178645
    reference_title: Inherited SHQ1 mutations impair interaction with NAP57/dyskerin, a major target in dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SHQ1 mutations were the only set of mutations consistent with an
      autosomal recessive mode of inheritance.
    explanation: Exome analysis of the first patient fits recessive inheritance.
  - reference: PMID:36847845
    reference_title: Biallelic SHQ1 variants in early infantile hypotonia and paroxysmal dystonia as the leading manifestation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report eight individuals, from seven unrelated families, who
      exhibited neurodevelopmental disorder and/or dystonia, received
      whole-genome sequencing, and had inherited biallelic SHQ1 variants.
    explanation: Biallelic inherited variants across seven families.
pathophysiology:
- name: Biallelic SHQ1 Loss of Function
  description: >-
    Disease variants are mostly missense, with some truncating alleles, and
    reduce SHQ1 function. Patient fibroblasts show a marked loss of SHQ1
    protein, and missense variants at the SHQ1-dyskerin interface weaken
    binding to dyskerin.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SHQ1
    term:
      id: hgnc:25543
      label: SHQ1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:34542157
    reference_title: Compound heterozygous variants in SHQ1 are associated with a spectrum of neurological features, including early-onset dystonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that fibroblasts from affected individuals have dramatic loss of
      SHQ1 protein.
    explanation: Patient cells lose SHQ1 protein, consistent with loss of function.
  - reference: PMID:29178645
    reference_title: Inherited SHQ1 mutations impair interaction with NAP57/dyskerin, a major target in dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutations map to the SHQ1-NAP57 interface and impair the interaction
      of the recombinant SHQ1 variants with NAP57.
    explanation: Disease variants weaken SHQ1 binding to dyskerin (NAP57).
  downstream:
  - target: Impaired H/ACA snoRNP Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37818102
      reference_title: Human SHQ1 variants R335C and A426V lead to severe ribosome biogenesis defects when expressed in yeast.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        When shifted to restrictive conditions, yeast cells progressively lost
        H/ACA snoRNAs and accumulated unprocessed pre-rRNAs, which led to
        reduced production of ribosomes.
      explanation: >-
        Yeast expressing the patient variants in place of their own Shq1 lose
        H/ACA snoRNAs; indirect because the system is a yeast complementation
        strain.
- name: Impaired H/ACA snoRNP Assembly
  description: >-
    SHQ1 binds newly made dyskerin before the other core proteins and the H/ACA
    RNA, acting as an RNA placeholder that escorts it to the nucleus. Without
    it, H/ACA snoRNAs, including telomerase RNA, fail to accumulate.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: box H/ACA snoRNP assembly
    modifier: DECREASED
    term:
      id: GO:0000493
      label: box H/ACA snoRNP assembly
  evidence:
  - reference: PMID:19383767
    reference_title: SHQ1 is required prior to NAF1 for assembly of H/ACA small nucleolar and telomerase RNPs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, knockdown of cellular SHQ1 prevents accumulation of a newly
      synthesized H/ACA reporter RNA and generally reduces the levels of
      endogenous H/ACA RNAs including telomerase RNA.
    explanation: In human cells, loss of SHQ1 lowers H/ACA RNA levels.
  - reference: PMID:22085966
    reference_title: The H/ACA RNP assembly factor SHQ1 functions as an RNA mimic.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that Shq1p operates as a Cbf5p chaperone during RNP assembly
      by acting as an RNA placeholder, thereby preventing Cbf5p from
      nonspecific RNA binding before association with an H/ACA RNA and the
      other core RNP proteins.
    explanation: Structural basis for the chaperone role of SHQ1 in assembly.
  downstream:
  - target: Defective rRNA Processing and Ribosome Biogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34542157
      reference_title: Compound heterozygous variants in SHQ1 are associated with a spectrum of neurological features, including early-onset dystonia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Variants from both families were expressed in Saccharomyces cerevisiae,
        resulting in a strong reduction in H/ACA snoRNA production and
        remarkable defects in rRNA processing and ribosome formation.
      explanation: >-
        Patient variants in yeast reduce H/ACA snoRNAs and disrupt rRNA
        processing and ribosome formation.
  - target: Impaired Cortical Neuronal Migration and Neurite Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed by the authors; the step from H/ACA RNP assembly to neuronal
      migration has not been traced.
    evidence:
    - reference: PMID:39326821
      reference_title: Pathogenic SHQ1 variants result in disruptions to neuronal development and the dopaminergic pathway.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Most SHQ1 variants attenuated their binding ability toward DKC1,
        implying SHQ1 variants may influence brain development by disrupting
        the assembly and biogenesis of H/ACA RNPs.
      explanation: >-
        Co-immunoprecipitation result linking weakened SHQ1-dyskerin binding to
        the brain-development phenotype as an inference.
- name: Defective rRNA Processing and Ribosome Biogenesis
  description: >-
    Shown in yeast: cells carrying patient SHQ1 variants accumulate
    unprocessed pre-rRNAs and make fewer ribosomes, with reduced levels of the
    dyskerin homologue Cbf5. This has not yet been measured in patient neural
    cells.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: rRNA processing
    modifier: DECREASED
    term:
      id: GO:0006364
      label: rRNA processing
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:

discussions:
- discussion_id: shq1_dopamine_direction
  prompt: >-
    Is the dopaminergic pathway in SHQ1 disease underactive, as patient CSF and
    striatal imaging suggest, or overactive, as in SHQ1-knockdown cultured
    neurons, and does either explain the dystonia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Striatal Dopaminergic Dysfunction
  - experimental_models#SHQ1-knockdown cultured neurons
  rationale: >-
    Patients have low CSF homovanillic acid and reduced striatal dopamine
    transporter uptake, yet levodopa gave no clear response, and SHQ1
    knockdown in cultured neurons raised dopaminergic function. The same paper
    concludes that SHQ1 works by upregulating dopaminergic pathways, which sits
    awkwardly with its own result. The model and the patients disagree on
    direction, and the treatment response argues against a simple presynaptic
    dopamine deficiency.
- discussion_id: shq1_ribosome_to_neuron_gap
  prompt: >-
    Does SHQ1 deficiency impair ribosome biogenesis or RNA pseudouridylation in
    human neurons, and is that what disrupts neuronal migration?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective rRNA Processing and Ribosome Biogenesis
  - pathophysiology#Impaired Cortical Neuronal Migration and Neurite Growth
  rationale: >-
    The H/ACA snoRNA and rRNA processing defects are shown in yeast and the
    neuronal defects in mouse knockdown and SH-SY5Y cells, but no study has
    measured snoRNP assembly or ribosome output in patient-derived neurons, so
    the link between the two is inferred.

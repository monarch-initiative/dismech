    explanation: Patient variants slow migration of human neuronal cells.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39326821
      reference_title: Pathogenic SHQ1 variants result in disruptions to neuronal development and the dopaminergic pathway.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        SHQ1 plays an essential role in brain development and dopaminergic
        function by upregulating dopaminergic pathways and regulating the
        behaviors of neural progenitors and their neuronal progeny, potentially
        leading to dystonia and developmental delay in patients.
      explanation: >-
        The authors propose the neuronal development defect as the route to
        developmental delay.
- name: Striatal Dopaminergic Dysfunction
  description: >-
    Patients have low CSF homovanillic acid and reduced striatal dopamine
    transporter uptake. In SHQ1-knockdown cultured neurons, by contrast,
    dopaminergic function increased, so the direction of the dopaminergic change and its
    link to dystonia are unresolved. Levodopa replacement has not produced a
    clear response.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:

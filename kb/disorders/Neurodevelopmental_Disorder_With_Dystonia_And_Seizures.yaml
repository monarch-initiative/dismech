genetic:
- name: SHQ1
  gene_term:
    preferred_term: SHQ1
    term:
      id: hgnc:25543
      label: SHQ1
  presence: PRESENT
  relationship_type: CAUSATIVE
  association: >-
    Biallelic SHQ1 variants cause the disorder. Reported alleles are mostly
    missense (for example p.L333V, recurrent in a Taiwanese series, and the
    homozygous p.I278T) with some truncating alleles (p.Y65X, a recurrent
    c.828_831del frameshift). Variants weaken SHQ1 binding to dyskerin, and
    the R335C and A426V variants fail or only partly complement Shq1 loss in
    yeast. No ClinGen gene-disease validity record was found for SHQ1.
  evidence:
  - reference: PMID:34542157
    reference_title: Compound heterozygous variants in SHQ1 are associated with a spectrum of neurological features, including early-onset dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study identifies SHQ1 as associated with neurological disease,
      including early-onset dystonia, and begins to delineate the molecular
      etiology of this novel condition.
    explanation: Establishes SHQ1 as the causal gene.
  - reference: PMID:36847845
    reference_title: Biallelic SHQ1 variants in early infantile hypotonia and paroxysmal dystonia as the leading manifestation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four novel SHQ1 variants in 16 alleles were identified: 9 alleles (56%)
      were c.997C > G (p.L333V); 4 (25%) were c.195T > A (p.Y65X); 2 (13%)
      were c.812T > A (p.V271E); and 1 (6%) was c.146T > C (p.L49S).
    explanation: Allelic spectrum in seven families.
diagnosis:
- name: Genome or exome sequencing
  description: >-
    Diagnosis is molecular, by finding biallelic SHQ1 variants on genome or
    exome sequencing. Reanalysis of an initially nondiagnostic exome has
    found the variants in at least one case.
  diagnosis_term:
    preferred_term: whole genome sequencing
    term:

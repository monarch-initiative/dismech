  - reference: PMID:39326821
    reference_title: Pathogenic SHQ1 variants result in disruptions to neuronal development and the dopaminergic pathway.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      There was also increased dopaminergic function upon SHQ1 knockdown, which
      may underlie the increased glutamate toxicity of the cells.
    explanation: >-
      In SHQ1-knockdown cultured neurons the dopaminergic change goes the
      other way, contradicting a simple decrease.
  downstream:

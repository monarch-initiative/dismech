      and 1.2 (95% CI 1.1, 1.3) per 10,000 livebirths, respectively
    explanation: National cohort birth prevalence, complex (syndromic) CDH arm.
progression:
- phase: Fetal
  age_range: Second and third trimester
  notes: >-
    Most cases are now recognised before birth. Antenatal ultrasound screening
    detects the majority of fetuses, which allows in utero referral to a
    tertiary centre, severity stratification, and delivery planning; the
    prenatally measurable indices of lung size and liver position already
    separate outcome groups at this stage.
  evidence:
  - reference: PMID:29924391
    reference_title: "Proposal for standardized prenatal ultrasound assessment of the fetus with congenital diaphragmatic hernia by the European reference network on rare inherited and congenital anomalies (ERNICA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antenatal ultrasound screening identifies more than 70% of cases,
      providing the opportunity for in utero referral to a tertiary care center
      for expert assessment and perinatal management.
    explanation: >-
      Establishes prenatal recognition as the normal entry point of the disease
      course in contemporary practice.
  - reference: PMID:29924391
    reference_title: "Proposal for standardized prenatal ultrasound assessment of the fetus with congenital diaphragmatic hernia by the European reference network on rare inherited and congenital anomalies (ERNICA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The combination of lung size and liver herniation is a widely accepted
      method to stratify fetuses into groups with an increasing degree of
      pulmonary hypoplasia and corresponding mortality rates.
    explanation: >-
      Shows that outcome stratification is already possible in the fetal phase.
- phase: Neonatal
  age_range: Birth to 30 days
  notes: >-
    The first month carries most of the mortality. In a 2,078-neonate
    multicentre cohort, 56% of infants had either died or met criteria for
    chronic lung disease by day 30 and overall mortality was 31%; among those
    surviving to day 30, 41% had bronchopulmonary dysplasia. Population-based
    survival is substantially worse than survival reported by specialist
    hospital series, the so-called hidden mortality of CDH.
  evidence:
  - reference: PMID:21042035
    reference_title: "Risk factors for chronic lung disease and mortality in newborns with congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At day 30, 56% of the patients had either died or met the criteria for
      BPD. In infants who survived until day 30, the prevalence of BPD was 41%.
      The overall mortality rate was 31%.
    explanation: >-
      Quantifies neonatal mortality and chronic lung disease in a large
      multicentre CDH cohort.
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best hospital series report 80% survival but it remains around 50% in
      population-based studies.
    explanation: >-
      Contrasts referral-centre survival with population-based survival.
- phase: Long-term survivorship
  age_range: Infancy through childhood
  notes: >-
    Survival is not recovery. Survivors carry chronic respiratory, nutritional,
    gastrointestinal, musculoskeletal and neurodevelopmental morbidity, and
    those repaired for a large defect are at risk of recurrent herniation:
    recurrence reached 46.7% after patch repair versus 6.3% after muscle flap
    repair over a median 5-year follow-up. Recurrence surveillance and
    multidisciplinary follow-up are therefore part of care rather than optional.
  evidence:
  - reference: PMID:40834916
    reference_title: "Long-term outcomes after muscle flap repair in congenital diaphragmatic hernia: A retrospective study at a single institution."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the MFR group, 5/80 (6.3 %) had a recurrence compared to 7/15 (46.7 %)
      in the patch group (p=<0.001).
    explanation: >-
      Quantifies post-repair recurrence and its dependence on the repair
      technique used for a large defect.
  - reference: PMID:31482324
    reference_title: "Left congenital diaphragmatic hernia-associated musculoskeletal deformities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This fact leads to an increase in the morbidity and extrapulmonary
      complications in the long term such as failure to thrive, hernia
      recurrence, neurodevelopmental delay, gastrointestinal problems, and
      musculoskeletal anomalies.
    explanation: >-
      Enumerates the long-term extrapulmonary complication burden that defines
      this phase.
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survivors often have long-term, multisystem morbidities, including
      pulmonary dysfunction, gastroesophageal reflux, musculoskeletal
      deformities and neurodevelopmental impairment.
    explanation: >-
      Names the four morbidity domains that dominate the survivorship phase.
mechanistic_hypotheses:
- hypothesis_group_id: dual_hit
  hypothesis_label: Dual-hit model (primary lung maldevelopment plus mechanical compression)
  status: CANONICAL
  description: >-
    The dual-hit model holds that the lung phenotype in CDH is not purely
    mechanical. A first hit perturbs lung development directly, in parallel
    with the diaphragmatic lesion and through the same mesenchymal and
    retinoid-dependent programmes; a second hit is the physical compression of
    the developing lung by herniated viscera. This model explains why the
    contralateral lung is also hypoplastic and why anatomic repair does not
    immediately reverse the lung and vascular disease.
  evidence:
  - reference: PMID:39183805
    reference_title: "Role of genetics and the environment in the etiology of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The occurrence of CDH and pulmonary hypoplasia is theorized to result
      from both abnormalities in signaling pathways of smooth muscle cells in
      pleuroperitoneal folds and mechanical compression by abdominal organs
      within the chest cavity on the developing lungs.
    explanation: >-
      States both components of the dual-hit model as jointly responsible for
      the CDH lung phenotype.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in CDH, this embryologic development is impaired which, in conjunction
      with external compression, stifle pulmonary vascular maturation
    explanation: >-
      Applies the same dual-hit logic to the pulmonary vascular arm: intrinsic
      developmental impairment acting together with external compression.
  - reference: PMID:10751355
    reference_title: "Dual-hit hypothesis explains pulmonary hypoplasia in the nitrofen model of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we postulate the dual-hit hypothesis, which explains pulmonary
      hypoplasia in CDH by two insults, one affecting both lungs before
      diaphragm development and one affecting the ipsilateral lung after
      defective diaphragm development.
    explanation: >-
      The primary statement of the dual-hit hypothesis, from nitrofen-exposed
      rat lung explants cultured without any diaphragmatic defect.
- hypothesis_group_id: mechanical_compression_only
  hypothesis_label: Purely mechanical compression model
  status: ALTERNATIVE
  description: >-
    The older and still not fully excluded model holds that the lung in CDH is
    intrinsically normal and that pulmonary hypoplasia is entirely secondary to
    mechanical compression by herniated viscera during the pseudoglandular and
    canalicular stages. Under this model the only causal route to pulmonary
    hypoplasia is the compression edge, and prenatal decompression or tracheal
    occlusion should be able to restore normal lung growth. It is retained here
    as an explicit alternative because the pathogenesis of the CDH lung
    phenotype is described in the primary literature as controversial, and
    because the fetal-lamb surgical-compression experiments that founded the
    field are consistent with it. Evidence against it includes hypoplasia of
    the contralateral lung and lung maldevelopment in explants never exposed to
    compression.
  evidence:
  - reference: PMID:10751355
    reference_title: "Dual-hit hypothesis explains pulmonary hypoplasia in the nitrofen model of congenital diaphragmatic hernia."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, the pathogenesis of pulmonary hypoplasia in case of CDH is
      controversial.
    explanation: >-
      Establishes that the compression-only versus primary-maldevelopment
      question is a genuine live controversy rather than a settled matter,
      which is why the alternative is curated rather than discarded.
  - reference: PMID:10751355
    reference_title: "Dual-hit hypothesis explains pulmonary hypoplasia in the nitrofen model of congenital diaphragmatic hernia."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      Our results indicate that Nitrofen negatively influences branching
      morphogenesis of the lung.
    explanation: >-
      Impaired branching in an explant system with no diaphragm and no
      compression is direct evidence against a purely mechanical model.
- hypothesis_group_id: retinoid
  hypothesis_label: Retinoid hypothesis of abnormal diaphragm development
  status: CANONICAL
  description: >-
    The retinoid hypothesis, formulated by Greer, Babiuk and Thebaud in 2003
    and reviewed twenty years later, holds that abnormalities of retinoic acid
    signalling early in gestation underlie abnormal diaphragm development in
    CDH. It is supported by teratogen models that inhibit retinoic acid
    synthesis, by vitamin-A-deficiency models, and by human genetic lesions in
    retinoid transport and signalling such as STRA6 and NR2F2.
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Retinoid Hypothesis is one of the leading hypotheses to explain the
      etiology of CDH
    explanation: Establishes the standing of the retinoid hypothesis in the field.
discussions:
- discussion_id: cdh_ino_efficacy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does inhaled nitric oxide improve outcome in CDH-associated pulmonary
    hypertension, or does its routine use mainly delay escalation to
    extracorporeal support?
  attaches_to:
  - "pathophysiology#Persistent Pulmonary Hypertension of the Newborn"
  rationale: >-
    Inhaled nitric oxide is widely used in CDH by extrapolation from other
    causes of persistent pulmonary hypertension of the newborn, but the CDH
    vascular bed is structurally reduced rather than merely vasoconstricted, so
    a selective vasodilator may have limited substrate on which to act. The
    published evidence base is small and the reviewed conclusion is that the
    role of iNO in CDH is controversial.
  proposed_experiments:
  - experiment_id: cdh_ino_rct
    name: Randomised trial of inhaled nitric oxide in CDH-associated pulmonary hypertension
    description: >-
      An adequately powered randomised trial of inhaled nitric oxide versus
      placebo in CDH-associated pulmonary hypertension, stratified by
      echocardiographic phenotype, with time to extracorporeal support as a
      co-primary outcome alongside survival to discharge.
  evidence:
  - reference: PMID:32384329
    reference_title: "The Use of Inhaled Nitric Oxide in Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the role of iNO as a treatment for CDH is controversial.
    explanation: Documents that the efficacy question is unresolved in the literature.
- discussion_id: cdh_nitrofen_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How faithfully do the nitrofen rat model and retinoid-pathway mouse mutants
    reproduce human CDH, given that the human disease is genetically
    heterogeneous and usually not attributable to a single teratogen or a
    single retinoid-pathway lesion?
  attaches_to:
  - "pathophysiology#Retinoid Signaling and Pleuroperitoneal Fold Mesenchymal Deficit"
  rationale: >-
    Most mechanistic knowledge of diaphragm and lung maldevelopment in CDH
    derives from teratogen-induced and genetically modified rodents. These
    models reproduce components of the phenotype - amuscular diaphragm,
    posterolateral defects, reduced branching - but no single model captures
    the full human spectrum, and rodent lethality prevents study of the chronic
    survivor morbidity that dominates the human disease.
  proposed_experiments:
  - experiment_id: cdh_ppf_cross_species_sc
    name: Cross-species single-cell comparison of pleuroperitoneal fold mesenchyme
    description: >-
      Single-cell profiling of human fetal pleuroperitoneal fold and lung
      mesenchyme compared against the corresponding rodent compartments in
      nitrofen-exposed and retinoid-pathway mutant animals, to test whether the
      cell states perturbed in the models are the ones perturbed in human CDH.
  evidence:
  - reference: PMID:35633948
    reference_title: "Genetically Modified Mouse Models of Congenital Diaphragmatic Hernia: Opportunities and Limitations for Studying Altered Lung Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the generation of genetically modified mouse models, which show both
      diaphragm and lung abnormalities, has resulted in the discovery of
      multiple genes and signaling pathways involved in the pathogenesis of CDH
    explanation: >-
      Establishes that the mechanistic evidence base is largely murine, which
      is what makes translational fidelity the open question.
  - reference: PMID:35633948
    reference_title: "Genetically Modified Mouse Models of Congenital Diaphragmatic Hernia: Opportunities and Limitations for Studying Altered Lung Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      whilst also discussing the significance of these genetic models for
      studying altered lung development with regard to the human situation
    explanation: >-
      The cited review itself frames the human relevance of these models as a
      question requiring discussion rather than a settled matter.
diagnosis:
- name: Prenatal ultrasound with observed-to-expected lung-area-to-head-circumference ratio (O/E LHR)
  description: >-
    Mid-trimester ultrasound establishes the diagnosis by demonstrating
    intrathoracic stomach or bowel, mediastinal shift, and a small ipsilateral
    lung. The observed-to-expected lung-area-to-head-circumference ratio is the
    primary sonographic severity metric: unlike the raw LHR it is independent
    of gestational age, and it predicts postnatal survival. It is the
    measurement on which FETO eligibility thresholds are set.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:17587219
    reference_title: "Observed to expected lung area to head circumference ratio in the prediction of survival in fetuses with isolated diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In fetuses with both left- and right-sided CDH, measurement of the
      observed to expected LHR provides a useful prediction of subsequent
      survival.
    explanation: >-
      The multicentre study of 354 fetuses that established O/E LHR as the
      standard prenatal severity metric in isolated CDH.
  - reference: PMID:17587219
    reference_title: "Observed to expected lung area to head circumference ratio in the prediction of survival in fetuses with isolated diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In CDH, the LHR increases while observed to expected LHR is independent
      of gestational age.
    explanation: >-
      States why the observed-to-expected ratio, and not the raw LHR, is the
      metric that can be compared across gestational ages.
- name: Fetal MRI total fetal lung volume (O/E TFLV)
  description: >-
    Fetal magnetic resonance imaging measures observed-to-expected total fetal
    lung volume, complements ultrasound severity assessment, and better
    delineates the extent of liver herniation. Its discriminative performance
    against O/E LHR is comparable in some centres and superior in others, so
    the two are used together rather than as substitutes.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39133867
    reference_title: "Observed-to-expected lung-area-to-head-circumference ratio on ultrasound examination vs total fetal lung volume on magnetic resonance imaging in prediction of survival in fetuses with left-sided diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the survival rates at discharge were lower in left-sided CDH (odds ratio
      (OR), 0.349 (95% CI, 0.133-0.918), P = 0.033) and those with
      intrathoracic liver (OR, 0.297 (95% CI, 0.141-0.628), P = 0.001), and
      higher with increasing O/E-TFLV
    explanation: >-
      Quantifies O/E TFLV, laterality and intrathoracic liver as independent
      predictors of survival to discharge.
  - reference: PMID:39133867
    reference_title: "Observed-to-expected lung-area-to-head-circumference ratio on ultrasound examination vs total fetal lung volume on magnetic resonance imaging in prediction of survival in fetuses with left-sided diaphragmatic hernia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the predictive value for postnatal survival of O/E-TFLV on MRI
      examination and O/E-LHR on ultrasound examination was similar in one
      center (Mannheim)
    explanation: >-
      Records honestly that MRI volumetry did not uniformly outperform
      ultrasound; the comparison was centre-dependent.
- name: Prenatal risk stratification (liver position, defect side and size)
  description: >-
    Beyond lung size, prognosis is stratified by side of the defect, the
    presence and extent of intrathoracic liver herniation, defect size,
    gestational age at diagnosis and delivery, and the presence of additional
    structural or genetic anomalies. Stratification drives counselling, fetal
    intervention eligibility, and planned delivery at a centre with
    extracorporeal support.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:39431204
    reference_title: "Prenatal diagnosis and risk stratification of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors that may affect the immediate and long-term prognosis for CDH
      include prenatal diagnosis, gestational age at detection and delivery,
      side of the defect, presence of additional structural or genetic
      abnormalities, defect size, estimation of fetal lung volume, the extent
      of visceral herniation, and the delivery center's experience in caring
      for neonates with CDH.
    explanation: >-
      Enumerates the prenatal variables that constitute contemporary CDH risk
      stratification.
  - reference: PMID:39431204
    reference_title: "Prenatal diagnosis and risk stratification of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Advanced antenatal imaging, including ultrasound and magnetic resonance
      imaging, has made it possible to prognosticate severity of CDH and to
      stratify risk when counseling expectant parents.
    explanation: >-
      Establishes combined ultrasound and MRI assessment as the basis of
      prenatal severity prognostication.
- name: Postnatal chest radiography with nasogastric tube
  description: >-
    Plain radiography of the chest and abdomen shows bowel loops or solid
    viscera in the hemithorax, mediastinal shift, and a paucity of abdominal
    gas. Passing a nasogastric tube before the film localises the stomach and
    is the manoeuvre that separates CDH from an intrinsic cystic or hyperlucent
    lung lesion.
  diagnosis_term:
    preferred_term: radiographic imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      passing a naso-gastric catheter into the stomach before a plain X-ray of
      the thorax and abdomen may help to locate it
    explanation: >-
      Describes the standard postnatal radiographic manoeuvre for confirming
      CDH and excluding its imaging mimics.
- name: Neonatal echocardiography
  description: >-
    Echocardiography excludes associated structural heart disease, estimates
    pulmonary arterial pressure and the direction of shunting, and assesses
    right and left ventricular function. Because CDH cardiopulmonary physiology
    is labile, serial rather than single assessment is required.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Longitudinal re-evaluation is an important consideration due to the
      complexity and dynamic nature of CDH cardiopulmonary physiology.
    explanation: >-
      Supports serial rather than one-off cardiopulmonary assessment in CDH.
- name: Chromosomal microarray
  description: >-
    First-tier genetic test once CDH is identified, aimed at the pathogenic
    copy number variants (including the recurrent 15q26 deletion involving
    NR2F2 and the 8p23.1 deletion involving GATA4) that account for a
    substantial share of complex disease.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: >-
    Reported diagnostic yield of karyotype or chromosomal microarray after a
    prenatal CDH diagnosis is approximately 10%.
  evidence:
  - reference: PMID:34911129
    reference_title: "Genetic Diagnostic Strategies and Counseling for Families Affected by Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until recently, the common practice was (molecular) karyotyping or
      chromosome microarray if the CDH diagnosis is made prenatally with a 10%
      diagnostic yield.
    explanation: >-
      Establishes chromosomal microarray as the first-tier genetic test and
      quantifies its yield.
- name: Trio exome or genome sequencing
  description: >-
    Second-tier genetic test for microarray-negative patients, detecting the
    sequence variants in genes such as ZFPM2, GATA4, GATA6, WT1, MYRF, LONP1
    and PBX1. A family-based trio design is recommended because a large share
    of causal variants are de novo, and testing is offered irrespective of
    whether the CDH is isolated or complex.
  diagnosis_term:
    preferred_term: trio exome or genome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: >-
    Additional diagnostic yield of 10 to 20% over chromosomal microarray.
  evidence:
  - reference: PMID:34911129
    reference_title: "Genetic Diagnostic Strategies and Counseling for Families Affected by Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Undiagnosed patients can be reflexed to trio exome/genome sequencing with
      an additional diagnostic yield of 10 to 20%.
    explanation: >-
      Establishes the reflex-to-sequencing step of the workup and quantifies
      the incremental yield.
  - reference: PMID:34911129
    reference_title: "Genetic Diagnostic Strategies and Counseling for Families Affected by Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All families with a child with CDH with or without additional
      malformations should be offered genetic counseling and testing in a
      family-based trio approach.
    explanation: >-
      Supports offering trio testing and counselling to all CDH families, not
      only those with syndromic features.
  - reference: PMID:34911129
    reference_title: "Genetic Diagnostic Strategies and Counseling for Families Affected by Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even with a genetic diagnosis, there can be a range of clinical outcomes.
    explanation: >-
      Counselling caveat: a molecular diagnosis does not by itself predict
      severity.

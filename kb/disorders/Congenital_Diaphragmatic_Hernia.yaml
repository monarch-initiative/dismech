  downstream:
  - target: Hypoplastic left ventricle
    description: Reduced left ventricular dimensions are the observed structural phenotype.
    causal_link_type: DIRECT
- name: Refractory Hypoxemia and Neonatal Respiratory Failure
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The combination of reduced alveolar gas-exchange surface, ventilation

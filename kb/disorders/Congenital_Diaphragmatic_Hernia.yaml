      pulmonary hypoplasia, as compared to expectant management during
      pregnancy, both followed by standardized postnatal care.
    explanation: >-
      The registered protocol for the severe-hypoplasia arm of the TOTAL
      programme, which demonstrated a survival benefit for FETO.

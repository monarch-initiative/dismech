notes: >-
  Deep research for this entry was performed with the Edison Scientific
  (falcon) provider; the raw report is at
  research/Congenital_Diaphragmatic_Hernia-deep-research-falcon.md. Every PMID
  and snippet was independently re-fetched and verified against the cached
  abstract. The GeneReviews "Congenital Diaphragmatic Hernia Overview" chapter
  (PMID:20301533) is retired and was therefore not used as a phenotype
  baseline; the syndrome-specific GeneReviews chapters listed above were used
  instead.


  Genetic architecture: the `genetic` block lists genes with Mendelian or
  near-Mendelian support (mostly through recognised syndromic forms), while the
  `inheritance` block records the polygenic liability component demonstrated by
  genome-wide analysis (PMID:39332409). These are complementary rather than
  contradictory - rare large-effect variants and common polygenic background
  contribute additively, and polygenic risk does not differ between isolated
  and complex CDH. LONP1 is typed RISK_FACTOR rather than CAUSATIVE for this
  reason. Individual susceptibility loci (the WNT5A- and SHH-adjacent regions)
  are regulatory rather than coding and are not curated as `genetic` entries.


  Module conformance: the pulmonary vascular node conforms to
  `pulmonary_vascular_remodeling` for the muscularization and vasoconstriction
  arm, which is genuinely shared. The developmental hypoplasia of the CDH
  vascular bed (fewer arterial generations, an arrested rather than obliterated
  bed) is disease-specific and is not represented in that module, and plexiform
  lesions are not a feature of neonatal CDH.

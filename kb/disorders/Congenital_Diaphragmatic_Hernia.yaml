  downstream:
  - target: Right ventricular failure
    description: Right heart decompensation is the clinical manifestation.
    causal_link_type: DIRECT
- name: Refractory Hypoxemia and Neonatal Respiratory Failure
  role: consequence
  description: >-
    The combination of reduced alveolar gas-exchange surface, ventilation
    limited by a small and stiff lung, and extrapulmonary right-to-left
    shunting produces severe hypoxemia that is frequently refractory to
    conventional ventilation and inhaled vasodilators.
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a severe birth defect and a
      major cause of neonatal respiratory distress.
    explanation: >-
      Identifies neonatal respiratory failure as the terminal clinical
      manifestation of the CDH causal chain.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      extracorporeal life support (ECLS) for refractory cases
    explanation: >-
      The routine need for extracorporeal support attests to the refractory
      character of the hypoxemia modelled at this node.
  downstream:
  - target: Respiratory failure
    description: Failure of gas exchange at birth.
    causal_link_type: DIRECT
  - target: Hypoxemia
    description: Severe and often labile arterial desaturation.
    causal_link_type: DIRECT
  - target: Cyanosis
    description: Visible manifestation of arterial desaturation.
    causal_link_type: DIRECT

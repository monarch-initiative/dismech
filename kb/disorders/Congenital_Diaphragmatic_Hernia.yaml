  phenotype_term:
    preferred_term: Polyhydramnios
    term:
      id: HP:0001561
      label: Polyhydramnios
  evidence:
  - reference: PMID:20301632
    reference_title: "Fryns Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pulmonary hypoplasia; and associated anomalies (polyhydramnios, cloudy
      corneas and/or microphthalmia, orofacial clefting, renal dysplasia /
      renal cortical cysts
    explanation: >-
      Polyhydramnios is documented as an associated prenatal finding in Fryns
      syndrome, the prototypical syndromic CDH; the source does not quantify it
      across CDH generally, so support is partial.
- name: Congenital heart defect

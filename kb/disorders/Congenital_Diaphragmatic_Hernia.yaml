  downstream:
  - target: Refractory Hypoxemia and Neonatal Respiratory Failure
    description: >-
      Reduced alveolar surface area limits gas exchange from the first
      postnatal breaths.
    causal_link_type: DIRECT
  - target: Pulmonary hypoplasia
    description: Reduced lung parenchymal mass is the defining structural phenotype.
    causal_link_type: DIRECT
  - target: Chronic lung disease
    description: >-
      A structurally deficient lung that must then be ventilated develops
      chronic oxygen dependency and long-term respiratory morbidity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Pulmonary Vascular Maldevelopment and Remodeling
  role: effector
  biological_scale: TISSUE
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  description: >-
    The pulmonary vascular bed in CDH is reduced in cross-sectional area, with
    fewer arterial generations per unit lung, and the pre-acinar and
    intra-acinar arteries show adventitial thickening and abnormal medial
    muscularization extending peripherally into vessels that are normally
    non-muscular. Endothelial dysfunction with reduced nitric oxide signaling
    accompanies the structural remodeling.
  cell_types:

    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Sensorineural hearing impairment
    description: >-
      Hearing loss in survivors is attributed to the same prolonged critical
      illness and extracorporeal support exposure rather than to a primary
      cochlear lesion.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Failure to thrive
    description: >-
      Increased work of breathing and prolonged respiratory morbidity drive
      the postnatal growth failure seen in survivors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
phenotypes:
- name: Congenital diaphragmatic hernia
  category: Structural
  description: >-
    A defect in the diaphragm permitting herniation of abdominal viscera into
    the thorax, typically detected on prenatal ultrasound or in the immediate
    newborn period.
  phenotype_term:
    preferred_term: Congenital diaphragmatic hernia
    term:
      id: HP:0000776
      label: Congenital diaphragmatic hernia
  frequency: OBLIGATE
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital Diaphragmatic Hernia (CDH) is defined by the presence of an
      orifice in the diaphragm, more often left and posterolateral that permits
      the herniation of abdominal contents into the thorax.
    explanation: >-
      The diaphragmatic orifice with visceral herniation is definitional, hence
      obligate.
- name: Posterolateral diaphragmatic hernia
  category: Structural
  subtype: Bochdalek
  description: >-
    The posterolateral (Bochdalek) defect, the most common anatomic form of
    CDH and predominantly left-sided.
  phenotype_term:
    preferred_term: Posterolateral diaphragmatic hernia
    term:
      id: HP:0025193
      label: Posterolateral diaphragmatic hernia
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This includes the most commonly occurring Bochdalek CDH that is
      characterized by a hole in the posterolateral diaphragm
    explanation: >-
      Defines the posterolateral (Bochdalek) defect and identifies it as the
      most common anatomic form.
- name: Morgagni diaphragmatic hernia
  category: Structural
  subtype: Morgagni
  description: >-
    An anterior retrosternal diaphragmatic defect, less common and frequently
    diagnosed beyond the neonatal period.
  phenotype_term:
    preferred_term: Morgagni diaphragmatic hernia
    term:
      id: HP:0025194
      label: Morgagni diaphragmatic hernia
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      anterior holes through the foramen of Morgagni
    explanation: >-
      Identifies the anterior foramen-of-Morgagni defect as a distinct
      anatomic form of CDH.
- name: Central diaphragmatic hernia
  category: Structural
  subtype: Central
  description: A central tendon defect of the diaphragm.
  phenotype_term:
    preferred_term: Central diaphragmatic hernia
    term:
      id: HP:0025195
      label: Central diaphragmatic hernia
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      diaphragm eventrations
    explanation: >-
      The same anatomic classification enumerates central tendon defects
      alongside eventrations as the rarest diaphragmatic defects; the phrase
      quoted here is the adjacent category in that enumeration.
- name: Pulmonary hypoplasia
  category: Structural
  description: >-
    Reduced lung volume with fewer airway branching generations and reduced
    alveolar number, affecting both lungs but more severely the lung
    ipsilateral to the defect.
  phenotype_term:
    preferred_term: Pulmonary hypoplasia
    term:
      id: HP:0002089
      label: Pulmonary hypoplasia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lungs are hypoplastic and have abnormal vessels that cause
      respiratory insufficiency and persistent pulmonary hypertension with high
      mortality.
    explanation: >-
      Describes hypoplastic lungs as a feature of clinically apparent CDH and
      links them to the downstream respiratory phenotype. VERY_FREQUENT is a
      clinical estimate (near-universal in clinically apparent CDH), not a
      figure extracted from the cited abstract.
- name: Pulmonary arterial hypertension
  category: Cardiovascular
  description: >-
    Persistent pulmonary hypertension of the newborn with failure of the
    normal postnatal fall in pulmonary vascular resistance.
  phenotype_term:
    preferred_term: Pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  frequency: FREQUENT
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lungs are hypoplastic and have abnormal vessels that cause
      respiratory insufficiency and persistent pulmonary hypertension with high
      mortality.
    explanation: >-
      Documents persistent pulmonary hypertension as a core CDH phenotype
      arising from abnormal pulmonary vasculature. FREQUENT is a clinical
      estimate; neither cited abstract reports a percentage.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Understanding CDH-associated PH (CDH-PH) is crucial for development of
      novel approaches and effective management due to its significant impact
      on morbidity and mortality.
    explanation: >-
      Confirms CDH-associated pulmonary hypertension as a frequent and
      outcome-determining phenotype.
- name: Respiratory failure
  category: Respiratory
  description: >-
    Neonatal respiratory failure presenting within minutes to hours of birth
    in severe cases.
  phenotype_term:
    preferred_term: Respiratory failure
    term:

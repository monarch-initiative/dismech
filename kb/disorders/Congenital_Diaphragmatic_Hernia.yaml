    modifier: DYSREGULATED
  - preferred_term: lung vasculature development
    term:
      id: GO:0060426
      label: lung vasculature development
    modifier: ABNORMAL
  - preferred_term: smooth muscle cell proliferation
    term:
      id: GO:0048659
      label: smooth muscle cell proliferation
    modifier: INCREASED
  - preferred_term: nitric oxide biosynthetic process
    term:
      id: GO:0006809
      label: nitric oxide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in CDH, this embryologic development is impaired which, in conjunction
      with external compression, stifle pulmonary vascular maturation, leading
      to reduced lung density, increased muscularization of the pulmonary
      vasculature, abnormal vascular responsiveness, and altered molecular
      signaling, all contributing to pulmonary arterial hypertension.
    explanation: >-
      Directly describes the reduced vascular bed, increased muscularisation
      and abnormal vasoreactivity that constitute this node, and links them to
      pulmonary arterial hypertension.
  - reference: PMID:31519366
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with CDH, hypoplastic pulmonary vasculature and alterations
      in multiple molecular pathways lead to pathophysiologic pulmonary
      vasculopathy and, for severe CDH, sustained, elevated pulmonary arterial
      pressures.
    explanation: >-
      Supports the causal edge from pulmonary vascular maldevelopment and
      remodelling to sustained pulmonary arterial hypertension.
  downstream:
  - target: Persistent Pulmonary Hypertension of the Newborn
    description: >-
      A reduced and abnormally muscularized vascular bed raises pulmonary
      vascular resistance after birth.
    causal_link_type: DIRECT
- name: Persistent Pulmonary Hypertension of the Newborn
  role: consequence
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Arterial Hypertension"
  description: >-
    The structurally reduced and hypermuscularized pulmonary vascular bed,
    combined with abnormal vasoreactivity, prevents the normal postnatal fall
    in pulmonary vascular resistance. Suprasystemic pulmonary pressures drive
    right-to-left shunting across the ductus arteriosus and foramen ovale.
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  evidence:
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The high mortality and morbidity rates associated with CDH are directly
      related to the severity of cardiopulmonary pathophysiology.
    explanation: >-
      Attributes CDH outcome to the combined pulmonary hypertensive and cardiac
      physiology represented by this node and its downstream targets.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Longitudinal re-evaluation is an important consideration due to the
      complexity and dynamic nature of CDH cardiopulmonary physiology.
    explanation: >-
      Supports the labile, dynamic character of CDH pulmonary hypertension
      during and after the neonatal transition.
  downstream:
  - target: Right Ventricular Pressure Overload and Failure
    description: Sustained high afterload overloads the right ventricle.
    causal_link_type: DIRECT
  - target: Refractory Hypoxemia and Neonatal Respiratory Failure
    description: >-
      Extrapulmonary right-to-left shunting adds a component of hypoxemia that
      is unresponsive to increased inspired oxygen.
    causal_link_type: DIRECT
  - target: Pulmonary arterial hypertension
    description: Elevated pulmonary arterial pressure is directly observed clinically.
    causal_link_type: DIRECT
- name: Right Ventricular Pressure Overload and Failure
  role: consequence
  description: >-
    Persistent pulmonary hypertension imposes high afterload on a right
    ventricle that may itself be hypoplastic or intrinsically dysfunctional in
    CDH. Progressive right ventricular dilation and failure reduce pulmonary
    blood flow and left ventricular preload, producing systemic hypoperfusion.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:28768736
    reference_title: "Congenital diaphragmatic hernias: from genes to mechanisms to therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernias (CDHs) and structural anomalies of the
      diaphragm are a common class of congenital birth defects that are
      associated with significant morbidity and mortality due to associated
      pulmonary hypoplasia, pulmonary hypertension and heart failure.
    explanation: >-
      Places heart failure alongside pulmonary hypoplasia and pulmonary

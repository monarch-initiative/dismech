  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Impacting ~2-3 in 10,000 births, CDH is associated with a high mortality
      rate, and long-term morbidity in survivors.
    explanation: Gives the worldwide birth prevalence of CDH.
- population: England, singleton livebirths 2002-2018
  subtype: Isolated CDH
  measure_type: BIRTH_PREVALENCE

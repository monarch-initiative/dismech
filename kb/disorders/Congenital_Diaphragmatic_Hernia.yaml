biochemical:
- name: Circulating small RNA (microRNA) severity biomarkers
  notes: >-
    No CDH-specific circulating diagnostic biomarker is in clinical use;
    severity is still assessed by imaging. Circulating small RNA species are
    the leading investigational candidate. In a prospective study of maternal
    blood, amniotic fluid, cord blood and neonatal blood, miRNA profiles
    separated CDH pregnancies from controls, and a maternal-blood miRNA set
    separated survivors from non-survivors. These are research-stage measures
    from a single small cohort, not validated clinical prognosticators.
  specificity: >-
    Not established. Reported discrimination comes from a single small
    prospective cohort without external validation.
  evidence:
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Emerging research focuses on small RNA species as biomarkers of severity
      and regenerative medicine approaches to improve fetal lung development.
    explanation: >-
      The disease primer identifies small RNA severity biomarkers as the active
      biomarker frontier in CDH.
  - reference: PMID:39505208
    reference_title: "microRNAs in congenital diaphragmatic hernia: insights into prenatal and perinatal biomarkers and altered molecular pathways."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Random forest analysis identified miRNAs in maternal blood
      (miR-7850-5p_L-1R+2, miR-942-3p, and miR-197-3p) that distinguished CDH
      survivors from nonsurvivors, with an receiver operating characteristic
      area under the curve of 1.0.
    explanation: >-
      Names the specific candidate maternal-blood miRNAs and their reported
      discrimination; support is partial because a perfect AUC in a small
      unreplicated cohort is not a validated biomarker claim.
  - reference: PMID:39505208
    reference_title: "microRNAs in congenital diaphragmatic hernia: insights into prenatal and perinatal biomarkers and altered molecular pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prenatal imaging techniques like ultrasound and MRI provide anatomical
      predictors of outcomes, but their limitations necessitate novel
      biomarkers for better prognostic accuracy.
    explanation: >-
      States the unmet need this biomarker class addresses, and confirms that
      imaging remains the current standard for severity assessment.

name: Congenital Diaphragmatic Hernia
creation_date: "2026-07-31T00:00:00Z"
category: Congenital
disease_term:
  preferred_term: congenital diaphragmatic hernia
  term:
    id: MONDO:0005711
    label: congenital diaphragmatic hernia
parents:
- Congenital malformation
- Diaphragm disorder
description: >-
  Congenital diaphragmatic hernia (CDH) is a developmental defect of diaphragm
  formation in which incomplete closure of the developing diaphragm (most often
  the pleuroperitoneal canal, less commonly the sternocostal trigone or the
  central tendon) permits herniation of abdominal viscera into the fetal
  thorax. The primary morbidity
  is not the anatomic defect itself but the associated lung disease: pulmonary
  hypoplasia with reduced airway branching and alveolarization, together with
  pulmonary vascular maldevelopment and remodeling that produce persistent
  pulmonary hypertension of the newborn, right ventricular dysfunction, and
  refractory hypoxemia.
synonyms:
- CDH
- Congenital diaphragmatic defect
- Bochdalek hernia
- Diaphragmatic hernia
has_subtypes:
- name: Bochdalek
  display_name: Bochdalek (posterolateral) hernia
  description: >-
    The posterolateral defect arising from failure of pleuroperitoneal fold
    closure, accounting for the large majority of congenital diaphragmatic
    hernias and predominantly left-sided.
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital Diaphragmatic Hernia (CDH) is defined by the presence of an
      orifice in the diaphragm, more often left and posterolateral that permits
      the herniation of abdominal contents into the thorax.
    explanation: >-
      Establishes the posterolateral (Bochdalek) left-sided defect as the
      predominant anatomic form.
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This includes the most commonly occurring Bochdalek CDH that is
      characterized by a hole in the posterolateral diaphragm
    explanation: >-
      Names the Bochdalek posterolateral defect as the most common anatomic
      form of CDH.
- name: Morgagni
  display_name: Morgagni (anterior retrosternal) hernia
  description: >-
    An anterior, retrosternal parasternal defect at the sternocostal trigone,
    much less common than Bochdalek hernia and often presenting later in
    infancy or childhood.
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      anterior holes through the foramen of Morgagni
    explanation: >-
      Identifies the anterior foramen-of-Morgagni defect as a distinct
      anatomic subtype of CDH.
- name: Central
  display_name: Central (septum transversum) defect
  description: >-
    A central tendon defect derived from abnormal septum transversum
    development, the least common anatomic form.
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      diaphragm eventrations
    explanation: >-
      The same anatomic classification enumerates central tendon defects
      alongside eventrations as the rarest diaphragmatic defects; the phrase
      quoted here is the adjacent category in that enumeration, so support for
      the central-defect subtype specifically is partial.
- name: Isolated CDH
  description: >-
    CDH occurring without additional major structural anomalies or a
    recognized syndromic diagnosis. Roughly half of all cases are isolated,
    and isolated disease has a substantially lower genetic diagnostic yield
    than complex CDH.
  evidence:
  - reference: PMID:36441118
    reference_title: "Congenital diaphragmatic hernia subtypes: Comparing birth prevalence, occurrence by maternal age, and mortality in a national birth cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 9.5 million livebirths, we identified 1285 with isolated CDH and
      1150 with complex CDH.
    explanation: >-
      A national birth cohort operationalises the isolated versus complex
      (syndromic) split and shows the two groups are of comparable size.
- name: Syndromic CDH
  display_name: Syndromic (complex) CDH
  description: >-
    CDH occurring as one feature of a recognized malformation syndrome or
    chromosomal disorder, including Fryns syndrome, Donnai-Barrow syndrome,
    Pallister-Killian syndrome, and 15q26 deletion involving NR2F2, plus
    monogenic forms attributable to ZFPM2, GATA4, WT1, LONP1, or MYRF.
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDH can be a component of Pallister-Killian, Fryns, Ghersoni-Baruch,
      WAGR, Denys-Drash, Brachman-De Lange, Donnai-Barrow or Wolf-Hirschhorn
      syndromes.
    explanation: >-
      Enumerates the recognised malformation syndromes in which CDH occurs as
      a component feature.
  - reference: PMID:36441118
    reference_title: "Congenital diaphragmatic hernia subtypes: Comparing birth prevalence, occurrence by maternal age, and mortality in a national birth cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 1-year mortality rate for complex CDH (33.1%, 95% CI 30.5, 35.9) was
      slightly higher than for isolated CDH (29.7%, 95% CI 27.3, 32.3)
    explanation: >-
      Quantifies the prognostic difference between complex (syndromic) and
      isolated CDH in a national cohort.
pathophysiology:
- name: Retinoid Signaling and Pleuroperitoneal Fold Mesenchymal Deficit
  role: trigger
  description: >-
    The proximate developmental lesion in CDH is a deficit of the
    pleuroperitoneal fold (PPF) mesenchyme, the transient structure whose
    expansion closes the pleuroperitoneal canal. Retinoic acid signaling is
    required for PPF outgrowth, and disruption of the retinoid pathway or of
    PPF mesenchymal transcriptional regulators such as ZFPM2, GATA4, NR2F2 and
    WT1 reduces the amplifying PPF cell population.
  cell_types:
  - preferred_term: pleuroperitoneal fold mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
    modifier: DECREASED
  - preferred_term: diaphragm development
    term:
      id: GO:0060539
      label: diaphragm development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39183805
    reference_title: "Role of genetics and the environment in the etiology of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The occurrence of CDH and pulmonary hypoplasia is theorized to result from
      both abnormalities in signaling pathways of smooth muscle cells in
      pleuroperitoneal folds and mechanical compression by abdominal organs
      within the chest cavity on the developing lungs.
    explanation: >-
      Places the pleuroperitoneal fold signalling defect upstream of both the
      diaphragmatic defect and the lung phenotype.
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In 2003, Greer et al. proposed the Retinoid Hypothesis, stating that the
      underlying cause of abnormal diaphragm development in CDH was related to
      altered retinoid signaling.
    explanation: >-
      States the retinoid hypothesis, the leading mechanistic account of the
      proximate developmental lesion in CDH.
  - reference: PMID:28768736
    reference_title: "Congenital diaphragmatic hernias: from genes to mechanisms to therapies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The affected genes identified in CDH patients include transcription
      factors, such as GATA4, ZFPM2, NR2F2 and WT1, and signaling pathway
      components, including members of the retinoic acid pathway.
    explanation: >-
      Links the mesenchymal transcriptional regulators and the retinoic acid
      pathway named in this node to human CDH genetics.
  downstream:
  - target: Failure of Diaphragm Closure and Visceral Herniation
    description: >-
      A deficient pleuroperitoneal fold fails to close the pleuroperitoneal
      canal, leaving a diaphragmatic defect.
    causal_link_type: DIRECT
- name: Failure of Diaphragm Closure and Visceral Herniation
  role: central_effector
  description: >-
    Incomplete closure of the pleuroperitoneal canal leaves a diaphragmatic
    defect through which abdominal viscera herniate into the thorax during
    fetal life. The herniated viscera occupy the hemithorax and compress the
    developing lung, most often on the left.
  locations:
  - preferred_term: diaphragm
    term:
      id: UBERON:0001103
      label: diaphragm
  biological_processes:
  - preferred_term: diaphragm morphogenesis
    term:
      id: GO:0060540
      label: diaphragm morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a rare birth defect
      characterized by incomplete closure of the diaphragm and herniation of
      fetal abdominal organs into the chest that results in pulmonary
      hypoplasia, postnatal pulmonary hypertension owing to vascular
      remodelling and cardiac dysfunction.
    explanation: >-
      Establishes the causal ordering from incomplete diaphragm closure and
      visceral herniation to pulmonary hypoplasia and pulmonary hypertension.
  - reference: PMID:31519366
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a neonatal pathology in which
      intrathoracic herniation of abdominal viscera via diaphragmatic defect
      results in aberrant pulmonary and cardiovascular development.
    explanation: >-
      Supports the edge from the diaphragmatic defect to both the pulmonary
      parenchymal and the pulmonary vascular arms of the graph.
  downstream:
  - target: Pulmonary Hypoplasia
    description: >-
      Space occupation by herniated viscera restricts lung growth during the
      pseudoglandular and canalicular stages.
    causal_link_type: DIRECT
  - target: Pulmonary Vascular Maldevelopment and Remodeling
    description: >-
      The same developmental window that limits airway branching also limits
      and distorts pulmonary vascular development.
    causal_link_type: DIRECT
  - target: Congenital diaphragmatic hernia
    description: The anatomic defect is the defining clinical finding.
    causal_link_type: DIRECT
- name: Pulmonary Hypoplasia
  role: effector
  description: >-
    Both lungs, and particularly the ipsilateral lung, show reduced airway
    branching generations, reduced alveolar number and surface area, thickened
    alveolar septa, and surfactant abnormalities. The parenchymal deficit is
    bilateral even when the defect is unilateral, indicating a primary
    developmental component in addition to mechanical compression.
  cell_types:

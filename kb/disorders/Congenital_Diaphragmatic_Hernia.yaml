  - reference: PMID:24385578
    reference_title: "Whole exome sequencing identifies de novo mutations in GATA6 associated with congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To determine the frequency of GATA6 mutations in CDH, we sequenced the
      gene in 378 patients with CDH. We identified one additional de novo
      mutation
    explanation: >-
      A 378-patient cohort screen adds a third de novo GATA6 variant, showing
      the mechanism is recurrent but individually rare.
- name: PBX1
  gene_term:

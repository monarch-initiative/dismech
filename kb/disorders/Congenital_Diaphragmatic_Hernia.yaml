notes: >-
  Deep research for this entry was performed with the Edison Scientific
  (falcon) provider; the raw report is at
  research/Congenital_Diaphragmatic_Hernia-deep-research-falcon.md. Every PMID
  and snippet was independently re-fetched and verified against the cached
  abstract. The GeneReviews "Congenital Diaphragmatic Hernia Overview" chapter
  (PMID:20301533) is retired and was therefore not used as a phenotype
  baseline; the syndrome-specific GeneReviews chapters listed above were used
  instead.


  Genetic architecture: the `genetic` block lists genes with Mendelian or
  near-Mendelian support (mostly through recognised syndromic forms), while the
  `inheritance` block records the polygenic liability component demonstrated by
  genome-wide analysis (PMID:39332409). These are complementary rather than
  contradictory - rare large-effect variants and common polygenic background
  contribute additively, and polygenic risk does not differ between isolated
  and complex CDH. LONP1 is typed RISK_FACTOR rather than CAUSATIVE for this
  reason. Individual susceptibility loci (the WNT5A- and SHH-adjacent regions)
  are regulatory rather than coding and are not curated as `genetic` entries.


  Dual-hit debate: the pathograph encodes the question of compression versus
  primary maldevelopment as two competing hypothesis groups rather than
  asserting a settled answer. `dual_hit` (CANONICAL) owns an extra edge from
  the retinoid/pleuroperitoneal-fold trigger straight to Pulmonary Hypoplasia -
  the compression-independent "first hit" - while `mechanical_compression_only`
  (ALTERNATIVE) owns only the compression edge. The compression edge itself is
  tagged with both groups, because it is common to the two models. Readers who
  reject the dual-hit model can therefore delete the `dual_hit` edges and
  recover the purely mechanical graph. The founding nitrofen explant evidence
  (PMID:10751355) is tagged IN_VITRO and is never the sole support for a human
  claim.


  Unconnected phenotypes: `Congenital heart defect` and `Polyhydramnios` are
  deliberately left with no incoming causal edge. Co-occurring cardiovascular
  malformation is a parallel developmental-field anomaly rather than a
  consequence of the CDH cascade, and polyhydramnios is a prenatal association
  curated here from the syndromic (Fryns) context. Asserting a `downstream`
  edge for either would overstate the evidence.


  Module conformance: the pulmonary vascular node conforms to
  `pulmonary_vascular_remodeling` for the muscularization and vasoconstriction
  arm, which is genuinely shared. The developmental hypoplasia of the CDH
  vascular bed (fewer arterial generations, an arrested rather than obliterated
  bed) is disease-specific and is not represented in that module, and plexiform
  lesions are not a feature of neonatal CDH.


  ALDH1A2 placement: ALDH1A2 (RALDH2) is carried on the retinoid
  pathophysiology node as a pathway component rather than in `genetic`, because
  there is no human variant evidence implicating it in CDH. The supporting
  study (PMID:25416379) finds ALDH1A2 deregulated in human CDH lung but
  concludes the overexpression is a consequence of CDH-induced lung injury
  rather than a primary event; the causal link is pharmacological (ALDH1A2
  inhibition produces a posterolateral defect), which is a mechanism claim, not
  a gene-disease validity claim. SLIT3 is typed RISK_FACTOR, not CAUSATIVE, for
  the parallel reason: the human evidence is a single consanguineous family.


  Recurrent post-repair herniation is curated in `progression` (long-term
  survivorship) rather than as a phenotype, because HPO has no term for
  recurrence of a repaired diaphragmatic hernia and reusing HP:0000776
  (Congenital diaphragmatic hernia) for a post-surgical complication would be a
  term misuse.


  Left heart hypoplasia is modelled as its own node and phenotype (HP:0004383)
  rather than folded into the right ventricular arm. It is a hypoplasia of
  degree driven by mediastinal compression in left-sided disease, not
  hypoplastic left heart syndrome, and the cited cohort reports z-score
  distributions rather than a proportion affected, so no frequency band is
  asserted.

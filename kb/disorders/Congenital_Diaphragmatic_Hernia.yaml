- name: LONP1
  gene_term:
    preferred_term: LONP1
    term:
      id: hgnc:9479
      label: LONP1
  relationship_type: RISK_FACTOR
  notes: >-
    LONP1 encodes the mitochondrial Lon protease. In an 827-proband CDH cohort,
    de novo and ultra-rare inherited, largely heterozygous LONP1 variants
    clustered in the functional domains and segregated with CDH, implicating
    LONP1 as a CDH risk gene rather than a classical Mendelian cause. This is
    mechanistically distinct from the biallelic LONP1 phenotype (CODAS
    syndrome), which does not feature congenital diaphragmatic hernia.
  evidence:
  - reference: PMID:34547244
    reference_title: "Rare and de novo variants in 827 congenital diaphragmatic hernia probands implicate LONP1 as candidate risk gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified LONP1 as a risk gene contributing to CDH through both de novo
      and ultra-rare inherited largely heterozygous variants clustered in the
      core of the domains and segregating with CDH in affected familial
      individuals.
    explanation: >-
      Establishes LONP1 as a candidate CDH risk gene in an 827-proband cohort,
      with a predominantly heterozygous mechanism.
  - reference: PMID:34547244
    reference_title: "Rare and de novo variants in 827 congenital diaphragmatic hernia probands implicate LONP1 as candidate risk gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with lung epithelium-specific deletion of Lonp1 die immediately
      after birth, most likely because of the observed severe reduction of lung
      growth, a known contributor to the high mortality in humans.
    explanation: >-
      Mouse conditional knockout reproduces the severe lung-growth reduction
      that drives mortality in human CDH.
- name: MYRF
  gene_term:

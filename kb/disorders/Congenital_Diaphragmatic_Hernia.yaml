    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a rare birth defect
      characterized by incomplete closure of the diaphragm and herniation of
      fetal abdominal organs into the chest that results in pulmonary
      hypoplasia, postnatal pulmonary hypertension owing to vascular
      remodelling and cardiac dysfunction.
    explanation: >-
      Establishes the causal ordering from incomplete diaphragm closure and
      visceral herniation to pulmonary hypoplasia and pulmonary hypertension.
  - reference: PMID:31519366
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a neonatal pathology in which
      intrathoracic herniation of abdominal viscera via diaphragmatic defect
      results in aberrant pulmonary and cardiovascular development.
    explanation: >-
      Supports the edge from the diaphragmatic defect to both the pulmonary
      parenchymal and the pulmonary vascular arms of the graph.
  downstream:
  - target: Pulmonary Hypoplasia
    description: >-
      Space occupation by herniated viscera restricts lung growth during the
      pseudoglandular and canalicular stages. This is the "second hit" of the
      dual-hit model and the whole of the competing purely mechanical model,
      so the edge is shared by both hypothesis groups.
    hypothesis_groups:
    - dual_hit
    - mechanical_compression_only
    causal_link_type: DIRECT
  - target: Pulmonary Vascular Maldevelopment and Remodeling
    description: >-
      The same developmental window that limits airway branching also limits
      and distorts pulmonary vascular development.
    causal_link_type: DIRECT
  - target: Congenital diaphragmatic hernia
    description: The anatomic defect is the defining clinical finding.
    causal_link_type: DIRECT
  - target: Posterolateral diaphragmatic hernia
    description: >-
      Failure of pleuroperitoneal fold closure specifically produces the
      posterolateral (Bochdalek) defect.
    causal_link_type: DIRECT
  - target: Morgagni diaphragmatic hernia
    description: >-
      Failure of closure at the sternocostal trigone produces the anterior
      retrosternal (Morgagni) defect.
    causal_link_type: DIRECT
  - target: Central diaphragmatic hernia
    description: >-
      Abnormal septum transversum development produces the central tendon
      defect.
    causal_link_type: DIRECT
  - target: Scaphoid abdomen
    description: >-
      Relocation of abdominal viscera into the thorax leaves the abdomen
      empty, producing the sunken newborn abdominal contour.
    causal_link_type: DIRECT
  - target: Gastroesophageal reflux
    description: >-
      Distortion of the oesophageal hiatus and gastro-oesophageal junction
      anatomy by the defect and its repair predisposes to reflux in survivors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Left Heart Hypoplasia in Left-Sided CDH
    description: >-
      Mediastinal shift and compression by herniated viscera, most often on the
      left, restrict filling and growth of the left-sided cardiac structures.
    causal_link_type: DIRECT
  - target: Scoliosis
    description: >-
      Thoracic cage growth asymmetry after a large defect and its repair
      produces spinal deformity in long-term survivors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Pectus excavatum
    description: >-
      The same asymmetric chest wall growth, and abdominal closure under
      tension after repair, produce anterior chest wall deformity in survivors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Pulmonary Hypoplasia
  role: effector
  biological_scale: TISSUE
  description: >-
    Both lungs, and particularly the ipsilateral lung, show reduced airway
    branching generations, reduced alveolar number and surface area, thickened
    alveolar septa, and surfactant abnormalities. The parenchymal deficit is
    bilateral even when the defect is unilateral, indicating a primary
    developmental component in addition to mechanical compression.
  cell_types:

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a severe birth defect and a
      major cause of neonatal respiratory distress.
    explanation: >-
      Snippet supports the disease-phenotype association between CDH and
      neonatal respiratory distress. VERY_FREQUENT is a clinical estimate
      (near-universal in prenatally diagnosed CDH), not a figure extracted from
      the cited abstract.
- name: Hypoxemia
  category: Respiratory
  description: Severe, often labile arterial hypoxemia refractory to supplemental oxygen.
  phenotype_term:
    preferred_term: Hypoxemia
    term:
      id: HP:0012418
      label: Hypoxemia
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lungs are hypoplastic and have abnormal vessels that cause
      respiratory insufficiency
    explanation: >-
      Respiratory insufficiency from hypoplastic lungs and abnormal vessels
      manifests clinically as hypoxemia.
- name: Cyanosis
  category: Respiratory
  description: Central cyanosis reflecting right-to-left shunting and impaired gas exchange.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961

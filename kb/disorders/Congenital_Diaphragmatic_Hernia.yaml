    evidence_source: OTHER
    snippet: >-
      Congenital diaphragmatic hernia (CDH) is a congenital malformation
      characterized by failure of diaphragm closure during embryonic
      development, leading to pulmonary hypoplasia and pulmonary hypertension,
      which contribute significantly to morbidity and mortality.
    explanation: >-
      Identifies pulmonary hypoplasia as the principal determinant of morbidity
      and mortality downstream of the diaphragmatic defect.
  - reference: PMID:35633948
    reference_title: "Genetically Modified Mouse Models of Congenital Diaphragmatic Hernia: Opportunities and Limitations for Studying Altered Lung Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CDH is accompanied by immature and hypoplastic lungs, being the leading
      cause of morbidity and mortality in patients with this condition.
    explanation: >-
      Genetically modified mouse models reproduce the combination of diaphragm
      defect and hypoplastic, immature lung.
  downstream:
  - target: Refractory Hypoxemia and Neonatal Respiratory Failure
    description: >-
      Reduced alveolar surface area limits gas exchange from the first
      postnatal breaths.
    causal_link_type: DIRECT
  - target: Pulmonary hypoplasia
    description: Reduced lung parenchymal mass is the defining structural phenotype.
    causal_link_type: DIRECT
- name: Pulmonary Vascular Maldevelopment and Remodeling
  role: effector
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  description: >-
    The pulmonary vascular bed in CDH is reduced in cross-sectional area, with
    fewer arterial generations per unit lung, and the pre-acinar and
    intra-acinar arteries show adventitial thickening and abnormal medial
    muscularization extending peripherally into vessels that are normally
    non-muscular. Endothelial dysfunction with reduced nitric oxide signaling
    accompanies the structural remodeling.
  cell_types:

classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
    evidence:
    - reference: PMID:35650272
      reference_title: "Congenital diaphragmatic hernia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Congenital diaphragmatic hernia (CDH) is a rare birth defect
        characterized by incomplete closure of the diaphragm and herniation of
        fetal abdominal organs into the chest that results in pulmonary
        hypoplasia, postnatal pulmonary hypertension owing to vascular
        remodelling and cardiac dysfunction.
      explanation: >-
        The clinically decisive disease in CDH is respiratory - pulmonary
        hypoplasia and pulmonary hypertension - which places the entry in the
        respiratory chapter rather than the gastrointestinal one.
differential_diagnoses:
- name: Congenital pulmonary airway malformation
  description: >-
    A cystic lung lesion that can mimic bowel loops in the hemithorax on
    prenatal ultrasound or neonatal chest radiography.
  disease_term:
    preferred_term: congenital pulmonary airway malformation
    term:
      id: MONDO:0016580
      label: congenital pulmonary airway malformation
  evidence:
  - reference: PMID:22214468
    reference_title: Congenital diaphragmatic hernia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital Diaphragmatic Hernia (CDH) is defined by the presence of an
      orifice in the diaphragm
    explanation: >-
      The defining diaphragmatic orifice is what a cystic lung malformation
      lacks, which is the basis of the distinction.
  distinguishing_features:
  - Intact diaphragm on imaging, with no defect through which viscera pass
  - Normal abdominal gas pattern rather than a paucity of abdominal gas
  - Cystic lesion follows lung architecture rather than bowel loops
- name: Congenital pulmonary sequestration
  description: >-
    A mass of non-functioning lung parenchyma with an anomalous systemic
    arterial supply and no connection to the bronchial tree. The extralobar
    form is frequently infradiaphragmatic or juxtadiaphragmatic and can be
    mistaken for herniated viscera on prenatal imaging; it also co-occurs with
    CDH.
  disease_term:
    preferred_term: congenital pulmonary sequestration
    term:
      id: MONDO:0017843
      label: congenital pulmonary sequestration
  evidence:
  - reference: PMID:33252753
    reference_title: "Fetal ultrasound and magnetic resonance imaging: a primer on how to interpret prenatal lung lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal lung lesions include common lesions such as congenital pulmonary
      airway malformation (CPAM), bronchopulmonary sequestration (BPS) and
      combined CPAM-BPS hybrid lesions
    explanation: >-
      Establishes bronchopulmonary sequestration as a distinct fetal
      intrathoracic lesion that must be separated from CDH on prenatal imaging.
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some rare instances, X-rays may suggest a cystic malformation of the
      lung
    explanation: >-
      The CDH review's own differential-diagnosis section identifies cystic
      and other congenital lung malformations as the entities that radiography
      can confuse with CDH; it does not name sequestration specifically, so
      support is partial.
  distinguishing_features:
  - Systemic arterial feeding vessel, typically from the descending aorta, on Doppler or MRI
  - Solid echogenic mass following lung architecture rather than peristalsing bowel
  - Intact diaphragm with normal intra-abdominal gas pattern
  - Extralobar sequestration may itself sit below the diaphragm
- name: Congenital lobar emphysema
  description: >-
    Progressive hyperinflation of a single pulmonary lobe producing a
    hyperlucent hemithorax with mediastinal shift, which reproduces the
    radiographic mass effect of a left-sided CDH in a neonate with respiratory
    distress.
  disease_term:
    preferred_term: congenital lobar emphysema
    term:
      id: MONDO:0007536
      label: congenital lobar emphysema
  evidence:
  - reference: PMID:33252753
    reference_title: "Fetal ultrasound and magnetic resonance imaging: a primer on how to interpret prenatal lung lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      as well as less common entities including congenital lobar
      emphysema/obstruction, bronchial atresia, bronchogenic cysts
    explanation: >-
      Names congenital lobar emphysema/obstruction as a distinct congenital
      thoracic lesion in the same prenatal differential as CPAM and
      sequestration.
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      passing a naso-gastric catheter into the stomach before a plain X-ray of
      the thorax and abdomen may help to locate it
    explanation: >-
      The manoeuvre that separates CDH from an intrinsic hyperlucent lung
      lesion is demonstrating an intrathoracic stomach; the cited review
      prescribes exactly this test, though it does not name lobar emphysema.
  distinguishing_features:
  - Hyperlucent hyperinflated lobe rather than gas-filled bowel loops
  - Nasogastric tube remains below the diaphragm rather than curling into the chest
  - Intact diaphragmatic contour with a normal abdominal gas pattern
  - Lobar distribution respecting fissures
- name: Diaphragmatic eventration
  description: >-
    An abnormally elevated but anatomically continuous hemidiaphragm, with or
    without phrenic nerve palsy.
  disease_term:
    preferred_term: diaphragmatic eventration
    term:
      id: MONDO:0006726
      label: diaphragmatic eventration
  evidence:
  - reference: PMID:20301632
    reference_title: Fryns Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diaphragmatic defects (diaphragmatic hernia and diaphragm eventration,
      hypoplasia, or agenesis)
    explanation: >-
      GeneReviews treats eventration as a distinct diaphragmatic defect
      category from true hernia, which is the basis of the differential.
  distinguishing_features:
  - Diaphragm is thinned and elevated but anatomically continuous
  - No true defect, so abdominal viscera remain below a diaphragmatic membrane
  - May be associated with phrenic nerve palsy rather than a developmental defect

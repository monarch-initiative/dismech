    explanation: >-
      Supports the aberrant cardiopulmonary physiology whose bedside expression
      is central cyanosis; the specific sign is not separately quantified in
      the cited abstract.
- name: Right ventricular failure
  category: Cardiovascular
  description: >-
    Right ventricular dysfunction and failure secondary to pulmonary
    hypertensive afterload.
  phenotype_term:
    preferred_term: Right ventricular failure
    term:
      id: HP:0001708
      label: Right ventricular failure
  evidence:
  - reference: PMID:28768736
    reference_title: "Congenital diaphragmatic hernias: from genes to mechanisms to therapies."

  evidence:
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      pharmacotherapies including pulmonary vasodilators and hemodynamic
      support
    explanation: >-
      Milrinone is used as combined pulmonary vasodilator and haemodynamic

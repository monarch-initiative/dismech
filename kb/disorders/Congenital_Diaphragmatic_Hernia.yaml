mechanistic_hypotheses:
- hypothesis_group_id: dual_hit
  hypothesis_label: Dual-hit model (primary lung maldevelopment plus mechanical compression)
  status: CANONICAL
  description: >-
    The dual-hit model holds that the lung phenotype in CDH is not purely
    mechanical. A first hit perturbs lung development directly, in parallel
    with the diaphragmatic lesion and through the same mesenchymal and
    retinoid-dependent programmes; a second hit is the physical compression of
    the developing lung by herniated viscera. This model explains why the
    contralateral lung is also hypoplastic and why anatomic repair does not
    immediately reverse the lung and vascular disease.
  evidence:
  - reference: PMID:39183805
    reference_title: "Role of genetics and the environment in the etiology of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The occurrence of CDH and pulmonary hypoplasia is theorized to result
      from both abnormalities in signaling pathways of smooth muscle cells in
      pleuroperitoneal folds and mechanical compression by abdominal organs
      within the chest cavity on the developing lungs.
    explanation: >-
      States both components of the dual-hit model as jointly responsible for
      the CDH lung phenotype.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in CDH, this embryologic development is impaired which, in conjunction
      with external compression, stifle pulmonary vascular maturation
    explanation: >-
      Applies the same dual-hit logic to the pulmonary vascular arm: intrinsic
      developmental impairment acting together with external compression.
- hypothesis_group_id: retinoid
  hypothesis_label: Retinoid hypothesis of abnormal diaphragm development
  status: CANONICAL
  description: >-
    The retinoid hypothesis, formulated by Greer, Babiuk and Thebaud in 2003
    and reviewed twenty years later, holds that abnormalities of retinoic acid
    signalling early in gestation underlie abnormal diaphragm development in
    CDH. It is supported by teratogen models that inhibit retinoic acid
    synthesis, by vitamin-A-deficiency models, and by human genetic lesions in
    retinoid transport and signalling such as STRA6 and NR2F2.
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The Retinoid Hypothesis is one of the leading hypotheses to explain the
      etiology of CDH
    explanation: Establishes the standing of the retinoid hypothesis in the field.
discussions:
- discussion_id: cdh_ino_efficacy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does inhaled nitric oxide improve outcome in CDH-associated pulmonary
    hypertension, or does its routine use mainly delay escalation to
    extracorporeal support?
  attaches_to:
  - "#Persistent Pulmonary Hypertension of the Newborn"
  rationale: >-
    Inhaled nitric oxide is widely used in CDH by extrapolation from other
    causes of persistent pulmonary hypertension of the newborn, but the CDH
    vascular bed is structurally reduced rather than merely vasoconstricted, so
    a selective vasodilator may have limited substrate on which to act. The
    published evidence base is small and the reviewed conclusion is that the
    role of iNO in CDH is controversial.
  proposed_experiments:
  - experiment_id: cdh_ino_rct
    name: Randomised trial of inhaled nitric oxide in CDH-associated pulmonary hypertension
    description: >-
      An adequately powered randomised trial of inhaled nitric oxide versus
      placebo in CDH-associated pulmonary hypertension, stratified by
      echocardiographic phenotype, with time to extracorporeal support as a
      co-primary outcome alongside survival to discharge.
  evidence:
  - reference: PMID:32384329
    reference_title: "The Use of Inhaled Nitric Oxide in Congenital Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the role of iNO as a treatment for CDH is controversial.
    explanation: Documents that the efficacy question is unresolved in the literature.
- discussion_id: cdh_nitrofen_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How faithfully do the nitrofen rat model and retinoid-pathway mouse mutants
    reproduce human CDH, given that the human disease is genetically
    heterogeneous and usually not attributable to a single teratogen or a
    single retinoid-pathway lesion?
  attaches_to:
  - "#Retinoid Signaling and Pleuroperitoneal Fold Mesenchymal Deficit"
  rationale: >-
    Most mechanistic knowledge of diaphragm and lung maldevelopment in CDH
    derives from teratogen-induced and genetically modified rodents. These
    models reproduce components of the phenotype - amuscular diaphragm,
    posterolateral defects, reduced branching - but no single model captures
    the full human spectrum, and rodent lethality prevents study of the chronic
    survivor morbidity that dominates the human disease.
  proposed_experiments:
  - experiment_id: cdh_ppf_cross_species_sc
    name: Cross-species single-cell comparison of pleuroperitoneal fold mesenchyme
    description: >-
      Single-cell profiling of human fetal pleuroperitoneal fold and lung
      mesenchyme compared against the corresponding rodent compartments in
      nitrofen-exposed and retinoid-pathway mutant animals, to test whether the
      cell states perturbed in the models are the ones perturbed in human CDH.
  evidence:
  - reference: PMID:35633948
    reference_title: "Genetically Modified Mouse Models of Congenital Diaphragmatic Hernia: Opportunities and Limitations for Studying Altered Lung Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the generation of genetically modified mouse models, which show both
      diaphragm and lung abnormalities, has resulted in the discovery of
      multiple genes and signaling pathways involved in the pathogenesis of CDH
    explanation: >-
      Establishes that the mechanistic evidence base is largely murine, which
      is what makes translational fidelity the open question.
  - reference: PMID:35633948
    reference_title: "Genetically Modified Mouse Models of Congenital Diaphragmatic Hernia: Opportunities and Limitations for Studying Altered Lung Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      whilst also discussing the significance of these genetic models for
      studying altered lung development with regard to the human situation
    explanation: >-
      The cited review itself frames the human relevance of these models as a
      question requiring discussion rather than a settled matter.
differential_diagnoses:
- name: Congenital pulmonary airway malformation
  description: >-
    A cystic lung lesion that can mimic bowel loops in the hemithorax on
    prenatal ultrasound or neonatal chest radiography.
  disease_term:
    preferred_term: congenital pulmonary airway malformation
    term:
      id: MONDO:0016580
      label: congenital pulmonary airway malformation
  evidence:
  - reference: PMID:22214468
    reference_title: Congenital diaphragmatic hernia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital Diaphragmatic Hernia (CDH) is defined by the presence of an
      orifice in the diaphragm
    explanation: >-
      The defining diaphragmatic orifice is what a cystic lung malformation
      lacks, which is the basis of the distinction.
  distinguishing_features:
  - Intact diaphragm on imaging, with no defect through which viscera pass
  - Normal abdominal gas pattern rather than a paucity of abdominal gas
  - Cystic lesion follows lung architecture rather than bowel loops
- name: Diaphragmatic eventration
  description: >-
    An abnormally elevated but anatomically continuous hemidiaphragm, with or
    without phrenic nerve palsy.
  disease_term:
    preferred_term: diaphragmatic eventration
    term:
      id: MONDO:0006726
      label: diaphragmatic eventration
  evidence:
  - reference: PMID:20301632
    reference_title: Fryns Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diaphragmatic defects (diaphragmatic hernia and diaphragm eventration,
      hypoplasia, or agenesis)
    explanation: >-
      GeneReviews treats eventration as a distinct diaphragmatic defect
      category from true hernia, which is the basis of the differential.
  distinguishing_features:
  - Diaphragm is thinned and elevated but anatomically continuous
  - No true defect, so abdominal viscera remain below a diaphragmatic membrane
  - May be associated with phrenic nerve palsy rather than a developmental defect

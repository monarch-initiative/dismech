  - reference: PMID:20301732
    reference_title: "Donnai-Barrow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      biallelic pathogenic variants in LRP2 identified by molecular genetic
      testing
    explanation: Establishes biallelic LRP2 variants as the molecular basis of the syndrome.
- name: STRA6
  gene_term:
    preferred_term: STRA6
    term:
      id: hgnc:30650
      label: STRA6
  relationship_type: CAUSATIVE
  notes: >-
    STRA6 encodes the cellular retinol-binding-protein receptor; biallelic
    variants cause Matthew-Wood/PDAC syndrome with diaphragmatic hernia,
    supporting the retinoid hypothesis of CDH.
  evidence:
  - reference: PMID:19309693
    reference_title: "Phenotypic spectrum of STRA6 mutations: from Matthew-Wood syndrome to non-lethal anophthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Matthew-Wood, Spear, PDAC or MCOPS9 syndrome are alternative names used
      to refer to combinations of microphthalmia/anophthalmia, malformative
      cardiac defects, pulmonary dysgenesis, and diaphragmatic hernia.
    explanation: >-
      Defines the STRA6-related syndrome in which diaphragmatic hernia is a
      cardinal feature.
  - reference: PMID:19309693
    reference_title: "Phenotypic spectrum of STRA6 mutations: from Matthew-Wood syndrome to non-lethal anophthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in STRA6, encoding a membrane receptor for vitamin A-bearing
      plasma retinol binding protein, have been identified in such patients
    explanation: >-
      Links the causal gene to vitamin A/retinol uptake, directly supporting
      the retinoid hypothesis arm of the pathograph.
treatments:
- name: Fetal Endoscopic Tracheal Occlusion (FETO)
  description: >-
    Percutaneous fetoscopic placement of a detachable balloon in the fetal
    trachea, which retains lung fluid, raises intrapulmonary pressure and
    promotes lung growth, followed by balloon removal before delivery. Offered
    in severe isolated CDH with low observed-to-expected lung-to-head ratio.
  treatment_term:
    preferred_term: fetoscopic tracheal occlusion
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Pulmonary Hypoplasia
    treatment_effect: RESTORES
    description: >-
      Tracheal occlusion promotes fetal lung growth, partially reversing the
      parenchymal deficit.
  evidence:
  - reference: PMID:34106556
    reference_title: "Randomized Trial of Fetal Surgery for Severe Left Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In fetuses with isolated severe congenital diaphragmatic hernia on the
      left side, FETO performed at 27 to 29 weeks of gestation resulted in a
      significant benefit over expectant care with respect to survival to
      discharge, and this benefit was sustained to 6 months of age.
    explanation: >-
      Randomised trial (TOTAL) establishing a survival benefit for FETO in
      severe left-sided isolated CDH.
  - reference: PMID:34106556
    reference_title: "Randomized Trial of Fetal Surgery for Severe Left Diaphragmatic Hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of preterm, prelabor rupture of membranes was higher among
      women in the FETO group than among those in the expectant care group
    explanation: >-
      Documents the principal harm of FETO, preterm prelabor rupture of
      membranes, which constrains patient selection.
  - reference: PMID:34106555
    reference_title: "Randomized Trial of Fetal Surgery for Moderate Left Diaphragmatic Hernia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetoscopic endoluminal tracheal occlusion (FETO) has been associated with
      increased postnatal survival among infants with severe pulmonary
      hypoplasia due to isolated congenital diaphragmatic hernia on the left
      side, but data are lacking to inform its effects in infants with moderate
      disease.
    explanation: >-
      The companion moderate-disease trial frames FETO benefit as established
      for severe but not moderate hypoplasia.
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At specialized centres, prenatal management includes fetal endoscopic
      tracheal occlusion, which is a surgical intervention aimed at promoting
      lung growth in utero.
    explanation: Confirms the mechanism of action as promotion of in utero lung growth.
- name: Gentle Ventilation
  description: >-
    A permissive-hypercapnia, pressure-limited ventilation strategy that
    avoids high peak inflating pressures in order to prevent barotrauma to the
    hypoplastic lung; the standardised approach that underpinned improved
    survival in contemporary CDH care.
  treatment_term:
    preferred_term: pressure-limited mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Refractory Hypoxemia and Neonatal Respiratory Failure
    treatment_effect: MODULATES
    description: >-
      Supports gas exchange while minimising ventilator-induced injury to the
      hypoplastic lung.
  evidence:
  - reference: PMID:26692079
    reference_title: "Conventional Mechanical Ventilation Versus High-frequency Oscillatory Ventilation for Congenital Diaphragmatic Hernia: A Randomized Clinical Trial (The VICI-trial)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The maldeveloped lungs have a high susceptibility for oxygen and
      ventilation damage resulting in a high incidence of bronchopulmonary
      dysplasia (BPD) and chronic respiratory morbidity.
    explanation: >-
      States the rationale for a lung-protective ventilation strategy in CDH.
  - reference: PMID:26692079
    reference_title: "Conventional Mechanical Ventilation Versus High-frequency Oscillatory Ventilation for Congenital Diaphragmatic Hernia: A Randomized Clinical Trial (The VICI-trial)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other outcomes, including shorter ventilation time and lesser need of
      extracorporeal membrane oxygenation, favored conventional ventilation.
    explanation: >-
      The VICI randomised trial favours conventional pressure-limited
      ventilation over high-frequency oscillation as the initial strategy.
  - reference: PMID:27077664
    reference_title: "Standardized Postnatal Management of Infants with Congenital Diaphragmatic Hernia in Europe: The CDH EURO Consortium Consensus - 2015 Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      target PaCO2 to be between 50 and 70 mm Hg; (5) conventional mechanical
      ventilation to be the optimal initial ventilation strategy
    explanation: >-
      CDH EURO Consortium consensus specifying permissive hypercapnia and
      conventional ventilation as the standard gentle-ventilation approach.
- name: Inhaled Nitric Oxide
  description: >-
    Selective inhaled pulmonary vasodilator used for pulmonary hypertension
    with right-to-left shunting; response in CDH is frequently poor compared
    with other causes of persistent pulmonary hypertension of the newborn.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nitric oxide
      term:
        id: CHEBI:16480
        label: nitric oxide
  target_mechanisms:
  - target: Persistent Pulmonary Hypertension of the Newborn
    treatment_effect: INHIBITS
    description: Selective pulmonary vasodilation lowers pulmonary vascular resistance.
  evidence:
  - reference: PMID:32384329
    reference_title: "The Use of Inhaled Nitric Oxide in Congenital Diaphragmatic Hernia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      the role of iNO as a treatment for CDH is controversial.
    explanation: >-
      A systematic review concludes that the benefit of inhaled nitric oxide in
      CDH-associated pulmonary hypertension is not established, which is why
      this treatment is curated with PARTIAL support.
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management strategies include lung protective ventilation, fluid
      optimization, pharmacotherapies including pulmonary vasodilators and
      hemodynamic support, and extracorporeal life support (ECLS) for
      refractory cases.
    explanation: >-
      Places pulmonary vasodilator therapy within the standard CDH-PH
      management bundle.
- name: Sildenafil
  description: >-
    Phosphodiesterase-5 inhibitor used to treat pulmonary hypertension in CDH,
    including as prenatal and postnatal therapy under investigation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sildenafil
      term:
        id: CHEBI:9139
        label: sildenafil
  target_mechanisms:
  - target: Persistent Pulmonary Hypertension of the Newborn
    treatment_effect: INHIBITS
    description: >-
      Potentiates cyclic GMP mediated pulmonary vasodilation downstream of
      nitric oxide.
  evidence:
  - reference: PMID:27077664
    reference_title: "Standardized Postnatal Management of Infants with Congenital Diaphragmatic Hernia in Europe: The CDH EURO Consortium Consensus - 2015 Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      intravenous sildenafil to be considered in CDH patients with severe
      pulmonary hypertension
    explanation: >-
      CDH EURO Consortium consensus recommendation for sildenafil in severe
      CDH-associated pulmonary hypertension.
- name: Milrinone
  description: >-
    Phosphodiesterase-3 inhibitor with inotropic and pulmonary vasodilator
    effects used for right ventricular dysfunction with pulmonary hypertension
    in CDH.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: milrinone
      term:
        id: CHEBI:50693
        label: milrinone
  target_mechanisms:
  - target: Right Ventricular Pressure Overload and Failure
    treatment_effect: MODULATES
    description: Inodilation supports right ventricular performance and lowers afterload.
  evidence:
  - reference: PMID:39018718
    reference_title: "Congenital diaphragmatic hernia-associated pulmonary hypertension."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      pharmacotherapies including pulmonary vasodilators and hemodynamic
      support
    explanation: >-
      Milrinone is used as combined pulmonary vasodilator and haemodynamic
      support; the cited review describes the class rather than the individual
      agent, so support is partial.
- name: Extracorporeal Membrane Oxygenation
  description: >-
    Venoarterial or venovenous extracorporeal life support used as rescue
    therapy for refractory hypoxemia or cardiovascular failure in CDH,
    permitting lung rest until pulmonary vascular resistance falls.
  treatment_term:
    preferred_term: extracorporeal membrane oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  target_mechanisms:
  - target: Refractory Hypoxemia and Neonatal Respiratory Failure
    treatment_effect: BYPASSES
    description: >-
      Extracorporeal gas exchange bypasses the hypoplastic lung during the
      period of highest pulmonary vascular resistance.
  evidence:
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Postnatal management focuses on cardiopulmonary stabilization and, in
      severe cases, can involve extracorporeal life support.
    explanation: >-
      Establishes extracorporeal life support as the accepted rescue therapy in
      severe CDH.
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment after birth requires all the refinements of critical care
      including extracorporeal membrane oxygenation prior to surgical
      correction.
    explanation: >-
      Situates ECMO before, rather than after, surgical repair in the treatment
      sequence.
- name: Delayed Surgical Repair of the Diaphragmatic Defect
  description: >-
    Operative closure of the diaphragmatic defect by primary repair or
    prosthetic patch, deferred until after physiological stabilisation rather
    than performed as a neonatal emergency.
  treatment_term:
    preferred_term: diaphragmatic hernia repair
    term:
      id: NCIT:C168249
      label: Herniorrhaphy
  target_mechanisms:
  - target: Failure of Diaphragm Closure and Visceral Herniation
    treatment_effect: RESTORES
    description: Repair restores diaphragmatic continuity and reduces the herniated viscera.
  evidence:
  - reference: PMID:22214468
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment after birth requires all the refinements of critical care
      including extracorporeal membrane oxygenation prior to surgical
      correction.
    explanation: >-
      Supports delayed surgical correction after physiological stabilisation
      rather than emergency neonatal repair.
  - reference: PMID:20301632
    reference_title: "Fryns Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For congenital diaphragmatic hernia, the neonate is immediately intubated
      to prevent inflation of herniated bowel
    explanation: >-
      GeneReviews management guidance shows that airway stabilisation precedes
      operative repair; it speaks to the stabilise-first sequence rather than to
      the timing of repair itself.
environmental:
- name: Reduced retinoid (vitamin A) signaling during diaphragm morphogenesis
  description: >-
    Perturbation of the vitamin A / retinoic acid axis during early gestation
    is the best-developed environmental hypothesis for CDH. Retinoic acid is
    generated from dietary vitamin A by retinaldehyde dehydrogenases; dietary
    vitamin A deficiency, teratogens that inhibit retinoic acid synthesis, and
    genetic lesions in retinoid transport and signalling all produce
    diaphragmatic defects, and the pathway is a locus of gene-environment
    interaction.
  effect: Risk factor
  chemicals:
  - retinoic acid
  - retinol
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This review provides a comprehensive update on the Retinoid Hypothesis,
      which links abnormal retinoic acid signaling to the etiology of
      congenital diaphragmatic hernia.
    explanation: >-
      States the retinoid hypothesis as an aetiological account linking an
      environmentally modifiable pathway to CDH.
  - reference: PMID:39183805
    reference_title: "Role of genetics and the environment in the etiology of congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The retinoic acid pathway is thought to play an essential role in the
      interactions of genes and environment in CDH.
    explanation: >-
      Identifies the retinoid pathway specifically as the gene-environment
      interaction locus in CDH.
- name: Other maternal exposures
  description: >-
    Maternal age, alcohol use and smoking have been reported as epidemiological
    associations with CDH. Evidence outside retinoid biology remains limited
    and these associations should not be read as established individual
    causation.
  effect: Reported epidemiological association
  evidence:
  - reference: PMID:37990078
    reference_title: "The etiology of congenital diaphragmatic hernia: the retinoid hypothesis 20 years later."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Environmental risk factors for CDH are varied, including associations
      with maternal age, alcohol use, and smoking.
    explanation: >-
      Lists the reported maternal exposure associations; the review presents
      these as associations rather than proven causes.
  - reference: PMID:39183805
    reference_title: "Role of genetics and the environment in the etiology of congenital diaphragmatic hernia."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, apart from the gradually maturing retinol hypothesis, there is
      limited evidence implicating other environmental factors in CDH
      occurrence.
    explanation: >-
      Explicitly qualifies the strength of non-retinoid environmental evidence.
inheritance:
- name: Multifactorial inheritance with a polygenic component
  description: >-
    Most CDH is sporadic. Genome-wide analysis supports a liability model in
    which common polygenic background acts together with rare, large-effect de
    novo variants; Mendelian inheritance applies only to the recognised
    syndromic and monogenic forms (autosomal dominant with incomplete
    penetrance, autosomal recessive, or chromosomal).
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:39332409
    reference_title: "Common variants increase risk for congenital diaphragmatic hernia within the context of de novo variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data support a polygenic model as part of the CDH genetic
      architecture.
    explanation: >-
      A 1,469-individual integrated de novo and common-variant study concludes
      that a polygenic component contributes to CDH liability.
  - reference: PMID:39332409
    reference_title: "Common variants increase risk for congenital diaphragmatic hernia within the context of de novo variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, there is no significant difference in estimated polygenic
      risk scores between isolated and complex CDH or between individuals
      harboring deleterious de novo variants and individuals without these
      variants.
    explanation: >-
      Shows the polygenic background is shared across isolated and complex CDH
      rather than defining separate genetic classes.
  - reference: PMID:35650272
    reference_title: "Congenital diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although the aetiology remains unknown, CDH has a polygenic origin in
      approximately one-third of cases.
    explanation: Supports a polygenic contribution in a substantial fraction of cases.

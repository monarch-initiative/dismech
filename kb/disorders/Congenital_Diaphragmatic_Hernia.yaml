- name: Left Heart Hypoplasia in Left-Sided CDH
  role: effector
  biological_scale: TISSUE
  description: >-
    In left-sided CDH the herniated viscera displace the mediastinum to the
    right and compress the left heart during the period of fetal cardiac
    growth. Left-sided structures (mitral valve, aortic valve, left ventricle)
    are correspondingly smaller, in proportion to lung size and the extent of
    liver herniation. This is a distinct arm from the right ventricular
    pressure overload driven by pulmonary hypertension, and it contributes to
    the low-output physiology and vasodilator intolerance of severe disease.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: left cardiac ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:28370263
    reference_title: "Fetal left-sided cardiac structural dimensions in left-sided congenital diaphragmatic hernia - association with severity and impact on postnatal outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetuses with congenital diaphragmatic hernia (CDH) demonstrate varying
      degrees of left heart hypoplasia.
    explanation: >-
      Establishes left heart hypoplasia as a recognised structural consequence
      of CDH, distinct from the right ventricular arm already modelled.
  - reference: PMID:28370263
    reference_title: "Fetal left-sided cardiac structural dimensions in left-sided congenital diaphragmatic hernia - association with severity and impact on postnatal outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal mitral valve z-score correlated with lung-to-head ratio (p = 0.04),
      postnatal mitral valve z-score correlated with percent liver herniation
    explanation: >-
      Ties the degree of left-sided cardiac hypoplasia quantitatively to the
      classic indices of herniation severity, supporting the causal edge from

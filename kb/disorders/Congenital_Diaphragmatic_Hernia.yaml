- name: Scaphoid abdomen
  category: Structural
  description: >-
    A sunken abdominal contour in the newborn resulting from displacement of
    abdominal viscera into the thorax.
  phenotype_term:
    preferred_term: Scaphoid abdomen
    term:
      id: HP:0025063

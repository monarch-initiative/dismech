definitions:
- name: Clinical case definition for human myiasis
  definition_type: CASE_DEFINITION
  description: >-
    Human myiasis is defined by the presence of living dipteran fly larvae in or
    on the tissues of a living person, with the larvae feeding on host tissue,
    body fluids, or ingested food for at least part of their development.
  scope: Symptomatic and asymptomatic human infestation by dipteran fly larvae
  evidence:
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "refers to the infestation of live human and vertebrate animals with dipterous (two-winged) larvae (maggots) which, at least for a certain period, feed on the host's dead or living tissue, liquid body-substance, or ingested food"
    explanation: Gives the classical definitional criteria used for the case definition.
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis is the invasion of mammalian tissues by dipterous larvae."
    explanation: Confirms tissue invasion by dipteran larvae as the defining event.
- name: Anatomical classification of myiasis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Cases are classified by the body region colonized (cutaneous furuncular,
    migratory, wound/traumatic, and cavitary forms named for the affected organ)
    and, separately, by the degree of parasitism shown by the implicated fly
    species (obligate, facultative, or accidental).
  scope: Case classification once larvae have been recovered and identified
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are two main systems for categorizing myiasis: anatomical and ecological classifications."
    explanation: States the two orthogonal classification axes used to type a case.
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cavitary myiasis, where the infestation receives the name of the affected organ, e.g., cerebral myiasis, aural myiasis, nasal myiasis, and ophthalmomyiasis."
    explanation: Documents the organ-naming convention used for the cavitary subtypes.
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous myiasis can be divided into three main clinical manifestations: furuncular, creeping (migratory), and wound (traumatic) myiasis."
    explanation: Supports the three-way split of the cutaneous forms.
- name: Distinction of true myiasis from pseudomyiasis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    True myiasis requires larvae that develop on or in living host tissue.
    Recovery of larvae from stool or a body orifice is not sufficient, because
    accidentally ingested or post-passage-contaminating larvae of synanthropic
    flies may be passed without ever having colonized the host.
  scope: Reported gastrointestinal and cavitary cases where larvae are recovered but colonization is unproven
  evidence:
  - reference: DOI:10.1371/journal.pone.0356742
    reference_title: 'Clogmia albipunctata fails to induce true intestinal myiasis: Evidence from in vitro and in vivo digestive models'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Larvae of this species have been reported in suspected cases of intestinal myiasis, but whether they can establish true gastrointestinal infestation remains uncertain."
    explanation: States the colonization requirement that separates true intestinal myiasis from pseudomyiasis.
has_subtypes:
- name: Furuncular
  display_name: Furuncular (boil-like) cutaneous myiasis
  subtype_term:
    preferred_term: furuncular myiasis
    term:
      id: MONDO:0018941
      label: furuncular myiasis
  description: >-
    A single larva develops within a closed subcutaneous cavity, producing a
    boil-like nodule with a central punctum through which the larva breathes and
    serosanguineous fluid drains. Caused chiefly by Dermatobia hominis in the
    Americas and Cordylobia anthropophaga in sub-Saharan Africa.
  evidence:
  - reference: PMID:14726861
    reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had a locally painful, firm furuncular lesion with a central pore that drained serosanguineous exudates."
    explanation: Describes the defining furuncular lesion with central pore.
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The flies that produce a furuncular myiasis include Dermatobia hominis, Cordylobia anthropophaga, Wohlfahrtia vigil, and the Cuterebra species."
    explanation: Names the fly species responsible for the furuncular form.
- name: Creeping
  display_name: Creeping (migratory) cutaneous myiasis
  subtype_term:
    preferred_term: creeping myiasis
    term:
      id: MONDO:0018857
      label: creeping myiasis
  description: >-
    The third cutaneous form alongside the furuncular and wound types. A larva
    that cannot complete development in an accidental human host tunnels through
    the skin instead of settling in one cavity, producing a serpiginous,
    slowly advancing track rather than a fixed boil-like nodule. Gasterophilus
    (horse bot fly) and Hypoderma (cattle bot fly) larvae account for almost all
    human cases.
  evidence:
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous myiasis can be divided into three main clinical manifestations: furuncular, creeping (migratory), and wound (traumatic) myiasis."
    explanation: Establishes creeping (migratory) myiasis as one of the three cutaneous forms.
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Migratory myiasis, or creeping myiasis, occurs when a dipteran maggot starts to migrate, aimlessly, through burrows in the skin, producing the migratory pattern of the lesions."
    explanation: Defines the migratory tunnelling behaviour that distinguishes this subtype from the furuncular form.
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gasterophilus and Hypoderma are two flies that produce a creeping myiasis."
    explanation: Names the two genera responsible for the creeping form.
- name: Wound
  display_name: Wound (traumatic) myiasis
  subtype_term:
    preferred_term: wound myiasis
    term:
      id: MONDO:0015622
      label: wound myiasis
  description: >-
    Larvae are deposited into a pre-existing open wound or ulcer and feed as an
    aggregating mass, progressively enlarging the defect. Obligate screwworms
    (Cochliomyia hominivorax, Chrysomya bezziana, Wohlfahrtia magnifica) invade
    adjacent living tissue rather than confining themselves to necrotic debris.
  evidence:
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flies that cause wound myiasis include screwworm flies such as Cochliomyia hominivorax and Chrysomya bezziana, and Wohlfahrtia magnifica."
    explanation: Names the obligate screwworm species responsible for the wound form.
  - reference: PMID:41970302
    reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis is larval infestation of tissues, particularly common in tropical, and subtropical regions, especially in pre-existing wounds."
    explanation: Supports the pre-existing wound as the substrate for this subtype.
- name: Ophthalmic
  display_name: Ophthalmomyiasis
  subtype_term:
    preferred_term: ophthalmomyiasis
    term:
      id: MONDO:0000301
      label: ophthalmomyiasis
  description: >-
    Infestation of ocular structures, most often the superficial (externa) form
    involving conjunctiva and cornea. Oestrus ovis is the dominant agent; humans
    are accidental hosts in whom the first-instar larvae do not complete
    development.
  evidence:
  - reference: PMID:31955262
    reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 260 (99.62%) cases had external, while 1 (0.38%) had internal form of ocular myiasis."
    explanation: Quantifies the predominance of the external over the internal ocular form.
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmomyiasis externa refers to the superficial infestation of the ocular structures by dipterous larvae."
    explanation: Defines the ophthalmomyiasis externa subtype.
- name: Nasopharyngeal
  display_name: Nasal and oro-nasopharyngeal myiasis
  subtype_term:
    preferred_term: nasal and oro-nasopharyngeal myiasis
    term:
      id: MONDO:0015623
      label: cavitary myiasis
  description: >-
    Infestation of the nasal cavity, paranasal sinuses, and posterior
    oropharynx, which can erode into deep midfacial structures. Typically arises
    in patients with pre-existing mucosal ulceration, obtunded consciousness, or
    limited self-care.
  evidence:
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On examination, there was an ulcerated area in the posterior oro-nasopharynx filled with maggots."
    explanation: Documents the anatomical extent that defines this subtype.
- name: Oral
  display_name: Oral and maxillofacial myiasis
  subtype_term:
    preferred_term: oral myiasis
    term:
      id: MONDO:0015623
      label: cavitary myiasis
  description: >-
    Larval infestation of the gingiva, palate, and lips, strongly associated with
    neurological or locomotor disability, poor oral hygiene, and inability to
    achieve lip seal.
  evidence:
  - reference: PMID:33125723
    reference_title: 'Oral myiasis: Analysis of cases reported in the English literature from 1990 to 2020.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gingiva (29%) was the most affected site, followed by palate (25%) and lip (21%)."
    explanation: Gives the intraoral site distribution defining this subtype.
  - reference: PMID:21872507
    reference_title: 'Oral and maxillofacial myiasis: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The middle third of the face was the most frequently affected region (7 cases)."
    explanation: Supports the maxillofacial distribution in a hospital case series.
  - reference: PMID:40505774
    reference_title: 'Oral cavity myiasis and mouth parasitic infestations: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical protocol could take advantage from a combination of surgical removal and pharmacological therapy."
    explanation: A systematic review of 95 publications concluding that oral myiasis is managed by combined surgical removal and drug therapy, the treatment pattern this entry curates.
- name: Aural
  display_name: Otomyiasis
  subtype_term:
    preferred_term: aural myiasis
    term:
      id: MONDO:0015623
      label: cavitary myiasis
  description: >-
    Infestation of the external auditory canal and middle ear, predisposed to by
    chronic otitis media and previous otological surgery, with risk of extension
    into adjacent vital structures.
  evidence:
  - reference: PMID:30647793
    reference_title: 'Otomyiasis: Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic otitis media, previous otic surgical procedures, mental deficit, alcohol or drug abuse, sleeping outdoors, prostration, and malnutrition were predisposing factors."
    explanation: Defines the predisposing context that characterizes the aural subtype.
- name: Intestinal
  display_name: Intestinal (gastrointestinal) myiasis
  subtype_term:
    preferred_term: intestinal myiasis
    term:
      id: MONDO:0015623
      label: cavitary myiasis
  description: >-
    Larvae ingested with contaminated food survive transit of the
    gastrointestinal tract and are passed in faeces, producing variable and often
    mild abdominal symptoms. The subtype is frequently over-diagnosed, since
    accidental contamination must be excluded.
  evidence:
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intestinal myiasis is a condition when the fly larvae inhabit the gastrointestinal tract and are passed out in faeces."
    explanation: Defines the intestinal subtype.
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They survive the unfavourable conditions within the gastrointestinal tract and produce disturbances, which may vary from mild to severe."
    explanation: Supports the variable symptom severity of this subtype.
- name: Urogenital
  display_name: Urogenital myiasis
  subtype_term:
    preferred_term: urogenital myiasis
    term:
      id: MONDO:0015623
      label: cavitary myiasis
  description: >-
    Rare infestation of the vulvovaginal or urinary tract, linked to poor
    sanitary conditions and limited healthcare access, and often requiring
    repeated debridement in addition to antiparasitic therapy.
  evidence:
  - reference: PMID:35718295
    reference_title: 'Severe Vaginal Myiasis: Successful Management With Ivermectin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urogenital myiasis is a rare condition that is linked to poor sanitary conditions and limited access to healthcare and with few published case reports."
    explanation: Defines the urogenital subtype and its social risk context.
  - reference: PMID:39371381
    reference_title: 'Infancy Urogenital Myiasis: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During the examination, motile and live larvae were observed in the penis area."
    explanation: Documents male genital involvement in an infant, showing the subtype is not confined to vulvovaginal disease in adults.
infectious_agent:
- name: Dermatobia hominis
  infectious_agent_term:
    preferred_term: Dermatobia hominis
    term:
      id: NCBITaxon:115427
      label: Dermatobia hominis
  description: >-
    The human botfly, the dominant cause of furuncular myiasis in Central and
    South America. It does not oviposit on the host directly but uses
    blood-feeding arthropods as phoretic vectors.
  evidence:
  - reference: PMID:14726861
    reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Travelers to many parts of Central and South America are susceptible to infestation by Dermatobia hominis."
    explanation: Supports D. hominis as a cause of human furuncular myiasis in the Americas.
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The obligate D. hominis, causing furuncular lesions, caused 17 (43.5%) cases distributed along the tropical Pacific coast and the Amazon regions."
    explanation: Quantifies the D. hominis contribution in a national case review.
- name: Cordylobia anthropophaga
  infectious_agent_term:
    preferred_term: Cordylobia anthropophaga
    term:
      id: NCBITaxon:226132
      label: Cordylobia anthropophaga
  description: >-
    The tumbu fly, the leading cause of furuncular myiasis in sub-Saharan Africa
    and in travellers returning from it. Eggs are laid on soil or drying laundry
    and larvae penetrate skin on contact.
  evidence:
  - reference: PMID:38547087
    reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cordylobia anthropophaga was the most prevalent myiasis-causing species of the reported cases (n = 104, 66.2%)."
    explanation: Establishes C. anthropophaga as the predominant agent in sub-Saharan Africa.
  - reference: PMID:12718772
    reference_title: Furuncular myiasis by tumbu fly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two hundred and forty-eight cases of furuncular myiasis were observed among Pakistani soldiers."
    explanation: Documents a large observational series of tumbu fly furuncular myiasis.
- name: Cochliomyia hominivorax
  infectious_agent_term:
    preferred_term: Cochliomyia hominivorax
    term:
      id: NCBITaxon:115425
      label: Cochliomyia hominivorax
  description: >-
    The New World screwworm, an obligate parasite whose larvae invade and consume
    living rather than necrotic tissue, producing rapidly progressive wound and
    cavitary myiasis.
  evidence:
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The New World screwworm (Cochliomyia hominivorax) is an obligate parasitic fly whose larvae invade and consume living tissue, causing myiasis with severe consequences for human health, animal welfare, and agricultural productivity."
    explanation: Establishes C. hominivorax as an obligate invader of living tissue.
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The facultative C. hominivorax was identified in 15 (38%) clinical cases, infesting wound and cavitary lesions including orbital, nasal, aural and vaginal, and occurred in both subtropical and Andean regions."
    explanation: Documents the range of wound and cavitary sites colonized by this species in human cases.
- name: Oestrus ovis
  infectious_agent_term:
    preferred_term: Oestrus ovis
    term:
      id: NCBITaxon:123737
      label: Oestrus ovis
  description: >-
    The sheep bot fly, an obligate parasite of small ruminants and the dominant
    cause of human ophthalmomyiasis. Humans are accidental hosts in which the
    larvae do not mature.
  evidence:
  - reference: PMID:31955262
    reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oestrus ovis is the most common cause of human ophthalmomyiasis."
    explanation: Establishes O. ovis as the leading agent of human ocular myiasis.
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Humans are accidental hosts, and there is no evidence that the first instar larvae fully mature within the human host."
    explanation: Supports the accidental-host relationship that limits human O. ovis disease to the first instar.
- name: Chrysomya bezziana
  infectious_agent_term:
    preferred_term: Chrysomya bezziana
    term:
      id: NCBITaxon:69364
      label: Chrysomya bezziana
  description: >-
    The Old World screwworm, an obligate agent of destructive wound and cavitary
    myiasis across Africa, the Indian subcontinent, and southeast and east Asia.
  evidence:
  - reference: PMID:31618203
    reference_title: 'Human Chrysomya bezziana myiasis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis due to Old World screw-worm fly, Chrysomya bezziana, is an important obligate zoonotic disease in the OIE-list of diseases and is found throughout much of Africa, the Indian subcontinent, southeast and east Asia."
    explanation: Establishes C. bezziana as an obligate agent and gives its geographic range.
- name: Wohlfahrtia magnifica
  infectious_agent_term:
    preferred_term: Wohlfahrtia magnifica
    term:
      id: NCBITaxon:641482
      label: Wohlfahrtia magnifica
  description: >-
    A larviparous flesh fly causing obligate traumatic myiasis across the
    Palearctic. Females deposit first-stage larvae directly onto wounds and
    natural orifices.
  evidence:
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult females deposit the first-stage larvae directly onto wounds or natural body orifices (e.g., genitalia) of the host, from where they quickly colonize the host tissue and feed on it for development."
    explanation: Describes the larviposition route and rapid tissue colonization of this species.
  - reference: DOI:10.3390/microorganisms12020233
    reference_title: 'Long Time No Hear, Magnificent Wohlfahrtia! Morphological and Molecular Evidence of Almost Forgotten Flesh Fly in Serbia and Western Balkans'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it is a potentially deadly agent of obligate traumatic myiasis in humans and animals, with a serious impact on welfare and economics"
    explanation: Supports the obligate traumatic parasitism and clinical severity of W. magnifica.
- name: Lucilia sericata
  infectious_agent_term:
    preferred_term: Lucilia sericata
    term:
      id: NCBITaxon:13632
      label: Lucilia sericata
  description: >-
    A facultative calliphorid blowfly that colonizes necrotic wounds. It is both
    an agent of nosocomial wound and oral myiasis and the species used
    therapeutically for maggot debridement.
  evidence:
  - reference: DOI:10.57187/s.3827
    reference_title: 'Myiasis in the intensive care unit: report from Switzerland and review of worldwide cases'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe the first report of hospital-acquired oral myiasis caused by Lucilia sericata occurring in a Swiss ICU."
    explanation: Documents L. sericata as an agent of hospital-acquired human myiasis.
- name: Sarcophaga haemorrhoidalis
  infectious_agent_term:
    preferred_term: Sarcophaga haemorrhoidalis
    term:
      id: NCBITaxon:1234591
      label: Sarcophaga haemorrhoidalis
  description: >-
    A flesh fly recovered most often in accidental intestinal myiasis, where
    larvae ingested with contaminated food are later passed in faeces.
  evidence:
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 7 larvae, 5 were Sarcophaga haemorrhoidalis, 1 Megaselia species and 1 was identified as Muscina stabulans."
    explanation: Identifies S. haemorrhoidalis as the commonest agent in an intestinal myiasis case series.
agent_life_cycle:
  description: >-
    Myiasis-causing flies share a holometabolous life cycle in which only the
    larval instars are parasitic. Eggs or first-instar larvae reach the host by
    direct deposition, by a phoretic arthropod vector, or via contaminated
    clothing, soil, or food; the larvae feed and moult within host tissue and
    then leave to pupate in soil.
  hosts:
  - preferred_term: humans
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: accidental or incidental host
  life_cycle_stages:
  - name: Egg deposition or larviposition on the host
    life_cycle_stage_term:
      preferred_term: egg stage
      term:
        id: OPL:0000180
        label: egg stage
    description: >-
      Eggs are laid on skin, wounds, clothing, or soil, or first-stage larvae are
      deposited directly onto wounds and orifices by larviparous species.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult females deposit the first-stage larvae directly onto wounds or natural body orifices (e.g., genitalia) of the host, from where they quickly colonize the host tissue and feed on it for development."
      explanation: Documents direct larviposition onto host wounds and orifices.
  - name: Parasitic larval instars feeding within host tissue
    life_cycle_stage_term:
      preferred_term: parasitic larval instar
    description: >-
      First- through third-stage larvae penetrate, migrate within, and feed on
      host tissue, which is the only phase of the life cycle that causes disease.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "During the parasitic stages, the myiasis-causing larvae employ sophisticated survival strategies. They penetrate the host's skin to invade the tissue, migrate within tissues, and feed on it."
      explanation: Describes the parasitic larval phase as penetration, migration, and feeding.
  - name: Larval exit and pupation off the host
    life_cycle_stage_term:
      preferred_term: pupal stage
    description: >-
      Mature third-stage larvae leave the lesion and pupate in soil, so the host
      lesion resolves once the larvae depart or are removed.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the subsequent non-parasitic post-larval stages, fully grown third-stage larvae leave the damaged tissue, fall to the ground, and burrow into the soil to pupate."
      explanation: Documents larval departure from the host and pupation in soil.
transmission:
- name: Direct oviposition or larviposition onto skin, wounds, and orifices
  description: >-
    Obligate wound species deposit eggs or first-stage larvae straight onto open
    wounds, ulcers, or natural body orifices, from which larvae colonize adjacent
    tissue within hours.
  evidence:
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult females deposit the first-stage larvae directly onto wounds or natural body orifices (e.g., genitalia) of the host, from where they quickly colonize the host tissue and feed on it for development."
    explanation: Supports direct deposition onto wounds and orifices as an acquisition route.
- name: Phoretic transport of eggs by blood-feeding arthropods
  description: >-
    Dermatobia hominis never contacts the host itself: it glues its eggs to
    mosquitoes and other blood-feeding arthropods, which deliver them to the skin
    during a blood meal.
  evidence:
  - reference: PMID:14726861
    reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Instead, the adult female infests hosts indirectly by using blood-feeding arthropods to serve as phoretic vectors to transport the eggs."
    explanation: Documents the phoretic vector route unique to D. hominis.
- name: Contact with contaminated soil, clothing, or bedding
  description: >-
    Tumbu-fly eggs laid on soil or on laundry dried outdoors hatch on contact
    with skin, so infestation follows sleeping on the ground or wearing
    unironed line-dried clothing.
  evidence:
  - reference: PMID:41562817
    reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Awareness of exposure risks-including soil contact, infested clothing, and poor living conditions-is essential to reducing morbidity and preventing complications like secondary bacterial infection."
    explanation: Names soil contact and infested clothing as the exposure route for furuncular myiasis.
  - reference: PMID:41562817
    reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A healthy male in his forties returned to the UK after a month-long visit to rural Ethiopia, during which he slept on dirt floors and hung his washing on a line."
    explanation: Documents the specific soil-and-laundry exposure preceding an extensive infestation.
- name: Ingestion of food contaminated with eggs or larvae
  description: >-
    Intestinal myiasis follows accidental swallowing of eggs or larvae deposited
    on food by synanthropic flies.
  evidence:
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This type of infestation results when eggs or larvae of the fly, deposited on food are inadvertently taken by man."
    explanation: Supports foodborne ingestion as the route for the intestinal form.
environmental:
- name: Open or neglected wound in a tropical or subtropical setting
  presence: PRESENT
  description: >-
    An untended open wound is both the deposition site and the substrate for
    obligate and facultative wound species.
  influences_mechanisms:
  - target: Larval deposition on host skin, wound, or body orifice
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Gravid flies are attracted to and oviposit directly into open wounds, so
      the presence of an exposed wound is the proximate condition for larval
      deposition rather than a background susceptibility factor.
    evidence:
    - reference: PMID:41970302
      reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Myiasis is larval infestation of tissues, particularly common in tropical, and subtropical regions, especially in pre-existing wounds."
      explanation: Links pre-existing wounds directly to where larval infestation is established.
  evidence:
  - reference: PMID:41970302
    reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor hygiene, inadequate wound care, and exposed wounds, can predispose to secondary bacterial infection."
    explanation: Supports neglected wound care as the environmental context for severe disease.
- name: Poor hygiene, low socioeconomic status, and impaired self-care
  presence: PRESENT
  description: >-
    Myiasis concentrates in people who cannot clean or protect a wound or body
    orifice, including those with neurological or locomotor disability, substance
    dependence, homelessness, or advanced age.
  influences_mechanisms:
  - target: Larval deposition on host skin, wound, or body orifice
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired self-care does not itself put larvae on the host; it removes the
      behaviours (wound cleaning, brushing flies away, closing the lips) that
      would otherwise interrupt deposition, so it is a susceptibility context
      layered over the actual deposition route.
    evidence:
    - reference: PMID:33125723
      reference_title: 'Oral myiasis: Analysis of cases reported in the English literature from 1990 to 2020.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The condition predominantly affects individuals with neurological and/or locomotor disabilities, of low socioeconomic status, with poor oral hygiene and chemical dependence and individuals with previous injuries or with the absence of lip sealing."
      explanation: Identifies impaired self-care and hygiene as the risk context rather than a deposition mechanism.
  evidence:
  - reference: PMID:31618203
    reference_title: 'Human Chrysomya bezziana myiasis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the first human case due to C. bezziana was reported in 1909, we have summarized 291 cases and found that these cases often occurred in patients with poor hygiene, low socio-economic conditions, old age, and underlying diseases including infections, age-related diseases, and noninfectious chronic diseases."
    explanation: Supports the socioeconomic and comorbidity risk profile across 291 human cases.
  - reference: PMID:21872507
    reference_title: 'Oral and maxillofacial myiasis: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral-maxillofacial myiasis affects individuals with poor hygiene and neurologic and/or psychologic alterations."
    explanation: Independently supports the impaired-self-care risk profile.
- name: Travel to endemic tropical regions
  presence: PRESENT
  description: >-
    Most myiasis diagnosed in non-endemic countries is imported by returning
    travellers, in whom it is among the commonest travel-associated skin
    diseases.
  influences_mechanisms:
  - target: Larval deposition on host skin, wound, or body orifice
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Travel does not itself deposit larvae; it moves a non-immune, unprotected
      host into the range of the obligate flies, which is why a traveller's
      exposure window is short and the infestation presents after return. This is
      the dominant route by which the deposition node is reached in non-endemic
      countries.
    evidence:
    - reference: PMID:20883399
      reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Myiasis is the fourth most common travel-associated skin disease and cutaneous myiasis is the most frequently encountered clinical form."
      explanation: Ranks travel-acquired myiasis among the commonest imported skin diseases, establishing travel as the predisposing route to larval deposition.
    - reference: PMID:38547087
      reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "More than half of the reported cases were from travelers returning from SSA (n = 122, 77.7%)."
      explanation: Quantifies the traveller share of cases, showing that most reported deposition events in this region occur in travellers.
  evidence:
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis is the fourth most common travel-associated skin disease and cutaneous myiasis is the most frequently encountered clinical form."
    explanation: Supports travel as the dominant exposure context outside endemic areas.
  - reference: PMID:38547087
    reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of the reported cases were from travelers returning from SSA (n = 122, 77.7%)."
    explanation: Quantifies the traveller share of reported sub-Saharan African cases.
- name: Close occupational contact with sheep and goats
  presence: PRESENT
  description: >-
    Ophthalmomyiasis follows larviposition by Oestrus ovis, whose true hosts are
    small ruminants, so shepherds and farmers are classically affected.
  influences_mechanisms:
  - target: Larval deposition on host skin, wound, or body orifice
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proximity to the fly's natural ruminant hosts raises the probability that a
      larvipositing female strikes a human eye instead, without itself being the
      deposition event.
    evidence:
    - reference: PMID:31955262
      reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "O. ovis infestation is usually reported in shepherds and farmers although there is a high prevalence of infection in urban areas as well."
      explanation: Supports ruminant contact as a risk context while noting it is not required.
  evidence:
  - reference: PMID:31955262
    reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "O. ovis infestation is usually reported in shepherds and farmers although there is a high prevalence of infection in urban areas as well."
    explanation: Supports the occupational association and its incompleteness.
pathophysiology:
- name: Larval deposition on host skin, wound, or body orifice
  biological_scale: ORGANISM
  description: >-
    The initiating event is mechanical delivery of eggs or first-instar larvae to
    the host surface, by direct oviposition, larviposition, a phoretic arthropod
    vector, contaminated clothing or soil, or ingestion.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Larval penetration and burrowing into host tissue
    description: Larvae delivered to the surface immediately begin to penetrate the underlying tissue.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult females deposit the first-stage larvae directly onto wounds or natural body orifices (e.g., genitalia) of the host, from where they quickly colonize the host tissue and feed on it for development."
      explanation: Connects deposition directly to rapid colonization of host tissue.
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis is defined as the infestation of live vertebrates (humans and/or animals) with dipterous larvae."
    explanation: Establishes larval arrival on a live host as the initiating event.
- name: Larval penetration and burrowing into host tissue
  biological_scale: TISSUE
  description: >-
    Larvae breach the epidermis or mucosa and burrow into the dermis, subcutis,
    or submucosa, creating the cavity in which they will feed. This is a
    mechanical invasion by a metazoan parasite, not colonization by a
    replicating microbe, and the depth reached is what separates a self-limited
    furuncular lesion from progressive destruction by an obligate species.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Larval excretory-secretory protease release
    description: >-
      Once inside the tissue the larva secretes the proteolytic products that
      allow it to feed and to extend the burrow.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Some studies on myiasis-causing flies have demonstrated that proteolytic enzymes are a major component for the establishment, migration, feeding, growth, and development of myiasis-causing larvae."
      explanation: Ties tissue establishment and migration to secreted proteolytic enzymes.
  evidence:
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During the parasitic stages, the myiasis-causing larvae employ sophisticated survival strategies. They penetrate the host's skin to invade the tissue, migrate within tissues, and feed on it."
    explanation: Directly describes penetration, intratissue migration, and feeding.
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike most dipteran larvae, which preferentially colonize necrotic tissue, C. hominivorax larvae invade and consume living tissue of warm-blooded hosts, causing a rapidly progressive condition known as myiasis."
    explanation: Establishes invasion of living tissue by obligate species in human disease.
- name: Larval excretory-secretory protease release
  biological_scale: MOLECULAR
  description: >-
    Parasitic-stage larvae secrete abundant serine proteases and collagenases in
    their salivary and excretory-secretory products. These enzymes are the
    principal molecular effectors of myiasis, serving both larval nutrition and
    the digestion of host structural proteins.
  molecular_functions:
  - preferred_term: serine-type endopeptidase activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  downstream:
  - target: Proteolytic digestion of host tissue
    description: Secreted proteases degrade host structural and plasma proteins at the feeding site.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12809756
      reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ESP of O. ovis larvae degrade mucosal and plasmatic components such as mucin, albumin or immunoglobulin G."
      explanation: Demonstrates that larval secretions degrade host mucosal and plasma proteins.
  - target: Larval modulation of the host immune response
    description: >-
      The same secreted protease repertoire cleaves host immune effectors,
      blunting the response that would otherwise expel the larva.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17697751
      reference_title: Proteolytic activity in salivary gland products of sheep bot fly (Oestrus ovis) larvae.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Serine proteases in O. ovis salivary gland products are most likely involved in larval nutrition and host immuno-modulation."
      explanation: Links the secreted serine proteases to host immunomodulation as well as nutrition.
  evidence:
  - reference: PMID:12809756
    reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A preliminary biochemical characterization, using substrate gel analysis and inhibitor sensitivity, demonstrated the presence of at least six major serine proteases (molecular weights from 20 to 100 kDa), mainly trypsin-like, secreted in the digestive tube of larvae."
    explanation: Biochemically characterizes the secreted serine protease repertoire.
  - reference: PMID:17697751
    reference_title: Proteolytic activity in salivary gland products of sheep bot fly (Oestrus ovis) larvae.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proteases in O. ovis salivary gland products belong to the serine subclass."
    explanation: Confirms the serine class of the salivary proteases.
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, the expression level analysis of the likely parasitism-related genes in parasitic wound-collected larvae revealed a significant upregulation of 88 peptidase genes (including 47 serine peptidase genes), 110 cuticle protein genes, and 21 heat shock protein (hsp) genes."
    explanation: Shows transcriptional upregulation of peptidase genes specifically in the parasitic larval stage.
- name: Proteolytic digestion of host tissue
  biological_scale: TISSUE
  description: >-
    Larval collagenases and proteases digest the structural components of skin
    and connective tissue, liquefying the feeding site and producing the
    characteristic exudate. This enzymatic destruction, not an inflammatory
    response, generates the primary lesion.
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Tissue necrosis and cavity formation
    description: Continued enzymatic and mechanical destruction converts the burrow into a necrotic cavity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "myiasis can give rise to necrosis, decay, and the excretion of host tissues"
      explanation: Connects larval feeding activity to necrosis and loss of host tissue.
  evidence:
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The activity study of L. cuprina collagenases and proteases suggested that they were not only involved in larval nutrition but also digested structural components of the skin, contributing to the formation of lesions and the production of exudates"
    explanation: Attributes lesion formation and exudate directly to digestion of skin structural components.
- name: Tissue necrosis and cavity formation
  biological_scale: TISSUE
  description: >-
    The feeding larvae enlarge a necrotic cavity within the host. In furuncular
    disease this remains a closed nodule with a breathing punctum; in obligate
    wound and cavitary disease it extends into surrounding living tissue and can
    destroy palate, orbit, or bone.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Secondary bacterial superinfection
    description: The necrotic, exudative cavity is a permissive environment for bacterial proliferation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "creating an environment conducive to the proliferation of bacteria"
      explanation: States that the necrotic tissue environment created by myiasis promotes bacterial proliferation.
  - target: Host inflammatory and eosinophilic response
    description: Tissue destruction and larval antigens elicit local and systemic inflammation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30647793
      reference_title: 'Otomyiasis: Systematic Review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It can cause a variety of local symptoms, like erythema or pain, depending on its location, and generalized symptomatology, such as fever and malaise."
      explanation: Documents the local inflammatory and systemic response following tissue involvement.
  evidence:
  - reference: DOI:10.21315/aos2025.2001.cr03
    reference_title: 'Extensive Palatal Necrosis Secondary to Chrysomya bezziana Myiasis: A Case Report'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Manifestations comprised oral bleeding, fever, and necrotic palatal ulcers infested with maggots."
    explanation: Documents necrotic cavitary destruction of the palate by larval feeding in a human case.
  - reference: PMID:34363696
    reference_title: 'Cutaneous myiasis in skin cancer and malignant wounds: a systematic review.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Its contribution to the greater tumor tissue destruction is clear; however, more studies are required."
    explanation: Supports larval contribution to tissue destruction while flagging the limited evidence base.
- name: Larval modulation of the host immune response
  biological_scale: MOLECULAR
  description: >-
    Larval secretions cleave immunoglobulin and complement and suppress
    lymphocyte proliferation, allowing a large metazoan parasite to persist in
    tissue for days to weeks without being expelled.
  downstream:
  - target: Larval maturation and emergence from the host
    description: Immune evasion permits the larva to complete its parasitic instars in situ.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12809756
      reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Their involvement in larval trophic activity and evasion from the host immune response is further discussed as O. ovis excretory/secretory serine proteases could represent potential vaccinal targets."
      explanation: Supports a proposed role in immune evasion and larval nutrition, stated as an inference rather than a demonstrated outcome.
  evidence:
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "secretes a protein called blowfly larval immunosuppressive protein (BLIP), which inhibits lymphocyte proliferation in sheep by at least 70%"
    explanation: Quantifies larval suppression of host lymphocyte proliferation in a ruminant host.
  - reference: PMID:12809756
    reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ESP of O. ovis larvae degrade mucosal and plasmatic components such as mucin, albumin or immunoglobulin G."
    explanation: Shows degradation of host immunoglobulin G by larval secretions.
- name: Host inflammatory and eosinophilic response
  biological_scale: TISSUE
  description: >-
    Larval antigens and tissue injury drive a local inflammatory infiltrate with
    prominent eosinophils and neutrophils, and in some patients a systemic
    eosinophilia with elevated acute-phase reactants that resolves after the
    larvae are removed.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: eosinophil chemotaxis
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
    modifier: INCREASED
  evidence:
  - reference: PMID:34222451
    reference_title: 'Cutaneous myiasis with eosinophilic pleural effusion: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis should be an important consideration for the differential diagnosis when eosinophilic pleural effusion with blood eosinophilia is observed."
    explanation: Documents a systemic eosinophilic response attributable to cutaneous myiasis.

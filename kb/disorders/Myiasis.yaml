    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Involvement of the external parts of the female genitalia, especially the labia majora and minora, is often accompanied by symptoms such as tenderness, erythema and inflammation"
    explanation: Generalizes tenderness, erythema, and inflammation beyond the single case.
  - reference: PMID:37043897
    reference_title: 'Urogenital myiasis in a post-menopausal rural woman: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infection and necrosis were observed in the labia minora and vaginal canal due to the existence of larvae that ate away the healthy tissues."
    explanation: Documents progression from inflammation to necrosis attributable to larval feeding.
- name: Larvae passed in stool
  category: Gastrointestinal
  subtype: Intestinal
  description: >-
    Recovery of living larvae in faeces is the defining observation of intestinal
    myiasis, and the reason the diagnosis is frequently confused with pinworm
    infestation.
  diagnostic: true
  evidence:
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intestinal myiasis is a condition when the fly larvae inhabit the gastrointestinal tract and are passed out in faeces."
    explanation: Defines the passage of larvae in faeces as the presenting finding.
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is not uncommon and is often misdiagnosed as pinworm infestation."
    explanation: Supports the diagnostic confusion this finding creates.
histopathology:
- name: Larval body parts within an inflamed tissue cavity
  description: >-
    Biopsy or debridement specimens show larval cuticle, spines, and internal
    organs surrounded by a mixed inflammatory infiltrate, with adjacent tissue
    necrosis but no neoplastic or granulomatous process.
  diagnostic: true
  evidence:
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathology excluded neoplasm and only showed inflammatory changes."
    explanation: Documents the inflammatory, non-neoplastic histology of an infested lesion.
imaging_findings:
- name: Larva visible within a furuncular nodule on ultrasound
  modality: ULTRASOUND
  description: >-
    High-resolution ultrasound of a suspected furuncular lesion shows the larva
    itself as a well-defined highly echogenic focus inside a hypoechoic cavity,
    segmented on longitudinal section and casting a distal acoustic shadow. It
    both confirms the diagnosis and guides complete removal of the larva.
  located_in:
    preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  diagnostic: false
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrasound can be very useful to confirm a case of furuncular myiasis and also for the complete removal of the larvae"
    explanation: States the confirmatory and removal-guiding role of ultrasound in furuncular myiasis.
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A well-defined highly echogenic area surrounded by a hypoechoic area, the presence of segmentations on longitudinal sections, and distal shadowing"
    explanation: Describes the sonographic appearance of the larva that defines this finding.
- name: Larval movement detected on real-time ultrasound
  modality: ULTRASOUND
  description: >-
    Observing the larva move during the scan is what separates this from any
    other echogenic subcutaneous focus, and it is the one imaging observation
    the literature treats as definitive rather than suggestive.
  located_in:
    preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  diagnostic: true
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A definitive diagnosis of myiasis can be achieved if larval movement is detected during the ultrasound."
    explanation: States that detected larval movement establishes a definitive diagnosis, which is what makes this finding diagnostic.
- name: Central opening with dilated vessels and barb-like spines on dermoscopy
  modality: OTHER
  description: >-
    Dermoscopy of a furuncular lesion shows the punctum surrounded by dilated
    vessels, with the larva's posterior end and its black barb-like spines
    visible through it. A bedside adjunct when the diagnosis is in doubt, not a
    cross-sectional imaging study - recorded with modality OTHER because the
    modality enum has no dermoscopy value.
  located_in:
    preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  diagnostic: false
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The examination reveals a central opening surrounded by dilated blood vessels and a yellowish structure with black barblike spines"
    explanation: Describes the dermoscopic appearance of a furuncular myiasis lesion.

diagnosis:
- name: Direct visualization and recovery of larvae
  description: >-
    The diagnosis is made by seeing or extracting living larvae from the lesion;
    no serological or molecular test on the patient is required.
  evidence:
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On examination, there was an ulcerated area in the posterior oro-nasopharynx filled with maggots."
    explanation: Diagnosis established by direct visualization of larvae in the lesion.
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A sample taken demonstrated Oestrus ovis infestation and confirmed the diagnosis of ophthalmomyiasis externa."
    explanation: Confirms diagnosis by recovery and examination of the larva.
- name: Morphological and molecular species identification of the recovered larva
  description: >-
    Species assignment guides treatment, prognosis, and public health response,
    but morphological keys require entomological expertise and are increasingly
    supplemented by DNA barcoding.
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When treating a patient with myiasis, it is critical to make the correct identification of the larva."
    explanation: States why species identification is a required diagnostic step.
  - reference: PMID:38547087
    reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians in Sub-Saharan Africa often misdiagnose the disease and most of them lack the expertise to properly identify larvae, so we recommend the extensive use of molecular identification methods instead."
    explanation: Documents the limits of morphological identification and the case for molecular methods.
differential_diagnoses:
- name: Bacterial furuncle or abscess
  description: >-
    A furuncular myiasis nodule presents like a staphylococcal boil. The central
    breathing punctum, the reported sensation of movement, and a compatible
    exposure history are what separate the two.
  distinguishing_features:
  - central punctum with serosanguineous drainage
  - reported sensation of movement within the lesion
  - recent travel to an endemic region
  evidence:
  - reference: PMID:14726861
    reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had a locally painful, firm furuncular lesion with a central pore that drained serosanguineous exudates."
    explanation: >-
      The lesion is described in the same terms as a bacterial boil except for
      the central pore, which is the feature that separates the two at the
      bedside.
  - reference: PMID:41562817
    reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should maintain a high index of suspicion for myiasis in patients with compatible cutaneous lesions and relevant history."
    explanation: Supports exposure history as the trigger for considering myiasis over a bacterial furuncle.
- name: Malignant or neoplastic ulcer
  description: >-
    Cavitary and oral myiasis presenting as a destructive ulcer can be mistaken
    for carcinoma or for invasive fungal disease; conversely, malignant wounds
    themselves predispose to myiasis, so the two co-occur.
  distinguishing_features:
  - visible larvae within the ulcer
  - histopathology showing inflammation without neoplasia
  evidence:
  - reference: DOI:10.21315/aos2025.2001.cr03
    reference_title: 'Extensive Palatal Necrosis Secondary to Chrysomya bezziana Myiasis: A Case Report'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial diagnostic considerations encompassed mucormycosis and neoplastic lesions; however, further scrutiny revealed primary palatal myiasis caused by Chrysomya bezziana species."
    explanation: Documents mucormycosis and neoplasia as the competing diagnoses actually considered.
  - reference: PMID:34363696
    reference_title: 'Cutaneous myiasis in skin cancer and malignant wounds: a systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous myiasis in patients with malignant wounds or skin cancer is a rare and undesirable event with limited epidemiological data."
    explanation: Supports the co-occurrence of myiasis with malignant wounds.
- name: Infectious and allergic conjunctivitis
  description: >-
    Ophthalmomyiasis externa presents with redness, watering, and foreign-body
    sensation and is routinely first treated as conjunctivitis or a corneal
    abrasion; the diagnosis turns on seeing the motile larvae.
  distinguishing_features:
  - motile organisms visible on the ocular surface
  - recent exposure to sheep, goats, or a Mediterranean rural setting
  evidence:
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presentation of lacrimation, hyperaemia and foreign body sensation has a broad differential diagnosis including viral, bacterial and allergic conjunctivitis."
    explanation: Names the competing ocular diagnoses that myiasis mimics.
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A sample taken demonstrated Oestrus ovis infestation and confirmed the diagnosis of ophthalmomyiasis externa."
    explanation: Confirms that recovery and identification of the larva is what resolves the differential.
- name: Pinworm and other helminth infestation
  description: >-
    Reported passage of moving worms in stool leads to a presumptive diagnosis of
    enterobiasis; larvae are morphologically distinct and do not respond to
    anthelmintics.
  distinguishing_features:
  - dipteran larval morphology on microscopy
  - failure to respond to standard anthelmintic therapy
  evidence:
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is not uncommon and is often misdiagnosed as pinworm infestation."
    explanation: Names enterobiasis as the usual misdiagnosis.
  - reference: PMID:22885201
    reference_title: Intestinal myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high index of suspicion is required for clinical diagnosis when the patient complains of passing wriggling worms in faeces for a long period without any response to antihelminthics."
    explanation: Gives the anthelmintic non-response that distinguishes the two.
treatments:
- name: Mechanical extraction of larvae
  description: >-
    Complete physical removal of every larva is the definitive treatment across
    all clinical forms, because the disease is caused by the physical presence of
    the parasite rather than by a replicating pathogen.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Foreign Body Removal
    term:
      id: NCIT:C50821
      label: Foreign Body Removal
  target_mechanisms:
  - target: Larval penetration and burrowing into host tissue
    treatment_effect: INHIBITS
    description: >-
      Extraction removes the parasite that is producing the lesion, terminating
      both the mechanical burrowing and the secretion of digestive enzymes.
    evidence:
    - reference: PMID:12718772
      reference_title: Furuncular myiasis by tumbu fly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The lesions were treated by removal of the larva followed by twice daily application of an antibacterial ointment."
      explanation: Documents larval removal as the therapeutic act in a 248-case series.
  evidence:
  - reference: PMID:12718772
    reference_title: Furuncular myiasis by tumbu fly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The extraction was done by injecting 2% xylocaine over the base of the nodule."
    explanation: Describes the local-anaesthetic extraction technique used in a large series.
  - reference: PMID:12718772
    reference_title: Furuncular myiasis by tumbu fly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Care was exercised in not damaging the larva while extracting."
    explanation: Records the requirement to extract the larva intact.
  - reference: PMID:35878965
    reference_title: Ophthalmomyiasis externa caused by Oestrus ovis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with prophylactic topical antibiotics and subsequently made a full recovery."
    explanation: Documents full recovery after larval removal with antibiotic prophylaxis in ocular disease.
- name: Occlusion of the breathing punctum
  description: >-
    Covering the central pore of a furuncular lesion with an occlusive substance
    deprives the larva of air and induces it to migrate outward, allowing atraumatic
    recovery.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Larval maturation and emergence from the host
    treatment_effect: ACTIVATES
    description: >-
      Occlusion drives the larva out of the cavity before it would otherwise
      complete its instars, converting the natural endpoint of the infestation
      into a therapeutic one.
    evidence:
    - reference: PMID:14726861
      reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient applied an occlusive ointment and recovered the larva after it emerged."
      explanation: Documents occlusion inducing larval emergence and recovery.
  evidence:
  - reference: PMID:33125723
    reference_title: 'Oral myiasis: Analysis of cases reported in the English literature from 1990 to 2020.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were different forms and combinations of treatments: manual removal of larvae and surgical debridement, application of asphyxiating substances, antibiotic therapy, and use of ivermectin."
    explanation: Lists asphyxiating substances among the treatment modalities in reported cases.
- name: Surgical debridement
  description: >-
    Extensive wound, oral, and cavitary disease requires operative removal of
    necrotic tissue together with the larvae; it is the treatment of choice in
    oral and maxillofacial myiasis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Tissue necrosis and cavity formation
    treatment_effect: INHIBITS
    description: >-
      Debridement removes the necrotic substrate that both harbours larvae and
      supports bacterial superinfection.
    evidence:
    - reference: PMID:21872507
      reference_title: 'Oral and maxillofacial myiasis: a case series and literature review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The sample was made up of 10 patients, all treated with surgical debridement whether or not associated with the use of oral ivermectin."
      explanation: Documents debridement as the intervention applied to every case in the series.
  evidence:
  - reference: PMID:21872507
    reference_title: 'Oral and maxillofacial myiasis: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment of choice is surgical debridement."
    explanation: States debridement as the preferred treatment for oral and maxillofacial disease.
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An examination was performed under anesthesia followed by manual removal of larvae, surgical debridement with biopsy, and treatment with antiparasitic medicines and antibiotics."
    explanation: Documents combined debridement, extraction, antiparasitic, and antibiotic management.
- name: Ivermectin
  description: >-
    Ivermectin, given orally or as a topical irrigation, kills or paralyses
    larvae and is used as an adjunct when lesions are numerous, deep, or
    inaccessible to mechanical extraction. It supplements rather than replaces
    removal.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ivermectin
      term:
        id: CHEBI:6078
        label: ivermectin
  target_mechanisms:
  - target: Larval penetration and burrowing into host tissue
    treatment_effect: INHIBITS
    description: >-
      Ivermectin acts on the larva itself, ending the burrowing and secretory
      activity that produces the lesion; expelled larvae can then be recovered.
    evidence:
    - reference: PMID:30077978
      reference_title: Treatment of nasal myiasis with ivermectin irrigation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On subsequent nasal irrigation with ivermectin solution, the patient self-expulsed approximately 50 larvae within 15 min."
      explanation: Documents rapid larval expulsion following direct ivermectin irrigation.
  evidence:
  - reference: PMID:30077978
    reference_title: Treatment of nasal myiasis with ivermectin irrigation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we propose that ivermectin irrigation is a simple and effective treatment for nasal myiasis."
    explanation: Proposes ivermectin irrigation as effective therapy for nasal disease, on single-case evidence.
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ivermectin, when it became available, was used to treat furuncular, wound, and cavitary lesions successfully."
    explanation: Documents successful ivermectin use across furuncular, wound, and cavitary forms.
  - reference: PMID:35718295
    reference_title: 'Severe Vaginal Myiasis: Successful Management With Ivermectin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relevance of this case is providing a report of a successful management with ivermectin of a case of severe vaginal myiasis."
    explanation: Reports successful ivermectin treatment in severe urogenital disease.
- name: Antibacterial therapy for secondary infection
  description: >-
    Systemic or topical antibiotics treat the bacterial superinfection that
    complicates necrotic myiasis wounds. They have no activity against the larvae
    themselves.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Secondary bacterial superinfection
    treatment_effect: INHIBITS
    description: Antibiotics target the superinfecting bacteria, not the parasite.
    evidence:
    - reference: PMID:41562817
      reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Management included wound occlusion and systemic antibiotics."
      explanation: Documents systemic antibiotics used for the culture-proven superinfection.
  evidence:
  - reference: PMID:35718295
    reference_title: 'Severe Vaginal Myiasis: Successful Management With Ivermectin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe cases of vaginal myiasis can require repeated debridement of necrotic tissue and systemic antibiotics in addition to antiparasitic medication."
    explanation: Supports systemic antibiotics as an adjunct to debridement and antiparasitic therapy.
  - reference: PMID:12718772
    reference_title: Furuncular myiasis by tumbu fly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lesions were treated by removal of the larva followed by twice daily application of an antibacterial ointment."
    explanation: Documents topical antibacterial treatment routinely applied after extraction.
- name: Wound care and supportive management
  description: >-
    Irrigation, dressing, and where necessary fluid resuscitation and delayed
    skin grafting manage the tissue defect left after the larvae are removed.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Wound Care Management
    term:
      id: NCIT:C116681
      label: Wound Care Management
  target_mechanisms:
  - target: Systemic sepsis and progressive tissue destruction
    treatment_effect: INHIBITS
    description: Supportive care and wound management interrupt progression from a colonized wound to systemic sepsis.
    evidence:
    - reference: PMID:41970302
      reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a case of neglected myiasis wound in a laborer from rural Nepal presenting with septic shock, who was managed with intravenous fluids, antibiotics, wound care, and delayed skin grafting, resulting in complete functional recovery."
      explanation: Documents the supportive package that reversed established septic shock.
  evidence:
  - reference: DOI:10.21315/aos2025.2001.cr03
    reference_title: 'Extensive Palatal Necrosis Secondary to Chrysomya bezziana Myiasis: A Case Report'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutic interventions entailed bedside maggot removal and meticulous wound care, with topical hyaluronic acid application and oral hygiene guidance."
    explanation: Documents wound care and hygiene measures alongside larval removal.
progression:
- phase: Exposure and larval establishment
  notes: >-
    Larvae reach the host surface and penetrate within hours; the earliest
    symptom is usually pruritus or a papule rather than a recognizable lesion.
  evidence:
  - reference: PMID:41562817
    reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He developed pruritic papular lesions that progressed to erythematous furuncles with central puncta and purulent discharge, accompanied by sensations of movement."
    explanation: Documents the sequence from pruritic papule to established furuncle.
- phase: Established lesion with larval growth
  notes: >-
    The larva enlarges within its cavity over days to weeks. Furuncular disease
    remains localized; obligate wound species extend into adjacent living tissue
    and can progress rapidly.
  evidence:
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike most dipteran larvae, which preferentially colonize necrotic tissue, C. hominivorax larvae invade and consume living tissue of warm-blooded hosts, causing a rapidly progressive condition known as myiasis."
    explanation: Contrasts the rapidly progressive obligate course with facultative colonization.
- phase: Complication or resolution
  notes: >-
    Untreated cases either resolve when the larva departs to pupate, or progress
    through secondary bacterial infection to extensive tissue destruction and
    sepsis. Chronicity of months is reported where care is not sought.
  evidence:
  - reference: PMID:21872507
    reference_title: 'Oral and maxillofacial myiasis: a case series and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean time elapsed since the onset of the disease ranged from 4 to 36 months."
    explanation: Documents the long delay to presentation in neglected oral and maxillofacial disease.
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This obligate parasitism can result in severe pain, secondary bacterial infections, disfigurement, and, in the absence of timely treatment, substantial morbidity or death in both humans and animals."
    explanation: Documents the range of outcomes from disfigurement to death without timely treatment.
prevalence:
- population: Ecuador, Amazon region
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 23.0
  notes: >-
    Highest regional annual incidence in the Ecuadorian Ministry of Public Health
    2013-2015 dataset; the coastal and Andean rates were 5.1 and 4.7 per 100,000.
  evidence:
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest annual incidence was reported in the Amazon (23 cases/100,000 population), followed by Coast (5.1/100,000) and Andes (4.7/100,000)."
    explanation: Gives the reported regional annual incidence figures.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No global burden estimate exists. Reporting is not mandatory anywhere,
    surveillance is absent, and the literature is dominated by case reports, so
    prevalence and incidence cannot be estimated reliably.
  evidence:
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human myiasis is a neglected and understudied ectoparasitic infestation, being endemic in both temperate and tropical regions of Ecuador."
    explanation: Characterizes myiasis as neglected and understudied, consistent with the absent global estimate.
  - reference: PMID:31955262
    reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since there is reduced awareness among patients and medical professionals, the real number of ophthalmomyiasis cases is probably significantly higher than published."
    explanation: Supports systematic under-ascertainment of reported case counts.
epidemiology:
- name: Tropical and subtropical distribution with socioeconomic gradient
  description: >-
    Myiasis occurs worldwide but concentrates in poor communities of tropical and
    subtropical countries, where fly abundance, open wounds, and limited
    healthcare access coincide.
  factors:
  - tropical and subtropical climate
  - low socioeconomic status
  - poor hygiene and limited wound care
  evidence:
  - reference: PMID:22232372
    reference_title: Myiasis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distribution of human myiasis is worldwide, with more species and greater abundance in poor socioeconomic regions of tropical and subtropical countries."
    explanation: States the global distribution and its socioeconomic gradient.
  - reference: PMID:29790312
    reference_title: Cavitary myiasis and its management.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cavitary myiasis is rare and occurs more frequently in tropical and subtropical regions of Africa and America associated with low economic status and poor hygiene."
    explanation: Independently supports the geographic and socioeconomic distribution for cavitary disease.
- name: Travel-associated disease in non-endemic countries
  description: >-
    In non-endemic settings myiasis is predominantly imported, and is among the
    most frequent skin diseases diagnosed in returning travellers.
  factors:
  - travel to endemic regions
  - military and occupational deployment
  evidence:
  - reference: PMID:20883399
    reference_title: 'Cutaneous myiasis: a review of the common types of myiasis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis is the fourth most common travel-associated skin disease and cutaneous myiasis is the most frequently encountered clinical form."
    explanation: Ranks myiasis among travel-associated skin diseases.
  - reference: PMID:38547087
    reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of the reported cases were from travelers returning from SSA (n = 122, 77.7%)."
    explanation: Quantifies the traveller fraction of reported cases from one endemic region.
- name: Cutaneous forms dominate the clinical spectrum
  description: >-
    Across published series the skin is the commonest site, with cavitary and
    visceral forms comparatively rare.
  factors:
  - accessibility of skin to ovipositing flies
  evidence:
  - reference: PMID:38547087
    reference_title: 'Human myiasis in Sub-Saharan Africa: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous myiasis was the most common clinical presentation of the disease (n = 86, 54.7%)."
    explanation: Quantifies the cutaneous share of reported sub-Saharan African cases.
  - reference: PMID:37864334
    reference_title: 'Human Oro-Nasopharyngeal Myiasis by Chrysomya Bezziana (Old-World Screwworm): The First Reported Case in Sri Lanka.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cutaneous myiasis is the commonest type, and less commonly, internal tissues and organs are affected."
    explanation: Independently supports the predominance of cutaneous disease.
- name: Healthcare-associated and institutional acquisition
  description: >-
    Myiasis can be acquired in hospitals and long-term care facilities by
    patients who cannot brush flies away, including intubated intensive-care
    patients.
  factors:
  - impaired consciousness or intubation
  - inadequate insect screening in healthcare facilities
  evidence:
  - reference: DOI:10.57187/s.3827
    reference_title: 'Myiasis in the intensive care unit: report from Switzerland and review of worldwide cases'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nosocomial myiasis is seldom reported in Europe, and intensive care unit (ICU)-acquired myiasis is even rarer."
    explanation: Documents nosocomial and ICU-acquired myiasis as a recognized, though rare, entity.
  - reference: PMID:32084134
    reference_title: Human myiasis in Ecuador.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C. hominivorax was also identified in a nosocomial hospital-acquired wound."
    explanation: Records a hospital-acquired screwworm wound infestation.
- name: Climate-sensitive geographic range expansion
  description: >-
    Warming climate and increased mobility are expected to extend the range of
    myiasis-causing flies, and reintroduction of eradicated screwworm populations
    remains a live risk.
  factors:
  - rising air temperature
  - global travel and livestock movement
  evidence:
  - reference: PMID:31955262
    reference_title: Human ophthalmomyiasis caused by Oestrus ovis-first report from Croatia and review on cases from Mediterranean countries.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Global warming predisposes future increase of O. ovis prevalence in humans, which emphasizes the need for mandatory reporting and surveillance of disease."
    explanation: States the expected climate-driven increase and the surveillance gap.
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On August 4, 2025, the U.S. Centers for Disease Control and Prevention (CDC) confirmed the nation's first human case of travel-associated screwworm infestation in decades."
    explanation: Documents a sentinel reintroduction event in a previously eradicated area.
animal_models:
- name: Ovine and caprine nasal Oestrus ovis infestation
  species: Sheep and goat
  publication: PMID:12809756
  description: >-
    The natural host system for Oestrus ovis, the fly that causes most human
    ophthalmomyiasis. In sheep and goats the larva completes development in the
    nasal and sinus cavities, and it is from these hosts that the larval
    excretory-secretory and salivary protease repertoire underpinning this
    entry's molecular arm was characterized. Because humans are accidental hosts
    in whom first-instar larvae do not develop past the ocular surface, this is
    the system in which the mechanism is observable at all - which is precisely
    what the myiasis_protease_mechanism_human_evidence discussion flags.
  modeled_mechanisms:
  - target: Larval excretory-secretory protease release
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Larvae recovered from naturally and experimentally infested small ruminants
      secrete the serine proteases that this node asserts as the principal
      molecular effector of myiasis.
    limitations: >-
      The characterized enzymes come from second- and third-instar larvae
      developing in a permissive ruminant host. In human ophthalmomyiasis only
      first-instar larvae are present and they do not mature, so neither the
      enzyme repertoire nor the delivered dose has been shown to be the same;
      nothing here has been measured in human tissue.
    readouts:
    - name: Serine proteases in larval excretory-secretory products
      target: Larval excretory-secretory protease release
      description: >-
        Substrate-gel zymography with protease-inhibitor class assignment on
        excretory-secretory products of larvae harvested from the host.
      biological_processes:
      - preferred_term: proteolysis
        term:
          id: GO:0006508
          label: proteolysis
      interpretation: >-
        Establishes that the secreted repertoire is dominated by trypsin-like
        serine proteases, which is the enzyme class this node asserts.
      evidence:
      - reference: PMID:12809756
        reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "demonstrated the presence of at least six major serine proteases (molecular weights from 20 to 100 kDa), mainly trypsin-like, secreted in the digestive tube of larvae"
        explanation: Reports the zymographic measurement of the secreted serine protease repertoire.
    - name: Integrity of host mucin, albumin, and immunoglobulin G exposed to larval secretions
      target: Larval excretory-secretory protease release
      description: >-
        Degradation of host mucosal and plasma proteins incubated with larval
        excretory-secretory products.
      direction: DECREASED
      interpretation: >-
        Shows the secreted proteases act on host substrates, not only on larval
        food, which is what makes this node pathogenic rather than merely
        nutritional.
      evidence:
      - reference: PMID:12809756
        reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "ESP of O. ovis larvae degrade mucosal and plasmatic components such as mucin, albumin or immunoglobulin G."
        explanation: Measures loss of host mucin, albumin, and IgG on exposure to larval secretions.
    evidence:
    - reference: PMID:12809756
      reference_title: 'Serine protease activity in excretory-secretory products of Oestrus ovis (Diptera: Oestridae) larvae.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The sheep bot fly, Oestrus ovis, is a very common myiasis of nasal and sinus cavities of sheep and goats causing severe welfare and production implications."
      explanation: Establishes small ruminants as the natural host in which this larval mechanism is studied.
    - reference: PMID:17697751
      reference_title: Proteolytic activity in salivary gland products of sheep bot fly (Oestrus ovis) larvae.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Antigenic protein bands were revealed by immunoblotting using sera obtained from experimentally infested goats."
      explanation: Confirms an in vivo experimental infestation arm in the caprine host, so this is an animal model and not only an ex vivo preparation.
    - reference: DOI:10.1111/mve.12634
      reference_title: 'Prevalence of Oestrus ovis (Diptera: Oestridae) in sheep and goats from the Mediterranean coast of Spain'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The total prevalence was 56.3%, significantly higher in sheep than in goats (61.2% and 43%, respectively)."
      explanation: Quantifies how routinely small ruminants carry this parasite, which is why the veterinary system is the one in which the mechanism is observable at all.
  - target: Larval modulation of the host immune response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The same salivary serine proteases are proposed to blunt the ruminant host
      response, the immune-evasion arm of this node.
    limitations: >-
      Immunomodulation is inferred by the authors from enzyme class and substrate
      range rather than demonstrated by a host-response endpoint, and it is
      inferred in goats. No human immune effector has been tested.
    readouts:
    - name: Protease subclass of salivary gland products
      target: Larval modulation of the host immune response
      description: >-
        Inhibitor-based subclass assignment of the proteolytic activity in
        dissected larval salivary glands.
      interpretation: >-
        Identifies the enzyme class the authors attribute host immunomodulation
        to; the immunomodulatory outcome itself is not measured here.
      evidence:
      - reference: PMID:17697751
        reference_title: Proteolytic activity in salivary gland products of sheep bot fly (Oestrus ovis) larvae.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Proteases in O. ovis salivary gland products belong to the serine subclass."
        explanation: Reports the measured enzyme subclass in salivary gland products.
    evidence:
    - reference: PMID:17697751
      reference_title: Proteolytic activity in salivary gland products of sheep bot fly (Oestrus ovis) larvae.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Serine proteases in O. ovis salivary gland products are most likely involved in larval nutrition and host immuno-modulation."
      explanation: The authors' own hedged inference, which is why this link is graded LOW fidelity and PARTIAL support.
  notes: >-
    The two protease papers are graded IN_VITRO where they report biochemical
    assays on harvested larvae, following the CLAUDE.md rule that
    evidence_source describes the study reported, not the model it came from.
    The MODEL_ORGANISM items are the in vivo statements: natural nasal
    infestation of sheep and goats, and the experimentally infested goats whose
    sera were immunoblotted.
- name: Bactrian camel Wohlfahrtia magnifica wound myiasis
  species: Bactrian camel
  publication: PMID:38297211
  description: >-
    Naturally infested domestic Bactrian camels carrying parasitic-stage
    Wohlfahrtia magnifica larvae in open wounds. W. magnifica is an obligate
    agent of human wound myiasis as well, so this is the closest available
    animal counterpart of the human wound subtype, and it is the system in which
    the parasitic-stage transcriptome behind this entry's protease claims was
    sequenced.
  modeled_mechanisms:
  - target: Larval excretory-secretory protease release
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Wound-collected parasitic larvae upregulate a large peptidase programme,
      giving a transcriptional counterpart to the biochemically measured protease
      secretion asserted by this node.
    limitations: >-
      The readout is transcript abundance in the larva, not enzyme activity in
      host tissue, and the host is a camel wound colonized by an aggregating
      larval mass. Human furuncular disease involves a single larva in a closed
      cavity, so both the delivered enzyme dose and the host compartment differ.
    readouts:
    - name: Peptidase gene expression in parasitic wound-collected larvae
      target: Larval excretory-secretory protease release
      description: >-
        RNA-seq of larvae taken directly from camel wounds, compared with
        non-parasitic developmental stages.
      direction: INCREASED
      biological_processes:
      - preferred_term: proteolysis
        term:
          id: GO:0006508
          label: proteolysis
      interpretation: >-
        Serine peptidase genes are specifically upregulated during the parasitic
        stage, tying the protease programme to parasitism rather than to
        development generally.
      evidence:
      - reference: PMID:38297211
        reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "revealed a significant upregulation of 88 peptidase genes (including 47 serine peptidase genes), 110 cuticle protein genes, and 21 heat shock protein (hsp) genes"
        explanation: Quantifies the stage-specific upregulation of peptidase genes in wound-collected larvae.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Second- and third-stage larvae of W. magnifica were non-invasively collected from the wounds of naturally infested domestic Bactrian camels"
      explanation: Establishes the naturally infested camel wound as the source system for this mechanism.
  - target: Proteolytic digestion of host tissue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Larval feeding in the camel wound produces the tissue necrosis and loss
      that this node asserts as the primary lesion.
    limitations: >-
      Necrosis is reported as a general consequence of myiasis rather than
      quantified in this cohort, and no human tissue was examined.
    readouts:
    - name: Host tissue necrosis at the larval feeding site
      target: Proteolytic digestion of host tissue
      description: Gross and descriptive assessment of the infested wound.
      direction: INCREASED
      interpretation: >-
        Confirms that larval feeding converts intact wound tissue into necrotic
        debris, the tissue-level consequence this node predicts.
      evidence:
      - reference: PMID:38297211
        reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "myiasis can give rise to necrosis, decay, and the excretion of host tissues"
        explanation: States the necrotic tissue outcome of larval feeding.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Second- and third-stage larvae of W. magnifica were non-invasively collected from the wounds of naturally infested domestic Bactrian camels"
      explanation: Ties the tissue-digestion claim to the infested camel wound system.
- name: Ovine Lucilia cuprina cutaneous myiasis
  species: Sheep
  publication: PMID:38297211
  description: >-
    Sheep infested by Lucilia cuprina, the classical facultative blowfly-strike
    system. It supplies the two mechanistic claims this entry makes about larval
    immunosuppression and about collagenase-mediated digestion of skin, and it is
    the third non-human system named in the
    myiasis_protease_mechanism_human_evidence discussion.
  modeled_mechanisms:
  - target: Larval modulation of the host immune response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Larval secretion of blowfly larval immunosuppressive protein suppresses
      ovine lymphocyte proliferation, the only quantified immunosuppression
      behind this node.
    limitations: >-
      The effect is measured on sheep lymphocytes with a sheep-adapted parasite,
      and it reaches this entry through the review section of PMID:38297211
      rather than from the primary report, so the magnitude is cited but not
      independently verified here. No equivalent measurement exists on human
      lymphocytes.
    readouts:
    - name: Ovine lymphocyte proliferation in the presence of larval BLIP
      target: Larval modulation of the host immune response
      description: >-
        Mitogen-stimulated lymphocyte proliferation assay in sheep with and
        without larval immunosuppressive protein.
      direction: DECREASED
      interpretation: >-
        A quantified suppression of at least 70% is the strongest single number
        supporting active larval immune evasion anywhere in this entry, and it is
        entirely non-human.
      evidence:
      - reference: PMID:38297211
        reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "secretes a protein called blowfly larval immunosuppressive protein (BLIP), which inhibits lymphocyte proliferation in sheep by at least 70%"
        explanation: Quantifies suppression of ovine lymphocyte proliferation by a larval secreted protein.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "secretes a protein called blowfly larval immunosuppressive protein (BLIP), which inhibits lymphocyte proliferation in sheep by at least 70%"
      explanation: Establishes the ovine L. cuprina system as informative for larval immune modulation.
  - target: Proteolytic digestion of host tissue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      L. cuprina collagenases and proteases digest skin structural components,
      producing the lesion and exudate this node asserts.
    limitations: >-
      Demonstrated in ovine skin with a facultative parasite that feeds
      superficially as an aggregating mass; the human furuncular lesion is a
      single larva in a closed subcutaneous cavity. As above, the claim is quoted
      from a review section rather than the primary activity study.
    readouts:
    - name: Digestion of skin structural components by larval collagenases
      target: Proteolytic digestion of host tissue
      description: >-
        Enzyme activity assays on larval collagenases and proteases against skin
        structural proteins.
      direction: DECREASED
      interpretation: >-
        Loss of skin structural protein under larval enzyme activity is the
        mechanistic link between protease secretion and lesion formation.
      evidence:
      - reference: PMID:38297211
        reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The activity study of L. cuprina collagenases and proteases suggested that they were not only involved in larval nutrition but also digested structural components of the skin, contributing to the formation of lesions and the production of exudates"
        explanation: Attributes lesion and exudate formation to enzymatic digestion of skin structural components.
    evidence:
    - reference: PMID:38297211
      reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The activity study of L. cuprina collagenases and proteases suggested that they were not only involved in larval nutrition but also digested structural components of the skin, contributing to the formation of lesions and the production of exudates"
      explanation: Establishes the ovine L. cuprina system as informative for enzymatic tissue digestion.
  notes: >-
    Both claims reach this entry through the introduction of PMID:38297211,
    which cites the primary L. cuprina literature. The citation here is to the
    paper actually fetched and quote-checked rather than to a primary report not
    in the reference cache, and fidelity is set LOW accordingly.
- name: BALB/c mouse oral gavage with Clogmia albipunctata
  species: Mouse
  background: BALB/c
  publication: DOI:10.1371/journal.pone.0356742
  description: >-
    A deliberate negative control for the intestinal subtype. BALB/c mice were
    gavaged with viable Clogmia albipunctata eggs and first-instar larvae, the
    species most often recovered in suspected intestinal myiasis, and monitored
    for shedding, colonization, and gut histology. None of the three established.
    Paired in vitro work showed that simulated gastric fluid is lethal to both
    eggs and larvae.
  modeled_mechanisms:
  - target: Larval penetration and burrowing into host tissue
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      Orally delivered larvae did not penetrate or colonize gastrointestinal
      tissue, so this model does not reproduce the invasion step for the
      ingestion route.
    limitations: >-
      A negative result for one accidental species by one route in one host.
      C. albipunctata is a synanthropic moth fly, not an obligate parasite, and
      murine gastric conditions are not identical to human ones, so this bounds
      the pseudomyiasis question rather than excluding true intestinal myiasis by
      other species. It says nothing about the cutaneous or cavitary routes,
      where invasion is well documented in humans.
    readouts:
    - name: Gastrointestinal colonization and mucosal injury after oral gavage
      target: Larval penetration and burrowing into host tissue
      description: >-
        Seven days of faecal examination plus time-point necropsy with
        histological examination of gastrointestinal tissue.
      direction: UNCHANGED
      interpretation: >-
        No shedding, no tissue injury, and no colonization - the invasion step
        this node asserts simply did not occur by the ingestion route.
      evidence:
      - reference: DOI:10.1371/journal.pone.0356742
        reference_title: 'Clogmia albipunctata fails to induce true intestinal myiasis: Evidence from in vitro and in vivo digestive models'
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "the oral gavage of viable eggs and live first-instar larvae in mice resulted in no fecal shedding, tissue injury, or pathological colonization in the gastrointestinal tract"
        explanation: Reports the negative colonization and histology result that defines this readout.
    evidence:
    - reference: DOI:10.1371/journal.pone.0356742
      reference_title: 'Clogmia albipunctata fails to induce true intestinal myiasis: Evidence from in vitro and in vivo digestive models'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BALB/c mice were orally gavaged with viable eggs."
      explanation: Establishes the in vivo murine challenge that makes this model informative for the invasion node.
    - reference: DOI:10.1371/journal.pone.0356742
      reference_title: 'Clogmia albipunctata fails to induce true intestinal myiasis: Evidence from in vitro and in vivo digestive models'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The results support the interpretation that many suspected clinical cases may represent sample contamination or pseudomyiasis rather than true intestinal myiasis."
      explanation: States the authors' own interpretation of the negative result, which is the pseudomyiasis boundary this entry curates in its definitions block.
discussions:
- discussion_id: myiasis_protease_mechanism_human_evidence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the larval serine-protease mechanism characterized in veterinary hosts
    and larval secretions operate the same way in infested human tissue?
  attaches_to:
  - pathophysiology#Larval excretory-secretory protease release
  - pathophysiology#Proteolytic digestion of host tissue
  - pathophysiology#Larval modulation of the host immune response
  rationale: >-
    The molecular arm of this entry rests entirely on non-human evidence: the
    serine-protease characterization comes from Oestrus ovis larvae harvested
    from slaughtered sheep and goats, the transcriptomic parasitism profile from
    Wohlfahrtia magnifica larvae taken from Bactrian camel wounds, and the
    immunosuppression data from Lucilia cuprina in sheep. No study quantifies
    larval protease activity, complement or immunoglobulin cleavage, or
    lymphocyte suppression in human tissue. The mismatch is mechanistically
    meaningful rather than merely notational, because the species that dominate
    human disease differ from those studied: Dermatobia hominis produces a closed
    furuncular cavity with a single larva, whereas the characterized species feed
    as aggregating masses in open ruminant wounds, so both the enzyme dose and
    the host response could differ substantially.
  proposed_experiments:
  - experiment_id: exp_myiasis_human_larval_protease_profile
    name: Protease profiling of larvae recovered from human lesions
    description: >-
      Quantify protease activity and substrate specificity in the
      excretory-secretory products of larvae recovered from human furuncular and
      wound myiasis lesions, using the same substrate-gel and inhibitor-class
      assays applied to Oestrus ovis, so the human-derived repertoire is directly
      comparable to the veterinary one.
  - experiment_id: exp_myiasis_human_serum_immune_cleavage
    name: Complement and immunoglobulin cleavage in autologous human serum
    description: >-
      Compare complement C3 and immunoglobulin cleavage by human-derived versus
      ruminant-derived larval secretions incubated in autologous human serum, to
      test whether the immune-evasion arm demonstrated in ruminants operates on
      human effectors.
  - experiment_id: exp_myiasis_lesion_biopsy_transcriptome
    name: Paired human lesion histology and larval transcriptome
    description: >-
      Characterize the cellular infiltrate and cytokine profile of human myiasis
      lesion biopsies alongside the transcriptome of larvae taken from the same
      lesion, linking host response to larval gene expression within one host
      species.
  notes: >-
    Every pathophysiology node in this chain carries at least one human clinical
    evidence item for the phenotypic consequence; it is the enzymatic mechanism
    linking them that is non-human. The three systems named above are curated
    structurally in `animal_models` - the ovine/caprine Oestrus ovis infestation,
    the Bactrian camel Wohlfahrtia magnifica wound, and ovine Lucilia cuprina
    strike - each linked by `modeled_mechanisms` to the nodes this discussion
    attaches to, with per-link `fidelity` and `limitations` recording the
    species-divergence caveat. The BALB/c mouse Clogmia study is curated there
    too, as a `FAILS_TO_RECAPITULATE` link: it is a negative result about the
    ingestion route rather than about the protease mechanism, which is why it
    does not attach to this discussion.
- discussion_id: myiasis_evidence_base_case_reports
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true global burden of human myiasis, and how do the available
    treatments compare?
  attaches_to:
  - treatments#Ivermectin
  - epidemiology#Tropical and subtropical distribution with socioeconomic gradient
  rationale: >-
    Myiasis is not notifiable in any jurisdiction and there is no surveillance
    system, so incidence and prevalence estimates rest on case reports and
    single-country reviews that are known to under-ascertain. The same gap
    affects therapy: ivermectin dosing and route are supported only by individual
    cases and uncontrolled series, and no comparative trial of mechanical
    removal, occlusion, or antiparasitic adjuncts exists. Standardized case
    definitions separating true myiasis from pseudomyiasis are also lacking.
  proposed_experiments:
  - experiment_id: exp_myiasis_sentinel_surveillance
    name: Sentinel surveillance with species-level reporting
    description: >-
      Establish sentinel surveillance for myiasis in endemic districts with
      mandatory species-level reporting and a case definition that excludes
      pseudomyiasis, to produce the first incidence estimates not derived from
      case reports.
  - experiment_id: exp_myiasis_ivermectin_comparative_study
    name: Comparative study of ivermectin adjunct versus removal alone
    description: >-
      Run a prospective comparative study of ivermectin as an adjunct versus
      mechanical removal alone in wound and cavitary myiasis, with prespecified
      outcomes of complete larval clearance, secondary infection, and tissue
      loss.
  evidence:
  - reference: PMID:30647793
    reference_title: 'Otomyiasis: Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cases are rarely reported, and there are no published management protocols."
    explanation: Documents both the reporting gap and the absence of management protocols.
  - reference: PMID:31618203
    reference_title: 'Human Chrysomya bezziana myiasis: A systematic review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate that cryptic myiasis cases due to the obligate parasite, C. bezziana, are under-recognized."
    explanation: Supports systematic under-recognition of cases even for a listed obligate parasite.
- discussion_id: myiasis_maggot_debridement_duality
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Under what conditions does facultative larval colonization of a wound shift
    from pathological myiasis to therapeutic debridement?
  attaches_to:
  - pathophysiology#Proteolytic digestion of host tissue
  - pathophysiology#Secondary bacterial superinfection
  rationale: >-
    The same species that causes facultative wound myiasis, Lucilia sericata, is
    reared for maggot debridement therapy, where its proteolytic and
    antimicrobial secretions are deliberately used to clean infected wounds. This
    is not a contradiction to be resolved by picking a side; it means the sign of
    the mechanism depends on larval burden, species, tissue selectivity, and
    whether the colonization was controlled. Curating that boundary matters,
    because the entry asserts tissue digestion as pathogenic while the literature
    reports the same activity as beneficial in a controlled setting.
  evidence:
  - reference: DOI:10.3389/fcimb.2025.1568563
    reference_title: Machine learning-based text mining for cutaneous myiasis and potential value of an accidental maggot therapy for complicated skin and soft tissue infection with sepsis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maggot debridement therapy may be a promising treatment and beneficial for soft tissue infection-related sepsis."
    explanation: Reports a beneficial effect of larval colonization in infected soft tissue, the inverse of the pathogenic framing.
notes: >-
  Concept decision: curated as a single Disease entry with anatomical
  has_subtypes, not as a Grouping. MONDO:0019147 carries the `disease_grouping`
  and `ordo_group_of_disorders` subsets, but a dismech Grouping is an explicit
  union over Disease entries that already exist independently, and no myiasis
  clinical form is separately curated in kb/disorders. The forms also share one
  mechanism - larval tissue invasion with proteolytic digestion - and differ by
  colonized site and by the degree of parasitism of the implicated fly, which is
  what has_subtypes encodes. If per-species or per-site entries are curated
  later (e.g. a dedicated screwworm myiasis entry), converting this to a Grouping
  over them would be the right move; the has_subtypes names here are chosen to
  survive that migration.

  Subtype term bindings: the three cutaneous forms and the ocular form bind to
  their own MONDO classes (MONDO:0018941 furuncular, MONDO:0018857 creeping,
  MONDO:0015622 wound, MONDO:0000301 ophthalmomyiasis). MONDO has no per-cavity
  class, so the nasopharyngeal, oral, aural, intestinal, and urogenital subtypes
  all bind to the one term that covers them, MONDO:0015623 cavitary myiasis,
  whose own definition enumerates exactly those sites ("aural, nasal, oral,
  urogenital myiasis ... intestinal and tracheopulmonary myiasis"). The
  anatomical distinction those five subtypes encode is therefore carried by
  `preferred_term` and `description`, not by the CURIE - per CLAUDE.md, link to
  the most specific term that exists rather than inventing one. Two caveats to
  record rather than hide: MONDO:0000301 is defined by agent ("myiasis caused by
  infection with Oestrus ovis") rather than by site, which fits the dominant but
  not the only cause of human ophthalmomyiasis; and MONDO's is_a hierarchy is not
  strictly parallel to the clinical one (creeping, furuncular, and wound myiasis
  sit under cutaneous myiasis, ophthalmomyiasis under hypodermyiasis), so the
  subtype list here is the clinical classification, not a MONDO subtree.

  Scope: this entry covers human myiasis. Veterinary myiasis and screwworm
  eradication programmes are cited only where they establish parasite biology or
  human exposure risk, and are marked MODEL_ORGANISM or OTHER accordingly.

  Named Entity Confusion preflight (CLAUDE.md 2b): `just preflight-dr` returned
  SKIP because MONDO records no causal gene (RO:0004003) for MONDO:0019147, so
  the automated gene-frequency check cannot discriminate. Manual checks were run
  instead. MONDO:0019147 is defined as "The infection of a fly larva (maggot) in
  human tissue" with `RO:0014001 NCBITaxon:7147 Diptera` and no OMIM xref, and
  the deep-research report is about human infestation by dipteran larvae
  throughout. No gene or OMIM identity anchor is applicable; the synonym list
  (infestation by fly larvae, infestation by maggots, maggot infestation) does
  not collide with another MONDO entity. The report's Oestrus ovis livestock
  prevalence material is supporting veterinary context, not a different disease
  entity, and is not used as human evidence here.

  Deep-research provenance: the falcon report's own reference validation flagged
  DOI:10.1590/S1984-29612024020 as unresolved and only 3 of 8 resolved
  references as on topic. That DOI is not cited in this entry, and every PMID
  used here was independently fetched with `just fetch-reference` and its
  snippet checked against the cached abstract.

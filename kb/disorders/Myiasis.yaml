    reference_title: 'Cutaneous myiasis with eosinophilic pleural effusion: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Telephonic follow-up 1 mo later indicated that the blood eosinophilia and pleural effusion were resolved."
    explanation: Shows that the eosinophilic response resolved once the larvae were removed, supporting larval drive.
  - reference: PMID:30647793
    reference_title: 'Otomyiasis: Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It can cause a variety of local symptoms, like erythema or pain, depending on its location, and generalized symptomatology, such as fever and malaise."

- name: Secondary bacterial superinfection
  biological_scale: TISSUE
  description: >-
    Necrotic tissue, exudate, and a breached epithelial barrier permit bacterial
    colonization and invasive soft-tissue infection. This is the principal
    mechanism by which myiasis becomes life-threatening. Most isolates are the
    ordinary wound flora - Staphylococcus aureus, Streptococcus pyogenes - but
    the larvae also carry their own: Wohlfahrtiimonas chitiniclastica is a
    chitinolytic gram-negative rod associated with the larvae themselves rather
    than with the host's skin, first isolated from Wohlfahrtia magnifica, and it
    is reported almost exclusively in myiasis. That makes it a myiasis-specific
    superinfection risk rather than generic wound contamination, and it is easily
    missed without MALDI-TOF or 16S sequencing.
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  downstream:
  - target: Systemic sepsis and progressive tissue destruction
    description: Invasive bacterial infection of the myiasis wound can progress to systemic sepsis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41970302
      reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report a case of neglected myiasis wound in a laborer from rural Nepal presenting with septic shock, who was managed with intravenous fluids, antibiotics, wound care, and delayed skin grafting, resulting in complete functional recovery."
      explanation: Documents progression from a neglected myiasis wound to septic shock.
  evidence:
  - reference: PMID:41562817
    reference_title: Unusually Extensive Furuncular Myiasis in a Returning Traveller from Rural Ethiopia Complicated by Streptococcus Pyogenes Secondary Infection Following Albendazole Therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory investigations revealed elevated inflammatory markers, and wound swabs grew scanty Streptococcus pyogenes."
    explanation: Microbiologically documents bacterial superinfection of myiasis lesions.
  - reference: PMID:41209928
    reference_title: 'The New World Screwworm in the United States: A Narrative Review Anchored to the 2025 Travel-Associated Human Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This obligate parasitism can result in severe pain, secondary bacterial infections, disfigurement, and, in the absence of timely treatment, substantial morbidity or death in both humans and animals."
    explanation: Names secondary bacterial infection among the principal complications.
  - reference: PMID:34576832
    reference_title: 'Human Infections by Wohlfahrtiimonas chitiniclastica: A Mini-Review and the First Report of a Burn Wound Infection after Accidental Myiasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wohlfahrtiimonas chitiniclastica are bacteria that cause rare infections, typically associated with the infestation of an open wound with fly larvae."
    explanation: Identifies a superinfecting organism specifically tied to larval infestation rather than to ordinary wound flora.
  - reference: PMID:34576832
    reference_title: 'Human Infections by Wohlfahrtiimonas chitiniclastica: A Mini-Review and the First Report of a Burn Wound Infection after Accidental Myiasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, 23 cases of infection with W. chitiniclastica have been reported; in 52% of these, larvae were found in the wound area."
    explanation: Quantifies how often reported human W. chitiniclastica infection is accompanied by larvae in the wound.
  - reference: PMID:25989017
    reference_title: Wohlfahrtiimonas chitiniclastica Bacteremia Associated with Myiasis, United Kingdom.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We highlight the importance of recognizing unusual bacteria that are associated with the larvae of parasitic flies as a potential causative agent of severe infection in patients with myiasis"
    explanation: Documents larval-associated bacteria as a cause of severe infection in myiasis, here as bacteraemia.
- name: Systemic sepsis and progressive tissue destruction
  biological_scale: ORGANISM
  description: >-
    Untreated or neglected infestation, particularly by obligate screwworms and
    in patients unable to seek care, progresses to extensive tissue loss,
    disfigurement, sepsis, and death.
  evidence:
  - reference: PMID:30647793
    reference_title: 'Otomyiasis: Systematic Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myiasis can generate severe complications, for instance sepsis, or directly impact vital tissues."
    explanation: Supports sepsis and destruction of vital tissue as the severe end of the disease course.
  - reference: PMID:41970302
    reference_title: 'Neglected Myiasis Wound Presenting With Septic Shock: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of neglected myiasis wound in a laborer from rural Nepal presenting with septic shock, who was managed with intravenous fluids, antibiotics, wound care, and delayed skin grafting, resulting in complete functional recovery."
    explanation: A human case reaching septic shock, with recovery after larval and wound management.
  - reference: PMID:34576832
    reference_title: 'Human Infections by Wohlfahrtiimonas chitiniclastica: A Mini-Review and the First Report of a Burn Wound Infection after Accidental Myiasis'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall fatality rate associated directly with W. chitiniclastica in these cases was 17%."
    explanation: Quantifies mortality attributable to the larval-associated superinfecting organism, the route by which myiasis kills.
- name: Larval maturation and emergence from the host
  biological_scale: ORGANISM
  description: >-
    In accidental and self-limited forms the mature larva leaves the host to
    pupate, after which the lesion heals. Because disease depends on the physical
    presence of the larva rather than on a replicating pathogen, removal or
    spontaneous departure is curative.
  evidence:
  - reference: PMID:14726861
    reference_title: 'Furuncular myiasis caused by Dermatobia hominis, the human botfly.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient applied an occlusive ointment and recovered the larva after it emerged."
    explanation: Documents larval emergence and recovery as the endpoint of a furuncular lesion.
  - reference: PMID:38297211
    reference_title: Transcriptomic profiling of different developmental stages reveals parasitic strategies of Wohlfahrtia magnifica, a myiasis-causing flesh fly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the subsequent non-parasitic post-larval stages, fully grown third-stage larvae leave the damaged tissue, fall to the ground, and burrow into the soil to pupate."
    explanation: Confirms that the parasitic phase ends when the mature larva departs the host.

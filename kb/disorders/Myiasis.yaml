name: Myiasis
creation_date: "2026-08-27T00:00:00Z"
category: Infectious Disease
description: >-
  Myiasis is the infestation of living human or vertebrate tissue by the larvae
  (maggots) of dipteran flies. Unlike most infectious diseases it is not driven
  by microbial replication or a classical immune cascade: the primary lesion is
  produced mechanically and enzymatically, as larvae penetrate and burrow into
  host tissue and secrete proteolytic excretory-secretory products that digest
  skin, connective tissue, and mucosa to create the feeding cavity. Host
  inflammation, eosinophilia, and secondary bacterial superinfection are
  consequences of that tissue destruction rather than its cause. Clinical
  presentation is determined jointly by the fly species (obligate versus
  facultative parasite) and by the anatomical site colonized, giving rise to
  furuncular, creeping (migratory), wound (traumatic), ophthalmic,
  nasopharyngeal, oral, aural, intestinal, and urogenital forms.

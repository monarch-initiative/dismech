- name: Neuroimaging at diagnosis
  description: >-
    Brain imaging is recommended at diagnosis. It is a high-yield investigation
    in this disorder: neuroimaging was available for 18 individuals in the
    founder cohort and all 18 were confirmed to have abnormalities, spanning
    hydrocephalus, ventriculomegaly, white matter abnormality, thin corpus
    callosum, hypomyelination, irregular cortical ribbon, Chiari malformation,
    absence of the septum pellucidum, hypoplastic optic nerves and septo-optic
    dysplasia. The findings are not pathognomonic, so imaging characterises the
    structural burden and directs management rather than establishing the
    diagnosis, which rests on molecular confirmation.

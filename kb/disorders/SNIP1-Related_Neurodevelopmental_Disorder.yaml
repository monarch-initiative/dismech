- name: Electroencephalography
  description: >-
    EEG is abnormal in all individuals assessed, showing diffuse background
    slowing and frequent focal or multifocal discharges with no characteristic
    pattern, so EEG supports rather than establishes the diagnosis. Its principal
    role here is early detection: guidance is that an EEG should be obtained at
    an early stage in infants with suspected apnoeic episodes, because apnoea and
    breath-holding spells can be the first seizure manifestation and subclinical
    seizures occur.

progression:
- phase: Neonatal presentation
  age_range: Birth to the first weeks of life
  notes: >-
    Presentation is with hypotonia and poor feeding rather than with a
    recognisable dysmorphic gestalt; 54% are small for gestational age. Upper
    airway malacia may cause a weak cry, stridor and apnoea from the neonatal
    period. The craniofacial features are described as evolving over time, so
    the syndrome is less recognisable at birth than later.
  evidence:
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected neonates are hypotonic and feed poorly. Dysmorphic features that evolve over time include a bulbous nose, wide mouth and tongue, broad jaw with protuberant angles, short hands, short tapered fingers, and broad thumbs"
    explanation: >-
      Establishes the neonatal presentation and the explicitly evolving nature of
      the dysmorphic gestalt.
- phase: Infancy and early childhood
  age_range: First months of life through early childhood
  notes: >-
    Seizure onset falls in this window: multifocal spike-wave discharges
    typically begin by 6 months of age, and seizures may present as apnoea or
    breath-holding spells. Irritability and sleep/wake dysregulation appear.
    This is the window the published management guidance targets, with early
    EEG, anticonvulsant optimisation, and elective gastrostomy.
  evidence:
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "temporal regions typically begin by 6 months of age and are accompanied by focal or generalized seizures that can manifest as dystonic posturing, drop attacks, myoclonic jerks, or generalized tonic-clonic events. Multiple intractable seizure types can afflict an individual patient"
    explanation: >-
      Dates seizure onset to the first six months of life and lists the seizure
      semiology seen from that point. The quotation begins mid-sentence because
      a figure caption is interleaved at that point in the extracted PDF text.
- phase: Mid-childhood motor gains
  age_range: 3 to 10 years
  notes: >-
    Most affected individuals achieve independent ambulation between 3 and 10
    years, and some communicate with signs, gestures and sounds, while remaining
    non-verbal. Motor outcome is therefore meaningfully better than the
    cognitive outcome. Individuals ascertained late in this window are often
    labelled with mixed-tone spastic quadriplegic cerebral palsy attributed to
    hypoxic injury from unrecognised seizures.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals achieved independent ambu- lation (age range 3–10 years), and some communicate with signs, gestures and sounds"
    explanation: >-
      Documents the timing and extent of motor milestone attainment.
- phase: Mortality
  age_range: 1 week to 11 years for reported deaths; survivors to 30 years
  notes: >-
    Mortality is substantial but the disorder is not uniformly lethal. Of 51
    identified individuals, 12 (24%) were deceased at the time of the 2021
    report, with age at death between one week and 11 years, while the 39
    survivors ranged up to 30 years of age. Reported causes of death were
    infection, sudden cardiopulmonary arrest, and accidental drowning. The
    drowning deaths are worth stating plainly: in a population where every
    affected individual has epilepsy and most are non-verbal, water supervision
    is a concrete family-level preventive measure, although the source does not
    frame it as a formal recommendation and none is asserted here. SUDEP is not
    invoked by the authors and is not asserted. No survival curve, life
    expectancy estimate or actuarial mortality rate has been published, and the
    24% figure is a crude cross-sectional proportion in a founder cohort, not a
    survival statistic. Adult natural history beyond 30 years is undescribed.
  evidence:
  - reference: PMID:34570759

classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A mechanism-defined multisystem Mendelian disorder of a nuclear
      phosphopeptide-binding adaptor. The dominant burden is neurodevelopmental
      (epilepsy, developmental delay, intellectual disability), but the entry
      also spans craniofacial/calvarial, cardiac, airway, gastrointestinal,
      endocrine and sensory manifestations, so the cross-organ genetics chapter
      fits better than NEUROLOGIC alone.
prevalence:
- population: Old Order Amish (Pennsylvania, Ohio, Indiana, Wisconsin settlements)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Founder-population case count, NOT a general population rate. Fifty-one Old
    Order Amish individuals across 27 sibships had been identified at the time of
    the 2021 report, of whom 35 were comprehensively clinically evaluated and 49
    were molecularly confirmed homozygous. No affected individual outside the
    Amish has been reported with biallelic SNIP1 variants, so no worldwide
    prevalence estimate exists and none is asserted. An Orphanet/ORPHA-derived
    epidemiology record could not be generated for this entry because the
    structured-source data pins are stale and un-refreshable (tracked in #7622).
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of fifty-one Old Order Amish individuals were identified with SNIP1-related disorder, among 27 sibships"
    explanation: >-
      The cumulative ascertained case count in the founder population. Because
      ascertainment was through two Plain-community clinics rather than a
      population screen, this is a case tally and not a denominator-based rate.
- population: Old Order Amish carrier screening (in-house control database, >5000 individuals)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    Carrier (heterozygote) allele frequency of the founder allele in the Amish,
    reported as a range across settlements: 0.5% in the Pennsylvania Amish and
    1.4% in the Ohio/Indiana/Wisconsin Amish. These are ALLELE frequencies in a
    founder population and must not be read as disease prevalence or as
    generalisable carrier rates. The prevalence_class band records only that the
    allele is common in this specific population. For contrast, the same allele
    has a gnomAD v3.1 frequency of 0.001% with 11 heterozygotes (10 of them
    Amish) and no homozygotes.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.(Glu366Gly) variant is present at an allele frequency of between 0.5% (Pennsylvania Amish) and 1.4% (Ohio/Indiana/Wiscon sin Amish) in this founder population, with no unaffected individuals being homozygous for this variant"
    explanation: >-
      Quantifies the founder allele frequency by settlement and confirms full
      penetrance in the sense that no unaffected homozygote was found among more
      than 5000 Amish controls.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptomatic epilepsy and skull dysplasia 3 SNIP1 c.1097A.G p.Glu366Gly 1.48% (6/406"
    explanation: >-
      The original discovery report's Table 4 row, headed "Population-specific
      Allele Frequency": 6 variant alleles among 406 Old Order Amish control
      chromosomes, i.e. an allele frequency of 1.48% corresponding to roughly a
      3% heterozygote frequency, independently corroborating that the allele is
      common in this founder population. The "A.G" rendering is a PDF extraction
      artifact for "A>G".
inheritance:
- name: Autosomal recessive biallelic SNIP1 hypomorphism
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    All reported affected individuals are homozygous for the same founder allele
    inherited from heterozygous parents; heterozygotes are unaffected. Penetrance
    is recorded as COMPLETE because segregation in 35 evaluated individuals
    showed all parents heterozygous, all unaffected siblings heterozygous or
    wild type, and no unaffected homozygote among more than 5000 Amish controls.
    Expressivity is nonetheless VARIABLE: substantial phenotypic variation was
    documented between affected individuals including within sibships, so the
    same genotype does not predict severity.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "confirmed homozygosity of the SNIP1 variant in 35 individuals, with all parents being heterozygous for the variant and all unaffected siblings being heterozygous for the variant or wild type"
    explanation: >-
      Segregation consistent with autosomal recessive inheritance across a large
      multiplex kindred.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Substantial phenotypic variation was observed between affected individ- uals, including within sibships"
    explanation: >-
      Direct statement of variable expressivity on a homogeneous genetic
      background, which is the strongest available argument that modifiers
      rather than allelic heterogeneity drive severity in this disorder.
pathophysiology:
- name: Biallelic SNIP1 p.Glu366Gly Founder Substitution
  biological_scale: MOLECULAR
  description: >-
    Homozygosity for NM_024700.4:c.1097A>G, p.(Glu366Gly) in exon 4 of SNIP1
    (1p34.3) is the single molecular lesion underlying every molecularly
    confirmed case. Glu366 lies in the conserved C-terminal 30 amino acids,
    immediately adjacent to the forkhead-associated (FHA) domain, within a
    low-complexity or intrinsically disordered region that is strongly conserved
    across species orthologues. The variant is a hypomorph rather than a null:
    Snip1 knockout mice are embryonic lethal, so a complete loss-of-function
    allele would not be compatible with the viable human phenotype.
  genes:
  - preferred_term: SNIP1
    term:
      id: hgnc:30587
      label: SNIP1
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  downstream:
  - target: Reduced SNIP1 Protein Abundance and Altered Nuclear Distribution
    description: >-
      The substituted protein is transcribed normally but is unstable and
      redistributes within the nucleus from a punctate to an aggregated pattern.
  - target: Impaired SNIP1 FHA-Domain Phosphopeptide Recognition
    description: >-
      The change sits next to the FHA domain and degrades its ability to read
      phosphorylated partner proteins.
  evidence:
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNIP1 Glu366 is highly conserved and the p.Glu366Gly mutation is in the C-terminus where SNIP1 interacts with c-Myc"
    explanation: >-
      Original identification of the causal substitution and its position in the
      C-terminal protein-interaction region.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple species alignment confirms this amino acid is highly conserved across species ortho- logs (Fig 1G) and is located close to the FHA domain at the SNIP1 C-terminus"
    explanation: >-
      Places the substitution structurally adjacent to the FHA domain and
      confirms deep evolutionary conservation of the residue.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SNIP1 null mouse models display embryonic lethality indicating that this Amish variant may be unlikely to result in complete loss of func- tion"
    explanation: >-
      The argument for hypomorphism rather than a null allele. Classified
      MODEL_ORGANISM because the underlying observation is a mouse knockout
      phenotype (sourced by the authors to the Mouse Genome Database) rather than
      a human finding.
- name: Reduced SNIP1 Protein Abundance and Altered Nuclear Distribution
  biological_scale: MOLECULAR
  description: >-
    Transcript levels of the mutant allele are comparable to wild type, so the
    lesion acts post-transcriptionally. Overexpressed mutant protein is markedly
    less abundant than wild type on Western blot and adopts an aggregated rather
    than a punctate nuclear distribution, indicating impaired protein stability
    and impaired assembly into nuclear transcriptional and splicing complexes.
    This dosage reduction is the shared upstream cause of both the splicing and
    the transcriptional arms of the disease.
  genes:
  - preferred_term: SNIP1
    term:
      id: hgnc:30587
      label: SNIP1
  cellular_components:
  - preferred_term: nuclear speck
    term:
      id: GO:0016607
      label: nuclear speck
    modifier: ABNORMAL
  downstream:
  - target: Defective RES Complex Recruitment to the Activated Spliceosome
    description: >-
      Less SNIP1 protein is available to act as the phosphorylation-dependent
      bridge that loads the RES complex onto the activating spliceosome.
  - target: Disrupted SNIP1 Co-Regulation of CBP/p300-Dependent Transcription
    description: >-
      Reduced SNIP1 abundance releases the threshold SNIP1 normally sets on
      CBP/p300-dependent transcription and removes its support for c-MYC.
  - target: Aberrant PRC2 Genomic Occupancy and H3K27me3 Turnover
    description: >-
      Less SNIP1 is available to direct Polycomb PRC2 to its target loci and to
      instruct H3K27me3 turnover there.
  evidence:
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, Snip1 p.Glu353Gly (corresponding to human p.Glu366Gly) had a more aggregated appearance (Figure 3, E) and Western blotting proved it unstable (Figure 3, F); its band density was 84.9 69.6% SD lower than wild-type (n = 4 independent transfections each"
    explanation: >-
      Direct experimental demonstration that the orthologous mouse substitution
      destabilises the protein and mislocalises it within the nucleus. The
      "84.9 69.6% SD" rendering is a PDF extraction artifact for
      "84.9 +/- 9.6% SD".
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reverse transcriptase-PCR suggests that the Snip1 c.1058A.G (corresponding to human SNIP1 c.1097A.G) transcript is expressed at levels comparable to wild-type"
    explanation: >-
      Excludes a transcript-level mechanism (no nonsense-mediated decay, no
      splicing disruption of the SNIP1 transcript itself), localising the defect
      to protein stability.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type protein localized to the nucleus with a punctate appearance, consistent with its involvement in transcrip- tional complexes"
    explanation: >-
      Establishes the wild-type nuclear pattern against which the mutant
      aggregated pattern is scored.
- name: Impaired SNIP1 FHA-Domain Phosphopeptide Recognition
  biological_scale: MOLECULAR
  description: >-
    The forkhead-associated (FHA) domain is a phosphothreonine/phosphoserine
    reader module. In the spliceosome cycle, CDK11 phosphorylates the
    threonine-proline repeats of SF3B1 during spliceosome activation, and the
    SNIP1 FHA domain recognises phosphorylated SF3B1. Disease-associated FHA
    domain mutations, explicitly including the neurodevelopmental
    disorder-associated E366G variant, impair that phosphopeptide binding. This
    is the most direct available molecular explanation of what the Amish allele
    actually breaks.
  genes:
  - preferred_term: SNIP1
    term:
      id: hgnc:30587
      label: SNIP1
  molecular_functions:
  - preferred_term: phosphoserine residue binding
    term:
      id: GO:0050815
      label: phosphoserine residue binding
    modifier: DECREASED
  downstream:
  - target: Defective RES Complex Recruitment to the Activated Spliceosome
    description: >-
      Loss of phospho-SF3B1 recognition removes the docking step that loads RES
      onto the activating spliceosome.
  evidence:
  - reference: PMID:41904131
    reference_title: "Phosphorylation of SF3B1 by CDK11 orchestrates spliceosome activation via SNIP1-dependent RES complex recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in SNIP1 FHA domain, including the neurodevelopmental disorder-associated E366G variant, impair P-SF3B1 binding, pre-mRNA splicing, and cell viability"
    explanation: >-
      Names the disease variant explicitly and demonstrates the specific
      biochemical deficit: loss of phosphorylated-SF3B1 binding, with downstream
      splicing and viability consequences.
  - reference: PMID:41904131
    reference_title: "Phosphorylation of SF3B1 by CDK11 orchestrates spliceosome activation via SNIP1-dependent RES complex recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further demonstrate that P-SF3B1 is recognized by forkhead-associated (FHA) domain of SNIP1, which promotes recruitment of retention and splicing (RES) complex during spliceosome activation"
    explanation: >-
      Establishes the normal molecular function that the E366G substitution
      degrades: FHA-mediated reading of phospho-SF3B1 to recruit RES.
- name: Defective RES Complex Recruitment to the Activated Spliceosome
  biological_scale: MOLECULAR
  description: >-
    SNIP1 is a component of the human activated (B-act) spliceosome and forms the
    retention-and-splicing (RES) complex together with BUD13 and RBMX2. RES is
    required for efficient intron definition and splicing of a defined subset of
    short, GC-rich introns. Acute SNIP1 depletion disrupts RES incorporation and
    causes widespread splicing defects, and loss of RES components in vertebrates
    produces a global intron-splicing defect with a marked neural phenotype.
  genes:
  - preferred_term: SNIP1
    term:
      id: hgnc:30587
      label: SNIP1
  protein_complexes:
  - preferred_term: RES complex
    term:
      id: GO:0070274
      label: RES complex
    modifier: DECREASED
  cellular_components:
  - preferred_term: spliceosomal complex
    term:
      id: GO:0005681
      label: spliceosomal complex
    modifier: ABNORMAL
  downstream:
  - target: Widespread Pre-mRNA Splicing Dysregulation
    description: >-
      Failure to load RES onto the activating spliceosome degrades splicing
      fidelity and efficiency transcriptome-wide.
  evidence:
  - reference: PMID:41904131
    reference_title: "Phosphorylation of SF3B1 by CDK11 orchestrates spliceosome activation via SNIP1-dependent RES complex recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Acute SNIP1 depletion disrupts RES incorporation, causes widespread splicing defects, and promotes hyperphosphorylation of SF3B1 by CDK11"
    explanation: >-
      Loss-of-SNIP1 experiment showing that RES incorporation is SNIP1-dependent
      and that its failure produces transcriptome-wide splicing defects.
  - reference: PMID:29360106
    reference_title: "Structure of the human activated spliceosome in three conformational states."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structure of the human activated spliceosome in three conformational states"
    explanation: >-
      Structural confirmation that SNIP1 is a bona fide constituent of the human
      activated spliceosome, which is the basis for treating the splicing arm as
      a physiological SNIP1 role rather than an incidental interaction. Only the
      title-level assertion is quoted because the fetched record for this
      structural paper is title/metadata level; the SNIP1-in-B-act claim is
      independently attributed in PMID:34570759.
  - reference: PMID:29969449
    reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptomic analysis of bud13, snip1 (pml1) and rbmx2 (snu17) mutants revealed a global defect in intron splicing, with strong mis-splicing of a subset of introns"
    explanation: >-
      Vertebrate loss-of-function evidence that snip1 is required for normal
      intron splicing as part of RES. Marked PARTIAL because zebrafish snip1
      mutants are functional nulls with early embryonic lethality, whereas the
      human allele is hypomorphic, so severity does not transfer.
- name: Widespread Pre-mRNA Splicing Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Reduced RES loading degrades splicing of RES-dependent introns, which are
    characteristically short, GC-rich and flanked by GC-depleted exons, i.e.
    introns that depend on intron definition rather than exon definition. The
    net effect is a transcriptome-wide shift in splicing efficiency rather than a
    single mis-spliced gene product, which is consistent with the multisystem
    phenotype.
  biological_processes:
  - preferred_term: "mRNA splicing, via spliceosome"
    term:
      id: GO:0000398
      label: "mRNA splicing, via spliceosome"
    modifier: DECREASED
  downstream:
  - target: Detained-Intron Splicing Brake Dysregulation in Neurons
    description: >-
      SNIP1 additionally sets the pause point for post-transcriptional splicing
      of detained introns, a neuron-relevant subset of the same defect.
  - target: Altered Neurodevelopmental Gene Expression Programme
    description: >-
      Degraded splicing efficiency changes the abundance of mature transcripts
      for developmentally critical genes.
  evidence:
  - reference: PMID:29969449
    reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found these RES-dependent introns were short, rich in GC and flanked by GC depleted exons, all of which are features associated with intron definition"
    explanation: >-
      Defines the sequence features of the intron subset whose splicing depends
      on RES, and therefore on SNIP1.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as part of the retention and splicing (RES) complex, which plays a crucial role in splicing and retention of pre-mRNA"
    explanation: >-
      The clinical report's own statement of the splicing arm, connecting the
      disorder to spliceosomopathy biology. The quotation starts mid-sentence to
      avoid a bracketed numeric citation marker in the extracted text; the
      preceding clause reads "SNIP1 also forms a component of the human
      activated spliceosome".
- name: Detained-Intron Splicing Brake Dysregulation in Neurons
  biological_scale: CELLULAR
  description: >-
    Beyond bulk splicing, SNIP1 together with RNPS1 forms a molecular brake that
    pauses the spliceosome at the B-act state on detained introns, holding
    intron-detaining transcripts in the nucleus as a rapidly deployable mRNA
    pool. Conditional Snip1 deletion in mouse cerebellum reduces detained-intron
    splicing efficiency and causes neurodegeneration, identifying neurons as a
    tissue in which the timing of detained-intron release is SNIP1-dependent and
    functionally critical.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: "regulation of alternative mRNA splicing, via spliceosome"
    term:
      id: GO:0000381
      label: "regulation of alternative mRNA splicing, via spliceosome"
    modifier: DYSREGULATED
  downstream:
  - target: Altered Neurodevelopmental Gene Expression Programme
    description: >-
      Mis-timed release of detained introns changes the neuronal transcript
      repertoire available at critical developmental and homeostatic windows.
  evidence:
  - reference: PMID:37027487
    reference_title: "A molecular brake that modulates spliceosome pausing at detained introns contributes to neurodegeneration."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Snip1 conditional knockout in the cerebellum decreases DI splicing efficiency and causes neurodegeneration"
    explanation: >-
      Establishes a neuron-specific, SNIP1-dependent splicing function whose loss
      is sufficient to damage the CNS. Marked PARTIAL because this is a
      conditional null in mouse cerebellum, not the human hypomorphic allele, and
      because the human disorder is a developmental encephalopathy rather than a
      documented progressive neurodegeneration.
  - reference: PMID:37027487
    reference_title: "A molecular brake that modulates spliceosome pausing at detained introns contributes to neurodegeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we suggest that post-transcriptional DI splicing is paused at the Bact state, an active spliceosome but not catalytically primed, which depends on Smad Nuclear Interacting Protein 1 (SNIP1) and RNPS1 (a serine-rich RNA binding protein) interaction"
    explanation: >-
      Defines the specific molecular role, spliceosome pausing at the B-act state
      on detained introns, that requires SNIP1.
- name: Disrupted SNIP1 Co-Regulation of CBP/p300-Dependent Transcription
  biological_scale: MOLECULAR
  description: >-
    SNIP1 sets a threshold for CBP/p300-dependent transcriptional activation. Its
    N-terminus binds both Smad4 and the coactivator CBP/p300, and SNIP1
    competitively inhibits both Smad4/p300 complex formation and NF-kappaB (RelA)
    access to the C/H1 domain of CBP/p300. Its C-terminus binds c-MYC, stabilising
    it against proteasomal degradation and bridging a c-MYC/p300 complex. Reduced
    SNIP1 abundance therefore simultaneously releases restraint on TGF-beta/Smad
    and NF-kappaB output and withdraws support from c-MYC, which is the
    transcriptional arm of this disease.
  genes:
  - preferred_term: SNIP1
    term:
      id: hgnc:30587
      label: SNIP1
  molecular_functions:
  - preferred_term: transcription coactivator activity
    term:
      id: GO:0003713
      label: transcription coactivator activity
    modifier: DYSREGULATED
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  downstream:
  - target: Derepressed TGF-beta/Smad Transcriptional Output
    description: >-
      Loss of SNIP1 restraint on Smad4/p300 complex formation raises TGF-beta
      pathway transcriptional output.
  - target: Derepressed NF-kappaB Transcriptional Output
    description: >-
      Loss of SNIP1 competition for the CBP/p300 C/H1 domain raises NF-kappaB
      dependent transcription.
  - target: Altered Neurodevelopmental Gene Expression Programme
    description: >-
      Withdrawal of SNIP1 support for c-MYC and the combined pathway shifts
      remodel the developmental gene expression programme.
  - target: Aberrant Distal Limb and Digit Development
    description: >-
      Disruption of c-MYC or CBP/p300 signalling in mouse produces abnormal
      development of the distal limbs as well as of brain and skull.
  evidence:
  - reference: PMID:10887155
    reference_title: "A novel smad nuclear interacting protein, SNIP1, suppresses p300-dependent TGF-beta signal transduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of full-length SNIP1 or its amino terminus is sufficient to inhibit multiple gene responses to TGF-beta and CBP/p300, as well as the formation of a Smad4/p300 complex"
    explanation: >-
      Original demonstration of SNIP1 as a nuclear inhibitor of CBP/p300 acting
      on TGF-beta transcriptional responses.
  - reference: PMID:10887155
    reference_title: "A novel smad nuclear interacting protein, SNIP1, suppresses p300-dependent TGF-beta signal transduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SNIP1 is a nuclear inhibitor of CBP/p300 and its level of expression in specific cell types has important physiological consequences by setting a threshold for TGF-beta-induced transcriptional activation involving CBP/p300"
    explanation: >-
      States the dosage-threshold model explicitly, which is precisely why a
      hypomorphic reduction in SNIP1 abundance is expected to be pathogenic.
  - reference: PMID:11567019
    reference_title: "SNIP1 inhibits NF-kappa B signaling by competing for its binding to the C/H1 domain of CBP/p300 transcriptional co-activators."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SNIP1 inhibits NF-kappa B signaling by competing for its binding to the C/H1 domain of CBP/p300 transcriptional co-activators"
    explanation: >-
      Establishes the competitive mechanism by which SNIP1 restrains NF-kappaB at
      the shared CBP/p300 coactivator.
  - reference: PMID:17157259
    reference_title: "SNIP1 is a candidate modifier of the transcriptional activity of c-Myc on E box-dependent target genes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SNIP1 enhances the transcriptional activity of c-Myc both by stabilizing it against proteosomal degradation and by bridging the c-Myc/p300 complex"
    explanation: >-
      Establishes the positive, C-terminus-dependent arm of SNIP1 transcriptional
      co-regulation. This is the interaction surface in which p.Glu366Gly lies.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreased abundance of SNIP1 likely results in decreased c- Myc activity and increased TGF- b and NF- kB signaling"
    explanation: >-
      The discovery paper's synthesis of the three-pathway consequence of reduced
      SNIP1 dosage, tying the in vitro co-regulation biology to this specific
      human allele.
  - reference: PMID:38304835
    reference_title: "The clinical utilization of SNIP1 and its pathophysiological mechanisms in disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the N-terminal domain of SNIP1 facilitates its interaction with Smad4, a signaling protein associated with the TGF-β family, and RelA/p65, a transcription factor connected to NF-κB. This interaction further enhances the transcriptional activation of c-Myc-dependent genes"
    explanation: >-
      Review-level synthesis of the three partner interactions that define this
      node. Cited as background molecular biology of the SNIP1 protein; the
      review concerns cancer and inflammation, not this neurodevelopmental
      disorder, hence evidence_source OTHER.
- name: Derepressed TGF-beta/Smad Transcriptional Output
  biological_scale: MOLECULAR
  description: >-
    With less SNIP1 available to restrain Smad4/p300 complex formation, TGF-beta
    pathway transcriptional output rises. Blood transcriptome analysis of six
    affected individuals found TGF-beta receptor signalling in
    epithelial-to-mesenchymal transition to be the single most overrepresented
    dysregulated Reactome pathway, and identified two downregulated TGF-beta
    pathway genes (BMPR1A and ACVR1C). Because disorders of TGF-beta/BMP
    signalling characteristically produce craniofacial, skeletal and
    cardiovascular malformation, this node is the most plausible mechanistic
    route to the non-neurological half of the syndrome.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DYSREGULATED
  downstream:
  - target: Aberrant Craniofacial and Calvarial Morphogenesis
    description: >-
      Perturbed TGF-beta/BMP output in cranial neural crest derivatives and
      calvarial osteogenic fronts disturbs facial and skull development.
  - target: Aberrant Cardiac and Outflow Tract Morphogenesis
    description: >-
      TGF-beta/BMP signalling is required for septation, valvulogenesis and
      aortic arch remodelling.
  - target: Aberrant Laryngeal and Pharyngeal Cartilage Development
    description: >-
      TGF-beta/BMP pathway disorders characteristically involve connective
      tissue and cartilage, the tissues whose failure produces airway malacia.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most overrepresented pathway was the TGF-β receptor signalling in epithelial to mesenchyme pathway with differential expression of three genes (upregulation of PARD3 and downregulation of F11R and RPS27A"
    explanation: >-
      Patient-derived transcriptomic evidence that the TGF-beta arm is the
      dominant dysregulated pathway in this disorder.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "defining two downregulated genes (BMPR1A and ACVR1C) involved in the TGF-β pathway"
    explanation: >-
      Named TGF-beta pathway genes dysregulated in patient blood. Marked PARTIAL
      because blood is not the affected tissue and the authors explicitly flag
      that limitation.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variants leading to disruption of the TGF-β/BMP molecular sig- nalling pathway have been implicated in the pathogenesis of a number of inherited disorders, in particular connective tissue disorders associated with craniofacial (e.g. cleft palate and cra- niosynostosis), cardiovascular (e.g. aortic aneurysm and syndromic aortopathies), and muscu- loskeletal (e.g. disorders of endochondral ossification, bone growth, remodelling and limb development) outcomes"
    explanation: >-
      Establishes the expected organ-system consequences of TGF-beta/BMP pathway
      disruption, which map onto the craniofacial, cardiovascular and skeletal
      features of this disorder.
- name: Derepressed NF-kappaB Transcriptional Output
  biological_scale: MOLECULAR
  description: >-
    SNIP1 normally competes with the RelA subunit of NF-kappaB for the C/H1 domain
    of CBP/p300. Reduced SNIP1 therefore raises NF-kappaB-dependent transcription.
    Two consequences are relevant here. In brain, inappropriate increases in
    NF-kappaB signalling have been shown to initiate epileptogenesis in mouse. In
    heart, SNIP1 deficiency worsens pressure-overload hypertrophy through
    NF-kappaB, and blocking NF-kappaB rescues it, which is notable because left
    ventricular non-compaction occurs in this disorder.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: INCREASED
  downstream:
  - target: Cortical Network Hyperexcitability
    description: >-
      Increased NF-kappaB and TGF-beta/Smad2 signalling in brain are each
      sufficient to initiate epileptogenesis in mouse.
  - target: Impaired Myocardial Stress Adaptation
    description: >-
      Loss of SNIP1 restraint on NF-kappaB in cardiomyocytes worsens
      hypertrophic remodelling and contractile dysfunction.
  evidence:
  - reference: PMID:11567019
    reference_title: "SNIP1 inhibits NF-kappa B signaling by competing for its binding to the C/H1 domain of CBP/p300 transcriptional co-activators."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SNIP1 inhibits NF-kappa B signaling by competing for its binding to the C/H1 domain of CBP/p300 transcriptional co-activators"
    explanation: >-
      Mechanistic basis for NF-kappaB derepression when SNIP1 is reduced.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Inappropriate increases in TGF- b/Smad2 signaling and in NF- kB signaling in the mouse brain have been shown to independently initiate epileptogenesis"
    explanation: >-
      Links the predicted signalling derangement to the cardinal phenotype.
      Marked PARTIAL because this is a mouse-derived inference cited by the
      authors, not a measurement made in SNIP1 patients.
  - reference: PMID:27912208
    reference_title: "Smad Nuclear Interacting Protein 1 Acts as a Protective Regulator of Pressure Overload-Induced Pathological Cardiac Hypertrophy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "SNIP1 deficiency significantly exacerbated aortic banding-induced cardiac hypertrophy, fibrosis, and contractile dysfunction, whereas cardiac-specific overexpression of SNIP1 markedly recovered pressure overload-induced cardiac hypertrophy and fibrosis"
    explanation: >-
      Shows a SNIP1-dose-dependent cardiac phenotype mediated by NF-kappaB.
      Marked PARTIAL because it is a pressure-overload mouse model of acquired
      hypertrophy, not a model of the germline human disorder.
- name: Aberrant PRC2 Genomic Occupancy and H3K27me3 Turnover
  biological_scale: MOLECULAR
  description: >-
    A third, epigenetic arm of SNIP1 function, established in mouse
    neural-progenitor-specific knockout. SNIP1 facilitates the genomic occupancy
    of the Polycomb repressive complex PRC2 and instructs H3K27me3 turnover at
    target genes; the SNIP1 target genes concerned are ones that promote cell
    survival and neurogenesis, and SNIP1 activity at them is itself influenced by
    TGF-beta and NF-kappaB signalling, which ties this arm back to the
    transcriptional co-regulation arm. Loss of this function mislocalises
    repressive H3K27 marks and silences a survival programme. The decisive
    evidence is a rescue: depleting PRC2 is sufficient to reduce apoptosis and
    brain dysplasia in the SNIP1-depleted brain.
  protein_complexes:
  - preferred_term: PcG protein complex
    term:
      id: GO:0031519
      label: PcG protein complex
    modifier: DYSREGULATED
  molecular_functions:
  - preferred_term: histone H3K27 trimethyltransferase activity
    term:
      id: GO:0140951
      label: histone H3K27 trimethyltransferase activity
    modifier: DYSREGULATED
  downstream:
  - target: Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
    description: >-
      Mislocalised PRC2/H3K27me3 silences the SNIP1-dependent survival and
      neurogenesis programme, triggering caspase-9-dependent apoptosis.
  - target: Altered Neurodevelopmental Gene Expression Programme
    description: >-
      Aberrant H3K27me3 deposition is a second route, alongside splicing and
      CBP/p300 co-regulation, to a distorted developmental transcriptome.
  evidence:
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further, SNIP1 facilitates the genomic occupancy of Polycomb complex PRC2 and instructs H3K27me3 turnover at target genes"
    explanation: >-
      Establishes the PRC2-directing function of SNIP1 in the developing brain.
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of PRC2 is sufficient to reduce apoptosis and brain dysplasia and to partially restore genetic programs in the SNIP1-depleted brain in vivo"
    explanation: >-
      Epistasis rescue placing PRC2 downstream of SNIP1 and causally between
      SNIP1 loss and the apoptotic brain phenotype. This is the strongest
      evidence that the PRC2 arm is mechanistically load-bearing rather than
      correlative.
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, SNIP1 regulates target genes that promote cell survival and neurogenesis, and its activities are influenced by TGFβ and NFκB signaling pathways"
    explanation: >-
      Connects this epigenetic arm to the TGF-beta and NF-kappaB arms curated
      separately, indicating the arms are coupled rather than independent.
  notes: >-
    Entirely mouse-derived and obtained in a conditional NULL background
    (Nestin-Cre Snip1 knockout), not with the human hypomorphic p.(Glu366Gly)
    allele. See the snip1_null_vs_hypomorph_model_mismatch discussion.
- name: Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
  biological_scale: CELLULAR
  description: >-
    The pivotal cellular hub of the neurological arm. SNIP1 promotes neural
    progenitor cell survival and neurogenesis, and the SNIP1-depleted brain
    exhibits dysplasia with robust induction of caspase-9-dependent apoptosis,
    i.e. death by the intrinsic mitochondrial pathway rather than by death
    receptors. The same convergence is reproduced in a second vertebrate by a
    completely different route: zebrafish RES-complex mutants, including snip1,
    show increased cell death in the brain and a decrease in differentiated
    neurons. Two independent organisms and two independent mechanistic entry
    points (PRC2 and splicing) therefore arrive at the same cellular lesion.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway
    term:
      id: GO:0097193
      label: intrinsic apoptotic signaling pathway
    modifier: INCREASED
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: DECREASED
  downstream:
  - target: Structural Brain Malformation and White Matter Abnormality
    description: >-
      Depletion of the progenitor pool and loss of newly generated neurons
      produce brain dysplasia, cortical thinning and reduced white matter.
  evidence:
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report that Smad nuclear interacting protein 1 (SNIP1) promotes neural progenitor cell survival and neurogenesis and is, therefore, integral to brain development"
    explanation: >-
      Defines the normal SNIP1 function whose loss produces this node.
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The SNIP1-depleted brain exhibits dysplasia with robust induction of caspase 9-dependent apoptosis"
    explanation: >-
      Identifies both the tissue outcome (dysplasia) and the specific apoptotic
      route (caspase-9, i.e. intrinsic/mitochondrial).
  - reference: PMID:29969449
    reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutants showed a marked neural phenotype with increased cell death in the brain and a decrease in differentiated neurons"
    explanation: >-
      Independent cross-species corroboration in zebrafish snip1/RES mutants,
      reached through the splicing arm rather than the PRC2 arm.
  notes: >-
    Both supporting models are loss-of-function nulls (mouse conditional null,
    zebrafish mutant), not the human hypomorphic allele, and neither has been
    demonstrated in human tissue. The node is nonetheless curated as central
    because two independent organisms and two independent molecular entry points
    converge on it, and because it is the point at which PRC2 depletion rescues.
- name: Altered Neurodevelopmental Gene Expression Programme
  biological_scale: MOLECULAR
  description: >-
    The convergent output of the splicing and transcriptional arms is a
    reproducible shift in the expression of genes with established
    neurodevelopmental and neuropathological roles. Whole-transcriptome
    sequencing of six affected individuals identified 75 significantly
    upregulated and 109 significantly downregulated genes. Of the most strongly
    altered transcripts with a known clinical association, 24 had a previously
    established association with neurological disease, and five of those (ROBO1,
    SOX5, CNTNAP2, PAFAH1B1 and TSNARE1) are seizure genes. ROBO1, the most
    upregulated gene, is an axon guidance receptor; PAFAH1B1 (LIS1) is a
    canonical neuronal migration gene.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  downstream:
  - target: Impaired Axon Guidance and Neuronal Migration
    description: >-
      Dysregulation of ROBO1, PAFAH1B1 and related genes perturbs axonal
      pathfinding and cortical neuronal migration.
  - target: Cortical Network Hyperexcitability
    description: >-
      Dysregulation of CNTNAP2, TSNARE1, SYT1 and other synaptic and
      neuron-glia genes lowers the threshold for seizure generation.
  - target: Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
    description: >-
      Under-expression of the SNIP1-dependent survival and neurogenesis
      programme is what makes progenitors die rather than differentiate.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differentially expressed genes with a false discovery rate (FDR) adjusted p-value of <0.05 identified a list of 75 significantly upregulated genes, and 109 significantly downregulated genes"
    explanation: >-
      Quantifies the transcriptomic perturbation measured directly in affected
      individuals.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This includes five genes (ROBO1, SOX5, CNTNAP2, PAFAH1B1 and TSNARE1) associated with seizures, the cardinal feature of SNIP1-related disorder"
    explanation: >-
      Directly connects the measured expression changes to the cardinal
      phenotype through independently established seizure genes.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our gene transcript studies in affected individuals define altered gene expression profiles of a number of molecules with well-defined neurodevelopmental and neuropathological roles, potentially explaining clinical outcomes"
    explanation: >-
      The authors' own framing of this node as the mechanistic bridge between the
      molecular lesion and the clinical outcome.
- name: Impaired Axon Guidance and Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    ROBO1, the most upregulated transcript in affected individuals, is a neural
    cell adhesion molecule family axon guidance receptor, and PAFAH1B1 is among
    the dysregulated genes associated with brain structural abnormality.
    Perturbation of axon guidance and cortical neuronal migration is the
    cell-biological step that best accounts for the observed white matter,
    corpus callosum and cortical ribbon abnormalities.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: neural progenitor cell

diagnosis:
- name: Molecular genetic testing for biallelic SNIP1 variants
  description: >-
    The diagnosis is molecular. In the Amish, targeted testing for the single
    founder allele NM_024700.4:c.1097A>G, p.(Glu366Gly) is sufficient and is how
    the original cohort was confirmed. Outside that population, the disorder
    would be reached by exome or genome sequencing, or by a
    developmental-and-epileptic-encephalopathy panel that contains SNIP1. The
    gene was originally localised by genome-wide autozygosity mapping to a
    1.65 Mb interval on chromosome 1p34.3 containing 17 genes, then resolved by
    whole exome sequencing.

    pattern. Reported findings include diffuse background slowing and frequent
    focal or multifocal discharges, and in the original probands multifocal
    spike-wave discharges from central, occipital and temporal regions typically
    beginning by six months of age. The absence of a characteristic pattern
    means EEG supports rather than establishes the diagnosis.
  phenotype_term:
    preferred_term: EEG abnormality
    term:
      id: HP:0002353
      label: EEG abnormality
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG was abnormal in all individuals assessed, with no characteristic pattern, findings included diffuse background slowing and frequent focal or multifocal discharges"
    explanation: >-
      Establishes that the electrographic abnormality is present in all assessed
      individuals and describes its non-specific character.
  notes: >-
    No frequency band is asserted. The source states the finding was present in

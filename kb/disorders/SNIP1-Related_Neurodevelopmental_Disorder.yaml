notes: >-
  GeneReviews baseline. No disease-specific GeneReviews chapter exists. PubMed
  searches for "SNIP1 GeneReviews[All Fields]" and for the disease name with
  "GeneReviews[All Fields]" both returned zero results on 2026-08-01. The
  deep-research run did surface one GeneReviews item that mentions SNIP1: the
  resources appendix "Genetic Disorders Associated with Founder Variants Common
  in the Amish Population" (NBK558237), which lists the gene and quotes a 1/34
  Old Order Amish carrier frequency. That appendix is deliberately NOT cited
  here. It is a "Resources for Genetics Professionals" appendix rather than a
  disease chapter, it carries no PMID and is not PubMed-indexed, so it cannot be
  fetched into references_cache and its figures cannot be verbatim-verified.
  Its carrier-frequency figure is therefore not asserted, though it is
  reassuringly consistent with the 1.48% allele frequency independently quoted
  from PMID:22279524 (which implies roughly a 1-in-34 heterozygote rate).

  The authoritative clinical baseline used instead is PMID:34570759 (Ammous et
  al. 2021, PLoS Genetics): a 35-individual prospectively evaluated cohort with a
  phenotype frequency table and a published management guideline table, i.e. it
  fills the role a GeneReviews chapter would. Its Table 3 management guidance is
  curated in the treatments and diagnosis sections. Neither that paper nor
  PMID:22279524 names any agent or circumstance to avoid, so no drug-safety
  warning is recorded.


  Deep research provenance. One provider was run: claude_code, via
  "just research-disorder claude_code SNIP1-Related_Neurodevelopmental_Disorder"
  (report at research/SNIP1-Related_Neurodevelopmental_Disorder-deep-research-claude_code.md;
  13 web searches, 68 turns, 24 citations, 17 minutes). Every PMID it proposed
  was independently re-fetched and every snippet re-verified against the cache
  before use. The report contributed three things this entry would otherwise
  have missed: the PRC2/neural-progenitor-survival arm (PMID:37553330), the
  null-versus-hypomorph model mismatch now recorded as a discussion, and the
  GeneReviews Amish appendix assessed above. Several of its suggestions were
  rejected on verification: HP:0002263 and HP:0004279 were not adopted because
  the corresponding cohort rows were already covered by banded umbrella
  phenotypes; its "5/203 = 2.5%" reading of the PMID:22279524 carrier data does
  not match the cached Table 4 row, which reads 1.48% (6/406) under a
  "Population-specific Allele Frequency" heading, so the cached figure was used;
  and its PRC2-inhibition therapeutic suggestion is recorded as a
  mechanistic_hypotheses entry rather than as a treatment.


  Founder-cohort caveat, stated once here and repeated on every banded
  phenotype. Every phenotype frequency band in this entry derives from Table 1
  of PMID:34570759, n = 35 clinically evaluated Old Order Amish individuals, all
  homozygous for the same p.(Glu366Gly) founder allele and drawn from 21
  interrelated families. One band uses a different denominator and says so:
  Cloverleaf Skull uses 5/35, that being the count the source actually gives for
  the severe multi-suture form. Craniosynostosis of any degree is curated
  without a band, because the only quotable count belongs to the cloverleaf
  subgroup and reusing it there would understate the true proportion. The
  mortality figure (12/51 identified individuals, 24%) is deliberately
  NOT carried as a phenotype frequency band; it sits in the progression section,
  both because its denominator differs from the Table 1 rows and because
  HP:0003819 "Death in childhood" lives under Clinical modifier rather than
  Phenotypic abnormality and so is not a valid phenotype_term in this schema.
  All of these are founder-kindred proportions and
  must NOT be presented or reused as general disease frequencies. Where Table 1
  pools several features into one row (upper airway abnormalities 75%,
  behavioural problems 75%, horizontal nystagmus and/or strabismus 45%, spinal
  abnormalities 21%, hernias 21%, short hands with tapered fingers 54%), the band
  is asserted once on the most representative phenotype and the pooled nature is
  stated in that entry's notes; the co-pooled features are curated without a
  band rather than inheriting the composite figure.


  Snippet provenance. The cached record for PMID:34570759 and PMID:22279524 is
  extracted full text from the open-access PDF, not the PubMed abstract. PDF
  extraction inserts spurious intra-word spaces ("Hyporeflexi a",
  "developmen tal", "unrecognise d") and renders some symbols oddly
  ("A.G" for "A>G", "84.9 69.6% SD" for "84.9 +/- 9.6% SD"). Snippets are quoted
  byte-exact from the cache including these artifacts, because the verbatim
  checker compares against the cache; each affected evidence item says so in its
  explanation. No snippet was retyped or normalised.


  Named-entity confusion. SNIP1 (Smad nuclear interacting protein 1, HGNC:30587,
  1p34.3) is distinct from SNAP25, SNRPN and the SNX sorting nexin family, none
  of which is implicated in this disorder. The bare token "SNIP" additionally
  collides in free-text search with the B-SNIP psychosis consortium literature,
  which has nothing to do with this gene. The overwhelming majority of PubMed
  hits for SNIP1 itself are TGF-beta/Smad signalling or cancer-biology papers
  with no bearing on the human disease; the papers cited here for background
  protein biology (PMID:10887155, PMID:11567019, PMID:17157259, PMID:27912208,
  PMID:29360106, PMID:29969449, PMID:38304835) are used only as such, are
  labelled as such in their explanations, and are marked PARTIAL where the model
  system does not transfer to the human hypomorph. Each was individually checked
  to confirm it concerns SNIP1 (Smad nuclear interacting protein 1) and not a
  homonym, and that no cancer-cohort or cell-line statistic has leaked into a
  clinical claim. The disorder must also not be conflated with the heterozygous
  1p34.3p34.2 contiguous-gene deletion syndrome, which is curated as a
  differential diagnosis with its reasoning.


  Structured-source citations omitted. No ORPHA, CGGV or CGDS structured-source
  record was generated for this entry. Producing one would require bumping a
  data MANIFEST pin; those pins are currently stale and un-refreshable, which is
  tracked in #7622 and is out of scope for a curation PR. Orphanet epidemiology
  for this entity is therefore not cited and no worldwide prevalence figure is
  asserted.


  Per-edge evidence gap, stated explicitly. The pathograph has 25 nodes and 71
  causal edges (32 mechanism-to-mechanism, 39 mechanism-to-phenotype), and
  none of the edges carries its own evidence item; the supporting citations sit
  on the nodes at each end instead. This is the single largest compliance gap in
  the entry and it is deliberate rather than overlooked. Populating 71 edge-level
  evidence items would mean re-quoting node-level snippets under a claim they do
  not individually address: for the mechanism-to-phenotype edges in particular
  the available sources document co-occurrence of the mechanism and the
  phenotype, not the edge. Rather than manufacture 71 duplicate citations, the
  edges carry prose descriptions and the reader is pointed at the node evidence.
  Note the perverse incentive this creates in the compliance score: wiring 38 of
  the 53 phenotypes into the graph (72% causal in-link coverage, against 0% and
  22% in the two most recent comparable entries) lowers the headline compliance
  number precisely because it adds edges. The graph is better for it.


  Unwired phenotypes, stated explicitly. Fifteen phenotypes carry no causal
  in-link: ADHD, autism, conductive hearing impairment, gastroesophageal reflux,
  horizontal nystagmus, hypoglycaemia, hypothyroidism, intestinal malrotation,
  pectus excavatum, scoliosis, sleep disturbance, small for gestational age,
  strabismus, tethered cord and umbilical hernia. For each of these the cited
  sources record the association with the disorder but publish no mechanism
  linking it to any node in this pathograph, and inventing an edge to raise
  in-link coverage would assert causation the literature does not support. Small
  for gestational age is in this list by correction rather than by omission: it
  was previously wired downstream of neonatal feeding failure, an edge that ran
  backwards in time and has been removed.


  Deliberate omissions. (1) No treatment is curated for the congenital heart
  defects beyond screening echocardiography, because the source recommends
  screening but names no cardiac intervention. (2) Craniosynostosis surgery is
  not curated as a treatment: the source documents cloverleaf skull in five
  individuals but does not state that surgical release was performed or
  recommended. (3) No prevalence figure outside the Amish is asserted. (4) No
  animal_models section is curated: the mouse and zebrafish work cited is
  loss-of-function/null, not a knock-in of the human hypomorphic allele, and no
  p.(Glu366Gly) knock-in model has been published. (5) Genetic counselling
  (NCIT:C15240) is not curated as a treatment despite being clinically salient
  here, since autosomal recessive inheritance in an endogamous community with a
  1.48% founder allele frequency implies a 25% sibling recurrence risk. The
  reason is evidentiary, and was checked rather than assumed: all thirteen
  cached references for this entry were grepped case-insensitively for
  "counsel", and none of them contains the string, so there is no quotable
  snippet for the recommendation from any source this entry cites. Neither
  Table 3 of PMID:34570759 nor PMID:22279524 raises counselling, carrier
  testing or recurrence risk. Rather than assert an unsourced treatment, the
  gap is recorded here.


  Placement note on surveillance. Annual Ophthalmology and Audiology
  Surveillance, and Endocrine Monitoring for Hypothyroidism and Hypoglycaemia,
  are curated under treatments: with therapeutic_modality OTHER rather than
  under diagnosis:. They are screening activities in form, but in the source
  they are longitudinal management recommendations for an already-diagnosed
  individual, not investigations that contribute to reaching the diagnosis,
  which is the distinction diagnosis: is used for throughout this entry. The
  at-diagnosis investigations (molecular testing, EEG, neuroimaging,
  echocardiography) sit in diagnosis:.

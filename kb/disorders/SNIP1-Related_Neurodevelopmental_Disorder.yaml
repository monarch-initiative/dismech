treatments:
- name: Anticonvulsant Therapy
  description: >-
    Antiseizure medication is the mainstay of neurological management, but the
    published experience is explicit that no antiepileptic medication was
    identified that consistently provides effective seizure control, and several
    individuals have multiple drug resistant epilepsy. The published advice is
    therefore about the goals of therapy rather than a specific agent: children
    should be under specialist neurology care for careful optimisation of
    anticonvulsant medication, to treat apnoea in infancy, maintain seizure
    control, and prevent status epilepticus and consequent developmental
    regression. No specific drug, drug class or drug to avoid is named in the
    source, and none is asserted here.

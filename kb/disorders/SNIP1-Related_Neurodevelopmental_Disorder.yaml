name: SNIP1-Related Neurodevelopmental Disorder
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
synonyms:
- psychomotor retardation, epilepsy, and craniofacial dysmorphism
- PMRED
- neurodevelopmental disorder with hypotonia, craniofacial abnormalities, and seizures
- symptomatic epilepsy and skull dysplasia
- SNIP1-related disorder
description: >
  SNIP1-related neurodevelopmental disorder is a severe autosomal recessive
  multisystem condition caused by biallelic variants in SNIP1 (Smad nuclear
  interacting protein 1, 1p34.3). It was first delineated in the Old Order Amish,
  where a single founder missense substitution,
  NM_024700.4:c.1097A>G p.(Glu366Gly), accounts for every molecularly confirmed
  case reported to date. The cardinal features are neonatal hypotonia with
  hypo/areflexia, severe global developmental delay and intellectual disability,
  universal infantile-onset drug-resistant epilepsy, and a recognisable
  craniofacial and calvarial gestalt that includes an irregular "lumpy" skull
  surface, midface hypoplasia, a wide mouth with a thin cupid's bow upper lip,
  high arched palate, and microretrognathia with or without Pierre Robin
  sequence. Congenital heart disease, upper airway malacia, feeding failure
  requiring gastrostomy, and endocrine and sensory involvement complete a
  multisystem picture with substantial early mortality.

  SNIP1 is a nuclear protein with an N-terminal nuclear localisation signal and a
  C-terminal forkhead-associated (FHA) domain. It has three mechanistically
  distinct jobs that all plausibly contribute to disease: it is a
  phosphopeptide-reading adaptor that recruits the retention-and-splicing (RES)
  complex to the activated spliceosome; it is a nuclear co-regulator that sets
  thresholds for CBP/p300-dependent transcription downstream of TGF-beta/Smad,
  NF-kappaB and c-MYC; and it directs Polycomb PRC2 genomic occupancy and
  H3K27me3 turnover to keep neural progenitors alive. The p.(Glu366Gly)
  substitution sits in the conserved C-terminal region adjacent to the FHA
  domain; it destabilises the protein and impairs FHA-domain recognition of
  phosphorylated SF3B1, so SNIP1 function is degraded rather than abolished.
  Complete loss of SNIP1 is embryonic lethal in mouse, which is why the viable
  human disorder is attributed to a hypomorphic rather than a null allele.

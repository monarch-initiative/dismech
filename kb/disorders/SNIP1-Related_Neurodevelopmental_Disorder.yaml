differential_diagnoses:
- name: Heterozygous 1p34.3p34.2 contiguous gene deletion including SNIP1
  description: >-
    A de novo 2.3 Mb interstitial deletion at 1p34.3p34.2 encompassing 43 genes,
    including SNIP1, was reported in a 17-year-old female with global
    developmental delay, mild intellectual disability and multiple congenital
    anomalies. The authors concluded that SNIP1 haploinsufficiency was the most
    likely cause. This is the single most important named-entity distinction for
    this entry, because a naive search for "SNIP1 neurodevelopmental disorder"
    returns it alongside the recessive disorder.
  distinguishing_features:
  - Dosage - heterozygous whole-gene deletion versus biallelic missense hypomorphism. These are different genetic mechanisms and should not be pooled.
  - Severity - the deletion case had mild intellectual disability and no epilepsy reported, whereas the biallelic disorder has severe non-verbal developmental delay and universal intractable epilepsy.
  - Attribution - the deletion removes 43 genes and the authors could neither confirm SNIP1 as the driver nor exclude contributions from the other genes, so it does not establish a heterozygous SNIP1 phenotype.
  - Inheritance and counselling - de novo heterozygous CNV versus autosomal recessive with 25% sibling recurrence risk. Amish parents of an affected child are obligate heterozygotes and are unaffected, which is itself evidence against a clinically significant heterozygous phenotype in this population.
  evidence:
  - reference: PMID:29726122
    reference_title: "Interstitial microdeletion of the 1p34.3p34.2 region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of the 1p34.3p34.2 region, including the SNIP1 gene and excluding the five genes listed above, is responsible for the neurocognitive delays and other symptoms as identified in our patient"
    explanation: >-
      The deletion report's own conclusion, which is an attribution to a region
      rather than to SNIP1 alone.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The authors concluded that haploinsufficienc y of SNIP1 was the most likely cause of the female’s neurodevelopmental phenotype, although they were not able to confirm this nor rule out contributions of the other genes involved"
    explanation: >-
      Independent assessment that the deletion case does not establish a
      SNIP1-specific heterozygous phenotype. The
      "haploinsufficienc y" spelling is a PDF extraction artifact.
  notes: >-
    Not curated as a subtype of this entry. MONDO:0013787 is anchored to the
    autosomal recessive OMIM entity 614501; the heterozygous CNV is a separate
    contiguous-gene deletion syndrome. disease_term is also left unbound: MONDO
    has no term for a 1p34.3p34.2 contiguous deletion, and the nearest concepts
    are generic chromosomal-deletion groupings carrying no locus, which would
    assert less than this prose already does.
- name: Craniofacial spliceosomopathies
  notes: >-
    disease_term left unbound deliberately: this is a mechanism-defined CATEGORY
    (SF3B4/Nager, EFTUD2/mandibulofacial dysostosis-microcephaly, TXNL4A/Burn-McKeown
    and others), not a single entity. MONDO has no spliceosomopathy grouping term -
    a search for "spliceosomopathy" returns nothing - and binding one member such as
    MONDO:0007943 Nager acrofacial dysostosis would narrow the differential to one
    gene and misstate it.
  description: >-
    Disruption of spliceosome components causes several neurodevelopmental
    disorders with craniofacial defects, specifically Guion-Almeida type
    mandibulofacial dysostosis (EFTUD2), Nager syndrome (SF3B4) and
    cerebrocostomandibular syndrome (SNRPB). These overlap with SNIP1-related
    disorder in midface hypoplasia, cleft palate, developmental delay,
    intellectual disability, congenital cardiac defects and scoliosis, and the
    overlap is mechanistically real rather than coincidental given SNIP1's
    spliceosomal role.
  distinguishing_features:
  - Causal gene differs (EFTUD2, SF3B4, SNRPB versus SNIP1); the diagnosis is molecular.
  - Inheritance - the classical craniofacial spliceosomopathies listed are dominant, usually de novo, whereas SNIP1-related disorder is autosomal recessive.
  - Epilepsy burden - universal intractable epilepsy from infancy is characteristic of the SNIP1 disorder and is not a defining feature of the mandibulofacial dysostoses.
  - Calvarial phenotype - the irregular "lumpy" skull surface with variable calvarial thickness and a cortical ribbon that follows the skull contour is distinctive to the SNIP1 disorder.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disrup- tion of spliceosome components have been associated with several neurodevelopmental disor- ders involving craniofacial defects, for example Guion-Almeida type mandibulofacial dysostosis, Nager syndrome, and cerebrocostomandibular syndrome, which also display sev- eral overlapping features with SNIP1-related disorder including midface hypoplasia, cleft pal- ate, developmental delay, intellectual disability, congenital cardiac defects and scoliosis"
    explanation: >-
      The clinical report's own placement of this disorder within the
      craniofacial spliceosomopathy differential.
- name: TGF-beta pathway connective tissue and aortopathy syndromes
  notes: >-
    disease_term left unbound deliberately: a pathway-defined CATEGORY spanning
    Marfan, the Loeys-Dietz series and vascular Ehlers-Danlos. It exists in this
    entry to warn that most SNIP1 literature is TGF-beta/Smad signalling with no
    bearing on the neurodevelopmental disorder, so the differential is about a
    literature hazard rather than one confusable disease. Binding any single
    member, e.g. MONDO:0012212 Loeys-Dietz syndrome 1, would misrepresent that.
  description: >-
    Loeys-Dietz syndrome and related TGF-beta pathway disorders share congenital
    cardiac defects including bicuspid aortic valve, septal defects, patent
    ductus arteriosus, mitral regurgitation and aortic root dilatation, together
    with craniosynostosis, cleft palate, hypertelorism, micrognathia, talipes and
    scoliosis. The overlap with SNIP1-related disorder is substantial and is
    predicted by SNIP1's role as a TGF-beta/Smad co-regulator.
  distinguishing_features:
  - Causal gene differs (TGFBR1, TGFBR2, SMAD3, TGFB2, TGFB3 versus SNIP1).
  - Cognition - Loeys-Dietz syndrome does not feature severe global developmental delay, intellectual disability or intractable epilepsy, which dominate the SNIP1 phenotype.
  - Aortic risk - progressive aortic aneurysm and dissection drive management in Loeys-Dietz syndrome; aortic root dilatation is reported in the SNIP1 disorder but no aneurysm or dissection risk has been established, and none is asserted here.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This includes systemic aortopathies, including for example Loeys-Dietz syndrome"
    explanation: >-
      Names Loeys-Dietz syndrome as the TGF-beta pathway disorder with which this
      condition shares cardiovascular and craniofacial features.
- name: CNTNAP2-related Pitt-Hopkins-like syndrome
  disease_term:
    preferred_term: CNTNAP2-related cortical dysplasia-focal epilepsy syndrome
    term:
      id: MONDO:0012400
      label: cortical dysplasia-focal epilepsy syndrome
  description: >-
    CNTNAP2 was among the most upregulated transcripts in affected individuals,
    and biallelic CNTNAP2 disruption causes an autosomal recessive
    Pitt-Hopkins-like syndrome (cortical dysplasia focal epilepsy syndrome)
    characterised by neurodevelopmental delay, hypotonia, hyporeflexia, seizures
    of multiple types, neuronal migration abnormality, autistic features and
    attention deficits. That is close to a phenocopy of the neurological arm of
    SNIP1-related disorder, which is presumably why CNTNAP2 dysregulation is a
    candidate mediator rather than a coincidence.
  distinguishing_features:
  - Causal gene differs (CNTNAP2 versus SNIP1).
  - CNTNAP2 disease lacks the characteristic calvarial dysplasia, craniofacial gestalt and 60% congenital heart disease burden of the SNIP1 disorder.
  - In the SNIP1 disorder CNTNAP2 is dysregulated downstream, not mutated; this is a mechanistic relationship, not an alternative diagnosis in a molecularly confirmed case.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disruption of CNTNAP2 is associated with autosomal recessive Pitt-Hopkins-like syndrome (also known as cortical dysplasia focal epilepsy syndrome; MIM 610042) characterized by neurodevelopmental delay, hypotonia, hyporeflexia, seizures of multiple types, neuronal migration abnormalities, autistic features, and attention deficits"
    explanation: >-
      Documents the phenotypic near-identity of the neurological arm and
      identifies CNTNAP2 as a downstream dysregulated gene in the SNIP1
      disorder.
mechanistic_hypotheses:
- hypothesis_group_id: snip1_prc2_rescue
  hypothesis_label: PRC2 hyperactivity as a druggable node downstream of SNIP1 loss
  status: EMERGING
  description: >-
    In the mouse neural-progenitor-specific Snip1 knockout, depleting PRC2 is
    sufficient to reduce apoptosis and brain dysplasia and to partially restore
    the transcriptional programme. If the same epistasis holds for a hypomorphic
    allele, PRC2/EZH2 inhibition would be a mechanistically motivated
    intervention point. The hypothesis is recorded because the rescue experiment
    is unusually clean epistasis, not because it is close to clinical use.
  evidence:
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of PRC2 is sufficient to reduce apoptosis and brain dysplasia and to partially restore genetic programs in the SNIP1-depleted brain in vivo"
    explanation: >-
      The rescue result the hypothesis rests on. Marked PARTIAL because it is a
      genetic depletion in a mouse conditional null during embryogenesis, not a
      pharmacological intervention in the human hypomorphic disorder.
  notes: >-
    Deliberately NOT curated as a treatment. Three gaps stand between this
    result and a therapy: the background is a null rather than the human
    hypomorph, the rescue window is embryonic and therefore not clinically
    reachable, and PRC2 depletion was genetic rather than pharmacological. No
    human, patient-derived, or translational evidence exists.
discussions:
- discussion_id: snip1_null_vs_hypomorph_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do conclusions drawn from Snip1-null mouse and zebrafish models transfer to
    a human hypomorphic allele that is compatible with survival to adulthood?
  attaches_to:
  - pathophysiology#Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
  - pathophysiology#Aberrant PRC2 Genomic Occupancy and H3K27me3 Turnover
  - pathophysiology#Biallelic SNIP1 p.Glu366Gly Founder Substitution
  rationale: >-
    Every in vivo model of SNIP1 loss published to date is a null or conditional
    null. Snip1 null mice are embryonic lethal; zebrafish RES-component mutants
    including snip1 fail in early embryogenesis. Humans homozygous for
    p.(Glu366Gly) survive, in the reported cohort to at least 30 years. That
    contrast is exactly the reason the human allele is inferred to be
    hypomorphic, but it also means the models are directionally informative and
    quantitatively wrong: the cellular lesion they demonstrate (neural progenitor
    apoptosis, reduced neurogenesis) is almost certainly the right lesion, while
    its magnitude, timing and tissue distribution in a patient are not
    established by them. Three further limits: the Nestin-Cre deletion is
    neural-restricted and therefore cannot model the craniofacial, calvarial,
    cardiac, airway or endocrine components that make this a recognisable
    multisystem syndrome; embryonic lethality precludes modelling epilepsy, the
    single most disabling human feature; and the PRC2-depletion rescue was
    performed in a null background during embryogenesis. Resolving the mismatch
    needs a p.(Glu366Gly) knock-in animal, or patient-derived iPSC cortical
    organoids, neither of which has been published.
  proposed_experiments:
  - experiment_id: exp_snip1_e366g_knockin_mouse
    name: Snip1 p.Glu366Gly knock-in mouse with multisystem phenotyping
    description: >-
      Generate a constitutive Snip1 p.Glu366Gly knock-in mouse on a defined
      background and phenotype it for the features that null models cannot
      reach: postnatal survival, video-EEG for spontaneous seizures, craniofacial
      and calvarial micro-CT for suture patency and calvarial surface
      irregularity, echocardiography for septal and outflow lesions, and
      developmental milestone testing. Compare homozygotes, heterozygotes and
      wild-type littermates.
    decision_criterion: >-
      Whether homozygous knock-in animals survive to weaning and reproduce any of
      the epilepsy, calvarial or cardiac features of the human disorder.
    supporting_outcome:
    - >-
      Survival with seizures and craniofacial or cardiac malformation would
      confirm p.(Glu366Gly) as a hypomorph sufficient to cause the multisystem
      syndrome, and would give the field its first tractable disease model.
    refuting_outcome:
    - >-
      Embryonic or perinatal lethality indistinguishable from the null, or a
      completely normal homozygote, would both indicate that mouse Snip1 dosage
      biology does not map onto the human allele.
  - experiment_id: exp_snip1_patient_ipsc_cortical_organoid
    name: Patient iPSC-derived cortical organoids with isogenic correction
    description: >-
      Derive iPSCs from individuals homozygous for p.(Glu366Gly), correct the
      variant to create isogenic controls, and differentiate both to forebrain
      cortical organoids. Assay progenitor pool size, cleaved caspase-9 and
      caspase-3, neuronal output, genome-wide H3K27me3 distribution, and
      detained-intron splicing efficiency by RNA-seq.
    decision_criterion: >-
      Whether the human hypomorphic allele reproduces, in human neural tissue,
      the progenitor apoptosis and splicing defects so far shown only in
      null-background mouse and zebrafish.
    supporting_outcome:
    - >-
      Increased progenitor apoptosis with caspase-9 activation and measurable
      detained-intron retention in patient organoids would establish that the
      mouse and zebrafish mechanisms operate in human cells at the disease
      allele dosage.
    refuting_outcome:
    - >-
      Normal progenitor survival and normal splicing in patient organoids would
      indicate that the null-model mechanism is not the operative one at
      hypomorphic dosage, and would redirect attention to the transcriptional
      co-regulation arm or to non-neural tissues.
  - experiment_id: exp_snip1_ezh2_inhibition_hypomorph
    name: Pharmacological EZH2 inhibition in a hypomorphic SNIP1 background
    description: >-
      Test whether small-molecule EZH2 inhibition, rather than genetic PRC2
      depletion, rescues progenitor apoptosis in a p.(Glu366Gly) hypomorphic
      background (knock-in mouse neural progenitors or patient organoids), with
      a dose-response and a defined treatment window.
    decision_criterion: >-
      Whether the PRC2-depletion rescue reported in the null background survives
      the three translations it currently has not made: genetic to
      pharmacological, null to hypomorph, and embryonic to postnatal.
    supporting_outcome:
    - >-
      Dose-dependent reduction of apoptosis with preserved neurogenesis would
      convert the PRC2 finding from a mechanistic observation into a genuine
      therapeutic lead worth curating as a treatment.
    refuting_outcome:
    - >-
      No rescue, or rescue only at doses that impair normal neurogenesis, would
      confirm that the PRC2 result should remain a mechanistic hypothesis and
      not be presented as a therapeutic direction.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SNIP1 null mouse models display embryonic lethality indicating that this Amish variant may be unlikely to result in complete loss of func- tion"
    explanation: >-
      States the mismatch directly: the null model is lethal, so it cannot be
      the right dosage model for a viable human allele.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventy-six per- cent (n = 39) are currently living (age range 6 months to 30 years), while 24% (n = 12) are deceased (age of death between 1 week and 11 years"
    explanation: >-
      Quantifies the human side of the mismatch: survival to 30 years, against
      embryonic lethality in the null models the mechanism rests on.
  - reference: PMID:37553330
    reference_title: "SNIP1 and PRC2 coordinate cell fates of neural progenitors during brain development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The SNIP1-depleted brain exhibits dysplasia with robust induction of caspase 9-dependent apoptosis"
    explanation: >-
      The mechanism whose transferability is in question. Marked PARTIAL because
      it is obtained by depletion, not by the human hypomorphic allele.
- discussion_id: snip1_founder_generalisability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do the phenotype frequencies curated here generalise beyond the Old Order
    Amish founder kindred, and does biallelic SNIP1 disease exist outside it?
  attaches_to:
  - pathophysiology#Biallelic SNIP1 p.Glu366Gly Founder Substitution
  - phenotypes#Seizure
  rationale: >-
    Every frequency band in this entry derives from a single published cohort of
    35 clinically evaluated Old Order Amish individuals, all homozygous for one
    founder allele, drawn from 21 interrelated families and linkable into a
    single pedigree. Three consequences follow and are flagged on each banded
    phenotype's notes field. First, these are genotype-specific frequencies for
    p.(Glu366Gly) homozygosity, not disease-level frequencies: a different
    biallelic SNIP1 genotype could present differently, and the source itself
    records substantial phenotypic variation between individuals including within
    sibships. Second, the shared genetic and environmental background of a
    founder community means unmeasured modifiers are shared, which can both
    inflate apparent consistency and mask features that a heterogeneous cohort
    would reveal. Third, ascertainment was clinic-based within two Plain-community
    practices, so mildly affected individuals may be systematically absent. No
    non-Amish case with biallelic SNIP1 variants has been published, so whether
    the entity looks the same elsewhere is simply unknown. Resolving this
    requires GeneMatcher-style ascertainment of biallelic SNIP1 cases outside the
    founder population.
  proposed_experiments:
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While no other biallelic variants in SNIP1 have conclusively been associated with genetic disease to date"
    explanation: >-
      States the absence of any non-founder biallelic SNIP1 disease allele, which
      is the fact that makes generalisability unknowable from current data.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Substantial phenotypic variation was observed between affected individ- uals, including within sibships"
    explanation: >-
      Variability on an essentially uniform genetic and community background is
      the second reason the cohort proportions should not be read as fixed
      disease frequencies.
- discussion_id: snip1_which_arm_drives_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the human phenotype driven predominantly by the spliceosomal (RES
    recruitment) arm of SNIP1 function or by the transcriptional co-regulation
    (CBP/p300, TGF-beta, NF-kappaB, c-MYC) arm?
  attaches_to:
  - pathophysiology#Impaired SNIP1 FHA-Domain Phosphopeptide Recognition
  - pathophysiology#Disrupted SNIP1 Co-Regulation of CBP/p300-Dependent Transcription
  rationale: >-
    The entry deliberately curates both arms as parallel branches from the same
    upstream dosage lesion because the evidence does not yet adjudicate between
    them. The splicing arm now has the more direct evidence: the E366G variant is
    shown by name to impair FHA-domain binding to phosphorylated SF3B1 and thereby
    RES recruitment (PMID:41904131), which is the only published experiment on
    the actual disease allele in its actual molecular context. The transcriptional
    arm has stronger patient-derived correlative support: TGF-beta receptor
    signalling in epithelial-to-mesenchymal transition was the most
    overrepresented dysregulated Reactome pathway in patient blood
    (PMID:34570759). But the patient transcriptome study is limited by a sample
    size of six, by blood as a surrogate for brain, and by an FDR at the pathway
    level of 0.43, and the authors state the tissue limitation explicitly.
    Critically, the two arms are not independent: reduced SNIP1 protein abundance
    (PMID:22279524) degrades both simultaneously, so a clean dissociation would
    require a separation-of-function allele that has not been reported.
  proposed_experiments:
  evidence:
  - reference: PMID:41904131
    reference_title: "Phosphorylation of SF3B1 by CDK11 orchestrates spliceosome activation via SNIP1-dependent RES complex recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in SNIP1 FHA domain, including the neurodevelopmental disorder-associated E366G variant, impair P-SF3B1 binding, pre-mRNA splicing, and cell viability"
    explanation: >-
      The splicing arm's claim on primacy: the only published experiment
      performed on the actual disease allele.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These studies were inherently limited due to the modest number of samples available for study and through the obvious limitations of comparing gene transcriptions profiles in blood, with tis- sues in which clinical outcomes are primarily manifested (brain"
    explanation: >-
      The transcriptional arm's counterweight is patient-derived but the authors
      state its two limitations themselves, which is precisely why the question
      remains open. Marked PARTIAL because it qualifies rather than supports.
- discussion_id: snip1_neurodegeneration_question
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does SNIP1-related disorder include a genuine progressive neurodegenerative
    component, or is all apparent progression seizure-related secondary injury?
  attaches_to:
  - pathophysiology#Detained-Intron Splicing Brake Dysregulation in Neurons
  - pathophysiology#Status Epilepticus
  - pathophysiology#Hypoxic-Ischaemic Secondary Brain Injury
  rationale: >-
    Conditional Snip1 deletion in mouse cerebellum decreases detained-intron
    splicing efficiency and causes frank neurodegeneration (PMID:37027487),
    raising the possibility that the human hypomorph also drives slow neuronal
    loss. Against that, the human clinical description attributes regression and
    the late spastic quadriplegic picture to hypoxic injury from long-term
    untreated or unrecognised seizures rather than to intrinsic degeneration, and
    survivors reach 30 years of age. No longitudinal imaging or neuropathology in
    genotyped individuals has been published, so the two explanations are not yet
    separable. This distinction is not academic: it determines whether aggressive
    early seizure control should be expected to preserve trajectory (secondary
    injury model) or merely to slow it (degenerative model).
  proposed_experiments:
  evidence:
  - reference: PMID:37027487
    reference_title: "A molecular brake that modulates spliceosome pausing at detained introns contributes to neurodegeneration."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Snip1 conditional knockout in the cerebellum decreases DI splicing efficiency and causes neurodegeneration"
    explanation: >-
      The case for a degenerative component. Marked PARTIAL because it is a
      conditional null in mouse cerebellum and has no demonstrated human
      correlate.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals identified in late childhood/adolescence are often diagnosed with a mixed tone spastic quadriplegic cerebral palsy, likely reflecting hypoxic injury after long-term untreated/unrecognise d seizures"
    explanation: >-
      The competing explanation: the clinical authors attribute apparent
      progression to acquired seizure-related hypoxic injury rather than to
      intrinsic degeneration. Marked PARTIAL because it is the authors'
      attribution rather than a measurement distinguishing the two models.

    snippet: "Subsequent targeted genetic investigation of additional affected individuals that were identified, confirmed homozygosity of the SNIP1 variant in 35 individuals"
    explanation: >-
      Targeted founder-allele testing as the confirmatory assay in this
      population.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inspection of resultant genotypes identified a single region of homozy- gosity greater than 1Mb common to all four affected individuals, a small (1.65Mb) genomic region on chromosome 1p34.3"
    explanation: >-
      Documents the autozygosity-mapping route that first localised the gene, the
      standard approach in founder populations.
  markers: Homozygous SNIP1 NM_024700.4:c.1097A>G, p.(Glu366Gly)
  notes: >-

    modifier: DYSREGULATED
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DYSREGULATED
  downstream:
  - target: Structural Brain Malformation and White Matter Abnormality
    description: >-
      Failed pathfinding and migration produce the hypomyelination, thin corpus
      callosum, ventriculomegaly and irregular cortical ribbon seen on MRI.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these ROBO1 (roundabout guidance receptor 1), the gene identi- fied to be most upregulated in affected individuals with SNIP1-related disorder, is a member of the neural cell adhesion molecule (NCAM) family involved in axonal migration"
    explanation: >-
      Identifies the specific axon guidance receptor most strongly dysregulated
      in patients.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "includes two other genes (PAFAH1B1 and TOR1AIP1) associated with brain structural abnor- malities"
    explanation: >-
      PAFAH1B1 is the classical lissencephaly neuronal migration gene; its
      dysregulation supports a migration component. Marked PARTIAL because
      expression change in blood is an indirect proxy for a brain developmental
      process.
- name: Structural Brain Malformation and White Matter Abnormality
  biological_scale: TISSUE
  description: >-
    Neuroimaging is abnormal in essentially all individuals assessed. The
    reported spectrum comprises hydrocephalus, ventriculomegaly, white matter
    abnormalities, thin corpus callosum, hypomyelination, an irregular cortical
    ribbon that follows the undulating inner skull contour, Chiari malformation,
    absence of the septum pellucidum, hypoplastic optic nerves and septo-optic
    dysplasia. The cortical ribbon finding is mechanistically interesting because
    it couples the brain and calvarial phenotypes.
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  downstream:
  - target: Severe Global Developmental Impairment
    description: >-
      Structural maldevelopment of cortex and white matter is the anatomical
      substrate of the profound psychomotor delay.
  - target: Ventriculomegaly
    description: >-
      Enlarged ventricles, with or without frank hydrocephalus, on MRI.
  - target: Abnormal Cerebral White Matter Morphology
    description: >-
      White matter abnormality and hypomyelination on MRI.
  - target: Hypoplasia of the Corpus Callosum
    description: >-
      A thin corpus callosum, reported in both published series.
  - target: Septo-Optic Dysplasia
    description: >-
      Midline forebrain malformation at the severe end of the imaging spectrum.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuro- imaging was available for 18 individuals, all confirmed to have abnormalities, including hydrocephalus, ventriculomegaly, white matter abnormalities, thin corpus callosum, hypo- myelination, irregular cortical ribbon, Chiari malformation, absence of the septum pelluci- dum, hypoplastic optic nerves and septo-optic dysplasia"
    explanation: >-
      Full imaging spectrum with an explicit denominator: 18 of 18 imaged
      individuals had abnormalities.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging reveals ventriculomegaly, thin corpus callosum, white matter abnormalities, and an undulating or ‘‘lumpy’’ skull surface (Figure 3, E). The cortical ribbon follows the irregular skull contour"
    explanation: >-
      Independent description of the imaging phenotype in the original three
      probands, including the coupling of cortical ribbon shape to the abnormal
      calvarium.
- name: Cortical Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    The combination of derepressed NF-kappaB and TGF-beta/Smad2 signalling in
    brain, dysregulated synaptic and neuron-glia genes (CNTNAP2, TSNARE1, SYT1),
    and structural cortical maldevelopment produces a diffusely hyperexcitable
    cortical network. EEG is abnormal in all individuals assessed, with diffuse
    background slowing and frequent focal or multifocal discharges and no single
    characteristic pattern.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: modulation of chemical synaptic transmission
    term:
      id: GO:0050804
      label: modulation of chemical synaptic transmission
    modifier: DYSREGULATED
  downstream:
  - target: Infantile-Onset Drug-Resistant Epilepsy
    description: >-
      A hyperexcitable cortical network generates the multifocal, multi-type,
      treatment-refractory seizures that define the disorder.
  - target: EEG Abnormality
    description: >-
      The electrographic readout of the hyperexcitable network: diffuse
      background slowing with frequent focal or multifocal discharges, abnormal
      in every individual assessed and with no characteristic pattern. Wired
      from this node rather than from the seizure node because the abnormality
      is a property of the network itself and is present interictally.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG was abnormal in all individuals assessed, with no characteristic pattern, findings included diffuse background slowing and frequent focal or multifocal discharges"
    explanation: >-
      Electrophysiological confirmation of diffuse, non-localising cortical
      dysfunction rather than a single epileptogenic focus.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "temporal regions typically begin by 6 months of age and are accompanied by focal or generalized seizures that can manifest as dystonic posturing, drop attacks, myoclonic jerks, or generalized tonic-clonic events. Multiple intractable seizure types can afflict an individual patient"
    explanation: >-
      Dates the onset of electrographic hyperexcitability to the first six months
      of life and documents the multiple concurrent seizure types a single
      hyperexcitable network generates. The quotation begins mid-sentence
      because a figure caption is interleaved at that point in the extracted
      PDF text; the preceding clause reads "Multifocal spike-wave discharges
      from central, occipital, and".
- name: Infantile-Onset Drug-Resistant Epilepsy
  biological_scale: ORGANISM
  description: >-
    Every affected individual develops epilepsy. Seizure types include focal and
    generalised intractable seizures (myoclonic, absence, tonic-clonic) of
    infantile or childhood onset, and multiple intractable seizure types can
    afflict a single patient. Seizures may present initially as apnoea or
    breath-holding spells, and subclinical seizures occur. Febrile illness, sleep
    deprivation and hypoglycaemic episodes are recognised triggers. No
    antiepileptic medication has been identified that consistently provides
    effective seizure control.
  downstream:
  - target: Status Epilepticus
    description: >-
      Refractory seizures progress to status epilepticus with consequent
      developmental regression and, in some, permanent motor deficit.
  - target: Seizure
    description: >-
      The clinical seizure phenotype itself, universal in this disorder.
  - target: Drug-Resistant Epilepsy
    description: >-
      No anticonvulsant provides consistent control, and several individuals
      have multiple drug resistant epilepsy.
  - target: Apnea
    description: >-
      In some infants the first seizure manifestation is apnoea or
      breath-holding, a seizure-driven route to apnoea distinct from the
      airway-malacia route.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures are a cardinal feature of the disorder with all affected individuals developing epilepsy. Seizure types include focal and generalised intractable seizures (myoclonic, absence, tonic-clonic) of infantile or childhood onset"
    explanation: >-
      Universality, seizure semiology and age at onset in the 35-individual
      cohort.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no antiepileptic medications identified that consistently provide effective seizure control (defined as manageable frequency of sei- zures) and several individuals display multiple drug resistant epilepsy"
    explanation: >-
      Establishes drug resistance as a defining property rather than an
      occasional complication, which is the basis for the treatment section's
      caution about disease-specific anticonvulsant recommendations.
- name: Status Epilepticus
  biological_scale: ORGANISM
  description: >-
    Refractory epilepsy in this disorder is not merely a comorbidity; it is an
    active driver of further neurological loss, and status epilepticus is the
    acute event through which that loss is delivered. Some individuals suffered
    severe developmental regression following status epilepticus, two with
    subsequent permanent hemiparesis. Preventing status epilepticus is named by
    the cohort authors as an explicit goal of anticonvulsant optimisation, which
    makes this the acquired and potentially preventable entry point to the
    acquired component of the phenotype.
  downstream:
  - target: Hypoxic-Ischaemic Secondary Brain Injury
    description: >-
      Prolonged seizure activity is the proximate cause of the secondary
      hypoxic-ischaemic insult the authors invoke to explain the acquired motor
      and developmental deficit.
  - target: Developmental Regression
    description: >-
      Loss of previously acquired skills following status epilepticus. Wired
      from this node rather than from the downstream injury node because the
      source attributes the regression directly to the status epilepticus event
      without asserting an intervening hypoxic mechanism.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some individuals suf- fered severe developmental regression following status epilepticus, with two reported to have subsequent permanent hemiparesis"
    explanation: >-
      Documents seizure-driven regression and fixed motor deficit as acquired
      events on top of the congenital lesion. The "suf- fered" spelling is a PDF
      extraction artifact.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "maintain seizure control, and prevent status epilepticus and consequent"
    explanation: >-
      The authors name prevention of status epilepticus, and of the
      developmental regression that follows it, as an explicit management
      target, which is why this event is modelled as its own node.
- name: Hypoxic-Ischaemic Secondary Brain Injury
  biological_scale: TISSUE
  description: >-
    The tissue-level consequence of prolonged and inadequately controlled
    seizure activity. Individuals identified in late childhood or adolescence
    are often diagnosed with mixed-tone spastic quadriplegic cerebral palsy that
    the cohort authors attribute to hypoxic injury after long-term untreated or
    unrecognised seizures rather than to a primary pyramidal lesion. This is the
    acquired, and therefore potentially preventable, component of the phenotype.
  downstream:
  - target: Spastic Tetraplegia
    description: >-
      The mixed-tone spastic quadriplegic picture in late-ascertained
      individuals, attributed by the authors to hypoxic injury rather than to a
      primary pyramidal lesion.
  - target: Severe Global Developmental Impairment
    description: >-
      Seizure-related hypoxic injury compounds the developmental deficit already
      set by the structural brain malformation.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals identified in late childhood/adolescence are often diagnosed with a mixed tone spastic quadriplegic cerebral palsy, likely reflecting hypoxic injury after long-term untreated/unrecognise d seizures"
    explanation: >-
      Explains why late-ascertained individuals carry a cerebral palsy label and
      frames early seizure control as neuroprotective. The
      "unrecognise d" spelling is a PDF extraction artifact.
  notes: >-
    Split out of a former combined "Status Epilepticus and Hypoxic-Ischaemic
    Secondary Injury" node, which bundled a two-step chain. The hypoxic injury
    is an authors' attribution, not a measured finding: no imaging or
    neuropathological confirmation of hypoxic-ischaemic injury in genotyped
    individuals has been published, and the competing degenerative explanation
    is carried as an open question in discussions.
- name: Severe Global Developmental Impairment
  biological_scale: ORGANISM
  description: >-
    The convergent clinical endpoint of the neurological arm. Global
    developmental delay and hypotonia with hyporeflexia are present in all
    affected individuals, and developmental delay is characterised as severe and
    non-verbal. Most affected individuals nonetheless achieve independent
    ambulation between 3 and 10 years, and some communicate with signs, gestures
    and sounds, so the disorder is severe but not uniformly without motor
    progress.
  downstream:
  - target: Global Developmental Delay
    description: >-
      The clinical manifestation of the impaired neurodevelopmental endpoint.
  - target: Intellectual Disability
    description: >-
      The cognitive manifestation, universally severe and non-verbal.
  - target: Hypotonia
    description: >-
      Central hypotonia is present from the neonatal period in all affected
      individuals.
  - target: Hyporeflexia
    description: >-
      Weak or absent tendon reflexes accompany the hypotonia in all affected
      individuals.
  - target: Neonatal Feeding Failure and Aspiration Risk
    description: >-
      Poor feeding from birth is universal and is the entry point to the
      nutritional and pulmonary morbidity of the disorder.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Global developmen tal delay (severe, non-verbal) 100"
    explanation: >-
      Table 1 row giving the frequency and qualitative severity of the
      developmental phenotype in 35 evaluated individuals. Word-internal spacing
      is a PDF extraction artifact.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals achieved independent ambu- lation (age range 3–10 years), and some communicate with signs, gestures and sounds"
    explanation: >-
      Qualifies the severity: motor milestones are delayed but usually attained,
      which matters for prognostic counselling.
- name: Aberrant Craniofacial and Calvarial Morphogenesis
  biological_scale: TISSUE
  description: >-
    Cranial neural crest derived facial skeleton and the membranous calvarium are
    both affected. Skull morphology ranges from normocephaly to severe
    multi-suture craniosynostosis with a cloverleaf skull, and characteristically
    includes an irregular skull surface with variable calvarial thickness and
    bony dysplasia. Facial features comprise midface hypoplasia, a wide mouth
    with downturned corners and thin cupid's bow upper lip, large tongue, high
    arched palate, microretrognathia with or without Pierre Robin sequence and
    cleft palate, malocclusion, small upturned bulbous nose, long palpebral
    fissures, and proptosis where craniosynostosis is present.
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Abnormal Skull Morphology
    description: >-
      The calvarial arm: irregular skull surface, variable calvarial thickness
      and bony dysplasia in every affected individual.
  - target: Craniosynostosis
    description: >-
      Premature suture fusion at the severe end of the calvarial spectrum.
  - target: Cloverleaf Skull
    description: >-
      The most extreme calvarial outcome: multi-suture fusion producing a
      trilobar skull.
  - target: Proptosis
    description: >-
      A consequence of the reduced orbital volume produced by craniosynostosis,
      and reported only in individuals who have it.
  - target: Midface Retrusion
    description: >-
      Hypoplasia of the cranial-neural-crest-derived midfacial skeleton.
  - target: High Palate
    description: >-
      Palatal shelf morphology abnormality, present in every affected
      individual.
  - target: Wide Mouth
    description: >-
      Wide mouth with downturned corners and a thin cupid's bow upper lip.
  - target: Macroglossia
    description: >-
      Large tongue, part of the oral component of the gestalt.
  - target: Micrognathia
    description: >-
      Microretrognathia from mandibular hypoplasia.
  - target: Pierre-Robin Sequence
    description: >-
      Mandibular hypoplasia severe enough to displace the tongue and obstruct
      palatal closure, the classical sequence.
  - target: Cleft Palate
    description: >-
      Failure of palatal shelf fusion, reported within the Pierre Robin
      sequence subset.
  - target: Bulbous Nose
    description: >-
      Small upturned bulbous nose, a consistent element of the facial gestalt.
  - target: Long Palpebral Fissure
    description: >-
      Periorbital component of the craniofacial gestalt.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skull morphological abnormalities were observed and ranged from normocephaly to severe multi-suture craniosynostosis with Cloverleaf appearance of the skull in five individ- uals, and included an irregular skull surface with variable calvarium thickness and bony dys- plasia"
    explanation: >-
      Defines the calvarial spectrum, including the specific count of five
      individuals with cloverleaf skull.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Craniofacial features (Fig 1A–1D) include midface hypoplasia, a wide mouth with downturned corners and thin cupids bow upper lip, large tongue, high arched palate, microre- trognathia (Pierre Robin sequence with or without cleft palate in three patients), malocclusion, small upturned bulbous nose, long palpebral fissures and proptosis (in individuals with cranio- synostosis"
    explanation: >-
      The complete craniofacial gestalt as described in the 35-individual
      cohort.
- name: Aberrant Cardiac and Outflow Tract Morphogenesis
  biological_scale: TISSUE
  description: >-
    Congenital cardiac malformation affects a majority of individuals and spans
    the septation, valvular and aortic arch compartments: hypoplastic left heart
    syndrome, aortic stenosis and bicuspid aortic valve, aortic coarctation,
    aortic root dilatation, atrial and ventricular septal defects, patent ductus
    arteriosus, pulmonary artery stenosis and mitral regurgitation. This
    distribution is characteristic of perturbed TGF-beta/BMP signalling in
    cardiac neural crest and second heart field derivatives.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: heart morphogenesis
    term:
      id: GO:0003007
      label: heart morphogenesis
    modifier: ABNORMAL
  downstream:
  - target: Abnormal Heart Morphology
    description: >-
      The full congenital cardiac lesion spectrum, spanning septation, valvular
      and aortic arch compartments.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a variable spectrum of congenital cardiac defects (60% of individuals), including hypoplastic left heart syndrome, aortic stenosis and bicuspid aortic valve, aortic coarctation, aortic root dilatation, atrial septal defect (ASD), ventricular septal defect (VSD), patent ductus arteriosus (PDA), pulmonary artery stenosis and mitral valve regurgitation"
    explanation: >-
      Frequency and full lesion spectrum of congenital heart disease in the
      cohort.
- name: Impaired Myocardial Stress Adaptation
  biological_scale: TISSUE
  description: >-
    Distinct from the structural congenital lesions, a minority of individuals
    develop cardiomyopathy, specifically left ventricular non-compaction. Mouse
    work showing that SNIP1 deficiency exacerbates and SNIP1 overexpression
    rescues pressure-overload hypertrophy through NF-kappaB provides a candidate
    mechanism for a myocardial rather than a morphogenetic contribution, though
    this link has not been demonstrated in patients.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Left Ventricular Noncompaction Cardiomyopathy
    description: >-
      The myocardial phenotype seen in a minority, distinct from the structural
      congenital lesions.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "12% of affected individuals developed cardiomyopathy (left ventricular non- compaction"
    explanation: >-
      Documents the cardiomyopathy subtype and its frequency in the cohort.
  - reference: PMID:27912208
    reference_title: "Smad Nuclear Interacting Protein 1 Acts as a Protective Regulator of Pressure Overload-Induced Pathological Cardiac Hypertrophy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "our findings demonstrated that SNIP1 had protective effects in pressure overload-induced pathological cardiac hypertrophy via inhibition of nuclear factor-κB signaling"
    explanation: >-
      Candidate NF-kappaB-dependent myocardial mechanism. Marked PARTIAL because
      it is an acquired-hypertrophy model in mouse and no myocardial mechanism
      has been shown in individuals with the SNIP1 founder variant.
- name: Aberrant Laryngeal and Pharyngeal Cartilage Development
  biological_scale: TISSUE
  description: >-
    Three quarters of individuals have upper airway abnormalities:
    laryngomalacia, pharyngomalacia and subglottic stenosis of variable
    severity, producing a weak cry, stridor and apnoea and occasionally
    requiring tracheostomy and home oxygen. The common feature of malacia and
    subglottic narrowing is inadequate laryngeal and pharyngeal cartilage
    support, and TGF-beta/BMP pathway disruption characteristically affects
    connective tissue and cartilage, which is why this node is placed downstream
    of the TGF-beta arm. The mechanism has not been demonstrated directly in
    this disorder and the placement is an inference, flagged as such below.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Laryngomalacia
    description: >-
      Inadequate supraglottic cartilage support collapses the airway on
      inspiration.
  - target: Subglottic Stenosis
    description: >-
      Cricoid-level narrowing, the fixed rather than dynamic form of the airway
      lesion.
  - target: Apnea
    description: >-
      Airway obstruction is the second, non-seizure route to apnoea in this
      disorder.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals commonly displayed upper airway respiratory difficulties in the neonatal period, including laryngomalacia, pharyngomalacia and subglottic stenosis of var- iable severity, causing a weak cry, stridor and apnea, occasionally requiring tracheostomy and supplementary home oxygen"
    explanation: >-
      Documents the airway phenotype, its neonatal onset and its severity range.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variants leading to disruption of the TGF-β/BMP molecular sig- nalling pathway have been implicated in the pathogenesis of a number of inherited disorders, in particular connective tissue disorders associated with craniofacial (e.g. cleft palate and cra- niosynostosis), cardiovascular (e.g. aortic aneurysm and syndromic aortopathies), and muscu- loskeletal (e.g. disorders of endochondral ossification, bone growth, remodelling and limb development) outcomes"
    explanation: >-
      The basis for placing the airway phenotype downstream of the TGF-beta arm.
      Marked PARTIAL because the quotation establishes that TGF-beta/BMP
      disruption causes connective tissue disease in general, not that it causes
      the airway malacia in this specific disorder.
  notes: >-
    The causal placement of this node is inferred from the general connective
    tissue and cartilage consequences of TGF-beta/BMP pathway disruption, not
    demonstrated in SNIP1 patients or models. It is curated because the airway
    phenotype is frequent (75%) and clinically dominant in the neonatal period,
    and leaving it mechanistically unexplained would be a larger omission than
    an explicitly flagged inference.
- name: Aberrant Distal Limb and Digit Development
  biological_scale: TISSUE
  description: >-
    Distal limb findings comprise short hands with tapered fingers in just over
    half of individuals, plus brachydactyly, broad thumbs, single palmar crease,
    congenital talipes equinovarus, pes planus and toenail hypoplasia. The
    discovery paper's mechanistic rationale is that disruption of c-MYC or
    CBP/p300 signalling in mice produces abnormal development of brain, skull,
    craniofacial bones and distal limbs, which is precisely the combination seen
    here; the brachydactyly syndromes are separately TGF-beta pathway disorders.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Tapered Finger
    description: >-
      Short hands with tapered fingers, the commonest distal limb finding.
  - target: Brachydactyly
    description: >-
      Shortened digits, the phenotype shared with the TGF-beta pathway
      brachydactyly syndromes.
  - target: Broad Thumb
    description: >-
      Broad thumbs, reported in both published series.
  - target: Talipes Equinovarus
    description: >-
      Congenital clubfoot, the distal lower-limb component.
  - target: Hypoplastic Toenails
    description: >-
      Nail hypoplasia, a distal appendage patterning defect.
  evidence:
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Disruption of c-Myc or CBP/p300 signaling in mice can result in abnormal development of the brain, skull, craniofacial bones, and distal limbs"
    explanation: >-
      The discovery paper's own mechanistic rationale linking the SNIP1
      transcriptional co-regulation arm to the observed distal limb findings.
      Marked PARTIAL because it is a mouse-derived inference cited by the
      authors, not a measurement in SNIP1 patients.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other dysmorphic features include brachydactyly, broad thumbs, single palmar crease, congenital talipes equinovarus, pes planus, toenail hypoplasia and pectus excavatum"
    explanation: >-
      Enumerates the distal limb and appendage findings this node accounts for.
- name: Neonatal Feeding Failure and Aspiration Risk
  biological_scale: ORGANISM
  description: >-
    Poor feeding in the neonatal period is universal, and pulmonary aspiration
    with or without a gastrostomy tube affects 46%. This is the single most
    actionable node in the entry: elective gastrostomy is one of two
    interventions the cohort authors single out as able to reduce
    hospitalisations, alleviate suffering and prolong life. The proximate
    mechanism is not established, and more than one contributor is plausible
    (central hypotonia with poor suck and swallow coordination, upper airway
    malacia, and gastroesophageal reflux are all documented in the same
    individuals), so no single mechanism is asserted.
  downstream:
  - target: Feeding Difficulties
    description: >-
      Universal poor feeding from the neonatal period.
  - target: Aspiration
    description: >-
      Pulmonary aspiration, the principal driver of respiratory morbidity and
      hospitalisation.
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor feeding in the neonatal period is universal and many require a gastrostomy tube to both aid nutrition and reduce risk of aspiration pneumonia"
    explanation: >-
      Establishes universality and the direct link from feeding failure to
      aspiration pneumonia risk.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrauterine growth retardation (IUGR) and failure to thrive was also common"
    explanation: >-
      Places the postnatal nutritional failure in the context of prenatal growth
      restriction.
  notes: >-
    The proximate mechanism of feeding failure is deliberately left unasserted.
    Neither published source attributes it to a specific cause, and hypotonia,
    airway malacia and reflux are each independently documented in the cohort.
    An earlier revision wired this node to Small for Gestational Age; that edge
    was removed because small-for-gestational-age status is determined at birth
    and cannot be caused by a postnatal event. The retained IUGR snippet
    documents co-occurrence of prenatal growth restriction with postnatal
    failure to thrive, not causation in either direction, so Small for
    Gestational Age is now left unwired.
phenotypes:
- name: Global Developmental Delay
  category: Nervous System
  description: >-
    Present in all 35 comprehensively evaluated individuals and characterised as
    severe and non-verbal. In the original three probands, affected children had
    severe psychomotor delay and did not learn to walk or speak, though the later
    larger cohort found that most eventually achieve independent ambulation.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  frequency: OBLIGATE
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Global developmen tal delay (severe, non-verbal) 100"
    explanation: >-
      Table 1, n = 35 evaluated individuals, 100% affected. Word-internal spacing
      is a PDF extraction artifact.
  notes: >-
    Frequency band OBLIGATE derives from 35/35 in the founder cohort
    (PMID:34570759 Table 1). This is a single extended Amish kindred homozygous
    for one allele, so the band describes that genotype in that population and is
    not a general disease frequency.
- name: Intellectual Disability
  category: Nervous System
  description: >-
    Intellectual disability is one of the cardinal features of the condition.
    Affected individuals are non-verbal; some show behavioural responses to
    language but do not socially engage or follow verbal commands, while some
    communicate with signs, gestures and sounds.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cardinal clinical features of the condition include hypotonia, global developmental delay, intellectual disability, seizures, and a characteristic craniofacial appearance"
    explanation: >-
      Names intellectual disability among the cardinal features of the disorder.
  - reference: PMID:22279524
    reference_title: "Genetic mapping and exome sequencing identify variants associated with five novel diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some children show behavioral responses to language, but they do not socially engage or follow verbal commands"
    explanation: >-
      Qualitative characterisation of the cognitive and communicative level in
      the original probands.
  notes: >-
    No band assigned. Intellectual disability is named as cardinal but is not a
    separate row in the Table 1 frequency tabulation, which reports "global
    developmental delay (severe, non-verbal)" instead. Rather than reuse the
    developmental delay denominator for a different construct, the band is
    omitted.
- name: Seizure
  category: Nervous System
  description: >-
    Universal infantile- or childhood-onset epilepsy. Seizure types include focal
    and generalised intractable seizures - myoclonic, absence and tonic-clonic -
    and multiple intractable seizure types can afflict one individual. In some
    infants seizures presented initially as apnoea or breath-holding spells, and
    subclinical seizures were detected in six individuals. Febrile illness, sleep
    deprivation and hypoglycaemic episodes can trigger or exacerbate seizures.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: OBLIGATE
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures are a cardinal feature of the disorder with all affected individuals developing epilepsy"
    explanation: >-
      Explicit statement of 100% penetrance of epilepsy in the evaluated cohort,
      corroborating the Table 1 figure of 100%.
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures can be triggered or exacerbated by febrile illness, sleep deprivation and hypoglycemic episodes"
    explanation: >-
      Documents the modifiable seizure triggers, which is directly actionable in
      management.
  notes: >-
    Frequency band OBLIGATE derives from 35/35 in the founder cohort
    (PMID:34570759 Table 1, "Seizures 100%"), supported by the prose statement
    that all affected individuals develop epilepsy. Founder-cohort derived.
- name: Drug-Resistant Epilepsy
  category: Nervous System
  description: >-
    No antiepileptic medication has been identified that consistently provides
    effective seizure control, and several individuals display multiple drug
    resistant epilepsy. This is the single most consequential management problem
    in the disorder.
  phenotype_term:
    preferred_term: Refractory drug response
    term:
      id: HP:0020174
      label: Refractory drug response
  evidence:
  - reference: PMID:34570759
    reference_title: "A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no antiepileptic medications identified that consistently provide effective seizure control (defined as manageable frequency of sei- zures) and several individuals display multiple drug resistant epilepsy"
    explanation: >-
      Direct statement of pharmacoresistance in the cohort. The "sei- zures"
      spelling is a PDF extraction artifact.
  notes: >-
    No frequency band. Pharmacoresistance is described qualitatively ("several
    individuals") without a denominator, so per curation policy the band is
    omitted rather than guessed. HPO has no "drug-resistant epilepsy" class, so

    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Twenty-four percentage of patients ( n = 4/17) had a short and thin CC and 12% ( n = 2/17) had CC hypoplasia.
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.
- name: Seizure
  category: Neurologic
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  description: Epilepsy occurred in 11/32 assessed Vibert patients, with onset from two months to nine years. Okur reported any seizure in 27/49, including febrile events, which is a different outcome and cannot be equated with epilepsy penetrance.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf

name: 8p Inverted Duplication Deletion Syndrome
category: Chromosomal
creation_date: '2026-09-03T19:00:00Z'
synonyms:
- invdupdel(8p)
- inv dup del(8p)
- inverted 8p duplication/deletion syndrome
- inverted duplication deletion 8p
disease_term:
  preferred_term: 8p inverted duplication/deletion syndrome
  term:
    id: MONDO:0019876
    label: 8p inverted duplication/deletion syndrome
parents:
- Chromosomal Disorder
description: 8p inverted duplication/deletion syndrome combines a terminal loss of 8p with an inverted duplication of a more proximal segment on the same chromosome. Many recurrent rearrangements retain a copy-neutral spacer, whereas some nonrecurrent forms lack it or acquire additional chromosomal material during stabilization. The phenotype includes developmental and speech delay, intellectual disability, hypotonia, callosal anomalies, seizures and variable congenital malformations. Gene content and clinical severity vary. Common spacer-containing rearrangements preserve GATA4 and SOX7; their deletion is relevant only to particular larger deletions. Most studied cases are sporadic, but transmission of the unbalanced rearrangement across generations has been documented.
inheritance:
- name: Usually sporadic structural rearrangement
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: The common inversion-associated pathway was characterized in sporadic cases with maternal origin. Alternative architectures and familial unbalanced transmission prevent a universal de novo or exclusively maternal rule.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: all ﬁve mothers were heterozygous inv(8)(p23) carriers (inversion heterozygotes)
    explanation: Observed in five selected Japanese families. This does not establish that all affected individuals require a maternal inversion.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: all deletions in the ﬁve patients had arisen in the maternally derived chromosomes 8
    explanation: STRP analysis establishes parent of origin independently of the maternal inversion FISH result. The observation is confined to the five studied families.
- name: Familial transmission of the unbalanced chromosome
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Autosomal transmission was documented in a two-generation family with variable intellectual disability. Reproductive counseling depends on the actual rearrangement and parental studies; the small family cannot establish a numerical recurrence risk.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients 16, 17, 18, 19, and 20 were from the same family and included two sibs and their children (Figure 1). All five individuals pres- ented with mild to moderate ID without any major associated malforma- tion.
    explanation: Five affected relatives in two generations carried the rearrangement; all had mild to moderate intellectual disability. This is direct transmission of the unbalanced chromosome, not just inheritance of a benign inversion.
has_subtypes:
- name: Spacer-containing invdupdel(8p)
  description: Terminal deletion and inverted duplication are separated by a copy-neutral interval. Inversion-associated recombination is a proposed formation pathway.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: deﬁned the regions for deletion, intact segment, and for duplication in the ﬁve patients with inv dup del(8p)
    explanation: The five mapped cases exemplify this architecture; the statement is not universal across the syndrome.
- name: Invdupdel(8p) without an intervening spacer
  description: Some mapped rearrangements have adjacent deletion and duplication without a copy-neutral spacer, supporting an alternative U-type exchange model.
  evidence:
  - reference: PMID:35327368
    reference_title: Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of "8p Inverted Duplication/Deletion Syndrome".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: 'Dicentric chromosome 8 formation can occur by two different mechanisms: U-type exchange and non-allelic homologous recombination mediated by parental paracentric inversion inv(8)(p23.1)'
    explanation: The authors use endpoint copy-number architecture to distinguish proposed formation routes.
- name: Complex invdupdel(8p) with captured additional chromosomal material
  description: A rearranged 8p end may contain material from another chromosome arm. Buysse characterized an additional 8q gain; that extra imbalance can modify the phenotype and should not be pooled with uncomplicated invdupdel cohorts.
  evidence:
  - reference: url:https://ricerca.uniba.it/retrieve/dd9e0c64-b05b-1e9c-e053-3a05fe0a45ef/6_sdarticle.pdf
    reference_title: https://ricerca.uniba.it/retrieve/dd9e0c64-b05b-1e9c-e053-3a05fe0a45ef/6_sdarticle.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: By high resolution oligo array CGH, we detected the smallest inverted duplication of 8p reported thus far, with additional duplication of 8q24.13/qter on the short arm of the abnormal chromosome 8 (Figs. 1 and 2 A and B).
    explanation: The measured complex chromosome contains an additional terminal 8q duplication on 8p. This is evidence for captured material, not direct observation of the proposed replication process.

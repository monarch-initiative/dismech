- name: Recurrent Respiratory Infections
  category: Immunological
  description: >-
    An immune component reported once and worth curating because it has a candidate mechanism
    on the deletion side. A one-month-old with invdupdel(8p) and severe respiratory syncytial
    virus bronchiolitis had reduced natural killer cell activity and reduced alpha-defensin
    against healthy controls; the defensin gene cluster sits at 8p23.1 and is inside the
    deleted segment.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:35768224
    reference_title: "A Case Report of Respiratory Syncytial Virus-Infected 8p Inverted Duplication Deletion Syndrome with Low Natural Killer Cell Activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient showed lower NK cell activity and alpha-defensin level compared with healthy controls."
    explanation: >-
      The measured immune deficit in an invdupdel(8p) patient. One patient, hence OCCASIONAL,
      and the authors note cellular immune function had never previously been reported in this
      syndrome.
  - reference: PMID:35768224
    reference_title: "A Case Report of Respiratory Syncytial Virus-Infected 8p Inverted Duplication Deletion Syndrome with Low Natural Killer Cell Activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, cellular immune function in inv dup del(8p) syndrome has never been reported."
    explanation: >-
      Establishes that this is a first observation rather than a frequency estimate, which is
      why no cohort figure is given for it.

    explanation: Qualitative rarity only; no numerical population rate is inferred.
pathophysiology:
- name: Predisposing 8p23 Repeat and Inversion Architecture
  biological_scale: MOLECULAR
  description: Low-copy repeats at 8p23 and a common inversion polymorphism provide a substrate for a recurrent rearrangement pathway. The inversion alone is not the syndrome. Maternal inversion was measured in five families; other pathways do not require this parental finding.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf

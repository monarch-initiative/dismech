  category: Neurologic
  phenotype_term:
    preferred_term: Agenesis of Corpus Callosum
    term:
      id: HP:0001274
      label: Agenesis of corpus callosum
  description: 'Callosal abnormalities occurred in 17/27 patients assessed by MRI or fetal neuropathology: six complete and five partial agenesis cases. These are not denominators for all affected people.'
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Sixty-three percent of patients presented AnCC ( n = 17/27). ACC was complete in 35% ( n = 6/17) of cases and partial in 29% (n = 5/17).
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.
- name: Hypoplasia of Corpus Callosum
  category: Neurologic
  phenotype_term:
    preferred_term: Hypoplasia of Corpus Callosum
    term:
      id: HP:0002079
      label: Hypoplasia of the corpus callosum
  description: The same series distinguished four short/thin callosa from two called hypoplastic; callosal agenesis is recorded separately.
  evidence:

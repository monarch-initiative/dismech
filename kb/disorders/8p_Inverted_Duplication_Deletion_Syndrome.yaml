progression:
- phase: Infancy and early childhood
  notes: Congenital abnormalities and neonatal hypotonia or feeding difficulties may precede developmental and speech delay. Seizure onset is variable, and selected cohorts cannot provide an individual prognosis.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Neonatal hypotonia was described in 12/28 patients (data not avail- able for five patients; Table 1). Then, 97% of patients ( n = 32/33) developed global development delay including motor delay in 93% (27/29) of patients.
    explanation: Describes the temporal clinical pattern in the cohort.
- phase: Later childhood and adulthood
  notes: Some patients acquire independent walking while speech and adaptive support needs persist. Hypertonia and orthopedic complications can emerge later. Familial adult cases show that survival to reproductive age and transmission are possible; rare severe congenital presentations should not define the whole syndrome.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients 16, 17, 18, 19, and 20 were from the same family and included two sibs and their children (Figure 1). All five individuals pres- ented with mild to moderate ID without any major associated malforma- tion.
    explanation: Five affected relatives in two generations carried the rearrangement; all had mild to moderate intellectual disability. This is direct transmission of the unbalanced chromosome, not just inheritance of a benign inversion.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Hypotonia was accompanied by hypertonia, prominently in the lower extremities, later in life.
    explanation: Later lower-limb hypertonia can coexist with earlier hypotonia.
discussions:
- discussion_id: invdupdel8p_mechanism_and_scope
  prompt: Which formation steps and gene-dosage mechanisms remain unresolved?
  rationale: Constitutional FISH, marker and microarray studies establish rearrangement endpoints, while inversion-loop crossover, dicentric breakage and rescue are mechanistic models. GATA4/SOX7 deletion is not a universal explanation for cardiac disease. The 5.1 Mb callosal candidate interval from Vibert combines selected cases, including pure duplications; it does not identify a proven causal gene. Published duplication-size associations are not validated individual prediction rules. Isolated 8p23 deletion network analyses and single-gene animal models cannot be treated as experimental models of the complete invdupdel chromosome. A single severe RSV case proposed defensin deficiency and impaired NK function, but lacked direct DEF copy-number measurement, acute-infection immune assays or rescue; that hypothesis does not justify a universal immunodeficiency pathway.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: From these ﬁndings, we propose here a model to explain how inv dup del(8p) is formed.
    explanation: The crossover and rescue sequence is an interpretation of FISH and STR findings, not directly observed meiotic intermediates.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: we prioritized the candidate genes DLGAP2 and CSMD1 for del(8p) distal and the deleted segment of invdupdel(8p), GATA4 and XKR6 for del(8p)_proximal and dup(8p)_proximal, and RHOBTB2 and CHRNA2 for the duplicated segment of invdupdel(8p) (Supplemental Data).
    explanation: Candidate prioritization uses interval content and prior biological knowledge. It does not demonstrate that any one gene accounts for the whole rearrangement phenotype.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Both GATA4 and SOX7 were copy-number neutral in all individuals with invdupdel(8p) or del(8p)_distal. However, VSD and/or ASD were reported in over one third of individuals with invdupdel(8p) ( n = 15, 38%)
    explanation: The recurrent invdupdel subgroup retained both genes despite septal defects in 15/40 assessed individuals. This directly limits a universal GATA4/SOX7-deletion explanation.
  - reference: url:https://ricerca.uniba.it/retrieve/dd9e0c64-b05b-1e9c-e053-3a05fe0a45ef/6_sdarticle.pdf
    reference_title: https://ricerca.uniba.it/retrieve/dd9e0c64-b05b-1e9c-e053-3a05fe0a45ef/6_sdarticle.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: By high resolution oligo array CGH, we detected the smallest inverted duplication of 8p reported thus far, with additional duplication of 8q24.13/qter on the short arm of the abnormal chromosome 8 (Figs. 1 and 2 A and B).
    explanation: The measured complex chromosome contains an additional terminal 8q duplication on 8p. This is evidence for captured material, not direct observation of the proposed replication process.
  - reference: PMID:35768224
    reference_title: A Case Report of Respiratory Syncytial Virus-Infected 8p Inverted Duplication Deletion Syndrome with Low Natural Killer Cell Activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: His NK cell activity was measured 9.9% using a 51Cr release assay at an Effector/Target ratio of 20:1
    explanation: Single-patient NK cytotoxicity was measured at five months, after severe RSV at one month. Plasma defensin was measured at eleven months against four older controls; neither measurement proves the proposed acute causal chain.
- discussion_id: invdupdel8p_clinical_evidence_scope
  prompt: How should heterogeneous cohorts and proposed care guidance be interpreted?
  rationale: 'The main clinical sources represent selected cohorts: Okur includes 49 recurrent invdupdel cases within 102 individuals with several 8p rearrangements; Vibert includes 33 postnatal cases and three fetuses, with five relatives; Santucci includes 14 invdupdel cases within a 24-person mixed clinic. Their denominators are not pooled. Proposed management recommendations were not evaluated for efficacy. Internal aggregate MRI and cardiac counts in the Santucci table do not reconcile, so those pooled rates are not used. The prenatal 2025 series includes an inherited interstitial-deletion case retaining the terminal 8p segment; its apparently unaffected five-year outcome is not generalized to classic terminal-deletion invdupdel. The eight-case Yurchenko series also reports different seizure and cardiac observations from the larger cohorts, illustrating selection and age effects rather than defining an invariant phenotype.'
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the shared deleted interval in individuals with invdupdel(8p) was the most distal 6.7 Mb and the shared duplicated interval was approximately 11.1 Mb.
    explanation: CMA-defined shared intervals in the 49-person recurrent subgroup establish simultaneous distal loss and proximal gain; the full duplicated interval varies by individual.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients 16, 17, 18, 19, and 20 were from the same family and included two sibs and their children (Figure 1). All five individuals pres- ented with mild to moderate ID without any major associated malforma- tion.
    explanation: Five affected relatives in two generations carried the rearrangement; all had mild to moderate intellectual disability. This is direct transmission of the unbalanced chromosome, not just inheritance of a benign inversion.
notes: 'Source scope: Okur, Clinical and genomic characterization of 8p cytogenomic disorders (PMID:34282301); Vibert, Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion (PMID:34866188); Santucci, Chromosome 8p Syndromes: Clinical Presentation and Management Guidelines (PMID:39390634); Shimokawa, Molecular characterization of inv dup del(8p): analysis of five cases (PMID:15214003); Buysse, Unusual 8p inverted duplication deletion with telomere capture from 8q (PMID:19041960). Public full-text PDF references retain their generated URL titles. No disorder-specific GeneReviews chapter or relevant interventional trial was identified in the review searches. Clinical care guidance and primary cohort observations are distinguished from experimentally tested treatment efficacy.'

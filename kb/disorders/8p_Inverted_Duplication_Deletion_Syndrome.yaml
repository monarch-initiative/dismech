    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Ninety-six percentage (27/28) of patients had speech delay and 37.5% (9/24) of patients older than 3 years (3 – 13.8 years) had not acquired language at last evaluation.
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.

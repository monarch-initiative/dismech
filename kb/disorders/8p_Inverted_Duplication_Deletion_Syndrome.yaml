    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Invdupdel(8p) is the most common recurrent chromosomal rearrangement in ID patients with anomalies of the corpus callosum (AnCC)."
    explanation: >-
      The reverse-direction association, which is what makes callosal imaging a route to this

- name: Terminal Deletion with Inverted Proximal Duplication
  biological_scale: MOLECULAR
  description: The measured endpoint is loss of distal 8p together with inverted gain of a more proximal segment. A spacer is common but not obligatory. Copy-number assays define intervals; cytogenetic or structural studies establish orientation.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf

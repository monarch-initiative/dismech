diagnosis:
- name: Chromosomal microarray and structural characterization
  description: CMA identifies the terminal deletion, duplicated interval, spacer if present, and additional pathogenic copy-number changes. Karyotyping and targeted FISH can establish the orientation and chromosomal context. Array intervals are platform-dependent and are not nucleotide-resolved junctions.
  evidence:
  - reference: PMID:27343326
    reference_title: Molecular cytogenetic characterization of inv dup del(8p) in a fetus associated with ventriculomegaly, hypoplastic left heart, polyhydramnios and intestinal obstruction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Metaphase FISH confirmed inv dup del(8p).
    explanation: CMA established copy-number intervals and metaphase FISH confirmed the structural rearrangement.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the shared deleted interval in individuals with invdupdel(8p) was the most distal 6.7 Mb and the shared duplicated interval was approximately 11.1 Mb.
    explanation: CMA-defined shared intervals in the 49-person recurrent subgroup establish simultaneous distal loss and proximal gain; the full duplicated interval varies by individual.
- name: Parental studies and individualized recurrence assessment
  description: Study both parents according to the proband architecture. Routine karyotyping can miss a cryptic inversion; targeted structural testing may be needed. Distinguish a benign inversion carrier from a parent carrying the unbalanced rearrangement. Do not give a universal zero-recurrence assurance.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Project-8p-Molecular-Characterization-of-inv-dup-del8p.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: all ﬁve mothers were heterozygous inv(8)(p23) carriers (inversion heterozygotes)
    explanation: Observed in five selected Japanese families. This does not establish that all affected individuals require a maternal inversion.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patients 16, 17, 18, 19, and 20 were from the same family and included two sibs and their children (Figure 1). All five individuals pres- ented with mild to moderate ID without any major associated malforma- tion.
    explanation: Five affected relatives in two generations carried the rearrangement; all had mild to moderate intellectual disability. This is direct transmission of the unbalanced chromosome, not just inheritance of a benign inversion.
- name: Neurologic evaluation and indicated EEG or MRI
  description: The proposed 8p care guidance recommends EEG when seizures are suspected. Brain MRI is considered before age three for seizures, abnormal head growth or focal findings; screening MRI after age three is proposed in the absence of focal findings. This is expert guidance from a small mixed-8p clinic, not a tested screening trial.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2024/10/Clinical-Genetics-2024-Santucci-Chromosome-8p-Syndromes-Clinical-Presentation-and-Management-Guidelines.pdf
    reference_title: https://project8p.org/wp-content/uploads/2024/10/Clinical-Genetics-2024-Santucci-Chromosome-8p-Syndromes-Clinical-Presentation-and-Management-Guidelines.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Neurological • Electroencephalogram (EEG) if seizures are suspected. • MRI brain (without contrast) to evaluate for brain malformations if seizures are present, if head circumference is not progressing steadily, or if there are focal abnormalities on the neurologic exam prior to age 3. • Screening MRI brain after age 3 in the absence of focal findings.
    explanation: Table 4 recommendations; clinical indications and age are preserved.
- name: Cardiac evaluation
  description: Cardiology evaluation with consideration of echocardiography assesses congenital heart disease; ECG can be considered for arrhythmia assessment. The spectrum is not explained solely by GATA4 dosage.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2024/10/Clinical-Genetics-2024-Santucci-Chromosome-8p-Syndromes-Clinical-Presentation-and-Management-Guidelines.pdf
    reference_title: https://project8p.org/wp-content/uploads/2024/10/Clinical-Genetics-2024-Santucci-Chromosome-8p-Syndromes-Clinical-Presentation-and-Management-Guidelines.pdf
    supports: SUPPORT
    evidence_source: OTHER

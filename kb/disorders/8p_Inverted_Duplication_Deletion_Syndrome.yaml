    snippet: "Only a minority of invdupdel(8p) cases reported in the literature to date had both brain cerebral imaging and chromosomal microarray (CMA) with precise breakpoints of the rearrangements, making genotype-phenotype correlation studies for AnCC difficult."
    explanation: >-
      Why precise breakpoints matter beyond making the diagnosis: without them the
      genotype-phenotype question cannot be asked.

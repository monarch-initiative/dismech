diagnosis:
- name: Chromosomal microarray analysis
  description: >-
    Microarray defines the breakpoints of both the deletion and the duplication, which
    karyotype and conventional FISH do not resolve. In the prenatal setting it is what
    distinguishes this rearrangement from trisomy 18, which it can imitate on ultrasound.
  evidence:
  - reference: PMID:28211984
    reference_title: Prenatal diagnosis of inverted duplication deletion 8p syndrome mimicking trisomy 18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this case, we also emphasize the diagnostic power of microarray analysis in detecting the underlying genetic causes for fetuses with multiple congenital anomalies."
    explanation: The authors' own point about microarray in a fetus with multiple anomalies.
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a minority of invdupdel(8p) cases reported in the literature to date had both brain cerebral imaging and chromosomal microarray (CMA) with precise breakpoints of the rearrangements, making genotype-phenotype correlation studies for AnCC difficult."
    explanation: >-
      Why precise breakpoints matter beyond making the diagnosis: without them the
      genotype-phenotype question cannot be asked.
- name: Brain MRI
  description: >-
    Imaging for callosal anomalies, which are present in about two thirds of patients and are
    the feature that most specifically points at this rearrangement.
  evidence:
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Invdupdel(8p) is the most common recurrent chromosomal rearrangement in ID patients with anomalies of the corpus callosum (AnCC)."
    explanation: The association that makes callosal imaging diagnostically informative here.
- name: Maternal FISH for the 8p23 inversion
  description: >-
    Testing the mother for the 8p23 inversion identifies the predisposing polymorphism. It is
    common in the general population, so carrier status is not itself a recurrence risk figure
    - what it explains is why this rearrangement happened in this family.
  evidence:
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH analysis showed all their mothers to be heterozygous carriers of an 8p23 inversion [inv(8)(p23)]."
    explanation: The maternal carrier finding that maternal FISH would detect.

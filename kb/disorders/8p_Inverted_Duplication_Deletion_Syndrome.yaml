phenotypes:
- name: Global Developmental Delay
  category: Neurologic
  phenotype_term:
    preferred_term: Global Developmental Delay
    term:
      id: HP:0001263
      label: Global developmental delay
  description: Reported in 32/33 postnatal patients in the Vibert cohort; age and ascertainment limit generalization.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Global developmental delay 32/33 97% 27
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.
  - reference: PMID:35327368
    reference_title: Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of "8p Inverted Duplication/Deletion Syndrome".
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All patients were characterized by a delay in early psychomotor and language development of varying degrees, craniofacial dysmorphisms, and hypotonia.
    explanation: All eight unrelated children aged two to nine years had these findings. This small series is not pooled with the other cohorts.
- name: Intellectual Disability
  category: Neurologic
  phenotype_term:
    preferred_term: Intellectual Disability
    term:
      id: HP:0001249
      label: Intellectual disability
  description: All 19 evaluated patients aged at least five years in the Vibert cohort had mild, moderate or severe intellectual disability. This age-restricted denominator is distinct from global developmental delay.
  evidence:
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/Clinical-Genetics-2021-Vibert-Neurodevelopmental-phenotype-in-36-new-patients-with-8p-inverted-duplication-deletion-.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Intellectual disability (patients ≥5 years old) 19/19 100% 38
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.

inheritance:
- name: De novo, arising on a maternally derived chromosome
  description: >-
    The rearrangement itself is de novo in the affected child. What is inherited is a
    predisposition rather than the disorder: the mother carries a common 8p23 inversion
    polymorphism heterozygously, and the rearranged chromosome is maternal in origin.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH analysis showed all their mothers to be heterozygous carriers of an 8p23 inversion [inv(8)(p23)]."
    explanation: >-
      The maternal carrier state in all five families, which is what makes the predisposition
      inherited while the rearrangement is not.
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STRP analysis indicated that the deletions occurred in maternally derived chromosomes."
    explanation: >-
      Parent of origin established by marker analysis rather than assumed from the maternal
      carrier state.
pathophysiology:
- name: Maternal 8p23 Inversion Polymorphism
  biological_scale: MOLECULAR
  description: >-
    A common inversion between the two olfactory receptor gene clusters at 8p23, carried
    heterozygously by the mother. This is a normal polymorphism, not a mutation - reported at
    39% allele frequency in a Japanese population and 26% in Europeans - and it is curated as
    the first node because it is the substrate the rearrangement needs, not because it is
    pathogenic in itself.
  downstream:
  - target: Meiotic Recombination Within the Inversion Loop
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH analysis showed all their mothers to be heterozygous carriers of an 8p23 inversion [inv(8)(p23)]."
    explanation: The carrier state in every mother studied.
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequency of the inv(8)(p23) allele is 39% in a normal Japanese population, comparable to 26% in Europeans"
    explanation: >-
      Establishes the inversion as a common polymorphism, which is what makes the two-step
      requirement below the interesting part of the mechanism rather than a technicality.
- name: Meiotic Recombination Within the Inversion Loop
  biological_scale: MOLECULAR
  description: >-
    In a heterozygous carrier, the inverted segment and its normal counterpart pair as a loop
    at pachytene of meiosis I. Recombination within that loop generates the rearranged
    chromosome; the version with a homozygous duplication requires two recombinations, one
    inside the loop and one between the loop and the centromere. A subsequent rescue event
    removing part of the duplicated segment and one centromere is what leaves a viable
    chromosome.
  downstream:
  - target: Reciprocal Distal Deletion and Inverted Proximal Duplication
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inverted segment and its normal counterpart in inv(8)(p23) heterozygous carrier mothers form a loop at the pachytene period of meiosis I."
    explanation: The pairing configuration the model rests on.
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent rescue by eliminating a part of the duplicated segment and a centromere enables formation of viable inv dup del(8p)."
    explanation: >-
      The rescue step, without which the product is not viable - the second of the two events
      the model requires.
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proposed mechanism of formation of inv dup del(8p) requires two independent events (a recombination within the loop and subsequent rescue), which may explain its rarity."
    explanation: >-
      The authors' own reconciliation of a common predisposing polymorphism with a rare
      outcome, which is the point of curating the polymorphism as a separate node.
- name: Reciprocal Distal Deletion and Inverted Proximal Duplication
  biological_scale: MOLECULAR
  description: >-
    The product: one chromosome carrying a deleted distal segment, an intact segment in
    between, and a duplicated proximal segment in inverted orientation. In every patient
    analysed the proximal deletion breakpoint and one duplication breakpoint were the same
    position, each inside one of the 8p23 olfactory receptor clusters - which is what shows the
    two lesions are one event rather than two.
  downstream:
  - target: Opposed Dosage Change Across Two 8p Segments
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, inv dup del(8p) consisted of a deleted distal segment, an intact in-between segment, and a duplicated proximal segment."
    explanation: The architecture of the rearranged chromosome, consistent across all five patients.
  - reference: PMID:15214003
    reference_title: "Molecular characterization of inv dup del(8p): analysis of five cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all of them, the proximal breakpoint of the deletion and one of the breakpoints of the duplication were identical, each located at one of the two olfactory receptor gene clusters at 8p23."
    explanation: >-
      Shared breakpoints are the evidence that the deletion and duplication are one lesion, and
      the reason this entry's pathograph branches after this node rather than before it.
- name: Opposed Dosage Change Across Two 8p Segments
  biological_scale: MOLECULAR
  description: >-
    The functional consequence is two dosage changes in opposite directions on one chromosome -
    monosomy for the distal segment and trisomy for the proximal one - so the phenotype is the
    sum of a loss and a gain rather than the effect of either. Duplication extent varies
    between patients, and the largest series used that variation to refine a 5.1 Mb region
    common to the duplications of patients with callosal anomalies.
  downstream:
  - target: Altered Brain and Commissural Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal Heart Morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:15004455
    reference_title: "The application of region-specific probes for the resolution of duplication 8p: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An inverted duplication of the segment p22-->p11.2 and a deletion of the subtelomeric region were demonstrated."
    explanation: >-
      An independently characterised case showing the same two-segment architecture, with the
      duplication and the subtelomeric deletion resolved separately.
  - reference: PMID:15004455
    reference_title: "The application of region-specific probes for the resolution of duplication 8p: a case report and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the application of molecular cytogenetic methods the existence of different duplication segments within the clinical entity of duplication/deficiency 8p can be shown."
    explanation: >-
      Establishes that the duplicated interval is not fixed between patients, which is the
      variation the later genotype-phenotype work exploits.
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This led us to refine a region of 5.1 Mb common to duplications of patients with AnCC and discuss potential candidate genes within this region."
    explanation: >-
      The genotype-phenotype refinement, and the reason the downstream link to the callosal
      phenotype is INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT: a region, not a gene.
- name: Altered Brain and Commissural Development

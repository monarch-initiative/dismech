name: 8p Inverted Duplication Deletion Syndrome
category: Chromosomal
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- invdupdel(8p)
- inv dup del(8p)
- inverted 8p duplication/deletion syndrome
- inverted duplication deletion 8p
description: >-
  8p inverted duplication/deletion syndrome is a recurrent chromosomal rearrangement in which a
  distal 8p deletion and an inverted proximal 8p duplication sit on the same chromosome,
  separated by an intact segment. It is not two coincident events. The deletion and the
  duplication are produced together by one meiotic accident, and the entry is organised around
  that fact because it is what makes the disorder mechanistically distinctive and what its
  pathograph has to represent: a single lesion that branches into two opposed dosage changes.

  The mechanism is unusually well worked out for a rearrangement this rare. In every patient
  studied by FISH and short-tandem-repeat analysis, the proximal breakpoint of the deletion and
  one breakpoint of the duplication were identical and both sat in one of the two olfactory
  receptor gene clusters at 8p23. Every mother was a heterozygous carrier of an 8p23 inversion,
  and the deletions occurred on maternally derived chromosomes. The inverted segment and its
  normal counterpart pair as a loop at pachytene in a carrier mother, recombination within the
  loop produces the rearranged chromosome, and a subsequent rescue event that removes part of
  the duplicated segment and one centromere is what makes it viable.

  That two-step requirement is the answer to an obvious question. The predisposing inversion is
  not rare - reported at 39% allele frequency in a Japanese population and 26% in Europeans -
  so if one recombination sufficed, the syndrome would be common. It needs a recombination
  *and* a rescue, and the authors give that as the explanation for its rarity. Curating the
  common polymorphism as the first node makes this explicit rather than leaving the entry
  looking like it describes a rare mutation.

  Clinically it is a neurodevelopmental disorder. In the largest series 97% of patients had
  mild to severe developmental delay or intellectual disability and 34% had seizures with a
  mean onset near four years. Its most distinctive association is with the corpus callosum:
  63% of those imaged had callosal anomalies, and invdupdel(8p) is described as the most common
  recurrent chromosomal rearrangement in intellectual disability patients with callosal
  anomalies - which makes it a rearrangement worth remembering from the MRI rather than only
  from the microarray.

  Severity is not uniform and the entry records both ends. The majority of reported cases have
  no life-threatening malformations, but a prenatally diagnosed case with severe polyvalvular
  dysplasia mimicked trisomy 18 on ultrasound and the infant died at twelve days.

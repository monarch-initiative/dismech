      label: GATA4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    A dosage-sensitive cardiac transcription factor at 8p23.1, inside the segment this
    rearrangement deletes. It is a candidate contributor to the cardiac and diaphragmatic
    features, and the evidence for it comes from isolated 8p23.1 imbalance rather than from
    invdupdel(8p) cohorts.
  evidence:

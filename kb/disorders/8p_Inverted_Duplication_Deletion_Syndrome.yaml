    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical manifestations in all cases are psychomotor and language delay, muscle hypotonia, and dysmorphic facial features."
    explanation: Hypotonia in all cases of an eight-patient series.
  - reference: PMID:35327368
    reference_title: "Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of \"8p Inverted Duplication/Deletion Syndrome\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations of this chromosomal/genomic imbalance include mild-to-severe intellectual disability, characteristic dysmorphic facial features, CNS malformations such as hypoplasia/agenesis of the corpus callosum (67%), cardiovascular diseases (65%), musculoskeletal problems (59%), hypotonia (88%), and seizures (55%)."
    explanation: The 88% literature-wide figure that this VERY_FREQUENT grading rests on.
- name: Abnormal Facial Shape
  category: Craniofacial
  description: >-
    Dysmorphic facial features are present in essentially all reported patients. The recurring
    components named are prominent forehead, upslanted palpebral fissures, thin upper lip,
    micrognathia, wide interdental spaces and low-set ears.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dysmorphic facial features
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:35327368
    reference_title: "Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of \"8p Inverted Duplication/Deletion Syndrome\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical manifestations in all cases are psychomotor and language delay, muscle hypotonia, and dysmorphic facial features."
    explanation: Dysmorphic facial features in all cases of the eight-patient series.
  notes: >-
    Bound at the gestalt level. The sources name recurring components but describe them as a
    facial pattern rather than reporting each as an independent finding with its own frequency,
    so component-level HP terms would assert more than the literature does.
- name: Recurrent Respiratory Infections
  category: Immunological
  description: >-
    An immune component reported once and worth curating because it has a candidate mechanism
    on the deletion side. A one-month-old with invdupdel(8p) and severe respiratory syncytial
    virus bronchiolitis had reduced natural killer cell activity and reduced alpha-defensin
    against healthy controls; the defensin gene cluster sits at 8p23.1 and is inside the
    deleted segment.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Recurrent respiratory infections
    term:
      id: HP:0002205
      label: Recurrent respiratory infections
  evidence:
  - reference: PMID:35768224
    reference_title: "A Case Report of Respiratory Syncytial Virus-Infected 8p Inverted Duplication Deletion Syndrome with Low Natural Killer Cell Activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient showed lower NK cell activity and alpha-defensin level compared with healthy controls."
    explanation: >-
      The measured immune deficit in an invdupdel(8p) patient. One patient, hence OCCASIONAL,
      and the authors note cellular immune function had never previously been reported in this
      syndrome.
  - reference: PMID:35768224
    reference_title: "A Case Report of Respiratory Syncytial Virus-Infected 8p Inverted Duplication Deletion Syndrome with Low Natural Killer Cell Activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, cellular immune function in inv dup del(8p) syndrome has never been reported."
    explanation: >-
      Establishes that this is a first observation rather than a frequency estimate, which is
      why no cohort figure is given for it.

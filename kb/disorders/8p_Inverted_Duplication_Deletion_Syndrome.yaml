discussions:
- discussion_id: invdupdel8p_two_lesions_one_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of invdupdel(8p) come from the distal deletion, which from the proximal
    duplication, and which need both?
  attaches_to:
  - pathophysiology#Opposed Dosage Change Across Two 8p Segments
  - phenotypes#Abnormal Corpus Callosum Morphology
  rationale: >-
    The rearrangement is one event producing two dosage changes in opposite directions, and
    almost nothing published assigns a feature to one side or the other. Isolated 8p23 deletion
    and isolated 8p proximal duplication both exist as separate entities, so the comparison is
    available in principle, but the invdupdel literature is small, only a minority of published
    cases have both precise breakpoints and brain imaging, and the cohorts that do exist are
    ascertained through the combined rearrangement.

    The one genotype-phenotype result available cuts on the duplication side: a 5.1 Mb region
    common to the duplications of patients with callosal anomalies, with candidate genes
    discussed rather than demonstrated. That is a lead about the duplication and says nothing
    about the deletion's contribution to the same feature.

    Partial attributions do exist on the deletion side, and they are curated in genetic: as
    candidates rather than promoted into the pathograph. GATA4, NEIL2 and SOX7 sit at 8p23.1
    inside the deleted segment and were prioritised for the diaphragmatic and cardiac features -
    but by a protein-interaction network algorithm, in a cohort of *isolated* 8p23.1 imbalance
    rather than invdupdel(8p). The defensin cluster attribution is stronger in one respect,
    being made in an actual invdupdel(8p) patient with measured low NK activity and
    alpha-defensin, and weaker in another, resting on a single case.

    This entry therefore keeps a single dosage node with both downstream branches leaving it,
    rather than splitting into deletion-derived and duplication-derived arms. The deletion-side
    candidates are real leads and are recorded as such; promoting them into pathophysiology
    nodes would encode gene-level attributions that no invdupdel(8p) study has tested.
  evidence:
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a minority of invdupdel(8p) cases reported in the literature to date had both brain cerebral imaging and chromosomal microarray (CMA) with precise breakpoints of the rearrangements, making genotype-phenotype correlation studies for AnCC difficult."
    explanation: >-
      The authors state the obstacle directly: the data needed to attribute features to one
      segment mostly do not exist.
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This led us to refine a region of 5.1 Mb common to duplications of patients with AnCC and discuss potential candidate genes within this region."
    explanation: >-
      The one partial answer, and its limits - a region on the duplication side, with candidate
      genes discussed rather than tested.
notes: >-
  Curated as a Disease rather than a Grouping. It is a recurrent rearrangement with one
  mechanism of formation, one characteristic breakpoint architecture and a reasonably conserved
  phenotype, so it has a single pathograph - which is the test in the Disease Groupings section
  of CLAUDE.md. The variation in duplication extent between patients is within-entity
  variation, not a union of distinct diseases.

  The 8p23.1 inversion carried by the mothers is a common polymorphism and is curated as
  pathophysiology rather than as a genetic risk factor, because in this disorder it is a
  mechanistic prerequisite for the rearrangement rather than a modifier of its severity. It
  should not be read as conferring risk on its carriers in any general sense.

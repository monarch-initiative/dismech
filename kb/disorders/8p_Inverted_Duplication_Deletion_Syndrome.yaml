  description: >-
    Near-universal, and spanning the full severity range rather than clustering at one end: 32
    of 33 patients in the largest cohort had mild to severe developmental delay or intellectual
    disability.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among those, 97% (n = 32/33) of patients presented with mild to severe developmental delay/ID and 34% had seizures with mean age of onset of 3.9 years (2 months-9 years)."
    explanation: >-
      Frequency with an explicit denominator, and the severity range in the same sentence.
      Graded VERY_FREQUENT rather than OBLIGATE because one of 33 did not have it.
  - reference: PMID:35327368
    reference_title: "Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of \"8p Inverted Duplication/Deletion Syndrome\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main clinical manifestations in all cases are psychomotor and language delay, muscle hypotonia, and dysmorphic facial features."
    explanation: >-
      An independent series in which psychomotor and language delay is present in every patient,
      and the source for treating language delay as part of this phenotype rather than as a
      separate one.
- name: Abnormal Corpus Callosum Morphology
  category: Neuroanatomical
  description: >-
    Callosal anomalies in 17 of 27 patients with brain imaging or neuropathology - about two
    thirds - which is the syndrome's most distinctive structural feature.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Anomalies of the corpus callosum
    term:
      id: HP:0001273
      label: Abnormal corpus callosum morphology
  evidence:
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, out of the 24 patients with brain MRI and 3 fetuses with neuropathology analysis, 63% (n = 17/27) had AnCC."
    explanation: >-
      Frequency with its denominator, and the denominator matters: it is patients who had
      imaging, not all patients.
  notes: >-
    The bound term is the general "Abnormal corpus callosum morphology". The cited cohort
    reports anomalies of the corpus callosum as a category without breaking them down into
    agenesis, hypoplasia or dysgenesis in the abstract, so a narrower HP term would assert a
    specific malformation the source does not name.
- name: Seizure
  category: Neurological
  description: >-
    Seizures in about a third of patients, with mean onset at 3.9 years and a range from two
    months to nine years.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:34866188
    reference_title: "Neurodevelopmental phenotype in 36 new patients with 8p inverted duplication-deletion: Genotype-phenotype correlation for anomalies of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among those, 97% (n = 32/33) of patients presented with mild to severe developmental delay/ID and 34% had seizures with mean age of onset of 3.9 years (2 months-9 years)."
    explanation: Frequency and age at onset, from the same cohort sentence.
- name: Abnormal Heart Morphology
  category: Cardiovascular
  description: >-
    Cardiovascular malformation is a common feature rather than a rare one - reported in about
    65% of published patients - and is curated here at that frequency, separately from the
    severe valvular lesion below.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  evidence:
  - reference: PMID:35327368
    reference_title: "Clinical Manifestations of Various Molecular Cytogenetic Variants of Eight Cases of \"8p Inverted Duplication/Deletion Syndrome\"."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical manifestations of this chromosomal/genomic imbalance include mild-to-severe intellectual disability, characteristic dysmorphic facial features, CNS malformations such as hypoplasia/agenesis of the corpus callosum (67%), cardiovascular diseases (65%), musculoskeletal problems (59%), hypotonia (88%), and seizures (55%)."
    explanation: >-
      The literature-wide frequency figures. Cited once here and reused below for the other
      features it quantifies, rather than paraphrased per phenotype.
- name: Polyvalvular Dysplasia
  category: Cardiovascular
  description: >-
    The severe tail of the cardiac phenotype, and a different claim from the common septal
    lesions above. A prenatally diagnosed case had severe polyvalvular dysplasia - striking
    enough that the sonographic picture was taken for trisomy 18 - and the infant died at twelve
    days. The paper reporting it is explicit that this is atypical.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Severe polyvalvular dysplasia
    term:
      id: HP:0001654
      label: Abnormal heart valve morphology
  evidence:
  - reference: PMID:28211984
    reference_title: Prenatal diagnosis of inverted duplication deletion 8p syndrome mimicking trisomy 18.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the present case had severe polyvalvular dysplasia and the infant deceased at day 12 of life."
    explanation: >-
      The single reported case. Graded VERY_RARE rather than OCCASIONAL because it is one
      patient against more than a hundred published, and the source frames it as contrary to
      them.
  - reference: PMID:28211984
    reference_title: Prenatal diagnosis of inverted duplication deletion 8p syndrome mimicking trisomy 18.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the reported cases have revealed no life-threatening malformations."
    explanation: >-
      Recorded as REFUTE against reading this as a lethal malformation syndrome. Cited from the
      same paper as the fatal case so the two are read together rather than the striking one
      alone.
  notes: >-
    The bound term is the general "Abnormal heart valve morphology". HPO returned no term for
    polyvalvular dysplasia at curation time, so the specific lesion is carried in preferred_term.
    An earlier version of this entry carried the fatal case under a general
    "Abnormal Heart Morphology" phenotype graded OCCASIONAL, which read a cohort-level frequency
    off a single case report; the two are now separate claims with separate evidence.
- name: Hypotonia
  category: Neurological
  description: >-
    Muscle hypotonia is near-universal - present in all eight patients of one series and in about

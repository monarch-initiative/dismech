genetic:
- name: GATA4
  gene_term:
    preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  notes: Usually copy-neutral in the recurrent spacer-containing rearrangement. A larger atypical deletion can encompass this gene; candidate contribution to heart or diaphragm development must be conditioned on measured copy number. Presence of heart disease alone does not imply its deletion.
  evidence:
  - reference: PMID:27343326
    reference_title: Molecular cytogenetic characterization of inv dup del(8p) in a fetus associated with ventriculomegaly, hypoplastic left heart, polyhydramnios and intestinal obstruction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: aCGH detected an 11.35 Mb deletion in 8p23.3-p23.1 encompassing SOX7 and GATA4, and a 31.99 Mb duplication in 8p23.1-p11.1 in the fetus.
    explanation: A molecularly characterized atypical fetus with hypoplastic left heart demonstrates conditional deletion of both genes, not universal involvement.
  - reference: url:https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    reference_title: https://project8p.org/wp-content/uploads/2023/08/s41436-021-01270-2.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Both GATA4 and SOX7 were copy-number neutral in all individuals with invdupdel(8p) or del(8p)_distal. However, VSD and/or ASD were reported in over one third of individuals with invdupdel(8p) ( n = 15, 38%)
    explanation: The recurrent invdupdel subgroup retained both genes despite septal defects in 15/40 assessed individuals. This directly limits a universal GATA4/SOX7-deletion explanation.

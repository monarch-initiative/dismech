    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Thirty-four percent ( n = 11/32) of patients had epilepsy starting between 2 months and 9 years, characterized by absences ( n = 5), generalized tonic –clonic ( n = 3), myoclonic ( n = 2), and focal motor (n = 2) seizures.
    explanation: The source documents this manifestation in invdupdel(8p). Cohort observations are descriptive and do not establish population penetrance.

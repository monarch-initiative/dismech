    explanation: >-
      Establishes 8p23.1 imbalance as a cause of cardiac and diaphragmatic malformation.
      Graded INDIRECT for this entry because the cohort is isolated 8p23.1 deletion and
      duplication, not invdupdel(8p).
  - reference: PMID:23165946
    reference_title: "Congenital diaphragmatic hernia interval on chromosome 8p23.1 characterized by genetics and protein interaction networks."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Results from a novel CNVConnect algorithm, prioritizing protein-protein interactions between products of genes in the 8p23.1 hotspot and products of previously known CDH causing genes, implicated GATA4, NEIL2, and SOX7 in diaphragmatic defects."

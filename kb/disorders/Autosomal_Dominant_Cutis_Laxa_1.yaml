  description: A surgically sampled adult with a familial ELN frameshift and aortic aneurysm had thinning and disorganization of the medial elastic lamellae and reduced smooth-muscle density. This direct aortic observation is distinct from skin electron microscopy in another family member. TGF-beta mediation and generalized vascular fragility were not established.

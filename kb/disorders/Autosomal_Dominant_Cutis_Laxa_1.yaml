notes: >-
  Scope and lump/split. This entry is the ELN-related form only (MONDO:0007411).
  The autosomal dominant cutis laxa siblings are separate entries, not subtypes:
  ADCL2 (FBLN5, MONDO:0013751) and ADCL3 (ALDH18A1, MONDO:0014706, curated as
  ALDH18A1_Cutis_Laxa). They share the skin phenotype and the inheritance pattern
  but nothing of the molecular mechanism, and ADCL3 in particular carries a
  neurodevelopmental and progeroid picture that this disorder does not. The
  GeneReviews chapter (PMID:36173875, ELN-Related Cutis Laxa) is the phenotype
  baseline and every finding in its Clinical Characteristics abstract is
  curated: generalized cutis laxa, distinctive facial features, joint
  hyperlaxity in infancy, inguinal hernia, ptosis, aortic root dilatation and
  emphysema, plus the bladder diverticula it names under surveillance.

  Allelic disease. ELN haploinsufficiency (whole-gene deletion in Williams
  syndrome, or premature-termination alleles in exons 1-29 that undergo
  nonsense-mediated decay) causes supravalvular aortic stenosis, curated under
  Williams_Syndrome. The mechanism is the mirror image of this one: reduced
  elastin dose produces a compensatory increase in elastic lamellae and arterial
  obstruction, whereas the 3' frameshifts curated here produce a stable,
  secreted, dominant-negative protein and elastic-fibre paucity. The Eln+/-
  mouse (Li 1998) is therefore recorded as a model of the allelic disease that
  fails to recapitulate ADCL1, not as an ADCL1 model.

  Module conformance. The aortic arm conforms to aortopathy_tgfbeta_dysregulation
  at three nodes: the fragmented-elastic-fibre node stands in for the module's
  aortic-wall ECM defect (the disorder-specific substitution is mutant
  tropoelastin rather than FBN1 or a contractile-apparatus gene), the TGF-beta
  node conforms to the module hub, and the aortic medial degeneration node
  conforms to the wall-weakening node. The module's dilation and dissection
  nodes are represented here as phenotypes rather than as separate mechanism
  nodes because the ADCL1 literature documents the outcomes without describing
  a distinct intermediate step. The emphysema arm deliberately does NOT conform
  to emphysema_protease_antiprotease_imbalance: that module is an
  inflammation-driven proteolytic destruction of a normally assembled elastic
  network, whereas ADCL1 emphysema is a primary assembly defect. Callewaert et
  al. excluded alpha-1 antitrypsin deficiency in their two most severely
  emphysematous patients, and the transgenic mouse develops airspace enlargement
  through UPR, altered mechanical signalling and TGF-beta release without an
  inflammatory trigger. Conforming would assert a mechanism the sources argue
  against.

  Classification. harrisons_chapter carries the Mendelian, dermatological and
  cardiovascular Parts. No mechanistic_category is assigned: MechanisticNosologyEnum
  has collagenopathy but no elastinopathy value, and forcing collagenopathy
  would be wrong.

  Frequency bands come from the 20-patient Hadj-Rabia cohort (skin laxity 100%,
  inguinal hernia 51%, aortic root dilatation 55%, emphysema 37%) and are
  recorded only where that cohort or GeneReviews gives a figure or a
  frequency word; the pulmonary artery stenosis band rests on a single sentence
  calling it rare in ADCL.

  Provenance. Built from an Edison Falcon deep-research report
  (research/Autosomal_Dominant_Cutis_Laxa_1-deep-research-falcon.md, preflight
  PASS against MONDO:0007411, 8/8 references resolved, no ontology terms
  offered). Falcon cites by DOI and corpus key; every DOI was resolved to its
  PubMed record through the PMC ID converter (Hadj-Rabia 2013 -> PMID:23442826,
  Callewaert 2011 -> PMID:21309044, Sugitani 2012 -> PMID:22573328, Okuneva 2019
  -> PMID:30704477, Kun 2022 -> PMID:35372488, Duque Lasio 2018 ->
  PMID:29501665) and the two DOIs the converter could not map (Graul-Neumann
  2008, Merla 2012) were found on PubMed by author and title
  (PMID:18348261, PMID:23250899). The classic mechanism papers named in the
  curation brief were located on PubMed directly. The report's Akcay 2020 item
  ("Unknown journal", a thesis) is not cited. PMID:37980465, surfaced by a
  PubMed search for recent ELN cutis laxa papers, describes a nonsense variant
  causing supravalvular aortic stenosis and is not ADCL1; it is not cited.

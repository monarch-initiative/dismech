  - pathophysiology#Aortic Medial Disorganization
  rationale: The cDNA minigene model has prominent lung findings without consistent skin or vascular disease. The separate BAC model has measured skin laxity, background-dependent pulmonary effects and little aortic matrix incorporation. Added transgene expression, mouse/human elastin backgrounds, splice processing and local assembly are candidate explanations, not proven alternatives. Mouse aortic sparing does not establish minor human vascular risk.

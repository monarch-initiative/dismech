- name: Eln hemizygous mouse as an allelic dosage comparator
  species: Mouse
  genotype: Eln+/- with promoter and exon 1 deletion
  publication: PMID:9819363
  description: This model addresses reduced elastin dosage rather than an ADCL1 mutant protein. Reduced RNA and thin lamellae accompany an adaptive increase in arterial lamellar units. Arterial extensibility is near normal around physiological pressure but lower at higher pressure; mice do not develop the focal human supravalvular hourglass lesion. The human histology comparison included only two SVAS cases and three controls.
  notes: Retained as differential allelic context, with no claim that it tests or refutes a dominant-negative ADCL1 mechanism. Reduced quantity and altered protein cannot be assumed to be molecular opposites at every tissue endpoint.
  evidence:
  - reference: PMID:9819363
    reference_title: Novel arterial pathology in mice and humans hemizygous for elastin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Although ELN mRNA and protein were reduced by 50% in ELN +/- mice, arterial compliance at physiologic pressures was nearly normal.
    explanation: The abstract summarizes the dosage model; the full body provides pressure-dependent limitations.
differential_diagnoses:
- name: ELN-related supravalvular aortic stenosis and Williams syndrome
  description: 'ELN haploinsufficiency, either from intragenic variants or the broader Williams-region deletion, usually produces an obstructive arteriopathy. Soft or hyperextensible skin can occur, so normal skin is not required. Variant position alone is insufficient: transcript effects, phenotype and the broader deletion context distinguish allelic disease from ELN-related cutis laxa.'
  evidence:
  - reference: PMID:23250899
    reference_title: 'Supravalvular aortic stenosis: elastin arteriopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: ELN arteriopathy is genetically heterogeneous and occurs as a consequence of haploinsufficiency of the ELN gene on chromosome 7q11.23, owing to either microdeletion of the entire chromosomal region or ELN point mutations.
    explanation: The review describes the dosage-loss allelic disease.
- name: FBLN5-related dominant and recessive cutis laxa
  description: FBLN5-related disease can overlap with ELN-related skin laxity and elastic-fiber pathology. Inheritance, systemic evaluation and molecular testing distinguish these disorders; clinical appearance alone may be insufficient.
  evidence:
  - reference: PMID:15955094
    reference_title: 'Autosomal dominant cutis laxa with severe lung disease: synthesis and matrix deposition of mutant tropoelastin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Cutis laxa (CL) is a heterogeneous group of genetic and acquired disorders with at least two autosomal dominant forms caused by mutations in the elastin and fibulin-5 genes, respectively.
    explanation: This introductory synthesis establishes genetic heterogeneity, not a new FBLN5 cohort.
- name: ALDH18A1-related cutis laxa
  description: ALDH18A1-related dominant or recessive syndromes can add progeroid features, growth restriction and neurological or ocular involvement. Developmental findings help guide the differential but are not an absolute bedside exclusion rule for ELN-related disease. Use phenotype-guided multigene or genomic testing.
- name: Other autosomal recessive cutis laxa syndromes
  description: EFEMP2, LTBP4, ATP6V0A2, PYCR1 and other disorders can combine loose skin with vascular, pulmonary, neurological, skeletal or glycosylation findings. The substantial clinical overlap requires molecular clarification. The uncertain exon 25 ELN family does not supply reliable typical ADCL1 pulmonary-artery or seizure frequencies.
  evidence:
  - reference: PMID:21309044
    reference_title: New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Clinical overlap and related, unclassified disorders illustrate many shortcomings of this classification, as illustrated by the fact that 4 out of 5 probands were initially diagnosed with recessive cutis laxa.
    explanation: These selected probands illustrate diagnostic overlap; the fraction is not diagnostic sensitivity or specificity.
- name: Ehlers-Danlos syndromes and related connective-tissue disorders
  description: Hyperextensible skin, joint laxity, scarring and tissue fragility can overlap. Redundant skin with poor recoil favors cutis laxa, whereas subtype-specific collagen or other matrix findings guide Ehlers-Danlos assessment. Normal healing is common in ELN-related disease but delayed healing has also been reported, so an absolute fragility rule is inappropriate.
- name: Acquired cutis laxa
  description: Adult or post-inflammatory onset and associated systemic conditions may suggest acquired elastolysis. An absent family history does not distinguish acquired disease from a de novo genetic disorder; clinical history, tissue findings and appropriate molecular assessment are considered together.

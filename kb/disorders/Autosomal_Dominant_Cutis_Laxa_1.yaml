- name: Loss of Elastic Recoil in Skin and Supporting Connective Tissue
  biological_scale: TISSUE
  description: >-
    The consequence in the tissues whose job is to spring back. Skin stretched by
    growth, gravity and expression does not return, so it hangs in redundant
    folds and the face ages prematurely; the eyelid skin droops into ptosis and
    blepharochalasis; the abdominal wall and inguinal canal yield to hernias;
    the joints are hyperlax in infancy; the vocal folds lose tension and the
    voice is hoarse or husky; and the bladder wall gives way to diverticula.
    All of these are the same lesion read in different elastic-fibre-rich
    tissues.

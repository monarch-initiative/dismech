    evidence_source: IN_VITRO
    snippet: "These mRNAs coded for multiple mutant tropoelastins, including C-terminally truncated and extended forms as well as for molecules lacking the constitutive exon 30."
    explanation: Shows that a single exon 30 lesion yields several mutant messages depending on splicing, which is the substrate the modifier acts on.
  downstream:

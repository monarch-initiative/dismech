- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence exists. The disorder is known from small
    families and case reports; the largest characterised cohort is 20 patients
    from six families plus one sporadic case, and the 2004 report was only the
    fourth molecularly confirmed family in the literature. Recorded as
    ULTRA_RARE on that basis, not on a measured rate.
  evidence:

- name: C-Terminally Altered Tropoelastin
  biological_scale: MOLECULAR
  description: Affected alleles can produce tropoelastin with a replaced and often extended carboxy terminus. Protein is demonstrable in selected patient cultures, but transcript abundance, exon skipping and partial nonsense-mediated decay depend on allele and isoform. Splicing can produce truncated, extended or mutation-skipping products; universal escape from RNA decay is not established.
  evidence:
  - reference: PMID:9580666
    reference_title: An elastin gene mutation producing abnormal tropoelastin and abnormal elastic fibres in a patient with autosomal dominant cutis laxa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: mRNA and immunoprecipitation studies show that the mutant allele is expressed.
    explanation: The original exon-32 case demonstrates expression, without proving that all pathogenic alleles escape RNA decay.
  - reference: PMID:15955094
    reference_title: 'Autosomal dominant cutis laxa with severe lung disease: synthesis and matrix deposition of mutant tropoelastin.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: an abnormal, 120 kDa polypeptide was detected in the proband and her affected daughter
    explanation: Patient dermal fibroblasts from the duplication family produced an abnormal protein in addition to normal tropoelastin.

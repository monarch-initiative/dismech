- name: Individualized medical aortic protection
  description: Beta blockers or angiotensin-receptor blockers may be considered by the treating specialist by extrapolation from other connective-tissue aortopathies. Their effectiveness in ELN-related cutis laxa has not been evaluated. Do not interpret pSMAD2 findings as a demonstrated human losartan rescue. Reversible airway obstruction influences beta-blocker choice, and pregnancy requires medication review.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Effectiveness of beta-blocking agents or angiotensin receptor antagonists in slowing aortic root dilatation has not been evaluated, but (as w/other connective tissue disorders) these are likely beneficial.
    explanation: This is explicitly extrapolative expert guidance with no ADCL1 efficacy trial.
- name: Symptom-directed pulmonary treatment
  description: Treat clinically significant obstructive symptoms with specialist-directed conventional respiratory care. GeneReviews lists beta-mimetic and anticholinergic agents, but cautions against anticholinergics in people with bladder diverticula. A reported asymptomatic adult with severe functional obstruction received no drug because evidence was lacking. These observations do not establish a mandatory regimen for all patients.
  action_category: THERAPEUTIC

animal_models:
- name: Human ELN cutis-laxa cDNA minigene mouse
  species: Mouse
  genotype: CMV enhancer/chicken beta-actin-driven human ELN c.2114_2138del cDNA with exon 32 skipped, on intact endogenous Eln background
  background: C57BL/6J; three founder lines, detailed functional work principally line 60
  publication: PMID:20600892
  description: Human mutant or wild-type elastin cDNA minigenes were introduced by pronuclear injection. All three mutant founders had enlarged pulmonary airspaces; severe line 2 could not be maintained and its early mortality is not the outcome of the line 60 functional experiments. Lung-strip stiffness and elastic recoil were reduced in line 60. Crosslinked elastin measured by desmosine increased in both wild-type and mutant transgenic lungs. Human and mouse elastin colocalized in a shared network; that does not resolve covalent copolymer composition molecule by molecule.
  notes: This is added cDNA expression, not a BAC or endogenous heterozygous knock-in. Genomic copy number and insertion-site matching were not reported. No consistent skin or cardiovascular pathology was observed. Elevated pSMAD2, phospho-eIF2alpha and TUNEL are parallel observations; no selective pathway blockade, active-TGF-beta release assay or therapeutic rescue establishes mediation. Histology/signaling used four mice per group and fields are nested within mice.

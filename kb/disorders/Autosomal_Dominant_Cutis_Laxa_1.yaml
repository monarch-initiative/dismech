    explanation: This reflects one asymptomatic case, not a general recommendation to withhold treatment.
- name: Inguinal hernia repair
  description: Hernia repair is considered for clinical indications, with mesh repair listed in GeneReviews and counseling about recurrence. The recommendation is not cosmetic skin tightening, and observed recurrence does not establish that clinically indicated repair is futile.

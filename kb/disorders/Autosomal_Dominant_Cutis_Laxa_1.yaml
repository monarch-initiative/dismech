- name: Dominant-Negative Disruption of Elastic Fiber Assembly
  biological_scale: MOLECULAR
  description: >-
    The mechanistic core. Mutant tropoelastin self-associates more readily than
    normal, so its coacervation temperature is lower, and in an equimolar
    mixture with wild-type protein the mixture behaves like the mutant alone.
    That dominance at the level of coacervation is the molecular basis of the
    dominant inheritance. The mutant also binds fibrillin-1 and fibulin-5 poorly,
    so tropoelastin aggregates into elastin-only globules instead of being laid
    down on microfibrils and cross-linked by lysyl oxidase; the result is less
    mature, insoluble elastin. Both halves of the defect, increased aggregation
    and decreased microfibril binding, are needed to explain the poor
    integration of elastin into fibres.
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Wall ECM or Contractile Apparatus Defect"

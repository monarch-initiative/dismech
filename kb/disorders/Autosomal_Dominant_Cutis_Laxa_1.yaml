    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Positive pressure ventilation unless needed to treat life-threatening conditions. No data exist on the potential risk of continuous positive airway pressure (CPAP) for the treatment of sleep apnea. Close follow up is warranted when CPAP is started.
    explanation: The guidance preserves the lifesaving exception and the uncertainty around CPAP.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Sunbathing or tanning, to preserve residual skin elasticity. Vitamin D supplementation should be considered in this context, and monitored annually.
    explanation: The recommendation balances UV avoidance with vitamin-D monitoring.
- name: Pregnancy planning and surveillance
  description: 'Arrange preconception cardiovascular and pulmonary evaluation and closer follow-up during pregnancy and for six months postpartum. Absence of reported perinatal complications in the small published experience does not prove safety. Review medications before conception: expert guidance continues appropriate beta blockers and replaces angiotensin-receptor blockers because of fetal risk.'

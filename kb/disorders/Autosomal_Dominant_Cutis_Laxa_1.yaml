- name: Joint stability and pain support
  description: Physical therapy and non-weight-bearing activities such as cycling or swimming can support joint function and stability. Treat episodes of pain as clinically appropriate; avoid activities that provoke instability or injury. This is supportive guidance rather than correction of elastic-fiber assembly.
  action_category: THERAPEUTIC

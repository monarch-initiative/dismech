- name: Recombinant tropoelastin binding and ARPE-19 matrix assembly
  experimental_model_type: CELL_LINE
  cell_source: ARPE-19 retinal pigment epithelial cell line supplied with purified normal or exon 32 frameshift tropoelastin; separate recombinant protein-binding assays
  publication: url:https://www.jstage.jst.go.jp/article/jhs/52/3/52_3_259/_pdf
  description: Over eight days, mutant added tropoelastin yielded less matrix-associated elastin and lower desmosine per total culture protein than normal protein, but assembly still occurred. Solid-phase assays tested a fibrillin1 amino-terminal PET fragment and recombinant fibulin5; solution co-immunoprecipitation independently tested fibulin5 association.
  notes: This is not endogenous expression in patient cells. CHO-conditioned medium supplied scaffold proteins; the fibrillin reagent is a fragment rather than full-length protein. No normal/mutant mixture, lysyl-oxidase activity or binding-restoration rescue was tested. Lower desmosine per total culture protein cannot establish fewer crosslinks per incorporated elastin molecule.

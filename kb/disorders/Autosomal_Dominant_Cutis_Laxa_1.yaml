inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Heterozygous ELN variants transmitted vertically or arising de novo. About
    two thirds of diagnosed individuals carry a de novo variant, and each child
    of an affected person has a 50% chance of inheriting it. The skin phenotype
    is close to fully penetrant in reported pedigrees, but the severity of
    aortic and pulmonary involvement varies within and between families, which
    is why a mildly affected parent does not predict a mildly affected child.
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ELN-related cutis laxa is inherited in an autosomal dominant manner."
    explanation: GeneReviews states the mode of inheritance directly.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "About one third of individuals diagnosed with ELN-related cutis laxa have an affected parent; about two thirds of affected individuals have the disorder as the result of a de novo ELN pathogenic variant."
    explanation: Gives the inherited versus de novo split that the description reports.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of an individual with ELN-related cutis laxa has a 50% chance of inheriting the pathogenic variant."
    explanation: The transmission risk from an affected parent.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced exons 28-34 of the ELN gene in five probands with ADCL features and found five de novo heterozygous mutations: c.2296_2299dupGCAG (CL-1), c.2333delC (CL-2), c.2137delG (CL-3), c.2262delA (monozygotic twin CL-4 and CL-5), and c.2124del25 (CL-6)."
    explanation: Five of five probands in this series carried de novo heterozygous variants, the primary observation behind the high de novo fraction.
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADCL is a clinically and molecularly homogeneous disorder, but intra- and interfamilial variability in the severity of organ involvement needs to be taken into account."
    explanation: Supports the variable expressivity recorded here, specifically of organ involvement rather than of the skin phenotype.

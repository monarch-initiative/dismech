genetic:
- name: ELN variants and allele-specific transcript processing
  gene_term:
    preferred_term: ELN
    term:
      id: hgnc:3327
      label: ELN
  association: Heterozygous pathogenic variants causing ELN-related cutis laxa
  notes: 'Most established alleles are carboxy-terminal frameshifts, but an intragenic tandem duplication and a deep intronic splice allele are reported. GeneReviews describes c.2272+20C>G with19-nucleotide intronic retention; historic transcripts use different numbering. Mutation location, normal and mutation-induced exon skipping, and partial transcript decay alter expressed isoforms. Stable mutant RNA in selected 2011 cultures is not universal: the earlier 1999 fibroblast study found instability of both alleles, and the human BAC model shows partial decay of the exon 32-in product. Exon-level clinical severity correlations and splicing as a surveillance predictor remain unconfirmed. The unrelated exon 25 atypical family does not establish the usual ADCL1 spectrum.'
  evidence:
  - reference: PMID:9873040
    reference_title: Cutis laxa arising from frameshift mutations in exon 30 of the elastin gene (ELN).
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Transcripts from both alleles in each kindred were unstable and responsive to transforming growth factor-beta.
    explanation: The older selected fibroblast strains show why a universal RNA-stability claim is inappropriate.
  - reference: PMID:23442826
    reference_title: Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: There are no obvious genotype-phenotype correlations when comparing patients with mutations in different exons
    explanation: The new cohort explicitly avoids an established exon-level severity rule.
  - reference: PMID:15955094
    reference_title: 'Autosomal dominant cutis laxa with severe lung disease: synthesis and matrix deposition of mutant tropoelastin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: affected individuals in this family carried a partial tandem duplication in the elastin locus.
    explanation: The duplication family broadens the established variant spectrum beyond point frameshifts.
diagnosis:
- name: Phenotype-guided molecular diagnosis
  description: Suggestive skin and facial findings, family history and systemic assessment guide molecular testing. A heterozygous pathogenic or likely pathogenic ELN variant with compatible findings establishes the diagnosis; an ELN variant of uncertain significance alone neither confirms nor excludes it. Current GeneReviews favors a cutis-laxa multigene panel or genomic testing over a restricted terminal-exon-only strategy because of overlapping disorders and less usual variant classes.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: does not establish or rule out the diagnosis.
    explanation: The explicit GeneReviews statement concerns an ELN variant of uncertain significance.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: is rarely useful and typically NOT recommended.
    explanation: In context, GeneReviews applies this limitation to sequential single-gene ELN testing, favoring panel or genomic approaches.
  - reference: PMID:23442826
    reference_title: Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We clinically and molecularly characterized the thus far largest cohort of ADCL patients
    explanation: The primary study combines phenotype and molecular evaluation; it does not make its historical exon 28–34 screen a complete modern diagnostic algorithm.
- name: Variant interpretation and assay coverage
  description: Use transcript-specific nomenclature and assess segregation and structural or splice variation when appropriate. Terminal frameshifts, intragenic rearrangements and deep intronic splice variants require attention to assay coverage. Negative coding sequencing alone does not exclude every ELN mechanism or other cutis-laxa disorders. Genetic counseling should distinguish transmission risk, variable expression and an unresolved result.
  evidence:
  - reference: PMID:15955094
    reference_title: 'Autosomal dominant cutis laxa with severe lung disease: synthesis and matrix deposition of mutant tropoelastin.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: affected individuals in this family carried a partial tandem duplication in the elastin locus.
    explanation: A structural variant was identified after point-mutation testing was negative.
  - reference: PMID:30704477
    reference_title: 'A novel elastin gene frameshift mutation in a Russian family with cutis laxa: a case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We did not test DNA from maternal grandparents due to the unavail- ability of the material.
    explanation: Missing grandparent testing prevents calling the mother’s variant definitively de novo.
- name: Baseline cardiovascular assessment
  description: Perform echocardiography to assess valve morphology and aortic-root and ascending-aortic dimensions. GeneReviews recommends discussion of baseline MR angiography around age 15, particularly for tortuosity or when the ascending aorta is not adequately visualized. Symptoms or suspected acute aortic complications require appropriate urgent clinical assessment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: To enable visualization of ascending aorta when echocardiography is inadequate
    explanation: The full initial-evaluation table provides the MR-angiography indication.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2563239/
    reference_title: Aortic aneurysmal disease and cutis laxa caused by defects in the elastin gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These findings emphasise the importance of cardiovascular monitoring to prevent fatal rupture of the aortic root in cutis laxa patients.
    explanation: The primary report explains why apparently mild skin disease does not remove the need for vascular evaluation.
- name: Baseline pulmonary assessment
  description: Assess symptoms and age-appropriate lung function. GeneReviews suggests baseline chest radiography before puberty, peak flow around age 5 and pulmonary-function testing around age 7; HRCT is directed to symptomatic emphysema assessment. A normal visual emphysema assessment does not exclude marked small-airway dysfunction. Quantitative CT findings from one case do not establish a universal PRM testing protocol.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: To evaluate severity of emphysema in symptomatic persons
    explanation: The initial-evaluation table makes HRCT assessment symptom-directed.
  - reference: PMID:39354494
    reference_title: The first Japanese case of autosomal dominant cutis laxa with a frameshift mutation in exon 30 of the elastin gene complicated by small airway disease with 8 years of follow-up.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Neither emphysema nor bronchial wall thickening, which is characteristic of bronchiolitis obliterans syndrome was present.
    explanation: Visual CT can appear free of these features despite significant functional obstruction in the reported case.
- name: Skin biopsy and other baseline organ assessment
  description: Dermal histology can demonstrate sparse, fragmented or poorly organized elastic fibers but does not distinguish every genetic cause. Molecular testing establishes the etiologic diagnosis. Assess ptosis and visual-axis obstruction, joint stability and pain, bladder diverticula or voiding problems, and psychosocial needs according to the phenotype.
  evidence:
  - reference: PMID:21309044
    reference_title: New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The amorphous component of the elastic fibers showed extensive branching and fragmentation and was not properly associated with the microfibrils.
    explanation: Dermal ultrastructure supports an elastic-fiber disorder but does not by itself identify the causal gene.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: To evaluate for bladder diverticula
    explanation: GeneReviews includes urinary ultrasound in baseline evaluation.
treatments:
- name: Multidisciplinary supportive care
  description: Management is largely symptomatic and individualized. Coordinate relevant cardiology, pulmonology, surgery, urology, ophthalmology, physical therapy and genetics input. The 2022 GeneReviews chapter reports no disease-specific clinical practice guideline and limited treatment experience; these recommendations are expert synthesis, not comparative ADCL1 trials.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Supportive care to improve quality of life, maximize function, and reduce complications is recommended
    explanation: The full chapter recommends supportive management across manifestations.
- name: Aortic and valvular surveillance
  description: GeneReviews recommends echocardiography annually or according to dimensions and progression. Discuss MR angiography after puberty and subsequent intervals based on findings, commonly every 5 years. Screening recommendations are not proof that a specific schedule reduces mortality. Mild skin findings or an exon 32 allele do not identify a group exempt from vascular surveillance.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Annually (or depending on measurements/progression)
    explanation: The cardiovascular-surveillance table individualizes the echocardiography interval.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: the potential risks and benefits of screening with MR angiography be discussed with the patient.
    explanation: The chapter recommends discussion of screening uncertainty rather than indiscriminate fixed imaging.
- name: Pulmonary surveillance
  description: Establish age-appropriate baseline lung function; the chapter suggests peak flow from age 5 every 6 months and formal pulmonary-function testing from age 7, repeated with breathlessness or a fall in peak flow. Interpret results with symptoms and imaging. The single detailed small-airway case supports attention to physiology even without visible CT emphysema.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Spirometry
    term:
      id: NCIT:C85397
      label: Spirometry

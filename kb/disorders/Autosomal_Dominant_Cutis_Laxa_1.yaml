    directness: DIRECT
    snippet: 'METHODS: We clinically and molecularly characterized the thus far largest cohort of ADCL patients, consisting of 19 patients from six families and one sporadic patient.'
    explanation: The denominator is a selected clinical cohort of related individuals, not a population survey.

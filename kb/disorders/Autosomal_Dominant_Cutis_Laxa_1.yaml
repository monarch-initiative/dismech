    snippet: Assess for need for intervention for significant self-esteem issues requiring proactive psychological support.
    explanation: The chapter recommends needs-based psychological support.
- name: Avoidance of aggravating exposures and mechanical stress
  description: Avoid tobacco and minimize respiratory infections. Individualize advice about isometric exercise and contact sports according to vascular and joint risk. GeneReviews advises avoiding positive-pressure ventilation unless lifesaving and close follow-up if CPAP is required because its specific risk is unknown. Avoid excessive ultraviolet exposure; consider vitamin-D status when sun exposure is restricted.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/

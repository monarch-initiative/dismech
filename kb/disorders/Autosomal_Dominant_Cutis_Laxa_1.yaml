- discussion_id: adcl1_mouse_skin_and_aorta_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Which expression, splicing and tissue-assembly differences explain the organ-specific phenotypes of the two transgenic designs?
  attaches_to:

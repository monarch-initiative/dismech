pathophysiology:
- name: Heterozygous ELN Pathogenic Variant
  biological_scale: MOLECULAR
  description: Heterozygous ELN variants causing this phenotype usually alter the carboxy-terminal coding sequence. Frameshifts predominate, while splice-altering intronic variants and an intragenic duplication are also reported. This is not a claim that every ELN loss-of-function allele causes cutis laxa; dosage-reducing alleles more often cause supravalvular aortic stenosis.
  evidence:
  - reference: PMID:21309044
    reference_title: New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Irrespective of the location or type, each mutation was predicted to result in the replacement of the normal C-terminus of TE with a missense peptide sequence
    explanation: All five sequence changes in the selected 2011 probands were predicted to replace the normal C terminus; the statement does not generalize to all ELN variation.

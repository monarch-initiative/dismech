- name: Cosmetic skin procedures with recurrence counseling
  description: Elective skin tightening or lipofilling is not routinely encouraged by GeneReviews because skin laxity often recurs. A 2022 uncontrolled case reported satisfaction without recurrence five months after a combined surgical and postoperative regimen; this does not establish lasting efficacy, superiority, or a standard recommendation. Discuss expectations, risks and psychosocial goals individually.

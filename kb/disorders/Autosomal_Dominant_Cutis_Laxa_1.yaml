    explanation: The son in the reported family illustrates early-childhood recognition rather than obligatory diagnosis at birth.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK584550/
    reference_title: ELN-Related Cutis Laxa - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Aortic dissection has been reported in multiple families as early as in the third decade
    explanation: The synthesis records serious vascular events in young adults.
  notes: Skin laxity is usually apparent at birth or early childhood and may become less conspicuous with age, although progression also occurs. Facial appearance and skin findings vary considerably within families. Aortic and pulmonary disease can emerge or progress despite mild external skin changes. Neuromotor development and cognition are usually preserved in reported typical cases; this is not a standardized lifelong guarantee.
experimental_models:
- name: Selected ADCL1 patient dermal fibroblast cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Cultures from CL 1, CL 3 and CL 4 among six individuals/five probands in the 2011 series
  cell_types:
  - &id003
    preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  publication: PMID:21309044
  description: Nonisogenic patient fibroblasts and age/sex/passage-matched controls were compared for elastin deposition, splicing and signaling. Reduced insoluble elastin and abnormal deposition accompanied allele-dependent intracellular effects. CL 1 lacked the measured stress response; CL 4 mainly increased BiP; CL 3 showed BiP, phospho-eIF2alpha and cleaved-caspase3 changes. Increased pSMAD2 was observed across all three tested patient cultures.

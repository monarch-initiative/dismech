- name: Human ELN BAC frameshift transgenic mouse
  species: Mouse
  genotype: Human ELN BAC carrying the paper’s 2012deltaG exon 30 deletion, tested on Eln+/+, Eln+/- and human-WT-BAC rescue backgrounds
  publication: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3381164/
  description: A human genomic BAC preserves introns and alternative splicing; three founders were identified and line 1 was used subsequently. Mutant elastin incorporated into skin and lung, with little aortic matrix incorporation despite aortic protein production. Skin required about half the displacement force of controls. Aortic desmosine and mechanics were unchanged; skin desmosine increased. Mutant-BAC-only lung compliance trends on Eln+/+ and Eln+/- were not statistically significant; adverse effects were clearer in the human-WT-BAC rescue background. The mutant BAC did not rescue Eln-null viability and impaired rescue by the wild-type human BAC.
  notes: An added BAC is not the endogenous heterozygous patient genotype. Human and mouse elastin backgrounds alter expression and tissue responses. Translation-inhibitor RNA experiments were performed in cultured mouse fibroblasts, not measured as an in-vivo RNA-decay rate. Exon32 inclusion promotes partial decay, not universal elimination; adult splice ratios alone did not explain tissue-specific matrix incorporation. The article contains inconsistent printed significance thresholds, so no repaired numeric threshold is asserted here.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3381164/
    reference_title: Alternative Splicing and Tissue-specific Elastin Misassembly Act as Biological Modifiers of Human Elastin Gene Frameshift Mutations Associated with Dominant Cutis Laxa - PMC

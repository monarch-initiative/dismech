pathophysiology:
- name: Heterozygous 3-prime ELN Frameshift Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Most patients carry a single-nucleotide deletion or
    small duplication in exons 30 to 34 of ELN, the last exons of the gene, with
    a recurrent hotspot at c.2262delA in exon 32. Because the frameshift sits so
    close to the end of the coding sequence, it does not remove the protein; it
    replaces the normal carboxy terminus of tropoelastin with a missense peptide
    that reads through into the 3' untranslated region. Exceptions exist, a
    splice-site allele and a partial tandem duplication, but they converge on
    the same abnormal C-terminal product. This is what distinguishes the disease
    from supravalvular aortic stenosis, where ELN alleles are null.
  genes:
  - preferred_term: ELN
    term:
      id: hgnc:3327
      label: ELN
  genetic_context:
    gene:
      preferred_term: ELN
      term:
        id: hgnc:3327
        label: ELN
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: 3-prime frameshift in exons 30-34 (recurrent c.2262delA); rare splice-site and partial tandem duplication alleles
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Germline, frequently de novo. The variant does not abolish the allele but
      produces a stable, secreted protein with an altered carboxy terminus that
      interferes with wild-type tropoelastin during assembly, so the category is
      dominant negative rather than loss of function.
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In most patients, frameshift mutations are found in the 3' region of the elastin gene (exons 30-34) which result in a C-terminally extended protein, though exceptions have been reported."
    explanation: States the mutation class, its location and its predicted protein consequence in one sentence.
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis showed C-terminal frameshift mutations in exon 30, 32, and 34 of the elastin gene and identified a mutational hotspot in exon 32 (c.2262delA)."
    explanation: The recurrent exon 32 hotspot, first reported by Tassabehji in 1998 and found again in this cohort.
  - reference: PMID:9580666
    reference_title: "An elastin gene mutation producing abnormal tropoelastin and abnormal elastic fibres in a patient with autosomal dominant cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A frameshift mutation in exon 32 of the elastin gene is predicted to replace 37 amino acids at the C-terminus of elastin by a novel sequence of 62 amino acids."
    explanation: The first ELN mutation identified in this disease, with the C-terminal replacement spelled out residue by residue.
  - reference: PMID:9873040
    reference_title: "Cutis laxa arising from frameshift mutations in exon 30 of the elastin gene (ELN)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "cDNA sequencing and heteroduplex analysis of elastin gene transcripts from three fibroblast strains in two kindreds now identify two frameshift mutations (2012DeltaG and 2039DeltaC) in elastin gene exon 30, thus leading to missense C termini."
    explanation: Exon 30 frameshifts in two further kindreds, establishing that the lesion class spans the whole 3' region rather than a single exon.
  - reference: PMID:9580666
    reference_title: "An elastin gene mutation producing abnormal tropoelastin and abnormal elastic fibres in a patient with autosomal dominant cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in the elastin gene are known to cause the heart defect supravalvular aortic stenosis (SVAS)."
    explanation: Recorded here as the contrast case, not as evidence for the node itself. The same paper places a loss-of-function allele class in the allelic disease and a frameshift in this one.
  downstream:
  - target: Stable Mutant ELN Transcript Escaping Nonsense-Mediated Decay
    causal_link_type: DIRECT
    description: >-
      A premature termination codon in the final exons is not an efficient
      substrate for nonsense-mediated decay, so the mutant message persists.
    evidence:
    - reference: PMID:21309044
      reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RT-PCR studies showed stable mutant mRNA in all patients."
      explanation: Direct demonstration that the frameshift allele yields a stable transcript in every patient studied.
- name: Stable Mutant ELN Transcript Escaping Nonsense-Mediated Decay
  biological_scale: MOLECULAR
  description: >-
    The mutant message survives. Whether a given transcript is degraded depends
    on where the frameshift falls relative to alternative splicing: exon 32 is
    naturally skipped in about 70% of fibroblast transcripts, so a mutation
    inside it is spliced out of most messages and the phenotype is milder, while
    mutations in exons 30, 33 and 34 remain in the message whatever the splice
    pattern. Alternative splicing is therefore the best-understood modifier of
    severity in this disease, and the reason the same molecular class produces
    such a range of organ involvement.
  biological_processes:
  - preferred_term: nonsense-mediated decay of the mutant ELN transcript
    modifier: DECREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  genes:
  - preferred_term: ELN

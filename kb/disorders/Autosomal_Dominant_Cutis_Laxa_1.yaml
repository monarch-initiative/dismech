- name: Management of bladder diverticula and impaired emptying
  description: Teach complete bladder emptying; assess residual urine and recurrent urinary infections. The chapter recommends catheterization for significant residual volume, selected antibiotic prophylaxis when incomplete voiding coexists with recurrent infections, and pelvic-floor therapy for prolapse support. These options are conditional and are not prescribed to every person with a diverticulum.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care

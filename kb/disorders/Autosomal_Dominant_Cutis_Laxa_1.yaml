- name: Increased TGF-beta Signaling from a Compliant Matrix
  biological_scale: CELLULAR
  description: >-
    The signalling amplifier. Fibroblasts from every patient studied show
    increased phospho-SMAD2, and the transgenic mouse lung shows elevated
    TGF-beta signalling markers alongside decreased stiffness and increased
    stretch at physiological pressure. The proposed logic is borrowed from
    Marfan syndrome: microfibrils sequester latent TGF-beta, a compliant matrix
    releases more of it under load, and excess TGF-beta drives the medial
    disorganisation and failed alveolar septation that show up as aortic root
    dilatation and emphysema. This is the node that makes ADCL1 a member of the
    heritable aortopathy family, and it is the only node with a proposed drug
    target, losartan, which has never been tried in this disease.

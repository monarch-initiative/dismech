inheritance:
- name: Autosomal dominant inheritance
  description: An affected heterozygous parent has a 50% chance of transmitting the pathogenic allele in each pregnancy. Expressivity varies within families. Reported probands include inherited and de novo variants; an apparently negative family history is not proof of a de novo event. Parental testing refines recurrence counseling, and negative leukocyte testing cannot exclude gonadal mosaicism.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

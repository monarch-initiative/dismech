- discussion_id: adcl1_organ_involvement_variability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which allele, tissue and environmental factors predict organ involvement in ELN-related cutis laxa?
  attaches_to:
  - pathophysiology#C-Terminally Altered Tropoelastin
  - pathophysiology#Endoplasmic Reticulum Stress Response
  rationale: Splicing and transcript stability vary by allele and model. Earlier exon 32 attenuation proposals are not established clinical genotype-risk rules. Selected fibroblast ER-stress differences do not explain all pulmonary and aortic variability, and the reported cohorts are too small and related to estimate population penetrance or validate an exon-specific surveillance exemption.
  evidence:
  - reference: PMID:21309044
    reference_title: New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: However, the observed allele-specific differences in the extent of ER stress alone do not explain the observed clinical variability in pulmonary and aortic involvement among patients.
    explanation: The paper explicitly limits the explanatory scope of its cultured-cell finding.
  - reference: PMID:23442826
    reference_title: Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: ADCL is a clinically and molecularly homogeneous disorder, but intra- and interfamilial variability in the severity of organ involvement needs to be taken into account.
    explanation: The selected clinical cohort documents organ variability rather than a validated molecular predictor.
epidemiology:
- name: Rare reported-case evidence
  description: Population prevalence is not established by the available selected families. The 2022 GeneReviews chapter summarized more than 46 molecularly identified individuals from 23 families; this is a dated literature count, not the number living with the disorder or a population prevalence. The 2013 study examined 20 people (19 from six families plus one sporadic patient). Its abstract, pooled table and discussion contain inconsistent organ-frequency percentages, so these are not converted into disease-wide frequency bands.
  evidence:
  - reference: PMID:23442826
    reference_title: Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity.
    supports: SUPPORT

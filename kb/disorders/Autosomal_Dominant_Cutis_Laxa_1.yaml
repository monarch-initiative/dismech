- name: Endoplasmic Reticulum Stress and Apoptosis from Retained Mutant Tropoelastin
  biological_scale: CELLULAR
  description: >-
    The retained fraction of mutant tropoelastin misfolds, recruits the chaperone
    BiP in the endoplasmic reticulum, and in the more severe alleles drives
    phosphorylation of eIF2-alpha and activation of caspase-3. The response is
    allele specific: an exon 30 frameshift with an 86-residue missense tail
    raised both early and late markers, an exon 32 allele raised only BiP, and an
    exon 33 +1 frameshift raised none, so both the length and the sequence of
    the missense peptide matter. The same unfolded protein response and
    apoptosis are seen in the lungs of the transgenic mouse. The authors are
    explicit that ER stress alone does not explain the clinical variability in
    aortic and pulmonary involvement, so this branch is a contributor rather
    than the determinant.

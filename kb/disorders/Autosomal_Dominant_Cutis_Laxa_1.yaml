- name: Synthesis and Secretion of C-Terminally Altered Tropoelastin
  biological_scale: CELLULAR
  description: >-
    Fibroblasts and other elastogenic cells make the mutant tropoelastin and
    export most of it. This is the step that makes the disease dominant
    negative rather than haploinsufficient: an abnormal protein reaches the
    extracellular space in quantity and is available to interfere with
    assembly. Part of it is retained intracellularly, and that fraction feeds
    the endoplasmic reticulum stress branch below. The carboxy terminus that is
    lost normally mediates binding to microfibril-associated glycoproteins and
    cell-surface glycosaminoglycans, both required for elastic fibre formation.

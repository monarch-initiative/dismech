  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Each child of an individual with ELN-related cutis laxa has a 50% chance of inheriting the pathogenic variant."
    explanation: The transmission risk that counseling conveys.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the ELN pathogenic variant has been identified in an affected family member, prenatal and preimplantation genetic testing are possible."
    explanation: The reproductive options that become available once the variant is known.
animal_models:
- name: Human ELN cutis laxa minigene transgenic mouse (exon 30 -1 frameshift)
  species: Mouse
  genotype: Transgenic, pronuclear injection of a human tropoelastin minigene carrying a cutis laxa exon 30 single-base deletion, on a wild-type mouse Eln background
  publication: PMID:20600892
  description: >-
    The first in vivo model of the dominant-negative allele. Three independent
    founder lines expressing the mutant human minigene developed emphysematous
    airspace enlargement, with transgenic elastin deposited into pulmonary
    elastic fibres, increased static lung compliance, decreased tissue
    stiffness, and elevated markers of TGF-beta signalling, the unfolded
    protein response and apoptosis in the lung. It is a lung model: no
    consistent skin or cardiovascular pathology developed.
  modeled_mechanisms:
  - target: Emphysematous Airspace Enlargement
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Airspace enlargement with reduced lung stiffness reproduced in three
      independent lines.
    limitations: >-
      The transgene is expressed on top of two normal mouse Eln alleles rather
      than replacing one, so the mutant-to-wild-type ratio is not that of a
      heterozygous patient, and the mouse elastin gene lacks the primate-specific
      changes that govern alternative splicing of the human gene.
    readouts:
    - name: Pulmonary airspace enlargement
      target: Emphysematous Airspace Enlargement
      direction: INCREASED
      interpretation: The morphological readout of the emphysematous phenotype.
      evidence:
      - reference: PMID:20600892
        reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Three independent founder lines of CL mice showed emphysematous pulmonary airspace enlargement."
        explanation: Reports the airspace enlargement in each of the three lines.
    - name: Static lung compliance
      target: Emphysematous Airspace Enlargement
      direction: INCREASED
      interpretation: The mechanical readout, the loss of elastic recoil that the fibre defect predicts.
      evidence:
      - reference: PMID:20600892
        reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CL mice showed increased static lung compliance and decreased stiffness of lung tissue."
        explanation: Reports the compliance and stiffness measurements.
    evidence:
    - reference: PMID:20600892
      reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Three independent founder lines of CL mice showed emphysematous pulmonary airspace enlargement."
      explanation: The emphysematous phenotype is reproducible across founders, which is what makes the model informative for this node.
  - target: Increased TGF-beta Signaling from a Compliant Matrix
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Elevated TGF-beta signalling markers in the lung, alongside the unfolded
      protein response and apoptosis.
    limitations: >-
      Measured only in lung; the aortic arm of the TGF-beta claim is not tested
      in this model because it develops no aortic phenotype.
    evidence:
    - reference: PMID:20600892
      reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, markers of transforming growth factor-β (TGFβ) signaling and the unfolded protein response (UPR) were elevated together with increased apoptosis in the lungs of CL animals."
      explanation: The in vivo demonstration of the TGF-beta increase.
  - target: Loss of Elastic Recoil in Skin and Supporting Connective Tissue
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      The mouse develops no skin phenotype despite expressing the same allele
      that produces the defining human finding.
    limitations: >-
      No consistent dermatological or cardiovascular pathology was observed, so
      the model informs the pulmonary arm only. Whether the gap reflects
      transgene dosage, mouse-human differences in elastin splicing, or a
      genuinely tissue-specific assembly pathway is not resolved by this study.
    evidence:
    - reference: PMID:20600892
      reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "No consistent dermatological or cardiovascular pathologies were observed."
      explanation: The negative result that limits the model to the lung.
  evidence:
  - reference: PMID:20600892
    reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate the molecular mechanisms leading to cutis laxa in vivo, we generated transgenic mice by pronuclear injection of minigenes encoding normal human tropoelastin (WT) or tropoelastin with a cutis laxa mutation (CL)."
    explanation: Establishes the model and its wild-type transgenic control.
- name: Humanized ELN BAC transgenic mouse with cutis laxa frameshift
  species: Mouse
  genotype: Transgenic, human ELN bacterial artificial chromosome engineered with a cutis laxa single-base deletion, expressed alongside endogenous mouse Eln
  publication: PMID:22573328
  description: >-
    A whole-gene humanised model built to keep the human splicing context that
    the minigene lacks. Mutant elastin was incorporated into elastic fibres of
    skin and lung with adverse effects on tissue function, but only at low
    levels into aortic elastin. RNA stability studies showed that alternative
    exon splicing sets which mutant transcripts survive nonsense-mediated decay,
    making splicing a modifier of severity. The model is the source of the
    tissue-specific-assembly explanation for why the aorta is less consistently
    affected than the skin.
  modeled_mechanisms:
  - target: Dominant-Negative Disruption of Elastic Fiber Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Mutant elastin is incorporated into skin and lung fibres and impairs
      tissue function, confirming the C-terminal region as critical to
      assembly.
    limitations: >-
      Incorporation into aortic elastin was low, so the model under-represents
      the aortic arm of the human disease; and as a BAC transgene it is added
      to, rather than substituted for, the mouse alleles.
    evidence:
    - reference: PMID:22573328
      reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When expressed as a transgene in mice, mutant elastin was incorporated into elastic fibers in the skin and lung with adverse effects on tissue function."
      explanation: Incorporation of mutant protein into fibres with functional consequences, in the two tissues the human disease affects most consistently.
  - target: Stable Mutant ELN Transcript Escaping Nonsense-Mediated Decay
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Alternative splicing determines the spectrum of mutant transcripts that
      escape decay, which is the modifier mechanism this node describes.
    limitations: >-
      The human BAC preserves human splicing signals, but the mouse
      trans-acting splicing machinery is not necessarily equivalent.
    evidence:
    - reference: PMID:22573328
      reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RNA stability studies found that alternative exon splicing acts as a modifier of disease severity by influencing the spectrum of mutant transcripts that survive nonsense-mediated decay."
      explanation: The splicing-decay interaction demonstrated in the model.
  evidence:
  - reference: PMID:22573328
    reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because the elastin gene has undergone significant changes in the primate lineage, modeling elastin diseases in non-human animals can be problematic."
    explanation: The authors' own statement of why a humanised gene was needed, and the caveat that applies to every mouse model in this entry.
- name: Eln hemizygous (Eln+/-) mouse
  species: Mouse
  genotype: Eln+/- (one Eln allele disrupted)
  publication: PMID:9819363
  description: >-
    The elastin haploinsufficiency model. It reproduces the allelic disease,
    supravalvular aortic stenosis, not this one: with elastin mRNA and protein
    halved, the arteries develop a compensatory 35% increase in elastic
    lamellae and smooth muscle and near-normal compliance, the same pathology
    seen in humans hemizygous for ELN. Recorded here because the brief asked
    for it and because it is the cleanest demonstration that dose loss and the
    dominant-negative allele go in opposite directions.
  modeled_mechanisms:
  - target: Dominant-Negative Disruption of Elastic Fiber Assembly
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Loss of one allele produces more elastic lamellae and arterial
      obstruction, not fewer fragmented fibres and laxity.
    limitations: >-
      The model carries no mutant protein and so cannot exhibit a
      dominant-negative effect; it models elastin dosage, which is the
      mechanism of supravalvular aortic stenosis and Williams syndrome. It is
      listed to document the distinction, not as an ADCL1 model.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The model's perturbation is reduced elastin dose from a null allele; the
        node's perturbation is a normal dose of a structurally abnormal
        tropoelastin that co-assembles with wild-type protein. The two produce
        opposite arterial histology.
      evidence:
      - reference: PMID:9819363
        reference_title: "Novel arterial pathology in mice and humans hemizygous for elastin."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although ELN mRNA and protein were reduced by 50% in ELN +/- mice, arterial compliance at physiologic pressures was nearly normal."
        explanation: The model's quantity is elastin dose, halved; nothing in it stands in for a dominant-negative protein.
    evidence:
    - reference: PMID:9819363
      reference_title: "Novel arterial pathology in mice and humans hemizygous for elastin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, ELN hemizygosity in mice and humans induces a compensatory increase in the number of rings of elastic lamellae and smooth muscle during arterial development."
      explanation: The opposite of the elastic-fibre paucity of ADCL1; the sentence that shows why this is not a model of the disease.
  evidence:
  - reference: PMID:9819363
    reference_title: "Novel arterial pathology in mice and humans hemizygous for elastin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Through a series of molecular genetic studies, we demonstrated that loss-of-function mutations in one elastin allele cause an inherited obstructive arterial disease, supravalvular aortic stenosis (SVAS)."
    explanation: >-
      Establishes what the model models, namely loss-of-function ELN alleles
      and supravalvular aortic stenosis.
  - reference: PMID:9819363
    reference_title: "Novel arterial pathology in mice and humans hemizygous for elastin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although ELN mRNA and protein were reduced by 50% in ELN +/- mice, arterial compliance at physiologic pressures was nearly normal."
    explanation: The halved dose and the compensated compliance, neither of which describes ADCL1.
differential_diagnoses:
- name: Supravalvular aortic stenosis and Williams syndrome
  description: >-
    The allelic diseases. Loss-of-function ELN alleles (nonsense and frameshift
    variants in the first 29 exons that undergo nonsense-mediated decay,
    whole-gene deletions, and the 7q11.23 microdeletion of Williams syndrome)
    halve elastin dose and produce arterial obstruction with more elastic
    lamellae, not laxity with fewer. The skin is normal. A premature
    termination codon in ELN is therefore not a diagnosis of cutis laxa until
    its position and its effect on the transcript are known.
  evidence:
  - reference: PMID:23250899
    reference_title: "Supravalvular aortic stenosis: elastin arteriopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ELN arteriopathy is genetically heterogeneous and occurs as a consequence of haploinsufficiency of the ELN gene on chromosome 7q11.23, owing to either microdeletion of the entire chromosomal region or ELN point mutations."
    explanation: The allelic disease is a haploinsufficiency arteriopathy, from whole-region deletion or point mutation, which is what separates it from the dominant-negative disease curated here.
  - reference: PMID:9580666
    reference_title: "An elastin gene mutation producing abnormal tropoelastin and abnormal elastic fibres in a patient with autosomal dominant cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in the elastin gene are known to cause the heart defect supravalvular aortic stenosis (SVAS)."
    explanation: The same paper that identified the first cutis laxa frameshift contrasts it with the loss-of-function alleles of supravalvular aortic stenosis.
- name: FBLN5-related autosomal dominant cutis laxa (ADCL2)
  description: >-
    Clinically similar loose skin with the same inheritance, from heterozygous
    fibulin-5 variants; fibulin-5 is the microfibril-associated protein that
    tropoelastin must bind. Distinguished only molecularly. Not a subtype of
    this entry.
- name: ALDH18A1-related autosomal dominant cutis laxa (ADCL3)
  description: >-
    Progeroid cutis laxa with intrauterine growth retardation, developmental
    delay, cataract and vascular tortuosity, from de novo ALDH18A1 variants.
    The neurodevelopmental involvement separates it at the bedside; ELN-related
    disease has normal intelligence and neuromotor development.
- name: Autosomal recessive cutis laxa syndromes
  description: >-
    FBLN5, EFEMP2, LTBP4, ATP6V0A2 and PYCR1-related forms, which add severe
    arterial tortuosity, gastrointestinal and genitourinary diverticula,
    neurological or skeletal involvement, or a glycosylation defect. Four of
    five probands in one ADCL series had been given a recessive diagnosis
    before ELN sequencing, so the clinical overlap is real.
  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical overlap and related, unclassified disorders illustrate many shortcomings of this classification, as illustrated by the fact that 4 out of 5 probands were initially diagnosed with recessive cutis laxa."
    explanation: The misclassification rate before molecular testing, which is the measure of how close the differential is.
  - reference: PMID:18348261
    reference_title: "Highly variable cutis laxa resulting from a dominant splicing mutation of the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband presented with severe cutis laxa, severe congenital lung disease previously undescribed in ADCL and pulmonary artery disease, which is often seen in ARCL but rare in ADCL."
    explanation: Pulmonary artery disease is the finding that points toward the recessive forms rather than this one.
- name: Ehlers-Danlos syndromes
  description: >-
    Hyperextensible skin that snaps back, with tissue fragility and abnormal
    scarring, from collagen defects. Cutis laxa skin is redundant and returns
    slowly; it is not fragile.
- name: Acquired cutis laxa
  description: >-
    Post-inflammatory or paraproteinaemic elastolysis presenting in adulthood
    with no family history and no ELN variant.
discussions:
- discussion_id: adcl1_tgfbeta_treatment_target
  prompt: >-
    Is the increased TGF-beta signalling seen in ADCL1 fibroblasts and the
    transgenic mouse lung a treatment-responsive driver of the aortic and
    pulmonary disease, as it is in Marfan mouse models, or an epiphenomenon of
    a compliant matrix?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased TGF-beta Signaling from a Compliant Matrix
  - treatments#Beta-blocker or angiotensin receptor blocker for aortic protection
  rationale: >-
    The edge from TGF-beta to aortic dilatation and emphysema is the only part of
    this entry's chain that offers a drug target, and it is the least
    demonstrated. The evidence is a phospho-SMAD2 readout in fibroblasts and
    elevated signalling markers in mouse lung, plus an argument by analogy with
    Marfan syndrome, where losartan prevents the aortic and pulmonary lesions.
    The authors who proposed the analogy wrote likely, not shown. No TGF-beta
    antagonist has been given to an ADCL1 patient or to either mouse model with
    a structural endpoint, so the field cannot say whether the release of
    TGF-beta from a poorly assembled matrix is what dilates the aorta or merely
    accompanies it.
  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Therefore, increased TGFβ activity likely accounts for aortic root dilatation and emphysema and opens perspectives for treatment with losartan"
    explanation: The proposal that frames the gap, hedged by its authors with the word likely.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We speculate that due to failure of proper elastic fiber organization in ADCL, a more compliant ECM results in higher amounts of released TGFβ."
    explanation: The release step is labelled speculation by the authors, which is the substance of the open question.
  proposed_experiments:
  - experiment_id: adcl1_losartan_minigene_mouse
    name: Losartan in the ELN cutis laxa minigene mouse with lung mechanics and airspace endpoints
    description: >-
      Treat the exon 30 minigene transgenic line from weaning with losartan or
      a TGF-beta neutralising antibody and measure mean linear intercept, static
      compliance and lung phospho-SMAD2 against vehicle. The model already has
      the readouts; the missing experiment is the intervention.
    would_support:
    - pathophysiology#Increased TGF-beta Signaling from a Compliant Matrix
    supporting_outcome:
    - Attenuated airspace enlargement and normalised compliance in treated animals, with reduced phospho-SMAD2.
    refuting_outcome:
    - Normalised phospho-SMAD2 without any change in airspace size or compliance.
- discussion_id: adcl1_mouse_skin_and_aorta_mismatch
  prompt: >-
    Why do mice expressing the human cutis laxa allele develop emphysema but
    neither the loose skin that defines the human disease nor its aortic root
    dilatation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Elastic Recoil in Skin and Supporting Connective Tissue
  - pathophysiology#Aortic Medial Degeneration and Root Dilatation
  rationale: >-
    Both mouse models reproduce the lung lesion and the minigene model reproduces
    nothing else; the humanised BAC model incorporates mutant elastin into skin
    fibres with adverse effects on tissue function yet no report of overt
    laxity, and puts very little into aortic elastin. The candidate explanations
    are not the same and would be resolved differently: the transgene sits on
    two normal mouse alleles, so the mutant-to-wild-type ratio is diluted; the
    primate lineage has remodelled elastin exon structure and splicing, so the
    mouse trans-acting machinery may not process the human 3' exons as a human
    cell does; and elastic fibre assembly may genuinely run through
    tissue-specific pathways that weight the C terminus differently in skin,
    lung and aorta. Until one of these is shown to be the cause, the mouse data
    cannot be used to argue that the human aortic arm is minor, and the aortic
    surveillance recommendation rests on the human cohorts alone.
  evidence:
  - reference: PMID:20600892
    reference_title: "Mechanisms of emphysema in autosomal dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "No consistent dermatological or cardiovascular pathologies were observed."
    explanation: The mismatch itself, stated by the model's authors.
  - reference: PMID:22573328
    reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because the elastin gene has undergone significant changes in the primate lineage, modeling elastin diseases in non-human animals can be problematic."
    explanation: The species-difference explanation, from the group that built the humanised model to get around it.
  - reference: PMID:22573328
    reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, only low levels of mutant protein incorporated into aortic elastin, which explains why the vasculature is relatively unaffected in this disease."
    explanation: The tissue-specific-assembly explanation, offered for the aorta specifically.
  proposed_experiments:
  - experiment_id: adcl1_knock_in_heterozygous_mouse
    name: Heterozygous knock-in of a 3-prime frameshift into the endogenous mouse Eln locus
    description: >-
      Replace one endogenous Eln allele with the c.2262delA-equivalent frameshift
      rather than adding a transgene, restoring the 1:1 mutant-to-wild-type
      ratio, and score dermal elastic fibre morphology, skin recoil and aortic
      root diameter against age-matched wild-type animals. If laxity and root
      dilatation appear, dosage was the explanation; if they do not, the
      species difference in splicing or assembly remains.
    would_support:
    - pathophysiology#Loss of Elastic Recoil in Skin and Supporting Connective Tissue
    supporting_outcome:
    - Dermal elastic fibre fragmentation with measurable loss of skin recoil, and progressive aortic root dilatation, in heterozygous knock-in animals.
    refuting_outcome:
    - Normal skin and aorta in knock-in animals despite mutant transcript and protein at the expected ratio.
- discussion_id: adcl1_organ_involvement_variability
  prompt: >-
    What determines whether a given ELN frameshift carrier develops aortic
    dilatation and emphysema, when the skin phenotype is nearly universal and
    the molecular lesion is homogeneous?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Stable Mutant ELN Transcript Escaping Nonsense-Mediated Decay
  - pathophysiology#Endoplasmic Reticulum Stress and Apoptosis from Retained Mutant Tropoelastin
  rationale: >-
    Exon 32 skipping explains part of it: an allele in a naturally skipped exon
    is removed from most transcripts and produces milder internal organ disease.
    Allele-specific endoplasmic reticulum stress was tested as a second
    explanation and rejected by its own authors, who state that it does not
    account for the variability in pulmonary and aortic involvement. That leaves
    tissue-specific incorporation of mutant protein, demonstrated in the mouse
    but not measured in human aorta and lung, and unidentified modifiers.
    Intra- and interfamilial variability is documented in the largest cohort,
    so a mildly affected parent gives no reassurance about a child, and the
    absence of a predictor is why lifelong surveillance is recommended for
    everyone.

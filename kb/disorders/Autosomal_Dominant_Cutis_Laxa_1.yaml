  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Exon 32 skipping explains a milder phenotype in patients with exon 32 mutations."
    explanation: The splice-dependent escape from the frameshift is what makes this node a modifier as well as a step.
  - reference: PMID:22573328
    reference_title: "Alternative splicing and tissue-specific elastin misassembly act as biological modifiers of human elastin gene frameshift mutations associated with dominant cutis laxa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNA stability studies found that alternative exon splicing acts as a modifier of disease severity by influencing the spectrum of mutant transcripts that survive nonsense-mediated decay."
    explanation: Confirms in the humanised mouse that what survives nonsense-mediated decay is set by splicing, and that this governs severity.
  - reference: PMID:16085695
    reference_title: "Aortic aneurysmal disease and cutis laxa caused by defects in the elastin gene."

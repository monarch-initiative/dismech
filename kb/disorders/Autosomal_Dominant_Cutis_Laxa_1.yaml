phenotypes:
- name: Cutis laxa
  category: Dermatological
  frequency: VERY_FREQUENT
  description: >-
    Loose, redundant, inelastic skin that hangs in folds and returns slowly when
    stretched, present at birth or in infancy and universal in the disease. It
    ranges from generalized redundancy with excessive folds to hyperextensibility
    without obvious folds, and is most conspicuous on the face, neck and trunk.
    Skin laxity may become less prominent with growth, but it does not resolve.
  phenotype_term:
    preferred_term: Cutis laxa
    term:
      id: HP:0000973
      label: Cutis laxa
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ELN-related cutis laxa is characterized by generalized cutis laxa (ranging from generalized skin redundancy causing excessive skin folds to skin hyperextensibility without obvious skin folds) and distinctive facial features that may become more prominent with age."
    explanation: GeneReviews defines the disease by the skin finding and gives its range.
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cohort confirms the previously reported clinical constellation of skin laxity (100%), inguinal hernias (51%), aortic root dilatation (55%) and emphysema (37%)."
    explanation: Skin laxity in 100% of the largest cohort, which is the frequency band.

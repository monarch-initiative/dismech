notes: This entry covers ELN-related cutis laxa (ADCL1). FBLN5-related and ALDH18A1-related dominant cutis laxa, recessive cutis laxa syndromes, and ELN haploinsufficiency-associated supravalvular aortic stenosis remain differential or allelic disorders. They can share matrix or cellular processes without being interchangeable diagnoses. The atypical exon-25 family is discussed with its unresolved diagnostic attribution rather than supplying typical ADCL1 frequencies. Aortic TGF-beta module conformance is not asserted because elevated SMAD2 phosphorylation does not demonstrate matrix-mediated ligand release or required signaling mediation. Excluding alpha-1-antitrypsin deficiency in two patients does not exclude all proteolytic or inflammatory contributions to lung disease.

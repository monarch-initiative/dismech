    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Repeat if there is shortness of breath or decline in peak flow measurement.
    explanation: The pulmonary-function surveillance recommendation uses clinical and peak-flow triggers.
  - reference: PMID:39354494
    reference_title: The first Japanese case of autosomal dominant cutis laxa with a frameshift mutation in exon 30 of the elastin gene complicated by small airway disease with 8 years of follow-up.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: We advocate for meticulous monitoring with pulmonary function tests and CT scans, even in cases of cutis laxa with minimal CT evidence of emphysematous changes.
    explanation: This is the case authors’ recommendation rather than a tested screening schedule.
- name: Aortic aneurysm repair
  description: Specialist aortic-root repair may be required, with valve-sparing or composite procedures chosen according to anatomy and valve function. Disease-specific size thresholds are not established; expert guidance extrapolates from other heritable aortopathies and considers growth, family history and pregnancy plans. Reported surgery does not establish unusual universal operative tissue fragility.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Thoracic Aortic Aneurysm Open Repair
    term:

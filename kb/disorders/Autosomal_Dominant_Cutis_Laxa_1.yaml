    evidence_source: HUMAN_CLINICAL
    snippet: "A 45-year-old woman and her 19-year-old son presented with inelastic, loose-hanging, and wrinkled skin that appeared prematurely aged and were clinically diagnosed as having cutis laxa."
    explanation: A mother and son with molecularly confirmed disease and the prematurely aged skin.
- name: Coarse facial features
  category: Craniofacial
  description: >-
    The distinctive facial gestalt of the disease: a coarse face with a long
    philtrum and large ears, reported in essentially every patient of the
    Callewaert series and listed by GeneReviews as one of the two defining
    features alongside the skin. Bound to the coarse-face term because that is
    what the sources name; the long philtrum and large ears are carried in the
    description rather than as separate phenotypes.
  phenotype_term:
    preferred_term: Coarse face with long philtrum and large ears
    term:
      id: HP:0000280
      label: Coarse facial features
  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "typical facial characteristics including large ears, a coarse face and a long philtrum"
    explanation: The three components of the facial gestalt in the twin probands.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ELN-related cutis laxa is characterized by generalized cutis laxa (ranging from generalized skin redundancy causing excessive skin folds to skin hyperextensibility without obvious skin folds) and distinctive facial features that may become more prominent with age."
    explanation: GeneReviews lists the distinctive facial features as a defining characteristic.
- name: Inguinal hernia
  category: Gastrointestinal
  frequency: FREQUENT
  description: >-
    Inguinal hernias occur in about half of patients, from infancy onward, and
    the risk persists at all ages because the connective-tissue defect that
    permits them does not resolve. Recurrence after repair is a recognised
    problem for the same reason.
  phenotype_term:
    preferred_term: Inguinal hernia
    term:
      id: HP:0000023
      label: Inguinal hernia
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cohort confirms the previously reported clinical constellation of skin laxity (100%), inguinal hernias (51%), aortic root dilatation (55%) and emphysema (37%)."
    explanation: Inguinal hernias in 51% of the cohort, the basis of the FREQUENT band.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other common findings are joint hyperlaxity in infancy and increasing risk of inguinal hernia at all ages."
    explanation: GeneReviews lists inguinal hernia as a common finding whose risk continues at all ages.
- name: Aortic root dilatation
  category: Cardiovascular
  frequency: FREQUENT
  description: >-
    Dilatation of the aortic root in about half of patients, which may be
    present in childhood and progresses. In the presence of a bicuspid aortic
    valve the dilatation extends beyond the sinotubular junction into the
    ascending aorta. The spectrum runs to aneurysm and rupture, which is why
    the disorder is followed as a heritable aortopathy.
  phenotype_term:
    preferred_term: Aortic root dilatation
    term:
      id: HP:0002616
      label: Aortic root aneurysm
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cohort confirms the previously reported clinical constellation of skin laxity (100%), inguinal hernias (51%), aortic root dilatation (55%) and emphysema (37%)."
    explanation: Aortic root dilatation in 55% of the cohort, the basis of the FREQUENT band.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive findings that may be present as early as childhood include ptosis, aortic root dilatation, and emphysema."
    explanation: GeneReviews records the finding as progressive and possibly present in childhood.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four probands (CL-1,-2,-3,-6) presented with progressive aortic root dilatation."
    explanation: Progression documented in four of five probands.
- name: Aortic rupture
  category: Cardiovascular
  description: >-
    The far end of the aneurysmal spectrum. Reported within a single family
    alongside milder dilatation, and the reason regular cardiac monitoring is
    recommended. No frequency is assigned; the sources describe individual
    events, not a rate.
  phenotype_term:
    preferred_term: Aortic rupture
    term:
      id: HP:0031649
      label: Aortic rupture
  evidence:
  - reference: PMID:16085695
    reference_title: "Aortic aneurysmal disease and cutis laxa caused by defects in the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To report a family with autosomal dominant cutis laxa and a young girl with sporadic cutis laxa, both with variable expression of an aortic aneurysmal phenotype ranging from mild dilatation to severe aneurysm or aortic rupture."
    explanation: Aortic rupture as the severe end of the phenotype in molecularly confirmed patients.
  - reference: PMID:16085695
    reference_title: "Aortic aneurysmal disease and cutis laxa caused by defects in the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ELN mutations may cause severe aortic disease in patients with cutis laxa. Thus regular cardiac monitoring is necessary in this disease to avert fatal aortic rupture."
    explanation: Fatal rupture is what the surveillance recommendation is meant to prevent.
- name: Bicuspid aortic valve
  category: Cardiovascular
  description: >-
    Over-represented in the disease: two of six probands in one series, against
    a population prevalence well under one percent. Its presence matters
    because it predicts dilatation of the ascending aorta beyond the root. It
    is a congenital valve malformation rather than a downstream consequence of
    the elastic-fibre lesion, so no causal edge is drawn to it; the association
    is recorded and left unexplained.
  phenotype_term:
    preferred_term: Bicuspid aortic valve
    term:
      id: HP:0001647
      label: Bicuspid aortic valve
  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CL-2 and CL-3 also had bicuspid aortic valves."
    explanation: Two of the five probands.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrate significant association of bicuspid aortic valve (BAV) with ADCL."
    explanation: The association tested formally against population prevalence.
- name: Emphysema
  category: Respiratory
  frequency: FREQUENT
  description: >-
    Pulmonary emphysema in about a third of patients, which can be early and
    severe; one child in the Callewaert series had severe emphysema, and one
    family had unusually early bronchiectasis and emphysema. Alpha-1
    antitrypsin deficiency was excluded in the severely affected patients, so
    the emphysema is attributed to the elastic-fibre defect itself.
  phenotype_term:
    preferred_term: Pulmonary emphysema
    term:
      id: HP:0002097
      label: Emphysema
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This cohort confirms the previously reported clinical constellation of skin laxity (100%), inguinal hernias (51%), aortic root dilatation (55%) and emphysema (37%)."
    explanation: Emphysema in 37% of the cohort, the basis of the FREQUENT band.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CL-2 presented with severe emphysema."
    explanation: Severe emphysema in a young child, establishing that it can be early and severe.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive findings that may be present as early as childhood include ptosis, aortic root dilatation, and emphysema."
    explanation: GeneReviews lists emphysema among the progressive findings.
- name: Airway obstruction
  category: Respiratory
  description: >-
    An obstructive ventilatory pattern with small-airway disease that can
    progress over years even when CT shows no emphysematous change, documented
    in an eight-year follow-up of an exon 30 frameshift carrier. Recorded
    separately from emphysema because the functional obstruction and the
    radiological airspace destruction do not always travel together in this
    disease.
  phenotype_term:
    preferred_term: Obstructive small airway disease
    term:
      id: HP:0006536
      label: Airway obstruction
  evidence:
  - reference: PMID:39354494
    reference_title: "The first Japanese case of autosomal dominant cutis laxa with a frameshift mutation in exon 30 of the elastin gene complicated by small airway disease with 8 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case highlighted an instance of autosomal dominant cutis laxa arising from a frameshift variant in exon 30 of ELN, accompanied by small airway disease."
    explanation: A molecularly confirmed exon 30 frameshift with small-airway disease as the pulmonary phenotype.
  - reference: PMID:39354494
    reference_title: "The first Japanese case of autosomal dominant cutis laxa with a frameshift mutation in exon 30 of the elastin gene complicated by small airway disease with 8 years of follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Computed tomography (CT) revealed the lack of normal increase in lung attenuation on expiratory CT scan, with no discernible emphysematous changes."
    explanation: Air trapping without visible emphysema, which is why obstruction is curated as its own phenotype.
- name: Ptosis
  category: Ophthalmological
  description: >-
    Drooping of the upper eyelids from redundant, inelastic lid skin, often with
    blepharochalasis. Progressive, may appear in childhood, and is one of the
    findings GeneReviews flags for surveillance because it can need surgical
    correction.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive findings that may be present as early as childhood include ptosis, aortic root dilatation, and emphysema."
    explanation: GeneReviews lists ptosis among the progressive findings.
- name: Joint hypermobility
  category: Musculoskeletal
  description: >-
    Joint hyperlaxity, most evident in infancy, that tends to attenuate with
    age. Joint pain is a surveillance item in adults.
  phenotype_term:
    preferred_term: Joint hyperlaxity in infancy
    term:
      id: HP:0001382
      label: Joint hypermobility
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other common findings are joint hyperlaxity in infancy and increasing risk of inguinal hernia at all ages."
    explanation: GeneReviews lists joint hyperlaxity in infancy as a common finding.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she presented with marked joint hypermobility and prominent facial characteristics"
    explanation: Marked joint hypermobility in a six-year-old proband with a confirmed exon 30 frameshift.
- name: Hoarse voice
  category: Otolaryngological
  description: >-
    A hoarse, deep or husky voice from lax laryngeal soft tissue, noted in
    several patients across families in both the Callewaert and Hadj-Rabia
    series. No frequency is assigned; it is reported in individual patients
    rather than counted.
  phenotype_term:
    preferred_term: Hoarse voice
    term:
      id: HP:0001609
      label: Hoarse voice
  evidence:
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both had a deep and husky voice"
    explanation: The twin probands with the recurrent exon 32 hotspot allele.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a hoarse voice was noted"
    explanation: A second, unrelated proband in the same series.
- name: Bladder diverticulum
  category: Genitourinary
  description: >-
    Bladder diverticula, a manifestation of lax hollow-viscus connective tissue
    better known from the recessive and X-linked cutis laxa syndromes but named
    by GeneReviews among the new issues to monitor for in this disease. Curated
    on that surveillance statement alone, so the support is indirect and no
    frequency is assigned.
  phenotype_term:
    preferred_term: Bladder diverticulum
    term:
      id: HP:0000015
      label: Bladder diverticulum
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Monitor for known problems (e.g., inguinal hernias, joint hypermobility and pain) and new issues that may require interventions (e.g., ptosis, aortic root dilatation, emphysema, bladder diverticula)."
    explanation: A surveillance recommendation implies the finding occurs; it does not state a case, which is why the directness is indirect.
- name: Pulmonary artery stenosis
  category: Cardiovascular
  frequency: VERY_RARE
  description: >-
    Pulmonary artery disease is a feature of the recessive cutis laxa syndromes
    and of ELN haploinsufficiency, and is rare in this disorder; it was present
    in a single proband carrying an unusual splice-site allele. The VERY_RARE
    band rests on the source's own word.
  phenotype_term:
    preferred_term: Pulmonary artery stenosis
    term:
      id: HP:0004415
      label: Pulmonary artery stenosis
  evidence:
  - reference: PMID:18348261
    reference_title: "Highly variable cutis laxa resulting from a dominant splicing mutation of the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband presented with severe cutis laxa, severe congenital lung disease previously undescribed in ADCL and pulmonary artery disease, which is often seen in ARCL but rare in ADCL."
    explanation: A single proband with pulmonary artery disease, and the source's own statement that it is rare in the dominant disorder.
genetic:
- name: Heterozygous ELN 3-prime frameshift variants
  gene_term:
    preferred_term: ELN
    term:
      id: hgnc:3327
      label: ELN
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Single-nucleotide deletions and small duplications in exons 30 to 34 that
    shift the reading frame and replace the normal carboxy terminus of
    tropoelastin with a missense peptide extending into the 3' untranslated
    region; c.2262delA in exon 32 is a recurrent hotspot. Reported alleles
    include c.2124del25, c.2137delG, c.2262delA, c.2296_2299dupGCAG, c.2333delC,
    c.2292delC and c.2323delG (exon 34), together with earlier exon 30 alleles
    reported as 2012DeltaG and 2039DeltaC under older numbering. Exceptions to
    the frameshift class are a splice-site variant, c.1621C>T, that acts as a
    dominant negative in the child and as haploinsufficiency in the clinically
    healthy father, and a partial tandem duplication producing a 120 kDa
    tropoelastin. Roughly two thirds of variants are de novo. Loss-of-function
    alleles of the same gene cause supravalvular aortic stenosis, not cutis
    laxa.
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:9873040
      reference_title: "Cutis laxa arising from frameshift mutations in exon 30 of the elastin gene (ELN)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These two dominant-acting, apparently de novo mutations in the elastin gene appear to be responsible for qualitative and quantitative defects in elastin, resulting in the cutis laxa phenotype."
      explanation: Dominant-acting, de novo frameshifts responsible for the phenotype.
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular analysis showed C-terminal frameshift mutations in exon 30, 32, and 34 of the elastin gene and identified a mutational hotspot in exon 32 (c.2262delA)."
    explanation: The mutation spectrum in the largest cohort, with the recurrent hotspot.
  - reference: PMID:21309044
    reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced exons 28-34 of the ELN gene in five probands with ADCL features and found five de novo heterozygous mutations: c.2296_2299dupGCAG (CL-1), c.2333delC (CL-2), c.2137delG (CL-3), c.2262delA (monozygotic twin CL-4 and CL-5), and c.2124del25 (CL-6)."
    explanation: Five de novo heterozygous alleles, with the nucleotide-level spectrum listed in the features.
  - reference: PMID:15381555
    reference_title: "A novel elastin gene mutation resulting in an autosomal dominant form of cutis laxa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutational analysis of the elastin gene evidenced a novel mutation (2292delC) that predicts a frameshift in the coding region and causes translation to proceed into the 3'-untranslated region."
    explanation: Read-through into the 3' untranslated region, the protein-level consequence common to the class.
  - reference: PMID:30704477
    reference_title: "A novel elastin gene frameshift mutation in a Russian family with cutis laxa: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, we identified novel heterozygous mutation c.2323delG (p.Ala775fs) in exon 34 of elastin transcript NM_001278939.1."
    explanation: An exon 34 allele, the last exon of the gene, in a mother and son.
  - reference: PMID:18348261
    reference_title: "Highly variable cutis laxa resulting from a dominant splicing mutation of the elastin gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of ELN expression in fibroblasts provided evidence for a dominant-negative effect in the child, while due to an unknown mechanism, the father showed haploinsufficiency which might explain the significant clinical variability."
    explanation: The splice-site exception, and a direct demonstration within one family that the dominant-negative product, not the variant per se, is what produces disease.
  - reference: PMID:29501665
    reference_title: "Elastin-driven genetic diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rare alteration of the elastin (ELN) gene produces disease by impacting protein dosage (supravalvar aortic stenosis, Williams Beuren syndrome and Williams Beuren region duplication syndrome) and protein function (autosomal dominant cutis laxa)."
    explanation: The review's dosage-versus-function framing that separates this disease from its allelic disorders.
diagnosis:
- name: Molecular genetic testing of ELN
  diagnosis_term:
    preferred_term: ELN sequence analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    The diagnosis is established in a proband with suggestive findings by a
    heterozygous pathogenic or likely pathogenic ELN variant. Because the
    causal alleles cluster in the last five exons, targeted sequencing of exons
    30 to 34 finds most of them, but full-gene analysis or a cutis laxa panel is
    preferred since splice-site alleles and duplications occur elsewhere, and
    four of five probands in one series had been clinically diagnosed with a
    recessive form before molecular testing. Skin biopsy shows rarefied,
    fragmented elastic fibres but is supportive rather than diagnostic and may
    be nearly normal in a severely affected patient.
  results: A heterozygous pathogenic ELN variant, usually a 3' frameshift, confirms the diagnosis in the appropriate clinical context.
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of ELN-related cutis laxa is established in a proband with suggestive findings and a heterozygous pathogenic (or likely pathogenic) variant in ELN identified by molecular genetic testing."
    explanation: GeneReviews' diagnostic criterion.
  - reference: PMID:18348261
    reference_title: "Highly variable cutis laxa resulting from a dominant splicing mutation of the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopy of the proband's dermis revealed only mild rarefication of elastic fibers (in contrast to most recessive cutis laxa types)."
    explanation: Shows that biopsy can be nearly normal in a severely affected child, so it cannot exclude the diagnosis.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    There is no cure and no disease-modifying therapy; experience is limited to
    small numbers. Care is complication-directed and multidisciplinary, drawing
    on general and cardiothoracic surgery, cardiology, pulmonology, urology,
    physical therapy, ophthalmology and medical genetics, with hernia repair,
    ptosis correction, management of obstructive lung disease and aortic
    intervention when indicated by the usual criteria for those problems.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is no cure for ELN-related cutis laxa."
    explanation: The absence of curative treatment.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Supportive care to improve quality of life, maximize function, and reduce complications is recommended and ideally involves multidisciplinary care by specialists in general surgery, cardiothoracic surgery, cardiology, pulmonology, urology, physical therapy, ophthalmology, and medical genetics."
    explanation: GeneReviews' management recommendation and the specialties it names.
- name: Cardiovascular and pulmonary surveillance
  description: >-
    Regular echocardiography of the aortic root and ascending aorta, with
    cross-sectional imaging when the root is enlarged or a bicuspid valve is
    present, and regular pulmonary function testing, from childhood and
    lifelong. This is the intervention the cohort studies argue for most
    strongly, because the aortic and pulmonary complications are what make the
    disease more than cosmetic and both can begin in childhood. Before
    conception and during pregnancy, pulmonary function testing and
    cardiovascular assessment including aortic root diameter are recommended,
    with cardiac surveillance continued six months post partum.
  action_category: MONITORING
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cardiovascular and pulmonary clinical surveillance
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:23442826
    reference_title: "Twenty patients including 7 probands with autosomal dominant cutis laxa confirm clinical and molecular homogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular cardiovascular and pulmonary evaluations are imperative in the clinical follow-up of these patients."
    explanation: The conclusion of the largest cohort study.
  - reference: PMID:16085695
    reference_title: "Aortic aneurysmal disease and cutis laxa caused by defects in the elastin gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ELN mutations may cause severe aortic disease in patients with cutis laxa. Thus regular cardiac monitoring is necessary in this disease to avert fatal aortic rupture."
    explanation: The specific rationale for cardiac monitoring, from the family in which rupture occurred.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Monitor for known problems (e.g., inguinal hernias, joint hypermobility and pain) and new issues that may require interventions (e.g., ptosis, aortic root dilatation, emphysema, bladder diverticula)."
    explanation: GeneReviews' surveillance list.
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "recommended evaluations for women with ELN-related cutis laxa before conception and during pregnancy are pulmonary function testing and cardiovascular assessment (including aortic root diameter)"
    explanation: The pregnancy-specific surveillance recommendation.
- name: Avoidance of agents that damage residual elastic tissue
  description: >-
    Tobacco smoking, positive-pressure ventilation except when life-saving,
    exposure to people with respiratory infections, isometric exercise that
    raises blood pressure, contact sports and blunt abdominal trauma, and
    sunbathing or tanning are all to be avoided, each to protect one of the
    elastic-fibre-rich tissues at risk: the lung, the aorta, the abdominal wall
    and the skin. None has been tested in the disease; the recommendations are
    extrapolated from the mechanism and from the general behaviour of
    emphysema, aortopathy and photoaged skin.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of tobacco smoke, positive-pressure ventilation, isometric exercise, contact sports and ultraviolet exposure
  notes: >-
    treatment_term is left unbound. NCIT:C17427 (Smoking Cessation) covers only
    one of the six avoidances and is not itself under Clinical Intervention or
    Procedure (NCIT:C25218); no single NCIT action term covers the set.
  target_mechanisms:
  - target: Emphysematous Airspace Enlargement
    treatment_effect: MODULATES
    description: >-
      Smoke and positive-pressure ventilation both act on lung tissue whose
      elastic recoil is already compromised; avoiding them is intended to slow
      airspace destruction. Recorded as MODULATES because the effect in this
      disease is inferred from the general biology of emphysema, not measured.
    evidence:
    - reference: PMID:36173875
      reference_title: "ELN-Related Cutis Laxa."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "Agents/circumstances to avoid: Positive pressure ventilation unless needed for life-threatening conditions; contact with people with respiratory infections; tobacco smoking; isometric exercise (which causes an increase in blood pressure); contact sports or activities that increase the risk for blunt abdominal trauma and/or joint injury or pain; sunbathing or tanning in order to preserve residual skin elasticity."
      explanation: GeneReviews' list of agents to avoid; the pulmonary items are the ones this link records, and the recommendation is expert extrapolation rather than a tested intervention.
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Positive pressure ventilation unless needed for life-threatening conditions; contact with people with respiratory infections; tobacco smoking; isometric exercise (which causes an increase in blood pressure); contact sports or activities that increase the risk for blunt abdominal trauma and/or joint injury or pain; sunbathing or tanning in order to preserve residual skin elasticity."
    explanation: GeneReviews' agents-and-circumstances-to-avoid list, reproduced in the description.
- name: Reconstructive surgery for redundant skin
  description: >-
    Rhytidectomy, blepharoplasty for ptosis and staged excision of redundant
    skin improve appearance and function, and are what most patients actually
    receive. The elastic-fibre defect persists, so recurrence within months is
    the rule in the older literature; a multi-step, sequential surgical plan is
    now advocated, and one recent patient remained recurrence-free at five
    months. Recorded as symptomatic: the operation removes lax skin, it does
    not act on any node of the mechanism.
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: reconstructive plastic surgery (rhytidectomy, blepharoplasty, skin excision)
    term:
      id: NCIT:C25351
      label: Reconstructive Surgery
  target_phenotypes:
  - preferred_term: Cutis laxa
    term:
      id: HP:0000973
      label: Cutis laxa
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:35372488
    reference_title: "Congenital Cutis Laxa: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is thought that plastic surgery might be the most effective treatment, while the previous pieces of literature on the surgical treatment for Cutis Laxa complained of the recurrence."
    explanation: >-
      Both halves of the surgical picture in one sentence. It is the most
      effective treatment available, and it recurs.
  - reference: PMID:35372488
    reference_title: "Congenital Cutis Laxa: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient is content with the effect of treatment, and there are no signs of recurrence after 5 months."
    explanation: The short follow-up behind the claim that sequential surgery can hold; five months is not long against a recurrence literature measured in months.
- name: Beta-blocker or angiotensin receptor blocker for aortic protection
  description: >-
    Blood-pressure lowering and TGF-beta antagonism borrowed from the heritable
    aortopathies. Beta-blockers are in use, as GeneReviews' pregnancy advice to
    continue them shows; losartan was proposed on the strength of the
    increased TGF-beta signalling in patient fibroblasts and the Marfan
    precedent, but there is no efficacy evidence in this disease, no trial, and
    no ADCL1-specific threshold for starting either drug. Angiotensin receptor
    blockers are teratogenic and are switched to a beta-blocker in pregnancy.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Increased TGF-beta Signaling from a Compliant Matrix
    treatment_effect: INHIBITS
    description: >-
      Losartan lowers TGF-beta signalling in Marfan models; the proposal here is
      that it would do the same for the increased phospho-SMAD2 seen in ADCL1
      fibroblasts. The link is the authors' proposal, untested in patients.
    evidence:
    - reference: PMID:21309044
      reference_title: "New insights into the pathogenesis of autosomal-dominant cutis laxa with report of five ELN mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Therefore, increased TGFβ activity likely accounts for aortic root dilatation and emphysema and opens perspectives for treatment with losartan"
      explanation: The proposal, in the authors' words; indirect because the inference runs from Marfan data and a fibroblast readout, not from any treated ADCL1 patient.
  evidence:
  - reference: PMID:36173875
    reference_title: "ELN-Related Cutis Laxa."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, women taking a beta-blocker should continue it during pregnancy; however, some other classes of medications, such as angiotensin receptor-blocking agents, are teratogenic and should be discontinued or changed to beta-blocking agents, given the increased risk for teratogenicity typically related to second- and third-trimester exposure."
    explanation: Shows that both drug classes are used in this population, and gives the pregnancy rule for choosing between them.
- name: Genetic counseling
  description: >-
    Counseling on the autosomal dominant inheritance, the two-thirds de novo
    fraction, the 50% transmission risk from an affected parent, the
    unpredictability of organ involvement from the skin phenotype, and the
    availability of prenatal and preimplantation testing once the familial
    variant is known.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  treatment_term:

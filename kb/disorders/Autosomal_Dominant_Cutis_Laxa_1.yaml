name: Autosomal Dominant Cutis Laxa 1
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
description: >-
  Autosomal dominant cutis laxa 1 (ADCL1, ELN-related cutis laxa) is a rare
  heritable elastinopathy in which a heterozygous variant near the 3' end of the
  elastin gene produces tropoelastin with the wrong carboxy terminus. The
  mechanism is a dominant-negative one, and that is the fact that organises this
  entry: the mutant transcript escapes nonsense-mediated decay, the mutant
  tropoelastin is synthesised and secreted, and once in the extracellular space
  it co-assembles with wild-type tropoelastin, lowers the coacervation
  temperature of the mixture, aggregates into globules, binds fibrillin
  microfibrils poorly, and so leaves the tissue with fewer, fragmented and poorly
  cross-linked elastic fibres. The same gene, when one copy is simply lost,
  causes supravalvular aortic stenosis with more elastic lamellae rather than
  fewer, so the two allelic diseases sit at opposite ends of the elastin
  assembly problem.

  Clinically the skin is loose, redundant and inelastic from birth or infancy,
  hangs in folds, and gives a prematurely aged face with a long philtrum, large
  ears, ptosis and blepharochalasis. The disorder was long regarded as
  cosmetic, and it is not: roughly half of patients develop aortic root
  dilatation, which can progress through childhood to aneurysm or rupture, and a
  third develop pulmonary emphysema, which can be early and severe. Inguinal
  hernias, joint hyperlaxity in infancy, a hoarse voice, bladder diverticula and
  occasional bicuspid aortic valve complete the picture. Intelligence and
  neuromotor development are normal, which is one of the features that separates
  this disorder from the recessive cutis laxa syndromes.

  A secondary layer of the mechanism explains why the internal organs are hit at
  all. Partly retained mutant tropoelastin triggers endoplasmic reticulum stress
  and apoptosis in an allele-dependent way, and the compliant, poorly organised
  matrix releases more TGF-beta, seen as increased phospho-SMAD2 in patient
  fibroblasts and in the transgenic mouse lung. That TGF-beta arm is what links
  the aortic disease to the heritable aortopathies and is the only proposed
  target for a mechanism-directed drug, though no such treatment has been tested
  in this disease.

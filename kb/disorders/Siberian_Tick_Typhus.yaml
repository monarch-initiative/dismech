pathophysiology:
- name: Dermacentor-Borne Rickettsia sibirica Inoculation
  role: trigger
  description: >-
    Feeding Dermacentor ticks inoculate R. sibirica subsp. sibirica into the
    dermis, initiating local infection at the arthropod attachment site.
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:22493192
    reference_title: Sequence and annotation of Rickettsia sibirica sibirica genome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsia sibirica sibirica is the causative agent of Siberian or North
      Asian tick typhus, a tick-borne rickettsiosis known to exist in Siberia and
      eastern China. Here we present the draft genome of Rickettsia sibirica
      sibirica strain BJ-90 isolated from Dermacentor sinicus ticks collected in
      Beijing, China.
    explanation: >-
      The abstract identifies Siberian tick typhus as tick-borne and documents
      R. sibirica subsp. sibirica recovery from Dermacentor ticks.
  downstream:
  - target: Dermal Mononuclear Phagocyte Rickettsia sibirica Infection
    causal_link_type: DIRECT
    description: Tick inoculation exposes dermal phagocytes to R. sibirica.

- name: Dermal Mononuclear Phagocyte Rickettsia sibirica Infection
  role: primary_infection
  description: >-
    After tick inoculation, rickettsiae enter dermal macrophages and dendritic
    cells, creating the inoculation-site lesion and then spreading toward
    regional lymph nodes and systemic endothelial targets.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathogenic sequence of events that occur in rickettsial infection
      begins with the entry of organisms inoculated by the feeding tick or mite
      or scratched into the skin from infected louse or flea feces deposited on
      the skin. The initial target cells of infection are CD68+ cells
      (macrophages and/or dendritic cells)
    explanation: >-
      The rickettsial pathogenesis review places macrophages or dendritic cells
      at the start of vector-inoculated skin infection.
  downstream:
  - target: Rickettsial Endothelial Infection and Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsiae disseminate from skin to systemic microvasculature.
  - target: Eschar
    causal_link_type: DIRECT
    description: Local inoculation-site infection produces a necrotic eschar.
  - target: Regional Lymphadenopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Drainage from the inoculation site enlarges regional lymph nodes.

- name: Rickettsial Endothelial Infection and Vasculitis
  role: vascular_response
  description: >-
    Disseminated R. sibirica, like other pathogenic Rickettsia species, infects
    endothelial cells and provokes small-vessel vasculitis in cutaneous and
    systemic microvascular beds.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsiae then spread hematogenously throughout the body and infect
      mainly endothelial cells
    explanation: >-
      The conserved rickettsial dissemination sequence identifies endothelial
      cells as the main hematogenous infection target.
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The fundamental lesion of rickettsial diseases is vasculitis
    explanation: >-
      The review names vasculitis as the core lesion produced after
      endothelial rickettsial infection.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic endothelial infection and inflammation produce fever.
  - target: Maculopapular Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous rickettsial vasculitis produces the maculopapular rash.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    R. sibirica, like other bacteria, depends on ribosomal translation of its
    mRNA; doxycycline binds the 30S ribosomal subunit and blocks bacterial
    protein synthesis.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence for the bacterial ribosome as the conserved antibiotic
      target class for tetracyclines such as doxycycline.

- name: Intracytosolic Rickettsia sibirica Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Rickettsia species reside free in the host-cell cytosol and exploit host
    metabolites, so effective Siberian tick typhus therapy must reach the
    intracellular bacterial compartment.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many necessary
      components via transport mechanisms instead of maintaining genes for
      synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche for pathogenic Rickettsia
      species, including R. sibirica.


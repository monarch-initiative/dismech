diagnosis:
- name: Rickettsial PCR on eschar specimens
  description: >-
    PCR on an unroofed eschar swab or biopsy can detect spotted-fever-group
    rickettsial DNA during early eschar-associated illness.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    A positive PCR from an eschar swab or biopsy supports early molecular
    confirmation of spotted-fever-group rickettsiosis.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eschar Swab of unroofed eschar SFG rickettsiae PCR Swab is less invasive
      than skin biopsy. Assessment of swab might be less sensitive than
      evaluation of eschar biopsy and does not allow for culture or IHC.
    explanation: >-
      The CDC diagnostic table identifies unroofed eschar swabs as a specimen
      type for spotted-fever-group rickettsial PCR.

- name: Indirect immunofluorescence assay serology
  description: >-
    Paired acute and convalescent indirect immunofluorescence serology is the
    reference standard for retrospective confirmation, although acute sera can
    be negative and genus-level cross-reactivity prevents species assignment.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    A fourfold or greater rise in IgG antibody titer between acute and
    convalescent specimens confirms acute tick-borne rickettsial infection.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFA Antibodies are often absent during the first week of illness.
      Antibodies are usually specific to the genus rather than the species of
      pathogen. Confirmation requires a fourfold or greater increase in titer
      between acute and convalescent serum specimens
    explanation: >-
      The CDC diagnostic table describes the timing and fourfold-titer-rise
      interpretation of IFA serology for tick-borne rickettsial disease.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line empiric therapy for suspected tick-borne
    rickettsial disease, including Siberian tick typhus, because it inhibits the
    rickettsial 30S ribosomal subunit and reaches the host-cell cytosol where
    R. sibirica resides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Doxycycline blocks rickettsial protein synthesis at the 30S ribosomal subunit.
  - target: Intracytosolic Rickettsia sibirica Niche
    treatment_effect: BYPASSES
    description: Doxycycline can reach the cytosolic rickettsial compartment.
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses,
      and Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne
      rickettsial diseases in patients of all ages, including children aged <8
      years, and should be initiated immediately in persons with signs and
      symptoms suggestive of rickettsial disease
    explanation: >-
      Siberian tick typhus is a tick-borne rickettsial disease, so this CDC
      first-line treatment recommendation covers empiric therapy for suspected
      Siberian tick typhus.

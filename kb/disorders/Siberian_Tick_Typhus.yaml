name: Siberian Tick Typhus
creation_date: "2026-09-25T12:57:17Z"
updated_date: "2026-09-25T12:57:17Z"
category: Infectious Disease
description: >-
  Siberian tick typhus, also called North Asian tick typhus, is an acute
  tick-borne spotted-fever-group rickettsiosis caused by Rickettsia sibirica
  subsp. sibirica in northern Asia. Dermacentor ticks maintain the organism in
  enzootic foci and inoculate rickettsiae into skin, where early infection of
  mononuclear phagocytes creates an eschar and regional lymphadenopathy before
  hematogenous spread reaches the microvascular endothelium. The resulting
  rickettsial vasculitis accounts for the fever and maculopapular rash that
  characterize this usually mild spotted-fever-group disease.

genetic:
- name: HDAC4
  gene_term:
    preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    Heterozygous de novo missense variants clustered in the conserved 14-3-3
    binding motif (residues 242-248) of HDAC4 cause NEDCHF. Four distinct
    substitutions have been reported across seven unrelated probands; the
    recurrence of independent de novo variants at one functional motif is the
    principal genetic evidence for causality. HDAC4 is intolerant to loss of
    function (gnomAD pLI = 1), but the NEDCHF variants are proposed to act by
    gain of function rather than haploinsufficiency, and no missense variant at
    any position in this motif was observed in gnomAD.
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the observation of four different missense variants, all of
      which affect the same functional motif in HDAC4 and arose de novo in seven
      unrelated individuals, provides very strong genetic evidence that these
      variants are indeed causative for the phenotype observed.
    explanation: The authors' own statement of the gene-disease causality argument.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All residues within this motif are highly conserved (Figure 1B), and no
      missense variants have been observed at any of these positions in the
      gnomAD database.
    explanation: >-
      Population-database absence at the affected motif positions supports
      pathogenicity of the variant class.
variants:
- name: HDAC4 c.731C>A p.(Thr244Lys)
  description: >-
    De novo missense substitution at the -2 position relative to the
    phosphoacceptor Ser246. Reported in one individual (ClinVar SCV001427055).
    Co-immunoprecipitation showed approximately two-fold reduced binding to
    14-3-3 beta relative to wild-type HDAC4.
  gene:
    preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the variants in all seven individuals impair 14-3-3
      binding (as confirmed for the first two variants by immunoprecipitation
      assays), thereby identifying deregulation of HDAC4 as a pathological
      mechanism in a previously uncharacterized developmental disorder.
    explanation: >-
      p.Thr244Lys is one of the two variants for which reduced 14-3-3 binding
      was confirmed experimentally.
- name: HDAC4 c.740A>G p.(Glu247Gly)
  description: >-
    De novo missense substitution at the +1 position relative to Ser246, where
    glycine is not tolerated in known 14-3-3 binding sites. Reported in one
    individual (DECIPHER 300920). Co-immunoprecipitation showed approximately
    two-fold reduced binding to 14-3-3 beta and increased generation of
    C-terminally truncated HDAC4 fragments.
  gene:
    preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the variants in all seven individuals impair 14-3-3
      binding (as confirmed for the first two variants by immunoprecipitation
      assays), thereby identifying deregulation of HDAC4 as a pathological
      mechanism in a previously uncharacterized developmental disorder.
    explanation: >-
      p.Glu247Gly is the variant with the most extensive experimental support

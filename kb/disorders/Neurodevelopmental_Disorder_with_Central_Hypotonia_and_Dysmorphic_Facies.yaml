name: Neurodevelopmental Disorder with Central Hypotonia and Dysmorphic Facies
creation_date: '2026-08-15T00:00:00Z'
category: Mendelian
synonyms:
- NEDCHF
- HDAC4-related neurodevelopmental disorder
- HDAC4 14-3-3 binding site missense syndrome
description: >-
  Neurodevelopmental disorder with central hypotonia and dysmorphic facies
  (NEDCHF; OMIM:619797) is an autosomal dominant developmental disorder caused
  by de novo heterozygous missense variants that cluster in the conserved
  14-3-3 binding motif spanning residues 242-248 of HDAC4, a class IIa histone
  deacetylase that functions as a signal-responsive transcriptional
  co-repressor. Affected individuals have global developmental delay with
  significant intellectual disability, universal central hypotonia,
  medication-resistant seizures in a subset, a distinctive facial appearance
  (hypertelorism, full lower lip, long palpebral fissures, frontal upsweep of
  hair, widely spaced teeth, large ears), kyphoscoliosis, hip
  dislocation/subluxation, delayed closure of the anterior fontanelle, feeding
  difficulties with drooling, and non-specific brain MRI abnormalities.
  Mechanistically, the variants reduce phosphorylation-dependent 14-3-3 binding
  and therefore cytoplasmic sequestration of HDAC4, and are proposed to act by
  gain of function through increased nuclear HDAC4 co-repressor activity. This
  makes NEDCHF mechanistically distinct from HDAC4 haploinsufficiency and from
  2q37 deletion (brachydactyly-mental retardation) syndrome, and the two should
  not be grouped: no individual with NEDCHF has had brachydactyly type E,
  autism, or obesity.

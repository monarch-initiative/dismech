    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report seven unrelated individuals with a phenotype distinct from
      that of BDMR, all of whom have heterozygous de novo missense variants that
      affect a major regulatory site of HDAC4, required for signal-dependent
      14-3-3 binding and nucleocytoplasmic shuttling.
    explanation: >-
      The de novo, unrelated occurrence in all seven probands is the basis for
      the recurrence-risk counseling message.
animal_models:
- name: HDAC4-overexpressing proliferating mouse chondrocytes
  species: Mouse
  genotype: HDAC4 overexpression in proliferating chondrocytes
  genes:
  - preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  description: >-
    Overexpression of HDAC4 in proliferating mouse chondrocytes inhibits their
    differentiation, phenocopying Runx2 loss of function. This is the only
    experimental system that supports the RUNX2 arm of the MEF2C/RUNX2 node
    curated in this entry. It is reported here as cited by the NEDCHF discovery
    paper (Vega et al., reference 11 of PMID:33537682); no animal carrying an
    HDAC4 14-3-3-motif missense variant has been described.
  modeled_mechanisms:
  - target: MEF2C and RUNX2 Target Transcriptional Dysregulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Demonstrates that excess HDAC4 in a RUNX2-dependent cell type produces a
      Runx2-loss-of-function-like phenotype, which is the experimental basis for
      the RUNX2 arm of this node. The MEF2C arm and any neural consequence are
      not addressed by this model.
    limitations: >-
      Supraphysiological overexpression of wild-type HDAC4 in mouse
      chondrocytes, not a knock-in of a human 14-3-3-motif variant: it models
      increased HDAC4 dosage rather than impaired 14-3-3 sequestration, covers
      only the skeletal (RUNX2) arm, and says nothing about neuronal MEF2C
      targets or the human craniofacial phenotype. It is also cited secondhand
      through the NEDCHF discovery paper rather than curated from the primary
      chondrocyte report.
    readouts:
    - name: Chondrocyte differentiation under HDAC4 overexpression
      target: MEF2C and RUNX2 Target Transcriptional Dysregulation
      description: >-
        Differentiation of proliferating mouse chondrocytes overexpressing
        HDAC4, compared against the Runx2 loss-of-function phenotype.
      direction: DECREASED
      interpretation: >-
        Inhibited chondrocyte differentiation resembling Runx2 loss of function
        is the model's phenotypic correlate of reduced RUNX2 output at this
        node.
      evidence:
      - reference: PMID:33537682
        reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          overexpression of HDAC4 in proliferating mouse chondrocytes inhibited
          their differentiation, thus resembling the effects of Runx2 loss of
          function
        explanation: >-
          Reports the differentiation readout and its equivalence to Runx2 loss
          of function.
    evidence:
    - reference: PMID:33537682
      reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In support of this, Vega et al.11 have previously noted that
        overexpression of HDAC4 in proliferating mouse chondrocytes inhibited
        their differentiation, thus resembling the effects of Runx2 loss of
        function.
      explanation: >-
        The NEDCHF authors invoke this model as the support for the RUNX2 arm of
        the node, which is why it is treated as informative here.
- name: HDAC4 3SA constitutive-nuclear mutant mouse (could not be generated)
  species: Mouse
  genotype: >-
    Hdac4 3SA constitutive-nuclear mutant (Ser246, Ser467 and Ser632 of the
    three major 14-3-3 sites mutated to alanine)
  genes:
  - preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  description: >-
    The one whole-organism test of constitutively nuclear HDAC4 that has been
    attempted. Mice carrying the 3SA mutant, in which all three major 14-3-3
    sites are mutated to alanine, could not be generated, which the NEDCHF
    authors read as circumstantial evidence that substantial increases in
    nuclear HDAC4 activity are incompatible with life. Curated as a model
    because the negative result bounds the increased-nuclear-HDAC4 node rather
    than testing it.
  modeled_mechanisms:
  - target: Increased Nuclear HDAC4 Co-repressor Activity
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The intended in vivo model of constitutively nuclear HDAC4 could not be
      established, so this node has no organism-level test. The failure is
      itself informative: it suggests that a large, unrestrained increase in
      nuclear HDAC4 is lethal, whereas the NEDCHF variants produce only a
      partial reduction of 14-3-3 binding at a single site.
    limitations: >-
      No viable animal was obtained, so nothing was measured - the model
      provides no data on nuclear HDAC4 levels, MEF2C or RUNX2 target
      transcription, or phenotype. It also over-models the human lesion:
      abolishing all three 14-3-3 sites is far more severe than the
      approximately two-fold reduction in binding at one site measured for the
      patient variants, so its inviability cannot be read as evidence against
      the human mechanism, only as a constraint on how large the effect can be.
    evidence:
    - reference: PMID:33537682
      reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        attempts to generate mice carrying the constitutive nuclear 3SA mutant
        of HDAC4, in which the serine residues of the three major 14-3-3 sites
        (Ser246, Ser467, and Ser632) were mutated to alanine, were unsuccessful
      explanation: >-
        Reports the failed attempt to generate the constitutively nuclear mouse,
        the negative result this link records.
  notes: >-
    Structural anchor for the nedchf_gain_of_function_unproven knowledge gap:
    the absence of any viable in vivo model of increased nuclear HDAC4 is a
    principal reason the gain-of-function step of the mechanism remains
    untested.
experimental_models:
- name: HEK293 HDAC4 / 14-3-3 beta co-immunoprecipitation assay
  description: >-
    Transient co-expression of FLAG-tagged wild-type or variant HDAC4 with
    HA-tagged 14-3-3 beta in HEK293 cells, followed by anti-FLAG
    co-immunoprecipitation and densitometric quantification of bound 14-3-3
    beta on western blots. Only the p.Thr244Lys and p.Glu247Gly alleles were
    assayed; the two Pro248 substitutions, carried by five of the seven reported
    individuals, rest on in silico prediction alone. This assay is the only
    direct functional experiment underpinning the gain-of-function chain curated
    in this entry.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    Immortalized human embryonic kidney cell line (HEK293), transiently
    transfected with epitope-tagged expression plasmids.
  culture_system: >-
    Two-dimensional monolayer culture; extracts harvested approximately 48 h
    after transfection for co-immunoprecipitation.
  conditions:
  - Wild-type FLAG-HDAC4 co-expressed with HA-tagged 14-3-3 beta
  - FLAG-HDAC4 p.Thr244Lys co-expressed with HA-tagged 14-3-3 beta
  - FLAG-HDAC4 p.Glu247Gly co-expressed with HA-tagged 14-3-3 beta
  publication: PMID:33537682
  modeled_mechanisms:
  - target: Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Directly assays the binding step asserted by this node - the affinity of
      the variant RKTApSEP motif for 14-3-3 - for two of the four reported
      variants.
    limitations: >-
      Transformed kidney-derived cells with transient overexpression of tagged
      proteins do not model developing neurons, chondrocytes, or any
      organism-level phenotype, and the kinase/phosphatase context that sets
      Ser246 phosphorylation in patient tissue may differ. Two of the four
      variants, including the recurrent p.Pro248Leu allele, were never assayed.
      The assay measures binding only: the nuclear-to-cytoplasmic distribution
      of endogenous HDAC4 was not determined, so the loss of cytoplasmic
      sequestration remains inferred rather than measured.
    readouts:
    - name: Variant HDAC4 binding to 14-3-3 beta
      target: Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration
      description: >-
        Anti-FLAG co-immunoprecipitated HA-tagged 14-3-3 beta, quantified by
        western blot densitometry relative to HDAC4 and 14-3-3 beta loading
        controls, for variant versus native HDAC4.
      direction: DECREASED
      interpretation: >-
        An approximately two-fold reduction in 14-3-3 binding for both assayed
        variants is the measured basis for this node; the authors themselves
        describe the effect as only partial, which is why the downstream nuclear
        gain-of-function node is marked provisional.
      evidence:
      - reference: PMID:33537682
        reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Co-immunoprecipitation assays carried out on cell extracts indicated
          that both the p.Glu247Gly and p.Thr244Lys variants bound 14-3-3β
          with approximately two-fold reduced affinity compared to native HDAC4
        explanation: Reports the measured binding reduction behind this readout.
    evidence:
    - reference: PMID:33537682
      reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        To test the effects predicted in silico on the binding of 14-3-3, we
        co-expressed 14-3-3β with either native or variant HDAC4 in HEK293
        cells.
      explanation: >-
        States that the assay was built to test the 14-3-3-binding step, which
        is why this cell model is treated as informative for this node.
discussions:
- discussion_id: nedchf_gain_of_function_unproven
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does reduced 14-3-3 binding by the HDAC4 residue 242-248 missense variants
    actually increase the nuclear pool and repressive activity of HDAC4 in
    patient-relevant neural cells, and does this reduce MEF2C- and
    RUNX2-dependent transcription?
  attaches_to:
  - pathophysiology#Increased Nuclear HDAC4 Co-repressor Activity
  - pathophysiology#MEF2C and RUNX2 Target Transcriptional Dysregulation
  rationale: >-
    The gain-of-function model rests on a two-fold reduction of 14-3-3 binding
    measured for two of four variants by co-immunoprecipitation of overexpressed
    tagged proteins in HEK293 cells, plus in silico prediction for the remaining
    variants. Subcellular localization of endogenous variant HDAC4 has not been
    measured, nor has downstream MEF2C/RUNX2 target transcription. The authors
    explicitly note that the effect on 14-3-3 binding was only partial and that
    this step remains to be determined. This is the load-bearing mechanistic
    claim that separates the entity from HDAC4 haploinsufficiency, so it is the
    highest-value gap to close.
  proposed_experiments:
  - experiment_id: nedchf_exp_endogenous_localization
    name: Endogenous HDAC4 localization in patient-derived cells
    description: >-
      Quantify nuclear versus cytoplasmic endogenous HDAC4 in patient-derived
      fibroblasts and iPSC-derived neurons carrying each variant, using
      subcellular fractionation with immunoblot and quantitative
      immunofluorescence.
    decision_criterion: >-
      A statistically significant increase in the nuclear:cytoplasmic HDAC4
      ratio in variant cells relative to isogenic or parental controls.
    would_support:
    - pathophysiology#Increased Nuclear HDAC4 Co-repressor Activity
    would_refute:
    - pathophysiology#Increased Nuclear HDAC4 Co-repressor Activity
  - experiment_id: nedchf_exp_target_rnaseq
    name: Transcriptomic test of MEF2C and RUNX2 target repression
    description: >-
      Perform RNA-seq on isogenic knock-in neurons carrying p.Pro248Leu versus
      wild-type and test for coordinate down-regulation of curated MEF2C and
      RUNX2 target gene sets.
    decision_criterion: >-
      Significant coordinate down-regulation of MEF2C and RUNX2 target gene sets
      in variant neurons.
    would_support:
    - pathophysiology#MEF2C and RUNX2 Target Transcriptional Dysregulation
    would_refute:
    - pathophysiology#MEF2C and RUNX2 Target Transcriptional Dysregulation
  - experiment_id: nedchf_exp_mef2_occupancy
    name: MEF2 occupancy and reporter activity in variant neurons
    description: >-
      Measure MEF2-responsive reporter activity and MEF2C genomic occupancy by
      CUT&RUN or ChIP in variant versus wild-type neurons.
    would_support:
    - pathophysiology#MEF2C and RUNX2 Target Transcriptional Dysregulation
  - experiment_id: nedchf_exp_fragmentation
    name: Contribution of HDAC4 fragmentation to MEF2C repression
    description: >-
      Test whether the increased C-terminal fragmentation observed for
      p.Glu247Gly contributes independently to MEF2C repression, using
      cleavage-resistant HDAC4 constructs.
    would_support:
    - pathophysiology#Impaired Neuronal Plasticity Gene Expression
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We note that the effect of the variants on 14-3-3 binding was only
      partial, suggesting that any increase in nuclear HDAC4 activity might be
      limited.
    explanation: The authors' own caveat defining the gap.
- discussion_id: nedchf_clinical_spectrum_undefined
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the full clinical spectrum, natural history and genotype-phenotype
    correlation of HDAC4 14-3-3-site missense variants beyond the seven
    originally reported individuals?
  attaches_to:
  - pathophysiology#Neurodevelopmental and Craniofacial-Skeletal Phenotype
  rationale: >-
    The entity is defined by a single seven-person cohort aged 2-20 years.
    Frequencies curated here are small-denominator estimates, adult outcomes are
    unknown, and whether the four substitutions differ in severity cannot be
    assessed. The authors call for additional cases specifically to enable
    genotype-phenotype correlation.
  proposed_experiments:
  - experiment_id: nedchf_exp_international_cohort
    name: International HDAC4 motif-variant cohort
    description: >-
      Assemble an international cohort through GeneMatcher and DECIPHER of
      additional individuals with variants in HDAC4 residues 242-248 and collect
      standardized HPO-coded deep phenotyping.
    would_support:
    - pathophysiology#Neurodevelopmental and Craniofacial-Skeletal Phenotype
  - experiment_id: nedchf_exp_genotype_phenotype
    name: Genotype-phenotype comparison across the four substitutions
    description: >-
      Compare phenotype severity between the recurrent p.Pro248Leu allele and
      the non-Pro248 substitutions in the expanded cohort.
    would_support:
    - pathophysiology#HDAC4 14-3-3 Binding Site Missense Variant
  - experiment_id: nedchf_exp_natural_history
    name: Longitudinal natural-history follow-up
    description: >-
      Follow affected individuals into adulthood for seizure course, scoliosis
      progression, feeding status and cognitive/communication outcome.
    would_support:
    - pathophysiology#Neurodevelopmental and Craniofacial-Skeletal Phenotype
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of additional individuals with variants within this region
      of HDAC4 will enable further genotype-phenotype correlation and
      understanding of the clinical spectrum in similar individuals.
    explanation: The authors explicitly state this as the open question.
- discussion_id: nedchf_hdac_inhibitor_feasibility
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If NEDCHF is a gain-of-function disorder, could a class IIa- or
    HDAC4-selective inhibitor (or a disruptor of the HDAC4-MEF2 interaction) be
    therapeutic, and is there a developmental window in which it could work?
  attaches_to:
  - pathophysiology#Increased Nuclear HDAC4 Co-repressor Activity
  rationale: >-
    A gain-of-function mechanism nominally suggests pharmacological inhibition.
    The discovery authors raise this explicitly but caution both that class IIa
    HDACs respond poorly to available pan-HDAC inhibitors, because of their low
    intrinsic deacetylase activity, and that a large part of the phenotype is
    developmental and may not be reversible postnatally. Because vertebrate
    HDAC4 represses through protein-protein interaction rather than catalysis,
    catalytic-site inhibition may also be the wrong target; disrupting the
    HDAC4-MEF2 interaction is an alternative. This is preclinical rationale and
    is deliberately not curated as a treatment.
  proposed_experiments:
  - experiment_id: nedchf_exp_selective_inhibitor_rescue
    name: HDAC4-selective inhibitor rescue in variant neurons
    description: >-
      Test whether HDAC4-selective inhibitors or HDAC4-MEF2 interaction
      disruptors restore MEF2 target gene expression in patient-variant neurons,
      and whether restoration depends on the developmental stage at which the
      compound is applied.
    would_support:
    - pathophysiology#Increased Nuclear HDAC4 Co-repressor Activity
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gain-of-function variants in HDAC4 raise the possibility of therapeutic
      intervention by use of HDAC inhibitors, although whether such treatment
      could halt or reverse developmental problems is open to question.
    explanation: >-
      The authors raise HDAC inhibition as a theoretical strategy while flagging
      its uncertainty.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While a number of HDAC inhibitors are available for pharmacological use,
      class IIa HDACs are in fact poor responders to these drugs due to the lower
      deacetylase activity of these enzymes compared to other HDACs.
    explanation: >-
      Explains why available pan-HDAC inhibitors are unlikely to be useful and
      why class IIa- or HDAC4-selective agents would be needed.
notes: >-
  Scope boundary: this entry covers only the de novo missense variants in the
  HDAC4 14-3-3 binding motif (residues 242-248). HDAC4 loss of function
  (truncating variants, whole-gene deletion, 2q37 contiguous-gene deletion) is
  curated separately under 2q37 Microdeletion Syndrome and must not be merged
  with this entry; the two have opposite proposed directions of effect on HDAC4
  activity.

  Other HDAC4 loss-of-function reports, including a de novo frameshift
  (p.Gln1046AspfsTer29) associated with Lennox-Gastaut syndrome and
  polymicrogyria-like cortical malformation (PMID:40167013), belong to the
  loss-of-function arm and are deliberately not used as evidence here.

  No GeneReviews chapter exists for this disorder. A PubMed search for "HDAC4
  GeneReviews[All Fields]" returns only the retired 2q37 microdeletion syndrome
  chapter (PMID:20301337), which describes the deletion/loss-of-function entity
  rather than NEDCHF, and is therefore not used as a phenotype baseline for this
  entry.

  Frequency values are derived from the denominator of seven reported
  individuals and should be treated as provisional small-cohort estimates.

  Named-entity-confusion preflight: MONDO:0859232 was verified with OAK to carry
  xref OMIM:619797 and relationship RO:0004003 to HGNC:14063 (HDAC4), matching
  the gene and OMIM identity asserted throughout this entry. The falcon
  deep-research report was additionally checked with `just preflight-dr` and
  passed (HDAC4 mentioned 47 times, top gene; OMIM 619797 present).

  Treatment-term ontology: MAXO was removed from dismech and every former MAXO
  treatment term was remapped to its NCIT equivalent, so the schema's
  `TreatmentActionTerm` dynamic enum is reachable only from NCIT:C25218
  (Clinical Intervention or Procedure). All treatments here therefore use NCIT
  action terms (NCIT:C64172 Anticonvulsant Therapy, NCIT:C15447 Dietary
  Intervention, NCIT:C52006 Gastrostomy, NCIT:C15302 Physical Therapy,
  NCIT:C16186 Orthopedic Surgical Procedure, NCIT:C15240 Genetic Counseling).

  Model systems: the three systems relevant to this disorder are curated as
  first-class models linked to the pathograph rather than left as evidence
  items - the HEK293 co-immunoprecipitation assay (the only direct functional
  experiment, MEASURES the 14-3-3-binding node), HDAC4 overexpression in
  proliferating mouse chondrocytes (PARTIALLY_RECAPITULATES the RUNX2 arm), and
  the 3SA constitutive-nuclear mouse that could not be generated
  (FAILS_TO_RECAPITULATE, the negative in vivo result behind the
  gain-of-function knowledge gap). No patient-derived cell line, iPSC model or
  variant knock-in animal has been reported.

  Ontology-term caution: the falcon deep-research report suggested HP:0011443
  for central hypotonia and HP:0000639 for long palpebral fissure. Both were
  rejected after OAK verification (HP:0011398 Central hypotonia is obsolete and
  replaced by HP:0001252 Hypotonia; the correct long palpebral fissure term is
  HP:0000637). The verified terms are used here.

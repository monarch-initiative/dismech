inheritance:
- name: Autosomal dominant, de novo
  description: >-
    All reported individuals carry a heterozygous HDAC4 missense variant that
    arose de novo; no transmitted case has been described, and no recurrence in
    a sibship has been reported. Parental germline mosaicism has not been
    excluded, so empiric recurrence risk is low but not zero.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report seven unrelated individuals with a phenotype distinct from
      that of BDMR, all of whom have heterozygous de novo missense variants that
      affect a major regulatory site of HDAC4, required for signal-dependent
      14-3-3 binding and nucleocytoplasmic shuttling.
    explanation: >-
      Seven unrelated probands each carry a heterozygous de novo missense
      variant, establishing an autosomal dominant, de novo mode of inheritance.
- name: Typically de novo occurrence
  description: >-
    The recurrence of four different missense substitutions at the same
    functional motif across seven unrelated de novo cases is the principal
    genetic argument for causality.
  inheritance_term:
    preferred_term: typically de novo
    term:
      id: HP:0025352
      label: Typically de novo
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the observation of four different missense variants, all of
      which affect the same functional motif in HDAC4 and arose de novo in seven
      unrelated individuals, provides very strong genetic evidence that these
      variants are indeed causative for the phenotype observed.
    explanation: >-
      Explicit statement that all four variants arose de novo in seven unrelated
      individuals.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    All reported individuals were diagnosed by whole-exome sequencing performed
    for unexplained developmental delay or intellectual disability, either
    clinically or through the Deciphering Developmental Disorders study, with
    Sanger confirmation of the HDAC4 variant. Because the phenotype is not
    specific enough for targeted single-gene testing, broad sequencing with
    trio analysis (to establish de novo status) is the practical diagnostic
    route. Chromosomal microarray remains the appropriate test when the
    phenotype instead suggests a 2q37 deletion.
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals reported had been referred for investigation of
      developmental delay (DD) and/or ID of unknown cause and were each assessed
      clinically by at least one author.
    explanation: >-
      Ascertainment was through investigation of unexplained developmental
      delay/ID, i.e. broad sequencing rather than targeted testing.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals 1, 5, 6, and 7 were evaluated by clinical whole-exome
      sequencing as previously described.
    explanation: >-
      Documents clinical whole-exome sequencing as the diagnostic modality used
      for four of the seven probands.
differential_diagnoses:
- name: 2q37 microdeletion syndrome (brachydactyly-mental retardation syndrome)
  description: >-
    The other HDAC4-associated phenotype and the principal differential.
    Brachydactyly-mental retardation syndrome arises from HDAC4 loss of
    function, usually as part of a contiguous-gene deletion of chromosome 2q37,
    and is mechanistically distinct from NEDCHF - haploinsufficiency versus a
    proposed gain of function through increased nuclear HDAC4. The two should
    not be grouped as a single entity. The dismech entry for the deletion
    syndrome is 2q37 Microdeletion Syndrome.
  distinguishing_features:
  - "Brachydactyly type E is the hallmark of BDMR and is absent in every reported individual with NEDCHF."
  - "Autism spectrum disorder and obesity occur in BDMR but were not seen in NEDCHF."
  - "The BDMR facial gestalt (broad face, brachycephaly, broad upturned nose) differs from the NEDCHF gestalt (hypertelorism, full lower lip, long palpebral fissures, frontal upsweep, widely spaced teeth, large ears)."
  - "Swallowing difficulties/drooling, congenital hip dislocation, progressive kyphoscoliosis and delayed anterior fontanelle closure are seen in NEDCHF but are not typical of 2q37 deletion or HDAC4 loss of function."
  - "Developmental delay and intellectual disability are more severe in NEDCHF than in BDMR."
  - "The causal lesion differs - a 2q37 deletion or HDAC4 truncating/whole-gene loss-of-function allele versus a de novo missense variant restricted to the 14-3-3 binding motif at residues 242-248."
  disease_term:
    preferred_term: 2q37 microdeletion syndrome
    term:
      id: MONDO:0010886
      label: 2q37 microdeletion syndrome
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals shared facial dysmorphic features that were distinct from the
      broad face, brachycephaly, and broad, upturned nose described in BDMR.
      None of the individuals reported here had autism, obesity, or
      brachydactyly type E.
    explanation: >-
      Enumerates the clinical discriminators between NEDCHF and the BDMR / 2q37
      deletion phenotype.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As such, we propose that these variants result in a novel gain-of-function
      effect, leading to increased nuclear activity of HDAC4, and thus
      differentiating both the molecular mechanism and the outcome of these
      variants from that of previously reported loss-of-function alleles of
      HDAC4 that result in haploinsufficiency.
    explanation: >-
      States the mechanistic boundary - gain of function here versus
      haploinsufficiency in BDMR.
  - reference: PMID:20691407
    reference_title: Haploinsufficiency of HDAC4 causes brachydactyly mental retardation syndrome, with brachydactyly type E, developmental delays, and behavioral problems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BDMR presents with a range of features, including intellectual
      disabilities, developmental delays, behavioral abnormalities, sleep
      disturbance, craniofacial and skeletal abnormalities (including
      brachydactyly type E), and autism spectrum disorder.
    explanation: >-
      Defines the BDMR/HDAC4-haploinsufficiency phenotype against which NEDCHF
      is contrasted.
  notes: >-
    The 2q37 Microdeletion Syndrome entry in this knowledge base already records
    NEDCHF as a reciprocal differential and states that de novo HDAC4 missense
    variants affecting the 14-3-3-binding regulatory region should not be
    grouped with HDAC4 loss of function or 2q37 deletion. This entry honors that
    boundary.
- name: MEF2C haploinsufficiency syndrome
  description: >-
    MEF2C is a direct repression target of HDAC4, and MEF2C haploinsufficiency
    (MIM 613443) produces a partly overlapping picture of developmental delay,
    intellectual disability, stereotypic movements, epilepsy and variable brain
    MRI anomalies. The overlap is non-specific, and the craniofacial and
    skeletal features of NEDCHF are not part of the MEF2C phenotype.
  distinguishing_features:
  - "A 5q14.3 deletion or MEF2C loss-of-function variant is found rather than an HDAC4 14-3-3-site missense variant."
  - "The distinctive NEDCHF facial gestalt, kyphoscoliosis, hip dislocation and delayed fontanelle closure are not characteristic of MEF2C haploinsufficiency."
  disease_term:
    preferred_term: MEF2C haploinsufficiency syndrome
    term:
      id: MONDO:0013266
      label: neurodevelopmental disorder with hypotonia, stereotypic hand movements,
        and impaired language
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We noted some non-specific phenotypic overlap between our individuals and
      those with variants in MEF2C (MIM: 613443), including DD/ID, stereotypic
      movements, epilepsy, and variable MRI brain scan anomalies.
    explanation: >-
      The authors themselves identify MEF2C-related disorder as the overlapping
      differential, and characterize the overlap as non-specific.
- name: Cleidocranial dysplasia
  description: >-
    RUNX2 is the second direct repression target of HDAC4. Cleidocranial
    dysplasia (MIM 119600), caused by RUNX2 loss of function, shares delayed
    closure of the anterior fontanelle, dental anomalies, hypertelorism and hip
    joint defects with NEDCHF, but the widespread characteristic skeletal
    defects of cleidocranial dysplasia are largely absent in NEDCHF, and
    significant intellectual disability is not a feature of cleidocranial
    dysplasia.
  distinguishing_features:
  - "Clavicular hypoplasia/aplasia and supernumerary teeth are characteristic of cleidocranial dysplasia and are not reported in NEDCHF."
  - "Significant developmental delay and intellectual disability are universal in NEDCHF but not features of cleidocranial dysplasia."
  - "A RUNX2 loss-of-function allele is found rather than an HDAC4 14-3-3-site missense variant."
  disease_term:
    preferred_term: cleidocranial dysplasia
    term:
      id: MONDO:0007340
      label: cleidocranial dysplasia 1
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a feature of which is delayed closure of the anterior fontanelle, which
      was reported in two of the individuals described here.
    explanation: >-
      Identifies the shared feature and the reason cleidocranial dysplasia is a
      mechanistically motivated differential.
treatments:
- name: Antiseizure Pharmacotherapy
  description: >-
    Seizures in NEDCHF have been difficult to control. The index individual with
    infantile spasms continued to have medication-non-responsive seizures, and
    both individuals with mid-childhood generalized seizures remained difficult
    to control despite multiple anticonvulsants. No disorder-specific antiseizure
    strategy has been established; management is empiric and seizure-type
    directed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:

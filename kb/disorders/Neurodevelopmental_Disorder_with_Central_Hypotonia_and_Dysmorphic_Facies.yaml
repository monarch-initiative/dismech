  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HDAC4 has been shown to specifically repress the expression of genes
      required for synaptic function and neuronal plasticity, and this
      expression was reduced further by the constitutive nuclear 3SA mutant of
      HDAC4.
    explanation: >-
      Directly links a constitutively nuclear HDAC4 (the same directional change
      proposed for the patient variants) to reduced synaptic and plasticity gene
      expression.
  - reference: PMID:26074448
    reference_title: "The Class IIa histone deacetylase HDAC4 and neuronal function: Nuclear nuisance and cytoplasmic stalwart?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nuclear-restriction of HDAC4 results in down-regulation of
      plasticity-related genes and memory impairment.
    explanation: >-
      Review of the primary literature establishing that nuclear restriction of
      HDAC4 is deleterious for plasticity gene expression and memory.
  - reference: PMID:12641737
    reference_title: Neuronal activity-dependent nucleocytoplasmic shuttling of HDAC4 and HDAC5.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that, in cultured hippocampal neurones, the localization of HDAC4
      and HDAC5 is dynamic and signal-regulated.
    explanation: >-
      Shows that activity-dependent HDAC4 shuttling is a real feature of
      neurons, so a shuttling defect is neuronally relevant.
  downstream:
  - target: Neurodevelopmental and Craniofacial-Skeletal Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered activity-dependent synaptic gene programmes during development
    description: >-
      Suppressed plasticity gene expression in developing neurons is the
      proposed substrate for the intellectual disability, hypotonia and
      epilepsy.
- name: Neurodevelopmental and Craniofacial-Skeletal Phenotype
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical endpoint of the cascade: universal central hypotonia and
    developmental delay with significant intellectual disability, seizures in a
    subset, a recognizable facial gestalt, kyphoscoliosis and hip
    dislocation/subluxation, delayed closure of the anterior fontanelle, and
    non-specific brain MRI abnormalities. Notably absent are brachydactyly type
    E, autism and obesity, which are characteristic of the HDAC4
    loss-of-function / 2q37 deletion phenotype.
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This phenotype includes significant DD/ID, seizures, distinctive facial
      features, scoliosis, delayed closure of the anterior fontanelle, and
      non-specific brain MRI anomalies; thus, it is distinct from the BDMR
      phenotype previously reported in individuals carrying HDAC4
      loss-of-function alleles.
    explanation: >-
      Summarizes the clinical endpoint and its distinctness from the
      loss-of-function phenotype.

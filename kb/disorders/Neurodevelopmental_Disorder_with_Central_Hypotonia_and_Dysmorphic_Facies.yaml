- name: Genetic Counseling
  description: >-
    All reported variants arose de novo, so recurrence risk for the parents of
    an affected child is low, though germline mosaicism cannot be excluded.
    Counseling should distinguish this disorder from HDAC4 haploinsufficiency /
    2q37 deletion syndrome, which has a different mechanism, a different
    clinical course, and different recurrence considerations when a parental
    balanced rearrangement is present.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

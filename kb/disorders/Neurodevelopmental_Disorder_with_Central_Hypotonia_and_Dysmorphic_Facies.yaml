pathophysiology:
- name: HDAC4 14-3-3 Binding Site Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    De novo heterozygous missense substitutions cluster in the RKTApSEP motif
    spanning residues 242-248 of HDAC4, the first and most important of the
    three 14-3-3 binding sites in the protein and the only one invariant from
    human to fruit fly. Reported substitutions are p.Thr244Lys, p.Glu247Gly,
    p.Pro248Ala and p.Pro248Leu; Pro248, the +2 residue relative to the
    phosphoacceptor Ser246, is altered in five of seven individuals. The motif
    partially overlaps the HDAC4 nuclear localization signal (residues
    244-279).
  genes:
  - preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  molecular_functions:
  - preferred_term: 14-3-3 protein binding
    term:
      id: GO:0071889
      label: 14-3-3 protein binding
    modifier: DECREASED
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two individuals possess variants altering Thr244 or Glu247, whereas the
      remaining five all carry variants altering Pro248, a key residue for
      14-3-3 binding.
    explanation: >-
      Defines the variant spectrum and the clustering at the 14-3-3 binding
      motif.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nuclear activity of HDAC4 is regulated by the process of
      nucleocytoplasmic shuttling, which in turn is dependent on the
      phosphorylation-dependent binding of 14-3-3 proteins, which act to
      sequester HDAC4 in the cytoplasm; as such, HDAC4 serves as a transducer of
      upstream signaling events.
    explanation: >-
      Establishes why a variant in this motif is expected to deregulate HDAC4
      localization.
  downstream:
  - target: Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration
    causal_link_type: DIRECT
    description: >-
      The substitutions degrade the 14-3-3 consensus and/or reduce
      accessibility of Ser246 to its kinases (TAK1, MARK2), directly lowering
      14-3-3 affinity for the motif.
- name: Impaired 14-3-3 Binding and Loss of Cytoplasmic Sequestration
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Phosphorylation of Ser246 creates a 14-3-3 docking site; bound 14-3-3
    biases nucleocytoplasmic shuttling toward the cytoplasm by masking the
    overlapping nuclear localization signal and inhibiting nuclear import.
    Co-immunoprecipitation of FLAG-HDAC4 with HA-tagged 14-3-3 beta in HEK293
    cells showed that the p.Glu247Gly and p.Thr244Lys variants bind 14-3-3 with
    approximately two-fold reduced affinity relative to wild-type HDAC4. In
    silico analyses predicted reduced 14-3-3 binding for all four variants, with
    the strongest effect at Pro248.
  molecular_functions:
  - preferred_term: 14-3-3 protein binding
    term:
      id: GO:0071889
      label: 14-3-3 protein binding
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein export from nucleus
    term:
      id: GO:0006611
      label: protein export from nucleus
    modifier: DECREASED
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the variants in all seven individuals impair 14-3-3
      binding (as confirmed for the first two variants by immunoprecipitation
      assays), thereby identifying deregulation of HDAC4 as a pathological
      mechanism in a previously uncharacterized developmental disorder.
    explanation: >-
      Co-immunoprecipitation in transfected HEK293 cells directly demonstrates
      reduced 14-3-3 binding for two of the patient variants.
  - reference: PMID:18952052
    reference_title: 14-3-3 regulates the nuclear import of class IIa histone deacetylases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Phosphorylation-induced 14-3-3 binding biases the balance of
      nucleo-cytoplasmic shuttling toward the cytoplasm by inhibiting nuclear
      import.
    explanation: >-
      Independent cell-based work establishes that 14-3-3 binding restrains
      nuclear entry of class IIa HDACs, so losing it shifts HDAC4 into the
      nucleus.
  - reference: PMID:11470791
    reference_title: The modular nature of histone deacetylase HDAC4 confers phosphorylation-dependent intracellular trafficking.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      we reveal that HDAC4 contains a modular structure consisting of a
      C-terminal autonomous nuclear export domain, which, in conjunction with an
      internal regulatory domain responsive to calcium/calmodulin-dependent
      protein kinase IV (CaMKIV), determines its subcellular localization.
    explanation: >-
      Defines the modular trafficking architecture of HDAC4 in which the
      N-terminal regulatory region containing the 14-3-3 sites governs
      localization. Support is partial because this study argues the
      HDAC4:14-3-3 complex also acts within the nucleus, so the directionality
      of 14-3-3 control is not settled by a single model.
  downstream:
  - target: Increased Nuclear HDAC4 Co-repressor Activity
    causal_link_type: DIRECT
    description: >-
      Reduced cytoplasmic sequestration is predicted to raise the steady-state
      nuclear pool of HDAC4.
- name: Increased Nuclear HDAC4 Co-repressor Activity
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Vertebrate HDAC4 is catalytically inactive as a histone deacetylase in its
    own right and acts predominantly as a signal-dependent transcriptional
    co-repressor. An increased nuclear pool is therefore proposed to act as a
    gain of function, increasing repression of HDAC4-bound transcription
    factors. This is the mechanistic step that distinguishes NEDCHF from HDAC4
    haploinsufficiency; it is inferred from the binding data plus the known
    biology rather than measured directly in patient neurons, so the node is
    marked provisional.
  molecular_functions:
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
    modifier: INCREASED
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: INCREASED
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As such, we propose that these variants result in a novel gain-of-function
      effect, leading to increased nuclear activity of HDAC4, and thus
      differentiating both the molecular mechanism and the outcome of these
      variants from that of previously reported loss-of-function alleles of
      HDAC4 that result in haploinsufficiency.
    explanation: >-
      States the proposed gain-of-function mechanism and its explicit contrast
      with HDAC4 haploinsufficiency.
  - reference: PMID:26074448
    reference_title: "The Class IIa histone deacetylase HDAC4 and neuronal function: Nuclear nuisance and cytoplasmic stalwart?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the nucleus, HDAC4 is a repressor of transcriptional programmes,
      although vertebrate HDAC4 is itself catalytically inactive and repression
      is facilitated through direct inhibition of transcription factors such as
      MEF2.
    explanation: >-
      Establishes that nuclear HDAC4 represses transcription through direct
      transcription-factor inhibition rather than intrinsic deacetylase
      activity, which is why increased nuclear HDAC4 is a repressive gain of
      function.
  notes: >-
    The authors caution that the effect on 14-3-3 binding was only partial, so
    any increase in nuclear HDAC4 activity may be modest; they also note that
    mice carrying the constitutively nuclear 3SA HDAC4 mutant could not be
    generated, suggesting large increases may be lethal.
  downstream:
  - target: MEF2C and RUNX2 Target Transcriptional Dysregulation
    causal_link_type: DIRECT
    description: >-
      HDAC4 binds and represses MEF2C and RUNX2, so more nuclear HDAC4 is
      expected to reduce the transcriptional output of both factors.
- name: MEF2C and RUNX2 Target Transcriptional Dysregulation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    HDAC4 physically interacts with and represses myocyte enhancer factor 2C
    (MEF2C) and runt-related transcription factor 2 (RUNX2), both required for
    normal neural and skeletal development. Increased nuclear HDAC4 is
    therefore predicted to reduce MEF2C- and RUNX2-dependent transcription. The
    clinical picture is consistent with this: NEDCHF shares developmental
    delay, stereotypic movements, epilepsy and variable brain MRI anomalies
    with MEF2C haploinsufficiency, and shares delayed fontanelle closure,
    dental anomalies, hypertelorism and hip joint defects with RUNX2-related
    cleidocranial dysplasia. Whether reduced MEF2C/RUNX2 signalling actually
    occurs in patient tissue remains undetermined, and unique NEDCHF features
    suggest additional, unidentified downstream pathways.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:

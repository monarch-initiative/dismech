    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  genes:
  - preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  - preferred_term: RUNX2
    term:
      id: hgnc:10472
      label: RUNX2
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased nuclear activity of HDAC4 would be expected to result in reduced
      activity of RUNX2 and MEF2C.
    explanation: >-
      States the predicted transcription-factor consequence of increased nuclear
      HDAC4.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whether the decreased interaction with 14-3-3 does indeed lead to
      decreased RUNX2 and MEF2C signaling as a result of increased nuclear HDAC4
      activity remains to be determined
    explanation: >-
      The authors explicitly flag this step as unproven, which is why the node
      is marked hypothetical.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In support of this, Vega et al.11 have previously noted that
      overexpression of HDAC4 in proliferating mouse chondrocytes inhibited
      their differentiation, thus resembling the effects of Runx2 loss of
      function.
    explanation: >-
      Mouse chondrocyte data show that excess HDAC4 phenocopies Runx2 loss of
      function, supporting the RUNX2 arm of this node.
  - reference: PMID:12641737
    reference_title: Neuronal activity-dependent nucleocytoplasmic shuttling of HDAC4 and HDAC5.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The class II histone deacetylases, HDAC4 and HDAC5, directly bind to and
      repress myogenic transcription factors of the myocyte enhancer factor-2
      (MEF-2) family thereby inhibiting skeletal myogenesis.
    explanation: >-
      Independent evidence that HDAC4 directly binds and represses MEF2-family
      transcription factors.
  downstream:
  - target: Impaired Neuronal Plasticity Gene Expression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced MEF2-dependent transcription of synaptic genes
    description: >-
      MEF2 is a principal activity-dependent transcription factor in neurons;
      its repression by nuclear HDAC4 reduces expression of plasticity genes.
  - target: Neurodevelopmental and Craniofacial-Skeletal Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced RUNX2-dependent osteogenic transcription
    - as-yet-unidentified HDAC4 downstream pathways
    description: >-
      RUNX2 repression plausibly contributes to the delayed fontanelle closure,
      dental anomalies and hip joint defects, but unique NEDCHF features are not
      explained by RUNX2 or MEF2C loss alone.
- name: Impaired Neuronal Plasticity Gene Expression
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In neurons HDAC4 shuttles in response to synaptic activity and is normally
    predominantly cytoplasmic; nuclear restriction of HDAC4 down-regulates
    plasticity-related genes and impairs memory in model systems. A variant that
    biases HDAC4 toward the nucleus is therefore expected to suppress the
    activity-dependent synaptic gene programme in developing neurons. An
    additional, non-exclusive route proposed by the authors is increased
    repression of MEF2 by naturally occurring nuclear-retained HDAC4 cleavage
    fragments, which were more abundant for the patient variants and which
    repress MEF2C independently of deacetylase activity.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167

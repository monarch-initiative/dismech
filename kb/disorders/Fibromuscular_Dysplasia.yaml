name: Fibromuscular Dysplasia
creation_date: "2026-05-04T22:23:50Z"
description: >-
  Fibromuscular dysplasia is an idiopathic, systemic, non-inflammatory and
  non-atherosclerotic arterial disease that affects medium-sized muscular
  arteries. It is most often recognized in renal and cerebrovascular arteries
  and may cause focal or multifocal stenosis, hypertension, aneurysm,
  dissection, tortuosity, stroke, or myocardial infarction.
category: Complex
disease_term:
  preferred_term: fibromuscular dysplasia
  term:
    id: MONDO:0006761
    label: fibromuscular dysplasia
parents:
- Vascular disorder
synonyms:
- FMD
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: DOI:10.1038/s41467-021-26174-2
      reference_title: Genetic investigation of fibromuscular dysplasia identifies risk loci and shared genetics with common cardiovascular diseases
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fibromuscular dysplasia (FMD) is an arteriopathy associated with
        hypertension, stroke and myocardial infarction, affecting mostly women.
      explanation: >-
        Fibromuscular dysplasia is a primary systemic arteriopathy classified
        under cardiovascular disorders.
inheritance:
- name: Polygenic Inheritance
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    Fibromuscular dysplasia has a polygenic genetic architecture with SNP-based
    heritability driven by multiple common vascular susceptibility loci.
  evidence:
  - reference: DOI:10.1038/s41467-021-26174-2
    reference_title: Genetic investigation of fibromuscular dysplasia identifies risk loci and shared genetics with common cardiovascular diseases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find an estimate of SNP-based heritability compatible with FMD having a
      polygenic basis, and report four robustly associated loci (PHACTR1, LRP1,
      ATP2B1, and LIMA1).
    explanation: >-
      Genome-wide association meta-analysis in human FMD cohorts demonstrates a
      polygenic inheritance basis for FMD.
prevalence:

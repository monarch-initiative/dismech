    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: DOI:10.1093/cvr/cvab086
    reference_title: Current progress in clinical, molecular, and genetic aspects of adult fibromuscular dysplasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extensive studies have correlated the arterial lesions of FMD to histopathological findings of arterial fibrosis, cellular hyperplasia, and distortion of the abnormal architecture of the arterial wall.
    explanation: This review links FMD lesions to abnormal arterial wall structure and remodeling.
  downstream:
  - target: Arterial stenosis
    description: >-
      Arterial fibrosis, cellular hyperplasia, and medial remodeling directly
      produce focal or multifocal string-of-beads arterial stenosis.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.1093/cvr/cvab086
      reference_title: Current progress in clinical, molecular, and genetic aspects of adult fibromuscular dysplasia
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, in the absence of a string-of-beads or focal stenosis, these
        lesions do not suffice to establish the diagnosis.
      explanation: >-
        Establishes string-of-beads and focal arterial stenosis as the defining
        lesions of FMD arteriopathy.
  - target: Hypertension
    description: >-

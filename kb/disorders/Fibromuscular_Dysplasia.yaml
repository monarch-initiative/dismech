    renal arteries in kidney donor cohorts.
  evidence:
  - reference: DOI:10.1038/s41467-021-26174-2
    reference_title: Genetic investigation of fibromuscular dysplasia identifies risk loci and shared genetics with common cardiovascular diseases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on angiographic examination of renal arteries in kidney donor
      cohorts the estimated prevalence of FMD is ~3%
    explanation: >-
      Angiographic screening of kidney donor cohorts estimates FMD prevalence at
      approximately 3% (3,000 per 100,000).
has_subtypes:
- name: Multifocal
  display_name: Multifocal FMD
  description: >-
    Multifocal FMD is the most frequent angiographic subtype (70-80% of cases)
    and is characterized by multiple stenoses in the same artery producing a
    classic string-of-beads appearance.
  evidence:
  - reference: DOI:10.1038/s41467-021-26174-2
    reference_title: Genetic investigation of fibromuscular dysplasia identifies risk loci and shared genetics with common cardiovascular diseases
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The most frequent form of FMD is multifocal, which is characterized by
      multiple stenoses occurring in the same artery (so called “string of
      beads ” due to classic angiographic appearance), and accounts for 70 –
      80% of cases 4.
    explanation: >-
      Defines multifocal FMD as multiple stenoses in the same artery with a
      string-of-beads appearance accounting for 70-80% of cases.
  - reference: DOI:10.1093/cvr/cvab086
    reference_title: Current progress in clinical, molecular, and genetic aspects of adult fibromuscular dysplasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the absence of a string-of-beads or focal stenosis, these
      lesions do not suffice to establish the diagnosis.
    explanation: >-
      Identifies the string-of-beads angiographic pattern as one of the two
      diagnostic angiographic subtypes of FMD.
- name: Focal
  display_name: Focal FMD
  description: Focal FMD is characterized angiographically by focal arterial stenosis.
  evidence:
  - reference: DOI:10.1093/cvr/cvab086
    reference_title: Current progress in clinical, molecular, and genetic aspects of adult fibromuscular dysplasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in the absence of a string-of-beads or focal stenosis, these
      lesions do not suffice to establish the diagnosis.
    explanation: >-
      Identifies focal stenosis as one of the two diagnostic angiographic
      subtypes of FMD.
pathophysiology:
- name: Systemic non-atherosclerotic arteriopathy
  description: >-
    FMD involves abnormal arterial wall architecture in medium-sized muscular
    arteries, with fibrosis, cellular hyperplasia, and remodeling that can
    produce focal or multifocal stenoses and expanded vascular phenotypes such
    as aneurysm, dissection, and tortuosity.

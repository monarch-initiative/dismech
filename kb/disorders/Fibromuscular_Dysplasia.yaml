      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fibromuscular dysplasia (FMD) is an arteriopathy associated with
        hypertension, stroke and myocardial infarction, affecting mostly women.
      explanation: >-
        Links FMD arteriopathy to clinical hypertension.
  - target: Arterial aneurysm
    description: >-
      Abnormal arterial wall architecture in FMD is associated with arterial
      aneurysms.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.1093/cvr/cvab086
      reference_title: Current progress in clinical, molecular, and genetic aspects of adult fibromuscular dysplasia
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        More recently, the vascular phenotype of lesions associated with FMD has
        been expanded to include arterial aneurysms, dissections, and
        tortuosity.
      explanation: >-
        Supports arterial aneurysms as direct structural manifestations of FMD
        arteriopathy.
  - target: Arterial tortuosity
    description: >-

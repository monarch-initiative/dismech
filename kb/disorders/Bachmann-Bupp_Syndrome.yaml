genetic:
- name: ODC1
  gene_term:
    preferred_term: ODC1
    term:
      id: hgnc:8109
      label: ODC1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal dominant
    evidence:
    - reference: PMID:36007106
      reference_title: Bachmann-Bupp Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "BABS is expressed in an autosomal dominant manner and typically caused by a de novo ODC1 pathogenic variant."
      explanation: >-
        GeneReviews states both the dominant mode and the de novo origin.
  features: >-
    Heterozygous de novo variants at the 3-prime end of ODC1 produce a
    C-terminally truncated ornithine decarboxylase. The index allele is
    c.1342A>T, a nonsense variant removing the last 14 amino acids (p.Lys448Ter).
    Reported variants cluster in the last exon. Critically, the mechanism is
    GAIN of function through protein stabilisation, not loss of function: the
    truncated enzyme retains full catalytic activity and simply escapes
    degradation. Separate, rarer ODC1 loss-of-function alleles exist (for
    example the hypomorphic G84R missense variant, present in roughly 1 percent
    of South Asian individuals and reducing enzyme function 2.5-fold) and are
    associated with a different, non-BABS neurological picture; those must not
    be conflated with the BABS allele class.
  evidence:
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with
      developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ODC1 gene mutation (c.1342 A>T) was identified by whole-exome sequencing and confirmed by Sanger sequencing."
    explanation: >-
      Names the index allele and the method by which it was identified and
      confirmed.
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental
      disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging
      abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we present four patients with a distinct neurometabolic disorder associated with de novo heterozygous, gain-of-function variants in the ODC1 gene."
    explanation: >-
      Independent replication establishing the gene-disease relationship in four
      further patients with de novo gain-of-function alleles.
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous pathogenic variants in ODC1 that cause BABS are typically gain-of-function variants."
    explanation: >-
      GeneReviews states the direction of effect explicitly, which is the single
      most important fact to preserve when reading ODC1 literature.
  - reference: PMID:40382142
    reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome
      patient biological samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ODC1 gene mutations that are linked to BABS always produce C-terminally truncated versions of the enzyme ornithine decarboxylase (ODC)."
    explanation: >-
      States that C-terminal truncation is invariant across the BABS allele
      spectrum.
  - reference: PMID:33806076
    reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "An analysis of variants from ClinVar, Geno2MP, TOPMed, gnomAD, and COSMIC revealed an intellectual disability and seizure connected loss-of-function variant, ODC G84R (rs138359527, NC_000002.12:g.10444500C > T)."
    explanation: >-
      Marked PARTIAL and included deliberately as a contrast: this ODC1 allele is
      loss-of-function and is NOT a BABS allele, so it delimits the BABS allele
      class rather than supporting it.
  - reference: PMID:11533243
    reference_title: The ornithine decarboxylase gene is essential for cell survival
      during early murine development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "ODC-heterozygous mice were viable, normal, and fertile."
    explanation: >-
      Marked PARTIAL and included as the decisive direction-of-effect control:
      halving ODC gene dosage produces a normal mouse, so BABS cannot be a
      haploinsufficiency disorder. This is the strongest single argument against
      importing ODC1 knockout data as a model of the patient state.
  - reference: PMID:11533243
    reference_title: The ornithine decarboxylase gene is essential for cell survival
      during early murine development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, ODC plays an essential role in murine development, and proper homeostasis of polyamine pools appears to be required for cell survival prior to gastrulation."
    explanation: >-
      Marked PARTIAL: complete Odc1 ablation is embryonic lethal, which is a
      constraint on how far ODC can be inhibited therapeutically but is not
      evidence about the BABS allele itself.
treatments:
- name: Eflornithine (difluoromethylornithine, DFMO)
  description: >-
    Eflornithine is an irreversible ODC inhibitor and the mechanism-matched
    targeted therapy for BABS. It was repurposed from its existing indications
    (West African trypanosomiasis, paediatric neuroblastoma maintenance, and
    hirsutism) and first given to a BABS patient under a single-patient FDA
    Investigational New Drug application, 16 months after the syndrome was first
    published. The index regimen was an oral solution given by gastrostomy tube
    at 500 mg/m2 twice daily, escalated to 750 and then 1000 mg/m2 twice daily,
    alongside a low-polyamine diet. Reported outcomes include hair regrowth
    beginning with the eyebrows at one month, immediate cessation of follicular
    cyst formation, increased muscle bulk and tone, acquisition of head control,
    unsupported sitting and self-feeding, and normalisation of cerebral white
    matter signal with resolution of subependymal cysts on MRI. Eflornithine is
    not an FDA-approved treatment for BABS and remains a compassionate-use
    therapy. Paediatric dosing and safety were taken from the neuroblastoma
    maintenance literature rather than from any BABS trial.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eflornithine
      term:
        id: CHEBI:41948
        label: eflornithine
  target_mechanisms:
  - target: Elevated ODC Enzyme Activity
    treatment_effect: INHIBITS
    description: >-
      Eflornithine irreversibly inhibits ODC, so it suppresses the catalytic
      activity of the accumulated truncated enzyme rather than restoring its
      degradation.
    evidence:
    - reference: PMID:31249027
      reference_title: Biochemical features of primary cells from a pediatric patient
        with a gain-of-function ODC1 genetic mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Exposure of primary dermal fibroblasts to ODC inhibitor α-difluoromethylornithine (DFMO) reduced the ODC activity and putrescine to levels observed in controls without adversely affecting cell morphology or inducing cell death."
      explanation: >-
        Demonstrates in the patient's own cells that DFMO normalises the raised
        enzyme activity without cytotoxicity.
  - target: Putrescine Accumulation
    treatment_effect: INHIBITS
    description: >-
      Inhibiting the enzyme lowers the putrescine pool and its measurable
      acetylated derivative back toward the reference range.
    evidence:
    - reference: PMID:34282722
      reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function
        variant disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Eflornithine normalized polyamine levels without disrupting other pathways."
      explanation: >-
        In-patient confirmation that the drug corrects the polyamine
        disturbance selectively.
  - target: Hair Follicle Dysfunction with Bulge Stem Cell Recruitment
    treatment_effect: INHIBITS
    description: >-
      Suppressing follicular ODC activity restores hair growth, an effect first
      shown in the truncated-ODC mouse and then reproduced in patients.
    evidence:
    - reference: PMID:8618048
      reference_title: Modulation of murine hair follicle function by alterations in ornithine
        decarboxylase activity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "2-Difluoromethylornithine could also reactivate hair growth in animals with complete hair loss."
      explanation: >-
        The model result that motivated trying the drug in patients with
        established alopecia.
  evidence:
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function
      variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eflornithine normalized polyamine levels without disrupting other pathways. She demonstrated remarkable improvement in both neurological symptoms and cortical architecture. She gained fine motor skills with the capacity to feed herself and sit with support."
    explanation: >-
      The primary treated-patient report, giving biochemical, neurological and
      functional outcomes in the first patient treated.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function
      variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 4 years and 8 months, we started eflornithine (Sanofi Aventis) treatment with 500 mg/m2/dose bid twice daily via a gastrostomy tube along with a low polyamine diet on November 14, 2019, for 3 months, increasing to 750 mg/m2/dose twice daily, and a final increase to 1000 mg/m2/dose twice daily after 3.5 months."
    explanation: >-
      Documents the actual regimen, route and escalation schedule used in the
      index treated case.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function
      variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dosing was based on what had been demonstrated to be safe in pediatric patients in maintenance therapy for neuroblastoma treated with eflornithine (Saulnier Sholler et al., 2015)."
    explanation: >-

treatments:
- name: Eflornithine (difluoromethylornithine, DFMO)
  description: Eflornithine is an irreversible ODC inhibitor used experimentally for BABS. The index compassionate-use regimen began at 500 mg/m2 per dose twice daily by gastrostomy, escalating to 750 and then 1000 mg/m2 per dose twice daily with a concurrent low-polyamine diet. Hair regrowth, cessation of follicular cysts, biochemical normalization, and developmental gains were reported. The 2025 series described six treated individuals, five under US single-patient IND protocols and one outside the US. These uncontrolled observations do not establish efficacy for all manifestations or comparative benefit at different ages.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eflornithine
      term:
        id: CHEBI:41948
        label: eflornithine
  target_mechanisms:
  - target: Elevated ODC Enzyme Activity
    treatment_effect: INHIBITS
    description: Eflornithine irreversibly inhibits ODC, so it suppresses the catalytic activity of the accumulated truncated enzyme rather than restoring its degradation.
    evidence:
    - reference: PMID:31249027
      reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Exposure of primary dermal fibroblasts to ODC inhibitor α-difluoromethylornithine (DFMO) reduced the ODC activity and putrescine to levels observed in controls without adversely affecting cell morphology or inducing cell death.
      explanation: Demonstrates in the patient's own cells that DFMO normalises the raised enzyme activity without cytotoxicity.
  - target: Putrescine Accumulation
    treatment_effect: INHIBITS
    description: Inhibiting the enzyme lowers the putrescine pool and its measurable acetylated derivative back toward the reference range.
    evidence:
    - reference: PMID:34282722
      reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Eflornithine normalized polyamine levels without disrupting other pathways.
      explanation: In-patient confirmation that the drug corrects the polyamine disturbance selectively.
  - target: Hair Follicle Dysfunction
    treatment_effect: INHIBITS
    description: Suppressing follicular ODC activity restores hair growth, an effect first shown in the truncated-ODC mouse and then reproduced in patients.
    evidence:
    - reference: PMID:8618048
      reference_title: Modulation of murine hair follicle function by alterations in ornithine decarboxylase activity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 2-Difluoromethylornithine could also reactivate hair growth in animals with complete hair loss.
      explanation: The model result that motivated trying the drug in patients with established alopecia.
  evidence:
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eflornithine normalized polyamine levels without disrupting other pathways. She demonstrated remarkable improvement in both neurological symptoms and cortical architecture. She gained fine motor skills with the capacity to feed herself and sit with support.
    explanation: The primary treated-patient report, giving biochemical, neurological and functional outcomes in the first patient treated.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At age 4 years and 8 months, we started eflornithine (Sanofi Aventis) treatment with 500 mg/m2/dose bid twice daily via a gastrostomy tube along with a low polyamine diet on November 14, 2019, for 3 months, increasing to 750 mg/m2/dose twice daily, and a final increase to 1000 mg/m2/dose twice daily after 3.5 months.
    explanation: Documents the actual regimen, route and escalation schedule used in the index treated case.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
    supports: SUPPORT

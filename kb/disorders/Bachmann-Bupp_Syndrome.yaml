    evidence:
    - reference: PMID:36007106
      reference_title: Bachmann-Bupp Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: BABS is expressed in an autosomal dominant manner and typically caused by a de novo ODC1 pathogenic variant.
      explanation: GeneReviews states both the dominant mode and the de novo origin.
  features: 'Reported BABS alleles include nonsense, frameshift, and splice-site variants affecting the C-terminal region of ODC1. They produce a gain of function through protein stabilization with retained catalysis. The index allele is c.1342A>T (p.Lys448Ter). The recurrent splice acceptor c.1242-2A>G has been reported in three individuals. Other ODC1 findings require independent interpretation: the G84R hypomorphic variant has functional and association data, but causal segregation and in-vivo validation of a separate Mendelian disorder were not established in the cited study.'
  evidence:
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ODC1 gene mutation (c.1342 A>T) was identified by whole-exome sequencing and confirmed by Sanger sequencing.
    explanation: Names the index allele and the method by which it was identified and confirmed.
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this report, we present four patients with a distinct neurometabolic disorder associated with de novo heterozygous, gain-of-function variants in the ODC1 gene.
    explanation: Independent replication establishing the gene-disease relationship in four further patients with de novo gain-of-function alleles.
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous pathogenic variants in ODC1 that cause BABS are typically gain-of-function variants.
    explanation: GeneReviews states the direction of effect explicitly, which is the single most important fact to preserve when reading ODC1 literature.
  - reference: PMID:40382142
    reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome patient biological samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ODC1 gene mutations that are linked to BABS always produce C-terminally truncated versions of the enzyme ornithine decarboxylase (ODC).
    explanation: States that C-terminal truncation is invariant across the BABS allele spectrum.

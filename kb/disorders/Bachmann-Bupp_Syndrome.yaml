    snippet: The detailed protocols of this chapter provide step-by-step guidance detailing how to measure ODC activity and polyamines in human RBCs.
    explanation: Establishes the red blood cell assay as the standardised BABS monitoring method.
animal_models:
- species: Mus musculus
  genotype: K6/ODC transgenic
  category: Transgenic
  description: The K6/ODC mouse expresses a mouse ODC cDNA carrying a premature stop codon at position 427, driven by a bovine keratin 6 promoter, in outer root sheath keratinocytes of the hair follicle. The lesion is the same class as the human BABS allele - carboxyl truncation producing a stabilised, catalytically active enzyme - which is why this 1995-1996 model predicted the human syndrome. Mice have a normal first hair cycle, lose their hair completely from 2-3 weeks of age, and develop dermal follicular cysts. DFMO both prevents the hair loss and reactivates hair growth after complete loss. The model is skin-restricted, so it does not model the neurodevelopmental, growth or sensory features of BABS, and it also develops skin tumours, which has no established human BABS counterpart.
  evidence:
  - reference: PMID:8618048
    reference_title: Modulation of murine hair follicle function by alterations in ornithine decarboxylase activity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The ODC inhibitor 2-difluoromethylornithine could prevent hair loss and partially normalize skin histology if administered before the onset of ODC overexpression.
    explanation: Establishes the preventive arm of the DFMO effect in the model that motivated human treatment.
  - reference: PMID:41925768
    reference_title: 'The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Ornithine decarboxylase (ODC), a key regulating enzyme of polyamine biosynthesis, was constitutively expressed in the outer root sheath cells of hair follicles near the bulge stem cell niche using a keratin 6 promoter in K6/ODC mice.
    explanation: Defines the transgene construct and the targeted cell population.
  - reference: PMID:41925768
    reference_title: 'The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Remarkably, the heterozygous de novo mutation in the ODC gene of this patient and others subsequently identified as having the Bachmann-Bupp syndrome (BABS) introduces a stop codon in the ODC gene, leading to premature abrogation and deletion of the c-terminal 14 amino acids of the ODC protein, as was originally designed in the K6/ODC mouse to stabilize the ODC protein and lead to elevated ODC enzyme activity
    explanation: The review draws a mechanistic analogy between C-terminal truncations. The mouse p.427 stop and human p.Lys448Ter allele remove different lengths and are not identical variants.
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is the first human case confirming similar symptoms observed in a transgenic ODC1 mouse model first described over 20 years ago.
    explanation: The index human report explicitly frames itself as the human confirmation of the transgenic mouse phenotype.
  - reference: PMID:41925768
    reference_title: 'The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed.'
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Many tumors arising in K6/ODC transgenic mice are keratoacanthomas that originated from the follicular cysts in the dermis.
    explanation: 'Recorded as a model limitation: the model''s tumour phenotype is a property of the skin-targeted transgenic and has no established counterpart in reported BABS patients.'
  - reference: PMID:7671221
    reference_title: Increased frequency of spontaneous skin tumors in transgenic mice which overexpress ornithine decarboxylase.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Effects observed include development of dermal follicular cysts, excessive skin wrinkling, enhanced nail growth, alopecia, and spontaneous tumor development.
    explanation: The original description of the transgenic phenotype, three of whose four non-tumour elements (follicular cysts, nail growth, alopecia) were later recognised in BABS patients.
  name: Skin-restricted K6/ODC transgenic mouse
  modeled_mechanisms:
  - target: Hair Follicle Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    description: Postnatal hair loss and DFMO-induced regrowth reproduce the ectodermal phenotype.
    limitations: Skin-restricted transgene expression does not model the neural or systemic human phenotype.
    evidence:
    - reference: PMID:8618048
      reference_title: Modulation of murine hair follicle function by alterations in ornithine decarboxylase activity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mice that overexpress a mutated ornithine decarboxylase (ODC) transgene in outer root sheath keratinocytes of the hair follicle were used to study the role of this enzyme in regulating hair follicle structure and function.
      explanation: The promoter targets follicular keratinocytes.
- species: Mus musculus
  genotype: Odc1 knockout
  category: Knockout
  description: Constitutive Odc1 knockout is a mechanistic contrast to BABS gain of function. Homozygous embryos failed to develop after implantation; heterozygotes were described as viable, normal, and fertile in the original study. This experiment neither models the BABS allele nor establishes a human pharmacological safety threshold. In cultured null blastocysts the inner cell mass degenerated despite initially preserved mitotic-cell counts; this loss-of-function observation is not a demonstrated neural-proliferation defect in BABS.
  evidence:
  - reference: PMID:11533243
    reference_title: The ornithine decarboxylase gene is essential for cell survival during early murine development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: ODC-heterozygous mice were viable, normal, and fertile.
    explanation: Loss-of-function mouse evidence provides biological context; it is not evidence that a human BABS allele causes this phenotype or that a particular inhibitor dose is safe.
  - reference: PMID:11533243
    reference_title: The ornithine decarboxylase gene is essential for cell survival during early murine development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Embryonic day E3.5 ODC-deficient embryos were capable of uterine implantation and induced maternal decidualization yet failed to develop substantially thereafter.
    explanation: Loss-of-function mouse evidence provides biological context; it is not evidence that a human BABS allele causes this phenotype or that a particular inhibitor dose is safe.
  - reference: PMID:11533243
    reference_title: The ornithine decarboxylase gene is essential for cell survival during early murine development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: No striking differences were observed in any of the embryos analyzed, and ODC-deficient blastocysts (n = 3) contained similar numbers of mitotic cells as their wild-type littermates (Fig. 5A).
    explanation: Cultured/isolated blastocyst evidence distinguishes initial mitotic-cell counts from subsequent inner-cell-mass survival; it does not model BABS gain of function.
  name: Constitutive Odc1-null mouse as a loss-of-function contrast
discussions:
- discussion_id: babs_k6odc_model_scope_and_cancer_risk
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: The K6/ODC mouse reproduces the alopecia and follicular cysts of BABS and predicted the DFMO response, but it also develops skin tumours and is skin-restricted. Does whole-body expression of stabilised ODC in BABS patients carry a tumour risk, and does the absence of a whole-body model mean the neurodevelopmental arm of the disease has never been modelled?
  rationale: 'The only well-characterised animal model of this exact lesion targets the transgene to hair follicle keratinocytes. Its tumour phenotype has been interpreted as evidence that polyamine excess promotes tumorigenesis, and the index human cohort report raised cancer surveillance as a consideration on that basis. But no BABS patient tumour series exists, GeneReviews does not recommend tumour surveillance, and there is no whole-body C-terminally-truncated-ODC model in which the neurodevelopmental phenotype could be studied. The mismatch matters in both directions: it risks over-calling a cancer risk that has not been observed in patients, and it leaves the central neurodevelopmental mechanism without an in vivo model.'
  attaches_to:
  - pathophysiology#Dysregulated Neural Progenitor Proliferation
  proposed_experiments:
  - experiment_id: exp_babs_whole_body_truncation_knockin
    name: Whole-body or CNS-conditional Odc1 C-terminal truncation knock-in
    description: Generate a mouse carrying a knock-in of a human-equivalent C-terminally truncated Odc1 allele expressed ubiquitously or conditionally in neural lineages, rather than under a keratin 6 promoter, and characterise cortical progenitor proliferation, brain growth, white matter development and response to eflornithine started at different postnatal ages.
  - experiment_id: exp_babs_tumour_surveillance_registry
    name: Prospective tumour-surveillance registry across the BABS cohort
    description: Assemble a prospective, standardised tumour-surveillance registry across the international BABS cohort to establish whether the mouse skin-tumour phenotype has any human counterpart, and whether long-term eflornithine exposure modifies it.
  evidence:
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: As the ODC1 gene has been implicated in neoplasia, cancer surveillance may be important in this disorder.
    explanation: The index cohort raises cancer surveillance as a hypothesis, phrased as a possibility rather than a recommendation.
  - reference: PMID:41925768
    reference_title: 'The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, unlike the K6/ODC mouse where this mutation was directed to the skin, the ODC mutation is expressed in all tissues of BABS patients resulting in macrosomia, macrocephaly, neurodevelopmental delay, spasticity, hypotonia, delayed visual maturation, and sensorineural hearing loss
    explanation: States the exact scope difference between the model and the human disease.
    quote_role: REVIEW_SYNTHESIS
- discussion_id: babs_treatment_window_neonatal_initiation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does earlier initiation of eflornithine, for example in a neonate diagnosed before neurological damage accrues, change the neurodevelopmental trajectory of BABS?
  rationale: The index patient began eflornithine at 4 years 8 months. A later treatment review reports diagnosis and treatment across ages from the neonatal period to adulthood, so a blanket absence of neonatal treatment is outdated. Whether earlier initiation changes neurodevelopmental outcomes remains unresolved without comparable longitudinal assessments.
  attaches_to:
  - pathophysiology#Abnormal Brain Development
  proposed_experiments:
  - experiment_id: exp_babs_early_versus_late_initiation_cohort
    name: Natural-history cohort comparing early versus late eflornithine initiation
    description: Establish a prospective international natural-history cohort with standardised developmental assessment at fixed ages, then compare developmental trajectories, MRI findings and N-acetylputrescine normalisation between patients started on eflornithine before and after 12 months of age.
  evidence:
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This could be especially consequential if we could initiate therapy in a neonate diagnosed early before neurological damage occurs.
    explanation: The treating team states the open question directly.
  - reference: PMID:40167220
    reference_title: 'Repurposing With Purpose: Treatment of Bachmann-Bupp Syndrome With Eflornithine and Implications for Other Polyaminopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The age of diagnosis and the onset of treatment has also varied from the neonatal period to adulthood.
    explanation: The later review qualifies the original early-treatment question; it does not supply a controlled comparison of treatment windows.
differential_diagnoses:
- name: Alopecia-intellectual disability syndrome 4 (LSS-related)
  description: LSS-related alopecia-intellectual disability is a recessive neuroectodermal syndrome affecting cholesterol biosynthesis. The cited cohort had congenital alopecia, intellectual disability or developmental delay, frequent early-onset epilepsy, and additional skin findings. Timing of scalp hair loss can help distinguish it from the typical postnatal shedding in BABS, but molecular testing establishes the diagnosis.
  distinguishing_features:
  - Biallelic LSS variants and autosomal recessive inheritance, compared with heterozygous ODC1 gain-of-function variants in BABS.
  - Congenital alopecia in the cited LSS cohort, compared with typically postnatal scalp hair shedding in BABS.
  - Early-onset epilepsy and ichthyosis or erythroderma were common in the LSS cohort.
  - LSS affects cholesterol biosynthesis; the study does not establish a universal negative polyamine profile or a clinical contraindication to ODC inhibition.
  disease_term:
    preferred_term: Alopecia with intellectual disability syndrome 4
    term:
      id: MONDO:0030009
      label: alopecia-intellectual disability syndrome 4
  evidence:
  - reference: PMID:30723320
    reference_title: Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is a rare autosomal recessive condition characterized by hypotrichosis and intellectual disability (ID) or developmental delay (DD), frequently associated with early-onset epilepsy and other dermatological features.
    explanation: Gives the inheritance mode and the alopecia-plus-developmental-delay core that make this the closest non-polyaminopathy mimic of BABS.
  - reference: PMID:30723320
    reference_title: Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Total alopecia with sparse eyelashes and eyebrows was noted at birth in all affected individuals.
    explanation: Establishes the congenital timing of the alopecia, the discriminator against the non-congenital clump shedding of BABS.
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hair is typically present at birth but may be sparse and of an unexpected color with subsequent loss of hair in large clumps within the first few weeks of life.
    explanation: 'The BABS side of the same discriminator, stated by GeneReviews: hair is present at birth and lost afterwards.'
- name: Snyder-Robinson syndrome
  description: The first-described and best-known polyaminopathy, and the disorder whose prior research the BABS team explicitly credits with accelerating BABS from discovery to treatment. It shares intellectual disability and hypotonia with BABS, and its literature uses the same polyamine-pathway vocabulary, so mechanism sentences are easily misattributed between the two. It is separated from BABS by the affected enzyme (spermine synthase, several steps downstream of ODC), by the direction of effect (loss of function, not gain), and by X-linked hemizygous rather than autosomal dominant transmission. Alopecia is not its presenting feature.
  distinguishing_features:
  - Caused by SMS (spermine synthase), not ODC1
  - Loss-of-function with decreased or absent enzyme activity, the opposite direction of effect to the ODC1 gain of function in BABS
  - X-linked, affecting hemizygous males, rather than de novo autosomal dominant
  - Osteoporosis, kyphoscoliosis, unsteady gait and facial asymmetry dominate; the non-congenital clump alopecia and macrocephaly/macrosomia of BABS are not its core
  disease_term:
    preferred_term: Snyder-Robinson syndrome
    term:
      id: MONDO:0010664
      label: syndromic X-linked intellectual disability Snyder type
  evidence:
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Snyder-Robinson syndrome results from hemizygous loss-of-function variants in the spermine synthase (SMS) gene, resulting in decreased or complete loss of spermine synthase enzyme activity.
    explanation: Gives the gene, the zygosity and the direction of effect that separate Snyder-Robinson syndrome from BABS.
  - reference: PMID:37092498
    reference_title: Two New Cases of Bachmann-Bupp Syndrome Identified through the International Center for Polyamine Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recent identification of four additional polyaminopathies, including Bachmann-Bupp syndrome, have benefited from previous research on Snyder-Robinson syndrome in order to advance from research to treatment more quickly.
    explanation: Documents the direct research lineage between the two disorders, which is precisely why their literatures are intertwined and confusable.
  - reference: PMID:40167220
    reference_title: 'Repurposing With Purpose: Treatment of Bachmann-Bupp Syndrome With Eflornithine and Implications for Other Polyaminopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: DFMO usage in SRS has been considered and further study is ongoing (Gilmour, 2023; Stewart, 2023).
    explanation: ODC inhibition is under investigation in SRS; biochemical differences do not justify a blanket contraindication.
    quote_role: REVIEW_SYNTHESIS
- name: Faundes-Banka syndrome
  description: Faundes-Banka syndrome is a neurodevelopmental polyaminopathy caused by heterozygous EIF5A variants that impair eIF5A function. The eIF5A protein is the substrate for DHPS- and DOHH-mediated hypusination; it is not itself the hypusination enzyme. Gene, molecular consequence, and phenotype distinguish it from ODC1 gain-of-function BABS.
  distinguishing_features:
  - Heterozygous EIF5A variants impair eIF5A translation-factor function.
  - The affected protein requires spermidine-dependent hypusination, distinct from ODC-mediated putrescine synthesis.
  - Micrognathia and microcephaly are characteristic in the reviewed FABAS cohort.
  disease_term:
    preferred_term: Faundes-Banka syndrome
    term:
      id: MONDO:0859163
      label: Faundes-Banka syndrome
  evidence:
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Faundes-Banka syndrome results from heterozygous loss-of-function variants in the eukaryotic translation initiation factor 5A (EIF5A) gene, impairing eIF5A protein function.
    explanation: Gives the gene and the direction of effect that separate Faundes-Banka syndrome from BABS.
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The five known syndromes associated with the polyamine pathway share many similar clinical phenotypes, and yet patients with each syndrome present with distinctive syndromic features.
    explanation: Establishes that the five polyaminopathies overlap clinically, which is the condition under which their evidence gets mixed up.
- name: Deoxyhypusine synthase (DHPS) deficiency
  description: An autosomal recessive polyaminopathy caused by bi-allelic hypomorphic DHPS variants. It sits on the same hypusination branch as Faundes-Banka syndrome and, like BABS, presents as a Mendelian neurodevelopmental disorder with seizures and developmental impairment, so it appears in the same polyaminopathy tables. It is separated from BABS by the gene, by recessive rather than dominant inheritance, and by reduced rather than increased enzyme activity.
  distinguishing_features:
  - Caused by DHPS (deoxyhypusine synthase), not ODC1
  - Autosomal recessive with bi-allelic hypomorphic variants, not de novo heterozygous
  - Reduced enzyme activity, the opposite direction of effect to BABS
  - Acts on the spermidine-dependent hypusination of eIF5A rather than on polyamine synthesis, so putrescine and N-acetylputrescine are not the diagnostic signature
  - Seizures and speech and walking impairment define the phenotype; the BABS alopecia and macrocephaly/macrosomia combination is not its core
  disease_term:
    preferred_term: Deoxyhypusine synthase deficiency
    term:
      id: MONDO:0032775
      label: neurodevelopmental disorder with seizures and speech and walking impairment
  evidence:
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: DHPS (deoxyhypusine synthase) deficiency is an autosomal recessive disease and results from bi-allelic hypomorphic variants in the deoxyhypusine synthase (DHPS) gene, which results in reduced deoxyhypusine synthase enzyme activity.
    explanation: Gives the gene, the inheritance mode and the direction of effect that separate DHPS deficiency from BABS.
- name: Deoxyhypusine hydroxylase (DOHH) disorder
  description: The fifth recognised polyaminopathy, caused by bi-allelic loss-of-function DOHH variants, and the second step of the hypusination branch. It is the newest member of the family and is grouped with BABS in every polyaminopathy review, which is the setting in which its findings can be misattributed. It is separated from BABS by the gene, by autosomal recessive inheritance, by decreased rather than increased enzyme activity, and by a microcephaly-with-cerebral-atrophy brain phenotype that is close to the inverse of the BABS macrocephaly.
  distinguishing_features:
  - Caused by DOHH (deoxyhypusine hydroxylase), not ODC1
  - Autosomal recessive bi-allelic loss of function, not de novo heterozygous gain of function
  - Decreased enzyme activity, the opposite direction of effect to BABS
  - Microcephaly with cerebral atrophy and visual impairment, the inverse of the absolute or relative macrocephaly and macrosomia of BABS
  disease_term:
    preferred_term: Deoxyhypusine hydroxylase disorder
    term:
      id: MONDO:0859293
      label: neurodevelopmental disorder with microcephaly, cerebral atrophy, and visual impairment
  evidence:
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Finally, DOHH (deoxyhypusine hydroxylase) disorder is an autosomal recessive disorder caused by bi-allelic loss-of-function variants in the deoxyhypusine hydroxylase (DOHH) gene, which causes decreased deoxyhypusine hydroxylase enzyme activity.
    explanation: Gives the gene, the inheritance mode and the direction of effect that separate DOHH disorder from BABS.
- name: ODC1 G84R hypomorphic variant association
  description: G84R is a population missense variant with reduced activity of purified recombinant enzyme and exploratory neurological phenotype associations. It is not an established BABS allele or a validated separate Mendelian diagnosis. The study calls for co-segregation and in-vivo experiments to establish causality.
  distinguishing_features:
  - C-terminal truncation and increased enzyme abundance define the established BABS mechanism; purified G84R enzyme instead showed reduced catalytic activity.
  - Association and functional evidence for G84R do not establish Mendelian pathogenicity or a clinical treatment recommendation.
  notes: Kept unbound because the cited evidence does not establish a separate disease entity.
  evidence:
  - reference: PMID:33806076
    reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A functional enzyme assay for recombinant ODC WT or ODC G84R showed a 2.5-fold reduction of enzyme activity because of the variant, confirming alteration of enzymatic function due to the variant (Figure 1I).
    explanation: Purified recombinant enzyme assay demonstrates hypomorphic activity; this experiment is in vitro rather than solely computational.
  - reference: PMID:33806076
    reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: However, future in vivo analyses and co-segregation strategies should be performed to establish the causal roles of ODC G84R into phenotypic changes.
    explanation: The authors explicitly distinguish association from established causality.

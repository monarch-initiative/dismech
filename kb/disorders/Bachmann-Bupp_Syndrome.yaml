pathophysiology:
- name: ODC1 C-Terminal Truncating Variant
  biological_scale: MOLECULAR
  description: Heterozygous nonsense, frameshift, and splice-site variants affecting the ODC1 C-terminal region produce shortened ODC proteins. The index c.1342A>T (p.Lys448Ter) allele removes the final 14 amino acids; other alleles truncate different portions of the C-terminal region.
  genes:
  - preferred_term: ODC1
    term:
      id: hgnc:8109
      label: ODC1
    modifier: ABNORMAL
  genetic_context:
    gene:
      preferred_term: ODC1
      term:
        id: hgnc:8109
        label: ODC1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: Reported de novo heterozygous nonsense, frameshift, and splice-site alleles converge on C-terminal truncation and increased enzyme abundance. Splice consequences are predicted for some alleles rather than directly assayed.
  evidence:
  - reference: PMID:37469105
    reference_title: Bachmann-Bupp syndrome and treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The condition is caused by 3'-end mutations of the ornithine decarboxylase 1 (ODC1) gene, which produce carboxy (C)-terminally truncated variants of ODC, a pyridoxal 5'-phosphate-dependent enzyme.
    explanation: Names the location of the causative variants and the protein consequence that defines this node.
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report an 32-month-old Caucasian female with a heterozygous de novo nonsense mutation in the ODC1 gene that leads to a premature abrogation of 14-aa residues at the ODC protein c-terminus.
    explanation: 'The index case defines the specific lesion: a de novo nonsense variant truncating the last 14 residues.'
  - reference: PMID:34477286
    reference_title: 'Expanding the phenotype: Four new cases and hope for treatment in Bachmann-Bupp syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Variants continue to cluster, providing support to a universal biochemical mechanism related to elevated ODC protein, enzyme activity, and abnormalities in polyamine levels.
    explanation: Establishes that the reported variants cluster in one region and converge on a single biochemical mechanism.
  - reference: PMID:40382142
    reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome patient biological samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ODC1 gene mutations that are linked to BABS always produce C-terminally truncated versions of the enzyme ornithine decarboxylase (ODC).
    explanation: States that C-terminal truncation is an invariant feature of the BABS allele spectrum.
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this report, we present four patients with a distinct neurometabolic disorder associated with de novo heterozygous, gain-of-function variants in the ODC1 gene.
    explanation: The founding case series classifies the causal ODC1 alleles as de novo, heterozygous and gain-of-function, which is the functional impact recorded here.
  downstream:
  - target: Escape from Antizyme-Mediated Proteasomal Degradation
    description: Loss of the C-terminal degron removes the signal that normally targets ODC for ubiquitin-independent proteasomal turnover.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37469105
      reference_title: Bachmann-Bupp syndrome and treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: C-terminal truncation of ODC prevents its ubiquitin-independent proteasomal degradation and leads to cellular accumulation of ODC enzyme that remains catalytically active.
      explanation: Directly links the C-terminal truncation to failure of the degradation route.
- name: Escape from Antizyme-Mediated Proteasomal Degradation
  biological_scale: MOLECULAR
  description: Wild-type ODC is one of the shortest-lived mammalian proteins because its C-terminus acts as a degron for ubiquitin-independent, antizyme-dependent proteasomal degradation. The truncated BABS enzyme cannot be cleared by this route, so it escapes normal turnover. This is a stability defect, not a catalytic defect.
  biological_processes:
  - preferred_term: proteasomal ubiquitin-independent protein catabolic process
    term:

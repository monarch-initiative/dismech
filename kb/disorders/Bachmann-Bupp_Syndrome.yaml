    explanation: Identifies the outer root sheath keratinocyte as the cell type in which excess ODC produces the follicular phenotype.
  downstream:
  - target: Follicular Cyst Formation
    description: Follicular cyst formation accompanies constitutive ODC overexpression and abnormal hair cycling in the transgenic model. The tissue intermediates have not been fully resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

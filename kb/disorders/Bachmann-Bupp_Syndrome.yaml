    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus, a carboxyl-terminal domain is responsible for the rapid intracellular degradation of murine ODC.
    explanation: Localises the degradation signal to the carboxyl-terminal domain, the domain that BABS variants delete.
  - reference: PMID:1334232
    reference_title: Ornithine decarboxylase is degraded by the 26S proteasome without ubiquitination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, purified 26S proteasome complex, but not the 20S proteasome, catalyses ODC degradation in the absence of ubiquitin.
    explanation: 'Identifies the specific proteolytic route that the truncation escapes: 26S-proteasomal degradation without ubiquitination.'
  - reference: PMID:1334232

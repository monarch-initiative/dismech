    snippet: "Importantly, the accumulated ODC protein variant remained functionally active as we detected exceptionally high ODC enzyme activity in both primary dermal fibroblasts (12-17-fold of controls) and red blood cells (RBCs) (125-137-fold of controls), using a specific 14C radioactive ODC activity assay."
    explanation: >-

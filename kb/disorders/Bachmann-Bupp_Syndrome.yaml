notes: >-
  Scope, provenance and named-entity-confusion notes for this entry.


  (1) GeneReviews baseline. A GeneReviews chapter exists (PMID:36007106,
  "Bachmann-Bupp Syndrome", Bupp, Michael, VanSickle, Rajasekaran and Bachmann,
  2022 Aug 25) and was used as the mandatory phenotype baseline. Every clinical
  feature named in its Clinical Characteristics paragraph is represented in
  the phenotypes block: the distinctive alopecia, global developmental delay in
  the moderate to severe range, hypotonia, nonspecific dysmorphic features,
  behavioural abnormalities (autism spectrum disorder and
  attention-deficit/hyperactivity disorder are curated as two separate
  phenotype entries), feeding difficulties, the birth-hair-then-clump-loss
  natural history, and the rare findings of later-childhood seizures and
  conductive hearing loss. Features named only in its Management paragraph
  (obesity, constipation, refractive error, strabismus, follicular cysts,
  congenital heart defects) are also curated, sourced to that same paragraph.
  Nothing in the GeneReviews abstract is knowingly omitted. The cached record
  is the structured PubMed abstract, not the full chapter body, so features
  present only in the chapter body may still be missing.


  (2) Named-entity-confusion discipline - this is the central risk for ODC1.
  ODC1 is a heavily studied oncology and polyamine-pharmacology gene, and the
  overwhelming majority of its literature is cancer biology, DFMO
  chemoprevention or basic polyamine metabolism with no bearing on this
  neurodevelopmental disorder. Every citation in this entry was checked to be
  either (a) about genotyped human BABS patients, (b) the disease-specific
  review literature from the International Center for Polyamine Disorders, or
  (c) the C-terminally-truncated-ODC animal model that is the accepted
  mechanistic model of this exact lesion. No chemoprevention trial (colorectal
  adenoma, skin cancer) and no neuroblastoma efficacy trial is cited as
  evidence for a BABS claim; the neuroblastoma literature is referred to only
  where the BABS papers themselves invoke it as the source of the paediatric
  dose and safety data, and that is stated explicitly in the eflornithine
  treatment entry rather than cited directly.


  (3) The direction-of-effect trap. BABS is a GAIN-of-function disorder. ODC1
  knockout and loss-of-function data must not be imported as if they modelled
  the patient state, and none is. The one loss-of-function observation that is
  curated (the ODC G84R hypomorph in PMID:33806076) is deliberately modelled as
  a differential-diagnosis entry and as a contrast, never as support for a BABS
  mechanism, because the same paper reports that the two directions have
  opposite predicted consequences for neural progenitors: gain-of-function with
  over-proliferation and loss-of-function with depletion. Likewise the mouse
  evidence used here is the K6/ODC transgenic, which carries a premature stop
  codon producing a carboxyl-truncated, stabilised ODC - the same class of
  lesion as the human variants - and not an Odc1 null.


  (4) Mouse-model fidelity and its limits. The K6/ODC mouse (PMID:8618048,
  reviewed in PMID:41925768) reproduces the alopecia and follicular cysts and
  their reversal with DFMO, and was the direct basis for the drug-repurposing
  decision. It is a keratin-6-promoter-driven, skin-restricted transgenic,
  whereas BABS patients express the truncated enzyme in every tissue, so it
  models only the cutaneous arm. All neurodevelopmental claims in this entry
  therefore rest on human evidence, and the mouse evidence carries
  evidence_source MODEL_ORGANISM and is confined to the hair-follicle and
  follicular-cyst nodes.


  (5) Frequency derivation. Frequency bands are recorded on only five
  phenotypes and are omitted everywhere else. The five that carry a band are
  derived from GeneReviews qualitative language using the standard
  prose-to-FrequencyEnum mapping: features the chapter says the syndrome "is
  characterized by" (alopecia, global developmental delay, hypotonia) take
  VERY_FREQUENT, and features it explicitly calls "rare findings" (later-onset
  seizures, conductive hearing loss) take VERY_RARE. No numeric denominator
  underlies these bands. The published case denominators are tiny and
  inconsistent: PMID:30475435 reported four patients, PMID:30239107 one,
  PMID:34477286 four more, PMID:37092498 two more, and PMID:34282722 described
  the cohort as "less than 10 known cases". The deep-research report surfaced a
  per-feature frequency table (n=9) from the body of the GeneReviews chapter,
  giving alopecia 9/9, dysmorphic features 9/9, developmental delay 8/8,
  hypotonia 8/8, macrocephaly 6/9 and seizures 1/8. Those numbers are
  consistent with the bands recorded here, but the cached PubMed record for
  PMID:36007106 contains only the structured abstract, so the table itself
  could not be verified byte-exactly and its numbers are therefore NOT asserted
  as evidence anywhere in this entry. A future curator with access to the full
  chapter should be able to upgrade these bands to denominator-backed ones.


  (5a) Two phenotypes that the deep-research report supports but this entry
  does NOT curate, because no cached abstract contains a quotable sentence for
  them. Polyhydramnios (reported at 55-80% of pregnancies) and the HPO
  annotation set for OMIM:619075 (hypertelorism, high forehead, sparse
  eyelashes, cryptorchidism, ptosis and others) are both real and both
  well-attested in the sources the report cites, but grepping every cached
  reference used by this entry for "polyhydramnios" returns zero hits, and the
  HPOA annotations are database records rather than quotable abstract text.
  They are omitted rather than sourced to a citation that does not contain
  them. This is a recorded gap, not a claim that the evidence does not exist.


  (6) Prevalence derivation. No population-based rate has ever been published.
  The prevalence record therefore uses the qualitative ULTRA_RARE tier with the
  case-count denominators recorded in its notes. The counts themselves conflict
  across sources and are not summed into a single asserted total.


  (7) No structured-source (ORPHA:544488, CGGV, CGDS) citation is included.
  Neither an ORPHA_544488 nor any ClinGen cache file for ODC1 is present in
  references_cache, and generating one would require a data MANIFEST bump,
  which is blocked by the stale, un-refreshable pins tracked in #7622. The
  structured-source citation is skipped rather than fabricated.


  (8) Two claims that are true in the literature but are NOT asserted here for
  lack of a quotable BABS-specific source. First, an exact number of reported
  BABS patients: the sources disagree and none of the cached abstracts states a
  current cumulative total, so no total is asserted. Second, an oncology
  surveillance recommendation: PMID:30475435 raises cancer surveillance only as
  a suggestion ("cancer surveillance may be important in this disorder") and the
  GeneReviews surveillance paragraph does not include tumour screening, so this
  is curated as a discussion item and an explicitly hedged treatment note
  rather than as a recommendation.


  (9) Prenatal presentation. PMID:41931584 reports a prenatally diagnosed BABS
  fetus with macrocephaly and a ventricular septal defect. That record has no
  abstract in PubMed - fetching it yields only a bibliographic header with no
  quotable body - so it is not cited for any evidence item and its cache file
  is deliberately not committed. The congenital heart defect phenotype is
  instead sourced to the GeneReviews management paragraph, which does list
  congenital heart defects. The same applies to PMID:34318586 (LSS
  hypotrichosis families), which also has no abstract; the LSS differential is
  therefore sourced to PMID:30723320 instead.


  (10) Scope of differential_diagnoses. Six differentials are modelled. The
  four other recognised polyaminopathies (Snyder-Robinson syndrome,
  Faundes-Banka syndrome, DHPS deficiency and DOHH disorder) are bound to MONDO
  terms, because PMID:41410504 explicitly groups all five as one family that
  "share many similar clinical phenotypes" - which is exactly the setting in
  which evidence gets misattributed. Each is discriminated by its gene, its
  direction of effect and its position in the polyamine pathway. LSS-related
  alopecia-intellectual disability syndrome 4 is bound as the closest mimic
  outside the pathway, discriminated on congenital versus non-congenital
  alopecia. The sixth, the ODC1 loss-of-function/hypomorphic neurological
  phenotype, is left UNBOUND: it is the single most dangerous confusion for
  this entry because it involves the same gene, but it has no OMIM entry and no
  MONDO term of its own, so binding it to any existing term would be a
  fabrication. Note that MONDO:0800159 (disorder of polyamine metabolism) and
  MONDO:0100500 (Mendelian neurodevelopmental disorder) are this entry's own
  asserted superclasses and are therefore deliberately absent from the
  differential list. Four further differentials named in the GeneReviews
  differential table and relayed by the deep-research report (CHD3 / Snijders
  Blok-Campeau syndrome, DCAF17 / Woodhouse-Sakati syndrome, PAK1 / IDDMSSD and
  PTEN / Cowden syndrome) are NOT modelled here, because that table lives in the
  chapter body and not in the cached abstract, so no verbatim discriminating
  sentence is available for any of them from a reference this entry cites. They
  are named here so the next curator knows where to look rather than having to
  rediscover them.


  (11) Provenance of this entry. The deep-research provider was claude_code,
  run via `just research-disorder claude_code Bachmann-Bupp_Syndrome` on
  2026-08-01 (report at
  research/Bachmann-Bupp_Syndrome-deep-research-claude_code.md; 8 web searches,
  77 turns, 38 citations). The report was read in full and treated as leads
  rather than ground truth: every PMID it supplied was fetched with
  `just fetch-reference` and every snippet used here was copy-pasted from the
  cached file. Claims the report made that could not be verified against a
  cached abstract - the GeneReviews frequency table, the GeneReviews
  differential table, the cumulative case counts of 12 published / 18 worldwide
  across eight countries, polyhydramnios frequencies, ClinVar accessions and
  the full variant table - are recorded in these notes as leads and are not
  asserted as evidence anywhere in the entry.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous ODC1 variants are sufficient; reported cases have been de novo,
    so recurrence risk to siblings is presumed low.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BABS is expressed in an autosomal dominant manner and typically caused by a de novo ODC1 pathogenic variant."
    explanation: >-
      GeneReviews states the autosomal dominant mode and the de novo origin of
      the causative variant.
  - reference: PMID:36443247
    reference_title: Improvement of dermatological symptoms in patients with Bachmann-Bupp
      syndrome using difluoromethylornithine treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bachmann-Bupp syndrome (OMIM #619075) is a novel autosomal dominant disorder caused by variants in the c-terminus of the ornithine decarboxylase 1 gene, resulting in increased levels of ornithine decarboxylase."
    explanation: >-
      Independent confirmation of autosomal dominant transmission and of the
      C-terminal location of the causative variants.
- name: De novo occurrence
  description: >-
    All reported probands have carried de novo heterozygous ODC1 variants rather
    than inherited alleles.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  evidence:
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental
      disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging
      abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this report, we present four patients with a distinct neurometabolic disorder associated with de novo heterozygous, gain-of-function variants in the ODC1 gene."
    explanation: >-
      A four-patient cohort in which every causative allele arose de novo.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Derivation: only case-level denominators exist and no population-based rate
    has ever been published, so no rate_per_100000 is recorded. PMID:30239107
    (2018) described the index patient; PMID:30475435 (2018) described four
    patients; PMID:34477286 (2021) added four more; PMID:37092498 (2023) added
    two more; PMID:34282722 (2021) described the condition as "less than 10
    known cases" at that time. The individual reports overlap and the reviews do
    not state a reconciled cumulative total, so the counts are recorded here
    rather than summed into an asserted number, and the qualitative ULTRA_RARE
    tier is used.
  evidence:
  - reference: PMID:37469105
    reference_title: Bachmann-Bupp syndrome and treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BABS is an ultra-rare condition with few reported cases, but it serves as a convincing example for drug repurposing therapy."
    explanation: >-
      The disease-specific review characterises BABS as ultra-rare with few
      reported cases.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function
      variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The novel treatment of this ultra-rare (less than 10 known cases) genetic syndrome presented unique challenges for monitoring efficacy over time."
    explanation: >-
      Supplies the explicit published denominator underpinning the ultra-rare
      tier at the time of the first treated case.
  - reference: PMID:37092498
    reference_title: Two New Cases of Bachmann-Bupp Syndrome Identified through the International
      Center for Polyamine Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case study provides insights from two new patients diagnosed with Bachmann-Bupp syndrome, further expanding our understanding of this ultra-rare condition, as well as a general discussion about other known polyaminopathies."
    explanation: >-
      An incremental two-patient addition to the published series, again
      described as ultra-rare.
pathophysiology:
- name: ODC1 C-Terminal Truncating Variant
  biological_scale: MOLECULAR
  description: >-
    A de novo heterozygous variant at the 3-prime end of ODC1 introduces a
    premature stop codon in the last exon, removing the carboxy-terminal
    residues of ornithine decarboxylase. The variants cluster in this region
    across reported patients, and the index allele c.1342A>T removes the last
    14 amino acids.
  genes:
  - preferred_term: ODC1
    term:
      id: hgnc:8109
      label: ODC1
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37469105
    reference_title: Bachmann-Bupp syndrome and treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is caused by 3'-end mutations of the ornithine decarboxylase 1 (ODC1) gene, which produce carboxy (C)-terminally truncated variants of ODC, a pyridoxal 5'-phosphate-dependent enzyme."
    explanation: >-
      Names the location of the causative variants and the protein consequence
      that defines this node.
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with
      developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report an 32-month-old Caucasian female with a heterozygous de novo nonsense mutation in the ODC1 gene that leads to a premature abrogation of 14-aa residues at the ODC protein c-terminus."
    explanation: >-
      The index case defines the specific lesion: a de novo nonsense variant
      truncating the last 14 residues.
  - reference: PMID:34477286
    reference_title: "Expanding the phenotype: Four new cases and hope for treatment in Bachmann-Bupp syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants continue to cluster, providing support to a universal biochemical mechanism related to elevated ODC protein, enzyme activity, and abnormalities in polyamine levels."
    explanation: >-
      Establishes that the reported variants cluster in one region and converge
      on a single biochemical mechanism.
  - reference: PMID:40382142
    reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome
      patient biological samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ODC1 gene mutations that are linked to BABS always produce C-terminally truncated versions of the enzyme ornithine decarboxylase (ODC)."
    explanation: >-
      States that C-terminal truncation is an invariant feature of the BABS
      allele spectrum.
  downstream:
  - target: Escape from Antizyme-Mediated Proteasomal Degradation
    description: >-
      Loss of the C-terminal degron removes the signal that normally targets ODC
      for ubiquitin-independent proteasomal turnover.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37469105
      reference_title: Bachmann-Bupp syndrome and treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "C-terminal truncation of ODC prevents its ubiquitin-independent proteasomal degradation and leads to cellular accumulation of ODC enzyme that remains catalytically active."
      explanation: >-
        Directly links the C-terminal truncation to failure of the degradation
        route.
- name: Escape from Antizyme-Mediated Proteasomal Degradation
  biological_scale: MOLECULAR
  description: >-
    Wild-type ODC is one of the shortest-lived mammalian proteins because its
    C-terminus acts as a degron for ubiquitin-independent, antizyme-dependent
    proteasomal degradation. The truncated BABS enzyme cannot be cleared by this
    route, so it escapes normal turnover. This is a stability defect, not a
    catalytic defect.
  biological_processes:
  - preferred_term: proteasomal ubiquitin-independent protein catabolic process
    term:
      id: GO:0010499
      label: proteasomal ubiquitin-independent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:40382142
    reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome
      patient biological samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These shortened ODC proteins remain enzymatically active and are not cleared by the proteasome, therefore leading to ODC protein accumulation in cells."
    explanation: >-
      States both halves of this node: preserved catalysis and failed
      proteasomal clearance.
  - reference: PMID:31249027
    reference_title: Biochemical features of primary cells from a pediatric patient with
      a gain-of-function ODC1 genetic mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We hypothesized that this new mutation (c.1342 A>T) leads to a C-terminal truncation variant of the ODC protein that is resistant to normal proteasomal degradation, leading to putrescine accumulation in cells."
    explanation: >-
      States the degradation-resistance hypothesis that the same study then
      tested in patient-derived cells.
  - reference: PMID:41925768
    reference_title: "The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a premature stop codon at position 427 in the mouse ODC cDNA was placed downstream of the K6 promoter resulting in a carboxyl-truncated ODC protein with a much longer in vivo half-life than the full-length ODC protein"
    explanation: >-
      The engineered mouse allele demonstrates that C-terminal truncation alone
      extends the half-life of the ODC protein.
  - reference: PMID:2928784
    reference_title: Prevention of rapid intracellular degradation of ODC by a carboxyl-terminal
      truncation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ornithine decarboxylase (ODC) was converted from a protein with a short intracellular half-life in mammalian cells to a stable protein by truncating 37 residues at its carboxyl terminus."
    explanation: >-
      The founding experiment: removing the C-terminal 37 residues converts ODC
      from a short-lived to a stable protein. This is, three decades early, an
      in vitro pre-enactment of the human BABS lesion.
  - reference: PMID:2928784
    reference_title: Prevention of rapid intracellular degradation of ODC by a carboxyl-terminal
      truncation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, a carboxyl-terminal domain is responsible for the rapid intracellular degradation of murine ODC."
    explanation: >-
      Localises the degradation signal to the carboxyl-terminal domain, the
      domain that BABS variants delete.
  - reference: PMID:1334232
    reference_title: Ornithine decarboxylase is degraded by the 26S proteasome without
      ubiquitination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, purified 26S proteasome complex, but not the 20S proteasome, catalyses ODC degradation in the absence of ubiquitin."
    explanation: >-
      Identifies the specific proteolytic route that the truncation escapes:
      26S-proteasomal degradation without ubiquitination.
  - reference: PMID:1334232
    reference_title: Ornithine decarboxylase is degraded by the 26S proteasome without
      ubiquitination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have shown that its degradation is accelerated by ODC antizyme, an inhibitory protein induced by polyamines."
    explanation: >-
      Establishes antizyme as the accelerator of ODC turnover, the regulatory
      arm that a C-terminally truncated enzyme is insensitive to.
  downstream:
  - target: ODC Protein Accumulation
    description: >-
      A protein that cannot be degraded accumulates in the cell.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40382142
      reference_title: Monitoring ODC activity and polyamines in Bachmann-Bupp syndrome
        patient biological samples.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These shortened ODC proteins remain enzymatically active and are not cleared by the proteasome, therefore leading to ODC protein accumulation in cells."
      explanation: >-
        Names failed proteasomal clearance as the direct cause of ODC protein
        accumulation.
- name: ODC Protein Accumulation
  biological_scale: CELLULAR
  description: >-
    Stabilised ODC protein accumulates to large excess in patient cells,
    demonstrated in primary dermal fibroblasts and in red blood cells.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:31249027
    reference_title: Biochemical features of primary cells from a pediatric patient with
      a gain-of-function ODC1 genetic mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we show that primary dermal fibroblasts derived from a skin biopsy of a 3-year-old patient contain large amounts of ODC protein and putrescine compared with primary dermal (neonatal and adult) fibroblast control cells."
    explanation: >-
      Direct measurement of accumulated ODC protein in patient-derived
      fibroblasts.
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with
      developmental delay, alopecia, and dysmorphic features.

      cysts and normalisation of white matter signal.
  - reference: PMID:36443247
    reference_title: Improvement of dermatological symptoms in patients with Bachmann-Bupp
      syndrome using difluoromethylornithine treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, treatment with difluoromethylornithine has resulted in improved dermatologic signs, including regrowth of eyebrow and scalp hair and cessation of recurrent follicular cyst development."
    explanation: >-
      Two additional genotyped patients replicating the dermatological response.
  - reference: PMID:37469105
    reference_title: Bachmann-Bupp syndrome and treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with BABS have been treated with DFMO and have shown improvement in hair growth, muscle tone, and development."
    explanation: >-
      Review-level summary of the three outcome domains reported across treated
      patients.
  - reference: PMID:40167220
    reference_title: "Repurposing With Purpose: Treatment of Bachmann-Bupp Syndrome With Eflornithine and Implications for Other Polyaminopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, five additional patients with BABS are being treated with DFMO."
    explanation: >-
      Establishes that the treated cohort has grown beyond the index case.
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "An experimental targeted treatment with difluoromethylornithine (DFMO) is being explored on a compassionate use basis; it is not currently an FDA-approved treatment for BABS."
    explanation: >-
      Marked PARTIAL because GeneReviews classifies DFMO as a therapy under
      investigation, not established care; the regulatory status is an important
      caveat on every outcome above.
  notes: >-
    The published treated-patient outcomes are uncontrolled single-arm
    observations in a handful of children, with the index report explicitly
    noting that COVID-19 restrictions interrupted standardised neurological
    assessment. Hair regrowth and cyst cessation are unambiguous and were
    directly observed; the developmental and imaging gains are harder to
    attribute with certainty and should be read as promising rather than proven.
- name: Low-polyamine diet
  description: >-
    Dietary restriction of polyamines was given alongside eflornithine in the
    index treated patient. It has never been tested as monotherapy in BABS, and

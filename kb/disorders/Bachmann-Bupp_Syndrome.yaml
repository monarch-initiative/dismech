  evidence:
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bachmann-Bupp syndrome (BABS) is characterized by a distinctive type of alopecia, global developmental delay in the moderate to severe range, hypotonia, nonspecific dysmorphic features, behavioral abnormalities (autism spectrum disorder, attention-deficit/hyperactivity disorder) and feeding difficulties.
    explanation: GeneReviews lists feeding difficulties among the defining characteristics.
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Feeding therapy with a low threshold for a clinical feeding evaluation and/or gastrostomy tube placement; nutritional intervention for those with obesity; stool softeners, prokinetics, osmotic agents or laxatives for constipation; standard treatment for epilepsy, developmental delay / intellectual disability, refractive error, strabismus, hearing loss, follicular cysts, and congenital heart defects.
    explanation: The management recommendation reflects the clinical weight of the feeding problem.

    evidence_source: HUMAN_CLINICAL
    snippet: All 12 patients with BABS described in the literature presented with varying forms of non-congenital alopecia.
    explanation: Observed in all 12 reported cases, mapping to OBLIGATE for this literature cohort. This is not proof of complete population penetrance or lifelong absence of every type of hair.

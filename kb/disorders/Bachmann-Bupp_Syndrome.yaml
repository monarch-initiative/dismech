experimental_models:
- name: Index-patient dermal fibroblasts and DFMO rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary dermal fibroblasts from the index patient with ODC1 c.1342A>T (p.Lys448Ter); neonatal and adult control fibroblasts
  description: Patient fibroblasts accumulated ODC and putrescine and had elevated ODC activity. DFMO reduced activity and putrescine to control levels. This is a non-neural, single-patient model; controls were not described as isogenic.
  publication: PMID:31249027
  modeled_mechanisms:
  - target: ODC Protein Accumulation
    relationship: RECAPITULATES
    description: Patient fibroblasts contain elevated ODC protein.
    evidence:
    - reference: PMID:31249027
      reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In this study, we show that primary dermal fibroblasts derived from a skin biopsy of a 3-year-old patient contain large amounts of ODC protein and putrescine compared with primary dermal (neonatal and adult) fibroblast control cells.
      explanation: Patient-derived fibroblasts provide direct cellular evidence from the index p.Lys448Ter case.
  - target: Elevated ODC Enzyme Activity
    relationship: RECAPITULATES
    description: Radiolabeled ornithine assay detected elevated catalytic activity.
    evidence:
    - reference: PMID:31249027
      reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Importantly, the accumulated ODC protein variant remained functionally active as we detected exceptionally high ODC enzyme activity in both primary dermal fibroblasts (12-17-fold of controls) and red blood cells (RBCs) (125-137-fold of controls), using a specific 14C radioactive ODC activity assay.
      explanation: Assay results are from one patient, with separate fibroblast and erythrocyte preparations.
  - target: Putrescine Accumulation
    relationship: RESCUES
    description: DFMO reduced the elevated putrescine pool to control levels in culture.
    limitations: Biochemical rescue in fibroblasts does not establish neural or whole-patient efficacy.
    evidence:
    - reference: PMID:31249027
      reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Exposure of primary dermal fibroblasts to ODC inhibitor α-difluoromethylornithine (DFMO) reduced the ODC activity and putrescine to levels observed in controls without adversely affecting cell morphology or inducing cell death.
      explanation: Drug exposure normalized these measured biochemical readouts; absence of reported morphological change or cell death is not a comprehensive safety assay.
  evidence:
  - reference: PMID:31249027
    reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In this study, we show that primary dermal fibroblasts derived from a skin biopsy of a 3-year-old patient contain large amounts of ODC protein and putrescine compared with primary dermal (neonatal and adult) fibroblast control cells.
    explanation: Patient-derived fibroblasts provide direct cellular evidence from the index p.Lys448Ter case.
  - reference: PMID:31249027
    reference_title: Biochemical features of primary cells from a pediatric patient with a gain-of-function ODC1 genetic mutation.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bachmann-Bupp syndrome (BABS) is a neurodevelopmental disorder characterized by developmental delay, hypotonia, and varying forms of non-congenital alopecia.
    explanation: Independent review confirming the non-congenital character and variable form of the alopecia.
  - reference: PMID:34282722
    reference_title: Repurposing eflornithine to treat a patient with a rare ODC1 gain-of-function variant disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient was born with a full head of silver-blond hair similar to a previously described murine phenotype ... which fell out in early months and she remained hairless other than a few scattered, long hairs on the scalp.
    explanation: Patient-level description of the birth hair, its unusual colour and the subsequent loss.
  - reference: PMID:41410504

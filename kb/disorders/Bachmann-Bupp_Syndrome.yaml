diagnosis:
- name: ODC1 molecular genetic testing
  description: The diagnosis is established by identifying a heterozygous pathogenic ODC1 variant in a proband with suggestive findings. Exome sequencing identified the index allele, confirmed by Sanger sequencing.
  presence: PRESENT
  evidence:
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis is established in a proband with suggestive findings and a heterozygous pathogenic variant in ODC1 identified by molecular genetic testing.
    explanation: GeneReviews defines the diagnostic standard.
  - reference: PMID:30239107
    reference_title: Novel de novo pathogenic variant in the ODC1 gene in a girl with developmental delay, alopecia, and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ODC1 gene mutation (c.1342 A>T) was identified by whole-exome sequencing and confirmed by Sanger sequencing.
    explanation: Illustrates the two-step molecular workflow used in the index case.
- name: Plasma metabolomic profiling for polyamine metabolites
  description: Elevated N-acetylputrescine on plasma metabolomic profiling can support suspicion of BABS or characterize a molecular finding. Published diagnoses were made through broad sequencing; metabolomics is not an obligatory preceding step.
  presence: PRESENT
  evidence:
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The finding of abnormal polyamine pathway metabolites (including increased N-acetylputrescine) on metabolomic profiling is suggestive of a diagnosis of BABS.
    explanation: GeneReviews positions metabolomic profiling as the suggestive biochemical test.
  - reference: PMID:30475435
    reference_title: Gain-of-function variants in the ODC1 gene cause a syndromic neurodevelopmental disorder associated with macrocephaly, alopecia, dysmorphic features, and neuroimaging abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Plasma clinical metabolomics analysis demonstrates elevation of N-acetylputrescine, the acetylated form of putrescine, with otherwise normal polyamine levels.
    explanation: Documents the specific plasma metabolomic pattern in a genotyped cohort.
  - reference: PMID:34477286
    reference_title: 'Expanding the phenotype: Four new cases and hope for treatment in Bachmann-Bupp syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All diagnoses to date have been made using broad sequencing, such as WES or WGS.
    explanation: The 2021 series establishes the diagnostic sequence actually used, rather than assuming that biochemical testing usually comes first.
- name: Erythrocyte ODC enzyme activity assay
  description: A 14C-ornithine radiolabelled assay on red blood cells, with polyamines measured by reverse-phase HPLC, quantifies the enzymatic gain of function and is used to monitor response to eflornithine.
  presence: PRESENT

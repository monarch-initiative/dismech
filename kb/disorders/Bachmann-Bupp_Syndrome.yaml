- name: Supportive and symptom-directed management
  description: >-
    Standard multidisciplinary care for the individual manifestations: feeding
    therapy with a low threshold for gastrostomy placement, nutritional
    intervention for obesity, a constipation ladder of stool softeners,
    prokinetics, osmotic agents and laxatives, and standard treatment for
    epilepsy, developmental delay and intellectual disability, refractive error,
    strabismus, hearing loss, follicular cysts and congenital heart defects.
  therapeutic_modality: OTHER

      evidence_source: MODEL_ORGANISM
      snippet: Transgene overexpression in follicular keratinocytes is first detected at day 12 after birth, coincident with the development of follicular cysts in the upper portion of the dermis.
      explanation: Ties the onset of follicular ODC overexpression to the appearance of dermal follicular cysts.
    - reference: PMID:41925768
      reference_title: 'The remarkable legacy of the K6/ODC mouse: mechanisms of polyamine-promoted tumorigenesis revealed.'
      supports: SUPPORT

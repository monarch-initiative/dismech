    snippet: We have shown that its degradation is accelerated by ODC antizyme, an inhibitory protein induced by polyamines.
    explanation: Establishes antizyme as the accelerator of ODC turnover, the regulatory arm that a C-terminally truncated enzyme is insensitive to.

  description: De novo frameshift from the 2023 patient narrative. The table contains c.1307_3111delinsT, whereas the narrative gives c.1307_1311delinsT, consistent with the reported protein effect. The narrative spelling is retained; no formal ACMG class is inferred.
  evidence:

  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: An experimental targeted treatment with difluoromethylornithine (DFMO) is being explored on a compassionate use basis; it is not currently an FDA-approved treatment for BABS.
    explanation: GeneReviews classifies DFMO as experimental compassionate-use treatment, qualifying the reported outcomes.
  - reference: PMID:40167220
    reference_title: 'Repurposing With Purpose: Treatment of Bachmann-Bupp Syndrome With Eflornithine and Implications for Other Polyaminopathies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, 6 patients with BABS are being treated with the repurposed drug, DFMO. Five of those patients are being treated in the United States under FDA-approved single patient investigational new drug (IND) protocols. The 6th patient is being treated outside of the U.S.
    explanation: The 2025 report provides a dated treated-patient count and distinguishes single-patient IND authorization from approval of a BABS indication.
  notes: 'Developmental assessment was disrupted by COVID-19 in the index study, and concurrent dietary and rehabilitation interventions complicate attribution. MRI compared neonatal imaging with a later scan after nine months of treatment: cysts resolved and white matter signal normalized, but white matter volume loss was present. This is not proof of restored cortical architecture. The cited GeneReviews chapter classifies treatment as experimental rather than an approved BABS indication.'

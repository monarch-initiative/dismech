  description: One individual in the initial eight liveborn cases developed seizures at age 14 and was described at age 23. Multiple seizure types became difficult to control. Younger individuals may not yet have reached the age of onset observed in that case. In that individual, vagus nerve stimulation worsened seizures and a ketogenic diet did not improve them.

- name: Alopecia
  category: Dermatologic
  description: >-
    The distinctive BABS alopecia is non-congenital. Hair is typically present at
    birth, may be sparse and of an unexpected colour, and is then lost in large
    clumps within the first few weeks of life. The index patient was born with a
    full head of silver-blond hair and became essentially hairless. Reported
    severity ranges up to alopecia universalis.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:36007106
    reference_title: Bachmann-Bupp Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bachmann-Bupp syndrome (BABS) is characterized by a distinctive type of alopecia, global developmental delay in the moderate to severe range, hypotonia, nonspecific dysmorphic features, behavioral abnormalities (autism spectrum disorder, attention-deficit/hyperactivity disorder) and feeding difficulties."
    explanation: >-
      GeneReviews places a distinctive alopecia first among the defining
      characteristics, which maps to the VERY_FREQUENT band under the
      GeneReviews prose-to-enum convention for a feature the disorder is
      "characterized by".

- name: ODC1 c.1242-2A>G
  gene:
    preferred_term: ODC1
    term:
      id: hgnc:8109
      label: ODC1
  variant_type: single nucleotide variant
  type: Splice acceptor
  description: Recurrent de novo intron-11 splice acceptor variant reported in three individuals. The predicted splice consequence is not represented as an experimentally demonstrated transcript change. No formal ACMG class is assigned from the case narrative alone.
  evidence:
  - reference: PMID:37092498
    reference_title: Two New Cases of Bachmann-Bupp Syndrome Identified through the International Center for Polyamine Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After trio exome sequencing, she was diagnosed as having a de novo heterozygous variant in the ODC1 gene, c.1242-2A > G, (IVS11-2A > G), which is predicted to destroy a canonical splice acceptor site in intron 11.
    explanation: The paper describes a predicted acceptor disruption and de novo origin.
  - reference: PMID:41410504
    reference_title: 'Genetic and Phenotypic Features of the Five Known Polyaminopathies: A Critical Narrative Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One variant, c.1242–2A>G (p.IVS11–2A>G), has been reported in 3 individuals (Michael et al., 2023; VanSickle et al., 2021).
    explanation: A recurrent allele is not proof of a mutational hotspot or shared founder.

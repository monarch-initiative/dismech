name: Bachmann-Bupp Syndrome
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- BABS
- NEDABA
- neurodevelopmental disorder with alopecia and brain abnormalities
- global developmental delay-alopecia-macrocephaly-facial dysmorphism-structural brain
  anomalies syndrome
description: >-
  Bachmann-Bupp syndrome (BABS) is an ultra-rare autosomal dominant
  neurodevelopmental disorder caused by de novo heterozygous variants at the
  3-prime end of ODC1 that truncate the carboxy terminus of ornithine
  decarboxylase (ODC), the rate-limiting enzyme of polyamine biosynthesis. The
  mechanism is gain of function, not loss of function: the truncated enzyme
  remains catalytically active but loses the C-terminal degron required for
  ubiquitin-independent, antizyme-mediated proteasomal turnover, so ODC protein
  accumulates and cellular ODC activity rises by one to two orders of magnitude,
  driving putrescine accumulation. The clinical picture combines a distinctive
  non-congenital alopecia (hair present at birth, then shed in clumps), global
  developmental delay in the moderate to severe range, hypotonia, absolute or
  relative macrocephaly, macrosomia, nonspecific facial dysmorphism, recurrent
  follicular cysts, feeding difficulties and behavioural abnormalities, with
  variable and inconsistent structural neuroimaging findings. BABS is one of the
  few neurodevelopmental disorders with a mechanism-matched repurposed therapy:
  the ODC inhibitor eflornithine (alpha-difluoromethylornithine, DFMO), given on
  a compassionate-use basis, has produced hair regrowth, cessation of follicular
  cyst formation, improved muscle tone and developmental gains in treated
  patients.

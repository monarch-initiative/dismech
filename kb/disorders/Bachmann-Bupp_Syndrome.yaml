    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ornithine decarboxylase (ODC) was converted from a protein with a short intracellular half-life in mammalian cells to a stable protein by truncating 37 residues at its carboxyl terminus.
    explanation: 'The founding experiment: removing the C-terminal 37 residues converts ODC from a short-lived to a stable protein. This is, three decades early, an in vitro pre-enactment of the human BABS lesion.'
  - reference: PMID:2928784

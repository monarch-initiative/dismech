- name: Reference-line cerebral organoids for ODC1 expression
  experimental_model_type: ORGANOID
  cell_source: Human iPSC line AICS-0011; not a BABS patient line
  culture_system: STEMdiff cerebral organoid differentiation with single-cell RNA sequencing
  description: Reference-line cerebral organoids were profiled to relate ODC1 expression to immature SOX-expressing cells. These are observational expression data; no disease allele was introduced and neural over-proliferation was not experimentally demonstrated.
  publication: PMID:33806076
  modeled_mechanisms:
  - target: Dysregulated Neural Progenitor Proliferation
    relationship: MEASURES
    description: Measures expression associations underlying the proposed neural mechanism, not the putative proliferation defect itself.
    limitations: Unperturbed reference line; expression is not a proliferation assay or proof of disease causation.
    evidence:
    - reference: PMID:33806076
      reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: There was also a higher expression of ODC1 in cells expressing pluripotent SOX gene markers, with both the number of cells and total expression levels of ODC1 lower in cells that did not have SOX gene expression (Figure 2D).
      explanation: Single-cell expression associations support a developmental hypothesis; no BABS perturbation was tested.
  evidence:
  - reference: PMID:33806076
    reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: To test the hypothesis that ODC1 expression correlates with the maturity of neurons, we developed induced pluripotent stem cells (iPSCs) differentiated into cerebral organoids followed by single cell RNA-Seq.
    explanation: The study generated organoids; it was not solely a reanalysis of published organoid data.
- name: Engineered murine ODC C-terminal truncation in mammalian cells
  experimental_model_type: OTHER
  cell_source: Mammalian cells expressing engineered murine ODC
  description: Deletion of the final 37 residues stabilized ODC in a classical cellular experiment. This demonstrates the function of the C-terminal degradation region, but is not a patient-derived BABS model and is not the same truncation length as p.Lys448Ter.
  publication: PMID:2928784
  modeled_mechanisms:
  - target: Escape from Antizyme-Mediated Proteasomal Degradation
    relationship: PERTURBS
    description: Engineered tail deletion increases intracellular stability; the quoted experiment does not isolate antizyme binding as the affected step.
    evidence:
    - reference: PMID:2928784
      reference_title: Prevention of rapid intracellular degradation of ODC by a carboxyl-terminal truncation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Ornithine decarboxylase (ODC) was converted from a protein with a short intracellular half-life in mammalian cells to a stable protein by truncating 37 residues at its carboxyl terminus.
      explanation: An engineered truncation establishes the contribution of the C terminus to ODC turnover.
  evidence:
  - reference: PMID:2928784
    reference_title: Prevention of rapid intracellular degradation of ODC by a carboxyl-terminal truncation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Thus, a carboxyl-terminal domain is responsible for the rapid intracellular degradation of murine ODC.
    explanation: Cellular turnover experiment; human tissue consequences are not assessed.

  biological_scale: CELLULAR
  description: 'ODC1 expression during fetal brain development and in cerebral organoids associates with neural progenitor cell proliferation, and gain-of-function variants are proposed to produce neural over-proliferation. This node is the weakest link in the chain: the human neurodevelopmental phenotype is not yet mechanistically connected to a measured progenitor abnormality in BABS patient tissue.'

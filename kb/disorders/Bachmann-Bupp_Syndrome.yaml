- name: Hair Follicle Dysfunction
  biological_scale: TISSUE
  description: Constitutive expression of truncated ODC in outer root sheath keratinocytes disrupts hair cycling in K6/ODC mice. Hair loss after the first cycle resembles the postnatal alopecia in BABS. A separate inducible ODC-ER model recruits bulge stem cells while retaining a normal skin phenotype, so recruitment is not established as the cause of BABS alopecia.
  cell_types:
  - preferred_term: outer root sheath cell
    term:
      id: CL:0002561
      label: outer root sheath cell

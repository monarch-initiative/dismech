    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These transgenic mice have a normal first hair cycle, but lose their hair completely beginning 2-3 wk after birth.
    explanation: Establishes the hair-cycle-specific timing of the defect in the model that carries the same class of lesion.

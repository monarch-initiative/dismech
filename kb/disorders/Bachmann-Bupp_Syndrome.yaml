    snippet: "The finding of abnormal polyamine pathway metabolites (including increased N-acetylputrescine) on metabolomic profiling is suggestive of a diagnosis of BABS."
    explanation: >-
      GeneReviews uses this metabolite as the biochemical trigger for genetic
      confirmation.
- name: Elevated erythrocyte and fibroblast ODC enzyme activity
  notes: >-
    ODC catalytic activity measured by a 14C-ornithine radiolabelled assay is

      explanation: The polyaminopathy review places BABS within the family of disorders of polyamine metabolism.
notes: Reported cohorts are very small, overlap across publications, and include a stillborn fetus. Frequencies describe the cited series and are not population estimates. Clinical and biochemical effects of ODC1 variants require allele-specific interpretation; an ODC1 finding alone does not establish BABS. The skin-restricted K6/ODC model supports the ectodermal mechanism but does not establish the neural mechanism or cancer risk in affected humans.

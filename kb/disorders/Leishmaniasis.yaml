diagnosis:
- name: Parasitological demonstration (microscopy and culture)
  description: >-
    Leishmania amastigotes are demonstrated by microscopy of stained smears,
    and parasites isolated by in vitro culture, from tissue. For visceral
    leishmaniasis the specimen is an aspirate of spleen, bone marrow or lymph
    node, bone marrow being the preferred first source, or buffy coat in
    immunocompromised patients; microscopy of aspirates is the classical
    confirmatory test, most sensitive on spleen. For cutaneous and mucosal
    leishmaniasis the specimen is lesion tissue. Culture also yields an
    isolate for species identification.
  measurements:
  - preferred_term: Leishmania microscopy
    term:
      id: LOINC:51709-4
      label: Leishmania sp identified in Specimen by Giemsa stain
  - preferred_term: Leishmania culture
    term:
      id: LOINC:51710-2
      label: Leishmania sp identified in Specimen by Organism specific culture
  notes: >-
    Two measurements, one per assay. Stain and culture are each test's
    identity, so the unspecified-specimen stain and culture codes are bound
    rather than the method-less tissue identification code, which would not
    say how the parasite was demonstrated, or the tissue-, blood- and
    bone-marrow-specific variants, which would split one test across
    specimens. Qualitative results; no reference_ranges.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The visualization of the amastigote form of the parasite by microscopic
      examination of aspirates from lymph nodes, bone marrow or spleen is the
      classical confirmatory test for VL.
    explanation: >-
      Names microscopy of tissue aspirates as the classical confirmatory test
      for visceral leishmaniasis.
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We recommend the collection of tissue aspirates or biopsy specimens for
      smears, histopathology, parasite culture, and molecular testing
    explanation: >-
      The IDSA/ASTMH guideline names smears and culture of tissue aspirates or
      biopsies as visceral leishmaniasis tests.
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bone marrow aspiration is the preferred first source of a diagnostic
      sample.
    explanation: >-
      Gives bone marrow as the preferred visceral leishmaniasis specimen.
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tissue specimens should be collected from a lesion(s) when a clinical
      suspicion for CL exists.
    explanation: >-
      For cutaneous leishmaniasis the diagnostic specimen is lesion tissue.
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If Leishmania parasites are isolated in culture, reference laboratories
      can identify the species by DNA-based assays or isoenzyme analysis
    explanation: >-
      Culture isolates the parasite and allows species identification.
- name: Leishmania nucleic acid amplification testing
  description: >-
    PCR detection of Leishmania DNA is the most sensitive test available, more
    sensitive than microscopy, and is performed on the same tissue specimens
    as microscopy and culture in both visceral and cutaneous disease. In
    visceral leishmaniasis it also performs well on peripheral blood.
    DNA-based assays also identify the infecting species.
  measurements:
  - preferred_term: Leishmania DNA
    term:
      id: LOINC:23159-7
      label: Leishmania sp DNA [Identifier] in Specimen by NAA with probe detection
  notes: >-
    The Monarch KG has no method-less Leishmania DNA presence code (searches
    "Leishmania DNA", "Leishmania sp DNA [Presence]", "Leishmania sp DNA
    [Presence] in Specimen", "Leishmania DNA Molecular genetics method"). The
    unspecified-specimen NAA code is bound because the test is run on tissue
    for cutaneous disease and on aspirate or blood for visceral disease; the
    blood-only presence codes would exclude lesion tissue. It is an identifier
    code with probe detection, the only unspecified-specimen Leishmania NAA
    code returned. Qualitative result; no reference_ranges.
  evidence:
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular amplification assays typically should be performed because
      they are the most sensitive Leishmania tests currently available
    explanation: >-
      The IDSA/ASTMH guideline recommends molecular amplification as the most
      sensitive Leishmania test.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The detection of parasites in the blood or organs by culture or by using
      molecular techniques such as PCR is more sensitive than microscopic
      examination
    explanation: >-
      PCR and culture are more sensitive than microscopy for visceral
      leishmaniasis.
  - reference: PMID:30712769
    reference_title: "Visceral Leishmaniasis: Recent Advances in Diagnostics and Treatment Regimens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      conventional and real-time polymerase chain reaction, which also
      performs well on peripheral blood
    explanation: >-
      PCR for visceral leishmaniasis works on peripheral blood as well as on
      tissue.
- name: rK39 rapid antibody test
  description: >-
    An immunochromatographic dipstick detecting antibody to rK39, a
    kinesin-related antigen conserved within the L. donovani complex, used for
    the primary diagnosis of visceral leishmaniasis. A meta-analysis gave
    sensitivity of 93.9% and specificity of 95.3%; accuracy is lower in East
    Africa than in the Indian subcontinent. It is a visceral leishmaniasis
    test; serology is not recommended for cutaneous leishmaniasis.
  measurements:
  - preferred_term: rK39 antibody
    term:
      id: LOINC:43266-6
      label: Leishmania chagasi K39 Ab [Presence] in Serum
  notes: >-
    The method-less K39 antibody presence code is bound for the rK39 test.
    Qualitative result; no reference_ranges.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A meta-analysis that included 13 validation studies of the rK39 ICT
      showed sensitivity and specificity estimates of 93.9% (95% CI,
      87.7–97.1) and 95.3% (95% CI, 88.8–98.1), respectively
    explanation: >-
      Pooled accuracy of the rK39 immunochromatographic test for visceral
      leishmaniasis.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, this test has been shown to be less accurate in East Africa
    explanation: >-
      The rK39 test is less accurate in East Africa.
- name: Leishmania antibody serology
  description: >-
    Antibody detection by direct agglutination test (DAT), indirect
    fluorescent antibody, ELISA or western blot supports visceral
    leishmaniasis where parasitological and molecular tests cannot be done or
    are negative. Antibody persists for years after cure, so serology cannot
    diagnose relapse, and it may be undetectable in immunocompromised
    patients. Serology is not recommended for cutaneous leishmaniasis, for
    which available assays are neither sensitive nor specific.
  measurements:
  - preferred_term: Leishmania antibody
    term:
      id: LOINC:7958-2
      label: Leishmania sp Ab [Presence] in Serum
  notes: >-
    The method-less genus-level antibody presence code is bound rather than
    one code per method (agglutination, immunofluorescence, immunoassay) or
    per species. No reference_ranges: the DAT positivity titre is set per
    assay, and the 1:800 or 1:1600 single dilution the cited review gives is
    the operating cut-off of the fast agglutination screening test, a product
    format, not a guideline threshold for the disease.
  evidence:
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serologic testing is recommended for persons with suspected VL in whom
      definitive diagnostic tests for the parasite (microscopic
      identification, culture, and molecular tests for parasite DNA) cannot be
      conducted or have negative results.
    explanation: >-
      The IDSA/ASTMH guideline places serology as a visceral leishmaniasis
      test where parasite tests are unavailable or negative.
  - reference: PMID:27927991
    reference_title: "Diagnosis and Treatment of Leishmaniasis: Clinical Practice Guidelines by the Infectious Diseases Society of America (IDSA) and the American Society of Tropical Medicine and Hygiene (ASTMH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serologic testing is not recommended as part of the diagnostic
      evaluation for CL. The currently available serologic assays are neither
      sensitive nor specific for the diagnosis of CL
    explanation: >-
      Serology is a visceral, not a cutaneous, leishmaniasis test.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Serological tests based on indirect fluorescence antibody (IFA),
      enzyme-linked immunosorbent assay (ELISA) or western blot have shown
      high diagnostic accuracy in most studies but are poorly adapted to field
      settings
    explanation: >-
      Names the laboratory antibody assays for visceral leishmaniasis.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therefore, VL relapse cannot be diagnosed by serology.
    explanation: >-
      Antibody persistence after cure limits serology to primary diagnosis.

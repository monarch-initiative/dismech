pathophysiology:
- name: Intracellular amastigote replication in macrophages
  description: Promastigotes differentiate into amastigotes that multiply inside host macrophages.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:33968798
    reference_title: "Involvement of Leishmania Phosphatases in Parasite Biology and Pathogeny."
    supports: SUPPORT
    snippet: "Inside vertebrate host macrophages, the parasites can differentiate into the amastigote form and multiply"
    explanation: The abstract describes amastigote differentiation and replication in macrophages.
- name: Th1/Th2 Immune Response Dichotomy
  biological_scale: CELLULAR
  description: >-
    Resolution versus progression of leishmanial infection tracks with the
    balance of T-helper cytokine responses: in the murine model, a Th1
    response controls infection while a Th2 response is associated with
    disease progression. This dichotomy is less distinct in humans, so the
    murine model does not strictly translate to human leishmaniasis.
  evidence:
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "In murine model, the development of Thl response is associated with control of infection, and Th2 response is associated with disease progression. However, Th1 and Th2 dichotomy in the human system is not as distinct as in mice and the murine model does not strictly apply to human leishmaniasis."
    explanation: >-
      The Th1-control/Th2-progression dichotomy is demonstrated in the murine
      model; the review explicitly cautions that the human dichotomy is less
      distinct and the mouse model does not directly translate, so support is
      marked PARTIAL rather than SUPPORT.

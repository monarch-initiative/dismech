    reference_title: "Leishmaniasis."
    supports: SUPPORT
    snippet: "The transmission is from female sandfly through a blood meal."
    explanation: The abstract specifies sand fly blood-meal transmission.
has_subtypes:
- name: Visceral leishmaniasis
  subtype_term:
    preferred_term: visceral leishmaniasis
    term:
      id: MONDO:0005445
      label: visceral leishmaniasis
  description: >-
    The most severe clinical form, with disseminated infection of the
    reticuloendothelial system. Immunosuppressed patients, including those
    with HIV co-infection or after solid organ transplantation, are prone to
    infection as well as atypical and severe courses.
  evidence:
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    snippet: "It manifests mainly in 3 clinical forms; visceral leishmaniasis (VL), cutaneous leishmaniasis (CL) and mucocutaneous leishmaniasis (MCL)"
    explanation: The review lists visceral leishmaniasis as a main clinical form.
  - reference: PMID:31297548
    reference_title: "[Visceral leishmaniasis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunosuppressed patients with HIV co-infection or after solid organ transplantation are prone to infection as well as atypical and severe courses."
    explanation: Documents HIV co-infection and transplant-related immunosuppression as risk factors for atypical, severe visceral leishmaniasis.

- accession: geo:GSE290027
  title: IL-32 producing CD8+ memory T cells and Tregs define the IDO1 / PD-L1 niche in human cutaneous leishmaniasis skin lesions
  description: Human cutaneous leishmaniasis (CL) is characterised by chronic skin pathology. Experimental and clinical data suggest that immune checkpoints (ICs) play a crucial role in disease outcome but the cellular and molecular niches that facilitate IC expression during leishmaniasis are ill-defined. We previously showed that in Sri Lankan patients with CL, indoleamine 2,3-dioxygenase 1 (IDO1) and programmed death-ligand 1 (PD-L1) are enriched in lesion skin and that reduced PD-L1 expression early after treatment onset predicted cure rate following antimonial therapy.

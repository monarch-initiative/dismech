    snippet: "It manifests mainly in 3 clinical forms; visceral leishmaniasis (VL), cutaneous leishmaniasis (CL) and mucocutaneous leishmaniasis (MCL)"
    explanation: The review lists mucocutaneous leishmaniasis as a main clinical form.
pathophysiology:
- name: Intracellular amastigote replication in macrophages
  description: Promastigotes differentiate into amastigotes that multiply inside host macrophages.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:33968798
    reference_title: "Involvement of Leishmania Phosphatases in Parasite Biology and Pathogeny."
    supports: SUPPORT
    snippet: "Inside vertebrate host macrophages, the parasites can differentiate into the amastigote form and multiply"
    explanation: The abstract describes amastigote differentiation and replication in macrophages.
  downstream:
  - target: Th1-Polarized Cell-Mediated Response and Macrophage Activation
    description: >-
      Intracellular infection of macrophages engages cell-mediated immunity:
      resolution of infection depends on activation of targeted T-cell
      populations for cytokine production and on activation of macrophages.
      This is the protective arm of the response.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - activation of targeted T-cell populations for appropriate cytokine production
    evidence:
    - reference: PMID:19634705
      reference_title: "Immunobiology of leishmaniasis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Resolution of leishmanial infection is dependent on the coordinated interactions between components of cell mediated immune response, specifically the activation of targeted T-cell populations for appropriate cytokine production and activation of macrophages."
      explanation: >-
        Links the intracellular infection to the cell-mediated arm — T-cell
        activation with cytokine production and macrophage activation — as the
        route by which infection is resolved.
  - target: Th2-Polarized Response and Permissive Disease Progression
    description: >-
      The same infection can instead drive a Th2-polarized T-helper response,
      which in the murine model is associated with disease progression rather
      than control.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19634705
      reference_title: "Immunobiology of leishmaniasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Th2 response is associated with disease progression"
      explanation: >-
        Attests the Th2-progression association in the murine model, while the
        review also states the dichotomy is less distinct in humans.
  - target: Cutaneous macrophage infection and ulcerative inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Parasite persistence in dermal macrophages can progress to ulcerative cutaneous leishmaniasis.
  - target: Visceral reticuloendothelial infection and systemic inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Parasite infection of reticuloendothelial tissues produces visceral leishmaniasis.
  - target: Mucosal destructive granulomatous inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mucosal leishmanial disease can progress to destructive nasal and oropharyngeal inflammation.
- name: Th1-Polarized Cell-Mediated Response and Macrophage Activation
  biological_scale: CELLULAR
  role: Protective
  description: >-
    The protective arm of the T-helper response. Activation of targeted T-cell
    populations with appropriate cytokine production, together with activation
    of macrophages, underlies resolution of leishmanial infection; in the murine
    model, development of a Th1 response is associated with control of
    infection. This node therefore restrains the intracellular
    amastigote-replication node rather than promoting it.
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Resolution of leishmanial infection is dependent on the coordinated interactions between components of cell mediated immune response, specifically the activation of targeted T-cell populations for appropriate cytokine production and activation of macrophages."
    explanation: >-
      States that infection resolution depends on cell-mediated immunity —
      T-cell activation with cytokine production plus macrophage activation.
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "In murine model, the development of Thl response is associated with control of infection"
    explanation: >-
      Attests the Th1-control association, but in the murine model only; the
      same review cautions that the human dichotomy is less distinct. See the
      `leishmaniasis_th1_th2_murine_mismatch` discussion.
- name: Th2-Polarized Response and Permissive Disease Progression
  biological_scale: CELLULAR
  role: Permissive
  description: >-
    The permissive arm of the T-helper response. In the murine model, a Th2
    response is associated with disease progression rather than control of
    infection. Human data are less clear-cut, so this node is curated as a
    model-derived mechanism, not an established human one.
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 type immune response
    term:
      id: GO:0042092
      label: type 2 immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Th2 response is associated with disease progression"
    explanation: >-
      Attests the Th2-progression association in the murine model, while the
      same review states the Th1/Th2 dichotomy is less distinct in humans and
      the murine model does not strictly apply. See the
      `leishmaniasis_th1_th2_murine_mismatch` discussion.
- name: Cutaneous macrophage infection and ulcerative inflammation
  description: >-
    Persistence of intracellular amastigotes in skin macrophages can produce
    localized cutaneous inflammation with ulceration.
  evidence:
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cutaneous leishmaniasis usually has milder course and often results into a self-healing of ulcers."
    explanation: Supports ulcer formation in cutaneous leishmaniasis.
  downstream:
  - target: Cutaneous ulcers
    description: Cutaneous leishmaniasis can result in skin ulcers.
- name: Visceral reticuloendothelial infection and systemic inflammation
  description: >-
    Visceral leishmaniasis reflects parasite invasion of the reticuloendothelial
    system, producing systemic infection with fever, hepatosplenomegaly,
    pancytopenia, and weight loss.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "parasitic invasion of the blood and reticulo-endothelial system (that is, the general phagocytic system), such as enlarged lymph nodes, spleen and liver."
    explanation: Supports reticuloendothelial-system invasion in visceral leishmaniasis.
  - reference: PMID:31297548
    reference_title: "[Visceral leishmaniasis]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main clinical symptoms are fever, hepatosplenomegaly and pancytopenia."
    explanation: Supports the main systemic manifestations of visceral leishmaniasis.
  downstream:
  - target: Fever
    description: Visceral leishmaniasis commonly presents with fever.
  - target: Hepatosplenomegaly
    description: Reticuloendothelial infection enlarges the liver and spleen.
  - target: Pancytopenia
    description: Visceral leishmaniasis commonly presents with pancytopenia.
  - target: Weight loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Persistent visceral infection can manifest as weight loss.
- name: Mucosal destructive granulomatous inflammation
  description: >-
    Mucocutaneous leishmaniasis causes granulomatous inflammation and chronic
    destruction of nasal, oral, and pharyngeal mucosal tissues.
  biological_processes:
  - preferred_term: granuloma formation
    term:
      id: GO:0002432
      label: granuloma formation
  evidence:
  - reference: DOI:10.1111/ddg.15424
    reference_title: 'Treatment of mucocutaneous leishmaniasis - A systematic review'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "characterized by granulomatous, destructive mucosal lesions in the oral, nasal, and pharyngeal cavities"
    explanation: Supports destructive granulomatous nasal and oropharyngeal mucosal involvement.
  downstream:
  - target: Nasal mucosal ulceration
    description: Destructive nasal mucosal disease can present as nasal ulceration.

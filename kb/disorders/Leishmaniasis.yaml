- accession: geo:GSE324689
  title: Post Kala Azar Dermal Leishmaniasis (PKDL) genome wide transcriptional profiling by bulk RNA-sequencing
  description: Post-kala-azar dermal leishmaniasis (PKDL), a dermal sequel of visceral leishmaniasis (VL), is considered an important reservoir that facilitates the transmission of VL. Although PKDL lesions demonstrate an overwhelming infiltration of CD8⁺ T cells, the molecular mechanisms regulating their recruitment to the skin remain poorly defined. To address this, bulk RNA sequencing was performed on dermal lesions from patients withPKDL and healthy controls to characterize the lesional chemokine and cytokine landscape associated with T-cell homing.Transcriptomic analysis revealed a significant upregulation of genes encoding T-cell chemoattractants, including CCL3, CCL4, CCL5, CCL17, CXCL9, and CXCL10,...

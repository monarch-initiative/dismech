- accession: ega:EGAS00001004596
  title: A GWAS for cutaneous leishmaniasis in Brazil
  description: Our goal was to identify genetic risk factors for cutaneous leishmaniasis (CL) caused by Leishmania braziliensis. Genotyping 2066 CL cases and 2046 controls using Illumina HumanCoreExomeBeadChips provided data for 4,498,586 imputed single nucleotide variants (SNVs). Genome-wide association testing using linear mixed models took account of genetic diversity/ethnicity/admixture. Post-GWAS positional, expression quantitative trait locus (eQTL), and chromatin interaction mapping was performed in FUMA. Transcriptional data were compared between lesions and normal skin, and cytokines measured using flow cytometry and Bioplex assay.

progression:
- phase: Incubation (visceral leishmaniasis)
  subtype: Visceral leishmaniasis
  notes: >-
    Typically 6 weeks to 6 months from sand fly inoculation to symptomatic
    visceral disease, with well-documented longer intervals (7 and 15 months
    in twin children infected on the same trip). Many infections remain
    asymptomatic.
  evidence:
  - reference: PMID:30285634
    reference_title: "Double trouble: visceral leishmaniasis in twins after traveling to Tuscany - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The incubation period is typically described between 6 weeks to 6 months."
    explanation: States the usual incubation range of visceral leishmaniasis.
  - reference: PMID:30285634
    reference_title: "Double trouble: visceral leishmaniasis in twins after traveling to Tuscany - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "who developed visceral leishmaniasis 7 and 15 months after travelling to Tuscany"
    explanation: Documents incubation intervals longer than the usual range in two related children.
- phase: Progressive febrile visceral disease
  subtype: Visceral leishmaniasis
  notes: >-
    Kala-azar: prolonged fever, hepatosplenomegaly and pancytopenia
    progressing over weeks to months; fatal if untreated, and spontaneous
    cure is extremely rare.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VL is a systemic disease that is fatal if left untreated"
    explanation: Establishes the progressive, lethal course of untreated visceral disease.
  - reference: PMID:31297548
    reference_title: "[Visceral leishmaniasis]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main clinical symptoms are fever, hepatosplenomegaly and pancytopenia."
    explanation: Names the clinical triad of the febrile visceral phase.
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VL is lethal if untreated and spontaneous cure is extremely rare."
    explanation: Confirms that the visceral phase does not resolve spontaneously.
- phase: Post-kala-azar dermal leishmaniasis
  subtype: Visceral leishmaniasis
  duration: 0-6 months after treated VL in Sudan; 6 months to 3 years in India
  notes: >-
    A recognised sequel phase of visceral leishmaniasis: a macular,
    maculopapular or nodular rash appearing after treatment, most often in
    Sudan and the Indian subcontinent. Lesions are parasite-rich, and PKDL
    cases are the putative inter-epidemic reservoir of anthroponotic VL.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PKDL is characterized by a macular, maculo-papular or nodular rash and is a complication of VL that is frequently observed after treatment in Sudan and more rarely in other East African countries and in the Indian subcontinent"
    explanation: Defines PKDL as a post-treatment sequel of visceral disease.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The interval between treated VL and PKDL is 0–6 months in Sudan and 6 months to 3 years in India."
    explanation: Gives the interval from treated visceral disease to PKDL by region.
- phase: Incubation (cutaneous leishmaniasis)
  subtype: Cutaneous leishmaniasis
  notes: >-
    Skin lesions appear 1 to 4 months after the infective bite in most
    cases, and in rare cases not until years later.
  evidence:
  - reference: DOI:10.36877/pmmb.a0000395
    reference_title: 'Cutaneous Leishmaniasis: Physiopathology, Molecular Diagnostic, and Therapeutic Approaches'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cutaneous leishmaniasis is characterized by the tendency of skin lesions to spontaneously heal over a period of 2 to 10 months, with an incubation period ranging from 1 to 4 months."
    explanation: Gives the incubation range of cutaneous disease.
  - reference: DOI:10.36877/pmmb.a0000395
    reference_title: 'Cutaneous Leishmaniasis: Physiopathology, Molecular Diagnostic, and Therapeutic Approaches'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These skin lesions tend to appear several weeks or months after exposure, although, in rare cases, they may not manifest until years later."
    explanation: Records the occasional very long interval before lesions appear.
- phase: Papule to nodule to ulcer
  subtype: Cutaneous leishmaniasis
  notes: >-
    The lesion begins as an erythematous papule at the bite site, enlarges
    into a nodule or plaque and typically ulcerates.
  evidence:
  - reference: DOI:10.36877/pmmb.a0000395
    reference_title: 'Cutaneous Leishmaniasis: Physiopathology, Molecular Diagnostic, and Therapeutic Approaches'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms often begin with the appearance of an erythematous papule, which may transform into a plaque or ulcer as the disease progresses."
    explanation: Describes the papule-to-ulcer evolution of the cutaneous lesion.
- phase: Spontaneous healing and scarring
  subtype: Cutaneous leishmaniasis
  duration: 2 to 10 months to spontaneous healing
  notes: >-
    Ulcers of localised cutaneous leishmaniasis heal slowly without
    treatment in immunocompetent hosts but leave atrophic, disfiguring scars.
  evidence:
  - reference: DOI:10.36877/pmmb.a0000395
    reference_title: 'Cutaneous Leishmaniasis: Physiopathology, Molecular Diagnostic, and Therapeutic Approaches'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cutaneous leishmaniasis is characterized by the tendency of skin lesions to spontaneously heal over a period of 2 to 10 months, with an incubation period ranging from 1 to 4 months."
    explanation: Gives the time to spontaneous healing.
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The ulcers heal spontaneously — although slowly — in immunocompetent individuals, but cause disfiguring scars."
    explanation: Documents slow spontaneous healing with scarring.
  - reference: PMID:19634705
    reference_title: "Immunobiology of leishmaniasis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cutaneous leishmaniasis usually has milder course and often results into a self-healing of ulcers."
    explanation: Confirms the self-healing course of cutaneous ulcers.
- phase: Mucosal spread (mucocutaneous leishmaniasis)
  subtype: Mucocutaneous leishmaniasis
  duration: Months to years after a first cutaneous episode
  notes: >-
    In Leishmania braziliensis infection, progressively destructive,
    non-healing ulceration of the nasal and oropharyngeal mucosa appears
    months or years after an initial cutaneous lesion, when mucosal
    macrophages become colonised.
  evidence:
  - reference: PMID:17938629
    reference_title: "Visceral leishmaniasis: what are the needs for diagnosis, treatment and control?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These lesions are not self-healing and are usually seen months or years after a first episode of cutaneous leishmaniasis, when the macrophages of the naso-oropharyngeal mucosa become colonized."
    explanation: Times mucosal disease relative to the preceding cutaneous episode.

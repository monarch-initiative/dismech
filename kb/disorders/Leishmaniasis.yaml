datasets:
- accession: geo:GSE220308
  title: Stratification of expression profiles of immune-related genes in the lesion of cutaneous leishmaniasis patients with L. major and L. tropica infection
  description: There is still no reliable human vaccination against cutaneous leishmaniasis (CL), a serious public health issue in many parts of underdeveloped nations like Morocco and Iran. There are few studies comparing the expression of immune-related genes in the skin lesions of CL patients infected with L. major and L. tropica. In this study, we used dcRT-MLPA to analyze the expression profiles of 144 immune response-related genes in CL patients from Morocco and Iran who had been exposed to L. major and L. tropica, respectively.

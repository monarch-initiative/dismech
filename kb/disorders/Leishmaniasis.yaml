- accession: ega:EGAS00001000773
  title: WTCCC2 Visceral Leishmaniasis (VL) samples
  description: A WTCCC2 project genome-wide association study for visceral leishmaniasis (VL) in individuals from India, Brazil and Sudan, genotyped on the custom Illumina 670k array. The WTCCC2 analysis of the Brazilian and Indian samples is described in Fakiola et al. [Nat Genet. 2013 Feb;45(2):208-13].It should be noted that due to expected family structure in the data, normal analyses of these data should include an estimation of the relatedness between the samples. For more details about sample collection for the project please refer to the Methods section of the paper above. The samples from India were all collected from Bihar state in northeastern India.

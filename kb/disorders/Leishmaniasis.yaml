- accession: ega:EGAS00001004152
  title: Transcriptomic signatures of CD4+ T cells from visceral leishmaniasis (VL) patients
  description: Bulk RNA-sequencing was performed on CD4+ T cells isolated from the blood of visceral leishmaniasis patients (n = 12) and endemic controls (EC; n = 12). CD4+ T cells were obtained by magnetic-activated cell sorting (MACS). Alterations in the transcripts of T helper (Th) cells during infection were identified.

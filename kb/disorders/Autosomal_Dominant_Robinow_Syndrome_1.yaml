- name: Genital morphogenetic disruption
  role: effector
  biological_scale: ORGANISM
  description: >-
    Abnormal external genital development causes hypoplasia in both sexes. Micropenis must be distinguished
    clinically from a normally sized but webbed or embedded penis; the latter is an anatomical insertion abnormality.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      genital abnormalities (in males: micropenis / webbed penis, hypoplastic scrotum, cryptorchidism; in females:
      hypoplastic clitoris and labia majora)
    explanation: The GeneReviews description of the genital phenotype in both sexes.
    quote_role: REVIEW_SYNTHESIS

  name: Mesomelic Limb Shortening
  frequency: VERY_FREQUENT
  description: Shortening of the middle limb segments - forearm and lower leg - with upper-limb predominance.
    The mesomelic pattern is the skeletal signature of this condition and what distinguishes it from
    proportionate short stature.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: mesomelic limb shortening predominantly of the upper limbs
    explanation: States both the mesomelic pattern and its upper-limb predominance.
- category: Growth
  name: Short Stature
  frequency: VERY_FREQUENT
  description: Short stature, largely a consequence of the limb shortening. Notably preserved in
    the DVL1 form, which is one of the features separating that gene's phenotype from this one.
  phenotype_term:
    preferred_term: Short stature
    term:

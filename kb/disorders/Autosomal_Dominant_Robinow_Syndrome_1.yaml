    supports: SUPPORT
    evidence_source: OTHER
    snippet: mesomelic limb shortening predominantly of the upper limbs
    explanation: >-
      States both the mesomelic pattern and its upper-limb predominance. This chapter covers dominant Robinow
      syndrome across genes; it is not a WNT5A-specific frequency estimate.
    quote_role: REVIEW_SYNTHESIS
- category: Growth
  name: Short Stature
  description: >-
    Short stature from abnormal skeletal development. A subset of DVL1-associated cases has low-normal stature,
    but normal height is not a universal DVL1 discriminator. Short stature is usually evident at birth and
    persists into adulthood.

genetic:
- name: WNT5A
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: WNT5A
    term:
      id: hgnc:12784
      label: WNT5A
  notes: >-
    WNT5A variants include missense substitutions, often involving cysteines, and selected in-frame variants.
    Inherited, de novo and mosaic presentations occur. In the 2018 cohort a de novo c.487_492dup (NM_003392.4;
    p.Gly163_Cys164dup) was found in 16/70 mapped reads (23%), consistent with blood mosaicism. This is not
    a germline transmission probability. Biallelic loss-of-function disease is a distinct, more severe allelic
    presentation. Protein folding, secretion and signaling can all be affected; a uniformly secreted but merely
    less active ligand is not established.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that two different missense mutations in WNT5A, which result in amino acid substitutions of highly
      conserved cysteines, are associated with autosomal dominant Robinow syndrome
    explanation: The gene-disease assignment and the variant class.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through molecular
      genetic testing
    explanation: >-
      Cross-gene GeneReviews diagnostic statement; the WNT5A component applies here. The chapter-era gene list
      is not a complete current differential.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The majority of WNT5A variants involve substitution or creation of a cysteine residue.
    explanation: >-
      Primary variant compilation; the paper also includes a biallelic frameshift and a Cys154Phe family classified
      as VUS in its table, so not every compiled variant is promoted to an established dominant cause.
    quote_role: PRIMARY_RESULT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC5777383/
    reference_title: WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The variant was observed in 16/70 (23%) mapped reads, which is consistent with a mosaic state of the
      mutant allele.
    explanation: >-
      WNT5A c.487_492dup in the 2018 cohort; this is a read fraction in sampled DNA, not the fraction of germ
      cells or transmission risk.
  - reference: PMID:29575631
    reference_title: Biallelic loss-of-function WNT5A mutations in an infant with severe and atypical manifestations of Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The parents, who are both heterozygous for the deletion, appear clinically unaffected.
    explanation: >-
      The severe homozygous frameshift case supports distinction from selected dominant missense/in-frame variants;
      one family is not proof that every heterozygous null is benign.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission, with inherited and de novo cases and variable expressivity. Each child
    of a heterozygous affected individual has a 50% chance of inheriting the variant; severity is not predicted
    reliably. The fraction of de novo cases is unknown. Parental examination and testing can identify mild
    disease or mosaicism; blood-negative parents do not exclude germline mosaicism.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with ADRS has a 50% chance of inheriting the pathogenic variant; however,
      the severity of the clinical manifestations cannot be predicted from the results of molecular genetic
      testing.
    explanation: >-
      The GeneReviews Genetic Counseling statement, giving both the recurrence risk and the limit on genotype-based
      prognosis.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The proportion of cases caused by a de novo pathogenic variant is unknown.
    explanation: Do not substitute the research report's unsupported 50% de novo estimate.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Clinical recognition of Robinow syndrome should be followed by molecular testing that distinguishes WNT5A-related
    disease from overlapping forms. A heterozygous pathogenic or likely pathogenic WNT5A variant supports this
    specific diagnosis; a VUS neither establishes nor excludes it. A multigene skeletal-dysplasia/Robinow panel
    or exome/genome analysis can assess WNT5A, DVL1/DVL3, FZD2 and recessive ROR2/NXN disease, with gene content
    updated by the laboratory. Ensure adequate coverage and small-indel detection; a negative result does not
    settle a different molecular etiology.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a proband with typical suggestive
      findings and/or by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of a heterozygous DVL1, DVL3, or WNT5A variant of uncertain significance does not establish
      or rule out the diagnosis.
    explanation: Variant uncertainty must remain distinct from molecular confirmation.
- name: Baseline organ and skeletal evaluation
  description: >-
    Assess skeletal extent with radiographs of limbs, chest, vertebrae and skull. Obtain echocardiography,
    renal ultrasound and hearing assessment; consider pelvic ultrasound for females and urologic/endocrine
    evaluation for genital abnormalities. Assess dental/craniofacial findings and development. These are cross-genotype
    baseline recommendations, not assertions that every feature is frequent in WNT5A disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Renal ultrasound To assess for renal anomalies & hydronephrosis
    explanation: >-
      GeneReviews baseline evaluation table; the small 2022 WNT5A subgroup had no renal anomalies among six
      assessed, which does not eliminate the rationale for baseline screening.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiovascular Echocardiogram To evaluate for congenital heart defect
    explanation: >-
      Baseline echocardiography differs from subsequent specialist monitoring only when abnormalities are found.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Radiographs of limbs, chest, vertebrae, & skull To establish the extent of skeletal involvement
    explanation: >-
      Baseline skeletal characterization can detect vertebral complications without asserting they arise directly
      from a growth-plate lesion.
treatments:
- name: Corrective Surgery for Genital and Orofacial Anomalies
  therapeutic_modality: SURGERY
  description: >-
    Surgical correction of cryptorchidism, abnormal penile insertion or penoscrotal position, and cleft lip
    or palate where present addresses established anatomical abnormalities.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Cryptorchidism
    description: >-
      Corrective surgery addresses anatomical manifestations; it does not reverse the prenatal signaling defect.
  - target: Craniofacial morphogenetic disruption
    description: >-
      Corrective surgery addresses anatomical manifestations; it does not reverse the prenatal signaling defect.
  - target: Genital morphogenetic disruption
    description: >-
      Corrective surgery addresses anatomical manifestations; it does not reverse the prenatal signaling defect.
  - target: Cleft lip
    description: Repairs an existing anatomical cleft where present.
  - target: Cleft palate
    description: Repairs an existing anatomical cleft where present.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Corrective surgeries as needed for cryptorchidism, abnormal penile insertion / penoscrotal position,
      and cleft lip/palate.
    explanation: The GeneReviews Management recommendation for the surgical manifestations.
    quote_role: REVIEW_SYNTHESIS
- name: Structured Multisystem Surveillance
  therapeutic_modality: OTHER
  description: >-
    Measure head circumference through infancy and childhood. Assess development every three months in infancy
    and every six to twelve months thereafter. Arrange dental review every six to twelve months, periodic hearing
    assessment in childhood, and specialist cardiac or renal monitoring if abnormalities are identified. These
    are GeneReviews recommendations across dominant Robinow genotypes.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Measurement of head circumference regularly in infancy and throughout childhood. Developmental assessment
      every three months in infancy and every six months to one year thereafter
    explanation: The GeneReviews Surveillance schedule, quoted for the elements it specifies by interval.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dental evaluation every six to 12 months or as recommended. Periodic hearing assessments in childhood.
      Regular cardiac and renal assessment as needed by respective specialists if abnormalities are identified.
    explanation: >-
      GeneReviews clinical baseline across dominant Robinow genotypes; no WNT5A-specific frequency is inferred.
- name: Orthodontic Treatment
  therapeutic_modality: DEVICE
  description: >-
    Orthodontic management is typically required, reflecting the dental crowding, malocclusion, hypodontia
    and delayed eruption that accompany the craniofacial phenotype.
  treatment_term:
    preferred_term: orthodontic treatment
    term:
      id: NCIT:C64248
      label: Orthodontic Treatment
  target_mechanisms:
  - target: Craniofacial morphogenetic disruption
    description: Addresses the dental consequences of abnormal craniofacial development.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Orthodontic treatment is typically required.
    explanation: The GeneReviews Management statement on orthodontic need.
    quote_role: REVIEW_SYNTHESIS
- name: Growth Hormone Therapy (selected patients)
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Consider growth hormone replacement when endocrine evaluation demonstrates deficiency. A small 1999 clinical
    series reported increased growth velocity in treated patients, but their molecular subtypes were uncharacterized.
    This supports selected treatment of coexisting deficiency without establishing efficacy in WNT5A-confirmed
    disease or correction of its developmental mechanism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Disordered Growth Plate and Skeletal Patterning
    description: >-
      Acts on growth-plate output through an independent endocrine axis; it does not restore planar cell polarity.
  evidence:
  - reference: PMID:10417975
    reference_title: 'Robinow syndrome with growth hormone deficiency: treatment with growth hormone.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recombinant human GH therapy in our patient and the three patients from the NCGS resulted in a significant
      increase in the growth rate per year.
    explanation: >-
      Clinical growth-rate response in patients of unknown genotype; transfer to WNT5A-related disease is indirect.
  - reference: PMID:10417975
    reference_title: 'Robinow syndrome with growth hormone deficiency: treatment with growth hormone.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose its association with GH deficiency and that treatment with rhGH can result in a significant
      increase in the growth rate of these children.
    explanation: >-
      The authors propose the association from a small series; neither the prevalence of GH deficiency nor
      routine treatment efficacy is established.
    directness: INDIRECT
- name: Hormone Therapy for Micropenis
  therapeutic_modality: OTHER
  description: >-
    Hormone therapy in affected males with micropenis, listed by GeneReviews among the treatments of manifestations.
    Like the surgical entries, it addresses an established morphogenetic outcome rather than the pathway that
    produced it. Refer for endocrine assessment; GeneReviews reports hCG and testosterone experience in three
    boys, without establishing WNT5A-specific efficacy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human chorionic gonadotropin
      term:
        id: CHEBI:81570
        label: Chorionic gonadotropin
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  target_mechanisms:
  - target: Genital morphogenetic disruption
    description: Acts on the genital phenotype; it does not restore planar cell polarity.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hormone therapy may be helpful for males with micropenis.
    explanation: >-
      The GeneReviews Management statement. Note its hedge - "may be helpful" - which is why this is recorded
      without any efficacy claim.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Injection of human chorionic gonadotropin and testosterone improved penile length and testicular volume
      in three boys with severe micropenis
    explanation: >-
      Small historical treatment experience summarized by GeneReviews; molecular subtype and general efficacy
      are not established.
- name: Genetic and reproductive counseling
  description: >-
    Offer family-specific counseling, examination/testing of parents and at-risk relatives, and discussion
    of prenatal or preimplantation testing once the familial variant is known. A molecular result cannot predict
    severity. If the variant is absent from both parents' blood, sibling recurrence remains low but nonzero
    because germline mosaicism cannot be excluded; GeneReviews quotes less than 1% for this circumstance across
    ADRS.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the DVL1, DVL3, or WNT5A pathogenic variant has been identified in an affected family member, prenatal
      and preimplantation genetic testing are possible.
    explanation: Family-specific reproductive testing and counseling, not prevention of the developmental mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the risk to sibs is presumed to be slightly greater than that of the general population (though still
      <1%) because of the theoretic possibility of parental germline mosaicism.
    explanation: >-
      Applies after a proband variant is undetectable in both parents' leukocyte DNA; not a measured WNT5A-specific
      recurrence rate.
differential_diagnoses:
- name: DVL1-related autosomal dominant Robinow syndrome
  description: >-
    DVL1-related Robinow syndrome can include persistent macrocephaly, skull osteosclerosis and hearing loss,
    with low-normal stature in a subset. C-terminal frameshift variants alter the intracellular adaptor. Canonical
    co-expression assays have reported both increased and decreased activity; JNK-PCP readouts also depend
    on cellular and species context. These differences remain unresolved and do not establish the direction
    of WNT5A signaling.
  distinguishing_features:
  - Low-normal stature in a subset; short stature also occurs
  - Increased bone mineral density with skull osteosclerosis
  - Hearing loss
  - Persistent macrocephaly
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A variant of Robinow syndrome, associated with osteosclerosis and caused by a heterozygous pathogenic
      variant in DVL1, is characterized by normal stature, persistent macrocephaly, increased bone mineral
      density with skull osteosclerosis, and hearing loss
    explanation: >-
      Osteosclerotic DVL1 subgroup described by GeneReviews; normal stature is not universal across DVL1-related
      disease.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified de novo frameshift mutations in DVL1, a mediator of both canonical and non-canonical Wnt
      signaling, as the cause of RS-OS, an RS subtype involving osteosclerosis, in three unrelated individuals
    explanation: Attributes the DVL1-osteosclerosis subtype to its primary report.
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      when the mutant and wild-type alleles were co-expressed, canonical Wnt activity was 2-fold higher than
      that in the wild-type construct alone
    explanation: >-
      Co-expression increased canonical WNT output in this assay. Other DVL1 constructs and cellular systems
      have yielded decreased activity; these results do not settle the dominant mechanism of WNT5A disease.
      The DVL1-1519ΔT co-expression decrease is recounted in PMID:42424595; the competing coexpression_canonical_wnt_gain_model
      is represented in Autosomal_Dominant_Robinow_Syndrome_2.
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations all delete the DVL1 C terminus and replace it, in each instance, with a novel, highly basic
      sequence.
    explanation: The primary DVL1 report identifies altered C-terminal sequence after frameshifting.
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed the presence of mutant transcript in fibroblasts from one individual with RS-OS and demonstrated
      unimpaired protein stability with transfected GFP-tagged constructs bearing a frameshift mutation.
    explanation: >-
      Patient fibroblast transcript and transfected protein stability are separate observations; neither establishes
      the behavior of WNT5A variants.
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This is the first study to show that the novel C-terminus of DVL1 is sufficient to interfere with the
      function of DVL1 protein expressed from the normal allele in heterozygous, autosomal dominant RS.
    explanation: >-
      Sources the interference-with-the-normal-allele claim. The bare label "dominant-negative" is deliberately
      not used in the prose - this is the experimental statement behind it. Graded MODEL_ORGANISM rather than
      IN_VITRO because this concluding claim rests on the study's chick limb and *Drosophila* wing readouts
      as well as its culture work; the luciferase item below is the cell-based measurement and stays IN_VITRO.
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      wtDVL1 activated canonical and JNK-PCP WNT signalling whereas the DVL11519* and the DVL11519ΔT variant
      had significantly lower signaling activity
    explanation: >-
      Direct measurement that the DVL1 variant signals below wild type on the non-canonical JNK-PCP branch
      as well as the canonical one. This is the evidence for the reduced-signalling framing, and it is in tension
      with the same group's earlier chick and *Drosophila* work reporting a gain of JNK/PCP signalling (PMID:36916233,
      cited below); the description records the disagreement rather than picking a side.
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, the variants caused a loss of canonical and gain of non-canonical Wnt signaling in several
      assays.
    explanation: >-
      The study includes HEK293 reporter assays plus chicken and Drosophila experiments. JNK activation varies
      by variant and context; the 2026 paper explicitly contrasts lower activation in chicken facial mesenchyme
      with MMP1 upregulation in Drosophila.
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      only 38% (N = 8 out of 21) of DVL1 individuals have short stature, which contrasts with the prevalence
      of short stature in all other RS types (69%–100%)
    explanation: >-
      Primary retrospective comparison confirms variable stature; the between-genotype trend was not statistically
      significant.
  disease_term:
    preferred_term: autosomal dominant Robinow syndrome 2
    term:
      id: MONDO:0014591
      label: autosomal dominant Robinow syndrome 2
- name: Omodysplasia
  description: >-
    FZD2-related omodysplasia/Robinow-spectrum disease overlaps substantially with WNT5A-related disease. Predominantly
    humeral shortening, a short first metacarpal and elbow restriction can be informative, but height and facial
    appearance do not reliably exclude either diagnosis. The 2018 discovery cohort and 2022 phenotypic analysis
    support a shared spectrum; molecular testing is decisive.
  disease_term:
    preferred_term: omodysplasia
    term:
      id: MONDO:0017136
      label: omodysplasia
  distinguishing_features:
  - Predominantly humeral shortening rather than generalized mesomelic shortening
  - Short first metacarpal
  - Elbow restriction from hypoplastic, dislocated proximal radii
  - Heterozygous FZD2 variants; clinical overlap with the Robinow spectrum requires molecular differentiation
  evidence:
  - reference: PMID:29383834
    reference_title: 'Nonsense mutations in FZD2 cause autosomal-dominant omodysplasia: Robinow syndrome-like phenotypes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      skeletal dysplasia characterized by shortened humeri, short first metacarpal, craniofacial dysmorphism
      (frontal bossing, depressed nasal bridge, bifid nasal tip, and long philtrum), and variable degrees of
      genitourinary anomalies
    explanation: >-
      Predominantly humeral shortening can inform the differential but is not an absolute clinical separator.
  - reference: PMID:29383834
    reference_title: 'Nonsense mutations in FZD2 cause autosomal-dominant omodysplasia: Robinow syndrome-like phenotypes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: He presented with rhizomelic short stature with elbow restriction, mild facial dysmorphism
    explanation: >-
      The molecularly confirmed FZD2 proband had short stature, not preserved stature. This is why the description
      states the distinction as a pattern-of-shortening contrast against the WNT5A form rather than as a height
      difference.
  - reference: PMID:29383834
    reference_title: 'Nonsense mutations in FZD2 cause autosomal-dominant omodysplasia: Robinow syndrome-like phenotypes.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: thick proximal ulnae with hypoplastic, dislocated proximal radii, and short first metacarpals
    explanation: Sources the elbow-restriction and short-first-metacarpal distinguishing features.
  - reference: PMID:29276006
    reference_title: WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four families with variants in FZD2 were identified as well as three individuals from two families with
      biallelic variants in NXN that co-segregate with the phenotype
    explanation: >-
      Establishes FZD2 as a further Robinow-pathway gene distinct from WNT5A, ROR2, DVL1 and DVL3, found by
      genomic studies of clinically diagnosed families left unsolved for those four.
  - reference: PMID:29276006
    reference_title: WNT Signaling Perturbations Underlie the Genetic Heterogeneity of Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ∼70% of autosomal-dominant Robinow syndrome cases remain molecularly unsolved
    explanation: >-
      Historical unsolved fraction motivating the study, not a current testing yield or a WNT5A-specific proportion.
    quote_role: BACKGROUND
- name: ROR2-related autosomal recessive Robinow syndrome
  description: >-
    Biallelic ROR2 disease affects a receptor involved in WNT5A signaling and often has more marked skeletal
    and vertebral abnormalities. Clinical severity overlaps; recessive inheritance and molecular testing are
    the reliable distinctions.
  distinguishing_features:
  - Autosomal recessive inheritance
  - More severe skeletal, vertebral and craniofacial abnormalities
  - Biallelic ROR2 variants rather than heterozygous WNT5A
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the phenotypically more severe autosomal recessive form of Robinow syndrome has been associated with
      mutations in the orphan tyrosine kinase receptor, ROR2, which has recently been identified as a putative
      WNT5A receptor
    explanation: >-
      States the recessive form's gene, its greater severity, and the ligand-receptor relationship that explains
      the phenotypic overlap.
    quote_role: BACKGROUND
  disease_term:
    preferred_term: autosomal recessive Robinow syndrome
    term:
      id: MONDO:0009999
      label: autosomal recessive Robinow syndrome
- name: Biallelic WNT5A loss-of-function disease
  description: >-
    A severe allelic presentation with recessive inheritance has been described in an infant with a homozygous
    frameshift, diaphragmatic hernia, genital ambiguity, adactyly and a ventricular septal defect. It is distinct
    from the selected heterozygous coding changes underlying dominant DRS1.
  evidence:
  - reference: PMID:29575631
    reference_title: Biallelic loss-of-function WNT5A mutations in an infant with severe and atypical manifestations of Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      we identified a homozygous frameshifting single nucleotide deletion in WNT5A in a previously reported,
      deceased infant
    explanation: Single-family report establishes the distinct allelic context; it is not a dominant DRS1 subtype.
- name: DVL3-related Robinow syndrome
  description: >-
    Overlapping dominant skeletal and craniofacial findings with a higher reported burden of cardiac abnormalities
    in small series. Molecular testing separates this adaptor-related disorder from WNT5A-related disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf

name: Autosomal Dominant Robinow Syndrome 1
creation_date: '2026-08-26T21:00:00Z'
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 1
  term:
    id: MONDO:0024455
    label: autosomal dominant Robinow syndrome 1
synonyms:
- DRS1
- WNT5A-related Robinow syndrome
- fetal face syndrome
description: 'A skeletal dysplasia caused by heterozygous missense variants in WNT5A, the prototypic
  ligand of non-canonical Wnt signalling. What is curated here is deliberately narrower than "Robinow
  syndrome": the autosomal dominant form has three genes, and this entry is the WNT5A one.

  That distinction is mechanistic, not bookkeeping. WNT5A variants act on the **ligand**, reducing
  its activity - the founding variants substitute highly conserved cysteines and measurably decrease
  WNT5A function in developmental assays. The other two dominant genes, DVL1 and DVL3, act through
  truncated intracellular adaptors downstream of the same pathway with an apparent gain of function,
  and they carry phenotypic differences to match (osteosclerosis and preserved stature with DVL1).
  Same pathway, opposite direction of effect, different clinical picture - so they are curated as
  differential diagnoses rather than merged in.

  The pathway is the non-canonical, beta-catenin-independent branch: WNT5A signals through ROR2 and
  Disheveled to Rho-family GTPases and JNK, governing planar cell polarity rather than proliferation
  or fate. The disease is therefore a disorder of polarised cell behaviour. In growth-plate cartilage
  the readout is direct - chondrocytes that should form ordered columns are randomly oriented - and
  mesomelic limb shortening is what that disorganisation produces at the level of a limb.

  The pathology is developmental rather than degenerative. It is established prenatally and is largely
  static afterwards, which is why management is corrective and supportive rather than disease-modifying.'
parents:
- Robinow Syndrome
- Skeletal Dysplasia
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: No population prevalence is established for the WNT5A form specifically. Robinow syndrome
    as a whole had over 100 reported patients across dominant and recessive forms at the time of
    the WNT5A discovery; the WNT5A subset is a small fraction of that.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Over 100 patients with Robinow syndrome have since been identified in families with
      both autosomal dominant and autosomal recessive inheritance patterns
    explanation: PARTIAL because the count is for Robinow syndrome across all genes and both inheritance
      modes, not for the WNT5A form curated here.
pathophysiology:
- name: Heterozygous WNT5A Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  description: A missense substitution in WNT5A, in the founding families replacing highly conserved
    cysteine residues. Cysteines matter disproportionately in a Wnt ligand because the fold depends
    on disulfide bonding, and the disease variants cluster on a surface implicated in receptor engagement
    rather than being scattered through the protein.
  genetic_context:
    gene:
      preferred_term: WNT5A
      term:
        id: hgnc:12784
        label: WNT5A
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: 'Partial loss of function rather than null: the functional assays show decreased
      activity, not abolished activity, and heterozygotes are affected while the corresponding mouse
      null is perinatally lethal with a more severe phenotype than any human patient.'
  downstream:
  - target: Reduced Non-Canonical WNT5A Signalling Through ROR2
    causal_link_type: DIRECT
    description: The variant protein is the ligand; reduced ligand activity is reduced pathway input.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that two different missense mutations in WNT5A, which result in amino acid substitutions
      of highly conserved cysteines, are associated with autosomal dominant Robinow syndrome
    explanation: The gene-disease assignment and the variant class, from the discovery study.
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: One mutation has been found in all living affected members of the original family described
      by Meinhard Robinow and another in a second unrelated patient.
    explanation: Segregation in the originally described pedigree, which is the strongest single
      piece of evidence tying WNT5A to this entity.
- name: Reduced Non-Canonical WNT5A Signalling Through ROR2
  role: central_effector
  biological_scale: CELLULAR
  description: 'The WNT5A/ROR2 axis transmits a beta-catenin-independent signal through Disheveled
    to Rho-family GTPases and JNK. This is the planar-cell-polarity branch of Wnt signalling - it
    tells cells which way to face and which way to move, rather than whether to divide or what to
    become.

    The functional evidence for reduced signalling is developmental-assay based: the patient variants
    decreased WNT5A activity in zebrafish and Xenopus systems. That is the measurement available,
    and it is made in embryos of other species rather than in human tissue.'
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED
  downstream:
  - target: Loss of Planar Cell Polarity in Developing Tissues
    causal_link_type: DIRECT
    description: Planar cell polarity is the output this pathway produces, so reducing the signal
      degrades the polarity.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These missense mutations result in decreased WNT5A activity in functional assays of
      zebrafish and Xenopus development.
    explanation: The functional demonstration that the variants reduce signalling. Typed MODEL_ORGANISM
      because the assays are in zebrafish and Xenopus embryos.
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This work suggests that a WNT5A/ROR2 signal transduction pathway is important in human
      craniofacial and skeletal development and that proper formation and growth of these structures
      is sensitive to variations in WNT5A function.
    explanation: The authors' own framing of the pathway and of the dose sensitivity that makes a
      partial loss of function sufficient to cause disease.
- name: Loss of Planar Cell Polarity in Developing Tissues
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: 'Cells that should adopt a coordinated orientation within the plane of a tissue fail
    to do so. In growth-plate cartilage this is directly observable - chondrocytes that should stack
    into ordered columns are randomly oriented - and it is the most concrete cellular readout available
    for this disease.

    PROVISIONAL because the chondrocyte polarity evidence comes from experimental systems expressing
    a disease variant rather than from patient growth plates, and because the step from disordered
    chondrocyte columns to the specifically mesomelic pattern of limb shortening is inferred rather
    than demonstrated.'
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  downstream:
  - target: Disordered Growth Plate and Skeletal Patterning
    causal_link_type: DIRECT
    description: Growth-plate elongation depends on ordered chondrocyte columns, so losing the order
      degrades the elongation.
  - target: Craniofacial and Genital Morphogenetic Disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The same polarity defect is presumed to act in neural-crest-derived craniofacial
      precursors and in genital development, but the intermediate steps in those tissues are not
      established for WNT5A patient variants.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: A non-canonical, β-catenin independent signal transduction pathway that controls cell
      polarity or movement has also been identified
    explanation: Background from the introduction of the WNT5A discovery paper, citing Heisenberg
      et al. 2000 - a zebrafish study. Graded OTHER because it is a review of prior model-organism
      work rather than a human observation or a result of the citing paper. It establishes that this
      pathway controls cell polarity in general, not that the polarity defect was measured in Robinow
      tissue.
- name: Disordered Growth Plate and Skeletal Patterning
  role: effector
  biological_scale: ORGANISM
  description: Shortened, disorganised endochondral growth with a mesomelic pattern - the middle
    segments of the limbs are affected more than the proximal or distal ones, and the upper limbs
    more than the lower. Brachydactyly, vertebral anomalies and radial head dislocation belong to
    the same developmental failure.
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: skeletal findings (short stature, mesomelic limb shortening predominantly of the upper
      limbs, and brachydactyly)
    explanation: The GeneReviews Clinical Characteristics description of the skeletal phenotype,
      including the upper-limb predominance of the mesomelic shortening.
- name: Craniofacial and Genital Morphogenetic Disruption
  role: effector
  biological_scale: ORGANISM
  description: 'The non-skeletal half of the phenotype: the distinctive facial configuration that
    gave the condition its old name of fetal face syndrome, and hypoplastic external genitalia. Both
    are morphogenetic failures established in utero rather than progressive processes.'
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: dysmorphic facial features (widely spaced and prominent eyes, frontal bossing, anteverted
      nares, midface retrusion)
    explanation: The GeneReviews description of the craniofacial phenotype.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'genital abnormalities (in males: micropenis / webbed penis, hypoplastic scrotum, cryptorchidism;
      in females: hypoplastic clitoris and labia majora)'
    explanation: The GeneReviews description of the genital phenotype in both sexes.
phenotypes:

discussions:
- discussion_id: wnt5a_dominant_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do heterozygous WNT5A variants cause dominant disease despite context-dependent activity and retained
    wild-type signaling?
  attaches_to:
  - pathophysiology#Altered WNT5A receptor signaling
  rationale: >-
    Founding embryo assays support hypomorphism, chicken C83S studies support dominant interference with chondrogenesis,
    and the mouse/cell preprint proposes a distinct non-loss-of-function phenotype without measured wild-type
    inhibition. The readouts, expression systems and embryonic tissues differ; no universal functional category
    is assigned.
  status: OPEN
  evidence:
  - reference: PMID:41510274
    reference_title: Local Misalignment Scoring Reveals Spatially Uniform Chondrocyte Disorganization in a Wnt5a-C83S Knock-in Model of Robinow Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Across all four models, induction of C83S expression did not reduce the signaling output from wild-type
      WNT5A, whether supplied as recombinant protein, co-expressed in the same cells, presented on neighboring
      cells, or provided by co-cultured donor cells.
    explanation: >-
      Preprint cell-based tests constrain dominant-negative models in those assay contexts; they do not rule
      out human tissue-specific effects.
    quote_role: PRIMARY_RESULT

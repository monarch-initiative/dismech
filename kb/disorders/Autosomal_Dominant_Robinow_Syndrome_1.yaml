    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      pathogenic variants in FGD1 are the most frequent molecular diagnostic finding in clinically diagnosed
      RS with otherwise negative testing
    explanation: >-
      Selected cohort finding supports including FGD1 in the molecular differential; it does not estimate prevalence
      in all referrals.
notes: >-
  WNT5A-related dominant Robinow syndrome is distinct from DVL1/DVL3/FZD2 and recessive forms, despite clinical
  overlap. GeneReviews provides a cross-gene clinical baseline; its frequencies are not assumed to be WNT5A-specific.
  Primary cohorts are small, selected and incompletely phenotyped. The 2025 mouse study is a preprint with
  F0 editing limitations and does not definitively resolve the human functional mechanism. Renal anomalies,
  hearing loss and other less-common cross-gene findings are included in baseline assessment where genotype-specific
  support is sparse; zero events in a small WNT5A subgroup do not prove absence. Nail dysplasia remains a less-common
  cross-gene finding without an established WNT5A-specific frequency. Cleft lip and palate are represented
  separately because they are actionable anatomical findings. No quantified penetrance or population prevalence
  is inferred from selected case series.

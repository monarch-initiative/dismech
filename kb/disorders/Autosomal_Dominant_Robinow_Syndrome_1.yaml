- name: Aarskog-Scott syndrome
  description: >-
    FGD1-related Aarskog-Scott syndrome can resemble Robinow syndrome in facial, limb and genital findings.
    Its X-linked inheritance and molecular cause distinguish it; it is a relevant alternative after negative
    Robinow-gene testing.
  evidence:

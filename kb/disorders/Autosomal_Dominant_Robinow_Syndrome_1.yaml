genetic:
- name: WNT5A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: WNT5A
    term:
      id: hgnc:12784
      label: WNT5A
  notes: 'The secreted non-canonical Wnt ligand. Disease variants are missense and cluster on a modelled
    surface implicated in receptor or co-receptor engagement, which is consistent with altered protein-protein
    interaction rather than misfolding or failure of secretion - the protein is made and released,
    but signals poorly.

    Dose sensitivity is the reason a heterozygous partial loss of function suffices: the discovery
    study concluded that formation and growth of craniofacial and skeletal structures is sensitive
    to variation in WNT5A function.'
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we show that two different missense mutations in WNT5A, which result in amino acid substitutions
      of highly conserved cysteines, are associated with autosomal dominant Robinow syndrome
    explanation: The gene-disease assignment and the variant class.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing
    explanation: PARTIAL because the GeneReviews diagnostic statement covers all three dominant genes;
      only the WNT5A arm applies to this entry. Cited because it is the diagnostic criterion a clinician
      actually applies, and because it makes explicit that WNT5A is one of three routes to the same
      clinical diagnosis.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Autosomal dominant with high penetrance, arising either by inheritance or de novo.
    An important counselling point is that severity cannot be predicted from the genotype, so a molecular
    result establishes the diagnosis and the recurrence risk but not the expected clinical course.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Each child of an individual with ADRS has a 50% chance of inheriting the pathogenic
      variant; however, the severity of the clinical manifestations cannot be predicted from the
      results of molecular genetic testing.
    explanation: The GeneReviews Genetic Counseling statement, giving both the recurrence risk and
      the limit on genotype-based prognosis.
diagnosis:
- name: Molecular Genetic Testing
  description: The diagnosis is established clinically by the characteristic combination of findings
    and confirmed by identifying a heterozygous pathogenic variant. Because three genes produce the
    dominant syndrome, a panel or exome approach is appropriate rather than single-gene testing,
    and the specific gene identified carries prognostic information - DVL1 predicts osteosclerosis
    and preserved stature, WNT5A does not.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of autosomal dominant Robinow syndrome is established in a proband with
      typical suggestive findings and/or by the identification of a heterozygous pathogenic variant
      in DVL1, DVL3, or WNT5A through molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
treatments:
- name: Corrective Surgery for Genital and Orofacial Anomalies
  therapeutic_modality: SURGERY
  description: Surgical correction of cryptorchidism, abnormal penile insertion or penoscrotal position,
    and cleft lip or palate where present. This is management of established morphogenetic defects
    - the developmental window in which the pathway acted has long closed by the time of surgery.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Craniofacial and Genital Morphogenetic Disruption
    description: Corrects the anatomical result of the developmental defect; it does not act on the
      pathway.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Corrective surgeries as needed for cryptorchidism, abnormal penile insertion / penoscrotal
      position, and cleft lip/palate.
    explanation: The GeneReviews Management recommendation for the surgical manifestations.
- name: Structured Multisystem Surveillance
  therapeutic_modality: OTHER
  description: 'A defined surveillance schedule rather than symptomatic follow-up: head circumference
    through infancy and childhood, developmental assessment every three months in infancy and six-monthly
    to yearly thereafter, dental review every six to twelve months, periodic hearing assessment in
    childhood, and cardiac and renal assessment where abnormalities have been found.

    The cardiac element is the one with mortality attached, which is why it is curated as surveillance
    rather than folded into general follow-up.'
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Disordered Growth Plate and Skeletal Patterning
    description: Detects and manages complications of the established skeletal phenotype rather than
      modifying it.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Measurement of head circumference regularly in infancy and throughout childhood. Developmental
      assessment every three months in infancy and every six months to one year thereafter
    explanation: The GeneReviews Surveillance schedule, quoted for the elements it specifies by interval.
- name: Orthodontic Treatment
  therapeutic_modality: DEVICE
  description: Orthodontic management is typically required, reflecting the dental crowding, malocclusion,
    hypodontia and delayed eruption that accompany the craniofacial phenotype.
  treatment_term:
    preferred_term: orthodontic treatment
    term:
      id: NCIT:C64248
      label: Orthodontic Treatment
  target_mechanisms:
  - target: Craniofacial and Genital Morphogenetic Disruption
    description: Addresses the dental consequences of abnormal craniofacial development.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Orthodontic treatment is typically required.
    explanation: The GeneReviews Management statement on orthodontic need.
- name: Growth Hormone Therapy (selected patients)
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: 'Growth hormone for the subset of patients in whom GH deficiency is demonstrated.
    The reported series found GH deficiency on testing in four of five Robinow patients and a significant
    increase in growth rate on recombinant GH - but the authors present the association as a proposal,
    and five patients is not a trial.

    It treats a coexisting endocrine deficiency, not the WNT5A defect: nothing about supplying growth
    hormone restores planar cell polarity, and the mesomelic proportions are set prenatally. Curated
    as a selected-patient option contingent on documented deficiency, not as management of the skeletal
    phenotype.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_mechanisms:
  - target: Disordered Growth Plate and Skeletal Patterning
    description: Acts on growth-plate output through an independent endocrine axis; it does not restore
      planar cell polarity.
  evidence:
  - reference: PMID:10417975
    reference_title: 'Robinow syndrome with growth hormone deficiency: treatment with growth hormone.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Recombinant human GH therapy in our patient and the three patients from the NCGS resulted
      in a significant increase in the growth rate per year.
    explanation: PARTIAL on gene attribution. This 1999 series predates the 2010 WNT5A discovery
      by a decade, so the patients were diagnosed clinically and their genotype is unknown - they
      may carry DVL1, DVL3, or the recessive ROR2 form rather than WNT5A. It reports a growth-rate
      response to recombinant GH in Robinow syndrome; it does not establish that response for the
      WNT5A form specifically. This is the same caveat the prevalence record carries, and for the
      same reason.
  - reference: PMID:10417975
    reference_title: 'Robinow syndrome with growth hormone deficiency: treatment with growth hormone.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: We propose its association with GH deficiency and that treatment with rhGH can result
      in a significant increase in the growth rate of these children.
    explanation: PARTIAL because the authors frame the GH-deficiency association as a proposal from
      a small series rather than an established feature of the disease - which is why this treatment
      is curated as a selected-patient option contingent on demonstrated deficiency.
- name: Hormone Therapy for Micropenis
  therapeutic_modality: OTHER
  description: Hormone therapy in affected males with micropenis, listed by GeneReviews among the
    treatments of manifestations. Like the surgical entries, it addresses an established morphogenetic
    outcome rather than the pathway that produced it.
  treatment_term:

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Three out of four individuals with DVL3-associated ADRS had cardiac abnormalities; osteosclerosis has
      not been reported.
    explanation: Small chapter-era series, not a stable population frequency or a rule excluding osteosclerosis.

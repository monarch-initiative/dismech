phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: >-
    Shortening of the middle limb segments - forearm and lower leg - with upper-limb predominance. The mesomelic
    pattern is the skeletal signature of this condition and what distinguishes it from proportionate short
    stature.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  evidence:

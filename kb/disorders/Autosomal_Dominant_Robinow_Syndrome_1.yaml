name: Autosomal Dominant Robinow Syndrome 1
creation_date: '2026-08-26T21:00:00Z'
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 1
  term:
    id: MONDO:0024455
    label: autosomal dominant Robinow syndrome 1
synonyms:
- DRS1
- WNT5A-related Robinow syndrome
- fetal face syndrome
description: >-
  WNT5A-related autosomal dominant Robinow syndrome is a congenital skeletal and craniofacial developmental
  disorder caused by heterozygous missense or selected in-frame WNT5A variants. Characteristic findings include
  mesomelic limb shortening, short stature, brachydactyly, widely spaced eyes and genital hypoplasia. This
  entry covers the WNT5A form; other genes can produce overlapping Robinow phenotypes.

  Altered WNT5A signaling disrupts coordinated tissue morphogenesis, but a universal reduction in pathway activity
  is not established. Founding zebrafish and Xenopus assays supported partial loss of function. Later C83S
  chicken-limb experiments showed disordered chondrocyte polarity and delayed hypertrophy, while cellular signaling
  depended on receptor and assay context. A mouse C83S preprint reports a distinct spatial phenotype and no
  inhibition of wild-type signaling in its cell assays, with important founder-mosaicism limitations. These
  results support abnormal signaling and morphogenesis without settling hypomorphic, dominant-interference
  or neomorphic mechanisms in humans.

  The abnormalities arise during development; subsequent growth, scoliosis and dental complications still require
  follow-up. Management addresses manifestations and associated abnormalities. No molecular correction of the
  WNT5A defect is established in the cited clinical sources.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    No population prevalence is established for the WNT5A form specifically. Robinow syndrome as a whole had
    over 100 reported patients across dominant and recessive forms at the time of the WNT5A discovery; the
    WNT5A subset is a small fraction of that. The historical literature count is not a population prevalence
    or a current WNT5A-specific case count.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Over 100 patients with Robinow syndrome have since been identified in families with both autosomal dominant
      and autosomal recessive inheritance patterns
    explanation: >-
      Historical background count across Robinow genes and inheritance modes; it does not estimate WNT5A-specific
      prevalence.
    quote_role: BACKGROUND
pathophysiology:
- name: Heterozygous WNT5A coding alteration
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: WNT5A
    term:
      id: hgnc:12784
      label: WNT5A
  description: >-
    Selected missense substitutions and in-frame variants alter the secreted WNT5A ligand. Many change conserved
    cysteines. Both inherited and de novo variants occur, including a reported mosaic in-frame duplication;
    a null allele is not assumed to produce the same dominant disorder.
  genetic_context:
    gene:
      preferred_term: WNT5A
      term:
        id: hgnc:12784
        label: WNT5A
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      The dominant functional mechanism is unresolved and varies by experimental context. Founding variants
      retain activity, C83S affects protein abundance and signaling in cell assays, and model systems support
      competing interpretations.
  downstream:
  - target: Altered WNT5A receptor signaling
    causal_link_type: DIRECT
    description: Variant ligand changes signaling output; direction depends on receptor, tissue and assay context.
  - target: Reduced C83S protein abundance and secretion
    causal_link_type: DIRECT
    description: Demonstrated for the C83S construct; not generalized to every WNT5A variant.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that two different missense mutations in WNT5A, which result in amino acid substitutions of highly
      conserved cysteines, are associated with autosomal dominant Robinow syndrome
    explanation: The gene-disease assignment and the variant class, from the discovery study.
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One mutation has been found in all living affected members of the original family described by Meinhard
      Robinow and another in a second unrelated patient.
    explanation: >-
      Segregation in the originally described pedigree, which is the strongest single piece of evidence tying
      WNT5A to this entity.
- name: Reduced C83S protein abundance and secretion
  description: >-
    C83S-expressing chicken fibroblasts contain less intracellular and secreted WNT5A. The 2019 experiments
    did not show preferential degradation of mutant protein; an unfolded-protein response was proposed but
    not directly demonstrated. Reduced abundance alone does not explain the dominant developmental phenotype.
    The 2025 preprint also reports impaired C83S secretion without suppression of wild-type WNT5A secretion.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31032853
    reference_title: Robinow syndrome skeletal phenotypes caused by the WNT5AC83S variant are due to dominant interference with chondrogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unexpectedly, the C83S change caused a reduction in the amount of protein being synthesized and secreted,
      compared to wtWNT5A.
    explanation: >-
      Stable RCAS-infected DF1 chicken fibroblasts and protein assays; secretion and synthesis are not inferred
      from the human genotype alone.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Altered WNT5A receptor signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered ligand availability can affect signaling context, but it is not established as the sufficient
      disease mechanism.
- name: Altered WNT5A receptor signaling
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    WNT5A signals through receptor complexes including ROR2 and Frizzled to Dishevelled and noncanonical pathways.
    Founding embryonic assays showed reduced activity, whereas C83S cell assays retained JNK-PCP activation
    and showed receptor-dependent changes in canonical antagonism. Neither a universal decrease in every branch
    nor a universal gain is established.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    modifier: ABNORMAL
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
    modifier: ABNORMAL
  downstream:
  - target: Disordered chondrocyte planar orientation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered WNT signaling is linked to disordered orientation in experimental cartilage; the precise human
      intermediate and direction of activity remain unresolved.
  - target: Craniofacial morphogenetic disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      WNT5A-associated developmental disease affects this tissue, but the variant-specific causal intermediates
      are incompletely characterized.
  - target: Genital morphogenetic disruption
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      WNT5A-associated developmental disease affects this tissue, but the variant-specific causal intermediates
      are incompletely characterized.
  - target: Delayed chondrocyte hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: C83S affects cartilage maturation; the signaling intermediates responsible are unresolved.
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These missense mutations result in decreased WNT5A activity in functional assays of zebrafish and Xenopus
      development.
    explanation: >-
      The functional demonstration that the variants reduce signalling. Typed MODEL_ORGANISM because the assays
      are in zebrafish and Xenopus embryos.
  - reference: PMID:31032853
    reference_title: Robinow syndrome skeletal phenotypes caused by the WNT5AC83S variant are due to dominant interference with chondrogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Biochemical assays revealed that C83S variant was able to activate the Jun N-terminal kinase-PCP pathway
      similar to wtWNT5A; however, the activity of the variant ligand was influenced by receptor availability.
    explanation: >-
      Primary limb-mesenchyme and HEK293 reporter assays; this does not measure signaling in patient growth
      plates.
    quote_role: PRIMARY_RESULT
  mechanism_confidence: PROVISIONAL
- name: Disordered chondrocyte planar orientation
  role: central_effector
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    C83S misexpression in chicken limbs disrupts Golgi-based chondrocyte orientation and Prickle localization
    before marked cartilage dysmorphology. This is experimental developmental cartilage, not a patient biopsy.
    A 2025 preprint reports spatially uniform chondrocyte misalignment in CRISPR-edited mouse embryos; its
    F0-only design cannot exclude mosaic or biallelic editing. Local misalignment is a morphological readout,
    not direct measurement of pathway activation.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  downstream:
  - target: Disordered Growth Plate and Skeletal Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of coordinated cell orientation is proposed to impair cartilage elongation; the specifically mesomelic
      distribution in patients is not directly explained by the model.
  evidence:
  - reference: PMID:31032853
    reference_title: Robinow syndrome skeletal phenotypes caused by the WNT5AC83S variant are due to dominant interference with chondrogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead of stereotypical stacking of chondrocytes, the WNT5AC83S-infected cartilage was composed of randomly
      oriented chondrocytes and that had diffuse, rather than concentrated Prickle staining, both signs of
      disrupted planar cell polarity (PCP) mechanisms.
    explanation: >-
      RCAS misexpression in embryonic chicken limb; measured Golgi orientation and qualitative Prickle staining
      support polarity disruption.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41510274
    reference_title: Local Misalignment Scoring Reveals Spatially Uniform Chondrocyte Disorganization in a Wnt5a-C83S Knock-in Model of Robinow Syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although we selected embryos with approximately 50% correct template-mediated repair based on next-generation
      sequencing, we cannot exclude that some cells carry edits on both alleles.
    explanation: >-
      Preprint limitation: initial CRISPR-edited embryos were used because cleft-palate lethality prevented
      breeding; uniform heterozygosity was not demonstrated.
    quote_role: PRIMARY_RESULT
- name: Delayed chondrocyte hypertrophy
  description: >-
    In C83S-infected chicken limbs, COL10A1 expression and hypertrophic enlargement are delayed. This accompanies
    impaired cartilage elongation; no equivalent patient-tissue measurement is available.
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:31032853
    reference_title: Robinow syndrome skeletal phenotypes caused by the WNT5AC83S variant are due to dominant interference with chondrogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The C83S mutation also dominantly interferes with the expansion of chondrocytes as shown by the lack
      of lacunae in Alcian blue stained sections.
    explanation: >-
      Chicken limb histology and COL10A1 staining support delayed maturation; this is distinct from cell orientation.
    quote_role: PRIMARY_RESULT
  - reference: PMID:31032853
    reference_title: Robinow syndrome skeletal phenotypes caused by the WNT5AC83S variant are due to dominant interference with chondrogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the mutant protein prevented COL10A1 expression in all embryos.
    explanation: >-
      The authors describe absent COL10A1 at the assessed stage, with later bone formation possible. This supports
      delayed hypertrophy rather than a permanently absent lineage.
    quote_role: PRIMARY_RESULT
  downstream:
  - target: Disordered Growth Plate and Skeletal Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced hypertrophic enlargement and delayed ossification contribute to shortened skeletal elements in
      the chicken model.
  biological_scale: CELLULAR
  cell_types:

differential_diagnoses:
- name: DVL1-related autosomal dominant Robinow syndrome
  description: 'The osteosclerotic form. Same pathway, but the mechanism runs the other way - truncated
    DVL1 adaptors with an apparent gain of function rather than a hypomorphic ligand - and the phenotype
    separates on features that are easy to check: normal stature, persistent macrocephaly, increased
    bone mineral density with skull osteosclerosis, and hearing loss. A patient with Robinow features
    and normal height is more likely DVL1 than WNT5A.'
  distinguishing_features:
  - Normal stature rather than short stature
  - Increased bone mineral density with skull osteosclerosis
  - Hearing loss
  - Persistent macrocephaly
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A variant of Robinow syndrome, associated with osteosclerosis and caused by a heterozygous
      pathogenic variant in DVL1, is characterized by normal stature, persistent macrocephaly, increased
      bone mineral density with skull osteosclerosis, and hearing loss
    explanation: The GeneReviews description of the DVL1 phenotype, which is what distinguishes it
      from the WNT5A form curated here.
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we identified de novo frameshift mutations in DVL1, a mediator of both canonical and
      non-canonical Wnt signaling, as the cause of RS-OS, an RS subtype involving osteosclerosis,
      in three unrelated individuals
    explanation: Attributes the DVL1-osteosclerosis subtype to its primary report.
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: when the mutant and wild-type alleles were co-expressed, canonical Wnt activity was
      2-fold higher than that in the wild-type construct alone
    explanation: The mechanistic contrast that separates DVL1 disease from WNT5A disease. The mutant
      allele alone is less active than wild type, but together they raise canonical Wnt signalling
      - so the osteosclerotic phenotype arises from an allele interaction increasing the canonical
      branch, where WNT5A disease is a hypomorphic ligand decreasing the non-canonical one.
- name: ROR2-related autosomal recessive Robinow syndrome
  description: The recessive form, caused by loss-of-function variants in ROR2 - the receptor for
    the ligand that is defective here. Phenotypically more severe, with more marked skeletal, vertebral
    and craniofacial involvement, and recessive rather than dominant transmission. The two entities
    are the ligand and the receptor of one signalling step, which is why they look alike.
  distinguishing_features:
  - Autosomal recessive inheritance
  - More severe skeletal, vertebral and craniofacial abnormalities
  - Biallelic ROR2 variants rather than heterozygous WNT5A
  evidence:
  - reference: PMID:19918918
    reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the phenotypically more severe autosomal recessive form of Robinow syndrome has been
      associated with mutations in the orphan tyrosine kinase receptor, ROR2, which has recently
      been identified as a putative WNT5A receptor
    explanation: States the recessive form's gene, its greater severity, and the ligand-receptor
      relationship that explains the phenotypic overlap.
notes: 'Scope. Autosomal dominant Robinow syndrome has three genes - WNT5A, DVL1 and DVL3 - and this
  entry covers only the WNT5A form (MONDO:0024455, DRS1). The GeneReviews chapter cited throughout
  describes the dominant syndrome across all three, so where its clinical descriptions are quoted
  they apply to the syndrome and not exclusively to WNT5A patients; evidence items say so where it
  matters. DVL1 and ROR2 forms are curated as differential diagnoses rather than subtypes, because
  their mechanisms differ in direction - a hypomorphic ligand here, an allele interaction raising
  canonical Wnt signalling in DVL1, and receptor loss of function in recessive ROR2 disease.

  Deep-research handling. The report is committed at
  research/Autosomal_Dominant_Robinow_Syndrome_1-deep-research-claude_code.md. Its reference
  validation resolved all 13 references with no confabulated citations, but judged only 8 of the 13
  on topic, and the preflight entity check warned that DVL1 was mentioned at 52% the rate of WNT5A -
  both signals of the same thing, that the report mixed in the DVL1/DVL3 forms. Those sections were
  used only for the differential-diagnosis entries, never as evidence for WNT5A claims, and every
  reference cited here was fetched and its snippet verified against the cache individually rather
  than trusted from the report.'

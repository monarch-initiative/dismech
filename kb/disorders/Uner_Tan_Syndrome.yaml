    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None, however, displayed the basal ganglia malformations typically

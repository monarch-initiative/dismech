name: Uner Tan Syndrome
creation_date: "2026-08-20T18:20:00Z"
category: Mendelian
synonyms:
- recessive quadrupedalism
disease_term:
  preferred_term: Uner Tan Syndrome
  term:
    id: MONDO:0100144
    label: Uner Tan Syndrome
description: >-
  This entry is scoped to the MONDO:0100144 TUBB2B p.Arg390Gln-specific entity,
  not to every disorder historically described as Uner Tan syndrome. The
  defining report identified a biallelic p.Arg390Gln substitution in a
  consanguineous family with three affected individuals. All three had habitual
  quadrupedal locomotion and severe cerebellar hypoplasia, and none had the basal
  ganglia malformations reported in other TUBB2B-associated disease.

  Variant assays found intact beta-tubulin folding, alpha/beta-heterodimer
  assembly, and incorporation of variant-containing heterodimers into
  microtubule polymers. A homologous yeast TUB2-390Q model grew normally under
  basal conditions but was more sensitive to microtubule-depolymerizing drugs.
  These measurements support a mild perturbation of microtubule function but do
  not establish a specific functional-impact class in the developing human
  brain, exclude every possible dominant-negative effect, explain recessivity,
  or resolve the intermediates leading to cerebellar hypoplasia.

  The allele, inheritance, and anatomical pattern distinguish this entity from
  de novo TUBB2B-related complex cortical dysplasia and from the genetically
  heterogeneous CAMRQ disorders that can also include quadrupedal gait.

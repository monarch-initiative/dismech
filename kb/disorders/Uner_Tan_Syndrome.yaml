- name: Absence of Basal Ganglia Malformation
  description: >-
    A defining NEGATIVE finding. None of the affected individuals displayed the
    basal ganglia malformations typically associated with TUBB2B mutations. This
    is the feature that most sharply separates Uner Tan syndrome from
    TUBB2A/TUBB2B-related cortical malformation, where dysmorphic basal ganglia
    are a core curated phenotype.
  phenotype_term:
    preferred_term: Abnormal basal ganglia morphology
    term:
      id: HP:0002134
      label: Abnormal basal ganglia morphology
  evidence:

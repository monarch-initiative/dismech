name: Uner Tan Syndrome
creation_date: "2026-08-20T18:20:00Z"
category: Mendelian
disease_term:
  preferred_term: Uner Tan Syndrome
  term:
    id: MONDO:0100144
    label: Uner Tan Syndrome
description: >-
  Uner Tan syndrome (recessive quadrupedalism) is the allele-specific outlier of
  the tubulinopathies. It is caused by a biallelic TUBB2B p.Arg390Gln
  substitution, and almost everything about it runs against the pattern of the
  gene's other disease.

  TUBB2B is otherwise a dominant cortical-malformation gene: heterozygous de novo
  missense variants cause asymmetrical polymicrogyria and complex cortical
  dysplasia (CDCBM7), characteristically with dysmorphic basal ganglia. Uner Tan
  syndrome is recessive, arising in a consanguineous family with three affected
  siblings; its defining features are quadrupedal locomotion and severe cerebellar
  hypoplasia; and it explicitly LACKS the basal ganglia malformations typically
  associated with TUBB2B mutations. The molecular lesion is correspondingly
  milder: R390Q does not impair beta-tubulin folding, heterodimer assembly, or
  incorporation of mutant-containing heterodimers into microtubule polymers.
  Modelled in yeast TUB2, the 390Q substitution did not affect growth under basal
  conditions but increased sensitivity to microtubule-depolymerizing drugs -
  evidence of a mild effect on microtubule function rather than a disabling one.

  That combination - a mild, non-incorporation-blocking allele that needs two
  copies and hits the cerebellum rather than the basal ganglia - is why this is
  curated as its own entry rather than folded into TUBB2A/TUBB2B-related Cortical
  Malformation, and why that entry maps it as `skos:relatedMatch` rather than
  narrowMatch. It also carries a general lesson the authors draw explicitly: it
  reinforces the sensitivity of the developing cerebellum to microtubule defects.
parents:
- hereditary neurological disease
- congenital nervous system disorder

pathophysiology:
- name: Mildly Destabilizing TUBB2B p.Arg390Gln Substitution
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    The molecular lesion, and the reason this disease is recessive. R390Q is a
    functionally mild allele: it does not affect the ability of beta-tubulin to
    fold, to be assembled into the alpha/beta heterodimer, or to be incorporated
    into microtubule polymers - the three failure modes that make other TUBB2B
    alleles dominant. What it does produce, modelled in the yeast TUB2 orthologue,
    is normal growth under basal conditions with increased sensitivity to
    microtubule-depolymerizing drugs. An allele that only reveals itself under
    challenge is an allele that a single wild-type copy can compensate for, which
    is precisely what recessive inheritance means here.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: missense
    description: >-
      Homozygous missense. PARTIAL_LOSS_OF_FUNCTION is the value the evidence
      supports and is deliberately different from the values used elsewhere in
      the tubulin family: this allele is NOT dominant-negative, because a
      dominant-negative subunit must incorporate into the polymer and this one
      incorporates normally without disabling it; and it is not a complete loss of
      function, because folding, dimerization and incorporation are all intact and
      basal function is preserved. The measured deficit is reduced resilience -
      increased sensitivity to depolymerization.
  genes:
  - preferred_term: TUBB2B
    term:
      id: hgnc:30829
      label: TUBB2B
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term:

      showed severe cerebellar hypoplasia.
    explanation: >-
      Names quadrupedal locomotion as the identifying feature and places it
      alongside the cerebellar finding.
- name: Cerebellar Hypoplasia
  description: >-
    Severe cerebellar hypoplasia in all three affected individuals - the
    structural lesion underlying the gait phenotype.
  phenotype_term:
    preferred_term: Cerebellar hypoplasia
    term:
      id: HP:0001321
      label: Cerebellar hypoplasia
    severity: SEVERE
  evidence:

discussions:
- discussion_id: gap_uner_tan_arg390_versus_tubb2a_arg391
  prompt: >-
    Why does substitution of the equivalent arginine give a mild recessive
    cerebellar disorder in TUBB2B (Arg390Gln) and a severe dominant cortical
    malformation in TUBB2A (Arg391His)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mildly Destabilizing TUBB2B p.Arg390Gln Substitution
  rationale: >-
    This is the sharpest available natural experiment on tubulin isotype
    specificity, and nobody appears to have run it. TUBB2A p.Arg391His is a
    recurrent hotspot found across multiple unrelated families, is dominant, and
    is associated with severe brain developmental disorders through disrupted
    alpha/beta heterodimer formation at the longitudinal E-site interface. TUBB2B
    p.Arg390Gln is the structurally equivalent residue in a paralogous isotype
    that is 90-plus percent identical - and it is recessive, mild, does NOT
    disrupt heterodimer formation, and produces cerebellar rather than cortical
    and basal ganglia disease.

    Three explanations are available and are not mutually exclusive. The
    substitution differs (glutamine versus histidine), so the chemistry may
    matter more than the position. The isotypes differ in expression timing and
    tissue distribution, so the same lesion may be felt in different places. Or
    the E-site interface tolerance genuinely differs between the two paralogues
    despite their sequence identity. Distinguishing these would require the
    reciprocal experiment - Arg390His in TUBB2B and Arg391Gln in TUBB2A, assayed
    in a common background for heterodimer formation and incorporation. Until
    then, this pair is the strongest reason not to reason about a tubulin variant
    by analogy to the equivalent position in a sibling isotype.
  evidence:
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the R390Q substitution revealed that it did not
      affect the ability of β-tubulin to fold or become assembled into the
      α/β-heterodimer, nor did it influence the incorporation of
      mutant-containing heterodimers into microtubule polymers.
    explanation: >-
      The TUBB2B side of the comparison - heterodimer assembly explicitly intact.
  - reference: PMID:41080462
    reference_title: A mutational hotspot in TUBB2A associated with impaired heterodimer formation and severe brain developmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Computational modeling demonstrated that the variant disrupts α/β-tubulin
      heterodimer formation, impairing binding stability at this critical
      interaction site.
    explanation: >-
      The TUBB2A side - the equivalent residue's substitution does disrupt
      heterodimer formation, the opposite result.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md, which identified
  MONDO:0100144 as an is-a descendant of MONDO:0100153 tubulinopathy that no
  DisMech entry covered.

  Curated as a SEPARATE entry rather than folded into TUBB2A/TUBB2B-related
  Cortical Malformation, and that entry maps it as skos:relatedMatch with a
  gap_tubb2b_uner_tan_boundary discussion recording the reasoning. Three
  differences drive the split: recessive versus dominant inheritance; cerebellar
  hypoplasia with explicitly ABSENT basal ganglia malformation, where the other
  entry curates dysmorphic basal ganglia as a core feature; and a molecularly
  mild allele that leaves folding, dimerization and polymer incorporation intact,
  where the other entry's trigger node curates impaired heterodimer formation.

  NOT added as a member of the Tubulinopathies grouping despite being a MONDO
  tubulinopathy descendant. The grouping's NECESSARY criterion requires
  conformance to microtubule_dependent_neuronal_migration_failure, and this
  disorder has no evidenced cortical migration failure - its lesion is cerebellar
  developmental failure. Adding it would require either evidence of migration
  failure or a re-scoped criterion.

  functional_impact_category is PARTIAL_LOSS_OF_FUNCTION, the only use of that
  value in the tubulin family here, and it is evidenced rather than inferred: the
  allele incorporates normally and preserves basal function, so it is neither
  dominant-negative nor a null.

  Eponym scope caveat (added 2026-08-22 in QA). The name "Uner Tan syndrome" is
  used more broadly in the clinical literature than this entry is scoped. It was
  originally applied to families with quadrupedal gait, cerebellar hypoplasia and
  intellectual disability caused by VLDLR, CA8, WDR81 and ATP8A2 - concepts MONDO
  keeps separate as cerebellar ataxia, intellectual disability and dysequilibrium
  syndrome (CAMRQ) 1-4: MONDO:0024542, MONDO:0012430, MONDO:0013188 and
  MONDO:0014104. MONDO:0100144, the term this entry binds, is defined
  specifically as the TUBB2B R390Q entity ("A tubulinopathy with material basis
  in TUBB2B that is characterized by variations in R390Q, quadrupedal
  locomotion, cerebellar hypoplasia and does not have basal ganglia
  malformations"), so the binding is correct - but a reader should not take this
  entry as covering every patient described in the literature under that name.
  The CAMRQ entries are not tubulin disorders and were out of scope for this
  tranche; they remain uncurated.

  All evidence snippets are quoted from cached abstracts.

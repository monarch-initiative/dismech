pathophysiology:
- name: TUBB2B p.Arg390Gln-Associated Microtubule-Function Perturbation
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    The biallelic p.Arg390Gln substitution is the molecular trigger. Assays found
    no detectable defect in three measured steps: beta-tubulin folding,
    alpha/beta-heterodimer assembly, and incorporation into microtubule polymers.
    A homologous yeast model showed normal basal growth but increased sensitivity
    to microtubule-depolymerizing drugs. The human neural-cell consequence and
    precise functional class remain unresolved.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: missense
    description: >-
      Homozygous p.Arg390Gln. Intact performance in the assayed steps and a mild
      yeast challenge phenotype do not establish partial loss of function, prove
      haplosufficiency, or exclude unmeasured dominant-negative or other effects
      in human neurodevelopment.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the identifying quadrupedal locomotion, all three patients
      showed severe cerebellar hypoplasia.
    explanation: >-
      Establishes severe cerebellar hypoplasia in all affected individuals.
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      reinforces the sensitivity of the developing cerebellum to microtubule
      defects
    explanation: >-
      The general principle the authors draw - selective cerebellar vulnerability

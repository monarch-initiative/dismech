phenotypes:
- name: Quadrupedal Locomotion
  description: >-
    Habitual quadrupedal gait, the identifying feature of the syndrome and the
    reason it is also known as recessive quadrupedalism. It occurs on a background
    of severe cerebellar hypoplasia; the term is descriptive of the gait, not an
    explanation of it.
  phenotype_term:
    preferred_term: quadrupedal locomotion
    term:
      id: HP:0002066
      label: Gait ataxia
  notes: >-
    Bound to Gait ataxia because HPO has no term for quadrupedal locomotion, and
    the gait abnormality arises from severe cerebellar hypoplasia. The
    preferred_term carries the specific finding; do not read the binding as
    claiming these individuals have ordinary gait ataxia.
  evidence:
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

discussions:
- discussion_id: gap_uner_tan_arg390_versus_tubb2a_arg391
  prompt: >-
    Which of substitution chemistry, tubulin-isotype context, and zygosity
    explains the different observations for TUBB2B p.Arg390Gln and TUBB2A
    p.Arg391His?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TUBB2B p.Arg390Gln-Associated Microtubule-Function Perturbation
  rationale: >-
    TUBB2B p.Arg390Gln leaves the assayed folding, heterodimer-assembly, and
    polymer-incorporation steps intact and is reported in the biallelic state.
    The structurally corresponding TUBB2A p.Arg391His variant is heterozygous and
    computationally predicted to weaken heterodimer formation. These records do
    not isolate residue substitution, isotype background, or allele dosage.
    Reciprocal substitutions tested in the same experimental system could help
    separate those variables; the current comparison cannot establish an
    isotype-specific mechanism by analogy alone.
  evidence:
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the R390Q substitution revealed that it did not
      affect the ability of β-tubulin to fold or become assembled into the
      α/β-heterodimer, nor did it influence the incorporation of
      mutant-containing heterodimers into microtubule polymers.
    explanation: >-
      Defines the directly assayed TUBB2B side of the comparison.
  - reference: PMID:41080462
    reference_title: A mutational hotspot in TUBB2A associated with impaired heterodimer formation and severe brain developmental disorders.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Computational modeling demonstrated that the variant disrupts α/β-tubulin
      heterodimer formation, impairing binding stability at this critical
      interaction site.
    explanation: >-
      Defines the computational TUBB2A side and prevents it from being presented
      as an experimentally demonstrated cellular effect.
notes: >-
  This entry remains separate from TUBB2A/TUBB2B-related Cortical Malformation.
  That record maps MONDO:0100144 as skos:relatedMatch, reflecting a reviewed
  same-gene boundary rather than a subtype assertion. The existing CAMRQ umbrella
  record separately curates CAMRQ1 (VLDLR), CAMRQ2 (WDR81), CAMRQ3 (CA8), and
  CAMRQ4 (ATP8A2), correcting the earlier statement that these entities were
  uncurated.

  The entry is intentionally not a member of the Tubulinopathies grouping. That
  grouping currently requires evidence for microtubule-dependent neuronal
  migration failure; the cached evidence for this entity supports cerebellar
  developmental involvement but does not establish cortical migration failure.
  It is likewise not mapped to the cerebellar Purkinje-cell degeneration module:
  the documented lesion is developmental hypoplasia, not demonstrated
  degeneration.

  Curated prose uses affected individuals, intellectual disability where
  source-supported, and habitual quadrupedal locomotion. Terms such as primitive,
  devolution, reverse evolution, and atavism are not used: the curated evidence
  supports a locomotor phenotype and neurodevelopmental disorder, not an
  evolutionary hierarchy. The gait is not presented as proof of a single causal
  route from cerebellar hypoplasia.
review_notes: >-
  Evidence review completed 2026-08-24. The cache for PMID:28013290 remained
  content_type abstract_only after sanctioned regeneration, so clinical details
  available only in the full article were not promoted into structured or
  snippet-backed claims. The modality of the reported structural brain findings
  is consequently left unspecified. PMID:19465910 is also abstract-only;
  PMID:41080462 is cached as full_text_xml. Every evidence snippet is exact text
  from the corresponding cache and its evidence_source reflects human clinical,
  in-vitro, model-organism, computational, or author-inference provenance.

  Functional-impact classification was changed from PARTIAL_LOSS_OF_FUNCTION to
  UNKNOWN. Intact performance in selected assays and mild yeast drug sensitivity
  do not prove hypomorphic loss of function, explain recessivity, or exclude
  unmeasured mechanisms. The variant-to-cerebellar link is therefore explicitly
  INDIRECT_UNKNOWN_INTERMEDIATES, and cerebellar hypoplasia is not asserted to
  cause habitual quadrupedal locomotion.

  Frequencies are reported only as 3/3 affected individuals in the single family,
  not as population estimates. The negative basal-ganglia observation is modeled
  as a supported negative structural finding rather than a positive HPO
  abnormality with REFUTE evidence. HP:0009878 replaces the nonspecific
  gait-ataxia binding because it is the exact HPO term for cerebellar ataxia
  associated with quadrupedal gait.

  No disorder-specific therapeutic study or management guideline was present in
  the reviewed evidence, so unsupported treatment-effect entries were removed.
  Exact-name and gene/variant ClinicalTrials.gov searches returned no registered
  studies on 2026-08-24; clinical_trials is therefore empty. Disease- and
  variant-specific NCBI GDS, SRA, and BioProject searches returned no dedicated
  dataset. The full article's dbGaP accession belongs to a broader
  controlled-access exome initiative rather than a Uner Tan syndrome-specific
  dataset, so datasets is empty and no dbGaP cache was created. A current literature scan did
  not provide adequate evidence to expand MONDO:0100144 beyond p.Arg390Gln; a
  later biallelic TUBB2B report involved a dual molecular diagnosis and was not
  used to lump entities.

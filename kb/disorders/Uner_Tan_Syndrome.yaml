    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the R390Q substitution revealed that it did not
      affect the ability of β-tubulin to fold or become assembled into the
      α/β-heterodimer, nor did it influence the incorporation of
      mutant-containing heterodimers into microtubule polymers.
    explanation: >-
      Excludes the folding, dimerization and incorporation defects that make
      other tubulin alleles dominant, which is the basis for the
      PARTIAL_LOSS_OF_FUNCTION assignment.
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The 390Q mutation in S. cerevisiae TUB2 did not affect growth under basal
      conditions, but did result in increased sensitivity to
      microtubule-depolymerizing drugs, indicative of a mild impact of this
      mutation on microtubule function.
    explanation: >-
      Quantifies the residual deficit as increased sensitivity to
      depolymerization under challenge, with basal function preserved.
  downstream:
  - target: Cerebellar Developmental Failure
    description: >-
      A mild microtubule-stability deficit is nonetheless sufficient to derail
      cerebellar development, the tissue this disorder identifies as most
      sensitive.
- name: Cerebellar Developmental Failure
  biological_scale: TISSUE
  description: >-
    The tissue-level lesion, and the disorder's central biological claim. All
    three affected individuals showed severe cerebellar hypoplasia, while the
    basal ganglia - malformed in the dominant TUBB2B disorder - were spared. The
    authors draw the general inference: this case reinforces the sensitivity of
    the developing cerebellum to microtubule defects. Whatever sets the threshold
    for microtubule dysfunction, the cerebellum crosses it first.
  biological_processes:
  - preferred_term: cerebellum development
    term:
      id: GO:0021549
      label: cerebellum development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28013290

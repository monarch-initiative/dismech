    The tested MADS-domain variants impair DNA binding without detectable interference with
    wild-type MEF2C in the reported assay, supporting loss of function.
  evidence:
  - reference: PMID:32418612
    reference_title: MEF2C Hypofunction in Neuronal and Neuroimmune Populations Produces MEF2C Haploinsufficiency Syndrome-like Behaviors in Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO

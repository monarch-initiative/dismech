genetic:
- name: MEF2C
  gene_term:
    preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The MEF2C association includes coding loss of function and proposed expression-mediated
    loss of function from distal rearrangements. Neither rearrangement directly disrupts MEF2C
    coding sequence at a breakpoint. The DGAP218 inversion encompasses MEF2C, so retained coding
    sequence does not mean absence of physical overlap. GeneReviews clinical observations are
    disease-level baseline findings and are not assigned wholesale to either regulatory case.
    Larger upstream deletions can remove additional genes, and require allele-specific assessment
    before attribution of the entire phenotype to MEF2C.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of MEF2C-related disorder is established in a proband by identification
      of a heterozygous pathogenic variant in MEF2C by molecular genetic testing.
    explanation: Establishes the gene-disease association.
  - reference: PMID:30445463
    reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although, for these very large deletions, deletion of other genes probably contributes
      to the aberrant phenotype
    explanation: Preserves potential contributions from other deleted genes.
  variants:
  - name: DGAP191 translocation affecting MEF2C-AS1 and the MEF2C regulatory domain
    variant_type: translocation
    gene:
      preferred_term: MEF2C-AS1
      term:
        id: hgnc:48908
        label: MEF2C-AS1
    regulatory_target_gene:
      preferred_term: MEF2C
      term:
        id: hgnc:6996
        label: MEF2C
    affected_regions:
    - name: MEF2C-AS1 breakpoint region at 5q14.3
      chromosomal_region: 5q14.3
      within_gene:
        preferred_term: MEF2C-AS1
        term:
          id: hgnc:48908
          label: MEF2C-AS1
      description: >-
        The named region is the 5q14.3 breakpoint interval within the genomic span of MEF2C-AS1.
        It lies in the distal regulatory landscape of MEF2C. It does not denote the entire rearrangement,
        a deleted enhancer, or a precisely localized TAD boundary.
    - name: Upstream MEF2C neuronal regulatory domain
      chromosomal_region: 5q14.3
      description: >-
        The upstream regulatory landscape contains multiple experimentally tested neuronal enhancers
        contacted by the MEF2C promoter. Rearrangements can alter its continuity while leaving
        MEF2C coding sequence intact; different alleles affect different parts of the domain.
    description: >-
      De novo t(5;7)(q14.3;q21.3). Andersen et al. Table 1 reports GRCh38/hg38 breakpoint intervals
      chr5:89411065-89411070 and chr7:94378248-94378255. These are the source-reported breakpoint
      intervals, not a single invented junction. The chr5 break lies within MEF2C-AS1; the chr7
      break overlaps ENSG00000285090. MEF2C coding sequence is intact. The 2024 report reanalyzes
      the same individual studied by Redin et al., not a new independent allele.
    functional_effects:
    - function: MEF2C expression regulation
      description: >-
        MEF2C RNA is reduced in patient LCLs. Enhancer disconnection and interruption of MEF2C-AS1
        are both plausible contributors. MEF2C-AS1 knockdown lowers MEF2C in 293T cells, but
        does not recreate this patient rearrangement or demonstrate its effect in developing
        brain.
      regulatory_mechanism: Distal regulatory-domain rearrangement with lncRNA interruption
    evidence:
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: In both cases, the 5q14.3 breakpoints directly disrupt the lncRNA MEF2C-AS1.
      explanation: The primary reanalysis links both named subjects to physical MEF2C-AS1 disruption.
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We additionally identified two cases, DGAP191 and DGAP218, with chromosomal
        rearrangements that disrupt the lncRNA MEF2C-AS1. ...
        t(5;7)(5pter→5q14.3(+)(89,411,06{3–5})::7q21.3(+)(94,378,2{48–50})→7qter;7pter→7q21.3(+)(94,378,25{3–5})::5q14.3(+)(89,411,07{0–2})→5qter)dn
      explanation: >-
        The authors identify the two MEF2C-AS1-disrupting rearrangements in prose; the
        explicit ellipsis separates that statement from this case's derivative-sequence
        notation. The notation preserves the published junction detail, while Table 1
        gives the summarized GRCh38 breakpoint intervals retained in the description.
    - reference: PMID:27841880
      reference_title: The genomic landscape of balanced cytogenetic abnormalities associated with human congenital anomalies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Correspondingly, in four subjects that harbored BCA breakpoints up to 860 kb distal
        to MEF2C, and for which RNA from lymphoblastoid cell lines (LCLs) was available, MEF2C
        expression was significantly reduced compared to controls
      explanation: Patient-derived LCLs establish an RNA abundance effect.
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, we experimentally tested the lncRNAs TBX2-AS1 and MEF2C-AS1 and found that
        knockdown of these lncRNAs resulted in decreased expression of the neighboring transcription
        factors TBX2 and MEF2C, respectively.
      explanation: The independent lncRNA knockdown experiment supports an additional regulatory mechanism.

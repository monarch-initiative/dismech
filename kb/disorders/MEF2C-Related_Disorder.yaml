- name: MEF2C-AS1 Translocation Breakpoint (DGAP191)
  biological_scale: MOLECULAR
  role: trigger
  subtypes:
  - Regulatory structural variant
  genetic_context:
    gene:
      preferred_term: MEF2C-AS1
      term:
        id: hgnc:48908
        label: MEF2C-AS1
    variant_type: translocation
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: DGAP191 de novo translocation with intact MEF2C coding sequence
    affected_regions:
    - name: MEF2C-AS1 breakpoint region at 5q14.3
      chromosomal_region: 5q14.3
      within_gene:
        preferred_term: MEF2C-AS1
        term:
          id: hgnc:48908
          label: MEF2C-AS1
      description: >-
        The named region is the 5q14.3 breakpoint interval within the genomic span of MEF2C-AS1.
        It lies in the distal regulatory landscape of MEF2C. It does not denote the entire rearrangement,
        a deleted enhancer, or a precisely localized TAD boundary.
    - name: Upstream MEF2C neuronal regulatory domain
      chromosomal_region: 5q14.3
      description: >-
        The upstream regulatory landscape contains multiple experimentally tested neuronal enhancers
        contacted by the MEF2C promoter. Rearrangements can alter its continuity while leaving
        MEF2C coding sequence intact; different alleles affect different parts of the domain.
  description: >-
    A de novo translocation between chromosomes 5 and 7 interrupts MEF2C-AS1 at 5q14.3. The
    chromosome 7 break also overlaps a second lncRNA, ENSG00000285090. No protein-coding gene
    is directly disrupted in the 2024 reannotation.
  evidence:
  - reference: PMID:39060644
    reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both cases, the 5q14.3 breakpoints directly disrupt the lncRNA MEF2C-AS1.
    explanation: >-
      Localizes the 5q14.3 break within MEF2C-AS1, independently of the proposed expression
      mechanism.
  - reference: PMID:39060644
    reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In DGAP191, the 7q21.3 breakpoints additionally overlap the lncRNA ENSG00000285090, but
      no protein-coding genes are directly disrupted
    explanation: Defines physical overlap for this individual rearrangement.
  downstream:
  - target: Altered Distal MEF2C Enhancer Connections
    description: >-
      The rearrangement separates MEF2C from distal regulatory elements; its exact neural contact
      effects have not been measured in the patient.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, the separation of these distal enhancers from MEF2C could certainly contribute
        to the phenotypes of these individuals.
      explanation: The authors retain enhancer separation as a candidate contribution in these two cases.
      directness: INDIRECT
  - target: Impaired MEF2C-AS1 Regulatory Activity
    description: Interruption of the lncRNA locus may impair its support of neighboring MEF2C expression.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, for DGAP191 and DGAP218 we now propose that the disruption of MEF2C-AS1 leads
        to decreased expression of MEF2C, resulting in neurological phenotypes.
      explanation: This is the authors' mechanistic proposal, not proof of the full patient pathway.
      directness: INDIRECT

- name: Altered Distal MEF2C Enhancer Connections
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  subtypes:
  - Regulatory structural variant
  description: >-
    The upstream MEF2C domain contains multiple distal regulatory elements that contact the
    promoter in SH-SY5Y cells. Reporter assays and zebrafish embryos demonstrate activity of
    individual elements. Rearrangements are proposed to impair the relevant connections, but
    these experiments do not recreate the complete DGAP191 or DGAP218 allele in developing human
    brain.
  evidence:
  - reference: PMID:30445463
    reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Through circularized chromosome conformation capture sequencing (4C-seq) and the assay
      for transposase-accessible chromatin using sequencing (ATAC-seq), we revealed a complex
      interaction network in which the MEF2C promoter physically contacts several distal enhancers
      that are deleted or translocated by disease-associated SVs.
    explanation: >-
      4C and accessibility data identify the reference regulatory network and its relationship
      to reported SVs.
    directness: INDIRECT
  - reference: PMID:30445463
    reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further analyses of their in vivo activity in zebrafish showed that each of these enhancers
      has a distinct activity pattern during development, with eight enhancers displaying neuronal
      activity.
    explanation: Supports developmental enhancer activity; these are reporter assays of separate elements.
    directness: INDIRECT
  downstream:
  - target: Reduced MEF2C RNA Abundance
    description: >-
      Loss of effective distal enhancer connections is one proposed cause of reduced MEF2C expression.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30445463
      reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The MEF2C promoter interacts with multiple distal neuronal enhancers in its upstream
        region and the disruption of these interactions by chromosomal abnormalities could lead
        to haploinsufficiency in early brain development and result in a similar phenotypic
        outcome as MEF2C coding mutations.
      explanation: >-
        The study proposes this chain from enhancer-network disruption to developmental MEF2C
        deficiency.
      directness: INDIRECT
- name: Impaired MEF2C-AS1 Regulatory Activity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  subtypes:
  - Regulatory structural variant
  genes:
  - preferred_term: MEF2C-AS1
    term:
      id: hgnc:48908
      label: MEF2C-AS1
  description: >-
    MEF2C-AS1 overlaps the regulatory landscape and may support expression of MEF2C through
    its RNA product, the act of transcription, or both. siRNA knockdown in Lenti-X 293T cells
    lowers MEF2C RNA, supporting an RNA-dependent contribution. The assay does not establish
    the lncRNA mechanism in patient neural tissue or exclude enhancer disconnection.
  evidence:
  - reference: PMID:39060644
    reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, we experimentally tested the lncRNAs TBX2-AS1 and MEF2C-AS1 and found that
      knockdown of these lncRNAs resulted in decreased expression of the neighboring transcription
      factors TBX2 and MEF2C, respectively.
    explanation: Perturbing lncRNA abundance supports regulation of the neighboring gene in cultured cells.
    directness: INDIRECT
  downstream:
  - target: Reduced MEF2C RNA Abundance
    description: >-
      Reduced MEF2C-AS1 activity may contribute to the lower MEF2C abundance seen in rearrangement
      carriers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39060644
      reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, we experimentally tested the lncRNAs TBX2-AS1 and MEF2C-AS1 and found that
        knockdown of these lncRNAs resulted in decreased expression of the neighboring transcription
        factors TBX2 and MEF2C, respectively.
      explanation: >-
        The knockdown effect supports this candidate edge, with extrapolation to the patient
        rearrangements.
      directness: INDIRECT
- name: Reduced MEF2C RNA Abundance
  biological_scale: MOLECULAR
  subtypes:
  - Regulatory structural variant
  genes:
  - preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  description: >-
    Lymphoblastoid cell lines from DGAP131, DGAP191, DGAP218 and DGAP222 show reduced MEF2C
    RNA relative to controls. This is direct evidence of an expression consequence in LCLs.
    Its magnitude and cellular distribution during brain development remain unmeasured; neither
    global nor modular loss-of-expression is assigned from a single assayed cell type.
  biological_processes:
  - preferred_term: gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: DECREASED
  evidence:
  - reference: PMID:27841880
    reference_title: The genomic landscape of balanced cytogenetic abnormalities associated with human congenital anomalies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Correspondingly, in four subjects that harbored BCA breakpoints up to 860 kb distal to
      MEF2C, and for which RNA from lymphoblastoid cell lines (LCLs) was available, MEF2C expression
      was significantly reduced compared to controls
    explanation: Measures the expression consequence in four patient-derived LCLs.
  downstream:
  - target: Reduced Functional MEF2C Dosage
    description: >-
      Reduced expression is proposed to limit MEF2C activity during neural development; patient
      LCL measurements alone do not establish that tissue-specific step.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30445463
      reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The MEF2C promoter interacts with multiple distal neuronal enhancers in its upstream
        region and the disruption of these interactions by chromosomal abnormalities could lead
        to haploinsufficiency in early brain development and result in a similar phenotypic
        outcome as MEF2C coding mutations.
      explanation: >-
        Supports the proposed neural link while preserving the difference between regulatory
        mapping and patient brain measurements.
      directness: INDIRECT
- name: Reduced Functional MEF2C Dosage
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  description: >-
    Reduced MEF2C transcription-factor activity is the central coding haploinsufficiency mechanism.
    The regulatory-SV route is proposed to converge here through reduced expression, while MEF2C
    coding sequence remains intact. The neural consequences of the full regulatory alleles have
    not been directly assayed.
  evidence:
  - reference: PMID:32418612
    reference_title: MEF2C Hypofunction in Neuronal and Neuroimmune Populations Produces MEF2C Haploinsufficiency Syndrome-like Behaviors in Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that MCHS-associated missense mutations cluster in the conserved DNA binding

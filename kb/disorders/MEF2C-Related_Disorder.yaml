diagnosis:
- name: Molecular genetic diagnosis
  description: >-
    Molecular testing identifies a heterozygous pathogenic MEF2C variant in the established
    coding/deletion disorder. Variant interpretation must fit the clinical findings.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of MEF2C-related disorder is established in a proband by identification
      of a heterozygous pathogenic variant in MEF2C by molecular genetic testing.
    explanation: Provides the baseline diagnostic criterion.
- name: Structural variant and breakpoint assessment
  description: >-
    In a compatible phenotype with intact MEF2C coding sequence, assessment of balanced rearrangements
    and distal copy-number changes can identify a regulatory hypothesis. Breakpoint mapping,
    the other affected loci, and functional evidence matter; overlap with the domain alone does
    not establish a diagnosis.
  evidence:
  - reference: PMID:27841880
    reference_title: The genomic landscape of balanced cytogenetic abnormalities associated with human congenital anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data strongly argue for the implementation of technologies capable of detecting
      both balanced and unbalanced genomic rearrangements.
    explanation: Supports structural-variant detection beyond sequence variants.
  - reference: PMID:30445463
    reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Structural variants (SVs) upstream of MEF2C, which do not disrupt the gene itself, have
      also been found in patients with a similar phenotype, suggesting that disruption of MEF2C
      regulatory elements can also cause a Rett-like phenotype.
    explanation: Supports considering distal structural variants in the relevant phenotype.
treatments:
- name: Developmental and rehabilitation support
  description: >-
    Developmental and educational services, physical and occupational therapy, and individualized
    communication support address functional needs.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Developmental and educational services; treatment of gait abnormalities per orthopedist,
      physical medicine and rehabilitation specialist, and/or physical or occupational therapist
    explanation: Supports multidisciplinary developmental and motor care.
- name: Individualized seizure management
  description: >-
    Seizures receive standard treatment tailored to seizure type and response; this entry does
    not assert a specific preferred drug for regulatory-SV disease.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: standard treatment for gastroesophageal reflux disease, constipation, and seizures
    explanation: GeneReviews recommends standard symptomatic seizure management.
- name: Feeding and gastrointestinal support
  description: >-
    Assess oral feeding safety and nutritional needs, provide feeding support, and treat reflux
    or constipation when present.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      feeding support as needed; standard treatment for gastroesophageal reflux disease, constipation,
      and seizures
    explanation: Supports feeding and gastrointestinal care.
- name: Cardiac, visual, and infection-directed care
  description: >-
    Cardiology and ophthalmology care are guided by individual findings. Recurrent respiratory
    or ear infections warrant standard treatment and hearing assessment when indicated.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      treatment of cardiac manifestations per cardiologist; treatment of refractive errors and
      strabismus per ophthalmologist
    explanation: Supports specialist care for documented cardiac and visual manifestations.
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: antibiotics as needed for recurrent respiratory infections and recurrent otitis media
    explanation: Supports treatment of recurrent infections as required.

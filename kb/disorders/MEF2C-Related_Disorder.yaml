name: MEF2C-Related Disorder
creation_date: '2026-09-21T23:01:23Z'
category: Mendelian
synonyms:
- MEF2C haploinsufficiency syndrome
- MEF2C-related neurodevelopmental disorder
- MEF2C deficiency
- Neurodevelopmental disorder with hypotonia, stereotypic hand movements, and impaired language
- NEDHSIL
description: >-
  MEF2C-related disorder is an autosomal dominant neurodevelopmental disorder with developmental
  delay, intellectual disability, severe speech impairment, hypotonia, seizures, and stereotypic
  movements. Loss of functional MEF2C can follow coding variants or deletions involving the
  gene. A separate group of structural variants leaves MEF2C coding sequence intact but disrupts
  its upstream regulatory domain, including the MEF2C-AS1 long noncoding RNA. These regulatory
  cases support reduced MEF2C expression, while the relative contributions of enhancer disconnection
  and lncRNA disruption remain incompletely resolved. Large multigene deletions can add effects
  from other genes and are not assumed to produce a purely MEF2C-mediated phenotype.
disease_term:
  preferred_term: MEF2C-related disorder
  term:
    id: MONDO:0013266
    label: neurodevelopmental disorder with hypotonia, stereotypic hand movements, and impaired language
parents:
- Neurodevelopmental Disorder
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most tested families have a de novo pathogenic variant. Rare transmission from an affected
    heterozygous parent or an unaffected mosaic parent has been reported.
  evidence:
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: MEF2C-related disorder is an autosomal dominant disorder.
    explanation: Establishes the inheritance pattern.
  - reference: PMID:39666846
    reference_title: MEF2C-Related Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rarely, a proband diagnosed with MEF2C-related disorder has the disorder as the result
      of a pathogenic variant inherited from an affected heterozygous parent or an unaffected
      mosaic parent.
    explanation: Qualifies the predominantly de novo presentation.
has_subtypes:
- name: Coding loss of function
  description: Pathogenic coding variants or deletions that directly impair MEF2C function.
  genes:
  - preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  evidence:
  - reference: PMID:32418612
    reference_title: MEF2C Hypofunction in Neuronal and Neuroimmune Populations Produces MEF2C Haploinsufficiency Syndrome-like Behaviors in Mice.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We showed that MCHS-associated missense mutations cluster in the conserved DNA binding
      domain and disrupt MEF2C DNA binding.
    explanation: Patient-associated coding variants were tested for impaired DNA binding.
- name: Regulatory structural variant
  description: >-
    Rearrangements in the upstream MEF2C regulatory landscape with intact MEF2C coding sequence.
    DGAP191 and DGAP218 also disrupt MEF2C-AS1; enhancer and lncRNA mechanisms may both contribute.
  genes:
  - preferred_term: MEF2C
    term:
      id: hgnc:6996
      label: MEF2C
  evidence:
  - reference: PMID:30445463
    reference_title: A neuronal enhancer network upstream of MEF2C is compromised in patients with Rett-like characteristics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Structural variants (SVs) upstream of MEF2C, which do not disrupt the gene itself, have
      also been found in patients with a similar phenotype, suggesting that disruption of MEF2C
      regulatory elements can also cause a Rett-like phenotype.
    explanation: Defines the intact-target regulatory disease context.
  - reference: PMID:39060644
    reference_title: Chromosomal structural rearrangements implicate long non-coding RNAs in rare germline disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In both cases, the 5q14.3 breakpoints directly disrupt the lncRNA MEF2C-AS1.
    explanation: The two exemplar alleles also physically disrupt a noncoding RNA gene.

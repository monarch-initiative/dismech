    evidence:
    - reference: PMID:32418612
      reference_title: MEF2C Hypofunction in Neuronal and Neuroimmune Populations Produces MEF2C Haploinsufficiency Syndrome-like Behaviors in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We detected hundreds of dysregulated genes in Mef2c-Het cortex, including significant

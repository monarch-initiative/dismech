pathophysiology:
- name: Loss of Function in P2RY12
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Biallelic pathogenic variants in P2RY12 abolish or severely impair platelet
    P2Y12 receptor activity through three documented molecular mechanisms. First,
    null alleles — including frameshift deletions causing premature truncation
    (such as c.378delC / p.Thr126fs*34) and large whole-allele genomic P2RY12
    deletions transmitted in trans — eliminate functional surface receptor
    expression and reduce platelet [33P]2MeS-ADP binding sites. Second,
    signaling-defective missense variants in transmembrane helix 6 (p.Arg256Gln)
    and extracellular loop 3 (p.Arg265Trp) preserve normal surface expression
    and ligand-binding affinity while impairing post-occupancy receptor signal
    transduction. Third, substitution within the conserved GPCR DRY motif
    (p.Arg122Cys) triggers agonist-independent receptor internalization and
    lysosomal trafficking, depleting cell-surface P2Y12. Quantitative binding
    assays alone miss the second class entirely.

- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    A partial rather than complete failure of primary hemostatic plug
    consolidation, explaining why clinical bleeding is generally milder than in
    alphaIIbbeta3 or GPIb-IX-V deficiency: initial vWF-mediated adhesion, P2Y1
    shape change, the primary reversible aggregation wave, and integrin
    alphaIIbbeta3 abundance are preserved, whereas ADP-driven autocrine
    amplification that stabilizes the platelet thrombus under shear is lost.
    Pharmacological blockade of the same receptor in humans potently inhibits
    arterial thrombus growth while increasing bleeding risk.

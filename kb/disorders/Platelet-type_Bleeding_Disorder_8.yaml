    preferred_term: Prolonged bleeding time
    term:
      id: HP:0003010
      label: Prolonged bleeding time
  evidence:
  - reference: PMID:12578987
    reference_title: "Molecular bases of defective signal transduction in the platelet P2Y12 receptor of a patient with congenital bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The template bleeding time (Symplate II; Organon Teknika, Durham, NC), was 19 and 30 min in two different determinations in AC (normal range: 2–8 min); it was 7.0 min in MC and 6.5 min in FC."
    explanation: >-
      Quantifies marked prolongation of template bleeding time (19–30 min vs
      normal 2–8 min) in biallelic P2Y12 deficiency.
  - reference: PMID:19229056
    reference_title: "Haploinsufficiency of the platelet P2Y12 gene in a family with congenital bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Briefly, IG and MG had severely prolonged bleeding time and suffered a lifelong history of easy bruising, epistaxis, menorrhagia, and bleeding complications after dental extractions or major surgery."
    explanation: >-
      Confirms severely prolonged bleeding time in null/frameshift P2RY12
      deficiency.
genetic:
- name: P2RY12
  gene_term:
    preferred_term: P2RY12
    term:
      id: hgnc:18124
      label: P2RY12
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_6b61af44-1fb4-4c7d-94b2-f21903793162-2025-04-07T160000.000Z
    evidence:
    - reference: CGGV:assertion_6b61af44-1fb4-4c7d-94b2-f21903793162-2025-04-07T160000.000Z
      reference_title: "P2RY12 / platelet-type bleeding disorder 8 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "| P2RY12 | HGNC:18124 | platelet-type bleeding disorder 8 | MONDO:0012354 | AR | Definitive | SOP11 | Hemostasis/Thrombosis Gene Curation Expert Panel | 2025-04-07T16:00:00.000Z |"
      explanation: >-
        ClinGen Hemostasis/Thrombosis Gene Curation Expert Panel reevaluation
        upgrading autosomal recessive P2RY12 / platelet-type bleeding disorder 8
        to Definitive (SOP11, 2025-04-07).
  notes: >-
    Encodes the 342-amino-acid Gi-coupled platelet ADP receptor P2Y12 (3q25.1;
    entire coding region within exon 2). Three loss-of-function allele classes
    are documented: (1) frameshift/truncating variants (such as c.378delC /
    p.Thr126fs*34) and whole-allele genomic deletions — notably, two sisters
    initially thought homozygous for c.378delC by PCR sequencing were shown by
    Southern blot and quantitative real-time PCR to be compound heterozygotes
    for c.378delC in trans with a large genomic P2RY12 deletion (PMID:19229056);
    (2) surface-expressed, signaling-defective missense variants in TM6
    (p.Arg256Gln) and EL3 (p.Arg265Trp) (PMID:12578987); and (3) DRY-motif
    missense variant p.Arg122Cys causing constitutive internalization and
    lysosomal degradation, reported alongside a modifying intronic F2R (PAR-1)
    polymorphism (PMID:24612435). One early patient carried a frameshift allele
    with an apparently normal coding allele presumed silenced by a regulatory
    variant (PMID:15852220).
  evidence:
  - reference: PMID:11196645
    reference_title: "Identification of the platelet ADP receptor targeted by antithrombotic drugs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe the cloning of this receptor, designated P2Y12, and provide evidence that a patient with a bleeding disorder has a defect in this gene."
    explanation: >-
      Establishes P2RY12 as the disease gene in congenital P2Y12 deficiency.
  - reference: PMID:12578987
    reference_title: "Molecular bases of defective signal transduction in the platelet P2Y12 receptor of a patient with congenital bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the patient's P2Y12 gene revealed a G-to-A transition in one allele, changing the codon for Arg-256 in the sixth transmembrane domain to Gln, and a C-to-T transition in the other allele, changing the codon for Arg-265 in the third extracellular loop to Trp."
    explanation: >-
      Documents compound heterozygous TM6 and EL3 missense alleles causing
      qualitative P2Y12 deficiency.
  - reference: PMID:19229056
    reference_title: "Haploinsufficiency of the platelet P2Y12 gene in a family with congenital bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-PCR revealed that GL, his mother and aunt have one single intact P2Y12 allele, while his father has two P2Y12 alleles. The single GL P2Y12 allele contains normal sequence, while his mother and aunt have the 378delC allele."
    explanation: >-
      Demonstrates compound heterozygosity for c.378delC and a trans whole-gene
      P2RY12 deletion missed by standard PCR sequencing alone.
  - reference: PMID:24612435
    reference_title: "A novel mutation in the P2Y12 receptor and a function-reducing polymorphism in protease-activated receptor 1 in a patient with chronic bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a patient with a chronic bleeding disorder expressing a homozygous P2RY(12) mutation, predicting an arginine to cysteine (R122C) substitution in the G-protein-coupled P2Y(12) receptor."
    explanation: >-
      Documents homozygous p.Arg122Cys DRY-motif mutation in chronic congenital
      bleeding.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Platelet-type bleeding disorder 8 (MONDO:0012354) is inherited in an
    autosomal recessive manner, with clinically significant bleeding occurring
    in biallelic individuals (homozygous frameshifts, homozygous p.Arg122Cys,
    compound heterozygous p.Arg256Gln/p.Arg265Trp, or c.378delC in trans with a
    large P2RY12 genomic deletion). Heterozygous carriers (such as the
    hemizygous son GL in PMID:19229056 and heterozygous offspring MC and FC in
    PMID:12578987) exhibit partial ex vivo platelet secretion/aggregation
    defects due to P2RY12 haploinsufficiency without spontaneous clinical
    bleeding. One early patient carried a coding frameshift alongside an
    apparently normal coding sequence presumed silenced in cis/trans by an
    unidentified regulatory hit. (Autosomal dominant P2RY12-related bleeding
    disorder is classified separately by ClinGen under MONDO:1060234.)
  evidence:
  - reference: PMID:15852220
    reference_title: "The P2 receptors and congenital platelet function defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sequence analysis of the P2Y (12) locus of three of these patients revealed homozygous mutations that produced a frame shift mutation and premature truncation of the protein."
    explanation: >-
      Establishes biallelic loss-of-function genotypes in the originally
      described severe-deficiency patients.
  - reference: PMID:12578987
    reference_title: "Molecular bases of defective signal transduction in the platelet P2Y12 receptor of a patient with congenital bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The P2Y12 defect is inherited as an autosomal recessive trait (1), and heterozygous patients display a mild abnormality of platelet function similar to that seen in the relatively common primary secretion defects."
    explanation: >-
      Directly states autosomal recessive inheritance and the subclinical
      laboratory phenotype of heterozygous carriers.
  - reference: PMID:15852220
    reference_title: "The P2 receptors and congenital platelet function defects."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The fourth patient had an allele with a frame shift mutation and a normal allele, which could be silenced by an additional, as yet unknown, mutation."
    explanation: >-
      Documents an early case in which standard coding-sequence PCR detected
      only one frameshift allele and an apparently normal coding allele presumed
      silenced by an undetected noncoding or structural second hit, highlighting
      a diagnostic pitfall in recessive P2RY12 testing.
diagnosis:
- name: Aggregometry Plus Adenylyl Cyclase Inhibition Testing
  diagnosis_term:
    preferred_term: platelet aggregation and adenylyl cyclase inhibition testing
    term:
      id: NCIT:C62662
      label: Coagulation Study
  description: >-
    Screening is by light-transmission lumiaggregometry — preserved ADP-induced
    shape change with incomplete, rapidly reversible aggregation even at ADP
    concentrations >=10 micromolar and blunted multi-agonist ATP secretion — but
    aggregometry alone is not confirmatory. Confirmation requires assays that
    directly measure ADP-mediated inhibition of prostaglandin E1-stimulated or
    forskolin-stimulated platelet cyclic AMP (or VASP phosphorylation), alongside
    radiolabeled [33P]2MeS-ADP binding to distinguish quantitative receptor
    absence from qualitative signaling defects (such as p.Arg256Gln/p.Arg265Trp).
    Excluding recent exposure to clopidogrel, prasugrel, ticlopidine, or
    ticagrelor is mandatory because pharmacological P2Y12 blockade phenocopies
    the laboratory signature exactly.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Tests that evaluate the degree of inhibition of adenylyl cyclase by ADP should be used to confirm the diagnosis."
    explanation: >-
      Establishes ADP-mediated adenylyl cyclase inhibition testing as the
      confirmatory functional assay.
  - reference: PMID:12578987
    reference_title: "Molecular bases of defective signal transduction in the platelet P2Y12 receptor of a patient with congenital bleeding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADP failed to lower the adenylyl cyclase activity stimulated by prostaglandin E1 in the patient's platelets"
    explanation: >-
      Demonstrates why adenylyl cyclase / cAMP inhibition testing is essential
      even when radioligand receptor binding site number is normal.
- name: P2RY12 Molecular Genetic Testing and Copy-Number Analysis
  diagnosis_term:
    preferred_term: P2RY12 molecular genetic testing and copy-number analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Direct sequencing of P2RY12 exon 2 (which encodes the entire 342-amino-acid
    protein) identifies missense and small frameshift variants, but must be
    supplemented by quantitative copy-number analysis (real-time qPCR or
    Southern blot) when a frameshift appears homozygous or when obligate
    relatives with mild platelet dysfunction show normal coding sequence, because
    whole-allele genomic deletions escape standard PCR amplification.
  evidence:
  - reference: PMID:19229056
    reference_title: "Haploinsufficiency of the platelet P2Y12 gene in a family with congenital bleeding diathesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the results of both quantitative PCR and Southern blotting analysis, support our hypothesis and illustrates the platelet phenotype associated with P2Y12 haploinsufficiency."
    explanation: >-
      Demonstrates the diagnostic necessity of quantitative PCR and Southern
      blot copy-number testing alongside exon 2 sequencing to detect deleted
      P2RY12 alleles.
differential_diagnoses:
- name: P2Y12 Antagonist Therapy (Acquired Phenocopy)
  description: >-
    Clopidogrel, prasugrel, ticlopidine, and ticagrelor block the same receptor,
    so a treated patient has an acquired form of this disorder and is
    laboratory-identical to one who inherited it. Drug exposure is the single
    most common cause of this aggregometric phenotype by a wide margin and must
    be excluded first. Conversely, roughly one-third of clopidogrel-treated
    patients fail to inhibit P2Y12 adequately due to variable prodrug
    bioactivation.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The most important drawback of clopidogrel is its inability to inhibit adequately P2Y₁₂-dependent platelet function in approximately one-third of patients who are therefore not protected from major cardiovascular events."
    explanation: >-
      Supports the pharmacological phenocopy relationship and the inter-patient
      variability of clopidogrel blockade.
- name: P2Y1 and P2X1 Receptor Defects
  description: >-
    Platelets carry two other P2 purinergic receptors: P2Y1 is Gq-coupled and
    drives intracellular Ca2+ mobilization, shape change, and the initial
    reversible aggregation wave, whereas P2X1 is a ligand-gated ATP cation
    channel. Loss of P2Y1 abolishes the ADP-induced shape change and Ca2+ flux
    that are preserved in P2Y12 deficiency.
  evidence:
  - reference: PMID:15852220
    reference_title: "The P2 receptors and congenital platelet function defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Platelets possess three P2 receptors: two (P2Y (1) and P2Y (12)) are receptors for adenosine diphosphate (ADP), and one (P2X1) is a receptor for adenosine triphosphate (ATP)."
    explanation: >-
      Establishes the three platelet purinergic receptors that form this
      differential.
  - reference: PMID:15852220
    reference_title: "The P2 receptors and congenital platelet function defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The P2Y (1) receptor, which is coupled to Gq and phospholipase C-beta, is responsible for mobilization of ionized calcium from internal stores and mediates the ADP-induced platelet shape change and initial wave of rapidly reversible aggregation."
    explanation: >-
      Supports the P2Y1 functional profile (shape change and Ca2+ mobilization)
      used to distinguish P2Y1 from P2Y12 defects.
- name: Dense-Granule Storage Pool Disease
  description: >-
    Dense granules hold the platelet's secreted store of ADP, so dense-granule
    storage pool deficiency degrades the same autocrine amplification loop from
    the ligand side rather than the receptor side and produces a similar absent
    second wave of aggregation. Distinguished by normal platelet ADP/ATP and
    serotonin content and preserved inhibition of PGE1-stimulated cAMP by
    exogenous ADP in storage pool disease.
  evidence:
  - reference: PMID:16722529
    reference_title: "Glanzmann thrombasthenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Defects in the second wave of aggregation to ADP or in the response to collagen can imply storage pool disease and an absence of the secretory stores of ADP in dense granules."
    explanation: >-
      States the overlapping second-wave ADP aggregation abnormality that makes
      dense-granule storage pool disease a key laboratory differential.
discussions:
- discussion_id: gap_congenital_vs_pharmacological_p2y12_loss
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is lifelong congenital P2Y12 loss only mildly to moderately
    haemorrhagic when acute pharmacological P2Y12 blockade measurably increases
    major bleeding?
  attaches_to:
  - pathophysiology#Failure of Primary Hemostatic Plug Formation
  - pathophysiology#Mild to Moderate Mucocutaneous Bleeding Diathesis
  rationale: >-
    The same receptor is lost in both cases, yet the clinical weight differs.
    Patients with congenital defects are described as mildly to moderately
    affected, while the newer antagonists, which inhibit P2Y12 effectively in
    most patients, increase the incidence of major bleeding. Several
    explanations are possible and are not distinguished by the available
    evidence: lifelong developmental compensation absent in an acutely treated
    patient; the fact that treated patients are older, comorbid and usually also
    taking aspirin; ascertainment bias, since mildly affected congenital cases
    are the ones that come to attention; or a genuinely more complete blockade
    by drug than by hypomorphic missense alleles. The question determines
    whether congenital patients can be counselled using the much larger evidence
    base from cardiovascular antiplatelet trials.
  proposed_experiments:
  - experiment_id: exp_p2y12_congenital_vs_treated_matched_comparison
    name: Matched comparison of residual P2Y12 function and bleeding phenotype
    description: >-
      Quantify residual ADP-induced adenylyl cyclase inhibition in congenital
      P2Y12-defect patients and in ticagrelor-treated volunteers, and pair each
      with a standardized bleeding-assessment tool score. If congenital patients
      retain more residual signalling than fully inhibited treated subjects, the
      difference is one of degree; if they do not, the explanation lies in
      compensation or dual-antiplatelet comorbidity rather than in the receptor.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although they increase the incidence of major bleedings, the net clinical benefit is in favor of the new P2Y₁₂ inhibitors."
    explanation: >-
      Establishes the pharmacological observation — effective P2Y12 blockade
      increases major bleeding — against which the mild-to-moderate congenital
      phenotype is contrasted.
notes: >-
  Conformance: this entry conforms to `primary_hemostatic_plug_failure` through
  the SIGNALLING/SECRETION arm — `#Impaired Platelet Activation, Granule
  Secretion, and Integrin Inside-Out Signalling` — which the module designates
  for platelet agonist-receptor defects (P2Y12, thromboxane A2 receptor, GPVI).
  It does not conform to the aggregation arm because integrin alphaIIbbeta3
  abundance is normal and impaired aggregation is a downstream read-out of lost
  Gi-mediated inside-out stabilization.

  Pharmacological counterpart: congenital P2Y12 deficiency is the inherited
  counterpart of ticlopidine, clopidogrel, prasugrel, and ticagrelor blockade.
  Where claims rest on cardiovascular antiplatelet evidence rather than
  congenital families (such as in `Failure of Primary Hemostatic Plug Formation`
  and the acquired-phenocopy differential), this is stated explicitly, and the
  severity contrast between acute pharmacological blockade and lifelong
  congenital loss is captured in `discussions:`.

  Naming: MONDO:0012354 carries the related synonym "bleeding disorder due to
  P2Rx1 defect, somatic", which conflates a distinct purinergic receptor (P2X1)
  and is intentionally excluded from `synonyms:`; P2X1 and P2Y1 defects are
  curated under `differential_diagnoses:` instead.

  Treatments: no `treatments:` block is curated because none of the cached
  primary or structured congenital P2Y12 sources (PMID:11196645, PMID:12578987,
  PMID:15852220, PMID:19229056, PMID:20966167, PMID:24612435, ORPHA:36355)
  reports interventional therapy outcomes in congenital P2Y12-deficient
  patients, whereas the vast pharmacological P2Y12 literature addresses inducing
  rather than reversing P2Y12 blockade.

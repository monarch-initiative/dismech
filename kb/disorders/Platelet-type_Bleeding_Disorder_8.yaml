name: Platelet-type bleeding disorder 8
creation_date: "2026-08-24T00:00:00Z"
category: Mendelian
parents:
- Inherited Platelet Disorder
- Bleeding Disorder
disease_term:
  preferred_term: platelet-type bleeding disorder 8
  term:
    id: MONDO:0012354
    label: platelet-type bleeding disorder 8
synonyms:
- BDPLT8
- P2Y12 defect
- ADP platelet receptor P2Y12 defect
- bleeding disorder due to P2RY12 defect
- congenital P2Y12 deficiency
description: >-
  Platelet-type bleeding disorder 8 is a rare inherited platelet function
  disorder caused by variants in P2RY12, the gene for the Gi-coupled platelet
  receptor for ADP. It is the inherited counterpart of the most widely
  prescribed class of antiplatelet drug in the world: clopidogrel, prasugrel and
  ticagrelor all work by blocking exactly the receptor these patients are born
  without, so the disorder is in effect congenital, permanent P2Y12 inhibition,
  and its mild-to-moderate mucocutaneous bleeding phenotype is a direct
  read-out of what that class of drugs does.

  Mechanistically the disorder isolates one half of the platelet's ADP response.
  Platelets carry two ADP receptors: P2Y1, which is Gq-coupled and drives shape
  change and the initial, rapidly reversible wave of aggregation, and P2Y12,
  which is Gi-coupled and negatively regulates adenylyl cyclase, and which
  produces the sustained, progressive aggregation that is not preceded by shape
  change. Both are needed for a full response, so losing P2Y12 alone leaves a
  characteristic signature - ADP, even at high concentrations, produces
  aggregation that is incomplete and reversible instead of full and irreversible.
  P2Y12 also potentiates secretion induced by several other agonists, which is
  why the functional consequence extends beyond ADP responses alone.
pathophysiology:
- name: Loss of Function in P2RY12
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component"
  description: >-
    Variants in P2RY12 cause the disorder by two distinct routes, both
    documented. In the severe-deficiency families the alleles are frameshifts
    with premature truncation of the protein, so no receptor reaches the
    surface. In at least one compound heterozygote the receptor is expressed and
    trafficked normally but is dysfunctional: p.Arg256Gln in transmembrane helix
    6 and p.Arg265Trp in extracellular loop 3 both reach the cell surface in
    transfected cells and both fail to transduce properly, which identifies that
    region as structurally and functionally critical. A quantitative assay of
    receptor expression would therefore miss the second class entirely.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the P2Y (12) locus of three of these patients revealed homozygous mutations that produced a frame shift mutation and premature truncation of the protein."
    explanation: >-
      Documents the null allele class in the originally described
      severe-deficiency patients.
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neither mutation blocked the ability of the P2Y (12) receptor to translocate to the CHO cell surface."
    explanation: >-
      Establishes the dysfunctional-but-expressed allele class, which is why
      this node distinguishes the two routes.
  downstream:
  - target: Loss of Gi-Coupled ADP Signalling
    causal_link_type: DIRECT
    description: >-
      Whether absent or non-functional, the receptor no longer transduces the
      ADP signal.
- name: Loss of Gi-Coupled ADP Signalling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting lesion. P2Y12 is negatively coupled to adenylyl cyclase
    through Gi, and the functional test that confirms the diagnosis is exactly
    this step: in cells expressing wild-type receptor, ADP strongly inhibits the
    forskolin-induced rise in cyclic AMP across the full concentration range,
    whereas the mutant receptors are only partially inhibitory. Because cyclic
    AMP restrains platelet activation, failure to lower it leaves the platelet
    partially braked at the moment it should be committing to aggregation.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  molecular_functions:
  - preferred_term: P2Y12 ADP receptor activity
    term:
      id: GO:0001621
      label: G protein-coupled ADP receptor activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The other ADP receptor, P2Y (12), is negatively coupled to adenylyl cyclase through Gi and mediates a progressive and sustained ADP-induced aggregation not preceded by shape change."
    explanation: >-
      States the receptor's coupling and the specific aggregation component it
      mediates, which is what this node records as lost.
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ADP at all tested concentrations (0.1 to 10 muM) greatly inhibited the forskolin-induced increase of cyclic adenosine monophosphate (cAMP) in CHO cells transfected with wild-type P2Y (12), whereas CHO cells transfected with either mutant protein were only partially inhibited by ADP."
    explanation: >-
      The heterologous assay establishing the signalling defect at the adenylyl
      cyclase step described here.
  downstream:
  - target: Loss of Sustained Aggregation and Agonist-Induced Secretion Potentiation
    causal_link_type: DIRECT
    description: >-
      The Gi arm is what sustains aggregation and potentiates secretion.
- name: Loss of Sustained Aggregation and Agonist-Induced Secretion Potentiation
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    The functional consequence has two parts, and the second is easy to
    overlook. The obvious one is that the sustained, irreversible phase of ADP
    aggregation is lost while the P2Y1-dependent shape change and initial
    reversible wave remain, so aggregation to ADP is incomplete and reverses
    even at high agonist concentrations - the diagnostic signature. The less
    obvious one is that P2Y12 also potentiates secretion induced by several
    other agonists, so the defect degrades the amplification loop generally
    rather than only the response to ADP.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    term:
      id: GO:0070527
      label: platelet aggregation
    modifier: DECREASED
  - preferred_term: platelet degranulation
    term:
      id: GO:0002576
      label: platelet degranulation
    modifier: DECREASED
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, this receptor plays an important role in the potentiation of platelet secretion induced by several platelet agonists. The combined action of P2Y (1) and P2Y (12) is necessary for the full platelet aggregation response to ADP."
    explanation: >-
      Supports both halves of this node - the secretion-potentiation role and
      the requirement for both receptors for a full ADP response.
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects of P2Y₁₂ should be suspected when ADP, even at high concentrations (≥ 10 μM), is unable to induce full, irreversible platelet aggregation."
    explanation: >-
      States the diagnostic aggregation signature that this node's first half
      describes.
  downstream:
  - target: Failure of Primary Hemostatic Plug Formation
    causal_link_type: DIRECT
    description: >-
      Loss of sustained aggregation and secretory amplification leaves the plug
      unstable.
- name: Failure of Primary Hemostatic Plug Formation
  role: effector
  biological_scale: TISSUE
  conforms_to: "primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation"
  description: >-
    A partial rather than a total failure, which is why the bleeding is milder
    than in the receptor and integrin disorders: adhesion, shape change, the
    initial aggregation wave and the integrin itself are all intact, and what is
    lost is the amplification that consolidates the plug. The clearest evidence
    that this step matters haemostatically is pharmacological - blocking the
    same receptor in healthy people is potently antithrombotic and does increase
    major bleeding.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Drugs that inhibit P2Y₁₂ are potent antithrombotic drugs, attesting the central role played by P2Y₁₂ in platelet thrombus formation."
    explanation: >-
      Pharmacological evidence that this receptor's contribution to platelet
      thrombus formation is haemostatically consequential.
  downstream:
  - target: Mild to Moderate Mucocutaneous Bleeding Diathesis
    causal_link_type: DIRECT
    description: Failure of platelet-dependent primary hemostasis.
- name: Mild to Moderate Mucocutaneous Bleeding Diathesis
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "primary_hemostatic_plug_failure#Mucocutaneous Bleeding Diathesis"
  description: >-
    Mucocutaneous bleeding with excessive post-surgical and post-traumatic blood
    loss - the same site pattern as the rest of the family but at the mild end
    of its severity range, so the disorder is characteristically unmasked by a
    haemostatic challenge rather than presenting spontaneously.
  biological_processes:
  - preferred_term: primary hemostasis
    term:
      id: GO:0007599
      label: hemostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with congenital P2Y₁₂ defects display a mild to moderate bleeding diathesis, characterized by mucocutaneous bleedings and excessive post-surgical and post-traumatic blood loss."
    explanation: >-
      States the severity band and the bleeding pattern this node records.

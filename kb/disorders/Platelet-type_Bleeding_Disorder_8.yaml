- name: Loss of Gi-Coupled ADP Signalling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting biochemical lesion. Wild-type P2Y12 is negatively coupled
    to adenylyl cyclase through Gi, lowering intracellular cyclic AMP upon ADP
    engagement. In patient platelets and CHO cells expressing mutant P2Y12, ADP
    fails to suppress prostaglandin E1- or forskolin-stimulated cyclic AMP
    accumulation, whereas P2Y1-mediated intracellular Ca2+ mobilization remains
    intact. Because elevated cyclic AMP tonically restrains platelet activation,
    failure to lower it leaves the platelet partially braked during thrombus
    growth.

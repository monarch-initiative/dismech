- name: Loss of Sustained Aggregation and Agonist-Induced Secretion Potentiation
  role: effector
  biological_scale: CELLULAR
  conforms_to: "primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion, and Integrin Inside-Out Signalling"
  description: >-
    The cellular defect has two linked components. First, the sustained,
    irreversible phase of ADP-induced platelet aggregation is lost while
    P2Y1-dependent Ca2+ mobilization, shape change, and the initial small wave
    of aggregation remain intact, so platelet aggregation to ADP is incomplete
    and rapidly reversible even at high agonist concentrations (>=10 micromolar).
    Second, because secreted dense-granule ADP normally feeds back on P2Y12 to
    amplify secretion, ATP/dense-granule release and secondary aggregation in
    response to collagen, arachidonate, thromboxane analogue U46619, PAF, and
    epinephrine are markedly blunted despite normal granule stores.

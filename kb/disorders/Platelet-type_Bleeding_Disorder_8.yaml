genetic:
- name: P2RY12
  gene_term:
    preferred_term: P2RY12
    term:
      id: hgnc:18124
      label: P2RY12
  relationship_type: CAUSATIVE
  notes: >-
    Encodes the Gi-coupled platelet ADP receptor P2Y12. Two allele classes are
    reported: frameshift/truncating variants abolishing the receptor, and
    missense variants (p.Arg256Gln in TM6, p.Arg265Trp in EL3) that permit
    normal surface expression but impair signalling. One originally described
    patient carried a frameshift allele together with an apparently normal
    allele that appeared to be silenced by a second, unidentified variant - a
    reminder that a single identified allele does not exclude the diagnosis in a
    patient with the functional phenotype.
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth patient had an allele with a frame shift mutation and a normal allele, which could be silenced by an additional, as yet unknown, mutation."
    explanation: >-
      Documents the unresolved second allele described in this gene block.
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two substitutions are located in TM6 and EL3 of the receptor."
    explanation: >-
      Supports the domain localization of the missense alleles named here.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every genetically resolved patient in the cached literature is biallelic:
    three with homozygous frameshift variants causing premature truncation, and
    one compound heterozygote carrying p.Arg256Gln and p.Arg265Trp. A fourth
    patient carried one frameshift allele together with an apparently normal
    allele presumed silenced by a second, unidentified variant - consistent with
    recessive inheritance and an undetected second hit rather than with dominant
    disease, though it is explicitly unresolved in the source. Curated as
    autosomal recessive on that basis. Heterozygous carrier phenotype is not
    characterized in the cached sources, and a dominant-negative P2RY12 allele,
    though proposed in the wider literature, is not evidenced by anything cited
    here - so no dominant mode is asserted, and adding one would need its own
    citation and verified snippet.
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the P2Y (12) locus of three of these patients revealed homozygous mutations that produced a frame shift mutation and premature truncation of the protein."
    explanation: >-
      Establishes homozygous loss-of-function genotypes in the originally
      described severe-deficiency patients, the basis for the recessive
      assignment.
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth patient had an allele with a frame shift mutation and a normal allele, which could be silenced by an additional, as yet unknown, mutation."
    explanation: >-
      PARTIAL - this patient's second allele was never identified, so the case
      is consistent with but does not independently establish recessive
      inheritance. Recorded because the ambiguity is a real caveat for
      diagnostic sequencing, not because it supports the assignment.
diagnosis:
- name: Aggregometry Plus Adenylyl Cyclase Inhibition Testing
  description: >-
    Screening is by aggregometry - incomplete, reversible aggregation to high
    ADP - but that pattern alone is not confirmatory. Confirmation requires
    tests that evaluate the degree of inhibition of adenylyl cyclase by ADP,
    which interrogate the Gi coupling directly. The practical trap is that
    P2Y12 antagonist drugs reproduce the laboratory picture exactly, so
    excluding recent clopidogrel, prasugrel or ticagrelor exposure is part of
    the diagnosis rather than an afterthought.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tests that evaluate the degree of inhibition of adenylyl cyclase by ADP should be used to confirm the diagnosis."
    explanation: >-
      States the confirmatory test on which this diagnostic entry rests.
differential_diagnoses:
- name: P2Y12 Antagonist Therapy (Acquired Phenocopy)
  description: >-
    Clopidogrel, prasugrel and ticagrelor block the same receptor, so a treated
    patient has an acquired form of this disorder and is laboratory-identical to
    one who inherited it. This is the single most common cause of the phenotype
    by a wide margin and must be excluded first. The reverse observation is also
    informative: roughly a third of clopidogrel-treated patients fail to inhibit
    P2Y12 adequately, so the drug does not reliably produce the phenocopy either.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most important drawback of clopidogrel is its inability to inhibit adequately P2Y₁₂-dependent platelet function in approximately one-third of patients who are therefore not protected from major cardiovascular events."
    explanation: >-
      Supports the variable-response observation that qualifies the drug
      phenocopy in this differential.
- name: P2Y1 and P2X1 Receptor Defects
  description: >-
    Platelets carry two other P2 receptors. P2Y1 is Gq-coupled and drives shape
    change and the initial reversible aggregation wave; P2X1 is the ATP
    receptor. A defect in either produces a different aggregation signature -
    notably, loss of P2Y1 removes the shape change that is preserved here.
  evidence:
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Platelets possess three P2 receptors: two (P2Y (1) and P2Y (12)) are receptors for adenosine diphosphate (ADP), and one (P2X1) is a receptor for adenosine triphosphate (ATP)."
    explanation: >-
      Establishes the other P2 receptors that form this differential.
  - reference: PMID:15852220
    reference_title: The P2 receptors and congenital platelet function defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The P2Y (1) receptor, which is coupled to Gq and phospholipase C-beta, is responsible for mobilization of ionized calcium from internal stores and mediates the ADP-induced platelet shape change and initial wave of rapidly reversible aggregation."
    explanation: >-
      Supports the P2Y1 functional description used to distinguish it here.
- name: Dense-Granule Storage Pool Disease
  description: >-
    Dense granules are the platelet's own store of ADP, so a storage pool defect
    degrades the same amplification loop from the ligand side rather than the
    receptor side and gives a similar defective second wave of aggregation.
    Separated by electron microscopy and dense-granule content assays.
  evidence:
  - reference: PMID:16722529
    reference_title: Glanzmann thrombasthenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in the second wave of aggregation to ADP or in the response to collagen can imply storage pool disease and an absence of the secretory stores of ADP in dense granules."
    explanation: >-
      States the overlapping aggregation abnormality that makes this a genuine
      differential.
discussions:
- discussion_id: gap_congenital_vs_pharmacological_p2y12_loss
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is lifelong congenital P2Y12 loss only mildly to moderately
    haemorrhagic when acute pharmacological P2Y12 blockade measurably increases
    major bleeding?
  attaches_to:
  - pathophysiology#Failure of Primary Hemostatic Plug Formation
  - pathophysiology#Mild to Moderate Mucocutaneous Bleeding Diathesis
  rationale: >-
    The same receptor is lost in both cases, yet the clinical weight differs.
    Patients with congenital defects are described as mildly to moderately
    affected, while the newer antagonists, which inhibit P2Y12 effectively in
    most patients, increase the incidence of major bleeding. Several
    explanations are possible and are not distinguished by the available
    evidence: lifelong developmental compensation absent in an acutely treated
    patient; the fact that treated patients are older, comorbid and usually also
    taking aspirin; ascertainment bias, since mildly affected congenital cases
    are the ones that come to attention; or a genuinely more complete blockade
    by drug than by the reported hypomorphic alleles. The question is not
    academic - it determines whether these patients can be counselled using the
    much larger evidence base from antiplatelet trials, which would otherwise be
    the obvious source of guidance for a disorder with only a handful of
    reported cases.
  proposed_experiments:
  - experiment_id: exp_p2y12_congenital_vs_treated_matched_comparison
    name: Matched comparison of residual P2Y12 function and bleeding phenotype
    description: >-
      Quantify residual ADP-induced adenylyl cyclase inhibition in congenital
      P2Y12-defect patients and in ticagrelor-treated volunteers, and pair each
      with a standardized bleeding-assessment tool score. If congenital patients
      retain more residual signalling than fully inhibited treated subjects, the
      difference is one of degree; if they do not, the explanation lies in
      compensation or comorbidity rather than in the receptor.
  evidence:
  - reference: PMID:20966167
    reference_title: "The platelet P2Y₁₂ receptor for adenosine diphosphate: congenital and drug-induced defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although they increase the incidence of major bleedings, the net clinical benefit is in favor of the new P2Y₁₂ inhibitors."
    explanation: >-
      Establishes the drug-side half of the discrepancy - effective blockade
      does increase major bleeding - against which the mild congenital phenotype
      stands to be explained.
notes: >-
  Conformance: this entry conforms to `primary_hemostatic_plug_failure` through
  the SIGNALLING/SECRETION arm - `#Impaired Platelet Activation, Granule
  Secretion, and Integrin Inside-Out Signalling` - which the module names as the
  arm for the agonist-receptor defects (P2Y12, thromboxane A2 receptor, GPVI).
  It does not conform to the aggregation arm: alphaIIbbeta3 is normal and the
  aggregation abnormality is a downstream read-out, exactly the inference the
  module's guidance on that arm warns against.

  The drug relationship is the point of this entry. The disorder is the
  congenital form of what clopidogrel, prasugrel and ticagrelor do
  pharmacologically, which makes it unusually well characterized at the
  mechanistic level for something with only a handful of reported patients - but
  it also means most of the human evidence about P2Y12 blockade comes from
  treated cardiovascular patients rather than from these families. Where a claim
  in this entry rests on the drug literature rather than on the congenital
  patients, it is stated as such (the `Failure of Primary Hemostatic Plug
  Formation` node's evidence, and the acquired-phenocopy differential), and the
  unresolved discrepancy between the two is curated as an explicit knowledge
  gap rather than smoothed over.

  No prevalence record is included: the reported literature amounts to a small
  number of patients, with no published denominator.

  Naming: MONDO:0012354 carries the synonym "bleeding disorder due to P2Rx1
  defect, somatic", which is a MONDO synonym-level conflation of a different
  receptor (P2X1) and should not be treated as an alternative name for this
  entry. The synonyms curated here are the P2Y12 ones only. P2X1 and P2Y1
  defects are curated as differential diagnoses instead.

  No `treatments:` block, deliberately - and here the gap has an unusual shape
  worth naming. Enormous human evidence exists about blocking P2Y12, because
  three widely prescribed drugs do exactly that, but it is evidence about
  inducing this phenotype rather than treating it. Nothing in the cache
  addresses management of the congenital defect. The mechanism does imply the
  general approach (antifibrinolytics and platelet transfusion for bleeding
  episodes, and avoidance of P2Y12 antagonists, which would compound a defect
  the patient already has), and the avoidance point is clinically real - but it
  is an inference, so it is stated here rather than curated as an evidenced
  treatment. As with the other conformers, the module's rFVIIa pattern is not
  inherited.

  Curation provenance. This entry was curated by direct review of the cached
  full text and abstracts of the references listed in `references:`, not from a
  deep-research provider artifact, so there is no corresponding file under
  `research/`. Candidate PMIDs were located by PubMed search and each was
  fetched with `just fetch-reference` before use; several initially plausible
  identifiers turned out to be unrelated papers and were discarded rather than
  cited on their titles. Every snippet in this entry is an exact substring of
  the cached reference text.

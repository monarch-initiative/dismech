description: >-
  Platelet-type bleeding disorder 8 is a rare autosomal recessive inherited
  platelet function disorder caused by biallelic loss-of-function variants in
  P2RY12, the gene encoding the Gi-coupled platelet receptor for adenosine
  diphosphate (ADP). It is the inherited counterpart of the most widely
  prescribed class of antiplatelet drugs in the world: clopidogrel, prasugrel,
  ticlopidine, and ticagrelor all act by blocking the exact receptor these
  patients lack or express in dysfunctional form, so the disorder represents
  lifelong congenital P2Y12 blockade and manifests with a mild-to-moderate
  mucocutaneous bleeding diathesis (easy bruising, epistaxis, menorrhagia, and
  excessive post-traumatic or post-surgical hemorrhage).

  Mechanistically, the disorder isolates one half of the platelet's dual ADP
  receptor response. Platelets carry two G-protein-coupled ADP receptors: P2Y1,
  which is Gq-coupled, mobilizes intracellular Ca2+, and drives platelet shape
  change and the initial, rapidly reversible wave of aggregation; and P2Y12,
  which is Gi-coupled, inhibits adenylyl cyclase to lower cyclic AMP, and
  produces sustained, progressive aggregation together with potentiation of
  dense-granule secretion induced by multiple platelet agonists. Losing P2Y12
  alone leaves an obligate aggregometric signature: ADP, even at concentrations
  of 10 micromolar or above, induces normal shape change followed by incomplete
  and rapidly reversible aggregation rather than full irreversible aggregation.

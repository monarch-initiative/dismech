  - target: Reduced Cardiomyocyte Respiration
    description: Combined treatment improves the respiratory phenotype in the knockout cells.
    evidence:
    - reference: PMID:38072986
      reference_title: >-
        COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.

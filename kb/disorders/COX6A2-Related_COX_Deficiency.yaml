treatments:
- name: Supportive rehabilitation and multidisciplinary care
  description: >-
    Primary mitochondrial disease consensus recommends rehabilitation and individualized specialist care to
    maintain mobility and function. Application to COX6A2 disease is extrapolated from that broader guidance;
    disease-specific clinical efficacy data are lacking.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28749475
    reference_title: >-
      Patient care standards for primary mitochondrial disease: a consensus statement from the Mitochondrial
      Medicine Society.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Evaluation and care by a rehabilitation medicine specialist and therapy are used to maintain safety,
      mobility, and an active lifestyle.
    explanation: >-
      This general mitochondrial care recommendation supports symptom-directed rehabilitation, rather than
      a proven COX6A2-specific treatment.
    directness: INDIRECT
  target_phenotypes:
  - preferred_term: Limb muscle weakness
    term:
      id: HP:0003690
      label: Limb muscle weakness
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
- name: L-carnitine and trimetazidine (preclinical)
  description: >-
    L-carnitine at 200 micromolar and trimetazidine at 50 micromolar were tested individually and together
    in engineered knockout cardiomyocytes. The combination gave the largest ATP-content recovery and ROS reduction,
    and improved respiration and calcium transients. These cell-culture concentrations and results do not establish
    clinical dosing, safety or efficacy in COX6A2 disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-carnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
    - preferred_term: Trimetazidine
      term:
        id: CHEBI:94789
        label: 1-[(2,3,4-trimethoxyphenyl)methyl]piperazine
  evidence:
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ATP content of KO cardiomyocytes following LC, TMZ, and LC + TMZ treatment was restored to varying
      degrees, of which LC + TMZ exhibited the greatest effect (Fig. 7A).
    explanation: >-
      The ATP-content assay documents the energy deficit and its partial restoration by metabolic compounds
      in knockout cardiomyocytes.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We examined the concentration gradient of the therapeutic drugs and determined the optimal concentration
      of LC 200 µmol/L and TMZ 50 µmol/L.
    explanation: These concentrations were chosen for cell-culture experiments.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Similarly, ROS levels in cardiomyocytes were determined after treatment with the three regimens, and
      the LC + TMZ group exhibited the greatest reduction in ROS (Fig. 7B).
    explanation: The combined treatment most strongly reduced the ROS readout.
  target_mechanisms:
  - target: Reduced Cardiomyocyte ATP Content
    description: The compounds partially restore measured cellular ATP content.
    evidence:
    - reference: PMID:38072986
      reference_title: >-
        COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT

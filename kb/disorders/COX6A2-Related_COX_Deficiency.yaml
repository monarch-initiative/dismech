      synaptic contacts onto cortical principal neurons (Fig ... 3 ... D),
    explanation: The mouse study measures fewer PV-derived contacts onto cortical principal neurons.
  cell_types:
  - preferred_term: Parvalbumin-positive cortical GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron

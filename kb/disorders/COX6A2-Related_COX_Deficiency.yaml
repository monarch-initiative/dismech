animal_models:
- name: Global Cox6a2 knockout mouse
  species: Mouse
  genotype: Cox6a2-/-
  description: >-
    Global knockout mice reproduce complex IV biochemical impairment and mild workload-dependent diastolic
    dysfunction. Bulk heart and skeletal-muscle ATP remain preserved. Skeletal muscle shifts toward oxidative
    fibers with increased isolated fatigue resistance, while uphill exercise performance decreases. Cortical
    PV cells have oxidative damage, reduced nets and impaired dendritic and fast-spiking maturation, without
    loss of PV-cell density. Female behavioral cohorts show locomotor hyperactivity with preserved social preference
    and prepulse inhibition; these are not human psychiatric diagnoses.
  publication: PMID:11788423
  evidence:
  - reference: PMID:11788423
    reference_title: Cardiac dysfunction in mice lacking cytochrome-c oxidase subunit VIaH.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Total COX activity was decreased in hearts from mutant mice, which appears to be a consequence of altered
      assembly of the holoenzyme COX.
    explanation: >-
      The global knockout mouse study directly reports reduced cardiac COX activity and attributes it to altered
      holoenzyme assembly.
  - reference: PMID:11788423
    reference_title: Cardiac dysfunction in mice lacking cytochrome-c oxidase subunit VIaH.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: However, total myocardial ATP was not significantly different in wild-type and mutant mice.
    explanation: Bulk myocardial ATP was preserved despite the mouse cardiac phenotype.
  - reference: PMID:23460811
    reference_title: >-
      Mice deficient in the respiratory chain gene Cox6a2 are protected against high-fat diet-induced obesity
      and insulin resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Finally, despite the loss of COX6A2 expression, ATP levels within the skeletal muscles of Cox6a2 −/−
      and WT mice were similar (Fig. 7E),
    explanation: >-
      Skeletal-muscle ATP was preserved in global knockout mice, unlike the ATP-content deficit in cultured
      cardiomyocytes.
  - reference: PMID:23460811
    reference_title: >-
      Mice deficient in the respiratory chain gene Cox6a2 are protected against high-fat diet-induced obesity
      and insulin resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The specific force production (force/cross-sectional area) of soleus and extensor digitorum longus (EDL)
      muscles (Fig. 7A), as well as the grip strength (Fig. 7B) were similar between WT and Cox6a2 −/− mice.
    explanation: Global knockout did not reduce isolated specific muscle force or grip strength.
  - reference: PMID:23460811
    reference_title: >-
      Mice deficient in the respiratory chain gene Cox6a2 are protected against high-fat diet-induced obesity
      and insulin resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, in a fatiguing protocol, isolated soleus muscle of Cox6a2 −/− mice was more resistant to fatigue
      and recovered much faster as compared to WT muscle (Fig. 7D),
    explanation: >-
      Isolated knockout soleus was more fatigue-resistant, rather than recapitulating weakness uniformly.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      8‐OHdG immunoreactivity was significantly higher in PV ... + ... interneurons in both cortices in ...
      Cox6a2 ... −/− ... mice ( ... n ... = 4 WT, 4 ... Cox6a2 ... − ... / ... − ... ; 2 months old).
    explanation: Increased 8-OHdG signal supports oxidative DNA damage in knockout cortical PV interneurons.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      WFA immunoreactivity around PV ... + ... cells was lower in both cortices in ... Cox6a2 ... −/− ... mice
      ( ... n ... = 4 WT, 4 ... Cox6a2 ... − ... / ... − ... ; 2 months old).
    explanation: Reduced WFA labeling supports diminished perineuronal nets in the mouse model.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, maximal firing frequency reached during 2‐s depolarizing current pulses was lower in P34–45 ...
      Cox6a2 ... − ... / ... − ... compared with WT PV ... + ... interneurons.
    explanation: Older knockout PV interneurons fail to acquire normal sustained high-frequency firing.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, at P34‐P45, ... Cox6a2 ... −/− ... PV ... + ... interneurons showed lower dendritic length and
      full branch depth than WT PV ... + ... interneurons.
    explanation: Dendritic length and branch depth are reduced at the later developmental stage.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, ... Cox6a2 ... − ... / ... − ... reduced the number of PV ... + ... interneuron‐derived
      synaptic contacts onto cortical principal neurons (Fig ... 3 ... D),
    explanation: The mouse study measures fewer PV-derived contacts onto cortical principal neurons.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that ... Cox6a2 ... −/− ... had negligible effect on the density and distribution of PV ...
      + ... interneurons in the cortex at ~ P60 and ~ P180 (Fig ... EV3 ... A–D).
    explanation: >-
      PV-cell density and distribution are largely retained despite molecular and functional abnormalities.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the OFT and SIT, ... Cox6a2 ... − ... / ... − ... mice exhibited increased locomotor activity since
      they traveled longer distances and they did so faster than WT mice (Fig ... 7 ... B and D).
    explanation: The female knockout cohort shows increased locomotor activity.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the SIT, both ... Cox6a2 ... − ... / ... − ... and WT mice preferred to spend more time interacting
      with a stranger mouse than with an inanimate object (Fig ... 7 ... D).
    explanation: Social preference is preserved in the tested mouse cohort.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We did not detect significant differences in the PPI of the acoustic startle response in ... Cox6a2 ...
      − ... / ... − ... mice at prepulses of 72, 74, 78, and 86 dB (Fig ... 7 ... G).
    explanation: Prepulse inhibition is preserved under the tested conditions.
  - reference: PMID:23460811
    reference_title: >-
      Mice deficient in the respiratory chain gene Cox6a2 are protected against high-fat diet-induced obesity
      and insulin resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      During the night, there was a non-significant increase in oxygen consumption and heat generation in Cox6a2
      −/− mice, despite a 25% decrease in spontaneous activity compared to WT mice (Fig. 4C).
    explanation: >-
      The metabolic study measured lower spontaneous activity, illustrating the context dependence of behavioral
      findings.

- name: Reduced Interneuron ATP-to-ADP Ratio
  description: >-
    PV-specific Cox6a2 deletion lowers the basal ATP-to-ADP ratio measured with PercevalHR in ex vivo brain
    slices. COX6A2 expression in normal human cortex supports relevance beyond muscle, but equivalent patient-neuron
    bioenergetics have not been measured.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:32744742
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast-spiking interneurons from oxidative stress and supports
      their function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Such dramatic effects were likely due to an essential role of COX6A2 in energy balance of PV+ interneurons,
      underscored by a decrease in the ATP-to-ADP ratio in Cox6a2-/- PV+ interneurons.
    explanation: >-
      The abstract reports the reduced ATP-to-ADP ratio in knockout PV interneurons; the full paper identifies
      the conditional knockout and PercevalHR slice-imaging experiment.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the adult human brain, all cortical PV ... + ... interneurons from Brodmann areas 9 and 10 (BA9, BA10),
      which correspond to the dorsolateral and medial prefrontal cortex and the anterior prefrontal cortex,
      respectively, express COX6A2, and PV ... + ... interneurons represent 60% of the cells expressing COX6A2
      (Fig ... 2 ... E and F).
    explanation: >-
      Postmortem human cortex expresses COX6A2 beyond muscle; PV cells comprise about 60% of COX6A2-positive
      cortical cells in these donors.
    directness: INDIRECT
  cell_types:
  - preferred_term: Parvalbumin-positive cortical GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron

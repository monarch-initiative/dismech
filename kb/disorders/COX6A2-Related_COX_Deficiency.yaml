    term:
      id: CL:0011005
      label: GABAergic interneuron
- name: Impaired Fast-Spiking Maturation
  description: >-
    Older knockout PV interneurons fail to acquire normal maximal sustained firing frequency. Increased excitability
    at threshold coexists with impaired repetitive firing, so a uniform reduction in excitability would be
    inaccurate.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, maximal firing frequency reached during 2‐s depolarizing current pulses was lower in P34–45 ...
      Cox6a2 ... − ... / ... − ... compared with WT PV ... + ... interneurons.
    explanation: Older knockout PV interneurons fail to acquire normal sustained high-frequency firing.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consequently, the threshold was significantly more negative for ... Cox6a2 ... − ... / ... − ... than
      for WT PV ... + ... interneurons during the later stage of maturation (Fig ... 6 ... C and D).
    explanation: Older knockout neurons have a lower firing threshold despite impaired sustained fast spiking.
  cell_types:
  - preferred_term: Parvalbumin-positive cortical GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
- name: Reduced Interneuron Dendritic Arborization
  description: >-
    At P34-P45, global knockout PV interneurons have reduced dendritic length and branch depth, whereas the
    younger P22-P33 groups are similar. This developmental mouse finding has not been demonstrated in patients.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, at P34‐P45, ... Cox6a2 ... −/− ... PV ... + ... interneurons showed lower dendritic length and
      full branch depth than WT PV ... + ... interneurons.
    explanation: Dendritic length and branch depth are reduced at the later developmental stage.
  cell_types:
  - preferred_term: Parvalbumin-positive cortical GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
- name: Reduced PV Interneuron Synaptic Contacts
  description: >-
    Global knockout mice have fewer PV-interneuron-derived synaptic contacts onto cortical principal neurons.
    This anatomical readout is distinct from measured repetitive firing and has not been demonstrated in patients.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports

description: >-
  COX6A2-related cytochrome c oxidase deficiency (MC4DN18) is an autosomal recessive mitochondrial disorder
  associated with biallelic missense variants in the nuclear-encoded complex IV structural subunit COX6A2.
  The two founding patients had congenital myopathy with limb and facial weakness and hypotonia; one had cardiomyopathy
  and died in early infancy, while the other survived into adolescence. Patient muscle shows reduced complex
  IV activity and impaired assembly and supercomplex formation. COX6A2 is enriched in striated muscle but is
  also expressed in cortical interneurons. Later mouse neuronal and human stem-cell-derived cardiomyocyte experiments
  identify cell-specific energy, redox and functional abnormalities. The surviving patient had preserved overall
  intelligence with relatively lower processing speed; a broader human neurologic syndrome remains unestablished.

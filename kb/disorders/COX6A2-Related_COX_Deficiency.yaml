    explanation: Patient muscle analysis demonstrates impaired complex IV assembly and supercomplex formation.
- name: Reduced Cardiomyocyte Respiration
  description: >-
    Engineered COX6A2-null cardiomyocytes have lower basal and maximal oxygen consumption and ATP-linked respiration.
    Extracellular acidification also decreases, rather than showing compensatory glycolytic enhancement in
    this model.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the basal respiration, maximal respiration, and ATP production of the KO cardiomyocytes were significantly
      lower compared with that of WT cardiomyocytes (Fig. 5B).
    explanation: >-
      Seahorse measurements show lower respiratory capacity and ATP-linked respiration in engineered knockout
      cardiomyocytes.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The extracellular acidification rate of KO cardiomyocytes was also significantly lower compared with
      that of WT cardiomyocytes, suggesting that the glycolytic capacity of KO cardiomyocytes was significantly
      reduced (Fig. 5C).
    explanation: The glycolytic-capacity proxy decreases in the engineered cardiac cells.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:

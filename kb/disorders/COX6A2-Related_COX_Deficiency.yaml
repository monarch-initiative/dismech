diagnosis:
- name: Molecular genetic diagnosis
  description: >-
    Exome sequencing identified the biallelic missense variants in the founding cases. Sanger confirmation
    and phase assessment support interpretation in the clinical-biochemical context.
  evidence:
  - reference: PMID:31155743
    reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing was performed in 2 unrelated individuals who were diagnosed with congenital myopathy
      and presented COX deficiency in muscle pathology.
    explanation: Exome sequencing was used in the two founding congenital myopathy cases.
  - reference: PMID:31155743
    reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants detected were homozygous c.117C > A (p.Ser39Arg) and compound heterozygous c.117C > A (p.Ser39Arg)
      and c.127T > C (p.Cys43Arg).
    explanation: >-
      The reported alleles were homozygous p.Ser39Arg and compound heterozygous p.Ser39Arg/p.Cys43Arg.
- name: Muscle respiratory-chain studies
  description: >-
    Muscle histochemistry, enzymology and native electrophoresis support isolated complex IV deficiency with
    impaired assembly and supercomplex formation.
  evidence:
  - reference: PMID:31155743
    reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found specific reductions in complex IV activities in the skeletal muscle of both individuals.
    explanation: The isolated complex IV biochemical defect was measured in patient skeletal muscle.
  - reference: PMID:31155743
    reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Assembly of complex IV and its supercomplex formation were impaired in the muscle.
    explanation: Patient muscle analysis demonstrates impaired complex IV assembly and supercomplex formation.
  - reference: CGGV:assertion_c09fbc40-dc5e-4cbd-80d1-1f918fffdceb-2024-03-18T040000.000Z
    reference_title: COX6A2 / mitochondrial disease (Moderate)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complex IV staining was uniformly weak on muscle histology and complex IV deficiency was seen on respiratory
      chain analyses in muscle and fibroblasts.
    explanation: ClinGen summarizes the diagnostic tissue and biochemical findings.
- name: Cardiac and respiratory assessment
  description: >-
    General primary-mitochondrial-disease consensus supports baseline ECG/echocardiography and respiratory
    assessment, with follow-up individualized to findings. These are broader care recommendations rather than
    a COX6A2-specific surveillance trial.
  evidence:
  - reference: PMID:28749475
    reference_title: >-
      Patient care standards for primary mitochondrial disease: a consensus statement from the Mitochondrial
      Medicine Society.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard 12-lead electrocardiogram (ECG) and echocardiogram (with measurement of left ventricular mass
      and systolic/diastolic function)
    explanation: The consensus recommends baseline cardiac evaluation for primary mitochondrial disease.
    directness: INDIRECT
  - reference: PMID:28749475
    reference_title: >-
      Patient care standards for primary mitochondrial disease: a consensus statement from the Mitochondrial
      Medicine Society.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Baseline evaluation of respiratory status to assess for muscle weakness and other cardiopulmonary comorbidities.
    explanation: >-
      General mitochondrial care guidance supports evaluating respiratory involvement in this myopathic condition.
    directness: INDIRECT
- name: Cognitive assessment when clinically indicated
  description: >-
    WAIS-III follow-up of the surviving founding patient found full-scale IQ111 and processing speed89. The
    within-person discrepancy suggests possible vulnerability but does not establish intellectual disability
    or a specific psychiatric diagnosis.
  evidence:
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, the full‐scale intelligence quotient (IQ) and performance IQ of the patient were found
      to be above average (Fig ... 8 ... C). However, the score obtained for the processing speed (PS) was
      lower than average (Fig ... 8 ... C),
    explanation: >-
      The surviving founding patient had preserved overall IQ and relatively lower processing speed; this does
      not diagnose intellectual disability.
  - reference: url:https://www.embopress.org/doi/full/10.15252/embj.2020105759
    reference_title: >-
      Complex IV subunit isoform COX6A2 protects fast‐spiking interneurons from oxidative stress and supports
      their function | The EMBO Journal | Springer Nature Link
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the large difference between PS (89 points) and full‐scale IQ (111 points)
    explanation: The full text provides the measured scores; interpretation remains limited to one patient.
experimental_models:
- name: HeLa COX6A2 missense-expression models
  experimental_model_type: CELL_LINE
  cell_source: HeLa cells expressing wild-type or mutant COX6A2-EGFP
  description: >-
    p.Ser39Arg and p.Cys43Arg retain mitochondrial localization but show accelerated loss after translation
    blockade, as summarized in ClinGen from the 2019 study.
  publication: PMID:31155743
  evidence:
  - reference: >-
      url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_c09fbc40-dc5e-4cbd-80d1-1f918fffdceb-2024-03-18T040000.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HeLa studies with COX6A2-fused EGFPs with WT and Ser39Arg mutation show transport to mitochondria, but
      dramatically reduced expression of protein after blocking de novo protein synthesis compared to WT at
      2,4,6 hours
    explanation: >-
      ClinGen summarizes the allele-expression experiments: mitochondrial targeting was retained but mutant
      protein decayed more rapidly after translation blockade.
  modeled_mechanisms:
  - target: Reduced COX6A2 Protein Stability
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Fusion-protein expression and translation blockade do not reproduce endogenous patient expression or
      tissue function.
- name: COX6A2-null hiPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cell_source: Commercial U2 hiPSC line with CRISPR/Cas9 homozygous COX6A2 knockout
  description: >-
    Engineered null cells retain pluripotency and cardiac differentiation, then develop cellular hypertrophy,
    mitochondrial abnormalities, reduced respiration and ATP, altered calcium dynamics and impaired contraction.
    Remodeling transcripts and cell size are not equivalent to tissue fibrosis. L-carnitine/trimetazidine rescue
    is preclinical.
  publication: PMID:38072986
  evidence:
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The U2 human induced pluripotent stem cell line (hiPSCs-U2, purchased from Cellapy, China)
    explanation: The study starts from a commercial stem-cell line, not a patient-specific line.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the basal respiration, maximal respiration, and ATP production of the KO cardiomyocytes were significantly
      lower compared with that of WT cardiomyocytes (Fig. 5B).
    explanation: >-
      Seahorse measurements show lower respiratory capacity and ATP-linked respiration in engineered knockout
      cardiomyocytes.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ATP content of KO cardiomyocytes following LC, TMZ, and LC + TMZ treatment was restored to varying
      degrees, of which LC + TMZ exhibited the greatest effect (Fig. 7A).
    explanation: >-
      The ATP-content assay documents the energy deficit and its partial restoration by metabolic compounds
      in knockout cardiomyocytes.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with WT cardiomyocytes, mitochondrial ROS in KO cardiomyocytes was significantly increased (Fig.
      4F and Additional file 1: Fig. S3D),
    explanation: MitoSOX detects increased mitochondrial superoxide in knockout cardiomyocytes.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with WT cardiomyocytes, the peak value of calcium transients in KO cardiomyocytes was significantly
      reduced and the time to peak time was significantly prolonged (Fig. 6C–F),
    explanation: >-
      Fluo-4 imaging measures smaller and slower calcium transients. It does not directly establish mitochondrial
      calcium overload.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with WT cardiomyocytes, the contraction intensity of KO cardiomyocytes was significantly decreased
      (Fig. 6H). Moreover, the time to peak (Fig. 6I) and relaxation duration (Fig. 6J) were significantly
      prolonged.
    explanation: >-
      Video-derived contraction intensity decreases and contraction/relaxation kinetics slow; this is not a
      calibrated force measurement.
  - reference: PMID:38072986
    reference_title: >-
      COX6A2 deficiency leads to cardiac remodeling in human pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the surface area of the KO cardiomyocytes was significantly increased compared with the WT cardiomyocytes
      as determined by laser confocal microscopy (Fig. 3A).
    explanation: Phalloidin imaging demonstrates increased cardiomyocyte area after knockout.
  modeled_mechanisms:

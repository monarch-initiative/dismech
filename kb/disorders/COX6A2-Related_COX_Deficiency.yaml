  description: >-
    Complex IV-containing respiratory supercomplex formation is impaired in patient muscle. This biochemical
    assembly outcome is distinct from oxidase enzymatic activity.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:31155743
    reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
    supports: SUPPORT

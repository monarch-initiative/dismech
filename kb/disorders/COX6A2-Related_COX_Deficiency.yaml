name: COX6A2-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-23T00:00:00Z'
synonyms:
- COX6A2 deficiency
- Mitochondrial complex IV deficiency, nuclear type 18
- MC4DN18
- COX6A2-related cytochrome c oxidase deficiency
- Muscle-specific cytochrome c oxidase deficiency
disease_term:
  preferred_term: COX6A2-related COX deficiency (MC4DN18)
  term:
    id: MONDO:0033653
    label: mitochondrial complex IV deficiency, nuclear type 18
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
notes: >-
  Clinical evidence remains limited to two founding probands and cognitive follow-up of the surviving proband.
  These reports do not establish reliable phenotype frequencies, penetrance, a genotype-severity rule or separate
  clinical subtypes. Mouse and engineered human-cell findings are mechanistic models rather than additional
  clinical cases. Reduced ATP availability is context-dependent: total ATP was maintained in global knockout
  mouse heart and skeletal muscle, while ATP content fell in cultured knockout cardiomyocytes and the ATP-to-ADP
  ratio fell in PV-specific knockout neurons. The pvalb transcriptomic cell class excludes some parvalbumin-expressing
  interneurons; the broader GABAergic interneuron binding represents the experimentally selected PV-positive
  population.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:31155743
      reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both patients presented muscle weakness and hypotonia in 4 limbs along with facial muscle weakness.
      explanation: The founding patients had limb and facial weakness with hypotonia.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:31155743
      reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variants detected were homozygous c.117C > A (p.Ser39Arg) and compound heterozygous c.117C > A
        (p.Ser39Arg) and c.127T > C (p.Cys43Arg).
      explanation: >-
        The reported alleles were homozygous p.Ser39Arg and compound heterozygous p.Ser39Arg/p.Cys43Arg.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:31155743
      reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found specific reductions in complex IV activities in the skeletal muscle of both individuals.
      explanation: The isolated complex IV biochemical defect was measured in patient skeletal muscle.
  icimd_category:
  - classification_value: complex_iv_subunits_and_assembly_factors
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416), nuclear-encoded complex IV subunit and assembly factor defects;
      COX6A2 is a structural subunit.

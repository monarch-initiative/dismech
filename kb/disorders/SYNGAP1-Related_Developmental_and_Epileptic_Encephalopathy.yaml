  title: >-
    Epigenetic Modulation to perturb the SYNGAP1 Intellectual Disability (ID)
    that ameliorates synaptic and behavioural deficits
  description: >-
    Whole-hippocampal RNA sequencing across six arms - wild-type and
    Syngap1+/- mice each given saline, carrier nanosphere alone, or the
    nanosphere-conjugated p300/CBP acetyltransferase activator CSP-TTK21 -
    profiled after Morris water maze training. The design carries both the
    haploinsufficiency comparison and a pharmacological rescue arm, so it is
    usable for the SYNGAP1 loss-of-function transcriptome and for testing
    whether that transcriptome is reversible in the adult animal.

pathophysiology:
- name: SYNGAP1 Haploinsufficiency
  description: >-
    A heterozygous loss-of-function variant in SYNGAP1 (or a 6p21.3 deletion
    encompassing it), usually de novo, reduces functional SynGAP protein to
    roughly half. This node captures the single concept of the initiating
    haploinsufficiency.
  role: trigger
  gene:
    preferred_term: SYNGAP1
    term:
      id: hgnc:11497
      label: SYNGAP1
  evidence:
  - reference: PMID:30789692
    reference_title: "SYNGAP1-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SYNGAP1-ID is established in a proband with developmental delay or intellectual disability in whom molecular genetic testing identifies either a heterozygous pathogenic variant in SYNGAP1 (~89%) or a deletion of 6p21.3 (~11%)."
    explanation: >-
      GeneReviews establishes heterozygous SYNGAP1 loss-of-function variants (or
      6p21.3 deletion) as the molecular cause.
  downstream:
  - target: Reduced SynGAP at the Excitatory Postsynaptic Density
    causal_link_type: DIRECT
    description: >-
      Reduced SYNGAP1 dosage lowers SynGAP protein at excitatory synapses.
- name: Reduced SynGAP at the Excitatory Postsynaptic Density
  description: >-
    SynGAP is a Ras/Rap GTPase-activating protein highly concentrated at the
    postsynaptic density of excitatory (glutamatergic) synapses, where it
    restrains synaptic Ras signaling. Its reduction removes this brake. This
    node captures the single concept of the synaptic protein deficit.
  role: mediator
  cell_types:
  - preferred_term: Glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  molecular_functions:
  - preferred_term: GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26912996
    reference_title: "SYNGAP1: Mind the Gap."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SYNGAP1 is a negative regulator of Ras, Rap and of AMPA receptor trafficking to the postsynaptic membrane"
    explanation: >-
      Establishes SynGAP as a synaptic brake that negatively regulates Ras/Rap
      signaling and AMPA-receptor trafficking; its loss disinhibits this
      pathway.
  downstream:
  - target: Dysregulated Ras Signaling and AMPA Receptor Trafficking
    causal_link_type: DIRECT
    description: >-
      Loss of SynGAP GAP activity dysregulates postsynaptic Ras signaling and
      AMPA-receptor trafficking.
- name: Dysregulated Ras Signaling and AMPA Receptor Trafficking
  description: >-
    Without adequate SynGAP, Ras-ERK signaling at the synapse is disinhibited,
    increasing insertion of AMPA-type glutamate receptors and strengthening
    excitatory transmission. This node captures the single concept of the
    signaling and receptor-trafficking derangement.
  role: mediator
  cell_types:
  - preferred_term: Glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  biological_processes:
  - preferred_term: Regulation of Ras protein signal transduction
    term:
      id: GO:0046578
      label: regulation of Ras protein signal transduction
    modifier: INCREASED
  downstream:
  - target: Premature Excitatory Synapse and Dendritic Spine Maturation

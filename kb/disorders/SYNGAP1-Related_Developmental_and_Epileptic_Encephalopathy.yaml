    description: >-
      Enhanced Ras signaling and AMPA-receptor insertion accelerate excitatory
      synapse and dendritic spine maturation.
- name: Premature Excitatory Synapse and Dendritic Spine Maturation
  description: >-
    SynGAP normally paces the maturation of dendritic spines and excitatory
    synapses; its loss causes premature, accelerated maturation and an excess of
    strengthened excitatory synapses during development. This node captures the
    single concept of the accelerated synaptic maturation defect.
  role: mediator
  cell_types:
  - preferred_term: Glutamatergic neuron

discussions:
- discussion_id: gap_syngap1_developmental_window_adult_reversibility
  prompt: >-
    How much of the SYNGAP1-related phenotype is fixed by the developmental
    shortening of the critical period versus reversible in adulthood, and what
    is the treatment window for the emerging SYNGAP1-upregulating and gene
    therapies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Excitatory Synapse and Dendritic Spine Maturation
  - pathophysiology#Impaired Cognitive Development
  rationale: >-
    SynGAP paces synaptic maturation, and its loss causes premature spine
    maturation that shortens the developmental critical period, implying an early
    and possibly fixed contribution to intellectual disability. Yet re-expression
    of SynGAP in adult mice improves memory and seizure measures, suggesting some
    deficits remain reversible after development. How much of the human phenotype
    can be recovered by restoring SYNGAP1 dosage after diagnosis, and how wide
    the therapeutic window is, is decisive for the design and timing of the
    antisense-oligonucleotide and gene therapies now entering development.
  evidence:
  - reference: PMID:31025938
    reference_title: "Re-expression of SynGAP protein in adulthood improves translatable measures of brain function and behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult restoration of SynGAP protein improved behavioral and electrophysiological measures of memory and seizure."
    explanation: >-
      Demonstrates partial adult reversibility in a mouse model, framing the open
      question of the human treatment window.
  proposed_experiments:
  - experiment_id: exp_syngap1_timed_restoration
    name: Timed SYNGAP1 restoration across development and adulthood
    description: >-
      In a conditional Syngap1 model, restore SynGAP at graded ages and measure
      recovery of network excitability, seizure susceptibility, and
      cognitive/behavioral endpoints as a function of restoration age.
    experiment_type:
      preferred_term: timed gene-restoration experiment
    readouts:
    - name: Recovery by restoration age
      target: pathophysiology#Impaired Cognitive Development
      assays:
      - preferred_term: behavioral assay
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Never-restored and wild-type
      description: Matched never-restored mutants and wild-type controls.
    decision_criterion: >-
      A treatment window is supported if recovery declines with later restoration
      age; broad reversibility is supported if late restoration still rescues
      endpoints.
    would_support:
    - pathophysiology#Impaired Cognitive Development

- discussion_id: gap_syngap1_dosage_upregulation_therapy
  prompt: >-
    Can boosting expression of the single functional SYNGAP1 allele (an
    upregulating antisense-oligonucleotide or gene-therapy strategy) restore
    sufficient SynGAP to be disease-modifying, and how precisely must dosage be
    controlled given the gene's dosage sensitivity?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#SYNGAP1 Haploinsufficiency
  rationale: >-
    SYNGAP1 disease is a haploinsufficiency: one functional copy is not enough.
    Because too little SynGAP causes disease, therapies that upregulate the
    remaining allele or add gene copies are attractive and are entering
    development, but SynGAP dosage is tightly constrained, and overshooting could
    have its own consequences. Whether dosage can be restored into a therapeutic
    range, and what biomarker confirms it, is the open translational question for
    this actively developing pipeline.
  evidence:
  - reference: PMID:39807402
    reference_title: "Roadmap to advance therapeutics for SYNGAP1-related disorder: a patient organization perspective from SynGAP Research Fund."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "one of many rare monogenic brain disorders without disease-modifying treatments"
    explanation: >-

- name: SYNGAP1
  gene_term:
    preferred_term: SYNGAP1
    term:
      id: hgnc:11497
      label: SYNGAP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_b19f2a30-5538-4339-9018-150fd1bcd9c8-2019-04-02T160000.000Z
    notes: >-
      ClinGen Epilepsy GCEP Definitive classification for autosomal dominant
      SYNGAP1 under ClinGen's lumped complex neurodevelopmental disorder entity
      (MONDO:0100038).
    evidence:
    - reference: CGGV:assertion_b19f2a30-5538-4339-9018-150fd1bcd9c8-2019-04-02T160000.000Z
      reference_title: "SYNGAP1 / complex neurodevelopmental disorder (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SYNGAP1 | HGNC:11497 | complex neurodevelopmental disorder | MONDO:0100038 | AD | Definitive | SOP6 | Epilepsy Gene Curation Expert Panel | 2019-04-02T16:00:00.000Z"
      explanation: ClinGen Epilepsy GCEP classifies autosomal dominant SYNGAP1 neurodevelopmental/epileptic disease as Definitive.
  - validity_classification: SUPPORTIVE
    classified_by: ORPHANET
    external_id: ORPHA:544254
    evidence:
    - reference: ORPHA:544254
      reference_title: "SYNGAP1-related developmental and epileptic encephalopathy"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "SYNGAP1 | synaptic Ras GTPase activating protein 1 | hgnc:11497 | Disease-causing germline mutation(s) in"
      explanation: Orphanet records SYNGAP1 as the causative germline gene for ORPHA:544254.
  notes: >-
    SYNGAP1 (6p21.32) encodes SynGAP, a synaptic Ras/Rap GTPase-activating
    protein. Disease is caused by heterozygous loss-of-function variants
    (~89%; nonsense, frameshift, splice, missense) or 6p21.3 deletions (~11%),
    acting by haploinsufficiency (ClinGen HI score 3); most are de novo.
  evidence:
  - reference: PMID:30789692
    reference_title: "SYNGAP1-Related Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SYNGAP1-ID is established in a proband with developmental delay or intellectual disability in whom molecular genetic testing identifies either a heterozygous pathogenic variant in SYNGAP1 (~89%) or a deletion of 6p21.3 (~11%)."
    explanation: GeneReviews documents the SYNGAP1 variant classes and their proportions.
  - reference: CGDS:HGNC_11497
    reference_title: "SYNGAP1 dosage sensitivity"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SYNGAP1 | HGNC:11497 | 8831 | 6p21.32 | chr6:33418167-33453689 | 3 - Sufficient Evidence for Haploinsufficiency | 0 - No Evidence for Triplosensitivity | 2021-11-09"

discussions:
- discussion_id: gap_syngap1_developmental_window_adult_reversibility
  prompt: >-
    How much of the SYNGAP1-related phenotype is fixed by the developmental
    shortening of the critical period versus reversible in adulthood, and what
    is the treatment window for the emerging SYNGAP1-upregulating and gene
    therapies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Excitatory Synapse and Dendritic Spine Maturation
  - pathophysiology#Impaired Cognitive Development
  rationale: >-
    SynGAP paces synaptic maturation, and its loss causes premature spine
    maturation that shortens the developmental critical period, implying an early
    and possibly fixed contribution to intellectual disability. Yet re-expression
    of SynGAP in adult mice improves memory and seizure measures, suggesting some
    deficits remain reversible after development. How much of the human phenotype
    can be recovered by restoring SYNGAP1 dosage after diagnosis, and how wide
    the therapeutic window is, is decisive for the design and timing of the
    antisense-oligonucleotide and gene therapies now entering development.
  evidence:
  - reference: PMID:31025938
    reference_title: "Re-expression of SynGAP protein in adulthood improves translatable measures of brain function and behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult restoration of SynGAP protein improved behavioral and electrophysiological measures of memory and seizure."
    explanation: >-
      Demonstrates partial adult reversibility in a mouse model, framing the open
      question of the human treatment window.
  proposed_experiments:
  - experiment_id: exp_syngap1_timed_restoration
    name: Timed SYNGAP1 restoration across development and adulthood
    description: >-
      In a conditional Syngap1 model, restore SynGAP at graded ages and measure
      recovery of network excitability, seizure susceptibility, and
      cognitive/behavioral endpoints as a function of restoration age.
    experiment_type:
      preferred_term: timed gene-restoration experiment
    readouts:
    - name: Recovery by restoration age
      target: pathophysiology#Impaired Cognitive Development
      assays:
      - preferred_term: behavioral assay
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Never-restored and wild-type
      description: Matched never-restored mutants and wild-type controls.
    decision_criterion: >-
      A treatment window is supported if recovery declines with later restoration
      age; broad reversibility is supported if late restoration still rescues
      endpoints.
    would_support:
    - pathophysiology#Impaired Cognitive Development

- discussion_id: gap_syngap1_dosage_upregulation_therapy
  prompt: >-
    Can boosting expression of the single functional SYNGAP1 allele (an
    upregulating antisense-oligonucleotide or gene-therapy strategy) restore
    sufficient SynGAP to be disease-modifying, and how precisely must dosage be
    controlled given the gene's dosage sensitivity?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#SYNGAP1 Haploinsufficiency
  rationale: >-
    SYNGAP1 disease is a haploinsufficiency: one functional copy is not enough.
    Because too little SynGAP causes disease, therapies that upregulate the
    remaining allele or add gene copies are attractive and are entering
    development, but SynGAP dosage is tightly constrained, and overshooting could
    have its own consequences. Whether dosage can be restored into a therapeutic
    range, and what biomarker confirms it, is the open translational question for
    this actively developing pipeline.
  evidence:
  - reference: PMID:39807402
    reference_title: "Roadmap to advance therapeutics for SYNGAP1-related disorder: a patient organization perspective from SynGAP Research Fund."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "one of many rare monogenic brain disorders without disease-modifying treatments"
    explanation: >-
      Frames the current absence of disease-modifying therapy and the active
      dosage-restoration pipeline that this hypothesis concerns.
  proposed_experiments:
  - experiment_id: exp_syngap1_dosage_restoration_window
    name: SYNGAP1 dosage-restoration therapeutic window
    description: >-
      In patient iPSC-derived neurons and Syngap1 mice, titrate SYNGAP1
      upregulation and measure the relationship between restored SynGAP level and
      normalization of synaptic and network phenotypes, defining the effective
      and safe dosage range.
    experiment_type:
      preferred_term: dosage-titration experiment
    readouts:
    - name: Phenotype normalization versus SynGAP level
      target: pathophysiology#SYNGAP1 Haploinsufficiency
      assays:
      - preferred_term: multielectrode array recording
      - preferred_term: immunoblot assay
      direction: POSITIVE
    controls:
    - name: Untreated haploinsufficient and wild-type
      description: Matched untreated mutant and wild-type references.
    decision_criterion: >-
      An upregulation strategy is supported if restoring SynGAP toward normal
      levels normalizes synaptic and network phenotypes within a controllable
      dosage range.
    would_support:
    - pathophysiology#SYNGAP1 Haploinsufficiency

- discussion_id: gap_syngap1_mechanism_to_phenotype
  prompt: >-
    Which downstream consequence of SynGAP loss (excitatory synapse
    over-strengthening, AMPA-receptor mis-trafficking, or inhibitory-circuit
    involvement) drives which arm of the phenotype - the generalized epilepsy,
    the intellectual disability, and the autism - and does the consistent
    developmental-delay-before-seizures sequence reflect distinct mechanisms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Excitation-Inhibition Imbalance
  - pathophysiology#Impaired Cognitive Development
  rationale: >-
    SynGAP haploinsufficiency perturbs excitatory synapse maturation,
    AMPA-receptor trafficking, and circuit excitation/inhibition balance, and the
    disorder combines epilepsy, intellectual disability, and autism. Developmental
    delay reliably precedes seizure onset. Whether these features share one
    substrate or arise from separable mechanisms - and whether targeting one
    (e.g., normalizing excitatory strength) would help all three - is unresolved
    and shapes what a therapy should be measured against.
  evidence:
  - reference: PMID:30541864
    reference_title: "SYNGAP1 encephalopathy: A distinctive generalized developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental delay preceded seizure onset in 54 of 56 (96%) patients for whom early developmental history was available. Developmental plateauing or regression occurred with seizures in 56 in the context of a developmental and epileptic encephalopathy (DEE)."
    explanation: >-
      Establishes that developmental delay precedes seizure onset in 96% of
      patients while seizure onset brings plateauing or regression, framing the
      open question of shared versus separable mechanisms across cognitive,
      epileptic, and neurobehavioral features.
  proposed_experiments:
  - experiment_id: exp_syngap1_celltype_specific_contributions
    name: Cell-type-specific contributions to epilepsy versus cognition
    description: >-
      Using cell-type-restricted Syngap1 manipulation (excitatory neurons versus
      interneurons), test which population's dysfunction produces the seizures
      versus the cognitive and autistic phenotypes.
    experiment_type:
      preferred_term: cell-type-restricted manipulation experiment
    readouts:
    - name: Phenotype by targeted cell type
      target: pathophysiology#Cortical Excitation-Inhibition Imbalance
      assays:
      - preferred_term: electroencephalography
      - preferred_term: behavioral assay
      direction: POSITIVE
    controls:
    - name: Pan-neuronal and wild-type
      description: Pan-neuronal manipulation and wild-type as references.
    decision_criterion: >-
      A feature is assigned to a cell type if restricting the SynGAP deficit to
      that population reproduces it while sparing the others.
    would_support:
    - pathophysiology#Cortical Excitation-Inhibition Imbalance

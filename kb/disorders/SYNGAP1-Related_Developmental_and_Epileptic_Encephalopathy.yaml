- discussion_id: gap_syngap1_mechanism_to_phenotype
  prompt: >-
    Which downstream consequence of SynGAP loss (excitatory synapse
    over-strengthening, AMPA-receptor mis-trafficking, or inhibitory-circuit
    involvement) drives which arm of the phenotype - the generalized epilepsy,
    the intellectual disability, and the autism - and does the consistent
    developmental-delay-before-seizures sequence reflect distinct mechanisms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Excitation-Inhibition Imbalance
  - pathophysiology#Impaired Cognitive Development
  rationale: >-
    SynGAP haploinsufficiency perturbs excitatory synapse maturation,
    AMPA-receptor trafficking, and circuit excitation/inhibition balance, and the
    disorder combines epilepsy, intellectual disability, and autism. Developmental
    delay reliably precedes seizure onset. Whether these features share one
    substrate or arise from separable mechanisms - and whether targeting one
    (e.g., normalizing excitatory strength) would help all three - is unresolved
    and shapes what a therapy should be measured against.
  evidence:
  - reference: PMID:30541864
    reference_title: "SYNGAP1 encephalopathy: A distinctive generalized developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SYNGAP1 encephalopathy: A distinctive generalized developmental and epileptic encephalopathy."
    explanation: >-
      Characterizes the distinctive combined phenotype whose mechanistic
      partitioning is the open question.
  proposed_experiments:
  - experiment_id: exp_syngap1_celltype_specific_contributions
    name: Cell-type-specific contributions to epilepsy versus cognition
    description: >-
      Using cell-type-restricted Syngap1 manipulation (excitatory neurons versus
      interneurons), test which population's dysfunction produces the seizures
      versus the cognitive and autistic phenotypes.
    experiment_type:
      preferred_term: cell-type-restricted manipulation experiment
    readouts:
    - name: Phenotype by targeted cell type
      target: pathophysiology#Cortical Excitation-Inhibition Imbalance
      assays:
      - preferred_term: electroencephalography
      - preferred_term: behavioral assay
      direction: POSITIVE
    controls:
    - name: Pan-neuronal and wild-type
      description: Pan-neuronal manipulation and wild-type as references.
    decision_criterion: >-
      A feature is assigned to a cell type if restricting the SynGAP deficit to
      that population reproduces it while sparing the others.
    would_support:
    - pathophysiology#Cortical Excitation-Inhibition Imbalance

name: SYNGAP1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  SYNGAP1-related developmental and epileptic encephalopathy (also called
  SYNGAP1-related intellectual disability, MRD5) is an autosomal dominant
  neurodevelopmental disorder caused by haploinsufficiency of SYNGAP1, which
  encodes SynGAP - a Ras/Rap GTPase-activating protein highly enriched at
  excitatory postsynaptic densities. Essentially all affected individuals have
  developmental delay or intellectual disability; most (~84%) have generalized
  epilepsy, and about half have autism spectrum disorder or other behavioral
  problems. A characteristic subset has myoclonic-astatic epilepsy (Doose
  syndrome) or epilepsy with myoclonic absences. Because SynGAP restrains
  Ras-ERK signaling and AMPA-receptor insertion during synapse maturation, its
  reduction accelerates excitatory synapse maturation and tips cortical circuits
  toward excitation. Most cases arise de novo.
parents:
- Epilepsy
- Neurodevelopmental Disorder
- Neurological Disease
synonyms:
- SYNGAP1-related intellectual disability
- SYNGAP1-ID
- SYNGAP1-related DEE
- Intellectual disability, autosomal dominant 5
- MRD5
- Epilepsy due to SYNGAP1 mutations

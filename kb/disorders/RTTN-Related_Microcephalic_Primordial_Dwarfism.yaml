- name: Exome or genome sequencing
  description: >-
    Trio whole-exome or whole-genome sequencing is first-line; RNA studies
    (RT-PCR of patient fibroblasts) are valuable because splice and deep-intronic
    variants are common.
  diagnosis_term:

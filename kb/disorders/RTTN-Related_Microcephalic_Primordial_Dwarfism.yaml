    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:30121372
    reference_title: "Recurrent RTTN mutation leading to severe microcephaly, polymicrogyria and growth restriction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified, by trio based whole exome sequencing, a homozygous missense mutation in the RTTN gene (c.2953A > G; p.(Arg985Gly)) in one Moroccan patient from a consanguineous family."
    explanation: Trio WES is the diagnostic route for RTTN variants.
treatments:
- name: Supportive and symptomatic care
  description: >-
    No disease-specific, gene, RNA or cell therapy exists. Care is supportive:
    antiseizure medication for epilepsy, growth/nutritional monitoring, and
    physical, occupational and speech therapy with developmental support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

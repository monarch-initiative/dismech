name: RTTN-Related Microcephalic Primordial Dwarfism
creation_date: "2026-11-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: microcephalic primordial dwarfism due to RTTN deficiency
  term:
    id: MONDO:0018764
    label: microcephalic primordial dwarfism due to RTTN deficiency
synonyms:
- "Microcephaly, short stature, and polymicrogyria with or without seizures (MSSP)"
- RTTN-related primary microcephaly
- RTTN-related polymicrogyria
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic
  hypomorphic variants in RTTN (rotatin), a centriolar scaffold protein required
  for centriole elongation. The phenotype spans a spectrum from isolated
  bilateral polymicrogyria through microcephalic primordial dwarfism with complex
  cortical malformation to the most severe radial microbrain, with severity
  tracking the residual function of the protein. Core features are primary
  (congenital) microcephaly, pre- and postnatal growth restriction, intellectual
  disability with frequently absent speech, and a range of cortical malformations
  (polymicrogyria, lissencephaly/pachygyria, periventricular heterotopia,
  corpus-callosum and vermis hypoplasia), with seizures in a minority. OMIM 614833
  (MSSP) and Orphanet ORPHA:468631 describe one RTTN-related spectrum. Because
  complete loss of rotatin is embryonic-lethal in the mouse, the human disorder
  reflects partial loss of function.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) RTTN variants; parental
    consanguinity recurs across reported families.
  evidence:
  - reference: PMID:30927481
    reference_title: "Primary microcephaly, primordial dwarfism, and brachydactyly in adult cases with biallelic skipping of RTTN exon 42."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report on a consanguineous family with three adult members, age 43, 57, and 60 years respectively, with primary microcephaly, developmental delay, primordial dwarfism, and brachydactyly segregating a homozygous splice site variant"
    explanation: Autosomal recessive segregation of a homozygous RTTN variant in a consanguineous family.
genetic:
- name: RTTN variants
  gene_term:
    preferred_term: RTTN
    term:
      id: hgnc:18654
      label: RTTN
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic hypomorphic RTTN variants (missense, splice-altering, and
    deep-intronic/cryptic-splice) cause the disorder. Severity correlates with
    residual rotatin function rather than with mRNA level. The recurrent
    c.2953A>G, p.(Arg985Gly) allele (which also alters exon 23 splicing) recurs
    in North African families and underlies the severe radial-microbrain end of
    the spectrum; an exon-42-skipping splice allele (c.5648-5T>A) is associated
    with survival into adulthood with brachydactyly; the p.(Ala578Pro) missense
    allele reduces STIL binding and blocks centriole assembly.
  variants:
  - name: c.2953A>G p.(Arg985Gly)
    description: >-
      Recurrent homozygous missense variant (NM_173630) that also alters the
      exon 23 splice-donor site; reported in North African/Moroccan
      consanguineous families and recurrent in radial microbrain.
    clinical_significance: PATHOGENIC
  - name: c.5648-5T>A p.(Ala1883Glyfs*6)
    description: >-
      Homozygous splice-site variant causing skipping of exon 42 and a
      C-terminal frameshift; associated with stationary disease into the seventh
      decade and brachydactyly.
    clinical_significance: PATHOGENIC
  - name: p.(Ala578Pro)
    description: >-
      Naturally occurring microcephaly-associated missense variant that shows
      low affinity for STIL binding and blocks centriole assembly.
    clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:26608784
    reference_title: "RTTN Mutations Cause Primary Microcephaly and Primordial Dwarfism in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results expand the phenotype of RTTN-related disorders, hitherto limited to polymicrogyria, to include microcephalic primordial dwarfism with a complex brain phenotype involving simplified gyration."
    explanation: Establishes biallelic RTTN variants as the cause of microcephalic primordial dwarfism.
  - reference: PMID:30121372
    reference_title: "Recurrent RTTN mutation leading to severe microcephaly, polymicrogyria and growth restriction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified, by trio based whole exome sequencing, a homozygous missense mutation in the RTTN gene (c.2953A > G; p.(Arg985Gly)) in one Moroccan patient from a consanguineous family."
    explanation: Reports the recurrent p.Arg985Gly allele in a consanguineous family.
pathophysiology:
- name: Reduced Rotatin Centriolar Function
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  description: >-
    Biallelic hypomorphic RTTN variants reduce or mislocalize rotatin, a
    centriolar scaffold protein. The severity of the disorder tracks the residual
    function of the protein rather than the mRNA level.
  biological_processes:
  - preferred_term: centriole elongation
    modifier: DECREASED
    term:
      id: GO:0061511
      label: centriole elongation
  downstream:
  - target: Defective Centriole Assembly
    description: Reduced rotatin impairs assembly of full-length centrioles.
  evidence:
  - reference: PMID:30879067
    reference_title: "Heterogeneous clinical phenotypes and cerebral malformations reflected by rotatin cellular dynamics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We show that the severity of the phenotype is related to residual function of the protein, not only the level of mRNA expression."
    explanation: Severity tracks residual rotatin function, defining the disorder as partial loss of function.
- name: Defective Centriole Assembly
  biological_scale: CELLULAR
  description: >-
    Rotatin acts downstream of STIL-mediated procentriole initiation and is
    required to build full-length centrioles; it recruits CEP295 and the
    distal-centriole proteins POC5/POC1B and forms a complex with PPP1R35. Loss
    of rotatin produces short or incomplete centrioles.
  biological_processes:
  - preferred_term: centriole assembly
    modifier: DECREASED
    term:
      id: GO:0098534
      label: centriole assembly
  downstream:
  - target: Mitotic Spindle Dysfunction and Centrosome Amplification
    description: Defective centrioles disrupt spindle-pole formation in mitosis.
  evidence:
  - reference: PMID:28811500
    reference_title: "Human microcephaly protein RTTN interacts with STIL and is required to build full-length centrioles."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further studies demonstrate that RTTN directly interacts with STIL and acts downstream of STIL-mediated centriole assembly."
    explanation: Places rotatin downstream of STIL in centriole assembly.
  - reference: PMID:30168418
    reference_title: "PPP1R35 is a novel centrosomal protein that regulates centriole length in concert with the microcephaly protein RTTN."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "We further demonstrate that PPP1R35 acts downstream of, and forms a complex with, RTTN, a microcephaly protein required for distal centriole elongation."
    explanation: Confirms rotatin's requirement for distal centriole elongation via the PPP1R35 complex.
- name: Mitotic Spindle Dysfunction and Centrosome Amplification
  biological_scale: CELLULAR
  description: >-
    Defective centrioles cause centrosome amplification, dispersion of
    pericentriolar gamma-tubulin, and monopolar/multipolar spindles with
    misorientation, producing mitotic failure in dividing cells, including
    patient fibroblasts.
  biological_processes:
  - preferred_term: mitotic spindle organization
    modifier: ABNORMAL
    term:
      id: GO:0007052
      label: mitotic spindle organization
  cell_types:
  - preferred_term: fibroblast (patient)
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Neural Progenitor Depletion
    description: Mitotic failure leads to aneuploidy and apoptosis of dividing neural progenitors.
  evidence:
  - reference: PMID:34207628
    reference_title: "Human Microcephaly Protein RTTN Is Required for Proper Mitotic Progression and Correct Spindle Position."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that RTTN is required for normal mitotic progression and correct spindle position."
    explanation: Rotatin is required for normal mitosis and spindle positioning.
  - reference: PMID:30879067
    reference_title: "Heterogeneous clinical phenotypes and cerebral malformations reflected by rotatin cellular dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutant cells showed consistent and severe mitotic failure with centrosome amplification and multipolar spindle formation, leading to aneuploidy and apoptosis, which could relate to depletion of neuronal progenitors often observed in microcephaly."
    explanation: Patient-derived mutant cells show mitotic failure, centrosome amplification and apoptosis.
- name: Neural Progenitor Depletion
  biological_scale: CELLULAR
  description: >-
    Mitotic failure produces aneuploidy, cell-cycle arrest and apoptosis of
    neural stem and progenitor cells, depleting the proliferative pool and the
    radial glial scaffold during cortical neurogenesis. Shown in CRISPR-edited
    iPSC-derived neural stem cells and cortical organoids.
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    modifier: DECREASED
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  downstream:
  - target: Primary microcephaly
    description: Loss of the proliferative progenitor pool reduces cortical neuron number.
  evidence:
  - reference: PMID:39680576
    reference_title: "A Taybi-Linder syndrome-related RTTN variant impedes neural rosette formation in human cortical organoids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we analysed neural stem cells (NSC) derived from CRISPR/Cas9-edited induced pluripotent stem cells and revealed major cell cycle and mitotic abnormalities, leading to aneuploidy, cell cycle arrest and cell death."
    explanation: iPSC-derived neural stem cells show mitotic failure leading to cell death, depleting progenitors.
  - reference: PMID:40151166
    reference_title: "Radial Microbrain (Micrencephaly) Is Caused by a Recurrent Variant in the RTTN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cortical plate was reduced by 70% compared with controls, irrespective of the region considered. Immunostaining with vimentin showed a 50% loss of radial glial columns, characteristic of radial microbrain."
    explanation: Fetal neuropathology shows loss of radial glial columns and a thinned cortical plate.
- name: Ciliary Signalling Dysfunction
  biological_scale: CELLULAR
  description: >-
    Rotatin localizes to the basal body and ciliary axoneme; loss produces
    structural cilia abnormalities and downregulation of BMP4, WNT5A and WNT2B,
    key regulators of cortical patterning. This branch is proposed to underlie
    the cortical organization defects (polymicrogyria). The link to the human
    cortical phenotype is inferred from fibroblast findings.
  biological_processes:
  - preferred_term: cilium assembly
    modifier: ABNORMAL
    term:
      id: GO:0060271
      label: cilium assembly
  downstream:
  - target: Polymicrogyria
    description: Impaired ciliary cortical-patterning signalling is proposed to drive abnormal cortical organization.
  evidence:
  - reference: PMID:22939636
    reference_title: "RTTN mutations link primary cilia function to organization of the human cerebral cortex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Cultured fibroblasts from affected individuals have structural abnormalities of the cilia and exhibit downregulation of BMP4, WNT5A, and WNT2B, which are key regulators of cortical patterning"
    explanation: Links ciliary dysfunction to dysregulated cortical-patterning signals.
- name: Defective Neuronal Migration
  biological_scale: CELLULAR
  description: >-
    Rotatin localizes to the leading-edge centrosome of migrating iPSC-derived
    neurons and interacts with non-muscle myosin heavy chains, the motors of
    nucleokinesis during neuronal migration. Loss of this function is proposed to
    cause defective migration, producing lissencephaly/pachygyria and
    heterotopia. Inferred from localization and interaction data.
  biological_processes:
  - preferred_term: neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  cell_types:
  - preferred_term: migrating cortical neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Lissencephaly and pachygyria
    description: Impaired neuronal migration produces a simplified/thickened cortex.
  - target: Periventricular nodular heterotopia
    description: Arrest of migrating neurons produces periventricular heterotopia.
  evidence:
  - reference: PMID:30879067
    reference_title: "Heterogeneous clinical phenotypes and cerebral malformations reflected by rotatin cellular dynamics."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "rotatin interacts with the neuronal (non-muscle) myosin heavy chain subunits, motors of nucleokinesis during neuronal migration, and in human induced pluripotent stem cell-derived bipolar mature neurons rotatin localizes at the centrosome in the leading edge."
    explanation: Localization and myosin interaction implicate rotatin in neuronal migration.

animal_models:
- name: Rttn knockout mouse (axial-rotation / no-turning)
  species: Mouse
  genotype: Rttn insertional/null mutant
  publication: PMID:11900971
  description: >-
    The founding rotatin mouse allele; null embryos fail axial rotation and show
    laterality defects and embryonic lethality.
  modeled_mechanisms:
  - target: Reduced Rotatin Centriolar Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Establishes that rotatin is essential in development, but the null allele
      models neither the human cortical phenotype nor the partial-loss-of-function
      mechanism of the human disease.
    limitations: >-
      This is a null allele, whereas human disease is caused by hypomorphic
      (partial-loss-of-function) alleles with residual rotatin activity; the
      complete loss is embryonic-lethal in the mouse with randomized heart
      looping and failed axial rotation, a phenotype patients do not show, so
      the null mouse does not reproduce the human microcephaly/cortical disease.
    evidence:
    - reference: PMID:11900971
      reference_title: "Rotatin is a novel gene required for axial rotation and left-right specification in mouse embryos."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Embryos deficient in rotatin show also randomized heart looping and delayed neural tube closure, and fail to undergo the critical morphogenetic step of axial rotation."
      explanation: The null mouse phenotype is embryonic-lethal with laterality defects, not the human cortical phenotype.
experimental_models:
- name: CRISPR iPSC-derived neural stem cells and cortical organoids (RTTN c.2953A>G)
  experimental_model_type: ORGANOID
  description: >-
    CRISPR/Cas9-edited iPSC differentiated into neural stem cells and cortical
    organoids carrying the recurrent p.Arg985Gly allele.
  modeled_mechanisms:
  - target: Neural Progenitor Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the aneuploidy, cell-cycle arrest and death of neural stem cells
      and the delayed neural-rosette self-organization that underlie microcephaly.
    limitations: >-
      Organoids lack the full in-vivo cortical architecture and vascular/immune
      context; the model captures progenitor-level defects rather than the
      complete malformation.
    readouts:
    - name: Neural rosette self-organization
      target: Neural Progenitor Depletion
      direction: DECREASED
      interpretation: Delayed apico-basal polarization and rosette formation in mutant organoids.
      evidence:
      - reference: PMID:39680576
        reference_title: "A Taybi-Linder syndrome-related RTTN variant impedes neural rosette formation in human cortical organoids."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In cortical organoids, we discovered an additional function of RTTN in the self-organisation of NSC into neural rosettes, by observing delayed apico-basal polarization of NSC."
        explanation: Quantifies the rosette-formation defect in mutant organoids.
    evidence:
    - reference: PMID:39680576
      reference_title: "A Taybi-Linder syndrome-related RTTN variant impedes neural rosette formation in human cortical organoids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we analysed neural stem cells (NSC) derived from CRISPR/Cas9-edited induced pluripotent stem cells and revealed major cell cycle and mitotic abnormalities, leading to aneuploidy, cell cycle arrest and cell death."
      explanation: The organoid/NSC model is informative for the progenitor-depletion node.

genetic:
- name: COL12A1
  gene_term:
    preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  notes: >
    COL12A1 encodes collagen XII, a homotrimeric FACIT collagen that bridges
    collagen I-containing fibrils with extracellular matrix proteins
    including decorin and tenascin-X. Dominant variants (missense, in-frame
    exon-skipping) produce a milder phenotype; biallelic loss-of-function
    variants produce a more severe phenotype.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COLXII is a homotrimer assembled from three COLXII alpha chains encoded by COL12A1. It is essential for collagen fibril organization by bridging Collagen I-containing fibrils bound at the collagenous domain with various extracellular matrix (ECM) proteins including tenascin-X."
    explanation: Describes the normal molecular function of collagen XII.
pathophysiology:
- name: COL12A1 Dominant Variant
  biological_scale: MOLECULAR
  subtypes:
  - mEDS Dominant
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  description: >
    Heterozygous, often de novo, missense or in-frame exon-skipping variants
    cluster to the thrombospondin N-terminal region and adjacent collagenous
    domain, causing variant-specific intracellular accumulation of collagen
    XII chains and extracellular overmodification of the long isoform.
  evidence:
  - reference: PMID:31273343
    reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variant-specific intracellular accumulation of collagen XII chains, extracellular overmodification of the long isoform and near-absence of the short isoform of collagen XII, and extracellular decrease of decorin and tenascin-X were observed for the COL12A1 variants."
    explanation: Directly demonstrates the cellular and extracellular consequences of heterozygous COL12A1 exon-skipping variants.
  downstream:
  - target: Depleted Collagen XII-Bridged Extracellular Matrix
    description: Intracellularly retained and structurally abnormal collagen XII fails to properly bridge collagen I fibrils with decorin and tenascin-X in the extracellular space.
- name: COL12A1 Biallelic Loss-of-Function
  biological_scale: MOLECULAR
  subtypes:
  - mEDS Recessive
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
  genes:
  - preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  notes: >-
    zygosity is recorded as HOMOZYGOUS (the slot is single-valued); the
    reported cohort is a mix of homozygous and compound heterozygous
    biallelic genotypes -- see description.
  description: >
    Homozygous or compound heterozygous loss-of-function (splice-site,
    truncating) COL12A1 variants abolish or severely reduce collagen XII
    protein expression, ranging from complete absence in severe disease to
    mild reduction in milder biallelic disease.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in vitro immunocytochemistry analysis in fibroblasts ranged from complete absence of Collagen XII expression in a patient with severe disease, to a mild reduction in a patient with milder disease"
    explanation: Demonstrates a genotype-severity correlation in collagen XII protein expression across the biallelic spectrum.
  downstream:
  - target: Depleted Collagen XII-Bridged Extracellular Matrix
    description: Absent or severely reduced collagen XII removes the molecular bridge between collagen I fibrils and other matrix components.
- name: Depleted Collagen XII-Bridged Extracellular Matrix
  biological_scale: TISSUE
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DECREASED
  description: >
    Loss of the collagen XII bridge between collagen I fibrils and
    accessory extracellular matrix proteins secondarily depletes
    extracellular decorin and tenascin-X, destabilizing the connective
    tissue matrix of muscle endomysium/perimysium, joint capsules, and skin.
  evidence:
  - reference: PMID:31273343
    reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "extracellular decrease of decorin and tenascin-X were observed for the COL12A1 variants"
    explanation: Directly demonstrates secondary depletion of decorin and tenascin-X in patient-derived material with COL12A1 variants.
  downstream:
  - target: Impaired Muscle Force Transmission
    description: Destabilized endomysial/perimysial connective tissue matrix impairs passive force transmission through skeletal muscle.
  - target: Joint and Skin Connective Tissue Laxity
    description: Destabilized joint capsule and dermal connective tissue matrix produces joint hypermobility and EDS-type skin findings.
  - target: Cardiac Valve Connective Tissue Involvement
    description: The same collagen XII-bridged ECM defect operating in cardiac valve leaflet connective tissue produces valvular anomalies.
  - target: Craniofacial and Dysmorphic Features
    description: >-
      A cluster of dysmorphic craniofacial findings recurs alongside the
      core muscle/joint phenotype in the severe biallelic cohort; the
      specific mechanistic link to the collagen XII/ECM defect is not yet
      established in the cited source, so this edge records only that both
      arise from the same underlying disorder, not a specific causal step.

- name: Impaired Muscle Force Transmission
  biological_scale: TISSUE
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  description: >
    A Col12a1-null mouse model shows decreased grip strength, a delay in
    muscle fiber-type transition, and a deficiency in passive force
    generation, indicating that the matrix-based passive force-transducing
    elastic element normally provided by collagen XII is disrupted.
  evidence:
  - reference: PMID:24334604
    reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A mouse model with inactivation of the Col12a1 gene showed decreased grip strength, a delay in fiber-type transition and a deficiency in passive force generation while the muscle seems more resistant to eccentric contraction induced force drop, indicating a role for a matrix-based passive force-transducing elastic element in the generation of the weakness."
    explanation: Directly demonstrates the mechanistic link between collagen XII loss and impaired muscle force generation in a Col12a1-null mouse model.
  downstream:
  - target: Proximal and Axial Muscle Weakness
  - target: Congenital Hypotonia
  - target: Skeletal Muscle Atrophy
    description: Chronic impaired force generation and disuse lead to secondary skeletal muscle atrophy, characteristically of the rectus femoris.
  - target: Motor Delay
    description: Impaired force generation delays acquisition of gross motor milestones.
  - target: Kyphoscoliosis
    description: Weakness of paraspinal musculature contributes to progressive spinal curvature.
- name: Joint and Skin Connective Tissue Laxity
  biological_scale: TISSUE
  description: >
    Destabilized joint capsule connective tissue produces distal joint
    hypermobility and, in the severe biallelic form, congenital joint
    contractures and arthrogryposis reflecting a mixed laxity/contracture
    phenotype.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distal joint laxity was noted in all patients (Fig. 1A–C), typically affecting wrists and ankles. Concurrent joint contractures were present in six patients and typically affected the long finger flexors"
    explanation: Documents the combined joint-laxity-plus-contracture pattern characteristic of the severe biallelic phenotype.
  downstream:
  - target: Distal Joint Hypermobility
  - target: Arthrogryposis
  - target: Hip Dysplasia
    description: Congenital joint laxity/instability predisposes to hip dysplasia.
  - target: Talipes Equinovarus
    description: Congenital joint contracture affecting the ankle/foot produces talipes equinovarus.
- name: Cardiac Valve Connective Tissue Involvement
  biological_scale: TISSUE
  locations:
  - preferred_term: cardiac valve
    term:
      id: UBERON:0000946
      label: cardiac valve
  description: >
    Destabilized valve leaflet connective tissue produces mild valvular
    anomalies including leaflet thickening, dysplasia, and regurgitation,
    reported in a subset of the severe biallelic cohort.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients also had evidence of cardiac involvement, with one (F2P2) presenting with Wolff–Parkinson–White syndrome."
    explanation: Documents cardiac involvement, including valvular anomalies, in a subset of the severe biallelic cohort.
  downstream:
  - target: Mitral Regurgitation
- name: Craniofacial and Dysmorphic Features
  biological_scale: TISSUE
  description: >
    Dysmorphic craniofacial findings, evident in all patients of the severe
    biallelic cohort, recur alongside the core connective-tissue/muscle
    phenotype. The specific mechanistic link between the collagen XII/ECM
    defect and these findings is not established in the cited source.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysmorphic features were evident in all patients."
    explanation: Establishes dysmorphic craniofacial features as a consistent finding in the severe biallelic cohort.
  downstream:
  - target: Micrognathia
  - target: Gingival Overgrowth

    explanation: Describes the molecular diagnostic approach used to confirm biallelic COL12A1-related disease.
- name: Dermal Fibroblast Immunostaining
  description: Immunocytochemistry of patient-derived dermal fibroblasts for collagen XII expression can support a diagnosis and correlates with clinical severity, ranging from complete absence in severe disease to mild reduction in milder disease.

diagnosis:
- name: Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Next Generation Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  description: >-
    Diagnosis is established by identifying a heterozygous (dominant) or
    biallelic (recessive) pathogenic COL12A1 variant via next-generation
    multigene panel, exome, or genome sequencing in an individual with
    combined muscle and connective-tissue clinical findings.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation-based sequencing identified rare biallelic COL12A1 (NM_004370.6) variants in all eight patients."
    explanation: Describes next-generation sequencing confirmation of biallelic COL12A1-related disease.
  - reference: PMID:31273343
    reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA from 78 genetically unresolved patients fulfilling the clinical criteria for myopathic EDS was sequenced using a next-generation panel of COL12A1, COL6A1, COL6A2, and COL6A3."
    explanation: Demonstrates targeted next-generation panel testing across COL12A1 and COL6A1/2/3 to differentiate mEDS from collagen VI-related myopathies.
- name: Dermal Fibroblast Immunostaining
  diagnosis_term:
    preferred_term: Immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  description: >-
    Immunocytochemistry of patient-derived dermal fibroblasts for collagen XII
    expression and localization supports variant interpretation and correlates
    with clinical severity, ranging from intracellular retention in TSPN-domain
    dominant exon skips to complete extracellular absence in severe biallelic
    loss of function.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in vitro immunocytochemistry analysis in fibroblasts ranged from complete absence of Collagen XII expression in a patient with severe disease, to a mild reduction in a patient with milder disease"
    explanation: Describes dermal fibroblast immunostaining as a supportive functional assay correlating with disease severity.
- name: Skeletal Muscle Magnetic Resonance Imaging
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Characteristic global concentric atrophy of the rectus femoris surrounded
    by thickened epimysial connective tissue, distinct from the peripheral
    outside-in fatty degeneration pattern of collagen VI-related myopathies,
    together with neck and lumbar paravertebral muscle involvement.
  description: >-
    Distinguishes COL12A1-related mEDS from collagen VI-related myopathies and
    maps axial and limb muscle involvement.
  evidence:
  - reference: PMID:40508193
    reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to confirming the characteristic atrophy of the rectus femoris, we presented evidence of involvement of the neck and lumbar muscles through MRI and CT imaging."
    explanation: Demonstrates characteristic rectus femoris, neck, and lumbar muscle imaging findings in mEDS.
  - reference: PMID:40508193
    reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "On the contrary, in patients with the COL12A1 mutation, the muscle is variably reduced in size ... and surrounded by an increased thickness of connective tissue (epimysium), as though the muscle is being choked by the excessive connective tissue surrounding it"
    explanation: Contrasts the rectus femoris imaging pattern of COL12A1-related mEDS with that of collagen VI-related myopathies.

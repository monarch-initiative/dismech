      reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        heterozygous or homozygous COL12A1 variants have been reported in 13
        patients presenting with a clinical phenotype overlapping with collagen
        VI-related myopathies and Ehlers-Danlos syndrome (EDS)
      explanation: >-
        Heritable connective-tissue disorder within the Ehlers-Danlos syndrome
        nosology.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:40508193
      reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Here, we report two splicing mutations of COL12A1 identified in three
        patients from two unrelated families who present a combination of joint
        hypermobility and axial, distal, and proximal weakness.
      explanation: >-
        Congenital and progressive primary skeletal myopathy (Bethlem myopathy
        2 / Ullrich congenital muscular dystrophy 2 overlap) falls under
        neuromuscular disease.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:24334604
      reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Here, we report a homozygous recessive loss of function mutation and a
        de novo dominant mutation in collagen XII (COL12A1) as underlying a
        novel overlap syndrome involving muscle and connective tissue.
      explanation: >-
        Monogenic Mendelian disorder caused by dominant or recessive germline
        variants in COL12A1.
  mechanistic_category:
  - classification_value: collagenopathy
    evidence:
    - reference: PMID:39923201
      reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        COLXII is a homotrimer assembled from three COLXII alpha chains encoded
        by COL12A1. It is essential for collagen fibril organization by bridging
        Collagen I‐containing fibrils bound at the collagenous domain with
        various extracellular matrix (ECM) proteins including tenascin‐X.
      explanation: >-
        Caused by primary structural or quantitative deficiency of FACIT
        collagen type XII (COL12A1).

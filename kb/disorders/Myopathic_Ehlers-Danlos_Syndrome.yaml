diagnosis:
- name: Molecular Genetic Testing
  description: Diagnosis is established by identifying a heterozygous (dominant) or biallelic (recessive) pathogenic COL12A1 variant in an individual with suggestive combined muscle/connective-tissue clinical findings.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT

  description: >
    Heterozygous, often de novo, missense or in-frame exon-skipping variants
    cluster to the thrombospondin N-terminal region and adjacent collagenous
    domain, disrupting trimeric collagen XII structural matrix activity and
    collagen I interaction while causing variant-specific intracellular
    accumulation of collagen XII chains and extracellular overmodification of
    the long isoform.
  evidence:
  - reference: PMID:31273343
    reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Variant-specific intracellular accumulation of collagen XII chains, extracellular overmodification of the long isoform and near-absence of the short isoform of collagen XII, and extracellular decrease of decorin and tenascin-X were observed for the COL12A1 variants."
    explanation: Directly demonstrates the cellular and extracellular consequences of heterozygous COL12A1 exon-skipping variants in cultured patient dermal fibroblasts.
  - reference: PMID:40508193
    reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The identified mutations are expected to affect the CL2 domain of the collagen XII α1 chain, which regulates the interaction between collagen XII and collagen I and plays a role in collagen fibril assembly."
    explanation: Connects dominant COL2-domain exon-skipping variants to impaired collagen XII-collagen I binding and matrix structural assembly.

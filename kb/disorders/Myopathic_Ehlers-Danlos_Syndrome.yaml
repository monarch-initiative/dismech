animal_models:
- name: Col12a1 knockout mouse
  species: Mouse
  genotype: Col12a1-/-
  publication: PMID:24334604
  description: >-
    Targeted inactivation of Col12a1 in mice causes variable muscle weakness
    with decreased grip strength, delayed muscle fiber-type transition,
    impaired passive force generation, and connective-tissue abnormalities
    including kyphoscoliosis and bone fragility.
  modeled_mechanisms:
  - target: Impaired Muscle Force Transmission
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Col12a1-null skeletal muscle demonstrates decreased grip strength,
      delayed fiber-type transition, and reduced passive force generation.
    evidence:
    - reference: PMID:24334604
      reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A mouse model with inactivation of the Col12a1 gene showed decreased grip strength, a delay in fiber-type transition and a deficiency in passive force generation while the muscle seems more resistant to eccentric contraction induced force drop, indicating a role for a matrix-based passive force-transducing elastic element in the generation of the weakness."

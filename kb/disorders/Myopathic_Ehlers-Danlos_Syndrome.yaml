  notes: >-
    13 patients had been reported prior to the 2020 series (PMID:31273343),
    expanded by 2025 literature synthesis to 45 patients across 31 families
    (30 patients from 18 autosomal dominant families and 15 patients from 13
    autosomal recessive families; PMID:40508193).
  evidence:
  - reference: PMID:31273343
    reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous or homozygous COL12A1 variants have been reported in 13 patients presenting with a clinical phenotype overlapping with collagen VI-related myopathies and Ehlers-Danlos syndrome (EDS)"
    explanation: Reports the cumulative literature case count for COL12A1-related mEDS prior to the 2020 cohort study.
  - reference: PMID:40508193
    reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Additionally, we review the myopathic involvement of COL12-RM in 30 patients across 18 families with dominant mutations and 15 patients from 13 families with recessive mutations."
    explanation: Summarizes 45 affected individuals across 31 families in the 2025 literature review.

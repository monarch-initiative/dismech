    evidence_source: IN_VITRO
    snippet: "in vitro immunocytochemistry analysis in fibroblasts ranged from complete absence of Collagen XII expression in a patient with severe disease, to a mild reduction in a patient with milder disease"
    explanation: Describes dermal fibroblast immunostaining as a supportive diagnostic tool correlating with disease severity.
treatments:
- name: Orthopedic Management of Scoliosis and Joint Contractures
  description: >
    Orthopedic surveillance and surgical correction of progressive
    kyphoscoliosis and joint contractures, most often required in the more
    severe mEDS Recessive phenotype.
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Kyphoscoliosis
    treatment_effect: MODULATES
    description: >
      Surgical instrumentation mechanically stabilizes and corrects the
      progressive spinal curvature; it addresses the structural consequence
      of muscle weakness and connective-tissue laxity rather than the
      underlying collagen XII defect.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "F2P2, F6P7 and F7P8 had progressive scoliosis requiring spinal surgery at age 10 years in F2P2."
    explanation: Documents spinal surgery for progressive scoliosis in the biallelic (mEDS Recessive) cohort.
- name: Respiratory Support (Noninvasive to Invasive Mechanical Ventilation)
  description: >
    Escalating respiratory support ranging from noninvasive ventilation to
    tracheostomy and ventilator dependency, reflecting the variable severity
    of respiratory muscle involvement across the mEDS spectrum.
  treatment_term:
    preferred_term: Mechanical Ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Proximal and Axial Muscle Weakness
    treatment_effect: MODULATES
    description: >
      Supports ventilation when respiratory muscle weakness becomes severe
      enough to compromise breathing; it does not correct the underlying
      muscle force-transmission defect.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory involvement was variable, ranging from none to tracheostomy and ventilatory dependency since birth (F6P7)."
    explanation: Documents the range of respiratory support required in the biallelic (mEDS Recessive) cohort, from none to lifelong ventilator dependency.
  - reference: PMID:40508193
    reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three out of 10 UCMD2 patients began non-invasive ventilation (NIV) before the age of 3"
    explanation: Documents early noninvasive ventilation initiation in a subset of UCMD2 (mEDS Recessive) patients, drawn from a systematic literature review.
- name: Nutritional Support (Nasogastric or Gastrostomy Feeding)
  description: >
    Enteral feeding support for neonatal feeding difficulties arising from
    congenital hypotonia and weakness, common in the severe mEDS Recessive
    phenotype.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Congenital Hypotonia
    treatment_effect: MODULATES
    description: >
      Provides enteral nutrition when hypotonia-related feeding difficulty
      makes oral intake unsafe or insufficient; it does not correct the
      underlying hypotonia itself.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal feeding difficulties were present in seven, requiring a nasogastric or gastrostomy tube placement."
    explanation: Documents enteral feeding support for neonatal feeding difficulty in the biallelic (mEDS Recessive) cohort.
- name: Genetic Counseling
  description: >
    Genetic counseling regarding the dominant (typically de novo) or
    recessive (biallelic) inheritance pattern, recurrence risk, and
    availability of carrier and prenatal/preimplantation testing.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24334604
    reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a de novo dominant mutation in collagen XII (COL12A1) as underlying a novel overlap syndrome involving muscle and connective tissue"
    explanation: Documents the typically de novo dominant inheritance relevant to counseling for mEDS Dominant.
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Next-generation-based sequencing identified rare biallelic COL12A1 (NM_004370.6) variants in all eight patients."
    explanation: Documents the biallelic recessive inheritance relevant to counseling for mEDS Recessive, including carrier-testing implications for relatives.

genetic:
- name: COL12A1
  gene_term:
    preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    COL12A1 encodes collagen XII, a homotrimeric FACIT collagen that bridges
    collagen I-containing fibrils with extracellular matrix proteins
    including decorin and tenascin-X. Dominant variants (missense, in-frame
    exon-skipping) produce a milder phenotype; biallelic loss-of-function
    variants produce a more severe phenotype.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COLXII is a homotrimer assembled from three COLXII alpha chains encoded by COL12A1. It is essential for collagen fibril organization by bridging Collagen I-containing fibrils bound at the collagenous domain with various extracellular matrix (ECM) proteins including tenascin-X."
    explanation: Describes the normal molecular function of collagen XII.
  - reference: PMID:24334604
    reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a homozygous recessive loss of function mutation and a de novo dominant mutation in collagen XII (COL12A1) as underlying a novel overlap syndrome involving muscle and connective tissue."
    explanation: Founding human genetics report establishing both autosomal recessive and autosomal dominant pathogenic COL12A1 variants.
  variants:
  - name: c.8415+1G>A (exon 56 skipping)
    description: >-
      Heterozygous canonical donor splice-site variant on NM_004370.6 causing
      in-frame skipping of exon 56 within the COL2 domain, resulting in
      disorganized extracellular collagen XII and collagen I fibrils.
    evidence:
    - reference: PMID:40508193
      reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In family A, whole-exome sequencing (WES) data revealed the presence of the splicing variant, reported in ClinVar thanks to Solved-RD collaboration (VCV003256738.1), NM_004370.6: c.8415+1G>A in COL12A1 gene, in both affected siblings."
      explanation: Documents heterozygous COL12A1 c.8415+1G>A in two affected siblings with mEDS.
  - name: c.8319+1G>T (exon 55 skipping)
    description: >-
      Heterozygous canonical donor splice-site variant on NM_004370.6 causing
      in-frame skipping of exon 55 in the COL2 domain of collagen XII.
    evidence:
    - reference: PMID:40508193
      reference_title: "Myopathic Ehlers-Danlos Syndrome (mEDS) Related to COL12A1: Two Novel Families and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In family B, sequencing data performed on the affected proband revealed the presence of the splicing variant, NM_004370.6:c.8319+1G>T in the COL12A1 gene."
      explanation: Documents pathogenic heterozygous COL12A1 c.8319+1G>T causing exon 55 skipping in mEDS.
  - name: c.8178+3A>C (exon 53 skipping)
    description: >-
      Heterozygous donor splice-region variant causing in-frame skipping of
      exon 53 in the thrombospondin N-terminal (TSPN) domain with intracellular
      retention of mutant collagen XII chains and reduced extracellular decorin
      and tenascin-X.
    evidence:
    - reference: PMID:31273343
      reference_title: "Novel defects in collagen XII and VI expand the mixed myopathy/Ehlers-Danlos syndrome spectrum and lead to variant-specific alterations in the extracellular matrix."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In PIII:1, a COL12A1 c.8178+3A>C variant was found, causing in-frame skipping of exon 53 ( Δ53). Segregation analysis revealed that the variant segregated in her father and her sister, who showed a much milder phenotype."
      explanation: Documents autosomal dominant segregation of COL12A1 c.8178+3A>C with variable expressivity.

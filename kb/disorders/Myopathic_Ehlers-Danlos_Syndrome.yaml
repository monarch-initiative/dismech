name: Myopathic Ehlers-Danlos Syndrome
category: Mendelian
creation_date: "2026-09-16T17:43:16Z"
description: >
  Myopathic Ehlers-Danlos syndrome (mEDS) is a connective-tissue/muscle
  overlap disorder caused by heterozygous (dominant) or biallelic
  (recessive) pathogenic variants in COL12A1, which encodes collagen XII, a
  fibril-associated collagen with interrupted triple helices (FACIT) that
  bridges collagen I-containing fibrils with other extracellular matrix
  components, including decorin and tenascin-X. The disorder spans a
  clinical spectrum: the milder, typically dominant end (historically termed
  Bethlem myopathy 2, an exact synonym of mEDS) presents with congenital
  hypotonia, proximal joint contractures, distal joint hypermobility, and
  progressive proximal and axial muscle weakness; the more severe, typically
  recessive end (Ullrich congenital muscular dystrophy 2) presents at birth
  with profound weakness, arthrogryposis, and respiratory insufficiency.
  Reduced or structurally abnormal collagen XII secondarily depletes
  extracellular decorin and tenascin-X, the same two matrix proteins whose
  primary loss drives classical-like EDS (TNXB) -- a mechanistic parallel
  between the two disorders' convergent effects on the matrix, not a
  structural link between the two dismech entries themselves.
disease_term:
  preferred_term: Myopathic Ehlers-Danlos Syndrome
  term:
    id: MONDO:0034022
    label: Bethlem myopathy 2
synonyms:
- mEDS
- EDS, myopathic type
- Ehlers-Danlos syndrome, myopathic type
- Bethlem myopathy 2
- Collagen XII-related myopathic EDS
notes: >
  No GeneReviews chapter exists for myopathic EDS, COL12A1, Bethlem myopathy,
  or Ullrich congenital muscular dystrophy (searched PubMed genereviews[book]
  for each term; no hits). The disease_term is anchored on MONDO:0034022
  ("Bethlem myopathy 2"), whose exact synonyms include "EDS, myopathic type",
  "Ehlers-Danlos syndrome, myopathic type", and "myopathic EDS" -- MONDO does
  not carry a separate, EDS-labeled top-level term for this disease. The
  severe/recessive end of the same COL12A1 clinical spectrum is separately
  termed MONDO:0014654 ("Ullrich congenital muscular dystrophy 2") and is
  modeled here as a subtype rather than a distinct disease, consistent with
  how the primary literature describes a single genotype-correlated severity
  spectrum rather than two discrete conditions. kb/disorders/Ullrich_Congenital_Muscular_Dystrophy.yaml
  already has_subtypes a thin "UCMD2" entry anchored on the same MONDO:0014654,
  citing the same PMID:24334604 founding paper; that entry frames the disease
  through neuromuscular-disease classification (COL6A1/2/3 as the primary
  cause, COL12A1 as a rare phenocopy subtype), while this entry frames the
  same COL12A1 gene-disease relationship through the 2017 international EDS
  classification (mEDS as one of the 13 named EDS subtypes). Both are
  legitimate framings of the same underlying biology rather than an
  unintentional duplication; this entry is the more detailed, EDS-focused
  curation for COL12A1 specifically, spanning both the dominant and
  recessive ends of its spectrum.

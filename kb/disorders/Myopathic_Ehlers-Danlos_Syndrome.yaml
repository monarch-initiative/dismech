      label: COL12A1
  description: >
    Caused by heterozygous, often de novo, missense or in-frame exon-skipping
    COL12A1 variants. The milder, more common end of the spectrum, presenting
    with joint hypermobility, congenital hypotonia, and proximal/axial muscle
    weakness that is typically non-progressive or slowly progressive.
  evidence:
  - reference: PMID:24334604
    reference_title: "Recessive and dominant mutations in COL12A1 cause a novel EDS/myopathy overlap syndrome in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient with the de novo missense mutation was more mildly affected, showing improvement including the acquisition of walking"
    explanation: Founding paper describes the milder dominant phenotype associated with a de novo heterozygous COL12A1 variant.
- name: mEDS Recessive
  display_name: mEDS (recessive, Ullrich congenital muscular dystrophy 2 spectrum)
  subtype_term:
    preferred_term: Ullrich congenital muscular dystrophy 2
    term:
      id: MONDO:0014654
      label: Ullrich congenital muscular dystrophy 2
  genes:
  - preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  description: >
    Caused by biallelic (homozygous or compound heterozygous) loss-of-function
    COL12A1 variants. The more severe end of the spectrum, presenting at birth
    with profound weakness, arthrogryposis, and respiratory/feeding
    difficulties.
  evidence:
  - reference: PMID:39923201
    reference_title: "Clinical characterization of Collagen XII-related disease caused by biallelic COL12A1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "further establishing COL12A1 as a recessive myopathic Ehlers-Danlos syndrome (mEDS) gene, and expanding the clinical spectrum to include a milder EDS phenotype"
    explanation: Establishes biallelic COL12A1 variants as causing the recessive, more severe end of the mEDS spectrum.

- name: Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
  biological_scale: TISSUE
  description: >-
    Cardiomyocytes have an extremely high and continuous ATP requirement, so they
    are the tissue most sensitive to a combined respiratory chain defect;
    infantile hypertrophic cardiomyopathy is a key clinical feature across many
    mitochondrial disorders and is the presenting feature of MTO1 deficiency in
    almost half of patients. In the Mto1 gene-trap mouse the myocardial damage
    was attributed specifically to complex I deficiency and mitochondrial
    dysfunction, and in the mto1 knock-out zebrafish the ablation produced heart
    developmental defects, cardiomyocyte hypertrophy and myocardial fibre
    disarray in the ventricles, recapitulating the human histological picture.
  mechanism_confidence: ESTABLISHED

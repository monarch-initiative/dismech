synonyms:
- COXPD10
- combined oxidative phosphorylation deficiency 10
- combined oxidative phosphorylation defect type 10
- MTO1 combined oxidative phosphorylation deficiency
- mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1 deficiency
- ONCE syndrome
notes: >-
  No GeneReviews chapter exists for MTO1 deficiency. A PubMed search for
  "MTO1 GeneReviews" on 2026-08-01 returned a single record, the "Nuclear
  Gene-Encoded Leigh Syndrome Spectrum Overview" (PMID:26425749), whose cached
  abstract does not mention MTO1; the usual GeneReviews phenotype baseline is
  therefore unavailable. In its place this entry is anchored on the largest
  published cohort, O'Byrne et al. 2018 (PMID:29331171, 35 molecularly confirmed
  patients collected through international collaboration), which supplies
  explicit numerators and denominators for every phenotype frequency asserted
  below. Frequencies are quoted directly from that series and carry the caveat
  the authors themselves record: ascertainment was biased by preselection on
  lactic acidosis and cardiomyopathy, denominators vary between features because
  the source literature was incomplete, and later-onset features may be
  under-reported in patients with short follow-up.

  Naming: this entry is filed under the gene-based clinical name "MTO1
  deficiency" used by the cohort literature rather than the longer MONDO label,
  because the MONDO label ("mitochondrial hypertrophic cardiomyopathy with
  lactic acidosis") describes a presentation the cohort showed is not obligatory.
  "ONCE syndrome" (Optic Neuropathy, Cardiomyopathy and Encephalopathy) is a
  synonym coined for the homozygous p.Arg504Cys presentation and is listed as a
  synonym rather than a separate subtype.

  Deliberately excluded to avoid Named Entity Confusion: MTO1 deficiency is
  mechanistically adjacent to, but distinct from, GTPBP3 deficiency (COXPD23,
  the partner subunit of the same tau-m5U enzyme), TRMU deficiency (the
  2-thiouridylase acting on the same wobble uridine), MRPL44 deficiency
  (COXPD16, a mitoribosome defect with the same
  infantile-HCM-plus-lactic-acidosis presentation) and SLC25A3
  cardiomyopathy-hypotonia-lactic acidosis
  syndrome (a phosphate-carrier defect with an overlapping clinical triad that is
  curated separately in this knowledge base). Literature on those disorders is
  cited here only where it reports MTO1 data directly. Identity was verified
  before curation against MONDO:0013865 (gene MTO1/HGNC:19261, OMIM:614702,
  Orphanet:314637); note that OMIM 614667 is the MTO1 *gene* record, not the
  disease record, an ambiguity that recurs in the literature.

  A claim appearing in the deep-research report - that complete Mto1 knockout in
  mouse reduces mitochondrial translation by more than 80% and causes embryonic
  death around E8 - was NOT included because it could not be verified against
  the abstract of the cited review (DOI:10.1093/jb/mvaa098), which does not
  mention MTO1 or embryonic lethality. The related and verifiable human
  inference (no patient carries two truncating alleles, so complete loss is
  probably non-viable) is curated instead.

  Death in infancy/childhood is curated under `progression` rather than as a
  `phenotypes` entry because the relevant HPO terms sit in the Mortality/Aging
  branch, outside the Phenotypic abnormality subtree the PhenotypeTerm dynamic
  enum draws from.

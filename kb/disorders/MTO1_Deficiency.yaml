- name: Cardiac Conduction Instability
  biological_scale: ORGANISM
  description: >-
    Beyond structural hypertrophy, MTO1 deficiency destabilises cardiac rhythm.
    The MTO1-deficient mouse showed bradycardia alongside cardiomyopathy and, of
    direct translational relevance, a marked worsening of arrhythmias during
    induction of and recovery from anaesthesia - prompting the authors to caution
    against anaesthesia-related arrhythmia in patients. In humans, two patients
    in the reference cohort had Wolff-Parkinson-White pre-excitation, one had
    tachycardia, and the two index siblings of the original 2012 report died in
    the first days of life of sudden bradycardia. The peri-anaesthetic risk
    itself is supported only by mouse data and is therefore curated as
    PROVISIONAL with an accompanying HUMAN_MODEL_MISMATCH discussion.

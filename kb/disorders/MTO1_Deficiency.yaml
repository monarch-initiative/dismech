- name: Neuronal and Retinal Ganglion Cell Energy Failure
  biological_scale: CELLULAR
  description: >-
    Neurons and retinal ganglion cells, like cardiomyocytes, are
    high-oxidative-demand, poorly regenerating cell types, and they constitute
    the second major target of the translation defect. Clinically this produces
    the near-universal global developmental delay/intellectual disability, plus
    hypotonia, seizures, ataxia and optic atrophy; imaging shows basal ganglia,
    cerebellar peduncle and corpus callosum abnormalities in most patients
    scanned. Optic neuropathy is prominent enough in some families that the
    acronym ONCE (Optic Neuropathy, Cardiomyopathy and Encephalopathy with lactic
    acidosis and combined oxidative phosphorylation deficiency) was coined for
    the homozygous p.Arg504Cys presentation.
  mechanism_confidence: ESTABLISHED

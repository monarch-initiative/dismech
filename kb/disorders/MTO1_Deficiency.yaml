mechanistic_hypotheses:
- hypothesis_group_id: mto1_residual_function_dose
  hypothesis_label: Residual MTO1 activity determines survival and severity
  status: EMERGING
  description: >-
    The observation that no patient in 35 carries two truncating alleles, and
    that the four patients compound heterozygous for p.Ala428Thr plus a
    frameshift had the earliest presentation (mean 0.04 years) and shortest
    survival (mean 0.24 years), suggests a dose-response relationship in which
    residual MTO1 enzymatic activity sets both viability and severity. The
    hypothesis is consistent with the observation that patients homozygous for
    p.Thr411Ile tend to be more severe while those homozygous for p.Arg464Cys
    survive longer, but it is confounded by the wide phenotypic variability among
    patients sharing an identical genotype, which implies substantial
    modification by other factors.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed that the four patients from three unrelated families who are compound heterozygous for the p.(Ala428Thr) variant and a frameshift variant appear to have more severe presentation: earlier than average age of presentation of clinical features at 0.04 years and shorter than average survival time at 0.24 years, further supporting the hypothesis that residual MTO1 protein function is needed for survival."
    explanation: The primary observation motivating the residual-activity dose hypothesis.
  - reference: PMID:23929671
    reference_title: "MTO1 mutations are associated with hypertrophic cardiomyopathy and lactic acidosis and cause respiratory chain deficiency in humans and yeast."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The severity of the yeast respiratory phenotypes partly correlated with the different clinical presentations observed in MTO1 mutant patients, although the clinical outcome was highly variable in patients with the same mutation"
    explanation: >-
      Yeast allele severity partly tracks clinical severity, supporting the
      hypothesis, but the same sentence records the variability among identical
      genotypes that limits it.
discussions:
- discussion_id: mismatch_anaesthesia_arrhythmia_mouse_only
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the anaesthesia-provoked arrhythmia worsening seen in Mto1-deficient
    mice occur in patients with MTO1 deficiency, and should it change
    peri-operative management?
  attaches_to:
  - pathophysiology#Cardiac Conduction Instability
  rationale: >-
    The Mto1 gene-trap mouse showed a marked worsening of arrhythmias during
    induction of and reversal from anaesthesia, and the authors explicitly framed
    this as a potentially fatal translational risk. No human case series has
    assessed peri-anaesthetic arrhythmia risk in MTO1 deficiency. Human
    conduction abnormalities are documented (two patients with
    Wolff-Parkinson-White, one with tachycardia, and two index siblings who died
    of sudden bradycardia), so a shared susceptibility is plausible, but the
    specific anaesthetic trigger is unverified in humans. The mismatch matters
    because these patients frequently undergo anaesthesia for muscle biopsy,
    gastrostomy and cardiac procedures.
  proposed_experiments:
  - experiment_id: mto1_perianaesthetic_audit
    name: Retrospective multicentre peri-anaesthetic arrhythmia audit
    description: >-
      Retrospective multicentre audit of peri-anaesthetic ECG and haemodynamic
      events in molecularly confirmed MTO1-deficient patients undergoing general
      anaesthesia, compared with age-matched mitochondrial disease controls.
  - experiment_id: mto1_prospective_holter
    name: Prospective peri-anaesthetic Holter monitoring
    description: >-
      Prospective Holter monitoring around planned anaesthesia in a registry
      cohort, to quantify arrhythmia burden before, during and after induction
      and emergence.
  evidence:
  - reference: PMID:25506927
    reference_title: "MTO1-deficient mouse model mirrors the human phenotype showing complex I defect and cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A translational consequence of this mouse model may be to caution against anaesthesia-related cardiac arrhythmias which may be fatal in patients."
    explanation: The mouse observation whose human validity is the open question.
- discussion_id: mismatch_neurological_phenotype_absent_in_mouse
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the neurological phenotype nearly universal in patients but largely
    absent in the Mto1-deficient mouse?
  attaches_to:
  - pathophysiology#Neuronal and Retinal Ganglion Cell Energy Failure
  rationale: >-
    Global developmental delay or intellectual disability affects 97% of
    MTO1-deficient patients, and structural brain abnormalities are seen in 70%
    of those imaged. Yet neurological examination was largely normal in the
    Mto1-deficient mouse, whose phenotype was dominated by cardiovascular
    disease. The discrepancy limits the mouse as a preclinical model for the
    neurological arm of the disease - which is the arm most in need of therapy in
    long-term survivors - and raises the question of whether it reflects the
    hypomorphic nature of the gene-trap allele, species differences in neuronal
    dependence on tau-m5U-modified tRNAs, or the shorter murine lifespan.
  proposed_experiments:
  - experiment_id: mto1_aged_mouse_neurophenotyping
    name: Deep neurobehavioural phenotyping of aged and allelic-series Mto1 mice
    description: >-
      Deep neurobehavioural and neuropathological phenotyping of aged
      Mto1-deficient mice, and of allelic series recapitulating the severe human
      genotypes (e.g. missense plus null), to test whether a neurological
      phenotype emerges at lower residual activity or later ages.
  - experiment_id: mto1_cross_species_taum5u_occupancy
    name: Cross-species tissue survey of tau-m5U occupancy
    description: >-
      Quantify tau-m5U occupancy tissue-by-tissue in mouse versus human brain,
      heart and muscle to test whether the neuronal requirement for the
      modification differs between species.
  evidence:
  - reference: PMID:25506927
    reference_title: "MTO1-deficient mouse model mirrors the human phenotype showing complex I defect and cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, neurological examination was largely normal in Mto1-deficient mice."
    explanation: Documents the absence of the neurological phenotype in the mouse model.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "global developmental delay/intellectual disability present in 28/29 (97%)"
    explanation: Documents the near-universal human neurological phenotype that the mouse fails to reproduce.
- discussion_id: gap_genotype_phenotype_variability_modifiers
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines the marked phenotypic variability between patients carrying
    identical MTO1 genotypes, including within families?
  attaches_to:
  - pathophysiology#Loss of MTO1 Wobble Uridine Taurinomethylation of Mitochondrial tRNAs
  rationale: >-
    Patients homozygous for the same MTO1 allele range from neonatal death to
    survival into the third decade with normal scholastic performance, and
    cardiomyopathy - the eponymous feature - is absent in a sixth of patients.
    Candidate modifiers include mtDNA haplogroup or co-occurring mt-tRNA variants
    (one family carried a homoplasmic MT-TF m.593T>G variant proposed to act
    synergistically), taurine availability (taurine is a substrate for the MTO1
    reaction and taurine starvation reduces tau-m5U frequency in cultured cells
    and animal tissues), and timing of metabolic treatment. None has been tested
    systematically. Resolving this is a prerequisite for prognostic counselling
    and for interpreting any future trial.
  proposed_experiments:
  - experiment_id: mto1_registry_mtdna_background
    name: Genotype-stratified registry with mtDNA background analysis
    description: >-
      Genotype-stratified natural history registry with mtDNA haplogroup and
      full mtDNA sequencing, to test whether mitochondrial background predicts
      severity among patients sharing a nuclear MTO1 genotype.
  - experiment_id: mto1_taurine_modifier_test
    name: Taurine availability as a modifier of tau-m5U occupancy
    description: >-
      Measure plasma and tissue taurine and tau-m5U occupancy in patient-derived
      cells across the severity spectrum, and test whether taurine
      supplementation increases tau-m5U occupancy and mitochondrial translation
      in hypomorphic MTO1 patient cells.
  evidence:
  - reference: PMID:34990597
    reference_title: "Clinical and genetic analysis of combined oxidative phosphorylation defificiency-10 caused by MTO1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, patients with the same genetic mutation may not have the same clinical presentation. Additional MTO1 defificiency cases will help to make genotype-phenotype correlations clearer."
    explanation: States the unexplained genotype-phenotype discordance that defines this gap.
  - reference: PMID:29390138
    reference_title: "Metabolic and chemical regulation of tRNA modification associated with taurine deficiency and human disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taurine starvation resulted in downregulation of τm5U frequency in cultured cells and animal tissues (cat liver and flatfish)."
    explanation: >-
      Establishes taurine availability as a modifiable determinant of tau-m5U
      occupancy, making it a concrete candidate modifier worth testing in
      patients.

      label: fibroblast
  evidence:
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using fibroblasts from an MTO1 patient and MTO1 silenced cells, we found that the MTO1 deficiency is associated with a metabolic reprogramming mediated by inactivation of AMPK, down regulation of the uncoupling protein 2 (UCP2) and transcription factor PPARγ, and activation of the hypoxia inducible factor 1 (HIF-1)."
    explanation: Defines the direction of each arm of the reprogramming axis in MTO1-deficient cells.
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT

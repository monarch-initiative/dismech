- name: Metabolic Reprogramming via the HIF-PPARgamma-UCP2-AMPK Axis
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts and MTO1-silenced cells show a specific compensatory
    reprogramming: AMPK is inactivated, UCP2 and PPARgamma are downregulated, and
    HIF-1 is activated. Glycolysis and oxidative phosphorylation become uncoupled
    and fatty-acid metabolism is altered, with accumulation of lipid droplets in
    MTO1 fibroblasts. Notably this response is the mirror image of that seen in
    GTPBP3-depleted cells - which activate AMPK, raise UCP2/PPARgamma and
    inactivate HIF-1 - even though the two proteins act on the same modification,
    suggesting one of them has an additional, non-tRNA-modifying role. This node
    is curated as PROVISIONAL because it rests on fibroblast and knockdown data
    from a single group and has not been demonstrated in patient heart or muscle.
  mechanism_confidence: PROVISIONAL
  cell_types:

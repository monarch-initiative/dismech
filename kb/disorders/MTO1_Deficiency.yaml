name: MTO1 Deficiency
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
description: >-
  MTO1 deficiency (combined oxidative phosphorylation deficiency 10, COXPD10;
  mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1
  deficiency) is a rare autosomal recessive mitochondrial disease caused by
  biallelic pathogenic variants in MTO1, a nuclear gene encoding the
  mitochondrial tRNA translation optimization 1 protein. Together with its
  partner GTPBP3, MTO1 installs 5-taurinomethyluridine (tau-m5U) at the wobble
  (anticodon first) position of five mitochondrial tRNAs - those for Gln, Glu,
  Lys, Leu(UUR) and Trp - using taurine and 5,10-methylene-tetrahydrofolate as
  metabolic substrates. The modification is required for accurate and efficient
  codon-anticodon pairing during mitochondrial translation, so its loss
  attenuates synthesis of the 13 mtDNA-encoded respiratory chain subunits and
  produces a combined respiratory chain defect, most commonly a combined complex
  I and complex IV deficiency in skeletal muscle. Because the affected tissues
  are those with the highest oxidative demand, the cardinal presentation is
  early-onset hypertrophic cardiomyopathy with lactic acidosis, but the
  phenotype is broader than the disease name implies: global developmental
  delay/intellectual disability is nearly universal, and hypotonia, feeding
  difficulties, failure to thrive, seizures, optic atrophy and ataxia are all
  common. The largest published series (35 molecularly confirmed patients)
  established that cardiomyopathy is not obligatory - several patients reached
  adolescence or adulthood without it - and that no patient carries two
  truncating alleles, implying that complete loss of MTO1 is not viable in
  humans. Outcome ranges from neonatal death to survival into the third decade;
  no evidence-based disease-modifying therapy exists.
disease_term:
  preferred_term: MTO1 deficiency
  term:
    id: MONDO:0013865
    label: mitochondrial hypertrophic cardiomyopathy with lactic acidosis due to MTO1 deficiency
parents:

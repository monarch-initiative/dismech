  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  mechanistic_category:
  - classification_value: mitochondrial disease
  icimd_category:
  - classification_value: mtdna_transcript_processing_and_modification
    notes: >-
      MTO1 is a nuclear-encoded enzyme that post-transcriptionally modifies
      mtDNA-encoded tRNAs (tau-m5U at the wobble uridine), so the disorder
      belongs to ICIMD category 10 "Disorders of mitochondrial gene expression",
      subgroup mtDNA transcript processing and modification - not to a
      respiratory-chain subunit, assembly-factor, or mitoribosome category, even
      though the measured biochemical consequence is a combined respiratory
      chain deficiency. In the recent literature this class of disease is termed
      a mitochondrial RNA "modopathy".
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) pathogenic
    MTO1 variants. In the 35-patient cohort, 17 patients were homozygous and 18
    compound heterozygous; carrier parents were unaffected and 12/35 patients
    were the offspring of consanguineous unions. Notably no patient carried two
    truncating alleles, indicating that residual MTO1 function is required for
    viability.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed segregation with disease according to the recessive inheritance model, with carrier status in each parent."
    explanation: Segregation analysis in the index family confirms autosomal recessive inheritance with unaffected heterozygous parents.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 35 patients, 17 are homozygous and 13 compound heterozygous for missense variants, four are compound heterozygous for a missense and a frameshift variant and one is compound heterozygous for a missense and a predicted splice-site variant"
    explanation: Documents the biallelic genotype in every patient of the largest published series.
  - reference: PMID:22608499
    reference_title: "Mutations of the mitochondrial-tRNA modifier MTO1 cause hypertrophic cardiomyopathy and lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third unrelated individual was homozygous for the latter change."
    explanation: Homozygosity in an unrelated patient, alongside biparental transmission of two different alleles in the index siblings, establishes recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists and Orphanet records none for
    ORPHA:314637. The disorder was first described in 2012; the largest
    systematic review assembled 35 molecularly confirmed patients from 26
    unrelated families in 11 countries, and a later review counted 42 published
    cases. The only defensible occurrence statement is therefore a literature
    case count in the ultra-rare band. Cases have been reported from Austria,
    Canada, Croatia, Germany, India, Italy, Pakistan, Spain, Syria, Turkey and
    the United Kingdom, plus subsequent Chinese reports, so the condition is
    probably pan-ethnic rather than founder-restricted.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An overview of clinical features of the 35 patients (17 males and 18 females) from 11 different countries (Austria, Canada, Croatia, Germany, India, Italy, Pakistan, Turkey, Spain, Syria and the United Kingdom) is presented in Table 1."
    explanation: Establishes the total published case count and the pan-ethnic geographic distribution underpinning the ultra-rare classification.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date cases have been reported in 11 different countries suggesting that MTO1 deficiency is probably a pan-ethnic condition"
    explanation: Explicit statement that the disorder is pan-ethnic rather than confined to a founder population.
  - reference: PMID:34990597
    reference_title: "Clinical and genetic analysis of combined oxidative phosphorylation defificiency-10 caused by MTO1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we presented the detailed clinical features and genetic analysis of the patient with two variants in MTO1, and reviewed 42 different cases available in publications"
    explanation: A later review counted 42 published cases, confirming the literature remains in the low tens of patients.
progression:
- phase: Neonatal presentation
  age_range: first two days of life
  notes: >-
    Nearly half of all patients present in the first 48 hours of life, typically
    with lactic acidosis, respiratory distress/tachypnoea and hypertrophic
    cardiomyopathy. This is the severe end of the spectrum and carries the worst
    prognosis.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "15/34 (44%) presented in the first 2 days of life. The average age of presentation was 10.2 months (range: day 1 to 8.0 years)."
    explanation: Quantifies the neonatal-onset fraction and the overall age-of-presentation range.
- phase: Infantile and childhood course
  age_range: infancy to childhood
  notes: >-
    Patients surviving the neonatal period accumulate neurological features -
    global developmental delay, hypotonia, seizures, ataxia - alongside the
    cardiac and metabolic disease. Optic atrophy typically emerges later than the
    cardiac and metabolic features. Cardiomyopathy that is absent at presentation
    may develop over time (present in 44% at presentation but 79% eventually),
    so serial echocardiography is warranted even in patients with an initially
    normal heart.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An extensive review of all known MTO1 deficiency cases revealed the most common features at presentation to be lactic acidosis (LA) (21/34; 62% cases) and hypertrophic cardiomyopathy (15/34; 44% cases). Eventually lactic acidosis and hypertrophic cardiomyopathy are described in 35/35 (100%) and 27/34 (79%) of patients with MTO1 deficiency, respectively"
    explanation: Documents that cardiomyopathy is progressive - rising from 44% at presentation to 79% at follow-up - which is the basis for recommending serial cardiac surveillance.
- phase: Mortality
  age_range: week 1 to 23 years
  notes: >-
    About a third of reported patients had died at the time of the cohort
    review, at an average age of 2.67 years. Earlier presentation predicts worse
    survival: of those presenting in the first two days of life, roughly half
    died before age 2. Deaths were skewed toward males (8/17 males versus 4/18
    females), an observation the cohort authors could not explain biologically
    and attributed to possible small-cohort artefact. Death in infancy/childhood
    is recorded here rather than as a phenotype because the corresponding HPO
    terms sit outside the Phenotypic abnormality subtree.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of writing 12/35 (34%) patients were deceased with an average age of death of 2.67 years (range: week 1 to 23 years)."
    explanation: Quantifies mortality and its age distribution across the cohort.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of those presenting clinically in the first 2 days of life, 7 patients (47%) passed away before the age of 2 years, suggesting a relationship between earlier presentation and a poorer prognosis."
    explanation: Establishes early presentation as a prognostic marker for early death.
- phase: Long-term survival
  age_range: adolescence to adulthood
  notes: >-
    A substantial minority survive into adolescence and adulthood, in some cases
    with normal scholastic performance. Two adolescent sisters described in
    detail in the cohort report had never developed cardiomyopathy by ages 12 and
    16, and one patient treated from infancy with dichloroacetate and cofactors
    was alive at 20 years with compensated, stable hypertrophic cardiomyopathy.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A further four cases of MTO1 deficiency without cardiomyopathy at ages 0.66 to 22 years, one published and three unpublished, were identified in our review."
    explanation: Documents long-term survivors who never developed the cardinal cardiac feature.
  - reference: PMID:23929671
    reference_title: "MTO1 mutations are associated with hypertrophic cardiomyopathy and lactic acidosis and cause respiratory chain deficiency in humans and yeast."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he dramatically improved on a permanent treatment with dichloroacetate (DCA) and cofactors, being now 20 years old with compensated, stable hypertrophic cardiomyopathy."
    explanation: Documents survival to adulthood with compensated cardiomyopathy in a treated patient.
pathophysiology:
- name: Loss of MTO1 Wobble Uridine Taurinomethylation of Mitochondrial tRNAs
  biological_scale: MOLECULAR
  description: >-
    MTO1 and its GTPase partner GTPBP3 jointly catalyse installation of
    5-taurinomethyluridine (tau-m5U) at the anticodon first (wobble) position,
    U34, of five mitochondrially encoded tRNAs: those for glutamine, glutamate,
    lysine, leucine(UUR) and tryptophan. The reaction consumes taurine and
    5,10-methylene-tetrahydrofolate as substrates; older literature describes the
    homologous bacterial/yeast product as 5-carboxymethylaminomethyluridine
    (cmnm5U), the glycine-substituted counterpart that appears in human cells
    when taurine is depleted. Biallelic MTO1 missense or truncating variants
    reduce or abolish the enzyme's modifying activity. No reported patient
    carries two truncating alleles, indicating that some residual MTO1 activity
    is required for human viability; this is the molecular origin of the whole
    disease cascade.

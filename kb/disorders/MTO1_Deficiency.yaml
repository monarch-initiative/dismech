biochemical:
- name: Plasma lactate
  presence: INCREASED
  context: >-
    The principal screening marker. Eventually elevated in every patient tested
    (35/35), with an average peak of 13.6 mmol/L and a maximum of 57.8 mmol/L.
    Persistence of hyperlactataemia despite clinical improvement is common, so
    lactate is a poor surrogate for treatment response.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average recorded peak level of plasma lactate of 13.6 mmol/L (range 3.4 to 57.8 mmol/L)."
    explanation: Quantifies the magnitude and range of the lactate elevation across the cohort.
- name: Plasma alanine
  presence: INCREASED
  context: >-
    Raised in 21/24 (88%) of patients tested, averaging 1346 micromol/L. Alanine
    accumulates by transamination of the pyruvate that cannot be oxidised, and
    is a more time-averaged marker of mitochondrial dysfunction than lactate.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An elevated plasma alanine was documented in 21/24"
    explanation: Quantifies the frequency of hyperalaninemia across the cohort.
- name: CSF lactate
  presence: INCREASED
  context: >-
    Elevated in 5/6 patients in whom lumbar puncture was performed, reflecting
    the CNS component of the energy deficit. The denominator is very small.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF lactate was elevated in 5/6 cases"
    explanation: Documents CSF lactate elevation, with the caveat of a six-patient denominator.
- name: Urinary mitochondrial markers
  presence: INCREASED
  context: >-
    Every patient whose urine organic acid profile was analysed (14/14) showed
    some combination of elevated lactate, ketones, TCA-cycle intermediates,
    tyrosine metabolites, dicarboxylic acids and 3-methylglutaconate. The pattern
    is non-specific but is a sensitive screening abnormality.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markers of mitochondrial dysfunction, including lactate, ketones, TCA (Krebs cycle) metabolites, tyrosine metabolites, dicarboxylic acids and 3-methylglutaconate, were eventually present in the urinary organic acid profile in various patterns in every patient analyzed"
    explanation: Documents the universal but non-specific urinary organic acid abnormalities.
- name: Respiratory chain enzyme activities in skeletal muscle
  presence: DECREASED
  context: >-
    The key confirmatory functional assay. Complex IV was deficient in 28/30
    muscle biopsies and 27/30 showed a combined deficiency, most often complex I
    plus IV (20/30) or complex I plus III plus IV (6/30). Muscle is the
    diagnostic tissue of choice: fibroblast respiratory chain analysis was normal
    in 4/10 patients, so a normal fibroblast result does not exclude the
    diagnosis.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the combined deficiencies, complex I and IV deficiency were most commonly seen (20/30 cases) while combined complex I, III and IV deficiency, was present in 6/30 cases."
    explanation: Quantifies the specific combined respiratory chain patterns observed in patient muscle.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly the high number of normal results in fibroblasts indicates that normal RCE analysis in this cell type do not exclude the possibility of a MTO1 defect."
    explanation: Establishes muscle rather than fibroblasts as the appropriate diagnostic tissue.
genetic:
- name: MTO1
  notes: >-
    MTO1 encodes mitochondrial tRNA translation optimization 1, an
    evolutionarily conserved FAD-containing protein expressed in
    high-energy-demand tissues. Nineteen different pathogenic variants were
    identified across
    the 35-patient reference cohort - 15 missense, 3 frameshift and one
    splice-site - clustered in the FAD-binding domain, insertion domain 2, the
    GidA-specific sequence motif and the central helical domain. Recurrent
    alleles include p.Ala428Thr, p.Thr411Ile and p.Arg464Cys. Because MTO1 is
    a FAD-containing enzyme, riboflavin supplementation was tried as a rational
    therapy but did not improve respiratory chain or fibroblast oxygen
    consumption measurements. Note that transcript choice matters when comparing
    reports: the cohort re-annotated all variants to NM_012123.3 (isoform a)
    because isoforms b and c are also used in the literature.
  gene_term:
    preferred_term: MTO1
    term:
      id: hgnc:19261
      label: MTO1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:22608499
    reference_title: "Mutations of the mitochondrial-tRNA modifier MTO1 cause hypertrophic cardiomyopathy and lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we used next-generation exome sequencing to identify mutations in MTO1, which encodes mitochondrial translation optimization 1."
    explanation: Original gene discovery establishing MTO1 as the causal gene.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the 35 patients from 26 unrelated families, we identified 19 different MTO1 (NM 012123.3; NP 036255) variants (7 published and 12 unpublished): 15 missense, 3 frameshifts and one splice-site"
    explanation: Defines the allelic spectrum across the largest published cohort.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The missense variants affect the conserved amino acids located in the: FAD-binding domain (n = 1), insertion domain 2 (n = 1), GidA specific sequence motif (n = 5) and central helical domain (n = 8) of the MTO1"
    explanation: Localises the pathogenic missense variants to four functional protein domains.
  - reference: PMID:23929671
    reference_title: "MTO1 mutations are associated with hypertrophic cardiomyopathy and lactic acidosis and cause respiratory chain deficiency in humans and yeast."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Their pathogenic role was experimentally validated in a recombinant yeast model, by assessing oxidative growth, respiratory activity, mitochondrial protein synthesis, and complex IV activity."
    explanation: Functional validation of the pathogenicity of patient MTO1 alleles in a recombinant yeast system.
  - reference: PMID:27256614
    reference_title: "The homozygous R504C mutation in MTO1 gene is responsible for ONCE syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, our data confirm p.R504C as pathogenic mutation responsible of ONCE syndrome, and p.V557M as a rare polymorphic variant."
    explanation: Establishes p.Arg504Cys as the allele underlying the ONCE (optic neuropathy) presentation and reclassifies p.Val557Met as benign.
- name: MT-TF
  notes: >-
    A homoplasmic m.593T>G variant in the mitochondrially encoded tRNA-Phe gene
    MT-TF was found alongside a homozygous MTO1 variant in one family with optic
    neuropathy, non-progressive cardiomyopathy and cognitive disability. The
    authors proposed that the mitochondrial variant acts synergistically with the
    MTO1 defect to worsen the complex I deficiency and modulate the phenotype.
    This is a single-family observation and is curated as a candidate modifier,
    not as an established second locus.
  gene_term:
    preferred_term: MT-TF
    term:
      id: hgnc:7481
      label: MT-TF
  relationship_type: MODIFIER
  evidence:
  - reference: PMID:26061759
    reference_title: "Optic neuropathy, cardiomyopathy, cognitive disability in patients with a homozygous mutation in the nuclear MTO1 and a mitochondrial MT-TF variant."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The association with the mitochondrial mutation m.593T>G could act synergistically to worsen the complex I deficiency and modulate the MTO1-related disease."
    explanation: >-
      Supports the modifier hypothesis only partially - the authors state the
      synergy as a possibility ("could act") in a single family, with no
      functional demonstration of epistasis.
diagnosis:
- name: Molecular genetic testing
  description: >-
    Whole exome sequencing or a targeted mitochondrial-disease gene panel is the
    most efficient diagnostic route. The clinical and biochemical features are
    non-specific, and the majority of published cases were diagnosed by
    sequencing rather than by single-gene testing prompted by a clinical
    suspicion of MTO1 deficiency.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular confirmation is required and targeted genomic testing may be the most efficient approach."
    explanation: The cohort authors' explicit diagnostic recommendation.
  - reference: DOI:10.3390/ijms24032178
    reference_title: "Modopathies Caused by Mutations in Genes Encoding for Mitochondrial RNA Modifying Enzymes: Molecular Mechanisms and Yeast Disease Models"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of these mutations are sporadic or private, thus it is fundamental that their pathogenicity is confirmed through the use of a model system."
    explanation: >-
      Explains why molecular diagnosis in this disease class often requires
      functional confirmation - most alleles are private, so classification
      cannot rely on recurrence alone.
- name: Respiratory chain enzyme analysis in skeletal muscle
  description: >-
    A sensitive but non-specific supporting test: respiratory chain enzyme
    deficiency was present in every case tested in muscle, typically a combined
    complex I and IV defect. It should be performed on muscle rather than
    fibroblasts, since fibroblast analysis is normal in a substantial minority of
    patients. Given its invasiveness, targeted exome sequencing is now generally
    preferred as the first-line test.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory Chain Enzyme (RCE) analysis of muscle is a sensitive (though not specific) test for MTO1 deficiency with enzyme deficiencies in all cases known to date."
    explanation: Establishes the sensitivity and the specificity limitation of muscle respiratory chain enzyme analysis.
differential_diagnoses:
- name: GTPBP3 deficiency (COXPD23)
  description: >-
    GTPBP3 encodes the partner subunit of the same wobble-uridine
    taurinomethylation enzyme, and its deficiency likewise causes infantile
    hypertrophic cardiomyopathy with lactic acidosis and encephalopathy. The two
    are clinically near-indistinguishable and are separated by sequencing, though
    they differ in their cellular metabolic reprogramming response.
  evidence:
  - reference: PMID:29348686
    reference_title: "Defects in the mitochondrial-tRNA modification enzymes MTO1 and GTPBP3 promote different metabolic reprogramming through a HIF-PPARγ-UCP2-AMPK axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human proteins MTO1 and GTPBP3 are thought to jointly catalyze the modification of the wobble uridine in mitochondrial tRNAs. Defects in each protein cause infantile hypertrophic cardiomyopathy with lactic acidosis."
    explanation: States the shared enzyme and the shared clinical presentation that makes GTPBP3 deficiency the closest differential.
- name: TRMU deficiency
  description: >-
    TRMU catalyses 2-thiolation of the same wobble uridine that MTO1
    taurinomethylates, so the two disorders are mechanistically adjacent. TRMU
    deficiency is distinguished clinically by severe infantile hepatopathy or
    renal failure, neither of which is common in MTO1 deficiency.
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While TRMU mutations may result in severe infantile hepatopathy or renal failure neither hepatopathy nor renal pathology are common features in MTO1 deficiency"
    explanation: Gives the discriminating organ-involvement pattern between the two mt-tRNA modification disorders.
- name: Other nuclear mitochondrial translation defects
  description: >-
    A wider set of nuclear-gene defects in mitochondrial protein synthesis
    produce the same infantile hypertrophic-cardiomyopathy-plus-lactic-acidosis
    picture and cannot be separated clinically: mitoribosomal protein defects
    (including MRPL44/COXPD16), mitochondrial aminoacyl-tRNA synthetase defects
    (FARS2, AARS2, RARS2), the formyltransferase MTFMT, and the elongation
    factors TSFM and TUFM. Because MTO1 deficiency belongs to the same
    "modopathy"/mitochondrial-gene-expression class and its features are
    non-specific, distinction rests on sequencing rather than on phenotype.
  evidence:
  - reference: DOI:10.3390/ijms24032178
    reference_title: "Modopathies Caused by Mutations in Genes Encoding for Mitochondrial RNA Modifying Enzymes: Molecular Mechanisms and Yeast Disease Models"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In recent years, mutations in genes encoding for mt-RNAs modifying enzymes have been identified as being causative of primary mitochondrial diseases, which have been called modopathies."
    explanation: >-
      Establishes the disease class within which MTO1 deficiency sits and from
      which it must be distinguished molecularly. Tagged OTHER because the source
      is a narrative review.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The features of MTO1 deficiency are non-specific which can make accurate diagnosis difficult, often requiring exome sequencing or gene panel analysis."
    explanation: Confirms that MTO1 deficiency cannot be separated from its mimics on clinical grounds alone.
treatments:
- name: Dichloroacetate
  description: >-
    Dichloroacetate (DCA) was given to 8/25 treated patients with the intent of
    lowering lactate. One patient, homozygous for p.Ala428Thr, improved
    dramatically on permanent DCA plus cofactors and was alive at 20 years with
    compensated stable hypertrophic cardiomyopathy and normal scholastic
    performance. The cohort authors caution that DCA is expected to improve
    lactic acidosis without a clear effect on seizures or neurological outcome,
    and that the concurrent cardiac improvement in that patient may have been
    natural disease course rather than drug effect. This is uncontrolled
    single-patient evidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dichloroacetate
      term:
        id: CHEBI:28240
        label: dichloroacetate
  target_mechanisms:
  - target: Cellular Energy Deficit and Lactate Overproduction
    treatment_effect: INHIBITS
    description: >-
      DCA is used to reduce circulating lactate; it does not address the
      underlying translation defect.
  evidence:
  - reference: PMID:23929671
    reference_title: "MTO1 mutations are associated with hypertrophic cardiomyopathy and lactic acidosis and cause respiratory chain deficiency in humans and yeast."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical outcome was highly variable in patients with the same mutation and seemed also to depend on timely start of pharmacological treatment, centered on the control of lactic acidosis by dichloroacetate."
    explanation: >-
      Supports a possible benefit of early DCA, but only as an inference from
      variable outcomes in a handful of patients with the same genotype, not from
      a controlled comparison.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether or not DCA had a direct positive effect on HCM in patient no. 16 is uncertain and the improvement may have been part of the natural disease course in this case."
    explanation: >-
      The cohort authors explicitly qualify the single reported DCA success,
      which is why this treatment is curated with PARTIAL evidence.
- name: Ketogenic diet
  description: >-
    Trialled in 5/22 patients. Three were deemed unresponsive; one showed clear
    clinical improvement (normalised lactate, learned to walk, resolution of mild
    cardiomyopathy) and one had initially better seizure control that later
    deteriorated. The rationale is strengthened by amelioration of the
    oxidative-phosphorylation defect on a ketogenic diet in MTO1 knockout mice.
    The cohort authors conclude the data are insufficient to draw conclusions but
    that it may be worth cautiously considering in MTO1-deficient patients with
    seizures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A ketogenic diet may have exerted a favourable effect on seizures in 2/5 patients."
    explanation: Documents a possible but inconsistent anticonvulsant benefit in a handful of patients.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus the current data are insufficient to draw conclusions about the effectiveness of the ketogenic diet"
    explanation: The cohort authors' own assessment of the evidence base, recorded here so the treatment is not overstated.
- name: Mitochondrial cofactor cocktail
  description: >-
    Various combinations of L-carnitine (14/25), coenzyme Q10 (17/25), riboflavin
    (11/25), vitamin C (6/25), thiamine (5/25) and vitamin E (4/25) were given
    according to local practice. None had an appreciable effect. Riboflavin in
    particular was a rational candidate because MTO1 is a FAD-containing enzyme,
    but it did not improve respiratory chain or fibroblast oxygen consumption
    measurements. Curated here to document that this widely used empirical
    regimen has not shown benefit in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "documented objective improvement was rare"
    explanation: >-
      Refutes benefit from the empirical mitochondrial cocktail across the
      cohort; the same paragraph records that L-carnitine, coenzyme Q10, vitamin
      C, vitamin E, riboflavin and thiamine "had no appreciable effect".
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "As MTO1 is a FAD moiety-containing enzyme, riboflavin supplementation was investigated as a possible treatment without observed success in either respiratory chain or fibroblast oxygen consumption analyses"
    explanation: Specifically refutes the mechanistically motivated riboflavin hypothesis.
- name: N-acetylcysteine
  description: >-
    An investigational, cell-culture-only lead. N-acetylcysteine (but not
    L-cysteine) had a beneficial effect on mitochondrial translation in MTO1- and
    TRMU-deficient patient fibroblasts. The rationale is that cysteine supplies
    the sulfur for the 2-thiomodification that is coupled to the wobble-uridine
    modification MTO1 installs. No human trial in MTO1 deficiency has been
    reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetyl-L-cysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  target_mechanisms:
  - target: Impaired Mitochondrial Translation
    treatment_effect: RESTORES
    description: >-
      NAC supplementation partially rescued the mitochondrial translation defect
      in MTO1-deficient fibroblasts in vitro.
  evidence:
  - reference: PMID:27854233
    reference_title: "Cysteine Supplementation May be Beneficial in a Subgroup of Mitochondrial Translation Deficiencies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, N-acetyl-cysteine had a beneficial effect on mitochondrial translation in TRMU and MTO1 deficient fibroblasts."
    explanation: The single direct experimental result supporting NAC in MTO1 deficiency; it is fibroblast data only.
  - reference: PMID:27854233
    reference_title: "Cysteine Supplementation May be Beneficial in a Subgroup of Mitochondrial Translation Deficiencies."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Further studies are needed to explore the full potential of cysteine supplementation as a treatment for patients with mitochondrial disease."
    explanation: The authors' own statement that the finding is not yet translatable to patient care.
- name: Supportive and multidisciplinary care
  description: >-
    In the absence of disease-modifying therapy, management is supportive:
    inotropes and heart failure management for cardiomyopathy, serial
    echocardiography (cardiomyopathy develops over time in patients who do not
    have it at presentation), tube feeding for feeding difficulties and failure
    to thrive, antiseizure medication, ophthalmological surveillance for optic
    atrophy, and developmental/rehabilitative support. Peri-anaesthetic cardiac
    monitoring is prudent given the arrhythmia worsening observed around
    anaesthesia in the mouse model.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although subjective clinical improvement was observed in a small number of patients on therapies such as ketogenic diet and dichloroacetate, no evidence-based effective therapy exists."
    explanation: Establishes that care is necessarily supportive because no disease-modifying therapy has been validated.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In general, early diagnosis is important for genetic counselling, prognostication, screening for organ involvement, ending the diagnostic odyssey and considering disease modifying interventions"
    explanation: Supports the surveillance and counselling components of supportive management.
- name: Genetic counselling
  description: >-
    Autosomal recessive inheritance implies a 25% recurrence risk for future
    siblings. Carrier testing of parents and prenatal or preimplantation testing
    are available once the familial variants are known. Counselling is
    complicated by the wide intrafamilial and interfamilial phenotypic
    variability, including between patients homozygous for the same allele.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:

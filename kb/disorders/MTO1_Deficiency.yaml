- name: Cellular Energy Deficit and Lactate Overproduction
  biological_scale: ORGANISM
  description: >-
    With oxidative phosphorylation constrained, cells shift to glycolysis and
    reduce accumulating pyruvate to lactate, producing the lactic acidosis that
    is the single most consistent biochemical feature of the disorder (eventually
    present in 35/35 patients, with peak plasma lactate averaging 13.6 mmol/L and
    reaching 57.8 mmol/L). Pyruvate accumulation also drives transamination to
    alanine, producing the characteristic hyperalaninemia, and a broad panel of
    mitochondrial markers - ketones, TCA-cycle intermediates, tyrosine
    metabolites, dicarboxylic acids and 3-methylglutaconate - appears in urine.
  mechanism_confidence: ESTABLISHED

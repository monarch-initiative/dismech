    snippet: "Modified uridine containing taurine, 5-taurinomethyluridine (τm5U), is found at the anticodon first position of mitochondrial (mt-)transfer RNAs (tRNAs)."
    explanation: Locates the modification at the wobble position of mitochondrial tRNAs.
  - reference: PMID:33836087
    reference_title: "Ablation of Mto1 in zebrafish exhibited hypertrophic cardiomyopathy manifested by mitochondrion RNA maturation deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathogenic variants in MTO1 for the biosynthesis of τm5U of tRNAGlu, tRNAGln, tRNALys, tRNATrp and tRNALeu(UUR) were associated with hypertrophic cardiomyopathy (HCM)"
    explanation: Enumerates the five mitochondrial tRNA substrates of MTO1 and links their hypomodification to the cardiac phenotype.
  - reference: PMID:23929671
    reference_title: "MTO1 mutations are associated with hypertrophic cardiomyopathy and lactic acidosis and cause respiratory chain deficiency in humans and yeast."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "encodes one of the two subunits of the enzyme that catalyzes the 5-carboxymethylaminomethylation (mnm5s2U34) of the wobble uridine base in the mitochondrial tRNAs specific to Gln, Glu, Lys, Leu(UUR), and possibly Trp"
    explanation: >-
      The earlier (bacterial/yeast-derived) description of the same wobble-U34
      modification chemistry and the same five tRNA substrates. Retained
      alongside the tau-m5U evidence because the two nomenclatures for this
      modification recur across the MTO1 literature.
  - reference: PMID:29331171
    reference_title: "The genotypic and phenotypic spectrum of MTO1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients have bi-allelic truncating variants (i.e. frameshift) suggesting that complete loss of MTO1 is unlikely to be viable in humans."
    explanation: Establishes that the human disease reflects partial rather than complete loss of MTO1 function.
  downstream:
  - target: Impaired Mitochondrial Translation
    causal_link_type: DIRECT
    description: >-
      Hypomodified wobble uridines destabilise codon-anticodon pairing and
      reduce the accuracy and efficiency of mtDNA-encoded protein synthesis.
- name: Impaired Mitochondrial Translation
  biological_scale: MOLECULAR
  description: >-
    The tau-m5U/cmnm5U wobble modification increases the accuracy and efficiency
    of mtDNA translation by stabilising tRNA structure, ribosome binding and
    correct codon-anticodon pairing. When it is lost, synthesis of the 13
    mtDNA-encoded polypeptides is attenuated. In the mto1 knock-out zebrafish
    the mechanism is broader than decoding alone: the mutant tRNAs show altered
    conformation, increased nuclease sensitivity and globally reduced
    aminoacylation, and MTO1 additionally interacts with the mitochondrial
    poly(A) polymerase MTPAP so that its loss alters polyadenylation of cox1,
    cox3 and nd1 mRNAs. The translation defect was demonstrated directly in a
    recombinant yeast model carrying the patient alleles.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - reference: PMID:22608499
    reference_title: "Mutations of the mitochondrial-tRNA modifier MTO1 cause hypertrophic cardiomyopathy and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In both humans and yeast, MTO1 increases the accuracy and efficiency of mtDNA translation by catalyzing the 5-carboxymethylaminomethylation of the wobble uridine base in three mitochondrial tRNAs (mt-tRNAs)."
    explanation: States the functional role of the modification in translational accuracy and efficiency.
  - reference: PMID:22608499
    reference_title: "Mutations of the mitochondrial-tRNA modifier MTO1 cause hypertrophic cardiomyopathy and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lastly, in vivo mtDNA translation was impaired in the mutant yeast strains."
    explanation: Direct experimental demonstration that patient-equivalent MTO1 alleles impair mtDNA translation.
  - reference: PMID:33836087
    reference_title: "Ablation of Mto1 in zebrafish exhibited hypertrophic cardiomyopathy manifested by mitochondrion RNA maturation deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Notably, mto1KO zebrafish exhibited the global decreases in the aminoacylation of mitochondrial tRNAs with the taurine modification."
    explanation: Shows in vivo that loss of the taurine modification reduces mitochondrial tRNA aminoacylation, an additional route to translational failure.
  - reference: PMID:33836087
    reference_title: "Ablation of Mto1 in zebrafish exhibited hypertrophic cardiomyopathy manifested by mitochondrion RNA maturation deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strikingly, ablated mto1 mediated the expression of MTPAP and caused the altered polyadenylation of cox1, cox3, and nd1 mRNAs."
    explanation: Documents an mRNA-maturation arm of the mechanism beyond tRNA modification, mediated by an MTO1-MTPAP interaction.
  - reference: DOI:10.3390/ijms24032178
    reference_title: "Modopathies Caused by Mutations in Genes Encoding for Mitochondrial RNA Modifying Enzymes: Molecular Mechanisms and Yeast Disease Models"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "resulting in the absence of/decrease in a specific nucleotide modification and thus on the impairment of the efficiency or the accuracy of the mitochondrial protein synthesis"
    explanation: >-
      Places MTO1 deficiency in the broader "modopathy" class and states the
      shared mechanism - loss of a nucleotide modification impairing the
      efficiency or accuracy of mitochondrial protein synthesis. Tagged OTHER
      because the source is a narrative review rather than primary data.
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
    description: >-
      Reduced synthesis of the mtDNA-encoded core subunits leaves complexes I,
      III, IV and V under-assembled; complex II, which is entirely
      nuclear-encoded, is spared.
- name: Combined Respiratory Chain Complex Deficiency
  biological_scale: CELLULAR
  description: >-
    Attenuated mitochondrial translation produces a combined, rather than
    isolated, respiratory chain enzyme deficiency, because the 13 mtDNA-encoded
    proteins are distributed across complexes I (seven subunits), III (one), IV
    (three) and V (two), while complex II is entirely nuclear-encoded and
    unaffected. In patient skeletal muscle the most frequent pattern is a
    combined complex I and complex IV deficiency; complex IV was deficient in
    28/30 muscle biopsies and a combined deficiency was present in 27/30.
    Fibroblasts are an unreliable tissue for this assay - respiratory chain
    enzymes were normal in 4/10 patient fibroblast lines - so a normal fibroblast
    result does not exclude the diagnosis.
  mechanism_confidence: ESTABLISHED

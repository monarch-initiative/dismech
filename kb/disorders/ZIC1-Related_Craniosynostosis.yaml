    evidence:
    - reference: CGGV:assertion_e70d90a2-6365-49ac-a21f-599ff5906d88-2024-01-18T170000.000Z
      reference_title: "ZIC1 / craniosynostosis 6 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ZIC1 | HGNC:12872 | craniosynostosis 6 | MONDO:0014705 | AD | Definitive"
      explanation: ClinGen (Craniofacial Malformations GCEP) rates ZIC1 and this MONDO disease Definitive.
  notes: >-
    HGNC places ZIC1 at 3q24; the founding report and the largest cohort write 3q25.1. Variant
    position decides the phenotype: final-exon truncating and C-terminal missense variants cause
    this disorder, while exon 1 and 2 zinc-finger missense and proximal truncating variants act
    by loss of function and cause a neurodevelopmental disorder without craniosynostosis, which
    ClinGen curates separately. A de novo 3q inversion with a breakpoint 7 kb downstream of
    ZIC1, in a patient with bicoronal synostosis, was attributed by its authors to ZIC1
    dysregulation; expression was not measured, so it is not recorded as a variant here.

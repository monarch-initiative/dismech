name: ZIC1-Related Craniosynostosis
creation_date: "2026-11-11T07:18:42Z"
category: Mendelian
description: >-
  ZIC1-related craniosynostosis (craniosynostosis 6, CRS6) is an autosomal dominant syndrome
  caused by heterozygous variants in the final (third) exon of ZIC1, which encodes a C2H2
  zinc-finger transcription factor. Most variants are nonsense or frameshift changes that escape
  nonsense-mediated decay and yield a protein lacking part of its C terminus; C-terminal missense
  changes also occur. The core features are coronal synostosis (usually bicoronal, with
  brachycephaly), variable learning or intellectual disability and structural brain anomalies,
  often with deficient ossification of the skull vault, strabismus, facial dysmorphism and
  scoliosis. Penetrance for craniosynostosis is incomplete and most variants arise de novo. A
  C-terminal gain of function, possibly acting on engrailed 1 where the coronal suture is
  patterned, is the reported mechanism. Proximal loss-of-function ZIC1 variants (a
  neurodevelopmental disorder without craniosynostosis) and deletions of ZIC1 with ZIC4
  (Dandy-Walker malformation) are separate disorders outside this entry.

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous variants act dominantly. Most arise de novo, one proband carried a mosaic
    variant, and transmission from mildly affected or unaffected (sometimes mosaic) parents is
    described; sibling recurrence has been attributed to parental gonadal mosaicism.
  evidence:
  - reference: PMID:26340333
    reference_title: "Gain-of-Function Mutations in ZIC1 Are Associated with Coronal Craniosynostosis and Learning Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In family 5, a heterozygous missense variant p.Gly400Arg, present in the same C-terminal
      region of the ZIC1 protein, segregated through three generations in six affected
      individuals.
    explanation: Three-generation segregation of a heterozygous variant documents dominant transmission.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In 5 families reported here, the ZIC1 variant was inherited from a parent
    explanation: Documents parent-to-child transmission of heterozygous ZIC1 variants.
  - reference: PMID:30391508
    reference_title: "Mutated zinc finger protein of the cerebellum 1 leads to microcephaly, cortical malformation, callosal agenesis, cerebellar dysplasia, tethered cord and scoliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was not detected in DNA of both parents, which suggests parental gonadal
      mosaicism.
    explanation: Recurrence in two siblings of non-carrier parents points to gonadal mosaicism.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Not every carrier of a final-exon variant has craniosynostosis; some relatives show only
    skull-shape or fontanelle anomalies.
  evidence:
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      for the previously reported p.(Gly400Arg) variant, craniosynostosis was not a fully
      penetrant feature within the same family
    explanation: States that craniosynostosis is not fully penetrant within one family.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of all individuals with an exon 3 nonsense or frameshift variant 71% (12/17) had
      craniosynostosis
    explanation: Quantifies penetrance of craniosynostosis for final-exon truncating variants.

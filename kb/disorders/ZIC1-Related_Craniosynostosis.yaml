notes: >-
  Entry name: the MONDO label is "craniosynostosis 6"; "ZIC1-Related Craniosynostosis" follows
  the MONDO EXACT synonym "ZIC1 craniosynostosis" in dyadic form, and the numbered-series names
  are kept in synonyms. GeneReviews: the committed Bookshelf index (cache/bookshelf/genereviews.csv)
  has no title containing ZIC1, and its only craniosynostosis title is the FGFR Craniosynostosis
  Syndromes Overview, so the phenotype baseline comes from the primary reports (Twigg 2015,
  PMID:26340333; Watts 2026, PMID:42028696; Vandervore 2018, PMID:30391508). Several frequencies
  from Watts 2026 (brain imaging, strabismus) pool individuals with and without craniosynostosis,
  as stated in each explanation. Scope: allelic ZIC1 disorders are excluded, namely the
  neurodevelopmental disorder without craniosynostosis caused by exon 1 and 2 loss-of-function
  variants (curated separately by ClinGen) and Dandy-Walker malformation from deletions of ZIC1
  with ZIC4 (covered by the Dandy-Walker syndrome entry). Strabismus and downslanting palpebral
  fissures are not connected to a mechanism node: both occur in carriers with and without
  craniosynostosis and no source proposes how they arise.

mechanistic_hypotheses:
- hypothesis_group_id: zic1_c_terminal_gain_of_function
  hypothesis_label: C-Terminal Gain-of-Function Model
  status: CANONICAL
  description: >-
    Final-exon truncations escape decay and, like the C-terminal missense changes, remove or
    alter a C-terminal region that restrains ZIC1, so the mutant protein over-activates targets
    such as engrailed. This is the mechanism ClinGen records and the founding report proposed.
  evidence:
  - reference: CGGV:assertion_e70d90a2-6365-49ac-a21f-599ff5906d88-2024-01-18T170000.000Z
    reference_title: "ZIC1 / craniosynostosis 6 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The mechanism of pathogenicity is reported to be gain-of-function.
    explanation: ClinGen records gain of function as the reported mechanism.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the final exon heterozygous ZIC1 variants result in a distinct phenotype of
      craniosynostosis with variable intellectual disability via a gain-of-function mechanism
    explanation: The largest cohort describes the final-exon class as gain of function.
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      In comparison, the exon 3 truncation variant Glu402Ter that does not affect the ZF
      domains significantly reduced transactivation by 48%.
    explanation: A recurrent final-exon truncation reduced transactivation, which a simple gain of function does not predict.
- hypothesis_group_id: zic1_mixed_loss_and_gain_of_function
  hypothesis_label: Mixed Loss- and Gain-of-Function Model
  status: EMERGING
  description: >-
    The final-exon variants may act both ways, as a gain of function at the coronal suture and a
    partial loss of function in the brain, which would explain why the brain anomalies resemble
    those of ZIC1 deletions and proximal loss-of-function variants.
  evidence:
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these features most likely arise from loss-of-function of 1 ZIC1 allele, suggesting
      that the variants that also cause craniosynostosis might have both loss- and
      gain-of-function effects
    explanation: Proposes combined loss- and gain-of-function effects for the craniosynostosis variants.
- hypothesis_group_id: zic1_en1_supraorbital_patterning
  hypothesis_label: Zic1-Engrailed Supraorbital Patterning Model
  status: EMERGING
  description: >-
    Altered ZIC1 acts in the supraorbital regulatory center upstream of engrailed 1, disturbing
    the earliest step of coronal suture formation rather than osteogenic signalling within an
    established suture.
  evidence:
  - reference: PMID:26340333
    reference_title: "Gain-of-Function Mutations in ZIC1 Are Associated with Coronal Craniosynostosis and Learning Disability."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the human mutations uncover a previously unsuspected role for Zic1 in
      early cranial suture development, potentially by regulating engrailed 1, which was
      previously shown to be critical for positioning of the murine coronal suture.
    explanation: The founding report proposes an early suture role for ZIC1 through engrailed 1.
discussions:
- discussion_id: kg_zic1_suture_mechanism_untested
  prompt: >-
    How does a stable C-terminally truncated ZIC1 protein cause coronal suture fusion, and does
    it act through engrailed 1 in the supraorbital regulatory center?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disturbed Zic1-Engrailed Patterning of the Supraorbital Regulatory Center
  - pathophysiology#Premature Coronal Suture Fusion
  rationale: >-
    The suture mechanism rests on mouse expression timing and a Xenopus engrailed-2 readout. No
    animal carries a final-exon Zic1 truncation and Zic1-null mice have no skull phenotype, so
    the proposed chain cannot yet be tested, and the opposite Xenopus and reporter-assay
    readouts leave open whether the effect is a gain, a loss or a change in target specificity.
  evidence:
  - reference: PMID:42028696
    reference_title: "Expanding the phenotypic spectrum associated with ZIC1 variants: A neurodevelopmental disorder with and without craniosynostosis."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because there are no skull abnormalities in these mice, the occurrence of pathogenic
      variants of ZIC1 in craniosynostosis was surprising and revealed a previously
      unappreciated role for ZIC1 in cranial suture morphogenesis.
    explanation: The existing Zic1 mouse models lack a skull phenotype, so they cannot test the suture mechanism.

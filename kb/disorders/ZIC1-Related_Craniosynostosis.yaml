  - reference: PMID:26340333
    reference_title: "Gain-of-Function Mutations in ZIC1 Are Associated with Coronal Craniosynostosis and Learning Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a distinct phenotype in which severe craniosynostosis, specifically involving the coronal
      sutures, and variable learning disability are the most characteristic features
    explanation: The founding report links heterozygous final-exon ZIC1 variants to this phenotype in five families.

pathophysiology:
- name: ZIC1 Final-Exon Variant with Stable C-Terminally Altered Protein
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline variant in the final exon of ZIC1, usually nonsense or frameshift,
    sometimes a C-terminal missense change. Truncating transcripts escape nonsense-mediated
    decay, so a protein that keeps its zinc-finger DNA-binding domain but lacks part of its
    conserved C terminus is made.

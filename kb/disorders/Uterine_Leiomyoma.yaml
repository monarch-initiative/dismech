  treatment_term:
    preferred_term: hysterectomy
    term:
      id: NCIT:C15256
      label: Hysterectomy
  evidence:
  - reference: PMID:38929485
    reference_title: Currently Available Treatment Modalities for Uterine Fibroids.
    supports: SUPPORT

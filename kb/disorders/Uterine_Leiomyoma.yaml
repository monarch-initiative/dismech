    reference_title: UTERINE FIBROIDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uterine fibroids (leiomyomas), the most common tumors in women and those \nassigned female at birth, originate from myometrial smooth muscle cells"
    explanation: Documents uterine leiomyoma as a myometrial smooth muscle tumor.

- category: Clinical
  name: Heavy Menstrual Bleeding
  description: >
    Heavy menstrual bleeding (menorrhagia) is the most common symptom, classified as
    AUB-L (leiomyoma) by FIGO, particularly with submucosal tumors.
  phenotype_term:
    preferred_term: Heavy menstrual bleeding
    term:
      id: HP:0000132
      label: Menorrhagia
  evidence:
  - reference: PMID:38723935
    reference_title: The modern management of uterine fibroids-related abnormal uterine bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal uterine bleeding and heavy menstrual bleeding being the most \ncommon complaints"
    explanation: Identifies heavy menstrual bleeding as the most common fibroid complaint.
  sequelae:
  - target: Iron Deficiency Anemia
    description: >-
      Chronic menstrual blood loss depletes iron stores.
    evidence:
    - reference: PMID:38723935
      reference_title: The modern management of uterine fibroids-related abnormal uterine bleeding.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the management of \nID and ID anemia, as a consequence of acute and chronic bleeding, should be \ntaken into account with the use of iron replacement therapy"
      explanation: >-
        States that the iron deficiency and anemia are a consequence of the bleeding,
        which is the step this sequela edge draws.

- category: Clinical
  name: Pelvic Pain
  description: Pelvic heaviness, pressure, and pain related to fibroid bulk.
  phenotype_term:
    preferred_term: Pelvic pain
    term:
      id: HP:0034267
      label: Pelvic pain
  evidence:
  - reference: PMID:38929485
    reference_title: Currently Available Treatment Modalities for Uterine Fibroids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common benign \ngynecological condition in patients presenting with abnormal uterine bleeding, \npelvic masses causing pressure or pain"
    explanation: Documents pelvic masses causing pressure or pain as a fibroid presentation.

- category: Clinical
  name: Dysmenorrhea
  description: Painful menstruation associated with fibroids.
  phenotype_term:
    preferred_term: Dysmenorrhea
    term:
      id: HP:0100607
      label: Dysmenorrhea
  evidence:
  - reference: PMID:41514933
    reference_title: "Beyond VEGF and TGF-β: A Comprehensive Review of Growth Factor Pathways in the Pathophysiology of Uterine Leiomyomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several symptoms exist in women with UFs: a heavy and irregular menstrual cycle, dysmenorrhea, pelvic pressure, and infertility"
    explanation: >-
      Names dysmenorrhea directly among the symptoms of uterine fibroids, which is a
      direct attestation of the term bound here.
  - reference: PMID:39335725
    reference_title: "Tailoring the Diagnostic Pathway for Medical and Surgical Treatment of Uterine Fibroids: A Narrative Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mifepristone demonstrated its efficacy in reducing abnormal uterine bleedings (AUBs) and fibroid-related dysmenorrhea"
    explanation: >-
      Second, independent attestation: the phrase "fibroid-related dysmenorrhea" treats
      this phenotype as an established consequence of fibroids, and its reducibility by
      antiprogestin therapy supports the hormone-dependent mechanism it is attached to.

- category: Clinical
  name: Iron Deficiency Anemia
  description: Anemia resulting from chronic heavy menstrual blood loss.
  phenotype_term:
    preferred_term: Iron deficiency anemia
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  evidence:
  - reference: PMID:38723935
    reference_title: The modern management of uterine fibroids-related abnormal uterine bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "along with iron deficiency (ID) and ID anemia"
    explanation: Documents iron deficiency anemia as a consequence of fibroid-related bleeding.
  notes: >-
    Fatigue is the expected sequela of this anemia and was drafted as its own phenotype
    (HP:0012378), then removed: no source cited anywhere in this entry names fatigue as a
    fibroid symptom, and a targeted PubMed search for one (fibroid + iron deficiency +
    fatigue in title/abstract) returned nothing usable. The claim is clinically obvious
    and bibliographically unsupported here, so it is recorded as this note rather than as
    an ontology-bound phenotype resting on an inference.

- category: Clinical
  name: Infertility and Reproductive Morbidity
  description: >
    Fibroids, especially submucosal and large intramural tumors, are associated with
    infertility, defective implantation, pregnancy loss, and obstruction of labor.

      label: Infertility
  evidence:
  - reference: PMID:40214304
    reference_title: UTERINE FIBROIDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cause heavy menstrual bleeding, anemia, pelvic discomfort, pregnancy loss, and \nobstruction of labor"

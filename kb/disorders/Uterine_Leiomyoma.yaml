  downstream:
  - target: Hormone-Driven Myometrial Smooth Muscle Proliferation
    description: >-
      The transformed clonal cell becomes dependent on estrogen and progesterone:
      progesterone (via PGR) drives paracrine WNT ligand secretion that stimulates
      tumor stem cell proliferation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Progesterone receptor signaling activates paracrine WNT ligand production.
  - target: Fumarate Accumulation in FH-Deficient Leiomyoma
    description: >-
      In the FH-deficient subtype the driver lesion is biallelic loss of the
      tricarboxylic-acid-cycle enzyme fumarate hydratase, so the initiating event
      is metabolic rather than transcriptional: fumarate accumulates and succinates
      cysteine residues, which is the branch this edge names.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37263921
      reference_title: "[Fumarate hydratase deficient uterine leiomyoma: a clinicopathological and molecular analysis of 80 cases]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The immunohistochemical sensitivity of FH and 2SC were 97.3% and 100%, respectively."
      explanation: >-
        Loss of FH protein and accumulation of the fumarate adduct S-(2-succino)-cysteine
        are both demonstrable by immunohistochemistry in FH-deficient leiomyoma, which is
        what makes the FH driver lesion and the fumarate accumulation downstream of it a
        single observable step.

- name: Hormone-Driven Myometrial Smooth Muscle Proliferation
  conforms_to: "sex_steroid_driven_proliferation#Target-Cell Population Expansion"
  description: >
    Estradiol and progesterone are essential for fibroid growth. During each ovulatory
    cycle the myometrium proliferates under ovarian steroid stimulation. Progesterone,
    acting through its nuclear receptor (PGR) in differentiated fibroid cells, activates
    paracrine secretion of WNT ligands, cytokines, and growth factors that drive a small
    stem cell population to proliferate. Fibroids rarely arise before menarche and
    frequently regress after menopause, underscoring steroid hormone dependence. The
    excessive matrix these proliferating cells and the adjacent tumor-associated
    fibroblasts lay down is modelled as the separate downstream node
    "Excessive Extracellular Matrix Deposition and Tissue Stiffening"; this node is the
    cell-population expansion alone.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: myometrial smooth muscle cell
    term:
      id: CL:0002366
      label: myometrial cell
  - preferred_term: tumor-associated fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: smooth muscle cell proliferation
    term:
      id: GO:0048661
      label: positive regulation of smooth muscle cell proliferation
    modifier: INCREASED
  - preferred_term: progesterone receptor signaling
    term:
      id: GO:0050847
      label: progesterone receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:40214304
    reference_title: UTERINE FIBROIDS.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progesterone, via its receptors in differentiated fibroid cell \npopulations, activates the production of Wingless-type MMTV integration site \nfamily (WNT) ligands, cytokines, and other growth substances to act on adjacent \nstem cells in a paracrine fashion to support tumor growth."
    explanation: >-
      Defines the progesterone-driven paracrine WNT mechanism supporting fibroid stem
      cell proliferation.
  - reference: PMID:40214304
    reference_title: UTERINE FIBROIDS.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both the mutated smooth muscle cells and the adjacent \ntumor-associated fibroblasts lay down excessive quantities of extracellular \nmatrix, providing a unique feature that led to naming these tumors \"fibroids.\""
    explanation: >-
      Establishes that mutated smooth muscle cells and tumor-associated fibroblasts
      deposit the excessive ECM characteristic of fibroids.
  - reference: PMID:37668348
    reference_title: "RISING STARS: Role of MED12 mutation in the pathogenesis of uterine fibroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene expressions related to ECM \norganization and collagen-rich ECM components are upregulated, and impaired \nMediator kinase activity and dysregulation of Wnt/β-catenin signaling are \nidentified in MED12-UFs."
    explanation: >-
      Links MED12 mutation to upregulated ECM-organization/collagen genes and
      Wnt/beta-catenin dysregulation.
  - reference: PMID:36835153
    reference_title: Differential Expression of MED12-Associated Coding RNA Transcripts in Uterine Leiomyomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The differential analysis indicated there are 394 genes \ndifferentially and aberrantly expressed only in the mutated tumors. These genes \nwere predominantly involved in the regulation of extracellular constituents."
    explanation: >-
      RNA-sequencing shows MED12-mutant tumors aberrantly express genes regulating
      the extracellular matrix.
  - reference: PMID:40862769
    reference_title: The Roles of Non-Coding RNAs in the Pathogenesis of Uterine Fibroids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "important regulatory RNAs that are becoming increasingly implicated in the aberrant expression of protein-coding genes functionally associated with ECM production, cell proliferation, apoptosis, and inflammation in fibroids"
    explanation: >-
      Non-coding RNAs (miRNAs, lncRNAs, circRNAs) constitute a regulatory layer over
      the fibroid ECM-production and proliferation program, with their expression
      influenced by MED12 mutation status and ovarian steroids.
  downstream:
  - target: Excessive Extracellular Matrix Deposition and Tissue Stiffening
    description: >-
      The expanded clone and the tumor-associated fibroblasts recruited alongside it
      secrete the collagen-rich matrix that gives the tumor its bulk and its name.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37668348
      reference_title: "RISING STARS: Role of MED12 mutation in the pathogenesis of uterine fibroids."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Gene expressions related to ECM \norganization and collagen-rich ECM components are upregulated, and impaired \nMediator kinase activity and dysregulation of Wnt/β-catenin signaling are \nidentified in MED12-UFs."
      explanation: >-
        The proliferating MED12-mutant cell population is the source of the upregulated
        ECM-organization and collagen program, which is the step this edge asserts.
  - target: Aberrant Pseudocapsule Angiogenesis and Venous Ectasia
    description: >-
      The growing clone induces its own blood supply, organized as a vascularized
      pseudocapsule rather than by the hypoxia-driven route used by malignant tumors.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36303616
      reference_title: Uterine Fibroids (Leiomyomata) and Heavy Menstrual Bleeding.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "While the fibroid mass itself is poorly vascularised, it can be surrounded by a highly vascularised pseudocapsule in intramural fibroids, a specialized layer of tissue between the tumor and the surrounding myometrium that contains the blood vessels needed to sustain the fibroid"
      explanation: >-
        States that the growing intramural fibroid is supplied by a pseudocapsule of
        newly formed vessels, which is the tumor-to-vasculature step of this edge.

- name: Fumarate Accumulation in FH-Deficient Leiomyoma
  conforms_to: "oncometabolite_dioxygenase_inhibition#Oncometabolite Accumulation"
  description: >
    In the fumarate-hydratase-deficient subtype, biallelic FH loss blocks the
    tricarboxylic-acid cycle at the fumarate-to-malate step, so fumarate accumulates and
    non-enzymatically succinates protein cysteine residues, forming the
    S-(2-succino)-cysteine adduct that immunohistochemistry detects. This node is the
    accumulation step alone; what the accumulated fumarate then does is the downstream
    pseudohypoxia node, matching the way the module it conforms to separates the two.
    The subtype is defined by the same chemistry whether the first FH hit is germline or
    somatic, and the germline case is hereditary leiomyomatosis and renal cell cancer,
    curated separately as Hereditary_Leiomyomatosis_and_Renal_Cell_Cancer.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FH
    term:
      id: hgnc:3700
      label: FH
  molecular_functions:
  - preferred_term: fumarate hydratase activity
    term:
      id: GO:0004333
      label: fumarate hydratase activity
    modifier: DECREASED

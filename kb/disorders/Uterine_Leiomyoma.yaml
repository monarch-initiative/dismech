    snippet: "Fibroids positioned anteriorly or posteriorly can compress the bladder or rectum, resulting in urinary frequency, difficulty emptying the bladder, or constipation."
    explanation: >-
      Names constipation directly and attributes it to rectal compression by a
      posteriorly placed fibroid, which is both this phenotype and its mechanism.

- category: Clinical
  name: Urinary Frequency
  description: >
    Anterior and fundal fibroids compress the bladder, reducing its functional capacity

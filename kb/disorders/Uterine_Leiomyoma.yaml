progression:
- phase: Premenarchal
  age_range: birth to menarche
  notes: >-
    Fibroids essentially do not arise before menarche, which follows from their growth
    being sex-steroid-dependent: the tumor, though initiated by a somatic lesion, cannot
    expand without ovarian steroid support, and before menarche that support is absent.
  evidence:
  - reference: PMID:37668348
    reference_title: "RISING STARS: Role of MED12 mutation in the pathogenesis of uterine fibroids."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Uterine fibroids (UFs) are benign tumors arising from the uterus, characterized \nby accumulation of abundant extracellular matrix (ECM) and sex steroid-dependent \ngrowth."
    explanation: >-
      Establishes that fibroid growth is sex-steroid-dependent. The premenarchal absence
      recorded in this phase follows from that dependence rather than being stated in the
      quote, which is why this is graded INDIRECT.
- phase: Reproductive years
  age_range: menarche to menopause, peak 35-50 years
  notes: >-
    The growth phase. Detection and symptom burden rise steeply from the mid-thirties,
    with most diagnoses between 35 and 50. Individual tumors within one uterus are
    separate clones and grow at different rates, so "progression" here is the aggregate
    of several independent trajectories rather than one.
  evidence:
  - reference: PMID:36982825
    reference_title: "A View on Uterine Leiomyoma Genesis through the Prism of Genetic, Epigenetic and Cellular Heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite its benign nature and low risk of malignisation, UL can be characterised by rapid growth, large size and multiple nodes"
    explanation: >-
      Supports the variable-growth, multiple-tumor character of this phase.
- phase: Postmenopausal
  age_range: after menopause
  notes: >-
    Ovarian steroid withdrawal is followed by growth arrest and frequently by regression,
    which is the therapeutic logic behind every hormonal treatment in this entry: they
    reproduce the postmenopausal state pharmacologically, and their effect reverses when
    stopped for the same reason.
  evidence:
  - reference: PMID:33670322
    reference_title: "Vitamin D: Mechanism of Action and Biological Effects in Uterine Fibroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, UFs can undergo growth inhibition or spontaneous regression after menopause"
    explanation: >-
      States the postmenopausal growth inhibition and regression that define this phase.

clinical_burden:
  burden_level: VARIABLE
  rationale: >
    The burden is genuinely bimodal rather than merely heterogeneous, and averaging it
    would misdescribe the disease. Most women with fibroids never know they have them;
    among those who do, roughly 30% report a quality-of-life impact, and for that
    minority heavy menstrual bleeding is the dominant complaint and the leading reason
    for elective hysterectomy. Mortality is essentially nil. So the same diagnosis covers
    an incidental ultrasound finding and an indication for major surgery.
  evidence:
  - reference: PMID:38723935
    reference_title: The modern management of uterine fibroids-related abnormal uterine bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in \napproximately 30% of cases, UFs affect the quality of life and women's health, \nwith abnormal uterine bleeding and heavy menstrual bleeding being the most \ncommon complaints, along with iron deficiency (ID) and ID anemia."
    explanation: >-
      Quantifies the symptomatic minority and names what dominates their burden.
  - reference: PMID:36303616
    reference_title: Uterine Fibroids (Leiomyomata) and Heavy Menstrual Bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In ~30% of patients, uterine fibroids cause menorrhagia, or heavy menstrual bleeding, and more than half of the patients experience symptoms such as heavy menstrual bleeding, pelvic pain, or infertility."
    explanation: >-
      Independent figure for the symptomatic fraction, supporting the VARIABLE band
      rather than a single level.

differential_diagnoses:
- name: Uterine leiomyosarcoma
  disease_term:
    preferred_term: uterine leiomyosarcoma
    term:
      id: MONDO:0016262
      label: leiomyosarcoma of the corpus uteri
  description: >
    The differential that matters, because it cannot be resolved before resection. No
    imaging finding or biomarker reliably separates a benign leiomyoma from a
    leiomyosarcoma preoperatively, which is why a rapidly enlarging mass prompts
    evaluation and why morcellation of a presumed fibroid carries a dissemination risk.
  distinguishing_features:
  - Histopathology of the resected specimen is definitive; nothing before resection is.
  - Molecular profiling may assist in the cellular and variant morphologies.
  - >-
    HIF-1-alpha is readily demonstrable in leiomyosarcoma but has been reported absent
    from leiomyoma, which is also why the two tumors' angiogenic mechanisms differ.
  evidence:
  - reference: PMID:36303616
    reference_title: Uterine Fibroids (Leiomyomata) and Heavy Menstrual Bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HIF-1α for example has been shown lacking in uterine fibroids, when it was readily shown in leiomyosarcomata"
    explanation: >-
      Supports the HIF-1-alpha distinction recorded under distinguishing_features.
- name: Endometrial stromal tumor
  description: >
    Endometrial stromal nodule and low-grade endometrial stromal sarcoma enter the
    differential chiefly against the cellular leiomyoma variant, where increased
    cellularity and reduced stroma remove the morphologic cues that separate them.
  distinguishing_features:
  - >-
    Immunohistochemistry is suggestive rather than decisive: cellular leiomyomas express
    CD10 in a majority of cases (65.4%, though only 42.2% strongly, at H-score above 50)
    and IFITM1 in 36.5%, so positivity for an endometrial stromal marker does not settle
    it.
  - >-
    Smooth muscle markers are near-uniformly expressed in cellular leiomyoma (calponin
    and desmin in 100%), which is the more reliable direction of evidence.
  evidence:
  - reference: PMID:34626221
    reference_title: "Uterine cellular leiomyomas are characterized by common HMGA2 aberrations, followed by chromosome 1p deletion and MED12 mutation: morphological, molecular, and immunohistochemical study of 52 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concerning markers of endometrial stromal differentiation, the expression of \nCD10 was observed in 65.4% cases (42.2% with H-score > 50), and IFITM1 in 36.5% \ncases (1.9% with H-score > 50)"
    explanation: >-
      Gives the immunohistochemical overlap that makes this differential hard: CD10 is
      positive in most cellular leiomyomas and IFITM1 in over a third, so positivity for
      an endometrial stromal marker does not settle the diagnosis.
  - reference: PMID:34626221
    reference_title: "Uterine cellular leiomyomas are characterized by common HMGA2 aberrations, followed by chromosome 1p deletion and MED12 mutation: morphological, molecular, and immunohistochemical study of 52 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The immunohistochemical \nresults showed a high expression of smooth muscle markers (calponin (100%), \ndesmin (100%), smooth muscle actin (98.1%), caldesmon (96.1%), transgelin \n(96.1%), smooth muscle myosin heavy chain (86.5%), and smoothelin (61.5%))."
    explanation: >-
      Supplies the smooth-muscle marker panel that argues for leiomyoma, and the reason
      it is described as the more reliable direction of evidence.

- name: Adenomyosis
  disease_term:
    preferred_term: adenomyosis
    term:
      id: MONDO:0010888
      label: adenomyosis
  description: >
    Ectopic endometrial tissue within the myometrium, presenting with the same heavy
    bleeding and dysmenorrhea, frequently coexisting with fibroids, and separated from
    them on imaging rather than clinically.
  distinguishing_features:
  - >-
    MRI is the modality that resolves the two, and standardized structured reporting
    exists precisely because this differential is common.
  - The two frequently coexist, so resolving it is not always a choice between them.
  evidence:
  - reference: PMID:40970558
    reference_title: Diagnosis and classification of uterine fibroids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adherence to standardized structured reporting across imaging modalities is critical to improve diagnostic accuracy, differentiate fibroids from conditions such as adenomyosis or malignancies, predict therapeutic responses, and plan surgical interventions."
    explanation: >-
      Names adenomyosis as one of the two conditions imaging is expected to distinguish
      fibroids from.

animal_models:
- name: Eker rat (germline Tsc2 mutation)
  species: Rat
  genotype: Tsc2 germline loss-of-function (Eker strain)
  category: Spontaneous
  genes:
  - preferred_term: Tsc2
    term:
      id: hgnc:12363
      label: TSC2
  description: >
    The most widely used spontaneous model. Roughly 65% of female Eker rats develop
    uterine smooth muscle tumors at 12-16 months through a germline Tsc2 mutation and
    consequent mTOR pathway activation. Histomorphology and oestrogen/progesterone
    dependence closely resemble human fibroids, and the strain has carried most of the
    gene-environment work in this field, including the developmental DES exposure and
    vitamin D3 rescue experiments this entry cites.
  publication: PMID:41810407
  notes: >-
    The gene_term binds the human TSC2 ortholog because HGNC codes human genes; the
    model's own lesion is rat Tsc2. MGI/RGD identifiers for the rat gene are not bound
    by any current dismech slot.
  evidence:
  - reference: PMID:41810407
    reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because of the convenience of model establishment, this model has become one of the most commonly used models for ULs"
    explanation: >-
      Establishes this strain's standing as the most commonly used uterine leiomyoma
      model, which is why it is curated here rather than only mentioned in notes.
  modeled_mechanisms:
  - target: Hormone-Driven Myometrial Smooth Muscle Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces spontaneous, hormone-dependent uterine smooth muscle tumorigenesis in
      an intact animal, which is what makes it usable for gene-environment and
      chemoprevention work no in vitro system can do.
    limitations: >-
      The driving lesion is Tsc2, which is not one of the recurrent human somatic
      drivers (MED12, HMGA2, FH), so the model recapitulates the hormone-dependent
      growth phase without recapitulating the initiating genotype. It also takes 12-16
      months, is expensive, and the animals develop concurrent renal and hepatic
      tumors that confound interpretation.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Rat myometrium rather than human, with a rodent oestrous cycle rather than a
        menstrual cycle, so the cyclical progesterone exposure that drives human fibroid
        growth is not reproduced in the same temporal pattern.
      evidence:
      - reference: PMID:41810407
        reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Eker rats (Rattus norvegicus), due to their germline mutation in the tuberous sclerosis complex type 2 (Tsc2) tumor suppressor gene, spontaneously develop uterine smooth muscle tumors in approximately 65% of females at 12 to 16 months of age."
        explanation: >-
          Identifies the species as Rattus norvegicus, which is the fact this divergence
          rests on.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The human driver lesions are outside the model entirely: no MED12 exon-2
        mutation, no HMGA2 rearrangement and no FH loss, so nothing in this animal
        addresses the Mediator-kinase, architectural-transcription-factor or
        oncometabolite arms of the human mechanism.
      evidence:
      - reference: PMID:41810407
        reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Its clear genetic background based on the Tsc2 mutation is closely related to abnormal activation of the mTOR signaling pathway."
        explanation: >-
          Names Tsc2/mTOR as the model's entire genetic basis, which is what places the
          human driver lesions outside its boundary.
    evidence:
    - reference: PMID:41810407
      reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This rat model exhibits highly similar histomorphology and estrogen/progesterone-dependent manifestations to human ULs"
      explanation: >-
        Supports treating this model as informative for the hormone-dependent growth
        node, which is the claim this link makes.
    - reference: PMID:41810407
      reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, limitations include long model establishment time, high costs, and the model's tendency to develop concurrent tumors such as renal and hepatic tumors, which restrict its application"
      explanation: >-
        Substantiates the limitations recorded on this link rather than the mechanism,
        and is the reason fidelity is MODERATE rather than HIGH.
  - target: Driver Mutation-Initiated Clonal Transformation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The model does not reproduce the human initiating lesion. Its tumors start from a
      germline Tsc2 mutation present in every cell, where human fibroids start from a
      somatic driver acquired by one myometrial cell, so the monoclonal-origin and
      driver-genotype claims of this node are outside what the model can support.
    limitations: >-
      Tsc2 is not among MED12, HMGA2, FH or COL4A5/COL4A6, and the lesion is germline
      rather than somatic. Any inference from this model to the human initiating event
      is an inference about hormone-dependent growth in a predisposed myometrium, not
      about how a human fibroid starts.
    evidence:
    - reference: PMID:41810407
      reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Eker rats (Rattus norvegicus), due to their germline mutation in the tuberous sclerosis complex type 2 (Tsc2) tumor suppressor gene, spontaneously develop uterine smooth muscle tumors in approximately 65% of females at 12 to 16 months of age."
      explanation: >-
        Identifies the model's lesion as a germline Tsc2 mutation, which is what
        establishes the mismatch with the human somatic drivers this node is about.
  - target: Excessive Extracellular Matrix Deposition and Tissue Stiffening
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The Eker rat is the system in which vitamin D3 was shown to restore the MRN
      complex/ATM DNA-repair axis in myometrial stem cells after developmental DES
      exposure, which is the experimental basis for the vitamin D environmental record
      in this entry.
    limitations: >-
      The measured endpoint is DNA damage and repair-protein expression in isolated
      myometrial stem cells, not matrix deposition or tumor volume, so the link to the
      fibrotic output node is an extrapolation across both scale and endpoint.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The model's measured quantity is DNA-damage load and MRN-complex protein
        expression in stem cells. The node's quantity is collagen-rich matrix deposited
        in a tumor. Nothing in the cited experiment measures the latter.
      evidence:
      - reference: PMID:32545544
        reference_title: Vitamin D3 Ameliorates DNA Damage Caused by Developmental Exposure to Endocrine Disruptors in the Uterine Myometrial Stem Cells of Eker Rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Concomitantly, the levels of key DNA damage repair members, including the MRN complex, increased in DES-MMSCs following treatment with VitD3 (p < 0.01)."
        explanation: >-
          Names what the experiment actually measured - MRN-complex repair-protein levels
          in stem cells - which is the proxy this divergence records against a
          matrix-deposition node.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        Observed at the molecular scale (repair-protein expression) and cited for a
        TISSUE-scale node, so the inference crosses two scale steps.
      evidence:
      - reference: PMID:32545544
        reference_title: Vitamin D3 Ameliorates DNA Damage Caused by Developmental Exposure to Endocrine Disruptors in the Uterine Myometrial Stem Cells of Eker Rats.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Several techniques were performed to determine the effect of VitD3 treatment on the DNA repair pathway in DES-exposed MMSCs (DES-MMSCs)."
        explanation: >-
          Confirms the observation was made on isolated stem cells and their DNA-repair
          pathway, establishing the molecular observation scale this divergence compares
          against the node's tissue scale.
    evidence:
    - reference: PMID:32545544
      reference_title: Vitamin D3 Ameliorates DNA Damage Caused by Developmental Exposure to Endocrine Disruptors in the Uterine Myometrial Stem Cells of Eker Rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study demonstrates, for the first time, that VitD3 treatment attenuated the DNA damage load in MMSCs exposed to DES and classic DNA damage inducers."
      explanation: >-
        The rescue result this link records, and the reason the divergences above are
        stated: the endpoint is DNA damage, not matrix.

- name: Human leiomyoma tissue xenograft in immunodeficient mouse
  species: Mouse
  genotype: Severe combined immunodeficiency (SCID) host, human leiomyoma tissue graft
  category: Xenograft
  description: >
    Human fibroid tissue grafted subcutaneously or beneath the renal capsule of
    immunodeficient mice, usually with a sustained-release hormone device to keep the
    graft in its native hormonal environment. This is the model that preserves the human
    tumor's own driver genotype, heterogeneity and microenvironment, and so the one used
    for preclinical efficacy work meant to translate.
  publication: PMID:41810407
  evidence:
  - reference: PMID:41810407
    reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "xenograft models can best simulate the pathological features of human ULs and serve as a key bridge between basic research and clinical translation"
    explanation: >-
      States the reason this model class is curated: it is the closest available
      reproduction of human fibroid pathology and the intended translational bridge.
  modeled_mechanisms:
  - target: Excessive Extracellular Matrix Deposition and Tissue Stiffening
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      The graft retains the histopathological morphology of the source tumor, matrix
      included, which is exactly the property that makes it the translational bridge.
    limitations: >-
      Requires an immunodeficient host, so the immune and inflammatory contributions to
      fibroid matrix biology cannot be studied in it at all. Results also vary between
      tissue donors, and the model is technically demanding and expensive.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The host has no adaptive immune system, so the immune infiltrate and the
        inflammatory signalling that recent reviews implicate in fibroid ECM production
        are outside the model boundary.
      evidence:
      - reference: PMID:41810407
        reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dependent on expensive immunodeficient animals; High cost; Inter-donor sample variability."
        explanation: >-
          The review's own limitation row for this model class, naming the
          immunodeficient host that puts the immune compartment outside the boundary.
      - reference: PMID:36982852
        reference_title: Update on the Role and Regulatory Mechanism of Extracellular Matrix in the Pathogenesis of Uterine Fibroids.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These risk factors affect several key pathways, including inflammation"
        explanation: >-
          Establishes that inflammation is among the pathways implicated in fibroid
          pathogenesis, which is what makes its absence from the host a material
          omission rather than an incidental one.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        Each graft reproduces one donor's tumor, and inter-donor variability is reported
        as a limitation of the approach, so a single xenograft experiment speaks to one
        molecular subtype rather than to the disease's driver spectrum.
      evidence:
      - reference: PMID:41810407
        reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Dependent on expensive immunodeficient animals; High cost; Inter-donor sample variability."
        explanation: >-
          Names inter-donor sample variability as a limitation of the approach, which is
          the divergence recorded here.
    evidence:
    - reference: PMID:41810407
      reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These models closely replicate the histopathological morphology of human ULs. However, their broader application remains limited by technical complexity, stringent experimental requirements, and high costs."
      explanation: >-
        Supports both the HIGH fidelity for morphology and the practical limitations
        recorded on this link.
    - reference: PMID:41810407
      reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tissue implantation involves grafting human-derived uterine leiomyoma tissue into immunodeficient mice (e.g., SCID mice) subcutaneously or beneath the renal capsule, often supplemented with sustained hormone-release devices to preserve the histological characteristics of the original ULs"
      explanation: >-
        Describes the construction of the model, including the immunodeficient host that
        the boundary-omission divergence above rests on.

discussions:
- discussion_id: med12_mutation_growth_paradox
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    If MED12 exon-2 mutation is a gain-of-function driver present in most fibroids, why
    do MED12 wild-type tumors grow faster than mutant ones?
  attaches_to:
  - pathophysiology#Driver Mutation-Initiated Clonal Transformation
  - genetic#MED12 somatic exon-2 mutation
  rationale: >
    The entry records MED12 mutation as a gain-of-function driver, which is what the
    review literature says, and that reading invites the inference that the mutation
    drives growth. A 44-tumor series reports the opposite for growth specifically:
    wild-type leiomyomas have higher growth potential and higher MED12-associated CDK8
    kinase activity than mutant ones, and CDK8 inhibition suppresses wild-type cell
    growth in primary culture. One way to reconcile these is that the mutation is
    required for tumor initiation while wild-type tumors, once initiated by some other
    route, retain more intact Mediator-kinase output and therefore grow faster. That
    reconciliation is not established, and an entry that recorded only the
    gain-of-function label would hide the tension rather than resolve it.
  evidence:
  - reference: PMID:41493967
    reference_title: Impact of MED12 mutation and CDK8 activity on uterine leiomyoma growth and response to gonadotropin-releasing hormone agonist treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 44 leiomyomas tested, 11 MED12 wild-type leiomyomas without preoperative GnRH agonist treatment had significantly higher CDK8 activity than nine GnRH agonist-treated MED12 wild-type leiomyomas and 15 leiomyomas with MED12 mutations without GnRH agonist treatment."
    explanation: >-
      The measurement behind the controversy: CDK8 activity is highest in untreated
      wild-type tumors, lower in mutant ones.
  - reference: PMID:41493967
    reference_title: Impact of MED12 mutation and CDK8 activity on uterine leiomyoma growth and response to gonadotropin-releasing hormone agonist treatment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment of primary cultured MED12 wild-type cells with CDK8 inhibitors significantly inhibited cell growth and increased apoptosis."
    explanation: >-
      Shows the CDK8 activity is functionally load-bearing for growth in the wild-type
      tumors, which is what makes this a mechanistic question rather than a measurement
      artifact.

- discussion_id: hmb_dominant_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Which mechanism dominates fibroid-associated heavy menstrual bleeding: rupture of
    structurally deficient pseudocapsule neovessels, dilated venous lakes from mass
    effect, or TGF-beta-3-mediated endometrial hemostatic failure?
  attaches_to:
  - pathophysiology#Aberrant Pseudocapsule Angiogenesis and Venous Ectasia
  - pathophysiology#Endometrial Hemostatic Failure and Impaired Vessel Closure
  - phenotypes#Heavy Menstrual Bleeding
  rationale: >
    All three mechanisms are separately evidenced and this entry curates all three, but
    their relative contribution is unsettled and the candidate explanations make
    different predictions. The pseudocapsule account predicts bleeding should track
    fibroid location, since only intramural fibroids develop a pseudocapsule. The
    venous-lake account was originally attributed to interstitial pressure and later
    reattributed to growth factors enlarging the veins. The endometrial account is
    location-independent and predicts bleeding even from fibroids that do not distort
    the cavity. Distinguishing them matters clinically, because tranexamic acid and the
    levonorgestrel system act on the endometrial arm while embolization and ablation act
    on the vascular one.
  evidence:
  - reference: PMID:36303616
    reference_title: Uterine Fibroids (Leiomyomata) and Heavy Menstrual Bleeding.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These aberrations in vascular architecture and network could explain the heavy menstrual bleeding observed. However, other theories have been proposed such as venous trunks, or venous lakes caused by the blocking of normal blood flow by uterine fibroids, or the increased local action of vasoactive growth factors."
    explanation: >-
      The source itself frames these as competing theories under review rather than as a
      settled mechanism, which is the state this discussion records.

- discussion_id: eker_rat_driver_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does a Tsc2-driven rat tumor tell us anything about how a MED12-, HMGA2- or
    FH-driven human fibroid starts?
  attaches_to:
  - pathophysiology#Driver Mutation-Initiated Clonal Transformation
  - animal_models#Rat
  rationale: >
    The Eker rat is the workhorse spontaneous model and its tumors look and behave like
    human fibroids at the tissue and hormonal level, so results from it are routinely
    read as being about fibroid biology generally. But its lesion is a germline Tsc2
    mutation acting through mTOR, and none of the recurrent human somatic drivers is
    present. The mismatch is therefore not that evidence is missing but that evidence
    exists in a system whose initiating genotype is wrong, which is the distinction
    between a knowledge gap and a model mismatch. The practical consequence is that the
    developmental-exposure and vitamin D results obtained in this strain support the
    environmental records in this entry at the level of myometrial stem cell DNA repair,
    and do not support any claim about the human driver mutations themselves.
  evidence:
  - reference: PMID:41810407
    reference_title: "Preclinical research platform for uterine leiomyoma: construction optimization and selection of animal models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Current uterine fibroid animal models cannot fully reproduce the complex pathological process of human ULs, so optimization of current pathological models is needed."
    explanation: >-
      The review's own statement that no current animal model fully reproduces human
      fibroid pathology, which is the general form of this specific mismatch.

classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Assigned to the endocrinology and metabolism part, where Harrison's places
      disorders of the female reproductive system. The tumor is neoplastic but benign and
      its defining biology is ovarian-steroid dependence rather than malignant
      progression, so the oncology part would misplace it.
    evidence:
    - reference: PMID:33670322
      reference_title: "Vitamin D: Mechanism of Action and Biological Effects in Uterine Fibroids."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Uterine fibroids (UFs), also known as uterine leiomyomas or myomas, are the most frequent benign tumors in women of reproductive age."
      explanation: >-
        Supports the benign, reproductive-age character on which this part assignment
        rests rather than an oncological one.


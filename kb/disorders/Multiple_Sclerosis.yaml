name: Multiple Sclerosis
creation_date: '2025-12-04T16:57:31Z'
description: >-
  Multiple sclerosis (MS) is a chronic immune-mediated demyelinating disease of
  the central nervous system in which autoreactive T and B lymphocytes drive
  inflammatory demyelination, axonal damage, and gliotic plaque formation in the
  brain, optic nerves, and spinal cord. Clinical courses range from
  relapsing-remitting to progressive forms, producing accumulating sensory, motor,
  visual, and cognitive disability.
category: Neurological Disorder
parents:
- Autoimmune Disorder
inheritance:
- name: Multifactorial
  description: >
    MS is not a Mendelian disorder. Susceptibility is multifactorial with
    polygenic risk (HLA-DRB1*15:01 strongest locus) and environmental factors
    (EBV infection, vitamin D deficiency).
  evidence:
  - reference: PMID:40636815
    reference_title: "Multiple sclerosis: 2024 update."
    supports: PARTIAL
    snippet: recent data point towards a role of genetics in MS disease progression
    explanation: This review acknowledges the genetic component of MS but does not explicitly describe polygenic/multifactorial inheritance; the multifactorial model is well-established from GWAS literature.
prevalence:
- population: Global
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 36.0
  percentage: 0.036
  notes: "Approximately 2.8 million people affected worldwide; ~36 per 100,000 globally."
  evidence:
  - reference: PMID:30679040
    reference_title: "Global, regional, and national burden of multiple sclerosis 1990-2016: a systematic analysis for the Global Burden of Disease Study 2016."
    supports: SUPPORT
    snippet: In 2016, there were 2 221 188 prevalent cases of multiple sclerosis ... globally, which corresponded to a 10·4% ... increase in the age-standardised prevalence since 1990
    explanation: The GBD study estimated ~2.2 million prevalent cases globally in 2016, consistent with a prevalence of approximately 36 per 100,000.
  - reference: ORPHA:802
    reference_title: "Multiple sclerosis (Orphanet structured-database record)"
    supports: SUPPORT
    snippet: "NON RARE IN EUROPE: Multiple sclerosis"
    explanation: Orphanet classifies MS as non-rare in Europe, consistent with its relatively high prevalence.
- population: Europe
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 115.0
  percentage: 0.115
  notes: "Higher prevalence in northern European populations; approximately 115 per 100,000."
  evidence:
  - reference: PMID:37059571
    reference_title: "Incidence and prevalence of multiple sclerosis in China and other Asian countries."
    supports: SUPPORT
    snippet: Prevalence rates in countries with predominantly white populations are considerably higher and have increased over time, reaching 115 cases/100,000 population in 2015
    explanation: Prevalence in predominantly white European populations reaches approximately 115 per 100,000.
progression:
- phase: Relapsing-Remitting
  notes: Characterized by periods of neurological symptoms (relapses) followed by periods of partial or complete recovery (remissions).
  evidence:
  - reference: PMID:25997994
    reference_title: "Multiple Sclerosis Relapses: Epidemiology, Outcomes and Management. A Systematic Review."
    supports: SUPPORT
    snippet: Relapses (episodic exacerbations of neurological signs or symptoms) are a defining feature of relapsing-remitting multiple sclerosis (MS), the most prevalent MS phenotype.
    explanation: The abstract clearly states that relapses are a defining feature of relapsing-remitting MS, supporting the statement about periods of neurological symptoms followed by partial or complete recovery.
  - reference: PMID:34006674
    reference_title: "[Relapsing-Remitting Multiple Sclerosis]."
    supports: PARTIAL
    snippet: The relapsing-remitting type is a major clinical course in MS.
    explanation: This reference confirms that the relapsing-remitting type is a major clinical course in MS, aligning with the statement about periods of relapses and remissions.
  - reference: PMID:31971066
    reference_title: "Recovery of cognitive function after relapse in multiple sclerosis."
    supports: PARTIAL
    snippet: Cognitive impairment is common in multiple sclerosis (MS) but its manifestation as acute disease activity is underappreciated... In RG patients, SDMT declined from 55.2 to 44.6 at relapse and recovered to 51.7
    explanation: This study highlights cognitive function decline during relapses and subsequent recovery, supporting the characterization of MS by periods of neurological symptoms followed by recovery.
- phase: Secondary Progressive
  notes: Following an initial relapsing-remitting phase, there is a progressive worsening of neurological function over time.
  evidence:
  - reference: PMID:16545751
    reference_title: "Secondary progressive multiple sclerosis: current knowledge and future challenges."
    supports: SUPPORT
    snippet: The secondary progressive phase of multiple sclerosis (MS), which is characterised by a steady accrual of fixed disability after an initial relapsing remitting course, is not clearly understood.
    explanation: The reference describes secondary progressive MS as a phase that follows an initial relapsing-remitting course and is characterized by progressive worsening of neurological function.
  - reference: PMID:20946934
    reference_title: "Mechanisms of neuronal dysfunction and degeneration in multiple sclerosis."
    supports: SUPPORT
    snippet: This transforms into a disease of continuous and irreversible neurological decline by the sixth or seventh decade.
    explanation: The reference supports the statement by describing the transition from an initial phase with reversible episodes to a phase of continuous and irreversible neurological decline.
  - reference: PMID:24722325
    reference_title: "Relapsing and progressive forms of multiple sclerosis: insights from pathology."
    supports: SUPPORT
    snippet: The predominant clinical disease course of multiple sclerosis starts with reversible episodes of neurological disability, which transforms into progressive neurological decline.
    explanation: The reference supports the statement by describing the progression from relapsing episodes to a phase of progressive neurological decline.
- phase: Primary Progressive
  notes: >-
    A gradual progression of disability from onset without early relapses and
    remissions. The 1996 clinical-course descriptors additionally recognized a
    "progressive-relapsing" (PRMS) phenotype; the 2013 revisions re-examined
    those categories and replaced them with descriptors qualified by disease
    activity and progression, so patients previously labelled PRMS are now
    classified as primary progressive MS with activity. PRMS is therefore not
    curated as a separate course.
  evidence:
  - reference: PMID:33578205
    reference_title: "Definitions of primary-progressive multiple sclerosis trajectories by rate of clinical disability progression."
    supports: PARTIAL
    snippet: Patients with primary progressive multiple sclerosis (PPMS) vary in the rate of disability progression.
    explanation: The statement describes a gradual progression of disability from onset without early relapses and remissions, which aligns with the characteristics of primary progressive MS (PPMS).
  - reference: PMID:35977131
    reference_title: "Multiple Sclerosis: A Primary Care Perspective."
    supports: PARTIAL
    snippet: Types of MS include relapsing-remitting (most common), secondary progressive, and primary progressive.
    explanation: This reference supports the classification of MS into types, including primary progressive MS, which is characterized by a gradual progression of disability from onset without early relapses and remissions.
  - reference: PMID:29157397
    reference_title: "Progressive Forms of Multiple Sclerosis: Distinct Entity or Age-Dependent Phenomena."
    supports: PARTIAL
    snippet: Subclinical activity in radiologically isolated syndrome evolving to primary-progressive MS is mostly indistinguishable from relapsing-remitting MS evolving to secondary-progressive MS.
    explanation: This reference supports the concept of primary progressive MS, which involves a gradual progression of disability without the early relapses and remissions seen in relapsing-remitting MS.
  - reference: PMID:24871874
    reference_title: "Defining the clinical course of multiple sclerosis: the 2013 revisions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Standardized descriptions published in 1996 based on a survey of
      international MS experts provided purely clinical phenotypes based on
      data and consensus at that time, but imaging and biological correlates
      were lacking.
    explanation: >-
      The International Advisory Committee re-examined the 1996 clinical-course
      phenotypes, which is the revision that retired the progressive-relapsing
      category.
  - reference: PMID:24871874
    reference_title: "Defining the clinical course of multiple sclerosis: the 2013 revisions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      we propose refined descriptors that include consideration of disease
      activity (based on clinical relapse rate and imaging findings) and
      disease progression
    explanation: >-
      Documents that the current descriptors qualify the progressive phenotypes
      by activity rather than retaining a separate progressive-relapsing course.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_autoimmune_demyelination_neurodegeneration_model
  hypothesis_label: Canonical Autoimmune Demyelination and Neurodegeneration Model
  status: CANONICAL
  description: >-
    In genetically susceptible individuals (HLA-DRB1*15:01 and >200 additional risk variants), autoreactive CD4+ Th1/Th17 and CD8+ T cells, B cells, and plasmablasts cross the blood-brain barrier and orchestrate focal inflammatory demyelination of CNS white-matter and gray-matter lesions. The resulting myelin loss is paralleled by progressive axonal and neuronal damage, with chronic active ("smoldering") inflammation and meningeal lymphoid aggregates driving disability accumulation in progressive MS. EBV infection of B cells is now established as a near-necessary upstream environmental trigger. Disease-modifying therapies that deplete B cells (anti-CD20), sequester lymphocytes in lymph nodes by blocking their egress (S1P receptor modulators such as fingolimod), or block alpha4-integrin (VLA-4)-mediated lymphocyte migration across the blood-brain barrier into the CNS (natalizumab) provide direct interventional validation of the autoimmune arm of the canonical model.
  notes: >-
    Retained as CANONICAL with significant qualifications.
    The 2026 openscientist hypothesis-search report
    (kb/hypotheses/Multiple_Sclerosis/canonical_autoimmune_demyelination_neurodegeneration_model)
    finds three foundational pillars robustly validated: (1) EBV
    infection as a near-necessary upstream trigger (32-fold MS risk
    increase, Bjornevik et al. 2022); (2) polygenic immune susceptibility
    (HLA-DRB1*15:01 + >200 GWAS loci enriched for adaptive immunity);
    (3) therapeutic proof-of-concept from anti-CD20 B-cell depletion,
    S1P modulators, and natalizumab (relapse reduction 46-70%, MRI
    activity >90% reduction). Critical qualification for progressive MS:
    disability accumulation is driven predominantly by **progression
    independent of relapse activity (PIRA)**, reflecting compartmentalized
    CNS inflammation, chronic active "smoldering" lesions, meningeal
    lymphoid follicles, and neurodegeneration that does not respond to
    peripheral B-cell depletion. Anti-CD20 in primary progressive MS
    has modest effect, signaling the need for CNS-penetrant strategies.
  evidence:
  - reference: PMID:24507511
    reference_title: "Immune regulation of multiple sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple sclerosis (MS) is considered a prototype inflammatory autoimmune disorder of the central nervous system (CNS)"
    explanation: >
      Canonical mechanism review used as the seed reference for the
      hypothesis-search deep-research run.
- hypothesis_group_id: chronic_active_lesion_smouldering_inflammation_pira
  hypothesis_label: Compartmentalized Smouldering Chronic-Active-Lesion Inflammation Driving PIRA
  status: EMERGING
  description: >-
    A CNS-compartmentalized, innate-immune-driven mechanism proposes that
    disability accumulation in progressive MS is driven predominantly by
    progression independent of relapse activity (PIRA) rather than by acute
    peripheral-lymphocyte-mediated relapses. At the rim of chronic active
    ("smouldering") white-matter lesions — identifiable in vivo as iron-laden
    paramagnetic-rim lesions on MRI — a self-sustaining glial circuit maintains
    slow demyelination and axonal loss behind a relatively intact blood-brain
    barrier. Single-nucleus RNA-seq of the lesion edge (Absinta et al. 2021)
    defines disease-specific "microglia inflamed in MS" (MIMS) and "astrocytes
    inflamed in MS" states with neurodegenerative transcriptional programming,
    and implicates complement component 1q (C1q) as a critical upstream mediator
    of MIMS activation. Because this compartment sits behind the BBB, it is
    predicted to be refractory to peripheral B-cell depletion (consistent with
    the modest anti-CD20 effect in primary progressive MS) and to require
    CNS-penetrant, microglia/complement-directed strategies. The MIMS profile
    overlaps microglial states in other neurodegenerative diseases, suggesting a
    shared secondary-neurodegeneration mechanism.
  notes: >-
    Elevated from a qualification embedded in the CANONICAL model to its own
    EMERGING hypothesis because it makes distinct, testable predictions
    (BBB-compartmentalized innate/complement drive of PIRA; paramagnetic-rim
    lesions as a monitorable biomarker; CNS-penetrant complement/microglia
    targets) and is directly motivated by the single-nucleus dataset added to
    this entry (scea:E-GEOD-180759). An OpenScientist hypothesis-search
    deep-research run
    (kb/hypotheses/Multiple_Sclerosis/chronic_active_lesion_smouldering_inflammation_pira/)
    returned a PARTIALLY_SUPPORTED verdict, verified in the assessment sidecar
    (assessments/openscientist-assessment-by-claude-code.yaml; all load-bearing
    PMIDs confirmed real and quoted accurately). Well supported: the biomarker
    arm (paramagnetic-rim / slowly-expanding lesions predict PIRA) and the
    therapeutic / compartmentalization arm — the brain-penetrant BTK inhibitor
    tolebrutinib slows progression in non-relapsing SPMS (HERCULES phase 3,
    PMID:40202696) while peripheral anti-CD20 spares the astrocytic sGFAP marker
    and PIRMA (RIFUND-MS, PMID:41968564). Contested: the translation of the
    molecular core — C1q as an upstream driver of the MIMS state — from mouse
    EAE to human chronic active lesions. The seed study includes
    microglia-specific C1q ablation and therapeutic C1q blockade in mouse EAE,
    but longitudinal PPMS data associate elevated CSF C1q with lower progression
    risk (PMID:38912898), raising a compartment- and model-dependent
    interpretation question. Grey-matter and spinal-cord atrophy are a competing
    anatomical substrate for PIRA (PMID:41527428). Held at EMERGING pending
    independent human lesion-edge replication and evidence that the EAE C1q
    mechanism translates to human PIRA.
  evidence:
  - reference: PMID:34497421
    reference_title: "A lymphocyte-microglia-astrocyte axis in chronic active multiple sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We define 'microglia inflamed in MS' (MIMS) and 'astrocytes inflamed in MS', glial phenotypes that demonstrate neurodegenerative programming."
    explanation: >-
      Human single-nucleus RNA-seq defines the MIMS and inflamed-astrocyte states
      with neurodegenerative programming at the chronic active lesion edge.
  - reference: PMID:34497421
    reference_title: "A lymphocyte-microglia-astrocyte axis in chronic active multiple sclerosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identify complement component 1q (C1q) as a critical mediator of MIMS activation, validated immunohistochemically in MS tissue, genetically by microglia-specific C1q ablation in mice with experimental autoimmune encephalomyelitis, and therapeutically by treating chronic experimental autoimmune encephalomyelitis with C1q blockade."
    explanation: >-
      Microglia-specific C1q ablation and therapeutic C1q blockade provide direct
      causal perturbation evidence in mouse EAE. Whether that mechanism operates
      in human chronic active lesions remains the translational gap.
  - reference: PMID:41205558
    reference_title: "Paramagnetic iron rim lesions as a prognostic factor for disability progression in multiple sclerosis: A systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRLs are associated with an increased risk of MS progression through PIRA."
    explanation: >-
      A systematic review of five studies and 744 patients supports paramagnetic
      rim lesions as prognostic imaging markers for PIRA and confirmed
      disability progression.
  - reference: PMID:41968564
    reference_title: "Dimethyl Fumarate, But Not Rituximab, Reduces Serum GFAP Levels and PIRMA in Relapsing-Remitting MS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of progression independent of relapse and MRI activity (PIRMA) was higher with RTX (HR 3.3, CI 1.1-10, p = 0.04)."
    explanation: >-
      RIFUND-MS supports dissociation between peripheral B-cell depletion and
      non-inflammatory progression, consistent with a compartmentalized CNS
      process, while not proving a lesion-rim or C1q mechanism.
  - reference: PMID:40202696
    reference_title: "Tolebrutinib in Nonrelapsing Secondary Progressive Multiple Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A smaller percentage of participants in the tolebrutinib group than in the placebo group had confirmed disability progression sustained for at least 6 months (22.6% vs. 30.7%; hazard ratio, 0.69; 95% confidence interval, 0.55 to 0.88; P = 0.003)."
    explanation: >-
      Phase 3 HERCULES trial: a CNS-penetrant, myeloid/microglia-directed BTK
      inhibitor slows relapse-independent progression in non-relapsing SPMS —
      the therapeutic prediction of the BBB-compartmentalized model. Surfaced and
      verified via the OpenScientist run. Does not by itself prove the benefit is
      mediated by lesion-rim microglia (no PRL-mediation analysis exists).
  - reference: PMID:38912898
    reference_title: "Association of Complement Factors With Disability Progression in Primary Progressive Multiple Sclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "increased CSF C1q levels predicted lower disability progression (adjusted OR 0.41; 95% CI 0.17-0.86; p = 0.025)"
    explanation: >-
      Complicates direct translation of the lesion-rim C1q mechanism: elevated
      bulk CSF C1q predicted lower disability progression in a longitudinal PPMS
      cohort. The different compartment and analyte do not directly refute local
      microglial C1q activity, but require a compartment-resolved interpretation.
pathophysiology:
- name: Demyelination
  description: The immune system attacks and destroys myelin, the protective sheath around nerve fibers, disrupting nerve signal transmission.
  downstream:
  - target: Neurological Disability
    description: Autoimmune demyelination and neuronal loss lead to progressive neurological disability.
    evidence:
    - reference: PMID:40636815
      reference_title: "Multiple sclerosis: 2024 update."
      supports: SUPPORT
      snippet: Multiple sclerosis (MS) is a complex immune-mediated disease that leads to neurological disability
      explanation: This 2024 review explicitly states the causal relationship between the immune-mediated (autoimmune) nature of MS and neurological disability.

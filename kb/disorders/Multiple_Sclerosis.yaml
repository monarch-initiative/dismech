computational_models:
- name: UISS-MS Agent-Based Treatment Simulator
  description: >-
    Multiscale, multi-compartment agent-based model of relapsing-remitting
    multiple sclerosis. Its physiology layer represents innate and adaptive
    immune agents; its MS disease layer represents antigen presentation,
    Th1/Th17 and B-cell responses, blood-brain-barrier migration, CNS
    inflammation, and oligodendrocyte loss; and its treatment layers simulate
    cladribine and ocrelizumab. Retrospective virtual cohorts were selected to
    match aggregate CLARITY and OPERA trial characteristics and outcomes.
  model_type: AGENT_BASED
  model_software: Universal Immune System Simulator (UISS)
  publication: PMID:37266405
  modeled_mechanisms:
  - target: Th1/Th17-Mediated Neuroinflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The disease layer explicitly represents cytokine-dependent Th1 and Th17
      differentiation, migration across the blood-brain barrier, reactivation
      in the CNS, and inflammatory interactions with microglia and other immune
      agents.
    limitations: >-
      The immune rules are a mechanistic abstraction assembled from a conceptual
      ontology rather than fitted to longitudinal cellular or cytokine data from
      individual patients. Validation is against aggregate relapse and safety
      outcomes in selected RRMS-like virtual populations, not direct
      measurements of Th1/Th17 states. Progressive MS and compartmentalized
      chronic CNS inflammation are outside the demonstrated validation scope.
    evidence:
    - reference: PMID:37266405
      reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Th17 cells secrete various cytokines, including IL-17, IL-6, IL-21,
        IL-22, IL-23, and TNF-α. Subsequently, these cells migrate across the
        blood-brain barrier (BBB) to the central nervous system (CNS) under the
        influence of specific cytokines, namely IL-17, IL-6, and IL-22, as well
        as IL-23, provided that the inhibitory effects of IL-10 are absent.
      explanation: >-
        Describes the Th17 cytokine and CNS-migration processes represented in
        the model's MS conceptual layer.
  - target: Demyelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Immune-agent interactions drive loss of modeled oligodendrocytes, which is
      used as the simulation's cellular proxy for myelin injury and relapse.
    limitations: >-
      Demyelination is reduced to oligodendrocyte loss in a simulated 3-mm3
      white-matter volume. The model does not resolve myelin ultrastructure,
      tract-specific conduction, remyelination, or axonal injury, and the
      oligodendrocyte-loss threshold is not an individualized imaging model.
    readouts:
    - name: Oligodendrocyte loss during simulated relapse
      target: Demyelination
      direction: INCREASED
      interpretation: >-
        Rapid loss of modeled oligodendrocytes is the disease-layer readout for
        a demyelinating event; treatment benefit appears as fewer such losses.
      evidence:
      - reference: PMID:37266405
        reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          The plots represent the number of oligodendrocytes cells during time
          expressed in days, and relapse is shown as a rapid reduction in cell
          number.
        explanation: >-
          Defines the simulated oligodendrocyte-count change used to represent a
          relapse-associated demyelinating event.
    evidence:
    - reference: PMID:37266405
      reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        In the CNS, activated helper T cells engage with resident microglia.
        Upon recognition of myelin antigens, the microglia are reactivated and
        produce specific cytokines (such as IL-1, IL-6, IL-12, TNF-α, IFN-γ,
        and IL-2) and chemokines that activate Th1 and Th17 cells, leading to an
        inflammatory cascade and subsequent destruction of oligodendrocytes.
      explanation: >-
        Connects the model's immune cascade to its explicit oligodendrocyte-loss
        representation.
  - target: Inflammatory Lesions
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      UISS-MS converts sufficiently large simulated oligodendrocyte-loss events
      into MRI-detectable relapses, providing a coarse lesion-level output for
      comparison with clinical-trial relapse data.
    limitations: >-
      A fixed loss of 50,000 oligodendrocytes is used as the MRI-detection
      threshold. This is a derived event proxy, not a spatial lesion-growth or
      MRI-physics model, and it does not reproduce lesion topography, contrast
      enhancement, immune-cell composition, chronic-active rims, or lesion-wise
      uncertainty.
    readouts:
    - name: MRI-detectable relapse event
      target: Inflammatory Lesions
      interpretation: >-
        An oligodendrocyte-loss event at or above the fixed threshold is counted
        as one or more MRI-detectable lesions for trial-level relapse analysis.
      evidence:
      - reference: PMID:37266405
        reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          The minimum MRI detectable threshold is set as a lesion involving at
          least 50 × 103 ODC, which assumes a uniform distribution of ODCs in
          the white matter tissue.
        explanation: >-
          Gives the model's explicit threshold for translating oligodendrocyte
          loss into an MRI-detectable lesion event.
    evidence:
    - reference: PMID:37266405
      reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Other forms are related to a consistent oligodendrocytes loss that
        instead provokes an MRI-detectable lesion. Only relapses that are
        detectable by MRI were considered in our analysis.
      explanation: >-
        Establishes the lesion proxy and the MRI-detectable subset used in the
        reported trial comparisons.
  variables:
  - name: Activated Th1-cell population
    dataset_identifier: Th1
    description: Modeled Th1 immune-agent population and activation state.
    unit: simulated cells
  - name: Activated Th17-cell population
    dataset_identifier: Th17
    description: Modeled Th17 immune-agent population and activation state.
    unit: simulated cells
  - name: Oligodendrocyte count
    dataset_identifier: ODC
    description: >-
      Cellular state whose rapid loss represents demyelinating relapse in the
      simulated white-matter compartment.
    unit: cells
  - name: MRI-detectable lesion event
    description: >-
      Event declared when oligodendrocyte loss reaches the fixed detection
      threshold.
    unit: event count
  - name: Annualized relapse rate
    dataset_identifier: ARR
    description: Trial-level relapse-rate output used for OPERA comparison.
    unit: relapses per patient-year
  - name: Absolute lymphocyte count
    dataset_identifier: ALC
    description: Treatment-safety output used to grade cladribine-associated lymphocytopenia.
    unit: cells/uL
  findings:
  - statement: >-
      In the OPERA simulations, predicted annualized relapse rates were 0.193
      for ocrelizumab versus 0.16 observed and 0.349 for interferon beta-1a
      versus 0.29 observed; the predicted relative reduction was 45.7% versus
      50% in the clinical trial.
    evidence:
    - reference: PMID:37266405
      reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        As one can envisage from the analysis of Table 1, the ARR among patients
        receiving ocrelizumab at 96 weeks is predicted to be 0.193 against real
        Opera RCT of 0.16. ARR IFNβ− 1a is predicted to be 0.349, compared
        with real Opera RCT 0.29. The in silico trial of the Opera study
        predicted a relative reduction of 45.7 % on ocrelizumab compared to
        IFNβ− 1a. This is in excellent agreement with the 50 % relative
        reduction predicted in the real RCT, given that the digital patients can
        own more variability than those enrolled in the Opera RCT.
      explanation: >-
        Supplies the exact simulated and observed OPERA relapse-rate comparisons.
  - statement: >-
      Retrospective virtual cohorts reproduced the reported directions of
      cladribine and ocrelizumab treatment outcomes.
    evidence:
    - reference: PMID:37266405
      reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The obtained results mirror those of the clinical trials, demonstrating
        that UISS-MS can correctly simulate the mechanisms of action and
        outcomes of the treatments.
      explanation: >-
        States the publication's retrospective treatment-validation conclusion.
  evidence:
  - reference: PMID:37266405
    reference_title: "Moving forward through the in silico modeling of multiple sclerosis: Treatment layer implementation and validation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Universal Immune System Simulator is an agent-based model that simulates
      the human immune system dynamics under physiological conditions and during
      several diseases, including multiple sclerosis.
    explanation: >-
      Establishes UISS-MS as a disease-relevant agent-based immune-system model.
  notes: >-
    A curator search on 2026-08-20 identified no public UISS-MS source
    repository, executable archive, or software license. The article is open
    access, but that does not license the simulator. Although the authors
    describe a digital-twin use case, this study had only population-level
    demographic inputs: thousands of immune repertoires were generated and
    subsets were selected to match aggregate trial behavior. It therefore does
    not validate one-to-one patient twins or prospective individual
    counterfactuals. The CLARITY cohort was used in selection/calibration before
    the extension analysis, and formal VVUQ and regulatory credibility
    assessment remained future work.
- name: Virtual Multiple Sclerosis Patient Whole-Brain Model
  description: >-
    Subject-specific delayed whole-brain model that couples 84 noisy
    Stuart-Landau oscillators according to each participant's DTI-derived
    connectome. Simulation-based Bayesian inference uses source-reconstructed
    MEG alpha-spectrum features to estimate a global coupling parameter and one
    average whole-brain conduction velocity for each participant.
  model_type: DIGITAL_TWIN
  repository_url: https://github.com/ins-amu/virtual_ms/tree/67cb165d2631f73cfae79643accf7bae3e7b4ef1
  base_model: Delayed Stuart-Landau subject-specific whole-brain network
  model_software: Python, C++/SWIG, Jupyter, PyTorch sbi
  model_format: Python/C++ source and Jupyter notebooks
  publication: PMID:38974971
  modeled_mechanisms:
  - target: Demyelination
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The inverse model treats slower large-scale signal propagation as a
      functional consequence of myelin damage and infers an individual average
      conduction velocity from the participant's connectome and MEG spectrum.
    limitations: >-
      The model does not simulate immune attack, myelin loss, lesion formation,
      remyelination, or axonal injury. It collapses spatially heterogeneous
      conduction into one homogeneous whole-brain velocity, and alpha-spectrum
      changes can also arise from excitation/inhibition balance, 1/f structure,
      or thalamic-loop changes. The evidence comes from 18 patients and 20
      controls at one site; EDSS was available for 17 patients, and no external
      or longitudinal validation cohort was used.
    readouts:
    - name: Inferred average whole-brain conduction velocity
      target: Demyelination
      direction: DECREASED
      interpretation: >-
        A lower inferred velocity is interpreted as the aggregate functional
        effect of myelin damage, not a direct measurement of lesion-wise
        demyelination.
      evidence:
      - reference: PMID:38974971
        reference_title: "The virtual multiple sclerosis patient."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          The posterior distribution of the parameter G, which scales the
          structural connectivity of subjects, demonstrated non-significant
          changes (p = 0.87), whereas the posterior distribution of averaged
          velocities V significantly decreased (p < 0.01) in MS patients as
          compared to the control group.
        explanation: >-
          Reports the disease-direction result for the inferred conduction
          velocity readout.
    evidence:
    - reference: PMID:38974971
      reference_title: "The virtual multiple sclerosis patient."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        In conclusion, we propose a principled way to link the most relevant
        physiopathological feature in MS, namely the slower conduction
        velocities across the brain network induced by myelin damage, to a
        large-scale observable quantity, that is the modification of the
        frequency spectrum.
      explanation: >-
        Directly connects myelin damage, slower conduction, and the spectral
        observable used for model inversion.
  variables:
  - name: Global coupling strength
    dataset_identifier: G
    description: Scalar multiplying each subject's structural-connectivity matrix.
    unit: model coupling parameter
  - name: Average whole-brain conduction velocity
    dataset_identifier: V
    description: >-
      Subject-level homogeneous conduction-speed parameter inferred by
      simulation-based Bayesian inversion.
    unit: m/s
  - name: Alpha peak frequency
    dataset_identifier: peak_frequency
    description: Frequency of the median source-reconstructed MEG alpha-spectrum peak.
    unit: Hz
  - name: Alpha peak amplitude
    dataset_identifier: peak_amplitude
    description: Peak amplitude of the median 8-13-Hz power spectral density.
    unit: power spectral density
  - name: Total alpha power
    dataset_identifier: total_alpha_power
    description: Area under the median power spectral density from 8 to 13 Hz.
    unit: integrated power spectral density
  findings:
  - statement: >-
      Inferred average conduction velocity was lower in the 18-person MS group
      than in 20 controls, while global coupling did not differ.
    evidence:
    - reference: PMID:38974971
      reference_title: "The virtual multiple sclerosis patient."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The posterior distribution of the parameter G, which scales the
        structural connectivity of subjects, demonstrated non-significant
        changes (p = 0.87), whereas the posterior distribution of averaged
        velocities V significantly decreased (p < 0.01) in MS patients as
        compared to the control group.
      explanation: >-
        Gives the group comparisons for both inferred model parameters.
    - reference: PMID:38974971
      reference_title: "The virtual multiple sclerosis patient."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        To test our hypotheses, we used source-reconstructed MEG data and
        tractographies from 18 MS patients and 20 healthy controls.
      explanation: >-
        Supplies the sample sizes stated in the finding.
  - statement: >-
      Inferred conduction velocities were stronger predictors of clinical
      disability than structural damage in this cohort.
    evidence:
    - reference: PMID:38974971
      reference_title: "The virtual multiple sclerosis patient."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Remarkably, these velocities proved superior predictors of clinical
        disability compared to structural damage.
      explanation: >-
        States the reported clinical-prediction comparison for inferred velocity.
  evidence:
  - reference: PMID:38974971
    reference_title: "The virtual multiple sclerosis patient."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      In this study, we integrate diffusion tensor immaging (DTI) and
      magnetoencephalography (MEG) data into individualized virtual brain models
      to estimate conduction velocities for MS patients and controls.
    explanation: >-
      Establishes the individualized multimodal model and its inferred quantity.
  notes: >-
    Curator inspection on 2026-08-20 used repository commit
    67cb165d2631f73cfae79643accf7bae3e7b4ef1 (also tagged v1.0). No LICENSE file
    or license grant was present; an MIT classifier in setup.py is not sufficient
    to license the code. The repository contains the delayed Stuart-Landau
    forward solver and an SBI demonstration, but not the clinical connectomes,
    MEG inputs, trained posterior, or complete 38-subject analysis. In the
    curator's smoke test, the default install failed to build the SWIG extension;
    after a manual build and dependency repairs, a synthetic three-node forward
    simulation produced finite time series and an alpha-band PSD. Curator
    comparison also found material paper/code differences in simulation
    duration, noise scale, priors, alpha band, and feature count. Reproducing the
    clinical findings therefore requires restricted data and missing workflow
    components. The paper reports a patent application and calls for larger
    multicenter replication.
- name: Lesion-Aware Personalized Whole-Brain Conduction-Delay Model
  description: >-
    Direct successor to the Virtual Multiple Sclerosis Patient model. It retains
    each participant's 84-region DTI connectome and noisy Stuart-Landau dynamics
    but augments distance-derived edge delays based on a shared whole-brain
    velocity with an additive tract-specific term derived from the fraction of
    each tract intersecting the participant's FLAIR lesion mask. Simulation-based
    inference estimates the patient-specific strength of the lesion-to-delay
    relationship.
  model_type: DIGITAL_TWIN
  base_model: Virtual Multiple Sclerosis Patient whole-brain model (PMID:38974971)
  model_software: Custom Stuart-Landau simulator with the SBI toolbox
  publication: PMID:40317832
  modeled_mechanisms:
  - target: Demyelination
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The model maps the fraction of each white-matter tract occupied by a
      patient-specific lesion to an additional edge-specific conduction delay,
      then infers a subject-level lesion-effect parameter from MEG spectra.
    limitations: >-
      FLAIR lesion fraction is an imaging proxy, not a direct measure of myelin
      thickness, axon diameter, or active inflammation. The model does not
      generate lesions or simulate immune attack, remyelination, axonal damage,
      or progression. One scalar gamma applies the same lesion-to-delay rule to
      all affected tracts, source reconstruction is vulnerable to volume
      conduction, and alternative mechanisms can alter alpha spectra. The same
      18-patient/20-control source cohort as the 2024 study was used, without
      longitudinal or external validation.
    readouts:
    - name: Lesion-weighted tract conduction delay
      target: Demyelination
      direction: INCREASED
      interpretation: >-
        More lesion involvement adds a larger modeled delay on the affected
        tract; this is a personalized functional proxy rather than direct
        lesion-wise electrophysiology.
      evidence:
      - reference: PMID:40317832
        reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          In this work, we use large-scale brain models and Bayesian model
          inversion to estimate how myelin lesions translate to longer
          conduction delays across the damaged tracts.
        explanation: >-
          Directly supports the increased-delay direction of the lesion-weighted
          tract readout.
    - name: Alpha-spectrum peak amplitude as lesion-effect weight increases
      target: Demyelination
      direction: DECREASED
      interpretation: >-
        Lower simulated alpha peak amplitude with larger lesion-effect weight is
        the spectral feature used to invert the patient-specific parameter.
      evidence:
      - reference: PMID:40317832
        reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          In Figure 2c, one can observe the changes in the amplitude and
          frequency of the peak, as well as the variations in the area under the
          PSD, calculated from the alpha spectrum as a function of γ. All these
          spectral features decrease as γ increases.
        explanation: >-
          Gives the simulated direction of alpha peak frequency, amplitude, and
          area as the lesion-effect parameter increases.
    evidence:
    - reference: PMID:40317832
      reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        In this work, we use large-scale brain models and Bayesian model
        inversion to estimate how myelin lesions translate to longer conduction
        delays across the damaged tracts.
      explanation: >-
        Establishes the model's lesion-informed, patient-specific conduction
        delay objective.
  variables:
  - name: Tract lesion fraction
    dataset_identifier: l_jk
    description: >-
      Fraction of voxels in the tract between regions j and k that intersect the
      participant's FLAIR lesion mask.
    unit: proportion
  - name: Lesion-to-delay weight
    dataset_identifier: gamma
    description: >-
      Subject-level parameter controlling how strongly tract lesion fraction
      increases propagation delay.
    unit: model delay parameter
  - name: Edge-specific conduction delay
    dataset_identifier: tau_jk
    description: >-
      Baseline distance-over-velocity delay plus the lesion-weighted delay term
      for a structural connection.
    unit: s
  - name: Global coupling strength
    dataset_identifier: G
    description: Scalar multiplying the participant's structural-connectivity matrix.
    unit: model coupling parameter
  - name: Alpha peak amplitude
    dataset_identifier: peak_amplitude
    description: Empirical or simulated alpha-spectrum peak used in model inversion.
    unit: power spectral density
  findings:
  - statement: >-
      The inferred lesion-to-delay weight correlated inversely with alpha peak
      power (r=-0.83), whereas total lesion load did not correlate with alpha
      peak power or the inferred weight.
    evidence:
    - reference: PMID:40317832
      reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We show that the most plausible γ values for the subjects relate, as
        expected, to the power in the alpha band (Figure 4a) (r = −0.83,
        p = 0.00). However, the lesion load itself does not relate to the
        amplitude of the alpha-peak nor to the γ parameter (r = 0.00, p = 0.9,
        r = −0.38, p = 0.12, respectively), showing that the weighting of the
        lesions, that is, the effect that they exert on the slowing of conduction
        velocities, is likely topography-dependent and, as such, patient
        specific.
      explanation: >-
        Supplies the spectral correlation and the negative total-lesion-load
        comparisons that motivate tract-specific personalization.
  - statement: >-
      Adding the inferred lesion-effect parameter to the cross-sectional EDSS
      model yielded leave-one-out R2=0.29882 and adjusted R2=0.018348, but its
      coefficient was not statistically significant (p=0.1784).
    evidence:
    - reference: PMID:40317832
      reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The parameter γ enhances prediction accuracy in both classical
        multilinear (R2 = 0.2793; AdjR2 = 0.017226) (age β = 0.0227
        ρ = 0.7328; duration β = 0.0015 ρ = 0.7547; lesion load β = −0.0000
        ρ = 0.5921; γ β = −3.3099 ρ = 0.1366) and cross-validated models
        (R2 = 0.29882; AdjR2 = 0.018348) (age β = 0.0327 ρ = 0.7229;
        duration β = 0.0011 ρ = 0.7421; lesion load β = 0.0000 ρ = 0.5968;
        γ β = −3.3972 ρ = 0.1784).
      explanation: >-
        Preserves the weak adjusted fit and nonsignificant gamma coefficient
        that qualify the abstract's cross-sectional prediction claim.
    - reference: PMID:40317832
      reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The model has been validated using a leave-one-out cross-validation
        scheme.
      explanation: >-
        Identifies the cross-validation scheme used for the reported fit.
    - reference: PMID:40317832
      reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Adding γ to the predictive model enhances the predictive power on
        clinical disability, although without reaching statistical significance,
        as shown in Supporting Information Figure S2.
      explanation: >-
        Grounds the nonsignificant result in the authors' prose rather than only
        interpreting the reported coefficient statistic.
  evidence:
  - reference: PMID:40317832
    reference_title: "Mapping Brain Lesions to Conduction Delays: The Next Step for Personalized Brain Models in Multiple Sclerosis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This study represents the initial exploration showcasing the
      location-specific impact of myelin lesions on conduction delays, thereby
      enhancing the customization of models for individuals with multiple sclerosis.
    explanation: >-
      States the patient-specific purpose and exploratory scope of the model.
  notes: >-
    A curator search on 2026-08-20 identified no paper-specific code repository
    or executable model archive, and the clinical inputs are available only on
    request. Curator inspection found that the open VBI package contains generic
    Stuart-Landau and SBI components but not this paper's lesion-specific
    gamma-by-tract formulation, so it is not cited as the model artifact. The
    article is CC BY 4.0, which licenses the paper rather than an unreleased
    implementation. Synthetic parameter recovery had slope 0.8 and showed
    boundary bias. The clinical analysis reuses the small cross-sectional source
    cohort from the 2024 model; the gamma term was not a statistically
    significant EDSS predictor, and longitudinal validation is still needed.
treatments:
- name: Disease-Modifying Therapies (DMTs)
  description: Medications that can slow the progression of the disease and reduce the frequency and severity of relapses.
  examples:
  - Interferon-beta
  - Glatiramer Acetate
  - Natalizumab
  - Fingolimod
  evidence:
  - reference: PMID:12894379
    reference_title: "Current disease-modifying therapies in multiple sclerosis."
    supports: SUPPORT
    snippet: In recent years, the usefulness of interferon beta and glatiramer acetate in the treatment of relapsing-remitting multiple sclerosis (RRMS) has been established.
    explanation: The reference confirms the efficacy of interferon beta and glatiramer acetate in treating RRMS, which aligns with the statement about DMTs reducing the frequency and severity of relapses.
  - reference: PMID:24494618
    reference_title: "Multiple sclerosis update."
    supports: SUPPORT
    snippet: Diseasemodifying drugs (DMDs) that reduce the frequency of relapses, development of brain lesions, and progression of disability are the standard of care for relapsing forms of MS, and the use of DMDs should be initiated as early as possible
    explanation: The reference supports the statement by indicating that DMDs reduce the frequency of relapses and progression of disability in MS.
  - reference: PMID:29921609
    reference_title: "Effects of multiple sclerosis disease-modifying therapies on employment measures using patient-reported data."
    supports: PARTIAL
    snippet: Those using the higher efficacy (category 3) DMTs, particularly fingolimod and natalizumab, reported significant increases in amount of work, work attendance and work productivity, suggesting they have important beneficial effects on work life in people with MS.
    explanation: The reference supports the statement by highlighting the beneficial effects of fingolimod and natalizumab on patients' work life, indirectly supporting their role in reducing the severity of relapses.
  - reference: PMID:27549763
    reference_title: "Disease modifying therapies for relapsing multiple sclerosis."
    supports: PARTIAL
    snippet: Disease modifying therapies (DMTs) approved for relapsing multiple sclerosis interfere with a variety of immunological mechanisms to reduce rates of relapse, accumulation of disease burden measured by magnetic resonance imaging (MRI), and decline in neurological function over the two to three year duration of typical randomized controlled trials.
    explanation: The reference supports the statement regarding the reduction of relapse rates and disease burden but notes that the benefits on long-term disability reduction are less clear.
  - reference: PMID:32560364
    reference_title: "Approved and Emerging Disease Modifying Therapies on Neurodegeneration in Multiple Sclerosis."
    supports: PARTIAL
    snippet: Several FDA-approved medications seek to alleviate disease progression by reducing the impact of such factors as demyelination and neurodegeneration
    explanation: The reference supports the statement by indicating that FDA-approved medications aim to alleviate disease progression and reduce neurodegeneration, which aligns with the description of DMTs.
  - reference: PMID:39737584
    reference_title: "Disease-modifying therapy in multiple sclerosis: recommendations of Multiple Sclerosis and Neuroimmunology Section of Polish Neurological Society."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The initiation of DMT with interferon beta or glatiramer acetate may be considered in appropriate cases in patients with CIS who do not meet the criteria for the diagnosis of MS."
    explanation: The Polish Neurological Society MS recommendations advise initiating disease-modifying therapy (e.g., interferon beta or glatiramer acetate) in appropriate CIS patients.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Th1/Th17-Mediated Neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Disease-modifying therapies (interferons, natalizumab, fingolimod, and
      others) suppress autoreactive Th1 and Th17 lymphocyte trafficking into
      the CNS and reduce pro-inflammatory cytokine production that drives
      demyelinating lesion formation.
  - target: Inflammatory Lesions
    treatment_effect: INHIBITS
    description: >-
      DMTs reduce the frequency of new gadolinium-enhancing lesions by limiting
      CNS immune cell infiltration and the inflammatory cascade that underlies
      acute demyelinating plaque formation.
- name: Anti-CD20 B-cell Depletion Therapy
  description: >-
    Anti-CD20 monoclonal antibodies (ocrelizumab, ofatumumab) selectively
    deplete CD20+ B lymphocytes, providing direct interventional validation of
    the B-cell arm of MS pathogenesis. They markedly reduce relapse rate and MRI
    activity in relapsing MS, and ocrelizumab is the first therapy shown to
    modestly slow confirmed disability progression in primary progressive MS.
  examples:
  - Ocrelizumab

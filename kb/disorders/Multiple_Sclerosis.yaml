discussions:
- discussion_id: gap_ms_c1q_eae_human_translation
  prompt: >-
    Does the causal C1q-to-MIMS mechanism demonstrated by microglia-specific C1q
    ablation and therapeutic blockade in mouse EAE operate at human chronic
    active lesion rims and contribute to PIRA?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Compartmentalized CNS Inflammation
  - pathophysiology#Axonal Damage
  rationale: >-
    Direct perturbation evidence exists in mouse EAE, so the gap is not absence
    of causal evidence. The unresolved issue is human translation and
    compartment specificity: the lesion-rim study implicates C1q in MIMS, while
    higher bulk CSF C1q predicted less progression in PPMS. Human lesion-edge
    perturbation or spatially resolved target-engagement data are needed to
    determine whether local microglial C1q has a different role from CSF C1q.
  evidence:
  - reference: PMID:34497421
    reference_title: "A lymphocyte-microglia-astrocyte axis in chronic active multiple sclerosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We identify complement component 1q (C1q) as a critical mediator of MIMS activation, validated immunohistochemically in MS tissue, genetically by microglia-specific C1q ablation in mice with experimental autoimmune encephalomyelitis, and therapeutically by treating chronic experimental autoimmune encephalomyelitis with C1q blockade."
    explanation: Establishes causal perturbation evidence in mouse EAE.
  - reference: PMID:38912898
    reference_title: "Association of Complement Factors With Disability Progression in Primary Progressive Multiple Sclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "increased CSF C1q levels predicted lower disability progression (adjusted OR 0.41; 95% CI 0.17-0.86; p = 0.025)"
    explanation: Shows that human CSF C1q has a protective prognostic association, motivating compartment-resolved testing.
- discussion_id: controversy_ms_pira_anatomical_substrate
  prompt: >-
    How much PIRA is attributable to chronic active white-matter lesion-rim
    inflammation versus spinal-cord and gray-matter degeneration?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Compartmentalized CNS Inflammation
  - pathophysiology#Axonal Damage
  rationale: >-
    Paramagnetic rim lesions predict PIRA, but independent imaging cohorts find
    spinal-cord atrophy and cortical/deep-gray-matter degeneration to be the
    strongest predictors of severity and progression. These substrates may be
    complementary or competing, and their relative causal contribution remains
    unresolved.
  evidence:
  - reference: PMID:41527428
    reference_title: "Spinal Cord Atrophy and Cortical Degeneration Are the Strongest Predictors of Multiple Sclerosis Severity and Progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal cord atrophy consistently emerged as the strongest predictor of disability severity and predicted PIRA, along with cortical thinning and subcortical atrophy - particularly in deep gray matter."
    explanation: Identifies cord and gray-matter degeneration as strong alternative or complementary PIRA substrates.


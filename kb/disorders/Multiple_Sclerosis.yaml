    tissue_term:
      preferred_term: white matter
      term:
        id: UBERON:0002316
        label: white matter
  conditions:
  - chronic active multiple sclerosis lesion edge
  - demyelinated white matter
  platform: single-nucleus RNA-seq (10x Genomics)
  publication: PMID:34497421
  evidence:
  - reference: PMID:34497421
    reference_title: "A lymphocyte-microglia-astrocyte axis in chronic active multiple sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI-informed single-nucleus RNA sequencing to profile the edge of demyelinated white matter lesions at various stages of inflammation"
    explanation: >-
      Human single-nucleus RNA-seq of the chronic active lesion edge (harmonized
      as SCEA E-GEOD-180759) resolves the disease-specific microglial (MIMS) and
      astrocytic states driving compartmentalized inflammation at the paramagnetic
      rim, a leading mechanism of non-relapsing MS progression.
  notes: >-
    Aggregator provenance: the harmonized re-analysis is hosted by the EBI Single
    Cell Expression Atlas (accession E-GEOD-180759); the primary deposit is GEO
    GSE180759 and the underlying study is Absinta et al., Nature 2021
    (PMID:34497421, DOI:10.1038/s41586-021-03892-7). The study additionally used a
    mouse EAE model for C1q validation; only the human lesion snRNA-seq is cited
    here (evidence_source HUMAN_CLINICAL).

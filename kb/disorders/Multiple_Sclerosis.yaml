- accession: scea:E-GEOD-180759
  title: Single-nucleus RNA-seq of the demyelinated white-matter lesion edge in chronic active multiple sclerosis
  description: >-
    EBI Single Cell Expression Atlas harmonized re-analysis (194,181 nuclei) of the
    Absinta et al. MRI-informed single-nucleus RNA-seq profiling of the edge of
    demyelinated white-matter lesions at various stages of inflammation. Defines
    "microglia inflamed in MS" (MIMS) and "astrocytes inflamed in MS" glial states
    with neurodegenerative programming at the chronically inflamed lesion rim, and
    implicates complement component 1q (C1q) as a mediator of MIMS activation —
    single-cell resolution of the compartmentalized, smouldering inflammation that
    underlies progression independent of relapse activity.
  organism:
    preferred_term: human
    term:

environmental:
- name: Vitamin D Deficiency
  influences_mechanisms:
  - target: Th1/Th17-Mediated Neuroinflammation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Graded below the Epstein-Barr link into this same node. The second item
      is the more interesting of the two and the reason this link is drawn at
      all: a low-frequency coding variant that raises the risk of vitamin D
      insufficiency also raises the odds of this disease, which is a
      genetic-instrument argument rather than another observational
      association. Both items stop at disease risk.
    evidence:
    - reference: PMID:28757204
      reference_title: "Low-Frequency Synonymous Coding Variation in CYP2R1 Has Large Effects on Vitamin D Levels and Risk of Multiple Sclerosis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "By analyzing 8,711 individuals, we showed that heterozygote carriers of this low-frequency variant have an increased risk of vitamin D insufficiency... Individuals carrying one copy of this variant also had increased odds of multiple sclerosis..."
      explanation: >-
        Carriers of a variant that increases the risk of vitamin D
        insufficiency also have increased odds of this disease. A genetic
        instrument, which is harder to confound than an observational
        association, but still measured against disease risk.
    - reference: PMID:20494325
      reference_title: "Vitamin D and multiple sclerosis."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Overall, the results of these studies support a protective effect of vitamin D, but there are uncertainties and many unanswered questions, including how vitamin D exerts a protective effect, how genetic variations modify the effect, and whether vitamin D can influence the course of MS progression."
      explanation: >-
        Review supporting a protective effect of vitamin D while listing the
        open questions, including how the effect is exerted. Its own
        uncertainty is why this link's intermediates are unknown.
  effect: Increased risk
  evidence:
  - reference: PMID:20494325
    reference_title: "Vitamin D and multiple sclerosis."
    supports: PARTIAL

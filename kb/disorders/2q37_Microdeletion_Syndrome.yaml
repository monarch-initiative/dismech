treatments:
- name: Multidisciplinary supportive care
  description: >-
    Management is feature-directed and coordinated across developmental,
    neurologic, cardiac, gastrointestinal, nutritional, vision, hearing, and
    genetics services according to the individual's findings. The cited
    syndrome-specific management source is retired and is retained as
    historical guidance rather than current evidence for fixed protocols.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary care by specialists in the following fields is often
      required: clinical genetics, speech pathology, occupational and physical
      therapy, child development, neurology, cardiology, gastroenterology,
      nutrition/feeding, ophthalmology, and audiology.
    explanation: >-
      The retired chapter supports multidisciplinary, feature-directed care but
      not contemporary syndrome-specific efficacy claims.
- name: Early intervention and educational support
  description: >-
    Early developmental services and individualized educational support can be
    used for developmental, communication, motor, and learning needs.
  treatment_term:
    preferred_term: early intervention services
    term:
      id: NCIT:C159524
      label: Early Intervention
  evidence:
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants benefit from enrollment in an early-intervention program; most
      school-age children benefit from an individualized educational program
      (IEP).
    explanation: >-
      This provides historical syndrome-specific support for developmental and
      educational services.
- name: Genetic counseling
  description: >-
    Genetic counseling integrates the proband's deletion boundaries and
    parental chromosome results when estimating recurrence risk.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk to sibs of a proband depends on the chromosome findings in the
      parents
    explanation: This supports family-specific recurrence counseling.
- name: Individualized discussion of Wilms tumor surveillance
  description: >-
    For a young child whose deletion encompasses 2q37.1, clinical genetics and
    pediatric oncology input can be used to decide whether renal ultrasound
    surveillance is appropriate. Available evidence is breakpoint-specific and
    does not establish a universal schedule or syndrome-wide recommendation.
  treatment_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:19789318
    reference_title: "Loss of heterozygosity at 2q37 in sporadic Wilms' tumor: putative role for miR-562."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      any increased risk for developing Wilms' tumor likely correlates with
      deletions encompassing 2q37.1.
    explanation: >-
      The association is limited to a possible 2q37.1-containing subgroup and
      does not define a screening protocol.
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For young children with a deletion that includes 2q37.1, screening for
      Wilms tumor can be considered.
    explanation: >-
      The retired source supports consideration, not a universal
      recommendation; current expert guidance remains needed.
- name: Individualized long-term dental care
  description: >-
    Dental assessment, preventive care, and orthodontic planning can be
    individualized. Evidence is limited to a single long-term case and does not
    establish a syndrome-wide dental protocol.
  treatment_term:
    preferred_term: supportive dental care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

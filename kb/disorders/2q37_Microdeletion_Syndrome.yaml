name: 2q37 Microdeletion Syndrome
creation_date: "2026-04-15T23:46:24Z"
synonyms:
- 2q37 deletion syndrome
- Brachydactyly-intellectual disability syndrome
- Albright hereditary osteodystrophy-like syndrome
description: >-
  2q37 microdeletion syndrome is a variably expressed chromosomal disorder
  caused by a terminal or interstitial deletion of chromosome region 2q37.
  The deleted interval and gene content differ among affected individuals.
  Common findings include developmental or cognitive-behavioral differences,
  dysmorphic craniofacial features, type E brachydactyly, short stature, and
  obesity, with variable neurologic and congenital anomalies. HDAC4
  haploinsufficiency may contribute to the skeletal phenotype when that gene is
  deleted, but its neurobehavioral contribution remains uncertain; it does not
  explain the full multigene deletion syndrome and has incomplete penetrance.
category: Genetic
parents:
- chromosomal disorder
disease_term:
  preferred_term: 2q37 microdeletion syndrome
  term:
    id: MONDO:0010886
    label: 2q37 microdeletion syndrome
inheritance:
- name: Predominantly de novo autosomal deletion
  description: >-
    Most reported 2q37 deletions are de novo. Rare inherited interstitial
    deletions and deletions arising from a parental balanced chromosome
    rearrangement have been reported, so recurrence assessment depends on the
    chromosome findings in the family rather than on a universal recurrence
    percentage.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most individuals with the 2q37 microdeletion syndrome have a de novo
      chromosome deletion and their parents have normal karyotypes. In
      approximately 5% of published cases, probands have inherited the deletion
      from a parent who is a balanced translocation carrier.
    explanation: >-
      The retired GeneReviews chapter provides historical evidence for the
      predominantly de novo pattern and rare recurrence through a parental
      rearrangement.
  - reference: PMID:23188045
    reference_title: Phenotypic variant of Brachydactyly-mental retardation syndrome in a family with an inherited interstitial 2q37.3 microdeletion including HDAC4.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here on the first three generation familial case of BDMR
      syndrome with inheritance of an interstitial microdeletion of chromosome
      2q37.3.
    explanation: >-
      This family demonstrates that a 2q37.3 deletion can be transmitted across
      generations.
progression: []
pathophysiology:
- name: Variable breakpoint-dependent 2q37 deletion
  description: >-
    Terminal and interstitial 2q37 deletions remove variable gene content and
    produce a contiguous-gene dosage disorder. Clinical expressivity is
    incomplete and depends on the specific chromosome anomaly; the available
    evidence does not support a simple rule that larger deletions always cause
    more severe disease.
  evidence:
  - reference: PMID:30848064
    reference_title: Genotype and phenotype correlation in 103 individuals with 2q37 deletion syndrome reveals incomplete penetrance and supports HDAC4 as the primary genetic contributor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features overlap with other neurodevelopmental conditions,
      including Smith-Magenis syndrome (SMS), and may be incompletely penetrant
      or demonstrate variable expressivity, depending on the specific
      chromosomal anomaly.
    explanation: >-
      The 103-person literature review supports incomplete penetrance and
      chromosome-anomaly-dependent expressivity.
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      loss of HDAC4 function usually occurs as part of larger deletions of
      chromosome 2q37; BDMR is also known as chromosome 2q37 deletion syndrome,
      and the precise role of HDAC4 within the phenotype remains uncertain.
    explanation: >-
      The authors explicitly place HDAC4 loss in the larger deletion context and
      identify uncertainty about its phenotype-specific contribution.
  downstream:
  - target: Partial contribution of HDAC4 haploinsufficiency
    causal_link_type: DIRECT
    description: >-
      A deletion that includes HDAC4 directly reduces its dosage, but not every
      2q37 deletion includes HDAC4 and HDAC4 loss is not sufficient to explain
      the full phenotype.
  - target: Variable neurodevelopmental and congenital effects
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent loss of multiple 2q37 genes
    description: >-
      Variable deleted gene content produces incompletely penetrant
      neurodevelopmental, growth, and organ-development findings.
  - target: Altered inter-chromosomal architecture
    causal_link_type: DIRECT
    description: >-
      One patient-derived cellular study found altered chromosome-territory
      interactions associated with an inherited 2q37 deletion.
  - target: Candidate 2q37.1 Wilms tumor susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - possible loss of a 2q37.1 tumor-suppressor locus
    description: >-
      When the deletion extends into 2q37.1, a possible breakpoint-specific
      Wilms-tumor association has been reported.
- name: Partial contribution of HDAC4 haploinsufficiency
  description: >-
    HDAC4 loss of function is associated particularly with type E
    brachydactyly; its contribution to neurobehavioral findings remains
    uncertain. Human data show incomplete penetrance, normal intelligence in
    some individuals with HDAC4 haploinsufficiency, and skeletal or cognitive
    findings in some 2q37 deletions that do not include HDAC4. HDAC4 is
    therefore modeled as a partial contributor, not the sole initiating
    mechanism for the deletion syndrome.
  genes:
  - preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  evidence:
  - reference: PMID:20691407
    reference_title: Haploinsufficiency of HDAC4 causes brachydactyly mental retardation syndrome, with brachydactyly type E, developmental delays, and behavioral problems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sequencing of HDAC4 identified de novo mutations, including one
      intragenic deletion probably disrupting normal splicing and one
      intragenic insertion that results in a frameshift and premature stop
      codon.
    explanation: >-
      Deletion-negative individuals with truncating HDAC4 variants support a
      gene-level contribution to an overlapping phenotype.
  - reference: PMID:24715439
    reference_title: Haploinsufficiency of HDAC4 does not cause intellectual disability in all affected individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presented here are three individuals with haploinsufficiency of HDAC4 who
      have brachydactyly type E, non-dysmorphic facial features, and normal
      intelligence.
    explanation: >-
      These individuals show that HDAC4 haploinsufficiency is not sufficient to
      produce intellectual disability or the full craniofacial phenotype.
  - reference: PMID:31990478
    reference_title: "The clinical and molecular features of three Turkish patients with a rare genetic disorder: 2q37 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although two patients had some skeletal findings, the deletion region did
      not contain HDAC4 gene in one of the patients.
    explanation: >-
      Skeletal findings in a deletion not containing HDAC4 argue against
      attributing every skeletal manifestation to that gene.
  downstream:
  - target: Skeletal developmental dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered timing of ossification
    description: >-
      HDAC4 dosage loss may alter skeletal development and contribute to type E
      brachydactyly.
- name: Skeletal developmental dysregulation
  description: >-
    Altered skeletal development is associated with type E brachydactyly and
    short stature. Hdac4-null mouse evidence suggests premature ossification,
    but a homozygous-null animal is not a dosage-equivalent model of the human
    heterozygous deletion.
  evidence:
  - reference: PMID:20691407
    reference_title: Haploinsufficiency of HDAC4 causes brachydactyly mental retardation syndrome, with brachydactyly type E, developmental delays, and behavioral problems.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Reportedly, Hdac4(-/-) mice have severe bone malformations resulting from
      premature ossification of developing bones.
    explanation: >-
      The mouse model supports an ossification mechanism but differs from the
      heterozygous human dosage state.
  downstream:
  - target: Type E brachydactyly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - abnormal ossification and metacarpal or metatarsal development
    description: Altered skeletal development produces the characteristic type E brachydactyly.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - abnormal skeletal growth
    description: Skeletal and broader growth effects may contribute to short stature.
- name: Variable neurodevelopmental and congenital effects
  description: >-
    Breakpoint-dependent multigene dosage loss is associated with variable
    developmental delay, intellectual disability, autistic or other behavioral
    features, hypotonia, seizures, growth differences, and congenital organ
    anomalies. Specific gene-to-phenotype routes remain unresolved.
  evidence:
  - reference: PMID:30848064
    reference_title: Genotype and phenotype correlation in 103 individuals with 2q37 deletion syndrome reveals incomplete penetrance and supports HDAC4 as the primary genetic contributor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is a high degree of variability in the presence of some of the
      features that are considered the most characteristic of the syndrome
    explanation: >-
      This supports a variably expressed clinical branch rather than a
      deterministic phenotype chain.
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other findings include seizures (20%-35%), congenital heart disease, CNS
      abnormalities (hydrocephalus, dilated ventricles), umbilical/inguinal
      hernia, tracheomalacia, situs abnormalities, gastrointestinal
      abnormalities, and renal malformations.
    explanation: >-
      The retired chapter provides historical clinical evidence for the broad
      congenital and neurologic spectrum; current frequencies are not inferred
      from it except where explicitly stated.
  downstream:
  - target: Abnormality of mental function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent cognitive and behavioral effects
    description: >-
      The deletion is associated with a composite of cognitive and behavioral
      findings, without a resolved gene-specific route.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent neurodevelopmental effects
    description: Variable dosage loss can impair early development.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent neurodevelopmental effects
    description: Variable dosage loss can produce intellectual disability.
  - target: Autistic behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent neurodevelopmental effects
    description: Autism-spectrum features occur in a subset of affected individuals.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - central or neuromuscular developmental effects
    description: Hypotonia contributes to early motor delay in some individuals.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered neurodevelopmental excitability
    description: Seizures occur in a subset of affected individuals.
  - target: Congenital heart disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent organogenesis effects
    description: Congenital heart malformations are variably associated with the deletion.
  - target: CNS structural anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent brain-development effects
    description: Hydrocephalus or ventricular abnormalities have been reported.
  - target: Renal malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent renal-development effects
    description: Renal and genitourinary anomalies have been reported.
  - target: Gastrointestinal anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - breakpoint-dependent organogenesis effects
    description: Gastrointestinal or abdominal-wall anomalies have been reported.
  - target: Abnormal facial shape
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - variable craniofacial development
    description: Variable craniofacial development produces a recurrent dysmorphic appearance.
  - target: Increased body weight
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - unresolved growth and metabolic effects
    description: The deleted interval is associated with incompletely penetrant overweight or obesity.
- name: Altered inter-chromosomal architecture
  description: >-
    Mesenchymal stem cells and derived cells from members of one family with an
    inherited 2q37 deletion showed altered positions and interactions of
    chromosome territories. This is a patient-derived cellular observation;
    its contribution to particular clinical features is unknown.
  evidence:
  - reference: PMID:29921581
    reference_title: Reorganization of inter-chromosomal interactions in the 2q37-deletion syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the disease-related HDAC4 deletion resulted in displaced inter-chromosomal
      arrangements and altered interactions between the deletion-affected
      chromosome 2 and chromosome 12 and/or 17
    explanation: >-
      This directly supports altered nuclear architecture in the studied
      patient-derived cells without establishing a phenotype-level causal edge.
- name: Candidate 2q37.1 Wilms tumor susceptibility
  description: >-
    A small number of constitutional 2q37 deletion and Wilms-tumor
    co-occurrences, together with tumor loss-of-heterozygosity data, suggest a
    possible susceptibility locus in 2q37.1. The magnitude of constitutional
    risk and the value of surveillance are not established.
  evidence:
  - reference: PMID:19789318
    reference_title: "Loss of heterozygosity at 2q37 in sporadic Wilms' tumor: putative role for miR-562."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      any increased risk for developing Wilms' tumor likely correlates with
      deletions encompassing 2q37.1.
    explanation: >-
      The study supports a cautious, breakpoint-specific association rather
      than a syndrome-wide tumor-risk estimate.
  downstream:
  - target: Nephroblastoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - possible loss of a 2q37.1 tumor-suppressor locus
    description: >-
      A deletion encompassing 2q37.1 may increase susceptibility, but penetrance
      and the causal locus remain uncertain.

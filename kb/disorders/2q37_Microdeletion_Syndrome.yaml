discussions:
- discussion_id: gap_2q37_hdac4_phenotype_attribution
  prompt: >-
    Which components of the constitutional 2q37 deletion phenotype are caused
    specifically by HDAC4 haploinsufficiency, which require other deleted genes
    or breakpoint effects, and which associations remain insufficiently
    resolved for a gene-specific causal edge?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Partial contribution of HDAC4 haploinsufficiency
  - genetic#HDAC4
  rationale: >-
    Early reports concluded that HDAC4 haploinsufficiency was sufficient for
    the brachydactyly-intellectual disability phenotype, but later individuals
    with HDAC4 haploinsufficiency had normal intelligence, and some 2q37
    deletions lacking HDAC4 had intellectual or skeletal findings. Current
    ontology separately identifies HDAC4-related haploinsufficiency syndrome,
    so this record already treats deletion-negative disease as a differential.
    Expert resolution is still needed to determine how much gene-specific
    causal detail belongs in this multigene deletion record.
  evidence:
  - reference: PMID:24715439
    reference_title: Haploinsufficiency of HDAC4 does not cause intellectual disability in all affected individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is in contradistinction to previous reports that haploinsufficiency
      of HDAC4 is sufficient to cause BDMR.
    explanation: This directly identifies the disputed sufficiency claim.
  - reference: PMID:31990478
    reference_title: "The clinical and molecular features of three Turkish patients with a rare genetic disorder: 2q37 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although two patients had some skeletal findings, the deletion region did
      not contain HDAC4 gene in one of the patients.
    explanation: This supports a phenotype contribution beyond HDAC4.
- discussion_id: gap_2q37_1_wilms_risk_and_surveillance
  prompt: >-
    What is the absolute Wilms-tumor risk for children with constitutional
    deletions encompassing 2q37.1, which precise interval confers risk, and
    does that risk justify renal ultrasound surveillance with a defined age and
    interval?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate 2q37.1 Wilms tumor susceptibility
  - phenotypes#Nephroblastoma
  - treatments#Individualized discussion of Wilms tumor surveillance
  rationale: >-
    A small constitutional co-occurrence series and tumor loss-of-heterozygosity
    data suggest a 2q37.1 locus, while the retired GeneReviews chapter only said
    that screening could be considered. The available generated caches do not
    expose a current 2q37-specific consensus recommendation, penetrance
    estimate, interval, or stopping age. Expert review is therefore required
    before modeling a universal protocol.
  evidence:
  - reference: PMID:19789318
    reference_title: "Loss of heterozygosity at 2q37 in sporadic Wilms' tumor: putative role for miR-562."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      any increased risk for developing Wilms' tumor likely correlates with
      deletions encompassing 2q37.1.
    explanation: This supports the breakpoint-specific hypothesis but not risk magnitude.
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For young children with a deletion that includes 2q37.1, screening for
      Wilms tumor can be considered.
    explanation: The historical wording is permissive and does not define a protocol.

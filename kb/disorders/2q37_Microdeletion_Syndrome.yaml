genetic:
- name: 2q37 deletion
  association: Causal chromosomal deletion
  notes: >-
    The defining event is a terminal or interstitial deletion involving 2q37.
    Breakpoint and gene-content interpretation should remain explicit because
    the clinical phenotype is variably expressed.
  evidence:
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome analysis confirms the diagnosis of 2q37 deletion syndrome in
      80%-85% of affected individuals.
    explanation: >-
      The historical source supports the defining chromosomal lesion while
      reflecting older testing technology.
  - reference: PMID:30848064
    reference_title: Genotype and phenotype correlation in 103 individuals with 2q37 deletion syndrome reveals incomplete penetrance and supports HDAC4 as the primary genetic contributor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more detailed molecular diagnoses are possible than in years past,
      enabling refined characterization of the genotype-phenotype correlation
      for subjects with 2q37 deletions.
    explanation: This supports breakpoint-aware interpretation of the deletion.
- name: HDAC4
  association: Candidate contributor within HDAC4-containing 2q37 deletions
  gene_term:
    preferred_term: HDAC4
    term:
      id: hgnc:14063
      label: HDAC4
  notes: >-
    HDAC4 loss is associated with an overlapping brachydactyly phenotype, but
    incomplete penetrance and findings outside HDAC4-containing intervals make
    it insufficient as a complete explanation of 2q37 microdeletion syndrome.
  evidence:
  - reference: PMID:20691407
    reference_title: Haploinsufficiency of HDAC4 causes brachydactyly mental retardation syndrome, with brachydactyly type E, developmental delays, and behavioral problems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sequencing of HDAC4 identified de novo mutations, including one
      intragenic deletion probably disrupting normal splicing and one
      intragenic insertion that results in a frameshift and premature stop
      codon.
    explanation: This supports a gene-level contribution to an overlapping phenotype.
  - reference: PMID:24715439
    reference_title: Haploinsufficiency of HDAC4 does not cause intellectual disability in all affected individuals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presented here are three individuals with haploinsufficiency of HDAC4 who
      have brachydactyly type E, non-dysmorphic facial features, and normal
      intelligence.
    explanation: This establishes incomplete penetrance for nonskeletal features.

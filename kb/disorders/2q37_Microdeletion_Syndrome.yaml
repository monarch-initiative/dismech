    reference_title: Long-term Oral Management for 2q37 Deletion Syndrome Patient.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No new carious lesions have developed during this period and notable
      improvement in anterior alignment has been achieved.
    explanation: >-
      This single case supports feasibility of individualized long-term dental
      and orthodontic care, not general efficacy.
diagnosis:
- name: Chromosomal microarray
  description: >-
    Chromosomal microarray is the primary cytogenetic test for detecting and
    defining a 2q37 deletion, including its boundaries and gene content.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20466091
    reference_title: "Consensus statement: chromosomal microarray is a first-tier clinical diagnostic test for individuals with developmental disabilities or congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Available evidence strongly supports the use of CMA in place of G-banded
      karyotyping as the first-tier cytogenetic diagnostic test
    explanation: >-
      The consensus statement supports CMA as first-tier testing in the
      developmental-disability and congenital-anomaly presentation typical of
      this syndrome.
  - reference: PMID:30848064
    reference_title: Genotype and phenotype correlation in 103 individuals with 2q37 deletion syndrome reveals incomplete penetrance and supports HDAC4 as the primary genetic contributor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      more detailed molecular diagnoses are possible than in years past,
      enabling refined characterization of the genotype-phenotype correlation
      for subjects with 2q37 deletions.
    explanation: This supports defining deletion boundaries for interpretation.
- name: Complementary karyotype and parental chromosome studies
  description: >-
    Karyotyping is complementary when a visible or familial chromosome
    rearrangement is suspected, because arrays do not detect truly balanced
    rearrangements reliably. Parental chromosome studies can then inform
    recurrence counseling.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20466091
    reference_title: "Consensus statement: chromosomal microarray is a first-tier clinical diagnostic test for individuals with developmental disabilities or congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      G-banded karyotype analysis should be reserved for patients with obvious
      chromosomal syndromes (e.g., Down syndrome), a family history of
      chromosomal rearrangement, or a history of multiple miscarriages.
    explanation: >-
      This supports complementary rather than routine first-line karyotyping.
  - reference: PMID:20301337
    reference_title: "2q37 Microdeletion Syndrome – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In some individuals, 2q37 microdeletion syndrome results from chromosome
      rearrangements involving 2q37 (e.g., chromosome 2 inversion, ring
      chromosome 2, or translocation between chromosome 2 and another
      chromosome).
    explanation: >-
      Historical syndrome-specific evidence supports evaluating structural
      chromosome context when indicated.
differential_diagnoses:
- name: HDAC4-related haploinsufficiency syndrome
  description: >-
    Intragenic HDAC4 loss-of-function variants can cause an overlapping
    brachydactyly phenotype without a chromosome 2q37 deletion. This is a
    separate MONDO disorder and should not be represented as a subtype of the
    multigene deletion syndrome.
  distinguishing_features:
  - A pathogenic intragenic HDAC4 loss-of-function variant without a 2q37 deletion supports this diagnosis.
  - The absence of other deleted 2q37 genes changes both mechanism and recurrence interpretation.
  notes: >-
    MONDO:1060110 is the current ontology identity for this differential, but
    the repository's generated DiseaseTerm enum does not yet include it.
  evidence:
  - reference: PMID:20691407
    reference_title: Haploinsufficiency of HDAC4 causes brachydactyly mental retardation syndrome, with brachydactyly type E, developmental delays, and behavioral problems.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      sequencing of HDAC4 identified de novo mutations, including one
      intragenic deletion probably disrupting normal splicing and one
      intragenic insertion that results in a frameshift and premature stop
      codon.
    explanation: This supports a deletion-negative HDAC4 loss-of-function differential.
- name: Neurodevelopmental disorder with central hypotonia and dysmorphic facies
  description: >-
    De novo missense variants affecting the regulatory 14-3-3-binding region of
    HDAC4 cause a mechanistically distinct neurodevelopmental disorder. These
    variants should not be grouped with HDAC4 loss of function or 2q37 deletion.
  distinguishing_features:
  - A de novo HDAC4 missense variant affecting the conserved 14-3-3-binding regulatory site supports this diagnosis.
  - The reported phenotype is distinct from the brachydactyly-intellectual disability spectrum.
  notes: >-
    MONDO:0859232 is the current ontology identity for this differential, but
    the repository's generated DiseaseTerm enum does not yet include it.
  evidence:
  - reference: PMID:33537682
    reference_title: Missense substitutions at a conserved 14-3-3 binding site in HDAC4 cause a novel intellectual disability syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report seven unrelated individuals with a phenotype distinct
      from that of BDMR, all of whom have heterozygous de novo missense variants
    explanation: This establishes the missense mechanism as a distinct differential.
- name: Pseudopseudohypoparathyroidism
  description: >-
    Pseudopseudohypoparathyroidism can share an Albright hereditary
    osteodystrophy-like appearance, including brachydactyly and short stature,
    but is a GNAS-related disorder rather than a 2q37 deletion syndrome.
  distinguishing_features:
  - GNAS molecular findings and the absence of a 2q37 deletion support pseudopseudohypoparathyroidism.
  disease_term:
    preferred_term: pseudopseudohypoparathyroidism
    term:
      id: MONDO:0012912
      label: pseudopseudohypoparathyroidism
- name: Smith-Magenis syndrome
  description: >-
    Smith-Magenis syndrome can overlap in cognitive-behavioral, craniofacial,
    and skeletal features but is defined by a 17p11.2 deletion or pathogenic
    RAI1 variant rather than a 2q37 deletion.
  distinguishing_features:
  - A 17p11.2 deletion or pathogenic RAI1 variant supports Smith-Magenis syndrome.
  - A chromosome 2q37 deletion supports 2q37 microdeletion syndrome.
  disease_term:
    preferred_term: Smith-Magenis syndrome
    term:
      id: MONDO:0008434
      label: Smith-Magenis syndrome
  evidence:
  - reference: PMID:30848064
    reference_title: Genotype and phenotype correlation in 103 individuals with 2q37 deletion syndrome reveals incomplete penetrance and supports HDAC4 as the primary genetic contributor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features overlap with other neurodevelopmental conditions,
      including Smith-Magenis syndrome (SMS)
    explanation: This directly supports Smith-Magenis syndrome as an overlapping differential.

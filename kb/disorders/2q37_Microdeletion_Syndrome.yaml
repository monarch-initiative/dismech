    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cooccurrence of Wilms' tumor with 2q37 deletion syndrome, an uncommon
      constitutional chromosome abnormality, has been reported previously in
      three children.
    explanation: >-
      This documents rare co-occurrence but does not establish penetrance or a
      categorical frequency.

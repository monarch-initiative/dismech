- name: Failure of Complex I Holoenzyme Assembly
  biological_scale: MOLECULAR
  description: >-
    Without NDUFB8 the enzyme does not assemble. In a human knockout cell line the loss of
    NDUFB8 leaves no assembled complex I detectable, and NDUFB8 falls among the 25 accessory
    subunits that a systematic gene-editing survey found to be strictly required for a
    functional complex. The general rule established by that survey - that losing one subunit
    destabilises the other subunits of its own structural module - is the mechanism by which a
    single missing brace propagates into a whole-enzyme failure.

    The knockout evidence is a complete null; the patient alleles are not, which is why this
    node is written as a failure of assembly rather than an absence of the enzyme, and why
    patients retain measurable residual activity.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  evidence:
  - reference: PMID:33233646
    reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a knockout strain of cultured human cells, the loss of NDUFB8 resulted in no assembly of complex I"
    explanation: >-
      The direct demonstration that NDUFB8 is required for assembly, in a cell line rather
      than in a patient.
  - reference: PMID:27626371
    reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that 25 subunits are strictly required for assembly of a functional complex and 1 subunit is essential for cell viability."
    explanation: >-
      The systematic knockout survey that the NDUFB8 result above comes from, giving the
      denominator against which "strictly required" is a meaningful statement.

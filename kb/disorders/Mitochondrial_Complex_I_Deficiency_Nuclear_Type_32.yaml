name: Mitochondrial Complex I Deficiency, Nuclear Type 32
category: Mendelian
creation_date: "2026-09-09T00:00:00Z"
synonyms:
- MC1DN32
- mitochondrial complex 1 deficiency, nuclear type 32
- NDUFB8-related mitochondrial complex I deficiency
- NDUFB8-related primary mitochondrial disease
- NDUFB8 deficiency
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 32
  term:
    id: MONDO:0032635
    label: mitochondrial complex I deficiency, nuclear type 32
description: >-
  MC1DN32 is the isolated complex I deficiency caused by biallelic variants in NDUFB8. It is
  a very small entity: the gene was established as a disease cause in 2018 in two unrelated
  compound-heterozygous children, and a third patient - the only carrier of NDUFB8 variants
  in a 37-child cavitating-leukoencephalopathy cohort - was reported the following year.
  ClinGen's Mitochondrial Diseases expert panel, recurating in November 2024, counted three
  unrelated cases across those two publications and graded the gene-disease relationship
  Moderate rather than Definitive. The entry is written to that scale, and frequency figures
  below carry their numerators explicitly because the denominators are two and three.

  NDUFB8 is an accessory subunit of the distal, proton-pumping end of complex I. It is
  synthesized as a 186-residue precursor whose first 28 residues are a cleaved transit
  peptide, and the mature protein spans the inner membrane once, with its N-terminus in the
  matrix and its C-terminus in the intermembrane space. Structurally it belongs to the ND5
  module and its defining contact is with the long lateral helix of the core subunit ND5,
  which it clamps; on the matrix face it also touches ND4 and NDUFB4/NDUFB9, and on the
  intermembrane-space face NDUFB7 and NDUFB10. Together with NDUFB3 and NDUFB6 it encloses
  the distal end of the enzyme. That position is what makes its loss an assembly defect
  rather than a catalytic one: in a human knockout cell line, loss of NDUFB8 leaves no
  assembled complex I at all, and NDUFB8 is one of the 25 accessory subunits shown by
  systematic gene editing to be strictly required for a functional complex.

  The two 2018 patients illustrate two different routes to the same loss. One carried
  p.Pro76Gln together with p.Cys144Trp, and the second of those alleles turned out not to act
  as a missense change at all in most transcripts: it creates a new exonic splicing silencer,
  so exon 4 is skipped, with only about 14 percent of cDNA retaining the missense sequence.
  The other carried the missense p.Tyr62His in trans with a frameshift, p.Glu63Aspfs*35. Both
  children had an isolated complex I deficiency in muscle and fibroblasts, and lentiviral
  expression of wild-type NDUFB8 in their cells restored mitochondrial function - the
  complementation result that converts association into causation.

  Clinically the picture is an encephalo(cardio)myopathy of the first year: muscular hypotonia,
  failure to thrive, developmental delay, respiratory failure and elevated blood lactate, with
  progressive symmetrical basal ganglia change on MRI extending to the brain stem in one child
  and the internal capsule in the other. Cardiac hypertrophy is part of the phenotype but was
  not universal - left ventricular hypertrophy was recorded in one of the two 2018 patients,
  who died at 15 months, while the other was alive at six years. The third patient's
  presentation, cavitating leukoencephalopathy, broadens the imaging phenotype beyond the
  Leigh-like pattern of the first two.

  There is no disease-modifying treatment. Nothing published reports a therapeutic trial,
  a cohort natural history, an animal model, or a prevalence estimate for this entity, and
  this entry records those as absences rather than filling them.

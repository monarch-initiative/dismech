genetic:
- name: NDUFB8
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NDUFB8
    term:
      id: hgnc:7703
      label: NDUFB8
  notes: >-
    NDUFB8 encodes NADH:ubiquinone oxidoreductase subunit B8, an accessory subunit of the
    distal membrane arm of complex I. Its structural position - clamping the ND5 lateral helix
    at the ND5-module interface - is the mechanism of this disease and is curated as its own
    pathophysiology node.

    Two traps for anyone extending this entry from the gene rather than from the disease.

    First, and by far the larger, NDUFB8 is the standard antibody target for complex I in the
    OXPHOS immunoblot and immunofluorescence panels used across mitochondrial diagnostics and
    cell biology. The great majority of papers naming NDUFB8 are using reduced NDUFB8 staining
    as a *readout* of complex I loss caused by something else entirely - PUS1, MCAT, EARS2,
    NDUFA13, ERCC6, and many others. Those papers say nothing about NDUFB8 as a disease gene,
    and a literature search on the symbol returns them in overwhelming preponderance over the
    three actual patient reports.

    Second, ClinGen's classification is Moderate, not Definitive, and has been recurated
    once - originally against Leigh syndrome spectrum in 2020, then against NDUFB8-related
    primary mitochondrial disease in 2024, with the Leigh cases folded into the broader
    entity. The two curations are the same relationship under two disease labels, not two
    independent lines of support.
  evidence:
  - reference: PMID:29429571
    reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereby we establish NDUFB8 as a relevant gene in childhood-onset mitochondrial disease."
    explanation: The gene-disease relationship as claimed by the report that established it.
  - reference: PMID:29429571
    reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complementation studies by expression of wild-type NDUFB8 in cells from affected individuals restored mitochondrial function, confirming NDUFB8 variants as the cause of complex I deficiency."
    explanation: >-
      The complementation result that converts a variant association into a causal claim.
  - reference: CGGV:assertion_ef011d17-b13b-445e-af02-e1bd504da75e-2024-11-18T050000.000Z
    reference_title: "NDUFB8 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is moderate evidence to support the relationship between NDUFB8 and autosomal recessive NDUFB8 -related primary mitochondrial disease."
    explanation: >-
      The independent strength-of-evidence judgement, which is Moderate rather than Definitive
      and is a fair reflection of a three-case series with strong functional data. Graded OTHER
      because a curation assertion is an expert judgement rather than a study.
  - reference: CGGV:assertion_ef011d17-b13b-445e-af02-e1bd504da75e-2024-11-18T050000.000Z
    reference_title: "NDUFB8 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "NDUFB8 has been associated with a single disease entity to date; mitochondrial complex I deficiency, nuclear type 32 [OMIM# 618252]."
    explanation: >-
      The lumping decision behind this entry: NDUFB8 has one disease entity, not an allelic
      series, so a single standalone entry is the correct shape. Graded OTHER as above.
diagnosis:
- name: Whole-exome sequencing after an isolated complex I deficiency
  description: >-
    Both index patients were solved by whole-exome sequencing. NDUFB8 was not a known disease
    gene at the time, so the sequencing had to be interpreted against a biochemical phenotype -
    an isolated complex I deficiency in muscle and fibroblasts - and then confirmed by
    complementing the patients' own cells with wild-type NDUFB8. The third patient came from
    the opposite direction: an exome performed on the basis of a distinctive MRI phenotype in a
    cavitating-leukoencephalopathy cohort. Both routes remain valid; there is no NDUFB8-specific
    biomarker and no assay that distinguishes this entity from any other nuclear complex I
    deficiency short of sequencing.
  evidence:
  - reference: PMID:29429571
    reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe rare biallelic variants in NDUFB8 encoding a complex I accessory subunit revealed by whole-exome sequencing in two individuals from two families."
    explanation: The diagnostic route in the two index families.
  - reference: PMID:30770271
    reference_title: "Genotypic Spectrum and Natural History of Cavitating Leukoencephalopathies in Childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing and prospective follow-up study of the natural history and brain magnetic resonance imaging (MRI) were performed."
    explanation: The phenotype-first route that found the third patient.
- name: Caution interpreting the OXPHOS immunoassay that uses NDUFB8 as its complex I probe
  description: >-
    NDUFB8 is the conventional antibody target for complex I in quadruple immunofluorescent and
    immunoblot OXPHOS panels, and loss of NDUFB8 immunoreactivity is a validated indicator of a
    Mendelian complex I defect. The trap is directional: reduced NDUFB8 staining says complex I
    is deficient, not that NDUFB8 is mutated. In a validation series of 25 patients with
    genetically proven complex I variants, every patient with a nuclear-encoded subunit or
    assembly-factor mutation lost NDUFB8 immunoreactivity, but only three of ten patients with
    mtDNA-encoded subunit mutations did - so the assay is a sensitive screen for the nuclear
    causes as a class, and NDUFB8 is one member of that class rather than the thing being
    assayed for.
  evidence:
  - reference: PMID:29142257
    reference_title: "Using a quantitative quadruple immunofluorescent assay to diagnose isolated mitochondrial Complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed loss of NDUFB8 immunoreactivity in all patients with mutations affecting nuclear-encoding structural subunits and assembly factors, whilst only 3 of the 10 patients with mutations affecting mtDNA-encoded structural subunits showed loss of NDUFB8"
    explanation: >-
      The performance of the NDUFB8-based assay split by genetic cause, which is what makes it
      a screen for nuclear complex I disease rather than a test for NDUFB8 variants.
experimental_models:
- name: Lentiviral wild-type NDUFB8 complementation of patient cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cells from both 2018 patients were complemented with wild-type NDUFB8, and mitochondrial
    function was restored. This is the functional evidence on which the gene-disease
    relationship rests. The published account available here states the result without the
    per-line detail - which measurements were made, and how completely each line recovered -
    so this record does not characterise the magnitude of the rescue.
  modeled_mechanisms:
  - target: Isolated Complex I Enzyme Deficiency
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type NDUFB8 to the patients' own cells restores mitochondrial function,
      which is the demonstration that the NDUFB8 variants rather than something else in those
      genomes cause the enzyme defect.
    limitations: >-
      A cultured patient cell line, so it says nothing about brain, heart or muscle in vivo.
      The rescue is reported as a restoration of "mitochondrial function" without the assay
      being named in the abstract available here, so the readout below records the claim at the
      level the source makes it. Complementation of a recessive loss-of-function allele by
      lentiviral overexpression is also non-physiological in level and timing.
    readouts:
    - name: Restoration of mitochondrial function after wild-type NDUFB8 expression
      target: Isolated Complex I Enzyme Deficiency
      direction: RESTORED
      interpretation: >-
        Mitochondrial function in patient cells returns toward normal when wild-type NDUFB8 is
        supplied. The specific quantity measured is not named in the source available here.
      evidence:
      - reference: PMID:29429571
        reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Complementation studies by expression of wild-type NDUFB8 in cells from affected individuals restored mitochondrial function, confirming NDUFB8 variants as the cause of complex I deficiency."
        explanation: The rescue and the causal inference the authors draw from it.
    evidence:
    - reference: PMID:29429571
      reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Complementation studies by expression of wild-type NDUFB8 in cells from affected individuals restored mitochondrial function, confirming NDUFB8 variants as the cause of complex I deficiency."
      explanation: >-
        Establishes that this cell system is informative for the enzyme-deficiency node it is
        linked to.
- name: NDUFB8 knockout human cell line
  experimental_model_type: CELL_LINE
  description: >-
    A CRISPR knockout of NDUFB8 in a human cell line, generated as part of a systematic survey
    of all 31 complex I accessory subunits. Loss of NDUFB8 leaves no assembled complex I. This
    is a complete null and so models the assembly requirement rather than the patients'
    hypomorphic compound-heterozygous state.
  modeled_mechanisms:
  - target: Failure of Complex I Holoenzyme Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes that NDUFB8 is strictly required for complex I assembly in human cells, which
      is the step the patient variants disrupt.
    limitations: >-
      A complete knockout in an immortalised cell line against patients who are compound
      heterozygous for hypomorphic alleles and retain measurable residual complex I activity;
      the model therefore overstates the severity of the molecular lesion. It also has no
      tissue context, so it cannot speak to why basal ganglia, heart and muscle are the tissues
      that fail.
    readouts:
    - name: Assembled complex I in the NDUFB8 knockout line
      target: Failure of Complex I Holoenzyme Assembly
      direction: ABOLISHED
      interpretation: No complex I assembly is detectable in cells lacking NDUFB8.
      evidence:
      - reference: PMID:33233646
        reference_title: "Analysis of Human Mutations in the Supernumerary Subunits of Complex I."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In a knockout strain of cultured human cells, the loss of NDUFB8 resulted in no assembly of complex I"
        explanation: The readout, reported as a complete absence of assembly.
    evidence:
    - reference: PMID:27626371
      reference_title: "Accessory subunits are integral for assembly and function of human mitochondrial complex I."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here we use gene editing to generate human knockout cell lines for each accessory subunit."
      explanation: >-
        Establishes the model system - a per-subunit knockout panel - that the NDUFB8 result
        comes from.
treatments:
- name: Supportive care
  description: >-
    No disease-modifying therapy exists for MC1DN32, and none has been trialled: the published
    literature is three case descriptions with no treatment arm. Management is the supportive
    care used across infantile mitochondrial disease - nutritional support for failure to
    thrive, respiratory support, developmental and physical therapy, and anticonvulsants where
    seizures occur. None of that is specific to NDUFB8, and none of it is reported for these
    patients in the sources cited here.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded with no evidence block and no target_mechanisms link, deliberately. There is no
    NDUFB8-specific treatment publication to cite, and an evidence item requires an exact quote
    supporting the specific claim; asserting a mechanism link would claim an effect on the
    pathograph that nothing demonstrates. The entry says the absence rather than filling it
    with generic mitochondrial-cocktail content.
discussions:
- discussion_id: mc1dn32_no_patient_assembly_data
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Complex I Holoenzyme Assembly
  prompt: >-
    Does complex I assembly stall at a defined intermediate in NDUFB8 patient cells, and if so
    at which step?
  rationale: >-
    The assembly claim in this entry rests on a knockout cell line, not on patient material.
    Sibling entities in the MC1DN series - MC1DN33 for NDUFA6, MC1DN36 for NDUFC2 - are built on
    complexome profiling of patient fibroblasts, which resolves exactly which subunits and
    subassemblies are lost and shows where biogenesis stalls. No equivalent profile has been
    published for an NDUFB8 patient. This matters beyond completeness: the patients are compound
    heterozygotes with residual activity, and one of the four alleles is a splicing variant that
    still yields some full-length protein, so the patient assembly defect is very unlikely to be
    the total failure the knockout shows. The shape of the residual assembly intermediate is
    what would distinguish an unstable holoenzyme from a stalled biogenesis.
  proposed_experiments:
  - experiment_id: exp_mc1dn32_patient_complexome
    name: Complexome profiling of NDUFB8 patient fibroblasts
    description: >-
      Blue-native electrophoresis with mass-spectrometric complexome profiling of fibroblasts
      from an NDUFB8 patient against age-matched controls, as performed for NDUFC2 and NDUFA6,
      to resolve which subunits are depleted with NDUFB8 and whether a discrete subassembly
      accumulates.
    would_support:
    - pathophysiology#Failure of Complex I Holoenzyme Assembly
    supporting_outcome:
    - >-
      NDUFB8 is depleted from the assembled enzyme, its ND5-module and neighbouring
      membrane-arm partners are reduced with it, and a stalled subassembly lacking the distal
      membrane arm accumulates.
    refuting_outcome:
    - >-
      Complex I is assembled to normal stoichiometry with NDUFB8 present at normal abundance,
      which would move the lesion from assembly to catalysis or stability.
    readouts:
    - name: Abundance of NDUFB8 and its module partners in assembled complex I
      target: pathophysiology#Failure of Complex I Holoenzyme Assembly
      direction: DECREASED
      interpretation: >-
        A coordinated loss of NDUFB8 together with the subunits it contacts would show that the
        module-destabilisation rule established across accessory subunits applies here.
- discussion_id: mc1dn32_allele_phenotype_divergence
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic NDUFB8 Loss-of-Function Variants
  - phenotypes#Left Ventricular Hypertrophy
  prompt: >-
    Does the cardiac involvement that separates the two index patients track their genotypes, or
    is it modifier-driven?
  rationale: >-
    The two 2018 patients had markedly different outcomes - left ventricular hypertrophy and
    death at 15 months in one, survival to at least six years in the other - and different
    allele pairs. It is tempting to read the outcome difference off the genotype, and the entry
    deliberately does not: with one patient per genotype there is no way to separate an allele
    effect from a modifier, a stochastic, or an ascertainment effect, and neither source
    attempts the attribution. The third patient's genotype-phenotype relationship is not
    reported at all. Answering this needs more patients, not more analysis of these two.
notes: >-
  Scope and shape. This is a standalone per-gene entry, consistent with how dismech curates the
  rest of the numbered MC1DN series (nuclear types 1, 2, 3, 6, 12, 14, 21, 23, 24, 31, 33, 34,
  36 and 39 are all separate files). ClinGen states that NDUFB8 has one disease entity rather
  than an allelic series, so there is no lump/split tension here.

  Sources and their limits. The defining 2018 report is available only as an abstract - no full
  text was retrievable - so much of the per-patient detail in this entry comes from the 2020
  review PMID:33233646, which devotes a section to NDUFB8 and reproduces the case descriptions,
  the allele-level analysis and the splicing finding. Where a claim depends on that
  second-hand account rather than the primary report, the evidence item cites the review
  directly rather than the paper it summarises.

  What is not here, and why. No animal model of NDUFB8 deficiency was found; no dataset
  accession is recorded, because no NDUFB8 patient omics deposit was identified; no prevalence
  rate is given; no treatment evidence exists. The `treatments` section carries one
  evidence-free supportive-care record for that reason. Residual complex I activity percentages,
  muscle histology and complexome profiles - all present in the sibling MC1DN entries - have not
  been published for this entity.

  The gene-symbol trap. NDUFB8 is the standard antibody probe for complex I in OXPHOS
  immunoassay panels, so the overwhelming majority of the NDUFB8 literature uses it as a readout
  for complex I loss caused by other genes. A PubMed search on the symbol returns those papers,
  not this disease. The `genetic` block records this at length because it is the single most
  likely way for a future curator to add a wrong reference to this entry.

- name: Depletion of NDUFB8 from the Complex I Distal Membrane Arm
  biological_scale: MOLECULAR
  description: >-
    NDUFB8 sits at the distal, proton-pumping end of complex I in the ND5 module, spanning the
    inner membrane once with its N-terminus in the matrix and its C-terminus in the
    intermembrane space. Its defining structural role is to clamp the long lateral helix of
    the core subunit ND5; on the matrix side it also contacts ND5 and NDUFB4 and, more weakly,
    ND4 and NDUFB9, and on the intermembrane-space side NDUFB7 and NDUFB10. With NDUFB3 and
    NDUFB6 it encloses the distal end of the enzyme. Losing it therefore removes a structural
    brace at a module interface rather than a catalytic component.

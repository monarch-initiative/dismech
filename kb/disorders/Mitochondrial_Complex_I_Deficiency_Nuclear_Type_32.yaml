    causal_link_type: DIRECT
- name: Bioenergetic Failure of Basal Ganglia and Brainstem Neurons
  biological_scale: TISSUE
  description: >-
    Deep grey matter and brainstem nuclei have among the highest oxidative demands in the
    body, and in complex I deficiency they are where the lesions appear. Both 2018 patients
    showed progressive symmetrical basal ganglia change on neuroimaging, extending to the
    brain stem in one and to the internal capsule in the other - the Leigh-like pattern the
    paper's title names. The third reported patient instead had cavitating leukoencephalopathy,
    so the imaging phenotype of the entity is not confined to a single pattern.

    Why these particular structures fail while others do not is the standing unanswered
    question of Leigh-syndrome biology generally, and nothing in the NDUFB8 literature
    addresses it; the node asserts the regional vulnerability, not an explanation for it.

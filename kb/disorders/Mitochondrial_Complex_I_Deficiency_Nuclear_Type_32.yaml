- name: Exon 4 Skipping from a Variant-Created Exonic Splicing Silencer
  biological_scale: MOLECULAR
  description: >-
    The c.432C>G (p.Cys144Trp) allele behaves mostly as a splicing variant rather than a
    missense one. It creates a new exonic splicing silencer, and Sanger sequencing of patient
    cDNA showed skipping of exon 4, which encodes Met105 to Val156 - the segment carrying the
    transmembrane helix. Skipping is favoured but not complete: about 14 percent of total cDNA
    still carried the missense sequence, so the allele produces a mixture of a
    large in-frame-disrupting deletion product and a low level of full-length mutant protein.
    This is the one place in the entity where the molecular consequence of an allele is not
    what its protein-level nomenclature suggests.

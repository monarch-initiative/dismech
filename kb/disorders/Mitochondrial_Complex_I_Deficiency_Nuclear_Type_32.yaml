- name: Isolated Complex I Enzyme Deficiency
  biological_scale: CELLULAR
  description: >-
    The measurable consequence in patient tissue: a decrease in complex I enzymatic activity
    in both muscle and fibroblasts, with the other respiratory chain complexes spared. The
    deficiency is isolated, which is what places the entity among the complex I deficiencies
    rather than among the combined oxidative phosphorylation defects. Residual activity
    figures for the individual patients are not given in the sources available here.

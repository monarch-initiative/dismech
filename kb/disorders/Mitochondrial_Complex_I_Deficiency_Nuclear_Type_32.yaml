- name: Cytosolic Redox Shift and Lactate Overproduction
  biological_scale: ORGANISM
  description: >-
    A complex I defect leaves NADH unoxidised, and the cytosolic NADH/NAD+ ratio is
    restored instead by lactate dehydrogenase reducing pyruvate to lactate. Raised blood
    lactate is the routine clinical signature of that shift and was present in both 2018
    patients. The step is standard mitochondrial-disease biochemistry rather than something
    demonstrated in these patients, and is curated as such.
  evidence:
  - reference: PMID:29429571
    reference_title: "NDUFB8 Mutations Cause Mitochondrial Complex I Deficiency in Individuals with Leigh-like Encephalomyopathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood lactate was elevated. Neuroimaging disclosed progressive changes in the basal ganglia and either brain stem or internal capsule."
    explanation: >-
      The elevated lactate in the two index patients. INDIRECT for this node because the
      observation is the raised lactate itself, not the redox mechanism the node names.
  downstream:

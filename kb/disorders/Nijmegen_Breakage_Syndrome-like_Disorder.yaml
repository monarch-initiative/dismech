    In the marrow-failure arm the haematological phenotype is superimposed on the
    congenital growth/microcephaly phenotype and is progressive rather than static.
  evidence:
  - reference: PMID:37794136
    reference_title: Bone Marrow Failure and Immunodeficiency Associated with Human RAD50 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a girl with microcephaly, mental retardation, bird-like face, short stature, bone marrow failure and B-cell immunodeficiency."
    explanation: Documents marrow failure arising on the background of the congenital NBSLD phenotype.
pathophysiology:
- name: RAD50 loss-of-function
  biological_scale: MOLECULAR
  description: >-
    Biallelic hypomorphic RAD50 variants (nonsense, frameshift, splice-disrupting,
    stop-readthrough and in-frame deletion alleles) reduce the level or stability of
    RAD50, the SMC-family ATPase that bridges broken DNA ends within the MRN complex.
    Rad50-null mice are inviable and no human with complete RAD50 loss has been reported,
    so viable patients are inferred to retain partial function. Note that the lethality
    evidence is murine; the inference to human viability has not been tested directly.
  gene:
    preferred_term: RAD50
    description: RAD50 double-strand break repair protein, the ATPase core of the MRN complex.
    modifier: DECREASED
    term:
      id: hgnc:9816
      label: RAD50
  genes:
  - preferred_term: RAD50
    term:
      id: hgnc:9816
      label: RAD50
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that she is compound heterozygous for mutations in the RAD50 gene that give rise to low levels of unstable RAD50 protein."
    explanation: Directly establishes reduced, unstable RAD50 protein as the primary molecular lesion.
  - reference: PMID:32212377
    reference_title: "Human RAD50 deficiency: Confirmation of a distinctive phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblotting experiments showed strongly reduced protein levels of RAD50 in the patient-derived fibroblasts"
    explanation: Independent confirmation of reduced RAD50 protein in patient cells.
  - reference: PMID:12208847
    reference_title: Cancer predisposition and hematopoietic failure in Rad50(S/S) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Null mutants of each are inviable."
    explanation: >-
      Supports the hypomorphic-allele requirement: complete loss of any MRN component is
      lethal in mouse, which is the basis for inferring that viable human patients retain
      partial RAD50 function. The lethality result is murine, not human.
  downstream:
  - target: Failure of MRN damage-focus formation and DSB sensing
    causal_link_type: DIRECT
    description: >-
      Loss of the RAD50 ATPase scaffold prevents productive assembly and recruitment of
      the MRE11-RAD50-NBN complex at double-strand breaks.
- name: Failure of MRN damage-focus formation and DSB sensing
  biological_scale: MOLECULAR
  description: >-
    The MRN complex is among the first entities recruited to a double-strand break.
    In RAD50-deficient patient cells, damage-induced MRN nuclear focus formation fails.
    The defect is in damage-recruited focus formation and sensing, NOT necessarily in
    complex assembly: the RAD50 E1035del coiled-coil allele still assembles an MRN
    complex but impairs MRE11 nuclease function and end resection, and in the
    p.Arg83His/p.Glu485Ter patient RAD50 expression and complex formation were maintained
    while ATM signalling still failed. Cryo-EM shows why assembly and signalling are
    separable - NBS1's ATM-recruitment motif is sequestered on the regulatory RAD50 S
    site and must be released for ATM activation, so RAD50 lesions can block signalling
    from within an intact complex.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: ABNORMAL
    term:
      id: GO:0006302
      label: double-strand break repair
  cellular_components:
  - preferred_term: site of double-strand break
    term:
      id: GO:0035861
      label: site of double-strand break
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "failure to form DNA damage-induced MRN foci"
    explanation: Directly documents failure of MRN focus formation in RAD50-deficient patient cells.
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The MRE11/RAD50/NBN (MRN) complex plays a key role in recognizing and signaling DNA double-strand breaks (DSBs)."
    explanation: Establishes the DSB-sensing role of the complex that RAD50 deficiency disrupts.
  - reference: PMID:37794136
    reference_title: Bone Marrow Failure and Immunodeficiency Associated with Human RAD50 Variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression of RAD50 protein and MRN complex formation was maintained in the cells derived from this patient."
    explanation: >-
      Qualifies the node: in some RAD50 genotypes the complex still assembles, so the
      downstream signalling failure is not simply a consequence of absent complex.
  - reference: PMID:40968163
    reference_title: Structural basis for DNA break sensing by human MRE11-RAD50-NBS1 and its regulation by telomeric factor TRF2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MRN senses DSBs through a tight clamp-like sensing state with closed coiled-coil domains, but auto-inhibited MRE11 nuclease. NBS1 wraps around the MRE11 dimer, with NBS1's ATM recruitment motif sequestered by binding to the regulatory RAD50 S site, necessitating a switch in the NBS1 C helix for ATM activation."
    explanation: >-
      Cryo-EM structures show that RAD50 directly gates ATM activation through its
      regulatory S site, giving a structural basis for why RAD50 lesions abolish ATM
      signalling even when the complex still assembles.
  downstream:
  - target: Impaired ATM activation and DNA damage signaling
    causal_link_type: DIRECT
    description: >-
      MRN is required to recruit and activate ATM at breaks; its failure blunts the
      ATM-dependent phosphorylation cascade.
  - target: Impaired DNA end resection and homologous recombination repair
    causal_link_type: DIRECT
    description: >-
      RAD50 gates MRE11 nuclease access, so RAD50 defects impair initiation of resection
      and homology-directed repair.
- name: Impaired ATM activation and DNA damage signaling
  biological_scale: MOLECULAR
  description: >-
    Radiation-induced activation of the ATM kinase and phosphorylation of its downstream
    substrates are markedly reduced in RAD50-deficient patient fibroblasts, phenocopying
    the signalling defect of ataxia-telangiectasia. Complementation with wild-type RAD50
    restores ATM activation, establishing the dependency.
  biological_processes:
  - preferred_term: DNA damage checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000077
      label: DNA damage checkpoint signaling
  - preferred_term: DNA damage response
    modifier: ABNORMAL
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired radiation-induced activation of and downstream signaling through the ATM protein, which is defective in the human genetic disorder ataxia-telangiectasia"
    explanation: Directly documents impaired ATM activation and downstream signalling in patient cells.
  - reference: PMID:37794136
    reference_title: Bone Marrow Failure and Immunodeficiency Associated with Human RAD50 Variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DNA damage-induced activation of the ATM kinase was markedly decreased, which was restored by the expression of wild-type (WT) RAD50."
    explanation: >-
      Complementation with wild-type RAD50 rescues ATM activation, establishing that the
      signalling defect is directly caused by the RAD50 lesion.
  - reference: PMID:32212377
    reference_title: "Human RAD50 deficiency: Confirmation of a distinctive phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "provided evidence for a markedly reduced radiation-induced AT-mutated signaling"

- name: Impaired DNA end resection and homologous recombination repair
  biological_scale: MOLECULAR
  description: >-
    RAD50 regulates MRE11-dependent 5'-3' end resection, the committed step of
    homology-directed repair, and also supports replication-fork function. The
    RAD50 E1035del coiled-coil allele demonstrates that this arm is genetically
    separable from ATM signalling, defining a separation-of-function mechanism within
    NBSLD.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:33378670
    reference_title: A Disease-Causing Single Amino Acid Deletion in the Coiled-Coil Domain of RAD50 Impairs MRE11 Complex Functions in Yeast and Humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation represents a human RAD50 separation-of-function mutation that impairs DNA repair, DNA replication, and DNA end resection without affecting ATM-dependent DNA damage response."
    explanation: >-
      Establishes an ATM-independent resection/repair arm of RAD50 pathogenesis and its
      genetic separability from the checkpoint-signalling arm.
  - reference: PMID:33378670
    reference_title: A Disease-Causing Single Amino Acid Deletion in the Coiled-Coil Domain of RAD50 Impairs MRE11 Complex Functions in Yeast and Humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Purified recombinant proteins indicate that RAD50E1035Δ impairs MRE11 nuclease activity."
    explanation: Biochemical demonstration that the RAD50 lesion acts by impairing MRE11 nuclease activity.
  downstream:
  - target: Chromosomal instability and cellular radiosensitivity
    causal_link_type: DIRECT
    description: >-
      Failure of homology-directed repair leaves double-strand breaks to be resolved by
      error-prone routes, generating breaks and rearrangements.

name: Nijmegen Breakage Syndrome-like Disorder
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Nijmegen breakage syndrome-like disorder (NBSLD, RAD50 deficiency) is an
  ultra-rare autosomal recessive chromosomal instability syndrome caused by
  biallelic hypomorphic variants in RAD50, the SMC-family ATPase core of the
  MRE11-RAD50-NBN (MRN) DNA double-strand break sensor complex. RAD50 loss
  destabilises the MRN complex, abolishes damage-induced MRN focus formation and
  impairs ATM activation, producing cell-cycle checkpoint failure, radioresistant
  DNA synthesis, radiosensitivity and chromosomal instability. Clinically it
  phenocopies Nijmegen breakage syndrome - severe pre- and postnatal growth
  restriction, microcephaly, "bird-like" facies and mild intellectual impairment -
  but the originally described patients lacked severe infections, immunoglobulin
  deficiency and lymphoid malignancy, which is the feature that distinguishes NBSLD
  from NBN-related NBS. A subsequently recognised, allele-dependent arm of the
  spectrum does manifest bone marrow failure with B-cell immunodeficiency.
category: Mendelian
parents:
- hereditary disease
- chromosomal instability syndrome
- DNA repair disease
synonyms:
- NBSLD
- RAD50 deficiency
- NBS-like disorder
- microcephaly and chromosomal instability without immunodeficiency

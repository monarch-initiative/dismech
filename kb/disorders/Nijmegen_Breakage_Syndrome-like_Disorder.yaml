treatments:
- name: Recombinant human growth hormone
  description: >-
    Somatropin has been used off-label for the short stature of NBSLD. In the single
    reported experience, 5 years 9 months of therapy improved height from -3.35 SD to
    -1.28 SD with no tumour at 5-year post-discontinuation follow-up. IMPORTANT SAFETY
    CAVEAT - in that case growth hormone was started by junior physicians before any
    genetic evaluation; the authors emphasise that genetic evaluation should precede
    growth-promoting therapy in syndromic short stature, because growth hormone/IGF-1
    signalling is mitogenic and the underlying DNA repair deficiency may raise tumour
    risk. The evidence base is one patient.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although recombinant human growth hormone significantly improved the patient's growth rate (from -3.35 SD to -1.28 SD), these variants may serve as a potential molecular basis for Nijmegen Breakage Syndrome-like disease and could also increase the risk of tumor formation."
    explanation: >-
      Reports both the growth benefit and the explicit tumour-risk caution attached to it in
      the single documented NBSLD growth hormone experience.
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 4.5 years, the child with syndromic short stature was prescribed recombinant human growth hormone for height correction by junior resident physicians, with no genetic evaluation performed prior to treatment."
    explanation: >-
      Documents the safety lesson that the therapy was given without prior genetic
      evaluation, which the report frames as the central cautionary finding.
- name: Surveillance-based supportive management
  description: >-
    In the absence of any disease-modifying therapy, reported NBSLD patients are managed
    with regular clinical surveillance and multidisciplinary supportive care. Because
    patient cells are radiosensitive, non-ionizing imaging (MRI, ultrasound) is preferred
    over CT and plain radiography where feasible.

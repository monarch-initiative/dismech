  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41655867
    reference_title: "Expanding the mutational spectrum of RAD50: a case report of Nijmegen breakage syndrome-like disorder in a Chinese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it is not presently required for this patient, who is managed with regular surveillance."
    explanation: Documents surveillance-based management as the current standard for an NBSLD patient.
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

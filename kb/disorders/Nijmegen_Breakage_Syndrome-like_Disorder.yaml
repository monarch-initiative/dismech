    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The data indicate that even subtle perturbation of Mre11 complex functions results in severe genotoxic stress, and that the complex is critically important for homeostasis of proliferative tissues."
    explanation: >-
      Establishes in a hypomorphic Rad50 mouse that partial MRN perturbation selectively

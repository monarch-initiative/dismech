differential_diagnoses:
- name: Nijmegen breakage syndrome
  description: >-
    The NBN-related disorder that NBSLD phenocopies. Shares microcephaly, growth failure,
    bird-like facies, chromosomal instability and radiosensitivity.
  disease_term:
    preferred_term: Nijmegen breakage syndrome
    term:
      id: MONDO:0009623
      label: Nijmegen breakage syndrome
  distinguishing_features:
  - Combined cellular and humoral immunodeficiency with recurrent sinopulmonary infection is characteristic of NBS but absent in classic NBSLD.
  - Strong predisposition to lymphoid malignancy is characteristic of NBS; the longest-followed NBSLD patient was malignancy-free at 23 years.
  - Premature ovarian failure in females is characteristic of NBS and has not been reported in NBSLD.
  - Intellectual abilities decline over time in NBS, whereas NBSLD cognition has been stable and non-progressive.
  - Early growth deficiency improves with age in NBS, whereas NBSLD growth restriction persists into adulthood.
  - Causal gene is NBN in NBS versus RAD50 in NBSLD.
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on a patient previously diagnosed as probably having NBS, with microcephaly, mental retardation, 'bird-like' face, and short stature. At variance with this diagnosis, she never had severe infections, had normal immunoglobulin levels, and did not develop lymphoid malignancy up to age 23 years."
    explanation: >-
      Documents both the initial misdiagnosis as NBS and the specific features that
      distinguish NBSLD from it.
  - reference: PMID:20301355
    reference_title: Nijmegen Breakage Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nijmegen breakage syndrome (NBS) is characterized by progressive microcephaly, early growth deficiency that improves with age, recurrent respiratory infections, an increased risk for malignancy (primarily lymphoma), and premature ovarian failure in females."
    explanation: >-
      The GeneReviews chapter for NBS - the differential, not for NBSLD - supplies the
      authoritative NBS feature set. Recurrent respiratory infection, lymphoma risk and
      premature ovarian failure are absent from classic NBSLD, and NBS growth deficiency
      improves with age whereas NBSLD growth restriction persists.
  - reference: PMID:20301355
    reference_title: Nijmegen Breakage Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual abilities tend to decline over time."
    explanation: >-
      Cognitive decline over time is characteristic of NBS, whereas NBSLD cognition has been
      described as stable and non-progressive - a further discriminator between the two.
- name: Ataxia-telangiectasia-like disorder
  description: >-
    The MRE11-related member of the MRN-complex disease triad. Shares radiosensitivity and
    defective ATM signalling with NBSLD.
  disease_term:
    preferred_term: ataxia-telangiectasia-like disorder 1
    term:
      id: MONDO:0024557
      label: ataxia-telangiectasia-like disorder 1
  distinguishing_features:
  - ATLD is dominated by progressive cerebellar ataxia and neurodegeneration, whereas NBSLD cognition has been non-progressive in the best-followed patients.
  - Severe congenital microcephaly with pre- and postnatal growth failure is the leading feature of NBSLD rather than of ATLD.
  - Causal gene is MRE11A in ATLD versus RAD50 in NBSLD.
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomorphic mutations in NBN (previously known as NBS1) and MRE11A give rise to the autosomal-recessive diseases Nijmegen breakage syndrome (NBS) and ataxia-telangiectasia-like disorder (ATLD), respectively."
    explanation: Establishes ATLD as the MRE11A-related sibling disorder within the MRN triad.
  - reference: PMID:38686720
    reference_title: "[Research Progress in the Roles of MRE11-RAD50-NBS1 Complex and Human Diseases]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we discuss the human diseases such as ataxia-telangiectasia-like disorder,Nijmegen breakage syndrome,and Nijmegen breakage syndrome-like disorder that are caused by dysfunctions in the MRN complex"
    explanation: >-
      A dedicated MRN review that treats ATLD, NBS and NBSLD as the three MRN-complex
      disorders, supporting the triad framing on which this differential rests.
- name: Ataxia-telangiectasia
  description: >-
    The ATM-related disorder whose cellular phenotype NBSLD closely mimics - impaired ATM
    signalling, radioresistant DNA synthesis and radiosensitivity are shared.
  disease_term:
    preferred_term: ataxia telangiectasia
    term:
      id: MONDO:0008840
      label: ataxia telangiectasia
  distinguishing_features:
  - Progressive cerebellar ataxia and oculocutaneous telangiectasia characterise A-T and are not features of NBSLD.
  - The primary lesion is in ATM itself in A-T, versus upstream MRN/RAD50 in NBSLD.
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impaired radiation-induced activation of and downstream signaling through the ATM protein, which is defective in the human genetic disorder ataxia-telangiectasia"
    explanation: >-
      Documents the shared ATM-signalling defect that makes A-T the key cellular-phenotype
      differential.
- name: Dyskeratosis congenita
  description: >-
    Relevant specifically to the bone-marrow-failure arm. The E1035del patient presented
    with marrow failure plus the classic dyskeratosis congenita mucocutaneous triad - skin
    pigmentation, nail dysplasia and leukoplakia - which the authors read as suggesting a
    DNA repair and/or telomere maintenance defect. A telomere-biology disorder is therefore
    the leading alternative diagnosis in an NBSLD patient presenting this way.
  disease_term:
    preferred_term: dyskeratosis congenita
    term:
      id: MONDO:0015780
      label: dyskeratosis congenita
  distinguishing_features:
  - Severe congenital microcephaly with pre- and postnatal growth restriction is characteristic of NBSLD and not of dyskeratosis congenita.
  - Dyskeratosis congenita is caused by telomere-maintenance gene defects with short telomeres, whereas NBSLD is caused by biallelic RAD50 variants affecting DSB sensing.
  - Radioresistant DNA synthesis and impaired ATM activation point to NBSLD rather than a telomere-biology disorder.
  evidence:
  - reference: PMID:33378670
    reference_title: A Disease-Causing Single Amino Acid Deletion in the Coiled-Coil Domain of RAD50 Impairs MRE11 Complex Functions in Yeast and Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, P1's clinical features were reminiscent of a defect in DNA repair and/or telomere maintenance"
    explanation: >-
      The authors explicitly flag telomere maintenance as the competing explanation for this
      presentation, which is what makes dyskeratosis congenita the relevant differential for
      the marrow-failure arm.
discussions:
- discussion_id: nbsld_cancer_risk_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does RAD50 deficiency confer a cancer predisposition comparable to that of NBN-related
    Nijmegen breakage syndrome, or is the apparent absence of malignancy in NBSLD real?
  attaches_to:
  - pathophysiology#Chromosomal instability and cellular radiosensitivity
  rationale: >-
    No malignancy has been reported in the longest-followed NBSLD patients (index patient
    malignancy-free at 23 years; a growth-hormone-treated patient tumour-free at 5-year
    follow-up). But the total published cohort is fewer than ten patients with variable
    follow-up, and both the paralogous human diseases (NBS, ATLD) and the hypomorphic
    Rad50(S/S) mouse show clear cancer predisposition. Absence of evidence here is not
    evidence of absence, and case-report authors explicitly flag increased tumour risk when
    considering mitogenic therapy.
  proposed_experiments:
  - experiment_id: exp_nbsld_prospective_oncologic_registry
    name: International RAD50-deficiency registry with prospective oncologic follow-up
    description: >-
      Assemble all molecularly confirmed RAD50-deficient patients into a shared registry
      with standardised, prospective, lifelong cancer surveillance and a defined minimum
      follow-up, so that malignancy incidence can be estimated rather than inferred from
      scattered case reports of varying duration.
  - experiment_id: exp_nbsld_genotype_stratified_cancer_risk
    name: Genotype-stratified analysis of cancer incidence against residual RAD50 function
    description: >-
      Measure residual RAD50 function for each patient allele using the established
      lentiviral complementation assays (damage response, mitotic progression), then test
      whether malignancy occurrence tracks residual function - which would explain why the
      classic arm appears cancer-free while the mouse model is cancer-prone.
  evidence:
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these variants may serve as a potential molecular basis for Nijmegen Breakage Syndrome-like disease and could also increase the risk of tumor formation"
    explanation: >-
      Authors of the only treated case explicitly raise unresolved tumour risk despite the
      absence of observed malignancy.
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "due to the rarity of cases and the short follow-up period, we cannot\nrule out the possibility that patients with NBSLD caused by RAD50\nmutations are at an increased risk of malignancy. Patients with\nNBSLD caused by RAD50 mutations should be regularly monitored\nfor tumor occurrence."
    explanation: >-
      States the knowledge gap directly in the authors' own words - rarity and short
      follow-up prevent excluding increased malignancy risk - and gives the resulting
      surveillance recommendation. This is the primary warrant for this discussion.
  - reference: PMID:12208847
    reference_title: Cancer predisposition and hematopoietic failure in Rad50(S/S) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hypomorphic Rad50 mutant mice (Rad50(S/S) mice) exhibited growth defects and cancer predisposition"
    explanation: >-
      The hypomorphic mouse model does show cancer predisposition, which is what makes the
      human observation surprising and the gap worth resolving.
- discussion_id: rad50_heterozygous_carrier_cancer_risk
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    What, if anything, should parents and other heterozygous RAD50 carriers identified
    through an NBSLD diagnosis be told about their own cancer risk?
  rationale: >-
    This is a carrier-level question, deliberately kept out of the disease's genetic record
    because it is not evidence about NBSLD itself. Monoallelic RAD50 loss-of-function is
    studied as a breast-cancer susceptibility allele, but the risk is not uniform across
    alleles: a Northern Finnish population-based study classified the recurrent founder
    allele RAD50 c.687delT as a moderate-risk allele, whereas broader analyses of
    heterozygous RAD50 pathogenic variants have not shown a consistent overall breast-cancer
    excess. Cascade testing after an NBSLD diagnosis will identify obligate carrier parents,
    so the scope and limits of that risk statement matter practically. Nothing here implies
    a cancer risk statement for the biallelic disease.
  evidence:
  - reference: PMID:40009290
    reference_title: Population-based study of recurrent DNA damage response gene variants in breast cancer cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas CHEK2 c.1100delC, MCPH1 c.909_921del, and RAD50 c.687delT were moderate-risk alleles"
    explanation: >-
      Establishes moderate breast-cancer risk specifically for the recurrent RAD50 c.687delT
      allele in a Northern Finnish population-based case-control study; it does not
      generalise to all heterozygous RAD50 variants or to any population.
- discussion_id: rad50_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the hypomorphic Rad50(S/S) mouse faithfully model classic human NBSLD, given that
    the mouse dies of bone marrow failure with cancer predisposition while classic human
    NBSLD patients have preserved immunity, no malignancy and a stable course?
  attaches_to:
  - pathophysiology#Genotoxic stress in proliferating progenitor pools
  rationale: >-
    The progenitor-attrition mechanism invoked for human growth failure and microcephaly is
    demonstrated principally in Rad50(S/S) mice, but that model's dominant outcomes -
    lethal haematopoietic failure and tumours - correspond to the minority bone-marrow-failure
    arm of the human spectrum, not the classic arm. Conversely, no mouse model reproduces
    the severe congenital microcephaly that defines human NBSLD. Because Rad50 nulls are
    embryonically lethal, viable models necessarily carry particular hypomorphic alleles
    whose residual activity may not correspond to any human genotype, so mechanistic
    inferences drawn from the mouse for the human neurodevelopmental phenotype have
    uncertain translational validity.
  proposed_experiments:
  - experiment_id: exp_rad50_humanised_allele_knockin_mice
    name: Knock-in mice carrying human NBSLD RAD50 alleles
    description: >-
      Generate mice bearing the specific human alleles (E1035del, p.Arg83His, the exon-15
      splice allele) and compare cortical progenitor dynamics, body growth, haematopoiesis
      and tumour incidence, to test whether particular human alleles reproduce the classic
      growth/microcephaly arm rather than the murine marrow-failure/cancer phenotype.
  - experiment_id: exp_rad50_cerebral_organoids
    name: RAD50-deficient human cerebral organoids
    description: >-
      Derive iPSC cerebral organoids from RAD50-deficient patients and quantify neural
      progenitor proliferation, premature differentiation and apoptosis, mirroring the
      organoid work already done for NBN-related Nijmegen breakage syndrome, to test the
      progenitor-attrition route to microcephaly directly in human tissue.
  evidence:
  - reference: PMID:12208847
    reference_title: Cancer predisposition and hematopoietic failure in Rad50(S/S) mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rad50(S/S) mice died with complete bone marrow depletion as a result of progressive hematopoietic stem cell failure."
    explanation: >-
      The mouse's lethal marrow phenotype is the specific outcome that does not match classic
      human NBSLD.
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she never had severe infections, had normal immunoglobulin levels, and did not develop lymphoid malignancy up to age 23 years"
    explanation: >-
      The human classic phenotype lacks the haematologic and oncologic outcomes that dominate
      the mouse model.
notes: >-
  No GeneReviews chapter exists for RAD50-related Nijmegen breakage syndrome-like disorder;
  PubMed searches for "RAD50 GeneReviews" and "Nijmegen breakage syndrome-like GeneReviews"
  returned no results (checked 2026-07-31), so the usual GeneReviews phenotype baseline is
  unavailable and this entry is built directly from the primary case-report literature.
  PMID:20301355 IS a GeneReviews chapter, but it is the chapter for NBN-related Nijmegen
  breakage syndrome and is cited here only as the authoritative source for the differential
  diagnosis. It is deliberately NOT tagged GeneReviews in the references block, because
  that tag would wrongly imply RAD50-related NBSLD has a GeneReviews baseline.

  Additional Orphanet-listed features not yet curated here, because no verified
  primary-source snippet was found for them, include mild spasticity, slight
  non-progressive ataxia, hyperopia, multiple pigmented nevi, widely spaced nipples and
  clinodactyly. These are recoverable via the repo's ORPHA structured source
  (ORPHA:240760) once the Orphadata bulk XML is refreshed - references_cache/ORPHA_240760.md
  is not currently present in this checkout, and data/orphadata/ holds only the MANIFEST,
  so the rows could not be quoted. Regenerating that cache and adding the six features is a
  well-defined follow-up.

  Note on quotable scope: four of the cited references are cached as FULL TEXT
  (PMID:33378670 full_text_xml; PMID:41798197, PMID:40968163, PMID:40009290 full_text_pdf),
  and the reference validator matches against the cached body rather than the abstract, so
  full-text statements in those four are quotable. Phenotypes drawn from the PMID:33378670
  and PMID:41798197 full texts are curated accordingly. Features remaining uncurated are
  those reported only in sources NOT cached here - sensorineural hearing loss, Chiari
  malformation and the Wolff-Parkinson-White pattern, which the deep-research sweep
  attributes to reports outside this reference set.

      explanation: >-
        Explicitly classifies the marrow-failure arm of RAD50 deficiency as an inborn error
        of immunity characterised by bone marrow failure.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    NBSLD is caused by biallelic (compound heterozygous or homozygous)
    hypomorphic RAD50 variants and segregates as an autosomal recessive trait,
    in parallel with the other two MRN-complex disorders (NBN-related Nijmegen
    breakage syndrome and MRE11-related ataxia-telangiectasia-like disorder).
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypomorphic mutations in NBN (previously known as NBS1) and MRE11A give rise to the autosomal-recessive diseases Nijmegen breakage syndrome (NBS) and ataxia-telangiectasia-like disorder (ATLD), respectively."
    explanation: >-
      Establishes the autosomal recessive, hypomorphic-allele paradigm for the MRN-complex
      disorders within which the index RAD50-deficient patient (compound heterozygous for
      two RAD50 mutations) was characterised.
  - reference: PMID:41655867
    reference_title: "Expanding the mutational spectrum of RAD50: a case report of Nijmegen breakage syndrome-like disorder in a Chinese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nijmegen breakage syndrome-like disorder (NBSLD) is a rare chromosomal instability syndrome caused by biallelic pathogenic variants in RAD50"
    explanation: Directly states that NBSLD requires biallelic RAD50 variants, i.e. recessive inheritance.
has_subtypes:
- name: Classic NBSLD
  display_name: Classic NBSLD (growth failure and microcephaly without immunodeficiency)
  description: >-
    The originally delineated presentation: severe pre- and postnatal growth
    restriction, microcephaly, "bird-like" facies, mild intellectual impairment,
    cellular radiosensitivity and radioresistant DNA synthesis, but without severe
    recurrent infection, immunoglobulin deficiency or lymphoid malignancy. The index
    patient remained free of malignancy to age 23 years.
  evidence:
  - reference: PMID:19409520
    reference_title: Human RAD50 deficiency in a Nijmegen breakage syndrome-like disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At variance with this diagnosis, she never had severe infections, had normal immunoglobulin levels, and did not develop lymphoid malignancy up to age 23 years."
    explanation: >-
      Defines the distinguishing negative features of classic NBSLD relative to NBN-related
      Nijmegen breakage syndrome.
  - reference: PMID:32212377
    reference_title: "Human RAD50 deficiency: Confirmation of a distinctive phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparison with the previously reported case and with patients presenting with NBS confirms that RAD50 mutations lead to a similar, but distinctive phenotype."
    explanation: Independent confirmation that RAD50 deficiency produces a distinctive, NBS-separable phenotype.
- name: NBSLD with bone marrow failure
  display_name: NBSLD with bone marrow failure and B-cell immunodeficiency
  description: >-
    An allele-dependent arm of the RAD50-deficiency spectrum in which the core
    growth/microcephaly phenotype is accompanied by progressive bone marrow failure
    and B-lymphocyte deficiency, so that NBSLD presents as an inborn error of
    immunity. Reported with the RAD50 E1035del separation-of-function allele and with
    compound heterozygosity for p.Arg83His and p.Glu485Ter.
  evidence:
  - reference: PMID:37794136
    reference_title: Bone Marrow Failure and Immunodeficiency Associated with Human RAD50 Variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RAD50 deficiency/NBSLD can manifest as a distinct inborn error of immunity characterized by bone marrow failure and B-cell immunodeficiency."
    explanation: Directly delineates the bone-marrow-failure/immunodeficiency arm of NBSLD.
  - reference: PMID:33378670
    reference_title: A Disease-Causing Single Amino Acid Deletion in the Coiled-Coil Domain of RAD50 Impairs MRE11 Complex Functions in Yeast and Humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identify a patient with bone marrow failure and developmental defects caused by biallelic RAD50 mutations."
    explanation: Independent report of a biallelic RAD50 patient whose presentation included bone marrow failure.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ascertainment is limited to individual case reports. The two 2026 reports quoted below
    describe the literature as "less than 5 cases" and "merely few cases" respectively;
    counting the distinct patient genotypes curated in this entry's variants section plus
    the separately reported E1035del patient gives on the order of six molecularly
    confirmed patients, so the two 2026 phrasings are best read as approximate rather than
    exact. No population-based prevalence estimate exists.
  evidence:
  - reference: PMID:41798197
    reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned recombinant human growth hormone treatment response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is very rare (less than 5 cases) with limited clinical data and treatment experience."
    explanation: Directly supports an ultra-rare, case-report-only occurrence for NBSLD.
  - reference: PMID:41655867
    reference_title: "Expanding the mutational spectrum of RAD50: a case report of Nijmegen breakage syndrome-like disorder in a Chinese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Merely few cases have been reported worldwide, and its phenotypic spectrum remains incompletely defined."
    explanation: Confirms that worldwide ascertainment is limited to a handful of reported cases.

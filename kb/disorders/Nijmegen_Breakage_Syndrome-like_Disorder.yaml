mechanistic_hypotheses:
- hypothesis_group_id: allele_dependent_immunohematologic_arm
  hypothesis_label: Residual RAD50 function determines whether the immune/haematopoietic arm manifests
  status: EMERGING
  description: >-
    Reported RAD50 genotypes segregate into a "classic" arm with growth failure and
    microcephaly but preserved immunity, and an arm with bone marrow failure and B-cell
    immunodeficiency. The proposed explanation is that different alleles preserve
    different MRN sub-functions: the E1035del coiled-coil allele impairs end resection
    and replication while sparing ATM signalling, whereas the p.Arg83His/p.Glu485Ter
    genotype preserves complex assembly but abolishes ATM activation. Which sub-function
    is retained is hypothesised to determine whether the haematopoietic/B-cell
    compartment decompensates. This mapping is inferred from a handful of patients and
    has not been tested systematically.
  evidence:
  - reference: PMID:33378670
    reference_title: A Disease-Causing Single Amino Acid Deletion in the Coiled-Coil Domain of RAD50 Impairs MRE11 Complex Functions in Yeast and Humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation represents a human RAD50 separation-of-function mutation that impairs DNA repair, DNA replication, and DNA end resection without affecting ATM-dependent DNA damage response."
    explanation: Demonstrates that RAD50 alleles can dissociate MRN sub-functions, the premise of the hypothesis.
  - reference: PMID:41031707
    reference_title: RAD50 missense variants differentially affect the DNA damage response and mitotic progression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Eight missense variants, all capable of forming an MRN complex, supported the DNA damage response and mitotic features to different extents, indicating these functions are separable."
    explanation: >-
      Demonstrates that RAD50 variants separate the damage-response and mitotic functions.
      Note the variants tested were cancer-related RAD50 missense alleles, not NBSLD patient
      alleles, so this supports the general principle of functional separability rather than
      the specific classic-versus-marrow-failure split.
  - reference: PMID:41031707
    reference_title: RAD50 missense variants differentially affect the DNA damage response and mitotic progression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional heterogeneity of RAD50 variants could contribute to clinical variability."
    explanation: >-
      Systematic functional dissection of cancer-related RAD50 missense variants explicitly
      proposes allele-level functional heterogeneity as a source of clinical variability -
      the premise this hypothesis extends to the NBSLD allelic spectrum, which the study
      itself did not test.

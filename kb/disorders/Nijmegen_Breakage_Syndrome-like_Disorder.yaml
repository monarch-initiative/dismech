- name: Genotoxic stress in proliferating progenitor pools
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Even subtle perturbation of MRN complex function generates severe genotoxic stress
    that is disproportionately borne by rapidly dividing progenitor compartments -
    neural progenitors during corticogenesis, somatic growth plates, and haematopoietic
    stem cells. This is the proposed convergence point linking a housekeeping DNA-repair
    defect to a selective growth, neurodevelopmental and marrow phenotype. The
    progenitor-attrition mechanism is directly demonstrated in Rad50(S/S) mice; its
    application to the human neurodevelopmental phenotype remains an inference.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  evidence:

name: Progressive Myoclonic Epilepsy Type 7
creation_date: "2026-08-10T00:00:00Z"
description: >
  Progressive myoclonic epilepsy type 7 (EPM7), more commonly known as myoclonus
  epilepsy and ataxia due to potassium channel mutation (MEAK), is an autosomal
  dominant progressive myoclonic epilepsy caused by a heterozygous, typically de
  novo, pathogenic variant in KCNC1, the gene encoding the fast-activating,
  high-threshold voltage-gated potassium channel Kv3.1. The disorder is caused
  almost exclusively by the recurrent variant c.959G>A (p.Arg320His / R320H),
  which produces a dominant-negative loss of Kv3.1 channel function. Kv3.1
  mediates the rapid membrane repolarization that permits sustained high-frequency
  action-potential firing in fast-spiking, parvalbumin-expressing GABAergic
  interneurons and in cerebellar neurons; loss of this current impairs cortical
  inhibition and cerebellar output. Onset is typically in later childhood or
  adolescence (median around 10 years) with progressive, disabling action and
  cortical myoclonus, generalized tonic-clonic seizures, and cerebellar ataxia,
  followed by a variable degree of cognitive involvement. A distinctive,
  paradoxical transient improvement with fever has been observed and traced to a
  temperature-dependent recovery of wild-type Kv3.1 channel availability. EPM7/MEAK
  sits within the broader spectrum of KCNC1-related disorders, which also includes
  a developmental and epileptic encephalopathy phenotype and, for gain-of-function
  variants, a non-epileptic neurodevelopmental phenotype.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    MEAK/EPM7 is a rare disorder with no reliable population prevalence estimate.
    In an exome-sequenced cohort of unexplained PME, the recurrent KCNC1 R320H
    variant accounted for a substantial minority (~13%) of cases, making it one of
    the more common single causes of otherwise unexplained progressive myoclonus
    epilepsy.
genetic:
- name: KCNC1
  gene_term:
    preferred_term: KCNC1
    term:
      id: hgnc:6233
      label: KCNC1
  association: De Novo Variant
  presence: Positive
  variant_origin: GERMLINE
  relationship_type: CAUSATIVE
  notes: >-
    EPM7/MEAK is caused almost exclusively by the recurrent heterozygous
    p.Arg320His (R320H) KCNC1 variant, which exerts a dominant-negative effect on
    the tetrameric Kv3.1 channel. In the discovery cohort this single variant
    explained ~13% of unexplained PME. The variant is highly penetrant and
    produces a specific, relatively homogeneous MEAK phenotype.
  variants:
  - name: KCNC1 c.959G>A (p.Arg320His)
    description: >-
      Recurrent de novo variant substituting histidine for arginine at codon 320
      in the S4 voltage-sensor segment; the dominant-negative disease allele in
      essentially all MEAK/EPM7 patients.
  evidence:
  - reference: PMID:25401298
    reference_title: "A recurrent de novo mutation in KCNC1 causes progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven unrelated exome-sequenced (13%) and two affected individuals in a
      secondary cohort (7%) had this mutation.
    explanation: >-
      Quantifies the recurrence of the KCNC1 R320H variant across the discovery
      and replication cohorts.
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The Arg320His variant, which occurs in the voltage-sensing domain of the
      channel, causes a highly penetrant and specific form of progressive
      myoclonus epilepsy with severe ataxia, designated myoclonus epilepsy and
      ataxia due to potassium channel mutation (MEAK).
    explanation: >-
      Documents the high penetrance and phenotypic specificity of the R320H allele.
diagnosis:
- name: Molecular Genetic Diagnosis of KCNC1-Related Disorder
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic KCNC1
    variant (the recurrent c.959G>A p.Arg320His in MEAK) in a proband with
    suggestive findings. Because PME is genetically heterogeneous, a multigene
    epilepsy/PME panel or exome/genome sequencing is the appropriate first-tier
    test rather than single-gene analysis. Supportive investigations include EEG
    (generalized spike/polyspike-wave discharges with a photoparoxysmal response)
    and brain MRI (progressive symmetrical cerebellar atrophy).
  notes: >-
    Differential diagnosis (the other progressive myoclonic epilepsies): EPM1
    (Unverricht-Lundborg disease, CSTB), Lafora disease (EPM2A/NHLRC1), the
    neuronal ceroid lipofuscinoses, MERRF, POLG-related disorders, sialidosis
    type 1, dentatorubral-pallidoluysian atrophy (DRPLA), and PRICKLE1- and
    KCTD7-related PME.
  evidence:
  - reference: PMID:41411464
    reference_title: "KCNC1-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of KCNC1-related disorders is established in a proband with
      suggestive findings and a heterozygous pathogenic variant in KCNC1
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews statement of the molecular-genetic basis for establishing the
      diagnosis.
treatments:
- name: Anti-Seizure / Anti-Myoclonic Pharmacotherapy
  description: >-
    Symptomatic management with conventional anti-seizure medications used for
    myoclonus, including valproic acid, levetiracetam, clonazepam, and primidone.
    There is no disease-modifying therapy; management is directed at myoclonus,
    seizures, ataxia, and mobility.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: clonazepam
      term:
        id: CHEBI:3756
        label: clonazepam
    - preferred_term: primidone
      term:
        id: CHEBI:8412
        label: primidone
  therapeutic_modality: SMALL_MOLECULE
  notes: >-
    As in the progressive myoclonic epilepsies generally, sodium-channel-blocking
    and certain GABAergic anti-seizure medications can aggravate myoclonus and are
    generally avoided (agents to avoid include phenytoin, carbamazepine,
    gabapentin, and vigabatrin); polytherapy directed at both seizures and
    myoclonus is typical.
  evidence:
  - reference: PMID:41411464
    reference_title: "KCNC1-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Consider pharmacologic intervention with conventional anti-seizure
      medications (ASMs) such as levetiracetam, valproic acid, clonazepam, and/or
      primidone for myoclonus.
    explanation: >-
      GeneReviews management guidance for the myoclonus of KCNC1-related
      disorders including MEAK.
- name: Kv3 Positive Modulator (Precision Therapy)
  description: >-
    Investigational, mechanism-targeted therapy: small-molecule Kv3-channel
    positive modulators (Autifony compounds AUT00206 and the clinical candidate
    AUT00201) that enhance residual Kv3.1 channel activity to counter the
    dominant-negative loss of function. In the EPM7 knock-in mouse, AUT00206
    improved motor function and seizure susceptibility; AUT00201 has entered a
    first-in-MEAK clinical study (NCT05873062). Not yet an approved therapy.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy

inheritance:
- name: Autosomal Dominant (typically de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    MEAK/EPM7 is autosomal dominant and most often caused by a de novo KCNC1
    variant; each child of an affected individual has a 50% chance of inheriting
    the variant. Rare inherited/recurrent familial cases are explained by parental
    (including gonadal/somatic) mosaicism.
  evidence:
  - reference: PMID:25401298
    reference_title: "A recurrent de novo mutation in KCNC1 causes progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a recurrent de novo mutation, c.959G>A (p.Arg320His), in KCNC1 was
      identified as a new major cause for PME.
    explanation: >-
      Establishes the recurrent de novo KCNC1 variant as the dominant cause of
      MEAK/EPM7.
  - reference: PMID:41411464
    reference_title: "KCNC1-Related Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with a KCNC1-related disorder has a 50% chance
      of inheriting the KCNC1 pathogenic variant.
    explanation: >-
      GeneReviews statement of the autosomal dominant transmission risk.
  - reference: PMID:29428275
    reference_title: "Familial cases of progressive myoclonic epilepsy caused by maternal somatic mosaicism of a recurrent KCNC1 p.Arg320His mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our familial MEAK cases show that consideration of parental mosaicism in
      addition to meticulous phenotyping is needed when conducting KCNC1 genetic
      testing.
    explanation: >-
      Documents recurrent familial MEAK explained by maternal mosaicism, the basis
      for the inherited/recurrence-risk caveat.
pathophysiology:
- name: KCNC1 (Kv3.1) Dominant-Negative Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  description: >-
    The recurrent heterozygous KCNC1 variant c.959G>A (p.Arg320His) lies in the
    S4 voltage-sensor segment of the Kv3.1 channel and acts through a
    dominant-negative mechanism: because Kv3 subunits assemble as tetramers,
    mutant subunits co-assemble with wild-type subunits and strongly suppress the
    fast, high-threshold delayed-rectifier potassium current normally carried by
    Kv3.1, chiefly by slowing channel activation.
  genetic_context:
    gene:
      preferred_term: KCNC1
      term:
        id: hgnc:6233
        label: KCNC1
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: voltage-gated potassium channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
  downstream:
  - target: Impaired Fast-Spiking Neuronal Repolarization
    causal_link_type: DIRECT
  - target: Impaired Interneuron Dendritic Development and Viability
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25401298
    reference_title: "A recurrent de novo mutation in KCNC1 causes progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the Arg320His mutant channel showed a
      dominant-negative loss-of-function effect.
    explanation: >-
      Oocyte expression demonstrates the R320H dominant-negative loss of Kv3.1
      function underlying MEAK.
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R320H confers a dominant negative loss-of-function effect by slowing
      channel activation, but does not introduce potentially toxic gating pore
      currents.
    explanation: >-
      Confirms the dominant-negative loss-of-function mechanism and localizes it
      to slowed activation rather than a gating-pore leak current.
- name: Impaired Fast-Spiking Neuronal Repolarization
  biological_scale: CELLULAR
  description: >-
    Kv3.1 provides the rapid repolarizing current that permits brief action
    potentials and sustained high-frequency firing in fast-spiking,
    parvalbumin-positive GABAergic interneurons and in cerebellar neurons. Loss
    of Kv3.1 current broadens action potentials and degrades high-frequency firing
    fidelity in these neurons.
  cell_types:
  - preferred_term: parvalbumin-positive fast-spiking GABAergic interneuron
    term:
      id: CL:4023018
      label: pvalb GABAergic interneuron
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
  - target: Cerebellar Dysfunction and Ataxia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25401298
    reference_title: "A recurrent de novo mutation in KCNC1 causes progressive myoclonus epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KCNC1 encodes KV3.1, a subunit of the KV3 voltage-gated potassium ion
      channels, which are major determinants of high-frequency neuronal firing.
    explanation: >-
      Identifies Kv3.1 as a determinant of high-frequency firing, the function
      lost in MEAK neurons.
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the KV 3.1bR320H variant profoundly reduced excitability of
      mature cortical interneurons, and cells expressing these channels were
      unable to support high-frequency firing.
    explanation: >-
      Directly demonstrates loss of high-frequency firing capacity in
      interneurons expressing the MEAK variant.
- name: Impaired Interneuron Dendritic Development and Viability
  biological_scale: CELLULAR
  description: >-
    Beyond its role in fast repolarization, the R320H mutant channel has an
    unexpected developmental toxicity: in cortical interneurons it severely impairs
    neurite (dendrite) development and reduces interneuron viability, an effect not
    rescued by pharmacologically blocking Kv3 channels. This nominates a
    developmental "dendritopathy" component to MEAK distinct from the acute
    conduction defect.
  biological_processes:
  - preferred_term: neuron projection development
    modifier: DECREASED
    term:
      id: GO:0031175
      label: neuron projection development
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant channel also had an unexpected effect on morphology, severely
      impairing neurite development and interneuron viability, an effect that could
      not be rescued by blocking KV 3 channels.
    explanation: >-
      Demonstrates the non-conducting developmental toxicity of the R320H channel
      on interneuron dendrites and survival.
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MEAK may be described as a developmental dendritopathy."
    explanation: >-
      States the developmental-dendritopathy framing of the MEAK mechanism.
- name: Cortical Excitation-Inhibition Imbalance
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  description: >-
    Impaired firing of fast-spiking inhibitory interneurons reduces cortical
    GABAergic inhibition, shifting the cortical excitation-inhibition balance
    toward excitation and producing sensorimotor cortical hyperexcitability.
  downstream:
  - target: Cortical Reflex Myoclonus and Seizures
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33735526
    reference_title: "Progressive myoclonus epilepsy KCNC1 variant causes a developmental dendritopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KCNC1 encodes the voltage-gated potassium channel KV 3.1, a channel that is
      important for enabling high-frequency firing in interneurons, raising the
      possibility that MEAK is associated with reduced interneuronal function.
    explanation: >-
      Links loss of Kv3.1 interneuron function to the reduced inhibition that
      drives the excitation-inhibition imbalance.
- name: Cortical Reflex Myoclonus and Seizures
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Cortical hyperexcitability generates cortical (reflex) action myoclonus and
    generalized tonic-clonic seizures, the epileptic core of MEAK. Polygraphic
    EEG-EMG recordings localize the myoclonus to a cortical origin.
  evidence:
  - reference: PMID:28380698
    reference_title: "Myoclonus epilepsy and ataxia due to KCNC1 mutation: Analysis of 20 cases and K(+) channel properties."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polygraphic EEG-electromyographic studies demonstrated a cortical origin
      for myoclonus and striking coactivation of agonist and antagonist muscles.
    explanation: >-
      Establishes the cortical origin of the disabling myoclonus in MEAK.
- name: Cerebellar Dysfunction and Ataxia
  biological_scale: ORGANISM
  description: >-
    Loss of Kv3.1-dependent high-frequency firing in cerebellar neurons impairs
    cerebellar output, producing progressive cerebellar ataxia; neuroimaging shows
    progressive symmetrical cerebellar atrophy. Mouse genetics confirm that fast
    repolarization by Kv3.1 in cerebellar circuits (Purkinje cells and the deep
    cerebellar nuclei) is required for motor coordination.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0000120
      label: granule cell
  evidence:
  - reference: PMID:28380698
    reference_title: "Myoclonus epilepsy and ataxia due to KCNC1 mutation: Analysis of 20 cases and K(+) channel properties."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging revealed symmetrical cerebellar atrophy, which
      appeared progressive, and a prominent corpus callosum.
    explanation: >-
      Documents the progressive cerebellar structural correlate of the ataxia.
  - reference: PMID:20016089
    reference_title: "Rescue of motor coordination by Purkinje cell-targeted restoration of Kv3.3 channels in Kcnc3-null mice requires Kcnc1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      As Kcnc1, but not Kcnc3, alleles are lost, mutant mice exhibit increasing
      gait ataxia
    explanation: >-
      Mouse genetics establish the causal role of Kv3.1 (Kcnc1) loss in
      cerebellar gait ataxia.

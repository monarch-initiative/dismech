  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockout of the cytoplasmic UBA1 isoform homologue in zebrafish caused systemic inflammation."
    explanation: >
      Zebrafish knockout of the cytoplasmic UBA1 homologue recapitulates
      systemic inflammation, supporting the causal mechanism in vivo.
  downstream:
  - target: Multi-Organ Inflammation
    causal_link_type: DIRECT
    description: >
      Innate immune activation drives recurrent multi-organ inflammation; the
      cited neutrophilic involvement is specific to skin and lung.
- name: Multi-Organ Inflammation
  description: >
    The cytokine-driven inflammatory program produces recurrent, multi-organ
    inflammation. The cited source specifically describes neutrophilic
    cutaneous and pulmonary inflammation, alongside chondritis and vasculitis;
    it does not characterize every involved organ as neutrophilic. This
    effector phase is the clinical face of the autoinflammatory arm.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  evidence:

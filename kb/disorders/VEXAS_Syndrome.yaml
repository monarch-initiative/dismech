animal_models:
- name: Cytoplasmic UBA1 homologue knockout zebrafish
  species: Danio rerio (zebrafish)
  genotype: Cytoplasmic UBA1 isoform homologue knockout (CRISPR-Cas9)
  description: >
    CRISPR-Cas9 knockout of the cytoplasmic UBA1 isoform homologue in zebrafish
    causes systemic inflammation, providing in vivo support for the proximal
    ubiquitylation-loss mechanism driving autoinflammation.
  evidence:
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockout of the cytoplasmic UBA1 isoform homologue in zebrafish caused systemic inflammation."
    explanation: >
      Zebrafish model recapitulates systemic inflammation downstream of
      cytoplasmic UBA1 loss.
discussions:
- discussion_id: vexas_model_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Multi-Organ Inflammation
  prompt: >
    Do existing zebrafish and mouse Uba1-perturbation models faithfully
    reproduce the full multi-organ, relapsing human VEXAS syndrome (chondritis,
    neutrophilic skin disease, vacuolated marrow precursors, and hematopoietic
    dysfunction), or only its molecular/inflammatory arm?
  rationale: >
    The curated zebrafish knockout reproduces systemic inflammation, and a 2025
    base-edited humanized HSPC model recapitulates proteostatic, cytologic,
    senescence, hematologic, and inflammatory hallmarks. Whether available
    models reproduce the full relapsing multi-organ clinical syndrome remains
    unresolved.
  evidence:
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockout of the cytoplasmic UBA1 isoform homologue in zebrafish caused systemic inflammation."
    explanation: >
      Establishes the inflammatory phenotype reproduced by the curated
      zebrafish model.
  - reference: PMID:40195449
    reference_title: Mechanisms of hematopoietic clonal dominance in VEXAS syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Humanized models of VEXAS syndrome, generated by inserting the causative mutation in healthy HSPCs through base editing, recapitulated proteostatic defects, cytological alterations and senescence signatures of patients' cells, as well as hematological and inflammatory disease hallmarks."
    explanation: >
      Defines the breadth of disease biology reproduced by the newer humanized
      HSPC model without claiming complete organ-level fidelity.
  proposed_experiments:
  - experiment_id: vexas_humanized_met41_mouse
    name: Humanized hematopoietic-restricted somatic Met41 mouse model
    description: >
      Engineer humanized, hematopoietic-restricted somatic Met41 mouse models
      with age-dependent clonal acquisition and assess multi-organ phenotype
      recapitulation including marrow precursor vacuolization and independently
      classified MDS emergence.
- discussion_id: vexas_population_incidence_criteria
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#VEXAS Syndrome
  prompt: >
    What are the general-population incidence and validated classification
    criteria for VEXAS syndrome across diverse populations?
  rationale: >
    Prevalence is estimated from a single US regional, predominantly White
    health-system cohort, so general-population incidence and diverse-ancestry
    estimates remain sparse. The International VEXAS Working Group has now
    published the first formal consensus clinical guidance for testing,
    VEXAS-associated MDS assessment, prognosis, and management; that guidance
    does not eliminate the need for externally validated classification criteria.
  evidence:
  - reference: PMID:36692560
    reference_title: "Estimated Prevalence and Clinical Manifestations of UBA1 Variants Associated With VEXAS Syndrome in a Clinical Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional studies are needed in unselected and genetically diverse populations to better define general population prevalence and phenotypic spectrum."
    explanation: >
      The genome-first prevalence study explicitly identifies the need for
      diverse, population-level replication.
  - reference: PMID:40787890
    reference_title: American College of Rheumatology Guidance Statement for Diagnosis and Management of VEXAS Developed by the International VEXAS Working Group Expert Panel.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This work marks the first formal international consensus guidance for VEXAS and is intended to be used as a resource for clinicians seeking to understand the disease and its management."
    explanation: >
      Establishes that formal international clinical guidance now exists, while
      distinguishing guidance from validated classification criteria.
notes: >
  VEXAS is a clonal-hematopoietic autoinflammatory disorder bridging
  rheumatology and hematology, defined by somatic pathogenic UBA1 variants. No
  existing dismech mechanism module maps cleanly to its somatic-clonal
  innate-immune-dysregulation pattern, so no conforms_to edge is asserted; a
  future clonal-hematopoiesis module would be the natural conformance target.
  The repo's Relapsing_Polychondritis entry already models the VEXAS overlap
  from the RP side. Consensus organ-specific frequency ranges such as 75–100%,
  55–95%, 14–64%, and 20–50% straddle two FrequencyEnum bands, so frequency is
  omitted on those phenotypes rather than guessed. Aseptic meningitis and
  orchitis are reported as less common VEXAS manifestations but are not
  modeled as separate phenotype nodes, because no reference cached for this
  entry carries a claim-specific quotable snippet for them.

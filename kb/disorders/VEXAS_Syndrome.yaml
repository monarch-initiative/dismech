- accession: geo:GSE196052
  title: Single-cell profiling of hematopoietic cells in VEXAS syndrome
  description: 'Background and methods: VEXAS (vacuoles, E1 enzyme, X-linked, autoinflammatory, somatic) syndrome has been recently recognized as an adult-onset autoinflammatory syndrome due to somatic mutations affecting Ubiquitin Like Modifier Activating Enzyme 1 (UBA1) gene. Following-up studies have been mostly limited to case reports; transcriptome of especially hematopoiesis in VEXAS syndrome has not been well characterized. Results: We performed whole transcriptome sequencing of single bone marrow cells (BMMNCs) and enriched Lineage-CD34+ hematopoietic stem and progenitor cells (HSPCs) from nine patients included in the original VEXAS cohort.'

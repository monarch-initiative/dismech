- accession: geo:GSE272816
  title: POISONING OF HEALTHY HEMATOPOIESIS IS AN UNANTICIPATED MECHANISM DRIVING CLONAL DOMINANCE IN VEXAS SYNDROME [scRNA-seq]
  description: Clonal dominance characterizes hematopoiesis during aging and increases susceptibility to blood cancers and common non-malignant disorders. VEXAS syndrome is a recently discovered adult-onset autoinflammatory disease burdened by a high mortality rate and caused by dominant hematopoietic clones bearing somatic mutations in the UBA1 gene. However, pathogenic mechanisms fueling clonal dominance are unknown. Moreover, the lack of disease models hampers the development of disease-modifying therapies. Here, we performed immunophenotypic dissection of hematopoiesis and single-cell transcriptomics in a VEXAS patient cohort revealing pervasive inflammation across all lineages.

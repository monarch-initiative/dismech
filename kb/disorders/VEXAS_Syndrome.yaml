- name: Myeloid-Skewed Hematopoietic Dysfunction
  description: >
    The UBA1-mutant hematopoietic compartment is skewed toward myelopoiesis and
    shows cytologic and senescence-like abnormalities. Cytoplasmic vacuolization
    of myeloid and erythroid precursors is characteristic but neither specific
    nor required. Macrocytic anemia and other cytopenias are common, and a
    substantial subset of patients also meet criteria for myelodysplastic
    syndrome; coexistence does not by itself establish linear progression from
    VEXAS to MDS.
  cell_types:
  - preferred_term: Erythroid lineage cell
    term:
      id: CL:0000764
      label: erythroid lineage cell
  evidence:
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characteristic vacuoles in myeloid and erythroid precursor cells, dysplastic bone marrow"
    explanation: >
      Documents the precursor vacuolization and dysplastic marrow that define
      the hematologic arm of VEXAS.
  - reference: PMID:40195449
    reference_title: Mechanisms of hematopoietic clonal dominance in VEXAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem and progenitor cells (HSPCs) in patients are skewed toward myelopoiesis and acquire senescence-like programs."
    explanation: >
      Patient HSPCs show the myeloid bias and senescence-like state represented
      by this node.
  - reference: PMID:38302223
    reference_title: "Vacuoles in bone marrow progenitors: VEXAS syndrome and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mere observation of vacuolated progenitor cells is not specific to VEXAS syndrome"
    explanation: >
      Establishes that precursor vacuolization is characteristic but not
      pathognomonic.
  downstream:
  - target: Macrocytic Anemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Ineffective, myeloid-skewed hematopoiesis is accompanied by macrocytic
      anemia.
    evidence:
    - reference: PMID:40787890
      reference_title: American College of Rheumatology Guidance Statement for Diagnosis and Management of VEXAS Developed by the International VEXAS Working Group Expert Panel.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Cytopenia, particularly macrocytic anemia, is a common finding in VEXAS, even in the absence of associated MDS."
      explanation: >
        Consensus guidance identifies macrocytic anemia as a common cytopenic
        manifestation of VEXAS.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Hematopoietic dysfunction is commonly accompanied by thrombocytopenia.
    evidence:
    - reference: PMID:40787890
      reference_title: American College of Rheumatology Guidance Statement for Diagnosis and Management of VEXAS Developed by the International VEXAS Working Group Expert Panel.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Macrocytosis is the most common peripheral blood finding in patients with VEXAS, followed by anemia, absolute lymphopenia (80%), moderate thrombocytopenia (30–50%), and monocytopenia (30–50%), whereas neutrophils are often within normal values."
      explanation: >
        The consensus guidance identifies moderate thrombocytopenia as a common
        peripheral-blood finding in VEXAS.

pathophysiology:
- name: Somatic Pathogenic UBA1 Mutation in Hematopoietic Stem Cells
  description: >
    The founding lesion of VEXAS is an acquired (post-zygotic, mosaic) somatic
    pathogenic variant in UBA1 within the hematopoietic stem and progenitor-cell
    compartment. Variants affecting methionine-41 (p.Met41) predominate, but
    pathogenic splice-site and selected non-Met41 variants broaden the molecular
    spectrum.
    Mutant cells are enriched in the myeloid compartment; in the original
    cohort, they were not detected in lymphocytes or fibroblasts.
  cell_types:
  - preferred_term: Hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  genes:
  - preferred_term: UBA1
    term:
      id: hgnc:12469
      label: UBA1
  evidence:
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 25 men with somatic mutations affecting methionine-41 (p.Met41) in UBA1, the major E1 enzyme that initiates ubiquitylation."
    explanation: >
      Establishes the defining somatic UBA1 p.Met41 lesion in affected men as
      the founding genetic event.
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were found in more than half the hematopoietic stem cells, including peripheral-blood myeloid cells but not lymphocytes or fibroblasts."
    explanation: >
      Localizes the somatic mutation to hematopoietic stem cells and the myeloid
      compartment, supporting the HSC origin and diagnostic tissue restriction.
  - reference: PMID:38552317
    reference_title: Description of a novel splice site variant in UBA1 gene causing VEXAS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a novel, somatic variant in a canonical splice site of the UBA1 gene (c.346-2A>G), which was identified in two unrelated adult male patients with late-onset, unexplained inflammatory manifestations including recurrent fever, Sweet syndrome-like neutrophilic dermatosis, and lung inflammation responsive only to glucocorticoids."
    explanation: >
      Demonstrates that a somatic splice-site variant outside the canonical
      p.Met41 substitutions can produce a VEXAS-compatible phenotype.
  downstream:
  - target: Canonical p.Met41 UBA1b Loss and Reduced Ubiquitylation
    causal_link_type: DIRECT
    description: >
      In the canonical p.Met41 branch, disruption of the UBA1b start codon
      reduces translation of functional cytoplasmic UBA1b and produces a
      catalytically impaired downstream isoform.
  - target: Emerging Non-Met41 UBA1 Enzymatic Dysfunction
    causal_link_type: DIRECT
    description: >
      Pathogenic variants outside p.Met41 can reduce both nuclear and
      cytoplasmic UBA1 activity through a mechanism distinct from the canonical
      UBA1b isoform switch.
- name: Canonical p.Met41 UBA1b Loss and Reduced Ubiquitylation
  description: >
    Mutations at p.Met41 abolish initiation of the canonical cytoplasmic UBA1
    isoform (UBA1b) and force expression of a novel, catalytically impaired
    isoform initiated at a downstream methionine (p.Met67). The net effect is a
    reduction in cytoplasmic ubiquitylation. The level of residual UBA1b translation is
    genotype-dependent and tracks with disease severity and survival.
  biological_processes:
  - preferred_term: Protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:33108101
    reference_title: "Somatic Mutations in UBA1 and Severe Adult-Onset Autoinflammatory Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations affecting p.Met41 resulted in loss of the canonical cytoplasmic isoform of UBA1 and in expression of a novel, catalytically impaired isoform initiated at p.Met67."
    explanation: >
      Documents the isoform switch from cytoplasmic UBA1b to a catalytically
      impaired p.Met67-initiated isoform as the proximal molecular consequence.
  - reference: PMID:35793467
    reference_title: "Translation of cytoplasmic UBA1 contributes to VEXAS syndrome pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using in vitro models and patient-derived cells, we demonstrate that p.Met41Val variant supports less UBA1b translation than either p.Met41Leu or p.Met41Thr, providing a molecular rationale for decreased survival."
    explanation: >
      Shows that residual cytoplasmic UBA1b translation is genotype-dependent
      and provides a molecular rationale for the observed survival association.
  downstream:
  - target: Innate Immune Activation
    causal_link_type: DIRECT
    description: >
      Reduced cytoplasmic ubiquitylation triggers cellular stress responses and
      activates innate immune signaling in mutant myeloid cells.
  - target: Myeloid-Skewed Hematopoietic Dysfunction
    causal_link_type: DIRECT
    description: >
      In a canonical p.Met41 model, mutation-engineered HSPCs reproduce
      cytologic, senescence-like, hematologic, and inflammatory abnormalities.
    evidence:
    - reference: PMID:40195449
      reference_title: Mechanisms of hematopoietic clonal dominance in VEXAS syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Humanized models of VEXAS syndrome, generated by inserting the causative mutation in healthy HSPCs through base editing, recapitulated proteostatic defects, cytological alterations and senescence signatures of patients' cells, as well as hematological and inflammatory disease hallmarks."
      explanation: >
        Mutation-engineered human HSPCs in a humanized model reproduce the
        hematopoietic abnormalities, supporting the canonical branch's causal
        link to hematopoietic dysfunction.
- name: Emerging Non-Met41 UBA1 Enzymatic Dysfunction
  mechanism_confidence: PROVISIONAL
  description: >
    Recurrent, functionally defective non-Met41 UBA1 variants have been reported
    in hematologic cohorts. Unlike canonical p.Met41 variants, they can reduce
    the activity of both nuclear and cytoplasmic UBA1 isoforms and are associated
    with distinct hematologic and biochemical phenotypes. Their relationship to
    the classic inflammatory VEXAS phenotype is variable and remains under
    definition.
  biological_processes:
  - preferred_term: Protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:41068485
    reference_title: Distinct characteristics of VEXAS-causative UBA1 M41 and recurrent functional non-M41 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Canonical pathogenic mutations at UBA1 p.Met41 (M41) lead to the loss of the cytoplasmic isoform (UBA1b), while non-canonical mutations outside of M41 (non-M41) result in reduced activity of both nuclear and cytoplasmic isoforms."
    explanation: >
      Directly distinguishes the non-Met41 loss of nuclear and cytoplasmic UBA1
      activity from the canonical p.Met41 isoform mechanism.
  - reference: PMID:41068485
    reference_title: Distinct characteristics of VEXAS-causative UBA1 M41 and recurrent functional non-M41 mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified decreased polyubiquitylation in all of the 18 UBA1 variants tested and found differences in H2A/B monoubiquitylation alteration between M41 and non-M41 mutations."
    explanation: >
      Functional assays support impaired ubiquitylation across the tested
      non-Met41 variant spectrum.
  - reference: PMID:41068485
    reference_title: Distinct characteristics of VEXAS-causative UBA1 M41 and recurrent functional non-M41 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, non-M41 mutations are more likely to appear with co-mutations and are detected in patients with hematologic neoplasms other than MDS."
    explanation: >
      Supports a hematologic spectrum distinct from the canonical p.Met41 group
      without implying that every functional non-Met41 variant causes classic
      inflammatory VEXAS.
  notes: >
    This provisional branch intentionally has no downstream inflammatory edge:
    the cited study establishes enzymatic dysfunction and a distinct hematologic
    spectrum but does not show that every functional non-Met41 variant converges
    on classic VEXAS inflammation.
- name: Innate Immune Activation
  description: >
    In UBA1-mutant peripheral-blood and myeloid cells, decreased ubiquitylation
    is associated with activation of innate immune pathways and the systemic
    autoinflammatory state.
  cell_types:
  - preferred_term: Monocyte

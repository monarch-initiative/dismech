- name: Stress Keratin K16 Upregulation with Loss of K6
  biological_scale: CELLULAR
  description: >-
    Mutant iRHOM2 binds the stress keratin K16 more strongly in TOC
    keratinocytes. TOC skin has abundant K16 but almost no K6, its usual type
    II partner, and K16 filaments turn over faster. The authors propose that
    this K16 axis governs the epidermal response to mechanical stress, which
    would fit the restriction of the keratoderma to pressure sites; that link
    is their interpretation.

- name: Amphiregulin-Driven EGFR Hyperactivation
  biological_scale: CELLULAR
  description: >-
    Increased release of EGF-family ligands raises EGFR activity in TOC
    keratinocytes. Amphiregulin is the ligand that matters for the skin
    phenotype in mice: deleting it rescues the skin of mice carrying the human
    TOC mutation. Immortalized TOC keratinocytes have lower total EGFR protein
    while being more proliferative and migratory, so the signalling change is
    best described as dysregulated rather than a simple increase in receptor.

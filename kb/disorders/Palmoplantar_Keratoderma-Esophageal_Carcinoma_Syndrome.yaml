- name: Increased ADAM17 Maturation and Ectodomain Shedding in Keratinocytes
  biological_scale: CELLULAR
  description: >-
    In keratinocytes from TOC patients, mutant iRHOM2 increases the maturation
    and activity of the sheddase ADAM17, which raises shedding of its
    substrates, including EGF-family growth factors and pro-inflammatory
    cytokines. Whether ADAM17 catalytic activity is needed for every
    downstream effect is disputed (see discussions).

animal_models:
- name: Rhbdf2 toc knock-in mouse
  species: Mouse
  genotype: Rhbdf2 toc/toc (knock-in of a TOC mutation)
  publication: PMID:37282854
  modeled_mechanisms:
  - target: Amphiregulin-Driven EGFR Hyperactivation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knock-in TOC mutation causes alopecia and wavy fur that depend on
      amphiregulin and ADAM17 dosage.
    limitations: >-
      The mice show a hair-coat phenotype rather than palmoplantar
      keratoderma, and the abstract reports no esophageal cancer.
    evidence:
    - reference: PMID:37282854
      reference_title: Analysis of the function of ADAM17 in iRhom2 curly-bare and tylosis with esophageal cancer mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A cytoplasmic deletion in iR2, including the TOC site, leads to curly coat or bare skin (cub) in mice, whereas a knock-in TOC mutation (toc) causes less severe alopecia and wavy fur."
      explanation: The skin phenotype of the knock-in mouse.
    - reference: PMID:37282854
      reference_title: Analysis of the function of ADAM17 in iRhom2 curly-bare and tylosis with esophageal cancer mutant mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The abnormal skin and hair phenotypes of iR2cub/cub and iR2toc/toc mice depend on amphiregulin (Areg) and Adam17, as loss of one allele of either gene rescues the fur phenotypes."
      explanation: Dependence on amphiregulin and ADAM17.
- name: Human tylosis mutation mouse with Areg deletion
  species: Mouse
  genotype: Rhbdf2 carrying the human tylosis mutation, with and without Areg deletion
  publication: PMID:28655741
  modeled_mechanisms:
  - target: Amphiregulin-Driven EGFR Hyperactivation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The human tylosis mutation increases amphiregulin secretion, and
      deleting amphiregulin ameliorates the skin pathology.
    limitations: >-
      Mouse skin pathology is used as the readout; palmoplantar keratoderma and
      esophageal cancer are not reported in the abstract.
    evidence:
    - reference: PMID:28655741
      reference_title: Genetic deletion of amphiregulin restores the normal skin phenotype in a mouse model of the human skin disease tylosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we show that genetic disruption of AREG ameliorates skin pathology in mice carrying the human tylosis disease mutation."
      explanation: Genetic rescue.
discussions:
- discussion_id: gap_adam17_catalytic_requirement
  prompt: >-
    Does the TOC form of iRHOM2 need ADAM17 catalytic activity to increase
    EGF-family ligand release, or does it act partly independently of ADAM17?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Increased ADAM17 Maturation and Ectodomain Shedding in Keratinocytes
  - pathophysiology#Amphiregulin-Driven EGFR Hyperactivation
  rationale: >-
    Patient keratinocytes show increased ADAM17 maturation and shedding, and
    the toc knock-in mouse phenotype depends on Adam17 dosage. One mouse and
    cell study reports amphiregulin secretion increased independently of
    ADAM17 activity, and another finds that the toc mutation changes ADAM17
    function substrate-selectively without lowering mature ADAM17, while the
    related cub allele needs ADAM17 protein but not its catalytic activity.
  evidence:
  - reference: PMID:24825892
    reference_title: Rhbdf2 mutations increase its protein stability and drive EGFR hyperactivation through enhanced secretion of amphiregulin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In turn, these stable variants function to augment the secretion of EGF family ligands, including amphiregulin, independent of metalloprotease a disintegrin and metalloproteinase 17 (ADAM17) activity."
    explanation: ADAM17-independent ligand secretion.
  - reference: PMID:37282854
    reference_title: Analysis of the function of ADAM17 in iRhom2 curly-bare and tylosis with esophageal cancer mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The iR2toc mutation did not substantially reduce the levels of mature ADAM17, but instead affected its function in a substrate-selective manner."
    explanation: Substrate-selective effect of the toc allele on ADAM17.
  - reference: PMID:37282854
    reference_title: Analysis of the function of ADAM17 in iRhom2 curly-bare and tylosis with esophageal cancer mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "suggesting that the iR2cub gain-of-function mutation requires the presence of ADAM17, but not its catalytic activity"
    explanation: The cub allele needs ADAM17 protein but not its catalytic activity.
- discussion_id: mismatch_mouse_models_no_ppk_or_escc
  prompt: >-
    Mouse Rhbdf2 TOC-mutation models show a hair-coat and general skin
    phenotype rather than focal palmoplantar keratoderma, and none is reported
    to develop esophageal cancer. How far do they model the human disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Focal Palmoplantar Keratoderma
  - phenotypes#Esophageal Squamous Cell Carcinoma
  rationale: >-
    The mechanism from iRhom2 to amphiregulin and EGFR is shared between mouse
    and patient cells, but the defining clinical features are not reproduced
    in the mouse, so the step from that mechanism to focal keratoderma and to
    esophageal cancer rests on human data alone. N-terminal iRhom2 mutations
    accelerate tumorigenesis in mice without causing spontaneous tumors.
  evidence:
  - reference: PMID:30022999
    reference_title: "RHBDF2-Regulated Growth Factor Signaling in a Rare Human Disease, Tylosis With Esophageal Cancer: What Can We Learn From Murine Models?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although current mouse models do not fully recapitulate all aspects of human TOC, and the molecular mechanisms underlying TOC are still emerging, the available mouse models exhibit several key aspects of the disease"
    explanation: Review of the mouse models stating the gap.
  - reference: PMID:24825892
    reference_title: Rhbdf2 mutations increase its protein stability and drive EGFR hyperactivation through enhanced secretion of amphiregulin.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, N-terminal iRhom2 mutations induce accelerated wound healing as well as accelerated tumorigenesis, but they do not drive spontaneous tumor development."
    explanation: No spontaneous tumors in the mouse.
- discussion_id: gap_cancer_penetrance_estimate
  prompt: >-
    What is the esophageal cancer risk for an RHBDF2 variant carrier outside
    the Liverpool family?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Esophageal Squamous Cell Carcinoma
  - inheritance#Autosomal dominant inheritance
  rationale: >-
    The 95% by age 65 figure was calculated in one large family, and the
    review says prognosis is hard to determine because few people are
    affected. No multi-family penetrance estimate was found among the sources
    cited here.
  evidence:
  - reference: PMID:26419362
    reference_title: "Tylosis with oesophageal cancer: Diagnosis, management and molecular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The prognosis of tylosis with oesophageal cancer is difficult to determine due to the limited number of affected individuals."
    explanation: The review names the gap.
notes: >-
  Curated as the germline predisposition syndrome. The tumor it predisposes to
  has its own entry, Esophageal_Squamous_Cell_Carcinoma (MONDO:0005580), which
  is not edited here; the carcinoma is recorded in this entry only as a
  phenotype. No pathophysiology node conforms to the hallmark module
  sustaining_proliferative_signaling, because the iRHOM2-EGFR change here is
  a germline state of non-neoplastic epithelium rather than a tumor driver.
  The Orphanet phenotype list for ORPHA:2198 includes items such as poor suck,
  ascites and hepatomegaly that no source cited here describes in this
  syndrome; only phenotypes with a narrative source are recorded. Follicular
  hyperkeratosis and oral or dental findings appear in review tables that
  were not traced to a primary source and are not recorded.

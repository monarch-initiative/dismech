    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous missense variants at codons 186 to 189 of RHBDF2
      (p.Ile186Thr, p.Asp188Asn, p.Pro189Leu in the papers cited here).

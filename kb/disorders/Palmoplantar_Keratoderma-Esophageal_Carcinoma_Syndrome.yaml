  - reference: PMID:22265016
    reference_title: RHBDF2 mutations are associated with tylosis, a familial esophageal cancer syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "immortalized tylotic keratinocytes have decreased levels of total epidermal growth factor receptor (EGFR) and display an increased proliferative and migratory potential relative to normal cells, even when normal cells are stimulated with exogenous epidermal growth factor. It would thus appear that EGFR signaling is dysregulated in tylotic cells."
    explanation: >-

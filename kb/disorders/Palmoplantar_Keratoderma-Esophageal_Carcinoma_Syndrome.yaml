  evidence:
  - reference: PMID:28128203
    reference_title: Rhomboid family member 2 regulates cytoskeletal stress-associated Keratin 16.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, TOC-associated iRHOM2 mutations appear to increase its binding with K16."
    explanation: >-
      Co-immunoprecipitation and proximity ligation in immortalized TOC
      keratinocytes show increased iRHOM2-K16 binding. iRHOM2 is a
      catalytically inactive rhomboid, so no peptidase activity is bound; its
      regulation of ADAM17 maturation is recorded as a process on the next
      node.

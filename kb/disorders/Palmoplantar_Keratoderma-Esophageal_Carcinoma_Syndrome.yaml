description: >-
  Palmoplantar keratoderma-esophageal carcinoma syndrome, usually called
  tylosis with esophageal cancer (TOC), is an autosomal dominant cancer
  predisposition syndrome caused by heterozygous germline gain-of-function
  missense variants in RHBDF2, which encodes the catalytically inactive
  rhomboid protein iRHOM2. The reported variants cluster in a few adjacent
  codons of the cytoplasmic N-terminus. Focal, non-epidermolytic thickening of
  the skin at the weight-bearing and friction sites of the palms and soles
  appears in childhood, usually by 7 to 8 years and at the latest by puberty,
  with complete penetrance; it can be complicated by fissuring and infection.
  Oral and esophageal leukokeratosis occur, and carriers have a very high
  lifetime risk of esophageal squamous cell carcinoma, estimated at 95% by age
  65 in the large Liverpool family, presenting from the mid-fifties onward and
  no earlier than sporadic disease. In patient keratinocytes the mutant iRHOM2
  increases ADAM17 maturation and the shedding of EGF-family ligands, raising
  EGFR activity and producing a hyperproliferative, wound-healing-like
  epidermis; amphiregulin is the ligand that drives the skin phenotype in mouse
  models. Management centres on annual endoscopic surveillance with biopsy,
  which in the Liverpool family detected most cancers at stage 1.

pathophysiology:
- name: Germline RHBDF2 Gain-of-Function Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline missense variant in the cytoplasmic N-terminus of
    RHBDF2. The first variants found were p.Ile186Thr (UK and US families) and
    p.Pro189Leu (a German family), followed by p.Asp188Asn in a Finnish family,
    which lies between the two; the Finnish authors suggested that
    TOC-associated variants may be specific to this site. The variants act as
    gain of function: N-terminal mutations make iRhom2 more stable, and loss of
    iRhom2 in mice thins the footpad epidermis instead of thickening it.
  gene:
    preferred_term: RHBDF2
    modifier: INCREASED
    term:
      id: hgnc:20788
      label: RHBDF2
  genetic_context:

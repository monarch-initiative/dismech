    reference_title: RHBDF2 mutations are associated with tylosis, a familial esophageal cancer syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have now identified missense mutations (c.557T>C ... and c.566C>T ... in RHBDF2, which encodes the inactive rhomboid protease RHBDF2 (also known as iRhom2), as the underlying cause of TOC"
    explanation: >-
      Gene discovery by targeted capture and sequencing of the linked 17q25
      interval in TOC families.
  - reference: PMID:22638770
    reference_title: Analysis of a Finnish family confirms RHBDF2 mutations as the underlying factor in tylosis with esophageal cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a new missense mutation, p.Asp188Asn, segregating with TOC in the Finnish family, and interestingly the detected mutation alters a codon located between the two previously reported mutation sites."
    explanation: >-
      Independent family confirming RHBDF2, with a third variant in the same
      short stretch of codons.
  - reference: CGGV:assertion_b7e72765-1a53-44fb-bfee-9e5923507bbe-2020-07-30T212232.808Z
    reference_title: RHBDF2 / palmoplantar keratoderma-esophageal carcinoma syndrome (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Five unique missense variants in the RHBDF2 gene were reported to segregate with disease in 6 families, suggesting heterozygous gain of function is the mechanism of tumorigenesis for this gene."
    explanation: >-
      ClinGen's count of the segregating variants and its statement of the
      gain-of-function mechanism.
  - reference: PMID:28655741
    reference_title: Genetic deletion of amphiregulin restores the normal skin phenotype in a mouse model of the human skin disease tylosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In humans, gain-of-function (GOF) mutations in RHBDF2 cause the skin disease tylosis."
    explanation: >-
      States the gain-of-function classification of the human variants, as
      background in a mouse study.
  - reference: PMID:24825892
    reference_title: Rhbdf2 mutations increase its protein stability and drive EGFR hyperactivation through enhanced secretion of amphiregulin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that iRhom2 is a short-lived protein whose stability can be increased by select mutations in the N-terminal domain."
    explanation: >-
      N-terminal mutations stabilize iRhom2, one route by which the variants
      gain function. The mutations studied are N-terminal Rhbdf2 mutations in
      cell and mouse systems, not only the human TOC alleles.
  - reference: PMID:28128203
    reference_title: Rhomboid family member 2 regulates cytoskeletal stress-associated Keratin 16.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "K16 expression is absent in the thinned footpads of irhom2-/- mice compared with irhom2+/+mice, due to reduced keratinocyte proliferation."
    explanation: >-
      Loss of iRhom2 gives the opposite footpad phenotype to TOC, which fits a
      gain-of-function rather than a loss-of-function disease mechanism.

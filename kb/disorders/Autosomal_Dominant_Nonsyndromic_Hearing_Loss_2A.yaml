- name: KCNQ4 Haploinsufficiency from Truncating Variants
  description: >-
    Reduced dosage is a proposed mechanism for some human truncating variants, distinct from the strong
    dominant-negative effects of many pore variants. Truncation position does not by itself establish
    nonsense-mediated decay, failed assembly or simple haploinsufficiency. Some early truncating families
    have later, milder hearing loss, but an early severe stop-variant case is also reported. Heterozygous
    null mice have normal hearing in the founding study, limiting a simple cross-species dosage explanation.
    Functional heterozygous assays can help distinguish effects but do not resolve the mechanism of every
    human allele.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION

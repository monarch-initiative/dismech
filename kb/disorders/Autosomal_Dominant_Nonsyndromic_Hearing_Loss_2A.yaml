- name: KCNQ Channel Openers
  description: >-
    Experimental retigabine and zinc pyrithione potentiate KCNQ4 current. Homomeric pore mutants and forced
    mutant-containing concatemers can remain unresponsive, while WT-plus-pore-mutant coexpression permits
    restoration of total current, probably through residual wild-type homomers. Failure to repair a mutant
    channel therefore does not prove that a pore-variant carrier cannot benefit. Clinical efficacy is
    not established by these cell experiments. R331Q response is a separate forced-heteromer finding in
    a variant classified as VUS by the source.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: retigabine
      term:
        id: CHEBI:68584
        label: ezogabine
    - preferred_term: zinc pyrithione
      term:
        id: CHEBI:32076
        label: zinc pyrithione
  target_mechanisms:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    description: >-
      The openers act on the conductance itself, upstream of depolarization and
      degeneration, which is why they would have to be given before cells are lost.
  evidence:
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The strongest potentiation was observed with a combination of zinc pyrithione plus retigabine."
    explanation: Identifies the drug combination and its effect on the channel.
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "DFNA2 mutations located in the channel's pore region abolished channel function and these mutant channels were completely unresponsive to channel openers."
    explanation: >-
      Nonresponse of mutant channels limits direct repair of those channels. It does not refute total-current
      rescue in WT-plus-mutant coexpression or establish a patient exclusion rule.
  - reference: PMID:34316018
    reference_title: "Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphatidylinositol 4,5-bisphosphate (PIP2), an obligatory phospholipid for maintaining KCNQ channel activity, confers differential pharmacological sensitivity of channels to KCNQ openers."
    explanation: >-
      Supplies the reason the response is allele-dependent rather than leaving it as an
      observation - PIP2 dependence differs by domain, so which opener helps depends on
      where the variant sits. This is what makes the strategy genotype-directed rather
      than simply unreliable.
  - reference: PMID:34316018
    reference_title: "Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variant in the gene encoding the KCNQ4 potassium channel causes autosomal dominant nonsyndromic hearing loss (DFNA2), and no effective pharmacotherapeutics have been developed to reverse channel activity impairment."
    explanation: The standing therapeutic gap this strategy is aimed at, stated by its own investigators.
    quote_role: BACKGROUND
    directness: INDIRECT
  - reference: PMID:21951272
    reference_title: Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this dominant-negative situation, channel openers essentially restored currents back to wt levels,
      most probably through strong activation of only the small fraction of homomeric wt channels.
    explanation: >-
      Coexpression permits total-current rescue despite unresponsive mutant channels; the study attributes
      this probably to wild-type homomers.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Allele-Preferential Antisense Oligonucleotide Knockdown
  description: >-
    ASO-123 is a 2′-MOE-wing/DNA-gap RNase H gapmer with a phosphorothioate backbone and 5-methylcytosine.
    In W277S heterozygous mice, a 15-μg round-window injection at P1–P3 preferentially reduced mutant
    transcript and partially improved hearing, outer hair cell survival and physiology through seven weeks.
    Preference is dose dependent: 30 μg also reduced wild-type transcripts and reduced pup survival. Benefit
    was incomplete and declined with time; neonatal mouse delivery does not establish efficacy, dosing
    or a treatment window in people. Human W276S selectivity was tested separately in transfected cells.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: KCNQ4
      term:
        id: hgnc:6298
        label: KCNQ4
    target_transcript: mutant KCNQ4 mRNA (p.W276S allele)
    oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: KCNQ4 Dominant-Negative Subunit Incorporation
    description: >-
      Removing the mutant transcript prevents the poisoned subunit being made at all,
      which is the most upstream point in this chain that a therapy can act on.
  evidence:
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a Kcnq4 p.W277S knockin mouse model mimicking DFNA2, ASO-123 preferentially suppressed mutant transcripts, attenuated progressive hearing loss, and improved outer hair cell survival while enhancing their electrophysiologic function."
    explanation: The in vivo efficacy result, covering transcript selectivity, hearing, cell survival and function.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a systemic in vitro screen, ASO-123 demonstrated a knockdown of mutant Kcnq4 while preserving wild-type transcripts."
    explanation: Establishes allele preference, which is the property the whole strategy depends on.
  - reference: PMID:40898620
    reference_title: Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unexpectedly, although pups subjected to the 15 μg ASO-123 and 30 μg NT-ASO injections exhibited
      comparable survival rates with non-injected pups, the 30 μg ASO-123 injections significantly reduced
      survival.
    explanation: >-
      Primary dose-limiting animal safety finding.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40898620
    reference_title: Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, although WT transcript levels were significantly reduced by 51.81% in the ASO-123 30-μg
      group compared with untreated mice, there was no significant change in the ASO-123 15-μg group.
    explanation: >-
      Allele preference depends on dose; sparing is not absolute.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:40898620
    reference_title: Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At 7 weeks, we observed a significant deceleration of the expected progressive hearing loss with
      10.06–15.91 dB SPL improvements in the ABR thresholds to all click and tone stimuli.
    explanation: >-
      Partial hearing benefit after neonatal delivery, not normalization.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Adenine Base Editing of the Pathogenic Allele
  description: >-
    Dual AAV-ie split-ABE8e was delivered through the posterior semicircular canal at P2–P3 to mice carrying
    Kcnq4 G322S, equivalent to human G321S. The often-quoted 21.4–28.9% DNA correction was measured in
    bulk organ of Corti from homozygotes at three weeks; heterozygous baseline-adjusted DNA values were
    7.9–16.7%. These are not percentages of corrected outer hair cells. In heterozygotes, the lower dose
    sustained partial hearing benefit to 32 weeks, with maximal 49.09-dB threshold improvement at 32 kHz
    at 20 weeks. Higher dose gave faster early improvement but earlier later deterioration. Cochlear inflammation,
    increased RNA A-to-I editing and systemic editor exposure limit a blanket safety claim. Human G321S
    correction was demonstrated in cells; clinical efficacy remains unestablished.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: KCNQ4 Dominant-Negative Subunit Incorporation
    description: >-
      Correction restores wild-type sequence in a fraction of alleles; residual mutant expression and
      unedited cells remain.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment reduced auditory brainstem response thresholds by up to 49.09 dB SPL at optimal frequencies, mitigated degeneration of hair cells, spiral ganglion neurons, and auditory nerve fibers, and partially restored outer hair cell electrophysiology."
    explanation: The efficacy result across function, histology and electrophysiology.
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A dose-dependent therapeutic window emerged: higher doses promoted rapid recovery, whereas optimized lower doses minimized long-term toxicity and sustained functional benefit for at least 32 weeks."
    explanation: The safety finding, which is the part that constrains translation rather than supporting it.
  - reference: PMID:42162447
    reference_title: Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      At the transcriptomic level, RNA-seq analysis identified an increase in A-to-I RNA editing events
      in the cochlea following AAV_ABE8e_N + C_322 administration
    explanation: >-
      Off-target RNA editing remains relevant despite reassuring tested DNA endpoints.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:42162447
    reference_title: Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, the extent of cytokine/chemokine upregulation and macrophage accumulation was greater in
      the high-dose group than in the low-dose group
    explanation: >-
      Local inflammation and dose effects constrain safety and durability.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

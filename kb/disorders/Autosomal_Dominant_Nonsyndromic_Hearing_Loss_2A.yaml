genetic:
- name: KCNQ4
  association: Causal
  gene_term:
    preferred_term: KCNQ4
    term:
      id: hgnc:6298
      label: KCNQ4
  notes: >-
    KCNQ4 encodes Kv7.4. Most pathogenic variants act by negative dominance through
    tetramer poisoning; gain-of-function and haploinsufficient mechanisms are also
    reported but are the minority. The c.827G>C (p.W276S) pore variant is a
    recurrent hotspot and is the target of the antisense oligonucleotide work; the
    c.961G>A (p.G321S) variant is the one used in the base-editing model. Pathogenic
    KCNQ4 variants account for roughly 9.5 per cent of autosomal dominant
    nonsyndromic hearing loss.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in KCNQ4 account for ~9.5% of autosomal dominant nonsyndromic cases."
    explanation: Quantifies the contribution of this gene to dominant nonsyndromic hearing loss.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant-negative KCNQ4 p.W276S (c.827G>C) mutation represents a mutational hotspot in DFNA2, yet no effective treatments exist."
    explanation: Identifies the recurrent variant and states the therapeutic gap this disease currently sits in.

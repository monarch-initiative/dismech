    quote_role: PRIMARY_RESULT
    directness: DIRECT
phenotypes:
- category: Auditory
  name: Progressive high-frequency sensorineural hearing loss
  description: >-
    The defining phenotype. Symmetric and predominantly high-frequency at onset, progressing across all
    frequencies. Mild in low frequencies and moderate in high frequencies at younger ages; moderate and
    severe-to-profound respectively in older people. Recognition is often at school age, although high-frequency
    impairment may precede recognition and congenital onset was documented in a W276S family. This timing
    is not universal across alleles.
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA2 nonsyndromic hearing loss is characterized by symmetric, predominantly high-frequency sensorineural hearing loss (SNHL) that is progressive across all frequencies."
    explanation: The GeneReviews clinical characterisation.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:11915881
    reference_title: "Longitudinal and cross-sectional phenotype analysis in a new, large Dutch DFNA2/KCNQ4 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: >-
      Persons with this KCNQ4 mutation showed congenital, progressive high-frequency impairment without
      substantial loss of speech recognition during the first decades of life.
    explanation: >-
      A family-specific congenital presentation; not all W276S families have the same reported onset.
- category: Auditory
  name: Severe-to-profound hearing impairment in later life
  description: >-
    Severe-to-profound impairment in later life is described in the GeneReviews cohorts. Age and severity
    vary between families, and the source statement should not be treated as a deterministic prognosis
    for every newly identified allele.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    severity: SEVERE
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By age 70 years, all persons with DFNA2 nonsyndromic hearing loss have severe-to-profound hearing impairment."
    explanation: >-
      Historical GeneReviews summary of late severity; interpreted with the chapter's variable age and
      severity and genotype-specific exceptions.
    quote_role: REVIEW_SYNTHESIS
- category: Vestibular
  name: Vestibular hyperreactivity
  description: >-
    Increased vestibulo-ocular reflex responses were reported in two Dutch DFNA2 families. One W276S family
    had hyperreactivity in 3 of 11 tested individuals, with motion-sickness susceptibility in two. This
    is a human finding, usually subtle, with family-specific ascertainment; it does not establish a general
    vestibular syndrome or a disease-wide frequency. Mouse calyx localization and altered reflexes are
    recorded separately as model evidence.
  phenotype_term:
    preferred_term: Abnormal vestibular function
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:11915881
    reference_title: "Longitudinal and cross-sectional phenotype analysis in a new, large Dutch DFNA2/KCNQ4 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A hyperactive vestibuloocular reflex was found in 3 of 11 cases: 2 persons were especially susceptible
      to motion sickness.
    explanation: >-
      Direct human vestibular findings in the W276S family; denominator is the tested subset.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:9193215
    reference_title: Inherited nonsyndromic hearing loss. An audiovestibular study in a large family with autosomal dominant progressive hearing loss related to DFNA2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant finding was that 25% to 35% (depending on the exclusion criteria) of the patients
      showed an increased vestibulo-ocular reflex (hyperreactivity) as measured by rotatory responses.
    explanation: >-
      The earlier DFNA2-linked family supplies a second human observation; this predates identification
      of KCNQ4.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
diagnosis:
- name: Audiometry with a characteristic audioprofile
  description: >-
    Diagnosis rests on the shape of the audiogram together with a dominant family
    history, confirmed by finding a heterozygous KCNQ4 pathogenic variant. Annual
    audiometry is the recommended surveillance, since the clinically relevant
    variable is rate of progression rather than a single threshold.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DFNA2 nonsyndromic hearing loss is established in an individual with a characteristic audioprofile, a family history consistent with autosomal dominant inheritance, and identification of a heterozygous pathogenic variant in KCNQ4."
    explanation: The GeneReviews diagnostic criteria, naming all three components.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least annual audiogram to follow progression of hearing loss."
    explanation: The recommended surveillance interval.
    quote_role: REVIEW_SYNTHESIS
- name: Multigene or genomic testing
  description: >-
    A characteristic audioprofile raises suspicion, but other inherited hearing disorders overlap. Use
    a hearing-loss panel including KCNQ4 or comprehensive genomic testing, with appropriate sequence and
    copy-number assessment. Interpret variants with clinical, segregation and functional evidence; a VUS
    alone is not confirmatory.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1209/?report=reader
    reference_title: DFNA2 Nonsyndromic Hearing Loss - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is most likely to identify the genetic cause of the condition while limiting identification of variants
      of uncertain significance and pathogenic variants in genes that do not explain the underlying phenotype.
    explanation: >-
      Full chapter recommends a broader testing strategy rather than reliance on audiogram or single-gene
      testing alone.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Evaluation of at-risk relatives
  description: >-
    Testing for the established familial pathogenic variant in infancy or early childhood can identify
    relatives who need hearing assessment and support before substantial recognized impairment.
  evidence:
  - reference: PMID:20301388
    reference_title: DFNA2 Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Determining in infancy or early childhood whether a family member of the proband has inherited a
      pathogenic variant in KCNQ4 allows for early support and management of the child and family.
    explanation: >-
      Early family testing recommendation.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
genetic:
- name: KCNQ4
  association: Causal
  gene_term:
    preferred_term: KCNQ4
    term:
      id: hgnc:6298
      label: KCNQ4
  notes: >-
    KCNQ4 encodes Kv7.4. Dominant-negative pore defects, altered voltage sensing, and proposed dosage
    effects are overlapping mechanistic categories, not an exhaustive partition. W276S is a recurrent
    pathogenic hotspot. Functional gain of current has also been observed, notably for forced WT-G319D
    channels, but the 2021 study classified G319D and R331Q as VUS; cell effects do not establish pathogenicity.
    The 9.5% estimate comes from six KCNQ4 diagnoses among 63 autosomal dominant diagnoses in a 1,119-person
    referred testing cohort, not a worldwide prevalence. Human G321S corresponds to mouse G322S in the
    2026 base-editing study.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in KCNQ4 account for ~9.5% of autosomal dominant nonsyndromic cases."
    explanation: >-
      Secondary background estimate from the 2012–2014 diagnostic cohort; not a population prevalence
      or universal fraction of dominant hearing loss.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant-negative KCNQ4 p.W276S (c.827G>C) mutation represents a mutational hotspot in DFNA2, yet no effective treatments exist."
    explanation: >-
      Identifies the recurrent variant and states the therapeutic gap this disease
      currently sits in. BACKGROUND for the same reason as the item above - a mouse
      antisense study, and this sentence is its framing rather than its result. The
      human primary source for the hotspot claim is the next item, which carries the
      same claim as a PRIMARY_RESULT.
  - reference: PMID:15699719
    reference_title: "Phenotype determination guides swift genotyping of a DFNA2/KCNQ4 family with a hot spot mutation (W276S)."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All clinically affected participants were carriers of the W276S hotspot mutation in exon 5 of the KCNQ4 gene on chromosome 1p34."
    explanation: >-
      All clinically affected participants carried W276S in a study of fifteen family members; this does
      not mean all fifteen were affected.
  - reference: PMID:41639121
    reference_title: Two-step voltage-sensor activation of the human K(V)7.4 channel and effect of a deafness-associated mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our analysis revealed that R216H impaired the voltage dependence of channel opening and both VSD
      activation components
    explanation: >-
      Voltage-clamp fluorometry in heterologously expressed channels shows altered activation. This does
      not itself demonstrate a dominant-negative mechanism.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we recorded the whole-cell currents using the patch-clamp technique and categorized 1068 missense SNVs as loss of function, as well as 728 loss-of-function SNVs located in the transmembrane domains"
    explanation: >-
      Large-scale channel-function map provides evidence for interpretation together with other criteria;
      a loss-of-function assay is not a standalone pathogenic classification.
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we coexpressed loss-of-function variants with wild-type KCNQ4 and found 516 variants showed impaired or only partially rescued heterogeneous channel function"
    explanation: >-
      Coexpression tests the effect in the presence of wild-type subunits. Results inform, but do not
      alone determine, human pathogenicity and do not test endogenous splicing.
  - reference: PMID:41639121
    reference_title: Two-step voltage-sensor activation of the human K(V)7.4 channel and effect of a deafness-associated mutation.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The lack of interaction of H216 with E146 meant that the mutation-bearing S4 was less stably anchored,
      indicating that the activated VSD state in the R216H variant is less stable than in WT.
    explanation: >-
      Molecular dynamics supplies a structural interpretation distinct from the experimental gating measurements.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:35760561
    reference_title: Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After incorporating our patch-clamp data, 40/456 VUSs were reclassified as benign, 47 were likely

inheritance:
- name: Autosomal dominant
  description: >-
    A single heterozygous KCNQ4 pathogenic variant is sufficient. Most affected
    individuals have an affected parent, and each child of an affected individual
    has a one in two chance of inheriting the variant. What proportion of cases
    arise de novo is not known - GeneReviews states this as an open figure rather
    than estimating it, which is why `de_novo_rate` below records the uncertainty
    instead of a number.
  inheritance_term:

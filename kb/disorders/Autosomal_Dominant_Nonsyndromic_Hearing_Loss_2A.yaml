    causal_link_type: DIRECT
    description: >-
      Dominant-negative channel dysfunction reduces the outer hair cell conductance. Null-model evidence
      establishes channel dependence; the exact residual current depends on genotype.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "KCNQ4 disruption abolished the I(K,n) current of OHCs."
      explanation: Directly connects loss of the channel to loss of the specific outer hair cell conductance it carries.
      directness: INDIRECT
  - target: Inner Hair Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Kcnq4 deficiency can be accompanied by later injury to this population. Null-model evidence is indirect

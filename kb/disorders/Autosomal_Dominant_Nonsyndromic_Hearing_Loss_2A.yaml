pathophysiology:
- name: KCNQ4 Dominant-Negative Subunit Incorporation
  description: >-
    Kv7.4 is a homotetramer, so a mutant subunit that still assembles but cannot
    conduct removes the function of every channel it joins. This is why most
    DFNA2A variants are dominant rather than recessive, and why the defect is far
    greater than the 50 per cent expected from losing one allele: co-expressing
    wild-type KCNQ4 with a pore mutant suppresses current to barely detectable
    levels. Pore-region variants and proximal C-terminal variants behave
    differently under pharmacological rescue, which is the first hint that this
    node is not a single lesion.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: voltage-gated potassium channel activity
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
    modifier: DECREASED
  downstream:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    causal_link_type: DIRECT
    description: >-
      A poisoned tetramer conducts no potassium, so the standing conductance that
      Kv7.4 carries in outer hair cells is lost.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "KCNQ4 disruption abolished the I(K,n) current of OHCs."
      explanation: Directly connects loss of the channel to loss of the specific outer hair cell conductance it carries.
  evidence:
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "Co-expression of wt and KCNQ4 pore mutants suppressed currents to barely detectable levels."
    explanation: >-
      The defining experiment for negative dominance - the mutant subunit suppresses the
      wild-type product rather than merely failing itself. This one is from the paper's
      KEY RESULTS, against the BACKGROUND sentence it is also cited for elsewhere.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This dominant-negative mechanism arises because fully functional KCNQ4 channels are formed by the assembly of tetrameric subunits."
    explanation: States the structural reason a single mutant allele can disable the channel population.
  - reference: PMID:10025409
    reference_title: "KCNQ4, a novel potassium channel expressed in sensory outer hair cells, is mutated in dominant deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It abolishes the potassium currents of wild-type KCNQ4 on which it exerts a strong dominant-negative effect."
    explanation: >-
      The original demonstration of negative dominance, from the paper that identified
      KCNQ4 as the DFNA2 gene. The effect is on the wild-type product, which is what
      distinguishes it from haploinsufficiency.
  - reference: PMID:10025409
    reference_title: "KCNQ4, a novel potassium channel expressed in sensory outer hair cells, is mutated in dominant deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation in this gene in a DFNA2 pedigree changes a residue in the KCNQ4 pore region."
    explanation: Establishes the pore region as the location of the founding pathogenic variant.
- name: KCNQ4 Haploinsufficiency from Truncating Variants
  description: >-
    The minority route, and the one the rest of this pathograph does not model.
    A small number of DFNA2 families carry variants that truncate the peptide -
    a frameshift before the first transmembrane domain, and stop codons removing
    the S5, S6 and C-terminal regions. A subunit that never reaches the tetramer
    poisons nothing, so on this route the surviving channel population is built
    from the intact allele alone and the proposed mechanism is haploinsufficiency
    rather than negative dominance. The reported clinical difference runs the same
    way: haploinsufficient alleles give later-onset high-frequency loss than the
    dominant-negative pore variants do.

    Recorded as an open mechanism, not a settled one, and the counter-evidence is
    here rather than in a footnote. Heterozygous Kcnq4 knockout mice - the direct
    animal test of halved dose - do not lose hearing, which argues that one intact
    allele is tolerated and that something other than simple dosage accounts for
    the human truncating families. The systematic survey of every possible KCNQ4
    missense substitution leaves the same question open for its large
    partially-rescued class, naming dominant negativity and haploinsufficiency
    side by side without separating them.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: voltage-gated potassium channel activity
    term:
      id: GO:0005249
      label: voltage-gated potassium channel activity
    modifier: DECREASED
  downstream:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Halving the supply of functional subunits is proposed to reduce the standing
      conductance below what the outer hair cell needs, reaching the same node as
      the dominant-negative route but later. Marked indirect because no measurement
      of I(K,n) in a haploinsufficient genotype exists: the human inference rests on
      variant class and age of onset, and the one animal genotype that tests it
      directly does not reproduce hearing loss at all.
    evidence:
    - reference: PMID:42162447
      reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "whereas KCNQ4 haploinsufficiency results in late-onset high-frequency loss"
      explanation: >-
        States the distinct clinical outcome attributed to the haploinsufficient route,
        which is the reason for modelling it as a separate entry point rather than
        folding it into the dominant-negative node.
  evidence:
  - reference: PMID:23776385
    reference_title: "Genetics of hearing loss: focus on DFNA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, only three mutations resulting in truncated peptides have been elucidated."
    explanation: >-
      Establishes that the truncating class exists in patients and is small, which is
      why the pathograph's main chain models the dominant-negative majority.
  - reference: PMID:23776385
    reference_title: "Genetics of hearing loss: focus on DFNA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In deletion mutations, haploinsufficiency has been proposed as the pathogenic mechanism of action."
    explanation: The mechanism attributed to this variant class, stated as a proposal.
  - reference: PMID:23776385
    reference_title: "Genetics of hearing loss: focus on DFNA2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency may result from a null mutation, but it is possible that there is still KCNQ4 function from the intact allele."
    explanation: >-
      The hedge in the same review, and the reason the downstream edge is marked
      indirect rather than direct.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "suggests that Kcnq4 is unlikely haploinsufficient and a partial reduction of WT transcripts might be well-tolerated"
    explanation: >-
      The strongest argument against this node. The premise is the absence of hearing
      loss in heterozygous Kcnq4 knockout mice, which is the direct animal test of
      halved dose. Kept here rather than omitted because it bears on the claim and
      cuts against it.
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "which could be caused by a variety of factors, such as dominant-negative effects and haploinsufficiency"
    explanation: >-
      The systematic functional survey declines to separate the two mechanisms for the
      variants it could only partially rescue, which is the state of the question. Marked
      indirect because it supports the existence of the haploinsufficient route by not
      excluding it, rather than by demonstrating it.
- name: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
  description: >-
    I(K,n) is the large standing potassium conductance active at the outer hair
    cell resting potential. It is the exit route for potassium that enters through
    the apical mechanotransduction channels, and it is what holds the cell
    hyperpolarised at rest. Kv7.4 carries the predominant part of it, so losing
    the channel removes the conductance rather than reducing it.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  downstream:
  - target: Chronic Outer Hair Cell Depolarization
    causal_link_type: DIRECT
    description: >-
      Without the standing outward potassium current, the cell cannot maintain its
      resting potential and sits depolarised.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The ensuing depolarization of OHCs impaired sound amplification."
      explanation: Names depolarization as the direct consequence of losing the conductance, in the same sentence chain as the current measurement.
  evidence:
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "KCNQ4 mediates the predominant K(+) conductance, I(K,n) , of auditory outer hair cells (OHCs), and loss of KCNQ4 function leads to degeneration of OHCs resulting in progressive hearing loss."
    explanation: >-
      Establishes Kv7.4 as the carrier of the predominant outer hair cell conductance
      and links its loss to the downstream degeneration. BACKGROUND: the sentence sits
      in this paper's BACKGROUND AND PURPOSE section, restating what was already known
      before its own patch-clamp experiments.
  - reference: PMID:10025409
    reference_title: "KCNQ4, a novel potassium channel expressed in sensory outer hair cells, is mutated in dominant deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas mutations in KCNQ1 cause deafness by affecting endolymph secretion, the mechanism leading to KCNQ4-related hearing loss is intrinsic to outer hair cells."
    explanation: >-
      Locates the lesion inside the hair cell rather than in the fluid environment around
      it. Worth recording explicitly because the sibling channelopathy in the same gene
      family reaches deafness by the opposite route, and the distinction is what makes an
      outer-hair-cell-directed therapy the rational target here.
- name: Chronic Outer Hair Cell Depolarization
  description: >-
    The immediate physiological consequence. A depolarised outer hair cell cannot
    perform its normal job - electromotile amplification of the travelling wave -
    so cochlear sensitivity falls before any cell has died. This is the reversible
    phase of the disease and the one a channel opener or an allele-preferential
    knockdown could in principle address.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Progressive Outer Hair Cell Degeneration
    causal_link_type: DIRECT
    description: >-
      Sustained depolarization is the load the cell dies under; the authors of the
      mouse study state this causal reading explicitly.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that the hearing loss in DFNA2 is predominantly caused by a slow degeneration of OHCs resulting from chronic depolarization."
      explanation: The authors' own causal statement linking depolarization to degeneration.
  evidence:
  - reference: PMID:16437162
    reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The ensuing depolarization of OHCs impaired sound amplification."
    explanation: Records the functional cost of depolarization independently of any cell loss.
- name: Progressive Outer Hair Cell Degeneration
  description: >-
    Outer hair cells die slowly and selectively. In the knockout mouse the loss is
    already present by three weeks of age and spreads from base to apex, which
    matches both the base-to-apex gradient of channel expression and the
    high-frequency-first audiogram in patients. Inner hair cells and their afferent
    synapses are largely spared at this stage.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Losing the cochlear amplifier at the basal, high-frequency end produces
      exactly the audiogram DFNA2A patients present with.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This progressive hearing loss was paralleled by a selective degeneration of outer hair cells (OHCs)."
      explanation: Couples the time course of hearing loss to the time course of outer hair cell death in the same animals.
  - target: Inner Hair Cell and Spiral Ganglion Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In one mouse background inner hair cell and neuronal death follows outer hair
      cell loss by about thirty weeks. Whether the earlier loss causes the later one
      or the two are independent consequences of the same channel defect is not
      resolved, so the link is recorded as indirect with unknown intermediates.
    evidence:
    - reference: PMID:31102762
      reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While for outer hair cells it was already present by week 3, inner hair cell and neuronal loss started 30 weeks later."
      explanation: Establishes the temporal ordering of the two degenerations without establishing that one causes the other.
  evidence:
  - reference: PMID:16437162
    reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inner hair cells and their afferent synapses remained mostly intact."
    explanation: Establishes the selectivity of the early degeneration for outer hair cells.
  - reference: PMID:31102762
    reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cell loss progressed from basal to apical turns with age."
    explanation: The spatial progression that maps onto the high-frequency-first clinical audiogram.
- name: Inner Hair Cell and Spiral Ganglion Neuron Degeneration
  description: >-
    A later and more contested stage. In a Kcnq4 knockout backcrossed onto the
    C3H/HeJ background, inner hair cells and spiral ganglion neurons die as well as
    outer hair cells, roughly thirty weeks later. This matters clinically because
    losing outer hair cells alone reduces sensitivity but does not abolish hearing,
    whereas losing inner hair cells and their neurons does - so this node, not the
    one above, is the candidate explanation for the profound late-stage deafness.
    Note that the finding is background-dependent in mice, which is the main reason
    it is recorded as a distinct node under an open hypothesis rather than as
    settled mechanism.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  downstream:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Death of the sensory cells that actually signal to the auditory nerve, and of
      the neurons themselves, converts reduced sensitivity into severe loss.
    evidence:
    - reference: PMID:31102762
      reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inner hair cell and spiral ganglion neuron death generates severe hearing loss that could be associated with the last phase of DFNA2."
      explanation: The authors' proposed mapping of this cellular stage onto the late clinical phase, stated as a possibility rather than a demonstration.
  evidence:
  - reference: PMID:31102762
    reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition to the already reported outer hair cell death, the C3H/HeJ strain also exhibited inner hair cell and spiral ganglion neuron death."
    explanation: The primary observation, and the qualifier that it was seen on a particular genetic background.
  - reference: PMID:40752593
    reference_title: "Insights into early cochlear damage induced by potassium channel deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spiral ganglion neurons (SGNs) also degenerate over time."
    explanation: >-
      An independent report of the neuronal arm of this node, which matters because the
      earlier observation was attributed to one inbred background. Recorded separately
      rather than merged: it does not settle the hypothesis group below, but it removes
      the reading that neuronal loss is a C3H/HeJ artefact alone.
  - reference: PMID:40752593
    reference_title: "Insights into early cochlear damage induced by potassium channel deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we demonstrate KCNQ4 deletion disrupts the localization of key proteins like prestin and BK channels, alters OHC organization, and induces apoptosis in sensory and SC"
    explanation: >-
      Names apoptosis in sensory and supporting cells as the cell-death route, and adds a
      structural consequence upstream of it - mislocalized prestin, which is the motor
      protein electromotility depends on. INDIRECT for this node because the measurements
      are of the outer hair cell compartment and the inference to inner hair cells and
      neurons is the authors'.
- name: Progressive High-Frequency Sensorineural Hearing Loss
  description: >-
    The organism-level outcome. Symmetric, high-frequency-predominant sensorineural
    hearing loss that progresses across all frequencies with age. Hearing is
    probably impaired from birth at high frequencies even though it is usually
    detected at school age, and by the eighth decade impairment is severe to
    profound in everyone affected.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA2 nonsyndromic hearing loss is characterized by symmetric, predominantly high-frequency sensorineural hearing loss (SNHL) that is progressive across all frequencies."
    explanation: The GeneReviews definition of the clinical outcome this chain produces.
mechanistic_hypotheses:
- hypothesis_group_id: late_phase_cellular_target
  hypothesis_label: Which cochlear cell type accounts for the late, profound phase of DFNA2A
  status: EMERGING
  description: >-
    The early phase is settled: outer hair cells lose I(K,n), depolarise and die,
    and this produces the high-frequency-first audiogram. The late phase is not.

    The outer-hair-cell-only reading comes from the original Kcnq4 mouse, where
    hearing loss tracked selective outer hair cell degeneration while inner hair
    cells and their synapses stayed mostly intact. Against it stands a simple
    physiological objection raised from the expression data: complete loss of outer
    hair cells reduces sensitivity severely but does not abolish hearing, so it does
    not obviously explain profound deafness. Two expression studies found KCNQ4 in
    inner hair cells and spiral ganglion neurons as well, with a reciprocal
    base-to-apex gradient, and argued the primary lesion may lie there instead. A
    later mouse study backcrossed onto C3H/HeJ then found inner hair cell and
    neuronal death as a distinct, much later event.

    The readings are not straightforwardly reconcilable, and genetic background is
    the obvious confounder: the same allele produced different cellular outcomes in
    different strains, which is a fact about mice and not necessarily about humans.
    What turns on it is which cells a disease-modifying therapy has to reach and by
    when, since a treatment that preserves outer hair cells will not help if the
    late phase is neuronal.
  evidence:
  - reference: PMID:16437162
    reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that the hearing loss in DFNA2 is predominantly caused by a slow degeneration of OHCs resulting from chronic depolarization."
    explanation: The outer-hair-cell-centred position, stated by the authors of the founding mouse model.
  - reference: PMID:11042367
    reference_title: "Longitudinal gradients of KCNQ4 expression in spiral ganglion and cochlear hair cells correlate with progressive hearing loss in DFNA2."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our data suggest that the primary defect leading to initial high frequency loss and subsequent progressive hearing loss for all frequencies may be due to spiral ganglion and/or IHC dysfunction, rather than an OHC aberration."
    explanation: >-
      The competing position, stated explicitly against the outer hair cell reading.
      Recorded as REFUTE because it contradicts the hypothesis label's outer-hair-cell
      answer, not because the paper is wrong.
  - reference: PMID:16207888
    reference_title: "Differential expression of KCNQ4 in inner hair cells and sensory neurons is the basis of progressive high-frequency hearing loss."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our expression data suggest that the primary defect leading to high-frequency loss in DFNA2 patients may be attributable to high levels of the dysfunctional Kcnq4_v3 variant in the spiral ganglion and inner hair cells in the basal hook region."
    explanation: A second, independent expression-based argument locating the primary lesion outside outer hair cells.
  - reference: PMID:31102762
    reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic backgrounds are known to influence disease expressivity."
    explanation: >-
      The reason the two positions may both be reporting real observations - the
      cellular outcome differed between mouse strains carrying the same allele.
phenotypes:
- category: Auditory
  name: Progressive high-frequency sensorineural hearing loss
  description: >-
    The defining phenotype. Symmetric and predominantly high-frequency at onset,
    progressing across all frequencies. Mild in low frequencies and moderate in high
    frequencies at younger ages; moderate and severe-to-profound respectively in
    older people.
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA2 nonsyndromic hearing loss is characterized by symmetric, predominantly high-frequency sensorineural hearing loss (SNHL) that is progressive across all frequencies."
    explanation: The GeneReviews clinical characterisation.
- category: Auditory
  name: Severe-to-profound hearing impairment in later life
  description: >-
    The endpoint of progression. By the eighth decade every affected individual has
    severe-to-profound impairment, which is what makes the late-phase mechanism
    question clinically consequential rather than academic.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By age 70 years, all persons with DFNA2 nonsyndromic hearing loss have severe-to-profound hearing impairment."
    explanation: States the universal late outcome and the age by which it is reached.
- category: Vestibular
  name: Subclinical vestibular dysfunction
  description: >-
    DFNA2A is nonsyndromic, and vertigo or imbalance is not part of how affected
    people present: the clinical characterization names sensorineural hearing loss
    and nothing else. The original mechanistic premise offered for that negative -
    that Kv7.4 sits in vestibular hair cells, so normal vestibular function was a
    surprise needing explanation - no longer holds. In adult mice the channel is
    postsynaptic, in the calyx terminals ensheathing type I vestibular hair cells,
    and cannot be detected in the hair cells themselves; hair cell currents are
    unchanged when it is removed. Sensitive testing of those mice does find a
    deficit, in the vestibulo-ocular reflex, that no overt behavioural test
    detects.

    So the claim recorded here is subclinical involvement, not absence. The two
    directions in the evidence below are both real and are about different levels
    of observation: no clinical or behavioural vestibular syndrome, but a
    measurable reflex change in the mouse.
  phenotype_term:
    preferred_term: Vestibular dysfunction
    term:
      id: HP:0001751
      label: Abnormal vestibular function
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "DFNA2 nonsyndromic hearing loss is characterized by symmetric, predominantly high-frequency sensorineural hearing loss (SNHL) that is progressive across all frequencies."
    explanation: >-
      The human clinical characterization, which names hearing loss alone. Recorded
      as REFUTE because no vestibular manifestation appears in it, which is the
      strongest statement available that the human disease carries no clinical
      vestibular syndrome.
  - reference: PMID:16437162
    reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Although KCNQ4 is strongly expressed in vestibular hair cells, vestibular function appeared normal."
    explanation: >-
      The founding mouse model reported no vestibular deficit. Note that the premise
      in its first clause - channel expression in vestibular hair cells - is what the
      later localization study below overturns; the observation of normal function is
      not affected by that.
  - reference: PMID:23408425
    reference_title: "Vestibular role of KCNQ4 and KCNQ5 K+ channels revealed by mouse models."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "However, a milder form of vestibular dysfunction was apparent from altered vestibulo-ocular reflexes in Kcnq4(-/-)/Kcnq5(dn/dn) and Kcnq4(-/-) mice."
    explanation: >-
      A measured vestibular deficit in mice lacking KCNQ4, below the threshold that
      produces circling behaviour. INDIRECT because the claim is about the human
      disease and the observation is a mouse reflex measurement.
  - reference: PMID:23408425
    reference_title: "Vestibular role of KCNQ4 and KCNQ5 K+ channels revealed by mouse models."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "we now show unambiguously that in adult mice both channels reside in postsynaptic calyx-forming neurons, but cannot be detected in the innervated hair cells"
    explanation: >-
      Why the vestibular deficit is mild where the cochlear one is not. The channel is
      not in the vestibular hair cells at all, so mechanotransduction there is intact
      and only the postsynaptic calyx is affected. This replaces the expression premise
      the 2006 negative was argued from.
diagnosis:
- name: Audiometry with a characteristic audioprofile
  description: >-
    Diagnosis rests on the shape of the audiogram together with a dominant family
    history, confirmed by finding a heterozygous KCNQ4 pathogenic variant. Annual
    audiometry is the recommended surveillance, since the clinically relevant
    variable is rate of progression rather than a single threshold.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of DFNA2 nonsyndromic hearing loss is established in an individual with a characteristic audioprofile, a family history consistent with autosomal dominant inheritance, and identification of a heterozygous pathogenic variant in KCNQ4."
    explanation: The GeneReviews diagnostic criteria, naming all three components.
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At least annual audiogram to follow progression of hearing loss."
    explanation: The recommended surveillance interval.
genetic:
- name: KCNQ4
  association: Causal
  gene_term:
    preferred_term: KCNQ4
    term:
      id: hgnc:6298
      label: KCNQ4
  notes: >-
    KCNQ4 encodes Kv7.4. Three functional classes are described and they are not
    equally represented. Most pathogenic variants are pore-region missense changes
    acting by negative dominance through tetramer poisoning, and that class is what
    the main pathophysiology chain models. A voltage-sensor class exists whose
    variants impair gating rather than assembly. A third, small class truncates the
    peptide and is attributed to haploinsufficiency; it is modelled as a separate
    entry node, with the mouse evidence that argues against it recorded there. The
    c.827G>C (p.W276S) pore variant is a recurrent hotspot and is the target of the
    antisense oligonucleotide work; the c.961G>A (p.G321S) variant is the one used in
    the base-editing model. Pathogenic KCNQ4 variants account for roughly 9.5 per cent
    of autosomal dominant nonsyndromic hearing loss.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in KCNQ4 account for ~9.5% of autosomal dominant nonsyndromic cases."
    explanation: >-
      Quantifies the contribution of this gene to dominant nonsyndromic hearing loss.
      HUMAN_CLINICAL because that is the evidence the quoted sentence describes;
      BACKGROUND because the publication reports mouse base-editing work and is
      restating this figure from other literature rather than measuring it. It was
      graded OTHER before `quote_role` existed, which recorded neither fact.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant-negative KCNQ4 p.W276S (c.827G>C) mutation represents a mutational hotspot in DFNA2, yet no effective treatments exist."
    explanation: >-
      Identifies the recurrent variant and states the therapeutic gap this disease
      currently sits in. BACKGROUND for the same reason as the item above - a mouse
      antisense study, and this sentence is its framing rather than its result. The
      human primary source for the hotspot claim is the next item, which carries the
      same claim as a PRIMARY_RESULT.
  - reference: PMID:15699719
    reference_title: "Phenotype determination guides swift genotyping of a DFNA2/KCNQ4 family with a hot spot mutation (W276S)."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All clinically affected participants were carriers of the W276S hotspot mutation in exon 5 of the KCNQ4 gene on chromosome 1p34."
    explanation: >-
      A primary human family series for the W276S hotspot - complete co-segregation with
      the hearing phenotype across fifteen family members, and the location of the residue.
      The finding the two BACKGROUND items above are restating.
  - reference: PMID:41639121
    reference_title: "Two-step voltage-sensor activation of the human K(V)7.4 channel and effect of a deafness-associated mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The DFNA2-causing R216H mutation impairs VSD movement and channel opening by destabilizing the active VSD configuration, a result confirmed by molecular dynamics simulations."
    explanation: >-
      The voltage-sensor variant class, mechanistically distinct from pore-region tetramer
      poisoning: the subunit assembles and the pore is intact, but the gate does not move.
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we recorded the whole-cell currents using the patch-clamp technique and categorized 1068 missense SNVs as loss of function, as well as 728 loss-of-function SNVs located in the transmembrane domains"
    explanation: >-
      The scale of the variant-interpretation problem this gene presents, and the
      experimental basis for calling a newly seen missense variant pathogenic.
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we coexpressed loss-of-function variants with wild-type KCNQ4 and found 516 variants showed impaired or only partially rescued heterogeneous channel function"
    explanation: >-
      The heterozygous-mimicking arm, which is the one that speaks to this disease: a
      loss-of-function variant only matters clinically if it is not rescued by the
      wild-type allele beside it.
animal_models:
- name: Kcnq4 knockout and dominant-negative knockin mouse
  species: Mouse
  genotype: Kcnq4-/- and Kcnq4 dominant-negative DFNA2 allele knockin
  publication: PMID:16437162
  description: >-
    The founding model. Two alleles were made - a disruption and a dominant-negative
    point mutant - and the dominant-negative animals lost hearing over months where
    the nulls lost it over weeks, mirroring the dominant human disease at a
    compressed timescale.
  modeled_mechanisms:
  - target: Chronic Outer Hair Cell Depolarization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The model establishes the conductance loss and the resulting depolarization by
      direct measurement in the cells concerned.
    limitations: >-
      Mouse cochlear ageing is compressed relative to the human decades-long course,
      so the model reports the mechanism faithfully but not its clinical tempo.
    readouts:
    - name: Outer hair cell I(K,n) current
      target: Chronic Outer Hair Cell Depolarization
      direction: ABOLISHED
      interpretation: The specific conductance carried by Kv7.4 is absent in mutant outer hair cells.
      evidence:
      - reference: PMID:16437162
        reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "KCNQ4 disruption abolished the I(K,n) current of OHCs."
        explanation: The electrophysiological measurement grounding the mechanism.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "It then declined over several weeks in Kcnq4-/- mice and over several months in mice carrying the dominant negative allele."
      explanation: Shows the model reproduces progressive rather than congenital loss, and that the dominant allele is the slower of the two.
  - target: Progressive Outer Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Selective outer hair cell loss paralleling the hearing decline.
    evidence:
    - reference: PMID:16437162
      reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This progressive hearing loss was paralleled by a selective degeneration of outer hair cells (OHCs)."
      explanation: Histological confirmation of the degeneration this node asserts.
- name: Kcnq4 knockout on the C3H/HeJ background
  species: Mouse
  genotype: Kcnq4 knockout backcrossed to C3H/HeJ
  publication: PMID:31102762
  description: >-
    The same null allele on a different inbred background, made specifically to
    look for a mechanism behind the profound late phase that outer hair cell loss
    alone did not explain.
  modeled_mechanisms:
  - target: Inner Hair Cell and Spiral Ganglion Neuron Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Demonstrates that inner hair cell and neuronal death occurs, and that it is a
      separate and much later event than outer hair cell loss.
    limitations: >-
      The finding is background-dependent - it appeared on C3H/HeJ where the earlier
      mixed-background model showed mostly intact inner hair cells - so it
      establishes that this degeneration can happen rather than that it does happen
      in human DFNA2A. Fidelity is recorded as MODERATE for that reason.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The two mouse studies differ in inbred background rather than in allele, and
        report different cellular outcomes. The human population is outbred, so
        neither strain's outcome can be assumed to be the human one.
    readouts:
    - name: Spiral ganglion neuron count
      target: Inner Hair Cell and Spiral Ganglion Neuron Degeneration
      direction: DECREASED
      interpretation: Neuronal loss measured directly rather than inferred from threshold shifts.
      evidence:
      - reference: PMID:31102762
        reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We tracked the spatiotemporal survival of cochlear cells by plotting cytocochleograms and neuronal counts at different ages."
        explanation: Names the measurement that grounds the neuronal degeneration claim.
    evidence:
    - reference: PMID:31102762
      reference_title: "Inner Hair Cell and Neuron Degeneration Contribute to Hearing Loss in a DFNA2-Like Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition to the already reported outer hair cell death, the C3H/HeJ strain also exhibited inner hair cell and spiral ganglion neuron death."
      explanation: The observation the model was built to test for.
- name: Kcnq4 p.W277S knockin mouse
  species: Mouse
  genotype: Kcnq4 p.W277S knockin (homologous to human KCNQ4 p.W276S)
  publication: PMID:40898620
  description: >-
    An allele-specific knockin carrying the mouse equivalent of the recurrent human
    pore hotspot, built as the test bed for allele-preferential antisense knockdown.
  modeled_mechanisms:
  - target: Progressive Outer Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces both the progressive hearing loss and the outer hair cell
      degeneration, with the human hotspot allele rather than a null.
    evidence:
    - reference: PMID:40898620
      reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We previously demonstrated that Kcnq4 p.W277S knockin mice harboring the homologous mutation to human KCNQ4 p.W276S recapitulate the progressive hearing loss observed in DFNA2 patients, including the predominant degeneration of OHCs."
      explanation: States the model's fidelity to the human phenotype in the authors' own terms.
- name: Kcnq4 p.G228D humanized knock-in mouse
  species: Mouse
  genotype: Kcnq4 humanized homologous p.G228D knock-in, heterozygous and homozygous
  publication: PMID:35599357
  description: >-
    A humanized knock-in carrying the mouse equivalent of a KCNQ4 variant found in a
    large Chinese family, made in both heterozygous and homozygous states. The human
    family carried both genotypes too, so the allele-dose comparison exists on both
    sides.
  modeled_mechanisms:
  - target: Progressive High-Frequency Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces the human audiometric trajectory, including the spread from
      mid-and-high frequency loss to all frequencies, and the dose effect between
      heterozygotes and homozygotes.
    limitations: >-
      The mouse timescale is weeks where the human is decades, so the model reproduces
      the sequence and the dose relationship but not the tempo.
    readouts:
    - name: Outer hair cell resting potential and potassium current
      target: Progressive High-Frequency Sensorineural Hearing Loss
      direction: DECREASED
      interpretation: >-
        The electrophysiological lesion measured directly in the model's own outer hair
        cells, confirming the mechanism rather than only the phenotype.
      evidence:
      - reference: PMID:35599357
        reference_title: "A humanized murine model, demonstrating dominant progressive hearing loss caused by a novel KCNQ4 mutation (p.G228D) from a large Chinese family."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The reduced K+ currents and depolarized resting potentials were revealed in OHCs."
        explanation: Couples the reduced current to the depolarization this entry's chain asserts follows from it.
    evidence:
    - reference: PMID:35599357
      reference_title: "A humanized murine model, demonstrating dominant progressive hearing loss caused by a novel KCNQ4 mutation (p.G228D) from a large Chinese family."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The heterozygotes had mid-frequency and high-frequency hearing loss at 4 weeks, and moved toward all frequencies hearing loss at 12 weeks, while the homozygotes had severe-to-profound hearing loss at 8 weeks."
      explanation: >-
        The progression and the allele-dose effect in one measurement. The homozygote
        result is the part the human family also shows, which is unusual for a dominant
        disease and is why the model is worth recording separately.
  - target: Progressive Outer Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Base-to-apex outer hair cell loss, matching the expression gradient.
    evidence:
    - reference: PMID:35599357
      reference_title: "A humanized murine model, demonstrating dominant progressive hearing loss caused by a novel KCNQ4 mutation (p.G228D) from a large Chinese family."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The degeneration of outer hair cells (OHCs) was observed from basal to apical turn of cochlea."
      explanation: Independent confirmation of the spatial progression, in a third mouse model and on a different allele.
- name: kcnq4 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: kcnq4 morpholino knockdown, rescued with wild-type kcnq4 mRNA
  publication: PMID:41368761
  description: >-
    The only non-mammalian model in this entry, and it tests a different thing from
    the mouse lines. Where the mouse models carry a specific human-equivalent allele
    and are read out as progressive adult hearing loss, this is an acute knockdown
    read out as inner ear development: otolith morphology, hair cell number, and the
    startle-driven motor response. Its value is the rescue arm - the phenotype is
    reversed by reintroducing wild-type kcnq4 mRNA, which is the control that makes
    the knockdown attributable to the gene rather than to morpholino toxicity. The
    same paper characterizes a novel human variant, p.Trp275Cys, adjacent to the
    W276 hotspot.
  modeled_mechanisms:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Knocking the channel down reduces hair cell number and disturbs otolith
      morphology, which is consistent with the conductance being required for hair
      cell viability. It is not a measurement of the conductance itself.
    limitations: >-
      Zebrafish have no cochlea and no outer hair cells, so the target node's cell
      type does not exist in this organism; the readouts come from lateral line and
      inner ear hair cells instead. The knockdown is acute and developmental where
      the human disease is a slowly progressive adult-onset loss, and morpholino
      knockdown reduces the whole gene product rather than reproducing a
      dominant-negative allele.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cell type carrying I(K,n) in the human disease - the cochlear outer hair
        cell - has no zebrafish counterpart. The model reports on hair cells generally,
        so it supports the requirement for the channel in hair cell biology and not the
        specific conductance loss this node names.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Negative dominance is outside the model. A morpholino lowers the amount of
        wild-type product; it does not introduce a mutant subunit that poisons tetramers,
        which is the actual lesion in most patients.
    readouts:
    - name: Inner ear hair cell number
      target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
      direction: DECREASED
      interpretation: >-
        Hair cell loss following knockdown, with otolith morphology and motor response
        as the accompanying structural and behavioural measures.
      evidence:
      - reference: PMID:41368761
        reference_title: "Pathogenic Mechanism of the KCNQ4 Gene Variant in Hearing Loss and Functional Validation in a Zebrafish Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This approach revealed significant changes in otolith morphology, a marked reduction in hair cell numbers, and abnormal motor responses."
        explanation: The three measured outcomes of the knockdown.
  evidence:
  - reference: PMID:41368761
    reference_title: "Pathogenic Mechanism of the KCNQ4 Gene Variant in Hearing Loss and Functional Validation in a Zebrafish Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used morpholino to knock down kcnq4 in zebrafish and rescued the phenotype by reintroducing wild-type kcnq4 mRNA."
    explanation: >-
      The design, including the rescue arm that makes the phenotype attributable to the
      gene rather than to the reagent.
  - reference: PMID:41368761
    reference_title: "Pathogenic Mechanism of the KCNQ4 Gene Variant in Hearing Loss and Functional Validation in a Zebrafish Model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the mutation induced longitudinal extension of the channel, reduced protein stability, and impaired potassium ion selectivity, thereby disrupting potassium ion homeostasis in the inner ear and ultimately leading to hearing loss"
    explanation: >-
      The in vitro half of the same paper, on a variant adjacent to the W276 hotspot. A
      fourth mechanistic route - intact trafficking and assembly but lost ion selectivity -
      which is neither pore-blocking negative dominance nor loss of the subunit.
treatments:
- name: Hearing Amplification and Cochlear Implantation
  description: >-
    Standard of care and, at present, the only clinically available option. Hearing
    aids are needed by most affected people between the ages of ten and forty;
    cochlear implantation is considered once loss becomes severe to profound. This
    is symptomatic management - it addresses the consequence of outer hair cell loss
    without touching the channel defect.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation and hearing amplification
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing aids for those with mild-to-moderate hearing loss; consideration of cochlear implants when hearing loss is severe to profound"
    explanation: The GeneReviews management recommendation, with the threshold for escalating from amplification to implantation.
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected persons initially require hearing aids to assist with sound amplification between ages ten and 40 years."
    explanation: The age window over which amplification typically becomes necessary.
- name: KCNQ Channel Openers
  description: >-
    A pharmacological rescue strategy tested in vitro. Zinc pyrithione combined with
    retigabine potentiates KCNQ4 currents, and in a dominant-negative co-expression
    system restored current essentially to wild-type levels - probably by strongly
    activating the small remaining fraction of homomeric wild-type channels rather
    than by fixing the mutant. The critical limitation is allele-dependence: pore
    mutants are completely unresponsive, so the strategy cannot help the patients
    carrying the commonest hotspot variant. No clinical data exist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: retigabine
      term:
        id: CHEBI:68584
        label: ezogabine
    - preferred_term: zinc pyrithione
      term:
        id: CHEBI:32076
        label: zinc pyrithione
  target_mechanisms:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    description: >-
      The openers act on the conductance itself, upstream of depolarization and
      degeneration, which is why they would have to be given before cells are lost.
  evidence:
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The strongest potentiation was observed with a combination of zinc pyrithione plus retigabine."
    explanation: Identifies the drug combination and its effect on the channel.
  - reference: PMID:21951272
    reference_title: "Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic channel openers."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "DFNA2 mutations located in the channel's pore region abolished channel function and these mutant channels were completely unresponsive to channel openers."
    explanation: >-
      Evidence against this treatment for the pore-variant subgroup, which includes
      the recurrent p.W276S hotspot. Recorded as REFUTE because it contradicts the
      general claim that channel openers treat this disease.
  - reference: PMID:34316018
    reference_title: "Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphatidylinositol 4,5-bisphosphate (PIP2), an obligatory phospholipid for maintaining KCNQ channel activity, confers differential pharmacological sensitivity of channels to KCNQ openers."
    explanation: >-
      Supplies the reason the response is allele-dependent rather than leaving it as an
      observation - PIP2 dependence differs by domain, so which opener helps depends on
      where the variant sits. This is what makes the strategy genotype-directed rather
      than simply unreliable.
  - reference: PMID:34316018
    reference_title: "Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function variant in the gene encoding the KCNQ4 potassium channel causes autosomal dominant nonsyndromic hearing loss (DFNA2), and no effective pharmacotherapeutics have been developed to reverse channel activity impairment."
    explanation: The standing therapeutic gap this strategy is aimed at, stated by its own investigators.
- name: Allele-Preferential Antisense Oligonucleotide Knockdown
  description: >-
    A mechanism-matched strategy for the dominant-negative problem: if the mutant
    subunit poisons the tetramer, removing the mutant transcript while sparing the
    wild-type one should restore channel function. ASO-123 does exactly that against
    the p.W276S hotspot, and in the corresponding knockin mouse it attenuated
    hearing loss, improved outer hair cell survival and improved their
    electrophysiology. Preclinical only.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  oligonucleotide_details:
    oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: KCNQ4
      term:
        id: hgnc:6298
        label: KCNQ4
    target_transcript: mutant KCNQ4 mRNA (p.W276S allele)
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: KCNQ4 Dominant-Negative Subunit Incorporation
    description: >-
      Removing the mutant transcript prevents the poisoned subunit being made at all,
      which is the most upstream point in this chain that a therapy can act on.
  evidence:
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a Kcnq4 p.W277S knockin mouse model mimicking DFNA2, ASO-123 preferentially suppressed mutant transcripts, attenuated progressive hearing loss, and improved outer hair cell survival while enhancing their electrophysiologic function."
    explanation: The in vivo efficacy result, covering transcript selectivity, hearing, cell survival and function.
  - reference: PMID:40898620
    reference_title: "Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing loss in a murine model of human DFNA2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a systemic in vitro screen, ASO-123 demonstrated a knockdown of mutant Kcnq4 while preserving wild-type transcripts."
    explanation: Establishes allele preference, which is the property the whole strategy depends on.
  notes: >-
    oligonucleotide_chemistry, conjugation and delivery_platform are left unset. The
    abstract and introduction available in the reference cache name the mechanism and
    the target allele but not the backbone chemistry or the delivery route, and those
    slots are not filled by inference.
- name: Adenine Base Editing of the Pathogenic Allele
  description: >-
    Correction rather than knockdown. Dual-AAV delivery of the adenine base editor
    ABE8e corrected 21.4 to 28.9 per cent of alleles in the organ of Corti of a
    p.G321S knockin mouse, lowered auditory brainstem response thresholds by up to
    49 dB SPL, and preserved hair cells, spiral ganglion neurons and nerve fibres for
    at least 32 weeks. A dose-dependent safety window was found, with higher doses
    producing faster recovery but accelerated later decline. Preclinical only, and
    the correction efficiency is allele-specific.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: KCNQ4 Dominant-Negative Subunit Incorporation
    description: >-
      Correcting the base restores a wild-type subunit, so no poisoned tetramer is
      assembled.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment reduced auditory brainstem response thresholds by up to 49.09 dB SPL at optimal frequencies, mitigated degeneration of hair cells, spiral ganglion neurons, and auditory nerve fibers, and partially restored outer hair cell electrophysiology."
    explanation: The efficacy result across function, histology and electrophysiology.
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A dose-dependent therapeutic window emerged: higher doses promoted rapid recovery, whereas optimized lower doses minimized long-term toxicity and sustained functional benefit for at least 32 weeks."
    explanation: The safety finding, which is the part that constrains translation rather than supporting it.
environmental:
- name: Loud noise exposure
  description: >-
    Noise is an aggravating exposure rather than a cause. GeneReviews lists avoiding
    loud noise under agents and circumstances to avoid, on the reasoning that it may
    slow the rate of high-frequency progression. The mechanistic rationale is that
    noise damages the same outer hair cells the channel defect is already killing, so
    the two insults share a target.
  exposure_term:
    preferred_term: exposure to sound radiation
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  influences_mechanisms:
  - target: Progressive Outer Hair Cell Degeneration
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Noise exposure is expected to add to the outer hair cell loss the channel
      defect produces. The link is indirect: the source states the clinical
      recommendation and the expected effect on progression rate, not a measured
      interaction in DFNA2A cochleae.
    evidence:
    - reference: PMID:20301388
      reference_title: "DFNA2 Nonsyndromic Hearing Loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Avoiding exposure to loud noise may reduce the rate of progression of high-frequency SNHL."
      explanation: >-
        The GeneReviews avoidance recommendation. Note the hedge in the source - "may
        reduce" - which is why the interaction is recorded as expected rather than
        demonstrated.
    - reference: PMID:40752593
      reference_title: "Insights into early cochlear damage induced by potassium channel deficiency."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Despite these structural changes, noise exposure does not exacerbate OHC damage in our KCNQ4-deficient model."
      explanation: >-
        The only experiment here that tests the interaction rather than assuming it, and
        it comes out against. A KCNQ4-deficient mouse exposed to noise showed no added
        outer hair cell damage. This does not overturn the clinical recommendation, which
        rests on general noise ototoxicity in an already-compromised cochlea, but it is
        the reason the edge stays INDIRECT_UNKNOWN_INTERMEDIATES rather than being
        upgraded on the strength of a plausible shared target.
  evidence:
  - reference: PMID:20301388
    reference_title: "DFNA2 Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Avoiding exposure to loud noise may reduce the rate of progression of high-frequency SNHL."
    explanation: The full GeneReviews avoidance statement including its section heading.
- name: Aminoglycoside antibiotic exposure
  description: >-
    A second aggravating exposure, and one with a mechanism that meets this disease's
    own lesion rather than merely sharing its target cell. KCNQ channel activity
    requires PIP2, and aminoglycosides sequester PIP2. Applied intracellularly to rat
    outer hair cells they inhibit I(K,n) through PIP2 depletion - the same conductance
    the KCNQ4 variant has already reduced. So the ototoxicity that makes
    aminoglycosides hazardous to anyone is, in DFNA2A, a second hit on the surviving
    channel population.

    Recorded as an inferred interaction, not a demonstrated one: the PIP2 work was done
    in wild-type rat outer hair cells, not in a DFNA2A model, and no study has tested
    aminoglycoside exposure against a KCNQ4 genotype. The convergence is on the
    conductance, which is what makes it worth stating.
  exposure_term:
    preferred_term: exposure to aminoglycoside antibiotic
  review_notes: >-
    Left unbound deliberately, and the reason is worth recording because it is not the
    usual one. ECTO does have an exact term - ECTO:9002231, "exposure to aminoglycoside
    antibiotic" - and it resolves in OLS. It does not resolve in the sqlite:obo:ecto
    build that conf/oak_config.yaml routes the ECTO prefix to, where the CURIE returns a
    null label, so binding it fails just validate-terms with both "not in dynamic enum
    ExposureTerm" and "not found in ontology". Searching that build for an alternative
    returns only pesticide and acaricide exposures, none of which is this. So the term
    exists, is correct, and cannot be used until the configured adapter catches up.
    Filed as a separate issue; the free-text preferred_term is the accurate interim.
  influences_mechanisms:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The intermediate is known and named - PIP2 depletion - which is why this is
      INDIRECT_KNOWN_INTERMEDIATES rather than unknown. The exposure acts on the same
      node the genetic lesion acts on, one step removed.
    evidence:
    - reference: PMID:20935082
      reference_title: "Aminoglycosides inhibit KCNQ4 channels in cochlear outer hair cells via depletion of phosphatidylinositol(4,5)bisphosphate."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using whole-cell patch-clamp recordings from rat OHCs, we found that intracellularly applied AGs inhibit I(K,n)."
      explanation: >-
        The direct measurement of aminoglycoside inhibition of the conductance this node
        represents. In wild-type rat cells, which is the limitation recorded above.
  evidence:
  - reference: PMID:20935082
    reference_title: "Aminoglycosides inhibit KCNQ4 channels in cochlear outer hair cells via depletion of phosphatidylinositol(4,5)bisphosphate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "OHC survival critically depends on a specific K+ conductance (I(K,n)) mediated by KCNQ4 (Kv7.4) channels."
    explanation: >-
      States the dependence that makes the exposure and the genotype converge - outer
      hair cell survival rests on the same conductance both of them reduce.
  - reference: PMID:20935082
    reference_title: "Aminoglycosides inhibit KCNQ4 channels in cochlear outer hair cells via depletion of phosphatidylinositol(4,5)bisphosphate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a common hallmark of all KCNQ isoforms, channel activity requires phosphatidylinositol(4,5)bisphosphate [PI(4,5)P"
    explanation: >-
      The PIP2 requirement the mechanism turns on. Quoted short because the cached
      record truncates the subscript in the chemical formula mid-token.
discussions:
- discussion_id: dfna2a_prevalence_unquantified
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Autosomal Dominant Nonsyndromic Hearing Loss 2A
  prompt: >-
    What is the prevalence or incidence of DFNA2A, as distinct from its share of
    autosomal dominant nonsyndromic hearing loss?
  rationale: >-
    There is no `prevalence` section in this entry, and that is a fact about the
    literature rather than an unfinished section. The only quantity available is
    relative - pathogenic KCNQ4 variants account for roughly 9.5 per cent of
    autosomal dominant nonsyndromic hearing loss - and a share of an unmeasured
    denominator is not a prevalence. Orphanet, GeneReviews and the primary
    literature reviewed for this entry all state the genetic contribution and none
    states a population frequency, which is the expected position for a
    late-onset dominant condition whose carriers are commonly diagnosed as
    age-related hearing loss instead.

    Recorded so that a later reviewer does not read the empty section as an
    omission, and so that a registry figure has somewhere to attach. Closing it
    needs a denominator study, not a better literature search.
  evidence:
  - reference: PMID:42162447
    reference_title: "Long-term restoration of auditory function in a DFNA2 mouse model by adenine base editing."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in KCNQ4 account for ~9.5% of autosomal dominant nonsyndromic cases."
    explanation: >-
      The one quantity the literature does supply, and the reason it is not a
      prevalence: it is a proportion of a case series, with no population denominator.
      Graded as the same sentence is graded in the genetic section, since a grading
      belongs to the quoted sentence rather than to the block it sits in.
  - reference: PMID:35760561
    reference_title: "Proactive functional classification of all possible missense single-nucleotide variants in KCNQ4."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "approximately one in 100 people harbors missense variants in KCNQ4 (missense variants with minor allele frequency > 0.1% were excluded), but most are of unknown consequence"
    explanation: >-
      Why a carrier-frequency figure cannot be substituted for a prevalence here. One
      person in a hundred carries a rare KCNQ4 missense variant and the great majority
      of those variants have no established consequence, so the population burden of
      the disease cannot be read off the allele data.
notes: >-
  Relationship to DFNA2B. The DFNA2 locus is genetically heterogeneous, and its
  other half is curated separately as Autosomal_Dominant_Nonsyndromic_Hearing_Loss_2B
  (GJB3). The two share a locus designation but not a mechanism - a potassium channel
  in outer hair cells here, a connexin there - which is why they are separate Disease
  entries rather than subtypes of one. The GeneReviews chapter cited throughout covers
  the KCNQ4 form and is titled for the locus rather than the gene.

  On the treatment section. Three of the four treatments listed are preclinical, and
  each is marked as such in its description. They are included because the
  mechanism-to-therapy mapping is unusually direct in this disease and is part of what
  the pathograph is for: channel openers act on the conductance node, the antisense
  oligonucleotide and the base editor act on the dominant-negative node upstream of
  it, and only amplification acts downstream of cell death. Nothing here should be
  read as available care.

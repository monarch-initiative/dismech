mechanistic_hypotheses:
- hypothesis_group_id: late_phase_cellular_target
  hypothesis_label: Outer hair cell degeneration alone accounts for advanced DFNA2A hearing loss
  status: EMERGING
  description: >-
    Outer hair cell degeneration explains much of the hearing deficit in the founding mixed-background
    mice. Expression studies proposed inner hair cell or neuronal involvement, and later null and missense
    models demonstrate additional injury. These findings challenge an exclusively outer-hair-cell account,
    but expression patterns alone do not establish a primary lesion. Age, genotype and background differ
    across studies and have not been isolated as explanations for every discrepancy. The relative contributions
    in human advanced disease remain uncertain; the models do not establish a universal treatment deadline.
  evidence:
  - reference: PMID:16437162
    reference_title: "Mice with altered KCNQ4 K+ channels implicate sensory outer hair cells in human progressive deafness."

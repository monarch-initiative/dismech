name: Autosomal Dominant Nonsyndromic Hearing Loss 2A
creation_date: "2026-09-13T00:00:00Z"
category: Mendelian
synonyms:
- DFNA2A
- deafness, autosomal dominant 2A
- KCNQ4-related autosomal dominant nonsyndromic hearing loss
- autosomal dominant nonsyndromic deafness 2A
- DFNA2 nonsyndromic hearing loss
description: >-
  Autosomal dominant nonsyndromic hearing loss 2A (DFNA2A) is caused by
  heterozygous variants in KCNQ4, which encodes the voltage-gated potassium
  channel Kv7.4. In cochlear outer hair cells Kv7.4 carries I(K,n), the standing
  potassium conductance that sets the resting membrane potential and allows
  potassium entering through the apical transduction channels to leave across the
  basolateral membrane.

  Most pathogenic variants act by negative dominance rather than by
  haploinsufficiency. Kv7.4 channels are tetramers, so one mutant subunit
  incorporated into an assembling channel poisons the whole complex, and
  co-expressing wild-type with a pore mutant suppresses current to barely
  detectable levels. The cell is then left chronically depolarised. Outer hair
  cells degenerate slowly under that load, and because the channel is expressed
  along a base-to-apex gradient the loss begins at the high-frequency basal end.

  Clinically this produces symmetric, predominantly high-frequency sensorineural
  hearing loss that progresses across all frequencies with age, reaching
  severe-to-profound impairment in everyone affected by their seventies. The
  entry records a live mechanistic disagreement about the later phase of the
  disease - whether outer hair cell loss alone accounts for it, or whether inner
  hair cell and spiral ganglion neuron degeneration is a necessary second stage -
  and three therapeutic strategies at different stages of development, from
  standard amplification to allele-preferential antisense oligonucleotides and
  adenine base editing.

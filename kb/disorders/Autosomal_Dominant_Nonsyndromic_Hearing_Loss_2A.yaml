- name: kcnq4 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: kcnq4 morpholino knockdown, rescued with wild-type kcnq4 mRNA
  publication: PMID:41368761
  description: >-
    Acute developmental kcnq4 morpholino knockdown produced hair cell, otolith and motor abnormalities.
    Wild-type mRNA rescue supports a gene-related effect but does not exclude every off-target effect.
    This model does not reproduce a dominant-negative human allele or adult cochlear outer hair cell physiology.
    The same paper separately reports a human W275C family and cell/structural studies.
  modeled_mechanisms:
  - target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Knocking the channel down reduces hair cell number and disturbs otolith
      morphology, which is consistent with the conductance being required for hair
      cell viability. It is not a measurement of the conductance itself.
    limitations: >-
      Zebrafish have no cochlea and no outer hair cells, so the target node's cell type does not exist
      in this organism; the readouts come from lateral line and inner ear hair cells instead. The knockdown
      is acute and developmental where the human disease is a progressive loss with variable age of onset,
      and morpholino knockdown reduces the whole gene product rather than reproducing a dominant-negative
      allele.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cell type carrying I(K,n) in the human disease - the cochlear outer hair
        cell - has no zebrafish counterpart. The model reports on hair cells generally,
        so it supports the requirement for the channel in hair cell biology and not the
        specific conductance loss this node names.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Negative dominance is outside the model. A morpholino lowers the amount of
        wild-type product; it does not introduce a mutant subunit that poisons tetramers,
        which is the actual lesion in most patients.
    readouts:
    - name: Inner ear hair cell number
      target: Loss of the Outer Hair Cell I(K,n) Potassium Conductance
      direction: DECREASED
      interpretation: >-
        Hair cell loss following knockdown, with otolith morphology and motor response
        as the accompanying structural and behavioural measures.
      evidence:
      - reference: PMID:41368761
        reference_title: "Pathogenic Mechanism of the KCNQ4 Gene Variant in Hearing Loss and Functional Validation in a Zebrafish Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This approach revealed significant changes in otolith morphology, a marked reduction in hair cell numbers, and abnormal motor responses."
        explanation: The three measured outcomes of the knockdown.
  evidence:
  - reference: PMID:41368761
    reference_title: "Pathogenic Mechanism of the KCNQ4 Gene Variant in Hearing Loss and Functional Validation in a Zebrafish Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We used morpholino to knock down kcnq4 in zebrafish and rescued the phenotype by reintroducing wild-type kcnq4 mRNA."
    explanation: >-
      Wild-type mRNA rescue supports specificity without proving absence of all reagent effects.
- name: Kcnq4-null vestibular mouse
  species: Mouse
  genotype: Kcnq4-/- with or without dominant-negative Kcnq5
  publication: PMID:23408425
  description: >-
    Sensitive reflex testing detected altered vestibulo-ocular responses without circling. Adult KCNQ4
    and KCNQ5 localized to postsynaptic calyx-forming neurons, not vestibular hair cells; this revised
    the localization premise of the older study. Mouse altered reflexes do not establish the direction
    or frequency of human vestibular hyperreactivity.
  evidence:

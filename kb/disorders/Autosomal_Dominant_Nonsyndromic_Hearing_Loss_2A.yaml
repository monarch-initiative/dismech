- hypothesis_group_id: variant_specific_channel_gating
  hypothesis_label: Variant-specific gating and phosphoinositide dependence modify KCNQ4 channel function
  status: EMERGING
  description: >-
    R216H shifts channel activation toward more positive potentials. In a separate heterologous study,
    WT-R331Q forced heteromers respond to PIP2 augmentation or openers, whereas WT-G319D forced heteromers
    are hyperactive and can be downregulated. G319D and R331Q were VUS in that study, so these findings
    describe experimental channel mechanisms rather than established human mechanistic subtypes. Linopirdine
    reduced the hyperactive forced WT-G319D current to the WT-WT level; intracellular poly-L-lysine also
    reduced current. These are in-vitro pharmacology results without demonstrated human benefit.
  evidence:
  - reference: PMID:41639121
    reference_title: Two-step voltage-sensor activation of the human K(V)7.4 channel and effect of a deafness-associated mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our analysis revealed that R216H impaired the voltage dependence of channel opening and both VSD
      activation components
    explanation: >-
      Voltage-clamp fluorometry in heterologously expressed channels shows altered activation. This does
      not itself demonstrate a dominant-negative mechanism.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34316018
    reference_title: Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Based on these results, we concluded that p.G319D did not exert a dominant-negative inhibitory effect
      on WT channels
    explanation: >-
      G319D forced heteromers differ from the canonical dominant-negative model. The study's clinical
      classification remained VUS.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34316018
    reference_title: Novel KCNQ4 variants in different functional domains confer genotype- and mechanism-based therapeutics in patients with nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Therefore, we concluded that pathogenic heteromeric WT-p.R331Q channels can be rescued by an increased
      PIP2 concentration, treatment with KCNQ openers, or both.
    explanation: >-
      Experimental rescue result; the authors' word pathogenic in the discussion does not supersede their
      VUS classification table.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:34316018

    Symmetric, high-frequency-predominant sensorineural hearing loss commonly progresses to involve all
    frequencies. The clinical course varies by allele and family. GeneReviews describes severe-to-profound
    impairment by age 70 in its summarized cohorts; this is a historical clinical summary rather than
    a prospective guarantee for every newly identified allele.

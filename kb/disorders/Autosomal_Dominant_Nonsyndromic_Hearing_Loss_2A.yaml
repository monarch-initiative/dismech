name: Autosomal Dominant Nonsyndromic Hearing Loss 2A
creation_date: "2026-09-13T00:00:00Z"
category: Mendelian
synonyms:
- DFNA2A
- deafness, autosomal dominant 2A
- KCNQ4-related autosomal dominant nonsyndromic hearing loss
- autosomal dominant nonsyndromic deafness 2A
- DFNA2 nonsyndromic hearing loss
description: >-
  Autosomal dominant nonsyndromic hearing loss 2A (DFNA2A) is caused by pathogenic KCNQ4 variants affecting
  the Kv7.4 potassium channel. Dominant-negative loss of channel function is a major mechanism. Reduced
  outer hair cell I(K,n) conductance produces chronic depolarization, impaired cochlear amplification
  and progressive degeneration in experimental models. Variant effects depend on channel assembly and
  gating; functional assay results alone do not establish clinical pathogenicity. Hearing loss is usually
  symmetric, high-frequency predominant and progressive, with variable onset and severity. Human vestibular
  hyperreactivity has been documented in some families. Additional inner hair cell and neuronal degeneration
  may contribute to advanced disease, but its human contribution is unresolved. Hearing aids, implant
  assessment and educational support form clinical care; channel modulators, antisense knockdown and base
  editing remain experimental in the cited studies.

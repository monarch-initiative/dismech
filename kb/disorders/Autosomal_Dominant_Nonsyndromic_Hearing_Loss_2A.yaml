- name: Progressive Outer Hair Cell Degeneration
  description: >-
    Outer hair cell degeneration accompanies progressive hearing loss in multiple Kcnq4 models. Basal
    loss precedes apical loss in some null and missense models, but the p.G322S model initially loses
    apical and middle-turn cells. Expression gradients and phenotype are therefore not a universal spatial
    rule. Inner hair cell and neuronal survival depend on model and observation age.

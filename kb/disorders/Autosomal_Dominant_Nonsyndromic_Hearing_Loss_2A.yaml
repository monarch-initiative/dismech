inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous pathogenic KCNQ4 variants usually segregate as autosomal dominant hearing loss, with
    a 50% transmission probability for each child. Most affected individuals have an affected parent;
    the overall de novo proportion is unknown. GeneReviews describes complete penetrance with variable
    onset and severity. Once a familial pathogenic variant is established, prenatal and preimplantation
    genetic testing are possible.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: Unknown; most affected individuals have an affected parent

pathophysiology:
- name: KCNQ4 Dominant-Negative Subunit Incorporation
  description: >-
    Several pathogenic pore-region variants suppress wild-type Kv7.4 current when coexpressed, consistent
    with dominant-negative interference in tetrameric channels. The strength of suppression and the effect
    of subunit stoichiometry vary by allele. A universal rule that any single mutant subunit completely
    disables every channel is not established for all KCNQ4 variants. Gating defects and dominant-negative
    behavior need not be mutually exclusive.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:

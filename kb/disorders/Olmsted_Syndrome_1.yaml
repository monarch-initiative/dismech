treatments:
- name: Erlotinib
  description: >-
    Oral EGFR tyrosine kinase inhibitor, used at doses below oncology dosing
    (2 mg/kg/day in the paediatric series), which produced disappearance of
    hyperkeratosis and pain within three months in TRPV3-confirmed patients,
    sustained over twelve months, with remission of anorexia, insomnia and
    catch-up growth; adverse effects were mild to moderate. It is the first
    mechanism-directed therapy, with consistent responses in uncontrolled case
    series.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erlotinib
      term:
        id: CHEBI:114785
        label: erlotinib
  target_mechanisms:
  - target: EGFR-mTOR Signaling Hyperactivation in Epidermis
    treatment_effect: INHIBITS
    description: Blocks the EGFR transactivated by hyperactive TRPV3.
    evidence:
    - reference: PMID:31895432
      reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Targeting EGFR transactivation with erlotinib therapy may result in clinical remission in an orphan disease that lacks an effective intervention."
      explanation: The authors frame the response as a consequence of blocking EGFR transactivation.
  target_phenotypes:
  - preferred_term: Palmoplantar keratoderma
    term:
      id: HP:0000982
      label: Palmoplantar keratoderma
  - preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
  evidence:
  - reference: PMID:31895432
    reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within 3 months of initiating therapy with erlotinib, hyperkeratosis and pain disappeared."
    explanation: Primary response in three TRPV3-confirmed patients.
  - reference: PMID:31895432
    reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The doses of erlotinib used were lower than those used in oncology, and only mild to moderate adverse effects were noted."
    explanation: Dosing and tolerability.
  - reference: PMID:31895414
    reference_title: "Targeted Inhibition of the Epidermal Growth Factor Receptor and Mammalian Target of Rapamycin Signaling Pathways in Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 3 and 4 were treated with erlotinib only and later showed rapid and near complete resolution of PPK and substantial improvement in Children's Dermatology Life Quality Index scores."
    explanation: Independent series confirming near-complete resolution of keratoderma on erlotinib monotherapy.
  - reference: PMID:31895414
    reference_title: "Targeted Inhibition of the Epidermal Growth Factor Receptor and Mammalian Target of Rapamycin Signaling Pathways in Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erlotinib was administered to all 4 patients at a dosage of 2 mg/kg/d."
    explanation: Paediatric dose used.
  - reference: PMID:36709954
    reference_title: "Two for two: Dual therapy with erlotinib and acitretin for twins with severe keratoderma in Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe pre-school aged twins with OS with partial improvement from oral erlotinib, an EGFR inhibitor, but dramatic reduction of their persistent palmoplantar thickening and pain from adding acitretin."
    explanation: Response to erlotinib can be partial, and in these twins was completed by adding acitretin.
  - reference: PMID:35789571
    reference_title: "Treatment of TRPV3 mutation-associated Olmsted syndrome with erlotinib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He tolerated the medication well aside from nausea that was controlled with ondansetron, and his pain nearly resolved, with only intermittent flares."
    explanation: A fourth independent TRPV3 patient, treated with erlotinib 50 then 75 mg daily alongside acitretin, with near-resolution of pain.
  - reference: PMID:39926429
    reference_title: "Erlotinib therapy for Olmsted syndrome with p.L655P missense mutation in the TRPV3 gene: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "After 3 months of treatment, most plantar lesions resolved, and the pain experienced was mildly alleviated."
    explanation: >-
      In the L655P patient erlotinib 75 mg daily was given together with oral
      acitretin, so the resolution of most plantar lesions within three months
      cannot be attributed to erlotinib alone; the pain effect was smaller.
- name: Sirolimus
  description: >-
    Oral mTOR inhibitor (0.8 mg/m2 twice daily to a trough of 10-15 ng/mL),
    which improved erythema and periorificial hyperkeratosis in two children
    before they were switched to erlotinib for the palmoplantar keratoderma.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: EGFR-mTOR Signaling Hyperactivation in Epidermis
    treatment_effect: INHIBITS
    description: Inhibits the mTOR arm downstream of EGFR, shown activated in lesional epidermis.
    evidence:
    - reference: PMID:31895414
      reference_title: "Targeted Inhibition of the Epidermal Growth Factor Receptor and Mammalian Target of Rapamycin Signaling Pathways in Olmsted Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lesional skin immunostaining showed increased phosphorylated ribosomal protein S6 (RPS6) and phosphorylated EGFR staining in the epidermis, indicating enhanced mTOR and EGFR signaling activation."
      explanation: The activated mTOR signalling that sirolimus was given to inhibit.
  target_phenotypes:
  - preferred_term: Periorificial keratotic plaques
    term:
      id: HP:0034521
      label: Periorificial hyperkeratosis
  evidence:

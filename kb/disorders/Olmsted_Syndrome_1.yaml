    reference_title: "Impact of the Gly573Ser substitution in TRPV3 on the development of allergic and pruritic dermatitis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A physiological study revealed that TRPV3(Gly573Ser) induced a higher nerve growth factor response to heat."

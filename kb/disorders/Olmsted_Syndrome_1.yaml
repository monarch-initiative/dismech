    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 1 and 2 were initially treated with sirolimus, displaying substantial clinical improvement in erythema and periorificial hyperkeratosis afterward."
    explanation: Sirolimus response in two children.

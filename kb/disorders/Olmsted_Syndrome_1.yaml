- name: Keratinocyte-Driven Itch Signaling
  description: >-
    Hyperactive keratinocyte TRPV3 transmits itch to sensory neurons. The
    channel is required for protease-activated receptor 2-evoked neuronal
    activation and scratching, and the Gly573Ser variant raises the keratinocyte
    nerve growth factor response to heat; DS-Nh mice carrying the variant
    scratch spontaneously even without dermatitis. The output is conditional:
    the same Gly573Ser variant on a 129S1/SvImJ background under Staphylococcus
    aureus-free housing produces no spontaneous itch, reduced pruritogen-evoked
    scratching and epidermal sensory hypoinnervation, so hyperactive TRPV3 does
    not cause itch unconditionally.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte

      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Rare families carry biallelic TRPV3 variants with recessive transmission.
    The primary report is Duchatelet et al. 2014 (PMID:24606194, a letter
    without an abstract, listed under references); the claim is cited through
    the review.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in TRPV3 (Transient receptor potential vanilloid-3) gene have recently been identified as a cause of autosomal dominant (gain-of-function mutations) or recessive OS."
    explanation: The review records both dominant and recessive TRPV3-related Olmsted syndrome.
genetic:
- name: TRPV3
  gene_term:
    preferred_term: TRPV3
    term:
      id: hgnc:18084
      label: TRPV3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Heterozygous missense variants in TRPV3, encoding the transient receptor
    potential vanilloid 3 cation channel expressed in keratinocytes and hair
    follicles, cause Olmsted syndrome 1. Recurrent variants cluster at Gly573
    (G573S, G573C), Gly568 (G568D, G568V), Leu673 (L673F) and Trp692 (W692G,
    W692C, W692S); variants in the S4-S5 linker and TRP domain produce the
    strongest channel gain of function and the severest phenotypes, whereas
    other positions (for example R416Q) give milder disease. Most variants arise
    de novo. No ClinGen gene-disease validity assertion for TRPV3 was found in
    the committed ClinGen validity export (cache/clingen/gene_validity.csv), so
    no gene_disease_validity tier is recorded.
  evidence:
  - reference: PMID:22405088
    reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nucleotide sequencing of five additional affected individuals also revealed missense mutations in TRPV3 (which produced p.Gly573Ser in three cases and p.Gly573Cys and p.Trp692Gly in one case each)."
    explanation: Independent affected individuals carried TRPV3 missense variants, establishing TRPV3 as the causal gene.
  - reference: PMID:22405088
    reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Encoding a transient receptor potential vanilloid-3 cation channel, TRPV3 is primarily expressed in the skin, hair follicles, brain, and spinal cord."
    explanation: Gene product identity and expression in the affected tissues.
  - reference: PMID:32795529
    reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified five previously unreported TRPV3 variations (R416Q, R416W, L655P, W692S, and L694P) and three recurrent variations (G568D, G568V, and L673F) in nine unrelated patients."
    explanation: Expands the TRPV3 variant spectrum across nine unrelated patients.
  - reference: PMID:32795529
    reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional changes were particularly pronounced in variants corresponding to severer Olmsted syndrome (e.g., L673F and W692S) but not in mild Olmsted syndrome variants (e.g., R416Q)."
    explanation: Electrophysiology of expressed variants ties the degree of channel dysfunction to clinical severity.
  variants:
  - name: p.Gly573Ser (G573S)
    description: >-
      The first and most recurrent Olmsted syndrome variant, identified de novo
      in the index trio and in three further patients; the same substitution
      occurs spontaneously in the hairless DS-Nh mouse.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:22405088
      reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Using whole-exome sequencing of case-parents trios, we have identified a de novo missense mutation in TRPV3 that produces p.Gly573Ser in an individual with OS."
      explanation: Discovery of the recurrent G573S variant.
  - name: p.Trp692Gly (W692G) and p.Trp692Cys (W692C)
    description: >-
      Substitutions of Trp692 in the TRP domain, each identified as a de novo
      heterozygous variant in a patient with the classic mutilating phenotype.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:24758389
      reference_title: "Olmsted syndrome in an Iranian boy with a new de novo mutation in TRPV3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TRPV3 was sequenced and a new de novo heterozygous missense mutation, c.2076G>C (p.Trp692Cys), was identified."
      explanation: Reports the de novo W692C variant in a boy with mutilating keratoderma, alopecia and pseudoainhum.
  - name: p.Leu673Phe (L673F)
    description: >-
      A recurrent S4-S5 linker variant associated with severe disease and
      erythromelalgia-like inflammatory flares.
    clinical_significance: PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:24452206
      reference_title: "A new TRPV3 missense mutation in a patient with Olmsted syndrome and erythromelalgia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing of patient DNA identified a novel de novo heterozygous missense mutation within TRPV3, p.Leu673Phe, predicted to be damaging."
      explanation: First report of the de novo L673F variant.
  - name: p.Val306Met (V306M)
    description: >-
      An atypical variant in exon 8 reported in an adult with mutilating
      keratoderma who developed plantar squamous cell carcinoma.
    clinical_significance: LIKELY_PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:39469632
      reference_title: "Case report: Novel p.Val306Met missense mutation in TRPV3 in a case of Olmsted syndrome accompanied by squamous cell carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis identified a novel heterozygous p.Val306Met missense mutation in the exon 8 of TRPV3."
      explanation: Reports the heterozygous V306M variant; functional characterisation was not reported, hence likely pathogenic rather than pathogenic.
  - name: p.Gly573Ala (G573A)
    description: >-
      A third substitution of the Gly573 hotspot, found in a patient whose
      immunological work-up showed hyper-IgE, eosinophilia and frequent skin
      infections.
    clinical_significance: LIKELY_PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:23692804
      reference_title: "Olmsted syndrome: exploration of the immunological phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient was found to harbour a previously undescribed 1718G-C transversion in TRPV3, causing a G573A point mutation."
      explanation: Reports the G573A variant at the recurrent Gly573 position; no electrophysiology was reported, hence likely pathogenic.
  - name: p.Met672Ile (M672I)
    description: >-
      A familial variant segregating through three generations with a mild,
      partly nonpenetrant, atypical phenotype (sclerodactyly-like fingers in
      the proband, focal plantar plaques in the grandfather); it increases
      apoptosis of HaCaT keratinocytes but less than the classic hotspot
      variants.
    clinical_significance: LIKELY_PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:26902751
      reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, TRPV3 sequencing results revealed an identical heterozygous mutation c.2016G > A in the proband, his mother and his maternal grandfather"
      explanation: Segregation of the c.2016G>A (p.Met672Ile) variant with disease in the family.
    - reference: PMID:26902751
      reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Additionally, a functional assay indicated that the Met672Ile mutation imposed a more significant induction of apoptosis on HaCaT cells compared with that of the wild type."
      explanation: Functional support in a keratinocyte line, consistent with the cytotoxic gain of function of other variants.
  - name: p.Leu655Pro (L655P)
    description: >-
      A heterozygous variant in exon 15 found in a patient with classic
      Olmsted syndrome and in his father, treated with erlotinib. The source
      abstract calls c.1964T>C a frameshift mutation, but a single-nucleotide
      substitution producing p.Leu655Pro is a missense change, as the article
      title states; the same residue was reported as L655P in the
      genotype-phenotype series.
    clinical_significance: LIKELY_PATHOGENIC
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:39926429
      reference_title: "Erlotinib therapy for Olmsted syndrome with p.L655P missense mutation in the TRPV3 gene: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, a previously unreported heterozygous frameshift mutation, c.1964 T > C (p.L655P), was identified in exon 15 of the TRPV3 gene in this patient and his father."
      explanation: Reports the heterozygous L655P variant in the patient and his father; the quoted sentence misnames the substitution as a frameshift.
pathophysiology:
- name: TRPV3 Gain-of-Function Channel Activation
  description: >-
    Missense variants in TRPV3 lock the thermosensitive, calcium-permeable
    cation channel into a constitutively open state. Expressed in HEK293 cells,
    Olmsted syndrome variants conduct much larger inward currents than wild-type
    channel, with elevated basal open probability and increased voltage
    sensitivity; the magnitude of the gain of function tracks clinical severity.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    gene:
      preferred_term: TRPV3
      term:
        id: hgnc:18084
        label: TRPV3
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous, mostly de novo, germline missense variants; the channel is
      constitutively active rather than merely more active, so the variant
      consequence is recorded as GAIN_OF_FUNCTION.
  genes:
  - preferred_term: TRPV3
    term:
      id: hgnc:18084
      label: TRPV3
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  molecular_functions:
  - preferred_term: TRPV3 calcium-permeable cation channel activity
    term:
      id: GO:0005262
      label: calcium channel activity
    modifier: GAIN_OF_FUNCTION
    description: >-
      The variant channel opens constitutively, outside its normal temperature
      and ligand gating, which is a qualitative loss of regulatory constraint
      rather than a quantitative increase in a regulated activity.
  evidence:
  - reference: PMID:22405088
    reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In transfected HEK293 cells expressing TRPV3 mutants, much larger inward currents were recorded, probably because of the constitutive opening of the mutants."
    explanation: Patch-clamp recordings of the G573S, G573C and W692G channels show constitutive activation.
  - reference: PMID:32795529
    reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These variant TRPV3 channels, in either homomeric or heteromeric form, exhibited differentially elevated basal open probability, increased voltage sensitivity, and cytotoxicity."
    explanation: Seven expressed variants show graded gain of channel function, including when co-assembled with wild-type subunits as in heterozygous patients.
  - reference: PMID:32795529
    reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "We have previously shown that gain-of-function variations in transient receptor potential vanilloid-3 (TRPV3) underlay Olmsted syndrome, a rare hyperkeratotic skin channelopathy."
    explanation: States the gain-of-function mechanism and frames the disease as a skin channelopathy.
  downstream:
  - target: Keratinocyte Calcium Overload
    causal_link_type: DIRECT
    description: >-
      A constitutively open calcium-permeable channel in the keratinocyte
      plasma membrane admits unregulated calcium influx.
    evidence:
    - reference: PMID:18754035
      reference_title: "Impact of the Gly573Ser substitution in TRPV3 on the development of allergic and pruritic dermatitis in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We reported that the Gly573Ser substitution in transient receptor potential vanilloid 3 (TRPV3) led to increased ion channel activity in keratinocytes and caused spontaneous hairlessness in DS-Nh mice."
      explanation: The same substitution found in patients increases channel activity in keratinocytes of the DS-Nh mouse.
- name: Keratinocyte Calcium Overload
  description: >-
    Unregulated calcium entry through constitutively active TRPV3 disturbs
    keratinocyte calcium homeostasis. TRPV3 is one of the principal calcium
    entry pathways of keratinocytes, and Olmsted syndrome variants are
    cytotoxic when expressed; some variants also act as calcium-leaky channels
    at lysosomes and disturb lysosomal pH and number.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: calcium ion transmembrane transport into keratinocytes
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: INCREASED
  - preferred_term: keratinocyte calcium ion homeostasis
    term:
      id: GO:0055074
      label: calcium ion homeostasis
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:27754757
    reference_title: "TRPV3 mutants causing Olmsted Syndrome induce impaired cell adhesion and nonfunctional lysosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRPV3 is one of the key ion channel involved in Ca2+-signaling in keratinocyte and thus involved in skin-related functions."
    explanation: Places TRPV3 as a principal calcium-signalling channel of keratinocytes, the cell in which the gain-of-function variants act.
  - reference: PMID:36063600
    reference_title: "Olmsted syndrome causing point mutants of TRPV3 (G568C and G568D) show defects in intracellular Ca(2+)-mobilization and induce lysosomal defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that G568C and G568D mutants most-likely act as Ca2+-leaky channels from lysosomes with different abilities."
    explanation: Two Olmsted syndrome variants also leak calcium from intracellular stores, extending the calcium-handling defect beyond the plasma membrane.
  downstream:
  - target: Keratinocyte Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Calcium overload through the constitutively open channel is cytotoxic to
      the cells expressing it.
    evidence:
    - reference: PMID:32795529
      reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These variant TRPV3 channels, in either homomeric or heteromeric form, exhibited differentially elevated basal open probability, increased voltage sensitivity, and cytotoxicity."
      explanation: Cytotoxicity of the expressed variant channels scales with their gain of function.
  - target: EGFR-mTOR Signaling Hyperactivation in Epidermis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TRPV3 forms a signalling complex with TGF-alpha/EGFR in keratinocytes, and
      TRPV3 channel activity stimulates TGF-alpha release, so constitutive
      channel activity transactivates EGFR.
    evidence:
    - reference: PMID:20403327
      reference_title: "TRP channel regulates EGFR signaling in hair morphogenesis and skin barrier formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Activation of EGFR leads to increased TRPV3 channel activity, which in turn stimulates TGF-alpha release."
      explanation: Establishes the feed-forward loop in keratinocytes by which TRPV3 activity drives release of the EGFR ligand TGF-alpha.
    - reference: PMID:31895432
      reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "In animal models and keratinocyte cell lines, TRPV3 signaling leads to epidermal growth factor receptor (EGFR) transactivation."
      explanation: The clinical series' background statement summarises the animal-model and keratinocyte-line evidence for the TRPV3-to-EGFR transactivation link that motivated erlotinib treatment; the sentence describes model evidence, not a human observation.
  - target: Keratinocyte-Driven Itch Signaling

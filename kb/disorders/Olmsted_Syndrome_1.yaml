clinical_trials:
- name: NCT07090889
  phase: PHASE_I
  status: RECRUITING
  description: >-
    First-in-human phase 1a/1b study of KM-023, an oral TRPV3 inhibitor:
    single and multiple ascending doses with a food-effect arm in healthy
    volunteers, followed by a 12-week open-label cohort of Olmsted syndrome
    patients assessing safety, pharmacokinetics, drug penetration into skin
    layers and keratoderma efficacy. No results are available.
  notes: >-
    The registry eligibility criteria require a confirmed TRPV3 or PERP
    variant with visible palmoplantar keratoderma, so the patient cohort may
    include PERP-related Olmsted syndrome 2 as well as this disease. Phase and
    status are as recorded on ClinicalTrials.gov on 2026-10-13.
  target_phenotypes:
  - preferred_term: Palmoplantar keratoderma
    term:
      id: HP:0000982
      label: Palmoplantar keratoderma
  evidence:
  - reference: clinicaltrials:NCT07090889
    reference_title: "A Combined Single and Multiple Ascending Dose Phase 1a/1b, Double-blind, Placebo-Controlled, and Food-effect Study to Evaluate the Safety and Pharmacokinetics of Oral KM-023 in Healthy Participants. Followed by a 3-month Open Label Study to Evaluate the Safety, Pharmacokinetics and Efficacy of Oral KM-023 in Olmsted Syndrome Patients"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Finally, the efficacy of KM-023 will be investigated in Olmsted Syndrome patients."
    explanation: Registry summary stating the efficacy objective in Olmsted syndrome patients.
  - reference: clinicaltrials:NCT07090889
    reference_title: "A Combined Single and Multiple Ascending Dose Phase 1a/1b, Double-blind, Placebo-Controlled, and Food-effect Study to Evaluate the Safety and Pharmacokinetics of Oral KM-023 in Healthy Participants. Followed by a 3-month Open Label Study to Evaluate the Safety, Pharmacokinetics and Efficacy of Oral KM-023 in Olmsted Syndrome Patients"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the second part of the trial, Olmsted Syndrome patients will take KM-023 twice daily, for a duration of 12 weeks."
    explanation: Design of the patient cohort.
discussions:
- discussion_id: os1_lysosomal_trafficking_hypothesis
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Do Olmsted syndrome TRPV3 variants injure keratinocytes through impaired
    channel trafficking and lysosomal dysfunction in addition to plasma-membrane
    calcium overload?
  attaches_to:
  - pathophysiology#Keratinocyte Calcium Overload
  - pathophysiology#Keratinocyte Apoptosis
  rationale: >-
    In heterologous expression, G573A/S/C and W692G variants are largely
    retained in the endoplasmic reticulum, reduce surface delivery of other
    membrane proteins, impair cell adhesion and reduce lysosome number, and
    G568C/G568D variants leak calcium from lysosomes and disturb lysosomal pH.
    These findings come from transfected non-keratinocyte cell lines and have
    not been confirmed in patient keratinocytes or skin.
  evidence:
  - reference: PMID:27754757
    reference_title: "TRPV3 mutants causing Olmsted Syndrome induce impaired cell adhesion and nonfunctional lysosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our qualitative and quantitative data suggests that these naturally occurring TRPV3 mutants are mainly restricted in the ER."
    explanation: ER retention of the Olmsted syndrome variants in expression systems.
  - reference: PMID:36063600
    reference_title: "Olmsted syndrome causing point mutants of TRPV3 (G568C and G568D) show defects in intracellular Ca(2+)-mobilization and induce lysosomal defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that OS-mutants cause defective pH-maintenance at the lysosomes."
    explanation: Lysosomal pH defect caused by two Olmsted syndrome variants.
  posed_by: dismech curation
  posed_date: "2026-10-13T00:00:00Z"
- discussion_id: os1_trpv3_antagonist_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can direct pharmacological inhibition of TRPV3 treat Olmsted syndrome 1, as
    an alternative or adjunct to EGFR inhibition?
  attaches_to:
  - pathophysiology#TRPV3 Gain-of-Function Channel Activation
  - treatments#Erlotinib
  - clinical_trials#NCT07090889
  rationale: >-
    Erlotinib acts one step downstream of the lesion, on EGFR transactivation,
    and does not address channel-driven calcium overload or keratinocyte itch
    signalling directly; a TRPV3 antagonist would target the initiating event.
    No result of TRPV3 antagonism in a patient has been published; a phase 1
    study of the oral TRPV3 inhibitor KM-023 (NCT07090889) with an open-label
    Olmsted syndrome cohort is recruiting.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The use of TRPV3 antagonists would represent such a targeted and potentially powerful strategy."
    explanation: The review proposes TRPV3 antagonism as the targeted strategy.
  - reference: PMID:22405088
    reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that TRPV3 plays essential roles in skin keratinization, hair growth, and possibly itching sensation in humans and selectively targeting TRPV3 could provide therapeutic potential for keratinization or itching-related skin disorders."
    explanation: The gene-discovery study proposes TRPV3 as a therapeutic target.
  posed_by: dismech curation
  posed_date: "2026-10-13T00:00:00Z"
- discussion_id: os1_recessive_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the channel-level mechanism of the rare recessive TRPV3 families,
    and does it differ from the dominant gain-of-function variants?
  attaches_to:
  - inheritance#Autosomal recessive inheritance
  - pathophysiology#TRPV3 Gain-of-Function Channel Activation
  rationale: >-
    Dominant disease is explained by constitutively open heteromeric channels,
    but a recessive mode implies that one wild-type allele suffices to prevent
    disease, which the simple gain-of-function model does not predict. The
    recessive report (PMID:24606194) is a letter without an abstract, so the
    recessive claim is carried by the review only.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutations in TRPV3 (Transient receptor potential vanilloid-3) gene have recently been identified as a cause of autosomal dominant (gain-of-function mutations) or recessive OS."
    explanation: The review attributes gain of function to the dominant variants and names recessive forms without a mechanism, which is the gap.
  posed_by: dismech curation
  posed_date: "2026-10-13T00:00:00Z"
- discussion_id: os1_immune_dysregulation_hypothesis
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Is immune dysregulation (hyper-IgE, eosinophilia, recurrent skin infection)
    a primary consequence of TRPV3 gain of function, or secondary to barrier
    failure and infection of the keratotic skin?
  attaches_to:
  - pathophysiology#Cutaneous Inflammation with Mast Cell Infiltration
  - phenotypes#Increased circulating IgE concentration
  - phenotypes#Eosinophilia
  - phenotypes#Recurrent skin infections
  rationale: >-
    A single profiled G573A patient had hyper-IgE, persistent eosinophilia,
    elevated circulating follicular helper T cells and frequent dermal
    infections. TRPV3 is also expressed by Langerhans cells, so a primary
    immunological contribution cannot be excluded, but barrier failure in
    fissured keratotic skin would produce the same picture secondarily. No
    cohort has been immunophenotyped.
  evidence:
  - reference: PMID:23692804
    reference_title: "Olmsted syndrome: exploration of the immunological phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The systemic phenotype of hyper IgE and persistent eosinophilia suggest a primary or secondary role of immunological processes in the pathogenesis of Olmsted syndrome, and have important clinical consequences with regard to the treatment of Olmsted syndrome patients."
    explanation: The authors' own statement of the open question.
  posed_by: dismech curation
  posed_date: "2026-10-13T00:00:00Z"
references:
- reference: PMID:25886873
  title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
- reference: PMID:24606194
  title: "Olmsted syndrome with erythromelalgia caused by recessive transient receptor potential vanilloid 3 mutations."
notes: >-
  No GeneReviews chapter covers Olmsted syndrome (the committed Bookshelf index
  and a PubMed "Olmsted syndrome[TI] AND genereviews[book]" search both return
  nothing), so the 2015 Orphanet Journal of Rare Diseases review (PMID:25886873)
  is the phenotype baseline. The Orphanet record (ORPHA:659) covers Olmsted
  syndrome of all genetic forms rather than the TRPV3 form, so its phenotype
  and epidemiology rows describe the parent concept. Disease occurrence and the
  inheritance patterns are likewise stated for Olmsted syndrome as a whole in
  the sources; the case counts therefore include MBTPS2 and molecularly
  unconfirmed cases.

classifications:
  harrisons_chapter:
  - classification_value: DERMATOLOGY
    notes: >-
      A keratinizing genodermatosis presenting with palmoplantar keratoderma and
      periorificial keratotic plaques; managed by dermatology.
    evidence:
    - reference: PMID:39469632
      reference_title: "Case report: Novel p.Val306Met missense mutation in TRPV3 in a case of Olmsted syndrome accompanied by squamous cell carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Olmsted syndrome (OS) is a rare congenital skin disorder, typically characterized by symmetrical, severe palmoplantar and periorificial keratoderma, often accompanied by alopecia, and onychodystrophy, with varying degrees of pruritus and pain."
      explanation: The disease is a skin disorder defined by cutaneous keratinization, hair and nail features, which places it in the dermatology chapter.
  channelopathy_category:
    classification_value: epithelial channelopathy
    notes: >-
      TRPV3 is a calcium-permeable cation channel expressed in epidermal
      keratinocytes, an epithelial cell type, and the disease arises from its
      constitutive activation. ChannelopathyOrganSystemEnum has no skin-specific
      value; of the four values, epithelial channelopathy is the one that names
      the affected tissue type rather than an unaffected organ system.
    evidence:
    - reference: PMID:32795529
      reference_title: "Genotype‒Phenotype Correlation of TRPV3-Related Olmsted Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "We have previously shown that gain-of-function variations in transient receptor potential vanilloid-3 (TRPV3) underlay Olmsted syndrome, a rare hyperkeratotic skin channelopathy."
      explanation: The disease is described as a skin channelopathy.
prevalence:
- population: Published literature, all genetic forms of Olmsted syndrome
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The 2015 review counted
    about 73 reported cases of Olmsted syndrome of all genetic forms (TRPV3,
    MBTPS2 and molecularly unconfirmed), so the TRPV3-specific count is smaller
    than this figure.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "About 73 cases have been reported worldwide."
    explanation: >-
      The systematic literature review gives the total number of Olmsted
      syndrome cases reported up to December 2014, establishing the disease as
      ultra-rare.
  - reference: PMID:24452206
    reference_title: "A new TRPV3 missense mutation in a patient with Olmsted syndrome and erythromelalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Approximately 50 cases have been reported, with the molecular basis described in only 9."
    explanation: >-
      An earlier count of reported cases, with the number that were molecularly
      confirmed; both figures place the disease in the ultra-rare band.
progression:
- phase: Onset in infancy or early childhood
  notes: >-
    Keratoderma usually begins at birth or in the first years of life and
    progresses thereafter; later-onset adult presentations have been reported
    with milder variants.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease starts usually at birth or in early childhood."
    explanation: Review statement of the usual age of onset.
  - reference: PMID:31895432
    reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Olmsted syndrome is a genodermatosis characterized by painful and mutilating palmoplantar keratoderma (PPK) that progresses from infancy onward and lacks an effective treatment."
    explanation: States that the keratoderma begins in infancy and is progressive.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Progressive keratoderma, pseudoainhum with autoamputation and intractable
    pain can prevent grasping and walking and confine patients to a wheelchair;
    erlotinib-treated patients had been wheelchair-bound with growth delay,
    anorexia, insomnia and depression before treatment.
  evidence:
  - reference: PMID:25886873
    reference_title: "Olmsted syndrome: clinical, molecular and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The disease is debilitating and progressive keratoderma and auto-amputation of digits can prevent patients from grasping and walking, and confine them to a wheelchair."
    explanation: Review statement of the functional burden.
  - reference: PMID:31895432
    reference_title: "Use of Epidermal Growth Factor Receptor Inhibitor Erlotinib to Treat Palmoplantar Keratoderma in Patients With Olmsted Syndrome Caused by TRPV3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients were confined to wheelchairs owing to intense pain and joint restrictions because of hyperkeratosis."
    explanation: Two of three TRPV3-confirmed patients were wheelchair-bound before erlotinib.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most cases are sporadic and carry a de novo heterozygous TRPV3 missense
    variant; familial transmission in an autosomal dominant pattern is also
    reported, including a three-generation family with a mild, partly
    nonpenetrant phenotype.
  evidence:
  - reference: PMID:22405088
    reference_title: "Exome sequencing reveals mutations in TRPV3 as a cause of Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing of case-parents trios, we have identified a de novo missense mutation in TRPV3 that produces p.Gly573Ser in an individual with OS."
    explanation: Trio exome sequencing established the de novo heterozygous origin of the first TRPV3 variant.
  - reference: PMID:24758389
    reference_title: "Olmsted syndrome in an Iranian boy with a new de novo mutation in TRPV3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Recently, pathogenic heterozygous mutations in TRPV3 were identified, with most cases showing de novo dominant inheritance."
    explanation: Summarises that heterozygous TRPV3 variants act dominantly and are mostly de novo.
  - reference: PMID:24452206
    reference_title: "A new TRPV3 missense mutation in a patient with Olmsted syndrome and erythromelalgia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Recently, TRPV3 (transient receptor potential vanilloid 3) mutations were identified in autosomal-dominant OS in 7 sporadic cases and 1 familial case, whereas an MBTPS2 (membrane-bound transcription factor protease, site 2) mutation was reported in X-linked recessive OS."
    explanation: Records the autosomal dominant pattern of TRPV3 disease, including one familial case, and separates it from the X-linked MBTPS2 form.
  - reference: PMID:26902751
    reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, TRPV3 sequencing results revealed an identical heterozygous mutation c.2016G > A in the proband, his mother and his maternal grandfather"
    explanation: Vertical transmission of a heterozygous TRPV3 variant through three generations, the autosomal dominant familial pattern.
  - reference: PMID:26902751
    reference_title: "A novel mutation in TRPV3 gene causes atypical familial Olmsted syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation we described was detected in a familial pedigree that presented with minor symptoms and whose clinical traits were partly nonpenetrant."
    explanation: Reduced penetrance and mild expression in this dominant family.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

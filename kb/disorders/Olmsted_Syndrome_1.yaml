    reference_title: "Targeted Inhibition of the Epidermal Growth Factor Receptor and Mammalian Target of Rapamycin Signaling Pathways in Olmsted Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oral sirolimus was administered to these 2 patients at a dosage of 0.8 mg/m2 twice daily, titrated to a goal trough whole-blood concentration of 10 to 15 ng/mL."

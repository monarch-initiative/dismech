animal_models:
- name: DS-Nh mouse (spontaneous Trpv3 Gly573Ser)
  species: Mouse
  genotype: Trpv3 Gly573Ser (Nh), heterozygous, autosomal dominant
  background: DS
  genes:
  - preferred_term: TRPV3
    term:
      id: hgnc:18084
      label: TRPV3
  publication: PMID:16858425
  description: >-
    Spontaneous hairless mutant carrying the same Gly573Ser substitution found
    in patients. Develops dominant hairlessness, spontaneous allergic and
    pruritic dermatitis with increased lesional mast cells, and scratching
    behaviour; it does not develop palmoplantar keratoderma.
  modeled_mechanisms:
  - target: Hair Follicle Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The patient G573S variant causes dominant hairlessness.
    limitations: >-
      Rodent hairlessness is complete, whereas human alopecia is variable; the
      mouse lacks the palmoplantar and periorificial keratoderma that define the
      human disease.
    readouts:
    - name: Hair coat
      target: Hair Follicle Dysfunction
      direction: ABOLISHED
      interpretation: Spontaneous hairlessness inherited with the Trpv3 variant.
      evidence:
      - reference: PMID:16858425
        reference_title: "Association of a mutation in TRPV3 with defective hair growth in rodents."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "DS-Nh mice and WBN/Kob-Ht rats are spontaneous hairless mutant rodent strains."
        explanation: The hairless phenotype of the strains.
    evidence:
    - reference: PMID:16858425
      reference_title: "Association of a mutation in TRPV3 with defective hair growth in rodents."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We concluded that TRPV3 was the gene responsible for Nh and Ht mutations, and that mutation in TRPV3 possibly correlated with increased mast cell numbers."
      explanation: Genetic identification of Trpv3 as the hairless gene.
  - target: Cutaneous Inflammation with Mast Cell Infiltration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Spontaneous dermatitis with increased lesional mast cells.
    limitations: >-
      The rodent dermatitis is allergic in character and depends on housing
      conditions and genetic background: the same variant re-derived on
      129S1/SvImJ and kept Staphylococcus aureus-free develops no dermatitis
      (PMID:35058747). Its relation to the inflammatory flares of patients is
      inferred.
    readouts:
    - name: Lesional mast cell count
      target: Cutaneous Inflammation with Mast Cell Infiltration
      direction: INCREASED
      interpretation: Increased mast cells in dermatitis lesions versus parental strains.
      evidence:
      - reference: PMID:16858425
        reference_title: "Association of a mutation in TRPV3 with defective hair growth in rodents."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histopathological analyses revealed that mast cells in skin lesions were increased in both rodents compared to their age-matched parent strains, and that this may partially be due to hairlessness and dermatitis."
        explanation: Histological measurement of mast cells.
    evidence:
    - reference: PMID:18754035
      reference_title: "Impact of the Gly573Ser substitution in TRPV3 on the development of allergic and pruritic dermatitis in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "DS-Nh mice also develop allergic and pruritic dermatitis."
      explanation: The dermatitis phenotype of the strain.
  - target: Keratinocyte-Driven Itch Signaling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Mice carrying the Nh variant scratch spontaneously, independently of dermatitis.
    limitations: >-
      Scratching behaviour is an organism-level proxy for itch; the keratinocyte
      signalling step is inferred rather than measured in this strain.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The readout is scratching bouts, standing in for keratinocyte-to-neuron
        itch signalling, which is the quantity the node describes.
    readouts:
    - name: Spontaneous scratching behaviour
      target: Keratinocyte-Driven Itch Signaling
      direction: INCREASED
      interpretation: Scratching develops separately from dermatitis in C57BL-Nh mice.
      evidence:
      - reference: PMID:18754035
        reference_title: "Impact of the Gly573Ser substitution in TRPV3 on the development of allergic and pruritic dermatitis in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, C57BL-Nh mice developed spontaneous scratching behavior, separately from the development of dermatitis."
        explanation: Behavioural measurement of itch.
    evidence:
    - reference: PMID:18754035
      reference_title: "Impact of the Gly573Ser substitution in TRPV3 on the development of allergic and pruritic dermatitis in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We propose that TRPV3(Gly573Ser) is a cause of pruritus and/or dermatitis associated with scratching, and suggest that TRPV3 may represent a therapeutic target in pruritic dermatitis."
      explanation: The authors attribute pruritus to the variant.
  evidence:
  - reference: PMID:16858425
    reference_title: "Association of a mutation in TRPV3 with defective hair growth in rodents."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "An amino-acid substitution at the same position in one gene was detected in DS-Nh mice and WBN/Kob-Ht rats: Gly573 to Ser (Nh mutation) or Gly573 to Cys (Ht mutation), located in the transient receptor potential (TRP) cation channel subfamily V member 3 (TRPV3) gene."
    explanation: Identity of the model's causal variant.
  notes: >-
    The WBN/Kob-Ht rat carries the paralogous Gly573Cys substitution (the
    patient G573C variant) with the same hairless and dermatitis phenotype
    (PMID:16858425); it is recorded here rather than as a separate model
    because the same publication characterises both strains together.

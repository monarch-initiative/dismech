name: Olmsted Syndrome 1
creation_date: '2026-10-13T08:45:00Z'
description: >-
  Olmsted syndrome 1 is the TRPV3-associated form of Olmsted syndrome, a rare
  keratinizing genodermatosis defined by bilateral, mutilating, transgredient
  palmoplantar keratoderma and periorificial keratotic plaques, typically with
  alopecia, nail dystrophy, severe pruritus and pain, and constricting digital
  bands (pseudoainhum) that can progress to autoamputation. Heterozygous missense
  variants in TRPV3, most often arising de novo, produce a constitutively open
  thermosensitive calcium-permeable cation channel in keratinocytes; rare families
  carry biallelic TRPV3 variants. Channel gain of function drives keratinocyte
  calcium overload, cytotoxicity, EGFR and mTOR pathway activation, epidermal
  hyperproliferation with hyperkeratosis, cutaneous inflammation and itch. The
  EGFR inhibitor erlotinib has produced clinical remission of the keratoderma and
  pain in treated patients. The X-linked MBTPS2 form (Olmsted syndrome, X-linked)
  and the PERP form (Olmsted syndrome 2) have different causal genes and
  mechanisms and are not covered by this entry.

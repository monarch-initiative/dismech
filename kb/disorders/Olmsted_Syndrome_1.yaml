- name: Trpv3 knockout mouse
  species: Mouse
  genotype: Trpv3 null (loss of function)
  genes:
  - preferred_term: TRPV3
    term:
      id: hgnc:18084
      label: TRPV3
  publication: PMID:20403327
  description: >-
    Loss-of-function model, the inverse of the human lesion: Trpv3-null mice
    have wavy hair and curly whiskers, the phenotype of TGF-alpha and EGFR
    loss-of-function mutants, and defective skin-barrier cornification. It
    establishes the TRPV3-TGF-alpha/EGFR axis that the gain-of-function
    variants overdrive.
  evidence:
  - reference: PMID:20403327
    reference_title: "TRP channel regulates EGFR signaling in hair morphogenesis and skin barrier formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unexpectedly, we found that mice lacking the Trpv3 gene also exhibit wavy hair coat and curly whiskers."
    explanation: The knockout phenotype that identified the EGFR-axis relationship.
  modeled_mechanisms:
  - target: EGFR-mTOR Signaling Hyperactivation in Epidermis
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    description: Removal of TRPV3 phenocopies reduced TGF-alpha/EGFR signalling in hair, the opposite direction to the disease.
    limitations: >-
      An inverse (loss-of-function) model; it demonstrates that TRPV3 sits in
      the EGFR axis but does not reproduce the hyperactivation of the disease.
    divergences:

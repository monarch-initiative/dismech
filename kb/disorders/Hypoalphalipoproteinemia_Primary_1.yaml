      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations were most frequent in LCAT (15.7%), followed by ABCA1 (9.0%) and APOA1 (4.5%)"
      explanation: >-
        Gives the share of low-HDL probands explained by ABCA1 mutations.
  variants:
  - name: P85L
    description: >-
      ABCA1(Alabama), c.254C>T p.Pro85Leu, a heterozygous missense variant
      that segregated with low HDL cholesterol in a kindred with premature
      coronary artery disease and was absent from over 400 control
      chromosomes.
    evidence:
    - reference: PMID:12204794
      reference_title: "ABCA1(Alabama): a novel variant associated with HDL deficiency and premature coronary artery disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The proband and affected individuals were heterozygotes for C254T with proline converted to leucine (P85L)."
      explanation: >-
        Identifies the heterozygous P85L variant in affected kindred members.
  - name: P1065S, G1216V, N1800H and R2144X
    description: >-
      Four loss-of-function ABCA1 variants carried heterozygously in the Danish
      general population, used to test whether genetically lowered HDL
      cholesterol raises ischemic heart disease risk.
    evidence:
    - reference: PMID:18523221
      reference_title: "Association of loss-of-function mutations in the ABCA1 gene with high-density lipoprotein cholesterol levels and risk of ischemic heart disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterozygotes vs noncarriers for 4 ABCA1 mutations (P1065S, G1216V, N1800H, R2144X) had HDL cholesterol levels of 41 mg/dL"
      explanation: >-
        Names the four variants and the reduced HDL cholesterol in carriers.
diagnosis:
- name: HDL cholesterol measurement with exclusion of secondary causes
  description: >-
    Low HDL cholesterol is first checked against the common secondary causes,
    such as hypertriglyceridemia, inflammation, poor glycemic control, liver
    disease and androgen use. Persistent low HDL without one of these prompts
    genetic testing.
  diagnosis_term:
    preferred_term: HDL cholesterol measurement
    term:
      id: NCIT:C105587
      label: High Density Lipoprotein Cholesterol Measurement
  results: Low HDL cholesterol and apoA-I with no secondary cause identified.
  evidence:
  - reference: PMID:30333156
    reference_title: "Genetic and secondary causes of severe HDL deficiency and cardiovascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We excluded 206 subjects (40.1%) with significant elevations of triglycerides, C-reactive protein, glycosylated hemoglobin, myeloperoxidase, or liver enzymes and men receiving testosterone."
    explanation: >-
      In a screen of 258,252 people, two in five with HDL cholesterol below
      20 mg/dL had a secondary cause and were excluded before sequencing.
- name: Genetic testing of ABCA1, APOA1 and LCAT
  description: >-
    Sequencing confirms a heterozygous ABCA1 loss-of-function variant. Testing
    APOA1 and LCAT in the same panel separates this disease from apoA-I and
    LCAT deficiency, which give a similar lipid profile.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A heterozygous pathogenic ABCA1 variant.
  evidence:
  - reference: PMID:27565770
    reference_title: "Diagnosis and treatment of high density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is marked variability in laboratory and clinical presentation, and DNA analysis is necessary for diagnosis."
    explanation: >-
      A review of marked HDL deficiency from APOA1, ABCA1 and LCAT defects
      states that DNA analysis is required to make the diagnosis.
  - reference: PMID:30333156
    reference_title: "Genetic and secondary causes of severe HDL deficiency and cardiovascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced 23 lipid-related genes in 201 (65.3%) of 308 eligible subjects."
    explanation: >-
      A multigene lipid panel was used after secondary causes were excluded;
      ABCA1 was the most frequently mutated gene (26.9%).
treatments:
- name: LDL-Lowering and Non-HDL Risk Factor Management
  description: >-
    No therapy corrects the ABCA1 defect. Management is directed at non-HDL
    cardiovascular risk factors, with statin-based LDL cholesterol lowering
    where indicated, rather than at raising HDL cholesterol. In a small
    observational comparison, carriers taking statins had lower arterial
    wall inflammation than carriers not taking statins.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
  target_mechanisms:
  - target: Arterial Wall Inflammation
    treatment_effect: INHIBITS
    description: >-
      Statin use was associated with lower arterial FDG uptake in carriers;
      this is an observational comparison of seven users and seven non-users.
    evidence:
    - reference: PMID:26109739
      reference_title: "Increased Systemic and Plaque Inflammation in ABCA1 Mutation Carriers With Attenuation by Statins."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In carriers using statins (n=7), target:background ratio was 21% reduced than in nonstatin users (n=7; P=0.03)."
      explanation: >-
        Non-randomized comparison within ABCA1 carriers.
  evidence:
  - reference: PMID:27565770
    reference_title: "Diagnosis and treatment of high density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Treatment should be directed at optimizing all non-HDL risk factors."
    explanation: >-
      Review of genetic HDL deficiency (including heterozygous ABCA1 defects)
      recommends targeting non-HDL risk factors.
- name: HDL Mimetic Infusion (CER-001)
  description: >-
    Infusion of the HDL mimetic CER-001 was tested in a randomized,
    placebo-controlled trial of familial hypoalphalipoproteinemia due to ABCA1
    and/or APOA1 loss-of-function variants (30 patients) and did not reduce
    carotid vessel wall area or arterial wall inflammation after 24 weeks.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No therapeutic_agent is bound: an OLS search of NCIT for "CER-001" returned
    no matching drug concept.
  evidence:
  - reference: PMID:32919280
    reference_title: "No benefit of HDL mimetic CER-001 on carotid atherosclerosis in patients with genetically determined very low HDL levels."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with genetically determined very low HDL-cholesterol, 24 weeks of treatment with HDL mimetic CER-001 did not reduce carotid vessel wall dimensions or arterial wall inflammation, compared with placebo."
    explanation: >-
      Negative randomized trial; the cohort combined ABCA1 and APOA1 carriers.
  - reference: PMID:32919280
    reference_title: "No benefit of HDL mimetic CER-001 on carotid atherosclerosis in patients with genetically determined very low HDL levels."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recruited patients with familial hypoalphalipoproteinemia (due to ABCA1 and/or APOA1 loss-of-function variants)"
    explanation: >-
      Establishes that the trial population included ABCA1-related familial
      hypoalphalipoproteinemia.
discussions:
- discussion_id: abca1_heterozygote_coronary_risk
  kind: CONTROVERSY
  prompt: >-
    Does heterozygous ABCA1 loss of function raise coronary artery disease
    risk, and if so, through low HDL cholesterol or through reduced cellular
    efflux and inflammation?
  attaches_to:
  - phenotypes#Premature coronary artery atherosclerosis
  - pathophysiology#Arterial Wall Inflammation
  rationale: >-
    Family-ascertained cohorts report more and earlier coronary disease, and
    risk concentrated in carriers with the lowest efflux or HDL cholesterol,
    while a Danish general-population study found no excess ischemic heart
    disease in carriers of four loss-of-function variants. Family cohorts may
    be enriched for carriers with premature disease and additional risk
    alleles, and the population study's variants may be milder.
  evidence:
  - reference: PMID:15019541
    reference_title: "Familial HDL deficiency due to ABCA1 gene mutations with or without other genetic lipoprotein disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there may be a selection bias in genotyping towards carriers of ABCA1 mutations who have pCAD possibly related to a combination of genetic and environmental cardiovascular risk factors"
    explanation: >-
      The authors raise ascertainment bias toward carriers with premature
      coronary disease and co-inherited risk factors.
  - reference: PMID:21875686
    reference_title: "Increased risk of coronary artery disease in Caucasians with extremely low HDL cholesterol due to mutations in ABCA1, APOA1, and LCAT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, individuals with mutations and large reductions in HDLc have increased risk of CAD."
    explanation: >-
      Suggests coronary risk is confined to carriers with large HDL cholesterol
      reductions.
differential_diagnoses:
- name: Tangier disease
  disease_term:
    preferred_term: Tangier disease
    term:
      id: MONDO:0008783
      label: Tangier disease
  description: >-
    The recessive allelic disorder caused by biallelic ABCA1 variants, with
    near-absent HDL cholesterol and apoA-I and systemic cholesteryl-ester
    storage.
  distinguishing_features:
  - Biallelic rather than monoallelic ABCA1 pathogenic variants.
  - Lymphoid cholesteryl-ester infiltration (orange tonsils, hepatosplenomegaly) and peripheral neuropathy are absent in familial HDL deficiency.
  - HDL cholesterol is near-absent in Tangier disease and roughly half-normal in heterozygous carriers.
  evidence:
  - reference: PMID:9888879
    reference_title: "Cellular cholesterol transport and efflux in fibroblasts are abnormal in subjects with familial HDL deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "FHD subjects have none of the clinical manifestations of Tangier disease (lymphoid tissue infiltration with cholesteryl esters and/or neurological manifestations)."
    explanation: >-
      Distinguishes familial HDL deficiency from Tangier disease by the absence
      of storage and neurological manifestations.
- name: LCAT deficiency
  disease_term:
    preferred_term: LCAT deficiency
    term:
      id: MONDO:0018999
      label: LCAT deficiency
  description: >-
    Familial LCAT deficiency and fish-eye disease are inherited causes of low
    HDL cholesterol, and in one proband series LCAT mutations were more common
    than ABCA1 mutations.
  distinguishing_features:
  - LCAT variants on sequencing; corneal opacification, and anemia and renal disease in complete LCAT deficiency.
  evidence:
  - reference: PMID:21875686
    reference_title: "Increased risk of coronary artery disease in Caucasians with extremely low HDL cholesterol due to mutations in ABCA1, APOA1, and LCAT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations were most frequent in LCAT (15.7%), followed by ABCA1 (9.0%) and APOA1 (4.5%)"
    explanation: >-
      LCAT and APOA1 mutations are alternative genetic explanations in low-HDL
      probands.
  - reference: PMID:27565770
    reference_title: "Diagnosis and treatment of high density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These patients may have homozygous, compound heterozygous, or heterozygous defects involving the APOAI, ABCA1, or LCAT genes."
    explanation: >-
      Review lists LCAT, APOA1 and ABCA1 defects as the genetic causes of
      marked HDL deficiency, which DNA analysis separates.
- name: Apolipoprotein A-I deficiency
  disease_term:
    preferred_term: apolipoprotein A-I deficiency
    term:
      id: MONDO:0700513
      label: apolipoprotein A-I deficiency
  description: >-
    Heterozygous APOA1 null or missense variants also give roughly half-normal
    HDL cholesterol and apoA-I, so the lipid profile alone does not separate
    them from ABCA1 carriers.
  distinguishing_features:
  - APOA1 variants on sequencing with normal ABCA1; cellular cholesterol efflux is not reduced by an ABCA1 defect.
  evidence:
  - reference: PMID:15019541
    reference_title: "Familial HDL deficiency due to ABCA1 gene mutations with or without other genetic lipoprotein disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "similar to the values found in heterozygotes for Apo A-I gene mutations which prevent Apo A-I synthesis"
    explanation: >-
      HDL cholesterol and apoA-I reductions in ABCA1 heterozygotes overlap with
      those of APOA1 null heterozygotes.
- name: Low HDL with non-ABCA1 cholesterol efflux defects
  description: >-
    Many people with low HDL cholesterol and reduced macrophage cholesterol
    efflux carry no ABCA1, APOA1 or LCAT mutation; a reduced efflux assay is
    not specific for ABCA1 disease.
  distinguishing_features:
  - No pathogenic ABCA1 variant despite reduced efflux; molecular testing is required.
  evidence:
  - reference: PMID:17303779
    reference_title: "Genetic etiology of isolated low HDL syndrome: incidence and heterogeneity of efflux defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Efflux defects are frequent in low HDL syndromes, but the majority of HDL deficient subjects with cellular cholesterol efflux defects do not harbor ABCA1 mutations, suggesting that novel pathways contribute to this phenotype."
    explanation: >-
      In 124 low-HDL subjects, most with efflux defects lacked ABCA1
      mutations.

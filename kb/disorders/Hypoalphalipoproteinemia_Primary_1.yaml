name: Hypoalphalipoproteinemia, Primary, 1
creation_date: '2026-10-27T12:14:04Z'
category: Mendelian
description: >-
  Hypoalphalipoproteinemia, primary, 1 (ABCA1-related familial HDL deficiency)
  is an autosomal dominant disorder of HDL biogenesis caused by a single
  pathogenic germline ABCA1 allele. Partial loss of ABCA1-mediated cholesterol
  and phospholipid efflux to lipid-poor apolipoprotein A-I limits nascent HDL
  formation, so carriers have roughly half-normal HDL cholesterol and
  apolipoprotein A-I, depletion of large alpha-migrating HDL particles, and
  often mildly raised triglycerides. Unlike the allelic recessive Tangier
  disease, carriers lack the cholesteryl-ester storage manifestations (orange
  tonsils, hepatosplenomegaly, neuropathy). Family-based cohorts report
  increased carotid intima-media thickness, arterial wall inflammation and
  premature coronary artery disease, whereas a large population study found no
  excess ischemic heart disease in heterozygous carriers, so the vascular risk
  is variable and contested.
disease_term:
  preferred_term: hypoalphalipoproteinemia, primary, 1
  term:
    id: MONDO:0011393
    label: hypoalphalipoproteinemia, primary, 1
synonyms:
- HDL deficiency, familial, 1
- hypoalphalipoproteinemia, familial
- familial HDL deficiency
- familial hypoalphalipoproteinemia
parents:
- Hypoalphalipoproteinemia
notes: >-
  Allelic with Tangier disease (MONDO:0008783): one pathogenic ABCA1 allele
  gives this dominant biochemical disorder, two give Tangier disease. MONDO
  places this term under apolipoprotein A-I deficiency (MONDO:0700513), an
  APOA1-defined class, although the causal gene asserted for this term is
  ABCA1. The literature term "familial hypoalphalipoproteinemia" is also
  applied to low-HDL kindreds with APOA1 or LCAT variants, so older family
  studies without genotyping cannot be assigned to this entry. The committed
  ClinGen gene-disease validity export (cache/clingen/gene_validity.csv) holds
  no ABCA1 record, so no validity tier is recorded here. No GeneReviews
  chapter is titled for this disease or its synonyms (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title search); the Tangier disease
  chapter covers the biallelic disorder.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single pathogenic ABCA1 allele produces the low-HDL phenotype and
    segregates with low HDL cholesterol in kindreds; inheritance of two
    pathogenic alleles causes the recessive allelic disorder Tangier disease.
  evidence:
  - reference: PMID:9888879
    reference_title: "Cellular cholesterol transport and efflux in fibroblasts are abnormal in subjects with familial HDL deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Unlike Tangier disease, FHD is transmitted as an autosomal dominant trait."
    explanation: >-
      The fibroblast study's background states the dominant transmission of
      familial HDL deficiency, contrasting it with recessive Tangier disease.
  - reference: PMID:11086027
    reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a dominantly inherited form of familial hypoalphalipoproteinemia (FHA) associated with reduced cholesterol efflux"
    explanation: >-
      Describes ABCA1-related FHA as dominantly inherited, in a study of 77
      heterozygotes from 11 families.
  - reference: PMID:10533863
    reference_title: "Mutations in the ABC1 gene in familial HDL deficiency with defective cholesterol efflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each mutation segregated with low concentrations of HDL-cholesterol in the family, and was not observed in more than 500 control chromosomes tested."
    explanation: >-
      Segregation of single ABCA1 mutations with low HDL cholesterol in four
      kindreds supports dominant transmission of the biochemical phenotype.
pathophysiology:
- name: ABCA1 Heterozygous Loss of Function
  description: >-
    A heterozygous germline ABCA1 variant (missense, nonsense, frameshift or
    splice) reduces the amount or activity of the ATP-binding cassette
    transporter that loads lipid-poor apolipoprotein A-I with cellular
    phospholipid and cholesterol. Missense variants differ in how severely they
    impair trafficking, apoA-I binding and efflux, and that severity tracks the
    lipid phenotype.
  biological_scale: MOLECULAR
  gene:
    preferred_term: ABCA1
    term:
      id: hgnc:29
      label: ABCA1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      One pathogenic allele with the other allele intact; biallelic loss
      causes Tangier disease instead.
  molecular_functions:
  - preferred_term: ATPase-coupled transmembrane transporter activity
    term:
      id: GO:0042626
      label: ATPase-coupled transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:10431236
    reference_title: "Mutations in ABC1 in Tangier disease and familial high-density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ABC1 were detected in both TD and FHA, indicating that TD and FHA are allelic."
    explanation: >-
      Linkage and mutation detection place familial HDL deficiency at the
      ABCA1 (ABC1) locus, allelic with Tangier disease.
  - reference: PMID:10533863
    reference_title: "Mutations in the ABC1 gene in familial HDL deficiency with defective cholesterol efflux."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data show that mutations in ABC1 are the major cause of familial HDL deficiency associated with defective cholesterol efflux, and that CERP has an essential role in the formation of HDL."
    explanation: >-
      Independent kindreds identify ABCA1 mutations as the cause of familial
      HDL deficiency with defective efflux.
  - reference: PMID:12204794
    reference_title: "ABCA1(Alabama): a novel variant associated with HDL deficiency and premature coronary artery disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm recent data that a single defective allele in ABCA1 may be associated with reduced HDL cholesterol and FHA."
    explanation: >-
      A heterozygous P85L kindred supports a single defective ABCA1 allele as
      sufficient for the low-HDL phenotype.
  - reference: PMID:16873719
    reference_title: "Specific mutations in ABCA1 have discrete effects on ABCA1 function and lipid phenotypes both in vivo and in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we determined that the phenotypes of patients correlate with the severity and nature of defects in ABCA1 function."
    explanation: >-
      Fifteen patient missense variants expressed in vitro show that the degree
      of ABCA1 functional impairment tracks the patients' lipid phenotypes.
  - reference: PMID:38052254
    reference_title: "Functional characterization of missense variants affecting the extracellular domains of ABCA1 using a fluorescence-based assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Among these, only 12 variants showed a distinct loss-of-function phenotype, asserting their direct association with severe HDL disorders."
    explanation: >-
      Of 51 extracellular-domain missense variants tested in HEK293 cells, a
      minority were clearly loss of function, so a reported ABCA1 missense
      variant is not by itself evidence of reduced function.
  downstream:
  - target: Reduced Cellular Cholesterol and Phospholipid Efflux
    causal_link_type: DIRECT
    description: >-
      Reduced functional ABCA1 lowers apolipoprotein A-I-mediated export of
      cellular cholesterol and phospholipid.
    evidence:
    - reference: PMID:10533863
      reference_title: "Mutations in the ABC1 gene in familial HDL deficiency with defective cholesterol efflux."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fibroblasts from the proband of each family were defective in cellular cholesterol efflux."
      explanation: >-
        Probands carrying single ABCA1 mutations had defective fibroblast
        cholesterol efflux.
- name: Reduced Cellular Cholesterol and Phospholipid Efflux
  description: >-
    ApoA-I-mediated cholesterol and phosphatidylcholine efflux is reduced to
    roughly half of normal in carrier cells (fibroblasts, macrophages), a
    partial defect compared with the near-absent efflux of Tangier disease.
    Residual efflux correlates with HDL cholesterol and with arterial-wall
    measures across carriers.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: cholesterol efflux
    term:
      id: GO:0033344
      label: cholesterol efflux
    modifier: DECREASED
  - preferred_term: phospholipid efflux
    term:
      id: GO:0033700
      label: phospholipid efflux
    modifier: DECREASED
  evidence:
  - reference: PMID:9888879
    reference_title: "Cellular cholesterol transport and efflux in fibroblasts are abnormal in subjects with familial HDL deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FHD cells displayed an approximately 25% reduction in HDL3-mediated cellular cholesterol efflux and an approximately 50% to 80% reduction in apoA-I-mediated cholesterol and phosphatidylcholine efflux compared with normal cells."
    explanation: >-
      Fibroblasts from familial HDL deficiency subjects show the partial apoA-I
      efflux defect. The study predates genotyping, so the ABCA1 attribution
      rests on the same group's later mutation report (PMID:10533863).
  - reference: PMID:27565770
    reference_title: "Diagnosis and treatment of high density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "heterozygotes had a lack of large α-1 and α-2 HDL particles, normal preβ-1 HDL, and only 50% of normal cellular cholesterol efflux"
    explanation: >-
      Review summarizing the authors' studies of Tangier heterozygotes, giving
      about half-normal cellular cholesterol efflux.
  downstream:
  - target: Impaired HDL Particle Assembly
    causal_link_type: DIRECT
    description: >-
      Less cholesterol and phospholipid is transferred to lipid-poor apoA-I,
      limiting formation and maturation of HDL particles.
    evidence:
    - reference: PMID:10533863
      reference_title: "Mutations in the ABC1 gene in familial HDL deficiency with defective cholesterol efflux."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data show that mutations in ABC1 are the major cause of familial HDL deficiency associated with defective cholesterol efflux, and that CERP has an essential role in the formation of HDL."
      explanation: >-
        The authors conclude from the efflux-defective kindreds that the ABCA1
        efflux step is essential for HDL formation.
  - target: Arterial Wall Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ABCA1-deficient macrophages show increased inflammatory gene expression;
      carriers have raised arterial FDG uptake and circulating cytokines.
    evidence:
    - reference: PMID:26109739
      reference_title: "Increased Systemic and Plaque Inflammation in ABCA1 Mutation Carriers With Attenuation by Statins."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Additional studies in THP-1 macrophages showed that both ABCA1 deficiency and lipoprotein-deficient plasma from ABCA1 mutation carriers increased inflammatory gene expression."
      explanation: >-
        Cell-line experiments link ABCA1 deficiency to a proinflammatory
        macrophage state; the intervening steps in carriers are not resolved.
  - target: Increased carotid artery intimal medial thickness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lower apoA-I- and HDL-mediated efflux is associated with greater carotid
      intima-media thickness among ABCA1 mutation carriers.
    evidence:
    - reference: PMID:11809185
      reference_title: "Association between increased arterial-wall thickness and impairment in ABCA1-driven cholesterol efflux: an observational study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "negative correlations between apolipoprotein-AI-mediated (r=-0.61, p=0.030) and HDL-particle-mediated (r=-0.60, p=0.018) efflux and intima-media thickness in the ABCA1 mutation carriers."
      explanation: >-
        Observational correlation between residual efflux and arterial-wall
        thickness in carriers; it does not by itself establish causation.
  - target: Premature coronary artery atherosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In family-based cohorts, carriers with lower residual efflux more often
      have coronary artery disease.
    evidence:
    - reference: PMID:11086027
      reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CAD is more frequent in those heterozygotes with lower cholesterol efflux values."
      explanation: >-
        Within 77 heterozygotes, coronary disease concentrated in those with the
        lowest residual efflux.
- name: Impaired HDL Particle Assembly
  description: >-
    Poorly lipidated apoA-I forms fewer mature particles: carriers are depleted
    of large alpha- and pre-alpha-migrating HDL while small pre-beta-1 HDL is
    preserved, and poorly lipidated apoA-I is cleared faster from plasma.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: high-density lipoprotein particle assembly
    term:
      id: GO:0034380
      label: high-density lipoprotein particle assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:12679198
    reference_title: "High-density lipoprotein subpopulations in pathologic conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tangier heterozygotes are severely depleted in the larger alpha- and pre-alpha-mobility subspecies."
    explanation: >-
      HDL subpopulation profiling shows that heterozygous ABCA1 carriers lack
      the larger, mature HDL subspecies.
  - reference: PMID:27565770
    reference_title: "Diagnosis and treatment of high density lipoprotein deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "heterozygotes had a lack of large α-1 and α-2 HDL particles, normal preβ-1 HDL, and only 50% of normal cellular cholesterol efflux"
    explanation: >-
      Preserved pre-beta-1 HDL with loss of large alpha HDL indicates a defect
      in particle maturation after initial apoA-I release.
  notes: >-
    Hepatocytes are bound because hepatic ABCA1 is the main source of plasma
    HDL; the cited carrier studies measured plasma particles, not hepatocytes,
    and the hepatocyte requirement for nascent HDL was shown in Tangier
    patient-derived hepatocyte-like cells (PMID:28330813), which model
    biallelic deficiency.
  downstream:
  - target: Decreased HDL cholesterol concentration
    causal_link_type: DIRECT
    description: >-
      Reduced HDL formation lowers plasma HDL cholesterol in proportion to the
      residual efflux.
    evidence:
    - reference: PMID:11086027
      reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Levels of cholesterol efflux are highly correlated with HDL-C levels, accounting for 82% of its variation."
      explanation: >-
        Residual ABCA1-mediated efflux explains most of the variation in HDL
        cholesterol among heterozygotes.
  - target: Decreased circulating apolipoprotein A-I concentration
    causal_link_type: DIRECT
    description: >-
      Fewer mature HDL particles and faster clearance of poorly lipidated apoA-I
      lower plasma apoA-I.
    evidence:
    - reference: PMID:15019541
      reference_title: "Familial HDL deficiency due to ABCA1 gene mutations with or without other genetic lipoprotein disorders."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Plasma HDL-C and Apo A-I values in these subjects were 38.3 and 36.9% lower than in unaffected family members and similar to the values found in heterozygotes for Apo A-I gene mutations which prevent Apo A-I synthesis."
      explanation: >-
        ABCA1 heterozygotes lower apoA-I as much as carriers who cannot make
        apoA-I at all, which fits apoA-I being lost through failed HDL
        formation rather than reduced synthesis. The step from particle
        assembly to plasma apoA-I is inferred, not measured directly.
- name: Arterial Wall Inflammation
  description: >-
    Heterozygous carriers show raised arterial 18F-FDG uptake and increased
    circulating TNF-alpha, MCP-1 and IL-6, with increased TNF-alpha mRNA in
    monocytes, consistent with a proinflammatory state that may contribute to
    atherogenesis. Statin users among carriers had lower arterial FDG uptake.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:26109739
    reference_title: "Increased Systemic and Plaque Inflammation in ABCA1 Mutation Carriers With Attenuation by Statins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous ABCA1 mutation carriers had a 20% higher target:background ratio than in controls (target:background ratio; P=0.008)."
    explanation: >-
      FDG-PET/CT shows increased arterial wall inflammation in heterozygous
      carriers (31 heterozygous carriers studied, imaging in a subset).
  - reference: PMID:26109739
    reference_title: "Increased Systemic and Plaque Inflammation in ABCA1 Mutation Carriers With Attenuation by Statins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only TNFα mRNA was increased in monocytes from heterozygous ABCA1 mutation carriers."
    explanation: >-
      Monocytes from heterozygous carriers show a limited proinflammatory
      transcriptional change.
  downstream:
  - target: Premature coronary artery atherosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A proinflammatory effect of ABCA1 deficiency is proposed to contribute
      to atherogenesis; this rests on mouse data and has not been shown to
      mediate coronary disease in human carriers.
    evidence:
    - reference: PMID:26109739
      reference_title: "Increased Systemic and Plaque Inflammation in ABCA1 Mutation Carriers With Attenuation by Statins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: "More recently, a proinflammatory effect of Abca1 deficiency was shown in mice, potentially contributing to atherogenesis."
      explanation: >-
        Background statement of mouse findings motivating the human study; the
        link to clinical coronary disease is a hypothesis.
phenotypes:
- name: Decreased HDL cholesterol concentration
  category: Biochemical
  description: >-
    Plasma HDL cholesterol is typically about half of normal and often below
    the fifth percentile for age and sex. Age modifies the phenotype in
    heterozygotes, and not every carrier falls below population thresholds.
  phenotype_term:
    preferred_term: Decreased HDL cholesterol concentration
    term:
      id: HP:0003233
      label: Decreased HDL cholesterol concentration
  evidence:
  - reference: PMID:11086027
    reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ABCA1 heterozygotes have decreased HDL cholesterol (HDL-C) and increased triglycerides."
    explanation: >-
      Family cohort of 77 heterozygotes documents reduced HDL cholesterol.
  - reference: PMID:11086027
    reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age is an important modifier of the phenotype in heterozygotes"
    explanation: >-
      The HDL phenotype in heterozygotes varies with age.
  - reference: PMID:9888879
    reference_title: "Cellular cholesterol transport and efflux in fibroblasts are abnormal in subjects with familial HDL deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "characterized by a severe decrease in the plasma HDL cholesterol (-C) level (less than the fifth percentile)"
    explanation: >-
      Defines familial HDL deficiency by HDL cholesterol below the fifth
      percentile.
  - reference: PMID:19765707
    reference_title: "Tangier disease caused by compound heterozygosity for ABCA1 mutations R282X and Y1532C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relatives who were heterozygous for one of these mutations, had about half-normal HDL cholesterol levels."
    explanation: >-
      Heterozygous relatives of a Tangier proband have about half-normal HDL
      cholesterol.
  - reference: PMID:18523221
    reference_title: "Association of loss-of-function mutations in the ABCA1 gene with high-density lipoprotein cholesterol levels and risk of ischemic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corresponding to a reduction in HDL cholesterol of 17 mg/dL (P < .001)"
    explanation: >-
      In Danish general-population studies, heterozygotes for four
      loss-of-function ABCA1 variants had HDL cholesterol 17 mg/dL lower than
      noncarriers (109 heterozygotes across the combined studies).
- name: Decreased circulating apolipoprotein A-I concentration
  category: Biochemical
  phenotype_term:
    preferred_term: Decreased circulating apolipoprotein A-I concentration
    term:
      id: HP:0031799
      label: Decreased circulating apolipoprotein A-I concentration
  evidence:
  - reference: PMID:15019541
    reference_title: "Familial HDL deficiency due to ABCA1 gene mutations with or without other genetic lipoprotein disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma HDL-C and Apo A-I values in these subjects were 38.3 and 36.9% lower than in unaffected family members"
    explanation: >-
      Seventeen heterozygous relatives had apoA-I about 37% lower than
      unaffected family members.
- name: Hypertriglyceridemia
  category: Biochemical
  description: >-
    Triglycerides are raised on average in heterozygous carriers relative to
    unaffected relatives; the elevation is usually mild and not universal.
  phenotype_term:
    preferred_term: Hypertriglyceridemia
    term:
      id: HP:0002155
      label: Hypertriglyceridemia
  evidence:
  - reference: PMID:11086027
    reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ABCA1 heterozygotes have decreased HDL cholesterol (HDL-C) and increased triglycerides."
    explanation: >-
      Family cohort of 77 heterozygotes reports increased triglycerides.
- name: Increased carotid artery intimal medial thickness
  category: Cardiovascular
  description: >-
    Carriers reach the upper limit of normal carotid intima-media thickness
    about 25 years earlier than controls.
  phenotype_term:
    preferred_term: Increased carotid artery intimal medial thickness
    term:
      id: HP:0012273
      label: Increased carotid artery intimal medial thickness
  evidence:
  - reference: PMID:11809185
    reference_title: "Association between increased arterial-wall thickness and impairment in ABCA1-driven cholesterol efflux: an observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An intima-media thickness at the upper limit of normal (0.80 mm) was reached by age 55 years in the ABCA1 heterozygotes, and at age 80 years in unaffected controls (p<0.0001)."
    explanation: >-
      B-mode ultrasound in 30 individuals from ABCA1 families and 110 matched
      controls shows earlier carotid wall thickening in heterozygotes.
- name: Premature coronary artery atherosclerosis
  category: Cardiovascular
  description: >-
    Family-based cohorts report coronary artery disease more often and at an
    earlier age in heterozygous carriers, concentrated among those with the
    lowest HDL cholesterol or residual efflux. A Danish general-population
    study of 109 heterozygotes for four loss-of-function variants found no
    increased ischemic heart disease, so penetrance is incomplete and the
    magnitude of risk is unsettled.
  phenotype_term:
    preferred_term: Premature coronary artery atherosclerosis
    term:
      id: HP:0005181
      label: Premature coronary artery atherosclerosis
  evidence:
  - reference: PMID:11086027
    reference_title: "Age and residual cholesterol efflux affect HDL cholesterol levels and coronary artery disease in ABCA1 heterozygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ABCA1 heterozygotes display a greater than threefold increase in the frequency of coronary artery disease (CAD), with earlier onset than unaffected family members."
    explanation: >-
      Family cohort of 77 heterozygotes reports more frequent and earlier
      coronary artery disease than in unaffected relatives.
  - reference: PMID:30333156
    reference_title: "Genetic and secondary causes of severe HDL deficiency and cardiovascular disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atherosclerotic cardiovascular disease (ASCVD) prevalence rates in the ABCA1, LCAT, APOA1, LPL, and mutation-negative groups were 37.0%, 4.0%, 40.0%, 11.1%, and 6.4%, respectively."
    explanation: >-
      Among people with HDL cholesterol below 20 mg/dL, the ABCA1 group had a
      high ASCVD prevalence; that group mixes heterozygotes with homozygous,
      compound heterozygous and common-variant carriers.
  - reference: PMID:18523221
    reference_title: "Association of loss-of-function mutations in the ABCA1 gene with high-density lipoprotein cholesterol levels and risk of ischemic heart disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Lower plasma levels of HDL cholesterol due to heterozygosity for loss-of-function mutations in ABCA1 were not associated with an increased risk of IHD."
    explanation: >-
      Danish population studies (41,961 individuals, 109 heterozygotes) found
      no increase in ischemic heart disease in heterozygous carriers, against
      the family-cohort findings.

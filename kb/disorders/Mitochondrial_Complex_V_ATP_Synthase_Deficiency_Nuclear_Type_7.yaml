diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: Exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    All reported patients were diagnosed by exome sequencing. Because
    c.87+3A>G lies outside the canonical splice site and was reported as a
    variant of uncertain significance, functional studies of splicing and of
    complex V in fibroblasts support the interpretation.
  evidence:
  - reference: PMID:35621276
    reference_title: "A homozygous splice variant in ATP5PO, disrupts mitochondrial complex V function and causes Leigh syndrome in two unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified a rare homozygous splice variant (c.87+3A>G) in ATP5PO, the complex V subunit which encodes the oligomycin sensitivity conferring protein, in three individuals from two unrelated families, with clinical suspicion of a mitochondrial disorder."
    explanation: Exome sequencing identified the variant in the first two families.
  - reference: PMID:40913360
    reference_title: "Mitochondrial Complex V Deficiency Caused by a Homozygous Splice Variant in ATP5PO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She passed away at 4 months of age, and whole-exome sequencing revealed a homozygous splice variant (c.87 + 3A > G; p?) in ATP5PO."
    explanation: Exome sequencing made the diagnosis in the 2026 patient.
- name: Complex V activity assay in cultured skin fibroblasts
  diagnosis_term:
    preferred_term: Skin biopsy for fibroblast culture
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Oligomycin-sensitive ATP hydrolysis measured in cultured skin fibroblasts
    shows the isolated complex V deficiency. The assay detected every
    nuclear-encoded complex V deficiency in a validation series that included
    an ATP5PO cell line.
  evidence:
  - reference: PMID:41124875
    reference_title: "Clinical utility of the ATP hydrolysis assay for the diagnosis of complex V deficiency in cultured skin fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This assay was able to identify all nuclear DNA-encoded complex V deficiencies, whereas a decrease in complex V activity was observed in some patient cell lines with combined deficiencies."
    explanation: Diagnostic performance of the fibroblast ATPase assay for nuclear complex V defects.
treatments:
- name: Supportive and symptomatic care
  therapeutic_modality: OTHER
  description: >-
    No disease-specific therapy exists. Care is supportive: respiratory
    support, management of acidosis and seizures, and cardiac care.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, the therapy remains largely symptomatic, although, in many cases, it is crucial for the survival and quality of life of the patients."
    explanation: The 2024 systematic review of isolated ATP synthase defects states that treatment is symptomatic.
differential_diagnoses:
- name: TMEM70-related complex V deficiency (MC5DN2)
  description: >-
    The common nuclear cause of isolated complex V deficiency, also presenting
    in the newborn with hypertrophic cardiomyopathy, lactic acidosis and
    hypospadias in boys, but with prominent hyperammonaemia and
    3-methylglutaconic aciduria, and with survivors who stabilise.
  distinguishing_features:
  - Biallelic TMEM70 rather than ATP5PO variants
  - Assembly factor rather than structural subunit defect
- name: Other nuclear complex V subunit disorders (ATP5F1A, ATP5F1D, ATP5F1E, ATP5MK)
  description: >-
    Ultra-rare disorders of other structural subunits, with isolated complex V
    deficiency, separated by the gene involved.
  distinguishing_features:
  - The specific ATP synthase subunit gene
- name: MT-ATP6 and MT-ATP8 related disorders
  description: >-
    The mitochondrial-genome diseases of the same enzyme, including maternally
    inherited Leigh syndrome, with maternal transmission and
    heteroplasmy-dependent severity.
  distinguishing_features:
  - Pathogenic mtDNA variant with maternal transmission
notes: >-
  No GeneReviews chapter covers ATP5PO or this disease; the phenotype set comes
  from the three primary reports (PMID:35621276, PMID:34954817,
  PMID:40913360), which together describe all five known patients. A 2025
  exome study of fetal intracranial haemorrhage listed ATP5PO among candidate
  genes for that finding (PMID:39763161), and one patient in the two-family
  report had old bilateral frontal and parietal haemorrhages on MRI; neither
  establishes haemorrhage as a feature, so it is not recorded as a phenotype.
  The MONDO term has no exact synonyms; MC5DN7 comes from the Disease
  Ontology cross-reference (DOID:0070464).

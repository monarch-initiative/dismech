      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ATP5PO variants: homozygous c.87+3A>G in three families, two of
    them consanguineous, and compound heterozygosity for a maternal nonsense
    allele and a paternal splice allele in the fourth. ATP5PO is autosomal
    (21q22.11), so transmission is nuclear recessive.

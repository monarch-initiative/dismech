genetic:
- name: ATP5PO
  notes: >-
    ATP5PO (21q22.11; previous symbol ATP5O) encodes OSCP. Two genotypes are
    reported. The splice-region variant c.87+3A>G (NM_001697.3) was found
    homozygous in three families; haplotype analysis showed it arose
    independently in the first two, and it causes skipping of exon 2 with some
    residual normal transcript. The second genotype combines c.34C>T
    (p.Gln12*) with c.329-20A>G, which causes skipping of exon 5 or of exons 4
    and 5. ClinGen classifies ATP5PO as Strong (autosomal recessive) for the
    lumped concept mitochondrial disease (MONDO:0044970, 2024), which is not
    this entry's MONDO:0957255, so no tier is recorded under
    gene_disease_validity; CAUSATIVE rests on four unrelated families with
    biallelic variants, fibroblast assembly and activity studies, and the yeast
    complementation result. The 2026 report still describes c.87+3A>G as a
    variant of uncertain significance, so no clinical_significance is recorded
    for it here.

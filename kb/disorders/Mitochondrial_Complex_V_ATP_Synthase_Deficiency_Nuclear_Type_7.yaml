    reference_title: "A homozygous splice variant in ATP5PO, disrupts mitochondrial complex V function and causes Leigh syndrome in two unrelated families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified a rare homozygous splice variant (c.87+3A>G) in ATP5PO, the complex V subunit which encodes the oligomycin sensitivity conferring protein, in three individuals from two unrelated families, with clinical suspicion of a mitochondrial disorder."
    explanation: Homozygosity for the same variant in affected individuals of two unrelated families.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One individual (patient 4) was found to have biallelic, compound-heterozygous variants in ATP5PO: a maternally inherited c.34C>T (p.Gln12*) nonsense variant; and a paternally inherited extended splice-site mutation, c.329-20A>G (Figure 3a)."
    explanation: Biallelic variants with one allele from each parent, the recessive configuration.
  - reference: PMID:40913360
    reference_title: "Mitochondrial Complex V Deficiency Caused by a Homozygous Splice Variant in ATP5PO."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

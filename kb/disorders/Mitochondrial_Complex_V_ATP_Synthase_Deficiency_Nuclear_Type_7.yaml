name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 7
creation_date: "2026-11-27T13:46:14Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 7
  term:
    id: MONDO:0957255
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 7
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 7 (MC5DN7) is
  the recessive disorder caused by biallelic variants in ATP5PO, the nuclear
  gene for the oligomycin sensitivity conferring protein (OSCP). OSCP is the
  subunit of the peripheral stalk that sits on top of the catalytic F1 head and
  joins it to the stator, so that the rotating central stalk can drive ATP
  synthesis instead of turning the alpha3beta3 head with it.

  Five patients from four families have been reported. Three carry the same
  homozygous splice variant, c.87+3A>G, which arose independently in a Moroccan
  and a Turkish family and was later found in a third consanguineous family; it
  skips exon 2 and removes part of the mitochondrial targeting sequence, while
  leaving a little normal transcript. The fourth family's patient is compound
  heterozygous for a nonsense allele and a deep splice allele. Patient
  fibroblasts have little OSCP, reduced levels of the other stalk subunits, F1
  intermediates in place of the holoenzyme, and an oligomycin-sensitive ATPase
  activity of 14-35 percent of control. Exon-2-deleted human OSCP cannot replace
  the yeast orthologue.

  The clinical picture is a severe infantile, multisystem disease. Growth
  restriction and cardiac hypertrophy can be seen before birth, and most
  neonates needed respiratory support. Hypotonia, developmental delay, progressive
  hypertrophic cardiomyopathy, lactic acidosis and an epileptic encephalopathy
  follow, with progressive cerebral atrophy, white matter abnormalities and, in
  one patient, basal ganglia lesions typical of Leigh syndrome. Three of the
  five died before seven months of age, one died at six years after
  neurological regression, and one was alive at three years.

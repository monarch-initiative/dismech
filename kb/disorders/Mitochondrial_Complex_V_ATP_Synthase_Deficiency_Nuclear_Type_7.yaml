pathophysiology:
- name: Biallelic Hypomorphic Loss of ATP5PO (OSCP)
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    OSCP sits on top of the F1 head and makes contacts with both F1 and the
    peripheral stalk, coupling Fo to F1. The reported alleles reduce rather
    than abolish it: c.87+3A>G skips exon 2, which encodes part of the
    mitochondrial transit peptide, so little OSCP reaches the mitochondrion,
    yet some normal transcript remains; the compound heterozygous patient
    carries a nonsense allele with a splice allele that lowers ATP5PO mRNA. Exon-2-deleted human
    OSCP fails to support respiratory growth of yeast lacking the orthologue.
  genes:
  - preferred_term: ATP5PO
    term:
      id: hgnc:850
      label: ATP5PO
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Biallelic germline alleles, homozygous splice-region or compound
      heterozygous nonsense plus splice. Recorded as partial loss of function
      because the c.87+3A>G allele leaves residual normal transcript and
      reduces, but does not eliminate, ATP5PO protein and complex V activity.
  molecular_functions:
  - preferred_term: OSCP contribution to rotary ATP synthase activity (peripheral stalk coupling of F1 to Fo)
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
  evidence:
  - reference: PMID:24786291
    reference_title: "The oligomycin-sensitivity conferring protein of mitochondrial ATP synthase: emerging new roles in mitochondrial pathophysiology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Located on top of the catalytic F1 sector, it makes stable contacts with both F1 and the peripheral stalk, ensuring the structural and functional coupling between F(O) and F1, which is disrupted by the antibiotic, oligomycin."
    explanation: The normal role of OSCP in coupling the two sectors of the enzyme, which is the activity the lesion reduces.
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since exon 2 encodes the last 11 AA (out of 23) of transit peptide, this variant is associated with drastic reduction of OSCP levels in the mitochondria."
    explanation: Explains why exon 2 skipping depletes mitochondrial OSCP.
  - reference: PMID:35621276
    reference_title: "A homozygous splice variant in ATP5PO, disrupts mitochondrial complex V function and causes Leigh syndrome in two unrelated families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As shown in Figure 5, cells expressing hATP5PO-Δex2 were unable to rescue respiratory growth unlike yATP5 and human wild-type ATP5PO."
    explanation: Yeast complementation shows the exon-2-deleted protein is not functional, while wild-type human OSCP is.
  - reference: PMID:35621276
    reference_title: "A homozygous splice variant in ATP5PO, disrupts mitochondrial complex V function and causes Leigh syndrome in two unrelated families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, our findings support the pathogenicity of the ATP5PO c.87+3A>G variant, which significantly reduces but does not eliminate complex V activity."
    explanation: The basis for recording the lesion as partial rather than complete loss.
  downstream:
  - target: Failure of Peripheral Stalk Assembly
    causal_link_type: DIRECT
    description: >-
      Without enough OSCP the peripheral stalk is not built and the enzyme stops
      at F1 intermediates.
    evidence:
    - reference: PMID:35621276
      reference_title: "A homozygous splice variant in ATP5PO, disrupts mitochondrial complex V function and causes Leigh syndrome in two unrelated families."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Fibroblasts from the affected individuals demonstrated decreased ATP5PO protein, defective assembly of complex V with markedly reduced amounts of peripheral stalk proteins, and complex V hydrolytic activity."
      explanation: Low OSCP in patient fibroblasts goes with defective assembly and loss of the other stalk proteins.
- name: Failure of Peripheral Stalk Assembly
  biological_scale: MOLECULAR
  description: >-
    In patient fibroblasts the other stalk subunits b and d fall with OSCP,
    while the alpha and beta subunits of F1 are maintained, and blue-native gels
    show F1 subdomain intermediates with almost no holoenzyme. Human cells in
    which OSCP is deleted assemble only a vestigial F1-c8 complex, which is the
    same block. The patient with the compound heterozygous genotype had about
    half the normal amount of ATP synthase, with several other subunits
    under-expressed.

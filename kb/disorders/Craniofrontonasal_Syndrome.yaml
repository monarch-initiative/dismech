name: Craniofrontonasal Syndrome
creation_date: "2026-10-31T12:00:00Z"
category: Mendelian
synonyms:
- CFNS
- CFND
- craniofrontonasal dysplasia
- craniofrontonasal dysplasia, X-linked dominant
description: >-
  Craniofrontonasal syndrome is an X-linked craniofacial malformation disorder
  caused by loss-of-function variants in EFNB1, which encodes the transmembrane
  Eph receptor ligand ephrin-B1. It is unusual in being more severe in
  heterozygous females than in hemizygous males. Affected females typically
  have frontonasal dysplasia with marked hypertelorism and a grooved or bifid
  nasal tip, unilateral or bilateral coronal craniosynostosis, craniofacial
  asymmetry, frizzy hair, longitudinally ridged and split nails, Sprengel
  shoulder and mild cutaneous syndactyly; cleft lip or palate, agenesis of the
  corpus callosum, diaphragmatic hernia and learning difficulty occur less
  often. Hemizygous males usually show hypertelorism alone. The accepted
  explanation is cellular interference: random X-inactivation in a
  heterozygous female produces a patchwork of ephrin-B1-expressing and
  ephrin-B1-deficient cells, which segregate from one another and create
  ectopic Eph/ephrin boundaries in the craniofacial mesenchyme, while a male
  with uniform ephrin-B1 deficiency has no such boundaries. Males who are
  somatic mosaics for an EFNB1 variant are affected as severely as females,
  which supports this model.
disease_term:
  preferred_term: craniofrontonasal syndrome
  term:
    id: MONDO:0010570
    label: craniofrontonasal syndrome
parents:
- Craniosynostosis syndrome
- Frontonasal dysplasia
inheritance:
- name: X-linked dominant
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  description: >-
    X-linked inheritance with greater severity in heterozygous females than in
    hemizygous males. Carrier males are under-represented in pedigrees, mainly
    because most germline EFNB1 variants arise in the paternal germline and
    present as affected daughters.
  evidence:
  - reference: PMID:15166289
    reference_title: "Mutations of ephrin-B1 (EFNB1), a marker of tissue boundary formation, cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Craniofrontonasal syndrome (CFNS) is an X-linked developmental disorder that shows paradoxically greater severity in heterozygous females than in hemizygous males."
    explanation: States the X-linked inheritance and the reversed sex difference in severity.
  - reference: PMID:16685650
    reference_title: "The origin of EFNB1 mutations in craniofrontonasal syndrome: frequent somatic mosaicism and explanation of the paucity of carrier males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the major factor accounting for the relative scarcity of carrier males is the bias toward mutations in the paternal germline (which present as affected female offspring) combined with reduced reproductive fitness in affected females."
    explanation: Explains why carrier males are rare in CFNS pedigrees, from parent-of-origin analysis of germline EFNB1 variants.
- name: Somatic mosaicism
  inheritance_term:
    preferred_term: Typified by somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    A recognized post-zygotic arm. Somatic mosaicism for an EFNB1 variant was
    found in about one in nine informative families, and males who are somatic
    mosaics have the severe, female-like phenotype. This block refers to DNA-level
    mosaicism only; the functional mosaicism that X-inactivation creates in
    heterozygous females is not covered by this term.
  evidence:
  - reference: PMID:16685650
    reference_title: "The origin of EFNB1 mutations in craniofrontonasal syndrome: frequent somatic mosaicism and explanation of the paucity of carrier males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mosaicism was demonstrated in 6 of 53 informative families"
    explanation: Establishes somatic mosaicism as a recurrent origin of EFNB1 variants in CFNS families.
  - reference: PMID:23335590
    reference_title: "Cellular interference in craniofrontonasal syndrome: males mosaic for mutations in the X-linked EFNB1 gene are more severely affected than true hemizygotes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified mosaic mutations of EFNB1 in all cases, comprising three missense changes, two gene deletions and a novel point mutation within the 5' untranslated region (UTR)"
    explanation: All six severely affected sporadic males studied were somatic mosaics for an EFNB1 variant.
pathophysiology:
- name: EFNB1 Loss of Function
  description: >-
    Heterozygous (female), hemizygous (male) or mosaic loss-of-function variants
    in EFNB1 - nonsense, frameshift, splice-site, missense variants in the
    extracellular ephrin domain, and whole-gene deletions - abolish ephrin-B1
    function. Missense variants cluster in the receptor-binding and
    oligomerization surfaces, and C-terminal frameshifts remove the
    intracellular PDZ and Grb4 binding sites needed for reverse signaling.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EFNB1
    term:
      id: hgnc:3226
      label: EFNB1
  molecular_functions:
  - preferred_term: ephrin receptor binding
    modifier: DECREASED
    term:
      id: GO:0046875
      label: ephrin receptor binding
  biological_processes:
  - preferred_term: ephrin receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0048013
      label: ephrin receptor signaling pathway
  evidence:
  - reference: PMID:15166289
    reference_title: "Mutations of ephrin-B1 (EFNB1), a marker of tissue boundary formation, cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the classical female CFNS phenotype is caused by heterozygous loss-of-function mutations in EFNB1, which encodes a member of the ephrin family of transmembrane ligands for Eph receptor tyrosine kinases"
    explanation: Identifies heterozygous EFNB1 loss of function as the cause of CFNS.
  - reference: PMID:15959873
    reference_title: "Twenty-six novel EFNB1 mutations in familial and sporadic craniofrontonasal syndrome (CFNS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that the major causes of familial as well as sporadic CFNS are loss of function mutations in the EFNB1 gene that comprise premature termination or abrogate receptor-ligand interaction, oligomerization, and ephrin-B1 reverse signaling."
    explanation: Characterizes the mutation spectrum as loss of function, affecting receptor binding, oligomerization and reverse signaling.
  - reference: PMID:15124102
    reference_title: "Mutations of the ephrin-B1 gene cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both mutations are located in multimerization and receptor-interaction motifs found within the ephrin-B1 extracellular domain."
    explanation: Places the first missense variants in the ephrin-B1 receptor-interaction and multimerization surfaces.
  downstream:
  - target: Ephrin-B1 Expression Mosaicism
    description: >-
      Because EFNB1 is subject to X-inactivation, a heterozygous loss-of-function
      variant leaves a female with a mosaic of ephrin-B1-positive and
      ephrin-B1-deficient cells. A post-zygotic variant does the same in a male.
    evidence:
    - reference: PMID:23335590
      reference_title: "Cellular interference in craniofrontonasal syndrome: males mosaic for mutations in the X-linked EFNB1 gene are more severely affected than true hemizygotes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "X-inactivation is proposed to explain the more severe outcome in heterozygous females, as this leads to functional mosaicism for cells with differing expression of EPHRIN-B1, generating abnormal tissue boundaries-a process that cannot occur in hemizygous males."
      explanation: Links heterozygous EFNB1 loss through X-inactivation to cellular mosaicism for ephrin-B1.
  - target: Impaired Cranial Neural Crest Cell Migration
    description: >-
      Independently of mosaicism, loss of ephrin-B1 acts autonomously in neural
      crest cells and disturbs their migration, the defect shared by
      hemizygous males and heterozygous females.
    evidence:
    - reference: PMID:15037550
      reference_title: "Ephrin-B1 forward and reverse signaling are required during mouse development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional deletion of ephrin-B1 demonstrated that ephrin-B1 acts autonomously in NCCs, and controls their migration."
      explanation: Shows ephrin-B1 controls neural crest cell migration cell-autonomously in mice.
  - target: Congenital diaphragmatic hernia
    description: >-
      Diaphragmatic hernia occurs in hemizygous males with only minor
      craniofacial features, so it is attributed to ephrin-B1 deficiency itself
      rather than to mosaicism. The developmental step involved is not known.
    evidence:
    - reference: PMID:16639408
      reference_title: "Expanding the phenotype of craniofrontonasal syndrome: two unrelated boys with EFNB1 mutations and congenital diaphragmatic hernia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our cases represent the first in which CDH has been confirmed in males with mutations in EFNB1, highlighting an important role for signalling by ephrin-B1 in the development of the diaphragm."
      explanation: The inference from hemizygous boys with CDH to a role for ephrin-B1 in diaphragm development is the authors'; no mechanism is shown.
- name: Ephrin-B1 Expression Mosaicism
  description: >-
    Random X-inactivation in heterozygous females (or a post-zygotic variant in
    males) produces intermingled populations of ephrin-B1-expressing and
    ephrin-B1-deficient cells. A uniformly deficient hemizygous male lacks
    this mosaic, which is why he is usually mildly affected. Mosaicism for two
    different expression levels, as with an EFNB1 duplication or a
    supernumerary X carrying EFNB1, has a similar effect.
  biological_scale: CELLULAR
  genes:
  - preferred_term: EFNB1
    term:
      id: hgnc:3226
      label: EFNB1
  evidence:
  - reference: PMID:15166289
    reference_title: "Mutations of ephrin-B1 (EFNB1), a marker of tissue boundary formation, cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although EFNB1 is X-inactivated, we did not observe markedly skewed X-inactivation in either blood or cranial periosteum from females with CFNS, indicating that lack of ephrin-B1 does not compromise cell viability in these tissues."
    explanation: Shows that both ephrin-B1-positive and ephrin-B1-deficient cell populations persist in affected females.
  - reference: PMID:23614707
    reference_title: "Craniofrontonasal syndrome in a male due to chromosomal mosaicism involving EFNB1: further insights into a genetic paradox."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mosaicism for cell populations with different levels of EFNB1 expression can explain the severe phenotype of this patient."
    explanation: A male mosaic for a supernumerary ring X carrying EFNB1 had severe CFNS, extending the mosaicism model to differing expression levels.
  - reference: PMID:21542058
    reference_title: "Duplication of the EFNB1 gene in familial hypertelorism: imbalance in ephrin-B1 expression and abnormal phenotypes in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cellular mosaicism for different levels of ephrin-B1 (as well as simple presence/absence) leads to craniofacial abnormalities"
    explanation: An EFNB1 duplication in females produced hypertelorism, supporting the role of mosaic expression level.
  downstream:
  - target: Ectopic Eph-Ephrin Boundaries and Cell Segregation
    description: >-
      Ephrin-B1-positive and ephrin-B1-negative cells sort apart, so new
      Eph/ephrin interfaces form where none should exist.
    evidence:
    - reference: PMID:28238796
      reference_title: "EPHRIN-B1 Mosaicism Drives Cell Segregation in Craniofrontonasal Syndrome hiPSC-Derived Neuroepithelial Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "mosaicism for EPHRIN-B1 expression induced by random X inactivation in heterozygous females results in robust cell segregation in human neuroepithelial cells"
      explanation: Patient-derived iPSC neuroepithelial cells show that ephrin-B1 mosaicism causes cell segregation in human cells.
- name: Ectopic Eph-Ephrin Boundaries and Cell Segregation
  description: >-
    Mosaic ephrin-B1 expression drives segregation of expressing and
    non-expressing cells, first in the early neuroepithelium and later in
    craniofacial mesenchyme. Sorting is driven by unidirectional EphB kinase
    signaling into ephrin-B1-expressing neighbors, which creates a Rho
    kinase-dependent cortical actomyosin differential. EPHB2 and EPHB3 are the
    main receptors in craniofacial tissue. The ectopic boundaries are the
    proposed basis of cellular interference.
  biological_scale: CELLULAR
  genes:
  - preferred_term: EFNB1
    term:
      id: hgnc:3226
      label: EFNB1
  - preferred_term: EPHB2
    term:
      id: hgnc:3393
      label: EPHB2
  - preferred_term: EPHB3
    term:
      id: hgnc:3394
      label: EPHB3
  biological_processes:
  - preferred_term: ephrin receptor signaling pathway (ectopic, at mosaic interfaces)
    term:
      id: GO:0048013
      label: ephrin receptor signaling pathway
  cell_types:
  - preferred_term: neuroepithelial cell
    term:
      id: CL:0000710
      label: neurecto-epithelial cell
  - preferred_term: craniofacial mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  evidence:
  - reference: PMID:27810913
    reference_title: "Unidirectional Eph/ephrin signaling creates a cortical actomyosin differential to drive cell segregation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "unidirectional EphB kinase signaling leads to cell sorting by the Rho kinase-dependent generation of a cortical actin differential between ephrin-B1- and EphB-expressing cells"
    explanation: Defines the cellular mechanism of ephrin-B1-driven segregation in mosaic mouse embryos.
  - reference: PMID:32092051
    reference_title: "Aberrant cell segregation in the craniofacial primordium and the emergence of facial dysmorphology in craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "EPHRIN-B1 regulates cell segregation independently in early neural development and later in craniofacial development, correlating with the emergence of quantitative differences in face shape"
    explanation: Places segregation in both neural and craniofacial tissue and links it to face shape.
  - reference: PMID:32092051
    reference_title: "Aberrant cell segregation in the craniofacial primordium and the emergence of facial dysmorphology in craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "EPHB2 and EPHB3 play an important role in craniofacial cell segregation, EPHB1 is more important for cell segregation in the brain"
    explanation: Identifies the EphB receptors that mediate craniofacial segregation.
  downstream:
  - target: Gap Junction Communication Block at Ectopic Boundaries
    evidence:
    - reference: PMID:16968134
      reference_title: "Inhibition of gap junction communication at ectopic Eph/ephrin boundaries underlies craniofrontonasal syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that gap junction communication (GJC) is inhibited at ectopic ephrin boundaries and that ephrin-B1 interacts with connexin43 and regulates its distribution."
      explanation: Shows gap junction communication is blocked at the ectopic boundaries that mosaic segregation creates.
  - target: Mosaic Disruption of Palatal Mesenchyme Proliferation
    evidence:
    - reference: PMID:20844017
      reference_title: "Ephrin-B1 forward signaling regulates craniofacial morphogenesis by controlling cell proliferation across Eph-ephrin boundaries."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "this process leads to mosaic disruption of cell proliferation and post-transcriptional up-regulation of EphB receptor expression through relief of endocytosis and degradation"
      explanation: Links ephrin-B1 cell sorting in heterozygous palatal mesenchyme to mosaic disruption of proliferation.
  - target: Craniofacial Mesenchyme Dysmorphogenesis
    evidence:
    - reference: PMID:32092051
      reference_title: "Aberrant cell segregation in the craniofacial primordium and the emergence of facial dysmorphology in craniofrontonasal syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "heterozygous embryos are quantitatively more severely affected, indicating that Efnb1 mosaicism exacerbates loss of function phenotypes rather than having a neomorphic effect"
      explanation: Shows that mosaicism worsens the same face-shape changes seen with uniform loss.
  - target: Coronal Suture Boundary Disturbance
    evidence:
    - reference: PMID:15166289
      reference_title: "Mutations of ephrin-B1 (EFNB1), a marker of tissue boundary formation, cause craniofrontonasal syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that in heterozygous females, patchwork loss of ephrin-B1 disturbs tissue boundary formation at the developing coronal suture, whereas in males deficient in ephrin-B1, an alternative mechanism maintains the normal boundary."
      explanation: The link from patchwork ephrin-B1 loss to coronal boundary disturbance is proposed by the authors, based on Efnb1 expression at the future coronal suture.
- name: Gap Junction Communication Block at Ectopic Boundaries
  description: >-
    Ephrin-B1 binds connexin 43 and controls its distribution. At the ectopic
    boundaries in ephrin-B1 mosaic tissue, gap junction communication between
    neighboring cells is inhibited.
  biological_scale: CELLULAR
  genes:

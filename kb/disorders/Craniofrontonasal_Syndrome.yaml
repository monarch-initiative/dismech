    reference_title: "Inhibition of gap junction communication at ectopic Eph/ephrin boundaries underlies craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that ephrin-B1(+/-) mice exhibit calvarial defects, a phenotype autonomous to neural crest cells that correlates with cell sorting. We have traced the causes of calvarial defects to impaired differentiation of osteogenic precursors."
    explanation: Establishes impaired osteogenic differentiation as the cause of calvarial defects in heterozygous mice.
- name: Mosaic Disruption of Palatal Mesenchyme Proliferation
  description: >-
    In the anterior palatal shelf mesenchyme, ephrin-B1 forward signaling
    through ERK/MAPK controls proliferation. In heterozygous mice the mosaic
    of expressing and non-expressing cells disrupts proliferation patchily,
    which correlates with the more severe palatal dysmorphogenesis of
    heterozygotes.

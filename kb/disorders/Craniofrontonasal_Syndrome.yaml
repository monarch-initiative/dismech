    evidence_source: MODEL_ORGANISM
    snippet: "Our results uncover a novel role for Eph/ephrins in regulating GJC in vivo and suggest that the pleiotropic defects seen in CFNS patients are due to improper regulation of GJC in affected tissues."
    explanation: Proposes impaired gap junction communication as a basis for the pleiotropic CFNS defects.
  downstream:

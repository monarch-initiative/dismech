      snippet: "Moreover, we provide genetic evidence that GJC is implicated in the calvarial defects observed in ephrin-B1(+/-) embryos."
      explanation: Genetic evidence in mice ties gap junction communication to the calvarial defects of heterozygous embryos.
- name: Impaired Calvarial Osteogenic Differentiation
  description: >-
    In ephrin-B1 heterozygous mice, calvarial defects arise autonomously in
    neural crest cells, correlate with cell sorting, and trace to impaired
    differentiation of osteogenic precursors. This is a mouse finding; how it
    relates to the coronal synostosis seen in patients is not settled.
  biological_scale: CELLULAR

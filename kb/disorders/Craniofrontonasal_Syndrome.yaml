- name: Craniofacial Mesenchyme Dysmorphogenesis
  description: >-
    Abnormal shaping of the neural crest-derived frontonasal and midfacial
    primordia produces frontonasal dysplasia: widely spaced orbits, a broad
    or grooved nasal tip and facial asymmetry. Hemizygous and heterozygous
    mouse embryos show qualitatively similar face-shape changes, more severe
    in heterozygotes, matching the human sex difference.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:32092051
    reference_title: "Aberrant cell segregation in the craniofacial primordium and the emergence of facial dysmorphology in craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Whereas specific craniofacial shape changes are qualitatively similar in Efnb1 heterozygous and hemizygous mutant embryos, heterozygous embryos are quantitatively more severely affected"
    explanation: Shows face-shape change in both genotypes, more severe with mosaicism.
  downstream:
  - target: Hypertelorism
  - target: Bifid nasal tip
  - target: Facial asymmetry
- name: Coronal Suture Boundary Disturbance
  description: >-
    Efnb1 marks the position of the future coronal suture, the boundary
    between neural crest-derived frontal bone and mesoderm-derived parietal
    bone. Patchwork ephrin-B1 loss is proposed to disturb this boundary in
    heterozygous females; hemizygous males, who lack the patchwork, rarely
    have craniosynostosis.
  biological_scale: TISSUE
  conforms_to: cranial_suture_premature_fusion#Loss of Suture Patency Restraint
  evidence:
  - reference: PMID:15166289
    reference_title: "Mutations of ephrin-B1 (EFNB1), a marker of tissue boundary formation, cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, the orthologous Efnb1 gene is expressed in the frontonasal neural crest and demarcates the position of the future coronal suture."
    explanation: Places Efnb1 expression at the future coronal suture boundary.
  downstream:
  - target: Coronal craniosynostosis

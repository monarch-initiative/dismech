genetic:
- name: EFNB1
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: EFNB1
    term:
      id: hgnc:3226
      label: EFNB1
  notes: >-
    Loss-of-function variants of all classes, including whole-gene deletions;
    no genotype-phenotype correlation is established. Contiguous deletions
    extending beyond EFNB1 are associated with developmental delay. Rare
    noncoding variants include a 5' UTR variant affecting a small upstream
    open reading frame and a pericentric X inversion that separates EFNB1
    from a putative downstream enhancer.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_31ffbd0b-5c6b-4396-a84c-9330d81e4a08-2020-10-26T154650.453Z
    evidence:
    - reference: CGGV:assertion_31ffbd0b-5c6b-4396-a84c-9330d81e4a08-2020-10-26T154650.453Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "EFNB1 | HGNC:3226 | craniofrontonasal syndrome | MONDO:0010570 | XL | Definitive"
      explanation: ClinGen classifies the EFNB1-craniofrontonasal syndrome relationship as Definitive for X-linked inheritance.
  evidence:
  - reference: PMID:15124102
    reference_title: "Mutations of the ephrin-B1 gene cause craniofrontonasal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, mutations were found consistently in obligate male carriers, clinically affected males, and affected heterozygous females. We conclude that mutations in EFNB1 cause CFNS."
    explanation: Segregation of EFNB1 variants with CFNS in three families.
  - reference: PMID:15959873
    reference_title: "Twenty-six novel EFNB1 mutations in familial and sporadic craniofrontonasal syndrome (CFNS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequencing revealed mutations in 33 (86.8%) cases including 26 distinct novel mutations."
    explanation: EFNB1 variants were found in most familial and sporadic CFNS cases.
  - reference: PMID:39643662
    reference_title: "Craniofrontonasal syndrome in a patient with an inv(X)(p22.2q13.1), separating EFNB1 from its enhancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the breakpoints was about 97 kbp downstream of the 3' end of the EFNB1 gene, separating a potential EFNB1 enhancer region from the EFNB1 gene."
    explanation: A de novo X inversion caused typical CFNS in a female with no EFNB1 coding variant, by separating the gene from a putative enhancer.
  - reference: PMID:23335590
    reference_title: "Cellular interference in craniofrontonasal syndrome: males mosaic for mutations in the X-linked EFNB1 gene are more severely affected than true hemizygotes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The 5' UTR variant mutates the stop codon of a small upstream open reading frame that, using a dual-luciferase reporter construct, was demonstrated to exacerbate interference with translation of the wild-type protein."
    explanation: A 5' UTR variant acts by impairing translation of EFNB1 through an upstream open reading frame, shown by reporter assay.
treatments:
- name: Fronto-orbital advancement
  description: >-
    Fronto-orbital advancement for coronal synostosis in infancy. In a
    21-patient series no patient had raised intracranial pressure or
    resynostosis afterwards.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: fronto-orbital advancement
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Coronal craniosynostosis
    term:
      id: HP:0004440
      label: Coronal craniosynostosis
  evidence:
  - reference: PMID:18090758
    reference_title: "Craniofrontonasal dysplasia: a surgical treatment algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After fronto-orbital advancement, no patients had increased intracranial pressure problems or difficulty related to resynostosis."
    explanation: Outcome of fronto-orbital advancement for coronal synostosis in CFNS.
- name: Hypertelorism correction
  description: >-
    Orbital translocation by facial bipartition or box osteotomy. Early
    correction relapsed in some patients, so it is usually delayed until the
    permanent maxillary incisors have erupted.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: facial bipartition or box osteotomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Hypertelorism
    term:
      id: HP:0000316
      label: Hypertelorism
  evidence:
  - reference: PMID:18090758
    reference_title: "Craniofrontonasal dysplasia: a surgical treatment algorithm."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of this, correction in later patients was delayed until after eruption of permanent maxillary incisors."
    explanation: Supports deferring hypertelorism correction after early relapse.
  - reference: PMID:33864106
    reference_title: "Craniofrontonasal dysplasia: hypertelorism correction in late presenting patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of elevated intracranial pressure enables hypertelorism correction in late presenting CFND patients via facial bipartition or box osteotomy without the need for additional operations that provide for cranial expansion."
    explanation: Facial bipartition or box osteotomy corrects hypertelorism in late-presenting, EFNB1-confirmed patients.
- name: Multidisciplinary follow-up
  description: >-
    Long-term follow-up by a craniofacial team including speech and language
    therapy, orthoptics, orthodontics, clinical psychology and genetics, and
    genetic counseling that accounts for the reversed sex difference and the
    possibility of parental mosaicism.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32371695
    reference_title: "Implications for the Multi-Disciplinary Management of Children With Craniofrontonasal Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrated significant multidisciplinary input is required, including Speech and Language Therapy, Plastic and Reconstructive Surgery, Genetics, Ear, Nose and Throat, Maxillofacial, Orthodontic, Orthopaedic, Clinical Psychology and Orthoptic teams."
    explanation: Supports multidisciplinary long-term management.
  - reference: PMID:16685650
    reference_title: "The origin of EFNB1 mutations in craniofrontonasal syndrome: frequent somatic mosaicism and explanation of the paucity of carrier males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results highlight the importance of considering possible origins of mutation in the counseling of families with CFNS"
    explanation: Supports counseling that considers paternal-germline and mosaic origins of EFNB1 variants.
animal_models:
- name: Efnb1 heterozygous and hemizygous mice
  species: Mouse
  genotype: Efnb1 +/- (female) and Efnb1 Y/- (male)
  publication: PMID:12919674
  description: >-
    Efnb1 null mice die perinatally with skeletal patterning defects;
    heterozygous females, mosaic through X-inactivation, show cell sorting and
    phenotypes absent from null males, such as preaxial polydactyly.
  modeled_mechanisms:
  - target: Ectopic Eph-Ephrin Boundaries and Cell Segregation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: X-inactivation mosaicism in heterozygous females drives ephrin-B1 cell segregation, as proposed in CFNS.
    limitations: >-
      Mouse heterozygotes show calvarial defects and polydactyly rather than the
      human coronal synostosis, and null males die perinatally whereas
      hemizygous human males are mildly affected.
    evidence:
    - reference: PMID:12919674
      reference_title: "Control of skeletal patterning by ephrinB1-EphB interactions."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Another malformation, preaxial polydactyly, was exclusively seen in heterozygous females in which expression of the X-linked ephrinB1 gene was mosaic, so that ectopic EphB-ephrinB1 interactions led to restricted cell movements and the bifurcation of digital rays."
      explanation: A heterozygote-only malformation in mice arises from mosaic ectopic EphB-ephrinB1 interactions.
experimental_models:
- name: CFNS patient-derived hiPSC neuroepithelial cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Induced pluripotent stem cells from heterozygous female patients differentiated to neuroepithelial cells.
  publication: PMID:28238796
  modeled_mechanisms:
  - target: Ephrin-B1 Expression Mosaicism
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Patient lines retain X-inactivation mosaicism for ephrin-B1.
    evidence:
    - reference: PMID:28238796
      reference_title: "EPHRIN-B1 Mosaicism Drives Cell Segregation in Craniofrontonasal Syndrome hiPSC-Derived Neuroepithelial Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "by generating hiPSCs from CFNS patients, we demonstrate that mosaicism for EPHRIN-B1 expression induced by random X inactivation in heterozygous females results in robust cell segregation in human neuroepithelial cells"
      explanation: Patient-derived cells reproduce ephrin-B1 mosaicism and its segregation.
  - target: Ectopic Eph-Ephrin Boundaries and Cell Segregation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Mosaic neuroepithelial cultures segregate into ephrin-B1-positive and -negative domains.
    limitations: >-
      Neuroepithelial cells model the early neural compartment; the craniofacial
      neural crest-derived mesenchyme that drives the facial phenotype is not
      represented.
    evidence:
    - reference: PMID:28238796
      reference_title: "EPHRIN-B1 Mosaicism Drives Cell Segregation in Craniofrontonasal Syndrome hiPSC-Derived Neuroepithelial Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "thus supplying experimental evidence that Eph/ephrin-mediated cell segregation is relevant to pathogenesis in human CFNS patients"
      explanation: Direct human-cell evidence for ephrin-mediated segregation.

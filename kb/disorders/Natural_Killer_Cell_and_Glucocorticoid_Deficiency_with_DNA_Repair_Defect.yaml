prevalence:
- population: Irish Traveller population
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported in a small number of related kindreds from one genetically isolated
    population. The two founding reports describe ten and six patients
    respectively, with overlap between them; no population prevalence estimate
    exists and the allele is effectively private to the isolate.
  evidence:
  - reference: PMID:22499342
    reference_title: "Recessive mutations in MCM4/PRKDC cause a novel syndrome involving a primary immunodeficiency and a disorder of DNA repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A study is presented of 10 children with a novel syndrome born to consanguineous parents from the Irish Traveller population."
    explanation: Establishes the cohort size and the founder population.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygosity for the founder allele in consanguineous kindreds; heterozygous
    relatives are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22354167
    reference_title: "Partial MCM4 deficiency in patients with growth retardation, adrenal insufficiency, and natural killer cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we investigated 6 related patients with autosomal recessive growth retardation, adrenal insufficiency, and a selective NK cell deficiency characterized by a lack of the CD56(dim) NK subset."
    explanation: States the inheritance mode and the full clinical triad in one sentence.
genetic:
- name: MCM4
  gene_term:
    preferred_term: MCM4
    term:
      id: hgnc:6947
      label: MCM4
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    The reported allele is c.71-1insG, p.Pro24ArgfsX4. It is hypomorphic rather than
    null: the frameshift removes the major 96 kDa isoform while downstream
    translation re-initiation preserves a minor 85 kDa isoform. That residual
    activity is load-bearing for the entity, because complete MCM4 loss is lethal in
    the mouse before implantation.
  evidence:
  - reference: PMID:22354170
    reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted exome sequencing in 8 patients identified a variant (c.71-1insG) in minichromosome maintenance-deficient 4 (MCM4) that was predicted to result in a severely truncated protein (p.Pro24ArgfsX4)."
    explanation: Identifies the causal allele and its predicted protein consequence.
  - reference: PMID:22499342
    reference_title: "Recessive mutations in MCM4/PRKDC cause a novel syndrome involving a primary immunodeficiency and a disorder of DNA repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted resequencing of the candidate region revealed a homozygous mutation in MCM4/PRKDC in all 10 affected individuals."
    explanation: >-
      Independent identification of the same locus with complete segregation in a
      ten-patient cohort. Note this report names the region MCM4/PRKDC because the
      two genes are adjacent at 8q11; the functional work in the companion papers
      localizes the defect to MCM4.
pathophysiology:
- name: Hypomorphic MCM4 Deficiency
  biological_scale: MOLECULAR
  description: >-
    The c.71-1insG frameshift abolishes the major 96 kDa MCM4 isoform. A minor 85
    kDa isoform survives through re-initiation at downstream methionine codons, so
    the cell retains partial MCM4 function rather than none. This is why the
    disorder exists at all as a viable phenotype.
  genes:
  - preferred_term: MCM4
    term:
      id: hgnc:6947
      label: MCM4
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:22354170
    reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blotting of patient samples revealed that the major 96-kDa isoform present in unaffected human controls was absent, while the presence of the minor 85-kDa isoform was preserved."
    explanation: >-
      Measures the hypomorphic mechanism directly in patient material: which isoform
      is lost and which survives.
  downstream:
  - target: Depletion of Licensed Dormant Replication Origins
    causal_link_type: DIRECT
    description: >-
      MCM2-7 loading in G1 licenses far more origins than are normally fired;
      reducing functional MCM4 reduces that reserve.
- name: Depletion of Licensed Dormant Replication Origins
  biological_scale: MOLECULAR
  description: >-
    Most licensed origins are never used. They exist as a reserve that fires when a
    replication fork stalls, and that reserve is the first line of defence for the
    genome. Reduced MCM2-7 leaves fewer of them, which is the specific reason a
    partial licensing defect produces instability rather than simply slower
    replication.
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  evidence:
  - reference: PMID:21641805
    reference_title: "How dormant origins promote complete genome replication."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing reduced levels of MCM2-7 have fewer dormant origins, are cancer-prone and are genetically unstable, demonstrating the importance of dormant origins for preserving genome integrity."
    explanation: >-
      Establishes the causal link from reduced MCM2-7 dosage to instability through
      the dormant-origin reserve specifically, which is the step this node adds.
  downstream:
  - target: Replication Stress and Genomic Instability
    causal_link_type: DIRECT
- name: Replication Stress and Genomic Instability
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts show genomic instability, and the instability is rescued by
    expressing wild-type MCM4, which is what ties it to the gene rather than to the
    genetic background of a consanguineous kindred. Clinically this appears as
    increased chromosomal breakage, and it is what made the syndrome look like an
    atypical Fanconi-type breakage disorder before the gene was found.
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:22354167
    reference_title: "Partial MCM4 deficiency in patients with growth retardation, adrenal insufficiency, and natural killer cell deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patients' fibroblasts exhibited genomic instability, which was rescued by expression of WT MCM4."
    explanation: >-
      A complementation experiment in patient cells, which is what makes this
      MCM4-attributable rather than merely co-segregating.
  downstream:
  - target: Failure of CD56-dim NK Cell Maturation
    causal_link_type: DIRECT
  - target: Loss of Steroidogenic Cells in the Zona Fasciculata
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The adrenal lesion is documented histologically in Mcm4-depleted mice, but the
      steps from replication stress to the specific replacement of steroidogenic
      cells are not established, so the edge is typed indirect.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Failure of CD56-dim NK Cell Maturation
  biological_scale: CELLULAR
  description: >-
    The selective part of the phenotype, and the part that explains why a
    housekeeping defect produces an immunodeficiency. Terminal maturation from
    CD56-bright to CD56-dim is tightly dependent on MCM4-dependent cell division, so
    the compartment that needs the most divisions is the one that fails. Independent
    work shows CD56-bright NK cells accumulate more DNA damage and replication
    stress on activation than either CD56-dim NK cells or T cells, and die by
    apoptosis under aphidicolin, which supplies the cell-intrinsic reason for the
    selectivity.
  cell_types:
  - preferred_term: CD16-positive, CD56-dim natural killer cell, human
    term:
      id: CL:0000939
      label: CD16-positive, CD56-dim natural killer cell, human
  - preferred_term: CD16-negative, CD56-bright natural killer cell, human
    term:
      id: CL:0000938
      label: CD16-negative, CD56-bright natural killer cell, human
  evidence:
  - reference: PMID:22354167
    reference_title: "Partial MCM4 deficiency in patients with growth retardation, adrenal insufficiency, and natural killer cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the maturation of NK CD56(bright) cells toward an NK CD56(dim) phenotype was tightly dependent on MCM4-dependent cell division"
    explanation: >-
      Names the division-dependent maturation step that the MCM4 defect blocks,
      which is the mechanism of the selectivity rather than a restatement of it.
  - reference: PMID:38809096
    reference_title: "Replication Stress in Activated Human NK Cells Induces Sensitivity to Apoptosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "We found that the CD56bright subset of NK cells accumulates more DNA damage and replication stress during activation than do CD56dim NK cells or T cells."
    explanation: >-
      Supplies the cell-intrinsic reason NK cells are the lineage that fails.
      Graded INDIRECT because replication stress was induced chemically and
      genetically in healthy NK cells, not measured in MCM4-deficient patient cells.
  downstream:
  - target: Recurrent viral infections
    causal_link_type: DIRECT
- name: Loss of Steroidogenic Cells in the Zona Fasciculata
  biological_scale: TISSUE
  description: >-
    In Mcm4-depleted mice the adrenal cortex is grossly abnormal: non-steroidogenic
    GATA4- and Gli1-positive cells appear within the steroidogenic cortex and the
    number of steroidogenic cells in the zona fasciculata falls. That is a
    structural account of the glucocorticoid deficiency rather than a functional
    one, and it is what distinguishes this adrenal failure from the ACTH-receptor
    and redox lesions of the classic FGD series.
  biological_processes:
  - preferred_term: steroid biosynthetic process
    term:
      id: GO:0006694
      label: steroid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22354170
    reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "histological studies with Mcm4-depleted mice showed grossly abnormal adrenal morphology that was characterized by non-steroidogenic GATA4- and Gli1-positive cells within the steroidogenic cortex, which reduced the number of steroidogenic cells in the zona fasciculata of the adrenal cortex"
    explanation: >-
      The histological basis for the adrenal branch. Graded MODEL_ORGANISM because
      it is a mouse finding; no equivalent human adrenal histology is reported.
  downstream:
  - target: Primary adrenal insufficiency
    causal_link_type: DIRECT

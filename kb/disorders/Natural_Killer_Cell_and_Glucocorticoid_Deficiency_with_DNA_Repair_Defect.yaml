name: Natural Killer Cell and Glucocorticoid Deficiency with DNA Repair Defect
creation_date: "2026-09-05T00:00:00Z"
category: Genetic
synonyms:
- NKGCD
- MCM4 deficiency
- Immunodeficiency 54
- IMD54
- Primary immunodeficiency with natural-killer cell deficiency and adrenal insufficiency
- Natural killer cell deficiency, familial isolated
description: >
  NKGCD (IMD54; OMIM #609981) is an ultra-rare autosomal recessive disorder caused
  by a hypomorphic MCM4 variant, found in a genetically isolated Irish Traveller
  population. MCM4 is a subunit of the MCM2-7 replicative helicase, so the lesion is
  in DNA replication licensing itself, and the disease is what a partial,
  survivable replication defect looks like in a whole person: growth failure,
  chromosomal instability, a near-absent mature natural killer cell compartment
  with severe herpesvirus disease, and isolated glucocorticoid deficiency.

  Two features make the entity worth curating in its own right rather than as a
  variant of familial glucocorticoid deficiency. First, the causal allele is
  hypomorphic by an unusual route: the frameshift removes the major 96 kDa isoform,
  but downstream re-initiation methionine codons regenerate a partially functional
  85 kDa isoform. Complete MCM4 loss is embryonic-lethal, so only a hypomorphic
  allele reaches live birth, and the residual isoform is why this is a syndrome
  rather than a lethal. Second, the selectivity is informative rather than
  incidental. MCM4 is needed in every dividing cell, yet the compartments that fail
  are the ones with the most demanding proliferative history: terminal maturation
  of CD56-dim NK cells needs extra divisions, and CD56-bright NK cells accumulate
  more replication stress on activation than either CD56-dim NK cells or T cells.

  The entry is scoped to NKGCD rather than to the FGD series. kb/disorders/Familial_Glucocorticoid_Deficiency.yaml
  records in its own notes that MONDO models this phenotype as a distinct
  immunodeficiency disease rather than as a numbered FGD subtype, so the two entries
  agree on the split. The adrenal pathophysiology is curated here only to the extent
  that it is MCM4-specific.

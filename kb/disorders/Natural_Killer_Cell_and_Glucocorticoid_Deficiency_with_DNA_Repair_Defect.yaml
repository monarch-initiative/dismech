animal_models:
- name: Mcm4-Chaos3 hypomorphic mouse
  species: Mouse
  genotype: Mcm4(Chaos3/Chaos3), F345I destabilizing missense
  publication: PMID:17143284
  description: >-
    A forward-genetic chromosome-instability mutant that turned out to be a viable
    hypomorphic Mcm4 allele. It is the closest available model of the human lesion
    in kind rather than in sequence: an amino acid change destabilizing MCM4, on a
    background where the disrupted allele is preimplantation-lethal.
  modeled_mechanisms:
  - target: Hypomorphic MCM4 Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Reproduces the essential genetic logic of the human disease: complete Mcm4
      loss is preimplantation-lethal, and only a hypomorphic allele is compatible
      with development. That is the reason the human disorder exists as a viable
      syndrome at all.
    limitations: >-
      The mechanism of hypomorphism differs from the human one. Chaos3 is a
      destabilizing missense substitution; the human allele is a frameshift rescued
      by downstream translation re-initiation into a shorter isoform. The mouse
      therefore models residual-activity biology but not the isoform switch, and
      cannot be used to reason about which MCM4 domains the patients retain.
    readouts:
    - name: Aphidicolin-induced chromosome breakage in embryonic fibroblasts
      target: Hypomorphic MCM4 Deficiency
      direction: INCREASED
      interpretation: >-
        The same replication-stress hypersensitivity reported in patient
        fibroblasts, in a model where the allele is defined.
      evidence:
      - reference: PMID:17143284
        reference_title: "A viable allele of Mcm4 causes chromosome instability and mammary adenocarcinomas in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mutant embryonic fibroblasts were highly susceptible to chromosome breaks induced by the DNA replication inhibitor aphidicolin."
        explanation: The measured breakage readout under replication stress.
    evidence:
    - reference: PMID:17143284
      reference_title: "A viable allele of Mcm4 causes chromosome instability and mammary adenocarcinomas in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Whereas homozygosity for a disrupted Mcm4 allele (Mcm4(-)) caused preimplantation lethality, Mcm(Chaos3/-) embryos died late in gestation, indicating that Mcm4(Chaos3) is hypomorphic."
      explanation: >-
        Establishes both that null Mcm4 is lethal and that the surviving allele is
        hypomorphic, which is the claim this link supports.
  - target: Replication Stress and Genomic Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Chromosome instability is the phenotype the mutant was isolated for, and it
      reproduces the increased breakage seen in patients.
    limitations: >-
      The mouse develops mammary adenocarcinoma in over 80% of homozygous females,
      an outcome with no counterpart yet reported in a human patient. Reading that
      across would overstate what is known about cancer risk in NKGCD; see the
      knowledge gap attached to this node.
    readouts:
    - name: Mammary adenocarcinoma incidence
      target: Replication Stress and Genomic Instability
      direction: INCREASED
      interpretation: >-
        A tumour outcome from a hypomorphic MCM allele, which is the basis for
        suspecting cancer risk in patients and is not itself evidence of it.
      evidence:
      - reference: PMID:17143284
        reference_title: "A viable allele of Mcm4 causes chromosome instability and mammary adenocarcinomas in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Most notably, >80% of Mcm4(Chaos3/Chaos3) females succumbed to mammary adenocarcinomas with a mean latency of 12 months."
        explanation: The tumour incidence and latency in the model.
    evidence:
    - reference: PMID:17143284
      reference_title: "A viable allele of Mcm4 causes chromosome instability and mammary adenocarcinomas in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the mouse chromosome instability mutation Chaos3 (chromosome aberrations occurring spontaneously 3), isolated in a forward genetic screen, is a viable allele of Mcm4"
      explanation: >-
        Identifies the model's lesion as an Mcm4 allele, which is what makes its
        instability phenotype attributable to this gene.
  notes: >-
    No model of the human immunological phenotype exists. Chaos3 was characterized
    for chromosome instability and tumour susceptibility, not for NK cell subsets,
    so the compartment that defines the human disorder is unexamined in the only
    available in vivo model.
diagnosis:
- name: Natural killer cell subset immunophenotyping
  description: >-
    Flow cytometry showing CD56-bright cells present with the CD56-dim subset
    selectively absent is the discriminating finding. A total NK count alone can
    understate the defect, because it is the maturation step rather than the lineage
    that fails.
  presence: PRESENT
  evidence:
  - reference: PMID:22354167
    reference_title: "Partial MCM4 deficiency in patients with growth retardation, adrenal insufficiency, and natural killer cell deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a selective NK cell deficiency characterized by a lack of the CD56(dim) NK subset"
    explanation: The immunophenotypic pattern that defines the disorder.
differential_diagnoses:
- name: Fanconi anaemia
  description: >-
    The initial working diagnosis in the founding cohort, and the reason the entity
    was missed for a time. Chromosomal breakage testing supports it; the clinical
    picture does not. Anyone reaching a mosaic Fanconi result in a child with
    adrenal insufficiency and recurrent viral illness should consider MCM4.
  evidence:
  - reference: PMID:22499342
    reference_title: "Recessive mutations in MCM4/PRKDC cause a novel syndrome involving a primary immunodeficiency and a disorder of DNA repair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The syndrome is characterised by a natural killer (NK) cell deficiency, evidence of an atypical Fanconi's type DNA breakage disorder, and features of familial glucocorticoid deficiency (FGD)."
    explanation: >-
      States the three-way phenotypic overlap that makes both Fanconi anaemia and
      FGD live differentials.
- name: Familial glucocorticoid deficiency (FGD1-5)
  description: >-
    The classic FGD series is caused by ACTH receptor, MRAP, and redox-pathway
    lesions and has no immunological or growth component of this kind. MONDO models
    NKGCD as a distinct immunodeficiency disease rather than as a numbered subtype
    of that series, and kb/disorders/Familial_Glucocorticoid_Deficiency.yaml records
    that decision in its own notes.
  evidence:
  - reference: PMID:22354170
    reference_title: "MCM4 mutation causes adrenal failure, short stature, and natural killer cell deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An interesting variant of familial glucocorticoid deficiency (FGD), an autosomal recessive form of adrenal failure, exists in a genetically isolated Irish population."
    explanation: >-
      Frames the entity relative to FGD, which is where a clinician will first place
      it.
- name: Other CMG helicase natural killer cell deficiencies (GINS1, MCM10, GINS4)
  description: >-
    MCM4 is one of four CMG helicase components whose deficiency causes NK cell
    deficiency. They share the replication-stress mechanism and the NK-selective
    consequence, so the differential is molecular rather than clinical.
  evidence:
  - reference: PMID:38809096
    reference_title: "Replication Stress in Activated Human NK Cells Induces Sensitivity to Apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "NK cell deficiency (NKD) occurs when NK cell development or function is impaired and variants in MCM4, GINS1, MCM10, and GINS4 result in NKD."
    explanation: Names the gene family this disorder belongs to.
discussions:
- discussion_id: nkgcd_adrenal_causal_order
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the glucocorticoid deficiency in NKGCD a direct consequence of replication
    stress in the adrenal cortex, or a secondary phenotype as the founding cohort
    suspected?
  attaches_to:
  - pathophysiology#Loss of Steroidogenic Cells in the Zona Fasciculata
  rationale: >-
    The adrenal branch is the least secure part of the chain and the entry types its
    incoming edge as indirect for that reason. The supporting histology is from
    Mcm4-depleted mice, not from human adrenal tissue; and the clinicians who
    described the syndrome explicitly wrote that the symptomatic FGD presentation was
    delayed in onset and might be a secondary phenotype. Curating it as a direct
    consequence would resolve a question its discoverers left open.
  proposed_experiments:
  - experiment_id: nkgcd_adrenal_histology_human
    name: Adrenal histology and steroidogenic cell quantification in human NKGCD
    description: >-
      Where post-mortem or surgical adrenal tissue from an MCM4-deficient patient is
      available, quantify zona fasciculata steroidogenic cells and look for the
      GATA4/Gli1-positive non-steroidogenic population reported in the mouse.
    readouts:
    - name: Zona fasciculata steroidogenic cell number
      target: pathophysiology#Loss of Steroidogenic Cells in the Zona Fasciculata
      direction: DECREASED
      interpretation: >-
        Reproducing the murine histology in human tissue would convert the adrenal
        edge from indirect to direct.
- discussion_id: nkgcd_cancer_risk_unquantified
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the actual cancer risk in MCM4-deficient patients, given that reduced
    MCM2-7 dosage makes mice cancer-prone?
  attaches_to:
  - pathophysiology#Replication Stress and Genomic Instability
  rationale: >-
    The founding paper raises the possibility that these patients have an increased
    risk of neoplastic change, and the mouse literature supports it: reduced MCM2-7
    mice are cancer-prone, and a viable Mcm4 allele causes mammary adenocarcinomas.
    But the human cohort is a few dozen people in one isolate with no published
    longitudinal follow-up, so no human risk estimate exists. The entry deliberately
    curates no neoplasia phenotype, because inferring one from mouse data would put
    a model-organism claim in a human phenotype slot.
  proposed_experiments:
  - experiment_id: nkgcd_longitudinal_cancer_surveillance
    name: Longitudinal cancer surveillance in the MCM4 kindred
    description: >-
      Prospective registry follow-up of surviving MCM4-deficient individuals and
      heterozygous carriers, with cancer incidence compared against the background
      population rate.
    readouts:
    - name: Observed cancer incidence
      target: pathophysiology#Replication Stress and Genomic Instability
      direction: INCREASED
      interpretation: >-
        Would establish or exclude the risk that is currently inferred from mouse
        genetics alone.
notes: >-
  Curation decisions worth recording.

  Scope against Familial_Glucocorticoid_Deficiency. That entry mentions
  MONDO:0012383 once, in a notes block, and records that MONDO models the full NKGCD
  phenotype as a distinct immunodeficiency disease rather than as a numbered subtype
  of the FGD1-5 series. This entry is that separate record, and it curates the
  adrenal arm only to the extent that it is MCM4-specific rather than duplicating
  the FGD entry's adrenal pathophysiology.

  No neoplasia phenotype is curated. The founding paper suggests an increased risk
  of neoplastic change and the mouse literature supports it, but no human case has
  been reported and no risk estimate exists. That claim lives in a KNOWLEDGE_GAP
  rather than in a phenotype, because a phenotype slot asserts something about
  patients.

  The adrenal edge is typed INDIRECT_UNKNOWN_INTERMEDIATES on the authors' own
  caution that the FGD presentation was delayed and might be secondary, and because
  the supporting histology is murine.

  Deep research. An OpenScientist report is committed with the entry. It supplied
  the dormant-origin mechanism (PMID:21641805), the NK replication-stress work
  (PMID:38809096) and the CMG helicase differential. Two of its terms were wrong and
  are not bound: HP:0032152, offered as "Herpesvirus infection", is Keratosis
  pilaris, and HP:0000833 for glucose intolerance is obsolete. The report's own term
  validation caught the obsolete term but not the mislabelled one, because it
  checked only 9 of the 37 terms it extracted; that pattern is reported on #10459.

  The MCM4/PRKDC naming in PMID:22499342 is preserved in the snippet rather than
  silently corrected to MCM4. The two genes are adjacent at 8q11 and that paper
  reports the locus, not the resolved gene; the companion papers' functional work is
  what localizes it. Correcting a quote to match later knowledge is not something a
  snippet may do.

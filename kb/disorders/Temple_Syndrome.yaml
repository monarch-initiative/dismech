genetic:
- name: DLK1
  gene_term:
    preferred_term: DLK1
    term:
      id: hgnc:2907
      label: DLK1
  presence: Positive
  association: Paternally expressed gene whose loss is thought to drive most TS features
  features: >-
    Genotype-phenotype analysis of 14q32.2 microdeletions implicates loss of
    DLK1 in growth failure, the infantile PWS/SRS-like features and precocious
    puberty; Dlk1 knockout mice show growth retardation and obesity.
  notes: >-
    relationship_type is left unset because no GeneDiseaseRelationshipEnum
    value describes an imprinted dosage gene: Temple syndrome is caused by the
    parent-of-origin state of the 14q32.2 region, not by sequence variants in
    DLK1, so CAUSATIVE would overstate a Mendelian relationship.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genotype–phenotype analysis in 16 patients with microdeletions involving the 14q32.2 imprinted region implies that most of the TS14 phenotypes including growth failure, PWS/SRS-like features in infancy, and precocious puberty are caused primarily by loss of DLK1 expression"
    explanation: Microdeletion genotype-phenotype data point to DLK1 loss as the main driver.
- name: RTL1
  gene_term:
    preferred_term: RTL1
    term:
      id: hgnc:14665
      label: RTL1
  presence: Positive
  association: Paternally expressed retrotransposon-derived gene lost in TS
  features: >-
    RTL1 (PEG11/SIRH2) is not expressed when the paternal contribution is lost.
    Mouse Rtl1 deficiency causes placental fetal capillary failure and
    neonatal muscle defects resembling the hypotonia of Temple syndrome.
  notes: relationship_type is left unset for the same reason as DLK1.
  evidence:
  - reference: PMID:18176563
    reference_title: Deletions and epimutations affecting the human 14q32.2 imprinted region in individuals with paternal and maternal upd(14)-like phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive RTL1 expression and decreased DLK1 and RTL1 expression are relevant to upd(14)pat-like and upd(14)mat-like phenotypes, respectively"
    explanation: Decreased DLK1 and RTL1 underlie the upd(14)mat-like (Temple) phenotype.
- name: MEG3
  gene_term:
    preferred_term: MEG3
    term:
      id: hgnc:14575
      label: MEG3
  presence: Positive
  association: Maternally expressed lncRNA whose promoter DMR is hypomethylated in TS
  features: >-
    Hypomethylation of the MEG3:TSS-DMR is the diagnostic molecular signature
    of all three mechanisms; the maternal noncoding transcripts become
    biallelically expressed.
  notes: relationship_type is left unset for the same reason as DLK1.
  evidence:
  - reference: PMID:41926606
    reference_title: Temple Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of Temple syndrome is established in a proband with suggestive findings who has hypomethylation of the MEG3:transcriptional start site (TSS)-differentially methylated region (DMR) identified by molecular genetic testing"
    explanation: MEG3:TSS-DMR hypomethylation is the shared molecular signature.
pathophysiology:
- name: Loss of Paternal 14q32.2 Imprinted Expression
  biological_scale: MOLECULAR
  description: >-
    The methylated paternal IG-DMR and MEG3-DMR normally permit expression of
    the paternally expressed genes DLK1, RTL1 and DIO3. Maternal UPD14,
    paternal hypomethylation, or deletion of the paternal region gives a
    maternal-type state with no paternal gene expression.
  genes:
  - preferred_term: MEG3
    term:
      id: hgnc:14575
      label: MEG3
  biological_processes:
  - preferred_term: autosome genomic imprinting
    term:
      id: GO:0141068
      label: autosome genomic imprinting
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24891339
    reference_title: "Temple syndrome: improving the recognition of an underdiagnosed chromosome 14 imprinting disorder: an analysis of 51 published cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal uniparental disomy of chromosome 14, paternal deletions and loss of methylation at the intergenic differentially methylated region (IG-DMR) result in a human phenotype of low birth weight, hypotonia, early puberty and markedly short adult stature."
    explanation: All three molecular routes converge on loss of the paternal contribution.
  - reference: PMID:32592473
    reference_title: "Temple syndrome and Kagami-Ogata syndrome: clinical presentations, genotypes, models and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The locus encompasses paternally expressed protein-coding genes (DLK1, RTL1 and DIO3) and maternally expressed lncRNAs (MEG3/GTL2, RTL1as and MEG8), as well as numerous miRNAs and snoRNAs."
    explanation: Names the paternally expressed genes lost in Temple syndrome.
  downstream:
  - target: DLK1 Deficiency
    description: Paternal DLK1 is not expressed.
  - target: RTL1 Deficiency
    description: Paternal RTL1 is not expressed, and biallelic RTL1as microRNAs further repress any residual transcript.
- name: DLK1 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Loss of DLK1, a non-canonical Notch ligand and negative regulator of
    adipogenesis, is thought to cause the growth failure, infantile hypotonia
    and SRS-like features, precocious puberty and obesity of Temple syndrome.
  genes:
  - preferred_term: DLK1
    term:
      id: hgnc:2907
      label: DLK1
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "genotype–phenotype analysis in 16 patients with microdeletions involving the 14q32.2 imprinted region implies that most of the TS14 phenotypes including growth failure, PWS/SRS-like features in infancy, and precocious puberty are caused primarily by loss of DLK1 expression"
    explanation: Implicates DLK1 loss as the primary driver.
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "In support of this notion, DLK1 is involved in the determination of menarchial age34 and Dlk1 knockout mice show several TS14-like features, including pre- and postnatal growth retardation, muscular hypoplasia, and obesity."
    explanation: Dlk1 knockout mice reproduce growth retardation and obesity.
  downstream:
  - target: Prenatal growth failure
    description: DLK1 loss is implicated in fetal growth restriction.
  - target: Postnatal growth failure and short stature
    description: DLK1 loss is implicated in postnatal growth failure.
  - target: Precocious puberty
    description: DLK1 is involved in setting menarchial age; its loss is implicated in early puberty.
  - target: Truncal obesity
    description: DLK1 negatively regulates adipogenesis, so its loss is implicated in obesity.
- name: RTL1 Deficiency
  biological_scale: MOLECULAR
  description: >-
    RTL1 (PEG11, SIRH2), a eutherian-specific gene derived from a Ty3/Gypsy
    (sushi-ichi-related) LTR retrotransposon, is lost with the paternal
    contribution. In mice, loss of Rtl1 damages the placental fetal capillary
    network and causes thin, weak fetal muscle fibers.
  genes:
  - preferred_term: RTL1
    term:
      id: hgnc:14665
      label: RTL1
  evidence:
  - reference: PMID:18176563
    reference_title: Deletions and epimutations affecting the human 14q32.2 imprinted region in individuals with paternal and maternal upd(14)-like phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "excessive RTL1 expression and decreased DLK1 and RTL1 expression are relevant to upd(14)pat-like and upd(14)mat-like phenotypes, respectively"
    explanation: Decreased RTL1 is relevant to the Temple phenotype.
  downstream:
  - target: Placental Fetal Capillary Insufficiency
    description: Rtl1 is required to maintain placental fetal capillaries.
  - target: Neonatal Skeletal Muscle Hypoplasia
    description: Rtl1 loss produces thin, weak fetal and neonatal muscle fibers.
- name: Placental Fetal Capillary Insufficiency
  biological_scale: TISSUE
  description: >-
    In Rtl1 knockout mice, fetal capillaries in the basal labyrinth become
    clogged and damaged, the labyrinth fails to expand, and the placenta is
    small, causing mid- to late-fetal lethality or late fetal growth
    retardation. This is the proposed placental contribution to fetal growth
    restriction in Temple syndrome.
  cell_types:
  - preferred_term: placental fetal capillary endothelial cell
    term:
      id: CL:0002144
      label: capillary endothelial cell
  biological_processes:
  - preferred_term: labyrinthine layer blood vessel development
    term:
      id: GO:0060716
      label: labyrinthine layer blood vessel development
    modifier: DECREASED
  evidence:
  - reference: PMID:28111885
    reference_title: Severe damage to the placental fetal capillary network causes mid- to late fetal lethality and reduction in placental size in Peg11/Rtl1 KO mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, the basal region of the fetal capillary network was specifically damaged, also leading to poor expansion of the labyrinth layer and placental size reduction in the later stage."
    explanation: Rtl1 loss damages placental fetal capillaries and reduces placental size.
  - reference: PMID:28111885
    reference_title: Severe damage to the placental fetal capillary network causes mid- to late fetal lethality and reduction in placental size in Peg11/Rtl1 KO mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Paternally expressed 11/Retrotransposon-like 1 (Peg11/Rtl1) knockout (KO) mice show mid- to late fetal lethality or late fetal growth retardation associated with frequent neonatal lethality."
    explanation: Rtl1 knockout causes fetal growth retardation.
  - reference: PMID:18176565
    reference_title: "Role of retrotransposon-derived imprinted gene, Rtl1, in the feto-maternal interface of mouse placenta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate that retrotransposon-derived Rtl1 (retrotransposon-like 1), also known as Peg11 (paternally expressed 11), is essential for maintenance of the fetal capillaries, and that both its loss and its overproduction cause late-fetal and/or neonatal lethality in mice."
    explanation: Rtl1 is essential for fetal capillary maintenance.
  downstream:
  - target: Prenatal growth failure
    description: Placental insufficiency is proposed to contribute to fetal growth restriction.
- name: Neonatal Skeletal Muscle Hypoplasia
  biological_scale: TISSUE
  description: >-
    Paternal Rtl1 deletion in mice gives significantly thinner muscle fibers in
    the intercostal, diaphragm and limb muscles and neonatal lethality on a
    C57BL/6 background; F1 hybrids instead show growth retardation resembling
    Temple syndrome. These defects are proposed to cause the infantile
    hypotonia and poor sucking of Temple syndrome.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle tissue development
    term:
      id: GO:0007519
      label: skeletal muscle tissue development
    modifier: DECREASED
  evidence:
  - reference: PMID:32878913
    reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Pat-Rtl1Δ mice exhibited significantly thinner muscle fibers compared with the wild-type controls"
    explanation: Rtl1 loss produces thin muscle fibers.
  - reference: PMID:32878913
    reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "thus indicating that the loss of RTL1 is a major cause of muscular hypotonia and feeding difficulty/poor sucking function seen in Temple syndrome"
    explanation: Authors infer from the mouse model that RTL1 loss underlies hypotonia and poor sucking in patients.
  downstream:
  - target: Hypotonia
    description: Weak skeletal muscle produces infantile hypotonia.
  - target: Feeding difficulties in infancy
    description: Muscle weakness contributes to poor sucking.
  - target: Motor delay
    description: Hypotonia delays gross motor milestones.

      explanation: Growth failure, precocious puberty and early cardiometabolic disease make endocrine and metabolic care central.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100507
      label: multiple congenital anomalies due to 14q32.2 paternally expressed gene defect
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary disease_term. MONDO:0100507 carries "Temple syndrome" as an exact
      synonym, defines Temple syndrome as caused by absent paternally derived
      imprinting signals, and sits beside the reciprocal Kagami-Ogata class
      (MONDO:0016779) under MONDO:0100499 "multiple congenital anomalies due to
      14q32.2 imprinting defect". It is also the term
      Silver_Russell_Syndrome.yaml uses for its Temple syndrome differential.
  - term:
      id: MONDO:0014541
      label: motor developmental delay due to 14q32.2 paternally expressed gene defect
    mapping_predicate: skos:exactMatch
    mapping_source: Orphanet ORPHA:254516
    mapping_justification: >-
      MONDO:0014541 describes the same disease and is effectively a MONDO
      near-duplicate of MONDO:0100507: it carries the OMIM (616222, Temple
      syndrome) and Orphanet (ORPHA:254516) xrefs, has the maternal UPD14,
      paternal 14q32.2 microdeletion and paternal hypomethylation classes as
      children, and Orphanet maps ORPHA:254516 to it as exact. It was not chosen
      as the primary term because its label ("motor developmental delay") and
      its definition (a cause of obesity from maternal UPD14) describe a single
      feature and a single mechanism rather than the syndrome, and because it
      is not grouped with Kagami-Ogata syndrome under the 14q32.2 imprinting
      defect parent. Recorded as exactMatch so the duplicate is retired from
      the curation queue rather than curated a second time.
  - term:
      id: MONDO:0019915
      label: maternal uniparental disomy of chromosome 14
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Maternal UPD14 is one molecular cause of Temple syndrome, curated here as
      a subtype, so the mapped class is narrower than the entry.

definitions:
- name: Molecular definition
  definition_type: CASE_DEFINITION
  description: >-
    The diagnosis is established in a person with suggestive findings who has
    hypomethylation of the MEG3:TSS-DMR due to maternal UPD14, constitutional
    or mosaic hypomethylation of the paternal IG-DMR and MEG3-DMR, or a
    paternally inherited 14q32 deletion including DLK1.
  evidence:
  - reference: PMID:41926606
    reference_title: Temple Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of Temple syndrome is established in a proband with suggestive findings who has hypomethylation of the MEG3:transcriptional start site (TSS)-differentially methylated region (DMR) identified by molecular genetic testing"
    explanation: GeneReviews defines the diagnosis by MEG3:TSS-DMR hypomethylation.
has_subtypes:
- name: UPD(14)mat
  display_name: Maternal uniparental disomy of chromosome 14
  classification: molecular
  subtype_frequency: 23 of 32 patients in a Japanese series
  subtype_term:
    preferred_term: maternal uniparental disomy of chromosome 14
    term:
      id: MONDO:0019915
      label: maternal uniparental disomy of chromosome 14
  description: >-
    Both chromosomes 14 are maternal, so the paternally expressed genes DLK1 and
    RTL1 are not expressed. Robertsonian translocations involving chromosome 14
    predispose to UPD.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the total of 32 patients was made up of 23 patients with maternal uniparental disomy (UPD(14)mat), six patients with epimutations, and three patients with microdeletions"
    explanation: Gives the relative frequency of the three molecular causes.
- name: Paternal epimutation
  display_name: Hypomethylation of the paternal IG-DMR and MEG3-DMR
  classification: molecular
  subtype_frequency: 6 of 32 patients in a Japanese series
  subtype_term:
    preferred_term: paternal 14q32.2 hypomethylation syndrome
    term:
      id: MONDO:0016782
      label: paternal 14q32.2 hypomethylation syndrome
  description: >-
    The paternal DMRs lose methylation, silencing the paternally expressed
    genes; epimutations may be mosaic and can occur within multilocus
    imprinting disturbance.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the total of 32 patients was made up of 23 patients with maternal uniparental disomy (UPD(14)mat), six patients with epimutations, and three patients with microdeletions"
    explanation: Six of 32 patients had epimutations.
- name: Paternal microdeletion
  display_name: Paternally inherited 14q32.2 microdeletion
  classification: molecular
  subtype_frequency: 3 of 32 patients in a Japanese series
  subtype_term:
    preferred_term: paternal 14q32.2 microdeletion syndrome
    term:
      id: MONDO:0016780
      label: paternal 14q32.2 microdeletion syndrome
  description: >-
    Deletion of the paternally inherited region including DLK1. A family history
    of Kagami-Ogata syndrome through the same deletion transmitted maternally is
    an indication for testing.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for TS14 should be considered in patients with growth failure plus both PWS-like hypotonia and SRS-like phenotypes in infancy, and/or precocious puberty, as well as a familial history of Kagami-Ogata syndrome due to maternal microdeletion at 14q32.2."
    explanation: A family history of KOS through a maternal microdeletion indicates possible paternal-deletion TS in relatives.
inheritance:
- name: Imprinted, usually sporadic
  inheritance_term:
    preferred_term: Imprinted
    term:
      id: HP:0034338
      label: Imprinted
  parent_of_origin_effect: >-
    Disease results from loss of the paternal 14q32.2 contribution (maternal
    UPD14, or hypomethylation or deletion on the paternal allele). A deletion
    of the region transmitted maternally causes Kagami-Ogata syndrome instead.
  description: >-
    Most probands are simplex cases from an epigenetic or de novo event.
    Recurrence risk of up to 50% applies when a parent carries a Robertsonian
    translocation or a 14q32 deletion, or when multilocus imprinting
    disturbance has a genetic cause.
  evidence:
  - reference: PMID:41926606
    reference_title: Temple Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A proband with TS14 typically represents a simplex case and has the disorder as the result of an epigenetic or de novo event resulting in hypomethylation of MEG3:TSS-DMR."
    explanation: Supports mostly sporadic occurrence.
  - reference: PMID:41926606
    reference_title: Temple Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "TS14 can occur as a result of a predisposing genetic alteration (e.g., a Robertsonian translocation involving chromosome 14 or a deletion involving chromosome 14q32) that can be associated with up to a 50% recurrence risk"
    explanation: Supports increased recurrence risk with predisposing alterations.

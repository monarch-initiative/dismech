differential_diagnoses:
- name: Kagami-Ogata syndrome
  disease_term:
    preferred_term: Kagami-Ogata syndrome
    term:
      id: MONDO:0016779
      label: multiple congenital anomalies due to 14q32.2 maternally expressed gene defect
  description: >-
    The reciprocal 14q32.2 imprinting disorder, caused by paternal UPD14 or
    loss of the maternal contribution, with RTL1 excess, a bell-shaped thorax,
    abdominal wall defects and polyhydramnios.
  distinguishing_features:
  - Opposite parent-of-origin defect (paternal UPD14, maternal deletion, or IG-DMR/MEG3-DMR hypermethylation).
  - Preserved or increased birth size with placentomegaly, coat-hanger ribs and frequent need for ventilation.
  evidence:
  - reference: PMID:32592473
    reference_title: "Temple syndrome and Kagami-Ogata syndrome: clinical presentations, genotypes, models and mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "TS most frequently arises from maternal UPD14 or epimutations/deletions on the paternal chromosome, whereas KOS most frequently arises from paternal UPD14 or epimutations/deletions on the maternal chromosome."
    explanation: Contrasts the reciprocal molecular causes of TS and KOS.
- name: Silver-Russell syndrome
  description: >-
    An 11p15.5 / chromosome 7 imprinting disorder sharing prenatal and
    postnatal growth failure, relative macrocephaly and feeding difficulty;
    about half of Temple syndrome patients have an SRS-like phenotype in
    infancy.
  distinguishing_features:
  - Caused by 11p15.5 IC1 loss of methylation or maternal UPD7 rather than a 14q32.2 defect.
  - Early central puberty and marked hypotonia favour Temple syndrome.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical studies revealed both Prader-Willi syndrome (PWS)-like marked hypotonia and Silver-Russell syndrome (SRS)-like phenotype in 50% of patients, PWS-like hypotonia alone in 20% of patients, SRS-like phenotype alone in 20% of patients, and nonsyndromic growth failure in the remaining 10% of patients in infancy"
    explanation: Quantifies SRS-like and PWS-like presentations in infancy.
- name: Prader-Willi syndrome
  description: >-
    A 15q11-q13 imprinting disorder sharing infantile hypotonia, feeding
    difficulty, small hands and feet, short stature and obesity.
  distinguishing_features:
  - Normal 15q11-q13 (SNURF:TSS-DMR) methylation.
  - Precocious rather than delayed puberty, and absence of hyperphagia-driven features seen in older PWS patients.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of PWS-like features prompting genetic diagnosis, marked hypotonia in infancy was prevalent, whereas clinical features characteristic of aged PWS patients (≥13 years) were absent."
    explanation: Distinguishes TS from older PWS phenotypes.
animal_models:
- name: Rtl1 paternal-deletion (Pat-Rtl1 delta, Rtl1 KO) mouse
  species: Mouse
  genotype: Paternally transmitted deletion of Rtl1 (loss of Rtl1 expression)
  background: C57BL/6J backcross; F1 hybrids with other strains
  publication: PMID:32878913
  description: >-
    Paternal transmission of an Rtl1 deletion abolishes Rtl1 expression. On a
    C57BL/6 background mice show placental fetal capillary damage, thin muscle
    fibers and late-fetal or neonatal lethality; F1 hybrids survive with
    neonatal and postnatal growth retardation resembling Temple syndrome.
  genes:
  - preferred_term: Rtl1
    term:
      id: hgnc:14665
      label: RTL1
  modeled_mechanisms:
  - target: Neonatal Skeletal Muscle Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      Mice show late-fetal or neonatal lethality that patients do not; the
      severity is a genetic background effect.
    evidence:
    - reference: PMID:32878913
      reference_title: Deficiency and overexpression of Rtl1 in the mouse cause distinct muscle abnormalities related to Temple and Kagami-Ogata syndromes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The individuals with Temple syndrome frequently exhibit muscular hypotonia and feeding difficulty/poor sucking function in early childhood, consistent with the muscle abnormalities in the Pat-Rtl1Δ mice."
      explanation: The Pat-Rtl1 delta muscle phenotype corresponds to the hypotonia of Temple syndrome.
  - target: Placental Fetal Capillary Insufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: Mouse labyrinthine placenta differs in structure from the human villous placenta, and human Temple syndrome placentas have not been studied in comparable detail.
    evidence:
    - reference: PMID:28111885
      reference_title: Severe damage to the placental fetal capillary network causes mid- to late fetal lethality and reduction in placental size in Peg11/Rtl1 KO mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we re-examined KO fetuses and placentas and confirmed that the severe clogging of fetal capillaries was associated with KO fetuses showing mid-fetal lethality with internal bleeding."
      explanation: Rtl1 loss damages placental fetal capillaries.
references:
- reference: PMID:41926606
  title: Temple Syndrome.
  tags:
  - GeneReviews
notes: >-
  RTL1 is a member of the mammal-specific SIRH/RTL (sushi-ichi retrotransposon
  homologue) gene family. Genes in this entry are recorded as dosage-sensitive
  imprinted genes, not as Mendelian causal genes: the disease is defined by the
  parent-of-origin state of the 14q32.2 region rather than by a coding variant.
  DLK1 loss is considered the main human driver; the RTL1 contribution rests on
  mouse models.

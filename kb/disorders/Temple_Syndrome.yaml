name: Temple Syndrome
creation_date: "2026-10-24T12:00:00Z"
category: Mendelian
description: >-
  Temple syndrome is a rare congenital imprinting disorder of the chromosome
  14q32.2 DLK1-DIO3 imprinted region, caused by maternal uniparental disomy 14,
  by loss of methylation (epimutation) of the normally methylated paternal
  IG-DMR and MEG3-DMR, or by deletion of the paternally inherited region. The
  result is silencing or loss of the paternally expressed protein-coding genes
  DLK1 and RTL1 (PEG11), together with biallelic expression of the maternal
  noncoding transcripts. Loss of DLK1 is thought to account for most of the
  growth, puberty and metabolic phenotype, while loss of the
  retrotransposon-derived RTL1 has been linked to the hypotonia and poor
  feeding through mouse models. Affected individuals have prenatal and postnatal growth failure,
  marked infantile hypotonia with feeding difficulty and motor delay, small
  hands and feet, early central puberty, short adult stature and truncal
  obesity with cardiometabolic risk. It is the reciprocal disorder of
  Kagami-Ogata syndrome and overlaps clinically with Silver-Russell and
  Prader-Willi syndromes.
disease_term:
  preferred_term: Temple syndrome
  term:

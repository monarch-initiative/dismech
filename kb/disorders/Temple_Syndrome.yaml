diagnosis:
- name: Methylation testing of the 14q32.2 DMRs
  diagnosis_term:
    preferred_term: DNA methylation analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  description: >-
    Methylation analysis of the MEG3:TSS-DMR (and IG-DMR) detects all three
    molecular classes irrespective of karyotype; UPD, epimutation and deletion
    are then distinguished by genotyping and copy-number analysis. Testing is
    indicated in growth failure with infantile PWS-like hypotonia and SRS-like
    features, in precocious puberty, and in relatives of KOS cases with a
    maternal microdeletion. Prenatal methylation testing of fetal DNA is not
    recommended.
  evidence:
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "epimutations as well as UPD(14)mat and microdeletions can be identified at present by methylation analysis of the DMRs, irrespective of the karyotype"
    explanation: DMR methylation analysis detects all three molecular causes.
  - reference: PMID:28640239
    reference_title: "Temple syndrome: comprehensive molecular and clinical findings in 32 Japanese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for TS14 should be considered in patients with growth failure plus both PWS-like hypotonia and SRS-like phenotypes in infancy, and/or precocious puberty, as well as a familial history of Kagami-Ogata syndrome due to maternal microdeletion at 14q32.2."
    explanation: Clinical indications for testing.
  - reference: PMID:41926606
    reference_title: Temple Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Methylation testing of fetal DNA to examine abnormal methylation patterns of the DMRs (MEG3/DLK1:IG-DMR and MEG3:TSS-DMR) is not recommended."
    explanation: Prenatal methylation testing is not recommended.

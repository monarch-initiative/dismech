    reference_title: "Disruption of the ProSAP2 gene in a t(12;22)(q24.1;q13.3) is associated with the 22q13.3 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH investigations revealed that the translocation was reciprocal, with the chromosome 22 breakpoint within the 22q subtelomeric cosmid 106G1220 and the chromosome 12q breakpoint near STS D12S317."
    explanation: Confirms high-resolution localization of the 22q13.3 breakpoint using subtelomeric FISH probes.
differential_diagnoses:
- name: Angelman syndrome
  description: >
    Shares neonatal hypotonia, severe global developmental delay, absent or
    minimal speech, seizures, and autistic features with Phelan-McDermid
    syndrome, making PMS a major Angelman-like mimic in early childhood.
  distinguishing_features:
  - Angelman syndrome is caused by loss of maternally expressed UBE3A at chromosome 15q11-q13 rather than 22q13.3 deletion or SHANK3 haploinsufficiency
  - Angelman syndrome typically features microcephaly, characteristic ataxic gait, frequent laughter, and signature EEG patterns, whereas Phelan-McDermid syndrome shows normal or accelerated growth, large fleshy hands, and dysplastic toenails
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The differential diagnosis includes Angelman syndrome, velocardiofacial syndrome, fragile X syndrome, and FG syndrome."
    explanation: Phelan and McDermid explicitly list Angelman syndrome in the differential diagnosis of 22q13.3 deletion syndrome.
  - reference: PMID:24779060
    reference_title: "If not Angelman, what is it? A review of Angelman-like syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Angelman syndrome (AS) is caused by a lack of expression of the maternally inherited UBE3A gene in the brain."
    explanation: Distinguishes Angelman syndrome at the molecular level (maternal UBE3A deficiency) from Phelan-McDermid syndrome (22q13.3/SHANK3 haploinsufficiency).
- name: Velocardiofacial syndrome
  description: >
    Chromosome 22q11.2 deletion syndrome that can overlap with Phelan-McDermid
    syndrome in hypotonia, developmental and speech delay, renal anomalies, and
    neuropsychiatric manifestations.
  distinguishing_features:
  - Caused by interstitial deletion at chromosome 22q11.2 rather than distal 22q13.3 deletion encompassing SHANK3
  - Classically presents with conotruncal cardiac defects, palatal anomalies, hypocalcemia, and T-cell immunodeficiency
  disease_term:
    preferred_term: velocardiofacial syndrome
    term:
      id: MONDO:0008644
      label: velocardiofacial syndrome
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The differential diagnosis includes Angelman syndrome, velocardiofacial syndrome, fragile X syndrome, and FG syndrome."
    explanation: Phelan and McDermid identify velocardiofacial syndrome as a principal differential diagnosis of 22q13.3 deletion syndrome.
- name: Fragile X syndrome
  description: >
    Presents with developmental delay, intellectual disability, delayed speech,
    autistic behaviors, and joint hypermobility overlapping with Phelan-McDermid
    syndrome.
  distinguishing_features:
  - Caused by FMR1 CGG trinucleotide repeat expansion on Xq27.3 rather than 22q13.3/SHANK3 haploinsufficiency
  - Typically lacks the profound neonatal hypotonia and complete absence of speech characteristic of Phelan-McDermid syndrome
  disease_term:
    preferred_term: fragile X syndrome
    term:
      id: MONDO:0010383
      label: fragile X syndrome
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The differential diagnosis includes Angelman syndrome, velocardiofacial syndrome, fragile X syndrome, and FG syndrome."
    explanation: Phelan and McDermid include fragile X syndrome in the clinical differential diagnosis of Phelan-McDermid syndrome.
- name: FG syndrome 1
  description: >
    X-linked neurodevelopmental syndrome sharing neonatal hypotonia, delayed
    speech and motor development, intellectual disability, and gastrointestinal
    dysmotility/constipation with Phelan-McDermid syndrome.
  distinguishing_features:
  - Caused by X-linked MED12 variants rather than chromosome 22q13.3 deletion or SHANK3 mutation
  - Associated with imperforate anus, agenesis of the corpus callosum, and characteristic facial features
  disease_term:
    preferred_term: FG syndrome 1
    term:
      id: MONDO:0010590
      label: FG syndrome 1
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The differential diagnosis includes Angelman syndrome, velocardiofacial syndrome, fragile X syndrome, and FG syndrome."
    explanation: Phelan and McDermid list FG syndrome in the differential diagnosis of 22q13.3 deletion syndrome.

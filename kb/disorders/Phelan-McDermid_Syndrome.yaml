- name: Insulin-like growth factor 1 (IGF-1) therapy
  description: >
    IGF-1 has been investigated as a targeted treatment for PMS. Preclinical
    studies showed that IGF-1 restores excitatory synaptic deficits in
    iPSC-derived PMS neurons. A pilot controlled trial in children showed
    improvement in social impairment and restrictive behaviors.
  action_category: THERAPEUTIC
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: recombinant human IGF-1 pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mecasermin (recombinant human IGF-1)
      term:
        id: NCIT:C2262
        label: Mecasermin
  target_mechanisms:
  - target: Excitatory-inhibitory imbalance
    description: >
      IGF-1 restores excitatory synaptic transmission in PMS patient-derived
      neurons by promoting mature AMPA and NMDA receptor-mediated signaling.
    evidence:
    - reference: PMID:24132240
      reference_title: "SHANK3 and IGF1 restore synaptic deficits in neurons from 22q13 deletion syndrome patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Excitatory synaptic transmission in PMDS neurons can be corrected by restoring SHANK3 expression or by treating neurons with insulin-like growth factor 1 (IGF1)."
      explanation: Demonstrates rescue of excitatory synaptic transmission by IGF-1 in patient-derived neurons.
  - target: Excitatory synapse structural deficit
    description: >
      In iPSC-derived neurons from Phelan-McDermid syndrome patients, IGF-1
      restores the number of Synapsin1+/Homer1+ excitatory synaptic puncta to
      control levels and increases the fraction of puncta expressing PSD95 by
      340% while decreasing puncta containing both Homer1 and PSD95.
    evidence:
    - reference: PMID:24132240
      reference_title: "SHANK3 and IGF1 restore synaptic deficits in neurons from 22q13 deletion syndrome patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Only IGF1 increased the number of Synapsin1+/Homer1+ puncta to the levels observed in control neurons in the same culture"
      explanation: Shows that IGF-1 restores the number of Synapsin1+/Homer1+ excitatory synaptic puncta in PMS patient-derived neurons to control levels.
    - reference: PMID:24132240
      reference_title: "SHANK3 and IGF1 restore synaptic deficits in neurons from 22q13 deletion syndrome patients."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "In contrast, IGF1 caused a 45% and 340% increase in the fraction of puncta expressing PSD95 in control and PMDS neurons, respectively, while decreasing the number of puncta containing both markers"
      explanation: Demonstrates that IGF-1 increases the fraction of PSD95+ excitatory synaptic puncta while reducing Homer1+/PSD95+ double-positive puncta in PMS neurons.
  target_phenotypes:
  - preferred_term: Autism
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:24132240
    reference_title: "SHANK3 and IGF1 restore synaptic deficits in neurons from 22q13 deletion syndrome patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Excitatory synaptic transmission in PMDS neurons can be corrected by restoring SHANK3 expression or by treating neurons with insulin-like growth factor 1 (IGF1)."
    explanation: Shcheglovitov et al. demonstrated in Nature that IGF-1 rescues synaptic deficits in iPSC-derived neurons from PMS patients, providing the preclinical rationale.
  - reference: PMID:25685306
    reference_title: "A pilot controlled trial of insulin-like growth factor-1 in children with Phelan-McDermid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to the placebo phase, the IGF-1 phase was associated with significant improvement in both social impairment and restrictive behaviors, as measured by the Aberrant Behavior Checklist and the Repetitive Behavior Scale, respectively."
    explanation: Kolevzon et al. conducted the first controlled trial of IGF-1 in 9 PMS children, showing significant improvement in social and behavioral domains.
- name: Multidisciplinary surveillance and thermal/injury precautions
  description: >
    Routine multidisciplinary monitoring of growth, nutrition, gastroesophageal
    reflux, seizures, developmental regression, neurobehavioral symptoms, and
    sleep disturbances; annual neurological, brain MRI, audiological, and
    ophthalmological NF2 surveillance in individuals with ring chromosome 22;
    and avoidance of extreme temperatures, tight footwear/clothing, and
    radiotherapy (in ring chromosome 22) due to hypohidrosis, reduced pain
    sensitivity, and NF2 tumor susceptibility.
  action_category: MONITORING
  treatment_term:
    preferred_term: Multidisciplinary supportive care and surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "At each visit, measurement of growth parameters; evaluation of nutritional status and safety of oral intake; monitor for signs/symptoms of GERD; monitor for new manifestations, such as seizures, changes in tone, and developmental regression; monitor developmental progress and educational needs; evaluate for neurobehavioral issues, such as anxiety, ADHD, autism, aggression, and self-injury; monitor for signs/symptoms of sleep apnea and sleep disturbance."
    explanation: GeneReviews outlines the longitudinal clinical surveillance protocol for developmental, neurological, gastrointestinal, and behavioral manifestations in PMS.
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In those with a ring chromosome 22, perform annual neurologic examination by a provider with experience with NF2; brain MRI annually beginning at age 10-12 years until fourth decade of life; annual audiology evaluation, including BAER, to assess for the earliest symptoms of vestibular schwannomas; annual ophthalmology evaluation."
    explanation: GeneReviews specifies annual NF2-focused neurological, neuroimaging, audiological, and ophthalmological surveillance for individuals with ring chromosome 22.
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Exposure to high temperatures and extended periods in the sun due to reduced perspiration and tendency to overheat easily; exposure to excessive heat or cold, sharp objects, or clothes/shoes that may be too tight and cause skin lesions due to decreased perception of pain; radiotherapy for NF2-associated tumors in those with a ring chromosome 22."
    explanation: GeneReviews details key environmental and clinical precautions for hypohidrosis, decreased pain perception, and NF2 radiosensitivity in ring chromosome 22.
diagnosis:
- name: Chromosomal microarray (array CGH)
  description: >
    First-tier diagnostic test for detecting terminal and interstitial 22q13.3
    deletions encompassing SHANK3 (<50 kb to >9 Mb), which account for the
    majority of Phelan-McDermid syndrome cases. Detection of a terminal 22q13.3
    deletion by microarray requires follow-up karyotyping to screen for ring
    chromosome 22.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis (array CGH)
    term:
      id: NCIT:C198497
      label: Array-based Comparative Genomic Hybridization
  results: >
    Detection of heterozygous deletion at chromosome 22q13.3 (ranging from
    <50 kb to >9 Mb) encompassing at least part of SHANK3.
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of PMS-SHANK3 related is established in a proband with suggestive findings and either (1) a <50-kb to >9-Mb heterozygous deletion at chromosome 22q13.3 with involvement of at least part of SHANK3; (2) a heterozygous pathogenic variant in SHANK3; OR (3) a chromosomal rearrangement with breakpoints disrupting SHANK3 identified by molecular genetic testing."
    explanation: GeneReviews defines the molecular diagnostic criteria for Phelan-McDermid syndrome, including 22q13.3 deletions involving SHANK3.
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most probands have a de novo deletion; some probands have the deletion as the result of an unbalanced structural rearrangement that includes 22q13 (about half of these individuals have a parent who is a carrier of a balanced translocation) or a ring chromosome 22 (karyotype screening of the proband for a ring chromosome 22 must be done if a terminal 22q13.3 deletion is detected by CMA)."
    explanation: Establishes chromosomal microarray (CMA) detection of terminal 22q13.3 deletions and the requirement for follow-up karyotype screening for ring chromosome 22.
- name: SHANK3 sequence analysis
  description: >
    Gene-targeted sequencing, multigene neurodevelopmental panels, or exome/genome
    sequencing to detect intragenic pathogenic SHANK3 point mutations (nonsense,
    frameshift, missense, or splice-site variants) that are not detectable by
    chromosomal microarray.
  diagnosis_term:
    preferred_term: SHANK3 molecular genetic sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  results: >
    Identification of a heterozygous pathogenic single-nucleotide variant or
    small indel in SHANK3.
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of PMS-SHANK3 related is established in a proband with suggestive findings and either (1) a <50-kb to >9-Mb heterozygous deletion at chromosome 22q13.3 with involvement of at least part of SHANK3; (2) a heterozygous pathogenic variant in SHANK3; OR (3) a chromosomal rearrangement with breakpoints disrupting SHANK3 identified by molecular genetic testing."
    explanation: GeneReviews establishes identification of a heterozygous pathogenic variant in SHANK3 by molecular genetic testing as a primary diagnostic criterion.
  - reference: PMID:29719671
    reference_title: "Delineation of the genetic and clinical spectrum of Phelan-McDermid syndrome caused by SHANK3 point mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of SHANK3 resulting from point mutations is sufficient to cause a broad range of features associated with PMS."
    explanation: Demonstrates that intragenic SHANK3 point mutations cause Phelan-McDermid syndrome and require sequence analysis for diagnosis.
- name: Karyotyping
  description: >
    Cytogenetic G-banded karyotyping detects ring chromosome 22 and balanced or
    unbalanced translocations involving 22q13.3, and is mandatory when a
    terminal 22q13.3 deletion is identified by chromosomal microarray to rule
    out ring chromosome 22 and associated NF2 risk.
  diagnosis_term:
    preferred_term: cytogenetic karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: >
    Detection of ring chromosome 22 or 22q13.3 translocation breakpoint.
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most probands have a de novo deletion; some probands have the deletion as the result of an unbalanced structural rearrangement that includes 22q13 (about half of these individuals have a parent who is a carrier of a balanced translocation) or a ring chromosome 22 (karyotype screening of the proband for a ring chromosome 22 must be done if a terminal 22q13.3 deletion is detected by CMA)."
    explanation: GeneReviews mandates karyotype screening for ring chromosome 22 whenever a terminal 22q13.3 deletion is detected by chromosomal microarray.
  - reference: PMID:11431708
    reference_title: "Disruption of the ProSAP2 gene in a t(12;22)(q24.1;q13.3) is associated with the 22q13.3 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's karyotype showed a de novo balanced translocation between chromosomes 12 and 22, with the breakpoint in the 22q13.3 critical region of the 22q distal deletion syndrome"
    explanation: Demonstrates the use of karyotyping to identify chromosome 22q13.3 rearrangements disrupting SHANK3/ProSAP2.
- name: Fluorescence in situ hybridization (FISH)
  description: >
    Targeted subtelomeric 22q13.3 fluorescence in situ hybridization detects
    cryptic terminal 22q13.3 deletions and localizes translocation breakpoints
    disrupting SHANK3.

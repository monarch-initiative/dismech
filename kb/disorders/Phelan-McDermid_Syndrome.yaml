name: Phelan-McDermid Syndrome
creation_date: '2026-04-06T19:41:20Z'
category: Mendelian
description: >
  Phelan-McDermid syndrome (PMS), also known as 22q13.3 deletion syndrome, is a
  neurodevelopmental disorder caused by haploinsufficiency of the SHANK3 gene on
  chromosome 22q13.3. It can result from terminal deletions, ring chromosome 22,
  unbalanced translocations, or intragenic SHANK3 mutations. PMS is characterized
  by neonatal hypotonia, global developmental delay, absent or severely delayed
  speech, intellectual disability, and autism spectrum features. SHANK3 encodes a
  postsynaptic scaffolding protein critical for glutamatergic synapse formation
  and function. Additional features may include renal anomalies, lymphedema,
  seizures, and neuropsychiatric decompensation in adolescence and adulthood.
  Over 600 cases have been documented, though the condition is likely underdiagnosed.
disease_term:
  preferred_term: Phelan-McDermid syndrome
  term:
    id: MONDO:0011652
    label: Phelan-McDermid syndrome
parents:
- 22q13.3 microdeletion syndrome
- SHANK3-related neurodevelopmental disorder
synonyms:
- 22q13.3 deletion syndrome
- Phelan-McDermid syndrome
- SHANK3-related Phelan-McDermid syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: Contiguous gene deletion or monogenic SHANK3 haploinsufficiency disorder on chromosome 22q13.3.
    evidence:
    - reference: PMID:22670140
      reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The 22q13.3 deletion syndrome, also known as Phelan-McDermid syndrome, is a contiguous gene disorder resulting from deletion of the distal long arm of chromosome 22."
      explanation: Establishes Phelan-McDermid syndrome as a genetic disorder caused by 22q13.3 deletions or SHANK3 haploinsufficiency.
  - classification_value: NEUROLOGIC
    notes: Characterized primarily by neurodevelopmental and neurological deficits including hypotonia, absent speech, intellectual disability, and seizures.
    evidence:
    - reference: PMID:22670140
      reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "In addition to normal growth and a constellation of minor dysmorphic features, this syndrome is characterized by neurological deficits which include global developmental delay, moderate to severe intellectual impairment, absent or severely delayed speech, and neonatal hypotonia."
      explanation: Confirms the primary neurological classification of the disorder.
prevalence:
- population: Worldwide (documented cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Over 600 cases of 22q13.3 deletion syndrome have been documented in the
    literature, though the condition is substantially underdiagnosed due to the
    cryptic nature of terminal 22q13.3 deletions on standard karyotyping.
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Over 600 cases of 22q13.3 deletion syndrome have been documented."
    explanation: Phelan and McDermid report more than 600 documented cases of 22q13.3 deletion syndrome worldwide.
- population: Individuals with autism spectrum disorder
  measure_type: UNKNOWN
  notes: >
    SHANK3 deletions and mutations account for at least 0.5% of cases of autism
    spectrum disorder (a conditional case fraction within ASD cohorts rather
    than a general-population point prevalence).
  evidence:
  - reference: PMID:25685306
    reference_title: "A pilot controlled trial of insulin-like growth factor-1 in children with Phelan-McDermid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "SHANK3 deletions and mutations disrupt synaptic function and result in Phelan-McDermid syndrome (PMS), which causes a monogenic form of ASD with a frequency of at least 0.5% of ASD cases."
    explanation: Kolevzon et al. report that Phelan-McDermid syndrome accounts for at least 0.5% of autism spectrum disorder cases.
progression:
- phase: Neonatal and infantile presentation
  age_range: Neonatal period through infancy
  notes: >
    Typically presents at birth or in early infancy with central hypotonia,
    feeding difficulties, and global developmental delay affecting motor and
    early communication milestones.
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "this syndrome is characterized by neurological deficits which include global developmental delay, moderate to severe intellectual impairment, absent or severely delayed speech, and neonatal hypotonia"
    explanation: Neonatal hypotonia and early global developmental delay mark the initial clinical phase of Phelan-McDermid syndrome.
- phase: Childhood and age-dependent clinical evolution
  age_range: Childhood through adulthood
  notes: >
    With increasing age, hypotonia and joint laxity often become less prominent
    and developmental abilities may modestly improve, whereas the prevalence of
    autism spectrum disorder diagnoses, seizures, cellulitis, and lymphedema
    increases in older cohorts.
  evidence:
  - reference: PMID:24481935
    reference_title: "Clinical and genomic evaluation of 201 patients with Phelan-McDermid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering different age groups, in older patients, behavioral problems tended to subside, developmental abilities improved, and some features such as large or fleshy hands, full or puffy eyelids, hypotonia, lax ligaments, and hyperextensible joints were less frequent. However, the proportion reporting an autism spectrum disorder, seizures, and cellulitis, or presenting with lymphedema or abnormal reflexes increased with age."
    explanation: Cross-sectional evaluation of 201 patients defines the age-related shifts in clinical features across childhood and adulthood.
- phase: Adolescent and adult neuropsychiatric decompensation
  age_range: Adolescence and adulthood (mean onset around 20 years)
  notes: >
    A subset of patients experience acute or subacute neuropsychiatric
    decompensation beginning in adolescence or adulthood, characterized by
    bipolar-like mood episodes, catatonia, psychosis, and regression of motor,
    language, and daily living skills, often triggered by infections, seizures,
    or environmental changes.
  evidence:
  - reference: PMID:31879555
    reference_title: "Neuropsychiatric decompensation in adolescents and adults with Phelan-McDermid syndrome: a systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical presentations included features of bipolar disorder, catatonia, psychosis, and loss of skills"
    explanation: Systematic review of 56 cases characterizes the adolescent and adult neuropsychiatric decompensation phase.
  - reference: PMID:31879555
    reference_title: "Neuropsychiatric decompensation in adolescents and adults with Phelan-McDermid syndrome: a systematic review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority of cases, no apparent cause could be identified; in others, symptoms appeared after acute events, such as infections, prolonged or particularly intense seizures, or changes in the individual's environment."
    explanation: Documents the acute precipitating triggers of late-onset neuropsychiatric regression in PMS.
has_subtypes:
- name: 22q13.3 deletion
  subtype_term:
    preferred_term: Phelan-McDermid syndrome due to 22q13.3 deletion
    term:
      id: MONDO:0971068
      label: Phelan-McDermid syndrome due to 22q13.3 deletion
  genes:
  - preferred_term: SHANK3
    term:
      id: hgnc:14294
      label: SHANK3
  description: >
    The most common form (~89% of cases), caused by terminal deletions of
    chromosome 22q13.3 encompassing the SHANK3 gene. Deletion size is variable
    (100 kb to >9 Mb) and may include additional genes contributing to
    phenotypic variability. De novo deletions are predominantly of paternal
    origin.
  evidence:
  - reference: PMID:24481935
    reference_title: "Clinical and genomic evaluation of 201 patients with Phelan-McDermid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "22q13 genomic anomalies include terminal deletions of 22q13 (89 %), terminal deletions and interstitial duplications (9 %), and interstitial deletions (2 %)."
    explanation: The largest PMS cohort study (201 patients) established that 89% of cases have terminal 22q13 deletions.
- name: SHANK3 point mutation
  subtype_term:
    preferred_term: Phelan-McDermid syndrome due to SHANK3 mutation
    term:
      id: MONDO:0971069
      label: Phelan-McDermid syndrome due to SHANK3 mutation
  genes:
  - preferred_term: SHANK3
    term:
      id: hgnc:14294
      label: SHANK3
  description: >
    Caused by pathogenic variants (missense, nonsense, frameshift) within the
    SHANK3 gene itself, without a cytogenetically visible deletion. Individuals
    with point mutations tend to have somewhat milder speech impairment compared
    to those with large deletions.
  evidence:
  - reference: PMID:29719671
    reference_title: "Delineation of the genetic and clinical spectrum of Phelan-McDermid syndrome caused by SHANK3 point mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Haploinsufficiency of SHANK3 resulting from point mutations is sufficient to cause a broad range of features associated with PMS."
    explanation: De Rubeis et al. studied 17 new and 60 previously reported patients with SHANK3 point mutations, confirming that point mutations alone cause PMS.
- name: Ring chromosome 22
  genes:
  - preferred_term: SHANK3
    term:
      id: hgnc:14294
      label: SHANK3
  description: >
    Caused by formation of ring chromosome 22 with loss of distal 22q material
    including SHANK3. Individuals with ring chromosome 22 also have a high risk
    of developing features of NF2-related schwannomatosis. Karyotype screening
    for a ring chromosome 22 is required whenever a terminal 22q13.3 deletion is
    detected by chromosomal microarray, which is how this mechanism is separated
    from a simple terminal deletion in practice.
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Those who have PMS-SHANK3 related due to a ring chromosome 22 also have a high risk of developing features of NF2-related schwannomatosis (NF2)."
    explanation: GeneReviews highlights that individuals with PMS caused by ring chromosome 22 carry an elevated risk of NF2-related schwannomatosis features.
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a heterozygous pathogenic variant in SHANK3; OR (3) a chromosomal rearrangement with breakpoints disrupting SHANK3 identified by molecular genetic testing"
    explanation: >-
      The GeneReviews diagnostic criteria list a chromosomal rearrangement
      disrupting SHANK3 as a third route to the diagnosis, alongside the deletion
      and the intragenic variant that the two rows above cover.
  review_notes: >-
    MONDO gives Phelan-McDermid syndrome (MONDO:0011652) exactly two children,
    MONDO:0971068 (22q13.3 deletion) and MONDO:0971069 (SHANK3 mutation), which
    the two rows above are bound to; neither covers the ring mechanism. MONDO
    does have a class for the chromosome abnormality itself, MONDO:0015438 ring
    chromosome 22, but it is filed under MONDO:0700026 chromosome 22 disorder and
    MONDO:0700091 ring chromosome disorder rather than under Phelan-McDermid
    syndrome, and its equivalence axiom defines it by the chromosome (RO:0004030
    disease arises from alteration in structure, some chromosome 22) rather than
    by a causal gene. Whether to bind it here is a lump and split question about
    a chromosome abnormality versus a syndrome, so this row is left without a
    subtype_term and the option is recorded instead.


    No mechanism is asserted for the NF2 risk. GeneReviews (PMID:20301377)
    states the risk and the resulting NF2 surveillance schedule but not how the
    ring chromosome produces it. In the cached record, which is the GeneReviews
    summary rather than the full chapter, the words somatic and instability do
    not occur at all and mosaic occurs only in the unrelated context of a
    parent who is mosaic for a 22q13.3 deletion.
inheritance:
- name: Autosomal dominant (typically de novo)
  description: >
    PMS follows autosomal dominant inheritance due to haploinsufficiency, but the
    vast majority of cases are de novo. De novo deletions are predominantly of
    paternal origin. Rare familial cases have been reported, including parental
    mosaicism and balanced translocations that segregate in unbalanced form.
  evidence:
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "PMS-SHANK3 related is an autosomal dominant disorder most often caused by a de novo genetic alteration."
    explanation: GeneReviews establishes autosomal dominant inheritance with predominantly de novo occurrence in Phelan-McDermid syndrome.
  - reference: PMID:20301377
    reference_title: "Phelan-McDermid Syndrome-SHANK3 Related."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most probands have a de novo deletion; some probands have the deletion as the result of an unbalanced structural rearrangement that includes 22q13 (about half of these individuals have a parent who is a carrier of a balanced translocation) or a ring chromosome 22 (karyotype screening of the proband for a ring chromosome 22 must be done if a terminal 22q13.3 deletion is detected by CMA)."
    explanation: Summarizes the de novo, parental balanced-translocation, and ring chromosome 22 inheritance mechanisms in 22q13.3 deletion cases.
  - reference: PMID:12920066
    reference_title: "Molecular characterisation of the 22q13 deletion syndrome supports the role of haploinsufficiency of SHANK3/PROSAP2 in the major neurological symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to other terminal deletion syndromes, there was an overabundance of paternal deletions."
    explanation: Wilson et al. found a paternal origin bias in 22q13 deletions across 56 patients.
pathophysiology:
- name: Terminal 22q13.3 Deletion and Adjacent Gene Haploinsufficiency
  description: >
    Most Phelan-McDermid syndrome cases are terminal 22q13.3 deletions that
    include SHANK3 and variably remove adjacent genes. This contiguous-deletion
    branch explains why some non-neurological features, especially renal
    anomalies, are enriched in deletion cases but not clearly attributable to
    SHANK3 point mutations alone.
  evidence:
  - reference: PMID:24481935
    reference_title: "Clinical and genomic evaluation of 201 patients with Phelan-McDermid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "22q13 genomic anomalies include terminal deletions of 22q13 (89 %), terminal deletions and interstitial duplications (9 %), and interstitial deletions (2 %)."
    explanation: The large PMS cohort shows that most cases are terminal 22q13 deletions.
  - reference: PMID:35741804
    reference_title: "State of the Science for Kidney Disorders in Phelan-McDermid Syndrome: UPK3A, FBLN1, WNT7B, and CELSR1 as Candidate Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The scientific literature suggests that up to 40% of individuals with PMS have kidney disorders, yet little research has been conducted on the renal system to assess candidate genes attributed to these disorders."
    explanation: Review evidence supports renal anomalies as a deletion-region feature requiring candidate-gene assessment.
  downstream:
  - target: SHANK3 haploinsufficiency
    description: Terminal 22q13 deletions usually include SHANK3, producing the core synaptic scaffold lesion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22670140
      reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Almost all of these deletions include the gene SHANK3 which encodes a scaffold protein in the postsynaptic densities of excitatory synapses, connecting membrane-bound receptors to the actin cytoskeleton."
      explanation: The review directly links 22q13 deletions to SHANK3 loss.
  - target: Renal anomalies
    description: Adjacent genes within variably sized 22q13 deletions likely contribute to renal anomalies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35741804
      reference_title: "State of the Science for Kidney Disorders in Phelan-McDermid Syndrome: UPK3A, FBLN1, WNT7B, and CELSR1 as Candidate Genes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The scientific literature suggests that up to 40% of individuals with PMS have kidney disorders, yet little research has been conducted on the renal system to assess candidate genes attributed to these disorders."
      explanation: Review evidence supports kidney disorders in PMS and frames candidate genes outside SHANK3.
  - target: Lymphedema
    description: Lymphedema is an age-related feature observed in deletion cohorts.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24481935
      reference_title: "Clinical and genomic evaluation of 201 patients with Phelan-McDermid syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the proportion reporting an autism spectrum disorder, seizures, and cellulitis, or presenting with lymphedema or abnormal reflexes increased with age"
      explanation: The 201-patient cohort supports lymphedema as an age-related PMS feature.
- name: SHANK3 haploinsufficiency
  conforms_to: "excitatory_synapse_scaffold_disruption#Postsynaptic Scaffold Disruption"
  genes:
  - preferred_term: SHANK3
    term:
      id: hgnc:14294
      label: SHANK3
  molecular_functions:
  - preferred_term: SHANK3 postsynaptic scaffold activity
    modifier: DECREASED
    term:
      id: GO:0098919
      label: structural constituent of postsynaptic density
  description: >
    SHANK3 is a master scaffolding protein at the postsynaptic density of
    glutamatergic synapses. It connects membrane-bound receptors including NMDA
    and AMPA receptors to the actin cytoskeleton. Loss of one copy of SHANK3 is
    the primary molecular lesion underlying core neurological features of
    Phelan-McDermid syndrome.
  evidence:
  - reference: PMID:22670140
    reference_title: "The 22q13.3 Deletion Syndrome (Phelan-McDermid Syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all of these deletions include the gene SHANK3 which encodes a scaffold protein in the postsynaptic densities of excitatory synapses, connecting membrane-bound receptors to the actin cytoskeleton."
    explanation: Phelan and McDermid's comprehensive review establishes SHANK3's role as a postsynaptic scaffold protein and its centrality to PMS neurological features.
  - reference: PMID:12920066
    reference_title: "Molecular characterisation of the 22q13 deletion syndrome supports the role of haploinsufficiency of SHANK3/PROSAP2 in the major neurological symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis therefore supports haploinsufficiency of the gene SHANK3, which codes for a structural protein of the postsynaptic density, as a major causative factor in the neurological symptoms of 22q13 deletion syndrome."
    explanation: Wilson et al. found that all 45 testable patients were deleted for SHANK3, supporting its role as the critical gene.
  - reference: PMID:11431708
    reference_title: "Disruption of the ProSAP2 gene in a t(12;22)(q24.1;q13.3) is associated with the 22q13.3 deletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ProSAP2 is a good candidate for this syndrome, because it is preferentially expressed in the cerebral cortex and the cerebellum and encodes a scaffold protein involved in the postsynaptic density of excitatory synapses."
    explanation: First paper linking SHANK3 (ProSAP2) disruption to 22q13.3 deletion syndrome, via a balanced translocation that disrupted the gene.
  cell_types:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both patients exhibited pure red cell aplasia, growth delays, hypogammaglobulinemia, microcephaly, and telomere length between the 1st and 10th percentile"
    explanation: >

genetic:
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Heterozygous germline frameshift variants that truncate the p53 C-terminal
    domain and increase p53 transcriptional activity. The same gene causes
    Li-Fraumeni syndrome through a different allelic class, mainly
    DNA-binding-domain variants that compromise transactivation; the two
    diseases are kept as separate entries.
  review_notes: >-
    `relationship_type: CAUSATIVE` rests on seven patients in four case
    reports, de novo origin where reported, recurrence of C-terminal
    truncation across independent families, and functional reproduction of
    the erythroid defect in zebrafish and human iPSCs. No ClinGen
    gene-disease validity assertion exists for TP53 in this disease; the
    cached ClinGen TP53 record (Definitive) is for Li-Fraumeni syndrome,
    MONDO:0018875, and is not copied here.
  evidence:
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings together with close similarities to published knock-in mouse models of TP53 lacking the CTD demonstrate that the CTD-truncation mutations of TP53 cause IBMFS"
    explanation: >
      The defining report's causal conclusion for C-terminal truncating TP53
      alleles.
  - reference: PMID:35084091
    reference_title: "De novo TP53 germline activating mutations in two patients with the phenotype mimicking Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two patients with the phenotype of DBA (onset of macrocytic anemia within the first year of life, paucity of erythroid precursors in bone marrow) and germline de novo variants in the TP53 gene."
    explanation: >
      Independent replication in two further de novo patients.


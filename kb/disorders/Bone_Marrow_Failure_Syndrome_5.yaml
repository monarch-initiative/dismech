name: Bone Marrow Failure Syndrome 5
creation_date: "2026-10-13T20:15:41Z"
category: Mendelian
disease_term:
  preferred_term: bone marrow failure syndrome 5
  term:
    id: MONDO:0032573
    label: bone marrow failure syndrome 5
description: >
  Bone marrow failure syndrome 5 (BMFS5), also called germline p53 (TP53)
  activation syndrome, is an inherited bone marrow failure syndrome caused by
  heterozygous germline frameshift variants near the 3' end of TP53 that
  truncate the p53 C-terminal domain. It was defined in 2018 in two unrelated
  individuals with de novo variants that both removed the last 32 residues of
  p53; the truncated protein had augmented, not reduced, transcriptional
  activity. The presentation mimics Diamond-Blackfan anaemia (DBA):
  anaemia with a paucity of erythroid precursors (pure red cell aplasia),
  beginning within the first year of life where onset is reported, together
  with hypogammaglobulinaemia, growth retardation and microcephaly. Later
  reports added intellectual disability, seizures, short stature, cellular
  radiosensitivity and transient neutropenia.

  The literature is small. Four case reports describe seven individuals.
  Every allele whose position the abstracts state is a C-terminal
  frameshift; the 2022 abstract describing two further patients
  (PMID:35084091) calls their de novo variants activating without naming
  them.
  Corticosteroid response is inconsistent (one responder, two
  non-responders), two patients became transfusion independent on L-leucine,
  and one patient is reported cured by matched-sibling haematopoietic stem
  cell transplantation.

  BMFS5 is the mechanistic inverse of Li-Fraumeni syndrome. Li-Fraumeni
  variants mostly inactivate the p53 DNA-binding domain and predispose to
  cancer; the BMFS5 alleles truncate the C-terminal domain and raise p53
  transcriptional output. None of the four case-report abstracts reports a
  malignancy, and no source located for this entry addresses cancer risk in
  carriers, so the entry records no cancer phenotype and treats cancer risk
  as an open question. The C-terminally truncated p53-delta-31 mouse, which
  predates the human syndrome, has increased p53 activity and aplastic
  anaemia with features of dyskeratosis congenita when homozygous, but
  heterozygous mice are only mildly affected.
synonyms:
- BMFS5
- germline p53 activation syndrome
- germline TP53 activation syndrome
parents:
- Inherited bone marrow failure syndrome
- Bone marrow failure syndrome
notes: >-
  No GeneReviews chapter names this disease (`just check-genereviews --online`
  returned NO_CHAPTER for the name, MONDO label and synonyms). ClinGen has no
  gene-disease validity assertion for TP53 in this disease; the cached ClinGen
  TP53 record is for Li-Fraumeni syndrome. All four case reports were read as
  PubMed abstracts only, so variant nomenclature for the first five patients,
  exact onset ages and follow-up durations are not recorded here.

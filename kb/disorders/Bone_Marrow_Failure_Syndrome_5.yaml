inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    A single heterozygous germline allele is sufficient. The four patients
    whose origin the abstracts state (PMID:30146126, PMID:35084091) carried
    de novo variants, and none of the four abstracts reports transmission
    from an affected parent, so dominant inheritance rests on heterozygosity
    and on the activating mechanism rather than on observed segregation. The
    two French patients carry the same allele; their abstract does not say
    whether they are related or whether either parent was tested.
  evidence:
  - reference: PMID:35362179
    reference_title: "The germline p53 activation syndrome: A new patient further refines the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who had a germline heterozygous C-terminal frameshift variant in TP53 similar to others that activate the transcription factor"
    explanation: >
      Documents a heterozygous germline allele as sufficient for the
      phenotype.
  - reference: PMID:42104732
    reference_title: "Germline TP53 Mutations Causing Diamond-Blackfan Anemia: A French Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two French patients who both harbored a heterozygous TP53 deletion (NM_000546.5: c.1077delA; p.(Ser362AlafsTer8))."
    explanation: >
      Two further affected individuals, each heterozygous.
  - reference: PMID:35084091
    reference_title: "De novo TP53 germline activating mutations in two patients with the phenotype mimicking Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two patients with the phenotype of DBA (onset of macrocytic anemia within the first year of life, paucity of erythroid precursors in bone marrow) and germline de novo variants in the TP53 gene."
    explanation: >
      Records de novo origin in two more patients, consistent with a
      dominant-acting allele arising without family history.

prevalence:
- population: Worldwide published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven individuals in four case reports, 2018 to 2026 (two each in
    PMID:30146126, PMID:35084091 and PMID:42104732, one in PMID:35362179). The
    2022 single-patient report described its patient as the third reported
    individual, so it apparently did not count the two patients of the same
    year's other report. This is a literature count, not a population rate;
    no prevalence estimate exists.
  evidence:
  - reference: PMID:35362179
    reference_title: "The germline p53 activation syndrome: A new patient further refines the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the third reported individual with a germline p53 activation syndrome"
    explanation: >
      States the case count at the time of this report.
  - reference: PMID:42104732
    reference_title: "Germline TP53 Mutations Causing Diamond-Blackfan Anemia: A French Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two French patients who both harbored a heterozygous TP53 deletion"
    explanation: >
      Adds two further patients to the published count.

pathophysiology:
- name: TP53 C-Terminal Domain Truncation
  biological_scale: MOLECULAR
  description: >
    Heterozygous germline frameshift variants near the 3' end of TP53 remove
    the C-terminal domain while leaving the core DNA-binding domain intact. In
    the defining report both variants produced the same truncation, deleting
    32 residues, and the mutant protein showed augmented transcriptional
    activity. This is the opposite direction of effect from the
    DNA-binding-domain variants of Li-Fraumeni syndrome. Recorded as
    GAIN_OF_FUNCTION following the sources' own wording ("activating",
    "gain-of-function"); the reported effect is increased transactivation by
    the truncated protein, not a novel activity.
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
    modifier: INCREASED
  genetic_context:
    description: >-
      Heterozygous germline C-terminal frameshift TP53 alleles, de novo where
      origin is reported.
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: INCREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, the variants found in the two individuals studied here caused the same truncation of the protein, resulting in the loss of 32 residues from the C-terminal domain (CTD)."
    explanation: >
      Defines the lesion in the two founding patients.
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unexpectedly, the p53 mutant had augmented transcriptional activities, an observation not previously described in humans."
    explanation: >
      Establishes the direction of effect: the truncated p53 transactivates
      more, not less, which is what makes this a p53-activating rather than a
      p53-losing disorder.
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Most of these mutations affect the core DNA-binding domain, leading to compromised transcriptional activities."
    explanation: >
      The contrast with Li-Fraumeni alleles that the authors draw, which is why
      this entry is kept separate from Li-Fraumeni syndrome.
  - reference: PMID:42104732
    reference_title: "Germline TP53 Mutations Causing Diamond-Blackfan Anemia: A French Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, gain-of-function mutations in TP53 have been identified as a novel cause of Diamond-Blackfan anemia."
    explanation: >
      The source for the GAIN_OF_FUNCTION category label.
  downstream:
  - target: p53 Pathway Hyperactivation
    description: >
      Loss of the C-terminal domain increases p53 transcriptional output.
    evidence:
    - reference: PMID:37834388
      reference_title: "p53 in the Molecular Circuitry of Bone Marrow Failure Syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results clearly established that a loss of the p53 C-terminal domain led to increased p53 activity."
      explanation: >
        The review's summary of the p53-delta-31 mouse data, in which
        deleting the last 31 residues stabilised p53 and increased target-gene
        transactivation. Graded MODEL_ORGANISM because the underlying data are
        from mouse cells.

- name: p53 Pathway Hyperactivation
  biological_scale: CELLULAR
  description: >
    The central node. Constitutively augmented p53 target-gene transactivation
    in every cell carrying the allele. The authors of the defining report frame
    the disease as confirming that p53 activation itself can cause an inherited
    bone marrow failure syndrome, rather than only accompanying the ribosomal,
    telomere or DNA-repair defects of other such syndromes. Here p53 activation
    is the primary lesion rather than a downstream consequence.
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: INCREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  evidence:
  - reference: PMID:35362179
    reference_title: "The germline p53 activation syndrome: A new patient further refines the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who had a germline heterozygous C-terminal frameshift variant in TP53 similar to others that activate the transcription factor"
    explanation: >
      Places a third patient's variant in the activating class.
  - reference: PMID:36198537
    reference_title: "[Bone marrow failure and TP53 activating mutations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "This discovery confirms the hypothesis that p53 activation causes IBMFS."
    explanation: >
      Review by the senior author of the defining report, stating the
      organising claim of the entry.
  downstream:
  - target: Impaired Erythropoiesis
    description: >
      Expression of the truncated p53 impairs erythrocyte production.
    evidence:
    - reference: PMID:30146126
      reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When we expressed this mutant in zebrafish and human-induced pluripotent stem cells, we observed impaired erythrocyte production."
      explanation: >
        The functional link between the mutant protein and the erythroid
        defect. The sentence covers both a zebrafish (in vivo) and a human
        iPSC (in vitro) system; it is graded MODEL_ORGANISM for the
        zebrafish arm, and the iPSC result is the in vitro half of the same
        sentence.
  - target: Growth delay
    description: >
      Proposed, not demonstrated in patients. Mice with broad p53
      hyperactivation show developmental defects attributed to excess
      apoptosis or reduced proliferation in specific embryonic and neonatal
      compartments; the authors of the defining report state that the role of
      p53 activation in each clinical feature remains unknown.
    hypothesis_groups:
    - p53_activation_extrahematopoietic
    evidence:
    - reference: PMID:30624728
      reference_title: "The role of p53 in developmental syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Analyses from a variety of mouse strains demonstrate that inappropriately activating p53 during embryonic and early postnatal development triggers a host of developmental defects."
      explanation: >
        Mouse-only support for p53 hyperactivation causing developmental
        defects; the extension to this human feature is inference.
  - target: Microcephaly
    description: >
      Proposed, not demonstrated in patients. Mouse strains with p53
      hyperactivation show excess apoptosis or reduced proliferation in the
      embryonic neuroepithelium and neonatal cerebellum.
    hypothesis_groups:
    - p53_activation_extrahematopoietic
    evidence:
    - reference: PMID:30624728
      reference_title: "The role of p53 in developmental syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Excessive apoptosis and/or decreased proliferation have been detected in certain cell compartments in these mouse strains, such as the embryonic neuroepithelium and the neonatal bone marrow and cerebellum"
      explanation: >
        Mouse-only cellular basis for a neural growth defect under p53
        hyperactivation; the extension to human microcephaly in this
        syndrome is inference.
  - target: Cellular radiosensitivity
    description: >
      Proposed. In p53-delta-31 mouse cells loss of the C-terminal domain
      strengthened the cell-cycle arrest and apoptotic responses to
      irradiation; the patient's radiosensitivity assay is not described in
      the cited abstract.
    hypothesis_groups:
    - p53_activation_extrahematopoietic
    evidence:
    - reference: PMID:37834388
      reference_title: "p53 in the Molecular Circuitry of Bone Marrow Failure Syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "an increased apoptotic response was observed in irradiated p53Δ31/Δ31 thymocytes"
      explanation: >
        Mouse evidence that C-terminal truncation heightens the p53 response
        to ionising radiation.
  - target: Hypogonadism
    description: >
      Proposed. Homozygous p53-delta-31 male mice are hypogonadal; one
      founding patient had hypogonadism.
    hypothesis_groups:
    - p53_activation_extrahematopoietic
    evidence:
    - reference: PMID:37834388
      reference_title: "p53 in the Molecular Circuitry of Bone Marrow Failure Syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "Upon dissection, p53Δ31/Δ31 mice exhibited cerebellar hypoplasia, hypogonadism in males, and hypertrophic hearts typical of anemic animals."
      explanation: >
        Mouse-only support; the extension to the patient is inference.
  - target: Reticular skin pigmentation
    description: >
      Proposed. Mouse strains with p53 hyperactivation, including
      p53-delta-31, develop skin hyperpigmentation from accumulation of
      epidermal melanocytes; one founding patient had reticular pigmentation.
    hypothesis_groups:
    - p53_activation_extrahematopoietic
    evidence:
    - reference: PMID:30624728
      reference_title: "The role of p53 in developmental syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "A number of mouse strains with p53 hyperactivation exhibit hyperpigmentation defects in which the skin on the paws, tails, and ears darkens during the early postnatal period due to the progressive accumulation of melanocytes in the epidermis"
      explanation: >
        Mouse-only support; the reticular pattern seen in the patient is not
        modelled.

- name: Impaired Erythropoiesis
  biological_scale: CELLULAR
  description: >
    Failure of erythroid production with a paucity of erythroid precursors in
    the marrow, the Diamond-Blackfan-like core of the syndrome. In patients
    the erythroid lineage is the consistently affected one; neutropenia, where
    reported, was transient.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  evidence:
  - reference: PMID:35084091
    reference_title: "De novo TP53 germline activating mutations in two patients with the phenotype mimicking Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two patients with the phenotype of DBA (onset of macrocytic anemia within the first year of life, paucity of erythroid precursors in bone marrow) and germline de novo variants in the TP53 gene."
    explanation: >
      Marrow-level human evidence for the erythroid precursor deficit.
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When we expressed this mutant in zebrafish and human-induced pluripotent stem cells, we observed impaired erythrocyte production."
    explanation: >
      Experimental reproduction of the erythroid defect by the mutant protein.
  downstream:
  - target: Pure red cell aplasia
    description: Erythroid failure presents as red cell aplasia with anaemia.
  - target: Macrocytic anemia
    description: >
      The anaemia that results from erythroid failure, macrocytic in the two
      patients of PMID:35084091.
  - target: Normocytic anemia
    description: >
      The anaemia that results from erythroid failure, normocytic in the two
      French patients.

mechanistic_hypotheses:
- hypothesis_group_id: p53_activation_extrahematopoietic
  hypothesis_label: Constitutive p53 activation drives the non-haematological features
  status: EMERGING
  description: >
    The erythroid defect is experimentally linked to the truncated p53 in
    zebrafish and human iPSCs. The growth, microcephaly, pigmentary, gonadal
    and radiosensitivity features are not: they are attributed to p53
    activation by analogy with mouse strains carrying p53-hyperactivating
    alleles, and the immunoglobulin defect has no proposed mechanism in the
    sources cited here. The authors of the defining report state that the role of p53
    activation in each clinical feature remains unknown. Edges in this group
    are proposals carried by mouse data, not demonstrations in patients.
  evidence:
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, the exact role of p53 activation in each clinical feature remains unknown."
    explanation: >
      The source's own statement of the open question this hypothesis
      addresses.


    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as intellectual disability, seizures, microcephaly, short stature, cellular radiosensitivity, and normal telomere lengths"
    explanation: >
      Normal telomere lengths in a third patient.

animal_models:
- name: p53-delta-31 knock-in mouse
  species: Mouse
  genotype: Trp53 nonsense allele encoding p53 lacking its last 31 residues (p53Δ31)
  publication: PMID:23770245
  description: >
    A knock-in that removes the p53 C-terminal domain, published five years
    before the human syndrome and cited by its authors as closely similar.
    The human alleles delete 32 residues; the mouse allele deletes 31.
  modeled_mechanisms:
  - target: p53 Pathway Hyperactivation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      Loss of the C-terminal domain increases p53 activity and, in
      homozygotes, causes aplastic anaemia.
    limitations: >-
      The severe phenotype requires homozygosity: heterozygous p53+/Δ31 mice
      are only mildly affected, whereas every reported patient is
      heterozygous. The homozygous mice model dyskeratosis congenita, with
      short telomeres and pulmonary fibrosis, more closely than they model the
      Diamond-Blackfan-like erythroid failure of the human disease.
    readouts:
    - name: p53 activity and marrow failure
      target: p53 Pathway Hyperactivation
      direction: INCREASED
      interpretation: >
        Increased p53 activity with aplastic anaemia in homozygous mice.
      evidence:
      - reference: PMID:23770245
        reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here, we show that homozygous mutant mice expressing p53Δ31, a p53 lacking the C-terminal domain, exhibit increased p53 activity and suffer from aplastic anemia and pulmonary fibrosis, hallmarks of syndromes caused by short telomeres."
        explanation: Reports the activity readout and the marrow phenotype.
    evidence:
    - reference: PMID:23770245
      reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous p53+/Δ31 mice were only mildly affected, but decreased levels of Mdm4, a negative regulator of p53, led to a dramatic aggravation of their symptoms."
      explanation: >
        The dosage caveat on this model, and a pointer to MDM4 level as a
        modifier of a heterozygous C-terminal truncation.
    - reference: PMID:30146126
      reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings together with close similarities to published knock-in mouse models of TP53 lacking the CTD demonstrate that the CTD-truncation mutations of TP53 cause IBMFS"
      explanation: >
        The human-syndrome authors' statement that the mouse model is
        informative for this disease.

discussions:
- discussion_id: bmfs5_cancer_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - disease#Bone Marrow Failure Syndrome 5
  - genetic#TP53
  prompt: >-
    Do carriers of C-terminal truncating, activating TP53 alleles have an
    increased cancer risk, and is any tumour surveillance warranted?
  rationale: >-
    Inherited bone marrow failure syndromes as a class carry an increased risk
    of malignancy, and germline TP53 is the Li-Fraumeni gene, so a TP53 result
    on a marrow-failure panel invites Li-Fraumeni-style surveillance. But the
    BMFS5 alleles act in the opposite direction from Li-Fraumeni alleles, and
    the developmental-syndrome literature attributes cancer risk to loss of
    p53 activity rather than to its increase. None of the four case-report
    abstracts (PMID:30146126, PMID:35084091, PMID:35362179, PMID:42104732)
    reports a malignancy; with seven patients and follow-up durations not
    stated in those abstracts, absence of reported cancer is not evidence of
    absent risk.
    Whether somatic loss of the activating allele, or clonal selection for
    p53-pathway escape under constitutive p53 pressure, creates a myeloid
    risk in these patients is untested.
  proposed_experiments:
  - experiment_id: bmfs5_longitudinal_followup
    experiment_design: HUMAN_OBSERVATIONAL
    name: Longitudinal follow-up of reported carriers for malignancy and clonal haematopoiesis
    description: >-
      Pool the reported patients through a bone marrow failure registry and
      follow them for malignancy, with serial marrow or blood sequencing for
      somatic TP53-pathway clones.
    would_support:
    - disease#Bone Marrow Failure Syndrome 5
    supporting_outcome:
    - >-
      Cancer-free follow-up into adulthood with no expanding p53-pathway
      escape clones would support managing carriers without Li-Fraumeni
      surveillance.
    refuting_outcome:
    - >-
      Malignancy, or clonal expansion of cells that have lost or inactivated
      the activating allele, would argue for marrow surveillance.
  evidence:
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Inherited bone-marrow-failure syndromes (IBMFSs) include heterogeneous genetic disorders characterized by bone-marrow failure, congenital anomalies, and an increased risk of malignancy."
    explanation: >-
      The class-level cancer risk that makes the question unavoidable.
  - reference: PMID:30624728
    reference_title: "The role of p53 in developmental syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Of note, while Li-Fraumeni syndrome is caused by mutations in TP53, these mutations are typically loss-of-function or dominant-negative, consistent with this syndrome being linked to increased cancer risk due to loss of p53 activity, rather than developmental defects or premature aging due to increased p53 activity"
    explanation: >-
      The review's distinction between the two allelic classes, the reason
      Li-Fraumeni cancer risk is not imported into this entry.

- discussion_id: bmfs5_extrahematopoietic_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hypogammaglobulinemia
  - mechanistic_hypotheses#p53_activation_extrahematopoietic
  prompt: >-
    How does constitutive p53 activation produce hypogammaglobulinaemia,
    microcephaly and growth failure in these patients?
  rationale: >-
    Only the erythroid defect has been reproduced experimentally with the
    patient allele. The growth and microcephaly edges in this entry rest on
    mouse strains with broad p53 hyperactivation, and nothing cited here
    addresses the B-cell or immunoglobulin defect at all, so
    hypogammaglobulinaemia is left unwired. The defining report itself names
    this as unknown.
  evidence:
  - reference: PMID:30146126
    reference_title: "De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "However, the exact role of p53 activation in each clinical feature remains unknown."
    explanation: >-
      The authors' own statement of the gap.

- discussion_id: bmfs5_heterozygous_dosage
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#p53 Pathway Hyperactivation
  prompt: >-
    Why is a single C-terminal truncating TP53 allele sufficient for marrow
    failure in humans when heterozygous p53-delta-31 mice are only mildly
    affected?
  rationale: >-
    The mouse reproduces the direction of effect but needs two copies for the
    severe phenotype, while every reported patient is heterozygous. Candidate
    explanations - greater human sensitivity of erythroid progenitors to p53
    dosage, species differences in p53 target programmes, or the one-residue
    difference between the 31- and 32-residue truncations - are untested. In
    the mouse, lowering Mdm4 converts the mild heterozygote into a severe one,
    so MDM4 or MDM2 dosage is a plausible human modifier, but no source here
    tests it in patients.
  evidence:
  - reference: PMID:23770245
    reference_title: "Mutant mice lacking the p53 C-terminal domain model telomere syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous p53+/Δ31 mice were only mildly affected, but decreased levels of Mdm4, a negative regulator of p53, led to a dramatic aggravation of their symptoms."
    explanation: >-
      The model side of the mismatch.
  - reference: PMID:35362179
    reference_title: "The germline p53 activation syndrome: A new patient further refines the clinical phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who had a germline heterozygous C-terminal frameshift variant in TP53 similar to others that activate the transcription factor"
    explanation: >-
      The human side: a heterozygous allele is sufficient.


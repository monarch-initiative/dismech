diagnosis:
- name: Bone Marrow Examination
  description: >
    Shows the paucity of erythroid precursors that places these patients in
    the Diamond-Blackfan differential.
  evidence:
  - reference: PMID:35084091
    reference_title: "De novo TP53 germline activating mutations in two patients with the phenotype mimicking Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two patients with the phenotype of DBA (onset of macrocytic anemia within the first year of life, paucity of erythroid precursors in bone marrow) and germline de novo variants in the TP53 gene."
    explanation: >
      The marrow finding that defines the DBA-like phenotype.

- name: Germline TP53 Testing in DBA-Like Anaemia Without a Ribosomal Protein Variant
  description: >
    The practical diagnostic point. TP53 belongs on the gene list for
    infantile pure red cell aplasia once ribosomal protein genes are negative.
    The founding variants were found by whole-exome sequencing. A TP53 result
    must be read by allele class: a C-terminal truncation points here, while a
    DNA-binding-domain variant points to Li-Fraumeni syndrome, with entirely
    different surveillance consequences.
  evidence:
  - reference: PMID:35084091
    reference_title: "De novo TP53 germline activating mutations in two patients with the phenotype mimicking Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The possible role of TP53 variants should be considered in patients with DBA-like phenotype and no mutations in RP genes."
    explanation: >
      The source's diagnostic recommendation.
  - reference: PMID:36198537
    reference_title: "[Bone marrow failure and TP53 activating mutations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "We discovered germline TP53 activating mutations in IBMFS cases mimicking Diamond-Blackfan anemia using whole-exome sequencing."
    explanation: >
      Records whole-exome sequencing as the discovery method.

- name: Telomere Length Measurement
  description: >
    Not a discriminator. The founding patients had telomere lengths between
    the 1st and 10th percentile, and the 2022 single patient had normal
    telomere lengths, so telomere length neither confirms nor excludes this
    diagnosis and does not by itself separate it from dyskeratosis congenita.
  evidence:

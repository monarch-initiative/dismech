name: Immune Thrombocytopenia
creation_date: '2025-12-19T01:12:52Z'
category: Autoimmune
parents:
- Autoimmune Disease
- Hematologic Disease
disease_term:
  preferred_term: Immune Thrombocytopenia
  term:
    id: MONDO:0008558
    label: autoimmune thrombocytopenic purpura
description: >-
  An autoimmune disorder characterized by isolated thrombocytopenia due to
  autoantibody-mediated platelet destruction and impaired platelet production.
  Formerly known as idiopathic thrombocytopenic purpura (ITP). May be primary
  or secondary to infection, autoimmune disease, or malignancy.
pathophysiology:
- name: Antiplatelet Antibody Production
  description: >-
    Autoantibodies (primarily IgG) target platelet surface glycoproteins,
    especially GPIIb/IIIa and GPIb/IX. Antibody-coated platelets are cleared
    by splenic macrophages through Fc receptor-mediated phagocytosis.
  cell_types:
  - preferred_term: Platelet
    term:
      id: CL:0000233
      label: platelet
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:38396839
    reference_title: "Current Understanding of Immune Thrombocytopenia: A Review of Pathogenesis and Treatment Options."
    supports: NO_EVIDENCE
    snippet: >-
      A better understanding of the underlying pathology has facilitated the
      development of a number of new targeted therapies (Bruton's tyrosine
      kinase inhibitors, neonatal Fc receptors, strategies targeting B and
      plasma cells, strategies targeting T cells, complement inhibitors, and
      newer TPO-RAs for improving megakaryopoiesis), which seem to be highly
      effective and well tolerated and result in a significant improvement in
      patients' quality of life.
    explanation: >-
      Listed as NO_EVIDENCE because this snippet enumerates emerging targeted
      therapies rather than directly evidencing autoantibody-mediated platelet
      destruction; retained for context. See the platelet-autoantibody item
      below for the direct support.
  - reference: PMID:30801909
    reference_title: "The sensitivity and specificity of platelet autoantibody testing in immune thrombocytopenia: a systematic review and meta-analysis of a diagnostic test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      direct anti-platelet autoantibody testing for either anti-glycoprotein
      IIbIIIa or anti-glycoprotein IbIX
    explanation: >-
      Directly evidences the two platelet surface glycoprotein targets named in
      this node - GPIIb/IIIa and GPIb/IX - as the antigens against which the
      autoantibodies are directed. The meta-analysis reports 93% specificity for
      ITP with direct testing.
- name: Impaired Megakaryopoiesis
  description: >-
    Autoantibodies also target megakaryocytes, impairing platelet production.
    T cell-mediated megakaryocyte damage and cytokine effects further suppress
    thrombopoiesis.
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  biological_processes:
  - preferred_term: Platelet Formation
    term:
      id: GO:0030220
      label: platelet formation
  evidence:
  - reference: PMID:38525349
    reference_title: "Immune attack on megakaryocytes in immune thrombocytopenia."
    supports: SUPPORT
    snippet: >-
      In vitro studies using ITP sera or monoclonal antibodies against platelet
      and megakaryocyte surface glycoproteins have shown an impairment of many
      steps of megakaryopoiesis and thrombopoiesis, such as megakaryocyte
      differentiation and maturation, migration from the osteoblastic to the
      vascular niche, adhesion to extracellular matrix proteins, and proplatelet
      formation, resulting in impaired and ectopic platelet production in the
      bone marrow and diminished platelet release in the bloodstream.
    explanation: >-
      This study demonstrates that ITP autoantibodies directly impair multiple
      steps of megakaryocyte maturation and platelet production, contributing
      to thrombocytopenia beyond peripheral destruction.
  - reference: PMID:38525349
    reference_title: "Immune attack on megakaryocytes in immune thrombocytopenia."
    supports: SUPPORT
    snippet: >-
      Moreover, cytotoxic T cells may target bone marrow megakaryocytes,
      resulting in megakaryocyte destruction.
    explanation: >-
      Evidence that cellular immunity, specifically cytotoxic T cells, can
      directly attack megakaryocytes in the bone marrow, providing a T
      cell-mediated mechanism for impaired platelet production.
- name: T Cell Dysregulation
  description: >-
    Th1/Th17 imbalance and reduced regulatory T cell function contribute to
    loss of tolerance. Cytotoxic T cells may directly kill platelets and
    megakaryocytes.
  cell_types:
  - preferred_term: CD4+ T Cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: Immune Regulation
    term:
      id: GO:0002682
      label: regulation of immune system process
  evidence:
  - reference: PMID:37062251
    reference_title: "Regulatory factors involved in Th17/Treg cell balance of immune thrombocytopenia."
    supports: SUPPORT
    snippet: >-
      Studies have shown that an imbalance between T helper 17 (Th17) and
      Regulatory T (Treg) cells differentiated from CD4+T-cells is a key factor
      influencing the development and pathogenesis of immune thrombocytopenia.
      Th17 cells promote the development of chronic inflammatory disorders and
      induce autoimmune diseases, whereas Treg cells regulate immune homeostasis
      and prevent autoimmune diseases.
    explanation: >-
      This review establishes that Th17/Treg imbalance is a key pathogenic
      factor in ITP, with Th17 cells promoting autoimmunity and Treg
      dysfunction leading to loss of tolerance.
- name: Complement Activation
  description: >-
    Classical complement pathway activation occurs in many ITP patients,
    with C3, C4, and C9 deposition on platelets. Complement activation
    enhances platelet opsonization and clearance. Elevated complement
    activation markers correlate with disease severity and platelet count.
  biological_processes:
  - preferred_term: Complement Activation
    term:
      id: GO:0006956
      label: complement activation
  evidence:
  - reference: PMID:32515487
    reference_title: "Complement activation in patients with immune thrombocytopenic purpura according to phases of disease course."
    supports: SUPPORT
    snippet: >-
      Statistical analyses showed that acute ITP patients had higher plasma
      levels of sC5b-9 and C1q than CR or PR patients (median = sC5b-9: 200
      versus 98 mg/dl, P-value < 0·001) (median C1q = 2·11 versus 1·00 mg/dl,
      P-value < 0·001). CR and PR ITP patients had sC5b-9 and C1q plasma levels
      comparable to those observed in healthy volunteers.
    explanation: >-
      This study demonstrates that complement activation markers (sC5b-9 and
      C1q) are significantly elevated in acute ITP patients compared to
      patients in remission, and that sC5b-9 levels inversely correlate with
      platelet count, supporting complement's role in ITP pathogenesis.
  - reference: PMID:32515487
    reference_title: "Complement activation in patients with immune thrombocytopenic purpura according to phases of disease course."
    supports: SUPPORT
    snippet: >-
      The pathogenesis involves antibody production, cytokine release, T cell
      impairment, complement activation and clearance of platelets.
    explanation: >-
      This research explicitly identifies complement activation as one of the
      key pathogenic mechanisms in ITP alongside antibodies and T cell
      dysfunction.
phenotypes:
- name: Thrombocytopenia
  category: Hematological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  notes: Isolated, typically <100,000/μL
  evidence:
  - reference: PMID:38396839
    reference_title: "Current Understanding of Immune Thrombocytopenia: A Review of Pathogenesis and Treatment Options."
    supports: SUPPORT
    snippet: >-
      Although the pathogenesis of ITP is currently better known and its
      etiology has been extensively studied, up to 75% of adult patients with
      ITP may develop chronicity, which represents a significant burden on
      patients' quality of life. A major risk of ITP is bleeding, but knowledge
      on the exact relationship between the degree of thrombocytopenia and
      bleeding symptoms, especially at a lower platelet count, is lacking.
    explanation: >-
      This review highlights that thrombocytopenia is the cardinal feature of
      ITP, with up to 75% of adult patients developing chronic thrombocytopenia,
      and bleeding risk correlates with platelet count severity.
- name: Petechiae
  category: Dermatological
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Petechiae
    term:
      id: HP:0000967
      label: Petechiae
  evidence:
  - reference: PMID:30868551
    reference_title: "Epidemiology and Clinical Manifestations of Immune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bleeding is the most common symptom and can be mild as in petechiae,
      purpura and epistaxis
    explanation: >-
      A narrative review of the clinical manifestations of ITP names petechiae
      among the mild bleeding manifestations that are the most common symptom.
- name: Epistaxis
  category: ENT
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Epistaxis
    term:
      id: HP:0000421
      label: Epistaxis
  evidence:
  - reference: PMID:30868551
    reference_title: "Epidemiology and Clinical Manifestations of Immune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bleeding is the most common symptom and can be mild as in petechiae,
      purpura and epistaxis
    explanation: >-
      The same review names epistaxis among the mild mucosal bleeding
      manifestations of ITP.
- name: Easy Bruising
  category: Dermatological
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Easy Bruisability
    term:
      id: HP:0000978
      label: Bruising susceptibility
  evidence:
  - reference: PMID:30868551
    reference_title: "Epidemiology and Clinical Manifestations of Immune Thrombocytopenia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bleeding is the most common symptom and can be mild as in petechiae,
      purpura and epistaxis
    explanation: >-
      The review names purpura (cutaneous extravasation of blood) among the mild
      bleeding manifestations. Tagged PARTIAL because "purpura" is the closest
      term used in the source rather than "easy bruising" specifically.
  - reference: PMID:28240787
    reference_title: "Newly diagnosed immune thrombocytopenia adults: Clinical epidemiology, exposure to treatments, and evolution. Results of the CARMEN multicenter prospective cohort."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      50.9% had bleeding symptoms, including 2 severe gastrointestinal tract and
      1 intracranial bleedings
    explanation: >-
      A prospective cohort of 113 newly diagnosed adults quantifies that about
      half present with bleeding symptoms, the great majority of which are minor
      cutaneous/mucosal events rather than the rare severe bleeds.
biochemical:
- name: Platelet Count
  presence: Decreased
  context: Typically <100,000/μL, may be severe <10,000/μL
  evidence:
  - reference: PMID:30868551
    reference_title: "Epidemiology and Clinical Manifestations of Immune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A platelet count <10-20 × 109/L, advanced age and prior minor bleeding are
      risk factors for major bleeding
    explanation: >-
      Confirms that the platelet count is the graded severity marker in ITP and
      identifies the <10-20 x 10^9/L threshold at which major bleeding risk
      rises, matching the severe range recorded here.
  - reference: PMID:28240787
    reference_title: "Newly diagnosed immune thrombocytopenia adults: Clinical epidemiology, exposure to treatments, and evolution. Results of the CARMEN multicenter prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      median platelet count was 17 × 109 /L
    explanation: >-
      In a prospective cohort of newly diagnosed adults the median presenting
      platelet count was 17 x 10^9/L, well below the 100 x 10^9/L diagnostic
      threshold.
- name: Antiplatelet Antibodies
  presence: Variable
  context: Not routinely tested; poor sensitivity
  evidence:
  - reference: PMID:30801909
    reference_title: "The sensitivity and specificity of platelet autoantibody testing in immune thrombocytopenia: a systematic review and meta-analysis of a diagnostic test."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoantibody testing in ITP patients has a high specificity but low
      sensitivity. A positive autoantibody test can be useful for ruling in ITP,
      but a negative test does not rule out ITP.
    explanation: >-
      A diagnostic-accuracy meta-analysis (direct testing sensitivity 53%,
      specificity 93%; indirect testing sensitivity 18%) is the direct basis for
      recording this marker as variable and of poor sensitivity, hence not
      routinely tested.
- name: MPV (Mean Platelet Volume)
  presence: Normal or Increased
  context: Young platelets released
  evidence:
  - reference: PMID:38033118
    reference_title: "The diagnostic accuracy of mean platelet volume in differentiating immune thrombocytopenic purpura from hypo-productive thrombocytopenia: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the pooled mean value of MPV increased significantly in ITP patients
      compared to patients with hypo-productive thrombocytopenia (WMD = 2.03;
      95% CI, 1.38-2.69)
    explanation: >-
      A 14-study meta-analysis confirms MPV is significantly higher in ITP than
      in hypo-productive thrombocytopenia, consistent with the release of large
      young platelets by a compensating marrow; pooled sensitivity 76% and
      specificity 79% explain why it is supportive rather than diagnostic.
prevalence:
- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.75
  rate_low: 1.6
  rate_high: 3.9
  notes: >-
    Annual incidence of 1.6-3.9 per 100,000 patient-years, increasing with age
    and with a slight female preponderance.
  evidence:
  - reference: PMID:30868551
    reference_title: "Epidemiology and Clinical Manifestations of Immune Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune thrombocytopenia (ITP) occurs with an incidence rate of 1.6 to 3.9
      per 100,000 patient-years, which increases with age and has a slight
      female preponderance.
    explanation: >-
      Source of the incidence range; the midpoint is recorded as
      rate_per_100000 with the reported bounds in rate_low/rate_high.
treatments:
- name: Corticosteroids
  description: First-line therapy.
  treatment_term:
    preferred_term: corticosteroid therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:31794604
    reference_title: "American Society of Hematology 2019 guidelines for immune thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management approaches included: observation, corticosteroids, IV
      immunoglobulin, anti-D immunoglobulin, rituximab, splenectomy, and
      thrombopoietin receptor agonists.
    explanation: >-
      Corticosteroids are one of the seven management approaches covered by the
      21 GRADE-based recommendations of the ASH 2019 ITP guideline.
  - reference: PMID:28240787
    reference_title: "Newly diagnosed immune thrombocytopenia adults: Clinical epidemiology, exposure to treatments, and evolution. Results of the CARMEN multicenter prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intravenous corticosteroids and IVIg were frequently used.
    explanation: >-
      A prospective cohort confirms corticosteroids as the dominant first-line
      therapy in routine practice for newly diagnosed adults.
- name: IVIG
  description: For rapid platelet increase, bleeding, or pre-procedure.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:31794604
    reference_title: "American Society of Hematology 2019 guidelines for immune thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management approaches included: observation, corticosteroids, IV
      immunoglobulin, anti-D immunoglobulin, rituximab, splenectomy, and
      thrombopoietin receptor agonists.
    explanation: >-
      IV immunoglobulin is one of the management approaches covered by the ASH
      2019 ITP guideline recommendations.
  - reference: PMID:28240787
    reference_title: "Newly diagnosed immune thrombocytopenia adults: Clinical epidemiology, exposure to treatments, and evolution. Results of the CARMEN multicenter prospective cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those associated with the use of intravenous immunoglobulin (IVIg) were a
      high bleeding score and low platelet count.
    explanation: >-
      Directly supports the recorded indication: IVIg is selected for patients
      with active bleeding and very low platelet counts, i.e. when a rapid
      platelet increase is needed.
- name: Eltrombopag
  description: Oral thrombopoietin receptor agonist for persistent or chronic ITP.
  treatment_term:
    preferred_term: thrombopoietin receptor agonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thrombopoietin receptor agonist
      term:
        id: NCIT:C210737
        label: Thrombopoietin Receptor Agonist
    - preferred_term: eltrombopag
      term:
        id: CHEBI:85010
        label: eltrombopag
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Megakaryopoiesis
    treatment_effect: RESTORES
    description: >-
      Eltrombopag stimulates the TPO receptor on megakaryocytes, restoring
      platelet production against the impaired megakaryopoiesis arm of the
      disease.
    evidence:
    - reference: PMID:20739054
      reference_title: "Eltrombopag for management of chronic immune thrombocytopenia (RAISE): a 6-month, randomised, phase 3 study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        106 (79%) patients in the eltrombopag group responded to treatment at
        least once during the study, compared with 17 (28%) patients in the
        placebo group.
      explanation: >-
        Randomised evidence that raising platelet counts via the TPO receptor
        corrects the impaired-megakaryopoiesis arm in most treated patients.
  evidence:
  - reference: PMID:20739054
    reference_title: "Eltrombopag for management of chronic immune thrombocytopenia (RAISE): a 6-month, randomised, phase 3 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      106 (79%) patients in the eltrombopag group responded to treatment at
      least once during the study, compared with 17 (28%) patients in the
      placebo group.
    explanation: >-
      The pivotal RAISE phase 3 randomised trial in 197 adults with chronic ITP
      showed a 79% versus 28% platelet response rate for eltrombopag versus
      placebo (odds ratio 8.2).
  - reference: PMID:25632241
    reference_title: "Romiplostim as a treatment for immune thrombocytopenia: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, two such thrombopoietin receptor agonists, romiplostim and
      eltrombopag, are licensed in the USA to treat thrombocytopenia in adults
      with persistent or chronic ITP.
    explanation: >-
      Confirms eltrombopag is licensed in the USA for the persistent/chronic ITP
      indication recorded in the treatment description.
- name: Romiplostim
  description: >-
    Subcutaneous thrombopoietin receptor agonist peptibody (peptide-Fc fusion)
    for persistent or chronic ITP.
  treatment_term:
    preferred_term: thrombopoietin receptor agonist therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thrombopoietin receptor agonist
      term:
        id: NCIT:C210737
        label: Thrombopoietin Receptor Agonist
    - preferred_term: romiplostim
      term:
        id: NCIT:C52183
        label: Romiplostim
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Impaired Megakaryopoiesis
    treatment_effect: RESTORES
    description: >-
      Romiplostim is a peptibody TPO mimetic that stimulates the TPO receptor on
      megakaryocytes, restoring platelet production against the impaired
      megakaryopoiesis arm of the disease.
    evidence:
    - reference: PMID:25632241
      reference_title: "Romiplostim as a treatment for immune thrombocytopenia: a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Next-step development focused on stimulation of the TPO receptor with
        fewer immunogenic agents.
      explanation: >-
        States the mechanism romiplostim was developed to exploit — agonism at
        the TPO receptor, the megakaryopoiesis node targeted here.
  evidence:
  - reference: PMID:25632241
    reference_title: "Romiplostim as a treatment for immune thrombocytopenia: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, two such thrombopoietin receptor agonists, romiplostim and
      eltrombopag, are licensed in the USA to treat thrombocytopenia in adults
      with persistent or chronic ITP.
    explanation: >-
      Confirms romiplostim is licensed in the USA for the persistent/chronic ITP
      indication recorded in the treatment description.
- name: Rituximab
  description: Second-line option.
  treatment_term:
    preferred_term: rituximab therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Antiplatelet Antibody Production
    treatment_effect: INHIBITS
    description: >-
      Anti-CD20 B-cell depletion removes the B-cell compartment that generates
      the antiplatelet autoantibodies.
  evidence:
  - reference: PMID:31794604
    reference_title: "American Society of Hematology 2019 guidelines for immune thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management approaches included: observation, corticosteroids, IV
      immunoglobulin, anti-D immunoglobulin, rituximab, splenectomy, and
      thrombopoietin receptor agonists.
    explanation: >-
      The ASH 2019 guideline names rituximab among the management approaches it
      covers for ITP, supporting its record as a recognised option here.
  - reference: PMID:31794604
    reference_title: "American Society of Hematology 2019 guidelines for immune thrombocytopenia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a lack of evidence to support strong recommendations for various
      management approaches.
    explanation: >-
      The guideline's own conclusion that the evidence base does not support
      strong recommendations is why rituximab is recorded as a second-line
      option rather than a firmly recommended one; tagged PARTIAL to reflect
      that.
- name: Splenectomy
  description: For refractory disease.
  treatment_term:
    preferred_term: splenectomy
    term:
      id: NCIT:C15328
      label: Splenectomy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Antiplatelet Antibody Production
    treatment_effect: INHIBITS
    description: >-
      Removing the spleen eliminates the principal site of Fc-receptor-mediated
      clearance of antibody-coated platelets, as well as a major reservoir of
      autoantibody-producing plasma cells.
  evidence:
  - reference: PMID:15217831
    reference_title: "Splenectomy for adult patients with idiopathic thrombocytopenic purpura: a systematic review to assess long-term platelet count responses, prediction of response, and surgical complications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty-seven case series reported complete response in 1731 (66%) of 2623
      adult patients with follow-up for 1 to 153 months
    explanation: >-
      A systematic review of 135 case series found a durable complete response
      in about two thirds of adults after splenectomy, supporting its role in
      refractory disease.
  - reference: PMID:15217831
    reference_title: "Splenectomy for adult patients with idiopathic thrombocytopenic purpura: a systematic review to assess long-term platelet count responses, prediction of response, and surgical complications."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality was 1.0% (48 of 4955 patients) with laparotomy and 0.2% (3 of
      1301 patients) with laparoscopy.
    explanation: >-
      Quantifies the surgical risk that keeps splenectomy a later-line option
      despite its durable response rate.

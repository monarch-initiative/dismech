- accession: geo:GSE275370
  title: Multicellular derived S100A8/A9 maintains megakaryocytes in an immature state in immune thrombocytopenia.
  description: Immune thrombocytopenia (ITP) is a common acquired autoimmune bleeding disorder characterized by reduced platelet count. Impaired maturation of megakaryocyte (MK) plays an important role, although the exact mechanisms are not fully understood. In this study, we performed 10x Genomics single-cell sequencing (SC-seq) on bone marrow samples from ITP patients and validated the data through in vitro models of megakaryocyte generation.
  data_type: SINGLE_CELL_RNA_SEQ

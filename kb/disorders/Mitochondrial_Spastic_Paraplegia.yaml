inheritance:
- name: Mitochondrial inheritance
  description: >-
    The variant is in the mitochondrial genome, so transmission is matrilineal: every child of
    an affected woman inherits it and no child of an affected man does. In the reported family
    the variant is present in all affected individuals across four generations. Because it is
    homoplasmic there is no heteroplasmy bottleneck to make transmission probabilistic, which
    is a recurrence-risk statement quite unlike that of the nuclear-gene spastic paraplegias.
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a homoplasmic MT-TV (mitochondrial tRNAVal) mutation, m.1661A > G, present in all affected individuals across four generations of a family with complex HSP."
    explanation: >-
      The variant, its homoplasmic state, and the four-generation segregation that establishes
      the mode of inheritance.
pathophysiology:
- name: Homoplasmic MT-TV m.1661A>G Variant
  biological_scale: MOLECULAR
  conforms_to: "mitochondrial_dysfunction#Mitochondrial Damage and mtDNA Mutation"
  description: >-
    MT-TV encodes the mitochondrial transfer RNA for valine, one of the 22 tRNAs the
    mitochondrial genome supplies for translating its own thirteen protein-coding genes. The
    reported variant, m.1661A>G, is homoplasmic - present in every copy of the mitochondrial
    genome that was sampled - rather than heteroplasmic, which is the usual state for a
    pathogenic mt-tRNA variant.

    What the variant does to tRNA-Val was not measured. No aminoacylation assay, steady-state
    tRNA measurement or mitochondrial translation assay is reported, so the step from variant
    to translational defect is a gap rather than a link in this entry, and no node asserts it.
  genes:
  - preferred_term: MT-TV
    term:
      id: hgnc:7500
      label: MT-TV
  genetic_context:
    genes:
    - preferred_term: MT-TV
      term:
        id: hgnc:7500
        label: MT-TV
    allele_type: homoplasmic mitochondrial tRNA point variant m.1661A>G
    variant_origin: GERMLINE
    description: >-
      The zygosity slot is deliberately left empty. ZygosityEnum offers heterozygous,
      compound heterozygous, homozygous and hemizygous, none of which describes a
      mitochondrial genome present in hundreds of copies per cell. The relevant quantity is
      homoplasmy versus heteroplasmy, and it is recorded in allele_type and in the node
      description instead of being forced into a nuclear-genetics vocabulary.
    notes: >-
      functional_impact_category is also left empty. The published support is segregation and
      rarity, not a measured consequence for tRNA-Val function, and choosing
      LOSS_OF_FUNCTION would assert a mechanism nobody has demonstrated for this allele.

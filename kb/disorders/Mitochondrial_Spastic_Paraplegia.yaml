- name: Reduced Mitochondrial DNA Copy Number
  biological_scale: CELLULAR
  conforms_to: "mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress"
  description: >-
    Fewer copies of the mitochondrial genome per cell. This is the node that carries the
    entity's explanatory weight, because it is what the authors use to account for variation
    within the family: the fourth generation has the lowest copy number, the earliest onset
    and the most severe disease.

    The conformance to the mitochondrial dysfunction module's bioenergetic node follows the
    precedent of the mtDNA depletion entries in this knowledge base. It should be read as
    placing this entity in that family of mechanisms, not as a claim that oxidative
    phosphorylation was measured here - it was not. No respiratory chain assay, ATP
    measurement or oxidative stress marker is reported for this family.

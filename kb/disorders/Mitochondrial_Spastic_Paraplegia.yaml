name: Mitochondrial Spastic Paraplegia
category: Mendelian
creation_date: "2026-09-17T00:00:00Z"
synonyms:
- SPGM
- spastic paraplegia, mitochondrial
- MT-TV-related hereditary spastic paraplegia
description: >-
  Mitochondrial spastic paraplegia (SPGM) is a complex hereditary spastic paraplegia
  transmitted down the maternal line, reported in one Chinese family in which all affected
  members across four generations carry a homoplasmic m.1661A>G variant in MT-TV, the
  mitochondrially encoded transfer RNA for valine.

  The name reads like a category and is not one. "Mitochondrial spastic paraplegia" could
  reasonably mean "any HSP with a mitochondrial cause", which would be a grouping - SPG7 and
  SPG13 are both mitochondrial, and both are curated elsewhere in this knowledge base as
  separate nuclear-gene diseases. It is not what the term denotes. MONDO:0975951 is
  equivalent to OMIM:500018, an entry in OMIM's mitochondrial-DNA series created for this one
  family and this one variant, and the defining feature is not "a mitochondrial cause" but
  mitochondrial *inheritance*: the lesion is in the mitochondrial genome, so it passes only
  from mothers, and no nuclear locus is involved.

  The mechanism proposed is a chain from an mtDNA tRNA variant to a shortage of mitochondrial
  genomes. Transcriptome sequencing in the affected family showed upregulated mitochondrial
  autophagy genes, and the authors read that as the route by which the MT-TV variant lowers
  mtDNA copy number. The fourth generation, with the lowest copy number, had the earliest
  onset and the most severe disease, which is the entity's internal dose-response argument.
  Peroneal nerve biopsy showed ultrastructural abnormalities in myelin and mitochondria, so
  there is peripheral as well as central involvement.

  Two things should be read with the evidence base in mind. First, this is one family and one
  paper, and no independent replication exists; the entry curates what that paper reports and
  marks the inferred steps as inferred. Second, homoplasmy is unusual for a pathogenic
  mitochondrial tRNA variant and is not obviously good news for pathogenicity: other MT-TV
  variants act through a steep heteroplasmy threshold, with carriers asymptomatic below about
  70 percent mutant load. A homoplasmic variant has no such reservoir of wild-type genomes to
  explain variable expression, so the within-family variation has to come from somewhere
  else - which is exactly the copy-number argument the paper makes. It is recorded here as an
  open question rather than as a settled mechanism.

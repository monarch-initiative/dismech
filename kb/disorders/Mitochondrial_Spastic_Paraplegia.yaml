  downstream:
  - target: Upregulation of Mitochondrial Autophagy Gene Expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors infer this direction from the transcriptome data. What lies between an
      mt-tRNA variant and a mitophagy transcriptional programme is not established, which is
      why the link is recorded with unknown intermediates rather than as a direct effect.
- name: Upregulation of Mitochondrial Autophagy Gene Expression
  biological_scale: MOLECULAR
  description: >-
    Transcriptome sequencing of the affected family showed mitochondrial autophagy genes
    expressed above normal. The authors offer this as the mechanism by which the MT-TV variant
    depletes mitochondrial genomes: more mitophagy, fewer mitochondria, fewer copies of mtDNA.

    Two caveats belong on this node. The measurement is transcript abundance, not mitophagic
    flux, and upregulated transcription of autophagy genes is as consistent with a compensatory
    response to damaged mitochondria as with a primary driver of their removal. The direction
    of causation between this node and the next is therefore the paper's interpretation, and
    the paper itself words it as a suggestion.

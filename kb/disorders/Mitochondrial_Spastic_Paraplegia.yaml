progression:
- phase: Earlier onset and greater severity in successive generations
  notes: >-
    The one longitudinal observation in the entity, and it is across generations rather than
    within a patient. Fourth-generation affected individuals had earlier onset and more severe
    symptoms than their forebears. The authors label this presumptive anticipation and offer
    decreasing mtDNA copy number as the mechanism.

    Two reasons to hold this loosely. Apparent anticipation in a pedigree is a classic
    ascertainment artefact - later generations are examined earlier in life and with more
    awareness of the family diagnosis - and the abstract reports no correction for it. And the
    copy-number explanation is offered as a possibility by the authors themselves, in the same
    sentence.
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fourth-generation affected individuals displayed earlier onset, likely due to presumptive anticipation, and greater symptom severity, potentially caused by decreased mitochondrial DNA (mtDNA) copy number."
    explanation: >-
      The generational pattern and both of the authors' proposed explanations for it, with
      their hedges.
- phase: Course within an individual
  notes: >-
    Not reported. The source gives no age of onset, no rate of progression, no functional
    scale and no follow-up for any individual, so nothing is recorded here beyond the fact
    that HSP is by definition progressive. This phase exists to mark the absence.
genetic:
- name: MT-TV
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MT-TV
    term:
      id: hgnc:7500
      label: MT-TV
  features: >-
    MT-TV is the mitochondrially encoded transfer RNA for valine. The SPGM variant is
    m.1661A>G, homoplasmic in all affected members of the one reported family. MT-TV is an
    established disease locus in its own right: other variants in it cause mitochondrial
    cardiomyopathy with neurological features (m.1628C>T, m.1644G>A) and Leigh-like disease at
    high mutant load.
  notes: >-
    No causal gene is recorded in MONDO for MONDO:0975951, and NCBI mim2gene_medgen maps
    OMIM:500018 to GeneID `-` with no GeneMap source. That blank is not the same signal it was
    for the gene-less DFNB loci: OMIM's 5-series is its mitochondrial-DNA phenotype series, and
    those entries are not gene-mapped through the nuclear GeneMap that mim2gene_medgen reads.
    The gene is named unambiguously in the defining paper and in the OMIM entry title, so the
    identity is not in doubt; what the blank reflects is the file's scope, not a missing
    answer. A curator repeating the mapped-locus test on this concept should read it that way.
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."

diagnosis:
- name: Mitochondrial genome sequencing in spastic paraplegia with a maternal pedigree pattern
  description: >-
    The practical lesson of this entity is a testing-strategy one. Nuclear exome and
    spastic-paraplegia gene panels do not reliably cover the mitochondrial genome, so a family
    whose transmission is matrilineal can remain undiagnosed through a complete nuclear
    workup. The reported family was solved by adding mitochondrial genome analysis, with
    transcriptome sequencing and nerve biopsy in support.

    A homoplasmic variant adds a second trap: pipelines and interpretation guidelines for
    mitochondrial variants are tuned to heteroplasmy, and a variant present at 100 percent can
    be filtered as a private polymorphism.
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypic characterization, genetic screening, transcriptome sequencing, and peroneal nerve biopsy were conducted in a Chinese HSP family."
    explanation: The investigations that made the diagnosis in the one reported family.
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary spastic paraplegia (HSP) is characterized by progressive lower limb weakness and spasticity, with unknown genetic cause in many cases."
    explanation: >-
      The clause about many cases having no known genetic cause, which is the argument for
      extending testing beyond the nuclear panel. BACKGROUND because it is the paper's framing
      of the field.
  - reference: PMID:21986556
    reference_title: "Mitochondrial tRNA valine as a recurrent target for mutations involved in mitochondrial cardiomyopathies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The functional and molecular analyses reported here suggest that the MT-TV gene should be routinely considered in the diagnosis of mitochondrial cardiomyopathies."
    explanation: >-
      An independent argument that MT-TV deserves routine attention in diagnosis. INDIRECT
      because it is made about cardiomyopathy rather than about spastic paraplegia.
treatments:
- name: Genetic Counselling for Mitochondrial Inheritance
  description: >-
    The counselling here is not the counselling for a nuclear recessive or dominant spastic
    paraplegia, which is why it is curated rather than assumed. Transmission is matrilineal:
    an affected or carrier woman passes the variant to all of her children, an affected man to
    none of his. Because the variant is homoplasmic there is no heteroplasmy bottleneck, so
    the usual mitochondrial hedge about unpredictable transmitted load does not apply, and by
    the same token the reproductive options that work by selecting for low mutant load -
    preimplantation genetic testing in particular - have nothing to select on.

    Counselling does not act on the mechanism. It is curated because it is the only
    intervention the genotype itself indicates, and because getting the inheritance pattern
    wrong in a spastic paraplegia family has direct consequences for who is offered testing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a homoplasmic MT-TV (mitochondrial tRNAVal) mutation, m.1661A > G, present in all affected individuals across four generations of a family with complex HSP."
    explanation: >-
      The homoplasmic mitochondrial variant and the four-generation matrilineal pattern, which
      are the two facts counselling turns on.
  notes: >-
    No treatment is reported for any member of the family. Symptomatic management of spasticity
    - baclofen, tizanidine, botulinum toxin, physiotherapy - is standard for hereditary spastic
    paraplegia and is curated on the parent Hereditary Spastic Paraplegia entry, where it
    belongs; it is not repeated here, because nothing in the source records what these patients
    received and duplicating the parent's treatment list would assert otherwise.
discussions:
- discussion_id: spgm_homoplasmy_versus_heteroplasmy_threshold
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Homoplasmic MT-TV m.1661A>G Variant"
  - "pathophysiology#Reduced Mitochondrial DNA Copy Number"
  prompt: >-
    If m.1661A>G is homoplasmic in every affected member, what explains the variation in onset
    and severity between generations, and why are some maternal-line relatives unaffected?
  rationale: >-
    Pathogenic mitochondrial tRNA variants are usually heteroplasmic, and heteroplasmy is what
    does the explanatory work: for MT-TV m.1644G>A the threshold is steep enough that carriers
    below about 70 percent mutant load live asymptomatic lives, encephalopathy appears above 80
    percent, and Leigh-like disease above 95 percent. A homoplasmic variant removes that
    variable entirely. Every cell in every affected member carries the variant in every genome,
    so nothing about mutant load can account for one generation being affected earlier and more
    severely than another, or for any unaffected matrilineal relative.

    The authors supply mtDNA copy number as the substitute variable, and the internal evidence
    is consistent with it: the fourth generation has the lowest copy number, the earliest onset
    and the worst disease. But copy number is itself a phenotype, measured in blood or another
    accessible tissue at one point in time, and it can fall as a consequence of disease or of
    age as easily as it can drive it. Nuclear modifiers and mitochondrial haplogroup background
    are untested alternatives.

    This matters beyond the one family. A homoplasmic variant carries a weaker pathogenicity
    argument than a heteroplasmic one, because it cannot be shown to segregate with disease
    within a pedigree - everyone in the maternal line has it. The entity therefore rests on
    rarity, the tissue findings, and the copy-number correlation rather than on a
    dose-response in mutant load.
  proposed_experiments:
  - experiment_id: spgm_copy_number_and_modifier_study
    name: Tissue-resolved mtDNA copy number and modifier screen in the reported pedigree
    description: >-
      Measure mtDNA copy number in more than one tissue and at more than one time point across
      affected and unaffected matrilineal relatives, alongside full mitochondrial haplogroup
      assignment and nuclear sequencing for candidate modifiers of mtDNA maintenance. Include
      unaffected maternal-line relatives, who are the informative group and whom the original
      report does not describe.
    readouts:
    - name: mtDNA copy number in affected versus unaffected matrilineal relatives
      target: "pathophysiology#Reduced Mitochondrial DNA Copy Number"
      direction: DECREASED
      interpretation: >-
        A copy-number difference that tracks affected status independently of age would support
        the authors' model. Equal copy number in unaffected carriers would refute it and point
        at a nuclear modifier or at the variant being a bystander.
- discussion_id: spgm_single_family_replication
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "genetic#MT-TV"
  prompt: >-
    Has any second family with a mitochondrial spastic paraplegia phenotype been found to
    carry m.1661A>G, or any other MT-TV variant?
  rationale: >-
    The whole entity is one pedigree and one publication. A PubMed search for `MT-TV` on
    2026-09-17 returned sixteen records, all of which were read by title: three GeneReviews
    overviews, the defining paper itself, and twelve reports of other phenotypes -
    mitochondrial cardiomyopathy (PMID:21986556, PMID:30642647), Leigh and Leigh-like disease
    (PMID:24691472, PMID:38039350), childhood epilepsy (PMID:40115461, PMID:39243325), an
    adult phenotype expansion (PMID:38973423), camptocormia with a shuffling gait
    (PMID:28396884), and mtDNA findings in kidney disease. None is a second spastic paraplegia
    family. A broader search for `mitochondrial tRNA valine mutation` returns 47 records and
    was not read exhaustively, so the claim here is that no second SPGM family appears in the
    gene-symbol literature rather than that none exists anywhere. SPGM is at present a
    singleton, and OMIM's own designation carries no more weight than the one report behind
    it.

    Replication is what would move it. The specific test is cheap, because mitochondrial genome
    data already exist in most large undiagnosed-HSP cohorts and simply have not been
    interrogated for MT-TV in families with a maternal transmission pattern.
  proposed_experiments:
  - experiment_id: spgm_mtdna_reanalysis_in_undiagnosed_hsp_cohorts
    name: Reanalysis of mitochondrial genomes in genetically undiagnosed HSP cohorts
    description: >-
      Interrogate existing sequencing data from undiagnosed hereditary spastic paraplegia
      cohorts for MT-TV and other mt-tRNA variants, stratified by whether the pedigree is
      compatible with matrilineal transmission, and report the yield whether positive or
      negative.
    readouts:
    - name: Number of independent HSP families with a pathogenic MT-TV variant
      target: "genetic#MT-TV"
      interpretation: >-
        A second independent family would establish the entity. A well-powered negative result
        would argue that m.1661A>G is a private finding in one pedigree and that SPGM should be
        reconsidered rather than curated as a disease.
external_assertions:
- name: OMIM spastic paraplegia, mitochondrial record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:500018
  url: https://omim.org/entry/500018
  description: >-
    The OMIM phenotype record under which SPGM was designated, created for the family reported
    by Shi et al. It sits in OMIM's 5-series, which is the mitochondrial-DNA phenotype series,
    and that placement is itself the identity evidence: it says the entity is defined by a
    mitochondrial-genome lesion rather than by having a mitochondrial mechanism. Recorded here
    rather than under mappings because the DiseaseMappings class carries only ICD-10-CM,
    ICD-11, MONDO and NCIT slots. NCBI mim2gene_medgen maps this MIM number to GeneID `-`,
    which reflects that the 5-series is outside the nuclear gene map rather than an absent
    gene.
  evidence:
  - reference: PMID:39468830
    reference_title: "A Homoplasmic MT-TV Mutation Associated with Mitochondrial Inheritance of Hereditary Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The rare MT-TV m.1661A > G mutation is associated with HSP."
    explanation: The gene-disease finding on which the OMIM designation rests.
notes: >-
  Scope decision: curated as a DISEASE, against the initial suspicion that it would be a
  GROUPING. The name invites the grouping reading - many hereditary spastic paraplegias have a
  mitochondrial cause, and SPG7 and SPG13 are both curated or curatable as nuclear-gene
  entities - but that is not what the term denotes. MONDO:0975951 is equivalent to OMIM:500018,
  an entry in OMIM's mitochondrial-DNA phenotype series created for one family and one variant,
  m.1661A>G in MT-TV. The stub records no MONDO descendants, which agrees. The defining feature
  is mitochondrial *inheritance*, not a mitochondrial mechanism, and that is a property no
  nuclear-gene HSP shares.

  Identity resolution, since the stub and MONDO both record no causal gene: MONDO:0975951
  cross-references OMIM:500018, whose MedGen record (C5974902) states the entity is
  characterised by matrilineal inheritance of progressive lower limb weakness and spasticity
  and cites Shi et al. 2025. NCBI mim2gene_medgen maps OMIM:500018 to GeneID `-`, but that
  blank means something different here from what it meant for DFNB46 in #11978: OMIM's 5-series
  is outside the nuclear gene map that file reads, so the absence is about the file's scope
  rather than about the concept. The gene is named unambiguously in the defining paper. A
  search of `kb/` for MT-TV, m.1661 and mitochondrial spastic paraplegia found no existing
  coverage; the KB has a parent Hereditary Spastic Paraplegia entry and several nuclear SPG
  entries, none of which is this.

  Evidence balance, stated rather than smoothed. One family, one paper, no replication. The
  measured facts are the variant and its segregation, the transcriptome result, the mtDNA copy
  number correlation, and the nerve biopsy. Everything else is inference: the step from the
  tRNA variant to any translational defect is not measured and no node asserts it; the
  corticospinal node is inferred from the clinical diagnosis and says so; the DECREASED
  modifier on mitochondrial translation is an expectation from copy number and its node notes
  say so. Two slots are deliberately left empty rather than filled with a plausible value -
  genetic_context.zygosity, because no ZygosityEnum value describes homoplasmy, and
  functional_impact_category, because no functional consequence has been demonstrated for this
  allele.

  No deep-research run was commissioned. The entity has a sixteen-record literature at the gene
  level, all of which was reviewed by title here, and a single paper at the disease level; a
  provider run on a 2025 singleton entity carries a real risk of returning a different disease,
  and there is no body of literature for it to synthesise. Two knowledge-gap discussions record
  what would actually change the picture: replication in a second family, and a test of the
  copy-number model in unaffected matrilineal relatives.

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic loss-of-function MTRR variants. Reported patients are homozygous or compound
    heterozygous, and carrier parents are unaffected; enzymatic and mutation analysis has
    been used for prenatal diagnosis in affected families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cblE type of homocystinuria is a rare autosomal recessive disorder, which manifests with megaloblastic anaemia and developmental delay in early childhood."
    explanation: States the autosomal recessive inheritance of cblE homocystinuria.
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the families of both patients, enzymatic and mutation analyses were successfully used for prenatal diagnosis."
    explanation: Confirms biallelic Mendelian transmission tractable to prenatal testing.
pathophysiology:
- name: MTRR Loss of Function
  description: >-
    Biallelic pathogenic MTRR variants abolish or severely reduce methionine synthase
    reductase activity. Reported alleles include nonsense variants predicted to yield
    little or no MTRR protein, splice-disrupting insertions, and missense changes
    distributed across the FMN-, FAD- and NADPH-binding modules of this
    ferredoxin-NADP(+) reductase family flavoprotein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MTRR
    term:
      id: hgnc:7473
      label: MTRR
  molecular_functions:
  - preferred_term: methionine synthase reductase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030586
      label: '[methionine synthase] reductase (NADPH) activity'
  downstream:
  - target: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a defect in the MSR enzyme, which is required for the reductive activation of methionine synthase (MS)"
    explanation: Identifies loss of MTRR/MSR enzyme function as the primary molecular lesion.
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the eleven, three are nonsense mutations, allowing for the identification of two patients for whom little if any MSR protein should be produced."
    explanation: Documents null alleles establishing loss of function as the mechanism.
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "supports the concept that this disorder is caused by mutations in the MTRR gene"
    explanation: Confirms MTRR as the causal gene for the cblE complementation group.
- name: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
  description: >-
    Methionine synthase turnover intermittently oxidises its cob(I)alamin cofactor to
    catalytically inert cob(II)alamin. MTRR normally performs the NADPH-dependent reductive
    methylation that restores the active form. Without it methionine synthase accumulates in
    the oxidised state, so cellular methylcobalamin is depleted while methionine synthase
    protein and its intrinsic activity are preserved - a functional, not structural,
    enzyme deficiency. This is why patient fibroblast MTR activity can measure normal under
    strong reducing conditions and only falls when the reducing agent is limited.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: methionine synthase activity
    modifier: DECREASED
    term:
      id: GO:0008705
      label: methionine synthase activity
  chemical_entities:
  - preferred_term: methylcobalamin
    modifier: DECREASED
    term:
      id: CHEBI:28115
      label: methylcobalamin
  downstream:
  - target: Impaired Homocysteine Remethylation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate a unique requirement for MSR in the reductive activation of MS."
    explanation: Establishes that methionine synthase depends on MTRR for reductive reactivation.
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "methionine synthase activity was normal under high reducing conditions but decreased on limiting the reducing agent, dithiothreitol, to 5 mmol/L (18% of total, controls 51-81%)"
    explanation: >-
      Directly demonstrates the functional nature of the defect - methionine synthase is
      intact but cannot be reactivated once the exogenous reductant is limiting.
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "formation of methylcobalamin was low (4.5% of total cobalamins, control 57.5%) and complementation studies indicated the cblE defect"
    explanation: Quantifies methylcobalamin depletion in cblE patient fibroblasts.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Methionine synthase specific activity in extracts of all cblE fibroblasts was normal or near-normal under standard reducing conditions"
    explanation: >-
      The defining in vitro discriminator between cblE and cblG. In cblE the methionine
      synthase apoenzyme is intact, so its measured activity is preserved when an exogenous
      reductant substitutes for the missing MTRR; in cblG the apoenzyme itself is defective
      and activity is low under all conditions.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from patients with cblE (5 patients) and cblG (6 patients) all showed decreased intracellular levels of methylcobalamin (MeCbl)"
    explanation: Confirms depleted intracellular methylcobalamin as the shared cellular consequence.
  - reference: PMID:15714522
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transfection of fibroblasts of cblE patients with a wild-type MTRR minigene expression construct resulted in a significant approximately four-fold increase of methionine synthesis, indicating correction of the enzyme defect"
    explanation: >-
      Functional rescue - restoring wild-type MTRR to patient cells restores methionine
      synthesis, establishing MTRR loss as sufficient to cause the cellular defect.
- name: Impaired Homocysteine Remethylation
  description: >-
    With methionine synthase functionally inactive, the folate- and cobalamin-dependent
    transfer of a methyl group from 5-methyltetrahydrofolate to homocysteine fails.
    Homocysteine accumulates and methionine is not regenerated. Because the adenosylcobalamin
    limb serving methylmalonyl-CoA mutase is untouched, methylmalonic acid excretion stays
    normal - the discriminating feature against the combined cobalamin disorders.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: homocysteine metabolic process
    modifier: DECREASED
    term:
      id: GO:0050667
      label: homocysteine metabolic process
  - preferred_term: cobalamin metabolic process
    modifier: DECREASED
    term:
      id: GO:0009235
      label: cobalamin metabolic process
  chemical_entities:
  - preferred_term: homocysteine
    modifier: INCREASED
    term:
      id: CHEBI:17230
      label: homocysteine
  - preferred_term: L-methionine
    modifier: DECREASED
    term:
      id: CHEBI:16643
      label: L-methionine
  downstream:
  - target: Methyl-Group and Folate Trapping
    causal_link_type: DIRECT
  - target: Impaired Erythropoiesis
    causal_link_type: DIRECT
  - target: Homocysteine-Mediated Endothelial Injury
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25978498
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional methionine synthase reductase deficiency, also known as cobalamin E disorder, is a rare autosomal recessive inherited disease that results in an impaired remethylation of homocysteine to methionine."
    explanation: States the core metabolic block defining the disease.
  - reference: PMID:35337626
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inborn errors affecting synthesis of the methylcobalamin coenzyme required by methionine synthase (cblE and cblG) result in isolated homocystinuria"
    explanation: >-
      Establishes that the cblE block is confined to the remethylation limb, producing
      isolated homocystinuria without methylmalonic aciduria.
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An urinary organic acid analysis revealed normal methylmalonic acid excretion."
    explanation: Confirms in a genetically proven cblE patient that the adenosylcobalamin limb is spared.
- name: Methyl-Group and Folate Trapping
  description: >-
    Methionine synthase is the only reaction that regenerates tetrahydrofolate from
    5-methyltetrahydrofolate. When it stalls, folate is sequestered as
    5-methyltetrahydrofolate and becomes unavailable for one-carbon transfers - the
    classical methyl-folate trap. Reduced methionine also lowers S-adenosylmethionine,
    constraining the many downstream methylation reactions on which myelin maintenance and
    nucleotide synthesis depend. The trap explains the raised formiminoglutamate excretion
    seen in cblE and the partial biochemical response to pharmacological folate.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: tetrahydrofolate metabolic process
    modifier: DECREASED
    term:
      id: GO:0046653
      label: tetrahydrofolate metabolic process
  - preferred_term: methylation
    modifier: DECREASED
    term:
      id: GO:0032259
      label: methylation
  - preferred_term: one-carbon metabolic process
    modifier: DECREASED
    term:
      id: GO:0006730
      label: one-carbon metabolic process
  downstream:
  - target: Impaired Erythropoiesis
    causal_link_type: DIRECT
  - target: Central Nervous System White Matter Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before treatment, major findings were microcephaly, psychomotor retardation, episodic reduced consciousness, megaloblastic anaemia, increased plasma free homocystine (> 20 mumol/L), low plasma methionine (< 10 mumol/L) and increased excretion of formiminoglutamate."
    explanation: >-
      Formiminoglutamate accumulates when tetrahydrofolate is unavailable for the
      formiminotransferase step, the expected consequence of methyl-folate trapping.
  - reference: PMID:9427140
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "On high-dose folic acid, biochemical abnormalities such as formiminoglutamate excretion and homocystinuria nearly normalized, but clinical and haematological abnormalities remained."
    explanation: >-
      Pharmacological folate partially relieves the trap biochemically, supporting folate
      sequestration as a real component - though the persistence of clinical disease shows
      it is not the whole mechanism.
  - reference: PMID:27905001
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired remethylation of homocysteine to methionine leads to accumulation of homocysteine and perturbation of numerous methylation reactions"
    explanation: Links the remethylation block to generalized methylation failure.
- name: Impaired Erythropoiesis
  description: >-
    Folate trapping starves thymidylate synthesis of methylene-tetrahydrofolate, so
    erythroid precursors cannot complete DNA replication while cytoplasmic maturation
    continues. The result is nuclear-cytoplasmic dyssynchrony in the marrow - megaloblastic
    change - with macrocytic anemia and, when severe, extension to other lineages as
    pancytopenia. The marrow picture can be mistaken for congenital dyserythropoietic
    anemia before the biochemical diagnosis is made.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  evidence:
  - reference: PMID:25978498
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two new cases of unrelated girls with megaloblastic anemia misclassified at first as congenital dyserythropoietic anemia with development of neurologic dysfunction in one of them."
    explanation: >-
      Documents megaloblastic marrow change in genetically confirmed cblE, including the
      diagnostic confusion with congenital dyserythropoietic anemia.
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a bone marrow examination revealed megaloblastic changes associated with hyperhomocysteinaemia"
    explanation: Marrow-level confirmation of megaloblastic erythropoiesis in cblE.
- name: Homocysteine-Mediated Endothelial Injury
  description: >-
    Severe hyperhomocysteinemia damages vascular endothelium and promotes thrombotic
    microangiopathy. In neonatal-onset cblE this can present as an atypical
    haemolytic-uraemic syndrome, and post-mortem examination has shown myointimal
    proliferation with luminal narrowing in the kidney and microangiopathic change in the
    brain. This is the pathway that makes remethylation disorders part of the differential
    for unexplained thrombosis and atypical HUS.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the histopathological examination of the kidneys showed marked myointimal proliferation and narrowing of the vascular lumen"
    explanation: Histological demonstration of microangiopathic vascular injury in a cblE patient.
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microangiopathy was observed with an increase in vessel wall thickness, a reduction of the arterial inner diameter and capillary oedema."
    explanation: Confirms generalized microangiopathy as a tissue-level consequence.
  - reference: PMID:27905001
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "atypical haemolytic uraemic syndrome or unexplained vascular thrombosis"
    explanation: >-
      Expert guidelines place atypical HUS and unexplained thrombosis among the
      presentations that should prompt testing for a remethylation disorder.
- name: Central Nervous System White Matter Injury
  description: >-
    Deficient S-adenosylmethionine-dependent methylation impairs myelin maintenance, and
    the resulting white matter disease underlies the developmental delay, microcephaly and
    seizures of cblE. Neuropathology in a fatal neonatal case showed diffuse white matter
    lesions with spongiosis, necrosis and severe astrogliosis. Unlike the haematological
    features, the neurological injury often persists despite biochemical correction.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  locations:
  - preferred_term: white matter
    term:
      id: UBERON:0002316
      label: white matter
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diffuse white matter lesions with spongiosis, necrosis and severe astrogliosis were also observed"
    explanation: Neuropathological confirmation of white matter injury in cblE.
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 17 years of age she remains severely mentally retarded."
    explanation: >-
      Seventeen-year follow-up showing the neurological injury persists despite sustained
      biochemical treatment.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based incidence or prevalence estimate exists. Published case counts are
    the only available measure, and the largest systematic survey assembled 11 cblE
    patients alongside 13 cblG. cblE is additionally not reliably detected by standard
    newborn screening, because the block spares the propionate pathway and so produces no
    propionylcarnitine (C3) elevation - meaning any case count is an undercount of unknown
    size, not merely a small number.
  evidence:
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 11 cblE and 13 cblG patients, failure to thrive, feeding problems, delayed milestones, muscular hypotonia, cognitive impairment and macrocytic anaemia were the most frequent symptoms."
    explanation: >-
      Gives the cohort size of the largest systematic survey of the disorder - 11 cblE
      patients - which is the basis for the ultra-rare classification.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common findings among 11 patients (4 with cblE and 7 with cblG) have included megaloblastic anemia (all patients)"
    explanation: An earlier series, again of single-digit cblE patient numbers.
progression:
- phase: Presentation
  age_range: 2 weeks to 3 years (median 4 weeks)
  notes: >-
    Onset is typically in early infancy with anemia and neurological involvement.
    Presentation after the first two years is unusual but described, including one patient
    who reached medical attention at 21 years with symptoms initially attributed to
    multiple sclerosis - a reminder that a remethylation defect belongs in the differential
    for unexplained adult subacute neurological disease.
  evidence:
  - reference: PMID:15714522
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented between 2 weeks and 3 years of age (median age 4 weeks) with anemia, which was macrocytic in only three patients, and with neurological involvement in all but two cases."
    explanation: Defines the age-at-presentation range and median in a molecularly confirmed cblE series.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation has usually been in the first 2 years of life, but one patient came to medical attention at age 21 years with symptoms initially diagnosed as multiple sclerosis."
    explanation: Documents both the usual infantile onset and a late-onset outlier.
- phase: Response to treatment
  age_range: After diagnosis
  notes: >-
    The two limbs of the disease diverge under treatment. Anemia and the biochemical
    abnormalities correct reliably on cobalamin; the neurological deficits resolve more
    slowly and often incompletely. Delay in diagnosis correlates with worse communication
    ability at follow-up, which is the main argument for early detection.
  evidence:
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have responded to therapy with cobalamin with resolution of anemia and biochemical abnormalities; neurological deficits resolved more slowly and in some cases incompletely."
    explanation: States the divergent haematological and neurological treatment responses.
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Delay in diagnosis depended on age at first symptom and clinical pattern at presentation and correlated significantly with impaired communication abilities at follow-up."
    explanation: Links diagnostic delay to worse neurocognitive outcome.
- phase: Long-term course
  age_range: Childhood to adulthood
  notes: >-
    Despite a biochemically stable or improving overall course in almost all patients, the
    burden of CNS symptoms accumulates over time and most patients end up developmentally
    delayed or severely handicapped. In vitro residual enzyme activity does not predict
    this outcome.
  evidence:
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the average number of CNS symptoms per patient increased significantly over time and 16 of 23 patients were classified as developmentally delayed or severely handicapped"
    explanation: Quantifies accumulating neurological burden despite treatment.
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vitro enzyme analysis data showed no correlation with outcome."
    explanation: >-
      Residual fibroblast enzyme activity is not prognostic, which limits its use beyond
      complementation-group assignment.
- phase: Adult complications
  age_range: Adulthood
  notes: >-
    Treated cblE is not a static disease in adulthood. Hemolytic anemia has been reported
    in adult siblings who had been diagnosed neonatally and treated continuously, and it
    responded to hydroxocobalamin dose escalation - implying the maintenance dose adequate
    in childhood can become inadequate later. The same report proposes LDH as a monitoring
    biomarker for this.
  evidence:
  - reference: PMID:38736634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of LDH for disease monitoring could possibly be an additional useful biomarker to adjust hydroxocobalamin dosage."
    explanation: >-
      Proposes ongoing LDH surveillance to guide dose adjustment across the adult course.
  - reference: PMID:38736634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observation of novel hemolytic features in this rare disease should raise awareness about specific complications in remethylation disorders and plea for hydroxocobalamin dose escalation."
    explanation: States the clinical implication for long-term management of treated cblE.
phenotypes:
- name: Megaloblastic Anemia
  category: Hematologic
  description: >-
    Macrocytic, megaloblastic anemia is the usual presenting feature, typically in the first
    weeks to months of life.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Megaloblastic anemia
    term:
      id: HP:0001889
      label: Megaloblastic anemia
  evidence:
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 1 involves a 20-year-old mentally retarded patient who presented with megaloblastic anaemia at 10 weeks of age."
    explanation: Megaloblastic anemia as the presenting feature in a molecularly confirmed cblE patient.
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Methionine synthase reductase (MSR) deficiency is an autosomal recessive disorder of folate/cobalamin metabolism leading to hyperhomocysteinemia"
    explanation: Establishes MSR deficiency as the disorder in which this haematological phenotype occurs.
- name: Macrocytic Anemia
  category: Hematologic
  description: >-
    Raised mean corpuscular volume is often described as characteristic, but it is not
    obligatory, and its absence must not be used to exclude cblE. In the largest single
    molecularly confirmed series the anemia was macrocytic in only three of nine patients,
    while megaloblastic marrow change was present in six of the seven examined. The marrow
    is the more reliable finding than the red cell indices.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Macrocytic anemia
    term:
      id: HP:0001972
      label: Macrocytic anemia
  evidence:
  - reference: PMID:25978498
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It presents with macrocytic anemia, hyperhomocysteinemia, and hypomethioninemia, and may also be accompanied with neurological impairment."
    explanation: Names macrocytic anemia among the described presenting features of cobalamin E disorder.
  - reference: PMID:15714522
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented between 2 weeks and 3 years of age (median age 4 weeks) with anemia, which was macrocytic in only three patients, and with neurological involvement in all but two cases."
    explanation: >-
      Qualifies the macrocytosis - in nine molecularly confirmed cblE patients the anemia
      was macrocytic in only three, so a normal MCV does not exclude the diagnosis.
  notes: >-
    Graded OCCASIONAL rather than VERY_FREQUENT on the strength of PMID:15714522 (3/9),
    deliberately lower than the narrative reviews imply. The megaloblastic marrow change
    is graded separately and higher.
- name: Cerebral Atrophy
  category: Neurologic
  description: >-
    Brain atrophy or white matter disease is present on imaging in the large majority of
    patients with the cblE or cblG remethylation defect.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
  evidence:
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen/22 patients presented with brain atrophy or white matter disease."
    explanation: >-
      Quantifies structural brain involvement in the combined cblE/cblG cohort (18 of 22
      imaged patients).
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "various neurological deficits including developmental retardation (10 patients), cerebral atrophy (8 patients), hypotonia (7 patients), EEG abnormalities (6 patients), and nystagmus (5 patients)"
    explanation: >-
      Cerebral atrophy in 8 of the 11 patients in this functional methionine synthase
      deficiency series.
  notes: >-
    PMID:25526710 pools cblE and cblG; the two share a final common metabolic block, so the
    imaging finding is expected to apply to cblE, but the fraction is not cblE-specific.
- name: EEG Abnormality
  category: Neurologic
  description: Electroencephalographic abnormality, which can improve on cobalamin treatment.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: EEG abnormality
    term:
      id: HP:0002353
      label: EEG abnormality
  evidence:
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "various neurological deficits including developmental retardation (10 patients), cerebral atrophy (8 patients), hypotonia (7 patients), EEG abnormalities (6 patients), and nystagmus (5 patients)"
    explanation: >-
      EEG abnormality in 6 of the 11 patients in this functional methionine synthase
      deficiency series.
- name: Feeding Difficulties
  category: Gastrointestinal
  description: Feeding problems in infancy, among the most frequent presenting symptoms.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Feeding difficulties

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate a unique requirement for MSR in the reductive activation of MS."
    explanation: Establishes that methionine synthase depends on MTRR for reductive reactivation.
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "methionine synthase activity was normal under high reducing conditions but decreased on limiting the reducing agent, dithiothreitol, to 5 mmol/L (18% of total, controls 51-81%)"
    explanation: >-
      Directly demonstrates the functional nature of the defect - methionine synthase is
      intact but cannot be reactivated once the exogenous reductant is limiting.
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "formation of methylcobalamin was low (4.5% of total cobalamins, control 57.5%) and complementation studies indicated the cblE defect"
    explanation: Quantifies methylcobalamin depletion in cblE patient fibroblasts.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Methionine synthase specific activity in extracts of all cblE fibroblasts was normal or near-normal under standard reducing conditions"
    explanation: >-
      The defining in vitro discriminator between cblE and cblG. In cblE the methionine
      synthase apoenzyme is intact, so its measured activity is preserved when an exogenous
      reductant substitutes for the missing MTRR; in cblG the apoenzyme itself is defective
      and activity is low under all conditions.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts from patients with cblE (5 patients) and cblG (6 patients) all showed decreased intracellular levels of methylcobalamin (MeCbl)"
    explanation: Confirms depleted intracellular methylcobalamin as the shared cellular consequence.
  - reference: PMID:15714522
    reference_title: "cblE type of homocystinuria due to methionine synthase reductase deficiency: functional correction by minigene expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "transfection of fibroblasts of cblE patients with a wild-type MTRR minigene expression construct resulted in a significant approximately four-fold increase of methionine synthesis, indicating correction of the enzyme defect"
    explanation: >-
      Functional rescue - restoring wild-type MTRR to patient cells restores methionine
      synthesis, establishing MTRR loss as sufficient to cause the cellular defect.
- name: Impaired Homocysteine Remethylation
  description: >-
    With methionine synthase functionally inactive, the folate- and cobalamin-dependent
    transfer of a methyl group from 5-methyltetrahydrofolate to homocysteine fails.
    Homocysteine accumulates and methionine is not regenerated. Because the adenosylcobalamin
    limb serving methylmalonyl-CoA mutase is untouched, methylmalonic acid excretion stays
    normal - the discriminating feature against the combined cobalamin disorders.
  biological_scale: CELLULAR
  biological_processes:

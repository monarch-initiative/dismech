pathophysiology:
- name: MTRR Loss of Function
  description: >-
    Biallelic pathogenic MTRR variants abolish or severely reduce methionine synthase
    reductase activity. Reported alleles include nonsense variants predicted to yield
    little or no MTRR protein, splice-disrupting insertions, and missense changes
    distributed across the FMN-, FAD- and NADPH-binding modules of this
    ferredoxin-NADP(+) reductase family flavoprotein.
  biological_scale: MOLECULAR

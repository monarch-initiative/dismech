      biochemical treatment.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based incidence or prevalence estimate exists. Published case counts are
    the only available measure, and the largest systematic survey assembled 11 cblE
    patients alongside 13 cblG. cblE is additionally not reliably detected by standard
    newborn screening, because the block spares the propionate pathway and so produces no
    propionylcarnitine (C3) elevation - meaning any case count is an undercount of unknown
    size, not merely a small number.
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 11 cblE and 13 cblG patients, failure to thrive, feeding problems, delayed milestones, muscular hypotonia, cognitive impairment and macrocytic anaemia were the most frequent symptoms."
    explanation: >-
      Gives the cohort size of the largest systematic survey of the disorder - 11 cblE
      patients - which is the basis for the ultra-rare classification.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common findings among 11 patients (4 with cblE and 7 with cblG) have included megaloblastic anemia (all patients)"
    explanation: An earlier series, again of single-digit cblE patient numbers.
progression:
- phase: Presentation
  age_range: 2 weeks to 3 years (median 4 weeks)
  notes: >-
    Onset is typically in early infancy with anemia and neurological involvement.
    Presentation after the first two years is unusual but described, including one patient
    who reached medical attention at 21 years with symptoms initially attributed to
    multiple sclerosis - a reminder that a remethylation defect belongs in the differential
    for unexplained adult subacute neurological disease.
  evidence:
  - reference: PMID:15714522
    reference_title: "cblE type of homocystinuria due to methionine synthase reductase deficiency: functional correction by minigene expression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented between 2 weeks and 3 years of age (median age 4 weeks) with anemia, which was macrocytic in only three patients, and with neurological involvement in all but two cases."
    explanation: Defines the age-at-presentation range and median in a molecularly confirmed cblE series.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presentation has usually been in the first 2 years of life, but one patient came to medical attention at age 21 years with symptoms initially diagnosed as multiple sclerosis."
    explanation: Documents both the usual infantile onset and a late-onset outlier.
- phase: Response to treatment
  age_range: After diagnosis
  notes: >-
    The two limbs of the disease diverge under treatment. Anemia and the biochemical
    abnormalities correct reliably on cobalamin; the neurological deficits resolve more
    slowly and often incompletely. Delay in diagnosis correlates with worse communication
    ability at follow-up, which is the main argument for early detection.
  evidence:
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have responded to therapy with cobalamin with resolution of anemia and biochemical abnormalities; neurological deficits resolved more slowly and in some cases incompletely."
    explanation: States the divergent haematological and neurological treatment responses.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Delay in diagnosis depended on age at first symptom and clinical pattern at presentation and correlated significantly with impaired communication abilities at follow-up."
    explanation: Links diagnostic delay to worse neurocognitive outcome.
- phase: Long-term course
  age_range: Childhood to adulthood
  notes: >-
    Despite a biochemically stable or improving overall course in almost all patients, the
    burden of CNS symptoms accumulates over time and most patients end up developmentally
    delayed or severely handicapped. In vitro residual enzyme activity does not predict
    this outcome.
  evidence:
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the average number of CNS symptoms per patient increased significantly over time and 16 of 23 patients were classified as developmentally delayed or severely handicapped"
    explanation: Quantifies accumulating neurological burden despite treatment.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In vitro enzyme analysis data showed no correlation with outcome."
    explanation: >-
      Residual fibroblast enzyme activity is not prognostic, which limits its use beyond
      complementation-group assignment.
- phase: Adult complications
  age_range: Adulthood
  notes: >-
    Treated cblE is not a static disease in adulthood. Hemolytic anemia has been reported
    in adult siblings who had been diagnosed neonatally and treated continuously, and it
    responded to hydroxocobalamin dose escalation - implying the maintenance dose adequate
    in childhood can become inadequate later. The same report proposes LDH as a monitoring
    biomarker for this.

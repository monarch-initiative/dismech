      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertonia, seizures, blindness, and ataxia were less frequent."
    explanation: >-
      Places seizures among the less frequent neurological deficits in functional
      methionine synthase deficiency, supporting the OCCASIONAL grading.
- name: Global Developmental Delay
  category: Neurologic
  description: >-
    Developmental delay in early childhood is, with megaloblastic anemia, one of the two
    defining presentations; it frequently progresses to fixed intellectual disability.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "manifests with megaloblastic anaemia and developmental delay in early childhood"
    explanation: States developmental delay as a defining early-childhood manifestation.
- name: Intellectual Disability
  category: Neurologic
  description: >-
    Persistent cognitive impairment, which in reported long-term follow-up has remained
    severe despite decades of biochemical treatment.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 17 years of age she remains severely mentally retarded."
    explanation: Documents persistent severe intellectual disability on long-term follow-up.
- name: Microcephaly
  category: Neurologic
  description: Reduced head circumference reported among the pre-treatment findings.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before treatment, major findings were microcephaly, psychomotor retardation, episodic reduced consciousness, megaloblastic anaemia"
    explanation: Lists microcephaly among the pre-treatment findings in a cblE patient.
- name: Nystagmus
  category: Ophthalmologic
  description: Nystagmus has been a presenting sign alongside developmental delay.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case 2 involves an 8-year-old girl with nystagmus and developmental delay in whom megaloblastic anaemia was detected at 11 weeks of age."
    explanation: Nystagmus as a presenting sign in a molecularly confirmed cblE patient.
- name: Hypotonia
  category: Neurologic
  description: Reported in neonatal-onset disease.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a male infant aged 43 days presenting with failure to thrive, hypotonia, pancytopaenia"
    explanation: Hypotonia in a neonatal-onset cblE presentation.
- name: Failure to Thrive
  category: Growth
  description: Poor growth in infantile presentations.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure to thrive, hypotonia, pancytopaenia, HUS symptoms"
    explanation: Failure to thrive at presentation in a neonatal cblE case.
- name: Pancytopenia
  category: Hematologic
  description: >-
    Severe disease can extend beyond the erythroid lineage to involve granulocytes and
    platelets.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypotonia, pancytopaenia, HUS symptoms (microangiopathic haemolytic anaemia and thrombocytopaenia with signs of renal involvement)"
    explanation: Documents multilineage cytopenia in severe neonatal cblE.
- name: Hemolytic-Uremic Syndrome
  category: Renal
  description: >-
    Thrombotic microangiopathy with microangiopathic haemolysis, thrombocytopenia and renal
    involvement. cblE belongs in the differential for atypical HUS in the newborn period.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Hemolytic-uremic syndrome
    term:
      id: HP:0005575
      label: Hemolytic-uremic syndrome
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cblE should be considered when diagnosing patients presenting with HUS signs and symptoms during the newborn period."
    explanation: Establishes HUS-like presentation as a recognized, if rare, cblE phenotype.
- name: Hemolytic Anemia in Adulthood
  category: Hematologic
  description: >-
    A late complication, first described in 2024 in two adult cblE siblings who had been
    diagnosed neonatally and treated throughout. Both developed hemolytic anemia with LDH
    above 11,000 U/L, undetectable haptoglobin and raised unconjugated bilirubin, which
    resolved on escalating the hydroxocobalamin dose rather than on any new agent. This is
    a different lesion from the presenting megaloblastic anemia and argues that treated
    cblE needs continued haematological surveillance into adult life.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: PMID:38736634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report herein 2 cblE siblings diagnosed in the neonatal period with isolated pancytopenia who, despite treatment, exhibited in adulthood hemolytic anemia (LDH >11 000 U/L, undetectable haptoglobin, elevated unconjugated bilirubin) which could finally be successfully treated by hydroxocobalamin dose escalation."
    explanation: The primary case description of adult-onset hemolytic anemia in treated cblE.
  - reference: PMID:38736634
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of such complications in adulthood."
    explanation: >-
      Graded PARTIAL because it establishes the phenotype from a single sibling pair, which
      is why the frequency here is VERY_RARE.
  notes: >-
    Reported in one sibling pair. One of the two had a concurrent parvovirus B19 infection,
    which the authors note can cause erythroblastopenia even without immunocompromise, so
    the hemolysis and the viral trigger are not cleanly separable in that patient.
- name: Leukoencephalopathy
  category: Neurologic
  description: >-
    Diffuse white matter disease, demonstrated neuropathologically as spongiosis, necrosis
    and astrogliosis in a fatal neonatal case.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diffuse white matter lesions with spongiosis, necrosis and severe astrogliosis were also observed"
    explanation: Neuropathological documentation of leukoencephalopathy in cblE.
biochemical:
- name: Plasma Total Homocysteine
  notes: >-
    Markedly raised plasma total homocysteine is the cardinal biochemical abnormality and
    the recommended first-line test in any suspected remethylation disorder.
  presence: INCREASED
  biomarker_term:
    preferred_term: Hyperhomocystinemia
    term:
      id: HP:0002160
      label: Hyperhomocystinemia
  evidence:
  - reference: PMID:12555939
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical features included severe hyperhomocysteinaemia and hypomethioninaemia"
    explanation: Documents severe hyperhomocysteinemia in molecularly confirmed cblE.
  - reference: PMID:27905001
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We strongly recommend measuring plasma total homocysteine in any patient presenting with the combination of neurological and/or visual and/or haematological symptoms"
    explanation: Guideline basis for total homocysteine as the first-line diagnostic marker.
- name: Plasma Methionine
  notes: >-
    Low plasma methionine reflects failed regeneration by methionine synthase. It is not
    universal - one reported patient had severe hyperhomocysteinemia with normal methionine,
    so a normal methionine does not exclude cblE.
  presence: DECREASED
  biomarker_term:
    preferred_term: Hypomethioninemia
    term:
      id: HP:0003658
      label: Hypomethioninemia
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased plasma free homocystine (> 20 mumol/L), low plasma methionine (< 10 mumol/L)"
    explanation: Quantifies the paired hyperhomocysteinemia and hypomethioninemia in cblE.
  - reference: PMID:12555939
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe hyperhomocysteinaemia with normal methionine levels was found and enzymatic and complementation studies confirmed the cblE defect."
    explanation: >-
      Qualifies the marker - a confirmed cblE patient with normal methionine, so
      hypomethioninemia is characteristic but not obligatory.
- name: Urinary Homocystine
  notes: Homocystinuria without methylmalonic aciduria.
  presence: INCREASED
  biomarker_term:
    preferred_term: Homocystinuria
    term:
      id: HP:0002156
      label: Homocystinuria
  evidence:
  - reference: PMID:35337626
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inborn errors affecting synthesis of the methylcobalamin coenzyme required by methionine synthase (cblE and cblG) result in isolated homocystinuria"
    explanation: Defines the isolated-homocystinuria biochemical class to which cblE belongs.
- name: Urinary Methylmalonic Acid
  notes: >-
    Normal methylmalonic acid excretion, which is what separates cblE and cblG from the
    combined cobalamin disorders cblC, cblD, cblF and cblJ.
  presence: NORMAL
  evidence:
  - reference: PMID:23430521
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An urinary organic acid analysis revealed normal methylmalonic acid excretion."
    explanation: Confirms normal MMA in a genetically proven cblE patient.
  - reference: PMID:20301503
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total homocysteine (tHcy) level are the mainstays of biochemical testing."
    explanation: GeneReviews establishes the paired MMA/tHcy measurement that discriminates the complementation groups.
- name: Urinary Formiminoglutamate
  notes: >-
    Raised formiminoglutamate excretion, the expected marker of tetrahydrofolate
    unavailability in the methyl-folate trap.
  presence: INCREASED
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before treatment, major findings were microcephaly, psychomotor retardation, episodic reduced consciousness, megaloblastic anaemia, increased plasma free homocystine (> 20 mumol/L), low plasma methionine (< 10 mumol/L) and increased excretion of formiminoglutamate."
    explanation: Documents the folate-trapping marker in a cblE patient.
genetic:
- name: MTRR
  notes: >-
    MTRR encodes methionine synthase reductase, a ferredoxin-NADP(+) reductase family
    flavoprotein carrying FMN-, FAD- and NADPH-binding modules. Reported cblE alleles are
    private to individual families and spread across the coding sequence, including
    nonsense, splice and missense changes.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MTRR
    term:
      id: hgnc:7473
      label: MTRR
  evidence:
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reveal 11 mutations in eight patients from seven families belonging to the cblE complementation group"
    explanation: Original identification of MTRR as the cblE gene across multiple families.
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Apart from an intronic substitution found in two unrelated patients, the mutations appear singular among individuals."
    explanation: Documents the private, family-specific allelic spectrum.
  - reference: PMID:10484769
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distributed throughout the coding region, including proposed FMN, FAD and NADPH binding sites"
    explanation: Maps the variant spectrum onto the flavoprotein cofactor-binding modules.
  - reference: PMID:20301503
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MMACHC (cblC), MMADHC (cblD-combined and cblD-homocystinuria), MTRR (cblE), LMBRD1 (cblF), MTR (cblG), ABCD4 (cblJ)"
    explanation: >-
      GeneReviews assigns MTRR to the cblE complementation group in its diagnostic
      gene list, alongside the genes of the other complementation groups.
  - reference: PMID:15714522
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study shows a link between a milder predominantly hematological presentation and homozygosity for the c.1361C>T mutation, but no other obvious genotype-phenotype correlation."
    explanation: >-
      The one reported genotype-phenotype association - c.1361C>T homozygosity with a
      milder, predominantly haematological course. Graded PARTIAL because the same
      publication states no other correlation was apparent, and a later larger cohort found
      none at all.
  variants:
  - name: c.1361C>T
    description: >-
      Reported as associated with a milder, predominantly haematological presentation in
      homozygotes. This is the only genotype-phenotype link described for cblE, and it is
      contested - the larger 24-patient cblE/cblG survey found no genotype-phenotype
      correlations evident.
    evidence:
    - reference: PMID:15714522
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five known (c.903+469T>C, c.1361C>T, c.1459G>A, c.1557-4_1557+3del7, and c.1622_1623dupTA) and three novel mutations (c.7A>T, c.1573C>T, and c.1953-6_1953-2del5) were detected."
      explanation: Places c.1361C>T among the recurrent MTRR alleles in a nine-patient cblE series.
treatments:
- name: Parenteral Hydroxocobalamin
  description: >-
    Parenteral hydroxocobalamin is the first-line treatment and should be started without
    waiting for confirmatory testing in any suspected remethylation disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Impaired Homocysteine Remethylation
    description: >-
      Supplying cobalamin in large excess raises the fraction of methionine synthase that
      is loaded with cofactor, partially compensating for the failed reductive reactivation.
  evidence:
  - reference: PMID:27905001
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We strongly recommend to initiate treatment with parenteral hydroxocobalamin without delay in any suspected remethylation disorder; it significantly improves survival and incidence of severe complications."
    explanation: Guideline-strength recommendation for parenteral hydroxocobalamin in remethylation disorders including cblE.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydroxycobalamin has been more effective than cyanocobalamin."
    explanation: >-
      Supports the choice of hydroxocobalamin specifically over cyanocobalamin, which is
      the reason the form of cobalamin is named in the treatment rather than left generic.
  - reference: PMID:2688421
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have responded to therapy with cobalamin with resolution of anemia and biochemical abnormalities; neurological deficits resolved more slowly and in some cases incompletely."
    explanation: Documents reliable haematological and biochemical response but incomplete neurological response.
  - reference: PMID:25526710
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with the cblE and cblG defect show limited clinical response to treatment and have neurocognitive impairment."
    explanation: >-
      Tempers the treatment claim - biochemical correction is achievable but the clinical,
      and specifically neurocognitive, response is limited in most patients.
  - reference: PMID:38736634
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment mostly includes parenteral hydroxocobalamin to maximize the residual enzyme function and betaine to increase methionine concentrations and decrease homocysteine accumulation."
    explanation: >-
      States the rationale for the two-drug regimen - cobalamin to drive residual enzyme
      function, betaine to bypass it.
- name: Betaine
  description: >-
    Betaine provides an alternative, betaine-homocysteine methyltransferase-dependent route
    for remethylating homocysteine to methionine that bypasses methionine synthase
    entirely. Used in combination with hydroxocobalamin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betaine
      term:
        id: CHEBI:17750
        label: glycine betaine
  target_mechanisms:
  - target: Impaired Homocysteine Remethylation
    description: >-
      Bypasses the blocked methionine synthase reaction by donating a methyl group through
      betaine-homocysteine methyltransferase.
  evidence:
  - reference: PMID:25978498
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with hydroxocobalamin in combination with betaine appears to be useful for hematological improvement and prevention of brain disabilities in CblE-affected patients."
    explanation: Supports combined hydroxocobalamin plus betaine as the cblE regimen.
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical response to treatment with variable combinations of betaine, cobalamin, folate was significant."
    explanation: >-
      Cohort-level confirmation that betaine-containing combinations produce a significant
      biochemical response.
- name: Methylcobalamin
  description: >-
    Methylcobalamin supplies the methionine synthase cofactor in its already-methylated
    form. In one long-term case, substituting methylcobalamin for folate improved alertness,
    motor function, speech and EEG, with the best overall control on the two combined.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylcobalamin
      term:
        id: CHEBI:28115
        label: methylcobalamin
  target_mechanisms:
  - target: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
    description: >-
      Delivers the methylated cofactor directly, reducing dependence on the MTRR-catalysed
      reductive methylation step that is missing.
  evidence:
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On replacement of folate with methylcobalamin, alertness, motor function, speech and the electroencephalogram improved"
    explanation: Documents clinical and electrophysiological improvement on methylcobalamin.
  - reference: PMID:9427140
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The best control was observed on a combination of folate and methylcobalamin."
    explanation: Supports combined folate plus methylcobalamin over either alone in this patient.
- name: Folate Supplementation
  description: >-
    High-dose folate relieves the methyl-folate trap biochemically. Its effect is partial -
    formiminoglutamate excretion and homocystinuria nearly normalized on folate alone while
    clinical and haematological abnormalities persisted - so it is adjunctive to cobalamin,
    not a substitute for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Methyl-Group and Folate Trapping
    description: Replenishes usable folate pools sequestered as 5-methyltetrahydrofolate.
  evidence:
  - reference: PMID:9427140
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "On high-dose folic acid, biochemical abnormalities such as formiminoglutamate excretion and homocystinuria nearly normalized, but clinical and haematological abnormalities remained."
    explanation: >-
      Explicitly partial - the biochemical response to folate alone was good but the
      clinical and haematological disease was not corrected.
- name: Avoidance of Nitrous Oxide and Catabolic Stress
  description: >-
    Nitrous oxide irreversibly oxidises the cobalamin cofactor of methionine synthase and is
    contraindicated. Prolonged fasting, protein intake below the age-appropriate
    recommended allowance, and methionine-free medical foods are likewise to be avoided.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301503
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "methionine restriction including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide"
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid, naming nitrous oxide and methionine
      restriction as contraindicated in disorders of intracellular cobalamin metabolism.
  - reference: PMID:20301503
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolonged fasting (longer than overnight without dextrose-containing intravenous fluids)"
    explanation: GeneReviews warning against catabolic stress.
definitions:
- name: Biochemical case definition of cblE
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Raised plasma total homocysteine with low or normal methionine and normal methylmalonic
    acid, in a patient with megaloblastic anemia and/or developmental delay, confirmed by
    biallelic MTRR variants or by fibroblast complementation assigning the cblE group.
  evidence:
  - reference: PMID:20301503
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a disorder of intracellular cobalamin metabolism in a symptomatic individual is based on clinical, biochemical, and molecular genetic data."
    explanation: GeneReviews states the tripartite basis of diagnosis.
animal_models:
- name: Mtrr gene-trap hypomorphic mouse
  species: Mouse
  genotype: Mtrr(gt/gt) gene-trap homozygote
  publication: PMID:18413293
  description: >-
    The principal published Mtrr model is a gene-trap hypomorph rather than a null. It
    reproduces the upstream metabolic lesion - MTRR deficiency with hyperhomocysteinemia -
    but its reported phenotype is reproductive and cardiac (embryonic resorption, growth
    restriction, ventricular septal defects, placental defects), not the megaloblastic
    anemia and progressive neurocognitive disease that define human cblE. It has been used
    to study folate-pathway contributions to congenital heart defects and neural tube
    defects rather than as a model of the human disorder.
  genes:
  - preferred_term: MTRR
    term:
      id: hgnc:7473
      label: MTRR
  modeled_mechanisms:
  - target: MTRR Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces reduced MTRR function and the expected one-carbon metabolic perturbation,
      but as a hypomorphic gene trap with residual activity rather than the biallelic
      loss-of-function alleles seen in patients.
    limitations: >-
      Hypomorphic, not null; the human disorder is caused by biallelic loss-of-function or
      severely hypomorphic alleles, and the mouse allele's residual activity is not
      calibrated against any patient genotype.
    evidence:
    - reference: PMID:18413293
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we used mice harboring a gene-trapped (gt) allele in Mtrr"
      explanation: Identifies the allele as a gene trap in Mtrr, establishing the model's construction.
  - target: Impaired Erythropoiesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The defining human haematological phenotype - megaloblastic anemia - is not among the
      phenotypes reported for this model. The published characterisation is of reproductive
      outcome and cardiac development.
    limitations: >-
      The source publication assesses reproductive outcomes and cardiac phenotype at E14.5
      and reports no haematological phenotype at all. This is an absence of reported
      evidence rather than a documented negative erythroid result, so the failure is
      inferred from what the model has been shown to do, not from a marrow study that came
      back normal. Treat it as a gap in model coverage.
    evidence:
    - reference: PMID:18413293
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Reproductive outcomes and cardiac phenotype (presence of defects and myocardial thickness) were assessed at E14.5."
      explanation: >-
        Defines the scope of what was measured - reproductive and cardiac endpoints only,
        with no erythroid or marrow readout.

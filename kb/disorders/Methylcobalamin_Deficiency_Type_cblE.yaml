    snippet: "Microangiopathy was observed with an increase in vessel wall thickness, a reduction of the arterial inner diameter and capillary oedema."
    explanation: Confirms generalized microangiopathy as a tissue-level consequence.
  - reference: PMID:27905001
    reference_title: "Guidelines for diagnosis and management of the cobalamin-related remethylation disorders cblC, cblD, cblE, cblF, cblG, cblJ and MTHFR deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "atypical haemolytic uraemic syndrome or unexplained vascular thrombosis"
    explanation: >-
      Expert guidelines place atypical HUS and unexplained thrombosis among the
      presentations that should prompt testing for a remethylation disorder.
- name: Central Nervous System White Matter Injury
  description: >-
    Deficient S-adenosylmethionine-dependent methylation impairs myelin maintenance, and
    the resulting white matter disease underlies the developmental delay, microcephaly and
    seizures of cblE. Neuropathology in a fatal neonatal case showed diffuse white matter
    lesions with spongiosis, necrosis and severe astrogliosis. Unlike the haematological
    features, the neurological injury often persists despite biochemical correction.
  biological_scale: TISSUE

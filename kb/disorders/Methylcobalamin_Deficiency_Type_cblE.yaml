    explanation: Confirms in a genetically proven cblE patient that the adenosylcobalamin limb is spared.
- name: Methyl-Group and Folate Trapping
  description: >-
    Methionine synthase is the only reaction that regenerates tetrahydrofolate from
    5-methyltetrahydrofolate. When it stalls, folate is sequestered as
    5-methyltetrahydrofolate and becomes unavailable for one-carbon transfers - the
    classical methyl-folate trap. Reduced methionine also lowers S-adenosylmethionine,
    constraining the many downstream methylation reactions on which myelin maintenance and
    nucleotide synthesis depend. The trap explains the raised formiminoglutamate excretion
    seen in cblE and the partial biochemical response to pharmacological folate.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: tetrahydrofolate metabolic process
    modifier: DECREASED
    term:
      id: GO:0046653
      label: tetrahydrofolate metabolic process
  - preferred_term: methylation
    modifier: DECREASED
    term:
      id: GO:0032259
      label: methylation
  - preferred_term: one-carbon metabolic process
    modifier: DECREASED
    term:
      id: GO:0006730
      label: one-carbon metabolic process
  downstream:
  - target: Impaired Erythropoiesis
    causal_link_type: DIRECT
  - target: Central Nervous System White Matter Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Before treatment, major findings were microcephaly, psychomotor retardation, episodic reduced consciousness, megaloblastic anaemia, increased plasma free homocystine (> 20 mumol/L), low plasma methionine (< 10 mumol/L) and increased excretion of formiminoglutamate."
    explanation: >-
      Formiminoglutamate accumulates when tetrahydrofolate is unavailable for the
      formiminotransferase step, the expected consequence of methyl-folate trapping.
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "On high-dose folic acid, biochemical abnormalities such as formiminoglutamate excretion and homocystinuria nearly normalized, but clinical and haematological abnormalities remained."
    explanation: >-
      Pharmacological folate partially relieves the trap biochemically, supporting folate
      sequestration as a real component - though the persistence of clinical disease shows
      it is not the whole mechanism.
  - reference: PMID:27905001
    reference_title: "Guidelines for diagnosis and management of the cobalamin-related remethylation disorders cblC, cblD, cblE, cblF, cblG, cblJ and MTHFR deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired remethylation of homocysteine to methionine leads to accumulation of homocysteine and perturbation of numerous methylation reactions"
    explanation: Links the remethylation block to generalized methylation failure.
- name: Impaired Erythropoiesis
  description: >-
    Folate trapping starves thymidylate synthesis of methylene-tetrahydrofolate, so
    erythroid precursors cannot complete DNA replication while cytoplasmic maturation
    continues. The result is nuclear-cytoplasmic dyssynchrony in the marrow - megaloblastic
    change - with macrocytic anemia and, when severe, extension to other lineages as
    pancytopenia. The marrow picture can be mistaken for congenital dyserythropoietic
    anemia before the biochemical diagnosis is made.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030218
      label: erythrocyte differentiation
  evidence:
  - reference: PMID:25978498
    reference_title: "Methionine synthase reductase deficiency (CblE): A report of two patients and a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe two new cases of unrelated girls with megaloblastic anemia misclassified at first as congenital dyserythropoietic anemia with development of neurologic dysfunction in one of them."
    explanation: >-
      Documents megaloblastic marrow change in genetically confirmed cblE, including the
      diagnostic confusion with congenital dyserythropoietic anemia.
  - reference: PMID:23430521
    reference_title: "cblE-Type Homocystinuria Presenting with Features of Haemolytic-Uremic Syndrome in the Newborn Period."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a bone marrow examination revealed megaloblastic changes associated with hyperhomocysteinaemia"
    explanation: Marrow-level confirmation of megaloblastic erythropoiesis in cblE.
- name: Homocysteine-Mediated Endothelial Injury
  description: >-
    Severe hyperhomocysteinemia damages vascular endothelium and promotes thrombotic
    microangiopathy. In neonatal-onset cblE this can present as an atypical
    haemolytic-uraemic syndrome, and post-mortem examination has shown myointimal
    proliferation with luminal narrowing in the kidney and microangiopathic change in the
    brain. This is the pathway that makes remethylation disorders part of the differential
    for unexplained thrombosis and atypical HUS.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  downstream:
  - target: phenotypes#Hemolytic-Uremic Syndrome
    causal_link_type: DIRECT
    description: >-
      The thrombotic microangiopathy this node describes is what presents clinically as
      an atypical haemolytic-uraemic syndrome.
  - target: phenotypes#Pancytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Microangiopathic haemolysis and platelet consumption contribute to the cytopenias
      alongside the megaloblastic marrow defect. Marked INDIRECT because two mechanisms
      converge on this phenotype and their relative contribution is not established.
  evidence:

discussions:
- discussion_id: cble_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the Mtrr hypomorphic mouse show reproductive and cardiac phenotypes rather
    than the megaloblastic anemia and progressive neurocognitive disease that define human
    cblE, and is there any rodent model that reproduces the human syndrome?
  attaches_to:
  - pathophysiology#Impaired Erythropoiesis
  - pathophysiology#Central Nervous System White Matter Injury
  rationale: >-
    This is not an absence of evidence but a divergence in it. MTRR deficiency is
    well modelled in mouse at the level of the metabolic lesion, yet the two organ systems
    that carry the human disease burden are precisely the ones the mouse literature does
    not report. Candidate explanations are not equivalent and would have different
    consequences: the gene trap may be too hypomorphic to cross the threshold for
    erythroid or CNS disease, murine one-carbon metabolism and folate handling may buffer
    the block differently, or the relevant phenotypes may simply never have been assayed.
    Until this is resolved, the mouse cannot be used to test whether earlier treatment
    prevents the neurocognitive injury - which is the question that matters most clinically
    and the one the newborn-screening gap also turns on.
  evidence:
  - reference: PMID:18413293
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Mtrr deficiency adversely impacts reproductive outcomes and cardiac development in mice."
    explanation: >-
      The model's reported conclusion is about reproduction and cardiac development, not
      the haematological or neurological disease seen in patients.
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with the cblE and cblG defect show limited clinical response to treatment and have neurocognitive impairment."
    explanation: >-
      States the human outcome the model would need to reproduce to be useful for testing
      treatment timing.
- discussion_id: cble_newborn_screening_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does presymptomatic detection of cblE by newborn screening improve neurocognitive
    outcome, and which analyte combination detects it reliably?
  attaches_to:
  - pathophysiology#Central Nervous System White Matter Injury
  rationale: >-
    The haematological features of cblE respond well to hydroxocobalamin while the
    neurological injury often does not, which is the usual argument for presymptomatic
    treatment. But the screening evidence for cblE specifically is weak: the systematic
    review that recommends newborn screening for CBS and severe MTHFR deficiency
    explicitly declines to extend that to cblE, both because benefit-of-early-treatment
    data are weaker and because analyte performance data are more limited. Whether the
    persistent neurocognitive morbidity reflects irreversible prenatal or early postnatal
    injury, or simply late treatment, is unresolved.
  evidence:
  - reference: PMID:25762406
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the cblE and cblG defects, evidence for the benefit of early treatment is weaker; and data on performance of Met, Met/Phe and tHcy even more limited."
    explanation: Directly states the twin evidence gaps for cblE newborn screening.

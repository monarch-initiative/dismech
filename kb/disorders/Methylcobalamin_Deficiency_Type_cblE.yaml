      label: Feeding difficulties
  evidence:
  - reference: PMID:25526710
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "failure to thrive, feeding problems, delayed milestones, muscular hypotonia, cognitive impairment and macrocytic anaemia were the most frequent symptoms"
    explanation: Lists feeding problems among the most frequent symptoms in the cblE/cblG cohort.
- name: Seizure
  category: Neurologic
  description: >-
    Seizures occur but are among the less frequent neurological features; infantile spasms
    with a West syndrome presentation have been reported.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure

name: Methylcobalamin Deficiency Type cblE
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- cblE deficiency
- Cobalamin E disease
- Homocystinuria-megaloblastic anemia, cblE type
- Functional methionine synthase deficiency type cblE
- Methionine synthase reductase deficiency
- MTRR deficiency
- HMAE
description: >-
  Methylcobalamin deficiency type cblE is an autosomal recessive disorder of intracellular
  cobalamin metabolism caused by biallelic pathogenic variants in MTRR, which encodes
  methionine synthase reductase. Methionine synthase (MTR) uses methylcobalamin to transfer
  a methyl group from 5-methyltetrahydrofolate to homocysteine, regenerating methionine.
  Its cob(I)alamin cofactor is periodically oxidised to the inactive cob(II)alamin state,
  and MTRR is the flavoprotein that reductively remethylates it back to the active form.
  Losing MTRR therefore does not abolish methionine synthase protein or its intrinsic
  catalytic capacity; it strands the enzyme in an inactive oxidised state, which is why the
  defect is called a *functional* methionine synthase deficiency and why assaying MTR
  activity under strongly reducing conditions in vitro can appear normal.
  The block is confined to the remethylation limb of cobalamin metabolism, so patients show
  hyperhomocysteinemia and hypomethioninemia with normal methylmalonic acid - the
  biochemical signature that separates cblE and cblG from the combined disorders
  (cblC, cblD, cblF, cblJ). Clinically the disease presents in infancy with megaloblastic
  anemia and developmental delay, and can extend to microcephaly, nystagmus, seizures,
  leukoencephalopathy and, in severe neonatal cases, thrombotic microangiopathy resembling
  haemolytic-uraemic syndrome. Treatment is parenteral hydroxocobalamin with betaine as an
  alternative remethylation route; haematological response is generally good, but
  neurocognitive outcome can remain poor despite biochemical control.

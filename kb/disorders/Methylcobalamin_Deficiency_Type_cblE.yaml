- name: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
  description: >-
    Methionine synthase turnover intermittently oxidises its cob(I)alamin cofactor to
    catalytically inert cob(II)alamin. MTRR normally performs the NADPH-dependent reductive
    methylation that restores the active form. Without it methionine synthase accumulates in
    the oxidised state, so cellular methylcobalamin is depleted while methionine synthase
    protein and its intrinsic activity are preserved - a functional, not structural,
    enzyme deficiency. This is why patient fibroblast MTR activity can measure normal under
    strong reducing conditions and only falls when the reducing agent is limited.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: methionine synthase activity
    modifier: DECREASED
    term:
      id: GO:0008705
      label: methionine synthase activity

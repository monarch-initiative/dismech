- name: Macrocytic Anemia
  category: Hematologic
  description: >-
    Raised mean corpuscular volume is often described as characteristic, but it is not
    obligatory, and its absence must not be used to exclude cblE. In the largest single
    molecularly confirmed series the anemia was macrocytic in only three of nine patients,
    while megaloblastic marrow change was present in six of the seven examined. The marrow
    is the more reliable finding than the red cell indices.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Macrocytic anemia
    term:
      id: HP:0001972
      label: Macrocytic anemia
  evidence:
  - reference: PMID:25978498
    reference_title: "Methionine synthase reductase deficiency (CblE): A report of two patients and a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It presents with macrocytic anemia, hyperhomocysteinemia, and hypomethioninemia, and may also be accompanied with neurological impairment."
    explanation: Names macrocytic anemia among the described presenting features of cobalamin E disorder.
  - reference: PMID:15714522
    reference_title: "cblE type of homocystinuria due to methionine synthase reductase deficiency: functional correction by minigene expression."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented between 2 weeks and 3 years of age (median age 4 weeks) with anemia, which was macrocytic in only three patients, and with neurological involvement in all but two cases."
    explanation: >-
      Qualifies the macrocytosis - in nine molecularly confirmed cblE patients the anemia
      was macrocytic in only three, so a normal MCV does not exclude the diagnosis.
  notes: >-
    Graded OCCASIONAL rather than VERY_FREQUENT on the strength of PMID:15714522, where
    the anemia was macrocytic in only 3 of 9 molecularly confirmed patients. This is
    deliberately lower than the strongest contrary source - which is not a narrative
    review but the 24-patient cblE/cblG cohort PMID:25526710, listing macrocytic anaemia
    among the most frequent symptoms. The two reconcile if macrocytosis is common but not
    obligatory; the grading follows the study that actually counted. The megaloblastic
    marrow change is graded separately and higher, and is the more reliable finding.

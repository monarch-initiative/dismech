    - reference: DOI:10.1023/A:1025159103257
      reference_title: "CblE type of homocystinuria: Mild clinical phenotype in two patients homozygous for a novel mutation in the MTRR gene"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic analysis confirmed that both patients are homozygous for a novel mutation c.1361C > T in the methionine synthase reductase gene leading to a replacement of serine by leucine (S454L) in a highly conserved FAD‐binding domain."
      explanation: >-
        Locates the allele in a conserved FAD-binding domain, the structural basis for
        expecting reduced rather than abolished reductase activity.
treatments:
- name: Parenteral Hydroxocobalamin
  description: >-
    Parenteral hydroxocobalamin is the first-line treatment and should be started without
    waiting for confirmatory testing in any suspected remethylation disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  target_mechanisms:
  - target: Impaired Homocysteine Remethylation
    description: >-
      Supplying cobalamin in large excess raises the fraction of methionine synthase that
      is loaded with cofactor, partially compensating for the failed reductive reactivation.
  evidence:
  - reference: PMID:27905001
    reference_title: "Guidelines for diagnosis and management of the cobalamin-related remethylation disorders cblC, cblD, cblE, cblF, cblG, cblJ and MTHFR deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We strongly recommend to initiate treatment with parenteral hydroxocobalamin without delay in any suspected remethylation disorder; it significantly improves survival and incidence of severe complications."
    explanation: Guideline-strength recommendation for parenteral hydroxocobalamin in remethylation disorders including cblE.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Early institution of injectable hydroxocobalamin improves survival and may reduce but not completely prevent primary manifestations."
    explanation: >-
      GeneReviews on early treatment. Graded PARTIAL because it is explicitly qualified -
      survival improves but the primary manifestations are only reduced, not prevented,
      which matches the divergent haematological and neurological responses curated here.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of thromboembolic complications (e.g., HUS and thrombotic microangiopathy) includes initiation of hydroxocobalamin (OHCbl) and betaine or an increase in their doses."
    explanation: >-
      GeneReviews management of the thrombotic microangiopathy complication, directly
      relevant because HUS is curated as a phenotype of this disorder.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hydroxycobalamin has been more effective than cyanocobalamin."
    explanation: >-
      Supports the choice of hydroxocobalamin specifically over cyanocobalamin, which is
      the reason the form of cobalamin is named in the treatment rather than left generic.
  - reference: PMID:2688421
    reference_title: "Functional methionine synthase deficiency (cblE and cblG): clinical and biochemical heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients have responded to therapy with cobalamin with resolution of anemia and biochemical abnormalities; neurological deficits resolved more slowly and in some cases incompletely."
    explanation: Documents reliable haematological and biochemical response but incomplete neurological response.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with the cblE and cblG defect show limited clinical response to treatment and have neurocognitive impairment."
    explanation: >-
      Tempers the treatment claim - biochemical correction is achievable but the clinical,
      and specifically neurocognitive, response is limited in most patients.
  - reference: PMID:38736634
    reference_title: "Late-onset refractory hemolytic anemia in siblings treated for methionine synthase reductase deficiency: A rare complication possibly prevented by hydroxocobalamin dose escalation?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment mostly includes parenteral hydroxocobalamin to maximize the residual enzyme function and betaine to increase methionine concentrations and decrease homocysteine accumulation."
    explanation: >-
      States the rationale for the two-drug regimen - cobalamin to drive residual enzyme
      function, betaine to bypass it.
- name: Betaine
  description: >-
    Betaine provides an alternative, betaine-homocysteine methyltransferase-dependent route
    for remethylating homocysteine to methionine that bypasses methionine synthase
    entirely. Used in combination with hydroxocobalamin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: betaine
      term:
        id: CHEBI:17750
        label: glycine betaine
  target_mechanisms:
  - target: Impaired Homocysteine Remethylation
    description: >-
      Bypasses the blocked methionine synthase reaction by donating a methyl group through
      betaine-homocysteine methyltransferase.
  evidence:
  - reference: PMID:25978498
    reference_title: "Methionine synthase reductase deficiency (CblE): A report of two patients and a novel mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with hydroxocobalamin in combination with betaine appears to be useful for hematological improvement and prevention of brain disabilities in CblE-affected patients."
    explanation: Supports combined hydroxocobalamin plus betaine as the cblE regimen.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical response to treatment with variable combinations of betaine, cobalamin, folate was significant."
    explanation: >-
      Cohort-level confirmation that betaine-containing combinations produce a significant
      biochemical response.
- name: Methylcobalamin
  description: >-
    Methylcobalamin supplies the methionine synthase cofactor in its already-methylated
    form. In one long-term case, substituting methylcobalamin for folate improved alertness,
    motor function, speech and EEG, with the best overall control on the two combined.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylcobalamin
      term:
        id: CHEBI:28115
        label: methylcobalamin
  target_mechanisms:
  - target: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
    description: >-
      Delivers the methylated cofactor directly, reducing dependence on the MTRR-catalysed
      reductive methylation step that is missing.
  evidence:
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On replacement of folate with methylcobalamin, alertness, motor function, speech and the electroencephalogram improved"
    explanation: Documents clinical and electrophysiological improvement on methylcobalamin.
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The best control was observed on a combination of folate and methylcobalamin."
    explanation: Supports combined folate plus methylcobalamin over either alone in this patient.
- name: Folate Supplementation
  description: >-
    High-dose folate relieves the methyl-folate trap biochemically. Its effect is partial -
    formiminoglutamate excretion and homocystinuria nearly normalized on folate alone while
    clinical and haematological abnormalities persisted - so it is adjunctive to cobalamin,
    not a substitute for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folic acid
      term:
        id: CHEBI:27470
        label: folic acid
  target_mechanisms:
  - target: Methyl-Group and Folate Trapping
    description: Replenishes usable folate pools sequestered as 5-methyltetrahydrofolate.
  evidence:
  - reference: PMID:9427140
    reference_title: "Folate-responsive homocystinuria and megaloblastic anaemia in a female patient with functional methionine synthase deficiency (cblE disease)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "On high-dose folic acid, biochemical abnormalities such as formiminoglutamate excretion and homocystinuria nearly normalized, but clinical and haematological abnormalities remained."
    explanation: >-
      Explicitly partial - the biochemical response to folate alone was good but the
      clinical and haematological disease was not corrected.
- name: Avoidance of Nitrous Oxide and Catabolic Stress
  description: >-
    Nitrous oxide irreversibly oxidises the cobalamin cofactor of methionine synthase and is
    contraindicated. Prolonged fasting, protein intake below the age-appropriate
    recommended allowance, and methionine-free medical foods are likewise to be avoided.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "methionine restriction including use of medical foods that do not contain methionine; and the anesthetic nitrous oxide"
    explanation: >-
      GeneReviews Agents/Circumstances to Avoid, naming nitrous oxide and methionine
      restriction as contraindicated in disorders of intracellular cobalamin metabolism.
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolonged fasting (longer than overnight without dextrose-containing intravenous fluids)"
    explanation: GeneReviews warning against catabolic stress.
definitions:
- name: Biochemical case definition of cblE
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Raised plasma total homocysteine with low or normal methionine and normal methylmalonic
    acid, in a patient with megaloblastic anemia and/or developmental delay, confirmed by
    biallelic MTRR variants or by fibroblast complementation assigning the cblE group.
  evidence:
  - reference: PMID:20301503
    reference_title: "Disorders of Intracellular Cobalamin Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of a disorder of intracellular cobalamin metabolism in a symptomatic individual is based on clinical, biochemical, and molecular genetic data."
    explanation: GeneReviews states the tripartite basis of diagnosis.
animal_models:
- name: Mtrr gene-trap hypomorphic mouse
  species: Mouse
  genotype: Mtrr(gt/gt) gene-trap homozygote
  publication: PMID:18413293
  description: >-
    The principal published Mtrr model is a gene-trap hypomorph rather than a null. It
    reproduces the upstream metabolic lesion - MTRR deficiency with hyperhomocysteinemia -
    and, on dedicated haematological characterisation, a macrocytic anemia. That anemia is
    late adult-onset and largely confined to females, however, so it maps onto the human
    erythroid phenotype in kind rather than in timing or sex distribution. The model's
    other reported phenotypes are reproductive and cardiac (embryonic resorption, growth
    restriction, ventricular septal defects, placental defects); the progressive
    neurocognitive disease that defines human cblE has not been reported in it.
  genes:
  - preferred_term: MTRR
    term:
      id: hgnc:7473
      label: MTRR
  modeled_mechanisms:
  - target: MTRR Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces reduced MTRR function and the expected one-carbon metabolic perturbation,
      but as a hypomorphic gene trap with residual activity rather than the biallelic
      loss-of-function alleles seen in patients.
    limitations: >-
      Hypomorphic, not null; the human disorder is caused by biallelic loss-of-function or
      severely hypomorphic alleles, and the mouse allele's residual activity is not
      calibrated against any patient genotype.
    evidence:
    - reference: PMID:18413293
      reference_title: "Methionine synthase reductase deficiency results in adverse reproductive outcomes and congenital heart defects in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we used mice harboring a gene-trapped (gt) allele in Mtrr"
      explanation: Identifies the allele as a gene trap in Mtrr, establishing the model's construction.
    - reference: PMID:17369066
      reference_title: "Metabolic derangement of methionine and folate metabolism in mice deficient in methionine synthase reductase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mtrr(gt/gt) mice have increased plasma homocyst(e)ine, decreased plasma methionine, and increased tissue methyltetrahydrofolate."
      explanation: >-
        The model reproduces the full human biochemical triad - hyperhomocysteinemia,
        hypomethioninemia, and folate trapped as methyltetrahydrofolate. This, rather than
        the genotype alone, is what makes the model informative for the metabolic lesion.
    - reference: PMID:17369066
      reference_title: "Metabolic derangement of methionine and folate metabolism in mice deficient in methionine synthase reductase."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "This model is a hypomorph, with reduced methionine synthase reductase activity, thus avoiding the lethality associated with the absence of methionine synthase activity."
      explanation: >-
        Graded PARTIAL - the authors state the model is deliberately hypomorphic rather
        than null, which is the reason it is graded PARTIALLY_RECAPITULATES here.
  - target: Impaired Erythropoiesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Dedicated haematological phenotyping of this line shows that Mtrr(gt/gt) homozygotes
      do develop a macrocytic anemia with compensatory extramedullary haematopoiesis, so
      the erythroid consequence of MTRR deficiency is reproduced. It is reproduced
      partially: the murine anemia is late adult-onset and sex-limited, while human cblE
      presents with megaloblastic anemia in the first months of life in both sexes.
    limitations: >-
      Three specific divergences from the human phenotype. Onset - the murine defect is
      late adult-onset, whereas the human anemia is usually the presenting feature in
      infancy. Sex - female Mtrr(gt/gt) mice are anemic while males show erythrocytic
      macrocytosis without anemia; no comparable sex bias is reported in cblE. Morphology
      and kinetics - the authors state they could not establish whether the murine anemia
      meets megaloblastic criteria, and the reticulocytosis they observe runs opposite to
      the low reticulocyte count typical of human folate-deficiency megaloblastic anemia.
      The model is therefore informative for the erythroid consequence of MTRR deficiency
      but is not a surrogate for the infantile megaloblastic presentation that brings
      patients to attention.
    readouts:
    - name: Peripheral erythrocyte count and cell volume in adult females
      target: Impaired Erythropoiesis
      direction: ALTERED
      interpretation: >-
        Anemia with enlarged erythrocytes - the murine counterpart of the human macrocytic
        anemia, attributed by the authors to defective erythroid differentiation rather
        than to haemolysis.
      evidence:
      - reference: PMID:30024025
        reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mtrrgt/gt female mice displayed macrocytic anaemia, which might be due to defective erythroid differentiation at the exclusion of haemolysis"
        explanation: >-
          Reports the measurement and the authors' mechanistic reading of it - a production
          defect, which is what makes it a readout for the impaired-erythropoiesis node
          rather than for a haemolytic one.
    - name: Bone marrow cellularity and splenic extramedullary haematopoiesis
      target: Impaired Erythropoiesis
      direction: INCREASED
      interpretation: >-
        Compensatory expansion of erythropoiesis in response to the anemia, with raised
        renal Epo transcription driving it.
      evidence:
      - reference: PMID:30024025
        reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "This was associated with increased renal Epo mRNA expression, hypercellular bone marrow, and splenic extramedullary haematopoiesis."
        explanation: >-
          Establishes that the anemia provokes a normal compensatory response, so the
          lesion is in erythroid output rather than in the signal to produce red cells.
    evidence:
    - reference: PMID:30024025
      reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the hypomorphic Mtrrgt/gt mutation in mice results in late-onset and sex-specific blood defects, including macrocytic anaemia, extramedullary haematopoiesis and lymphopenia"
      explanation: >-
        The study was designed to phenotype this line haematologically, and it reports a
        blood phenotype. That is what makes the model informative for this node at all.
    - reference: PMID:30024025
      reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, the male response differed since Mtrrgt/gt male mice were not anaemic but did display erythrocytic macrocytosis and lymphopenia."
      explanation: >-
        Graded PARTIAL, and the reason the link is PARTIALLY_RECAPITULATES rather than
        RECAPITULATES - half the animals reproduce the macrocytosis without reproducing the
        anemia.
  evidence:
  - reference: PMID:18413293
    reference_title: "Methionine synthase reductase deficiency results in adverse reproductive outcomes and congenital heart defects in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that Mtrr deficiency adversely impacts reproductive outcomes and cardiac development in mice."
    explanation: >-
      Supports the model as informative for MTRR-dependent one-carbon metabolism in
      development, while showing its readout is reproductive and cardiac rather than the
      human cblE syndrome.
discussions:
- discussion_id: cble_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Human cblE presents in infancy with megaloblastic anemia and progressive neurocognitive
    disease, yet the Mtrr(gt/gt) mouse becomes anemic only in late adult life, only in
    females, with a rising rather than falling reticulocyte count, and with no reported
    neurological phenotype. Does that reflect residual activity of the hypomorphic allele,
    a species difference in erythroid and cerebral folate handling, or a different
    mechanism reaching the same cell type - and can any model reproduce the infantile
    presentation?
  attaches_to:
  - pathophysiology#Impaired Erythropoiesis
  - pathophysiology#Central Nervous System White Matter Injury
  rationale: >-
    The mismatch is not that the mouse lacks the human phenotypes - it has an erythroid one
    - but that the two systems diverge in different ways, and the difference matters for
    what the model can be used to test. On the erythroid side the divergence is in timing
    and kinetics: the anemia appears late in adult life and is accompanied by
    reticulocytosis, whereas human folate-deficiency megaloblastic anemia is
    reticulocytopenic, and the authors could not establish that the murine anemia is
    megaloblastic at all. So a mouse that models the consequence of chronic MTRR deficiency
    does not model the neonatal marrow crisis. On the neurological side the divergence is
    starker and mechanistically specific: the entry attributes human white-matter injury to
    deficient S-adenosylmethionine-dependent methylation, and in this line the AdoMet/AdoHcy
    ratio is preserved in most tissues - unlike other murine hyperhomocysteinemia models,
    where it falls. Until a model reproduces the infantile presentation, the question that
    matters most clinically - whether earlier treatment prevents the neurocognitive injury,
    which is also what the newborn-screening gap turns on - cannot be tested in mouse.
  evidence:
  - reference: PMID:30024025
    reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Even though Mtrrgt/gt female mice display macrocytic anaemia, we were unable to determine whether the anaemia fulfils megaloblastic status."
    explanation: >-
      The authors themselves decline to call the murine anemia megaloblastic, which is the
      precise point on which the model and the defining human phenotype part company.
  - reference: PMID:30024025
    reference_title: "Abnormal folate metabolism causes age-, sex- and parent-of-origin-specific haematological defects in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our finding that older Mtrrgt/gt female mice have increased reticulocyte counts contradicts most human cases of megaloblastic anaemia associated with folate deficiency wherein reticulocyte numbers are usually low"
    explanation: >-
      A directional contradiction rather than a difference of degree - the murine marrow
      response goes the opposite way to the human one, which is why this is curated as a
      mismatch and not merely as incomplete modelling.
  - reference: PMID:17369066
    reference_title: "Metabolic derangement of methionine and folate metabolism in mice deficient in methionine synthase reductase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unexpectedly, Mtrr(gt/gt) mice do not show decreases in the AdoMet/AdoHcy ratio in most tissues."
    explanation: >-
      A mechanistic account of the neurological half of the mismatch. The entry attributes
      the human CNS white-matter injury to deficient S-adenosylmethionine-dependent
      methylation, and in this model that very ratio is preserved in most tissues - so the
      mouse does not reproduce the step the human neurological phenotype is proposed to run
      through.
  - reference: PMID:17369066
    reference_title: "Metabolic derangement of methionine and folate metabolism in mice deficient in methionine synthase reductase."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Other mouse models for hyperhomocyst(e)inemia have normal or reduced levels of methyltetrahydrofolate and are not embryonic lethal, although they have decreased ratios of AdoMet/AdoHcy and impaired methylation."
    explanation: >-
      The contrast that sharpens the mismatch - other hyperhomocysteinemia models do show
      impaired methylation, so the preserved ratio is specific to the Mtrr hypomorph rather
      than a general property of murine hyperhomocysteinemia.
  - reference: PMID:25526710
    reference_title: "Clinical onset and course, response to treatment and outcome in 24 patients with the cblE or cblG remethylation defect complemented by genetic and in vitro enzyme study data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of patients with the cblE and cblG defect show limited clinical response to treatment and have neurocognitive impairment."
    explanation: >-
      States the human outcome the model would need to reproduce to be useful for testing
      treatment timing.
- discussion_id: cble_newborn_screening_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does presymptomatic detection of cblE by newborn screening improve neurocognitive
    outcome, and which analyte combination detects it reliably?
  attaches_to:
  - pathophysiology#Central Nervous System White Matter Injury
  rationale: >-
    The haematological features of cblE respond well to hydroxocobalamin while the
    neurological injury often does not, which is the usual argument for presymptomatic
    treatment. But the screening evidence for cblE specifically is weak: the systematic
    review that recommends newborn screening for CBS and severe MTHFR deficiency
    explicitly declines to extend that to cblE, both because benefit-of-early-treatment
    data are weaker and because analyte performance data are more limited. Whether the
    persistent neurocognitive morbidity reflects irreversible prenatal or early postnatal
    injury, or simply late treatment, is unresolved.
  evidence:
  - reference: PMID:25762406
    reference_title: "Newborn screening for homocystinurias and methylation disorders: systematic review and proposed guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the cblE and cblG defects, evidence for the benefit of early treatment is weaker; and data on performance of Met, Met/Phe and tHcy even more limited."
    explanation: Directly states the twin evidence gaps for cblE newborn screening.

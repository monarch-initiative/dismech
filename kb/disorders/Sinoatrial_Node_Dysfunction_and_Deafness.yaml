- name: CACNA1D gain-of-function alleles (contrasting dominant disorders)
  notes: >-
    Recorded to make the allelic contrast machine-visible, not because these
    variants cause SANDD. Heterozygous de novo GAIN-of-function CACNA1D
    variants produce dominant disorders that share no phenotypic overlap with
    SANDD: primary aldosteronism with seizures and neurologic abnormalities
    (PASNA), autism spectrum disorder, and a familial sinus node
    dysfunction/epilepsy/ADHD syndrome caused by an isoform-dependent
    p.Arg930His variant that is gain-of-function in the short brain isoform and
    loss-of-function in the long cardiac isoform. Deafness is not a feature of
    any of these dominant presentations. Note the therapeutic corollary: Cav1.3
    blockers such as isradipine are being explored for the gain-of-function
    disorders, and blocking an already non-conducting channel is not a rational
    strategy in SANDD.

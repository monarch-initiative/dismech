- name: Loss of Cav1.3 Calcium Current in Sinoatrial Pacemaker Cells
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    In sinoatrial node pacemaker cells the slow diastolic depolarization that
    sets the intrinsic firing rate is built from several inward currents,
    including the Cav1.3 L-type calcium current, which activates at unusually
    negative potentials (close to -55 mV under adrenergic activation). Loss of
    that current slows the rate of diastolic depolarization and delays the time
    at which the pacemaker cell reaches threshold, reducing intrinsic
    automaticity. In the Cav1.3-null mouse the sinoatrial L-type current density
    falls by 60-70%, quantifying the size of the lesion.
  cell_types:
  - preferred_term: cardiac pacemaker cell of sinoatrial node
    term:
      id: CL:1000477
      label: cardiac pacemaker cell of sinoatrial node
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity involved SA node cell action potential
    term:
      id: GO:0086059
      label: voltage-gated calcium channel activity involved SA node cell action potential
    modifier: DECREASED
  biological_processes:
  - preferred_term: membrane depolarization during SA node cell action potential
    term:
      id: GO:0086046
      label: membrane depolarization during SA node cell action potential
    modifier: DECREASED
  locations:

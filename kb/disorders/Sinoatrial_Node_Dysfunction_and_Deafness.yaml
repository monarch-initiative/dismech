diagnosis:
- name: Electrocardiography and ambulatory (Holter) rhythm monitoring
  description: >-
    A resting 12-lead ECG establishes the sinoatrial abnormality: a slow but
    regular rhythm with a narrow QRS complex, P waves that do not regularly
    precede the QRS, and a normal QT interval (which is what separates SANDD at
    the bedside from Jervell and Lange-Nielsen syndrome). Ambulatory Holter
    recording quantifies the mean and minimum rate and captures pauses; Holter
    tracings from genotyped SANDD homozygotes are published. Exercise testing
    is used to demonstrate chronotropic incompetence when exertional symptoms
    are present.
  presence: >-
    Resting bradycardia with sinoatrial node dysfunction was present in every
    affected individual across the reported families, so a normal resting ECG
    argues strongly against the diagnosis in a congenitally deaf proband.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His ECG wave form clearly mark regular but slow rhythm, narrow QRS complex, and P wave did not regularly precede the QRS complex."
    explanation: >-
      Describes the diagnostic electrocardiographic signature recorded in an
      affected individual.
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All deaf subjects showed pronounced SAN dysfunction at rest."
    explanation: >-
      Supports resting electrocardiographic assessment as sufficient to detect
      the cardiac abnormality, which was present at rest in all affected
      individuals.
- name: Ambulatory Holter monitoring
  description: >-
    Continuous ambulatory ECG quantifies mean, maximum, and minimum heart rate
    over the day-night cycle and documents sinus pauses. Holter recordings from
    homozygous SANDD subjects have been published and reproduced in review
    figures.
  diagnosis_term:
    preferred_term: Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  evidence:
  - reference: PMID:27374078
    reference_title: "Rescuing cardiac automaticity in L-type Cav1.3 channelopathies and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sample Holter ECG recordings from individuals with normal heart rate (a), or from SANDD affected subjects, who were homozygous for the mutation"
    explanation: >-
      Confirms that Holter monitoring has been applied to genotyped SANDD
      homozygotes and used to characterize their rhythm against controls.
- name: Audiometric assessment
  description: >-
    Pure-tone audiometry, supplemented in infancy by auditory brainstem
    response and otoacoustic emission testing, establishes the degree and
    configuration of the hearing loss. In SANDD it is congenital, bilateral,
    and severe (71-95 dB) to profound (>95 dB) across all frequencies, and
    formal vestibular assessment has not shown accompanying vestibular
    dysfunction.
  presence: >-
    Congenital severe-to-profound sensorineural hearing loss across all
    frequencies, with clinically normal vestibular function.
  diagnosis_term:
    preferred_term: audiometric testing
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deafness was congenital and severe (71–95 dB) or profound (>95 dB) in all frequencies for all affected members of the SANDD families"
    explanation: >-
      Reports the audiometric thresholds that define the auditory arm of the
      diagnosis.
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no obvious signs of vestibular dysfunction"
    explanation: >-
      Documents the negative vestibular finding that accompanies the audiometric
      result and helps separate SANDD from syndromic deafness with vestibular
      involvement.
- name: CACNA1D molecular genetic testing
  description: >-
    Molecular confirmation requires two pathogenic CACNA1D loss-of-function
    alleles in trans in an individual with a compatible phenotype. In families
    of Khyber Pakhtunkhwa origin, targeted testing for the founder
    p.(Gly403_Val404insGly) allele is the efficient first step; otherwise
    CACNA1D sequencing, a combined hearing-loss/arrhythmia panel, or exome
    sequencing is appropriate. Parental testing confirms phase and segregation.
    Interpretation must be direction-aware: heterozygous CACNA1D variants,
    particularly gain-of-function ones, cause mechanistically distinct dominant
    disorders and do not establish SANDD.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied five Pakistani families with SANDD and characterized a new missense variant p.(A376V) in CACNA1D in one family, and further characterized the founder variant p.(G403_V404insG) in four additional pedigrees."
    explanation: >-
      Documents the two CACNA1D alleles that molecular testing is looking for,
      including the recurrent founder variant.
  - reference: PMID:36430690
    reference_title: "Whole Exome Sequencing Identifies a Heterozygous Variant in the Cav1.3 Gene CACNA1D Associated with Familial Sinus Node Dysfunction and Focal Idiopathic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, homozygous loss of function mutations in CACNA1D encoding the Cav1.3 α1-subunit are described in congenital sinus node dysfunction and deafness."
    explanation: >-
      States the zygosity and functional-direction requirement that makes a
      molecular diagnosis of SANDD, as opposed to one of the heterozygous
      CACNA1D disorders.
- name: Cardiac screening of individuals with congenital deafness
  description: >-
    Because deafness is the ascertaining feature and the bradycardia may be
    clinically silent, electrocardiographic screening of individuals with
    congenital deafness in the founder region is recommended, so that affected
    individuals enter cardiac follow-up before symptomatic sinus node failure
    develops. The same logic underlies the long-standing practice of screening
    congenitally deaf children for the QT prolongation of Jervell and
    Lange-Nielsen syndrome.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  notes: >-
    Relocated from `treatments:` to `diagnosis:` because this is a case-finding
    procedure that detects the sinoatrial phenotype rather than a therapeutic
    action that treats it.
  evidence:
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, screening patients with congenital deafness for SAN dysfunction in this province could ensure adequate follow-up and prevent cardiac failure associated with SAN."
    explanation: >-
      The replication study explicitly recommends screening congenitally deaf
      individuals in the founder region for sinoatrial node dysfunction.
- name: Echocardiography to exclude structural heart disease
  description: >-
    Echocardiography is used to confirm that the heart is structurally normal,
    which is a defining condition of the inherited-channelopathy framing that
    places SANDD in the cardiac ion-channel module, and to exclude structural
    or cardiomyopathic causes of bradyarrhythmia. It also separates SANDD from
    HCN4-related bradycardia with left ventricular noncompaction and from
    LMNA-related conduction disease with cardiomyopathy.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  notes: >-
    No SANDD-specific imaging series has been published, so no evidence item is
    attached. This entry lists echocardiography as the standard exclusion step
    for structural causes of bradyarrhythmia rather than citing a stretched
    source; the project's evidence policy prefers an unevidenced description to
    a fabricated or over-reaching citation.
treatments:
- name: Permanent Cardiac Pacemaker Implantation
  description: >-
    Electronic pacing is the only established therapy for symptomatic sinus
    node dysfunction and is the mechanism-directed intervention for the cardiac
    arm of SANDD: it substitutes an artificial pacemaker for the failed
    Cav1.3-dependent sinoatrial automaticity. No SANDD-specific pacing series
    has been published, so the indication is extrapolated from general sick
    sinus syndrome management and the evidence below is graded accordingly.
    Device choice depends on whether atrioventricular conduction is also
    involved, which is an open question for this disorder.
  therapeutic_modality: DEVICE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Sinoatrial Node Pacemaker Dysfunction
    treatment_effect: BYPASSES
    description: >-
      Pacing does not restore the Cav1.3 current; it bypasses the failed
      sinoatrial pacemaker by imposing an external rhythm.
    evidence:
    - reference: PMID:27374078
      reference_title: "Rescuing cardiac automaticity in L-type Cav1.3 channelopathies and beyond."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Implantation of an electronic pacemaker constitutes the only available therapy for SSS."
      explanation: >-
        A review of Cav1.3 channelopathies states that electronic pacing is the
        only available therapy for sick sinus syndrome. Graded PARTIAL because
        the statement is about sick sinus syndrome in general rather than a
        SANDD-specific outcome series.
  target_phenotypes:
  - preferred_term: Sinus bradycardia
    term:
      id: HP:0001688
      label: Sinus bradycardia
  - preferred_term: Syncope
    term:
      id: HP:0001279
      label: Syncope
  evidence:
  - reference: PMID:27374078
    reference_title: "Rescuing cardiac automaticity in L-type Cav1.3 channelopathies and beyond."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Implantation of an electronic pacemaker constitutes the only available therapy for SSS."
    explanation: >-
      Supports pacing as the standard and only established therapy for the sick
      sinus phenotype; PARTIAL because it is not a SANDD-specific report.
- name: Cochlear Implantation
  description: >-
    Surgical cochlear implantation is the standard habilitation for congenital
    severe-to-profound sensorineural hearing loss and is the pragmatic option
    for the auditory arm of SANDD. No SANDD-specific implantation outcome data
    have been published; whether the underlying lesion is a pure presynaptic
    synaptopathy with a preserved spiral ganglion, which would predict good
    implant outcomes, is recorded as an open question in this entry's
    discussions.
  therapeutic_modality: SURGERY
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Congenital sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
  notes: >-
    Listed as standard-of-care habilitation by analogy with other congenital
    severe-to-profound sensorineural hearing loss. No evidence item is attached
    because no citable source reports cochlear implantation specifically in
    genotyped SANDD individuals, and the project's evidence policy prefers an
    unevidenced description over a stretched citation.
- name: Genetic Counseling
  description: >-
    Autosomal recessive counseling for consanguineous families, including the
    25% per-pregnancy recurrence risk for carrier couples and the availability
    of targeted testing for the founder p.Gly403_Val404insGly allele in families
    of Khyber Pakhtunkhwa origin. Heterozygous carriers are unaffected.
  therapeutic_modality: OTHER
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that affected individuals in the four families which segregate p.(G403_V404insG) share a 1.03 MB haplotype on 3p21.1 suggesting they share a common distant ancestor."
    explanation: >-
      Supports the founder-allele basis for targeted carrier testing in this
      population. Graded PARTIAL because the paper documents the founder
      haplotype rather than counseling practice itself.
- name: G-Protein-Gated Potassium (IKACh) Channel Inhibition
  description: >-
    An experimental, mechanism-directed strategy that does not replace the lost
    Cav1.3 current but removes an opposing hyperpolarizing current. Genetic or
    pharmacological ablation of the acetylcholine-activated inward-rectifier
    potassium current IKACh, for example with the GIRK pore blocker
    tertiapin-Q, rescues pacemaker activity in Cav1.3-null mice. This is
    preclinical only: no human SANDD trial exists, and the concept is included
    to record the therapeutic hypothesis attached to the mechanism, not to
    recommend treatment. Note the contrast with the dominant CACNA1D
    gain-of-function disorders, where Cav1.3 blockade is the rational strategy;
    blocking an already non-conducting channel would be pointless in SANDD.

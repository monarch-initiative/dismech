- name: Loss of Cav1.3 Calcium Current at the Inner Hair Cell Ribbon Synapse
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Cochlear inner hair cells convert sound-induced receptor potentials into
    graded glutamate release at specialized ribbon-type active zones. The
    calcium influx that triggers that release is carried almost entirely by
    Cav1.3 channels clustered at the ribbon, where only a small number of open
    channels impose the local nanodomain calcium signal on each release site.
    Non-conducting Cav1.3 therefore silences the presynaptic trigger for
    auditory transmitter release while leaving apical mechanotransduction
    itself intact.

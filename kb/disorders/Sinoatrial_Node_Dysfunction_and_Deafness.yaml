- name: Arrested Inner Hair Cell Maturation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    Cav1.3 does more in the cochlea than trigger release moment to moment: the
    spontaneous calcium action potentials it carries before the onset of
    hearing drive the inner hair cell's own maturation. In the Cav1.3-null
    mouse those spikes are absent and the cell fails to complete its
    developmental program. It does not acquire functional large-conductance
    calcium-activated potassium (BK) channels, retains immature
    small-conductance (SK) channel expression, and abnormally retains efferent
    cholinergic innervation that should normally be withdrawn around the onset
    of hearing. The deafness of SANDD is therefore not only an acute
    transmission block but also a developmental arrest, which is one reason the
    hearing loss is congenital and non-progressive rather than late-onset. This
    arm is currently established only in the mouse.

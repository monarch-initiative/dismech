name: Sinoatrial Node Dysfunction and Deafness
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Sinoatrial node dysfunction and deafness (SANDD) is an ultra-rare autosomal
  recessive human channelopathy caused by biallelic loss-of-function variants in
  CACNA1D, which encodes the pore-forming alpha-1D subunit of the Cav1.3 L-type
  voltage-gated calcium channel. It is mechanistically elegant because a single
  channel lesion produces two clinically unrelated manifestations in two
  tissues: Cav1.3 carries the low-threshold, slowly inactivating L-type calcium
  current that contributes to diastolic depolarization in sinoatrial node
  pacemaker cells, and the same channel supplies the calcium influx that
  triggers glutamate release at the cochlear inner hair cell ribbon synapse.
  Affected individuals therefore present with congenital severe-to-profound
  sensorineural deafness (with no evidence of vestibular dysfunction) together
  with pronounced resting bradycardia, increased resting heart-rate variability,
  and episodic syncope that may be triggered by exertion or emotional stress.
  The disorder was defined in consanguineous Pakistani families, in which a
  founder in-frame glycine insertion near the channel pore
  (c.1208_1209insGGG, p.Gly403_Val404insGly) yields non-conducting Cav1.3
  channels; the human phenotype closely recapitulates the Cacna1d-null mouse.
  Heterozygous carriers of the SANDD alleles are unaffected, which distinguishes
  SANDD from the dominant CACNA1D gain-of-function disorders (primary
  aldosteronism with seizures and neurologic abnormalities, autism spectrum
  disorder, and a sinus-node-dysfunction/epilepsy syndrome) that arise at the
  same locus.

mechanistic_hypotheses:
- hypothesis_group_id: cav1_3_two_tissue_divergence
  hypothesis_label: Single-Channel Two-Tissue Divergence Model
  status: CANONICAL
  description: >-
    One Cav1.3 loss-of-function lesion produces two clinically unrelated
    manifestations because the same low-voltage-activated, slowly inactivating
    L-type calcium channel performs two non-redundant jobs in two tissues:
    contributing inward current to diastolic depolarization in sinoatrial node
    pacemaker cells (yielding bradycardia and sinoatrial node dysfunction), and
    supplying the presynaptic calcium influx that triggers graded glutamate
    release at the cochlear inner hair cell ribbon synapse (yielding congenital
    deafness). Neither job can be taken over by the co-expressed Cav1.2
    channel, whose more depolarized activation threshold is unsuitable for
    either. The human phenotype closely recapitulates the Cacna1d-null mouse,
    which supports the model rather than a species-specific mechanism.
  evidence:
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ca(v)1.3 voltage-gated L-type calcium channels (LTCCs) translate sound-induced depolarization into neurotransmitter release in auditory hair cells and control diastolic depolarization in the mouse sinoatrial node (SAN)."
    explanation: >-
      Names both tissue-specific roles of the single channel, the premise of the
      divergence model.
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a human channelopathy (termed SANDD syndrome, sinoatrial node dysfunction and deafness) with a cardiac and auditory phenotype that closely resembles that of Cacna1d(-/-) mice."
    explanation: >-
      Confirms that the two-arm human phenotype matches the null mouse,
      supporting a shared single-channel mechanism.
  - reference: PMID:10929716
    reference_title: "Congenital deafness and sinoatrial node dysfunction in mice lacking class D L-type Ca2+ channels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that alpha1D can form LTCCs with negative activation thresholds essential for normal auditory function and control of cardiac pacemaker activity."
    explanation: >-
      The genetic null demonstrates that the negative activation threshold of
      Cav1.3 is required for both functions, explaining the non-redundancy.
discussions:
- discussion_id: gap_sandd_vestibular_sparing
  prompt: >-
    Why is vestibular function spared in SANDD when cochlear inner hair cell
    transmission fails, given that vestibular hair cells also use ribbon
    synapses? Do vestibular hair cells rely on a different calcium channel
    complement (for example a larger Cav1.2 contribution) or on a
    Cav1.3-independent release mode?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Cav1.3 Calcium Current at the Inner Hair Cell Ribbon Synapse
  rationale: >-
    Both the MONDO definition and the clinical reports emphasize that affected
    individuals have no evidence of vestibular dysfunction despite congenital
    profound cochlear deafness. Vestibular hair cells use morphologically
    similar ribbon synapses, so their sparing implies a genuine molecular
    difference in the calcium channel complement or in the coupling between
    channels and release sites. Resolving this would refine the mechanism and
    would matter for any future channel-targeted therapy.
  proposed_experiments:
  - experiment_id: exp_sandd_vestibular_channel_complement
    name: Comparative calcium-channel profiling of cochlear versus vestibular hair cells
    description: >-
      Quantify Cav1.3 versus Cav1.2 expression and the calcium current carried
      by each in cochlear inner hair cells and in utricular/saccular vestibular
      hair cells from the same animals, and repeat in a Cav1.3-null background
      to establish which release sites remain functional.
- discussion_id: gap_sandd_human_cochlear_degeneration
  prompt: >-
    Does hair cell degeneration actually occur in the human SANDD cochlea, or
    is the human deafness a pure synaptopathy with a structurally preserved
    organ of Corti? This determines whether cochlear implantation should be
    expected to work as well as in other congenital deafness, and whether a
    presynaptic-targeted therapy could ever be viable.
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of Auditory Synaptic Transmission and Hair Cell Degeneration
  rationale: >-
    Hair cell degeneration in Cav1.3 deficiency is documented only in the
    Cacna1d-null mouse; no human cochlear histopathology or spiral-ganglion
    imaging has been reported in SANDD. The distinction matters clinically: a
    pure presynaptic synaptopathy with an intact spiral ganglion is the ideal
    substrate for cochlear implantation, whereas secondary degeneration
    extending to the ganglion would predict poorer outcomes. The mouse data
    sharpen rather than settle the question, and they point the wrong way for
    implant candidacy: ribbon synapses are initially built and preserved, but
    the Cav1.3-deficient inner hair cells later lose their afferent synapses,
    probably through secondary degeneration of the postsynaptic spiral ganglion
    neurons (PMID:16828974). If that sequence holds in humans there may be a
    time-limited window in which the auditory nerve is still implantable. The
    question also determines whether the auditory arm is in principle
    reversible by restoring channel function.
  proposed_experiments:
  - experiment_id: exp_sandd_auditory_neuropathy_workup
    name: Electrophysiological and imaging phenotyping of the SANDD auditory pathway
    description: >-
      In genotyped SANDD individuals, combine otoacoustic emissions (to test
      outer hair cell integrity), auditory brainstem response and
      electrocochleography (to localize the block to the synapse versus the
      nerve), and high-resolution cochlear MRI/CT, then correlate with cochlear
      implant outcomes.
- discussion_id: gap_sandd_human_av_block
  prompt: >-
    Does human SANDD include clinically significant atrioventricular conduction
    disease, up to complete heart block, as the Cav1.3-null mouse does, and if
    so at what frequency and at what age?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Atrioventricular Conduction Slowing
  rationale: >-
    Cav1.3-null mice show frank atrioventricular block, and review literature
    describes atrioventricular conduction disease within the Cav1.3
    channelopathy spectrum, but the abstract-level human evidence in SANDD
    extends only to a single observation that P waves did not regularly precede
    the QRS. This matters directly for device selection: isolated sinus node
    dysfunction may be treated with atrial pacing, whereas coexisting
    atrioventricular block requires dual-chamber pacing. Systematic Holter and
    electrophysiological characterization of genotyped individuals would
    resolve it.
  proposed_experiments:
  - experiment_id: exp_sandd_conduction_phenotyping
    name: Systematic conduction-system phenotyping of genotyped SANDD individuals
    description: >-
      Perform 12-lead ECG, 24-48 hour Holter, exercise testing for chronotropic
      competence, and where clinically indicated invasive electrophysiological
      study (AH and HV intervals) across the known SANDD pedigrees, reporting
      per-individual atrioventricular conduction status by genotype.

    term:
      id: UBERON:0002351
      label: sinoatrial node
  evidence:
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ca(v)1.3 voltage-gated L-type calcium channels (LTCCs) translate sound-induced depolarization into neurotransmitter release in auditory hair cells and control diastolic depolarization in the mouse sinoatrial node (SAN)."
    explanation: >-
      States the two tissue-specific roles of Cav1.3, including control of
      diastolic depolarization in the sinoatrial node.
  - reference: PMID:27374078
    reference_title: "Rescuing cardiac automaticity in L-type Cav1.3 channelopathies and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "L-type Cav 1.3 channels play a major role in the generation and regulation of sino-atrial pacemaker activity and atrioventricular conduction."
    explanation: >-
      Confirms Cav1.3 as a major contributor to sinoatrial pacemaker activity,

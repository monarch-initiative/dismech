      non-conducting Cav1.3 channels.
  - reference: PMID:27374078
    reference_title: "Rescuing cardiac automaticity in L-type Cav1.3 channelopathies and beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutation in the CACNA1D gene encoding Cav 1.3 channels induces loss-of-function in channel activity and underlies the sino-atrial node dysfunction and deafness syndrome (SANDD)."
    explanation: >-
      Review confirms channel loss of function as the proximate trigger of
      SANDD.
  downstream:

inheritance:
- name: Autosomal Recessive
  description: >-
    SANDD is inherited in an autosomal recessive manner. All reported families
    are consanguineous Pakistani pedigrees in which affected individuals are
    homozygous for a CACNA1D loss-of-function allele; heterozygous carriers,
    including the obligate-carrier parents, are clinically unaffected with
    respect to both hearing and heart rate. Four of the five families in the
    replication cohort share a 1.03 Mb haplotype around the founder
    p.Gly403_Val404insGly allele, indicating a common distant ancestor. Carrier
    couples face the standard 25% per-pregnancy recurrence risk.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21131953
    reference_title: "Loss of Ca(v)1.3 (CACNA1D) function in a human channelopathy with bradycardia and congenital deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used positional cloning to identify a mutation in CACNA1D, which encodes the pore-forming α1 subunit of Ca(v)1.3 LTCCs, in two consanguineous families with deafness."
    explanation: >-
      Positional cloning in consanguineous pedigrees establishes the recessive
      architecture of the disorder.
  - reference: PMID:30498240
    reference_title: "Identification of CACNA1D variants associated with sinoatrial node dysfunction and deafness in additional Pakistani families reveals a clinical significance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that affected individuals in the four families which segregate p.(G403_V404insG) share a 1.03 MB haplotype on 3p21.1 suggesting they share a common distant ancestor."
    explanation: >-
      Shared-haplotype analysis across four additional consanguineous pedigrees
      confirms recessive segregation of a founder allele.
  - reference: PMID:36430690
    reference_title: "Whole Exome Sequencing Identifies a Heterozygous Variant in the Cav1.3 Gene CACNA1D Associated with Familial Sinus Node Dysfunction and Focal Idiopathic Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, homozygous loss of function mutations in CACNA1D encoding the Cav1.3 α1-subunit are described in congenital sinus node dysfunction and deafness."
    explanation: >-
      Independent confirmation that the SANDD phenotype requires homozygous
      (biallelic) loss of function, distinguishing it from the heterozygous
      CACNA1D presentations.

notes: >-
  IDENTITY / NEC NOTE. The causal gene of MONDO:0013960 (OMIM 614896) is
  CACNA1D, encoding Cav1.3, not HCN4. The curation issue that requested this
  entry (monarch-initiative/dismech#7716) described SANDD as "biallelic loss of
  the HCN4 pacemaker channel"; the mandatory NEC preflight against the MONDO
  record (which asserts RO:0004003 to HGNC:1391 CACNA1D) and against the
  founding literature (PMID:21131953, which coined the SANDD name for the
  CACNA1D channelopathy; and PMID:32601767, which ties CACNA1D to OMIM 614896
  by number) showed that attribution to be incorrect. HCN4 is the
  hyperpolarization-activated "funny current" gene; its variants cause
  autosomal dominant sick sinus syndrome / bradycardia with or without left
  ventricular noncompaction WITHOUT deafness, and that entity is curated
  separately as Familial Sick Sinus Syndrome. This entry is curated against the
  verified CACNA1D identity.

  DIFFERENTIAL. The closest phenotypic mimic is Jervell and Lange-Nielsen
  syndrome, which also pairs congenital profound deafness with a cardiac
  channelopathy but is caused by biallelic KCNQ1/KCNE1 variants and produces QT
  prolongation and ventricular tachyarrhythmia rather than bradycardia. The
  founding SANDD paper contrasts the two explicitly. SANDD is distinguished at
  the bedside by a slow, regular rhythm with a narrow QRS and a normal QT.
  Other differentials are HCN4-related sinus node disease and SCN5A-related
  conduction disease (neither with deafness), and the dominant CACNA1D
  neurodevelopmental/endocrine channelopathies (no deafness, plus neurologic or
  endocrine features).

  ABSENCE OF VESTIBULAR INVOLVEMENT. Both the MONDO definition and the
  published families emphasize that vestibular function is spared despite
  profound cochlear deafness. This is a mechanistically informative negative
  finding (vestibular hair cells appear less dependent on Cav1.3 than cochlear
  inner hair cells) and is recorded here as a discussion/knowledge gap rather
  than as a phenotype assertion.

  ATRIOVENTRICULAR CONDUCTION. Reviews of the Cav1.3 channelopathies describe
  atrioventricular conduction disease as part of the spectrum, and the
  Cav1.3-null mouse clearly shows atrioventricular block. In humans, the only
  abstract-verifiable observation is that P waves do not regularly precede the
  QRS complex in an affected individual. Human high-grade atrioventricular
  block is therefore modeled here only as a model-organism-supported mechanism
  plus an open knowledge gap, not as an established human phenotype with a
  frequency band.

  MODULE CONFORMANCE SCOPE. This entry declares conforms_to against
  cardiac_ion_channel_repolarization for the cardiac arm only. It deliberately
  does NOT declare conformance to sensorineural_hair_cell_loss: that module's
  central effector node is "Hair Cell Mechanotransduction Failure and Death",
  framed around oxidative/ototoxic injury causing mechanotransduction failure,
  whereas the SANDD lesion is a presynaptic ribbon-synapse Ca2+-influx failure
  downstream of intact mechanotransduction, with hair cell degeneration
  demonstrated only in the mouse null. Asserting that conformance would
  misstate the mechanism.

  GROUPING CANDIDACY. SANDD satisfies the NECESSARY_AND_SUFFICIENT criteria of
  the Inherited_Arrhythmia_Syndromes grouping (conforms to the cardiac
  ion-channel module in a structurally normal heart, and does not conform to
  cardiomyopathy_maladaptive_remodeling), so `just check-groupings` should
  surface it as a candidate member alongside Familial Sick Sinus Syndrome. The
  grouping file is intentionally not edited by this PR.

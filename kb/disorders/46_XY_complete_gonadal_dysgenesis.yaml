    Gonads may appear as small streak-like structures or may not be visualized;
    the correct anatomic framing is dysgenetic gonads rather than small ovaries.
  evidence:
  - reference: PMID:39149602
    reference_title: "Case report: Rare heterozygous variant in the NR5A1 gene causing 46,XY complete gonadal dysgenesis with a non-communicating rudimentary uterus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no evidence of bilateral adnexa.
    explanation: Documents nonvisualization of bilateral gonadal/adnexal structures.
- name: Imaging may be normal despite gonadal germ-cell tumor
  modality: OTHER
  diagnostic: false
  description: >-
    Normal imaging does not exclude gonadoblastoma or invasive germ-cell tumor
    in dysgenetic gonads and is not a validated substitute for definitive
    management.
  evidence:
  - reference: PMID:36767504
    reference_title: "Late Diagnosis of Swyer Syndrome in a Patient with Bilateral Germ Cell Tumor Treated with a Contraceptive Due to Primary Amenorrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonadal dysgerminoma should be suspected even in the absence of tumor
      features on ultrasound and blood laboratory tests.
    explanation: Directly states the limitation of normal imaging and laboratory tests.
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the limitation of tumor markers and US or MRI/CT to detect them and
      missing guidelines for surveillance.
    explanation: Supports the lack of reliable imaging/marker surveillance.
diagnosis:
- name: Integrated clinical and endocrine assessment
  description: >-
    Assess growth, Tanner stage, breast development, external genital anatomy,
    family history, syndromic features, and age-appropriate FSH, LH, estradiol,
    testosterone, and optionally AMH/inhibin B. The high-gonadotropin,
    low-estradiol pattern indicates primary gonadal failure.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Absent or incomplete puberty with hypergonadotropic gonadal failure.
  evidence:
  - reference: PMID:39149602
    reference_title: "Case report: Rare heterozygous variant in the NR5A1 gene causing 46,XY complete gonadal dysgenesis with a non-communicating rudimentary uterus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high luteinizing and follicle-stimulating hormone levels, slightly high
      testosterone levels, high dehydroepiandrosterone sulfate levels, normal
      sex hormone-binding globulin levels, low estradiol levels, and
      anti-Müllerian hormone (AMH) levels below detection sensitivity.
    explanation: Directly supplies a complete-disease endocrine profile.
- name: Formal karyotype analysis
  description: >-
    Formal chromosome analysis confirms the defining 46,XY complement and
    evaluates mosaicism or structural chromosome abnormalities.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  results: Nonmosaic 46,XY karyotype in classic disease.
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We recommend formal Karyotyping, even if Y chromosome material has been
      detected by other methods.
    explanation: Directly supports formal karyotype testing in 46,XY DSD.
- name: Abdominopelvic ultrasonography
  description: >-
    Ultrasound assesses Müllerian structures, gonad location, and any mass.
    Nonvisualization is common and normal findings do not exclude neoplasia.
  diagnosis_term:
    preferred_term: Ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All patients with 46, XY DSD should undergo abdominopelvic
      ultrasonography by a trained radiologist.
    explanation: Directly supports ultrasound in the diagnostic workup.
- name: Pelvic MRI or laparoscopy when anatomy remains uncertain
  description: >-
    MRI helps define Müllerian anatomy and locate nonvisualized gonads;
    laparoscopy can be used when imaging remains indeterminate or as part of
    definitive gonadectomy.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRI of the abdomen and/or laparoscopy may be used to demonstrate the
      Mullerian structure and/or to localize the gonads.
    explanation: Directly supports MRI or laparoscopy for unresolved anatomy.
- name: Copy-number analysis and broad DSD molecular testing
  description: >-
    Testing should not stop at SRY sequencing. Copy-number analysis followed by
    a phenotype-informed DSD panel or exome/genome approach can identify
    sequence and regulatory causes; a negative result does not exclude the
    clinical diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36424806
    reference_title: "Diagnostic approach in 46, XY DSD: an endocrine society of bengal (ESB) consensus statement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic studies, which include copy number variation (CNV) or molecular
      testing of a candidate gene or next generation sequencing then should be
      ordered in a stepwise manner
    explanation: Directly supports CNV and sequencing-based evaluation.
- name: Tumor evaluation when a mass or malignancy is suspected
  description: >-
    If a mass or symptoms raise concern, obtain age-appropriate germ-cell-tumor
    evaluation and oncology input. Normal laboratory tests or imaging do not
    exclude gonadoblastoma or dysgerminoma and should not be treated as a
    surveillance substitute for management of the susceptible gonads.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:36767504
    reference_title: "Late Diagnosis of Swyer Syndrome in a Patient with Bilateral Germ Cell Tumor Treated with a Contraceptive Due to Primary Amenorrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonadal dysgerminoma should be suspected even in the absence of tumor
      features on ultrasound and blood laboratory tests.
    explanation: Directly supports the limitation of normal imaging and laboratory tests.
- name: Complete histopathology of bilateral gonadectomy specimens
  description: >-
    Resected gonads should undergo complete histopathologic examination for
    fibrous dysgenesis, gonadoblastoma, germ-cell neoplasia in situ, and invasive
    tumor. A benign limited biopsy should not be treated as reliable exclusion
    of focal neoplasia and does not remove the susceptible tissue.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      evaluate clinical features and histopathological outcome after gonadectomy
      in patients with XY-DSD
    explanation: Supports histopathologic evaluation after gonadectomy.
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tissue samples had been previously taken laparoscopically with benign
      histology.
    explanation: >-
      A later tumor after benign samples in this mixed XY-DSD cohort illustrates
      the sampling limitation without presenting it as complete-disease-specific evidence.
differential_diagnoses:
- name: Complete androgen insensitivity syndrome
  description: >-
    CAIS also presents with a typical female external phenotype and 46,XY
    karyotype, but differentiated testes produce AMH, so the uterus is absent;
    testosterone is in the male range and breast development usually occurs
    through aromatization.
  disease_term:
    preferred_term: complete androgen insensitivity syndrome
    term:
      id: MONDO:0021023
      label: complete androgen insensitivity syndrome
  evidence:
  - reference: PMID:38905377
    reference_title: "Pure 46, XY gonadal dysgenesis and 46, XY complete androgen insensitivity syndrome: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present 2 rare cases of 46, XY DSD, specifically XY pure gonadal
      dysgenesis and complete androgen insensitivity syndrome.
    explanation: Supports the close clinical differential.
- name: 46,XX gonadal dysgenesis
  description: >-
    The endocrine and pubertal phenotype can be nearly identical, but formal
    karyotype distinguishes 46,XX from 46,XY disease and only the latter carries
    the Y-associated gonadal tumor substrate.
  disease_term:
    preferred_term: 46,XX gonadal dysgenesis
    term:
      id: MONDO:0009299
      label: 46 XX gonadal dysgenesis
  evidence:
  - reference: PMID:21982289
    reference_title: "Complete gonadal dysgenesis in clinical practice: the 46,XY karyotype accounts for more than one third of cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      normal karyotype (46,XX or 46,XY)
    explanation: Shows that complete gonadal dysgenesis occurs with either karyotype.
- name: Turner syndrome
  description: >-
    Turner syndrome can also cause streak gonads, hypergonadotropic hypogonadism,
    and absent puberty. Formal chromosome analysis and assessment for associated
    features distinguish it from nonmosaic 46,XY complete gonadal dysgenesis.
  evidence:
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no feature suggestive of Turner syndrome and no skeletal
      deformity was found.
    explanation: >-
      Shows Turner syndrome being considered during a gonadal-dysgenesis
      differential; the evidence does not define the full Turner spectrum.
- name: 45,X/46,XY mixed gonadal dysgenesis
  description: >-
    Sex-chromosome mosaic mixed gonadal dysgenesis is a separate chromosome-DSD
    diagnosis, often with asymmetric gonadal development rather than the
    nonmosaic 46,XY bilateral complete phenotype. Formal chromosome analysis
    distinguishes it from this root.
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      sex chromosome DSD (Klinefelter or Turner Syndrome, chimerism), XX-DSD,
      and 46 XY-DSD
    explanation: >-
      Supports separation of sex-chromosome mosaic DSD from the 46,XY DSD
      category; the detailed asymmetric phenotype is clinical synthesis.
- name: Partial or mixed 46,XY gonadal dysgenesis
  description: >-
    Partial or mixed disease is a distinct tumor-prone category that does not
    meet the complete bilateral streak-gonad case definition; residual testicular
    differentiation and the full genital and gonadal phenotype must be assessed.
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gonadoblastoma, which is commonly observed in complete or partial
      dysgenesis
    explanation: Supports complete and partial dysgenesis as distinct tumor-prone categories.
- name: Testicular regression syndrome
  description: >-
    Testicular regression syndrome reflects loss of previously differentiated
    testicular tissue and spans absent or variable residual gonads and genital
    phenotypes. Evidence of prior fetal testicular function distinguishes it
    from complete failure of testis differentiation with bilateral streak gonads.
  evidence:
  - reference: PMID:40026690
    reference_title: "Profile of DHX37 gene defects in human genetic diseases: 46,XY disorders of sex development."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      in testicular regression syndrome and 46,XY gonadal dysgenesis cohorts,
      they have a high detection rate.
    explanation: >-
      Establishes testicular regression and gonadal dysgenesis as separately
      named DHX37-associated cohorts; detailed distinguishing features are
      clinical synthesis rather than a claim from this snippet.
- name: Mayer-Rokitansky-Küster-Hauser syndrome
  description: >-
    MRKH causes primary amenorrhea with uterine and upper-vaginal aplasia or
    hypoplasia in a 46,XX individual who has functioning ovaries and spontaneous
    pubertal breast development; fallopian-tube anatomy can be variable.
  disease_term:
    preferred_term: Mayer-Rokitansky-Kuster-Hauser syndrome
    term:
      id: MONDO:0017771
      label: Mayer-Rokitansky-Kuster-Hauser syndrome
  evidence:
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with Mullerian agenesis lack all derivatives of the mullerian
      ducts (fallopian tubes, uterus, cervix, and upper vagina) but have ovaries
      and undergo puberty, with appropriately timed breast development
    explanation: >-
      Directly distinguishes ovarian function and uterine/upper-vaginal anatomy;
      its blanket statement about all duct derivatives is not universally applicable.
- name: Central hypogonadism
  description: >-
    Hypothalamic or pituitary gonadotropin deficiency can cause absent puberty
    and amenorrhea, but FSH and LH are low or inappropriately normal rather than
    elevated; it does not explain streak gonads with a 46,XY karyotype.
  evidence:
  - reference: PMID:39149602
    reference_title: "Case report: Rare heterozygous variant in the NR5A1 gene causing 46,XY complete gonadal dysgenesis with a non-communicating rudimentary uterus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      high luteinizing and follicle-stimulating hormone levels
    explanation: The observed high-gonadotropin pattern argues against central hypogonadism.
- name: 46,XY androgen synthesis or action disorders
  description: >-
    Steroidogenic defects, 5-alpha-reductase deficiency, and androgen receptor
    defects cause under-masculinization despite differentiated testicular tissue.
    AMH production and Müllerian regression, hormone profiles, and molecular
    testing distinguish them from complete testis-development failure.
  evidence:
  - reference: PMID:34070473
    reference_title: "Malignant Germ Cell Tumors and Their Precursor Gonadal Lesions in Patients with XY-DSD: A Case Series and Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      46 XY-DSD (disorders of testicular development and disorders of androgen
      synthesis or action)
    explanation: Supports the mechanistic distinction within 46,XY DSD.
- name: Syndromic gonadal dysgenesis
  description: >-
    Gonadal dysgenesis accompanied by neuropathy or other extra-gonadal features
    does not meet this nonsyndromic root and requires syndrome-specific
    evaluation. Biallelic DHH disease, for example, can occur with or without
    polyneuropathy.
  evidence:
  - reference: PMID:30298535
    reference_title: "In vitro functional characterization of the novel DHH mutations p.(Asn337Lysfs*24) and p.(Glu212Lys) associated with gonadal dysgenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      46,XY gonadal dysgenesis (GD), associated or not with polyneuropathy.
    explanation: Supports separation of nonsyndromic and neuropathy-associated DHH disease.
treatments:
- name: Bilateral gonadectomy for nonfunctional dysgenetic gonads
  action_category: THERAPEUTIC
  description: >-
    Once classic complete 46,XY gonadal dysgenesis is confirmed, current expert
    practice favors arranging bilateral removal of nonfunctional
    streak/dysgenetic gonads without avoidable delay after informed,
    developmentally appropriate discussion. The gonads provide no useful
    pubertal function and retain clinically important tumor risk, but the
    literature does not define a precise post-diagnosis interval. Numerical risk
    estimates should be presented as cohort-dependent rather than as precise
    population probabilities.
  treatment_term:
    preferred_term: gonadectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Dysgenetic Y-bearing germ-cell niche
    treatment_effect: INHIBITS
    description: Gonadectomy removes the susceptible Y-bearing dysgenetic tissue.
    evidence:
    - reference: PMID:38337479
      reference_title: "A Risk of Gonadoblastoma in Familial Swyer Syndrome-A Case Report and Literature Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The management of such patients is based on preventive excision of
        dysgenetic gonads
      explanation: Supports preventive excision as disease management.
  target_phenotypes:
  - preferred_term: Gonadoblastoma
    term:
      id: HP:0000150
      label: Gonadoblastoma
  evidence:
  - reference: PMID:38337479
    reference_title: "A Risk of Gonadoblastoma in Familial Swyer Syndrome-A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The management of such patients is based on preventive excision of
      dysgenetic gonads and long-term hormonal replacement therapy.
    explanation: Supports gonadectomy together with long-term hormone replacement.
  - reference: PMID:36767504
    reference_title: "Late Diagnosis of Swyer Syndrome in a Patient with Bilateral Germ Cell Tumor Treated with a Contraceptive Due to Primary Amenorrhea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early prophylactic gonadectomy could protect patients from developing
      tumors in dysgenetic gonads.
    explanation: >-
      Supports early preventive gonadectomy as current expert practice; it does
      not establish an evidence-defined surgical interval.
- name: Physiologic pubertal induction and maintenance hormone replacement
  action_category: THERAPEUTIC
  description: >-
    Hormone treatment proceeds in parallel with tumor-risk management; it is not
    contingent on waiting until after surgery. Near the expected age of puberty,
    use low-dose physiologic 17-beta-estradiol with gradual individualized
    escalation; later diagnosis can justify a faster individualized induction.
    If an endometrium-bearing uterine cavity is present, add progestogen to avoid
    unopposed estrogen; with patent outflow, cyclic progesterone is generally
    introduced after about two years of estrogen or first breakthrough bleeding.
    Obstructed or noncommunicating anatomy requires specialist management of the
    outflow and hormone regimen. Replacement usually continues through the
    expected age of natural menopause, followed by individualized reassessment.
    Treatment induces secondary sexual development and, when anatomy permits,
    scheduled withdrawal bleeding; it does not restore spontaneous menarche or
    ovulatory menstrual cycles. These regimen details derive from broader
    congenital gonadal-hormone-deficiency guidance and expert practice, not
    Swyer-specific comparative trials.
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
    - preferred_term: progesterone
      term:
        id: CHEBI:17026
        label: progesterone
  target_mechanisms:
  - target: Absent pubertal gonadal hormone secretion
    treatment_effect: BYPASSES
    description: Exogenous sex steroids bypass absent gonadal secretion.
    evidence:
    - reference: PMID:35353710
      reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        recommendations for puberty induction with oestrogen or testosterone.
      explanation: Supports estrogen-based induction for gonadal hormone deficiency.
  target_phenotypes:
  - preferred_term: Delayed puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  - preferred_term: Breast hypoplasia
    term:
      id: HP:0003187
      label: Breast hypoplasia
  - preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Puberty induction should be individualised but considered at 11 years in
      girls
    explanation: Supports individualized timely pubertal induction.
  - reference: PMID:38337479
    reference_title: "A Risk of Gonadoblastoma in Familial Swyer Syndrome-A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      long-term hormonal replacement therapy.
    explanation: Supports long-term replacement in Swyer syndrome.
- name: Endocrine, uterine, bone, and cardiometabolic monitoring
  action_category: MONITORING
  description: >-
    Provide individualized multidisciplinary follow-up during induction and
    maintenance, assessing pubertal and uterine response, adherence, and adverse
    effects. Bone and cardiometabolic assessment should reflect the duration and
    severity of hypoestrogenism, baseline findings, and individual risk. Exact
    tests and intervals are extrapolated from broader hypogonadism guidance
    rather than established by Swyer-specific outcome studies.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      pubertal induction or sex hormone replacement to sustain puberty should be
      cared for by a multidisciplinary team.
    explanation: Supports multidisciplinary follow-up during induction and maintenance.
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The improvement of bone mineral density was observed at the repeated DEXA
      scan at 18 months
    explanation: >-
      A broader gonadal-dysgenesis case shows that bone density can respond to
      hormone replacement; it does not establish a Swyer-specific DXA schedule.
- name: Donor-oocyte or donor-embryo in vitro fertilization
  action_category: THERAPEUTIC
  description: >-
    Classic complete disease lacks usable gonadal gametes, but donor-oocyte or
    donor-embryo IVF can achieve pregnancy when estrogen treatment produces an
    adequate uterine response. Preconception uterine assessment and
    maternal-fetal-medicine counseling are appropriate; evidence consists mainly
    of case reports and small series.
  treatment_term:
    preferred_term: In Vitro Fertilization
    term:
      id: NCIT:C16580
      label: In Vitro Fertilization
  target_phenotypes:
  - preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:40097859
    reference_title: "Infertility management in a patient with Swyer syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The IVF treatment using donor oocytes led to a successful pregnancy
      without complications.
    explanation: Directly documents successful donor-oocyte IVF.
- name: Gene-specific genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Explain gene- and lesion-specific inheritance, penetrance, variant origin,
    and recurrence risk; offer parental or cascade testing when a cause is
    identified. Evaluate subtype-specific associated risks when relevant, such
    as adrenal disease in selected NR5A1 presentations or later neuropathy in
    biallelic DHH disease.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31365064
    reference_title: "Management of 46,XY Differences/Disorders of Sex Development (DSD) Throughout Life."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      importance of establishing a molecular diagnosis
    explanation: Supports molecular diagnosis as a basis for individualized lifelong care.
- name: Psychosocial, disclosure, infertility, and sexual-health support
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Provide staged, confidential, developmentally appropriate disclosure;
    psychological and peer support; infertility and reproductive counseling;
    sexual-health care; and support for autonomy and gender identity. Care
    should be coordinated by an experienced multidisciplinary DSD team.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35353710
    reference_title: "Pubertal induction and transition to adult sex hormone replacement in patients with congenital pituitary or gonadal reproductive hormone deficiency: an Endo-ERN clinical practice guideline."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Psychological aspects of puberty and fertility issues are especially
      important to address in individuals with sex development disorders
    explanation: Directly supports psychosocial and fertility-focused support.
  - reference: PMID:31365064
    reference_title: "Management of 46,XY Differences/Disorders of Sex Development (DSD) Throughout Life."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      long-term quality of life, sexual function, involvement with intimate
      partners, and optimizing fertility potential.
    explanation: Supports lifelong quality-of-life, sexual, relationship, and fertility care.

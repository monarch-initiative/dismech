progression:
- phase: Fetal gonadal-development phase
  age_range: embryonic and fetal development
  notes: >-
    Failure of the pro-testis program prevents functional Sertoli-cell,
    testis-cord, and Leydig-cell differentiation. Absent AMH permits Müllerian
    persistence, while absent testicular androgen prevents masculinization.
  evidence:
  - reference: PMID:30552336
    reference_title: "Human sex reversal is caused by duplication or deletion of core enhancers upstream of SOX9."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SRY-mediated SOX9 upregulation in the early gonad is crucial for testis
      development
    explanation: Supports the early developmental timing of the core lesion.
- phase: Often clinically silent childhood phase
  age_range: infancy through prepubertal childhood
  notes: >-
    Typical female external anatomy often permits the disorder to remain
    unrecognized before puberty, although karyotype testing, a syndromic
    feature, family history, or gonadal mass can lead to earlier diagnosis.
  evidence:
  - reference: PMID:35720238
    reference_title: "Complete gonadal dysgenesis analysis in the population of Latvia: malignant outcomes and a review of literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      2 patients (13.3%) were diagnosed at birth.
    explanation: >-
      The minority diagnosed at birth, contrasted with the cohort's adolescent
      mean age, supports frequent prepubertal nonrecognition.
- phase: Pubertal-failure recognition phase
  age_range: adolescence to young adulthood
  notes: >-
    Absent or incomplete spontaneous breast development, delayed puberty, and
    primary amenorrhea usually trigger endocrine, chromosomal, and imaging
    evaluation.
  evidence:
  - reference: PMID:35720238
    reference_title: "Complete gonadal dysgenesis analysis in the population of Latvia: malignant outcomes and a review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition usually manifests in teenage and young adults with delayed
      puberty and primary amenorrhea.
    explanation: Directly supports the usual recognition phase.
- phase: Untreated complication phase
  age_range: adolescence and adulthood
  notes: >-
    Persistent hypoestrogenism impairs uterine maturation and bone accrual, and
    retained dysgenetic Y-bearing gonads remain susceptible to precursor and
    invasive germ-cell tumors. Infertility is intrinsic to absent functional
    gonadal gametes.
  evidence:
  - reference: PMID:32905884
    reference_title: "Risk of gonadal neoplasia in patients with disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The highest risk (36 %) was observed in 46,XY patients with gonadal
      dysgenesis (GD): complete GD (33 %) and partial GD (23 %)
    explanation: Supports the major tumor complication while retaining mixed-cohort limitations.
  - reference: PMID:31809259
    reference_title: "Misdiagnosis of Mullerian agenesis in a patient with 46, XX gonadal dysgenesis: a missed opportunity for prevention of osteoporosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delay in diagnosis and hormone substitution therapy causes secondary
      osteoporosis.
    explanation: >-
      A 46,XX gonadal-dysgenesis case supports the broader hypoestrogenic bone
      consequence; it is explicitly extrapolative rather than disease-specific.
pathophysiology:
- name: SRY-SOX9-SOX8-DMRT1 transcriptional network failure
  role: trigger
  description: >-
    Loss or inadequate activation of the core pro-testis transcriptional network
    prevents stable supporting-cell commitment. This branch includes SRY
    defects, SOX9 enhancer deletion, rare SOX8 defects, and DMRT1
    haploinsufficiency.
  genes:
  - preferred_term: SRY
    term:
      id: hgnc:11311
      label: SRY
  - preferred_term: SOX9
    term:
      id: hgnc:11204
      label: SOX9
  - preferred_term: SOX8
    term:
      id: hgnc:11203
      label: SOX8

tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/6587
  title: "Expert review: tumor-risk counseling and gonadectomy timing in 46,XY complete gonadal dysgenesis"
  tracked_issue_role: curation_followup
  tracked_issue_status: OPEN
  notes: >-
    Requests disease-specific age-stratified tumor-risk estimates, consensus on
    surgical urgency and preoperative workup, evaluation of genotype or familial
    modifiers, and evidence for any surveillance strategy when surgery is
    deferred.

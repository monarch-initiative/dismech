notes: >-
  The root is deliberately restricted to classic nonsyndromic complete disease.
  CBX2 is not promoted because the canonical reported phenotype had ovarian-like
  rather than bilateral streak gonads. ZFPM2 is not promoted because the current
  GeneReviews gene table does not treat it as established, despite an older
  small report containing one complete presentation; this warrants separate
  gene-validity review. Syndromic WT1 or SOX9 coding disease, large syndromic 9p
  deletions, PPP2R3C-related disease, DHH-related neuropathy, partial/mixed
  dysgenesis, CAIS, and androgen synthesis/action disorders remain separate from
  this root. Published tumor-risk percentages are retained only with
  ascertainment caveats. Relevant MONDO phenotype-series cross-references are
  retained as curation notes rather than structured mappings because the current
  local disease-term enum rejects these active classes: SRY MONDO:0020712,
  NR0B1 MONDO:0010226, NR5A1 MONDO:0013066, DMRT1 MONDO:0007938, MAP3K1
  MONDO:0013410, DHH MONDO:0009301, SOX9-regulatory MONDO:0014634, and DHX37
  MONDO:8000015.

discussions:
- discussion_id: gap_xy_cgd_tumor_risk_and_gonadectomy_timing
  prompt: >-
    In confirmed classic 46,XY complete gonadal dysgenesis with bilateral
    nonfunctional streak gonads, what disease-specific age-stratified tumor-risk
    estimate should be communicated, how promptly should bilateral gonadectomy
    follow diagnosis, do genotype or familial status modify risk, and is any
    imaging, marker, or biopsy surveillance strategy reliable enough to
    recommend if surgery is deferred?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Published percentages mix familial and sporadic cases, mass-enriched
    referrals, pathology-selected series, ages, and complete, partial, mixed,
    CAIS, or other XY DSD diagnoses. These data establish clinically important
    risk and support current practice favoring timely gonadectomy but do not
    establish a precise population probability, an evidence-defined surgical
    interval, or a validated surveillance alternative.
  attaches_to:
  - pathophysiology#Gonadal germ-cell neoplasia risk
  evidence:
  - reference: PMID:32905884
    reference_title: "Risk of gonadal neoplasia in patients with disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete GD (33 %)
    explanation: Supplies a multicenter adult cohort estimate with mixed ascertainment.
  - reference: PMID:34070473

name: 46,XY complete gonadal dysgenesis
creation_date: "2026-04-14T12:00:00Z"
category: Mendelian
description: >-
  46,XY complete gonadal dysgenesis (Swyer syndrome) is a genetically
  heterogeneous disorder of testis development in which an individual with a
  nonmosaic 46,XY karyotype has typical female external genitalia, Müllerian
  structures, and bilateral streak or severely dysgenetic gonads because
  functional testes never differentiate. Loss of fetal Sertoli-cell and
  Leydig-cell function causes absent anti-Müllerian hormone and testicular
  androgen secretion; loss of pubertal gonadal hormone production causes
  hypergonadotropic hypogonadism, absent or incomplete breast development,
  delayed puberty, primary amenorrhea, uterine hypoplasia, infertility, and
  impaired bone accrual. Y-bearing dysgenetic gonadal tissue also confers a
  substantial, but imprecisely quantified, risk of gonadoblastoma and invasive
  germ-cell tumor.
disease_term:
  preferred_term: 46,XY complete gonadal dysgenesis
  term:
    id: MONDO:0010765
    label: 46,XY complete gonadal dysgenesis
synonyms:
- Swyer syndrome
- 46,XY CGD
- 46,XY pure gonadal dysgenesis
- 46,XY sex reversal
parents:
- Disorder of sex development
- Gonadal development disorder
definitions:
- name: Classic nonsyndromic 46,XY complete gonadal dysgenesis case definition
  definition_type: CASE_DEFINITION
  description: >-
    The modeled disease requires a 46,XY karyotype, typical female external
    genitalia and Müllerian internal structures, absent functional testicular
    differentiation, and bilateral streak or severely dysgenetic gonads.
  scope: >-
    This entry models the classic nonsyndromic complete phenotype. Partial or
    mixed 46,XY gonadal dysgenesis, complete androgen insensitivity, androgen
    synthesis defects, testicular regression syndrome without the complete
    phenotype, and syndromic gonadal dysgenesis are differential diagnoses or
    separate disease entities. Gene-related subtype terms that span partial and
    complete disease are included here only for their complete presentations.
  evidence:
  - reference: PMID:21982289
    reference_title: "Complete gonadal dysgenesis in clinical practice: the 46,XY karyotype accounts for more than one third of cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-two patients with hypergonadotropic hypogonadism, streak gonads,
      internal and external female genitalia, and normal karyotype (46,XX or
      46,XY)
    explanation: >-
      This clinical cohort supplies the defining gonadal, internal-genital,
      external-genital, endocrine, and karyotypic features; this entry selects
      its 46,XY complete-dysgenesis subset.

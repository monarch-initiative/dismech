- name: Gonadal germ-cell neoplasia risk
  role: consequence
  description: >-
    Complete gonadal dysgenesis carries clinically important risk of
    gonadoblastoma and invasive tumors, especially dysgerminoma. Published
    percentages vary substantially because cohorts are small, retrospective,
    referral-selected, pathology-selected, or combine multiple XY DSD
    diagnoses; no single percentage should be presented as population risk.
  evidence:
  - reference: PMID:32905884
    reference_title: "Risk of gonadal neoplasia in patients with disorders/differences of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete GD (33 %)
    explanation: Provides a multicenter adult cohort estimate, not a population-wide rate.
  - reference: PMID:35720238
    reference_title: "Complete gonadal dysgenesis analysis in the population of Latvia: malignant outcomes and a review of literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly diagnosed tumors were dysgerminoma and gonadoblastoma.
    explanation: Supports the tumor spectrum in a mass-enriched referral cohort.
  downstream:
  - target: Gonadoblastoma
    causal_link_type: DIRECT
    description: Gonadoblastoma is a characteristic precursor neoplasm in dysgenetic gonads.
    evidence:
    - reference: PMID:38337479

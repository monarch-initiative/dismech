      label: sex determination
    modifier: DECREASED
  - preferred_term: male gonad development
    term:
      id: GO:0008584
      label: male gonad development
    modifier: DECREASED
  evidence:
  - reference: PMID:33570214
    reference_title: "A missense mutation (c.226C>A) in HMG box SRY gene affects nNLS function in 46,XY sex reversal female."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SRY initiates cascade of gene expression that transforms the
      undifferentiated gonad, genital ridge into testis.
    explanation: Places SRY at the start of the pro-testis network.
  - reference: PMID:30552336
    reference_title: "Human sex reversal is caused by duplication or deletion of core enhancers upstream of SOX9."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three enhancers showed synergistic activity and together drive SOX9

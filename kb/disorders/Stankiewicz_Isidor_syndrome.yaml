references:
- reference: PMID:34906456
  title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
  findings:
  - statement: >-
      Heterozygous truncating single nucleotide variants and copy-number variant
      deletions in PSMD12 cause Stankiewicz-Isidor syndrome, with preaxial hand
      abnormalities confirmed alongside developmental delay, intellectual
      disability, speech delay, and cardiac and renal anomalies.
    supporting_text: >-
      In addition to previously reported DD/ID, speech delay, cardiac and renal
      anomalies, we also confirmed preaxial hand abnormalities as a feature of
      this syndrome.
  - statement: >-
      Cells from individuals with Stankiewicz-Isidor syndrome exhibit profound
      remodeling of mTORC1 and mitophagy pathways accompanied by induction of
      type I interferon-stimulated genes.
    supporting_text: >-
      Remarkably, our data show that STISS patient cells exhibit a profound
      remodeling of the mTORC1 and mitophagy pathways with an induction of type
      I interferon-stimulated genes.
  - statement: >-
      Stankiewicz-Isidor syndrome can be biochemically diagnosed using a
      peripheral blood type I interferon gene signature, and affected
      individuals may present with chilblain-like lesions resembling
      interferonopathy.
    supporting_text: >-
      We refine the phenotype of STISS and show that it can be clinically
      recognizable and biochemically diagnosed by a type I interferon gene
      signature.
- reference: PMID:39641441
  title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
  findings:
  - statement: >-
      Inherited truncating PSMD12 variants in six patients across two unrelated
      families demonstrate a completely penetrant autosomal dominant condition
      with marked inter- and intrafamilial clinical variability.
    supporting_text: >-
      Portraying a completely penetrant condition with inter- and intra-familiar
      clinical variability, all individuals presented with developmental delay,
      intellectual disability, craniofacial, and skeletal anomalies.
  - statement: >-
      Inherited truncating PSMD12 variants broaden the clinical spectrum to
      include acne, short stature, late-childhood obesity, oligodontia,
      cholesteatoma, unilateral ectopic fingernail, and ovarian teratoma.
    supporting_text: >-
      Novel findings in our cohort included unilateral ectopic fingernail,
      cholesteatoma, oligodontia, and the occurrence of an ovarian teratoma. Most
      subjects had acne, short stature, and developed obesity since late
      childhood.
  - statement: >-
      Patients with familial truncating PSMD12 variants showed non-specific
      perturbations of the type I interferon signature without overt clinical
      autoinflammation.
    supporting_text: >-
      None presented clinical manifestations of autoinflammation and the
      detected IFN-I signature perturbations were not specific.
- reference: PMID:39220754
  title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
  findings:
  - statement: >-
      PSMD12/Rpn5 is a non-ATPase scaffolding subunit of the 19S proteasome
      regulatory particle lid, and heterozygous loss-of-function variants cause
      Stankiewicz-Isidor syndrome, an ultra-rare neurodevelopmental
      proteasomopathy.
    supporting_text: >-
      As depicted in Fig. 1, the lid is made up of eight scaffolding subunits —
      PSMD3/Rpn3, PSMD12/Rpn5, PSMD11/Rpn6, PSMD6/Rpn7, PSMD7/Rpn8, PSMD13/Rpn9,
      PSMD8/Rpn12, and SEM1/Rpn15 — and one deubiquitinating enzyme PSMD14/Rpn11.
  - statement: >-
      Individuals with Stankiewicz-Isidor syndrome exhibit elevated
      mitochondrial turnover (mitophagy) and persistent peripheral blood type I
      interferon gene signatures resulting from proteasome dysfunction.
    supporting_text: >-
      Supporting this notion, we could also show that individuals with
      Stankiewicz–Isidor syndrome exhibited a higher mitochondrial turnover than
      healthy individuals.
- reference: PMID:37256937
  title: "PSMC3 proteasome subunit variants are associated with neurodevelopmental delay and type I interferon production."
  findings:
  - statement: >-
      Genetic disorders of the 19S proteasome regulatory particle, including
      Stankiewicz-Isidor syndrome caused by truncating PSMD12 variants, present
      as neurodevelopmental polymalformative syndromes with subclinical
      activation of type I interferon signaling.
    supporting_text: >-
      By contrast, genetic disorders involving genes of the 19S regulatory
      particle such as the Stankiewicz-Isidor syndrome (STISS, MIM: 617516)
      caused by truncating variants of PSMD12 (also referred to as Rpn5) are
      neurodevelopmental polymalformative syndromes (34) with subclinical
      activation of type I IFN signaling (35, 36)

differential_diagnoses:
- name: Proteasome-associated autoinflammatory syndrome
  disease_term:
    preferred_term: proteosome-associated autoinflammatory syndrome
    term:
      id: MONDO:0009726
      label: proteosome-associated autoinflammatory syndrome
  description: >-
    Autoinflammatory proteasomopathy (CANDLE/PRAAS) caused by pathogenic
    variants in 20S core particle subunits or proteasome assembly chaperones
    (such as PSMB8, PSMB9, PSMB4, PSMA3, POMP, or PSMG2) that shares proteasome
    dysfunction and a peripheral blood type I interferon signature with
    Stankiewicz-Isidor syndrome.
  distinguishing_features:
  - Prominent systemic autoinflammation with recurrent fevers, neutrophilic dermatosis, and panniculitis-induced lipodystrophy, which are typically absent in Stankiewicz-Isidor syndrome
  - Predominantly autosomal recessive or digenic inheritance affecting 20S core particle subunits or assembly chaperones rather than heterozygous PSMD12 variants in the 19S regulatory particle lid
  evidence:
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Remarkably, as shown in Figure 2, all proteasome subunits affected in
      CANDLE/PRAAS are localized within the 20S CP, suggesting that the disease
      selectively preserves the 19S RP.
    explanation: Distinguishes CANDLE/PRAAS (20S core particle defects with systemic autoinflammation) from 19S regulatory particle neurodevelopmental proteasomopathies such as Stankiewicz-Isidor syndrome.
  - reference: PMID:37256937
    reference_title: "PSMC3 proteasome subunit variants are associated with neurodevelopmental delay and type I interferon production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      By contrast, genetic disorders involving genes of the 19S regulatory
      particle such as the Stankiewicz-Isidor syndrome (STISS, MIM: 617516)
      caused by truncating variants of PSMD12 (also referred to as Rpn5) are
      neurodevelopmental polymalformative syndromes (34) with subclinical
      activation of type I IFN signaling (35, 36)
    explanation: Contrasts autosomal recessive 20S proteasome-associated autoinflammatory syndromes with 19S neurodevelopmental polymalformative syndromes such as Stankiewicz-Isidor syndrome.
- name: PSMC3-related neurodevelopmental disorder
  description: >-
    Autosomal dominant 19S regulatory particle neurodevelopmental
    proteasomopathy caused by heterozygous pathogenic missense variants in the
    AAA-ATPase base subunit PSMC3/Rpt5, sharing global developmental delay,
    intellectual disability, speech delay, congenital malformations, and a
    peripheral blood type I interferon gene signature with Stankiewicz-Isidor
    syndrome.
  notes: >-
    Autosomal dominant PSMC3-related neurodevelopmental disorder with type I
    interferon production (PMID:37256937) does not yet have a dedicated MONDO
    term in the local cache (MONDO:0060496 in the cache represents the distinct
    autosomal recessive deafness-cataract-autism-polyneuropathy syndrome caused
    by biallelic PSMC3 variants), so disease_term is omitted to avoid conflating
    the autosomal dominant and autosomal recessive PSMC3 disorders.
  distinguishing_features:
  - Caused by heterozygous missense variants in the 19S base AAA-ATPase subunit gene PSMC3 rather than truncating variants or deletions in the 19S lid non-ATPase scaffolding subunit gene PSMD12
  - Distinguished by molecular genetic testing of PSMC3 versus PSMD12 despite overlapping neurodevelopmental, malformative, and peripheral blood type I interferon transcriptional profiles
  evidence:
  - reference: PMID:37256937
    reference_title: "PSMC3 proteasome subunit variants are associated with neurodevelopmental delay and type I interferon production."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this work, we identified fifteen dominant de novo variants in the PSMC3
      gene coding for the AAA-ATPase PSMC3/Rpt5. These rare missense variants
      were detected in twenty-three individuals presenting with
      neurodevelopmental delay (NDD), intellectual disability (ID) or both,
      together with various congenital malformations.
    explanation: Describes the overlapping neurodevelopmental and congenital malformation phenotype of heterozygous PSMC3 variants, a fellow 19S regulatory particle neurodevelopmental proteasomopathy.
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Up to this point, a total of six neurodevelopmental proteasomopathies have
      been described, involving the four subunits PSMB1/β6, PSMC1/Rpt2,
      PSMC3/Rpt5, and PSMD12/Rpn5 (Table 2). In contrast to their
      autoinflammatory counterparts, neurodevelopmental proteasomopathies are
      mostly monogenic dominant disorders arising from de novo mutations in
      proteasome genes. Indeed, approximately 85% of individuals suffering from
      these diseases carry heterozygous variants within the PSMD12 or PSMC3
      genes (Table 2).
    explanation: Groups PSMC3-related neurodevelopmental disorder alongside PSMD12-related Stankiewicz-Isidor syndrome within the neurodevelopmental proteasomopathy disease family.
- name: Aicardi-Goutieres syndrome
  disease_term:
    preferred_term: Aicardi-Goutieres syndrome
    term:
      id: MONDO:0018866
      label: Aicardi-Goutieres syndrome
  description: >-
    Genetically determined type I interferonopathy with neurological involvement
    and elevated peripheral blood type I interferon-stimulated gene expression
    caused by pathogenic variants in nucleic acid sensing or processing genes.
  distinguishing_features:
  - Early-onset autoinflammatory encephalopathy with intracranial calcifications and leukoencephalopathy rather than a congenital malformation syndrome with preaxial hand, cardiac, and renal anomalies
  - Caused by variants in nucleic acid metabolism and sensing genes (such as TREX1, RNASEH2A, RNASEH2B, or RNASEH2C) rather than heterozygous PSMD12 variants
  evidence:
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Given the harmful impact of type I IFN on the CNS, it is reasonable to
      speculate that it plays a significant role as a disease driver in
      neurodevelopmental proteasomopathies, similar to its involvement in
      monogenic early-onset autoinflammatory encephalopathy Aicardi–Goutières
      syndrome, which is caused by mutations in the TREX1, RNASEH2A, RNASEH2B,
      or RNASEH2C genes.
    explanation: Contrasts the molecular etiology of Aicardi-Goutieres syndrome with neurodevelopmental proteasomopathies despite shared type I interferon pathway activation.

name: Stankiewicz-Isidor syndrome
creation_date: "2026-04-15T00:00:00Z"
description: >-
  Stankiewicz-Isidor syndrome is a PSMD12-related autosomal dominant
  neurodevelopmental disorder characterized by developmental delay,
  intellectual disability, craniofacial dysmorphism, and a variable burden of
  congenital malformations.
category: Mendelian
parents:
- Neurodevelopmental disorder
- Genetic disease
synonyms:
- STISS
- PSMD12-related neurodevelopmental disorder
disease_term:
  preferred_term: Stankiewicz-Isidor syndrome
  term:
    id: MONDO:0054591
    label: Stankiewicz-Isidor syndrome
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  mechanistic_category:
  - classification_value: proteotoxic disease
prevalence:
- population: Published cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare neurodevelopmental proteasomopathy with 45 published patients
    carrying heterozygous PSMD12 variants summarized by 2024 and six additional
    familial cases subsequently reported across two families.
  evidence:
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      These diseases are rare or even ultra-rare with so far less than 120 cases
      reported worldwide.
    explanation: Establishes that primary neurodevelopmental proteasomopathies including Stankiewicz-Isidor syndrome are ultra-rare disorders.
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 24 additional unrelated patients with STISS with various
      truncating single nucleotide variants or copy-number variant deletions
      involving PSMD12.
    explanation: Documents the largest clinical series expanding the published Stankiewicz-Isidor syndrome cohort.
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We described six patients (four adults) from two unrelated families
      carrying a known p.(Arg289*) or a novel p.(Tyr111*) PSMD12 variant.
    explanation: Adds six familial patients to the published Stankiewicz-Isidor syndrome literature.
progression:
- phase: Onset
  age_range: Congenital to neonatal
  notes: >-
    Congenital malformations (cardiac, renal, skeletal, and preaxial hand
    anomalies) and craniofacial dysmorphism are present at birth, followed by
    global developmental delay in infancy and early childhood.
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of PSMD12 has been reported in individuals with
      neurodevelopmental phenotypes, including developmental delay/intellectual
      disability (DD/ID), facial dysmorphism, and congenital malformations,
      defined as Stankiewicz-Isidor syndrome (STISS).
    explanation: Supports congenital malformation onset and early neurodevelopmental presentation.
- phase: Progression
  age_range: Late childhood to adulthood
  notes: >-
    Endocrine, growth, and dermatologic features such as obesity and acne often
    emerge during late childhood or adolescence, with neurocognitive impairment
    persisting into adulthood.
  evidence:
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most subjects had acne, short stature, and developed obesity since late
      childhood.
    explanation: Supports late-childhood emergence of obesity alongside persistent syndromic features.
inheritance:
- name: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    Stankiewicz-Isidor syndrome is an autosomal dominant disorder with complete
    penetrance and marked inter- and intrafamilial variable expressivity. Most
    reported cases arise de novo (33/45 in the 2024 literature review), while a
    substantial minority are dominantly inherited from affected parents (9/45 in
    the 2024 review plus six subsequent familial cases across two families).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of PSMD12 has been reported in individuals with
      neurodevelopmental phenotypes, including developmental delay/intellectual
      disability (DD/ID), facial dysmorphism, and congenital malformations,
      defined as Stankiewicz-Isidor syndrome (STISS).
    explanation: This directly supports heterozygous PSMD12 haploinsufficiency as the underlying mode of inheritance.
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We described six patients (four adults) from two unrelated families
      carrying a known p.(Arg289*) or a novel p.(Tyr111*) PSMD12 variant.
    explanation: This directly supports familial truncating PSMD12 variants and therefore inherited autosomal dominant disease in at least some families.
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Portraying a completely penetrant condition with inter- and intra-familiar
      clinical variability, all individuals presented with developmental delay,
      intellectual disability, craniofacial, and skeletal anomalies.
    explanation: Directly establishes complete penetrance accompanied by inter- and intrafamilial variable expressivity.
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "(33/45) De novo; (9/45) dominant; (3/45) n.a"
    explanation: Table 2 summary of 45 published PSMD12/Stankiewicz-Isidor syndrome cases showing 33/45 de novo and 9/45 dominantly inherited variants.
pathophysiology:
- name: PSMD12 haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in PSMD12 reduce dosage of the
    non-ATPase scaffolding subunit PSMD12 (Rpn5) of the 19S proteasome
    regulatory particle lid during development.

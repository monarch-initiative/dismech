      label: proteasomal protein catabolic process
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haploinsufficiency of PSMD12 has been reported in individuals with
      neurodevelopmental phenotypes, including developmental delay/intellectual
      disability (DD/ID), facial dysmorphism, and congenital malformations,
      defined as Stankiewicz-Isidor syndrome (STISS).
    explanation: This directly supports PSMD12 haploinsufficiency and proteasome dysfunction as the initiating mechanism.
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alteration in the ubiquitin-proteasome system results in human disorders
      with neurological and/or autoinflammatory presentation.
    explanation: Provides background context linking ubiquitin-proteasome system defects to human neurological and autoinflammatory disorders.
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      As depicted in Fig. 1, the lid is made up of eight scaffolding subunits —
      PSMD3/Rpn3, PSMD12/Rpn5, PSMD11/Rpn6, PSMD6/Rpn7, PSMD7/Rpn8, PSMD13/Rpn9,
      PSMD8/Rpn12, and SEM1/Rpn15 — and one deubiquitinating enzyme PSMD14/Rpn11.
    explanation: Establishes the role of PSMD12/Rpn5 as a structural scaffolding subunit of the 19S proteasome regulatory particle lid.
  downstream:
  - target: Proteasome dysfunction
    description: Loss of PSMD12 reduces proteasome function and perturbs protein homeostasis.
  - target: Acne
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Expanded PSMD12-related disease can include acne through cutaneous or
      immune intermediates not otherwise modeled here.
- name: Proteasome dysfunction
  description: >-
    Reduced proteasome activity causes accumulation of ubiquitin-protein
    conjugates and perturbs growth, organelle-homeostasis, and inflammatory
    pathways.
  biological_processes:
  - preferred_term: proteasomal protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0010498
      label: proteasomal protein catabolic process
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigations showed that pathogenic variants in PSMD12 perturb
      intracellular protein homeostasis.
    explanation: Directly links pathogenic PSMD12 variants in Stankiewicz-Isidor syndrome to perturbed intracellular protein homeostasis.
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Ubiquitin-positive inclusions have been consistently documented in various
      cell types across individuals carrying proteasome variants, regardless of
      their clinical phenotype.
    explanation: Supports impaired proteasomal degradation and accumulation of ubiquitin-conjugated protein aggregates in patients with proteasome subunit variants.
  downstream:
  - target: mTORC1 and mitophagy remodeling
    description: Proteasome dysfunction perturbs growth and organelle-homeostasis pathways.
  - target: Type I interferon gene signature
    description: PSMD12 loss is associated with an interferon-stimulated transcriptional response in patient cells.
- name: mTORC1 and mitophagy remodeling
  description: >-
    STISS patient cells show remodeling of mTORC1 and mitophagy pathways with
    elevated mitochondrial turnover, linking proteostasis defects to altered
    cellular growth and organelle quality-control programs.
  notes: >-
    While profound mTORC1 and mitophagy remodeling and elevated mitochondrial
    turnover are experimentally demonstrated in STISS patient cells, the
    intermediate developmental steps connecting these cellular perturbations to
    individual congenital organ malformations remain incompletely defined.
  biological_processes:
  - preferred_term: regulation of TOR signaling
    modifier: ABNORMAL
    term:
      id: GO:0032006
      label: regulation of TOR signaling
  - preferred_term: autophagy of mitochondrion
    modifier: ABNORMAL
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Remarkably, our data show that STISS patient cells exhibit a profound
      remodeling of the mTORC1 and mitophagy pathways with an induction of type
      I interferon-stimulated genes.
    explanation: This directly supports remodeling of mTORC1 and mitophagy in patient cells.
  - reference: PMID:39220754
    reference_title: "Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Supporting this notion, we could also show that individuals with
      Stankiewicz–Isidor syndrome exhibited a higher mitochondrial turnover than
      healthy individuals.
    explanation: Confirms elevated mitophagy and mitochondrial turnover in individuals with Stankiewicz-Isidor syndrome.
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Altered developmental growth control and neuronal mitochondrial turnover contribute to delayed milestones.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neurodevelopmental disruption contributes to persistent cognitive impairment.
  - target: Delayed speech and language development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Developmental pathway disruption contributes to delayed communication milestones.
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Perturbed neurodevelopmental signaling contributes to autism spectrum features.
  - target: Abnormal facial shape
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dysregulated morphogenesis contributes to craniofacial dysmorphism.
  - target: Abnormality of the skeletal system
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Disturbed developmental programs contribute to skeletal anomalies.
  - target: Preaxial hand abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Disturbed developmental programs can specifically include preaxial hand abnormalities.
  - target: Abnormal heart morphology
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Congenital malformations in STISS cohorts can involve the heart through uncharacterized developmental intermediates.
  - target: Abnormality of the kidney
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Congenital malformations in STISS cohorts can involve the kidneys through uncharacterized developmental intermediates.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Altered developmental growth control contributes to reduced stature.
  - target: Obesity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Later-childhood metabolic dysregulation may contribute to obesity.
- name: Type I interferon gene signature
  description: >-
    Patient cells and peripheral blood show subclinical induction of type I
    interferon-stimulated genes, providing a molecular biomarker for the
    syndrome and reflecting innate immune activation downstream of proteasome
    impairment.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:34906456
    reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Remarkably, our data show that STISS patient cells exhibit a profound
      remodeling of the mTORC1 and mitophagy pathways with an induction of type
      I interferon-stimulated genes.
    explanation: This directly supports a type I interferon response signature in patient cells.
  - reference: PMID:39641441
    reference_title: "Does It Run in Your Family? Inherited Truncating PSMD12 Variants Broaden the Phenotypic Spectrum of Stankiewicz-Isidor Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      None presented clinical manifestations of autoinflammation and the
      detected IFN-I signature perturbations were not specific.
    explanation: This supports the presence of an interferon signature but cautions that it is not specific for overt autoinflammatory disease.
  - reference: PMID:37256937
    reference_title: "PSMC3 proteasome subunit variants are associated with neurodevelopmental delay and type I interferon production."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By contrast, genetic disorders involving genes of the 19S regulatory
      particle such as the Stankiewicz-Isidor syndrome (STISS, MIM: 617516)
      caused by truncating variants of PSMD12 (also referred to as Rpn5) are
      neurodevelopmental polymalformative syndromes (34) with subclinical
      activation of type I IFN signaling (35, 36)
    explanation: Confirms that Stankiewicz-Isidor syndrome caused by truncating PSMD12 variants exhibits subclinical activation of type I interferon signaling.
  downstream:
  - target: Chilblains
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated type I interferon signaling is associated with
      interferonopathy-like cutaneous chilblain lesions in a subset of patients.
    evidence:
    - reference: PMID:34906456
      reference_title: "Stankiewicz-Isidor syndrome: expanding the clinical and molecular phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of note, 2 patients also showed chilblains resembling signs observed in
        interferonopathy.
      explanation: Connects type I interferon pathway activation in STISS to chilblain lesions resembling those of type I interferonopathies.

    (ISG) transcriptional signature or interferon score is present in the local
    NCIT cache (single-protein terms such as NCIT:C20494 Interferon Alpha or
    NCIT:C20496 Interferon Type I represent cytokines rather than a multi-gene
    transcriptional readout), so biomarker_term.term is omitted. Patients with
    Stankiewicz-Isidor syndrome frequently exhibit elevated transcription of
    type I interferon-stimulated genes in peripheral blood and patient-derived
    cells even in the absence of overt clinical autoinflammation; functional
    biomarker panels combining type I interferon scoring with mitophagy and
    protein-aggregation dyes assist in evaluating PSMD12 variants of uncertain
    significance.

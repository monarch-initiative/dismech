classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Placed with the neurologic disorders: the defining features are a
      corticospinal-tract syndrome and a cerebellar syndrome. Harrison's does not
      list SPG91 by name; this is a mechanism-based placement.
has_subtypes:
- name: HSP-predominant
  display_name: Spastic paraplegia-predominant SPG91
  description: >-
    The larger group, defined by the recurrent p.Arg19Trp variant at the
    alpha/beta spectrin tetramerization site. Onset is congenital to adolescent,
    usually in the first decade, with slowly progressive lower-limb spasticity.
    Most patients have pure spastic paraplegia; a minority have a complex form
    with sensorimotor axonal neuropathy, cerebellar ataxia, optic neuropathy or,
    rarely, learning disability and seizures, and the same variant produces both
    pure and complex forms within one family.
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are two clearly delineated groups of patients with a respectively predominantly HSP phenotype linked with the p.Arg19Trp mutation and a cerebellar ataxia phenotype associated with the p.Lys2083del mutation."
    explanation: >-
      The founding cohort's own split of the disorder into a spastic
      paraplegia group and an ataxia group, and the variant that defines each.
  - reference: PMID:40397273
    reference_title: "Phenotypic and molecular characterization of a recurrent SPTAN1 mutation causing SPG91."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An analysis of the patients reported in the literature in addition to the present patients revealed that SPTAN1 p.Arg19Trp was specific for an HSP phenotype"
    explanation: >-
      A pooled literature analysis confirming that p.Arg19Trp maps to the
      spastic paraplegia phenotype.
- name: Ataxia-predominant
  display_name: Cerebellar ataxia-predominant SPG91
  description: >-
    Patients carrying the recurrent in-frame p.Lys2083del or other de novo
    missense variants that destabilise a spectrin repeat (p.Arg1098Cys,
    p.Arg1624Cys, p.Gln2205Pro). The core picture is early to juvenile onset,
    slowly progressive cerebellar ataxia with cerebellar atrophy on MRI and
    usually mild intellectual disability. Some patients also have pyramidal
    signs, dystonia or epilepsy, and the most complex cases have developmental
    delay with severe intellectual disability and seizures.
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall phenotype is described as slowly progressive cerebellar ataxia and mild intellectual disability with early to juvenile disease onset (range 3-25 years)."
    explanation: >-
      Describes the clinical picture of the four p.Lys2083del patients, the
      core of the ataxia group.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A third group consists of patients with more complex phenotypes, typically with cerebellar ataxia as the defining feature in the developmental delay."
    explanation: >-
      The authors' third group is also ataxia-defined, so it is folded into this
      subtype rather than given a class of its own.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Heterozygous variants segregate as a dominant trait in families with the
    p.Arg19Trp variant, and arise de novo in some p.Arg19Trp patients and in most
    patients in the ataxia group. Expressivity varies within families: in one
    three-generation p.Arg19Trp family most members had pure spastic paraplegia
    while three had cerebellar ataxia and a sensorimotor neuropathy as well.
    Recessive SPTAN1 spastic paraplegia has been proposed from two reports but is
    not part of this entry.
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We furthermore report a recurrent missense mutation (p.Arg19Trp) in 15 patients with spastic paraplegia from seven families with a dominant inheritance pattern in four and a de novo origin in one case."
    explanation: >-
      Dominant segregation in four families and a de novo occurrence in a fifth.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of six patients with cerebellar ataxia, four carry a de novo SPTAN1 variant and two show a sporadic inheritance."
    explanation: >-
      De novo origin dominates in the ataxia group.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This illustrates that the same SPTAN1 mutation, segregating within the same kinship, can result in a marked variability of the clinical expression."
    explanation: >-
      Supports variable expressivity of a single SPTAN1 variant within one
      family.
pathophysiology:
- name: Monoallelic SPTAN1 Variant at a Spectrin Interlinking Position
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense or in-frame SPTAN1 variant at a residue that holds
    alpha-II spectrin's helices together. The SPG91 variants typically remove a
    positively charged arginine or lysine, or a hydrogen-bonding residue, at
    either the N-terminal tetramerization site or a position linking the three
    helices of a spectrin repeat. This distinguishes them both from the DEE5
    variants, which are in-frame changes in the last two repeats, and from the
    truncating variants associated with hereditary motor neuropathy and distal
    myopathy. The role of these residues comes from structural modelling, not
    from biochemistry on the mutant protein.
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Through protein modeling we show that mutated amino acids are located at crucial interlinking positions, interconnecting the three-helix bundle of a spectrin repeat."
    explanation: >-
      Places the SPG91 residues at helix-interlinking positions; the evidence is
      homology modelling.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The mutations presented in the current study typically affect positively charged Arginine or Lysine residues, producing the hypothesis that the disease mechanism is driven by the disruption of stabilizing electrostatic interactions."
    explanation: >-
      The shared property of the variants, and the mechanism the authors infer
      from it, stated as a hypothesis.
  downstream:
  - target: Impaired Alpha/Beta Spectrin Tetramerization
    causal_link_type: DIRECT
    description: >-
      p.Arg19Trp removes the arginine that forms a salt bridge with beta-spectrin
      at the tetramerization interface.
  - target: Spectrin Repeat Destabilization
    causal_link_type: DIRECT
    description: >-
      Variants at interhelical positions within a spectrin repeat are predicted to
      loosen that repeat's three-helix bundle.

- name: Impaired Alpha/Beta Spectrin Tetramerization
  biological_scale: MOLECULAR
  subtypes:
  - HSP-predominant
  description: >-
    Alpha-II spectrin's N-terminal partial repeat completes a three-helix bundle
    with the C-terminal helices of a beta-spectrin, which is how two
    alpha/beta heterodimers join head to head into a tetramer. Arg19 forms a salt
    bridge with an aspartate on the beta-spectrin helix. The tryptophan
    substitution is predicted to weaken this interaction, and the steric clashes
    it introduces, without destabilising the alpha-II tetramerization domain
    itself. The defect is therefore placed in alpha-II spectrin's binding to its
    beta partner. All of the support is computational; no binding assay on the
    mutant protein has been published.
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  molecular_functions:
  - preferred_term: spectrin binding
    term:
      id: GO:0030507
      label: spectrin binding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The Arginine to Tryptophan amino acid substitution results in a loss of positive charge, which could in turn result in a partial loss of this electrostatic interaction at the tetramerization interface."
    explanation: >-
      Places p.Arg19Trp at the tetramerization interface and predicts a partial
      loss of the alpha/beta interaction there.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This three-helix bundle was also dependent on a salt bridge formed by the positively charged Arg19 residue with an Aspartic acid residue of the β-spectrin helix."
    explanation: >-
      Names the alpha-beta contact that Arg19 makes, which is the spectrin-binding
      activity the node marks as abnormal.
  - reference: PMID:40397273
    reference_title: "Phenotypic and molecular characterization of a recurrent SPTAN1 mutation causing SPG91."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In computational simulations, this variant was predicted to perturb the stability of αII/β spectrin heterotetramerization but did not destabilize the tetramerization domain of αII-spectrin."
    explanation: >-
      Independent simulation that puts the defect in the alpha/beta interaction
      rather than in the folding of alpha-II spectrin's own domain.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "This variant is located within the N-terminal tetramerization domain and results in steric clashes with 2 leucine residues in the beta chain."
    explanation: >-
      A third modelling study reaching the same conclusion through steric
      clashes with beta-spectrin.
  downstream:
  - target: Disrupted Axonal Spectrin-Actin Periodic Skeleton
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Weaker tetramer assembly is expected to reduce the spectrin cross-links
      between actin rings. This is inferred from spectrin's known role; it has not
      been measured in SPG91 neurons.
  - target: Abnormal Alpha-II Spectrin Accumulation in Patient Fibroblasts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fibroblasts from a p.Arg19Trp carrier show abnormal alpha-II spectrin
      accumulation, by a route that has not been worked out.

- name: Spectrin Repeat Destabilization
  biological_scale: MOLECULAR
  subtypes:
  - Ataxia-predominant
  description: >-
    p.Lys2083del, p.Arg1098Cys, p.Arg1624Cys and p.Gln2205Pro each remove an
    electrostatic interaction or a hydrogen bond that links helices within a
    spectrin repeat (repeats 10, 14 and 20 among them), or introduce a buried
    proline. The predicted result is a less stable repeat. The authors compare
    this to dystrophin, where loss of an interhelical charge interaction
    destabilises a spectrin-like domain. Like the tetramerization node, this
    rests on modelling.
  genes:
  - preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  cellular_components:
  - preferred_term: spectrin
    term:
      id: GO:0008091
      label: spectrin
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Taken together, these observations form a common pattern, suggesting destabilization of spectrin repeats through disturbances in either electrostatic interactions or hydrogen bonds."
    explanation: >-
      The authors' synthesis of the modelling for the ataxia-group variants.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "We hypothesize that the loss of a positive charge due to the p.Arg1098Cys mutation results in the loss of stabilizing interhelical electrostatic interactions in the 10th spectrin repeat."
    explanation: >-
      A worked example for one variant, stated as a hypothesis.
  downstream:
  - target: Disrupted Axonal Spectrin-Actin Periodic Skeleton
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Less stable repeats are expected to weaken the spectrin rods that span
      adjacent actin rings. This is inferred; it has not been measured in
      patient neurons.

- name: Abnormal Alpha-II Spectrin Accumulation in Patient Fibroblasts
  biological_scale: CELLULAR
  subtypes:
  - HSP-predominant
  description: >-
    Fibroblasts from a patient with p.Arg19Trp show irregular aggregation and
    stronger immunoreactivity of alpha-II spectrin than control fibroblasts,
    with no change in the total amount of protein on western blot. The authors
    read this as a sign of abnormal protein function. In the p.Arg19Trp cells
    the protein is spread through the cell, whereas fibroblasts carrying the
    DEE5-range in-frame deletion p.Glu2207del show more localised aggregation at
    the plasma membrane and reduced protein. Only one SPG91 cell line has been
    studied. Whether this readout bears on axon degeneration is unknown, so the
    node has no downstream edge.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cellular_components:
  - preferred_term: spectrin
    term:
      id: GO:0008091
      label: spectrin
    modifier: ABNORMAL
  evidence:
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Irregular αII-spectrin aggregation was noted in fibroblasts derived from 2 patients with p.(Arg19Trp) and p.(Glu2207del) variants."
    explanation: >-
      The abstract's statement of aggregation in fibroblasts from the SPG91
      hotspot variant and from a DEE5-range in-frame deletion.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In our HSP/HA group, we have detected accumulation of αII-spectrin in fibroblasts of patient 1 with the recurrent p.(Arg19Trp) variant, indicating abnormal protein function."
    explanation: >-
      The patient-cell observation for the SPG91 hotspot variant.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although western blot did not show a quantitative difference in protein expression between patient 1 and controls, a quantitative reduction of protein expression in patient 29 was noted."
    explanation: >-
      Total alpha-II spectrin was not reduced in the p.Arg19Trp cells, which
      argues against simple loss of protein for this variant.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patient 1, αII-spectrin was ubiquitously expressed throughout the fibroblast cells, whereas there was a more localized aggregation of αII-spectrin in the plasma membrane with a relatively higher immunofluorescence brightness observed in the fibroblasts of patient 29."
    explanation: >-
      Distinguishes the distribution in the p.Arg19Trp cells (patient 1) from
      the membrane-localised aggregation in the in-frame deletion cells
      (patient 29).

- name: Disrupted Axonal Spectrin-Actin Periodic Skeleton
  biological_scale: CELLULAR
  description: >-
    In axons, alpha-II/beta spectrin tetramers span the gaps between
    regularly spaced actin rings, forming the membrane-associated periodic
    skeleton. This lattice resists the stretching, torsion and compression that
    long axons undergo and organises the axon initial segment, nodes of Ranvier
    and paranodes. Removing alpha-II spectrin from sensory neurons in mice breaks
    this periodic organisation at nodes and paranodes. That SPG91 variants
    weaken the lattice is an inference from their modelled effects and from
    loss-of-function models; it has not been shown in SPG91 patient neurons.
  cellular_components:
  - preferred_term: spectrin-associated cytoskeleton
    term:
      id: GO:0014731
      label: spectrin-associated cytoskeleton
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The canonical function of the spectrin complex is to interlink actin rings, giving rise to the membrane-associated periodic skeleton (MPS)."
    explanation: >-
      Background statement of what the alpha-II/beta spectrin complex does in
      neurons.
  - reference: PMID:34528024
    reference_title: "The Spread of Spectrin in Ataxia and Neurodegenerative Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Classically, spectrin is recognized as an actin filament cross-linking protein that also binds directly and through adapter proteins (e.g. ankyrin) to biologic membranes and membrane lipids."
    explanation: >-
      A review statement that spectrin cross-links actin filaments, the
      organising role of the lattice this node describes.
  - reference: PMID:29038243
    reference_title: "An αII Spectrin-Based Cytoskeleton Protects Large-Diameter Myelinated Axons from Degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "We analyzed αII spectrin-deficient mice of both sexes and found that, in myelinated axons, αII spectrin forms a periodic cytoskeleton with βIV and βII spectrin at nodes of Ranvier and paranodes, respectively, but that loss of αII spectrin disrupts this organization."
    explanation: >-
      Loss of alpha-II spectrin disrupts the periodic axonal skeleton in mouse
      sensory neurons. Indirect because the model is a conditional knockout, not a
      heterozygous SPG91 allele.
  downstream:
  - target: Degeneration of Large-Diameter Long Axons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Without an intact spectrin lattice, large myelinated axons degenerate
      preferentially. Shown in a knockout mouse; the steps from lattice to
      degeneration, and their relevance to the heterozygous human variants, are
      not established.
    evidence:
    - reference: PMID:29038243
      reference_title: "An αII Spectrin-Based Cytoskeleton Protects Large-Diameter Myelinated Axons from Degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We demonstrate the role of the periodic spectrin-dependent cytoskeleton in axons and show that loss of αII spectrin from PNS axons causes preferential degeneration of large-diameter myelinated axons."
      explanation: >-
        Links loss of the spectrin skeleton to selective degeneration of large
        myelinated axons in vivo.

- name: Degeneration of Large-Diameter Long Axons
  biological_scale: CELLULAR
  description: >-
    Axonal degeneration is the consistent finding in animals lacking alpha-II
    spectrin, and it falls preferentially on large-diameter myelinated axons,
    which have the highest density of nodal alpha-II spectrin and bear the
    greatest mechanical load. In a mouse with a destabilising alpha-II spectrin
    missense variant at Arg1098, the residue mutated in one SPG91 ataxia patient,
    heterozygous animals develop progressive ataxia with axonal and dendritic
    disruption and loss of more than 80% of cerebellar Purkinje cells. No
    neuropathology from an SPG91 patient exists, so degeneration of the
    corticospinal tract and of peripheral axons in humans is inferred from these
    models and from the clinical picture.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29038243
    reference_title: "An αII Spectrin-Based Cytoskeleton Protects Large-Diameter Myelinated Axons from Degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Remarkably, Avil-cre;Sptan1f/f mice have intact nociception and small-diameter axons, but severe ataxia due to preferential degeneration of large-diameter myelinated axons."
    explanation: >-
      Selective degeneration of large myelinated axons, producing ataxia, after
      loss of alpha-II spectrin in sensory neurons.
  - reference: PMID:31515523
    reference_title: "SPTAN1 variants as a potential cause for autosomal recessive hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Using public databases of animal models and previously published data, we have found previously described zebrafish, mouse, and rat animal models of SPTAN1 deficiency, all consistently showing axonal degeneration, fitting the pathological features of HSP in humans."
    explanation: >-
      A survey of SPTAN1-deficient models across three species, all showing
      axonal degeneration, and the authors' link to HSP pathology.
  - reference: PMID:33790315
    reference_title: "Age-dependent ataxia and neurodegeneration caused by an αII spectrin mutation with impaired regulation of its calpain sensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Newborn heterozygotes of either gender appear normal, but soon develop a progressive ataxia characterized biochemically by accelerated calpain-mediated spectrin cleavage and morphologically by disruption of axonal and dendritic integrity and global neurodegeneration."
    explanation: >-
      A heterozygous missense model at the Arg1098 residue shows progressive,
      postnatal axonal disruption and neurodegeneration. Indirect because the
      mouse substitution (Gln) differs from the human SPG91 one (Cys).
  downstream:
  - target: Spastic paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Degeneration of the longest central motor axons, the corticospinal tracts,
      is the presumed basis of the spastic paraplegia, as in other hereditary
      spastic paraplegias. Not demonstrated in SPG91 tissue.
  - target: Lower limb spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Corticospinal tract degeneration is the presumed basis of the leg spasticity,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Lower limb hyperreflexia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Corticospinal tract degeneration is the presumed basis of the brisk leg reflexes,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Ankle clonus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Corticospinal tract degeneration is the presumed basis of the ankle clonus,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Babinski sign
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Corticospinal tract degeneration is the presumed basis of the extensor plantar response,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Lower limb muscle weakness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Corticospinal tract degeneration is the presumed basis of the upper motor neuron pattern of leg weakness,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Bladder dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Degeneration of descending spinal pathways is the presumed basis of the neurogenic bladder dysfunction,
      as in other hereditary spastic paraplegias. Inferred from the HSP
      corticospinal paradigm; there is no SPG91 neuropathology.
  - target: Sensorimotor neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Degeneration of long peripheral axons is the presumed basis of the mainly
      axonal sensorimotor neuropathy found on nerve conduction studies.
  - target: Progressive cerebellar ataxia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

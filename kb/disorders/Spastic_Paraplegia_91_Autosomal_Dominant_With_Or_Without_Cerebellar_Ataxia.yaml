    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that truncating variants are responsible for a mild DD with or without epilepsy."

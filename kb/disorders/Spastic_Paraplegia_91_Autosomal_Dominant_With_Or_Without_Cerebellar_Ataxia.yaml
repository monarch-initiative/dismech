name: Spastic Paraplegia 91, Autosomal Dominant, With or Without Cerebellar Ataxia
creation_date: "2026-10-01T00:00:00Z"
category: Mendelian
synonyms:
- SPG91
- spastic paraplegia 91
- SPTAN1-related hereditary spastic paraplegia
- SPTAN1-related spastic ataxia
description: >-
  Spastic paraplegia 91 (SPG91) is an autosomal dominant hereditary spastic
  paraplegia, with or without cerebellar ataxia, caused by heterozygous missense
  or in-frame variants in SPTAN1, the gene for non-erythrocytic alpha-II
  spectrin. Variants are either inherited dominantly or arise de novo. Alpha-II
  spectrin pairs with beta-spectrins to form the heterotetramers that cross-link
  actin rings into the membrane-associated periodic skeleton of axons, and the
  SPG91 variants sit at positions that either hold the alpha/beta
  tetramerization interface together (the recurrent p.Arg19Trp) or link the
  three helices of a spectrin repeat (p.Lys2083del and several de novo
  missense changes). The clinical picture splits along the same line: p.Arg19Trp
  mostly causes a childhood-onset, slowly progressive, often pure spastic
  paraplegia, sometimes with sensorimotor axonal neuropathy, cerebellar signs or
  optic neuropathy; the repeat-destabilising variants mostly cause a
  slowly progressive cerebellar ataxia with cerebellar atrophy, often with mild
  intellectual disability and occasionally with seizures. Brain MRI is usually
  normal in the spastic paraplegia group. The disorder is allelic with, and
  mechanistically distinct from, SPTAN1 developmental and epileptic
  encephalopathy (DEE5), which is caused by dominant-negative in-frame variants
  in the last two spectrin repeats that make the spectrin heterodimer aggregate.
disease_term:
  preferred_term: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
  term:

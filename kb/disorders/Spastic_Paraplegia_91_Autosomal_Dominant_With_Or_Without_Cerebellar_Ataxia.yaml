discussions:
- discussion_id: gap_mechanism_of_arg19trp_untested
  prompt: >-
    Every mechanistic claim about the SPG91 variants comes from structural
    modelling. Does p.Arg19Trp actually weaken alpha/beta spectrin tetramer
    assembly in neurons, and does it act through loss of function or through a
    dominant-negative effect?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Alpha/Beta Spectrin Tetramerization
  - pathophysiology#Abnormal Alpha-II Spectrin Accumulation in Patient Fibroblasts
  - pathophysiology#Disrupted Axonal Spectrin-Actin Periodic Skeleton
  rationale: >-
    Three modelling studies place p.Arg19Trp at the tetramerization interface
    and predict a weaker alpha/beta contact, and patient fibroblasts show
    abnormal alpha-II spectrin accumulation without reduced protein. That is
    consistent with a dominant-acting, assembly-defective subunit, but no binding
    assay, no measurement of the periodic skeleton in patient neurons, and no
    animal carrying an SPG91 allele have been published. Loss-of-function SPTAN1
    alleles cause motor neuropathy, myopathy or developmental delay rather than
    spastic paraplegia, which suggests that p.Arg19Trp is not a simple null. The
    mechanism remains open.
  evidence:
  - reference: PMID:40397273
    reference_title: "Phenotypic and molecular characterization of a recurrent SPTAN1 mutation causing SPG91."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In computational simulations, this variant was predicted to perturb the stability of αII/β spectrin heterotetramerization but did not destabilize the tetramerization domain of αII-spectrin."
    explanation: >-
      The current evidence for the mechanism is computational.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although western blot did not show a quantitative difference in protein expression between patient 1 and controls, a quantitative reduction of protein expression in patient 29 was noted."
    explanation: >-
      Protein level is preserved in p.Arg19Trp fibroblasts, which argues against
      haploinsufficiency for this variant.
  proposed_experiments:
  - experiment_id: exp_arg19trp_ipsc_motor_neurons
    name: Periodic skeleton and tetramer assembly in p.Arg19Trp iPSC-derived motor neurons
    description: >-
      Derive cortical motor neurons from p.Arg19Trp patient iPSCs and isogenic
      corrected controls. Measure alpha-II/beta-II spectrin tetramer formation by
      co-immunoprecipitation and native gel, image the periodic actin-spectrin
      lattice by super-resolution microscopy, and test axon resistance to
      mechanical stretch. Reduced tetramer assembly and a disordered lattice
      without reduced protein would support a dominant-acting assembly defect.
notes: >-
  Scope: this entry is MONDO:0957813 / OMIM #620538, autosomal dominant SPG91
  with or without cerebellar ataxia. It covers both the spastic
  paraplegia-predominant and the ataxia-predominant presentations, which are
  separated as subtypes because the founding cohort describes two clearly
  delineated variant-linked groups. The allelic SPTAN1 disorders are separate
  MONDO concepts and are not folded in: developmental and epileptic
  encephalopathy 5 (MONDO:0013277), developmental delay with or without epilepsy
  (MONDO:0957815), and dominant distal hereditary motor neuronopathy 11
  (MONDO:0957875), together with the more recently described loss-of-function
  distal myopathy and the proposed recessive spastic paraplegia.


  No GeneReviews chapter covers SPG91. The Spastic Paraplegia 4 GeneReviews
  chapter (PMID:20301339) is cited only for general management of dominant
  hereditary spastic paraplegia, not as an SPG91 chapter. No ClinGen
  gene-disease validity curation exists for SPTAN1 and SPG91.


  Further case reports describe the same spectrum: a de novo p.Lys2083del
  variant with pure cerebellar ataxia (PMID:36408834) and a SPTAN1 variant
  presenting as hereditary spastic paraplegia (PMID:41338915). A de novo
  SPTAN1 nonsense variant in a family with hereditary motor neuropathy
  (PMID:33578420) belongs to the allelic motor neuropathy, not to SPG91.


  The Morsy et al. table records some features as merged or empty cells:
  extensor plantar response for patients 2-4, ankle clonus for patients 1-4
  and bladder dysfunction for patient 5. The counts in the phenotype
  descriptions use only patients with a recorded value.

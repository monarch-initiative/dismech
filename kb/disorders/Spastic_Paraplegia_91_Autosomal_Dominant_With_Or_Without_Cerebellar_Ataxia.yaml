genetic:
- name: SPTAN1
  gene_term:
    preferred_term: SPTAN1
    term:
      id: hgnc:11273
      label: SPTAN1
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  notes: >-
    Heterozygous SPTAN1 missense, in-frame deletion and splice variants cause
    SPG91. In the 100,000 Genomes Project, rare probably damaging SPTAN1 variants
    were enriched in hereditary ataxia and spastic paraplegia probands compared
    with controls (12/1142 vs 52/23,847). The HSP/ataxia carriers in that cohort
    had missense variants and one splice variant, and none of the control variants
    were truncating. Variant class and position predict phenotype across the
    SPTAN1 spectrum. C-terminal in-frame insertions, deletions and duplications in
    the heterodimer nucleation repeats cause DEE5 through dominant-negative
    aggregation (curated in the SPTAN1-Related Developmental and Epileptic
    Encephalopathy entry). Truncating variants cause dominant distal hereditary
    motor neuropathy (MONDO:0957875) and a childhood-onset distal myopathy with
    neurogenic features through nonsense-mediated decay, or milder developmental
    delay with or without seizures (MONDO:0957815). The SPG91 variants are
    missense or in-frame changes outside the DEE5 hotspot. Loss of function has
    not been shown to cause SPG91. The correlation is a trend, not a rule: the
    same p.Lys2083del variant that causes ataxia in four SPG91 patients is listed
    against a developmental and epileptic encephalopathy patient in the Morsy et
    al. cohort table. Two reports proposed biallelic SPTAN1 variants as a cause of
    recessive spastic paraplegia (PMID:31515523, PMID:34526651); the founding
    SPG91 cohort found no segregating recessive variants in more than 10,000
    datasets, and recessive disease is outside this entry.
  variants:
  - name: p.Arg19Trp
    description: >-
      c.55C>T (NM_001130438), the recurrent SPG91 variant, at the N-terminal
      tetramerization site. It segregates dominantly in several families, arises
      de novo in others, and is associated with spastic paraplegia.
    evidence:
    - reference: PMID:35150594
      reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also identified the c.55C>T, p.Arg19Trp SPTAN1 variant in seven probands with HSP"
      explanation: Names the variant and its recurrence across HSP probands.
  - name: p.Lys2083del
    description: >-
      c.6247_6249delAAG, a recurrent in-frame deletion, de novo in two of four
      patients with cerebellar ataxia and sporadic in the other two.
    evidence:
    - reference: PMID:35150594
      reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified the c.6247_6249delAAG, p.Lys2083del variant in four sporadic probands with ataxia"
      explanation: Names the variant and its recurrence across ataxia probands.
  evidence:
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we report recurrent de novo and dominantly inherited SPTAN1 mutations as a cause of both pure and complex HSP and cerebellar ataxia phenotypes in 22 patients from 14 families."
    explanation: >-
      The founding cohort's conclusion that SPTAN1 variants cause both forms of
      the disorder.
  - reference: PMID:36331550
    reference_title: "Expanding SPTAN1 monoallelic variant associated disorders: From epileptic encephalopathy to pure spastic paraplegia and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Statistically significant enrichment of rare (minor allele frequency < 1 × 10-5) probably damaging SPTAN1 variants was identified in families with hereditary ataxia (HA) or hereditary spastic paraplegia (HSP) (12/1142 cases vs 52/23,847 controls, p = 2.8 × 10-5)."
    explanation: >-
      Independent case-control evidence that SPTAN1 variants are enriched in
      hereditary ataxia and spastic paraplegia.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C-terminal in-frame insertions, deletions and duplications are highly linked to severe, early-onset epileptic encephalopathies and West syndrome."
    explanation: >-
      The allelic DEE5 variant class, which SPG91 variants do not belong to.
  - reference: PMID:35150594
    reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, nonsense mutations are seen more frequently in patients with mild HMN, where a haploinsuffiency mechanism is proposed due to nonsense-mediated decay."
    explanation: >-
      The allelic truncating class and its proposed haploinsufficiency
      mechanism, distinct from SPG91.
  - reference: PMID:31332438
    reference_title: "Nonsense mutations in alpha-II spectrin in three families with juvenile onset hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant mRNA containing nonsense mutations is broken down by nonsense-mediated decay and leads to reduced protein levels in patient cells."
    explanation: >-
      Haploinsufficiency for the allelic motor neuropathy, shown in patient
      cells; it contrasts with the unreduced protein level in p.Arg19Trp
      fibroblasts.
  - reference: PMID:39371122
    reference_title: "Heterozygous loss-of-function variants in SPTAN1 cause a novel early childhood onset distal myopathy with chronic neurogenic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SPTAN1 loss-of-function variants, including frameshift, nonsense and splice site variants cause a novel childhood onset distal weakness syndrome with primarily skeletal muscle involvement."
    explanation: >-
      A further allelic loss-of-function phenotype, distal weakness rather than
      spastic paraplegia.

animal_models:
- name: Sptan1 R1098Q heterozygous mouse
  species: Mouse
  genotype: Sptan1 c.3293G>A p.R1098Q heterozygous point mutation in spectrin repeat 10
  publication: PMID:33790315
  description: >-
    A spontaneous alpha-II spectrin missense mutation with reduced calmodulin
    affinity and increased calpain sensitivity. It sits at the residue altered
    (to cysteine) in one SPG91 patient with cerebellar ataxia, severe
    intellectual disability and seizures. Heterozygotes develop a progressive
    ataxia with neurodegeneration; spasticity is not reported.
  modeled_mechanisms:
  - target: Progressive cerebellar ataxia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Heterozygous mice develop a postnatal, progressive ataxia with cerebellar
      degeneration, resembling the ataxia-predominant form of SPG91.
    limitations: >-
      The mouse substitution is glutamine, not the cysteine seen in the patient,
      and the proposed mechanism (calpain over-sensitivity) is specific to repeat
      10. The model says nothing about the p.Arg19Trp tetramerization variant
      or the spastic paraplegia phenotype.
    evidence:
    - reference: PMID:35150594
      reference_title: "De Novo and Dominantly Inherited SPTAN1 Mutations Cause Spastic Paraplegia and Cerebellar Ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Recently, a mouse model with a spontaneous p.Arg1098Gln mutation in the Sptan1 gene was shown to develop progressive ataxia with tremors and seizures, mimicking the phenotype seen in the patient with the p.Arg1098Cys variant in SPTAN1"
      explanation: >-
        The SPG91 authors' own comparison of the mouse with their p.Arg1098Cys
        patient.
    - reference: PMID:33790315
      reference_title: "Age-dependent ataxia and neurodegeneration caused by an αII spectrin mutation with impaired regulation of its calpain sensitivity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Newborn heterozygotes of either gender appear normal, but soon develop a progressive ataxia characterized biochemically by accelerated calpain-mediated spectrin cleavage and morphologically by disruption of axonal and dendritic integrity and global neurodegeneration."
      explanation: >-
        The model's progressive, postnatal ataxia and neurodegeneration.
    - reference: PMID:36831804
      reference_title: "Progressive Ataxia, Memory Impairments, and Seizure Episodes in Spna2 R1098Q Mouse Variant Affecting Alpha II Spectrin's Scaffold Stability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By comparing groups of heterozygous R1098Q mice at different ages, we find evidence for progressive ataxia, and age-related deterioration of motor performance and muscle strength."
      explanation: >-
        A second study of the same heterozygous line confirming progressive
        ataxia and declining motor performance with age.
- name: Avil-cre Sptan1 conditional knockout mouse
  species: Mouse
  genotype: Avil-cre;Sptan1 flox/flox (alpha-II spectrin deleted from peripheral sensory neurons)
  publication: PMID:29038243
  description: >-
    Alpha-II spectrin removed from peripheral sensory neurons. Large-diameter
    myelinated axons degenerate preferentially, which causes sensory ataxia;
    nodes of Ranvier and paranodes are disrupted.
  modeled_mechanisms:
  - target: Degeneration of Large-Diameter Long Axons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Shows that alpha-II spectrin is required to keep large myelinated axons
      intact in vivo.
    limitations: >-
      A homozygous null in peripheral sensory neurons only. It has no
      corticospinal involvement and does not carry a heterozygous SPG91 allele.
    evidence:
    - reference: PMID:29038243
      reference_title: "An αII Spectrin-Based Cytoskeleton Protects Large-Diameter Myelinated Axons from Degeneration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Remarkably, Avil-cre;Sptan1f/f mice have intact nociception and small-diameter axons, but severe ataxia due to preferential degeneration of large-diameter myelinated axons."
      explanation: >-
        Selective large-axon degeneration after loss of alpha-II spectrin.

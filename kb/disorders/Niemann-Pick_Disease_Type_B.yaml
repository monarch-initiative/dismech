pathophysiology:
- name: Residual Acid Sphingomyelinase Activity from SMPD1 Variants
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  biological_scale: MOLECULAR
  description: >-
    Biallelic SMPD1 variants reduce lysosomal acid sphingomyelinase activity to
    less than 10% of normal while leaving sufficient residual catalytic
    activity to spare the central nervous system in classic NPD-B, restricting
    clinically overt storage pathology to visceral and pulmonary tissues.

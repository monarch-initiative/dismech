name: Niemann-Pick Disease Type B
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Niemann-Pick disease type B (NPD-B; chronic visceral acid sphingomyelinase
  deficiency) is the later-onset, non-CNS-neurodegenerative end of the
  autosomal recessive acid sphingomyelinase deficiency (ASMD) continuum caused
  by biallelic pathogenic variants in SMPD1. Residual acid sphingomyelinase
  activity is sufficient to spare the central nervous system in classic NPD-B
  (though occasional peripheral neuropathy can occur), while undegraded
  sphingomyelin and secondary lipids accumulate in lysosomes of
  reticuloendothelial and alveolar macrophages (foam cells). Clinically, NPD-B
  manifests with progressive hepatosplenomegaly, hypersplenism and
  thrombocytopenia, liver dysfunction and fibrosis, atherogenic dyslipidemia
  (increased LDL cholesterol and triglycerides with low HDL cholesterol),
  interstitial lung disease with progressive pulmonary function impairment,
  growth restriction with delayed skeletal maturation and puberty, osteopenia
  or osteoporosis, and frequent survival into adulthood. Enzyme replacement
  therapy with olipudase alfa reduces visceral and pulmonary sphingomyelin
  storage.
category: Mendelian

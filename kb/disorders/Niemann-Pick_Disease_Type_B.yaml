name: Niemann-Pick Disease Type B
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Niemann-Pick disease type B (NPD-B; chronic visceral acid sphingomyelinase
  deficiency) is the later-onset, essentially non-neuronopathic end of the
  autosomal recessive acid sphingomyelinase deficiency (ASMD) continuum caused
  by biallelic pathogenic variants in SMPD1. Residual acid sphingomyelinase
  activity is sufficient to spare the central nervous system in classic NPD-B,
  while undegraded sphingomyelin and secondary lipids accumulate in lysosomes
  of reticuloendothelial and alveolar macrophages (foam cells). Clinically,
  NPD-B manifests with progressive hepatosplenomegaly, liver dysfunction and
  fibrosis, thrombocytopenia and other cytopenias, atherogenic dyslipidemia,
  interstitial lung disease, growth restriction with delayed puberty, and
  osteopenia, frequently with survival into adulthood. Enzyme replacement
  therapy with olipudase alfa reduces visceral and pulmonary sphingomyelin
  storage.

genetic:
- name: SMPD1
  association: Biallelic SMPD1 variants with residual acid sphingomyelinase activity
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SMPD1
    term:
      id: hgnc:11120
      label: SMPD1
  variants:
  - name: p.Arg610del (deltaR608)
    variant_type: deletion
    clinical_significance: PATHOGENIC
    description: >-
      Recurrent in-frame single-codon deletion (historically designated
      deltaR608) that preserves low neuroprotective residual acid
      sphingomyelinase activity and occurs exclusively in non-neuronopathic
      type B NPD, accounting for 15%-20% of type B individuals in Western
      Europe and North America.
    evidence:
    - reference: PMID:28164782
      reference_title: "Types A and B Niemann-Pick disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Another mutation, deltaR608, only occurs in type B NPD patients and is found in 15% to 20% of NPD type B individuals in Western Europe and North America [55]."
      explanation: "Establishes deltaR608 (p.Arg610del) as the major Western European and North American type-B-specific SMPD1 allele."
  evidence:
  - reference: PMID:28228103
    reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acid sphingomyelinase deficiency (ASMD), a rare lysosomal storage disease, is an autosomal recessive genetic disorder caused by different SMPD1 mutations."
    explanation: "SMPD1 mutations cause ASMD; alleles preserving low residual enzyme activity yield the chronic visceral NPD-B phenotype."

  - preferred_term: bone marrow
    term:
      id: UBERON:0002371
      label: bone marrow
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Type B patients also have hepatosplenomegaly and pathologic alterations of their lungs, but there are usually no CNS signs."
    explanation: "Visceral reticuloendothelial storage with CNS sparing defines NPD-B."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NPD-B is characterized in untreated individuals by progressive hepatosplenomegaly, gradual deterioration in liver and pulmonary function, osteopenia, and atherogenic lipid profile. No central nervous system manifestations occur."
    explanation: "Confirms the chronic visceral multisystem storage profile of untreated NPD-B."
  downstream:
  - target: Hepatosplenomegaly
    causal_link_type: DIRECT
    description: "Reticuloendothelial and hepatocyte lipid-laden cell accumulation enlarges the liver and spleen."
  - target: Decreased liver function
    causal_link_type: DIRECT
    description: "Hepatic sphingomyelin storage and secondary fibrotic injury progressively impair liver function."
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Splenomegaly with hypersplenism and marrow foam-cell infiltration cause thrombocytopenia and other cytopenias."
  - target: Atherogenic dyslipidemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Hepatic and macrophage sphingomyelin storage disrupts systemic lipoprotein metabolism."
  - target: Short stature
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Chronic visceral storage burden and secondary endocrine/nutritional effects impair linear growth."
  - target: Delayed puberty
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Systemic visceral ASMD delays skeletal maturation and pubertal onset."
  - target: Osteopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: "Marrow foam-cell infiltration and disturbed sphingolipid homeostasis reduce bone mineral density."

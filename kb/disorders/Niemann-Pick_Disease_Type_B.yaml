    snippet: "Interstitial lung disease caused by storage of sphingomyelin in pulmonary macrophages results in frequent respiratory infections and often respiratory failure."
    explanation: "Directly links sphingomyelin storage in pulmonary macrophages to interstitial lung disease and respiratory morbidity."
  - reference: PMID:38397448
    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although all three types of NPD can manifest with pulmonary involvement, lung disease occurs more frequently in NPD type B, typically with interstitial lung disease, recurrent pulmonary infections, and respiratory failure."
    explanation: "Confirms high frequency and clinical impact of pulmonary involvement in NPD type B."
  downstream:
  - target: Interstitial lung disease
    causal_link_type: DIRECT
    description: "Alveolar and interstitial macrophage lipid storage produces interstitial lung disease with impaired pulmonary function."

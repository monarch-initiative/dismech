    term:
      id: GO:0006685
      label: sphingomyelin catabolic process
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: "SMPD1 mutations and deficient acid sphingomyelinase activity underlie NPD type B."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ASMD is established by detection of biallelic pathogenic variants in SMPD1 by molecular genetic testing and residual acid sphingomyelinase enzyme activity that is less than 10% of controls (in peripheral blood lymphocytes or cultured skin fibroblasts)."
    explanation: "Confirms markedly reduced (<10% of control) residual acid sphingomyelinase activity in ASMD."
  downstream:
  - target: Macrophage Lysosomal Sphingomyelin Storage and Foam-Cell Formation
    causal_link_type: DIRECT
    description: "Insufficient acid sphingomyelinase activity causes undegraded sphingomyelin to accumulate in macrophage lysosomes."
- name: Macrophage Lysosomal Sphingomyelin Storage and Foam-Cell Formation
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  biological_scale: CELLULAR
  description: >-
    Undegraded sphingomyelin and cosequestered cholesterol accumulate within
    lysosomes of mononuclear phagocytes, converting tissue macrophages into
    lipid-laden foam cells and perturbing cellular cholesterol and lipoprotein
    homeostasis.

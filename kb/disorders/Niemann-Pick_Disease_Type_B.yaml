  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The eponym Niemann-Pick disease (NPD) refers to a group of patients who present with varying degrees of lipid storage and foam cell infiltration in tissues, as well as overlapping clinical features including hepatosplenomegaly, pulmonary insufficiency and/or central nervous system (CNS) involvement."
    explanation: "Documents lysosomal lipid storage and lipid-laden macrophage foam-cell formation in NPD tissues."
  downstream:
  - target: Visceral Sphingomyelin Storage in the Reticuloendothelial System
    causal_link_type: DIRECT
    description: "Lipid-laden foam cells infiltrate the spleen, liver, and bone marrow."
  - target: Pulmonary Macrophage Sphingomyelin Storage and Interstitial Infiltration
    causal_link_type: DIRECT
    description: "Sphingomyelin-laden macrophages accumulate within alveolar spaces and pulmonary interstitium."
- name: Visceral Sphingomyelin Storage in the Reticuloendothelial System
  biological_scale: TISSUE
  description: >-
    Progressive infiltration of lipid-laden foam cells in the spleen, liver
    (Kupffer cells and hepatocytes), and bone marrow causes massive
    hepatosplenomegaly, hypersplenism and marrow crowding leading to
    cytopenias, progressive hepatic dysfunction, atherogenic dyslipidemia,
    impaired somatic growth, and reduced bone mineral density, while sparing
    the central nervous system.
  cell_types:
  - preferred_term: Kupffer cell
    term:
      id: CL:0000091
      label: Kupffer cell
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte

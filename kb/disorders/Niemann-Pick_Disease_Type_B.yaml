treatments:
- name: Enzyme Replacement Therapy (olipudase alfa)
  description: >-
    Olipudase alfa (recombinant human acid sphingomyelinase) is the FDA-approved
    disease-modifying enzyme replacement therapy for the non-CNS manifestations
    of ASMD, reducing sphingomyelin storage in the liver, spleen, and lung and
    improving organomegaly, pulmonary diffusing capacity, platelet counts, and
    lipid profiles.
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Visceral Sphingomyelin Storage in the Reticuloendothelial System
    treatment_effect: RESTORES
    description: >-
      Olipudase alfa supplies exogenous recombinant acid sphingomyelinase to
      clear accumulated sphingomyelin in hepatic, splenic, and marrow
      macrophages.
  - target: Pulmonary Macrophage Sphingomyelin Storage and Interstitial Infiltration
    treatment_effect: RESTORES
    description: >-
      Olipudase alfa reduces sphingomyelin storage in pulmonary macrophages and
      improves interstitial lung disease.
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: olipudase alfa
      term:
        id: CHEBI:755825
        label: olipudase alfa
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Olipudase alfa (Xenpozyme®) enzyme replacement therapy (ERT) helps to reduce the accumulation of sphingomyelin in the lung, liver, spleen, and other non-central nervous system organs."
    explanation: "Demonstrates that olipudase alfa ERT reduces sphingomyelin accumulation across lung, liver, spleen, and other non-CNS organs."
  - reference: PMID:35471153
    reference_title: "A randomized, placebo-controlled clinical trial evaluating olipudase alfa enzyme replacement therapy for chronic acid sphingomyelinase deficiency (ASMD) in adults: One-year results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Least square mean percent change from baseline to week 52 favored olipudase alfa over placebo for percent predicted diffusing capacity of the lung for carbon monoxide (22% vs 3.0% increases, P = .0004), spleen volume (39% decrease vs 0.5% increase, P < .0001), and liver volume (28% vs 1.5% decreases, P < .0001)."
    explanation: "Demonstrates statistically significant improvements in DLCO, spleen volume, and liver volume at 52 weeks in the randomized ASCEND trial."
  - reference: PMID:38397448
    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzyme replacement therapy with Olipudase α is the first and only approved disease-modifying therapy for patients with ASMD."
    explanation: "Confirms olipudase alfa as the approved disease-modifying ERT for ASMD."
- name: Supportive Care
  description: >-
    Multidisciplinary supportive care includes lipid-lowering therapy (with
    liver function monitoring), calcium and vitamin D supplementation for
    osteopenia/osteoporosis, supplemental oxygen for symptomatic lung disease,
    transfusion support for life-threatening bleeding, partial splenectomy in
    selected cases of severe hypersplenism, nutritional support, and avoidance
    of contact sports in individuals with splenomegaly.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28228103
    reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Available treatments are limited to symptom management and supportive care."
    explanation: "Symptom management and supportive care complement enzyme replacement across multisystem complications."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment of hyperlipidemia in adults; calcium and vitamin D for osteopenia/osteoporosis"
    explanation: "GeneReviews outlines targeted supportive management for dyslipidemia and osteopenia/osteoporosis in ASMD."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Contact sports in those who have splenomegaly."
    explanation: "GeneReviews specifically advises avoiding contact sports in individuals with splenomegaly to reduce splenic rupture risk."
- name: Genetic Counseling
  description: >-
    Genetic counseling informs families of autosomal recessive inheritance (25%
    sibling recurrence risk) and enables carrier testing and prenatal or
    preimplantation genetic testing once familial SMPD1 variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All forms of ASMD (NPD-A, NPD-A/B, and NPD-B) are inherited in an autosomal recessive manner. If both parents are known to be heterozygous for an SMPD1 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: "Establishes autosomal recessive recurrence risk counseling for ASMD families."
clinical_trials:
- name: NCT02004691
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ASCEND randomized, double-blind, placebo-controlled 52-week pivotal study
    of intravenous olipudase alfa every 2 weeks in 36 adults with chronic
    visceral ASMD, demonstrating significant improvements in pulmonary DLCO,
    spleen volume, and liver volume.
  notes: >-
    Registered on ClinicalTrials.gov as a combined Phase 2/3 trial; encoded as
    PHASE_III under the single-value phase enum.
  evidence:
  - reference: clinicaltrials:NCT02004691
    reference_title: "A Phase 2/3, Multicenter, Randomized, Double-blinded, Placebo-controlled, Repeat-dose Study to Evaluate the Efficacy, Safety, Pharmacodynamics, and Pharmacokinetics of Olipudase Alfa in Patients With Acid Sphingomyelinase Deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary objective of this phase 2/3 study was to evaluate the efficacy of olipudase alfa (recombinant human acid sphingomyelinase) administered intravenously once every 2 weeks for 52 weeks in adult participants with acid sphingomyelinase deficiency (ASMD)"
    explanation: "ClinicalTrials.gov registration record for the adult ASCEND trial of olipudase alfa in ASMD."
  - reference: PMID:35471153
    reference_title: "A randomized, placebo-controlled clinical trial evaluating olipudase alfa enzyme replacement therapy for chronic acid sphingomyelinase deficiency (ASMD) in adults: One-year results."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A phase 2/3, 52 week, international, double-blind, placebo-controlled trial (ASCEND; NCT02004691/EudraCT 2015-000371-26) enrolled 36 adults with ASMD randomized 1:1 to receive olipudase alfa or placebo intravenously every 2 weeks with intrapatient dose escalation to 3 mg/kg."
    explanation: "Published one-year primary results of the ASCEND trial in adults with chronic ASMD."
- name: NCT02292654
  phase: PHASE_II
  status: COMPLETED
  description: >-

animal_models:
- name: Gnptg-null mouse, Lexicon line (Gnptg tm1Lex)
  species: Mouse
  genotype: Gnptg<tm1Lex>/Gnptg<tm1Lex>
  alleles:
  - Gnptg<tm1Lex>
  genes:
  - preferred_term: GNPTG
    term:
      id: hgnc:23026
      label: GNPTG
  publication: PMID:19261645
  description: >-
    Knockout of the GlcNAc-1-phosphotransferase gamma subunit, studied alongside
    the alpha/beta-subunit knockout that models mucolipidosis II. The pairing is
    what makes this model informative: losing the gamma subunit causes only a
    partial loss of mannose-6-phosphate tagging, where losing alpha/beta abolishes
    it, and the severity of storage disease in the two lines tracks the residual
    enzyme activity. That graded relationship is the mouse counterpart of the
    milder human ML III gamma against ML II.
  notes: >-
    MGI records Gnptg<tm1Lex> (MGI:3757947, Lexicon Genetics) with PMID:17652091
    as its originating reference and annotates that paper to this genotype, so
    the phosphorylation measurement below is allele-confirmed. MGI carries no
    annotation for PMID:19261645; that paper is assigned to this line on author
    and allele-series continuity with PMID:17652091 rather than on an MGI record,
    and the assignment should be treated as such. A separate gamma-null line from
    a different group is curated below, and the two disagree about cartilage.
  modeled_mechanisms:
  - target: GlcNAc-1-Phosphotransferase Gamma-Subunit Deficiency and M6P Targeting
      Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Germline loss of the orthologous subunit, with the partial rather than
      complete tagging defect that distinguishes gamma-subunit disease from
      alpha/beta-subunit disease.
    limitations: >-
      A complete gamma-subunit null models the severe end of the GNPTG allelic
      spectrum, whereas most human ML III gamma alleles retain some subunit
      function.
    readouts:
    - name: Mannose 6-phosphorylation of acid hydrolases
      target: GlcNAc-1-Phosphotransferase Gamma-Subunit Deficiency and M6P Targeting
        Failure
      direction: DECREASED
      interpretation: >-
        Partial, not abolished. The same study measured complete loss in the
        alpha/beta knockout, so this readout is the quantitative difference
        between ML III gamma and ML II rather than a shared defect.
      evidence:
      - reference: PMID:17652091
        reference_title: 'Murine UDP-GlcNAc:lysosomal enzyme N-acetylglucosamine-1-phosphotransferase
          lacking the gamma-subunit retains substantial activity toward acid hydrolases.'
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: disruption of the alpha/beta gene completely abolishes phosphorylation
          of high mannose oligosaccharides on acid hydrolases whereas knock-out of
          the gamma gene results in only a partial loss of phosphorylation
        explanation: Measures the residual phosphotransferase activity in this genotype
          against the alpha/beta null assayed in the same study.
    - name: Serum lysosomal enzyme levels
      target: GlcNAc-1-Phosphotransferase Gamma-Subunit Deficiency and M6P Targeting
        Failure
      direction: INCREASED
      interpretation: >-
        Enzyme amount rising in the wrong compartment because the tagging that
        routes hydrolases to the lysosome is impaired. It must not be read as
        preserved lysosomal function.
      evidence:
      - reference: PMID:19261645
        reference_title: Comparative pathology of murine mucolipidosis types II and
          IIIC.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We found that both lines of mutant mice had elevated levels of serum
          lysosomal enzymes and cytoplasmic alterations in secretory cells of several
          exocrine glands; however, lesions in gamma-subunit deficient (Gnptg(-/-))
          mice were milder and more restricted in distribution than in alpha/beta-subunit
          deficient (Gnptab(-/-)) mice.
        explanation: Reports the raised circulating hydrolases and the milder, more
          restricted lesion distribution relative to the alpha/beta null.
    evidence:
    - reference: PMID:19261645
      reference_title: Comparative pathology of murine mucolipidosis types II and IIIC.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The milder disease in the gamma-subunit deficient mice correlated with
        residual synthesis of the mannose 6-phosphate recognition marker.
      explanation: Ties the milder phenotype directly to residual M6P tagging, which
        is the mechanism this node names.
  - target: Lysosomal Substrate Accumulation in Connective Tissue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Storage develops, but not in the tissue compartment that defines the human
      disease.
    limitations: >-
      Neither this line nor the alpha/beta line develops the cytoplasmic vacuolar
      inclusions in fibrocytes and mesenchymal cells - the I-cells - that
      characterise the skeletal and connective-tissue disease in human ML II and
      ML III. The predominant murine lesion is in exocrine secretory epithelium
      instead, which is not where the human disease is felt. This line is also
      reported to lack cartilage defects outright, which a second gamma-null line
      contradicts; see the cartilage controversy recorded in this entry.
      Storage-burden or connective-tissue endpoints should not be transferred from
      this model to patients.
    readouts:
    - name: Cytoplasmic vacuolar inclusions in fibrocytes and mesenchymal cells (I-cells)
      target: Lysosomal Substrate Accumulation in Connective Tissue
      direction: UNCHANGED
      interpretation: >-
        A negative result, and the reason this link is PARTIALLY_RECAPITULATES at
        LOW fidelity. The lesion that names the human disease does not form in
        either mouse line.
      evidence:
      - reference: PMID:19261645
        reference_title: Comparative pathology of murine mucolipidosis types II and
          IIIC.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Of significance, neither strain of mutant mice developed cytoplasmic
          vacuolar inclusions in fibrocytes or mesenchymal cells (I-cells), the characteristic
          lesion associated with the prominent skeletal and connective tissue abnormalities
          in humans with MLII and MLIII.
        explanation: Documents the absent I-cell lesion in both knockout lines.
    evidence:
    - reference: PMID:19261645
      reference_title: Comparative pathology of murine mucolipidosis types II and IIIC.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We conclude that mice lacking either alpha/beta or gamma subunits displayed
        clinical and pathologic features that differed substantially from those reported
        in humans having mutations in orthologous genes.
      explanation: The authors' own bound on how far either mouse line stands in for
        the human connective-tissue disease.
- name: Gnptg-null mouse, Hamburg line (Gnptg ko)
  species: Mouse
  genotype: Gnptg ko, homozygous
  background: C57BL/6
  genes:
  - preferred_term: GNPTG
    term:
      id: hgnc:23026
      label: GNPTG
  publication: PMID:33023972
  description: >-
    A second, independently derived gamma-subunit null line, curated separately
    from the Lexicon line above because it is a different mouse. The reporting
    paper's Animals section states that its Gnptg ko (C57Bl/6) mice "have been
    described previously (Kollmann et al., 2012, 2013; Di Lorenzo et al., 2018)",
    a provenance distinct from the Lexicon allele. It is the line in which the
    cartilage and joint phenotype was found.
  notes: >-
    The allele is not named in the paper's abstract, and the full text is not in
    the local reference cache, so the line is recorded as the authors write it
    rather than by MGI allele symbol. MGI lists Gnptg<tm1d(KOMP)Wtsi>
    (MGI:6270380) with the synonym Gnptg<ko> and Di Lorenzo 2018 (PMID:29773673)
    as its reference, which is the plausible MGI identity for this line, but the
    match is not asserted here because it has not been confirmed against the
    paper.
  modeled_mechanisms:
  - target: Lysosomal Substrate Accumulation in Connective Tissue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Substrate accumulates inside chondrocytes and the cartilage matrix is
      altered, which is the connective-tissue storage this node names.
    limitations: >-
      Chondrocytes and tendon were assayed; the I-cell inclusions in fibrocytes
      and mesenchymal cells that define the human lesion were not reported here
      and were absent in the Lexicon line. The Lexicon line is reported to lack
      cartilage defects altogether, so this readout is contradicted by the other
      gamma-null model in this entry.
    readouts:
    - name: Chondrocyte chondroitin sulfate content and differentiation
      target: Lysosomal Substrate Accumulation in Connective Tissue
      direction: INCREASED
      interpretation: >-
        Substrate accumulating inside the cell type that builds cartilage, with
        differentiation impaired alongside it.
      evidence:
      - reference: PMID:33023972
        reference_title: Imbalanced cellular metabolism compromises cartilage homeostasis
          and joint function in a mouse model of mucolipidosis type III gamma.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: missorting of a number of lysosomal enzymes is associated with intracellular
          accumulation of chondroitin sulfate in Gnptgko chondrocytes and their impaired
          differentiation, as well as with altered microstructure of the cartilage
          extracellular matrix (ECM)
        explanation: Reports the substrate accumulation and matrix change in cartilage
          in this line.
  - target: Chronic pain
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-

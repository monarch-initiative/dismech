discussions:
- discussion_id: gnptg_mouse_cartilage_conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: Do Gnptg-null mice have a cartilage phenotype?
  attaches_to:
  - animal_models#Gnptg-null mouse, Lexicon line (Gnptg tm1Lex)
  - animal_models#Gnptg-null mouse, Hamburg line (Gnptg ko)
  - pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue
  rationale: >-
    Two reports of gamma-subunit null mice reach opposite conclusions. The 2009
    comparative pathology study reports that the gamma-null mice "lacked cartilage
    defects", and uses that absence, with the absent retinal degeneration, to argue
    the line is milder than the alpha/beta knockout. The 2020 study reports
    intracellular chondroitin sulfate accumulation in Gnptg knockout chondrocytes,
    impaired chondrocyte differentiation, and altered cartilage extracellular
    matrix microstructure. Four candidate explanations are on the table and none
    has been tested against the others. First, the two papers do not use the same
    mouse: the 2020 Animals section attributes its line to Kollmann and Di Lorenzo,
    a different provenance from the Lexicon allele carrying the 2009 result, so
    line and background differences are a live explanation rather than a
    formality. Second, depth of assay differs - the earlier study read histology
    and gross phenotype, the later one measured matrix ultrastructure, substrate
    content and chondrocyte differentiation, so a defect invisible at one
    resolution may be plain at another. Third, the 2009 authors offer their own
    mechanistic account, attributing the absent chondrocyte and retinal lesions to
    residual beta-glucuronidase activity, which is a residual-activity explanation
    of the same kind that organises the rest of this entry. Fourth, the animals may
    not be of comparable age: the 2020 work reports on aged joints and tendon,
    while the 2009 abstract does not state its timepoints. Recorded so the entry
    does not silently adopt one report over the other.
  evidence:
  - reference: PMID:19261645
    reference_title: Comparative pathology of murine mucolipidosis types II and IIIC.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: In contrast to mice deficient in the alpha/beta subunits, the mice lacking
      the gamma subunits were of normal size, lacked cartilage defects, and did not
      develop retinal degeneration.
    explanation: The report that the Lexicon line has no cartilage defect.
  - reference: PMID:19261645
    reference_title: Comparative pathology of murine mucolipidosis types II and IIIC.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The absence of retinal and chondrocyte lesions in Gnptg(-/-) mice might
      be attributed to residual beta-glucuronidase activity.
    explanation: The 2009 authors' own mechanistic explanation for the absence they
      report, offered as a candidate account of the discrepancy rather than as evidence
      for either phenotype.
  - reference: PMID:33023972
    reference_title: Imbalanced cellular metabolism compromises cartilage homeostasis
      and joint function in a mouse model of mucolipidosis type III gamma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: missorting of a number of lysosomal enzymes is associated with intracellular
      accumulation of chondroitin sulfate in Gnptgko chondrocytes and their impaired
      differentiation, as well as with altered microstructure of the cartilage extracellular
      matrix (ECM)
    explanation: The report that a gamma-null line does have a cartilage phenotype.
  proposed_experiments:
  - experiment_id: gnptg_cartilage_head_to_head_matched_age
    name: Both gamma-null lines assayed side by side at matched ages with the deeper
      cartilage endpoints
    description: >-
      Take the Lexicon line and the Hamburg line into one experiment and apply the
      2020 endpoints to both at the same ages: chondrocyte chondroitin sulfate
      content, chondrocyte differentiation markers, and cartilage extracellular
      matrix ultrastructure, alongside the histology and gross skeletal assessment
      the 2009 study used. This is the one design that separates the first two
      candidate explanations from each other, because a line difference and a
      depth-of-assay difference make opposite predictions once line and assay are
      varied independently.
    would_support:
    - pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue
    supporting_outcome:
    - >-
      Both lines show chondroitin sulfate accumulation and matrix change at the
      deeper endpoints while both remain unremarkable on histology alone, which
      would make depth of assay the explanation and the cartilage phenotype a
      property of gamma-subunit loss rather than of one line.
    would_refute:
    - pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue
    refuting_outcome:
    - >-
      The Hamburg line reproduces the 2020 findings and the Lexicon line remains
      unaffected at the same endpoints and ages, which would make the line
      difference the explanation and leave the cartilage phenotype unestablished
      for gamma-subunit loss in general.
  - experiment_id: gnptg_residual_beta_glucuronidase_in_cartilage
    name: Residual beta-glucuronidase activity in cartilage of both gamma-null lines
    description: >-
      Measure beta-glucuronidase activity in chondrocytes and cartilage of both
      lines against wild-type and against the alpha/beta knockout, to test the 2009
      authors' own account of the absence they report. The claim is currently an
      untested hypothesis offered in a discussion sentence, and it is the candidate
      explanation most directly checkable, since the residual activity it invokes
      is a quantity rather than a difference in husbandry or method.
    would_support:
    - pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue
    supporting_outcome:
    - >-
      Residual beta-glucuronidase activity in cartilage tracks inversely with
      cartilage involvement across the lines, supporting a graded-activity
      threshold above which the tissue is spared.
    would_refute:
    - pathophysiology#Lysosomal Substrate Accumulation in Connective Tissue
    refuting_outcome:
    - >-
      Residual beta-glucuronidase activity is comparable in the two lines despite
      their differing cartilage findings, which would eliminate the 2009 authors'
      account and leave line provenance, assay depth or animal age carrying the
      discrepancy.

  - reference: PMID:35776569
    reference_title: "Aortic stenosis in homozygous familial hypercholesterolaemia: a paradigm shift over a century."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the 424 HoFH cases, AS was identified in 57% of patients in the pre-statin era vs. 35% in patients reported more recently (>2000, long-term statin period). With an increase in longevity due to statins and lipoprotein apheresis, a change in the proportion of patients with SVAS and VAS with a SVAS:VAS ratio of 47:53 and 10:90 for HoFH patients not on statin and on long-term statin, respectively, was noted."
    explanation: >
      Supports the OCCASIONAL band (5-29%). Aortic stenosis of any kind affects
      57% of HoFH cases in the pre-statin era and 35% in the long-term statin
      era; applying the reported SVAS:VAS ratios gives SVAS in roughly 27% of
      pre-statin and roughly 3-4% of statin-era patients, so SVAS alone sits
      below the FREQUENT (30-79%) band that the combined SVAS-plus-VAS wording
      would otherwise suggest.

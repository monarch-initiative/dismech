    shows LDL-C of 190-400 mg/dL (4.9-10.3 mmol/L); homozygous FH shows LDL-C
    >500 mg/dL (>13 mmol/L). LDL-C >10 mmol/L (>400 mg/dL) is suggestive of HoFH.

definitions:
- name: PheKB EHR Phenotyping Algorithm for Familial Hypercholesterolemia (SEARCH)
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Electronic-health-record ePhenotyping algorithm (Safarova & Kullo, Mayo
    Clinic) that operationalizes the Dutch Lipid Clinic Network (DLCN) diagnostic
    criteria from structured EHR fields plus natural language processing of family
    history and physical-exam FH stigmata (tendon xanthomas, corneal arcus). A
    structured-data prefilter first selects LDL-C >= 190 mg/dL with triglycerides
    < 400 mg/dL and no secondary causes of hyperlipidemia, after which DLCN points
    are scored. Published to the Phenotype KnowledgeBase (PheKB) and deployed in
    the SEARCH study; portable to eMERGE/OMOP sites.
  scope: Structured EHR plus clinical-note NLP (developed and deployed at Mayo Clinic; PheKB-published)
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      In the SEARCH cohort (131,000 primary-care patients) blinded expert chart
      review yielded positive and negative predictive values of 94% and 97%.
    evidence:
    - reference: PMID:27678441
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      reference_title: "Rapid identification of familial hypercholesterolemia from electronic health records: The SEARCH study."
      snippet: "Blinded expert review revealed positive and negative predictive values for the SEARCH algorithm at 94% and 97%, respectively."
      explanation: Reports the blinded-expert-review (gold-standard) validation of the algorithm.
  criteria_sets:
  - name: Structured-data prefilter
    description: Coded-data prescreen applied before DLCN scoring.
    inclusion_criteria:
    - preferred_term: LDL-C >= 190 mg/dL
      description: Low-density lipoprotein cholesterol at or above 190 mg/dL.
    - preferred_term: Triglycerides < 400 mg/dL
      description: Excludes marked hypertriglyceridemia.
    exclusion_criteria:
    - preferred_term: Secondary causes of hyperlipidemia
      description: Excludes patients with identified secondary causes of hyperlipidemia.
  - name: Dutch Lipid Clinic Network criteria ascertainment
    description: DLCN scoring from structured data supplemented by note NLP.
    inclusion_criteria:
    - preferred_term: DLCN structured components
      description: LDL-C level and coded personal/family history of premature cardiovascular disease and hypercholesterolemia.
    - preferred_term: NLP-extracted family history and FH stigmata
      description: Natural language processing of notes for family history and physical-exam stigmata such as tendon xanthomas and corneal arcus.
  evidence:
  - reference: PMID:27678441
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    reference_title: "Rapid identification of familial hypercholesterolemia from electronic health records: The SEARCH study."
    snippet: "Our EHR-based algorithm ascertained the Dutch Lipid Clinic Network criteria for FH using structured data sets and natural language processing for family history and presence of FH stigmata on physical examination."
    explanation: Describes the algorithm design — DLCN operationalization via structured data plus NLP.
  notes: >-
    Published to the Phenotype KnowledgeBase (PheKB) as "Electronic Health
    Record-based Phenotyping Algorithm for Familial Hypercholesterolemia." See
    also Kullo & Safarova, "Lessening the Burden of Familial Hypercholesterolemia
    Using Health Information Technology" (Circulation Research 2018,
    PMID:29301842).
- name: FAMCAT (Familial Hypercholesterolaemia Case Ascertainment Tool)
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Primary-care case-finding prediction model (Weng, Qureshi et al., University
    of Nottingham) that flags patients with high probability of FH from routine
    electronic primary-care records so they can be prioritized for further
    clinical assessment against established diagnostic criteria. The core FAMCAT
    model uses nine diagnostic variables (including total/LDL cholesterol,
    triglycerides, and family history of premature myocardial infarction and
    hypercholesterolemia); the FAMCAT2 variant adds personal history of premature
    coronary heart disease. It is a statistical prediction model rather than a
    criteria checklist.
  scope: Routine UK primary-care EHR (derived and validated on the Clinical Practice Research Datalink, CPRD)
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Derived and validated on 2,975,281 CPRD patients including 5050 documented
      FH cases; the nine-variable model achieved AUC 0.860 (95% CI 0.848-0.871),
      and external validation and head-to-head studies show it outperforms the
      Simon Broome, DLCN, and 99th-centile-cholesterol approaches.
    evidence:
    - reference: PMID:25555265
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      reference_title: "Improving identification of familial hypercholesterolaemia in primary care: derivation and validation of the familial hypercholesterolaemia case ascertainment tool (FAMCAT)."
      snippet: "The FH prediction model (FAMCAT), consisting of nine diagnostic variables, showed high discrimination (AUC 0.860, 95% CI 0.848-0.871) for distinguishing cases from non-cases."
      explanation: Reports the model's discrimination on the CPRD derivation/validation cohort.
  evidence:
  - reference: PMID:25555265
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    reference_title: "Improving identification of familial hypercholesterolaemia in primary care: derivation and validation of the familial hypercholesterolaemia case ascertainment tool (FAMCAT)."
    snippet: "Data were analysed for 2,975,281 patients with total or LDL-cholesterol measurement from 1 Jan 1999 to 31 August 2013 using the Clinical Practice Research Datalink (CPRD). Included in this cohort study were 5050 documented cases of FH."
    explanation: Documents the CPRD derivation/validation cohort underlying FAMCAT.
  notes: >-
    A logistic-regression prediction model intended to prioritize individuals for
    further assessment using established diagnostic criteria, not a standalone
    diagnosis. Externally validated (Lancet Public Health 2019) and shown to
    outperform Simon Broome / DLCN in head-to-head primary-care studies
    (PMID:34635577).
- name: FIND FH (machine-learning case detection)
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Machine-learning (random forest) classifier developed by the FH Foundation's
    FIND FH initiative with Stanford to surface undiagnosed ("missed") FH patients
    from EHR data, rather than replicate a criteria checklist. Trained on known FH
    cases versus matched non-cases and used to flag high-probability candidates
    for confirmatory FH screening, addressing the >95% false-positive rate of
    simple LDL-C threshold screening.
  scope: EHR data (developed at Stanford Health Care; externally validated at the Geisinger Health System)
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      The random forest achieved PPV 0.88 and sensitivity 0.75 on a held-out test
      set; external validation at Geisinger (466 FH patients, 236 genetically
      proven) achieved PPV 0.85, and chart review confirmed 84% of the
      highest-probability flags.
    evidence:
    - reference: DOI:10.1038/s41746-019-0101-5
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      reference_title: "Finding missed cases of familial hypercholesterolemia in health systems using machine learning"
      snippet: "In external validation on 466 FH patients (236 with genetically proven FH) and 5000 matched non-cases from the Geisinger Healthcare System our FH classifier achieved a PPV of 0.85."
      explanation: Reports external-site (Geisinger) validation of the ML classifier.
  evidence:
  - reference: DOI:10.1038/s41746-019-0101-5
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    reference_title: "Finding missed cases of familial hypercholesterolemia in health systems using machine learning"
    snippet: "We trained a random forest classifier using data from known patients (n = 197) and matched non-cases (n = 6590). Our classifier obtained a positive predictive value (PPV) of 0.88 and sensitivity of 0.75 on a held-out test-set."
    explanation: Describes the ML classifier design and internal (held-out test-set) performance.
  notes: >-
    Unlike the DLCN/Simon Broome operationalizations, FIND FH is a predictive
    classifier optimized to find undiagnosed cases for downstream screening, not
    to render a diagnosis on its own.
has_subtypes:
- name: Heterozygous Familial Hypercholesterolemia
  description: >
    Caused by a single pathogenic allele in LDLR, APOB, or PCSK9. LDL-C
    typically 190-400 mg/dL. Untreated males may develop coronary events by
    age 40-50, females by age 50-60. Prevalence approximately 1:250-300.
    Responds well to statin-based combination therapy.
  subtype_frequency: "~99%"
  evidence:
  - reference: PMID:29219151
    reference_title: "Familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial hypercholesterolaemia is a common inherited disorder characterized by abnormally elevated serum levels of low-density lipoprotein (LDL) cholesterol from birth, which in time can lead to cardiovascular disease (CVD)."
    explanation: HeFH is the common form, with elevated LDL-C leading to premature CVD.
- name: Homozygous Familial Hypercholesterolemia
  description: >
    Caused by two pathogenic alleles (true homozygotes or compound heterozygotes).
    LDL-C typically >500 mg/dL (>10 mmol/L). Atherosclerosis often presents during
    childhood or adolescence with aortic valve disease and coronary events.
    Requires aggressive multi-pronged LDL-lowering therapy including apheresis
    and LDLR-independent agents.
  subtype_term:
    preferred_term: homozygous familial hypercholesterolemia
    term:
      id: MONDO:0018328
      label: homozygous familial hypercholesterolemia
  subtype_frequency: "~1:250,000-360,000"
  evidence:
  - reference: DOI:10.1093/eurheartj/ehad197
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This 2023 statement updates clinical guidance for homozygous familial hypercholesterolaemia (HoFH), explains the genetic complexity, and provides pragmatic recommendations to address inequities in HoFH care worldwide."
    explanation: EAS 2023 consensus provides clinical guidance for HoFH including diagnostic criteria and multi-pronged therapy.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >
    The majority of FH cases follow autosomal dominant inheritance due to mutations
    in LDLR, APOB, or PCSK9. Clinical severity depends on the causative gene and
    specific mutation, and is further modulated by polygenic background and lifestyle.
  evidence:
  - reference: PMID:29219151
    reference_title: "Familial hypercholesterolaemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases are caused by autosomal dominant mutations in LDLR, which encodes the LDL receptor, although mutations in other genes coding for proteins involved in cholesterol metabolism or LDLR function and processing, such as APOB and PCSK9, can also be causative, although less frequently."
    explanation: Confirms autosomal dominant inheritance as the primary mode.
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Rare autosomal recessive FH is caused by biallelic loss-of-function mutations
    in LDLRAP1 (encoding the LDL receptor adaptor protein 1/ARH), which is required
    for clathrin-mediated endocytosis of the LDLR-LDL complex.
  evidence:
  - reference: DOI:10.3390/ijms24043224
    reference_title: "Genetic Heterogeneity of Familial Hypercholesterolemia: Repercussions for Molecular Diagnosis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in the LDLRAP1 gene causes FH with a recessive inheritance and a specific APOE variant was described as causative of FH, contributing to increase FH genetic heterogeneity."
    explanation: Confirms LDLRAP1 as the cause of autosomal recessive FH.

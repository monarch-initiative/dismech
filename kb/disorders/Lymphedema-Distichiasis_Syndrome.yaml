    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other complications may include cardiac defects, cleft palate, extradural
      cysts, and photophobia
    explanation: >-
      Extradural cysts are listed among LDS complications.
  - reference: PMID:20535019
    reference_title: Spinal extradural arachnoid cysts in lymphedema-distichiasis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve family members carried a mutation in the FOXC2 gene and had
      clinical features of lymphedema-distichiasis syndrome. Of these, 58%
      (seven individuals) had extradural arachnoid cysts.
    explanation: >-
      Spinal MRI of all carriers in one family found cysts in 58%.
  - reference: PMID:24278289
    reference_title: FOXC2 mutations in familial and sporadic spinal extradural arachnoid cyst.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, SEDAC caused by the heterozygous FOXC2 loss-of-function mutation
      should be considered a feature of LDS, although it often manifests as the
      sole symptom.
    explanation: >-
      The cyst can be the only sign of FOXC2 haploinsufficiency.
  - reference: PMID:29459084

- name: Meibomian Gland Lash Metaplasia
  biological_scale: TISSUE
  description: >-
    Distichiatic lashes grow from the meibomian gland orifices, reflecting a
    metaplastic switch of the meibomian (tarsal) sebaceous glands into
    pilosebaceous units. Foxc2 is expressed in the developing eyelid and Foxc2
    heterozygous mice uniformly have distichiasis. A reporter study suggests
    FOXC2 variants reduce activation of the WNT4 promoter, which has been
    proposed, but not shown in vivo, to link FOXC2 loss to the gland-to-follicle
    switch.
  locations:

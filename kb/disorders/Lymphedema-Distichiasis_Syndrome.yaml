      id: UBERON:0001818
      label: tarsal gland
  evidence:
  - reference: PMID:35325995
    reference_title: "Distichiasis: An update on etiology, treatment and outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Distichiasis, an extra row of eyelashes emerging from meibomian gland
      orifices, occurs due to the metaplastic transition of sebaceous glands
      into the pilosebaceous unit.
    explanation: >-
      Review describing the meibomian gland origin of the extra lashes.
  - reference: PMID:15465483
    reference_title: Foxc2 is expressed in developing lymphatic vessels and other tissues associated with lymphedema-distichiasis syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have found that Foxc2 is expressed in lymphatic primordia, jugular
      lymph sacs, lymphatic collectors and capillaries, as well as in podocytes,
      developing eyelids and other tissues associated with abnormalities in
      lymphedema-distichiasis syndrome.
    explanation: >-
      Foxc2 is expressed in the developing eyelid.
  - reference: PMID:35716761
    reference_title: "Genetic landscape of FOXC2 mutations in lymphedema-distichiasis syndrome: Different mechanism of pathogenicity for mutations in different domains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings also showed that all 8 mutations decreased the ability of
      interaction between FOXC2 and the Wnt4 promoter, suggesting mutations in
      FOXC2 may also affect the Wnt4-Frizzled-RYK signaling pathway, leading the
      abnormal differentiation of the meibomian glands into hair follicle cells
      during the embryonic period and causing distichiasis.
    explanation: >-
      In vitro data suggesting a WNT4-mediated route from FOXC2 loss to
      meibomian gland metaplasia; the in vivo step is a hypothesis.
  downstream:

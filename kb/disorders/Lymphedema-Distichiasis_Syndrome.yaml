- name: Defective Lymphatic Valve Formation and Maintenance
  biological_scale: TISSUE
  description: >-
    FOXC2 and PROX1 are highly expressed in the endothelial cells that form
    lymphatic valves. Together with flow they induce connexin37 and
    calcineurin/NFAT signaling, which delimit the valve territory and drive
    maturation of the primary lymphatic plexus into valved collecting vessels.
    Foxc2-null mice have no lymphatic valves, and postnatal lymphatic deletion
    of Foxc2 causes valve regression and junctional defects, so FOXC2 is needed
    both to build and to maintain the valves.
  cell_types:
  - preferred_term: lymphatic valve endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  locations:
  - preferred_term: lymphatic valve
    term:
      id: UBERON:0034949
      label: lymphatic valve
  biological_processes:
  - preferred_term: lymphatic valve morphogenesis
    modifier: DECREASED
    term:
      id: GO:0036303
      label: lymph vessel morphogenesis
  evidence:
  - reference: PMID:15322537
    reference_title: Defective valves and abnormal mural cell recruitment underlie lymphatic vascular failure in lymphedema distichiasis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We report that Foxc2(-/-) mice show abnormal lymphatic vascular
      patterning, increased pericyte investment of lymphatic vessels, agenesis
      of valves and lymphatic dysfunction.
    explanation: >-
      Foxc2-null mice lack lymphatic valves.
  - reference: PMID:22306086
    reference_title: "Mechanotransduction, PROX1, and FOXC2 cooperate to control connexin37 and calcineurin during lymphatic-valve formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistically, PROX1, FOXC2, and flow coordinately control expression of
      the gap junction protein connexin37 and activation of calcineurin/NFAT
      signaling.
    explanation: >-
      Defines the FOXC2-dependent signaling program that builds the valve.
  - reference: PMID:19398761
    reference_title: FOXC2 controls formation and maturation of lymphatic collecting vessels through cooperation with NFATc1.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we provide a molecular and morphological characterization
      of the major steps in the maturation of the primary lymphatic capillary
      plexus into collecting lymphatic vessels during development and show that
      forkhead transcription factor Foxc2 controls this process.
    explanation: >-
      Foxc2 is required for maturation of collecting lymphatic vessels.
  - reference: PMID:26389677
    reference_title: FOXC2 and fluid shear stress stabilize postnatal lymphatic vasculature.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In murine models, inducible deletion of Foxc2 within the lymphatic
      vasculature led to cell-cell junction defects, regression of valves, and
      focal vascular lumen collapse, which triggered generalized lymphatic
      vascular dysfunction and lethality.
    explanation: >-
      Postnatal Foxc2 deletion causes valve regression, showing a maintenance
      role.
  - reference: PMID:15465483
    reference_title: Foxc2 is expressed in developing lymphatic vessels and other tissues associated with lymphedema-distichiasis syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have found that Foxc2 is expressed in lymphatic primordia, jugular
      lymph sacs, lymphatic collectors and capillaries, as well as in podocytes,
      developing eyelids and other tissues associated with abnormalities in
      lymphedema-distichiasis syndrome.
    explanation: >-
      Foxc2 is expressed in lymphatic collectors and in the other tissues that
      are affected in LDS.
  - reference: PMID:27313318
    reference_title: Mechanotransduction activates canonical Wnt/β-catenin signaling to promote lymphatic vascular patterning and the development of lymphatic and lymphovenous valves.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In turn, Wnt/β-catenin signaling controls the expression of several
      molecules, including the lymphedema-associated transcription factor
      FOXC2. Importantly, FOXC2 completely rescues the lymphatic vessel
      patterning defects in mice lacking β-catenin.
    explanation: >-
      Places FOXC2 downstream of flow-induced Wnt/beta-catenin signaling in the
      valve-forming program.

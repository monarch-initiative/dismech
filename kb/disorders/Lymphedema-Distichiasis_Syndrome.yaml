  - reference: PMID:35716761
    reference_title: "Genetic landscape of FOXC2 mutations in lymphedema-distichiasis syndrome: Different mechanism of pathogenicity for mutations in different domains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found mutations located in the forkhead domain and central region
      dramatically reduced the transactivation ability, while mutations in
      activation domain-2 enhanced this ability.
    explanation: >-
      Reporter assays show reduced transactivation for forkhead and central
      region variants, with increased activity for some activation domain-2
      variants.
  - reference: PMID:27276711
    reference_title: FOXC2 disease-mutations identified in lymphedema-distichiasis patients cause both loss and gain of protein function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data reveal that either a complete loss or a significant gain of FOXC2
      function can cause a perturbation of lymphatic vessel formation leading to
      lymphedema.
    explanation: >-
      Some non-forkhead missense variants increase rather than decrease FOXC2
      transactivation, a caveat to a purely haploinsufficient model.
  - reference: PMID:33107170
    reference_title: Lymphedema distichiasis syndrome may be caused by FOXC2 promoter-enhancer dissociation and disruption of a topological associated domain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole genome amplified DNA from single sperm of the male proband,
      bead array analysis demonstrated that the FOXC2 gene was intact and the
      chromosome 16 breakpoint mapped to the same region 120Kb distal to the
      FOXC2 gene.
    explanation: >-
      A second translocation family shows that LDS can arise from a position
      effect on an intact FOXC2 gene.

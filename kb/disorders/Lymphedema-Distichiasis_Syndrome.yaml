- name: Spinal extradural arachnoid cyst
  category: Neurological
  description: >-
    Spinal extradural arachnoid cysts protrude into the epidural space through
    a dural defect and can compress the cord. All reported familial cases are
    associated with LDS, and a cyst can be the only manifestation in a FOXC2
    carrier. In one large family, 7 of 12 carriers had cysts on spinal MRI, but
    the frequency across families is unknown, so no frequency band is
    assigned. Syndromic cysts tend to be multiple and to extend beyond the
    thoracolumbar region.
  phenotype_term:
    preferred_term: Spinal extradural cyst
    term:
      id: HP:6000849
      label: Spinal extradural arachnoid cyst

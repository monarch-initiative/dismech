    reference_title: Clinical heterogeneity in lymphoedema-distichiasis with FOXC2 truncating mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FOXC2 mutations are highly penetrant with variable expressivity which is
      not explicable by the pattern of mutations.
    explanation: >-
      Seven families with truncating FOXC2 variants show high penetrance and
      variable expressivity.
  - reference: PMID:17372167
    reference_title: Mutations in FOXC2 are strongly associated with primary valve failure in veins of the lower limb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

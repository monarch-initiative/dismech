- name: Predominantly lower limb lymphedema
  category: Cardiovascular
  diagnostic: true
  description: >-
    Lymphedema confined to the lower limbs, with or without the external
    genitalia, typically appearing in late childhood or at puberty and often
    asymmetric. Severity varies within families. Males develop edema earlier
    and have more complications than females. Lymphedema is highly but not
    completely penetrant.
  phenotype_term:
    preferred_term: Lower limb lymphedema
    term:
      id: HP:0003550
      label: Predominantly lower limb lymphedema
    onset:
      onset_category: JUVENILE
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lymphedema typically appears in late childhood or puberty, is confined to
      the lower limbs with or without involvement of the external genitalia, and
      is often asymmetric; severity varies within families.
    explanation: >-
      GeneReviews describes the onset, distribution and variability of the
      lymphedema.
  - reference: PMID:12114478
    reference_title: Analysis of the phenotypic abnormalities in lymphoedema-distichiasis syndrome in 74 patients with FOXC2 mutations or linkage to 16q24.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of lymphoedema was highly penetrant. Males had an earlier
      onset of lymphoedema and a significantly increased risk of complications.
    explanation: >-
      Cohort of 74 patients showing high penetrance and earlier onset in males.
  - reference: PMID:39653349
    reference_title: "[Clinical features and genetic analysis of two Chinese pedigrees affected with Lymphedema-Distichiasis syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatal phenotypes were observed in 110 cases, mainly as distichiasis
      (87/110) and lymphedema (73/110).
    explanation: >-
      A pooled literature series of 117 patients records lymphedema in 73 of
      110 with postnatal features (66%); this is lower than the family-based
      estimate, so no frequency band is assigned.
  sequelae:
  - target: Cellulitis

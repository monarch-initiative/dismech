      participants with a FOXC2 mutation, including 3 without lymphedema.
    explanation: >-
      Three of 18 FOXC2 carriers had no lymphedema, so penetrance of the
      lymphedema is incomplete.
pathophysiology:
- name: FOXC2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift and other truncating FOXC2 variants, and a translocation
    breakpoint downstream of the gene that inactivates it by position effect,
    reduce the dose of active FOXC2, a forkhead-box transcription factor.
    Variants in the forkhead DNA-binding domain and central region reduce
    transactivation. A minority of missense variants outside the forkhead domain
    instead increase transactivation in reporter assays, so altered FOXC2
    activity in either direction can perturb lymphatic development, but loss of
    function is the established mechanism.

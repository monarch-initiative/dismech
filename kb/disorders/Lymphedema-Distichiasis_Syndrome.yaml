  - reference: PMID:11371511
    reference_title: Truncating mutations in FOXC2 cause multiple lymphedema syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven families were identified with mutations predicted to disrupt the

  description: >-
    The diagnosis is clinical when a proband has lymphedema and distichiasis,
    or one of these with a family history of the other. Otherwise a
    heterozygous pathogenic FOXC2 variant confirms it. A few families linked
    to the FOXC2 locus have no coding variant, consistent with regulatory or
    position-effect alleles.
  results: >-
    A heterozygous pathogenic FOXC2 variant.
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical diagnosis of LDS is established in a proband with either
      lymphedema and distichiasis, distichiasis and a family history of
      lower-limb lymphedema, or lower-limb lymphedema and a family history of
      distichiasis.
    explanation: >-
      GeneReviews clinical diagnostic criteria.
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If clinical findings are not diagnostic, the identification of a
      heterozygous FOXC2 pathogenic variant by molecular genetic testing
      confirms the diagnosis.
    explanation: >-
      GeneReviews molecular confirmation.
  - reference: PMID:15906099
    reference_title: "Lymphoedema-distichiasis and FOXC2: unreported mutations, de novo mutation estimate, families without coding mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two families with LD have no mutation in the coding region of FOXC2,
      although both are consistent with linkage to the FOXC2 locus.
    explanation: >-
      Coding-sequence testing can miss locus-linked families.
- name: Lymphoscintigraphy
  diagnosis_term:
    preferred_term: lymphoscintigraphy
    term:
      id: NCIT:C67262
      label: Lymphoscintigraphy
  description: >-
    Lymphatic imaging shows normal or increased numbers of lymphatic vessels
    with dysfunction, in contrast to the hypoplasia or aplasia of other primary
    lymphedemas.
  results: >-
    Normal or increased lymphatic vessel number rather than hypoplasia.
  evidence:
  - reference: PMID:12114478
    reference_title: Analysis of the phenotypic abnormalities in lymphoedema-distichiasis syndrome in 74 patients with FOXC2 mutations or linkage to 16q24.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphatic imaging confirmed the earlier suggestion that LD is associated
      with a normal or increased number of lymphatic vessels rather than the
      hypoplasia or aplasia seen in other forms of primary lymphoedema.
    explanation: >-
      Characteristic imaging finding in LDS.
- name: Venous duplex ultrasound
  diagnosis_term:
    preferred_term: duplex ultrasound of leg veins
    term:
      id: NCIT:C62781
      label: Doppler Ultrasound
  description: >-
    Color duplex ultrasound of the leg veins detects superficial and deep
    venous reflux, which is present even in carriers without lymphedema.
  results: >-
    Reflux in the great saphenous vein, often with deep vein reflux.
  evidence:
  - reference: PMID:17372167
    reference_title: Mutations in FOXC2 are strongly associated with primary valve failure in veins of the lower limb.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathological reflux was recorded by color Duplex ultrasound in all 18
      participants with a FOXC2 mutation, including 3 without lymphedema.
    explanation: >-
      Duplex ultrasound detects venous reflux in every carrier studied.
- name: Spinal MRI in FOXC2 carriers
  diagnosis_term:
    preferred_term: spinal magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Spinal MRI of all affected family members has been proposed so that
    extradural arachnoid cysts are found before they cause neurological
    damage and surgery can be timed.
  evidence:
  - reference: PMID:20535019
    reference_title: Spinal extradural arachnoid cysts in lymphedema-distichiasis syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that a follow-up protocol for lymphedema-distichiasis syndrome
      families should include spinal magnetic resonance imaging for all affected
      members so that the timing of surgery for removal of these cysts can be
      optimized.
    explanation: >-
      Recommendation from a family study with a high cyst frequency.
- name: Fetal echocardiography in at-risk pregnancies
  diagnosis_term:
    preferred_term: fetal echocardiography
    term:
      id: NCIT:C114079
      label: Fetal Echocardiography Test
  description: >-
    Fetal echocardiography is recommended for pregnancies at risk because of
    the increased risk of congenital heart disease, renal anomalies, cleft
    palate, hydrothorax and hydrops.
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Fetal echocardiography is recommended because of the increased risk for
      congenital heart disease, renal abnormalities, cleft palate, and
      hydrothoraces or hydrops fetalis.
    explanation: >-
      GeneReviews prenatal surveillance recommendation.
- name: Renal ultrasound at diagnosis
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  description: >-
    A baseline renal ultrasound at diagnosis has been proposed because of
    reported congenital renal anomalies.
  evidence:
  - reference: PMID:28544699
    reference_title: Renal anomalies and lymphedema distichiasis syndrome. A rare association?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that all individuals diagnosed with LDS should have a baseline
      renal ultrasound scan at diagnosis.
    explanation: >-
      Authors' recommendation based on two families.
treatments:
- name: Compression therapy
  description: >-
    Fitted compression garments and bandaging reduce swelling and discomfort.
    Starting hosiery before lymphedema develops may limit its extent. Diuretics
    are not effective for the lymphedema.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: compression therapy
    term:
      id: NCIT:C157735
      label: Compression Therapy
  target_mechanisms:
  - target: Predominantly lower limb lymphedema
    treatment_effect: MODULATES
    description: >-
      External compression limits interstitial fluid accumulation without
      correcting the valve defect.
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      fitted compression garments and bandaging to improve swelling and
      discomfort associated with edema
    explanation: >-
      GeneReviews management recommendation.
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The implementation of hosiery prior to the development of lymphedema may
      help reduce the extent of edema. Diuretics are not effective in the
      treatment of lymphedema.
    explanation: >-
      Supports early hosiery and records that diuretics do not help.
- name: Antibiotic treatment of cellulitis
  description: >-
    Good skin care and prompt treatment of infected skin lesions prevent
    secondary cellulitis, and cellulitis is treated promptly with antibiotics.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  target_mechanisms:
  - target: Cellulitis
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To prevent secondary cellulitis, good skin care and prompt treatment of
      infected skin lesions; prompt treatment of cellulitis with antibiotics.
    explanation: >-
      GeneReviews management of cellulitis.
- name: Cryotherapy or electrolysis of distichiatic lashes
  description: >-
    Symptomatic lashes are managed with lubrication and plucking, or removed by
    cryotherapy or electrolysis. These blind destructive procedures give
    poorer results than excision after lid splitting.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: eyelid cryotherapy
    term:
      id: NCIT:C40030
      label: Cryotherapy
  target_mechanisms:
  - target: Distichiasis
    treatment_effect: MODULATES
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lubrication, plucking, cryotherapy, electrolysis, or lid splitting for
      treatment of distichiasis
    explanation: >-
      GeneReviews treatment options for distichiasis.
  - reference: PMID:35325995
    reference_title: "Distichiasis: An update on etiology, treatment and outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The outcomes of electroepilation or direct cryotherapy are not as good as
      surgical excision of distichiatic lashes after splitting the anterior and
      posterior lamella under direct visualization.
    explanation: >-
      Review comparing outcomes of cryotherapy and electroepilation with lid
      splitting.
- name: Lid splitting with excision of distichiatic lashes
  description: >-
    Splitting the anterior and posterior lamellae of the lid and excising the
    aberrant lashes under direct vision gives better results than blind
    destructive procedures.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: eyelid splitting surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Distichiasis
    treatment_effect: MODULATES
  evidence:
  - reference: PMID:20301630
    reference_title: Lymphedema-Distichiasis Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lubrication, plucking, cryotherapy, electrolysis, or lid splitting for
      treatment of distichiasis
    explanation: >-
      GeneReviews lists lid splitting.
  - reference: PMID:35325995
    reference_title: "Distichiasis: An update on etiology, treatment and outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The outcomes of electroepilation or direct cryotherapy are not as good as
      surgical excision of distichiatic lashes after splitting the anterior and
      posterior lamella under direct visualization.
    explanation: >-
      Review supporting surgical excision after lid splitting.
animal_models:
- name: Foxc2 heterozygous knockout mouse
  species: Mouse
  genotype: Foxc2+/-
  publication: PMID:12719382
  modeled_mechanisms:
  - target: Lymphatic Reflux and Failure of Lymph Drainage
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Heterozygous mice reproduce the human genotype, lymphatic hyperplasia and
      retrograde lymph flow through incompetent valves.
    limitations: >-
      Heterozygous mice rarely develop hindlimb swelling, so the clinical
      lymphedema is only partly reproduced.
    evidence:
    - reference: PMID:12719382
      reference_title: FOXC2 haploinsufficient mice are a model for human autosomal dominant lymphedema-distichiasis syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Adult heterozygote mice characteristically exhibited a generalized
        lymphatic vessel and lymph node hyper plasia and rarely exhibited
        hindlimb swelling.
      explanation: >-
        Hyperplasia reproduced; swelling rare.
  - target: Meibomian Gland Lash Metaplasia
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      All heterozygous mice have distichiasis.
    evidence:
    - reference: PMID:12719382
      reference_title: FOXC2 haploinsufficient mice are a model for human autosomal dominant lymphedema-distichiasis syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We conclude that Foxc2 haploinsufficient mice mimic closely the
        distinctive lymphatic and ocular phenotype of LD patients.
      explanation: >-
        The authors conclude the model mimics the ocular phenotype.
- name: Foxc2 null mouse
  species: Mouse
  genotype: Foxc2-/-
  publication: PMID:15322537
  modeled_mechanisms:
  - target: Defective Lymphatic Valve Formation and Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Null embryos lack lymphatic valves and have excess pericyte coverage of
      lymphatic vessels.
    limitations: >-
      Homozygous loss is more severe than the human heterozygous state and is
      lethal, with cardiovascular and skeletal malformations.
    evidence:
    - reference: PMID:15322537
      reference_title: Defective valves and abnormal mural cell recruitment underlie lymphatic vascular failure in lymphedema distichiasis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We report that Foxc2(-/-) mice show abnormal lymphatic vascular
        patterning, increased pericyte investment of lymphatic vessels,
        agenesis of valves and lymphatic dysfunction.
      explanation: >-
        Valve agenesis in the null mouse.
- name: Lymphatic-specific inducible Foxc2 deletion mouse
  species: Mouse
  genotype: Inducible lymphatic endothelial Foxc2 conditional knockout
  publication: PMID:26389677
  modeled_mechanisms:
  - target: Defective Lymphatic Valve Formation and Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Postnatal deletion of Foxc2 in lymphatic endothelium causes valve
      regression and generalized lymphatic dysfunction.
    limitations: >-
      Complete deletion in adult lymphatics is lethal and more severe than the
      human heterozygous state.
    evidence:
    - reference: PMID:26389677
      reference_title: FOXC2 and fluid shear stress stabilize postnatal lymphatic vasculature.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In murine models, inducible deletion of Foxc2 within the lymphatic
        vasculature led to cell-cell junction defects, regression of valves, and
        focal vascular lumen collapse, which triggered generalized lymphatic
        vascular dysfunction and lethality.
      explanation: >-
        Valve regression after postnatal deletion.
differential_diagnoses:
- name: Milroy disease
  disease_term:
    preferred_term: Milroy disease
    term:
      id: MONDO:0007919
      label: lymphatic malformation 1
  description: >-
    FLT4-related congenital primary lymphedema presents at birth with lymphatic
    hypoplasia, whereas LDS usually begins at puberty, shows normal or
    increased lymphatic vessels and is accompanied by distichiasis. FOXC2
    variants can also be found in families classified clinically under other
    lymphedema syndromes.
  evidence:
  - reference: PMID:11371511
    reference_title: Truncating mutations in FOXC2 cause multiple lymphedema syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypes observed overlapped four phenotypically defined lymphedema
      syndromes.
    explanation: >-
      FOXC2 families overlap phenotypically with other primary lymphedema
      syndromes.
  - reference: PMID:18519967
    reference_title: Phenotypic characterization of primary lymphedema.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Phenotype characterization facilitates the identification of causative
      genes, as has been demonstrated with VEGFR3 and FOXC2, in Milroy's
      disease and lymphedema-distichiasis respectively.
    explanation: >-
      Distinguishes Milroy disease (VEGFR3) from LDS (FOXC2).
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population prevalence estimate is published. A UK group ascertained 34
    families and 11 sporadic cases and suggested the disorder is less rare
    than had been thought.
  evidence:
  - reference: PMID:15906099
    reference_title: "Lymphoedema-distichiasis and FOXC2: unreported mutations, de novo mutation estimate, families without coding mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder has been considered very rare, but our group has now
      ascertained 34 families and 11 sporadic cases in the UK.
    explanation: >-
      Rare, with a UK case series as the only quantitative indication.
references:
- reference: PMID:20301630
  title: Lymphedema-Distichiasis Syndrome.
  tags:
  - GeneReviews
notes: >-
  The GeneReviews chapter (PMID:20301630) is the phenotype baseline; every
  feature in its Clinical Characteristics abstract (lymphedema with genital
  involvement, distichiasis, corneal irritation, recurrent conjunctivitis,
  photophobia, varicose veins, ptosis, cellulitis, and the prenatal risks of
  congenital heart disease, renal anomalies, cleft palate and hydrops) is
  represented. Corneal irritation is described with conjunctivitis rather than
  as a separate phenotype. Webbed neck and scoliosis have been reported in
  single cases and are not curated. Ptosis is left without a causal in-link
  because no source proposes a mechanism linking it to FOXC2. No population
  prevalence figure exists.
  MONDO has no descendant subtypes of this term.

name: Lymphedema-Distichiasis Syndrome
creation_date: "2026-11-13T04:30:00Z"
description: >-
  Lymphedema-distichiasis syndrome (LDS) is an autosomal dominant primary
  lymphedema caused by heterozygous loss-of-function variants in FOXC2, which
  encodes a forkhead-box transcription factor expressed in lymphatic and venous
  valve endothelium, developing eyelids and other mesenchymal tissues. It is
  defined by lower-limb lymphedema, usually beginning in late childhood or at
  puberty and often asymmetric, together with distichiasis, an extra row of
  eyelashes arising from the orifices of the meibomian glands. Unlike the
  lymphatic hypoplasia of Milroy disease, LDS lymphatic vessels are normal or
  increased in number but functionally incompetent: FOXC2 deficiency prevents
  lymphatic valve formation and maintenance and allows abnormal smooth muscle
  coverage of lymphatic capillaries, so lymph refluxes and initial lymphatics
  fail to drain on dependency. FOXC2 haploinsufficiency also causes primary
  failure of superficial and deep leg vein valves, so early-onset varicose veins
  are the most frequent feature after distichiasis. Additional features include
  ptosis, corneal irritation, conjunctivitis and photophobia, recurrent
  cellulitis, and, less often, congenital heart disease, cleft palate, spinal
  extradural cysts, renal anomalies and fetal hydrops. Management is
  supportive: compression for the edema, prompt treatment of cellulitis, and
  ocular lubrication or removal of the aberrant lashes.
category: Mendelian
parents:
- lymphatic malformation
- syndromic disease
synonyms:
- lymphedema-distichiasis syndrome
- lymphoedema-distichiasis syndrome
- lymphedema-distichiasis
- LDS
- distichiasis-lymphedema syndrome
- hereditary lymphedema-distichiasis syndrome
- FOXC2-related lymphedema

  penetrance: INCOMPLETE
  expressivity: VARIABLE
  de_novo_rate: >-
    About 25% of affected individuals have a de novo FOXC2 variant; about 75%
    have an affected parent (GeneReviews).
  description: >-
    Heterozygous FOXC2 variants are transmitted as an autosomal dominant trait.
    Lymphedema and distichiasis are both highly but not completely penetrant:
    distichiasis is found in about 94% of carriers, and some carriers have no
    lymphedema although they still show venous reflux. Severity varies within
    families and is not predicted by the variant.

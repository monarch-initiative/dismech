    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Syndromic SEDAC tended to have multiple cysts out of the thoracolumbar
      area.
    explanation: >-
      Distinguishing imaging pattern of FOXC2-related cysts.

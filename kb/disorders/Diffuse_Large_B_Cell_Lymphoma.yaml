- accession: ega:EGAS00001002401
  title: Cell of origin-specific genetic alterations and chromosomal instability have therapeutic and immunologic impact in diffuse large B-cell lymphoma
  description: Diffuse large B-cell lymphoma (DLBCL), the most common lymphoma subtype worldwide, is a diverse disease with distinct molecular and clinical features in which ~40% of patients experience treatment failure. To understand the molecular distinctions and their therapeutic relevance specific to Cell-of-Origin (COO) in DLBCL, for the first time we performed an integrative genomic and transcriptomic analysis of biopsies from a large population registry-based cohort of uniformly treated patients with de novo DLBCL. We identified that NFATC1 amplification was significantly enriched in ABC-DLBCL with prognostic significance.

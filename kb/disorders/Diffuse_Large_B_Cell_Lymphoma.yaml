- accession: ega:EGAS00001001025
  title: Comprehensive miRNA Sequence Analysis Reveals Survival Differences in Diffuse Large B-cell Lymphoma Patients
  description: Diffuse large B-cell lymphoma (DLBCL) is an aggressive disease, with 30-40% of patients failing to achieve complete responses to standard therapy. miRNAs are RNA molecules that attenuate expression of their mRNA targets. To characterize the DLBCL miRNome, we sequenced miRNAs from 92 DLBCL and 15 benign centroblast fresh frozen samples and from 140 DLBCL formalin-fixed, paraffin-embedded tissue (FFPET) samples for validation.

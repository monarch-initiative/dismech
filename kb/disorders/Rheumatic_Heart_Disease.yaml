name: Rheumatic Heart Disease
creation_date: "2026-08-10T00:20:00Z"
category: Complex
disease_term:
  preferred_term: rheumatic heart disease
  term:
    id: MONDO:0006955
    label: rheumatic heart disease
description: >
  Permanent valvular heart damage following one or more episodes of acute rheumatic fever, itself
  a delayed non-suppurative autoimmune sequela of group A streptococcal infection in a genetically
  susceptible host. The organism is never found in the damaged valve, so this is an infection-triggered
  autoimmune disease rather than an infection of the valve. That distinction separates it from
  infective endocarditis and determines that effective treatment is prophylaxis against reinfection
  rather than treatment of the heart. It remains the leading cause of acquired heart disease in
  children worldwide and causes the highest disability burden of any cardiovascular disease in 10 to
  14 year olds, a distribution that follows poverty and crowding rather than any biological gradient.
parents:
- acquired valvular heart disease
- post-infectious autoimmune disease

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      Curated as the chronic valvular disease. The acute rheumatic fever episode that causes it is a
      multisystem illness with joint, neurological, and cutaneous features that fall outside this
      chapter; those manifestations are curated here as phenotypes of the acute phase because they
      are what establishes the diagnosis, not because they are cardiac.

pathophysiology:
- name: Group A streptococcal infection in a susceptible host
  biological_scale: ORGANISM
  description: >
    Pharyngeal infection with Streptococcus pyogenes is the initiating event. Skin infection is an
    increasingly recognised alternative portal in high-burden tropical settings. Susceptibility is
    conferred largely by HLA class II genotype, which determines which streptococcal and self
    peptides are presented to CD4-positive T cells, so the same exposure produces disease in some
    hosts and not others.
  downstream:
  - target: Molecular mimicry and cross-reactive immune priming
    causal_link_type: DIRECT
    description: >
      Antigens of the organism prime an immune response that does not distinguish them from host
      cardiac and connective tissue proteins.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute rheumatic fever (ARF) is an autoimmune disease caused by group A streptococcal infection."
    explanation: States the causal relationship between the streptococcal infection and the autoimmune illness that follows.

- name: Molecular mimicry and cross-reactive immune priming
  biological_scale: MOLECULAR
  description: >
    The group A carbohydrate epitope N-acetylglucosamine and the alpha-helical coiled-coil M protein
    structurally resemble human cardiac myosin and connective tissue proteins closely enough that
    antibodies and T cells raised against the organism bind host tissue. Which host protein is struck
    first is genuinely disputed and is curated as a controversy rather than as settled fact. The
    long-standing answer is cardiac myosin, but myosin is intracellular and therefore hard to reach,
    which motivates an alternative in which extracellular proteins are hit first.
  biological_processes:
  - preferred_term: inflammatory response to antigenic stimulus
    term:
      id: GO:0002437
      label: inflammatory response to antigenic stimulus
    modifier: INCREASED
  downstream:
  - target: Cross-reactive antibody binding and valve endothelial activation
    causal_link_type: DIRECT
    description: >
      Cross-reactive antibody binds the valve surface, whichever host protein it recognises first.
  evidence:
  - reference: PMID:16455580
    reference_title: "Molecular mimicry in the autoimmune pathogenesis of rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular mimicry is a hallmark of the pathogenesis of rheumatic fever where the streptococcal group A carbohydrate epitope, N-acetyl glucosamine, and the a-helical coiled-coil streptococcal M protein structurally mimic cardiac myosin in the human disease, rheumatic carditis"
    explanation: Names both mimicking epitopes and the canonical host target, which is the claim this node rests on.
  - reference: PMID:16455580
    reference_title: "Molecular mimicry in the autoimmune pathogenesis of rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both B- and T-cell responses are involved in the process, and evidence for the hypotheses of molecular mimicry and epitope spreading are reviewed."
    explanation: Establishes that both arms of adaptive immunity participate, which is why this entry curates a separate antibody node and T cell node rather than one combined immune node.

- name: Cross-reactive antibody binding and valve endothelial activation
  biological_scale: CELLULAR
  description: >
    Cross-reactive antibody binds valve endothelium and upregulates VCAM-1, converting the valve
    surface from a quiescent lining into an adhesive one. This is the step that recruits the cellular
    infiltrate; antibody alone does not destroy the valve.
  cell_types:
  - preferred_term: valve endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  downstream:
  - target: CD4-positive T cell infiltration of the valve
    causal_link_type: DIRECT
    description: >
      Adhesion molecule upregulation permits lymphocyte recruitment into a normally avascular tissue.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this mini review is to delineate the etiology and pathophysiological mechanisms underlying ARF and RHD."
    explanation: PARTIAL. The review covers this step, but its abstract states scope rather than the VCAM-1 finding itself, so this citation locates the mechanism in the literature without evidencing the specific adhesion molecule claim.

- name: CD4-positive T cell infiltration of the valve
  biological_scale: CELLULAR
  description: >
    CD4-positive T lymphocytes showing degenerate, cross-reactive antigen recognition infiltrate valve
    tissue and myocardium and are considered the prime effectors of valve destruction. Epitope
    spreading broadens the response with each recurrence, which is the mechanistic reason a second
    episode of rheumatic fever damages the valve more than the first, and why prophylaxis against
    reinfection is the whole of secondary prevention.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell mediated immunity
    term:
      id: GO:0002456
      label: T cell mediated immunity
    modifier: INCREASED
  downstream:
  - target: Acute valvulitis with Aschoff body formation
    causal_link_type: DIRECT
    description: >
      Sustained lymphocytic and macrophage infiltration organises into the characteristic lesion.
  evidence:
  - reference: PMID:16455580
    reference_title: "Molecular mimicry in the autoimmune pathogenesis of rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have unraveled the potential pathogenic mechanisms by which the immune response against the group A streptococcus attacks the rheumatic valve leading to chronic rheumatic heart disease."
    explanation: States that the immune response attacks the valve and that this is what produces the chronic disease, which is the causal role this node occupies.

- name: Acute valvulitis with Aschoff body formation
  biological_scale: TISSUE
  description: >
    The histological signature of active carditis, consisting of granulomatous foci of central
    fibrinoid necrosis ringed by lymphocytes, plasma cells, and macrophages, including the Anitschkow
    cells whose linear chromatin gives them their caterpillar appearance. The Aschoff body is a
    pathological structure formed de novo and so is conceptually an Xogenesis lesion, but it is
    deliberately not curated as conforming to the granuloma_formation module. That module models
    containment of an indigestible persistent stimulus by macrophage fusion, and here there is no
    organism in the tissue to contain.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  downstream:
  - target: Chronic valve fibrosis, commissural fusion, and calcification
    causal_link_type: DIRECT
    description: >
      Repeated or persistent inflammation converts reversible valvulitis into fixed scar.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent episodes of ARF can lead to rheumatic heart disease (RHD)"
    explanation: PARTIAL. Supports the acute to chronic transition this node sits on, but does not itself describe the Aschoff body, which is drawn from textbook histopathology and is not separately evidenced here.

- name: Chronic valve fibrosis, commissural fusion, and calcification
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >
    Leaflet thickening, neovascularisation of a normally avascular tissue, fusion of the commissures,
    and dystrophic calcification convert inflammation into fixed stenosis, regurgitation, or both.
    This is the point of no return, since everything upstream is in principle reversible and nothing
    from here on is. The mitral valve is affected most often and most severely, then the aortic, an
    asymmetry conventionally attributed to the higher shear stress on left-sided valves.
  cell_types:
  - preferred_term: valve interstitial cell
    term:
      id: CL:4030032
      label: valve interstitial cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  locations:
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  downstream:
  - target: Valvular stenosis and regurgitation with hemodynamic overload
    causal_link_type: DIRECT
    description: >
      Fixed structural valve deformity imposes a pressure or volume load on the chambers upstream.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrent episodes of ARF can lead to rheumatic heart disease (RHD), which is the leading cause of cardiovascular mortality in children worldwide, especially in low- and middle-income countries."
    explanation: States that the recurrent acute episodes produce the chronic disease this node represents, and names its consequence.

- name: Valvular stenosis and regurgitation with hemodynamic overload
  biological_scale: ORGANISM
  description: >
    Mitral regurgitation appears first, mitral stenosis later as leaflets thicken and commissures
    fuse. The resulting left atrial enlargement, pulmonary venous congestion, and ventricular volume
    or pressure overload account for essentially all the downstream clinical disease.
  downstream:
  - target: Atrial fibrillation and cardioembolic risk
    causal_link_type: DIRECT
    description: >
      Left atrial enlargement from mitral disease creates the substrate for atrial fibrillation.
  - target: Congestive heart failure
    causal_link_type: DIRECT
    description: >
      Chronic volume or pressure overload culminates in ventricular failure.
  - target: Pulmonary venous congestion and pulmonary hypertension
    causal_link_type: DIRECT
    description: >
      Mitral stenosis raises left atrial pressure, which is transmitted backwards into the
      pulmonary venous circulation.

- name: Pulmonary venous congestion and pulmonary hypertension
  biological_scale: ORGANISM
  conforms_to: "pulmonary_vascular_remodeling#Obstructive Pulmonary Vascular Remodeling"
  description: >
    Sustained elevation of left atrial pressure in mitral stenosis is transmitted back through the
    pulmonary veins, and chronic passive congestion eventually produces reactive remodelling of the
    pulmonary arterioles. This is post-capillary pulmonary hypertension arising from a mechanical
    upstream cause, so conformance is declared at the remodelling node only and not at the
    module's endothelial and BMPR2 trigger nodes, which model a primary pulmonary arteriopathy.
    The consequence is right ventricular pressure loading, which is how a left-sided valve lesion
    ends in right heart failure.
  downstream:
  - target: Right heart failure
    causal_link_type: DIRECT
    description: >
      Chronically raised pulmonary vascular resistance loads the right ventricle.

- name: Right heart failure
  biological_scale: ORGANISM
  description: >
    Raised jugular venous pressure, hepatic congestion, ascites, and peripheral oedema, arising
    from right ventricular pressure loading rather than from any right-sided valve lesion. Curated
    separately from left-sided congestive failure because the mechanism and the clinical picture
    differ.

- name: Atrial fibrillation and cardioembolic risk
  biological_scale: ORGANISM
  description: >
    Atrial fibrillation here is structural, arising from left atrial enlargement, and is deliberately
    not curated as conforming to cardiac_ion_channel_repolarization. That module models a primary
    channelopathy in a structurally normal heart, which is the opposite of the situation here. The
    distinction is not academic, because it is why this population needs a vitamin K antagonist rather
    than a direct oral anticoagulant, a question settled by trial and against expectation.
  downstream:
  - target: Congestive heart failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Loss of atrial contribution and rate irregularity worsen an already loaded ventricle.
  evidence:
  - reference: PMID:36036525
    reference_title: "Rivaroxaban in Rheumatic Heart Disease-Associated Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among patients with rheumatic heart disease-associated atrial fibrillation, vitamin K antagonist therapy led to a lower rate of a composite of cardiovascular events or death than rivaroxaban therapy, without a higher rate of bleeding."
    explanation: The INVICTUS result, which establishes that this form of atrial fibrillation behaves differently from nonvalvular atrial fibrillation and is the strongest evidence that it should be modelled as a distinct structural entity.

- name: Congestive heart failure
  biological_scale: ORGANISM
  description: >
    The usual presenting syndrome, because chronic rheumatic heart disease is frequently silent until
    it decompensates. That latency is what motivates echocardiographic screening programmes in endemic
    populations.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "which is the leading cause of cardiovascular mortality in children worldwide"
    explanation: PARTIAL. Establishes that the disease is lethal but does not name heart failure as the mechanism of death.

phenotypes:
- category: Clinical
  name: Mitral regurgitation
  description: >
    The earliest and most common valvular lesion, present before stenosis develops.
  phenotype_term:
    preferred_term: Mitral regurgitation
    term:
      id: HP:0001653
      label: Mitral regurgitation
  evidence:
  - reference: PMID:22371105
    reference_title: "World Heart Federation criteria for echocardiographic diagnosis of rheumatic heart disease--an evidence-based guideline."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Systematic differences in the reporting of and diagnostic approach to RHD exist, reflecting differences in local experience and disease patterns."
    explanation: PARTIAL. Establishes that the diagnostic approach to these valvular lesions needed standardising, which is context for the lesion rather than evidence of its frequency; the cached abstract does not rank the valve lesions.

- category: Clinical
  name: Mitral stenosis
  description: >
    Develops later than regurgitation, from progressive leaflet thickening and commissural fusion. It
    is the lesion that produces left atrial enlargement, and therefore the atrial fibrillation and
    stroke risk.
  phenotype_term:
    preferred_term: Mitral stenosis
    term:
      id: HP:0001718
      label: Mitral stenosis

- category: Clinical
  name: Aortic regurgitation
  description: >
    The second most commonly involved valve, usually alongside mitral disease and rarely in isolation.
  phenotype_term:
    preferred_term: Aortic regurgitation
    term:
      id: HP:0001659
      label: Aortic regurgitation

- category: Clinical
  name: Atrial fibrillation
  description: >
    Arises from left atrial enlargement in mitral disease and is the main driver of thromboembolic
    stroke risk.
  phenotype_term:
    preferred_term: Atrial fibrillation
    term:
      id: HP:0005110
      label: Atrial fibrillation
  evidence:
  - reference: PMID:36036525
    reference_title: "Rivaroxaban in Rheumatic Heart Disease-Associated Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 4565 enrolled patients, 4531 were included in the final analysis. The mean age of the patients was 50.5 years, and 72.3% were women."
    explanation: A trial of 4531 patients defined by rheumatic heart disease with atrial fibrillation establishes the association at scale, and incidentally documents the striking female predominance of this disease.

- category: Clinical
  name: Congestive heart failure
  description: >
    Frequently the presenting feature, since the chronic disease is usually asymptomatic until
    decompensation.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure

- category: Clinical
  name: Stroke
  description: >
    Cardioembolic, arising from atrial fibrillation or valve-associated thrombus. It is the
    complication that makes anticoagulation choice consequential in this population.
  phenotype_term:
    preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
  evidence:
  - reference: PMID:36036525
    reference_title: "Rivaroxaban in Rheumatic Heart Disease-Associated Atrial Fibrillation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "vitamin K antagonist therapy led to a lower rate of a composite of cardiovascular events or death than rivaroxaban therapy"
    explanation: PARTIAL. Stroke is a component of the composite endpoint rather than separately reported in this abstract, so this supports the embolic risk without quantifying stroke alone.

- category: Clinical
  name: Post-capillary pulmonary hypertension
  description: >
    Pulmonary hypertension arising from chronic left atrial pressure elevation in mitral stenosis,
    and the route by which a left-sided valve lesion produces right heart failure. It is bound to
    the post-capillary term rather than to pulmonary arterial hypertension deliberately: the latter
    is the pre-capillary Group 1 entity, which is precisely what this is not, and binding it would
    make the machine-readable slot contradict the prose.
  phenotype_term:
    preferred_term: Post-capillary pulmonary hypertension
    term:
      id: HP:0033635
      label: Post-capillary pulmonary hypertension

- category: Clinical
  name: Migratory polyarthritis
  description: >
    An acute rheumatic fever manifestation rather than a feature of the chronic valvular disease.
    Classically large-joint, fleeting, asymmetric, and strikingly aspirin-responsive.
  phenotype_term:
    preferred_term: Arthritis
    term:
      id: HP:0001369
      label: Arthritis
    temporality: ACUTE

- category: Neurologic
  name: Sydenham chorea
  description: >
    A delayed neurological manifestation appearing one to eight months after the streptococcal
    infection, long after the other features have resolved, which is why it is accepted on its own as
    presumptive evidence of acute rheumatic fever. Most affected individuals have concurrent cardiac
    involvement.
  phenotype_term:
    preferred_term: Chorea
    term:
      id: HP:0002072
      label: Chorea

- category: Clinical
  name: Subcutaneous nodules
  description: >
    Firm painless nodules over extensor surfaces. Uncommon, but they almost always accompany carditis,
    which makes them a useful clinical marker of cardiac involvement.
  phenotype_term:
    preferred_term: Subcutaneous nodule
    term:
      id: HP:0001482
      label: Subcutaneous nodule

- category: Clinical
  name: Fever
  description: >
    A minor Jones criterion during the acute episode.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
    temporality: ACUTE

genetic:
- name: HLA-DQB1
  gene_term:
    preferred_term: HLA-DQB1
    term:
      id: hgnc:4944
      label: HLA-DQB1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    The class II signal in the South Asian genome-wide association study, and a susceptibility
    allele rather than a pathogenic variant. It is curated with an explicit caveat: this signal did
    not reach genome-wide significance and was the third strongest in that study, behind the class
    III and class I signals. The mechanism by which class II variation acts is the one this entry
    already models, namely which streptococcal and self peptides are presented to CD4-positive T
    cells.
  evidence:
  - reference: PMID:32488134
    reference_title: "The Human Leukocyte Antigen Locus and Rheumatic Heart Disease Susceptibility in South Asians and Europeans."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The second and third strongest signals were found in the class I (HLA-B, rs3819306, P = 1.91×10−7) and class II (HLA-DQB1, rs28724238, P = 7.77×10−7) regions, respectively."
    explanation: Locates the class II signal at HLA-DQB1 specifically. PARTIAL because at P = 7.77 x 10 to the minus 7 it falls short of genome-wide significance and ranks third in this study, so it supports a contributory role rather than an established one.

- name: HLA-DRB1
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    A class II allele showing the most consistent associations across African, South Asian, and Latin
    American cohorts, though the specific risk alleles differ by ancestry.
  evidence:
  - reference: PMID:24581333
    reference_title: "Rheumatic heart disease in Uganda: the association between MHC class II HLA DR alleles and disease: a case control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study compares the frequency of HLA class II DR alleles between RHD cases and normal controls in Uganda."
    explanation: States the design that produced the HLA-DR association, in a sub-Saharan African population where the disease burden is high.

inheritance:
- name: Polygenic susceptibility
  description: >
    Not Mendelian. Susceptibility is polygenic, dominated by HLA class II and class III variation with
    contributions from the immunoglobulin heavy chain locus, and it acts only in combination with the
    environmental exposure. No genetic test is used in management.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:32488134
    reference_title: "The Human Leukocyte Antigen Locus and Rheumatic Heart Disease Susceptibility in South Asians and Europeans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest the class III region is a key determinant of RHD susceptibility offering important new insight into pathogenesis while partly explaining the inconsistency of earlier reports."
    explanation: Establishes the disease as a susceptibility trait mapped by population association rather than by Mendelian segregation, and notes that earlier reports were inconsistent, which is why this entry curates the inheritance as polygenic rather than naming specific risk alleles.

environmental:
- name: Household crowding and poverty
  exposure_term:
    preferred_term: exposure to adverse socioeconomic factors
    term:
      id: ECTO:6000028
      label: exposure to socioeconomic factors
  description: >
    The dominant determinant of who develops this disease. Crowding drives streptococcal transmission,
    and poverty drives both untreated pharyngitis and failure of secondary prophylaxis. The geographic
    and Indigenous-population disparity in burden is explained by these factors rather than by any
    biological gradient, which is why this entry treats them as mechanism rather than as background.
  influences_mechanisms:
  - target: Group A streptococcal infection in a susceptible host
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >
      Crowding raises the rate of streptococcal transmission and therefore of the initiating infection.
    evidence:
    - reference: PMID:15927077
      reference_title: "Antibiotics for the primary prevention of acute rheumatic fever: a meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Rheumatic fever continues to put a significant burden on the health of low socio-economic populations in low and middle-income countries despite the near disappearance of the disease in the developed world over the past century."
      explanation: Documents the socioeconomic concentration of the disease and its disappearance from wealthy countries, which is the strongest available evidence that the determinant is social rather than biological. PARTIAL because it is an observed distribution rather than a measured exposure effect.
  evidence:
  - reference: PMID:15927077
    reference_title: "Antibiotics for the primary prevention of acute rheumatic fever: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Rheumatic fever continues to put a significant burden on the health of low socio-economic populations in low and middle-income countries despite the near disappearance of the disease in the developed world over the past century."
    explanation: >
      Establishes that the disease is concentrated in low socio-economic populations and has all but
      vanished from wealthy countries, which is the association this exposure entry asserts. PARTIAL
      because it reports where the disease occurs rather than measuring an effect of crowding or of
      poverty.
  notes: >
    ECTO:6000028 (exposure to socioeconomic factors) is bound as the closest available term. It
    covers the poverty dimension but not household crowding, for which the exposure hierarchy has no
    term, so this entry's name is deliberately broader than its binding. An earlier version of this
    note said no term was bound; the binding was added afterwards, by the #8430 exposure-binding
    sweep, which did not revisit the note.

experimental_models:
- name: Lewis rat autoimmune valvulitis model
  description: >
    The principal animal model, produced by immunising Lewis rats with streptococcal M protein or
    cardiac myosin. It reproduces the valvulitis and the cross-reactive immune response, which is what
    established molecular mimicry as more than an observation about sequence similarity. It is
    explicitly the subject of a published discussion of what a robust model of this disease would have
    to demonstrate, which is a fair signal that the existing models are not considered settled.
  experimental_model_type: OTHER
  organism:
    preferred_term: Norway rat
    term:
      id: NCBITaxon:10116
      label: Rattus norvegicus
  modeled_mechanisms:
  - target: Molecular mimicry and cross-reactive immune priming
    description: >
      Immunisation with M protein or cardiac myosin reproduces the cross-reactive response.
  - target: Acute valvulitis with Aschoff body formation
    description: >
      The model develops valvulitis, the acute lesion of this disease.
  publication: PMID:25414841
  evidence:
  - reference: PMID:25414841
    reference_title: "Animal models to investigate the pathogenesis of rheumatic heart disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Antibody and T cell responses to recombinant GAS M protein (rM) and the subsequent interactions with cardiac tissue have been predominantly investigated using a rat autoimmune valvulitis model."
    explanation: Names this model as the principal system used to study the antibody and T cell responses that this entry curates as separate mechanism nodes.
  - reference: PMID:34026876
    reference_title: "Requirements for a Robust Animal Model to Investigate the Disease Mechanism of Autoimmune Complications Associated With ARF/RHD."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Disease complications triggered by Group A streptococcal (GAS) infection are confined to human and determining the early events leading to pathology requires a robust animal model that reflects the hallmark features of the disease."
    explanation: PARTIAL, and included precisely because it is a statement of inadequacy. The disease is confined to humans, and a paper arguing that a robust model is still required is itself evidence that the existing ones fall short.

treatments:
- name: Benzathine penicillin G secondary prophylaxis
  description: >
    The cornerstone of management, and the only intervention that alters the natural history. It works
    by preventing reinfection and therefore recurrence, not by treating the heart at all. It is given
    as a deep intramuscular injection every three to four weeks for a minimum of five years, often to
    age 21 or for ten years after the episode. The burden of that regimen, monthly painful injections
    in adolescents who feel well, is the principal reason real-world adherence is poor, and adherence
    rather than efficacy is the limiting factor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Group A streptococcal infection in a susceptible host
    treatment_effect: INHIBITS
    description: >
      Prophylaxis acts on the initiating infection, upstream of every immunological step in this entry.
      Nothing downstream of the valve scar is reversible, which is why the only effective point of
      attack is the trigger.
    evidence:
    - reference: PMID:15927077
      reference_title: "Antibiotics for the primary prevention of acute rheumatic fever: a meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fixed effects, meta-analysis revealed an overall protective effect for the use of antibiotics against acute rheumatic fever of 70% (RR = 0.32; 95% CI = 0.21-0.48)."
      explanation: Quantifies the protective effect of treating the streptococcal infection on the incidence of rheumatic fever, which is the causal link this treatment edge asserts.
  evidence:
  - reference: PMID:15927077
    reference_title: "Antibiotics for the primary prevention of acute rheumatic fever: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibiotics appear to be effective in reducing the incidence of acute rheumatic fever following an episode of suspected GAS pharyngitis. This effect may be achieved at relatively low cost if a single intramuscular penicillin injection is administered."
    explanation: The authors' conclusion, including the cost point that makes this the intervention of choice in the settings where the disease actually occurs.
  - reference: PMID:15927077
    reference_title: "Antibiotics for the primary prevention of acute rheumatic fever: a meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the included trials were conducted during the period of 1950 and 1961 and in 8 of the 10 trials the study population consisted of young adult males living on United States military bases."
    explanation: PARTIAL, and an important qualification. The evidence base for the central preventive intervention is seventy-year-old trials in young American servicemen, a population with almost nothing in common with the children in whom the disease now occurs.

- name: Anti-inflammatory therapy for acute carditis
  description: >
    Aspirin or corticosteroids are given for symptomatic relief of the acute episode. They do not
    protect the valve. This is curated because the negative result matters. The intuitive assumption is
    that suppressing the inflammation which is destroying the valve should preserve it, and the trial
    evidence does not support that. The evidence is old and at substantial risk of bias, so this is a
    failure to demonstrate benefit rather than a demonstration of futility.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
  target_mechanisms:
  - target: Acute valvulitis with Aschoff body formation
    treatment_effect: INHIBITS
    description: >
      The rationale is suppression of the valvular inflammation before it becomes scar.
    evidence:
    - reference: PMID:26017576
      reference_title: "Anti-inflammatory treatment for carditis in acute rheumatic fever."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Little evidence of benefit was found when corticosteroids or intravenous immunoglobulins were used to reduce the risk of heart valve lesions in patients with acute rheumatic fever."
      explanation: Refutes the proposition that suppressing acute inflammation preserves the valve, which is the claim this treatment edge would otherwise assert.
  evidence:
  - reference: PMID:26017576
    reference_title: "Anti-inflammatory treatment for carditis in acute rheumatic fever."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The antiquity of most of the trials restricted adequate statistical analysis of the data and acceptable assessment of clinical outcomes by current standards. In addition, risk of bias was substantial, so results should be viewed with caution."
    explanation: The reviewers' own caveat, which is why this is curated as absence of demonstrated benefit rather than as established futility.
  - reference: PMID:26017576
    reference_title: "Anti-inflammatory treatment for carditis in acute rheumatic fever."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Six trials were conducted between 1950 and 1965; one was done in 1990 and the final study was published in 2001."
    explanation: PARTIAL. Dates the evidence base, which is the substance of the caveat above.

- name: Vitamin K antagonist anticoagulation
  description: >
    Warfarin, with a target INR of 2 to 3, for atrial fibrillation or a mechanical valve. This is one
    of the few places in modern cardiology where the older drug won a head-to-head trial. Direct oral
    anticoagulants are standard for nonvalvular atrial fibrillation, and in this population they were
    worse. That result is the practical payoff of modelling rheumatic atrial fibrillation as a
    structural rather than an electrical disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: warfarin
      term:
        id: CHEBI:10033
        label: warfarin
  target_mechanisms:
  - target: Atrial fibrillation and cardioembolic risk
    treatment_effect: INHIBITS
    description: >
      Anticoagulation addresses the thromboembolic consequence, not the arrhythmia or the valve.
    evidence:
    - reference: PMID:36036525
      reference_title: "Rivaroxaban in Rheumatic Heart Disease-Associated Atrial Fibrillation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "vitamin K antagonist therapy led to a lower rate of a composite of cardiovascular events or death than rivaroxaban therapy, without a higher rate of bleeding"
      explanation: Establishes vitamin K antagonism as superior in this specific population, with no bleeding penalty.
  evidence:
  - reference: PMID:36036525
    reference_title: "Rivaroxaban in Rheumatic Heart Disease-Associated Atrial Fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Permanent discontinuation of trial medication was more common with rivaroxaban than with vitamin K antagonist therapy at all visits."
    explanation: A secondary finding that complicates the simple reading of the result, since differential discontinuation is itself a candidate explanation for the difference in outcome.

- name: Low-molecular-weight heparin anticoagulation in pregnancy
  description: >
    Pregnancy is the period of highest thromboembolic risk in a woman with a prosthetic valve, and
    it is also when warfarin cannot be used, because it crosses the placenta and is teratogenic in
    the first trimester. Low-molecular-weight heparin is the usual substitute and remains an
    off-label indication without an agreed regimen, which is a substantial evidence gap in a
    disease whose population is overwhelmingly young women. The modality is recorded as OTHER
    rather than SMALL_MOLECULE, since a low-molecular-weight heparin is a sulfated polysaccharide
    rather than a small molecule in the usual sense.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Valvular stenosis and regurgitation with hemodynamic overload
    treatment_effect: INHIBITS
    description: >
      The thromboembolic risk this addresses arises from the prosthetic valve implanted to treat
      the valvular lesion, so the edge is drawn to the valve node rather than to atrial
      fibrillation. The cited study is specifically about women with prosthetic valve replacement,
      and attributing it to the arrhythmia would misstate what was measured.
  evidence:
  - reference: PMID:35464573
    reference_title: "The Safety and Efficacy of Low-Molecular-Weight Heparin in Pregnant Women With Rheumatic Heart Disease and Prosthetic Valve Replacement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with rheumatic heart disease (RHD) and prosthetic valve replacement, the risk of thromboembolic complications is the highest during and immediately after pregnancy."
    explanation: Establishes pregnancy as the period of peak thromboembolic risk in this population, which is why the anticoagulation question is acute here.
  - reference: PMID:35464573
    reference_title: "The Safety and Efficacy of Low-Molecular-Weight Heparin in Pregnant Women With Rheumatic Heart Disease and Prosthetic Valve Replacement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of low-molecular-weight heparin (LMWH) remains an off-label indication."
    explanation: PARTIAL, and recorded because it is a limitation rather than a result. The standard of care in the highest-risk period of this disease rests on off-label use.
  - reference: PMID:35464573
    reference_title: "The Safety and Efficacy of Low-Molecular-Weight Heparin in Pregnant Women With Rheumatic Heart Disease and Prosthetic Valve Replacement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LMWH is both safe and effective in preventing major thromboembolic complications compared to other forms of anticoagulation used during pregnancy."
    explanation: The efficacy finding itself, from what its authors describe as the largest retrospective series of anticoagulation options in this specific population. It is retrospective, which is why the off-label caveat above is retained alongside it.

- name: Percutaneous balloon mitral valvuloplasty
  description: >
    Mechanical relief of rheumatic mitral stenosis in suitable valves, meaning those that are not
    calcified and not significantly regurgitant. It is less invasive and cheaper than surgery, which
    matters disproportionately in the settings where this disease actually occurs.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Valvular stenosis and regurgitation with hemodynamic overload
    treatment_effect: BYPASSES
    description: >
      Splitting the fused commissures relieves the obstruction without addressing the scar itself.

- name: Mitral valve repair or replacement
  description: >
    Required for advanced, calcified, or regurgitant disease. Repair outperforms replacement where
    anatomically feasible. Mechanical replacement commits a young patient to lifelong anticoagulation,
    with the accumulating risks of thromboembolism, haemorrhage, perivalvular leak, and prosthetic
    endocarditis, which is a heavy long-term cost in the adolescents and young adults who make up much
    of this population.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Valvular stenosis and regurgitation with hemodynamic overload
    treatment_effect: BYPASSES
    description: >
      Replacing or repairing the valve restores competent flow without reversing the disease process.

diagnosis:
- name: Echocardiography using World Heart Federation criteria
  description: >
    The central diagnostic modality for chronic disease, and the basis of screening for latent disease
    in endemic populations. The criteria classify findings as definite, borderline, or normal, and were
    written specifically to standardise detection of subclinical disease so that people can be enrolled
    in prophylaxis before they become symptomatic.
  evidence:
  - reference: PMID:22371105
    reference_title: "World Heart Federation criteria for echocardiographic diagnosis of rheumatic heart disease--an evidence-based guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over the past 5 years, the advent of echocardiographic screening for rheumatic heart disease (RHD) has revealed a higher RHD burden than previously thought."
    explanation: States what echocardiographic screening actually established, namely that the burden is larger than clinical detection had suggested, which is the reason these criteria exist.

- name: Evidence of antecedent streptococcal infection
  description: >
    Throat culture or rapid antigen testing for the acute infection, and anti-streptolysin O and
    anti-DNase B titres for antecedent infection. This is a mandatory element of the Jones
    criteria, not a supporting investigation, because the entire causal claim of the disease rests
    on a preceding streptococcal infection that has usually resolved by the time the patient
    presents.

- name: Revised Jones criteria
  description: >
    The clinical diagnostic framework for the acute episode, revised in 2015 to stratify by population
    risk, to incorporate Doppler echocardiography for subclinical carditis, and to accept isolated
    chorea as presumptive disease. The risk stratification is unusual and worth noting, because the
    same findings mean different things depending on the local incidence, which is an explicit
    acknowledgement that pretest probability differs enormously between populations.
  evidence:
  - reference: PMID:25908771
    reference_title: "Revision of the Jones Criteria for the diagnosis of acute rheumatic fever in the era of Doppler echocardiography: a scientific statement from the American Heart Association."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The goal of this statement was to review the historic Jones criteria used to diagnose acute rheumatic fever in the context of the current epidemiology of the disease and to update those criteria to also take into account recent evidence supporting the use of Doppler echocardiography in the diagnosis of carditis as a major manifestation of acute rheumatic fever."
    explanation: States the purpose of the revision and, specifically, the elevation of Doppler-detected carditis to a major manifestation, which is the substantive change this diagnostic entry describes.

progression:
- phase: Acute rheumatic fever
  notes: >
    The acute multisystem episode, typically at age five to fourteen, with carditis, migratory
    arthritis, chorea, and skin manifestations in varying combination. Valvulitis at this stage is
    in principle reversible.
- phase: Latent chronic valve disease
  notes: >
    Often clinically silent for years while fibrosis progresses, which is the reason
    echocardiographic screening exists in endemic populations and the reason the disease is
    frequently first diagnosed at the point of decompensation.
- phase: Progression by severity at diagnosis
  notes: >
    Severity at diagnosis is the dominant prognostic determinant, and the trajectories diverge
    sharply. Severe disease is close to a surgical diagnosis; mild disease is mostly stable but
    not benign, since a tenth still progress to severe.
  evidence:
  - reference: PMID:28255075
    reference_title: "Rheumatic Heart Disease Severity, Progression and Outcomes: A Multi-State Model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 96 (16.2%) patients with severe RHD at diagnosis, 50% had proceeded to valve surgery by 2 years, and 10% were dead within 6 years."
    explanation: Quantifies the trajectory of severe disease at diagnosis with counted denominators from a register-based cohort of 591 patients.
  - reference: PMID:28255075
    reference_title: "Rheumatic Heart Disease Severity, Progression and Outcomes: A Multi-State Model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with mild RHD at diagnosis were the most stable, with 64% remaining mild after 10 years; however, 11.4% progressed to severe RHD and half of these required surgery."
    explanation: Quantifies the mild-disease trajectory, including the minority who progress, which is what makes surveillance of mild disease worthwhile rather than reassuring.
- phase: Decompensation and surgery
  notes: >
    Heart failure, atrial fibrillation with embolic risk, and the need for valve intervention. In
    the cohort above the prognosis of young Indigenous Australians with severe disease is described
    by its authors as bleak, with the explicit conclusion that only earlier detection and treatment
    will change it.
  evidence:
  - reference: PMID:28255075
    reference_title: "Rheumatic Heart Disease Severity, Progression and Outcomes: A Multi-State Model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prognosis of young Indigenous Australians diagnosed with severe RHD is bleak; interventions must focus on earlier detection and treatment if the observed natural history is to be improved."
    explanation: The authors' own conclusion, which is also the argument for the screening programmes curated in the diagnosis section.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >
    Concentrated in low- and middle-income countries and in Indigenous populations of wealthy ones.
    The class here is deliberately coarse, because no cited source in this entry states a rate.
  evidence:
  - reference: PMID:40276383
    reference_title: "A mini review of the pathogenesis of acute rheumatic fever and rheumatic heart disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "which is the leading cause of cardiovascular mortality in children worldwide, especially in low- and middle-income countries"
    explanation: PARTIAL. Establishes the global burden and its distribution, but states a rank rather than a rate, so the prevalence class is coarse and no numeric figure is asserted.

biochemical:
- name: Anti-streptolysin O titre
  presence: INCREASED
  notes: >
    Serological evidence of antecedent group A streptococcal infection, which is a mandatory
    requirement of the Jones criteria rather than an optional supporting test. Sensitivity is
    roughly eighty percent, so it is paired with anti-DNase B; the two together detect
    substantially more antecedent infections than either alone. A rising or falling paired titre is
    more informative than a single value, because the organism has usually gone by the time the
    illness appears.

- name: Anti-DNase B titre
  presence: INCREASED
  notes: >
    The complementary streptococcal antibody, with sensitivity around ninety percent, and
    particularly useful when the antecedent infection was cutaneous rather than pharyngeal.

- name: C-reactive protein
  presence: INCREASED
  notes: >
    An acute-phase reactant and a minor Jones criterion. It is non-specific, and its role is to
    corroborate active inflammation during the acute episode rather than to diagnose the disease.

- name: Erythrocyte sedimentation rate
  presence: INCREASED
  notes: >
    The other acute-phase minor criterion, used alongside C-reactive protein to document ongoing
    inflammation and to follow its resolution.

differential_diagnoses:
- name: Infective endocarditis
  description: >
    The critical distinction, and it runs in both directions. Infective endocarditis is an infection of
    the valve requiring prolonged antimicrobial therapy, whereas rheumatic heart disease is an
    autoimmune sequela in which the organism is absent from the valve. The two are also linked, because
    a rheumatic valve is a substrate on which infective endocarditis subsequently develops.
- name: Juvenile idiopathic arthritis
  description: >
    Shares the migratory arthritis of the acute episode. The distinguishing features are streptococcal
    serology, the exquisite aspirin responsiveness, and the presence of carditis.
- name: Nonvalvular atrial fibrillation
  description: >
    Not a differential for the disease itself but for its management. Treating rheumatic atrial
    fibrillation as though it were nonvalvular leads to the choice of a direct oral anticoagulant,
    which the INVICTUS trial showed to be inferior here.

discussions:
- discussion_id: initial_autoantigen_disputed
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Is cardiac myosin the initial target of the cross-reactive immune response, or is it reached only
    after extracellular proteins have been damaged first?
  rationale: >
    The textbook account, well supported by sequence mimicry and by animal models immunised with M
    protein and cardiac myosin, is that cardiac myosin is the cross-reactive target. The objection is
    mechanical rather than immunological. Myosin is intracellular and therefore not accessible to
    circulating antibody in an intact cell, so it is an odd candidate for the first thing an antibody
    binds. The alternative proposes that extracellular and cell-surface proteins are hit first, namely
    laminin, collagen IV, the coxsackievirus-adenovirus receptor, and the beta-1 adrenergic receptor,
    with the response drifting to myosin and actin only after cells are damaged and their contents
    exposed. This is not merely a question of ordering. If the initial targets are extracellular, then
    those are the antigens a vaccine or a tolerising therapy would have to account for, and the animal
    models that immunise directly with myosin may be reproducing a late stage of the disease while
    skipping the step that actually initiates it.
  attaches_to:
  - pathophysiology#Molecular mimicry and cross-reactive immune priming
  evidence:
  - reference: PMID:25191648
    reference_title: "Rethinking Molecular Mimicry in Rheumatic Heart Disease and Autoimmune Myocarditis: Laminin, Collagen IV, CAR, and B1AR as Initial Targets of Disease."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "But myosin and actin are immunologically inaccessible and unlikely initial targets. Extracellular cardiac proteins that mimic GAS and CX would be more likely."
    explanation: States the objection to the canonical model in its own terms, along with the reasoning behind the alternative.
  - reference: PMID:25191648
    reference_title: "Rethinking Molecular Mimicry in Rheumatic Heart Disease and Autoimmune Myocarditis: Laminin, Collagen IV, CAR, and B1AR as Initial Targets of Disease."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Epitope drift shifts the immune response to myosin and actin after cardiomyocytes become damaged."
    explanation: The proposed reconciliation, in which both models describe different stages. PARTIAL because it arises from sequence-similarity searching rather than from a demonstrated sequence of events in patients.
  - reference: PMID:16455580
    reference_title: "Molecular mimicry in the autoimmune pathogenesis of rheumatic heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the a-helical coiled-coil streptococcal M protein structurally mimic cardiac myosin in the human disease, rheumatic carditis, and in animal models immunized with streptococcal M protein and cardiac myosin"
    explanation: The canonical position, which this discussion weighs against the alternative rather than discards.
  proposed_experiments:
  - experiment_id: exp_serial_autoantibody_profiling
    name: Serial autoantibody specificity profiling from streptococcal pharyngitis through acute rheumatic fever
    description: >-
      Serially profile antibody specificity against laminin, collagen IV, the coxsackievirus-adenovirus
      receptor, the beta-1 adrenergic receptor, and cardiac myosin in a prospective cohort followed from
      streptococcal pharyngitis through any subsequent acute rheumatic fever. If extracellular targets
      are struck first, antibodies against them should precede anti-myosin antibodies rather than
      appear alongside them.

- discussion_id: anti_inflammatory_treatment_does_not_protect_the_valve
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Given that immune-mediated valvulitis is what destroys the valve, why does anti-inflammatory
    treatment during the acute episode fail to reduce valve damage, and is that negative result real?
  rationale: >
    Every step in this entry's causal chain predicts that suppressing acute inflammation should
    preserve the valve, and the trial evidence does not show it. There are at least three readings and
    they carry different consequences. The damage may already be done by the time carditis is
    clinically apparent, in which case the intervention is simply too late and earlier detection is the
    answer. The agents tested may be too weak or wrongly targeted, in which case a modern trial with
    better drugs is warranted. Or the trials themselves, six of eight conducted between 1950 and 1965
    with substantial risk of bias, may simply be incapable of detecting an effect that exists. The
    reviewers call for new trials, which is a statement that they regard the question as open rather
    than answered. This matters because in the absence of a valve-protective therapy the entire burden
    of preventing this disease falls on prophylaxis and adherence.
  attaches_to:
  - pathophysiology#Acute valvulitis with Aschoff body formation
  - pathophysiology#Chronic valve fibrosis, commissural fusion, and calcification
  evidence:
  - reference: PMID:26017576
    reference_title: "Anti-inflammatory treatment for carditis in acute rheumatic fever."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Little evidence of benefit was found when corticosteroids or intravenous immunoglobulins were used to reduce the risk of heart valve lesions in patients with acute rheumatic fever."
    explanation: The negative finding that this discussion exists to explain.
  - reference: PMID:26017576
    reference_title: "Anti-inflammatory treatment for carditis in acute rheumatic fever."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, risk of bias was substantial, so results should be viewed with caution."
    explanation: PARTIAL. The reviewers' own warning about their result, which is what makes this an open question rather than a settled negative.
  proposed_experiments:
  - experiment_id: exp_modern_anti_inflammatory_trial
    name: Randomised trial of a modern immunomodulator in echocardiographically confirmed acute carditis with valve morphology as the endpoint
    description: >-
      Randomise patients with echocardiographically confirmed acute carditis to a modern
      anti-inflammatory or immunomodulatory agent or placebo, with valve morphology at two years as the
      primary endpoint rather than a clinical composite. The decision criterion is whether valve outcome
      differs. A symptomatic benefit without a structural one would confirm the existing picture rather
      than change it.

- discussion_id: gas_vaccine_as_the_only_route_to_elimination
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Can a group A streptococcal vaccine be developed that prevents this disease without provoking
    the very cross-reactivity that causes it?
  rationale: >
    Every intervention curated in this entry is downstream of an infection that has already
    happened, and the one that works depends on an injection regimen people cannot complete. A
    vaccine is the only intervention that would remove the trigger at population scale, and the
    World Health Organization has published a formal development roadmap and preferred product
    characteristics for one. The difficulty is specific to this disease and follows directly from
    its mechanism. The immunodominant streptococcal antigens are precisely the ones that
    cross-react with cardiac tissue, so a vaccine that raises antibodies against M protein risks
    inducing the autoimmunity it is meant to prevent. Current approaches try to route around this,
    for instance by targeting the L-rhamnose backbone of the group A carbohydrate, chosen because
    the rhamnose biosynthesis pathway is absent from mammalian cells and so cannot be mimicked.
    Whether that avoids cross-reactivity in humans rather than in test animals is unresolved.
  attaches_to:
  - pathophysiology#Group A streptococcal infection in a susceptible host
  - pathophysiology#Molecular mimicry and cross-reactive immune priming
  evidence:
  - reference: PMID:30624673
    reference_title: "The Path to Group A Streptococcus Vaccines: World Health Organization Research and Development Technology Roadmap and Preferred Product Characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Impediments related to antigen diversity, safety concerns, and the difficulty to establish vaccine efficacy against rheumatic heart disease are discussed."
    explanation: Names the three obstacles to a vaccine, including the specific difficulty of demonstrating efficacy against this disease, which is the substance of this discussion rather than the existence of a roadmap.
  - reference: PMID:30624673
    reference_title: "The Path to Group A Streptococcus Vaccines: World Health Organization Research and Development Technology Roadmap and Preferred Product Characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Demonstration of vaccine efficacy against pharyngitis and skin infections constitutes a key near-term strategic goal."
    explanation: States the near-term strategy, which is itself informative. Efficacy is to be shown against the infections rather than against this disease, because the rheumatic endpoint is too rare and too delayed to power a trial on directly.
  - reference: PMID:39959434
    reference_title: "Unveiling the Group A Streptococcus Vaccine-Based L-Rhamnose from Backbone of Group A Carbohydrate: Current Insight Against Acute Rheumatic Fever to Reduce the Global Burden of Rheumatic Heart Disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "The L-Rhamnose-based vaccine was chosen due to the absence of the Rhamnose biosynthesis pathway in mammalian cells including humans thus this molecule is not found in any body tissue."
    explanation: States the design rationale for avoiding cross-reactivity, namely selecting an antigen with no mammalian counterpart to mimic.
  - reference: PMID:39959434
    reference_title: "Unveiling the Group A Streptococcus Vaccine-Based L-Rhamnose from Backbone of Group A Carbohydrate: Current Insight Against Acute Rheumatic Fever to Reduce the Global Burden of Rheumatic Heart Disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Recent pre-clinical studies reveal that L-Rhamnose-based vaccines provide a protective effect by increasing IgG antibody titers without causing cross-reactive antibodies in test animal tissue."
    explanation: PARTIAL, and deliberately so. The absence of cross-reactivity is demonstrated in test animal tissue, which is exactly the claim that must hold in humans and has not yet been shown to.
  proposed_experiments:
  - experiment_id: exp_gas_vaccine_cross_reactivity_human
    name: Human cardiac tissue cross-reactivity screening of candidate group A streptococcal vaccine antisera
    description: >-
      Screen antisera raised by candidate vaccine antigens against a panel of human cardiac and
      valvular proteins, including cardiac myosin, laminin, collagen IV, and the beta-1 adrenergic
      receptor, before any efficacy trial. The decision criterion is whether cross-reactivity is
      detectable against human rather than animal tissue, since the animal result is what current
      candidates rest on and is not the relevant test.

- discussion_id: prophylaxis_burden_is_the_limiting_factor
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Can secondary prophylaxis be delivered in a form that people will actually complete, and would
    doing so close the gap between its efficacy and its real-world effect?
  rationale: >
    This disease is unusual in having a cheap intervention of established efficacy that reliably fails
    in practice for reasons that are not biological. Benzathine penicillin requires a painful deep
    intramuscular injection every three to four weeks for at least five years, typically in adolescents
    who feel well, in settings with limited health infrastructure. Adherence is correspondingly poor,
    and recurrence follows, which is what converts survivable valve disease into fatal valve disease.
    The gap between efficacy and effectiveness here is arguably the single largest determinant of the
    global burden, and it is a pharmacological and delivery problem rather than a mechanistic one. A
    subcutaneous high-dose formulation permitting less frequent dosing is in early trials.
  attaches_to:
  - treatments#Benzathine penicillin G secondary prophylaxis
  proposed_experiments:
  - experiment_id: exp_long_acting_prophylaxis_outcomes
    name: Long-acting subcutaneous benzathine penicillin versus monthly intramuscular dosing with course completion as a co-primary endpoint
    description: >-
      Randomise patients to a long-acting subcutaneous benzathine penicillin formulation or to standard
      monthly intramuscular dosing, with completion of the prophylaxis course and recurrence of acute
      rheumatic fever as co-primary endpoints. The point is to test whether removing the delivery burden
      closes the efficacy-effectiveness gap, so adherence has to be an endpoint and not a covariate.

notes: >
  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.
  The report was unusually careful and flagged its own ontology and MONDO identifiers as unverified
  rather than asserting them. Every identifier used here was independently checked against OAK or OLS.

  MONDO term selection. MONDO:0006955 is the live term. MONDO:0000472 also matches a search for this
  disease name and is obsolete; it must not be used.

  NEC preflight returned SKIP, because MONDO records no causal gene for this disease and the
  gene-identity check therefore cannot discriminate. The manual fallback was run. The report is
  unambiguously about rheumatic heart disease throughout, and the apparent top gene hit reported by
  the tool, RHD at 95 mentions, is the tool matching the disease acronym against the unrelated Rh
  blood group gene rather than a genuine gene signal.

  Cochrane version. The report cited the Cochrane review on anti-inflammatory treatment without a
  PMID. Three versions exist, from 2003, 2012, and 2015. The 2015 update, PMID:26017576, is cited
  here. The superseded 2003 version, PMID:12804454, was fetched during curation and is deliberately
  not cited.

  Module conformance. One node conforms to fibrotic_response. The report suggested the Aschoff body
  might conform to granuloma_formation; it is deliberately not curated that way, because that module
  models containment of a persistent indigestible stimulus by macrophage fusion and there is no
  organism in the rheumatic valve to contain. The report also advised against conforming the atrial
  fibrillation to cardiac_ion_channel_repolarization, which is correct and is followed here, since
  this arrhythmia is structural and the INVICTUS result is the clinical consequence of that fact.

  Absent bindings. No ECTO term is available for household crowding or poverty as exposures, which is
  documented on the environmental entry. No therapeutic_agent is bound on the benzathine penicillin
  treatment because the NCIT identifier for the benzathine salt was not confirmed during curation;
  the generic Pharmacotherapy action term is used alone rather than binding an unverified CURIE.

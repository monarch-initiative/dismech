differential_diagnoses:
- name: Schmid metaphyseal chondrodysplasia
  description: >-
    The differential that actually arises at the bedside, where Blomstrand does
    not. Schmid is far commoner than JMC and shares the metaphyseal flaring and
    irregularity, so the radiographs alone do not separate them. What separates
    them is the biochemistry this entry stakes JMC's identity on: in Schmid and
    the other metaphyseal chondrodysplasias calcium and phosphorus metabolism is
    normal, whereas JMC is defined by PTH-independent hypercalcaemia with
    suppressed endogenous PTH. The radiographic picture is also mistaken for
    rickets, which is the error the cited case report documents.
  evidence:
  - reference: PMID:8644413
    reference_title: "[Metaphyseal chondrodysplasia as differential diagnosis to rickets]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other types are Schmid, Spahr, McKusick, Schwachman and Jansen, which can
      be separated by clinical, radiographic, genetic and biochemical criteria.
    explanation: >-
      Places Schmid and Jansen in the same radiographic group and states that
      the separation rests on combined criteria rather than radiography alone.
  - reference: PMID:8644413
    reference_title: "[Metaphyseal chondrodysplasia as differential diagnosis to rickets]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The radiographic changes are similar to rickets, but calcium and
      phosphorus metabolism is normal.
    explanation: >-
      Gives the discriminator: normal mineral metabolism in the rest of the
      group, against the hypercalcaemia that defines JMC.
- name: Blomstrand lethal chondrodysplasia
  description: >-
    The mirror image at the same locus, and the most illuminating contrast in
    the disease's biology. Blomstrand is caused by homozygous or compound
    heterozygous PTH1R variants producing less-active or inactive receptors, and
    the growth plate phenotype runs the other way: accelerated chondrocyte
    differentiation and premature ossification, where JMC delays both. The two
    diseases bracket the receptor's dose-response and are not clinically
    confusable - Blomstrand is lethal in the perinatal period.
  evidence:
  - reference: PMID:10912527
    reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Heterozygous PTH1R mutations that lead to constitutively activity were
      identified in Jansen metaphyseal chondrodysplasia, and homozygous or
      compound heterozygous mutations that lead to less-active or completely
      inactive receptors were identified in patients with Blomstrand lethal
      chondrodysplasia.
    explanation: >-
      States both diseases at the same locus and the opposite direction of their
      receptor lesions.
  - reference: PMID:10912527
    reference_title: Role of parathyroid hormone-related peptide and Indian hedgehog in skeletal development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mice lacking PTHrP show accelerated chondrocyte differentiation, and thus
      premature ossification of those bones that are formed through an
      endochondral process, and similar but more-severe abnormalities are
      observed in PTH1R-ablated animals.
    explanation: >-
      Gives the loss-of-function growth plate phenotype, which is the inverse of
      the JMC lesion this entry curates.
treatments:
- name: Hydration to Reduce Stone and Nephrocalcinosis Risk
  description: >-
    Generous fluid intake to reduce the risk of hypercalcaemia, hypercalciuria,
    nephrolithiasis and nephrocalcinosis. Simple, and the first line against the
    complication that accumulates irreversibly.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Nephrocalcinosis
    treatment_effect: MODULATES
    description: >-
      Dilution reduces the urinary supersaturation that drives stone formation
      and nephrocalcinosis; it does not affect the calcium load itself.
    evidence:
    - reference: PMID:40638774
      reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        intake of plenty of fluids to reduce risk of hypercalcemia,
        hypercalciuria, nephrolithiasis, and nephrocalcinosis
      explanation: >-
        GeneReviews states the intervention and its target complications.
  evidence:
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intake of plenty of fluids to reduce risk of hypercalcemia,
      hypercalciuria, nephrolithiasis, and nephrocalcinosis
    explanation: >-
      GeneReviews management recommendation.
- name: Bisphosphonate Therapy for Severe Hypercalcemia
  description: >-
    Considered for severe hypercalcaemia. Alendronate has been reported to
    control hypercalciuria in an adult with JMC. This addresses the consequence
    rather than the receptor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  target_mechanisms:
  - target: Renal and Skeletal Calcium Mobilization
    treatment_effect: INHIBITS
    description: >-
      Bisphosphonates suppress osteoclast-mediated bone resorption, reducing the
      skeletal contribution to the calcium load without touching the
      constitutive receptor signal.
    evidence:
    - reference: PMID:22278430
      reference_title: "Potential effects of alendronate on fibroblast growth factor 23 levels and effective control of hypercalciuria in an adult with Jansen's metaphyseal chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with alendronate reduced hypercalciuria; however,
        normocalciuria was only obtained with the association of thiazide
        diuretic.
      explanation: >-
        Shows the partial effect of bisphosphonate alone on the calcium
        phenotype, and that a thiazide was needed to normalise it. The
        incompleteness is the point: neither drug touches the receptor.
  evidence:
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      consider bisphosphonates if necessary for severe hypercalcemia
    explanation: >-
      GeneReviews states the indication, with its own conditional framing.
- name: Thiazide Diuretic for Hypercalciuria
  description: >-
    Thiazides reduce urinary calcium excretion by increasing distal tubular
    reabsorption. In the one long-term follow-up available, alendronate alone
    reduced hypercalciuria but only the addition of a thiazide achieved
    normocalciuria - which is why it is curated as its own treatment rather than
    folded into the bisphosphonate entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiazide diuretic
      term:
        id: NCIT:C49185
        label: Thiazide Diuretic
  target_mechanisms:
  - target: Hypercalciuria
    treatment_effect: INHIBITS
    description: >-
      Increased distal tubular calcium reabsorption lowers urinary calcium,
      acting on the excretion step rather than on the calcium load.
    evidence:
    - reference: PMID:22278430
      reference_title: "Potential effects of alendronate on fibroblast growth factor 23 levels and effective control of hypercalciuria in an adult with Jansen's metaphyseal chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment with alendronate reduced hypercalciuria; however,
        normocalciuria was only obtained with the association of thiazide
        diuretic.
      explanation: >-
        Establishes the thiazide as the component that achieved normocalciuria.
  evidence:
  - reference: PMID:22278430
    reference_title: "Potential effects of alendronate on fibroblast growth factor 23 levels and effective control of hypercalciuria in an adult with Jansen's metaphyseal chondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

notes: >-
  Naming hazard. kb/disorders/Chung-Jansen_Syndrome.yaml is a different disease
  (PHIP-related) sharing only the eponym. Nothing was cited across between the
  two entries, and no Chung-Jansen source was consulted.

  Deep research. One OpenScientist report was generated
  (research/Metaphyseal_Chondrodysplasia_Jansen_Type-deep-research-openscientist.md).
  It was the cleanest of the five reports in this batch: 32/32 references
  verified, 33/34 terms verified, and one label mismatch (GO:0007050, whose
  ontology label resolves as the bare identifier because the term is obsolete —
  it is not used here).

  Review round 1 (PR #10146) added, from evidence already in the branch or one
  fetch away: joint swelling and two dental phenotypes from the GeneReviews
  clinical characteristics; a diagnosis section and the Blomstrand
  loss-of-function contrast as a differential; the thiazide, which had been
  described only inside an explanation string; three animal models, including
  the T410R humanized knock-in whose Hdac4 rescue is the decisive in vivo
  support for the SIK-HDAC node this entry already carried; and a split of the
  bundled renal node into hypercalciuria, nephrocalcinosis and chronic kidney
  disease. GO:0004930 was replaced with GO:0004991, the parathyroid hormone
  receptor activity term, which is what the node actually describes.

  It is worth recording that this report *declined to guess* the MONDO ID,
  writing "MONDO ID not resolved in this investigation" rather than supplying a
  plausible-looking wrong one. Three of the other four reports in this batch
  offered a disease-level MONDO term that named an entirely different disease
  while reporting a confabulation rate of 0.0. Abstaining was the correct
  behaviour and is the reason this entry needed no MONDO correction.

  Care guidance recorded here rather than modelled, because none of it is an
  intervention with a mechanism target. Contact sports and other high-risk
  activities are to be avoided in those with significant skeletal involvement.
  The full GeneReviews surveillance programme also covers growth and limb-length
  measurement every six to twelve months in children, dental review with
  radiographs, audiometry and ophthalmic assessment every one to two years, and
  blood pressure at each visit; the mineral and renal elements of it are
  modelled as a diagnosis record because they are what prevent the disease's
  least reversible outcome.

  Deliberately not curated. No prevalence record: no population rate has been
  published, and the largest series is 24 patients. The FGF23 elevation reported
  in JMC is real but the quotable statements attach it either to bisphosphonate
  pharmacology or to immunohistochemical staining intensity rather than to a
  measured circulating disease phenotype, so no biochemical record is made for
  it; the osteocyte staining finding is carried in the pathophysiology node
  description instead. The craniofacial series (PMID:39830149) is cached but not
  curated as its own phenotype record: it needs frequency data the abstract does
  not carry. Hypertension was initially left out on the same reasoning - the only
  dedicated report is a single neonate, and its own title poses the association
  as a question - but that reading missed that GeneReviews independently tells
  clinicians to measure blood pressure at every visit and to treat elevation with
  angiotensin-pathway drugs. A disorder-specific management recommendation is not
  a single case, so hypertension is now curated with no frequency band and the
  case report attached as INDIRECT.

  Two validator catches worth recording. A first draft quoted the article title
  of PMID:11713230 as the transgenic-mouse evidence; the reference validator
  rejected it, the abstract turned out to contain a far better sentence, and
  reading it also corrected the entry - the transgene rescues PTHrP-null
  lethality but does *not* prevent perinatal lethality in receptor-null mice,
  which the first draft had conflated. Separately, the inverse-agonist snippet
  originally included the peptide's bracketed residue notation and failed to
  match, because bracketed spans are stripped before matching unless
  conf/reference_validator_config.yaml lists a literal_bracket_patterns entry.
  Rather than widen that shared config for one quote, the snippet was shortened
  to a bracket-free span of the same sentence.

  Frequency bands are given for short stature, hypercalciuria and
  nephrocalcinosis, where the cohort text supports "all patients except",
  "consistently elevated" and "most" respectively. Everything else is unbanded.

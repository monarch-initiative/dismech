name: Metaphyseal Chondrodysplasia, Jansen Type
creation_date: "2026-08-30T06:20:00Z"
category: Mendelian
parents:
- Skeletal Dysplasia
- Metaphyseal Chondrodysplasia
- Disorder of Calcium Homeostasis
synonyms:
- JMC
- Jansen metaphyseal chondrodysplasia
- PTH1R-related Jansen metaphyseal chondrodysplasia
- Murk Jansen type metaphyseal chondrodysplasia
- metaphyseal dysostosis, Jansen type
disease_term:
  preferred_term: metaphyseal chondrodysplasia, Jansen type
  term:
    id: MONDO:0007982
    label: metaphyseal chondrodysplasia, Jansen type
description: >-
  Jansen metaphyseal chondrodysplasia is an ultra-rare autosomal dominant
  skeletal dysplasia caused by heterozygous activating missense variants in
  PTH1R, the PTH/PTHrP receptor. The mutant receptor signals constitutively
  through Gs-alpha in the complete absence of ligand, and that one lesion
  accounts for both halves of the disease.

  In the growth plate, PTH1R signalling normally holds chondrocytes in
  proliferation and delays hypertrophy; locked on, it delays hypertrophy
  pathologically, producing metaphyseal widening, bowed limbs and severe short
  stature. In kidney and bone, the same constitutive signal produces
  hypercalcaemia and hypercalciuria with low or suppressed PTH — a
  PTH-independent hypercalcaemia that is close to unique among skeletal
  dysplasias and is the diagnostic signature.

  Two features make this entry mechanistically unusual. The severity tracks the
  intrinsic constitutive activity of the specific allele rather than being
  uniform, so genotype predicts phenotype in a way most dominant dysplasias do
  not. And the downstream transcriptional route is now identified: constitutive
  PTH1R inhibits salt-inducible kinases SIK2 and SIK3, de-repressing class IIa
  histone deacetylases, and combined Sik2/Sik3 deletion phenocopies the
  constitutively active receptor. There is no approved disease-specific therapy;
  PTH1R inverse-agonist peptides that suppress basal signalling are the leading
  mechanism-directed strategy.
definitions:
- name: PTH1R-JMC diagnostic criteria
  definition_type: CASE_DEFINITION
  description: >-
    Established in a proband with characteristic clinical and radiographic
    findings plus a heterozygous pathogenic PTH1R variant. Hypercalcaemia with
    low-normal or suppressed PTH is the biochemical signature, but it is not
    reliably present at every age — which is the diagnostic trap this entry
    records.
  scope: Disease-level ascertainment.
  evidence:
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PTH1R-JMC is established in a proband with characteristic
      clinical and radiographic findings and a heterozygous pathogenic variant
      in PTH1R identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the diagnostic criteria.
epidemiology:
- name: Ultra-rare, with the largest series comprising 24 patients
  description: >-
    JMC is ultra-rare. The largest natural-history series assembled comprises 24
    patients, in whom the H223R allele accounted for 18 and the remaining four
    alleles for the rest. No population rate has been published.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assess the natural history of clinical and laboratory findings in 24
      patients with JMC and characterize the disease-causing mutant receptors in
      vitro.
    explanation: >-
      Establishes the size of the largest assembled cohort. The number is stated
      in the study's objectives rather than its results because it describes the
      cohort assembled, not a finding measured in it.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The H223R mutation occurred in 18 patients. T410P, I458R and I458K each
      occurred in single cases; T410R was present in a father and his two sons.
    explanation: >-
      Gives the allelic distribution across the cohort.
progression:
- phase: Infancy and early childhood, before hypercalcaemia is reliable
  age_range: Birth to about 2 years
  notes: >-
    Postnatal calcium was normal in most patients, and only became elevated
    between 0.15 and 10 years. Establishing the diagnosis in infancy is
    therefore genuinely difficult, especially without a family history, and the
    radiographic findings rather than the biochemistry are what carry it. A
    normal calcium in an infant does not exclude JMC.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatal calcium levels were normal in most patients, but elevated
      between 0.15 and 10 years (11.8 ± 1.37 mg/dL) and tended to normalize in
      adults (10.0 ± 1.03 mg/dL).
    explanation: >-
      Documents the age-dependence of the defining biochemical abnormality.
  - reference: PMID:27410178
    reference_title: Jansen Metaphyseal Chondrodysplasia due to Heterozygous H223R-PTH1R Mutations With or Without Overt Hypercalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Establishing the diagnosis of JMC during infancy or early childhood can be
      challenging, especially in the absence of family history and/or overt
      hypercalcemia.
    explanation: >-
      States the diagnostic difficulty this phase is about.
- phase: Childhood hypercalcaemia and progressive skeletal deformity
  age_range: Roughly 2 to 10 years
  notes: >-
    Calcium is elevated through childhood, urinary calcium/creatinine is
    consistently raised, and skeletal deformity progresses. Most patients
    undergo orthopaedic surgery.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary calcium/creatinine (mg/mg) were consistently elevated (children,
      0.80 ± 0.40; adults, 0.28 ± 0.19).
    explanation: >-
      Quantifies hypercalciuria across both age groups.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with JMC had undergone orthopedic surgical procedures, most
      had nephrocalcinosis, and two had advanced chronic kidney disease.
    explanation: >-
      Documents the surgical and renal burden of the cohort.
- phase: Adulthood — calcium normalises, renal damage does not
  notes: >-
    Serum calcium tends to normalise in adults, which is the trap in the other
    direction: an adult with normal calcium may still be affected, as in the
    38-year-old mother diagnosed only after both her sons were. What does not
    normalise is the accumulated renal injury — most patients had
    nephrocalcinosis and two had advanced chronic kidney disease — nor adult
    height, which was below the third percentile in every patient except those
    carrying the milder T410R allele.
  evidence:
  - reference: PMID:27410178
    reference_title: Jansen Metaphyseal Chondrodysplasia due to Heterozygous H223R-PTH1R Mutations With or Without Overt Hypercalcemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, however, the now 38-year-old mother was never overtly
      hypercalcemic and was therefore not diagnosed until her sons were found to
      be affected by JMC at the ages of 28 months and 40 days, respectively.
    explanation: >-
      The worked case showing that the biochemical signature can be absent
      lifelong in a genetically affected adult.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult heights were well below the 3rd percentile for all patients, except
      for those with the T410R mutation.
    explanation: >-
      Documents the adult stature outcome and its allele dependence.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most cases are de novo; transmission from an affected heterozygous parent is
    documented, including a father and two sons carrying T410R.
  evidence:
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTH1R-JMC is inherited in an autosomal dominant manner. Although some
      individuals diagnosed with PTH1R-JMC have the disorder as the result of a
      pathogenic variant inherited from a heterozygous parent manifesting the
      skeletal features of the disorder, most individuals have the disorder as
      the result of a de novo pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and the predominance of de novo
      variants.
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with PTH1R-JMC has a 50% chance of inheriting
      the PTH1R pathogenic variant.
    explanation: >-
      Gives the transmission risk that follows from the dominant mode, which is
      what genetic counseling actually turns on.
genetic:
- name: PTH1R
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PTH1R
    term:
      id: hgnc:9608
      label: PTH1R
  notes: >-
    Five heterozygous activating missense variants at three residues account for
    reported JMC: H223R, T410P, T410R, I458R and I458K. H223R dominates
    numerically (18 of 24 in the largest series). Each renders the receptor
    constitutively active in a ligand-independent manner, and the five mutants
    show varying degrees of constitutive and PTH-stimulated cAMP signalling in
    reporter cells — which is the mechanistic basis for the genotype-phenotype
    relationship, since T410R patients were the only ones in the cohort whose
    adult height was not below the third centile.
  variants:
  - name: PTH1R H223R
    description: >-
      A histidine-to-arginine substitution at a strictly conserved residue in
      the first intracellular loop; the original and by far the commonest JMC
      allele.
  - name: PTH1R T410R
    description: >-
      The milder allele. Transmitted through a father and two sons, and the only
      genotype in the series whose carriers reached adult heights at or above
      the third centile.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five different activating PTH/PTH-related peptide (PTHrP) receptor (PTHR1)
      mutations have been reported as causes of Jansen metaphyseal
      chondrodysplasia (JMC), a rare disorder characterized by severe growth
      plate abnormalities and PTH-independent hypercalcemia.
    explanation: >-
      Establishes the allelic spectrum and the two-part phenotype it causes.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The five PTHR1 mutants showed varying degrees of constitutive and
      PTH-stimulated cAMP signaling activity when expressed in HEK293 reporter
      cells.
    explanation: >-
      The functional measurement underpinning the allele-severity relationship.
  - reference: PMID:7701349
    reference_title: A constitutively active mutant PTH-PTHrP receptor in Jansen-type metaphyseal chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A single heterozygous nucleotide exchange in exon M2 of the gene encoding
      the parathyroid hormone-parathyroid hormone-related peptide (PTH-PTHrP)
      receptor was identified in a patient with Jansen-type metaphyseal
      chondrodysplasia, which changes a strictly conserved histidine residue at
      position 223 in the receptor's first intracellular loop to arginine.
    explanation: >-
      The founding report identifying H223R and its structural location.
pathophysiology:
- name: Constitutively Active PTH1R
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: PTH1R
      term:
        id: hgnc:9608
        label: PTH1R
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous activating missense variants at H223, T410 or I458 stabilise
      the active receptor conformation. Most arise de novo; inherited cases are
      documented.
  molecular_functions:
  - preferred_term: constitutively active PTH/PTHrP receptor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004991
      label: parathyroid hormone receptor activity
  evidence:
  - reference: PMID:7701349
    reference_title: A constitutively active mutant PTH-PTHrP receptor in Jansen-type metaphyseal chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Constitutive, ligand-independent adenosine 3',5'-monophosphate
      accumulation was observed in COS-7 cells expressing the mutant PTH-PTHrP
      receptor but not in cells expressing the wild-type receptor.
    explanation: >-
      Direct demonstration of ligand-independent activity, with the wild-type
      control that makes it a gain of function rather than a measurement
      artefact.
  downstream:
  - target: Ligand-Independent Gs-alpha and cAMP Signaling
    causal_link_type: DIRECT
    description: >-
      The stabilised active receptor drives basal Gs-alpha coupling and cAMP
      accumulation with no hormone present.
    evidence:
    - reference: PMID:7701349
      reference_title: A constitutively active mutant PTH-PTHrP receptor in Jansen-type metaphyseal chondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This finding explains the severe ligand-independent hypercalcemia and
        hypophosphatemia, and most likely the abnormal formation of endochondral
        bone, in this rare form of short-limbed dwarfism.
      explanation: >-
        The authors' own statement connecting constitutive signalling to both
        arms of the phenotype. Note their hedge on the skeletal arm is preserved
        in this entry's edge typing.
- name: Ligand-Independent Gs-alpha and cAMP Signaling
  biological_scale: MOLECULAR
  description: >-
    Basal Gs-alpha activation with elevated cAMP. Gs-alpha is the critical
    mediator of PTH1R action in growth-plate chondrocytes: chondrocyte-specific
    Gs-alpha knockout accelerates hypertrophy, the mirror image of what
    constitutive receptor activity does.
  biological_processes:
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence:
  - reference: PMID:15765186
    reference_title: Chondrocyte-specific knockout of the G protein G(s)alpha leads to epiphyseal and growth plate abnormalities and ectopic chondrocyte formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results show that G(s)alpha negatively regulates chondrocyte
      differentiation and is the critical signaling mediator of the PTH/PTH-rP
      receptor in growth plate chondrocytes.
    explanation: >-
      Establishes Gs-alpha as the mediator through which the receptor acts on
      chondrocyte differentiation.
  downstream:
  - target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
    causal_link_type: DIRECT
    description: >-
      cAMP-dependent signalling inhibits salt-inducible kinases, which are the
      kinases that transduce PTH1R's skeletal actions.
    evidence:
    - reference: PMID:31430259
      reference_title: Salt-inducible kinases dictate parathyroid hormone 1 receptor action in bone development and remodeling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we showed that salt-inducible kinases (SIKs) are key kinases that
        control the skeletal actions downstream of PTH1R and that this GPCR,
        when activated, inhibited cellular SIK activity.
      explanation: >-
        States the kinase step and the direction of the effect.
  - target: Renal and Skeletal Calcium Mobilization
    causal_link_type: DIRECT
    description: >-
      The same constitutive signal in kidney and bone drives calcium
      reabsorption and release, producing hypercalcaemia without PTH.
    evidence:
    - reference: PMID:7701349
      reference_title: A constitutively active mutant PTH-PTHrP receptor in Jansen-type metaphyseal chondrodysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This finding explains the severe ligand-independent hypercalcemia and
        hypophosphatemia, and most likely the abnormal formation of endochondral
        bone, in this rare form of short-limbed dwarfism.
      explanation: >-
        Connects constitutive receptor signalling to the mineral-ion phenotype.
- name: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
  biological_scale: MOLECULAR
  description: >-
    The transcriptional route from receptor to skeletal phenotype. SIK
    inhibition de-represses class IIa histone deacetylases, and the genetic
    evidence for this being the operative path is unusually strong: combined
    Sik2/Sik3 deletion in osteoblasts and osteocytes produces a skeletal and
    molecular phenotype closely resembling that of the constitutively active
    PTH1R that causes JMC. That is a phenocopy in the direction that matters —
    removing the kinase reproduces the disease.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  evidence:
  - reference: PMID:31430259
    reference_title: Salt-inducible kinases dictate parathyroid hormone 1 receptor action in bone development and remodeling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Combined deletion of Sik2 and Sik3 in osteoblasts and osteocytes led to a
      dramatic increase in bone mass that closely resembled the skeletal and
      molecular phenotypes observed when these bone cells express a
      constitutively active PTH1R that causes Jansen's metaphyseal
      chondrodysplasia.
    explanation: >-
      The phenocopy result placing SIK inhibition on the causal path.
  - reference: PMID:31430259
    reference_title: Salt-inducible kinases dictate parathyroid hormone 1 receptor action in bone development and remodeling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      genetic evidence demonstrated that class IIa histone deacetylases were key
      PTH1R-regulated SIK substrates in both chondrocytes and osteocytes
    explanation: >-
      Identifies the downstream substrate in both affected cell types.
  downstream:
  - target: Delayed Growth Plate Chondrocyte Hypertrophy
    causal_link_type: DIRECT
    description: >-
      The de-repressed transcriptional program holds chondrocytes in
      proliferation and delays their differentiation into hypertrophic cells.
    evidence:
    - reference: PMID:16831900
      reference_title: PTHrP and skeletal development.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        As chondrocytes go through a program of proliferation and then further
        differentiation into post-mitotic, hypertrophic chondrocytes, PTHrP
        action keeps chondrocytes proliferating and delays their further
        differentiation.
      explanation: >-
        States the normal function of the pathway whose constitutive activation
        produces this node.
- name: Delayed Growth Plate Chondrocyte Hypertrophy
  biological_scale: TISSUE
  description: >-
    Chondrocytes fail to progress to hypertrophy on schedule, disorganising the
    growth plate and producing the metaphyseal widening and irregularity that
    name the disease. In the normal PTHrP-Indian hedgehog feedback loop this
    delay is a regulated, transient signal; here it is permanent.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0003418
      label: growth plate cartilage chondrocyte differentiation
  evidence:
  - reference: PMID:16831900
    reference_title: PTHrP and skeletal development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PTHrP action keeps chondrocytes proliferating and delays their further
      differentiation.
    explanation: >-
      Names the effect of the signalling pathway on chondrocyte maturation.
  downstream:
  - target: Short-Limbed Short Stature and Skeletal Deformity
    causal_link_type: DIRECT
    description: >-
      Disordered endochondral bone formation produces metaphyseal widening,
      bowed long bones, scoliosis and severe short stature.
    evidence:
    - reference: PMID:40638774
      reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Radiographs show bowing of the long bones, flaring or widening of the
        metaphyses, short phalanges, sclerosis of the skull base, fragmented
        vertebra, and, in some individuals, scoliosis.
      explanation: >-
        The radiographic phenotype produced by this developmental lesion.
- name: Renal and Skeletal Calcium Mobilization
  biological_scale: ORGANISM
  description: >-
    Constitutive PTH1R signalling in kidney and bone raises serum calcium and
    lowers phosphate with low or suppressed PTH. Bone histomorphometry in two
    H223R patients shows what this looks like in tissue: increased osteoid with
    prolonged maturation, intense cortical osteoclast activity, marrow fibrosis,
    osteoid buildup within osteocyte lacunae, a shortened and sparser canalicular
    network, enhanced FGF23 and diminished sclerostin staining.
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  evidence:
  - reference: PMID:39950977
    reference_title: "Jansen's Disease: Bone Abnormalities Beyond Chondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients with JMC displayed irregular bone architecture, increased
      osteoid, and a prolonged osteoid maturation process.
    explanation: >-
      Direct histomorphometric observation in patient bone.
  - reference: PMID:39950977
    reference_title: "Jansen's Disease: Bone Abnormalities Beyond Chondrodysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Remarkably, osteocytes in samples from patients with JMC had osteoid
      buildup within their lacunae and canaliculi that were both shorter and
      less abundant.
    explanation: >-
      The osteocyte-level lesion, which is where the constitutive receptor
      signal is being read out.
  downstream:
  - target: Hypercalciuria
    causal_link_type: DIRECT
    description: >-
      Sustained hypercalcaemia raises the filtered calcium load and produces
      persistent hypercalciuria.
    evidence:
    - reference: PMID:39950977
      reference_title: "Jansen's Disease: Bone Abnormalities Beyond Chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Jansen metaphyseal chondrodysplasia (JMC) is an ultra-rare autosomal
        dominant disease that is caused by heterozygous, activating PTH1R
        mutations resulting in PTH- and PTHrP-independent hypercalcemia and
        hypercalciuria, leading to nephrocalcinosis and impaired renal function
        later in life.
      explanation: >-
        States the full renal chain from hypercalcaemia to impaired function.
- name: Short-Limbed Short Stature and Skeletal Deformity
  biological_scale: ORGANISM
  description: >-
    The skeletal endpoint: short-limb short stature with joint swelling, bowed
    lower limbs, scoliosis, and characteristic craniofacial and dental features.
    Intelligence is normal.
  evidence:
  - reference: PMID:40638774
    reference_title: PTH1R-Related Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTH1R-related Jansen metaphyseal chondrodysplasia (PTH1R-JMC) is
      characterized by short-limb short stature with swelling of the joints in
      the extremities, bowing of the lower extremities, mild-to-severe scoliosis,
      hypercalcemia with low-normal or suppressed parathyroid hormone, and kidney
      stones.
    explanation: >-
      GeneReviews' summary of the clinical phenotype.
- name: Hypercalciuria
  biological_scale: ORGANISM
  description: >-
    The filtered calcium load rises with the serum calcium. Unlike serum
    calcium, urinary calcium/creatinine is consistently elevated in both
    children and adults, which is what makes it the durable marker of disease
    activity.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary calcium/creatinine (mg/mg) were consistently elevated (children,
      0.80 ± 0.40; adults, 0.28 ± 0.19).
    explanation: >-
      Documents persistent hypercalciuria across both age groups.
  downstream:
  - target: Nephrocalcinosis
    causal_link_type: DIRECT
    description: >-
      Sustained calcium excretion deposits calcium in the renal parenchyma.
    evidence:
    - reference: PMID:39950977
      reference_title: "Jansen's Disease: Bone Abnormalities Beyond Chondrodysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        resulting in PTH- and PTHrP-independent hypercalcemia and hypercalciuria,
        leading to nephrocalcinosis and impaired renal function later in life
      explanation: >-
        States the causal step from hypercalciuria to nephrocalcinosis.
- name: Nephrocalcinosis
  biological_scale: TISSUE
  description: >-
    Calcium deposition in the renal parenchyma, present in most patients in the
    largest cohort. This is the lesion that accumulates: serum calcium
    normalises in adults, and nephrocalcinosis does not.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with JMC had undergone orthopedic surgical procedures, most
      had nephrocalcinosis, and two had advanced chronic kidney disease.
    explanation: >-
      Gives the frequency of nephrocalcinosis in the largest cohort.
  downstream:
  - target: Chronic Kidney Disease
    causal_link_type: DIRECT
    description: >-

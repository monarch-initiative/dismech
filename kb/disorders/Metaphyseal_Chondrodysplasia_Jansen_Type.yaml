animal_models:
- name: Humanized T410R-PTH1R knock-in mouse
  species: Mouse
  genotype: T410R-hPTH1R humanized knock-in
  publication: PMID:40455993
  description: >-
    The best available model, and the one that resolved the field's problem.
    Expressing the milder T410R allele from the endogenous locus gives mice with
    near-normal longevity and fertility - unlike the H223R humanized line, which
    dies early without breeding - while still showing misshapen long bones,
    expanded metaphyses, disarrayed chondrocyte zones, reduced primary spongiosa,
    elevated serum calcium and suppressed PTH. It reproduces both arms of the
    human disease in one animal, which no earlier model did.
  modeled_mechanisms:
  - target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      This model supplies the decisive in vivo test of the SIK-HDAC route:
      genetic ablation of Hdac4 rescues the growth plate abnormalities, which is
      an epistasis result rather than a correlation.
    limitations: >-
      T410R is the mildest of the five human alleles, so quantitative severity
      does not transfer to H223R patients. The rescue is genetic ablation from
      conception, not a post-hoc intervention.
    readouts:
    - name: Growth plate morphology after Hdac4 ablation
      target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
      direction: RESTORED
      interpretation: >-
        Removing the downstream HDAC restores the growth plate, placing the
        SIK-HDAC axis on the causal path rather than beside it.
      evidence:
      - reference: PMID:40455993
        reference_title: "A mouse model of Jansen's metaphyseal chondrodysplasia for investigating disease mechanisms and candidate therapeutics."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Genetic ablation of Hdac4 rescued the growth plate abnormalities in
          T410R mice, thereby establishing the PTH1R-Gαs-cAMP-PKA-SIK3-HDAC4/5
          pathway as the main mediator of growth plate abnormalities in JMC.
        explanation: >-
          The rescue experiment and the authors' own conclusion from it.
    evidence:
    - reference: PMID:40455993
      reference_title: "A mouse model of Jansen's metaphyseal chondrodysplasia for investigating disease mechanisms and candidate therapeutics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mutant mice show near-normal longevity and reproductive capacity yet
        exhibit a profound skeletal phenotype characteristic of the disease.
      explanation: >-
        Establishes the model as viable and phenotypically faithful, which is
        what makes it usable for the mechanism test above.
  - target: Renal and Skeletal Calcium Mobilization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Serum calcium is elevated and endogenous PTH suppressed, reproducing the
      PTH-independent hypercalcaemia that defines the human disease.
    limitations: >-
      The allele is T410R, which in humans is the milder end of the spectrum and
      is not the common H223R; and murine mineral-ion handling differs from
      human in its calcium set point and renal phosphate response, so the
      magnitude of the abnormality does not transfer even though its direction
      and PTH-independence do.
    readouts:
    - name: Serum calcium and endogenous PTH after PTH inverse agonist
      target: Renal and Skeletal Calcium Mobilization
      direction: RESTORED
      interpretation: >-
        Both parameters normalise on acute inverse-agonist injection, which is
        the first in vivo demonstration that the mineral-ion arm is
        pharmacologically reversible. The normalisation is reported after a
        single injection, so it establishes reversibility but says nothing about
        durability under chronic dosing.
      evidence:
      - reference: PMID:40455993
        reference_title: "A mouse model of Jansen's metaphyseal chondrodysplasia for investigating disease mechanisms and candidate therapeutics."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Serum calcium was elevated and endogenous PTH was suppressed in T410R
          mice, and both parameters could be normalized by acute injection of an
          optimized PTH inverse agonist peptide.
        explanation: >-
          Reports both the baseline abnormality and its reversal.
    evidence:
    - reference: PMID:40455993
      reference_title: "A mouse model of Jansen's metaphyseal chondrodysplasia for investigating disease mechanisms and candidate therapeutics."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The T410R mouse thus represents a stable animal model of JMC that
        recapitulates the abnormalities in skeletal development and mineral ion
        homeostasis which characterize this disease.
      explanation: >-
        The authors' summary that this model covers both arms of the disease.
- name: Humanized H223R-PTH1R knock-in mouse
  species: Mouse
  genotype: H223R-hPTH1R expressed from the endogenous Pth1r promoter
  publication: PMID:37808400
  description: >-
    Expressing the common human allele from the endogenous locus, in all
    relevant target tissues. Its defining feature is severity: founders
    typically died within two months without reproducing, and F1 offspring were
    small with marked growth plate abnormalities. This model exists because the
    earlier transgenic lines did not work - promoter-restricted expression gave
    either excess bone mass or only minor growth plate change, and neither
    adequately recapitulated the human disease.
  modeled_mechanisms:
  - target: Delayed Growth Plate Chondrocyte Hypertrophy
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Growth plates show markedly expanded proliferating and prehypertrophic
      zones with progressive loss of type X collagen-positive hypertrophic
      chondrocytes - the delayed-maturation lesion, seen directly.
    limitations: >-
      The line is barely viable: founders typically die within two months
      without reproducing, and only mosaic males produced offspring, which
      constrains what can be asked of it. Serum calcium and phosphate were not
      different from wild-type littermates, so this model does not reproduce the
      mineral-ion arm.
    readouts:
    - name: Growth plate zone composition
      target: Delayed Growth Plate Chondrocyte Hypertrophy
      direction: ALTERED
      interpretation: >-
        Expanded proliferating/prehypertrophic zones with reduced hypertrophic
        chondrocytes is the histological signature of delayed maturation.
      evidence:
      - reference: PMID:37808400
        reference_title: "Substantially Delayed Maturation of Growth Plate Chondrocytes in \"Humanized\" PTH1R Mice with the H223R Mutation of Jansen's Disease."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          revealed markedly expanded zones of type II collagen-positive,
          proliferating/prehypertrophic chondrocytes, abundant apoptotic cells in
          the growth plate center and a progressive reduction of type X
          collagen-positive hypertrophic chondrocytes and primary spongiosa
        explanation: >-
          The histological measurement behind this readout.
    evidence:
    - reference: PMID:37808400
      reference_title: "Substantially Delayed Maturation of Growth Plate Chondrocytes in \"Humanized\" PTH1R Mice with the H223R Mutation of Jansen's Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We therefore generated "humanized" JMC mice in which the H223R-PTH1R
        allele was expressed via the endogenous mouse Pth1r promoter and, thus,
        in all relevant target tissues.
      explanation: >-
        Establishes the design feature - endogenous, untargeted expression - that
        makes this model informative where the transgenics were not.
- name: Sik2/Sik3 double-knockout mouse
  species: Mouse
  genotype: Sik2 and Sik3 conditional double knockout in osteoblasts and osteocytes
  publication: PMID:31430259
  description: >-
    A phenocopy model rather than a disease model, and the reason the SIK node
    is in this pathograph at all. Deleting the kinases that constitutively
    active PTH1R inhibits reproduces the JMC skeletal and molecular phenotype -
    that is, removing the brake from below does what jamming the receptor on
    does from above.
  modeled_mechanisms:
  - target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Combined Sik2/Sik3 deletion produces a skeletal and molecular phenotype
      closely resembling that of the constitutively active PTH1R.
    limitations: >-
      This is a phenocopy of the mechanism, not a model of the disease: the mice
      carry no PTH1R lesion, deletion is restricted to osteoblasts and
      osteocytes rather than chondrocytes, and no mineral-ion phenotype is
      reported. It cannot be used to test therapies, only to place the node.
    evidence:
    - reference: PMID:31430259
      reference_title: Salt-inducible kinases dictate parathyroid hormone 1 receptor action in bone development and remodeling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Combined deletion of Sik2 and Sik3 in osteoblasts and osteocytes led to a
        dramatic increase in bone mass that closely resembled the skeletal and
        molecular phenotypes observed when these bone cells express a
        constitutively active PTH1R that causes Jansen's metaphyseal
        chondrodysplasia.
      explanation: >-
        The phenocopy result that places SIK inhibition on the causal path.
- name: Jansen H223R-PTH1R transgenic mouse
  species: Mouse
  genotype: Collagen II promoter-driven H223R-PTH1R transgene
  publication: PMID:11713230
  description: >-
    Growth-plate-targeted expression of the constitutively active Jansen
    receptor delays chondrocyte differentiation, and it rescues the early
    lethality of PTHrP-null mice by preventing their accelerated chondrocyte
    differentiation. In PTH/PTHrP receptor-null mice the same transgene restored
    most bone abnormalities but did *not* prevent perinatal lethality, which the
    authors read as evidence that something besides the abnormal rib cage kills
    those animals. The informative part for JMC is the first result: a
    ligand-independent receptor substitutes for the ligand-dependent one in the
    growth plate and produces delay, which is what the human allele does.
  modeled_mechanisms:
  - target: Delayed Growth Plate Chondrocyte Hypertrophy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Expressing the human JMC allele in growth-plate chondrocytes reproduces
      the delayed-hypertrophy phenotype and rescues receptor-null mice.
    limitations: >-
      This is a transgenic overexpression model on a receptor-null background
      rather than a knock-in of the human heterozygous state, so expression
      level and cellular context differ from patients. It also addresses only
      the growth-plate arm; the mineral-ion and renal phenotypes are not what
      this model was built to test.
    evidence:
    - reference: PMID:11713230
      reference_title: Partial rescue of PTH/PTHrP receptor knockout mice by targeted expression of the Jansen transgene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression of the Jansen transgene under the control of the type
        alpha1(II) collagen promoter was, furthermore, shown to delay
        chondrocyte differentiation and to prevent the dramatic acceleration of
        chondrocyte differentiation in PTHrP(-/-) mice, thus rescuing the early
        lethality of these animals.
      explanation: >-
        Directly reports that the human Jansen allele, expressed in growth-plate
        chondrocytes, delays chondrocyte differentiation - the node this link
        targets.
    - reference: PMID:11713230
      reference_title: Partial rescue of PTH/PTHrP receptor knockout mice by targeted expression of the Jansen transgene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        the type alpha1(II) collagen promoter Jansen transgene restored most of
        the bone abnormalities in PPR(-/-) mice, but did not prevent their
        perinatal lethality
      explanation: >-
        Bounds what the model rescues, which is why the fidelity is recorded as
        MODERATE rather than HIGH.
discussions:
- discussion_id: allele_specific_constitutive_activity_sets_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the intrinsic constitutive activity of each PTH1R allele quantitatively
    predict clinical severity, and if so can it be used prospectively?
  attaches_to:
  - pathophysiology#Constitutively Active PTH1R
  rationale: >-
    The ingredients for a dose-response account are present and the account has
    not been made. Five mutants show varying degrees of constitutive cAMP
    signalling in reporter cells; separately, adult height was below the third
    centile in every patient except the T410R carriers. Those two observations
    are consistent with severity tracking basal activity, but they have not been
    fitted against each other, and with 24 patients across five alleles — 18 of
    them a single allele — the series cannot support it. Two things would need
    separating: whether basal activity predicts severity at all, and whether it
    predicts the skeletal and renal arms to the same degree, which is not
    obvious given that they act through different tissues. Until that is done,
    genotype cannot be used prospectively to counsel a newly diagnosed infant.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The five PTHR1 mutants showed varying degrees of constitutive and
      PTH-stimulated cAMP signaling activity when expressed in HEK293 reporter
      cells.
    explanation: >-
      The in vitro half of the proposed relationship.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adult heights were well below the 3rd percentile for all patients, except
      for those with the T410R mutation.
    explanation: >-
      The clinical half, and the single data point that suggests the two are
      related.
- discussion_id: inverse_agonist_translation
  kind: KNOWLEDGE_GAP
  prompt: >-
    PTH1R inverse agonists suppress basal signalling of every JMC mutant in
    vitro. What would a clinical trial in an ultra-rare disease with an
    age-dependent biochemical endpoint and an irreversible skeletal one actually
    measure?
  attaches_to:
  - pathophysiology#Ligand-Independent Gs-alpha and cAMP Signaling
  rationale: >-
    This is the one mechanism-directed strategy for JMC and the pharmacology is
    encouraging: the inverse agonist reduced basal cAMP signalling for each of
    the five mutant receptors, so it acts on the lesion rather than a
    consequence. The difficulty is on the trial side, and it is structural
    rather than pharmacological. Serum calcium, the obvious biomarker, is
    normal in most infants and normalises in adults, so it is only informative
    in a window; urinary calcium/creatinine is elevated in both children and
    adults and is the better candidate. Adult height is a decisive endpoint but
    takes two decades and is unavailable to anyone diagnosed late. And
    nephrocalcinosis, the complication that accumulates, is what a trial would
    most want to prevent and is the slowest to read out. An endpoint strategy is
    a prerequisite here, not an afterthought.
  evidence:
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      reduced basal cAMP signaling for each PTHR1 mutant
    explanation: >-
      Establishes that the strategy works against every reported allele in
      vitro, which is what makes the translational question the live one.
  - reference: PMID:29788189
    reference_title: Progression of Mineral Ion Abnormalities in Patients With Jansen Metaphyseal Chondrodysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary calcium/creatinine (mg/mg) were consistently elevated (children,
      0.80 ± 0.40; adults, 0.28 ± 0.19).
    explanation: >-
      The one mineral-ion measure that is abnormal across all ages, and
      therefore the most usable candidate endpoint.

diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis is established by identification of a pathogenic RARB variant.
    Most reported cases were solved by whole-exome sequencing (singleton or
    trio), which detects both the dominant de novo variants and the
    biallelic recessive alleles; RARB testing is recommended in complex
    ocular malformations accompanied by systemic and neurodevelopmental
    abnormalities.
  results: >-
    Heterozygous (usually de novo) pathogenic RARB variant in dominant
    disease, or biallelic pathogenic RARB variants in recessive disease.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we found that two PDAC-syndrome-affected siblings, but not their unaffected sibling, were compound heterozygous for nonsense"
    explanation: Whole-exome sequencing identified the first biallelic RARB variants in PDAC syndrome siblings.
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used trio whole-exome sequencing to explore the molecular basis of disease in an individual with congenital eye abnormality and movement disorder."
    explanation: Trio whole-exome sequencing is used to identify de novo RARB variants in eye-brain disease.
- name: Brain magnetic resonance imaging
  description: >-
    Brain MRI characterizes the associated central nervous system
    malformations of RARB-related disease and is recommended in affected
    individuals.
  results: >-
    Chiari type I malformation in the majority of survivors, and corpus
    callosum hypoplasia in a subset.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:27120018
    reference_title: "Gain-of-Function Mutations in RARB Cause Intellectual Disability with Progressive Motor Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of subjects also showed Chiari type I malformation and severe feeding difficulties."
    explanation: Brain imaging identifies Chiari type I malformation in the majority of surviving RARB-affected individuals.
- name: Fetal ultrasonography
  description: >-
    Prenatal ultrasound can detect the structural malformations of
    RARB-related disease, including microphthalmia and congenital
    diaphragmatic hernia, enabling prenatal recognition in familial cases.
  results: >-
    Congenital eye anomalies are prenatally detected in a minority of
    cases; detection rates are higher when extraocular malformations are
    present.
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging

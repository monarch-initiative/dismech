    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Throughout infancy, the patient required frequent hospitalizations for respiratory distress and feeding difficulties, often triggered by infections."
    explanation: Affected infants require recurrent supportive care for respiratory and feeding complications.
  - reference: PMID:27120018

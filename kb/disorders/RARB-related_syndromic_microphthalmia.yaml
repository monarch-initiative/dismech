discussions:
- discussion_id: dg_dominant_recessive_lof_paradox
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do near-identical RARB loss-of-function variants manifest as
    dominantly inherited disease in some individuals but segregate as
    recessive alleles with asymptomatic heterozygous carriers in other
    families?
  attaches_to:
  - pathophysiology#RARB Receptor Dysfunction
  rationale: >-
    A de novo dominant nonsense RARB variant and recessive biallelic
    loss-of-function variants in asymptomatic-carrier families imply that
    loss-of-function dosage alone does not determine manifestation;
    dominant-negative effects, genetic background, or allelic context may
    modulate whether one mutant allele suffices.
  proposed_experiments:
  - experiment_id: exp_rarb_allelic_series_transcriptional_assay
    name: Standardized transcriptional assay across the RARB allelic series
    description: >-
      Measure ligand-induced transcriptional activity of every reported
      pathogenic RARB allele in a shared assay and correlate residual or
      excess activity with inheritance mode and clinical phenotype.
  - experiment_id: exp_rarb_dominant_negative_interaction
    name: Allele-specific interaction study of dominant-negative versus recessive RARB variants
    description: >-
      Compare protein stability, ligand binding, RXR heterodimerization,
      and coactivator recruitment of dominant-negative versus recessive
      loss-of-function RARB variants to identify the molecular property
      that determines single-allele manifestation.
  - experiment_id: exp_mcops12_registry
    name: MCOPS12 patient registry
    description: >-
      Assemble a formal registry of individuals with RARB-related disease
      to derive quantitative phenotype frequencies, penetrance, and
      genotype-phenotype correlations across variant classes (dominant
      gain-of-function, dominant-negative, and biallelic loss-of-function).
  evidence:
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the data suggest manifestation and non-manifestation of disease in relation to almost identical RARB loss-of-function variations, an apparent paradox that is seen in a growing number of human genetic conditions associated with both recessive and dominant inheritance patterns."
    explanation: The literature explicitly frames the dominant-versus-recessive behavior of RARB loss-of-function alleles as an unresolved paradox.
- discussion_id: dg_motor_disorder_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does developmental disruption of RARB signaling produce the
    progressive postnatal movement disorder (spasticity, dystonia, chorea)
    of survivors, and through which brain regions and cell types?
  attaches_to:
  - pathophysiology#Abnormal Brain Development and Function
  rationale: >-
    The progressive motor impairment emerges postnatally, yet RARB acts
    transcriptionally during embryogenesis. The link between developmental
    retinoic acid dysregulation and later basal ganglia and motor pathology
    is inferred rather than demonstrated, and no current animal model
    recapitulates the movement disorder.
  proposed_experiments:
  - experiment_id: exp_rarb_gof_knockin_mouse
    name: Gain-of-function RARB knock-in mouse model
    description: >-
      Generate knock-in mice carrying a recurrent human codon-387
      gain-of-function variant to test whether the progressive motor
      disorder is recapitulated and to define the developmental window of
      vulnerability.
  - experiment_id: exp_rarb_ipsc_organoid_ra_response
    name: Patient iPSC and organoid retinoic acid response profiling
    description: >-
      Compare transcriptomic responses to retinoic acid in patient-derived
      iPSC models and optic-cup or cerebral organoids carrying
      gain-of-function and biallelic loss-of-function variants to identify
      dysregulated target genes such as PITX2.
  evidence:
  - reference: PMID:27120018
    reference_title: "Gain-of-Function Mutations in RARB Cause Intellectual Disability with Progressive Motor Impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects who survived the neonatal period (n = 10) displayed severe global developmental delay with progressive motor impairment due to spasticity and/or dystonia (with or without chorea)."
    explanation: The postnatal emergence and progression of the motor disorder documents a mechanism that extends beyond the congenital malformation phase.

    reference_title: "Prevalence and prenatal diagnosis of congenital eye anomalies: A population-based study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CEAs were prenatally diagnosed in 23.5% of cases."
    explanation: Population-registry data quantify the prenatal detectability of congenital eye anomalies, the presenting feature of RARB-related disease.
treatments:
- name: Supportive care
  description: >-
    No disease-specific therapy exists. Management is supportive and
    multidisciplinary, addressing respiratory distress and feeding
    difficulties in infancy (including enteral feeding support such as
    gastrostomy), neurodevelopmental disability, the progressive movement
    disorder (antispasticity and antidystonic agents, botulinum toxin for
    focal dystonia), and surveillance of Chiari type I malformation with
    neurosurgical evaluation as needed.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:

mechanistic_hypotheses:
- hypothesis_group_id: ra_signaling_gain_of_function
  hypothesis_label: Dominant gain-of-function RARB signaling excess
  status: CANONICAL
  description: >-
    De novo heterozygous missense variants (p.Arg387Cys, p.Arg387Ser,
    p.Gly296Ala, p.Leu213Pro and successors) increase ligand-induced
    transcriptional activity of RARB two- to threefold over wild type,
    driving excessive retinoic acid target gene expression. This is the
    predominant mechanism reported for dominant MCOPS12, including the
    progressive motor impairment of survivors.
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "altered RARB induced a 2- to 3-fold increase in transcriptional activity in response to retinoic acid ligands, suggesting a gain-of-function mechanism"
    explanation: The founding dominant de novo missense variants elevate receptor transcriptional activity.
  - reference: PMID:27120018
    reference_title: "Gain-of-Function Mutations in RARB Cause Intellectual Disability with Progressive Motor Impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.Gly296Ala and p.Leu213Pro RARB mutations further promote the RA ligand-induced transcriptional activity by twofold to threefold over the wild-type receptor, also indicating a gain-of-function mechanism"
    explanation: Extended allelic series confirms gain-of-function as the recurring dominant mechanism.
- hypothesis_group_id: ra_signaling_loss_of_function
  hypothesis_label: Recessive RARB loss of function
  status: CANONICAL
  description: >-
    Biallelic nonsense and frameshift RARB variants abolish receptor
    transcriptional activity and cause the PDAC malformation pattern in the
    compound heterozygous or homozygous state; heterozygous carriers are
    asymptomatic.
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "altered RARB had no transcriptional activity in response to ligands, confirming that the mutations induced a loss of function"
    explanation: Recessive truncating alleles abolish receptor activity in transfection assays.
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RARB bi-allelic loss-of-function variants, inherited from asymptomatic heterozygous carrier parents, have been found in a recessive family with four MCOPS12-affected members."
    explanation: A recessive MCOPS12 family carries biallelic loss-of-function variants with unaffected heterozygous parents.
- hypothesis_group_id: dominant_negative_disruption
  hypothesis_label: Dominant-negative disruption by heterozygous loss-of-function variants
  status: EMERGING
  description: >-
    Some heterozygous RARB loss-of-function variants, including a de novo
    nonsense allele, dominantly disrupt wild-type receptor function,
    possibly by impairing ligand binding and/or coactivator recruitment.
    The coexistence of dominant and recessive manifestation of near-identical
    loss-of-function alleles is an unresolved genotype-phenotype paradox.
  evidence:
  - reference: PMID:37092537
    reference_title: "Clinical and functional heterogeneity associated with the disruption of retinoic acid receptor beta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss-of-function variants disrupted RARB function through a dominant-negative effect, possibly by disrupting ligand binding and/or coactivators' recruitment."
    explanation: Functional assays demonstrate dominant-negative behavior of heterozygous loss-of-function RARB variants.
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide the first detailed evidence for a role of dominant RARB truncating alterations in congenital eye-brain disease, expanding the spectrum of MCOPS12-associated mutations."
    explanation: A de novo dominant nonsense RARB variant establishes that truncating alleles can act dominantly.
- hypothesis_group_id: ra_dosage_window_phenocopy
  hypothesis_label: A narrow retinoic acid dosage window unifies genetic and environmental disruption
  status: CANONICAL
  description: >-
    Embryonic retinoic acid signaling must remain within a narrow dosage
    window for normal eye, diaphragm, heart, and brain morphogenesis.
    Genetic RARB variants breach this window in both directions
    (gain-of-function and loss-of-function), and the same convergence is
    seen environmentally: fetal vitamin A deficiency (too little retinoic
    acid) and retinoic acid embryopathy from gestational isotretinoin
    exposure (too much) produce overlapping malformation spectra.
    Exaggerated neural crest cell apoptosis via p53 upregulation is a
    proposed cellular mechanism of retinoid-excess teratogenicity.
  evidence:
  - reference: PMID:7607068
    reference_title: "Function of the retinoic acid receptors (RARs) during development (II). Multiple abnormalities at various stages of organogenesis in RAR double mutants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A majority of these abnormalities recapitulate those observed in the fetal VAD syndrome"
    explanation: RAR double-mutant mice recapitulate the fetal vitamin A deficiency malformation spectrum, linking receptor loss to the too-little-retinoid extreme.
  - reference: PMID:29308367
    reference_title: "Retinoic Acid Embryopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A wide spectrum of birth defects including craniofacial, heart, and nervous system malformations have been described with prenatal exposure to this drug."
    explanation: Gestational isotretinoin exposure produces craniofacial, cardiac, and nervous system malformations, the retinoid-excess phenocopy of RARB-related disease.
  - reference: PMID:28833556
    reference_title: "Overexpression of p53 explains isotretinoin's teratogenicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "isotretinoin (13-cis retinoic acid), the prodrug of all-trans retinoic acid (ATRA), exaggerates neural crest cell (NCC) apoptosis via upregulation of the pro-apoptotic transcription factor p53"
    explanation: A mechanistic hypothesis proposes p53-driven neural crest cell apoptosis as the cellular basis of retinoid-excess teratogenicity.
genetic:
- name: RARB
  association: Causal pathogenic variant (dominant de novo or biallelic)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: RARB
    term:
      id: hgnc:9865
      label: RARB
  notes: >-
    Reported pathogenic alleles include dominant de novo gain-of-function
    missense variants (recurrently affecting codon 387), dominant-negative
    loss-of-function variants including a de novo nonsense allele, biallelic
    nonsense/frameshift loss-of-function variants in recessive families, and
    a de novo noncoding variant in a conserved intronic regulatory element
    (CR1) proposed to drive RARB overexpression. Missense variants in the
    highly conserved DNA-binding domain form an additional class,
    implicated in ocular coloboma and shown to reduce steady-state protein
    levels and impair nuclear localization.
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study thus suggests that both recessive and dominant mutations in RARB cause anophthalmia and/or microphthalmia and diaphragmatic hernia, providing further evidence of the crucial role of the retinoic acid pathway during eye development and organogenesis."
    explanation: The discovery study establishes RARB as the causal gene for this microphthalmia-diaphragmatic hernia syndrome in both inheritance modes.
  - reference: PMID:37092537
    reference_title: "Clinical and functional heterogeneity associated with the disruption of retinoic acid receptor beta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report 25 affected individuals with 17 novel pathogenic or likely pathogenic variants in RARB"
    explanation: A large allelic series confirms RARB as the causal gene across 52 reviewed affected individuals.
  - reference: ORPHA:689829
    reference_title: "Microphthalmia-motor delay-language delay-brain anomalies-diaphragmatic hernia syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RARB | retinoic acid receptor beta | hgnc:9865 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records RARB as the disease-causing gene for MCOPS12.
  - reference: PMID:31816153
    reference_title: "High-throughput custom capture sequencing identifies novel mutations in coloboma-associated genes: Mutation in DNA-binding domain of retinoic acid receptor beta affects nuclear localization causing ocular coloboma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant in RARB, unlike previously reported disease mutations in the ligand-binding domain, was a missense change in the highly conserved DNA-binding domain predicted to affect the protein's DNA-binding ability."
    explanation: A RARB DNA-binding-domain missense variant is implicated in human ocular coloboma, expanding the pathogenic variant classes beyond ligand-binding-domain mutations.

name: RARB-related syndromic microphthalmia
creation_date: "2026-07-31T04:55:00Z"
description: >-
  RARB-related syndromic microphthalmia (microphthalmia, syndromic 12; MCOPS12)
  is a rare developmental disorder caused by pathogenic variants in RARB,
  encoding retinoic acid receptor beta, a ligand-activated nuclear receptor of
  embryonic retinoic acid signaling. It phenocopies the Matthew-Wood/PDAC
  syndrome malformation pattern (pulmonary hypoplasia or agenesis,
  diaphragmatic hernia or eventration, anophthalmia or microphthalmia, and
  cardiac malformations). Most reported cases are caused by heterozygous de
  novo gain-of-function variants, and surviving individuals develop severe
  global developmental delay with progressive motor impairment (spasticity
  and/or dystonia, with or without chorea); biallelic loss-of-function
  variants cause a recessive form with asymptomatic heterozygous carriers.
category: Mendelian
parents:
- hereditary disease
- syndromic microphthalmia
synonyms:
- microphthalmia, syndromic 12
- MCOPS12
- RARB syndromic microphthalmia
- microphthalmia-motor delay-language delay-brain anomalies-diaphragmatic hernia syndrome
disease_term:
  preferred_term: RARB-related syndromic microphthalmia
  term:
    id: MONDO:0014229
    label: microphthalmia, syndromic 12
notes: >-
  The PDAC/Matthew-Wood syndrome malformation pattern is genetically
  heterogeneous: STRA6-related disease is curated in the separate dismech
  entry "STRA6-related syndromic microphthalmia" (MONDO:0011010), and
  biallelic WNT7B variants cause a further phenocopy; this entry covers the
  RARB-related form (MONDO:0014229, OMIM:615524, ORPHA:689829). No current
  GeneReviews chapter exists for this disorder (the
  Microphthalmia/Anophthalmia/Coloboma Spectrum chapter is retired). The
  dominant de novo missense variants characterized to date act through
  gain-of-function, whereas recessive alleles abolish receptor activity;
  heterozygous loss-of-function variants with dominant-negative behavior
  blur this dichotomy (see mechanistic_hypotheses and discussions).
  Phenotypic expression is more variable than initially recognized, with
  some individuals lacking cardinal features such as the developmental eye
  anomaly or motor impairment (PMID:37092537).
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Most reported MCOPS12 cases are caused by heterozygous de novo RARB
    variants, including recurrent gain-of-function missense variants in the
    ligand-binding domain and dominant-negative loss-of-function alleles.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three unrelated subjects with microphthalmia and diaphragmatic hernia showed de novo missense mutations affecting the same codon"
    explanation: De novo heterozygous RARB missense variants cause dominantly inherited disease.
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on identification of a heterozygous de novo RARB nonsense variant in a girl with microphthalmia and progressive generalized dystonia."
    explanation: A heterozygous de novo nonsense variant demonstrates dominant inheritance of a truncating RARB allele.
- name: Autosomal recessive inheritance
  description: >-
    Biallelic loss-of-function RARB variants cause the PDAC malformation
    pattern in a recessive form of MCOPS12; heterozygous carrier parents are
    asymptomatic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two PDAC-syndrome-affected siblings, but not their unaffected sibling, were compound heterozygous for nonsense"
    explanation: Compound heterozygous nonsense/frameshift RARB variants in affected siblings support recessive inheritance.
  - reference: PMID:37321544
    reference_title: "De novo retinoic acid receptor beta (RARB) variant associated with microphthalmia and dystonia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RARB bi-allelic loss-of-function variants, inherited from asymptomatic heterozygous carrier parents, have been found in a recessive family with four MCOPS12-affected members."
    explanation: A recessive family with biallelic loss-of-function variants and unaffected heterozygous carriers confirms autosomal recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet worldwide point-prevalence class below 1 in 1,000,000, sourced
    from the 52-individual clinical review of Caron et al. 2023
    (PMID:37092537). For context, anophthalmia and microphthalmia of all
    causes affect up to 2 per 10,000 live births (PMID:35716026);
    RARB-related disease is an ultra-rare syndromic subset.

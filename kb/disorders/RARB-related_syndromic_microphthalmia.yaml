    explanation: Population-based context for the background prevalence of anophthalmia and microphthalmia, of which RARB-related MCOPS12 is an ultra-rare syndromic subset.
pathophysiology:
- name: RARB Receptor Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Pathogenic variants in RARB alter the retinoic acid receptor beta
    protein, a ligand-activated nuclear receptor. De novo dominant missense
    variants in and around the ligand-binding domain increase ligand-induced
    transcriptional activity (gain-of-function), biallelic nonsense and
    frameshift variants abolish receptor activity (recessive
    loss-of-function), and some heterozygous loss-of-function variants
    disrupt wild-type receptor function through a dominant-negative effect.
    Missense variants in the highly conserved DNA-binding domain form a
    further loss-of-function class, reducing steady-state protein levels
    and impairing nuclear localization of the receptor.
  genes:
  - preferred_term: RARB
    term:
      id: hgnc:9865
      label: RARB
  molecular_functions:
  - preferred_term: nuclear receptor activity
    modifier: ABNORMAL
    term:
      id: GO:0004879
      label: nuclear receptor activity
  - preferred_term: retinoic acid binding
    modifier: ABNORMAL
    term:
      id: GO:0001972
      label: retinoic acid binding
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "altered RARB had no transcriptional activity in response to ligands, confirming that the mutations induced a loss of function"
    explanation: Transfection assays show recessive nonsense/frameshift RARB alleles abolish receptor transcriptional activity.
  - reference: PMID:37092537
    reference_title: "Clinical and functional heterogeneity associated with the disruption of retinoic acid receptor beta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We used in vitro transcriptional assays and in silico structural analysis to assess the functional relevance of RARB variants in affecting the normal response to retinoids."
    explanation: Functional assays of 17 novel RARB variants confirm that pathogenic alleles directly perturb receptor response to retinoids.
  - reference: PMID:31816153
    reference_title: "High-throughput custom capture sequencing identifies novel mutations in coloboma-associated genes: Mutation in DNA-binding domain of retinoic acid receptor beta affects nuclear localization causing ocular coloboma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies revealed lower steady-state protein levels, reduced transcriptional activity, and incomplete nuclear localization of the mutant RARB protein compared with wild-type."
    explanation: A DNA-binding-domain RARB missense variant reduces receptor protein levels, transcriptional activity, and nuclear localization, a loss-of-function mechanism distinct from ligand-binding-domain defects.
  - reference: PMID:31816153
    reference_title: "High-throughput custom capture sequencing identifies novel mutations in coloboma-associated genes: Mutation in DNA-binding domain of retinoic acid receptor beta affects nuclear localization causing ocular coloboma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "human RARB messenger RNA partially reduced the ocular phenotype caused by morpholino knockdown of rarga gene, a zebrafish homolog of human RARB."
    explanation: Zebrafish rarga knockdown ocular defects are partially rescued by human RARB mRNA, validating RARB variant pathogenicity in vivo.
  downstream:
  - target: Dysregulated Retinoic Acid Target Gene Transcription
    hypothesis_groups:
    - ra_signaling_gain_of_function
    - ra_signaling_loss_of_function
    - dominant_negative_disruption
    - ra_dosage_window_phenocopy
    description: Both excessive and absent receptor activity dysregulate retinoic acid target gene transcription during development.
- name: Dysregulated Retinoic Acid Target Gene Transcription
  biological_scale: MOLECULAR
  description: >-
    Dysfunctional RARB perturbs transcription of retinoic acid target genes.
    Dominant gain-of-function variants increase ligand-induced
    transcriptional activity two- to threefold over the wild-type receptor,
    loss-of-function alleles eliminate target gene activation, and
    overexpression of RARB elevates downstream effectors such as FOXC1. In
    the developing eye, the homeodomain transcription factor Pitx2 is a key
    retinoic-acid-responsive target gene in neural crest cells.
  biological_processes:
  - preferred_term: retinoic acid receptor signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0048384
      label: retinoic acid receptor signaling pathway
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  evidence:
  - reference: PMID:24075189
    reference_title: "Recessive and dominant mutations in retinoic acid receptor beta in cases with microphthalmia and diaphragmatic hernia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "altered RARB induced a 2- to 3-fold increase in transcriptional activity in response to retinoic acid ligands, suggesting a gain-of-function mechanism"
    explanation: Dominant de novo missense RARB variants increase ligand-induced transcriptional activity over wild type.
  - reference: PMID:27120018
    reference_title: "Gain-of-Function Mutations in RARB Cause Intellectual Disability with Progressive Motor Impairment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the p.Gly296Ala and p.Leu213Pro RARB mutations further promote the RA ligand-induced transcriptional activity by twofold to threefold over the wild-type receptor, also indicating a gain-of-function mechanism"
    explanation: Additional dominant RARB variants confirmed as gain-of-function in transcriptional assays.
  - reference: PMID:39450403
    reference_title: "A De Novo Noncoding RARB Variant Associated with Complex Microphthalmia Alters a Putative Regulatory Element."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Induction of RARB overexpression in human lens epithelial cells resulted in increased cell proliferation and elevated expression of FOXC1, a known downstream target of RA signaling"
    explanation: RARB overexpression elevates the downstream retinoic acid effector FOXC1, linking receptor dosage to target gene output.
  - reference: PMID:18539269
    reference_title: "Impairing retinoic acid signalling in the neural crest cells is sufficient to alter entire eye morphogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pitx2, which encodes a homeodomain transcription factor, is a key RA-responsive gene in neural crest cells during eye development."
    explanation: Mouse conditional genetics identifies Pitx2 as a key retinoic-acid-responsive effector gene in neural crest cells during eye development.

    evidence_source: HUMAN_CLINICAL
    snippet: "The muscle weakness was more progressive in P1 who had myopathic pattern on EMG with fatty replacement of proximal and distal leg muscles (Fig. 2b) and an abnormal repetitive stimulation (Fig. 2c), suggesting a defect of neuromuscular transmission."
    explanation: Electrophysiological evidence of a transmission defect in a patient.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, these experiments suggest that neuromuscular junction development in zebrafish embryos is dependent on tefm."
    explanation: Neuromuscular junction abnormalities in tefm knockdown zebrafish.
  - reference: PMID:37721175
    reference_title: Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum lactate elevation, positive decrement on RNS and biopsy showing mitochondrial respiratory chain complex I and IV deficiencies confirmed the mitochondrial disease together with the NMJ defect in the siblings."
    explanation: The founding Indian siblings combine a respiratory chain defect with a neuromuscular junction defect.
  downstream:
  - target: Fatigable weakness
    causal_link_type: DIRECT
  - target: "EMG: decremental response of compound muscle action potential to repetitive nerve stimulation"
    causal_link_type: DIRECT
- name: Neuronal Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Brain involvement ranges from none on imaging to cortical and white matter loss,
    cerebellar atrophy and thin corpus callosum. The founding authors read the diversity of
    brain and muscle findings as showing that mitochondrial transcription elongation matters
    for many neuronal populations. No study has measured transcription or respiratory chain
    function in patient neurons, so this node rests on the clinical picture and the analogy
    with POLRMT disease.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, the clinical and brain abnormalities were diverse in our cohort of patients with TEFM variants, suggesting that mitochondrial transcription and its elongation are crucial for a wide range of neurons and for skeletal muscle."
    explanation: The authors' inference from the clinical spectrum to neuronal vulnerability.
  downstream:

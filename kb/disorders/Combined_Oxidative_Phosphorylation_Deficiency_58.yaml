animal_models:
- name: tefm morpholino knockdown and F0 crispant zebrafish
  species: Zebrafish
  genotype: tefm morpholino knockdown; tefm F0 CRISPR/Cas9 crispants targeting exons 2 and 3
  publication: PMID:36823193
  description: >-
    Morpholino knockdown reduced embryonic chorion rotations and presynaptic cluster size, and
    reduced pre- and postsynaptic overlap at the neuromuscular junction. MTCO1 was reduced. F0
    crispants had lower HSP-derived mitochondrial mRNAs and moved less in the dark, increasingly
    so over the assay.
  modeled_mechanisms:
  - target: Neuromuscular Transmission Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reproduces neuromuscular junction abnormalities and reduced movement after tefm loss.
    limitations: >-
      Knockdown is mosaic and transient, and the readouts are embryonic junction development
      rather than transmission in a mature junction. No electrophysiology was performed.
    evidence:
    - reference: PMID:36823193
      reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, these experiments suggest that neuromuscular junction development in zebrafish embryos is dependent on tefm."
      explanation: Supports the model as informative for the junction node.
  - target: Impaired Mitochondrial Transcription Elongation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: F0 crispants show reduced HSP-derived mitochondrial mRNAs.
    limitations: >-
      Measured by RT-qPCR of selected transcripts, not by a promoter-distance profile as in the
      patient samples.
    evidence:
    - reference: PMID:36823193
      reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that mutations induced in zebrafish tefm have a significant reduction on HSP-derived mitochondrial mRNA transcripts."
      explanation: Transcript reduction in the crispants.
- name: Conditional Tefm knockout mouse (heart)
  species: Mouse
  genotype: Tefm conditional knockout in heart; constitutive Tefm-/- is embryonic lethal
  publication: PMID:31036713
  description: >-
    Tefm is essential for embryogenesis. Heart-specific knockout reduces promoter-distal
    mitochondrial transcripts, increases promoter-proximal ones, impairs de novo mtDNA
    replication and causes accumulation of unprocessed transcripts.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Transcription Elongation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Same promoter-distal transcript deficit as in patient muscle and fibroblasts.
    limitations: >-
      Complete loss in heart rather than hypomorphic alleles in all tissues; no neurological or
      neuromuscular phenotype is reported.
    evidence:
    - reference: PMID:31036713
      reference_title: TEFM regulates both transcription elongation and RNA processing in mitochondria.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report that Tefm is essential for mouse embryogenesis and that levels of promoter-distal mitochondrial transcripts are drastically reduced in conditional Tefm-knockout hearts."
      explanation: The knockout reproduces the elongation defect.
discussions:
- discussion_id: coxpd58_nmj_energetic_or_direct
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuromuscular Transmission Defect
  prompt: >-
    Is the neuromuscular transmission defect in TEFM disease a consequence of the respiratory
    chain deficiency, or does TEFM have a separate role at the synapse?
  rationale: >-
    The founding authors propose both explanations. The junction has a high density of
    mitochondria and a high energy demand, which favours the energetic one. But the
    myasthenic picture is prominent in TEFM disease and in SLC25A1 disease, and reviews have
    proposed a mitochondrial subtype of congenital myasthenic syndrome on that basis. Only
    some TEFM alleles appear to produce it, and one patient with the same fatigable picture had
    a normal repetitive stimulation study. The pathograph draws the edge from the respiratory
    chain node as the more likely route.
  evidence:
  - reference: PMID:37239850
    reference_title: Mitochondrial Mutations Can Alter Neuromuscular Transmission in Congenital Myasthenic Syndrome and Mitochondrial Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recently, two mitochondrial genes-SLC25A1 and TEFM-have been reported in patients with suspected CMS, prompting a discussion about the role of mitochondria at the neuromuscular junction (NMJ)."
    explanation: A review framing TEFM as a mitochondrial cause of a CMS-like presentation, which is the open question here.
notes: >-
  No GeneReviews chapter, Orphanet record or ClinGen gene-disease validity record covers TEFM.
  The founding series is a single study of seven patients from India, France, Australia, Italy
  and Egypt, so phenotype frequencies are taken from it and one later case report.

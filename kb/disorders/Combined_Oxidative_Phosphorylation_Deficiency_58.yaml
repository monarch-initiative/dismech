name: Combined Oxidative Phosphorylation Deficiency 58
category: Mendelian
creation_date: "2026-10-13T00:00:00Z"
synonyms:
- COXPD58
- combined oxidative phosphorylation deficiency type 58
- TEFM deficiency
- TEFM-related mitochondrial disorder
- TEFM-associated neurological disorder
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 58
  term:
    id: MONDO:0957537
    label: combined oxidative phosphorylation deficiency 58
description: >-
  COXPD58 is the combined oxidative phosphorylation deficiency caused by biallelic variants in
  TEFM, the nuclear gene for the mitochondrial transcription elongation factor. TEFM binds the
  mitochondrial RNA polymerase POLRMT and makes it processive, so that transcription from the
  two mtDNA promoters runs on into the promoter-distal genes instead of terminating early.

  The disease was defined in 2023 in seven patients from five unrelated families. Every allele
  tested retained part of its activity, consistent with mouse data showing that complete loss
  of Tefm is embryonic lethal. Patient muscle and fibroblasts had reduced promoter-distal
  mitochondrial transcripts, and muscle showed a combined deficiency of complexes I and IV with
  cytochrome c oxidase-negative fibres.

  The clinical range is very wide. At the severe end are neonatal lactic acidosis with
  hypoglycaemia and liver failure, and infantile epileptic encephalopathy with regression. At
  the mild end are developmental delay, intellectual disability, autism and ataxia. A distinctive
  subgroup has fluctuating, fatigable weakness with ptosis or ophthalmoparesis and a decremental
  response on repetitive nerve stimulation, resembling a congenital myasthenic syndrome, and one
  such patient improved on salbutamol. An eighth patient, reported in 2025, carried the same
  p.Pro157Ala allele as the founding Indian sibling pair.
parents:
- Combined Oxidative Phosphorylation Deficiency
- Mitochondrial Disease

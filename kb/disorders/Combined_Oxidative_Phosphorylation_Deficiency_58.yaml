      label: skeletal muscle fiber
  evidence:
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this analysis we detected markedly reduced protein levels of subunits from RC complexes I, III and IV in muscle of P1 & P2 compared to control samples"
    explanation: Respiratory chain subunit loss in patient muscle.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal muscle biopsy showed mitochondrial abnormalities with SDH hyper-reactivity and COX negative fibres (Fig. 2d) and a combined defect in the activities of OXPHOS enzyme complexes I and IV in P1, P2 and P4."
    explanation: Combined complex I and IV enzyme deficiency in muscle.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The lack of OXPHOS phenotype observed in the patient fibroblasts, except P4, prompted us to analyze patient tissues affected by the disease."
    explanation: Fibroblasts largely escape the respiratory chain defect, showing its tissue selectivity.

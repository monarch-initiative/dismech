    snippet: "The parents were healthy in all families and carried one heterozygous variant in each case."
    explanation: Carrier status of the parents confirms biallelic, recessive transmission.
pathophysiology:
- name: Biallelic Hypomorphic TEFM Variants
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of TEFM. The founding alleles are four missense variants (p.Arg34Trp,
    p.Pro157Ala, p.Ile159Lys, p.Lys188Arg), an in-frame two-residue deletion
    (p.Glu162_Arg163del), a frameshift, and a splice variant that causes exon 2 skipping and
    a second frameshift (p.Glu11Glyfs*2). Most
    missense changes cluster in the linker subdomain. Recombinant mutant proteins stimulated
    POLRMT processivity less than wild type, and TEFM protein was reduced in patient
    fibroblasts carrying p.Pro157Ala or p.Ile159Lys. All tested alleles kept residual
    activity, and no homozygous loss-of-function variant is seen in gnomAD.
  genes:
  - preferred_term: TEFM
    term:
      id: hgnc:26223
      label: TEFM
  molecular_functions:
  - preferred_term: transcription elongation factor activity
    modifier: DECREASED
    term:
      id: GO:0003711
      label: transcription elongation factor activity
  genetic_context:
    genes:
    - preferred_term: TEFM
      term:
        id: hgnc:26223
        label: TEFM
    allele_type: missense, in-frame deletion, frameshift and splice variants, homozygous or compound heterozygous
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      PARTIAL_LOSS_OF_FUNCTION because the founding authors describe all tested alleles as
      hypomorphic with relatively high residual activity, and Tefm knockout is embryonic lethal
      in mice. The pathogenicity of the p.Arg34Trp and p.Lys188Arg pair in one family remains
      less certain; both have relatively high gnomAD frequencies.
  evidence:
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the present work, we report the identification of seven TEFM variants (four missense, two frameshift and one in-frame 2-amino acid deletion) in seven individuals from five unrelated families who present with mitochondrial respiratory chain deficiency"
    explanation: The founding allelic series.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, our results show that the detected TEFM variants impair the activity of the enzyme, reducing the processivity of POLRMT-driven transcription."
    explanation: Reconstituted transcription assays with recombinant mutant TEFM show reduced stimulation of POLRMT.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The steady-state level of TEFM was substantially reduced in P2 and P3 fibroblasts as compared to the controls"
    explanation: Two missense alleles destabilise the protein in patient cells.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Human TEFM variants in our cohort all show relatively high residual activity (hypomorphic alleles) and there is a lack of homozygous LoF variants in gnomAD."
    explanation: The basis for treating the alleles as hypomorphic rather than null.
  - reference: PMID:25690892
    reference_title: TEFM is a potent stimulator of mitochondrial transcription elongation in vitro.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that TEFM strongly promotes POLRMT processivity as it dramatically stimulates the formation of longer transcripts."
    explanation: The normal molecular activity of TEFM that the variants reduce.
  - reference: PMID:21278163
    reference_title: TEFM (c17orf42) is necessary for transcription of human mtDNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in vitro TEFM enhanced POLRMT processivity on ss- and dsDNA templates"
    explanation: Independent biochemical evidence for TEFM as a POLRMT elongation factor.
  downstream:
  - target: Impaired Mitochondrial Transcription Elongation
    causal_link_type: DIRECT
- name: Impaired Mitochondrial Transcription Elongation
  biological_scale: MOLECULAR
  description: >-
    With less TEFM activity, POLRMT terminates early. Promoter-distal mitochondrial mRNAs and
    tRNA precursors fall while promoter-proximal transcripts rise. Both mitochondrial rRNAs are
    reduced, the promoter-distal 16S rRNA much more than 12S. The same gradient is seen when
    TEFM is knocked down in cultured cells and in the heart of conditional Tefm knockout mice.
  biological_processes:
  - preferred_term: mitochondrial transcription
    modifier: DECREASED
    term:
      id: GO:0006390
      label: mitochondrial transcription
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skeletal muscle samples from P1 and 2 and fibroblast samples from P2, 3 and 6 showed a more severe decrease of promoter-distal mt-mRNA, consistent with the reduced levels of TEFM in patient samples"
    explanation: RNA-Seq of patient muscle and fibroblasts shows the promoter-distal transcript deficit.
  - reference: PMID:36823193
    reference_title: TEFM variants impair mitochondrial transcription causing childhood-onset neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected the reduction of both mt-rRNAs in the patient samples compared to healthy controls, with the reduction being much greater for 16S rRNA, consistent with the observations in murine heart."
    explanation: The rRNA consequence of impaired elongation in patient fibroblasts.
  - reference: PMID:21278163
    reference_title: TEFM (c17orf42) is necessary for transcription of human mtDNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inactivation of TEFM in cells by RNA interference results in respiratory incompetence owing to decreased levels of H- and L-strand promoter-distal mitochondrial transcripts."
    explanation: TEFM knockdown in human cells reproduces the promoter-distal transcript loss.
  - reference: PMID:31036713
    reference_title: TEFM regulates both transcription elongation and RNA processing in mitochondria.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "levels of promoter-distal mitochondrial transcripts are drastically reduced in conditional Tefm-knockout hearts"
    explanation: The same transcript gradient in a mouse knockout.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  description: >-
    Fewer mtDNA-encoded subunits are made, and the respiratory chain complexes that contain
    them fall. Patient skeletal muscle had markedly reduced subunits of complexes I, III and IV
    and a combined defect in complex I and IV enzyme activity, with cytochrome c
    oxidase-negative fibres. Fibroblasts were less affected; only those of one patient showed
    reduced complex I. The tissue selectivity is one explanation offered for the variable
    presentation.
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen

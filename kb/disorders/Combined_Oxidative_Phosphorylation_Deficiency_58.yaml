    description: >-
      The founding authors consider the neuromuscular junction especially vulnerable to
      mitochondrial dysfunction because of its high energy demand, but also raise the
      possibility of a TEFM role at the synapse beyond transcription. The edge records the
      energetic explanation as the more likely one, not a settled one.

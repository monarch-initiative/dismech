      explanation: The authors' interpretation linking the respiratory defect to the junction.
  - target: Neuronal Mitochondrial Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neuromuscular Transmission Defect
  biological_scale: TISSUE
  description: >-
    Some patients have fluctuating, fatigable weakness with a decremental response on slow
    repetitive nerve stimulation, the picture of a congenital myasthenic syndrome. In
    zebrafish, tefm knockdown reduced embryonic movement, shrank presynaptic clusters and
    reduced the overlap of presynaptic and postsynaptic markers at the neuromuscular junction.
    TEFM is now listed among congenital myasthenic syndrome genes. One later patient with the
    same fatigable picture had a normal repetitive stimulation test.
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: DECREASED
    term:

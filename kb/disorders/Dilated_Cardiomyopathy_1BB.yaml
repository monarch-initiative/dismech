- name: Fibrofatty Myocardial Replacement
  description: >-
    Lost myocardium is replaced by fibrous and adipose tissue. In DSG2 disease
    the fatty component has a metabolic contributor as well as a
    transcriptional one: cardiac Dsg2 deletion impairs mTOR-4EBP1-PPAR-alpha
    signalling and hence fatty acid beta-oxidation, so lipid accumulates in the
    myocardium. Fibrogenesis is driven through TGF-beta/Smad3 signalling. The
    resulting tissue is both non-contractile and electrically inhomogeneous.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: fibroblast of cardiac tissue
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:

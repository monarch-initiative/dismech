name: Dilated Cardiomyopathy 1BB
creation_date: "2026-09-01T00:00:00Z"
category: Genetic
description: >-
  DSG2-related familial isolated dilated cardiomyopathy (CMD1BB) is the
  dilated, left-dominant or biventricular presentation of desmoglein-2
  deficiency. Desmoglein-2 is the principal desmosomal cadherin of the
  cardiomyocyte intercalated disc, where the desmosome and the adherens
  junction are intermingled as the area composita. Loss of desmoglein-2
  destabilises that junction, mechanically uncouples adjacent cardiomyocytes,
  and permits myocyte necrosis with aseptic inflammation and fibrofatty
  replacement; the surviving ventricle dilates and loses contractile function.
  The entry is scoped to the presentation in which chamber dilation and
  systolic failure dominate the clinical picture rather than isolated
  right ventricular arrhythmogenic disease. Allele dose is the principal
  determinant of severity: heterozygous carriers typically present in
  adulthood with a milder, frequently event-free course, whereas biallelic
  (homozygous, compound heterozygous, or hemizygous) loss of function gives
  early-onset biventricular disease that can reach transplantation.
synonyms:
- CMD1BB
- cardiomyopathy, dilated, 1BB
- cardiomyopathy, dilated, type 1Bb
- dilated cardiomyopathy type 1BB
- DSG2 familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in DSG2
- desmoglein-2-deficient cardiomyopathy
disease_term:
  preferred_term: Dilated Cardiomyopathy 1BB
  term:
    id: MONDO:0013030
    label: dilated cardiomyopathy 1BB
parents:

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    The majority of DSG2-related disease is transmitted as an autosomal
    dominant trait with reduced, age-related and exercise-modulated
    penetrance. Heterozygous carriers of the Chinese p.Phe531Cys founder
    variant remained free of end-stage heart failure and composite events over
    follow-up, which is the clearest available statement of how mild the
    monoallelic course can be.
  evidence:
  - reference: PMID:16773573
    reference_title: DSG2 mutations contribute to arrhythmogenic right ventricular dysplasia/cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is inherited as an autosomal dominant disease with reduced penetrance,
      although autosomal recessive forms of the disease also occur.
    explanation: >-
      States the dominant-with-reduced-penetrance mode and simultaneously
      records that recessive forms exist, which is the contrast this entry
      curates in the second Inheritance block.
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound and homozygous variant carriers exhibited significantly higher
      incidences of end-stage heart failure and composite events, whereas single
      heterozygous variant carriers remained event-free (all P < .05).
    explanation: >-
      Quantifies the mildness of the monoallelic course in a 91-subject founder
      variant cohort, supporting incomplete penetrance in heterozygotes.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A minority of cases are recessive. Biallelic loss of function - homozygous,
    compound heterozygous, or hemizygous where a point mutation is unmasked by
    a large deletion of the second allele - produces earlier-onset,
    biventricular disease, and the obligate heterozygous parents are typically
    unaffected, which is why these families present without an apparent
    family history.
  evidence:
  - reference: PMID:33917638
    reference_title: Hemi- and Homozygous Loss-of-Function Mutations in DSG2 (Desmoglein-2) Cause Recessive Arrhythmogenic Cardiomyopathy with an Early Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, a recessive inheritance pattern is likely for both cases,
      which might contribute to the hidden medical history in both families.
    explanation: >-
      Establishes recessive inheritance in two index patients and explains why
      such families lack a family history, which is the diagnostic trap.
genetic:
- name: DSG2 Loss-of-Function and Missense Variants
  gene_term:
    preferred_term: DSG2
    term:
      id: hgnc:3049
      label: DSG2
  association: Causative
  inheritance:
  - name: Autosomal dominant
  - name: Autosomal recessive
  features: >-
    DSG2 encodes desmoglein-2, a type I transmembrane desmosomal cadherin whose
    four extracellular cadherin domains mediate calcium-dependent adhesion to
    desmocollin-2 across the intercalated disc. Pathogenic variants are
    predominantly missense and cluster in the extracellular domains; nonsense,
    frameshift, splice-site and whole-gene deletion alleles also occur and act
    through loss of function. Missense alleles may additionally act in a
    dominant-negative fashion, since mutant protein is incorporated into the
    desmosome rather than degraded. Multiple variants in the same individual
    are common and track with earlier onset and worse outcome.
  evidence:
  - reference: PMID:16773573
    reference_title: DSG2 mutations contribute to arrhythmogenic right ventricular dysplasia/cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four probands with ARVD/C caused by mutations in DSG2, which
      encodes desmoglein-2, a component of the cardiac desmosome.
    explanation: >-
      The original report establishing DSG2 as a disease gene for desmosomal
      cardiomyopathy.
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 181 (66.8%) individuals carried missense variants, mainly
      distributed in the extracellular domains.
    explanation: >-
      Establishes the missense predominance and the extracellular-domain
      clustering described in this genetic block.
  - reference: PMID:23381804
    reference_title: Mutated desmoglein-2 proteins are incorporated into desmosomes and exhibit dominant-negative effects in arrhythmogenic right ventricular cardiomyopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results suggested a dominant-negative effect of the mutated DSG2
      proteins because they were incorporated into the desmosomes.
    explanation: >-
      Directly supports the dominant-negative mechanism asserted for missense
      alleles, and gives the reason - mutant protein reaches the junction rather
      than being degraded.
  - reference: PMID:23381804
    reference_title: Mutated desmoglein-2 proteins are incorporated into desmosomes and exhibit dominant-negative effects in arrhythmogenic right ventricular cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results and further mutation analyses of four additional desmosomal
      genes indicated that ARVC caused by DSG2 mutations is often transmitted by
      recessive or digenic inheritance.
    explanation: >-
      Independent support for the recessive inheritance arm of this entry, from a
      mutation-analysis cohort rather than from the two-family recessive report.
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple-variant carriers were significantly younger at ARVC diagnosis
      compared with single-variant carriers
    explanation: >-
      Supports the statement that multiple variants track with earlier onset.
  case_fractions:
  - population: Unselected idiopathic dilated cardiomyopathy referral cohort (UK)
    case_fraction_percent: 5.0
    cohort_size: 100
    notes: >-
      Share attributable to all five desmosomal genes screened together
      (plakoglobin, desmoplakin, plakophilin-2, desmoglein-2, desmocollin-2),
      not to DSG2 alone. Recorded here because it is the best available
      denominator for how often a desmosomal lesion underlies an unequivocal
      dilated cardiomyopathy presentation; the DSG2-only fraction is smaller
      and is not separately reported.
    evidence:
    - reference: PMID:20716751
      reference_title: Prevalence of desmosomal protein gene mutations in patients with dilated cardiomyopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of the 100 patients (mean age at evaluation, 46.8+/-13.8 years; range,
        17.0 to 72.8 years; male sex, 63%), 5 were found to carry pathogenic
        desmosomal protein gene mutations.
      explanation: >-
        Gives the numerator and denominator for the desmosomal share of
        consecutive idiopathic dilated cardiomyopathy referrals.
prevalence:
- population: Chinese multicenter DSG2 p.Phe531Cys founder variant cohort
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Not a population rate. Recorded as the proportion of a genotype-defined
    cohort showing biventricular involvement, which is the feature that places
    a DSG2 carrier in this entry rather than in the right-dominant
    arrhythmogenic parent entry.
  evidence:
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most subjects (74.7%) showed right ventricular dilatation, and nearly half
      (49.5%) had biventricular involvement.
    explanation: >-
      Quantifies how frequently DSG2 disease reaches biventricular involvement
      in a founder-variant cohort.
- population: Pooled international DSG2-associated arrhythmogenic cardiomyopathy series
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Proportion of a 202-patient pooled genotype-defined cohort with a
    biventricular phenotype, and the proportion developing heart failure over a
    median 92.8 months.
  evidence:
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the patients exhibited a right-dominant (38.1%) or biventricular
      (31.2%) phenotype.
    explanation: >-
      Establishes that a biventricular phenotype accounts for roughly a third of
      DSG2 disease, which is the population this entry describes.
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a median follow-up of 92.8 months, 35.3% of patients experienced
      LTVAs, and 10.9% developed HF.
    explanation: >-
      Gives the heart-failure and arrhythmia event rates over long follow-up.
pathophysiology:
- name: DSG2 Loss of Function at the Cardiac Desmosome
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  description: >-
    Pathogenic DSG2 alleles reduce the amount of functional desmoglein-2
    available to the cardiomyocyte desmosome. Truncating, splice and deletion
    alleles remove the protein outright; extracellular-domain missense alleles
    produce protein that is still incorporated into the junction but cannot
    perform calcium-dependent trans-adhesion to desmocollin-2, so the effect is
    dominant-negative and dose-dependent. This is the initiating molecular
    lesion of the entry.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DSG2
    term:
      id: hgnc:3049
      label: DSG2
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: cadherin binding
    term:
      id: GO:0045296
      label: cadherin binding
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:33949662
    reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified a homozygous stop-gain mutations in DSG2 (c.C355T, p.R119X)
      that led to complete desmoglein-2 deficiency in a patient with severe
      biventricular heart failure
    explanation: >-
      Directly links a DSG2 null genotype to complete loss of the protein and to
      the biventricular failure phenotype this entry curates.
  - reference: PMID:19635863
    reference_title: Myocyte necrosis underlies progressive myocardial dystrophy in mouse dsg2-related arrhythmogenic right ventricular cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Investigation of transgenic lines with different levels of transgene
      expression attested to a dose-dependent dominant-negative effect of the
      mutation.
    explanation: >-
      Supports the dominant-negative, dose-dependent character of missense DSG2
      alleles asserted in this node.
  downstream:
  - target: Intercalated Disc Desmosome Destabilization
    causal_link_type: DIRECT
    description: >-
      Absent or non-adhesive desmoglein-2 leaves the intercalated disc unable to
      assemble structurally normal desmosomes.
    evidence:
    - reference: PMID:33949662
      reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Histological analysis revealed abnormal deposition of desmosome proteins,
        disrupted intercalated disk structures in the myocardium.
      explanation: >-
        Shows the desmoglein-2-null myocardium has structurally disrupted
        intercalated discs, which is the step from lesion to junctional failure.
  - target: Mutant DSG2 Protein Misfolding in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      A branch taken only by misfolding missense alleles. The mutant protein is
      retained and recognised in the endoplasmic reticulum rather than reaching
      the junction, so this route is not available to null alleles that produce
      no protein at all.
    evidence:
    - reference: PMID:39227800
      reference_title: Hyperactivation of ATF4/TGF-β1 signaling contributes to the progressive cardiac fibrosis in Arrhythmogenic cardiomyopathy caused by DSG2 Variant.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistic investigations revealed that the variant DSG2-F536C protein
        underwent misfolding, leading to its recognition by BiP within the
        endoplasmic reticulum, which triggered endoplasmic reticulum stress,
        activated the PERK-ATF4 signaling pathway and increased ATF4 levels in
        cardiomyocytes.
      explanation: >-
        States that the pathogenic allele's protein product misfolds and is
        recognised by BiP in the endoplasmic reticulum, which is this edge from
        the allele to the misfolding node.

- name: Intercalated Disc Desmosome Destabilization
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  description: >-
    Desmosomes at the intercalated disc are reduced in number, structurally
    abnormal, or absent, and the intercellular space at the desmosome and
    adherens-junction level widens. Because the cardiac intercalated disc is an
    area composita in which desmosomal and adherens-junction components are
    intermingled, the destabilisation is not confined to the desmosome proper;
    it also perturbs the junctional protein complexes that the sodium channel
    and gap junctions depend on. This node is the branch point of the entry.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: DECREASED
  cellular_components:
  - preferred_term: adherens junction
    term:
      id: GO:0005912
      label: adherens junction
  evidence:
  - reference: PMID:26085008
    reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopy revealed absence of desmosome-like structures and
      regional loss of intercalated disc adhesion.
    explanation: >-
      Direct ultrastructural demonstration that cardiomyocyte-specific Dsg2 loss
      abolishes desmosomes at the intercalated disc.
  - reference: PMID:22764152
    reference_title: Intercalated disc abnormalities, reduced Na(+) current density, and conduction slowing in desmoglein-2 mutant mice prior to cardiomyopathic changes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Assessment by electron microscopy established that intercellular space
      widening at the desmosomes/adherens junctions occurred in Tg-NS/L mice
      before the onset of necrosis and fibrosis.
    explanation: >-
      Establishes that junctional widening precedes cell death, so this node is
      genuinely upstream of the necrosis node rather than a consequence of it.
  - reference: PMID:28764973
    reference_title: Disturbed Desmoglein-2 in the intercalated disc of pediatric patients with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests that the architecture of desmosomes is already disturbed in
      the early stages of DCM.
    explanation: >-
      Human pediatric dilated cardiomyopathy tissue showing desmosomal
      architecture is disturbed early, supporting this node's placement upstream
      in a dilated rather than purely arrhythmogenic phenotype.
  downstream:
  - target: Mechanical Uncoupling of Cardiomyocytes
    causal_link_type: DIRECT
    description: >-
      Loss of the load-bearing junction removes mechanical continuity between
      adjacent cardiomyocytes.
    evidence:
    - reference: PMID:26085008
      reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We propose that loss of Dsg2 compromises adhesion, and that this is a
        major pathogenic mechanism in DSG2-related and probably other
        desmosome-related ACs.
      explanation: >-
        States the adhesion-loss step as the major pathogenic mechanism, which is
        exactly this edge.
  - target: Sodium Current Reduction and Conduction Slowing
    causal_link_type: DIRECT
    description: >-
      Junctional destabilisation perturbs the Nav1.5 sodium channel complex that
      is co-located at the intercalated disc, independently of and earlier than
      any structural myocardial damage.
    evidence:
    - reference: PMID:22764152
      reference_title: Intercalated disc abnormalities, reduced Na(+) current density, and conduction slowing in desmoglein-2 mutant mice prior to cardiomyopathic changes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, co-immunoprecipitation demonstrated an in vivo interaction
        between Dsg2 and the Na(+) channel protein Na(V)1.5.
      explanation: >-
        Provides the molecular basis for the junction-to-sodium-current edge by
        demonstrating a physical Dsg2-NaV1.5 interaction in vivo.
  - target: Plakoglobin Nuclear Redistribution
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Destabilisation of the junctional plaque is the proposed route by which
      plakoglobin becomes available to the nucleus. This edge is the contested
      arm of the entry - see the discussions block.
  - target: Cardiomyocyte NF-kappaB Activation
    causal_link_type: DIRECT
    description: >-
      Desmosomal disruption activates innate immune signalling within the
      cardiomyocyte itself, before and independently of any infiltrating
      inflammatory cell.
  - target: Connexin-43 Gap Junction Remodeling
    causal_link_type: DIRECT
    description: >-
      The mechanical junction and the gap junction share the intercalated disc
      and are interdependent, so loss of desmosomal anchorage is followed by
      mislocalisation and loss of connexin-43 from the disc.
    evidence:
    - reference: PMID:32376797
      reference_title: Stabilization of desmoglein-2 binding rescues arrhythmia in arrhythmogenic cardiomyopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Dsg2-LP rescued connexin-43 mislocalization and conduction
        irregularities in response to impaired cardiomyocyte cohesion.
      explanation: >-
        Rescue of connexin-43 localisation by restoring desmoglein-2 binding
        establishes the direction of this edge - the adhesion defect causes the
        gap junction defect, not the reverse.

- name: Mechanical Uncoupling of Cardiomyocytes
  conforms_to: "desmosomal_adhesion_failure#Loss of Desmosomal Intercellular Adhesion"
  description: >-
    Adjacent cardiomyocytes are no longer mechanically coupled and the
    myocardium cannot distribute contractile load across the syncytium.
    Tissue-level force generation falls and the tissue becomes fragile under
    the repeated mechanical demand of contraction, which is why exercise is a
    disease modifier rather than an incidental exposure.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: calcium-dependent cell-cell adhesion
    term:
      id: GO:0016339
      label: calcium-dependent cell-cell adhesion
    modifier: DECREASED
  evidence:
  - reference: PMID:33949662
    reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Micro-force testing of three-dimensional self-organized tissue rings
      (SOTRs) revealed tissue fragility and a weak maximum force in SOTRs from
      R119X-iPSC-CMs.
    explanation: >-
      Direct mechanical measurement in patient-derived human tissue showing that
      desmoglein-2 loss produces a fragile, weakly contracting tissue.
  downstream:
  - target: Cardiomyocyte Necrosis
    causal_link_type: DIRECT
    description: >-
      Mechanically uncoupled myocytes detach and die under continued
      contractile load.
    evidence:
    - reference: PMID:19635863
      reference_title: Myocyte necrosis underlies progressive myocardial dystrophy in mouse dsg2-related arrhythmogenic right ventricular cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrate for the first time that myocyte necrosis is the key
        initiator of myocardial injury, triggering progressive myocardial damage,
        including an inflammatory response and massive calcification within the
        myocardium, followed by injury repair with fibrous tissue replacement,
        and myocardial atrophy.
      explanation: >-
        Places myocyte necrosis as the initiating injury downstream of the
        adhesion defect and upstream of inflammation and fibrous replacement.

- name: Sodium Current Reduction and Conduction Slowing
  description: >-
    Sodium current density falls and action potential upstroke velocity is
    reduced, slowing conduction longitudinally and transversally and increasing
    arrhythmia inducibility. Crucially this occurs before necrosis and
    replacement fibrosis, so the arrhythmic substrate is not simply a scar
    phenomenon - it is an early, potentially reversible electrical consequence
    of junctional disruption. This is the mechanistic reason a DSG2 carrier can
    die suddenly with a structurally near-normal heart.
  role: effector
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ventricular cardiac muscle cell
    term:
      id: CL:2000046
      label: ventricular cardiac muscle cell
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22764152
    reference_title: Intercalated disc abnormalities, reduced Na(+) current density, and conduction slowing in desmoglein-2 mutant mice prior to cardiomyopathic changes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

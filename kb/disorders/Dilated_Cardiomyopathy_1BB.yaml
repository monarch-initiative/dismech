    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      De-repression of the adipogenic and fibrogenic program is the proposed
      route to fatty replacement. Marked INDIRECT because the DSG2-specific link
      rests on extrapolation from desmoplakin work.

- name: Cardiomyocyte NF-kappaB Activation and CCR2+ Macrophage Recruitment
  description: >-
    NF-kappaB signalling is activated in the desmosome-deficient cardiomyocyte
    under basal conditions, without an external immune stimulus, and this
    cell-autonomous innate immune response is what mobilises CCR2-expressing
    macrophages into the affected myocardium. The recruited macrophages then
    mediate myocardial injury and arrhythmia and reprogram the transcriptional
    state of both cardiomyocytes and fibroblasts. This makes inflammation a
    driver of the disease rather than a reaction to it, and it is the reason
    DSG2 disease can present as an apparent myocarditis.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  - preferred_term: CCR2-expressing macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: positive regulation of canonical NF-kappaB signal transduction
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    modifier: INCREASED
  evidence:
  - reference: PMID:38564300
    reference_title: NFĸB signaling drives myocardial injury via CCR2+ macrophages in a preclinical model of arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that NFκB signaling in cardiac myocytes drives myocardial injury,
      contractile dysfunction, and arrhythmias in Dsg2mut/mut mice.
    explanation: >-
      Genetic demonstration in a Dsg2 mutant model that cardiomyocyte NF-kappaB
      signalling is causal for injury, dysfunction and arrhythmia.
  - reference: PMID:38564300
    reference_title: NFĸB signaling drives myocardial injury via CCR2+ macrophages in a preclinical model of arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NFκB signaling in cardiac myocytes mobilizes macrophages expressing C-C
      motif chemokine receptor-2 (CCR2+ cells) to affected areas within the
      heart, where they mediate myocardial injury and arrhythmias.
    explanation: >-
      Establishes the cardiomyocyte-to-macrophage recruitment step this node
      describes and that the recruited cells themselves mediate injury.
  downstream:
  - target: Cardiomyocyte Necrosis and Aseptic Inflammation
    causal_link_type: DIRECT
    description: >-
      Recruited CCR2+ macrophages mediate the myocardial injury.
  - target: Progressive Contractile Dysfunction and Heart Failure
    causal_link_type: DIRECT
    description: >-
      Inflammation depresses contractility in viable muscle, so contractile
      failure is not solely explained by loss of myocardium.
    evidence:
    - reference: PMID:38564300
      reference_title: NFĸB signaling drives myocardial injury via CCR2+ macrophages in a preclinical model of arrhythmogenic cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Contractile dysfunction in Dsg2mut/mut mice is caused both by loss of
        heart muscle and negative inotropic effects of inflammation in viable
        muscle.
      explanation: >-
        Explicitly separates the inflammatory contribution to contractile
        failure from the structural one, which is what this edge asserts.

- name: Misfolded DSG2 ER Stress and PERK-ATF4-TGF-beta1 Signaling
  description: >-
    A parallel, allele-specific route to fibrosis that does not run through
    adhesion loss. Certain missense DSG2 variants misfold in the endoplasmic
    reticulum, are bound by BiP, and trigger ER stress with activation of
    PERK-ATF4. ATF4 then drives TGF-beta1 expression in the cardiomyocyte,
    which activates cardiac fibroblasts by paracrine signalling. This matters
    mechanistically because it makes fibrosis a direct consequence of the
    mutant protein's folding behaviour rather than only a repair response to
    myocyte death, and because inhibiting the pathway attenuated fibrosis in
    the corresponding knock-in mouse.
  role: modifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: endoplasmic reticulum unfolded protein response
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
  evidence:
  - reference: PMID:39227800
    reference_title: Hyperactivation of ATF4/TGF-β1 signaling contributes to the progressive cardiac fibrosis in Arrhythmogenic cardiomyopathy caused by DSG2 Variant.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistic investigations revealed that the variant DSG2-F536C protein
      underwent misfolding, leading to its recognition by BiP within the
      endoplasmic reticulum, which triggered endoplasmic reticulum stress,
      activated the PERK-ATF4 signaling pathway and increased ATF4 levels in
      cardiomyocytes.
    explanation: >-
      Establishes the misfolding-to-ER-stress-to-PERK-ATF4 chain that defines
      this node.
  downstream:
  - target: Fibrofatty Myocardial Replacement
    causal_link_type: DIRECT
    description: >-
      ATF4-driven TGF-beta1 from the cardiomyocyte activates cardiac
      fibroblasts by paracrine signalling.
    evidence:
    - reference: PMID:39227800
      reference_title: Hyperactivation of ATF4/TGF-β1 signaling contributes to the progressive cardiac fibrosis in Arrhythmogenic cardiomyopathy caused by DSG2 Variant.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Increased ATF4 facilitated the expression of TGF-β1 in cardiomyocytes,
        thereby activating cardiac fibroblasts through paracrine signaling and
        ultimately promoting cardiac fibrosis in Dsg2F536C/F536C mice.
      explanation: >-
        States the cardiomyocyte-to-fibroblast paracrine step and its fibrotic
        outcome, which is exactly this edge.


- name: Biventricular Remodeling and Chamber Dilation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    The ventricles dilate. In the presentation this entry curates, the left
    ventricle is involved either dominantly or together with the right, which is
    what distinguishes CMD1BB from the classical right-dominant arrhythmogenic
    picture. Biventricular involvement is the phenotype that predicts heart
    failure progression in DSG2 disease.
  role: central_effector
  biological_scale: TISSUE
  cell_types:

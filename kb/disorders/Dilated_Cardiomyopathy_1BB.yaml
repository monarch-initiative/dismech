notes: >-
  Relationship to neighbouring dismech entries. This entry is the DSG2
  dilated/left-dominant phenotype and is deliberately distinct from
  Arrhythmogenic_Right_Ventricular_Cardiomyopathy, which is the right-dominant
  arrhythmogenic parent and names DSG2 as one of five desmosomal genes
  alongside PKP2, DSP, DSC2 and JUP. It is also distinct from the two
  gene-specific arrhythmogenic entries, PKP2_Cardiomyopathy and
  DSP_Cardiomyopathy, which curate different desmosomal proteins with
  different phenotypic biases; DSG2/DSC2 carriers carry a significantly higher
  risk of end-stage heart failure than PKP2 carriers, which is the clinical
  reason the DSG2 dilated presentation is worth separating rather than folding
  into the arrhythmogenic parent. Dilated_Cardiomyopathy is the
  non-gene-specific parent phenotype and Dilated_Cardiomyopathy_1A is the
  LMNA-related numbered entry; neither carries desmosomal mechanism. What this
  entry adds that none of those carry is the desmosomal-cadherin route
  specifically into a dilated rather than right-dominant phenotype, together
  with the allele-dose contrast between heterozygous adult-onset and biallelic
  early-onset disease.

  Nosological caveat. The right-dominant, biventricular and left-dominant
  presentations of DSG2 disease are a continuum rather than separate diseases,
  and current literature increasingly uses the umbrella term arrhythmogenic
  cardiomyopathy for all of them. CMD1BB is the OMIM/MONDO label for the
  dilated end of that continuum, and this entry curates it as such; a reader
  interested in the right-dominant end should read
  Arrhythmogenic_Right_Ventricular_Cardiomyopathy alongside it. The
  distinction curated here is phenotypic emphasis, not a claim that two
  mechanistically separate diseases exist.

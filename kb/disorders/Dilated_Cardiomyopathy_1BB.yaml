    transcriptional one: cardiac Dsg2 deletion impairs mTOR-4EBP1-PPAR-alpha
    signalling and hence fatty acid beta-oxidation, so lipid accumulates in the
    myocardium. Fibrogenesis is driven through TGF-beta/Smad3 signalling. The
    resulting tissue is both non-contractile and electrically inhomogeneous.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: fibroblast of cardiac tissue
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:40019607
    reference_title: SFRP4 Knockdown Attenuates Dsg2-Deficient Arrhythmogenic Cardiomyopathy by Down-Regulating TGF-β and Smad3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      SFRP4 knockdown markedly reduced myocardial fibrosis, ventricular
      compliance, and cardiac dilation in Dsg2-/- mice.
    explanation: >-
      Interventional evidence in the Dsg2 knockout that the fibrotic and dilated
      phenotype is driven by an identifiable profibrotic signal rather than being
      passive scarring.
  - reference: PMID:36815030
    reference_title: Reactivation of PPARα alleviates myocardial lipid accumulation and cardiac dysfunction by improving fatty acid β-oxidation in Dsg2-deficient arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrated that these phenotypes were caused by decline of fatty acid
      (FA) β-oxidation resulted from impaired mammalian target of rapamycin
      (mTOR) signaling.
    explanation: >-
      Supports the metabolic contribution to myocardial lipid accumulation
      claimed in this node, distinct from the transcriptional adipogenesis route.
  downstream:
  - target: Biventricular Remodeling and Chamber Dilation
    causal_link_type: DIRECT
    description: >-
      Replacement of contractile myocardium by non-contractile tissue drives
      chamber dilation.
    evidence:
    - reference: PMID:19635863
      reference_title: Myocyte necrosis underlies progressive myocardial dystrophy in mouse dsg2-related arrhythmogenic right ventricular cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic mice recapitulated the clinical features of ARVC, including
        sudden death at young age, spontaneous ventricular arrhythmias, cardiac
        dysfunction, and biventricular dilatation and aneurysms.
      explanation: >-
        Links the myocardial damage process to biventricular dilatation, the
        defining structural feature of this entry.
  - target: Ventricular tachycardia
    causal_link_type: DIRECT
    description: >-
      Fibrofatty tissue interposed between surviving myocyte bundles creates the
      re-entrant substrate for scar-related ventricular tachycardia.

- name: Biventricular Remodeling and Chamber Dilation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    The ventricles dilate. In the presentation this entry curates, the left
    ventricle is involved either dominantly or together with the right, which is
    what distinguishes CMD1BB from the classical right-dominant arrhythmogenic
    picture. Biventricular involvement is the phenotype that predicts heart
    failure progression in DSG2 disease.
  role: central_effector
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ventricular cardiac muscle cell
    term:
      id: CL:2000046
      label: ventricular cardiac muscle cell
  evidence:
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with LTVAs had more severe right ventricular dysfunction, whereas
      those developing HF exhibited biventricular involvement.
    explanation: >-
      Establishes that biventricular remodeling, not right-dominant disease, is
      the substrate for heart failure progression - the clinical rationale for
      separating this entry from the right-dominant parent.
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 81 individuals for whom both left ventricular ejection fraction
      and right ventricular fractional area change data were available at
      presentation, 29 (35.8%) had isolated right ventricular dysfunction, and 16
      (19.8%) had biventricular dysfunction.
    explanation: >-
      Quantifies how often DSG2/DSC2 disease presents with biventricular rather
      than isolated right ventricular dysfunction.
  downstream:
  - target: Progressive Contractile Dysfunction and Heart Failure
    causal_link_type: DIRECT
    description: >-
      A dilated, fibrotically remodeled ventricle progressively loses systolic
      function.

- name: Progressive Contractile Dysfunction and Heart Failure
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  description: >-
    Systolic function declines and clinical heart failure supervenes. DSG2 and
    DSC2 carriers reach end-stage heart failure significantly more often than
    PKP2 carriers do, which is the principal prognostic difference between this
    entry and PKP2_Cardiomyopathy. Biallelic carriers reach this endpoint
    earlier and more frequently than heterozygotes.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with PKP2 patients, DSG2/DSC2 patients exhibited a significantly
      higher risk of end-stage heart failure (P<0.001).
    explanation: >-
      Direct comparative evidence for the prognostic distinction from the PKP2
      entry asserted in this node.
  - reference: PMID:33949662
    reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm the presence of a desmoglein-2-deficient
      cardiomyopathy among clinically diagnosed dilated cardiomyopathies.
    explanation: >-
      The clearest statement in the literature that desmoglein-2 deficiency
      belongs among the dilated cardiomyopathies, which is the identity claim of
      this entry.
  downstream:
  - target: Congestive heart failure
    causal_link_type: DIRECT
    description: >-
      Falling systolic function manifests clinically as congestive heart failure.
phenotypes:
- category: Cardiac
  name: Dilated cardiomyopathy
  description: >-
    Left ventricular or biventricular dilation with impaired systolic function.
    This is the defining phenotype of the entry and what separates it from
    right-dominant arrhythmogenic disease.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:20716751
    reference_title: Prevalence of desmosomal protein gene mutations in patients with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study suggests that both clinical presentations can be caused by
      mutations in desmosomal protein genes.
    explanation: >-
      Establishes that a dilated, poorly contracting left ventricle and
      right-dominant arrhythmogenic disease are alternative presentations of the
      same desmosomal lesion, which is the premise of this entry.
  - reference: PMID:33949662
    reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm the presence of a desmoglein-2-deficient
      cardiomyopathy among clinically diagnosed dilated cardiomyopathies.
    explanation: >-
      Confirms that DSG2 deficiency is found among patients carrying a clinical
      diagnosis of dilated cardiomyopathy.
  - reference: PMID:31078652
    reference_title: "2019 HRS expert consensus statement on evaluation, risk stratification, and management of arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ACM phenotype overlaps with other cardiomyopathies, particularly
      dilated cardiomyopathy with arrhythmia presentation that may be associated
      with ventricular dilatation and/or impaired systolic function.
    explanation: >-
      The governing consensus document states the ACM-to-dilated-cardiomyopathy
      overlap in exactly the terms this entry is scoped to - ventricular
      dilatation with impaired systolic function in a patient who would
      otherwise be classified as arrhythmogenic. Graded OTHER because it is
      expert consensus rather than a primary study.
  sequelae:
  - target: Congestive heart failure
    description: >-
      Progressive chamber dilation with systolic failure decompensates into
      clinical heart failure.
- category: Cardiac
  name: Reduced left ventricular ejection fraction
  description: >-
    Impaired left ventricular systolic function. In DSG2 disease this may be
    present at diagnosis or develop during follow-up, and is more common and
    more severe in carriers of multiple variants.
  phenotype_term:
    preferred_term: Reduced left ventricular ejection fraction
    term:
      id: HP:0012664
      label: Reduced left ventricular ejection fraction
  evidence:
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with single-variant carriers, those with multiple variants were
      more likely to be diagnosed with ARVC (96.2% versus 64.8%; P<0.001) and
      exhibited more severe left ventricular dysfunction (44.4% versus 22.1%;
      P=0.001)
    explanation: >-
      Quantifies left ventricular dysfunction and its dependence on variant
      burden.
- category: Cardiac
  name: Right ventricular dilatation
  description: >-
    Right ventricular dilation, present in the large majority of DSG2 carriers
    even where the left ventricle is also involved. Its high frequency is why
    DSG2 disease sits on a continuum with the arrhythmogenic parent entry rather
    than being a purely left-sided disease.
  phenotype_term:
    preferred_term: Right ventricular dilatation
    term:
      id: HP:0005133
      label: Right ventricular dilatation
  evidence:
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most subjects (74.7%) showed right ventricular dilatation, and nearly half
      (49.5%) had biventricular involvement.
    explanation: >-
      Gives the frequency of right ventricular dilatation in a genotype-defined
      DSG2 cohort.
- category: Cardiac
  name: Ventricular tachycardia
  description: >-
    Sustained and non-sustained ventricular tachycardia. Life-threatening
    ventricular arrhythmia is the single most common mode of clinical
    presentation in DSG2 disease, and non-sustained ventricular tachycardia on
    Holter monitoring is an independent predictor of major adverse
    cardiovascular events.
  phenotype_term:
    preferred_term: Ventricular tachycardia
    term:
      id: HP:0004756
      label: Ventricular tachycardia
  evidence:
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life-threatening ventricular arrhythmias (LTVAs) were the most common
      clinical presentation (25.8%).
    explanation: >-
      Establishes ventricular arrhythmia as the commonest presenting feature.
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-sustained ventricular tachycardia on Holter monitoring was the only
      independent predictor of MACE.
    explanation: >-
      Supports the prognostic role of non-sustained ventricular tachycardia
      stated in this phenotype's description.
  sequelae:
  - target: Sudden cardiac death
    description: >-
      Degeneration of ventricular tachycardia into ventricular fibrillation is
      the mechanism of sudden death in this disease.
- category: Cardiac
  name: Sudden cardiac death
  description: >-
    Sudden arrhythmic death, which may be the first manifestation of disease.
    Premature cardiac death before age 65 occurred in a fifth of diagnosed
    DSG2/DSC2 cases.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 200 cases with diagnosed ARVC, 41 (20.5%) experienced premature
      cardiac death before the age of 65.
    explanation: >-
      Quantifies premature cardiac death in a DSG2/DSC2-defined cohort.
- category: Cardiac
  name: Congestive heart failure
  description: >-
    Clinical heart failure from progressive biventricular systolic dysfunction.
    It develops in about one in ten DSG2 carriers over long follow-up, and much
    more often in those with biallelic or multiple variants.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a median follow-up of 92.8 months, 35.3% of patients experienced
      LTVAs, and 10.9% developed HF.
    explanation: >-
      Gives the incidence of heart failure over long follow-up in DSG2 disease.
- category: Cardiac
  name: T-wave inversion
  description: >-
    Repolarisation abnormality on the surface ECG, more frequent in compound
    heterozygous and homozygous carriers than in single heterozygotes, so it is
    part of the allele-dose gradient rather than a uniform feature.
  phenotype_term:
    preferred_term: T-wave inversion
    term:
      id: HP:0010872
      label: T-wave inversion
  evidence:
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with single heterozygous variant carriers, compound and homozygous
      variant carriers had a younger age at onset, more T-wave inversion, epsilon
      waves, and biventricular involvement (all pairwise P < .05).
    explanation: >-
      Reports T-wave inversion and its dependence on allele dose.
- category: Cardiac
  name: Myocardial fibrosis
  description: >-
    Interstitial and replacement fibrosis of the ventricular myocardium,
    detectable as late gadolinium enhancement on cardiac magnetic resonance and
    histologically in explanted or biopsied tissue.
  phenotype_term:
    preferred_term: Myocardial fibrosis
    term:
      id: HP:0001685
      label: Myocardial fibrosis
  evidence:
  - reference: PMID:26085008
    reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      All animals developed AC during postnatal growth with pronounced chamber
      dilation, calcifying cardiomyocyte necrosis, aseptic inflammation,
      interstitial and focal replacement fibrosis, and conduction defects with
      altered connexin 43 distribution.
    explanation: >-
      Names both fibrosis patterns - interstitial and focal replacement - and
      reports that every animal in the cardiomyocyte-specific Dsg2 knockout
      developed them alongside chamber dilation.
  - reference: PMID:28764973
    reference_title: Disturbed Desmoglein-2 in the intercalated disc of pediatric patients with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endocardial and transmural fibrosis was increased in all pediatric DCM
      patients compared to age-matched controls.
    explanation: >-
      Human tissue evidence of fibrosis in dilated cardiomyopathy with reduced
      desmoglein-2 signal.
has_subtypes:
- name: Biallelic
  display_name: Biallelic DSG2 loss of function (early onset)
  description: >-
    Homozygous, compound heterozygous, or hemizygous loss of DSG2 function.
    Presents earlier, with more ECG abnormality and more biventricular
    involvement, and progresses to end-stage heart failure and transplantation
    far more often than the monoallelic form. Obligate heterozygous relatives
    are typically unaffected, so these families often present without a family
    history and the disease can be mistaken for sporadic myocarditis.
  evidence:
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous variant carriers experienced significantly earlier MVA than
      compound (P = .013) and single heterozygous variant carriers (P < .001)
    explanation: >-
      Direct evidence for the allele-dose gradient in timing of malignant
      ventricular arrhythmia.
  - reference: PMID:33917638
    reference_title: Hemi- and Homozygous Loss-of-Function Mutations in DSG2 (Desmoglein-2) Cause Recessive Arrhythmogenic Cardiomyopathy with an Early Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of note, this genetic strategy revealed a homozygous splice site mutation
      (DSG2-c.378+1G>T) in the first patient and a nonsense mutation
      (DSG2-p.L772X) in combination with a large deletion in DSG2 in the second
      one.
    explanation: >-
      Documents both the homozygous and the hemizygous (point mutation unmasked
      by deletion) routes to biallelic loss described in this subtype.
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygous variants in DSG2, a desmosomal protein, are associated with a
      severe form of biventricular arrhythmogenic cardiomyopathy (ACM).
    explanation: >-
      States the homozygous-to-severe-biventricular association that defines this
      subtype.
- name: Monoallelic
  display_name: Heterozygous DSG2 variant (adult onset)
  description: >-
    A single pathogenic DSG2 allele. Later onset, milder phenotype, and a
    relatively favourable prognosis; in the Chinese founder-variant cohort
    single heterozygotes remained free of end-stage heart failure and composite
    events entirely. Penetrance is incomplete and strongly modified by exercise
    exposure.
  evidence:
  - reference: PMID:41662985
    reference_title: "Clinical features and outcome of arrhythmogenic cardiomyopathy because of a desmoglein-2 founder variant: A multicenter study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single heterozygous variant carriers held a less severe phenotype and
      relatively favorable prognosis, whereas compound and homozygous variant
      carriers held an advanced phenotype and poorer prognosis.
    explanation: >-
      States the monoallelic-versus-biallelic prognostic contrast that defines
      these two subtypes.
environmental:
- name: Endurance and high-intensity exercise
  description: >-
    Exercise is the principal environmental modifier of desmosomal
    cardiomyopathy. Because the underlying lesion is a failure of mechanical
    coupling, repeated high wall-stress loading accelerates myocyte detachment
    and death. Endurance athletes carrying desmosomal mutations become
    symptomatic younger, meet diagnostic criteria more often, and have worse
    arrhythmia-free and heart-failure-free survival; reducing exercise lowers
    subsequent arrhythmic risk. This makes exercise restriction a genuine
    disease-modifying intervention rather than generic advice.
  evidence:
  - reference: PMID:23871885
    reference_title: Exercise increases age-related penetrance and arrhythmic risk in arrhythmogenic right ventricular dysplasia/cardiomyopathy-associated desmosomal mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endurance exercise and frequent exercise increase the risk of VT/VF, HF,
      and ARVD/C in desmosomal mutation carriers.
    explanation: >-
      Establishes exercise as a modifier of penetrance and arrhythmic risk in
      desmosomal mutation carriers, the class this entry belongs to.
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-variant carriers who engaged in intense physical exercise were
      younger at disease onset compared with those who did not (P=0.001).
    explanation: >-
      DSG2/DSC2-specific evidence that exercise brings disease onset forward,
      rather than relying only on the mixed-desmosomal-gene cohort above.
  influences_mechanisms:
  - target: Mechanical Uncoupling of Cardiomyocytes
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      High-intensity and endurance exercise raise ventricular wall stress and so
      increase the mechanical load borne by an already weakened intercalated
      disc, accelerating myocyte detachment.
    evidence:
    - reference: PMID:23871885
      reference_title: Exercise increases age-related penetrance and arrhythmic risk in arrhythmogenic right ventricular dysplasia/cardiomyopathy-associated desmosomal mutation carriers.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among individuals in the top quartile, a reduction in exercise decreased
        VT/VF risk (p = 0.04).
      explanation: >-
        The reversibility of risk on reducing exercise supports mechanical load
        acting on the disease substrate. Graded INDIRECT because the measured
        outcome is arrhythmic risk, not the adhesion node itself.
diagnosis:
- name: Cardiac magnetic resonance imaging with late gadolinium enhancement
  description: >-
    The modality that decides this entry. Echocardiography establishes that the
    ventricle is dilated and hypocontractile but cannot say why; CMR resolves
    the fibrofatty tissue characterisation - non-ischaemic mid-myocardial and
    epicardial late gadolinium enhancement, fatty infiltration, regional
    dyskinesia - that separates a DSG2 desmosomal cardiomyopathy from an
    otherwise identical idiopathic dilated cardiomyopathy. In the left-dominant
    presentation this entry curates, CMR is often what converts a working
    diagnosis of dilated cardiomyopathy into arrhythmogenic cardiomyopathy.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent CMR imaging confirmed the diagnosis of left-dominant ACM by
      demonstrating regional biventricular dyskinesia and a characteristic
      pattern of fibrofatty myocardial replacement.
    explanation: >-
      In a DSG2 carrier initially classified as dilated cardiomyopathy, CMR was
      the study that made the diagnosis, which is the claim this entry makes.
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac magnetic resonance confirmed severe right ventricular dilatation
      and dysfunction with apical akinesia and diffuse late gadolinium
      enhancement (LGE) of the RV without signs of a shunt.
    explanation: >-
      Independent human case showing the chamber and late-gadolinium findings
      CMR contributes in DSG2 disease.
  notes: >-
    Late gadolinium enhancement is not currently accepted as a stand-alone
    diagnostic criterion for left-dominant disease. The same case report that
    demonstrates CMR making the diagnosis also records that the patient failed
    the structural criteria of the 2010 modified Task Force criteria because her
    right ventricle was preserved - see the Task Force criteria entry below.
- name: 12-lead electrocardiography
  description: >-
    Repolarisation and depolarisation abnormalities - precordial T-wave
    inversion, low QRS voltages, fragmented QRS, epsilon waves - are the
    cheapest and earliest disease signal, and their burden tracks with allele
    dose. The ECG is also the screening instrument used in genotype-positive
    relatives before any structural change is detectable.
  diagnosis_term:
    preferred_term: 12-lead electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:41652012
    reference_title: Integrative genomic and literature assessment of desmoglein 2-related arrhythmogenic cardiomyopathy with Italian cohort validation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our Padua cohort, most DSG2 carriers met the revised Task Force
      criteria (2010TFC), with classical features such as precordial T-wave
      inversion, RV dilation, and dysfunction
    explanation: >-
      Establishes precordial T-wave inversion as a classical and frequent ECG
      finding in a genotype-defined DSG2 cohort.
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The electrocardiogram in sinus rhythm showed large P waves, normal PR
      interval with peripheral low voltage, a fragmented QRS interval, and
      T-wave inversions in V1 to V5
    explanation: >-
      Worked example of the depolarisation and repolarisation abnormalities
      recorded in a homozygous DSG2 carrier.
- name: Ambulatory Holter electrocardiographic monitoring
  description: >-
    Twenty-four-hour and longer ambulatory monitoring quantifies ventricular
    ectopic burden and captures non-sustained ventricular tachycardia. This is
    not only a diagnostic test but the single prognostic measurement in this
    disease - non-sustained ventricular tachycardia on Holter is the only
    independent predictor of major adverse cardiovascular events in the pooled
    DSG2 series, so it feeds the device decision directly.
  diagnosis_term:
    preferred_term: ambulatory Holter electrocardiographic monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  evidence:
  - reference: PMID:41067474
    reference_title: "Phenotypic spectrum and prognostic stratification in desmoglein-2-associated arrhythmogenic cardiomyopathy: Results from a pooled analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-sustained ventricular tachycardia on Holter monitoring was the only
      independent predictor of MACE.
    explanation: >-
      Establishes the prognostic yield of ambulatory monitoring in DSG2 disease,
      which is why it is a required rather than optional part of evaluation.
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Holter monitoring revealed frequent PVCs (>5000 PVCs/24 hours) and sixteen
      episodes of nonsustained monomorphic ventricular tachycardia (VT) with
      rates up to 152 bpm
    explanation: >-
      Worked example of the ectopic burden and non-sustained ventricular
      tachycardia that ambulatory monitoring detects in a DSG2 carrier.
- name: Transthoracic echocardiography
  description: >-
    First-line imaging. It establishes the dilated, hypocontractile phenotype
    that places a patient in this entry and is the practical surveillance
    modality for genotype-positive, phenotype-negative relatives identified by
    cascade testing. It does not characterise tissue, so it cannot by itself
    distinguish desmosomal from non-desmosomal dilated cardiomyopathy.
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transthoracic echocardiography already revealed a dilated LV with
      moderately reduced LVEF of 38% and a dilated RV with reduced function,
      apical right ventricular akinesia, and moderate tricuspid regurgitation.
    explanation: >-
      Shows echocardiography establishing the biventricular dilated phenotype in
      a homozygous DSG2 carrier.
  - reference: PMID:41652012
    reference_title: Integrative genomic and literature assessment of desmoglein 2-related arrhythmogenic cardiomyopathy with Italian cohort validation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ECG, echocardiography, and cardiac magnetic resonance (CMR) evaluations
      were performed according to the current ESC 2023 Guidelines
    explanation: >-
      Records the standard evaluation triad applied to a DSG2-positive cohort,
      of which echocardiography is the first-line component.
- name: Arrhythmogenic cardiomyopathy next-generation sequencing panel including DSG2
  description: >-
    A broad cardiomyopathy and arrhythmogenic-cardiomyopathy NGS panel
    containing DSG2, with deletion and duplication analysis. Panel breadth and
    read depth matter more here than in most Mendelian disease: a hemizygous
    genotype in which a point mutation is unmasked by a large deletion of the
    second allele is invisible to sequencing alone, and a low-coverage panel has
    been shown to miss a DSG2 variant that a later high-coverage panel found.
    Testing must be coupled to genetic counselling and cascade evaluation.
  diagnosis_term:
    preferred_term: arrhythmogenic cardiomyopathy next-generation sequencing gene panel
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, repeat genetic testing including a large panel with high
      coverage is crucial to establish the correct diagnosis, as was done in
      this case.
    explanation: >-
      Documents a false-negative first genetic test in a homozygous DSG2 patient
      and the panel breadth and coverage that were needed to find the variant.
  - reference: PMID:41652012
    reference_title: Integrative genomic and literature assessment of desmoglein 2-related arrhythmogenic cardiomyopathy with Italian cohort validation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These multilocus mechanisms underscore the limitations of conventional
      single-gene testing and emphasize the need for comprehensive molecular
      diagnostics, including CNV analysis and broad gene panel screening,
      particularly in cases presenting with atypical or severe phenotypes.
    explanation: >-
      Supports both the panel-over-single-gene and the copy-number-analysis
      components of this entry, in a DSG2-specific cohort.
  - reference: PMID:33917638
    reference_title: Hemi- and Homozygous Loss-of-Function Mutations in DSG2 (Desmoglein-2) Cause Recessive Arrhythmogenic Cardiomyopathy with an Early Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, we suggest performing deep genetic analyses using NGS in
      combination with SNP arrays also for ACM index patients without obvious
      familial medical history.
    explanation: >-
      States the specific recommendation - sequencing plus a copy-number method,
      even without a family history - that the biallelic subtype of this entry
      makes necessary.
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      she underwent a comprehensive analysis of 67 genes primarily associated
      with inherited forms of arrhythmia and cardiomyopathy
    explanation: >-
      Worked example of the panel size and scope used in practice to reach a
      DSG2 diagnosis in a dilated presentation.
- name: Task Force and Padua diagnostic criteria
  description: >-
    The 2010 modified International Task Force criteria and the 2020 Padua
    criteria are the formal diagnostic frameworks. The distinction matters
    specifically for this entry: the Task Force criteria are built around right
    ventricular structural abnormality and systematically under-recognise the
    left-dominant presentation, whereas the Padua criteria add left ventricular
    tissue characterisation and so classify the biventricular and left-dominant
    forms that CMD1BB describes.
  diagnosis_term:
    preferred_term: application of the Task Force and Padua diagnostic criteria
  evidence:
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognizing the limitations of the International Task Force criteria and
      further additions might be needed to properly diagnose left-dominant ACM.
    explanation: >-
      States the criterion-level gap that makes the dilated, left-dominant DSG2
      presentation curated here liable to be classified as idiopathic dilated
      cardiomyopathy.
  - reference: PMID:41652012
    reference_title: Integrative genomic and literature assessment of desmoglein 2-related arrhythmogenic cardiomyopathy with Italian cohort validation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2020 Padua Criteria15 were applied to enhance diagnostic specificity,
      allowing precise phenotypic classification of DSG2-related ACM,
      particularly in distinguishing right-dominant, left-dominant, and
      biventricular forms.
    explanation: >-
      Establishes that the Padua criteria are what allow the left-dominant and
      biventricular DSG2 phenotypes to be separated from the right-dominant one.
  notes: >-
    Deliberately left without an ontology binding. NCIT has no
    clinical-action term for applying a named diagnostic criterion set, and this
    is an assessment framework rather than a test; binding it to a generic
    laboratory or evaluation term would say something false rather than
    something imprecise. It is recorded here because which criterion set is used
    determines whether a patient reaches this entry at all.
- name: 18F-FDG PET/CT for myocardial inflammation
  description: >-
    Not part of routine evaluation, but decisive in the myocarditis-like
    presentation. Focal myocardial FDG uptake in a DSG2 carrier can reproduce
    the imaging picture of cardiac sarcoidosis closely enough to satisfy most
    of its major criteria, and serial scanning tracks the inflammatory activity
    of the aseptic inflammation node through treatment and withdrawal.
  diagnosis_term:
    preferred_term: 18F-FDG positron emission tomography with computed tomography
    term:
      id: NCIT:C103512
      label: Positron Emission Tomography and Computed Tomography Scan
  evidence:
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      18F-FDG PET/CT imaging can be a useful tool in identifying inflammatory
      activity in patients with ACM.
    explanation: >-
      The report's own conclusion on the role of FDG PET/CT in arrhythmogenic
      cardiomyopathy, drawn from serial scanning in a homozygous DSG2 patient.
- name: Endomyocardial biopsy
  description: >-
    Reserved for the case where an infiltrative, granulomatous or inflammatory
    alternative is actively suspected; it is not required to diagnose genetic
    dilated cardiomyopathy. Its value here is exclusionary - the absence of
    granulomas in a DSG2 carrier with florid myocardial FDG uptake is what
    argues against cardiac sarcoidosis. Sampling error limits a negative result.
  diagnosis_term:
    preferred_term: endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  evidence:
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple right ventricular and left ventricular endomyocardial biopsies
      (Supplemental Figure 1) in regions with 18F-FDG uptake on 18F-FDG PET/CT
      revealed patchy interstitial fibrosis, without granulomas or inflammatory
      infiltrates.
    explanation: >-
      Biopsy targeted to FDG-avid myocardium in a DSG2 carrier showed fibrosis
      and no granulomas, which is the exclusionary use this entry describes.
- name: Natriuretic peptide and high-sensitivity troponin measurement
  description: >-
    Routine laboratory assessment of the heart failure arm. These are not
    diagnostic for DSG2 disease and, importantly, do not exclude it: in a
    homozygous carrier with active myocardial inflammation and recurrent
    ventricular tachycardia the natriuretic peptide was only mildly raised and
    serial troponin was not elevated at all.
  diagnosis_term:
    preferred_term: N-terminal pro-B-type natriuretic peptide measurement
    term:
      id: NCIT:C96610
      label: N-Terminal ProB-type Natriuretic Peptide Measurement
  markers: NT-proBNP, high-sensitivity troponin
  evidence:
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a mildly elevated N-terminal pro–B-type natriuretic peptide (600
      ng/L) and normal kidney function.
    explanation: >-
      Records the natriuretic peptide result in an actively inflamed homozygous
      DSG2 carrier, supporting the claim that it is only mildly abnormal.
  - reference: PMID:40956261
    reference_title: Inflammatory Features in Homozygous DSG2 Cardiomyopathy Mimicking Cardiac Sarcoidosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serial troponin measurement was not significantly elevated (troponin
      stable at 16 ng/L); electrolytes, inflammatory signs, and
      thyroid-stimulating hormone were normal.
    explanation: >-
      A normal serial troponin in a patient with ongoing myocardial inflammation
      is the negative result behind this entry's caution that these markers do
      not exclude the disease.
  notes: >-
    Both citations are single-patient values, which is the strongest support the
    fetched sources offer for laboratory testing in this disease. No cohort study
    of natriuretic peptide or troponin in DSG2 carriers was found, so no
    threshold, sensitivity, or specificity is asserted here.
treatments:
- name: Implantable cardioverter-defibrillator
  description: >-
    Device therapy for prevention of sudden arrhythmic death. Because
    life-threatening ventricular arrhythmia is the commonest presentation of
    DSG2 disease and may precede significant structural change, ICD decisions
    are made on arrhythmic risk rather than on ejection fraction alone.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Ventricular tachycardia
    description: >-
      Terminates sustained ventricular tachyarrhythmia before it degenerates.
  evidence:
  - reference: PMID:41652012
    reference_title: Integrative genomic and literature assessment of desmoglein 2-related arrhythmogenic cardiomyopathy with Italian cohort validation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The strong correlation between predicted and observed arrhythmic outcomes
      over a five-year horizon validates its application in guiding clinical
      decisions, ICD implantation strategies, and broader preventive
      interventions in DSG2 variant carriers.
    explanation: >-
      Supports the specific claim this treatment makes - that in DSG2 carriers
      the device decision is driven by predicted arrhythmic risk. The prediction
      tool's agreement with observed events in a genotype-defined cohort is what
      licenses risk-based rather than ejection-fraction-based ICD selection.
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She subsequently underwent implantation of a cardiac defibrillator for
      primary prevention given her significantly reduced LVEF despite
      guideline-directed medical therapy, ongoing heart failure symptoms, and an
      expected meaningful survival of more than 1 year.
    explanation: >-
      A worked primary-prevention implantation in a DSG2 carrier with the
      dilated, left-dominant phenotype this entry curates. Graded INDIRECT
      because a single case documents the indication being applied rather than
      the device's effect on mortality.
- name: Exercise restriction
  description: >-
    Avoidance of endurance and competitive high-intensity exercise. This is the
    only intervention with human evidence of modifying penetrance and arrhythmic
    risk in desmosomal mutation carriers, and applies to clinically unaffected
    carriers as well as to affected patients.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoid excessive exercise
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  target_mechanisms:
  - target: Mechanical Uncoupling of Cardiomyocytes
    description: >-
      Reducing wall stress reduces the mechanical load on an already compromised
      intercalated disc.
  evidence:
  - reference: PMID:23871885
    reference_title: Exercise increases age-related penetrance and arrhythmic risk in arrhythmogenic right ventricular dysplasia/cardiomyopathy-associated desmosomal mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings support exercise restriction for these patients.
    explanation: >-
      The study's own therapeutic conclusion, drawn from the observed
      dose-response between exercise and events.
- name: Heart failure pharmacotherapy
  description: >-
    Contemporary four-pillar guideline-directed medical therapy for dilated
    cardiomyopathy with reduced ejection fraction - beta-blockade, angiotensin
    receptor-neprilysin inhibition (or renin-angiotensin system inhibition
    where an ARNI is not tolerated), mineralocorticoid receptor antagonism, and
    an SGLT2 inhibitor. This is disease-modifying for the heart failure arm but
    is not specific to the desmosomal lesion, and no DSG2-specific trial
    evidence exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carvedilol
      term:
        id: CHEBI:3441
        label: carvedilol
    - preferred_term: enalapril
      term:
        id: CHEBI:4784
        label: enalapril
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
    - preferred_term: sacubitril (given as the sacubitril/valsartan ARNI)
      term:
        id: NCIT:C152281
        label: Sacubitril
    - preferred_term: dapagliflozin
      term:
        id: CHEBI:85078
        label: dapagliflozin
  target_mechanisms:
  - target: Progressive Contractile Dysfunction and Heart Failure
    description: >-
      Neurohormonal blockade slows progression of contractile dysfunction in
      dilated cardiomyopathy generally.
  evidence:
  - reference: PMID:34263121
    reference_title: "Left-dominant arrhythmogenic cardiomyopathy: an association with desmoglein-2 gene mutation-a case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient was diagnosed with left-dominant ACM and was managed according
      to published recommendations with guideline-directed medical therapy
      (carvedilol 12.5 mg twice daily and sacubitril–valsartan 49–51 mg twice
      daily)
    explanation: >-
      Documents contemporary guideline-directed therapy including an ARNI being
      given for the dilated, left-dominant DSG2 phenotype this entry curates.
      Graded INDIRECT because a single treated case establishes that the regimen
      is applied here, not that it changes outcome in this genotype.
  notes: >-
    Only the beta-blocker and ARNI components carry a DSG2-specific citation,
    and that is a single treated case rather than an outcome study. The
    mineralocorticoid receptor antagonist and SGLT2 inhibitor pillars are listed
    because they are standard care for dilated cardiomyopathy with reduced
    ejection fraction, but no trial has tested any of these agents in
    DSG2-related disease, and citing a general heart failure trial as evidence
    for this entry would overstate what is known. Catheter ablation for
    recurrent ventricular arrhythmia and cardiac resynchronisation therapy for
    standard dyssynchrony indications are likewise part of the management of
    this disease; neither has been added as a treatment entry because the
    abstract-level sources fetched for this entry contain no finding about
    either in DSG2 carriers, only the fact that they are used in arrhythmogenic
    cardiomyopathy generally.
- name: Antiarrhythmic pharmacotherapy
  description: >-
    Antiarrhythmic drug therapy, most often a beta-blocker with or without
    sotalol or amiodarone, used to reduce arrhythmia burden and appropriate ICD
    therapies. Adjunctive to, not a substitute for, device therapy in patients at
    risk of sudden death.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sotalol
      term:
        id: CHEBI:63622
        label: sotalol
    - preferred_term: amiodarone
      term:
        id: CHEBI:2663
        label: amiodarone
  target_mechanisms:
  - target: Ventricular tachycardia
    description: >-
      Suppression of ventricular ectopy and sustained tachyarrhythmia.
  notes: >-
    No DSG2-specific efficacy data; management follows the arrhythmogenic
    cardiomyopathy consensus rather than genotype-directed evidence.
- name: Cardiac transplantation
  description: >-
    Definitive therapy for end-stage disease. Relevant to this entry more than to
    the right-dominant arrhythmogenic entries because DSG2 and DSC2 carriers
    reach end-stage heart failure significantly more often than PKP2 carriers do.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Progressive Contractile Dysfunction and Heart Failure
    description: >-
      Replaces the failing organ once medical therapy is exhausted.
  evidence:
  - reference: PMID:40123482
    reference_title: Natural History and Clinical Outcomes of Patients With DSG2/DSC2 Variant-Related Arrhythmogenic Right Ventricular Cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with PKP2 patients, DSG2/DSC2 patients exhibited a significantly
      higher risk of end-stage heart failure (P<0.001).
    explanation: >-
      Supports the claim that transplantation is disproportionately relevant in
      this genotype. Graded INDIRECT because the study reports the heart-failure
      endpoint rather than transplantation rates directly.
- name: Cascade genetic screening and family evaluation
  description: >-
    Predictive DSG2 testing and cardiac evaluation of first-degree relatives.
    Particularly important here because biallelic families present without an
    apparent family history - the obligate heterozygous parents are unaffected -
    so a negative family history does not exclude an inherited cause.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33917638
    reference_title: Hemi- and Homozygous Loss-of-Function Mutations in DSG2 (Desmoglein-2) Cause Recessive Arrhythmogenic Cardiomyopathy with an Early Onset.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, we suggest performing deep genetic analyses using NGS in
      combination with SNP arrays also for ACM index patients without obvious
      familial medical history.
    explanation: >-
      Explicit recommendation to pursue genetic analysis despite a negative
      family history, which is the point of this treatment entry.
experimental_models:
- name: DSG2 p.R119X patient-derived iPSC cardiomyocytes with isogenic correction
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells from a patient with homozygous DSG2 p.R119X
    and complete desmoglein-2 deficiency, differentiated to cardiomyocytes, with
    an isogenic heterozygously corrected line generated by homology-directed
    repair. Three-dimensional self-organized tissue rings allow direct force
    measurement.
  publication: PMID:33949662
  modeled_mechanisms:
  - target: Mechanical Uncoupling of Cardiomyocytes
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Human patient-derived tissue reproduces the mechanical failure that is the
      core of the entry's mechanism, and isogenic correction rescues it.
    limitations: >-
      iPSC-derived cardiomyocytes are immature relative to adult myocardium and
      the tissue rings lack vasculature, immune cells and haemodynamic loading,
      so the necrosis and fibrofatty-replacement arms of the disease are not
      modelled.
    readouts:
    - name: Maximum contractile force of self-organized tissue rings
      target: Mechanical Uncoupling of Cardiomyocytes
      direction: DECREASED
      interpretation: >-
        Reduced maximum force is the direct mechanical correlate of lost
        cardiomyocyte coupling.
      evidence:
      - reference: PMID:33949662
        reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Micro-force testing of three-dimensional self-organized tissue rings
          (SOTRs) revealed tissue fragility and a weak maximum force in SOTRs
          from R119X-iPSC-CMs.
        explanation: >-
          Reports the force measurement in the mutant line.
    - name: Contractile force after AAV-mediated DSG2 replacement
      target: Mechanical Uncoupling of Cardiomyocytes
      direction: RESTORED
      interpretation: >-
        Restoration of force on gene replacement establishes that the mechanical
        deficit is caused by desmoglein-2 loss rather than by an unrelated
        feature of the patient line.
      evidence:
      - reference: PMID:33949662
        reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Adeno-associated virus-mediated replacement of DSG2 significantly
          recovered the contraction force in SOTRs generated from R119X-iPSC-CMs.
        explanation: >-
          Rescue experiment supporting causality and the gene-replacement proof
          of concept.
    evidence:
    - reference: PMID:33949662
      reference_title: Phenotypic recapitulation and correction of desmoglein-2-deficient cardiomyopathy using human-induced pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Recapitulation and correction of the disease phenotype using iPSC-CMs
        provide evidence to support the development of precision medicine and the
        proof of concept for gene replacement therapy for this cardiomyopathy.
      explanation: >-
        Establishes the model as informative for this disease mechanism.
animal_models:
- name: Cardiomyocyte-specific Dsg2 knockout mouse
  species: Mouse
  genotype: Cardiomyocyte-specific Dsg2 ablation (Dsg2 protein reduced below 3% in heart)
  publication: PMID:26085008
  description: >-
    Conditional cardiac deletion of Dsg2, used because global Dsg2 knockout is
    embryonic lethal. Animals are born with a functionally normal heart and
    develop cardiomyopathy postnatally as mechanical demand rises.
  modeled_mechanisms:
  - target: Intercalated Disc Desmosome Destabilization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the ultrastructural loss of intercalated disc desmosomes that is
      the central junctional lesion.
    limitations: >-
      Complete cardiac ablation models the biallelic null state, not the
      heterozygous missense genotype that accounts for most human disease, so it
      overstates severity for the common adult presentation.
    readouts:
    - name: Desmosome ultrastructure at the intercalated disc
      target: Intercalated Disc Desmosome Destabilization
      direction: ABOLISHED
      interpretation: >-
        Absence of desmosome-like structures is the defining structural readout
        of this node.
      evidence:
      - reference: PMID:26085008
        reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Electron microscopy revealed absence of desmosome-like structures and
          regional loss of intercalated disc adhesion.
        explanation: >-
          Reports the electron microscopy finding behind this readout.
    evidence:
    - reference: PMID:26085008
      reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice carrying 2 mutant DSG2 alleles coding for Dsg2 lacking part of the
        adhesive EC1-EC2 domains present an indistinguishable phenotype, which is
        similar to that observed in human AC patients.
      explanation: >-
        Supports treating this model as informative for human DSG2 disease.
  - target: Biventricular Remodeling and Chamber Dilation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Develops pronounced chamber dilation with necrosis, inflammation and
      replacement fibrosis.
    limitations: >-
      Calcifying necrosis is prominent in the mouse and is not a typical feature
      of human DSG2 cardiomyopathy, so the injury phenotype is not identical.
    readouts:
    - name: Ventricular chamber dimensions
      target: Biventricular Remodeling and Chamber Dilation
      direction: INCREASED
      interpretation: >-
        Chamber dilation is the structural endpoint this node describes.
      evidence:
      - reference: PMID:26085008
        reference_title: Desmoglein 2-Dependent Arrhythmogenic Cardiomyopathy Is Caused by a Loss of Adhesive Function.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          All animals developed AC during postnatal growth with pronounced
          chamber dilation, calcifying cardiomyocyte necrosis, aseptic
          inflammation, interstitial and focal replacement fibrosis, and
          conduction defects with altered connexin 43 distribution.
        explanation: >-
          Reports the dilation phenotype together with its histological context.
- name: Tg-NS Dsg2-N271S transgenic mouse
  species: Mouse
  genotype: Cardiac overexpression of Dsg2-N271S (mouse equivalent of human DSG2-N266S)
  publication: PMID:19635863
  description: >-
    Transgenic overexpression of a human-equivalent missense allele. Unlike the
    knockout, this models the dominant-negative missense mechanism that accounts
    for most human disease, and expression-level series allow a dose-response to
    be established.
  modeled_mechanisms:
  - target: Cardiomyocyte Necrosis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Identifies myocyte necrosis as the initiating injury and traces the
      sequence through inflammation to fibrous replacement.
    limitations: >-
      The phenotype is driven by transgenic overexpression rather than expression
      from the endogenous locus, so absolute protein stoichiometry is
      supraphysiological and severity is not directly comparable to human
      heterozygotes.
    readouts:
    - name: Myocardial necrosis and inflammatory infiltrate
      target: Cardiomyocyte Necrosis
      direction: INCREASED
      interpretation: >-
        Histological necrosis with inflammation is the direct correlate of this
        node.
      evidence:
      - reference: PMID:19635863
        reference_title: Myocyte necrosis underlies progressive myocardial dystrophy in mouse dsg2-related arrhythmogenic right ventricular cardiomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We demonstrate for the first time that myocyte necrosis is the key
          initiator of myocardial injury, triggering progressive myocardial
          damage, including an inflammatory response and massive calcification
          within the myocardium, followed by injury repair with fibrous tissue
          replacement, and myocardial atrophy.
        explanation: >-
          Reports the necrosis-inflammation-fibrosis sequence behind this
          readout.
    evidence:
    - reference: PMID:19635863
      reference_title: Myocyte necrosis underlies progressive myocardial dystrophy in mouse dsg2-related arrhythmogenic right ventricular cardiomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Transgenic mice recapitulated the clinical features of ARVC, including
        sudden death at young age, spontaneous ventricular arrhythmias, cardiac
        dysfunction, and biventricular dilatation and aneurysms.
      explanation: >-
        Supports treating this model as informative, including for the
        biventricular phenotype this entry curates.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: dsg2_plakoglobin_epitope_vs_relocalization
  prompt: >-
    Does plakoglobin actually redistribute to the nucleus in DSG2-related
    cardiomyopathy, or is the reduced junctional plakoglobin signal an artefact
    of epitope masking?
  attaches_to:
  - pathophysiology#Plakoglobin Nuclear Redistribution
  - pathophysiology#Canonical Wnt Signaling Suppression
  rationale: >-
    Reduced junctional plakoglobin immunofluorescence has been proposed as a
    diagnostic marker and as the mechanistic link between desmosomal disruption
    and fibrofatty replacement. That interpretation rests on the signal
    reflecting genuine protein relocalization. Work in desmoglein-2 mutant mice
    and human ARVC biopsies found the reduced signal only with one antibody
    against one epitope and not with three others, concluding that epitope
    accessibility rather than relocalization explains it. If that is right, the
    Wnt-suppression arm of the mechanism loses its principal human observational
    support and the fibrofatty pathway needs a different explanation - for which
    the mTOR-PPAR-alpha metabolic route and TGF-beta/Smad3 fibrogenesis curated
    on the replacement node are the leading candidates. The entry records the
    canonical mechanism and its contradiction side by side rather than choosing.
  proposed_experiments:
  - experiment_id: dsg2_plakoglobin_epitope_independent_quantification
    name: Epitope-independent quantification of plakoglobin compartmentalisation in DSG2 myocardium
    description: >-
      Quantify nuclear versus junctional plakoglobin in DSG2-variant human
      myocardium using a method that does not depend on antibody epitope
      accessibility - for example subcellular fractionation with mass
      spectrometry, or tagged-allele imaging in isogenic iPSC-derived
      cardiomyocytes - alongside a readout of canonical Wnt target gene
      expression.
    would_support:
    - pathophysiology#Plakoglobin Nuclear Redistribution
    - pathophysiology#Canonical Wnt Signaling Suppression
    supporting_outcome:
    - >-
      Nuclear plakoglobin is increased and canonical Wnt target gene expression
      is reduced in DSG2-deficient cardiomyocytes by a method independent of
      antibody epitope accessibility.
    would_refute:
    - pathophysiology#Plakoglobin Nuclear Redistribution
    - pathophysiology#Canonical Wnt Signaling Suppression
    refuting_outcome:
    - >-
      Total and nuclear plakoglobin are unchanged and Wnt target genes are not
      suppressed, indicating the immunofluorescence finding is an epitope
      artefact and the adipogenic program arises by another route.
- kind: KNOWLEDGE_GAP
  discussion_id: dsg2_dilated_vs_right_dominant_boundary
  prompt: >-
    Is the dilated, left-dominant DSG2 presentation curated here a distinct
    entity from right-dominant DSG2 arrhythmogenic cardiomyopathy, or one end of
    a single continuum?
  attaches_to:
  - disease#Dilated Cardiomyopathy 1BB
  - pathophysiology#Biventricular Remodeling and Chamber Dilation
  rationale: >-
    CMD1BB exists as an OMIM and MONDO concept and is curated here on that
    basis, but the genotype-defined cohorts do not separate cleanly: in the
    pooled series 38.1% were right-dominant and 31.2% biventricular, and in the
    founder-variant cohort three quarters had right ventricular dilatation while
    half had biventricular involvement. No mechanism has been identified that
    determines which ventricle dominates in a given DSG2 carrier. Until one is,
    the split between this entry and
    Arrhythmogenic_Right_Ventricular_Cardiomyopathy is a phenotypic and
    nosological convenience rather than a mechanistic boundary, and readers
    should treat it as such.

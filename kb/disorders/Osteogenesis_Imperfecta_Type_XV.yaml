  prevalence_class: ULTRA_RARE
  notes: >-
    Biallelic WNT1-related osteogenesis imperfecta type XV is an ultra-rare
    autosomal recessive osteogenesis imperfecta subtype described in small
    family series worldwide; no population-level prevalence or birth-incidence
    estimate has been published.
  evidence:
  - reference: PMID:23499310
    reference_title: "WNT1 mutations in families affected by moderately severe and progressive recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe four recessive-OI-affected families in which we
      identified causative mutations in wingless-type MMTV integration site
      family 1 (WNT1).
    explanation: >-
      Documents biallelic WNT1-related recessive OI across a small series of
      four affected families.
  - reference: PMID:23499309
    reference_title: "Mutations in WNT1 cause different forms of bone fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

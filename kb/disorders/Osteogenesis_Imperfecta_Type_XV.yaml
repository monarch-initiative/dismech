      and the coreceptor low-density lipoprotein-receptor-related protein 5 (LRP5).
    explanation: >-
      Defines WNT1 as a secreted ligand acting through FZD and the LRP5 coreceptor,
      the signaling axis disrupted in OI type XV.
  - reference: PMID:23499309
    reference_title: "Mutations in WNT1 cause different forms of bone fragility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Initial functional
      analysis revealed that altered WNT1 proteins fail to activate canonical
      LRP5-mediated WNT-regulated β-catenin signaling.
    explanation: >-
      Documents that disease-causing WNT1 proteins fail to activate canonical
      LRP5-mediated WNT/beta-catenin signaling, the proximal molecular defect.
  - reference: PMID:23656646
    reference_title: "WNT1 mutations in early-onset osteoporosis and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to wild type WNT1, WNT1C218G and WNT1S295* did not induce significant accumulation of non-phosphorylated or total β-catenin in either cytosolic or nuclear fractions
    explanation: >-
      Shows mutant WNT1 fails to drive beta-catenin accumulation, confirming loss
      of canonical WNT signaling output.
  downstream:
  - target: Impaired Osteoblast Differentiation and Bone Formation
    causal_link_type: DIRECT
    description: >-
      Loss of canonical WNT/beta-catenin signaling impairs osteoblast
      differentiation and the osteoanabolic activity needed for bone formation
      and mineralization.
  - target: Central Nervous System Involvement

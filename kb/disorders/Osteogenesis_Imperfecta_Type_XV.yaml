    characterized siblings had markedly hyperextensible hands with laxity at the
    interphalangeal joints, overlapping the connective-tissue laxity seen across
    OI subtypes.
  phenotype_term:
    preferred_term: Joint hypermobility
    term:
      id: HP:0001382
      label: Joint hypermobility
  evidence:
  - reference: PMID:23656646
    reference_title: "WNT1 mutations in early-onset osteoporosis and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their hands are markedly hyperextensible with marked laxity at the interphalangeal joints.
    explanation: >-
      Documents marked joint hypermobility (hyperextensible hands, interphalangeal
      joint laxity) in WNT1-related recessive OI.
- name: White Sclerae (Blue Sclerae Characteristically Absent)
  category: Ophthalmological
  description: >-
    Unlike the blue sclerae typical of classical dominant OI, the characterized
    WNT1-related OI siblings had white sclerae. Recorded here as an explicitly
    absent phenotype: blue sclerae — a hallmark of collagen-defect OI — were not
    present, a feature that helps distinguish this signaling-pathway OI from the
    classic dominant forms it otherwise clinically resembles.
  phenotype_term:
    preferred_term: Blue sclerae
    modifier: ABSENT
    term:
      id: HP:0000592
      label: Blue sclerae
  evidence:
  - reference: PMID:23656646
    reference_title: "WNT1 mutations in early-onset osteoporosis and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing is normal. Their sclerae are white.
    explanation: >-
      The characterized WNT1-related OI siblings had white sclerae; blue sclerae
      (a hallmark of classical dominant OI) were absent.
- name: Normal Dentition (Dentinogenesis Imperfecta Characteristically Absent)
  category: Dental
  description: >-
    The characterized WNT1-related OI siblings had relatively normal permanent
    dentition without dentinogenesis imperfecta. Recorded here as an explicitly
    absent phenotype: dentinogenesis imperfecta, a common feature of collagen-defect
    OI, was documented as absent in the primary human report.
  phenotype_term:
    preferred_term: Dentinogenesis imperfecta
    modifier: ABSENT
    term:
      id: HP:0000703
      label: Dentinogenesis imperfecta
  evidence:
  - reference: PMID:23656646
    reference_title: "WNT1 mutations in early-onset osteoporosis and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Permanent dentition is relatively normal in both with few caries and no signs of dentinogenesis imperfecta.
    explanation: >-
      The characterized WNT1-related OI siblings had normal permanent dentition;
      dentinogenesis imperfecta was documented as absent.
diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XV is suspected in an infant or child with recessive OI (reduced bone
    mass, recurrent fractures, progressive deformity), particularly when COL1A1/
    COL1A2 collagen studies are normal and other recessive OI genes are negative;
    CNS involvement in a severely affected child is a clue. Diagnosis is confirmed
    by identifying biallelic WNT1 variants by gene-panel or exome sequencing,
    distinguishing it from dominant OI type III, which it clinically resembles.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:23656646
    reference_title: "WNT1 mutations in early-onset osteoporosis and osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the family history with two affected siblings and the negative fibroblast collagen studies, whole exome sequencing was performed as described previously7 to identify a potential recessive OI gene.
    explanation: >-
      Illustrates the diagnostic pathway: negative collagen studies followed by
      exome sequencing identifying the recessive WNT1 gene.
- name: Dual-Energy X-Ray Absorptiometry Bone Mineral Density Assessment
  description: >-
    Dual-energy X-ray absorptiometry (DXA) quantifies low bone mineral density
    and monitors skeletal response to antiresorptive pharmacotherapy in
    osteogenesis imperfecta.
  diagnosis_term:
    preferred_term: dual X-ray absorptiometry
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DXA scans beginning at age five years with follow-up scan based on
      severity of OI, initial results, and pharmacologic treatment status.
    explanation: >-
      Standard osteogenesis imperfecta surveillance includes serial DXA bone
      mineral density evaluation.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the
    pharmacological mainstay of severe OI, increasing bone mineral density and
    reducing fracture frequency. They are antiresorptive and do not correct the
    underlying WNT-signaling defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: pamidronate
      term:
        id: CHEBI:7903
        label: pamidronate
    - preferred_term: zoledronic acid
      term:
        id: CHEBI:46557
        label: zoledronic acid
  target_mechanisms:
  - target: Reduced Bone Mass and Skeletal Fragility
    treatment_effect: MODULATES
    description: >-
      Inhibition of osteoclast-mediated bone resorption increases net bone mass
      despite persistent WNT1-deficient osteoblast dysfunction.
  target_phenotypes:
  - preferred_term: Recurrent fractures
    term:
      id: HP:0002757
      label: Recurrent fractures
  - preferred_term: Vertebral compression fracture
    term:
      id: HP:0002953
      label: Vertebral compression fracture
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bisphosphonates continue to be used most extensively in those with
      vertebral fractures, frequent long bone fractures, or more severe OI.
    explanation: >-
      GeneReviews documents bisphosphonates as the mainstay pharmacotherapy for
      severe OI, the management category that applies to OI type XV.
- name: Orthopedic Surgery and Intramedullary Rodding
  description: >-
    Intramedullary (telescoping) rod fixation and corrective osteotomy stabilize
    fracture-prone, deformed long bones; spinal surgery addresses progressive
    scoliosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Recurrent fractures
    term:
      id: HP:0002757
      label: Recurrent fractures
  - preferred_term: Bowing of the long bones
    term:
      id: HP:0006487
      label: Bowing of the long bones
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intramedullary rodding when
      indicated to provide anatomic positioning of limbs
    explanation: >-
      GeneReviews documents intramedullary rodding as standard orthopedic
      management for OI long-bone fractures and deformity.
- name: Physical Therapy and Rehabilitation
  description: >-
    Physical and occupational therapy increase bone stability, improve mobility
    and muscle strength, and prevent contractures and deformity; early physical
    therapy follows brief post-fracture immobilization.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Reduced Bone Mass and Skeletal Fragility
    treatment_effect: MODULATES
    description: >-
      Guided weight-bearing and strengthening rehabilitation improves bone
      stability and limits disuse bone loss after immobilization.
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fractures are treated with as
      short a period of immobility as is practical, small and lightweight casts, and
      physical therapy as soon as casts are removed
    explanation: >-
      GeneReviews documents early physical therapy and brief immobilization as
      part of standard OI fracture rehabilitation.
notes: >-
  No WNT1-specific GeneReviews or StatPearls chapter exists in the NCBI
  Bookshelf index; the tagged GeneReviews chapter NBK1295 (PMID:20301472,
  COL1A1- and COL1A2-Related Osteogenesis Imperfecta) defines phenotype
  classification for classical collagen-related OI types I-IV rather than
  WNT1-related OI type XV, and is cited here strictly for shared OI orthopedic,
  rehabilitative, densitometric, and antiresorptive management principles.

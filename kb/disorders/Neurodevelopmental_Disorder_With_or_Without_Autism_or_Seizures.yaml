differential_diagnoses:
- name: Pseudohypoaldosteronism type IIE (CUL3-related)
  disease_term:
    preferred_term: pseudohypoaldosteronism type 2E
    term:
      id: MONDO:0013782
      label: pseudohypoaldosteronism type 2E
  description: >-
    The same gene, a different disease, separated by variant class rather than by
    dose. PHA2E is caused by CUL3 variants that converge on skipping of exon 9,
    yielding an in-frame deletion that abrogates ubiquitination of WNK kinases
    presented by the KLHL3 adaptor in the distal nephron; the result is
    hyperkalaemic hypertension with metabolic acidosis, reversible with thiazide
    diuretics, and without neurodevelopmental features. A CUL3 variant report
    must therefore be read for variant class before it is read for gene identity.
    How CUL3-delta-9 acts downstream is itself contested - a mouse model suggested
    the truncated protein is degraded, making PHA2E another haploinsufficiency
    state, while direct testing found additional dominant effects must contribute.
    That controversy matters here: if PHA2E were purely haploinsufficiency the two
    diseases would be hard to keep apart mechanistically, so the dominant
    component is doing real separating work. The clinical boundary is also not
    absolutely clean - a canonical splice-acceptor allele has now been reported in
    the neurodevelopmental disorder, and the largest NEDAUS cohort noted
    individuals with early or juvenile-onset hypertension in the absence of
    electrolyte abnormalities.
  distinguishing_features:
  - Exon 9 skipping as the shared mutational consequence in PHA2E, versus
    distributed truncating, splice and missense alleles in NEDAUS
  - Hyperkalaemia and metabolic acidosis, absent in NEDAUS
  - Thiazide-responsive hypertension as the presenting problem, rather than
    developmental delay
  - No intellectual disability, speech delay or autism
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diverse CUL3 mutations all result in skipping of exon 9, producing an in-frame deletion."
    explanation: >-
      Establishes the distinguishing mutational mechanism of PHA2E - convergence on
      exon 9 skipping - that separates it from the NEDAUS allele spectrum.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pseudohypoaldosteronism type II (PHAII), a rare Mendelian syndrome featuring hypertension, hyperkalaemia and metabolic acidosis"
    explanation: >-
      States the PHA2E clinical triad used here as the distinguishing feature set.
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified several individuals in our cohort without electrolyte abnormalities who had early or juvenile onset hypertension or other congenital cardiac abnormalities"
    explanation: >-
      Supports the caveat that the boundary is not absolute, while confirming the
      electrolyte abnormalities that define PHA2E were absent - hence PARTIAL.
  - reference: PMID:29361671
    reference_title: "Mechanisms and controversies in mutant Cul3-mediated familial hyperkalemic hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cul3 mutations cause skipping of exon 9, which results in an internal deletion of 57 amino acids from the CUL3 protein (CUL3-∆9)."
    explanation: >-
      Specifies the molecular product of the PHA2E allele class - an in-frame
      57-residue internal deletion - which is what makes it a different lesion from
      the loss-of-function alleles causing the neurodevelopmental disorder.
  - reference: PMID:29361671
    reference_title: "Mechanisms and controversies in mutant Cul3-mediated familial hyperkalemic hypertension."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "We recently directly tested this model but found that other dominant effects of CUL3-∆9 must contribute to the development of FHHt."
    explanation: >-
      Supports the statement that PHA2E is not purely a haploinsufficiency state,
      while recording that the point is contested - the preceding sentence of the
      same review describes a mouse model that concluded the opposite. Hence
      PARTIAL, and evidence_source OTHER as this is a review rather than primary
      data.
treatments:
- name: Early multidisciplinary developmental therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physical, occupational, speech-language and behavioural therapy begun as
    early as possible. There is no disease-modifying treatment, and no
    CUL3-specific efficacy data; this is the standard of care for syndromic
    developmental delay applied to a molecularly defined population. Speech and
    language therapy has the strongest claim on resources because speech delay is
    the most consistent feature of the disorder.
  treatment_term:
    preferred_term: Early Intervention
    term:
      id: NCIT:C159524
      label: Early Intervention
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech delay was the most consistent feature and was noted in 97% (34/35)."
    explanation: >-
      Supports the prioritisation of speech-language therapy by establishing speech
      delay as the near-universal feature; it does not evaluate the therapy itself,
      hence PARTIAL.
- name: Speech and language therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Directed at the disorder's most consistent feature. No CUL3-specific trial
    data exist.
  treatment_term:
    preferred_term: Speech Language Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
- name: Physical and occupational therapy
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Directed at early hypotonia, motor delay and, in the minority who develop
    them, tremor and dystonia. In one reported case, three months of exercise
    rehabilitation improved exercise capacity while autism symptoms were
    essentially unchanged - a useful calibration of what motor rehabilitation
    does and does not address in this disorder.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_phenotypes:
  - preferred_term: Hypotonia
    term:
      id: HP:0001252
      label: Hypotonia
  - preferred_term: Delayed gross motor development
    term:
      id: HP:0002194
      label: Delayed gross motor development
  evidence:
  - reference: PMID:37026922
    reference_title: "A nonsense mutation in the CUL3 gene in a Chinese patient with autism spectrum disorder and epilepsy: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's exercise capacity had improved, and improvements in autism symptoms were not obvious."
    explanation: >-
      Single-case outcome supporting a motor benefit and, equally usefully, the
      absence of a behavioural one. n=1 and uncontrolled, hence PARTIAL.
- name: Growth hormone therapy for short stature
  action_category: THERAPEUTIC
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Two children with CUL3-related neurodevelopmental disorder and short stature
    were treated with growth hormone and responded well. It addresses a
    comorbidity rather than the neurodevelopmental phenotype. Two patients,
    uncontrolled - a signal to evaluate growth and consider endocrine referral,
    not established therapy. It is not the only reported pharmacological
    intervention with a described benefit in this population: a single reported
    patient remained seizure-free on levetiracetam (see Antiseizure medication).
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  target_phenotypes:
  - preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:40763714
    reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proband and her sister were treated with growth hormone (GH) with good response."
    explanation: >-
      Reports the intervention and the response in molecularly confirmed patients.
  - reference: PMID:40763714
    reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a good response to GH therapy in 2 of our patients with short stature."
    explanation: >-
      States the outcome and its denominator of two, which is what limits this to a
      signal rather than evidence of efficacy - hence PARTIAL.
- name: Antiseizure medication
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Symptomatic treatment for the subset with seizures, chosen by seizure type on
    general epilepsy principles. No controlled or drug-selection data exist, and
    no agent is contraindicated on the basis of the genotype. The only reported
    CUL3-specific observation is a single patient who remained seizure-free on
    levetiracetam.
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:37026922
    reference_title: "A nonsense mutation in the CUL3 gene in a Chinese patient with autism spectrum disorder and epilepsy: A case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was on levetiracetam from September, 2021 at a dose of 2 mL daily, and the seizures did not recur."
    explanation: >-
      The single reported CUL3-specific antiseizure observation. n=1, uncontrolled
      and with a short follow-up, so it supports the practice of symptomatic
      treatment without establishing efficacy or drug selection - hence PARTIAL.
- name: Genetic counselling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Recurrence risk is low for the de novo majority but is not zero, because
    parental germline mosaicism is possible and because transmission from a
    mildly affected parent is documented. Testing parents matters: a carrier
    parent may have normal height and only mild neurodevelopmental features.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:40763714
    reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was inherited from their mother, who had facial dysmorphism and hypertension but normal height."
    explanation: >-
      Documents transmission from a mildly affected parent, the specific scenario
      that makes parental testing part of counselling here.
animal_models:
- name: Cul3 germline haploinsufficient mouse
  species: Mouse
  genotype: Cul3 +/- (CRISPR/Cas9 frameshifting insertion)
  background: C57BL/6N
  category: Genetically engineered
  publication: PMID:33727673
  description: >-
    The closest genetic match to the human disorder - constitutive
    heterozygosity, the same dosage lesion patients carry. It reproduces
    behaviour, structure and a molecular mechanism, and supplies the field's only
    pharmacological rescue: inhibiting RhoA, a CUL3 substrate, restores dendrite
    length and network activity.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  modeled_mechanisms:
  - target: Cullin-3 Haploinsufficiency and Reduced CRL3 Ligase Capacity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Constitutive heterozygous loss of one Cul3 allele is the same dosage lesion
      as the human loss-of-function state.
    limitations: >-
      Mouse behavioural readouts (social interaction, hyperactivity) are proxies
      for human social communication and cognition rather than measurements of
      them, and the model does not reproduce the seizure, dysmorphism or
      hand-and-foot components of the human syndrome.
    readouts:
    - name: Cortical regional volume on brain MRI
      target: Cullin-3 Haploinsufficiency and Reduced CRL3 Ligase Capacity
      direction: DECREASED
      interpretation: >-
        Structural correlate establishing that the halved gene dose produces a
        measurable brain phenotype from early postnatal life.
      evidence:
      - reference: PMID:33727673
        reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Brain MRI found decreased volume of cortical regions and changes in many other brain regions of Cul3 mutant mice starting from early postnatal development."
        explanation: Reports the imaging measurement and its direction.
    evidence:
    - reference: PMID:33727673
      reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To investigate how Cul3 mutations impact brain development, we generated a haploinsufficient Cul3 mouse model using CRISPR/Cas9 genome engineering."
      explanation: >-
        Establishes the model's construction as a haploinsufficiency model, which
        is why it is informative for this node.
  - target: Reduced Dendritic Growth and Inhibitory Synapse Loss
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      RhoA inhibition rescues the dendritic and network-activity phenotypes,
      showing the substrate accumulation is causal and identifying the disorder's
      leading mechanism-based therapeutic hypothesis.
    limitations: >-
      Rescue was demonstrated pharmacologically in mice; no human data exist, and
      the reversibility of a developmentally established phenotype in a patient is
      untested.
    readouts:
    - name: Dendrite length after RhoA inhibition
      target: Reduced Dendritic Growth and Inhibitory Synapse Loss
      direction: RESTORED
      interpretation: >-
        Restoration on blocking the accumulated substrate identifies RhoA as the
        operative effector of the dendritic phenotype.
      evidence:
      - reference: PMID:33727673
        reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inhibition of small GTPase RhoA, a molecular substrate of Cul3 ligase, rescued dendrite length and network activity phenotypes."
        explanation: Reports the rescue and the measured readout.
    evidence:
    - reference: PMID:33727673
      reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study identified defects in neuronal cytoskeleton and Rho signaling as the primary targets of Cul3 mutation during brain development."
      explanation: >-
        States the mechanistic conclusion that makes this model informative for the
        cytoskeletal/dendritic node.
  evidence:
  - reference: PMID:33727673
    reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cul3 mutant mice exhibited social and cognitive deficits and hyperactive behavior."
    explanation: >-
      Reports the behavioural phenotype that makes this model informative for the
      human neurobehavioural disorder.
- name: Constitutive Cul3 heterozygous mouse (neuronal migration)
  species: Mouse
  genotype: Cul3 +/-
  category: Genetically engineered
  publication: PMID:34031387
  description: >-
    The model that establishes the developmental timing constraint. Constitutive
    heterozygotes show cortical lamination abnormalities, but inducing the same
    haploinsufficiency later in life does not produce autism-relevant behaviour -
    so the pathogenic window is developmental, not ongoing.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  modeled_mechanisms:
  - target: Impaired Neuronal Migration and Cortical Lamination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cortical lamination abnormality follows directly from impaired radial
      neuronal migration in the constitutive heterozygote.
    limitations: >-
      Cortical lamination has not been examined in human CUL3 patient brain
      tissue, and the largest human cohort reports mostly normal brain MRI - so
      the human counterpart of this cellular phenotype, if present, is below the
      resolution of clinical imaging.
    readouts:
    - name: Cortical layer positioning of migrating neurons
      target: Impaired Neuronal Migration and Cortical Lamination
      direction: ALTERED
      interpretation: >-
        Mispositioning of neurons is the structural expression of the migration
        defect.
      evidence:
      - reference: PMID:34031387
        reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show that Cul3 is essential to regulate neuronal migration and, therefore, constitutive Cul3 heterozygous mutant mice display cortical lamination abnormalities."
        explanation: Reports the migration defect and the lamination readout.
    evidence:
    - reference: PMID:34031387
      reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mouse, constitutive Cul3 haploinsufficiency leads to motor coordination deficits as well as ASD-relevant social and cognitive impairments."
      explanation: >-
        Establishes that the constitutive heterozygote reproduces disease-relevant
        behaviour, supporting its use as a model for this node.
  evidence:
  - reference: PMID:34031387
    reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "De novo loss of function mutations in the ubiquitin ligase-encoding gene Cullin3 (CUL3) lead to autism spectrum disorder (ASD)."
    explanation: >-
      States the human genetic premise the model was built to interrogate, which is
      what makes this mouse informative for the human disorder.
- name: Region- and cell-type-restricted Cul3 conditional knockout mice
  species: Mouse
  genotype: Conditional Cul3 deletion (forebrain, prefrontal cortex, striatum, cholinergic neurons)
  category: Genetically engineered
  publication: PMID:31455858
  description: >-
    A series of conditional deletions that dissects which circuit produces which
    behaviour: prefrontal loss gives social deficits, striatal loss gives
    stereotypy, forebrain or prefrontal loss gives NMDA receptor hypofunction,
    and cholinergic basal-forebrain loss gives social and sensory-gating deficits
    with cognitive impairment. Knocking down the misregulated histone
    methyltransferase Smyd3 rescues the social phenotype.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  modeled_mechanisms:
  - target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Circuit-restricted deletion maps distinct behavioural outputs onto distinct
      brain regions and provides the electrophysiological correlate of each.
    limitations: >-
      Conditional homozygous or region-restricted deletion is a deeper and more
      spatially confined lesion than the whole-body heterozygosity patients carry,
      so the mapping of circuit to behaviour is more informative than the absolute
      severity.
    readouts:
    - name: NMDA receptor function in prefrontal cortex
      target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
      direction: DECREASED
      interpretation: >-
        NMDAR hypofunction is the synaptic correlate of the social-behaviour
        phenotype in this model.
      evidence:
      - reference: PMID:31455858
        reference_title: "Behavioral, circuitry, and molecular aberrations by region-specific deficiency of the high-risk autism gene Cul3."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Correlated with these behavioral alterations, Cul3 deficiency in forebrain or PFC induces NMDA receptor hypofunction, while Cul3 loss in striatum causes a cell type-specific alteration of neuronal excitability in striatal circuits."
        explanation: Reports the measurement and its direction in each region.
    evidence:
    - reference: PMID:31455858
      reference_title: "Behavioral, circuitry, and molecular aberrations by region-specific deficiency of the high-risk autism gene Cul3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results have revealed for the first time a potential molecular mechanism underlying the manifestation of different autism-like behavioral deficits by Cul3 deletion in cortico-striatal circuits."
      explanation: >-
        States the circuit-level mechanistic conclusion this model contributes.
  evidence:
  - reference: PMID:31455858
    reference_title: "Behavioral, circuitry, and molecular aberrations by region-specific deficiency of the high-risk autism gene Cul3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition or knockdown of Smyd3 in forebrain Cul3-deficient mice ameliorates social deficits and restores NMDAR function in PFC."
    explanation: >-
      A rescue arm in this model series - correcting a misregulated substrate
      restores both behaviour and synaptic function - which is what makes the model
      informative rather than merely descriptive.
- name: Cholinergic-neuron-restricted Cul3 knockout mouse
  species: Mouse
  genotype: ChAT-Cre; Cul3 flox/+
  category: Genetically engineered
  publication: PMID:36693858
  description: >-
    Heterozygous Cul3 deletion confined to cholinergic neurons reproduces social
    and sensory-gating deficits and cognitive impairment. Bidirectional
    chemogenetic manipulation closes the causal loop: inhibiting basal forebrain
    cholinergic neurons in healthy mice reproduces the deficits, and stimulating
    them in mutants reverses them.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  modeled_mechanisms:
  - target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates the social, sensory-gating and cognitive arm of the phenotype
      through a cholinergic circuit, but by construction says nothing about the
      cortical and striatal glutamatergic arms.
    limitations: >-
      Deletion is restricted to cholinergic neurons, so this model isolates one
      contributing circuit rather than reproducing the distributed loss of CUL3
      present in patients.
    readouts:
    - name: Basal forebrain cholinergic neuron activity
      target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
      direction: DECREASED
      interpretation: >-
        Diminished cholinergic activity is the circuit lesion linking Cul3 dose to
        the behavioural phenotype in this model.
      evidence:
      - reference: PMID:36693858
        reference_title: "Cholinergic neurons in the basal forebrain are involved in behavioral abnormalities associated with Cul3 deficiency: Role of prefrontal cortex projections in cognitive deficits."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Conditional Cul3 ablation in cholinergic neurons of mice (ChatCRECul3F/+) recapitulated ASD-like social and sensory gating phenotypes and caused significant cognitive impairments, with diminished activity of cholinergic neurons in the basal forebrain (BF)."
        explanation: Reports the activity measurement and the behavioural phenotype.
    evidence:
    - reference: PMID:36693858
      reference_title: "Cholinergic neurons in the basal forebrain are involved in behavioral abnormalities associated with Cul3 deficiency: Role of prefrontal cortex projections in cognitive deficits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conversely, chemogenetic stimulation of BF cholinergic neurons in ChatCRECul3F/+ mice reversed abnormalities in sensory gating and cognition."
      explanation: >-
        The reversal on stimulating the implicated neurons is what makes the
        circuit claim causal rather than correlative.
  evidence:
  - reference: PMID:36693858
    reference_title: "Cholinergic neurons in the basal forebrain are involved in behavioral abnormalities associated with Cul3 deficiency: Role of prefrontal cortex projections in cognitive deficits."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, we demonstrate that cholinergic dysfunction due to Cul3 deficiency is involved in ASD-like behavioral abnormalities, and that BF cholinergic neurons are particularly critical for cognitive component through their projections to the PFC."
    explanation: >-
      States the model's overall conclusion and the circuit it implicates, which is
      the reason this model is curated against the human disorder.
- name: CUL3-deficient mouse (dopaminergic/VTA)
  species: Mouse
  genotype: Cul3 deficient
  category: Genetically engineered
  publication: PMID:37558490
  description: >-
    Extends the mechanism to the dopaminergic system: CUL3-deficient mice show
    hyperlocomotion, working-memory and sensorimotor-gating deficits and
    psychostimulant sensitivity, with elevated excitability of ventral tegmental
    area dopamine neurons, and the ion channel HCN2 identified as a candidate
    CUL3 target there. Behavioural abnormalities were attenuated by a dopamine D2
    receptor antagonist.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  modeled_mechanisms:
  - target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Adds a dopaminergic route to altered circuit excitability and names a
      candidate ion-channel substrate, but the phenotypes emphasised
      (psychostimulant sensitivity, sensorimotor gating) map more closely onto
      schizophrenia-relevant endophenotypes than onto the human developmental
      syndrome curated here.
    limitations: >-
      Studied in male mice only, and the behavioural readouts are not measured
      counterparts of the human phenotype; the HCN2 substrate relationship is
      described as potential rather than established.
    readouts:
    - name: Excitability of ventral tegmental area dopamine neurons
      target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
      direction: INCREASED
      interpretation: >-
        Elevated dopamine-neuron excitability is the electrophysiological lesion
        proposed to drive the behavioural phenotype in this model.

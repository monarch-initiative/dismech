diagnosis:
- name: Trio exome or genome sequencing
  diagnosis_term:
    preferred_term: Whole Exome Sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The diagnostic route in essentially every published case. Because the
    disorder has no pathognomonic clinical sign - the facial features are mild,
    brain MRI is usually normal, and the two named features (autism, seizures)
    are optional - it is not clinically recognisable, and diagnosis is made by
    sequencing performed for undifferentiated neurodevelopmental disorder. Trio
    analysis is preferred given the de novo mechanism.
  evidence:
  - reference: PMID:33097317
    reference_title: "A novel stop-gain CUL3 mutation in a Japanese patient with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-based exome sequencing identified a de novo two-base insertion in CUL3, c.1758_1759insTG, p.(Thr587*)."
    explanation: >-
      Demonstrates the diagnostic route directly: a trio-based exome study
      identifying the de novo causal allele in an individual ascertained through
      neurodevelopmental presentation.
  - reference: PMID:36710200
    reference_title: "A novel splice site CUL3 variant in a patient with neurodevelopmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A de novo splice site variant (c.379-2A > G) was identified in CUL3 and is predicted to abolish the acceptor splice site."
    explanation: >-
      A second molecularly confirmed diagnosis made by sequencing rather than by
      clinical recognition, including a variant class that sequence analysis is
      needed to interpret.
  - reference: PMID:33097317
    reference_title: "A novel stop-gain CUL3 mutation in a Japanese patient with autism spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of CUL3 variants is worth considering for patients with ASD, especially those with Rett-like developmental regression."
    explanation: >-
      Supports the testing-indication statement, naming the clinical presentation
      that should prompt consideration of CUL3.
- name: Chromosomal microarray
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  description: >-
    The route that detects the copy-number class of trigger allele. One of 26
    individuals in the largest cohort carried a deletion removing CUL3 together
    with neighbouring genes - a contiguous multigene CNV, which is precisely the
    lesion trio exome sequencing can miss. Microarray is therefore complementary
    to, not redundant with, the sequencing route above, and was part of the
    clinical workup that identified variants in that cohort.
  evidence:
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of CUL3 variants was carried out in a clinical setting using exome sequencing (ES), genome sequencing, and chromosomal microarray."
    explanation: >-
      Names chromosomal microarray as one of the three diagnostic modalities used
      to ascertain this cohort.
- name: DNA methylation episignature
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  description: >-
    A sensitive and specific peripheral-blood DNA methylation signature has been
    defined for CUL3 pathogenic variants and used to reclassify variants of
    uncertain significance - the practical answer to the interpretive problem
    created by a gene where missense alleles are hard to call. Two caveats
    matter. The signature is not universal among pathogenic-variant carriers, so
    the cohort is split into signature-positive and signature-negative groups,
    and several phenotype frequencies in this entry differ between them. And the
    signature resembles those of several other rare neurodevelopmental disorders,
    so it should be interpreted within a validated classifier rather than read as
    a standalone test.
  evidence:
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered a sensitive and specific DNAm episignature for patients with pathogenic variants in CUL3 and utilized it to reclassify patients carrying a VUS in the CUL3 gene."
    explanation: >-
      States both the signature's performance and its intended clinical use for
      variant reclassification.
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comparative epigenomic analysis revealed similarities between NEDAUS and several other rare genetic neurodevelopmental disorders with previously identified episignatures, highlighting the broader implication of our findings."
    explanation: >-
      Supports the specificity caveat recorded in the description - the signature
      overlaps those of other neurodevelopmental disorders.

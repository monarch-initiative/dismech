      explanation: >-
        The selectivity of the deficit for inhibitory synapses is what makes this
        edge a route to imbalance rather than a generalised synaptic loss.
- name: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
  role: effector
  biological_scale: CELLULAR
  description: >-
    The two cellular branches converge on altered circuit excitability, and
    conditional-deletion experiments show the resulting behaviour depends on
    where the loss occurs rather than on a single global defect: social deficits
    track loss in prefrontal cortex, stereotypic behaviour tracks loss in
    striatum, NMDA receptor hypofunction follows forebrain or prefrontal loss,
    and cholinergic basal-forebrain deletion reproduces social and sensory-gating
    phenotypes with cognitive impairment. Distinct circuits, one gene dose.

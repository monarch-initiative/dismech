      reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whole exome sequencing (WES) revealed a novel likely pathogenic heterozygous nonsense CUL3 variant c.420C>G, p.Tyr140Ter."
      explanation: >-
        Reports the allele and its classification.
    - reference: PMID:40763714
      reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was also identified in her non-identical twin sister, who presented with short stature and NDD, and in their father, who had NDD and epilepsy but normal height."
      explanation: >-
        Documents the segregation and the phenotypic difference between carriers

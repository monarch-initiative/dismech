name: Neurodevelopmental Disorder With or Without Autism or Seizures
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodevelopmental disorder with or without autism or seizures
  term:
    id: MONDO:0030994
    label: neurodevelopmental disorder with or without autism or seizures
description: >-
  Neurodevelopmental disorder with or without autism or seizures (NEDAUS;
  OMIM #619239), also called CUL3-related neurodevelopmental disorder, is an
  autosomal dominant syndromic neurodevelopmental disorder caused by
  heterozygous, overwhelmingly de novo loss-of-function variants in CUL3. CUL3
  encodes cullin-3, the elongated scaffold of the CRL3 family of cullin-RING E3
  ubiquitin ligases: it binds RBX1 (and, through it, the E2 ubiquitin-conjugating
  enzyme) at one end and a BTB-domain substrate adaptor at the other, so that
  substrate proteins are polyubiquitinated and delivered to the 26S proteasome.
  The disease mechanism is haploinsufficiency - a halved dose of the scaffold,
  and therefore a reduced ubiquitin-conjugating capacity of the whole CRL3
  family, rather than the loss of one specific substrate.

  The core clinical picture is far more consistent than the disease name
  suggests. In the largest published cohort (37 individuals), global
  developmental delay, delayed speech and language development, intellectual
  disability and mild dysmorphic facial features were each present in roughly
  nine out of ten patients, whereas autism spectrum disorder was diagnosed in
  about a third and hand and foot anomalies in about half. Speech delay is the
  single most consistent feature. Early hypotonia is common and typically
  improves with age, and a minority develop tremor or dystonia later; a
  prenatal signature of intrauterine growth restriction and increased nuchal
  translucency is recognised, with cerebellar hypoplasia recently proposed as a
  more specific sonographic marker.

  Seizures are the part of the name that the evidence supports least securely.
  The founding case series described global developmental delay with or without
  infantile spasms, and individual case reports document generalised epilepsy
  followed by autistic regression - but the 37-patient cohort found seizures in
  only a few individuals, as febrile or isolated events, and explicitly reported
  that epilepsy was not observed as a recurrent feature of that cohort. This
  entry curates that discordance rather than smoothing it over; the seizure
  phenotype is annotated but its frequency is deliberately left unstated, and
  the tension is recorded as a knowledge gap.

  CUL3 is a two-disease gene, and the two diseases are separated by variant
  class rather than by dosage alone. The variants that cause NEDAUS are
  distributed truncating, splice and missense alleles that reduce functional
  cullin-3; the variants that cause pseudohypoaldosteronism type IIE (PHA2E,
  OMIM #614496) all converge on skipping of exon 9, producing an in-frame
  deletion that abrogates ubiquitination of WNK kinases presented by the KLHL3
  adaptor in the distal nephron. PHA2E is a hyperkalaemic-hypertension disorder
  without neurodevelopmental features. Keeping these apart is the single most
  important interpretive step when reading a CUL3 variant report, and it is
  curated explicitly below as a differential diagnosis.
parents:
- Neurodevelopmental Disorder
- Ubiquitin-Proteasome System Disorder

datasets:
- accession: geo:GSE144046
  title: >-
    Autism-linked Cullin3 germline haploinsufficiency severely impacts mouse
    brain development and cortical neurogenesis through RhoA signaling
  data_type: BULK_RNA_SEQ
  sample_count: 108
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  publication: PMID:33727673
  notes: >-
    Spatiotemporal transcriptomic profiling of embryonic, early postnatal and
    adult brain from the CRISPR-generated Cul3 haploinsufficient mouse curated in
    animal_models. This is the underlying data for the neurogenesis and
    cytoskeletal findings and for the RhoA rescue. Relevance was triaged manually:
    a gene-symbol search on CUL3 returns mostly lung, yeast and 16p11.2/KCTD13
    datasets that share the gene but not the disease, and those were rejected;
    this record was accepted because the series title, its linked publication and
    its genotype all name Cul3 haploinsufficiency in brain. Carries no evidence
    block by design - a GEO series has no abstract to quote exactly.

mechanistic_hypotheses:
- hypothesis_group_id: translational_dysregulation_model
  hypothesis_label: Dysregulated cap-dependent translation as the proximate neuronal defect
  status: CANONICAL
  description: >-
    CUL3 restrains cap-dependent translation initiation by turning over
    initiation-complex proteins; loss of that restraint dysregulates neuronal
    protein synthesis, raising glutamatergic drive and excitability. The two
    strongest pieces of evidence come from opposite directions - 4E-BP1 fails to
    be degraded in human patient cells, and inhibiting eIF4G1 rescues cellular
    and behavioural deficits in mice - which is what makes this the leading
    account. It also places the disorder alongside other monogenic autism
    syndromes with translational-control defects.
  evidence:
  - reference: PMID:31780330
    reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ASD-associated cellular and behavioral deficits could be rescued by pharmacological inhibition of the eIF4G1 function and chemogenetic inhibition of neuronal activity."
    explanation: >-
      Rescue by targeting the accumulated translation factor is the causal test
      this hypothesis rests on.
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, we show that 4E-BP1 (EIF4EBP1), a prominent substrate of CUL3, fails to be targeted for proteasomal degradation in patient-derived cells."
    explanation: >-
      Anchors the hypothesis in human patient material rather than in mouse alone.
- hypothesis_group_id: cytoskeletal_migration_model
  hypothesis_label: RhoA/plastin-3 cytoskeletal dysregulation and impaired neuronal migration
  status: ALTERNATIVE
  description: >-
    An alternative - and not mutually exclusive - account in which the proximate
    defect is cytoskeletal. CUL3 controls the levels of RhoA and plastin-3, both
    regulators of actin dynamics; their accumulation impairs radial neuronal
    migration and dendritic growth, producing cortical lamination abnormalities.
    RhoA inhibition rescues dendrite length and network activity in the
    haploinsufficient mouse. The distinguishing prediction is developmental
    timing: this model requires the lesion to act during corticogenesis, and
    indeed inducing haploinsufficiency in adult mice does not reproduce the
    behavioural phenotype - which, if it holds in humans, bounds what any
    postnatal therapy could achieve.
  evidence:
  - reference: PMID:33727673
    reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study identified defects in neuronal cytoskeleton and Rho signaling as the primary targets of Cul3 mutation during brain development."
    explanation: >-
      States the competing claim - that the cytoskeleton, not translation, is the
      primary target of the lesion.
  - reference: PMID:34031387
    reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, induction of Cul3 haploinsufficiency later in life does not lead to ASD-relevant behaviors, pointing to an important role of Cul3 during a critical developmental window."
    explanation: >-
      Supports the developmental-timing prediction that distinguishes this model
      from a purely ongoing translational-control defect.
discussions:
- discussion_id: cul3_seizure_frequency_discordance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How common are seizures in CUL3-related neurodevelopmental disorder, and is
    epilepsy a genuine part of the phenotype or an ascertainment artefact of the
    early case reports?
  attaches_to:
  - pathophysiology#Syndromic Neurodevelopmental Phenotype
  rationale: >-
    The disorder is named for seizures, yet the two data sources disagree
    sharply. The founding three-case series titled its report around infantile
    spasms, and independent case reports describe generalised epilepsy followed
    by autistic regression. But the 37-individual cohort found seizures in only a
    few patients - febrile or single isolated events - and stated explicitly that
    epilepsy was not observed as a recurrent feature. Two readings are possible
    and are not distinguished by the published data: early reports may have been
    enriched for epilepsy because children with seizures reach exome sequencing
    sooner, or the later cohort may under-ascertain seizures collected
    retrospectively across many centres. Until this is settled no frequency band
    can honestly be assigned, which is why the seizure phenotype in this entry
    carries evidence but no frequency, and why the discordant cohort statement is
    retained as a REFUTE item rather than averaged away.
  proposed_experiments:
  - experiment_id: cul3_prospective_eeg_cohort
    name: Prospective EEG and seizure-history ascertainment in a molecularly defined cohort
    description: >-
      Enrol individuals with confirmed pathogenic CUL3 variants ascertained
      through neurodevelopmental disorder rather than through epilepsy, and apply
      uniform seizure-history questionnaires plus standardised EEG at defined
      ages. Ascertaining through a non-epilepsy route is the design feature that
      breaks the circularity of the existing literature.
    decision_criterion: >-
      A seizure prevalence above roughly 20% in a non-epilepsy-ascertained cohort
      would establish seizures as a genuine core feature; a prevalence at
      population background would support ascertainment bias in the early reports.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, epilepsy, which were thought to be a part of the clinical spectrum, were not observed in our patient cohort (OMIM #619239)."
    explanation: >-
      The cohort statement that creates the discordance, explicitly framed by its
      authors against the prior expectation encoded in the OMIM entry.
  - reference: PMID:37575562
    reference_title: "Current trends of high-risk gene Cul3 in neurodevelopmental disorders."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the patients had infantile spasms, while the other had short stature with mild to severe intellectual disability."
    explanation: >-
      Two of the three founding patients had infantile spasms - a rate that cannot
      be reconciled with the later cohort's finding that epilepsy was not a
      recurrent feature. This is the other side of the gap.
- discussion_id: cul3_episignature_subgroup_meaning
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What distinguishes episignature-positive from episignature-negative
    individuals carrying pathogenic CUL3 variants, and is the difference
    biological or technical?
  attaches_to:
  - pathophysiology#Cullin-3 Haploinsufficiency and Reduced CRL3 Ligase Capacity
  rationale: >-
    The methylation episignature splits carriers into two groups that differ in
    more than their methylation: ADHD was seen in a third of signature-positive
    individuals and in none of the signature-negatives, and MRI and cardiac
    abnormalities showed the same all-or-nothing split, while intrauterine growth
    restriction was roughly twice as frequent in the positive group. Either the
    signature marks a mechanistically distinct subset - residual CUL3 activity,
    variant class, or a modifier - or the negative group contains
    misclassified variants and the split is an artefact of classifier
    sensitivity. The two readings have opposite consequences for using the
    signature to reclassify variants of uncertain significance, which is its main
    proposed clinical use. Denominators in the negative group are very small (one
    individual for the feeding-problem figure), so the apparent contrasts should
    not be over-read.
  evidence:
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, attention-deficit/hyperactivity disorder (ADHD) was observed in 33% of the signature positives but not observed (0%) in the signature negatives."
    explanation: >-
      One of the all-or-nothing phenotype contrasts between the two epigenetic
      subgroups that motivates this question.
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we performed genotype-phenotype correlation studies to explain the variety in clinical presentation between the cases."
    explanation: >-
      Confirms that the authors themselves treat explaining the clinical variety as
      an open analytic problem.
- discussion_id: cul3_mouse_human_phenotype_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the mouse Cul3 models capture the features that define the human disorder,
    or only the features that mice can express?
  attaches_to:
  - pathophysiology#Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
  - pathophysiology#Impaired Neuronal Migration and Cortical Lamination
  rationale: >-
    The mouse models are good where mice are good and silent where they are not.
    They reproduce social interaction deficits, hyperactivity, sensorimotor
    gating and cortical structural change, and they deliver the mechanism and the
    only pharmacological rescues available. They do not reproduce the human
    disorder's most consistent feature - speech and language delay, which has no
    murine counterpart - nor its facial dysmorphism, hand and foot anomalies, or
    seizures. The mismatch runs the other way too: the models show cortical
    lamination abnormality and reduced cortical volume, whereas most patients who
    have had a brain MRI have a normal study. So the cellular mechanism may be
    real in humans but sub-threshold for clinical imaging, or the mouse cortical
    phenotype may be more severe than the human one. Model evidence in this entry
    is therefore weighted towards mechanism and away from phenotype fidelity.
  proposed_experiments:
  - experiment_id: cul3_patient_ipsc_cortical_organoid
    name: Patient-derived iPSC cortical organoid migration and lamination assay
    description: >-
      Differentiate cortical organoids from iPSCs of individuals with pathogenic
      CUL3 variants and isogenic controls, and quantify radial migration speed,
      plastin-3 and RhoA abundance, and layer organisation. This tests the
      migration mechanism in human cells without requiring patient brain tissue.
    decision_criterion: >-
      Reduced migration speed with plastin-3 accumulation in patient organoids,
      corrected in the isogenic control, would carry the mouse mechanism into
      human cells; normal migration would indicate the mouse cortical phenotype
      does not transfer and would redirect weight towards the translational model.
  evidence:
  - reference: PMID:34031387
    reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that Cul3 is essential to regulate neuronal migration and, therefore, constitutive Cul3 heterozygous mutant mice display cortical lamination abnormalities."
    explanation: >-
      The mouse structural phenotype whose human counterpart is uncertain.
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Most individuals who had a brain MRI performed had a normal study, but three were noted to have mild ventriculomegaly."
    explanation: >-
      Human imaging does not show the structural abnormality the mouse model
      predicts, which is the substance of the mismatch.
notes: >-
  Curation notes. (1) Seizure frequency is deliberately unstated. The disease
  name and OMIM entry both foreground seizures, but the largest cohort reports
  they were not a recurrent feature; assigning any FrequencyEnum band would pick
  a side in an unsettled question. See the KNOWLEDGE_GAP discussion
  cul3_seizure_frequency_discordance. (2) Several phenotype frequencies published
  by the 26-individual episignature cohort are stratified by episignature status
  rather than reported for the whole cohort (intrauterine growth restriction,
  feeding problems, ADHD, cardiac and MRI abnormalities). Those phenotypes carry
  PARTIAL evidence and no frequency band, because a subgroup figure is not a
  cohort figure. (3) No GeneReviews chapter exists for CUL3-related
  neurodevelopmental disorder. A PubMed search for GeneReviews plus CUL3 returns
  only the Pseudohypoaldosteronism Type II chapter (PMID:22073419), which covers
  the other CUL3 disease and contains no neurodevelopmental content; it is
  therefore deliberately not cited here. (4) Deep research was run with two providers,
  claude_code and openscientist. Falcon (Edison) was attempted first and returned
  HTTP 402 Payment Required, so no falcon report exists for this entry. Both
  reports passed `just preflight-dr` against MONDO:0030994 (CUL3 dominant in gene
  mentions, 61 and 53 respectively) and both resolved 16/16 of their citations.
  The openscientist report carries needs_review: true for two references its
  validator judged off topic (PMID:42609138, PMID:42446772); neither is cited
  here. All PMIDs cited were independently fetched from PubMed and every snippet
  was verified against the local reference cache. (5) No `datasets:` records were
  added beyond geo:GSE144046. A CUL3 gene-symbol search over GEO returns lung
  adenocarcinoma, pulmonary fibrosis, yeast deletion and 16p11.2/KCTD13 rat
  series that share the gene but not the disease; those were triaged out rather
  than curated.

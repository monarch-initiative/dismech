genetic:
- name: CUL3
  gene_term:
    preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    CUL3 (cullin 3, 2q36.2, OMIM *603136) is the sole causative gene. It encodes
    the scaffold subunit of CRL3 ubiquitin ligases and is the only locus known to
    produce this phenotype. Independent of the syndromic-disorder literature,
    CUL3 was established as one of the highest-confidence autism risk genes by
    large-scale exome sequencing consortia, which is why the disorder was
    recognised through autism cohorts before it was described as a syndrome.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assembled a cohort of 37 individuals with heterozygous CUL3 variants presenting a syndromic NDD characterized by intellectual disability with or without autistic features."
    explanation: >-
      Establishes the gene-disease relationship at cohort scale, the basis for the
      CAUSATIVE relationship type.
  - reference: PMID:31455858
    reference_title: "Behavioral, circuitry, and molecular aberrations by region-specific deficiency of the high-risk autism gene Cul3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cullin 3 (Cul3) gene, which encodes a core component of the E3 ubiquitin ligase complex that mediates proteasomal degradation, has been identified as a true high-risk factor for autism."
    explanation: >-
      Supports CUL3's independent status as a high-confidence autism risk gene,
      the point made in the description.
  - reference: PMID:32341456
    reference_title: "De novo variants in CUL3 are associated with global developmental delays with or without infantile spasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that de novo CUL3 variants may cause structural instability of the CRL complex and impairment of the ubiquitin-proteasome system, leading to diverse neuropsychiatric disorders."
    explanation: >-
      Links de novo CUL3 variation to CRL complex instability, supporting both the
      DE_NOVO variant origin and the mechanistic claim.
  variants:
  - name: c.854T>C p.(Val285Ala)
    description: >-
      De novo missense substitution in the cullin N-terminal domain, from the
      founding case series. Unlike the truncating alleles it leaves a full-length
      protein, but the mutant binds BTB-domain adaptors significantly more weakly
      than wild type, reaching the same loss-of-capacity endpoint by a different
      route.
    gene:
      preferred_term: CUL3
      term:
        id: hgnc:2553
        label: CUL3
    type: missense variant
    evidence:
    - reference: PMID:32341456
      reference_title: "De novo variants in CUL3 are associated with global developmental delays with or without infantile spasms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Val285 residue located in the Cullin N-terminal domain and p.Val285Ala CUL3 mutant showed significantly weaker interactions to the BTB domain proteins than wild-type CUL3."
      explanation: >-
        Functional demonstration that this missense allele impairs adaptor binding,
        which is the claim made about it here.
  - name: c.1758_1759insTG p.(Thr587*)
    description: >-
      De novo two-base insertion producing a premature stop codon, identified by
      trio exome sequencing in a girl with autism spectrum disorder and
      Rett-like developmental regression after febrile status epilepticus.
    gene:
      preferred_term: CUL3
      term:
        id: hgnc:2553
        label: CUL3
    type: frameshift variant
    evidence:
    - reference: PMID:33097317
      reference_title: "A novel stop-gain CUL3 mutation in a Japanese patient with autism spectrum disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Trio-based exome sequencing identified a de novo two-base insertion in CUL3, c.1758_1759insTG, p.(Thr587*)."
      explanation: >-
        Reports the exact allele and its de novo origin.
  - name: c.379-2A>G
    description: >-
      De novo canonical acceptor splice-site variant in a child with congenital
      developmental dysplasia of the hip and global developmental delay. This was
      the first splice-site allele reported in the neurodevelopmental disorder -
      notable because splice variants had until then been associated with
      pseudohypoaldosteronism type IIE rather than with NEDAUS.
    gene:
      preferred_term: CUL3
      term:
        id: hgnc:2553
        label: CUL3
    type: splice acceptor variant
    evidence:
    - reference: PMID:36710200
      reference_title: "A novel splice site CUL3 variant in a patient with neurodevelopmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A de novo splice site variant (c.379-2A > G) was identified in CUL3 and is predicted to abolish the acceptor splice site."
      explanation: >-
        Reports the allele and its predicted consequence.
    - reference: PMID:36710200
      reference_title: "A novel splice site CUL3 variant in a patient with neurodevelopmental delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Splice variants in CUL3 are a well-described cause of pseudohypoaldosteronism type IIE; however, splice variants have not been associated with the neurodevelopmental disorder."
      explanation: >-
        Supports the significance claim - that splice alleles had previously been
        assigned to the other CUL3 disease, so this report crossed that boundary.
  - name: c.420C>G p.Tyr140Ter
    description: >-
      Inherited nonsense variant segregating in a family with short stature and

- name: Syndromic Neurodevelopmental Phenotype
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The organismal endpoint: a congenital-onset, largely static syndromic
    neurodevelopmental disorder in which global developmental delay, speech and
    language delay and intellectual disability are near-universal, mild
    dysmorphic facial features and hand and foot anomalies are common, and
    autism, behavioural abnormality, tremor or dystonia, growth restriction and
    seizures appear in subsets. The variability is not explained by variant class
    in any published analysis, which is why the disorder is named for its
    optional rather than its obligatory features.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We assembled a cohort of 37 individuals with heterozygous CUL3 variants presenting a syndromic NDD characterized by intellectual disability with or without autistic features."
    explanation: >-
      States the syndromic endpoint and its two-tier structure - obligatory
      intellectual disability, optional autistic features - that this node encodes.
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurodevelopmental disorder with or without autism or seizures (NEDAUS) is a neurodevelopmental disorder characterized by global developmental delay, speech delay, seizures, autistic features, and/or behavior abnormalities."
    explanation: >-
      Independent cohort description of the same organismal phenotype, naming its
      component features.

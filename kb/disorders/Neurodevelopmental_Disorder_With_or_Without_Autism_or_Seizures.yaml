    reference_title: "Autism risk gene Cul3 alters neuronal morphology via caspase-3 activity in mouse hippocampal neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that caspase-3 inhibition largely reversed the dendrite, axon, and spine morphological changes along with the inhibitory synaptic puncta changes."
    explanation: >-
      Rescue by caspase-3 inhibition identifies caspase-3 as the proximate mediator
      claimed in this node.
  downstream:
  - target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
    causal_link_type: DIRECT
    description: >-
      Selective loss of inhibitory synapses lowers inhibitory tone, contributing

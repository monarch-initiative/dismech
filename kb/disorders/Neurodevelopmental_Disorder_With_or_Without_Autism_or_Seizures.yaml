    evidence_source: HUMAN_CLINICAL
    snippet: "This finding provides a strong rationale for pursuing exome sequencing and serves as critical evidence for the clinical interpretation of CUL3 variants."
    explanation: >-
      States the diagnostic action the finding is intended to trigger, supporting
      the diagnostic flag.
- name: Mild ventriculomegaly on brain MRI
  modality: MRI
  phenotype_term:
    preferred_term: Ventriculomegaly
    term:
      id: HP:0002119
      label: Ventriculomegaly
  diagnostic: false
  description: >-
    The only recurring postnatal brain MRI abnormality in the largest cohort, in
    three individuals; most studies were normal. Recorded chiefly so that a
    normal MRI is not read as evidence against the diagnosis.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT

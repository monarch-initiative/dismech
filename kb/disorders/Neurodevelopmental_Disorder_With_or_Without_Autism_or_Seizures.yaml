- name: Reduced Dendritic Growth and Inhibitory Synapse Loss
  role: effector
  biological_scale: CELLULAR
  description: >-
    In Cul3-deficient hippocampal neurons dendritic complexity and length fall
    and axon formation is impaired, while gephyrin/vGAT puncta - a marker of
    inhibitory synapses - are selectively reduced with excitatory
    vGluT1/PSD95 puncta unchanged. The asymmetry matters: loss of inhibitory
    synapses is itself a route to excitation-inhibition imbalance, independent of
    the increase in glutamatergic drive produced by the translational branch.
    Elevated caspase-3 is the proximate mediator, and caspase-3 inhibition
    reverses both the morphological and inhibitory-synapse phenotypes.
  cell_types:
  - preferred_term: hippocampal pyramidal neuron
    term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: dendrite development
    term:
      id: GO:0016358
      label: dendrite development
    modifier: DECREASED
  - preferred_term: regulation of neuron apoptotic process
    term:
      id: GO:0043523
      label: regulation of neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38803442
    reference_title: "Autism risk gene Cul3 alters neuronal morphology via caspase-3 activity in mouse hippocampal neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Homozygous deletion of Cul3 significantly decreased dendritic complexity and dendritic length, as well as axon formation."
    explanation: >-
      Reports the dendritic and axonal morphology deficit asserted by this node.
  - reference: PMID:38803442
    reference_title: "Autism risk gene Cul3 alters neuronal morphology via caspase-3 activity in mouse hippocampal neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both heterozygous and homozygous knockout of Cul3 caused significant reductions in the density and colocalization of gephyrin/vGAT puncta, providing evidence of decreased inhibitory synapse number, while excitatory synaptic puncta vGulT1/PSD95 density remained unchanged."
    explanation: >-
      Establishes the selective loss of inhibitory synapses - and, importantly,
      that it occurs in the heterozygous state that models the human disease.

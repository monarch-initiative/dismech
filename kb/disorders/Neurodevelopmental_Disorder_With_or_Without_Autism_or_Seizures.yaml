  findings:
  - statement: >-
      Largest published cohort (37 individuals); establishes haploinsufficiency
      via loss-of-function variants as the predominant mechanism and reports the
      core phenotype frequencies used throughout this entry.
- reference: PMID:39501558
  title: >-
    CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new
    individuals and identification of a potential phenotype-associated episignature.
  findings:
  - statement: >-
      26-individual cohort; defines a sensitive and specific DNA methylation
      episignature usable to reclassify CUL3 variants of uncertain significance.
- reference: PMID:32341456
  title: >-
    De novo variants in CUL3 are associated with global developmental delays with
    or without infantile spasms.
  findings:
  - statement: >-
      Founding clinical description of the disorder; shows that the p.Val285Ala
      missense mutant binds BTB-domain proteins more weakly than wild-type CUL3.
inheritance:
- name: Autosomal dominant, predominantly de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  penetrance: INCOMPLETE
  description: >-
    Heterozygous CUL3 variants act dominantly through haploinsufficiency. Most
    reported probands carry de novo variants identified by trio exome
    sequencing, but transmission from a mildly affected parent is documented,
    which is why apparently unaffected parents should not be assumed to be
    non-carriers. Expressivity is variable even within a family: in one reported
    pedigree two sisters carrying a nonsense variant had short stature and
    neurodevelopmental disorder while their carrier father had neurodevelopmental
    disorder and epilepsy but normal height.
  evidence:
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by CUL3 (Cullin-3 ubiquitin ligase) haploinsufficiency."
    explanation: >-
      States the dominant loss-of-function dosage mechanism that underlies the
      autosomal dominant inheritance pattern.
  - reference: PMID:40763714
    reference_title: "Short Stature and Response to Growth Hormone Treatment in CUL3-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our finding expands the spectrum of disease-causing variants in CUL3 and demonstrates variable intra-familial clinical expressivity."
    explanation: >-
      Directly documents variable expressivity among carriers of the same variant
      within a family, supporting the expressivity statement.
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we provide additional evidence supporting the role of CUL3 in ASD and/or ID with variable penetrance"
    explanation: >-
      The cohort authors' own characterisation of penetrance as variable, which is
      the separate claim from expressivity and is what the "with or without" in the
      disease name encodes. Mapped to INCOMPLETE; no quantitative penetrance
      estimate is reported, so penetrance_percentage is deliberately omitted.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence estimate exists. The disorder is known from case
    reports and two multicentre cohorts of 37 and 26 molecularly confirmed
    individuals; ascertainment is entirely through trio exome or genome
    sequencing of children with neurodevelopmental disorder, so published counts
    are a lower bound rather than an estimate.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo variants in cullin-3 ubiquitin ligase (CUL3) have been strongly associated with neurodevelopmental disorders (NDDs), but no large case series have been reported so far."
    explanation: >-
      Establishes that, as of the largest cohort study, the disorder was known
      only from scattered reports with no large series - the basis for recording
      occurrence as a literature case count rather than a rate.
pathophysiology:
- name: Heterozygous CUL3 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous CUL3 allele is inactivated by a nonsense, frameshift,
    canonical splice-site or whole-gene deletion event, or by a missense
    substitution that destabilises the cullin scaffold. Across the two published
    cohorts the truncating and splice classes dominate; missense alleles are a
    minority and at least one (p.Val285Ala, in the cullin N-terminal domain) has
    been shown biochemically to weaken binding to BTB-domain adaptors rather than
    to abolish the protein. Almost all reported variants are de novo.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  genetic_context:
    gene:
      preferred_term: CUL3
      term:
        id: hgnc:2553
        label: CUL3
    allele_type: SNV
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous, predominantly de novo loss-of-function alleles. Reported
      classes include nonsense, frameshift, canonical splice-site, whole-gene
      deletion and destabilising missense substitutions. The single reported
      deletion removed CUL3 together with neighbouring genes, so it is a
      contiguous multigene CNV rather than a CUL3-only deletion.
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, 35 have loss-of-function (LoF) and 2 have missense variants."
    explanation: >-
      Quantifies the variant spectrum in the largest cohort, establishing
      loss-of-function alleles as the dominant class of trigger event.
  - reference: PMID:32341456
    reference_title: "De novo variants in CUL3 are associated with global developmental delays with or without infantile spasms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One missense variant c.854T>C, p.(Val285Ala) and two frameshift variants c.137delG, p.(Arg46Leufs*32) and c.1239del, p.(Asp413Glufs*42) were identified by whole-exome sequencing."
    explanation: >-
      Names the specific de novo alleles in the founding case series, documenting
      both the frameshift and missense classes of trigger variant.
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight had a nonsense CUL3 variant, five had a missense CUL3 variant, nine had a frameshift CUL3 variant, three had a splice site CUL3 variant, and one particpant had a large deletion encompassing multiple genes, including CUL3."
    explanation: >-
      The only cited evidence for the whole-gene deletion class asserted above:
      one of 26 individuals carried a deletion encompassing CUL3 and neighbouring
      genes. Also gives the full class distribution across this cohort.
      ("particpant" is misspelled in the source and is quoted verbatim.)
  downstream:
  - target: Cullin-3 Haploinsufficiency and Reduced CRL3 Ligase Capacity
    causal_link_type: DIRECT
    description: >-
      Inactivation of one allele halves the pool of functional cullin-3 scaffold
      available to nucleate CRL3 complexes; destabilising missense alleles reach
      the same endpoint by weakening adaptor engagement.
    evidence:
    - reference: PMID:32341456
      reference_title: "De novo variants in CUL3 are associated with global developmental delays with or without infantile spasms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The Val285 residue located in the Cullin N-terminal domain and p.Val285Ala CUL3 mutant showed significantly weaker interactions to the BTB domain proteins than wild-type CUL3."
      explanation: >-
        Shows experimentally that a disease allele reduces the scaffold's ability
        to engage its substrate adaptors, the immediate consequence asserted here.
- name: Cullin-3 Haploinsufficiency and Reduced CRL3 Ligase Capacity
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Cullin-3 is the scaffold that bridges the RBX1-E2 module to a BTB-domain
    substrate adaptor, so its dose sets the assembly capacity of the entire CRL3
    ligase family rather than of one enzyme. Halving that dose lowers global
    ubiquitin-conjugating output: patient-derived T cells show reduced
    ubiquitin-protein conjugates. This node is the disorder-agnostic
    rate-limiting step from which every downstream branch of the entry descends.
  genes:
  - preferred_term: CUL3
    term:
      id: hgnc:2553
      label: CUL3
  protein_complexes:
  - preferred_term: CRL3 (cullin-3-RBX1-BTB adaptor) E3 ubiquitin ligase
    term:
      id: GO:0031463
      label: Cul3-RING ubiquitin ligase complex
    modifier: DECREASED
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity of the CRL3 complex
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CUL3 LoF variants in patients may affect protein stability leading to perturbations in protein homeostasis, as evidenced by decreased ubiquitin-protein conjugates in vitro."
    explanation: >-
      Demonstrates in patient-derived cells that the loss-of-function alleles
      lower ubiquitin-conjugating output, which is the defining claim of this node.
  - reference: PMID:39501558
    reference_title: "CUL3-related neurodevelopmental disorder: Clinical phenotype of 20 new individuals and identification of a potential phenotype-associated episignature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is caused by CUL3 (Cullin-3 ubiquitin ligase) haploinsufficiency."
    explanation: >-
      Independent cohort attributing the disorder to haploinsufficiency of the
      cullin-3 ligase rather than to a dominant-negative or gain-of-function effect.
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggests haploinsufficiency via LoF variants is the predominant pathogenic mechanism"
    explanation: >-
      States the authors' mechanistic conclusion, supporting haploinsufficiency as
      the central effector rather than one of several competing mechanisms.
  downstream:
  - target: Failure of CRL3 Substrate Degradation
    causal_link_type: DIRECT
    description: >-
      Reduced ligase capacity leaves CRL3 substrates insufficiently
      polyubiquitinated and therefore not delivered to the proteasome.
    evidence:
    - reference: PMID:39301775
      reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Notably, we show that 4E-BP1 (EIF4EBP1), a prominent substrate of CUL3, fails to be targeted for proteasomal degradation in patient-derived cells."
      explanation: >-
        Directly links reduced ligase capacity to failed proteasomal degradation of
        a named CRL3 substrate in patient cells.
- name: Failure of CRL3 Substrate Degradation
  role: mediator
  biological_scale: MOLECULAR
  description: >-
    Because CRL3 acts through interchangeable BTB adaptors, scaffold shortage is
    felt across a substrate set rather than at a single protein, and the
    substrates that have been shown to accumulate map onto the two downstream
    branches this entry curates. Translational control substrates - 4E-BP1
    (EIF4EBP1), shown to escape proteasomal degradation in patient-derived cells,
    and eIF4G1, identified proteomically as a CUL3 target in mouse brain - feed
    the cap-dependent translation branch. Cytoskeletal substrates - the small
    GTPase RhoA, and plastin-3 - feed the neuronal migration and dendrite branch;
    RhoA is presented to CUL3 by the BTB adaptors BACURD1/KCTD13 and
    BACURD2/TNFAIP1, which is the point at which this disorder touches the
    16p11.2 copy-number syndrome, since KCTD13 lies in that interval. The
    substrate list is almost certainly incomplete.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:39301775
    reference_title: "Loss-of-Function Variants in CUL3 Cause a Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, we show that 4E-BP1 (EIF4EBP1), a prominent substrate of CUL3, fails to be targeted for proteasomal degradation in patient-derived cells."
    explanation: >-
      Human patient-cell demonstration that a named CRL3 substrate escapes
      degradation, the defining claim of this node.
  - reference: PMID:31780330
    reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proteomic analysis revealed eIF4G1, a protein for Cap-dependent translation, as a potential target of CUL3."
    explanation: >-
      Identifies a second translational-machinery substrate of CUL3, supporting the
      claim that the affected substrate set converges on translational control.
  - reference: PMID:33727673
    reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of small GTPase RhoA, a molecular substrate of Cul3 ligase, rescued dendrite length and network activity phenotypes."
    explanation: >-
      Establishes RhoA as a CUL3 substrate whose excess activity is pathogenic,
      supporting the cytoskeletal arm of the substrate set.
  - reference: PMID:34031387
    reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At the molecular level, we found that Cul3 controls neuronal migration by tightly regulating the amount of Plastin3 (Pls3), a previously unrecognized player of neural migration."
    explanation: >-
      Names plastin-3 as a dose-controlled CUL3 substrate, the second cytoskeletal
      substrate feeding the migration branch.
  - reference: PMID:26969432
    reference_title: "Bacurd1/Kctd13 and Bacurd2/Tnfaip1 are interacting partners to Rnd proteins which influence the long-term positioning and dendritic maturation of cerebral cortical neurons."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "we recently identified the BTB/POZ domain-containing Adaptor for Cul3-mediated RhoA Degradation family member Bacurd2 (also known as Tnfaip1) as an interacting partner to Rnd2 for the migration of embryonic mouse cortical neurons"
    explanation: >-
      Names the BTB adaptors that present RhoA to CUL3 and ties them to cortical
      neuron migration. Recorded as PARTIAL because it characterises the adaptors
      rather than measuring substrate accumulation under CUL3 loss.
  - reference: PMID:26969432
    reference_title: "Bacurd1/Kctd13 and Bacurd2/Tnfaip1 are interacting partners to Rnd proteins which influence the long-term positioning and dendritic maturation of cerebral cortical neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we performed a series of in utero electroporation studies in mice and found that disruptions to Bacurd1/Kctd13 or Bacurd2/Tnfaip1 expression impair the long-term positioning of E14.5-born cortical neurons within the postnatal (P17) mouse cerebral cortex"
    explanation: >-
      Shows that perturbing the adaptor arm of the same ligase complex reproduces
      the cortical positioning defect, supporting the adaptor route as the
      mechanistically relevant one.
  downstream:
  - target: Dysregulated Cap-Dependent Translation
    causal_link_type: DIRECT
    description: >-
      Accumulation of the translation-initiation regulators 4E-BP1 and eIF4G1
      dysregulates cap-dependent initiation in CUL3-deficient neurons.
    evidence:
    - reference: PMID:31780330
      reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ASD-associated cellular and behavioral deficits could be rescued by pharmacological inhibition of the eIF4G1 function and chemogenetic inhibition of neuronal activity."
      explanation: >-
        Rescue by inhibiting the accumulated substrate shows the translational
        dysregulation is causal, not incidental, downstream of CUL3 loss.
  - target: Impaired Neuronal Migration and Cortical Lamination
    causal_link_type: DIRECT
    description: >-
      Failure to hold plastin-3 and RhoA at their normal levels disorganises the
      actin cytoskeleton on which radial neuronal migration depends.
    evidence:
    - reference: PMID:34031387
      reference_title: "Cul3 regulates cytoskeleton protein homeostasis and cell migration during a critical window of brain development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we found that Pls3 cell-autonomously regulates cell migration by regulating actin cytoskeleton organization, and its levels are inversely proportional to neural migration speed."
      explanation: >-
        Ties the accumulating substrate mechanistically to actin organisation and
        migration speed, the link asserted by this edge.
  - target: Reduced Dendritic Growth and Inhibitory Synapse Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - RhoA-dependent actin cytoskeletal dysregulation
    - caspase-3 activation
    description: >-
      Excess RhoA activity, together with elevated caspase-3, restricts dendritic
      arborisation and reduces inhibitory synaptic puncta.
    evidence:
    - reference: PMID:33727673
      reference_title: "Autism-linked Cullin3 germline haploinsufficiency impacts cytoskeletal dynamics and cortical neurogenesis through RhoA signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Specifically, dendritic growth, filamentous actin puncta, and spontaneous network activity were reduced in Cul3 mutant mice."
      explanation: >-
        Reports the dendritic and network phenotype that this edge asserts follows
        from cytoskeletal substrate dysregulation.
- name: Dysregulated Cap-Dependent Translation
  role: effector
  biological_scale: CELLULAR
  description: >-
    CUL3 normally restrains cap-dependent translation initiation by turning over
    initiation-complex proteins. When that restraint is lost, translational
    output in neurons is dysregulated; in CUL3-deficient mice this manifests as
    enhanced glutamatergic transmission and neuronal excitability, and both the
    cellular and behavioural phenotypes are reversed by pharmacological
    inhibition of eIF4G1. Dysregulated cap-dependent translation is a mechanism
    shared with several other monogenic autism syndromes, which is what makes it
    the most tractable candidate node for intervention in this disorder.
  biological_processes:
  - preferred_term: cap-dependent translational initiation
    term:
      id: GO:0002191
      label: cap-dependent translational initiation
    modifier: INCREASED
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:31780330
    reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CUL3-deficient mice exhibited social deficits and anxiety-like behaviors with enhanced glutamatergic transmission and neuronal excitability."
    explanation: >-
      Reports the transmission and excitability changes that accompany the
      translational dysregulation asserted by this node.
  - reference: PMID:31780330
    reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ASD-associated cellular and behavioral deficits could be rescued by pharmacological inhibition of the eIF4G1 function and chemogenetic inhibition of neuronal activity."
    explanation: >-
      Rescue on inhibiting the translation-initiation factor is the strongest
      evidence that this node is causal in the pathway.
  downstream:
  - target: Excitation-Inhibition Imbalance in Cortico-Striatal Circuits
    causal_link_type: DIRECT
    description: >-
      Excess cap-dependent translation raises glutamatergic drive and neuronal
      excitability, shifting the excitation-inhibition balance.
    evidence:
    - reference: PMID:31780330
      reference_title: "CUL3 Deficiency Causes Social Deficits and Anxiety-like Behaviors by Impairing Excitation-Inhibition Balance through the Promotion of Cap-Dependent Translation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, CUL3 is critical to neural development, neurotransmission, and excitation-inhibition (E-I) balance."
      explanation: >-
        States the authors' conclusion that CUL3 loss acts on excitation-inhibition
        balance, which is the target of this edge.
- name: Impaired Neuronal Migration and Cortical Lamination
  role: effector
  biological_scale: TISSUE
  description: >-
    Cul3 is required to hold plastin-3 at the level that permits normal radial
    migration, and constitutive heterozygous mice show cortical lamination
    abnormalities as a result. The requirement is developmentally gated: inducing
    the same haploinsufficiency in adult mice does not produce autism-relevant
    behaviour, which places the pathogenic window in embryonic and early
    postnatal corticogenesis and is the strongest argument in this disorder
    against expecting a purely postnatal pharmacological rescue.
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DECREASED
  - preferred_term: cerebral cortex radially oriented cell migration
    term:
      id: GO:0021799
      label: cerebral cortex radially oriented cell migration
    modifier: DECREASED

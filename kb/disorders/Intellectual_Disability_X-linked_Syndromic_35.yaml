disease_term:
  preferred_term: intellectual disability, X-linked, syndromic, 35
  term:
    id: MONDO:0030908
    label: intellectual disability, X-linked, syndromic, 35
synonyms:
- MRXS35
- syndromic X-linked intellectual disability 35
- intellectual developmental disorder, X-linked, syndromic, 35
- mental retardation, X-linked, syndromic, 35
- RPL10-related disorder
- RPL10-related syndromic X-linked intellectual disability
description: >
  Syndromic X-linked intellectual disability 35 (MRXS35; OMIM 300998) is an
  ultra-rare X-linked ribosomopathy caused by hemizygous missense variants in
  RPL10 at Xq28. RPL10 encodes uL16, a 214-amino-acid protein of the large (60S)
  ribosomal subunit that sits close to the peptidyl transferase centre and is
  required for the final cytoplasmic maturation step at which the export adapter
  Nmd3 and the anti-association factor Tif6 are released, licensing the subunit
  to enter translation.

  Affected males present with intellectual disability and psychomotor delay,
  speech delay that is frequently absent speech, microcephaly (congenital or
  progressive postnatal), growth retardation and short stature, hypotonia,
  seizures that may be refractory and early-onset, craniofacial dysmorphism, and
  a variable set of congenital anomalies spanning genitourinary (cryptorchidism,
  hypospadias, vesicoureteral reflux), cardiac, ophthalmological (exotropia,
  retinal degeneration), skeletal (spondyloepiphyseal dysplasia), and airway
  (laryngomalacia) systems. Cerebellar hypoplasia is seen on neuroimaging in a
  subset. Transmission is usually from an unaffected carrier mother, with skewed
  X inactivation documented in carriers; de novo occurrence has been reported.

  IMPORTANT SCOPE NOTE — the RPL10 allelic series is broad and this entry covers
  the syndromic end of it. The C-terminal substitutions p.L206M and p.H213Q were
  originally reported as autism susceptibility alleles (AUTSX5, OMIM 300847) and
  behave as hypomorphs that preserve basic translation; they are modelled here as
  a distinct milder branch of the same gene's mechanism, not as MRXS35 proper.
  Separately, somatic RPL10 variants (notably p.R98S) are recurrent drivers in
  T-cell acute lymphoblastic leukemia. That is an entirely distinct somatic
  disease context and must not be conflated with this germline
  neurodevelopmental disorder; R98S yeast work is cited here only to establish
  the conserved biochemical role of uL16 in 60S maturation, and every such item
  is graded accordingly.

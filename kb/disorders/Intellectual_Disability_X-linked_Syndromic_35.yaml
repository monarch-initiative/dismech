discussions:
- discussion_id: ul16_maturation_checkpoint_untested_in_syndromic_alleles
  kind: KNOWLEDGE_GAP
  prompt: >
    Does the 60S maturation checkpoint failure demonstrated for uL16 in yeast
    actually occur in cells carrying the MRXS35 alleles?
  attaches_to:
  - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
  rationale: >
    The molecular step in this entry's central node - trapping of Nmd3 in the P
    site and failure to release Tif6 - has been demonstrated for the somatic
    leukemia allele rpl10-R98S in S. cerevisiae, not for any of the germline
    syndromic alleles. The MRXS35 alleles have been assayed only at coarser
    resolution: morphant rescue in zebrafish (p.K78E), transcript and protein
    level in transfected cells (p.R116Q), and polysome distribution in yeast
    (p.A64V). No study has measured Nmd3/Tif6 release, pre-60S quality control
    passage, or subunit joining for a syndromic allele. The chain from the
    initiating lesion to reduced translational capacity is therefore assembled
    from a conserved-protein argument rather than from direct measurement in this
    disease, and the evidence items on those edges are graded INDIRECT for that
    reason.
  evidence:
  - reference: PMID:28715419
    reference_title: The T-cell leukemia related rpl10-R98S mutant traps the 60S export
      adapter Nmd3 in the ribosomal P site in yeast.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Mutations in the ribosomal protein Rpl10 (uL16) can be drivers of T-cell acute lymphoblastic leukemia (T-ALL)."
    explanation: >-
      Establishes the gap: the allele in which this checkpoint defect was
      characterised is a leukemia driver, not one of the germline syndromic
      alleles this entry is about.
  proposed_experiments:
  - experiment_id: late_60s_maturation_assay_across_mrxs35_alleles
    name: Late 60S maturation assay across the MRXS35 allelic series
    description: >
      Reconstitute each syndromic RPL10 allele (p.R32L, p.A64V, p.K78E, p.R116Q)
      alongside p.R98S and wild type, and measure Nmd3 and Tif6 release,
      pre-60S cytoplasmic quality control passage, and 60S-40S subunit joining.
    would_support:
    - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
    supporting_outcome:
    - >-
      Syndromic alleles show retained Nmd3 and Tif6 on cytoplasmic pre-60S
      particles and reduced subunit joining relative to wild type.
    would_refute:
    - pathophysiology#Impaired Late Cytoplasmic 60S Subunit Maturation
    refuting_outcome:
    - >-
      Syndromic alleles release Nmd3 and Tif6 normally and join subunits at
      wild-type rates, indicating the neurodevelopmental alleles act through a
      mechanism other than the late maturation checkpoint.
- discussion_id: a64v_increased_translating_ribosomes_paradox
  kind: KNOWLEDGE_GAP
  prompt: >
    Why does p.A64V increase the actively translating ribosome population when a
    loss-of-function model predicts the opposite?
  attaches_to:
  - pathophysiology#Hypomorphic C-Terminal uL16 Variants Altering Translational Regulation
  - genetic#RPL10
  rationale: >
    The dominant mechanistic account of this disorder is loss of function, and two
    alleles support it. p.A64V does not: in yeast it complements a conditional
    lethal rpl10 mutation and shifts the polysome profile toward more actively
    translating ribosomes, yet the two cousins carrying it have intellectual
    disability, cerebellar hypoplasia and spondyloepiphyseal dysplasia. Either the
    disorder can arise from opposite directions of translational perturbation, or
    the yeast polysome readout does not capture the relevant human defect. This
    matters for interpretation of new missense alleles, which are routinely
    returned as variants of uncertain significance and adjudicated against a
    loss-of-function expectation.
  evidence:
  - reference: PMID:26290468
    reference_title: A Novel Mutation in RPL10 (Ribosomal Protein L10) Causes X-Linked
      Intellectual Disability, Cerebellar Hypoplasia, and Spondylo-Epiphyseal Dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation generates a functional ribosomal protein, able to complement the translational defects of a conditional lethal mutation of yeast rpl10."
    explanation: >-
      Documents the observation that creates the gap: a pathogenic allele that
      nonetheless yields a functional protein, contradicting a uniform
      loss-of-function account.
  proposed_experiments:
  - experiment_id: a64v_vs_lof_in_human_neural_progenitors
    name: Human neural cell comparison of p.A64V against loss-of-function alleles
    description: >
      Introduce p.A64V and a demonstrated loss-of-function allele into isogenic
      human iPSC-derived neural progenitors and compare ribosome content, bulk
      translation rate, translational fidelity and the translated transcriptome.
    would_support:
    - pathophysiology#Reduced Pool of Translation-Competent 60S Subunits
    supporting_outcome:
    - >-
      p.A64V reduces ribosome content or bulk translation in human neural cells
      despite the opposite polysome result in yeast, reconciling it with the
      loss-of-function chain.
    would_refute:
    - pathophysiology#Reduced Pool of Translation-Competent 60S Subunits
    refuting_outcome:
    - >-
      p.A64V leaves ribosome content and bulk translation intact while altering
      which transcripts are translated, indicating a qualitative rather than
      quantitative translational lesion.

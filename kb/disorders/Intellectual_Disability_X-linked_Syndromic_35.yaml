    reference_title: 'A de novo mutation in RPL10 causes a rare X-linked ribosomopathy
      characterized by syndromic intellectual disability and epilepsy: A new case and
      review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first instance that a de novo mutation in RPL10 has been reported."
    explanation: Documents that de novo occurrence, while the exception, does happen.
genetic:
- name: RPL10
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RPL10
    term:
      id: hgnc:10298
      label: RPL10
  notes: >
    RPL10 (Xq28; reference transcript NM_006013.5, seven exons) encodes uL16, a
    214-amino-acid structural component of the 60S ribosomal subunit. Every
    reported MRXS35 allele is missense; no truncating allele has been described,
    consistent with complete loss of this core ribosomal protein being
    incompatible with viability. Reported syndromic substitutions cluster in the
    N-terminal and rRNA-contacting regions (p.R32L, p.A64V, p.K78E, p.R116Q),
    whereas the C-terminal p.L206M and p.H213Q alleles were reported in autism
    families and behave as hypomorphs. Functional data support loss of function:
    p.K78E fails to rescue rpl10 morphant zebrafish, and p.R116Q reduces RPL10
    mRNA and protein in transfected cells. The p.A64V allele is the informative
    exception, producing a functional protein that instead increases the
    actively translating ribosome pool, so "loss of function" should not be
    assumed uniformly across the allelic series.

    RPL10 is strongly constrained in population reference data (gnomAD v2
    pLI 0.997, missense Z 4.08), which fits the missense-only allelic spectrum:
    partial-loss-of-function substitutions are compatible with viability where a
    null allele is not. These constraint statistics are database values rather
    than a finding quoted from a paper, so they are recorded here rather than as
    an evidence item; the gnomAD absence of a specific pathogenic allele is
    separately cited under the Secondary microcephaly phenotype.
  evidence:
  - reference: PMID:25316788
    reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
      neurodevelopment and causes X-linked microcephaly in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel missense mutation in the gene encoding 60S ribosomal protein L10 (RPL10), a locus associated previously with autism spectrum disorders (ASD)"
    explanation: Establishes RPL10 as the causative gene for the syndromic X-linked
      phenotype.
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The X-linked syndromic intellectual developmental disorder-35 (MRXS35; OMIM#300998) is caused by variants in the RPL10 gene (OMIM*312173) on chromosome Xq28."
    explanation: Names the disorder, its OMIM identifier, and the causative gene and
      locus.
  - reference: PMID:25316788
    reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
      neurodevelopment and causes X-linked microcephaly in humans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "using in vivo complementation, we demonstrate that p.K78E is a loss-of-function variant"
    explanation: Direct functional demonstration of loss of function for the recurrent
      p.K78E allele.
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our in vitro functional analysis indicated a loss-of-function effect of RPL10 gene variants."
    explanation: Independent in vitro replication of the loss-of-function mechanism
      for a second allele.
pathophysiology:
- name: RPL10 Missense Substitution in uL16
  genetic_context:
    gene:
      preferred_term: RPL10
      term:
        id: hgnc:10298
        label: RPL10
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >
      Hemizygous missense substitutions in males. Loss of function is the
      predominant demonstrated consequence across the syndromic alleles, shown
      independently for p.K78E by failed morphant rescue in zebrafish and for
      p.R116Q by reduced transcript and protein in transfected cells. The p.A64V
      allele is the documented exception and is modelled separately.
  description: >
    A hemizygous missense substitution alters uL16, the 60S ribosomal subunit
    protein encoded by RPL10. The syndromic alleles fall in the N-terminal and
    rRNA-contacting surfaces of the protein, which lie close to the peptidyl
    transferase centre; p.R32L sits in the 28S rRNA binding region and is
    predicted to break the Arg32-Asp28 salt bridge. This is the initiating
    molecular lesion of the disorder.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: structural constituent of ribosome
    modifier: DECREASED
    term:
      id: GO:0003735
      label: structural constituent of ribosome
  downstream:
  - target: Impaired Late Cytoplasmic 60S Subunit Maturation
    causal_link_type: DIRECT
    description: >
      The altered protein is incorporated into pre-60S particles but cannot
      complete the final cytoplasmic maturation step.
    evidence:
    - reference: PMID:24706786
      reference_title: Bypass of the pre-60S ribosomal quality control as a pathway
        to oncogenesis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "This mutation causes a late-stage 60S subunit maturation failure that targets mutant ribosomes for degradation."
      explanation: >-
        Establishes in yeast that an rpl10/uL16 missense substitution acts by
        failing late 60S maturation. Cited for the conserved biochemistry of
        uL16; the allele studied is the somatic leukemia variant, not an MRXS35
        allele, hence INDIRECT.
  evidence:
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RPL10 protein is a 214-amino-acid ribosomal protein that is a critical component of the 60S ribosome subunit."
    explanation: Establishes the identity and ribosomal role of the affected protein.
  - reference: PMID:35876338
    reference_title: Postnatal microcephaly and retinal involvement expand the phenotype
      of RPL10-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant, not reported in gnomAD, is located in the 28S rRNA binding region, affecting an evolutionary conserved residue and predicted to disrupt the salt-bridge between Arg32 and Asp28."
    explanation: Localises a recurrent syndromic allele to the rRNA-binding surface
      of uL16.
  - reference: PMID:25316788
    reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
      neurodevelopment and causes X-linked microcephaly in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a mutation within the conserved N-terminal end of RPL10, a protein in close proximity to the peptidyl transferase active site of the 60S ribosomal subunit, causes severe defects in brain formation and function"
    explanation: Places the syndromic substitutions near the peptidyl transferase centre
      and links them to the brain phenotype.
- name: Impaired Late Cytoplasmic 60S Subunit Maturation
  description: >
    uL16 is the sensor for the final cytoplasmic quality-control checkpoint of
    60S biogenesis. Correct uL16 placement in the P site is required to dislodge
    the export adapter Nmd3, which in turn permits Sdo1-stimulated Efl1 to
    release the anti-association factor Tif6. A missense-altered uL16 traps Nmd3
    in the P site, so Nmd3 and Tif6 are not released and the subunit cannot be
    licensed for translation.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: ribosomal large subunit biogenesis
    modifier: DECREASED
    term:
      id: GO:0042273
      label: ribosomal large subunit biogenesis
  - preferred_term: maturation of LSU-rRNA
    modifier: DECREASED
    term:
      id: GO:0000470
      label: maturation of LSU-rRNA
  downstream:
  - target: Reduced Pool of Translation-Competent 60S Subunits
    causal_link_type: DIRECT
    description: >
      Subunits that fail the checkpoint are withheld from the translating pool
      and targeted for degradation.
    evidence:
    - reference: PMID:28715419
      reference_title: The T-cell leukemia related rpl10-R98S mutant traps the 60S
        export adapter Nmd3 in the ribosomal P site in yeast.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Consequently, these mutant ribosomes do not efficiently pass the cytoplasmic quality control checkpoint and are blocked from engaging in translation."
      explanation: >-
        States the causal step from failed maturation to exclusion from the
        translating pool. Yeast biochemistry on the leukemia allele, cited for
        the conserved uL16 checkpoint rather than for an MRXS35 allele, hence
        INDIRECT.
  evidence:
  - reference: PMID:28715419
    reference_title: The T-cell leukemia related rpl10-R98S mutant traps the 60S export
      adapter Nmd3 in the ribosomal P site in yeast.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "We previously showed that these T-ALL mutations disrupt late cytoplasmic maturation of the 60S ribosomal subunit, blocking the release of the trans-acting factors Nmd3 and Tif6 in S. cerevisiae."
    explanation: >-
      Defines the conserved biochemical checkpoint that uL16 governs. The allele
      studied is somatic and leukemia-associated, so this establishes the
      mechanism of the protein, not of an MRXS35 variant.
  - reference: PMID:28715419
    reference_title: The T-cell leukemia related rpl10-R98S mutant traps the 60S export
      adapter Nmd3 in the ribosomal P site in yeast.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "define a failure in the removal of Nmd3 as the molecular defect of the T-ALL-associated rpl10-R98S mutation"
    explanation: >-
      Identifies trapped Nmd3 in the P site as the specific molecular lesion of a
      uL16 missense substitution.
  - reference: PMID:9443083
    reference_title: Assembly of the QM protein onto the 60S ribosomal subunit occurs
      in the cytoplasm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This finding suggests that the QM protein is most likely involved in a late step of the 60S subunit assembly and is added to the 60S ribosomal subunit in the cytoplasm and not in the nucleolus."
    explanation: >-
      Establishes in human cells that this protein joins the 60S subunit late and
      in the cytoplasm, which is what makes the cytoplasmic checkpoint the
      relevant step. QM is the original name for the protein now called RPL10;
      the paper predates the RPL10 nomenclature.
  - reference: PMID:9443083
    reference_title: Assembly of the QM protein onto the 60S ribosomal subunit occurs
      in the cytoplasm.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the gene for this protein has also been shown in Saccharomyces cerevisiae to encode an essential 60S ribosomal subunit protein that is required for the joining of the 40S and 60S subunits"
    explanation: >-
      States the subunit-joining requirement that failed maturation removes. Cited
      under the QM name for RPL10.
- name: Reduced Pool of Translation-Competent 60S Subunits
  description: >
    Fewer mature 60S subunits reach the cytoplasmic translating pool, lowering
    the cell's capacity for bulk protein synthesis. In zebrafish, rpl10
    suppression reduces bulk translation directly.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: ribosome assembly
    modifier: DECREASED
    term:
      id: GO:0042255
      label: ribosome assembly
  - preferred_term: cytoplasmic translation
    modifier: DECREASED
    term:
      id: GO:0002181
      label: cytoplasmic translation
  downstream:
  - target: Increased Apoptosis and Impaired Proliferation in the Developing Brain
    causal_link_type: DIRECT
    description: >
      Reduced translational capacity in neural tissue is accompanied by increased
      apoptosis in the developing brain.
    evidence:
    - reference: PMID:25316788
      reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
        neurodevelopment and causes X-linked microcephaly in humans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "suppression decreases head size in developing morphant embryos, concomitant with reduced bulk translation and increased apoptosis in the brain"
      explanation: Links reduced bulk translation to brain apoptosis in the same experiment.
  evidence:
  - reference: PMID:24706786
    reference_title: Bypass of the pre-60S ribosomal quality control as a pathway to
      oncogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The resulting deficit in ribosomes causes the hypoproliferative phenotype."
    explanation: >-
      Connects the maturation failure to a measurable ribosome deficit and a
      hypoproliferative cellular consequence, in the yeast uL16 model.
- name: Increased Apoptosis and Impaired Proliferation in the Developing Brain
  description: >
    Neural progenitors and neurons are disproportionately sensitive to reduced
    ribosome supply, a tissue-specific vulnerability shared across
    ribosomopathies. rpl10 is expressed preferentially in anterior structures in
    zebrafish, and its suppression increases brain apoptosis and reduces head
    size. Nucleolar and ribosome-biogenesis proteins as a class are enriched for
    human neurodevelopmental phenotypes dominated by microcephaly and cognitive
    impairment.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  downstream:
  - target: Impaired Brain Growth and Cerebellar Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25316788
      reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
        neurodevelopment and causes X-linked microcephaly in humans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We show that endogenous rpl10 expression is augmented in anterior structures, and that suppression decreases head size in developing morphant embryos"
      explanation: Ties loss of rpl10 function directly to reduced head size in a developing
        vertebrate.
  evidence:
  - reference: PMID:27053602
    reference_title: Nucleolar Enrichment of Brain Proteins with Critical Roles in
      Human Neurodevelopment.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "dysregulation of ribosomal biogenesis and/or other functions of the nucleolus may disrupt neurodevelopment resulting in such phenotypes as microcephaly and/or cognitive impairment"
    explanation: >-
      Establishes the class-level principle that ribosome-biogenesis failure
      produces microcephaly and cognitive impairment; RPL10 is named among the
      nucleolar proteins in this dataset.
- name: Impaired Brain Growth and Cerebellar Development
  description: >
    The cumulative effect on the developing central nervous system is reduced
    brain growth, presenting as congenital or progressive postnatal microcephaly,
    with cerebellar hypoplasia (often vermian) on neuroimaging in a subset of
    patients. This is the tissue-level lesion that produces the cognitive,
    motor and seizure phenotype.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: brain development
    modifier: DECREASED
    term:
      id: GO:0007420
      label: brain development
  downstream:
  - target: Microcephaly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27053602
      reference_title: Nucleolar Enrichment of Brain Proteins with Critical Roles in
        Human Neurodevelopment.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Microcephaly and/or cognitive impairment were the most common phenotypic manifestations."
      explanation: >-
        Supports the step from a ribosome-biogenesis brain lesion to microcephaly
        as the expected phenotypic output. The claim is made at the level of the
        nucleolar protein class (which includes RPL10) rather than of this
        disorder, hence INDIRECT.
  - target: Cerebellar hypoplasia
    causal_link_type: DIRECT
  - target: Intellectual disability
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25316788
      reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
        neurodevelopment and causes X-linked microcephaly in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Together, our findings suggest that a mutation within the conserved N-terminal end of RPL10, a protein in close proximity to the peptidyl transferase active site of the 60S ribosomal subunit, causes severe defects in brain formation and function."
      explanation: >-
        States that the RPL10 lesion impairs brain function as well as brain
        formation, which is the step from the tissue lesion to the cognitive
        phenotype.
  - target: Seizure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25316788
    reference_title: A novel ribosomopathy caused by dysfunction of RPL10 disrupts
      neurodevelopment and causes X-linked microcephaly in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the genetic and functional dissection of a multigenerational pedigree with an X-linked syndromic disorder hallmarked by microcephaly, growth retardation, and seizures"
    explanation: Names the core central nervous system phenotype of the disorder.
  - reference: PMID:26290468
    reference_title: A Novel Mutation in RPL10 (Ribosomal Protein L10) Causes X-Linked
      Intellectual Disability, Cerebellar Hypoplasia, and Spondylo-Epiphyseal Dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in a family with two affected cousins presenting with X-linked intellectual disability, cerebellar hypoplasia, and spondylo-epiphyseal dysplasia (SED)"
    explanation: Documents cerebellar hypoplasia as part of the central nervous system
      phenotype.
- name: Hypomorphic C-Terminal uL16 Variants Altering Translational Regulation
  description: >
    A distinct, milder branch of the RPL10 allelic series. The C-terminal
    substitutions p.L206M and p.H213Q, found in autism families, leave basic
    translation intact while impairing regulation of the translation process,
    a hypomorphic rather than null behaviour. This is the mechanistic basis for
    the autism-only end of the RPL10 spectrum and is presented here as a separate
    node because it does not proceed through the 60S maturation-failure chain
    above. The p.A64V allele is a further departure from a simple loss-of-function
    model, producing a functional protein that increases rather than decreases
    the actively translating ribosome population.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  downstream:
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:16940977
    reference_title: Mutations in the ribosomal protein gene RPL10 suggest a novel
      modulating disease mechanism for autism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have obtained evidence that the amino-acid substitutions L206M and H213Q at the C-terminal end of RPL10 confer hypomorphism with respect to the regulation of the translation process while keeping the basic translation functions intact."
    explanation: Establishes the hypomorphic, regulation-specific behaviour of the
      C-terminal alleles.
  - reference: PMID:26290468
    reference_title: A Novel Mutation in RPL10 (Ribosomal Protein L10) Causes X-Linked
      Intellectual Disability, Cerebellar Hypoplasia, and Spondylo-Epiphyseal Dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "unlike previously reported mutations, this novel RPL10 missense mutation results in an increase in the actively translating ribosome population"
    explanation: Records the p.A64V exception, which argues against a uniform loss-of-function
      model across the allelic series.
phenotypes:
- name: Intellectual disability
  category: Neurological
  description: >
    Present in essentially all reported affected males, ranging from mild to
    severe. In the Thevenon family all four affected males had apparent
    intellectual disability with psychomotor delay.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:25846674
    reference_title: RPL10 mutation segregating in a family with X-linked syndromic
      Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients presented apparent intellectual disability (4/4), psychomotor delay (4/4) with syndromic features including amniotic fluid excess (3/4), microcephaly (2/4), urogenital anomalies (3/4), cerebellar syndrome (2/4), and facial dysmorphism."
    explanation: Reports intellectual disability in every affected male of the family
      (4/4).
- name: Global developmental delay
  category: Neurological
  description: >
    Psychomotor development delay is a defining feature, with delayed independent
    walking commonly reported between 2 and 4 years.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with MRXS35 mainly present with intellectual disability (ID), psychomotor development delay, speech delay, short stature, craniofacial anomalies, hypotonia, seizures, gastrointestinal problems, genitourinary anomalies, cardiac anomalies, eye defects, and hearing loss."
    explanation: Lists psychomotor development delay among the core presenting features
      of MRXS35.
- name: Delayed speech and language development
  category: Neurological
  description: >
    Speech delay is near-universal and disproportionate to overall development;
    several reported individuals remained non-verbal into school age.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, the hallmark phenotypes of MRXS35 are intellectual disability, growth retardation, speech delay, microcephaly, craniofacial anomalies, seizures, hypotonia, and cryptorchidism."
    explanation: Names speech delay as a hallmark phenotype of the disorder.
- name: Absent speech
  category: Neurological
  description: >
    At the severe end of the spectrum speech may be entirely absent, as in the
    18-year-old male with the de novo p.K78E allele.
  frequency: OCCASIONAL
  phenotype_term:

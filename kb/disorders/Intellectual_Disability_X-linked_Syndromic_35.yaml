prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >
    No population-based prevalence or incidence estimate exists. The literature
    quantifies the disorder only as a cumulative case count. Cappuccio et al.
    reviewed publications from 2006 to 2022 and retrieved 15 individuals with
    pathogenic RPL10 variants; Xu et al. counted 19 previously reported male
    patients carrying seven missense variants over 2014-2024. The two counts use
    different inclusion boundaries around the autism-only alleles, which is why
    they differ. Reported patients come from Europe, North America and East Asia
    with no founder effect; the apparent geography reflects exome-sequencing
    access.
  evidence:
  - reference: PMID:35876338
    reference_title: Postnatal microcephaly and retinal involvement expand the phenotype
      of RPL10-related disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemizygous pathogenic variants in RPL10 have been described in only 15 patients with a wide spectrum of manifestations"
    explanation: Gives the cumulative published case count as of 2022.
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the past decade (2014∼2024), only seven missense RPL10 gene variants have been identified in the 19 previously reported male patients."
    explanation: Gives the updated cumulative case and allele count as of 2025.
diagnosis:
- name: Trio Exome or Genome Sequencing
  description: >
    There are no formal clinical diagnostic criteria and the phenotype is not
    specific enough to be separated clinically from other X-linked intellectual
    disability, so molecular diagnosis is definitive. Every reported case was
    ascertained by exome sequencing, in most instances after a normal
    array-CGH and negative targeted testing (including fragile X). The trio design
    matters both for detecting the occasional de novo variant and for confirming
    maternal carrier status, which drives recurrence counselling. Most RPL10
    missense alleles are initially returned as variants of uncertain
    significance, so functional follow-up may be required for reclassification.
  evidence:
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to their multiple congenital anomalies, whole-exome sequencing (WES) was recommended and conducted."
    explanation: Establishes exome sequencing as the diagnostic route in practice.
  - reference: PMID:40861044
    reference_title: 'Case Report: Identification of a novel hemizygous missense RPL10
      gene variant in two unrelated patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Sanger sequencing also confirmed that the same hemizygous variant was derived from their respective heterozygous carrier mothers, and their respective fathers were normal."
    explanation: Shows the role of parental testing in confirming maternal carrier status.
treatments:
- name: Multidisciplinary Supportive and Developmental Care
  description: >
    There is no disease-modifying therapy, no approved drug, no gene therapy and
    no interventional clinical trial for MRXS35. Management is entirely
    symptomatic and supportive: early developmental intervention plus coordinated
    surveillance of growth, seizures, vision (including retinal assessment),
    hearing, cardiac structure, genitourinary anatomy and airway. The recently
    reported neonatal presentations (laryngeal stridor, feeding difficulty,
    hypoglycemia) resolved with routine supportive management.

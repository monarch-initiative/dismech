  description: >
    Affected individuals are hemizygous males. In the pedigrees through which the
    disorder was defined the variant was maternally transmitted by an unaffected
    carrier, and skewed X inactivation was documented in carrier females,
    consistent with causality. Expressivity in males is markedly variable, from
    intellectual disability with dysmorphism to a severe multisystem phenotype
    with refractory epilepsy. De novo occurrence has been reported once.
  evidence:

    Transmission is usually from an unaffected heterozygous mother, so carrier
    testing of the mother and at-risk female relatives, with counselling on 50%
    transmission risk to sons, is central to management. Documented skewed X
    inactivation in carriers supports their unaffected status but does not
    guarantee it across the allelic series.

name: Arsenic Poisoning
creation_date: '2026-02-11T21:06:43Z'
category: Environmental
categories:
- Toxic Exposure Disorder
- Heavy Metal Poisoning
- Environmental Health Disorder
synonyms:
- arsenicosis
- arsenic intoxication
- inorganic arsenic poisoning
description: >-
  Arsenic poisoning is a toxic disorder caused by clinically significant
  exposure to inorganic arsenic. Acute high-dose ingestion can produce severe
  gastrointestinal illness, hemodynamic compromise, cardiac repolarization
  abnormalities, multisystem toxicity, and death; peripheral neuropathy can
  appear after a delay. Chronic exposure, most often through contaminated
  drinking water, is classically associated with hyperpigmentation and
  palmoplantar keratosis. Total urinary arsenic can be misleading after seafood
  consumption because arsenobetaine can raise the total, so arsenic speciation
  is central to exposure assessment. Long-latency
  arsenic-related malignancies are modeled separately in Arsenic Related
  Cancers; this entry does not infer cancer from short-term poisoning findings.
definitions:
- name: Clinical framing of acute inorganic arsenic poisoning
  definition_type: CASE_DEFINITION
  description: >-
    A compatible acute exposure followed by gastrointestinal and cardiovascular
    toxicity, with exposure supported by appropriately interpreted arsenic
    measurements, defines the acute clinical syndrome.
  scope: Acute high-dose inorganic arsenic exposure
  evidence:
  - reference: PMID:15533028
    reference_title: Survival after a lethal dose of arsenic trioxide.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical symptoms of an acute arsenicum (As) poisoning such as gastrointestinal cramps, vomiting, diarrhea, ECG changes and disturbed liver function tests were observed.
    explanation: >-
      This acute arsenic-trioxide case directly documents the characteristic
      gastrointestinal, cardiac, and hepatic presentation.
- name: Clinical framing of chronic inorganic arsenicosis
  definition_type: CASE_DEFINITION
  description: >-
    Chronic arsenicosis is a clinical toxicity syndrome in a person with
    sustained inorganic arsenic exposure, commonly identified by characteristic
    melanosis and keratotic skin lesions rather than by exposure alone.
  scope: Chronic environmental inorganic arsenic exposure
  evidence:
  - reference: PMID:11218669
    reference_title: Histopathology of skin lesions in chronic arsenic toxicity--grading of changes and study of proliferative markers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic arsenic toxicity (CAT) manifests predominantly as cutaneous lesions in the form of melanosis, keratosis and neoplastic changes.
    explanation: >-
      The human biopsy series directly identifies melanosis and keratosis as
      predominant manifestations of chronic arsenic toxicity.
parents:
- heavy metal poisoning
has_subtypes:
- name: Acute
  display_name: Acute inorganic arsenic poisoning
  description: >-
    Toxicity following a large, usually ingested, dose of inorganic arsenic,
    with early gastrointestinal and hemodynamic manifestations and possible
    delayed neuropathy.
  evidence:
  - reference: PMID:3578979
    reference_title: Acute arsenic ingestion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 21-year-old man presented in shock after ingesting 2 g of arsenic trioxide.
    explanation: Directly supports the acute high-dose ingestion subtype.
- name: Chronic
  display_name: Chronic inorganic arsenicosis
  description: >-
    Clinical toxicity arising during sustained inorganic arsenic exposure,
    particularly through drinking water, with characteristic cutaneous lesions.
  evidence:
  - reference: PMID:21576319
    reference_title: A prospective study of arsenic exposure from drinking water and incidence of skin lesions in Bangladesh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chronic arsenic exposure from drinking water was associated with increased incidence of skin lesions, even at low levels of arsenic exposure (<100 μg/L).
    explanation: >-
      The prospective cohort supports chronic drinking-water exposure as a cause
      of incident arsenical skin lesions.
progression:
- phase: Early acute gastrointestinal and hemodynamic toxicity
  subtype: Acute
  notes: >-
    Gastrointestinal symptoms and hemodynamic compromise can occur early after a
    large ingestion and require immediate stabilization and monitoring.
  evidence:
  - reference: PMID:12793928
    reference_title: 'Treatment and toxicokinetics of acute pediatric arsenic ingestion: danger of arsenic insecticides in children.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, the patient developed signs of acute hemodynamic compromise with tachycardia, hypertension, gastrointestinal symptoms, and poor urine output.
    explanation: The case directly establishes the early acute phase.
- phase: Delayed peripheral neuropathy after a single acute exposure
  subtype: Acute
  duration: Neurologic abnormalities can persist for years
  notes: >-
    Peripheral neuropathy can begin 10 days to 3 weeks after ingestion and may
    improve only slowly and incompletely.
  evidence:
  - reference: PMID:196051
    reference_title: Peripheral neuropathy following a single exposure to arsenic. Clincal course in four patients with electrophysiological and histological studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four patients are described who developed a peripheral neuropathy 10 days to 3 weeks after ingestion of a single dose of arsenic. All improved slowly, but after 6 to 8 years 3 of them still had abnormal neurological symptoms and signs.
    explanation: >-
      The longitudinal case series directly supplies the onset window and
      persistent course of delayed neuropathy.
- phase: Chronic cutaneous disease during sustained exposure and after mitigation
  subtype: Chronic
  duration: Years
  notes: >-
    Skin lesions arise during sustained drinking-water exposure. Providing
    arsenic-safe water can improve lesion scores over several years, although
    severe lesions and systemic disease may persist.
  evidence:
  - reference: PMID:25161968
    reference_title: 'Effect of Safe Water on Arsenicosis: A Follow-up Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In participants belonging to Cohort-I, the skin score was found to improve significantly at the end of each year, and it was found to be reduced significantly from 2.17 ± 1.09 to 1.23 ± 1.17; P < 0.001 at the end of 3 year's intervention study indicating beneficial effect of safe water on skin lesions.
    explanation: >-
      The three-year intervention follow-up supports improvement after exposure
      mitigation without implying that all established disease reverses.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Severe acute poisoning can be fatal despite intensive care, and delayed
    neurologic or chronic cutaneous injury can remain clinically important for
    years.
  evidence:
  - reference: PMID:3578979
    reference_title: Acute arsenic ingestion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He died within 37 hours despite intensive treatment that included intramuscular dimercaprol and hemodialysis.
    explanation: Documents the mortality risk of severe acute ingestion.
  - reference: PMID:196051
    reference_title: Peripheral neuropathy following a single exposure to arsenic. Clincal course in four patients with electrophysiological and histological studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All improved slowly, but after 6 to 8 years 3 of them still had abnormal neurological symptoms and signs.
    explanation: Documents long-term neurologic burden among survivors.
pathophysiology:
- name: Systemic inorganic arsenic exposure
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Absorbed inorganic arsenic is the initiating toxic exposure. Dose, chemical
    species, route, and duration distinguish severe acute poisoning from chronic
    arsenicosis; exposure itself is not equivalent to clinical disease.
  chemical_entities:
  - preferred_term: arsenic atom
    term:
      id: CHEBI:27563
      label: arsenic atom
  triggers:
  - preferred_term: exposure to arsenic
    term:

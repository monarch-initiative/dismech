discussions:
- discussion_id: gap_arsenic_acute_chelation_outcomes
  prompt: >-
    Which dithiol chelator, timing, and regimen improve patient-centered outcomes
    in severe acute inorganic arsenic poisoning beyond modern supportive care?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Early dithiol chelation for severe acute poisoning
  rationale: >-
    Acute treatment reports combine chelation with resuscitation,
    gastrointestinal decontamination, and other interventions, preventing a
    clean estimate of comparative efficacy. Chronic arsenicosis should not be
    used as a proxy indication: a randomized placebo-controlled DMSA trial did
    not show clinical, biochemical, or histopathologic benefit.
  evidence:
  - reference: PMID:9865236
    reference_title: Randomized placebo-controlled trial of 2,3-dimercaptosuccinic acid in therapy of chronic arsenicosis due to drinking arsenic-contaminated subsoil water.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Under the conditions of this study, 2,3-dimercaptosuccinic acid was not effective in producing any clinical or biochemical benefit or any histopathological improvement of skin lesions in patients with chronic arsenicosis.
    explanation: >-
      The randomized trial directly establishes that chronic DMSA treatment did
      not provide the asserted benefits under the studied regimen.
  - reference: PMID:15533028
    reference_title: Survival after a lethal dose of arsenic trioxide.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient survived this massive dose of ingested inorganic As with only polyneuropathy one year later.
    explanation: >-
      Survival after multiple simultaneous interventions motivates study but
      does not isolate chelator efficacy.
- discussion_id: gap_arsenic_molecular_human_translation
  prompt: >-
    To what extent do PDH inhibition and ROS/RNS-mediated PARP-1 impairment drive
    the acute and chronic organ syndromes in exposed humans at clinically
    relevant internal doses?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#MMA(III)-sensitive pyruvate dehydrogenase inhibition
  - pathophysiology#Arsenite-generated oxidative and nitrosative stress
  - pathophysiology#PARP-1 zinc loss and activity impairment
  rationale: >-
    The retained proximal mechanisms are supported by purified-enzyme, cell,
    and animal experiments, while the direct quantitative bridge to human organ
    injury remains unresolved. The graph therefore does not connect these
    molecular nodes directly to cancer, neuropathy, or cutaneous lesions.
  evidence:
  - reference: PMID:9806419
    reference_title: Arsenic toxicity is enzyme specific and its affects on ligation are not caused by the direct inhibition of DNA repair enzymes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that direct enzyme inhibition is not a common toxic effect of As and that only a few sensitive enzymes are responsible for arsenic-induced cellular toxicity.
    explanation: Directly supports limiting the breadth of the enzyme-inhibition model.
  - reference: PMID:23602911
    reference_title: Arsenite-induced ROS/RNS generation causes zinc loss and inhibits the activity of poly(ADP-ribose) polymerase-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most importantly, arsenite incubation with purified PARP-1 protein in vitro did not alter PARP-1 activity or DNA-binding ability, whereas hydrogen peroxide or NONOate retained PARP-1 inhibitory activity.
    explanation: >-
      Supports an indirect ROS/RNS-mediated cellular mechanism and the need to
      test its relevance in human tissues.

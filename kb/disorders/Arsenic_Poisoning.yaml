      label: exposure to arsenic
  downstream:
  - target: AS3MT-linked arsenic biotransformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - cellular uptake and enzymatic methylation of inorganic arsenic
    description: >-
      In exposed humans, variation near AS3MT strongly influences the urinary
      distribution of methylated arsenic species.
    evidence:
    - reference: PMID:22383894
      reference_title: Genome-wide association study identifies chromosome 10q24.32 variants associated with arsenic metabolism and toxicity phenotypes in Bangladesh.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using data on urinary arsenic metabolite concentrations and approximately 300,000 genome-wide single nucleotide polymorphisms (SNPs) for 1,313 arsenic-exposed Bangladeshi individuals, we identified genome-wide significant association signals (P<5×10(-8)) for percentages of both monomethylarsonic acid (MMA) and dimethylarsinic acid (DMA) near the AS3MT gene (arsenite methyltransferase; 10q24.32), with five genetic variants showing independent associations.
      explanation: >-
        The human GWAS links AS3MT-region variation to arsenic metabolite
        proportions under exposure.
  - target: Arsenite-generated oxidative and nitrosative stress
    causal_link_type: DIRECT
    description: Cellular arsenite exposure generates reactive oxygen and nitrogen species.
    evidence:
    - reference: PMID:23602911
      reference_title: Arsenite-induced ROS/RNS generation causes zinc loss and inhibits the activity of poly(ADP-ribose) polymerase-1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We report herein that arsenite-generated ROS/RNS inhibits PARP-1 activity in cells.
      explanation: Directly supports arsenite-triggered cellular ROS/RNS generation.
  - target: Acute gastrointestinal and hemodynamic toxicity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

- name: AS3MT-linked arsenic biotransformation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    AS3MT-region variation changes the distribution of urinary MMA and DMA in
    exposed humans. This establishes a human exposure-response modifier but does
    not make AS3MT a monogenic cause of arsenicosis.
  gene:
    preferred_term: AS3MT
    term:
      id: hgnc:17452
      label: AS3MT

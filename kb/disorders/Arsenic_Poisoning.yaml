      label: detoxification of arsenic-containing substance
  downstream:
  - target: MMA(III)-sensitive pyruvate dehydrogenase inhibition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - production of trivalent monomethylated arsenic species
    description: >-
      Methylation can generate MMA(III), which inhibited pyruvate dehydrogenase
      more potently than arsenite in the studied systems.
    evidence:
    - reference: PMID:11409934
      reference_title: 'Monomethylarsonous acid (MMA(III)) and arsenite: LD(50) in hamsters and in vitro inhibition of pyruvate dehydrogenase.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data demonstrate that MMA(III) is more toxic than inorganic arsenite, both in vivo and in vitro, and call into question the hypothesis that methylation of inorganic arsenic is a detoxication process.
      explanation: >-
        The comparative animal and enzyme data support toxicity of the
        methylated trivalent intermediate rather than uniform detoxification.
  evidence:
  - reference: PMID:22383894
    reference_title: Genome-wide association study identifies chromosome 10q24.32 variants associated with arsenic metabolism and toxicity phenotypes in Bangladesh.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a follow-up analysis of 1,085 individuals with arsenic-induced premalignant skin lesions (the classical sign of arsenic toxicity) and 1,794 controls, we show that one of these five variants (rs9527) is also associated with skin lesion risk (P = 0.0005).
    explanation: >-
      Human association data connect the AS3MT-region signal to both metabolite
      proportions and arsenical skin-lesion susceptibility.
- name: MMA(III)-sensitive pyruvate dehydrogenase inhibition
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Pyruvate dehydrogenase is among the purified enzymes sensitive to micromolar
    arsenic, and MMA(III) inhibited PDH in animal tissue and purified-enzyme
    assays. These data do not justify a universal sulfhydryl-enzyme blockade
    model for human poisoning.
  biological_processes:
  - preferred_term: pyruvate metabolic process
    modifier: DECREASED
    term:
      id: GO:0006090
      label: pyruvate metabolic process
  evidence:
  - reference: PMID:9806419
    reference_title: Arsenic toxicity is enzyme specific and its affects on ligation are not caused by the direct inhibition of DNA repair enzymes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Only pyruvate dehydrogenase, one of eight purified enzymes examined so far, is inhibited by micromolar arsenic.
    explanation: Supports selective PDH sensitivity while constraining broader enzyme-inhibition claims.
  - reference: PMID:11409934
    reference_title: 'Monomethylarsonous acid (MMA(III)) and arsenite: LD(50) in hamsters and in vitro inhibition of pyruvate dehydrogenase.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To inhibit activity of purified porcine heart PDH activity by 50%, the concentrations (mean +/- SE) of MMA(III) as methylarsine oxide and arsenite were 17.6 +/- 4.1 and 106.1 +/- 19.8 microM, respectively.
    explanation: Quantifies greater PDH inhibition by MMA(III) than arsenite in the purified-enzyme assay.
- name: Arsenite-generated oxidative and nitrosative stress
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In cultured cells, arsenite-generated reactive oxygen and nitrogen species

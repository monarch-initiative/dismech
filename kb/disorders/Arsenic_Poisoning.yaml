      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All the participants who had arsenic contaminated drinking water source in their houses were supplied with arsenic removal filters for getting arsenic-free water during the follow-up period.
      explanation: Directly documents exposure mitigation in the human follow-up study.

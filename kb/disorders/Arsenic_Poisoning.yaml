  - target: Cardiac repolarization disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Arsenic intoxication can markedly prolong repolarization and trigger torsade de pointes.
    evidence:
    - reference: PMID:1689832
      reference_title: Torsade de pointes and T-U wave alternans associated with arsenic poisoning.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reported in this study are two cases of arsenic poisoning causing torsade de pointes. Furthermore, marked prolongation of the QT-U interval and the rarely observed phenomenon of T-U wave alternans are demonstrated.
      explanation: The two cases directly support arsenic-associated repolarization toxicity.
  - target: Delayed peripheral axonopathy

  downstream:
  - target: PARP-1 zinc loss and activity impairment
    causal_link_type: DIRECT
    description: Arsenite-generated ROS/RNS decrease PARP-1 zinc content, DNA binding, and enzymatic activity.
    evidence:
    - reference: PMID:23602911
      reference_title: Arsenite-induced ROS/RNS generation causes zinc loss and inhibits the activity of poly(ADP-ribose) polymerase-1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cellular exposure to arsenite, as well as hydrogen peroxide and NONOate (nitric oxide donor), decreased PARP-1 zinc content, enzymatic activity, and PARP-1 DNA binding.
      explanation: Directly supports the ROS/RNS-to-PARP-1 impairment edge in cells.
  evidence:
  - reference: PMID:23602911
    reference_title: Arsenite-induced ROS/RNS generation causes zinc loss and inhibits the activity of poly(ADP-ribose) polymerase-1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, the effects of arsenite on PARP-1 activity, DNA binding, and zinc content were partially reversed by the antioxidant ascorbic acid, catalase, and the NOS inhibitor, aminoguanidine.
    explanation: >-
      Reversal by antioxidant and NOS-directed interventions supports a mediated

    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that isolated CAA and the CAA phenotype in the 18q deletion syndrome are both caused by haploinsufficiency that results from a heterozygous deletion or loss-of-function mutation of TSHZ1, whose ortholog is essential for murine middle-ear development."
    explanation: Establishes TSHZ1 as the causal gene.
  - reference: PMID:39624921
    reference_title: "Genetics of Nonsyndromic Microtia and Congenital Aural Atresia: A Scoping Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A single article describing nonsyndromic CAA alone identified the TSHZ1 as a candidate gene."
    explanation: >-
      A 2025 scoping review finds TSHZ1 is still the only gene reported for
      nonsyndromic CAA without microtia, resting on a single study.

treatments:
- name: Bone-Anchored Hearing Aid
  description: >-
    A bone-conduction hearing aid on a softband in early childhood, followed by
    a percutaneous osseointegrated device, bypasses the atretic canal. A
    systematic review found better hearing outcomes with osseointegrated
    bone-conduction devices than with atresia surgery. The Surgical Procedure
    binding refers to the percutaneous implant; the softband stage is
    non-surgical.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: bone-anchored hearing aid implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: bone-anchored hearing aid
        term:
          id: NCIT:C185117
          label: Bone-anchored Hearing Aid
  target_mechanisms:
  - target: Conductive Hearing Impairment
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A BAHA Softband and subsequent percutaneous titanium BAHAs were applied successfully."
    explanation: Successful bone-anchored hearing rehabilitation in a TSHZ1 mutation carrier.
  - reference: PMID:24005171
    reference_title: "Hearing outcomes of atresia surgery versus osseointegrated bone conduction device in patients with congenital aural atresia: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The OBCD has better hearing outcomes compared with atresiaplasty in patients with CAA."
    explanation: >-
      Systematic review across congenital aural atresia of all causes, not
      TSHZ1 specifically.
- name: Atresiaplasty
  description: >-
    Surgical creation of an external auditory canal. Hearing gains tend to
    decline with time and canal restenosis is the main complication; one
    TSHZ1 carrier operated at age 3 had slowly declining hearing and later
    received a BAHA.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: atresiaplasty
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Atresia of the External Auditory Canal
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her hearing declined slowly over the following decades, and she recently received a BAHA on the left side at 42 years of age."
    explanation: Long-term course after childhood atresia surgery in a TSHZ1 carrier.
  - reference: PMID:25912684
    reference_title: A meta-analysis of the long-term hearing outcomes and complications associated with atresiaplasty.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on available data, which shows a lack of major complications, such as facial nerve palsy, atresiaplasty is a safe procedure. Our meta-analysis indicated that there was a degradation of hearing outcomes with prolonged follow-up."
    explanation: >-
      Safety and durability of atresiaplasty across congenital aural atresia
      generally.

diagnosis:
- name: TSHZ1 sequencing
  description: >-
    Sequencing the coding exons of TSHZ1 detects the truncating point
    mutations in isolated bilateral CAA type IIA.
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted Sanger sequencing of TSHZ1 in families 3 and 4 revealed mutations in both families"
    explanation: Sanger sequencing identified the point mutations.
- name: Chromosomal microarray
  description: >-
    Copy-number analysis detects 18q22.3 microdeletions spanning TSHZ1, which
    present with CAA alongside other features of distal 18q deletion.
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied four individuals (from two families) with CAA and other features suggestive of an 18q deletion, and we detected overlapping microdeletions in 18q22.3 in both families."
    explanation: Microarray analysis found the 18q22.3 deletions.

animal_models:
- name: Tshz1 null mouse
  species: Mouse
  genotype: Tshz1-/-
  publication: PMID:17586487
  modeled_mechanisms:
  - target: Abnormal Middle Ear Skeletal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Homozygous loss gives malleus and tympanic ring malformations alongside
      neonatal lethality, vertebral homeotic transformations and soft palate
      defects.
    limitations: >-
      The human disease is heterozygous and confined to the ear canal; the
      null mouse is lethal and multisystemic, and the external canal itself
      was not described.
    evidence:
    - reference: PMID:17586487
      reference_title: Tshz1 is required for axial skeleton, soft palate and middle ear development in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the craniofacial region, loss of Tshz1 function leads to specific malformations of middle ear components, including the malleus and the tympanic ring."
      explanation: The null mouse shows the middle-ear skeletal defect this node models.
- name: Tshz1 conditional olfactory mouse
  species: Mouse
  genotype: Tshz1 conditional deletion
  publication: PMID:24487590
  modeled_mechanisms:
  - target: Olfactory Bulb Hypoplasia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Conditional deletion produces olfactory bulb hypoplasia and severe smell deficits.
    limitations: >-
      Homozygous conditional loss is more severe than human heterozygosity,
      where hyposmia rather than anosmia is reported, and olfactory bulb size
      has not been reported in patients.
    evidence:
    - reference: PMID:24487590
      reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conditional deletion of Tshz1 in mice resulted in OB hypoplasia and severe olfactory deficits."
      explanation: The model's bulb and smell phenotype.

notes: >-
  No GeneReviews chapter exists for this disease (just check-genereviews
  reports NO_CHAPTER against the Bookshelf index). A 2025 scoping review of
  nonsyndromic microtia and CAA genetics found TSHZ1 to be the only candidate
  gene reported for nonsyndromic CAA alone. The overlap with distal 18q
  deletion syndrome is curated separately in Chromosome_18q_Deletion_Syndrome.

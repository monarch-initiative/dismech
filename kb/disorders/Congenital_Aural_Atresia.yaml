name: Congenital Aural Atresia
creation_date: "2026-10-01T00:00:00Z"
category: Mendelian
description: >-
  TSHZ1-related congenital aural atresia is an autosomal dominant, incompletely
  penetrant malformation of the external auditory canal, caused by
  haploinsufficiency of the teashirt zinc finger homeobox transcription factor
  TSHZ1. Affected individuals have bilateral narrowing or bony atresia of the
  medial external auditory canal (CAA type IIA) with normally shaped pinnae and
  conductive hearing loss, and heterozygous carriers tested for smell have
  hyposmia. TSHZ1 lies in 18q22.3, the critical region for the aural atresia
  that is common in distal 18q deletion syndrome; the same gene therefore
  explains the ear phenotype both as an isolated Mendelian trait and as one
  component of a contiguous deletion.

  This entry covers the monogenic disease bound to MONDO:0011921 (OMIM
  607842), defined by TSHZ1. Congenital aural atresia as a
  clinical finding is far more common and genetically heterogeneous; it occurs
  with microtia, in craniofacial syndromes, and in aneuploidies, and most
  isolated cases have no identified cause. Those are not modelled here.

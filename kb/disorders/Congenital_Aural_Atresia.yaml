inheritance:
- name: Autosomal dominant with reduced penetrance
  description: >-
    Heterozygous TSHZ1 loss-of-function alleles segregate dominantly, but an
    unaffected carrier mother transmitted the nonsense allele p.Trp241X to an
    affected son, so penetrance is incomplete. In 18q deletion carriers, aural
    atresia is reported in 26% of any 18q deletion and up to 78% of deletions
    covering the critical region including TSHZ1; those figures describe
    deletion carriers, not point-mutation penetrance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As expected, this mutation showed an autosomal-dominant segregation pattern."
    explanation: >-
      The frameshift allele passes from an affected mother to her affected
      monozygotic twin daughters, which is a single transmission.
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is worth noting that a sequence analysis of the phenotypically normal maternal parents did not reveal the presence of this frameshift mutation, indicating that the mutation occurred de novo in the index person of this family."
    explanation: The frameshift arose de novo in the affected mother, consistent with a dominant allele.
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fact that the nonsense mutation in TSHZ1 in individual 5 was inherited from his phenotypically normal mother can be explained by reduced penetrance."
    explanation: An unaffected obligate carrier documents incomplete penetrance.
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This observation is in accordance with previous reports that describe a CAA incidence of 26% in individuals with an 18q deletion of any kind and an incidence of up to 78% in individuals with a deletion of the critical CAA region that includes TSHZ1."
    explanation: Incomplete penetrance of CAA among deletion carriers that include TSHZ1.

prevalence:
- population: Published TSHZ1 point-mutation families
  measure_type: CASES_IN_LITERATURE
  notes: >-
    Four affected individuals and one unaffected carrier in two families with
    TSHZ1 point mutations, found by sequencing 11 people with isolated bilateral
    CAA type IIA; two further families carried 18q22.3 microdeletions spanning
    TSHZ1. Congenital aural atresia of any cause occurs in roughly 1 in 10,000
    live births, but that figure is not a prevalence for this gene-defined
    disease.
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, four individuals and one unaffected relative showed heterozygous loss-of-function mutations, including a sporadic affected person (individual 5), his unaffected mother, and a family with three affected individuals consisting of a mother and her two daughters (individuals 6–8) (Table 1)."
    explanation: Counts every published point-mutation carrier.

pathophysiology:
- name: TSHZ1 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    One functional copy of TSHZ1 is lost, either through a truncating point
    mutation (p.Trp241X, p.Pro316ThrfsX16) or through an 18q22.3 microdeletion
    whose minimal overlap contains TSHZ1 as its only known gene. TSHZ1 encodes
    a teashirt-family zinc finger homeodomain transcription factor that, in the
    mouse, is expressed in the branchial arches from E9.5.
  genes:
  - preferred_term: TSHZ1
    term:
      id: hgnc:10669
      label: TSHZ1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minimal region of deletion overlap (72.9-73.4 Mb) contained only one known gene, TSHZ1, which was recently shown to be important for murine middle-ear development."
    explanation: Deletion mapping isolates TSHZ1 as the only gene in the critical interval.
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the coding exons in TSHZ1 in a cohort of 11 individuals with isolated, nonsyndromic bilateral CAA revealed two mutations, c.723G>A (p.Trp241X) and c.946_947delinsA (p.Pro316ThrfsX16), and both mutations predicted a loss of function."
    explanation: Two independent truncating alleles in isolated CAA.
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, these results demonstrate that hemizygosity of TSHZ1 leads to congenital aural atresia as a result of haploinsufficiency."
    explanation: States haploinsufficiency as the disease mechanism.
  downstream:
  - target: Abnormal Middle Ear Skeletal Development
    causal_link_type: DIRECT
    description: >-
      Loss of Tshz1 malforms the first-arch-derived middle-ear elements in the
      mouse. The mouse evidence is from the homozygous null, not the
      heterozygous state that causes the human disease.
    evidence:
    - reference: PMID:17586487
      reference_title: Tshz1 is required for axial skeleton, soft palate and middle ear development in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In the craniofacial region, loss of Tshz1 function leads to specific malformations of middle ear components, including the malleus and the tympanic ring."
      explanation: >-
        Shows Tshz1 loss malforms the tympanic ring and malleus; indirect
        because the model is a homozygous knockout.
  - target: Failed External Acoustic Meatus Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In humans, TSHZ1 haploinsufficiency is established as the cause of the
      canal atresia; the developmental steps between them are known only from
      mouse work.
    evidence:
    - reference: PMID:22152683
      reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Together, these results demonstrate that hemizygosity of TSHZ1 leads to congenital aural atresia as a result of haploinsufficiency."
      explanation: Human genetic evidence that loss of one TSHZ1 copy produces the canal atresia.
  - target: Dysregulated PROKR2 Expression
    causal_link_type: DIRECT
    description: >-
      TSHZ1 binds and regulates the PROKR2 gene. This was shown in Tshz1-mutant
      mice; regulation in heterozygous human carriers has not been measured.
    evidence:
    - reference: PMID:24487590
      reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Microarray analysis, in situ hybridization, and ChIP revealed that TSHZ1 bound to and regulated expression of the gene encoding prokineticin receptor 2 (PROKR2), a G protein–coupled receptor essential for OB development."
      explanation: ChIP and expression analysis place PROKR2 directly under TSHZ1 control.

- name: Abnormal Middle Ear Skeletal Development
  biological_scale: TISSUE
  description: >-
    Tshz1 is expressed in the branchial arches from E9.5, and Tshz1-null mice
    have specific malformations of the malleus and the tympanic ring, both
    first-arch derivatives. Whether the same structures are malformed in
    heterozygous humans has not been shown; patient CT describes the canal
    rather than the ossicles or ring.
  biological_processes:
  - preferred_term: middle ear morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042474
      label: middle ear morphogenesis
  locations:
  - preferred_term: tympanic ring
    term:
      id: UBERON:0002218
      label: tympanic ring
  - preferred_term: malleus
    term:
      id: UBERON:0001689
      label: malleus bone
  evidence:
  - reference: PMID:17586487
    reference_title: Tshz1 is required for axial skeleton, soft palate and middle ear development in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tshz1 is detected from E9.5 in the somites, the spinal cord, the limb buds and the branchial arches."
    explanation: Places Tshz1 in the branchial arches that build the middle ear.
  - reference: PMID:17586487
    reference_title: Tshz1 is required for axial skeleton, soft palate and middle ear development in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the craniofacial region, loss of Tshz1 function leads to specific malformations of middle ear components, including the malleus and the tympanic ring."
    explanation: The middle-ear skeletal defect in the knockout.
  downstream:
  - target: Failed External Acoustic Meatus Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tympanic ring primordium is proposed to induce formation of the
      external acoustic meatus, so a ring defect is a candidate route to canal
      atresia. This link is inferred from other mouse models, not tested for
      Tshz1.
    evidence:
    - reference: PMID:8565828
      reference_title: "Development of the mammalian ear: coordinate regulation of formation of the tympanic ring and the external acoustic meatus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We demonstrate here an absolute correlation between formation of the external acoustic meatus and formation of the tympanic ring, a first arch-derived membrane bone that anchors the tympanic membrane."
      explanation: >-
        Ties meatus formation to the tympanic ring in mouse; indirect because
        Tshz1 was not studied.
    - reference: PMID:8565828
      reference_title: "Development of the mammalian ear: coordinate regulation of formation of the tympanic ring and the external acoustic meatus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We suggest that the tympanic ring primordium induces formation and morphogenesis of the external acoustic meatus"
      explanation: Proposes the inductive mechanism this edge represents.

- name: Failed External Acoustic Meatus Morphogenesis
  biological_scale: TISSUE
  description: >-
    The medial, bony part of the external auditory canal fails to form or is
    stenotic, ending blindly or in a fistula to a rudimentary tympanic membrane
    (CAA type IIA). The pinna is normally shaped and the mutation carriers have
    no other congenital malformations, so the lesion is confined to the canal
    and middle-ear cleft.
  biological_processes:
  - preferred_term: outer ear morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042473
      label: outer ear morphogenesis
  locations:
  - preferred_term: external acoustic meatus
    term:
      id: UBERON:0001352
      label: external acoustic meatus
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we have detected both point mutations and copy-number variants leading to haploinsufficiency due to hemizygosity of TSHZ1 as causes of bilateral CAA type II (in the absence of microtia or anotia) both in isolated nonsyndromic individuals and in persons with the 18q deletion syndrome."
    explanation: Defines the canal-restricted lesion and the absence of microtia.
  downstream:
  - target: Atresia of the External Auditory Canal
    causal_link_type: DIRECT
    description: The failed canal is the clinical atresia.
    evidence:
    - reference: PMID:22152683
      reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In conclusion, we have detected both point mutations and copy-number variants leading to haploinsufficiency due to hemizygosity of TSHZ1 as causes of bilateral CAA type II (in the absence of microtia or anotia) both in isolated nonsyndromic individuals and in persons with the 18q deletion syndrome."
      explanation: The canal defect presents as bilateral CAA type II without microtia.
  - target: Cholesteatoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital canal abnormalities predispose to cholesteatoma, mainly where
      the canal is stenotic rather than completely atretic. This is a risk
      across congenital aural atresia and stenosis of any cause, not a finding
      reported in TSHZ1 carriers.
    evidence:
    - reference: PMID:35439089
      reference_title: "Cholesteatoma in Congenital Aural Atresia and External Auditory Canal Stenosis: A Systematic Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The incidence of cholesteatoma was 1.7% (4/238) in CAA and 43.0% (203/473) in congenital EAC stenosis."
      explanation: >-
        Pooled across congenital canal malformations of any cause; indirect
        for the TSHZ1 disease.
  - target: Conductive Hearing Impairment
    causal_link_type: DIRECT
    description: Sound cannot reach the tympanic membrane through the atretic canal.
    evidence:
    - reference: PMID:22152683
      reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pure-tone audiometry at the age of five demonstrated a 42 dB bilateral conductive hearing loss due to CAA type IIA (Figure 3B)."
      explanation: The conductive loss in a mutation carrier is attributed to the canal atresia.

- name: Dysregulated PROKR2 Expression
  biological_scale: MOLECULAR
  description: >-
    TSHZ1 binds the PROKR2 gene and regulates its expression in the developing
    olfactory bulb. PROKR2 is the receptor whose loss causes Kallmann syndrome,
    which makes it a proposed molecular link between the ear disease and the
    smell deficit.
  genes:
  - preferred_term: PROKR2
    term:
      id: hgnc:15836
      label: PROKR2
  evidence:
  - reference: PMID:24487590
    reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microarray analysis, in situ hybridization, and ChIP revealed that TSHZ1 bound to and regulated expression of the gene encoding prokineticin receptor 2 (PROKR2), a G protein–coupled receptor essential for OB development."
    explanation: Identifies PROKR2 as a direct TSHZ1 target.
  - reference: PMID:24487590
    reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in PROKR2 lead to Kallmann syndrome, characterized by anosmia and hypogonadotrophic hypogonadism."
    explanation: Ties PROKR2 loss to human anosmia.
  downstream:
  - target: Failed Olfactory Bulb Interneuron Maturation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PROKR2 is required for olfactory bulb development; that its reduction is
      what blocks interneuron maturation in Tshz1 mutants is inferred rather
      than shown by rescue.
    evidence:
    - reference: PMID:24487590
      reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Our data indicate that TSHZ1 is a key regulator of mammalian OB development and function and controls the expression of molecules involved in human Kallmann syndrome."
      explanation: The authors connect TSHZ1 control of PROKR2 to olfactory bulb development.

- name: Failed Olfactory Bulb Interneuron Maturation
  biological_scale: CELLULAR
  description: >-
    In mice lacking Tshz1, neuroblasts migrate tangentially to the olfactory
    bulb normally but then distribute aberrantly in the radial dimension, and
    many immature neuroblasts fail to leave the rostral migratory stream.
  cell_types:
  - preferred_term: olfactory bulb interneuron
    term:
      id: CL:1001434
      label: olfactory bulb interneuron
  biological_processes:
  - preferred_term: olfactory bulb interneuron differentiation
    modifier: ABNORMAL
    term:
      id: GO:0021889
      label: olfactory bulb interneuron differentiation
  evidence:
  - reference: PMID:24487590
    reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice lacking TSHZ1, neuroblasts exhibited a normal tangential migration to the OB; however, upon arrival to the OB, the neuroblasts were distributed aberrantly within the radial dimension, and many immature neuroblasts failed to exit the rostral migratory stream."
    explanation: Describes the interneuron maturation defect.
  downstream:
  - target: Olfactory Bulb Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The interneuron defect and bulb hypoplasia occur together in Tshz1
      mutant mice; that the first causes the second is inferred.
    evidence:
    - reference: PMID:24487590
      reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Using a mouse model, we found that development and maturation of OB interneurons depends on the zinc finger homeodomain factor teashirt zinc finger family member 1 (TSHZ1)."
      explanation: Ties bulb development to TSHZ1-dependent interneuron maturation.

- name: Olfactory Bulb Hypoplasia
  biological_scale: TISSUE
  description: >-
    Conditional deletion of Tshz1 gives a hypoplastic olfactory bulb with
    severe olfactory deficits in the mouse. Bulb size has not been reported in
    the heterozygous patients, whose deficit was measured by smell testing.
  biological_processes:
  - preferred_term: olfactory bulb development
    modifier: ABNORMAL
    term:
      id: GO:0021772
      label: olfactory bulb development
  locations:
  - preferred_term: olfactory bulb
    term:
      id: UBERON:0002264
      label: olfactory bulb
  evidence:
  - reference: PMID:24487590
    reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conditional deletion of Tshz1 in mice resulted in OB hypoplasia and severe olfactory deficits."
    explanation: Establishes bulb hypoplasia in the mouse model.
  downstream:
  - target: Hyposmia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24487590
      reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Conditional deletion of Tshz1 in mice resulted in OB hypoplasia and severe olfactory deficits."
      explanation: >-
        Bulb hypoplasia with smell loss in mice; indirect for the human
        heterozygous hyposmia.

phenotypes:
- name: Atresia of the External Auditory Canal
  category: Otologic
  description: >-
    Bilateral CAA type IIA: bony atresia of the medial canal or a partially
    aplastic canal ending blindly, with normally shaped pinnae.
  phenotype_term:
    preferred_term: Atresia of the external auditory canal
    term:
      id: HP:0000413
      label: Atresia of the external auditory canal
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected mother of this family (individual 6) had isolated bilateral conductive hearing loss due to CAA type IIA, for which she had bilateral surgical treatment at the age of 3."
    explanation: Bilateral CAA type IIA in a frameshift-mutation carrier.
- name: Conductive Hearing Impairment
  category: Otologic
  description: Bilateral conductive hearing loss secondary to the canal atresia.
  phenotype_term:
    preferred_term: Conductive hearing impairment
    term:
      id: HP:0000405
      label: Conductive hearing impairment
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pure-tone audiometry at the age of five demonstrated a 42 dB bilateral conductive hearing loss due to CAA type IIA (Figure 3B)."
    explanation: Measured conductive loss in the nonsense-mutation carrier.
  sequelae:
  - target: Delayed Speech and Language Development
- name: Cholesteatoma
  category: Otologic
  description: >-
    A risk rather than a reported finding. Cholesteatoma is uncommon in
    complete congenital aural atresia but common in congenital canal stenosis.
    CAA type IIA includes partially aplastic canals as well as complete medial
    atresia, so the risk depends on the individual canal; surveillance imaging
    before age 12 is recommended for stenotic canals.
  phenotype_term:
    preferred_term: Cholesteatoma
    term:
      id: HP:0009797
      label: Cholesteatoma
  evidence:
  - reference: PMID:35439089
    reference_title: "Cholesteatoma in Congenital Aural Atresia and External Auditory Canal Stenosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "EAC stenosis is strongly associated with cholesteatoma, and a surveillance scan for these patients is recommended prior to 12 years of age with close follow-up into adulthood."
    explanation: >-
      Systematic review of congenital canal malformations of any cause; not
      specific to TSHZ1.
- name: Delayed Speech and Language Development
  category: Neurodevelopmental
  description: >-
    Speech and language delay was noticed at 3 to 4 years in the sporadic
    nonsense-mutation carrier, whose bilateral conductive hearing loss was
    documented at age 5; motor development was normal.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:22152683
    reference_title: Disruption of teashirt zinc finger homeobox 1 is associated with congenital aural atresia in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had normal motor development, but impaired speech and delayed language development were noticed between the ages of 3 and 4 years."
    explanation: Speech delay with otherwise normal development in a carrier with conductive loss.
- name: Hyposmia
  category: Neurological
  description: >-
    Reduced olfactory sensitivity and impaired odor discrimination in
    heterozygous TSHZ1 loss-of-function carriers from CAA families.
  phenotype_term:
    preferred_term: Hyposmia
    term:
      id: HP:0004409
      label: Hyposmia
  evidence:
  - reference: PMID:24487590
    reference_title: TSHZ1-dependent gene regulation is essential for olfactory bulb development and olfaction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals displayed hyposmia, which is characterized by impaired odor discrimination and reduced olfactory sensitivity."
    explanation: Smell testing in heterozygous carriers from the CAA families.


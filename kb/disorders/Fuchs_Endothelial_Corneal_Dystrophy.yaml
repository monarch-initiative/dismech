datasets:
- accession: geo:GSE112201
  title: RNA Misplicing in Fuchs Endothelial Corneal Dystrophy II
  description: RNA-Seq splicing data from the corneal endothelia of FECD patients and controls reveal hundreds of differential alternative splicing events. These include events previously characterized in the context of myotonic dystrophy type 1 and epithelial-to-mesenchymal transition, as well as splicing changes in genes related to proposed mechanisms of FECD pathogenesis.

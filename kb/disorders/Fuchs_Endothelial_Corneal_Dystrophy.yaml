pathophysiology:
- name: TCF4 CTG Repeat Expansion Susceptibility
  description: >-
    An intronic CTG repeat expansion in TCF4 is the strongest common genetic
    association with late-onset FECD and is found in many affected patients.
  genes:
  - preferred_term: TCF4
    term:
      id: hgnc:11634
      label: TCF4
  locations:
  - preferred_term: corneal endothelium
    term:
      id: UBERON:0001985
      label: corneal endothelium
  downstream:
  - target: Toxic CUG RNA Foci
    description: Expanded TCF4 transcripts produce toxic CUG-repeat RNA foci in corneal endothelial cells.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25593321
    reference_title: "RNA toxicity and missplicing in the common eye disease Fuchs endothelial corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the several genes and loci associated with FECD, the strongest
      association is with an intronic (CTG·CAG)n trinucleotide repeat expansion
      in the TCF4 gene, which is found in the majority of affected patients.
    explanation: This human corneal-endothelium study identifies the TCF4 repeat expansion as the strongest common genetic association in FECD.
- name: COL8A2 Missense Collagen VIII Dysfunction
  description: >-
    Heterozygous COL8A2 missense variants in the triple helical domain of the
    alpha2 chain of type VIII collagen, a short-chain collagen of endothelial
    basement membranes including Descemet membrane, cause early-onset FECD. In
    knock-in mice the mutant chain drives an unfolded protein response in
    corneal endothelial cells.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COL8A2
    term:
      id: hgnc:2216
      label: COL8A2
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: DECREASED
  cell_types:
  - preferred_term: corneal endothelial cell
    term:
      id: CL:0000132
      label: corneal endothelial cell
  locations:
  - preferred_term: corneal endothelium
    term:
      id: UBERON:0001985
      label: corneal endothelium
  downstream:
  - target: ER Stress and Unfolded Protein Response Activation
    description: >-
      Mutant collagen VIII alpha2 is retained in the endoplasmic reticulum and
      activates the unfolded protein response in corneal endothelial cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23422828
      reference_title: "L450W and Q455K Col8a2 knock-in mouse models of Fuchs endothelial corneal dystrophy show distinct phenotypes and evidence for altered autophagy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Both models exhibited upregulation of the unfolded protein response (UPR) as evidenced by dilated rough endoplasmic reticulum (RER), and upregulation of UPR-associated genes and proteins."
      explanation: >-
        Col8a2 L450W and Q455K knock-in mice show UPR activation in corneal
        endothelium. Mouse evidence for the human edge.
  evidence:
  - reference: PMID:11689488
    reference_title: "Missense mutations in COL8A2, the gene encoding the alpha2 chain of type VIII collagen, cause two forms of corneal endothelial dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "This encodes the 703 amino acid alpha2 chain of type VIII collagen, a short-chain collagen which is a component of endothelial basement membranes and which represented a strong candidate gene."
    explanation: >-
      States the COL8A2 product and its basement-membrane location.
  - reference: PMID:11689488
    reference_title: "Missense mutations in COL8A2, the gene encoding the alpha2 chain of type VIII collagen, cause two forms of corneal endothelial dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of its coding sequence defined a missense mutation (gln455lys) within the triple helical domain of the protein in this family."
    explanation: >-
      The causal COL8A2 variant lies in the triple helical domain.
  - reference: PMID:23422828
    reference_title: "L450W and Q455K Col8a2 knock-in mouse models of Fuchs endothelial corneal dystrophy show distinct phenotypes and evidence for altered autophagy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both Col8a2 mouse models exhibited hallmarks of FECD; however, the Col8a2(L450W/L450W) mice exhibited a milder phenotype compared to the Col8a2(Q455K/Q455K) mice."
    explanation: >-
      Knock-in of the human FECD COL8A2 variants reproduces FECD features in
      mice.
- name: SLC4A11 Transporter Deficiency
  description: >-
    Heterozygous SLC4A11 missense variants in late-onset FECD produce
    transporter protein that fails to reach the cell surface. SLC4A11 is an
    NH3-sensitive transporter with proton-channel properties that supports
    glutamine catabolism in corneal endothelium and limits mitochondrial
    reactive oxygen species. Loss of its activity increases oxidative stress.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLC4A11
    term:
      id: hgnc:16438
      label: SLC4A11
  molecular_functions:
  - preferred_term: proton channel activity
    term:
      id: GO:0015252
      label: proton channel activity
    modifier: DECREASED
  cell_types:
  - preferred_term: corneal endothelial cell
    term:
      id: CL:0000132
      label: corneal endothelial cell
  locations:
  - preferred_term: corneal endothelium
    term:
      id: UBERON:0001985
      label: corneal endothelium
  downstream:
  - target: Oxidative and Mitochondrial Stress
    description: >-
      Loss of SLC4A11 activity increases mitochondrial superoxide and
      depolarized mitochondria in corneal endothelium.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31254733
      reference_title: "Ammonia sensitive SLC4A11 mitochondrial uncoupling reduces glutamine induced oxidative stress."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "In the presence of glutamine, Slc4a11-/- (KO) mouse CE generate significantly greater mitochondrial superoxide, a greater proportion of damaged depolarized mitochondria, and more apoptotic cells than WT."
      explanation: >-
        Slc4a11 knockout corneal endothelium shows increased mitochondrial
        oxidative stress. The knockout models the recessive CHED end of the
        SLC4A11 spectrum, not the heterozygous FECD state.
  evidence:
  - reference: PMID:18024964
    reference_title: "SLC4A11 mutations in Fuchs endothelial corneal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "immunoblot analysis, biochemical assay of cell surface localization and confocal immunolocalization showed that missense proteins encoded by the mutants were defective in localization to the cell surface."
    explanation: >-
      FECD-associated SLC4A11 missense proteins fail to reach the cell
      surface.
  - reference: PMID:20848555
    reference_title: "Missense mutations in the sodium borate cotransporter SLC4A11 cause late-onset Fuchs corneal dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "biochemical studies of the mutant protein indicated that these alleles impact the localization and/or posttranslational modification of the protein."
    explanation: >-
      A second cohort's SLC4A11 variants also disrupt protein localization or
      processing.
  - reference: PMID:31254733
    reference_title: "Ammonia sensitive SLC4A11 mitochondrial uncoupling reduces glutamine induced oxidative stress."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "SLC4A11 is a NH3 sensitive membrane transporter with H+ channel-like properties that facilitates Glutamine catabolism in Human and Mouse corneal endothelium (CE)."
    explanation: >-
      Describes the SLC4A11 transport activity in corneal endothelium that
      this node binds.
- name: AGBL1 Truncation and Reduced TCF4 Interaction
  description: >-
    A nonsense AGBL1 variant reported in a late-onset FECD family produces a
    truncated protein that moves to the nucleus, and the reported variants
    reduce AGBL1 binding to TCF4. Whether this has any role in FECD is
    disputed, because later transcriptome data found no AGBL1 expression in
    corneal endothelium. No downstream edge is drawn for that reason.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AGBL1
    term:
      id: hgnc:26504
      label: AGBL1
  molecular_functions:
  - preferred_term: metallocarboxypeptidase activity
    term:
      id: GO:0004181
      label: metallocarboxypeptidase activity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24094747
    reference_title: "Mutations in AGBL1 cause dominant late-onset Fuchs corneal dystrophy and alter protein-protein interaction with TCF4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Wild-type AGBL1 localizes predominantly to the cytoplasm; in sharp contrast, the truncated protein showed distinct nuclear localization."
    explanation: >-
      The truncated AGBL1 protein mislocalizes to the nucleus.
  - reference: PMID:24094747
    reference_title: "Mutations in AGBL1 cause dominant late-onset Fuchs corneal dystrophy and alter protein-protein interaction with TCF4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that AGBL1 interacts biochemically with the FCD-associated protein TCF4 and that the mutations found in our cohort of FCD individuals diminish this interaction."
    explanation: >-
      FECD-associated AGBL1 variants reduce the AGBL1-TCF4 interaction.
  - reference: PMID:40244234
    reference_title: "From Genes to Disease: Reassessing LOXHD1 and AGBL1's Contribution to Fuchs' Dystrophy."
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: "Neither LOXHD1 nor AGBL1 genes were expressed in normal or FECD corneal endothelia or progenitor cells."
    explanation: >-
      Reanalysis of published transcriptomes found no AGBL1 expression in
      corneal endothelium, which argues against this node acting in the
      affected tissue.
- name: Toxic CUG RNA Foci
  description: >-
    Expanded TCF4 repeat transcripts accumulate as CUG-repeat RNA foci in FECD
    corneal endothelial cells and sequester the splicing regulator MBNL1.
  cell_types:
  - preferred_term: corneal endothelial cell
    term:
      id: CL:0000132
      label: corneal endothelial cell
  biological_processes:
  - preferred_term: RNA splicing factor sequestration
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  locations:
  - preferred_term: corneal endothelium
    term:
      id: UBERON:0001985
      label: corneal endothelium
  downstream:
  - target: Widespread Endothelial mRNA Missplicing
    description: MBNL1 sequestration disrupts normal splicing of MBNL1-regulated transcripts.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25593321
    reference_title: "RNA toxicity and missplicing in the common eye disease Fuchs endothelial corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corneal endothelial cells from FECD patients harbor a poly(CUG)n RNA that
      can be visualized as RNA foci containing this condensed RNA and associated
      proteins.
    explanation: This directly supports toxic CUG-repeat RNA foci in FECD corneal endothelial cells.
  - reference: PMID:25593321
    reference_title: "RNA toxicity and missplicing in the common eye disease Fuchs endothelial corneal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the poly(CUG)n RNA co-localizes with and sequesters the mRNA-splicing
      factor MBNL1, leading to missplicing of essential MBNL1-regulated mRNAs.
    explanation: This links CUG-repeat foci to MBNL1 sequestration and downstream missplicing.

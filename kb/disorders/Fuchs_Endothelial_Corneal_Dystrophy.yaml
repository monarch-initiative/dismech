- accession: geo:GSE94462
  title: Comprehensive characterization of DNA methylation changes in Fuchs Endothelial Corneal Dystrophy
  description: Transparency of the human cornea is necessary for vision. Fuchs Endothelial Corneal Dystrophy (FECD) is a bilateral, heritable degeneration of the corneal endothelium, and a leading indication for corneal transplantation in developed countries. While the early onset, and rarer, form of FECD has been linked to COL8A2 mutations, the more common, late onset form of FECD has genetic mutations linked to only a minority of cases. Epigenetic modifications that occur in FECD are unkonwn. Here, we report on and compare the DNA methyhlation landscape of normal human corneal endothelial (CE) tissue and CE from FECD patients using the Illumina Infinium HumanMethylation450 (HM450) DNA methylation array.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 16
  publication: PMID:31705138
  notes: Identified by GEO DataSets index search for Fuchs Endothelial Corneal Dystrophy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: massive:MSV000091078
  title: Proteomic analysis of Descemet's membrane with corneal endothelial cells derived from patients with Fuchs endothelial corneal dystrophy and healthy control subjects
  description: This dataset contains proteomic profiles of Descemet's membrane (DM) with corneal endothelial cells derived from patients with Fuchs endothelial corneal dystrophy (FECD) and non-FECD subjects by shotgun proteomics. FECD is the most common inherited corneal disease. Fibrillar focal excrescences, called guttae, and corneal edema due to corneal endothelial cell death result in progressive vision loss. Our dataset indicated that 32 distinctive molecules were expressed only in the FECD-DM but not in the DM of the control subject, possibly having important roles in the pathophysiology of FECD.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Fuchs Endothelial Corneal Dystrophy"). Retrieved 2026-08-02.

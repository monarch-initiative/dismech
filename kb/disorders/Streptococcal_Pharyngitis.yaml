        label: clarithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Pharyngitis
    term:
      id: HP:0025439
      label: Pharyngitis
  - preferred_term: Sore throat
    term:
      id: HP:0033050
      label: Pharyngalgia
  target_mechanisms:
  - target: Streptococcal Peptidoglycan Cross-Linking
    description: Cephalosporins retain the beta-lactam PBP target.
  - target: Streptococcal Ribosomal Translation
    description: Clindamycin and macrolides target the bacterial ribosome.
  evidence:
  - reference: PMID:37493159
    reference_title: "Group A β-hemolytic Streptococcal Pharyngitis: An Updated Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For patients who have a non-anaphylactic allergy to penicillin, oral
      cephalosporin is an acceptable alternative. For patients with a history of
      immediate, anaphylactic-type hypersensitivity to penicillin, oral
      clindamycin, clarithromycin, and azithromycin are acceptable alternatives.
    explanation: >-
      This supports cephalosporin, clindamycin, azithromycin, and
      clarithromycin alternatives for patients with penicillin allergy.

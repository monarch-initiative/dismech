        id: CHEBI:17334
        label: penicillin
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Pharyngitis
    term:
      id: HP:0025439
      label: Pharyngitis
  - preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  - preferred_term: Sore throat
    term:
      id: HP:0033050
      label: Pharyngalgia
  target_mechanisms:
  - target: Streptococcal Peptidoglycan Cross-Linking
    description: >-
      Beta-lactams inhibit the penicillin-binding-protein transpeptidation
      needed for peptidoglycan cross-linking in GAS.
  evidence:
  - reference: PMID:37493159
    reference_title: "Group A β-hemolytic Streptococcal Pharyngitis: An Updated Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antimicrobial therapy should be initiated without delay once the diagnosis
      is confirmed. Oral penicillin V and amoxicillin remain the drugs of
      choice.
    explanation: >-
      This supports penicillin and amoxicillin as first-line therapy for
      confirmed GABHS pharyngitis.
  - reference: PMID:37965935
    reference_title: "Different antibiotic treatments for group A streptococcal pharyngitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Antibiotics provide only modest benefit in treating sore throat, although
      their effectiveness increases in people with positive throat swabs for
      group A beta-haemolytic streptococci (GABHS).
    explanation: >-
      This Cochrane review supports antibiotic benefit being most relevant after
      a positive GAS throat swab.

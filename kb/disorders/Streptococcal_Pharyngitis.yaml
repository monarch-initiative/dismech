pathophysiology:
- name: Streptococcal Pharyngeal Adhesion and Colonization
  role: trigger
  description: >-
    Streptococcus pyogenes uses surface adhesins and pili to attach to and
    colonize pharyngeal and tonsillar epithelial surfaces, establishing the
    mucosal infection that initiates group A streptococcal pharyngitis.
  locations:
  - preferred_term: pharynx
    term:
      id: UBERON:0006562
      label: pharynx
  - preferred_term: tonsil
    term:
      id: UBERON:0002372
      label: tonsil
  cell_types:
  - preferred_term: pharyngeal and tonsillar epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  - preferred_term: response to bacterium
    modifier: ABNORMAL
    term:
      id: GO:0009617
      label: response to bacterium
  downstream:
  - target: SpeA-Mediated Tonsillar Immune Dysregulation
    description: Toxigenic strains can express SpeA superantigen in the tonsillar niche.
  - target: Acute Pharyngotonsillar Inflammation
    description: Mucosal GAS colonization triggers the acute local inflammatory syndrome.
  evidence:
  - reference: PMID:27312939
    reference_title: "Streptococcus pyogenes adhesion and colonization."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The upper respiratory tract and skin are major reservoirs for GAS
      infections. The ability of GAS to establish an infection in the new host
      at these anatomical sites primarily results from two distinct
      physiological processes, namely bacterial adhesion and colonization.
    explanation: >-
      This supports epithelial adhesion and colonization as the initiating steps
      at GAS mucosal reservoirs.
- name: SpeA-Mediated Tonsillar Immune Dysregulation
  role: amplifier
  description: >-
    Streptococcal pyrogenic exotoxin A and related superantigens can drive
    proliferation of human tonsillar T cells, alter T follicular helper-cell
    phenotype, and induce B-cell apoptosis with reduced immunoglobulin release,
    providing superantigen-producing organisms with a local survival advantage.
  locations:
  - preferred_term: tonsil
    term:
      id: UBERON:0002372
      label: tonsil
  cell_types:
  - preferred_term: tonsillar T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: tonsillar B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: T cell activation
    modifier: INCREASED
    term:
      id: GO:0042110
      label: T cell activation
  - preferred_term: B-cell apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:30815853
    reference_title: "Streptococcal superantigen-induced expansion of human tonsil T cells leads to altered T follicular helper cell phenotype, B cell death and reduced immunoglobulin release."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Tonsil T cells proliferated in response to SpeA and demonstrated typical
      release of proinflammatory cytokines. When cultured in the absence of
      superantigen, tonsil preparations released large quantities of
      immunoglobulin over 7 days. In contrast, marked B cell apoptosis and
      abrogation of total immunoglobulin (Ig)A, IgM, and IgG production occurred
      in the presence of SpeA and other superantigens.
    explanation: >-
      This human tonsil-cell experiment directly supports SpeA-driven T-cell
      activation and B-cell death in the tissue affected by GAS
      tonsillopharyngitis.
- name: Acute Pharyngotonsillar Inflammation
  role: consequence
  description: >-
    Infection-induced inflammation of the pharynx, tonsils, uvula, and draining
    anterior cervical lymph nodes accounts for the characteristic abrupt fever,
    sore throat, odynophagia, pharyngitis, and tender anterior cervical
    lymphadenopathy of streptococcal pharyngitis.
  locations:
  - preferred_term: pharynx
    term:
      id: UBERON:0006562
      label: pharynx
  - preferred_term: tonsil
    term:
      id: UBERON:0002372
      label: tonsil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Pharyngitis
    description: Pharyngeal inflammation produces the defining pharyngitis.
  - target: Enlarged tonsils
    description: Tonsillar inflammation produces tonsillar enlargement.
  - target: Pharyngalgia
    description: Local inflammation produces intense throat pain.
  - target: Odynophagia
    description: Throat inflammation produces pain on swallowing.
  - target: Fever
    description: GAS pharyngitis produces abrupt systemic fever.
  - target: Cervical lymphadenopathy
    description: Regional immune activation enlarges tender anterior cervical lymph nodes.
  - target: Contiguous Suppurative Spread
    description: Local spread can produce otitis media, sinusitis, and other suppurative complications.
  - target: Post-Streptococcal Immune Sequelae
    description: A subset of infections can trigger autoimmune sequelae after the acute pharyngeal infection.
  evidence:
  - reference: PMID:37493159
    reference_title: "Group A β-hemolytic Streptococcal Pharyngitis: An Updated Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Children with GABHS pharyngitis typically present with an abrupt onset of
      fever, intense pain in the throat, pain on swallowing, an inflamed
      pharynx, enlarged and erythematous tonsils, a red and swollen uvula,
      enlarged tender anterior cervical lymph nodes.
    explanation: >-
      This clinical review links acute GABHS pharyngitis to the local
      pharyngotonsillar inflammatory findings and systemic fever.
- name: Contiguous Suppurative Spread
  role: complication
  description: >-
    Local extension from group A streptococcal pharyngitis can produce
    suppurative complications, including otitis media, sinusitis, mastoiditis,
    and peritonsillar or retropharyngeal abscess.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Otitis media
    description: Contiguous spread can produce acute middle-ear infection.
  - target: Sinusitis
    description: Contiguous spread can produce acute sinusitis.
  evidence:
  - reference: PMID:23067784
    reference_title: "Rapidly progressing subperiosteal orbital abscess: an unexpected complication of a group-A streptococcal pharyngitis in a healthy young patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications associated to group-A streptococcal pharyingitis include
      non-suppurative complications such as acute rheumatic fever and
      glomerulonephritis and suppurative complications such as peritonsillar or
      retropharyngeal abscess, sinusitis, mastoiditis, otitis media, meningitis,
      brain abscess, or thrombosis of the intracranial venous sinuses.
    explanation: >-
      This case report and literature review supports otitis media and sinusitis
      as recognized suppurative complications of GAS pharyngitis.
- name: Post-Streptococcal Immune Sequelae
  role: complication
  description: >-
    Group A Streptococcus can trigger post-infectious immune complications after
    pharyngitis, including acute rheumatic fever, acute post-streptococcal
    glomerulonephritis, and rheumatic heart disease.
  biological_processes:
  - preferred_term: immune response
    modifier: ABNORMAL
    term:
      id: GO:0006955
      label: immune response
  evidence:
  - reference: PMID:40572286
    reference_title: "From Infection to Autoimmunity: S. pyogenes as a Model Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAS also notably triggers post-infectious immune sequelae, including
      acute poststreptococcal glomerulonephritis (APSGN), acute rheumatic fever
      (ARF), and rheumatic heart disease (RHD), which are major health burdens,
      especially in low-income countries.
    explanation: >-
      This review supports post-streptococcal immune disease as a downstream
      branch of GAS infection without re-curating those distinct sequelae here.
- name: Streptococcal Peptidoglycan Cross-Linking
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    Streptococcus pyogenes depends on penicillin-binding-protein
    transpeptidation to cross-link its peptidoglycan cell wall; beta-lactam
    antibiotics inhibit this reaction and group A Streptococcus remains
    universally susceptible to penicillin.
  biological_processes:
  - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
  evidence:
  - reference: PMID:39259691
    reference_title: "Chains of misery: surging invasive group A streptococcal disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GAS remains universally susceptible to penicillin but there are increasing
      reports of macrolide and lincosamide resistance, particularly in invasive
      isolates, with uncertain clinical consequences.
    explanation: >-
      Universal penicillin susceptibility supports cell-wall beta-lactams as an
      active therapeutic vulnerability in GAS.
- name: Streptococcal Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    Streptococcus pyogenes depends on 70S-ribosome translation. Clindamycin and
    macrolides target the 50S ribosome and are treatment alternatives for
    immediate-type penicillin hypersensitivity.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:12860123
    reference_title: "The mechanism of action of macrolides, lincosamides and streptogramin B reveals the nascent peptide exit path in the ribosome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The macrolide-lincosamide-streptogramin B class (MLS) of antibiotics
      contains structurally different but functionally similar drugs, that all
      bind to the 50S ribosomal subunit. It has been suggested that these
      compounds block the path by which nascent peptides exit the ribosome. We
      have studied the mechanisms of action of four macrolides (erythromycin,
      josamycin, spiramycin and telithromycin), one lincosamide (clindamycin)
      and one streptogramin B (pristinamycin IA).
    explanation: >-
      This cell-free ribosome study supports 50S binding and peptide-exit
      blockade by the macrolide and lincosamide drug classes represented by this
      node.

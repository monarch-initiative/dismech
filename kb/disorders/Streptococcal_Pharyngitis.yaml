diagnosis:
- name: Throat swab microbiologic testing
  description: >-
    Suspected group A streptococcal pharyngitis is confirmed with throat-swab
    microbiologic testing, such as culture, rapid antigen detection testing, or
    molecular point-of-care testing.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Detection of group A Streptococcus from a throat swab supports the diagnosis in a compatible clinical syndrome.
  evidence:
  - reference: PMID:37493159
    reference_title: "Group A β-hemolytic Streptococcal Pharyngitis: An Updated Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients suspected of having GABHS pharyngitis should be confirmed by
      microbiologic testing (e.g., culture, rapid antigen detection test,
      molecular point-of-care test) of a throat swab specimen prior to the
      initiation of antimicrobial therapy.
    explanation: >-
      This supports throat-swab microbiologic confirmation before antibiotic
      therapy in suspected GABHS pharyngitis.
- name: Clinical-score triage
  description: >-
    Centor-style clinical scores can help decide who needs microbiologic
    testing, but score-only diagnosis is insufficient in children with sore
    throat.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: Centor score alone is not adequate to diagnose or exclude pediatric GAS pharyngitis.
  evidence:
  - reference: PMID:39528865
    reference_title: "Centor scores associated poorly with rapid antigen test findings in children with sore throat."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Centor score alone does not seem to be of any utility in guiding the
      diagnosis of suspected streptococcal pharyngitis. Microbiological testing
      remains necessary for accurate diagnosis and CRP should not be used to
      differentiate viral and bacterial pharyngitis cases.
    explanation: >-
      This pediatric study supports the limitation of clinical-score-only
      diagnosis and the need for microbiologic testing.
treatments:
- name: Beta-lactam antibiotic therapy
  description: >-
    Penicillin or amoxicillin treats confirmed group A streptococcal pharyngitis
    by targeting streptococcal peptidoglycan cross-linking.
  treatment_term:
    preferred_term: antimicrobial agent therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy

name: Streptococcal Pharyngitis
creation_date: "2026-09-27T06:23:39Z"
updated_date: "2026-09-27T06:23:39Z"
description: >-
  Streptococcal pharyngitis is an acute group A Streptococcus upper-airway
  infection in which Streptococcus pyogenes adheres to and colonizes the
  pharyngeal and tonsillar epithelium, causing abrupt pharyngeal inflammation
  with fever, throat pain, odynophagia, and tender anterior cervical
  lymphadenopathy. Untreated infection can spread contiguously or seed
  post-streptococcal immune sequelae, motivating throat-swab confirmation and
  prompt narrow-spectrum antibiotic treatment.
category: Infectious Disease
disease_term:
  preferred_term: streptococcal sore throat
  term:
    id: MONDO:0021783
    label: streptococcal sore throat
parents:
- Bacterial infection
synonyms:
- Group A Streptococcal Pharyngitis
- Group A beta-hemolytic Streptococcal Pharyngitis
- GABHS Pharyngitis
- Strep Throat
- Streptococcal Sore Throat
notes: >-
  Deep research was run with the openscientist provider. The report's
  reference-validation pass resolved all 43 PMIDs and found no off-topic
  references, but its term-validation pass flagged several real identifiers with
  wrong labels, including MONDO:0005295 misnamed as rheumatic heart disease,
  UBERON:0002007 misnamed as heart valve, and NCIT:C61785/NCIT:C287 misnamed as
  penicillin/amoxicillin; those suggestions were not used. The report also
  surfaced sequela literature for rheumatic heart disease, acute
  post-streptococcal glomerulonephritis, and PANDAS/Sydenham chorea, plus
  preclinical group A Streptococcus vaccine work; this entry consumes those
  leads only as complication context because the dedicated entity here is acute
  streptococcal sore throat, distinct from Scarlet_Fever,
  Rheumatic_Heart_Disease, and
  Pediatric_Autoimmune_Neuropsychiatric_Disorders_Associated_With_Streptococcal_Infections.
infectious_agent:
- name: Streptococcus pyogenes
  infectious_agent_term:
    preferred_term: Streptococcus pyogenes
    term:
      id: NCBITaxon:1314
      label: Streptococcus pyogenes
  description: >-
    Streptococcus pyogenes, or group A Streptococcus, is a human-adapted
    beta-hemolytic coccus that colonizes the upper respiratory tract and can
    cause acute pharyngitis.
  evidence:
  - reference: PMID:40572286
    reference_title: "From Infection to Autoimmunity: S. pyogenes as a Model Pathogen."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Group A beta-hemolytic Streptococcus (GAS) is a Gram-positive,
      coccoid-shaped bacterium that tends to grow in chains; it is a
      non-spore-forming, facultatively anaerobic, catalase-negative, aerobic
      bacterium. It is known to cause a wide range of infections in children,
      ranging from mild upper respiratory tract infections, such as pharyngitis,
      to severe invasive disease.
    explanation: >-
      This review identifies group A Streptococcus as the bacterial agent that
      causes pharyngitis.
transmission:
- name: Close-contact and respiratory-droplet spread
  description: >-
    Group A Streptococcus spreads between humans through close or direct contact
    and especially through respiratory droplets, with the upper respiratory tract
    serving as a major reservoir.
  evidence:
  - reference: PMID:27312939
    reference_title: "Streptococcus pyogenes adhesion and colonization."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main route of GAS transmission between humans is through close or
      direct physical contact, and particularly via respiratory droplets. The
      upper respiratory tract and skin are major reservoirs for GAS infections.
    explanation: >-
      This supports close-contact and droplet transmission from upper-airway
      reservoirs.

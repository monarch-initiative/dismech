pathophysiology:
- name: Biallelic SBDS Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Gene conversion between SBDS and its 97%-identical neighbouring pseudogene
    SBDSP1 imports pseudogene-derived sequence changes that truncate the
    protein, leaving a hypomorphic residue of SBDS activity.
  genes:
  - preferred_term: SBDS
    term:
      id: hgnc:19440
      label: SBDS
  evidence:
  - reference: PMID:12496757
    reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A pseudogene copy (SBDSP) with 97% nucleotide sequence identity resides in a locally duplicated genomic segment of 305 kb.
    explanation: >-
      Identifies the pseudogene whose conversion generates the recurrent SDS
      alleles.
  - reference: PMID:12496757
    reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Converted segments consistently included at least one of two pseudogene-like sequence changes that result in protein truncation.
    explanation: >-
      Establishes protein truncation as the functional consequence of the
      converted alleles.
  downstream:
  - target: Failure of eIF6 Eviction from the Pre-60S Subunit
    description: >-
      SBDS is the cofactor that couples EFL1 GTP hydrolysis to eIF6 release, so
      its loss blocks the eviction step directly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21536732
      reference_title: >-
        Uncoupling of GTP hydrolysis from eIF6 release on the ribosome causes Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Functional analysis of disease-associated missense variants reveals that the essential role of SBDS is to tightly couple GTP hydrolysis by EFL1 on the ribosome to eIF6 release.
      explanation: >-
        Directly attributes the eviction failure to loss of SBDS function.
- name: Biallelic DNAJC21 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    DNAJC21 is an rRNA-associated co-chaperone acting at two points of ribosome
    biogenesis. Biallelic loss corrupts early nuclear rRNA processing as well as
    the late cytoplasmic maturation of the 60S subunit, and traps the 60S export
    factor PA2G4 in the cytoplasm.
  genes:
  - preferred_term: DNAJC21
    term:
      id: hgnc:27030
      label: DNAJC21
  biological_processes:
  - preferred_term: ribosomal large subunit biogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042273
      label: ribosomal large subunit biogenesis
  evidence:
  - reference: PMID:27346687
    reference_title: >-
      DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that the encoded protein associates with rRNA and plays a highly conserved role in the maturation of the 60S ribosomal subunit.
    explanation: >-
      Establishes the 60S maturation role that biallelic loss disrupts.
  - reference: PMID:27346687
    reference_title: >-
      DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DNAJC21 deficiency resulted in cytoplasmic accumulation of the 60S nuclear export factor PA2G4, aberrant ribosome profiles, and increased cell death.
    explanation: >-
      Patient-derived and knockdown cellular data for the proximal molecular
      defect.
  downstream:
  - target: Impaired 80S Ribosome Assembly
    description: >-
      Corrupted 60S maturation reduces the pool of subunits competent to form
      translating 80S ribosomes.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27346687
      reference_title: >-
        DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        DNAJC21 deficiency resulted in cytoplasmic accumulation of the 60S nuclear export factor PA2G4, aberrant ribosome profiles, and increased cell death.
      explanation: >-
        Cellular data showing aberrant ribosome profiles, the direct in-vitro
        support for this edge. The paper's combined causality conclusion is
        cited instead in the genetic section, where its human-genetic character
        is the point.
- name: Failure of eIF6 Eviction from the Pre-60S Subunit
  biological_scale: MOLECULAR
  description: >-
    Release of the anti-association factor eIF6 is the last step of cytoplasmic
    60S maturation and is catalysed by SBDS together with the GTPase EFL1.
    Disease variants uncouple EFL1 GTP hydrolysis from eIF6 release, so eIF6
    remains bound and the subunit cannot join a 40S partner.
  biological_processes:
  - preferred_term: ribosomal large subunit assembly
    modifier: ABNORMAL
    term:
      id: GO:0000027
      label: ribosomal large subunit assembly
  evidence:
  - reference: PMID:21536732
    reference_title: >-
      Uncoupling of GTP hydrolysis from eIF6 release on the ribosome causes Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, by isolating late cytoplasmic 60S ribosomal subunits from Sbds-deleted mice, we show that SBDS and the GTPase elongation factor-like 1 (EFL1) directly catalyze eIF6 removal in mammalian cells by a mechanism that requires GTP binding and hydrolysis by EFL1 but not phosphorylation of eIF6 Ser 235.
    explanation: >-
      Demonstrates in Sbds-null mouse ribosomes that SBDS and EFL1 jointly
      catalyse the eviction step lost in SDS.
  downstream:
  - target: Impaired 80S Ribosome Assembly
    description: >-
      eIF6 retained on the 60S subunit sterically blocks subunit joining, so
      fewer 80S ribosomes are formed.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21536732
      reference_title: >-
        Uncoupling of GTP hydrolysis from eIF6 release on the ribosome causes Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings establish a direct role for SBDS and EFL1 in catalyzing the translational activation of ribosomes in all eukaryotes, and define SDS as a ribosomopathy caused by uncoupling GTP hydrolysis from eIF6 release.
      explanation: >-
        States that the eviction defect is what withholds translational
        activation of the ribosome.
- name: Impaired Co-translational Protein Targeting
  biological_scale: MOLECULAR
  description: >-
    In the SRP54-related form the lesion is not ribosome maturation but the
    signal recognition particle itself. Missense variants in the SRP54 GTPase
    domain reduce GTPase activity and impair delivery of nascent secretory and
    membrane polypeptides, a load the granulopoietic and pancreatic acinar
    compartments are least able to absorb.
  genes:
  - preferred_term: SRP54
    term:
      id: hgnc:11301
      label: SRP54
  evidence:
  - reference: PMID:28972538
    reference_title: >-
      Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      3D protein modeling revealed that the 3 variants affect highly conserved amino acids within the GTPase domain of the protein that are critical for GTP and receptor binding. Indeed, we observed that the GTPase activity of the mutated proteins was impaired.
    explanation: >-
      Establishes impaired SRP54 GTPase activity as the proximal molecular
      defect of this subtype.
  downstream:
  - target: Bone Marrow Failure with Granulopoietic Predominance
    description: >-
      Zebrafish knockdown of SRP54 reproduces the neutrophil deficit and
      chemotaxis defect seen in patients.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced secretory-pathway throughput in maturing myeloid precursors.
    evidence:
    - reference: PMID:28972538
      reference_title: >-
        Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Profound reductions in neutrophil counts and chemotaxis as well as a diminished exocrine pancreas size in a SRP54-knockdown zebrafish model faithfully recapitulated the human phenotype.
      explanation: >-
        Model-organism evidence linking loss of SRP54 function to the
        granulopoietic and pancreatic phenotype.
  - target: Exocrine Pancreatic Acinar Failure
    description: >-
      The same knockdown reduces exocrine pancreas size, matching the pancreatic
      arm of the human phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28972538
      reference_title: >-
        Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Profound reductions in neutrophil counts and chemotaxis as well as a diminished exocrine pancreas size in a SRP54-knockdown zebrafish model faithfully recapitulated the human phenotype.
      explanation: >-
        The pancreatic component of the same model-organism result.
- name: Impaired 80S Ribosome Assembly
  biological_scale: CELLULAR
  description: >-
    The convergent cellular lesion of the SBDS, EFL1 and DNAJC21 forms: mature
    subunits fail to assemble into translating 80S ribosomes. This is the node
    at which the otherwise distinct causal genes of nosology group 11 meet.
  biological_processes:
  - preferred_term: ribosomal large subunit assembly
    modifier: ABNORMAL
    term:
      id: GO:0000027
      label: ribosomal large subunit assembly
  evidence:
  - reference: PMID:30413969
    reference_title: >-
      Shwachman-Diamond Syndrome: Molecular Mechanisms and Current Perspectives.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SBDS, through direct interaction with EFL1, promotes the release of the eukaryotic initiation factor 6 (eIF6) during ribosome maturation, DNAJC21 stabilizes the 80S ribosome, and SRP54 facilitates protein trafficking.
    explanation: >-
      Review statement that the SDS genes converge on ribosome maturation and
      early protein synthesis.
  downstream:
  - target: Global Translation Deficit
    description: >-
      Fewer competent 80S ribosomes lowers global protein synthesis. The two
      steps are close together in time but are separate claims: a cell could in
      principle compensate for reduced assembly, and the somatic EIF6 arm of
      this disease is precisely such a compensation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30413969
      reference_title: >-
        Shwachman-Diamond Syndrome: Molecular Mechanisms and Current Perspectives.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        SBDS, through direct interaction with EFL1, promotes the release of the eukaryotic initiation factor 6 (eIF6) during ribosome maturation, DNAJC21 stabilizes the 80S ribosome, and SRP54 facilitates protein trafficking.
      explanation: >-
        Places the SDS genes at ribosome maturation, upstream of the protein
        synthesis this edge lowers.
- name: Global Translation Deficit
  biological_scale: CELLULAR
  description: >-
    Reduced global protein synthesis, the functional consequence that makes SDS
    a ribosomopathy and the constraint that selects the somatic clones later in
    the graph.
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:30413969
    reference_title: >-
      Shwachman-Diamond Syndrome: Molecular Mechanisms and Current Perspectives.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SBDS, through direct interaction with EFL1, promotes the release of the eukaryotic initiation factor 6 (eIF6) during ribosome maturation, DNAJC21 stabilizes the 80S ribosome, and SRP54 facilitates protein trafficking.
    explanation: >-
      Review statement that the SDS genes converge on ribosome maturation and
      early protein synthesis.
  downstream:
  - target: Exocrine Pancreatic Acinar Failure
    description: >-
      The acinar cell, among the most secretory in the body, is
      disproportionately sensitive to a global translation deficit.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12496757
      reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Archaeal orthologs are located within highly conserved operons that include homologs of RNA-processing genes, suggesting that SDS may be caused by a deficiency in an aspect of RNA metabolism that is essential for development of the exocrine pancreas, hematopoiesis and chrondrogenesis.
      explanation: >-
        A hedged inference in the 2003 discovery paper, from archaeal operon
        synteny rather than functional work, that the RNA/ribosome defect
        selects this tissue. Consistent with the edge but not establishing
        it, hence partial support.
  - target: Bone Marrow Failure with Granulopoietic Predominance
    description: >-
      Hematopoietic progenitors, and the granulocytic lineage in particular,
      cannot sustain output under the translation deficit.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12496757
      reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Archaeal orthologs are located within highly conserved operons that include homologs of RNA-processing genes, suggesting that SDS may be caused by a deficiency in an aspect of RNA metabolism that is essential for development of the exocrine pancreas, hematopoiesis and chrondrogenesis.
      explanation: >-
        A hedged inference in the 2003 discovery paper, from archaeal operon
        synteny rather than functional work, that the RNA/ribosome defect
        selects this tissue. Consistent with the edge but not establishing
        it, hence partial support.
  - target: Growth Plate Chondrocyte Dysfunction
    description: >-
      Chondrogenesis is the third tissue named as sensitive to the SDS defect,
      and is the origin of the metaphyseal dysplasia that places SDS in the
      metaphyseal group of the skeletal nosology.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12496757
      reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Archaeal orthologs are located within highly conserved operons that include homologs of RNA-processing genes, suggesting that SDS may be caused by a deficiency in an aspect of RNA metabolism that is essential for development of the exocrine pancreas, hematopoiesis and chrondrogenesis.
      explanation: >-
        A hedged inference in the 2003 discovery paper, from archaeal operon
        synteny rather than functional work, that the RNA/ribosome defect
        selects this tissue. Consistent with the edge but not establishing
        it, hence partial support.
  - target: Somatic Clonal Hematopoiesis Under Ribosomal Fitness Constraint
    description: >-
      The translation deficit is itself the selective pressure: it constrains
      hematopoietic clone fitness and thereby selects somatic mutants.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33637765
      reference_title: >-
        Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We show that germline SBDS deficiency establishes a fitness constraint that drives selection of somatic clones via two distinct mechanisms with different clinical consequences.
      explanation: >-
        Longitudinal patient sequencing links the germline ribosome defect to
        clonal selection in the marrow.
- name: Exocrine Pancreatic Acinar Failure
  biological_scale: TISSUE
  description: >-
    Acinar tissue is replaced by fat, producing pancreatic enzyme deficiency,
    steatorrhoea and malabsorption. Unusually for a structural pancreatic
    disease, secretory capacity often improves with age, and a substantial
    minority of patients become pancreatic sufficient in later childhood.
  evidence:
  - reference: PMID:12120235
    reference_title: "Shwachman-Diamond syndrome: clinical phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      several studies have shown that, with advancing age, about 40-60% of patients become pancreatic sufficient
    explanation: >-
      Documents the age-dependent partial recovery of exocrine function that
      distinguishes this node from a fixed structural lesion.
  downstream:
  - target: Malnutrition
    description: >-
      Fat and fat-soluble vitamin malabsorption drive failure to thrive.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301722
      reference_title: Shwachman-Diamond Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        exocrine pancreatic dysfunction with malabsorption, malnutrition, and growth failure
      explanation: >-
        GeneReviews states the causal sequence from pancreatic dysfunction to
        growth failure.
- name: Bone Marrow Failure with Granulopoietic Predominance
  biological_scale: TISSUE
  description: >-
    Persistent or intermittent neutropenia is the earliest and most constant
    haematological finding, but the marrow defect is not lineage-restricted and
    single- or multilineage cytopenias develop over time.
  evidence:
  - reference: PMID:12120235
    reference_title: "Shwachman-Diamond syndrome: clinical phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intermittent neutropenia is the most common haematological finding in SDS, but more of the bone marrow cellular elements can be involved.
    explanation: >-
      Supports both the granulocytic predominance and the broader marrow
      involvement described in this node.
  downstream:
  - target: p53-Dependent Progenitor Apoptosis
    description: >-
      Ribosomal stress from the maturation defect activates p53 in marrow
      progenitors, and the resulting apoptosis is the proximate reason the
      cytopenias develop.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37226705
      reference_title: >-
        Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Increased apoptosis was observed in SDS-derived BM in combination with p53 overexpression.
      explanation: >-
        Patient marrow shows increased apoptosis together with p53

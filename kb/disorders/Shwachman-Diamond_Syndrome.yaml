      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with SDS often experience recurrent infections due to neutropenia and in some patients hypogammaglobulinemia.
      explanation: >-
        Directly states the causal link from neutropenia to recurrent infection
        in an SDS cohort.
- name: Growth Plate Chondrocyte Dysfunction
  biological_scale: TISSUE
  description: >-
    The skeletal arm of the disease. Radiographs show delayed appearance of
    secondary ossification centres, then widening and irregularity of the
    metaphyses that progresses with age, together with generalised osteopenia.
    The metaphyseal component worsens while the epiphyseal maturation delay
    tends to normalise, which is why the nosology classifies SDS as a
    metaphyseal rather than an epiphyseal dysplasia.
  evidence:
  - reference: PMID:14984468
    reference_title: >-
      Skeletal phenotype in patients with Shwachman-Diamond syndrome and mutations in SBDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical features were (1) delayed appearance of secondary ossification centers, (2) variable widening and irregularity of the metaphyses in early childhood, followed by progressive thickening and irregularity of the growth plates, and (3) generalized osteopenia.
    explanation: >-
      Radiographic series in molecularly confirmed patients defining the
      skeletal lesion of this node.
  downstream:
  - target: Metaphyseal Dysplasia
    description: >-
      Disordered metaphyseal growth produces the clinical skeletal dysplasia and
      contributes to short stature independently of malnutrition.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:14984468
      reference_title: >-
        Skeletal phenotype in patients with Shwachman-Diamond syndrome and mutations in SBDS.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There was a tendency towards normalization of the epiphyseal maturation defect and progression of the metaphyseal changes with age.
      explanation: >-
        Establishes the metaphyseal lesion as the progressive component driving
        the clinical dysplasia.
- name: Metaphyseal Dysplasia
  biological_scale: ORGANISM
  description: >-
    The clinically expressed skeletal lesion: metaphyseal dyschondroplasia of
    the long bones, short ribs with broadened anterior ends, and thoracic

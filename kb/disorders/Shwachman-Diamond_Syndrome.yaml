- name: Short Stature
  biological_scale: ORGANISM
  description: >-
    Short stature in SDS has two converging causes, modelled here as two
    incoming edges: the intrinsic skeletal growth defect, and malnutrition from
    exocrine pancreatic insufficiency. Studies indicating that patients are
    genuinely short rather than merely undernourished are why the skeletal route
    is drawn at all.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In almost all affected children, persistent or intermittent neutropenia is an early finding. Short stature and recurrent infections are common.
    explanation: >-
      Records short stature as a common manifestation.
- name: Malnutrition
  biological_scale: ORGANISM
  description: >-
    Fat and fat-soluble vitamin malabsorption secondary to exocrine pancreatic
    insufficiency. This is the nutritional route to poor growth, distinct from
    the skeletal one.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      exocrine pancreatic dysfunction with malabsorption, malnutrition, and growth failure
    explanation: >-

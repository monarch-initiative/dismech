- name: p53-Dependent Progenitor Apoptosis
  biological_scale: CELLULAR
  description: >-
    Ribosomal stress activates p53 in haematopoietic progenitors, and the
    apoptosis that follows is what depletes the marrow. The checkpoint cuts both
    ways: with p53 intact the cells die, producing the cytopenias, while p53
    inactivation lets them survive as aneuploid cells - which is the same
    checkpoint whose somatic loss defines the pre-malignant clonal arm of this
    disease.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased apoptosis was observed in SDS-derived BM in combination with p53 overexpression.
    explanation: >-
      Establishes the apoptosis and its association with p53 in patient marrow.
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of SBDS was associated with increased apoptosis when checkpoint pathways were intact but resulted in aneuploid cells when p53 was inactivated.
    explanation: >-
      Establishes the two-way dependence on p53 that links the cytopenias to the
      same checkpoint whose somatic loss drives the maladaptive clonal arm.
- name: Recurrent Infection
  biological_scale: ORGANISM
  description: >-
    Recurrent bacterial infection, particularly respiratory and otologic, is a
    common presenting problem and the main indication for G-CSF.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In almost all affected children, persistent or intermittent neutropenia is an early finding. Short stature and recurrent infections are common.
    explanation: >-
      GeneReviews records recurrent infection as a common manifestation
      alongside the early neutropenia.
- name: Somatic Clonal Hematopoiesis Under Ribosomal Fitness Constraint
  biological_scale: CELLULAR
  description: >-
    Multiple independent somatic clones arise in the SDS marrow from early life,
    selected by the fitness constraint the germline ribosome defect imposes. The
    clones are not one population: they split into two mechanistically opposed
    classes with opposite clinical meaning, modelled here as separate downstream
    nodes so that the graph cannot be read as "clonal hematopoiesis causes
    leukemia".
  evidence:
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that multiple independent somatic hematopoietic clones arise early in life, most commonly harboring heterozygous mutations in EIF6 or TP53.
    explanation: >-
      Establishes the existence and genetic identity of the two somatic clone
      classes.
  downstream:
  - target: EIF6-Mutant Compensatory Clonal Expansion
    description: >-
      The compensatory arm, selected because inactivating EIF6 partially
      corrects the very defect that constrains clone fitness.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33637765
      reference_title: >-
        Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        EIF6 inactivation mediates a compensatory pathway with limited leukemic potential by ameliorating the underlying SDS ribosome defect and enhancing clone fitness.
      explanation: >-
        Identifies the compensatory clonal pathway and its limited leukemic
        potential.
  - target: TP53-Mutant Maladaptive Clonal Expansion
    description: >-
      The pre-malignant arm, selected by removing tumour-suppressor checkpoints
      rather than by correcting the ribosome defect.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33637765
      reference_title: >-
        Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TP53 mutations define a maladaptive pathway with enhanced leukemic potential by inactivating tumor suppressor checkpoints without correcting the ribosome defect.
      explanation: >-
        Identifies the maladaptive clonal pathway and its enhanced leukemic
        potential.
- name: EIF6-Mutant Compensatory Clonal Expansion
  biological_scale: CELLULAR
  description: >-
    Somatic EIF6 inactivation ameliorates the underlying ribosome defect and so
    enhances clone fitness. It carries limited leukemic potential and is
    deliberately given no edge to malignant transformation: this arm is a
    compensatory response, not a step toward leukemia, and an edge here would
    assert the opposite of what the source reports. EIF6 is inactivated by two
    distinct genetic routes, and both belong here: point mutation, and
    interstitial deletion of chromosome 20q, which removes the EIF6 locus and is
    the commoner of the two. This is why del(20q) in an SDS marrow does not
    carry the ominous meaning it carries in sporadic myelodysplastic syndrome.
  evidence:
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EIF6 inactivation mediates a compensatory pathway with limited leukemic potential by ameliorating the underlying SDS ribosome defect and enhancing clone fitness.
    explanation: >-
      Establishes both the compensatory mechanism and the limited leukemic
      potential that justifies leaving this node without a malignancy edge.
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected, we observed frequent interstitial deletions of chromosome 20q (8 of 17, 47%) in patients without MN
    explanation: >-
      Establishes interstitial del(20q) as frequent, and specifically in
      patients without myeloid neoplasia, which is what marks it as part of the
      compensatory rather than the pre-malignant arm.
- name: TP53-Mutant Maladaptive Clonal Expansion
  biological_scale: CELLULAR
  description: >-
    Somatic TP53 mutation improves clone fitness by inactivating
    tumour-suppressor checkpoints while leaving the ribosome defect uncorrected.
    This is the arm that carries leukemic potential, and progression to overt
    leukemia is associated with acquisition of biallelic TP53 alterations.
  evidence:
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TP53 mutations define a maladaptive pathway with enhanced leukemic potential by inactivating tumor suppressor checkpoints without correcting the ribosome defect.
    explanation: >-
      Establishes this arm as the pre-malignant one.
  downstream:
  - target: Myeloid Malignant Transformation
    description: >-
      Progression to overt myeloid malignancy follows acquisition of biallelic
      TP53 alterations within this clonal lineage.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Acquisition of a second TP53 hit, producing biallelic TP53 inactivation in the expanded clone.
    evidence:
    - reference: PMID:33637765
      reference_title: >-
        Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Subsequent development of leukemia was associated with acquisition of biallelic TP53 alterations.
      explanation: >-
        Ties the transition to overt leukemia to biallelic TP53 inactivation
        rather than to clonal hematopoiesis as such.
- name: Myeloid Malignant Transformation
  biological_scale: ORGANISM
  description: >-
    Progression to myelodysplastic syndrome or acute myeloid leukemia occurs in
    a substantial minority of patients, typically at a young age, and is the
    principal determinant of prognosis. Solid tumours are rare.
  evidence:
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 10-30% of cases, transformation to a myeloid neoplasm occurs.
    explanation: >-
      Quantifies the transformation risk described in this node.
  - reference: PMID:35322185
    reference_title: >-
      Shwachman Diamond syndrome: narrow genotypic spectrum and variable clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased risk of hematologic malignancies at young ages and the rarity of solid malignancies was observed in both the NCI cohort and published studies.
    explanation: >-
      Cohort evidence for the young age at malignancy and the restriction to
      haematological cancers.
phenotypes:
- name: Neutropenia
  category: Hematologic
  diagnostic: true
  description: >-
    Persistent or intermittent neutropenia, present in essentially all affected
    children and usually the earliest abnormality.
  phenotype_term:
    preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
    temporality: RECURRENT
  evidence:
  - reference: PMID:35322185
    reference_title: >-
      Shwachman Diamond syndrome: narrow genotypic spectrum and variable clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had the SDS hallmark features of neutropenia (45/45, 100%), pancreatic insufficiency (41/43, 95.3%), and/or bony abnormalities (29/36, 80.6%).
    explanation: >-
      NCI cohort frequency for neutropenia in molecularly characterised SDS.
- name: Impaired neutrophil chemotaxis
  category: Immunologic
  description: >-
    A functional neutrophil defect distinct from, and additional to, the low
    neutrophil count: SDS neutrophils show dysregulated chemotaxis traced to
    altered F-actin polymerization. It matters clinically because it means
    infection risk is not fully predicted by the absolute neutrophil count, and
    it is reproduced in the srp54 zebrafish model.
  phenotype_term:
    preferred_term: Impaired neutrophil chemotaxis
    term:
      id: HP:0040238
      label: Impaired neutrophil chemotaxis
  evidence:
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neutrophils isolated from SDS patients exhibit dysregulated chemotaxis due to altered F-actin polymerization capability.
    explanation: >-
      Patient-derived neutrophils establish the chemotaxis defect and its
      cytoskeletal basis.
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Attenuated chemotaxis in neutrophil was shown in a srp54 knockdown zebrafish model.
    explanation: >-
      Model-organism confirmation of the same functional defect in the SRP54
      form.
- name: Exocrine pancreatic insufficiency
  category: Gastrointestinal
  diagnostic: true
  description: >-

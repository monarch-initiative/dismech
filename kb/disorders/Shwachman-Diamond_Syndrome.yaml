classifications:
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 11 "Metaphyseal
      dysplasias". This entry covers three rows of that group, all named under
      the 2023 dyadic scheme after the metaphyseal phenotype rather than the
      eponym: NOS 11-0050 "Metaphyseal dysplasia with pancreatic insufficiency
      and cyclic neutropenia (Shwachman-Bodian-Diamond), SBDS-related"
      (MIM 260400), NOS 11-0070 "Metaphyseal dysplasia with pancreatic
      insufficiency and cyclic neutropenia, DNAJC21-related" (MIM 617052), and
      NOS 11-0080 "Shwachman-Diamond like syndrome, SRP54-related"
      (MIM 618752). The fourth SDS row of the group, NOS 11-0060
      (EFL1-related, MIM 617941), is tagged on the separate
      EFL1-related Shwachman-Diamond syndrome entry.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The SBDS-, DNAJC21- and EFL1-related forms are autosomal recessive, caused
    by biallelic pathogenic variants.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal recessive SDS: SDS caused by pathogenic variants in DNAJC21, EFL1, or SBDS is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the recessive mode for the three recessive SDS genes,
      including SBDS and DNAJC21 curated here.
  - reference: PMID:12496757
    reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Shwachman-Diamond syndrome (SDS; OMIM 260400) is an autosomal recessive disorder with clinical features that include pancreatic exocrine insufficiency, hematological dysfunction and skeletal abnormalities.
    explanation: >-
      The gene-discovery paper establishes recessive inheritance alongside the
      defining clinical triad.
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The SRP54-related form is autosomal dominant and usually arises de novo,
    which is why it is listed separately in the nosology as a
    Shwachman-Diamond-like syndrome.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant SDS: SDS caused by pathogenic variants in SRP54 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews separates the dominant SRP54 form from the recessive SDS
      genes.
  - reference: PMID:28972538
    reference_title: >-
      Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, autosomal dominant mutations in SRP54, a key member of the cotranslation protein-targeting pathway, lead to syndromic neutropenia with a Shwachman-Diamond-like phenotype.
    explanation: >-
      The discovery cohort establishes dominant inheritance for the SRP54 form.
has_subtypes:
- name: SBDS-related
  display_name: Shwachman-Diamond syndrome 1 (SBDS-related)
  subtype_term:
    preferred_term: Shwachman-Diamond syndrome 1
    term:
      id: MONDO:0044204
      label: Shwachman-Diamond syndrome 1
  description: >-
    Classic SDS, accounting for roughly 90% of cases. Most pathogenic alleles
    are generated by gene conversion with the 97%-identical SBDSP1 pseudogene,
    producing the recurrent c.258+2T>C splice and c.183_184TA>CT truncating
    changes. No individual has been found with two null alleles, implying that
    residual SBDS function is required for life.
  genes:
  - preferred_term: SBDS
    term:
      id: hgnc:19440
      label: SBDS
  evidence:
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 90% of patients have biallelic pathogenic variants in the SBDS gene located on human chromosome 7q11.
    explanation: >-
      Quantifies SBDS as the dominant molecular cause of the SDS spectrum.
  - reference: PMID:12496757
    reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found recurring mutations resulting from gene conversion in 89% of unrelated individuals with SDS (141 of 158), with 60% (95 of 158) carrying two converted alleles.
    explanation: >-
      Establishes pseudogene conversion as the mutational mechanism of the
      SBDS-related subtype.
- name: DNAJC21-related
  display_name: DNAJC21-related Shwachman-Diamond syndrome
  subtype_term:
    preferred_term: DNAJC21-related Shwachman Diamond syndrome
    term:
      id: MONDO:0700311
      label: DNAJC21-related Shwachman Diamond syndrome
  description: >-
    A recessive phenocopy in which the encoded co-chaperone acts on both early
    nuclear rRNA biogenesis and late cytoplasmic 60S maturation. The reported
    phenotype is a cancer-prone bone marrow failure syndrome that overlaps SDS
    and dyskeratosis congenita, with skin, teeth, hair and retinal findings that
    are unusual in SBDS-related disease.
  genes:
  - preferred_term: DNAJC21
    term:
      id: hgnc:27030
      label: DNAJC21
  evidence:
  - reference: PMID:27346687
    reference_title: >-
      DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through exome sequencing, we have now identified a subgroup of these individuals, defined by germline biallelic mutations in DNAJC21 (DNAJ homolog subfamily C member 21).
    explanation: >-
      Establishes biallelic DNAJC21 variants as a distinct cause of inherited
      bone marrow failure in this spectrum.
  - reference: PMID:29700810
    reference_title: Refining the phenotype associated with biallelic DNAJC21 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional features present in some individuals include retinal abnormalities, pancreatic insufficiency, liver cirrhosis, skeletal abnormalities, congenital hip dysplasia, joint hypermobility, and cryptorchidism.
    explanation: >-
      Documents the pancreatic and skeletal overlap with SDS that places this
      form in the same nosology group.
- name: SRP54-related
  display_name: SRP54-related Shwachman-Diamond-like syndrome
  description: >-
    A dominant, usually de novo phenocopy caused by missense variants in the
    SRP54 GTPase domain. Congenital neutropenia dominates the presentation and
    the pancreatic and skeletal features are variable, which is why the 2023
    nosology lists it as a Shwachman-Diamond-like syndrome rather than as SDS
    proper.
  genes:
  - preferred_term: SRP54
    term:
      id: hgnc:11301
      label: SRP54
  evidence:
  - reference: PMID:28972538
    reference_title: >-
      Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 3 independent patients, each of whom carried a de novo missense variant in srp54 (encoding signal recognition particle 54 kDa). These 3 patients shared congenital neutropenia linked with various other SDS phenotypes.
    explanation: >-
      Defines the SRP54 subtype and its de novo dominant, neutropenia-led
      presentation.

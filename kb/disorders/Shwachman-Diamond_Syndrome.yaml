name: Shwachman-Diamond syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Shwachman-Diamond syndrome (SDS) is an inherited bone marrow failure syndrome
  and ribosomopathy defined by the triad of exocrine pancreatic insufficiency,
  neutropenia with a predisposition to myelodysplastic syndrome and acute
  myeloid leukemia, and a metaphyseal skeletal dysplasia. Roughly 90% of cases
  carry biallelic SBDS variants, most of them arising by gene conversion with
  the adjacent SBDSP1 pseudogene. SBDS partners with the GTPase EFL1 to evict
  the anti-association factor eIF6 from the pre-60S ribosomal subunit, so its
  loss uncouples EFL1 GTP hydrolysis from eIF6 release, blocks 80S assembly and
  produces a global translation deficit that the pancreas, granulopoietic
  compartment and growth plate tolerate least well. Phenocopies arise from
  biallelic DNAJC21 (60S maturation) and EFL1 variants and from monoallelic
  SRP54 variants that impair co-translational protein targeting. The leukemia
  risk is not a direct consequence of the germline lesion alone: the ribosomal
  fitness constraint selects somatic hematopoietic clones, of which EIF6-mutant
  clones are compensatory and TP53-mutant clones are the maladaptive route to
  myeloid malignancy.

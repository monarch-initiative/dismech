    reference_title: "Shwachman-Diamond syndrome: clinical phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Elevated liver enzymes and hepatomegaly are present in the first years of life with subsequent improvement without complications.
    explanation: >-
      Supports both the finding and the transient course annotated here.
biochemical: []
genetic:
- name: SBDS
  association: Causal biallelic variant
  gene_term:
    preferred_term: SBDS
    term:
      id: hgnc:19440
      label: SBDS
  frequency: approximately 90% of patients
  notes: >-
    Most alleles arise by gene conversion with the SBDSP1 pseudogene, producing
    the recurrent c.258+2T>C and c.183_184TA>CT changes. Biallelic null
    genotypes are not observed, implying residual function is required for life.
  evidence:
  - reference: PMID:12496757
    reference_title: Mutations in SBDS are associated with Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report identification of disease-associated mutations in an uncharacterized gene, SBDS, in the interval of 1.9 cM at 7q11 previously shown to be associated with the disease.
    explanation: >-
      The original identification of SBDS as the SDS disease gene.
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 90% of patients have biallelic pathogenic variants in the SBDS gene located on human chromosome 7q11.
    explanation: >-
      Source for the case fraction recorded here.
  case_fractions:
  - population: National Cancer Institute IBMFS cohort
    case_fraction_percent: 68.1
    cohort_size: 47
    notes: >-
      Lower than the ~90% usually quoted because the NCI cohort deliberately
      enrols SDS-like as well as molecularly confirmed SDS participants.
    evidence:
    - reference: PMID:35322185
      reference_title: >-
        Shwachman Diamond syndrome: narrow genotypic spectrum and variable clinical features.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PVs in SBDS were present in 32/47 (68.1%) participants.
      explanation: >-
        Direct cohort figure for the SBDS share of participants.
- name: DNAJC21
  association: Causal biallelic variant
  gene_term:
    preferred_term: DNAJC21
    term:
      id: hgnc:27030
      label: DNAJC21
  notes: >-
    Biallelic variants cause a cancer-prone bone marrow failure syndrome through
    corruption of nuclear rRNA biogenesis and late cytoplasmic 60S maturation.
  evidence:
  - reference: PMID:27346687
    reference_title: >-
      DNAJC21 Mutations Link a Cancer-Prone Bone Marrow Failure Syndrome to Corruption in 60S Ribosome Subunit Maturation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, these findings demonstrate that mutations in DNAJC21 cause a cancer-prone BMF syndrome due to corruption of early nuclear rRNA biogenesis and late cytoplasmic maturation of the 60S subunit.
    explanation: >-
      Establishes causality and the molecular mechanism for this gene.
- name: SRP54
  association: Causal monoallelic variant
  gene_term:
    preferred_term: SRP54
    term:
      id: hgnc:11301
      label: SRP54
  notes: >-
    Heterozygous, usually de novo, missense variants in the GTPase domain.
    Reported alongside SBDS and DNAJC21 as an SDS gene associated with myeloid
    neoplasia.
  evidence:
  - reference: PMID:28972538
    reference_title: >-
      Mutations in signal recognition particle SRP54 cause syndromic neutropenia with Shwachman-Diamond-like features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, autosomal dominant mutations in SRP54, a key member of the cotranslation protein-targeting pathway, lead to syndromic neutropenia with a Shwachman-Diamond-like phenotype.
    explanation: >-
      Establishes SRP54 as a dominant cause within the SDS spectrum.
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, SBDS, DNAJC21, and SRP54 variants have been associated with myeloid neoplasia.
    explanation: >-
      Records that the SRP54 form shares the myeloid-neoplasia risk.
- name: EFL1
  association: Causal biallelic variant
  gene_term:
    preferred_term: EFL1
    term:
      id: hgnc:25789
      label: EFL1
  notes: >-
    The fourth SDS gene, curated in full in the separate
    EFL1-related Shwachman-Diamond syndrome entry; listed here so the genetic
    spectrum of the disease is complete.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal recessive SDS: SDS caused by pathogenic variants in DNAJC21, EFL1, or SBDS is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews lists EFL1 among the recessive SDS genes.
- name: TP53
  association: Somatic driver of malignant progression
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  notes: >-
    Not a germline cause. Somatic TP53 mutation is the maladaptive clonal
    pathway in the SDS marrow, and biallelic TP53 loss accompanies progression
    to leukemia.
  evidence:
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent development of leukemia was associated with acquisition of biallelic TP53 alterations.
    explanation: >-
      Links somatic biallelic TP53 loss to leukemic progression in SDS.
- name: EIF6
  association: Somatic compensatory modifier
  gene_term:
    preferred_term: EIF6
    term:
      id: hgnc:6159
      label: EIF6
  notes: >-
    Somatic EIF6 inactivation partially corrects the germline ribosome defect
    and expands clones with limited leukemic potential; the mechanistic mirror
    image of the TP53 pathway and a candidate therapeutic target.
  evidence:
  - reference: PMID:33637765
    reference_title: >-
      Distinct genetic pathways define pre-malignant versus compensatory clonal hematopoiesis in Shwachman-Diamond syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EIF6 inactivation mediates a compensatory pathway with limited leukemic potential by ameliorating the underlying SDS ribosome defect and enhancing clone fitness.
    explanation: >-
      Establishes somatic EIF6 loss as a compensatory rather than pre-malignant
      event.

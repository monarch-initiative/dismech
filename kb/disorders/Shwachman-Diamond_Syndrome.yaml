diagnosis:
- name: Clinical recognition of pancreatic plus marrow dysfunction
  description: >-
    SDS is established clinically by exocrine pancreatic dysfunction together
    with bone marrow dysfunction, and/or by molecular confirmation in one of the
    four genes.
  presence: >-
    Exocrine pancreatic dysfunction with bone marrow dysfunction establishes the
    clinical diagnosis.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SDS is established in a proband with the classic clinical findings of exocrine pancreatic dysfunction and bone marrow dysfunction and/or biallelic pathogenic variants in DNAJC21, EFL1, or SBDS or a heterozygous pathogenic variant in SRP54 identified by molecular genetic testing.
    explanation: >-
      GeneReviews diagnostic criteria statement.
- name: Molecular genetic testing of the four SDS genes
  description: >-
    Sequencing of SBDS, DNAJC21, EFL1 and SRP54. SBDS analysis must account for
    the 97%-identical SBDSP1 pseudogene, since the common alleles are
    pseudogene-derived and are easily missed or miscalled by methods that do not
    discriminate the two loci.
  results: >-
    Biallelic SBDS, DNAJC21 or EFL1 variants, or a heterozygous SRP54 variant,
    confirm the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of SDS is established in a proband with the classic clinical findings of exocrine pancreatic dysfunction and bone marrow dysfunction and/or biallelic pathogenic variants in DNAJC21, EFL1, or SBDS or a heterozygous pathogenic variant in SRP54 identified by molecular genetic testing.
    explanation: >-
      Names the four genes whose testing establishes the molecular diagnosis.
  - reference: PMID:37226705
    reference_title: >-
      Shwachman-Diamond syndromes: clinical, genetic, and biochemical insights from the rare variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complicating the sequence analysis is the presence of a pseudogene, SBDSP1 with 97% homology to SBDS.
    explanation: >-
      Source for the pseudogene caveat that governs how SBDS must be sequenced.
- name: Complete blood count with differential
  description: >-
    Serial CBC with differential and platelet count detects the neutropenia and
    tracks evolving multilineage cytopenias.
  results: >-
    Persistent or intermittent neutropenia, with or without anaemia and
    thrombocytopenia.
  diagnosis_term:
    preferred_term: blood cell count
    term:
      id: NCIT:C28133
      label: Blood Cell Count
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Complete blood count with white blood cell differential and platelet count at least every three to six months; bone marrow examination every one to three years or more frequently if bone marrow changes are observed.
    explanation: >-
      Supports serial CBC as the core haematological monitoring test.
- name: Bone marrow aspiration and biopsy
  description: >-
    Marrow examination at diagnosis and on surveillance detects hypocellularity
    and, critically, the emergence of dysplasia or a clonal cytogenetic
    abnormality.
  results: >-
    Hypocellular marrow; dysplastic change or clonal cytogenetic abnormalities
    signal progression.
  diagnosis_term:
    preferred_term: bone marrow aspiration and biopsy
    term:
      id: NCIT:C92958
      label: Bone Marrow Aspiration and Biopsy
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      bone marrow examination every one to three years or more frequently if bone marrow changes are observed
    explanation: >-
      Surveillance schedule for marrow examination in SDS.
- name: Skeletal radiography
  description: >-
    Radiographs of the long bones, hips and knees show the metaphyseal widening
    and irregularity, delayed secondary ossification centres and osteopenia that
    define the skeletal phenotype. Abnormalities were present in all patients in
    a molecularly confirmed series.
  results: >-
    Metaphyseal widening and irregularity, delayed secondary ossification
    centres, generalised osteopenia, short ribs with broadened anterior ends.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:14984468
    reference_title: >-
      Skeletal phenotype in patients with Shwachman-Diamond syndrome and mutations in SBDS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of their skeletal radiographs showed abnormalities in all patients.
    explanation: >-
      Establishes the sensitivity of skeletal radiography in molecularly
      confirmed SDS.
differential_diagnoses:
- name: Cartilage-hair hypoplasia
  description: >-
    The other immuno-osseous metaphyseal dysplasia of nosology group 11. Both
    present with metaphyseal dysplasia, short stature and haematological
    abnormality, but CHH is an RNase MRP ribonucleoprotein defect with
    hypotrichosis and lymphocyte-predominant immunodeficiency, whereas SDS has
    exocrine pancreatic insufficiency and neutrophil-predominant disease.
  disease_term:
    preferred_term: cartilage-hair hypoplasia
    term:
      id: MONDO:0009595
      label: cartilage-hair hypoplasia
  distinguishing_features:
  - Hypotrichosis with fine, sparse, light-coloured hair
  - Biallelic RMRP variants rather than a ribosome-maturation gene
  - Exocrine pancreatic insufficiency is absent
- name: Cystic fibrosis
  description: >-
    The commonest cause of childhood exocrine pancreatic insufficiency and
    failure to thrive, and a frequent alternative diagnosis considered before
    SDS is recognised.
  disease_term:
    preferred_term: cystic fibrosis
    term:
      id: MONDO:0009061
      label: cystic fibrosis
  distinguishing_features:
  - Elevated sweat chloride and biallelic CFTR variants
  - Progressive sinopulmonary disease rather than neutropenia
  - No metaphyseal dysplasia
  evidence:
  - reference: PMID:35322185
    reference_title: >-
      Shwachman Diamond syndrome: narrow genotypic spectrum and variable clinical features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with SDS are frequently evaluated for cystic fibrosis, celiac disease, Crohn's disease, and other diseases prior to suspicion of SDS because the clinical presentation can vary widely and it is over underrecognized.
    explanation: >-
      Documents cystic fibrosis as a routine alternative diagnosis on the SDS
      diagnostic pathway.

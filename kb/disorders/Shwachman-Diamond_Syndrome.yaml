treatments:
- name: Pancreatic enzyme replacement and fat-soluble vitamin supplementation
  description: >-
    Oral pancreatic enzymes with fat-soluble vitamin supplementation are the
    standard treatment for the exocrine pancreatic component.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: pancreatic enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  target_phenotypes:
  - preferred_term: Exocrine pancreatic insufficiency
    term:
      id: HP:0001738
      label: Exocrine pancreatic insufficiency
  target_mechanisms:
  - target: Exocrine Pancreatic Acinar Failure
    treatment_effect: BYPASSES
    description: >-
      Replaces the enzymatic output the failing acinar tissue cannot provide;
      it does not correct the underlying ribosomal defect.
    evidence:
    - reference: PMID:20301722
      reference_title: Shwachman-Diamond Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Exocrine pancreatic insufficiency is treated with oral pancreatic enzymes and fat-soluble vitamin supplementation.
      explanation: >-
        GeneReviews names enzyme replacement as the treatment aimed at this
        mechanism.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Exocrine pancreatic insufficiency is treated with oral pancreatic enzymes and fat-soluble vitamin supplementation.
    explanation: >-
      Standard-of-care statement for the pancreatic component.
- name: Granulocyte colony-stimulating factor
  description: >-
    G-CSF is considered for severe recurrent infection with an absolute
    neutrophil count persistently at or below 500/mm3, and is particularly
    useful as cover for dental or orthopaedic procedures. Prolonged use is
    approached with caution given the underlying leukemia predisposition.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: recombinant granulocyte colony-stimulating factor
      term:
        id: NCIT:C1287
        label: Recombinant Granulocyte Colony-Stimulating Factor
  target_phenotypes:
  - preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  target_mechanisms:
  - target: Bone Marrow Failure with Granulopoietic Predominance
    treatment_effect: ACTIVATES
    description: >-
      Drives residual granulopoiesis to raise the neutrophil count without
      addressing the ribosome defect that constrains it.
    evidence:
    - reference: PMID:20301722
      reference_title: Shwachman-Diamond Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        If recurrent infections are severe and absolute neutrophil counts are persistently ≤500/mm3, treatment with granulocyte-colony stimulation factor (G-CSF) can be considered and may be especially helpful when interventions such as complex dental procedures or orthopedic surgery are being considered.
      explanation: >-
        GeneReviews indication statement for G-CSF in SDS.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prolonged use of cytokine and hematopoietic growth factors (e.g., G-CSF) should be considered with caution.
    explanation: >-
      Records the caution that qualifies this treatment in a
      leukemia-predisposition syndrome.
- name: Hematopoietic stem cell transplantation
  description: >-
    HSCT is the only curative option for the haematological disease and is
    considered for severe marrow failure, MDS or AML. Conditioning is modified
    because standard agents such as cyclophosphamide and busulfan carry a risk
    of cardiac toxicity in SDS.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_phenotypes:
  - preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  target_mechanisms:
  - target: Bone Marrow Failure with Granulopoietic Predominance
    treatment_effect: RESTORES
    description: >-
      Replaces the SBDS-deficient haematopoietic compartment with donor cells,
      correcting the marrow arm of the disease while leaving the pancreatic and
      skeletal arms untouched.
    evidence:
    - reference: PMID:20301722
      reference_title: Shwachman-Diamond Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Hematopoietic stem cell transplantation (HSCT) should be considered for treatment of severe bone marrow failure, MDS, or AML.
      explanation: >-
        Standard-of-care statement for transplantation in SDS marrow disease.
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some drugs used in standard HSCT preparative regimens (e.g., cyclophosphamide and busulfan) may not be suitable because of possible cardiac toxicity.
    explanation: >-
      Documents the SDS-specific conditioning caveat.
- name: Blood and platelet transfusion
  description: >-
    Transfusion support is used for symptomatic anaemia and thrombocytopenia
    arising from marrow failure.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_phenotypes:
  - preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  evidence:
  - reference: PMID:20301722
    reference_title: Shwachman-Diamond Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blood and/or platelet transfusions may be considered for anemia and thrombocytopenia.
    explanation: >-
      GeneReviews management statement for the cytopenias.
- name: Orthopaedic and pulmonary management of the skeletal dysplasia
  description: >-
    Early orthopaedic and pulmonary referral is required for thoracic dystrophy;
    skeletal dysplasia, asymmetric growth and joint deformities need ongoing
    orthopaedic management, with hip and knee radiographs during rapid growth.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Metaphyseal dysplasia
    term:
      id: HP:0100255
      label: Metaphyseal dysplasia
  target_mechanisms:
  - target: Metaphyseal Dysplasia
    treatment_effect: MODULATES
    description: >-
      Manages the mechanical consequences of disordered metaphyseal growth
      rather than the growth-plate lesion itself.
    evidence:
    - reference: PMID:20301722
      reference_title: Shwachman-Diamond Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Early pulmonary and orthopedic referral is essential for treatment of thoracic dystrophy; orthopedic management of other skeletal manifestations including skeletal dysplasia, asymmetric growth, and joint deformities.
      explanation: >-
        GeneReviews management statement for the skeletal manifestations.
  evidence:
  - reference: PMID:20301722

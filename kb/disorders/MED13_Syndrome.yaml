review_notes: >-
  Extended from an Anthropic-generated systematic-review pipeline output for MED13 that was
  held out from this repository during its own generation. Every claim was re-derived
  against PubMed abstracts under the dismech evidence policy: the pipeline's snippets were
  verbatim spans of its own review text rather than of source abstracts, so none were
  reused directly. Claims whose only support was a pipeline snippet absent from the cited
  abstract were dropped rather than reworded — this removed the quantitative per-phenotype
  cohort fractions (speech apraxia 3/13, hypotonia 3/13, Duane anomaly 2/13, eye/vision
  8/13, gross motor delay 7/13, constipation 4/13, and the 2025-aggregate percentages),
  all of which appear only in the per-patient tables or body text of PMID:29740699 and
  PMID:41195223. The gnomAD constraint figures (pLI 1.00, LOEUF 0.145) and the de novo
  enrichment statistic (7/30,884, p=0.00371) were likewise not carried over: gnomAD is not a
  snippet-validated reference source in this repository, and the enrichment sentence is not
  in the abstract. The ClinGen assertion the pipeline cited was independently verified
  against the ClinGen gene_validity CSV before use and matches exactly. Four sources cited
  by the pipeline have no PubMed record and were not usable: DOI 10.1101/2022.03.30.486486,
  10.21508/1027-4065-2022-67-1-101-107, 10.4172/jpb.s2-004, and 10.64898/2026.06.01.729270.

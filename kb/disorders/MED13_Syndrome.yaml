inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    Autosomal dominant, with variants predominantly arising de novo. Two departures from
    a simple dominant model matter for counselling. First, penetrance is incomplete: a
    pathogenic MED13 variant has been documented in an affected proband inherited from an
    asymptomatic parent, in whom the variant had itself arisen de novo. Second, vertical
    transmission from an affected parent is documented in at least two families. A
    variant should therefore not be dismissed because a parent carries it and is
    unaffected, and parental testing is warranted even when the phenotype looks sporadic.
  evidence:
  - reference: PMID:38453051
    reference_title: "Penetrance, variable expressivity and monogenic neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients carried different variants (1 splice-site variant, 4 nonsense and 7
      frameshift) in 11 genes: CAMTA1, MBD5, KMT2C, KMT2E, ZMIZ1, MN1, NDUFB11, CUL3,
      MED13, ARID2 and RERE.
    explanation: >-
      MED13 appears in a systematically assembled series of neurodevelopmental-disorder
      genes with a pathogenic variant inherited from an asymptomatic parent.
  - reference: PMID:38453051
    reference_title: "Penetrance, variable expressivity and monogenic neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incomplete penetrance for SNV and MNV in neurodevelopmental disorders might be more
      frequent than previously thought. This point is crucial to consider for
      interpretation of variants, family investigation, genetic counseling, and prenatal
      diagnosis.
    explanation: >-
      States the counselling implication of incomplete penetrance for genes such as MED13
      that are usually treated as fully penetrant de novo disorders.
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a GeneMatcher collaboration which led to a cohort of 13 affected
      individuals harboring protein-altering variants, 11 of which are de novo, in MED13;
      the only inherited variant was transmitted to an affected child from an affected
      mother.
    explanation: Establishes de novo predominance with documented vertical transmission.
diagnosis:
- name: Clinical whole-exome or genome sequencing
  description: >
    Every reported MED13 diagnosis has been made by exome or genome sequencing. There is
    no MED13-specific clinical gestalt reliable enough to prompt single-gene testing —
    one proband carried a clinical diagnosis of Kabuki syndrome — so sequencing is the
    only practical route. Trio testing establishes de novo status, which carries
    substantial pathogenicity weight for this gene.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Heterozygous pathogenic or likely pathogenic MED13 variant
  markers: MED13
  evidence:
  - reference: PMID:34211152
    reference_title: "Exome and genome sequencing for pediatric patients with congenital anomalies or intellectual disability: an evidence-based clinical guideline of the American College of Medical Genetics and Genomics (ACMG)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We strongly recommend that ES/GS be considered as a first- or second-tier test for
      patients with CA/DD/ID.
    explanation: >-
      Places exome/genome sequencing in the recommended pathway for the presentation MED13
      patients arrive with.
  - reference: PMID:41561257
    reference_title: "Intellectual Developmental Disorder of Autosomal Dominant 61 Caused by a MED13 Variant Presenting With Congenital Unilateral Sensorineural Hearing Loss: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      underscoring the importance of exome sequencing in patients with neurodevelopmental
      disorders and congenital anomalies
    explanation: Case-level confirmation of the diagnostic route.
- name: Chromosomal microarray analysis
  description: >
    Chromosomal microarray remains first-tier for unexplained developmental delay and
    detects the 17q23.2 deletions encompassing MED13 that account for a small subset of
    cases. It is normal in the great majority of MED13 patients, so a normal microarray
    does not exclude the diagnosis and should prompt sequencing.
  diagnosis_term:
    preferred_term: chromosomal microarray testing
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  results: Normal in most; detects 17q23.2 deletions encompassing MED13 in the CNV subset
  markers: 17q23.2
  evidence:
  - reference: PMID:20466091
    reference_title: "Consensus statement: chromosomal microarray is a first-tier clinical diagnostic test for individuals with developmental disabilities or congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Available evidence strongly supports the use of CMA in place of G-banded karyotyping
      as the first-tier cytogenetic diagnostic test for patients with DD/ID, ASD, or MCA.
    explanation: Establishes microarray's first-tier position in the diagnostic pathway.
  - reference: PMID:22162340
    reference_title: "An 800  kb deletion at 17q23.2 including the MED13 (THRAP1) gene, revealed by aCGH in a patient with a SMC 17p."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Array comparative genome hybridization (aCGH) was used to determine the gene content
      and proximal and distal breakpoints of the small supernumerary marker chromosome
      (SMC).
    explanation: Demonstrates the array-based route by which a MED13 deletion is found.
- name: ACMG/AMP variant interpretation
  description: >
    Reported de novo MED13 truncating alleles have been classified pathogenic under the
    ACMG/AMP framework by combining PVS1 (null variant in a gene where loss of function is
    the disease mechanism) with PS2 (confirmed de novo). Because ClinGen's PVS1 refinement
    conditions the strength of that criterion on gene-disease validity, MED13's Definitive
    ClinGen classification is what licenses full-strength PVS1 here.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: >-
    PVS1 + PS2 for de novo truncating alleles; missense alleles largely remain of uncertain
    significance absent functional data
  evidence:
  - reference: PMID:25741868
    reference_title: "Standards and guidelines for the interpretation of sequence variants: a joint consensus recommendation of the American College of Medical Genetics and Genomics and the Association for Molecular Pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report recommends the use of specific standard terminology-"pathogenic,"
      "likely pathogenic," "uncertain significance," "likely benign," and "benign"-to
      describe variants identified in genes that cause Mendelian disorders.
    explanation: The classification framework applied to MED13 variants.
  - reference: PMID:30192042
    reference_title: "Recommendations for interpreting the loss of function PVS1 ACMG/AMP variant criterion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, this guideline did not take into account the relative strengths for each
      evidence type and the final outcome of their combinations with respect to PVS1
      strength.
    explanation: >-
      The ClinGen SVI refinement that makes PVS1 strength contingent on gene-disease
      validity, which is why the Definitive ClinGen classification for MED13 matters
      practically.
differential_diagnoses:
- name: MED13L syndrome
  description: >-
    The paralogous CKM-hinge disorder and the closest differential. MED13 and MED13L
    occupy the same structural position in the kinase module and produce overlapping
    intellectual disability with prominent speech impairment.
  distinguishing_features:
  - MED13L has a recognisable facial gestalt (bulbous nasal tip, depressed nasal bridge, hypotonic open mouth) and roughly four times as many reported cases.
  - MED13 carries ophthalmologic features not reported in MED13L, notably Duane anomaly and retinal atrophy.
  - Resolved definitively by which gene carries the variant; the two are not clinically separable with confidence.
  disease_term:
    preferred_term: MED13L syndrome
    term:
      id: MONDO:0014773
      label: cardiac anomalies - developmental delay - facial dysmorphism syndrome
  evidence:
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in several other genes encoding subunits of Mediator have been previously
      shown to associate with DD/ID, including MED13L, a paralog of MED13.
    explanation: >-
      Establishes MED13L as the paralogous disease gene, the basis for the
      differential-diagnosis relationship.
- name: MED12-related intellectual disability syndrome
  description: >-
    The X-linked member of the CDK8 kinase module allelic series (FG/Opitz-Kaveggia,
    Lujan-Fryns, Ohdo-Maat-Kievit-Brunner), overlapping MED13 syndrome in intellectual
    disability and hypotonia.
  distinguishing_features:
  - X-linked inheritance with predominantly affected males, versus autosomal dominant de novo events in MED13.
  - MED12 activates CDK8 kinase activity whereas MED13 anchors the module, so the molecular lesions are non-equivalent.
  disease_term:
    preferred_term: MED12-related intellectual disability syndrome
    term:
      id: MONDO:0100000
      label: MED12-related intellectual disability syndrome
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in MED12, MED13, and MED13L were previously identified in syndromic
      developmental disorders with overlapping phenotypes.
    explanation: >-
      States the phenotypic overlap across the kinase-module disorders that makes them
      mutual differentials.
- name: CDK8-related syndromic developmental disorder
  description: >-
    De novo missense substitutions in CDK8, the kinase subunit of the same module,
    produce hypotonia, mild-to-moderate intellectual disability, behavioural disorders
    and variable facial dysmorphism, with congenital heart disease, corpus callosum
    agenesis, seizures and sensory impairments in subsets — a phenotype the authors
    themselves describe as similar to the other kinase-module disorders.
  distinguishing_features:
  - CDK8 variants localise to the ATP-binding pocket of the kinase domain and act by reducing kinase activity; MED13 loss is an anchoring defect with intact kinase function.
  - Ano-rectal malformations are reported in multiple CDK8 individuals and are not a MED13 feature.
  disease_term:
    preferred_term: Intellectual developmental disorder with hypotonia and behavioral abnormalities
    term:
      id: MONDO:0032897
      label: intellectual developmental disorder with hypotonia and behavioral abnormalities
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have overlapping phenotypes characterized by hypotonia, mild to
      moderate intellectual disability, behavioral disorders, and variable facial
      dysmorphism.
    explanation: Defines the overlapping CDK8 phenotype.
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that missense mutations in CDK8 cause a developmental disorder that has
      phenotypic similarity to syndromes associated with mutations in other subunits of the
      Mediator kinase module, indicating probable overlap in pathogenic mechanisms.
    explanation: >-
      The authors' own statement that the kinase-module disorders overlap phenotypically and
      mechanistically.
- name: CDK19-related developmental and epileptic encephalopathy
  description: >-
    De novo CDK19 variants (the CDK8 paralog in the same module) produce hypotonia, global
    developmental delay, epileptic encephalopathy and dysmorphic features — the closest
    match to the severe epileptic tail of the MED13 phenotype.
  distinguishing_features:
  - Epileptic encephalopathy is a core CDK19 feature, whereas in MED13 it is a rare severe-tail presentation.
  disease_term:
    preferred_term: Developmental and epileptic encephalopathy, 87
    term:
      id: MONDO:0030059
      label: developmental and epileptic encephalopathy, 87
  evidence:
  - reference: PMID:32330417
    reference_title: "De Novo Variants in CDK19 Are Associated with a Syndrome Involving Intellectual Disability and Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These individuals presented with hypotonia, global developmental delay, epileptic
      encephalopathy, and dysmorphic features.
    explanation: Defines the CDK19 phenotype overlapping the MED13 severe tail.
- name: MED12L-related intellectual disability (Nizon-Isidor syndrome)
  description: >-
    Haploinsufficiency of MED12L, the fourth kinase-module paralog gene, causes
    intellectual disability and/or developmental delay with speech impairment, autism
    spectrum disorder and corpus callosum abnormality — overlapping MED13 syndrome closely.
  distinguishing_features:
  - Corpus callosum abnormality is a prominent and recurrent MED12L feature.
  disease_term:
    preferred_term: Nizon-Isidor syndrome
    term:
      id: MONDO:0030030
      label: Nizon-Isidor syndrome
  evidence:
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All affected individuals presented with intellectual disability and/or developmental
      delay, including speech impairment. Other features included autism spectrum disorder,
      aggressive behavior, corpus callosum abnormality, and mild facial morphological
      features.
    explanation: Defines the overlapping MED12L phenotype.
  - reference: PMID:31155615
    reference_title: "Variants in MED12L, encoding a subunit of the mediator kinase module, are responsible for intellectual disability associated with transcriptional defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other subunits of the kinase module have been already implicated in intellectual
      disability, namely MED12, MED13L, MED13, and CDK19.
    explanation: >-
      Names MED13 explicitly among the kinase-module intellectual disability genes,
      establishing the family of mutual differentials.
- name: Kabuki syndrome
  description: >-
    A MED13 proband carried a clinical diagnosis of Kabuki syndrome with negative KMT2D and
    KDM6A testing before exome sequencing found a de novo MED13 p.Pro327Ser variant. MED13
    therefore belongs in the differential for sequencing-negative Kabuki-like presentations.
  distinguishing_features:
  - Kabuki syndrome is resolved by identifying a KMT2D or KDM6A variant; MED13 should be considered when those are negative.
  disease_term:
    preferred_term: Kabuki syndrome
    term:
      id: MONDO:0016512
      label: Kabuki syndrome
  evidence:
  - reference: PMID:33258286
    reference_title: "Could the MED13 mutations manifest as a Kabuki-like syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 13-year-old girl who received a previous clinical diagnosis of
      Kabuki syndrome (KS) without mutations in classic KS genes.
    explanation: >-
      Documents the Kabuki-like presentation resolved as MED13, the basis for this
      differential.
  - reference: PMID:33258286
    reference_title: "Could the MED13 mutations manifest as a Kabuki-like syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this report is to improve clinical delineation of MED13-related condition
      and to explore differences and similarities between KS spectrum and MED13-related
      disorders.
    explanation: Frames the two conditions as an explicit differential-diagnosis pair.
animal_models:
- species: Mus musculus
  genotype: In utero shRNA knockdown of Med13 in embryonic neocortex
  description: >-
    In utero electroporation knockdown of Med13 in developing mouse cortical neurons
    impairs radial migration, contralateral (callosal) axonal projection and dendritic
    complexity. Proteomics in MED13-deleted human neuroblastoma cells identified PLXNA4 as
    a dysregulated downstream effector, and PlxnA4 overexpression rescues the migration and
    callosal projection defects but not the dendritic phenotype — separating the pathway
    into a PlxnA4-dependent and a PlxnA4-independent arm.
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  associated_phenotypes:
  - Impaired radial neuronal migration
  - Impaired callosal projection
  - Reduced dendritic complexity
  evidence:
  - reference: PMID:41663567
    reference_title: "Med13 is involved in the radial migration and contralateral projection of cortical neurons via PlxnA4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that silencing Med13 in cortical neurons impaired its radial migration and
      contralateral projection as well as dendritic complexity in mice.
    explanation: Establishes the cortical neuronal phenotype of Med13 knockdown.
  - reference: PMID:41663567
    reference_title: "Med13 is involved in the radial migration and contralateral projection of cortical neurons via PlxnA4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, the impaired radial migration and callosal projection, but not dendritic
      complexity, were largely restored by overexpression of PlxnA4 in Med13 knock-down
      neurons.
    explanation: >-
      Identifies PlxnA4 as the effector for the migration/projection arm and shows the
      dendritic arm is mechanistically separate.
- species: Mus musculus
  genotype: Inducible cardiomyocyte-specific Med13 and Med13l double knockout
  description: >-
    Tamoxifen-inducible combined deletion of Med13 and Med13l in adult cardiomyocytes
    causes lethal heart failure with a median survival of six weeks, with dysregulation of
    fibrotic and calcium-handling pathways shared across Mediator cardiac knockouts. Single
    deletion of either paralog is tolerated, which is the direct demonstration of paralog
    redundancy.
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  - preferred_term: MED13L
    term:
      id: hgnc:22962
      label: MED13L
  associated_phenotypes:
  - Lethal heart failure
  evidence:
  - reference: PMID:40989238
    reference_title: "Med13 and Med13L: Critical redundant players in basal cardiac function and gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Med13/13L knockout resulted in decreased cardiac function leading to lethal heart
      failure in a median timeframe of 6 weeks from the start of tamoxifen.
    explanation: Quantifies the combined-knockout cardiac phenotype.
- species: Mus musculus
  genotype: Cardiac-specific Med13 transgenic overexpression and cardiomyocyte deletion (miR-208a axis)
  description: >-
    Gain- and loss-of-function models of cardiac MED13 dosage. Overexpression, or
    pharmacologic inhibition of the MED13-targeting microRNA miR-208a, confers resistance
    to diet-induced obesity; cardiomyocyte-specific deletion enhances obesity and worsens
    metabolic syndrome. This defines the systemic metabolic arm of MED13 biology.
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  associated_phenotypes:
  - Altered systemic energy expenditure
  evidence:
  - reference: PMID:22541436
    reference_title: "A cardiac microRNA governs systemic energy homeostasis by regulation of MED13."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that the heart regulates systemic energy homeostasis via MED13, a subunit of
      the Mediator complex, which controls transcription by thyroid hormone and other
      nuclear hormone receptors.
    explanation: Defines the cardiac MED13 to systemic-metabolism axis.
  - reference: PMID:22541436
    reference_title: "A cardiac microRNA governs systemic energy homeostasis by regulation of MED13."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, genetic deletion of MED13 specifically in cardiomyocytes enhances obesity
      in response to high-fat diet and exacerbates metabolic syndrome.
    explanation: The loss-of-function direction relevant to MED13 haploinsufficiency.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Approximately 26 cases have been reported worldwide as of 2025, placing MED13
    syndrome firmly in the ultra-rare category. No population-based prevalence
    estimate is yet available.
  evidence:
  - reference: PMID:41195223
    reference_title: "A novel frameshift variant in the MED13 gene causing intellectual developmental disorder-61 in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only 26 cases of MRD61 have been reported worldwide."
    explanation: >-
      Confirms the ultra-rare status of MED13 syndrome with fewer than 30 cases described
      globally as of 2025.
mechanistic_hypotheses:
- hypothesis_group_id: med13_haploinsufficiency
  hypothesis_label: MED13 haploinsufficiency as the mechanism for truncating alleles
  status: CANONICAL
  description: >
    Heterozygous truncating MED13 variants and whole-gene 17q23.2 deletions reduce the
    pool of CDK8 kinase module available to dock on core Mediator. Supported by the
    predominance of de novo truncating alleles in the founding cohort, by an independent
    whole-gene deletion phenocopy, and by the explicit haploinsufficiency conclusion
    drawn from a functionally characterised frameshift case.
  applies_to_subtypes:
  - Truncating (nonsense / frameshift / whole-gene deletion)
  evidence:
  - reference: PMID:41561257
    reference_title: "Intellectual Developmental Disorder of Autosomal Dominant 61 Caused by a MED13 Variant Presenting With Congenital Unilateral Sensorineural Hearing Loss: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case is also consistent with haploinsufficiency as the disease mechanism for
      truncating MED13 variants in MRD61, underscoring the importance of exome sequencing
      in patients with neurodevelopmental disorders and congenital anomalies.
    explanation: States the haploinsufficiency conclusion for truncating alleles directly.
  - reference: PMID:22162340
    reference_title: "An 800  kb deletion at 17q23.2 including the MED13 (THRAP1) gene, revealed by aCGH in a patient with a SMC 17p."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we suggest that MED13 haploinsufficiency was responsible for the phenotype of the
      patient particularly the cataract, hearing loss and semicircular canal dysplasia
    explanation: >-
      Independent whole-gene dosage-loss support: a 17q23.2 microdeletion encompassing
      MED13 reproduces a MED13-attributable phenotype.
- hypothesis_group_id: med13_missense_altered_function
  hypothesis_label: Clustered missense variants act by altered function rather than simple dosage loss
  status: EMERGING
  description: >
    Pathogenic MED13 missense variants cluster in two small regions — an N-terminal
    region containing the Thr326/Pro327 SCF-Fbw7 phosphodegron and a C-terminal region —
    plus a central pair of residues around 834/835. The clustering itself argues against
    simple loss of function, which would tolerate variants anywhere. Clinically, the most
    severe reported presentations (developmental and epileptic encephalopathy, neonatal
    multi-organ disease with mitochondrial pathology) have so far occurred with missense
    rather than truncating alleles. Degron-region variants are predicted to stabilise
    MED13 against Fbw7-mediated turnover, which would raise rather than lower CKM
    occupancy. This is structured inference from position and phenotype; no functional
    assay has yet demonstrated altered function for any MED13 missense allele.
  applies_to_subtypes:
  - Missense (N-terminal degron, central 834/835, C-terminal clusters)
  evidence:
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Out of the seven non-truncating mutations, six clustered in two specific locations
      of the MED13 protein: an N-terminal and C-terminal region.
    explanation: >-
      Establishes the positional clustering that is the primary argument for a
      non-loss-of-function missense mechanism.
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The four N-terminal clustering mutations affect two adjacent amino acids that are
      known to be involved in MED13 ubiquitination and degradation, p.Thr326 and
      p.Pro327.
    explanation: >-
      Localises the N-terminal cluster to the degradation signal, the basis for the
      protein-stabilisation prediction.
  - reference: PMID:41130977
    reference_title: "Mitochondrial dysfunction in MED13 variant-associated disease: a case of infantile spasms, cardiomyopathy and hepatomegaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first case report linking a MED13 variant to systemic mitochondrial
      dysfunction, suggesting a novel pathogenic mechanism.
    explanation: >-
      A central-region missense allele produced a severe multi-organ phenotype the
      authors themselves flag as mechanistically novel.
  - reference: CGGV:assertion_e82f63b1-ed0f-4dd0-8168-3aa4e0a4c2a9-2022-05-17T100000.000Z
    reference_title: "ClinGen Gene-Disease Validity: MED13 - complex neurodevelopmental disorder"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is loss of function."
    explanation: >-
      The ClinGen Intellectual Disability and Autism Gene Curation Expert Panel, curating
      across nonsense, frameshift, missense and in-frame indel alleles, concluded the
      mechanism is loss of function — the authoritative counterweight to an
      altered-function reading of the missense cluster.
  notes: >-
    Kept as EMERGING rather than CANONICAL, and explicitly contested. The clustering and
    severity signals are real, but no functional data distinguish altered function from a
    severe hypomorph, ClinGen's expert-panel curation across the full allelic series
    concluded loss of function, and the same p.Pro835Ser allele has been reported with
    quite different clinical courses.
- hypothesis_group_id: med13_fbw7_degron_stabilisation
  hypothesis_label: Fbw7-degron stabilisation as a dosage-restoration strategy
  status: EMERGING
  description: >
    If SCF-Fbw7-mediated turnover sets the steady-state level of MED13 protein, then
    slowing turnover of the product of the intact allele in a haploinsufficient cell
    could raise MED13 toward the diploid level and restore CKM occupancy. This is the
    one route from MED13 mechanism to a candidate therapeutic handle. The major caveat
    is target selectivity: FBXW7 is a broadly acting tumour suppressor, so
    non-selective inhibition of its ligase activity carries oncogenic risk and any
    viable strategy would need to spare its other substrates.
  evidence:
  - reference: PMID:23322298
    reference_title: "The SCF-Fbw7 ubiquitin ligase degrades MED13 and MED13L and regulates CDK8 module association with Mediator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MED13/13L physically link the CDK8 module to Mediator, and Fbw7 loss increases CDK8
      module-Mediator association.
    explanation: >-
      Demonstrates that reducing Fbw7 activity raises CKM-Mediator association, the
      effect the strategy would exploit.
  - reference: PMID:17909001
    reference_title: "FBXW7/hCDC4 is a general tumor suppressor in human cancer."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that FBXW7 is inactivated by mutation in diverse human cancer
      types with an overall mutation frequency of approximately 6%.
    explanation: >-
      Counter-evidence establishing the oncogenic risk of reducing FBXW7 function, the
      principal safety objection to this strategy.
- hypothesis_group_id: med13_mir208a_metabolic_axis
  hypothesis_label: The cardiac miR-208a/MED13 metabolic axis as a systemic-phenotype modifier
  status: EMERGING
  description: >
    In mice, cardiac MED13 acts through nuclear-receptor signalling to control systemic
    energy expenditure: cardiac MED13 overexpression or miR-208a inhibition confers
    resistance to diet-induced obesity, while cardiomyocyte MED13 deletion worsens it.
    If this axis is dosage-sensitive in humans, it offers a candidate explanation for the
    restricted growth reported in a subset of MRD61 patients that is independent of the
    neurodevelopmental phenotype, and predicts that variant class might track with growth
    and cardiac trajectory. No human data test this.
  evidence:
  - reference: PMID:22541436
    reference_title: "A cardiac microRNA governs systemic energy homeostasis by regulation of MED13."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cardiac-specific overexpression of MED13 or pharmacologic inhibition of miR-208a in
      mice confers resistance to high-fat diet-induced obesity and improves systemic
      insulin sensitivity and glucose tolerance.
    explanation: >-
      Establishes the bidirectional, dosage-dependent link from cardiac MED13 level to
      systemic metabolism.
  - reference: PMID:22541436
    reference_title: "A cardiac microRNA governs systemic energy homeostasis by regulation of MED13."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Conversely, genetic deletion of MED13 specifically in cardiomyocytes enhances
      obesity in response to high-fat diet and exacerbates metabolic syndrome.
    explanation: >-
      The loss-of-function direction, which is the one relevant to MED13
      haploinsufficiency in patients.
  notes: >-
    Entirely murine. The human MRD61 growth phenotype is restricted growth rather than
    obesity, so the direction of any human effect is not established; this is a
    hypothesis about a candidate modifier axis, not a claimed mechanism.
pathophysiology:
- name: CKM hinge anchoring by MED13
  biological_scale: MOLECULAR
  description: >
    MED13 is the hinge subunit that physically tethers the four-protein CDK8 kinase
    module (CKM: MED13, MED12, CDK8, cyclin C) to core Mediator. Structural work shows
    MED13 adopts an Argonaute-like bi-lobal fold, and that a large intrinsically
    disordered region within it forms a principal CKM-core interface which directly
    occludes the RNA polymerase II and MED26 binding sites — making CKM docking a
    kinase-independent repressor of Mediator-dependent transcription. Division of labour
    within the module is asymmetric: MED12 activates CDK8 kinase activity, whereas MED13
    mediates the association of the module with Mediator. This node is what MED13 dosage
    and structural integrity actually control, and is the mechanistic layer the previous
    version of this entry summarised only as "connective role".
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  - preferred_term: MED12
    term:
      id: hgnc:11957
      label: MED12
  - preferred_term: CDK8
    term:
      id: hgnc:1779
      label: CDK8
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  molecular_functions:
  - preferred_term: transcription coregulator activity
    term:
      id: GO:0003712
      label: transcription coregulator activity
  evidence:
  - reference: PMID:39321804
    reference_title: "Structural basis of the human transcriptional Mediator regulated by its dissociable kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The CKM binds to multiple regions on cMED through both MED12 and MED13, including a
      large intrinsically disordered region (IDR) in the latter.
    explanation: >-
      Cryo-EM of the complete human Mediator identifies the MED13 intrinsically disordered
      region as a principal CKM-core interface.
  - reference: PMID:39321804
    reference_title: "Structural basis of the human transcriptional Mediator regulated by its dissociable kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Notably, the MED13 IDR obstructs the recruitment of RNA Pol II/MED26 onto cMED by
      direct occlusion of their respective binding sites, leading to functional repression
      of cMED-dependent transcription.
    explanation: >-
      Defines the structural mechanism of kinase-independent repression that MED13 dosage
      controls.
  - reference: PMID:33523904
    reference_title: "Structure and noncanonical Cdk8 activation mechanism within an Argonaute-containing Mediator kinase module."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unexpectedly, Med13 has a characteristic Argonaute-like bi-lobal architecture.
    explanation: Establishes the structural fold of MED13.
  - reference: PMID:19047373
    reference_title: "The human CDK8 subcomplex is a histone kinase that requires Med12 for activity and can function independently of mediator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we observe that Mediator itself enables CDK8 kinase activity on chromatin, and we
      identify Med12--but not Med13--to be essential for activating the CDK8 kinase.
    explanation: >-
      Establishes the division of labour within the module: MED12 activates the kinase,
      MED13 does not, which is why MED13 loss is an anchoring rather than a kinase defect.
  downstream:
  - target: CKM occupancy of core Mediator and bidirectional transcriptional control
    description: >-
      MED13 abundance and integrity set how much CKM is docked on core Mediator.
  - target: Disrupted Mediator complex transcriptional regulation
    description: >-
      Loss of the anchoring subunit is the proximal cause of dysregulated
      Mediator-dependent transcription.
  - target: Stress-induced Med13 degradation and cyclin C release
    description: >-
      Because MED13 is the nuclear anchor for cyclin C as well as the CKM hinge, a
      reduced MED13 pool is predicted to sit closer to the threshold at which stress
      releases cyclin C to the cytoplasm.
- name: CKM occupancy of core Mediator and bidirectional transcriptional control
  biological_scale: MOLECULAR
  description: >
    CKM docking on core Mediator sterically blocks RNA polymerase II recruitment, and
    this repression is independent of CDK8 catalytic activity — MED12 and MED13, not
    kinase activity, are the critical subunits for it. The module is nevertheless not a
    pure repressor: CDK8 also acts as a context-dependent co-activator across the p53,
    Wnt/beta-catenin, serum-response, SMAD and thyroid-hormone-receptor programs.
    Consequently a perturbation of MED13 dosage dysregulates transcription
    bidirectionally at CKM-gated promoters and enhancers rather than simply de-repressing
    them, which is why MED13-related disease is a transcriptional dysregulation disorder
    and not a straightforward loss of repression.
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  biological_processes:
  - preferred_term: negative regulation of DNA-templated transcription
    term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
    modifier: DYSREGULATED
  - preferred_term: positive regulation of DNA-templated transcription
    term:
      id: GO:0045893
      label: positive regulation of DNA-templated transcription
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:17043218
    reference_title: "The cyclin-dependent kinase 8 module sterically blocks Mediator interactions with RNA polymerase II."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that the ability of the Cdk8 module to prevent pol II interactions
      is independent of the Cdk8-dependent kinase activity.
    explanation: >-
      Establishes that CKM repression is steric and kinase-independent, so it depends on
      module presence — that is, on MED13.
  - reference: PMID:19240132
    reference_title: "The human CDK8 subcomplex is a molecular switch that controls Mediator coactivator function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using a reconstituted transcription system together with recombinant or endogenous
      CDK8 subcomplexes, we demonstrate that, in fact, Med12 and Med13 are critical for
      subcomplex-dependent repression, whereas CDK8 kinase activity is not.
    explanation: >-
      Names MED13 specifically as a subunit required for repression independently of
      kinase activity.
  - reference: PMID:19240132
    reference_title: "The human CDK8 subcomplex is a molecular switch that controls Mediator coactivator function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Structural and biochemical studies confirm the CDK8 submodule binds the Mediator
      leg/tail domain via the Med13 subunit, and this submodule-Mediator association
      precludes pol II recruitment.
    explanation: Confirms MED13 as the physical point of attachment for the module.
  - reference: PMID:21327159
    reference_title: "CDK8: a positive regulator of transcription."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several transcriptional programs of biomedical importance employ CDK8 as a
      co-activator, including the p53 network, the Wnt/β-catenin pathway, the serum
      response network, and those governed by SMADs and the thyroid hormone receptor
    explanation: >-
      Establishes the co-activator arm, which is why MED13 perturbation is bidirectional
      rather than uniformly de-repressing.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Bidirectional dysregulation at CKM-gated regulatory elements during brain
      development.
- name: Disrupted Mediator complex transcriptional regulation
  description: >
    MED13 is a subunit of the CDK8 kinase module of the Mediator complex, which
    regulates RNA polymerase II-dependent transcription. MED13 plays a connective
    role between the CDK8 kinase module and the Mediator core. Pathogenic variants
    disrupt Mediator-dependent transcriptional control and broader gene-expression
    programs. MED13 belongs to the group of CDK8-kinase module-associated disease
    genes, alongside MED12, MED13L, and CDK8.
  genes:
  - preferred_term: MED13
    term:
      id: hgnc:22474
      label: MED13
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MED13 is a component of the CDK8-kinase module that can reversibly bind
      Mediator, a multi-protein complex that is required for Polymerase II
      transcription initiation. Mutations in several other genes encoding subunits
      of Mediator have been previously shown to associate with DD/ID, including
      MED13L, a paralog of MED13. Thus, our findings add MED13 to the group of
      CDK8-kinase module-associated disease genes.
    explanation: >-
      The foundational paper establishes MED13 as a CDK8-kinase module disease
      gene and describes its role in Mediator-dependent transcription.
  - reference: PMID:33390853
    reference_title: "Potential roles of mediator Complex Subunit 13 in Cardiac Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MED13 plays a connective role between the CKM and the MED core
    explanation: >-
      Review article describes MED13's structural role connecting the CDK8
      kinase module to the Mediator core complex.
  - reference: PMID:29325037
    reference_title: "Mediator complex component MED13 regulates zygotic genome activation and is required for postimplantation development in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MED13 is essential for ZGA in the mouse, in part by regulating expression
      of the embryo-specific chromatin remodeling complex, esBAF.
    explanation: >-
      Mouse study establishes MED13 as an essential regulator of early
      developmental transcription (zygotic genome activation), with its paralog
      MED13L only partially compensating, supporting the dosage sensitivity of
      MED13-dependent transcription in development.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Mediator dysfunction perturbs neuronal developmental gene-expression
      programs that contribute to developmental delay, language impairment,
      and intellectual disability.
  - target: Cardiac developmental transcriptional dysregulation
    description: >-
      Mediator dysfunction can also perturb cardiac developmental
      transcriptional programs, contributing to variable congenital heart
      anomalies in a subset of patients.
  - target: Craniofacial, ocular, and sensory developmental dysregulation
    description: >-
      Because the Mediator complex is required for transcription of nearly all
      RNA polymerase II genes, MED13 dysfunction also perturbs developmental
      programs in neural-crest- and placode-derived tissues, contributing to
      facial dysmorphism, ocular motility and optic-nerve anomalies, sensorineural
      hearing loss, dental anomalies, and rare enteric (neural-crest) involvement.
  - target: Somatic growth and skeletal developmental dysregulation
    description: >-
      Broad transcriptional pleiotropy of Mediator dysfunction extends to
      somatic growth and skeletal/limb developmental programs in a subset of
      patients.
- name: MED13 phosphodegron disruption and impaired protein turnover
  description: >
    Several pathogenic missense variants cluster at a conserved phosphodegron
    (Thr326/Pro327) in MED13. This phosphodegron is normally recognized by the
    SCF-Fbw7 ubiquitin ligase complex, leading to MED13 ubiquitination and
    proteasomal degradation. Mutations at these residues may impair MED13 protein
    turnover, potentially resulting in gain-of-function or dominant-negative
    effects through accumulation of mutant protein.
  biological_processes:
  - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
    term:
      id: GO:0031146
      label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:29740699
    reference_title: "De novo mutations in MED13, a component of the Mediator complex, are associated with a novel neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The four N-terminal clustering mutations affect two adjacent amino acids
      that are known to be involved in MED13 ubiquitination and degradation,
      p.Thr326 and p.Pro327.
    explanation: >-
      Snijders Blok et al. identified clustering of missense variants at
      residues involved in MED13 protein turnover, suggesting disrupted
      ubiquitin-mediated degradation as a disease mechanism.
  - reference: PMID:33390853
    reference_title: "Potential roles of mediator Complex Subunit 13 in Cardiac Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Normally, this phosphodegron is recognized by the S-phase kinase-associated
      protein (Skp)-Cullin-F-box (SCF) F-box and WD repeat domain-containing 7
      (Fbw7) ubiquitin ligase complex (SCFFbw7), resulting in MED13 protein
      ubiquitination and degradation
    explanation: >-
      Review details the SCF-Fbw7-dependent degradation mechanism for MED13,
      providing molecular context for why phosphodegron mutations are pathogenic.
  downstream:
  - target: Disrupted Mediator complex transcriptional regulation
    description: >-
      Impaired SCF-Fbw7-mediated MED13 turnover can alter CDK8-module
      availability at the Mediator complex and intensify transcriptional
      dysregulation.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of MED13/Mediator dysfunction, neuronal gene-expression programs
    are dysregulated during brain development, contributing to intellectual
    disability, global developmental delay, language impairment, and variable
    behavioral phenotypes. Mechanistic studies in mice indicate that MED13 is
    required cell-autonomously for cortical neuron development: knockdown of Med13
    in cortical neurons impairs radial migration, contralateral axonal projection,
    and dendritic complexity, in part through PlxnA4, linking MED13 dysfunction to
    the neurodevelopmental disorder phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: regulation of neuron differentiation
    term:
      id: GO:0045664
      label: regulation of neuron differentiation
    modifier: DYSREGULATED
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:41663567
    reference_title: "Med13 is involved in the radial migration and contralateral projection of cortical neurons via PlxnA4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that silencing Med13 in cortical neurons impaired its radial
      migration and contralateral projection as well as dendritic complexity in
      mice.
    explanation: >-
      Mouse in-utero electroporation knockdown shows MED13 is required for
      cortical neuron migration and connectivity, a mechanism linking MED13 loss
      to the neurodevelopmental phenotype.
  downstream:
  - target: Intellectual disability
    description: >-
      Disrupted neuronal developmental programs contribute to the core cognitive
      impairment phenotype.
  - target: Global developmental delay
    description: >-
      Early developmental milestone acquisition is impaired downstream of
      neuronal transcriptional dysregulation.
  - target: Delayed speech and language development
    description: >-
      Language acquisition is especially sensitive to the disrupted
      neurodevelopmental program in MED13-related disorder.
  - target: Autism spectrum disorder
    description: >-
      Variable downstream neurobehavioral manifestations can include autistic
      features in a subset of affected individuals.
  - target: Attention deficit hyperactivity disorder
    description: >-
      Variable downstream neurobehavioral manifestations can include ADHD in a
      subset of affected individuals.
  - target: Hypotonia
    description: >-
      Disrupted neurodevelopmental programs contribute to muscular hypotonia,

environmental: []
treatments:
- name: Observation without intervention
  description: >-
    No disease-modifying treatment exists and none is needed. Because the
    metaphyseal changes, bowing and even scoliosis resolve spontaneously,
    recognising the diagnosis is chiefly a way of avoiding unnecessary vitamin D
    or phosphate treatment for presumed rickets and unnecessary corrective
    osteotomy for the bowing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Genu varum
    term:
      id: HP:0002970
      label: Genu varum
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By the age of 39 months, lower limb alignment and metaphyseal features had already significantly improved and scoliosis had disappeared.
    explanation: >-
      Demonstrates spontaneous resolution without intervention, which is what
      makes observation the appropriate management.
- name: Genetic counselling
  description: >-
    Recurrence risk depends entirely on which gene is involved, and the two
    genes carry opposite modes of inheritance. Molecular diagnosis is therefore
    required before counselling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that recessive MAD is caused by homozygous loss of function of either MMP9 or MMP13, whereas dominant MAD is associated with missense mutations in the prodomain of MMP13 that determine autoactivation of MMP13 and intracellular degradation of both MMP13 and MMP9, resulting in a double enzymatic deficiency.
    explanation: >-
      Establishes that the mode of inheritance, and so the recurrence risk,
      follows from the gene and variant class.
diagnosis:
- name: Skeletal radiography with normal bone biochemistry
  description: >-
    Radiographs show metaphyseal irregularity and bowing; calcium, phosphate and
    alkaline phosphatase are normal. Together these separate the disorder from
    nutritional and hypophosphataemic rickets, which is the differential it is
    most often confused with.
  results: >-
    Metaphyseal irregularity with normal calcium, phosphate and alkaline
    phosphatase.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:9799299
    reference_title: >-
      Metaphyseal anadysplasia type II: a new regressive metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The stature is not affected and there are no metabolic abnormalities.
    explanation: >-
      Establishes the normal biochemistry that anchors this diagnostic step.
- name: MMP13 and MMP9 sequencing
  description: >-
    Molecular testing assigns the subtype and the mode of inheritance. Exome
    sequencing has been the route to diagnosis in most reported cases, including
    prenatally.
  results: >-
    A heterozygous MMP13 prodomain missense variant (type 1) or biallelic MMP9
    loss-of-function variants (type 2).
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous MMP9 nonsense variant, NM_004994.2:c.1764G>A; p.(Trp588*) was identified.
    explanation: >-
      Example of molecular confirmation establishing the subtype.
  - reference: PMID:28342220
    reference_title: >-
      Prenatal course of metaphyseal anadysplasia associated with homozygous mutation in MMP9 identified by exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed homozygous mutation in MMP9 in both fetuses suggesting a diagnosis of MANDP.
    explanation: >-
      Documents exome sequencing as the diagnostic route, here applied
      prenatally.
differential_diagnoses:
- name: Rickets
  description: >-
    Nutritional and hypophosphataemic rickets produce very similar metaphyseal
    changes and bowing. The discriminator is biochemical, not radiographic.
  distinguishing_features:
  - Calcium, phosphate and alkaline phosphatase are normal in anadysplasia
  - Radiographic changes regress spontaneously without vitamin D or phosphate
  evidence:
  - reference: PMID:9799299
    reference_title: >-
      Metaphyseal anadysplasia type II: a new regressive metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The stature is not affected and there are no metabolic abnormalities.
    explanation: >-
      Normal biochemistry is what excludes rickets.
- name: Metaphyseal dysplasia, Spahr type
  description: >-
    The recessive MMP13 entity. It shares the rickets-mimicking metaphyseal
    changes and normal blood chemistry but is not regressive: short stature
    persists into adult life and adults report knee pain.
  disease_term:
    preferred_term: metaphyseal chondrodysplasia, Spahr type
    term:
      id: MONDO:0009597
      label: metaphyseal chondrodysplasia, Spahr type
  distinguishing_features:
  - Biallelic rather than monoallelic MMP13 variants
  - Moderate short stature persists into adult life rather than regressing
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MDST phenotype is associated with moderate short stature and knee pain in adults, while extra-skeletal complications are not observed.
    explanation: >-
      Establishes the persistent adult phenotype that distinguishes Spahr type
      from the regressive course here.
- name: Metaphyseal chondrodysplasia, Schmid type
  description: >-
    The commonest metaphyseal dysplasia and the main dominant alternative.
    Unlike anadysplasia it does not regress, and it produces persistent coxa
    vara, waddling gait and short stature.
  disease_term:
    preferred_term: Schmid metaphyseal chondrodysplasia
    term:
      id: MONDO:0007983
      label: Schmid metaphyseal chondrodysplasia
  distinguishing_features:
  - COL10A1 rather than MMP13 or MMP9
  - Persistent coxa vara and short stature rather than spontaneous regression
  evidence:
  - reference: PMID:24648384
    reference_title: MMP13 mutations are the cause of recessive metaphyseal dysplasia, Spahr type.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular confirmation of MDST allows distinction of it from dominant conditions (e.g., metaphyseal dysplasia, Schmid type; OMIM # 156500) and from more severe multi-system conditions (such as cartilage-hair hypoplasia; OMIM # 250250) and to give precise recurrence risks and prognosis.
    explanation: >-
      Names Schmid type as the dominant condition this family of disorders must
      be distinguished from.
discussions:
- discussion_id: gap_mad_mechanism_of_regression
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a constitutive, lifelong deficiency of MMP9 and MMP13 produce a
    growth-plate lesion that resolves during childhood while the genetic defect
    persists unchanged?
  attaches_to:
  - pathophysiology#Distorted Metaphyseal Growth Plate
  - pathophysiology#Regressive Metaphyseal Irregularity and Limb Bowing
  - progression#Spontaneous regression
  rationale: >-
    Spontaneous regression is the defining feature of this disease and the
    reason it was named, yet no mechanism has been offered for it. The germline
    lesion does not change, so regression must reflect either a developmental
    shift in how much metaphyseal remodelling depends on these two proteases, or
    compensation by other matrix metalloproteinases as the growth rate falls.
    Neither has been tested. The question also matters practically: the same
    proteases are drug targets in osteoarthritis, and an endogenous compensatory
    route would be worth identifying.
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal anadysplasia is a very rare hereditary skeletal dysplasia with onset occurring normally during the second and third years of life, but unlike many other dysplasias, symptoms appear to resolve by adolescence.
    explanation: >-
      States the regression that this gap asks about, and marks it as unusual
      among skeletal dysplasias.

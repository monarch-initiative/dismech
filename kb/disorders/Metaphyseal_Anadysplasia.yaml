progression:
- phase: Infantile onset
  age_range: First months to third year of life
  notes: >-
    Metaphyseal changes and limb bowing appear within the first months to the
    third year of life. Long-bone shortening may be visible on prenatal
    ultrasound in the MMP9-related form before any postnatal metaphyseal change
    is seen.
  evidence:
  - reference: PMID:28342220
    reference_title: >-
      Prenatal course of metaphyseal anadysplasia associated with homozygous mutation in MMP9 identified by exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the prenatal and early postnatal course of two affected sib fetuses with early sonographic evidence of long bone shortening and postnatally no metaphyseal changes.
    explanation: >-
      Documents the prenatal detectability and the dissociation from postnatal
      radiographic change.
- phase: Spontaneous regression
  age_range: Early childhood to adolescence
  notes: >-
    Radiographic and clinical findings regress without treatment. Reported
    timing ranges from before age two in the founding series to adolescence, and
    the type II regressive form resolved by about age ten.
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal anadysplasia is a very rare hereditary skeletal dysplasia with onset occurring normally during the second and third years of life, but unlike many other dysplasias, symptoms appear to resolve by adolescence.
    explanation: >-
      States the onset window and the resolution that defines this phase.
  - reference: PMID:9799299
    reference_title: >-
      Metaphyseal anadysplasia type II: a new regressive metaphyseal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The radiographic findings regress during growth and the abnormalities disappear after the age of ten years.
    explanation: >-
      The longer regression timescale reported for the type II regressive form.

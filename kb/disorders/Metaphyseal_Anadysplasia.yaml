name: Metaphyseal anadysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Metaphyseal anadysplasia is a very rare metaphyseal dysplasia that is defined
  as much by its trajectory as by its radiology: severe metaphyseal
  irregularity, bowing of the legs and mild short stature appear in the first
  months or years of life and then regress spontaneously, so that radiographs
  normalise during childhood and adult stature is essentially unaffected. The
  "ana-" in the name records that regression. It is caused by deficiency of the
  two matrix metalloproteinases that remodel the metaphyseal extracellular
  matrix: type 1 arises from dominant MMP13 prodomain missense variants that
  autoactivate the enzyme and trigger intracellular degradation of both MMP13
  and MMP9, producing a double enzymatic deficiency, while type 2 arises from
  biallelic MMP9 loss of function. Because the metaphyseal changes mimic
  rickets but blood chemistry is normal, the disorder is repeatedly misdiagnosed
  as nutritional or hypophosphataemic rickets.
disease_term:
  preferred_term: metaphyseal anadysplasia
  term:
    id: MONDO:0015177
    label: metaphyseal anadysplasia
parents:
- hereditary disease
synonyms:
- MAD
- MANDP
- regressive metaphyseal dysplasia
- Maroteaux-Verloes-Stanescu syndrome
classifications:
  isds_skeletal_category:
  - classification_value: metaphyseal_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger,
      Ferreira, Mortier et al., PMID:36779427), Table 1 group 11 "Metaphyseal
      dysplasias". This entry covers the two anadysplasia rows of that group:
      NOS 11-0100 "Metaphyseal anadysplasia, MMP13-related" (MIM 602111,
      autosomal dominant) and NOS 11-0110 "Metaphyseal anadysplasia,
      MMP9-related" (MIM 613073, autosomal recessive). The third MMP13 row of
      the group, NOS 11-0090 "Metaphyseal dysplasia Spahr, MMP13-related"
      (MIM 250400), is the recessive MMP13 entity and is curated separately as
      Metaphyseal dysplasia, Spahr type.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Type 1 is dominant. The causal MMP13 changes are prodomain missense variants
    that act by autoactivating the enzyme rather than by simple haploinsufficiency.
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that recessive MAD is caused by homozygous loss of function of either MMP9 or MMP13, whereas dominant MAD is associated with missense mutations in the prodomain of MMP13 that determine autoactivation of MMP13 and intracellular degradation of both MMP13 and MMP9, resulting in a double enzymatic deficiency.
    explanation: >-
      Establishes the dominant mode and the specific prodomain-missense
      mechanism behind it.
  - reference: PMID:30439533
    reference_title: >-
      A de novo variant in MMP13 identified in a patient with dominant metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal anadysplasia 1 (MIM# 602111) belongs to a heterogeneous group of skeletal diseases characterized by an autosomal dominant form of growth defects due to metaphyseal changes with epiphyseal involvement similar to other metaphyseal disorders.
    explanation: >-
      Confirms the dominant mode for type 1 and notes the epiphyseal involvement
      that can accompany it.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Type 2 is recessive, caused by biallelic MMP9 loss-of-function variants.
  evidence:
  - reference: PMID:28342220
    reference_title: >-
      Prenatal course of metaphyseal anadysplasia associated with homozygous mutation in MMP9 identified by exome sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metaphyseal anadysplasia (MANDP) is a rare autosomal recessive form of skeletal dysplasia characterized by normal length at birth and transitory bowing of the legs.
    explanation: >-
      States the recessive mode and the transitory character of the MMP9-related
      form.
has_subtypes:
- name: Type 1
  display_name: Metaphyseal anadysplasia type 1 (MMP13-related)
  description: >-
    The dominant, more severe form. Prodomain missense variants cause MMP13 to
    autoactivate intracellularly, and the activated enzyme degrades both itself
    and MMP9 before secretion, so a single mutant allele produces a combined
    MMP13 and MMP9 deficiency. Epiphyseal changes and rickets-like metaphyseal
    findings may accompany the metaphyseal disease.
  genes:
  - preferred_term: MMP13
    term:
      id: hgnc:7159
      label: MMP13
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dominant MAD is associated with missense mutations in the prodomain of MMP13 that determine autoactivation of MMP13 and intracellular degradation of both MMP13 and MMP9, resulting in a double enzymatic deficiency
    explanation: >-
      Defines the molecular mechanism specific to this subtype.
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two types exist, the more severe form, type 1, with both autosomal dominant and recessive inheritance due to pathogenic variants in MMP13, whilst type 2, an even rarer form is due to biallelic MMP9 variants.
    explanation: >-
      Places type 1 as the more severe, MMP13-related form of the two.
- name: Type 2
  display_name: Metaphyseal anadysplasia type 2 (MMP9-related)
  subtype_term:
    preferred_term: metaphyseal anadysplasia 2
    term:
      id: MONDO:0013113
      label: metaphyseal anadysplasia 2
  description: >-
    The recessive, even rarer form, caused by biallelic MMP9 loss of function.
    Fewer than a handful of families have been reported. Long-bone shortening may
    be detectable on prenatal ultrasound before any metaphyseal change is
    visible postnatally.
  genes:
  - preferred_term: MMP9
    term:
      id: hgnc:7176
      label: MMP9
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case confirms that biallelic MMP9 variants cause this very rare skeletal dysplasia, metaphyseal anadysplasia type 2 but also shows that the skeletal manifestations can improve within a short period time and at an early age.
    explanation: >-
      Confirms causality for the MMP9 subtype and its early regression.
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only two metaphyseal anadysplasia type 2 families have been reported.
    explanation: >-
      Documents how few families define this subtype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists. Type 2 in particular is defined by a handful
    of families; the case report used here was the third reported worldwide.
  evidence:
  - reference: PMID:34407464
    reference_title: >-
      Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only two metaphyseal anadysplasia type 2 families have been reported.
    explanation: >-
      Establishes that reported cases, not a population rate, are all that is
      available.
pathophysiology:
- name: Dominant MMP13 Prodomain Autoactivation
  biological_scale: MOLECULAR
  description: >-
    Missense variants in the MMP13 prodomain destabilise the cysteine switch
    that holds the zymogen inactive, so the enzyme autoactivates before
    secretion. The prematurely active protease degrades itself and, because
    MMP9 traffics with it, degrades MMP9 as well. A single mutant allele
    therefore removes both enzymes rather than half of one, which is why the
    dominant form is more severe than the recessive single-gene forms.
  genes:
  - preferred_term: MMP13
    term:
      id: hgnc:7159
      label: MMP13
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      dominant MAD is associated with missense mutations in the prodomain of MMP13 that determine autoactivation of MMP13 and intracellular degradation of both MMP13 and MMP9, resulting in a double enzymatic deficiency
    explanation: >-
      The functional study establishes premature intracellular autoactivation as
      the proximal molecular lesion.
  downstream:
  - target: Combined MMP13 and MMP9 Deficiency at the Metaphyseal Front
    description: >-
      Autoactivation consumes both proteases intracellularly, so neither reaches
      the metaphyseal matrix.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19615667
      reference_title: >-
        Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        intracellular degradation of both MMP13 and MMP9, resulting in a double enzymatic deficiency
      explanation: >-
        States the double deficiency that this edge asserts.
- name: Biallelic MMP9 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous MMP9 null variants remove gelatinase B
    from the metaphysis. Because MMP13 remains intact, the resulting matrix
    defect is milder than in the dominant form.
  genes:
  - preferred_term: MMP9
    term:
      id: hgnc:7176
      label: MMP9
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that recessive MAD is caused by homozygous loss of function of either MMP9 or MMP13
    explanation: >-
      Establishes homozygous MMP9 loss of function as a cause of the recessive
      form.
  downstream:
  - target: Combined MMP13 and MMP9 Deficiency at the Metaphyseal Front
    description: >-
      Loss of MMP9 alone produces the same class of proteolytic deficit at the
      metaphyseal front, at lower severity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34407464
      reference_title: >-
        Early clinical and radiological improvement in a young boy with metaphyseal anadysplasia type 2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This case confirms that biallelic MMP9 variants cause this very rare skeletal dysplasia, metaphyseal anadysplasia type 2 but also shows that the skeletal manifestations can improve within a short period time and at an early age.
      explanation: >-
        Confirms that MMP9 loss alone produces the anadysplasia phenotype.
- name: Combined MMP13 and MMP9 Deficiency at the Metaphyseal Front
  biological_scale: MOLECULAR
  description: >-
    The converging molecular state of both subtypes: insufficient collagenase
    and gelatinase activity at the chondro-osseous junction. These two enzymes
    do double duty there, degrading extracellular matrix components and
    liberating matrix-sequestered signalling molecules such as VEGFA that
    couple cartilage resorption to vascular invasion.
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: DECREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  - preferred_term: collagen catabolic process
    modifier: DECREASED
    term:
      id: GO:0030574
      label: collagen catabolic process
  evidence:
  - reference: PMID:19615667
    reference_title: >-
      Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The matrix metalloproteinases MMP9 and MMP13 catalyze the degradation of extracellular matrix (ECM) components in the growth plate and at the same time cleave and release biologically active molecules stored in the ECM, such as VEGFA.
    explanation: >-
      Establishes the dual proteolytic and signal-releasing role that is lost in
      this node.
  downstream:
  - target: Distorted Metaphyseal Growth Plate
    description: >-
      Loss of either or both enzymes distorts the growth plate; mouse ablation of
      Mmp9, Mmp13 or both reproduces this directly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19615667
      reference_title: >-
        Mutations in MMP9 and MMP13 determine the mode of inheritance and the clinical spectrum of metaphyseal anadysplasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In mice, ablation of Mmp9, Mmp13, or both Mmp9 and Mmp13 causes severe distortion of the metaphyseal growth plate.
      explanation: >-
        Mouse genetics establish the causal link from the enzyme deficiency to
        growth-plate distortion.
- name: Distorted Metaphyseal Growth Plate
  biological_scale: TISSUE
  description: >-
    Histology of the upper tibial growth cartilage in an index case showed wide
    proliferative and hypertrophic zones, abnormal terminal hypertrophic
    chondrocytes, and a disordered zone of cartilage calcification and
    resorption. That last observation is the histological signature of the
    lesion: the failure is in the resorption and remodelling step at the
    chondro-osseous junction, not in chondrocyte proliferation or hypertrophy
    upstream of it.
  cell_types:
  - preferred_term: hypertrophic chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:1867263
    reference_title: >-
      Metaphyseal anadysplasia: a metaphyseal dysplasia of early onset with radiological regression and benign course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The upper tibial growth cartilage, studied in one case, showed wide proliferative and hypertrophic zones with an unusual appearance of the last hypertrophic cells and an abnormal zone of cartilage calcification and resorption.
    explanation: >-
      The only human growth-plate histology reported for this disease, and the
      basis for locating the lesion at the calcification and resorption zone.
  downstream:
  - target: Regressive Metaphyseal Irregularity and Limb Bowing
    description: >-
      Disordered metaphyseal remodelling produces the radiographic irregularity
      and the varus bowing of the lower limbs.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1867263
      reference_title: >-
        Metaphyseal anadysplasia: a metaphyseal dysplasia of early onset with radiological regression and benign course.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Distal metaphyses of long bones are very irregular. Femoral necks seem hypoplastic and the edges of the metaphyses are almost vertical; femoral shaft is bowed.
      explanation: >-
        The radiographic description of the metaphyseal lesion and the resulting
        bowing.
- name: Regressive Metaphyseal Irregularity and Limb Bowing
  biological_scale: ORGANISM
  description: >-
    The clinically expressed disease: metaphyseal irregularity, mild varus
    bowing and slight shortness apparent within the first months to years of
    life, which then regress spontaneously. In the original series the
    radiographic anomalies disappeared after age two; in the type 2 series they
    resolved over roughly the same interval, and in the type II regressive
    series described separately they persisted to about age ten. Adult stature
    is essentially unaffected, and the natural history is benign.
  evidence:
  - reference: PMID:1867263
    reference_title: >-
      Metaphyseal anadysplasia: a metaphyseal dysplasia of early onset with radiological regression and benign course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those anomalies disappear after 2 years.
    explanation: >-
      The regression that gives the disease its name, in the founding series.
  - reference: PMID:1867263
    reference_title: >-
      Metaphyseal anadysplasia: a metaphyseal dysplasia of early onset with radiological regression and benign course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main manifestations are slight shortness and a light varus deformity of the lower limbs. Stature is not affected.
    explanation: >-
      Establishes the mildness of the expressed phenotype and the preserved
      adult stature.
phenotypes:
- name: Metaphyseal irregularity
  category: Skeletal
  diagnostic: true
  description: >-
    Marked irregularity of the long-bone metaphyses, most obvious distally and
    at the knees, appearing in infancy and resolving during childhood.
  phenotype_term:
    preferred_term: Metaphyseal irregularity
    term:
      id: HP:0003025
      label: Metaphyseal irregularity
    temporality: TRANSIENT
  evidence:
  - reference: PMID:1867263
    reference_title: >-
      Metaphyseal anadysplasia: a metaphyseal dysplasia of early onset with radiological regression and benign course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distal metaphyses of long bones are very irregular. Femoral necks seem hypoplastic and the edges of the metaphyses are almost vertical; femoral shaft is bowed.
    explanation: >-
      Primary radiographic description of the defining finding.
  - reference: PMID:9799299

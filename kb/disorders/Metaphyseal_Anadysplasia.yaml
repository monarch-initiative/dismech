    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On radiographs the metaphyseal changes of the knees are specific with fine irregularities. The femoral necks are blurred but not hypoplastic.
    explanation: >-
      Documents the same finding, with the femoral-neck difference that

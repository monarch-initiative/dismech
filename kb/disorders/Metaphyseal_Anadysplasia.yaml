notes: >-
  Curated to complete ISDS Nosology group 11 (Metaphyseal dysplasias). The entry
  is keyed on MONDO:0015177, which MONDO treats as the anadysplasia parent
  class; MONDO has a distinct class only for type 2 (MMP9), so type 1 carries no
  subtype_term. Note a nosological disagreement in the literature that this
  entry follows the ISDS on: PMID:34407464 describes type 1 as having both
  dominant and recessive MMP13 inheritance, whereas PMID:24648384 argues the
  recessive MMP13 cases are the same entity as metaphyseal dysplasia, Spahr
  type. The 2023 nosology lists them as separate rows (11-0090 and 11-0100), and
  they are curated as separate entries here.

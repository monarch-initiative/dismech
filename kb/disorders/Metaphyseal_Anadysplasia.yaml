- name: Rickets-like metaphyseal changes with normal blood chemistry
  category: Skeletal
  diagnostic: true
  description: >-
    The metaphyseal changes closely mimic rickets, but calcium, phosphate and
    alkaline phosphatase are normal. This combination is the single most useful
    diagnostic discriminator and the commonest source of misdiagnosis.
  phenotype_term:

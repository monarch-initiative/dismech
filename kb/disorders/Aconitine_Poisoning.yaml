discussions:
- discussion_id: gap_aconitine_charcoal_haemoperfusion_efficacy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Refractory Ventricular Arrhythmia and Circulatory Collapse"
  prompt: >-
    Does extracorporeal removal of circulating aconitine alkaloids by charcoal
    haemoperfusion shorten the duration of ventricular arrhythmia or reduce
    mortality, relative to supportive care and mechanical circulatory support
    alone?
  rationale: >-
    The two sources curated here point in opposite directions without
    contradicting each other, which is precisely why this is a gap rather than a
    controversy. The Chan review states flatly that the role of charcoal
    haemoperfusion is not established. The Taiwanese series did give
    haemoperfusion to all four patients who developed ventricular tachycardia,
    and all 17 patients recovered completely - but with no control arm, an
    uncontrolled series in which everyone survives cannot separate a treatment
    effect from the natural history of a self-limiting toxidrome whose alkaloid
    is cleared over hours. The pharmacological prior is genuinely uncertain in
    both directions: aconitine is a lipophilic alkaloid with a large apparent
    volume of distribution, which argues against meaningful extracorporeal
    clearance, yet charcoal adsorbs it well in vitro. Resolving this matters
    clinically because haemoperfusion competes for time, vascular access and
    anticoagulation with the mechanical circulatory support that the same review
    does recommend.
  proposed_experiments:
  - experiment_id: exp_aconitine_haemoperfusion_extraction_and_outcome
    name: Registry-based comparative effectiveness analysis of haemoperfusion in aconite poisoning
    description: >-
      Pooled analysis across national poison-centre registries in regions where
      aconite preparations are in common use, comparing patients who received
      charcoal haemoperfusion with those who did not, restricted to patients with
      documented ventricular arrhythmia and adjusted for severity at
      presentation. Paired with serial plasma aconitine measurement across the
      haemoperfusion circuit to quantify actual extraction.
    decision_criterion: >-
      Whether measured extraction across the circuit is large enough to lower
      plasma aconitine materially, and whether arrhythmia duration differs
      between treated and untreated patients after severity adjustment.
    would_support:
    - Substantial single-pass extraction of aconitine across the charcoal circuit.
    - Shorter time to arrhythmia resolution in haemoperfused patients after adjustment for presenting severity.
    would_refute:
    - Negligible extraction across the circuit, consistent with a large volume of distribution.
    - No difference in arrhythmia duration or mortality after severity adjustment.
- discussion_id: mismatch_aconitine_calcium_p38_arm_human_relevance
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Aconitine-Induced Calcium Overload and Cardiomyocyte Apoptosis"
  prompt: >-
    Does aconitine cause calcium overload, p38 MAPK activation and cardiomyocyte
    apoptosis in poisoned humans, or is this arm confined to the rodent and
    cell-culture systems in which it has been demonstrated?
  rationale: >-
    The calcium-overload arm rests entirely on adult and neonatal rat ventricular
    myocytes and conscious rats. This is not a generic caveat about animal work:
    the doses used in such models are chosen to produce reproducible arrhythmia
    and measurable apoptosis, whereas human poisoning is a single uncontrolled
    ingestion with an exposure that falls as the alkaloid is cleared. The two
    arms also differ in what they predict. The sodium-channel arm predicts a
    fully reversible electrical disturbance, which is what the clinical
    literature reports - complete recovery in all 17 patients of the Taiwanese
    series, and an overall in-hospital mortality of only 5.5%. A substantial
    apoptotic arm would predict measurable myocyte loss and residual ventricular
    dysfunction in survivors, which is not described. Either the apoptotic arm is
    minor at human exposures, or survivors carry unrecognised myocardial injury.
    The node is deliberately left off the causal path to circulatory collapse
    until this is settled.
  proposed_experiments:
  - experiment_id: exp_aconitine_survivor_troponin_and_cmr
    name: Cardiac injury and function follow-up in human aconite poisoning survivors
    description: >-
      Prospective measurement of high-sensitivity cardiac troponin during the
      acute phase, with cardiac magnetic resonance including late gadolinium
      enhancement and extracellular volume mapping in survivors at three months,
      in a consecutive cohort of patients admitted with aconite poisoning.
    decision_criterion: >-
      Whether survivors show troponin release beyond that attributable to
      resuscitation and defibrillation, and whether any residual myocardial
      fibrosis or dysfunction is detectable at three months.
    would_support:
    - Troponin elevation disproportionate to the resuscitation received.
    - Late gadolinium enhancement or raised extracellular volume in survivors at three months.
    would_refute:
    - Troponin release fully accounted for by cardiopulmonary resuscitation and defibrillation.
    - Normal cardiac magnetic resonance in survivors, indicating a purely electrical and reversible insult.
- discussion_id: gap_aconitine_hpvg_reversibility_generalisation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Hepatic Portal Venous Gas"
  - "pathophysiology#Non-Occlusive Mesenteric Ischaemia"
  prompt: >-
    In patients who develop hepatic portal venous gas after resuscitated
    toxin-induced cardiac arrest, what proportion have transmural bowel necrosis
    requiring resection, and what proportion resolve with haemodynamic
    optimisation alone?
  rationale: >-
    The source case report proposes that hepatic portal venous gas in this
    setting is a reversible consequence of shock and that the primary insult
    should be treated rather than the radiological sign - a claim supported at
    the level of general principle by the hepatic portal venous gas literature,
    which holds that prognosis follows the underlying pathology and that the sign
    is not itself a surgical indication. But the specific claim rests on one
    patient, and the competing risk is asymmetric: non-occlusive mesenteric
    ischaemia carries a mortality of the order of 50%, and its vasospasm persists
    after the precipitating event is corrected, so conservative management of a
    patient who in fact has transmural necrosis is not a recoverable error. What
    is missing is not the principle but the discriminator - the clinical or
    radiological features that separate the reversible from the necrotic case at
    the bedside. Until that exists, this entry records the mechanism without
    implying a management recommendation.
  proposed_experiments:
  - experiment_id: exp_hpvg_post_arrest_outcome_cohort
    name: Multicentre cohort of hepatic portal venous gas following resuscitated cardiac arrest
    description: >-
      Retrospective multicentre identification of patients with computed
      tomography-confirmed hepatic portal venous gas within seven days of
      resuscitated cardiac arrest, linking initial imaging features (extent of
      gas, bowel wall enhancement, pneumatosis intestinalis, mesenteric vessel
      patency) and lactate trajectory to the reference outcome of transmural
      necrosis at laparotomy or resolution on repeat imaging.
    decision_criterion: >-
      Whether any combination of initial imaging and biochemical features
      separates patients who resolved without surgery from those with transmural
      necrosis, at a negative predictive value high enough to support
      conservative management.
    would_support:
    - A majority of cases resolving with haemodynamic optimisation alone.
    - An identifiable low-risk imaging and lactate profile with high negative predictive value for transmural necrosis.
    would_refute:
    - A high proportion of transmural necrosis irrespective of initial appearances.
    - No feature combination separating the two outcomes, implying that portal venous gas in this setting warrants surgical assessment regardless of the presumed cause.

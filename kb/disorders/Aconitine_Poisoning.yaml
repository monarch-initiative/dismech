treatments:
- name: Supportive Care and Haemodynamic Stabilisation
  description: >-
    Immediate attention to vital functions with close monitoring of blood
    pressure and cardiac rhythm is the foundation of management; there is no
    antidote. Inotropic therapy is added if hypotension persists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Refractory Ventricular Arrhythmia and Circulatory Collapse
    treatment_effect: MODULATES
    description: >-
      Supports systemic perfusion while the alkaloid is cleared; it does not act
      on the channel lesion.
    evidence:
    - reference: PMID:19514874
      reference_title: "Aconite poisoning."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Inotropic therapy is required if hypotension persists and atropine should be used to treat bradycardia."
      explanation: >-

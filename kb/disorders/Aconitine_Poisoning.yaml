- name: Early Mechanical Circulatory Support
  description: >-
    When ventricular arrhythmia and cardiogenic shock are refractory to
    first-line treatment, the priority shifts from converting the rhythm to
    maintaining systemic blood flow, blood pressure and tissue oxygenation, for
    which early cardiopulmonary bypass is recommended. The rationale is that
    aconitine toxicity is self-limiting as the alkaloid is cleared, so
    circulatory support is a bridge rather than a definitive therapy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiopulmonary bypass and extracorporeal circulatory support
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Refractory Ventricular Arrhythmia and Circulatory Collapse
    treatment_effect: MODULATES
    description: >-
      Substitutes for cardiac output while the arrhythmic substrate persists,
      preventing the downstream ischaemic consequences of sustained low flow.
    evidence:
    - reference: PMID:19514874
      reference_title: "Aconite poisoning."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In refractory cases of ventricular arrhythmias and cardiogenic shock, it is most important to maintain systemic blood flow, blood pressure, and tissue oxygenation by the early use of cardiopulmonary bypass."
      explanation: >-
        States the indication and the physiological goal this link encodes.
  notes: >-
    Bound to the generic `NCIT:C49236` Therapeutic Procedure because NCIT has no
    cardiopulmonary bypass term - a direct label scan of the NCIT release used
    here for `cardiopulmonary bypass` returns nothing. `NCIT:C171507`
    Extracorporeal Membrane Oxygenation exists but is a different modality from
    the bypass the source recommends, and substituting it would misstate the
    cited recommendation.
  evidence:
  - reference: PMID:19514874

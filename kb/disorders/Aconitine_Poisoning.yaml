    explanation: States that management is supportive and names its components.
- name: Atropine
  description: >-
    A competitive muscarinic antagonist, indicated for the bradycardia of aconite
    poisoning. It acts at the cardiac muscarinic receptor and is symptomatic: it
    opposes the bradycardia without addressing either the persistent sodium
    current or the central drive that produces it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Central Hypotensive and Bradycardic Drive
    treatment_effect: INHIBITS
    description: >-
      Antagonism at the cardiac muscarinic receptor raises the heart rate,
      opposing the bradycardia at its effector. It does not act on the
      hypothalamic drive itself, so the effect is symptomatic.
    evidence:
    - reference: PMID:19514874
      reference_title: "Aconite poisoning."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Inotropic therapy is required if hypotension persists and atropine should be used to treat bradycardia."
      explanation: >-
        Directly indicates atropine for the bradycardia this node produces.

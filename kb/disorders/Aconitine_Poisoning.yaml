name: Aconitine Poisoning
creation_date: "2026-08-22T16:05:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Plant Poisoning
- Herbal Medicine Adverse Effect
synonyms:
- aconite poisoning
- Aconitum poisoning
- monkshood poisoning
- wolfsbane poisoning
- aconite alkaloid toxicity
description: >-
  Aconitine poisoning is an acute toxidrome caused by ingestion of the
  diterpenoid ester alkaloids of Aconitum species (monkshood, wolfsbane) -
  principally aconitine, mesaconitine and hypaconitine - which are concentrated
  in the roots and root tubers. Aconite root is a long-standing analgesic and
  antirheumatic remedy in traditional Chinese and Japanese medicine, where it is
  used only after processing that hydrolyses the diester alkaloids to far less
  toxic derivatives; poisoning follows inadequate processing, larger than
  recommended doses, tincture or wine preparations, or accidental ingestion of
  the wild plant. The unifying molecular mechanism is binding to neurotoxin site
  2 on the alpha subunit of voltage-gated sodium channels in the open state,
  which suppresses channel inactivation and holds the channel persistently
  activated. In excitable tissue this produces sustained sodium influx and
  excessive depolarisation ending in inexcitability. In the myocardium it
  generates triggered activity from early and delayed after-depolarisations,
  causing ventricular tachycardia and fibrillation that are characteristically
  refractory to cardioversion and antiarrhythmic drugs; in peripheral nerve it
  produces the early sensory paresthesiae and later blocks neuromuscular
  transmission. Patients present after a latent period of minutes to hours with a
  combination of neurological, cardiovascular and gastrointestinal features, and
  the main causes of death are refractory ventricular arrhythmias and asystole.
  Management is supportive - atropine for bradycardia, inotropes for hypotension,
  amiodarone or flecainide for ventricular arrhythmia, and early mechanical
  circulatory support when arrhythmia and cardiogenic shock are refractory.
notes: >-
  ONTOLOGY GAP - no `disease_term` is bound because MONDO has no aconitine or
  aconite concept. This was checked exhaustively rather than by label search
  alone: a direct SQL scan of every value in the MONDO `statements` table for
  the substring `aconit` returns only `MONDO:0009706` (aconitase deficiency) and
  its definition text, i.e. the metabolic enzyme, not the plant alkaloid. MONDO
  codes many named poisonings as siblings (`MONDO:0017860` methanol,
  `MONDO:0018019` lead, `MONDO:0041996` thallium, `MONDO:0800386`
  organophosphate, `MONDO:0023176` formaldehyde), so the absence is a genuine
  coverage gap in a populated branch rather than a modelling decision. The
  nearest available ancestor, `MONDO:0029000` poisoning, is too broad to carry
  any information and is deliberately not bound; `Arsenic_Poisoning` sets the
  precedent in this knowledge base for an entry with no `disease_term`. HPO
  likewise has no term for hepatic portal venous gas - the closest, from a
  substring search of HP labels, are `HP:0031941` abnormal portal venous system
  morphology and `HP:0034570` thickened intrahepatic portal venules, neither of
  which denotes intravascular gas - so that finding is curated as a
  pathophysiology node and named in prose rather than force-bound.
mappings:
  icd10cm_mappings:
  - term:
      id: ICD10CM:T62.2
      label: Toxic effect of other ingested (parts of) plant(s)
    mapping_predicate: skos:broadMatch
    mapping_justification: semapv:ManualMappingCuration
    notes: >-
      Deliberately a broadMatch, not a close or exact one. ICD-10-CM has no
      aconite or Aconitum code - a substring scan of ICD-10-CM labels for
      `aconit` returns nothing - so T62.2 is the code an aconite root ingestion
      is assigned under, while covering every other toxic ingested plant part as
      well. It is a billing-level container, not a synonym for this entry.
pathophysiology:
- name: Ingestion of Aconitum Alkaloids
  biological_scale: ORGANISM
  description: >-
    The toxic exposure. Aconitum roots and root tubers concentrate the diester
    diterpenoid alkaloids aconitine, mesaconitine and hypaconitine. Traditional
    processing - soaking and boiling - hydrolyses these to far less toxic
    monoester and alkamine derivatives, so the dose of intact diester alkaloid
    reaching the circulation is set by preparation method as much as by the
    quantity of root consumed. Inadequate processing, a larger than recommended
    dose, and alcoholic tincture or wine preparations (which extract rather than
    hydrolyse the alkaloids) are the recognised routes to poisoning, alongside
    accidental ingestion of the wild plant.
  notes: >-
    Deliberately carries no ontology-bound process descriptor. The node denotes
    an exposure event, not a biological process of the host, and no GO term
    describes it; binding the downstream sodium term here would assert the
    mechanism one step before it occurs. The exposure itself is grounded in the
    `environmental:` block via ECTO.
  downstream:
  - target: Persistent Voltage-Gated Sodium Channel Activation
    description: >-
      Absorbed diester alkaloids reach voltage-gated sodium channels in
      myocardium, nerve and muscle.
  - target: Central Hypotensive and Bradycardic Drive
    description: >-
      Absorbed alkaloids reach the hypothalamus and drive the central
      hypotensive and bradycardic response.
  - target: Cholinergic Ileal Hypercontractility
    description: >-
      Absorbed alkaloids act on postganglionic enteric cholinergic nerves.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Severe aconite poisoning can occur after accidental ingestion of the wild plant or consumption of an herbal decoction made from aconite roots."
    explanation: Establishes the two principal ingestion routes.
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Soaking and boiling during processing or decoction preparation will hydrolyze aconite alkaloids into less toxic and non-toxic derivatives."
    explanation: >-
      Supports processing as the step that determines the delivered dose of
      intact diester alkaloid.
  - reference: PMID:15111916
    reference_title: "Clinical features and management of herb-induced aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk is higher with inadequately processed aconite roots, large doses, or tincture preparations."
    explanation: >-
      Identifies inadequate processing, dose and tincture preparation as the
      determinants of risk in a national poison-centre case series.
- name: Persistent Voltage-Gated Sodium Channel Activation
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting molecular lesion. Aconitine and mesaconitine bind with high
    affinity to neurotoxin binding site 2 on the alpha subunit of the
    voltage-gated sodium channel, and do so preferentially in the open state.
    Binding suppresses channel inactivation, so the channel remains persistently
    activated instead of closing after depolarisation - a qualitative escape from
    normal voltage-dependent gating rather than a quantitative increase in
    channel number or conductance, which is why `GAIN_OF_FUNCTION` is used here
    in preference to `INCREASED`. The most toxic Aconitum alkaloids carry two
    ester bonds on the diterpene skeleton and open the channel even at resting
    potential.
  molecular_functions:
  - preferred_term: voltage-gated sodium channel activity, held open by suppressed inactivation
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
  biological_processes:
  - preferred_term: persistent sodium influx across the plasma membrane
    modifier: INCREASED
    term:
      id: GO:0098719
      label: sodium ion import across plasma membrane
  downstream:
  - target: Sustained Depolarisation and Loss of Excitability
    description: >-
      Uninterrupted sodium influx drives the membrane potential positive and
      holds it there.
  - target: Cardiac Triggered Activity and Ventricular Tachyarrhythmia
    description: >-
      In cardiomyocytes the same persistent sodium current generates
      after-depolarisations.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aconitine and mesaconitine bind with high affinity to the open state of the voltage-sensitive sodium channels at site 2, thereby causing a persistent activation of the sodium channels, which become refractory to excitation."
    explanation: >-
      States the binding site, the state dependence, and the
      persistent-activation consequence that defines this node.
  - reference: PMID:9760702
    reference_title: "The effects of Aconitum alkaloids on the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "aconitine, a highly toxic diterpenoid alkaloid which is known to suppress the inactivation of voltage-dependent Na+ channels by binding to neurotoxin binding site 2 of the alpha-subunit of the channel protein"
    explanation: >-
      Independently identifies the molecular target as neurotoxin site 2 on the
      channel alpha subunit and the action as suppression of inactivation.
  - reference: PMID:9760702
    reference_title: "The effects of Aconitum alkaloids on the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The members of this group activate voltage-dependent sodium channels already at resting potential and inhibit noradrenaline reuptake."
    explanation: >-
      Supports the structure-toxicity relationship: the diester alkaloids open
      the channel even at resting potential.
- name: Sustained Depolarisation and Loss of Excitability
  biological_scale: CELLULAR
  description: >-
    Persistent sodium entry depolarises excitable cells and keeps them
    depolarised, so voltage-gated channels cannot recover from inactivation and
    the cell becomes inexcitable. This biphasic behaviour - initial excitation
    followed by depolarising block - explains the clinical sequence in peripheral
    nerve, where early paraesthesia and numbness of the face, perioral area and
    limbs give way to motor weakness.
  biological_processes:
  - preferred_term: sustained membrane depolarisation ending in inexcitability
    modifier: INCREASED
    term:
      id: GO:0051899
      label: membrane depolarization
  downstream:
  - target: Neuromuscular Transmission Block
    description: >-
      Depolarising block in the axon impairs the evoked release of
      acetylcholine.
  evidence:
  - reference: PMID:9760702
    reference_title: "The effects of Aconitum alkaloids on the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Activation of sodium channels and in consequence excessive depolarization with final inexcitability and suppression of pain transmission account for their antinociceptive properties."
    explanation: >-
      States the excitation-then-inexcitability sequence that is the substance of
      this node.
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The neurological features can be sensory (paresthesia and numbness of face, perioral area, and the four limbs), motor (muscle weakness in the four limbs), or both."
    explanation: >-
      Supports the clinical sensory-then-motor expression of this node in
      peripheral nerve.
- name: Neuromuscular Transmission Block
  biological_scale: CELLULAR
  description: >-
    Acting on axonal voltage-gated sodium channels, aconitine reduces the evoked
    quantal release of acetylcholine at the neuromuscular junction, blocking
    transmission and producing the motor weakness of the four limbs seen in
    severe poisoning. This is a presynaptic release failure secondary to
    depolarising block, not receptor antagonism.
  biological_processes:
  - preferred_term: evoked quantal acetylcholine release at the neuromuscular junction
    modifier: DECREASED
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Through its action on voltage-sensitive sodium channels in the axons, aconitine blocks neuromuscular transmission by decreasing the evoked quantal release of acetylcholine."
    explanation: >-
      States the mechanism, the site (axon), and the direction of the effect on
      acetylcholine release.
- name: Cardiac Triggered Activity and Ventricular Tachyarrhythmia
  biological_scale: CELLULAR
  description: >-
    The lethal arm. In ventricular cardiomyocytes the persistent sodium current
    prolongs the action potential and generates both early and delayed
    after-depolarisations; these reach threshold and produce triggered activity,
    the electrophysiological substrate of aconitine-induced ventricular
    tachycardia and fibrillation. A cholinolytic (anticholinergic) action
    mediated through the vagus nerve contributes to the arrhythmogenicity, so the
    arrhythmia is not attributable to the sodium channel effect alone.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:2000046
      label: ventricular cardiac muscle cell
  molecular_functions:
  - preferred_term: cardiac voltage-gated sodium channel activity, persistently activated
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
  biological_processes:
  - preferred_term: prolonged depolarisation of the cardiac action potential
    modifier: INCREASED
    term:
      id: GO:0086012
      label: membrane depolarization during cardiac muscle cell action potential
  downstream:
  - target: Refractory Ventricular Arrhythmia and Circulatory Collapse
    description: >-
      Sustained triggered activity degenerates into ventricular tachycardia and
      fibrillation.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The electrophysiological mechanism of arrhythmia induction is triggered activity due to delayed after-depolarization and early after-depolarization."
    explanation: >-
      States the electrophysiological mechanism this node asserts.
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The arrhythmogenic properties of aconitine are in part due to its cholinolytic (anticholinergic) effects mediated by the vagus nerve."
    explanation: >-
      PARTIAL because it supports only the secondary vagal contribution named in
      the description, not the primary triggered-activity mechanism; recorded so
      the node is not read as a pure sodium-channel account.
- name: Aconitine-Induced Calcium Overload and Cardiomyocyte Apoptosis
  biological_scale: CELLULAR
  description: >-
    A parallel, non-electrophysiological arm of cardiotoxicity established in
    rodent models. Aconitine drives intracellular calcium overload through
    altered expression of calcium-handling proteins, accelerating the beating
    rhythm of isolated ventricular myocytes and causing arrhythmia in conscious
    rats; it also produces dose-dependent myocardial injury and cardiomyocyte
    apoptosis with upregulated pro-apoptotic and downregulated BCL-2 expression,
    signalling through p38 MAPK phosphorylation. This arm speaks to myocardial
    injury and cell loss rather than to the acute triggered activity above, and
    the two should not be conflated.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:2000046
      label: ventricular cardiac muscle cell
  biological_processes:
  - preferred_term: intracellular calcium overload
    modifier: INCREASED
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
  - preferred_term: cardiomyocyte apoptosis
    modifier: INCREASED
    term:
      id: GO:0010659
      label: cardiac muscle cell apoptotic process
  - preferred_term: p38 MAPK signalling
    modifier: INCREASED
    term:
      id: GO:0038066
      label: p38MAPK cascade
  notes: >-
    Entirely rodent and cell-culture derived - adult and neonatal rat ventricular
    myocytes plus conscious rats. No human data establish the calcium-overload or
    p38 arm in aconitine poisoning, which is why it is curated as a parallel node
    with model-tagged evidence rather than being wired into the human causal
    chain to circulatory collapse. See the `HUMAN_MODEL_MISMATCH` discussion.
  evidence:
  - reference: PMID:24840785
    reference_title: "Aconitine-induced Ca2+ overload causes arrhythmia and triggers apoptosis through p38 MAPK signaling pathway in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that Ca(2+) overload lead to accelerated beating rhythm in adult rat ventricular myocytes and caused arrhythmia in conscious freely moving rats."
    explanation: >-
      In vivo rat evidence for the calcium-overload-to-arrhythmia link.
  - reference: PMID:24840785
    reference_title: "Aconitine-induced Ca2+ overload causes arrhythmia and triggers apoptosis through p38 MAPK signaling pathway in rats."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results showed that aconitine resulted in myocardial injury and reduced NRVMs viability dose-dependently."
    explanation: >-
      Cell-culture evidence for dose-dependent myocardial injury in neonatal rat
      ventricular myocytes; split from the in vivo item so each carries a single
      evidence_source.
  - reference: PMID:24840785
    reference_title: "Aconitine-induced Ca2+ overload causes arrhythmia and triggers apoptosis through p38 MAPK signaling pathway in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our results suggest that aconitine significantly aggravates Ca(2+) overload and causes arrhythmia and finally promotes apoptotic development via phosphorylation of P38 mitogen-activated protein kinase"
    explanation: >-
      States the calcium-overload to p38-to-apoptosis chain asserted by this
      node.
- name: Refractory Ventricular Arrhythmia and Circulatory Collapse
  biological_scale: ORGANISM
  description: >-
    The organism-level consequence and the usual mode of death. Aconitine-induced
    ventricular arrhythmias are characteristically refractory to direct current
    cardioversion and to antiarrhythmic drugs, so haemodynamic collapse can
    persist despite standard resuscitation; refractory ventricular arrhythmia and
    asystole are the main causes of death, with a reported overall in-hospital
    mortality of 5.5%. Cardiac arrest may require prolonged cardiopulmonary
    resuscitation, defibrillation and vasopressor support.
  downstream:
  - target: Non-Occlusive Mesenteric Ischaemia
    description: >-
      Sustained low cardiac output and vasopressor-supported shock reduce
      splanchnic perfusion.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main causes of death are refractory ventricular arrhythmias and asystole and the overall in-hospital mortality is 5.5%."
    explanation: Establishes the mode of death and quantifies in-hospital mortality.
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aconite-induced ventricular arrhythmias are often refractory to direct current cardioversion and antiarrhythmic drugs."
    explanation: >-
      Supports the refractoriness that distinguishes this from ordinary
      ventricular arrhythmia and drives the escalation to circulatory support.
  - reference: PMID:41627141
    reference_title: "Transient hepatic portal venous gas following resuscitated cardiac arrest in a patient with aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He suffered a cardiac arrest requiring prolonged cardiopulmonary resuscitation, defibrillation, and vasopressor support."
    explanation: >-
      Single-patient illustration of the resuscitation course that precedes the
      splanchnic complication arm.
- name: Non-Occlusive Mesenteric Ischaemia
  biological_scale: TISSUE
  description: >-
    A complication of the shock state rather than of aconitine itself. Sustained
    low cardiac output and vasopressor exposure provoke splanchnic arteriolar
    vasoconstriction with patent mesenteric arteries - the defining feature of
    non-occlusive mesenteric ischaemia - producing small bowel wall oedema,
    reduced mucosal enhancement, and potential intestinal ischaemia and necrosis.
    The vasospasm is known to persist even after the precipitating haemodynamic
    event has been corrected, which is why the complication can declare itself
    days after successful resuscitation.
  biological_processes:
  - preferred_term: splanchnic arteriolar vasoconstriction with patent mesenteric arteries
    modifier: INCREASED
    term:
      id: GO:0042310
      label: vasoconstriction
  notes: >-
    `GO:0002014` "vasoconstriction of artery involved in ischemic response to
    lowering of systemic arterial blood pressure" looks like an exact match on
    its label and is deliberately NOT used: its definition restricts it to
    vasoconstriction "triggered by vasomotor excitation resulting from the
    detection of high carbon dioxide levels in the vasomotor center of the
    central nervous system", i.e. the CNS ischaemic response, which is not the
    splanchnic sympathetic and renin-angiotensin mechanism of non-occlusive
    mesenteric ischaemia. The plain parent `GO:0042310` is bound instead with a
    specific preferred_term. Read the definition, not the label.
  downstream:
  - target: Hepatic Portal Venous Gas
    description: >-
      Ischaemic loss of mucosal barrier integrity allows intraluminal gas to
      enter the mesenteric and portal venous circulation.
  evidence:
  - reference: PMID:41627141
    reference_title: "Transient hepatic portal venous gas following resuscitated cardiac arrest in a patient with aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Portal venous gas accumulation originated from non-occlusive mesenteric ischaemia triggered by aconitine-mediated cardiovascular collapse."
    explanation: >-
      The authors' own causal attribution linking aconitine-induced collapse to
      non-occlusive mesenteric ischaemia.
  - reference: PMID:41627141
    reference_title: "Transient hepatic portal venous gas following resuscitated cardiac arrest in a patient with aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contrast-enhanced computed tomography on day 4 revealed multiple branching gas shadows within the left hepatic lobe, diagnostic of portal venous gas, as well as small bowel wall oedema with reduced enhancement, indicating potential intestinal ischaemia and necrosis."
    explanation: >-
      The imaging findings behind both this node and the portal venous gas node.
  - reference: PMID:11976865
    reference_title: "Non-occlusive mesenteric ischemia: etiology, diagnosis, and interventional therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Non-occlusive mesenteric ischemia (NOMI) compromises all forms of mesenteric ischemia with patent mesenteric arteries."
    explanation: >-
      Defines the entity and its distinguishing feature of patent arteries.
  - reference: PMID:11976865
    reference_title: "Non-occlusive mesenteric ischemia: etiology, diagnosis, and interventional therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is known that mesenteric vasospasm persists even after correction of the precipitating event."
    explanation: >-
      Supports the delayed and self-sustaining character of the vasospasm, which
      is why the complication appears days after resuscitation.
- name: Hepatic Portal Venous Gas
  biological_scale: TISSUE
  description: >-
    Gas tracking from the damaged bowel wall into the mesenteric and portal
    venous circulation, seen on CT as branching gas shadows within the hepatic
    parenchyma. Although hepatic portal venous gas is conventionally an ominous
    radiological sign associated with a poor prognosis, its prognostic weight
    belongs to the underlying pathology rather than to the gas itself: it is not
    of itself a surgical indication, and in toxin-induced cardiac arrest it can
    be a reversible consequence of the shock state that resolves when the primary
    insult is treated. Curating this node is the point of the source case report
    - it converts a finding usually read as a call for laparotomy into a marker
    of the upstream circulatory lesion.
  evidence:
  - reference: PMID:41627141
    reference_title: "Transient hepatic portal venous gas following resuscitated cardiac arrest in a patient with aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient highlights that in the context of toxin-induced cardiac arrest, hepatic portal venous gas can be a reversible consequence of the underlying shock, emphasizing the importance of treating the primary insult."
    explanation: >-
      The case report's central claim, which this node encodes.
  - reference: PMID:41627141
    reference_title: "Transient hepatic portal venous gas following resuscitated cardiac arrest in a patient with aconitine poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatic portal venous gas is an uncommon radiological finding and is generally associated with a poor prognosis."
    explanation: >-
      States the conventional prognostic reading that the case qualifies.
  - reference: PMID:19653334
    reference_title: "Hepatic portal venous gas: physiopathology, etiology, prognosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HPVG is not by itself a surgical indication and the treatment depends mainly on the underlying disease."
    explanation: >-
      Independent review support for treating the underlying cause rather than
      the radiological sign.
  - reference: PMID:19653334
    reference_title: "Hepatic portal venous gas: physiopathology, etiology, prognosis and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The prognosis is related to the pathology itself and is not influenced by the presence of HPVG."
    explanation: >-
      Supports the claim that prognostic weight belongs to the underlying
      pathology, generalising the case report beyond n=1.
- name: Central Hypotensive and Bradycardic Drive
  biological_scale: ORGANISM
  description: >-
    A centrally mediated haemodynamic arm, separate from the myocardial one.
    Chan attributes aconitine's hypotensive and bradycardic actions to activation
    of the ventromedial nucleus of the hypothalamus. This is the mechanism behind
    the bradycardia and hypotension of the toxidrome and is what atropine and
    inotropes are directed at. It is deliberately kept apart from the cardiac
    triggered-activity node: the two produce opposite rate effects, and conflating
    them is what makes an anticholinergic look like an antiarrhythmic.
  notes: >-
    Placed downstream of ingestion rather than of the sodium-channel node because
    the source attributes the effect to hypothalamic activation without stating
    that the channel action mediates it. Note also that the only vagally mediated
    action the source describes is aconitine's own cholinolytic (anticholinergic)
    effect, which is vagolytic and would tend toward tachycardia - so a vagal
    attribution for the bradycardia would invert the source. An earlier draft of
    this entry made exactly that error.
  downstream:
  - target: Refractory Ventricular Arrhythmia and Circulatory Collapse
    description: >-
      Central hypotensive drive compounds the haemodynamic failure caused by the
      arrhythmia.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has hypotensive and bradycardic actions due to activation of the ventromedial nucleus of the hypothalamus."
    explanation: >-
      States both the effects and the central mechanism this node asserts.
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The cardiovascular features include hypotension, chest pain, palpitations, bradycardia, sinus tachycardia, ventricular ectopics, ventricular tachycardia, and ventricular fibrillation."
    explanation: >-
      Confirms hypotension and bradycardia as observed clinical features, the
      readout of this node.
- name: Cholinergic Ileal Hypercontractility
  biological_scale: TISSUE
  description: >-
    The gastrointestinal arm. Aconitine, mesaconitine and hypaconitine induce
    strong contractions of the ileum by releasing acetylcholine from
    postganglionic cholinergic nerves - a presynaptic release effect on enteric
    nerves rather than a direct action on smooth muscle. This is the mechanism
    behind the nausea, vomiting, abdominal pain and diarrhoea of the toxidrome.
  biological_processes:
  - preferred_term: acetylcholine release from postganglionic cholinergic nerves
    modifier: INCREASED
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
  - preferred_term: ileal smooth muscle contraction
    modifier: INCREASED
    term:
      id: GO:0006939
      label: smooth muscle contraction
  notes: >-
    Note the direction contrast with `Neuromuscular Transmission Block`, which is
    the same neurotransmitter and the same GO process in the opposite direction:
    acetylcholine release is DECREASED at the skeletal neuromuscular junction and
    INCREASED at postganglionic enteric nerves. Both are curated because the
    source states both; they are not a contradiction but different synapses.
  evidence:
  - reference: PMID:19514874
    reference_title: "Aconite poisoning."
    supports: SUPPORT
    evidence_source: OTHER

      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Vasospasm frequently responds to direct intra-arterial vasodilator therapy, which is the only treatment that has been shown to be effective."
      explanation: >-
        States both the target (vasospasm) and the effect, and is the strongest

    The severe, lethal grade. Anisospondyly is marked, with rudimentary or
    absent vertebral bodies, and limb shortening and bowing are severe. Most
    affected pregnancies are terminated or end in stillbirth, and liveborn
    infants usually die within the first days of life from respiratory
    failure. Reported HSPG2 alleles are functional nulls — insertions,
    deletions and splice-site variants predicted to truncate the perlecan core
    protein.

pathophysiology:
- name: Biallelic HSPG2 Loss-of-Function Variation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is biallelic loss-of-function variation in HSPG2,
    which encodes perlecan. In the lethal Silverman-Handmaker grade the
    reported alleles are functional nulls — exonic duplications, deletions and
    splice-site variants that cause frameshifts and truncate the core protein.
    In the nonlethal Rolland-Desbuquois grade the recurrent allele is instead a
    missense change, p.G3324R in an immunoglobulin-like repeat of perlecan
    domain IV, carried either homozygously or in trans with a nonsense or
    splice-site allele.
  genes:
  - preferred_term: HSPG2
    term:
      id: hgnc:5273
      label: HSPG2
  genetic_context:
    gene:
      preferred_term: HSPG2
      term:

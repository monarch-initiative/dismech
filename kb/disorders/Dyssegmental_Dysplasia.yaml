- name: DDRD
  display_name: Dyssegmental dysplasia, Rolland-Desbuquois type (nonlethal)
  subtype_term:
    preferred_term: dyssegmental dysplasia, Rolland-Desbuquois type
    term:
      id: MONDO:0009139
      label: dyssegmental dysplasia, Rolland-Desbuquois type
  description: >-
    The milder, nonlethal grade. Vertebral bodies are better ossified than in
    DDSH and long-bone shortening and bowing are milder, with radiographic
    changes that were originally described as resembling Kniest dysplasia.
    Survival beyond the newborn period is frequent, though respiratory support
    is commonly required. Attributed to HSPG2 only in 2024, when biallelic
    variants were found in five patients sharing a founder p.G3324R haplotype;
    mild myotonic features overlapping Schwartz-Jampel syndrome were noted in
    one of them.

        reference_title: Perlecan is essential for cartilage and cephalic development.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Hspg2-/- cartilage matrix contained reduced and disorganized collagen fibrils and glycosaminoglycans, suggesting that perlecan has an important role in matrix structure.
        explanation: Reports the measured matrix abnormality.
    evidence:
    - reference: PMID:11279527
      reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice lacking the perlecan gene (Hspg2) have a severe chondrodysplasia with dyssegmental ossification of the spine and show radiographic, clinical and chondro-osseous morphology similar to a lethal autosomal recessive disorder in humans termed dyssegmental dysplasia, Silverman-Handmaker type (DDSH; MIM 224410)
      explanation: >-
        States the chondro-osseous correspondence between the null mouse and
        human DDSH that makes this model informative.
  - target: Growth-Plate Disorganization and Defective Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The line reproduces the growth-plate failure: loss of chondrocyte

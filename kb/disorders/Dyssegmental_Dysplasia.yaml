        label: HSPG2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline HSPG2 alleles. Homozygosity
      predominates in consanguineous DDSH families; compound heterozygosity is
      common in the DDRD series, where one allele is the founder missense
      variant.
  evidence:
  - reference: PMID:11279527
    reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.

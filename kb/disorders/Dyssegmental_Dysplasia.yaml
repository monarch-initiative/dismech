genetic:
- name: HSPG2
  gene_term:
    preferred_term: HSPG2
    term:
      id: hgnc:5273
      label: HSPG2
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  frequency: >-
    The only gene known to cause dyssegmental dysplasia; biallelic variants
    account for both the lethal and the nonlethal grade.
  notes: >-
    HSPG2 is a 97-exon gene, and reported alleles are distributed across it
    rather than clustering in a hotspot. DDSH alleles are insertions, deletions
    and splice-site variants predicted to truncate the perlecan core protein.
    The DDRD series is dominated by a single missense founder allele,
    p.G3324R, in an immunoglobulin-like repeat of perlecan domain IV, seen
    either homozygously or in trans with a nonsense or splice-site allele.
    Whether an allele pair produces the hypomorphic Schwartz-Jampel phenotype,
    DDRD, or lethal DDSH is not predictable from variant class alone; see the
    ddsh_ddrd_severity_determinants discussion.
  evidence:
  - reference: PMID:11279527
    reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, DDSH is caused by a functional null mutation of HSPG2.
    explanation: >-
      The gene-identification report for the lethal grade.
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SJS, DDRD, and DDSH are allelic disorders with pathogenic variants in HSPG2.
    explanation: >-
      Extends HSPG2 causation to the nonlethal grade and places all three
      perlecan disorders in one allelic series.
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were homozygous for p.G3324R, and three patients were heterozygous for p.G3324R.
    explanation: >-
      Documents the recurrent founder allele and the homozygous versus compound

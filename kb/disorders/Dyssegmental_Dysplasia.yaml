diagnosis:
- name: Prenatal ultrasound and fetal imaging
  description: >-
    The diagnosis is usually first raised prenatally on limb shortening well
    below the expected range, long-bone bowing, a small thorax and irregular
    vertebral ossification. Three-dimensional ultrasound and CT resolve the
    dumbbell deformity and anisospondyly that distinguish dyssegmental
    dysplasia from other lethal short-limbed dysplasias, and it has been
    detected as early as 13 weeks.
  evidence:
  - reference: PMID:23836246
    reference_title: "Dyssegmental dysplasia, Silverman-Handmaker type: prenatal ultrasound findings and molecular analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DD-SH can be diagnosed prenatally using fetal ultrasound as early as 13 weeks.
    explanation: >-
      States the earliest reported gestational age at prenatal diagnosis.
- name: HSPG2 sequencing
  description: >-
    Molecular confirmation by targeted skeletal-dysplasia panel, exome or
    genome sequencing. Confirmation matters beyond diagnosis: it enables
    preimplantation and prenatal diagnosis in subsequent at-risk pregnancies,
    and it is the only way to separate this disorder from radiographically
    overlapping lethal dysplasias.
  evidence:
  - reference: PMID:23836246
    reference_title: "Dyssegmental dysplasia, Silverman-Handmaker type: prenatal ultrasound findings and molecular analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Silverman-Handmaker type dyssegmental dysplasia (DDSH) is a rare and lethal skeletal dysplasia caused by biallelic null variations in the HSPG2 gene, which encodes the extracellular matrix proteoglycan perlecan.
    explanation: >-
      Contemporary confirmation that biallelic HSPG2 null variation is the
      cause of the lethal grade.
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report that five patients with DDRD carried four pathogenic variants in HSPG2

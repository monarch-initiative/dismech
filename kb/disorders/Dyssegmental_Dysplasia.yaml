name: Dyssegmental Dysplasia
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
description: >-
  Dyssegmental dysplasia (DD) is a rare autosomal recessive skeletal dysplasia
  caused by biallelic loss-of-function variants in HSPG2, the gene encoding
  perlecan — the major heparan sulfate proteoglycan of basement membranes and
  of the cartilage pericellular matrix. Its defining radiographic feature is
  anisospondyly: vertebral ossification centres of irregular size and shape,
  with defective segmentation and fusion of the vertebral bodies, from which
  the disorder takes its name. This is combined with micromelia, short thick
  bowed and dumbbell-shaped tubular bones, a narrow thorax, and a
  characteristic flat facies with short neck, micrognathia and cleft palate.
  Mutant perlecan is retained and degraded intracellularly rather than
  secreted, so the cartilage extracellular matrix is depleted of perlecan; the
  growth-plate columnar architecture and endochondral ossification then fail.
  DD is curated here as one entry spanning its two long-recognized clinical
  grades — the lethal Silverman-Handmaker type (DDSH) and the nonlethal
  Rolland-Desbuquois type (DDRD) — because both are now known to be caused by
  biallelic HSPG2 variants and share a single pathomechanism, differing in the
  amount of residual functional perlecan rather than in kind. Together with
  Schwartz-Jampel syndrome, which arises from hypomorphic alleles of the same
  gene, they form an allelic perlecan gene-dosage series.
parents:
- hereditary disease
- Skeletal Dysplasia
synonyms:
- DD
- dyssegmental dwarfism
- anisospondylic camptomicromelic dwarfism
- dyssegmental dysplasia, Silverman-Handmaker type
- dyssegmental dysplasia, Rolland-Desbuquois type
- DDSH
- DDRD
notes: >-
  ONTOLOGY-ANCHOR NOTE (deliberate; do not "fix" by grounding this entry on one
  of its own subtypes). MONDO has no umbrella class for dyssegmental dysplasia:
  it carries MONDO:0009140 (Silverman-Handmaker type) and MONDO:0009139
  (Rolland-Desbuquois type) as separate leaves, plus the unrelated
  MONDO:0011110 (dyssegmental dysplasia-glaucoma syndrome), but nothing for the
  spectrum concept the literature calls "dyssegmental dysplasia (DD)". Because
  this entry models the shared HSPG2/perlecan pathomechanism rather than either
  severity grade individually, no top-level disease_term is asserted; both leaf
  terms are recorded as skos:narrowMatch mappings and as subtype_term bindings
  on the two has_subtypes entries. Grounding the spectrum on MONDO:0009140
  would repeat the "spectrum entry grounded to one of its own subtypes" defect
  tracked in monarch-initiative/dismech#8997. A MONDO new-term request for the
  umbrella concept is the correct upstream fix and has not been filed.

  ENTITY-IDENTITY NOTE. Until 2024 the molecular basis of DDRD was formally
  undetermined and only DDSH was attributed to HSPG2. Yamaguchi et al.
  (PMID:38424183) identified biallelic HSPG2 variants in five DDRD patients
  sharing a founder p.G3324R haplotype, and concluded that SJS, DDRD and DDSH
  are allelic disorders. Sources published before 2024 — including the MONDO
  definitions and OMIM 224400 — may still describe DDRD as of unknown cause;
  that is stale, not a contradiction of this entry. The same paper reports that
  a patient previously published as DDSH homozygous for p.G3324R had a
  nonlethal course better fitting DDRD, so published type assignments are not
  fully reliable and the lethal/nonlethal boundary has no agreed threshold
  (see the ddsh_ddrd_severity_determinants discussion).

  Not to be confused with Schwartz-Jampel syndrome
  (kb/disorders/Schwartz-Jampel_Syndrome.yaml), the hypomorphic-allele end of
  the same HSPG2 series, which is a separate entry and a separate row of the
  ISDS nosology.

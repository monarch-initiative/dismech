differential_diagnoses:
- name: Schwartz-Jampel syndrome
  description: >-
    The hypomorphic-allele end of the same HSPG2 series: a nonlethal
    chondrodysplasia with continuous muscle hyperactivity (myotonia) and a
    characteristic mask-like face. Distinguished from dyssegmental dysplasia by
    residual perlecan secretion, survival into adult life, and the dominance of
    the neuromuscular rather than the axial-ossification phenotype — though the
    boundary is not absolute, since mild myotonic features have been reported
    in DDRD.
  distinguishing_features:
  - Hypomorphic HSPG2 alleles permitting reduced perlecan secretion, rather than functional nulls
  - Myotonia and mask-like facies dominate the presentation
  - No anisospondyly
  - Survival into adult life
  evidence:
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Schwartz-Jampel syndrome (SJS) is also caused by biallelic pathogenic variants in HSPG2 and is an allelic disorder of DDSH.
    explanation: >-
      Establishes the allelic relationship that makes SJS the primary
      differential.
- name: Kniest dysplasia
  description: >-
    A COL2A1 type II collagenopathy whose radiographic changes — including
    large coronal clefts of the vertebral bodies — were the original
    comparator for the milder Rolland-Desbuquois grade. Distinguished
    molecularly (COL2A1 rather than HSPG2) and by its nonlethal, myopic and
    hearing-impaired phenotype.
  distinguishing_features:
  - Causal gene COL2A1 rather than HSPG2
  - Coronal clefting without the irregular or absent vertebral ossification centres of DDSH
  - Myopia and sensorineural hearing loss
  evidence:
  - reference: PMID:3605216
    reference_title: "Dyssegmental dysplasias: clinical, radiographic, and morphologic evidence of heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The milder form, "dyssegmental dysplasia, type Rolland-Desbuquois," is characterized clinically by frequent survival beyond the newborn period and by distinct radiographic changes resembling Kniest dysplasia.
    explanation: >-
      Records the radiographic resemblance that makes Kniest dysplasia the
      relevant differential for the milder grade.
discussions:
- discussion_id: ddsh_ddrd_severity_determinants
  prompt: >-
    What determines whether a given biallelic HSPG2 genotype produces
    Schwartz-Jampel syndrome, nonlethal Rolland-Desbuquois dyssegmental
    dysplasia, or lethal Silverman-Handmaker dyssegmental dysplasia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic HSPG2 Loss-of-Function Variation
  - pathophysiology#Failure of Perlecan Secretion into the Extracellular Matrix
  - pathophysiology#Narrow Thorax with Neonatal Respiratory Failure
  rationale: >-
    The three perlecan disorders are allelic, and the intuitive account is a
    gene-dosage series in which residual extracellular perlecan sets severity.
    Three observations keep that account from being settled. First, no
    threshold separating the lethal from the nonlethal grade has been proposed.
    Second, the same p.G3324R allele has been reported homozygously in a
    patient labelled DDSH whose nonlethal course actually fitted DDRD, so
    published grade assignments are partly unreliable and identical genotypes
    have carried different labels. Third, two DDRD patients homozygous for that
    allele differed markedly in when skeletal disease became apparent, which
    the authors attribute to an unidentified modifier gene or environmental
    factor. Perlecan is also a five-domain multifunctional protein, so a
    domain-specific effect is a competing explanation to a purely quantitative
    one. Resolving this matters clinically, because prenatal counselling for a
    newly identified HSPG2 genotype currently cannot predict lethality.
  proposed_experiments:
  - experiment_id: ddsh_ddrd_residual_perlecan_quantification
    name: Quantify secreted perlecan across genotypes of the HSPG2 series
    description: >-
      Measure secreted perlecan in patient fibroblasts from genotype-matched
      SJS, DDRD and DDSH cases, and test whether residual extracellular
      perlecan orders with clinical grade independently of which domain is
      affected. Include the p.G3324R homozygotes, whose divergent courses
      would separate a dose effect from a modifier effect.
  - experiment_id: ddsh_ddrd_domain_iv_knockin
    name: Domain IV missense knock-in mouse
    description: >-
      Knock the DDRD founder allele p.G3324R into the mouse Hspg2
      immunoglobulin-like domain IV repeat and compare it with the existing
      null and hypomorphic lines, to test whether a domain IV missense change
      produces an intermediate phenotype at a perlecan level that a hypomorph
      does not.
  evidence:
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No definite threshold has been proposed to delineate lethal and nonlethal phenotypes.
    explanation: >-
      States directly that no threshold separating the two grades has been
      proposed — the gap recorded here.
  - reference: PMID:38424183
    reference_title: Dyssegmental dysplasia Rolland-Desbuquois type is caused by pathogenic variants in HSPG2 - a founder haplotype shared in five patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presence of an unidentified modifier gene or an unidentified environmental factor might have accounted for the different disease severities.
    explanation: >-
      Records the authors' own reading that genotype alone does not account for
      the severity difference between two homozygotes for the same allele.
tracked_issues:
- url: https://github.com/monarch-initiative/dismech/issues/7867
  title: "Coverage gap: 4 ISDS skeletal-nosology groups have zero dismech entries"
  tracked_issue_role: SOURCE
  notes: >-
    This entry is the second dismech member of the ISDS 2023 group 7
    (proteoglycan core protein disorders), after Schwartz-Jampel syndrome, and
    completes the HSPG2/perlecan arm of that group. The three ACAN disorders
    listed in that issue remain uncurated.
- url: https://github.com/monarch-initiative/dismech/issues/8997
  title: "CRB1_Retinal_Dystrophies: spectrum entry is grounded to one of its own subtypes"
  tracked_issue_role: RELATED
  notes: >-
    The reason this entry asserts no top-level disease_term rather than
    grounding the spectrum on MONDO:0009140. See the ontology-anchor note.
review_notes: >-
  Deliberately left open in this first pass:
  (1) no top-level disease_term — MONDO has no umbrella dyssegmental dysplasia
  class; a MONDO new-term request is the correct upstream fix and has not been
  filed (see notes);
  (2) no Orphanet provenance — ORPHA:1865 (DDSH) and ORPHA:156731 (DDRD) are
  not in references_cache and would need an Orphadata bulk refresh, which would
  also supply HPO frequency annotations;
  (3) no phenotype frequency: bands, per docs/frequency-evidence-guidelines.md,
  since no source in the evidence set quantifies them across a cohort;
  (4) no treatments block — management is supportive (respiratory support,
  tracheostomy) and is described in individual case reports rather than in any
  source that states an intervention-outcome relationship worth curating;
  (5) no histopathology block, although the chondro-osseous light- and
  electron-microscopic differences between the two grades reported in
  PMID:3605216 would support one;
  (6) no conforms_to — as with Schwartz-Jampel syndrome, there is no
  proteoglycan/pericellular-matrix module in kb/modules/ yet. With both HSPG2
  entries now present, and the three ACAN disorders of the same ISDS group
  still to come, a "proteoglycan core protein deficiency" module is the natural
  follow-up once there are enough conformers to justify it;
  (7) perinatal lethality is curated as a progression record rather than as a
  phenotype, because HPO's mortality terms (HP:0003826 Stillbirth,
  HP:0003811 Neonatal death) sit outside the Phenotypic abnormality branch the
  PhenotypeTerm dynamic enum is expanded from;
  (8) the DDRD genetic picture rests on a single Japanese founder haplotype
  (five patients) and should be revisited as further DDRD genotypes are
  published.

        Supports the group's identity and its provenance from the merged 2019
        perlecan group. Note the scope of this citation: the consensus paper's
        text documents the restructuring, while the assignment of dyssegmental
        dysplasia specifically to that group comes from the revision's Table 1
        row for the disorder, which is not quotable from the cached record.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Both clinical grades segregate as autosomal recessive traits. Affected
    individuals carry biallelic (homozygous or compound heterozygous) HSPG2
    variants; parental consanguinity is frequent in DDSH but was absent in all
    five genotyped DDRD patients, who instead shared a founder allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:3605216
    reference_title: "Dyssegmental dysplasias: clinical, radiographic, and morphologic evidence of heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that there are at least two forms of dyssegmental dysplasia, each autosomal recessive, which can be delineated on clinical, radiographic and morphologic grounds.
    explanation: >-
      The clinical-delineation study that separated the two grades states that
      both are autosomal recessive.
  - reference: PMID:11279527
    reference_title: Dyssegmental dysplasia, Silverman-Handmaker type, is caused by functional null mutations of the perlecan gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a homozygous, 89-bp duplication in exon 34 of HSPG2 in a pair of siblings with DDSH born to consanguineous parents
    explanation: >-
      Homozygosity in the offspring of consanguineous parents, consistent with
      the recessive mode recorded here.

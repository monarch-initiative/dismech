- name: Perlecan-null (Hspg2-/-) mouse
  species: Mouse
  genotype: Hspg2 homozygous null (Hspg2-/-)
  publication: PMID:10545953
  description: >-
    Germline disruption of Hspg2. About 40% of nulls die at embryonic day 10.5
    with defective cephalic development; the remainder die just after birth
    with a skeletal dysplasia. The radiographic, clinical and chondro-osseous
    resemblance of this line to human DDSH is what prompted the search for
    HSPG2 mutations in patients, so the model is historically upstream of the
    human gene identification rather than derived from it.

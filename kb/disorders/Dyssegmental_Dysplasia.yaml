      snippet: >-
        Immunostaining and biochemical analysis revealed that the mutant perlecan molecules were unstable and not secreted into the extracellular matrix.
      explanation: >-
        States the direct consequence of the variant on perlecan secretion.
- name: Failure of Perlecan Secretion into the Extracellular Matrix
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Perlecan is the major heparan sulfate proteoglycan of basement membranes
    and is also a component of the cartilage pericellular matrix, even though
    cartilage has no basement membranes. Patient fibroblasts do not secrete the
    truncated protein; it is degraded intracellularly, and patient cartilage
    matrix stains only weakly for perlecan while intracellular inclusion bodies
    stain positively. The result is a functional null for extracellular
    perlecan — the distinction from Schwartz-Jampel syndrome, where hypomorphic
    alleles still permit secretion at a reduced level.

      label: HSPG2
  modeled_mechanisms:
  - target: Cartilage Extracellular Matrix Disorganization
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Null cartilage matrix shows reduced and disorganized collagen fibrils and
      glycosaminoglycans, the tissue-level content of this node.
    limitations: >-
      The mouse is a constitutive whole-body null, whereas human DDSH alleles
      are functional nulls that still produce an intracellularly retained,
      degraded core protein; any gain-of-function or ER-stress contribution
      from the retained human protein is absent from this model.
    readouts:
    - name: Cartilage collagen fibril and glycosaminoglycan organization
      target: Cartilage Extracellular Matrix Disorganization
      direction: DECREASED

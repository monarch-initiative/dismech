classifications:
  isds_skeletal_category:
  - classification_value: proteoglycan_core_protein_disorders
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (11th edition;
      Unger et al., PMID:36779427), group 7 "Proteoglycan core protein
      disorders", which lists "Dyssegmental dysplasia, Silverman-Handmaker and
      Rolland-Desbuquois types" with HSPG2 as a single Table 1 row — the same
      lumping decision this entry makes. In the 2019 revision
      (PMID:31633310) the disorder sat in the separate "Perlecan group"
      alongside Schwartz-Jampel syndrome.
    evidence:
    - reference: PMID:36779427
      reference_title: "Nosology of genetic skeletal disorders: 2023 revision."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the previous “Perlecan group” and “Aggrecan group” were incorporated into the new group of “Proteoglycan core protein disorders”

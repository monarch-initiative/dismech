pathophysiology:
- name: KDELR2 Loss Disables Retrograde Recycling of ER-Resident Chaperones
  description: >-
    KDELR2 encodes KDEL endoplasmic reticulum protein retention receptor 2, a
    cis-Golgi/ERGIC receptor that binds ER-resident proteins carrying a
    KDEL-like C-terminal retrieval signal and recycles them back to the
    endoplasmic reticulum through COPI-mediated retrograde (Golgi-to-ER)
    transport. Biallelic loss-of-function KDELR2 variants map onto the receptor
    structure as inactivating, abolishing KDELR2-mediated Golgi-to-ER transport
    and the retrieval of ER-resident cargoes including the collagen-specific
    chaperone HSP47 (SERPINH1) and FKBP65.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum (KDEL retrieval)
    term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    modifier: DECREASED
  evidence:
  - reference: PMID:33053334
    reference_title: "Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta Caused by Bi-allelic Variants in KDELR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KDELR2 encodes KDEL endoplasmic reticulum protein retention receptor 2,
      which recycles ER-resident proteins with a KDEL-like peptide from the
      cis-Golgi to the ER through COPI retrograde transport.
    explanation: >-
      Defines the normal KDELR2 function (COPI retrograde recycling of
      ER-resident proteins from cis-Golgi to ER) that is lost in OI type XXI.
  - reference: PMID:33053334
    reference_title: "Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta Caused by Bi-allelic Variants in KDELR2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mapping the identified KDELR2 variants onto the crystal structure of G.
      gallus KDELR2 indicated that these lead to an inactive receptor resulting
      in impaired KDELR2-mediated Golgi-ER transport.
    explanation: >-
      Documents that the OI type XXI KDELR2 variants inactivate the receptor and
      abolish Golgi-to-ER retrograde transport, the proximal lesion.
  downstream:
  - target: Failure to Release and Recycle HSP47 from Procollagen
    description: >-
      Without functional KDELR2-mediated retrieval, HSP47 is not released from
      collagen type I and is not recycled to the ER, depleting intracellular
      HSP47.
  - target: Impaired GSK3-beta/Beta-Catenin Osteoblast Differentiation Signaling
    description: >-
      Loss of KDELR2 is additionally proposed, on the basis of murine
      bone-marrow-stromal-cell data, to lower canonical GSK3-beta/beta-catenin
      signaling and thereby impair osteoblastic differentiation. This arm is
      model-derived and has not been demonstrated in KDELR2-deficient human
      cells or patients; see discussion
      `gap_oi21_kdelr2_wnt_arm_human_translation`.
- name: Impaired GSK3-beta/Beta-Catenin Osteoblast Differentiation Signaling
  biological_scale: CELLULAR
  description: >-
    A candidate second, collagen-independent arm of KDELR2 bone pathology,
    established so far only in mouse bone-marrow mesenchymal stromal cells
    (mBMSCs). Lentiviral KDELR2 knockdown inhibited osteogenic differentiation of
    mBMSCs while KDELR2 overexpression enhanced it, and the levels of
    active beta-catenin and inhibitory phospho-GSK3-beta (Ser9) tracked KDELR2
    dose in the same direction; mBMSCs overexpressing KDELR2 promoted healing in
    a mouse fracture model. The authors conclude that KDELR2 promotes osteogenesis
    by regulating GSK3-beta/beta-catenin signaling. If it operates in patients,
    this arm would place OI type XXI alongside the WNT-pathway OI types (notably
    WNT1-related OI type XV and MESD-related OI type XX, in which LRP5/6-mediated
    canonical WNT signaling to the osteoblast is the primary lesion) rather than
    positioning it purely as a chaperone-recycling collagen-quality disorder.
    It is modeled here as an explicitly model-derived, parallel arm and NOT as an
    established human mechanism: no KDELR2-deficient patient cell or patient
    cohort study has tested osteoblast WNT signaling, and the defining human
    report attributes the disease to failed HSP47 release from collagen type I.
  cell_types:
  - preferred_term: bone marrow mesenchymal stromal cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway (GSK3-beta/beta-catenin)
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:38470494
    reference_title: "KDELR2 promotes bone marrow mesenchymal stem cell osteogenic differentiation via GSK3β/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      KDELR2 knockdown inhibited the osteogenic differentiation of
      mBMSCs, whereas KDELR2 overexpression had the opposite effect.
    explanation: >-
      Shows in cultured mouse bone-marrow mesenchymal stromal cells that KDELR2
      is required for osteogenic differentiation, the cellular deficit proposed
      for this arm. Mouse cell culture, not human patient cells.
  - reference: PMID:38470494
    reference_title: "KDELR2 promotes bone marrow mesenchymal stem cell osteogenic differentiation via GSK3β/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the levels of active-β-catenin and phospho-GSK3β (Ser9) were upregulated by
      KDELR2 overexpression and downregulated by KDELR2 knockdown.
    explanation: >-
      Identifies the GSK3-beta/beta-catenin axis as the signaling readout that
      tracks KDELR2 dose, the proposed molecular link between KDELR2 loss and
      impaired osteoblast differentiation.
  - reference: PMID:38470494
    reference_title: "KDELR2 promotes bone marrow mesenchymal stem cell osteogenic differentiation via GSK3β/β-catenin signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the fracture model, mBMSCs overexpressing KDELR2 promoted healing.
    explanation: >-
      In vivo mouse fracture-model evidence that KDELR2 level influences bone
      formation, supporting relevance of this arm to bone biology while leaving
      the human OI type XXI question open.
  downstream:
  - target: Defective Bone Collagen Matrix and Skeletal Fragility
    description: >-
      Reduced osteoblastic differentiation would lower bone formation and so
      compound, rather than replace, the collagen-quality defect in producing low
      bone mass and fragility. The edge is proposed on model-system grounds only.
- name: Failure to Release and Recycle HSP47 from Procollagen
  description: >-
    Normally HSP47 binds the type I procollagen triple helix in the ER and is
    released from procollagen in the lower-pH cis-Golgi/ERGIC, then retrieved to
    the ER by KDELR2 for reuse. When KDELR2 is inactive, HSP47 cannot bind KDELR2
    and therefore cannot dissociate from collagen type I; it remains bound to
    monomeric and multimeric collagen molecules. Patient fibroblasts show an
    intracellular decrease of HSP47 (and FKBP65) with reduced procollagen type I
    in culture media, and electron microscopy shows abnormal secreted collagen
    fibrils with increased HSP47 bound to collagen. This is the mechanistic
    mirror of OI type X, in which HSP47 (SERPINH1) is itself lost.

    reference_title: "Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta Caused by Bi-allelic Variants in KDELR2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Instead, HSP47 remains bound to collagen molecules extracellularly,
      disrupting fiber formation.
    explanation: >-
      Documents that retained HSP47 on secreted collagen disrupts fibril
      formation, the matrix defect underlying OI type XXI bone fragility.
  - reference: PMID:38014644
    reference_title: "Assessing type I collagen expression and quality in cellular models of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cell phenotypic assays of pro-α1(I) in OI-related gene knocked down
      fibroblasts revealed aggregates of pro-α1(I) in conditions with knockdown
      of SERPINF1, CRTAP, P3H1, PPIB, SERPINH1, FKBP10, TMEM38B, MESD, and
      KDELR2
    explanation: >-
      Cellular OI model shows abnormal pro-alpha1(I) aggregation upon KDELR2
      knockdown, supporting the defective collagen handling of OI type XXI.
discussions:
- discussion_id: gap_oi21_kdelr2_wnt_arm_human_translation
  prompt: >-
    Does the KDELR2-dependent GSK3-beta/beta-catenin osteoblast-differentiation
    arm demonstrated in mouse bone-marrow mesenchymal stromal cells actually
    operate in KDELR2-deficient human patients, or is human OI type XXI driven
    solely by the failure of HSP47 release from collagen type I? Concretely: do
    osteoblasts differentiated from OI type XXI patient cells show reduced active
    beta-catenin, reduced inhibitory phospho-GSK3-beta (Ser9), and impaired
    osteogenic differentiation independently of the collagen-quality defect — and
    if so, does that reclassify OI type XXI as a partly WNT-pathway OI alongside
    WNT1-related type XV and MESD-related type XX?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired GSK3-beta/Beta-Catenin Osteoblast Differentiation Signaling
  - pathophysiology#KDELR2 Loss Disables Retrograde Recycling of ER-Resident Chaperones
  rationale: >-
    This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because evidence
    for the mechanism does exist — it is just entirely non-human. Wu et al. 2024
    (PMID:38470494) show in mouse bone-marrow mesenchymal stromal cells and a
    mouse fracture model that KDELR2 level bidirectionally controls osteogenic
    differentiation through GSK3-beta/beta-catenin signaling, and explicitly
    motivate the work by noting that KDELR2 "has been found that involved in
    osteogenesis imperfecta. However, the exact mechanism is still unclear." The
    human defining study (van Dijk et al. 2020, PMID:33053334) instead localizes
    the lesion to failed KDELR2-mediated HSP47 retrieval, with HSP47 retained on
    secreted collagen disrupting fibril formation, and does not assay WNT
    signaling. The two accounts are not contradictory — a chaperone-recycling
    receptor could plausibly do both — but their relative contribution in patients
    is untested, and the translational risk is concrete: mouse BMSC osteogenic
    differentiation assays are a general osteogenesis readout that responds to many
    perturbations, and overexpression/knockdown of a Golgi receptor in a
    non-patient background need not reproduce the biallelic hypomorphic human
    genotype. Curating the WNT arm as an established human mechanism would
    therefore overstate the evidence, so it is modeled as an explicitly
    model-derived parallel arm with this mismatch recorded.
  proposed_experiments:
  - experiment_id: exp_oi21_patient_osteoblast_wnt_readout
    name: >-
      Canonical WNT signaling and osteogenic differentiation in KDELR2-deficient
      patient-derived human osteoblasts
    description: >-
      Differentiate osteoblasts from OI type XXI patient-derived cells (primary
      fibroblast-reprogrammed iPSCs, or CRISPR-engineered KDELR2-null human iPSCs
      with isogenic controls) and quantify active (non-phospho) beta-catenin,
      phospho-GSK3-beta (Ser9), TCF/LEF reporter activity, osteoblast markers
      (RUNX2, SP7, ALPL), and in-vitro mineralization. A positive result would
      confirm that the murine GSK3-beta/beta-catenin arm operates in human
      KDELR2 deficiency; a negative result would confine human OI type XXI to the
      HSP47-collagen mechanism and mark the mouse finding as species- or
      assay-specific.
    experiment_type:
      preferred_term: patient-derived osteoblast differentiation and WNT reporter assay
    model_systems:
    - name: KDELR2-deficient human iPSC-derived osteoblast
      description: >-
        Osteoblasts differentiated from OI type XXI patient-derived or
        CRISPR-edited KDELR2-null human iPSCs, compared with isogenic
        KDELR2-intact controls.
      experimental_model_type: IPSC_DERIVED_MODEL
  - experiment_id: exp_oi21_wnt_vs_collagen_arm_separation
    name: >-
      Separating the WNT-signaling arm from the HSP47-collagen arm in
      KDELR2-deficient cells
    description: >-
      In KDELR2-deficient human osteoblasts, test whether pharmacological or
      genetic restoration of canonical WNT signaling (e.g., GSK3-beta inhibition)
      rescues osteogenic differentiation and mineralization while the secreted
      collagen fibril abnormality and HSP47 retention persist — and conversely
      whether forced HSP47 release corrects collagen quality without restoring
      WNT signaling. Dissociating the two readouts would establish whether the
      arms are independent contributors or whether the WNT readout is a downstream
      consequence of defective collagen matrix production.
    experiment_type:
      preferred_term: pathway-rescue epistasis assay
    model_systems:
    - name: KDELR2-deficient patient primary fibroblast and derived osteoblast
      description: >-
        Cultured OI type XXI patient fibroblasts (in which intracellular HSP47 and
        FKBP65 depletion and abnormal secreted collagen fibrils are already
        documented) and osteoblasts derived from them, used to test rescue of one
        arm without the other.
      experimental_model_type: PRIMARY_CELL_CULTURE
  notes: >-
    Raised during the issue #5079 second-pass review of OI types IX-XXIII. If
    resolved in favor of the WNT arm, OI type XXI would additionally warrant
    consideration against the WNT/osteoblast mechanism shared with OI types XV
    (WNT1) and XX (MESD), and the `Osteogenesis_Imperfecta` grouping's
    differentiating-mechanism text for this member should be revisited.
genetic:
- name: KDELR2 Loss-of-Function Mutations
  association: Causative
  gene_term:
    preferred_term: KDELR2 (KDEL endoplasmic reticulum protein retention receptor 2)
    term:
      id: hgnc:6305
      label: KDELR2
  notes: >-
    OI type XXI is caused by biallelic (homozygous or compound heterozygous)
    loss-of-function variants in KDELR2. The defining report (van Dijk et al.
    2020, PMID:33053334) identified bi-allelic pathogenic KDELR2 variants in four
    families; the variants map onto the KDELR2 structure as inactivating,
    abolishing receptor-mediated Golgi-to-ER retrograde transport. A second cohort
    (Efthymiou et al. 2021, PMID:33964184) reported two additional biallelic
    KDELR2 missense variants (a homozygous R5W substitution in two Pakistani
    siblings and a homozygous Y162C substitution in a Turkish boy) in children
    with progressively deforming recessive OI, expanding the phenotypic spectrum
    to include neurodevelopmental features (motor delay and speech delay) alongside
    the recessive OI signs (short stature, wormian bones, bowed limbs, chest
    deformity, hypotonia, joint hypermobility, blue sclerae, and dentinogenesis
    imperfecta). Those extended phenotype descriptors are recorded here as notes
    rather than as separately modeled phenotype evidence because the Efthymiou et
    al. 2021 report has no PubMed abstract and its phenotype detail resides only in
    the figures/full text, so an exact-quote snippet cannot be validated against
    the cached reference (per the CLAUDE.md evidence SOP).
  evidence:
  - reference: PMID:33053334
    reference_title: "Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta Caused by Bi-allelic Variants in KDELR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified bi-allelic pathogenic KDELR2 variants as a cause of OI in
      four families.
    explanation: >-
      Identifies biallelic KDELR2 variants as the cause of OI type XXI in the
      defining cohort of four families.
  - reference: PMID:39127989
    reference_title: "Update on the Genetics of Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a special emphasis on discoveries of recessive mutations in
      TENT5A, MESD, KDELR2 and CCDC134 whose causality of OI types XIX, XX, XXI
      and XXI, respectively, is now established
    explanation: >-
      A 2024 genetics review confirms recessive KDELR2 mutations as the
      established cause of OI type XXI (the CCDC134/type XXII numbering in the
      source list is a typographical error for type XXII).

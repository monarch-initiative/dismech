diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XXI is suspected in an infant or child with severe recessive OI
    (recurrent fractures, low bone mineral density, deformity) when COL1A1/COL1A2
    and other recessive OI genes are negative. Diagnosis is confirmed by
    identifying biallelic KDELR2 loss-of-function variants by gene-panel or exome
    sequencing. Supportive cellular findings include intracellular HSP47/FKBP65
    depletion with abnormal secreted collagen fibrils.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:33053334
    reference_title: "Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta Caused by Bi-allelic Variants in KDELR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified bi-allelic pathogenic KDELR2 variants as a cause of OI in
      four families.
    explanation: >-
      Molecular identification of biallelic KDELR2 variants establishes the
      diagnosis of OI type XXI.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the
    pharmacological mainstay of severe OI, increasing bone mineral density and
    reducing fracture frequency. They are antiresorptive and do not correct the
    underlying KDELR2/HSP47 chaperone-recycling defect.

      progenitor cells (NPCs) in mice, resulting in an abnormally increased number
      of projection neurons in the superficial layers of the neocortex.
    explanation: >-
      The opposite direction in vivo: progenitors differentiate less, not more.
      Carried as a refutation of the directional reading of this node, which is
      why the node asserts a disturbed balance instead.
  downstream:
  - target: Disordered Cortical Neurogenesis
    causal_link_type: DIRECT
    description: >-
      Whichever direction the balance shifts, the cortex is built from the wrong
      number of cells at the wrong time; the mouse work states the outcome as
      neocortical dysgenesis.
    evidence:
    - reference: PMID:27798144
      reference_title: In Utero Exposure to Valproic Acid Induces Neocortical Dysgenesis via Dysregulation of Neural Progenitor Cell Proliferation/Differentiation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together, our findings show that VPA exposure in utero alters
        proliferation/differentiation characteristics of neural progenitor cells and
        hence leads to the neocortical dysgenesis.
      explanation: The authors' own statement of this edge.
    - reference: PMID:36523605
      reference_title: Valproic acid exposure decreases neurogenic potential of outer radial glia in human brain organoids.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        VPA exposure typically decreased the production of outer radial glia-like
        cells (oRGs), a subtype of NPCs contributing to mammalian neocortical
        expansion and delayed their fate toward upper-layer neurons.
      explanation: >-
        The human version of the same edge, through the progenitor subtype that
        expands the neocortex.
- name: Neuroepithelial Senescence
  biological_scale: CELLULAR
  description: >-
    Exposed neuroepithelium induces cellular senescence, and genetic dissection
    identifies p19Arf as the mediator. The same work makes an unusually clean
    negative claim: p19Arf accounts for the brain-growth deficit but not for
    exencephaly or the spinal defects, so this node feeds the neurogenesis arm
    only and is deliberately not connected to neural tube closure.
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  - preferred_term: neurogenesis
    modifier: DECREASED
    term:
      id: GO:0022008
      label: neurogenesis
  cell_types:
  - preferred_term: neuroepithelial stem cell
    term:
      id: CL:0002259
      label: neuroepithelial stem cell
  evidence:
  - reference: PMID:35700169
    reference_title: Aberrant induction of p19Arf-mediated cellular senescence contributes to neurodevelopmental defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Critically, through genetic and functional studies, we identified p19Arf as
      the instrumental mediator of senescence and microcephaly, but, surprisingly,
      not exencephaly and spinal defects.
    explanation: >-
      Establishes the mediator and, in the same sentence, bounds which outcomes it
      explains — which is why this node has one downstream target and not two.
  - reference: PMID:35700169
    reference_title: Aberrant induction of p19Arf-mediated cellular senescence contributes to neurodevelopmental defects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we identified p19Arf as the instrumental mediator of senescence and
      microcephaly
    explanation: >-
      Names the mediator, quoted as a mouse-genetics result rather than from the
      paper's mixed mouse-and-organoid summary sentence, so the evidence_source is
      unambiguous.
  downstream:
  - target: Disordered Cortical Neurogenesis
    causal_link_type: DIRECT
    description: >-
      Senescent neuroepithelial cells are permanently arrested, and the paper
      locates them in tissue where neurogenesis is already defective.
    evidence:
    - reference: PMID:35700169
      reference_title: Aberrant induction of p19Arf-mediated cellular senescence contributes to neurodevelopmental defects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together, these findings demonstrate that misregulated senescence in NE
        cells can contribute to developmental defects.
      explanation: The authors' statement of the edge, hedged as a contribution.
  notes: >-
    The microcephaly this mechanism produces in the mouse is not a reliable human
    feature: a Nordic cohort of 4.5 million children found no association between
    prenatal valproate and microcephaly or small-for-gestational-age birth
    (PMID:38476755). See the fvs_microcephaly_mismatch discussion.
- name: Impaired Dendritic Morphogenesis and Synapse Maturation
  biological_scale: CELLULAR
  description: >-
    In human neurons, exposure impairs dendritic morphology and function through
    HDAC and GSK-3 inhibition with MARCKSL1 as a named mediator. The finding that
    matters clinically is the restriction: immature neurons are damaged and mature
    ones are not. That makes this the branch that explains why exposure after
    organogenesis still harms neurodevelopment, and why the neurodevelopmental
    phenotype extends beyond children with malformations.
  biological_processes:
  - preferred_term: dendrite morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048813
      label: dendrite morphogenesis
  genes:
  - preferred_term: MARCKSL1
    term:
      id: hgnc:7142
      label: MARCKSL1
  evidence:
  - reference: PMID:31155484
    reference_title: Direct Reprogramming of Human Neurons Identifies MARCKSL1 as a Pathogenic Mediator of Valproic Acid-Induced Teratogenicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      VPA exposure caused chronic impairment of dendritic morphology and functional
      properties of developing neurons, but not those of mature neurons.
    explanation: >-
      The developmental restriction, which is the substance of this node rather
      than the impairment alone.
  - reference: PMID:31155484
    reference_title: Direct Reprogramming of Human Neurons Identifies MARCKSL1 as a Pathogenic Mediator of Valproic Acid-Induced Teratogenicity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our findings identify a developmentally restricted pathogenic mechanism of
      VPA and establish the use of reprogrammed neurons as an effective platform
      for modeling teratogenic pathways.
    explanation: The authors' summary of the mechanism as developmentally restricted.
  downstream:
  - target: Altered Neural Circuit Formation
    causal_link_type: DIRECT
    description: >-
      Dendrites and synapses are the substrate of circuits, and the protein named
      here is described as essential for exactly those processes.
    evidence:
    - reference: PMID:31155484
      reference_title: Direct Reprogramming of Human Neurons Identifies MARCKSL1 as a Pathogenic Mediator of Valproic Acid-Induced Teratogenicity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        MARCKSL1, an actin-stabilizing protein essential for dendritic morphogenesis
        and synapse maturation during early neurodevelopment
      explanation: Names the downstream processes the mediator is required for.
- name: Disordered Cortical Neurogenesis
  biological_scale: TISSUE
  description: >-
    The cortex is assembled with altered progenitor output: fewer outer radial
    glia in human organoids, excess superficial-layer projection neurons in mouse,
    and reduced Purkinje cell number in the rat cerebellum. The lamination and
    cell-number abnormalities are the tissue-level bridge between the progenitor
    disturbance and the behavioural outcome.
  biological_processes:
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:27798144
    reference_title: In Utero Exposure to Valproic Acid Induces Neocortical Dysgenesis via Dysregulation of Neural Progenitor Cell Proliferation/Differentiation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      increases the production of projection neurons distributed in the superficial
      neocortical layers in embryonic brains
    explanation: A specific laminar abnormality, not simply "abnormal cortex".
  - reference: PMID:10840175
    reference_title: Prenatal exposure of rats to valproic acid reproduces the cerebellar anomalies associated with autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Compared to controls, rats exposed to a single dose of 600-mg/kg sodium
      valproate on embryonic day 12.5 had significantly fewer Purkinje cells in the
      cerebellar vermis and a reduction short of significant in the hemispheres.
    explanation: >-
      Extends the neurogenesis deficit beyond the neocortex, with a regional gradient
      within the cerebellum.
  - reference: PMID:10840175
    reference_title: Prenatal exposure of rats to valproic acid reproduces the cerebellar anomalies associated with autism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results parallel those reported for human cases of autism."
    explanation: >-
      A cross-species validity remark about the Purkinje finding. Attached to this
      node rather than to any causal edge, because it compares neuropathology and
      does not assert a step.
  downstream:
  - target: Altered Neural Circuit Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Building the cortex and cerebellum with the wrong cell numbers and laminar
      distribution is taken to alter the circuits they form. This edge carries no
      evidence of its own on purpose: no cited experiment follows a specific
      cytoarchitectural change through to a circuit measurement, and the one sentence
      that might have been used here — that the rat cerebellar findings parallel
      human autism neuropathology — is a cross-species validity remark about Purkinje
      counts, not a statement about this step. It is attached to the source node
      instead.
- name: Altered Neural Circuit Formation
  biological_scale: TISSUE
  description: >-
    Circuits assembled from disordered neurogenesis and from neurons whose dendrites
    and synapses matured abnormally. This node is the circuit-level step only; the
    clinical consequence is the separate organism-scale node below, because no cited
    experiment follows a circuit measurement through to a cognitive score and
    bundling the two would hide that gap.
  biological_processes:
  - preferred_term: neurogenesis
    modifier: ABNORMAL
    term:
      id: GO:0022008
      label: neurogenesis
  - preferred_term: dendrite morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048813
      label: dendrite morphogenesis
  evidence:
  - reference: PMID:41935183
    reference_title: Assessing molecular gene by treatment interactions using a population of neural progenitors exposed to valproic acid and lithium.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene regulatory responses to valproic acid (VPA), which is also a prenatal risk
      factor for autism, and lithium were highly enriched in genetic risk for
      psychiatric disorders, demonstrating the convergence of environmental and
      genetic factors.
    explanation: >-
      Connects the molecular response in human progenitors to the same genetic risk
      that underlies the clinical outcomes, which is the closest cited link between
      the mechanism and the phenotype.
  downstream:
  - target: Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from altered circuits to measured cognition and behaviour. It carries
      no evidence because none exists in the cited literature: the human evidence for
      the outcome is epidemiological, and the mechanistic evidence stops at the
      cellular and tissue level. The edge is asserted as the entry's inference and
      labelled as such.
- name: Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >-
    The clinical outcome of the neurodevelopmental arm: reduced IQ with a
    disproportionate verbal deficit, language impairment, autism and ADHD. The
    evidence here is epidemiological and dose-dependent rather than mechanistic,
    which is why it sits in its own node rather than inside the circuit-level one.
  evidence:
  - reference: PMID:23352199
    reference_title: "Fetal antiepileptic drug exposure and cognitive outcomes at age 6 years (NEAD study): a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      age-6 IQ was lower after exposure to valproate (mean 97, 95% CI 94-101) than
      to carbamazepine
    explanation: >-
      The human cognitive outcome, measured against other antiseizure medications
      rather than against no exposure, which controls for maternal epilepsy.
  - reference: PMID:23352199
    reference_title: "Fetal antiepileptic drug exposure and cognitive outcomes at age 6 years (NEAD study): a prospective observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High doses of valproate were negatively associated with IQ (r=-0·56, p<0·0001)
    explanation: >-
      The dose-response for the cognitive outcome, which is the feature of the human
      evidence that most supports causation.
phenotypes:
- name: Cognitive impairment
  category: Neurologic
  frequency: FREQUENT
  diagnostic: true
  description: >-
    The defining feature of the spectrum and the commonest one. Group studies of
    exposed children put the IQ deficit at 8-10 points; in individuals carrying a
    clinical diagnosis of the syndrome it is about 19 points, with a
    characteristic verbal-comprehension shortfall. The consensus statement makes
    the point that cognitive impairment is commoner than malformation, which is
    why it is curated as the leading phenotype and not as a complication of the
    malformations.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:31324220
    reference_title: "Diagnosis and management of individuals with Fetal Valproate Spectrum Disorder; a consensus statement from the European Reference Network for Congenital Malformations and Intellectual Disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There is replicated evidence of a reduction in IQ of 8–10 points compared to
      unexposed individuals and specific deficits in verbal skills
    explanation: The group-level deficit, described by the consensus as replicated.
  - reference: PMID:30453023
    reference_title: Intellectual functioning in clinically confirmed fetal valproate syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty one percent of cases demonstrated disproportionately lower verbal
      comprehension ability.
    explanation: >-
      The verbal-specific profile in individuals with a confirmed diagnosis, which
      distinguishes this from uniform global impairment.
  - reference: PMID:31324220
    reference_title: "Diagnosis and management of individuals with Fetal Valproate Spectrum Disorder; a consensus statement from the European Reference Network for Congenital Malformations and Intellectual Disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The fact that the prevalence of the cognitive and neuropsychological deficits
      after VPA exposure is higher than that of the prevalence of VPA associated
      malformations suggests that an individual can demonstrate adverse effects of
      VPA exposure without necessarily having all of the physical features seen in
      FVS.
    explanation: >-
      States that this phenotype is commoner than the malformations and occurs
      without them, which is the ordering this entry follows.
  - reference: PMID:37666366
    reference_title: "Neurodevelopmental outcomes in children and adults with Fetal Valproate Spectrum Disorder: A contribution from the ConcePTION project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with a diagnosis of FVSD showed significantly higher levels of
      moderate (43.4%) and severe (14.4%) cognitive impairment than other groups
      (p = 0.003), high levels of required formal educational support (77.6%), and
      poorer academic competence than individuals not exposed to Valproate (p =
      0.001).
    explanation: >-
      The proportion with measurable impairment among individuals carrying the
      diagnosis — 57.8% moderate or severe — which is where the FREQUENT band comes
      from. No source puts this phenotype above 80%, which is why the band is not
      VERY_FREQUENT.
- name: Intellectual disability
  category: Neurologic
  frequency: OCCASIONAL
  description: >-
    IQ below 70 in about a quarter of individuals with a confirmed diagnosis. At
    population level the risk is raised several-fold, and the association holds
    within mothers with epilepsy, so it is not explained by the indication.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:30453023
    reference_title: Intellectual functioning in clinically confirmed fetal valproate syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean full-scale IQ in 31 individuals with FVS (mean age 14.97; range 6-27
      years) was 19 points lower (19.55, 95% CI -24.94 to 14.15), and IQ scores <70
      were present in 26%.
    explanation: The proportion below the intellectual disability threshold, in diagnosed cases.
  - reference: PMID:33170264
    reference_title: Association of Prenatal Exposure to Valproate and Other Antiepileptic Drugs With Intellectual Disability and Delayed Childhood Milestones.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among mothers with epilepsy, offspring exposed prenatally to valproate had
      increased risk of intellectual disability (aHR, 1.95; 95% CI, 1.21-3.14)
    explanation: >-
      The association within mothers with epilepsy, which is the comparison that
      removes the indication as an explanation.
  - reference: PMID:35639399
    reference_title: Association of Prenatal Exposure to Antiseizure Medication With Risk of Autism and Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In same-aged children of mothers with epilepsy exposed to topiramate and
      valproate monotherapy, 4.3% and 2.7%, respectively, had ASD, and 3.1% and 2.4%
      had ID.
    explanation: >-
      Population-level absolute risks from a Nordic cohort of 4.5 million children,
      within mothers with epilepsy. These are the figures the frequency band uses for
      the per-exposed-pregnancy denominator.

- name: Delayed speech and language development
  category: Neurologic
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Speech delay is the single commonest reported problem in clinic series of
    fetal anticonvulsant syndrome, and language impairment persists beyond early
    childhood. It is prominent enough that MONDO's own definition singles out
    language and communication.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  evidence:
  - reference: PMID:10882750
    reference_title: A clinical study of 57 children with fetal anticonvulsant syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty four (77%) had learning difficulties, 46 (81%) had speech delay, 34
      (60%) had gross motor delay, and 24 (42%) had fine motor delay.
    explanation: >-
      The frequency in a clinic-ascertained series in which 60% were exposed to
      valproate alone.
  - reference: PMID:10882750
    reference_title: A clinical study of 57 children with fetal anticonvulsant syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Speech delay, joint laxity, glue ear, and myopia are common in the fetal
      anticonvulsant syndromes and autistic features and hyperactivity form part of
      the behavioural phenotype.
    explanation: The authors' own summary of which features are common.
  notes: >-
    The series is clinic- and support-group-ascertained, so 81% is an upper bound
    rather than a population frequency. The frequency band here reflects the
    consistency of language involvement across sources, not this number alone.
- name: Language impairment
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Persisting language impairment beyond the early delay, recorded separately
    because it is what the verbal-comprehension deficit looks like at school age
    and later.
  phenotype_term:
    preferred_term: Language impairment
    term:
      id: HP:0002463
      label: Language impairment
  evidence:
  - reference: PMID:31324220
    reference_title: "Diagnosis and management of individuals with Fetal Valproate Spectrum Disorder; a consensus statement from the European Reference Network for Congenital Malformations and Intellectual Disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      as well as language impairment and poorer levels of daily living skills
    explanation: >-
      Names language impairment alongside the IQ reduction as a replicated finding.
- name: Autism
  category: Behavioral
  frequency: OCCASIONAL
  description: >-
    Autism is the neurodevelopmental diagnosis most strongly associated with the
    exposure: 2.7% to 10.5% of exposed children in population cohorts, 6-15% of
    exposed individuals by the consensus statement's reckoning, a threefold pooled
    hazard overall and sixfold above 1 g/day, and 62.9% among individuals who
    already carry a clinical diagnosis. The frequency band follows the population
    denominator; the diagnosed-cohort figure is far higher because that cohort is
    selected on being affected. The presentation is reported to differ
    from idiopathic autism in having an even sex ratio and no regression.
  phenotype_term:
    preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  evidence:
  - reference: PMID:31324220
    reference_title: "Diagnosis and management of individuals with Fetal Valproate Spectrum Disorder; a consensus statement from the European Reference Network for Congenital Malformations and Intellectual Disability."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The prevalence of autism spectrum disorder (ASD) is 6–15% in VPA exposed
      individuals
    explanation: >-
      The frequency among exposed individuals. The band follows the
      per-exposed-pregnancy denominator, where the population cohorts put autism at
      2.7-10.5%; the 62.9% figure in this phenotype's description is the proportion
      among individuals already carrying the clinical diagnosis, a different
      denominator that would give VERY_FREQUENT and is not what the band reports.
  - reference: PMID:40059353
    reference_title: "Gestational Exposure to Valproate and Autism Spectrum Disorder or Attention-Deficit/Hyperactivity Disorder in Offspring: Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gestational exposure to valproate was associated with an increased risk of ASD
      and ADHD; the risks for ASD were greater at doses ≥ 1000 mg/day.
    explanation: The pooled estimate across eight cohorts totalling six million children.
  - reference: PMID:40059353
    reference_title: "Gestational Exposure to Valproate and Autism Spectrum Disorder or Attention-Deficit/Hyperactivity Disorder in Offspring: Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, anytime gestational exposure to high-dose valproate (> 1.0 to 1.1
      g/day) was associated with a substantially elevated risk of ASD (aHR, 6.32;
      95% CI, 3.12-12.80, N = 1,719,825).
    explanation: >-
      Dose dependence of the autism risk. The discordant-sibling analysis in the same
      paper addresses confounding by family; the monotherapy analysis addresses
      polytherapy rather than confounding by indication, since every exposed mother
      has the indication and that analysis has no active comparator.
  - reference: PMID:16108456
    reference_title: Characteristics of fetal anticonvulsant syndrome associated autistic disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal anticonvulsant syndrome associated autistic disorder is characterized by
      an even sex ratio, absence of regression or skill loss, and language delay in
      the absence of global delay.
    explanation: >-
      The phenotypic differences from idiopathic autism, which is why this is curated
      as a feature of the syndrome rather than only as an increased risk.
  - reference: PMID:35639399
    reference_title: Association of Prenatal Exposure to Antiseizure Medication With Risk of Autism and Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In same-aged children of mothers with epilepsy exposed to topiramate and
      valproate monotherapy, 4.3% and 2.7%, respectively, had ASD, and 3.1% and 2.4%
      had ID.
    explanation: >-
      Population-level absolute risks from a Nordic cohort of 4.5 million children,
      within mothers with epilepsy. These are the figures the frequency band uses for
      the per-exposed-pregnancy denominator.
  - reference: PMID:38507750
    reference_title: "Risk of Autism after Prenatal Topiramate, Valproate, or Lamotrigine Exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With restriction to children born to mothers with epilepsy, the incidence was
      4.2% with no exposure to antiseizure medication (8815 children), 6.2% with
      exposure to topiramate (1030 children), 10.5% with exposure to valproate (800
      children), and 4.1% with exposure to lamotrigine (4205 children).
    explanation: >-
      The strongest available control for confounding by indication: topiramate and
      lamotrigine act as internal comparators within mothers with epilepsy, and only
      valproate separates from no exposure.
  - reference: PMID:37666366
    reference_title: "Neurodevelopmental outcomes in children and adults with Fetal Valproate Spectrum Disorder: A contribution from the ConcePTION project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rates of neurodevelopmental disorders, particularly autistic spectrum disorders
      (62.9%) and sensory problems (80.6%) are particularly central to the FVSD
      phenotype.
    explanation: >-
      The 62.9% figure quoted in this phenotype's description, which was previously
      asserted without its source attached. The denominator is individuals already
      diagnosed, not exposed pregnancies.
- name: Attention deficit hyperactivity disorder
  category: Behavioral
  frequency: OCCASIONAL
  description: >-
    ADHD at an absolute 15-year risk of 11% after exposure against 4.6%
    unexposed. The relative increase is modest beside the autism signal, and the
    Danish cohort found it for valproate and not for other antiepileptic drugs.
  phenotype_term:
    preferred_term: Attention deficit hyperactivity disorder
    term:
      id: HP:0007018
      label: Attention deficit hyperactivity disorder
  evidence:
  - reference: PMID:30646190
    reference_title: Association of Prenatal Exposure to Valproate and Other Antiepileptic Drugs With Risk for Attention-Deficit/Hyperactivity Disorder in Offspring.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absolute 15-year risk of ADHD was 4.6% (95% CI, 4.5%-4.6%) in children
      unexposed to valproate and 11.0% (95% CI, 8.2%-14.2%) in children who were
      exposed to valproate in pregnancy.
    explanation: >-
      The absolute risks, which is what the frequency band is taken from: 11% sits in
      the OCCASIONAL range.
  - reference: PMID:30646190
    reference_title: Association of Prenatal Exposure to Valproate and Other Antiepileptic Drugs With Risk for Attention-Deficit/Hyperactivity Disorder in Offspring.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No associations were found between other AEDs and ADHD."
    explanation: >-
      Specificity to valproate among antiepileptic drugs, which argues against the
      maternal illness explaining it.
- name: Motor delay
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Gross motor delay in about 60% and fine motor delay in about 40% of a clinic
    series. Motor difficulty is one of the three domains the consensus says
    warrants formal neuropsychological assessment.
  phenotype_term:
    preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:10882750
    reference_title: A clinical study of 57 children with fetal anticonvulsant syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

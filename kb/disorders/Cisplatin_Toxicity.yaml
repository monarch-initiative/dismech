- name: Cisplatin-Induced Acute Kidney Injury
  description: >-
    Falling glomerular filtration after tubular injury, with magnesium and
    potassium wasting alongside it. Unlike the cochlear arm this is often
    reversible, because the epithelium regenerates.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "drug_induced_nephrotoxicity#Acute Kidney Injury"
  evidence:
  - reference: PMID:39423903
    reference_title: "Advances in understanding cisplatin-induced toxicity: Molecular mechanisms and protective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      its clinical utility is hampered by its dose-limiting toxicities, including
      nephrotoxicity, ototoxicity, neurotoxicity, and myelosuppression
    explanation: >-
      Names nephrotoxicity as one of the four dose-limiting toxicities this entry
      is organised around.
- name: Cochlear Hair Cell Death
  description: >-
    Death of cochlear hair cells, beginning with the outer hair cells of the basal
    turn, which is why the loss starts at high frequency. Hair cell death is not
    the only cochlear lesion - stria vascularis injury and spiral ganglion
    degeneration are reported alongside it - and this entry does not model it as
    the sole route.
  role: intermediate
  biological_scale: TISSUE
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:36455457
    reference_title: "Cisplatin-induced ototoxicity: From signaling network to therapeutic targets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main etiologies are stria vascularis injury, spiral ganglion
      degeneration, and hair cell death.
    explanation: >-
      Names hair cell death as a main route and, in the same sentence, the two
      other cochlear lesions this node's description declines to subsume.
  - reference: PMID:36455457
    reference_title: "Cisplatin-induced ototoxicity: From signaling network to therapeutic targets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Upon entering hair cells, cisplatin disrupts organelle metabolism, induces
      oxidative stress, and targets DNA to cause intracellular damage.
    explanation: >-
      Locates the injury inside the hair cell and gives its three components.
  downstream:
  - target: Irreversible Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Hair cell loss gives permanent hearing loss, and the permanence is what
      separates this arm from the renal one, where the epithelium regenerates.
    evidence:
    - reference: PMID:29924955
      reference_title: "Sodium Thiosulfate for Protection from Cisplatin-Induced Hearing Loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cisplatin chemotherapy and surgery are effective treatments for children
        with standard-risk hepatoblastoma but may cause considerable and
        irreversible hearing loss.
      explanation: >-
        Establishes the irreversibility this edge asserts. The usual explanation -
        that mammalian cochlear hair cells are not regenerated - is not stated by
        the sources cited in this entry, so it is not asserted here.
  notes: >-
    Conformance is asserted at the module's hair-cell death node. The module node
    names mechanotransduction failure as well as death; the sources cited here
    establish hair cell death and the intracellular injury behind it, and do not
    report a mechanotransduction measurement. Read the conformance as covering the
    death half.
- name: Irreversible Sensorineural Hearing Loss
  description: >-
    Permanent high-frequency sensorineural hearing loss. It is the toxicity with
    the worst long-term arithmetic, because it does not recover and because the
    frequencies lost first carry the consonants. In children under five the
    cumulative incidence reaches 75 percent at three years and it appears early in
    treatment.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  evidence:
  - reference: PMID:36455457
    reference_title: "Cisplatin-induced ototoxicity: From signaling network to therapeutic targets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Administration of cisplatin, a common chemotherapeutic drug, has an
      inevitable side effect of sensorineural hearing loss.
    explanation: >-
      States the outcome and its character as sensorineural.
  - reference: PMID:34490624
    reference_title: "The cumulative incidence of cisplatin-induced hearing loss in young children is higher and develops at an early stage during therapy compared with older children based on 2052 audiological assessments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three years after initiating therapy, the cumulative incidence of CIHL was
      highest in patients aged ≤5 years (75%; 95% confidence interval [CI],
      66%-84%)
    explanation: >-
      Gives the paediatric cumulative incidence quoted in this description, from
      2052 audiological assessments in 368 patients.
  - reference: PMID:34490624
    reference_title: "The cumulative incidence of cisplatin-induced hearing loss in young children is higher and develops at an early stage during therapy compared with older children based on 2052 audiological assessments."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In young children, the cumulative incidence of CIHL is higher compared with
      that in older children and develops early during therapy.
    explanation: >-
      Establishes both the age effect and the early onset during treatment.
  - reference: PMID:29924955
    reference_title: "Sodium Thiosulfate for Protection from Cisplatin-Induced Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key consonants are heard at high frequencies (4 kHz through 8 kHz), and so
      their loss is debilitating, particularly in young children in whom speech
      has not yet developed
    explanation: >-
      Source for the consonant point in this node's description, and for why a
      high-frequency loss matters more in a young child than its audiometric size
      suggests.
- name: Dorsal Root Ganglion Sensory Neuron Injury
  description: >-
    Platinum accumulates in dorsal root ganglion sensory neurons, which sit
    outside the blood-nerve barrier and are therefore not protected the way the
    rest of the peripheral nervous system is. The primary lesion here is at the
    cell body, not at the far end of the axon, even though the symptoms begin
    distally.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  cell_types:
  - preferred_term: dorsal root ganglion sensory neuron
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  evidence:
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cisplatin induces apoptosis in dorsal root ganglion (DRG) sensory neurons by
      covalently binding to nuclear DNA (nDNA), resulting in DNA damage,
      subsequent p53 activation and Bax-mediated apoptosis via the mitochondria
    explanation: >-
      Locates the injury in the dorsal root ganglion neuron and gives the death
      pathway.
  - reference: PMID:38660386
    reference_title: "Current understanding of the molecular mechanisms of chemotherapy-induced peripheral neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the sensory neurons and axons in the peripheral nervous system (PNS) are
      more susceptible than the CNS to damage from chemotherapy drugs, due to the
      absence of an effective blood-nerve barrier in the PNS
    explanation: >-
      Source for the barrier point in this node's description. The claim is made
      for the peripheral nervous system and chemotherapy drugs generally, not for
      the dorsal root ganglion and cisplatin specifically.
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      DRG neurons are non-dividing cells that repair cisplatin-nDNA adducts via
      the NER at the same rate as cancer cells; however, accumulation of adducts
      is higher in neurons.
    explanation: >-
      Establishes that the accumulation, not a repair deficit, is what makes these
      neurons vulnerable - they repair as fast as tumour cells but start from a
      higher adduct load.
  downstream:
  - target: Sensory Peripheral Neuropathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss and dysfunction of sensory neurons produces the clinical neuropathy.
      The intermediate is loss of primary afferent sensory axonal fibres.
    evidence:
    - reference: PMID:38660386
      reference_title: "Current understanding of the molecular mechanisms of chemotherapy-induced peripheral neuropathy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CIPN is characterized by a substantial loss of primary afferent sensory
        axonal fibers leading to sensory disturbances in patients.
      explanation: >-
        Names the fibre loss that stands between neuron injury and symptoms. The
        source covers chemotherapy-induced neuropathy across several drug classes,
        so this supports the shared endpoint rather than a cisplatin-specific
        route.
  notes: >-
    Conformance is asserted at the module's insult node, which is where a toxic
    injury to peripheral sensory neurons belongs. This entry deliberately does NOT
    conform to the module's "Distal Axonal Degeneration and Demyelination" node.
    Cisplatin neuropathy is a sensory neuronopathy - the platinum accumulates in
    and kills the ganglion cell body - and none of the sources cited here reports
    demyelination. Symptoms begin distally, which is a different claim from the
    lesion being distal, and the entry keeps those apart.
- name: Mitochondrial DNA Damage in Sensory Neurons
  description: >-
    Platinum binds mitochondrial DNA in dorsal root ganglion neurons with the same
    affinity as nuclear DNA, and blocks its replication and transcription. This is
    the arm that explains coasting: mitochondria have no nucleotide excision
    repair, so the adducts are not removed when the drug stops, and the neuron
    goes on failing.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Axonal Transport Impairment and Mitochondrial Dysfunction"
  evidence:
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cisplatin treated DRG neurons exhibit mitochondrial vacuolization and
      degradation in vitro and in vivo.
    explanation: >-
      Direct morphological evidence of mitochondrial injury in the affected
      neurons, in culture and in animals.
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mitochondria do not have NER mechanisms for mtDNA.
    explanation: >-
      States the repair gap that this node's description uses to explain why the
      injury continues after the drug is withdrawn.
  downstream:
  - target: Sensory Peripheral Neuropathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Mitochondrial failure in sensory neurons contributes to the neuropathy on a
      slower clock than the nuclear-DNA route, and continues after dosing stops.
  notes: >-
    The module node names axonal transport impairment and mitochondrial
    dysfunction together. Only the mitochondrial half is evidenced here. The
    axonal-transport mechanism in chemotherapy-induced neuropathy is best
    established for the microtubule-targeting agents - taxanes and vinca alkaloids
    - and this entry does not transfer that mechanism to cisplatin, which is not a
    microtubule poison.
- name: Sensory Peripheral Neuropathy
  description: >-
    Distal sensory loss, often painful, in about 30 percent of treated patients.
    Its distinguishing feature is coasting - the neuropathy keeps worsening for
    weeks to months after the drug is stopped, which is reported only for the
    platinum drugs.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  evidence:
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cisplatin is a platinum-based chemotherapeutic agent that induces peripheral
      neuropathy in 30% of patients.
    explanation: >-
      Gives the proportion affected, stated as background in the cited paper.
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with cisplatin-induced peripheral neuropathy experience sensory
      loss, often accompanied by pain, starting in the distal extremities.
    explanation: >-
      Gives the distribution and character of the deficit.
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This phenomenon, commonly known as “coasting,” is observed exclusively in
      platinum-based chemotherapy and suggests that there is ongoing neuronal
      damage after discontinuing cisplatin.
    explanation: >-
      Establishes coasting and its restriction to the platinum drugs, which is the
      feature this node is built around.
- name: Cytotoxic Insult to Proliferating Hematopoietic Progenitors
  description: >-

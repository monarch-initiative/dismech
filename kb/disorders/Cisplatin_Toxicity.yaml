    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  evidence:
  - reference: PMID:18272962
    reference_title: "Cisplatin nephrotoxicity: mechanisms and renoprotective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      side effects in normal tissues and organs, notably nephrotoxicity in the
      kidneys, limit the use of cisplatin and related platinum-based
      therapeutics
    explanation: >-
      Establishes nephrotoxicity as the dose-limiting normal-tissue injury this
      arm models.
  downstream:
  - target: Cisplatin-Induced Acute Kidney Injury
    causal_link_type: DIRECT
    description: >-
      Loss of tubular epithelium produces the fall in filtration.
    evidence:
    - reference: PMID:19144690
      reference_title: "The copper transporter Ctr1 contributes to cisplatin uptake by renal tubular cells during cisplatin nephrotoxicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The uptake of cisplatin in renal tubular cells is high, leading to

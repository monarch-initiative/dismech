    reference_title: "The copper transporter Ctr1 contributes to cisplatin uptake by renal tubular cells during cisplatin nephrotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The uptake of cisplatin in renal tubular cells is high, leading to cisplatin
      accumulation and tubular cell injury and death, culminating in acute renal
      failure.
    explanation: >-
      States the renal endpoint. This is a mechanistic study in cells and mice,

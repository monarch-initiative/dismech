treatments:
- name: Sodium thiosulfate otoprotection
  description: >-
    A sulfur nucleophile that inactivates platinum, given six hours after the
    cisplatin infusion. The delay is the whole design: given at the same time it
    would protect the tumour too, and pharmacokinetic work put six hours as the
    interval that protects the ear without doing that. In a randomised phase 3
    trial in children with standard-risk hepatoblastoma it cut hearing loss from
    63 percent to 33 percent without reducing survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium thiosulfate
      term:
        id: CHEBI:26977
        label: thiosulfate
  target_mechanisms:
  - target: Cochlear Hair Cell Death
    treatment_effect: INHIBITS
    description: >-
      Reduces the incidence of hearing loss, which this entry places downstream of
      hair cell death. The trial measured hearing thresholds, not hair cell
      survival, so the effect is asserted on the clinical outcome and located at
      this node by inference.
    evidence:
    - reference: PMID:29924955
      reference_title: "Sodium Thiosulfate for Protection from Cisplatin-Induced Hearing Loss."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hearing loss of grade 1 or higher occurred in 18 of 55 children (33%) in
        the cisplatin-sodium thiosulfate group, as compared with 29 of 46 (63%) in
        the cisplatin-alone group, indicating a 48% lower incidence of hearing
        loss in the cisplatin-sodium thiosulfate group (relative risk, 0.52; 95%
        confidence interval [CI], 0.33 to 0.81; P=0.002).
      explanation: >-
        Randomised phase 3 result with effect size and confidence interval. This
        is the strongest treatment evidence in the entry.
  evidence:
  - reference: PMID:29924955
    reference_title: "Sodium Thiosulfate for Protection from Cisplatin-Induced Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The addition of sodium thiosulfate, administered 6 hours after cisplatin
      chemotherapy, resulted in a lower incidence of cisplatin-induced hearing
      loss among children with standard-risk hepatoblastoma, without jeopardizing
      overall or event-free survival.
    explanation: >-
      States the conclusion, including that tumour control was not compromised,
      which is the concern the delayed schedule exists to address.
  - reference: PMID:29924955
    reference_title: "Sodium Thiosulfate for Protection from Cisplatin-Induced Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonclinical studies and initial phase 1-2 trials indicated that sodium
      thiosulfate has a potential otoprotective effect, with maximum efficacy
      occurring when sodium thiosulfate is administered 4 to 8 hours after
      cisplatin
    explanation: >-
      Gives the timing window this treatment's description is built on.
  notes: >-
    Bound to CHEBI:26977 thiosulfate rather than to a sodium-thiosulfate-specific
    term. CHEBI:132112 sodium thiosulfate exists but is not in this repository's
    term cache, and the anion is the active species; the salt is recorded in
    preferred_term. The trial population was children with standard-risk
    hepatoblastoma receiving cisplatin monotherapy, chosen because otoprotection
    can be tested there without confounding by other agents. Generalisation to
    adults and to multi-agent regimens is not established by this trial.
- name: Renoprotective supportive care
  description: >-
    Measures aimed at the renal arm, of which intravenous saline hydration with
    magnesium replacement is the routine one. The honest summary of this area is
    that protection is partial: no single measure abolishes the nephrotoxicity,
    and the field is still combining them.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:18272962
    reference_title: "Cisplatin nephrotoxicity: mechanisms and renoprotective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Renoprotective approaches are being discovered, but the protective effects
      are mostly partial, suggesting the need for combinatorial strategies.
    explanation: >-
      States that renoprotection is partial, which is the claim this treatment
      makes. The source speaks of renoprotective approaches in general; it does
      not name hydration, and this entry does not cite it as evidence for
      hydration specifically.
  - reference: PMID:18272962
    reference_title: "Cisplatin nephrotoxicity: mechanisms and renoprotective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Importantly, it is unclear whether these approaches would limit the
      anticancer effects of cisplatin in tumors.
    explanation: >-
      Records the open question that constrains every protective strategy here -
      the same concern the sodium thiosulfate schedule was designed around, left
      unresolved on the renal side.
  - reference: PMID:37530867
    reference_title: "A systematic review for prevention of cisplatin-induced nephrotoxicity using different hydration protocols and meta-analysis for magnesium hydrate supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There has been uncertainty regarding the best method to prevent CIN.
    explanation: >-
      States that the optimal prevention protocol is unsettled, which is why this
      treatment is curated at the level of the magnesium arm rather than a named
      hydration regimen.
  target_mechanisms:
  - target: Proximal Tubular Epithelial Cell Death
    treatment_effect: INHIBITS
    description: >-
      Magnesium supplementation during hydration reduces cisplatin nephrotoxicity.
      The meta-analysis measured the clinical nephrotoxicity endpoint, not tubular
      cell death, so the effect is located at this node by inference.
    evidence:
    - reference: PMID:37530867
      reference_title: "A systematic review for prevention of cisplatin-induced nephrotoxicity using different hydration protocols and meta-analysis for magnesium hydrate supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A meta-analysis of 11 retrospective studies that examined magnesium
        supplementation during hydration showed that this treatment provided
        significant protection against CIN (OR = 0.22, 95% CI = 0.14 to 0.35).
      explanation: >-
        Gives the effect size and interval. The pooled studies are retrospective,
        which is a real limit on this estimate and is why the accompanying review
        still reports uncertainty about the best protocol.
  notes: >-
    Magnesium supplementation during hydration is the component with a pooled
    effect estimate behind it. The optimal hydration protocol itself remains
    unsettled - the same systematic review states that outright - so this entry
    curates the magnesium arm rather than any particular hydration regimen.

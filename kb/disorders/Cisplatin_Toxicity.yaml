genetic:
- name: ACYP2
  gene_term:
    preferred_term: ACYP2
    term:
      id: hgnc:180
      label: ACYP2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    One of only two genes reaching the strong-and-replicated tier in the Canadian
    Pharmacogenomics Network for Drug Safety systematic review, which graded 40
    reports across 47 independent populations and 24 genes. The ACYP2 association
    holds in both children and adults.
  evidence:
  - reference: PMID:37726872
    reference_title: "Systematic Critical Review of Genetic Factors Associated with Cisplatin-induced Ototoxicity: Canadian Pharmacogenomics Network for Drug Safety 2022 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, an ACYP2 variant has been associated with ototoxicity in both
      children and adults, whereas TPMT variants are relevant in children.
    explanation: >-
      Names ACYP2 as associated in both age groups, which is the claim curated
      here.
  - reference: PMID:37726872
    reference_title: "Systematic Critical Review of Genetic Factors Associated with Cisplatin-induced Ototoxicity: Canadian Pharmacogenomics Network for Drug Safety 2022 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering GRADE criteria, genetic variants in 2 genes were strongly (ie,
      odds ratios ≥3) and consistently (ie, replication in ≥3 independent
      populations) predictive of cisplatin-induced ototoxicity.
    explanation: >-
      Gives the evidence bar - odds ratio at least 3, replicated in at least three
      populations - that this gene clears and that most candidate loci do not.

name: Cisplatin Toxicity
creation_date: '2026-09-02T00:15:00Z'
description: >-
  Cisplatin toxicity is the injury a platinum drug does to the patient it is
  meant to cure. The drug works by crosslinking DNA, and it does that in whatever
  cell it enters, so the question of which tissue is harmed is not a question
  about the lesion at all. It is a question about which cells take the platinum
  up, and whether those cells can repair the damage or be replaced. Kidney
  proximal tubule takes it in through OCT2 and Ctr1 and dies. Cochlear hair cells
  take it in and cannot be regenerated, so the hearing loss is permanent. Dorsal
  root ganglion neurons sit outside the blood-nerve barrier, accumulate platinum,
  and go on degenerating for months after the last dose. Marrow is hit because
  marrow divides. Four dose-limiting toxicities, one lesion, and the difference
  between them is transport and repair rather than mechanism.
categories:
- Treatment Toxicity
category: Complex
parents:
- Drug Toxicity
disease_term:
  preferred_term: cisplatin toxicity
  term:
    id: MONDO:0027664
    label: cisplatin toxicity
pathophysiology:
- name: Cisplatin Uptake by Transporter-Expressing Cells
  description: >-
    Cisplatin does not enter cells freely. It is carried in, chiefly by the
    organic cation transporter OCT2 and the copper transporter Ctr1, and the
    tissues that express those transporters most heavily are the tissues that are
    injured. This node is the selectivity step of the whole disease - it explains
    why a drug that crosslinks DNA everywhere produces damage in four particular
    organs and not uniformly.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake"
  evidence:
  - reference: PMID:16242669
    reference_title: "Association between tubular toxicity of cisplatin and expression of organic cation transporter rOCT2 (Slc22a2) in the rat."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the present results indicated that renal rOCT2 expression was the major
      determinant of cisplatin-induced tubular toxicity
    explanation: >-
      Identifies transporter expression, not intrinsic cellular sensitivity, as
      what determines where the toxicity falls. This is the claim the node is
      built on. Shown in rat and in a transfected human cell line.
  - reference: PMID:19144690
    reference_title: "The copper transporter Ctr1 contributes to cisplatin uptake by renal tubular cells during cisplatin nephrotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      downregulation of Ctr1 suppresses cisplatin toxicity, including cell death
      by both apoptosis and necrosis
    explanation: >-
      Shows the second transporter arm, and shows it causally - removing the
      transporter removes the toxicity.
  downstream:
  - target: Platinum-DNA Adduct Formation
    causal_link_type: DIRECT
    description: >-
      Uptake delivers platinum to intracellular DNA. Everything downstream
      follows from the adducts; this edge is what makes uptake rate-limiting.
    evidence:
    - reference: PMID:19144690
      reference_title: "The copper transporter Ctr1 contributes to cisplatin uptake by renal tubular cells during cisplatin nephrotoxicity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The uptake of cisplatin in renal tubular cells is high, leading to
        cisplatin accumulation and tubular cell injury and death, culminating in
        acute renal failure.
      explanation: >-
        States the uptake-to-accumulation-to-injury sequence this edge asserts, in
        the renal arm.
- name: Platinum-DNA Adduct Formation
  description: >-
    Aquated cisplatin binds DNA and forms crosslinks. This is the therapeutic
    mechanism and the toxic mechanism, and they are the same mechanism - there is
    no separate off-target lesion to find. Adducts form in nuclear DNA and in
    mitochondrial DNA, and the distinction matters because the mitochondrion
    cannot repair them.
  role: central_effector
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:39423903
    reference_title: "Advances in understanding cisplatin-induced toxicity: Molecular mechanisms and protective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms of cisplatin toxicity are multifactorial and involve
      oxidative stress, inflammation, DNA damage, and cellular apoptosis.
    explanation: >-
      Names DNA damage alongside oxidative stress and apoptosis as the shared
      mechanisms across the toxicities, which is how this entry arranges them.
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cisplatin induces apoptosis in dorsal root ganglion (DRG) sensory neurons by
      covalently binding to nuclear DNA (nDNA), resulting in DNA damage,
      subsequent p53 activation and Bax-mediated apoptosis via the mitochondria
    explanation: >-
      Gives the covalent binding, the damage response and the apoptotic route in
      one of the four affected tissues.
  downstream:
  - target: Oxidative Stress and Mitochondrial Injury
    causal_link_type: DIRECT
    description: >-
      Adduct formation is accompanied by reactive oxygen species generation and
      mitochondrial damage, which is the arm that reaches post-mitotic cells.
  - target: Apoptotic Cell Death in Platinum-Loaded Tissue
    causal_link_type: DIRECT
    description: >-
      Unrepaired adducts activate the damage response and drive apoptosis.
- name: Oxidative Stress and Mitochondrial Injury
  description: >-
    Reactive oxygen species generation and mitochondrial damage. This arm matters
    most in the tissues that do not divide, because a post-mitotic cell is not
    threatened by a stalled replication fork but is threatened by losing its
    mitochondria.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "drug_induced_nephrotoxicity#Tubular Oxidative Stress and Mitochondrial Injury"
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:39423903
    reference_title: "Advances in understanding cisplatin-induced toxicity: Molecular mechanisms and protective strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms of cisplatin toxicity are multifactorial and involve
      oxidative stress, inflammation, DNA damage, and cellular apoptosis.
    explanation: >-
      Names oxidative stress as one of the shared mechanisms across cisplatin's
      toxicities.
  - reference: PMID:36455457
    reference_title: "Cisplatin-induced ototoxicity: From signaling network to therapeutic targets."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Upon entering hair cells, cisplatin disrupts organelle metabolism, induces
      oxidative stress, and targets DNA to cause intracellular damage.
    explanation: >-
      Gives the same three-part injury - organelle, oxidative, DNA - in the
      cochlear arm specifically.
  downstream:
  - target: Apoptotic Cell Death in Platinum-Loaded Tissue
    causal_link_type: DIRECT
    description: >-
      Oxidative and mitochondrial injury converge on the same apoptotic endpoint
      as the direct DNA damage arm.
  - target: Mitochondrial DNA Damage in Sensory Neurons
    causal_link_type: DIRECT
    description: >-
      In dorsal root ganglion neurons the mitochondrial arm is not merely
      accompanying injury; platinum binds mitochondrial DNA directly.
- name: Apoptotic Cell Death in Platinum-Loaded Tissue
  description: >-
    Programmed death of the cells that took up the most platinum. The same
    endpoint in four tissues, which is why the four toxicities look
    mechanistically alike while behaving very differently in the clinic. What
    differs downstream is whether the dead cell can be replaced.
  role: intermediate
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:21145397
    reference_title: "Cisplatin induced mitochondrial DNA damage in dorsal root ganglion neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cisplatin induces apoptosis in dorsal root ganglion (DRG) sensory neurons by
      covalently binding to nuclear DNA (nDNA), resulting in DNA damage,
      subsequent p53 activation and Bax-mediated apoptosis via the mitochondria
    explanation: >-
      Gives the apoptotic pathway from adduct to p53 to Bax in one of the affected
      tissues.
  downstream:
  - target: Proximal Tubular Epithelial Cell Death
    causal_link_type: DIRECT
    description: >-
      The renal arm. Tubular epithelium can regenerate, which is why this
      toxicity is often reversible where the cochlear one is not.
  - target: Cochlear Hair Cell Death
    causal_link_type: DIRECT
    description: >-
      The cochlear arm. Mammalian hair cells do not regenerate, so this cell death
      is the permanent one.
  - target: Cytotoxic Insult to Proliferating Hematopoietic Progenitors
    causal_link_type: DIRECT
    description: >-
      The marrow arm. Progenitors are hit for the ordinary antiproliferative
      reason rather than for any transporter-specific one.
  - target: Dorsal Root Ganglion Sensory Neuron Injury
    causal_link_type: DIRECT
    description: >-
      The neural arm. Sensory neurons are post-mitotic and irreplaceable, so this
      arm shares the cochlear arm's arithmetic rather than the marrow's.
- name: Proximal Tubular Epithelial Cell Death
  description: >-
    Death of proximal tubule epithelium, the cells that concentrated the drug.
    Distal segments are affected too, which is where the magnesium wasting comes
    from.
  role: intermediate
  biological_scale: TISSUE
  conforms_to: "drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death"
  cell_types:

name: Bailey-Bloch Congenital Myopathy
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
parents:
- Congenital myopathy
synonyms:
- Native American myopathy
- NAM
- STAC3 disorder
- STAC3-related congenital myopathy
- Congenital myopathy 13
- CMYP13
- congenital myopathy - cleft palate - malignant hyperthermia
disease_term:
  preferred_term: Bailey-Bloch Congenital Myopathy
  term:
    id: MONDO:0009722
    label: Bailey-Bloch congenital myopathy
description: >-
  Bailey-Bloch congenital myopathy is an autosomal recessive congenital myopathy
  caused by biallelic loss-of-function variants in STAC3, the muscle-specific
  adaptor that assembles the skeletal-muscle excitation-contraction (EC) coupling
  apparatus. STAC3 is not itself a channel: it is the scaffold that gets the
  CaV1.1 voltage sensor properly expressed at the triad and tunes its
  conformational coupling to the sarcoplasmic-reticulum calcium release channel
  RyR1. When that scaffold fails, depolarization of the T-tubule no longer
  releases calcium efficiently, and the disorder that results is congenital and
  structural rather than progressive and degenerative — hypotonia and weakness
  from birth, arthrogryposis and talipes, myopathic facies with ptosis, palatal
  anomalies including cleft palate, short stature, and progressive
  kyphoscoliosis, with intellect typically spared. The feature that makes the
  diagnosis anaesthetically load-bearing is a substantial risk of malignant
  hyperthermia on exposure to volatile anaesthetics or succinylcholine, arising
  from the same triad lesion rather than from RYR1 or CACNA1S variants of the
  patient's own.

  Two things about this entry are worth flagging up front. First, the eponym has
  actively harmed diagnosis: the disorder was first described in the Lumbee
  Native American tribe of North Carolina and named accordingly, and the label
  "Native American myopathy" then biased clinical suspicion away from patients of
  other ancestry for two decades. The recurrent c.851G>C (p.Trp284Ser) allele has
  since turned out to be a common cause of congenital hypotonia in Southern
  Africa, and the evidence now points to an African rather than an Amerindian
  origin for it. Second, the mechanism is not fully closed: functional work on
  patient muscle found EC coupling clearly impaired while the STAC3-CaV1.1
  interaction itself was not measurably disrupted, which is recorded here as an
  open question rather than smoothed over.
inheritance:

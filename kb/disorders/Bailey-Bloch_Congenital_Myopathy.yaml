pathophysiology:
- name: Biallelic STAC3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    STAC3 encodes a muscle-specific adaptor protein with an N-terminal C1
    (cysteine-rich) domain, a linker region, and two tandem SH3 domains. Nearly
    all reported disease alleles are biallelic loss-of-function changes, and the
    overwhelming majority of patients worldwide are homozygous for the recurrent
    missense change c.851G>C (p.Trp284Ser), which substitutes a conserved
    tryptophan in the first SH3 domain. Nonsense, frameshift and splice-site
    alleles have also been reported, and a patient has been described carrying a
    deletion of the SH3 domains entirely.
  genes:
  - preferred_term: STAC3
    term:
      id: hgnc:28423
      label: STAC3
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
    causal_link_type: DIRECT
    description: >-
      Loss of functional STAC3 removes the adaptor that positions and stabilizes
      the CaV1.1 voltage sensor in the triad junction.
  evidence:
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation resulted in a tryptophan (W) to serine (S) substitution at
      amino acid 284 in the first SH3 domain
    explanation: >-
      Identifies the founder allele and locates it in the SH3-1 domain of STAC3.
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we reveal that a mutation in human STAC3 is the genetic basis of the
      debilitating Native American myopathy (NAM)
    explanation: >-
      Establishes STAC3 as the causal gene for this disorder.
  - reference: PMID:40779452
    reference_title: >-
      STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports
      skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the most common mutation associated with STAC3 disorder, W284S in the SH3-1
      domain, impairs the binding ability of STAC3
    explanation: >-
      Gives the biophysical consequence of the founder substitution.
- name: Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
  biological_scale: MOLECULAR
  description: >-
    STAC3 is required for the functional expression of CaV1.1 (the dihydropyridine
    receptor, the skeletal-muscle L-type calcium channel that acts as the T-tubule
    voltage sensor) and for its conformational coupling to RyR1. Two distinct
    STAC3-CaV1.1 contacts have been resolved: the C1/linker region binds the
    proximal C-terminus of CaV1.1 and is necessary and sufficient for functional
    channel expression, while the SH3-1 domain binds the CaV1.1 II-III loop and,
    contrary to the long-standing assumption, is not strictly required for coupling
    but enhances calcium release. In zebrafish stac3 mutants, DHPR levels,
    functionality and stability are all reduced.
  genes:
  - preferred_term: CACNA1S
    term:
      id: hgnc:1397
      label: CACNA1S
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  molecular_functions:
  - preferred_term: voltage-gated calcium channel activity
    term:
      id: GO:0005245
      label: voltage-gated calcium channel activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: sarcoplasmic reticulum
    term:
      id: GO:0016529
      label: sarcoplasmic reticulum
  downstream:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    causal_link_type: DIRECT
    description: >-
      Without a properly assembled and voltage-competent CaV1.1, T-tubule
      depolarization fails to trigger RyR1-mediated calcium release.
  evidence:
  - reference: PMID:40779452
    reference_title: >-
      STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports
      skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A key regulator of this process is STAC3, a protein essential for both the
      functional expression of CaV1.1 and its conformational coupling with RyR1.
    explanation: >-
      States the two roles of STAC3 that this node represents.
  - reference: PMID:40779452
    reference_title: >-
      STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports
      skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrated that the interaction between STAC3 and the proximal
      C-terminus is necessary and sufficient for CaV1.1 functional expression and
      minimal EC coupling
    explanation: >-
      Assigns the essential channel-expression role to the N-terminal contact
      rather than to the SH3/II-III loop contact.
  - reference: PMID:28003463
    reference_title: >-
      Congenital myopathy results from misregulation of a muscle Ca2+ channel by
      mutant Stac3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we find significantly reduced DHPR levels, functionality, and stability in
      stac3 mutants
    explanation: >-
      Direct measurement of the CaV1.1/DHPR deficit caused by loss of Stac3.
- name: Defective Skeletal Muscle Excitation-Contraction Coupling
  biological_scale: CELLULAR
  description: >-
    The functional core of the disease. Depolarization of the T-tubule membrane no
    longer efficiently triggers release of calcium from the sarcoplasmic reticulum,
    so the myofibre generates less force for a given electrical stimulus. The
    contractile machinery itself and gross triad architecture are comparatively
    preserved, which is why this is a coupling failure rather than a structural
    myopathy in the usual sense. In patient muscle, KCl-induced depolarization
    produced significantly reduced sarcoplasmic-reticulum calcium release.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: DECREASED
  downstream:
  - target: Congenital Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Less calcium released per depolarization means less force per stimulus, from
      fetal life onward.
  - target: Anesthetic-Triggered Malignant Hyperthermia Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same triad lesion confers susceptibility to pharmacologically triggered
      uncontrolled calcium release, but the steps connecting STAC3 loss to the MH
      trigger cascade are not established.
  evidence:
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In particular, KCl-induced membrane depolarization resulted in significantly
      reduced sarcoplasmic reticulum Ca2+ release.
    explanation: >-
      Demonstrates the coupling defect in muscle from patients rather than only in
      model systems.
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of NAM stac3 in zebrafish shows that the NAM mutation decreases
      excitation-contraction coupling.
    explanation: >-
      Shows the patient allele itself, not just a null, reduces EC coupling.
- name: Congenital Muscle Weakness
  biological_scale: ORGANISM
  description: >-
    Reduced force generation produces generalized hypotonia and weakness present at
    birth, with the characteristic myopathic facies and ptosis reflecting
    involvement of facial and levator musculature. Bulbar weakness gives feeding
    difficulty and aspiration risk; respiratory and paraspinal weakness gives
    restrictive lung disease and, over time, progressive kyphoscoliosis and short
    stature. Palatal anomalies including cleft palate are part of the same
    congenital pattern. Curated separately from the contracture node below because
    the two have different proximate causes — weakness is the direct consequence of
    reduced force, whereas contractures come from the reduced fetal movement that
    weakness produces.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Reduced Fetal Movement and Congenital Joint Contracture
    causal_link_type: DIRECT
    description: >-
      Weak fetal muscle moves the joints less, and joints that do not move in utero
      form fixed contractures.
  evidence:
  - reference: PMID:31219695
    reference_title: STAC3 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most affected individuals have weakness with myopathic facies, scoliosis,
      kyphosis or kyphoscoliosis, and contractures.
    explanation: >-
      GeneReviews summary of the core musculoskeletal phenotype.
  - reference: PMID:36030003
    reference_title: >-
      STAC3 related congenital myopathy: A case series of seven Comorian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by congenital weakness and arthrogryposis, cleft palate,
      ptosis, short stature, kyphoscoliosis, talipes deformities, and
      susceptibility to malignant hyperthermia (MH) triggered by anesthesia
    explanation: >-
      Independent statement of the same clinical constellation in a non-Lumbee
      cohort.
- name: Reduced Fetal Movement and Congenital Joint Contracture
  biological_scale: ORGANISM
  description: >-
    The fetal-akinesia arm. Weak intrauterine movement leaves joints fixed in
    position, producing the contracture spectrum seen at birth — isolated talipes
    equinovarus at the mild end through arthrogryposis multiplex congenita at the
    severe end. Decreased fetal movement is directly documented in the majority of
    STAC3 patients in a cohort that recorded it, which is what makes this a separate
    mechanistic step rather than a restatement of weakness.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:39966651
    reference_title: >-
      Biallelic variants in RYR1 and STAC3 are predominant causes of
      King-Denborough Syndrome in an African cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, cleft palate (40%), talipes equinovarus (50%), and cryptorchidism
      (16%) were frequently observed, with a higher incidence than in some other
      cohorts, reinforcing the unique phenotypic characteristics of KDS-like
      presentations in African patients.
    explanation: >-
      Quantifies the contracture-spectrum burden in a cohort whose STAC3 arm is the
      larger of the two genotype groups.
  - reference: PMID:36030003
    reference_title: >-
      STAC3 related congenital myopathy: A case series of seven Comorian patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by congenital weakness and arthrogryposis, cleft palate,
      ptosis, short stature, kyphoscoliosis, talipes deformities, and
      susceptibility to malignant hyperthermia (MH) triggered by anesthesia
    explanation: >-
      Places arthrogryposis and talipes among the defining congenital features.
- name: Anesthetic-Triggered Malignant Hyperthermia Susceptibility
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Exposure to halogenated volatile anaesthetics or succinylcholine can
    precipitate a hypermetabolic malignant hyperthermia crisis. This is a genuinely
    separate consequence of the triad lesion rather than a severity marker of the
    myopathy: it is incompletely penetrant, patients may have had several
    uneventful anaesthetics before a crisis, and in reported STAC3 patients it
    occurs without pathogenic RYR1 or CACNA1S variants. The mechanistic route from
    STAC3 loss to triggered uncontrolled calcium release is not established, and
    this entry does not assert one.
  genes:
  - preferred_term: STAC3
    term:
      id: hgnc:28423
      label: STAC3
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:40262809
    reference_title: >-
      STAC3 gene congenital myopathy and malignant hyperthermia: a crossroads
      between neurology and anesthesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report three MH crises, in two boys and one girl, 2 to 15 years old. All
      of them received halogenated agents and one additionally received
      succinylcholine.
    explanation: >-
      Documents the triggering agents in confirmed STAC3 patients.
  - reference: PMID:40262809
    reference_title: >-
      STAC3 gene congenital myopathy and malignant hyperthermia: a crossroads
      between neurology and anesthesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients presented two to four previous uneventful general anesthesia.
    explanation: >-
      Supports the statement that an uneventful prior anaesthetic does not exclude
      risk.
  - reference: PMID:40262809
    reference_title: >-
      STAC3 gene congenital myopathy and malignant hyperthermia: a crossroads
      between neurology and anesthesia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The MH crises in this series of patients with STAC3 gene mutations
      demonstrated variable clinical characteristics (expressivity) and occurrence
      (penetrance).
    explanation: >-
      Supports incomplete penetrance and variable expressivity of the MH trait.
- name: Skeletal Muscle Lipid Accumulation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    An emerging and deliberately hedged branch. Increased lipid content in skeletal
    muscle has been noted in patients, and a CRISPR stac3-knockout zebrafish
    reproduces it, with elevated neutral lipid levels appearing alongside
    cytoskeletal and myogenic-regulator changes. Whether the lipid accumulation is
    a driver of weakness or a downstream consequence of it is explicitly
    unresolved, and the supporting measurements are in zebrafish, not human muscle.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:39592070
    reference_title: >-
      Early life lipid overload in Native American Myopathy is phenocopied by stac3
      knockout in zebrafish.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These muscle alterations were associated with elevated neutral lipid levels
      starting at 5 dpf and persisting beyond 7 dpf.
    explanation: >-
      Reports the lipid finding in the zebrafish knockout that motivates this node.
  - reference: PMID:39592070
    reference_title: >-
      Early life lipid overload in Native American Myopathy is phenocopied by stac3
      knockout in zebrafish.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinically, NAM patients demonstrated increased lipids in skeletal muscle,
      but it is unclear if neutral lipids are associated with altered muscle
      function in NAM.
    explanation: >-
      States both the human observation and the explicit uncertainty about its
      functional significance, which is why this node is curated at low confidence.

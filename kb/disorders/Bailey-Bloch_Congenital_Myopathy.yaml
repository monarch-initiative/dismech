      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we reconstituted different STAC3 fragments and mutants in double CaV1.1/Stac3-KO myotubes to examine the contribution of each of the 2 STAC3/CaV1.1 interactions
      explanation: Defines the engineered immortalized myotube system and its domain-reconstitution design.
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: RESCUES
    description: Channel-tethered SH3 domains rescue the mutant coupling defect.
    evidence:
    - reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: STAC3-CT-β1a expression remarkably increased the EC coupling calcium release observed in myotubes reconstituted with STAC3-W280S by 5-fold.
      explanation: Targeted SH3-domain delivery rescued calcium release in cultured myotubes; this is not an animal or clinical treatment result.

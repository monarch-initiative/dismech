histopathology:
- name: Non-Specific Myopathic Muscle Biopsy
  frequency: FREQUENT
  description: >-
    Biopsy abnormalities are variable and nonspecific. The Southern African study reported abnormal histology in 11/16 biopsied patients, normal findings in three and unavailable results in two. Type 1 fiber predominance, nonspecific myopathy and atrophic fibers occurred. The international cohort also documented occasional internal nuclei, myofibrillar loss and minicore areas on electron microscopy, despite broadly preserved triads. These findings do not provide a pathognomonic biopsy diagnosis.
  evidence:
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal muscle biopsy histology results were reported in 11/16 patients
      (69%). and included documented type 1 muscle fibre predominance (5/11 (45%)),
      features of non-specific myopathy (3/11 (27%)), mild atrophic fibres (2/11
      (18%)), and type 2 muscle fibre predominance (1/11 (9%)).
    explanation: >-
      Quantifies both the yield and the pattern distribution of muscle biopsy in a
      genotype-confirmed cohort.
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsy histology was abnormal in most patients who underwent the
      procedure (69%), with non-specific myopathy features being most common,
      consistent with previous reports
    explanation: >-
      States the non-specificity that limits the diagnostic value of biopsy here.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electron microscopy analysis showed myofibrillar loss, irregular and broken Z -lines with mini-core areas with disrupted sarcomeres
    explanation: The full text contradicts an absolute absence of cores.
diagnosis:
- name: Molecular Genetic Testing of STAC3
  description: >-
    Diagnosis rests on biallelic pathogenic STAC3 variants in a proband with a
    compatible phenotype. Targeted testing for c.851G>C is a reasonable first step
    in populations where the allele is common; otherwise a congenital myopathy
    panel or exome sequencing is used. The key practice point is that ancestry must
    not gate the test.
  evidence:
  - reference: PMID:31219695
    reference_title: STAC3 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of STAC3 disorder is established in a proband with suggestive
      clinical findings and biallelic pathogenic variants in STAC3 identified by
      molecular genetic testing.
    explanation: >-
      States the diagnostic standard.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrates that STAC3 gene analysis should be included in the
      diagnostic work up of patients of any ethnicity presenting with congenital
      myopathy, in particular if a history of MH-like episodes is reported.
    explanation: >-
      Explicit recommendation that testing not be restricted by ancestry.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Identification of biallelic STAC3 variants of uncertain significance (or of one known STAC3 pathogenic variant and one STAC3 variant of uncertain significance) does not establish or rule out the diagnosis.
    explanation: A VUS must not be silently promoted to a diagnostic allele.
    quote_role: REVIEW_SYNTHESIS
- name: Genetics-Before-Biopsy Testing Strategy
  description: >-
    In suspected STAC3 disorder, molecular testing can precede an anesthetized biopsy, whose findings are often nonspecific. Targeted c.851G>C testing identified 25/127 (20%) homozygotes in a selected Southern African laboratory series of hypotonia referrals already negative for SMN1 exon-7 deletion testing (114) or Prader-Willi testing (13). This is not an unselected population screening yield.
  evidence:
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a patient with suspected STAC3 disorder, genetic testing should be
      performed as the first line investigation, instead of a muscle biopsy which
      could pose a risk for MH.
    explanation: >-
      States the testing-order recommendation and the reason for it.
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 25/127 (20%) laboratory-based samples were homozygous for STAC3
      c.851 G > C.
    explanation: >-
      Quantifies the diagnostic yield of targeted testing in a congenital-hypotonia
      referral population.
- name: Electromyography
  description: >-
    EMG may be normal or show nonspecific myopathic findings. It supports evaluation of muscle disease but does not establish or exclude STAC3 disorder.
  evidence:
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electromyography (EMG) revealed a myopathic pattern-polyphasic,
      short-duration, low-amplitude motor unit action potentials, and early
      recruitment.
    explanation: >-
      Describes the electrophysiological findings.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electromyogram revealed normal results in some individuals and evidence of myopathy in others
    explanation: GeneReviews describes the variability in electrophysiology.
    quote_role: REVIEW_SYNTHESIS
- name: Serum Creatine Kinase
  description: >-
    CK is often normal and a normal result does not exclude STAC3 disorder. In the Southern African cohort, 16/21 had normal levels and four had raised values; the manuscript does not account explicitly for the remaining measurement. Three elevations were two to three times the upper limit and one was four to five times; three were measured neonatally, when elevations can be nonspecific.
  evidence:
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Creatine phosphokinase (CK) levels were normal.
    explanation: >-
      Documents a normal CK in a genetically confirmed patient.
  - reference: PMID:38824262
    reference_title: 'STAC3 disorder: a common cause of congenital hypotonia in Southern African patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the four raised CK levels, three were increased two to three times the upper limit of normal for age, and one was increased four to five times the upper limit of normal for age.
    explanation: The full text does not support restricting all elevations to a mild category.
- name: Respiratory and Sleep Assessment
  description: Pulmonary assessment includes respiratory function, cough strength, secretion handling and sleep symptoms, with spirometry and polysomnography as appropriate. Normal early spirometry does not exclude later restrictive disease. A five-patient pulmonary series recommends six-monthly function testing; GeneReviews recommends at least annual pulmonary assessment, more often in infancy or with respiratory symptoms.
  evidence:
  - reference: PMID:38088138
    reference_title: "Pulmonary manifestations of STAC3 disorder: A case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: respiratory function testing should be measured on a regular basis, i.e every six months despite initial normal findings.
    explanation: The pulmonary series proposes regular assessment despite initially normal function.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Polysomnography needed to evaluate for central &/or obstructive sleep apnea as well as hypoxia
    explanation: GeneReviews Table 4 specifies sleep evaluation.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical eval at least annually but likely more often during infancy or when any signs of respiratory insufficiency, aspiration, &/or sleep apnea develop
    explanation: GeneReviews Table 6 provides the qualified surveillance interval.
    quote_role: REVIEW_SYNTHESIS
- name: Multidisciplinary Neuromuscular Surveillance
  description: GeneReviews recommends review of respiratory status, speech, swallowing and musculoskeletal complications every three to four months in infancy and every six to twelve months in older children and adults, with growth and feeding safety assessed at visits.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Infants age <12 mos: every 3-4 mos ... Older children & adults: every 6-12 mos'
    explanation: GeneReviews Table 6 gives the neuromuscular follow-up intervals.
    quote_role: REVIEW_SYNTHESIS
differential_diagnoses:
- name: King-Denborough syndrome
  description: >-
    Congenital myopathy with dysmorphic features and malignant hyperthermia
    susceptibility. The relationship is one of overlap rather than exclusion: in a
    South African cohort of 44 patients diagnosed clinically with King-Denborough
    syndrome, biallelic STAC3 and RYR1 variants were the two predominant causes, so
    a King-Denborough phenotype is a reason to test STAC3, not to stop.
  distinguishing_features:
  - Genotype rather than phenotype discriminates the two labels
  - RYR1 is the alternative causal gene in this presentation
  evidence:
  - reference: PMID:39966651
    reference_title: >-
      Biallelic variants in RYR1 and STAC3 are predominant causes of
      King-Denborough Syndrome in an African cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study identified RYR1 and STAC3 mutations as the predominant genetic
      causes of KDS in this cohort, with mutations in both genes exhibiting
      autosomal recessive inheritance.
    explanation: >-
      Establishes the genetic overlap between the two clinical labels.
- name: Central core myopathy
  description: >-
    RYR1-related congenital myopathy that also features contractures, respiratory
    insufficiency and malignant hyperthermia susceptibility.
  disease_term:
    preferred_term: central core myopathy
    term:
      id: MONDO:0007294
      label: central core myopathy
  distinguishing_features:
  - Characteristic central cores on muscle biopsy
  - RYR1 rather than STAC3 genotype
  - Frequently autosomal dominant rather than recessive
- name: Carey-Fineman-Ziter syndrome
  description: >-
    Congenital myopathy with facial weakness, palatal abnormalities and skeletal findings overlaps clinically with STAC3 disorder. Molecular testing distinguishes MYMK-related Carey-Fineman-Ziter syndrome 1 and other genetically defined forms from STAC3 disease.
  disease_term:
    preferred_term: Carey-Fineman-Ziter syndrome
    term:
      id: MONDO:0031415
      label: Carey-Fineman-Ziter syndrome
  distinguishing_features:
  - A different causal gene — MYMK in Carey-Fineman-Ziter syndrome 1
- name: Moebius syndrome
  description: >-
    Congenital facial weakness and impaired ocular abduction can resemble STAC3 disorder. A Brazilian child initially suspected to have Moebius syndrome was diagnosed with biallelic STAC3 variants. Reported overlap and rare anesthesia complications make an absolute absence of malignant hyperthermia an unreliable discriminator.
  disease_term:
    preferred_term: Moebius syndrome
    term:
      id: MONDO:0008006
      label: Moebius syndrome
  distinguishing_features:
  - Obligatory impairment of ocular abduction and other cranial nerve findings
  evidence:
  - reference: PMID:37626540
    reference_title: "Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy with Malignant Hyperthermia Susceptibility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: patient 2 was initially suspected to have MBS, which was rectified only after the genetic analysis was carried out, confirming the biallelic pathogenic variant p.Trp284Ser in STAC3
    explanation: Documents clinical misclassification resolved by molecular testing.
- name: X-linked myotubular myopathy
  description: >-
    MTM1-related congenital myopathy can also present with severe neonatal hypotonia and respiratory insufficiency. Its X-linked inheritance and molecular cause distinguish it from autosomal recessive STAC3 disorder.
  distinguishing_features:
  - X-linked rather than autosomal recessive inheritance
  - MTM1 genotype
animal_models:
- name: stac3 mi34 null zebrafish
  species: Zebrafish
  genotype: stac3 mi34 splice-donor mutation (functionally null)
  publication: PMID:23736855
  description: >-
    The forward-genetic stac3 mi34 splice-donor mutant has severely reduced muscle calcium transients and locomotion. Early triads and contractile responses to caffeine were preserved, but myofibers broke down during larval development. Maternal stac3 transcript can contribute residual early function; a translation-blocking morpholino intensified immotility.
  modeled_mechanisms:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mutant muscle shows greatly reduced calcium transients with intact contractile
      machinery and grossly normal triad anatomy, isolating the defect to coupling
      itself.
    limitations: >-
      A functional null, so it models the severe end of the human allelic spectrum
      rather than the hypomorphic missense biology of most patients; larvae die and
      the model cannot address the progressive musculoskeletal deformity or the
      malignant hyperthermia trait.
    evidence:
    - reference: PMID:23736855
      reference_title: >-
        Stac3 is a component of the excitation-contraction coupling machinery and
        mutated in Native American myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ca2+ transients were greatly reduced in both mutant slow and fast twitch
        fibers (Fig. 2b,c). Thus EC coupling in skeletal muscles was defective in
        the mi34 mutants.
      explanation: >-
        Reports the calcium-release measurement that grounds the coupling claim.
- name: stac3 mutant zebrafish channel-function assays
  species: Zebrafish
  genotype: stac3 mutant and stac3 NAM preparations as reported in the 2017 study
  publication: PMID:28003463
  description: >-
    Electron microscopy, electrophysiology and dynamic imaging showed reduced DHPR levels, functionality and stability in stac3-mutant muscle. NAM preparations also showed increased caffeine-evoked release and internal-store calcium without altered caffeine sensitivity. The retrieved abstract does not establish a genomic knock-in design.
  modeled_mechanisms:
  - target: Reduced CaV1.1 Junctional Expression
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Measures reduced DHPR abundance and function in stac3-mutant preparations; the abstract does not assign every measurement to the same genotype.
    limitations: >-
      The detailed construct design could not be verified from the retrieved abstract. Increased caffeine-evoked release does not by itself establish a mechanism of anesthetic-triggered malignant hyperthermia.
    evidence:
    - reference: PMID:28003463
      reference_title: >-
        Congenital myopathy results from misregulation of a muscle Ca2+ channel by
        mutant Stac3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using electron microscopy, electrophysiology, and dynamic imaging of
        zebrafish muscle fibers, we find significantly reduced DHPR levels,
        functionality, and stability in stac3 mutants.
      explanation: >-
        The measurement behind the channel-assembly claim.
  evidence:
  - reference: PMID:28003463
    reference_title: Congenital myopathy results from misregulation of a muscle Ca2+ channel by mutant Stac3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: stac3NAM myofibers exhibited increased caffeine-induced Ca2+ release across a wide range of concentrations in the absence of altered caffeine sensitivity as well as increased Ca2+ in internal stores
    explanation: Separates increased release magnitude from increased agonist sensitivity.
- name: stac3 CRISPR knockout zebrafish (lipid phenotype)
  species: Zebrafish
  genotype: stac3-/- CRISPR/Cas9 knockout
  publication: PMID:39592070
  description: >-
    A CRISPR knockout used to follow early skeletal muscle development, which
    surfaced neutral lipid accumulation alongside the expected weakness.
  modeled_mechanisms:
  - target: Skeletal Muscle Lipid Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces elevated neutral lipids alongside muscle abnormalities in larvae; muscle-specific lipid localization is not established by the available abstract.
    limitations: >-
      Whether lipid accumulation contributes to weakness or merely accompanies it is
      unresolved in both the model and patients; the knockout does not survive past
      11 days post-fertilization, so no chronic or adult phenotype can be assessed.
    evidence:
    - reference: PMID:39592070
      reference_title: >-
        Early life lipid overload in Native American Myopathy is phenocopied by
        stac3 knockout in zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we determined that loss of stac3 leads to delayed larval hatching which
        corresponds with muscle weakness and decreased whole-body Ca2+ level during
        early skeletal development
      explanation: >-
        Reports the model's core muscle phenotype in which the lipid finding was
        observed.
- name: Heat-induced stac3 NAM transgene rescue in mi34 zebrafish
  species: Zebrafish
  genotype: stac3 mi34 null larvae expressing hsp70-driven stac3 NAM mutant transgene
  publication: PMID:23736855
  description: Mosaic heat-induced expression of the zebrafish substitution analogous to human W284S failed to restore swimming. Calcium transients remained reduced in fast-twitch but not slow-twitch fibers relative to wild-type Stac3 rescue. Wild-type human STAC3 rescued the motor phenotype.
  modeled_mechanisms:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: PARTIALLY_RECAPITULATES
    description: Tests allele-specific rescue of calcium release in the null background.
    evidence:
    - reference: PMID:23736855
      reference_title: Stac3 is a component of the excitation-contraction coupling machinery and mutated in Native American myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The analogous W>S substitution was encoded in zebrafish stac3 (hsp70:stac3NAM-egfp) and expressed in stac3mi34 null mutant muscles to assay for phenotypic rescue.
      explanation: This is expression of a mutant transgene in null larvae, not genomic knock-in.
    limitations: Mosaic overexpression and residual maternal transcript differ from an endogenous homozygous human genotype; fast- and slow-fiber responses differed.
  evidence:
  - reference: PMID:23736855
    reference_title: Stac3 is a component of the excitation-contraction coupling machinery and mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The analogous W>S substitution was encoded in zebrafish stac3 (hsp70:stac3NAM-egfp) and expressed in stac3mi34 null mutant muscles to assay for phenotypic rescue.
    explanation: This is expression of a mutant transgene in null larvae, not genomic knock-in.
- name: Constitutive Stac3-null mouse
  species: Mouse
  genotype: Homozygous Stac3 deletion
  publication: PMID:23818578
  description: Constitutive loss caused complete paralysis and perinatal lethality with musculoskeletal defects. Cultured myotubes retained responses to direct RyR agonism, supporting a defect upstream of calcium release rather than loss of the contractile apparatus.
  modeled_mechanisms:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: PARTIALLY_RECAPITULATES
    description: The constitutive-null model establishes the requirement for Stac3 in muscle function.
    evidence:
    - reference: PMID:23818578
      reference_title: Skeletal muscle-specific T-tubule protein STAC3 mediates voltage-induced Ca2+ release and contractility.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: homozygous deletion of src homology 3 and cysteine rich domain 3 (Stac3) in mice results in complete paralysis and perinatal lethality with a range of musculoskeletal defects that reflect a blockade of EC coupling.
      explanation: The constitutive-null model establishes the requirement for Stac3 in muscle function.
    limitations: A perinatal lethal null does not reproduce the typical surviving hypomorphic human genotype.
- name: Tamoxifen-induced postnatal Stac3 deletion mouse
  species: Mouse
  genotype: Stac3 fl/fl with CAG-Cre/Esr1 transgene; tamoxifen induction at four weeks
  publication: PMID:27073615
  description: Male mice underwent inducible deletion of Stac3 exons 2-5 at four weeks and were assessed four weeks later. Limb muscle retained roughly 30% or less STAC3 protein despite near-absent transcript. Body and muscle growth, fiber cross-sectional area and grip strength declined; central nuclei increased without a change in total fiber number. The CAG driver is not muscle-specific.
  modeled_mechanisms:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: PARTIALLY_RECAPITULATES
    description: Contrasts electrical and direct-RyR stimulation in muscles from the induced mice.
    evidence:
    - reference: PMID:27073615
      reference_title: "The SH3 and cysteine-rich domain 3 (Stac3) gene is important to growth, fiber composition, and calcium release from the sarcoplasmic reticulum in postnatal skeletal muscle."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: postnatal Stac3 deletion reduced electrostimulation-induced but not the ryanodine receptor agonist caffeine-induced maximal force output in the limb muscles.
      explanation: Contrasts electrical and direct-RyR stimulation in muscles from the induced mice.
    limitations: Postnatal induction, residual protein and male-only experiments differ from congenital human disease; cellular calcium measurements were made in isolated fibers.
discussions:
- discussion_id: stac3_cav11_interaction_paradox
  kind: OPEN_QUESTION
  prompt: >-
    How do variant-specific changes in STAC3 contacts alter voltage sensing and calcium-release efficiency in patient-derived muscle cells?
  attaches_to:
  - pathophysiology#Impaired SH3-Dependent Enhancement of Calcium Release
  rationale: >-
    Patient-biopsy co-immunoprecipitation recovers a stable STAC3-CaV1.1 complex, whereas isolated SH3-interface and engineered myotube assays show impaired coupling enhancement. These assays measure different aspects of the complex. The two-contact model provides a compatible explanation, but matched voltage-sensing and release measurements in patient cells are still needed to quantify each contribution.
  proposed_experiments:
  - experiment_id: stac3_patient_myotube_charge_movement
    name: Quantify CaV1.1 charge movement and STAC3 occupancy in patient-derived myotubes
    description: >-
      Measure gating charge, calcium release and STAC3-CaV1.1 stoichiometry side by
      side in myotubes carrying p.Trp284Ser, to determine whether the deficit lies in
      channel voltage sensing, in coupling efficiency, or in a step downstream of a
      normally assembled complex.
  evidence:
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Co-immunoprecipitation of STAC3 with CaV 1.1 in patients and control muscle
      samples showed that the protein interaction between STAC3 and CaV 1.1 was not
      significantly affected by the STAC3 variants.
    explanation: >-
      Biopsy co-immunoprecipitation shows retained recoverable association; it does not test all individual interfaces.
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the precise pathomechanism remains to be elucidated, our functional
      characterization of STAC3 variants revealed that defective ECC is not a result
      of CaV 1.1 sarcolemma mislocalization or impaired STAC3-CaV 1.1 interaction.
    explanation: >-
      The 2018 interpretation must be read with its assay limits and the later two-contact model.
- discussion_id: stac3_mh_trigger_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does loss of STAC3 confer susceptibility to
    anaesthetic-triggered malignant hyperthermia, given that affected patients do
    not carry pathogenic RYR1 or CACNA1S variants?
  attaches_to:
  - pathophysiology#Anesthetic-Triggered Malignant Hyperthermia Susceptibility
  rationale: >-
    Clinical STAC3-related crises establish an anesthetic-triggered susceptibility. Zebrafish mutant models show increased caffeine-evoked release and store calcium, whereas the single patient myotube culture had preserved store size and no increased agonist sensitivity. Neither finding alone establishes the mechanism of anesthetic-triggered malignant hyperthermia in patients.
  proposed_experiments:
  - experiment_id: stac3_halothane_contracture_myotubes
    name: Halothane and caffeine response in STAC3-null and W284S myotubes
    description: >-
      Compare halothane- and caffeine-evoked contracture and calcium release in
      myotubes reconstituted with wild-type STAC3, W284S STAC3, and no STAC3, on an
      otherwise wild-type RYR1 background, to test whether STAC3 loss is sufficient
      to produce a trigger-sensitive phenotype.
  evidence:
  - reference: PMID:28003463
    reference_title: >-
      Congenital myopathy results from misregulation of a muscle Ca2+ channel by
      mutant Stac3.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, stac3NAM myofibers exhibited increased caffeine-induced Ca2+
      release across a wide range of concentrations in the absence of altered
      caffeine sensitivity as well as increased Ca2+ in internal stores, which is
      consistent with increased SR luminal Ca2+
    explanation: >-
      The suggestive model-organism observation, recorded as partial support because
      it has not been tied to anaesthetic triggering in patients.
notes: >-
  Bailey-Bloch congenital myopathy, Native American myopathy, STAC3 disorder and congenital myopathy 13 refer to the same disorder. Frequency estimates are cohort-specific and often use available-case denominators; reported cohorts may overlap and should not be summed without deduplication. Clinical course varies, and progressive respiratory or orthopedic complications can occur. Observed malignant-hyperthermia attacks do not estimate susceptibility in patients never exposed to triggering agents. The historical ancestry-based name should not restrict molecular testing. Nonsyndromic malignant hyperthermia susceptibility is covered separately in Malignant_Hyperthermia_of_Anesthesia.

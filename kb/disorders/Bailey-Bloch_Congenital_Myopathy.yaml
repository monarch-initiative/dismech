disease_term:
  preferred_term: Bailey-Bloch Congenital Myopathy
  term:
    id: MONDO:0009722
    label: Bailey-Bloch congenital myopathy
description: >-
  Bailey-Bloch congenital myopathy is an autosomal recessive disorder caused by biallelic pathogenic STAC3 variants. STAC3 is a skeletal-muscle adaptor that supports CaV1.1 expression and its conformational coupling to RyR1-mediated calcium release. The recurrent p.Trp284Ser allele impairs coupling while retaining some channel-complex association and function. Congenital hypotonia and weakness occur with myopathic facies, ptosis, contractures, talipes, palatal abnormalities, feeding and respiratory difficulties, and spinal deformity. Clinical severity and course vary; some patients improve, whereas others develop progressive complications. Intellect is often preserved, but developmental delay and mild intellectual disability have also been reported. Volatile anesthetics and succinylcholine can trigger malignant hyperthermia, including after previous uneventful anesthesia. Originally described in the Lumbee population, STAC3 disorder occurs worldwide and should be considered regardless of ancestry.

  inheritance:
  - name: Autosomal recessive
  notes: >-
    Biallelic pathogenic STAC3 variants are the sole established cause. The
    recurrent c.851G>C (p.Trp284Ser) allele in the first SH3 domain accounts for
    the great majority of reported patients worldwide; nonsense, frameshift and
    splice-site alleles and an SH3-domain deletion have also been described.

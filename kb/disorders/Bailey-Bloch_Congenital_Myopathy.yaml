histopathology:
- name: Non-Specific Myopathic Muscle Biopsy
  frequency: FREQUENT
  description: >-
    Muscle biopsy is abnormal in most patients who undergo it, but the findings are
    non-specific: type 1 fibre predominance is the commonest single pattern,
    followed by generic myopathic features, mild atrophic fibres, and type 2 fibre
    predominance. There is no defining structural lesion of the kind that names
    other congenital myopathies (no cores, no rods, no central nuclei as a defining
    feature), which is precisely why biopsy cannot make this diagnosis and molecular
    testing must. Increased lipid droplets and subsarcolemmal mitochondrial
    accumulation have also been described on electron microscopy and are the human
    counterpart of the lipid finding modelled in zebrafish.
  evidence:
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal muscle biopsy histology results were reported in 11/16 patients
      (69%). and included documented type 1 muscle fibre predominance (5/11 (45%)),
      features of non-specific myopathy (3/11 (27%)), mild atrophic fibres (2/11
      (18%)), and type 2 muscle fibre predominance (1/11 (9%)).
    explanation: >-
      Quantifies both the yield and the pattern distribution of muscle biopsy in a
      genotype-confirmed cohort.
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsy histology was abnormal in most patients who underwent the
      procedure (69%), with non-specific myopathy features being most common,
      consistent with previous reports
    explanation: >-
      States the non-specificity that limits the diagnostic value of biopsy here.
diagnosis:
- name: Molecular Genetic Testing of STAC3
  description: >-
    Diagnosis rests on biallelic pathogenic STAC3 variants in a proband with a
    compatible phenotype. Targeted testing for c.851G>C is a reasonable first step
    in populations where the allele is common; otherwise a congenital myopathy
    panel or exome sequencing is used. The key practice point is that ancestry must
    not gate the test.
  evidence:
  - reference: PMID:31219695
    reference_title: STAC3 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of STAC3 disorder is established in a proband with suggestive
      clinical findings and biallelic pathogenic variants in STAC3 identified by
      molecular genetic testing.
    explanation: >-
      States the diagnostic standard.
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrates that STAC3 gene analysis should be included in the
      diagnostic work up of patients of any ethnicity presenting with congenital
      myopathy, in particular if a history of MH-like episodes is reported.
    explanation: >-
      Explicit recommendation that testing not be restricted by ancestry.
- name: Genetics-Before-Biopsy Testing Strategy
  description: >-
    A sequencing decision that is specific to this disorder rather than generic
    good practice: because muscle biopsy requires anaesthesia and this disorder
    carries malignant hyperthermia risk, the biopsy is itself a hazard, and its
    yield is non-specific anyway. Genetic testing should therefore come first. The
    same logic applies to the diagnostic yield of targeted testing: 25 of 127 (20%)
    samples referred for congenital hypotonia in one Southern African laboratory
    cohort were homozygous for the founder allele, so in that setting a single
    targeted test resolves a fifth of the referral population without any procedure.
  evidence:
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a patient with suspected STAC3 disorder, genetic testing should be
      performed as the first line investigation, instead of a muscle biopsy which
      could pose a risk for MH.
    explanation: >-
      States the testing-order recommendation and the reason for it.
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 25/127 (20%) laboratory-based samples were homozygous for STAC3
      c.851 G > C.
    explanation: >-
      Quantifies the diagnostic yield of targeted testing in a congenital-hypotonia
      referral population.
- name: Electromyography
  description: >-
    Shows a myopathic pattern. Supportive rather than diagnostic, and it does not
    distinguish this disorder from other congenital myopathies.
  evidence:
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electromyography (EMG) revealed a myopathic pattern-polyphasic,
      short-duration, low-amplitude motor unit action potentials, and early
      recruitment.
    explanation: >-
      Describes the electrophysiological findings.
- name: Serum Creatine Kinase
  description: >-
    Normal or only mildly elevated, so a normal CK does not argue against the
    diagnosis. Recorded because a normal CK is a common reason congenital myopathy
    is dismissed.
  evidence:
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Creatine phosphokinase (CK) levels were normal.
    explanation: >-
      Documents a normal CK in a genetically confirmed patient.
differential_diagnoses:
- name: King-Denborough syndrome
  description: >-
    Congenital myopathy with dysmorphic features and malignant hyperthermia
    susceptibility. The relationship is one of overlap rather than exclusion: in a
    South African cohort of 44 patients diagnosed clinically with King-Denborough
    syndrome, biallelic STAC3 and RYR1 variants were the two predominant causes, so
    a King-Denborough phenotype is a reason to test STAC3, not to stop.
  distinguishing_features:
  - Genotype rather than phenotype discriminates the two labels
  - RYR1 is the alternative causal gene in this presentation
  evidence:
  - reference: PMID:39966651
    reference_title: >-
      Biallelic variants in RYR1 and STAC3 are predominant causes of
      King-Denborough Syndrome in an African cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study identified RYR1 and STAC3 mutations as the predominant genetic
      causes of KDS in this cohort, with mutations in both genes exhibiting
      autosomal recessive inheritance.
    explanation: >-
      Establishes the genetic overlap between the two clinical labels.
- name: Central core myopathy
  description: >-
    RYR1-related congenital myopathy that also features contractures, respiratory
    insufficiency and malignant hyperthermia susceptibility.
  disease_term:
    preferred_term: central core myopathy
    term:
      id: MONDO:0007294
      label: central core myopathy
  distinguishing_features:
  - Characteristic central cores on muscle biopsy
  - RYR1 rather than STAC3 genotype
  - Frequently autosomal dominant rather than recessive
- name: Carey-Fineman-Ziter syndrome
  description: >-
    Congenital myopathy sharing the upturned nasal tip, micrognathia, generalized
    muscle hypoplasia and delayed motor milestones. Clinically the most useful
    differential in this entry, because the discriminating feature is exactly the one
    that changes management. Bound to the phenotypic-series parent rather than to
    Carey-Fineman-Ziter syndrome 1 (MONDO:0800437, the MYMK-related form), because
    the differential holds across the series and type 2 has a different causal gene.
  disease_term:
    preferred_term: Carey-Fineman-Ziter syndrome
    term:
      id: MONDO:0031415
      label: Carey-Fineman-Ziter syndrome
  distinguishing_features:
  - No malignant hyperthermia susceptibility, so anaesthetic precautions differ
  - A different causal gene — MYMK in Carey-Fineman-Ziter syndrome 1
- name: Moebius syndrome
  description: >-
    Overlaps through cleft palate, talipes, short stature, scoliosis and
    contractures, and is genetically heterogeneous.
  disease_term:
    preferred_term: Moebius syndrome
    term:
      id: MONDO:0008006
      label: Moebius syndrome
  distinguishing_features:
  - Obligatory impairment of ocular abduction and other cranial nerve findings
  - No malignant hyperthermia susceptibility
- name: X-linked myotubular myopathy
  description: >-
    A severe congenital myopathy that is mechanistically unrelated — X-linked,
    caused by loss of the MTM1 lipid phosphatase, without malignant hyperthermia
    susceptibility. Listed here specifically because it is the entity a name-based
    search for this disorder is most likely to be confused with.
  distinguishing_features:
  - X-linked rather than autosomal recessive inheritance
  - MTM1 genotype
  - No malignant hyperthermia susceptibility
animal_models:
- name: stac3 mi34 null zebrafish
  species: Zebrafish
  genotype: stac3 mi34 splice-donor mutation (functionally null)
  publication: PMID:23736855
  description: >-
    The founding model. An unbiased forward genetic screen for zebrafish locomotor
    mutants isolated mi34, mapped it to stac3, and thereby identified the human
    disease gene — the model preceded and produced the gene-disease association
    rather than following it.
  modeled_mechanisms:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mutant muscle shows greatly reduced calcium transients with intact contractile
      machinery and grossly normal triad anatomy, isolating the defect to coupling
      itself.
    limitations: >-
      A functional null, so it models the severe end of the human allelic spectrum
      rather than the hypomorphic missense biology of most patients; larvae die and
      the model cannot address the progressive musculoskeletal deformity or the
      malignant hyperthermia trait.
    evidence:
    - reference: PMID:23736855
      reference_title: >-
        Stac3 is a component of the excitation-contraction coupling machinery and
        mutated in Native American myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ca2+ transients were greatly reduced in both mutant slow and fast twitch
        fibers (Fig. 2b,c). Thus EC coupling in skeletal muscles was defective in
        the mi34 mutants.
      explanation: >-
        Reports the calcium-release measurement that grounds the coupling claim.
- name: stac3 NAM knock-in zebrafish
  species: Zebrafish
  genotype: stac3 encoding the W-to-S substitution equivalent to human p.Trp284Ser
  publication: PMID:28003463
  description: >-
    Knock-in of the patient allele rather than a null, making it the closer model of
    human founder-variant biology.
  modeled_mechanisms:
  - target: Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced DHPR/CaV1.1 levels, functionality and stability in the presence of the
      patient-equivalent substitution.
    limitations: >-
      The knock-in also shows increased caffeine-induced calcium release and
      increased internal store calcium, a gain-of-release phenotype whose relation to
      the human malignant hyperthermia trait has not been established; reading it as
      an MH mechanism would overstate the evidence.
    evidence:
    - reference: PMID:28003463
      reference_title: >-
        Congenital myopathy results from misregulation of a muscle Ca2+ channel by
        mutant Stac3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using electron microscopy, electrophysiology, and dynamic imaging of
        zebrafish muscle fibers, we find significantly reduced DHPR levels,
        functionality, and stability in stac3 mutants.
      explanation: >-
        The measurement behind the channel-assembly claim.
- name: stac3 CRISPR knockout zebrafish (lipid phenotype)
  species: Zebrafish
  genotype: stac3-/- CRISPR/Cas9 knockout
  publication: PMID:39592070
  description: >-
    A CRISPR knockout used to follow early skeletal muscle development, which
    surfaced neutral lipid accumulation alongside the expected weakness.
  modeled_mechanisms:
  - target: Skeletal Muscle Lipid Accumulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the increased muscle lipid noted clinically in patients, with a
      developmental time course.
    limitations: >-
      Whether lipid accumulation contributes to weakness or merely accompanies it is
      unresolved in both the model and patients; the knockout does not survive past
      11 days post-fertilization, so no chronic or adult phenotype can be assessed.
    evidence:
    - reference: PMID:39592070
      reference_title: >-
        Early life lipid overload in Native American Myopathy is phenocopied by
        stac3 knockout in zebrafish.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we determined that loss of stac3 leads to delayed larval hatching which
        corresponds with muscle weakness and decreased whole-body Ca2+ level during
        early skeletal development
      explanation: >-
        Reports the model's core muscle phenotype in which the lipid finding was
        observed.
discussions:
- discussion_id: stac3_cav11_interaction_paradox
  kind: OPEN_QUESTION
  prompt: >-
    If excitation-contraction coupling is clearly impaired in STAC3-patient muscle,
    but the STAC3-CaV1.1 interaction and CaV1.1 sarcolemmal localization are not
    measurably disrupted in that same tissue, what is the proximate lesion?
  attaches_to:
  - pathophysiology#Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
  rationale: >-
    The intuitive model — patient variant disrupts STAC3 binding to CaV1.1,
    therefore coupling fails — is supported by biophysical work on the isolated
    W284S SH3 domain and by reduced DHPR levels in zebrafish, but the study that
    looked in human patient muscle found the interaction preserved. Compounding
    this, the SH3/II-III loop contact that W284S disrupts has since been shown to be
    facilitating rather than strictly required for coupling, while the essential
    contact is the one made by the N-terminal region. Curating a single clean chain
    here would paper over a genuine discrepancy between model systems and patient
    tissue.
  proposed_experiments:
  - experiment_id: stac3_patient_myotube_charge_movement
    name: Quantify CaV1.1 charge movement and STAC3 occupancy in patient-derived myotubes
    description: >-
      Measure gating charge, calcium release and STAC3-CaV1.1 stoichiometry side by
      side in myotubes carrying p.Trp284Ser, to determine whether the deficit lies in
      channel voltage sensing, in coupling efficiency, or in a step downstream of a
      normally assembled complex.
  evidence:
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Co-immunoprecipitation of STAC3 with CaV 1.1 in patients and control muscle
      samples showed that the protein interaction between STAC3 and CaV 1.1 was not
      significantly affected by the STAC3 variants.
    explanation: >-
      The patient-tissue result that creates the discrepancy.
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the precise pathomechanism remains to be elucidated, our functional
      characterization of STAC3 variants revealed that defective ECC is not a result
      of CaV 1.1 sarcolemma mislocalization or impaired STAC3-CaV 1.1 interaction.
    explanation: >-
      The authors state the open pathomechanism explicitly.
- discussion_id: stac3_mh_trigger_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does loss of STAC3 confer susceptibility to
    anaesthetic-triggered malignant hyperthermia, given that affected patients do
    not carry pathogenic RYR1 or CACNA1S variants?
  attaches_to:
  - pathophysiology#Anesthetic-Triggered Malignant Hyperthermia Susceptibility
  rationale: >-
    Malignant hyperthermia susceptibility is one of the clinically decisive features
    of this disorder, yet the causal chain from an adaptor-protein loss to triggered
    uncontrolled calcium release is not worked out. It is not simply a more severe
    version of the coupling defect: the coupling defect reduces calcium release,
    while the crisis is an excess of it. The zebrafish knock-in does show increased
    caffeine-induced release and elevated store calcium, which is suggestive, but
    that has not been connected to volatile-anaesthetic triggering in patients.
  proposed_experiments:
  - experiment_id: stac3_halothane_contracture_myotubes
    name: Halothane and caffeine response in STAC3-null and W284S myotubes
    description: >-
      Compare halothane- and caffeine-evoked contracture and calcium release in
      myotubes reconstituted with wild-type STAC3, W284S STAC3, and no STAC3, on an
      otherwise wild-type RYR1 background, to test whether STAC3 loss is sufficient
      to produce a trigger-sensitive phenotype.
  evidence:
  - reference: PMID:28003463
    reference_title: >-
      Congenital myopathy results from misregulation of a muscle Ca2+ channel by
      mutant Stac3.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, stac3NAM myofibers exhibited increased caffeine-induced Ca2+
      release across a wide range of concentrations in the absence of altered
      caffeine sensitivity as well as increased Ca2+ in internal stores, which is
      consistent with increased SR luminal Ca2+
    explanation: >-
      The suggestive model-organism observation, recorded as partial support because
      it has not been tied to anaesthetic triggering in patients.
notes: >-
  Naming and identity. This entry is filed under the MONDO label "Bailey-Bloch
  congenital myopathy" but the same disorder appears in the literature as Native
  American myopathy (NAM), STAC3 disorder, and congenital myopathy 13 (CMYP13).
  Curators and search tools should treat all four as the same entity.

  Two disambiguation hazards are worth recording. First, X-linked myotubular
  myopathy (MTM1) is a superficially similar severe congenital myopathy and is a
  common wrong resolution for name-based searches; it is X-linked, has no malignant
  hyperthermia association, and is the subject of a gene-replacement programme that
  has nothing to do with this disorder. Second, the deep-research report used to
  seed this entry cited "PMID:30178658" for the Zaharieva et al. 2018 Human
  Mutation cohort. That identifier resolves to an unrelated solid-state solar-cell
  paper; the correct identifier is PMID:30168660, which is what this entry cites.
  The report's own reference-validation pass did not catch it, because the wrong
  PMID does resolve to a real article — a reminder that "reference resolved" is not
  "reference correct".

  The 1987 Bailey and Bloch case report (PMID:3631569) that gives the disorder its
  eponym has no abstract in the cached record, so it is listed under references for
  provenance only and carries no evidence snippet.

  Two things a reader may expect and will not find. There is no `progression:`
  section: the frequently quoted figure of 36% mortality by age 18 appears in the
  GeneReviews full text and in the discussion of the original zebrafish paper, but
  not in either cached abstract, so it is not snippet-quotable and is deliberately
  omitted rather than cited to a source that does not contain it. And no `datasets:`
  block is present, because dataset relevance triage is a manual step that was not
  performed for this entry.

  Scope. Malignant hyperthermia susceptibility is curated here as a feature of this
  disorder. Non-syndromic malignant hyperthermia susceptibility, where STAC3 appears
  as a qualified susceptibility gene alongside RYR1 and CACNA1S, is curated
  separately in Malignant_Hyperthermia_of_Anesthesia.

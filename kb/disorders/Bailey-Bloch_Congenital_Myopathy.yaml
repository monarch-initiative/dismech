  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic (homozygous or compound heterozygous) pathogenic
    STAC3 variants. Heterozygous carriers are unaffected.
  evidence:
  - reference: PMID:31219695
    reference_title: STAC3 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STAC3 disorder is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the mode of inheritance directly.
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As expected for an autosomal recessive disorder, all affected individuals
      were homozygous for a G>C missense mutation of base pair 1046 in exon 10 of
      the STAC3 gene
    explanation: >-
      Segregation in the five original Lumbee families established recessive
      inheritance of the founder allele.

      Comorian Archipelago with a founder effect.
    explanation: >-
      The Comorian authors propose a founder effect; this passage does not establish an independent mutational origin.
environmental:
- name: Exposure to halogenated volatile anaesthetics or succinylcholine
  description: >-
    The only established environmental determinant in this disorder. It does not
    cause or modify the underlying myopathy; it converts a latent triad
    susceptibility into an acute, potentially fatal hypermetabolic crisis.
  influences_mechanisms:
  - target: Anesthetic-Triggered Malignant Hyperthermia Susceptibility
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Halogenated agents and depolarizing neuromuscular blockers are the documented
      triggers of malignant hyperthermia crises in patients with biallelic STAC3
      variants.
    evidence:
    - reference: PMID:40262809
      reference_title: >-
        STAC3 gene congenital myopathy and malignant hyperthermia: a crossroads
        between neurology and anesthesia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report three MH crises, in two boys and one girl, 2 to 15 years old.
        All of them received halogenated agents and one additionally received
        succinylcholine.
      explanation: >-
        Directly links the exposure to crises in STAC3 patients.
  evidence:
  - reference: PMID:31219695
    reference_title: STAC3 Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Anesthetic agents with a high risk of
      triggering malignant hyperthermia.
    explanation: >-
      GeneReviews records the exposure as the disorder's designated agent to avoid.
    quote_role: REVIEW_SYNTHESIS

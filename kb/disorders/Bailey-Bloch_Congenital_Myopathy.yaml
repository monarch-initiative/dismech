- name: STAC3
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: STAC3
    term:
      id: hgnc:28423
      label: STAC3
  inheritance:
  - name: Autosomal recessive
  notes: >-
    Biallelic pathogenic STAC3 variants are the sole established cause. The
    recurrent c.851G>C (p.Trp284Ser) allele in the first SH3 domain accounts for
    the great majority of reported patients worldwide; nonsense, frameshift and
    splice-site alleles and an SH3-domain deletion have also been described.
  evidence:
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we reveal that a mutation in human STAC3 is the genetic basis of the
      debilitating Native American myopathy (NAM)
    explanation: >-
      Original identification of STAC3 as the causal gene.
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital myopathy-13 (CMYP13), also known as Bailey-Bloch congenital
      myopathy and Native American myopathy (NAM), is a condition caused by
      biallelic missense pathogenic variants in STAC3, which encodes an important
      protein necessary for the excitation-relaxation coupling machinery in the
      muscle.
    explanation: >-
      Confirms the gene-disease relationship and the biallelic requirement under
      the CMYP13 designation.
  variants:
  - name: NM_145064.3:c.851G>C (p.Trp284Ser)
    gene:
      preferred_term: STAC3
      term:
        id: hgnc:28423
        label: STAC3
    description: 'Recurrent first-SH3-domain missense allele. Its functional effect is hypomorphic: calcium-release coupling is more impaired than residual channel-complex association.'
    evidence:
    - reference: PMID:37626540
      reference_title: "Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy with Malignant Hyperthermia Susceptibility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Whole exome sequencing revealed a homozygous pathogenic variant c.851G>C (p.Trp284Ser) in the STAC3 gene (NM_145064.3)
      explanation: The clinical report identifies transcript, zygosity and pathogenic classification.
    clinical_significance: PATHOGENIC
  - name: NM_145064.2:c.763_766delCTCT (p.Leu255IlefsTer58)
    gene:
      preferred_term: STAC3
      term:
        id: hgnc:28423
        label: STAC3
    description: Frameshift allele reported in trans with p.Trp284Ser in two Puerto Rican siblings; parental Sanger sequencing confirmed opposite parental origins.
    evidence:
    - reference: PMID:28777491
      reference_title: Identification of STAC3 variants in non-Native American families with overlapping features of Carey-Fineman-Ziter syndrome and Moebius syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

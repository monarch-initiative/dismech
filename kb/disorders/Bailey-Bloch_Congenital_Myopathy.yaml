pathophysiology:
- name: Biallelic STAC3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic STAC3 variants impair the skeletal-muscle adaptor. The recurrent hypomorphic missense allele c.851G>C (p.Trp284Ser) affects the first SH3 domain; splice-altering, frameshift and truncating alleles also occur. Loss of the SH3 interaction with the CaV1.1 II-III loop severely reduces calcium release while allowing residual channel-complex association through the N-terminal region. Complete loss in experimental models can additionally reduce junctional channel abundance.
  genes:
  - preferred_term: STAC3
    term:
      id: hgnc:28423
      label: STAC3
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Reduced CaV1.1 Junctional Expression
    causal_link_type: DIRECT
    description: >-
      Complete Stac3 loss reduces CaV1.1 junctional abundance in experimental systems; this route is allele- and model-dependent rather than a necessary step in every patient.
    evidence:
    - reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Lack of STAC3 caused a significant decrease in both the number of CaV1.1 clusters (–12%) and their fluorescence intensity (–30%)
      explanation: Quantifies the membrane-cluster phenotype in C2C12 Stac3-knockout myotubes.
  - target: Impaired SH3-Dependent Enhancement of Calcium Release
    causal_link_type: DIRECT
    description: The recurrent SH3-domain substitution or truncation compromises STAC3-dependent enhancement of calcium release.
    evidence:
    - reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: STAC3-NT fragment, which lacks the SH3 domains, can support EC coupling at levels comparable to STAC3-W280S
      explanation: Reconstitution establishes residual coupling without the SH3 domains; loss of this contact is not an all-or-none loss of CaV1.1 function.
  evidence:
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation resulted in a tryptophan (W) to serine (S) substitution at
      amino acid 284 in the first SH3 domain
    explanation: >-
      Identifies the founder allele and locates it in the SH3-1 domain of STAC3.
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we reveal that a mutation in human STAC3 is the genetic basis of the
      debilitating Native American myopathy (NAM)
    explanation: >-
      Establishes STAC3 as the causal gene for this disorder.
  - reference: PMID:40779452
    reference_title: >-
      STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports
      skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the most common mutation associated with STAC3 disorder, W284S in the SH3-1
      domain, impairs the binding ability of STAC3
    explanation: >-
      The 2025 introduction summarizes earlier isothermal-calorimetry experiments on the W284S substitution.
    quote_role: REVIEW_SYNTHESIS
- name: Reduced CaV1.1 Junctional Expression
  biological_scale: MOLECULAR
  description: >-
    Loss of Stac3 reduces CaV1.1/DHPR junctional abundance in zebrafish and cultured muscle models. In C2C12 Stac3-knockout myotubes, CaV1.1 cluster number and intensity decreased; the STAC3 N-terminal fragment partly restored cluster intensity. This null-model phenotype is not universal in patient muscle: three patient biopsies had preserved bulk CaV1.1, STAC3 and DHPR-beta1a levels, and p.Trp284Ser can retain substantial channel function despite strongly impaired excitation-contraction coupling.
  genes:
  - preferred_term: CACNA1S
    term:
      id: hgnc:1397
      label: CACNA1S
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  downstream:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    causal_link_type: UNKNOWN
    description: >-
      Reduced junctional voltage-sensor abundance is a possible contributor to impaired coupling in null models, but the clustering measurement does not isolate this causal contribution. Preserved abundance in patient biopsies shows that channel depletion is not required for the human coupling defect.
    evidence:
    - reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Lack of STAC3 caused a significant decrease in both the number of CaV1.1 clusters (–12%) and their fluorescence intensity (–30%)
      explanation: The cluster measurement supports reduced junctional abundance; its contribution to reduced calcium release is an inference, not a separately isolated causal effect.
  evidence:
  - reference: PMID:40779452
    reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lack of STAC3 caused a significant decrease in both the number of CaV1.1 clusters (–12%) and their fluorescence intensity (–30%)
    explanation: Quantifies the membrane-cluster phenotype in C2C12 Stac3-knockout myotubes.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Western blot analysis demonstrated no significant change in the content of any of the tested proteins in patient muscle samples
    explanation: Patient biopsies PN2D, PN5 and PN6A retained bulk STAC3, CaV1.1 and DHPR-beta1a; this limits extrapolation from null models.
- name: Impaired SH3-Dependent Enhancement of Calcium Release
  biological_scale: MOLECULAR
  description: The STAC3 SH3 region normally enhances CaV1.1-to-RyR1 conformational coupling. W284S or loss of the SH3 domains markedly reduces depolarization-induced calcium release, although the N-terminal CaV1.1 contact can sustain residual coupling. Stable recovery of STAC3 with CaV1.1 in patient co-immunoprecipitation assays does not measure every binding interface or demonstrate intact coupling.
  evidence:
  - reference: PMID:40779452
    reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: STAC3-NT fragment, which lacks the SH3 domains, can support EC coupling at levels comparable to STAC3-W280S
    explanation: Reconstitution establishes residual coupling without the SH3 domains; loss of this contact is not an all-or-none loss of CaV1.1 function.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No difference in the apparent interaction between CaV1.1 and the p.(Trp284Ser) STAC3 was observed as the anti-CaV1.1 antibody pulled down STAC3 in both, patient and control muscle samples
    explanation: Co-immunoprecipitation of three patient biopsies establishes preserved recoverable complex association, not preserved SH3-interface function.
  downstream:
  - target: Defective Skeletal Muscle Excitation-Contraction Coupling
    causal_link_type: DIRECT
    description: Loss of the coupling-enhancing contact lowers depolarization-induced calcium release despite residual voltage-sensor function.
    evidence:
    - reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal muscle excitation-contraction coupling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: STAC3-NT fragment, which lacks the SH3 domains, can support EC coupling at levels comparable to STAC3-W280S
      explanation: Reconstitution establishes residual coupling without the SH3 domains; loss of this contact is not an all-or-none loss of CaV1.1 function.
- name: Defective Skeletal Muscle Excitation-Contraction Coupling
  biological_scale: CELLULAR
  description: >-
    Depolarization elicits insufficient sarcoplasmic-reticulum calcium release. In cultured myotubes from one compound-heterozygous patient (PN5), the peak KCl response was approximately 10% of control, despite similar resting calcium, intracellular-store size and agonist EC50 values. Zebrafish rescue and engineered myotube experiments independently support the coupling defect. Preserved early triad architecture in models does not exclude later myofibrillar pathology or nonspecific biopsy abnormalities in patients.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
  - preferred_term: skeletal muscle contraction
    term:
      id: GO:0003009
      label: skeletal muscle contraction
    modifier: DECREASED
  downstream:
  - target: Congenital Muscle Weakness
    causal_link_type: DIRECT
    description: >-
      Less calcium released per depolarization means less force per stimulus, from
      fetal life onward.
  - target: Anesthetic-Triggered Malignant Hyperthermia Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same triad lesion confers susceptibility to pharmacologically triggered
      uncontrolled calcium release, but the steps connecting STAC3 loss to the MH
      trigger cascade are not established.
  evidence:
  - reference: PMID:30168660
    reference_title: >-
      STAC3 variants cause a congenital myopathy with distinctive dysmorphic
      features and malignant hyperthermia susceptibility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In particular, KCl-induced membrane depolarization resulted in significantly
      reduced sarcoplasmic reticulum Ca2+ release.
    explanation: >-
      This functional result was measured in cultured myotubes from one patient, PN5, not across all patient biopsies.
  - reference: PMID:23736855
    reference_title: >-
      Stac3 is a component of the excitation-contraction coupling machinery and
      mutated in Native American myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of NAM stac3 in zebrafish shows that the NAM mutation decreases
      excitation-contraction coupling.
    explanation: >-
      Shows the patient allele itself, not just a null, reduces EC coupling.
  - &id001
    reference: url:https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10059125/1/Muntoni_STAC3_revised_no_TrChanges.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the KCl induced Ca 2+ release which was reduced to approximately 10% of that observed in control myotubes
    explanation: The functional assay used patient PN5 myotubes; PN2D cells failed to differentiate.

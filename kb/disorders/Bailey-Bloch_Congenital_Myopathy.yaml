      id: hgnc:28423
      label: STAC3
  notes: >-
    The recurrent NM_145064.3:c.851G>C (p.Trp284Ser) allele occurs in multiple ancestry groups. Southern African shared-haplotype and allele-frequency findings support a founder hypothesis, but its geographic origin has not been conclusively established. Clinical recognition and testing should not be restricted to Lumbee ancestry.

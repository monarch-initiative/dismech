progression:
- phase: Variable childhood course
  notes: In the Southern African clinical cohort, 6/27 were static at last assessment, 6/27 worsened and 15/27 improved; course was unknown for four additional patients. These retrospective trajectories do not establish uniformly nonprogressive disease. Respiratory and orthopedic complications can progress even when motor function improves.
  evidence:
  - reference: PMID:38824262
    reference_title: "STAC3 disorder: a common cause of congenital hypotonia in Southern African patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Static at time of last clinical visit | 6/27 (22) ... Progressive worsening | 6/27 (22) ... Condition improving | 15/27 (56)
    explanation: Table 1 reports heterogeneous clinical courses using available-case denominators.
- phase: Historical childhood mortality
  notes: GeneReviews reports historical mortality of 36% by age 18, based on earlier reports, and three first-year deaths in a 14-person series. This is not a contemporary survival estimate across all ancestries or a malignant-hyperthermia-specific fatality rate. Reported causes included severe pulmonary hypoplasia and pneumonia-associated apnea.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK542808/pdf/Bookshelf_NBK542808.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Thirty-six percent of individuals affected with STAC3 disorder died by age 18 years ... In a study of 14 affected individuals, three died during the first year of life, one from severe pulmonary hypoplasia and one from apnea secondary to enterococcal pneumonia
    explanation: The GeneReviews life-expectancy section summarizes historical cohorts; ascertainment and treatment era limit generalization.

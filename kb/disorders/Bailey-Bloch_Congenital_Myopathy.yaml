  description: Reconstitution with CaV1.1 and STAC3 fragments separates voltage-sensor function from calcium-release enhancement. N-terminal STAC3 supported residual coupling without SH3 domains. Targeting intact SH3 domains through a beta1a fusion rescued calcium release in W280S-expressing cells; untethered SH3 domains did not provide equivalent rescue.
  modeled_mechanisms:

    snippet: >-
      we reveal that a mutation in human STAC3 is the genetic basis of the
      debilitating Native American myopathy (NAM)
    explanation: >-
      Original identification of STAC3 as the causal gene.
  - reference: PMID:37626540
    reference_title: >-
      Bailey-Bloch Congenital Myopathy in Brazilian Patients: A Very Rare Myopathy
      with Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital myopathy-13 (CMYP13), also known as Bailey-Bloch congenital
      myopathy and Native American myopathy (NAM), is a condition caused by
      biallelic missense pathogenic variants in STAC3, which encodes an important
      protein necessary for the excitation-relaxation coupling machinery in the
      muscle.
    explanation: >-
      Confirms the gene-disease relationship and the biallelic requirement under
      the CMYP13 designation.
- name: STAC3 c.851G>C recurrent allele
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: STAC3
    term:
      id: hgnc:28423
      label: STAC3
  notes: >-
    Originally interpreted as a Lumbee founder allele, the recurrent c.851G>C
    variant is now recognised across African, Afro-Caribbean, Comorian, Middle
    Eastern, South American and other populations, with allele-frequency data
    pointing to an African origin. The reframing is clinically consequential: the
    "Native American myopathy" label suppressed diagnostic suspicion outside one
    ancestry group.
  evidence:
  - reference: PMID:38824262
    reference_title: >-
      STAC3 disorder: a common cause of congenital hypotonia in Southern African
      patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The spread of this variant worldwide and the allele frequency higher in the
      African/African-American ancestry than the Admixed Americans, strongly
      indicates that the STAC3 c.851 G > C variant has an African origin which may
      be due to an ancient mutation with migration and population bottlenecks.
    explanation: >-
      States the revised origin hypothesis for the recurrent allele.

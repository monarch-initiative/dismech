name: Sinonasal Undifferentiated Carcinoma
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Sinonasal undifferentiated carcinoma (SNUC) is a rare, high-grade epithelial
  malignancy of the nasal cavity and paranasal sinuses, defined by an
  undifferentiated morphology with no squamous or glandular differentiation and
  no evidence of Epstein-Barr virus association. It was long a diagnosis of
  exclusion, but molecular profiling has established a dominant driver: a
  neomorphic IDH2 R172 hotspot mutation, reported in 55% to more than 80% of
  cases, which produces a global DNA and H3K27 hypermethylator phenotype and
  segregates SNUC (together with IDH2-mutant large cell neuroendocrine
  carcinoma) from its histologic mimics — olfactory neuroblastoma,
  SMARCB1-deficient sinonasal carcinoma, and small cell neuroendocrine
  carcinoma. Historically diagnosed IDH2-wild-type SNUC series instead captured
  SMARCA4, NOTCH1, or TET2 alterations, with SMARCA4-deficient sinonasal
  carcinoma now separated in the WHO 5th-edition classification as a distinct
  SWI/SNF-deficient neoplasm. Cooperating TP53 mutation and CDKN2A/2B loss are
  frequent within IDH2-mutant tumors. Clinically SNUC presents late with bulky
  disease invading the orbit and anterior skull base, and outcome depends
  heavily on response to induction chemotherapy, which is used both as therapy
  and as a biological test to select between definitive chemoradiotherapy and
  surgery.
categories:
- Head and Neck Cancer
- Rare Cancer
- Solid Tumor

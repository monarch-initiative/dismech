    explanation: >-
      Supports surgery as the preferred definitive modality in
      induction-chemotherapy non-responders.
- name: IDH2-Targeted Therapy
  description: >-
    Because the IDH2 R172 hotspot is present in the large majority of SNUCs and
    is a druggable neomorphic enzyme, mutant-IDH2 inhibition has been proposed
    as a targeted strategy. It has reached prospective testing: NCT06176989 is
    an open NCI phase II of enasidenib in IDH2-mutated sinonasal and skull-base
    tumors, SNUC among them. No efficacy results are yet reported, so what is
    curated here remains a mechanistic rationale drawn from the genomic series
    rather than a demonstrated benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: enasidenib
      term:
        id: CHEBI:145374
        label: enasidenib
  target_mechanisms:
  - target: IDH2 R172 Neomorphic Hotspot Mutation
    treatment_effect: INHIBITS
    description: >-
      Mutant-selective IDH2 inhibition is directed at the neomorphic enzyme
      activity modeled by this node.
    evidence:
    - reference: PMID:28493366
      reference_title: Frequent IDH2 R172 mutations in undifferentiated and poorly-differentiated
        sinonasal carcinomas.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The vast majority of SNUCs and variable proportions of other
        poorly-differentiated sinonasal carcinomas may be amenable to
        IDH2-targeted therapy.
      explanation: >-
        Supports the target relationship only. Amenability is inferred from
        mutation frequency and no treatment outcomes are reported, so this edge is
        a mechanistic rationale rather than an efficacy claim.
  evidence:
  - reference: PMID:28493366
    reference_title: Frequent IDH2 R172 mutations in undifferentiated and
      poorly-differentiated sinonasal carcinomas.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of SNUCs and variable proportions of other
      poorly-differentiated sinonasal carcinomas may be amenable to
      IDH2-targeted therapy.
    explanation: >-
      Supports the mechanistic target rationale inferred from IDH2 R172 mutation
      frequency; no clinical treatment outcomes are reported in this genomic
      series.
clinical_trials:
- name: NCT06176989
  phase: PHASE_II
  status: RECRUITING
  description: >-
    NCI single-arm phase II of oral enasidenib, a mutant-selective IDH2
    inhibitor, in IDH2-mutated malignant sinonasal and skull-base tumors that
    have recurred locally or metastasized. Eligible histologies include
    sinonasal undifferentiated carcinoma. This is the prospective test of the
    IDH2-Targeted Therapy rationale curated above.
  target_phenotypes:
  - preferred_term: Paranasal sinus neoplasm
    term:
      id: HP:0030072
      label: Paranasal sinus neoplasm
  evidence:
  - reference: clinicaltrials:NCT06176989
    reference_title: Phase II Study of Enasidenib in IDH2-mutated Malignant Sinonasal
      and Skull Base Tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their cancer must have an IDH2 gene mutation, and it must have recurred
      locally or spread to other parts of the body. These cancers can include
      sinonasal undifferentiated carcinoma
    explanation: >-
      Establishes that mutant-IDH2 inhibition is under prospective clinical
      evaluation specifically in IDH2-mutated sinonasal undifferentiated
      carcinoma.
- name: NCT05925491
  phase: PHASE_II
  status: RECRUITING
  description: >-
    Phase II of neoadjuvant pembrolizumab added to induction chemotherapy in
    locally advanced sinonasal undifferentiated carcinoma. It tests whether
    checkpoint blockade can preserve the outcomes already achieved by induction
    chemotherapy while reducing treatment burden, so it sits alongside the
    Induction Chemotherapy entry rather than replacing it.
  target_phenotypes:
  - preferred_term: Paranasal sinus neoplasm
    term:
      id: HP:0030072
      label: Paranasal sinus neoplasm
  evidence:
  - reference: clinicaltrials:NCT05925491
    reference_title: Neoadjuvant Pembrolizumab Plus Chemotherapy in Locally Advanced
      Sinonasal Carcinoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study will test the Safety and activity of pembrolizumab plus
      chemotherapy as neoadjuvant treatment in locally advanced sinonasal
      undifferentiated carcinoma (SNUC).
    explanation: >-
      Establishes the trial's population and intervention as SNUC-specific
      neoadjuvant chemoimmunotherapy.
diagnosis:
- name: Endoscopic Biopsy
  description: >-
    Nasal endoscopy with biopsy establishes the histologic diagnosis and
    excludes the morphologic mimics (olfactory neuroblastoma, rhabdomyosarcoma,
    lymphoma, melanoma, neuroendocrine carcinoma).
  diagnosis_term:
    preferred_term: biopsy procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
- name: Mutant-Specific IDH1/2 Immunohistochemistry
  description: >-
    Multispecific mutant IDH1/2 immunohistochemistry detects the R132/R172
    mutant protein product. It is a rule-in test rather than a rule-out one:
    in the largest cohort staining was absent in all 132 histologic mimics
    (specificity 100%) but positive in only 26 of 53 SNUCs (49%), because the
    antibody does not recognise the full range of IDH alleles. A negative stain
    therefore does not exclude an IDH2-mutant SNUC and sequencing remains
    necessary to rule the diagnosis out.
  diagnosis_term:
    preferred_term: mutant-specific IDH1/2 immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:28084339
    reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multispecific mutant IDH1/2 immunohistochemistry was performed and
      identified mutant-specific protein expression in all cases with available
      tissue: 3/3 sinonasal undifferentiated carcinomas with R172 mutations were
      positive and 4/4 wild-type cases were negative.
    explanation: >-
      Supports mutant-specific IHC as a concordant surrogate for IDH2 R172
      genotype, though on very small numbers.
  - reference: DOI:10.1097/PAS.0000000000001064
    reference_title: Immunohistochemical Detection and Molecular Characterization
      of IDH-mutant Sinonasal Undifferentiated Carcinomas
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutant IDH1/2 IHC was positive in 26/53 SNUCs (49%; 20 strongly positive
      and 6 weak) and 3/8 PDCARs (37.5%; 2 strong; 1 weak) but was absent in all
      other tumor types (0/132).
    explanation: >-
      In a 193-tumor cohort, mutant-specific IHC shows 100% specificity against
      histologic mimics but 49% sensitivity within SNUC, supporting IHC as a
      rule-in test while establishing that a negative stain does not exclude an
      IDH2-mutant SNUC.
  - reference: DOI:10.1097/PAS.0000000000001064
    reference_title: Immunohistochemical Detection and Molecular Characterization
      of IDH-mutant Sinonasal Undifferentiated Carcinomas
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation-specific IDH1/2 IHC identifies IDH mutations in SNUC, however, it
      lacks sensitivity for the full range of IDH mutations.
    explanation: >-
      Directly states the allele-dependent sensitivity ceiling of mutant-specific
      IDH1/2 immunohistochemistry, requiring sequencing when IHC is negative.
  notes: >-
    The allele dependence is what limits sensitivity rather than assay quality:
    in the same cohort every strongly staining case carried IDH2 R172S/G, the
    weakly staining cases all carried R172T, and sequencing of IHC-negative
    cases still recovered an IDH2 R172T and an IDH1 R132C. The two positive
    series are consistent once read this way, and the earlier 3/3-positive
    report is a small-sample view of the strongly staining alleles.
- name: DNA Methylation Profiling
  description: >-
    Genome-wide methylation profiling clusters IDH2-mutant sinonasal carcinomas
    together and separates them from SMARCB1-deficient carcinoma and olfactory
    neuroblastoma, improving classification of this diagnostically difficult
    group.
  diagnosis_term:
    preferred_term: DNA methylation profiling
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  evidence:
  - reference: PMID:31186531
    reference_title: DNA methylation-based classification of sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      t-distributed stochastic neighbor embedding dimensionality reduction
      analysis showed no overlap between IDH2 mutants, SMARCB1-deficient
      carcinoma and olfactory neuroblastoma.
    explanation: >-
      Supports methylation profiling as a discriminator between SNUC and its
      principal diagnostic mimics.
- name: CT and MRI Staging
  description: >-
    Cross-sectional imaging defines orbital, cribriform-plate, and anterior
    skull-base extension, which drives the choice between definitive
    chemoradiotherapy and surgery.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
prevalence:
- population: United States (SEER registry, 1973-2011)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Registry-ascertained case count rather than a rate: the SEER database yielded
    only 328 SNUC cases across 38 years of national cancer-registry coverage,
    which is why almost all SNUC evidence comes from single-institution series
    and pooled registry analyses rather than trials. No SNUC-specific incidence
    rate is quoted here because the cited analysis reports the cohort size, not
    a denominator-based rate.
  evidence:
  - reference: PMID:26908559
    reference_title: "Significance of Tumor Stage in Sinonasal Undifferentiated Carcinoma Survival: A Population-Based Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SEER registry was utilized to calculate survival trends for 328
      patients with SNUC between 1973 and 2011.
    explanation: >-
      Gives the total SNUC case count ascertained by a national cancer registry
      over 38 years, establishing the order of magnitude of the disease's rarity.
differential_diagnoses:
- name: Olfactory Neuroblastoma
  disease_term:
    preferred_term: olfactory neuroblastoma
    term:
      id: MONDO:0006329
      label: olfactory neuroblastoma
  description: >-
    Esthesioneuroblastoma arises from olfactory neuroepithelium at the cribriform
    plate and overlaps SNUC in site, stage at presentation, and small-blue-cell
    morphology, but is IDH2-wild-type and separates cleanly from SNUC on
    genome-wide DNA methylation profiling.
  distinguishing_features:
  - IDH2 R172 wild type
  - >-
    Distinct DNA-methylation class with no overlap against IDH2-mutant sinonasal
    carcinomas on dimensionality-reduction analysis
  evidence:
  - reference: PMID:31186531
    reference_title: "DNA methylation-based classification of sinonasal undifferentiated carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      t-distributed stochastic neighbor embedding dimensionality reduction
      analysis showed no overlap between IDH2 mutants, SMARCB1-deficient
      carcinoma and olfactory neuroblastoma.
    explanation: >-
      Demonstrates that olfactory neuroblastoma forms a methylation class
      separate from IDH2-mutant SNUC, which is what makes it a resolvable
      differential rather than a morphologic tie.
- name: SMARCB1 (INI-1)-Deficient Sinonasal Carcinoma
  description: >-
    A separately recognized sinonasal entity defined by loss of SMARCB1/INI-1,
    historically diagnosed as SNUC before INI-1 immunohistochemistry became
    routine. It is IDH2-wild-type, forms its own DNA-methylation class, and
    carries a worse prognosis and higher locoregional recurrence rate than SNUC,
    so the distinction changes prognostic counselling rather than being purely
    academic.
  distinguishing_features:
  - Loss of SMARCB1/INI-1 nuclear expression by immunohistochemistry
  - IDH2 R172 wild type
  - Separate DNA-methylation class
  evidence:
  - reference: PMID:32001406
    reference_title: "SMARCB1-Deficient Sinonasal Carcinoma: Systematic Review and Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies comparing sinonasal undifferentiated carcinoma to SDSC reported
      worse prognosis for SDSC and increased risk for locoregional recurrence in
      the latter cohort.
    explanation: >-
      Establishes that SMARCB1-deficient sinonasal carcinoma behaves differently
      from SNUC, which is why it must be excluded rather than lumped with it.
  - reference: DOI:10.1007/s12105-022-01416-x
    reference_title: "Proceedings of the North American Society of Head and Neck
      Pathology, Los Angeles, CA, March 20, 2022: SWI/SNF-deficient Sinonasal
      Neoplasms: An Overview"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, all studied cases lacked oncogenic IDH2 mutations characteristic
      of genuine SNUC.
    explanation: >-
      Confirms the genotypic separation this differential rests on: the
      SWI/SNF-deficient sinonasal carcinomas are IDH2-wild-type, so the IDH2
      R172 hotspot discriminates them from SNUC rather than merely correlating.
  notes: >-
    MONDO has no class for SMARCB1 (INI-1)-deficient sinonasal carcinoma, so
    this differential carries no disease_term. MONDO:0100534 is the renal
    medullary SMARCB1-deficient carcinoma and is a different entity.

    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Rapid Local Invasion of Orbit and Anterior Skull Base
    description: >-
      Rapid, poorly differentiated growth in an anatomically unconfined
      air-filled space produces early transgression of the sinus walls.
  - target: Nasal Obstruction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Rapid intranasal and paranasal tumor outgrowth occludes the sinonasal
      airway.
    evidence:

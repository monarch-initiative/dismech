    explanation: >-
      Quantifies co-occurring TP53 and CDKN2A/2B inactivation within
      IDH2-mutant SNUC, which is what this node claims and what grounds the
      conformance to the evading_growth_suppressors trigger.
- name: SMARCA4 Loss-of-Function (IDH2-Wild-Type Route)
  genetic_context:
    variant_origin: SOMATIC
  biological_scale: MOLECULAR
  description: >-
    In historically diagnosed IDH2-wild-type sinonasal undifferentiated
    carcinomas, mutually exclusive somatic loss-of-function alterations in the
    SWI/SNF catalytic ATPase subunit SMARCA4 (BRG1) abolish protein expression
    and ATP-dependent chromatin remodeling, driving undifferentiated carcinoma
    without oncogenic IDH2 mutation. Contemporary WHO 5th-edition classification
    separates SMARCA4-deficient sinonasal carcinoma from genuine IDH2-mutant
    SNUC, though substantial morphologic overlap persists in clinical cohorts.
  genes:
  - preferred_term: SMARCA4
    term:
      id: hgnc:11100
      label: SMARCA4
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  downstream:
  - target: Undifferentiated High-Grade Proliferation
    description: >-
      Inactivation of SWI/SNF ATP-dependent chromatin remodeling blocks
      lineage differentiation and drives high-grade undifferentiated carcinoma
      proliferation along an IDH2-independent route.
  evidence:
  - reference: PMID:28084339
    reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations in the IDH2-wild-type sinonasal undifferentiated carcinomas
      included SMARCA4 loss-of-function with confirmed loss of
      immunohistochemical expression, NOTCH1 gain-of-function, and TET2
      loss-of-function.
    explanation: >-
      Identifies somatic SMARCA4 loss-of-function with confirmed loss of protein
      expression specifically within the IDH2-wild-type subset of morphologic
      SNUC, mutually exclusive with IDH2 R172 hotspot mutation.
  - reference: DOI:10.1007/s12105-022-01416-x
    reference_title: "Proceedings of the North American Society of Head and Neck Pathology, Los Angeles, CA, March 20, 2022: SWI/SNF-deficient Sinonasal Neoplasms: An Overview"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To date, four different SWI/SNF-driven sinonasal tumor types have been
      recognized: SMARCB1(INI1)-deficient carcinoma (showing frequently
      non-descript basaloid, and less frequently eosinophilic, oncocytoid or
      rhabdoid undifferentiated morphology), SMARCB1-deficient adenocarcinomas
      (showing variable gland formation or yolk sac-like morphology),
      SMARCA4-deficient carcinoma (lacking any differentiation markers and
      variably overlapping with large cell neuroendocrine carcinoma and SNUC),
      and lastly, SMARCA4-deficient sinonasal teratocarcinosarcoma.
    explanation: >-
      Documents that SMARCA4-deficient sinonasal carcinoma lacks differentiation
      markers, overlaps morphologically with SNUC, and is now recognized as a
      distinct SWI/SNF-driven sinonasal entity lacking IDH2 mutations.
- name: Undifferentiated High-Grade Proliferation
  biological_scale: CELLULAR
  description: >-
    The resulting tumor cell is undifferentiated and highly proliferative:
    cohesive nests, ribbons, and trabeculae of cells with hyperchromatic nuclei
    and a high nuclear-to-cytoplasmic ratio, a brisk mitotic rate, tumor
    necrosis, and vascular invasion. The absence of squamous or glandular
    differentiation is definitional and is what historically made SNUC a
    diagnosis of exclusion.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell

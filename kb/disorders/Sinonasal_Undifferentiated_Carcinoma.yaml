name: Sinonasal Undifferentiated Carcinoma
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Sinonasal undifferentiated carcinoma (SNUC) is a rare, high-grade epithelial
  malignancy of the nasal cavity and paranasal sinuses, defined by an
  undifferentiated morphology with no squamous or glandular differentiation and
  no evidence of Epstein-Barr virus association. It was long a diagnosis of
  exclusion, but molecular profiling has established a dominant driver: a
  neomorphic IDH2 R172 hotspot mutation, reported in 55% to more than 80% of
  cases, which produces a global DNA and H3K27 hypermethylator phenotype and
  segregates SNUC (together with IDH2-mutant large cell neuroendocrine
  carcinoma) from its histologic mimics — olfactory neuroblastoma,
  SMARCB1-deficient sinonasal carcinoma, and small cell neuroendocrine
  carcinoma. IDH2-wild-type tumors instead carry SMARCA4, NOTCH1, or TET2
  alterations. Cooperating TP53 mutation and CDKN2A/2B loss are frequent within
  IDH2-mutant tumors. Clinically SNUC presents late with bulky disease invading
  the orbit and anterior skull base, and outcome depends heavily on response to
  induction chemotherapy, which is used both as therapy and as a biological
  test to select between definitive chemoradiotherapy and surgery.
categories:
- Head and Neck Cancer
- Rare Cancer
- Solid Tumor
disease_term:
  preferred_term: sinonasal undifferentiated carcinoma
  term:
    id: MONDO:0006411
    label: sinonasal undifferentiated carcinoma
synonyms:
- SNUC
- sinonasal anaplastic carcinoma
- undifferentiated sinonasal carcinoma
parents:
- undifferentiated carcinoma
notes: >-
  MONDO classifies this entity only under undifferentiated carcinoma
  (MONDO:0005617) and not under the sinonasal/paranasal site branch, so it is
  not a MONDO descendant of paranasal sinus carcinoma (MONDO:0000380) even
  though the tumor is defined by that anatomic origin. The curated grouping
  Paranasal_Sinus_Carcinoma records the site-based membership that MONDO does
  not assert.
pathophysiology:
- name: IDH2 R172 Neomorphic Hotspot Mutation
  biological_scale: MOLECULAR
  description: >-
    A somatic hotspot substitution at IDH2 residue R172 (R172S, R172T, R172M,
    and related variants) converts isocitrate dehydrogenase 2 into a neomorphic
    enzyme. This is the single most frequent recurrent alteration in SNUC,
    detected in 55% of cases in one targeted-sequencing series and in 82.4% in
    another, and it is essentially absent from the other head and neck tumor
    types tested. Mutant-specific IDH1/2 immunohistochemistry tracks the
    mutation, making it a practical diagnostic surrogate.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NADP+) activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004450
      label: isocitrate dehydrogenase (NADP+) activity
  downstream:
  - target: DNA and Histone Hypermethylator Phenotype
    description: >-
      Neomorphic IDH2 activity drives the global methylation phenotype that
      distinguishes IDH2-mutant sinonasal carcinomas.
  evidence:
  - reference: PMID:28084339
    reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified IDH2 R172X mutations in 55% of sinonasal undifferentiated
      carcinomas including R172S, R172T, and R172M.
    explanation: >-
      Establishes IDH2 R172 hotspot substitution as a recurrent somatic driver
      in SNUC and names the specific residue changes.
  - reference: PMID:28493366
    reference_title: Frequent IDH2 R172 mutations in undifferentiated and
      poorly-differentiated sinonasal carcinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 R172 single nucleotide variants were overall detected in 14 (82.4%)
      SNUCs
    explanation: >-
      Independent cohort giving a higher hotspot frequency, supporting IDH2 R172
      mutation as the dominant molecular event rather than an incidental finding.
- name: DNA and Histone Hypermethylator Phenotype
  biological_scale: MOLECULAR
  description: >-
    Mutant IDH2 induces a global hypermethylator state: genome-wide DNA
    methylation profiling separates IDH2-mutant sinonasal tumors into a single
    cluster irrespective of histologic type, and the tumors show increased
    repressive H3K27 trimethylation relative to IDH2-wild-type tumors. This
    epigenetic reprogramming, rather than a proliferative signaling lesion, is
    the proximate consequence of the driver mutation.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: negative regulation of gene expression via chromosomal CpG island
      methylation
    modifier: INCREASED
    term:
      id: GO:0044027
      label: negative regulation of gene expression via chromosomal CpG island methylation
  downstream:
  - target: Undifferentiated High-Grade Proliferation
    description: >-
      Widespread promoter and H3K27 hypermethylation is proposed to lock the
      sinonasal epithelium out of a differentiated program, leaving a
      high-grade undifferentiated tumor cell.
  evidence:
  - reference: PMID:31186531
    reference_title: DNA methylation-based classification of sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 mutations in sinonasal carcinomas induce a hypermethylator phenotype
      and define a molecular subgroup of tumors arising in this location.
    explanation: >-
      States directly that the IDH2 mutation induces the hypermethylator
      phenotype modeled by this node.
  - reference: PMID:31186531
    reference_title: DNA methylation-based classification of sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 mutants demonstrated a global methylation phenotype and an increase in
      repressive trimethylation of H3K27 in comparison to IDH2 wild-type tumors
      (p < 0.001).
    explanation: >-
      Quantifies both the DNA-methylation and the repressive histone-methylation
      arms of this node against an IDH2-wild-type comparator.
- name: Cooperating Tumor Suppressor Loss
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    IDH2 mutation alone is not sufficient. Within IDH2-mutant SNUC, co-occurring
    TP53 mutation and CDKN2A/2B loss-of-function alterations are each present in
    roughly a third to two fifths of cases, disabling the p53 and RB
    antiproliferative axes. IDH2-wild-type tumors reach a comparable end by a
    different route, through SMARCA4 loss-of-function with confirmed loss of
    protein expression, NOTCH1 gain-of-function, or TET2 loss-of-function.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    modifier: DECREASED
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  downstream:
  - target: Undifferentiated High-Grade Proliferation
    description: >-
      Loss of the p53 and RB brakes, or of SWI/SNF chromatin-remodeling
      function, removes the antiproliferative control that would otherwise limit
      outgrowth of the transformed clone.
  evidence:
  - reference: PMID:28493366
    reference_title: Frequent IDH2 R172 mutations in undifferentiated and
      poorly-differentiated sinonasal carcinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 12 IDH2-mutated cases in cohort 1, five (41.7%) harboured
      co-existing TP53 mutations, four (33.3%) CDKN2A/2B loss-of-function
      alterations, four (33.3%) MYC amplification, and three (25%) had
      concurrent SETD2 mutations.
    explanation: >-
      Quantifies co-occurring TP53 and CDKN2A/2B inactivation within
      IDH2-mutant SNUC, which is what this node claims and what grounds the
      conformance to the evading_growth_suppressors trigger.
  - reference: PMID:28084339
    reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations in the IDH2-wild-type sinonasal undifferentiated carcinomas
      included SMARCA4 loss-of-function with confirmed loss of
      immunohistochemical expression, NOTCH1 gain-of-function, and TET2
      loss-of-function.
    explanation: >-
      Supports the alternative, IDH2-wild-type route to loss of growth
      suppression through SWI/SNF (SMARCA4) and TET2 inactivation.
- name: Undifferentiated High-Grade Proliferation
  biological_scale: CELLULAR
  description: >-
    The resulting tumor cell is undifferentiated and highly proliferative:
    cohesive nests, ribbons, and trabeculae of cells with hyperchromatic nuclei
    and a high nuclear-to-cytoplasmic ratio, a brisk mitotic rate, tumor
    necrosis, and vascular invasion. The absence of squamous or glandular
    differentiation is definitional and is what historically made SNUC a
    diagnosis of exclusion.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Rapid Local Invasion of Orbit and Anterior Skull Base
    description: >-
      Rapid, poorly differentiated growth in an anatomically unconfined
      air-filled space produces early transgression of the sinus walls.
  evidence:
  - reference: PMID:10562893
    reference_title: "Sinonasal undifferentiated carcinoma: a distinctive
      clinicopathologic entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A brisk mitotic rate, tumor necrosis, and vascular invasion are prominent
      features.
    explanation: >-
      Describes the high-grade proliferative and necrotic phenotype this node
      models.
- name: Rapid Local Invasion of Orbit and Anterior Skull Base
  biological_scale: TISSUE
  description: >-
    Because the paranasal sinuses are air-filled spaces that produce few early
    symptoms, SNUC characteristically reaches the orbit, cribriform plate, and
    anterior cranial fossa before diagnosis. Advanced stage at presentation,
    high locoregional recurrence, and a tendency to metastasize together account
    for the poor prognosis.
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  evidence:
  - reference: PMID:30806835
    reference_title: Sinonasal Undifferentiated Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SNUC usually presents at advanced stage and the prognosis is usually poor
      with high rates of locoregional recurrence and tendency to metastasize.
    explanation: >-
      Supports advanced-stage local disease with high locoregional recurrence as
      the dominant clinical behavior of SNUC.

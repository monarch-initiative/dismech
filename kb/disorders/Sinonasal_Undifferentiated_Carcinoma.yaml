    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 12 IDH2-mutated cases in cohort 1, five (41.7%) harboured
      co-existing TP53 mutations, four (33.3%) CDKN2A/2B loss-of-function
      alterations, four (33.3%) MYC amplification, and three (25%) had

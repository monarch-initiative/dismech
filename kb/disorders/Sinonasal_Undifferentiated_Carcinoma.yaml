      explanation: >-
        Confirms carcinoma morphology lacking squamous or glandular
        sub-differentiation, placing SNUC in the Carcinoma ICD-O family rather
        than Squamous Cell Carcinoma or Adenocarcinoma.
notes: >-
  MONDO classifies this entity only under undifferentiated carcinoma
  (MONDO:0005617) and not under the sinonasal/paranasal site branch, so it is
  not a MONDO descendant of paranasal sinus carcinoma (MONDO:0000380) even
  though the tumor is defined by that anatomic origin. The curated grouping
  Paranasal_Sinus_Carcinoma records the site-based membership that MONDO does
  not assert. Nosologically, the 5th-edition WHO head and neck classification
  separates SMARCA4-deficient sinonasal carcinoma (an IDH2-wild-type,
  SWI/SNF-driven entity) from genuine IDH2-mutant SNUC; the separate SMARCA4
  loss-of-function route is retained here because historical morphologic SNUC
  sequencing cohorts (e.g., PMID:28084339) included IDH2-wild-type
  SMARCA4-deficient tumors prior to that nosologic split.
pathophysiology:
- name: IDH2 R172 Neomorphic Hotspot Mutation
  genetic_context:
    variant_origin: SOMATIC
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Metabolic Enzyme Lesion (TCA Tumor Suppressor Loss or IDH Neomorphic Gain)"
  description: >-
    A somatic hotspot substitution at IDH2 residue R172 (R172S, R172T, R172M,
    and related variants) converts isocitrate dehydrogenase 2 into a neomorphic
    enzyme. This is the single most frequent recurrent alteration in SNUC,
    detected in 55% of cases in one targeted-sequencing series and in 82.4% in
    another, and it is essentially absent from the other head and neck tumor
    types tested. Mutant-specific IDH1/2 immunohistochemistry tracks the
    mutation, making it a practical diagnostic surrogate.
  genes:
  - preferred_term: IDH2
    term:
      id: hgnc:5383
      label: IDH2
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  molecular_functions:
  - preferred_term: isocitrate dehydrogenase (NADP+) activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004450
      label: isocitrate dehydrogenase (NADP+) activity
  downstream:
  - target: DNA and Histone Hypermethylator Phenotype
    description: >-
      Neomorphic IDH2 activity drives the global methylation phenotype that
      distinguishes IDH2-mutant sinonasal carcinomas.
  evidence:
  - reference: PMID:28084339
    reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified IDH2 R172X mutations in 55% of sinonasal undifferentiated
      carcinomas including R172S, R172T, and R172M.
    explanation: >-
      Establishes IDH2 R172 hotspot substitution as a recurrent somatic driver
      in SNUC and names the specific residue changes.
  - reference: PMID:28493366
    reference_title: Frequent IDH2 R172 mutations in undifferentiated and
      poorly-differentiated sinonasal carcinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 R172 single nucleotide variants were overall detected in 14 (82.4%)
      SNUCs
    explanation: >-
      Independent cohort giving a higher hotspot frequency, supporting IDH2 R172
      mutation as the dominant molecular event rather than an incidental finding.
- name: DNA and Histone Hypermethylator Phenotype
  biological_scale: MOLECULAR
  conforms_to: "oncometabolite_dioxygenase_inhibition#Impaired Demethylation and Genome-Wide Hypermethylation"
  description: >-
    Mutant IDH2 induces a global hypermethylator state: genome-wide DNA
    methylation profiling separates IDH2-mutant sinonasal tumors into a single
    cluster irrespective of histologic type, and the tumors show increased
    repressive H3K27 trimethylation relative to IDH2-wild-type tumors. This
    epigenetic reprogramming, rather than a proliferative signaling lesion, is
    the proximate consequence of the driver mutation.
  cell_types:
  - preferred_term: sinonasal epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  - preferred_term: nasal cavity
    term:
      id: UBERON:0001707
      label: nasal cavity
  biological_processes:
  - preferred_term: negative regulation of gene expression via chromosomal CpG island
      methylation
    modifier: INCREASED
    term:
      id: GO:0044027
      label: negative regulation of gene expression via chromosomal CpG island methylation
  downstream:
  - target: Undifferentiated High-Grade Proliferation
    description: >-
      Widespread promoter and H3K27 hypermethylation is proposed to lock the
      sinonasal epithelium out of a differentiated program, leaving a
      high-grade undifferentiated tumor cell.
  evidence:
  - reference: PMID:31186531
    reference_title: DNA methylation-based classification of sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 mutations in sinonasal carcinomas induce a hypermethylator phenotype
      and define a molecular subgroup of tumors arising in this location.
    explanation: >-
      States directly that the IDH2 mutation induces the hypermethylator
      phenotype modeled by this node.
  - reference: PMID:31186531
    reference_title: DNA methylation-based classification of sinonasal undifferentiated
      carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IDH2 mutants demonstrated a global methylation phenotype and an increase in
      repressive trimethylation of H3K27 in comparison to IDH2 wild-type tumors
      (p < 0.001).
    explanation: >-
      Quantifies both the DNA-methylation and the repressive histone-methylation
      arms of this node against an IDH2-wild-type comparator.
- name: Cooperating Tumor Suppressor Loss
  genetic_context:
    variant_origin: SOMATIC
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Tumor Suppressor Inactivation"
  description: >-
    IDH2 mutation alone is not sufficient. Within IDH2-mutant SNUC, co-occurring
    TP53 mutation and CDKN2A/2B loss-of-function alterations are each present in
    roughly a third to two fifths of cases, disabling the p53 and RB
    antiproliferative axes and cooperating with mutant IDH2 epigenetic
    reprogramming.

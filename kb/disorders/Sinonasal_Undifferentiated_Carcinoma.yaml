- name: Rapid Local Invasion of Orbit and Anterior Skull Base
  biological_scale: TISSUE
  description: >-
    Because the paranasal sinuses are air-filled spaces that produce few early
    symptoms, SNUC characteristically reaches the orbit, cribriform plate, and
    anterior cranial fossa before diagnosis. Advanced stage at presentation,
    high locoregional recurrence, and a tendency to metastasize together account
    for the poor prognosis.

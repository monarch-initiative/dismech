treatments:
- name: Induction Chemotherapy
  description: >-
    Induction chemotherapy before definitive locoregional therapy is both
    treatment and a biological test. In a 95-patient single-institution cohort
    the 5-year disease-specific survival was 59% overall; among responders,
    definitive chemoradiotherapy outperformed surgery, while among
    non-responders the position reversed and definitive chemoradiotherapy was
    associated with 0% 5-year disease-specific survival.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:30615549
    reference_title: Induction Chemotherapy Response as a Guide for Treatment
      Optimization in Sinonasal Undifferentiated Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients who achieve a favorable response to IC, definitive CRT results
      in improved survival compared with those who undergo definitive surgery.
    explanation: >-
      Supports induction chemotherapy response as the discriminator that selects
      the definitive modality.
  - reference: PMID:30615549
    reference_title: Induction Chemotherapy Response as a Guide for Treatment
      Optimization in Sinonasal Undifferentiated Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the entire cohort, the 5-years DSS probability was 59% (95% CI, 53% to
      66%).
    explanation: >-
      Gives the cohort-level survival benchmark against which the
      response-stratified arms are read.
- name: Definitive Chemoradiotherapy
  description: >-
    Concurrent chemoradiotherapy after induction chemotherapy is the preferred
    definitive modality in patients achieving at least a partial response, with
    a 5-year disease-specific survival of 81% in that group.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: PMID:30615549
    reference_title: Induction Chemotherapy Response as a Guide for Treatment
      Optimization in Sinonasal Undifferentiated Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients who had partial or complete response to IC, the 5-year DSS
      probabilities were 81% (95% CI, 69% to 88%) after treatment with definitive
      concurrent chemoradiotherapy (CRT) after IC
    explanation: >-
      Quantifies the survival achieved with definitive chemoradiotherapy in
      induction-chemotherapy responders.
- name: Surgical Resection
  description: >-
    Surgery, with postoperative radiotherapy or chemoradiotherapy, is the better
    option for patients who do not respond to induction chemotherapy, in whom
    definitive chemoradiotherapy performed markedly worse.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:30615549
    reference_title: Induction Chemotherapy Response as a Guide for Treatment
      Optimization in Sinonasal Undifferentiated Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients who do not achieve a favorable response to IC, surgery when
      feasible seems to provide a better chance of disease control and improved
      survival.
    explanation: >-
      Supports surgery as the preferred definitive modality in
      induction-chemotherapy non-responders.
- name: IDH2-Targeted Therapy
  description: >-
    Because the IDH2 R172 hotspot is present in the large majority of SNUCs and
    is a druggable neomorphic enzyme, mutant-IDH2 inhibition has been proposed
    as a targeted strategy. This is a mechanistic rationale drawn from the
    genomic series, not an efficacy result: no controlled trial evidence in SNUC
    is cited here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: enasidenib
      term:
        id: CHEBI:145374
        label: enasidenib
  target_mechanisms:
  - target: IDH2 R172 Neomorphic Hotspot Mutation
    treatment_effect: INHIBITS
    description: >-
      Mutant-selective IDH2 inhibition is directed at the neomorphic enzyme
      activity modeled by this node.
    evidence:
    - reference: PMID:28493366
      reference_title: Frequent IDH2 R172 mutations in undifferentiated and poorly-differentiated
        sinonasal carcinomas.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The vast majority of SNUCs and variable proportions of other
        poorly-differentiated sinonasal carcinomas may be amenable to
        IDH2-targeted therapy.
      explanation: >-
        Supports the target relationship only. Amenability is inferred from
        mutation frequency and no treatment outcomes are reported, so this edge is
        a mechanistic rationale rather than an efficacy claim.
  evidence:
  - reference: PMID:28493366
    reference_title: Frequent IDH2 R172 mutations in undifferentiated and
      poorly-differentiated sinonasal carcinomas.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vast majority of SNUCs and variable proportions of other
      poorly-differentiated sinonasal carcinomas may be amenable to
      IDH2-targeted therapy.
    explanation: >-
      Supports the target rationale only. The authors state amenability inferred
      from mutation frequency; they report no treatment outcomes, so this is
      recorded as PARTIAL rather than SUPPORT.

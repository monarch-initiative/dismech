  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In control fibroblasts, HDG treatment increased C16:0-plasmalogen levels
      199-291% (mean ± SD: 249 ± 31%) (Fig. 3c) and resulted in a 31-47% decrease
      (mean ± SD: 40 ± 7%) in FAR1 protein levels (Fig. 3a, b). In the patients'
      cells, treatment with HDG also increased C16:0-plasmalogen levels 130-224%
      (mean ± SD: 160 ± 35%) (Fig. 3c), but this did not result in a consistent
      decrease of FAR1 protein levels (mean ± SD: 101 ± 17%) (Fig. 3a, b).
    explanation: >-
      The controlled experiment demonstrating that the feedback response is
      present in controls and absent in patients, with the plasmalogen stimulus
      confirmed to have worked in both.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite these high plasmalogen levels, FAR1 protein levels in the patients'
      cells were threefold higher than in the HDG-treated controls
    explanation: >-
      Shows the failure is not a matter of an insufficient signal: the signal was
      already at or above the level that suppresses FAR1 in control cells.
  - reference: PMID:36720320
    reference_title: "Regulation of plasmalogen biosynthesis in mammalian cells and tissues."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Plasmalogen biosynthesis is spatiotemporally regulated by a feedback
      mechanism that senses the amount of plasmalogens in the inner leaflet of
      the plasma membrane and regulates the stability of fatty acyl-CoA reductase
      1 (FAR1), the rate-limiting enzyme for plasmalogen biosynthesis.
    explanation: >-
      Independent statement of the normal regulatory mechanism that this disease
      abolishes, from a review of the pathway rather than from the disease
      report.

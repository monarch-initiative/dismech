description: >-
  Spastic paraparesis-cataracts-speech delay syndrome is the dominant,
  gain-of-function arm of FAR1 disease. It is caused by de novo heterozygous variants at
  a single codon - Arg480 - of fatty acyl-CoA reductase 1, the rate-limiting
  enzyme of ether lipid synthesis, and it is the mechanistic inverse of the
  recessive FAR1 deficiency (RCDP4) that this knowledge base curates elsewhere.

  Read that inversion carefully, because the two FAR1 diseases are easy to
  conflate and most of the literature on the gene is about the other one. In
  RCDP4, biallelic loss of FAR1 abolishes fatty-alcohol production and patients
  are plasmalogen-*deficient*. Here, FAR1 works perfectly well: its catalytic
  function is preserved and it is correctly targeted to the peroxisome. What the
  Arg480 variants destroy is the brake. FAR1 protein is normally degraded in
  response to rising plasmalogen levels, a negative feedback loop that holds
  ether lipid output at a set point. The variants abolish that response, so FAR1
  accumulates, and ether lipid synthesis runs without a governor. Patients'
  fibroblasts have plasmalogen levels about twice control, FAR1 enzyme activity
  roughly three to four times control, and a fourfold increase in flux into ether
  lipids measured directly with a labelled fatty acid.

  The clinical consequence is the part that resists a simple story. Despite
  biochemical phenotypes that are, in the authors' words, diametrically opposed,
  the two FAR1 diseases share their cardinal features: spastic paraparesis,
  bilateral cataracts, seizures. What separates them clinically is severity and
  what is *absent* here - normal growth, no microcephaly, no dysmorphism, and
  normal brain MRI in ten of twelve patients. The observation that too much and
  too little of the same lipid class produce the same neurological and ocular
  picture is the central unexplained fact of this entity, and it is shared with a
  small group of other ether-lipid-excess disorders. It is curated below as an
  open question rather than smoothed over.

  - "pathophysiology#Lens Opacification"
  - "pathophysiology#Corticospinal Tract Dysfunction"
  rationale: >-
    This is the question the entity exists to pose, and no one has answered it.

    Cataract is caused by ether lipid deficiency: in a Pex7 mouse model of RCDP
    type 1, supplementing alkylglycerol restored plasmalogens and prevented
    cataract formation, which is a causal demonstration rather than an
    association. Cataract is also present in twelve of twelve patients whose
    ether lipids are elevated. The same holds for spastic paraparesis, which
    occurs in RCDP4 and in all of these patients, and which is also the shared
    feature of the three other ether-lipid-*excess* disorders. Too much and too
    little of the same lipid class damage the same two organs.

    Three hypotheses are worth keeping distinct, and the sources support none of
    them over the others. It may be that what matters is the *ratio* of ether to
    non-ether lipids rather than the absolute level of either, which this entry's
    lipidomics node is consistent with: total choline- and ethanolamine-lipid
    content was unchanged while the ether fraction rose, and in RCDP the same
    ratio is displaced the other way. It may be the fatty alcohols rather than
    the lipids - the paper notes that fatty alcohols accumulate in
    Sjogren-Larsson syndrome and in RCDP types 1 to 3, though not in FAR1
    deficiency, where they cannot be made. Or the two diseases may reach the same
    endpoint by genuinely different routes, and the convergence be a coincidence
    of which organs are most sensitive to any membrane-lipid disturbance.

    The authors' own verdict is that the mechanism remains enigmatic, and this
    entry does not improve on it. The practical warning: do not import RCDP
    mechanism prose into this entry on the strength of the shared phenotype. The
    biochemistry is inverted and the shared endpoint is the thing to be
    explained, not the explanation.
  proposed_experiments:
  - experiment_id: exp_far1gof_ratio_versus_level
    name: Dissociate ether/non-ether ratio from absolute ether lipid level
    description: >-
      In a single cell system, titrate ether lipid content upward (by expressing
      an Arg480 FAR1 allele) and downward (by FAR1 knockdown) while separately
      manipulating non-ether phospholipid synthesis, and measure a common
      cell-biological endpoint such as membrane order, organelle contact-site
      formation or lipid-raft-dependent signalling. If the endpoint tracks the
      ratio rather than the absolute level, that would explain the convergence.
  - experiment_id: exp_far1gof_lens_model
    name: A lens model of ether lipid excess
    description: >-
      Generate an Arg480 knock-in mouse and ask whether it develops cataracts,
      and if so whether they are prevented by limiting ether lipid synthesis -
      the mirror image of the alkylglycerol rescue experiment that established
      deficiency as a cause of cataract in the Pex7 model.
- discussion_id: far1_gof_no_model_beyond_fibroblasts
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What happens to a neuron or a lens fibre cell carrying an Arg480 FAR1
    allele?
  attaches_to:
  - "experimental_models#Patient dermal fibroblast lines with FAR1 p.Arg480His and p.Arg480Cys"
  - "pathophysiology#Corticospinal Tract Dysfunction"
  rationale: >-
    Curated as a genuine absence of evidence. There is no animal model of this
    disease, no engineered cell line carrying an Arg480 allele, no
    patient-derived neuron or lens cell, and no neuropathology - every functional
    statement in this entry comes from three patients' skin fibroblasts.

    The gap is specific rather than generic. The fibroblast carries the full
    biochemical lesion - elevated plasmalogens, elevated FAR1, fourfold ether
    lipid flux, a remodelled lipidome - and is entirely well. So the biochemistry
    alone does not cause cell dysfunction; something about the corticospinal
    tract and the lens makes them vulnerable, and no model in existence can
    address what.

    Two of the four disease alleles, p.Arg480Leu and p.Arg480Ser, have never been
    tested in any system, because no cells were available. A knock-in mouse or an
    isogenic iPSC series would close both gaps at once.
  proposed_experiments:
  - experiment_id: exp_far1gof_knockin_ipsc
    name: Isogenic Arg480 knock-in iPSC series differentiated to affected lineages
    description: >-
      Knock each of the four reported Arg480 substitutions into the endogenous
      FAR1 locus of iPSCs heterozygously, differentiate to cortical projection
      neurons and lens epithelial cells, and compare lipidome, membrane
      properties, axonal transport and survival against isogenic controls and
      against a FAR1-null line representing the recessive disease. Running the
      excess and deficiency arms in the same genetic background is what the field
      currently lacks.
- discussion_id: far1_gof_no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Could ether lipid synthesis be dialled back down, and would that help?
  attaches_to:
  - "treatments#Antiseizure Pharmacotherapy"
  - "pathophysiology#Uncontrolled Ether Lipid Synthesis"
  rationale: >-
    The only treatment reported for this disease is symptomatic seizure control,
    and this entry curates nothing else because nothing else has been tried.

    The mechanism does suggest a target, which is why the gap is worth stating
    rather than leaving as silence. Ether lipid output is high because FAR1
    escapes degradation; reducing FAR1 abundance or activity would in principle
    restore the set point. But two things are unknown and both are load-bearing.
    Nobody knows whether the damage is developmental and already done by the time
    a diagnosis is made - the congenital cataracts in five of twelve suggest at
    least part of it is - or ongoing and therefore modifiable. And nobody knows
    the therapeutic window, because ether lipid *deficiency* causes an
    overlapping and more severe disease, so overshooting has a known and bad
    phenotype.

    The mirror-image experiment already exists on the deficiency side:
    alkylglycerol supplementation prevented cataracts in a plasmalogen-deficient
    mouse. Nothing equivalent has been attempted for excess.
  proposed_experiments:
  - experiment_id: exp_far1gof_flux_reduction
    name: Test partial FAR1 knockdown in an Arg480 model
    description: >-
      In patient fibroblasts and, once available, an Arg480 knock-in animal,
      titrate FAR1 abundance down by RNA interference or antisense
      oligonucleotide and measure whether ether lipid flux, the lipidome shift
      and any cellular phenotype normalise - and at what point plasmalogen levels
      fall below normal, which defines the window.
notes: >-
  Identity, and why it is easy to get wrong. This entry is the *dominant,
  gain-of-function* FAR1 disease. The knowledge base separately curates the
  recessive loss-of-function arm - FAR1 deficiency, RCDP4 - inside
  Rhizomelic_Chondrodysplasia_Punctata_Plasmalogen_Synthesis_Defect. Same gene,
  inverted mechanism, inverted biochemistry, different entity. Most of the FAR1
  literature is about the other one, and a paper that says "FAR1" and
  "plasmalogen" and "cataract" is more likely to be about RCDP4 than about this
  disease. The discriminators are heterozygous plus codon 480 plus *elevated*
  plasmalogens. Every reference cited here was checked against that test: all
  three FAR1 disease references describe de novo heterozygous Arg480 variants
  explicitly in their titles or abstracts, and the fourth reference is a review
  of the normal regulatory pathway rather than of either disease.

  On the MONDO anchor. Two live MONDO terms name this disease - MONDO:0036212,
  which carries the OMIM, Orphanet, MedGen and UMLS cross-references, and
  MONDO:0100230, whose definition is the defining paper's title restated and
  which carries only a GARD reference. This entry anchors on the former and maps
  the latter as an exact match. The pre-existing RCDP entry refers to this
  disease by the latter identifier. That is not a disagreement about scope; it is
  a duplication in MONDO, and it should be reported upstream rather than resolved
  by either entry unilaterally.

  On the `modifier` choice at the ether-lipid node, since it is the kind of call
  a reviewer should be able to check. `GAIN_OF_FUNCTION` is used for
  "Uncontrolled Ether Lipid Synthesis" and `INCREASED` for the node above it,
  "Elevated FAR1 Protein and Enzyme Activity". The split is deliberate. The
  enzyme claim is quantitative - the same enzyme, doing the same reaction, in
  larger amounts, at three to four times control activity - which is what
  INCREASED is for and which keeps that annotation PATO-bound. The pathway claim
  is qualitative: the negative feedback loop that sets ether lipid output has
  been abolished, demonstrated by a direct perturbation, so the pathway is not
  running above a set point but running without one. That is the "outside normal
  regulatory constraints" condition the schema reserves GAIN_OF_FUNCTION for, and
  it costs the annotation its ontology grounding, which is a trade made
  knowingly. `GeneticContext.functional_impact_category` is separately set to
  HYPERMORPHIC, the more specific value for increased *normal* gene product
  activity.

  On what is absent. There is no `progression:` block: patients were 2 to 19
  years old at study and the cohort is cross-sectional, so no trajectory has been
  described. There are no animal models, because none exist. The `treatments:`
  block holds only symptomatic seizure control, which is the whole of the
  reported treatment experience; its indication, seizures, is curated as a
  phenotype in the same entry.

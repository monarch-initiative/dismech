- name: Uncontrolled Ether Lipid Synthesis
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Flux, not just enzyme level. Feeding fibroblasts a labelled odd-chain fatty
    acid lets ether and non-ether routes be tracked separately from the same
    substrate: incorporation into the non-ether lipid LPC(17:0) was the same in
    patients and controls, while FAR1-dependent incorporation into the ether
    lipid LPC(O-17:0) was almost fourfold higher in patients. The pathway is
    running fast, and specifically the ether branch.

    On the `modifier` value, which is the one interpretive choice in this entry
    that most needs defending. `GAIN_OF_FUNCTION` is used here, and
    `INCREASED` is used one node up, deliberately. The schema reserves
    GAIN_OF_FUNCTION for a process driven outside its normal regulatory
    constraints rather than merely running above its normal level, and warns
    against migrating a quantitative annotation to it without that qualitative
    justification. The justification here is not that ether lipid synthesis is
    high. It is that the homeostatic loop which sets its level has been
    eliminated: raising the pathway's own product no longer restrains it, so
    there is no set point for the output to be above. The authors' own term is
    "uncontrolled". A cell with elevated but still-regulated ether lipid
    synthesis would be INCREASED; this one has lost the control system.
  biological_processes:
  - preferred_term: ether lipid biosynthetic process
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Incorporation of C17:0-acid in LPC(17:0) was similar in controls and
      patients whereas FAR1-dependent incorporation of C17-alcohol in LPC(O-17:0)
      was almost fourfold higher in patients than in controls (Fig. 4g)
      confirming that ether lipid synthesis indeed is elevated in patients with
      p.Arg480His/Cys variants.
    explanation: >-
      A direct flux measurement, with the non-ether arm as an internal control
      showing the effect is specific to the ether branch.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analyses, including fibroblast plasmalogen measurements, FAR1
      enzyme activity assays, and lipidomics showed that the biosynthetic
      function and peroxisomal localization of FAR1 is preserved but that the
      plasmalogen-dependent regulation of FAR1 protein levels is abolished,
      resulting in uncontrolled ether lipid synthesis and considerable changes in
      the cellular lipidome.
    explanation: >-
      The authors' summary, and the wording ("abolished", "uncontrolled") that
      justifies grading this node's modifier as a qualitative loss of regulatory
      constraint rather than a quantitative elevation.
  downstream:
  - target: Membrane Lipid Composition Shift
    causal_link_type: DIRECT
- name: Membrane Lipid Composition Shift
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The disease is not simply "too much plasmalogen". Lipidomics shows ether
    species accumulating - plasmanyl/plasmenyl-choline phospholipids, and the
    neutral ether lipids DG[O] and TG[O] - with a reciprocal and significant fall
    in the corresponding non-ether phospholipids PC and PE, PE severely.
    Strikingly, the totals of choline- and ethanolamine-containing lipids stay
    roughly constant - the paper states this in the same passage, though it
    cannot be quoted here because the sentence carries the bracketed ether-lipid
    nomenclature PE[O] and PC[O] that the reference validator strips. What has
    changed is the ratio of ether to non-ether species, not the amount of
    membrane phospholipid.

    The proposed explanation is competition for a shared limited resource -
    elevated DG[O] outcompeting DG for the activated headgroups CDP-choline and
    CDP-ethanolamine - which would make this a substrate-competition effect
    rather than a direct toxicity. The polyunsaturated fatty acids also
    redistribute, away from PC and toward PC[O].

    Recorded because it is the most plausible bridge from a biochemical
    abnormality to a cellular one, and because it is the level at which this
    disease and the RCDP disorders are precise mirror images: in RCDP the
    non-ether lipids compensate for absent ether counterparts, and the PUFA
    distribution runs the other way.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Total levels of the major phospholipids phosphatidylcholine (PC) and
      phosphatidylethanolamine (PE) were both significantly decreased, with PE
      levels drastically reduced (Fig. 4a, b).
    explanation: >-
      The reciprocal fall in the non-ether phospholipids, which is what makes
      this a compositional shift rather than a simple accumulation.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Interestingly, this ether/nonether balance is precisely reversed in
      different RCDP subtypes where nonether lipids compensate for the absence of
      their ether counterparts.
    explanation: >-
      States that the same ratio is displaced in the opposite direction in the
      recessive plasmalogen-deficiency disorders, which is the sharpest available
      statement of the mirror-image relationship between the two arms of FAR1
      disease. Graded OTHER because it is the authors' comparison with a
      different disease group rather than a measurement in these patients.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      compete with DG for the limited amounts of activated headgroups
      CDP-ethanolamine and CDP-choline to synthesize ether and nonether analogs
      of PC and PE, shifting the balance toward ether phospholipids at the
      expense of the nonether equivalents
    explanation: >-
      The proposed competition mechanism. The quote begins mid-sentence because
      the clause before it names the competing species as DG[O], and the
      reference validator strips bracketed spans. Graded PARTIAL because the
      authors offer this explicitly as one possible mechanism, not as a
      demonstrated one; no competition experiment is reported.
  downstream:

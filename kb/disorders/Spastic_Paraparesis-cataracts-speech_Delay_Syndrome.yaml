- discussion_id: far1_gof_excess_and_deficiency_converge
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why do ether lipid excess and ether lipid deficiency cause the same
    cataracts and the same spastic paraparesis?

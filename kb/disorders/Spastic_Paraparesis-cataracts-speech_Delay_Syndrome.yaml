- name: Corticospinal Tract Dysfunction
  biological_scale: ORGANISM
  role: outcome
  mechanism_confidence: PROVISIONAL
  description: >-
    The presenting problem and the most consistent finding: spastic di- or
    paraparesis in twelve of twelve patients, with lower limb hypertonia, truncal
    hypotonia in half, and ankle clonus. The pattern - lower limbs affected,
    upper motor neuron signs, normal brain imaging in most - is that of a
    hereditary spastic paraplegia, which is why the authors recommend adding
    FAR1 to hereditary spastic paraplegia and cerebral palsy panels.

    Marked PROVISIONAL because the anatomical claim in the node's name is a
    clinical inference. Pyramidal tract dysfunction is what was observed; no
    imaging, electrophysiological or neuropathological localisation to the
    corticospinal tract has been reported in any patient, and brain MRI was
    normal in ten of twelve.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They presented with pyramidal tract dysfunction, exhibiting spastic di- or
      paraparesis (12/12), lower limb hypertonia, truncal hypotonia (6/12), and
      (ankle) clonus.
    explanation: >-
      The neurological phenotype with its frequencies in the defining cohort.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain imaging was within normal limits in 10/12 patients; one patient had
      abnormal temporal lobe morphology and ventricular prominence, but white
      matter was normal.
    explanation: >-
      Establishes that no structural correlate was found, which is why the
      anatomical attribution in this node is graded provisional - and is also a
      point of separation from RCDP4, where white matter abnormalities occur.
- name: Lens Opacification
  biological_scale: TISSUE
  role: outcome
  mechanism_confidence: PROVISIONAL
  description: >-
    Bilateral cataracts in twelve of twelve patients, congenital in five and
    acquired in the other seven - so this is not purely a developmental
    malformation of the lens; in most patients the lens was clear at birth and
    opacified later, over months to years.

    Marked PROVISIONAL because nothing is known about why. The one strong piece
    of causal evidence in this area points the other way entirely: in a mouse
    model of ether lipid *deficiency*, restoring plasmalogens prevented
    cataracts, establishing shortage as a cause. How excess produces the same
    end organ failure is unexplained.
  locations:
  - preferred_term: lens of camera-type eye
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, all patients had bilateral cataracts (12/12), which were
      congenital in 5/12 and acquired in the other 7/12.
    explanation: >-
      The ocular phenotype with the congenital-versus-acquired split, which is
      what shows the lens can be normal at birth and fail later.
phenotypes:
- category: Neurological

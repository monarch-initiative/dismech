genetic:
- name: FAR1
  gene_term:
    preferred_term: FAR1
    term:
      id: hgnc:26222
      label: FAR1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  notes: >-
    FAR1 is a tail-anchored protein of 515 amino acids: a cytosol-facing
    N-terminal domain (1-465), a transmembrane domain (466-483), and a
    C-terminal domain (484-515) in the peroxisomal matrix. It is the
    rate-limiting enzyme of ether lipid synthesis, reducing C16 and C18 fatty
    acyl-CoAs to the fatty alcohols that alkylglycerone phosphate synthase then
    uses.

    Reading a FAR1 variant report requires knowing which of two diseases it is
    about, and the literature does not always make that easy. Four alleles cause
    the dominant disease and all are at codon 480: c.1439G>A p.(Arg480His),
    c.1438C>T p.(Arg480Cys), c.1439G>T p.(Arg480Leu), and c.1439G>C
    p.(Arg480Ser), reported later. Biallelic loss-of-function variants anywhere
    in the gene cause the recessive disease, FAR1 deficiency or RCDP4, curated in
    this knowledge base under
    Rhizomelic_Chondrodysplasia_Punctata_Plasmalogen_Synthesis_Defect. Position
    480 and heterozygosity together are the discriminator; either alone is not.

    The ascertainment is worth recording because it shows how a recurrent-codon
    disorder gets found. Clinical exome analysts at a commercial laboratory
    noticed heterozygous FAR1 Arg480 variants recurring, searched their internal
    series of 42,983 exome trios plus 9,205 gene-list trios, found eight cases,
    and used GeneMatcher to assemble the rest. That is a pattern-recognition
    route, not a phenotype-driven one, which is part of why the cohort is
    clinically homogeneous.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FAR1 is a tail-anchored protein of 515 amino acids with an N-terminal
      domain corresponding to amino acids 1-465 facing the cytosol, a
      transmembrane domain corresponding to amino acids 466-483 and a C-terminal
      domain corresponding to amino acids 484-515 located in the peroxisomal
      matrix.
    explanation: >-
      The protein architecture that places Arg480 in the transmembrane domain.
      Graded OTHER because it is background from the paper's introduction.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was internally explored in a cohort of 42,983 exome trios and 9205
      exome-based specific gene list trios that included FAR1 analysis. This led
      to the identification of eight cases.
    explanation: >-
      The ascertainment denominator, which is the only population-scale number
      available for this disease.
  - reference: PMID:37335441
    reference_title: "Complex Hereditary Spastic Paraparesis Caused by de novo p.Arg480Ser in FAR1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, authors have identified a novel substitution in the same Arg480
      position into serine.
    explanation: >-
      A fourth substitution at the same codon, reinforcing that the residue
      rather than the replacement amino acid is what matters.
biochemical:
- name: Plasmalogen Levels as a Bidirectional FAR1 Readout
  notes: >-
    The single most useful diagnostic point in this entity, and one that inverts
    normal practice. Plasmalogen measurement is an established screening test for
    peroxisomal disease, where the abnormal result is a *low* value. In this
    disease the result is high - patient fibroblasts had C16:0-plasmalogen about
    twice control, significantly elevated at p < 0.0001.

    The corollary the authors draw is that erythrocyte plasmalogen measurement
    should be read as a bidirectional readout of ether lipid synthesis, because
    both an abnormally high and an abnormally low value can indicate FAR1-related
    pathology. A laboratory reporting only "plasmalogens not decreased" would
    miss this disease entirely.

    Two further biochemical distinctions from the peroxisomal disorders it might
    be confused with: peroxisomal beta-oxidation of very long chain fatty acids
    and DHAPAT activity are normal, and peroxisomes are of normal size and shape.
    This is not a peroxisome biogenesis disorder.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to previously reported patients with FAR1 deficiency, the
      plasmalogen levels in fibroblasts of the patients were not decreased, but
      increased (see Fig. 2a).
    explanation: >-
      The direction of the biochemical abnormality, stated against the recessive
      disease it inverts.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the measurement of plasmalogens in erythrocytes should be
      considered as a functional readout of ether lipid synthesis as both
      abnormally high or low levels could suggest FAR1-related pathology.
    explanation: >-
      The authors' recommendation that the test be read in both directions, which
      is the practical diagnostic content of this entity.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twelve patients in the defining cohort, assembled from around the world, plus
    at least two further single case reports since - a Middle Eastern patient
    with a milder presentation and a patient with a fourth Arg480 substitution.
    No population prevalence has been estimated.

    The nearest thing to a denominator is the ascertainment itself: eight of the
    twelve came from a commercial laboratory's internal series of 42,983 exome
    trios plus 9,205 gene-list trios. That is a diagnostic-yield figure from a
    referred population, not a birth prevalence, but it does bound the disease as
    very rare even among children referred for exome sequencing.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this paper we describe a cohort of 12 patients with different de novo
      missense variants in the FAR1 gene, but all resulting in an amino acid
      change at position 480 (p.Arg480Cys/His/Leu).
    explanation: >-
      The size of the defining cohort.
  - reference: PMID:36254151
    reference_title: "Milder presentation of autosomal dominant fatty acyl CoA reductase 1-related syndrome: Report of the first Middle Eastern patient and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient adds to the small number of patients recognized to date and
      expands the clinical spectrum to provide better clinical delineation,
      improve diagnosis, and develop precision medicine approaches for this
      disorder.
    explanation: >-
      An additional reported case, and the author's own characterisation of how
      few exist.
experimental_models:
- name: Patient dermal fibroblast lines with FAR1 p.Arg480His and p.Arg480Cys
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from patients 1 to 3 (two p.Arg480His, one p.Arg480Cys)
    against six anonymised control lines. Every functional claim in this entry
    comes from this model - plasmalogen measurement by gas chromatography, FAR1
    enzyme assay, immunoblot, immunofluorescence, the HDG feedback challenge, and
    lipidomics with C17:0 labelling. There is no animal model of this disease and
    no cell line carrying an engineered Arg480 allele.
  modeled_mechanisms:
  - target: Loss of Plasmalogen-Dependent Feedback Degradation of FAR1
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The HDG challenge is a genuine perturbation experiment rather than an
      observation: it raises plasmalogen by a route that bypasses FAR1, so the
      feedback loop is stimulated directly, and the patient cells' failure to
      respond isolates the regulatory defect from the enzyme's activity.
    limitations: >-
      Fibroblasts are not the affected tissue. Nothing in this model addresses
      why the corticospinal tract and the lens fail while the fibroblast, which
      carries the same lipid abnormality, is viable and unremarkable - and that
      gap is the whole distance between the biochemistry and the disease. The
      p.Arg480Leu and p.Arg480Ser alleles have never been assayed, because no
      fibroblasts were available.
    readouts:
    - name: FAR1 protein level after HDG-induced plasmalogen loading
      target: Loss of Plasmalogen-Dependent Feedback Degradation of FAR1
      direction: UNCHANGED
      interpretation: >-
        A real negative result. Controls dropped FAR1 by about 40 percent;
        patient cells held it at 101 percent of baseline despite a comparable
        plasmalogen rise.
      evidence:
      - reference: PMID:33239752
        reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In the patients' cells, treatment with HDG also increased
          C16:0-plasmalogen levels 130-224% (mean ± SD: 160 ± 35%) (Fig. 3c), but
          this did not result in a consistent decrease of FAR1 protein levels
          (mean ± SD: 101 ± 17%) (Fig. 3a, b).
        explanation: >-
          The measurement underlying this readout, including confirmation that
          the stimulus worked.
    evidence:
    - reference: PMID:33239752
      reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We studied the effect of the identified FAR1 variants in fibroblasts of
        patients 1-3
      explanation: >-
        Establishes which patients the model represents, which bounds what it can
        be informative about. The same sentence records the alleles as two
        p.Arg480His and one p.Arg480Cys; that part is not quoted because the
        source writes the counts in square brackets, which the validator strips.
  - target: Uncontrolled Ether Lipid Synthesis
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The C17:0 labelling experiment measures ether and non-ether lipid synthesis
      from the same exogenous substrate in the same cells, so the non-ether arm
      is an internal control for uptake and general lipid handling.
    limitations: >-
      A fibroblast's ether lipid demand is not a neuron's or a lens fibre cell's,
      and the fourfold flux increase measured here cannot be assumed to be the
      magnitude in the tissues that fail.
    readouts:
    - name: C17:0-alcohol incorporation into LPC(O-17:0)
      target: Uncontrolled Ether Lipid Synthesis
      direction: INCREASED
      interpretation: >-
        Almost fourfold higher in patients, while incorporation into the
        non-ether LPC(17:0) was unchanged - flux specifically down the ether
        branch.
      evidence:
      - reference: PMID:33239752
        reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Incorporation of C17:0-acid in LPC(17:0) was similar in controls and
          patients whereas FAR1-dependent incorporation of C17-alcohol in
          LPC(O-17:0) was almost fourfold higher in patients than in controls
        explanation: >-
          The flux measurement underlying this readout, with its internal
          control.
    evidence:
    - reference: PMID:33239752
      reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Lipidomic analysis of LPC(17:0) and LPC(O-17:0) was used to compare
        nonether and ether lipid synthesis, respectively, in fibroblasts of
        controls and patients.
      explanation: >-
        Describes the design that makes this model informative for a flux claim
        rather than a steady-state one.
treatments:
- name: Antiseizure Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The only treatment reported in this disease, and it is symptomatic. Seizures
    in the defining cohort responded to barbiturates, levetiracetam and
    oxcarbazepine, and in four of the eight treated patients antiepileptic
    treatment was withdrawn without recurrence.

    That last detail is the clinically useful one. Early-onset epilepsy in an
    inborn error of metabolism is often refractory; here it appears both
    treatable and, in half of cases, self-limiting. Nothing is reported about
    which agent to prefer, and with eight patients across three drug classes
    nothing could be.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: oxcarbazepine
      term:
        id: CHEBI:7824
        label: oxcarbazepine
    - preferred_term: barbiturate
      term:
        id: NCIT:C67084
        label: Barbiturate
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures occurred in 8/12 patients, mainly in the first months of life, and
      appeared amenable to therapy with barbiturates, levetiracetam, and/or
      oxcarbazepine. Antiepileptic treatment could be discontinued without
      recurrence of seizures in 4/8 patients.
    explanation: >-
      The agents used, the response, and the withdrawal outcome - the whole of
      the reported treatment experience in this disease.
diagnosis:
- name: FAR1 on Spastic Paraplegia, Cerebral Palsy and Juvenile Cataract Panels
  description: >-
    The combination that should prompt the test is spastic paraparesis plus
    bilateral cataracts, and the authors' explicit recommendation is that FAR1 be
    added to hereditary spastic paraplegia, cerebral palsy and juvenile cataract
    gene panels. Cerebral palsy is on that list for a reason: a child with
    non-progressive lower-limb spasticity, normal brain MRI and no perinatal
    history is routinely labelled cerebral palsy, and one of the twelve defining
    patients was in fact found through an exome-based cerebral palsy panel.

    The biochemical confirmation is plasmalogen measurement, read for an
    elevated result - which is the opposite of how the same test is read in every
    other peroxisomal disorder.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that for patients with spastic paraparesis and bilateral
      cataracts, FAR1 should be considered as a candidate gene and added to gene
      panels for hereditary spastic paraplegia, cerebral palsy, and juvenile
      cataracts.
    explanation: >-
      The authors' diagnostic recommendation, which is the practical content of
      this entity.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical trio (patients 2-10 and 12) or quartet (patient 1, with unaffected
      sibling) exome analysis was performed for patients 1-10 and 12 and an
      exome-based cerebral palsy panel was performed for patient 11.
    explanation: >-
      One patient was found on a cerebral palsy panel, which is why that panel is
      named in the recommendation.
differential_diagnoses:
- name: FAR1 deficiency (RCDP4) - the recessive, plasmalogen-deficient arm of the same gene
  disease_term:
    preferred_term: rhizomelic chondrodysplasia punctata type 4
    term:
      id: MONDO:0014510
      label: fatty acyl-CoA reductase 1 deficiency
  description: >-
    The differential that matters most, because the gene is the same and the
    clinical overlap is substantial: spasticity, seizures and bilateral cataracts
    occur in both. Everything else separates them.

    Biochemically they are opposites - RCDP4 patients are plasmalogen-deficient,
    these patients have elevated ether lipids. Genetically, RCDP4 needs two
    loss-of-function alleles anywhere in FAR1; this disease needs one Arg480
    missense allele. Clinically, RCDP4 patients have profound intellectual
    disability, severe growth failure, microcephaly and facial dysmorphism, and
    some have cerebral white matter abnormalities; these patients have normal
    growth, no microcephaly, no dysmorphism, normal MRI in most, and intellectual
    disability in only three of twelve.

    The defining paper flags what is unusual about this pair: gene-dose and
    direction-of-effect differences within one gene are not new, but a pair with
    an *overlapping clinical* phenotype and a *completely opposite biochemical*
    one had not been described before.

    This knowledge base curates RCDP4 within
    Rhizomelic_Chondrodysplasia_Punctata_Plasmalogen_Synthesis_Defect, whose own
    differential list already names this disease as the mechanistically inverse
    FAR1 gain-of-function disorder - under the identifier MONDO:0100230, the
    duplicate MONDO term discussed in this entry's mappings.
  distinguishing_features:
  - >-
    Plasmalogens are elevated in the dominant Arg480 disease and deficient in
    recessive FAR1 deficiency.
  - >-
    One de novo Arg480 missense allele versus two loss-of-function alleles.
  - >-
    Normal growth, no microcephaly and no dysmorphism here; severe growth
    failure, microcephaly and facial dysmorphism in FAR1 deficiency.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with FAR1 heterozygous de novo variants share many clinical
      symptoms with FAR1 deficiency, including spastic features, seizures, and
      bilateral cataracts, but have normal brain magnetic resonance images
      (MRIs), normal growth, no microcephaly, and no dysmorphic features.
    explanation: >-
      The clinical overlap and the specific features that separate the two FAR1
      diseases.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the biochemical phenotypes are the complete opposite of each
      other; the FAR1-deficient patients have a profound deficiency of
      plasmalogens whereas the patients with the heterozygous de novo variants
      have elevated levels of ether lipids, including plasmalogens.
    explanation: >-
      The biochemical inversion, which is the discriminating test.
- name: Hereditary spastic paraplegia and cerebral palsy
  description: >-
    The labels these patients carry before the diagnosis is made. Non-progressive
    or slowly progressive lower-limb spasticity with normal brain imaging and no
    perinatal insult is the classic route to a cerebral palsy label, and one of
    the twelve was found on a cerebral palsy panel. The feature that should
    redirect the workup is the cataracts, which belong to neither of those
    diagnoses.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings show that for patients with spastic paraparesis and bilateral
      cataracts, FAR1 should be considered as a candidate gene and added to gene
      panels for hereditary spastic paraplegia, cerebral palsy, and juvenile
      cataracts.
    explanation: >-
      Names the two clinical categories this disease is misassigned to.
- name: The other ether-lipid-excess disorders - EPT1 (SELENOI), PCYT2 and Sjogren-Larsson syndrome
  description: >-
    A small and recently recognised group that biochemically resembles this
    disease rather than RCDP: SELENOI (EPT1) deficiency, PCYT2 deficiency and
    Sjogren-Larsson syndrome all show elevated ether lipids, and all present with
    spastic paraparesis plus some form of ocular pathology - cataracts, optic
    atrophy or macular dystrophy. Sjogren-Larsson syndrome adds ichthyosis, which
    is the readiest clinical separator.

    Recorded as a differential and, more usefully, as a group: their existence is
    the strongest argument that ether lipid excess itself, rather than something
    idiosyncratic to FAR1, produces this clinical pattern.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      On the other side of the spectrum, three disorders have recently been
      reported that biochemically show elevated levels of ether lipids: EPT1
      deficiency (SELENOI),22,23 PCYT2 deficiency (PCYT2),14,24 and
      Sjögren-Larsson syndrome (SLS, ALDH3A2).25,26
    explanation: >-
      Names the three other ether-lipid-excess disorders. Graded OTHER because it
      is the authors' survey of neighbouring literature rather than their own
      data.

  downstream:
  - target: Loss of Plasmalogen-Dependent Feedback Degradation of FAR1
    causal_link_type: DIRECT
- name: Loss of Plasmalogen-Dependent Feedback Degradation of FAR1
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The lesion, and the reason this disease exists as a separate entity from
    RCDP4.

    Normally, FAR1 abundance is set by a negative feedback loop: rising cellular
    plasmalogen triggers active degradation of FAR1 protein, so ether lipid
    output self-limits. The experiment that demonstrates the loop is broken here
    is a clean one. Loading fibroblasts with 1-O-hexadecyl-sn-glycerol raises
    plasmalogen by a route that bypasses FAR1 entirely, and in control cells that
    drops FAR1 protein by about 40 percent. In patients' cells the same treatment
    raised plasmalogen just as intended, and FAR1 protein did not fall.

    The starting condition makes the point sharper still. Untreated patient cells
    already had plasmalogen about twice control - roughly the level that
    HDG-treated control cells reach - and yet held FAR1 protein at three times
    the HDG-treated control level. The signal was maximal and the response was
    absent.
  biological_processes:
  - preferred_term: plasmalogen-triggered degradation of FAR1
    term:
      id: GO:0030163
      label: protein catabolic process
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: peroxisomal membrane

    description: >-
      Curated as HYPERMORPHIC rather than the generic GAIN_OF_FUNCTION, and the
      distinction is worth the words. The enum defines HYPERMORPHIC as increased
      *normal* gene product activity and NEOMORPHIC as a novel activity absent
      from the wild type. What was measured here is more of the normal reaction:
      FAR1's biosynthetic function and peroxisomal localisation are preserved,
      peroxisomal beta-oxidation and DHAPAT activity are normal, and the enzyme
      makes the same fatty alcohols it always did - there is simply more enzyme
      because it is no longer degraded. No new catalytic activity is reported,
      so NEOMORPHIC is wrong, and HYPERMORPHIC is more specific than
      GAIN_OF_FUNCTION without asserting anything beyond the data.

      DOMINANT_NEGATIVE is excluded by the direction of effect: the wild-type
      allele is not being interfered with, and total FAR1 activity is up rather
      than down.

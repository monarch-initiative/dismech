inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic and, in every reported case, de novo. Twelve patients in the
    defining cohort each carry one variant Arg480 allele with two unaffected
    parents; subsequent single cases are likewise de novo. No transmission from
    an affected parent to a child has been described, so the 50 percent
    recurrence risk usually quoted for a dominant disorder is a theoretical
    figure here rather than an observed one, and reproductive outcomes for
    affected individuals are unknown.

    The contrast with the other FAR1 disease is the point. RCDP4 is autosomal
    recessive: two loss-of-function alleles, unaffected heterozygous parents.
    This disease needs one gain-of-function allele. A single heterozygous FAR1
    variant found in a patient is therefore not automatically a carrier finding -
    which allele class it is decides everything.
  evidence:
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 12 individuals from around the world with heterozygous de
      novo missense variants in FAR1 (NM_032228.6): 4 patients with variant
      c.1439G>A (p.Arg480His), 7 patients with variant c.1438C>T (p.Arg480Cys),
      and 1 patient with variant c.1439G>T (p. Arg480Leu) (Table 1).
    explanation: >-
      Establishes heterozygous de novo inheritance in all twelve defining
      patients, with the allele counts.
  - reference: PMID:33239752
    reference_title: "An autosomal dominant neurological disorder caused by de novo variants in FAR1 resulting in uncontrolled synthesis of ether lipids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous de novo variants affecting the Arg480 residue of FAR1 lead to
      an autosomal dominant disorder with a different disease mechanism than that
      of recessive FAR1 deficiency and a diametrically opposed biochemical
      phenotype.
    explanation: >-
      The authors' own statement that this is a distinct dominant entity from
      recessive FAR1 deficiency, which is the scope decision this entry rests on.
pathophysiology:
- name: De Novo Heterozygous FAR1 Arg480 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Every reported allele changes the same arginine. Four patients carry
    c.1439G>A p.(Arg480His), seven c.1438C>T p.(Arg480Cys), one c.1439G>T
    p.(Arg480Leu), and a later single case p.(Arg480Ser). None is in gnomAD.

    The residue's position is the mechanism. Arg480 sits in FAR1's predicted
    transmembrane domain, amino acids 466 to 483, near the edge facing the
    peroxisomal matrix - and the region flanking that domain on the matrix side
    is the part previously shown to be required for plasmalogen-dependent control
    of FAR1 stability. So the variants are in the regulatory element, not in the
    catalytic domain, which is exactly what the functional results show: catalysis
    intact, regulation gone.

    That every disease allele is at one codon, and that four different
    substitutions there all produce the same disease, is strong evidence that the
    residue itself is the essential thing rather than any particular replacement
    amino acid.

prevalence:
- population: Finland
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.4
  notes: >-
    LPI is enriched in the Finnish population due to a founder splice variant
    (c.895-2A>T); the classic Finnish birth incidence is approximately 1 in
    60,000.
  evidence:
  - reference: PMID:17764084
    reference_title: "Lysinuric protein intolerance: update and extended mutation analysis of the SLC7A7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genuine founder effect mutation has been demonstrated only in Finland, where LPI patients share the same homozygous mutation, c.895-2A>T."
    explanation: The founder mutation underlies the elevated Finnish disease frequency.

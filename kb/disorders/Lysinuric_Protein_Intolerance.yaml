diagnosis:
- name: 24-Hour Urinary Cationic Amino Acid Excretion
  description: >-
    Biochemical diagnosis demonstrates markedly elevated 24-hour urinary
    excretion of cationic amino acids (especially lysine, along with arginine
    and ornithine) accompanied by low-to-borderline plasma cationic amino acid
    levels and postprandial hyperammonemia.
  diagnosis_term:
    preferred_term: Urinary amino acid analysis
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis is established in an individual with clinical and laboratory features suggestive of LPI including elevated 24-hour urinary excretion of cationic amino acids, especially lysine."
    explanation: Elevated 24-hour urinary cationic amino acid excretion is the hallmark biochemical diagnostic finding.
- name: SLC7A7 Molecular Genetic Testing
  description: >-
    Identification of biallelic pathogenic variants in SLC7A7 confirms the
    diagnosis of LPI and enables carrier and prenatal testing in at-risk
    relatives.
  diagnosis_term:
    preferred_term: SLC7A7 molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Identification of biallelic SLC7A7 pathogenic variants confirms the diagnosis."
    explanation: Confirms molecular genetic testing of SLC7A7 as the definitive diagnostic test.
treatments:
- name: Dietary protein restriction
  action_category: THERAPEUTIC
  description: >-
    Long-term restriction of dietary protein and avoidance of large boluses of
    protein or amino acids to limit nitrogen load and prevent postprandial
    hyperammonemic decompensation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Postprandial Hyperammonemic Decompensation
    treatment_effect: INHIBITS
    description: Restricting dietary protein intake and avoiding protein or amino-acid boluses reduces exogenous nitrogen loading and prevents hyperammonemic crises.
    evidence:
    - reference: PMID:20301535
      reference_title: "Lysinuric Protein Intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Prevention of primary manifestations: Long-term protein restriction and administration of citrulline and nitrogen-scavenging drugs."
      explanation: Long-term dietary protein restriction prevents primary hyperammonemic manifestations.
    - reference: PMID:20301535
      reference_title: "Lysinuric Protein Intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Agents/circumstances to avoid: Large boluses of protein or amino acids."
      explanation: Avoiding large boluses of protein or amino acids prevents acute nitrogen overload and postprandial hyperammonemic crises.
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Long-term: dietary protein restriction; oral supplementation with citrulline and nitrogen-scavenger drugs, L-lysine-HCl, and carnitine"
    explanation: Dietary protein restriction is the mainstay of long-term management.
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Agents/circumstances to avoid: Large boluses of protein or amino acids."
    explanation: GeneReviews explicitly advises avoiding large boluses of protein or amino acids.
- name: Citrulline supplementation
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Oral L-citrulline is absorbed via neutral amino acid transport systems
    independent of y+LAT-1 and replenishes hepatic urea-cycle intermediates
    (arginine and ornithine) to restore ammonia detoxification.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-citrulline
      term:
        id: CHEBI:16349
        label: L-citrulline
  target_mechanisms:
  - target: Urea Cycle Substrate Deficiency
    treatment_effect: BYPASSES
    description: Neutral amino acid transport of L-citrulline bypasses the y+LAT-1 cationic amino acid transport defect to replenish urea-cycle substrates and prevent hyperammonemia.
    evidence:
    - reference: PMID:31653080
      reference_title: "Inducible Slc7a7 Knockout Mouse Model Recapitulates Lysinuric Protein Intolerance Disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observed that citrulline treatment improves the metabolic derangement and survival."
      explanation: Demonstrates in vivo rescue of metabolic derangement by citrulline supplementation.
  evidence:
  - reference: PMID:31653080
    reference_title: "Inducible Slc7a7 Knockout Mouse Model Recapitulates Lysinuric Protein Intolerance Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hyperammonemia is currently prevented by citrulline supplementation."
    explanation: Citrulline supplementation prevents hyperammonemia in LPI patients.
- name: Nitrogen-scavenger therapy for acute hyperammonemia
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Acute hyperammonemic crises are managed with intravenous arginine chloride
    and nitrogen-scavenger drugs (sodium benzoate and sodium phenylacetate)
    alongside reduction of nitrogen intake and carbohydrate-based energy provision.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium benzoate
      term:
        id: CHEBI:113455
        label: sodium benzoate
    - preferred_term: sodium phenylacetate
      term:
        id: CHEBI:749228
        label: sodium phenylacetate
    - preferred_term: L-arginine
      term:
        id: CHEBI:16467
        label: L-arginine
  target_mechanisms:
  - target: Postprandial Hyperammonemic Decompensation
    treatment_effect: INHIBITS
    description: Nitrogen scavengers provide alternative waste-nitrogen excretion while intravenous arginine replenishes urea-cycle intermediates during acute crises.
    evidence:
    - reference: PMID:20301535
      reference_title: "Lysinuric Protein Intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In acute hyperammonemic crises: intravenous administration of arginine chloride and nitrogen-scavenger drugs (sodium benzoate, sodium phenylacetate) to block ammonia production; reduction of excess nitrogen in the diet; provision of energy as carbohydrates to reduce catabolism."
      explanation: Nitrogen scavengers plus intravenous arginine directly treat acute hyperammonemic crises.
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

name: Lysinuric protein intolerance
creation_date: "2026-07-07T16:30:00Z"
category: Mendelian
synonyms:
- LPI
- Hyperdibasic aminoaciduria type 2
- Cationic aminoaciduria
- y+LAT-1 deficiency
- SLC7A7 deficiency
description: >-
  Lysinuric protein intolerance (LPI) is an autosomal recessive inborn error of
  metabolism caused by biallelic loss-of-function variants in SLC7A7, which
  encodes the y+LAT-1 light-chain subunit of the heterodimeric cationic amino
  acid transporter. Defective transport of the dibasic (cationic) amino acids
  lysine, arginine, and ornithine at the basolateral membrane of intestinal and
  renal tubular epithelium causes their urinary loss and systemic deficiency.
  Depletion of the urea-cycle intermediates arginine and ornithine impairs
  ammonia detoxification, producing protein-induced postprandial hyperammonemia.
  Beyond the metabolic phenotype, LPI is a multisystem disease with pulmonary
  alveolar proteinosis, renal glomerular and tubular disease, hematologic and
  immune dysregulation resembling hemophagocytic lymphohistiocytosis, growth
  failure, and osteoporosis.

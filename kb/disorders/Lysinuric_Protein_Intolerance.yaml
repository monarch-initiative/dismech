      reference_title: "Pulmonary alveolar proteinosis and glomerulonephritis in lysinuric protein intolerance: case reports and autopsy findings of four pediatric patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three patients had a clinically obvious renal insufficiency, but all four showed histologic signs of immune complex-mediated glomerulonephritis."
      explanation: Renal insufficiency progressing from glomerulonephritis.

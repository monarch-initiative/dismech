  description: >-
    Progressive glomerular and proximal tubular disease, including immune
    complex-mediated glomerulonephritis, is a recognized renal complication of
    LPI that can progress to chronic kidney disease.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:8163273
    reference_title: "Pulmonary alveolar proteinosis and glomerulonephritis in lysinuric protein intolerance: case reports and autopsy findings of four pediatric patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients had a clinically obvious renal insufficiency, but all four showed histologic signs of immune complex-mediated glomerulonephritis."
    explanation: Autopsy series documents renal insufficiency and immune-complex glomerulonephritis.
  downstream:
  - target: Chronic kidney disease
    description: Progressive glomerular and tubular disease can advance to chronic kidney disease.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

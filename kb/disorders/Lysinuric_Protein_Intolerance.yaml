progression:
- phase: Infantile-onset multisystem metabolic disease
  age_range: Typically after weaning through adulthood
  notes: >-
    LPI typically becomes symptomatic after an infant is weaned from breast milk
    or formula onto higher-protein foods, with recurrent vomiting, protein
    aversion, failure to thrive, and hyperammonemic episodes; multisystem
    pulmonary, renal, hematologic, and skeletal complications accrue over time.
    Clinical presentation is highly variable with no established
    genotype-phenotype correlation.
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lysinuric protein intolerance (LPI) typically presents after an infant is weaned from breast milk or formula; variable findings include recurrent vomiting and episodes of diarrhea, episodes of stupor and coma after a protein-rich meal, poor feeding, aversion to protein-rich food, failure to thrive, hepatosplenomegaly, and muscular hypotonia."
    explanation: GeneReviews summarizes the typical age of onset and presenting features.
  - reference: PMID:17764084
    reference_title: "Lysinuric protein intolerance: update and extended mutation analysis of the SLC7A7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LPI patients show extreme variability in clinical presentation, and no genotype-phenotype correlations have been defined."
    explanation: Documents the variable course and lack of genotype-phenotype correlation.
pathophysiology:
- name: SLC7A7 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline SLC7A7 pathogenic variants abolish function of y+LAT-1,
    the catalytic light-chain subunit that, together with the 4F2hc heavy chain,
    mediates y+L system cationic amino acid transport. This is the initiating
    molecular lesion in LPI.

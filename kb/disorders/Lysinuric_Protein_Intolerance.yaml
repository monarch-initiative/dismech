    snippet: "Prevention of secondary complications: Minimize the risk of respiratory infections; vaccination against influenza is recommended. Varicella immunization in those without previous history of chickenpox or varicella zoster; treatment of those exposed as immune-compromised persons; revaccination may be required if poor response to polysaccharide-containing vaccines."

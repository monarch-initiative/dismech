  - target: Failure to thrive
    description: Early post-weaning amino acid depletion and protein intolerance impair infant weight gain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301535
      reference_title: "Lysinuric Protein Intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Lysinuric protein intolerance (LPI) typically presents after an infant is weaned from breast milk or formula; variable findings include recurrent vomiting and episodes of diarrhea, episodes of stupor and coma after a protein-rich meal, poor feeding, aversion to protein-rich food, failure to thrive, hepatosplenomegaly, and muscular hypotonia."
      explanation: GeneReviews identifies failure to thrive after weaning onto higher-protein foods as a characteristic presenting feature of LPI.
    - reference: PMID:28057010
      reference_title: "Update on Lysinuric Protein Intolerance, a Multi-faceted Disease Retrospective cohort analysis from birth to adulthood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Presenting signs were failure to thrive (n = 9), gastrointestinal disorders (n = 2), cytopenia (n = 6), hyperammonemia (n = 10) with acute encephalopathy (n = 4) or developmental disability (n = 3), and proteinuria (n = 1)."
      explanation: Cohort data confirm failure to thrive as the most common presenting manifestation (9 of 16 patients).
  - target: Growth delay
    description: Chronic metabolic disease and amino acid deficiency contribute to poor linear growth.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Chronic amino acid deficiency.
    - Protein aversion and restricted protein tolerance.
    evidence:
    - reference: PMID:20301535
      reference_title: "Lysinuric Protein Intolerance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Over time, findings include: poor growth, osteoporosis, involvement of the lungs (progressive interstitial changes, pulmonary alveolar proteinosis) and of the kidneys (progressive glomerular and proximal tubular disease)"
      explanation: GeneReviews documents poor growth as a progressive LPI finding.

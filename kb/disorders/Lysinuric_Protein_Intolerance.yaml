treatments:
- name: Dietary protein restriction
  description: >-
    Long-term restriction of dietary protein to limit nitrogen load and prevent
    hyperammonemic decompensation.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: MAXO:0000088
      label: dietary intervention
  evidence:
  - reference: PMID:20301535
    reference_title: "Lysinuric Protein Intolerance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term: dietary protein restriction; oral supplementation with citrulline and nitrogen-scavenger drugs, L-lysine-HCl, and carnitine"
    explanation: Dietary protein restriction is the mainstay of long-term management.
- name: Citrulline supplementation
  description: >-
    Oral L-citrulline replenishes urea-cycle intermediates (regenerating
    arginine and ornithine) to support ammonia detoxification without a cationic
    amino acid transport requirement.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

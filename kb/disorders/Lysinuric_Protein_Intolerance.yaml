    snippet: "LPI is caused by mutations in the SLC7A7 gene, which encodes the y(+)LAT-1 protein, the catalytic light chain subunit of a complex belonging to the heterodimeric amino acid transporter family."
    explanation: Establishes the causal SLC7A7/y+LAT-1 molecular defect.
  - reference: PMID:17764084
    reference_title: "Lysinuric protein intolerance: update and extended mutation analysis of the SLC7A7 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coexpression of 4F2hc (the heavy chain subunit) and y(+)LAT-1 induces y(+)L activity (CAA transport)."
    explanation: Defines the y+LAT-1/4F2hc heterodimer as the functional cationic amino acid transporter.

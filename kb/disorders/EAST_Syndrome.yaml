- name: Impaired Cochlear Endolymph Homeostasis
  description: In the cochlea, Kir4.1 is expressed in the stria vascularis and is required for the generation of endolymph and the endocochlear potential. Loss of Kir4.1 function impairs endolymph homeostasis and the ionic environment needed for normal hair-cell transduction, producing sensorineural hearing loss.

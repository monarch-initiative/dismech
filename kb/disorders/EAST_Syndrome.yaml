differential_diagnoses:
- name: Gitelman syndrome
  disease_term:
    preferred_term: Gitelman syndrome
    term:
      id: MONDO:0009904
      label: Gitelman syndrome
  description: Autosomal recessive distal convoluted tubulopathy caused by biallelic SLC12A3 variants that shares the renal biochemical profile of normotensive hypokalemic metabolic alkalosis and hypomagnesemia.
  distinguishing_features:
  - Gitelman syndrome presents with isolated distal convoluted tubule salt wasting without infantile-onset epilepsy, cerebellar ataxia, or sensorineural deafness.
  - Molecular genetic testing identifies biallelic variants in SLC12A3 rather than KCNJ10.
  evidence:
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Two well-known disorders of renal tubular salt handling, Bartter’s syndrome and the Gitelman syndrome, are characterized by polyuria and normotensive hypokalemic metabolic alkalosis.
    explanation: Identifies Gitelman syndrome as a classic renal tubular salt-handling disorder sharing normotensive hypokalemic metabolic alkalosis with EAST syndrome.
- name: Bartter syndrome
  disease_term:
    preferred_term: Bartter syndrome
    term:
      id: MONDO:0015231
      label: Bartter syndrome
  description: A group of autosomal recessive renal tubular salt-wasting disorders presenting with polyuria and normotensive hypokalemic metabolic alkalosis, including Bartter syndrome type IV which combines renal salt wasting with sensorineural deafness.
  distinguishing_features:
  - Caused by pathogenic variants in thick ascending limb transport genes (SLC12A1, KCNJ1, CLCNKB, or BSND) rather than biallelic KCNJ10 variants
  - Bartter syndrome types I and II are restricted to the kidney, whereas Bartter syndrome type IV combines renal salt wasting with sensorineural deafness but lacks the infantile-onset epilepsy and cerebellar ataxia characteristic of EAST syndrome
  evidence:
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Two well-known disorders of renal tubular salt handling, Bartter’s syndrome and the Gitelman syndrome, are characterized by polyuria and normotensive hypokalemic metabolic alkalosis.
    explanation: Establishes Bartter syndrome as a primary differential diagnosis for normotensive hypokalemic metabolic alkalosis.
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Mutations in the transport genes of the renal tubular lumen often lead to kidney-specific phenotypes, as in the Gitelman syndrome and Bartter’s syndrome types I and II.2–4,40 Mutations in the basolateral subunit of a renal tubular chloride channel result in clinical findings in the kidney and the ear, as seen in Bartter’s syndrome type IV.6
    explanation: Distinguishes Bartter syndrome types I/II (kidney-specific) and Bartter syndrome type IV (kidney and ear) from the combined brain, inner ear, and renal phenotype of KCNJ10-related EAST syndrome.
- name: Hypokalemic tubulopathy and deafness
  disease_term:
    preferred_term: hypokalemic tubulopathy and deafness
    term:
      id: MONDO:0859167
      label: hypokalemic tubulopathy and deafness
  description: Autosomal recessive tubulopathy and sensorineural deafness caused by biallelic variants in KCNJ16, which encodes the Kir5.1 subunit that forms heterotetramers with Kir4.1 (KCNJ10) in the distal nephron.
  distinguishing_features:
  - KCNJ16-related tubulopathy presents with hypokalemic salt-wasting tubulopathy, metabolic acidosis of variable severity rather than alkalosis, and sensorineural hearing loss, while the central nervous system is unaffected.
  - Genetic testing identifies biallelic variants in KCNJ16 rather than KCNJ10.
  evidence:
  - reference: PMID:35370765
    reference_title: 'EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Biallelic loss-of-function mutations of Kir5.1 can also have disease significance, but the clinical symptoms differ substantially from those of EAST/SeSAME syndrome: although sensorineural hearing loss and hypokalemia are replicated, there is no alkalosis, but rather acidosis of variable severity; in contrast to EAST/SeSAME syndrome, the CNS is unaffected.'
    explanation: Directly contrasts KCNJ16 (Kir5.1)-associated hypokalemic tubulopathy and deafness with EAST/SeSAME syndrome, highlighting metabolic acidosis and absence of central nervous system involvement as key distinguishing features.
  - reference: PMID:21633011
    reference_title: Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In conclusion, disruption of Kcnj16 induces a severe renal phenotype that, apart from hypokalemia, is the opposite of the phenotype seen in SeSAME/EAST syndrome.
    explanation: Mouse model evidence further demonstrates that Kcnj16 (Kir5.1) disruption produces a contrasting acid-base and renal transport phenotype compared with Kcnj10-deficient SeSAME/EAST syndrome.

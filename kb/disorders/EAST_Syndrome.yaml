animal_models:
- name: Kcnj10 knockout mouse
  species: Mouse
  genotype: Kcnj10-/-
  description: Kcnj10-/- knockout mice exhibit severe neurological defects including seizures, ataxia, and early postnatal lethality after day 8, along with neonatal polyuria, renal sodium wasting, and reduced urinary calcium excretion that recapitulate the core features of human EAST syndrome.
  modeled_mechanisms:
  - target: Distal Tubule Salt Wasting
    relationship: RECAPITULATES
    description: Neonatal Kcnj10 knockout mice exhibit polyuria, elevated urinary sodium concentration (renal salt loss), and reduced urinary calcium excretion closely resembling the human tubulopathy.
    evidence:
    - reference: PMID:19420365
      reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In the neonatal period, all seven knockout mice had a significantly lower urinary creatinine concentration than did normal mice, indicating polyuria; the urinary sodium concentration was significantly elevated in the knockout mice, indicating renal salt loss. These neonatal knockout mice also had significantly reduced calcium excretion (Fig. 4C), as do patients with the Gitelman syndrome. In addition, the tubulopathy observed in the knockout mice closely resembled that seen in our patients.
      explanation: Demonstrates that Kcnj10 knockout mice recapitulate the distal tubular salt-wasting and hypocalciuric phenotype of human EAST syndrome.
  - target: Impaired Glial Potassium Buffering
    relationship: RECAPITULATES
    description: Kcnj10 deletion in mice causes seizures, ataxia, and early postnatal death due to loss of glial potassium spatial buffering in the central nervous system.
    evidence:
    - reference: PMID:19420365
      reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: Seizures and ataxia develop in mice with Kcnj10 deletion, and they die shortly after birth, reflecting the critical role of KCNJ10 in the functioning of the central nervous system.16
      explanation: Demonstrates that Kcnj10 knockout mice recapitulate the CNS seizure and ataxia phenotype caused by impaired glial potassium buffering.
  evidence:
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In our studies, Kcnj10 knockout mice died after day 8. In the neonatal period, all seven knockout mice had a significantly lower urinary creatinine concentration than did normal mice, indicating polyuria; the urinary sodium concentration was significantly elevated in the knockout mice, indicating renal salt loss. These neonatal knockout mice also had significantly reduced calcium excretion (Fig. 4C), as do patients with the Gitelman syndrome. In addition, the tubulopathy observed in the knockout mice closely resembled that seen in our patients.
    explanation: Documents the Kcnj10-/- mouse model and its recapitulation of human EAST syndrome tubulopathy.

- category: Renal
  name: Hypocalciuria
  frequency: OBLIGATE
  description: Decreased urinary calcium excretion resulting from enhanced proximal tubular calcium reabsorption secondary to distal convoluted tubule salt wasting, a hallmark biochemical feature distinguishing EAST syndrome from classic Bartter syndrome.
  phenotype_term:
    preferred_term: Hypocalciuria
    term:
      id: HP:0003127
      label: Hypocalciuria
  evidence:
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All affected patients had evidence of stimulated renin systems, with hypokalemic metabolic alkalosis, and they also had hypomagnesemia and hypocalciuria (Table 2).
    explanation: Demonstrates that all affected patients in the original EAST syndrome cohort had hypocalciuria.
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The concomitant proximal tubular increase in bicarbonate (resulting in metabolic alkalosis) and calcium absorption (with consequent hypocalciuria) causes additional signs and symptoms of the EAST syndrome (Tables 1 and 2).
    explanation: Confirms hypocalciuria as a defining renal tubular sign of EAST syndrome.
genetic:
- name: KCNJ10
  gene_term:
    preferred_term: KCNJ10
    term:
      id: hgnc:6256
      label: KCNJ10
  relationship_type: CAUSATIVE
  notes: Biallelic (homozygous or compound heterozygous) missense and nonsense variants in KCNJ10 (Kir4.1) cause EAST/SeSAME syndrome in an autosomal recessive manner. The original families harbored homozygous missense mutations identified by linkage to chromosome 1q23.2.
  evidence:
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This region contained the KCNJ10 gene, which encodes a potassium channel expressed in the brain, inner ear, and kidney. Sequencing of this candidate gene revealed homozygous missense mutations in affected persons in both families.
    explanation: Linkage and sequencing identify homozygous KCNJ10 missense mutations as the cause in the original consanguineous families.
  - reference: PMID:19289823
    reference_title: Seizures, sensorineural deafness, ataxia, mental retardation, and electrolyte imbalance (SeSAME syndrome) caused by mutations in KCNJ10.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings demonstrate that loss-of-function mutations in KCNJ10 cause this syndrome, which we name SeSAME.
    explanation: Independent confirmation that KCNJ10 loss-of-function mutations cause the syndrome.

    description: Impaired DCT NaCl reabsorption triggers compensatory proximal tubular calcium reabsorption, resulting in hypocalciuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:19420365
      reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The concomitant proximal tubular increase in bicarbonate (resulting in metabolic alkalosis) and calcium absorption (with consequent hypocalciuria) causes additional signs and symptoms of the EAST syndrome (Tables 1 and 2).
      explanation: Explains the mechanism linking distal tubular salt wasting to compensatory proximal tubular calcium absorption and consequent hypocalciuria.

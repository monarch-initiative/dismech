      label: distal convoluted tubule
  evidence:
  - reference: PMID:19289823
    reference_title: Seizures, sensorineural deafness, ataxia, mental retardation, and electrolyte imbalance (SeSAME syndrome) caused by mutations in KCNJ10.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We propose that KCNJ10 is required in the kidney for normal salt reabsorption in the distal convoluted tubule because of the need for K(+) recycling across the basolateral membrane to enable normal activity of the Na(+)-K(+)-ATPase; loss of this function accounts for the observed electrolyte defects.
    explanation: Provides the mechanistic basis for the renal salt-wasting tubulopathy and electrolyte imbalance.
  - reference: PMID:19420365
    reference_title: Epilepsy, ataxia, sensorineural deafness, tubulopathy, and KCNJ10 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice with Kcnj10 deletions became dehydrated, with definitive evidence of renal salt wasting.
    explanation: Mouse Kcnj10 knockout recapitulates the renal salt-wasting phenotype, supporting the causal mechanism.
  - reference: PMID:20651251
    reference_title: KCNJ10 gene mutations causing EAST syndrome (epilepsy, ataxia, sensorineural deafness, and tubulopathy) disrupt channel function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Kcnj10 and Kcnj16 were found in the basolateral membrane of mouse distal convoluted tubules, connecting tubules, and cortical collecting ducts.
    explanation: Localizes Kir4.1 (with Kir5.1/KCNJ16) to the basolateral membrane of the distal nephron, the anatomic basis of the renal salt-wasting mechanism.
  - reference: PMID:20651251
    reference_title: KCNJ10 gene mutations causing EAST syndrome (epilepsy, ataxia, sensorineural deafness, and tubulopathy) disrupt channel function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: EM of distal tubular cells of a patient with EAST syndrome showed reduced basal infoldings in this nephron segment, which likely reflects the morphological consequences of the impaired salt reabsorption capacity.
    explanation: Patient ultrastructural pathology (reduced basal infoldings in the distal tubule) corroborates impaired salt reabsorption.
  - reference: PMID:21633011
    reference_title: Renal phenotype in mice lacking the Kir5.1 (Kcnj16) K+ channel subunit contrasts with that observed in SeSAME/EAST syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The heteromeric inwardly rectifying Kir4.1/Kir5.1 K(+) channel underlies the basolateral K(+) conductance in the distal nephron and is extremely sensitive to inhibition by intracellular pH.
    explanation: Demonstrates that the heteromeric Kir4.1/Kir5.1 potassium channel provides the basolateral K+ conductance in the distal nephron required for salt reabsorption.
    quote_role: BACKGROUND
  - reference: PMID:35370765
    reference_title: 'EAST/SeSAME Syndrome and Beyond: The Spectrum of Kir4.1- and Kir5.1-Associated Channelopathies.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Renal dysfunction in EAST/SeSAME patients results in loss of Na+, K+, and Mg2+ with urine, activation of the renin-angiotensin-aldosterone system, and hypokalemic metabolic alkalosis.
    explanation: Characterizes the urinary loss of Na+, K+, and Mg2+ with RAAS activation and hypokalemic metabolic alkalosis resulting from distal tubule Kir4.1 dysfunction.

- name: Impaired Glial Potassium Buffering
  description: In the brain and spinal cord, Kir4.1 is expressed in glia, where it takes up extracellular K+ released by neuronal repolarization (spatial potassium buffering) and supports glutamate clearance. Loss of Kir4.1 raises extracellular potassium and impairs glial homeostasis, contributing to the neuronal hyperexcitability that produces seizures and to cerebellar dysfunction causing ataxia.

pathophysiology:
- name: Kir4.1 Potassium Channel Loss of Function
  description: Biallelic missense or nonsense variants in KCNJ10 reduce or abolish the inwardly rectifying potassium current carried by Kir4.1. Heterologous expression of patient mutations in Xenopus oocytes causes significant and specific decreases in potassium currents, and many of the mutations affect highly conserved residues known to cause loss of function in related K+ channels. This is the primary molecular lesion underlying all downstream organ-specific manifestations.

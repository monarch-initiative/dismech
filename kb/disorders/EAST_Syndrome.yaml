- name: Distal Tubule Salt Wasting
  description: 'In the kidney, Kir4.1 sits on the basolateral membrane of the distal convoluted tubule (often as a Kir4.1/Kir5.1 heteromer with KCNJ16), where K+ recycling across the basolateral membrane is required to sustain Na+-K+-ATPase activity and thus normal NaCl reabsorption. Loss of Kir4.1 impairs basolateral K+ recycling, causing renal salt wasting with a Gitelman-like biochemical profile: normotensive hypokalemic metabolic alkalosis, hypomagnesemia, and hypocalciuria. Patient distal tubular cells show reduced basolateral infoldings, reflecting impaired salt-reabsorption capacity.'
  cell_types:
  - preferred_term: kidney distal convoluted tubule epithelial cell
    term:
      id: CL:1000849
      label: kidney distal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: sodium ion transmembrane transport
    term:

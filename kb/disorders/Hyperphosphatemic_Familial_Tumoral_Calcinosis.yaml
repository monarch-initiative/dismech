    snippet: "The most frequently involved sites were the hip/gluteal region (34/63; 53.9%) followed by the elbow/forearm (26/63; 41.2%), and the shoulder (18/63; 28.5%)."
    explanation: The site frequencies across 63 published patients support the FREQUENT band and the joint distribution.
  - reference: PMID:31965220
    reference_title: Congenital Hyperphosphatemic Conditions Caused by the Deficient Activity of FGF23.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Massive ectopic calcification, known as tumoral calcinosis (TC), is seen in periarticular soft tissues, typically in the hip, elbow, and shoulder in HFTC/HHS, reducing the range of motion."
    explanation: An independent review states the same compartment and joint preference.

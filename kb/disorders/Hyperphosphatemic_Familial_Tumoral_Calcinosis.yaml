classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Harrison's covers HFTC with the disorders of phosphate homeostasis and
      bone mineral metabolism; the defining lesion is endocrine (deficient or
      unopposed FGF23 action), not primarily rheumatologic.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian, autosomal recessive disorder with three established causal
      genes and a documented Middle Eastern founder allele.
  isds_skeletal_category:
  - classification_value: abnormal_mineralization
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), in the group renamed at that revision from "Abnormal
      mineralization group" to "Disorders of bone mineralization", which holds
      the FGF23-axis disorders of phosphate handling alongside the
      hypophosphatemic rickets entities. Note that the cached record for
      PMID:36779427 is the revision's summary and does not enumerate individual
      disorders, so this group assignment rests on the disease's mechanism (a
      systemic mineral-handling defect with diaphyseal cortical hyperostosis)
      rather than on a quotable per-disorder listing.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    All three causal genes act recessively: affected individuals carry biallelic
    (homozygous or compound heterozygous) pathogenic variants and heterozygous
    carriers are generally unaffected. Expressivity is markedly variable even
    within a family and even between relatives carrying the same genotype, so
    the genotype does not predict whether a patient presents with calcific
    masses, with hyperostosis, or with biochemical abnormality alone.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HFTC is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance directly.
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: This supports the recurrence risks and the asymptomatic carrier state.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations varied, even within families, ranging from asymptomatic to large, disabling calcifications."
    explanation: The NIH cohort documents intrafamilial variable expressivity.
has_subtypes:
- name: HFTC1
  display_name: HFTC1 (GALNT3-related)
  subtype_term:
    preferred_term: tumoral calcinosis, hyperphosphatemic, familial, 1
    term:
      id: MONDO:0100252
      label: tumoral calcinosis, hyperphosphatemic, familial, 1
  description: >-
    The most frequently reported molecular subtype. Biallelic GALNT3 variants
    abolish GalNAc-T3-dependent O-glycosylation of FGF23, so the intact hormone
    is cleaved and inactivated. Serum intact FGF23 is low with markedly elevated
    C-terminal fragments. Both the tumoral-calcinosis and the
    hyperostosis-hyperphosphatemia presentations arise from this subtype,
    including from the same allele.
  genes:
  - preferred_term: GALNT3
    term:
      id: hgnc:4125
      label: GALNT3
  evidence:
  - reference: PMID:15133511
    reference_title: "Mutations in GALNT3, encoding a protein involved in O-linked glycosylation, cause familial tumoral calcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of GALNT3 identified biallelic deleterious mutations in all individuals with FTC"
    explanation: The gene-discovery study establishes biallelic GALNT3 variants as the cause of this subtype.
  - reference: PMID:20358599
    reference_title: Clinical variability of familial tumoral calcinosis caused by novel GALNT3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The four novel GALNT3 mutations invariably resulted in hyperphosphatemia as a result of low intact FGF23, but other clinical manifestations were variable."
    explanation: This supports the subtype's constant biochemical signature alongside variable clinical expression.
- name: HFTC2
  display_name: HFTC2 (FGF23-related)
  subtype_term:
    preferred_term: tumoral calcinosis, hyperphosphatemic, familial, 2
    term:
      id: MONDO:0060714
      label: tumoral calcinosis, hyperphosphatemic, familial, 2
  description: >-
    Biallelic FGF23 missense variants (reported alleles include p.Ser71Gly,
    p.Met96Thr, p.Gly123Trp and p.Ser129Phe) destabilise the intact hormone or
    trap it intracellularly, so only C-terminal fragments reach the circulation.
    The biochemical signature is the same as HFTC1 - low intact FGF23 with high
    C-terminal FGF23 - because both subtypes converge on failure to deliver
    intact hormone.
  genes:
  - preferred_term: FGF23
    term:
      id: hgnc:3680
      label: FGF23
  evidence:
  - reference: PMID:15590700
    reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing revealed a homozygous missense mutation in the FGF23 gene (p.S71G) at an amino acid position which is conserved from fish to man."
    explanation: This establishes a homozygous FGF23 missense variant as a distinct molecular cause.
  - reference: PMID:19188744
    reference_title: "Familial tumoral calcinosis caused by a novel FGF23 mutation: response to induction of tubular renal acidosis with acetazolamide and the non-calcium phosphate binder sevelamer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing analysis revealed a novel homozygous FGF23 missense mutation (c.367G>T, p.Gly123Trp) in both siblings while the parents were carriers of the mutation."
    explanation: A second independent family documents a homozygous FGF23 missense allele with unaffected heterozygous parents.
- name: HFTC3
  display_name: HFTC3 (KL / alpha-Klotho-related)
  subtype_term:
    preferred_term: tumoral calcinosis, hyperphosphatemic, familial, 3
    term:
      id: MONDO:0060715
      label: tumoral calcinosis, hyperphosphatemic, familial, 3
  description: >-
    The rarest subtype, established by a single homozygous KL missense variant
    (p.His193Arg) that destabilises the KL1 glycosidase domain and reduces
    expression and secretion of alpha-Klotho. Because the defect is in the
    co-receptor rather than the hormone, intact FGF23 is high rather than low,
    and the kidney is resistant to it; this is the one subtype in which the
    diagnostic intact-versus-C-terminal FGF23 pattern is inverted.
  genes:
  - preferred_term: KL
    term:
      id: hgnc:6344
      label: KL
  evidence:
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein we report a homozygous missense mutation (H193R) in the KLOTHO (KL) gene of a 13-year-old girl who presented with severe tumoral calcinosis with dural and carotid artery calcifications."
    explanation: This is the index observation establishing KL as the third causal gene.
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient exhibited defects in mineral ion homeostasis with marked hyperphosphatemia and hypercalcemia as well as elevated serum levels of parathyroid hormone and FGF23."
    explanation: The elevated FGF23 in this patient distinguishes the resistance subtype from the deficiency subtypes.
pathophysiology:
- name: Biallelic GALNT3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic deleterious GALNT3 variants remove the activity of
    GalNAc-T3, the trans-Golgi glycosyltransferase that initiates mucin-type
    O-glycosylation. A recurrent splice-site allele (c.1524+1G>A) accounts for
    both HFTC and HHS presentations in Middle Eastern families and is a founder
    mutation on a shared haplotype.
  genetic_context:
    gene:
      preferred_term: GALNT3
      term:
        id: hgnc:4125
        label: GALNT3
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: Biallelic loss of GalNAc-T3 activity is the commonest molecular cause of HFTC.
  genes:
  - preferred_term: GALNT3
    term:
      id: hgnc:4125
      label: GALNT3
  molecular_functions:
  - preferred_term: polypeptide N-acetylgalactosaminyltransferase activity
    term:
      id: GO:0004653
      label: polypeptide N-acetylgalactosaminyltransferase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of FGF23 O-Glycosylation and Furin Cleavage of Intact FGF23
    causal_link_type: DIRECT
    description: >-
      Without GalNAc-T3, the FGF23 proprotein-convertase recognition motif is
      not O-glycosylated and is therefore not protected from processing.
    evidence:
    - reference: PMID:16638743
      reference_title: "Polypeptide GalNAc-transferase T3 and familial tumoral calcinosis. Secretion of fibroblast growth factor 23 requires O-glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "GalNAc-T3 selectively directs O-glycosylation in a subtilisin-like proprotein convertase recognition sequence motif, which blocks processing of FGF23"
      explanation: This states the direct biochemical step from GalNAc-T3 activity to protection of intact FGF23.
  evidence:
  - reference: PMID:15133511
    reference_title: "Mutations in GALNT3, encoding a protein involved in O-linked glycosylation, cause familial tumoral calcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This region includes the gene GALNT3, which encodes a glycosyltransferase responsible for initiating mucin-type O-glycosylation."
    explanation: This identifies the gene product and its enzymatic role.
  - reference: PMID:15599692
    reference_title: Identification of a recurrent mutation in GALNT3 demonstrates that hyperostosis-hyperphosphatemia syndrome and familial tumoral calcinosis are allelic disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals harbored a homozygous splice site mutation (1524+1G-->A) in GALNT3."
    explanation: This documents the recurrent biallelic splice-site allele in affected families.
- name: Biallelic FGF23 Missense Variants Blocking Intact Hormone Secretion
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous FGF23 missense variants act on the
    hormone itself. The p.Ser71Gly mutant is retained in the Golgi so that only
    the C-terminal fragment is secreted; other reported alleles include
    p.Met96Thr, p.Gly123Trp and p.Ser129Phe. The functional result is the same as
    GALNT3 loss - intact hormone does not reach the circulation - so this node
    feeds the same downstream deficiency.
  genetic_context:
    gene:
      preferred_term: FGF23
      term:
        id: hgnc:3680
        label: FGF23
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: Missense alleles that prevent secretion of the intact hormone.
  genes:
  - preferred_term: FGF23
    term:
      id: hgnc:3680
      label: FGF23
  molecular_functions:
  - preferred_term: FGF23 hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
    causal_link_type: DIRECT
    description: >-
      Intracellular retention of the mutant protein leaves only inactive
      C-terminal fragments in the circulation.
    evidence:
    - reference: PMID:15590700
      reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Expression of the mutated protein in HEK293 cells showed that only the C-terminal fragment is secreted, whereas the intact protein is retained in the Golgi complex."
      explanation: The expression experiment shows the mutant protein fails to be secreted intact.
  evidence:
  - reference: PMID:15590700
    reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that the FGF23 function is decreased by absent or extremely reduced secretion of intact FGF23."
    explanation: This states the loss-of-function consequence of the FGF23 allele.
  - reference: PMID:15590700
    reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that FGF23 mutations in hypophosphatemic rickets and FTC have opposite effects on phosphate homeostasis."
    explanation: This records that the same gene produces opposite phosphate phenotypes depending on the allele's effect.
- name: Failure of FGF23 O-Glycosylation and Furin Cleavage of Intact FGF23
  biological_scale: MOLECULAR
  description: >-
    Bioactive FGF23 carries three O-linked glycans. Incompletely glycosylated
    FGF23 is susceptible to cleavage by subtilisin-like proprotein convertases
    at the RXXR site that separates the N-terminal and C-terminal halves of the
    hormone, splitting it into inactive fragments. O-glycosylation and protease
    processing compete for the same motif, so loss of the glycosyltransferase
    shifts the balance decisively toward cleavage.
  molecular_functions:
  - preferred_term: proprotein convertase cleavage of FGF23
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: protein O-linked glycosylation
    term:
      id: GO:0006493
      label: protein O-linked glycosylation
    modifier: DECREASED
  cell_types:
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  downstream:
  - target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
    causal_link_type: DIRECT
    description: >-
      Enhanced processing consumes the intact hormone and generates the
      C-terminal fragments that dominate the circulating pool.
    evidence:
    - reference: PMID:17129170
      reference_title: "Hyperostosis-hyperphosphatemia syndrome: a congenital disorder of O-glycosylation associated with augmented processing of fibroblast growth factor 23."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both patients had low levels of the full-length FGF23 with markedly augmented amounts of the inactive fragments."
      explanation: Patient measurements show the processing shift produces exactly this circulating pattern.
  evidence:
  - reference: PMID:17129170
    reference_title: "Hyperostosis-hyperphosphatemia syndrome: a congenital disorder of O-glycosylation associated with augmented processing of fibroblast growth factor 23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biologically active FGF23 has three O-linked glycans. FGF23 with only one or two O-linked glycans is processed into inactive fragments."
    explanation: This establishes the glycan-dependence of resistance to processing.
  - reference: PMID:17129170
    reference_title: "Hyperostosis-hyperphosphatemia syndrome: a congenital disorder of O-glycosylation associated with augmented processing of fibroblast growth factor 23."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Decreasing the expression of the GALNT3 gene by RNA interference resulted in enhanced processing of FGF23."
    explanation: Silencing the glycosyltransferase reproduces the processing shift experimentally.
  - reference: PMID:16638743
    reference_title: "Polypeptide GalNAc-transferase T3 and familial tumoral calcinosis. Secretion of fibroblast growth factor 23 requires O-glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The study suggests a novel posttranslational regulatory model of FGF23 involving competing O-glycosylation and protease processing to produce intact FGF23."
    explanation: This states the competition between glycosylation and proteolysis that the node describes.
- name: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
  biological_scale: ORGANISM
  description: >-
    The shared endocrine lesion of the GALNT3 and FGF23 subtypes: circulating
    intact FGF23 is low or inappropriately normal for the degree of
    hyperphosphatemia, while C-terminal FGF23 is markedly elevated because the
    C-terminal assay detects both intact hormone and fragments. This dissociated
    assay pattern is the diagnostic biochemical signature of the disease.
  biological_processes:
  - preferred_term: phosphate ion homeostasis
    term:
      id: GO:0055062
      label: phosphate ion homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule
    causal_link_type: DIRECT
    description: Too little intact hormone reaches the proximal tubular receptor complex to signal.
    evidence:
    - reference: PMID:27164190
      reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutations causing FTC/HHS result in relative deficiency of, or resistance to, iFGF23, which leads to hyperphosphatemia, due to increased renal tubular reabsorption of phosphate (TRP)"
      explanation: This states that relative deficiency of intact FGF23 is what produces the renal consequence, which is the step this edge asserts.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C-terminal FGF23 was markedly elevated whereas iFGF23 was comparatively low, consistent with increased FGF23 cleavage."
    explanation: The NIH cohort documents the dissociated intact/C-terminal pattern across affected subjects.
  - reference: PMID:31965220
    reference_title: Congenital Hyperphosphatemic Conditions Caused by the Deficient Activity of FGF23.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "resulting in the excessive cleavage of active intact FGF23 (FGF23, GALNT3) or increased resistance to the action of FGF23 (KL)"
    explanation: The review separates the cleavage mechanism of the FGF23/GALNT3 subtypes from the resistance mechanism of the KL subtype.
- name: Biallelic KL Loss of Function and Renal FGF23 Resistance
  biological_scale: MOLECULAR
  description: >-
    In HFTC3 the hormone is intact but its obligate co-receptor is not. The
    p.His193Arg substitution sits at the base of the KL1 catalytic cleft and
    destabilises the domain, so expression and secretion of alpha-Klotho are
    markedly reduced and FGF23 cannot signal through its cognate receptors.
    Intact FGF23 therefore rises rather than falls, and this node bypasses the
    hormone-deficiency node to reach the same signalling failure.
  genetic_context:
    gene:
      preferred_term: KL
      term:
        id: hgnc:6344
        label: KL
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: A homozygous KL missense allele reducing alpha-Klotho co-receptor availability.
  genes:
  - preferred_term: KL
    term:
      id: hgnc:6344
      label: KL
  downstream:
  - target: Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule
    causal_link_type: DIRECT
    description: >-
      Reduced alpha-Klotho removes the co-receptor that FGF23 requires for
      high-affinity signalling, producing end-organ resistance despite adequate
      hormone.
    evidence:
    - reference: PMID:17710231
      reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "expression and secretion of H193R KL were markedly reduced in vitro, resulting in diminished ability of FGF23 to signal via its cognate FGF receptors"
      explanation: This is the direct functional demonstration that the variant impairs FGF23 signalling.
  evidence:
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings provide what we believe to be the first evidence that loss-of-function mutations in human KL impair FGF23 bioactivity, underscoring the essential role of KL in FGF23-mediated phosphate and vitamin D homeostasis in humans"
    explanation: This establishes KL loss of function as a human cause of impaired FGF23 action.
- name: Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule
  biological_scale: CELLULAR
  description: >-
    The convergence point of all three genetic lesions. Intact FGF23 normally
    acts on proximal tubular cells through FGFR1 together with the co-receptor
    Klotho to suppress the sodium-phosphate cotransporters NaPi-IIa and NaPi-IIc
    and to suppress 25-hydroxyvitamin D 1-alpha-hydroxylase. When that signal is
    absent - through hormone deficiency in HFTC1/HFTC2 or through co-receptor
    loss in HFTC3 - both suppressive arms fail simultaneously.
  biological_processes:
  - preferred_term: fibroblast growth factor receptor signaling pathway
    term:
      id: GO:0008543
      label: fibroblast growth factor receptor signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: epithelial cell of proximal tubule

    reference_title: Identification of a recurrent mutation in GALNT3 demonstrates that hyperostosis-hyperphosphatemia syndrome and familial tumoral calcinosis are allelic disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "repeated attacks of acute, painful swellings of the long bones with radiological evidence of periosteal reaction and cortical hyperostosis"
    explanation: This documents the episodic clinical course and the radiographic correlate.
- name: Bone Pain
  category: Skeletal
  description: >-
    Long-bone pain accompanying hyperostotic attacks, often severe enough to
    prompt investigation for infection. Pain also arises from the periarticular
    masses themselves and is a principal indication for surgery.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which may manifest clinically as diaphyseal pain of the long bones and is often erroneously diagnosed as osteomyelitis"
    explanation: This records diaphyseal bone pain as the presenting symptom of the hyperostotic lesion.
- name: Dental Root and Pulp Disease
  category: Craniofacial
  frequency: VERY_FREQUENT
  description: >-
    The dental phenotype is the most penetrant non-biochemical feature. Roots
    are short and bulbous with midroot bulges and apical thinning, pulp chambers
    and canals become obliterated, and pulp stones form. Premolars are the most
    severely affected teeth. The changes are independent of which of the three
    genes is mutated, which argues that phosphate excess or FGF23 deficiency
    itself drives them.
  phenotype_term:
    preferred_term: Pulp obliteration
    term:
      id: HP:0006350
      label: Pulp obliteration
  evidence:
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pulp calcification was found in 13 of 14 evaluable patients."
    explanation: 13/14 supports the VERY_FREQUENT band for pulpal involvement.
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study defines the spectrum and confirms the high penetrance of dental features in HFTC."
    explanation: The dental cohort's own conclusion supports the high penetrance claim.
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The dental phenotype unique to HFTC includes enamel hypoplasia, short and bulbous roots, obliteration of pulp chambers and canals, and pulp stones."
    explanation: GeneReviews enumerates the components of the dental phenotype.
- name: Short Dental Roots
  category: Craniofacial
  frequency: VERY_FREQUENT
  description: >-
    Shortened, thistle-shaped roots with midroot bulges and apical thinning,
    most marked in the premolars. Because dental radiographs are taken early and
    routinely, these changes can be the first diagnostic clue in a child with
    unexplained hyperphosphatemia.
  phenotype_term:
    preferred_term: Short dental root
    term:
      id: HP:0006336
      label: Short dental root
  evidence:
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short roots and midroot bulges with apical thinning were present in 12 of 13 patients."
    explanation: 12/13 supports both the morphology and the VERY_FREQUENT band.
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Premolars were most severely affected."
    explanation: This records the tooth-class gradient of the root phenotype.
- name: Enamel Hypoplasia
  category: Craniofacial
  description: >-
    Defective enamel formation is listed among the HFTC dental features. Note
    that the NIH dental study's scanning electron microscopy found no difference
    in enamel or dentin structure from control teeth, so enamel involvement is
    less consistent than the root and pulp changes.
  phenotype_term:
    preferred_term: Enamel hypoplasia
    term:
      id: HP:0006297
      label: Enamel hypoplasia
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The dental phenotype unique to HFTC includes enamel hypoplasia"
    explanation: GeneReviews lists enamel hypoplasia as part of the dental phenotype.
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The SEM showed altered pulp and cementum structures, without differences in enamel or dentin structures, when compared with control teeth."
    explanation: The structural study found no enamel abnormality, which argues against enamel involvement being a constant feature.
- name: Vascular Calcification
  category: Cardiovascular
  frequency: OCCASIONAL
  description: >-
    Calcification of large and small vessels, usually found incidentally on
    imaging. It is not always silent: it can produce peripheral vascular
    insufficiency, and the index HFTC3 patient had dural and carotid artery
    calcification.
  phenotype_term:
    preferred_term: Vascular calcification
    term:
      id: HP:0004934
      label: Vascular calcification
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Less common are large and small vessel calcifications that are often asymptomatic incidental findings on radiologic studies but can also cause peripheral vascular insufficiency (e.g., pain, cold extremities, and decreased peripheral pulses)."
    explanation: GeneReviews supports both the OCCASIONAL band and the clinical consequences.
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe tumoral calcinosis with dural and carotid artery calcifications"
    explanation: The HFTC3 index case documents large-vessel and dural calcification.
- name: Testicular Microlithiasis
  category: Genitourinary
  frequency: OCCASIONAL
  description: >-
    Microcalcification within the testis, reported infrequently and generally
    found on ultrasound rather than clinically.
  phenotype_term:
    preferred_term: Testicular microlithiasis
    term:
      id: HP:0012215
      label: Testicular microlithiasis
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Less frequently reported findings include testicular microlithiasis and angioid streaks of the retina."
    explanation: GeneReviews lists testicular microlithiasis as an infrequent finding.
- name: Angioid Streaks
  category: Ophthalmologic
  frequency: OCCASIONAL
  description: >-
    Breaks in Bruch's membrane seen on fundoscopy. They are an infrequently
    reported finding and their mechanistic link to the phosphate excess has not
    been worked out.
  phenotype_term:
    preferred_term: Angioid streaks
    term:
      id: HP:0001102
      label: Angioid streaks
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Less frequently reported findings include testicular microlithiasis and angioid streaks of the retina."
    explanation: GeneReviews lists retinal angioid streaks among the less frequent findings.
- name: Systemic Inflammation
  category: Constitutional
  frequency: OCCASIONAL
  description: >-
    A minority of patients, generally those with the heaviest calcific burden,
    develop overwhelming systemic inflammation with markedly elevated C-reactive
    protein. This was first described in the NIH cohort and responded to
    interleukin-1 blockade, so it is a treatable component separate from the
    mineral load.
  phenotype_term:
    preferred_term: Elevated circulating C-reactive protein concentration
    term:
      id: HP:0011227
      label: Elevated circulating C-reactive protein concentration
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two subjects with severe calcifications also had overwhelming systemic inflammation and elevated C-reactive protein (CRP)."
    explanation: Two of eight cohort subjects supports the OCCASIONAL band and the association with severe calcification.
  - reference: PMID:31965220
    reference_title: Congenital Hyperphosphatemic Conditions Caused by the Deficient Activity of FGF23.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The other symptoms of HFTC/HHS are painful hyperostosis of the lower legs, dental abnormalities, and systemic inflammation."
    explanation: An independent review lists systemic inflammation among the disease's manifestations.
- name: Heterotopic Ossification
  category: Skeletal
  frequency: VERY_RARE
  description: >-
    Mature lamellar bone forming within or adjacent to a calcific deposit. This
    was reported for the first time in the NIH cohort, in one of four biopsied
    subjects, and is thought to be mediated by the adjacent inflammation rather
    than by mineral supersaturation alone.
  phenotype_term:
    preferred_term: Ectopic calcification
    term:
      id: HP:0010766
      label: Ectopic calcification
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, this is the first description of heterotopic ossification reported in FTC/HHS, possibly mediated by the adjacent inflammation."
    explanation: This is the single report establishing the finding and its proposed inflammatory mechanism.
  notes: >-
    The bound HP term is the generic Ectopic calcification. HPO has no term for
    heterotopic ossification within a soft-tissue calcific deposit that is
    narrower than this and still accurate; a narrower myositis-ossificans term
    would assert a different lesion.
- name: Hyperphosphatemia
  category: Metabolic
  frequency: OBLIGATE
  description: >-
    Persistent, age-adjusted elevation of serum phosphate with normal serum
    calcium, normal PTH and normal renal function. It is the defining
    biochemical abnormality, present in every characterised patient, and it
    precedes the calcific lesions - patients may be hyperphosphatemic for years
    before a mass appears.
  phenotype_term:
    preferred_term: Hyperphosphatemia
    term:
      id: HP:0002905
      label: Hyperphosphatemia
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects had hyperphosphatemia, increased TRP, and elevated or inappropriately normal 1,25D."
    explanation: Every cohort subject was hyperphosphatemic, supporting the OBLIGATE band.
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) phosphate was 6.9 (1.1) mg/dL."
    explanation: The systematic review quantifies the typical degree of elevation across 63 patients.
- name: Increased Renal Tubular Phosphate Reabsorption
  category: Renal
  frequency: OBLIGATE
  description: >-
    Tubular reabsorption of phosphate (TRP) and the renal phosphate threshold
    (TmP/GFR) are inappropriately high for the prevailing serum phosphate, with
    normal glomerular filtration. This is the discriminating finding that
    separates HFTC from hyperphosphatemia caused by renal failure or by an
    exogenous phosphate load.
  phenotype_term:
    preferred_term: Increased renal tubular phosphate reabsorption
    term:
      id: HP:0005571
      label: Increased renal tubular phosphate reabsorption
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "hyperphosphatemia in the setting of inappropriately increased renal tubular reabsorption of phosphorus (TRP), elevated or inappropriately normal 1,25-dihydroxyvitamin D3 (1,25D) levels, and elevated C-terminal FGF23 fragments"
    explanation: GeneReviews makes increased TRP part of the diagnostic laboratory definition.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects had hyperphosphatemia, increased TRP, and elevated or inappropriately normal 1,25D."
    explanation: Increased TRP was present in every cohort subject.
genetic:
- name: Biallelic GALNT3 Pathogenic Variants
  subtype: HFTC1
  gene_term:
    preferred_term: GALNT3
    term:
      id: hgnc:4125
      label: GALNT3
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported alleles include splice-site, nonsense, frameshift and missense
    variants; the c.1524+1G>A splice allele is a Middle Eastern founder mutation
    shared by HFTC and HHS families on a common haplotype. Heterozygous parents
    are unaffected. Genotype does not predict clinical severity: four novel
    homozygous GALNT3 alleles all produced hyperphosphatemia with low intact
    FGF23, but massive calcification, cortical hyperostosis and dental anomalies
    were each present in only some patients.
  evidence:
  - reference: PMID:15133511
    reference_title: "Mutations in GALNT3, encoding a protein involved in O-linked glycosylation, cause familial tumoral calcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of GALNT3 identified biallelic deleterious mutations in all individuals with FTC, suggesting that defective post-translational modification underlies the disease."
    explanation: The linkage-and-sequencing study establishes the causal gene-disease relationship.
  - reference: PMID:15599692
    reference_title: Identification of a recurrent mutation in GALNT3 demonstrates that hyperostosis-hyperphosphatemia syndrome and familial tumoral calcinosis are allelic disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest a common origin of the 1524+1G-->A mutation in the Middle East (founder effect)"
    explanation: This documents the recurrent allele as a regional founder mutation.
  - reference: PMID:20358599
    reference_title: Clinical variability of familial tumoral calcinosis caused by novel GALNT3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the presence of massive calcifications, cortical hyperostosis, or dental anomalies was not shared by all patients, all had persistent hyperphosphatemia."
    explanation: This supports the dissociation between a constant biochemical phenotype and variable clinical features.
- name: Biallelic FGF23 Pathogenic Variants
  subtype: HFTC2
  gene_term:
    preferred_term: FGF23
    term:
      id: hgnc:3680
      label: FGF23
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Disease alleles are missense variants that prevent secretion of the intact
    hormone, including p.Ser71Gly (Golgi retention with selective secretion of
    the C-terminal fragment) and p.Gly123Trp. The same gene causes autosomal
    dominant hypophosphatemic rickets through gain-of-function alleles that
    resist cleavage, so the direction of the variant's effect - not the gene -
    determines which phosphate phenotype appears.
  evidence:
  - reference: PMID:15590700
    reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated an individual with FTC who was negative for GALNT3 mutations. Sequencing revealed a homozygous missense mutation in the FGF23 gene (p.S71G)"
    explanation: This establishes FGF23 as a second causal gene in a GALNT3-negative patient.
  - reference: PMID:15590700
    reference_title: An FGF23 missense mutation causes familial tumoral calcinosis with hyperphosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that FGF23 mutations in hypophosphatemic rickets and FTC have opposite effects on phosphate homeostasis."
    explanation: This supports the allele-direction argument in the note.
- name: Biallelic KL Pathogenic Variants
  subtype: HFTC3
  gene_term:
    preferred_term: KL
    term:
      id: hgnc:6344
      label: KL
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The evidence base is a single homozygous missense allele, p.His193Arg, in
    one patient, supported by structural modelling onto a plant homolog and by
    in vitro demonstration of reduced expression, reduced secretion and impaired
    FGF23 signalling. This is the least established of the three gene-disease
    relationships in terms of the number of independent families.
  evidence:
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our findings provide what we believe to be the first evidence that loss-of-function mutations in human KL impair FGF23 bioactivity"
    explanation: The report's own framing supports both the causal claim and its single-family basis.
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "compared with wild-type KL, expression and secretion of H193R KL were markedly reduced in vitro"
    explanation: This is the functional evidence that the allele is loss of function.
biochemical:
- name: Serum Phosphate
  presence: Persistently elevated for age
  context: >-
    Interpret against age-adjusted reference intervals; children have higher
    normal phosphate than adults, so an adult cut-off will miss paediatric
    disease. Across 63 published patients the mean phosphate was 6.9 mg/dL.
  evidence:
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean (SD) phosphate was 6.9 (1.1) mg/dL."
    explanation: This quantifies the typical degree of hyperphosphatemia in reported cases.
- name: Tubular Reabsorption of Phosphate and TmP/GFR
  presence: Inappropriately high for the prevailing serum phosphate
  specificity: >-
    Elevated TRP/TmP-GFR with normal glomerular filtration separates HFTC from
    hyperphosphatemia of renal failure and from an exogenous phosphate load; it
    does not by itself separate the three molecular subtypes.
  context: Calculate from paired serum and urine phosphate and creatinine.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "hyperphosphatemia in the setting of inappropriately increased renal tubular reabsorption of phosphorus (TRP)"
    explanation: GeneReviews makes inappropriately increased TRP part of the diagnostic definition.
- name: Intact FGF23
  presence: Low or inappropriately normal in HFTC1 and HFTC2; elevated in HFTC3
  specificity: >-
    This is the one measurement that distinguishes hormone deficiency from
    hormone resistance. A low intact FGF23 points to GALNT3 or FGF23; a high
    intact FGF23 in the same biochemical setting points to KL.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C-terminal FGF23 was markedly elevated whereas iFGF23 was comparatively low, consistent with increased FGF23 cleavage."
    explanation: The cohort documents the low intact hormone in the deficiency subtypes.
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated serum levels of parathyroid hormone and FGF23"
    explanation: The KL patient had elevated FGF23, the inverse of the deficiency subtypes.
- name: C-Terminal FGF23
  presence: Markedly elevated
  context: >-
    The C-terminal assay detects intact hormone plus C-terminal fragments, so it
    rises as cleavage consumes the intact pool. The dissociation between a high
    C-terminal and a low intact result is the diagnostic signature.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "and elevated C-terminal FGF23 fragments"
    explanation: GeneReviews includes elevated C-terminal fragments in the laboratory diagnosis.
  - reference: PMID:17129170
    reference_title: "Hyperostosis-hyperphosphatemia syndrome: a congenital disorder of O-glycosylation associated with augmented processing of fibroblast growth factor 23."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two hyperphosphatemic patients with mutations in GALNT3 showed low intact FGF23 levels with marked increase of processed C-terminal fragments."
    explanation: This is the paired measurement in GALNT3-mutant patients.
- name: 1,25-Dihydroxyvitamin D
  presence: Elevated or inappropriately normal for the degree of hyperphosphatemia
  context: >-
    A normal calcitriol is abnormal here: high phosphate should suppress
    1-alpha-hydroxylase through FGF23, so a mid-range value in a
    hyperphosphatemic patient is evidence that the FGF23 brake is missing.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects had hyperphosphatemia, increased TRP, and elevated or inappropriately normal 1,25D."
    explanation: This records the direction of the calcitriol abnormality in every cohort subject.
- name: Serum Calcium and Parathyroid Hormone
  presence: Usually normal
  specificity: >-
    Normal calcium and PTH exclude primary hyperparathyroidism and the secondary
    hyperparathyroidism of chronic kidney disease as the cause of the
    hyperphosphatemia. Note the exception: the single HFTC3 patient had
    hypercalcemia with elevated PTH, so a normal result is the rule rather than
    a requirement.
  evidence:
  - reference: PMID:20358599
    reference_title: Clinical variability of familial tumoral calcinosis caused by novel GALNT3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, circulating calcium and parathyroid hormone (PTH) are usually normal."
    explanation: This supports the usual normality of calcium and PTH.
  - reference: PMID:17710231
    reference_title: A homozygous missense mutation in human KLOTHO causes severe tumoral calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "marked hyperphosphatemia and hypercalcemia as well as elevated serum levels of parathyroid hormone"
    explanation: The KL case documents the exception noted in the specificity field.
prevalence:
- population: Worldwide, genetically or clinically characterised published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence, incidence or carrier frequency has been estimated
    for HFTC. The available denominator is the published case literature: a 2024
    systematic review that applied strict inclusion criteria (baseline phosphate
    measured, treatment recorded, follow-up available) found 43 eligible studies
    describing 63 individuals. That is a lower bound on reported cases, not a
    population rate, because it excludes reports lacking treatment or follow-up
    data. The disease is reported worldwide but is enriched in consanguineous
    Middle Eastern and African families, consistent with the documented Middle
    Eastern GALNT3 founder allele.
  evidence:
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 63 individuals (Males = 33) were included from the 43 eligible case studies."
    explanation: This is the published-case count behind the CASES_IN_LITERATURE record.
  - reference: PMID:15599692
    reference_title: Identification of a recurrent mutation in GALNT3 demonstrates that hyperostosis-hyperphosphatemia syndrome and familial tumoral calcinosis are allelic disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest a common origin of the 1524+1G-->A mutation in the Middle East (founder effect)"
    explanation: The founder effect supports the described regional enrichment.
progression:
- phase: Biochemical disease before clinical lesions
  notes: >-
    Hyperphosphatemia with increased tubular reabsorption is present before
    calcific masses appear and can be the only abnormality for years. Two
    siblings in the NIH cohort had the full biochemical phenotype without
    physical calcinosis at enrolment. This is the window in which phosphate
    control is most plausibly preventive, though that has never been tested
    prospectively.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations varied, even within families, ranging from asymptomatic to large, disabling calcifications."
    explanation: The asymptomatic end of the cohort's range is the biochemical-only phase.
- phase: Established calcific and hyperostotic disease
  notes: >-
    Masses accumulate around large joints and hyperostotic attacks recur. The
    median age of published patients at report is 18 years, with a wide spread,
    and radiographic burden ranges from diaphyseal hyperostosis alone to massive
    calcification.
  evidence:
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of the patients was 18 (IQR 8-32) years."
    explanation: This gives the age distribution of reported clinical disease.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs ranged from diaphyseal hyperostosis to massive calcification."
    explanation: This describes the radiographic range of established disease.
- phase: Long-term lesion course under treatment
  notes: >-
    The disease does not follow a single trajectory. In the systematic review's
    followed-up patients, roughly a third regressed, a third progressed and a
    third were stable over a median of three years, and three patients died.
    Recurrence after incomplete excision is common while hyperphosphatemia
    persists.
  evidence:
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression or reduction in lesion size was reported in 19/63 (30.2%) subjects; 20/63 (31.7%) showed progression, 24/63 (38.1%) had features of stable disease, and mortality was reported in 3 patients (4.7%)."
    explanation: This is the outcome distribution behind the described course.
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median (IQR) follow-up duration was 3 (1-9) years."
    explanation: This gives the observation window over which those outcomes were recorded.
treatments:
- name: Dietary Phosphate Restriction
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    A low-phosphate diet is the first and least invasive way to lower the
    substrate for ectopic mineralization. The NIH cohort targeted 400-900 mg of
    phosphorus per day according to age, with nutritional counselling for every
    subject, because a restriction severe enough to move serum phosphate is
    also severe enough to compromise nutrition in a growing child. Calcium
    salts should not be used as binders and excessive dietary calcium and
    vitamin D should be avoided, since both add to the calcium-phosphate
    product the treatment is trying to lower.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Hyperphosphatemia with Elevated Calcium-Phosphate Product
    treatment_effect: INHIBITS
    description: Reducing intake lowers the absorbed phosphate load and so the calcium-phosphate product.
    evidence:
    - reference: PMID:29389098
      reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "treatment relies on lowering blood phosphorus by blocking absorption from the diet (i.e., use of low-phosphate diet and phosphate binders)"
      explanation: GeneReviews states the intended mechanism of dietary restriction.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low phosphate diet targeting 400–900 mg/day, depending upon age."
    explanation: This records the dose target actually used in the NIH cohort.
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is prudent to avoid: use of calcium salts as phosphate binders; excessive dietary calcium intake; excessive vitamin D intake/supplements; foods high in phosphorus."
    explanation: This supports the dietary avoidances that accompany the restriction.
- name: Non-Calcium Phosphate Binders
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Sevelamer binds dietary phosphate in the gut lumen and was given with meals
    and snacks to all but one subject in the NIH cohort. Calcium-containing
    binders are avoided because they supply the other half of the precipitating
    product. Aluminium hydroxide is an effective second binder and was added in
    two subjects whose phosphate did not move on sevelamer plus phosphaturic
    agents, but it carries aluminium-toxicity risk and is not a long-term
    default. In one reported family, sevelamer combined with acetazolamide
    lowered serum phosphate and shrank an ulcerating elbow mass.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sevelamer
      term:
        id: CHEBI:32127
        label: Sevelamer hydrochloride
    - preferred_term: aluminium hydroxide
      term:
        id: NCIT:C39707
        label: Aluminum Hydroxide
  target_mechanisms:
  - target: Hyperphosphatemia with Elevated Calcium-Phosphate Product
    treatment_effect: INHIBITS
    description: Luminal binding reduces intestinal phosphate absorption and lowers serum phosphate.
    evidence:
    - reference: PMID:19188744
      reference_title: "Familial tumoral calcinosis caused by a novel FGF23 mutation: response to induction of tubular renal acidosis with acetazolamide and the non-calcium phosphate binder sevelamer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with the phosphate binder sevelamer and the carbonic anhydrase inhibitor acetazolamide successfully reduced the serum phosphate levels and led to a reduction of the calcified mass."
      explanation: This single-family report links binder-based phosphate lowering to regression of a mass.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of all subjects except FTC1 included sevelamer, a phosphate binder, prescribed with meals and snacks."
    explanation: This documents sevelamer as the cohort's standard binder and how it was given.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aluminum hydroxide was added as an additional phosphate binder in 2 subjects, who had increased tumoral calcinosis burden with no change in blood phosphorus on sevelamer, acetazolamide and probenecid."
    explanation: This records aluminium hydroxide as escalation after failure of the first-line combination.
- name: Phosphaturic Therapy with Acetazolamide or Probenecid
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The complementary strategy to binding: increase renal phosphate excretion.
    Acetazolamide, a carbonic anhydrase inhibitor, induces bicarbonaturia and
    mild metabolic acidosis; probenecid promotes phosphaturia but interacts with
    several antibiotics. Responses are inconsistent, and in one well-documented
    boy acetazolamide stopped new tumour formation and abolished bone pain with
    no measurable change in serum phosphate or TRP at all - which suggests the
    benefit ran through mineral solubility rather than through phosphate
    lowering. Nicotinamide was tried in two NIH subjects for its phosphaturic
    effect and did not add benefit.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetazolamide
      term:
        id: NCIT:C28809
        label: Acetazolamide
    - preferred_term: probenecid
      term:
        id: NCIT:C772
        label: Probenecid
    - preferred_term: nicotinamide
      term:
        id: NCIT:C2327
        label: Niacinamide
  target_mechanisms:
  - target: Increased Proximal Tubular Sodium-Phosphate Cotransport
    treatment_effect: INHIBITS
    description: Both agents are used to force renal phosphate excretion against the elevated tubular reabsorption.
    evidence:
    - reference: PMID:27164190
      reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "were additionally treated with acetazolamide and/or probenecid, both of which promote renal phosphate excretion."
      explanation: This states the intended renal mechanism of both agents.
  evidence:
  - reference: PMID:24668887
    reference_title: "Hyperphosphatemic familial tumoral calcinosis: response to acetazolamide and postulated mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following the initiation of acetazolamide therapy, the patient experienced significant improvement in disease course as indicated by resolution of localized bone pain, cessation of tumor formation, and no tumor recurrence."
    explanation: This is the clinical benefit reported in the single-patient acetazolamide series.
  - reference: PMID:24668887
    reference_title: "Hyperphosphatemic familial tumoral calcinosis: response to acetazolamide and postulated mechanisms."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that acetazolamide can control severe HFTC by inducing mild metabolic acidosis despite no change in serum phosphate or TRP."
    explanation: The authors' own inference that the benefit was not mediated by phosphate lowering; it supports the treatment while arguing against the assumed mechanism, so the support for the phosphaturic rationale is indirect.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with nicotinamide was attempted during a hospitalization in 2 subjects to assess its effect on inducing phosphaturia but was not continued upon discharge, as it did not show additional benefits."
    explanation: This is a negative result for nicotinamide specifically, within an otherwise supported treatment class.
- name: Interleukin-1 Blockade for Systemic Inflammation
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    For the minority of patients with overwhelming systemic inflammation,
    IL-1 antagonists lowered C-reactive protein in both treated NIH subjects,
    with resolution of calcinosis cutis and perilesional inflammation in one.
    This treats the inflammatory arm of the disease and does nothing about the
    FGF23 deficiency, so it is an adjuvant rather than a disease-modifying
    therapy. The evidence is two patients in an uncontrolled cohort.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  target_mechanisms:
  - target: Foreign-Body and Systemic Inflammation Around Calcific Deposits
    treatment_effect: INHIBITS
    description: IL-1 antagonism suppresses the cytokine-driven inflammation around and beyond the deposits.
    evidence:
    - reference: PMID:27164190
      reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the two subjects with systemic inflammation, interleukin-1 (IL-1) antagonists significantly decreased CRP levels with resolution of calcinosis cutis and perilesional inflammation in one subject and improvement of overall well-being in both subjects."
      explanation: This is the direct observation of the anti-inflammatory effect on lesion-associated inflammation.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the response to IL-1 antagonists suggests that anti-inflammatory drugs may be useful adjuvants"
    explanation: The authors frame IL-1 blockade as adjuvant, which is how the treatment is described here.
  notes: >-
    The cited cohort reports "interleukin-1 (IL-1) antagonists" without naming
    the agent in its abstract, so the class is the claim and the anakinra
    binding should be read as representative. therapeutic_modality is OTHER
    rather than MONOCLONAL_ANTIBODY because the two agents used for this
    indication belong to different platforms: anakinra is a recombinant IL-1
    receptor antagonist protein, canakinumab a monoclonal antibody. Neither
    single value describes the class, and PROTEIN_REPLACEMENT would be wrong in
    both cases since nothing deficient is being replaced.
- name: Surgical Excision of Calcific Masses
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Excision or debulking is reserved for masses causing significant pain,
    functional impairment, ulceration or infection. It does not address the
    hyperphosphatemia, so recurrence is common after incomplete excision and
    attempted complete excision carries its own wound morbidity. In the
    systematic review, most reported patients (57%) had surgery combined with
    some medical therapy rather than surgery alone.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Periarticular Calcific Masses
    treatment_effect: INHIBITS
    description: >-
      Excision removes the deposit itself; it does not act on any upstream node,
      which is why the lesion re-forms while the calcium-phosphate product stays
      elevated.
    evidence:
    - reference: PMID:27164190
      reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgical debulking may be performed in subjects with functional impairment or severe pain, but is not routinely undertaken as calcinosis often recurs"
      explanation: This states both the indication and the recurrence that limits it.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surgical resection of tumoral calcinosis lesions – generally reserved for those patients with significant pain or functional impairment – has variable success."
    explanation: GeneReviews gives the indication and the qualified outcome.
  - reference: PMID:38951179
    reference_title: "Clinical Characteristics, Therapeutic Options, and Outcomes in Hyperphosphatemic Tumoral Calcinosis: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the subjects, 36/63 (57.1%) underwent surgical excision with some form of medical therapy."
    explanation: This quantifies how often surgery is used and that it is normally combined with medical treatment.
animal_models:
- name: Galnt3-null mouse
  species: Mus musculus
  genotype: Galnt3 knockout (homozygous null)
  background: Mouse
  category: Genetically engineered
  publication: PMID:19213845
  description: >-
    The genetic model of the commonest human subtype. Galnt3-deficient mice
    reproduce the defining endocrine lesion faithfully - circulating intact
    Fgf23 is about half that of littermates with increased C-terminal fragments,
    despite increased Fgf23 expression in bone - and reproduce the renal
    consequences, with elevated sodium-phosphate cotransporter expression,
    hyperphosphatemia and an inappropriately normal 1,25-dihydroxyvitamin D.
    What they do not reproduce is the lesion the human disease is named for:
    they develop no apparent calcifications.
  modeled_mechanisms:
  - target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The model reproduces the exact dissociation seen in patients: low intact
      hormone with excess C-terminal fragments on a background of increased
      Fgf23 transcription.
    limitations: >-
      Circulating intact Fgf23 was roughly halved rather than abolished, so the
      model is a partial-deficiency state; C-terminal fragments were measured in
      bone rather than only in circulation.
    readouts:
    - name: Circulating intact Fgf23
      target: Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
      direction: DECREASED
      interpretation: Direct measurement of the hormone deficiency this node describes.
      evidence:
      - reference: PMID:19213845
        reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "homozygous mice had only about half of circulating intact Fgf23 levels and higher levels of C-terminal Fgf23 fragments in bone"
        explanation: This is the quantitative readout of intact and fragment hormone in the model.
    evidence:
    - reference: PMID:19213845
      reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ablation of Galnt3 impaired secretion of intact Fgf23, leading to decreased circulating Fgf23 and hyperphosphatemia, despite increased Fgf23 expression"
      explanation: This establishes the model as informative for the hormone-deficiency node.
  - target: Increased Proximal Tubular Sodium-Phosphate Cotransport
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Renal sodium-phosphate cotransporter expression is elevated in the
      knockout, the transporter-level change the human node asserts.
    limitations: >-
      The finding is transporter expression rather than a measured tubular
      phosphate threshold, so the correspondence to human TmP/GFR is inferred.
      Renal Kl expression was also elevated, a compensatory change with no
      established human counterpart.
    readouts:
    - name: Renal sodium-phosphate cotransporter expression
      target: Increased Proximal Tubular Sodium-Phosphate Cotransport
      direction: INCREASED
      interpretation: Molecular correlate of the unopposed tubular reabsorption node.
      evidence:
      - reference: PMID:19213845
        reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "renal expression of sodium-phosphate cotransporters and Kl were elevated in Galnt3-deficient mice"
        explanation: This is the direct transporter measurement.
    evidence:
    - reference: PMID:19213845
      reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In response to hyperphosphatemia, Galnt3-deficient mice had markedly increased Fgf23 expression in bone."
      explanation: The compensatory rise in bone Fgf23 confirms the animals are sensing and failing to correct a phosphate load.
  - target: Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The knockout is biochemically a tumoral-calcinosis model but not
      anatomically one: hyperphosphatemia develops without apparent
      calcifications.
    limitations: >-
      No ectopic calcific masses form, so the model cannot be used to study
      lesion formation, lesion regression, or any therapy whose endpoint is
      lesion burden. Sex-specific confounds (growth retardation, infertility
      and increased bone mineral density in males only) further limit it as a
      skeletal-phenotype model.
    evidence:
    - reference: PMID:19213845
      reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "In this study we generated mice lacking the Galnt3 gene, which developed hyperphosphatemia without apparent calcifications."
      explanation: The absence of calcification is stated explicitly and is the basis for the negative link.
  evidence:
  - reference: PMID:19213845
    reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings indicate that Galnt3-deficient mice have a biochemical phenotype of tumoral calcinosis"
    explanation: The authors position the model as a biochemical rather than a full phenotypic model, which is how it is used here.
- name: Fgf23-null mouse
  species: Mus musculus
  genotype: Fgf23 knockout (homozygous null)
  background: Mouse
  category: Genetically engineered
  publication: PMID:14966565
  description: >-
    Total ablation of the hormone rather than of its protection. The Fgf23-null
    mouse is the cleanest demonstration that the human renal phenotype follows
    from absent FGF23 action: high serum phosphate with increased renal
    reabsorption, and elevated 1,25-dihydroxyvitamin D driven by enhanced renal
    1-alpha-hydroxylase expression. It is a more severe systemic state than
    human HFTC, with severe growth retardation and a markedly short lifespan.
  modeled_mechanisms:
  - target: Increased Proximal Tubular Sodium-Phosphate Cotransport
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Complete loss of FGF23 produces exactly the renal phosphate-conserving
      state the node asserts.
    limitations: >-
      Complete hormone absence is more extreme than the partial deficiency of
      human GALNT3- or FGF23-related disease, so the model overstates the
      degree of signalling loss.
    readouts:
    - name: Serum phosphate and renal phosphate reabsorption
      target: Increased Proximal Tubular Sodium-Phosphate Cotransport
      direction: INCREASED
      interpretation: The physiological readout of unopposed tubular phosphate reclamation.
      evidence:
      - reference: PMID:14966565
        reference_title: Targeted ablation of Fgf23 demonstrates an essential physiological role of FGF23 in phosphate and vitamin D metabolism.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The Fgf23(-/-) mice displayed significantly high serum phosphate with increased renal phosphate reabsorption."
        explanation: This is the direct measurement of the modelled renal phenotype.
    evidence:
    - reference: PMID:14966565
      reference_title: Targeted ablation of Fgf23 demonstrates an essential physiological role of FGF23 in phosphate and vitamin D metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "indicating that FGF23 is essential for normal phosphate and vitamin D metabolism"
      explanation: The model establishes FGF23 as the physiological regulator whose loss the human disease reproduces.
  - target: Unsuppressed Renal Calcitriol Production
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knockout supplies the mechanistic step the human data can only infer:
      the calcitriol elevation is attributable to increased renal
      1-alpha-hydroxylase expression.
    limitations: >-
      In humans calcitriol is often only inappropriately normal rather than
      frankly elevated, so the model shows a stronger version of the human
      abnormality.
    readouts:
    - name: Renal 25-hydroxyvitamin D-1alpha-hydroxylase expression
      target: Unsuppressed Renal Calcitriol Production
      direction: INCREASED
      interpretation: The enzymatic cause of the calcitriol elevation, measured directly.
      evidence:
      - reference: PMID:14966565
        reference_title: Targeted ablation of Fgf23 demonstrates an essential physiological role of FGF23 in phosphate and vitamin D metabolism.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "They also showed an elevation in serum 1,25(OH)2D that was due to the enhanced expression of renal 25-hydroxyvitamin D-1alpha-hydroxylase (1alpha-OHase) from 10 days of age."
        explanation: This links the calcitriol rise to the specific enzyme the node names.
    evidence:
    - reference: PMID:14966565
      reference_title: Targeted ablation of Fgf23 demonstrates an essential physiological role of FGF23 in phosphate and vitamin D metabolism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We present here the evidence that FGF23 is a physiological regulator of serum phosphate and 1,25-dihydroxyvitamin D (1,25[OH]2D) by generating FGF23-null mice."
      explanation: This states the model's purpose and its relevance to the calcitriol arm.
  notes: >-
    The same knockout is also the reference model for the opposite disease:
    FGF23 excess causes X-linked hypophosphatemia, and the null mouse's
    hyperphosphatemic, hypercalcitriolemic state is what establishes the
    direction of the axis in both.
  evidence:
  - reference: PMID:14966565
    reference_title: Targeted ablation of Fgf23 demonstrates an essential physiological role of FGF23 in phosphate and vitamin D metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Disruption of the Fgf23 gene did not result in embryonic lethality, although homozygous mice showed severe growth retardation with abnormal bone phenotype and markedly short life span."
    explanation: This records the model's viability and its systemic severity, which bounds how far it can be read across to human HFTC.
- name: Klotho-deficient mouse
  species: Mus musculus
  genotype: klotho hypomorph (kl/kl)
  background: Mouse
  category: Genetically engineered
  publication: PMID:9363890
  description: >-
    The mouse that named the gene behind HFTC3. Defective klotho expression
    produces a systemic syndrome resembling premature ageing - short lifespan,
    infertility, arteriosclerosis, skin atrophy, osteoporosis and emphysema -
    and identified klotho as a membrane protein with beta-glucosidase homology.
    It carries the molecular lesion of the human resistance subtype, but the
    original description characterises an ageing phenotype rather than an
    FGF23-resistance phenotype, so its use for this disease rests on later work
    not cited here.
  modeled_mechanisms:
  - target: Biallelic KL Loss of Function and Renal FGF23 Resistance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model carries the same genetic lesion as HFTC3 - loss of functional
      alpha-Klotho - and so reproduces the upstream cause of FGF23 resistance.
    limitations: >-
      The cited description reports a multi-system premature-ageing syndrome,
      not the mineral phenotype, so the mineral-handling correspondence to human
      HFTC3 is not established by this source. The human disease is caused by a
      missense allele with reduced but not absent alpha-Klotho, and human
      patients do not have a progeroid syndrome; arteriosclerosis in the mouse
      is not the same lesion as periarticular tumoral calcinosis. The model
      should not be used to argue that HFTC3 patients are at risk of accelerated
      ageing.
    evidence:
    - reference: PMID:9363890
      reference_title: Mutation of the mouse klotho gene leads to a syndrome resembling ageing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A defect in klotho gene expression in the mouse results in a syndrome that resembles human ageing, including a short lifespan, infertility, arteriosclerosis, skin atrophy, osteoporosis and emphysema."
      explanation: This establishes what the model's klotho deficiency actually produces, which is the basis for both the partial recapitulation and the limitation.
  evidence:
  - reference: PMID:9363890
    reference_title: Mutation of the mouse klotho gene leads to a syndrome resembling ageing.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The gene encodes a membrane protein that shares sequence similarity with the beta-glucosidase enzymes."
    explanation: This is the original characterisation of the gene product whose human orthologue causes HFTC3.
discussions:
- discussion_id: gap_hftc_site_selection
  prompt: >-
    Why does mineral deposit at specific periarticular sites and in specific
    organs when the driving abnormality - an elevated calcium-phosphate product
    - is systemic?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hyperphosphatemia with Elevated Calcium-Phosphate Product
  - pathophysiology#Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
  rationale: >-
    Repetitive trauma and pressure are cited as the site determinant, but that
    is a clinical observation rather than a demonstrated mechanism, and it does
    not explain the dental pulp, the testis or the retina. Nor does it explain
    why some patients with the same genotype and the same phosphate level never
    form a mass. Identifying a local permissive factor would matter clinically:
    it is the difference between "lower the phosphate and hope" and a target
    that acts where the deposits form.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ectopic calcifications (tumoral calcinosis) typically found in periarticular soft tissues exposed to repetitive trauma or prolonged pressure"
    explanation: This is the observational basis for the mechanical hypothesis, stated as a site association rather than a mechanism.
  - reference: PMID:20358599
    reference_title: Clinical variability of familial tumoral calcinosis caused by novel GALNT3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the presence of massive calcifications, cortical hyperostosis, or dental anomalies was not shared by all patients, all had persistent hyperphosphatemia."
    explanation: A constant biochemical driver with inconstant lesions is exactly what an unexplained local permissive factor would look like.
- discussion_id: gap_hftc_hyperostosis_mechanism
  prompt: >-
    What links the hyperphosphatemic state to diaphyseal cortical hyperostosis
    and its episodic inflammatory attacks?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Diaphyseal Cortical Hyperostosis
  - phenotypes#Painful Diaphyseal Hyperostosis
  rationale: >-
    Allelic identity with the calcinosis presentation establishes that
    hyperostosis belongs to the same disease and follows the same phosphate
    excess, but the step from systemic phosphate to periosteal apposition in a
    particular long bone, at a particular time, is unaccounted for. The attacks
    are episodic while the biochemistry is constant, so something other than the
    phosphate level is timing them. This is the reason the lesion is repeatedly
    treated as osteomyelitis.
  evidence:
  - reference: PMID:20358599
    reference_title: Clinical variability of familial tumoral calcinosis caused by novel GALNT3 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tumoral calcinosis and hyperostosis-hyperphosphatemia syndrome represent a continuous spectrum of the same disease caused by increased phosphate levels, rather than two distinct disorders"
    explanation: This establishes the shared cause without supplying the local mechanism, which is the gap.
  - reference: PMID:15599692
    reference_title: Identification of a recurrent mutation in GALNT3 demonstrates that hyperostosis-hyperphosphatemia syndrome and familial tumoral calcinosis are allelic disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The heterogeneous phenotypic expression of the identified splice site mutation implies the existence of inherited or epigenetic modifying factors of importance in the regulation of ppGalNAc-T3 activity."
    explanation: The original authors explicitly posit unidentified modifiers, which is the open question restated.
- discussion_id: gap_hftc_no_replacement_therapy
  prompt: >-
    Would restoring intact FGF23 signalling correct the disease, and can early
    phosphate control prevent lesions from ever forming?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of FGF23-Klotho-FGFR1c Signaling in the Renal Proximal Tubule
  - treatments#Dietary Phosphate Restriction
  - treatments#Phosphaturic Therapy with Acetazolamide or Probenecid
  rationale: >-
    Every available treatment acts downstream of the lesion, on the phosphate
    load rather than on the missing signal, and none has been tested in a
    randomised trial. The two questions are linked: because no therapy restores
    the hormone, the only preventive strategy is phosphate control in the
    presymptomatic biochemical phase, and nobody has shown prospectively that it
    stops lesions forming. The acetazolamide case in which tumour formation
    ceased with no change in serum phosphate or TRP is a direct warning that the
    assumed mechanism of current therapy may not be the operative one.
  evidence:
  - reference: PMID:29389098
    reference_title: Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No randomized clinical trials have been performed; studies of the treatment of HFTC consist of case reports or case series."
    explanation: GeneReviews states the evidentiary position of every current treatment.
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no standard treatment for this disease, and studies of the treatment of FTC/HHS do not exist aside from case reports or case series."
    explanation: An independent statement of the same evidentiary gap.
  - reference: PMID:24668887
    reference_title: "Hyperphosphatemic familial tumoral calcinosis: response to acetazolamide and postulated mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no change in tubular reabsorption of phosphate (TRP) (96.9% vs. 95.9%, P = 0.34) or serum phosphate (6.6 mg/dl vs. 6.9 mg/dl, P = 0.52 pre- and post-acetazolamide, respectively)"
    explanation: Clinical benefit without any change in the parameter the drug is given to change is the specific anomaly the gap names.
- discussion_id: mismatch_hftc_galnt3_mouse_no_calcinosis
  prompt: >-
    Why does the Galnt3-null mouse reproduce the human biochemistry but form no
    calcific masses, and what does the missing step mean for testing therapies
    whose endpoint is lesion burden?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ectopic Calcium-Phosphate Deposition in Periarticular Soft Tissue
  - animal_models#Mus musculus
  rationale: >-
    The mismatch is informative rather than merely inconvenient. The mouse has
    the hormone deficiency, the transporter change, the hyperphosphatemia and
    the inappropriate calcitriol, and still does not calcify - so those four
    things are not jointly sufficient for the lesion, and something present in
    humans and absent in this mouse is required. Practically, it means no
    current genetic model supports a preclinical efficacy endpoint of lesion
    regression, which is the outcome patients care about most.
  evidence:
  - reference: PMID:19213845
    reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study we generated mice lacking the Galnt3 gene, which developed hyperphosphatemia without apparent calcifications."
    explanation: "This is the mismatch itself: full biochemical phenotype, absent anatomical phenotype."
  - reference: PMID:19213845
    reference_title: Ablation of the Galnt3 gene leads to low-circulating intact fibroblast growth factor 23 (Fgf23) concentrations and hyperphosphatemia despite increased Fgf23 expression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings indicate that Galnt3-deficient mice have a biochemical phenotype of tumoral calcinosis"
    explanation: The authors themselves limit the claim to a biochemical phenotype.
- discussion_id: gap_hftc_autoantibody_phenocopy
  prompt: >-
    When a patient has the full biochemical picture of HFTC but no biallelic
    GALNT3, FGF23 or KL genotype, how should the entry be scoped?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Deficiency of Circulating Intact FGF23 with C-Terminal Fragment Excess
  - disease#Hyperphosphatemic Familial Tumoral Calcinosis
  rationale: >-
    One of eight NIH-cohort subjects had no causative mutation found, and an
    acquired anti-FGF23 autoantibody phenocopy is recognised. That phenocopy is
    not modelled in this entry: it reaches the same endocrine node by an
    autoimmune route, so it is mechanistically a different disease that happens
    to share a downstream chain from the FGF23-deficiency node onward. Whether
    dismech should carry it as a separate acquired entry conforming to the same
    downstream nodes, or as a differential note only, is unresolved here.
  evidence:
  - reference: PMID:27164190
    reference_title: Phenotypic and Genotypic Characterization and Treatment of a Cohort With Familial Tumoral Calcinosis/Hyperostosis-Hyperphosphatemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GALNT3 mutations were identified in seven subjects; no causative mutation was found in the eighth."
    explanation: This documents genotype-negative disease within a well-characterised cohort.
  - reference: PMID:33977199
    reference_title: A Cross-Sectional Cohort Study of the Effects of FGF23 Deficiency and Hyperphosphatemia on Dental Structures in Hyperphosphatemic Familial Tumoral Calcinosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperphosphatemic familial tumoral calcinosis (HFTC) is a rare autosomal recessive disorder caused by mutations in FGF23, GALNT3, KLOTHO, or FGF23 autoantibodies."
    explanation: This source explicitly includes the autoantibody route alongside the three genes, which is the scoping question.

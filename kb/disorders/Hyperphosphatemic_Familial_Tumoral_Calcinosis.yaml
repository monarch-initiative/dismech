- name: Periarticular Calcific Masses
  category: Musculoskeletal
  frequency: FREQUENT
  description: >-
    Lobular, often massive calcific deposits in the soft tissue around large
    joints - most often the hip and gluteal region, then the elbow and forearm,
    then the shoulder. The masses are the principal cause of disability: they
    limit movement, cause pain, and may ulcerate through the skin. Burden ranges
    from radiographically silent to disabling even between relatives with the
    same genotype.
  phenotype_term:
    preferred_term: Periarticular calcification
    term:

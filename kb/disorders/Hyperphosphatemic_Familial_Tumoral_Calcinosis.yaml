name: Hyperphosphatemic Familial Tumoral Calcinosis
synonyms:
- HFTC
- HFTC/HHS
- familial tumoral calcinosis
- hyperphosphatemic tumoral calcinosis
- hyperostosis-hyperphosphatemia syndrome
- HHS
- Teutschlaender disease
- Morbus Teutschlaender
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
description: >-
  Hyperphosphatemic familial tumoral calcinosis (HFTC) is an autosomal recessive
  disorder of deficient fibroblast growth factor 23 (FGF23) action. Biallelic
  loss-of-function variants in GALNT3 or FGF23 leave the intact hormone
  unprotected against furin-family cleavage, so patients carry low or
  inappropriately normal intact FGF23 with a large excess of inactive C-terminal
  fragments; biallelic KL variants instead reduce alpha-Klotho, so intact FGF23
  is high and the kidney is resistant to it. Either route removes FGF23-Klotho
  signalling from the renal proximal tubule.

  The endocrine consequence is the mirror image of X-linked hypophosphatemia.
  Sodium-phosphate cotransport is not downregulated, tubular phosphate
  reabsorption stays inappropriately high, and 1-alpha-hydroxylase is not
  suppressed, so hyperphosphatemia coexists with elevated or inappropriately
  normal 1,25-dihydroxyvitamin D while calcium, PTH and renal function stay
  normal. The resulting rise in the calcium-phosphate product drives ectopic
  calcium-phosphate deposition.

  Clinically this appears as lobular periarticular calcific masses at the hips,
  elbows and shoulders, a distinctive dental phenotype (enamel hypoplasia,
  short bulbous roots, obliterated pulp chambers, pulp stones), painful
  diaphyseal cortical hyperostosis, vascular calcification, testicular
  microlithiasis and angioid streaks. Some patients develop overwhelming
  systemic inflammation around the deposits. Hyperostosis-hyperphosphatemia
  syndrome (HHS) is the same disease, not a separate one: the same GALNT3
  founder allele produces either presentation.

  The entry is organised around the causal chain from each of the three genetic
  lesions to the shared FGF23-signalling failure, then to the renal phosphate
  and vitamin D phenotype, the elevated calcium-phosphate product, and the
  tissue-level consequences of ectopic mineral deposition.
disease_term:
  preferred_term: Hyperphosphatemic Familial Tumoral Calcinosis
  term:

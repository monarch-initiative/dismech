parents:
- Disorders of Phosphate Metabolism
- Metabolic Bone Disorders
- Ectopic Calcification Disorders
notes: >-
  Scope and lump/split. The entry is curated at the umbrella MONDO term
  MONDO:0100251, which covers both the tumoral-calcinosis and the
  hyperostosis-hyperphosphatemia presentations, with the three molecular
  subtypes HFTC1 (GALNT3), HFTC2 (FGF23) and HFTC3 (KL) recorded in
  has_subtypes. The lump is evidence-driven rather than conventional: the same
  GALNT3 splice allele segregates in both HFTC and HHS families on a shared
  haplotype (PMID:15599692), and identical GALNT3 genotypes produce massive
  calcinosis in one patient and isolated hyperostosis in another
  (PMID:20358599). The three genes converge on one endocrine failure, so a
  single pathophysiology chain carries all of them and the subtype-specific
  divergence (low versus high intact FGF23) is modelled as two upstream branches
  into a shared signalling node rather than as three entries.

  Normophosphatemic familial tumoral calcinosis (SAMD9, MONDO:0012502) is
  deliberately excluded. It shares the calcific-mass morphology but has normal
  phosphate, no FGF23 abnormality and a different gene, so it is a distinct
  disease and not a subtype here. Acquired anti-FGF23 autoantibody tumoral
  calcinosis is likewise a phenocopy and is not modelled; it is noted in the
  knowledge-gap discussion because it is the differential when no biallelic
  genotype is found.

  Module conformance. No conformance target was declared.
  kb/modules/defective_skeletal_mineralization.yaml was read and rejected: it
  models failure of mineralization, whereas HFTC is a hyper-mineralizing
  disease, so conforming to it would invert the claim. No ectopic-calcification
  or pathological-mineral-deposition module exists in kb/modules/ at the time of
  curation; one would be the right home for the shared periarticular-deposit
  chain across HFTC, calciphylaxis and CKD-associated tumoral calcinosis.

  Provenance. Curated against the GeneReviews chapter (PMID:29389098) as the
  phenotype baseline, with the NIH natural-history cohort (PMID:27164190) and
  the NIH dental cohort (PMID:33977199) as the quantitative sources, plus the
  primary gene-discovery papers. The Falcon deep-research report
  (research/Hyperphosphatemic_Familial_Tumoral_Calcinosis-deep-research-falcon.md)
  was used as a lead list only; it cites by author-year/DOI key, so each DOI was
  resolved to a PMID through PubMed esearch before any snippet was taken
  (10.1002/jbmr.2870 to PMID:27164190, 10.1007/s00223-020-00659-6 to
  PMID:31965220, 10.1002/jbm4.10470 to PMID:33977199, 10.1007/s00223-024-01247-8
  to PMID:38951179). The report's term-validation section flags HP:0002905 as
  mislabelled in the report text; the canonical label Hyperphosphatemia is used
  here. The report offered no umbrella MONDO identifier; MONDO:0100251 was
  verified directly against the ontology.

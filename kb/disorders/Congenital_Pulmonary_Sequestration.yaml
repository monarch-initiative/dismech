notes: >-
  Two accounts of the origin exist and the entry carries one of them. The bronchial-atresia account is
  modelled, as the Segmental Bronchial Atresia node under the bronchial_atresia_origin hypothesis
  group, on a prospective pathological series that found an atretic lobar, segmental or subsegmental
  bronchus in every extralobar and 82 per cent of intralobar specimens. The competing account - a
  supernumerary ventral lung bud arising from the primitive foregut caudal to the normal bud and
  migrating with the oesophagus, its splanchnic vessels persisting as the systemic feeder - is held
  widely in the literature but is not modelled here, because no quotable source for it was found. The
  searches run were PubMed title searches for the Riedlinger series (which resolved, and is now cited)
  and keyword passes over all 47 on-topic cached bodies for foregut, lung bud, accessory, atresia,
  atretic, bronchopulmonary bud, budding, diverticul and malinosculation; of those only atresia now
  returns anything, through the newly fetched series. The lung-bud model's own sources in the research
  report are a PMC review and a collective review reachable only as PDFs, neither of which yields a
  citable abstract. A curator who fetches one should add it as a second node in its own hypothesis
  group rather than replacing this one: the two models are not exclusive, and the atresia series'
  authors themselves write only that the entities may share an etiopathogenesis.


  The protein-level findings - persistent HOXB5 and an altered alpha-2 integrin isoform - are carried
  as a pathophysiology node rather than in a genetic section, because neither is a gene-disease claim:
  no variant is reported in either gene, and both studies measure protein abundance in resected lesion
  tissue against matched normal lung. The node asserts no causal edge, for the reason its own
  description gives.


  The two forms are kept apart wherever a figure differs between them, because most of the cached figures
  do. Relative frequency, venous drainage, site, age at presentation and the fetal course all differ,
  and the 540-case series reports several of its figures within a run of sentences about one form only,
  so a figure taken out of that run can be read as applying to both when it does not.


  The pulmonary-hypertension figure comes from a catheterisation-referred paediatric cohort in which 86
  per cent had a congenital heart defect. It is recorded with that caveat on the phenotype row and is
  not a population frequency.
review_notes: >-
  Four cached sentences say what the entry wanted said and are deliberately not used. One source writes presents an abnormal connection with the tracheobronchial tree, which is the
  opposite of the standard definition and of every other cached source, so it is left alone. Two carry
  split hyphenation from a line wrap - infra- diaphragmatically and back- to- back - which check-folded-hyphens
  would flag, and a different source carries the same claim cleanly. One surveillance study's own prevalence
  figure is garbled in the source, with a stray space and a missing digit, so the cached national study's
  rate is used instead.


  One cached review is about congenital lung malformations as a class and never uses the word sequestration;
  nothing from it is cited. The asymptomatic-management question is live in that literature and the entry
  records only what a source about this disease says.

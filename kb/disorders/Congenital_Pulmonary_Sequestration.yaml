genetic:
- name: HOXB5 persistence in lesion tissue
  gene_term:
    preferred_term: HOXB5
    term:
      id: hgnc:5116
      label: HOXB5
  relationship_type: UNKNOWN
  evidence:
  - reference: PMID:14632303
    reference_title: Expression of Hoxb-5 during human lung development and in congenital lung malformations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In BPS and CCAM tissue, Hoxb-5 protein levels were increased compared to age- and developmentally-matched
      lung tissue, and were more similar to the PSG and CAN with Hoxb-5-positive cells in mesenchyme surrounding
      abnormally branched airways.
    explanation: The measurement, in lesion tissue against matched controls.
  - reference: PMID:14632303
    reference_title: Expression of Hoxb-5 during human lung development and in congenital lung malformations.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesized that Hoxb-5 is similarly involved in human lung branching morphogenesis, and is
      abnormally expressed in bronchopulmonary sequestration (BPS) and congenital cystic adenomatoid malformation
      (CCAM), both of which are congenital lung malformations with abnormal airway development.
    explanation: >-
      That the authors state this as a hypothesis, which is why the relationship_type is UNKNOWN rather
      than a causal value.
  notes: >-
    Not a causal gene. HOXB5 protein is higher in sequestration and congenital cystic adenomatoid malformation
    tissue than in matched lung, at levels typical of an earlier developmental stage. The cited study
    frames this as a hypothesis in its background and uses associated with in its conclusion, and this
    entry does not read it as a cause.


    relationship_type is UNKNOWN rather than SUSCEPTIBILITY or MODIFIER because every candidate value
    asserts a contribution to disease that no cached source claims. The schema defines RISK_FACTOR as
    neither necessary nor sufficient but still contributory, which is more than a protein-level correlation
    in resected tissue supports.

- reference: PMID:30335347
  title: Pulmonary Sequestration.
  tags:
  - StatPearls
notes: >-
  Three accounts of the origin are carried, each in its own hypothesis group. The bronchial-atresia
  account is modelled, as the Segmental Bronchial Atresia node under the bronchial_atresia_origin
  hypothesis group, on a prospective pathological series that found an atretic lobar, segmental or
  subsegmental bronchus in every extralobar and 82 per cent of intralobar specimens; its authors
  write only that bronchial atresia and CCAM may share an etiopathogenesis. The accessory-lung-bud
  account is the Accessory Lung Bud node, whose edge is under accessory_lung_bud_origin: a 1986
  single-hospital pathology series states it as the view generally held for the intralobar form
  before proposing that most intralobar cases are something else, one case report suggests it, and a
  fetal series judged the anomalous arteries consistent with an origin from the embryonic splanchnic
  plexus. No cached source shows the bud or applies the account to the extralobar form. The research
  report's fuller version, a supernumerary ventral bud arising from the primitive foregut caudal to
  the normal one and migrating with the oesophagus, has no cached source and is not recorded. The
  entry does not treat the two congenital accounts as excluding each other. The third account, that
  the intralobar form is acquired, is recorded under acquired_intralobar_origin with evidence on
  both sides and no edge: its unqualified form is contradicted by fetal and infant cases, and it is
  put forward for some lesions only. The two sources that state the lung-bud account came from a
  PubMed search of (sequestration[tiab]) AND (lung[tiab] OR pulmonary[tiab]) AND ("accessory lung
  bud"[tiab] OR "accessory bud"[tiab] OR "supernumerary lung bud"[tiab] OR "accessory lung"[tiab]),
  which returned 16 records, after keyword passes over the entry's earlier cached sources had found
  none. The sources on an acquired or congenital origin, the fetal series among them, came from a
  search of ("intralobar sequestration"[tiab] OR "intralobar pulmonary sequestration"[tiab]) AND
  (acquired[tiab]), which returned 17. Both searches were run on 19 Nov 2026.


  The protein-level findings - persistent HOXB5 and an altered alpha-2 integrin isoform - are carried
  as a pathophysiology node rather than in a genetic section, because neither is a gene-disease claim:
  no variant is reported in either gene, and both studies measure protein abundance in resected lesion
  tissue against matched normal lung. The node asserts no causal edge, for the reason its own
  description gives.


  The two forms are kept apart wherever a figure differs between them, because most of the cached figures
  do. Relative frequency, venous drainage, site, age at presentation and the fetal course all differ,
  and the 540-case series reports several of its figures within a run of sentences about one form only,
  so a figure taken out of that run can be read as applying to both when it does not.


  The pulmonary-hypertension figure comes from a catheterisation-referred paediatric cohort in which 86
  per cent had a congenital heart defect. It is recorded with that caveat on the phenotype row and is
  not a population frequency.
review_notes: >-
  Four cached sentences say what the entry wanted said and are deliberately not used. One source writes presents an abnormal connection with the tracheobronchial tree, which is the
  opposite of the standard definition and of every other cached source, so it is left alone. Two carry
  split hyphenation from a line wrap - infra- diaphragmatically and back- to- back - which check-folded-hyphens
  would flag, and a different source carries the same claim cleanly. One surveillance study's own prevalence
  figure is garbled in the source, with a stray space and a missing digit, so the cached national study's
  rate is used instead.


  One cached review is about congenital lung malformations as a class and never uses the word sequestration;
  nothing from it is cited. The asymptomatic-management question is live in that literature and the entry
  records only what a source about this disease says.

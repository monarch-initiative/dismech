      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The symptoms of pulmonary sequestration were cough, sputum, fever, hemoptysis, and chest
        pain, with 13.36% of patients being asymptomatic.
      explanation: >-
        The series' own symptom list, which names cough first. It is the closest the source comes to
        this edge and it does not make it: the paper reports cough among the disease's symptoms and
        never attributes it to the infection in the segment. INDIRECT for that reason - the step from

- name: Fetal thoracentesis or thoracoamniotic shunt placement
  description: >-
    Drainage of the fetal tension hydrothorax before birth, by needle aspiration or by placing a
    shunt between the pleural space and the amniotic cavity. It treats the hydrothorax rather than the
    sequestration, and in the larger cached fetal series the hydrops resolved after it.
  treatment_term:
    preferred_term: fetal pleural drainage
    term:
      id: NCIT:C15392
      label: Thoracentesis
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Tension Hydrothorax in the Fetus
    treatment_effect: INHIBITS
    description: >-
      Draining the effusion removes the mechanism by which a sequestration causes hydrops, which is
      why hydrops resolves rather than the lesion changing.
    evidence:
    - reference: PMID:29229484
      reference_title: >-
        Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All four hydropic fetuses received maternal betamethasone, and three hydropic fetuses underwent
        thoracentesis and/or thoracoamniotic shunt placement with subsequent hydrops resolution.
      explanation: >-
        The procedure and its outcome in one sentence, in the cohort this entry already cites for the
        fetal course. Note the same sentence records that all four also received maternal
        betamethasone, so the resolution is not attributable to drainage alone - which is why no
        separate corticosteroid treatment row is asserted from it.
  evidence:

    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though no significant differences regarding operative time (P = 0.133), the minimally invasive surgery

diagnosis:
- name: Computed tomography angiography
  description: >-
    The test that makes the diagnosis, because it shows the feeding vessel. One 43-patient single-centre
    series reports promising results from using it, rather than digital subtraction angiography, as the
    only diagnostic and pretreatment planning tool, and used it to decide between embolisation, resection
    and observation.
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  evidence:
  - reference: PMID:22956521
    reference_title: >-
      The clinical value of computer tomographic angiography for the diagnosis and therapeutic planning
      of patients with pulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic performance of CT angiography for pulmonary sequestration in the patient-based evaluation
      yielded an accuracy of 97.7%, sensitivity of 97.3%, specificity of 100%, positive predictive value
      (PPV) of 100% and negative predictive value (NPV) of 85.7%.
    explanation: Its performance on a patient basis.
  - reference: PMID:22956521
    reference_title: >-
      The clinical value of computer tomographic angiography for the diagnosis and therapeutic planning
      of patients with pulmonary sequestration.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For each patient, CT angiography was used to determine whether the pulmonary sequestration was suitable
      for coil embolization, surgical resection or conservative treatment.
    explanation: That the same study used it to choose between the three management options.
differential_diagnoses:
- name: Congenital pulmonary airway malformation
  disease_term:
    preferred_term: congenital pulmonary airway malformation
    term:
      id: MONDO:0016580
      label: congenital pulmonary airway malformation
  description: >-
    The principal differential, and the one the two lesions are least separable on. A prospective
    pathology series found the parenchymal maldevelopment that defines CCAM in almost every
    sequestration specimen it examined, and a fetal series reports lesions that are histologically
    both. What separates them in the cited sources is the blood supply: a sequestration draws its
    arterial supply from systemic vessels rather than from the pulmonary artery. The overlap is in
    the parenchyma.
  distinguishing_features:
  - A feeding artery arising from a systemic vessel rather than from the pulmonary artery identifies
    a sequestration; this entry's diagnosis section records CT angiography as the test that shows it.
  - Parenchymal maldevelopment of CCAM type does not distinguish the two - it is present in most
    sequestration specimens as well.
  - >-
      A lesion can be both - a fetal series of fourteen fetuses reports three in whom the lesion was
      histologically both entities, in a cohort defined by systemic arterial supply.
  evidence:
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parenchymal maldevelopment that characterizes CCAM was present in 100% of CCAM cases (as
      expected by definition) as well as in 91% of ELS, 91% of ILS, and 50% of LE (those with BA)
      cases.
    explanation: >-
      Measures the overlap that makes this the principal differential: the histological feature
      that names CPAM is present in most sequestration specimens.
  - reference: PMID:10511360
    reference_title: "Fetal pulmonary sequestration: a favorable congenital lung lesion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three fetuses had histologically mixed lesions (congenital cystic adenomatoid malformation and
      pulmonary sequestration).
    explanation: >-
      Supports the hybrid case: three fetuses in this series had a lesion that was both entities
      histologically, so the differential is not always resolvable into one of the two.
  - reference: PMID:10511360
    reference_title: "Fetal pulmonary sequestration: a favorable congenital lung lesion."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 14 fetuses, the echogenic lung masses were pulmonary sequestrations deriving arterial blood
      supply from clearly identifiable systemic arteries rather than the pulmonary artery.
    explanation: >-
      The arterial half of the hybrid claim, and the denominator of fourteen. It also states the
      contrast this row turns on - systemic arteries rather than the pulmonary artery - which no
      other quote in the entry carries for this comparison.
- name: Congenital lobar emphysema
  disease_term:
    preferred_term: congenital lobar emphysema
    term:
      id: MONDO:0007536
      label: congenital lobar emphysema
  description: >-
    The same prospective pathology series that linked sequestration to CPAM found bronchial atresia
    in some lobar-emphysema specimens as well as in every extralobar sequestration, which places the
    two on one developmental spectrum rather than separating them by mechanism. The series examined
    four lobar-emphysema specimens, so its figures for that entity rest on a very small number, and
    the half it reports were cases already clinically recognised to carry bronchial atresia or minor
    CCAM.
  distinguishing_features:
  - >-
      Bronchial atresia is shared rather than discriminating - the authors report it in all
      extralobar sequestrations, most intralobar ones and some lobar emphysema.
  - >-
      The lobar-emphysema figure rests on four specimens, and the 50 percent the series reports is
      qualified in its own sentence as those already recognised to have bronchial atresia or minor
      CCAM.
  evidence:
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologic examination revealed atresia of a lobar, segmental, or subsegmental bronchus in 100%
      of ELS, 82% of ILS, 70% of CCAM, and 50% of LE (those clinically recognized to have BA or minor
      CCAM) cases.
    explanation: >-
      Reports the shared lesion across all four entities, with the authors' own qualifier on the
      lobar-emphysema figure kept in the quote.
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchial atresia is present in all ELS, most ILS and CCAM, and some LE cases, and its
      detection is greatly enhanced with the dissecting microscope.
    explanation: >-
      The authors' own summary, which says "some" for lobar emphysema where the table says 50
      percent of four. This row follows their wording rather than the raw proportion.
- name: Bronchogenic cyst
  disease_term:
    preferred_term: bronchogenic cyst
    term:
      id: MONDO:0016523
      label: bronchogenic cyst
  description: >-
    A foregut-derived cyst in the mediastinum or lung can present as the same prenatally detected
    thoracic mass. A two-hospital chart review of 39 patients with pulmonary sequestration set out to measure how often they
    are atypical or associated with another entity, naming bronchogenic cyst, communicating
    bronchopulmonary foregut malformation, CCAM and scimitar syndrome as the entities it looked for.
    It found only just over half were classic isolated extralobar or intralobar lesions, and that the
    preoperative diagnosis was right in fewer than six cases in ten. The abstract does not break the
    remainder down by entity, so this row records the overlap the series measured rather than a
    per-entity count.
  distinguishing_features:
  - >-
      Overlap is common enough to change management - about half of the lesions in this series were
      atypical or associated with another anomaly.
  - >-
      The differential is often unresolved before operation: the correct diagnosis was made
      preoperatively in 59 percent of this series.
  evidence:
  - reference: PMID:11329590
    reference_title: The multiple facets of pulmonary sequestration.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 22 of the 39 patients (56%) had a classic isolated extralobar or intralobar sequestration,
      whereas the others presented with a spectrum of anomalies.
    explanation: >-
      Quantifies how often a lesion managed as a sequestration is something else or something more.
      INDIRECT because the sentence names no entity: reaching bronchogenic cyst from "a spectrum of
      anomalies" takes the study's own statement of which entities it searched for.

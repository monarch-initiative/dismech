    explanation: >-
      What was found in resected lesions, and that a fungus was the commonest identified organism where
      one was identified at all.
  - reference: PMID:28449484
    reference_title: Clinical presentation and characteristics of 25 adult cases of pulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic cases were at higher than expected risk of surgical complications, comparing to asymptomatic
      (chi2, P=0.04).
    explanation: Why the timing of resection matters.
- name: Hemodynamic Load from the Aberrant Systemic Feeder
  description: >-
    The load the aberrant feeder places on the circulation. Neonates with large lesions are severely
    symptomatic and improve after the feeder is closed, and high-output cardiac failure is recognised
    often enough to be listed among the contraindications to surgery in a paediatric embolisation
    cohort. Which side of the heart takes that load differs between the two forms, so the entry does
    not state a shunt direction for the disease: the intralobar majority drains to the pulmonary veins
    and so returns to the left atrium, while the extralobar minority drains to the systemic veins. No
    cached source names a direction, and the subtype rows carry the drainage figures.
  biological_scale: ORGANISM
  downstream:
  - target: Pulmonary arterial hypertension
    description: The recirculating volume load raises pulmonary arterial pressure.
    evidence:
    - reference: PMID:37508694
      reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
        Experience.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: Forty-two (59%) patients had pulmonary arterial hypertension (PAH) at the time of diagnosis.
      explanation: >-
        How often pulmonary hypertension was present at diagnosis in a paediatric catheterisation cohort.
        Read with the caveat in notes: 86 per cent of that cohort had congenital heart defects, so the
        figure is not attributable to the sequestration alone.
  evidence:
  - reference: PMID:37508694
    reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
      Experience.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Neonates with large PSs are severely symptomatic and improve remarkably after PS closure.
    explanation: >-
      The authors' own conclusion. Indirect for this node because the sentence reports symptoms and
      their reversal on closure rather than any haemodynamic measurement; the load is the inference
      from it.
  - reference: DOI:10.3390/children13060842
    reference_title: >-
      Endovascular Embolization of Pulmonary Sequestration in Children with Contraindications to Surgery:
      A Two-Centre Experience with Long-Term Follow-Up
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contraindications to surgery were severe pulmonary arterial hypertension, high-output cardiac
      failure, low body weight with comorbidity, complex extralobar anatomy or refused parental consent.
    explanation: >-
      The only cached source that names high-output cardiac failure in this disease, which is what
      supports that clause in the node description. Indirect because the sentence lists the cohort's
      contraindications rather than measuring the load.
- name: Tension Hydrothorax in the Fetus
  subtypes:
  - Extralobar
  description: >-
    The fetal route to hydrops, and the one the cached literature says is the only one: a sequestration
    causes hydrops through a tension hydrothorax, which can be drained before birth. Hydrops was confined
    to extralobar lesions in the larger cached fetal series.
  biological_scale: ORGANISM
  downstream:
  - target: Hydrops fetalis
    description: The tension hydrothorax, not the mass itself, is what produces the hydrops.
    evidence:
    - reference: PMID:10511360
      reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestrations cause hydrops only because of a tension hydrothorax, which can be drained
        prenatally, if necessary.
      explanation: The mechanism, stated with the authors' own exclusive - only because of.
  evidence:
  - reference: PMID:29229484
    reference_title: >-
      Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight fetuses developed hydrothorax, four of which (all extralobar BPSs) also developed hydrops.
    explanation: The frequency, and that every hydropic fetus in that series had an extralobar lesion.
- name: Segmental Bronchial Atresia
  role: trigger
  node_class: DEVELOPMENTAL_MALFORMATION
  biological_scale: TISSUE
  description: >-
    One of two competing accounts of how the lesion arises, and the one with cached evidence. An
    atretic lobar, segmental or subsegmental bronchus was found in every extralobar and in most
    intralobar sequestration specimens examined prospectively under a dissecting microscope, which
    places this disease on a developmental spectrum with congenital pulmonary airway malformation and
    congenital lobar emphysema rather than apart from them. The competing account, a supernumerary
    ventral foregut lung bud, has no cached source and is recorded in this entry's notes as a model
    the literature holds rather than as a node.
  biological_processes:
  - preferred_term: disrupted lung airway branching
    modifier: DECREASED
    term:
      id: GO:0060441
      label: epithelial tube branching involved in lung morphogenesis
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologic examination revealed atresia of a lobar, segmental, or subsegmental bronchus in 100%
      of ELS, 82% of ILS, 70% of CCAM, and 50% of LE (those clinically recognized to have BA or minor
      CCAM) cases.
    explanation: >-
      The figures behind this node, from a prospective examination of 47 resected specimens. Note what
      they are and are not: atresia was present in every extralobar and most intralobar specimen, which
      makes it a candidate initiating lesion, but a cross-sectional finding in resected tissue cannot
      by itself establish that the atresia came first.
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It may be that both have the same etiopathogenesis with anatomic differences accounted for by
      aberrant genetic programs or other insults, perhaps modified by time of onset or duration.
    explanation: >-
      The authors' own hedge, and the reason this node sits in a hypothesis group rather than at the
      head of the chain as settled fact: they write the shared origin as something that may be so, and
      name timing and duration as what would distinguish the entities.
  downstream:
  - target: Absent Communication with the Tracheobronchial Tree
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - bronchial_atresia_origin
    description: >-
      An atretic bronchus is, by its anatomy, a bronchus that does not communicate - so on this account
      the entry's first defining feature is the atresia seen from the distal side.
    evidence:
    - reference: PMID:16953677
      reference_title: >-
        Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
        cystic adenomatoid malformation, and lobar emphysema.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchial atresia is present in all ELS, most ILS and CCAM, and some LE cases, and its detection
        is greatly enhanced with the dissecting microscope.
      explanation: >-
        That the atresia is there in all extralobar and most intralobar cases, which is what the edge
        rests on. Indirect because the study reports co-occurrence in resected specimens and does not
        demonstrate the sequence; the closing clause about the dissecting microscope is also why
        earlier series missed it.
- name: Persistent HOXB5 and Aberrant Adhesion-Molecule Expression in Lesion Tissue
  node_class: PROTEIN_ABUNDANCE_EXCESS
  biological_scale: MOLECULAR
  description: >-
    Protein-level findings in resected sequestration tissue, held here rather than in the genetic
    section because neither is a gene-disease claim: no variant is reported in either gene, and both
    studies measure protein abundance in lesion tissue against matched normal lung. HOXB5 is higher
    than in age- and developmentally-matched lung and at a level typical of an earlier developmental
    stage; an alpha-2 integrin isoform potentially lacking cytoplasmic sequences is increased, with
    more intense spatial and cellular expression. Both are correlates whose place in the causal chain
    is unestablished, which is why this node has no incoming or outgoing edge and sits in its own
    hypothesis group.
  genes:
  - preferred_term: HOXB5
    modifier: INCREASED
    term:
      id: hgnc:5116
      label: HOXB5
  - preferred_term: ITGA2
    modifier: INCREASED
    term:
      id: hgnc:6137
      label: ITGA2
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:14632303
    reference_title: Expression of Hoxb-5 during human lung development and in congenital lung malformations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In BPS and CCAM tissue, Hoxb-5 protein levels were increased compared to age- and developmentally-matched
      lung tissue, and were more similar to the PSG and CAN with Hoxb-5-positive cells in mesenchyme surrounding
      abnormally branched airways.
    explanation: The HOXB5 measurement, in lesion tissue against matched controls.
  - reference: PMID:19411307
    reference_title: >-
      Aberrant cell adhesion molecule expression in human bronchopulmonary sequestration and congenital
      cystic adenomatoid malformation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Compared with normal human lung, a previously undetected alpha(2)-integrin isoform potentially lacking
      essential cytoplasmic sequences was significantly increased in BPS and CCAM, and alpha(2)-integrin
      spatial and cellular expression was more intense.
    explanation: The alpha-2 integrin measurement, against normal lung.
  - reference: PMID:19411307
    reference_title: >-
      Aberrant cell adhesion molecule expression in human bronchopulmonary sequestration and congenital
      cystic adenomatoid malformation.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Aberrant cell adhesion molecule and Hox protein regulation are likely part of the mechanism involved
      in the development of BPS and CCAM.
    explanation: >-
      The authors' own hedge on how far the mechanism goes, and the reason this node asserts no edge.
      Graded IN_VITRO rather than HUMAN_CLINICAL because the sentence summarises this paper's Western
      blots on resected lesion tissue and its mouse lung fibroblast knockdown; the study has no
      clinical arm.
has_subtypes:
- name: Intralobar
  display_name: Intralobar sequestration (ILS)
  subtype_term:
    preferred_term: intralobar congenital pulmonary sequestration
    term:
      id: MONDO:0017245
      label: intralobar congenital pulmonary sequestration
  description: >-
    The majority form - 84 per cent of 2,625 reported cases, and 91 per cent of a 97-patient adult series.
    It lies inside the visceral pleura of a normal lobe and drains to the pulmonary veins. Approximately
    two-thirds sit in the posterior basal segment of the left lower lobe. It presents later than the extralobar form,
    which is why the subtype ratio shifts towards it with age, and it is the form that presents with recurrent
    infection in adults.
  evidence:
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The abnormal lung tissue is located within the visceral pleura of a pulmonary lobe in the intralobar
      variety, whereas the extralobar form has its own visceral pleura.
    explanation: The pleural distinction, both forms in one sentence.
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The venous drainage of the extralobar type is usually into the systemic veins, whereas the intralobar
      type drains into the pulmonary veins.
    explanation: >-
      The venous distinction, both forms in one sentence, with the source's own usually on the extralobar
      side.
  - reference: PMID:40364049
    reference_title: >-
      Predictive Role of Venous Drainage and Lesion Margins in Bronchopulmonary Sequestration Classification.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VD is significantly different between ILS and ELS: 96% of ILS drain into the pulmonary system while
      83% of ELS drain into a systemic vein (p < 0.00001).
    explanation: The venous rule quantified in 36 surgical patients, with its p value.
  - reference: PMID:21459605
    reference_title: 'Pulmonary sequestration: a retrospective analysis of 2625 cases in China.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary sequestrations were divided into two types, intralobar sequestration (83.95%) and extralobar

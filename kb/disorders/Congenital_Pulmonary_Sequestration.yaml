    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contraindications to surgery were severe pulmonary arterial hypertension, high-output cardiac
      failure, low body weight with comorbidity, complex extralobar anatomy or refused parental consent.
    explanation: >-
      The only cached source that names high-output cardiac failure in this disease, which is what
      supports that clause in the node description. Indirect because the sentence lists the cohort's
      contraindications rather than measuring the load.
- name: Tension Hydrothorax in the Fetus
  subtypes:
  - Extralobar
  description: >-
    The fetal route to hydrops, and the one the cached literature says is the only one: a sequestration
    causes hydrops through a tension hydrothorax, which can be drained before birth. Hydrops was confined
    to extralobar lesions in the larger cached fetal series.
  biological_scale: ORGANISM
  downstream:
  - target: Hydrops fetalis
    description: The tension hydrothorax, not the mass itself, is what produces the hydrops.
    evidence:
    - reference: PMID:10511360
      reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestrations cause hydrops only because of a tension hydrothorax, which can be drained
        prenatally, if necessary.
      explanation: The mechanism, stated with the authors' own exclusive - only because of.
  evidence:
  - reference: PMID:29229484
    reference_title: >-
      Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight fetuses developed hydrothorax, four of which (all extralobar BPSs) also developed hydrops.
    explanation: The frequency, and that every hydropic fetus in that series had an extralobar lesion.
- name: Segmental Bronchial Atresia
  role: trigger
  node_class: DEVELOPMENTAL_MALFORMATION
  biological_scale: TISSUE
  description: >-
    One of three accounts of how the lesion arises, and the one with a prospective pathological
    series behind it. An atretic lobar, segmental or subsegmental bronchus was found in every
    extralobar and in most intralobar sequestration specimens examined prospectively under a
    dissecting microscope, which would place this disease on a developmental spectrum with
    congenital pulmonary airway malformation and congenital lobar emphysema rather than apart from
    them. The accessory lung bud account is the Accessory Lung Bud node, whose edge has its own
    hypothesis group, and an acquired origin for the intralobar form is a third group.
  biological_processes:
  - preferred_term: disrupted lung airway branching
    modifier: DECREASED
    term:
      id: GO:0060441
      label: epithelial tube branching involved in lung morphogenesis
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathologic examination revealed atresia of a lobar, segmental, or subsegmental bronchus in 100%
      of ELS, 82% of ILS, 70% of CCAM, and 50% of LE (those clinically recognized to have BA or minor
      CCAM) cases.
    explanation: >-
      The figures behind this node, from a prospective examination of 47 resected specimens. Note what
      they are and are not: atresia was present in every extralobar and most intralobar specimen, which
      makes it a candidate initiating lesion, but a cross-sectional finding in resected tissue cannot
      by itself establish that the atresia came first.
  - reference: PMID:16953677
    reference_title: >-
      Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
      cystic adenomatoid malformation, and lobar emphysema.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It may be that both have the same etiopathogenesis with anatomic differences accounted for by
      aberrant genetic programs or other insults, perhaps modified by time of onset or duration.
    explanation: >-
      The authors' own hedge, and the reason this node sits in a hypothesis group rather than at the
      head of the chain as settled fact: they write the shared origin as something that may be so, and
      name timing and duration as what would distinguish the entities.
  downstream:
  - target: Absent Communication with the Tracheobronchial Tree
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - bronchial_atresia_origin
    description: >-
      An atretic bronchus is, by its anatomy, a bronchus that does not communicate - so on this account
      the entry's first defining feature is the atresia seen from the distal side.
    evidence:
    - reference: PMID:16953677
      reference_title: >-
        Bronchial atresia is common to extralobar sequestration, intralobar sequestration, congenital
        cystic adenomatoid malformation, and lobar emphysema.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchial atresia is present in all ELS, most ILS and CCAM, and some LE cases, and its detection
        is greatly enhanced with the dissecting microscope.
      explanation: >-
        That the atresia is there in all extralobar and most intralobar cases, which is what the edge
        rests on. Indirect because the study reports co-occurrence in resected specimens and does not
        demonstrate the sequence; the closing clause about the dissecting microscope is also why
        earlier series missed it.
- name: Accessory Lung Bud
  role: trigger
  node_class: DEVELOPMENTAL_MALFORMATION
  biological_scale: TISSUE
  description: >-
    A second account of how the intralobar form arises: the sequestered tissue grows from an
    accessory lung bud, is enveloped by normal lung, and keeps its own systemic arterial supply. A
    1986 single-hospital pathology series gives this as the view generally held for the intralobar
    form, then proposes that most intralobar cases are something else; the authors of a case of
    bilateral intralobar sequestration joined by an isthmus suggested an origin from accessory lung
    tissue. No cached source shows the bud itself, so the node's edge sits in its own hypothesis
    group beside the bronchial-atresia account rather than replacing it.
  evidence:
  - reference: PMID:3737276
    reference_title: "Intralobar pulmonary sequestration (a nonentity?)."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Intralobar pulmonary sequestration has generally been considered a congenital malformation in
      which an accessory lung bud develops, is enveloped by normal lung, and retains its systemic
      arterial supply.
    explanation: >-
      States the account, as the view generally held for the intralobar form. Indirect: a statement
      of the view held, in a series that goes on to propose that most intralobar cases are something
      else, not a demonstration of the bud.
  - reference: PMID:24144479
    reference_title: >-
      Bilateral intralobar sequestration of the lung with a bridging isthmus: pathologic and
      radiologic findings.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features suggested that this bilateral ILS might have originated from an accessory lung
      tissue.
    explanation: >-
      One case read by its authors as possibly arising from accessory lung tissue, from the lesion's
      bronchial and vascular anatomy. Indirect: a suggestion from one case, and the sentence names
      accessory lung tissue rather than a bud.
  downstream:
  - target: Anomalous Systemic Arterial Supply
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - accessory_lung_bud_origin
    description: >-
      On this account the systemic feeder is the bud's own original blood supply, kept as the bud is
      enveloped by the lung. The 1986 series states the account in these terms, and in four fetal
      cases the anomalous arteries were consistent with an origin from the embryonic splanchnic
      plexus.
    evidence:
    - reference: PMID:3737276
      reference_title: "Intralobar pulmonary sequestration (a nonentity?)."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: >-
        Intralobar pulmonary sequestration has generally been considered a congenital malformation
        in which an accessory lung bud develops, is enveloped by normal lung, and retains its
        systemic arterial supply.
      explanation: >-
        The account itself has the bud retain its systemic arterial supply. Indirect: a statement of
        the view held, not a demonstration.
    - reference: PMID:14692645
      reference_title: >-
        Intralobar sequestration of the lung is a congenital anomaly: anatomopathological analysis
        of four cases diagnosed in fetal life.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The character of the anomalous arterial vessels is consistent with origin from the embryonic
        splanchnic plexus.
      explanation: >-
        In four fetuses examined at postmortem the anomalous arteries had a character the authors
        judged consistent with an origin from the embryonic splanchnic plexus, which fits a feeder
        kept from early development. Indirect: an embryonic feeder fits any congenital account, not
        only this one, and the same paper says the precise sequence of events is unclear.
- name: Persistent HOXB5 and Aberrant Adhesion-Molecule Expression in Lesion Tissue
  node_class: PROTEIN_ABUNDANCE_EXCESS
  biological_scale: MOLECULAR
  description: >-
    Protein-level findings in resected sequestration tissue, held here rather than in the genetic
    section because neither is a gene-disease claim: no variant is reported in either gene, and both
    studies measure protein abundance in lesion tissue against matched normal lung. HOXB5 is higher
    than in age- and developmentally-matched lung and at a level typical of an earlier developmental
    stage; an alpha-2 integrin isoform potentially lacking cytoplasmic sequences is increased, with
    more intense spatial and cellular expression. Both are correlates whose place in the causal chain is unestablished, which is why this node has no
    incoming or outgoing edge. It belongs to no hypothesis group: that slot sits on a causal edge,
    and this node declares none.
  genes:
  - preferred_term: HOXB5
    modifier: INCREASED
    term:
      id: hgnc:5116
      label: HOXB5
  - preferred_term: ITGA2
    modifier: INCREASED
    term:
      id: hgnc:6137
      label: ITGA2
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:14632303
    reference_title: Expression of Hoxb-5 during human lung development and in congenital lung malformations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In BPS and CCAM tissue, Hoxb-5 protein levels were increased compared to age- and developmentally-matched

    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-abdominal extralobar sequestration should also be kept in differential diagnosis in cases

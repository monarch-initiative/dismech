treatments:
- name: Surgical resection
  target_mechanisms:
  - target: Non-functioning Dysplastic Lung Tissue
    treatment_effect: INHIBITS
    description: >-
      Resection removes the sequestered segment, so it addresses the substrate every downstream
      consequence runs from rather than any one of them.
    evidence:
    - reference: PMID:36635696
      reference_title: 'Pulmonary sequestration in adult patients: a single-center retrospective study.'
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: Only four (4.1%) patients developed postoperative complications.
      explanation: >-
        That the operation is routinely completed, which is what makes resection of this node a real
        intervention rather than a theoretical one. Indirect for the link: the sentence reports the
        complication rate and not the removal of the tissue, which is what resection means by
        definition.
  description: >-
    The standard treatment. In a 97-patient adult series minimally invasive surgery beat open thoracotomy
    on blood loss, drainage volume, hospital days and drainage duration, with no perioperative mortality
    and complications in 4 per cent.
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:41586995

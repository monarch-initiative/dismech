    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: placement of a thoracoamniotic shunt for drainage of an ipsilateral tension hydrothorax
    explanation: >-
      A second cached series performing the same procedure for the same indication, which is what
      makes this a recognised intervention rather than a single report.
mechanistic_hypotheses:
- hypothesis_group_id: bronchial_atresia_origin
  hypothesis_label: Segmental bronchial atresia as the initiating lesion
  status: EMERGING
  description: >-
    That the disease begins with atresia or obstruction of a developing airway, which would place it
    on one developmental spectrum with congenital pulmonary airway malformation and congenital lobar
    emphysema, the resulting malformation being set by the level, degree and timing of the
    obstruction. The cached support is a prospective pathological series finding an atretic bronchus
    in every extralobar and most intralobar specimens, together with the authors' own suggestion
    that bronchial atresia and CCAM may share an etiopathogenesis. It is EMERGING rather than
    CANONICAL because the evidence is cross-sectional: atresia found in resected tissue is
    consistent with being the cause and also with being a consequence, and no cached source
    demonstrates the sequence.
- hypothesis_group_id: accessory_lung_bud_origin
  hypothesis_label: An accessory lung bud as the origin of the intralobar form
  status: ALTERNATIVE
  applies_to_subtypes:
  - Intralobar
  description: >-
    That the intralobar lesion grows from an accessory lung bud, which is enveloped by normal lung
    and keeps its own systemic arterial supply. A 1986 single-hospital pathology series states it as
    the view generally held for the intralobar form and then proposes that most intralobar
    sequestrations are cystic adenomatoid malformations or developmentally normal lung supplied by a
    systemic artery; one case report suggests an accessory-lung origin for a bilateral intralobar
    lesion; and a fetal series judged the anomalous arteries consistent with an origin from the
    embryonic splanchnic plexus. No cached source demonstrates the bud, and none applies the account
    to the extralobar form.
  evidence:
  - reference: PMID:3737276
    reference_title: "Intralobar pulmonary sequestration (a nonentity?)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Intralobar pulmonary sequestration has generally been considered a congenital malformation in
      which an accessory lung bud develops, is enveloped by normal lung, and retains its systemic
      arterial supply.
    explanation: >-
      The account, in the words of a series that goes on to argue against it for most intralobar
      cases. Direct here, unlike on the node and its edge, because this group's claim is the account
      itself, which the sentence states; the node and edge claim that the bud exists and supplies
      the feeder, which it does not show.
  - reference: PMID:24144479
    reference_title: >-
      Bilateral intralobar sequestration of the lung with a bridging isthmus: pathologic and
      radiologic findings.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These features suggested that this bilateral ILS might have originated from an accessory lung
      tissue.
    explanation: >-
      One case read as possibly arising from accessory lung tissue; a suggestion, not a
      demonstration.
  - reference: PMID:3737276
    reference_title: "Intralobar pulmonary sequestration (a nonentity?)."
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that most intralobar sequestrations represent either cystic adenomatoid
      malformations that clinically are unrecognized until they become secondarily infected or
      developmentally normal lung supplied by a systemic artery.
    explanation: >-
      From 30 years of one hospital's specimens, the series' proposal that most intralobar
      sequestrations are either cystic adenomatoid malformations, noticed once infected, or
      developmentally normal lung with a systemic artery, rather than lung grown from an accessory
      bud. Indirect: a reassignment of the lesions, not a test of the bud.
- hypothesis_group_id: acquired_intralobar_origin
  hypothesis_label: The intralobar form as an acquired lesion
  status: ALTERNATIVE
  applies_to_subtypes:
  - Intralobar
  description: >-
    That intralobar sequestration is acquired rather than congenital. In that unqualified form it is
    contradicted: intralobar sequestration has been confirmed at postmortem in fetuses of 20 to 23
    weeks, and was present in newborns and young infants before recurrent infection developed. What
    survives is an acquired cause for some lesions, which a case of exsanguinating haemoptysis was
    read as strong evidence for; an adult surgical series, from shared symptoms, suggested that the
    adult lesion should be nosologically very similar to acquired lesions such as bronchiectasis. No
    cached source sets out the steps of an acquired origin, so no edge carries this group.
  evidence:
  - reference: PMID:9695620
    reference_title: >-
      Intralobar bronchopulmonary sequestration presenting as hemoptysis: evidence for an acquired
      cause.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case brings forth strong evidence supporting an acquired rather than a congenital cause of
      some intralobar sequestrations.
    explanation: >-
      A case report's own reading: evidence for an acquired cause of some intralobar sequestrations.
      Indirect for the group as stated: it supports an acquired cause of some lesions, not of the
      whole class.
  - reference: PMID:21362733
    reference_title: "Intralobar sequestration in adult patients."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests, for similar reasons, that ILS in adults should be nosologically very similar to
      acquired lesions, such as bronchectasis.
    explanation: >-
      In 14 of 26 adults haemoptysis or recurrent infection, symptoms that lead to a diagnosis of
      bronchiectasis, were present, which the authors take to suggest a likeness to acquired
      lesions. Indirect: a likeness in presentation, not a shown cause.
  - reference: PMID:14692645
    reference_title: >-
      Intralobar sequestration of the lung is a congenital anomaly: anatomopathological analysis of
      four cases diagnosed in fetal life.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe four cases in which anomalous arterial supply from the aorta to abnormally
      echogenic lower lung lobes was demonstrated on routine antenatal ultrasound examination, and
      the diagnosis of ILS was subsequently confirmed by postmortem examination including
      bronchography of the fetuses at between 20 and 23 wk.
    explanation: >-
      Intralobar sequestration confirmed at postmortem in four fetuses of 20 to 23 weeks: these
      lesions were present before birth.
  - reference: PMID:10201034
    reference_title: >-
      Intralobar bronchopulmonary sequestration in the newborn--a congenital malformation.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fact that ILS was present in seven newborn and young infants indicates that this lesion
      is, at least in some patients, a congenital malformation.
    explanation: >-
      Seven infants with the lesion, which the authors take to show it is congenital in at least
      some patients. It refutes an acquired origin for every case, not for some.
progression:
- phase: Prenatal course
  notes: >-
    Many lesions shrink or disappear before birth. In the cached fetal series the large lesions of
    four of fourteen fetuses regressed completely prior to birth, and the rest were resected
    electively after birth without morbidity or mortality - which is why a prenatally detected
    sequestration is not by itself an indication to intervene.
  evidence:
  - reference: PMID:10511360
    reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large lesions of four fetuses regressed completely prior to birth, and the lesions of the
      remaining ten fetuses were electively resected after birth without causing morbidity or
      mortality.
    explanation: The regression count and the outcome of the rest, with the series' own denominator.
  - reference: PMID:10511360
    reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary sequestrations are a subgroup of congenital lung lesions with a favorable outlook; many
      regress prenatally, and the persistent ones are resected safely postnatally.
    explanation: >-
      The authors' own conclusion, which generalises the regression beyond their four cases and is
      what this phase records.
histopathology:
- name: Hybrid sequestration and congenital pulmonary airway malformation
  description: >-
    A minority of lesions carry the histology of both entities, which is consistent with the shared
    developmental origin the bronchial-atresia hypothesis proposes. Three of fourteen fetuses in the
    cached fetal series had mixed lesions.
  evidence:
  - reference: PMID:10511360
    reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three fetuses had histologically mixed lesions (congenital cystic adenomatoid malformation and
      pulmonary sequestration).
    explanation: >-
      The count of hybrid lesions in the fetal series. It bears on the origin question as well as on
      the histology, since a shared histology is one of the observations the atresia hypothesis is
      built to explain.
imaging_findings:
- name: Prenatal echogenic lung mass with a systemic feeding artery
  modality: ULTRASOUND
  description: >-
    The lesion is usually found on obstetric ultrasound in the second trimester, though both cited
    series run past it - a mean of 23 weeks with a range to 31 in one, and a mean of 26 weeks with a
    range to 33 in the other. What makes the echogenic mass a sequestration rather than another
    echogenic lung lesion is the arterial supply: in the referral series that defines this cohort,
    all fourteen fetuses had masses drawing their blood from identifiable systemic arteries rather
    than from the pulmonary artery. Doppler is what shows that vessel, and it does not show it in
    every case - four of ten here. The row is marked not diagnostic because ultrasound raises the
    diagnosis and does not confirm it; the CT angiography row below carries the confirmation.
  diagnostic: false
  evidence:
  - reference: PMID:10511360
    reference_title: "Fetal pulmonary sequestration: a favorable congenital lung lesion."
    supports: SUPPORT

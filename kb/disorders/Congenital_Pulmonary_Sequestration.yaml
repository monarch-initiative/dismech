mechanistic_hypotheses:
- hypothesis_group_id: bronchial_atresia_origin
  hypothesis_label: Segmental bronchial atresia as the initiating lesion
  status: EMERGING
  description: >-
    That the disease begins with atresia or obstruction of a developing airway, which would place it
    on one developmental spectrum with congenital pulmonary airway malformation and congenital lobar
    emphysema, the resulting malformation being set by the level, degree and timing of the
    obstruction. The cached support is a prospective pathological series finding an atretic bronchus
    in every extralobar and most intralobar specimens, together with the authors' own suggestion that
    the entities may share an etiopathogenesis. It is EMERGING rather than CANONICAL because the
    evidence is cross-sectional: atresia found in resected tissue is consistent with being the cause
    and also with being a consequence, and no cached source demonstrates the sequence.
progression:
- phase: Prenatal course
  notes: >-
    Many lesions shrink or disappear before birth. In the cached fetal series the large lesions of
    four of fourteen fetuses regressed completely prior to birth, and the rest were resected
    electively after birth without morbidity or mortality - which is why a prenatally detected
    sequestration is not by itself an indication to intervene.
  evidence:
  - reference: PMID:10511360
    reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The large lesions of four fetuses regressed completely prior to birth, and the lesions of the
      remaining ten fetuses were electively resected after birth without causing morbidity or
      mortality.
    explanation: The regression count and the outcome of the rest, with the series' own denominator.
  - reference: PMID:10511360
    reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary sequestrations are a subgroup of congenital lung lesions with a favorable outlook; many
      regress prenatally, and the persistent ones are resected safely postnatally.
    explanation: >-
      The authors' own conclusion, which generalises the regression beyond their four cases and is
      what this phase records.
histopathology:

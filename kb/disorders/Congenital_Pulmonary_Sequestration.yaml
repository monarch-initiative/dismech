      chest drainage (P = 0.001).
    explanation: The comparison between approaches, with its p values.
  - reference: PMID:36635696
    reference_title: 'Pulmonary sequestration in adult patients: a single-center retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL

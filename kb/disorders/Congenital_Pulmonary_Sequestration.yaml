- name: Congenital diaphragmatic hernia
  disease_term:
    preferred_term: congenital diaphragmatic hernia
    term:
      id: MONDO:0005711
      label: congenital diaphragmatic hernia
  description: >-
    Diaphragmatic hernia is one of the entities a prenatal series of echogenic fetal chest lesions
    lists in its own differential, alongside cystic adenomatoid malformation and sequestrated lung.
    That series could not separate hernia from cystic adenomatoid malformation in three of seventeen
    fetuses, and one of those three proved after delivery to be a sequestration. The two differ
    sharply in outcome, so the distinction carries the prenatal counselling.
  distinguishing_features:
  - >-
      The entities are not reliably separable on the echogenic appearance alone - prenatal diagnosis
      was wrong or uncertain in four of seventeen fetuses in this series.
  - >-
      Outcome diverges - every infant with a sequestrated lung in this series was well and none
      required surgery, while of the ten fetuses with diaphragmatic hernia two pregnancies were
      terminated, one died in utero, five died as neonates and two survived after surgery.
  evidence:
  - reference: PMID:7644306
    reference_title: "Fetal echogenic lung lesions: prenatal ultrasound diagnosis and outcome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The differential diagnosis of echogenic areas in the fetal chest include congenital
      diaphragmatic hernia (CDH), cystic adenomatoid malformation (CAM), sequestrated lung and
      tracheal or bronchial atresia.
    explanation: >-
      States the prenatal differential this row records, with sequestration and diaphragmatic hernia
      in it. BACKGROUND because it opens the abstract and is immediately followed by the study's
      statement of purpose, so the paper is restating an established differential rather than
      reporting one.
  - reference: PMID:7644306
    reference_title: "Fetal echogenic lung lesions: prenatal ultrasound diagnosis and outcome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In three fetuses CDH and CAM could not be differentiated. After delivery two of these had CDH
      and one had sequestrated lung.
    explanation: >-
      A sequestration misread prenatally as one of the other two entities, which is the failure this
      differential exists to prevent.
  - reference: PMID:7644306

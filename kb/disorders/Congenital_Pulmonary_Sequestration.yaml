      report and literature review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Surgical resection is the gold standard treatment for PS.
    explanation: The standard, stated as such.
  - reference: PMID:36635696

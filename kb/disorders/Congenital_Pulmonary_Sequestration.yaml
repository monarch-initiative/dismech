    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On prenatal ultrasonography subdiaphragmatic extralobar pulmonary sequestration usually is
      echogenic, is left-sided, and can be identified in the second trimester. Neuroblastoma is most
      often cystic, right-sided, and identified in the third trimester.
    explanation: >-
      The three prenatal ultrasound features this row lists as distinguishing. REVIEW_SYNTHESIS
      because the paper assembled them from reported cases rather than from a cohort of its own.
  - reference: PMID:35796300

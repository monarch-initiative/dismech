name: Congenital Pulmonary Sequestration
creation_date: '2026-11-11T19:30:00Z'
categories:
- Congenital Lung Malformation
- Pediatric Respiratory Disorder
parents:
- congenital lung malformation
disease_term:
  preferred_term: congenital pulmonary sequestration
  term:
    id: MONDO:0017843
    label: congenital pulmonary sequestration
description: >-
  A congenital lung malformation in which a segment of dysplastic lung tissue has no communication with
  the tracheobronchial tree and takes its blood supply from a systemic artery rather than from the pulmonary
  circulation. The tissue is non-functional. It comes in two forms that differ in pleural investment and
  in venous drainage, and the two present differently: the extralobar form, with its own pleura and systemic
  venous return, is the minority and presents early; the intralobar form, inside the pleura of a normal
  lobe and draining to the pulmonary veins, is the majority and often presents in adulthood with recurrent
  infection.
synonyms:
- bronchopulmonary sequestration
- pulmonary sequestration
- BPS
- PS
pathophysiology:
- name: Anomalous Systemic Arterial Supply
  description: >-
    The defining vascular lesion. The sequestered tissue is perfused by a systemic artery, most often
    from the thoracic aorta and next most often from the abdominal aorta, instead of from the pulmonary
    artery. No bronchial artery supplies it.
  biological_scale: TISSUE
  locations:
  - preferred_term: thoracic aorta
    term:
      id: UBERON:0001515
      label: thoracic aorta
  - preferred_term: abdominal aorta
    term:
      id: UBERON:0001516
      label: abdominal aorta
  downstream:
  - target: Non-functioning Dysplastic Lung Tissue
    description: Systemic perfusion of tissue that is not ventilated leaves it unable to exchange gas.
    evidence:
    - reference: PMID:30335347
      reference_title: Pulmonary Sequestration.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestration is a condition in which a segment or lobe of dysplastic lung tissue exists
        with no communication with the rest of the tracheobronchial tree and receives an anomalous systemic
        vascular supply, separate from the rest of the lung. It is, therefore, a nonfunctional tissue.
      explanation: The definition and its functional consequence in one sentence.
  - target: Hemodynamic Load from the Aberrant Systemic Feeder
    description: >-
      The aberrant feeder carries systemic arterial flow through tissue that does no gas exchange and
      returns it directly to the heart, which in a large lesion is a volume load on the circulation.
    evidence:
    - reference: PMID:37508694
      reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
        Experience.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Fifty-three (74.7%) patients underwent embolization of the PS feeding vessel using microcoils
        and/or vascular plugs, and eight (15.1%) of these were neonates who presented with severe PAH
        and cardiac failure.
      explanation: >-
        That neonates with large lesions presented with severe pulmonary hypertension and cardiac failure
        and that the feeding vessel was what was closed, which is the clearest cached evidence that the
        feeder carries a load. Indirect for the edge: the sentence describes the treatment and its
        indication rather than the haemodynamics, and the improvement after closure is a separate
        sentence, quoted on the target node.
  evidence:
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchopulmonary sequestration is an uncommon pulmonary disorder characterized by an area of non-functioning
      abnormal lung tissue, which receives its blood supply from a systemic artery and characteristically
      has no connection with the tracheobronchial tree.
    explanation: >-
      All three defining features - non-functioning tissue, systemic supply, no bronchial connection -
      in the one sentence.
  - reference: PMID:21459605
    reference_title: 'Pulmonary sequestration: a retrospective analysis of 2625 cases in China.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The arterial supply was mainly provided by branches of thoracic aorta (76.55%) and abdominal aorta
      (18.47%).
    explanation: Where the feeder comes from, across 2,625 reported cases.
  - reference: PMID:442005
    reference_title: 'Lung sequestration: report of seven cases and review of 540 published cases.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequestrations are not supplied by a bronchial artery.
    explanation: A negative anatomical fact that distinguishes the lesion from a bronchial-artery anomaly.
- name: Absent Communication with the Tracheobronchial Tree
  description: The second half of the definition. The segment is not ventilated, because no airway reaches
    it.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Non-functioning Dysplastic Lung Tissue
    description: Tissue that is not ventilated cannot exchange gas however well it is perfused.
    evidence:
    - reference: PMID:39837960
      reference_title: >-
        Analysis of pulmonary sequestration cases, based on the 11-year birth defects surveillance data
        of Changsha hospitals.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestration (PS) is a rare congenital malformation that is characterized by the absence
        of a connection between a portion of the lung tissue and the tracheobronchial tree, with blood
        supply from arteries throughout the body. Abnormal lung tissue cannot perform the normal gas
        exchange function.
      explanation: States the absent connection and the loss of gas exchange together.
  evidence:
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchopulmonary sequestration is an uncommon pulmonary disorder characterized by an area of non-functioning
      abnormal lung tissue, which receives its blood supply from a systemic artery and characteristically
      has no connection with the tracheobronchial tree.
    explanation: The same definitional sentence, for the airway half.
- name: Non-functioning Dysplastic Lung Tissue
  description: >-
    The lesion itself: dysplastic lung that neither ventilates nor exchanges gas. It is the substrate
    for everything downstream.
  biological_scale: TISSUE
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Recurrent Infection of the Sequestered Segment
    description: >-
      The cached literature names the loss of gas exchange as the reason the segment becomes infected.
    evidence:
    - reference: PMID:41586995
      reference_title: >-
        Preoperative embolization of dual arterial supply in extralobar pulmonary sequestration: a case
        report and literature review.
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This anatomic malformation increases patients' risk of recurrent infection due to the lack of
        robust gas exchange.
      explanation: The one cached sentence that states the causal step from the anatomy to the infection
        risk.
  evidence:
  - reference: PMID:30335347
    reference_title: Pulmonary Sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary sequestration is a condition in which a segment or lobe of dysplastic lung tissue exists
      with no communication with the rest of the tracheobronchial tree and receives an anomalous systemic
      vascular supply, separate from the rest of the lung. It is, therefore, a nonfunctional tissue.
    explanation: That the tissue is non-functional, stated as a consequence of the two defining features.
- name: Recurrent Infection of the Sequestered Segment
  description: >-
    The commonest route to presentation. A 25-patient adult series found symptomatic cases at higher
    risk of surgical complications than asymptomatic ones, which is an argument for operating before
    infection supervenes rather than a study of pre-symptomatic resection.
  biological_scale: TISSUE
  downstream:
  - target: Recurrent pneumonia
    description: The infection presents as repeated pneumonia in the same territory.
    evidence:
    - reference: PMID:31886079
      reference_title: 'Pulmonary Sequestration: An Unusual Cause for Massive Hemoptysis in an Adult Woman.'
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestration leads to recurrent episodes of pneumonia, frequent hospital admissions,
        and, very rarely, fatal hemoptysis.
      explanation: >-
        Names recurrent pneumonia first among the consequences, with the rarity qualifier the source puts
        on fatal haemoptysis.
  - target: Hemoptysis
    description: Bleeding from the systemically perfused segment, rarely fatal.
    evidence:
    - reference: PMID:31886079
      reference_title: 'Pulmonary Sequestration: An Unusual Cause for Massive Hemoptysis in an Adult Woman.'
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestration leads to recurrent episodes of pneumonia, frequent hospital admissions,
        and, very rarely, fatal hemoptysis.
      explanation: The same sentence names haemoptysis and marks it very rare in its fatal form.
  evidence:
  - reference: PMID:28449484
    reference_title: Clinical presentation and characteristics of 25 adult cases of pulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In most cases there were surgical and histological signs of infection, only in 9 cases etiological
      factor was determined: in 5 cases it was A. fumigatus.
    explanation: >-
      What was found in resected lesions, and that a fungus was the commonest identified organism where
      one was identified at all.
  - reference: PMID:28449484
    reference_title: Clinical presentation and characteristics of 25 adult cases of pulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptomatic cases were at higher than expected risk of surgical complications, comparing to asymptomatic
      (chi2, P=0.04).
    explanation: Why the timing of resection matters.
- name: Hemodynamic Load from the Aberrant Systemic Feeder
  description: >-
    The load the aberrant feeder places on the circulation. Neonates with large lesions are severely
    symptomatic and improve after the feeder is closed, and high-output cardiac failure is recognised
    often enough to be listed among the contraindications to surgery in a paediatric embolisation
    cohort. Which side of the heart takes that load differs between the two forms, so the entry does
    not state a shunt direction for the disease: the intralobar majority drains to the pulmonary veins
    and so returns to the left atrium, while the extralobar minority drains to the systemic veins. No
    cached source names a direction, and the subtype rows carry the drainage figures.
  biological_scale: ORGANISM
  downstream:
  - target: Pulmonary arterial hypertension
    description: The recirculating volume load raises pulmonary arterial pressure.
    evidence:
    - reference: PMID:37508694
      reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
        Experience.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: Forty-two (59%) patients had pulmonary arterial hypertension (PAH) at the time of diagnosis.
      explanation: >-
        How often pulmonary hypertension was present at diagnosis in a paediatric catheterisation cohort.
        Read with the caveat in notes: 86 per cent of that cohort had congenital heart defects, so the
        figure is not attributable to the sequestration alone.
  evidence:
  - reference: PMID:37508694
    reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
      Experience.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Neonates with large PSs are severely symptomatic and improve remarkably after PS closure.
    explanation: >-
      The authors' own conclusion. Indirect for this node because the sentence reports symptoms and
      their reversal on closure rather than any haemodynamic measurement; the load is the inference
      from it.
  - reference: DOI:10.3390/children13060842
    reference_title: >-
      Endovascular Embolization of Pulmonary Sequestration in Children with Contraindications to Surgery:
      A Two-Centre Experience with Long-Term Follow-Up
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contraindications to surgery were severe pulmonary arterial hypertension, high-output cardiac
      failure, low body weight with comorbidity, complex extralobar anatomy or refused parental consent.
    explanation: >-
      The only cached source that names high-output cardiac failure in this disease, which is what
      supports that clause in the node description. Indirect because the sentence lists the cohort's
      contraindications rather than measuring the load.
- name: Tension Hydrothorax in the Fetus
  subtypes:
  - Extralobar
  description: >-
    The fetal route to hydrops, and the one the cached literature says is the only one: a sequestration
    causes hydrops through a tension hydrothorax, which can be drained before birth. Hydrops was confined
    to extralobar lesions in the larger cached fetal series.
  biological_scale: ORGANISM
  downstream:
  - target: Hydrops fetalis
    description: The tension hydrothorax, not the mass itself, is what produces the hydrops.
    evidence:
    - reference: PMID:10511360
      reference_title: 'Fetal pulmonary sequestration: a favorable congenital lung lesion.'
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary sequestrations cause hydrops only because of a tension hydrothorax, which can be drained
        prenatally, if necessary.
      explanation: The mechanism, stated with the authors' own exclusive - only because of.
  evidence:
  - reference: PMID:29229484
    reference_title: >-
      Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight fetuses developed hydrothorax, four of which (all extralobar BPSs) also developed hydrops.
    explanation: The frequency, and that every hydropic fetus in that series had an extralobar lesion.
has_subtypes:
- name: Intralobar
  display_name: Intralobar sequestration (ILS)
  subtype_term:
    preferred_term: intralobar congenital pulmonary sequestration
    term:
      id: MONDO:0017245
      label: intralobar congenital pulmonary sequestration
  description: >-
    The majority form - 84 per cent of 2,625 reported cases, and 91 per cent of a 97-patient adult series.
    It lies inside the visceral pleura of a normal lobe and drains to the pulmonary veins. Approximately
    two-thirds sit in the posterior basal segment of the left lower lobe. It presents later than the extralobar form,
    which is why the subtype ratio shifts towards it with age, and it is the form that presents with recurrent
    infection in adults.
  evidence:
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The abnormal lung tissue is located within the visceral pleura of a pulmonary lobe in the intralobar
      variety, whereas the extralobar form has its own visceral pleura.
    explanation: The pleural distinction, both forms in one sentence.
  - reference: PMID:19453525
    reference_title: Imaging in bronchopulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The venous drainage of the extralobar type is usually into the systemic veins, whereas the intralobar
      type drains into the pulmonary veins.
    explanation: >-
      The venous distinction, both forms in one sentence, with the source's own usually on the extralobar
      side.
  - reference: PMID:40364049
    reference_title: >-
      Predictive Role of Venous Drainage and Lesion Margins in Bronchopulmonary Sequestration Classification.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VD is significantly different between ILS and ELS: 96% of ILS drain into the pulmonary system while
      83% of ELS drain into a systemic vein (p < 0.00001).
    explanation: The venous rule quantified in 36 surgical patients, with its p value.
  - reference: PMID:21459605
    reference_title: 'Pulmonary sequestration: a retrospective analysis of 2625 cases in China.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary sequestrations were divided into two types, intralobar sequestration (83.95%) and extralobar
      sequestration (16.05%).
    explanation: The relative frequency of the two forms across 2,625 reported cases.
  - reference: PMID:30335347
    reference_title: Pulmonary Sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately two-thirds of intralobar sequestrations are found in the posterior basal segment of
      the left lower lobe.
    explanation: Where this form sits.
  - reference: PMID:21459605
    reference_title: 'Pulmonary sequestration: a retrospective analysis of 2625 cases in China.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comparison between pediatric and adult patients indicated that the subtype ratio (intralobar/extralobar)
      was higher in the adult group than that in the pediatric group (P < 0.001).
    explanation: >-
      That the ratio between the two forms shifts with age, which is the quantified basis for saying this
      form presents later.
  - reference: PMID:36635696
    reference_title: 'Pulmonary sequestration in adult patients: a single-center retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Intralobar and extralobar PS accounted for 90.7% and 9.3% of the patients, respectively.
    explanation: >-
      The adult-series split this row's 91 per cent comes from, in the 97-patient cohort named in the
      same abstract.
- name: Extralobar
  display_name: Extralobar sequestration (ELS)
  subtype_term:
    preferred_term: extralobar congenital pulmonary sequestration
    term:
      id: MONDO:0017246
      label: extralobar congenital pulmonary sequestration
  description: >-
    The minority form - 16 per cent of the same 2,625 cases. It has its own visceral pleura and drains
    to the systemic veins, usually the azygos or hemiazygos system. More than three-quarters sit between
    the diaphragm and the lower lobe. It presents earlier than the intralobar form, and it was the only
    one in which hydrops occurred in the larger cached fetal series - though that series contained 44
    intralobar lesions as well, so prenatal presentation is not confined to this form. It is also the
    form reported to torse.
  evidence:
  - reference: PMID:30335347
    reference_title: Pulmonary Sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extralobar sequestration has a separate visceral pleura and venous drainage. Venous drainage is
      into the systemic veins, frequently the lower lobe vein, azygos vein, or hemiazygos vein.
    explanation: The pleura, the venous drainage, and the veins this form drains into.
  - reference: PMID:442005
    reference_title: 'Lung sequestration: report of seven cases and review of 540 published cases.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Of the 133 extralobar sequestrations, 77·4% were located between diaphragm and lower lobe.
    explanation: Where this form sits, quantified in the classic 540-case series.
  - reference: PMID:29229484
    reference_title: >-
      Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight fetuses developed hydrothorax, four of which (all extralobar BPSs) also developed hydrops.
    explanation: That hydrops was confined to this form in the 103-fetus series.
  - reference: PMID:40674965
    reference_title: >-
      Extralobar pulmonary sequestration presenting with torsion in an elderly patient: A case report.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Extralobar pulmonary sequestration with torsion is rare in adults.
    explanation: >-
      The source for the torsion clause in this row's description. Torsion is reported for this form,
      which has its own pleura and a pedicle, and the authors call it rare in adults.
phenotypes:
- name: Recurrent pneumonia
  category: Respiratory
  description: >-
    Repeated infection in the same territory. The 2,625-case series names it among the features that
    point to the diagnosis, alongside early onset, a lower-lobe lesion and an aberrant feeding artery.
  phenotype_term:
    preferred_term: recurrent pneumonia
    term:
      id: HP:0006532
      label: Recurrent pneumonia
  evidence:
  - reference: PMID:21459605
    reference_title: 'Pulmonary sequestration: a retrospective analysis of 2625 cases in China.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A certain early-onset age, recurrent pneumonias, mass or cyst lesion located in the lower lobe,
      and aberrant arterial supply are indicators for the diagnosis.
    explanation: >-
      The authors' own conclusion, which names recurrent pneumonia as a diagnostic indicator. The same
      paper's symptom list across 2,625 cases - cough, sputum, fever, haemoptysis, chest pain, 13.36 per
      cent asymptomatic - does not name pneumonia, so it is not quoted here.
- name: Hemoptysis
  category: Respiratory
  subtype: Intralobar
  description: >-
    Bleeding from the systemically perfused segment. Reported as massive in the cached adult case, and
    rarely fatal.
  phenotype_term:
    preferred_term: hemoptysis
    term:
      id: HP:0002105
      label: Hemoptysis
  evidence:
  - reference: PMID:31886079
    reference_title: 'Pulmonary Sequestration: An Unusual Cause for Massive Hemoptysis in an Adult Woman.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case of a 34-year-old woman with intralobar sequestration whose symptoms manifested
      in adulthood as occasional hemoptysis for two months followed by one episode of massive hemoptysis.
    explanation: A documented massive-haemoptysis presentation, with the form named.
- name: Pulmonary arterial hypertension
  category: Cardiovascular
  description: >-
    Present at diagnosis in 59 per cent of a paediatric catheterisation cohort, though 86 per cent of
    that cohort also had a congenital heart defect.
  phenotype_term:
    preferred_term: pulmonary arterial hypertension
    term:
      id: HP:0002092
      label: Pulmonary arterial hypertension
  evidence:
  - reference: PMID:37508694
    reference_title: Transcatheter Management of Pulmonary Sequestrations in Children-A Single-Center
      Experience.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Forty-two (59%) patients had pulmonary arterial hypertension (PAH) at the time of diagnosis.
    explanation: The frequency, in the cohort that measured it directly.
  notes: >-
    The denominator is a catheterisation-referred cohort in which 86 per cent had congenital heart defects,
    so this is not a population frequency and the figure is not attributable to the sequestration alone.
- name: Hydrops fetalis
  category: Prenatal
  subtype: Extralobar
  description: >-
    Occurs through a tension hydrothorax rather than through the mass itself, and in the larger cached
    fetal series only in extralobar lesions.
  phenotype_term:
    preferred_term: hydrops fetalis
    term:
      id: HP:0001789
      label: Hydrops fetalis
  evidence:
  - reference: PMID:29229484
    reference_title: >-
      Prenatal growth characteristics and pre/postnatal management of bronchopulmonary sequestrations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight fetuses developed hydrothorax, four of which (all extralobar BPSs) also developed hydrops.
    explanation: The frequency and the restriction to extralobar lesions.
diagnosis:
- name: Computed tomography angiography
  description: >-
    The test that makes the diagnosis, because it shows the feeding vessel. One 43-patient single-centre
    series reports promising results from using it, rather than digital subtraction angiography, as the
    only diagnostic and pretreatment planning tool, and used it to decide between embolisation, resection
    and observation.
  diagnosis_term:
    preferred_term: computed tomography angiography
    term:
      id: NCIT:C202408
      label: Computed Tomography Angiography
  evidence:
  - reference: PMID:22956521
    reference_title: >-
      The clinical value of computer tomographic angiography for the diagnosis and therapeutic planning
      of patients with pulmonary sequestration.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnostic performance of CT angiography for pulmonary sequestration in the patient-based evaluation
      yielded an accuracy of 97.7%, sensitivity of 97.3%, specificity of 100%, positive predictive value
      (PPV) of 100% and negative predictive value (NPV) of 85.7%.
    explanation: Its performance on a patient basis.
  - reference: PMID:22956521
    reference_title: >-
      The clinical value of computer tomographic angiography for the diagnosis and therapeutic planning
      of patients with pulmonary sequestration.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For each patient, CT angiography was used to determine whether the pulmonary sequestration was suitable
      for coil embolization, surgical resection or conservative treatment.
    explanation: That the same study used it to choose between the three management options.
treatments:
- name: Surgical resection
  description: >-
    The standard treatment. In a 97-patient adult series minimally invasive surgery beat open thoracotomy
    on blood loss, drainage volume, hospital days and drainage duration, with no perioperative mortality
    and complications in 4 per cent.
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:41586995
    reference_title: >-
      Preoperative embolization of dual arterial supply in extralobar pulmonary sequestration: a case
      report and literature review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: Surgical resection is the gold standard treatment for PS.

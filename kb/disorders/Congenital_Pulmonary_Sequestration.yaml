- name: Neuroblastoma
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma
  description: >-
    For the subdiaphragmatic extralobar form the differential is not a lung lesion at all. A
    suprarenal mass found on prenatal ultrasound is often presumed to be neuroblastoma and removed
    after birth, and extralobar sequestration in that position is reported often enough that a
    literature review put it at one case for every two and a half neuroblastomas. The two differ on
    echotexture, side and trimester of detection, and urinary catecholamines are normal in
    sequestration.
  distinguishing_features:
  - Subdiaphragmatic extralobar sequestration is usually echogenic, left-sided and seen in the
    second trimester; neuroblastoma is most often cystic, right-sided and seen in the third.
  - Normal urinary catecholamines point away from neuroblastoma.
  evidence:

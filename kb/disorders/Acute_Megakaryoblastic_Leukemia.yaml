name: Acute Megakaryoblastic Leukemia
creation_date: "2026-05-08T12:00:00Z"
description: >-
  Acute megakaryoblastic leukemia (AMKL, historically FAB M7) is an acute
  myeloid leukemia defined by megakaryocytic differentiation of the blasts.
  The disease occurs in three clinically and biologically distinct settings:
  children with Down syndrome, children without Down syndrome, and adults.
  Down syndrome-associated disease follows a multistep sequence involving
  constitutional trisomy 21, a GATA1 truncating mutation that produces GATA1s,
  transient abnormal myelopoiesis, and additional somatic lesions. Pediatric
  non-Down syndrome AMKL instead comprises recurrent molecular subgroups,
  including RBM15::MRTFA, CBFA2T3::GLIS2, NUP98::KDM5A, KMT2A, diverse HOX
  rearrangements, and a GATA1-mutant subgroup usually carrying acquired gain of
  chromosome 21. Adult AMKL has a different, adverse genomic landscape and
  poor treatment response. Diagnosis requires morphology together with
  immunophenotypic evidence of megakaryocytic differentiation.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Rare Disease
parents:
- acute myeloid leukemia
disease_term:
  preferred_term: acute megakaryoblastic leukemia
  term:
    id: MONDO:0018872
    label: acute megakaryoblastic leukemia
has_subtypes:
- name: Down Syndrome-Associated AMKL
  display_name: Acute Megakaryoblastic Leukemia in Down Syndrome
  description: >-
    The megakaryoblastic leukemia phenotype arising in young children with Down
    syndrome. Acquired GATA1s-generating mutations are highly recurrent. This is
    represented within the broader ML-DS clinical category, whose published
    treatment cohorts are not always stratified by megakaryoblastic morphology.
    TAM is a distinct neonatal precursor condition rather than overt AMKL.
  subtype_term:
    preferred_term: acute megakaryoblastic leukemia in down syndrome
    term:
      id: MONDO:0020526
      label: acute megakaryoblastic leukemia in down syndrome
  evidence:
  - reference: PMID:12172547
    reference_title: Acquired mutations in GATA1 in the megakaryoblastic leukemia of Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      leukemic cells from every individual with DS-AMKL that we examined contain
      mutations in GATA1
    explanation: >-
      This directly supports the DS-AMKL phenotype and its recurrent acquired
      GATA1 mutation.
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myeloid proliferations associated with Down syndrome, typically associated
      with somatic exon 2 or 3 GATA1 mutation, continue to encompass two clonal
      conditions that arise in children with constitutional trisomy 21:
      transient abnormal myelopoiesis (TAM), which is conﬁned to the ﬁrst 6
      months of life and myeloid leukaemia of Down syndrome (ML-DS).
    explanation: >-
      WHO separates neonatal TAM from ML-DS while placing both in the
      trisomy-21/GATA1 disease spectrum.
- name: Non-Down Syndrome AMKL
  display_name: Acute Megakaryoblastic Leukemia Without Down Syndrome
  description: >-
    AMKL without constitutional Down syndrome. This age-spanning umbrella
    includes pediatric non-Down-syndrome AMKL and adult AMKL, which have
    different genomic architectures and treatment outcomes.
  subtype_term:
    preferred_term: acute megakaryoblastic leukemia without down syndrome
    term:
      id: MONDO:0018004
      label: acute megakaryoblastic leukemia without down syndrome
  children:
  - Pediatric Non-Down Syndrome AMKL
  - Adult AMKL
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      which arises within three clinical groups: children with Down syndrome,
      children without Down syndrome, and adults.
    explanation: >-
      WHO distinguishes children without Down syndrome from adults while both
      remain within the broader non-Down-syndrome umbrella.
- name: Pediatric Non-Down Syndrome AMKL
  display_name: Pediatric Acute Megakaryoblastic Leukemia Without Down Syndrome
  description: >-
    Pediatric AMKL without constitutional Down syndrome. It is composed of
    recurrent, usually mutually exclusive molecular subgroups with different
    outcomes. These are molecular subgroups among AML cases with
    megakaryoblastic differentiation and are not all formal WHO disease classes.
    No exact pediatric-umbrella ontology class is bound here.
  children:
  - RBM15::MRTFA-Rearranged AMKL
  - CBFA2T3::GLIS2-Positive AMKL
  - NUP98::KDM5A-Positive AMKL
  - KMT2A-Rearranged AMKL
  - HOX-Rearranged AMKL
  - GATA1-Mutant Non-Down Syndrome AMKL
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that pediatric non-DS-AMKL is a heterogeneous malignancy
      that can be divided into seven subgroups with varying outcomes.
    explanation: >-
      Genomic profiling establishes pediatric non-DS AMKL as a collection of
      distinct molecular subgroups.
- name: RBM15::MRTFA-Rearranged AMKL
  display_name: Infant AMKL with t(1;22) RBM15::MRTFA
  description: >-
    An infant-predominant non-DS AMKL subgroup defined by
    t(1;22)(p13;q13), which creates the RBM15::MRTFA fusion (historically
    RBM15-MKL1 or OTT-MAL).
  subtype_term:
    preferred_term: megakaryoblastic acute myeloid leukemia with t(1;22)(p13;q13)
    term:
      id: MONDO:0018436
      label: megakaryoblastic acute myeloid leukemia with t(1;22)(p13;q13)
  evidence:
  - reference: PMID:11431691
    reference_title: "Fusion of two novel genes, RBM15 and MKL1, in the t(1;22)(p13;q13) of acute megakaryoblastic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show this chromosomal rearrangement to result in the fusion of two
      novel genes, RNA-binding motif protein-15 (RBM15), an RNA recognition
      motif-encoding gene with homology to Drosophila spen, and Megakaryoblastic
      Leukemia-1 (MKL1)
    explanation: >-
      The original molecular report identifies the two partners created by
      t(1;22).
- name: CBFA2T3::GLIS2-Positive AMKL
  description: >-
    A high-risk pediatric non-DS AMKL subgroup with a cryptic chromosome 16
    inversion. The same fusion also occurs in AML with other morphologies, so
    the broader CBFA2T3::GLIS2-positive AML ontology class is not used as an
    exact AMKL subtype binding here.
  evidence:
  - reference: PMID:31719049
    reference_title: "Comprehensive Transcriptome Profiling of Cryptic CBFA2T3-GLIS2 Fusion-Positive AML Defines Novel Therapeutic Options: A COG and TARGET Pediatric AML Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the presence of this fusion was highly associated with adverse outcome
      (P < 0.001) across all morphologic classifications.
    explanation: >-
      The fusion is prognostically adverse but is not restricted to
      megakaryoblastic morphology.
- name: NUP98::KDM5A-Positive AMKL
  description: >-
    A recurrent pediatric non-DS molecular subgroup defined by the NUP98::KDM5A
    fusion. Cohort estimates trend toward adverse outcome, but small numbers
    preclude treating that effect as independently established. Depending on the
    classification framework, a fusion-defined AML category may take precedence
    while megakaryoblastic differentiation remains clinically relevant.
  subtype_term:
    preferred_term: childhood acute megakaryoblastic leukemia with NUP98-KDM5A
    term:
      id: NCIT:C132111
      label: Childhood Acute Megakaryoblastic Leukemia with NUP98-KDM5A
  evidence:
  - reference: PMID:31698461
    reference_title: Human models of NUP98-KDM5A megakaryocytic leukemia in mice contribute to uncovering new biomarkers and therapeutic vulnerabilities.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recurrent and mutually exclusive chimeric fusion oncogenes have been
      detected in 60% to 70% of cases and include nucleoporin 98 (NUP98) gene
      rearrangements, most commonly NUP98-KDM5A.
    explanation: >-
      This identifies NUP98::KDM5A as the predominant NUP98 rearrangement in
      pediatric AMKL.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUP98-KDM5A cases also demonstrated a trend towards poor outcomes, however
      due to small numbers this failed to reach statistical significance.
    explanation: >-
      This supports an adverse trend while preserving the cohort's statistical
      uncertainty.
- name: KMT2A-Rearranged AMKL
  description: >-
    A mutually exclusive founding genomic subgroup among pediatric non-DS AML
    cases with megakaryoblastic differentiation. KMT2A-rearranged AML can be a
    genetically defined AML category rather than a formal AMKL child class. The
    subgroup is associated with a HOX transcriptional program and adverse outcome.
  evidence:
  - reference: PMID:27114462
    reference_title: "Recurrent abnormalities can be used for risk group stratification in pediatric AMKL: a retrospective intergroup study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUP98/KDM5A and KMT2A rearrangements, in 9% each; and monosomy 7, in
      6%. These aberrations were mutually exclusive.
    explanation: >-
      This supports KMT2A rearrangement as a mutually exclusive defining
      subgroup rather than a generic cooperating lesion.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, CBFA2T3-GLIS2 and KMT2Ar were found to have significantly
      inferior pEFS and pOS.
    explanation: >-
      This directly supports the adverse outcome association in the genomic
      cohort.
  - reference: PMID:23045605
    reference_title: Characterization of novel genomic alterations and therapeutic approaches using acute megakaryoblastic leukemia xenograft models.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One subgroup of patients presented with MLL or NUP98 fusion genes leading
      to up-regulation of the HOX A cluster genes.
    explanation: >-
      Patient expression data support the KMT2A/MLL-associated HOXA program.
- name: HOX-Rearranged AMKL
  description: >-
    A pediatric non-DS molecular subgroup among AML cases with megakaryoblastic
    differentiation, with diverse rearrangements involving HOX loci, a shared
    HOX expression program, and enrichment for activating MPL mutations.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, fusions involving a HOX cluster gene (HOXr) occurred in 14%
      of patients within this cohort
    explanation: >-
      This defines and quantifies the HOX-rearranged subgroup in the reported
      pediatric cohort.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HOXr cases were found to be significantly enriched in activating MPL mutations
    explanation: >-
      This directly supports the subgroup's recurrent MPL association.
- name: GATA1-Mutant Non-Down Syndrome AMKL
  description: >-
    A distinct pediatric molecular subgroup without clinical Down syndrome or
    full constitutional trisomy 21, in which somatic GATA1 truncation usually
    co-occurs with acquired amplification of chromosome 21 material and produces
    a Down syndrome-like expression signature. Rare mosaic trisomy 21 must be
    specifically assessed rather than assumed absent from phenotype alone.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine of ten GATA1 mutant cases had amplifications in the DSCR
    explanation: >-
      This directly corrects the older claim that GATA1 mutation is absent from
      non-DS AMKL.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had non-hematopoietic tissue available for analysis and was
      found to be germline mosaic for trisomy 21
    explanation: >-
      This documents the mosaic-trisomy exception and the need for appropriate
      constitutional testing.
- name: Adult AMKL
  display_name: Acute Megakaryoblastic Leukemia in Adults
  description: >-
    Adult AMKL is uncommon and biologically distinct from pediatric disease.
    Recurrent pediatric fusion subgroups are generally absent; adult cohorts
    instead show adverse cytogenetics and recurrent alterations in genes such
    as TET2, TP53, JAK2, PTPN11, and RUNX1.
  subtype_term:
    preferred_term: acute megakaryoblastic leukemia in adult
    term:
      id: MONDO:0971091
      label: acute megakaryoblastic leukemia in adult
  evidence:
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most frequently, mutations occurred in TET2 (23%), TP53 (23%), JAK2 (19%),
      PTPN11 (19%) and RUNX1 (15%).
    explanation: >-
      A dedicated adult cohort establishes a genomic profile distinct from the
      recurrent pediatric fusions.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, in the adult cohort (n=24) which lacked recurrent fusion genes
    explanation: >-
      This direct pediatric-adult comparison supports the stated absence of
      recurrent pediatric fusion groups in that adult cohort.
mechanistic_hypotheses:
- hypothesis_group_id: ml_ds_multistep_leukemogenesis
  hypothesis_label: Multistep Leukemogenesis in Down Syndrome
  status: CANONICAL
  applies_to_subtypes:
  - Down Syndrome-Associated AMKL
  description: >-
    Trisomy 21 and a GATA1s-generating mutation establish the TAM clone;
    additional somatic lesions are implicated in progression to overt ML-DS.
  evidence:
  - reference: PMID:35203280
    reference_title: Modeling Down Syndrome Myeloid Leukemia by Sequential Introduction of GATA1 and STAG2 Mutations in Induced Pluripotent Stem Cells with Trisomy 21.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GATA1s, together with trisomy 21, is sufficient to develop a pre-leukemic
      condition called transient abnormal myelopoiesis (TAM).
    explanation: >-
      This is background synthesis in the model paper, not a result of the iPSC
      experiment itself.
  - reference: PMID:21849481
    reference_title: "Natural history of transient myeloproliferative disorder clinically diagnosed in Down syndrome neonates: a report from the Children's Oncology Group Study A2971."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among all, AML subsequently occurred in 16% at a median of 441 days
    explanation: >-
      Prospective natural history shows that only a subset of TAM cases later
      develop leukemia.
  - reference: PMID:35203280
    reference_title: Modeling Down Syndrome Myeloid Leukemia by Sequential Introduction of GATA1 and STAG2 Mutations in Induced Pluripotent Stem Cells with Trisomy 21.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Hematopoietic differentiation of GATA1&nbsp;STAG2 double-mutant iPSC lines
      confirmed GATA1s expression and the loss of functional STAG2 protein,
      leading to enhanced production of immature megakaryocytic population
      compared to GATA1 mutant alone.
    explanation: >-
      This models one cooperating lesion that intensifies an immature
      megakaryocytic phenotype without proving overt leukemic conversion.
- hypothesis_group_id: pediatric_non_ds_genomic_subgroups
  hypothesis_label: Fusion-Defined Pediatric Non-DS AMKL Subgroups
  status: CANONICAL
  applies_to_subtypes:
  - Pediatric Non-Down Syndrome AMKL
  description: >-
    Pediatric non-DS AMKL comprises mutually exclusive genomic subgroups whose
    founding lesions define distinct transcriptional programs, cooperating
    alterations, and clinical risks within an immature megakaryocytic leukemic
    state.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These subgroups are characterized by chimeric oncogenes with cooperating
      mutations in epigenetic and kinase signaling genes.
    explanation: >-
      Large-scale sequencing supports a subgroup model with founding fusions
      and subgroup-specific cooperating lesions.
- hypothesis_group_id: adult_amkl_distinct_genomic_model
  hypothesis_label: Distinct Adult AMKL Genomic Model
  status: CANONICAL
  applies_to_subtypes:
  - Adult AMKL
  description: >-
    Adult AMKL is not simply an age-shifted pediatric fusion leukemia; it is
    characterized by adverse cytogenetics, a different mutation spectrum, and
    marked treatment resistance.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, in the adult cohort (n=24) which lacked recurrent fusion
      genes, the most highly recurrent mutations were in TP53 (20.8%), cohesin
      genes (16.7%), splicing factor genes (16.7%), ASXL genes (16.7%) and
      DNMT3A (12.5%)
    explanation: >-
      Direct pediatric-adult comparison supports a separate adult genomic
      model.
pathophysiology:
- name: Trisomy 21 and GATA1 Truncation Generate GATA1s
  description: >-
    In the usual Down syndrome-associated sequence, an acquired GATA1 mutation
    introduces a premature stop in the N-terminal activation domain. Full-length
    GATA1 is lost while a shorter downstream-initiated GATA1s protein is
    retained. The trisomy-21 fetal hematopoietic context and GATA1s cooperate to
    establish the precursor clone.
  subtypes:
  - Down Syndrome-Associated AMKL
  genes:
  - preferred_term: GATA1
    term:
      id: hgnc:4170
      label: GATA1
  cell_types:
  - preferred_term: megakaryocyte progenitor cell
    term:
      id: CL:0000553
      label: megakaryocyte progenitor cell
  evidence:
  - reference: PMID:12172547
    reference_title: Acquired mutations in GATA1 in the megakaryoblastic leukemia of Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations prevent synthesis of full-length GATA1, but not synthesis
      of a shorter variant that is initiated downstream.
    explanation: >-
      This directly establishes the protein-level consequence of the
      GATA1-truncating mutations.
  downstream:
  - target: GATA1s-Driven Transient Abnormal Myelopoiesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - ml_ds_multistep_leukemogenesis
    description: >-
      In a trisomy-21 hematopoietic background, GATA1s is sufficient to produce
      the preleukemic TAM state in experimental models.
    evidence:
    - reference: PMID:35203280
      reference_title: Modeling Down Syndrome Myeloid Leukemia by Sequential Introduction of GATA1 and STAG2 Mutations in Induced Pluripotent Stem Cells with Trisomy 21.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        GATA1s, together with trisomy 21, is sufficient to develop a pre-leukemic
        condition called transient abnormal myelopoiesis (TAM).
      explanation: >-
        This engineered-cell model directly supports the preleukemic transition.
- name: GATA1s-Driven Transient Abnormal Myelopoiesis
  description: >-
    TAM is a neonatal clonal myeloid proliferation restricted to infants with
    trisomy 21 and GATA1s. It often resolves spontaneously and is not itself
    AMKL, but it is the recognized precursor from which a subset of ML-DS cases
    later emerge.
  subtypes:
  - Down Syndrome-Associated AMKL
  genes:
  - preferred_term: GATA1
    term:
      id: hgnc:4170
      label: GATA1
  evidence:
  - reference: PMID:14636651
    reference_title: Mutations in GATA1 in both transient myeloproliferative disorder and acute megakaryoblastic leukemia of Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We detected GATA1 mutations in TMD blasts from every infant examined.
    explanation: >-
      This establishes GATA1 mutation as an early event already present in the
      transient precursor clone.
  - reference: PMID:21849481
    reference_title: "Natural history of transient myeloproliferative disorder clinically diagnosed in Down syndrome neonates: a report from the Children's Oncology Group Study A2971."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those solely observed, peripheral blasts and all other TMD symptoms
      cleared at a median of 36 and 49 days from diagnosis, respectively.
    explanation: >-
      Prospective observation documents the characteristic spontaneous
      resolution of TAM.
- name: STAG2 Loss Enhances Immature Megakaryopoiesis in a Trisomy-21/GATA1s iPSC Model
  description: >-
    In gene-targeted trisomy-21/GATA1-mutant iPSCs, STAG2 loss enhanced production
    of an immature megakaryocytic population relative to GATA1 mutation alone.
    This is one progression model; it does not establish that STAG2 loss alone
    converts TAM into overt ML-DS or AMKL in vivo.
  subtypes:
  - Down Syndrome-Associated AMKL
  genes:
  - preferred_term: STAG2

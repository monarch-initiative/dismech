discussions:
- discussion_id: controversy_amkl_hct_cr1_benefit
  prompt: >-
    Which molecular-risk groups of pediatric non-DS AMKL derive a net survival
    benefit from allogeneic HCT in first complete remission rather than
    chemotherapy alone?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Allogeneic Hematopoietic Cell Transplantation for Selected Pediatric Non-DS AMKL
  - has_subtypes#CBFA2T3::GLIS2-Positive AMKL
  - has_subtypes#NUP98::KDM5A-Positive AMKL
  rationale: >-
    Retrospective series disagree and are vulnerable to selection, response,
    molecular-composition, and treatment-era effects. The entry therefore
    encodes HCT as risk-adapted and uncertain rather than uniformly beneficial.
  evidence:
  - reference: PMID:25913479
    reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic hematopoietic stem cell transplantation in first remission did
      not provide a significant survival benefit
    explanation: >-
      One large pediatric cohort found no significant CR1 survival advantage.
  - reference: PMID:36786154
    reference_title: Haematopoietic cell transplantation for children with acute megakaryoblastic leukaemia without Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risk stratification in patients with non-DS-AMKL should be established to
      determine HCT indication in CR1.
    explanation: >-
      Registry investigators explicitly leave CR1 indication unresolved.
  - reference: PMID:41228304
    reference_title: "Pediatric Non-Down Syndrome Acute Megakaryoblastic Leukemia Patients Have Dismal Outcomes Irrespective of Allogeneic Hematopoietic Stem Cell Transplant: A Single-Center Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with allo-HSCT did not improve outcomes due to the high CIR, even
      after HSCT in CR1.
    explanation: >-
      A recent single-center comparison reinforces the uncertainty.
- discussion_id: gap_ml_ds_dose_intensity
  prompt: >-
    What induction formulation and dose intensity preserves ML-DS event-free
    survival while minimizing treatment-related toxicity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Reduced-Intensity Cytarabine-Based Chemotherapy for ML-DS
  - has_subtypes#Down Syndrome-Associated AMKL
  rationale: >-
    ML-DS 2006 preserved outcome after selected reductions, whereas replacing
    induction with CPX-351 in ML-DS 2018 reduced EFS despite favorable toxicity.
  evidence:
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study reveals prognostic markers for children with ML-DS and
      illustrates that reducing therapy did not impair excellent outcome.
    explanation: >-
      Selected reductions preserved outcomes in ML-DS 2006.
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      replacing intensity-reduced induction therapy with CPX-351 in ML-DS led to
      a significantly lower EFS, highlighting the need for dose optimization to
      balance the efficacy and toxicity
    explanation: >-
      A different substitution strategy failed to preserve EFS.
- discussion_id: interpretation_rbm15_mrtfa_mpl_model
  prompt: >-
    How much of human RBM15::MRTFA AMKL is faithfully modeled by the Ott-Mal
    donor-marrow/MPLW515L transduction-transplant system used to produce
    short-latency leukemia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#RBM15::MRTFA Fusion Deregulates RBPJ Transcription
  - animal_models#Ott-Mal knock-in donor marrow retrovirally transduced ex vivo with MPLW515L and transplanted into lethally irradiated WT C57BL/6 recipients
  rationale: >-
    The model demonstrates functional cooperation and reproduces many human
    features, but it may overrepresent MPL-dependent biology.
  proposed_experiments:
  - experiment_id: exp_amkl_rbm15_mrtfa_mpl_dependency
    name: RBM15::MRTFA dependence on forced MPL signaling across matched human and mouse models
    description: >-
      Profile MPL-pathway lesions and signaling in human RBM15::MRTFA-positive
      AMKL, then compare Ott-Mal knock-in donor marrow transplanted after
      matched no-vector, MPL-WT, and MPLW515L transduction. Measure leukemia
      latency, lineage state, fibrosis, and transcriptional similarity to the
      human tumors.
    decision_criterion: >-
      Determine whether fusion-positive human tumors share the MPL-dependent
      state required for short-latency leukemia in the mouse transplant model.
  evidence:
  - reference: PMID:19287095
    reference_title: The OTT-MAL fusion oncogene activates RBPJ-mediated transcription and induces acute megakaryoblastic leukemia in a knockin mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cooperation between OTT-MAL and an activating mutation of the
      thrombopoietin receptor myeloproliferative leukemia virus oncogene (MPL)
      efficiently induced a short-latency AMKL
    explanation: >-
      This is both the model's mechanistic strength and the reason to qualify
      extrapolation to every human fusion-positive case.
- discussion_id: gap_adult_amkl_causal_biology
  prompt: >-
    Which recurrent adult AMKL genomic lesions directly specify
    megakaryoblastic differentiation and which primarily mark adverse-risk
    clonal myeloid disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adult Adverse Genomic Landscape and Therapy Resistance
  - has_subtypes#Adult AMKL
  rationale: >-
    Adult cohorts define recurrent mutations and dismal outcomes, but do not
    resolve a causal differentiation program comparable with pediatric fusion
    subgroups.
  evidence:
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most frequently, mutations occurred in TET2 (23%), TP53 (23%), JAK2 (19%),
      PTPN11 (19%) and RUNX1 (15%).
    explanation: >-
      The cohort defines the association set but not lesion-specific
      differentiation mechanisms.
- discussion_id: gap_preclinical_target_translation
  prompt: >-
    Which preclinical AMKL targets can produce safe and durable clinical benefit
    across or within molecular subgroups?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - experimental_models#NUP98-KDM5A Cord-Blood HSPC Model
  - experimental_models#CBFA2T3-GLIS2 Cord-Blood HSPC Endothelial Coculture
  rationale: >-
    Aurora A inhibition, JAK inhibition, CD56-directed therapy, and FOLR1 CAR T
    cells have promising model evidence, but none is encoded as established AMKL
    treatment. On-target FOLR1 expression in normal kidney and lung raises a
    specific safety concern.
  evidence:
  - reference: PMID:36136600
    reference_title: CBFA2T3-GLIS2 model of pediatric acute megakaryoblastic leukemia identifies FOLR1 as a CAR T cell target.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FOLR1 is also expressed in renal and pulmonary epithelium, raising concerns
      for toxicity that must be addressed for the clinical application of this
      therapy.
    explanation: >-
      This directly identifies the translational safety barrier for the
      preclinical FOLR1 strategy.
  - reference: PMID:31698461
    reference_title: Human models of NUP98-KDM5A megakaryocytic leukemia in mice contribute to uncovering new biomarkers and therapeutic vulnerabilities.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Both synthetic models and patient-derived xenografts of NUP98-rearranged
      AMKL showed in vitro therapeutic vulnerability to ruxolitinib, a clinically
      approved JAK2 inhibitor.
    explanation: >-
      This is preclinical vulnerability evidence, not an AMKL clinical efficacy
      result.

        features of human AMKL, including megakaryoblast hyperproliferation and
        maturation block
      explanation: >-
        The two-hit model supports an immature megakaryoblastic state but does
        not isolate the effect of RBM15::MRTFA alone.
- name: CBFA2T3::GLIS2 Induces BMP Signaling and Progenitor Self-Renewal
  description: >-
    The cryptic inv(16)(p13.3q24.3) CBFA2T3::GLIS2 fusion increases BMP

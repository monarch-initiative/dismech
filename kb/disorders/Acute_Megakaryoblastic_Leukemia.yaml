      label: RBM15/MKL1 Fusion Protein
  evidence:
  - reference: PMID:19287095
    reference_title: The OTT-MAL fusion oncogene activates RBPJ-mediated transcription and induces acute megakaryoblastic leukemia in a knockin mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      OTT-MAL expression deregulated transcriptional activity of the canonical
      Notch signaling pathway transcription factor recombination signal binding
      protein for immunoglobulin kappa J region (RBPJ) and caused abnormal fetal
      megakaryopoiesis.
    explanation: >-
      The knock-in model directly supports RBPJ/Notch transcriptional
      dysregulation.
  downstream:

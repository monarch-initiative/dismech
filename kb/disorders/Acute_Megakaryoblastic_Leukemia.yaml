    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pediatric_non_ds_genomic_subgroups
    description: >-
      Fusion-driven RBPJ dysregulation, together with engineered activating MPL
      signaling, produced an immature megakaryoblastic leukemia in the model.
    evidence:
    - reference: PMID:19287095
      reference_title: The OTT-MAL fusion oncogene activates RBPJ-mediated transcription and induces acute megakaryoblastic leukemia in a knockin mouse model.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cooperation between OTT-MAL and an activating mutation of the
        thrombopoietin receptor myeloproliferative leukemia virus oncogene (MPL)

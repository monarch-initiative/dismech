  evidence:
  - reference: PMID:35203280
    reference_title: Modeling Down Syndrome Myeloid Leukemia by Sequential Introduction of GATA1 and STAG2 Mutations in Induced Pluripotent Stem Cells with Trisomy 21.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Hematopoietic differentiation of GATA1&nbsp;STAG2 double-mutant iPSC lines
      confirmed GATA1s expression and the loss of functional STAG2 protein,
      leading to enhanced production of immature megakaryocytic population
      compared to GATA1 mutant alone.
    explanation: >-
      Sequential editing shows that STAG2 loss intensifies the immature
      megakaryocytic state beyond GATA1s alone.
- name: RBM15::MRTFA Fusion Deregulates RBPJ Transcription
  description: >-
    The t(1;22) fusion joins RBM15 to MRTFA (formerly MKL1). In a knock-in mouse
    model the fusion deregulates RBPJ-mediated canonical Notch transcription
    and abnormal fetal megakaryopoiesis; cooperation with activating MPL is
    required for short-latency model disease.
  subtypes:
  - RBM15::MRTFA-Rearranged AMKL

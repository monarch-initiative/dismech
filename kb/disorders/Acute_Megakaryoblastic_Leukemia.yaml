datasets:
- accession: ega:EGAS00001002183
  title: Pediatric Non-Down Syndrome Acute Megakaryoblastic Leukemia is Characterized by Distinct Genomic Subsets with Varying Outcomes
  description: Acute Megakaryoblastic Leukemia (AMKL) is a subtype of acute myeloid leukemia (AML) in which cells morphologically resemble abnormal megakaryoblasts. While extremely rare in adults, AMKL accounts for 4-15% of newly diagnosed childhood AML1-3. A significant proportion of pediatric AMKL cases occur in children with Down syndrome (DS). These patients have excellent outcomes and are characterized at the genomic level by a founding GATA1 mutation4-6. In contrast, AMKL in patients without DS (non-DS-AMKL) is frequently associated with poor outcomes.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Acute Megakaryoblastic Leukemia"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS50000000612
  title: Single cell transcriptome analysis of pediatric acute megakaryoblastic leukemia
  description: Pediatric acute megakaryoblastic leukemia presenting fusion oncogene is generally associated with a poor prognosis. We performed single transcriptome analyses on bone marrow samples from pediatric acute megakaryoblastic leukemia patients presenting the ETO2-GLIS2 fusion oncogene.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Acute Megakaryoblastic Leukemia"); description-level mentions were not accepted. EGA study_type: RNASeq. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

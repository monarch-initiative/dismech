progression:
- phase: TAM Precursor State and Resolution
  notes: >-
    In infants with trisomy 21, GATA1-mutant TAM usually resolves over weeks.
    It is a precursor condition rather than an AMKL synonym.
  evidence:
  - reference: PMID:21849481
    reference_title: "Natural history of transient myeloproliferative disorder clinically diagnosed in Down syndrome neonates: a report from the Children's Oncology Group Study A2971."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among those solely observed, peripheral blasts and all other TMD symptoms
      cleared at a median of 36 and 49 days from diagnosis, respectively.
    explanation: >-
      The prospective natural-history study documents spontaneous resolution.
- phase: Progression from TAM to ML-DS
  notes: >-
    A minority of TAM cases later develop ML-DS after acquiring additional
    lesions. Estimates differ with cohort definitions and era: 16% in COG A2971
    and 23% in another prospective series, so no single universal percentage is
    encoded.
  evidence:
  - reference: PMID:21849481
    reference_title: "Natural history of transient myeloproliferative disorder clinically diagnosed in Down syndrome neonates: a report from the Children's Oncology Group Study A2971."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among all, AML subsequently occurred in 16% at a median of 441 days
    explanation: >-
      This gives a cohort-specific prospective progression estimate.
  - reference: PMID:18182574
    reference_title: Treatment and prognostic impact of transient leukemia in neonates with Down syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 29 (23%) patients with TL subsequently developed ML-DS.
    explanation: >-
      A second cohort demonstrates that progression rates vary by population
      and definition.
- phase: Molecularly Stratified Pediatric Relapse Risk
  subtype: Pediatric Non-Down Syndrome AMKL
  notes: >-
    Pediatric non-DS AMKL outcome is strongly subgroup-dependent.
    CBFA2T3::GLIS2 and KMT2A rearrangements are adverse; GATA1-mutant and HOXr
    subgroups had favorable outcomes in the genomic cohort. These associations
    inform risk stratification but do not establish a universal transplant
    indication.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, CBFA2T3-GLIS2 and KMT2Ar were found to have significantly
      inferior pEFS and pOS.
    explanation: >-
      This supports molecularly stratified adverse outcomes.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: GATA1 and HOXr subgroups carried significantly superior outcomes
    explanation: >-
      This supports the favorable-risk contrast in the same cohort.
- phase: Adult Treatment Resistance and Relapse
  notes: >-
    Adult AMKL has low complete-remission rates and short survival. Allogeneic
    transplantation can produce longer survival in selected patients, but
    post-transplant relapse remains frequent.
  evidence:
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete remission rate in 33 patients receiving intensive chemotherapy
      was 33% and median overall survival (OS) was 33 weeks
    explanation: >-
      This quantifies treatment resistance and survival in the adult cohort.
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cumulative incidence of relapse after allo-HSCT was high (62%).
    explanation: >-
      This qualifies transplantation as potentially curative but relapse-prone.
diagnosis:
- name: Bone Marrow Morphology and Blast Assessment
  diagnosis_term:
    preferred_term: biopsy of bone marrow
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  description: >-
    Marrow aspirate and trephine biopsy establish the acute blast process and
    evaluate morphology. For morphology-defined AMKL lacking an AML-defining
    genetic alteration, the shared WHO AML threshold is at least 20% blasts in
    marrow and/or blood, with exclusion of other defined AML and
    mixed-phenotype entities.
  results: >-
    An acute blast process with megakaryoblastic morphology supports AMKL once
    megakaryocytic lineage is confirmed and exclusion criteria are met.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Shared diagnostic criteria include:
      - ≥20% blasts in bone marrow and/or blood (except for acute erythroid leukaemia).
    explanation: >-
      WHO provides the shared blast criterion for morphology-defined AMKL.
- name: Flow-Cytometric Confirmation of Megakaryocytic Differentiation
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >-
    Lineage attribution can use flow cytometry and/or immunohistochemistry. With
    flow cytometry, demonstrate at least one platelet glycoprotein on blasts:
    CD41, CD61, or CD42b. A CD42a.CD61-positive/CD13-negative EuroFlow pattern
    is highly specific but only moderately sensitive and cannot be used as the
    sole rule.
  results: >-
    Platelet-glycoprotein expression confirms megakaryocytic differentiation in
    the appropriate acute leukemia context.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lineage attribution rests on ... ﬂow cytometry and/or
      immunohistochemistry.
    explanation: >-
      WHO permits lineage attribution by flow cytometry and/or
      immunohistochemistry rather than requiring flow alone.
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blasts express at least one or more of the platelet glycoproteins: CD41
      (glycoprotein llb), CD61 (glycoprotein IIIa), or CD42b (glycoprotein lb)
    explanation: >-
      WHO defines the lineage-confirming markers.
  - reference: PMID:35326734
    reference_title: "Immunophenotypic Analysis of Acute Megakaryoblastic Leukemia: A EuroFlow Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combining CD42a.CD61 (positive) and CD13 (negative) resulted in a
      sensitivity of 71% and a specificity of 99%.
    explanation: >-
      This quantifies a highly specific supportive flow pattern and its
      sensitivity limitation.
- name: Cytogenetic Analysis
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  description: >-
    Tumor karyotyping and targeted FISH detect chromosome-21 abnormalities,
    t(1;22), KMT2A rearrangements, monosomy 7, and other risk lesions, but tumor
    testing alone cannot distinguish constitutional from acquired trisomy 21.
    Matched remission or nonhematopoietic tissue is needed to resolve that
    distinction, especially when mosaicism is possible. Cryptic
    CBFA2T3::GLIS2 and NUP98::KDM5A lesions require targeted FISH, RT-PCR, or
    sequencing rather than conventional karyotyping alone.
  results: >-
    Recurrent cytogenetic and fusion findings assign subtype and inform
    pediatric risk stratification.
  evidence:
  - reference: PMID:27114462
    reference_title: "Recurrent abnormalities can be used for risk group stratification in pediatric AMKL: a retrospective intergroup study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CBFA2T3/GLIS2 was identified in 16% of the cases; RBM15/MKL1, in 12%;
      NUP98/KDM5A and KMT2A rearrangements, in 9% each; and monosomy 7, in 6%.
    explanation: >-
      This supports testing for recurrent molecular/cytogenetic risk groups.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CBFA2T3-GLIS2 and NUP98-KDM5A, are missed by conventional karyotyping and
      therefore require split-signal FISH or RT-PCR for detection.
    explanation: >-
      This directly supports targeted testing for the two cryptic fusions.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had non-hematopoietic tissue available for analysis and was
      found to be germline mosaic for trisomy 21
    explanation: >-
      This illustrates why tumor cytogenetics alone cannot exclude constitutional
      mosaic trisomy 21 and why matched nonhematopoietic tissue may be required.
- name: Molecular Testing for GATA1 and Recurrent Fusions
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    In pediatric non-DS AMKL, the cohort-based core recommendation includes
    GATA1, CBFA2T3::GLIS2, KMT2A rearrangements, and NUP98::KDM5A. Broader
    RNA-based fusion profiling can detect additional RBM15::MRTFA and diverse
    HOX-rearranged subgroups. Molecular assignment supports risk stratification
    because major pediatric subgroups differ in outcome and some lesions are
    cryptic.
  results: >-
    Molecular findings classify recurrent non-DS genomic subgroups and, when
    interpreted with constitutional-versus-acquired chromosome-21 status,
    support distinction from ML-DS and risk stratification.
  evidence:
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CBFA2T3-GLIS2 and NUP98-KDM5A, are missed by conventional karyotyping and
      therefore require split-signal FISH or RT-PCR for detection.
    explanation: >-
      This directly supports targeted detection of cryptic fusion subgroups.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we recommend all pediatric non-DS-AMKL patients be tested for the presence
      of GATA1 mutations, CBFA2T3-GLIS2, KMT2Ar, and NUP98-KDM5A.
    explanation: >-
      This supports the core molecular test panel.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 93 patients for whom sufficient RNA was available ... 72.4%
      pediatric cases carried a structural variation (SV) predicted to lead to
      a fusion product by RNAseq ... RBM15-MKL1 (10.5%) ... Chimeric transcripts
      not previously described include several fusions involving genes within
      the HOX cluster
    explanation: >-
      The sequencing cohort supports broader RNA-based detection of recurrent
      and diverse fusion subgroups beyond the four-gene core recommendation.
differential_diagnoses:
- name: Transient Abnormal Myelopoiesis
  disease_term:
    preferred_term: transient myeloproliferative syndrome
    term:
      id: MONDO:0008040
      label: transient myeloproliferative syndrome
  description: >-
    Neonatal trisomy-21-associated megakaryoblastic proliferation overlaps most
    directly with Down syndrome-associated AMKL.
  distinguishing_features:
  - Restricted to newborns with trisomy 21 and typically resolves spontaneously.
  - Persistent or later overt leukemia rather than neonatal resolution raises concern for ML-DS.
  evidence:
  - reference: PMID:21849481
    reference_title: "Natural history of transient myeloproliferative disorder clinically diagnosed in Down syndrome neonates: a report from the Children's Oncology Group Study A2971."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient myeloproliferative disorder (TMD), restricted to newborns with
      trisomy 21, is a megakaryocytic leukemia that although lethal in some is
      distinguished by its spontaneous resolution.
    explanation: >-
      This establishes neonatal restriction and spontaneous resolution.
- name: Acute Panmyelosis with Myelofibrosis
  disease_term:
    preferred_term: acute panmyelosis with myelofibrosis
    term:
      id: MONDO:0019455
      label: acute panmyelosis with myelofibrosis
  description: >-
    A fibrotic acute myeloid neoplasm with substantial morphologic overlap.
  distinguishing_features:
  - >-
    APMF shows trilineage hyperplasia with increased dysplastic megakaryocytes;
    AMKL-MF in the cited cohort showed higher marrow blasts, fewer mature
    megakaryocytes, rare megakaryocytic dysplasia, and chromosome-21 abnormality.
  evidence:
  - reference: PMID:23693053
    reference_title: "Differential diagnosis of myelofibrosis based on WHO 2008 criteria: acute panmyelosis with myelofibrosis, acute megakaryoblastic leukemia with myelofibrosis, primary myelofibrosis and myelodysplastic syndrome with myelofibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      APMF showed hyperplasia of all three lineages, increase in megakaryocyte
      count with dysplasia and frequent abnormal karyotypes. AMKL-MF was
      associated with elevated BM blast counts, decreased BM megakaryocyte count
      with rare megakaryocytic dysplasia and chromosome 21 abnormality.
    explanation: >-
      This directly compares two fibrotic acute myeloid presentations and
      refutes use of increased mature megakaryocytes as a general AMKL phenotype.
- name: Primary Myelofibrosis
  disease_term:
    preferred_term: primary myelofibrosis
    term:
      id: MONDO:0009692
      label: primary myelofibrosis
  description: >-
    A chronic myeloproliferative neoplasm that can overlap through fibrosis and
    splenomegaly.
  distinguishing_features:
  - >-
    Rare peripheral/marrow blasts and JAK2 V617F favored PMF in the comparative
    cohort; AMKL requires an acute blast process with megakaryocytic-lineage
    markers.
  evidence:
  - reference: PMID:23693053
    reference_title: "Differential diagnosis of myelofibrosis based on WHO 2008 criteria: acute panmyelosis with myelofibrosis, acute megakaryoblastic leukemia with myelofibrosis, primary myelofibrosis and myelodysplastic syndrome with myelofibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PMF patients displayed splenomegaly, rare blasts in PB/BM, and JAK2 V617F
      mutation.
    explanation: >-
      This identifies distinguishing features in the comparison cohort.
- name: Myelodysplastic Syndrome with Myelofibrosis
  description: >-
    A fibrotic myelodysplastic presentation with cytopenias and trilineage
    dysplasia that can mimic AMKL with fibrosis. No exact MONDO binding is
    supplied for this composite label.
  distinguishing_features:
  - >-
    Pancytopenia, trilineage dysplasia, and recurrent chromosome 5, 7, 12, or 17
    abnormalities favored MDS-MF in the cited cohort.
  evidence:
  - reference: PMID:23693053
    reference_title: "Differential diagnosis of myelofibrosis based on WHO 2008 criteria: acute panmyelosis with myelofibrosis, acute megakaryoblastic leukemia with myelofibrosis, primary myelofibrosis and myelodysplastic syndrome with myelofibrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MDS-MF patients showed pancytopenia, dysplasia in all three lineages and
      recurrent chromosomal abnormalities involving chromosome 5,7,12, and 17.
    explanation: >-
      This defines distinguishing cohort features.
- name: Megakaryocytic Blast Phase of Chronic Myeloid Leukemia
  description: >-
    CML blast phase can acquire a megakaryocytic phenotype and share platelet
    glycoprotein expression with de novo AMKL.
  distinguishing_features:
  - >-
    Establish prior or concurrent CML/BCR::ABL1 context; the comparative adult
    series found more myeloperoxidase-positive blasts in megakaryocytic CML blast
    phase and more CD15 expression in de novo AMKL.
  evidence:
  - reference: PMID:14968469
    reference_title: "[Survival, clinical and laboratory characteristics of de novo and secondary megakaryoblastic leukemia]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leukemic cells of patients with AMegL expressed more frequently CD15
      antigen than blast cells of those with MegBC-CML (83% and 37.5%; p < 0.05).
      In contrast, blast cells expressing myeloperoxidase were present in 50% and
      10% of cases with MegBC-CML and AMegL, respectively
    explanation: >-
      Direct comparison documents immunophenotypic differences while reinforcing
      the need to establish the underlying CML context.
- name: T-Lymphoblastic or Mixed-Lineage Acute Leukemia
  description: >-
    CBFA2T3::GLIS2-positive acute leukemia can coexpress T-lineage and
    megakaryocytic markers, creating a lineage-assignment pitfall.
  distinguishing_features:
  - >-
    Bright CD56 with dim or negative HLA-DR, CD38, and CD45 (the RAM phenotype),
    megakaryocytic markers, and direct detection of CBFA2T3::GLIS2 support the
    fusion-positive AML spectrum.
  evidence:
  - reference: PMID:37601875
    reference_title: "CBFA2T3::GLIS2-positive acute leukemia with RAM and mixed T/megakaryocytic phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CBFA2T3::GLIS2-positive acute leukemia with T/megakaryocytic markers could
      be misdiagnosed as T-lymphoblastic leukemia/lymphoma, early T-cell
      precursor acute lymphoblastic leukemia/lymphoma, NK lymphoblastic leukemia,
      AML with minimal differentiation, or AML with myelodysplasia-related changes.
    explanation: >-
      This directly identifies the diagnostic pitfall and its competing
      classifications.
treatments:
- name: Reduced-Intensity Cytarabine-Based Chemotherapy for ML-DS
  action_category: THERAPEUTIC
  role: First-line
  context: Children with ML-DS; evidence is not stratified by megakaryoblastic morphology
  description: >-
    Children with ML-DS are treated with reduced-intensity AML regimens tailored
    to their high cytotoxic-drug susceptibility. In ML-DS 2006, reducing
    cumulative etoposide, reducing intrathecal prophylaxis, and omitting
    maintenance preserved excellent survival relative to the historical
    reduced-intensity control. This evidence supports a specific tested regimen,
    not arbitrary further deintensification, and applies to the ML-DS trial
    population rather than a morphology-stratified DS-AMKL subset.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  target_mechanisms:
  - target: Immature Megakaryocytic Leukemic State
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic therapy reduces leukemic cell burden; it does not reverse
      trisomy 21 or the GATA1 mutation.
    evidence:
    - reference: PMID:28400376
      reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Still, 5-year overall survival (89% ± 3% vs 90% ± 4%; Plog-rank = .64),
        event-free survival (EFS; 87% ± 3% vs 89% ± 4%; Plog-rank = .71), and
        cumulative incidence of relapse/nonresponse (CIR/NR; 6% ± 3% vs 6% ± 2%;
        PGray = .03) did not significantly differ
      explanation: >-
        Clinical outcomes indirectly support control of leukemic burden; this
        does not establish reversal of the underlying differentiation program.
  evidence:
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with myeloid leukemia associated with Down syndrome (ML-DS) have
      superior outcome compared with non-DS patients, but suffer from higher
      constitutional cytotoxic drug susceptibility.
    explanation: >-
      This directly supports tailoring intensity to the heightened cytotoxic
      drug susceptibility of children with ML-DS.
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intensity-reduced induction and reinduction therapy with cytarabine and
      idarubicin with or without etoposide was replaced with CPX-351
    explanation: >-
      ML-DS 2018 identifies the intensity-reduced predecessor backbone as
      cytarabine-based; it does not define the complete ML-DS 2006 regimen.
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      treatment intensity was reduced by lowering the cumulative dose of
      etoposide (950 to 450 mg/m2) and intrathecal central nervous system
      prophylaxis while omitting maintenance therapy.
    explanation: >-
      This states the actual deintensification tested in ML-DS 2006.
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Still, 5-year overall survival (89% ± 3% vs 90% ± 4%; Plog-rank = .64),
      event-free survival (EFS; 87% ± 3% vs 89% ± 4%; Plog-rank = .71), and
      cumulative incidence of relapse/nonresponse (CIR/NR; 6% ± 3% vs 6% ± 2%;
      PGray = .03) did not significantly differ
    explanation: >-
      The tested reductions preserved excellent survival and relapse outcomes.
- name: Intensive Pediatric AML Chemotherapy for Non-DS AMKL
  action_category: THERAPEUTIC
  role: First-line
  context: Pediatric Non-Down Syndrome AMKL
  description: >-
    Pediatric non-DS AMKL is treated with intensive multi-agent AML therapy.
    Survival improved substantially between AML-BFM 98 and AML-BFM 04, but
    molecular subgroup and early response remain important risk variables.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Immature Megakaryocytic Leukemic State
    treatment_effect: INHIBITS
    description: >-
      Intensive AML chemotherapy reduces leukemic cell burden; this is not a
      fusion-specific targeted effect or evidence of restored maturation.
    evidence:
    - reference: PMID:25913479
      reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we achieved an improved 5-year OS in AML-BFM 04 compared to AML-BFM 98
        (70 ± 6 % vs. 45 ± 8 %, P log rank = 0.041).
      explanation: >-
        Improved survival indirectly supports disease-burden control but does
        not establish a fusion-specific or differentiation-restoring mechanism.
  evidence:
  - reference: PMID:25913479
    reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we achieved an improved 5-year OS in AML-BFM 04 compared to AML-BFM 98
      (70 ± 6 % vs. 45 ± 8 %, P log rank = 0.041).
    explanation: >-
      The prospective multicenter studies document improved survival in the
      later intensive-treatment era.
  - reference: PMID:25913479
    reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, with intensive therapy regimens, a steep increase in the
      survival rates was achieved.
    explanation: >-
      This supports intensive AML therapy as the pediatric non-DS treatment
      backbone.
  - reference: PMID:25913479
    reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      multivariate analysis showed that treatment response (bone marrow
      morphology on day 15 and 28) was the only independent prognostic marker
    explanation: >-
      This directly supports early morphologic response as a risk variable in
      the AML-BFM cohorts.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pediatric non-DS-AMKL is a heterogeneous malignancy comprised of distinct
      subsets as defined by next generation sequencing with varying outcomes.
    explanation: >-
      This directly supports molecular subgroup as an outcome-associated risk
      variable.
- name: Allogeneic Hematopoietic Cell Transplantation for Selected Pediatric Non-DS AMKL
  therapeutic_modality: CELL_THERAPY
  action_category: THERAPEUTIC
  role: Risk-adapted consolidation or salvage
  context: >-
    Selected high-risk pediatric non-DS AMKL in remission; benefit in first
    complete remission remains uncertain
  description: >-
    Allogeneic HCT may be considered for selected high-risk or poorly responding
    non-DS AMKL, but it is not a uniformly established CR1 standard.
    Comparative cohorts have not established a net CR1 survival benefit, while
    registry data among transplanted patients show better outcomes in CR1 than
    later or outside remission.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Immature Megakaryocytic Leukemic State
    treatment_effect: INHIBITS
    description: >-
      Conditioning and graft-mediated antileukemic effects aim to eradicate the
      leukemic clone and restore donor hematopoiesis.
    evidence:
    - reference: PMID:36786154
      reference_title: Haematopoietic cell transplantation for children with acute megakaryoblastic leukaemia without Down syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The 5-year OS rate was significantly higher for patients who underwent
        HCT in the first complete remission (CR1, 72%) than for those in the
        second CR (CR2, 23%) and non-CR (16%)
      explanation: >-
        Outcomes by remission state indirectly support antileukemic disease
        control, without identifying a specific differentiation mechanism.
  evidence:
  - reference: PMID:25913479
    reference_title: Improved outcome of pediatric patients with acute megakaryoblastic leukemia in the AML-BFM 04 trial.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Allogeneic hematopoietic stem cell transplantation in first remission did
      not provide a significant survival benefit
    explanation: >-
      This argues against encoding transplant as universally beneficial in CR1.
  - reference: PMID:36786154
    reference_title: Haematopoietic cell transplantation for children with acute megakaryoblastic leukaemia without Down syndrome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year OS rate was significantly higher for patients who underwent HCT
      in the first complete remission (CR1, 72%) than for those in the second CR
      (CR2, 23%) and non-CR (16%)
    explanation: >-
      Among transplanted patients, remission state strongly affected outcome;
      the registry lacks a chemotherapy-only comparator.
  - reference: PMID:41228304
    reference_title: "Pediatric Non-Down Syndrome Acute Megakaryoblastic Leukemia Patients Have Dismal Outcomes Irrespective of Allogeneic Hematopoietic Stem Cell Transplant: A Single-Center Experience."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with allo-HSCT did not improve outcomes due to the high CIR, even
      after HSCT in CR1.
    explanation: >-
      A recent small cohort reinforces uncertainty about a CR1 survival benefit.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore patients carrying CBFA2T3-GLIS2 or KMT2Ar that have inferior
      outcomes may benefit from allogeneic SCT in first complete remission.
      While NUP98-KDM5A outcomes did not reach statistical significance, their
      pEFS and pOS warrant close monitoring and consideration of allogeneic SCT
      as well.
    explanation: >-
      This is the retrospective study authors' risk-adapted proposal, not a
      demonstrated transplant benefit or a prospective recommendation.
  - reference: PMID:28112737
    reference_title: "Pediatric non-Down syndrome acute megakaryoblastic leukemia is characterized by distinct genomic subsets with varying outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      transplant in first remission should be reserved for those showing a poor
      response to induction therapy (e.g. high levels of minimal residual disease).
    explanation: >-
      This is the retrospective authors' proposal for poorly responding cases,
      not evidence that transplant improves survival in that group.
- name: Intensive Chemotherapy for Fit Adults
  action_category: THERAPEUTIC
  role: Remission induction
  context: Adult AMKL
  description: >-
    Fit adults may receive intensive AML chemotherapy, but dedicated AMKL data
    show low complete-remission rates and very short survival. This is a
    treatment option with limited effectiveness rather than a favorable
    evidence-based expectation.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Immature Megakaryocytic Leukemic State
    treatment_effect: INHIBITS
    description: Intensive chemotherapy aims to reduce adult AMKL leukemic-cell burden.
    evidence:
    - reference: PMID:37455345
      reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Complete remission rate in 33 patients receiving intensive chemotherapy
        was 33% and median overall survival (OS) was 33 weeks
      explanation: >-
        The remission rate indirectly supports blast-burden reduction while the
        poor survival documents limited effectiveness.
  evidence:
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete remission rate in 33 patients receiving intensive chemotherapy
      was 33% and median overall survival (OS) was 33 weeks
    explanation: >-
      This supports use of intensive therapy in the cohort while documenting
      its limited effectiveness.
- name: Allogeneic Hematopoietic Cell Transplantation for Eligible Adults
  therapeutic_modality: CELL_THERAPY
  action_category: THERAPEUTIC
  role: Potentially curative consolidation or salvage
  context: Adult AMKL achieving sufficient disease control
  description: >-
    Adult cohort data describe allogeneic HSCT as the only potentially curative
    option, but selection bias is unavoidable and post-transplant relapse
    remains high.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Immature Megakaryocytic Leukemic State
    treatment_effect: INHIBITS
    description: >-
      Transplant conditioning and graft-mediated effects aim to eliminate the
      resistant adult AMKL clone.
    evidence:
    - reference: PMID:37455345
      reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients undergoing allo-HSCT (n = 14) had a superior median OS (68 weeks;
        95% CI: 11-126) and relapse-free survival (RFS) of 27 weeks (95% CI: 4-50),
        although cumulative incidence of relapse after allo-HSCT was high (62%).
      explanation: >-
        These outcomes indirectly support antileukemic disease control while
        documenting substantial post-transplant relapse.
  evidence:
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far allo-HSCT is the only potentially curative treatment option in this
      dismal AML subgroup.
    explanation: >-
      This is the adult cohort authors' interpretation and is retained with
      partial support because the observational design cannot prove uniqueness.
  - reference: PMID:37455345
    reference_title: Acute megakaryoblastic leukaemia shows high frequency of chromosome 1q aberrations and dismal outcome.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients undergoing allo-HSCT (n = 14) had a superior median OS (68 weeks;
      95% CI: 11-126) and relapse-free survival (RFS) of 27 weeks (95% CI: 4-50),
      although cumulative incidence of relapse after allo-HSCT was high (62%).
    explanation: >-
      This supports potential benefit while explicitly documenting high relapse.
- name: GATA1 Measurable Residual Disease Monitoring in ML-DS
  action_category: MONITORING
  role: Response and relapse-risk monitoring
  context: ML-DS treated in the ML-DS 2018 trial
  description: >-
    Error-corrected next-generation sequencing of the leukemia-associated GATA1
    mutation can monitor molecular residual disease in ML-DS. In ML-DS 2018,
    positivity was associated with increased relapse risk; this evidence does
    not establish generic flow-cytometric or fusion-based MRD monitoring for all
    AMKL subtypes.
  evidence:
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positive MRD by error-corrected GATA1 next-generation sequencing, the
      presence of trisomy 8 or a complex karyotype were associated with an
      increased risk for relapse.
    explanation: >-
      This supports error-corrected GATA1 molecular MRD as a relapse-risk
      monitoring tool in the ML-DS 2018 population.
clinical_trials:
- name: ML-DS 2006 (EudraCT 2007-006219-2)
  description: >-
    Prospective multicenter, open-label, nonrandomized treatment-reduction study
    in 170 children with ML-DS. Published final results support lowering
    etoposide and intrathecal prophylaxis and omitting maintenance without
    impairing excellent outcome. The publication reports ML-DS as a whole and
    does not provide morphology-stratified DS-AMKL trial results.
  evidence:
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the outcome of 170 pediatric patients with ML-DS enrolled in
      the prospective, multicenter, open-label, nonrandomized ML-DS 2006 trial
    explanation: >-
      This defines the design and population of the published trial.
  - reference: PMID:28400376
    reference_title: "Therapy reduction in patients with Down syndrome and myeloid leukemia: the international ML-DS 2006 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study reveals prognostic markers for children with ML-DS and
      illustrates that reducing therapy did not impair excellent outcome.
    explanation: >-
      This directly supports the trial-level conclusion that the tested
      reductions preserved outcome.
- name: ML-DS 2018 (EudraCT 2018-002988-25)
  phase: PHASE_III
  status: TERMINATED
  description: >-
    Phase III study replacing intensity-reduced induction/reinduction with
    CPX-351 in ML-DS. It was halted after 35 enrollments because relapse was
    unexpectedly high. Toxicity was favorable, but 24-month EFS was inferior to
    the historical ML-DS 2006 result, so CPX-351 substitution is not encoded as
    recommended therapy. Results are ML-DS-wide rather than stratified by
    megakaryoblastic morphology.
  evidence:
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 35 patients were enrolled until the trial was halted because of
      an unexpectedly high relapse rate.
    explanation: >-
      This documents enrollment and early termination.
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A per-protocol interim analysis revealed a significantly lower 24-month
      EFS when compared with the ML-DS 2006 trial (69% vs 90%; P< .001).
    explanation: >-
      The negative efficacy result prevents treatment recommendation despite
      favorable toxicity.
  - reference: PMID:41118594
    reference_title: "CPX-351 in Down syndrome-associated myeloid leukemia: results and prognostic factors from the phase 3 ML-DS 2018 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPX-351 demonstrated a favorable toxicity profile with no treatment-related
      mortality.
    explanation: >-
      This directly supports the favorable-toxicity qualification while the EFS
      result remains unfavorable.

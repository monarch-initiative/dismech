classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    evidence:
    - reference: PMID:32117019
      reference_title: Beneficial Effects of Ketogenic Diet on Phosphofructokinase Deficiency (Glycogen Storage Disease Type VII).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Background: A deficiency of muscle phosphofructokinase (PFKM) causes a
        rare metabolic muscle disease, the Tarui disease (Glycogen storage
        disease type VII, GSD VII) characterized by exercise intolerance with
        myalgia due to an inability to use glucose as an energy resource.
      explanation: Classifies GSD VII as a metabolic muscle disorder of glucose utilization.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:39156960
      reference_title: "Case report: Comprehensive exploration of a novel PFKM mutation in glycogen storage disease Type VII."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glycogen Storage Disease Type VII (GSD VII) is a rare glycogen metabolism
        disorder resulting from mutations in the PFKM gene, inherited in an
        autosomal recessive manner.
      explanation: Establishes GSD VII as an autosomal recessive Mendelian disorder caused by PFKM mutations.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:30397902
      reference_title: Myopathies Related to Glycogen Metabolism Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Most of the glycogen metabolism disorders that affect skeletal muscle
        involve enzymes in glycogenolysis (myophosphorylase (PYGM), glycogen
        debranching enzyme (AGL), phosphorylase b kinase (PHKB)) and glycolysis
        (phosphofructokinase (PFK), phosphoglycerate mutase (PGAM2), aldolase A
        (ALDOA), β-enolase (ENO3)); however, 3 involve glycogen synthesis
        (glycogenin-1 (GYG1), glycogen synthase (GSE), and branching enzyme
        (GBE1)).
      explanation: Places GSD VII among the neuromuscular glycogen and glycolytic metabolic myopathies.

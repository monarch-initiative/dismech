- name: Skeletal Muscle Glycolytic Block
  description: >-
    Reduced PFKM activity interrupts skeletal-muscle glycolysis at the
    fructose-6-phosphate to fructose-1,6-bisphosphate step, limiting anaerobic
    use of both muscle glycogen and blood-borne glucose during exertion and
    causing upstream accumulation of hexose monophosphates including
    glucose-6-phosphate.

  - target: Pentose phosphate rerouting and exercise nitrogen catabolism
    description: >-
      The PFKM block may reroute glucose-6-phosphate through the pentose
      phosphate pathway during exertion, with downstream nucleotide and
      amino-acid metabolism contributing to abnormal ammonia generation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - pentose phosphate pathway entry downstream of the PFKM block
    - nucleotide and amino-acid metabolism with ammonia generation
    evidence:
    - reference: PMID:27303362
      reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results suggest that in patients with Tarui disease an alternative
        route of glycogen metabolism is introduced. In the pentose phosphate
        pathway (PPP) (18) (Figure 2), the metabolism of glucose 6-phosphate
        continues to glyceraldehyde 3-phosphate, which may enter the glycolysis
        chain distally to the PFKM step leading to lactate production.
      explanation: Human exercise-testing data support an alternative PPP route downstream of the skeletal-muscle PFKM block.
    - reference: PMID:27303362
      reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The dotted arrow: fructose 6-phosphate accumulates because of Tarui
        disease, and its metabolism may continue in the PPP pathway, from where
        it may enter in protein or nucleic acid synthesis. Increase of synthesis
        of proteins or nucleotides means also increase of products of their
        metabolism, increasing, e.g., the production of ammonia.
      explanation: The same study proposes nucleotide/protein metabolic turnover as a bridge from the PFKM block to ammonia generation.
  - target: Polyglucosan Storage in Skeletal Muscle
    description: >-
      Accumulation of glucose-6-phosphate upstream of the PFKM block allosterically
      activates glycogen synthase (GYS1), shifting the glycogen synthase to
      branching enzyme ratio toward synthesis of poorly branched, diastase-resistant
      polyglucosan in muscle fibers.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22106711
      reference_title: Progress and problems in muscle glycogenoses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        We reasoned that this surprising finding could best be explained by the
        excessive accumulation of glucose-6-phosphate (G6P) upstream of the
        glycolytic block (49). As G6P is a functional activator of glycogen
        synthetase (GS), the finely balanced activity ratio of GS and GBE would
        be tilted in favor of GS and result in a polysaccharide with abnormally
        long and poorly branched chains, i.e. polyglucosan.
      explanation: Explains how G6P accumulation upstream of the PFKM block activates glycogen synthase and drives polyglucosan formation.
  - target: Low exercise lactate with delayed post-exercise rise
    description: The PFKM step block produces an atypical lactate response during and after exercise.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27303362
      reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.

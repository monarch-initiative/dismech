  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the molecular and genetic basis of the fatal infantile multisystem syndrome
    historically classified as a fourth clinical subtype of GSD VII, given the
    persistent failure to identify pathogenic PFKM mutations in affected infants?
  attaches_to:
  - "pathophysiology#PFKM Molecular Function Deficiency"
  rationale: >-
    Although traditional clinical classifications of GSD VII list a fourth, fatal
    infantile variant characterized by generalized myopathy, cardiomyopathy, brain
    cortical blindness, cerebellar involvement, arthrogryposis, and death in infancy
    with biochemically reduced muscle PFK activity, molecular studies have
    repeatedly failed to detect pathogenic mutations in PFKM in these infants.
    Whether these cases represent secondary PFK instability, defects in a PFK
    regulatory factor or chaperone, or a genetically distinct syndrome remains
    unresolved.
  proposed_experiments:
  - experiment_id: exp_gsd7_infantile_wgs_rna_proteomics
    experiment_design: DESCRIPTIVE_PROFILING
    name: Trio genome, muscle transcriptome, and native PFK holoenzyme proteomics in fatal infantile PFK-deficient cases
    description: >-
      Perform trio whole-genome sequencing, skeletal muscle RNA-seq, and blue-native
      PAGE/mass spectrometry of the PFK tetramer in archived or newly ascertained
      infantile multisystem cases with low biochemical PFK activity to determine
      whether non-coding PFKM defects or trans-acting assembly/stability factors
      account for the enzyme deficiency.
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because of the early onset, multisystem involvement, and lack of any
      molecular evidence of mutations in the PFKM gene, the infantile variant of
      phosphofructokinase deficiency appears to be a separate entity from GSD
      VII, and its genetic basis (or bases) remain to be clarified, despite
      evidence that a transgenic PFKM-null mouse mimics the infantile more than
      the typical muscular form of the human disease (58).
    explanation: Documents the unresolved absence of PFKM mutations in fatal infantile cases classified under GSD VII.

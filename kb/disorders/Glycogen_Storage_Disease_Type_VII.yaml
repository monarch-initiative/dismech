      It is caused by mutations in the muscle 6-phosphofructokinase (Pfk).
      Pfk is an oligomeric, allosteric enzyme which catalyzes one of the
      rate-limiting steps of the glycolysis: the phosphorylation of fructose
      6-phosphate at position 1.
    explanation: This biochemical study links Tarui disease to muscle phosphofructokinase mutations and the affected glycolytic reaction.

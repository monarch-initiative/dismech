  evidence:
  - reference: PMID:27303362
    reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The dotted arrow: fructose 6-phosphate accumulates because of Tarui
      disease, and its metabolism may continue in the PPP pathway, from where it
      may enter in protein or nucleic acid synthesis. Increase of synthesis of
      proteins or nucleotides means also increase of products of their
      metabolism, increasing, e.g., the production of ammonia.
    explanation: Human exercise-testing study supports PPP rerouting and increased ammonia production as a downstream metabolic branch in Tarui disease.
  - reference: PMID:27303362
    reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that also the activation of PPP route and the raise in ribose
      5-phosphate could boost the ammonia levels by influencing the amino-acid
      synthesis. The deamination of AMP, as well as of various amino acids and
      the metabolites of citric acid cycle generate ammonia (13, 24).
    explanation: The paper explicitly links PPP activation, AMP/amino-acid deamination, and ammonia generation during exercise.
  downstream:
  - target: Low exercise lactate with delayed post-exercise rise
    description: >-
      PPP entry distal to PFKM provides a proposed route to delayed
      post-exercise lactate generation while the primary PFKM block keeps lactate
      low during exercise.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - glucose-6-phosphate flux through the pentose phosphate pathway
    - distal glycolytic entry at glyceraldehyde-3-phosphate
    evidence:
    - reference: PMID:27303362
      reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In the pentose phosphate pathway (PPP) (18) (Figure 2), the metabolism of
        glucose 6-phosphate continues to glyceraldehyde 3-phosphate, which may
        enter the glycolysis chain distally to the PFKM step leading to lactate
        production.
      explanation: The proposed PPP bypass explains the delayed post-exercise lactate branch.
  - target: Exercise-associated hyperammonemia
    description: >-
      Increased nucleotide and amino-acid turnover downstream of the rerouted
      exercise metabolism generates ammonia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - protein and nucleotide metabolic turnover
    - AMP and amino-acid deamination
    evidence:

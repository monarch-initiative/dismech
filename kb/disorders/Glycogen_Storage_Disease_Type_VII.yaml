- name: Avoidance of pre-exercise carbohydrate ("out-of-wind" phenomenon)
  description: >-
    Unlike in glycogenolytic defects such as McArdle disease (GSD V), consuming
    carbohydrates immediately before exercise exacerbates exercise intolerance in
    GSD VII. Because PFKM deficiency blocks utilization of both blood glucose and
    muscle glycogen, a pre-exercise carbohydrate load cannot supply pyruvate while
    the resulting insulin surge suppresses peripheral and intramyocellular lipolysis,
    depriving skeletal muscle of alternative oxidative free fatty acid substrates
    ("out-of-wind" phenomenon).
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  target_mechanisms:
  - target: Skeletal Muscle Glycolytic Block
    treatment_effect: MODULATES
    description: >-
      Avoiding pre-exercise carbohydrate leaves the PFKM enzymatic block itself
      unchanged, and instead prevents carbohydrate-induced insulin release from
      suppressing peripheral and intramyocellular lipolysis and free fatty acid
      mobilization to exercising skeletal muscle.
    evidence:
    - reference: PMID:30397902
      reference_title: Myopathies Related to Glycogen Metabolism Disorders.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        for the glucose remains unavailablefor pyruvate production and the
        resultant increase in insulin inhibits the availability of substrates
        such as free fatty acids (from peripheral and IMCL lipolysis).
      explanation: Explains how pre-exercise carbohydrate inhibits alternative free fatty acid substrate availability in GSD VII because glucose remains blocked upstream of PFKM.
  evidence:
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immediate pre-exercise carbohydrate improves symptoms in the glycogenolytic
      defects (i.e., PYGM), but can exacerbate symptoms in glycolytic defects (i.e.,
      PFK).
    explanation: Distinguishes pre-exercise carbohydrate counseling in PFK deficiency from glycogenolytic defects.

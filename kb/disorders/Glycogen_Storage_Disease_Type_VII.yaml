      id: CHEBI:28087
      label: glycogen
    modifier: INCREASED
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We reasoned that this surprising finding could best be explained by the
      excessive accumulation of glucose-6-phosphate (G6P) upstream of the
      glycolytic block (49). As G6P is a functional activator of glycogen
      synthetase (GS), the finely balanced activity ratio of GS and GBE would
      be tilted in favor of GS and result in a polysaccharide with abnormally
      long and poorly branched chains, i.e. polyglucosan.
    explanation: Explains how G6P accumulation allosterically activates glycogen synthase and tilts the GS/GBE balance toward polyglucosan synthesis in GSD VII.
  - reference: PMID:26278982
    reference_title: Polyglucosan storage myopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These diseases frequently involve both skeletal and cardiac muscle tissue,
      causing myopathy with muscle weakness and wasting, and cardiomyopathy with
      arrhythmia, conduction block, and cardiac failure. Mutations in eight
      human genes are known to be associated with polyglucosan storage involving
      muscle, namely GYG1, GBE1, RBCK1 (HOIL-1), PFKM, EPM2A, EPM2B (NHLRC1),
      PRDM8, and PRKAG2.
    explanation: Identifies PFKM among the human muscle polyglucosan storage myopathy genes causing muscle weakness and wasting.
  downstream:
  - target: Muscle weakness
    description: Polyglucosan accumulation in skeletal muscle fibers is associated with late-onset fixed muscle weakness.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22106711
      reference_title: Progress and problems in muscle glycogenoses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The presence – in addition to normal-looking glycogen – also of abnormal
        glycogen with the histochemical (diastase-resistance) and ultrastructural
        (fine granules and filaments instead of β-particles) features of
        polyglucosan was first noted in the muscle biopsy of two patients (48)
        and confirmed in a woman who had developed late-onset fixed weakness (49).
      explanation: Links muscle polyglucosan storage to late-onset fixed weakness in GSD VII.
- name: Pentose phosphate rerouting and exercise nitrogen catabolism
  description: >-
    During exertion, the muscle PFKM block can leave fructose-6-phosphate and
    glucose-6-phosphate upstream of the block, with suggested rerouting through
    the pentose phosphate pathway and increased ammonia generation through
    protein, nucleotide, AMP, and amino-acid metabolism.
  cell_types:

- name: Subsarcolemmal and intermyofibrillar non-membrane-bound glycogen accumulation
  description: >-
    Skeletal muscle biopsy typically shows subsarcolemmal and intermyofibrillar
    accumulations of extralysosomal (non-membrane-bound) glycogen accompanied by
    absent histochemical stain for phosphofructokinase activity.
  evidence:
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The muscle biopsy shows increased non–membrane bound glycogen, and there
      is a histochemical enzyme stain available for PFK activity.
    explanation: Describes increased non-membrane-bound glycogen and histochemical PFK staining on muscle biopsy.
  - reference: PMID:27303362
    reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients with Tarui disease showed in muscle electron microscopic
      analysis extra lysosomal glycogen accumulations.
    explanation: Confirms extralysosomal glycogen accumulation by electron microscopy in genetically confirmed Tarui disease.
- name: Diastase-resistant polyglucosan bodies in skeletal muscle
  description: >-
    In addition to normal beta-glycogen particles, muscle biopsies — particularly
    from older patients or those with late-onset fixed weakness — can contain
    amylopectin-like inclusions that resist diastase/alpha-amylase digestion and
    consist ultrastructurally of fine granules and filaments characteristic of
    polyglucosan.
  evidence:
  - reference: PMID:26278982
    reference_title: Polyglucosan storage myopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Polyglucosan is an amylopectin-like polysaccharide associated with
      defective glycogen metabolism and, unlike normal glycogen, it is to some
      extent resistant to α-amylase digestion. It also has a characteristic
      fibrillar appearance under the electron microscope. Polyglucosan may
      aggregate into dense inclusions known as polyglucosan bodies.
    explanation: Defines the amylase/diastase-resistant and fibrillar ultrastructural properties of polyglucosan bodies in muscle.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presence – in addition to normal-looking glycogen – also of abnormal
      glycogen with the histochemical (diastase-resistance) and ultrastructural
      (fine granules and filaments instead of β-particles) features of polyglucosan
      was first noted in the muscle biopsy of two patients (48) and confirmed in a
      woman who had developed late-onset fixed weakness (49).
    explanation: Details the histochemical and ultrastructural features of polyglucosan storage in GSD VII skeletal muscle.
differential_diagnoses:
- name: Glycogen storage disease type V (McArdle disease)
  disease_term:
    preferred_term: glycogen storage disease V
    term:
      id: MONDO:0009293
      label: glycogen storage disease V
  description: >-
    McArdle disease (myophosphorylase deficiency, PYGM) is the most common muscle
    glycogenosis and shares childhood-onset exercise intolerance, muscle cramps,
    exertional rhabdomyolysis, myoglobinuria, and a flat acute venous lactate
    response. Unlike McArdle disease, GSD VII lacks a typical "second wind"
    phenomenon, worsens after immediate pre-exercise carbohydrate ("out-of-wind"
    phenomenon), features compensated hemolysis and occasional gouty arthritis from
    myogenic hyperuricemia, and shows a late post-exercise lactate rise with
    exceptionally high exercise ammonia levels.
  distinguishing_features:
  - Absence of a typical second-wind phenomenon and occasional gouty arthritis due to myogenic hyperuricemia in GSD VII
  - Compensated hemolysis in GSD VII (absent in PYGM deficiency) and symptom exacerbation rather than improvement after immediate pre-exercise carbohydrate
  - Low exercise lactate followed by a late post-exercise lactate rise and exceptionally high ammonia in GSD VII
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinically, PFK deficiency, first described in 1965 in a Japanese family
      (46), is indistinguishable from McArdle disease, except for the absence of
      a typical second wind phenomenon and for the occasional presence of gouty
      arthritis due to "myogenic hyperuricemia" (47).
    explanation: Identifies absence of a typical second-wind phenomenon and occasional myogenic hyperuricemia/gouty arthritis as clinical distinctions from McArdle disease.
  - reference: PMID:22995305
    reference_title: Altered allosteric regulation of muscle 6-phosphofructokinase causes Tarui disease.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Tarui disease is a glycogen storage disease (GSD VII) and characterized by
      exercise intolerance with muscle weakness and cramping, mild myopathy,
      myoglobinuria and compensated hemolysis. It is caused by mutations in the
      muscle 6-phosphofructokinase (Pfk).
    explanation: Supports compensated hemolysis as a characteristic feature of PFKM-related GSD VII.
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Immediate pre-exercise carbohydrate improves symptoms in the glycogenolytic
      defects (i.e., PYGM), but can exacerbate symptoms in glycolytic defects (i.e.,
      PFK).
    explanation: Contrasts the symptomatic worsening after immediate pre-exercise carbohydrate in PFK deficiency with the improvement seen in PYGM deficiency (McArdle disease).
  - reference: PMID:27303362
    reference_title: Unique Exercise Lactate Profile in Muscle Phosphofructokinase Deficiency (Tarui Disease); Difference Compared with McArdle Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, we show that Tarui disease is associated with low lactate
      levels during exercise with a late increase of lactate after exercise and
      exceptionally high ammonia levels during and after exercise. The
      particular lactate profile differentiates patients with Tarui disease from
      patients with McArdle disease and helps the clinician to choose proper
      genetic tests.
    explanation: Demonstrates that the late post-exercise lactate rise and high exercise ammonia profile differentiate Tarui disease from McArdle disease.
- name: Distal muscle glycolytic enzymopathies (PGK1, PGAM2, LDHA, ENO3, and ALDOA deficiencies)
  description: >-
    Deficiencies of glycolytic enzymes in the distal part of the glycolytic pathway —
    including phosphoglycerate kinase (PGK1), muscle phosphoglycerate mutase (PGAM2,
    GSD X), muscle lactate dehydrogenase (LDHA, GSD XI), beta-enolase (ENO3, GSD
    XIII), and aldolase A (ALDOA, GSD XII) — present with overlapping exercise
    intolerance, muscle cramps, and rhabdomyolysis, and are distinguished from PFKM
    deficiency by muscle enzyme assays, biopsy features, and molecular genetic testing.
  distinguishing_features:
  - X-linked inheritance (PGK1 on Xq13) with isolated or combined hemolytic anemia, myopathy, and central nervous system involvement (seizures, intellectual disability, stroke) in PGK1 deficiency
  - Frequent skeletal muscle tubular aggregates on muscle biopsy in PGAM2 deficiency (GSD X), which are not seen in other muscle glycogenoses
  evidence:
  - reference: PMID:18421897
    reference_title: "Tarui disease and distal glycogenoses: clinical and genetic update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other glycogenoses have been recognised in the distal part of the
      glycolytic pathway: these are infrequent but some may induce muscle
      cramps, exercise intolerance and rhabdomyolysis. Phosphoglycerate Kinase,
      Phosphoglycerate Mutase, Lactate Dehydrogenase, beta-Enolase and Aldolase
      A deficiencies have been described as distal glycogenoses.
    explanation: Places distal glycolytic enzymopathies as the primary clinical and biochemical differential diagnosis for Tarui disease.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PGK is a single polypeptide encoded by a gene (PGK1) on Xq13 and present in
      all tissues except spermatogenic cells. Although this enzyme is virtually
      ubiquitous, clinical presentations depend on the isolated or combined
      involvement of three tissues: erythrocytes (hemolytic anemia), skeletal
      muscle (exercise intolerance, cramps, myoglobinuria), and the central
      nervous system ([CNS] seizures, mental retardation, stroke).
    explanation: Documents X-linked inheritance (Xq13) and the triad of hemolytic anemia, myopathy, and central nervous system involvement in PGK1 deficiency.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most striking peculiarity of GSD X is its common association with
      tubular aggregates (TAs), which were seen in the muscle biopsies of 5
      patients (36%) whereas they have never been reported in other glycogenoses.
    explanation: Identifies tubular aggregates on muscle biopsy as a distinguishing histopathologic feature of PGAM2 deficiency (GSD X).
animal_models:
- name: Pfkm-null mouse
  species: Mouse
  genotype: Pfkm-/-
  description: >-
    Transgenic Pfkm-null mouse lacking the muscle phosphofructokinase subunit,
    which develops a severe multisystem phenotype that mimics the fatal infantile
    presentation more closely than the typical adult- or childhood-onset muscular
    form of human GSD VII.
  modeled_mechanisms:
  - target: PFKM Molecular Function Deficiency
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Models complete loss of PFKM enzymatic activity in vivo, but produces a
      severe infantile-like multisystem phenotype rather than the typical human
      exertional myopathy with compensated hemolysis.
    evidence:
    - reference: PMID:22106711
      reference_title: Progress and problems in muscle glycogenoses.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Because of the early onset, multisystem involvement, and lack of any
        molecular evidence of mutations in the PFKM gene, the infantile variant of
        phosphofructokinase deficiency appears to be a separate entity from GSD
        VII, and its genetic basis (or bases) remain to be clarified, despite
        evidence that a transgenic PFKM-null mouse mimics the infantile more than
        the typical muscular form of the human disease (58).
      explanation: Notes that the transgenic Pfkm-null mouse models PFKM deficiency but phenotypically mimics the severe infantile presentation more than typical muscular human GSD VII.
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Because of the early onset, multisystem involvement, and lack of any
      molecular evidence of mutations in the PFKM gene, the infantile variant of
      phosphofructokinase deficiency appears to be a separate entity from GSD
      VII, and its genetic basis (or bases) remain to be clarified, despite
      evidence that a transgenic PFKM-null mouse mimics the infantile more than
      the typical muscular form of the human disease (58).
    explanation: Documents the transgenic Pfkm-null mouse model of PFKM deficiency and its phenotypic divergence from typical human muscular GSD VII.

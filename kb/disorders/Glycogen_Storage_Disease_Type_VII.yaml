has_subtypes:
- name: Classic myopathic
  display_name: Classic childhood- or adult-onset exertional myopathic form
  description: >-
    The canonical presentation of Tarui disease, typically beginning in childhood
    or adolescence with exercise intolerance, painful muscle cramps, exertional
    myalgia, episodic rhabdomyolysis with myoglobinuria, compensated hemolytic
    anemia, and myogenic hyperuricemia.
  evidence:
  - reference: ORPHA:371
    reference_title: "Glycogen storage disease due to muscle phosphofructokinase deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare form of glycogen storage disease (GSD) characterized classically by
      exertional fatigue and muscular exercise intolerance. It occurs typically
      in childhood and adolescence.
    explanation: Orphanet defines the classic childhood- and adolescent-onset exertional myopathic presentation.
  - reference: PMID:18421897
    reference_title: "Tarui disease and distal glycogenoses: clinical and genetic update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, more than one hundred patients have been described with prominent
      clinical symptoms characterized by muscle cramps, exercise intolerance,
      rhabdomyolysis and myoglobinuria, often associated with haemolytic
      anaemia and hyperuricaemia.
    explanation: Summarizes the classic clinical syndrome across more than 100 reported patients.
- name: Late-onset myopathic
  display_name: Late-onset fixed myopathic form
  description: >-
    An adult-onset presentation characterized by slowly progressive fixed
    proximal or scapuloperoneal muscle weakness and atrophy, often accompanied
    by diastase-resistant polyglucosan bodies in skeletal muscle fibers, with
    mild or absent prior episodic cramps and myoglobinuria.
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The presence – in addition to normal-looking glycogen – also of abnormal
      glycogen with the histochemical (diastase-resistance) and ultrastructural
      (fine granules and filaments instead of β-particles) features of
      polyglucosan was first noted in the muscle biopsy of two patients (48) and
      confirmed in a woman who had developed late-onset fixed weakness (49).
    explanation: Documents the late-onset fixed weakness presentation and its association with muscle polyglucosan storage.
  - reference: PMID:39156960
    reference_title: "Case report: Comprehensive exploration of a novel PFKM mutation in glycogen storage disease Type VII."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by exercise intolerance, muscle cramps, myoglobinuria,
      compensatory hemolysis, and later onset de novo myasthenia and mild
      myopathy, contributing to its clinical heterogeneity and diagnostic
      challenges.
    explanation: Notes later-onset weakness and mild fixed myopathy within the clinical spectrum of GSD VII.
- name: Isolated hemolytic
  display_name: Hemolytic form without myopathy
  description: >-
    A non-myopathic or minimally symptomatic presentation in which patients
    manifest compensated hemolysis or chronic non-spherocytic hemolytic anemia
    due to partial erythrocyte phosphofructokinase deficiency without prominent
    skeletal muscle symptoms.
  evidence:
  - reference: PMID:6227635
    reference_title: Heterogeneity of the molecular lesions in inherited phosphofructokinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To define the molecular basis and pathogenesis of this enzymopathy, we
      investigated four unrelated individuals manifesting myopathy and hemolysis
      (glycogenosis type VII), isolated hemolysis, or no symptoms at all.
    explanation: Documents unrelated individuals with inherited PFK deficiency presenting with isolated hemolysis without myopathy.
- name: Fatal infantile
  display_name: Severe infantile multisystem form
  description: >-
    A historically described congenital or neonatal presentation with severe
    generalized hypotonia, congenital joint contractures, cardiomyopathy,
    respiratory failure, seizures, and cortical blindness. Because pathogenic
    PFKM variants have not been identified in reported infantile cases, whether
    this syndrome is allelic with PFKM-related GSD VII or represents a distinct
    genetic entity remains unresolved.
  evidence:
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The second riddle concerns the fatal infantile variant of GSD VII, reported
      in a dozen patients between 1987 and 2008. All infants were severely
      hypotonic at birth and a few developed joint contractures either in utero
      (51-53) or postnatally (54, 55).
    explanation: Describes the fatal infantile presentation attributed to GSD VII.
  - reference: PMID:30397902
    reference_title: Myopathies Related to Glycogen Metabolism Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There have been a few reports of a severe infantile form with weakness,
      epilepsy, cortical blindness, corneal clouding, and cardiomyopathy [ 70–73].
    explanation: Summarizes the multisystem features reported in the severe infantile form.
  - reference: PMID:22106711
    reference_title: Progress and problems in muscle glycogenoses.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Because of the early onset, multisystem involvement, and lack of any
      molecular evidence of mutations in the PFKM gene, the infantile variant of
      phosphofructokinase deficiency appears to be a separate entity from GSD
      VII, and its genetic basis (or bases) remain to be clarified, despite
      evidence that a transgenic PFKM-null mouse mimics the infantile more than
      the typical muscular form of the human disease (58).
    explanation: States that the infantile variant lacks molecular evidence of PFKM mutations and appears to be a separate entity from GSD VII rather than an established allelic subtype.
pathophysiology:
- name: PFKM Molecular Function Deficiency
  description: >-
    Pathogenic variants in PFKM reduce muscle phosphofructokinase activity, the
    initiating enzymatic defect in glycogen storage disease type VII.

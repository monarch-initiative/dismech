    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hydrolethalus and acrocallosal syndromes, two multiple malformation
      disorders with overlapping features that include polydactyly, brain
      abnormalities and cleft palate
    explanation: >-
      Establishes acrocallosal syndrome as the allelic, phenotypically
      overlapping disorder distinguishing the milder end of the KIF7 spectrum.
  - reference: PMID:27081521
    reference_title: "The many faces of KIF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Hydrolethalus can be considered a more severe form of ACS with a lethal
      brain phenotype encompassing hydrocephaly and anencephaly.
    explanation: >-
      Clarifies that HLS2 is distinguished from acrocallosal syndrome by its
      lethal brain phenotype (hydrocephaly and anencephaly).
- name: Hydrolethalus Syndrome 1
  description: >-
    Hydrolethalus syndrome 1 (HYLS1) is the genetically distinct, historically
    Finnish form of hydrolethalus with a near-identical lethal clinical
    malformation complex (hydrocephaly or anencephaly, occipital keyhole defect,
    micrognathia, cleft palate, and postaxial hand/preaxial foot polydactyly).
  distinguishing_features:
  - Biallelic pathogenic variants in HYLS1 (typically the Finnish founder missense variant p.Asp211Gly) rather than KIF7 distinguish HLS1 from HLS2 on molecular genetic testing.
  evidence:
  - reference: PMID:27081521
    reference_title: "The many faces of KIF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Hydrolethalus can be considered a more severe form of ACS with a lethal
      brain phenotype encompassing hydrocephaly and anencephaly. Mutations in
      KIF7 have been identified in patients with this phenotype, in addition to
      HYLS1.
    explanation: >-
      Confirms that the hydrolethalus clinical phenotype is genetically
      heterogeneous and caused by mutations in either HYLS1 (HLS1) or KIF7
      (HLS2).
- name: Joubert Syndrome
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  description: >-
    Joubert syndrome overlaps genetically and neuropathologically with HLS2: a
    subset of Joubert syndrome (JBTS12) is caused by biallelic KIF7 variants,
    and HLS2 fetuses can display midbrain-hindbrain malformation evocative of
    the molar tooth sign.
  distinguishing_features:
  - Postnatal viability with a predominant cerebellar vermis hypoplasia/molar tooth sign phenotype and absence of lethal hydrocephaly or exencephaly/anencephaly favor Joubert syndrome over HLS2.
  evidence:
  - reference: PMID:26648833
    reference_title: "Novel KIF7 Mutation in a Tunisian Boy with Acrocallosal Syndrome: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mutations in the KIF7 gene, encoding a molecule within the Sonic hedgehog
      (SHH) pathway, have been identified as causative for ACLS but also for the
      fatal hydrolethalus syndrome and some cases of Joubert syndrome.
    explanation: >-
      Documents the shared KIF7 genetic etiology across fatal hydrolethalus
      syndrome, acrocallosal syndrome, and Joubert syndrome.

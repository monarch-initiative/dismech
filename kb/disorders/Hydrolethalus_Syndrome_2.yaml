  description: >-
    Impaired cilium-dependent Hedgehog/GLI3R signaling during early
    neurodevelopment produces the hallmark CNS and craniofacial malformation
    complex of HLS2: in the index KIF7-mutant family, affected fetuses
    presented with either hydrocephaly (two of four fetuses) or exencephaly
    (two of four fetuses), widened ventricles with midbrain-hindbrain
    malformation evocative of the molar tooth sign, and cleft palate (two of
    four fetuses), along with corpus callosum agenesis across the KIF7 spectrum
    and anencephaly with an occipital keyhole defect and micrognathia in the
    broader hydrolethalus syndrome clinical definition. This malformation
    complex lies at the severe, perinatally lethal extreme of the KIF7
    ciliopathy spectrum.

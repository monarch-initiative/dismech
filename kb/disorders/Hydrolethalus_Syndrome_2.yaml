    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      HLS is an autosomal recessive lethal syndrome characterized by the
      association of postaxial polydactyly of the hands, preaxial polydactyly of
      the feet, micrognathia and hydrocephaly or anencephaly with a key-hole
      defect of the occipital bone
    explanation: >-
      Background clinical definition establishing that hydrolethalus syndrome is
      an autosomal recessive lethal malformation syndrome.
  - reference: DOI:10.1186/1750-1172-7-27
    reference_title: "A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      a regulator of Hedgehog signaling that has been recently found to be
      causing Joubert syndrome, fetal hydrolethalus and acrocallosal syndromes
    explanation: >-
      Identifies KIF7 as the recessive disease gene causing fetal hydrolethalus
      syndrome, within the broader autosomal recessive KIF7 ciliopathy spectrum.
  - reference: PMID:27081521
    reference_title: "The many faces of KIF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation with the disease was confirmed for all three mutations within
      the respective families.
    explanation: >-
      Confirms autosomal recessive family segregation of homozygous truncating
      KIF7 mutations (including c.2896_2897del) across consanguineous families in
      the KIF7 ciliopathy spectrum.
prevalence:
- population: Published clinical estimates
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Hydrolethalus syndrome 2 is an exceedingly rare disorder; the KIF7-mutant
    fetal hydrolethalus phenotype was delineated in 2011 in four affected
    fetuses from a consanguineous Algerian family, and only a small number of
    cases have been reported since, typically diagnosed prenatally or at
    autopsy. The phenotype lies at the perinatally lethal end of the KIF7
    spectrum. Hydrolethalus syndrome 1 (HYLS1) is the historically Finnish,
    genetically distinct form; HLS2 denotes the KIF7-related form.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First, we studied an Algerian consanguineous family (family 1; Fig. 1)
      with four affected fetuses (Table 1) with hydrocephaly (two out of four
      fetuses), exencephaly (two out of four fetuses), postaxial polydactyly of
      the hands, hallux duplication and a cleft palate in two out of four cases.
    explanation: >-
      Documents the original KIF7-related fetal hydrolethalus kindred comprising
      four affected fetuses from a single consanguineous family, supporting the
      ultra-rare literature case count.
  - reference: PMID:27081521
    reference_title: "The many faces of KIF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Hydrolethalus can be considered a more severe form of ACS with a lethal
      brain phenotype encompassing hydrocephaly and anencephaly. Mutations in
      KIF7 have been identified in patients with this phenotype, in addition to
      HYLS1.
    explanation: >-
      Confirms that KIF7-related hydrolethalus (HLS2) is a rare, severe lethal
      form within the KIF7 ciliopathy spectrum distinct from HYLS1.

name: Hydrolethalus Syndrome 2
creation_date: "2026-06-16T20:00:00Z"
category: Mendelian
synonyms:
- HLS2
- hydrolethalus syndrome type 2
description: >-
  Hydrolethalus syndrome 2 (HLS2) is a rare, autosomal recessive, perinatally
  lethal multiple-malformation disorder caused by biallelic mutations in KIF7,
  the human ortholog of Drosophila Costal2 and a cilium-tip regulator of the
  Sonic hedgehog (SHH) pathway. It sits at the severe, frequently lethal end of
  the KIF7-related ciliopathy spectrum that also encompasses acrocallosal
  syndrome (a milder allelic disorder) and a subset of Joubert syndrome. In the
  original KIF7-mutant HLS2 family, affected fetuses presented with severe
  midline brain malformations — either hydrocephaly or exencephaly (two of four
  fetuses each), widened ventricles with midbrain-hindbrain malformation
  evocative of the molar tooth sign, and corpus callosum agenesis on the
  shared KIF7 spectrum — together with postaxial hand polydactyly, preaxial
  foot polydactyly (hallux duplication), and cleft palate (two of four
  fetuses); anencephaly with an occipital keyhole defect and micrognathia are
  additional features included from the broader hydrolethalus syndrome clinical
  definition. Mechanistically, KIF7 dysfunction deregulates GLI
  transcription-factor output and impairs GLI3 processing into its repressor
  form (GLI3-R) in the primary cilium, derailing the tightly dosed Hedgehog
  signaling that patterns the midline brain, limbs, and face; affected fetuses
  are stillborn, terminated for lethal anomalies, or die shortly after birth.

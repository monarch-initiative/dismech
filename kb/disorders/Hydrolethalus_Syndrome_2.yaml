  downstream:
  - target: Impaired GLI3 Repressor Processing and Deregulated GLI Target Expression
    causal_link_type: DIRECT
    description: >-
      Loss of KIF7 function at the primary cilium tip directly impairs
      proteolytic processing of full-length GLI3 (GLI3-FL) into its
      transcriptional repressor isoform (GLI3-R), increasing the GLI3-FL:GLI3-R
      ratio and derepressing GLI1/GLI2/GLI3 target genes.
    evidence:
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we show deregulation of most GLI transcription factor targets and
        impaired GLI3 processing in tissues from individuals with KIF7 mutations
      explanation: >-
        Directly links KIF7 mutations in patient tissues to impaired GLI3
        processing and deregulation of GLI transcription factor targets.
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We found an increase in the GLI3-FL:GLI3-R ratio in fibroblasts from
        both cases (Fig. 3c,d), indicating a similar biological function of KIF7
        in human and mouse to ensure normal levels of Gli3-R production.
      explanation: >-
        Patient fibroblast immunoblotting demonstrates an increased
        GLI3-FL:GLI3-R ratio resulting from KIF7 deficiency.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIF7, the human ortholog of Drosophila Costal2, is a key component of the
      Hedgehog signaling pathway
    explanation: >-
      Identifies KIF7 as a core Hedgehog pathway component (Costal2 ortholog),
      establishing the molecular basis of the HLS2 mechanism.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data show the role of KIF7 in human primary cilia, especially in the
      Hedgehog pathway through the regulation of GLI targets, and expand the
      clinical spectrum of ciliopathies
    explanation: >-
      Places HLS2 within the primary-cilium Hedgehog-signaling ciliopathy
      spectrum, supporting conformance to the ciliopathy module Hedgehog node.
  - reference: PMID:27081521
    reference_title: "The many faces of KIF7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      the gene that encodes a component of the kinesin complex of anterograde
      intraflagellar transport in the cilia
    explanation: >-
      Establishes KIF7 as a component of the anterograde intraflagellar
      transport machinery of the cilium, linking the molecular lesion to the
      ciliary compartment.
  - reference: PMID:34705483
    reference_title: "Hedgehog-induced ciliary trafficking of kinesin-4 motor KIF7 requires intraflagellar transport but not KIF7's microtubule binding."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vertebrates, Hedgehog signaling requires the primary cilium, and KIF7
      and Gli transcription factors accumulate at the cilium tip in response to
      Hedgehog activation
    explanation: >-
      Experimental cell-biological evidence demonstrating that KIF7 and GLI
      transcription factors co-accumulate at the primary cilium tip upon
      Hedgehog pathway activation.
- name: Impaired GLI3 Repressor Processing and Deregulated GLI Target Expression
  description: >-
    In patient fetal tissues and fibroblasts lacking functional KIF7,
    proteolytic processing of full-length GLI3 into the GLI3-R transcriptional
    repressor is impaired, elevating the GLI3-FL:GLI3-R ratio and causing
    widespread upregulation of direct and secondary transcriptional targets of
    GLI1, GLI2, and GLI3. Because developmental patterning of the neural tube,
    dorsal telencephalic midline, craniofacial primordia, and limb buds depends
    on precise gradients of GLI3 repressor versus activator activity, this
    transcriptional deregulation drives both the lethal CNS/craniofacial
    malformations and limb polydactyly of HLS2.

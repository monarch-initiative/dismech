genetic:
- name: KIF7 Mutations
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KIF7
    term:
      id: hgnc:30497
      label: KIF7
  notes: >-
    Biallelic (homozygous or compound heterozygous) loss-of-function mutations
    in KIF7 (15q26.1) cause hydrolethalus syndrome 2. KIF7 encodes the human
    ortholog of Drosophila Costal2, a cilium-tip kinesin-4 regulator of the
    Sonic hedgehog pathway. In the original HLS2 family (family 1), homozygosity
    for a 2-bp deletion in exon 15 (c.2896_2897del, p.Ala966Profs*81) segregated
    with fetal hydrolethalus; notably, the identical homozygous variant was also
    found in a 14-year-old boy with acrocallosal syndrome (ACLS-N1) and in a
    4-year-old boy with mild corpus callosum dysgenesis and intellectual
    disability without overt ciliopathy signs (PMID:27081521, Case 3),
    demonstrating marked phenotypic variability for the same truncating allele.
  variants:
  - name: c.2896_2897del (p.Ala966Profs*81)
    gene:
      preferred_term: KIF7
      term:
        id: hgnc:30497
        label: KIF7
    description: >-
      Homozygous deletion of the first two base pairs of exon 15 of KIF7
      (c.2896_2897del, p.Ala966Profs*81), potentially affecting splicing and
      resulting in premature truncation within the coiled-coil/cargo domain,
      first identified in the consanguineous Algerian family (family 1) with
      four affected HLS2 fetuses. The identical homozygous truncating allele was
      also identified in a 14-year-old boy with liveborn acrocallosal syndrome
      (individual ACLS-N1 in PMID:21552264) and in a 4-year-old boy born to
      consanguineous parents (Case 3 in PMID:27081521) who presented with mild
      dysgenesis of the corpus callosum, facial dysmorphism, and intellectual
      disability without overt signs of ciliopathy, demonstrating that this
      single homozygous allele spans both the perinatally lethal HLS2 and mild
      living ends of the KIF7 spectrum.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequencing of the 19 exons of KIF7 (Supplementary Table 2) in HLS family
        1 identified a homozygous deletion of the first two base-pairs of exon
        15 (c.2896_2897del, p.Ala966Profs*81) potentially affecting splicing.
      explanation: >-
        Identifies the causative homozygous KIF7 frameshift/splice-site deletion
        in the index HLS2 family.
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is noteworthy that individual ACLS-N1, a 14 year boy, carries the
        same p.Ala966Profs*81 homozygous alteration found in the lethal HLS
        family. Therefore, no genotype-phenotype correlation can be made at this
        time.
      explanation: >-
        Demonstrates that the same homozygous p.Ala966Profs*81 allele found in
        the lethal HLS2 family also occurs in a viable 14-year-old boy with
        acrocallosal syndrome.
    - reference: PMID:27081521
      reference_title: "The many faces of KIF7."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In Case 3, autozygome analysis revealed KIF7 as a candidate gene and
        sequencing confirmed the presence of a homozygous trunscating mutation
        (NM_198525.2:c.2896_2897 del, p.Ala966Profs*81) (Figure 2).
      explanation: >-
        Documents the same homozygous c.2896_2897del (p.Ala966Profs*81) variant
        in Case 3, a 4-year-old boy with mild corpus callosum dysgenesis and
        intellectual disability without overt signs of ciliopathy, showing that
        this allele spans the lethal and mild ends of the KIF7 spectrum.
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report mutations in KIF7 in individuals with hydrolethalus and
      acrocallosal syndromes, two multiple malformation disorders with
      overlapping features that include polydactyly, brain abnormalities and
      cleft palate
    explanation: >-
      Original report identifying KIF7 as the causative gene for fetal
      hydrolethalus syndrome (HLS2) and the allelic acrocallosal syndrome.
  - reference: DOI:10.1186/1750-1172-7-27
    reference_title: "A mutation in KIF7 is responsible for the autosomal recessive syndrome of macrocephaly, multiple epiphyseal dysplasia and distinctive facial appearance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      We report the first missense homozygous disease-causing mutation in KIF7
      and expand the clinical spectrum associated with mutations in this gene
    explanation: >-
      Confirms KIF7 as a recessive disease gene with an expanding allelic
      ciliopathy spectrum that includes fetal hydrolethalus.
diagnosis:
- name: Prenatal and Molecular Diagnosis
  description: >-
    Hydrolethalus syndrome 2 is suspected prenatally from the combination of a
    severe midline brain malformation (hydrocephaly, exencephaly, or anencephaly
    with absent midline structures), postaxial hand and preaxial foot
    polydactyly, and cleft palate, and is confirmed by identification of
    biallelic KIF7 pathogenic variants. Diagnosis is commonly established
    prenatally by ultrasonography and molecular genetic testing or confirmed by
    fetal neuropathological examination at autopsy.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of the 19 exons of KIF7 (Supplementary Table 2) in HLS family
      1 identified a homozygous deletion of the first two base-pairs of exon 15
      (c.2896_2897del, p.Ala966Profs*81) potentially affecting splicing.
    explanation: >-
      Demonstrates molecular confirmation of HLS2 by sequencing all coding exons
      of KIF7.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuropathological examination of fetus 3 showed widened ventricles and
      midbrain-hindbrain malformation evocative of the molar tooth sign (MTS).
    explanation: >-
      Supports the diagnostic role of fetal neuropathological examination in
      characterizing the CNS malformations of HLS2.

        impaired GLI3 processing in tissues from individuals with KIF7 mutations
      explanation: >-
        Links the GLI target deregulation and GLI3 processing defect in patient
        tissues to the developmental malformation syndrome.
    - reference: PMID:30445565
      reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To understand the pathological mechanisms involved in CC defects in this
        syndrome, we took advantage of a previously described Kif7-/- mouse
        model to demonstrate that in addition to polydactyly and neural tube
        closure defects, these mice present CC agenesis with characteristic
        Probst bundles, thus recapitulating major ACLS features.
      explanation: >-
        Demonstrates in Kif7-null mice that KIF7/GLI3R deficiency produces
        neural tube closure defects and corpus callosum agenesis.
  - target: Aberrant Anterior-Posterior Limb Bud Patterning
    causal_link_type: DIRECT
    description: >-
      Reduced GLI3-R repressor levels in the anterior limb bud disrupt
      anterior-posterior digit specification, leading to preaxial and postaxial
      polydactyly.
    evidence:
    - reference: PMID:30445565
      reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        decreased GLI3R signaling is fully responsible for the ACLS features in
        these mice, as all phenotypes are rescued by increasing GLI3R activity.
      explanation: >-
        Genetic rescue in Kif7-null mice proves that decreased GLI3-R signaling
        causes the limb polydactyly and developmental anomalies.

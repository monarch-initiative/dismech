  description: >-
    Acrocallosal syndrome (ACLS) is the milder, viable allelic KIF7-related
    disorder, sharing corpus callosum agenesis, postaxial hand and preaxial foot
    polydactyly, and craniofacial dysmorphism with HLS2.
  distinguishing_features:
  - Postnatal survival with developmental delay/intellectual disability and absence of lethal hydrocephaly or exencephaly/anencephaly distinguish acrocallosal syndrome from HLS2.
  evidence:
  - reference: PMID:21552264

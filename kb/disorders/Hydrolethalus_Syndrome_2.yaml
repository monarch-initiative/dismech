  description: >-
    Severe fetal hydrocephaly with absent midline structures is a defining CNS
    malformation of hydrolethalus syndrome 2, observed in two of the four
    affected fetuses in the index KIF7 family as an alternative cranial
    presentation to the exencephaly observed in the other two fetuses rather
    than co-occurring in the same fetus.

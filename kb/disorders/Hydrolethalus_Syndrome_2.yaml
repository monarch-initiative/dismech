    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To gain insight into the pathophysiological mechanism underlying the
      clinical features of individuals with KIF7 mutations, we undertook a
      transcriptome-wide analysis using total RNA extracted from lung tissue
      from three affected fetuses from family 1 and three age-matched controls.
    explanation: >-
      Documents transcriptome-wide profiling directly in lung tissue from three
      HLS2 fetuses carrying homozygous KIF7 truncating mutations.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This analysis showed that most known direct and/or secondary targets of
      GLI1, GLI2 and/or GLI3 were significantly (P < 0.05) upregulated in cases
      compared to age-matched controls
    explanation: >-
      Demonstrates significant upregulation of direct and secondary GLI1/2/3
      target genes in HLS2 fetal tissue due to loss of KIF7-mediated repression.
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found an increase in the GLI3-FL:GLI3-R ratio in fibroblasts from both
      cases (Fig. 3c,d), indicating a similar biological function of KIF7 in
      human and mouse to ensure normal levels of Gli3-R production.
    explanation: >-
      Confirms that human KIF7 deficiency increases the GLI3-FL:GLI3-R ratio by
      impairing production of the GLI3-R repressor isoform.
  - reference: PMID:30445565
    reference_title: "Altered GLI3 and FGF8 signaling underlies acrocallosal syndrome phenotypes in Kif7 depleted mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In both humans and mice, KIF7 depletion leads to abnormal GLI3 processing
      and over-activation of SHH target genes.
    explanation: >-
      Corroborates across human and mouse systems that KIF7 loss impairs GLI3
      processing and overactivates SHH target genes.
  downstream:
  - target: Lethal Midline Brain and Craniofacial Malformation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Defective GLI3 repressor production and overactivation of SHH target genes
      disrupt neural tube closure, dorsal telencephalic midline patterning,
      midbrain-hindbrain morphogenesis, and palatal shelf fusion, producing the
      lethal CNS and craniofacial malformation complex of HLS2.
    evidence:
    - reference: PMID:21552264
      reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

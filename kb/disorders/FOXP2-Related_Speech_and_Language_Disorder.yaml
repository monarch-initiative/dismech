genetic:
- name: FOXP2
  gene_term:
    preferred_term: FOXP2
    term:
      id: hgnc:13875
      label: FOXP2
  association: Causative
  presence: Positive
  relationship_type: CAUSATIVE
  notes: >-
    FOXP2 (7q31) encodes a forkhead-box transcription factor. Pathogenic
    alleles are heterozygous: forkhead-domain missense substitutions (R553H in
    the KE family), nonsense and frameshift variants (R328X), whole- or
    partial-gene deletions at 7q31 (larger deletions add features from
    neighbouring genes and have been proposed as a contiguous gene deletion
    syndrome), translocations with a breakpoint in FOXP2, and loss of the
    paternal allele through maternal uniparental disomy of chromosome 7. Among
    probands ascertained for verbal dyspraxia, FOXP2 coding variants are a small
    minority, and rare missense variants need functional testing: of three
    previously uncharacterised variants proposed as causal, only one altered
    FOXP2 function in cell assays. ClinGen classifies FOXP2 as Definitive for autosomal dominant
    specific language disorder (MONDO:0016226), the parent class of this entry,
    so that assertion is not recorded as a validity tier for this MONDO term.
  evidence:
  - reference: PMID:11586359
    reference_title: "A forkhead-domain gene is mutated in a severe speech and language disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we identify a point mutation in affected members of the KE
      family that alters an invariant amino-acid residue in the forkhead
      domain. Our findings suggest that FOXP2 is involved in the developmental
      process that culminates in speech and language.
    explanation: >-
      Identifies FOXP2 as the causal gene in the KE family.
  - reference: PMID:15877281
    reference_title: "Identification of FOXP2 truncation as a novel cause of developmental speech and language deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report investigations of the entire coding region of FOXP2,
      including alternatively spliced exons, in 49 probands affected with verbal
      dyspraxia. We detected variants that alter FOXP2 protein sequence in three
      probands.
    explanation: >-
      FOXP2 protein-altering variants were found in 3 of 49 probands with
      verbal dyspraxia, showing FOXP2 explains a minority of cases.
  - reference: PMID:17033973
    reference_title: "Absence of a paternally inherited FOXP2 gene in developmental verbal dyspraxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We characterize 13 patients with DVD--5 with hemizygous paternal
      deletions spanning the FOXP2 gene, 1 with a translocation interrupting
      FOXP2, and the remaining 7 with maternal uniparental disomy of chromosome
      7 (UPD7), who were also given a diagnosis of Silver-Russell Syndrome (SRS).
    explanation: >-
      Documents deletion, translocation and maternal UPD7 as structural routes
      to FOXP2-related verbal dyspraxia.
  - reference: PMID:16470794
    reference_title: "Speech and language impairment and oromotor dyspraxia due to deletion of 7q31 that involves FOXP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that this patient, together with others reported in the
      literature, may define a new contiguous gene deletion syndrome
      encompassing the 7q31-FOXP2 region.
    explanation: >-
      Larger 7q31 deletions including FOXP2 may constitute a contiguous gene
      deletion syndrome.
  - reference: PMID:22106036
    reference_title: "Phenotype of FOXP2 haploinsufficiency in a mother and son."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 1.57 Mb deletion on chromosome 7q31 was detected by array comparative
      genomic hybridization (aCGH). In addition to FOXP2, the patients' deletion
      involves two other genes, MDFIC and PPP1R3A, neither of which has been
      associated with speech or language disorders.
    explanation: >-
      A small 7q31 deletion largely restricted to FOXP2 informs the
      haploinsufficiency phenotype.
  - reference: PMID:27933109
    reference_title: "Functional characterization of rare FOXP2 variants in neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Of three variants that have been suggested to cause speech/language
      disorder, but never before been characterized, only one showed functional
      effects. For the other two, we found no effects on protein function in any
      assays, suggesting that they are incidental to the phenotype.
    explanation: >-
      Rare FOXP2 missense variants found in affected people are not all
      pathogenic, so variant interpretation needs functional or segregation
      support.
  - reference: PMID:40714749
    reference_title: "Speech and Language Disorders Associated With 7q31 Deletions Implicating FOXP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All verbal individuals had childhood apraxia of speech (5/5, 100%).
    explanation: >-
      Large 7q31 deletions including FOXP2 produce childhood apraxia of speech
      in every verbal individual.
  - reference: PMID:40714749
    reference_title: "Speech and Language Disorders Associated With 7q31 Deletions Implicating FOXP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The larger the deletion size, the poorer an individual's language skills
      (p = 0.03, p < 0.05).
    explanation: >-
      Larger deletions add severity beyond FOXP2 loss, consistent with a
      contiguous gene contribution.

diagnosis:
- name: Molecular Genetic Testing for FOXP2
  description: >-
    The diagnosis is established in a proband with suggestive findings
    (childhood apraxia of speech, often with orofacial dyspraxia and language
    impairment disproportionate to nonverbal ability) and a heterozygous
    pathogenic or likely pathogenic FOXP2 variant. Because deletions, including
    paternal 7q31 deletions, are a recognised cause, copy-number analysis such
    as chromosomal microarray is part of testing, and maternal UPD7 should be
    considered in an affected individual with Silver-Russell syndrome.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Positive
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of FOXP2-SLD is established in a proband with suggestive
      findings and a heterozygous pathogenic (or likely pathogenic) variant in
      FOXP2 identified by molecular genetic testing.
    explanation: >-
      GeneReviews states the molecular diagnostic criterion.
  - reference: PMID:38366112
    reference_title: "Genetic architecture of childhood speech disorder: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical genetic testing for should now be implemented for individuals
      with CAS, given its high diagnostic rate, which parallels many other
      neurodevelopmental disorders where this testing is already standard of
      care.
    explanation: >-
      Recommends genetic testing for children with CAS, the route by which
      FOXP2 and other monogenic causes are found.
- name: Speech-Language Pathology Assessment for Childhood Apraxia of Speech
  description: >-
    The speech diagnosis is made clinically by a speech-language pathologist
    using the consensus features of childhood apraxia of speech: inconsistent
    errors on consonants and vowels across repeated productions, lengthened and
    impaired coarticulatory transitions, and inappropriate prosody. Nonword
    repetition with complex articulation discriminated affected from unaffected
    KE-family members.
  presence: Positive
  evidence:
  - reference: PMID:29845607
    reference_title: "Interventions for childhood apraxia of speech."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Consensus has been reached that three core features have diagnostic
      validity: (1) inconsistent error production on both consonants and vowels
      across repeated productions of syllables or words; (2) lengthened and
      impaired coarticulatory transitions between sounds and syllables; and (3)
      inappropriate prosody (ASHA 2007).
    explanation: >-
      States the consensus diagnostic features of CAS from all causes, applied
      to the FOXP2 speech phenotype.

treatments:
- name: Speech and Language Therapy
  description: >-
    Individualised speech-language pathology is the main intervention, including
    nonverbal supports or alternative means of communication where needed, with
    follow-up standardised speech and language assessment. Trial evidence for
    specific CAS programmes is limited and comes from children with idiopathic
    CAS rather than FOXP2-SLD; there is no FOXP2-specific trial.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_phenotypes:
  - preferred_term: Childhood apraxia of speech
    term:
      id: HP:0011098
      label: Speech apraxia
  - preferred_term: Language impairment
    term:
      id: HP:0002463
      label: Language impairment
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This ideally involves multidisciplinary care by speech-language
      pathologists (to individualize care, which may include use of nonverbal
      support or alternative means of communication)
    explanation: >-
      GeneReviews recommends individualised speech-language pathology care.
  - reference: PMID:29845607
    reference_title: "Interventions for childhood apraxia of speech."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is limited evidence that, when delivered intensively, both the NDP-3
      and ReST may effect improvement in word accuracy in 4- to 12-year-old
      children with CAS
    explanation: >-
      The single randomised trial, in idiopathic CAS, supports intensive
      programme-based speech therapy; applying it to FOXP2-SLD is an inference.
  - reference: PMID:40714749
    reference_title: "Speech and Language Disorders Associated With 7q31 Deletions Implicating FOXP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Speech and language impairments emphasize the need for early, tailored
      speech therapy, including literacy and AAC interventions, for individuals
      with 7q31 deletions.
    explanation: >-
      For the 7q31 deletion route, recommends early tailored speech therapy with
      literacy and augmentative and alternative communication support.

- name: Occupational Therapy
  description: >-
    Occupational therapy addresses fine motor impairments.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  target_phenotypes:
  - preferred_term: Fine motor impairment
    term:
      id: HP:0007010
      label: Poor fine motor coordination
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      developmental pediatricians (to help guide parents through appropriate
      behavior management strategies and individualized education plans),
      occupational therapists (to address fine motor impairments)
    explanation: >-
      GeneReviews recommends occupational therapy for fine motor impairment.

- name: Mental Health Support
  description: >-
    Mental health specialists address anxiety and depression, with periodic
    review of mental health as part of surveillance. Bound to the generic
    psychotherapy action because the chapter does not name a specific therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: mental health care
    term:
      id: NCIT:C15308
      label: Psychotherapy
  target_phenotypes:
  - preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  - preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and mental health specialists (to address issues such as anxiety and
      depression, which can occur)
    explanation: >-
      GeneReviews recommends mental health care for anxiety and depression.

- name: Genetic Counseling
  description: >-
    Each sib of a proband whose parent carries the variant has a 50% risk of
    inheriting it; prenatal and preimplantation testing are possible once the
    familial variant is known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If a parent of the proband has the FOXP2 pathogenic variant identified in
      the proband, the risk to sibs of inheriting the pathogenic variant is 50%.
    explanation: >-
      GeneReviews gives the recurrence risk used in counseling.

animal_models:
- name: Foxp2 R552H knock-in mouse (Groszer)
  species: Mus musculus
  genotype: Foxp2 R552H heterozygous
  description: >-
    ENU-derived mice carrying the arginine-to-histidine substitution equivalent
    to the KE-family R553H. Heterozygotes have overtly normal brain structure
    and baseline motor ability but slower motor-skill learning and abnormal
    striatal and cerebellar synaptic plasticity; homozygotes have reduced
    cerebellar growth and die postnatally.
  publication: PMID:18328704
  modeled_mechanisms:
  - target: Impaired Striatal and Cerebellar Synaptic Plasticity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Heterozygous mice show abnormal striatal and cerebellar synaptic
      plasticity, and in vivo striatal recordings show aberrant activity and
      inverted firing-rate modulation during skill learning.
    limitations: >-
      Mouse cortico-basal ganglia circuitry has no speech output, so the link to
      the human speech phenotype is by analogy; plasticity has not been measured
      in affected humans.
    evidence:
    - reference: PMID:21876543
      reference_title: >-
        An aetiological Foxp2 mutation causes aberrant striatal activity and
        alters plasticity during skill learning.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We uncovered abnormally high ongoing striatal activity in mice carrying
        an identical mutation to that of the KE family.
      explanation: >-
        In vivo striatal activity is abnormal in mice carrying the KE-family
        mutation.
  - target: Impaired Motor Sequence Learning
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Heterozygotes learn running-wheel and rotarod skills more slowly despite
      normal baseline motor ability.
    limitations: >-
      Motor-skill learning on wheels and rotarods stands in for orofacial motor
      sequence learning for speech, which mice do not perform.
    evidence:
    - reference: PMID:18328704
      reference_title: >-
        Impaired synaptic plasticity and motor learning in mice with a point
        mutation implicated in human speech deficits.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Crucially, although their baseline motor abilities appear to be
        identical to wild-type littermates, R552H heterozygotes display
        significant deficits in species-typical motor-skill learning,
        accompanied by abnormal synaptic plasticity in striatal and cerebellar
        neural circuits.
      explanation: >-
        Heterozygous mice have impaired motor-skill learning with normal
        baseline motor ability.
  evidence:
  - reference: PMID:18328704
    reference_title: >-
      Impaired synaptic plasticity and motor learning in mice with a point
      mutation implicated in human speech deficits.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this study, we generated mice carrying an identical point mutation to
      that of the KE family, yielding the equivalent arginine-to-histidine
      substitution in the Foxp2 DNA-binding domain.
    explanation: >-
      Describes the construct of the model.
- name: Foxp2 R552H knock-in mouse (Fujita)
  species: Mus musculus
  genotype: Foxp2 R552H knock-in (heterozygous and homozygous)
  description: >-
    An independently generated R552H knock-in line. Homozygotes show immature
    cerebellar development with poorly arborised Purkinje cells, severe
    ultrasonic vocalization and motor impairment, and early death;
    heterozygotes show modest ultrasonic vocalization impairments with altered
    call qualities. A separate study of R552H and null (S321X) pups found that
    heterozygotes' innate vocalizations did not differ from wild type, so the
    vocal phenotype in heterozygotes is not consistent across studies.
  publication: PMID:18287060
  modeled_mechanisms:
  - target: Abnormal Corticostriatal and Olivocerebellar Circuit Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Homozygous mice show immature cerebellar development and Purkinje cell
      dendritic abnormalities.
    limitations: >-
      The cerebellar maldevelopment is a homozygous phenotype; heterozygotes,
      the genotype matching human patients, have overtly normal brain structure,
      and the human imaging changes are subtle grey matter differences rather
      than gross maldevelopment.
    evidence:
    - reference: PMID:18287060
      reference_title: >-
        Ultrasonic vocalization impairment of Foxp2 (R552H) knockin mice related
        to speech-language disorder and abnormality of Purkinje cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous Foxp2 (R552H)-KI mice showed reduced weight, immature
        development of the cerebellum with incompletely folded folia, Purkinje
        cells with poor dendritic arbors and less synaptophysin
        immunoreactivity, and achieved crisis stage for survival 3 weeks after
        birth.
      explanation: >-
        Documents cerebellar maldevelopment in homozygous mice.
  - target: Speech Motor Planning and Programming Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Ultrasonic vocalizations are used as a readout of vocal motor output;
      heterozygotes showed modest impairment in one study.
    limitations: >-
      Mouse pup ultrasonic vocalizations are largely innate rather than learned,
      so they are a proxy for speech motor output rather than a model of speech
      motor programming, and a second study found no difference in heterozygous
      R552H pups.
    evidence:
    - reference: PMID:18287060
      reference_title: >-
        Ultrasonic vocalization impairment of Foxp2 (R552H) knockin mice related
        to speech-language disorder and abnormality of Purkinje cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At postnatal day 10, these mice also showed severe ultrasonic
        vocalization (USV) and motor impairment, whereas the heterozygous Foxp2
        (R552H)-KI mice exhibited modest impairments.
      explanation: >-
        Reports vocalization impairment, severe in homozygotes and modest in
        heterozygotes.
    - reference: PMID:20132318
      reference_title: "The structure of innate vocalizations in Foxp2-deficient mouse pups."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygous mutants did not differ from wild-types in any of the
        measures that we studied (R552H ) or in only a few (S321X ), which were
        in the range of differences routinely observed for different mouse
        strains.
      explanation: >-
        An independent study found no vocalization difference in heterozygous
        R552H pups.
  evidence:
  - reference: PMID:18287060
    reference_title: >-
      Ultrasonic vocalization impairment of Foxp2 (R552H) knockin mice related
      to speech-language disorder and abnormality of Purkinje cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we generated a knockin (KI) mouse for Foxp2 (R552H) ... corresponding to
      the human FOXP2 (R553H) mutation, by homologous recombination.
    explanation: >-
      Describes the construct of the model.
- name: FoxP2 knockdown in zebra finch Area X
  species: Taeniopygia guttata
  genotype: Lentiviral RNAi knockdown of FoxP2 in basal ganglia nucleus Area X
  description: >-
    Reducing FoxP2 in the songbird basal ganglia nucleus required for song
    learning causes incomplete and inaccurate imitation of tutor song, with
    abnormally variable syllable structure and duration, a parallel to the
    inconsistent word production of childhood apraxia of speech in a species
    with learned vocalization.
  publication: PMID:18052609
  modeled_mechanisms:
  - target: Speech Motor Planning and Programming Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Basal ganglia FoxP2 knockdown impairs auditory-guided vocal motor
      learning, producing variable syllable output.
    limitations: >-
      Birdsong is a learned vocalization without linguistic content, and the
      knockdown is regional and post-hatching rather than a constitutional
      heterozygous lesion.
    evidence:
    - reference: PMID:18052609
      reference_title: >-
        Incomplete and inaccurate vocal imitation after knockdown of FoxP2 in
        songbird basal ganglia nucleus Area X.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockdown of FoxP2 resulted in an incomplete and inaccurate imitation of
        tutor song.
      explanation: >-
        FoxP2 knockdown in songbird basal ganglia impairs vocal imitation.
  evidence:
  - reference: PMID:18052609
    reference_title: >-
      Incomplete and inaccurate vocal imitation after knockdown of FoxP2 in
      songbird basal ganglia nucleus Area X.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The acoustic structure and the duration of adult song syllables were
      abnormally variable, similar to word production in children with DVD.
    explanation: >-
      The knockdown phenotype parallels the variable word production of
      developmental verbal dyspraxia.

differential_diagnoses:
- name: Childhood Apraxia of Speech of Other Monogenic or Copy-Number Causes
  description: >-
    Childhood apraxia of speech as a clinical diagnosis is genetically
    heterogeneous: about a third of children ascertained for CAS have a
    plausible monogenic or copy-number cause, many in transcriptional
    regulators other than FOXP2 (for example SETBP1, CDK13, EBF3, MEIS2, POGZ,
    DDX3X), usually as part of a wider neurodevelopmental condition. FOXP2-SLD
    is distinguished by its relatively speech-specific phenotype.
  evidence:
  - reference: PMID:32345733
    reference_title: "Severe childhood speech disorder: Gene discovery highlights transcriptional dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 11/34 (32%) probands, we identified highly plausible pathogenic single
      nucleotide (n = 10; CDK13, EBF3, GNAO1, GNB1, DDX3X, MEIS2, POGZ, SETBP1,
      UPF2, ZNF142) or copy number (n = 1; 5q14.3q21.1 locus) variants in novel
      genes or loci for CAS.
    explanation: >-
      Shows CAS arises from many genes other than FOXP2.
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we confirm that the consequences of FOXP2 dysfunction remain relatively
      specific to speech disorder, as compared with other recently identified
      monogenic conditions associated with CAS.
    explanation: >-
      The relative speech specificity distinguishes FOXP2-SLD from other
      monogenic CAS.
- name: SETBP1 Haploinsufficiency Disorder
  disease_term:
    preferred_term: SETBP1 haploinsufficiency disorder
    term:
      id: MONDO:0014482
      label: intellectual disability, autosomal dominant 29
  description: >-
    SETBP1 loss-of-function variants cause prominent childhood apraxia of
    speech, but usually with intellectual disability, motor delay, hypotonia
    and behavioural features; testing distinguishes the two.
  evidence:
  - reference: PMID:32345733
    reference_title: "Severe childhood speech disorder: Gene discovery highlights transcriptional dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 11/34 (32%) probands, we identified highly plausible pathogenic single
      nucleotide (n = 10; CDK13, EBF3, GNAO1, GNB1, DDX3X, MEIS2, POGZ, SETBP1,
      UPF2, ZNF142) or copy number (n = 1; 5q14.3q21.1 locus) variants in novel
      genes or loci for CAS.
    explanation: >-
      SETBP1 is among the genes found in children ascertained for CAS.
- name: FOXP1 Syndrome
  disease_term:
    preferred_term: FOXP1 syndrome
    term:
      id: MONDO:0013352
      label: intellectual disability-severe speech delay-mild dysmorphism syndrome
  description: >-
    FOXP1, the paralog and heterodimerization partner of FOXP2, causes a
    syndromic disorder with global developmental delay, intellectual disability
    and a complex, dysarthria-dominant speech impairment, whereas FOXP2-SLD is a
    primary oromotor verbal dyspraxia without obligate intellectual disability.
  distinguishing_features:
  - Global developmental delay and intellectual disability
  - Dysmorphic features
- name: Proximal 16p11.2 Microdeletion Syndrome
  disease_term:
    preferred_term: proximal 16p11.2 microdeletion syndrome
    term:
      id: MONDO:0012756
      label: proximal 16p11.2 microdeletion syndrome
  description: >-
    The recurrent 16p11.2 microdeletion can present with persistent childhood
    apraxia of speech and is identified by chromosomal microarray.
  evidence:
  - reference: PMID:22909774
    reference_title: "Childhood Apraxia of Speech (CAS) in two patients with 16p11.2 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report clinical findings that extend the phenotype of the ~550 kb
      16p11.2 microdeletion syndrome to include a rare, severe, and persistent
      pediatric speech sound disorder termed Childhood Apraxia of Speech (CAS).
    explanation: >-
      Childhood apraxia of speech occurs in the 16p11.2 microdeletion syndrome.
- name: Primary Progressive Apraxia of Speech
  disease_term:
    preferred_term: primary progressive apraxia of speech
    term:
      id: MONDO:0017803
      label: primary progressive apraxia of speech
  description: >-
    A neurodegenerative apraxia of speech with adult onset and progression after
    normal speech development, unlike the developmental, non-progressive course
    of FOXP2-SLD.
  distinguishing_features:
  - Adult onset after normal speech development
  - Progressive course

notes: >-
  File and entry name follow the gene-prefixed "<GENE>-Related" convention of
  the knowledge base and the GeneReviews chapter title, because the entry is
  scoped to FOXP2-caused disease even though the bound MONDO label is the broader
  clinical term childhood apraxia of speech. FOXP1_Syndrome already refers to
  this disorder as FOXP2-Related Speech and Language Disorder in its
  differential diagnoses. A GeneReviews chapter exists (PMID:27336128) and its
  abstract is the phenotype baseline; all features it lists are represented
  above.

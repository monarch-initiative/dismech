inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    FOXP2-SLD is autosomal dominant. About half of diagnosed individuals carry a
    de novo variant and the remainder inherited it from an affected or
    variably affected parent, as in the KE family where the disorder segregates
    over three generations. When the lesion is loss of the paternal allele
    (paternal 7q31 deletion or maternal uniparental disomy 7), the absence of
    paternal FOXP2 rather than the dominant-transmission pattern explains the
    phenotype.
  expressivity: VARIABLE
  parent_of_origin_effect: >-
    Loss of the paternal FOXP2 copy (paternal deletion or maternal UPD7) causes
    the disorder, and one study reported the maternal allele to be relatively
    underexpressed. A parent-of-origin effect is not established: a mother and
    son with a maternally transmitted deletion were both affected, and a later
    allele-specific expression study (PMID:23033221, which has no abstract to
    quote) reported that FOXP2 is not imprinted.
  evidence:
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FOXP2-SLD is inherited in an autosomal dominant manner. About half of
      individuals diagnosed with FOXP2-SLD have the disorder as the result of a
      de novo pathogenic variant.
    explanation: >-
      GeneReviews states the mode of inheritance and the approximate de novo
      fraction.
  - reference: PMID:11586359
    reference_title: "A forkhead-domain gene is mutated in a severe speech and language disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have studied a unique three-generation pedigree, KE, in which a severe
      speech and language disorder is transmitted as an autosomal-dominant
      monogenic trait.
    explanation: >-
      The founding KE-family pedigree shows autosomal dominant monogenic
      transmission.
  - reference: PMID:2332125
    reference_title: "An extended family with a dominantly inherited speech disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A three-generation family is described in which 16 members have a severe
      developmental verbal dyspraxia. Inheritance is autosomal dominant, with
      full penetrance.
    explanation: >-
      The original clinical description of the KE family reports dominant
      inheritance with full penetrance in that pedigree.
  - reference: PMID:27572252
    reference_title: >-
      FOXP2 variants in 14 individuals with developmental speech and language
      disorders broaden the mutational and clinical spectrum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations occurred de novo in four families and were inherited from an
      affected parent in the other four.
    explanation: >-
      An independent series shows both de novo and inherited transmission in
      equal proportion.
  - reference: PMID:17033973
    reference_title: "Absence of a paternally inherited FOXP2 gene in developmental verbal dyspraxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The data also point to a role for differential parent-of-origin expression
      of FOXP2 in human speech development.
    explanation: >-
      Supports the parent-of-origin effect recorded for the paternal-allele-loss
      route.
  - reference: PMID:22106036
    reference_title: "Phenotype of FOXP2 haploinsufficiency in a mother and son."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Speech severity findings for the boy were not consistent with the
      hypothesis that loss of maternal FOXP2 should be relatively benign.
    explanation: >-
      A maternally transmitted FOXP2 deletion produced severe apraxia of speech,
      qualifying the parent-of-origin effect.

prevalence:
- population: Worldwide (reported literature)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence of FOXP2-SLD has been published. The 2023
    characterisation of 28 individuals from 17 families roughly doubled the
    number of published families. The figure of about 0.1% often quoted for
    childhood apraxia of speech refers to the clinical diagnosis from all
    causes, most of which do not involve FOXP2, and is not used here as the
    prevalence of this entry.
  evidence:
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous disruptions of FOXP2 were the first identified molecular
      cause for severe speech disorder: childhood apraxia of speech (CAS), and
      yet few cases have been reported, limiting knowledge of the condition.
    explanation: >-
      States that few FOXP2 cases have been reported, the basis for the
      literature-count measure and ultra-rare class.
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we phenotyped 28 individuals from 17 families with pathogenic
      FOXP2-only variants (12 loss-of-function, five missense variants; 14
      males; aged 2 to 62 years).
    explanation: >-
      The largest characterised cohort is 28 individuals from 17 families.

pathophysiology:
- name: Loss of the Paternal FOXP2 Allele
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    One route to FOXP2 deficiency is absence of the paternal copy, through a
    paternally derived 7q31 deletion or translocation, or through maternal
    uniparental disomy of chromosome 7 (which also causes Silver-Russell
    syndrome). Losing the paternal allele lowers FOXP2 dosage; whether the
    maternal allele is also relatively underexpressed (imprinting) is disputed,
    since one study found maternal underexpression and a later one found FOXP2
    is not imprinted (PMID:23033221, no abstract).
  genes:
  - preferred_term: FOXP2
    term:
      id: hgnc:13875
      label: FOXP2
  evidence:
  - reference: PMID:17033973
    reference_title: "Absence of a paternally inherited FOXP2 gene in developmental verbal dyspraxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these individuals with DVD, all 12 for whom parental DNA was available
      showed absence of a paternal copy of FOXP2.
    explanation: >-
      Absence of paternal FOXP2 was shared by every patient with parental DNA,
      across deletions, a translocation and maternal UPD7.
  - reference: PMID:17033973
    reference_title: "Absence of a paternally inherited FOXP2 gene in developmental verbal dyspraxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results indicate that absence of paternal FOXP2 is the cause of DVD in
      patients with SRS with maternal UPD7.
    explanation: >-
      Identifies maternal UPD7 as a cause of developmental verbal dyspraxia
      through loss of the paternal FOXP2 allele.
  downstream:
  - target: FOXP2 Haploinsufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17033973
      reference_title: "Absence of a paternally inherited FOXP2 gene in developmental verbal dyspraxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using quantitative real-time polymerase chain reaction, we show the
        maternally inherited FOXP2 to be comparatively underexpressed.
      explanation: >-
        Reports maternal-allele underexpression as the reason loss of the
        paternal copy reduces FOXP2 dosage; this imprinting claim was not
        replicated, but the loss of one copy itself is sufficient for the edge.

- name: FOXP2 Haploinsufficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous loss of FOXP2 transcription-factor function is the shared
    lesion. The KE-family R553H substitution alters an invariant residue of the
    forkhead DNA-binding domain and severely impairs nuclear localization and DNA
    binding; the R328X nonsense allele yields an unstable, mostly cytoplasmic
    product without transactivation capacity; whole- or partial-gene deletions
    and translocation breakpoints remove or disrupt one copy.
  genes:
  - preferred_term: FOXP2
    term:
      id: hgnc:13875
      label: FOXP2
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11586359
    reference_title: "A forkhead-domain gene is mutated in a severe speech and language disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that the gene FOXP2, which encodes a putative transcription
      factor containing a polyglutamine tract and a forkhead DNA-binding domain,
      is directly disrupted by the translocation breakpoint in CS. In addition,
      we identify a point mutation in affected members of the KE family that
      alters an invariant amino-acid residue in the forkhead domain.
    explanation: >-
      The discovery paper identifies FOXP2 disruption by a translocation and by
      a forkhead-domain point mutation in the KE family.
  - reference: PMID:16984964
    reference_title: "Functional genetic analysis of mutations implicated in a human speech and language disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of the R553H forkhead-box substitution, found in all affected
      members of a large three-generation family, indicated that it severely
      affects FOXP2 function, chiefly by disrupting nuclear localization and
      DNA-binding properties.
    explanation: >-
      Cell-based assays show that R553H is a loss-of-function allele.
  - reference: PMID:16984964
    reference_title: "Functional genetic analysis of mutations implicated in a human speech and language disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The R328X truncation mutation, segregating with speech/language disorder
      in a second family, yields an unstable, predominantly cytoplasmic product
      that lacks transactivation capacity.
    explanation: >-
      Cell-based assays show the truncating allele is also loss of function.
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FOXP2-related speech and language disorder (FOXP2-SLD) is caused by
      heterozygous FOXP2 pathogenic variants (including whole- or partial-gene
      deletions).
    explanation: >-
      GeneReviews defines the disorder by heterozygous FOXP2 disruption,
      including deletions.
  downstream:
  - target: Dysregulation of FOXP2 Neural Target Genes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17999362
      reference_title: >-
        High-throughput analysis of promoter occupancy reveals direct neural
        targets of FOXP2, a gene mutated in speech and language disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We focus on a subset of downstream targets identified by this approach,
        showing that altered FOXP2 levels yield significant changes in
        expression in our cell-based models and that FOXP2 binds in a specific
        manner to consensus sites within the relevant promoters.
      explanation: >-
        Changing FOXP2 levels changes expression of its directly bound targets
        in neuron-like cells.
    - reference: PMID:17999362
      reference_title: >-
        High-throughput analysis of promoter occupancy reveals direct neural
        targets of FOXP2, a gene mutated in speech and language disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we demonstrate significant quantitative differences in target
        expression in embryonic brains of mutant mice, mediated by specific in
        vivo Foxp2-chromatin interactions.
      explanation: >-
        Target expression is also altered in embryonic brains of Foxp2-mutant
        mice.
  - target: Abnormal Corticostriatal and Olivocerebellar Circuit Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12876151
      reference_title: >-
        FOXP2 expression during brain development coincides with adult sites of
        pathology in a severe speech and language disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        These data support a role for FOXP2 in the development of corticostriatal
        and olivocerebellar circuits involved in motor control. We find
        intriguing concordance between regions of early expression and later
        sites of pathology suggested by neuroimaging.
      explanation: >-
        Developmental expression mapping in human and mouse brain places FOXP2
        in the circuits that are abnormal in affected individuals; the causal
        link is inferred from the concordance rather than shown directly.
  - target: Impaired Striatal and Cerebellar Synaptic Plasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18328704
      reference_title: >-
        Impaired synaptic plasticity and motor learning in mice with a point
        mutation implicated in human speech deficits.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Crucially, although their baseline motor abilities appear to be
        identical to wild-type littermates, R552H heterozygotes display
        significant deficits in species-typical motor-skill learning,
        accompanied by abnormal synaptic plasticity in striatal and cerebellar
        neural circuits.
      explanation: >-
        Mice heterozygous for the KE-family substitution have abnormal striatal
        and cerebellar synaptic plasticity.

- name: Dysregulation of FOXP2 Neural Target Genes
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    FOXP2 binds promoters in neural chromatin and either represses or activates
    the genes it occupies; its targets include genes acting in synaptic
    plasticity, neurodevelopment, neurotransmission and axon guidance. FOXP2
    binds and strongly down-regulates CNTNAP2, a neurexin-family gene expressed
    in developing cortex. Which targets mediate the speech phenotype is not
    established, so no edge is drawn from this node to the circuit-level nodes.
  genes:
  - preferred_term: CNTNAP2
    term:
      id: hgnc:13830
      label: CNTNAP2
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:17999362
    reference_title: >-
      High-throughput analysis of promoter occupancy reveals direct neural
      targets of FOXP2, a gene mutated in speech and language disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data indicate that FOXP2 has dual functionality, acting to either
      repress or activate gene expression at occupied promoters. The identified
      targets suggest roles in modulating synaptic plasticity, neurodevelopment,
      neurotransmission, and axon guidance
    explanation: >-
      Describes FOXP2's dual regulatory activity and the functional classes of
      its direct neural targets.
  - reference: PMID:18987363
    reference_title: "A functional genetic link between distinct developmental language disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that FOXP2 binds to and dramatically down-regulates CNTNAP2, a
      gene that encodes a neurexin and is expressed in the developing human
      cortex.
    explanation: >-
      Identifies CNTNAP2 as a directly repressed FOXP2 target.

- name: Abnormal Corticostriatal and Olivocerebellar Circuit Development
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    FOXP2 is expressed during brain development in the cortical plate, basal
    ganglia, thalamus, inferior olives and cerebellum. Affected KE-family
    members have bilateral grey matter reductions in the caudate nucleus,
    cerebellum (notably lobule VIIa Crus I) and inferior frontal gyrus, with
    increased grey matter in the planum temporale, and underactivate Broca's
    area, its right homolog and the putamen during language tasks. Caudate and
    Crus I volumes correlate with oral praxis and nonword repetition
    performance, linking these motor-related circuits to the speech phenotype.
  locations:
  - preferred_term: caudate nucleus
    term:
      id: UBERON:0001873
      label: caudate nucleus
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: inferior frontal gyrus
    term:
      id: UBERON:0002998
      label: inferior frontal gyrus
  - preferred_term: putamen
    term:
      id: UBERON:0001874
      label: putamen
  biological_processes:
  - preferred_term: striatum development
    term:
      id: GO:0021756
      label: striatum development
    modifier: ABNORMAL
  - preferred_term: cerebellum development
    term:
      id: GO:0021549
      label: cerebellum development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12599277
    reference_title: Bilateral brain abnormalities associated with dominantly inherited verbal and orofacial dyspraxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most significant findings were reduced grey matter density
      bilaterally in the caudate nucleus, the cerebellum, and the left and right
      inferior frontal gyrus in the affected members.
    explanation: >-
      Voxel-based morphometry localizes bilateral grey matter abnormalities to
      corticostriatal and cerebellar regions in affected KE-family members.
  - reference: PMID:14555953
    reference_title: "Language fMRI abnormalities associated with FOXP2 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected members showed significant underactivation relative to the
      unaffected members in Broca's area and its right homolog, as well as in
      other cortical language-related regions and in the putamen.
    explanation: >-
      Functional imaging shows underactivation of inferior frontal and striatal
      regions.
  - reference: PMID:30460543
    reference_title: >-
      Neocerebellar Crus I Abnormalities Associated with a Speech and Language
      Disorder Due to a Mutation in FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also show that right Crus I volume correlates with left and total
      caudate nucleus volumes in affected KE members, and that right and total
      Crus I volumes predict the performance of affected members in non-word
      repetition and non-verbal orofacial praxis.
    explanation: >-
      Links cerebellar and caudate structure to each other and to the speech
      and orofacial praxis phenotype, implicating cerebello-basal ganglia loops.
  downstream:
  - target: Abnormal caudate nucleus morphology
    causal_link_type: DIRECT
  - target: Abnormal cerebellum morphology
    causal_link_type: DIRECT
  - target: Speech Motor Planning and Programming Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:11872605
      reference_title: "MRI analysis of an inherited speech and language disorder: structural brain abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These results thus provide further evidence of a relationship between
        the abnormal development of this nucleus and the impairments in
        oromotor control and articulation reported in the KE family.
      explanation: >-
        Caudate volume correlates with oral praxis and nonword repetition,
        relating abnormal caudate development to the articulation deficit.
    - reference: PMID:9770548
      reference_title: "Neural basis of an inherited speech and language disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The genetic mutation or deletion in this region has resulted in the
        abnormal development of several brain areas that appear to be critical
        for both orofacial movements and sequential articulation, leading to
        marked disruption of speech and expressive language.
      explanation: >-
        States the causal reading that abnormal development of motor-related
        areas disrupts sequential articulation and speech.

- name: Impaired Striatal and Cerebellar Synaptic Plasticity
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In mice heterozygous for the KE-family-equivalent Foxp2 R552H substitution,
    brain structure is overtly normal, but synaptic plasticity in striatal and
    cerebellar circuits is abnormal and striatal neurons show abnormally high
    ongoing activity and inverted firing-rate modulation while a motor skill is
    acquired. The human counterpart has not been measured directly.
  cell_types:
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: ABNORMAL
  evidence:
  - reference: PMID:21876543
    reference_title: >-
      An aetiological Foxp2 mutation causes aberrant striatal activity and
      alters plasticity during skill learning.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, there were dramatic alterations in striatal plasticity during
      the acquisition of a motor skill, with most neurons in mutants showing
      negative modulation of firing rate, starkly contrasting with the
      predominantly positive modulation seen in control animals.
    explanation: >-
      In vivo recordings show altered striatal plasticity during skill learning
      in mice carrying the KE-family mutation.
  downstream:
  - target: Impaired Motor Sequence Learning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21876543
      reference_title: >-
        An aetiological Foxp2 mutation causes aberrant striatal activity and
        alters plasticity during skill learning.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results indicate that FOXP2 is critical for the function of striatal
        circuits in vivo, which are important not only for speech but also for
        other striatal-dependent skills.
      explanation: >-
        Connects the striatal circuit dysfunction to impaired
        striatal-dependent skill learning in the mutant mice.

- name: Impaired Motor Sequence Learning
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    A deficit in learning and producing sequences of movement, or in procedural
    learning, has been proposed as the common basis of the verbal and nonverbal
    deficits of affected KE-family members. Foxp2 R552H heterozygous mice have
    normal baseline motor ability but learn species-typical motor skills more
    slowly.
  biological_processes:
  - preferred_term: motor learning
    term:
      id: GO:0061743
      label: motor learning
    modifier: DECREASED
  evidence:
  - reference: PMID:11872604
    reference_title: "Behavioural analysis of an inherited speech and language disorder: comparison with acquired aphasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that, in the affected family members, the verbal and
      non-verbal deficits arise from a common impairment in the ability to
      sequence movement or in procedural learning.
    explanation: >-
      Proposes a movement-sequencing or procedural-learning deficit as the core
      impairment in humans.
  - reference: PMID:18328704
    reference_title: >-
      Impaired synaptic plasticity and motor learning in mice with a point
      mutation implicated in human speech deficits.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Affected individuals are characterized by deficits in the learning and
      production of complex orofacial motor sequences underlying fluent speech
      and display impaired linguistic processing for both spoken and written
      language.
    explanation: >-
      The mouse paper's background summarises the human phenotype as a deficit
      in learning complex orofacial motor sequences.
  downstream:
  - target: Speech Motor Planning and Programming Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12876151
      reference_title: >-
        FOXP2 expression during brain development coincides with adult sites of
        pathology in a severe speech and language disorder.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Overall, this study provides support for the hypothesis that impairments
        in sequencing of movement and procedural learning might be central to
        the FOXP2-related speech and language disorder.
      explanation: >-
        States the hypothesis that a movement-sequencing and procedural-learning
        impairment underlies the speech disorder.

- name: Speech Motor Planning and Programming Deficit
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The core deficit is in planning or programming the sequential orofacial
    movements of speech: production, sequencing, timing and stress of sounds and
    the sequencing of sounds into syllables and syllables into words. It extends
    to nonspeech orofacial praxis and interferes secondarily with phonology,
    grammar and literacy.
  evidence:
  - reference: PMID:9770548
    reference_title: "Neural basis of an inherited speech and language disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigation of the three-generation KE family, half of whose members are
      affected by a pronounced verbal dyspraxia, has led to identification of
      their core deficit as one involving sequential articulation and orofacial
      praxis.
    explanation: >-
      Identifies the core deficit as one of sequential articulation and
      orofacial praxis.
  - reference: PMID:11872604
    reference_title: "Behavioural analysis of an inherited speech and language disorder: comparison with acquired aphasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The score on a test of repetition of non-words with complex articulation
      patterns successfully discriminated the affected and unaffected family
      members.
    explanation: >-
      Nonword repetition with complex articulation separates affected from
      unaffected members, a behavioural marker of the motor programming deficit.
  downstream:
  - target: Childhood Apraxia of Speech
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27336128
      reference_title: "FOXP2-Related Speech and Language Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The core phenotype of FOXP2-SLD is childhood apraxia of speech (CAS), a
        disorder of speech motor programming or planning that affects the
        production, sequencing, timing, and stress of sounds, and the accurate
        sequencing of speech sounds into syllables and syllables into words.
      explanation: >-
        Defines the clinical phenotype as the expression of the motor
        programming deficit.
  - target: Orofacial Dyspraxia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7846081
      reference_title: >-
        Praxic and nonverbal cognitive deficits in a large family with a
        genetically transmitted speech and language disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the inherited disorder has a broad phenotype which transcends impaired
        generation of syntactical rules and includes a striking articulatory
        impairment as well as defects in intellectual, linguistic, and orofacial
        praxic functions generally.
      explanation: >-
        The deficit extends beyond speech to orofacial praxis in general.
  - target: Receptive and Expressive Language Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27336128
      reference_title: "FOXP2-Related Speech and Language Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CAS also interferes nonselectively with multiple other aspects of
        language, including phonology, grammar, and literacy.
      explanation: >-
        GeneReviews attributes the wider language and literacy deficits to the
        apraxic speech disorder.
    - reference: PMID:11872604
      reference_title: "Behavioural analysis of an inherited speech and language disorder: comparison with acquired aphasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Alternatively, the articulation deficit, which itself might give rise to
        a host of other language deficits, is separate from a more general verbal
        and non-verbal developmental delay.
      explanation: >-
        Offers the articulation deficit as a possible source of the other
        language deficits, as one of two competing accounts.
  - target: Reading and Spelling Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

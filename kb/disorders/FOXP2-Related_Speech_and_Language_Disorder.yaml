phenotypes:
- category: Speech
  name: Childhood Apraxia of Speech
  description: >-
    Developmental verbal dyspraxia: inconsistent errors on consonants and
    vowels, lengthened and disrupted coarticulatory transitions, and
    inappropriate prosody, arising from impaired speech motor planning rather
    than weakness. It is the most common speech diagnosis in FOXP2-SLD and
    persists into adulthood, with some speech sounds never acquired.
  phenotype_term:
    preferred_term: Childhood apraxia of speech
    term:
      id: HP:0011098
      label: Speech apraxia
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Speech disorders were prevalent (23/25, 92%) and CAS was most common
      (22/25, 88%), with similar speech presentations across English and German.
      Speech was still impaired in adulthood, and some speech sounds (eg, 'th',
      'r', 'ch', 'j') were never acquired.
    explanation: >-
      CAS in 22 of 25 assessed individuals supports VERY_FREQUENT, and the
      deficit persists into adulthood.
  - reference: PMID:15877281
    reference_title: "Identification of FOXP2 truncation as a novel cause of developmental speech and language deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multiple members of the well-studied KE family, a heterozygous missense
      mutation in FOXP2 causes problems in sequencing muscle movements required
      for articulating speech (developmental verbal dyspraxia), accompanied by
      wider deficits in linguistic and grammatical processing.
    explanation: >-
      Describes developmental verbal dyspraxia as the presenting speech
      phenotype in the KE family.
  - reference: PMID:15877281
    reference_title: "Identification of FOXP2 truncation as a novel cause of developmental speech and language deficits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One such variant is a heterozygous nonsense mutation that yields a
      dramatically truncated protein product and cosegregates with speech and
      language difficulties in the proband, his affected sibling, and their
      mother.
    explanation: >-
      A truncating FOXP2 allele found by screening probands with verbal
      dyspraxia cosegregates with the speech disorder in a second family.

- category: Speech
  name: Orofacial Dyspraxia
  description: >-
    Difficulty planning or programming nonspeech oral movements on command
    (oral-motor or orofacial dyspraxia). Several individuals with FOXP2
    deletions have been unable to cough, sneeze or laugh spontaneously.
  phenotype_term:
    preferred_term: Orofacial dyspraxia
    term:
      id: HP:0007301
      label: Oromotor apraxia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disordered oral motor movements were present both on speech (eg, say
      'pataka') and non-speech tasks (eg, bite then blow) (92.9%, 13/14)
    explanation: >-
      Disordered oral motor movement on speech and non-speech tasks in 13 of 14
      assessed individuals supports VERY_FREQUENT.
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional findings in FOXP2-SLD can include oral-motor dyspraxia
      (difficulty planning or programming oral movements on command)
    explanation: >-
      GeneReviews lists oral-motor dyspraxia among the features.
  - reference: PMID:22106036
    reference_title: "Phenotype of FOXP2 haploinsufficiency in a mother and son."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the patients were not able to laugh, cough, or sneeze
      spontaneously, replicating findings reported for two other FOXP2 cases and
      a potential diagnostic sign of nonsyndromic apraxia of speech.
    explanation: >-
      Reports the inability to laugh, cough or sneeze spontaneously as a
      recurrent oromotor sign in FOXP2 haploinsufficiency.
  - reference: PMID:16470794
    reference_title: "Speech and language impairment and oromotor dyspraxia due to deletion of 7q31 that involves FOXP2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This child has a severe communication disorder with evidence of oromotor
      dyspraxia, dysmorphic features, and mild developmental delay. She is
      unable to cough, sneeze, or laugh spontaneously.
    explanation: >-
      Oromotor dyspraxia in a child with a paternal 7q31 deletion including
      FOXP2.

- category: Speech
  name: Dysarthria
  description: >-
    Dysarthria can accompany the apraxic speech disorder but is infrequent and
    mild, typically mixed nasality and harsh vocal quality, and far less common
    than childhood apraxia of speech. This separates FOXP2-SLD from FOXP1
    syndrome, whose speech profile is dysarthria-dominant.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysarthria (8.3%, 2/24) was infrequent and mild in severity, characterised
      as mixed nasality and harsh vocal quality (IDs 4a, 5).
    explanation: >-
      Dysarthria in 2 of 24 individuals supports OCCASIONAL.
  - reference: PMID:36328423
    reference_title: >-
      In-depth characterisation of a cohort of individuals with missense and
      loss-of-function variants disrupting FOXP2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysarthria was far less common than CAS, clarifying the role of FOXP2 in
      the planning and programming of movement sequences, as supported by
      animal models.
    explanation: >-
      The cohort contrasts the rarity of dysarthria with the predominance of
      CAS.
  - reference: PMID:27336128
    reference_title: "FOXP2-Related Speech and Language Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additional findings in FOXP2-SLD can include oral-motor dyspraxia
      (difficulty planning or programming oral movements on command);
      dysarthria; moderate-to-severe receptive and expressive language disorder
    explanation: >-
      GeneReviews lists dysarthria among the additional findings.

- category: Language
  name: Receptive and Expressive Language Impairment
  description: >-
    Receptive and expressive language disorder ranging from mild to severe,
    including grammatical deficits. Language ability is incongruent with

name: Meester-Loeys Syndrome
creation_date: "2026-09-06T19:15:00Z"
category: Mendelian
description: >-
  Meester-Loeys syndrome (MRLS) is an X-linked syndromic aortopathy caused by
  loss-of-function variants in BGN, which encodes biglycan, a small
  leucine-rich proteoglycan of the arterial extracellular matrix. Biglycan
  binds and sequesters latent TGF-beta in the matrix, so losing it releases
  TGF-beta signalling: affected aortic wall shows increased nuclear pSMAD2.

  Two features make it worth separating from the Marfan and Loeys-Dietz
  syndromes it overlaps clinically. First, the histology is unusual for an
  aneurysm syndrome: elastic fibres are *preserved* rather than fragmented,
  which is the opposite of what a Marfan-like reading would predict. Second,
  the disease is not confined to the thoracic aorta. As the cohort grew from
  five probands to eighteen, aneurysms and dissections were found throughout
  the arterial tree, and cardiovascular disease was found coexisting with
  non-specific connective-tissue features such as joint hypermobility, so
  patients can be, and have been, labelled Ehlers-Danlos syndrome first.

  Dissections occur at young ages and males are affected more severely and
  more penetrantly than females. Only loss-of-function alleles are established:
  no pathogenic missense variant without an additional splice effect has been
  reported, and the discoverers recommend proving loss of function at RNA or
  protein level before calling a missense variant pathogenic.

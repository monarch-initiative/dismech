      explanation: ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel Strong classification (2026-02-06, SOP11) for BGN and Meester-Loeys syndrome (MONDO:0010515).
  notes: >-
    One reported male carries a deletion spanning the BGN coding sequence and
    the 5' untranslated region of the downstream gene ATP2B3, and has a more

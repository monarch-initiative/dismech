    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report an iPSC line (BBANTWi009-A) of a boy carrying a hemizygous BGN mutation (chrX:153502980-153530518del, GRCh38) causing MRLS."
    explanation: >-
      Establishes the line's existence, its genotype and its disease
      attribution, which is the whole of what this entry claims for it.
histopathology:
- name: Preserved elastic fibres with low to normal collagen content
  description: >-
    The finding that separates this disease from the classic TGF-beta
    vasculopathies it resembles clinically. The paper draws the contrast with
    both Marfan and Loeys-Dietz, where collagen content increases and elastic
    fibres break; in the MRLS probands the elastin was normal and collagen was
    low to normal. Of the evidence below, the first item is the staining
    description itself; the two that follow it are the paper's Results and
    Discussion statements of the contrast, the Results naming Loeys-Dietz only
    and the Discussion naming both syndromes.
    A mechanism routed only through TGF-beta would predict the opposite, so
    this is the histological constraint any account of the disease has to
    satisfy.
  finding_term:
    preferred_term: preserved elastic fibres with low to normal collagen content in the aortic wall
  evidence:
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The staining revealed low to normal collagen content; elastin fibers appeared normal"
    explanation: >-
      The direct histological description of the probands' aortic wall.
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is in contrast to what is observed in LDS individuals, in whom an increase in collagen production and fragmentation of elastic fibers are typically present"
    explanation: >-
      The comparator the finding is meaningful against, in the paper's own
      words, in its Results section. This sentence names Loeys-Dietz only;
      the Discussion sentence quoted next extends it to Marfan.
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is in contrast to what has been described for MFS and LDS aortic tissue, where an increase in collagen content and an increase in elastic fiber breaks are typically observed"
    explanation: >-
      The same contrast in the paper's Discussion, naming Marfan as well
      as Loeys-Dietz. This is the citation for the two-syndrome claim in
      the description.

diagnosis:
- name: BGN sequencing in aortopathy and in hypermobility syndromes
  description: >-
    The actionable diagnostic point is where to look, not how. A patient with
    joint hypermobility and a hypermobility-syndrome label may have MRLS, and
    the consequence of missing it is an unsurveilled aorta in a young male. The
    2025 family makes exactly this argument. Interpreting a BGN missense
    variant requires demonstrating loss of function at RNA, cDNA or protein
    level before calling it pathogenic.
  evidence:
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "underscores the importance of considering BGN testing in hypermobility syndromes to enable early surveillance and targeted management"
    explanation: >-
      Makes the case for BGN testing in hypermobility syndromes, and names
      early surveillance as the reason it matters.
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that this disorder should be considered in the differential diagnosis of joint hypermobility syndromes, particularly when there is any evidence of arterial involvement, even if mild"
    explanation: >-
      Gives the specific trigger for considering the diagnosis: hypermobility
      plus any arterial involvement, however mild.
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extensive analysis at RNA, cDNA, and/or protein level is recommended to prove a loss-of-function effect before determining the pathogenicity of identified BGN missense and non-canonical splice variants."
    explanation: >-
      The variant-interpretation recommendation, which is the practical
      consequence of no missense-only pathogenic allele having been found.
differential_diagnoses:
- name: Marfan syndrome
  description: >-
    Clear clinical overlap. Marfan is autosomal dominant FBN1 disease; MRLS is
    X-linked. Histology also differs: elastic fibres are preserved in MRLS,
    where medial degeneration with elastic fibre fragmentation is the Marfan
    picture. MRLS was found by resequencing a cohort of molecularly unexplained
    Marfan probands, so the overlap is not theoretical.
  evidence:
  - reference: PMID:34807424
    reference_title: "Meester-Loeys Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clear clinical overlap with Marfan syndrome and Loeys-Dietz syndrome is observed."
    explanation: >-
      States the overlap that makes these the first differentials.
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed targeted resequencing of 368 candidate genes in a cohort of 11 molecularly unexplained Marfan probands."
    explanation: >-
      Shows the gene was found among patients carrying a Marfan label, which is
      the strongest possible statement of how confusable they are.
- name: Loeys-Dietz syndrome
  description: >-
    Shares hypertelorism, skeletal features, early aortic dissection and
    TGF-beta pathway involvement. Separated by inheritance (autosomal dominant
    TGFBR1/2, SMAD3, TGFB2/3) and by molecular testing.
- name: Ehlers-Danlos syndromes
  description: >-
    The practically dangerous differential, because it is the one MRLS patients
    actually receive. Joint hypermobility plus musculoskeletal complaints in a
    young man reads as hypermobile EDS; the aneurysms are what should redirect
    the workup. The vascular EDS differential (COL3A1) matters separately
    because it also gives arterial rupture at young ages.
  evidence:
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index male, initially diagnosed with Ehlers-Danlos syndrome, had joint hypermobility, multiple visceral artery aneurysms, and recurrent musculoskeletal problems."
    explanation: >-
      A documented instance of the misdiagnosis this differential warns about.
- name: FLNA-related periventricular nodular heterotopia with Ehlers-Danlos features
  description: >-
    The other X-linked cause of thoracic aortic disease, and the only one known
    before BGN. Distinguished by the periventricular nodular heterotopia on
    neuroimaging.
  evidence:
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, the only known X-linked gene is FLNA, which is associated with the periventricular nodular heterotopia type of Ehlers-Danlos syndrome."
    explanation: >-
      Names the alternative X-linked cause and its distinguishing feature.
discussions:
- discussion_id: mrls_tgfbeta_tissue_discordance
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Increased TGF-beta Signaling in the Aortic Wall
  prompt: >-
    Is TGF-beta dysregulation in MRLS a property of the aortic wall
    specifically, and can patient dermal fibroblasts report it at all?
  rationale: >-
    The aortic-wall finding is replicated: increased nuclear pSMAD2 in 2017,
    TGF-beta/SMAD dysregulation in a second family in 2025. But in that same
    2025 study, reporter assays in cell lines expressing mutant biglycan showed
    *reduced* canonical Wnt and TGF-beta activity, and the patients' own dermal
    fibroblasts showed no consistent difference in nuclear beta-catenin or
    p-SMAD2/3 against controls. Three results, three directions. The most
    economical reading is that the signalling change is tissue-specific to the
    arterial media and that dermal fibroblasts are simply the wrong cell, which
    would matter because fibroblasts are the accessible tissue and the one the
    iPSC line is derived from. The alternative, that the increase is a
    downstream consequence of wall injury rather than a driver, is not
    excluded. The pathophysiology node states the observation and the review's
    own verdict that the functional consequences remain largely elusive, rather
    than asserting a mechanism.
  evidence:
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, patients' dermal fibroblasts did not show consistent differences in the nuclear abundance of β-catenin or p-SMAD2/3 compared to cells from controls."
    explanation: >-
      Refutes the expectation that the aortic-wall signalling change is
      detectable in patient fibroblasts, which is the discordance this
      discussion is about.
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "assays with reporter vectors revealed reduced canonical Wnt and TGF-β activity in cell lines expressing mutant biglycan"
    explanation: >-
      The reporter result, whose direction is opposite to the aortic-wall
      finding. Graded INDIRECT because it is an overexpression reporter assay in
      a heterologous cell line rather than a measurement in affected tissue.
- discussion_id: mrls_no_missense_only_alleles
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss-of-Function BGN Variants
  - genetic#BGN
  prompt: >-
    Is the absence of missense-only pathogenic BGN alleles a real constraint on
    the mechanism, or ascertainment?
  rationale: >-
    Across 18 probands, every pathogenic variant is truncating, splice-affecting
    or a deletion; not one is a missense change without an additional splice
    effect. If real, that says the disease requires absence of the protein
    rather than an altered one, and rules out a dominant-negative or
    gain-of-function contribution. But the group that reports it also
    recommends proving loss of function before calling a missense variant
    pathogenic, which is a filter that would systematically exclude any
    missense-only allele acting by another route. The 2025 family carries a
    "novel missense variant" in its title, which sharpens rather than settles
    the question. The entry records the observation without asserting the
    constraint.
notes: >-
  On the deep-research report. The entry was drafted from primary literature
  retrieved via PubMed, because the openscientist run had not returned; the
  report arrived before the pull request was opened and was reconciled into the
  entry, which is where the `treatments:` entry came from.

  `just preflight-dr` returned WARN: ATP2B3 is mentioned 11 times against 32
  for BGN. That is not a second disease leaking in, it is the contiguous-gene
  hypothesis for the one deletion patient, which this entry carries in the
  `genetic:` notes with `directness: INDIRECT`. The warning is a true positive
  about the report's content and a false alarm about entity confusion.

  The report's own Term Validation section flagged `UBERON:0035904`, which the
  report calls "ascending aorta" and UBERON calls *primary visual area, layer
  4*. No UBERON term is bound in this entry, so nothing was affected, but it is
  worth recording that the report proposed an anatomy term for the wrong
  anatomy. Two further flags in that section are false alarms from its own
  parsing rather than errors: it reports `HP:0000316` and `HP:0001371` as
  "named as a different term", where the report's name for each is a fragment
  of a quoted sentence rather than a proposed label. Both are bound correctly
  here.

  On where the reference metadata came from. The PubMed record for
  PMID:41465473 loses its italicised gene symbols when read through a metadata
  API: the title comes back as "in theGene" and the abstract as
  "consideringtesting". `just fetch-reference` produces a cache file with both
  intact, and the reference validator checks `reference_title` against that
  cache, so it catches the difference. Every title and snippet here is taken
  from the cache rather than from an API response.

  On what `treatments:` does and does not contain. It holds one entry,
  cardiovascular surveillance, because that is the only management step the
  MRLS literature states about MRLS. Beta blockade, losartan and prophylactic
  root replacement are the standard of care a patient will actually receive,
  and the deep-research report for this entry opens its treatment section by
  saying so explicitly: no MRLS-specific approved therapy or trial exists and
  management is extrapolated from heritable-TAAD, Marfan and Loeys-Dietz
  guidelines. Curating those here would attach disease-specific claims to
  citations that do not mention this disease, so they are deliberately absent.
  This is a real gap, not a tidy omission: a heritable-aortopathy guideline
  source should be found and the extrapolated management curated against it
  with `directness: INDIRECT`.

  Not curated, and why. No `datasets:`, `clinical_trials:` or `environmental:`.
  `directness` is set on four items only, where it was actually assessed.

  On the review's under-consumption finding, and what is still not curated.
  The histological finding is now a `histopathology:` section, and the
  TGF-beta edge has been corrected to the layer the measurement actually
  supports. Three things the review asked for are still absent, deliberately
  rather than by oversight.

  The cutaneous and neurological systems are named as affected by
  PMID:34807424, and the full text of PMID:27632686 lists brain aneurysms,
  striae, bifid uvula, cervical spine instability and a detailed skeletal
  dysplasia. Each is curatable and each needs its own phenotype with its own
  quote; adding a dozen phenotypes inside a review round is how a round stops
  being reviewable. They are the obvious next change to this entry.

  The collagen-fibrillogenesis arm of the mechanism is likewise absent. The
  paper's statement about fibril diameter and lateral association is a
  hypothesis in its discussion rather than a measurement, and the decorin
  substitution that would explain the preserved elastic fibres is explicitly
  speculative there. Adding it as a pathophysiology node would put a
  hypothesis on the same footing as the measured TGF-beta finding. It belongs
  as a node with a `PROVISIONAL` marker or as a discussion, and that is a
  judgement worth making deliberately rather than in passing.

  On the histopathology `finding_term` being unbound. MPATH and PATO were
  searched for a term covering preserved elastic fibres with low to normal
  collagen content and neither carries one; the finding is a conjunction of a
  normal result and a low-normal result, which is not the shape of a
  pathological-finding term. It is recorded as free text rather than bound to
  something approximate. Noted so the search is not repeated.

  A pattern worth recording for whoever edits this entry next. Twice in review,
  a `description` was found still arguing for a binding that had already been
  replaced: the aneurysm term and the pectus term. Rebinding a term means
  editing the sentence that justified the old one, and nothing in the
  toolchain checks that, because prose is not validated. Grep the phenotype's
  own description for the old term's name before considering a rebinding done.

  On accepting a review correction without checking it. Round 2 narrowed the
  histopathology contrast from "Loeys-Dietz and Marfan" to Loeys-Dietz alone,
  on the strength of a Results-section sentence that names only Loeys-Dietz.
  The Discussion of the same paper says "This is in contrast to what has been
  described for MFS and LDS aortic tissue", so the original two-syndrome
  phrasing was right and the narrowing made the entry say something its source
  contradicts. Restored, with both sentences now cited so the claim rests on
  the paper rather than on anyone's reading of it. The lesson is the one this
  entry keeps relearning: a claim about what a source says has to be checked
  against the whole source, and that applies to a reviewer's claim as much as
  to a curator's.


pathophysiology:
- name: Loss-of-Function BGN Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Reported disease alleles are germline loss-of-function variants in BGN:
    truncating, splice-affecting or whole-gene deletions. Across 18 probands, no
    pathogenic missense variant without an additional predicted or demonstrated
    splice effect has been found, motivating functional confirmation at the cDNA
    or protein level before classifying BGN missense changes as pathogenic.

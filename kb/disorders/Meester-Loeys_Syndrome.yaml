treatments:
- name: Cardiovascular Surveillance of the Whole Arterial Tree
  description: >-
    The one management step that is specific to this disease rather than
    borrowed from Marfan or Loeys-Dietz practice, and the reason molecular
    diagnosis matters. Two things make it MRLS-specific: the vascular risk is
    substantially higher than that of the hypermobility syndromes these
    patients are otherwise labelled with, and the imaging field has to cover
    the whole arterial tree rather than the aortic root alone, because
    aneurysms and dissections occur throughout it.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cardiovascular imaging surveillance
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  target_mechanisms:
  - target: Medial Weakening and Progressive Arterial Dilatation
    description: >-
      Surveillance does not modify the mechanism; it detects its consequence in
      time to intervene. The link is recorded because that is the node
      surveillance is aimed at.
  evidence:
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early molecular diagnosis is crucial, as it enables targeted cardiovascular surveillance and appropriate counselling for at-risk relatives."
    explanation: >-
      States surveillance as the actionable consequence of diagnosis.
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recognition of MLS, which carries a substantially higher vascular risk and, consequently, different surveillance and management implications"
    explanation: >-
      Gives the reason surveillance differs from that of the hypermobility
      syndromes these patients are commonly labelled with.
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights that aneurysms and dissections in MRLS extend beyond the thoracic aorta, affecting the entire arterial tree, and cardiovascular symptoms may coincide with non-specific connective tissue features."
    explanation: >-
      Establishes why the surveillance field must be the whole arterial tree
      rather than the aortic root alone.
animal_models:
- name: Bgn-deficient BALB/cA mouse
  species: Mouse
  genotype: Bgn null, hemizygous male
  publication: PMID:27632686
  description: >-
    Biglycan-deficient male mice on a BALB/cA background die of aortic rupture.
    This model predates the human disease and is what made BGN a candidate gene
    worth resequencing in unexplained thoracic aortic disease.
  modeled_mechanisms:
  - target: Medial Weakening and Progressive Arterial Dilatation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Fatal aortic rupture in hemizygous males reproduces the severe,
      male-predominant vascular endpoint of the human disease.
    limitations: >-
      The phenotype is strain-dependent (reported on BALB/cA), and the mouse
      endpoint is rupture rather than the progressive dilatation-then-dissection
      course that is surveilled in patients. The syndromic features that make
      this a syndrome rather than an isolated aortopathy, the craniofacial and
      skeletal findings, are not part of the cited mouse result.
    evidence:
    - reference: PMID:27632686
      reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results are in line with those of prior reports demonstrating that Bgn-deficient male BALB/cA mice die from aortic rupture."
      explanation: >-
        The mouse result and its strain and sex qualifiers, cited by the human
        discovery paper as corroboration.
experimental_models:
- name: MRLS patient iPSC line BBANTWi009-A
  experimental_model_type: CELL_LINE
  description: >-
    An induced pluripotent stem cell line reprogrammed from dermal fibroblasts
    of a boy with a hemizygous BGN deletion. It is a characterised resource
    rather than a result: the report establishes normal karyotype, pluripotency
    markers, trilineage differentiation and retention of the genotype, and does
    not model any disease mechanism. It is recorded here so the resource is
    discoverable, and it deliberately carries no `modeled_mechanisms` link,
    because asserting one would claim more than the paper shows.
  organism:

genetic:
- name: BGN
  gene_term:
    preferred_term: BGN
    term:
      id: hgnc:1044
      label: BGN
  relationship_type: CAUSATIVE
  notes: >-
    One reported male carries a deletion spanning the BGN coding sequence and
    the 5' untranslated region of the downstream gene ATP2B3, and has a more
    severe skeletal phenotype. The proposed explanation is that the remnant BGN
    promoter drives ectopic expression of ATP2B3, which is normally repressed
    in skin fibroblasts. This is a contiguous-gene effect proposed as a
    possibility, not demonstrated, and it is the reason the discoverers write
    that distinct mechanisms may underlie the phenotypic spectrum.
  evidence:
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Interestingly, a male proband with a deletion spanning the coding sequence of BGN and the 5' untranslated region of the downstream gene (ATP2B3) presented with a more severe skeletal phenotype."
    explanation: >-
      The observation behind these notes. Graded INDIRECT because the
      attribution of the extra severity to ATP2B3 is an inference from one
      patient, and the authors offer it with "may possibly be explained by".
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, distinct mechanisms may underlie the wide phenotypic spectrum of MRLS patients carrying loss-of-function variants in BGN."
    explanation: >-
      The authors' own conclusion that one loss-of-function mechanism does not
      account for the whole spectrum.

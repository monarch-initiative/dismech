- name: Loss of Biglycan from the Arterial Extracellular Matrix
  role: effector
  biological_scale: TISSUE
  description: >-
    Biglycan is a small leucine-rich proteoglycan of the arterial wall that
    interacts with fibrillar collagens and elastin. Its loss alters collagen
    fibril ultrastructure and reduces wall tensile strength while preserving
    elastic fibres, distinguishing Meester-Loeys histology from the
    elastic-fibre fragmentation of classical medial degeneration.
  cell_types:

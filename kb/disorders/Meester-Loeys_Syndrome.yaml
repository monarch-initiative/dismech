pathophysiology:
- name: Loss-of-Function BGN Variants
  biological_scale: MOLECULAR
  description: >-
    Reported disease alleles are loss-of-function: truncating, splice-affecting
    or whole-gene deletions. Notably, no pathogenic missense variant *without*
    an additional predicted or demonstrated splice effect has been found across
    18 probands, which is why the reporting group recommends proving loss of
    function at cDNA or protein level before calling a BGN missense variant
    pathogenic.
  genetic_context:
    gene:
      preferred_term: BGN
      term:
        id: hgnc:1044
        label: BGN
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified BGN variants were shown to lead to loss-of-function by cDNA and Western Blot analyses of skin fibroblasts or were strongly predicted to lead to loss-of-function based on the nature of the variant."
    explanation: >-
      Establishes loss of function as the mechanism, and how it was
      demonstrated rather than assumed.
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No (likely) pathogenic missense variants without additional (predicted) splice effects were identified."
    explanation: >-
      The negative result behind this node's claim about missense alleles, and
      the reason the variant-interpretation caveat is in the description.
  downstream:
  - target: Loss of Biglycan from the Arterial Extracellular Matrix
    description: >-
      Loss-of-function alleles remove the proteoglycan from the matrix.
- name: Loss of Biglycan from the Arterial Extracellular Matrix
  biological_scale: TISSUE
  description: >-
    Biglycan is a small leucine-rich proteoglycan of the arterial media. Its
    loss changes the matrix without destroying its elastic architecture: the
    elastic fibres are preserved. That distinguishes Meester-Loeys histology
    from the elastic-fibre fragmentation of classical medial degeneration and
    is a point where the disease diverges from its clinical mimics.
  cell_types:
  - preferred_term: Vascular smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found five individuals with loss-of-function mutations in BGN encoding the small leucine-rich proteoglycan biglycan."
    explanation: >-
      Identifies biglycan as the lost matrix component.
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, BGN gene defects in humans cause an X-linked syndromic form of severe TAAD that is associated with preservation of elastic fibers and increased TGF-β signaling."
    explanation: >-
      The preservation of elastic fibres, which is what makes this node's
      claim about the matrix specific rather than generic.
  downstream:
  - target: Increased TGF-beta Signaling in the Aortic Wall
    description: >-
      Biglycan sequesters latent TGF-beta in the matrix; without it, signalling
      is released.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Increased TGF-beta Signaling in the Aortic Wall
  biological_scale: TISSUE
  description: >-
    Fluorescent staining of the aortic wall shows increased nuclear pSMAD2, the
    canonical readout of active TGF-beta signalling. This is the mechanistic
    link to the wider heritable-aortopathy literature, where TGF-beta
    dysregulation is the recurring theme. It is also the least settled part of
    the model: how loss of biglycan produces it is described by the discoverers
    themselves as largely unresolved, and a 2025 family found the aortic-wall
    signal without a matching change in patient dermal fibroblasts.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fluorescent staining revealed an increase in TGF-β signaling, evidenced by an increase in nuclear pSMAD2 in the aortic wall."
    explanation: >-
      The direct measurement, in the affected tissue, that this node asserts.
  - reference: PMID:41465473
    reference_title: "A Family with Meester-Loeys Syndrome Caused by a Novel Missense Variant in the BGN Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of the aortic wall were consistent with a dysregulation of the TGF-β/SMAD pathway"
    explanation: >-
      Independent replication of the aortic-wall finding in a second family,
      nine years later.
  - reference: PMID:34807424
    reference_title: "Meester-Loeys Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Although functional consequences of these mutations remain largely elusive, increased TGF-β signaling has been observed."
    explanation: >-
      The reviewers' own assessment of how well this step is understood, quoted
      because it is the honest calibration for this node: the observation is
      solid, the causal path to it is not.
  downstream:
  - target: Medial Weakening and Progressive Arterial Dilatation
    description: >-
      Sustained TGF-beta signalling accompanies the wall remodelling that
      permits dilatation, but the earlier wording put it in the wrong layer:
      the increase in the media was slight, and significantly more pronounced
      in the adventitia, which is the major site of biglycan deposition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27632686
      reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we observed a slight increase in TGF-β signaling in the media; however, this increase was significantly more pronounced in the adventitia (Supplementary Figure S2 online)."
      explanation: >-
        The measurement behind the corrected wording: slight in the media,
        significantly more pronounced in the adventitia.
    - reference: PMID:27632686
      reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "lack of biglycan increases TGF-β signaling, especially in the adventitia, the major site of biglycan deposition in the aortic wall."
      explanation: >-
        The authors' own interpretation, tying the adventitial predominance to
        where biglycan actually sits in the wall.
- name: Medial Weakening and Progressive Arterial Dilatation
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint, and it is not confined to the thoracic aorta. The
    expanded cohort found aneurysms and dissections across the arterial tree,
    and one family presented with multiple visceral artery aneurysms in a
    proband initially diagnosed as Ehlers-Danlos syndrome. Dissection occurs at
    young ages.
  evidence:
  - reference: PMID:38531898
    reference_title: "Expanding the clinical spectrum of biglycan-related Meester-Loeys syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights that aneurysms and dissections in MRLS extend beyond the thoracic aorta, affecting the entire arterial tree, and cardiovascular symptoms may coincide with non-specific connective tissue features."
    explanation: >-
      The finding that widens this node beyond the thoracic aorta, and the
      diagnostic trap it creates.
  - reference: PMID:27632686
    reference_title: "Loss-of-function mutations in the X-linked biglycan gene cause a severe syndromic form of thoracic aortic aneurysms and dissections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical phenotype is characterized by early-onset aortic aneurysm and dissection."
    explanation: >-
      Establishes the early onset of the cardiovascular endpoint.
  downstream:
  - target: Aortic root aneurysm
  - target: Aortic dissection
  - target: Arterial aneurysm and dilatation

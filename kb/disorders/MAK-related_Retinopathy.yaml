pathophysiology:
- name: Biallelic MAK Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  description: >-
    Biallelic MAK variants remove MAK kinase function in photoreceptors. The
    exon 9 Alu insertion prevents the developmental switch to the retinal MAK
    transcript, so patient cells lack wild-type exon 9-containing transcript;
    nonsense, frameshift and splice-site variants are predicted null alleles;
    and two kinase-domain missense variants abolish kinase activity in vitro.
    MAK is a cilium-associated serine/threonine kinase expressed in rod and
    cone photoreceptors and in testis; it phosphorylates the N-terminal region
    of the axonemal microtubule-associated protein RP1 in mouse photoreceptor
    cilia.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

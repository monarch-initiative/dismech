  features: >-
    Biallelic loss-of-function variants: the founder exon 9 Alu insertion, a
    nonsense variant, a frameshift and a splice-acceptor variant, and
    kinase-domain missense variants (p.Gly13Ser, p.Gly27Arg, p.Asn130His,
    p.Arg166His, p.Ile181Thr, p.Thr162Ile, p.Lys22Asn, p.Gly16Arg). ClinGen
    counted 13 distinct variants in 31 probands from 7 publications.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ee785a8d-420d-4c3a-a585-c963d06df52e-2023-03-02T170000.000Z
    evidence:
    - reference: CGGV:assertion_ee785a8d-420d-4c3a-a585-c963d06df52e-2023-03-02T170000.000Z
      reference_title: MAK / MAK-related retinopathy (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: MAK | HGNC:6816 | MAK-related retinopathy | MONDO:0700229 | AR | Definitive
      explanation: ClinGen Retina GCEP classification row.
  case_fractions:
  - population: Unrelated autosomal recessive or simplex RP probands (North American screening cohort)
    case_fraction_percent: 1.2
    cohort_size: 1798
    notes: Homozygosity for the exon 9 Alu insertion; all 21 affected probands were of Jewish ancestry.
    evidence:
    - reference: PMID:21825139
      reference_title: Exome sequencing and analysis of induced pluripotent stem cells identify the cilia-related gene male germ cell-associated kinase (MAK) as a cause of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Screening of 1,798 unrelated RP patients identified 20 additional
        probands homozygous for this insertion (1.2%). All 21 affected probands
        are of Jewish ancestry.
      explanation: Share of RP probands homozygous for the Alu insertion.
  - population: Ashkenazi Jewish families with RP and a known genetic cause (Israel)
    case_fraction_percent: 39.0
    notes: >-
      Share of genetically solved families in a cohort of 230 Ashkenazi Jewish
      RP families, of which 37% were solved; the MAK Alu insertion was the most
      common cause.
    evidence:
    - reference: PMID:29276052
      reference_title: "Nonsyndromic Retinitis Pigmentosa in the Ashkenazi Jewish Population: Genetic and Clinical Aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most prevalent RP-causing mutations are the Alu insertion
        (c.1297_8ins353, p.K433Rins31*) in the male germ cell-associated kinase
        (MAK) gene (39% of families with a known genetic cause for RP)
      explanation: MAK share of solved Ashkenazi Jewish RP families.
  - population: North American recessive or isolate RP patients reporting Jewish ancestry
    case_fraction_percent: 25.7
    cohort_size: 35
    evidence:
    - reference: PMID:25255364
      reference_title: Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified the MAK and DHDDS mutations homozygously in only 2.1% and
        0.8%, respectively, of patients of mixed ethnicity, but in 25.7% and
        8.6%, respectively, of cases reporting Jewish ancestry.
      explanation: Homozygous Alu insertion in a quarter of Jewish-ancestry cases.
  - population: North American recessive or isolate RP patients of mixed ethnicity
    case_fraction_percent: 2.1
    cohort_size: 240
    evidence:
    - reference: PMID:25255364
      reference_title: Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We identified the MAK and DHDDS mutations homozygously in only 2.1% and
        0.8%, respectively, of patients of mixed ethnicity, but in 25.7% and
        8.6%, respectively, of cases reporting Jewish ancestry.
      explanation: The Alu insertion is uncommon outside Jewish-ancestry patients.
  variants:
  - name: c.1297_1298ins353 (exon 9 Alu insertion)
    description: >-
      A 353-bp Alu insertion in exon 9, also written c.1297_8ins353,
      p.K433Rins31* and p.Lys429insAlu. Patient cells fail to switch to the
      retinal exon 9- and exon 12-containing transcript. It is a founder allele
      in Ashkenazi Jews (carrier frequency 1 in 55) and is missed by standard
      NGS variant callers, which trim the Alu sequence from junction reads.
    variant_type: insertion
    synonyms:
    - MAK-Alu insertion
    - p.K433Rins31*
    - K429insAlu
    evidence:
    - reference: PMID:29276052
      reference_title: "Nonsyndromic Retinitis Pigmentosa in the Ashkenazi Jewish Population: Genetic and Clinical Aspects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most prevalent RP-causing mutations are the Alu insertion
        (c.1297_8ins353, p.K433Rins31*) in the male germ cell-associated kinase
        (MAK) gene
      explanation: HGVS description of the founder allele.
    - reference: PMID:25255364
      reference_title: Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Haplotype analyses revealed that inheritance of the MAK mutation was
        attributable to a founder effect.
      explanation: The Alu insertion is a founder allele.
    - reference: PMID:26558903
      reference_title: Efficient In Silico Identification of a Common Insertion in the MAK Gene which Causes Retinitis Pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of the insertion was missed completely using a GATK-based
        analysis pipeline on Illumina reads, since the algorithm trimmed the
        Alu sequence from the ends of the junction fragment reads, creating an
        artifactually normal MAK sequence
      explanation: Why standard pipelines miss the allele.
    population_effects:
    - population: North American recessive or isolate RP patients reporting Jewish ancestry
      ancestry_basis: SELF_REPORTED
      comparator_stratum: North American recessive or isolate RP patients of mixed ethnicity
      effect_differences:
      - ALLELE_FREQUENCY
      cohort_size: 35
      description: >-
        Homozygous in 25.7% of Jewish-ancestry patients against 2.1% of patients
        of mixed ethnicity. The source says "Jewish ancestry" without
        specifying Ashkenazi, so no HANCESTRO term is bound.
      evidence:
      - reference: PMID:25255364
        reference_title: Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified the MAK and DHDDS mutations homozygously in only 2.1%
          and 0.8%, respectively, of patients of mixed ethnicity, but in 25.7%
          and 8.6%, respectively, of cases reporting Jewish ancestry.
        explanation: The source reports the frequency difference between the two groups.
  - name: c.718C>T p.Gln240*
    description: >-
      Homozygous nonsense variant in the single affected member of a
      consanguineous Turkish family; it truncates the kinase domain.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:21835304
      reference_title: Exome sequencing and cis-regulatory mapping identify mutations in MAK, a gene encoding a regulator of ciliary length, as a cause of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        c.718C>T ... resulted in a premature stop codon predicted to truncate
        more than half of the protein
      explanation: The index nonsense variant and its predicted effect.
  - name: p.Gly13Ser and p.Asn130His
    description: >-
      Homozygous kinase-domain missense variants at residues conserved in all
      known kinases; both abolish kinase activity in vitro. p.Asn130His was
      also found in trans with p.Lys22Asn in a 76-year-old patient with
      advanced disease.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:21835304
      reference_title: Exome sequencing and cis-regulatory mapping identify mutations in MAK, a gene encoding a regulator of ciliary length, as a cause of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results confirm that these two disease-causing mutations result
        in a loss of kinase activity in vitro.
      explanation: Kinase assay of p.Gly13Ser and p.Asn130His.
    - reference: PMID:22110072
      reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When first evaluated, this compound heterozygous individual (P23, Table
        1) was 76 years of age and had hand-motions vision, a nondetectable
        ERG, and extensive pigmentary change in all four quadrants of the
        retina.
      explanation: The p.Asn130His/p.Lys22Asn compound heterozygote had advanced disease.
  - name: c.1195_1196delAC p.(Thr399fs) and c.279-2A>G
    description: >-
      Compound heterozygous frameshift and splice-acceptor null variants in a
      75-year-old British woman with onset in the fourth decade and a mild
      course.
    variant_type: deletion
    evidence:
    - reference: PMID:29781741
      reference_title: Slowly progressive retinitis pigmentosa caused by two novel mutations in the MAK gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The first c.1195_1196delAC p.(Thr399fs), was a two base-pair deletion
        creating a frame-shift in exon 9 predicted to result in nonsense-mediated
        decay. The second, c.279-2A>G, involved the splice acceptor consensus
        site upstream of exon 4, predicted to lead to aberrant splicing.
      explanation: Two null alleles in a non-Jewish patient.
    - reference: PMID:29781741
      reference_title: Slowly progressive retinitis pigmentosa caused by two novel mutations in the MAK gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The natural history of this individual's RP is consistent with
        previously described MAK mutations, being significantly milder than that
        associated with other photoreceptor ciliopathies.
      explanation: Null alleles give the same mild course as other MAK variants.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Biallelic MAK variants confirm the diagnosis. The exon 9 Alu insertion is
    not called by standard NGS variant callers, so it needs a targeted assay
    (PCR or a read-level search for the junction sequence); targeted testing
    for the Alu insertion and DHDDS p.Lys42Glu is an efficient first step in
    patients of Jewish ancestry. Authors recommend including MAK in genetic
    testing of all patients with RP.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:26558903
    reference_title: Efficient In Silico Identification of a Common Insertion in the MAK Gene which Causes Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One such mutation is a recently-identified Alu insertion into the Male
      Germ Cell-Associated Kinase (MAK) gene, which is missed by standard
      NGS-based variant callers.
    explanation: The founder allele needs a dedicated detection method.
  - reference: PMID:26558903
    reference_title: Efficient In Silico Identification of a Common Insertion in the MAK Gene which Causes Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a test sample set consisting of eleven previously published
      homozygous mutants, detection of the MAK-Alu insertion was validated with
      100% sensitivity and specificity.
    explanation: A read-level search detects the insertion in existing NGS data.
  - reference: PMID:25255364
    reference_title: Two specific mutations are prevalent causes of recessive retinitis pigmentosa in North American patients of Jewish ancestry.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, their screening constitutes an alternative procedure to
      large-scale tests for patients belonging to this ethnic group,
      especially in time-sensitive situations.
    explanation: Targeted founder-allele testing in Jewish-ancestry patients.
  - reference: PMID:29781741
    reference_title: Slowly progressive retinitis pigmentosa caused by two novel mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest inclusion of MAK as part of wider genetic testing in all
      individuals presenting with RP.
    explanation: MAK testing outside the Ashkenazi population.
- name: Full-Field Electroretinography
  description: >-
    Full-field ERG shows a rod-cone pattern with rod responses reduced more
    than cone responses, becoming nondetectable in advanced disease.
  diagnosis_term:
    preferred_term: full-field electroretinography
    term:
      id: NCIT:C101217
      label: Retinal Examination
  notes: >-
    NCIT has no electroretinography term: an OLS4 search of NCIT for
    "Electroretinography" returned no results, so the broader Retinal
    Examination is bound, as in CACNA2D4-related_Retinopathy.
  evidence:
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full-field ERG patterns were those of RP: Rod dysfunction was always
      greater than cone dysfunction, and, in more advanced stages there were
      nondetectable signals.
    explanation: The ERG pattern in MAK-related RP.
- name: Optical Coherence Tomography
  description: >-
    SD-OCT measures outer nuclear layer thickness and ellipsoid zone width,
    which decline measurably while acuity stays stable, and detects cystoid
    macular edema. Regular OCT examination is recommended, especially when
    acuity falls.
  diagnosis_term:
    preferred_term: spectral-domain optical coherence tomography
    term:
      id: NCIT:C162464
      label: Spectral Domain-Optical Coherence Tomography
  evidence:
  - reference: PMID:40578471
    reference_title: Ellipsoid Zone Loss as an Outcome Measure in MAK-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with MAK-RP maintain functional central vision and have a
      favorable prognosis. Therefore, alternative measures are necessary to
      track disease progression.
    explanation: Structural OCT measures are needed because acuity changes little.
  - reference: PMID:29103961
    reference_title: High-resolution Imaging in Male Germ Cell-Associated Kinase (MAK)-related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that regular examination of retinal structure using OCT is
      necessary in MAK patients, especially when visual acuity is reduced.
    explanation: OCT monitoring for cystoid macular edema.
- name: Fundus Autofluorescence Imaging
  description: >-
    FAF shows a hyperautofluorescent ring that evolves with age; ultra-widefield
    FAF patterns differ between MAK- and DHDDS-related disease.
  diagnosis_term:
    preferred_term: fundus autofluorescence imaging
    term:
      id: NCIT:C162465
      label: Fundus Autofluorescence Imaging
  evidence:
  - reference: PMID:35501492
    reference_title: Ultra-widefield fundus autofluorescence imaging in patients with autosomal recessive retinitis pigmentosa reveals a genotype-phenotype correlation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The largest difference between groups was found for macular
      abnormalities on FAF, with DHDDS patients differing significantly from
      the MAK and FAM161A groups (p = 0.001).
    explanation: FAF helps distinguish MAK from DHDDS disease (11 MAK patients).
treatments:
- name: AAV5 MAK Gene Augmentation (Preclinical)
  description: >-
    No disease-specific therapy is approved. A clinical-grade AAV5 vector
    carrying the retinal MAK isoform (AAV5-CMV-MAKRI) restored MAK transcript
    and protein in patient iPSC-derived photoreceptor precursors, corrected
    primary cilium length in patient fibroblasts and mak knockdown zebrafish,
    partly restored visual responses in the zebrafish, and showed no local or
    systemic toxicity after subretinal injection in rats. The authors
    describe it as preparation for a phase 1 trial.
  therapeutic_modality: GENE_THERAPY
  delivery_system:
    delivery_platform: VIRAL_VECTOR
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic MAK Loss of Function
    treatment_effect: BYPASSES
    description: Supplies a functional retinal MAK coding sequence.
  - target: Loss of Negative Regulation of Cilium Length
    treatment_effect: RESTORES
    description: Restores cilium length control in patient fibroblasts and zebrafish.
  evidence:
  - reference: PMID:34518651
    reference_title: Development and biological characterization of a clinical gene transfer vector for the treatment of MAK-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using patient-derived fibroblast cells and mak knockdown zebra fish we
      demonstrate that over-expression of the retinal MAK transgene restored
      the cells ability to regulate primary cilia length.
    explanation: Rescue of cilium length control in patient cells.
  - reference: PMID:34518651
    reference_title: Development and biological characterization of a clinical gene transfer vector for the treatment of MAK-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, the visual defect in mak knockdown zebrafish was mitigated
      via treatment with the retinal MAK transgene.
    explanation: Partial functional rescue in zebrafish.
  - reference: PMID:34518651
    reference_title: Development and biological characterization of a clinical gene transfer vector for the treatment of MAK-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      There was no evidence of local or systemic toxicity at 1-month or
      3-months following subretinal delivery of clinical grade vector into
      wild type rats.
    explanation: Preclinical safety of the clinical-grade vector.
- name: ICK Activation by Gene Delivery or FGFR Inhibition (Preclinical)
  description: >-
    In Mak-null mice, AAV delivery of Ick to photoreceptors, or daily injection
    of the FGFR inhibitor BGJ398 (infigratinib) from P7 to 1 month to relieve
    FGFR inhibition of Ick, reduced retinal degeneration and improved scotopic
    ERG amplitudes. The authors propose ICK activation as a therapeutic
    approach; it has not been tested in patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: infigratinib (BGJ398)
      term:
        id: NCIT:C88302
        label: Infigratinib
  target_mechanisms:
  - target: Impaired Retrograde Intraflagellar Transport at the Photoreceptor Ciliary Tip
    treatment_effect: MODULATES
    description: Activates the partly redundant kinase ICK to compensate for MAK loss.
  - target: Rod Photoreceptor Degeneration
    treatment_effect: INHIBITS
    description: Reduced retinal degeneration in Mak-null mice.
  evidence:
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gene delivery of Ick and pharmacological inhibition of FGF receptors, Ick
      negative regulators, ameliorated retinal degeneration in Mak -/- mice.
    explanation: Both ICK-activating interventions reduced degeneration in Mak-null mice.
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To evaluate the effects of BGJ398 on retinal function in Mak−/− mice, we
      performed an ERG analysis and observed that scotopic a- and b-wave
      amplitudes in BGJ398-treated Mak−/− mice were higher than those in
      vehicle-treated Mak−/− mice
    explanation: Functional improvement with the FGFR inhibitor.
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: BGJ398, an inhibitor of Fgfrs, was injected into Mak−/− mice from P7 to 1 mo every day.
    explanation: Treatment schedule in the mouse study.
- name: CRISPR-Cas9 Correction of the Alu Insertion in Patient iPSCs (Preclinical)
  description: >-
    Homology-directed repair removed the exon 9 Alu insertion in patient iPSCs
    and restored the retinal MAK transcript and protein, as a step toward
    autologous cell replacement. Tested only in cultured cells.
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic MAK Loss of Function
    treatment_effect: RESTORES
    description: Corrects the founder allele in patient cells.
  evidence:
  - reference: PMID:28619647
    reference_title: Using CRISPR-Cas9 to Generate Gene-Corrected Autologous iPSCs for the Treatment of Inherited Retinal Degeneration.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We developed a homology-directed repair strategy targeting a homozygous
      Alu insertion in exon 9 of male germ cell-associated kinase (MAK) and
      demonstrated restoration of the retinal transcript and protein in
      patient cells.
    explanation: Gene correction of the founder allele in patient iPSCs.
- name: Carrier Screening and Genetic Counseling
  description: >-
    Because 1 in 55 Ashkenazi Jews carries the Alu insertion, the authors of the
    largest clinical series recommend adding MAK to Ashkenazi carrier screening
    panels with genetic counseling.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier screening panels should be further expanded to include the MAK
      gene as an option, with appropriate genetic counseling.
    explanation: Recommendation for carrier screening with genetic counseling.
animal_models:
- name: Mak knockout mouse
  species: Mouse
  genotype: Mak-/- (Mak-null)
  publication: PMID:21148103
  description: >-
    Mak-null mice have elongated photoreceptor connecting cilia, accumulation
    of IFT proteins at the ciliary tip, rhodopsin mislocalization and
    progressive photoreceptor degeneration. Fertility is not affected.
  modeled_mechanisms:
  - target: Loss of Negative Regulation of Cilium Length
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Elongated photoreceptor cilia.
    limitations: >-
      Photoreceptor ciliary elongation has not been demonstrated in patients;
      OCT in adults found none, though single cilia are below its resolution,
      and zebrafish mak mutants lack axonemes instead.
    evidence:
    - reference: PMID:21148103
      reference_title: Negative regulation of ciliary length by ciliary male germ cell-associated kinase (Mak) is required for retinal photoreceptor survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the Mak-null retina, photoreceptors exhibit elongated cilia and
        progressive degeneration.
      explanation: Cilium elongation in the knockout.
  - target: Impaired Retrograde Intraflagellar Transport at the Photoreceptor Ciliary Tip
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: IFT proteins accumulate at photoreceptor ciliary tips.
    limitations: No human photoreceptor tissue has been examined for IFT accumulation.
    evidence:
    - reference: PMID:39293864
      reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        IFT components were concentrated at the tips of the photoreceptor
        ciliary axonemes in the Mak−/− retina, which is similar to observations
        in Ick−/− MEFs
      explanation: IFT accumulation in the knockout.
  - target: Opsin Mislocalization to the Photoreceptor Inner Segment and Cell Body
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Rhodopsin accumulates in photoreceptor cell bodies.
    limitations: No human photoreceptor tissue has been examined for opsin mislocalization.
    evidence:
    - reference: PMID:21148103
      reference_title: Negative regulation of ciliary length by ciliary male germ cell-associated kinase (Mak) is required for retinal photoreceptor survival.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found abnormal rhodopsin accumulation in the Mak-null photoreceptor
        cell bodies at postnatal day 14.
      explanation: Opsin mislocalization in the knockout.
  - target: Rod Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Progressive photoreceptor degeneration.
    limitations: >-
      Degeneration in the mouse has been described as rapid, whereas patient
      symptoms usually begin in early to mid adulthood and progress slowly.
    evidence:
    - reference: PMID:21835304
      reference_title: Exome sequencing and cis-regulatory mapping identify mutations in MAK, a gene encoding a regulator of ciliary length, as a cause of retinitis pigmentosa.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Mutations in MAK orthologs in mice and other model organisms result in
        abnormally long cilia and, in mice, rapid photoreceptor degeneration.
      explanation: Summary of the mouse phenotype by the human gene discovery study.
  evidence:
  - reference: PMID:34518651
    reference_title: Development and biological characterization of a clinical gene transfer vector for the treatment of MAK-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Interestingly, despite its original description as a gene that is
      important in spermatogenesis, deletion of the Mak gene in mice does not
      affect fertility
    explanation: The knockout has no fertility phenotype.
- name: Zebrafish mak mutant (pday)
  species: Zebrafish
  genotype: mak mutant (pday)
  publication: PMID:38813692
  description: >-
    Rods and cones lack outer segments, fail to form ciliary axonemes although
    basal bodies are specified, mislocalize opsins and undergo apoptosis during
    embryonic development. Wild-type but not kinase-dead MAK transgenes rescue
    axonemes and survival.
  modeled_mechanisms:
  - target: Defective Photoreceptor Outer Segment Formation and Maintenance
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Outer segments fail to form.
    limitations: >-
      The zebrafish defect is embryonic and complete, whereas patients develop
      vision normally and lose photoreceptors slowly in adulthood.
    evidence:
    - reference: PMID:38813692
      reference_title: Male germ cell-associated kinase is required for axoneme formation during ciliogenesis in zebrafish photoreceptors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In mak mutants, both cone and rod photoreceptors completely lacked
        outer segments and underwent apoptosis.
      explanation: Outer-segment failure and photoreceptor death.
  - target: Loss of Negative Regulation of Cilium Length
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: Photoreceptor axonemes are absent rather than elongated.
    limitations: >-
      The zebrafish mutant shows absent axonemes, the opposite of the mouse
      elongation, so it cannot test whether photoreceptor cilia lengthen in

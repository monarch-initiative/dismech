    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Mak-null retina, photoreceptors exhibit elongated cilia and
      progressive degeneration.
    explanation: Mak loss elongates mouse photoreceptor cilia.
  - reference: PMID:21148103
    reference_title: Negative regulation of ciliary length by ciliary male germ cell-associated kinase (Mak) is required for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      overexpression of retinitis pigmentosa 1 (RP1), a microtubule-associated
      protein localized in outer-segment axonemes, induced ciliary elongation,
      and Mak coexpression rescued excessive ciliary elongation by RP1.
    explanation: MAK restrains RP1-driven ciliary elongation in cultured cells.
  - reference: PMID:34518651
    reference_title: Development and biological characterization of a clinical gene transfer vector for the treatment of MAK-associated retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Compared to the unffected individual, dermal fibroblasts isolated from
      patients with MAK-associated RP had significantly longer primary cilia
    explanation: Patient fibroblasts show the cilium length defect.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      At the stages studied, there was no evidence of photoreceptor ciliary

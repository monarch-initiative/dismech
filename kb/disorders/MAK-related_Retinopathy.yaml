name: MAK-related Retinopathy
creation_date: '2026-10-28T00:00:00Z'
category: Mendelian
description: >-
  MAK-related retinopathy is an autosomal recessive, non-syndromic retinitis
  pigmentosa (rod-cone degeneration) caused by biallelic loss-of-function
  variants in MAK, which encodes male germ cell-associated kinase, a
  serine/threonine kinase of the photoreceptor connecting cilium and
  outer-segment axoneme that regulates ciliary length and intraflagellar
  transport. Patients have night blindness followed by visual field
  constriction, with symptom onset between childhood and the fifth decade,
  typical pigmentary retinopathy, and rod-greater-than-cone dysfunction on the
  electroretinogram. Field loss characteristically begins in the
  superotemporal quadrant, and central acuity is often preserved into late
  adult life, so the disease is milder than many other forms of retinitis
  pigmentosa; cystoid macular edema developed in a third of one cohort. The
  most common allele is a founder 353-bp Alu insertion in exon 9, carried by 1
  in 55 Ashkenazi Jewish controls, which makes MAK the most common cause of
  retinitis pigmentosa in that population; nonsense, frameshift, splice-site
  and kinase-domain missense variants occur in other populations. The
  insertion is missed by standard next-generation sequencing variant callers.
  Mak-null mice have elongated photoreceptor cilia, accumulation of
  intraflagellar transport proteins at the ciliary tip, opsin mislocalization
  and progressive photoreceptor degeneration; whether photoreceptor cilia
  lengthen in patients is unresolved. A single proband with a candidate MAK
  variant had cone-rod dystrophy with bull's eye maculopathy. No therapy is
  approved; an AAV5 MAK gene augmentation vector has completed preclinical
  safety testing.

      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: >-
        The cause of the structural and functional changes in retinal vessels is
        unclear, but may be a consequence of tissue atrophy and reduced oxygen
        consumption.
      explanation: A hedged statement on the cause of retinal vascular change in RP generally.
  - target: Optic disc pallor
    description: Inferred; waxy disc pallor accompanies advanced photoreceptor degeneration in retinitis pigmentosa.
  - target: Sectoral retinitis pigmentosa
    description: Inferred; sectoral disease reflects the regional asymmetry of photoreceptor loss.
phenotypes:
- name: Nyctalopia
  category: Ocular
  description: >-
    Night blindness is the first symptom. Symptom onset ranged from childhood
    to age 43 (mean 23 years) in an international cohort of 11 patients;
    estimated ages of onset of field decline ranged from 30 to 63 years in an
    Ashkenazi cohort.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Nyctalopia
    term:
      id: HP:0000662
      label: Nyctalopia
  evidence:
  - reference: PMID:25385675
    reference_title: Retinitis pigmentosa caused by mutations in the ciliary MAK gene is relatively mild and is not associated with apparent extra-ocular features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients experienced typical RP symptoms of night blindness followed
      by visual field constriction.
    explanation: Night blindness in all 11 patients.
  - reference: PMID:25385675
    reference_title: Retinitis pigmentosa caused by mutations in the ciliary MAK gene is relatively mild and is not associated with apparent extra-ocular features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms initiated between childhood and the age of 43 (mean: 23 years)."
    explanation: Range of symptom onset.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individual ages of disease onset (estimated from the intercepts) ranged
      from 30 to 63 years
    explanation: Estimated onset of field decline in six patients with longitudinal perimetry.
- name: Constriction of peripheral visual field
  category: Ocular
  description: >-
    Kinetic fields are lost first in the superotemporal quadrant; with
    progression the superior and midperipheral field is lost while the nasal
    field remains, and late disease leaves only a central island. Half of one
    series of eight patients had tunnel vision of 25 degrees or less. The
    estimated rate of field loss (11% per year for the large target) is within
    the range reported for other forms of RP.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Constriction of peripheral visual field
    term:
      id: HP:0001133
      label: Constriction of peripheral visual field
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:25385675
    reference_title: Retinitis pigmentosa caused by mutations in the ciliary MAK gene is relatively mild and is not associated with apparent extra-ocular features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients experienced typical RP symptoms of night blindness followed
      by visual field constriction.
    explanation: Field constriction in all 11 patients.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Kinetic fields showed early loss in the superior-temporal quadrant. With
      more advanced disease, superior and midperipheral function was lost, but
      the nasal field remained. Only a central island was present at late
      stages.
    explanation: The characteristic sequence of field loss.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Estimated rates of visual field loss were 11% per year for the large
      target and 18.4% per year for the small target.
    explanation: Rate of field loss in six patients with longitudinal data.
  - reference: PMID:21835304
    reference_title: Exome sequencing and cis-regulatory mapping identify mutations in MAK, a gene encoding a regulator of ciliary length, as a cause of retinitis pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The visual field appears to be more heavily affected: half of the
      subjects experienced tunnel vision of 25 degrees or less.
    explanation: Severity of field loss in eight patients with non-founder variants.
- name: Rod-cone dystrophy
  category: Ocular
  description: >-
    Progressive rod-then-cone photoreceptor degeneration (retinitis
    pigmentosa); it is relatively mild, with acuity of 20/40 or better in at
    least one eye in six of eight patients in one series.
  frequency: VERY_FREQUENT

discussions:
- discussion_id: mak_photoreceptor_cilium_length_in_patients
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Negative Regulation of Cilium Length
  prompt: >-
    Do photoreceptor connecting cilia lengthen in patients with MAK-related
    retinopathy, as they do in Mak-null mice, or fail to form axonemes as in
    zebrafish mak mutants?
  rationale: >-
    Mak-null mouse photoreceptors have elongated cilia, zebrafish mak mutants
    have no photoreceptor axonemes, and patient fibroblasts have longer
    primary cilia, but OCT in adult patients found no sign of ciliary
    elongation at a resolution that cannot see single cilia. Which ciliary
    defect the human photoreceptor has decides which model is the better
    proxy for testing therapies.
  evidence:
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that either cilial elongation seen in young mice is not a
      feature of the adult human arRP MAK patients, or the effect becomes
      undetectable with noninvasive methods due to the simultaneous shortening
      of the OS.
    explanation: The authors state the open question directly.
  - reference: PMID:38813692
    reference_title: Male germ cell-associated kinase is required for axoneme formation during ciliogenesis in zebrafish photoreceptors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that Mak contributes to axoneme development in
      zebrafish, in contrast to mouse Mak mutants, which have elongated
      photoreceptor axonemes.
    explanation: The two animal models disagree.
  proposed_experiments:
  - experiment_id: mak_patient_retinal_organoid_cilium_length
    name: Connecting cilium length in MAK patient retinal organoids
    description: >-
      Measure connecting cilium and axoneme length, IFT protein distribution
      and opsin localization in photoreceptors of retinal organoids from
      Alu-homozygous patient iPSCs against gene-corrected isogenic controls.
    would_support:
    - pathophysiology#Loss of Negative Regulation of Cilium Length
differential_diagnoses:
- name: Retinitis pigmentosa 59 (DHDDS)
  description: >-
    The other common founder cause of recessive RP in Ashkenazi Jews. DHDDS
    patients have funduscopic findings like MAK patients 20 to 30 years older
    and lose cone responses earlier.
  distinguishing_features:
  - Earlier and more severe macular and cone involvement.
  - Different macular fundus autofluorescence pattern.
  disease_term:
    preferred_term: retinitis pigmentosa 59
    term:
      id: MONDO:0013468
      label: retinitis pigmentosa 59
  evidence:
  - reference: PMID:29276052
    reference_title: "Nonsyndromic Retinitis Pigmentosa in the Ashkenazi Jewish Population: Genetic and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Funduscopic findings of DHDDS patients matched those of MAK patients who
      were 20 to 30 years older.
    explanation: DHDDS disease is more advanced at a given age.
- name: RP1-related retinopathy
  description: >-
    MAK-related RP resembles RP1-associated RP in its mild course and field
    loss pattern; MAK phosphorylates RP1 in photoreceptor cilia. RP1 disease is
    most often dominant.
  distinguishing_features:
  - RP1 retinopathy is usually autosomal dominant.
  disease_term:
    preferred_term: RP1-related dominant retinopathy
    term:
      id: MONDO:0800400
      label: RP1-related dominant retinopathy
  evidence:
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patterns of disease expression in the MAK form of arRP showed some
      resemblance to patterns described in autosomal dominant RP, especially
      the form caused by RP1 mutations.
    explanation: Phenotypic resemblance to RP1 disease.
- name: Syndromic retinal ciliopathies
  description: >-
    Usher, Bardet-Biedl and other syndromic ciliopathies include retinitis
    pigmentosa; MAK disease has no extra-ocular features, including no
    subclinical olfactory dysfunction.
  distinguishing_features:
  - No hearing loss, renal, olfactory or other extra-ocular ciliopathy features.
  evidence:
  - reference: PMID:25385675
    reference_title: Retinitis pigmentosa caused by mutations in the ciliary MAK gene is relatively mild and is not associated with apparent extra-ocular features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsense and missense mutations in MAK give rise to a non-syndromic
      recessive RP phenotype without apparent extra-ocular features.
    explanation: Absence of syndromic features distinguishes MAK disease.
notes: >-
  No GeneReviews chapter covers this disease; the general GeneReviews overview
  of nonsyndromic retinitis pigmentosa is not disease-specific and its PubMed
  record carries only a statement of purpose, so it is not cited. Most
  patients described are homozygous for the Alu insertion; phenotype
  frequencies come from cohorts of 6 to 24 patients. The Jordanian cone-rod
  dystrophy proband (PMID:33921607) carried a candidate variant the authors
  describe as suggestive, so cone-rod dystrophy is not given its own subtype.

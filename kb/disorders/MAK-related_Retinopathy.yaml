    explanation: Vessel attenuation in all 23 patients with the Alu insertion.
  - reference: PMID:29103961
    reference_title: High-resolution Imaging in Male Germ Cell-Associated Kinase (MAK)-related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SCP (P = .012) and DCP (P = .013) vessel density and perfusion

- name: Defective Photoreceptor Outer Segment Formation and Maintenance
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration"
  description: >-
    Rod and cone outer segments are disorganized in Mak-null mice and are
    absent in zebrafish mak mutants, which fail to form photoreceptor
    axonemes. MAK kinase activity is required: kinase-dead transgenes fail to
    rescue axoneme formation or photoreceptor survival in the zebrafish
    mutant. This is the photoreceptor ciliary arm of the ciliopathy module;
    MAK-related retinopathy has no extra-ocular ciliopathy features.

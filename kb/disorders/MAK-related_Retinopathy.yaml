- name: Impaired Retrograde Intraflagellar Transport at the Photoreceptor Ciliary Tip
  biological_scale: CELLULAR
  description: >-
    In Mak-null mouse photoreceptors, IFT88, IFT57 and IFT140 accumulate at the
    tips of the connecting cilia and the kinesin-2 subunit Kif3a is less
    phosphorylated, consistent with failed IFT turnaround and retrograde
    transport. MAK acts together with the related kinase ICK, both activated
    by CCRK; simultaneous loss of Mak and Ick abolishes photoreceptor
    axonemes, which suggests that ICK partly compensates for MAK.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: intraciliary retrograde transport
    term:
      id: GO:0035721
      label: intraciliary retrograde transport
    modifier: DECREASED
  evidence:
  - reference: PMID:21148103
    reference_title: Negative regulation of ciliary length by ciliary male germ cell-associated kinase (Mak) is required for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed accumulation of intraflagellar transport 88 (IFT88) and
      IFT57, expansion of kinesin family member 3A (Kif3a), and acetylated
      α-tubulin signals in the Mak-null photoreceptor cilia.
    explanation: IFT proteins accumulate in Mak-null photoreceptor cilia.
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we identified that the ciliopathy kinase Mak is a ciliary
      tip-localized IFT regulator that cooperatively acts with the ciliopathy
      kinase Ick, an IFT regulator.
    explanation: Places MAK at the ciliary tip as an IFT regulator acting with ICK.
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phosphorylation of Kif3a, an Ick substrate (33), was lower in the Mak−/−
      retina than in the Mak+/+ retina.
    explanation: Reduced kinesin-2 phosphorylation in the Mak-null retina.
  - reference: PMID:39293864
    reference_title: Ccrk-Mak/Ick signaling is a ciliary transport regulator essential for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Simultaneous disruption of Mak and Ick resulted in loss of photoreceptor
      ciliary axonemes and severe retinal degeneration.
    explanation: ICK partly compensates for MAK loss in photoreceptor cilia.

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        In mak mutants, both cone and rod photoreceptors completely lacked
        outer segments and underwent apoptosis.
      explanation: Absent outer segments and photoreceptor apoptosis co-occur in zebrafish mak mutants.
- name: Rod Photoreceptor Degeneration
  biological_scale: CELLULAR
  conforms_to: "photoreceptor_degeneration#Rod Photoreceptor Apoptosis"
  description: >-
    Rods are lost first. Mak-null mice show progressive photoreceptor
    degeneration and zebrafish mak mutant photoreceptors die by apoptosis; in
    patients rod dysfunction always exceeds cone dysfunction.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38813692
    reference_title: Male germ cell-associated kinase is required for axoneme formation during ciliogenesis in zebrafish photoreceptors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mak mutants, both rods and cones underwent apoptosis, although their
      degeneration processes differed.
    explanation: Photoreceptor death in mak mutant zebrafish is apoptotic.
  - reference: PMID:21148103
    reference_title: Negative regulation of ciliary length by ciliary male germ cell-associated kinase (Mak) is required for retinal photoreceptor survival.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the Mak-null retina, photoreceptors exhibit elongated cilia and
      progressive degeneration.
    explanation: Progressive photoreceptor degeneration in Mak-null mice.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rod-mediated vision was abnormal but detectable in the residual field;
      all patients had rod>cone dysfunction.
    explanation: Rods are the more affected photoreceptor class in patients.
  downstream:
  - target: Cone Photoreceptor Degeneration
    description: >-
      Cone loss follows rod loss in patients. No MAK study tests whether cone
      death is secondary to rod loss; MAK is also expressed in cones, so a
      cell-autonomous contribution is possible.
    evidence:
    - reference: PMID:22110072
      reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Rod dysfunction was always greater than cone dysfunction, and, in more
        advanced stages there were nondetectable signals.
      explanation: The rod-then-cone sequence of functional loss in patients.
  - target: Outer Retinal Thinning
    description: >-
      Inferred: loss of photoreceptor nuclei and segments is what thins the
      outer nuclear layer and ellipsoid zone on OCT.
  - target: Nyctalopia
    description: >-
      Inferred from the rod-first pattern: night blindness is the first symptom
      and rods are the more affected photoreceptor class.
- name: Cone Photoreceptor Degeneration
  biological_scale: CELLULAR
  conforms_to: "photoreceptor_degeneration#Secondary Cone Degeneration and Outer Retinal Thinning"
  description: >-
    Cones degenerate after rods but survive longest at the fovea, so central
    acuity is often preserved into the seventh or eighth decade. Cone spacing
    is normal in early disease and increased in advanced disease, and most
    patients in one cohort retained attenuated photopic ERG responses. Cone
    function is lost at a later age than in DHDDS-related retinitis pigmentosa.
    The module node describes cone loss as non-cell-autonomous; MAK is
    expressed in human cones, so that part is not established here.
  cell_types:
  - preferred_term: cone photoreceptor cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:29103961
    reference_title: High-resolution Imaging in Male Germ Cell-Associated Kinase (MAK)-related Retinal Degeneration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cone spacing was normal at almost all locations in 2 patients with early
      disease and increased in 2 patients with advanced disease.
    explanation: Adaptive optics shows cone loss in advanced but not early disease (4 patients).
  - reference: PMID:40578471
    reference_title: Ellipsoid Zone Loss as an Outcome Measure in MAK-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ffERG showed that ten patients (83%) retained attenuated photopic
      responses, while 6 patients (55%) exhibited detectable rod responses.
    explanation: Cone responses are attenuated but usually retained (12 patients tested).
  - reference: PMID:29276052
    reference_title: "Nonsyndromic Retinitis Pigmentosa in the Ashkenazi Jewish Population: Genetic and Clinical Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with DHDDS mutations were referred for electrophysiologic
      evaluation at earlier ages, and their cone responses became
      nondetectable at a much younger age than MAK patients.
    explanation: Cone function is lost late in MAK-related disease compared with DHDDS disease.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Visual acuities could be normal into the eighth decade of life.
    explanation: Foveal cones survive late.
  downstream:
  - target: Outer Retinal Thinning
    description: >-
      Inferred: cone loss extends outer retinal thinning toward the macula in
      advanced disease.
  - target: Rod-cone dystrophy
    description: >-
      Inferred: the rod-then-cone sequence of photoreceptor loss is the
      rod-cone dystrophy phenotype.
- name: Outer Retinal Thinning
  biological_scale: TISSUE
  description: >-
    SD-OCT shows thinning of the whole retina, outer nuclear layer and
    photoreceptor-pigment epithelium complex. The photoreceptor layer is normal
    at the fovea and thins with eccentricity, and in one cohort the ellipsoid
    zone width narrowed by about 210 micrometres per year. Inferior and nasal
    retina are affected first.
  locations:
  - preferred_term: outer nuclear layer of retina
    term:
      id: UBERON:0001789
      label: outer nuclear layer of retina
  evidence:
  - reference: PMID:25385675
    reference_title: Retinitis pigmentosa caused by mutations in the ciliary MAK gene is relatively mild and is not associated with apparent extra-ocular features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SD-OCT demonstrated thinning of the overall retina, outer nuclear layer
      and photoreceptor-pigment epithelium complex.
    explanation: OCT shows outer retinal thinning in patients.
  - reference: PMID:22110072
    reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Photoreceptor layer thickness was normal centrally but decreased with eccentricity.
    explanation: Thinning spares the fovea and increases with eccentricity.
  - reference: PMID:40578471
    reference_title: Ellipsoid Zone Loss as an Outcome Measure in MAK-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EZ horizontal width declined 209.78 µm/year (95% CI: 181.37-238.18, P <
      .001)
    explanation: Measured rate of ellipsoid zone loss in 18 patients homozygous for the Alu insertion.
  - reference: PMID:40578471
    reference_title: Ellipsoid Zone Loss as an Outcome Measure in MAK-Associated Retinitis Pigmentosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FAF imaging reveals that patients initially develop an irregular
      hyperautofluorescent ring, indicating more pronounced photoreceptor loss
      in the nasal and inferior regions.
    explanation: Regional topography of photoreceptor loss.
  downstream:
  - target: Constriction of peripheral visual field
    description: >-
      Inferred: midperipheral and peripheral photoreceptor loss produces the
      matching field loss; the superotemporal field defect corresponds to
      inferonasal retinal loss.
    evidence:
    - reference: PMID:22110072
      reference_title: Autosomal recessive retinitis pigmentosa caused by mutations in the MAK gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Kinetic perimetry at different ages in these two patients indicated
        more preserved function in the inferior nasal visual field, thereby
        relating to the distribution of funduscopic abnormalities.
      explanation: Field loss maps onto the distribution of retinal abnormalities in two patients.
  - target: Pigmentary retinopathy
    description: Inferred; pigment migration is a consequence of photoreceptor degeneration in retinitis pigmentosa.
  - target: Attenuation of retinal blood vessels
    description: >-
      Inferred; the authors of the OCT angiography study propose that reduced
      parafoveal capillary density may follow tissue atrophy and reduced oxygen
      consumption.
    evidence:

- name: Loss of Negative Regulation of Cilium Length
  biological_scale: CELLULAR
  description: >-
    MAK negatively regulates ciliary length. Mak-null mouse photoreceptors have
    elongated connecting cilia and axonemes, and overexpression of RP1, which
    MAK phosphorylates, elongates cilia unless MAK is co-expressed. Dermal
    fibroblasts from patients have longer primary cilia than control cells,
    which AAV5 MAK transduction corrects. In vivo the picture differs by
    species: zebrafish mak mutants form no photoreceptor axonemes, and OCT in
    adult patients found no sign of ciliary elongation, although single cilia
    are below OCT resolution.
  cell_types:
  - preferred_term: rod photoreceptor cell
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: negative regulation of cilium assembly
    term:

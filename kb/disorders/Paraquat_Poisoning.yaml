    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gastrointestinal toxicity occurs in the form of mucosal lesions which can ulcerate and bleed, sometimes resulting in perforation of the tract and associated mediastinitis and pneumomediastinum."
    explanation: Names pneumomediastinum as a consequence of tract perforation.
- category: Gastrointestinal
  name: Vomiting and Diarrhoea
  description: >-
    Early, non-specific gastrointestinal symptoms. Their non-specificity is

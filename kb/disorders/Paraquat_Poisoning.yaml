    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This rapid development of fatal progressive respiratory failure was deduced based on the severe clinical status of the patient at the time of discharge and the established toxicological mechanisms of paraquat‐induced lung injury."
    explanation: >-
      Documents fatal progressive respiratory failure as the terminal event in a
      poisoned patient. Replaces an earlier snippet that spoke only to overall

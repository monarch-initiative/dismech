      label: Vomiting
    temporality: ACUTE
  evidence:
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 42-year-old male with a history of hypertension and diabetes was admitted to the ICU on December 8, presenting with a 4-day history of vomiting and diarrhea, and a 2-day history of dyspnea and oliguria."
    explanation: Documents vomiting and diarrhoea as the presenting features.
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the increasing prevalence of atypical exposure patterns, combined with early nonspecific manifestations such as gastrointestinal and respiratory symptoms, often results in a high misdiagnosis rate during the initial evaluation of occult poisoning."
    explanation: >-
      Supports the claim that the non-specificity of these symptoms drives
      misdiagnosis, which is why they are curated rather than omitted as generic.
- category: Respiratory

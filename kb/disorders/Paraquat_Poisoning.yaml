environmental:
- name: Ingestion of concentrated paraquat herbicide
  exposure_term:
    preferred_term: ingestion of concentrated paraquat herbicide formulation
    term:
      id: ECTO:9000395
      label: exposure to paraquat
  description: >-
    The dominant exposure route in fatal cases. Paraquat is cheap, widely
    available in agricultural communities, and highly toxic, which is the
    combination that makes it a leading agent of fatal pesticide self-poisoning.
    Cutaneous and mucosal contact are also reported routes.
  notes: >-
    `ECTO:9000395` is route-agnostic and is chosen over the route-specific
    siblings `ECTO:0090011` (in air), `ECTO:0090012` (in soil) and
    `ECTO:0090013` (in water), none of which describes ingestion. A full label
    scan of ECTO for `paraquat` returned exactly these four plus
    `ECTO:9001210` exposure to paraquat dichloride; there is no ingestion-route
    paraquat term.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, over the last decades, there have been numerous fatalities, mainly caused by accidental or voluntary ingestion."
    explanation: Establishes ingestion as the route producing fatalities.
  - reference: PMID:18154668
    reference_title: "The global distribution of fatal pesticide self-poisoning: systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it is the pattern of pesticide use and the toxicity of the products, not the quantity used, that influences the likelihood they will be used in acts of fatal self-harm."
    explanation: >-
      PARTIAL - this systematic review is about pesticide self-poisoning as a
      class rather than paraquat specifically, but it establishes product
      toxicity and availability, not volume sold, as what drives fatal use, which
      is the rationale for paraquat's prominence and for the bans described here.
  influences_mechanisms:
  - target: Ingestion of Concentrated Paraquat
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingesting a concentrated formulation is the route by which a lethal
      systemic dose is delivered.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Self-ingestion or cutaneous/mucosal contact can rapidly lead to multiorgan failure involving the respiratory, liver, and renal systems."
      explanation: >-
        Links the exposure routes directly to the multiorgan failure this entry

discussions:
- discussion_id: gap_paraquat_immunosuppression_efficacy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Alveolar Epithelial Injury and Cell Death"
  - "pathophysiology#Progressive Pulmonary Fibrosis"
  prompt: >-
    Does glucocorticoid plus cyclophosphamide immunosuppression reduce mortality
    in acute paraquat poisoning, and if so in which severity stratum?
  rationale: >-
    The evidence points both ways and this entry records both rather than
    choosing. A systematic search of human studies concluded that the efficacy of
    immunosuppression and antioxidants was anecdotal; three randomised controlled
    trials of dexamethasone, methylprednisolone and cyclophosphamide each reported
    a mortality benefit over standard treatment. That is a real contradiction, not
    a gradient of confidence, and there are two candidate explanations that lead
    to opposite clinical conclusions. Either the trials are right and the earlier
    reviews were diluted by heterogeneous, late-presenting cohorts; or the trials
    are small and conducted where severity assessment is limited, so apparent
    benefit reflects imbalance in ingested dose - the single strongest determinant
    of outcome - rather than treatment. The distinction matters because the
    intervention is not free: cyclophosphamide in a patient with acute kidney
    injury and impaired elimination carries real harm, and paraquat's case
    fatality is high enough that an ineffective therapy is not a neutral default.
    Note this entry's evidence for both positions is second-hand, drawn from an
    editorial summarising the primary literature rather than from the trials
    themselves; closing this gap starts with reading them.
  proposed_experiments:
  - experiment_id: exp_paraquat_immunosuppression_dose_stratified
    name: Dose-stratified randomised trial of immunosuppression in acute paraquat poisoning
    description: >-
      Multicentre randomised trial of glucocorticoid plus cyclophosphamide versus
      supportive care, with randomisation stratified on an objective measure of
      ingested dose (plasma paraquat concentration on a validated
      time-versus-concentration nomogram, or urine dithionite grade where plasma
      assay is unavailable), and with time from ingestion to presentation recorded
      as a prespecified covariate rather than an exclusion.
    decision_criterion: >-
      Whether a mortality difference survives adjustment for measured ingested
      dose and presentation delay, and whether any benefit is confined to a
      definable severity stratum rather than being uniform.
    would_support:
    - A mortality benefit that persists after adjustment for plasma paraquat concentration and presentation delay.
    - A benefit concentrated in an intermediate-dose stratum, which would explain why unstratified cohorts disagree.
    would_refute:
    - A benefit that disappears once ingested dose is adjusted for, indicating confounding by severity.
    - Excess harm in the immunosuppressed arm among patients with acute kidney injury.
- discussion_id: gap_paraquat_therapeutic_window_vs_lung_retention
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Polyamine-Transporter-Mediated Pulmonary Accumulation"
  prompt: >-
    Can any intervention reduce the pulmonary paraquat burden once uptake has
    occurred, or is the therapeutic window closed as soon as the lung has
    concentrated the dose?
  rationale: >-
    Two curated facts, taken together, predict the clinical observation and
    suggest the field is optimising the wrong variable. Paraquat is concentrated
    six- to ten-fold above plasma in lung and retained there as blood levels
    fall; and haemoperfusion helps within four to six hours and largely stops
    helping later. Extracorporeal elimination clears the compartment paraquat is
    leaving, not the one it has entered - which would explain why removing more
    drug, later, does not translate into survival. If that reading is right, the
    tractable target is not clearance but the polyamine transporter itself:
    competitive inhibition of uptake, plausible in principle since the transporter
    is a known and characterised system, would have to be given inside the same
    few hours to matter. What is missing is a direct measurement: no evidence
    consulted here reports lung paraquat burden as a function of time and of
    extracorporeal treatment in humans, so the causal claim that late clearance
    fails *because* of lung retention remains an inference from two separate
    observations.
  proposed_experiments:
  - experiment_id: exp_paraquat_lung_burden_kinetics
    name: Serial lung-versus-plasma paraquat kinetics under extracorporeal treatment
    description: >-
      Paired plasma and lung paraquat measurement over time in a large-animal
      model of ingestion, with and without haemoperfusion started at staggered
      intervals after dosing; complemented in humans by post-mortem lung paraquat
      concentration in treated and untreated fatalities with recorded ingestion
      and treatment times.
    decision_criterion: >-
      Whether extracorporeal clearance started after the early window lowers the
      lung concentration at all, or lowers plasma only while lung burden is
      unchanged.
    would_support:
    - Lung concentration unchanged by late haemoperfusion despite a fall in plasma.
    - A lung-to-plasma ratio that rises over time irrespective of treatment.
    would_refute:
    - Lung burden falling proportionally with plasma under late clearance, which would relocate the reason for treatment failure elsewhere.
- discussion_id: controversy_paraquat_parkinson_association
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#NADPH-Dependent Redox Cycling and Superoxide Generation"
  prompt: >-
    Is the epidemiological association between chronic low-dose paraquat exposure
    and Parkinson disease causal, and does it share a mechanism with the acute
    poisoning curated here?
  rationale: >-
    This entry curates acute high-dose poisoning; the paraquat-Parkinson question
    concerns chronic low-dose exposure and is a different exposure regime with a
    different target organ. They are linked here rather than merged because they
    share the redox-cycling node: paraquat is structurally similar to MPP+, is
    taken up by cation transporters, and is used experimentally to model
    nigrostriatal degeneration - and this knowledge base already treats paraquat
    as an environmental complex I toxin in `Parkinsons_Disease` and in the
    `parkinsonism_dopaminergic_degeneration` module. The association is
    meta-analytically supported but is not curated as established causation here,
    because the acute-poisoning literature cannot speak to it and this entry has
    not assessed the chronic-exposure evidence. Recorded so the relationship
    between these entries is explicit rather than implied by a shared substance
    name.
  evidence:
  - reference: PMID:30474499
    reference_title: "Paraquat exposure and Parkinson's disease: A systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a statistically significant association between paraquat exposure and PD."
    explanation: >-
      PARTIAL - the meta-analysis (13 case-control studies, OR 1.64, 95% CI
      1.27-2.13) establishes a statistically significant association, which is
      not the same as causation and says nothing about whether it shares a
      mechanism with the acute poisoning curated here. That is precisely the
      open question this discussion records.

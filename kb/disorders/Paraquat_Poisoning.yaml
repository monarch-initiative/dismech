name: Paraquat Poisoning
creation_date: "2026-08-22T18:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Pesticide Poisoning
- Environmental Health Disorder
synonyms:
- paraquat intoxication
- paraquat dichloride poisoning
- methyl viologen poisoning
description: >-
  Paraquat poisoning is intoxication by the non-selective bipyridylium herbicide
  paraquat (methyl viologen), most often after deliberate ingestion of a
  concentrated formulation. Two properties make it exceptionally lethal. First,
  paraquat is accumulated against a concentration gradient into lung epithelium
  by the polyamine transport system, reaching pulmonary concentrations six to ten
  times those in plasma and being retained there as blood levels fall - which is
  why the lung is the principal target organ despite the exposure being systemic.
  Second, once inside the cell it undergoes redox cycling: one-electron reduction
  to a cation radical followed by reoxidation by molecular oxygen, which
  regenerates the parent compound and so generates superoxide catalytically
  rather than stoichiometrically, consuming reducing equivalents as it goes. The
  illness is biphasic - caustic oropharyngeal and gastrointestinal injury with
  acute kidney and liver failure in the first days, then a delayed
  fibroproliferative phase in which survivors develop progressive pulmonary
  fibrosis and die of respiratory failure over two to three weeks. There is no
  antidote, and reported case fatality reaches 90%.
disease_term:
  preferred_term: paraquat poisoning
  term:
    id: MONDO:0017862
    label: paraquat poisoning
notes: >-
  MONDO records the causative chemical directly on this term as
  `RO:0004028 CHEBI:34905 ! paraquat`, so the agent is already machine-queryable
  from the disease term and is not duplicated into a `mappings` block - the
  `DiseaseMappings` class has no chemical slot in any case.

  No `prevalence:` record is curated. The only occurrence figure located is a
  systematic-review estimate of 258,234 deaths per year from pesticide
  self-poisoning worldwide, about 30% of global suicides (PMID:18154668) - but
  that counts ALL pesticides, of which paraquat is one prominent agent, so
  recording it as this disease's prevalence would misattribute it. An earlier
  draft did record it with the scope written into the `population` field, which
  CLAUDE.md reserves for cohort and geography; that was a category error dressed
  up as a caveat. The class-level figure is kept here as context instead.
  Orphanet (`Orphanet:31827`, xrefed from MONDO:0017862) would be the right
  source for a paraquat-specific prevalence class, but no `ORPHA_31827.md` is
  present in `references_cache/`; `just structured-rebuild-orphanet --id 31827`
  is the way to obtain one.
pathophysiology:
- name: Ingestion of Concentrated Paraquat
  biological_scale: ORGANISM
  description: >-
    The exposure event. Deaths follow accidental or deliberate ingestion of
    concentrated herbicide formulations; cutaneous and mucosal contact are also
    reported routes. Dose sets the tempo rather than merely the severity:
    fulminant poisoning above roughly 40 mg/kg kills within two to three days,
    while lower doses produce the slower fibrotic course. Paraquat is a leading
    agent in the wider problem of fatal pesticide self-poisoning, which the
    global literature places at roughly a third of all suicides worldwide.
  notes: >-
    Carries no ontology-bound process descriptor by design - this node denotes an
    exposure event rather than a host biological process, and no GO term
    describes it. The exposure is grounded through ECTO in the `environmental:`
    block instead.
  downstream:
  - target: Caustic Oropharyngeal and Gastrointestinal Injury
    description: >-
      Direct contact of concentrated herbicide with mucosal surfaces on the way
      down.
  - target: Polyamine-Transporter-Mediated Pulmonary Accumulation
    description: >-
      Absorbed paraquat is delivered systemically and concentrated by lung
      epithelium.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, over the last decades, there have been numerous fatalities, mainly caused by accidental or voluntary ingestion."
    explanation: Establishes ingestion as the route producing fatal poisoning.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Self-ingestion or cutaneous/mucosal contact can rapidly lead to multiorgan failure involving the respiratory, liver, and renal systems."
    explanation: Names the routes of exposure and the organ systems they reach.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, patients with fulminant poisoning (more than 40 mg per kg body weight) can develop complications within hours and die in 2-3 days."
    explanation: >-
      Supports the dose-dependent tempo: above roughly 40 mg/kg the illness is
      fulminant rather than fibrotic.
- name: Caustic Oropharyngeal and Gastrointestinal Injury
  biological_scale: TISSUE
  description: >-
    Direct corrosive injury where concentrated herbicide contacts mucosa. It
    begins focally, most often on the tongue, and with delay becomes multifocal
    and diffuse, involving buccal mucosa and then oropharynx and oesophagus.
    Lesions ulcerate and bleed, and can perforate the tract with consequent
    mediastinitis and pneumomediastinum. This arm is not merely cosmetic - severe
    mucositis is associated with systemic complications including acute kidney
    injury, which is what makes the oral findings prognostically informative.
  biological_processes:
  - preferred_term: mucosal ulceration and necrosis following caustic contact
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  downstream:
  - target: Paraquat-Associated Stomatitis
    description: The oral expression of caustic mucosal injury.
  - target: Pneumomediastinum
    description: >-
      Perforation of the ulcerated tract allows air into the mediastinum.
  - target: Subcutaneous Emphysema
    description: >-
      Air tracking from the mediastinum reaches the cervical and thoracic soft
      tissues.
  - target: Proximal Tubular Injury and Acute Kidney Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe mucosal disease travels with acute kidney injury. Marked INDIRECT
      because the cited evidence is an association across pooled cases, not a
      demonstrated causal route - the shared driver is most likely ingested dose.
  - target: Severe Mucositis
    description: The higher-grade expression of the same mucosal lesion.
  - target: Vomiting
    description: Mucosal irritation drives early emesis.
  - target: Diarrhea
    description: Mucosal injury extends through the gastrointestinal tract.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gastrointestinal toxicity occurs in the form of mucosal lesions which can ulcerate and bleed, sometimes resulting in perforation of the tract and associated mediastinitis and pneumomediastinum."
    explanation: States the ulceration, bleeding and perforation this node asserts.
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With increasing treatment delay, lesions progressed to a multifocal and diffuse pattern, significantly involving the buccal mucosa (Absolute Risk Difference, ARD: 55.6%; p = 0.049) and oropharynx/oesophagus."
    explanation: >-
      Supports the focal-to-diffuse anatomical progression described here, from a
      pooled individual-patient analysis of 170 cases.
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A strong association existed between severe PAS and systemic complications like acute kidney injury."
    explanation: >-
      Supports the claim that the mucosal arm tracks systemic toxicity rather
      than being an isolated local effect.
- name: Polyamine-Transporter-Mediated Pulmonary Accumulation
  biological_scale: CELLULAR
  description: >-
    The reason the lung is the target organ. Paraquat is a substrate of the
    polyamine transport system, which is abundantly expressed in the membranes of
    alveolar type I and type II cells and Clara (club) cells. Transport is
    against the concentration gradient, so pulmonary concentrations reach six to
    ten times plasma levels, and - critically for treatment timing - paraquat is
    retained in lung even once blood levels begin to fall. This is why measures
    that lower the plasma level late have limited effect on the lung burden
    already established.
  cell_types:
  - preferred_term: alveolar type I cell
    term:
      id: CL:0002062
      label: pulmonary alveolar type 1 cell
  - preferred_term: alveolar type II cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  - preferred_term: Clara (club) cell
    term:
      id: CL:0000158
      label: club cell
  biological_processes:
  - preferred_term: polyamine transport system-mediated uptake of paraquat
    modifier: INCREASED
    term:
      id: GO:1902047
      label: polyamine transmembrane transport
  molecular_functions:
  - preferred_term: polyamine transporter accepting paraquat as a substrate
    term:
      id: GO:0015203
      label: polyamine transmembrane transporter activity
  downstream:
  - target: Redox Cycling and Catalytic Superoxide Generation
    description: >-
      Intracellular paraquat becomes the substrate for catalytic redox cycling.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PQ mainly accumulates in the lung (pulmonary concentrations can be 6 to 10 times higher than those in the plasma), where it is retained even when blood levels start to decrease."
    explanation: >-
      Quantifies the pulmonary accumulation and states the retention that
      persists as plasma levels fall.
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pulmonary effects can be explained by the participation of the polyamine transport system abundantly expressed in the membrane of alveolar cells type I, II, and Clara cells."
    explanation: >-
      Names the transporter and the three cell types, which is what the cell_type
      bindings on this node encode.
- name: Redox Cycling and Catalytic Superoxide Generation
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting molecular lesion. Paraquat undergoes one-electron reduction
    to a cation radical, which is reoxidised by molecular oxygen; the reoxidation
    regenerates the parent paraquat cation and releases superoxide. Because the
    toxicant is regenerated, one paraquat molecule generates reactive oxygen
    species catalytically rather than being consumed, which is why very small
    intracellular quantities are lethal and why no stoichiometric scavenger has
    succeeded as an antidote. The cycle also consumes reducing equivalents,
    compounding oxidative injury with a loss of antioxidant reserve. The reduction is
    localised: paraquat is carried into the mitochondrial matrix in a
    membrane-potential-dependent manner as the dication rather than the radical,
    and is there reduced principally by complex I in mammalian mitochondria.
  notes: >-
    The node name is deliberately cofactor-agnostic. An earlier draft called it
    "NADPH-Dependent", which was wrong twice over: mammalian complex I is
    NADH:ubiquinone oxidoreductase (`GO:0008137` NADH dehydrogenase (ubiquinone)
    activity), and the cited abstract puts NADPH on the *yeast* side of the same
    sentence - "reduced by complex I (mammals) or by NADPH dehydrogenases
    (yeast)". The name therefore asserted the one cofactor this entry declines to
    curate and mislabelled the one it does. Two reduction sites are reported and
    they are complementary rather than competing: mitochondrial complex I, localised experimentally in isolated
    mitochondria, and NADPH oxidase, emphasised in the clinical literature. This
    entry curates complex I on the node because that is where the direct
    experimental evidence sits, and records the NADPH oxidase claim here rather
    than binding it, since the source asserting it is a two-patient case report
    citing secondary literature.
  biological_processes:
  - preferred_term: catalytic superoxide generation by paraquat redox cycling
    modifier: INCREASED
    term:
      id: GO:0042554
      label: superoxide anion generation
  - preferred_term: overwhelmed cellular oxidative stress response
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Alveolar Epithelial Injury and Cell Death
    description: >-
      Sustained radical generation inside lung epithelium exceeds antioxidant
      capacity.
  - target: Proximal Tubular Injury and Acute Kidney Injury
    description: >-
      The same redox chemistry operates in the proximal tubule, where paraquat
      also distributes highly.
  - target: Cardiac Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Paraquat causes multiorgan injury including the heart, and the same redox
      chemistry is the presumed route. Marked INDIRECT_UNKNOWN_INTERMEDIATES
      deliberately: no human study localises cardiac injury to redox cycling, so
      this connects the node to the graph without asserting the mechanism the
      accompanying KNOWLEDGE_GAP says is unestablished.
  - target: Hepatocellular Injury
    description: >-
      And in hepatocytes, damaging smooth endoplasmic reticulum and mitochondria.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Further downstream at the toxicodynamic level, the main molecular mechanism of PQ toxicity is based on redox cycling and intracellular oxidative stress generation."
    explanation: Identifies redox cycling as the principal molecular mechanism.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Paraquat exerts its toxic and lethal effects by forming cation radicals post-metabolism, subsequently generating free oxygen radicals, leading to mitochondrial damage and apoptosis."
    explanation: >-
      States the cation radical intermediate and the downstream radical
      generation, mitochondrial damage and apoptosis.
  - reference: PMID:18039652
    reference_title: "Complex I is the major site of mitochondrial superoxide production by paraquat."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experiments with disrupted mitochondria showed that once in the matrix paraquat was principally reduced by complex I (mammals) or by NADPH dehydrogenases (yeast) to form the paraquat radical cation that then reacted with oxygen to form superoxide."
    explanation: >-
      Localises the one-electron reduction to mitochondrial complex I in mammals
      and states the radical-then-superoxide sequence this node asserts.
  - reference: PMID:18039652
    reference_title: "Complex I is the major site of mitochondrial superoxide production by paraquat."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This paraquat-induced superoxide production in the mitochondrial matrix required a membrane potential that was essential for paraquat uptake into mitochondria."
    explanation: >-
      Establishes a second, membrane-potential-dependent transport step that
      concentrates paraquat inside mitochondria before reduction, so the
      selectivity story has two tiers - cellular, then subcellular.
- name: Alveolar Epithelial Injury and Cell Death
  biological_scale: CELLULAR
  description: >-
    Oxidative injury to the alveolar epithelium, expressed as alveolitis and
    alveolar damage with mitochondrial injury and cell death. Cell death here is
    not apoptosis alone: rat work implicates ferroptosis - iron-dependent lipid
    peroxidative death - driven by Keap1 upregulation and Nrf2 degradation, which
    connects the redox arm to the fibrotic one through a distinct death
    programme. This is the destructive phase that precedes and licenses the
    fibrotic one.
  cell_types:
  - preferred_term: pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  biological_processes:
  - preferred_term: oxidative-stress-driven apoptosis of alveolar epithelium
    modifier: INCREASED
    term:
      id: GO:0008631
      label: intrinsic apoptotic signaling pathway in response to oxidative stress
  - preferred_term: iron-dependent lipid peroxidative cell death (ferroptosis)
    modifier: INCREASED
    term:
      id: GO:0097707
      label: ferroptosis
  downstream:
  - target: TGF-beta-Driven Mesenchymal Transition of Alveolar Epithelium
    description: >-
      Surviving epithelium at sublethal exposure transforms rather than dies.
  - target: Acute Respiratory Distress Syndrome
    description: >-
      Diffuse alveolar injury presents clinically as ARDS, days before the
      fibrotic phase.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lungs are affected the most as the chemical is sequestrated here due to the concentration gradient, and alveolitis, alveolar damage, and fibrosis set in."
    explanation: >-
      States the alveolitis and alveolar damage of this node and its progression
      to fibrosis.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Paraquat exerts its toxic and lethal effects by forming cation radicals post-metabolism, subsequently generating free oxygen radicals, leading to mitochondrial damage and apoptosis."
    explanation: >-
      Carries the mitochondrial-damage and apoptosis claim this node's
      description and its `GO:0008631` binding rest on. The same sentence also
      evidences the upstream redox node; it is repeated here rather than left
      one node away from the claim it supports.
  - reference: PMID:37812357
    reference_title: "Molecular mechanism of paraquat-induced ferroptosis leading to pulmonary fibrosis mediated by Keap1/Nrf2 signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that PQ can regulate Keap1/Nrf2 signaling pathway, leading to increased lipid peroxidation and abnormal iron uptake, thereby inducing iron death and exacerbating the progression of pulmonary fibrosis."
    explanation: >-
      Rat evidence for ferroptosis as a second death programme linking oxidative
      injury to fibrosis, and the basis for the `GO:0097707` binding. Tagged
      MODEL_ORGANISM: no human data establish this arm.
- name: TGF-beta-Driven Mesenchymal Transition of Alveolar Epithelium
  biological_scale: CELLULAR
  description: >-
    The step that converts injury into fibrosis, and it is dose-dependent in a
    way that matters clinically. In alveolar epithelial cells, short high-dose
    paraquat causes apoptotic death, whereas prolonged low-dose exposure instead
    drives transformation into spindle-shaped mesenchymal-like cells that lose
    E-cadherin, gain alpha-smooth muscle actin and secrete fibronectin. The
    transformation is TGF-beta1-dependent - a receptor antagonist abolishes it -
    and it confers resistance to cell death, so the cells that survive are
    precisely the ones that make matrix. This is why subacute, lower-dose
    poisoning produces the delayed fibrotic course rather than simply a milder
    version of the fulminant one.
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  cell_types:
  - preferred_term: alveolar epithelial cell undergoing mesenchymal transition
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  - preferred_term: myofibroblast-like cell
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: EMT-like transformation of alveolar epithelium
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: TGF-beta1 signalling driving the transition
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  notes: >-
    Entirely in-vitro: A549 and normal human bronchial epithelial cells. It is
    wired into the human causal chain nonetheless - unlike the rodent arms
    declined in other entries - because the dose-and-duration dependence it
    demonstrates is what explains the biphasic clinical course this entry curates,
    and the authors state the model reflects the etiology of human poisoning.
    A curator who disagrees with that judgement should detach the edge rather
    than delete the node.
  downstream:
  - target: Progressive Pulmonary Fibrosis
    description: >-
      Mesenchymal-like cells secrete the extracellular matrix that becomes
      fibrosis.
  evidence:
  - reference: PMID:25799450
    reference_title: "Paraquat induces epithelial-mesenchymal transition-like cellular response resulting in fibrogenesis and the prevention of apoptosis in human pulmonary epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, long-term (6-12 days) low-dose (30 μM) treatments with PQ resulted in a transformation into spindle-shaped mesenchymal-like cells with a decrease of E-cadherin as well as an increase of α-smooth muscle actin"
    explanation: >-
      States the mesenchymal transformation and its marker shift, and pins it to
      the low-dose long-duration condition rather than to high-dose exposure.
  - reference: PMID:25799450
    reference_title: "Paraquat induces epithelial-mesenchymal transition-like cellular response resulting in fibrogenesis and the prevention of apoptosis in human pulmonary epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The administration of a TGF-β1 receptor antagonist, SB431542, almost completely attenuated the mesenchymal transformation as well as fibronectin secretion, suggesting a crucial role of TGF-β1 in EMT-like cellular response and subsequent fibrogenesis."
    explanation: >-
      Establishes TGF-beta1 dependence by antagonist rescue, which is what
      licenses the GO:0007179 binding on this node.
- name: Progressive Pulmonary Fibrosis
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  description: >-
    The delayed fibroproliferative phase, and the characteristic cause of death
    in patients who survive the acute multiorgan insult. Fibrosis obliterates the
    gas-exchange surface over two to three weeks, producing progressive
    respiratory failure. Its delayed onset is what makes paraquat poisoning
    unusual among acute toxidromes: a patient can appear to stabilise and still
    die of the exposure a fortnight later.
  biological_processes:
  - preferred_term: fibrotic extracellular matrix deposition in the alveolar wall
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: collagen fibril deposition
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Multiorgan Failure and Death
    description: >-
      Loss of gas-exchange surface produces terminal respiratory failure.
  - target: Pulmonary Fibrosis
    description: The radiological and histological expression of this node.
  - target: Respiratory Failure
    description: Loss of gas-exchange surface produces respiratory failure.
  - target: Dyspnea
    description: Falling compliance and gas exchange are felt as breathlessness.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, severe poisoning can lead to acute kidney failure, acute lung injury, and lung fibrosis resulting in death over 2-3 weeks."
    explanation: >-
      Establishes lung fibrosis as the delayed cause of death and gives the
      two-to-three-week interval.
- name: Proximal Tubular Injury and Acute Kidney Injury
  biological_scale: TISSUE
  description: >-
    Necrosis of the proximal convoluted tubule, where paraquat distribution is
    high. The kidney concentrates paraquat by an active transport route of its
    own, distinct from the lung's: the organic cation transporter hOCT2 (SLC22A2)
    and the extrusion transporter hMATE1 both carry paraquat, and expressing
    either in cells raises both uptake and cytotoxicity by an order of magnitude.
    Renal failure therefore matters three times over - as organ injury, as the
    route by which most of an absorbed dose leaves the body, and because the very
    transporters that clear paraquat are what load the tubular cell with it.
  cell_types:
  - preferred_term: proximal convoluted tubule epithelial cell
    term:
      id: CL:1000838
      label: kidney proximal convoluted tubule epithelial cell
  biological_processes:
  - preferred_term: hOCT2- and hMATE1-mediated tubular transport of paraquat
    modifier: INCREASED
    term:
      id: GO:0055085
      label: transmembrane transport
  notes: >-
    Two ontology limitations, both recorded so a later curator does not read them
    as oversights. First, no molecular_function descriptor is bound for the
    transporter itself: every GO organic-cation-transmembrane-transporter-activity
    term is obsolete (`GO:0015101`, `GO:0008513`). Second, the natural process
    term `GO:0015695` organic cation transport is ALSO obsolete in current GO -
    OLS returns its label as `obsolete organic cation transport` - so the dynamic
    enum was right to reject it, and `GO:0055085` transmembrane transport is
    bound instead with a specific preferred_term. Recorded because the local
    `sqlite:obo:go` build used for lookups here is stale: it still reports
    `GO:0015695` as live, with an `is_a GO:0006810` parent and no deprecation
    axiom. An earlier draft of this note trusted that build and wrongly blamed a
    gap in the enum's membership cache. One local OAK build is not sufficient
    evidence that a term is live - cross-check obsoletion against OLS or against
    the label the term validator itself writes into `cache/`, which is what
    caught this.
  downstream:
  - target: Multiorgan Failure and Death
    description: Renal failure contributes to the multiorgan course.
  - target: Acute Kidney Injury
    description: The clinical expression of tubular necrosis.
  - target: Oliguria
    description: Falling urine output accompanies the fall in filtration.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kidney failure occurs due to necrosis in the proximal convoluted tubule whereas acute liver injury occurs due to damage to the smooth endoplasmic reticulum and mitochondria, the distribution being high in these two organs."
    explanation: >-
      States the proximal tubular necrosis mechanism and the high renal and
      hepatic distribution.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Though 90% of the compound is excreted in the urine unchanged within 12-24 hours post-exposure, it is the absorbed chemical that manifests the complications, and treatment interventions are aimed at it."
    explanation: >-
      PARTIAL - establishes that urinary excretion is the dominant elimination
      route, which is the premise for the claim that tubular injury impairs
      clearance; the source does not itself state that renal injury slows
      elimination.
  - reference: PMID:17495125
    reference_title: "Transport of paraquat by human organic cation transporters and multidrug and toxic compound extrusion family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that overexpression of hOCT2 but not hOCT1 and hOCT3 in HEK-293 cells significantly enhanced the accumulation and cytotoxicity of PQ"
    explanation: >-
      Identifies hOCT2 specifically - and excludes hOCT1 and hOCT3 - as the
      transporter whose expression raises both paraquat accumulation and
      cytotoxicity.
  - reference: PMID:17495125
    reference_title: "Transport of paraquat by human organic cation transporters and multidrug and toxic compound extrusion family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Because PQ is primarily eliminated in the kidney, renal elimination, including tubular transport, plays a critical role in controlling systemic exposure to the herbicide."
    explanation: >-
      Supports the dual role of renal tubular transport in both eliminating
      paraquat and exposing the tubular cell to it.
- name: Hepatocellular Injury
  biological_scale: TISSUE
  description: >-
    Acute liver injury from damage to the smooth endoplasmic reticulum and
    mitochondria of hepatocytes, in which paraquat also distributes highly.
  downstream:
  - target: Multiorgan Failure and Death
    description: Hepatic failure contributes to the multiorgan course.
  - target: Acute Liver Injury
    description: The clinical expression of hepatocyte injury.
  - target: Jaundice
    description: Impaired bilirubin handling produces jaundice.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kidney failure occurs due to necrosis in the proximal convoluted tubule whereas acute liver injury occurs due to damage to the smooth endoplasmic reticulum and mitochondria, the distribution being high in these two organs."
    explanation: >-
      States the subcellular targets of hepatic injury and the high hepatic
      distribution.
- name: Cardiac Involvement
  biological_scale: TISSUE
  description: >-
    A real but poorly characterised arm, curated at the strength the evidence
    actually supports. Paraquat causes multiorgan injury including the heart, and
    dose-dependent falls in heart rate, blood pressure and cardiac contractility
    are documented in anaesthetised rodents. In humans the picture is thin: the
    source curated here states plainly that little to no evidence exists on the
    haemodynamic and cardiac electromechanical effects of acute poisoning, and
    reports severe bradycardia refractory to anticholinergics as an unusual
    manifestation.
  notes: >-
    The deep-research report for this entry asserts that cardiogenic or
    circulatory collapse is "the dominant fatal mechanism in the fulminant form".
    That claim is NOT curated, and the node is deliberately not placed on a fatal
    path. No source located for this entry supports it, and the one human source
    that addresses the question directly says the opposite - that the cardiac
    effects of acute paraquat poisoning are close to uncharacterised. Treating a
    deep-research assertion as evidence is exactly what the DR SOP warns against;
    see the accompanying KNOWLEDGE_GAP.
  downstream:
  - target: Bradycardia
    description: >-
      Reported as an unusual manifestation, refractory to chronotropic agents.
  evidence:
  - reference: PMID:38204158
    reference_title: "Unraveling the link between severe bradycardia and paraquat poisoning."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "However, little to no evidence exists on the hemodynamic and cardiac electromechanical effects of acute paraquat poisoning [7]."
    explanation: >-
      PARTIAL by its own content: this is the source establishing that the human
      cardiac evidence base is close to empty, which is what bounds this node.
  - reference: PMID:38204158
    reference_title: "Unraveling the link between severe bradycardia and paraquat poisoning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Decreases in heart rate, blood pressure, and cardiac contractility have been noted in a dose-dependent manner in anesthetized rodents [7]."
    explanation: >-
      Rodent evidence for dose-dependent cardiac depression - the only
      mechanistic support this node has, and tagged MODEL_ORGANISM accordingly.
- name: Multiorgan Failure and Death
  biological_scale: ORGANISM
  description: >-
    The convergent outcome. Reported case fatality reaches 90%, and can follow
    even low doses. There is no antidote with specific effects, so the case
    fatality reflects the toxicology rather than any failure of supportive care.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the absence of an antidote, and with a fatality rate as high as 90%, which can occur even with low doses, it continues to be a potential hazard and challenge for clinicians."
    explanation: Establishes the case fatality and the absence of an antidote.
phenotypes:
- category: Oral
  name: Paraquat-Associated Stomatitis
  description: >-
    Oral mucosal ulceration ("paraquat tongue"), the most consistent early
    physical sign. It begins focally, usually on the tongue, and becomes
    multifocal and diffuse with delay to presentation.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Paraquat-associated stomatitis
    term:
      id: HP:0010280
      label: Stomatitis
    temporality: ACUTE

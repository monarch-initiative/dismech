      label: Respiratory failure
    temporality: ACUTE
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "PQ poisoning is an extremely frustrating condition to manage clinically, due to the elevated morbidity and mortality observed so far and due to the lack of effective treatments to be used in humans."
    explanation: >-
      PARTIAL - supports the high mortality of the condition, but not
      respiratory failure specifically as the terminal event; that link is
      carried by the pulmonary fibrosis evidence and the pathophysiology nodes.
- category: Renal
  name: Acute Kidney Injury
  description: >-
    Acute kidney injury from proximal tubular necrosis, appearing early and

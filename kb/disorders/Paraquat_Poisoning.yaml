- name: Occult inhalational exposure by nebulisation
  exposure_term:
    preferred_term: inhalation of nebulised paraquat solution
    term:
      id: ECTO:9000395
      label: exposure to paraquat
  description: >-
    A rare and diagnostically treacherous route: paraquat solution delivered by a
    personal nebulisation device. It is curated because it breaks the assumptions
    the usual diagnostic pathway rests on - there is no caustic oral injury to
    see, the exposure history is denied or absent, and an initial urine paraquat
    test can be negative. The diagnosis in the cited case was made only by
    analysing residue from the device itself.
  notes: >-
    Bound to the same route-agnostic `ECTO:9000395` as the ingestion entry, since
    ECTO has no inhalational paraquat term either; `ECTO:0090011` exposure to
    paraquat in air denotes ambient air, not deliberate nebulisation, and would
    misdescribe this route.
  evidence:
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the residual solution from his nebulization device confirmed the presence of methyl viologen, the active component of paraquat, establishing the diagnosis of inhaled paraquat poisoning via nebulization."
    explanation: >-
      Documents the nebulised inhalational route and how the diagnosis was
      finally established.
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although an initial urine paraquat test yielded a negative result, a subsequent targeted investigation of the patient's personal items revealed a video documenting inhalation of an unknown substance."
    explanation: >-
      Supports the specific diagnostic trap recorded here - a negative initial
      urine screen in a genuinely poisoned patient.
  influences_mechanisms:
  - target: Polyamine-Transporter-Mediated Pulmonary Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhalation delivers paraquat directly to the alveolar surface, reaching the
      target epithelium without the systemic absorption step that ingestion
      requires.
    evidence:
    - reference: PMID:42266604
      reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Delayed diagnosis invariably worsens outcomes in occult paraquat poisoning regardless of exposure route."
      explanation: >-
        PARTIAL - establishes that occult routes carry the same lethality, but
        does not itself evidence direct alveolar delivery; that is inference from
        the route, and is flagged as such rather than asserted.
treatments:
- name: Supportive Care Without an Antidote
  description: >-
    The baseline, and an honest statement of the position: there is no antidote
    with specific effects for acute paraquat poisoning. Everything else in this
    section is an attempt to reduce absorbed dose or blunt oxidative injury, and
    none of it is guideline-backed.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is currently no antidote with specific effects, for acute paraquat poisoning."
    explanation: States the absence of an antidote directly.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These modalities though, are not based on guidelines or recommendations, and the supporting evidence is also weak, as it has been extrapolated from animal studies and case series in resource-limited settings, which lack information on the severity of the disease."
    explanation: >-
      States that the treatment modalities in this section rest on weak,
      extrapolated evidence rather than guidelines.
- name: Extracorporeal Elimination (Haemoperfusion and Renal Replacement Therapy)
  description: >-
    Removal of absorbed paraquat by haemoperfusion, alone or combined with
    continuous renal replacement therapy. Timing dominates: benefit is reported
    when performed within four to six hours of ingestion and largely disappears
    with later presentation, which fits the toxicokinetics - paraquat is taken up
    into lung against a gradient and retained there as plasma levels fall, so
    lowering the plasma level late does not retrieve the lung burden already
    established.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: haemoperfusion and continuous renal replacement therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    Bound to the generic `NCIT:C49236` because NCIT has no haemoperfusion term -
    a direct label scan of the release used here returns zero matches for both
    `hemoperfusion` and `haemoperfusion`. The hemodialysis family exists but is a
    different modality.
  target_mechanisms:
  - target: Polyamine-Transporter-Mediated Pulmonary Accumulation
    treatment_effect: INHIBITS
    description: >-
      Lowering the circulating concentration early limits how much paraquat the
      lung can concentrate. The link is to the uptake node rather than to the
      exposure node because that is the step extracorporeal clearance actually
      competes with, and it is why the therapeutic window is measured in hours.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Majority of the studies emphasized that hemoperfusion should be performed within 4 hours of ingestion of paraquat, for best results."
      explanation: >-
        PARTIAL - establishes the narrow timing window, which is the observable
        consequence of competing with pulmonary uptake, but does not itself
        demonstrate the mechanistic link asserted here.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "They emphasized the use of hemoperfusion within 6 hours for improved outcome."
    explanation: >-
      Reports better outcome with early haemoperfusion in a 101-patient series.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A systematic review and meta-analysis in Iran in 2022, studied 44 patients where all required mechanical ventilation, and despite hemodialysis, there was no reduction in mortality."
    explanation: >-
      PARTIAL, and deliberately included as a counterweight - a pooled analysis
      showing no mortality reduction, attributed to delayed presentation. The
      evidence for extracorporeal elimination is not uniformly positive.
- name: Immunosuppression and Antioxidant Therapy
  description: >-
    Glucocorticoids (methylprednisolone, dexamethasone), cyclophosphamide, and
    antioxidants including vitamin C, vitamin E and N-acetylcysteine, aimed at the
    inflammatory and oxidative arms. The evidence is genuinely contested rather
    than merely thin - see the KNOWLEDGE_GAP discussion - and this entry does not
    record it as effective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: NCIT:C647
        label: Methylprednisolone
    - preferred_term: cyclophosphamide
      term:
        id: NCIT:C405
        label: Cyclophosphamide
  target_mechanisms:
  - target: NADPH-Dependent Redox Cycling and Superoxide Generation
    treatment_effect: MODULATES
    description: >-
      Antioxidants aim at the oxidative output of redox cycling.
      MODULATES rather than INHIBITS deliberately: because paraquat is
      regenerated each cycle, it produces radicals catalytically, so a
      stoichiometric scavenger cannot stop the source - only buffer the product.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Measures for treatment include reducing poison absorption and eliminating absorbed poison, use of antioxidants, anti-inflammatory agents, and immunosuppressants, hemodialysis, and hemoperfusion, along with other supportive care."
      explanation: >-
        PARTIAL - establishes that antioxidants and immunosuppressants are used
        against this mechanism, without evidencing that they work.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "However, another three randomized controlled trials compared dexamethasone, methylprednisolone, and cyclophosphamide with standard treatment, and all three showed mortality benefit in the treatment arm compared to the standard treatment."
    explanation: >-
      PARTIAL - randomised evidence of mortality benefit, reported second-hand in
      an editorial rather than read here in the primary trials.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "They suggested that the efficacy of immunosuppression and antioxidants was anecdotal."
    explanation: >-
      REFUTE - a systematic search of human studies concluding the efficacy is
      anecdotal, directly contradicting the trial evidence above. Both are
      recorded so the disagreement is visible in the entry rather than resolved
      by selection.
- name: Reduction of Absorption
  description: >-
    Gastric lavage and adsorbents to limit the absorbed dose. Rational given the
    dose dependence of outcome, but subject to the same narrow time window as
    extracorporeal elimination.
  notes: >-
    The agent is bound to `CHEBI:91090` charcoal rather than `NCIT:C77524`
    Activated Charcoal: the NCIT term is not a member of the schema's
    `ChemicalEntityTerm` dynamic enum and is rejected by term validation. CHEBI
    has no separate activated-charcoal term, so `preferred_term` carries the
    "activated" qualifier that the bound label lacks.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: activated charcoal
      term:
        id: CHEBI:91090
        label: charcoal
  target_mechanisms:
  - target: Ingestion of Concentrated Paraquat
    treatment_effect: INHIBITS
    description: >-
      Limits how much of an ingested dose reaches the systemic circulation.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Measures for treatment include reducing poison absorption and eliminating absorbed poison, use of antioxidants, anti-inflammatory agents, and immunosuppressants, hemodialysis, and hemoperfusion, along with other supportive care."
      explanation: >-
        PARTIAL - names reducing absorption as a treatment aim without
        quantifying its effect.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "It included 109 patients in a tertiary hospital, where all treatment modalities were provided, including gastric lavage, mechanical ventilation, immunosuppression, antioxidants, hemoperfusion, and renal replacement therapy."
    explanation: >-
      PARTIAL - documents gastric lavage as part of the standard bundle in a
      109-patient series whose mortality was nonetheless 88%.

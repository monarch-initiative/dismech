name: Paraquat Poisoning
creation_date: "2026-08-22T18:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Pesticide Poisoning
- Environmental Health Disorder
synonyms:
- paraquat intoxication
- paraquat dichloride poisoning
- methyl viologen poisoning
description: >-
  Paraquat poisoning is intoxication by the non-selective bipyridylium herbicide
  paraquat (methyl viologen), most often after deliberate ingestion of a
  concentrated formulation. Two properties make it exceptionally lethal. First,
  paraquat is accumulated against a concentration gradient into lung epithelium
  by the polyamine transport system, reaching pulmonary concentrations six to ten
  times those in plasma and being retained there as blood levels fall - which is
  why the lung is the principal target organ despite the exposure being systemic.
  Second, once inside the cell it undergoes redox cycling: one-electron reduction
  to a cation radical followed by reoxidation by molecular oxygen, which
  regenerates the parent compound and so generates superoxide catalytically
  rather than stoichiometrically, consuming reducing equivalents as it goes. The
  illness is biphasic - caustic oropharyngeal and gastrointestinal injury with
  acute kidney and liver failure in the first days, then a delayed
  fibroproliferative phase in which survivors develop progressive pulmonary
  fibrosis and die of respiratory failure over two to three weeks. There is no
  antidote, and reported case fatality reaches 90%.
disease_term:
  preferred_term: paraquat poisoning
  term:
    id: MONDO:0017862
    label: paraquat poisoning
notes: >-
  MONDO records the causative chemical directly on this term as
  `RO:0004028 CHEBI:34905 ! paraquat`, so the agent is already machine-queryable
  from the disease term and is not duplicated into a `mappings` block - the
  `DiseaseMappings` class has no chemical slot in any case.
pathophysiology:
- name: Ingestion of Concentrated Paraquat
  biological_scale: ORGANISM
  description: >-
    The exposure event. Deaths follow accidental or deliberate ingestion of
    concentrated herbicide formulations; cutaneous and mucosal contact are also
    reported routes. Dose sets the tempo rather than merely the severity:
    fulminant poisoning above roughly 40 mg/kg kills within two to three days,
    while lower doses produce the slower fibrotic course. Paraquat is a leading
    agent in the wider problem of fatal pesticide self-poisoning, which the
    global literature places at roughly a third of all suicides worldwide.
  notes: >-
    Carries no ontology-bound process descriptor by design - this node denotes an
    exposure event rather than a host biological process, and no GO term
    describes it. The exposure is grounded through ECTO in the `environmental:`
    block instead.
  downstream:
  - target: Caustic Oropharyngeal and Gastrointestinal Injury
    description: >-
      Direct contact of concentrated herbicide with mucosal surfaces on the way
      down.
  - target: Polyamine-Transporter-Mediated Pulmonary Accumulation
    description: >-
      Absorbed paraquat is delivered systemically and concentrated by lung
      epithelium.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, over the last decades, there have been numerous fatalities, mainly caused by accidental or voluntary ingestion."
    explanation: Establishes ingestion as the route producing fatal poisoning.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Self-ingestion or cutaneous/mucosal contact can rapidly lead to multiorgan failure involving the respiratory, liver, and renal systems."
    explanation: Names the routes of exposure and the organ systems they reach.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, patients with fulminant poisoning (more than 40 mg per kg body weight) can develop complications within hours and die in 2-3 days."
    explanation: >-
      Supports the dose-dependent tempo: above roughly 40 mg/kg the illness is
      fulminant rather than fibrotic.
- name: Caustic Oropharyngeal and Gastrointestinal Injury
  biological_scale: TISSUE
  description: >-
    Direct corrosive injury where concentrated herbicide contacts mucosa. It
    begins focally, most often on the tongue, and with delay becomes multifocal
    and diffuse, involving buccal mucosa and then oropharynx and oesophagus.
    Lesions ulcerate and bleed, and can perforate the tract with consequent
    mediastinitis and pneumomediastinum. This arm is not merely cosmetic - severe
    mucositis is associated with systemic complications including acute kidney
    injury, which is what makes the oral findings prognostically informative.
  biological_processes:
  - preferred_term: mucosal ulceration and necrosis following caustic contact
    modifier: INCREASED
    term:
      id: GO:0008219
      label: cell death
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Gastrointestinal toxicity occurs in the form of mucosal lesions which can ulcerate and bleed, sometimes resulting in perforation of the tract and associated mediastinitis and pneumomediastinum."
    explanation: States the ulceration, bleeding and perforation this node asserts.
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With increasing treatment delay, lesions progressed to a multifocal and diffuse pattern, significantly involving the buccal mucosa (Absolute Risk Difference, ARD: 55.6%; p = 0.049) and oropharynx/oesophagus."
    explanation: >-
      Supports the focal-to-diffuse anatomical progression described here, from a
      pooled individual-patient analysis of 170 cases.
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A strong association existed between severe PAS and systemic complications like acute kidney injury."
    explanation: >-
      Supports the claim that the mucosal arm tracks systemic toxicity rather
      than being an isolated local effect.
- name: Polyamine-Transporter-Mediated Pulmonary Accumulation
  biological_scale: CELLULAR
  description: >-
    The reason the lung is the target organ. Paraquat is a substrate of the
    polyamine transport system, which is abundantly expressed in the membranes of
    alveolar type I and type II cells and Clara (club) cells. Transport is
    against the concentration gradient, so pulmonary concentrations reach six to
    ten times plasma levels, and - critically for treatment timing - paraquat is
    retained in lung even once blood levels begin to fall. This is why measures
    that lower the plasma level late have limited effect on the lung burden
    already established.
  cell_types:
  - preferred_term: alveolar type I cell
    term:
      id: CL:0002062
      label: pulmonary alveolar type 1 cell
  - preferred_term: alveolar type II cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  - preferred_term: Clara (club) cell
    term:
      id: CL:0000158
      label: club cell
  biological_processes:
  - preferred_term: polyamine transport system-mediated uptake of paraquat
    modifier: INCREASED
    term:
      id: GO:1902047
      label: polyamine transmembrane transport
  molecular_functions:
  - preferred_term: polyamine transporter accepting paraquat as a substrate
    term:
      id: GO:0015203
      label: polyamine transmembrane transporter activity
  downstream:
  - target: NADPH-Dependent Redox Cycling and Superoxide Generation
    description: >-
      Intracellular paraquat becomes the substrate for catalytic redox cycling.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PQ mainly accumulates in the lung (pulmonary concentrations can be 6 to 10 times higher than those in the plasma), where it is retained even when blood levels start to decrease."
    explanation: >-
      Quantifies the pulmonary accumulation and states the retention that
      persists as plasma levels fall.
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pulmonary effects can be explained by the participation of the polyamine transport system abundantly expressed in the membrane of alveolar cells type I, II, and Clara cells."
    explanation: >-
      Names the transporter and the three cell types, which is what the cell_type
      bindings on this node encode.
- name: NADPH-Dependent Redox Cycling and Superoxide Generation
  biological_scale: MOLECULAR
  description: >-
    The rate-limiting molecular lesion. Paraquat undergoes one-electron reduction
    to a cation radical, which is reoxidised by molecular oxygen; the reoxidation
    regenerates the parent paraquat cation and releases superoxide. Because the
    toxicant is regenerated, one paraquat molecule generates reactive oxygen
    species catalytically rather than being consumed, which is why very small
    intracellular quantities are lethal and why no stoichiometric scavenger has
    succeeded as an antidote. The cycle also consumes reducing equivalents,
    compounding oxidative injury with a loss of antioxidant reserve. The reduction is
    localised: paraquat is carried into the mitochondrial matrix in a
    membrane-potential-dependent manner as the dication rather than the radical,
    and is there reduced principally by complex I in mammalian mitochondria.
  notes: >-
    Two reduction sites are reported and they are complementary rather than
    competing: mitochondrial complex I, localised experimentally in isolated
    mitochondria, and NADPH oxidase, emphasised in the clinical literature. This
    entry curates complex I on the node because that is where the direct
    experimental evidence sits, and records the NADPH oxidase claim here rather
    than binding it, since the source asserting it is a two-patient case report
    citing secondary literature.
  biological_processes:
  - preferred_term: catalytic superoxide generation by paraquat redox cycling
    modifier: INCREASED
    term:
      id: GO:0042554
      label: superoxide anion generation
  - preferred_term: overwhelmed cellular oxidative stress response
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  downstream:
  - target: Alveolar Epithelial Injury and Cell Death
    description: >-
      Sustained radical generation inside lung epithelium exceeds antioxidant
      capacity.
  - target: Proximal Tubular Injury and Acute Kidney Injury
    description: >-
      The same redox chemistry operates in the proximal tubule, where paraquat
      also distributes highly.
  - target: Hepatocellular Injury
    description: >-
      And in hepatocytes, damaging smooth endoplasmic reticulum and mitochondria.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Further downstream at the toxicodynamic level, the main molecular mechanism of PQ toxicity is based on redox cycling and intracellular oxidative stress generation."
    explanation: Identifies redox cycling as the principal molecular mechanism.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Paraquat exerts its toxic and lethal effects by forming cation radicals post-metabolism, subsequently generating free oxygen radicals, leading to mitochondrial damage and apoptosis."
    explanation: >-
      States the cation radical intermediate and the downstream radical
      generation, mitochondrial damage and apoptosis.
  - reference: PMID:18039652
    reference_title: "Complex I is the major site of mitochondrial superoxide production by paraquat."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experiments with disrupted mitochondria showed that once in the matrix paraquat was principally reduced by complex I (mammals) or by NADPH dehydrogenases (yeast) to form the paraquat radical cation that then reacted with oxygen to form superoxide."
    explanation: >-
      Localises the one-electron reduction to mitochondrial complex I in mammals
      and states the radical-then-superoxide sequence this node asserts.
  - reference: PMID:18039652
    reference_title: "Complex I is the major site of mitochondrial superoxide production by paraquat."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This paraquat-induced superoxide production in the mitochondrial matrix required a membrane potential that was essential for paraquat uptake into mitochondria."
    explanation: >-
      Establishes a second, membrane-potential-dependent transport step that
      concentrates paraquat inside mitochondria before reduction, so the
      selectivity story has two tiers - cellular, then subcellular.
- name: Alveolar Epithelial Injury and Cell Death
  biological_scale: CELLULAR
  description: >-
    Oxidative injury to the alveolar epithelium, expressed as alveolitis and
    diffuse alveolar damage with mitochondrial injury and apoptosis. This is the
    destructive phase that precedes and licenses the fibrotic one.
  cell_types:
  - preferred_term: pulmonary alveolar epithelial cell
    term:
      id: CL:0000322
      label: pulmonary alveolar epithelial cell
  biological_processes:
  - preferred_term: oxidative-stress-driven apoptosis of alveolar epithelium
    modifier: INCREASED
    term:
      id: GO:0008631
      label: intrinsic apoptotic signaling pathway in response to oxidative stress
  downstream:
  - target: Progressive Pulmonary Fibrosis
    description: >-
      Alveolar damage is followed by a fibroproliferative repair response.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lungs are affected the most as the chemical is sequestrated here due to the concentration gradient, and alveolitis, alveolar damage, and fibrosis set in."
    explanation: >-
      States the alveolitis and alveolar damage of this node and its progression
      to fibrosis.
- name: Progressive Pulmonary Fibrosis
  biological_scale: TISSUE
  description: >-
    The delayed fibroproliferative phase, and the characteristic cause of death
    in patients who survive the acute multiorgan insult. Fibrosis obliterates the
    gas-exchange surface over two to three weeks, producing progressive
    respiratory failure. Its delayed onset is what makes paraquat poisoning
    unusual among acute toxidromes: a patient can appear to stabilise and still
    die of the exposure a fortnight later.
  biological_processes:
  - preferred_term: fibrotic extracellular matrix deposition in the alveolar wall
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: collagen fibril deposition
    modifier: INCREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Multiorgan Failure and Death
    description: >-
      Loss of gas-exchange surface produces terminal respiratory failure.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, severe poisoning can lead to acute kidney failure, acute lung injury, and lung fibrosis resulting in death over 2-3 weeks."
    explanation: >-
      Establishes lung fibrosis as the delayed cause of death and gives the
      two-to-three-week interval.
- name: Proximal Tubular Injury and Acute Kidney Injury
  biological_scale: TISSUE
  description: >-
    Necrosis of the proximal convoluted tubule, where paraquat distribution is
    high. Renal failure matters twice over: as organ injury in its own right, and
    because renal clearance is the route by which most of an absorbed dose leaves
    the body, so tubular injury impairs elimination of the toxicant causing it.
  downstream:
  - target: Multiorgan Failure and Death
    description: Renal failure contributes to the multiorgan course.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kidney failure occurs due to necrosis in the proximal convoluted tubule whereas acute liver injury occurs due to damage to the smooth endoplasmic reticulum and mitochondria, the distribution being high in these two organs."
    explanation: >-
      States the proximal tubular necrosis mechanism and the high renal and
      hepatic distribution.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Though 90% of the compound is excreted in the urine unchanged within 12-24 hours post-exposure, it is the absorbed chemical that manifests the complications, and treatment interventions are aimed at it."
    explanation: >-
      PARTIAL - establishes that urinary excretion is the dominant elimination
      route, which is the premise for the claim that tubular injury impairs
      clearance; the source does not itself state that renal injury slows
      elimination.
- name: Hepatocellular Injury
  biological_scale: TISSUE
  description: >-
    Acute liver injury from damage to the smooth endoplasmic reticulum and
    mitochondria of hepatocytes, in which paraquat also distributes highly.
  downstream:
  - target: Multiorgan Failure and Death
    description: Hepatic failure contributes to the multiorgan course.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Kidney failure occurs due to necrosis in the proximal convoluted tubule whereas acute liver injury occurs due to damage to the smooth endoplasmic reticulum and mitochondria, the distribution being high in these two organs."
    explanation: >-
      States the subcellular targets of hepatic injury and the high hepatic
      distribution.
- name: Multiorgan Failure and Death
  biological_scale: ORGANISM
  description: >-
    The convergent outcome. Reported case fatality reaches 90%, and can follow
    even low doses. There is no antidote with specific effects, so the case
    fatality reflects the toxicology rather than any failure of supportive care.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the absence of an antidote, and with a fatality rate as high as 90%, which can occur even with low doses, it continues to be a potential hazard and challenge for clinicians."
    explanation: Establishes the case fatality and the absence of an antidote.
phenotypes:
- category: Oral
  name: Paraquat-Associated Stomatitis
  description: >-
    Oral mucosal ulceration ("paraquat tongue"), the most consistent early
    physical sign. It begins focally, usually on the tongue, and becomes
    multifocal and diffuse with delay to presentation.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Paraquat-associated stomatitis
    term:
      id: HP:0010280
      label: Stomatitis
    temporality: ACUTE
  evidence:
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of 170 cases revealed PAS in 78.8% of patients."
    explanation: >-
      Supports the FREQUENT band directly: 78.8% falls inside the 30-79% range,
      close to its upper edge. From a pooled individual-patient analysis of 170
      published cases, so the denominator is a case literature rather than a
      population - the band is an estimate, not an incidence.
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anatomically, early presentations (<=6 h) were characterized by focal involvement, predominantly on the tongue (35.8%)."
    explanation: Supports the early focal, predominantly lingual distribution.
- category: Oral
  name: Severe Mucositis
  description: >-
    WHO Grade 3-4 mucositis, whose prevalence rises steeply with delay from
    exposure to presentation - a time dependence that makes the finding useful
    for forensic timing as well as prognosis.
  phenotype_term:
    preferred_term: Severe oral mucosal ulceration
    term:
      id: HP:0000155
      label: Oral ulcer
    severity: SEVERE
    temporality: ACUTE
  evidence:
  - reference: PMID:42048945
    reference_title: "The natural history of paraquat-associated stomatitis: A four-stage model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe mucositis (WHO Grade 3-4) increased from 13.9% in patients presenting within 6 h to 58.3% in those presenting at 1-3 days (p = 0.027)."
    explanation: >-
      Quantifies the time dependence. No frequency band is asserted for this
      phenotype precisely because the figure depends on presentation delay rather
      than being a fixed property of the poisoning.
- category: Respiratory
  name: Pulmonary Fibrosis
  description: >-
    Progressive interstitial fibrosis developing over two to three weeks, the
    characteristic delayed cause of death.
  phenotype_term:
    preferred_term: Progressive pulmonary fibrosis
    term:
      id: HP:0002206
      label: Pulmonary fibrosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In contrast, severe poisoning can lead to acute kidney failure, acute lung injury, and lung fibrosis resulting in death over 2-3 weeks."
    explanation: Names lung fibrosis and its two-to-three-week fatal course.
- category: Respiratory
  name: Respiratory Failure
  description: >-
    Terminal respiratory failure from loss of gas-exchange surface, the usual

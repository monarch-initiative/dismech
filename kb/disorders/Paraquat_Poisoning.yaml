environmental:
- name: Ingestion of concentrated paraquat herbicide
  exposure_term:
    preferred_term: ingestion of concentrated paraquat herbicide formulation
    term:
      id: ECTO:9000395
      label: exposure to paraquat
  description: >-
    The dominant exposure route in fatal cases. Paraquat is cheap, widely
    available in agricultural communities, and highly toxic, which is the
    combination that makes it a leading agent of fatal pesticide self-poisoning.
    Cutaneous and mucosal contact are also reported routes.
  notes: >-
    `ECTO:9000395` is route-agnostic and is chosen over the route-specific
    siblings `ECTO:0090011` (in air), `ECTO:0090012` (in soil) and
    `ECTO:0090013` (in water), none of which describes ingestion. A full label
    scan of ECTO for `paraquat` returned exactly these four plus
    `ECTO:9001210` exposure to paraquat dichloride; there is no ingestion-route
    paraquat term.
  evidence:
  - reference: PMID:18161502
    reference_title: "Paraquat poisonings: mechanisms of lung toxicity, clinical features, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, over the last decades, there have been numerous fatalities, mainly caused by accidental or voluntary ingestion."
    explanation: Establishes ingestion as the route producing fatalities.
  - reference: PMID:18154668
    reference_title: "The global distribution of fatal pesticide self-poisoning: systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it is the pattern of pesticide use and the toxicity of the products, not the quantity used, that influences the likelihood they will be used in acts of fatal self-harm."
    explanation: >-
      PARTIAL - this systematic review is about pesticide self-poisoning as a
      class rather than paraquat specifically, but it establishes product
      toxicity and availability, not volume sold, as what drives fatal use, which
      is the rationale for paraquat's prominence and for the bans described here.
  influences_mechanisms:
  - target: Ingestion of Concentrated Paraquat
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingesting a concentrated formulation is the route by which a lethal
      systemic dose is delivered.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Self-ingestion or cutaneous/mucosal contact can rapidly lead to multiorgan failure involving the respiratory, liver, and renal systems."
      explanation: >-
        Links the exposure routes directly to the multiorgan failure this entry
        curates.
- name: Occult inhalational exposure by nebulisation
  exposure_term:
    preferred_term: inhalation of nebulised paraquat solution
    term:
      id: ECTO:9000395
      label: exposure to paraquat
  description: >-
    A rare and diagnostically treacherous route: paraquat solution delivered by a
    personal nebulisation device. It is curated because it breaks the assumptions
    the usual diagnostic pathway rests on - there is no caustic oral injury to
    see, the exposure history is denied or absent, and an initial urine paraquat
    test can be negative. The diagnosis in the cited case was made only by
    analysing residue from the device itself.
  notes: >-
    Bound to the same route-agnostic `ECTO:9000395` as the ingestion entry, since
    ECTO has no inhalational paraquat term either; `ECTO:0090011` exposure to
    paraquat in air denotes ambient air, not deliberate nebulisation, and would
    misdescribe this route.
  evidence:
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the residual solution from his nebulization device confirmed the presence of methyl viologen, the active component of paraquat, establishing the diagnosis of inhaled paraquat poisoning via nebulization."
    explanation: >-
      Documents the nebulised inhalational route and how the diagnosis was
      finally established.
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although an initial urine paraquat test yielded a negative result, a subsequent targeted investigation of the patient's personal items revealed a video documenting inhalation of an unknown substance."
    explanation: >-
      Supports the specific diagnostic trap recorded here - a negative initial
      urine screen in a genuinely poisoned patient.
  influences_mechanisms:
  - target: Alveolar Epithelial Injury and Cell Death
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Aerosol deposition reaches the terminal bronchioles and alveolar lumen
      directly and destroys alveolar epithelium at the site of deposition,
      without the systemic distribution step that ingestion requires. Note this
      is a shortcut in DELIVERY, not a bypass of transport: the same source says
      absorption then proceeds through epithelial active transport mechanisms,
      so the uptake machinery is still involved and the link is not curated as
      circumventing it.
    evidence:
    - reference: PMID:42266604
      reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "During aerosolized inhalation, the aerodynamic deposition of toxic fine particles allows them to reach the terminal bronchioles and alveolar lumen directly."
      explanation: States the direct aerodynamic deposition at the alveolar lumen.
    - reference: PMID:42266604
      reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This localized deposition causes immediate alveolar epithelial cell destruction and massive pulmonary accumulation while bypassing hepatic first pass metabolism."
      explanation: >-
        States immediate alveolar epithelial destruction, which is what justifies
        targeting the injury node rather than the systemic-accumulation node.
diagnosis:
- name: Severity Index of Paraquat Poisoning (SIPP)
  description: >-
    Plasma paraquat concentration multiplied by hours since ingestion. It is the
    most-used prognostic index in this poisoning, and its two inputs are exactly
    the two variables this entry's mechanism section says govern outcome - dose
    and time - which is why it earns a place here rather than being left to a
    guideline. It predicts acute kidney injury independently of other admission
    variables.
  evidence:
  - reference: PMID:28881652
    reference_title: "Predictors of acute kidney injury in patients with paraquat intoxication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate logistic regression indicated that acute hepatitis (P < 0.001), a longer time to hospital arrival (P < 0.001), higher SIPP score (P = 0.026) and higher PaO2 at admission (P = 0.014) were predictors of AKI."
    explanation: >-
      Establishes SIPP as an independent predictor of acute kidney injury in 222
      patients, alongside time to arrival - both dose-and-time proxies.
  - reference: PMID:33050540
    reference_title: "Hemoperfusion in Acute Paraquat Poisoning: A Retrospective Multi-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used the Severity Index of Paraquat Poisoning (SIPP) to stratify the severity of PQ-poisoned patients."
    explanation: >-
      Independent confirmation that SIPP is the working severity stratifier in
      clinical studies of this poisoning.
- name: Semiquantitative urine paraquat (dithionite) test
  description: >-
    A bedside colorimetric screen used to confirm exposure and to gate treatment
    decisions. Its limitation is curated deliberately: it can be negative early
    in a genuinely poisoned patient, which is one of the traps recorded on the
    occult inhalational exposure route in this entry.
  evidence:
  - reference: PMID:33050540
    reference_title: "Hemoperfusion in Acute Paraquat Poisoning: A Retrospective Multi-Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The indication to start HP was a positive result for the semiquantitative urine PQ test and presentation to the hospital was within 24 h."
    explanation: >-
      Documents the urine test being used as the operational gate for starting
      extracorporeal treatment.
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although an initial urine paraquat test yielded a negative result, a subsequent targeted investigation of the patient's personal items revealed a video documenting inhalation of an unknown substance."
    explanation: >-
      PARTIAL and included as the counterweight: a false-negative urine screen in
      a patient who was in fact poisoned.
- name: Admission mortality-prediction nomogram
  description: >-
    A multivariable model built on 724 patients, using variables available within
    24 hours of admission. Notable for what it selects: alongside plasma paraquat
    concentration it picks creatinine and alanine aminotransferase - the renal
    and hepatic arms this entry curates - and conscious level, so the model is
    effectively scoring the multiorgan chain rather than the toxin alone.
  notes: >-
    Curated as a prognostic tool, not a validated one. The authors state it needs
    further external validation, and that qualification is preserved here rather
    than dropped.
  evidence:
  - reference: DOI:10.1038/s41598-023-50722-z
    reference_title: "Development and validation of a nomogram for predicting in-hospital mortality of patients with acute paraquat poisoning."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the training cohort, decreased level of consciousness (Glasgow Coma Scale score < 15), neutrophil-to-lymphocyte ratio, alanine aminotransferase, creatinine, carbon dioxide combining power, and paraquat plasma concentrations at admission were identified as independent predictors of in-hospital mortality in patients with acute paraquat poisoning."
    explanation: >-
      PARTIAL - names the selected predictors, but the same paper states the
      model requires further external validation before clinical use, so this
      supports the variables rather than the tool's readiness.

treatments:
- name: Supportive Care Without an Antidote
  description: >-
    The baseline, and an honest statement of the position: there is no antidote
    with specific effects for acute paraquat poisoning. Everything else in this
    section is an attempt to reduce absorbed dose or blunt oxidative injury, and
    none of it is guideline-backed.
  notes: >-
    No `therapeutic_modality` is set. CLAUDE.md scopes `BEHAVIORAL` to
    behavioural, physical, dietary or lifestyle intervention and places
    `NCIT:C15747` Supportive Care outside the mechanical-inference table, because
    it is not a platform-classifiable action; ICU organ support is neither a
    lifestyle intervention nor a single modality.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There is currently no antidote with specific effects, for acute paraquat poisoning."
    explanation: States the absence of an antidote directly.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These modalities though, are not based on guidelines or recommendations, and the supporting evidence is also weak, as it has been extrapolated from animal studies and case series in resource-limited settings, which lack information on the severity of the disease."
    explanation: >-
      States that the treatment modalities in this section rest on weak,
      extrapolated evidence rather than guidelines.
- name: Extracorporeal Elimination (Haemoperfusion and Renal Replacement Therapy)
  description: >-
    Removal of absorbed paraquat by haemoperfusion, alone or combined with
    continuous renal replacement therapy. Timing dominates: benefit is reported
    when performed within four to six hours of ingestion and largely disappears
    with later presentation, which fits the toxicokinetics - paraquat is taken up
    into lung against a gradient and retained there as plasma levels fall, so
    lowering the plasma level late does not retrieve the lung burden already
    established.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: haemoperfusion and continuous renal replacement therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    Bound to the generic `NCIT:C49236` because NCIT has no haemoperfusion term -
    a direct label scan of the release used here returns zero matches for both
    `hemoperfusion` and `haemoperfusion`. The hemodialysis family exists but is a
    different modality.
  target_mechanisms:
  - target: Polyamine-Transporter-Mediated Pulmonary Accumulation
    treatment_effect: INHIBITS
    description: >-
      Lowering the circulating concentration early limits how much paraquat the
      lung can concentrate. The link is to the uptake node rather than to the
      exposure node because that is the step extracorporeal clearance actually
      competes with, and it is why the therapeutic window is measured in hours.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Majority of the studies emphasized that hemoperfusion should be performed within 4 hours of ingestion of paraquat, for best results."
      explanation: >-
        PARTIAL - establishes the narrow timing window, which is the observable
        consequence of competing with pulmonary uptake, but does not itself
        demonstrate the mechanistic link asserted here.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "They emphasized the use of hemoperfusion within 6 hours for improved outcome."
    explanation: >-
      Reports better outcome with early haemoperfusion in a 101-patient series.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A systematic review and meta-analysis in Iran in 2022, studied 44 patients where all required mechanical ventilation, and despite hemodialysis, there was no reduction in mortality."
    explanation: >-
      PARTIAL, and deliberately included as a counterweight - a pooled analysis
      showing no mortality reduction, attributed to delayed presentation. The
      evidence for extracorporeal elimination is not uniformly positive.
  - reference: PMID:33050540
    reference_title: "Hemoperfusion in Acute Paraquat Poisoning: A Retrospective Multi-Center Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Among acute PQ-poisoned patients, this study found that HP was not associated with increased 60-day survival. Furthermore, neither early HP nor multiple secessions of HP were associated with survival."
    explanation: >-
      REFUTE, and it refutes the specific claim this treatment is built on. A
      multi-centre study of 213 SIPP-stratified patients found no survival
      benefit from haemoperfusion, AND no benefit from EARLY haemoperfusion -
      which contradicts the four-to-six-hour window quoted above from the
      editorial. Read directly rather than second-hand. The treatment is retained
      because it remains in use, not because the evidence supports it.
- name: Immunosuppressive Therapy
  description: >-
    Glucocorticoids (methylprednisolone, dexamethasone) and cyclophosphamide,
    directed at the inflammatory and fibroproliferative arm rather than at redox
    cycling - which is why this link targets the alveolar-injury and fibrosis
    nodes, the same nodes the KNOWLEDGE_GAP on its efficacy attaches to. The
    evidence is genuinely contested rather than merely thin, and this entry does
    not record it as effective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: NCIT:C647
        label: Methylprednisolone
    - preferred_term: cyclophosphamide
      term:
        id: NCIT:C405
        label: Cyclophosphamide
  target_mechanisms:
  - target: Alveolar Epithelial Injury and Cell Death
    treatment_effect: MODULATES
    description: >-
      Aimed at suppressing the inflammatory amplification of alveolar injury.
      MODULATES because the direction and size of the effect are exactly what is
      disputed.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Measures for treatment include reducing poison absorption and eliminating absorbed poison, use of antioxidants, anti-inflammatory agents, and immunosuppressants, hemodialysis, and hemoperfusion, along with other supportive care."
      explanation: >-
        PARTIAL - establishes that immunosuppressants are used in this role,
        without evidencing that they work.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "However, another three randomized controlled trials compared dexamethasone, methylprednisolone, and cyclophosphamide with standard treatment, and all three showed mortality benefit in the treatment arm compared to the standard treatment."
    explanation: >-
      PARTIAL - randomised evidence of mortality benefit, reported second-hand in
      an editorial rather than read here in the primary trials. Retained
      alongside the primary registry evidence below rather than replaced, since
      it is the entry's record of what the trial literature claims.
  - reference: PMID:24475310
    reference_title: "Beneficial effects of additional immunosuppressive treatment in paraquat poisoning patients receiving hemoperfusion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IST significantly increases survival rate (from 24.3% to 29.3%, P<0.001). The combined IST with methylprednisolone, cyclophosphamide and dexamethasone associates with the highest survival rate (48%, P<0.001)."
    explanation: >-
      Primary evidence, read directly rather than through the editorial: a
      nationwide retrospective cohort of 1811 hemoperfused patients. Note the
      absolute effect is modest (24.3% to 29.3%) against an overall survival of
      26.4%, so this supports use without supporting optimism.
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "They suggested that the efficacy of immunosuppression and antioxidants was anecdotal."
    explanation: >-
      REFUTE - a systematic search of human studies concluding the efficacy is
      anecdotal, directly contradicting the trial evidence above. Both are
      recorded so the disagreement is visible in the entry rather than resolved
      by selection.
- name: Antioxidant Therapy
  description: >-
    Vitamin C, vitamin E, N-acetylcysteine and reduced glutathione, directed at
    the oxidative output of redox cycling. Curated separately from
    immunosuppression because the two act on different nodes and their evidence
    is assessed together only by accident of being administered together.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    No `therapeutic_agent` is bound. Ascorbate, tocopherol, N-acetylcysteine and
    glutathione all have CHEBI terms, but the sources here name them only as a
    bundle administered alongside immunosuppression, with no per-agent evidence;
    binding them individually would imply a specificity the evidence does not
    have. Worth revisiting if a per-agent study is curated.
  target_mechanisms:
  - target: Redox Cycling and Catalytic Superoxide Generation
    treatment_effect: MODULATES
    description: >-
      Scavenges the radical output of redox cycling. MODULATES rather than
      INHIBITS deliberately: because paraquat is regenerated each cycle it
      produces radicals catalytically, so a stoichiometric scavenger cannot stop
      the source - only buffer the product.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Measures for treatment include reducing poison absorption and eliminating absorbed poison, use of antioxidants, anti-inflammatory agents, and immunosuppressants, hemodialysis, and hemoperfusion, along with other supportive care."
      explanation: >-
        PARTIAL - establishes that antioxidants are used against this mechanism,
        without evidencing that they work.
  evidence:
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Antioxidants included intravenous reduced glutathione at 2400 mg daily, intravenous vitamin C at 2 g every 12 h, and gastric N-acetylcysteine at 0.6 g every 12 h"
    explanation: >-
      PARTIAL - documents the specific antioxidant regimen given in a case that
      nonetheless ended fatally, so it evidences use rather than benefit.

- name: Reduction of Absorption
  description: >-
    Gastric lavage and adsorbents to limit the absorbed dose. Rational given the
    dose dependence of outcome, but subject to the same narrow time window as
    extracorporeal elimination.
  notes: >-
    The agent is bound to `CHEBI:91090` charcoal rather than `NCIT:C77524`
    Activated Charcoal: the NCIT term is not a member of the schema's
    `ChemicalEntityTerm` dynamic enum and is rejected by term validation. CHEBI
    has no separate activated-charcoal term, so `preferred_term` carries the
    "activated" qualifier that the bound label lacks.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: activated charcoal
      term:
        id: CHEBI:91090
        label: charcoal
  target_mechanisms:
  - target: Ingestion of Concentrated Paraquat
    treatment_effect: INHIBITS
    description: >-
      Limits how much of an ingested dose reaches the systemic circulation.
    evidence:
    - reference: PMID:39239177
      reference_title: "Management of Paraquat Poisoning-The Way Forward."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Measures for treatment include reducing poison absorption and eliminating absorbed poison, use of antioxidants, anti-inflammatory agents, and immunosuppressants, hemodialysis, and hemoperfusion, along with other supportive care."
      explanation: >-
        PARTIAL - names reducing absorption as a treatment aim without
        quantifying its effect.
  evidence:
  - reference: PMID:39239177
    reference_title: "Management of Paraquat Poisoning-The Way Forward."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "It included 109 patients in a tertiary hospital, where all treatment modalities were provided, including gastric lavage, mechanical ventilation, immunosuppression, antioxidants, hemoperfusion, and renal replacement therapy."
    explanation: >-
      PARTIAL - documents gastric lavage as part of the standard bundle in a
      109-patient series whose mortality was nonetheless 88%.
- name: Lung Transplantation
  description: >-
    The only intervention that addresses the lesion that kills survivors. Once
    fibrosis is established it is irreversible, so transplantation is the
    definitive rather than the supportive option, with ECMO as a bridge to a
    donor lung. Reported successfully after paraquat poisoning, including a
    double-lung transplant on ECMO support 34 days after ingestion with a good
    outcome. Its limiting factors in the cited cases were not medical: one
    patient reached transplantation only through publicly raised funds, and in
    another it was abandoned for want of money.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lung transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Progressive Pulmonary Fibrosis
    treatment_effect: BYPASSES
    description: >-
      Replaces the fibrotic organ rather than modifying the fibrotic process -
      the one place in this entry where BYPASSES is the accurate enum, since the
      graft supplies gas exchange by an entirely different route while the
      injured lung is removed.
    evidence:
    - reference: PMID:36626514
      reference_title: "Lung transplantation in a woman with paraquat poisoning that led to pulmonary fibrosis: A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lung transplantation is currently the most effective treatment for pulmonary fibrosis, and mass media campaigns can provide economic support, influence potential organ donation, and provide such patients more chances to survive."
      explanation: >-
        States transplantation as the most effective treatment for the fibrotic
        endpoint this node represents.
  evidence:
  - reference: PMID:36626514
    reference_title: "Lung transplantation in a woman with paraquat poisoning that led to pulmonary fibrosis: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient received financial assistance; thus, she could receive a double-lung transplant with extracorporeal membrane oxygenation (ECMO) support on the 34th day after the poisoning."
    explanation: >-
      Documents a completed double-lung transplant on ECMO support after paraquat
      poisoning, and - notably - that access turned on funding rather than on
      medical eligibility.
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, lung transplantation was abandoned due to financial constraints experienced by the family, resulting in the voluntary discharge of the patient against medical advice."
    explanation: >-
      PARTIAL - a negative instance rather than evidence of efficacy: it
      documents transplantation being considered and forgone, which is why the
      cost barrier is curated in the description rather than left implicit.
  - reference: PMID:41647033
    reference_title: "Case Report: Multifactorial weaning failure after lung transplantation in paraquat-induced pulmonary fibrosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung transplantation (LT) remains a rare but life-saving option for end-stage pulmonary fibrosis secondary to paraquat poisoning."
    explanation: >-
      PARTIAL, and included for what it qualifies rather than what it confirms:
      the same report documents failed extubation from respiratory muscle
      weakness after successful transplantation, so graft function is not the
      whole outcome. It also notes a review of 15 previously reported
      paraquat-related transplant cases, which bounds how much experience exists.
- name: Restrictive Oxygen Strategy
  description: >-
    The counterintuitive one, and the clearest clinical corollary of this entry's
    redox node: supplemental oxygen is the substrate that reoxidises the paraquat
    radical, so high inspired oxygen fuels the cycle that is doing the damage.
    Oxygen is therefore restricted rather than given liberally. It is a genuine
    trade-off rather than a rule - withholding oxygen delays radical generation
    at the cost of tissue hypoxia - and the cited source frames it as a
    ventilator-setting judgement in patients already on ECMO, not as a blanket
    prohibition.
  treatment_term:
    preferred_term: restrictive inspired-oxygen strategy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Redox Cycling and Catalytic Superoxide Generation
    treatment_effect: INHIBITS
    description: >-
      Limiting inspired oxygen limits the substrate for reoxidation of the
      paraquat radical, and so the rate of the cycle itself. This is the only
      intervention curated here that acts on the redox mechanism rather than on
      its consequences.
    evidence:
    - reference: PMID:42266604
      reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although both patients received ECMO support, mechanical ventilation parameter settings need to be carefully weighed: high‐concentration oxygen therapy may exacerbate oxidative stress injury, whereas hypoxic strategies, while delaying ROS generation, may exacerbate tissue hypoxia."
      explanation: >-
        States both halves of the trade-off: high-concentration oxygen worsens
        oxidative injury, and hypoxic strategies delay radical generation but
        worsen tissue hypoxia.
  notes: >-
    Bound to the generic `NCIT:C49236` - NCIT has no restrictive-oxygen or
    permissive-hypoxaemia term, and `NCIT:C171507` Extracorporeal Membrane
    Oxygenation names a different intervention. No `therapeutic_modality` is set
    for the same reason it is omitted on supportive care: a ventilator-setting
    strategy is not a platform.
  evidence:
  - reference: PMID:42266604
    reference_title: "Clinical Profiles and Therapeutic Interventions in Occult Paraquat Poisoning: A Comparative Report of Two Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although both patients received ECMO support, mechanical ventilation parameter settings need to be carefully weighed: high‐concentration oxygen therapy may exacerbate oxidative stress injury, whereas hypoxic strategies, while delaying ROS generation, may exacerbate tissue hypoxia."
    explanation: >-
      The source's own statement of the oxygen trade-off in paraquat poisoning.
discussions:
- discussion_id: gap_paraquat_immunosuppression_efficacy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Alveolar Epithelial Injury and Cell Death"
  - "pathophysiology#Progressive Pulmonary Fibrosis"
  prompt: >-
    Does glucocorticoid plus cyclophosphamide immunosuppression reduce mortality
    in acute paraquat poisoning, and if so in which severity stratum?
  rationale: >-
    The evidence points both ways and this entry records both rather than
    choosing. A systematic search of human studies concluded that the efficacy of
    immunosuppression and antioxidants was anecdotal; three randomised controlled
    trials of dexamethasone, methylprednisolone and cyclophosphamide each reported
    a mortality benefit over standard treatment. That is a real contradiction, not
    a gradient of confidence, and there are two candidate explanations that lead
    to opposite clinical conclusions. Either the trials are right and the earlier
    reviews were diluted by heterogeneous, late-presenting cohorts; or the trials
    are small and conducted where severity assessment is limited, so apparent
    benefit reflects imbalance in ingested dose - the single strongest determinant
    of outcome - rather than treatment. The distinction matters because the
    intervention is not free: cyclophosphamide in a patient with acute kidney
    injury and impaired elimination carries real harm, and paraquat's case
    fatality is high enough that an ineffective therapy is not a neutral default.
    Note this entry's evidence for both positions is second-hand, drawn from an
    editorial summarising the primary literature rather than from the trials
    themselves; closing this gap starts with reading them.
  proposed_experiments:
  - experiment_id: exp_paraquat_immunosuppression_dose_stratified
    name: Dose-stratified randomised trial of immunosuppression in acute paraquat poisoning
    description: >-
      Multicentre randomised trial of glucocorticoid plus cyclophosphamide versus
      supportive care, with randomisation stratified on an objective measure of
      ingested dose (plasma paraquat concentration on a validated
      time-versus-concentration nomogram, or urine dithionite grade where plasma
      assay is unavailable), and with time from ingestion to presentation recorded
      as a prespecified covariate rather than an exclusion.
    decision_criterion: >-
      Whether a mortality difference survives adjustment for measured ingested
      dose and presentation delay, and whether any benefit is confined to a
      definable severity stratum rather than being uniform.
    supporting_outcome:
    - A mortality benefit that persists after adjustment for plasma paraquat concentration and presentation delay.
    - A benefit concentrated in an intermediate-dose stratum, which would explain why unstratified cohorts disagree.
    refuting_outcome:
    - A benefit that disappears once ingested dose is adjusted for, indicating confounding by severity.
    - Excess harm in the immunosuppressed arm among patients with acute kidney injury.
- discussion_id: gap_paraquat_therapeutic_window_vs_lung_retention
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Polyamine-Transporter-Mediated Pulmonary Accumulation"
  prompt: >-
    Can any intervention reduce the pulmonary paraquat burden once uptake has
    occurred, or is the therapeutic window closed as soon as the lung has
    concentrated the dose?
  rationale: >-
    Two curated facts, taken together, predict the clinical observation and
    suggest the field is optimising the wrong variable. Paraquat is concentrated
    six- to ten-fold above plasma in lung and retained there as blood levels
    fall; and haemoperfusion helps within four to six hours and largely stops
    helping later. Extracorporeal elimination clears the compartment paraquat is
    leaving, not the one it has entered - which would explain why removing more
    drug, later, does not translate into survival. If that reading is right, the
    tractable target is not clearance but the polyamine transporter itself:
    competitive inhibition of uptake, plausible in principle since the transporter
    is a known and characterised system, would have to be given inside the same
    few hours to matter. What is missing is a direct measurement: no evidence
    consulted here reports lung paraquat burden as a function of time and of
    extracorporeal treatment in humans, so the causal claim that late clearance
    fails *because* of lung retention remains an inference from two separate
    observations.
  proposed_experiments:
  - experiment_id: exp_paraquat_lung_burden_kinetics
    name: Serial lung-versus-plasma paraquat kinetics under extracorporeal treatment
    description: >-
      Paired plasma and lung paraquat measurement over time in a large-animal
      model of ingestion, with and without haemoperfusion started at staggered
      intervals after dosing; complemented in humans by post-mortem lung paraquat
      concentration in treated and untreated fatalities with recorded ingestion
      and treatment times.
    decision_criterion: >-
      Whether extracorporeal clearance started after the early window lowers the
      lung concentration at all, or lowers plasma only while lung burden is
      unchanged.
    supporting_outcome:
    - Lung concentration unchanged by late haemoperfusion despite a fall in plasma.
    - A lung-to-plasma ratio that rises over time irrespective of treatment.
    refuting_outcome:
    - Lung burden falling proportionally with plasma under late clearance, which would relocate the reason for treatment failure elsewhere.
- discussion_id: gap_paraquat_cardiac_effects_uncharacterised
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Cardiac Involvement"
  prompt: >-
    What are the haemodynamic and electrophysiological effects of acute paraquat
    poisoning in humans, and does cardiac depression contribute materially to
    death in fulminant high-dose ingestion?
  rationale: >-
    This gap is recorded because a plausible claim was available and declined.
    The deep-research report generated for this entry states that cardiogenic or
    circulatory collapse is the dominant fatal mechanism in fulminant poisoning.
    It is mechanistically plausible - rodents show dose-dependent falls in heart
    rate, blood pressure and contractility, and the >40 mg/kg course kills in two
    to three days, faster than fibrosis can develop, so something other than the
    lung must be killing those patients. But no source located for this entry
    supports it, and the one human source that addresses the question states that
    little to no evidence exists on the haemodynamic and cardiac
    electromechanical effects of acute paraquat poisoning. So the mechanism of
    death in the fulminant form is, on this entry's evidence, unaccounted for -
    which is a more useful thing to record than a borrowed assertion. Resolving it
    would also settle whether the bradycardia reported as unusual is genuinely
    rare or merely rarely looked for.
  proposed_experiments:
  - experiment_id: exp_paraquat_cardiac_phenotyping_prospective
    name: Prospective cardiac phenotyping in acute paraquat poisoning
    description: >-
      Serial ECG, echocardiography and high-sensitivity troponin in consecutive
      patients admitted with acute paraquat poisoning, stratified by SIPP, with
      cause of death adjudicated against the cardiac, respiratory and renal arms
      rather than recorded as multiorgan failure.
    decision_criterion: >-
      Whether patients in the fulminant high-dose stratum show cardiac depression
      or arrhythmia preceding death, and whether adjudicated cause of death in
      that stratum is cardiac rather than respiratory.
    supporting_outcome:
    - Falling contractility or conduction abnormality preceding death in the high-SIPP stratum.
    - Troponin release out of proportion to resuscitation received.
    refuting_outcome:
    - Preserved cardiac function up to death, locating the fulminant fatal mechanism elsewhere.
    - Bradycardia occurring at the same low rate across severity strata, making it incidental.
- discussion_id: controversy_paraquat_parkinson_association
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - "pathophysiology#Redox Cycling and Catalytic Superoxide Generation"
  prompt: >-
    Is the epidemiological association between chronic low-dose paraquat exposure
    and Parkinson disease causal, and does it share a mechanism with the acute
    poisoning curated here?
  rationale: >-
    This entry curates acute high-dose poisoning; the paraquat-Parkinson question
    concerns chronic low-dose exposure and is a different exposure regime with a
    different target organ. They are linked here rather than merged because they
    share the redox-cycling node: paraquat is structurally similar to MPP+, is
    taken up by cation transporters, and is used experimentally to model
    nigrostriatal degeneration - and this knowledge base already treats paraquat
    as an environmental complex I toxin in `Parkinsons_Disease` and in the
    `parkinsonism_dopaminergic_degeneration` module. The association is
    meta-analytically supported but is not curated as established causation here,
    because the acute-poisoning literature cannot speak to it and this entry has
    not assessed the chronic-exposure evidence. Recorded so the relationship
    between these entries is explicit rather than implied by a shared substance
    name.
  evidence:
  - reference: PMID:30474499
    reference_title: "Paraquat exposure and Parkinson's disease: A systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a statistically significant association between paraquat exposure and PD."
    explanation: >-
      PARTIAL - the meta-analysis (13 case-control studies, OR 1.64, 95% CI
      1.27-2.13) establishes a statistically significant association, which is
      not the same as causation and says nothing about whether it shares a
      mechanism with the acute poisoning curated here. That is precisely the
      open question this discussion records.

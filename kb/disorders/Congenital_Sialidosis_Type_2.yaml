  evidence:
  - reference: PMID:29693572
    reference_title: "Sialidosis: A Review of Morphology and Molecular Biology of a Rare Pediatric Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sialidosis (MIM 256550) is a rare, autosomal recessive inherited disorder, caused by &alpha;-N-acetyl neuraminidase deficiency resulting from a mutation in the neuraminidase gene (NEU1), located on 6p21.33. This genetic alteration leads to abnormal intracellular accumulation as well as urinary excretion of sialyloligosaccharides."
    explanation: NEU1 deficiency causes intracellular accumulation and urinary excretion of sialyloligosaccharides.
  - reference: PMID:32272755
    reference_title: "Mechanism of Secondary Ganglioside and Lipid Accumulation in Lysosomal Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sialidosis is characterized by accumulation of sialic acid-containing compounds (mainly sialyloligosaccharides and sialoglycoproteins) in cells caused by a functional loss of lysosomal NEU1 (sialidase, acid neuraminidase, EC 3.2.1.18). Certain glycolipid levels (GM3, GD3, GM4, and LM1) are elevated in visceral organs, but not in brain."
    explanation: Demonstrates primary storage of sialyloligosaccharides and sialoglycoproteins with secondary glycolipid elevation in visceral organs.
  downstream:
  - target: Renal Tubular Lysosomal Vacuolization
    description: Heavy prenatal lysosomal storage in nephron tubule epithelial cells causes pronounced tubular vacuolization from the neonatal period.
  - target: Perinatal Systemic Fluid Dysregulation
    description: Generalized prenatal systemic and placental substrate storage contributes to fulminant in utero fluid imbalance.
  - target: Visceral Reticuloendothelial Lysosomal Storage
    description: Accumulation of sialylated glycopeptides and oligosaccharides in hepatocytes, Kupffer cells, and splenic macrophages enlarges the liver and spleen.
  - target: Connective Tissue and Chondrocyte Storage Remodeling
    description: Storage of sialylated substrates in soft tissues, fibroblasts, and chondrocytes disrupts skeletal and connective tissue architecture.
  - target: Neuronal and Glial Lysosomal Storage and Neuroinflammation
    description: Sialylated substrate accumulation in central and peripheral neurons, retinal ganglion cells, and glia triggers cellular vacuolization and neuroinflammation.
  - target: Oligosacchariduria
    description: Uncleaved sialyloligosaccharides spill into the circulation and are excreted in high amounts in urine.
- name: LAMP1 Oversialylation
  conforms_to: "lysosomal_substrate_accumulation#Autophagic-Lysosomal Dysfunction and Secondary Cascade"
  description: >-
    NEU1 normally cleaves terminal sialic acid residues on lysosomal-associated membrane protein-1
    (LAMP1) to regulate its turnover. In NEU1 deficiency, impaired sialic acid processing causes
    LAMP1 to accumulate at the lysosomal membrane in an oversialylated state with a prolonged
    half-life.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NEU1 differs from the other mammalian sialidases in that it is active exclusively in a high molecular weight, multienzyme complex containing at least two other hydrolases: the glycosidase β-galactosidase (β-GAL) and the PPCA."
    explanation: Establishes that NEU1 requires assembly into a lysosomal multienzyme complex with beta-galactosidase and PPCA for catalytic activity.
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "On the basis of their biochemical properties, NEU1 protein variants can be divided into three groups: in the first group, the mutant enzyme is catalytically inactive and does not localize to the lysosomes; in the second group, the mutant enzyme localizes to the lysosomes but is enzymatically inactive; in the third group, the mutant enzyme has residual activity and localizes to the lysosomes."
    explanation: Defines the three biochemical classes of NEU1 variants, where catalytically inactive Class I and Class II variants drive severe type II disease.
  - reference: PMID:38600684
    reference_title: "Clinical and Structural Characteristics of NEU1 Variants Causing Sialidosis Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sialidosis type 2 has variants that are both catalytically inactive (severe), while sialidosis type 1 has at least one catalytically active (mild) variant."
    explanation: Confirms that sialidosis type 2 results from biallelic catalytically inactive (severe) NEU1 variants.
  - reference: PMID:31956508
    reference_title: "Sialidosis type II: Expansion of phenotypic spectrum and identification of a common mutation in seven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The misfolded mutant protein is retained in the pre-lysosomal compartment with impaired lysosomal targeting and resulting lack of enzyme activity"
    explanation: Demonstrates pre-lysosomal retention and impaired lysosomal targeting of severe misfolded NEU1 mutant protein in sialidosis type II.

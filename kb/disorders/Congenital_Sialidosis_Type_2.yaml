    sialyloligosaccharides, causing their massive intralysosomal accumulation across visceral,
    mesenchymal, epithelial, and neural cell types starting in utero, accompanied by secondary
    visceral glycosphingolipid elevation and urinary excretion of sialyloligosaccharides.

genetic:
- name: NEU1
  association: >-
    Biallelic severe loss-of-function variants in NEU1 (chromosome 6p21.33) that abolish catalytic
    activity and/or lysosomal localization of neuraminidase-1 (Class I and Class II variants, such
    as c.679G>A p.Gly227Arg).
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NEU1
    term:
      id: hgnc:7758
      label: NEU1
  features: >-
    Genotype-phenotype correlation depends on residual NEU1 activity and lysosomal localization:
    congenital and severe type II sialidosis result from two catalytically inactive alleles (Class I
    variants retained in pre-lysosomal compartments or Class II variants that reach lysosomes but
    lack enzymatic activity), whereas type I sialidosis retains at least one mild, catalytically
    active Class III variant.
  evidence:
  - reference: PMID:29693572
    reference_title: "Sialidosis: A Review of Morphology and Molecular Biology of a Rare Pediatric Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "An association exists between the impact of the individual mutations and the\nseverity of clinical presentation of sialidosis."
    explanation: Severe NEU1 alleles correlate with the severe congenital presentation of sialidosis.
  - reference: PMID:38600684
    reference_title: "Clinical and Structural Characteristics of NEU1 Variants Causing Sialidosis Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sialidosis type 2 has variants that are both catalytically inactive (severe), while sialidosis type 1 has at least one catalytically active (mild) variant."
    explanation: Confirms that sialidosis type 2 requires biallelic catalytically inactive (severe) NEU1 variants.
  - reference: PMID:31956508
    reference_title: "Sialidosis type II: Expansion of phenotypic spectrum and identification of a common mutation in seven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation, c.679G > A; p.Gly227Arg, reported in our patients, lies within the important β N (second strand of the third sheet) repeat region of the sialidase molecule. This mutation is predicted to produce a severe phenotype. The misfolded mutant protein is retained in the pre-lysosomal compartment with impaired lysosomal targeting and resulting lack of enzyme activity"
    explanation: Characterizes a recurrent severe NEU1 missense variant (c.679G>A; p.Gly227Arg) that causes pre-lysosomal retention and complete loss of enzyme activity in type II sialidosis.

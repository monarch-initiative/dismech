differential_diagnoses:
- name: Galactosialidosis
  description: >-
    Autosomal recessive lysosomal storage disease caused by primary deficiency of protective
    protein/cathepsin A (PPCA/CTSA), leading to combined secondary deficiency of both NEU1 and
    beta-galactosidase; congenital galactosialidosis presents identically with hydrops fetalis,
    neonatal ascites, hepatosplenomegaly, and dysostosis multiplex.
  disease_term:
    preferred_term: galactosialidosis
    term:
      id: MONDO:0009737
      label: galactosialidosis
  distinguishing_features:
  - Combined deficiency of both neuraminidase-1 (NEU1) and beta-galactosidase (GLB1) due to biallelic CTSA variants, whereas isolated sialidosis has isolated NEU1 deficiency with normal beta-galactosidase and CTSA.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Severely reduced or deficient NEU1 activity secondary to a primary defect of the lysosomal serine carboxypeptidase, protective protein cathepsin A (PPCA) is characteristic of galactosialidosis (GS)"
    explanation: Distinguishes galactosialidosis as a primary defect in PPCA (CTSA) causing secondary NEU1 deficiency.
- name: Sialidosis type 1
  description: >-
    The mild, normomorphic, late-onset allelic form of NEU1 deficiency (cherry-red spot myoclonus
    syndrome), presenting in the second or third decade without hydrops, visceromegaly, or skeletal
    dysplasia.
  disease_term:
    preferred_term: sialidosis type 1
    term:
      id: MONDO:0019346
      label: sialidosis type 1
  distinguishing_features:
  - Presence of at least one catalytically active (Class III) NEU1 allele with juvenile/adult onset of myoclonus and macular cherry-red spots, and absence of hydrops fetalis, hepatosplenomegaly, coarse facies, or dysostosis multiplex.
  evidence:
  - reference: PMID:38600684
    reference_title: "Clinical and Structural Characteristics of NEU1 Variants Causing Sialidosis Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sialidosis type 2 has variants that are both catalytically inactive (severe), while sialidosis type 1 has at least one catalytically active (mild) variant."
    explanation: Distinguishes sialidosis type 1 by the presence of at least one catalytically active NEU1 variant and milder clinical course.
- name: Juvenile sialidosis type 2
  description: >-
    The juvenile-onset subtype of dysmorphic sialidosis type II presenting after 2 years of age with
    coarse facies, dysostosis multiplex, macular cherry-red spots, and progressive myoclonus, but
    without congenital hydrops fetalis or perinatal lethality.
  disease_term:
    preferred_term: juvenile sialidosis type 2
    term:
      id: MONDO:0019681
      label: juvenile sialidosis type 2
  distinguishing_features:
  - Onset after 2 years of age (or 0-12 months in the infantile subtype) without in utero hydrops fetalis or neonatal ascites, often associated with low-level residual NEU1 activity.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Type II sialidosis is the severe, neuropathic form of the disease which is further classified in three subtypes: congenital or hydropic with onset in utero, infantile with onset between birth and 12 months, and juvenile with onset past 2 years of age."
    explanation: Distinguishes the congenital/hydropic subtype from the infantile and juvenile subtypes of sialidosis type II by age of onset and perinatal hydrops.
treatments:
- name: Supportive and Palliative Care
  description: >-
    No curative or disease-modifying therapy is currently approved for congenital sialidosis type 2;
    because the congenital hydropic form presents in utero with severe systemic and neurological
    involvement, clinical management is supportive and palliative, including perinatal fluid and
    respiratory management, nutritional support, and anticonvulsant therapy for surviving infants.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Sialidosis is considered an orphan disorder for which no therapy is currently available."
    explanation: Confirms that no approved disease-specific therapy is currently available for sialidosis.
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast, type II patients who present with an early onset, systemic condition and severe neurological involvement will be a difficult group to treat, unless an in utero approach will become feasible in the future."
    explanation: Highlights that early-onset congenital/type II sialidosis with severe prenatal systemic and neurological involvement remains refractory to postnatal curative intervention.
- name: Investigational AAV-Mediated NEU1/PPCA Gene Therapy
  description: >-
    Preclinical adeno-associated virus (AAV) gene therapy co-expressing human NEU1 and protective
    protein/cathepsin A (PPCA) via neonatal intracerebroventricular or intravenous delivery reduces
    central nervous system LAMP1 accumulation and astrogliosis and improves motor function in
    Neu1-/- mice, representing an investigational strategy that would require prenatal or earliest
    perinatal intervention for the congenital form.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Severe Neuraminidase-1 Deficiency
  - target: LAMP1 Oversialylation
  - target: Excessive Lysosomal Exocytosis
  - target: Neuronal and Glial Lysosomal Storage and Neuroinflammation
  evidence:
  - reference: PMID:38321198
    reference_title: "Gene therapy corrects the neurological deficits of mice with sialidosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Coexpression of NEU1 and protective protein/cathepsin A (PPCA) in neonatal Neu1-/- mice by intracerebroventricular injection, and less effective by facial vein injection, decreased astrogliosis and LAMP1 accumulation in the nervous system and improved rotarod performance of the treated mice."
    explanation: Demonstrates preclinical efficacy of AAV co-expression of NEU1 and PPCA in reversing CNS LAMP1 accumulation, astrogliosis, and motor deficits in Neu1-/- mice.
definitions:
- name: Clinical case definition of congenital sialidosis type 2
  definition_type: CASE_DEFINITION
  description: >-
    Congenital sialidosis type 2 is the most severe, congenital-onset form of NEU1-related
    sialidosis, defined by biallelic severe NEU1 variants with profound neuraminidase deficiency,
    marked sialyloligosaccharide accumulation, and nonimmune hydrops fetalis.
  scope: Disease-level case definition for the congenital severe form of sialidosis type 2.
  evidence:
  - reference: PMID:29693572
    reference_title: "Sialidosis: A Review of Morphology and Molecular Biology of a Rare Pediatric Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "According to the clinical symptoms, sialidosis has been divided into two subtypes with different ages of onset and severity, including sialidosis type I (normomorphic or mild form) and sialidosis type II (dysmorphic or severe form). Sialidosis II is further subdivided into (i) congenital; (ii) infantile; and (iii) juvenile."
    explanation: Anchors the case definition in the congenital subtype of the severe, dysmorphic (type II) form of sialidosis.

prevalence:
- population: Global (all sialidosis forms)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.04
  notes: >-
    Overall sialidosis incidence is reported as 0.04 in 100,000 (citing Orphanet, without a
    specified denominator such as live births); the severe type II and congenital hydropic forms
    are ultra-rare, with fewer than 20 type II patients described across clinical series.
  evidence:
  - reference: PMID:31956508
    reference_title: "Sialidosis type II: Expansion of phenotypic spectrum and identification of a common mutation in seven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Its incidence is reported to be 0.04 in 100,000 (www.orpha.net). Type I is the milder ‘normosomatic’ type or the cherry red spot-myoclonus syndrome. Sialidosis type II is a severe form with earlier onset, referred to as the ‘dysmorphic’ type."
    explanation: Establishes the overall reported incidence of sialidosis at 0.04 in 100,000 (without specifying a live-birth denominator).
progression:
- phase: Onset
  age_range: Antenatal / congenital (in utero to birth)
  notes: >-
    The congenital (hydropic) subtype of sialidosis type II begins in utero, manifesting prenatally
    or at birth with hydrops fetalis, fetal ascites, and visceral organomegaly.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Type II sialidosis is the severe, neuropathic form of the disease which is further classified in three subtypes: congenital or hydropic with onset in utero, infantile with onset between birth and 12 months, and juvenile with onset past 2 years of age."
    explanation: Confirms in utero (antenatal) onset for the congenital or hydropic subtype of sialidosis type II.
- phase: Perinatal and Early Infantile Course
  age_range: Perinatal period to early infancy
  notes: >-
    Patients with the acute congenital form are frequently stillborn or die shortly after birth from
    fulminant systemic hydrops and multiorgan involvement; rare infants surviving beyond the
    neonatal period exhibit severe developmental delay, dysostosis multiplex, macular cherry-red
    spots, and progressive neurological deterioration as seen in longer-surviving infantile and
    juvenile type II cases.
  evidence:
  - reference: PMID:26949572
    reference_title: "Pathogenesis, Emerging therapeutic targets and Treatment in Sialidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Type II patients with the most acute, congenital form of the disease develop hydrops fetalis, neonatal ascites, or both; they are stillborn or die shortly after birth with a systemic and fulminant condition."
    explanation: Documents the fulminant perinatal progression leading to stillbirth or early neonatal death in congenital sialidosis type II.
pathophysiology:
- name: Severe Neuraminidase-1 Deficiency
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic severe NEU1 variants abolish lysosomal neuraminidase-1 (exo-alpha-sialidase) activity.
    Normally, NEU1 functions within a lysosomal multienzyme complex with protective
    protein/cathepsin A (PPCA) and beta-galactosidase to cleave terminal sialic acids from
    glycoproteins and oligosaccharides. In congenital and severe type II sialidosis, mutant NEU1
    proteins are catalytically inactive and either retained in pre-lysosomal compartments with
    defective lysosomal targeting (Class I) or transported to lysosomes without enzymatic activity
    (Class II).

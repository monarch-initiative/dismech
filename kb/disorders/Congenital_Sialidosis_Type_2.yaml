name: Congenital Sialidosis Type 2
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Congenital sialidosis type 2 is the most severe, antenatal-onset subtype of sialidosis type II
  (dysmorphic sialidosis; mucolipidosis I), an autosomal recessive lysosomal storage disorder
  belonging to the glycoproteinosis subgroup and caused by biallelic severe loss-of-function
  variants in NEU1 encoding lysosomal alpha-N-acetyl neuraminidase-1 (sialidase-1). In lysosomes,
  NEU1 is active exclusively within a high-molecular-weight multienzyme complex alongside
  protective protein/cathepsin A (PPCA) and beta-galactosidase. Complete or near-complete loss of
  NEU1 enzymatic activity—typically from catalytically inactive variants that either fail to reach
  the lysosome (Class I) or localize to the lysosome without catalytic function (Class II)—prevents
  the cleavage of terminal sialic acid residues from sialoglycoproteins and sialyloligosaccharides
  starting in utero. In addition to massive intralysosomal substrate storage and oligosacchariduria,
  NEU1 deficiency impairs desialylation of lysosomal-associated membrane protein-1 (LAMP1),
  prolonging its half-life and driving excessive calcium-dependent lysosomal exocytosis across
  visceral, connective, hematologic, and neural tissues. Affected fetuses and neonates present with
  nonimmune hydrops fetalis, fetal or neonatal ascites, diffuse and facial edema, inguinal hernias,
  hepatosplenomegaly, coarse facial features, and dysostosis multiplex, frequently resulting in
  stillbirth or death in early infancy; rare cases surviving beyond the neonatal period develop
  progressive multisystem and neurological manifestations reported across type II sialidosis.
category: Mendelian

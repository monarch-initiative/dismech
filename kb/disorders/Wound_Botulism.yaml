treatments:
- name: Equine heptavalent botulinum antitoxin (BAT)
  action_category: THERAPEUTIC
  description: >-
    Equine-derived heptavalent botulinum antitoxin, obtained through the CDC, is
    the specific antitoxin for noninfant botulism and should be given on
    clinical suspicion without awaiting confirmation. It neutralizes circulating
    unbound toxin and limits progression but cannot reverse paralysis already
    established inside neurons; earlier administration shortens ventilation and
    intensive care.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: botulinum antitoxin pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Presynaptic acetylcholine release blockade
    treatment_effect: INHIBITS
    description: >-
      Antitoxin binds circulating botulinum toxin before it binds peripheral
      cholinergic terminals, preventing further presynaptic blockade; it does
      not act on wound colonization and cannot reverse established blockade.
    evidence:
    - reference: PMID:34551726
      reference_title: "Early diagnosis and critical management of wound botulism in the emergency department: a single center experience and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The antitoxin neutralizes toxin that has not yet bound to nerve endings,
        which underscores the importance of early initiation of treatment.
      explanation: Describes antitoxin neutralizing circulating unbound toxin, the step this edge targets.
  evidence:
  - reference: PMID:20046244
    reference_title: "Wound botulism in injection drug users: time to antitoxin correlates with intensive care unit length of stay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early AT administration and wound drainage are recommended as these
      measures may decrease ICU length of stay.
    explanation: The series recommends early antitoxin and relates it to shorter intensive care.
  - reference: PMID:12646758
    reference_title: Early antitoxin treatment in wound botulism results in better outcome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early antitoxin administration is important in achieving a favorable
      outcome.
    explanation: A wound botulism case series links early antitoxin to better outcome.
- name: Wound debridement and surgical source control
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Incision, drainage, and debridement of the colonized wound or abscess remove
    the anaerobic focus of ongoing toxin production; earlier wound drainage
    correlates with shorter intensive care.
  treatment_term:
    preferred_term: debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Wound colonization with in-situ toxin production
    treatment_effect: INHIBITS
    description: Debriding the necrotic anaerobic focus removes the site of ongoing clostridial toxin production.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Wound botulism is caused by clostridial colonization of an anaerobic
        wound, treatment of which is generally centered on debridement

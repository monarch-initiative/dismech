name: Wound Botulism
creation_date: '2026-11-27T00:26:36Z'
category: Infectious Disease
parents:
- Bacterial Infection
synonyms:
- inoculation botulism
disease_term:
  preferred_term: wound botulism
  term:
    id: MONDO:0015803
    label: wound botulism
description: >-
  Wound botulism is a toxicoinfectious form of botulism in which Clostridium
  botulinum spores introduced into devitalized tissue germinate in the
  anaerobic wound, multiply, and produce botulinum neurotoxin in situ. The
  absorbed toxin blocks presynaptic acetylcholine release at peripheral
  cholinergic terminals, producing symmetric cranial-nerve palsies and a
  descending flaccid paralysis that frequently progresses to respiratory
  failure requiring mechanical ventilation. Before the late 1980s it followed
  gross trauma; it now occurs almost entirely in people who inject drugs,
  especially by subcutaneous or intramuscular injection of black tar heroin,
  and it causes outbreaks among injectors in the western United States and
  Europe. It differs from the parent botulism syndromes in its exposure route
  (toxin produced in situ in an injection site or traumatic wound rather than
  ingestion of preformed toxin), its usually longer and more variable
  incubation, the general absence of gastrointestinal symptoms, and its
  first-line therapy, which adds surgical source control of the wound and
  wound-directed antimicrobials to equine heptavalent botulinum antitoxin.
infectious_agent:
- name: Clostridium botulinum
  infectious_agent_term:
    preferred_term: Clostridium botulinum
    term:
      id: NCBITaxon:1491
      label: Clostridium botulinum
  description: >-
    Anaerobic, spore-forming, gram-positive bacterium. Spores contaminate
    injected drugs or soil-contaminated wounds, germinate in necrotic tissue,
    and produce botulinum neurotoxin, predominantly types A and B in wound
    disease.
  evidence:
  - reference: PMID:34976915
    reference_title: "Wound Botulism Among Persons Who Inject Black Tar Heroin in New Mexico, 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Wound botulism is caused by contamination of a wound with C. botulinum
      spores. Under anaerobic conditions present in a wound, the spores
      germinate and produce botulinum toxin.
    explanation: The outbreak report's introduction names C. botulinum as the wound-colonizing toxin producer.
  - reference: PMID:15150338
    reference_title: Wound botulism in the UK and Ireland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighteen cases were caused by type A toxin and two by type B toxin.
    explanation: The UK and Ireland case series records toxin types A and B in confirmed wound botulism.
transmission:
- name: In-situ toxin production after spore inoculation into an injection site
  description: >-
    Spores carried in contaminated drug, cutting agents, or injection equipment
    are introduced under the skin or into muscle. Non-intravenous injection of
    black tar heroin is the dominant risk behaviour, and heating the drug for
    injection does not kill the spores. Person-to-person transmission does not
    occur; clusters reflect a shared contaminated drug supply.
  evidence:
  - reference: PMID:9516001
    reference_title: Wound botulism associated with black tar heroin among injecting drug users.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the final regression model, subcutaneous or intramuscular injection of
      BTH was the only behavior associated with WB among IDUs (odds ratio, 13.7;
      95% confidence interval, 3.0-63.0).
    explanation: The case-control study identifies non-intravenous injection of black tar heroin as the transmission route.
  - reference: PMID:18957182
    reference_title: Wound botulism from heroin skin popping.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The heating of heroin powder to solubilize it for subcutaneous injection
      ("skin popping") does not kill the spores.
    explanation: The review explains why drug preparation does not remove the spore inoculum.
- name: Soil contamination of a traumatic wound
  description: >-
    Gross trauma such as open fractures, crush injuries, and motor-vehicle or
    gunshot wounds contaminated with soil was the original setting of wound
    botulism and remains a minority route.
  evidence:
  - reference: PMID:11049786
    reference_title: "Wound botulism in California, 1951-1998: recent epidemic in heroin injectors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whereas early cases of WB occurred after gross trauma, all but 1 of the
      last 102 cases occurred in drug users, primarily those who inject drugs
      subcutaneously ("skin poppers").
    explanation: The California series documents the traumatic route and its replacement by injection drug use.
  - reference: PMID:34976915
    reference_title: "Wound Botulism Among Persons Who Inject Black Tar Heroin in New Mexico, 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Traumatic injuries reported among cases include motor vehicle accident,
      gunshot wound, or other injury resulting in an open fracture.
    explanation: The report names the traumatic-wound settings recorded in national surveillance.
agent_life_cycle:
  description: >-
    C. botulinum is an environmental saprophyte whose heat-resistant spores
    persist in soil; there is no obligate animal host or arthropod vector.
    Spores reach illicit drugs at any point from production to use, or a wound
    by soil contamination, and germinate to the toxin-producing vegetative form
    only in anaerobic necrotic tissue.
  notes: >-
    The reservoir is environmental rather than a non-human animal host, so no
    hosts or vectors are listed.
  evidence:
  - reference: PMID:29996865
    reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Spores of C. botulinum are found in soil and can be introduced into
      illicit drugs such as heroin at any stage from point of production to use
    explanation: The outbreak report's background describes the soil reservoir and drug-contamination route.
  life_cycle_stages:
  - name: Environmental spore
    description: Heat-resistant dormant spore in soil or contaminated drug that is the inoculated infectious form.
  - name: Vegetative toxin-producing form
    description: Germinated, multiplying form that grows in necrotic anaerobic wound tissue and produces botulinum neurotoxin.
progression:
- phase: Inoculation to symptom onset
  notes: >-
    Neurologic symptoms usually begin within a few days to two weeks after the
    contaminating injection or wound, longer and more variable than the roughly
    one-day median incubation of foodborne botulism, because toxin must first be
    produced in the wound; toxin-producing organisms can persist for weeks.
  evidence:
  - reference: url:https://www.cdc.gov/botulism/risk-factors/wound-botulism.html
    reference_title: "Injection Drug Use and Wound Botulism | Botulism | CDC"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Symptoms of wound botulism usually do not appear immediately. They
      usually appear within a few days to two weeks.
    explanation: CDC public-health guidance states the usual incubation interval of wound botulism.
  - reference: PMID:34976915
    reference_title: "Wound Botulism Among Persons Who Inject Black Tar Heroin in New Mexico, 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this outbreak, we detected botulinum toxin type A in a wound culture
      43 days after last possible heroin exposure.
    explanation: The outbreak report documents persistent in-wound toxin production weeks after exposure.
- phase: Cranial-nerve and bulbar onset with descending weakness
  notes: >-
    Oculomotor and bulbar palsies dominate the presentation and may progress to
    descending limb weakness and respiratory failure; misattribution to opioid
    intoxication commonly delays diagnosis.
  evidence:
  - reference: PMID:29996865
    reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of cases (98%) presented with classical symptoms of
      oculomotor and bulbar palsy but very few with descending limb weakness;
      over half (58%) were ventilated for respiratory paralysis although most
      did not require long-term support.
    explanation: The Scottish outbreak describes the cranial-onset presentation and its respiratory progression.
- phase: Recovery
  duration: Weeks to months
  notes: >-
    Recovery follows sprouting of new nerve terminals; ventilated patients can
    need weeks to months of support, and episodes can recur with continued
    injection.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recovery, which takes weeks to months, occurs after sprouting of new nerve terminals."
    explanation: The guideline describes the prolonged recovery interval of botulism.
  - reference: PMID:21317399
    reference_title: Recurrent wound botulism among injection drug users in California.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During 1993-2006, 17 IDUs had recurrent WB, 14 with 1 recurrence and 3
      with 2 recurrences.
    explanation: California surveillance documents recurrent episodes among injectors.
epidemiology:
- name: California and United States surveillance
  description: >-
    California has reported most of the world's wound botulism, with a steep
    rise after black tar heroin arrived in the late 1980s; in national
    surveillance almost all laboratory-confirmed cases are among people who
    inject drugs and a small minority follow trauma.
  unit: reported wound botulism cases
  evidence:
  - reference: PMID:11049786
    reference_title: "Wound botulism in California, 1951-1998: recent epidemic in heroin injectors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From the first case in 1951, through 1998, a total of 127 cases were
      identified-93 in the last 5 years. The dramatic increase has been due to
      an epidemic (of WB) in people who inject black tar heroin.
    explanation: The California series quantifies the heroin-associated epidemic.
  - reference: PMID:34976915
    reference_title: "Wound Botulism Among Persons Who Inject Black Tar Heroin in New Mexico, 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      From 2002 to 2018 in the United States, 95% of lab confirmed wound
      botulism cases were reported among PWID
    explanation: National surveillance attributes nearly all confirmed cases to people who inject drugs.
- name: United Kingdom and Ireland, 2000-2004
  description: >-
    Wound botulism was not recognized in the UK and Ireland before 2000, after
    which cases among heroin injectors rose each year to 40 in 2004.
  unit: clinically recognized cases
  evidence:
  - reference: PMID:16280612
    reference_title: "Wound botulism in injectors of drugs: upsurge in cases in England during 2004."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2000 and 2001, ten cases were clinically recognised, with a further 23
      in 2002, 15 in 2003 and 40 cases in 2004. All cases occurred in heroin
      injectors.
    explanation: Surveillance quantifies the UK and Ireland upsurge among heroin injectors.
- name: Scotland outbreak, 2014-2015
  description: >-
    The largest European outbreak, linked to a contaminated batch of heroin or
    cutting agent, with 40 confirmed or probable cases.
  unit: confirmed and probable outbreak cases
  evidence:
  - reference: PMID:29996865
    reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between the 24th of December 2014 and the 30th of May 2015, a total of 40
      cases were reported across six regions in Scotland.
    explanation: The outbreak report gives the case count.
pathophysiology:
- name: Clostridial spore inoculation into injection site or wound
  description: >-
    Spores of C. botulinum enter tissue with a contaminated injected drug or
    with soil contaminating a traumatic wound. This is the initiating exposure
    of the causal chain.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  locations:
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  downstream:
  - target: Wound colonization with in-situ toxin production
    causal_link_type: DIRECT
    description: Non-intravenous injection or trauma deposits spores in devitalized tissue where they can germinate.
    evidence:
    - reference: PMID:29996865
      reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The necrotic devitalised tissue at the site of injection provides an
        ideal anaerobic environment for C. botulinum spores to germinate,
        multiply and produce toxin which then gets absorbed into the systemic
        circulation causing a neuroparalytic syndrome
      explanation: The report links deposition of spores in necrotic injection tissue to germination.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contamination of wounds with Clostridium botulinum and subsequent in situ
      botulinum toxin production is typically (in the United States) caused by
      unsanitary injection of a particular type of heroin (black tar heroin)
      subcutaneously or subdermally
    explanation: The guideline identifies contaminated non-intravenous heroin injection as the usual inoculation route.
- name: Wound colonization with in-situ toxin production
  description: >-
    In the anaerobic, necrotic wound the spores germinate to vegetative
    organisms that multiply and produce botulinum neurotoxin, which is absorbed
    into the systemic circulation.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  locations:
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  downstream:
  - target: Presynaptic acetylcholine release blockade
    causal_link_type: DIRECT
    description: Toxin produced in the wound is absorbed and reaches peripheral cholinergic terminals.
    evidence:
    - reference: PMID:29996865
      reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        C. botulinum spores to germinate, multiply and produce toxin which then
        gets absorbed into the systemic circulation causing a neuroparalytic
        syndrome
      explanation: The report links in-wound toxin production to systemic absorption and the neuroparalytic syndrome.
  evidence:
  - reference: PMID:34976915
    reference_title: "Wound Botulism Among Persons Who Inject Black Tar Heroin in New Mexico, 2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Under anaerobic conditions present in a wound, the spores germinate and
      produce botulinum toxin.
    explanation: Describes germination and in-situ toxin production in the wound.
- name: Presynaptic acetylcholine release blockade
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    Absorbed toxin binds peripheral cholinergic terminals, is internalized, and
    its light-chain metalloprotease cleaves SNARE proteins, preventing
    acetylcholine exocytosis at somatic motor and autonomic cholinergic
    terminals. This presynaptic functional denervation underlies both the motor
    and the autonomic features of wound botulism.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    modifier: DECREASED
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
  mechanism_confidence: ESTABLISHED
  biological_scale: CELLULAR
  downstream:
  - target: Descending flaccid paralysis
    causal_link_type: DIRECT
    description: Failure of acetylcholine release at skeletal neuromuscular junctions produces symmetric descending weakness.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The characteristic flaccid paralysis results from blocking acetylcholine
        transmission across the neuromuscular junction by inhibition of
        acetylcholine release from the presynaptic motor neuron terminal
      explanation: The guideline links presynaptic acetylcholine-release block to flaccid paralysis.
  - target: Bulbar and ocular neuromuscular transmission failure
    causal_link_type: DIRECT
    description: Cranial motor terminals are prominently and early affected, producing ptosis, ophthalmoplegia, and bulbar weakness.
    evidence:
    - reference: PMID:29996865
      reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The majority of cases (98%) presented with classical symptoms of
        oculomotor and bulbar palsy
      explanation: The outbreak shows cranial-nerve involvement dominating the presentation.
  - target: Respiratory neuromuscular transmission failure
    causal_link_type: DIRECT
    description: Failure at respiratory-muscle neuromuscular junctions compromises ventilation.
    evidence:
    - reference: PMID:29996865
      reference_title: "A pragmatic harm reduction approach to manage a large outbreak of wound botulism in people who inject drugs, Scotland 2015."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        over half (58%) were ventilated for respiratory paralysis
      explanation: The outbreak links the transmission failure to respiratory paralysis requiring ventilation.
  - target: Autonomic cholinergic transmission failure
    causal_link_type: DIRECT
    description: Blockade at parasympathetic cholinergic terminals impairs secretomotor and pupillary function.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Botulinum neurotoxin enters the vascular circulation (through ingestion,
        absorption from colonized wound or intestine, inhalation, or injection)
        and is transported to peripheral cholinergic nerve terminals, including
        neuromuscular junctions, postganglionic parasympathetic nerve endings,
        and peripheral ganglia
      explanation: The guideline names postganglionic parasympathetic terminals as toxin targets.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic flaccid paralysis results from blocking acetylcholine
      transmission across the neuromuscular junction by inhibition of
      acetylcholine release from the presynaptic motor neuron terminal
    explanation: The guideline states the presynaptic acetylcholine-release block that defines this node.
- name: Descending flaccid paralysis
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  description: >-
    Widespread somatic motor-terminal failure lowers the endplate potential
    below the muscle action-potential threshold, producing generalized
    symmetric descending weakness and loss of reflexes without sensory loss.

    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with wound botulism, botulinum neurotoxin–producing species of
      Clostridium are not always detected in wound specimens, especially after
      administration of antibiotics.
    explanation: The guideline states the limits of wound culture confirmation.
  - reference: PMID:34551726
    reference_title: "Early diagnosis and critical management of wound botulism in the emergency department: a single center experience and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

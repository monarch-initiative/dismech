  description: >-
    Wound botulism should be suspected in a person who injects drugs presenting
    with cranial-nerve palsies and descending symmetric weakness, and antitoxin
    should be requested on clinical grounds before laboratory confirmation.
  results: A compatible bulbar and descending weakness syndrome in an injector warrants presumptive treatment.
  evidence:
  - reference: PMID:30605447
    reference_title: "Wound Botulism Outbreak Among Persons Who Use Black Tar Heroin - San Diego County, California, 2017-2018."
    supports: SUPPORT

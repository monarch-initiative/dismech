notes: >-
  Wound botulism is promoted out of the Botulism entry under the infectious
  disease granularity ladder: it differs from the parent syndromes on
  transmission (in-situ toxin production in an injection site or traumatic
  wound rather than ingestion of preformed toxin), on first-line therapy (it
  adds surgical wound source control and wound-directed antibiotics such as
  penicillin or metronidazole, which are appropriate here unlike in infant
  botulism), and on tempo (a longer, more variable incubation of days to two
  weeks). Gastrointestinal symptoms are generally absent. Many phenotype
  frequencies are drawn from individual wound botulism case series with small
  and differing denominators (for example PMID:20046244 and PMID:34551726), so
  the frequency bands reflect those series rather than a pooled estimate.
  Aminoglycosides and clindamycin are avoided because they can worsen the
  neuromuscular block (PMID:33956777). Reference caches were generated only
  with just fetch-reference.
review_notes: >-
  Deliberately lumped. Wound botulism caused by botulinum neurotoxin types A
  and B is kept in one entry because the cited series describe the same wound
  colonization mechanism, the same cranial-onset descending paralysis, and the
  same first-line management with equine antitoxin, debridement, and
  wound-directed antibiotics; the literature searched (PMID:15150338,
  PMID:17582887, PMID:30344967) records toxin type as a microbiological finding
  rather than a distinct presentation, diagnosis, or therapy, so no
  toxin-type subtype rows are created.

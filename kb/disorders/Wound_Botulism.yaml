clinical_burden:
  burden_level: HIGH
  rationale: >-
    Wound botulism frequently causes respiratory failure requiring mechanical
    ventilation and prolonged intensive care, and is fatal in a minority of
    cases; United States case fatality has been reported around 13%, and deaths
    occurred in recent outbreaks.
  evidence:
  - reference: PMID:34551726
    reference_title: "Early diagnosis and critical management of wound botulism in the emergency department: a single center experience and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the USA, wound botulism is associated with subcutaneous injection of
      black tar heroin and has a mortality of 13.2%
    explanation: Gives a reported United States case fatality for wound botulism.
  - reference: PMID:30605447
    reference_title: "Wound Botulism Outbreak Among Persons Who Use Black Tar Heroin - San Diego County, California, 2017-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All nine patients required admission to the intensive care unit; six
      required endotracheal intubation and mechanical ventilation, one of whom
      died.
    explanation: Documents intensive-care need, ventilation, and a death in a recent outbreak.
diagnosis:
- name: Clinical recognition in the injector with cranial-nerve signs
  diagnosis_term:
    preferred_term: diagnostic procedure

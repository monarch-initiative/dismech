- name: Serum toxin detection and wound culture
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Confirmation detects botulinum neurotoxin in serum by mouse bioassay or
    cultures a toxin-producing Clostridium from the wound. Serum toxin
    sensitivity is limited, so a negative test does not exclude the diagnosis.
  measurements:
  - preferred_term: Clostridium botulinum toxin
    term:

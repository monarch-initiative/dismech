genetic:
- name: ACTL6A
  gene_term:
    preferred_term: ACTL6A
    term:
      id: hgnc:24124
      label: ACTL6A
  variant_origin: GERMLINE
  notes: >-
    Monogenic autosomal-dominant BAFopathy. ClinGen (Syndromic Disorders GCEP)
    rates the gene-disease relationship Moderate, so no CAUSATIVE
    relationship_type is asserted here; the evidence tier is recorded in
    gene_disease_validity. Reported variants are heterozygous missense in the
    actin-like domain and a splice variant, with a haploinsufficiency mechanism.
    ACTL6A is highly loss-of-function intolerant (ExAC pLI 0.99; DECIPHER
    haploinsufficiency index 3.57), consistent with the proposed mechanism.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_9278e3c0-9174-4aed-8c13-b34618e88825-2023-07-21T160000.000Z
    evidence:
    - reference: CGGV:assertion_9278e3c0-9174-4aed-8c13-b34618e88825-2023-07-21T160000.000Z
      reference_title: "ACTL6A / ACTL6A-related BAFopathy (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ACTL6A | HGNC:24124 | ACTL6A-related BAFopathy | MONDO:0700121 | AD | Moderate | SOP10 | Syndromic Disorders Gene Curation Expert Panel | 2023-07-21T16:00:00.000Z"
      explanation: ClinGen Syndromic Disorders GCEP classifies the ACTL6A-disease relationship as Moderate (autosomal dominant).
  evidence:
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we hypothesize that haploinsufficiency is the mechanism underlying this disorder"
    explanation: Supports a loss-of-function/haploinsufficiency mechanism for the ACTL6A variants.

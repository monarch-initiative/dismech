    explanation: A subject required speech therapy for expressive and receptive language deficits, documenting supportive management.
animal_models:
- name: Early BAF53a loss, developing mouse cortex (Braun 2021)
  species: Mouse
  genotype: In vivo early loss of the npBAF subunit BAF53a (Actl6a) in the developing cortex
  publication: PMID:33602870
  description: >-
    In vivo manipulation of npBAF-to-nBAF subunit-switch timing in the developing
    mouse cortex; early BAF53a loss stalls the progenitor cell cycle. A conditional
    developmental manipulation, not the heterozygous missense/splice genotype of patients.
  modeled_mechanisms:
  - target: Neural Progenitor Cell-Cycle Stall
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the progenitor cell-cycle stall and the reduced SOX2/ASCL1 pioneer-site
      chromatin accessibility that this node describes.
    limitations: >-
      The model is an engineered early loss of BAF53a in mouse cortex, not the heterozygous
      missense/splice ACTL6A variants of patients, and mouse corticogenesis lacks the
      human-specific outer-subventricular-zone progenitor biology; it tests the mechanism
      rather than the human allelic state.
    evidence:
    - reference: PMID:33602870
      reference_title: "BAF subunit switching regulates chromatin accessibility to control cell cycle exit in the developing mammalian cortex."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We manipulated the timing of BAF subunit exchange in vivo and found that early loss of the npBAF subunit BAF53a stalls the cell cycle to disrupt neurogenesis"
      explanation: Supports treating early in-vivo BAF53a loss as a model of the progenitor cell-cycle-stall node.
- name: Reduced npBAF subunit dosage mice (Yoo 2009)
  species: Mouse
  genotype: Reduced dosage of npBAF-complex subunit genes
  publication: PMID:19561591
  description: >-
    Mice with reduced dosage of npBAF-complex subunit genes, used to show the npBAF
    complex is required for neural-progenitor proliferation. A general npBAF-dosage
    model, not an ACTL6A-specific allele.
  modeled_mechanisms:
  - target: Impaired Neurogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Shows that reduced npBAF subunit dosage impairs neural-progenitor proliferation,
      the process behind the impaired-neurogenesis node.
    limitations: >-
      A general npBAF-dosage model across subunit genes rather than an ACTL6A-specific
      allele, and the reported severe outcome is neural-tube closure failure in mouse,
      not the human neurodevelopmental phenotype; it supports npBAF essentiality rather
      than the human allelic effect.
    evidence:
    - reference: PMID:19561591
      reference_title: "MicroRNA-mediated switching of chromatin-remodelling complexes in neural development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The subunits of the npBAF complex are essential for neural-progenitor proliferation, and mice with reduced dosage for the genes encoding its subunits have defects in neural-tube closure similar to those in human spina bifida, one of the most serious congenital birth defects"
      explanation: Supports treating reduced npBAF subunit dosage as a model of impaired neurogenesis.

name: ACTL6A-related BAFopathy
creation_date: "2026-11-07T00:00:00Z"
category: Mendelian
description: >-
  ACTL6A-related BAFopathy is an ultra-rare autosomal dominant neurodevelopmental
  disorder within the SWI/SNF (BAF) chromatinopathy spectrum, caused by germline
  heterozygous variants in ACTL6A encoding the actin-related subunit BAF53a of the
  neural-progenitor npBAF chromatin-remodeling complex. Affected individuals
  present with global developmental delay, variable intellectual disability with
  prominent speech and language impairment, dysmorphic facial features, digital
  anomalies, and variable congenital cardiac, genitourinary, and abdominal wall
  defects.
synonyms:
- ACTL6A-related neurodevelopmental disorder
- BAF53A-related disorder
- ACTL6A-related intellectual disability
disease_term:
  preferred_term: ACTL6A-related BAFopathy
  term:
    id: MONDO:0700121
    label: ACTL6A-related BAFopathy
parents:
- BAFopathy
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:28649782
      reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified heterozygous, novel variants in ACTL6A, a gene encoding a component of the BAF complex, in three subjects with varying degrees of intellectual disability"
      explanation: The core clinical presentation is neurodevelopmental impairment with intellectual disability and language delay.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:34906496
      reference_title: "Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also identified de novo or predicted loss-of-function variants in 4 candidate BAFopathy genes, including ACTL6A, BICRA (implicated in Coffin-Siris syndrome during this study), PBRM1, and SMARCC1."
      explanation: ACTL6A-related BAFopathy is a monogenic chromatin-remodeling syndrome spanning neurodevelopmental, craniofacial, skeletal, and visceral systems.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 10 molecularly confirmed individuals have been reported across the
    defining three-subject series (PMID:28649782), a recurrent p.Arg377Trp case
    report (PMID:31994175), and a clinical exome reanalysis cohort (PMID:34906496);
    population-based prevalence has not been established.
  evidence:
  - reference: PMID:31994175
    reference_title: "The p.Arg377Trp variant in ACTL6A underlines a recognizable BAF-opathy phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the second patient with the de novo p.Arg377Trp variant in ACTL6A (Actin-like 6A) (MIM#604958) and a phenotype reminiscent a disorder of the BRG1-associated factor (BAF) complex, including dysmorphic facies and acral malformations. So far, only three patients with ACTL6A variants and neurodevelopmental delay have been reported"
    explanation: At the time of this second p.Arg377Trp report, only four affected individuals with ACTL6A variants had been described in the literature.
  - reference: PMID:34906496
    reference_title: "Retrospective analysis of a clinical exome sequencing cohort reveals the mutational spectrum and identifies candidate disease-associated loci for BAFopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified de novo or predicted loss-of-function variants in 4 candidate BAFopathy genes, including ACTL6A, BICRA (implicated in Coffin-Siris syndrome during this study), PBRM1, and SMARCC1."
    explanation: Retrospective reanalysis of 16,243 clinical exomes identified additional rare de novo or predicted loss-of-function ACTL6A cases, consistent with ultra-rare disease prevalence.
notes: >-
  The phenotype frequencies in this entry are derived from the defining
  3-subject series (Marom et al., PMID:28649782) supplemented by the recurrent
  p.Arg377Trp case report (PMID:31994175), with additional cohort evidence from
  clinical exome reanalysis (PMID:34906496); they should be read as a
  small-cohort description rather than a population estimate.

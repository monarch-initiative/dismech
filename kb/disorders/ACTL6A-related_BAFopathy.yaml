name: ACTL6A-related BAFopathy
creation_date: "2026-11-07T00:00:00Z"
category: Mendelian
synonyms:
- ACTL6A-related neurodevelopmental disorder
- BAF53A-related disorder
- ACTL6A-related intellectual disability
disease_term:
  preferred_term: ACTL6A-related BAFopathy
  term:
    id: MONDO:0700121
    label: ACTL6A-related BAFopathy
parents:
- BAFopathy
notes: >-
  The phenotype frequencies in this entry are derived from the defining
  3-subject series (Marom et al., PMID:28649782) supplemented by the single
  recurrent-variant case report (PMID:31994175); they should be read as a
  small-cohort description rather than a population estimate.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant disorder from heterozygous ACTL6A variants (missense in the
    actin-like domain, or a splice variant causing an in-frame deletion),
    de novo in the subjects in whom parental testing was possible.
pathophysiology:
- name: ACTL6A Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Heterozygous ACTL6A variants reduce or impair BAF53A, the actin-related
    protein subunit of the SWI/SNF (BAF) complex. Patient cells show reduced
    ACTL6A protein and a loss-of-function/haploinsufficiency mechanism.
  genes:
  - preferred_term: ACTL6A
    term:
      id: hgnc:24124
      label: ACTL6A
  molecular_functions:
  - preferred_term: chromatin binding
    modifier: DECREASED
    term:
      id: GO:0003682
      label: chromatin binding
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified heterozygous, novel variants in ACTL6A, a gene encoding a component of the BAF complex, in three subjects with varying degrees of intellectual disability"
    explanation: Establishes heterozygous ACTL6A variants as the genetic basis in subjects with intellectual disability.
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we hypothesize that haploinsufficiency is the mechanism underlying this disorder"
    explanation: States haploinsufficiency as the proposed disease mechanism.
  downstream:
  - target: BAF Complex Chromatin-Remodeling Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28649782
      reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the variants identified in our subjects may have a deleterious effect on the function of the protein by disturbing the integrity of the BAF complex"
      explanation: Links the ACTL6A variants to impaired integrity of the BAF complex.
- name: BAF Complex Chromatin-Remodeling Dysfunction
  biological_scale: MOLECULAR
  description: >-
    BAF53A normally enhances the chromatin binding and ATPase activity of the
    BAF complex; reduced ACTL6A lowers its binding to BRG1/SMARCA4 and
    destabilises the complex, impairing nucleosome remodeling.
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "ACTL6A directly interacts with beta actin (ACTB) and SMARCA4/BRG1 while enhancing chromatin binding and ATPase activity of the BAF complex"
    explanation: ACTL6A enhances the chromatin binding and ATPase activity of the BAF complex, so its loss impairs remodeling.
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "reduced binding of ACTL6A and BRG1 in subject 3 lymphoblasts, compared to control cells"
    explanation: Patient lymphoblasts show reduced ACTL6A-BRG1 binding, the direct evidence of impaired complex assembly.
  downstream:
  - target: Neural Progenitor Cell-Cycle Stall
    causal_link_type: DIRECT
- name: Neural Progenitor Cell-Cycle Stall
  biological_scale: CELLULAR
  description: >-
    Loss of BAF53a from the neural-progenitor npBAF complex stalls the
    progenitor cell cycle and lowers chromatin accessibility at the neurogenic
    pioneer-factor sites SOX2 and ASCL1 (through Polycomb accumulation), shown in
    the developing mouse cortex.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cell proliferation in forebrain
    modifier: DECREASED
    term:
      id: GO:0021846
      label: cell proliferation in forebrain
  evidence:
  - reference: PMID:33602870
    reference_title: "BAF subunit switching regulates chromatin accessibility to control cell cycle exit in the developing mammalian cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We manipulated the timing of BAF subunit exchange in vivo and found that early loss of the npBAF subunit BAF53a stalls the cell cycle to disrupt neurogenesis"
    explanation: In vivo loss of the npBAF subunit BAF53a stalls the neural-progenitor cell cycle and disrupts neurogenesis.
  - reference: PMID:33602870
    reference_title: "BAF subunit switching regulates chromatin accessibility to control cell cycle exit in the developing mammalian cortex."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of BAF53a results in decreased chromatin accessibility at specific neural transcription factor binding sites, including the pioneer factors SOX2 and ASCL1, due to Polycomb accumulation"
    explanation: BAF53a loss reduces chromatin accessibility at the SOX2/ASCL1 pioneer-factor sites, the molecular lesion behind the neurogenic block.
  downstream:
  - target: Impaired Neurogenesis
    causal_link_type: DIRECT
- name: Impaired Neurogenesis
  biological_scale: CELLULAR
  description: >-
    The npBAF-to-nBAF subunit switch (BAF53a to BAF53b), required for mitotic
    exit and neuronal differentiation, is disrupted, impairing neurogenesis and
    producing the cognitive and language phenotype.
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: DECREASED
    term:
      id: GO:0030182
      label: neuron differentiation
  evidence:
  - reference: PMID:19561591
    reference_title: "MicroRNA-mediated switching of chromatin-remodelling complexes in neural development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The subunits of the npBAF complex are essential for neural-progenitor proliferation, and mice with reduced dosage for the genes encoding its subunits have defects in neural-tube closure similar to those in human spina bifida, one of the most serious congenital birth defects"
    explanation: The npBAF subunits (including BAF53a/ACTL6A) are essential for neural-progenitor proliferation; reduced dosage causes neural-tube defects in mice.
  - reference: PMID:28649782
    reference_title: "Heterozygous variants in ACTL6A, encoding a component of the BAF complex, are associated with intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "ACTL6A substitution with ACTL6B (MIM# 612458) dictates a switch from neural progenitor npBAF complex to neural specific nBAF complex, to allow proper mitotic exit and neuronal differentiation"
    explanation: ACTL6A controls the npBAF-to-nBAF switch required for mitotic exit and neuronal differentiation.

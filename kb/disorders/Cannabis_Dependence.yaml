genetic:
- name: CHRNA2
  gene_term:
    preferred_term: CHRNA2
    term:
      id: hgnc:1956
      label: CHRNA2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Typed SUSCEPTIBILITY, not CAUSATIVE: this is a common-variant association
    reaching genome-wide significance and replicating, not a Mendelian locus.
    The index variant rs56372821 is an expression quantitative trait locus for
    CHRNA2 rather than a coding change, and the association runs through
    genetically regulated CHRNA2 expression in brain tissue, so the gene is
    implicated by expression rather than by a variant whose protein consequence
    is known.

    This row should not be read as making cannabis dependence a CHRNA2 disease.
    The trait is polygenic: a later multi-ancestry study found 22 genome-wide
    significant loci in European ancestry alone, with further loci unique to
    African, East Asian and admixed American ancestries, and significant
    SNP-based heritability in every population it was powered to test. CHRNA2 is
    recorded because it is the locus with a named gene and a replication, and
    the second reference is cited here so the single-gene row cannot stand in
    for the architecture.

    No variant is bound and no functional impact category is recorded, because
    an expression quantitative trait locus has no protein consequence to
    describe. CHRNA2 is deliberately absent from the pathophysiology nodes: the
    entry has no evidence connecting a nicotinic alpha-2 subunit to any
    mechanism it models, and wiring it in to make the pathograph tidier would
    assert a route no cited source supports.
  evidence:
  - reference: PMID:31209380
    reference_title: Genome-wide association study implicates CHRNA2 in cannabis use disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The index variant (rs56372821) is a strong expression quantitative trait
      locus for cholinergic receptor nicotinic α2 subunit (CHRNA2)
    explanation: >-
      What implicates this gene, and by what mechanism of inference: the
      associated variant regulates CHRNA2 expression rather than altering the
      protein. The Greek letter is copied from the source rather than
      transliterated.
  - reference: PMID:31209380

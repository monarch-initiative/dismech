- name: Withdrawal-Driven Relapse to Cannabis Use
  biological_scale: ORGANISM
  conforms_to: "addiction_cycle#Compulsive Seeking and Loss of Control"
  mechanism_confidence: PROVISIONAL
  description: >-
    Withdrawal shortens abstinence, which is the point at which the cycle closes:
    the syndrome that follows stopping becomes a reason to resume. The evidence is
    an association between meeting the withdrawal criteria and a shorter
    abstinence in a retrospective self-report sample, so the direction is
    plausible rather than established, and the node is marked provisional. The
    entry does not claim a measured causal route from withdrawal to resumption.
  evidence:
  - reference: PMID:22153944
    reference_title: Diagnostic criteria for cannabis withdrawal syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Subjects with CWS had a significantly shorter duration of abstinence
    explanation: >-
      The whole of the node's support. Marked INDIRECT because an association
      between withdrawal status and abstinence duration, recalled retrospectively,
      does not establish that withdrawal drove the resumption.
  downstream:
  - target: Addictive cannabis use
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Repeated failure to sustain abstinence is what the diagnosis describes.
    evidence:
    - reference: PMID:22153944
      reference_title: Diagnostic criteria for cannabis withdrawal syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        There were significant positive associations between duration or frequency
        of cannabis use prior to the quit attempt and experiencing CWS
      explanation: >-
        The reciprocal half of the loop: heavier prior use predicts withdrawal,
        and withdrawal predicts shorter abstinence. Indirect because the study
        measured the two associations separately rather than a cycle.

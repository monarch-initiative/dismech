treatments:
- name: Psychosocial Intervention
  description: >-
    Cognitive-behavioural therapy and motivational enhancement therapy, alone or
    in combination, are the standard of care and the only treatments for this
    disorder with multi-trial evidence of benefit. The 2016 Cochrane review of 23
    randomised trials in 4,045 participants found that people receiving a
    psychosocial intervention were more likely to be abstinent at early
    follow-up, on low-quality evidence, and that higher-intensity delivery, more
    than four sessions over longer than a month, produced more consistent
    improvement.

    The limits belong next to the effect. Roughly three quarters of participants
    were not abstinent at final follow-up, and no particular intervention was
    consistently effective at nine months or later, so this row records a
    treatment that reduces use in the short term rather than one that resolves
    the disorder. Together with the pharmacotherapy row below, the entry's
    treatment picture is a modest, short-lived behavioural effect and no
    established drug.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: cognitive-behavioural and motivational enhancement therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:

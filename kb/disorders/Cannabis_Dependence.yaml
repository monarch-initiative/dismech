- name: Cannabis Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    A withdrawal syndrome reliably follows discontinuation of chronic heavy
    cannabis use, with onset and time course resembling other substance
    withdrawal syndromes. Its symptoms are predominantly emotional and
    behavioural; appetite change, weight loss and physical discomfort are also
    frequently reported. In a sample of 384 adult lifetime cannabis smokers
    reporting retrospectively on their most difficult unaided quit attempt, 40.9
    per cent met the DSM-5 threshold, and meeting it was associated with the
    duration and frequency of prior use.

    The entry binds only the withdrawal features its sources name. Neither cited
    source enumerates the seven DSM-5 criterion symptoms in the text available
    here, so individually bound phenotypes stop at weight loss, which is stated.
    Appetite change is described without a direction in the source and is left as
    prose rather than bound to a decreased-appetite term, because the direction
    would be inferred rather than read.

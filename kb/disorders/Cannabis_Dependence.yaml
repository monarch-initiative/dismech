treatments:
- name: Pharmacotherapy
  description: >-
    No medication is established for cannabis use disorder. The 2025 Cochrane
    review covering 37 randomised trials in 3,201 participants found abstinence
    at the end of treatment no more likely with tetrahydrocannabinol
    preparations or N-acetylcysteine than with placebo, and the evidence for
    cannabidiol and for anticonvulsants and mood stabilisers uncertain. Its
    conclusion is that these pharmacotherapies should still be considered
    experimental. This row records that absence rather than a treatment, which is
    why it carries no therapeutic_agent: there is no agent to name as
    established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:41025421
    reference_title: Pharmacotherapies for cannabis use disorder.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Given the limited evidence of efficacy, those pharmacotherapies should
      still be considered experimental for treating cannabis use disorder
    explanation: >-
      The claim this row records, from the current Cochrane review of the
      question. Graded HUMAN_CLINICAL because the evidence synthesised is
      randomised trials in patients, with quote_role REVIEW_SYNTHESIS because the
      sentence is the review's own conclusion over trials it did not run.
mechanistic_hypotheses:
- hypothesis_group_id: cd_withdrawal_negative_reinforcement
  hypothesis_label: Withdrawal-driven negative reinforcement maintains cannabis dependence
  status: EMERGING
  description: >-
    On this account the disorder is maintained less by the acute dopamine effect,
    which in humans is small and inconsistently detected, than by the withdrawal
    syndrome and the blunted dopamine reactivity that accompany chronic use: the
    person continues in order to avoid a reliably aversive state rather than to
    obtain a large reward. The evidence assembled here is consistent with it and
    does not establish it. What would distinguish it is a prospective test of
    whether withdrawal severity predicts relapse when prior use is held constant,
    which the retrospective sample here cannot provide.
discussions:
- discussion_id: cd_human_dopamine_signal_weak
  kind: CONTROVERSY
  prompt: >-
    How large is the acute dopamine effect of cannabis in humans, and is it large
    enough to carry the reinforcement this entry's acute chain describes?
  attaches_to:
  - pathophysiology#Increased Dopamine Release in the Nucleus Accumbens Shell
  - pathophysiology#Blunted Striatal Dopamine Reactivity
  rationale: >-
    The animal evidence is unambiguous: delta-9-tetrahydrocannabinol raises
    accumbens shell dopamine by microdialysis, and the effect is abolished by a
    CB1 antagonist and by a mu1 antagonist in the ventral tegmentum. The human
    evidence is not. The largest pooled analysis found a small reduction in
    raclopride binding confined to limbic striatum, with nothing elsewhere in the
    striatum, and introduces itself by noting that earlier human imaging had been
    inconsistent. Against that, chronic users show blunted dopamine reactivity to
    a challenge, which is a reduced rather than an increased signal and is the
    finding that correlates with addiction severity.

    The two are not strictly in conflict, since one is an acute drug effect and
    the other a chronic adaptation, and the entry models them as separate nodes.
    What is unresolved is weighting: whether the acute dopamine step deserves the
    place the addiction-cycle module gives it in this disease, or whether cannabis
    dependence is better described as running mainly through the chronic and
    withdrawal arms. The entry marks the accumbens node provisional for that
    reason rather than asserting it at the strength of the animal data.
- discussion_id: cd_withdrawal_symptoms_unbound
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which individual withdrawal symptoms should this entry bind, and at what
    frequency does each occur?
  attaches_to:
  - pathophysiology#Cannabis Withdrawal Syndrome
  - phenotypes#Weight loss
  rationale: >-
    The gap is in this entry rather than in the field. The DSM-5 criterion set
    for cannabis withdrawal has seven symptoms, and the diagnostic study cited
    here evaluated thirty-nine, but neither cited source enumerates them in the
    text available to this entry: the review names the symptom classes and three
    specific features, and the diagnostic study reports the threshold and the
    count without listing the items. So the entry binds weight loss and leaves
    the rest unbound rather than reconstructing a criterion list from memory.
    Closing it needs a source that states the symptoms and ideally their
    frequencies, read rather than recalled.

name: Cannabis Dependence
creation_date: "2026-11-19T23:15:00Z"
category: Psychiatric
disease_term:
  preferred_term: cannabis dependence
  term:
    id: MONDO:0005689
    label: cannabis dependence
synonyms:
- cannabis use disorder
- marijuana dependence
- cannabis abuse
description: >-
  A substance use disorder in which repeated cannabis use becomes compulsive and
  persists despite harm, with tolerance and a reproducible withdrawal syndrome on
  discontinuation. It is the most prevalent illicit-drug use disorder in
  populations where cannabis is widely used: 2.5 per cent of US adults met DSM-5
  criteria in the preceding twelve months and 6.3 per cent over their lifetime,
  yet only about one in eight people with a lifetime diagnosis has ever had
  treatment.

  The reinforcing agent is delta-9-tetrahydrocannabinol, a partial agonist at
  cannabinoid CB1 and CB2 receptors. Its dopamine-releasing action in the nucleus
  accumbens shell is well established in animals and requires both CB1 and mu1
  opioid receptors in the ventral tegmentum, but the corresponding effect in
  humans is small and has been inconsistently detected, and chronic users show
  blunted rather than heightened striatal dopamine reactivity. Chronic use also
  downregulates cortical CB1 receptors, reversibly and in proportion to years of
  smoking.

  No pharmacotherapy is established. Psychosocial treatment, principally
  cognitive-behavioural and motivational enhancement therapy, is the standard of
  care and reduces use at early follow-up, but roughly three quarters of treated
  patients are not abstinent at final follow-up and no intervention has been
  consistently effective beyond nine months.
notes: >-
  Named to its MONDO binding, as the three sibling substance entries curated
  alongside it are. DSM-5 calls the construct cannabis use disorder and that
  name is in synonyms; the entry's scope is the dependence syndrome, which is
  what every source cited here studied.

  MONDO carries only two cannabis concepts, cannabis dependence and cannabinoid
  hyperemesis syndrome, so unlike the cocaine entry there is no separate abuse
  term to map: cannabis abuse is a synonym of this term rather than a sibling,
  and nothing is recorded in mappings. Cannabis_Hyperemesis_Syndrome is a
  separate entry and a different disease, a toxicity syndrome of heavy use
  rather than the use disorder.

  No ICD-10-CM mapping is recorded. The sibling nicotine entry carries one, so
  the asymmetry is deliberate rather than an omission: no ICD-10-CM code for
  cannabis dependence is in cache/icd10cm/terms.csv, the MONDO term returns no
  database cross-references through the OLS entity endpoint, and a code may not
  be written into a binding from memory. Adding one needs a lookup against the
  ICD-10-CM build this repository does not commit.

  What distinguishes this entry from its stimulant siblings is the weakness of
  the human dopamine signal rather than a different route to a strong one. In
  cocaine and methamphetamine dependence the rise in synaptic dopamine is large
  and uncontested; here the animal result is clear, the human result is small,
  confined to limbic striatum and described by its own authors as following a
  literature of inconsistent findings, and the chronic finding runs the other
  way as blunted reactivity. The entry records that asymmetry rather than
  smoothing it, which is why the accumbens node carries a human and an animal
  item that do not agree in magnitude.

- name: Pharmacotherapy
  description: >-
    No medication is established for cannabis use disorder. The 2025 Cochrane
    review covering 37 randomised trials in 3,201 participants found abstinence
    at the end of treatment no more likely with tetrahydrocannabinol
    preparations or N-acetylcysteine than with placebo, and the evidence for
    cannabidiol and for anticonvulsants and mood stabilisers uncertain. Its

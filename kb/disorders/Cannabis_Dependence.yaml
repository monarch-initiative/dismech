      change, weight loss, and physical discomfort are also frequently reported
    explanation: >-
      The symptom profile the node describes, and the source of the one
      individually bound phenotype. Note the quote says appetite change without a
      direction; the entry does not convert that into decreased appetite.
  - reference: PMID:22153944

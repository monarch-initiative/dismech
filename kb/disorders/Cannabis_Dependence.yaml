  - reference: PMID:31209380
    reference_title: Genome-wide association study implicates CHRNA2 in cannabis use disorder.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The risk for cannabis use disorder (CUD) has a strong genetic component,
      with twin heritability estimates ranging from 51 to 70%
    explanation: >-
      That the trait is substantially heritable, which is why a genetic section
      belongs in this entry at all. Marked BACKGROUND because the twin estimates
      are restated from earlier studies in this paper's introduction and are not
      its own result; evidence_source stays HUMAN_CLINICAL because the evidence
      the sentence describes is human twin studies.
  - reference: PMID:37985822
    reference_title: Multi-ancestry genome-wide association study of cannabis use disorder yields insight into disease biology and public health implications.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

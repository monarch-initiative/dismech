name: Cannabis Dependence
creation_date: "2026-11-19T23:15:00Z"
category: Psychiatric
disease_term:
  preferred_term: cannabis dependence
  term:
    id: MONDO:0005689
    label: cannabis dependence
synonyms:
- cannabis use disorder
- marijuana dependence
- cannabis abuse
notes: >-
  Named to its MONDO binding, as the three sibling substance entries curated
  alongside it are. DSM-5 calls the construct cannabis use disorder and that
  name is in synonyms; the entry's scope is the dependence syndrome, which is
  what every source cited here studied.

  MONDO carries only two cannabis concepts, cannabis dependence and cannabinoid
  hyperemesis syndrome, so unlike the cocaine entry there is no separate abuse
  term to map: cannabis abuse is a synonym of this term rather than a sibling,
  and nothing is recorded in mappings. Cannabis_Hyperemesis_Syndrome is a
  separate entry and a different disease, a toxicity syndrome of heavy use
  rather than the use disorder.

  No ICD-10-CM mapping is recorded. The sibling nicotine entry carries one, so
  the asymmetry is deliberate rather than an omission: no ICD-10-CM code for
  cannabis dependence is in cache/icd10cm/terms.csv, the MONDO term returns no
  database cross-references through the OLS entity endpoint, and a code may not
  be written into a binding from memory. Adding one needs a lookup against the
  ICD-10-CM build this repository does not commit.

  What distinguishes this entry from its stimulant siblings is the weakness of
  the human dopamine signal rather than a different route to a strong one. In
  cocaine and methamphetamine dependence the rise in synaptic dopamine is large
  and uncontested; here the animal result is clear, the human result is small,
  confined to limbic striatum and described by its own authors as following a
  literature of inconsistent findings, and the chronic finding runs the other
  way as blunted reactivity. The entry records that asymmetry rather than
  smoothing it, which is why the accumbens node carries a human and an animal
  item that do not agree in magnitude.
pathophysiology:
- name: Partial Agonism of Cannabinoid CB1 Receptors by Delta-9-Tetrahydrocannabinol
  biological_scale: MOLECULAR
  description: >-
    Delta-9-tetrahydrocannabinol, the main psychotropic constituent of cannabis,
    is a partial agonist at the CB1 receptor. It is also a partial agonist at
    CB2, so this entry does not treat the pharmacology as CB1-exclusive; CB1 is
    the receptor the downstream nodes are about because it is the one whose
    antagonist blocks the dopamine effect below. Partial agonism matters for the
    rest of the chain: the response an exogenous partial agonist produces depends
    on how much receptor is present and on the endocannabinoid tone it competes
    with, which is the link to the downregulation node.
  chemical_entities:
  - preferred_term: delta-9-tetrahydrocannabinol
    term:
      id: CHEBI:66964
      label: Delta(9)-tetrahydrocannabinol
  molecular_functions:
  - preferred_term: CB1 cannabinoid receptor activity
    term:
      id: GO:0004949
      label: cannabinoid receptor activity
    modifier: INCREASED
  genes:
  - preferred_term: CNR1
    term:
      id: hgnc:2159
      label: CNR1
  evidence:
  - reference: PMID:17828291
    reference_title: "The diverse CB1 and CB2 receptor pharmacology of three plant cannabinoids: delta9-tetrahydrocannabinol, cannabidiol and delta9-tetrahydrocannabivarin."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Delta9-THC, the main psychotropic constituent of cannabis, is a CB1 and
      CB2 receptor partial agonist
    explanation: >-
      The pharmacology this node asserts, including that the agonism is partial
      and not confined to CB1. A pharmacology review rather than a primary
      receptor-binding report, hence REVIEW_SYNTHESIS and evidence_source OTHER.
  - reference: PMID:17828291
    reference_title: "The diverse CB1 and CB2 receptor pharmacology of three plant cannabinoids: delta9-tetrahydrocannabinol, cannabidiol and delta9-tetrahydrocannabivarin."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the responses it elicits appear to be strongly influenced both by the
      expression level and signalling efficiency of cannabinoid receptors and by
      ongoing endogenous cannabinoid release
    explanation: >-
      Why partial agonism is load-bearing here rather than a detail of
      nomenclature: the effect depends on receptor expression level, which is
      exactly what the cortical downregulation node reports changing with
      chronic use.
  downstream:
  - target: Presynaptic Inhibition of GABAergic Transmission in the Ventral Tegmental Area
    causal_link_type: DIRECT
    description: >-
      CB1 activation inhibits GABAergic transmission in the ventral tegmental
      area presynaptically.
    evidence:
    - reference: PMID:12099913
      reference_title: Inhibition of GABAergic neurotransmission in the ventral tegmental area by cannabinoids.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        The results indicate that activation of CB1 cannabinoid receptors
        inhibits GABAergic neurotransmission in the VTA with a presynaptic
        mechanism
      explanation: >-
        The edge's claim, stated as the study's own result. Two caveats belong on
        the reader rather than in the node's name: the agonist was WIN55212-2, a
        synthetic mixed CB1/CB2 agonist and not THC, so the step is established
        for CB1 activation rather than for this drug; and the preparation is rat
        coronal midbrain slices, which is why this is graded IN_VITRO and not
        MODEL_ORGANISM.
  - target: Mu1 Opioid Receptor-Dependent Gating of Cannabinoid Dopamine Activation
    causal_link_type: DIRECT
    description: >-
      The dopamine effect of delta-9-tetrahydrocannabinol requires CB1: a
      cannabinoid receptor antagonist abolishes it.
    evidence:
    - reference: PMID:9197269
      reference_title: Cannabinoid and heroin activation of mesolimbic dopamine transmission by a common mu1 opioid receptor mechanism.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        SR141716A, an antagonist of central cannabinoid receptors, prevented the
        effects of Delta9-THC but not those of heroin
      explanation: >-
        Establishes that the cannabinoid receptor is required for this drug's
        dopamine effect, and that the requirement is specific rather than a
        property of any euphoriant: the same antagonist left heroin's effect
        intact.
- name: Presynaptic Inhibition of GABAergic Transmission in the Ventral Tegmental Area
  biological_scale: CELLULAR
  description: >-
    CB1 activation depresses GABA-A receptor-mediated inhibitory postsynaptic
    currents in the ventral tegmental area through a presynaptic mechanism,
    established in rat midbrain slices with a synthetic agonist and blocked by a
    CB1 antagonist. Removing the GABAergic brake on dopamine neurons is the
    classical route by which a cannabinoid would raise their firing rate, but
    that consequence was not measured in the slice preparation and is recorded
    here as the authors' inference rather than as a result.
  biological_processes:
  - preferred_term: GABAergic inhibitory transmission onto dopamine neurons
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  locations:
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  evidence:
  - reference: PMID:12099913
    reference_title: Inhibition of GABAergic neurotransmission in the ventral tegmental area by cannabinoids.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The results indicate that activation of CB1 cannabinoid receptors inhibits
      GABAergic neurotransmission in the VTA with a presynaptic mechanism
    explanation: >-
      The node's claim, in the study's own words, including that the mechanism is
      presynaptic.
  downstream:
  - target: Increased Dopamine Release in the Nucleus Accumbens Shell
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of GABAergic inhibition would raise dopamine neuron firing and so
      accumbens dopamine. The slice study did not measure either, and the animal
      study that did measure the dopamine rise shows a further requirement in
      between, so this edge is indirect with an intermediate that is named by the
      next node rather than unknown in principle.
    evidence:
    - reference: PMID:12099913
      reference_title: Inhibition of GABAergic neurotransmission in the ventral tegmental area by cannabinoids.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Depression of the GABAergic inhibitory input of dopaminergic neurons
        would increase their firing rate in vivo
      explanation: >-
        The authors' inference, quoted with its conditional intact. Marked
        INDIRECT because the sentence is a prediction about the intact animal
        drawn from a slice measurement, not a dopamine result; the quote carries
        "would" rather than a reported increase, and the node's description says
        so.
- name: Mu1 Opioid Receptor-Dependent Gating of Cannabinoid Dopamine Activation
  biological_scale: CELLULAR
  description: >-
    The dopamine effect of delta-9-tetrahydrocannabinol depends on mu1 opioid
    receptors in the ventral tegmentum, not on the cannabinoid receptor alone.
    Infusing a mu1 antagonist into the ventral tegmentum abolishes the effect of
    cannabinoids on accumbens dopamine, and does so for heroin as well, which is
    the sense in which the two drugs share a final step. This is the clearest
    mechanistic difference between this entry and its stimulant siblings, whose
    dopamine rise needs no opioid receptor.
  locations:
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  evidence:
  - reference: PMID:9197269
    reference_title: Cannabinoid and heroin activation of mesolimbic dopamine transmission by a common mu1 opioid receptor mechanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      naloxonazine, an antagonist of micro1 opioid receptors, infused into the
      ventral tegmentum, prevented the action of cannabinoids and heroin on
      dopamine transmission
    explanation: >-
      The node's claim, and the anatomical localisation of it: the antagonist was
      infused into the ventral tegmentum rather than given systemically, which is
      what places the requirement there. The receptor is written "micro1" in the
      indexed abstract where the paper prints the Greek letter; the quote copies
      the cached record rather than correcting it.
  downstream:
  - target: Increased Dopamine Release in the Nucleus Accumbens Shell
    causal_link_type: DIRECT
    description: >-
      With the gate intact, delta-9-tetrahydrocannabinol raises extracellular
      dopamine selectively in the shell of the nucleus accumbens.
    evidence:
    - reference: PMID:9197269
      reference_title: Cannabinoid and heroin activation of mesolimbic dopamine transmission by a common mu1 opioid receptor mechanism.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Delta9-THC and heroin increased extracellular dopamine concentrations
        selectively in the shell of the nucleus accumbens
      explanation: >-
        The measured dopamine rise, in freely moving rats by microdialysis, and
        its subregional selectivity, which is why the node names the shell rather
        than the accumbens as a whole.
- name: Increased Dopamine Release in the Nucleus Accumbens Shell
  biological_scale: CELLULAR
  conforms_to: "addiction_cycle#Acute Mesolimbic Dopamine Reinforcement"
  mechanism_confidence: PROVISIONAL
  description: >-
    Delta-9-tetrahydrocannabinol raises accumbens shell dopamine in rats. In
    humans the same effect is much weaker: a pooled re-analysis of two
    raclopride positron emission tomography studies found a small,
    statistically significant reduction in binding in limbic striatum, about
    three and a half per cent, and nothing elsewhere in the striatum, and its
    authors introduce their own work by noting that previous human imaging of
    this question had given inconsistent results. The node is therefore marked
    provisional, and is scoped to the animal result with the human magnitude
    recorded beside it rather than averaged into it. This is the point at which
    the entry departs most from its stimulant siblings, where the human dopamine
    signal is large and uncontested.
  biological_processes:
  - preferred_term: dopamine release into the accumbens shell
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  cell_types:
  - preferred_term: mesolimbic dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: nucleus accumbens shell
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  evidence:
  - reference: PMID:9197269
    reference_title: Cannabinoid and heroin activation of mesolimbic dopamine transmission by a common mu1 opioid receptor mechanism.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Delta9-THC and heroin increased extracellular dopamine concentrations
      selectively in the shell of the nucleus accumbens
    explanation: >-
      The animal result the node is scoped to, measured directly by microdialysis
      in freely moving rats.
  - reference: PMID:25801289
    reference_title: "Further human evidence for striatal dopamine release induced by administration of ∆9-tetrahydrocannabinol (THC): selectivity to limbic striatum."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No significant differences between THC and placebo were found in other
      striatal subdivisions
    explanation: >-
      The limit of the human finding, from the pooled re-analysis that reports
      it: the effect was confined to limbic striatum. Cited for that boundary
      rather than for the effect size, whose sentence carries a bracketed tracer
      name and so cannot be quoted; the magnitude is in the node description
      instead.
  - reference: PMID:25801289
    reference_title: "Further human evidence for striatal dopamine release induced by administration of ∆9-tetrahydrocannabinol (THC): selectivity to limbic striatum."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      on striatal dopamine release have provided inconsistent results
    explanation: >-
      Why this node is marked provisional rather than asserted at the strength of
      its animal evidence: the paper's own framing of the human literature it was
      written to settle. Quoted from the rationale section, so it carries no
      quote_role, and marked INDIRECT because it describes the state of the
      evidence rather than reporting a measurement.
  downstream:
  - target: Blunted Striatal Dopamine Reactivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cd_withdrawal_negative_reinforcement
    description: >-
      Repeated acute dopamine release is the conventional account of how the
      chronic blunting arises, and it is the step the addiction-cycle module
      places here. No study cited in this entry measured the transition: the
      blunting is observed cross-sectionally in people who already use
      cannabis, so the edge is scoped to the hypothesis group rather than
      asserted as a result.
    evidence:
    - reference: PMID:25024177
      reference_title: Decreased dopamine brain reactivity in marijuana abusers is associated with negative emotionality and addiction severity.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        DA responses in ventral striatum were also inversely correlated with
        addiction severity and craving
      explanation: >-
        The only support the edge has, and it is a correlation rather than a
        route: the blunted response tracks how severe the disorder is, which is
        what one would expect if cumulative use produced it, and is equally
        consistent with the blunting preceding the use. Marked INDIRECT for that
        reason, and the edge carries a hypothesis group so that a reader can tell
        it apart from the sourced steps above it.
- name: Cortical CB1 Receptor Downregulation
  biological_scale: CELLULAR
  description: >-
    Chronic daily cannabis smokers show downregulated CB1 receptors on positron
    emission tomography. Two features of the finding constrain how it can be
    used: it is selective to cortical regions rather than striatal, so it is not
    a change in the reward pathway the acute nodes describe; and it reverses,
    with receptor density returning to normal after about four weeks of
    monitored abstinence. The magnitude tracks years of smoking. The authors
    describe it as a neuroadaptation that may promote dependence, and that hedge
    is kept.
  molecular_functions:
  - preferred_term: CB1 cannabinoid receptor availability
    term:
      id: GO:0004949
      label: cannabinoid receptor activity
    modifier: DECREASED
  genes:
  - preferred_term: CNR1
    term:
      id: hgnc:2159
      label: CNR1
  evidence:
  - reference: PMID:21747398
    reference_title: Reversible and regionally selective downregulation of brain cannabinoid CB1 receptors in chronic daily cannabis smokers.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      reversible and regionally selective downregulation of brain cannabinoid
      CB(1) receptors in human subjects who chronically smoke cannabis
    explanation: >-
      The node's claim as the study states it, in humans and by imaging. The
      receptor is written CB(1) in the indexed abstract, where the paper prints a
      subscript; the quote copies the cached record.
  - reference: PMID:21747398
    reference_title: Reversible and regionally selective downregulation of brain cannabinoid CB1 receptors in chronic daily cannabis smokers.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Downregulation correlated with years of cannabis smoking and was selective
      to cortical brain regions
    explanation: >-
      Both of the constraints the node's description turns on: the dose-response
      with duration of use, and the cortical rather than striatal distribution
      that keeps this node out of the acute reward chain.
  - reference: PMID:21747398
    reference_title: Reversible and regionally selective downregulation of brain cannabinoid CB1 receptors in chronic daily cannabis smokers.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      After ~4 weeks of continuously monitored abstinence from cannabis on a
      secure research unit, CB(1) receptor density returned to normal levels
    explanation: >-
      The reversibility, with its timescale and the fact that abstinence was
      monitored rather than self-reported. This is what makes the node an
      adaptation rather than a lesion, and it is the reason the entry does not
      model cortical receptor loss as permanent.
- name: Blunted Striatal Dopamine Reactivity
  biological_scale: CELLULAR
  conforms_to: "addiction_cycle#Reward Deficit and Stress-System Recruitment"
  description: >-
    Challenged with methylphenidate, people who use cannabis show markedly
    blunted dopamine responses on positron emission tomography. The precise
    claim matters and is easy to overstate: baseline striatal D2 receptor
    availability did not differ from controls, so this is reduced reactivity to a
    dopamine challenge and not receptor downregulation. In the ventral striatum
    the response was inversely correlated with negative emotionality, which was
    higher in the cannabis group, and with addiction severity and craving. The
    authors read it as consistent with decreased brain reactivity that might
    contribute to negative emotionality and addictive behaviour, and the entry
    keeps that conditional.
  biological_processes:
  - preferred_term: striatal dopamine response to a pharmacological challenge
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  locations:
  - preferred_term: ventral striatum
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  evidence:
  - reference: PMID:25024177
    reference_title: Decreased dopamine brain reactivity in marijuana abusers is associated with negative emotionality and addiction severity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the marijuana abusers showed markedly blunted responses when challenged
      with MP
    explanation: >-
      The node's claim, in 24 cannabis users against 24 controls challenged with
      methylphenidate.
  - reference: PMID:25024177
    reference_title: Decreased dopamine brain reactivity in marijuana abusers is associated with negative emotionality and addiction severity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      baseline (placebo) measures of striatal DA D2 receptor availability did not
      differ between groups
    explanation: >-
      The negative result that fixes what this node may be read as saying.
      Without it the blunted response would invite a receptor-loss reading, which
      the same study excludes; it is quoted rather than paraphrased because it is
      the boundary of the claim.
  - reference: PMID:25024177
    reference_title: Decreased dopamine brain reactivity in marijuana abusers is associated with negative emotionality and addiction severity.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      DA responses in ventral striatum were also inversely correlated with
      addiction severity and craving
    explanation: >-
      Ties the blunted response to the severity of the disorder rather than to
      exposure alone, which is what makes this node part of the mechanism and not

  downstream:
  - target: Irritability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The authors propose that decreased dopamine reactivity contributes to the
      negative emotionality they measured, which they gloss as increased stress
      reactivity and irritability. The proposal is theirs and is conditional.
    evidence:
    - reference: PMID:25024177
      reference_title: Decreased dopamine brain reactivity in marijuana abusers is associated with negative emotionality and addiction severity.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The attenuated responses to MP, including reduced decreases in striatal
        DVs, are consistent with decreased brain reactivity to the DA stimulation
        in marijuana abusers
      explanation: >-
        The authors' reading of their own result, quoted at the strength they
        state it: "consistent with", not demonstrated. The edge is indirect
        because what was measured is a correlation between the dopamine response
        and a negative-emotionality score, not a route from one to the other.
- name: Cannabis Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    A withdrawal syndrome reliably follows discontinuation of chronic heavy
    cannabis use, with onset and time course resembling other substance
    withdrawal syndromes. Its symptoms are predominantly emotional and
    behavioural; appetite change, weight loss and physical discomfort are also
    frequently reported. In a sample of 384 adult lifetime cannabis smokers
    reporting retrospectively on their most difficult unaided quit attempt, 40.9
    per cent met the DSM-5 threshold, and meeting it was associated with the
    duration and frequency of prior use.

    The entry binds only the withdrawal features its sources name. Neither cited
    source enumerates the seven DSM-5 criterion symptoms in the text available
    here, so individually bound phenotypes stop at weight loss, which is stated.
    Appetite change is described without a direction in the source and is left as
    prose rather than bound to a decreased-appetite term, because the direction
    would be inferred rather than read.
  evidence:
  - reference: PMID:15514394
    reference_title: Review of the validity and significance of cannabis withdrawal syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a withdrawal syndrome reliably follows discontinuation of chronic heavy use
      of cannabis or tetrahydrocannabinol
    explanation: >-
      That the syndrome exists and is reproducible, from the review that assessed
      its validity across laboratory and clinical studies. A review synthesis
      rather than a primary result, and graded OTHER for that reason.
  - reference: PMID:15514394
    reference_title: Review of the validity and significance of cannabis withdrawal syndrome.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    The MAP2K1-related form, encoding MEK1. MAP2K1 and MAP2K2 variants together
    account for about a quarter of cardiofaciocutaneous syndrome and raise MEK
    kinase activity, read out as increased phosphorylation of ERK. Seizure
    frequency and severity are higher in MAP2K1 than in MAP2K2 disease.
  evidence:
  - reference: PMID:18413255
    reference_title: Biochemical characterization of novel germline BRAF and MEK mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Approximately 25% of individuals with CFC have mutations in either MEK1 or
      MEK2 that lead to increased MEK kinase activity as judged by increased
      phosphorylation of its downstream effector ERK.
    explanation: >-
      Gives the combined MEK1/MEK2 share of cases and the gain-of-activity
      mechanism shared by the CFC3 and CFC4 subtypes.
  - reference: PMID:35524774
    reference_title: "Neurologic and neurodevelopmental complications in cardiofaciocutaneous syndrome are associated with genotype: A multinational cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The frequency and severity of seizures was higher among individuals with
      BRAF or MAP2K1 variants than in those with MAP2K2 variants.
    explanation: >-
      Multinational cohort establishing that MAP2K1 disease carries a heavier
      seizure burden than MAP2K2 disease, the clinical distinction between the
      CFC3 and CFC4 subtypes.
  - reference: CGGV:assertion_f8c7a090-0a97-4653-bd51-702a9f9144b9-2018-05-29T160000.000Z

prevalence:
- population: Japanese nationwide survey
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.123457
  percentage: 1 in 810,000
  notes: >-
    A nationwide Japanese epidemiological survey estimated a minimum prevalence
    of about 1 in 810,000 individuals. A recent review continues to describe
    cardiofaciocutaneous syndrome as one of the rarest RASopathies, so this
    survey-based figure is best interpreted as a lower-bound clinically
    ascertained prevalence rather than a definitive global estimate.
  evidence:
  - reference: PMID:22495831
    reference_title: "Prevalence and clinical features of Costello syndrome and cardio-facio-cutaneous syndrome in Japan: findings from a nationwide epidemiological survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalences of Costello and CFC syndromes are estimated to be 1 in 1,290,000 and 1 in 810,000 individuals, respectively."
    explanation: This nationwide epidemiological survey directly reports the estimated prevalence of cardiofaciocutaneous syndrome in Japan.
  - reference: PMID:38136934
    reference_title: "The Cardiofaciocutaneous Syndrome: From Genetics to Prognostic-Therapeutic Implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiofaciocutaneous (CFC) syndrome is one of the rarest RASopathies"
    explanation: This contemporary review supports interpreting CFC syndrome as an ultra-rare disorder and contextualizes the survey-based prevalence estimate.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant. Most affected individuals carry a de novo BRAF, MAP2K1,
    MAP2K2, or KRAS pathogenic variant, although familial recurrence has been
    reported; each child of an affected individual has a 50% chance of inheriting
    the variant. In a cohort of 43 cases, genotype distribution was BRAF (81%),
    MEK1 (14%), and MEK2 (5%).
  evidence:
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CFC syndrome is inherited in an autosomal dominant manner. The majority of
      individuals with CFC syndrome reported to date have the disorder as the
      result of a de novo BRAF, MAP2K1, MAP2K2, or KRAS pathogenic variant.
    explanation: >-
      The GeneReviews chapter states the mode of inheritance and that most cases
      arise de novo in one of the four causative genes.
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, instances of familial recurrence of CFC have been reported. Each
      child of an individual with CFC syndrome has a 50% chance of inheriting the
      BRAF, MAP2K1, MAP2K2, or KRAS pathogenic variant.
    explanation: >-
      Supports the familial-recurrence caveat and the 50% transmission risk stated
      in this inheritance block.
  - reference: PMID:36308388
    reference_title: "Obstetrical and neonatal outcomes of cardio-facio-cutaneous syndrome: Prenatal consequences of Ras/MAPK dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 43 individuals with pathogenic variants in BRAF (81%),
      MEK1 (14%), or MEK2 (5%) genes.
    explanation: >-
      Large cohort study establishing genotype distribution in CFC syndrome,
      confirming BRAF as the predominant causative gene.
pathophysiology:
- name: RAS GTPase Dysregulation by Germline KRAS Variants
  description: >-
    Germline KRAS missense variants act at the most upstream step of the cascade,
    dysregulating RAS-RAF-ERK signal transduction before the RAF tier. This is
    the molecular entry point for the CFC2 subtype and the step shared with the
    RASopathies that cardiofaciocutaneous syndrome phenotypically overlaps.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:16474404
    reference_title: Germline KRAS and BRAF mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 43 individuals with CFC, we identified two heterozygous KRAS mutations
      in three individuals and eight BRAF mutations in 16 individuals, suggesting
      that dysregulation of the RAS-RAF-ERK pathway is a common molecular basis
      for the three related disorders.
    explanation: >-
      Identifies germline KRAS variants in cardiofaciocutaneous syndrome and
      attributes the disorder to dysregulated RAS-RAF-ERK signalling, the claim
      this node makes.
  downstream:
  - target: RAS-MAPK Pathway Hyperactivation
    description: >-
      Dysregulated RAS signalling raises output through the downstream RAF-MEK-ERK
      tiers of the same cascade.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - RAF recruitment and activation by GTP-loaded RAS
- name: B-Raf Kinase Dysregulation by Germline BRAF Variants
  description: >-
    Germline BRAF variants act at the RAF tier. They are biochemically
    heterogeneous: some raise B-Raf kinase activity outright, while others are
    kinase-impaired and yet still phosphorylate the downstream effectors MEK and
    ERK. Both classes therefore raise pathway output, which is why an impaired
    in-vitro kinase measurement does not exclude a variant as causal.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  molecular_functions:
  - preferred_term: B-Raf MAP kinase kinase kinase activity
    term:
      id: GO:0004709
      label: MAP kinase kinase kinase activity
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:18413255
    reference_title: Biochemical characterization of novel germline BRAF and MEK mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, as is seen cancer, some of the B-Raf mutant proteins are kinase
      impaired. Western blot analyses corroborate kinase assays as determined by
      mutant proteins phosphorylating downstream effectors MEK and ERK.
    explanation: >-
      Kinase assays and western blots showing that CFC B-Raf mutant proteins,
      including kinase-impaired ones, phosphorylate MEK and ERK - the
      MAP-kinase-kinase-kinase activity this node binds.
  downstream:
  - target: MEK1 and MEK2 Kinase Hyperactivation
    description: >-
      Mutant B-Raf phosphorylates MEK1 and MEK2, the immediate downstream tier.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16439621
      reference_title: "Germline mutations in genes within the MAPK pathway cause cardio-facio-cutaneous syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        three of five individuals without BRAF mutations had missense mutations
        in either MEK1 or MEK2, downstream effectors of B-Raf
      explanation: >-
        States that MEK1 and MEK2 are the downstream effectors of B-Raf, the
        ordering this edge asserts.
  - target: Seizures
    description: >-
      Epilepsy burden in cardiofaciocutaneous syndrome tracks the BRAF genotype,
      concentrating in variants of the catalytic protein kinase domain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35524774
      reference_title: "Neurologic and neurodevelopmental complications in cardiofaciocutaneous syndrome are associated with genotype: A multinational cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        A disproportionate incidence of severe, treatment-resistant seizures was
        observed in patients with variants in the catalytic protein kinase domain
        of BRAF and at the common p.Y130 site of MAP2K1.
      explanation: >-
        Multinational cohort of 138 individuals locating the heaviest seizure
        burden to variants in this gene's kinase domain, which is the
        genotype-specific basis of this edge.
- name: MEK1 and MEK2 Kinase Hyperactivation

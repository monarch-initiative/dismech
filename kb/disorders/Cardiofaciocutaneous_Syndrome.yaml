        label: Autosomal dominant inheritance
  description: >-
    The KRAS-related form. Germline KRAS variants sit upstream of RAF in the
    RAS-RAF-ERK cascade whose dysregulation is the common molecular basis shared
    by cardiofaciocutaneous syndrome and the RASopathies it phenotypically
    overlaps.
  evidence:
  - reference: PMID:16474404
    reference_title: Germline KRAS and BRAF mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In 43 individuals with CFC, we identified two heterozygous KRAS mutations
      in three individuals and eight BRAF mutations in 16 individuals, suggesting
      that dysregulation of the RAS-RAF-ERK pathway is a common molecular basis
      for the three related disorders.
    explanation: >-
      Original report of germline KRAS variants in cardiofaciocutaneous syndrome,
      in three of 43 affected individuals.

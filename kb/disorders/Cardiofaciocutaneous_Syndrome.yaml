  description: >-
    The BRAF-related form, and the largest share of cardiofaciocutaneous
    syndrome at roughly three quarters of affected individuals. Not every CFC
    B-Raf mutant protein is kinase-activating: some are kinase-impaired and
    still phosphorylate the downstream effectors MEK and ERK, so a reduced
    in-vitro kinase measurement does not exclude the variant as causal.
  evidence:
  - reference: PMID:18413255
    reference_title: Biochemical characterization of novel germline BRAF and MEK mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Approximately 75% of individuals with CFC have mutations in BRAF.
    explanation: >-
      Quantifies the BRAF share of cardiofaciocutaneous syndrome cases that this
      subtype row carries.
  - reference: PMID:18413255
    reference_title: Biochemical characterization of novel germline BRAF and MEK mutations in cardio-facio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, as is seen cancer, some of the B-Raf mutant proteins are kinase
      impaired. Western blot analyses corroborate kinase assays as determined by
      mutant proteins phosphorylating downstream effectors MEK and ERK.
    explanation: >-
      Biochemical characterisation showing that kinase-impaired CFC B-Raf mutants
      still phosphorylate MEK and ERK, which is why impaired kinase activity does
      not rule the variant out.
  - reference: CGGV:assertion_a53e5a92-126f-4b00-a89b-af55d4f342ca-2018-07-24T160000.000Z
    reference_title: "BRAF / cardiofaciocutaneous syndrome (Definitive)"

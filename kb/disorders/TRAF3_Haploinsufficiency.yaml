      PARTIAL because the quoted association is for common expression-reducing variants in
      the wider population, not for the monogenic patients themselves.

genetic:

- name: TRAF3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TRAF3
    term:
      id: hgnc:12033
      label: TRAF3
  association: >-
    Heterozygous loss-of-function variants in TRAF3 cause this disease. The gene-disease
    relationship rests on nine patients from five unrelated families in the founding study
    plus three patients from two further families in the 2024 reanalysis, with a
    consistent immunophenotype and a mechanism that the B cell-conditional heterozygous
    mouse reproduces at the same gene dose.

    The variant class matters for interpretation. Premature-stop alleles such as p.Arg163*
    and p.Gln407* reduce TRAF3 output and cause this disease. Missense alleles that
    destabilise the wild-type protein - which take total TRAF3 below what haploinsufficiency
    alone would give - cause a different, allelic disorder with a different phenotype, and
    should not be curated against this entry.

    Practically, TRAF3 belongs on any CVID or hypogammaglobulinemia gene panel: all three
    patients in the 2024 cohort already carried a CVID diagnosis and were on immunoglobulin
    replacement when the variant was found by targeted reanalysis.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we define monogenic TRAF3 haploinsufficiency syndrome and demonstrate how
      common TRAF3 variants affect a range of human diseases.
    explanation: >-
      The gene-disease claim in the form the founding study makes it.
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data expand the clinical phenotype of TRAF3Hl and pave the way for further
      investigation into loss-of-function variants in patients with CVID.
    explanation: >-
      Independent replication in unrelated families, and the diagnostic recommendation
      that follows from it.

inheritance:

- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single loss-of-function allele is sufficient. Expressivity is variable both within
    and between families - the two reported cohorts differ on the direction of the
    immunoglobulin abnormality - and no modifier has been identified.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals each had monoallelic mutations in TRAF3 that reduced TRAF3
      expression.
    explanation: >-
      Monoallelic variants in affected individuals, which is the dominance claim.

animal_models:

- name: B cell-conditional Traf3 heterozygous mouse (B-Traf3+/-)
  species: Mouse
  genotype: B cell-conditional Traf3 heterozygous (B-Traf3+/-)
  publication: PMID:40773231
  description: >-
    A mouse built specifically to match the human genotype: one Traf3 allele deleted in
    the B lineage rather than both, giving a 40 to 50% protein reduction. It was made
    because the earlier B cell-conditional complete knockout models the endpoint of the
    pathway but not the dose at which human patients live, and the question was whether
    half is enough. It is.
  modeled_mechanisms:
  - target: Reduced TRAF3 Protein Dosage
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the defining feature of the human disease - a partial, not complete,
      reduction in TRAF3 - and shows it is sufficient for a phenotype.
    limitations: >-
      The deletion is B cell-conditional, so nothing in this model speaks to the T cell
      dysregulation that is part of the human syndrome. It also does not carry a human
      stop-gain allele; the dose is engineered rather than inherited.
    readouts:
    - name: B cell TRAF3 protein and Traf3 mRNA
      target: Reduced TRAF3 Protein Dosage
      direction: DECREASED
      interpretation: >-
        Western blot and transcript measurement in splenic B cells, quantifying the
        reduction as 40 to 50% of wild-type littermates.
      evidence:
      - reference: PMID:40773231
        reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that B-Traf3+/− mice have a 40 to 50% decrease in the amount of TRAF3
          protein and Traf3 mRNA in their B cells
        explanation: >-
          The measurement and its magnitude.
    evidence:
    - reference: PMID:40773231
      reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        More recently, human patients with germline TRAF3 mutations leading to
        haploinsufficiency have been reported; the phenotypes of these patients show
        striking similarities with those of mice with TRAF3-deficient B cells.
      explanation: >-
        The authors' own statement of why this mouse is informative for the human disease.
  - target: B Cell Hyperactivity and Prolonged Survival
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Increased spleen weight, increased splenic B cell numbers and elevated survival and
      metabolic proteins at the heterozygous dose.
    limitations: >-
      MODERATE because the mouse readout is B cell accumulation in a lymphoid organ while
      the human readout is clinical lymphoproliferation and autoimmunity; the two are
      linked by argument rather than by a matched measurement.
    readouts:
    - name: Spleen weight and splenic B cell number
      target: B Cell Hyperactivity and Prolonged Survival
      direction: INCREASED
      interpretation: >-
        Both increase relative to wild-type littermates and track with the degree of TRAF3
        reduction.
      evidence:
      - reference: PMID:40773231
        reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results show that B-Traf3+/− mice have significantly lower TRAF3 protein and
          mRNA levels in B cells, correlating closely with increased spleen weight and
          splenic B cell numbers compared to wild-type (WT) littermate mice.
        explanation: >-
          The organ and cell-number measurements, with their correlation to TRAF3 level.
    - name: NF-kB2 p52 and survival protein abundance
      target: B Cell Hyperactivity and Prolonged Survival
      direction: INCREASED
      interpretation: >-
        Hxk2, NF-kB2 p52, Mcl1, c-Myc and Pim2 all significantly more abundant in
        heterozygous than wild-type B cells.
      evidence:
      - reference: PMID:40773231
        reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The glycolytic protein Hxk2, NFκB2 p52, Mcl1, c-Myc, and Pim2 were all
          significantly more abundant in Traf3+/− B cells compared to B cells from WT
          littermates
        explanation: >-
          The molecular output measured at the heterozygous dose.
    evidence:
    - reference: PMID:40773231
      reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results show that B-Traf3+/− mice have significantly lower TRAF3 protein and
        mRNA levels in B cells, correlating closely with increased spleen weight and
        splenic B cell numbers compared to wild-type (WT) littermate mice.
      explanation: >-
        Supports treating this mouse as informative for the B cell hyperactivity node.

- name: B cell-conditional Traf3 knockout mouse (B-Traf3-/-)
  species: Mouse
  genotype: B cell-conditional Traf3 homozygous knockout (B-Traf3-/-)
  publication: PMID:40773231
  description: >-
    The complete B lineage knockout, included as the upper bound of the dose-response
    rather than as a model of the patient genotype. It develops lymphoid organ
    enlargement, autoantibodies and B cell lymphoma with age, which is what makes the
    heterozygous mouse's intermediate phenotype interpretable.
  modeled_mechanisms:
  - target: B Cell Malignant Transformation Risk
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Shows where chronic TRAF3 loss leads in B cells, at a gene dose no patient has.
    limitations: >-
      Patients are heterozygous; this mouse has no B cell TRAF3 at all. It establishes the
      direction of the axis and nothing about the risk conferred by half a dose, which is
      the claim the human entry needs.
    evidence:
    - reference: PMID:40773231
      reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        TRAF3-deficient B cells exhibit substantially enhanced survival, which in mice
        results in marked lymphoid organ enlargement, production of autoantibodies, and
        development of B cell lymphomas (BCL) with age
      explanation: >-
        The complete-loss phenotype, which is the comparator this model provides.

treatments:

- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Replacement immunoglobulin for the antibody deficiency. It is the one treatment
    documented in TRAF3 haploinsufficiency patients, and it was in place before the
    diagnosis was: all three patients in the 2024 cohort were already receiving it under a
    CVID label. No trial or outcome data exist for this disease specifically; the
    documented fact is that patients receive it, not that it has been shown to work here.
  treatment_term:
    preferred_term: immunoglobulin therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective Humoral Defence Against Bacteria
    description: >-
      Substitutes for the antibody the patient's own B cell compartment fails to make.
      It does nothing about the upstream signalling defect.
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, the patients had been diagnosed with common variable immunodeficiency
      (CVID) and were receiving immunoglobulin replacement therapy.
    explanation: >-
      Documents the treatment in these patients, and the diagnostic label it was given
      under.

- name: Antimicrobial Treatment and Prophylaxis
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Treatment of recurrent bacterial infection and, where structural lung damage has
    developed, prophylaxis on the usual antibody-deficiency principles. No TRAF3-specific
    evidence exists; this is standard care for the infection phenotype and is recorded
    without an evidence item rather than with a quote that would not be about this disease.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Carries no evidence item deliberately. Nothing in the cited literature reports
    antimicrobial treatment outcomes in TRAF3 haploinsufficiency.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant inheritance with a 50% recurrence risk per pregnancy, and variable
    expressivity that makes phenotype prediction for a carrier relative unsafe. Cascade
    testing of relatives is worth offering, since the 2024 cohort found affected relatives
    by exactly that route.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through this reassessment and additional familial investigations, we identified three
      previously unidentified cases of TRAF3Hl within two different families.
    explanation: >-
      PARTIAL because it supports the value of family investigation rather than counselling
      as an intervention; the cases were found by studying relatives of an index patient.

diagnosis:

- name: Targeted TRAF3 Analysis in Inborn-Errors-of-Immunity Sequencing Data
  description: >-
    Because TRAF3 haploinsufficiency looks like CVID, the productive diagnostic route has
    been to go back to sequencing data already generated for undiagnosed
    inborn-errors-of-immunity patients and look specifically at TRAF3. Doing that across
    800 patients found three new cases in two families, all previously labelled CVID.
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we conducted a TRAF3-targeted reanalysis of next-generation sequencing data from 800
      patients with inborn errors of immunity
    explanation: >-
      The diagnostic strategy and its scale.

- name: B Cell Immunophenotyping
  description: >-
    Flow cytometry of the B and T compartments. The pattern that supports the diagnosis is
    a dysregulated B cell compartment with increased NF-kB2 activation, alongside mild
    CD4+ lymphopenia with reduced naive T cells and increased regulatory and circulating
    T follicular helper cells.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping showed that patients' B cells were dysregulated, exhibiting
      increased nuclear factor-κB 2 activation, elevated mitochondrial respiration, and
      heightened inflammatory responses.
    explanation: >-
      What immunophenotyping shows in these patients.

differential_diagnoses:

- name: Common variable immunodeficiency
  description: >-
    Not a differential so much as the label these patients are already carrying. Every
    patient in the 2024 cohort had a CVID diagnosis before TRAF3 was looked at, which
    makes idiopathic CVID the population in which undiagnosed TRAF3 haploinsufficiency is
    expected to sit.
  distinguishing_features:
  - A monogenic TRAF3 loss-of-function variant
  - >-
    Accompanying autoimmunity, lymphoproliferation and B cell malignancy risk, which
    idiopathic CVID does not carry as a defined feature
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, the patients had been diagnosed with common variable immunodeficiency
      (CVID) and were receiving immunoglobulin replacement therapy.
    explanation: >-
      Establishes the relationship between the two labels in practice.

- name: TRAF3 dominant-negative deficiency (herpes simplex encephalitis susceptibility)
  description: >-
    The allelic disorder. A dominant-negative TRAF3 missense variant reduces total TRAF3
    well below the level that losing one allele would give, impairs TLR3-dependent type I
    interferon production, and predisposes to herpes simplex encephalitis. It is a
    different phenotype from a different variant class in the same gene, and evidence
    about it should not be curated against this entry.
  distinguishing_features:
  - Missense rather than truncating variant
  - TRAF3 protein far below the 50% expected from loss of one allele
  - >-
    Susceptibility to viral encephalitis rather than recurrent bacterial infection with
    autoimmunity
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2010, autosomal dominant TRAF3 deficiency was reported in a patient with herpes
      simplex virus-1 encephalitis, consistent with the role of TRAF3 in type I interferon
      production.
    explanation: >-
      The earlier entity, described by the same review that then contrasts it with the
      haploinsufficiency phenotype.
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, a novel, completely different clinical phenotype was described in patients
      with TRAF3 haploinsufficiency (TRAF3Hl), characterized by recurrent bacterial
      infections, autoimmune features, systemic inflammation, and hypergammaglobulinemia.
    explanation: >-
      The source's own statement that the two phenotypes are completely different, which
      is why they are separate entries rather than one.

discussions:

- discussion_id: gap_hyper_vs_hypogammaglobulinemia
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hypergammaglobulinemia
  - phenotypes#Hypogammaglobulinemia
  prompt: >-
    Why does the same class of TRAF3 loss-of-function variant produce raised immunoglobulin
    in one cohort and antibody deficiency in another?
  rationale: >-
    The founding cohort's syndrome definition includes hypergammaglobulinemia. Every
    patient in the 2024 cohort was hypogammaglobulinemic on immunoglobulin replacement,
    and that paper names this as the most significant difference between its patients and
    the earlier ones. Both are curated here because both are reported, but they are
    opposite findings and the entry does not have a mechanism that predicts either.

    A mechanism that would reconcile them is available in outline - B cell expansion with
    a class-switch maturation defect could give either a high total immunoglobulin from
    sheer cell numbers or a low protective antibody titre from failed maturation,
    depending on which dominates - but nobody has measured the two cohorts on the same
    panel, and the alternative reading, that variant position or an unidentified modifier
    determines the direction, is untested.
  proposed_experiments:
  - experiment_id: traf3_ig_phenotype_harmonisation
    name: Uniform B cell subset and immunoglobulin phenotyping across reported TRAF3 kindreds
    description: >-
      Apply one immunophenotyping panel - total and class-switched memory B cells, naive B
      cells, plasmablasts, IgG/IgA/IgM and specific antibody responses - across patients
      from both published cohorts and any newly ascertained families, and test whether the
      immunoglobulin direction tracks with the class-switched memory compartment or with
      variant position.
    would_support:
    - pathophysiology#Defective Humoral Defence Against Bacteria
    supporting_outcome:
    - >-
      Immunoglobulin direction tracks with the size of the class-switched memory B cell
      compartment, making the maturation defect the explanation and the two phenotypes two
      points on one axis.
    refuting_outcome:
    - >-
      The two cohorts have indistinguishable B cell subsets despite opposite immunoglobulin
      levels, which would move the explanation to modifiers or environment and leave the
      maturation-defect account unsupported.

- discussion_id: hypothesis_age_as_second_hit
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced TRAF3 Protein Dosage
  prompt: >-
    Does normal ageing act as a second hit on TRAF3 dosage, so that a haploinsufficient
    patient's phenotype worsens over decades?
  rationale: >-
    TRAF3 protein, but not transcript, declines in B cells with age, and in older mice a
    two-hour in vivo proteasome inhibition is enough to raise it again - so the decline is
    degradative and ongoing rather than a fixed developmental setting. Someone who starts
    at half the normal protein and then loses more of it with age would, on this account,
    cross a functional threshold later in life.

    It is a hypothesis and is labelled as one. Nobody has followed TRAF3 haploinsufficient
    patients longitudinally, and the ageing data are not from patients. It is curated
    because it makes a testable prediction about when to watch for the malignancy risk
    this entry records, which is otherwise unstratified.
  evidence:
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with this prediction, in vivo treatment with bortezomib for only 2 h was
      sufficient to increase the level of B cell TRAF3 in older mice, but not young mice
    explanation: >-
      Shows the age-related decline is caused by ongoing proteasomal degradation, which is
      what makes it a plausible additive hit on a genetically halved pool.

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0976228
      label: immunodeficiency 132b
    mapping_predicate: skos:exactMatch
    mapping_source: dismech curation
    notes: >-
      MONDO:0976228 (immunodeficiency 132b) carries an editorial note in MONDO saying it
      is scheduled to be merged into MONDO:0100513 (TRAF3 haploinsufficiency) because the
      two concepts are the same, and will then be obsoleted. This entry therefore binds
      MONDO:0100513 as its disease term and records the IMD132B identifier here so the
      OMIM-series name still resolves to this entry.

notes: >-
  Scope. This entry is the loss-of-function disease only - the haploinsufficiency syndrome
  numbered IMD132B in the OMIM series. A separate allelic disorder is caused by
  dominant-negative TRAF3 missense variants, presents as susceptibility to herpes simplex
  encephalitis, and turns on a different mechanism (impaired TLR3-dependent interferon
  induction, with total TRAF3 driven well below the haploinsufficient level). It is
  recorded under differential diagnoses and is deliberately not curated as part of this
  disease. A literature search on "TRAF3 deficiency" returns both, so this is the main
  named-entity trap in this entry.

  Somatic TRAF3 loss. TRAF3 is a recurrent somatic target in multiple myeloma and B cell
  lymphoma, and much of what is written about TRAF3 concerns that. Somatic biallelic loss
  in a tumour is a different event from a germline heterozygous allele in every cell, and
  only the germline claim belongs here; the canine lymphoma evidence on the malignancy
  node is typed PARTIAL for the same reason.

  Term binding. There is no HPO term for B cell lymphoproliferation as such, so that
  phenotype is bound to Lymphadenopathy with the intended concept kept in the entry name
  and description rather than manufactured into the binding.


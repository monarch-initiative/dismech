name: TRAF3 Haploinsufficiency
creation_date: "2026-08-26T13:30:00Z"
category: Mendelian
disease_term:
  preferred_term: TRAF3 haploinsufficiency
  term:
    id: MONDO:0100513
    label: TRAF3 haploinsufficiency
synonyms:
- TRAF3 haploinsufficiency syndrome
- immunodeficiency 132b
- IMD132B
description: >-
  An autosomal dominant immune dysregulation syndrome caused by heterozygous
  loss-of-function variants in TRAF3, which halve the amount of TRAF3 protein. Patients
  have recurrent bacterial infection together with autoimmunity, systemic inflammation,
  B cell lymphoproliferation and an increased risk of B cell malignancy - a combination
  that is characteristic of the NF-kB-pathway inborn errors of immunity but is unusual in
  being produced by a gene-dosage effect rather than by a null state.

  TRAF3 is a brake. With TRAF2 and cIAP1/2 it keeps NIK ubiquitinated and degraded, which
  keeps non-canonical NF-kB2 signalling off at rest; engagement of CD40 or BAFF-R
  degrades TRAF3 and releases the brake as a normal part of B cell activation. Halving
  TRAF3 partially releases the brake all the time. What follows is not a failure of B
  cells but their hyperactivity: increased NF-kB2 activation, higher levels of the
  survival proteins Mcl1, Pim2 and c-Myc, raised mitochondrial respiration, and B cells
  that live longer than they should.

  The immunodeficiency is the part that needs explaining, because B cell hyperactivity is
  not an obvious route to failing to clear bacteria. Two things are curated here as
  contributing: a maturation defect - the B cell compartment expands while class-switched
  memory B cells fall - and concurrent T cell dysregulation, with mild CD4+ lymphopenia
  and fewer naive T cells alongside increased regulatory T cells and circulating T
  follicular helper cells.

  Two features of the entry are worth flagging before reading it. First, the
  immunoglobulin phenotype runs in both directions: the founding cohort reported
  hypergammaglobulinemia, while every patient in the later CVID-reanalysis cohort was
  hypogammaglobulinemic and on immunoglobulin replacement. Both are curated. Second, this
  entry is about the loss-of-function form only. A separate, allelic, dominant-negative
  disorder exists and is not the same disease; see the notes.

parents:
- Inborn Errors of Immunity
- Common Variable Immunodeficiency

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Around a dozen patients have been reported: nine individuals from five unrelated
    families in the 2022 founding description, and three more from two families found by
    targeted reanalysis of an 800-patient inborn-errors-of-immunity sequencing cohort in
    2024. That second route is the informative one for prevalence - the patients were
    already in a sequencing dataset under a CVID label, which suggests the reported count
    reflects how hard people have looked rather than how many patients exist.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, in five unrelated families, we describe an immune dysregulation syndrome of
      recurrent bacterial infections, autoimmunity, systemic inflammation, B cell
      lymphoproliferation, and hypergammaglobulinemia.
    explanation: >-
      The size of the founding cohort and the syndrome it defines.
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we conducted a TRAF3-targeted reanalysis of next-generation sequencing data from 800
      patients with inborn errors of immunity
    explanation: >-
      The ascertainment method behind the second cohort, and the reason the case count
      should be read as a floor.

pathophysiology:

- name: Heterozygous TRAF3 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A single TRAF3 allele carries a premature-stop or frameshift variant. Reported alleles
    include the stop-gain variants p.Arg163* and p.Gln407*. The other allele is normal,
    and the variants act by reducing the amount of protein made rather than by producing
    an interfering product - which is what distinguishes this disease from its allelic
    dominant-negative counterpart.
  genetic_context:
    gene:
      preferred_term: TRAF3
      term:
        id: hgnc:12033
        label: TRAF3
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Monoallelic variants reducing TRAF3 expression. Typed LOSS_OF_FUNCTION rather than
      DOMINANT_NEGATIVE deliberately: the reported protein level in these patients is
      consistent with simple loss of one allele's output.
  downstream:
  - target: Reduced TRAF3 Protein Dosage
    causal_link_type: DIRECT
    description: >-
      A premature stop codon removes one allele's contribution to the protein pool.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals each had monoallelic mutations in TRAF3 that reduced TRAF3
      expression.
    explanation: >-
      The genetic lesion and its immediate consequence, stated together, which is the
      whole of what this node claims.
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These individuals harbored stop-gain variants (p.Arg163* and p.Gln407*) and
      experienced recurrent bacterial infections with hypogammaglobulinemia.
    explanation: >-
      Names two specific alleles of the class this node describes.

- name: Reduced TRAF3 Protein Dosage
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The disease is a dosage disease: roughly half the normal amount of TRAF3 protein is
    enough to produce it. That is not obvious a priori for an adaptor whose job is
    constitutive negative regulation, and the mouse work makes the case directly -
    B cell-conditional heterozygous mice have a 40 to 50% reduction in TRAF3 protein and
    mRNA in their B cells and a measurable phenotype at that level, intermediate between
    wild type and complete knockout.

    The node also explains why this pathway is dosage-sensitive at all. TRAF3 is degraded
    as part of normal signalling: CD40 and BAFF-R engagement drives its polyubiquitination
    and proteasomal destruction for hours after the signal. A cell that starts with half
    the protein and then degrades some of it on every activation event has correspondingly
    less brake to spare.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: K48-linked polyubiquitination of TRAF3
    term:
      id: GO:0070936
      label: protein K48-linked ubiquitination
  downstream:
  - target: Non-canonical NF-kB2 Activation
    causal_link_type: DIRECT
    description: >-
      Less TRAF3 means less NIK degradation and more p100 to p52 processing.
  evidence:
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that B-Traf3+/− mice have a 40 to 50% decrease in the amount of TRAF3
      protein and Traf3 mRNA in their B cells
    explanation: >-
      Quantifies the dosage reduction that this node is about, in the model built to
      match the human genotype.
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Signaling through activating receptors CD40 and receptor for BAFF (BAFFR) induces a
      cascade resulting in TRAF3 polyubiquitination and proteasomal degradation, reducing
      levels of TRAF3 protein for hours or more after the signaling event
    explanation: >-
      The physiological turnover that makes a halved starting pool consequential.

- name: Non-canonical NF-kB2 Activation
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    With less TRAF3 to hold NIK down, non-canonical NF-kB2 signalling runs above its
    resting level. Patient B cells show increased NF-kB2 activation directly, and the
    heterozygous mouse shows the same thing alongside the downstream transcriptional
    output - the survival proteins Mcl1, Pim2 and c-Myc and the glycolytic enzyme Hxk2 are
    all significantly more abundant than in wild-type littermates.

    Recorded as INCREASED rather than GAIN_OF_FUNCTION: this is a normally regulated
    pathway running above its set point because a brake is at half strength, not a pathway
    escaping regulation altogether.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: non-canonical NF-kappaB signal transduction
    term:
      id: GO:0038061
      label: non-canonical NF-kappaB signal transduction
    modifier: INCREASED
  downstream:
  - target: B Cell Hyperactivity and Prolonged Survival
    causal_link_type: DIRECT
    description: >-
      NF-kB2 output raises the survival and metabolic proteins that keep B cells alive.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping showed that patients' B cells were dysregulated, exhibiting
      increased nuclear factor-κB 2 activation, elevated mitochondrial respiration, and
      heightened inflammatory responses.
    explanation: >-
      The pathway state measured in patients rather than inferred from the mouse.
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The glycolytic protein Hxk2, NFκB2 p52, Mcl1, c-Myc, and Pim2 were all significantly
      more abundant in Traf3+/− B cells compared to B cells from WT littermates
    explanation: >-
      The transcriptional and metabolic output of the pathway, measured at the
      heterozygous dose.

- name: B Cell Hyperactivity and Prolonged Survival
  role: effector
  biological_scale: CELLULAR
  description: >-
    B cells with reduced TRAF3 survive longer than they should and accumulate. In the
    heterozygous mouse this is visible as increased spleen weight and splenic B cell
    numbers; in the complete B cell knockout the same axis produces lymphoid organ
    enlargement, autoantibodies and lymphoma with age. Patient B cells also show elevated
    mitochondrial respiration, so the survival advantage has a metabolic component and not
    only an anti-apoptotic one.

    IL-6 responsiveness is raised too: heterozygous B cells have higher phospho-STAT3
    Y705 after IL-6 stimulation than wild type, though the difference reached significance
    only at the earliest timepoint - curated at the strength the source states it.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  locations:
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  biological_processes:
  - preferred_term: B cell homeostasis
    term:
      id: GO:0001782
      label: B cell homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Lymphoproliferation, Autoimmunity and Systemic Inflammation
    causal_link_type: DIRECT
    description: >-
      An expanded, long-lived, hyperresponsive B cell pool is the substrate for
      autoantibody production and lymphoid hyperplasia.
  - target: Defective Humoral Defence Against Bacteria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The known intermediate is the maturation defect - class-switched memory B cells fall
      while naive B cells rise - so the compartment expands without producing protective
      antibody. T cell dysregulation contributes in parallel.
  - target: B Cell Malignant Transformation Risk
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic survival signalling is a plausible substrate for transformation, but the
      steps between it and a lymphoma in a haploinsufficient patient have not been
      demonstrated.
  evidence:
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results show that B-Traf3+/− mice have significantly lower TRAF3 protein and
      mRNA levels in B cells, correlating closely with increased spleen weight and splenic
      B cell numbers compared to wild-type (WT) littermate mice.
    explanation: >-
      Ties the dosage reduction to B cell accumulation in the same animals.
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Traf3+/− B cells had elevated pSTAT3 Y705 compared to WT B cells at all time points
      tested, although this increase reached statistical significance only at 15 min after
      IL-6 treatment
    explanation: >-
      The IL-6 hyperresponsiveness, quoted with the source's own qualification about where
      it was significant.

- name: T Cell Compartment Dysregulation
  role: amplifier
  biological_scale: CELLULAR
  description: >-
    TRAF3 haploinsufficiency is not confined to B cells. Patients have mild CD4+ T cell
    lymphopenia with a reduced proportion of naive T cells, and at the same time increased
    regulatory T cells and increased circulating T follicular helper cells. The founding
    study reads this as a contributor to the B cell phenotype - dysregulated T cell help -
    rather than as an independent arm of the disease, and this entry follows that reading.

    It is also the part of the syndrome that the available mouse models do not cover,
    since those are B cell-conditional.
  cell_types:
  - preferred_term: CD4-positive T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: circulating T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  downstream:
  - target: B Cell Hyperactivity and Prolonged Survival
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Increased circulating T follicular helper cells supply more B cell help; the
      founding study names dysregulated T cell help as a likely contributor.
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients had mild CD4+ T cell lymphopenia, with a reduced proportion of naïve T
      cells but increased regulatory T cells and circulating T follicular helper cells.
    explanation: >-
      The T cell findings this node curates, in full.
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced TRAF3 conveys disease risks by driving B cell hyperactivity via intrinsic
      activation of multiple intracellular proinflammatory pathways and increased
      mitochondrial respiration, with a likely contribution from dysregulated T cell help.
    explanation: >-
      PARTIAL because the source itself calls the T cell contribution likely rather than
      established; the edge from this node is typed accordingly.

- name: Lymphoproliferation, Autoimmunity and Systemic Inflammation
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The autoimmune and lymphoproliferative arm of the syndrome: B cell lymphoproliferation,
    autoimmunity and systemic inflammation, reported together in the founding cohort and
    confirmed as a phenotype description in the follow-up study.
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  - preferred_term: spleen
    term:
      id: UBERON:0002106
      label: spleen
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, in five unrelated families, we describe an immune dysregulation syndrome of
      recurrent bacterial infections, autoimmunity, systemic inflammation, B cell
      lymphoproliferation, and hypergammaglobulinemia.
    explanation: >-
      The syndrome definition, from which this node takes its three components.

- name: Defective Humoral Defence Against Bacteria
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The immunodeficiency arm. Recurrent bacterial infection is present in both reported
    cohorts, and in the CVID-reanalysis cohort it came with hypogammaglobulinemia severe
    enough that the patients were on immunoglobulin replacement before their genetic
    diagnosis was made.

    That the same gene dose produces hypergammaglobulinemia in one cohort and
    hypogammaglobulinemia in another is unresolved and is curated as a knowledge gap
    rather than smoothed over.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:39579173
    reference_title: "Heterozygous Predicted Loss-of-function Variants of TRAF3 in Patients with Common Variable Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These individuals harbored stop-gain variants (p.Arg163* and p.Gln407*) and
      experienced recurrent bacterial infections with hypogammaglobulinemia.
    explanation: >-
      The infection phenotype together with the antibody deficiency that accompanies it in
      this cohort.

- name: B Cell Malignant Transformation Risk
  role: outcome
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    An increased risk of B cell malignancy is part of the founding description of the
    syndrome, and the same study found that common TRAF3 variants which also reduce TRAF3
    expression are associated with increased B cell malignancy risk in the general
    population - a dose-response argument from two directions.

    PROVISIONAL because the mechanism connecting a halved TRAF3 dose to a transformed
    clone has not been demonstrated in a patient. What exists is a plausible substrate
    (chronic NF-kB2 and survival-protein signalling), an epidemiological association, a
    mouse in which complete B cell TRAF3 loss produces lymphoma with age, and a naturally
    occurring canine B cell lymphoma in which TRAF3 mutation is common.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:35960817
    reference_title: "Immunodeficiency, autoimmunity, and increased risk of B cell malignancy in humans with TRAF3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      are associated with an increased risk of B cell malignancies, systemic lupus
      erythematosus, higher immunoglobulin levels, and bacterial infections in the wider
      population
    explanation: >-
      The population-level dose-response result that supports the malignancy claim beyond
      the small monogenic cohort.
  - reference: PMID:40773231
    reference_title: "Reduction of TRAF3 by heterozygosity or aging impacts B cell function."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TRAF3-deficient B cells exhibit substantially enhanced survival, which in mice
      results in marked lymphoid organ enlargement, production of autoantibodies, and
      development of B cell lymphomas (BCL) with age
    explanation: >-
      PARTIAL because this is the complete-deficiency mouse, not the heterozygous one; it
      shows where the axis leads at full dose without establishing that it gets there at
      half dose.
  - reference: PMID:25468570
    reference_title: "Genetic inactivation of TRAF3 in canine and human B-cell lymphoma."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      We found mutations affecting TRAF3, which encodes a negative regulator of nuclear
      factor (NF)-κB, to be a common feature of cBCLs, with mutations observed in 44% of
      tumors including a combination of somatic and rare germ-line variants.
    explanation: >-
      PARTIAL and deliberately so: this is naturally occurring canine lymphoma, where the
      variants are largely somatic. It supports TRAF3 loss as a lymphomagenic event, not
      the germline haploinsufficient state as a lymphoma predisposition in humans.


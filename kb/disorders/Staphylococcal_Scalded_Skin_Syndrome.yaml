name: Staphylococcal Scalded Skin Syndrome
creation_date: "2026-08-15T00:00:00Z"
category: Infectious Disease
parents:
- Bacterial Infectious Disease
- Skin Disease
disease_term:
  preferred_term: Staphylococcal Scalded Skin Syndrome
  term:
    id: MONDO:0018181
    label: staphylococcal scalded skin syndrome
synonyms:
- Ritter disease
- SSSS
- Ritter's disease
- pemphigus neonatorum
description: >-
  Staphylococcal scalded skin syndrome (SSSS) is an acute, superficial blistering
  disease in which the pathology is produced entirely at a distance from the
  organism. Toxigenic strains of Staphylococcus aureus colonizing an occult site
  such as the nasopharynx, conjunctiva, umbilicus, or perineum secrete exfoliative
  toxins (ETA, ETB, ETD), glutamate-specific serine proteases that circulate
  hematogenously while the bacterium itself stays put. The toxins hydrolyze a
  single peptide bond in desmoglein 1, a desmosomal cadherin whose adhesive role
  is unshared in the superficial epidermis, causing keratinocytes to separate at
  the stratum granulosum. The result is tender erythroderma, flaccid sterile
  bullae, a positive Nikolsky sign, and sheet-like exfoliation with a scalded
  appearance, characteristically sparing mucous membranes. Because the split is
  intraepidermal and the dermis is untouched, healing is scarless. Disease is
  concentrated in infants and young children, in whom immature renal clearance of
  toxin and absent neutralizing antibody permit toxin to accumulate; adult cases
  cluster in renal failure and immunosuppression. Diagnosis is clinical, with
  frozen-section biopsy reserved for separating SSSS from toxic epidermal
  necrolysis. Treatment is an intravenous anti-staphylococcal beta-lactam plus
  supportive skin, fluid, and thermal care.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Toxigenic strains of Staphylococcus aureus, classically phage group II, that
    carry an exfoliative toxin gene. The eta gene is carried on an integrated
    bacteriophage and etb on a plasmid, so exfoliative capacity is horizontally
    transferable and clonal nursery outbreaks occur. Both methicillin-sensitive
    and methicillin-resistant isolates cause SSSS, with MSSA dominating
    contemporary pediatric series.
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcal scalded skin syndrome is a potentially life-threatening disorder caused most often by a phage group II Staphylococcus aureus infection."
    explanation: >-
      Identifies phage group II Staphylococcus aureus as the usual causative
      organism.
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All S. aureus isolates were methicillin-sensitive."
    explanation: >-
      In an 85-case pediatric cohort every recovered isolate was
      methicillin-sensitive, supporting MSSA predominance.
transmission:
- name: Person-to-Person and Fomite Transmission of Toxigenic S. aureus
  description: >-
    The organism spreads by direct contact and fomites, frequently from
    asymptomatic adult carriers, which is why neonatal nurseries and daycare
    settings are the classic outbreak environments. What disseminates within the
    patient is the toxin, not the bacterium, so blister fluid is sterile and blood
    cultures in children are typically negative.
  evidence:
  - reference: PMID:12093888
    reference_title: "Molecular mechanisms of blister formation in bullous impetigo and staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bullous impetigo due to Staphylococcus aureus is one of the most common bacterial infections of man, and its generalized form, staphylococcal scalded skin syndrome (SSSS), is a frequent manifestation of staphylococcal epidemics in neonatal nurseries."
    explanation: >-
      Documents neonatal nurseries as the setting in which staphylococcal
      epidemics produce SSSS.
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No blood culture was positive for Staphylococcus aureus."
    explanation: >-
      Supports the toxin-mediated, non-bacteremic character of childhood SSSS.
pathophysiology:
- name: Localized S. aureus Colonization and Exfoliative Toxin Production
  biological_scale: ORGANISM
  description: >-
    A toxigenic strain of Staphylococcus aureus colonizes or infects a localized,
    usually occult, site such as the nasopharynx, conjunctiva, umbilicus, throat,
    or perineum, and secretes exfoliative toxin. The exfoliative toxins are
    glutamate-specific serine proteases of the chymotrypsin family; mutating the
    catalytically active serine to alanine abolishes cleavage while leaving
    substrate binding intact, establishing that protease activity, not mere
    binding, is what produces disease.
  molecular_functions:
  - preferred_term: exfoliative toxin serine protease activity
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    modifier: INCREASED
  downstream:
  - target: Hematogenous Toxin Dissemination
    description: >-
      Toxin secreted at the colonized focus enters the circulation and reaches
      distant skin.
    causal_link_type: DIRECT
  - target: Conjunctivitis
    description: >-
      The conjunctiva is one of the occult colonization sites, presenting as a
      prodromal conjunctivitis.
  evidence:
  - reference: PMID:39411997
    reference_title: "Understanding host's response to staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSSS is a blistering skin disease caused by circulating exfoliative toxins (ETs) of Staphylococcus aureus (S. aureus), almost exclusively affecting infants, young children and immunocompromised individuals."
    explanation: >-
      Establishes circulating exfoliative toxins of S. aureus as the proximate
      cause of the blistering disease.
  - reference: PMID:12093888
    reference_title: "Molecular mechanisms of blister formation in bullous impetigo and staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutation of the predicted catalytically active serine to alanine completely inhibits cleavage."
    explanation: >-
      Demonstrates that the serine protease catalytic activity of the toxin is
      required, separating catalysis from substrate recognition.
- name: Hematogenous Toxin Dissemination
  biological_scale: ORGANISM
  description: >-
    Exfoliative toxin travels through the bloodstream from the localized source to
    the entire skin surface, which is why widespread exfoliation coexists with a
    trivial or inapparent primary infection and with sterile blister fluid. What
    disseminates is the toxin, not the bacterium.
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Failure of Toxin Clearance and Neutralization
    description: >-
      Whether circulating toxin accumulates to a disease-producing concentration
      is decided by host clearance capacity.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exfoliative toxins are spread haematogenously from a localized source of infection, causing widespread epidermal damage at distant sites."
    explanation: >-
      Directly states hematogenous dissemination of toxin from a localized focus
      to distant skin.
- name: Failure of Toxin Clearance and Neutralization
  biological_scale: ORGANISM
  description: >-
    Disseminated toxin only produces generalized disease if the host cannot
    clear or neutralize it. Infants have immature renal excretion and low
    anti-toxin antibody titers, and adults who develop SSSS characteristically
    have renal insufficiency or immunosuppression. This node, not toxin potency
    and not the dissemination step, is what explains the age and comorbidity
    distribution of the disease.
  downstream:
  - target: Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
    description: >-
      Toxin that escapes clearance accumulates in the superficial epidermis and
      engages its desmosomal substrate.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39411997
    reference_title: "Understanding host's response to staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the role of S. aureus ETs and site of action are well-described, other host factors such as impaired immune responses to ETs, poor renal clearance and genetic factors are crucial for the onset of and/or the severity of SSSS in children."
    explanation: >-
      Identifies impaired anti-toxin immunity and poor renal clearance as the host
      determinants of disease onset and severity, which is exactly this node.
  - reference: PMID:39411997
    reference_title: "Understanding host's response to staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSSS is a blistering skin disease caused by circulating exfoliative toxins (ETs) of Staphylococcus aureus (S. aureus), almost exclusively affecting infants, young children and immunocompromised individuals."
    explanation: >-
      The near-restriction to infants, young children, and immunocompromised
      individuals is the epidemiological footprint of this clearance node.
- name: Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
  biological_scale: MOLECULAR
  description: >-
    Exfoliative toxin hydrolyzes desmoglein 1 once, after glutamic acid residue
    381, in the linker between extracellular domains 3 and 4. The specificity is
    remarkable on three counts: the substrate is desmoglein 1 and not the closely
    related desmoglein 3 or E-cadherin; ETA, ETB, and ETD all converge on the same
    bond; and cleavage requires the native calcium-stabilized fold of desmoglein
    1, so recognition is conformational rather than purely sequence-based. Loss of
    the desmoglein 1 ectodomain with retention of its endodomain has been
    confirmed in skin biopsies from patients, not only in vitro.
  genes:
  - preferred_term: DSG1
    term:
      id: hgnc:3048
      label: DSG1
  cell_types:
  - preferred_term: stratum granulosum keratinocyte
    term:
      id: CL:0000712
      label: stratum granulosum cell
  biological_processes:
  - preferred_term: desmoglein 1 proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  downstream:
  - target: Plakoglobin Sequestration by Truncated Desmoglein 1
    description: >-
      The truncated desmoglein 1 stump left behind by cleavage remains bound to
      plakoglobin.
    causal_link_type: DIRECT
  - target: Granular-Layer Acantholysis and Intraepidermal Split
    description: >-
      Loss of desmoglein 1 adhesive function separates keratinocytes at the level
      where desmoglein 1 is the non-redundant adhesion molecule.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12093888
    reference_title: "Molecular mechanisms of blister formation in bullous impetigo and staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that these toxins act as serine proteases with extremely focused molecular specificity to cleave mouse and human desmoglein 1 (Dsg1) once after glutamic acid residue 381 between extracellular domains 3 and 4."
    explanation: >-
      Defines the single cleaved peptide bond and its position within the
      desmoglein 1 ectodomain.
  - reference: PMID:11062541
    reference_title: "Toxin in bullous impetigo and staphylococcal scalded-skin syndrome targets desmoglein 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show here that exfoliative toxin A cleaved mouse and human Dsg1, but not closely related cadherins such as Dsg3."
    explanation: >-
      Establishes the substrate exclusivity of exfoliative toxin A for desmoglein
      1 over desmoglein 3.
  - reference: PMID:11982763
    reference_title: "Staphylococcal exfoliative toxin B specifically cleaves desmoglein 1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings demonstrate that exfoliative toxin A and exfoliative toxin B cause blister formation in staphylococcal scalded skin syndrome and bullous impetigo by identical molecular pathophysiologic mechanisms."
    explanation: >-
      Shows exfoliative toxin B converges on the same desmoglein 1 mechanism as
      exfoliative toxin A.
  - reference: PMID:12880431
    reference_title: "Calcium-dependent conformation of desmoglein 1 is required for its cleavage by exfoliative toxin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that the specificity of exfoliative toxin cleavage of desmoglein 1 resides not only in simple amino acid sequences but also in its calcium-dependent conformation."
    explanation: >-
      Establishes that the toxin requires the calcium-stabilized native
      conformation of desmoglein 1, not just its sequence.
  - reference: PMID:20558334
    reference_title: "Staphylococcal scalded skin syndrome: loss of desmoglein 1 in patient skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The different biopsies demonstrated the loss of the ectodomain of desmoglein 1 to different degrees. The endodomain of desmoglein 1 meanwhile remained present."
    explanation: >-
      Confirms in patient skin that the lesion is selective removal of the
      desmoglein 1 ectodomain with the endodomain retained.
- name: Plakoglobin Sequestration by Truncated Desmoglein 1
  biological_scale: MOLECULAR
  description: >-
    Cleavage is not the whole story, because the stump is not inert. The
    ectodomain-truncated desmoglein 1 stays anchored in the membrane and remains
    bound to its catenin partner plakoglobin. Uncoupling the truncated cadherin
    from plakoglobin by point mutation removes its pathogenic effect entirely,
    which is what makes the sequestration itself, rather than merely the loss of
    the ectodomain, a causal step.
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  downstream:
  - target: Desmosomal Cadherin Destabilization
    description: >-
      Sequestered plakoglobin is unavailable to its normal partners, lowering the
      levels of the other desmosomal cadherins in a dose-dependent manner.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21075858
    reference_title: "Plakoglobin rescues adhesive defects induced by ectodomain truncation of the desmosomal cadherin desmoglein 1: implications for exfoliative toxin-mediated skin blistering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, we demonstrate that truncated Dsg1 remains associated with its catenin partner, plakoglobin, and causes a reduction in the levels of endogenous desmosomal cadherins in a dose-dependent manner, leading us to hypothesize that plakoglobin sequestration by truncated Dsg1 destabilizes other cadherins."
    explanation: >-
      Documents that the truncated cadherin remains bound to plakoglobin, which is
      this node.
  - reference: PMID:21075858
    reference_title: "Plakoglobin rescues adhesive defects induced by ectodomain truncation of the desmosomal cadherin desmoglein 1: implications for exfoliative toxin-mediated skin blistering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Accordingly, a triple-point mutant of the ectodomain-deleted cadherin, which is uncoupled from plakoglobin, does not impair adhesion, indicating that this interaction is essential to the pathogenic potential of truncated Dsg1."
    explanation: >-
      Uncoupling the truncated cadherin from plakoglobin abolishes its pathogenic
      effect, establishing the sequestration step as causally required.
- name: Desmosomal Cadherin Destabilization
  biological_scale: CELLULAR
  description: >-
    Levels of the endogenous desmosomal cadherins fall, so the desmosome fails by
    two routes at once: direct loss of desmoglein 1 adhesion and collateral
    depletion of its partners. Raising plakoglobin levels restores cadherin
    expression, desmosome organization, and functional adhesion, and histone
    deacetylase inhibition does the same by upregulating the cadherins directly,
    which is what shows this depletion is a required step rather than a bystander
    finding.
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  biological_processes:
  - preferred_term: desmosome disassembly
    term:
      id: GO:0035921
      label: desmosome disassembly
    modifier: INCREASED
  downstream:
  - target: Granular-Layer Acantholysis and Intraepidermal Split
    description: >-
      Depletion of desmosomal cadherins compounds the direct adhesive loss and
      reduces the mechanical integrity of the keratinocyte sheet.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21075858
    reference_title: "Plakoglobin rescues adhesive defects induced by ectodomain truncation of the desmosomal cadherin desmoglein 1: implications for exfoliative toxin-mediated skin blistering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, we demonstrate that increasing plakoglobin levels rescues cadherin expression, desmosome organization, and functional adhesion in cells expressing Delta381-Dsg1 or treated with exfoliative toxin A."
    explanation: >-
      Rescue by plakoglobin supplementation restores cadherin expression and
      functional adhesion, establishing the depletion as causally required.
  - reference: PMID:21075858
    reference_title: "Plakoglobin rescues adhesive defects induced by ectodomain truncation of the desmosomal cadherin desmoglein 1: implications for exfoliative toxin-mediated skin blistering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we report that histone deacetylase inhibition up-regulates desmosomal cadherins and prevents the loss of adhesion induced by Dsg1 truncation."
    explanation: >-
      A second, independent route to restoring cadherin levels prevents the
      adhesion loss, corroborating the same causal step.
- name: Granular-Layer Acantholysis and Intraepidermal Split
  biological_scale: TISSUE
  description: >-
    Keratinocytes lose contact with one another precisely at the stratum
    granulosum, just beneath the stratum corneum, producing an acantholytic
    intraepidermal split. The level is set by desmoglein compensation: desmoglein
    3 is co-expressed with desmoglein 1 in the deeper epidermis and throughout
    mucosa and preserves adhesion there, so only the superficial epidermis, where
    desmoglein 1 is unshared, comes apart. This is why mucous membranes are
    spared, and it is the reason SSSS and pemphigus foliaceus are histologic
    mirror images. Notably the split is pure adhesive failure, with no necrotic
    keratinocytes and little or no inflammatory infiltrate, which is the
    histologic distinction from toxic epidermal necrolysis.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: keratinocyte cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  locations:
  - preferred_term: stratum granulosum of epidermis
    term:
      id: UBERON:0002069
      label: stratum granulosum of epidermis
  downstream:
  - target: Epidermal Barrier Failure and Systemic Complications
    description: >-
      Sheet-like separation of the superficial epidermis removes the outer
      barrier.
    causal_link_type: DIRECT
  - target: Skin Detachment
    description: Acantholysis produces sheet-like detachment of superficial skin.
  - target: Abnormal Blistering of the Skin
    description: The intraepidermal split fills to form flaccid, sterile bullae.
  - target: Acantholysis
    description: >-
      Loss of keratinocyte cohesion at the granular layer is the defining
      histologic finding.
  - target: Erythroderma
    description: >-
      Widespread involvement of the superficial epidermis produces diffuse tender
      erythema.
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, the superficial epidermis is detached, the separation level being at the granular layer."
    explanation: >-
      Locates the plane of separation at the granular layer in patient
      histopathology.
  - reference: PMID:11062541
    reference_title: "Toxin in bullous impetigo and staphylococcal scalded-skin syndrome targets desmoglein 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This unique proteolytic attack on the desmosome causes a blister just below the stratum corneum, which forms the epidermal barrier, presumably allowing the bacteria in bullous impetigo to proliferate and spread beneath this barrier."
    explanation: >-
      Connects desmosomal proteolysis to a blister immediately beneath the
      stratum corneum.
- name: Epidermal Barrier Failure and Systemic Complications
  biological_scale: ORGANISM
  description: >-
    Loss of the superficial epidermis strips the skin of its permeability and
    thermal barrier. Denuded skin loses fluid and heat, so dehydration,
    electrolyte derangement, and hypothermia follow, particularly in neonates, and
    the breach permits secondary bacterial invasion progressing to sepsis and
    pneumonia. Because the dermis is untouched, the barrier reconstitutes and
    healing is scarless, and contemporary treated pediatric cohorts report severe
    complications in a small minority and essentially no deaths.
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  downstream:
  - target: Dehydration
    description: Transepidermal fluid loss through denuded skin.
  - target: Hyponatremia
    description: >-
      Electrolyte loss accompanies the transepidermal fluid loss.
  - target: Hypothermia
    description: Loss of the thermal barrier, most consequential in neonates.
  - target: Sepsis
    description: Secondary bacterial invasion through the breached barrier.
  - target: Pneumonia
    description: >-
      Secondary infection is a recognized complication of the barrier breach.
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sepsis and pneumonia are the most feared complications."
    explanation: >-
      Names sepsis and pneumonia as the principal systemic complications of the
      barrier breach.
  - reference: PMID:40898255
    reference_title: "Staphylococcical scalded skin syndrome: a case series description of a rare and critical disease in a tertiary pediatric center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe complications were seen in three cases (14.3%): one with severe dehydration with hyponatremia, one with sepsis and the last with Herpes Simplex Virus 1 (HSV1) infection."
    explanation: >-
      Documents dehydration with hyponatremia and sepsis as the observed severe
      complications in a contemporary pediatric cohort.
- name: Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    Peptidoglycan cross-linking by staphylococcal penicillin-binding proteins is
    the target of the anti-staphylococcal beta-lactams that are first-line here.
    Beta-lactam acylation of the penicillin-binding protein active site halts
    cross-linking and is bactericidal, which removes the organism producing the
    toxin. It does nothing to circulating toxin already released, which is why
    exfoliation continues briefly after treatment starts.
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
    modifier: DECREASED
  downstream:
  - target: Localized S. aureus Colonization and Exfoliative Toxin Production
    description: >-
      Cell-envelope integrity maintained by peptidoglycan cross-linking is
      required for the colonizing organism to persist and keep secreting toxin,
      which is why inhibiting this step ends toxin production at source.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29508362
    reference_title: "Staphylococcal-scalded skin syndrome: evaluation, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prompt empiric treatment with intravenous anti-staphylococcal antibiotic such as nafcillin, oxacillin, or flucloxacillin is essential until cultures are available to guide therapy."
    explanation: >-
      Establishes the anti-staphylococcal beta-lactams as first-line empiric
      therapy, which is what makes this their target node in this disease. The
      penicillin-binding-protein mechanism itself is carried by the conformed
      module rather than re-derived here.
- name: Staphylococcal mRNA Translation by the Ribosome (Clindamycin Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    Bacterial ribosomal translation is the target of clindamycin, added here on
    the theory that suppressing protein synthesis suppresses exfoliative toxin
    output. Clindamycin resistance encountered in this setting has been
    inducible, macrolide-induced, rather than constitutive.
  biological_processes:
  - preferred_term: bacterial translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  downstream:
  - target: Suppression of Exfoliative Toxin Synthesis
    description: >-
      Ribosomal inhibition is expected to reduce synthesis of secreted toxin as
      well as of structural protein.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of those found resistant to clindamycin (36%), all demonstrated macrolide-induced clindamycin resistance. None were constitutively resistant to clindamycin."
    explanation: >-
      Characterizes the resistance encountered at this drug target in SSSS
      isolates as inducible rather than constitutive.
- name: Suppression of Exfoliative Toxin Synthesis
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Suppression of Toxin and Exoprotein Synthesis"
  description: >-
    The anti-toxin rationale for adjunctive clindamycin, curated here because the
    mechanism is coherent and the clinical test of it is negative. Adding
    clindamycin does not shorten hospitalization and does not improve outcome in
    SSSS, and current evidence favors beta-lactam monotherapy. This node exists
    to hold that null result against its mechanism rather than to endorse the
    therapy: a pretty mechanism should not launder a negative trial.
  evidence:
  - reference: PMID:33283348
    reference_title: "Staphylococcal scalded skin syndrome: An epidemiological and clinical review of 84 cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Addition of clindamycin as an anti-toxin agent had no effect on the duration of hospitalization, and this should be further investigated."
    explanation: >-
      Directly refutes a clinical benefit from the anti-toxin rationale, in the
      authors' own framing of clindamycin as an anti-toxin agent.
  - reference: PMID:40650480
    reference_title: "Pediatric Staphylococcal Scalded Skin Syndrome: A Systematic Review of the Literature to Inform Work-Up and Management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings suggest that clindamycin does not improve outcomes in SSSS, supporting beta-lactam antibiotics as a preferred first-line treatment."
    explanation: >-
      Systematic review reaching the same negative conclusion about the anti-toxin
      strategy in this disease.
phenotypes:
- name: Erythroderma
  category: Clinical
  description: >-

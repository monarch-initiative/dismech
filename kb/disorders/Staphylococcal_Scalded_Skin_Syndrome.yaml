diagnosis:
- name: Clinical Diagnosis
  description: >-
    Diagnosis rests on the clinical picture of tender erythroderma, flaccid bullae,
    sheet-like desquamation with a positive Nikolsky sign, periorificial crusting,
    and absent mucosal involvement in a young child. Contemporary evidence argues
    actively against reflexive laboratory testing: blood counts, chemistry panels,
    and inflammatory markers are non-specific and do not improve diagnostic
    accuracy.
  evidence:
  - reference: PMID:40650480
    reference_title: "Pediatric Staphylococcal Scalded Skin Syndrome: A Systematic Review of the Literature to Inform Work-Up and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory evaluations, including blood counts, chemistry panels, and inflammatory markers, were found to be non-specific and did not enhance diagnostic accuracy or inform patient care."
    explanation: >-
      Systematic review finds ancillary laboratory testing non-contributory to
      diagnosis.
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ancillary testing does not improve diagnostic precision and can be reduced."
    explanation: >-
      Retrospective cohort concludes ancillary testing does not improve diagnostic
      precision.
- name: Culture of the Source Focus
  description: >-
    Culture should target the occult colonized focus rather than the blister.
    Periorificial swabs of the nares, throat, conjunctiva, umbilicus, and perineum
    outperform blister fluid, which is sterile, and blood cultures are typically
    negative in children. Real-time PCR on vesicle fluid adds yield where culture
    is negative.
  evidence:
  - reference: PMID:33283348
    reference_title: "Staphylococcal scalded skin syndrome: An epidemiological and clinical review of 84 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcus aureus was more commonly isolated from periorificial cultures than from bullae."
    explanation: >-
      Establishes periorificial sites as the higher-yield culture target compared
      with bullae.
  - reference: PMID:40898255
    reference_title: "Staphylococcical scalded skin syndrome: a case series description of a rare and critical disease in a tertiary pediatric center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "S. aureus was detected by culture from skin lesions in nine cases (42.9%), by real-time polymerase chain reaction (RT-PCR) assay on vesicle fluid in seven (33%), and by throat culture in one (4.7%)."
    explanation: >-
      Quantifies the yield of culture and of RT-PCR on vesicle fluid in a
      contemporary cohort.
- name: Skin Biopsy with Frozen Section
  description: >-
    Frozen-section histopathology is the fast discriminator from toxic epidermal
    necrolysis. In SSSS the split is intraepidermal at the granular layer with no
    necrotic keratinocytes and a normal dermis; in toxic epidermal necrolysis the
    separation is at the dermal-epidermal junction with full-thickness
    keratinocyte necrosis.
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be confirmed by a skin biopsy specimen, which can be expedited by frozen section processing, as staphylococcal scalded skin syndrome should be distinguished from life threatening toxic epidermal necrolysis."
    explanation: >-
      Establishes frozen-section biopsy as the means of separating SSSS from toxic
      epidermal necrolysis.
treatments:
- name: Anti-Staphylococcal Beta-Lactam Therapy
  description: >-
    Prompt intravenous anti-staphylococcal beta-lactam therapy is first line.
    Nafcillin, oxacillin, flucloxacillin, or a first-generation cephalosporin such
    as cefazolin are used empirically until susceptibilities are available. Note
    that antibiotics stop further toxin production but neither neutralize
    circulating toxin nor reverse desmoglein 1 that has already been cleaved, so
    exfoliation may continue briefly after treatment begins and should not be read
    as treatment failure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: oxacillin
      term:
        id: CHEBI:7809
        label: oxacillin
    - preferred_term: nafcillin
      term:
        id: CHEBI:7447
        label: nafcillin
    - preferred_term: flucloxacillin
      term:
        id: CHEBI:5098
        label: flucloxacillin
    - preferred_term: cefazolin
      term:
        id: CHEBI:474053
        label: cefazolin
  target_mechanisms:
  - target: Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: >-
      Beta-lactam acylation of the penicillin-binding protein active site halts
      peptidoglycan cross-linking and is bactericidal.
  evidence:
  - reference: PMID:40650480
    reference_title: "Pediatric Staphylococcal Scalded Skin Syndrome: A Systematic Review of the Literature to Inform Work-Up and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Findings suggest that clindamycin does not improve outcomes in SSSS, supporting beta-lactam antibiotics as a preferred first-line treatment."
    explanation: >-
      Systematic review supports beta-lactam antibiotics as preferred first-line
      therapy.
  - reference: PMID:40898255
    reference_title: "Staphylococcical scalded skin syndrome: a case series description of a rare and critical disease in a tertiary pediatric center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Drug susceptibility tests ruled out resistance and all children received intravenous (IV) antibiotics: oxacillin in 76% of patients, while teicoplanin and clindamycin in 19%."
    explanation: >-
      Documents oxacillin as the dominant real-world first-line agent in a
      contemporary cohort.
- name: Vancomycin for Suspected MRSA
  description: >-
    Vancomycin is substituted where methicillin-resistant S. aureus is suspected,
    in critically ill patients, or in communities with high MRSA prevalence. Most
    contemporary pediatric series nonetheless recover only methicillin-sensitive
    isolates.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
  target_mechanisms:
  - target: Peptidoglycan Cross-Linking by Penicillin-Binding Proteins (Beta-Lactam Target)
    treatment_effect: INHIBITS
    description: >-
      Vancomycin blocks the same cross-linking step from the substrate side,
      binding the D-Ala-D-Ala terminus rather than the enzyme, which is why it
      remains effective when penicillin-binding protein alteration confers
      methicillin resistance.
  evidence:
  - reference: PMID:29508362
    reference_title: "Staphylococcal-scalded skin syndrome: evaluation, diagnosis, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the patient is not improving, critically ill, or in communities where the prevalence of methicillin-resistant S. aureus is high, vancomycin should be used."
    explanation: >-
      States the indications for substituting vancomycin for a beta-lactam.
- name: Adjunctive Clindamycin
  description: >-
    Clindamycin has been added on the theory that ribosomal inhibition suppresses
    exfoliative toxin synthesis. The mechanistic rationale is sound but the
    clinical result is null: adding clindamycin does not shorten hospitalization or
    improve outcome, and current evidence favors beta-lactam monotherapy. Where
    clindamycin resistance is found in this setting it has been inducible rather
    than constitutive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clindamycin
      term:
        id: CHEBI:3745
        label: clindamycin
  target_mechanisms:
  - target: Staphylococcal mRNA Translation by the Ribosome (Clindamycin Target)
    treatment_effect: INHIBITS
    description: >-
      Clindamycin inhibits bacterial ribosomal translation. The intended
      downstream consequence, suppression of exfoliative toxin synthesis, is
      curated with its negative clinical result attached.
  evidence:
  - reference: PMID:33283348
    reference_title: "Staphylococcal scalded skin syndrome: An epidemiological and clinical review of 84 cases."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No difference was found in admission duration between children receiving clindamycin and those that did not (3.6 ± 2.2 vs 3.9 ± 2.34 days, P = .63)."
    explanation: >-
      Directly refutes a length-of-stay benefit from adjunctive clindamycin.
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Clindamycin does not improve patient outcomes, suggesting beta-lactams should be considered first line."
    explanation: >-
      Independent cohort reaches the same negative conclusion about clindamycin.
  - reference: PMID:36440996
    reference_title: "Staphylococcal scalded skin syndrome: Clinical features, ancillary testing, and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of those found resistant to clindamycin (36%), all demonstrated macrolide-induced clindamycin resistance. None were constitutively resistant to clindamycin."
    explanation: >-
      Characterizes the clindamycin resistance encountered in SSSS isolates as
      inducible rather than constitutive.
- name: Fluid Resuscitation and Supportive Skin Care
  description: >-
    Intravenous fluid replacement for children unable to maintain oral intake,
    bland emollients and non-adherent dressings for the denuded skin, analgesia,
    and attention to thermoregulation. Two negatives matter as much as the
    positives: surgical debridement is harmful and should be avoided, and silver
    sulfadiazine is avoided because of systemic absorption across denuded skin.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  evidence:
  - reference: PMID:40650480
    reference_title: "Pediatric Staphylococcal Scalded Skin Syndrome: A Systematic Review of the Literature to Inform Work-Up and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fluid resuscitation was necessary for children unable to maintain oral intake, and bland emollients were effective for skin care."
    explanation: >-
      Supports fluid resuscitation and bland emollients as the supportive-care
      backbone.
  - reference: PMID:33283348
    reference_title: "Staphylococcal scalded skin syndrome: An epidemiological and clinical review of 84 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin debridement was the only risk factor leading to more complications and prolonged hospitalization (P = .03)."
    explanation: >-
      Identifies debridement as an iatrogenic harm, supporting its avoidance in
      supportive care.
- name: Intravenous Immunoglobulin
  description: >-
    Intravenous immunoglobulin was historically recommended on the rationale of
    supplying neutralizing anti-toxin antibody, but its use has since been
    associated with prolonged hospitalization and it is rarely given in
    contemporary practice. The association may reflect confounding by severity, so
    this is an equivocal rather than a refuted therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, intravenous immunoglobulin had been recommended to combat Staphylococcal scalded skin syndrome, but a recent study associates its use with prolonged hospitalization."
    explanation: >-
      Records both the historical recommendation and the observational signal
      against it. PARTIAL because an observational association with longer stay
      does not establish lack of benefit.
  - reference: PMID:40898255
    reference_title: "Staphylococcical scalded skin syndrome: a case series description of a rare and critical disease in a tertiary pediatric center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one patient was treated with IV immunoglobulin."
    explanation: >-
      Confirms that intravenous immunoglobulin is now used in only a small
      minority of cases.

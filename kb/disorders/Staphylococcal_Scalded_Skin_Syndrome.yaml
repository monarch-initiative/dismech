    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSSS usually presents with a prodrome of sore throat or conjunctivitis."
    explanation: >-
      Documents the prodromal sore throat or conjunctivitis that precedes the
      cutaneous phase.
- phase: Exfoliative Generalization
  duration: within 48 hours
  notes: >-
    Abrupt diffuse tender erythema with fever, followed by flaccid
    Nikolsky-positive bullae and sheet-like exfoliation, typically flexural first
    and often with periorificial crusting.
  evidence:
  - reference: PMID:12627992
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extremely tender flaccid bullae, which are Nikolsky sign-positive, develop within 48 hours and commonly affect the flexures; occasionally, large areas of the skin may be involved."
    explanation: >-
      Gives the 48-hour window to generalized flaccid Nikolsky-positive bullae.
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Staphylococcal scalded skin syndrome tends to appear abruptly with diffuse erythema and fever."
    explanation: >-
      Confirms the abrupt onset with diffuse erythema and fever.
- phase: Desquamation and Recovery
  duration: 1 to 2 weeks
  notes: >-
    Under treatment the course is monophasic and self-limited, with desquamation
    and scarless healing because the dermis is never involved. Median inpatient
    stays of roughly 3 to 8 days are reported across cohorts. Recurrence is very
    rare, consistent with durable anti-toxin antibody after exposure.
  evidence:
  - reference: PMID:40898255
    reference_title: "Staphylococcical scalded skin syndrome: a case series description of a rare and critical disease in a tertiary pediatric center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median hospitalization length was 7.8 days (IQR 5-9). All our cases had a favorable outcome."
    explanation: >-
      Quantifies hospitalization duration and universal favorable outcome in a
      contemporary pediatric series.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden differs sharply by age. In children, hospitalization is the norm, with a
    mean stay of about 3 days in US inpatient data, 4.7 days in a Toronto cohort,
    and a median of 7.8 days in an Italian tertiary series, but severe
    complications occurred in only 5% of 84 Toronto patients with no deaths, and US
    inpatient mortality in children with SSSS was no different from children
    without it. Reported adult case-fatality is far higher, but this is an observed
    rate in a small, heavily selected group defined by renal failure and
    immunosuppression, and should not be read as a mechanistic property of the
    disease.
  evidence:
  - reference: PMID:29077993
    reference_title: Epidemiology of staphylococcal scalded skin syndrome in U.S. children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Crude inpatient mortality rates (with 95% confidence intervals) were similar for children with vs. without SSSS (0·33%, 0·00-0·79% vs. 0·36%, 0·34-0·39%)."
    explanation: >-
      Shows no excess inpatient mortality in US children hospitalized with SSSS.
  - reference: PMID:33283348
    reference_title: "Staphylococcal scalded skin syndrome: An epidemiological and clinical review of 84 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe complications were seen in 4 (5%) cases, and no fatalities were observed."
    explanation: >-
      Quantifies the low severe-complication rate and absence of deaths in a
      modern pediatric cohort.
  - reference: PMID:12627992
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas mortality in childhood SSSS is approximately 4%, the mortality rate in adults is reported to be greater than 60%."
    explanation: >-
      Reports the child-versus-adult case-fatality contrast. PARTIAL because the
      adult figure comes from a small selected series and is confounded by the
      comorbidity that predisposes adults to SSSS in the first place.
differential_diagnoses:
- name: Toxic Epidermal Necrolysis
  description: >-
    The critical differential, and the reason frozen-section biopsy exists in this
    workflow. Toxic epidermal necrolysis is typically drug-triggered, involves
    mucous membranes, and separates at the dermal-epidermal junction with
    full-thickness keratinocyte necrosis, whereas SSSS spares mucosa and splits
    intraepidermally at the granular layer without necrotic keratinocytes.
  distinguishing_features:
  - Mucous membrane involvement is present in toxic epidermal necrolysis and absent
    in SSSS
  - Split is subepidermal with keratinocyte necrosis rather than intragranular
    acantholysis
  - Drug exposure rather than staphylococcal colonization is the usual trigger
  evidence:
  - reference: PMID:24841497
    reference_title: "Staphylococcal scalded skin syndrome: diagnosis and management in children and adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis can be confirmed by a skin biopsy specimen, which can be expedited by frozen section processing, as staphylococcal scalded skin syndrome should be distinguished from life threatening toxic epidermal necrolysis."
    explanation: >-
      Identifies toxic epidermal necrolysis as the differential that biopsy is
      used to exclude.
- name: Bullous Impetigo
  description: >-
    The localized form of the same disease, caused by the same exfoliative toxins
    acting at the site of colonization rather than after hematogenous spread. The
    molecular lesion is identical; the difference is the distribution of the toxin.
  distinguishing_features:
  - Lesions are localized to the site of infection rather than generalized
  - Bacteria are recoverable from the blister rather than the blister being sterile
  evidence:
  - reference: PMID:12093888
    reference_title: "Molecular mechanisms of blister formation in bullous impetigo and staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Bullous impetigo due to Staphylococcus aureus is one of the most common bacterial infections of man, and its generalized form, staphylococcal scalded skin syndrome (SSSS), is a frequent manifestation of staphylococcal epidemics in neonatal nurseries."
    explanation: >-
      States the localized-versus-generalized relationship between bullous impetigo
      and SSSS.
- name: Pemphigus Foliaceus
  description: >-
    A near-perfect mechanistic mirror image: the same molecule, desmoglein 1, is
    disabled by autoantibody rather than by bacterial protease, producing the same
    granular-layer split and the same histology. Distinguished by direct
    immunofluorescence and circulating anti-desmoglein 1 autoantibodies, and by a
    chronic rather than acute course.
  distinguishing_features:
  - Circulating anti-desmoglein 1 autoantibodies with positive direct
    immunofluorescence
  - Chronic relapsing course rather than an acute monophasic illness
  - No staphylococcal focus and no response to antistaphylococcal antibiotics
  evidence:
  - reference: PMID:11062541
    reference_title: "Toxin in bullous impetigo and staphylococcal scalded-skin syndrome targets desmoglein 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Desmoglein (Dsg) 1, a desmosomal cadherin that mediates cell-cell adhesion, may be the target of exfoliative toxin A, because it is the target of autoantibodies in pemphigus foliaceus, in which blisters form with identical tissue specificity and histology."
    explanation: >-
      States that pemphigus foliaceus targets the same molecule and produces
      identical tissue specificity and histology.
- name: SAM Syndrome and Striate Palmoplantar Keratoderma
  description: >-
    The genetic counterpart to the enzymatic lesion. Biallelic loss-of-function
    variants in DSG1 cause severe dermatitis, multiple allergies, and metabolic
    wasting, and heterozygous variants cause striate palmoplantar keratoderma. The
    same protein destroyed genetically gives chronic barrier disease with allergy,
    whereas acute enzymatic removal of its ectodomain gives reversible exfoliation,
    which is why these should never be conflated.
  distinguishing_features:
  - Congenital or early-onset chronic course rather than an acute febrile illness
  - Germline biallelic DSG1 variants identified on molecular testing
  - Allergy and metabolic wasting rather than sheet-like exfoliation
  evidence:
  - reference: PMID:23974871
    reference_title: "Desmoglein 1 deficiency results in severe dermatitis, multiple allergies and metabolic wasting."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a new syndrome featuring severe dermatitis, multiple allergies and metabolic wasting (SAM syndrome) caused by homozygous mutations in DSG1."
    explanation: >-
      Establishes the distinct genetic disease caused by loss of the same
      desmoglein 1 protein.
animal_models:
- name: Neonatal mouse exfoliative toxin injection model
  species: Mouse
  description: >-
    Subcutaneous injection of purified or recombinant exfoliative toxin into
    neonatal mice reproduces the superficial exfoliation with granular-layer
    splitting, and is the assay by which every exfoliative toxin serotype has been
    validated. It is a faithful model of the effector step and a poor model of the
    natural history, because the toxin is injected rather than produced by a
    colonizing organism and cleared renally.
  publication: PMID:11062541
  modeled_mechanisms:
  - target: Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Injected toxin cleaves desmoglein 1 in mouse skin and abolishes its cell
      surface staining without affecting desmoglein 3 or E-cadherin.
    limitations: >-
      The model bypasses colonization, hematogenous dissemination, and renal
      clearance entirely, so it cannot address the age-dependent host factors that
      determine who develops generalized disease. Mouse desmoglein 1 exists as
      several isoforms with differing susceptibility to cleavage, so isoform choice
      affects the result.
    readouts:
    - name: Cell surface desmoglein 1 staining in neonatal mouse epidermis
      target: Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
      direction: ABOLISHED
      interpretation: >-
        Loss of desmoglein 1 surface staining is the direct structural correlate of
        toxin-mediated cleavage.
      evidence:
      - reference: PMID:11982763
        reference_title: "Staphylococcal exfoliative toxin B specifically cleaves desmoglein 1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exfoliative toxin B injected in neonatal mice caused superficial epidermal blisters, abolished cell surface staining of desmoglein 1, and degraded desmoglein 1 without affecting desmoglein 3 or E-cadherin."
        explanation: >-
          Reports abolished desmoglein 1 surface staining together with preserved
          desmoglein 3 and E-cadherin in injected neonatal mice.
    evidence:
    - reference: PMID:11062541
      reference_title: "Toxin in bullous impetigo and staphylococcal scalded-skin syndrome targets desmoglein 1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate this specific cleavage in cell culture, in neonatal mouse skin and with recombinant Dsg1, and conclude that Dsg1 is the specific receptor for exfoliative toxin A cleavage."
      explanation: >-
        Establishes neonatal mouse skin as one of the systems in which the cleavage
        mechanism was demonstrated.
- name: Porcine exudative epidermitis (Staphylococcus hyicus)
  species: Pig
  description: >-
    Exudative epidermitis, or greasy pig disease, is the naturally occurring animal
    counterpart of SSSS. Staphylococcus hyicus exfoliative toxins digest swine
    desmoglein 1 by the same calcium-dependent mechanism, making this a genuine
    natural-disease model rather than an engineered one.
  publication: PMID:16238811
  modeled_mechanisms:
  - target: Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Staphylococcus hyicus exfoliative toxin isoforms directly digest swine
      desmoglein 1, and calcium removal abolishes proteolysis exactly as it does
      for the human toxins.
    limitations: >-
      A different bacterial species and toxin family acting on swine rather than
      human desmoglein 1, so it corroborates the mechanistic logic rather than
      modeling human SSSS directly. Clinical severity and systemic course in
      piglets differ from the human disease.
    evidence:
    - reference: PMID:16238811
      reference_title: Cloning of swine desmoglein 1 and its direct proteolysis by Staphylococcus hyicus exfoliative toxins isolated from pigs with exudative epidermitis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Recognition and digestion of calcium-stabilized structure on the extracellular domains of swine Dsg1 by Exhs indicated that EE shares similar molecular pathophysiological mechanisms of intra-epidermal splitting with SSSS in humans."
      explanation: >-
        States that porcine exudative epidermitis shares the intra-epidermal
        splitting mechanism with human SSSS.
discussions:
- discussion_id: ssss_superantigen_hypothesis
  kind: CONTROVERSY
  prompt: >-
    Do the exfoliative toxins contribute to SSSS through superantigen activity in
    addition to their desmoglein 1 protease activity?
  attaches_to:
  - pathophysiology#Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
  rationale: >-
    The exfoliative toxins were historically debated as either specific proteases
    or superantigens. The protease account is now firmly established at the
    molecular level, and the lesional histology argues against a T-cell-driven
    contribution, since SSSS lesions are strikingly non-inflammatory with sparse to
    absent leukocyte infiltrate. The superantigen arm is therefore recorded here as
    a non-canonical historical alternative rather than as part of the causal chain,
    and it is deliberately not modeled as a pathophysiology node.
- discussion_id: ssss_desmocollin_1_alternative_target
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is desmoglein 1 the only desmosomal cadherin whose cleavage can produce the
    SSSS phenotype?
  attaches_to:
  - pathophysiology#Calcium-Dependent Recognition and Proteolytic Cleavage of Desmoglein 1
  rationale: >-
    In a series of patient biopsies confirming loss of the desmoglein 1 ectodomain,
    one patient instead showed loss of desmocollin 1, another desmosomal cadherin.
    If reproducible, this would mean the clinical phenotype has more than one
    molecular route, and possibly more than one causative toxin or organism. The
    observation is a single patient and has not been replicated.
  evidence:
  - reference: PMID:20558334
    reference_title: "Staphylococcal scalded skin syndrome: loss of desmoglein 1 in patient skin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most remarkably, in one of our patients, the immunofluorescent analysis demonstrated that not desmoglein1 but desmocollin 1, another desmosomal cadherin, became affected. This raises the question if other toxins and/or other bacteria than Staphylococcus aureus might also induce SSSS."
    explanation: >-
      Reports the desmocollin 1 observation and the authors' own framing of it as
      an open question.
- discussion_id: ssss_host_genetic_susceptibility
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does host genetic variation, in DSG1 or elsewhere, modify susceptibility to
    SSSS or its severity?
  attaches_to:
  - pathophysiology#Failure of Toxin Clearance and Neutralization
  rationale: >-
    Host factors clearly gate whether toxin exposure becomes generalized disease,
    and impaired anti-toxin immunity and poor renal clearance are established
    contributors. Whether inherited variation contributes is unresolved. DSG1
    polymorphisms have not been systematically studied in SSSS, so the absence of a
    reported association is an absence of investigation rather than evidence of no
    effect.
  evidence:
  - reference: PMID:39411997
    reference_title: "Understanding host's response to staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the role of S. aureus ETs and site of action are well-described, other host factors such as impaired immune responses to ETs, poor renal clearance and genetic factors are crucial for the onset of and/or the severity of SSSS in children."
    explanation: >-
      Identifies host genetic factors as contributors whose role remains to be
      characterized.
- discussion_id: ssss_dermal_infiltrate_fate
  kind: KNOWLEDGE_GAP
  prompt: >-
    What happens to the cleaved desmosomal fragments, and what role, if any, do
    dermal inflammatory infiltrates play in SSSS?
  attaches_to:
  - pathophysiology#Granular-Layer Acantholysis and Intraepidermal Split
  rationale: >-
    The near-absence of an inflammatory infiltrate is one of the diagnostic
    features of SSSS, but whether that reflects active immune suppression or simply
    the absence of a danger signal is unknown, as is the disposal route for the
    cleaved desmoglein 1 ectodomain. A recent review closes on exactly these two
    questions.
  proposed_experiments:
  - experiment_id: ssss_lesional_spatial_transcriptomics
    name: Spatial transcriptomics of lesional versus perilesional SSSS epidermis
    description: >-
      Single-cell or spatial transcriptomic profiling of lesional and perilesional
      skin from patients with SSSS, to determine whether the sparse infiltrate
      reflects an actively suppressed immune response or an absent trigger, and to
      track the fate of cleaved desmosomal components.
  evidence:
  - reference: PMID:39411997
    reference_title: "Understanding host's response to staphylococcal scalded skin syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fate of desmosomal fractions after cleavage by ETs, as well as the role of dermal inflammatory cell infiltrates remain to be elucidated."
    explanation: >-
      States both open questions explicitly as the review's own conclusion.
notes: >-
  Scope. This entry models generalized, toxin-mediated SSSS. Bullous impetigo, the
  localized form produced by the same toxins acting at the site of colonization, is
  recorded as a differential rather than folded in.

  Genetics. There is deliberately no genetic block. SSSS has no causal human gene,
  no inheritance pattern, and no established susceptibility locus. DSG1 appears in
  the pathophysiology as the toxin's substrate, not as a disease gene, and germline
  DSG1 disease (SAM syndrome, striate palmoplantar keratoderma) is captured as a
  differential.

  Adult mortality. Reported adult case-fatality figures of 40 to 63% come from
  small selected series in which renal failure and immunosuppression both
  predispose to SSSS and independently carry high mortality. They are recorded in
  clinical_burden as an observed rate with that confounding stated, and should not
  be reused as a mechanistic claim about the disease.

  Toxin serotype geography. ETA predominates in Europe, the United States, and
  Africa while ETB predominates in Japan, and carriage prevalence figures for eta
  and etb among MSSA and MRSA are documented. Those figures appear only in review
  full text rather than in any abstract, so they are recorded here rather than as
  evidence-bearing claims.

  A fifth exfoliative toxin serotype, ETE, was described from an ovine mastitis
  strain and cleaves human and swine desmoglein 1 but not canine desmoglein 1. It
  is not established as a cause of human SSSS and is therefore not modeled.

  Deep research. Curated from a claude_code deep-research report
  (research/Staphylococcal_Scalded_Skin_Syndrome-deep-research-claude_code.md).
  Every snippet above was re-verified against the cached PubMed record rather than
  taken from the report.

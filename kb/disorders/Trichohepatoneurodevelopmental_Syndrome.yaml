      label: CCDC47
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    All reported alleles are truncating - nonsense or frameshift - and none is
    missense, so the mechanism is loss of function throughout and there is no
    evidence yet for a dominant-negative or hypomorphic allele class.
    `gene_disease_validity` is deliberately absent. PMID:39171352 reports that
    its authors applied the ClinGen gene-disease validity framework themselves
    and reached a Strong classification after adding their two patients, but
    that is an author-performed assessment using ClinGen's criteria, not a
    classification published by a ClinGen Gene Curation Expert Panel, and there
    is no CGGV assertion identifier to cite. Recording it as a `CLINGEN`
    assertion would misattribute it, so the claim is kept here in prose until
    a panel record exists.
  evidence:
  - reference: PMID:30401460
    reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through whole-exome sequencing and family-based genomics, we identified
      bi-allelic variants in CCDC47 that encodes the Ca2+-binding ER
      transmembrane protein CCDC47.
    explanation: The gene identification in the founding four-family report.
  - reference: PMID:30401460
    reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Characterization of cells from individuals with predicted likely damaging
      alleles showed decreased CCDC47 mRNA expression and protein levels.
    explanation: >-
      Demonstrates in patient-derived cells that the alleles reduce transcript
      and protein, which is what makes the relationship loss of function rather
      than merely associated.
  variants:
  - name: c.634C>T (p.Arg212*)
    description: >-
      Homozygous nonsense allele in a Chinese infant, in exon 5, predicted to
      trigger nonsense-mediated decay. The first Chinese case and the first to
      report hearing impairment.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:38524542
      reference_title: "Clinical and genetic analysis of trichohepatoneurodevelopmental syndrome caused by a CCDC47 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is a loss-of-function variant that introduces a premature termination
        codon in exon 5, resulting in nonsense-mediated mRNA decay that reduces
        the overall level of CCDC47 mRNA
      explanation: >-
        States the molecular consequence of this allele, and the route by which
        a nonsense allele here lowers CCDC47 abundance.
  - name: c.567_570del (p.Glu190Profs*7)
    description: >-
      Homozygous frameshift allele in a Saudi patient (the fifth reported case).
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39171352
      reference_title: "CCDC47 gene and trichohepatoneurodevelopmental syndrome: Report of the fifth and sixth cases from Saudi Arabia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome sequencing of Case 1 identified a pathogenic homozygous variant
        within the CCDC47
      explanation: >-
        Reports the homozygous genotype for this case. The quote stops before
        the transcript-and-allele string because the reference validator
        normalises the punctuation inside it; the allele is carried in this
        variant's name.
  - name: Founding-report alleles (p.Arg271*, p.Leu382Argfs*2, p.Ser389Leufs*25, p.Arg397*)
    description: >-
      The four alleles of the founding four-family report, recorded as one group
      because the published tabulation presents them as a set and none has been
      characterised separately. Grouping them here rather than splitting them
      into four records reflects what the sources support: the series is
      phenotypically homogeneous across all of them, and no allele-specific
      effect has been reported.
      No class breakdown is quoted for these four. The pooled tabulation's
      count - three nonsense and two frameshift - is for five alleles, because
      it includes the Chinese case's p.Arg212*, so quoting it beside a
      four-allele record would make the numbers disagree.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30401460
      reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe four unrelated individuals with a complex multisystem
        disorder characterized by woolly hair, liver dysfunction, pruritus,
        dysmorphic features, hypotonia, and global developmental delay.
      explanation: >-
        Establishes that these four alleles came from four unrelated
        individuals, which is what makes the set four independent observations.
  - name: c.1327C>T (p.Arg443*) and c.422dup (p.Leu141Phefs*19)
    description: >-
      Compound heterozygous truncating pair in trans in a Saudi patient (the
      sixth reported case), confirmed by parental testing. The first compound
      heterozygous genotype reported for this disease; all earlier cases were
      homozygous.
    clinical_significance: LIKELY_PATHOGENIC

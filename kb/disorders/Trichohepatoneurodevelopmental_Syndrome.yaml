name: Trichohepatoneurodevelopmental Syndrome
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
description: >-
  An ultra-rare autosomal recessive multisystem disorder caused by biallelic
  loss-of-function variants in CCDC47, presenting with woolly or coarse hair,
  liver dysfunction with intractable pruritus, severe global developmental delay
  with microcephaly, hypotonia, coarse facial dysmorphism, and skeletal and limb
  anomalies. CCDC47 (also called calumin) is an endoplasmic reticulum
  transmembrane protein with two established and non-exclusive roles. It is the
  obligate partner of Asterix in the PAT complex, an intramembrane chaperone
  that shields unshielded hydrophilic transmembrane domains during the
  co-translational assembly of multipass membrane proteins, so losing it reduces
  the biogenesis of many multi-spanning proteins at once; and it is a
  low-affinity high-capacity ER calcium-binding protein, so losing it depletes
  ER calcium stores and impairs IP3R-mediated release and store-operated
  refilling. Which of those two accounts for which clinical feature is not
  settled, and the entry records both arms rather than choosing.
  Despite the shared first two syllables of the name, this disease is not
  trichohepatoenteric syndrome: that is the SKIV2L/TTC37 disorder of hair,
  liver and intractable enteropathy. Here the third organ system is the brain,
  and the gene is different.
synonyms:
- THNS
- CCDC47 deficiency

mechanistic_hypotheses:
- hypothesis_group_id: pat_chaperone_arm
  hypothesis_label: PAT-complex failure in multipass membrane protein biogenesis
  status: EMERGING
  description: >-
    That the clinical phenotype follows chiefly from losing the intramembrane
    chaperone function of CCDC47, so that many multi-spanning membrane proteins
    are made at reduced abundance across every tissue. The strongest support is
    not from CCDC47 itself but from its obligate partner: biallelic truncating
    variants in WDR83OS, which encodes Asterix, produce an overlapping
    neurodevelopmental disorder with facial dysmorphism, intractable itching and
    elevated bile acids. Two different subunits of one heterodimer giving one
    recognisable syndrome is an argument that the shared chaperone activity,
    rather than anything specific to CCDC47, is the lesion that matters.
- hypothesis_group_id: er_calcium_arm
  hypothesis_label: ER calcium store depletion
  status: EMERGING
  description: >-
    That the phenotype follows chiefly from losing CCDC47 as a high-capacity ER
    calcium buffer, with reduced total store, impaired IP3R-mediated release and
    reduced store-operated refilling. This is the arm the founding report
    measured directly in patient-derived cells, and the arm the mouse knockout
    was originally interpreted through. It is not in competition with the
    chaperone arm at the molecular level, since several of the channels and
    pumps that handle ER calcium are themselves multipass membrane proteins and
    so are PAT substrates; the open question is which arm is proximate for a
    given organ.
pathophysiology:
- name: CCDC47 Biallelic Loss of Function
  description: >-
    Biallelic truncating CCDC47 variants reduce transcript and protein
    abundance. Every reported allele is nonsense or frameshift, and at least one
    is shown to act through nonsense-mediated decay, so the lesion is a dosage
    loss of an ER membrane protein rather than an altered protein. Complete
    loss is not survivable: Ccdc47-null mice die as embryos.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: CCDC47
    term:
      id: hgnc:24856
      label: CCDC47
  molecular_functions:
  - preferred_term: intramembrane chaperone activity as the PAT complex
    modifier: DECREASED
    term:
      id: GO:0044183
      label: protein folding chaperone
  - preferred_term: low-affinity high-capacity ER calcium binding
    modifier: DECREASED
    term:
      id: GO:0005509
      label: calcium ion binding
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: PAT Complex Failure in Multipass Membrane Protein Biogenesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - pat_chaperone_arm
    description: >-
      The PAT complex is an obligate heterodimer, so loss of either subunit
      disables it. Cells lacking either one show reduced biogenesis of many
      multi-spanning membrane proteins.
    evidence:
    - reference: PMID:32814900
      reference_title: "An intramembrane chaperone complex facilitates membrane protein biogenesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Cells that lack either subunit of the PAT complex show reduced biogenesis
        of numerous multi-spanning membrane proteins.
      explanation: >-
        Establishes the causal step from losing CCDC47 to failed multipass
        biogenesis, and that either subunit suffices to break it.
  - target: Depleted ER Calcium Store and Impaired Release
    causal_link_type: DIRECT
    hypothesis_groups:
    - er_calcium_arm
    evidence:
    - reference: PMID:30401460
      reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro cellular experiments showed decreased total ER Ca2+ storage,
        impaired Ca2+ signaling mediated by the IP3R Ca2+ release channel, and
        reduced ER Ca2+ refilling via store-operated Ca2+ entry.
      explanation: >-
        Measures all three calcium consequences in cells carrying the patients'
        alleles, which is the direct support for this edge.
  evidence:
  - reference: PMID:30401460
    reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      In mice, loss of Ccdc47 leads to embryonic lethality, suggesting that
      Ccdc47 is essential for early development.
    explanation: >-
      Supports treating complete loss as non-viable, which is why surviving
      patients carry alleles that lower rather than abolish the protein. Quoted
      from the abstract's framing of prior mouse work, not this paper's own
      experiments.
- name: PAT Complex Failure in Multipass Membrane Protein Biogenesis
  description: >-
    Without CCDC47, the PAT complex cannot form. Mechanistically CCDC47 occludes
    and latches the Sec61 channel closed while Asterix redirects the nascent
    chain to a lipid-filled cavity behind Sec61, where successive transmembrane
    domains insert and fold. The chaperone shields transmembrane domains whose
    hydrophilic side chains would otherwise be exposed in the bilayer, and
    releases them as folding completes. Losing it lets those domains misfold.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: multi-pass transmembrane protein insertion into ER membrane
    modifier: DECREASED
    term:
      id: GO:0160063
      label: multi-pass transmembrane protein insertion into ER membrane
  downstream:
  - target: Reduced Abundance of Multipass Membrane Proteins
    causal_link_type: DIRECT
    hypothesis_groups:
    - pat_chaperone_arm
  evidence:
  - reference: PMID:36261528
    reference_title: "Mechanism of an intramembrane chaperone for multipass membrane proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Instead, Asterix binds to and redirects the substrate to a location behind
      Sec61, where the PAT complex contributes to a multipass translocon
      surrounding a semi-enclosed, lipid-filled cavity
    explanation: >-
      Gives the structural mechanism this node describes, from biochemical and
      structural analysis of biogenesis intermediates.
  - reference: PMID:32814900
    reference_title: "An intramembrane chaperone complex facilitates membrane protein biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The PAT complex engages nascent TMDs that contain unshielded hydrophilic
      side chains within the lipid bilayer, and it disengages concomitant with
      substrate folding.
    explanation: Identifies the substrate class and the engage/release cycle the node asserts.
- name: Reduced Abundance of Multipass Membrane Proteins
  description: >-
    A broad, non-specific reduction in the amount of correctly folded
    multi-spanning membrane protein: transporters, channels, receptors and
    enzymes. Because the substrate class is large and shared by every tissue,
    this is a plausible single lesion behind a multisystem phenotype, and it
    predicts that the organs most affected are those most dependent on a
    high-throughput membrane transporter.
  biological_scale: CELLULAR
  downstream:
  - target: Depleted ER Calcium Store and Impaired Release
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - pat_chaperone_arm
    description: >-
      The IP3 receptor, SERCA pumps and the ORAI/STIM store-operated entry
      machinery are themselves multipass membrane proteins, so reduced PAT
      output is a route to the measured calcium defect that does not require
      CCDC47 to act as a calcium buffer at all. This is the point at which the
      two hypothesis arms stop being alternatives.
  - target: Impaired Hepatocanalicular Bile Acid Transport
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - pat_chaperone_arm
  - target: Elevated circulating hepatic transaminase concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - pat_chaperone_arm
    description: >-
      Hepatocellular injury is routed from the general biogenesis failure rather
      than from the bile-acid node, because the WDR83OS comparison this entry
      relies on has bile acids raised while transaminases stay normal to only
      mildly elevated - so retention is the wrong parent for enzyme release.
      The intermediates are unknown.
  evidence:
  - reference: PMID:32814900
    reference_title: "An intramembrane chaperone complex facilitates membrane protein biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, the PAT complex is an intramembrane chaperone that protects TMDs
      during assembly to minimize misfolding of multi-spanning membrane proteins
      and maintain cellular protein homeostasis.
    explanation: >-
      Supports the node's claim that the consequence of PAT loss is misfolding
      across the multi-spanning protein class rather than of one substrate.
- name: Depleted ER Calcium Store and Impaired Release
  description: >-
    Reduced total ER calcium content, blunted IP3R-mediated release into the
    cytosol, and reduced refilling through store-operated calcium entry.
    Measured in cells from affected individuals. Calcium release of this kind
    gates secretory-vesicle exocytosis, transcription and proliferation, which
    is the generic route from this node to a developmental phenotype.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: endoplasmic reticulum calcium ion homeostasis
    modifier: DECREASED
    term:
      id: GO:0032469
      label: endoplasmic reticulum calcium ion homeostasis
  - preferred_term: IP3R-mediated calcium release into the cytosol
    modifier: DECREASED
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
  downstream:
  - target: Multisystem Developmental Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - er_calcium_arm
  evidence:
  - reference: PMID:30401460
    reference_title: "Bi-allelic CCDC47 Variants Cause a Disorder Characterized by Woolly Hair, Liver Dysfunction, Dysmorphic Features, and Global Developmental Delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CCDC47, also known as calumin, has been shown to bind Ca2+ with low
      affinity and high capacity.
    explanation: >-
      Gives the biochemical property that makes CCDC47 a store buffer, which is
      why losing it lowers total ER calcium content.
- name: Impaired Hepatocanalicular Bile Acid Transport
  description: >-
    The hepatic arm, offered as the most specific available explanation for the
    otherwise puzzling pairing of intractable pruritus with liver dysfunction.
    Two things have to be kept apart here. The *observation* that bile acids are
    retained in this disease has one direct data point: a CCDC47 infant with a
    total bile acid of 214.9 micromol/L against a 0-20 reference interval. The
    *mechanism* - that the lesion is canalicular bile acid export failing
    because the large multipass ABC transporters that perform it are PAT
    substrates by class - remains a hypothesis, and that is what this node is
    marked as. The mechanistic support is from the paralogous disease rather
    than from this one: individuals with biallelic truncating variants in the
    partner subunit WDR83OS have significantly elevated bile acids with normal
    bilirubin and normal to only mildly elevated liver enzymes, a cholestatic
    pattern driven by retention rather than hepatocellular injury, which is
    what would produce itch. What is missing in CCDC47 disease is a bile acid
    panel across the series, not any measurement at all.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Increased serum bile acid concentration
    causal_link_type: DIRECT
    hypothesis_groups:
    - pat_chaperone_arm
  - target: Pruritus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - pat_chaperone_arm
    description: >-
      Bile acid retention is the proposed pruritogenic route, which is why the
      itch hangs off this node rather than off hepatocellular injury.
  evidence:
  - reference: PMID:38524542
    reference_title: "Clinical and genetic analysis of trichohepatoneurodevelopmental syndrome caused by a CCDC47 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory investigations on day 3 of admission showed she had high total
      bile acids (214.9 μmol/L; normal range 0–20 μmol/L).
    explanation: >-
      The one direct measurement of bile acid retention in a CCDC47 patient, in
      this disease rather than in the paralogous one. It establishes the
      observation this node rests on; the transport mechanism remains the
      hypothesis.
  - reference: PMID:39471804
    reference_title: "Homozygous variants in WDR83OS lead to a neurodevelopmental disorder with hypercholanemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Whereas bile acids were significantly elevated in 5/6 of individuals
      tested, bilirubin was normal and liver enzymes were normal to mildly
      elevated in all 14 individuals.
    explanation: >-
      Documents the bile-acid-retention pattern in disease of the partner PAT
      subunit. The inference step is from Asterix deficiency to CCDC47
      deficiency, which is why directness is INDIRECT: this is the paralogous
      disorder, not this one.
  - reference: PMID:39471804
    reference_title: "Homozygous variants in WDR83OS lead to a neurodevelopmental disorder with hypercholanemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Consistent clinical features include NDD (14/14), facial dysmorphism
      (13/14), intractable itching (9/14), and elevated bile acids (5/6).
    explanation: >-
      Shows that itching and elevated bile acids co-occur in the partner-subunit
      disorder, which is the basis for proposing the same coupling here.
      INDIRECT for the same cross-gene reason.
- name: Multisystem Developmental Failure
  description: >-
    The organism-level convergence point. Every reported individual has severe
    global developmental delay, microcephaly, hypotonia and growth restriction,
    with a highly homogeneous phenotype across the small series despite five
    different truncating alleles - which is itself an argument that one shared
    molecular lesion, rather than allele-specific effects, drives the disease.
  biological_scale: ORGANISM
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Microcephaly
    causal_link_type: DIRECT
  - target: Hypotonia
    causal_link_type: DIRECT
  - target: Woolly hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38524542
    reference_title: "Clinical and genetic analysis of trichohepatoneurodevelopmental syndrome caused by a CCDC47 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic analysis of affected individuals revealed a high degree of
      phenotypic homogeneity in patients with CCDC47 loss-of-function variants.
    explanation: >-
      Supports the claim that the phenotype is homogeneous across different
      truncating alleles, which is the inference this node rests on.

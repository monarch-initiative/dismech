notes: >-
  No GeneReviews chapter names this disease. Verified with `just
  check-genereviews --online` against the committed Bookshelf index snapshot of
  2026-09-10 plus a live PubMed title search: NO_CHAPTER for both GeneReviews
  and StatPearls. The phenotype baseline is therefore the primary case
  literature - the four-family founding report (PMID:30401460) and the
  cross-case phenotype table assembled in PMID:38524542, which tabulates five
  affected individuals.
inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic CCDC47 variants: homozygous truncating alleles in consanguineous
    and founder settings, and compound heterozygous truncating alleles in
    trans confirmed by parental testing in at least one case. Heterozygous
    parents and siblings are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38524542
    reference_title: "Clinical and genetic analysis of trichohepatoneurodevelopmental syndrome caused by a CCDC47 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trichohepatoneurodevelopmental syndrome is an extremely uncommon autosomal
      recessive disorder resulting from variants in the CCDC47 gene, which
      encodes a Ca2+-binding endoplasmic reticulum (ER) transmembrane protein.
    explanation: States the mode of inheritance and the gene for this disease.
  - reference: PMID:39171352
    reference_title: "CCDC47 gene and trichohepatoneurodevelopmental syndrome: Report of the fifth and sixth cases from Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trans phase of the detected variants has been confirmed by the
      parental testing.
    explanation: >-
      Confirms that the two variants in the compound heterozygous case are on
      opposite alleles, which is what makes that genotype biallelic rather than
      two changes in cis.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven published individuals from seven families as of 2025: four in the
    founding report, one from China, and two from Saudi Arabia. The Saudi
    report calls its patients the fifth and sixth because it counts only the
    founding four plus its own, not the Chinese case, so the case numbering in
    the literature undercounts the total by one.
  evidence:
  - reference: PMID:39171352
    reference_title: "CCDC47 gene and trichohepatoneurodevelopmental syndrome: Report of the fifth and sixth cases from Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Trichohepatoneurodevelopmental syndrome (THNS) is an ultra-rare and
      complex disorder affecting multiple organ systems.
    explanation: States the ultra-rare frequency class directly.

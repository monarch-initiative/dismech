discussions:
- discussion_id: thns_bile_acids_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are serum bile acids elevated in CCDC47 deficiency, as they are in
    deficiency of its PAT partner Asterix?
  rationale: >-
    The pruritus in this disease is intractable and is paired with liver
    dysfunction, and the one bile acid figure in the literature - a single
    markedly raised total bile acid of 214.9 micromol/L in one infant - points
    at retention. What is missing is a panel across the series: no CCDC47 report
    gives bile acids for more than that one patient, so whether retention is
    general or incidental to one case is unknown.
    In WDR83OS deficiency - loss of the other subunit of
    the same obligate heterodimer - bile acids are significantly elevated with
    normal bilirubin and normal-to-mildly-elevated liver enzymes. If the same
    pattern holds here it would make the hepatic arm of the pathograph a
    cholestatic bile-acid-retention mechanism rather than hepatocellular
    injury, which would also change management of the itch. The measurement is
    a routine clinical assay, so this is a gap that could be closed by
    reporting it in the next case.
  attaches_to:
  - pathophysiology#Impaired Hepatocanalicular Bile Acid Transport
  - phenotypes#Pruritus
  - phenotypes#Increased serum bile acid concentration
- discussion_id: thns_which_arm_is_proximate
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the ER calcium defect measured in patient cells a direct consequence of
    losing CCDC47 as a calcium buffer, or a downstream consequence of failing to
    build the multipass channels and pumps that handle ER calcium?
  rationale: >-
    The two hypothesis arms are not independent. The IP3 receptor, the SERCA
    pumps and the ORAI/STIM store-operated entry machinery are all multipass
    membrane proteins and therefore PAT substrates, so reduced chaperone output
    predicts the same calcium phenotype that loss of a calcium-binding protein
    would. The founding report measured the calcium defect but could not
    distinguish the two routes, and the structural work on the PAT complex
    postdates it. Discriminating them needs the abundance of those specific
    channels measured in CCDC47-deficient cells, which nobody has reported.
    It matters because only the chaperone arm predicts defects in unrelated
    multipass substrates.
  attaches_to:
  - pathophysiology#Depleted ER Calcium Store and Impaired Release
  - pathophysiology#Reduced Abundance of Multipass Membrane Proteins
  - mechanistic_hypotheses#pat_chaperone_arm
  - mechanistic_hypotheses#er_calcium_arm
treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists. Reported management is supportive and
    organ-directed: gastrostomy feeding for failure to thrive (three of five
    individuals), hepatology follow-up, orthopaedic management of clubfoot and
    hip dysplasia, treatment of recurrent infection, and developmental support.
    This entry records the absence of targeted therapy rather than proposing

- name: Reduced Mitochondrial Respiration
  biological_scale: CELLULAR
  description: Basal and ATP-linked oxygen consumption were reduced in the Leigh lymphocyte line and HEK293T knockdown models. A matching respiratory phenotype has not been demonstrated in the core CAGSSS tissues.
  evidence:
  - reference: PMID:39169373
    reference_title: IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Patient-derived immortalized lymphocytes showed a significant reduction in basal respiration and ATP-linked respiration compared to control cells
    explanation: Respiration in one Leigh patient line supports a possible route, not a demonstrated core CAGSSS defect.
  - reference: PMID:39169373
    reference_title: IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: The compensatory experiments in vitro cell models confirmed the pathogenicity of IARS2 variants since re-expression of wild-type IARS2 rather than mutant IARS2 could rescue complexes I and III deficiency, oxygen consumption, and cellular ATP content in IARS2 knockdown cells.
    explanation: Wild-type re-expression rescued HEK293T knockdown readouts; the three tested missense alleles were from Leigh cases, and rescue was not performed in patient cells.

discussions:
- discussion_id: cagsss_mechanism_not_established
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which allele- and tissue-dependent consequences of IARS2 dysfunction produce core CAGSSS despite normal fibroblast respiratory and translation assays?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Isoleucyl-tRNA Charging
  - pathophysiology#Reduced Respiratory Complex Abundance
  rationale: Core Pro909Leu and Pro909Ser fibroblast results differ in protein abundance, while neither demonstrates the Leigh lymphocyte respiratory-complex phenotype. ClinGen also summarizes normal translation in the founding line. The 2024 study analyzed lymphocytes from only one of its two Leigh patients, and performed rescue in HEK293T knockdown cells. It measured complex content, oxygen consumption and ATP, without directly measuring charging or translation. Normal biochemical findings also occur in broader severe IARS2 presentations. Allele severity, cell context, compensation and tissue-specific vulnerability remain possible explanations; the available comparisons do not isolate them.
  evidence:
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patient-derived fibroblasts from proband 1 showed normal respiratory chain enzyme activity, as well as unchanged oxidative phosphorylation protein subunits and IARS2 levels.
    explanation: The Pro909Ser fibroblast line refutes a universal detectable protein/OXPHOS defect in CAGSSS fibroblasts. It does not exclude defects in other tissues.
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_4cfed420-da98-46fb-a9fd-9cd9f6e83d6c
    reference_title: curation results for Gene-Disease Validity
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: No difference in  BN PAGE nor in translation studies by S35 Methionine pulse labeling
    explanation: ClinGen summarizes normal assembled complexes and pulse-labeled translation in the founding Pro909Leu fibroblast line. This is secondary reporting of the original experiment.
  - reference: PMID:39169373
    reference_title: IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: the contents of complexes I and III were decreased by ~ 90% and ~ 50% compared with control cells, respectively
    explanation: BN-PAGE/immunoblot complex contents in the single Leigh patient 2 lymphocyte line, not enzyme activities or a CAGSSS cohort.
  - reference: PMID:33327715
    reference_title: Biallelic IARS2 mutations presenting as sideroblastic anemia.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Respiratory chain enzyme activities were normal in the liver, skeletal muscle or lymphocytes of patients 1 and 3
    explanation: Normal enzymology also occurs in severe non-core IARS2 presentations.
- discussion_id: cagsss_entity_boundary
  kind: OPEN_QUESTION
  status: OPEN
  prompt: Is CAGSSS a distinct entity, or a named region of a continuous IARS2 phenotypic spectrum?
  attaches_to:
  - disease#CAGSSS Syndrome
  - genetic#IARS2
  rationale: CAGSSS remains a useful named phenotype with its own MONDO anchor, and this entry focuses on that clinical presentation. ClinGen evaluated the broader gene-disease relationship as definitive in December 2024 and explicitly grouped CAGSSS and Leigh-spectrum presentations as IARS2-related primary mitochondrial disease. This classification supports a shared gene-level entity without establishing identical cellular defects, penetrance or management needs across presentations. The seven-person core series, Leigh/West overlap cases, anemia-predominant disease and isolated cataract should therefore retain explicit ascertainment and phenotype boundaries. Domain-based genotype associations remain provisional.
  evidence:
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings support that even though biallelic IARS2 pathogenic variants can result in a distinctive, clinically recognisable phenotype in humans, it can also show a wide range of clinical presentation from severe pediatric neurological disorders of Leigh and West syndrome to both non-syndromic cataract and cataract accompanied by skeletal dysplasia.
    explanation: 'Both halves of the question in one sentence: a distinctive recognisable phenotype, and a spectrum it sits inside.'
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_4cfed420-da98-46fb-a9fd-9cd9f6e83d6c
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: This is one disease entity according to the ClinGen Lumping and Splitting Framework, and has been renamed as ... -related primary mitochondrial disease.
    explanation: ClinGen explicitly groups the historical CAGSSS entity within IARS2-related primary mitochondrial disease.
notes: Frequency bands describe small published core CAGSSS series, not population penetrance. The 2018 ten-person table includes Leigh/West presentations; the 2022 summary separates seven core cases. Repeated reports of the Canadian family are not independent patients. The original skeletal-dysplasia correspondence (PMID:25771764 and PMID:25771765) has no retrievable quotable text; the neonatal skeletal evidence is supplied by the subsequent Danish report.

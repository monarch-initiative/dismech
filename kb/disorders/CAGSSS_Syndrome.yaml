inheritance:
- name: Autosomal recessive
  description: Autosomal recessive inheritance. The core CAGSSS families carry homozygous missense variants; compound heterozygosity, including truncating and deletion alleles, occurs in the broader IARS2 spectrum. Parental segregation distinguishes inherited biallelic variants from uncertain phase.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25130867
    reference_title: Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation is homozygous in the affected patients, heterozygous in carriers, and absent in control chromosomes.
    explanation: The full recessive segregation statement - homozygous in affected, heterozygous in unaffected carriers, absent in controls - rather than homozygosity alone.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:28328135
    reference_title: Confirmation of CAGSSS syndrome as a distinct entity in a Danish patient with a novel homozygous mutation in IARS2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report on a female Danish patient with a novel homozygous IARS2 mutation, p.Gly874Arg, who presented at birth with bilateral hip dislocation and short stature.
    explanation: A second homozygous patient with an independent allele, which is what moved the gene-disease relationship beyond a single consanguineous family.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

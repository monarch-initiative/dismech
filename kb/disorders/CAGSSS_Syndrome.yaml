- name: Impaired Mitochondrial Isoleucyl-tRNA Charging
  biological_scale: MOLECULAR
  description: Reduced supply of charged mitochondrial tRNA-Ile is a proposed consequence of IARS2 dysfunction. The normal enzyme function and structural modeling motivate this hypothesis; the cited core CAGSSS studies did not directly measure charging.
  evidence:
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: IARS2 encodes a mitochondrial isoleucyl-tRNA synthetase, a highly conserved nuclear-encoded enzyme required for the charging of tRNAs with their cognate amino acid for translation.
    explanation: Established normal function supplies a mechanistic rationale, not direct evidence of reduced charging in CAGSSS.
  mechanism_confidence: HYPOTHETICAL
  downstream:

  - target: Short Stature With Growth Hormone Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Congenital Hip Dislocation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Adrenal Insufficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Achalasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a novel disorder in three adult patients with a phenotype including cataracts, short-stature secondary to growth hormone deficiency, sensorineural hearing deficit, peripheral sensory neuropathy, and skeletal dysplasia."
    explanation: >-
      The founding description, and the source for the five features the acronym names.
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, this study suggests that adult patients with CAGSSS may manifest central adrenal insufficiency and type II esophageal achalasia and proposes that a variable sensorineural hearing loss onset, proportionate short stature, polyneuropathy, and mild dysmorphic features are possible, as seen in patient 1."
    explanation: >-
      Adds the adult endocrine and oesophageal features, and is the source for hearing loss
      onset being variable rather than fixed.
phenotypes:
- name: Cataract
  category: Ophthalmological
  description: >-
    One of the five defining features, and the one with the broadest reach across the IARS2
    spectrum - biallelic IARS2 variants have been reported with cataract and skeletal dysplasia
    and no other CAGSSS feature, and with non-syndromic cataract alone.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Cataract

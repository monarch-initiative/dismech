    involvement. The Danish patient's radiographs at 18 months were suggestive of
    spondyloepimetaphyseal dysplasia, and retrospective review of her neonatal films confirmed
    the changes were already present at birth - at which point her growth hormone deficiency
    had not manifested and has still not.

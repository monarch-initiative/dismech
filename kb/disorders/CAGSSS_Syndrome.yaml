differential_diagnoses:
- name: IARS2-Related Leigh and West Syndrome Presentations
  description: Overlapping IARS2 disease may present with early spasms, developmental regression and characteristic basal-ganglia lesions. These cases share the gene but do not define the clinical frequencies in the core CAGSSS series.
  evidence:
  - reference: PMID:30041933
    reference_title: Novel IARS2 mutations in Japanese siblings with CAGSSS, Leigh, and West syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here we report a case of two Japanese siblings with Leigh syndrome, some features of CAGSSS, and West syndrome that are found to have compound heterozygous novel IARS2 mutations.
    explanation: Primary description of overlap, not a sharp mutually exclusive subtype boundary.
- name: IARS2-Related Sideroblastic Anemia
  description: Early anemia, hypoparathyroidism, pancreatic dysfunction, cardiomyopathy or severe neurological disease can dominate broader IARS2 presentations. Normal respiratory enzymology does not exclude these phenotypes either. Their disease course and treatment observations are not automatically transferred to core CAGSSS.
  evidence:
  - reference: PMID:33327715
    reference_title: Biallelic IARS2 mutations presenting as sideroblastic anemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Our report expands the clinical spectrum of IARS2- related disorders to early-onset sideroblastic anemia mimicking Pearson syndrome.
    explanation: The anemia-predominant allelic presentation.
- name: IARS2-Related Isolated Pediatric Cataract
  description: Three affected children in two 2018 families had cataracts without other anomalies at ascertainment. They warrant follow-up for emerging systemic features but are not counted as core multisystem CAGSSS cases.
  evidence:
  - reference: PMID:29914532
    reference_title: Clinical and genetic characteristics of Chinese patients with familial or sporadic pediatric cataract.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: these patients did not present with additional anomalies besides the cataract. Thus, growth hormone levels, neurotrophic keratitis, orbital myopathy, and skeletal dysplasia should be monitored through later follow-ups.
    explanation: The source recommends longitudinal assessment rather than assuming a permanently isolated phenotype.

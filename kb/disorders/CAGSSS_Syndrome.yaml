name: CAGSSS Syndrome
category: Mendelian
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- CAGSSS
- cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing loss-skeletal dysplasia syndrome
- IARS2-related CAGSSS
- cataracts, growth hormone deficiency, sensory neuropathy, sensorineural hearing loss, and skeletal dysplasia syndrome
description: >-
  CAGSSS is an autosomal recessive multisystem disorder caused by biallelic variants in IARS2,
  the nuclear gene encoding mitochondrial isoleucyl-tRNA synthetase. The acronym is the
  phenotype: cataract, growth hormone deficiency, sensory neuropathy, sensorineural hearing
  loss and skeletal dysplasia. IARS2 charges mitochondrial tRNA-Ile for translation, so the
  proximate defect is in the mitochondrial protein-synthesis machinery rather than in any
  single respiratory complex.

  Three things about this entity are worth curating carefully, and all three are places where
  the obvious reading is not the supported one.

  **The skeletal dysplasia is primary, and that was an open question that got answered.** When
  the syndrome was first described, a letter asked whether the skeletal changes were an
  intrinsic bone-development disorder or merely secondary to the growth hormone deficiency and
  the neuromuscular involvement - a reasonable challenge, since short stature and disuse can
  both remodel bone. The Danish patient settled it. Her radiographic abnormalities were
  suggestive of spondyloepimetaphyseal dysplasia, retrospective analysis of her neonatal films
  confirmed the skeletal changes were present at birth, and her growth hormone deficiency had
  not manifested at all. A dysplasia present before the candidate secondary cause exists is
  not secondary to it.

  **The acronym is not a checklist, and treating it as one will miss patients.** The Danish
  patient presented at birth with hip dislocation and short stature, and the cataracts,
  neuropathy and hearing loss only emerged over years. Other biallelic IARS2 patients have
  cataract with skeletal dysplasia and no other CAGSSS feature, and some have cataract alone.
  At the severe end the same gene causes Leigh and West syndrome. So this entry is one region
  of an IARS2 spectrum rather than a discrete disease with a fixed feature set, and the
  temporal ordering matters as much as the list.

  **The respiratory chain mechanism is demonstrated for IARS2, but not for CAGSSS.** The
  intuitive model - defective mitochondrial translation, fewer OXPHOS subunits, reduced complex
  activity - has been shown cleanly, with a rescue arm: lymphocytes from two children with
  biallelic IARS2 variants and Leigh syndrome have severe complex I and III deficiency, the
  same defect appears in IARS2-knockdown cells, and re-expressing wild-type IARS2 restores
  complex activity, oxygen consumption and ATP while mutant IARS2 does not.

  The alleles in that study cause Leigh syndrome. The one CAGSSS-range patient assayed
  comparably gave the opposite result - fibroblasts with normal respiratory chain activity,
  unchanged OXPHOS subunits and unchanged IARS2 levels - and the founding family gives a third
  answer, reduced IARS2 protein in cultured skin cells. The two studies differ in allele *and*
  in cell type, so nothing published separates an allele-severity threshold from a
  wrong-cell-type artefact. The entry carries the OXPHOS node because it is the best available
  account of how an IARS2 defect damages a cell, marks every item in it INDIRECT for this
  disease, and keeps the question open rather than importing the Leigh mechanism wholesale.

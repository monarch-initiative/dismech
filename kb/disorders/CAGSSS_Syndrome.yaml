  evidence:
  - reference: PMID:25130867
    reference_title: Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using SNP genotyping and whole-exome sequencing, we identified a single likely causal variant, a missense mutation in a conserved residue of the nuclear gene IARS2, encoding mitochondrial isoleucyl-tRNA synthetase.
    explanation: The founding variant and how it was identified.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: a single novel homozygous missense c.2725C > T, p.Pro909Ser variant in the gene IARS2
    explanation: The full Results give c.2725C>T; the abstract has an inconsistent cDNA coordinate.
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: confirming both patient 2 and 3 having the variant in a homozygous state, whereas parents and the only available healthy sibling were heterozygous.
    explanation: Segregation of His761Arg in the second Iranian family.
- name: Reduced IARS2 Protein Abundance
  biological_scale: MOLECULAR
  description: IARS2 protein was reduced in one Pro909Leu patient fibroblast line but unchanged in the Pro909Ser line. Reduced abundance is allele/model dependent and does not by itself demonstrate defective aminoacylation.
  evidence:
  - reference: PMID:25130867
    reference_title: Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: IARS2 protein level was reduced in skin cells cultured from one of the patients, consistent with a pathogenic effect of the mutation.
    explanation: Reduced protein in one founding Pro909Leu cell line; abundance is distinct from catalytic activity.
  - reference: PMID:30419932
    reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Patient-derived fibroblasts from proband 1 showed normal respiratory chain enzyme activity, as well as unchanged oxidative phosphorylation protein subunits and IARS2 levels.
    explanation: The Pro909Ser fibroblast line refutes a universal detectable protein/OXPHOS defect in CAGSSS fibroblasts. It does not exclude defects in other tissues.
  mechanism_confidence: PROVISIONAL

genetic:
- name: IARS2
  gene_term:
    preferred_term: IARS2
    term:
      id: hgnc:29685
      label: IARS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    All reported CAGSSS alleles are missense. The same gene, biallelically, produces a
    phenotypic range that runs from severe paediatric Leigh and West syndrome through CAGSSS to
    cataract with skeletal dysplasia and to non-syndromic cataract.
  evidence:
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of clinical findings associated with IARS2 mutations."
    explanation: Establishes this cohort as the founding gene-disease report.
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support that even though biallelic IARS2 pathogenic variants can result in a distinctive, clinically recognisable phenotype in humans, it can also show a wide range of clinical presentation from severe pediatric neurological disorders of Leigh and West syndrome to both non-syndromic cataract and cataract accompanied by skeletal dysplasia."
    explanation: >-
      The full allelic spectrum in one sentence, which is the basis for treating CAGSSS as a
      region of an IARS2 spectrum rather than as a closed entity.

      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a novel disorder in three adult patients with a phenotype including cataracts, short-stature secondary to growth hormone deficiency, sensorineural hearing deficit, peripheral sensory neuropathy, and skeletal dysplasia."
    explanation: Cataract in all three patients of the founding family.
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study further expands the phenotypic spectrum of IARS2 pathogenic variants to include two patients (patients 2 and 3) with cataract and skeletal dysplasia and no other features of CAGSSS to the possible presentation of the defects in IARS2."
    explanation: >-
      Cataract with skeletal dysplasia as a standalone IARS2 presentation, which is why this is
      graded FREQUENT for CAGSSS while being the feature that most often appears without the
      rest.
- name: Corneal Opacity
  category: Ophthalmological
  description: >-
    The eye involvement in CAGSSS extends past the lens. Corneal opacity is reported alongside
    the cataract, and in the most thoroughly described adult patient it sits with neurotrophic
    keratitis - which matters clinically because that combination is what makes corneal grafting
    fail here.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Corneal opacity
    term:
      id: HP:0007957
      label: Corneal opacity
  evidence:
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with congenital cataracts that required surgery, as well as corneal opacity, bilateral nystagmus"
    explanation: >-
      Corneal opacity alongside the cataract in one proband, and the source for the nystagmus
      phenotype below.
  - reference: PMID:27078007
    reference_title: "Recessive Mutation in a Nuclear-Encoded Mitochondrial tRNA Synthetase Associated With Infantile Cataract, Congenital Neurotrophic Keratitis, and Orbital Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was found to have neurotrophic keratitis and corneal opacification."
    explanation: >-
      Corneal opacification in a 33-year-old with the full CAGSSS pentad, together with the
      neurotrophic keratitis that explains it.
- name: Neurotrophic Keratitis
  category: Ophthalmological
  description: >-
    Congenital neurotrophic keratitis, reported in an adult with the full CAGSSS pentad who
    presented with multiple failed corneal grafts and severe eye dryness. It is the ocular
    counterpart of the sensory neuropathy - a cornea that has lost its trigeminal sensory supply
    does not heal - which makes it mechanistically coherent with the rest of the syndrome rather
    than an incidental finding.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Congenital neurotrophic keratitis
    term:
      id: HP:0000481
      label: Abnormal cornea morphology
  evidence:
  - reference: PMID:27078007
    reference_title: "Recessive Mutation in a Nuclear-Encoded Mitochondrial tRNA Synthetase Associated With Infantile Cataract, Congenital Neurotrophic Keratitis, and Orbital Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was found to have neurotrophic keratitis and corneal opacification."
    explanation: The finding itself, in a patient with the complete syndrome.
  - reference: PMID:27078007
    reference_title: "Recessive Mutation in a Nuclear-Encoded Mitochondrial tRNA Synthetase Associated With Infantile Cataract, Congenital Neurotrophic Keratitis, and Orbital Myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with this very rare mutation present with a myriad of ocular findings, including infantile cataract, neurotrophic keratitis, corneal opacification, and orbital myopathy."
    explanation: >-
      The authors' summary of the ocular spectrum, which is the basis for treating the eye
      involvement in this entry as more than cataract.
  notes: >-
    Bound to the general "Abnormal cornea morphology". HPO has no neurotrophic keratitis term,
    so the specific diagnosis is carried in preferred_term.

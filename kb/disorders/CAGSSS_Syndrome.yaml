discussions:
- discussion_id: cagsss_mechanism_not_established
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a defect in mitochondrial isoleucyl-tRNA charging produce cataract, growth hormone
    deficiency, sensory neuropathy, hearing loss and skeletal dysplasia, when patient
    fibroblasts show no respiratory chain deficiency?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Isoleucyl-tRNA Charging
  - pathophysiology#Multisystem Tissue Dysfunction
  rationale: >-
    The expected chain - impaired mitochondrial translation, fewer OXPHOS subunits, reduced
    respiratory chain activity, tissue dysfunction - has now been demonstrated, but not in this
    disease. Lymphocytes from two children with biallelic IARS2 variants and *Leigh syndrome*
    showed severe complex I and III deficiency, the same defect appeared in IARS2-knockdown
    cells, and re-expressing wild-type IARS2 rescued it while mutant IARS2 did not. That is a
    clean causal demonstration, and the alleles it used are the severe ones.

    The one CAGSSS-range patient assayed comparably gave the opposite result: fibroblasts with
    normal respiratory chain enzyme activity, unchanged oxidative phosphorylation subunits, and
    unchanged IARS2 levels. And the founding family gives a third answer again - reduced IARS2
    protein in cultured skin cells.

    So the question is not whether IARS2 loss can cause OXPHOS deficiency; it is whether CAGSSS
    is the same mechanism running at lower amplitude, or something else. Three readings fit the
    published data and none is excluded: an allele-severity threshold, with CAGSSS alleles
    retaining enough activity that fibroblasts compensate; a cell-type effect, with fibroblasts
    being the wrong cell to look in and lymphocytes or an affected tissue being the right one;
    or a genuinely different mechanism at the milder end. The comparison is confounded on both
    axes at once - the two studies differ in allele *and* in cell type - so nothing published
    separates them.

    What would: an aminoacylation assay on the CAGSSS alleles specifically, which nobody has
    reported for any IARS2 allele; the same respiratory chain panel run on CAGSSS-patient
    lymphocytes, which would hold cell type constant across the severity range; and an account
    of tissue selectivity, since lens, pituitary, cochlea, sensory nerve and growth plate are an
    unusual set even granting that aminoacyl-tRNA synthetase disorders hit tissues with high
    metabolic demand.
  evidence:
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Patient-derived fibroblasts from proband 1 showed normal respiratory chain enzyme activity, as well as unchanged oxidative phosphorylation protein subunits and IARS2 levels."
    explanation: >-
      Recorded as REFUTE against the claim that CAGSSS acts through a measurable respiratory
      chain deficiency. It does not refute the gene-disease relationship, only the intuitive
      mechanism for it, and it is the only such measurement made in a CAGSSS-range patient.
  - reference: PMID:39169373
    reference_title: "IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Functional studies revealed that the patient-derived lymphocytes carrying c.1_390del and c.2450G > A variants exhibited impaired mitochondrial function due to severe mitochondrial complexes I and III deficiencies, which was also found in IARS2-knockdown HEK293T cells."
    explanation: >-
      The opposite result, in different cells and from more severe alleles. Curated beside the
      refutation because the pair is the gap: same gene, two cellular verdicts, and the study
      design varies allele and cell type together so neither can be isolated.
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IARS2 protein level was reduced in skin cells cultured from one of the patients, consistent with a pathogenic effect of the mutation."
    explanation: >-
      The opposing cellular result, from the founding family. Curated beside the refutation
      because the disagreement is the gap.
- discussion_id: cagsss_entity_boundary
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is CAGSSS a distinct entity, or a named region of a continuous IARS2 phenotypic spectrum?
  attaches_to:
  - disease#CAGSSS Syndrome
  - genetic#IARS2
  rationale: >-
    The acronym was coined for a recognisable combination in one consanguineous family, and a
    second homozygous patient was published under the title "Confirmation of CAGSSS syndrome as
    a distinct entity". But the same gene, biallelically, gives Leigh and West syndrome at one
    end and non-syndromic cataract at the other, with cataract-plus-skeletal-dysplasia in
    between and no reported genotype rule separating them. Within CAGSSS itself the features
    accumulate over years and at least one named component - growth hormone deficiency - can be
    absent in a patient the literature counts as having the syndrome.

    This matters for curation rather than only for nosology. If CAGSSS is a region of a
    spectrum, then a future dismech entry for IARS2-related disease would supersede this one,
    and this entry's MONDO term would become a subtype anchor. It is curated as its own entry
    because MONDO carries a term for it and the clinical combination is recognisable, and this
    discussion records that the boundary is not established.
  evidence:
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support that even though biallelic IARS2 pathogenic variants can result in a distinctive, clinically recognisable phenotype in humans, it can also show a wide range of clinical presentation from severe pediatric neurological disorders of Leigh and West syndrome to both non-syndromic cataract and cataract accompanied by skeletal dysplasia."
    explanation: >-
      Both halves of the question in one sentence: a distinctive recognisable phenotype, and a
      spectrum it sits inside.
  - reference: PMID:28328135
    reference_title: "Confirmation of CAGSSS syndrome as a distinct entity in a Danish patient with a novel homozygous mutation in IARS2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the original description of the IARS2-related cataracts, growth hormone deficiency, sensory neuropathy, sensorineural hearing loss, skeletal dysplasia syndrome (CAGSSS; OMIM 616007) in an extended consanguineous family of French-Canadian descent, no further patients have been reported."
    explanation: >-
      Records how thin the entity's basis was when the second patient appeared - one
      consanguineous family and nothing else - which is the context for treating the boundary as
      open.
notes: >-
  On the skeletal dysplasia question. PMID:25771764 is a letter asking whether IARS2 deficiency
  causes an intrinsic bone development disorder or whether the skeletal changes are secondary
  to growth hormone deficiency and neuromuscular involvement, and PMID:25771765 is the original
  authors' response. Both are cached alongside this entry but neither is cited as evidence:
  PubMed carries no abstract for either, so there is no quotable text, and a title is not a
  finding. The question they raised is answered in the entry from PMID:28328135, which has the
  neonatal radiographs. They are recorded here so the exchange is not lost and so the next
  curator does not spend the search again.

  Entry naming: the MONDO label is the full five-part descriptive string and is bound as such
  in disease_term. The file and display name use the CAGSSS acronym, which is what the
  literature uses after the founding paper.

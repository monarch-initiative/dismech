inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic IARS2 variants: homozygous in the consanguineous French-Canadian founding family
    and in the Danish patient, compound heterozygous in the Leigh-syndrome patient identified
    alongside the founding cohort. Carriers are heterozygous and unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation is homozygous in the affected patients, heterozygous in carriers, and absent in control chromosomes."
    explanation: >-
      The full recessive segregation statement - homozygous in affected, heterozygous in
      unaffected carriers, absent in controls - rather than homozygosity alone.
  - reference: PMID:28328135
    reference_title: "Confirmation of CAGSSS syndrome as a distinct entity in a Danish patient with a novel homozygous mutation in IARS2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report on a female Danish patient with a novel homozygous IARS2 mutation, p.Gly874Arg, who presented at birth with bilateral hip dislocation and short stature."
    explanation: >-
      A second homozygous patient with an independent allele, which is what moved the gene-disease
      relationship beyond a single consanguineous family.
pathophysiology:
- name: Biallelic IARS2 Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic variants in IARS2, a nuclear gene. The founding family carried a homozygous
    missense change at a conserved residue; the Danish patient a different homozygous missense
    allele, p.Gly874Arg; two Iranian probands further homozygous missense alleles, p.Pro909Ser
    and p.His761Arg. Compound heterozygous alleles in the same gene were found independently
    in a patient with a more severe phenotype diagnosed as Leigh syndrome.
  genes:
  - preferred_term: IARS2
    term:
      id: hgnc:29685
      label: IARS2
  genetic_context:
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Recorded UNKNOWN rather than LOSS_OF_FUNCTION on purpose. The founding family's variant
      reduced IARS2 protein in cultured skin cells, which reads as loss of function, but a
      later patient's fibroblasts showed unchanged IARS2 levels and normal respiratory chain
      activity. No aminoacylation assay on any patient allele has been reported, so the
      functional consequence is inferred from the gene's job rather than measured.
  downstream:
  - target: Impaired Mitochondrial Isoleucyl-tRNA Charging
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using SNP genotyping and whole-exome sequencing, we identified a single likely causal variant, a missense mutation in a conserved residue of the nuclear gene IARS2, encoding mitochondrial isoleucyl-tRNA synthetase."
    explanation: The founding variant and how it was identified.
  - reference: PMID:25130867
    reference_title: "Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness, and peripheral neuropathy or with Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IARS2 protein level was reduced in skin cells cultured from one of the patients, consistent with a pathogenic effect of the mutation."
    explanation: >-
      The only cellular measurement supporting a loss-of-protein effect, and it is from one
      patient. Contradicted in a later patient - see
      discussions#cagsss_mechanism_not_established.
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing and data analysis revealed a novel homozygous missense variant (c.2625C > T, p.Pro909Ser, NM_018060.3) within a 14.3 Mb run of homozygosity in proband 1 and a novel homozygous missense variant (c.2282A > G, p.His761Arg) residing in an ~ 8 Mb region of homozygosity in a proband of the second family."
    explanation: >-
      Two further independent homozygous missense alleles, establishing that the allelic
      spectrum is missense rather than truncating.
- name: Impaired Mitochondrial Isoleucyl-tRNA Charging
  biological_scale: MOLECULAR
  description: >-
    IARS2 is a nuclear-encoded, highly conserved enzyme that charges mitochondrial tRNA with
    its cognate amino acid for translation. A defect here degrades the supply of charged
    tRNA-Ile to the mitochondrial ribosome, so the affected process is mitochondrial protein
    synthesis as a whole rather than any one respiratory complex. Note that no patient allele
    has had its aminoacylation activity measured; this node states the enzyme's established
    role and the class of defect a pathogenic variant in it produces.
  molecular_functions:
  - preferred_term: isoleucine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004822
      label: isoleucine-tRNA ligase activity
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  downstream:
  - target: Combined Oxidative Phosphorylation Deficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30419932
    reference_title: "Expanding the clinical phenotype of IARS2-related mitochondrial disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "IARS2 encodes a mitochondrial isoleucyl-tRNA synthetase, a highly conserved nuclear-encoded enzyme required for the charging of tRNAs with their cognate amino acid for translation."
    explanation: >-
      The enzyme's function, which is the whole basis for the mechanism claim in this node.
      Graded OTHER because it is a statement of established gene function rather than a result
      from the study's own patients.
  notes: >-
    The causal link out of this node is INDIRECT_KNOWN_INTERMEDIATES, not DIRECT: the route from
    a charging defect to a respiratory chain deficiency runs through mitochondrial translation
    and OXPHOS subunit synthesis, which are known steps that this entry does not curate as
    separate nodes. The tissue-selectivity problem is a separate matter and belongs to the edge
    out of the OXPHOS node, where it is recorded.
- name: Combined Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >-
    The step that the intuitive model predicts, and that has been demonstrated - but at the
    severe end of the IARS2 spectrum rather than in CAGSSS. Lymphocytes from two children with
    biallelic IARS2 variants and Leigh syndrome showed impaired mitochondrial function from
    severe complex I and III deficiency, reproduced in IARS2-knockdown HEK293T cells, and
    re-expressing wild-type but not mutant IARS2 rescued the complex deficiency, oxygen
    consumption and ATP content.

    This node is included because it is the best available account of how an IARS2 defect
    damages a cell, and it is marked INDIRECT for this entry throughout because the alleles
    tested cause Leigh syndrome, not CAGSSS, and the one CAGSSS-range patient assayed the same
    way had normal respiratory chain activity.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Multisystem Tissue Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39169373
    reference_title: "IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Functional studies revealed that the patient-derived lymphocytes carrying c.1_390del and c.2450G > A variants exhibited impaired mitochondrial function due to severe mitochondrial complexes I and III deficiencies, which was also found in IARS2-knockdown HEK293T cells."
    explanation: >-
      The measured respiratory chain deficiency. Graded INDIRECT because the patients carry
      Leigh-syndrome alleles rather than CAGSSS alleles, so applying it to this entry is an
      inference across the allelic spectrum.
  - reference: PMID:39169373
    reference_title: "IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The compensatory experiments in vitro cell models confirmed the pathogenicity of IARS2 variants since re-expression of wild-type IARS2 rather than mutant IARS2 could rescue complexes I and III deficiency, oxygen consumption, and cellular ATP content in IARS2 knockdown cells."
    explanation: >-
      The rescue arm, which is what makes this causal rather than correlative: restoring
      wild-type IARS2 restores the phenotype, and restoring mutant IARS2 does not.
  - reference: PMID:39169373
    reference_title: "IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation deficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Mutations in genes encoding ARSs can produce highly diverse clinical phenotypes that affect tissues with particularly high metabolic needs"
    explanation: >-
      The general tissue-selectivity principle for aminoacyl-tRNA synthetase disorders, cited
      as the candidate explanation for CAGSSS organ involvement rather than as a demonstration
      of it.
- name: Multisystem Tissue Dysfunction
  biological_scale: ORGANISM
  description: >-
    The clinical layer. The tissues affected span lens, anterior pituitary, cochlea, peripheral
    sensory nerve and the developing skeleton, with adrenal and oesophageal involvement
    reported in adults. Features do not appear together: the skeletal dysplasia can be present
    at birth while cataract, neuropathy and hearing loss emerge over years.
  downstream:
  - target: Cataract
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Corneal Opacity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neurotrophic Keratitis

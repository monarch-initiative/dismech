- name: Vimentin-Positive, Cytokeratin-Negative and MIC2-Negative Immunophenotype
  finding_term:
    preferred_term: vimentin-positive, cytokeratin-negative and MIC2-negative immunophenotype
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  description: >-
    In the National Wilms Tumor Study Group Pathology Center review,
    immunohistochemical stains were performed on 45 cases and only vimentin
    was consistently immunoreactive. All CCSKs were cytokeratin-negative,
    including epithelioid tumours that mimicked Wilms tumour, and
    MIC2-negative, including cellular tumours that mimicked primitive
    neuroectodermal tumour, and these consistently negative results helped
    exclude other tumours in the differential diagnosis.
  notes: >-
    MIC2 is a previous HGNC symbol of CD99 (hgnc:7082). The full OLS4
    descendant listing of NCIT:C40998 Immunophenotypic Finding, retrieved
    through the OLS4 API on 28 Oct 2026, includes positive-result terms for
    both stains, NCIT:C81765 Cytokeratin-Positive Neoplastic Cells Present and
    NCIT:C51145 CD99-Positive Neoplastic Cells Present, which state the
    opposite of this finding, and no term for vimentin or for a negative
    cytokeratin or CD99 result. The row is therefore bound to the branch
    term, NCIT:C40998 Immunophenotypic Finding.
  evidence:
  - reference: PMID:10632483
    reference_title: "Clear cell sarcoma of the kidney: a review of 351 cases from the National Wilms Tumor Study Group Pathology Center."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical stains were performed on 45 cases; only vimentin was consistently immunoreactive. Consistently negative results with other antibodies helped exclude other tumors in the differential diagnosis; all CCSKs were cytokeratin-negative, including epithelioid tumors that mimicked Wilms tumor, and MIC2-negative, including cellular tumors that mimicked primitive neuroectodermal tumor."
    explanation: >-
      Argani et al. stained 45 cases of their review by immunohistochemistry.
      Only vimentin was consistently immunoreactive, and all CCSKs were
      negative for cytokeratin, including epithelioid tumours that mimicked
      Wilms tumour, and for MIC2, including cellular tumours that mimicked
      primitive neuroectodermal tumour. The authors report that these
      consistently negative results helped exclude other tumours in the
      differential diagnosis. The abstract names no other antibodies and does
      not say how many of the 45 tumours were stained with each.
- name: BCOR Immunoreactivity
  finding_term:
    preferred_term: BCOR immunoreactivity
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  description: >-
    A review states that immunohistochemistry for BCOR has been shown to be a
    sensitive and specific marker for CCSK in the context of paediatric renal
    tumours. In one series, strong diffuse nuclear BCOR immunoreactivity was
    seen in 15 of 18 CCSKs (83%) and in 2 of 10 Wilms tumours, and none of
    the malignant rhabdoid tumours or congenital mesoblastic nephromas showed
    any immunoreactivity, so the lack of strong diffuse staining does not
    exclude CCSK. Strong BCOR staining is not confined to CCSK: five renal or
    perirenal sarcomas in patients aged 30 to 62 years, which raised the
    differential diagnosis of CCSK because of their morphology and strong
    BCOR immunoreactivity, proved on RNA sequencing to be malignant solitary
    fibrous tumours.
  notes: >-
    The full OLS4 descendant listing of NCIT:C40998 Immunophenotypic Finding,
    retrieved through the OLS4 API on 28 Oct 2026, includes no BCOR term, and
    OLS4 searches of NCIT for BCOR Positive and BCOR Expression returned BCOR
    genetic-alteration, fusion and tumour terms and the BCORL1 gene (for
    example NCIT:C178467 BCOR-CCNB3 Fusion Protein Expression) but no BCOR
    immunostaining result. The row is therefore bound to the branch term,
    NCIT:C40998 Immunophenotypic Finding.
  evidence:
  - reference: PMID:30917048
    reference_title: "Clear Cell Sarcoma of the Kidney."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemistry for BCOR has also been shown to be a sensitive and specific marker for clear cell sarcoma of the kidney in the context of pediatric renal tumors."
    explanation: >-

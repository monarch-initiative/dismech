    snippet: "In our series, 5 out of 13 patients with an isolated relapse in the brain were treated with ICE chemotherapy, of which three patients achieved a long-term complete response. This may indicate that treatment including ICE is promising for patients with a relapse in the brain, although we currently have no data on the influence of other factors like type of upfront treatment and hence, development of resistance."

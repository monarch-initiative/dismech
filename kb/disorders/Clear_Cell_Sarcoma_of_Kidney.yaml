    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 5 such undifferentiated renal/perirenal sarcomas which raised the differential diagnosis of CCSK due to their morphologic appearance and strong BCOR immunoreactivity, but which on RNA sequencing proved to be malignant solitary fibrous tumors (SFTs). The neoplasms occurred in patients at an age range of 30 to 62 years."
    explanation: >-
      In a 2019 series, Argani et al. report five undifferentiated renal or
      perirenal sarcomas whose morphology and strong BCOR immunoreactivity

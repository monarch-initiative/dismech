classifications:
  icdo_morphology:
    classification_value: Sarcoma
    evidence:
    - reference: PMID:4065884
      reference_title: "Clear cell sarcoma of the kidney: a clinicopathologic study of 21 patients with long-term follow-up evaluation."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Until substantial proof is found that clear cell sarcoma of the kidney is related to nephroblastoma, its identification as a non-Wilms' sarcoma would seem to be appropriate. This tumor is not the only sarcoma of the kidney, but it appears to be the most common renal sarcoma of childhood."
      explanation: >-
        The two closing sentences of this 1985 clinicopathologic series of
        children with clear cell sarcoma of the kidney give two hedged
        conclusions. First, until the tumour is shown to be related to
        nephroblastoma, identifying it as a non-Wilms sarcoma seems appropriate;
        the authors present this as provisional. Second, it is one of several
        renal sarcomas and appears to be the most common one in childhood. The
        first conclusion supports the Sarcoma value on the icdo_morphology axis
        rather than grouping the tumour with nephroblastoma. It is an argument by
        exclusion, not a finding about the cell of origin, and the paper does
        not refer to ICD-O. The abstract gives no counts of other renal
        sarcomas, so the ranking is the authors' stated conclusion rather than a
        tabulated result.

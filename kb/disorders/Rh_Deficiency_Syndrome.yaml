      the disease.
discussions:
- discussion_id: rh_severity_variability
  prompt: >-
    Why does the severity of haemolysis vary so widely between people with
    equally complete absence of the Rh complex?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Erythrocyte Deformability and Stomatocytic Morphology
  rationale: >-
    The clinical literature consistently describes a varying degree of haemolytic
    anaemia rather than a uniform severity, and the variation is not obviously
    explained by which genetic route produced the deficit: regulator and amorph
    types both abolish the complex and both give a range of outcomes. Candidate
    explanations include residual expression in the Rhmod phenotypes, differences
    in the rest of the membrane skeleton, splenic function, and unmeasured
    modifiers, but with a disease reported in single families the question has
    never been addressed systematically. It matters because prognosis at
    diagnosis currently rests on observation rather than on anything measurable.
  proposed_experiments:
  - experiment_id: rh_ektacytometry_severity_correlation
    name: Membrane deformability against haemolytic severity across reported cases
    description: >-
      Assemble the small number of living reported patients through rare-donor
      registries and measure osmotic gradient ektacytometry alongside haemolytic
      indices, testing whether deformability rather than genotype predicts
      severity. Registry linkage is the only realistic route to a cohort in a
      disease this rare.
differential_diagnoses:
- name: RhD-negative blood type
  description: >-
    Not a differential in the usual sense but the most common confusion, and
    worth stating explicitly. RhD-negative individuals lack the D antigen while
    retaining the rest of the Rh complex and an entirely normal red cell
    membrane. They have no haemolysis and no disease. The similarity is nominal.
- name: Overhydrated hereditary stomatocytosis (RHAG gain of function)
  description: >-
    The most instructive differential, because it involves the same gene in the
    opposite direction. Gain-of-function RHAG variants produce a dominantly
    inherited overhydrated stomatocytosis with cation leak, whereas this disease
    arises from recessive loss of function. Reviews often discuss the two
    together under red-cell membrane transport disorders, and phenotype
    frequencies from that spectrum should not be carried across.
- name: Hereditary spherocytosis
  description: >-
    The commonest inherited membrane haemolytic anaemia, and the main
    alternative when a patient presents with chronic haemolysis and abnormal red
    cell morphology. Distinguished by spherocytes rather than stomatocytes, by
    the vertical-interaction proteins involved, and definitively by Rh
    serology, which is normal.
- name: Dehydrated hereditary stomatocytosis
  description: >-
    Xerocytosis, the mirror-image cation-leak disorder, in which red cells lose
    water rather than gain it. Shares the stomatocytic label and the membrane
    transport theme; distinguished by ektacytometry and by normal Rh antigen
    expression.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No reliable population prevalence, incidence, sex ratio, or carrier frequency
    is established. The disease is described through individual patients and
    small, often consanguineous families, and the source deep-research report is
    explicit that quantitative rates should be marked unavailable rather than
    inferred. Recorded as CASES_IN_LITERATURE for that reason. The rarity is not
    merely epidemiological trivia here: it is the reason compatible blood is
    almost unobtainable and the reason no cohort exists in which to study
    severity.
  evidence:
  - reference: PMID:1503086
    reference_title: "Spanish Rhnull family caused by a silent Rh gene: hematological, serological, and biochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Another example of rare red cells that failed to react with all anti-Rh and anti-LW antibodies was discovered in a Spanish woman suffering from a severe hemolytic anemia typical of the Rhnull syndrome."
    explanation: >-
      Illustrates the form the literature takes, a single patient reported as
      another example of a rare phenotype, which is why no rate is curated.

name: Rh Deficiency Syndrome
creation_date: "2026-08-16T00:00:00Z"
description: >-
  Rh deficiency syndrome is a rare inherited red cell disorder in which the Rh
  membrane complex is absent or severely reduced, producing a chronic haemolytic
  anaemia. The Rh antigens familiar from transfusion practice are the visible
  surface of a multi-subunit assembly that also includes RhAG, CD47, LW, and
  glycophorin B, and that assembly is structural as well as antigenic: it links
  to the membrane skeleton and contributes to the mechanical integrity of the
  cell. Losing it does not merely erase a blood group. The red cell becomes a
  stomatocyte, loses deformability, and is cleared prematurely from the
  circulation.

  Two genetic routes converge on the same missing complex. In the regulator
  type, biallelic loss of function in RHAG removes the glycoprotein required to
  assemble and traffic the complex, so Rh antigens disappear even though the RH
  genes themselves are intact. In the rarer amorph type, silent RHD and RHCE
  haplotypes remove the Rh polypeptides directly. The first is a failure of
  assembly, the second a failure of production, and the erythrocyte cannot tell
  the difference.

  Two confusions are worth heading off, because both are common and both are
  wrong. This is not RhD-negative blood type, in which one antigen is absent and
  the complex is otherwise intact and the red cell is entirely normal. And it is
  not the RHAG gain-of-function form of overhydrated hereditary stomatocytosis,
  which is dominant, involves the same gene in the opposite direction, and shares
  membrane-hydration biology without being the same disease.

  The practical consequence that dominates management is transfusion. A person
  whose red cells carry no Rh antigens will form antibodies against essentially
  any ordinary unit, so compatible blood means Rh-null blood, which is among the
  rarest in the world.
category: Mendelian
disease_term:
  preferred_term: Rh Deficiency Syndrome
  term:
    id: MONDO:0019107
    label: Rh deficiency syndrome
synonyms:
- Rh-null syndrome
- Rhnull disease
- Rh-null phenotype
notes: >-
  Scope and boundaries. Two distinctions are curated deliberately because the
  literature blurs them. First, this disease is not RhD-negative blood type:
  there the D antigen is absent, the rest of the Rh complex is intact, and there
  is no haemolysis at all. Second, it is not RHAG gain-of-function overhydrated
  hereditary stomatocytosis, which is autosomal dominant, arises from the same
  gene acting in the opposite direction, and shares red-cell hydration biology
  without sharing the mechanism. Reviews frequently discuss the two together, and
  phenotype frequencies quoted for the stomatocytosis spectrum should not be
  read across to this entry.

  Frequencies deliberately absent. The source deep-research report states plainly
  that population prevalence, incidence, sex ratio, and carrier frequency are not
  robustly established, and that explicit estimates should be marked unavailable
  rather than inferred. No frequency bands are assigned to phenotypes here for
  the same reason: the literature is single cases and small families, and a band
  derived from a handful of reported patients would manufacture precision the
  data do not have.

  Ontology placement. MONDO classifies this disease under hereditary
  stomatocytosis, and several of its synonyms are regulator-type specific. That
  placement is consistent with the membrane phenotype curated here and should not
  be read as contradicting the exclusion of RHAG gain-of-function overhydrated
  stomatocytosis below: the two share a stomatocytic morphology and a position in
  the membrane-disorder family while differing in gene direction, inheritance and
  mechanism.

  Provider note and a caught error. Built from an Edison Falcon deep-research
  report. Falcon cites by DOI and internal corpus keys rather than PMIDs, so
  evidence here is sourced from the PubMed records it named through Open Targets
  and verified against those. The report gave RHAG the identifier HGNC:9881,
  which does not resolve; the correct identifier is hgnc:10006, verified against
  the ontology and used here. Its RHD and RHCE identifiers were correct. The
  error is recorded because it affected the single most important gene in the
  disease and would not have been caught by snippet validation.
pathophysiology:
- name: RHAG Loss of Function (Regulator Type)
  biological_scale: MOLECULAR
  description: >-
    The commoner route. Biallelic loss-of-function variants in RHAG remove the
    glycoprotein required to assemble and traffic the Rh complex, so the Rh
    antigens disappear even though the RH genes themselves are intact and their
    transcripts are made. This is a failure of assembly, and it is the route the
    RHAG-knockdown experimental model reproduces.
  molecular_functions:
  - preferred_term: ammonium channel activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008519
      label: ammonium channel activity
  evidence:
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequently, Rhnull phenotypes are caused by homozygosity of an autosomal suppressor gene unlinked to the RH locus (Rhnull regulator or Rhmod types)."
    explanation: >-
      Establishes the regulator type as the commoner route and that the
      responsible gene is unlinked to the RH locus, which is why Rh antigens can
      vanish while the RH genes are intact. It does not name the gene; the next
      item does.
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, we identified alteration of Rh50--frameshift, nucleotide mutations, or failure of amplification--which correlated with Rhnull phenotype."
    explanation: >-
      Names the lesion this node is named for. Rh50 is the RHAG gene product, and
      the alterations reported are the loss-of-function classes the node asserts.
  - reference: PMID:9716608
    reference_title: "Rh50 glycoprotein gene and rhnull disease: a silent splice donor is trans to a Gly279-->Glu missense mutation in the conserved transmembrane segment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rhnull disease includes the amorph and regulator types that are thought to result from homozygous mutations at the RH30 and RH50 loci, respectively."
    explanation: >-
      Assigns the two routes to their two loci in one sentence, which is the
      claim the split into two initiating nodes encodes.
  downstream:
  - target: Absent or Severely Reduced Rh Membrane Complex
    causal_link_type: DIRECT
    description: >-
      Without RhAG the complex cannot be assembled or delivered to the membrane.
- name: Silent RH Haplotype (Amorph Type)
  biological_scale: MOLECULAR
  description: >-
    The rarer route, and a different kind of failure. A silent RHCE inherited in
    cis with a deleted RHD means the Rh polypeptides are simply never produced.
    Nothing is mis-assembled because there is nothing to assemble. Reported
    families are consanguineous, as expected for a phenotype this rare.
  evidence:
  - reference: PMID:16271106
    reference_title: "Rhnull syndrome: identification of a novel mutation in RHce."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deficiency of Rh proteins on red blood cells (RBCs) from individuals of the Rh(null) amorph type are the result of homozygosity for a silent RHCE in cis with a deleted RHD."
    explanation: >-
      States the haplotype architecture of the amorph type precisely, which is
      what distinguishes it from the regulator route.
  - reference: PMID:1503086
    reference_title: "Spanish Rhnull family caused by a silent Rh gene: hematological, serological, and biochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family study and Rh blood typings demonstrated clearly that the proposita was homozygous for a silent Rh gene complex (Rhnull of the amorph type) that she inherited from her parents who are first cousins."
    explanation: >-
      Documents the amorph type arising from a homozygous silent Rh haplotype in a
      consanguineous family.
  downstream:
  - target: Absent or Severely Reduced Rh Membrane Complex
    causal_link_type: DIRECT
    description: >-
      No Rh polypeptides are produced, so no complex forms.
- name: Absent or Severely Reduced Rh Membrane Complex
  biological_scale: MOLECULAR
  description: >-
    The convergence point. The Rh complex is not a single antigen but a
    multi-subunit assembly of Rh polypeptides with RhAG, CD47, LW, and
    glycophorin B, and in this disease the whole assembly is missing or greatly
    reduced. That the associated proteins disappear together with the Rh
    polypeptides is what makes this a membrane structural defect rather than a
    serological curiosity, and it has been shown experimentally that removing
    RhAG alone is sufficient to drag the associated proteins off the surface with
    it.
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: ammonium transmembrane transport by the Rh complex
    modifier: DECREASED
    term:
      id: GO:0072488
      label: ammonium transmembrane transport
  evidence:
  - reference: PMID:23417980
    reference_title: "In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model for rare blood group phenotypes and erythroid membrane disorders."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "The cultured red cells generated recapitulate the major alterations of native Rh(null) cells regarding antigen expression, membrane deformability, and gas transport function, providing the proof of principle for their use as model of Rh(null) syndrome and to investigate Rh complex biogenesis in human primary erythroid cells."
    explanation: >-
      PARTIAL, and the gap is worth naming rather than glossing. The source
      reports loss of GAS transport function, while the annotation on this node is
      ammonium transmembrane transport. RhAG carries both, so the observation is
      consistent with the annotation without being a measurement of it. Graded
      accordingly rather than asserted at full strength.
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Rh antigen is a multi-subunit complex composed of Rh polypeptides and associated glycoproteins (Rh50, CD47, LW and glycophorin B); these interact in the red cell membrane and are lacking or severely reduced in Rhnull cells."
    explanation: >-
      Enumerates the components of the complex and states that they are lost
      together, which is the claim this node makes.
  - reference: PMID:23417980
    reference_title: "In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model for rare blood group phenotypes and erythroid membrane disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we were able to reveal for the first time that RhAG extinction alone is sufficient to explain ICAM-4 and CD47 loss observed on native Rh(null) RBCs"
    explanation: >-
      Causal demonstration rather than inference: knocking down RhAG alone
      reproduces the loss of the associated surface proteins, establishing the
      dependency implied by the regulator-type genetics.
  downstream:
  - target: Reduced Erythrocyte Deformability and Stomatocytic Morphology
    causal_link_type: DIRECT
    description: >-
      Loss of the complex compromises the mechanical properties of the membrane.
- name: Reduced Erythrocyte Deformability and Stomatocytic Morphology
  biological_scale: CELLULAR
  description: >-
    The red cell becomes a stomatocyte, with the characteristic slit-like central
    pallor, and loses the deformability it needs to squeeze repeatedly through
    capillaries and splenic sinusoids. This is the mechanical consequence of
    losing a complex that is tethered to the membrane skeleton, and it is
    reproducible in an engineered model as well as observable on a patient's
    blood film.
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Reduced Erythrocyte Integrity"
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:10467273
    reference_title: "Molecular basis for Rh(null) syndrome: identification of three new missense mutations in the Rh50 glycoprotein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rh(null) is a rare autosomal recessive disorder characterized by an absence of Rh antigens and a varying degree of hemolytic anemia and spherostomatocytosis."
    explanation: >-
      Links the absent antigens to the stomatocytic morphology and the haemolysis
      in one sentence, and records that severity varies.
  - reference: PMID:23417980
    reference_title: "In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model for rare blood group phenotypes and erythroid membrane disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lentiviral modification combined with ex vivo erythroid differentiation was used to stably inhibit RhAG expression, a critical component of the Rh(rhesus) membrane complex defective in the Rh(null) syndrome."
    explanation: >-
      Describes the engineered model in which the membrane consequences,
      including deformability, were reproduced from the molecular lesion alone.
  downstream:
  - target: Stomatocytosis
    causal_link_type: DIRECT
    description: >-
      The morphological change is what is seen on the film. Recorded as its own
      edge because the shape abnormality and the loss of deformability are
      observed differently, one by microscopy and one by rheology, even though
      they are two faces of the same membrane defect.
  - target: Premature Erythrocyte Destruction
    causal_link_type: DIRECT
    description: >-
      Rigid, abnormally shaped cells are removed from the circulation early.
- name: Premature Erythrocyte Destruction
  biological_scale: TISSUE
  description: >-
    Shortened red cell survival, predominantly extravascular, with the spleen
    removing cells that can no longer deform enough to pass through it. This is
    the node at which the membrane defect becomes an anaemia.
  conforms_to: "hemolytic_anemia_erythrocyte_destruction#Premature Erythrocyte Destruction"
  evidence:
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, individuals with Rhnull suffer chronic haemolytic anaemia known as the Rh-deficiency syndrome."
    explanation: >-
      States the consequence of the membrane defect and names the syndrome for
      it, which is exactly the transition this node carries.
  downstream:
  - target: Hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      Destruction outpacing production produces the anaemia.
  - target: Reticulocytosis
    causal_link_type: DIRECT
    description: >-
      Compensatory erythropoiesis raises the reticulocyte count.
  - target: Jaundice
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reached through unconjugated hyperbilirubinaemia from haem breakdown.
  - target: Splenomegaly
    causal_link_type: DIRECT
    description: >-
      The organ doing the clearing enlarges under chronic workload.
phenotypes:
- name: Hemolytic anemia
  category: Haematological
  description: >-
    Chronic haemolytic anaemia of variable severity, present from birth. Severity
    ranges widely between reported patients and is not predicted by the genetic
    type.
  phenotype_term:
    preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  evidence:
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, individuals with Rhnull suffer chronic haemolytic anaemia known as the Rh-deficiency syndrome."
    explanation: >-
      Names chronic haemolytic anaemia as the defining clinical consequence.
- name: Stomatocytosis
  category: Haematological
  description: >-
    Stomatocytes on the peripheral blood film, the morphological clue that points
    from an unexplained haemolytic anaemia toward a membrane disorder. Reported
    descriptions include spherostomatocytosis, reflecting a mixture of shapes
    rather than a single uniform morphology.
  phenotype_term:
    preferred_term: Stomatocytosis
    term:
      id: HP:0004446
      label: Stomatocytosis
  evidence:
  - reference: PMID:10467273
    reference_title: "Molecular basis for Rh(null) syndrome: identification of three new missense mutations in the Rh50 glycoprotein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rh(null) is a rare autosomal recessive disorder characterized by an absence of Rh antigens and a varying degree of hemolytic anemia and spherostomatocytosis."
    explanation: >-
      Records the stomatocytic morphology alongside the haemolysis, in the
      authors' own compound term.
- name: Reticulocytosis
  category: Haematological
  description: >-
    Raised reticulocyte count from compensatory erythropoiesis, the expected
    marrow response to shortened red cell survival.
  phenotype_term:
    preferred_term: Reticulocytosis
    term:
      id: HP:0001923
      label: Reticulocytosis
  evidence:
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, individuals with Rhnull suffer chronic haemolytic anaemia known as the Rh-deficiency syndrome."
    explanation: >-
      PARTIAL: the cited sentence establishes chronic haemolysis, from which
      reticulocytosis follows as the standard compensatory response, but this
      source does not report reticulocyte counts in these patients directly.
- name: Jaundice
  category: Clinical
  description: >-
    Jaundice from unconjugated hyperbilirubinaemia, a consequence of ongoing
    haem breakdown rather than of liver disease.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:1503086
    reference_title: "Spanish Rhnull family caused by a silent Rh gene: hematological, serological, and biochemical studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Another example of rare red cells that failed to react with all anti-Rh and anti-LW antibodies was discovered in a Spanish woman suffering from a severe hemolytic anemia typical of the Rhnull syndrome."
    explanation: >-
      PARTIAL: documents severe haemolytic anaemia in a patient with the disease,
      which is the process that produces jaundice, but does not report the sign
      itself. Curated at that strength rather than asserted.
- name: Splenomegaly
  category: Clinical
  description: >-
    Enlargement of the spleen under the chronic workload of clearing abnormal red
    cells. Note that splenectomy is approached with caution in the wider
    membrane-transport disorder spectrum, so the finding does not straightforwardly
    imply the operation.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  evidence:
  - reference: PMID:8563755
    reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, individuals with Rhnull suffer chronic haemolytic anaemia known as the Rh-deficiency syndrome."
    explanation: >-
      PARTIAL: establishes the chronic extravascular haemolysis that produces
      splenomegaly, without this source documenting spleen size. Recorded at that
      strength deliberately.
genetic:
- name: RHAG
  gene_term:
    preferred_term: RHAG
    term:
      id: hgnc:10006
      label: RHAG
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes the Rh-associated glycoprotein, required for assembly and surface
    expression of the Rh complex. Biallelic loss of function causes the regulator
    type, the commoner form, in which Rh antigens are absent despite intact RH
    genes. Reported variants include missense changes in transmembrane segments
    and splice-site changes. Note the identifier: hgnc:10006, verified against the
    ontology. The source deep-research report gave HGNC:9881 for this gene, which
    does not resolve.

    Distinguish carefully from RHAG gain-of-function variants, which cause
    autosomal dominant overhydrated hereditary stomatocytosis. Same gene,
    opposite direction of effect, different inheritance, different disease.
  evidence:
  - reference: PMID:10467273
    reference_title: "Molecular basis for Rh(null) syndrome: identification of three new missense mutations in the Rh50 glycoprotein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report studies of two Japanese Rh(null) cases and describe three new missense mutations of RHAG, the locus that encodes Rh50 glycoprotein and modulates Rh antigen expression."
    explanation: >-
      Identifies RHAG as the locus encoding the glycoprotein that modulates Rh
      antigen expression, and reports disease-causing missense variants in it.
- name: RHD
  gene_term:
    preferred_term: RHD
    term:
      id: hgnc:10009
      label: RHD
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes the RhD polypeptide. Silent RHD haplotypes, inherited together with
    silent RHCE, cause the rarer amorph type, in which the Rh polypeptides are
    not produced at all. Being RhD-negative in the ordinary blood-group sense is
    an entirely different matter and does not cause this disease.
  evidence:
  - reference: PMID:1503086
    reference_title: "Spanish Rhnull family caused by a silent Rh gene: hematological, serological, and biochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family study and Rh blood typings demonstrated clearly that the proposita was homozygous for a silent Rh gene complex (Rhnull of the amorph type) that she inherited from her parents who are first cousins."
    explanation: >-
      Documents the amorph type arising from a homozygous silent Rh haplotype in
      a consanguineous family, which is the route this record describes.
- name: RHCE
  gene_term:
    preferred_term: RHCE
    term:
      id: hgnc:10008
      label: RHCE
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    Encodes the RhCcEe polypeptides. Silent RHCE alleles contribute to the amorph
    type alongside RHD, and a novel RHce variant has been reported as a cause of
    the syndrome.
  evidence:
  - reference: PMID:16271106
    reference_title: "Rhnull syndrome: identification of a novel mutation in RHce."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deficiency of Rh proteins on red blood cells (RBCs) from individuals of the Rh(null) amorph type are the result of homozygosity for a silent RHCE in cis with a deleted RHD."
    explanation: >-
      States the genetic architecture of the amorph type precisely: a silent RHCE
      inherited in cis with a deleted RHD, which is why this record and the RHD
      record describe two halves of one haplotype rather than two independent
      causes.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Both the regulator and amorph types are autosomal recessive. Consanguinity is
    reported in affected families, which is unsurprising for a disease this rare.
diagnosis:
- name: Rh serology (Rh-null and Rhmod phenotyping)
  diagnosis_term:
    preferred_term: Rh phenotyping
    term:
      id: NCIT:C210738
      label: Blood Typing Test
  description: >-
    The diagnostic hallmark, and the finding every differential in this entry
    ultimately turns on. Red cells fail to react with anti-Rh and anti-LW
    antisera, establishing absence of the whole complex rather than of a single
    antigen. Rhmod denotes markedly reduced rather than wholly absent expression.
    The result carries a consequence beyond diagnosis: it identifies a person for
    whom ordinary donor blood is incompatible, so the serology that names the
    disease also creates the transfusion problem.
  evidence:
  - reference: PMID:16271106
    reference_title: "Rhnull syndrome: identification of a novel mutation in RHce."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rh(null) RBCs were nonreactive with anti-Rh and anti-LW."
    explanation: >-
      The serological finding that defines the phenotype, showing loss of both Rh
      and LW reactivity rather than a single missing antigen.
- name: Molecular testing of RHAG, RHD and RHCE
  description: >-
    Sequencing distinguishes the regulator type, where RHAG is disrupted and the
    RH genes are intact, from the amorph type, where a silent RHCE sits in cis
    with a deleted RHD. The distinction does not change transfusion management but
    does change genetic counselling and determines which relatives to test.
  evidence:
  - reference: PMID:10467273
    reference_title: "Molecular basis for Rh(null) syndrome: identification of three new missense mutations in the Rh50 glycoprotein gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report studies of two Japanese Rh(null) cases and describe three new missense mutations of RHAG, the locus that encodes Rh50 glycoprotein and modulates Rh antigen expression."
    explanation: >-
      Demonstrates molecular characterisation of the regulator type through RHAG
      sequencing.
treatments:
- name: Transfusion Support with Rare-Donor Blood
  description: >-
    The defining management problem, and it is logistical as much as medical. A
    person whose red cells express no Rh antigens will recognise essentially any
    ordinary donor unit as foreign, so compatible blood means Rh-null blood,
    which is among the rarest phenotypes recorded. Practical consequences follow:
    advance planning, rare-donor registry linkage, and where feasible autologous
    donation and storage during periods of stability, because a unit cannot be
    found at short notice.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Blood Transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Hemolytic anemia
    treatment_effect: MODULATES
    description: >-
      Replaces destroyed red cells without altering the underlying membrane
      defect. Supportive rather than corrective, and constrained by
      compatibility.
    evidence:
    - reference: PMID:8563755
      reference_title: "Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As a result, individuals with Rhnull suffer chronic haemolytic anaemia known as the Rh-deficiency syndrome."
      explanation: >-
        Establishes the chronic anaemia that transfusion supports.
- name: Genetic Counselling and Family Studies
  description: >-
    Autosomal recessive recurrence risk, carrier testing within affected
    pedigrees, and something unusual to this disease: identification of relatives
    who may share the rare phenotype and could serve as compatible donors. The
    family study is simultaneously genetic counselling and transfusion planning.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:1503086
    reference_title: "Spanish Rhnull family caused by a silent Rh gene: hematological, serological, and biochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family study and Rh blood typings demonstrated clearly that the proposita was homozygous for a silent Rh gene complex (Rhnull of the amorph type) that she inherited from her parents who are first cousins."
    explanation: >-
      Demonstrates the family study establishing both the inheritance and the
      distribution of the phenotype within a pedigree.
experimental_models:
- name: RhAG-knockdown ex vivo erythroid model
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Lentiviral knockdown of RhAG in cells undergoing ex vivo erythroid
    differentiation, generating red cells that reproduce the native Rh-null
    phenotype. It is the closest thing to an experimental system for a disease
    too rare for one, and it converts an inference drawn from patient genetics
    into a demonstration.
  modeled_mechanisms:
  - target: Absent or Severely Reduced Rh Membrane Complex
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the loss of Rh antigen expression, the membrane deformability
      defect, and the gas transport abnormality of native Rh-null cells, and
      shows that removing RhAG alone accounts for loss of the associated surface
      proteins.
    limitations: >-
      The model addresses the regulator type only, since it works by removing
      RhAG; the amorph type, now curated as its own upstream node, arises from
      silent RH haplotypes and is not reproduced. Cells are generated by ex vivo
      differentiation rather than surviving in a circulation, so red cell
      lifespan itself cannot be measured.
    evidence:
    - reference: PMID:23417980
      reference_title: "In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model for rare blood group phenotypes and erythroid membrane disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we were able to reveal for the first time that RhAG extinction alone is sufficient to explain ICAM-4 and CD47 loss observed on native Rh(null) RBCs"
      explanation: >-
        The sufficiency claim this model establishes, which is what makes it
        informative for the complex-assembly node rather than merely consistent
        with it.
  evidence:
  - reference: PMID:23417980
    reference_title: "In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model for rare blood group phenotypes and erythroid membrane disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lentiviral modification combined with ex vivo erythroid differentiation was used to stably inhibit RhAG expression, a critical component of the Rh(rhesus) membrane complex defective in the Rh(null) syndrome."
    explanation: >-

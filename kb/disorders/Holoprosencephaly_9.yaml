    Counselling must address the two facts that make GLI2 unusual: a phenotypically
    normal parent may carry the variant (so a negative family history does not lower
    recurrence risk), and a carrier child's phenotype cannot be predicted from the
    genotype. Cascade testing and the reclassification of most GLI2 missense variants
    as benign are both central to the discussion.

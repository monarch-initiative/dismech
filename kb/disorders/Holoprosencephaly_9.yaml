prevalence:
- population: Worldwide (holoprosencephaly, all causes)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.2
  rate_low: 2.6
  rate_high: 3.8
  notes: >-
    Context figure for holoprosencephaly as a whole, not for HPE9. Japanese
    nationwide survey estimate of 0.32 per 10,000 live births (95% CI 0.26-0.38),
    equivalent to 3.2 per 100,000; international estimates for HPE overall span
    0.10-6.06 per 10,000 births.
  evidence:
  - reference: PMID:31886593
    reference_title: "Nationwide epidemiological survey of holoprosencephaly in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the estimated BPR of HPE was calculated to be 0.32 per 10 000 live births
      (95% CI: 0.26-0.38)
    explanation: >-
      Nationwide Japanese birth-prevalence estimate for holoprosencephaly overall.
  - reference: PMID:31886593
    reference_title: "Nationwide epidemiological survey of holoprosencephaly in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Holoprosencephaly (HPE) is a congenital malformation with an estimated
      prevalence of 0.10-6.06 per 10 000 births
    explanation: >-
      Gives the international range of reported HPE birth prevalence.
- population: Worldwide (GLI2-related disease, HPE9)
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate specific to GLI2-related disease has been published.
    GLI2 contributes a small share of classic holoprosencephaly but is heavily
    enriched among individuals ascertained for syndromic congenital
    hypopituitarism, where it is the most frequently identified genetic cause - so
    population prevalence and diagnostic yield diverge sharply depending on the
    ascertainment route.
  evidence:
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GLI2 variants were the most frequently identified genetic cause in patients
      with syndromic hypopituitarism (68%)
    explanation: >-
      Documents the high diagnostic yield of GLI2 in the syndromic-hypopituitarism
      ascertainment route, in contrast to its minor share of classic HPE.

diagnosis:
- name: Pituitary MRI
  description: >-
    Dedicated sellar/pituitary MRI is the key structural investigation, looking for
    the anterior pituitary hypoplasia, ectopic posterior lobe and absent stalk that
    characterise GLI2-related hypopituitarism, and for any coexisting
    holoprosencephaly-spectrum forebrain malformation.
  evidence:
  - reference: PMID:20685856
    reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging of four patients with GLI2 mutations and
      hypopituitarism showed a hypoplastic anterior pituitary and an ectopic
      posterior pituitary lobe without HPE.
    explanation: >-
      Establishes the MRI pattern that should prompt GLI2 testing.
- name: Anterior pituitary hormone assessment
  description: >-
    Baseline and dynamic endocrine testing across the GH, ACTH-cortisol,
    TSH-thyroxine, gonadotropin and prolactin axes, plus assessment for diabetes
    insipidus, to define which axes are deficient and guide replacement.
  evidence:
  - reference: PMID:20685856
    reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GH, TSH, prolactin, ACTH, LH, and FSH deficiencies
    explanation: >-
      The multi-axis deficiency pattern that hormone assessment is designed to
      detect.
- name: GLI2 molecular testing
  description: >-
    Sequencing of GLI2, usually within a holoprosencephaly or congenital
    hypopituitarism gene panel or by exome sequencing, with chromosomal microarray
    when a 2q14.2 deletion is suspected. Cascade testing of apparently unaffected
    relatives is informative because of the marked non-penetrance. Interpretation
    must account for the reclassification of most previously reported GLI2 missense
    variants as benign or low risk.
  evidence:
  - reference: PMID:29771000
    reference_title: "Molecular testing in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Traditionally, the genetic workup for HPE has been a karyotype, chromosomal
      microarray, and/or Sanger sequencing of select genes.
    explanation: >-
      Describes the molecular testing framework for holoprosencephaly within which
      GLI2 testing sits.
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that most of the 31 missense variants previously reported as
      pathogenic are likely benign or, at most, low-risk variants.
    explanation: >-
      Directly informs variant interpretation: most historically reported GLI2
      missense variants should not be called pathogenic.
- name: Chromosomal microarray
  description: >-
    Copy-number analysis, indicated when a contiguous 2q14.2 deletion is suspected -
    the structural-variant counterpart of the 2q14.2 deletion class in the genetic
    section. Sequencing alone will miss a whole-gene deletion, and the deletion
    phenotype is continuous with that of intragenic truncating variants, so a
    negative GLI2 sequencing result does not exclude GLI2 as the cause.
  evidence:
  - reference: PMID:29771000
    reference_title: "Molecular testing in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Traditionally, the genetic workup for HPE has been a karyotype, chromosomal
      microarray, and/or Sanger sequencing of select genes.
    explanation: >-
      Places chromosomal microarray in the standard holoprosencephaly genetic
      workup alongside sequencing.
  - reference: PMID:22106008
    reference_title: "A patient with a mild holoprosencephaly spectrum phenotype and heterotaxy and a 1.3 Mb deletion encompassing GLI2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large, microscopically visible, interstitial deletions spanning 2q14.2 have
      been reported in patients with multiple congenital anomalies and intellectual
      disability.
    explanation: >-
      Documents the 2q14.2 deletion class that copy-number analysis is needed to
      detect.

progression:
- notes: >-
    The structural anomalies - forebrain, craniofacial and limb - are fixed at birth
    and do not progress. The endocrine phenotype is congenital in origin but may
    declare itself over time: neonatal hypoglycaemia and cholestasis, then growth
    failure in childhood, then absent or delayed puberty. Hormone deficiencies are
    lifelong and require continuing replacement rather than resolving; the presence
    and severity of structural brain malformation, not the endocrine deficit, is the
    dominant determinant of neurodevelopmental outcome.
  evidence:
  - reference: PMID:31782289
    reference_title: "Ectopic Posterior Pituitary, Polydactyly, Midfacial Hypoplasia and Multiple Pituitary Hormone Deficiency due to a Novel Heterozygous IVS11-2A>C(c.1957-2A>C) Mutation in the GLI2 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index case was a boy who developed cholestasis and hypoglycaemia in the
      neonatal period.
    explanation: >-
      Illustrates the neonatal end of the temporal sequence of endocrine
      presentation.
  - reference: PMID:33235745
    reference_title: "A case series of a mother and two daughters with a GLI2 gene deletion demonstrating variable expressivity and incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sisters 1 and 2 present with the classic dyad of findings in a patient with
      Culler Jones syndrome of growth hormone (GH) deficiency and postaxial
      polydactyly, and their mother also demonstrated postaxial polydactyly at birth
      but otherwise has an unremarkable phenotype.
    explanation: >-
      Shows the childhood presentation (GH deficiency plus polydactyly) alongside a
      lifelong-stable minimal phenotype in the carrier mother.

environmental:
- name: Maternal pregestational diabetes
  influences_mechanisms:
  - target: Reduced Developmental Buffering of the Hedgehog Pathway
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      This entry models a dose-limited pathway with no reserve, which is the
      substrate on which environmental insults act. Maternal diabetes is the
      best-replicated such insult and raises the chance that a carrier crosses
      into the affected range.
    evidence:
    - reference: PMID:33111505
      reference_title: "Identifying environmental risk factors and gene-environment interactions in holoprosencephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pregnancy associated risk associated with holoprosencephaly included maternal pregestational diabetes (9.2% of cases and 0 controls, p = .02)"
      explanation: >-
        Reports maternal pregestational diabetes in 9.2% of holoprosencephaly
        cases versus none of the controls, a human association with the
        malformation.
  description: >-
    The most consistently replicated non-genetic risk factor for holoprosencephaly
    in human epidemiology, and therefore the leading candidate second hit for a
    dose-limited GLI2 carrier. The evidence is for holoprosencephaly broadly rather
    than for GLI2 carriers specifically - no study has yet stratified maternal
    diabetes risk by GLI2 genotype, which is precisely what the
    exp_gli2_prospective_periconceptional_exposure_cohort experiment proposes.
  effect: Consistently replicated human risk factor for holoprosencephaly
  evidence:
  - reference: PMID:29761639
    reference_title: "Nongenetic risk factors for holoprosencephaly: An updated review of the epidemiologic literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 2010 review of the literature identified several risk factors that had been
      consistently identified as occurring more frequently among cases of HPE,
      including maternal diabetes, twinning, and a predominance of females
    explanation: >-
      A CDC systematic review of the epidemiologic literature identifies maternal
      diabetes as one of the risk factors consistently associated with
      holoprosencephaly.
  - reference: PMID:33111505
    reference_title: "Identifying environmental risk factors and gene-environment interactions in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregnancy associated risk associated with holoprosencephaly included maternal
      pregestational diabetes (9.2% of cases and 0 controls, p = .02)
    explanation: >-
      A case-control study quantifies the association: pregestational diabetes in
      9.2% of holoprosencephaly cases versus none of the controls.
- name: Prenatal ethanol exposure
  exposure_term:
    preferred_term: maternal exposure to drinking alcohol
    term:
      id: ECTO:0300001
      label: exposure to drinking alcohol via maternal
  influences_mechanisms:
  - target: Reduced Developmental Buffering of the Hedgehog Pathway
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ethanol worsens the phenotype specifically on a Hedgehog-sensitised
      background, which is what this node describes: the same dose produces
      far more dysmorphology when one Shh or Gli2 allele is already lost.
    evidence:
    - reference: PMID:24586787
      reference_title: "The teratogenic effects of prenatal ethanol exposure are exacerbated by Sonic Hedgehog or GLI2 haploinsufficiency in the mouse."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Following ethanol exposure, mean dysmorphology scores were increased by 3.2- and 6.6-fold in Shh(+/-) and Gli2(+/-) groups, respectively, relative to their wildtype littermates."
      explanation: >-
        Ethanol raised dysmorphology scores several-fold in Shh and Gli2
        heterozygotes relative to wild type, demonstrating the
        gene-environment interaction. Support is PARTIAL because the
        demonstration is in mice and has not been shown in human carriers.
  description: >-
    Prenatal alcohol exposure interacts with reduced Gli2 dose in the mouse,
    substantially amplifying craniofacial dysmorphology and producing
    holoprosencephaly-spectrum defects that the exposure alone does not cause. It is
    a candidate second hit for the incomplete penetrance seen in human GLI2 carriers,
    though the interaction has not been demonstrated directly in humans.
  effect: Amplifies craniofacial dysmorphology in Gli2 haploinsufficient mice
  evidence:
  - reference: PMID:24586787
    reference_title: "The teratogenic effects of prenatal ethanol exposure are exacerbated by Sonic Hedgehog or GLI2 haploinsufficiency in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following ethanol exposure, mean dysmorphology scores were increased by 3.2-
      and 6.6-fold in Shh(+/-) and Gli2(+/-) groups, respectively, relative to their
      wildtype littermates.
    explanation: >-
      Quantifies the gene-environment amplification of ethanol teratogenicity by Gli2
      haploinsufficiency in mice.
- name: Teratogen exposure during first-trimester patterning
  exposure_term:
    preferred_term: teratogen exposure
    term:
      id: XCO:0000512
      label: teratogen
  influences_mechanisms:
  - target: Reduced Developmental Buffering of the Hedgehog Pathway
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Low-dose teratogen exposure that a normal embryo tolerates becomes
      damaging once buffering is lost, increasing both penetrance and
      severity. This is the mechanism by which an unaffected carrier parent
      can have a severely affected child.
    evidence:
    - reference: PMID:27585885
      reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "mice with single-allele Gli2 mutations exhibit increased penetrance and severity of HPE in response to low-dose teratogen exposure"
      explanation: >-
        Single-allele Gli2 mutant mice showed increased penetrance and
        severity of holoprosencephaly after low-dose teratogen exposure.
        Support is PARTIAL because this is a mouse demonstration rather than
        human data.
  description: >-
    Low-dose exposure to a Hedgehog-pathway-antagonising teratogen converts silent
    Gli2 heterozygosity into overt holoprosencephaly in the mouse, the general form
    of the second-hit model for this disorder.
  effect: Increases penetrance and severity of holoprosencephaly in Gli2 heterozygotes
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice with single-allele Gli2 mutations exhibit increased penetrance and
      severity of HPE in response to low-dose teratogen exposure
    explanation: >-
      Establishes low-dose teratogen exposure as the environmental arm of the
      gene-environment interaction.

animal_models:
- species: Mus musculus
  genotype: Gli2 homozygous null
  background: C57BL/6J
  description: >-
    Homozygous Gli2 loss of function on the C57BL/6J background reproduces the brain
    and facial features of severe human holoprosencephaly, including midfacial
    hypoplasia, hypotelorism and medial forebrain deficiency. The same genotype on
    other backgrounds does not, making this the clearest demonstration that genetic
    background modifies holoprosencephaly penetrance.
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On the C57BL/6J background, homozygous GLI2 loss of function results in the
      characteristic brain and facial features seen in severe human HPE, including
      midfacial hypoplasia, hypotelorism and medial forebrain deficiency with loss
      of ventral neurospecification.
    explanation: >-
      Background-dependent recapitulation of the severe human phenotype.
- species: Mus musculus
  genotype: Gli2 heterozygous null
  description: >-
    The model closest to the human carrier state: phenotypically normal at baseline,
    but with a dosage-dependent attenuation of Hedgehog ligand responsiveness that
    predisposes to holoprosencephaly on teratogen or ethanol challenge.
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although normally indistinguishable from wild-type littermates, we demonstrate
      that mice with single-allele Gli2 mutations exhibit increased penetrance and
      severity of HPE in response to low-dose teratogen exposure.
    explanation: >-
      Directly models the human situation of a silent heterozygous carrier who can
      nevertheless transmit or manifest disease.
- species: Mus musculus
  genotype: Gli2 homozygous null (CNS floor plate)
  description: >-
    Gli2 null embryos fail to form a floor plate throughout the midbrain, hindbrain
    and spinal cord, and lose the cell populations flanking the floor plate, while
    most ventral neuron classes still form - establishing Gli2 as required
    specifically for ventral midline induction.
  evidence:
  - reference: PMID:9655799
    reference_title: "Gli2 is required for induction of floor plate and adjacent cells, but not most ventral neurons in the mouse central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have found that the floor plate throughout the midbrain, hindbrain and
      spinal cord does not form in Gli2 homozygotes.
    explanation: >-
      Defines the specific ventral-midline requirement for Gli2 in the CNS.
- species: Danio rerio
  genotype: you-too (yot) gli2 mutant
  description: >-
    Zebrafish yot mutants, which carry dominant-negative forms of Gli2, develop a
    lens from the adenohypophyseal anlage, showing that Shh-Gli signalling is
    required to maintain pituitary rather than lens identity in the anterior midline.
  evidence:
  - reference: PMID:10960781
    reference_title: "Zebrafish mutations in Gli-mediated hedgehog signaling lead to lens transdifferentiation from the adenohypophysis anlage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show here that the zebrafish midline mutants you-too (yot) and iguana (igu)
      develop lenses from the adenohypophysis anlage.
    explanation: >-
      Model-organism evidence for a Gli2-dependent step in adenohypophyseal fate
      specification.


name: Holoprosencephaly 9
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: holoprosencephaly 9
  term:
    id: MONDO:0012563
    label: holoprosencephaly 9
synonyms:
- HPE9
- GLI2 holoprosencephaly
- GLI2-related holoprosencephaly
- holoprosencephaly with microphthalmia and first branchial arch anomalies
- pituitary anomalies with holoprosencephaly-like features
- Culler-Jones syndrome
references:
- reference: PMID:20301702
  title: "Holoprosencephaly Overview"
  tags:
  - GeneReviews
description: >-
  Holoprosencephaly 9 (HPE9) is an autosomal dominant developmental disorder caused
  by heterozygous loss-of-function variants in GLI2, the principal transcriptional
  activator of the Sonic hedgehog (SHH) signalling pathway. Despite the
  "holoprosencephaly" designation, frank forebrain non-cleavage is the exception
  rather than the rule: the characteristic presentation is an HPE-like phenotype
  dominated by pituitary anomalies (hypopituitarism/combined pituitary hormone
  deficiency with a hypoplastic anterior pituitary and ectopic posterior pituitary
  lobe), postaxial polydactyly, and subtle midline craniofacial features (midface
  hypoplasia, orofacial clefting, hypotelorism, solitary median maxillary central
  incisor). First branchial arch and temporomandibular joint anomalies, orbital
  anomalies, and - in a small minority - semilobar or lobar holoprosencephaly
  complete the spectrum. Penetrance is markedly incomplete and expressivity highly
  variable, with pathogenic alleles frequently inherited from a mildly affected or
  entirely asymptomatic parent; mouse work shows that a single functional Gli2
  allele attenuates Hedgehog ligand responsiveness and predisposes to overt
  holoprosencephaly only when a second (environmental) hit is applied, providing a
  mechanistic account of that non-penetrance. The same GLI2 loss-of-function allelic
  series is also catalogued as Culler-Jones syndrome and is now the single most
  frequently identified genetic cause of syndromic congenital hypopituitarism.
parents:
- Congenital Disorder
- Neurodevelopmental Disorder

classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      The dominant clinical presentation is congenital hypopituitarism / combined
      pituitary hormone deficiency, and most reported carriers are ascertained
      through endocrine rather than neurology clinics.
  - classification_value: NEUROLOGIC
    notes: >-
      A minority of carriers have frank holoprosencephaly-spectrum forebrain
      malformation, and neurocognitive impairment is reported in a substantial
      subset.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Autosomal dominant Mendelian disorder with markedly incomplete penetrance;
      the mouse Gli2 haploinsufficiency-plus-teratogen model makes this an explicit
      gene-environment interaction disorder.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Heterozygous GLI2 loss-of-function alleles segregate in an autosomal dominant
    pattern, but penetrance is strikingly incomplete: pathogenic variants are
    frequently transmitted by an asymptomatic parent, or by a parent whose only
    manifestation is postaxial polydactyly. A substantial minority of probands
    carry a de novo variant.
  evidence:
  - reference: PMID:25878059
    reference_title: "Role of GLI2 in hypopituitarism phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inheritance pattern was autosomal dominant with incomplete penetrance
      and variable expressivity. The mutation was frequently inherited from an
      asymptomatic parent.
    explanation: >-
      A review of 25 patients in 16 families with heterozygous truncating GLI2
      mutations establishes autosomal dominant inheritance with incomplete
      penetrance and frequent transmission from an unaffected carrier parent.
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Substantial phenotypic variability and nonpenetrance have been described,
      posing difficulties in the counseling of affected families.
    explanation: >-
      Confirms non-penetrance and phenotypic variability as the central
      counselling problem in GLI2-related disease.
  - reference: PMID:33235745
    reference_title: "A case series of a mother and two daughters with a GLI2 gene deletion demonstrating variable expressivity and incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case series and review of the literature support that patients with
      pathogenic variants of the GLI2 gene demonstrate an autosomal dominant
      inheritance pattern, variable expressivity, and incomplete penetrance.
    explanation: >-
      A three-generation family with a shared GLI2 deletion directly demonstrates
      the dominant inheritance, variable expressivity and incomplete penetrance.
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      88% (15/17) of mutations were truncating variants, and 45% were de novo.
    explanation: >-
      Quantifies the de novo rate in the largest multicentre cohort of pathogenic
      GLI2 variants, complementing the familial-transmission data.

genetic:
- name: GLI2
  gene_term:
    preferred_term: GLI2
    term:
      id: hgnc:4318
      label: GLI2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    GLI2 (2q14.2) encodes a C2H2 zinc-finger transcription factor that is the
    principal activator arm of the Hedgehog pathway. Pathogenic alleles are
    predominantly truncating (nonsense, frameshift, canonical splice) and remove
    the C-terminal transcriptional activator domain; whole-gene and contiguous
    2q14.2 deletions produce the same phenotype. Zinc-finger missense variants are
    a second, smaller pathogenic class, whereas most previously reported missense
    variants have been reclassified as benign or low-risk.
  notes: >-
    GLI2 is also somatically activated in Hedgehog-driven cancers (e.g.
    medulloblastoma, basal cell carcinoma); that gain-of-signal role is
    mechanistically opposite to the loss-of-function developmental disorder curated
    here.
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that loss-of-function mutations in the human GLI2 gene are
      associated with a distinctive phenotype (within the HPE spectrum) whose
      primary features include defective anterior pituitary formation and
      pan-hypopituitarism, with or without overt forebrain cleavage abnormalities,
      and HPE-like midfacial hypoplasia.
    explanation: >-
      The founding report establishing GLI2 loss of function as the cause of this
      distinctive HPE-spectrum phenotype.
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that most of the 31 missense variants previously reported as
      pathogenic are likely benign or, at most, low-risk variants.
    explanation: >-
      Reclassification of the missense variant burden; important for interpreting
      the historically high reported frequency of GLI2 "variants" in HPE cohorts.
  - reference: PMID:22106008
    reference_title: "A patient with a mild holoprosencephaly spectrum phenotype and heterotaxy and a 1.3 Mb deletion encompassing GLI2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm the association of haploinsufficiency of GLI2 and mild
      HPE spectrum features.
    explanation: >-
      A 1.3 Mb 2q14.2 deletion encompassing GLI2 reproduces the phenotype,
      establishing gene dosage (haploinsufficiency) rather than an allele-specific
      effect as the disease mechanism.
  variants:
  - name: Truncating GLI2 variants removing the C-terminal activator domain
    description: >-
      Nonsense, frameshift and canonical splice-site variants that truncate GLI2
      before or within the C-terminal transcriptional activator domain are the
      best-established pathogenic class and carry the highest risk of
      hypopituitarism and polydactyly.
    evidence:
    - reference: PMID:20685856
      reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All predict a truncated protein with loss of the C-terminal activator
        domain.
      explanation: >-
        Three novel frameshift/nonsense GLI2 variants all remove the C-terminal
        activator domain, defining the canonical pathogenic variant class.
    - reference: PMID:34921505
      reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We establish that truncating and Zn-finger variants in GLI2 are associated
        with a high risk of hypopituitarism, and that a solitary median maxillary
        central incisor is part of the GLI2-related phenotypic variability.
      explanation: >-
        Genotype-phenotype analysis of 60 individuals identifying truncating and
        zinc-finger variants as the two pathogenic classes.
  - name: Zinc-finger domain missense variants
    description: >-
      A minority of missense variants located in the C2H2 zinc-finger DNA-binding
      domain are pathogenic, including p.(Arg479Gly), p.(Arg516Pro), p.(Gly518Lys)
      and p.(Tyr575His); functional assays show reduced transcriptional activity.
    evidence:
    - reference: PMID:34921505
      reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four Zn-finger variants: p.(Arg479Gly), p.(Arg516Pro), p.(Gly518Lys), and
        p.(Tyr575His) were classified as likely pathogenic
      explanation: >-
        Names the four zinc-finger missense variants that survive stringent
        reclassification as likely pathogenic.
    - reference: PMID:30548673
      reference_title: "Novel GLI2 mutations identified in patients with Combined Pituitary Hormone Deficiency (CPHD): Evidence for a pathogenic effect by functional characterization."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The in vitro functional study of the plasmids bearing two of the three
        missense variants (namely p.Tyr575His and p.Ala593Val) revealed a
        significant reduction in transcriptional activity.
      explanation: >-
        Luciferase reporter assays provide direct in vitro evidence that these
        missense variants reduce GLI2 transcriptional activity.
  - name: 2q14.2 deletions encompassing GLI2
    description: >-
      Submicroscopic and larger interstitial deletions of 2q14.2 that remove GLI2
      produce a phenotype continuous with that of intragenic truncating variants,
      with incomplete penetrance within the same family.
    evidence:
    - reference: PMID:22106008
      reference_title: "A patient with a mild holoprosencephaly spectrum phenotype and heterotaxy and a 1.3 Mb deletion encompassing GLI2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We report here on a patient with a mild holoprosencephaly spectrum
        phenotype (bilateral cleft lip and palate and abnormal pituitary gland
        formation with panhypopituitarism) and normal psychomotor development, who
        was found to carry a 1.3 Mb submicroscopic heterozygous deletion in
        2q14.2, encompassing the GLI2 gene.
      explanation: >-
        A whole-gene deletion produces the mild HPE-spectrum phenotype, supporting
        dosage sensitivity.

has_subtypes:
- name: Pituitary-Polydactyly
  display_name: Pituitary anomaly with postaxial polydactyly (Culler-Jones spectrum)
  subtype_term:
    preferred_term: Culler-Jones syndrome
    term:
      id: MONDO:0014369
      label: postaxial polydactyly-anterior pituitary anomalies-facial dysmorphism syndrome
  description: >-
    The predominant presentation of GLI2 loss of function: hypopituitarism
    (isolated GH deficiency through panhypopituitarism) with a hypoplastic anterior
    pituitary and ectopic posterior pituitary lobe, postaxial polydactyly, and
    subtle midfacial features, in the absence of any forebrain cleavage defect.
    Catalogued in its own right as Culler-Jones syndrome (OMIM 615849,
    MONDO:0014369, Orphanet 420584), which is grounded here as this subtype's
    subtype_term rather than split into a separate dismech entry - see the
    hpe9_nomenclature discussion for that decision.
  evidence:
  - reference: PMID:24744436
    reference_title: "Pathogenic mutations in GLI2 cause a specific phenotype that is distinct from holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with truncating mutations in GLI2 typically present with
      pituitary anomalies, polydactyly and subtle facial features rather than HPE.
    explanation: >-
      Defines the dominant, non-HPE presentation of GLI2 truncating variants.
  - reference: PMID:20685856
    reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging of four patients with GLI2 mutations and
      hypopituitarism showed a hypoplastic anterior pituitary and an ectopic
      posterior pituitary lobe without HPE.
    explanation: >-
      Establishes the characteristic pituitary imaging phenotype occurring without
      holoprosencephaly.
- name: HPE-spectrum
  display_name: GLI2-related holoprosencephaly (forebrain non-cleavage)
  description: >-
    The minority presentation in which GLI2 loss of function produces frank
    holoprosencephaly, most often semilobar, with the classic HPE facial features.
    Reported in roughly 6% of individuals with pathogenic GLI2 variants and in only
    1 of 43 carriers of truncating variants in an earlier series. No subtype_term is
    given because this tier has no MONDO class distinct from the entry's own
    disease_term: "GLI2-related disease with forebrain non-cleavage" simply is
    holoprosencephaly 9 (MONDO:0012563). Only the mild tier acquired a separate
    identifier, because it was historically split out as Culler-Jones syndrome.
  evidence:
  - reference: PMID:24744436
    reference_title: "Pathogenic mutations in GLI2 cause a specific phenotype that is distinct from holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only 1 of 43 had frank HPE
    explanation: >-
      Quantifies how uncommon frank holoprosencephaly is among carriers of
      truncating GLI2 variants.
  - reference: PMID:21204792
    reference_title: "Clinical findings in patients with GLI2 mutations--phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we described six Brazilian patients with phenotypic manifestations that
      range from isolated cleft lip/palate with polydactyly, branchial arch
      anomalies to semi-lobar holoprosencephaly.
    explanation: >-
      Documents the severe end of the spectrum (semilobar HPE) within a GLI2
      mutation-positive series.

pathophysiology:
- name: GLI2 Loss-of-Function Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous truncating variant, pathogenic zinc-finger missense variant, or
    whole-gene 2q14.2 deletion removes or inactivates one GLI2 allele. Truncating
    alleles delete the C-terminal transcriptional activation domain, so the
    residual protein cannot drive Hedgehog target-gene transcription.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  downstream:
  - target: Reduced GLI2 Transcriptional Activator Dose
  evidence:
  - reference: PMID:20685856
    reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All predict a truncated protein with loss of the C-terminal activator
      domain.
    explanation: >-
      Identifies loss of the C-terminal activator domain as the shared molecular
      consequence of the pathogenic truncating alleles.
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrate that these mutations lack GLI2 activity.
    explanation: >-
      Frog-embryo and C3H10T1/2 osteogenic-induction assays show the patient
      alleles have no GLI2 activity, confirming loss of function.

- name: Reduced GLI2 Transcriptional Activator Dose
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    GLI2 is the principal activator among the three vertebrate GLI transcription
    factors that transduce the Hedgehog signal. With one allele inactivated, the
    dose of full-length GLI2 activator available for nuclear translocation and
    target-gene activation falls. The mutant alleles show no dominant-negative
    activity in the original functional assays, so the mechanism is
    haploinsufficiency rather than poisoning of the wild-type product - although a
    later C-terminal frameshift allele did display a dominant-negative effect,
    leaving room for allele-specific mechanisms.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  downstream:
  - target: Attenuated Hedgehog Transcriptional Output
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Gli2 is one of three vertebrate transcription factors implicated as
      obligatory mediators of Shh signal transduction.
    explanation: >-
      Places GLI2 as an obligatory transducer of the Hedgehog signal, the step
      that is dose-reduced here.
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      None of the mutant alleles manifested dominant negative activity in these
      studies.
    explanation: >-
      Co-injection experiments with wild-type GLI2 found no dominant-negative
      activity, supporting simple haploinsufficiency.
  - reference: PMID:30629636
    reference_title: "A novel truncating variant of GLI2 associated with Culler-Jones syndrome impairs Hedgehog signalling."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays confirmed the pathogenicity of the identified variant and
      revealed a dominant-negative effect of mutant GLI2 on Hedgehog signalling.
    explanation: >-
      A C-terminal frameshift allele (p.P1167LfsX52) behaved as a dominant negative
      in cell-based assays, so haploinsufficiency may not be the mechanism for
      every pathogenic allele. Marked PARTIAL because it qualifies rather than
      supports the haploinsufficiency model.

- name: Attenuated Hedgehog Transcriptional Output
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Reduced GLI2 activator dose lowers transcriptional output of the Hedgehog
    pathway in responding cells. Mouse work shows this is not an all-or-nothing
    switch: Gli2 heterozygosity produces a dosage-dependent attenuation of
    Hedgehog ligand responsiveness at the cellular level, which is compatible with
    normal development at baseline but leaves the pathway with less reserve.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  cellular_components:
  - preferred_term: primary cilium
    term:
      id: GO:0005929
      label: cilium
  downstream:
  - target: Impaired Ventral Forebrain Midline Patterning
  - target: Defective Rathke Pouch and Anterior Pituitary Organogenesis
  - target: Disrupted Anteroposterior Limb Bud Patterning
  - target: Disrupted First Branchial Arch and Craniofacial Patterning
  - target: Reduced Developmental Buffering of the Hedgehog Pathway
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This genetic predisposition is associated with a Gli2 dosage-dependent
      attenuation of Hedgehog ligand responsiveness at the cellular level.
    explanation: >-
      Directly demonstrates that Gli2 gene dosage sets the magnitude of cellular
      Hedgehog responsiveness, the central effector step of this disease.
  - reference: PMID:22967285
    reference_title: "Relatively high frequency of non-synonymous GLI2 variants in patients with congenital hypopituitarism without holoprosencephaly."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GLI2 is a downstream transcription factor in Sonic Hedgehog signalling,
      acting early in ventral forebrain and pituitary development.
    explanation: >-
      Locates GLI2 in the Hedgehog cascade and names the two tissues whose
      development is most dependent on it.

- name: Impaired Ventral Forebrain Midline Patterning
  biological_scale: TISSUE
  role: consequence
  description: >-
    Hedgehog signalling from the prechordal plate ventralizes the rostral
    neuroepithelium and drives the midline separation of the eye field and
    prosencephalon. Reduced GLI2-dependent output impairs this midline induction.
    In the mouse, complete Gli2 loss abolishes the floor plate and, on a permissive
    genetic background, reproduces the medial forebrain deficiency and midfacial
    hypoplasia of severe human holoprosencephaly; in humans the heterozygous state
    usually leaves cleavage intact and manifests only as midfacial hypoplasia and
    hypotelorism.
  biological_processes:
  - preferred_term: telencephalon regionalization
    term:
      id: GO:0021978
      label: telencephalon regionalization
    modifier: ABNORMAL
  - preferred_term: floor plate formation
    term:
      id: GO:0021508
      label: floor plate formation
    modifier: DECREASED
  cell_types:
  - preferred_term: neurecto-epithelial cell
    term:
      id: CL:0000710
      label: neurecto-epithelial cell
  downstream:
  - target: Holoprosencephaly-Spectrum Forebrain and Midfacial Malformation
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The secreted protein Shh acts as a crucial factor that patterns the ventral
      forebrain and is required for the division of the primordial eye field and
      brain into two discrete halves.
    explanation: >-
      States the developmental process that GLI2-dependent Hedgehog output serves
      in the ventral forebrain.
  - reference: PMID:9655799
    reference_title: "Gli2 is required for induction of floor plate and adjacent cells, but not most ventral neurons in the mouse central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We have found that the floor plate throughout the midbrain, hindbrain and
      spinal cord does not form in Gli2 homozygotes.
    explanation: >-
      Mouse null data show Gli2 is required for ventral midline (floor plate)
      induction, the CNS-patterning step disrupted in this node.
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On the C57BL/6J background, homozygous GLI2 loss of function results in the
      characteristic brain and facial features seen in severe human HPE, including
      midfacial hypoplasia, hypotelorism and medial forebrain deficiency with loss
      of ventral neurospecification.
    explanation: >-
      Shows that complete Gli2 loss reproduces the human midline forebrain and face
      phenotype, linking this node to its clinical consequence.

- name: Defective Rathke Pouch and Anterior Pituitary Organogenesis
  biological_scale: TISSUE
  role: consequence
  description: >-
    Hedgehog signalling is required at an early step of pituitary formation, when
    Rathke pouch is induced from the oral ectoderm beneath the ventral
    diencephalon. Reduced GLI2 activator output impairs anterior pituitary
    specification and growth and disturbs the descent/positioning of the posterior
    lobe, producing anterior pituitary hypoplasia with an ectopic posterior
    pituitary and interrupted stalk. Gli2 mutant mice have hypoplastic anterior and
    absent posterior pituitary glands, and in zebrafish loss of Gli-mediated
    signalling causes the adenohypophyseal anlage to transdifferentiate into lens.
  biological_processes:
  - preferred_term: pituitary gland development
    term:
      id: GO:0021983
      label: pituitary gland development
    modifier: ABNORMAL
  cell_types:
  - preferred_term: somatotroph
    term:
      id: CL:0002312
      label: somatotroph
  downstream:
  - target: Combined Pituitary Hormone Deficiency
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our data support a growing body of evidence that Shh signaling is necessary
      for an early step in pituitary formation
    explanation: >-
      Places the GLI2-dependent requirement at an early step of pituitary
      organogenesis.
  - reference: PMID:25878059
    reference_title: "Role of GLI2 in hypopituitarism phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gli2 mutant mice have hypoplastic anterior and absent posterior pituitary
      glands.
    explanation: >-
      Mouse data directly demonstrate that Gli2 loss disrupts development of both
      pituitary lobes.
  - reference: PMID:10960781
    reference_title: "Zebrafish mutations in Gli-mediated hedgehog signaling lead to lens transdifferentiation from the adenohypophysis anlage."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The observation argues that overall inhibition of Shh-Gli signaling leads
      the adenohypophysis anlage to transdifferentiate into lens.
    explanation: >-
      Zebrafish gli2 (you-too) mutants show that Shh-Gli signalling maintains
      adenohypophyseal identity; its loss redirects the pituitary primordium to a
      lens fate.
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is the pituitary and facial structures that are the most sensitive to a
      reduction in GLI2 activity.
    explanation: >-
      Identifies the pituitary as the tissue most sensitive to reduced GLI2 dose in
      humans, explaining why hypopituitarism dominates the phenotype.

- name: Disrupted Anteroposterior Limb Bud Patterning
  biological_scale: TISSUE
  role: consequence
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  description: >-
    Hedgehog signalling from the zone of polarizing activity, read out through the
    GLI transcription factors, specifies digit number and identity along the
    anteroposterior axis of the limb bud. Reduced GLI2 activator dose perturbs this
    readout and produces an extra postaxial digit. This is the most prevalent
    manifestation of a pathogenic GLI2 variant and the mildest expression of the
    condition - frequently the only finding in a transmitting parent.
  biological_processes:
  - preferred_term: limb morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  downstream:
  - target: Postaxial Polydactyly
  notes: >-
    Conformance is declared at the digit-number/identity node rather than the
    module's serially homologous autopod node: GLI2-related polydactyly is
    consistently reported as postaxial and is often unilateral, and the published
    series do not systematically document the hand-plus-foot bundle that the
    serial-homology node asserts.
  evidence:
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent phenotypic feature is post-axial polydactyly (65%) which
      is also the mildest phenotypic expression of the condition, reported in many
      parents of individuals with systemic findings.
    explanation: >-
      Establishes postaxial polydactyly as the most frequent and mildest expression
      of a pathogenic GLI2 variant.
  - reference: PMID:31782289
    reference_title: "Ectopic Posterior Pituitary, Polydactyly, Midfacial Hypoplasia and Multiple Pituitary Hormone Deficiency due to a Novel Heterozygous IVS11-2A>C(c.1957-2A>C) Mutation in the GLI2 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His father and a six-year-old brother with the identical mutation also had
      unilateral postaxial polydactyly and mid-facial hypoplasia although there was
      no pituitary hormone deficiency.
    explanation: >-
      Shows postaxial polydactyly occurring as the isolated manifestation in
      relatives carrying the identical GLI2 splice variant.

- name: Disrupted First Branchial Arch and Craniofacial Patterning
  biological_scale: TISSUE
  role: consequence
  description: >-
    Beyond the midline, reduced Hedgehog output perturbs patterning of the first
    branchial arch and its derivatives and of the developing palate and orbit,
    producing midface hypoplasia, orofacial clefting, temporomandibular joint
    anomalies, and - at the severe end - orbital anomalies with anophthalmia or
    microphthalmia and heminasal aplasia.
  biological_processes:
  - preferred_term: roof of mouth development
    term:
      id: GO:0060021
      label: roof of mouth development
    modifier: ABNORMAL
  downstream:
  - target: Holoprosencephaly-Spectrum Forebrain and Midfacial Malformation
  evidence:
  - reference: PMID:21204792
    reference_title: "Clinical findings in patients with GLI2 mutations--phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequently, anophthalmia plus orbital anomalies, heminasal aplasia,
      branchial arch anomalies and polydactyly have also been incorporated into the
      general phenotype.
    explanation: >-
      Documents branchial arch and orbital anomalies as part of the GLI2 phenotype.
  - reference: PMID:21204792
    reference_title: "Clinical findings in patients with GLI2 mutations--phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel sequence variants were found in the GLI2 gene in patients with marked
      involvement of the temporomandibular joint (TMJ), a new clinical finding
      observed with mutations of this gene.
    explanation: >-
      Adds temporomandibular joint involvement, a first-arch derivative, to the
      craniofacial arm of the phenotype.

- name: Reduced Developmental Buffering of the Hedgehog Pathway
  biological_scale: ORGANISM
  role: modifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A single functional GLI2 allele is usually sufficient for normal development,
    which is why so many carriers are unaffected. What haploinsufficiency removes
    is reserve: the pathway becomes dose-limited and therefore vulnerable to a
    second genetic or environmental hit during the first-trimester patterning
    window. Mice heterozygous for a Gli2 null allele are indistinguishable from
    wild-type littermates at baseline but show markedly increased penetrance and
    severity of holoprosencephaly after low-dose teratogen or ethanol exposure.
    This provides the mechanistic account of the incomplete penetrance that defines
    the human disorder, but the specific human second hits remain unidentified.
  downstream:
  - target: Holoprosencephaly-Spectrum Forebrain and Midfacial Malformation
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although normally indistinguishable from wild-type littermates, we
      demonstrate that mice with single-allele Gli2 mutations exhibit increased
      penetrance and severity of HPE in response to low-dose teratogen exposure.
    explanation: >-
      The defining gene-environment experiment: Gli2 heterozygosity is silent alone
      but converts a subthreshold teratogen exposure into holoprosencephaly.
  - reference: PMID:24586787
    reference_title: "The teratogenic effects of prenatal ethanol exposure are exacerbated by Sonic Hedgehog or GLI2 haploinsufficiency in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While Shh(+/-) and Gli2(+/-) mice have been described as phenotypically
      normal, these results illustrate a functional haploinsufficiency of both
      genes in combination with ethanol exposure.
    explanation: >-
      Independent replication with prenatal ethanol as the second hit, supporting
      the reduced-buffering model.
  - reference: PMID:22106008
    reference_title: "A patient with a mild holoprosencephaly spectrum phenotype and heterotaxy and a 1.3 Mb deletion encompassing GLI2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with prior reports, we observed incomplete penetrance of the
      deletion in the family, illustrating the multifactorial etiology of
      holoprosencephaly spectrum features.
    explanation: >-
      Human family data showing the same incomplete penetrance the mouse model
      explains.

- name: Combined Pituitary Hormone Deficiency
  biological_scale: ORGANISM
  role: outcome
  description: >-
    Structural anterior pituitary failure translates into deficiency of one or more
    anterior pituitary hormones - most often growth hormone, frequently combined
    with TSH, ACTH, prolactin and gonadotropin deficiency, and occasionally with
    antidiuretic hormone deficiency (diabetes insipidus) when the posterior lobe
    axis is involved. Clinically this presents as neonatal hypoglycaemia and
    cholestasis, micropenis and cryptorchidism in male infants, and growth failure
    in childhood.
  biological_processes:
  - preferred_term: growth hormone secretion
    term:
      id: GO:0030252
      label: growth hormone secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:20685856
    reference_title: "Novel heterozygous nonsense GLI2 mutations in patients with hypopituitarism and ectopic posterior pituitary lobe without holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index case of family 1 had polydactyly, hypoglycemia, and seizures, and
      GH, TSH, prolactin, ACTH, LH, and FSH deficiencies.
    explanation: >-
      Illustrates the multi-axis anterior pituitary hormone deficiency produced by
      a truncating GLI2 variant.
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with a GLI2 variant (21/23, 91%) had hypopituitarism, including
      21.7% (5/23) presenting isolated growth hormone deficiency.
    explanation: >-
      Quantifies the hormonal phenotype in the largest cohort of pathogenic GLI2
      variants, including the isolated-GH-deficiency subset.

- name: Holoprosencephaly-Spectrum Forebrain and Midfacial Malformation
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The structural end-point of impaired midline patterning: most commonly subtle
    midface hypoplasia, hypotelorism, orofacial clefting and a solitary median
    maxillary central incisor, and less commonly overt lobar or semilobar
    holoprosencephaly. The severity of the brain malformation is the dominant
    determinant of neurodevelopmental outcome.
  evidence:
  - reference: PMID:24744436
    reference_title: "Pathogenic mutations in GLI2 cause a specific phenotype that is distinct from holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A common facial phenotype was seen in individuals (with midface hypoplasia,
      cleft lip/palate and hypotelorism) with truncating mutations.
    explanation: >-
      Defines the recurrent midline facial gestalt of GLI2 truncating variants.
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HPE (6%) or other brain structure abnormalities (15%)
    explanation: >-
      Quantifies how much of the GLI2 morbidity spectrum is structural brain
      malformation.

- name: Postaxial Polydactyly
  biological_scale: ORGANISM
  role: outcome
  description: >-
    An extra digit on the ulnar or fibular side of the hand or foot, unilateral or
    bilateral. It is the single most frequent finding in GLI2 variant carriers and
    is often the only clue that an apparently unaffected parent is a carrier.
  evidence:
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent phenotypic feature is post-axial polydactyly (65%)
    explanation: >-
      Postaxial polydactyly is the most prevalent manifestation across 60
      individuals with pathogenic GLI2 variants.

mechanistic_hypotheses:
- hypothesis_group_id: gli2_haploinsufficiency
  hypothesis_label: Simple haploinsufficiency of the GLI2 activator
  status: CANONICAL
  description: >-
    The dominant model: pathogenic alleles are functionally null, the wild-type
    allele is unaffected, and disease results from a halved dose of GLI2 activator.
    Supported by the absence of dominant-negative activity in the original
    functional assays and by the fact that whole-gene deletions reproduce the
    phenotype.
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      None of the mutant alleles manifested dominant negative activity in these
      studies.
    explanation: >-
      No dominant-negative activity was demonstrable for any patient allele,
      favouring haploinsufficiency.
  - reference: PMID:22106008
    reference_title: "A patient with a mild holoprosencephaly spectrum phenotype and heterotaxy and a 1.3 Mb deletion encompassing GLI2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings confirm the association of haploinsufficiency of GLI2 and mild
      HPE spectrum features.
    explanation: >-
      Whole-gene deletion phenocopies intragenic truncating variants, the classic
      argument for haploinsufficiency.
- hypothesis_group_id: gli2_dominant_negative
  hypothesis_label: Allele-specific dominant-negative interference by truncated GLI2
  status: ALTERNATIVE
  description: >-
    An alternative, probably allele-restricted mechanism in which a truncated GLI2
    protein retaining the N-terminal repressor domain actively interferes with
    Hedgehog signalling rather than simply being inert. Reported for the C-terminal
    frameshift p.P1167LfsX52 in a Culler-Jones family, but not demonstrated for the
    alleles tested in the founding functional study.
  evidence:
  - reference: PMID:30629636
    reference_title: "A novel truncating variant of GLI2 associated with Culler-Jones syndrome impairs Hedgehog signalling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional assays confirmed the pathogenicity of the identified variant and
      revealed a dominant-negative effect of mutant GLI2 on Hedgehog signalling.
    explanation: >-
      Cell-based assays show a dominant-negative effect for this specific
      truncating allele.
- hypothesis_group_id: gli2_second_hit
  hypothesis_label: Gene-environment second hit determines penetrance
  status: EMERGING
  description: >-
    Penetrance and severity are set not by the GLI2 allele alone but by whether a
    second genetic or environmental insult perturbs the already dose-limited
    Hedgehog pathway during the first-trimester patterning window. Strong support in
    the mouse; in humans the specific modifiers remain unidentified, and a possible
    digenic GLI2/HESX1 family has been reported.
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we demonstrate that mutations in Gli2, which encodes a Hedgehog pathway
      transcription factor, can cause or predispose to HPE depending upon gene
      dosage.
    explanation: >-
      Frames Gli2 lesions as either causal or predisposing depending on dosage and
      additional exposure.
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A possible digenic origin (GLI2/HESX1) is proposed in one family.
    explanation: >-
      A single reported family suggests a human second-locus contribution; marked
      PARTIAL because it is a proposal in one family, not established digenic
      inheritance.


differential_diagnoses:
- name: SHH-related holoprosencephaly spectrum
  description: >-
    The commonest single-gene cause of holoprosencephaly, likewise autosomal dominant
    with incomplete penetrance, but with frank forebrain non-cleavage and severe
    midline facial anomalies far more prominent, and pituitary deficiency far less
    so, than in GLI2 disease. SHH, ZIC2, SIX3 and TGIF1 are the four major
    holoprosencephaly genes and should be tested alongside GLI2.
  evidence:
  - reference: PMID:21204792
    reference_title: "Clinical findings in patients with GLI2 mutations--phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathological mutations in holoprosencephaly have been identified in several
      genes that include: SHH, GLI2, PTCH1, TGIF1, ZIC2, SIX3
    explanation: >-
      Names the other holoprosencephaly genes that constitute the genetic
      differential diagnosis for a GLI2 phenotype.
- name: Pallister-Hall syndrome and other GLI3-related disorders
  description: >-
    The other GLI-family developmental disorder: also features polydactyly and
    hypothalamic/pituitary involvement, but with hypothalamic hamartoma, central
    polydactyly patterns, bifid epiglottis and imperforate anus that are not part of
    the GLI2 phenotype.
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pallister-Hall syndrome, or several distinct polydactyly disorders
    explanation: >-
      Places Pallister-Hall syndrome and the GLI3 polydactyly disorders as the
      sibling GLI-family conditions; evidence source is MODEL_ORGANISM because the
      statement is made about Gli3 null mice recapitulating the human syndromes.
- name: Non-syndromic pituitary stalk interruption syndrome
  description: >-
    The identical MRI triad of anterior pituitary hypoplasia, ectopic posterior lobe
    and absent stalk arises from many causes; the presence of postaxial polydactyly or
    midline facial features is what should redirect testing toward GLI2.
  evidence:
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All these GLI2 variants were identified in 23 patients (17 index cases and 6
      relatives) with associated pituitary stalk interruption syndrome or
      extrapituitary manifestations.
    explanation: >-
      Every pathogenic GLI2 variant in this cohort carried either stalk interruption
      or an extrapituitary feature, so an isolated stalk-interruption picture without
      extrapituitary findings points away from GLI2.
- name: Other genetic causes of combined pituitary hormone deficiency
  description: >-
    HESX1, LHX3, LHX4, OTX2, PROP1, POU1F1 and SOX3 among others. GLI2 is
    distinguished by its extrapituitary features - polydactyly above all - and is now
    the most frequently identified cause of the syndromic form.
  evidence:
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GLI2 was the most frequently identified genetic cause of syndromic CH with
      constant association of pituitary stalk interruption syndrome or extrapituitary
      clinical features.
    explanation: >-
      Positions GLI2 relative to the other congenital hypopituitarism genes and names
      the features that distinguish it.
- name: Smith-Lemli-Opitz syndrome
  description: >-
    A cholesterol biosynthesis defect that phenocopies Hedgehog pathway disruption,
    with holoprosencephaly-spectrum midline defects, polydactyly and genital anomalies,
    but is autosomal recessive and biochemically diagnosable by elevated
    7-dehydrocholesterol.
  evidence:
  - reference: PMID:14581620
    reference_title: "Loss-of-function mutations in the human GLI2 gene are associated with pituitary anomalies and holoprosencephaly-like features."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pharmacological inhibition of cholesterol synthesis in rats, which inhibits Hh
      signaling, can cause HPE-like findings including alterations in pituitary
      formation
    explanation: >-
      Establishes the mechanistic basis for the phenocopy - blocking cholesterol
      synthesis inhibits Hedgehog signalling and reproduces HPE-like pituitary
      findings. Marked PARTIAL because the rat experiment models the pathway overlap
      rather than documenting Smith-Lemli-Opitz syndrome itself.

discussions:
- discussion_id: hpe9_nomenclature
  kind: CONTROVERSY
  prompt: >-
    Is "holoprosencephaly 9" the right name for a disorder in which frank
    holoprosencephaly occurs in roughly 6% of carriers?
  status: OPEN
  attaches_to:
  - "pathophysiology#Holoprosencephaly-Spectrum Forebrain and Midfacial Malformation"
  rationale: >-
    The HPE9 designation predates the large genotype-phenotype series and reflects
    the ascertainment of the original cohorts, which were screened for
    holoprosencephaly. Subsequent series consistently show that pituitary anomalies
    and postaxial polydactyly, not forebrain non-cleavage, are the modal
    presentation, which is why the milder presentation was split out as Culler-Jones
    syndrome. dismech keeps a single entry under the MONDO label holoprosencephaly 9
    with the two presentations modelled as subtypes, but the naming remains a live
    question and a curator considering a separate Culler-Jones entry should read this
    note first.
  evidence:
  - reference: PMID:24744436
    reference_title: "Pathogenic mutations in GLI2 cause a specific phenotype that is distinct from holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with truncating mutations in GLI2 typically present with pituitary
      anomalies, polydactyly and subtle facial features rather than HPE.
    explanation: >-
      The finding that motivates the nomenclature question.

- discussion_id: gli2_penetrance_modifiers
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines whether a human GLI2 loss-of-function carrier is unaffected, has
    isolated polydactyly, or has hypopituitarism with holoprosencephaly?
  status: OPEN
  attaches_to:
  - "pathophysiology#Reduced Developmental Buffering of the Hedgehog Pathway"
  rationale: >-
    The mouse work establishes that a second hit converts silent Gli2 heterozygosity
    into overt disease, but the human modifiers are unknown. No modifier locus has
    been validated, only a single family with a proposed digenic GLI2/HESX1
    contribution, and no human study has tested the teratogen interaction directly.
    Identifying the modifiers would convert an unpredictable counselling situation
    into a stratifiable one.
  proposed_experiments:
  - experiment_id: exp_gli2_modifier_sequencing_discordant_relatives
    name: Modifier sequencing in phenotypically discordant carrier relatives
    description: >-
      Sequence the full Hedgehog pathway and known congenital hypopituitarism genes
      in relatives who share an identical GLI2 allele but differ in phenotype, to
      test for modifier or second-locus alleles. Enrichment of pathway alleles in
      affected relative to unaffected carriers would support an oligogenic
      contribution to penetrance; no enrichment would point instead to stochastic or
      environmental determinants.
  - experiment_id: exp_gli2_prospective_periconceptional_exposure_cohort
    name: Prospective periconceptional exposure cohort of GLI2 carriers
    description: >-
      Assemble a cohort of pregnancies in known GLI2 carrier families with
      prospectively recorded periconceptional exposures (alcohol, maternal diabetes,
      cholesterol biosynthesis inhibitors) and relate exposure to offspring
      phenotype. An exposure-severity gradient would translate the mouse
      gene-environment model into humans; phenotype independent of recorded exposures
      would confine that model to the mouse.
  - experiment_id: exp_gli2_hedgehog_dose_response_patient_fibroblasts
    name: Hedgehog dose-response assay in patient fibroblasts
    description: >-
      Measure Hedgehog ligand dose-response in fibroblasts from GLI2 variant carriers
      spanning the phenotypic range, mirroring the mouse cellular assay. Residual
      pathway output correlating with phenotype severity would make cellular Hedgehog
      responsiveness a candidate predictive biomarker; uniform attenuation across
      phenotypically discordant carriers would exclude it.
  evidence:
  - reference: PMID:39938560
    reference_title: "Phenotype and genotype of 23 patients with hypopituitarism and pathogenic GLI2 variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A possible digenic origin (GLI2/HESX1) is proposed in one family.
    explanation: >-
      The only human second-locus lead currently reported; marked PARTIAL because it
      is a single proposed family.

- discussion_id: gli2_mouse_heterozygote_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the mouse Gli2 heterozygote faithfully model the human GLI2 carrier, given
    that heterozygous mice are phenotypically normal whereas a majority of human
    carriers manifest at least polydactyly?
  status: OPEN
  attaches_to:
  - "pathophysiology#Reduced Developmental Buffering of the Hedgehog Pathway"
  rationale: >-
    The human disorder is dominant with roughly 65% of pathogenic-variant carriers
    showing postaxial polydactyly, whereas Gli2 heterozygous mice are described as
    indistinguishable from wild-type littermates without a second insult, and the
    murine phenotype that does resemble severe human holoprosencephaly requires
    homozygous loss on a permissive background. The species therefore differ in where
    the developmental threshold sits relative to a single functional allele. This
    matters because the second-hit model of human non-penetrance rests largely on
    heterozygous-mouse data; if the human heterozygote is already below threshold in
    the limb, the environmental component may be less necessary for the human
    phenotype than the mouse experiments imply.
  proposed_experiments:
  - experiment_id: exp_gli2_het_mouse_limb_phenotyping_across_backgrounds
    name: Systematic limb phenotyping of Gli2 heterozygous mice across backgrounds
    description: >-
      Score autopod morphology in Gli2 heterozygous mice on several genetic
      backgrounds, since polydactyly may have been under-ascertained in models scored
      primarily for craniofacial dysmorphology. Finding unreported polydactyly would
      reconcile the species; confirmed absence across backgrounds would establish a
      real species difference in developmental threshold.
  - experiment_id: exp_gli2_cross_species_hedgehog_dose_response
    name: Cross-species Hedgehog dose-response comparison
    description: >-
      Compare Hedgehog ligand dose-response curves in mouse Gli2 heterozygous
      fibroblasts and human GLI2-variant patient fibroblasts. Lower residual pathway
      output in human cells would explain why human heterozygotes manifest and mouse
      heterozygotes do not; equivalent curves would locate the difference downstream
      of cellular Hedgehog responsiveness.
  evidence:
  - reference: PMID:27585885
    reference_title: "Gli2 gene-environment interactions contribute to the etiological complexity of holoprosencephaly: evidence from a mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although normally indistinguishable from wild-type littermates, we demonstrate
      that mice with single-allele Gli2 mutations exhibit increased penetrance and
      severity of HPE in response to low-dose teratogen exposure.
    explanation: >-
      States the mouse heterozygote baseline that differs from the human carrier
      state.
  - reference: PMID:34921505
    reference_title: "Truncating and zinc-finger variants in GLI2 are associated with hypopituitarism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prevalent phenotypic feature is post-axial polydactyly (65%)
    explanation: >-
      Establishes that most human heterozygotes are not phenotypically silent, unlike
      the mouse.

notes: >-
  Curated from a claude_code deep-research report
  (research/Holoprosencephaly_9-deep-research-claude_code.md) used as a
  lead-generation source only: every PMID, snippet and ontology term in this entry
  was independently verified against the cached abstract or against OAK. Several
  ontology terms suggested by the report were wrong and were replaced (HP:0004926
  and HP:0030082 do not denote panhypopituitarism or holoprosencephaly). Named
  entity confusion preflight passed: MONDO:0012563 names GLI2 (HGNC:4318) as the
  causal gene and cross-references OMIM:610829, matching the gene and OMIM entry
  discussed throughout the source literature. No conformance is declared to
  ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction: GLI2 acts downstream
  of the primary cilium and the lesion here is not a ciliary assembly or trafficking
  defect, so that module's trigger does not apply. GeneReviews has no GLI2-specific
  chapter; the Holoprosencephaly Overview (PMID:20301702) is tagged as the
  GeneReviews baseline, but its PubMed record carries only the chapter's purpose
  statement rather than a Clinical Characteristics section, so phenotype
  cross-referencing was done against the primary cohort literature instead.

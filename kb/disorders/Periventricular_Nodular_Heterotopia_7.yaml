- name: Disrupted Neurogenesis and Neuronal Positioning
  conforms_to: "apical_neuroependyma_integrity_failure#Secondary Neuronal Positioning and Migration Defects"
  biological_scale: TISSUE
  description: >-
    In utero electroporation of PVNH mutants into the embryonic mouse cortex
    arrests neurons in the ventricular/subventricular and intermediate zones
    with depletion of the cortical plate, alters progenitor proliferation, and
    disrupts terminal translocation. The arrested neurons still acquire
    upper-layer identity, so the defect is in positioning rather than fate.

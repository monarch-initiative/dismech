genetic:
- name: NEDD4L
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NEDD4L
    term:
      id: hgnc:7728
      label: NEDD4L
  notes: >-
    NEDD4L encodes a HECT-type E3 ubiquitin ligase (NEDD4-2) with an N-terminal
    C2 domain, four WW substrate-recognition domains and a C-terminal catalytic
    HECT domain. Dominant missense variants cause PVNH7. Separately, NEDD4L
    regulates the epithelial sodium channel, but that function is not part of
    this disease's pathograph.

    reference_title: "Mutations in the HECT domain of NEDD4L lead to AKT-mTOR pathway deregulation and cause periventricular nodular heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that missense mutations in NEDD4L mapping to the HECT domain of the encoded E3 ubiquitin ligase lead to PNH associated with toe syndactyly, cleft palate and neurodevelopmental delay."
    explanation: Establishes HECT-domain missense variants in NEDD4L as the cause of the disease.
  - reference: PMID:32117442
    reference_title: "Recurrent NEDD4L Variant in Periventricular Nodular Heterotopia, Polymicrogyria and Syndactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All tested patients carry the recurrent variant c.623G > A, p.(Arg208Gln) in the WW domain of NEDD4L."
    explanation: Extends the variant spectrum beyond the HECT domain to a WW-domain variant.
  downstream:

phenotypes:
- name: Periventricular nodular heterotopia
  category: Structural
  description: >-
    Bilateral (occasionally unilateral) nodules of grey matter lining the
    lateral ventricles; the MONDO-defining feature, present in all patients
    in the early case series.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Periventricular nodular heterotopia
    term:
      id: HP:0032388
      label: Periventricular nodular heterotopia
  evidence:
  - reference: PMID:28515470
    reference_title: "A novel missense mutation in the HECT domain of NEDD4L identified in a girl with periventricular nodular heterotopia, polymicrogyria and cleft palate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients reported with NEDD4L HECT domain mutations showed periventricular nodular heterotopia, and most had seizures, cortex anomalies, cleft palate and syndactyly."
    explanation: Periventricular nodular heterotopia was universal among reported HECT-domain cases.
- name: Polymicrogyria
  category: Structural
  description: >-
    Overlying cortical malformation, typically perisylvian polymicrogyria. The
    one-third frequency counts polymicrogyria of any distribution; the
    perisylvian binding reflects the pattern where one is described.
  frequency: FREQUENT

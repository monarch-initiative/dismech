discussions:
- discussion_id: controversy_nedd4l_gain_vs_loss_of_function
  prompt: >-
    Do PVNH7 variants act by increasing NEDD4L ligase activity (gain of
    function) or by reducing it (loss of function)?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Aberrant NEDD4L Ubiquitin Ligase Activity
  rationale: >-
    For HECT-domain variants the functional data point to preserved or
    enhanced, constitutively activated ubiquitination with self-promoted
    degradation of the mutant protein, and overexpression of wild-type NEDD4L
    reproduces the neuronal positioning defect, which is hard to reconcile with
    simple loss of function. The WW-domain variant p.Arg208Gln is instead
    interpreted, from structure, as a loss of substrate recognition. Truncating
    NEDD4L variants are present in population controls, arguing against
    haploinsufficiency. The net effect on specific substrates in the developing
    cortex is unmeasured.
  evidence:
  - reference: PMID:27694961
    reference_title: "Mutations in the HECT domain of NEDD4L lead to AKT-mTOR pathway deregulation and cause periventricular nodular heterotopia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Altogether these results suggest that ubiquitination activity of NEDD4L mutant is preserved and possibly enhanced if we take into account the significant level of ubiquitination activity despite the instability of the protein."
    explanation: Supports the gain-of-function reading for HECT-domain variants.
  - reference: PMID:27694961
    reference_title: "Mutations in the HECT domain of NEDD4L lead to AKT-mTOR pathway deregulation and cause periventricular nodular heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, 3 frameshift and 1 stop gained mutations were reported in the data set of Exome Aggregation Consortium in which individuals affected by severe paediatric disease have been excluded."
    explanation: Truncating variants in unaffected population controls argue against haploinsufficiency.
  - reference: PMID:32117442
    reference_title: "Recurrent NEDD4L Variant in Periventricular Nodular Heterotopia, Polymicrogyria and Syndactyly."
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: "We hypothesize that conformational changes cause a loss of function of the WW domain leading to impaired recognition of substrates and ultimately to loss of protein function."
    explanation: Proposes a loss-of-function mechanism for the WW-domain variant, contrary to the gain-of-function reading.
- discussion_id: gap_nedd4l_extraneural_malformations
  prompt: >-
    By what mechanism do NEDD4L variants cause cleft palate, toe syndactyly and
    hypospadias?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Cleft palate
  - phenotypes#2-3 toe syndactyly
  - phenotypes#Hypospadias
  rationale: >-
    The cortical mechanism has been studied in the embryonic mouse brain, but
    no study has examined NEDD4L variants in palatal, limb-bud or genital
    tubercle development, so these consistent extra-neural features have no
    mechanism node in this entry.
  evidence:
  - reference: PMID:30393983
    reference_title: "Familial NEDD4L variant in periventricular nodular heterotopia and in a fetus with hypokinesia and flexion contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, clefting of the palate and syndactyly of the toes 2–3 appear to be quite consistent features, indicating a broader role of the NEDD4L gene product beyond initiation of neuronal migration."
    explanation: Notes that the extra-neural features imply roles of NEDD4L outside neuronal migration.
- discussion_id: gap_nedd4l_seizures_and_neurodevelopmental_impairment
  prompt: >-
    By what mechanism do NEDD4L variants produce the seizures, developmental
    delay and intellectual disability of PVNH7, and does any of it act
    independently of the heterotopia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Seizures
  - phenotypes#Infantile spasms
  - phenotypes#Global developmental delay
  - phenotypes#Intellectual disability
  rationale: >-
    The PVNH7 literature reports how often these features occur, not how they
    arise, so no causal edge in this entry reaches them. A direct
    heterotopia-to-seizure edge would rest only on the general association of
    cortical malformations with epilepsy: within the single reported family
    carrying p.Arg208Gln, carriers with periventricular nodular heterotopia on
    MRI ranged from relatively well-functioning with isolated heterotopia to a
    severely affected case with refractory seizures, so the malformation does
    not by itself predict the seizure phenotype. A malformation-independent
    route has been proposed from mouse work: NEDD4L (Nedd4-2) ubiquitinates the
    AMPA-receptor subunit GluA1 and limits its surface expression, and elevated
    seizure susceptibility in a Nedd4-2-deficient mouse is corrected by
    genetically reducing GluA1. That lead does not transfer cleanly to PVNH7,
    for two reasons recorded in the gain-of-function controversy on this entry:
    the mouse is a loss of NEDD4L, whereas PVNH7 HECT-domain variants appear to
    preserve or increase ligase activity, and the variants shown to disrupt
    GluA1 ubiquitination were from patients with isolated epilepsy, not the
    PVNH7 variants. It is therefore recorded here as a hypothesis to test rather
    than as a causal edge.
  evidence:
  - reference: PMID:32117442
    reference_title: "Recurrent NEDD4L Variant in Periventricular Nodular Heterotopia, Polymicrogyria and Syndactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "varying from relatively well-functioning carriers with isolated PNH on brain MRI, to a severely affected case with profound developmental delay, refractory seizures, and PNH-PMG."
    explanation: >-
      Within one p.Arg208Gln family, carriers with heterotopia on MRI span from
      no seizures to refractory epilepsy, showing the malformation does not by
      itself explain the seizure phenotype.
  - reference: PMID:28212375
    reference_title: "Epilepsy-associated gene Nedd4-2 mediates neuronal activity and seizure susceptibility through AMPA receptors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "elevated seizure susceptibility in Nedd4-2andi mice was normalized when GluA1 is genetically reduced"
    explanation: >-
      Mouse evidence for a GluA1-dependent route from NEDD4L dysfunction to
      seizures. Cited as the hypothesis the proposed experiment would test; it
      is indirect for PVNH7 because the model is a NEDD4L loss of function and
      the tested variants are isolated-epilepsy variants, not the PVNH7
      HECT-domain variants.
  proposed_experiments:
  - experiment_id: exp_pvnh7_variant_glua1_ubiquitination_and_activity
    experiment_design: TARGETED_PERTURBATION
    name: PVNH7 HECT-domain variants in a GluA1 ubiquitination and neuronal-activity assay
    description: >-
      Express the PVNH7 HECT-domain variants (for example p.Glu893Lys,
      p.Gln900Arg) alongside wild-type NEDD4L and assess GluA1 ubiquitination,
      GluA1 surface expression, and spontaneous neuronal activity, to test
      whether these gain-of-function-leaning variants alter the GluA1 route in
      the same direction as the isolated-epilepsy loss-of-function variants.
    experiment_type:
      preferred_term: ubiquitination and neuronal-activity assay
    readouts:
    - name: GluA1 ubiquitination and surface expression by PVNH7 variant
      target: phenotypes#Seizures
      assays:
      - preferred_term: ubiquitination assay
      direction: ALTERED
      interpretation: >-
        A change in GluA1 ubiquitination or surface level with a PVNH7 variant
        would support a malformation-independent route to the seizure phenotype.
    controls:
    - name: Wild-type NEDD4L
      description: Wild-type ligase as the GluA1-ubiquitination reference.
    decision_criterion: >-
      The GluA1 route is supported for PVNH7 if its HECT-domain variants
      measurably change GluA1 ubiquitination, surface GluA1, or spontaneous
      neuronal activity relative to wild-type NEDD4L.
    would_support:
    - phenotypes#Seizures

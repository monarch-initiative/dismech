      explanation: Monogenic autosomal dominant disorder arising from de novo, mosaic, or inherited germline NEDD4L variants.
notes: >-
  No GeneReviews chapter covers NEDD4L or PVNH7: a PubMed genereviews[book]
  search on the disease title and on NEDD4L[TIAB] returned no chapter, and the
  three heterotopia chapters returned concern other genes. The phenotype
  baseline is the original nine-patient report (PMID:27694961) and the
  15-patient literature summary in PMID:36934385. The general
  Periventricular_Nodular_Heterotopia entry carries a NEDD4L branch node; this
  entry curates the gene-defined disease itself.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    Heterozygous NEDD4L variants act dominantly. Most arise de novo, but low-level
    parental germline/somatic mosaicism has been documented in two families, and
    one family transmits the WW-domain variant p.Arg208Gln through a
    non-mosaic mother with intrafamilial variability ranging from isolated
    heterotopia to severe epilepsy.
  evidence:
  - reference: PMID:32117442
    reference_title: "Recurrent NEDD4L Variant in Periventricular Nodular Heterotopia, Polymicrogyria and Syndactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While six pathogenic variants occurred de novo, parental mosaicism accounts for three reported cases"
    explanation: Summarises the de novo and parental-mosaic origins of the reported variants.
  - reference: PMID:32117442
    reference_title: "Recurrent NEDD4L Variant in Periventricular Nodular Heterotopia, Polymicrogyria and Syndactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the first familial occurrence, not associated with parental mosaicism, of a pathogenic variant in the NEDD4L gene with broad intra-familial phenotypic variability, varying from relatively well-functioning carriers with isolated PNH on brain MRI, to a severely affected case with profound developmental delay, refractory seizures, and PNH-PMG."
    explanation: Documents dominant transmission with variable expressivity in a single family.
  - reference: PMID:30393983
    reference_title: "Familial NEDD4L variant in periventricular nodular heterotopia and in a fetus with hypokinesia and flexion contractures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observation of parental mosaicism in two out of seven families with NEDD4L-associated PVNH warrants caution and should be specifically addressed in parental carrier testing and genetic counseling."
    explanation: Parental mosaicism raises recurrence risk above that expected for a de novo dominant variant.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been measured; a 2023 literature review
    counted 15 molecularly confirmed PVNH7 patients across 11 families carrying
    eight distinct NEDD4L pathogenic variants worldwide.
  evidence:
  - reference: PMID:36934385
    reference_title: "Genetic analysis of periventricular nodular heterotopia 7 caused by a novel NEDD4L missense mutation: Case and literature summary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, at present, only eight NEDD4L pathogenic variants have been identified across 15 cases of PVNH7 worldwide."
    explanation: Literature summary establishing 15 reported PVNH7 cases worldwide as of 2023.
pathophysiology:
- name: NEDD4L Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous germline missense variants in NEDD4L. Nearly all reported
    variants map to the C-terminal catalytic HECT domain (for example
    p.Glu873Lys, p.Glu893Lys, p.Arg897Gln, p.Gln900Arg); the recurrent
    p.Arg208Gln lies in a WW substrate-recognition domain.

name: Periventricular Nodular Heterotopia 7
category: Mendelian
creation_date: "2026-11-07T00:00:00Z"
synonyms:
- PVNH7
- NEDD4L periventricular nodular heterotopia
- periventricular nodular heterotopia caused by mutation in NEDD4L
- NEDD4L-related disorder
description: >-
  Periventricular nodular heterotopia 7 (PVNH7) is an ultra-rare autosomal
  dominant malformation of cortical development caused by heterozygous missense
  variants in NEDD4L, which encodes a HECT-type E3 ubiquitin ligase expressed in
  the ventricular zone and cortical plate of the developing brain. Most variants
  cluster in the catalytic HECT domain and appear to leave the ligase active or
  constitutively activated while making the protein unstable; they deregulate
  AKT-mTOR and TGF-beta/Smad2/3 signalling, and in the embryonic mouse cortex
  they arrest neurons in the ventricular/subventricular and intermediate zones
  and disrupt terminal translocation, producing bilateral nodules of grey matter
  along the lateral ventricles. The syndrome combines periventricular nodular
  heterotopia, frequently with perisylvian polymicrogyria, with global
  developmental delay or intellectual disability, hypotonia, seizures (often
  early-onset and drug-resistant), 2-3 toe syndactyly and cleft palate. Variants
  are usually de novo, but parental mosaicism and a familial variant with
  marked intrafamilial variability are documented.

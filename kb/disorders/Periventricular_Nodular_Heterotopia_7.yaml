      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional experiments demonstrated that Gln900Arg probably did not lead to transcriptional abnormalities in this patient, instead leading to increased ubiquitination activity owing to the constitutive activation of the HECT domain, thereby promoting protein degradation."
      explanation: Links a HECT-domain patient variant to constitutively activated ubiquitination and reduced NEDD4L protein.
- name: Aberrant NEDD4L Ubiquitin Ligase Activity
  biological_scale: MOLECULAR
  description: >-
    HECT-domain variants leave the ligase catalytically active, apparently
    enhancing its activity, while making the mutant protein sensitive to
    proteasomal degradation, so less NEDD4L protein carries more activity per
    molecule. A WW-domain variant is instead proposed to impair substrate
    recognition (loss of function); the direction of the net effect is
    recorded as a controversy in discussions.

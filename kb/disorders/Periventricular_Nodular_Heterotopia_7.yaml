- name: AKT-mTOR and TGF-beta Signalling Deregulation
  conforms_to: "apical_neuroependyma_integrity_failure#NEDD4L AKT-mTOR Signaling Branch"
  biological_scale: CELLULAR
  description: >-
    In neuronal cells, PVNH-associated NEDD4L mutants raise phosphorylated S6
    (mTORC1 activity) and phosphorylated AKT (Thr308 and Ser473), and disturb
    the cross-talk between AKT and Smad2/3 in activin/TGF-beta signalling. A
    patient lymphoblastoid cell line did not show increased AKT-mTOR activity,
    so the magnitude of the effect at endogenous expression is uncertain. Dab1
    (Reelin pathway) disruption is not recorded here because, in the same
    study, it was caused by excess wild-type NEDD4L rather than by the patient
    mutants.

        pathway associated with a slowly progressive leukoencephalopathy.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Proton magnetic resonance spectroscopy of the brain revealed highly elevated levels of the
        polyols ribitol and D-arabitol, which were subsequently also found in high concentrations in body
        fluids.
      explanation: The enzyme-deficient patient accumulates ribitol and D-arabitol in brain and body fluids.

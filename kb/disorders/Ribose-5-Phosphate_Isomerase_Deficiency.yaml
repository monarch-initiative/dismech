name: Ribose-5-Phosphate Isomerase Deficiency
creation_date: '2026-11-20T00:00:00Z'
category: Mendelian
synonyms:
- RPI deficiency
- Ribose-5-P isomerase deficiency
- RPIA deficiency
description: >-
  Ribose-5-phosphate isomerase (RPI) deficiency is an exceptionally rare autosomal
  recessive inborn error of the reversible (non-oxidative) branch of the pentose
  phosphate pathway, caused by biallelic pathogenic variants in RPIA. RPI
  interconverts ribose-5-phosphate and ribulose-5-phosphate. Its deficiency leads
  to accumulation of the polyols ribitol and D-arabitol, which are highly elevated
  in the brain and in body fluids, with concentrations rising from plasma to
  cerebrospinal fluid to brain. Affected individuals present with a slowly
  progressive leukoencephalopathy and peripheral (sensorimotor) neuropathy,
  together with psychomotor delay, epilepsy, and a childhood-onset slow
  neurological regression with ataxia, spasticity and optic atrophy. Only four
  patients have been reported; the index patient was described in 1999, before
  the enzyme defect was identified. Diagnosis rests on urine polyol analysis and
  RPIA sequencing. No disease-specific treatment exists.

notes: >-
  MONDO:0012073 (ribose-5-P isomerase deficiency) cross-references OMIM:608611 and
  Orphanet:440706, and the Orphanet record (ORPHA:440706) names RPIA (hgnc:10297)
  as the disease-causing gene. This matches IEMbase WP-008 seed row 3.5.02.01. The
  index patient (PMID:10589548, 1999) was reported with the polyol abnormality
  before the RPI enzyme and RPIA variants were identified in the same individual
  (PMID:14988808, 2004). Two further patients were reported in 2017 (Naik et al.,
  Neurology, PMID:28801340, not cited here because PubMed holds no abstract for
  it) and 2018 (PMID:30088433), and a fourth in 2019 (PMID:31247379). With four
  patients and no published frequency data, phenotypes below carry no frequency
  band.

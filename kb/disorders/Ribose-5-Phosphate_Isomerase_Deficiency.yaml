mechanistic_hypotheses:
- hypothesis_group_id: polyol_accumulation_white_matter_toxicity
  hypothesis_label: Polyol accumulation drives white matter disease
  status: EMERGING
  description: >-
    The working model is that loss of RPI activity diverts pentose phosphates into
    the polyols ribitol and D-arabitol, which accumulate most strongly in the brain
    and cause the leukoencephalopathy. The steep plasma-to-CSF-to-brain gradient
    points to a primary neurometabolic process. How the polyols injure white
    matter is not established: polyol incubation of rat cortex increased
    superoxide production and antioxidant enzyme activity but did not oxidize
    proteins or lipids, and the authors concluded the polyols probably have a
    secondary effect on pathophysiology.
  evidence:
  - reference: PMID:10589548
    reference_title: Leukoencephalopathy associated with a disturbance in the metabolism of polyols.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The strong plasma/ cerebrospinal fluid/brain gradient, with concentrations increasing in that
      order, suggests a primary neurometabolic disorder.
    explanation: The brain-highest polyol gradient in the index patient points to a primary neurometabolic
      process in the brain.
  - reference: PMID:24970317
    reference_title: Polyols accumulated in ribose-5-phosphate isomerase deficiency increase mitochondrial
      superoxide production and improve antioxidant defenses in rats' prefrontal cortex.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: Our data allow us to conclude that, at least in our methodological conditions, arabitol and
      ribitol probably have a secondary effect on the pathophysiology of ribose-5-phosphate isomerase deficiency.
    explanation: Rat cortex incubated with the accumulating polyols showed no protein or lipid oxidation,
      arguing against direct oxidative toxicity as the main driver of the white matter disease.
    directness: INDIRECT
genetic:
- name: Biallelic RPIA pathogenic variants
  gene_term:
    preferred_term: RPIA
    term:
      id: hgnc:10297
      label: RPIA
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    The index patient was compound heterozygous for an RPIA frameshift (null) allele
    and the missense allele p.Ala61Val. The fourth reported patient carried the
    missense variant c.770T>C p.(Ile257Thr) in exon 8. Molecular study of the index
    patient's cells indicates that disease needs a null allele combined with a
    partially active allele that also has cell-type-dependent expression deficits.
  inheritance:
  - name: Autosomal recessive inheritance
  evidence:
  - reference: PMID:14988808
    reference_title: 'Ribose-5-phosphate isomerase deficiency: new inborn error in the pentose phosphate
      pathway associated with a slowly progressive leukoencephalopathy.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: RPI gene-sequence analysis revealed a frameshift and a missense mutation.
    explanation: Identifies the two RPIA variants in the first patient.
  - reference: PMID:30088433
    reference_title: 'Further Delineation of Ribose-5-phosphate Isomerase Deficiency: Report of a Third
      Case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole-exome sequencing demonstrated 2 mutations in the ribose-5-phosphate isomerase gene,
      RPIA, in a child with neonatal onset leukoencephalopathy and psychomotor delays.
    explanation: A further patient with two RPIA variants and the same leukoencephalopathy phenotype.
  - reference: PMID:31247379
    reference_title: Confirmation of a Rare Genetic Leukoencephalopathy due to a Novel Bi-allelic Variant
      in RPIA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report on a subject with RPIA associated progressive leukoencephalopathy with elevated urine
      arabitol and ribitol levels and a novel missense variant c.770T > C p.(Ile257Thr) in exon 8 of RPIA.
    explanation: A fourth patient with an RPIA missense variant, leukoencephalopathy and the characteristic
      urinary polyols.
pathophysiology:
- name: RPIA Ribose-5-Phosphate Isomerase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic RPIA variants reduce ribose-5-phosphate isomerase activity, the step
    of the reversible pentose phosphate pathway that interconverts
    ribose-5-phosphate and ribulose-5-phosphate. Deficient activity was shown in
    patient fibroblasts. The disease allele combination is a null allele with a
    partially active allele whose enzyme concentration and mRNA expression differ
    between cell types, and a transgenic yeast model reproduces the metabolite
    and enzyme-activity changes.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    description: Index patient genotype, a frameshift null allele with the partially active p.Ala61Val
      allele.
  genes:
  - preferred_term: RPIA
    term:
      id: hgnc:10297
      label: RPIA
  molecular_functions:
  - preferred_term: ribose-5-phosphate isomerase activity
    modifier: DECREASED
    term:
      id: GO:0004751
      label: ribose-5-phosphate isomerase activity
  biological_processes:
  - preferred_term: non-oxidative pentose phosphate pathway
    modifier: DECREASED
    term:
      id: GO:0009052
      label: pentose-phosphate shunt, non-oxidative branch
  evidence:
  - reference: PMID:14988808
    reference_title: 'Ribose-5-phosphate isomerase deficiency: new inborn error in the pentose phosphate
      pathway associated with a slowly progressive leukoencephalopathy.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deficient activity of RPI, one of the pentose-phosphate-pathway (PPP) enzymes, was demonstrated
      in fibroblasts.
    explanation: Direct enzymatic demonstration of RPI deficiency in patient-derived fibroblasts.
  - reference: PMID:20499043
    reference_title: 'The difference between rare and exceptionally rare: molecular characterization of
      ribose 5-phosphate isomerase deficiency.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Taken together, our results demonstrate that RPI deficiency is caused by the combination of
      a RPI null allele with an allele that encodes for a partially active enzyme which has, in addition,
      cell-type-dependent expression deficits.
    explanation: Patient-cell and yeast studies define the allele combination behind the enzyme deficiency.
  downstream:
  - target: Ribitol and D-Arabitol Accumulation
    description: >-
      Loss of RPI activity leads to accumulation of the polyols ribitol and
      D-arabitol, first found by brain proton MR spectroscopy and then in body
      fluids.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Accumulating pentose phosphates and pentoses are reduced to their polyols.
    evidence:

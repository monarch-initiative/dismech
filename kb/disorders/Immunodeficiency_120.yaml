- name: Ineffective Replication Factor C Recruitment
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Replication factor C is the clamp loader that places PCNA on DNA so that polymerase delta can
    begin synthesis. Less assembled polymerase delta means less effective RFC recruitment, so
    fewer replication events start. The deficit is at initiation rather than at elongation, which
    is why the cellular phenotype is a reduced fraction of cells in S phase rather than slow
    replication in all of them.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four published POLD1 patients in two unrelated families: three relatives across two
    generations of a consanguineous Turkish kindred, and one man from a non-consanguineous
    family. A fifth patient is described in the 2026 transplant report — an 18-year-old woman
    with POLD1 deficiency — whose relationship to the two published families is not stated
    there, so she is not counted here and the count above may be an undercount by one.

    No population estimate exists. Consanguinity is the route to the homozygous genotype in one
    family and p.Arg1060Cys is absent from every population database checked, so no founder
    effect or carrier frequency can be inferred. rate_per_100000 is left unset rather than
    computed from four cases.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "To our knowledge, no germline biallelic mutations affecting this complex have been reported in humans."
    explanation: >-
      The size of the literature at the point the entity was defined — none, which is what makes
      the current total of four the whole of it.
progression:
- phase: Recurrent infection in early childhood, unrecognised
  notes: >-
    The index patient had recurrent upper and lower respiratory infection from early life,
    hearing loss at three, adenotonsillectomy at five and a half, severe chickenpox at six, four
    to five intravenous-antibiotic episodes a year, and recurrent herpes from nine. She was
    referred for immunological evaluation at twelve.

    That is nine years of infection before anybody counted a lymphocyte, and it is the natural
    history this entry exists to shorten. What eventually triggered the referral was the
    herpetic pattern, not the respiratory one.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Investigation into her recurrent herpetic infections revealed marked lymphopenia, for which she was referred for immunological evaluation at 12 years of age."
    explanation: The age at referral and the finding that prompted it.
- phase: Stabilisation on immunoglobulin replacement
  notes: >-
    Immunoglobulin replacement resolved the lower respiratory infections in the index patient
    and markedly reduced the herpetic ones, which is more than replacement would be expected to
    do for a viral phenotype and is recorded as reported. The second family's POLD1 patient is
    on subcutaneous immunoglobulin with antibacterial and antifungal prophylaxis.

    Stabilisation is not resolution: the underlying proliferation defect is unchanged, and
    whatever airway damage has already occurred is permanent.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "She was started on immunoglobulin replacement therapy, which resulted in the resolution of LRTI and markedly decreased herpetic infections."
    explanation: The treatment response in the index patient, covering both the bacterial and the viral phenotype.
- phase: Transplant in adulthood
  notes: >-
    A 2026 report describes the first successful haematopoietic stem cell transplant in POLD1
    deficiency, in an 18-year-old woman with recurrent pulmonary infections and shingles who was
    dependent on immunoglobulin replacement. Two years on she has improved T-cell counts and
    function and no longer needs replacement.
  evidence:
  - reference: PMID:42104577
    reference_title: "Successful Treatment of POLD1 Deficiency With HSCT: Report of Two Years' Experience."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Post-HSCT follow-up demonstrated improved T-cell counts and function, and the patient remained well without IgRT."
    explanation: The outcome at two years, and the endpoint that matters — freedom from replacement.
genetic:
- name: POLD1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: POLD1
    term:
      id: hgnc:9175
      label: POLD1
  notes: >-
    The causal gene, and one where the allele class decides the disease. Biallelic hypomorphic
    missense causes this entity. Heterozygous variants in the exonuclease (proofreading) domain
    cause colorectal cancer predisposition, by a mechanism that is functionally the opposite —
    the authors of the second paper describe it as a loss of function that produces a functional
    gain of function through an increased mutation rate. The recurrent heterozygous p.Ser605del
    causes MDPL syndrome.

    The founding kindred contains the cleanest possible statement of that separation: several
    extended family members had colon and rectal cancers and none of them carried the mutant
    allele. A family history of colorectal cancer in a POLD1 kindred is not evidence that the
    immunodeficiency allele predisposes to it.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These results identify gene defects in POLD1 as a novel cause of T-cell immunodeficiency."
    explanation: The gene-disease claim as the authors state it.
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A number of extended family members had colon and rectal cancers but did not carry the mutant allele."
    explanation: >-
      Graded REFUTE against the inference that this allele carries the cancer risk POLD1 is
      otherwise known for. The cancers and the allele segregate apart in the one family where
      both are present, which is a stronger separation than any argument from domain position.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In familial colorectal cancer, this could be explained by the hypermutator phenotype, in which POLD1 loss of function leads to a functional gain of function (increased mutation rate)"
    explanation: >-
      Why the same gene gives a dominant cancer syndrome and a recessive immunodeficiency. Graded
      INDIRECT because it explains the allelic series rather than establishing anything about
      this entity.
diagnosis:
- name: Lymphocyte subset enumeration
  description: >-
    T-cell lymphopenia with profound CD4 depletion is the finding that converts a recurrent
    infection history into an immunodeficiency diagnosis, and in the index kindred it was ordered
    only after nine years of infections. Subset work adds the naive-to-effector-memory skewing
    that distinguishes an exhausted, proliferation-limited compartment from a production failure.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Her immunological workup was particularly notable for profound CD3+CD4+ lymphopenia."
    explanation: The diagnostic finding, in the patient whose referral it followed.
- name: Lymphocyte proliferation assay
  description: >-
    The assay that localises the lesion. Impaired T-cell but preserved B-cell proliferation is
    the pattern here, and it is what distinguishes this from a production or survival defect.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "T-cell lymphopenia with impaired T-cell but not B-cell proliferation"
    explanation: The selective proliferation defect, which is the diagnostic signature of this disease.
- name: DNA repair assay after genotoxic stress
  presence: ABSENT
  description: >-
    Recorded as a negative. A clinician faced with a combined immunodeficiency and syndromic
    features will reasonably think of the DNA-repair immunodeficiencies and send a repair assay.
    In these patients it is normal, and that normal result is informative rather than
    uninformative: it places the lesion at replication rather than at repair.
  evidence:
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients' cells showed impaired cell-cycle progression and replication-associated DNA lesions that were reversible upon overexpression of polymerase δ."
    explanation: >-
      The cellular phenotype that is present — a cell-cycle defect with replication-associated
      lesions. Graded INDIRECT for this diagnostic entry because it establishes what is abnormal
      rather than quoting the normal repair result directly; the repair-normal finding is
      reported in the paper body and in the deep-research report.
- name: Exome or targeted panel sequencing
  description: >-
    How both families were diagnosed. In the consanguineous kindred, homozygosity mapping on
    exome data narrowed to a 14 Mb region on chromosome 19 containing nine genes, of which POLD1
    was the candidate; in the other family a targeted inborn-errors-of-immunity panel found the
    variants and exome sequencing excluded other biallelic candidates.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Knowing that the family is consanguineous, we executed homozygosity mapping using their WES data"
    explanation: >-
      The analytic step that made a single-kindred exome informative, which is the reason
      consanguinity is a diagnostic asset as well as a risk factor.
treatments:
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    The mainstay. In the index patient it resolved the lower respiratory infections and markedly
    decreased the herpetic ones; the second family's POLD1 patient receives subcutaneous
    immunoglobulin alongside antibacterial and antifungal prophylaxis.

    The reduction in herpetic episodes is the part worth noticing. Replacement supplies antibody,
    and control of a latent herpesvirus is a T-cell job, so a large effect on herpes recurrence
    is not what the mechanism predicts. It is recorded as reported, in one patient, without an
    explanation attached.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Defective T-Dependent Antibody Response
    description: >-
      Replacement substitutes for the antibody the patient cannot generate. It addresses the
      humoral consequence and leaves the T-cell proliferation defect that produced it untouched.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "She was started on immunoglobulin replacement therapy, which resulted in the resolution of LRTI and markedly decreased herpetic infections."
    explanation: The response, in the one patient for whom a before-and-after is reported.
- name: Aciclovir for Herpetic Episodes
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Given for the index patient's recurrent herpes zoster. No outcome is reported, and the
    sources do not say whether it was episodic or prophylactic — which matters, since suppression
    is the plausible strategy in a patient with monthly recurrences and the sources do not
    establish that it was used that way.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: aciclovir
      term:
        id: CHEBI:2453
        label: acyclovir
  target_mechanisms:
  - target: Recurrent Herpetic Infection
    description: >-
      Antiviral treatment of the episodes the immune defect permits. It does not address the
      repertoire contraction underneath them.
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "several episodes of recurrent herpes zoster for which she received acyclovir therapy"
    explanation: >-
      That the drug was given, and for what. Graded INDIRECT because the source records the
      prescription and no outcome.
- name: Haematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The only reported route to correcting the immune defect rather than substituting for it. A
    2026 report describes the first successful transplant in POLD1 deficiency: an 18-year-old
    woman with recurrent pulmonary infections and shingles, dependent on immunoglobulin
    replacement, transplanted from a matched related donor using reduced-intensity conditioning
    with cyclophosphamide, fludarabine and anti-thymocyte globulin, with bone marrow and
    peripheral blood as stem-cell sources and tacrolimus plus low-dose methotrexate for
    graft-versus-host disease prophylaxis. Engraftment was prompt and without major
    complications; at two years her T-cell counts and function were improved and she no longer
    needed replacement.

    The reason it is a report rather than a routine option is a specific and well-founded fear:
    conditioning regimens work by damaging DNA, and a disease of the replicative polymerase
    raises the question of regimen-related toxicity. The family were told about that concern
    before the decision. Reduced-intensity conditioning was chosen against it, and the result
    argues the fear may be manageable — in one patient.
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired T Cell Clonal Proliferation
    description: >-
      Replacing the haematopoietic compartment with donor cells that carry two working POLD1
      alleles removes the proliferation ceiling in the lineage where it matters. It does nothing
      for the non-haematopoietic consequences of the same defect.
  evidence:
  - reference: PMID:42104577
    reference_title: "Successful Treatment of POLD1 Deficiency With HSCT: Report of Two Years' Experience."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "She underwent HSCT from a matched related donor using a reduced-intensity regimen (cyclophosphamide, fludarabine, ATG) with bone marrow and peripheral blood as stem cell sources."
    explanation: The regimen and the graft source, in enough detail to be acted on.
  - reference: PMID:42104577
    reference_title: "Successful Treatment of POLD1 Deficiency With HSCT: Report of Two Years' Experience."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Patients considered for HSCT may be at increased risk of regimen-related toxicity due to impaired DNA repair."
    explanation: >-
      The stated concern the reduced-intensity choice was made against. Worth recording even
      though this entry's own mechanism section notes that repair after genotoxic stress was
      normal in these patients — the clinical worry and the laboratory finding point different
      ways, and a transplant decision has to be made without that being settled.
  notes: >-
    One patient, two years, one report. It is not a series and this entry does not present it as
    one. What it establishes is feasibility against a specific fear, not a standard of care.
discussions:
- discussion_id: imd120_cd8_asymmetry
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why does a general restriction on cell-cycle entry produce oligoclonality and restricted
    receptor V-J pairing in CD8 but not CD4 T cells?
  rationale: >-
    Polymerase delta is required by every dividing cell, so the naive expectation is a uniform
    proliferation ceiling. What is observed is asymmetric: naive CD8 cells are lost more than
    naive CD4 cells, and the repertoire contraction is confined to CD8.

    The founding authors offer two candidate explanations in one sentence — a difference in
    peripheral CD8 expansion, or a difference in thymic selection — and commit to neither. The
    distinction is testable and consequential. If it is peripheral, the repertoire should
    contract progressively with age and antigen exposure, and a transplant should restore it. If
    it is thymic, the defect is set early and a transplant in an adult with an involuted thymus
    may restore counts without restoring breadth.

    The 2026 transplant report gives improved T-cell counts and function at two years but does
    not report repertoire sequencing, which is exactly the measurement that would separate them.
  attaches_to:
  - pathophysiology#Contracted Oligoclonal T Cell Repertoire
  - treatments#Haematopoietic Stem Cell Transplantation
  evidence:
  - reference: PMID:31629014
    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "suggesting that POLD1R1060C differentially affects peripheral CD8+ T-cell expansion and possibly thymic selection"
    explanation: >-
      The authors' own two-part hypothesis, quoted with its hedge — the reason this is an open
      question rather than a mechanism node.
- discussion_id: imd120_conditioning_toxicity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does a defect in the replicative polymerase increase the risk of conditioning-regimen
    toxicity, when DNA repair after genotoxic stress is normal in these patients?
  rationale: >-
    This is a case where the clinical worry and the laboratory finding point in different
    directions, and a real decision had to be made without resolving it.

    The transplant team's stated concern was regimen-related toxicity from impaired DNA repair.
    The mechanistic work in this disease reports the opposite: repair after genotoxic stress was
    normal, and the lesion is in S-phase progression. If that is right, POLD1 deficiency is
    unlike the DNA-repair immunodeficiencies where conditioning toxicity is a documented problem,
    and the caution may be borrowed rather than earned.

    One reduced-intensity transplant went well. That is consistent with the caution being
    unnecessary and equally consistent with reduced-intensity conditioning having been the
    reason it went well. Distinguishing them needs more patients, or a direct measurement of
    alkylator and fludarabine sensitivity in patient cells — which nobody has published.
  attaches_to:
  - treatments#Haematopoietic Stem Cell Transplantation
  - pathophysiology#Impaired S-Phase Progression and Replicative Stress
- discussion_id: imd120_syndromic_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the syndromic features of POLD1 deficiency — short stature, microcephaly, cognitive
    impairment, hearing loss — a direct developmental consequence of reduced polymerase delta, or
    consequences of the infections the immunodeficiency permits?
  rationale: >-
    Both readings are supported by different patients in the published set, which is why this is
    a gap rather than a controversy.

    For a direct effect: the second family's POLD1 patient has short stature, microcephaly and a
    measured IQ around 70 with no reported encephalitis, and microcephaly in particular is what a
    proliferation-limited neural progenitor pool would produce.

    Against it: in the Turkish kindred the one patient with intellectual impairment, hearing
    deficit and speech delay acquired all three after a varicella encephalitis at age three, the
    index patient's language delay is attributable to her hearing loss, and the younger sister
    has normal hearing and normal growth on the same homozygous allele.

    Four patients cannot settle it. What would help is head circumference and growth data on
    patients without a severe infection history, and — since there is now a transplanted patient
    — whether restoring the immune compartment changes the developmental trajectory.
  attaches_to:
  - pathophysiology#Syndromic Developmental Features
  - phenotypes#Microcephaly
  - phenotypes#Developmental and Speech Delay
notes: >-
  Scope, and a within-paper attribution problem. This entry is POLD1 only. The 2019 paper that
  defined human polymerase delta deficiency describes two patients: P1 with a homozygous POLD2
  variant and P2 with biallelic POLD1 variants. They share a syndrome and are reported together,
  and only P2 belongs here.

  That matters because it is easy to get wrong. The deep-research report committed alongside this
  entry attributes P1's chronic facial molluscum contagiosum, recurrent skin abscesses and
  bronchiectasis-since-six-months to POLD1. None of those are curated here. P2's own
  respiratory phenotype is chronic bronchitis progressing to bronchiectasis, his skin finding is
  warts negative for common papillomavirus strains, and his syndromic features are short stature,
  microcephaly, an IQ around 70 and hearing impairment. Every phenotype evidence item in this
  entry is quoted so that the patient it belongs to is identifiable from the snippet.

  This is Named Entity Confusion inside a single publication rather than across publications —
  two patients, two genes, one shared syndrome name. The usual preflight checks that a report is
  about the right disease; they do not check that a within-paper finding is attributed to the
  right patient.

  Patient count. Four published POLD1 patients: three in the Turkish kindred and P2 of the 2019
  series. The 2026 transplant report describes an 18-year-old woman with POLD1 deficiency whose
  relationship to those families is not stated, so she may be a fifth.

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index (snapshot 2026-09-10).

  Allele class. POLD1 gives at least three diseases depending on the allele: this recessive
  hypomorphic immunodeficiency, dominant proofreading-domain colorectal cancer predisposition,
  and MDPL syndrome from the recurrent heterozygous p.Ser605del. The founding kindred contains
  the cleanest available separation of the first two — extended family members with colon and
  rectal cancer who did not carry the mutant allele — and it is recorded as a REFUTE evidence
  item on the gene rather than as prose, so it is queryable.

  What is not curated. The deep-research report cites tumour-biology work on POLD1 regulation by
  copy-number gain, promoter methylation and miR-139-3p. That is cancer biology in a different
  allele class and is not a mechanism of this entity. It is left out rather than included with a
  caveat.

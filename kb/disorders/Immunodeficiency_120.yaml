phenotypes:
- name: Recurrent Herpetic Infection
  category: Immune
  description: >-
    The feature that brought the index patient to immunology. Recurrent oral herpes every one to
    two months from age nine, with several episodes of herpes zoster requiring aciclovir; her
    younger sister also has recurrent oral herpes; their aunt has had recurrent oral herpetic
    infection since a varicella encephalitis in early childhood.

    In this kindred it was the herpetic infections rather than the respiratory ones that
    prompted the lymphocyte count — the respiratory infections had been treated as ordinary for
    nine years.

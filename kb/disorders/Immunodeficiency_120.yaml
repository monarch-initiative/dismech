- name: Reduced Intrinsic Polymerase Catalytic Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The second route to the same deficit: substitutions near the polymerase active site lower
    catalytic activity without destabilising the complex. The two families therefore differ in
    biochemistry and agree in phenotype, which is the argument that the disease follows from
    reduced polymerase delta output rather than from a property of one allele.

    In the second family's cells the replication-associated lesions were reversible on
    overexpressing polymerase delta, which is the rescue that establishes the direction of
    causation.

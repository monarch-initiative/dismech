- name: Contracted Oligoclonal T Cell Repertoire
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Naive CD4 and especially CD8 cells are depleted in favour of effector memory subsets, and the
    CD8 compartment is oligoclonal with restricted T-cell receptor beta-chain V-J pairing while
    the CD4 compartment is not. The authors read that asymmetry as POLD1 affecting peripheral
    CD8 expansion and possibly thymic selection differently from CD4.

    A repertoire that is both small and skewed is what makes this a viral rather than a
    pyogenic immunodeficiency: containing a herpesvirus needs a specific clone to expand, and
    there are fewer clones and less capacity to expand them.

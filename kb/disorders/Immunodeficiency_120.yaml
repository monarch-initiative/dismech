    reference_title: "Combined immunodeficiency caused by a loss-of-function mutation in DNA polymerase delta 1."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Starting age 9 years, she had recurrent oral herpes infections every 1-2 months as well as several episodes of recurrent herpes zoster for which she received acyclovir therapy. Investigation into her recurrent herpetic infections revealed marked lymphopenia"
    explanation: >-

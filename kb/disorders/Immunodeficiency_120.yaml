      the presentation that led to the diagnosis.
- name: Recurrent Respiratory Tract Infection
  category: Respiratory
  description: >-
    Recurrent upper and lower respiratory infection from early life in the index patient, four
    to five lower respiratory episodes a year requiring intravenous antibiotics, with
    adenotonsillectomy at five and a half for recurrent upper respiratory infection and serous

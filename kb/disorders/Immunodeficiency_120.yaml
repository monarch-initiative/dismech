    snippet: "Both parents were heterozygous for the mutation. Her sister P2, who also suffered from recurrent infections, was found homozygous for the same mutation by Sanger sequencing, as was a paternal aunt P3"
    explanation: >-
      Carrier parents and homozygosity in all three affected relatives, which is the segregation
      that establishes recessive inheritance in this kindred.
  - reference: PMID:31449058
    reference_title: "Polymerase δ deficiency causes syndromic immunodeficiency with replicative stress."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Both genes show low pLI scores of 0.001 and 0.044, respectively, indicating a predicted tolerance to the loss of a single allele, and high pRec scores of 0.998 and 0.950, respectively, indicating a predicted high intolerance for a complete loss of function"
    explanation: >-
      The population-genetic prediction, which agrees with the observed inheritance and also
      explains why no null allele appears in this disease.
pathophysiology:
- name: Biallelic Hypomorphic POLD1 Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Two genotypes are published. The Turkish kindred is homozygous for c.3178C>T, p.Arg1060Cys,
    absent from gnomAD, ExAC, dbSNP and 1000 Genomes, found by homozygosity mapping in the
    largest of five runs of homozygosity and confirmed by Sanger sequencing in all three affected
    relatives.

    The second family's patient carries three heterozygous POLD1 variants making up two alleles:
    p.Gln684His and p.Ser939Trp inherited together in cis on the maternal allele, and
    p.Arg1074Trp on the paternal allele. Getting that configuration right matters, because two of
    the three substitutions are on one chromosome — a reader counting substitutions rather than
    alleles would conclude the patient has three hits when they have two.

    No null allele appears in either family, and none is expected to: complete POLD1 deficiency is
    embryonic lethal in mice, and POLD1's high pRec score predicts intolerance of complete loss of
    function in humans. Every disease allele here is hypomorphic by necessity.
  genes:
  - preferred_term: POLD1
    term:
      id: hgnc:9175
      label: POLD1
  genetic_context:
    genes:
    - preferred_term: POLD1
      term:
        id: hgnc:9175
        label: POLD1
    allele_type: a homozygous CysB-motif missense variant in one family, and two missense variants in cis opposite a third missense variant in the other
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Zygosity differs between the two families — homozygous in the Turkish kindred, compound
      heterozygous in the second — so the slot is left unset rather than asserting one family's
      configuration for both.
    notes: >-
      PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION, and the reasoning is not a hedge:
      complete polymerase delta loss is embryonic lethal in mice and predicted intolerable in
      humans, so a viable patient's alleles are hypomorphic by construction. Both genotypes were
      functionally tested and both retain activity.

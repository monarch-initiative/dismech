      A monogenic inborn error of immunity presenting as combined immunodeficiency, managed by
      immunology.
  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      IUIS Table 1, immunodeficiencies affecting cellular and humoral immunity. The pattern here

name: Immunodeficiency 120
category: Mendelian
creation_date: "2026-09-22T00:00:00Z"
synonyms:
- IMD120
- POLD1 deficiency
- POLD1-associated combined immunodeficiency
- combined immunodeficiency due to POLD1 deficiency
- DNA polymerase delta 1 deficiency
disease_term:
  preferred_term: immunodeficiency 120
  term:
    id: MONDO:0970994
    label: immunodeficiency 120
description: >-
  IMD120 is the combined immunodeficiency caused by biallelic hypomorphic variants in POLD1, the
  catalytic subunit of DNA polymerase delta. Four patients in two unrelated families are
  published: three members of a consanguineous Turkish kindred homozygous for p.Arg1060Cys, and
  one compound heterozygote in the series that first described human polymerase delta deficiency.

  The mechanism is a proliferation defect rather than a repair defect, and that distinction is
  the whole of the disease. Polymerase delta replicates both strands; a hypomorphic catalytic
  subunit reduces the enzyme's output, which impairs recruitment of replication factor C and so
  the initiation of replication, which restricts how many cells can enter and complete S phase.
  Lymphocytes are the cells that must expand fastest on demand, so they are the cells that fail.
  DNA repair after genotoxic stress was normal in these patients, which is what separates this
  from the DNA-repair immunodeficiencies it superficially resembles.

  Two biochemical routes converge on that output. p.Arg1060Cys sits in the C-terminal CysB
  metal-binding motif and destabilises the holoenzyme, lowering the steady-state amount of
  POLD1, POLD2 and POLD3 together. The compound heterozygous alleles sit near the polymerase
  active site and reduce catalytic activity with complex assembly intact. Different lesions,
  same phenotype — which is the strongest argument available that the phenotype follows from
  reduced polymerase delta output rather than from anything particular to one allele.

  Clinically it presents as recurrent herpetic infection on a background of recurrent
  respiratory infection, with T-cell lymphopenia, loss of naive CD4 and especially CD8 cells,
  a contracted oligoclonal repertoire, mild hypogammaglobulinaemia and absent vaccine responses.
  Immunoglobulin replacement resolved the lower respiratory infections and markedly reduced the
  herpetic episodes in the index patient, and a 2026 report describes the first successful
  haematopoietic stem cell transplant in the disease.

  POLD1 is pleiotropic, and the allele class decides which disease you get. Heterozygous
  proofreading-domain variants cause colorectal cancer predisposition; the recurrent
  heterozygous p.Ser605del causes MDPL syndrome. This entity is the biallelic hypomorphic one,
  and the founding kindred contains a recorded negative that makes the separation concrete:
  several extended family members had colon and rectal cancers and none of them carried the
  mutant allele.

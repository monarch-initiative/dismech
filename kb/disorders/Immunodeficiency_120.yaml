- name: Impaired S-Phase Progression and Replicative Stress
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A smaller fraction of cells enters and completes S phase, and replication-associated DNA
    lesions accumulate. The crucial control is what is *not* impaired: DNA repair after genotoxic
    stress was normal. That result is what places this disease among the proliferation defects
    rather than among the DNA-repair immunodeficiencies — ataxia-telangiectasia, Nijmegen
    breakage, LIG4 deficiency — which it otherwise resembles clinically.

    It also has a practical consequence recorded under treatments: a repair-competent cell is a
    different transplant-conditioning risk from a repair-deficient one, and the first HSCT in
    this disease was performed against exactly that uncertainty.

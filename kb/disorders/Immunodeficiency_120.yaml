inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic in both families. The Turkish kindred is homozygous with heterozygous parents and
    segregation confirmed by Sanger sequencing across three affected relatives in two
    generations; the second family's patient is compound heterozygous with a maternal allele
    carrying two substitutions in cis and a separate paternal allele. Heterozygous carriers are
    unaffected for this phenotype.

    The recessive prediction is also borne out at the gene level: POLD1 has a low pLI and a high
    pRec, meaning loss of one allele is predicted to be tolerated and loss of both is not — which
    is the population-genetic signature of a recessive disease gene and is stated explicitly by
    the authors.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

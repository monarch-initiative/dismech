- name: B and NK Cell Lymphopenia
  category: Immune
  description: >-
    Persistent CD4 T, B and NK cell lymphopenia in the second family's POLD1 patient. It matters
    because the Turkish kindred's defect was T-selective at the proliferation level, and a
    patient with reduced B and NK numbers as well shows the lesion is not confined to the T
    lineage even though the T lineage is where it bites hardest.

    B-cell maturation was nevertheless largely normal in that family: class-switched B cells were
    present and somatic hypermutation patterns were normal. So the B-cell defect is one of number
    rather than of function.

  phenotype_term:
    preferred_term: Recurrent oral herpes and herpes zoster
    term:
      id: HP:0005353
      label: Recurrent herpes
    temporality: RECURRENT
  notes: >-
    3 of 3 patients in the Turkish kindred. The general recurrent-herpes term is bound rather
    than HP:0410028 Recurrent oral herpes, because the index patient had zoster as well as oral
    herpes and the parent term covers both.
  evidence:

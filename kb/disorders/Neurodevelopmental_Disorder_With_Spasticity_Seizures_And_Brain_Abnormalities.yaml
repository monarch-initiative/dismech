  - target: Mis-splicing of Splicing-Factor and Cell-Cycle Transcripts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Removing NSRP1 shifts isoform ratios of other RNA splicing factors and of

- name: Mis-splicing of Splicing-Factor and Cell-Cycle Transcripts
  biological_scale: MOLECULAR
  description: >-
    Deleting Nsrp1 shifts the alternative processing of other RNA splicing
    factors and, through them, of cell-cycle and survival transcripts. The one
    global measurement of this was made in mouse thymocytes under CD4-Cre, where
    it produced a maturation arrest and uncontrolled cell growth and death. No
    equivalent measurement exists in any neural tissue, human or mouse, and no
    reported patient has immunodeficiency, so this node states a molecular
    consequence of NSRP1 loss without claiming the particular transcripts matter
    in the brain.

      reference_title: "NSrp70 is a lymphocyte-essential splicing factor that controls thymocyte development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Global splicing and transcriptional profiling revealed that NSrp70 regulates the cell cycle and survival of thymocytes by controlling the alternative processing of various RNA splicing factors, including the oncogenic splicing factor SRSF1"
      explanation: >-
        The only global splicing readout of NSRP1 loss in any tissue. It is a

discussions:
- discussion_id: nsrp1_human_survival_vs_animal_lethality
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  posed_by: "dismech curation (claim issue #18549)"
  posed_date: '2026-11-20T15:00:00Z'
  attaches_to:
  - pathophysiology#Biallelic NSRP1 Loss-of-Function Variants
  prompt: >-
    Why do people homozygous for NSRP1 loss-of-function alleles survive, when a
    null allele is lethal in mouse, in Drosophila and in Caenorhabditis elegans?
  rationale: >-
    The gene is essential in all three model organisms: the mouse gene-trap
    homozygote is not recovered after implantation, the nematode null arrests as
    an early larva, and the fly ortholog null is larval lethal. Patients live
    into adolescence. The founding authors state two alternatives and test
    neither: the human alleles may be hypomorphic rather than null, or human
    development may depend less on NSRP1, or be more redundant, than these
    animals' does. Which it is matters for the entry, because every model of
    this disease is currently either dead before the brain forms or confined to
    a lineage the disease does not involve. It also matters for the clinic: if
    the alleles are hypomorphic, the amount of residual function may be what
    separates the non-ambulatory patients from the one who walks.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "As homozygous null NSRP1 alleles are incompatible with life in M. musculus, D. melanogaster and C. elegans, the survival of these patients suggests these disease associated LoF variants may not be null alleles but rather hypomorphic LoF"
    explanation: >-
      The authors stating the mismatch and the first of their two alternative
      explanations.
  - reference: PMID:22285439
    reference_title: "CCDC-55 is required for larval development and distal tip cell migration in Caenorhabditis elegans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Although animals homozygous for a probable null allele, ccdc-55(ok2851), display an early larval arrest, RNAi depletion experiments allow the analysis of later phenotypes and suggest that CCDC-55 is needed within the DTC for migration to cease at the end of larval morphogenesis"
    explanation: >-
      Direct support for the hypomorph reading from the invertebrate side:
      partial depletion of the ortholog is viable where the null is not.
- discussion_id: nsrp1_downstream_splicing_targets_in_brain
  kind: KNOWLEDGE_GAP
  status: OPEN
  posed_by: "dismech curation (claim issue #18549)"
  posed_date: '2026-11-20T15:00:00Z'
  attaches_to:
  - pathophysiology#Disrupted Brain Development
  - pathophysiology#Mis-splicing of Splicing-Factor and Cell-Cycle Transcripts
  prompt: >-
    Which NSRP1-dependent splicing events occur in developing human neural
    cells, and which of them produce the cortical, callosal and cerebellar
    malformations?
  rationale: >-
    The entry's molecular half and its clinical half are joined by edges marked
    UNKNOWN, and that is the honest state of the field. The only global splicing
    profile of NSRP1 loss was made in mouse thymocytes. No neural transcriptome,
    patient-derived neural culture, organoid or conditional neural knockout has
    been published for this gene. Until one is, the entry can say that a
    splicing regulator is lost and that the cortex is malformed, without being
    able to say that the first produces the second.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "it will be important to examine how genes downstream of NSRP1 intersect with genes previously associated with CP, intellectual disability (ID), or epilepsy"
    explanation: The authors naming this gap as the next thing to do.
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "While early lethality has limited investigation of NSRP1's role in the brain, nito knockdown in D. melanogaster CCAP/buriscon neurons reduced axon outgrowth during the transition from larval to adult form"
    explanation: >-
      States why the gap exists, and gives the only neuronal result for the gene
      family: a fly axon-outgrowth phenotype.
- discussion_id: nsrp1_sr_protein_antagonism_contested
  kind: CONTROVERSY
  status: OPEN
  posed_by: "dismech curation (claim issue #18549)"
  posed_date: '2026-11-20T15:00:00Z'
  attaches_to:
  - pathophysiology#Unopposed SRSF1 and SRSF2 Splicing Activity
  prompt: >-
    Does losing NSRP1 actually release SRSF1 and SRSF2 from antagonism, given
    that knocking NSrp70 down changed neither their splicing activity nor their
    speckle localization?
  rationale: >-
    The same laboratory reported both results. In 2011 it found no change in
    alternative splicing activity or speckle localization when NSrp70 was
    knocked down by siRNA, and offered functional redundancy among SR proteins
    as one explanation. In 2016 it reported, using deletion constructs, that
    NSrp70 binds SRSF1 and SRSF2 and reverses their splicing activity, and that
    deleting its first RS-like region loses speckle positioning for both. The
    experiments differ, knockdown against domain deletion and overexpression, so
    this is not a flat contradiction; but the knockdown is the design that most
    resembles the patients' partial loss, and it was negative. The entry records
    the antagonism as a node because the 2016 result is direct, and records the
    negative alongside it rather than omitting it.
  evidence:
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we did not see any difference in terms of alternative splicing activity and speckle localization when NSrp70 expression was down-regulated by siRNA"
    explanation: The negative knockdown result, reported as data not shown.
  - reference: PMID:26797131
    reference_title: "Nuclear Speckle-related Protein 70 Binds to Serine/Arginine-rich Splicing Factors 1 and 2 via an Arginine/Serine-like Region and Counteracts Their Alternative Splicing Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we demonstrated that NSrp70 interacts physically with two SR proteins, SRSF1 and SRSF2, and reverses their splicing activity in terms of CD44 exon v5 as exon exclusion"
    explanation: The positive result from the later study.
- discussion_id: nsrp1_imaging_maturation_with_age
  kind: OPEN_QUESTION
  status: OPEN
  posed_by: "dismech curation (claim issue #18549)"
  posed_date: '2026-11-20T15:00:00Z'
  attaches_to:
  - phenotypes#Simplified gyral pattern
  - phenotypes#Under-opercularization
  prompt: >-
    Do the simplified gyral pattern and under-opercularization reflect a delay
    in brain maturation that partly resolves, or does the apparent improvement
    only reflect which patients were scanned when?
  rationale: >-
    The founding authors observed that the imaging abnormalities were more
    striking in patients scanned in infancy than in those scanned later, and
    proposed that this represents an early maturational delay that improves. The
    observation is cross-sectional across four patients, so the alternative
    reading, that the more severely affected happened to be imaged earlier, is
    not excluded. The authors themselves call for serial imaging. The answer
    changes how a radiologist should read a normal-looking later scan in a
    patient suspected of having this disorder.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These abnormalities were more striking in individuals who underwent imaging in infancy rather than later in childhood. This may represent an early delay in brain maturation which subsequently improves with age"
    explanation: >-
      The observation and the proposal, with the authors' own hedge preserved
      in the quote.
notes: >-
  Identifiers. MONDO:0859275 maps to OMIM 620001, which is the phenotype entry
  and the source of the NEDSSBA acronym; OMIM 616173 is the separate gene entry
  for NSRP1. The disease has no Orphanet, ICD-10 or ICD-11 code of its own, which
  is consistent with its description in 2021. There is no mappings entry for
  OMIM 620001 because the schema's only OMIM mapping slot is for phenotypic
  series, and 620001 is an individual record.

  No GeneReviews chapter and no StatPearls chapter exists for this disease or for
  NSRP1. Checked offline against the committed Bookshelf index snapshot of
  2026-09-10, which indexes 958 GeneReviews and 9,646 StatPearls chapters; both
  report NO_CHAPTER. The phenotype baseline for this entry therefore comes from
  the two primary clinical reports and from ClinGen's expert-panel summary,
  not from a review chapter.

  Sources. Only two clinical papers exist: PMID:34385670 (six patients, three
  families) and PMID:38808951 (one patient, the milder end). A PubMed search on
  NSRP1 returns eighteen records in total, of which those two are the only ones
  about the disease; the remainder are mechanistic studies of the protein or
  association studies in unrelated conditions. Three mechanistic papers are
  cited here, along with one nematode ortholog study. ClinGen's Cerebral Palsy
  Gene Curation Expert Panel counts four probands across the two clinical
  publications, which is fewer than the seven affected individuals, because
  siblings in a family share a proband.

  The weakest part of this entry is the join between its molecular and clinical
  halves. Four edges into and out of Disrupted Brain Development are marked
  UNKNOWN, and that is a statement about the literature rather than about the
  curation: nobody has studied NSRP1 in neural tissue, because the animal nulls
  die before there is any. Anyone extending this entry should treat those four
  edges as the place where new evidence would land first.

  Microcephaly deserves a reader's caution. It is recorded in five of six
  patients, but the reported Z-score range runs from -0.95 to -5.60, and -0.95
  is within the normal range. The founding paper calls the microcephaly
  variable for this reason.

  Two phenotypes carry a binding caveat in their own notes: under-opercularization,
  for which HPO has no term, and early death, for which the source gives no age
  and so no age-specific HPO term can be bound.
review_notes: >-
  Deliberately unbound terms. Two phenotype rows depart from the usual
  pattern and the reasoning is recorded on each row rather than only here:
  Under-opercularization is bound to HP:0002538 Abnormal cerebral cortex
  morphology because HPO has no opercularization term, and Early death carries no
  phenotype_term at all because every HPO death term is age-specific and the
  cached full text gives no age at death.

  Deliberately not curated from the deep-research report. The antigravity report
  for this entry proposed content that its own cited sources do not carry, and
  the following were checked against the cached full text and rejected:
  specific antiseizure drugs (levetiracetam, valproate, phenobarbital,
  topiramate, carbamazepine) and baclofen, none of which appears anywhere in
  either clinical paper; a claim that three of six patients achieved
  pharmacological seizure control, which is the untested complement of the
  reported drug-resistant fraction; a claim that the 2024 patient had no
  infantile epilepsy, where the abstract is simply silent on seizures; cerebellar
  atrophy (HP:0001272), where the source reports vermian hypoplasia; corpus
  callosum hypoplasia or aplasia (HP:0002079, HP:0007370), where the source says
  dysgenesis without specifying; spastic tetraplegia (HP:0002510), where the
  source says quadriparesis; leaky translation re-initiation at p.Gln18Ter, which
  no source proposes; a Belgian origin for the 2024 patient, which the abstract
  does not state; and intron retention across Srsf1, Son and Sf3b1, none of which
  terms appears in the cached full text of the paper cited for it.

  Phenotype connectivity. Twenty of the twenty-three phenotype rows are reached
  by a causal edge. The three that are not are Intellectual disability, Delayed
  speech and language development and Motor delay, all three from the 2024 case
  report, whose abstract gives no imaging and so supports no edge from
  Disrupted Brain Development for that patient. Early death is likewise
  unconnected, as the paper states the cause is unclear; wiring it to any node
  would assert a mechanism the source declines to give.

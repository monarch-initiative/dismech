      snippet: "While early lethality has limited investigation of NSRP1's role in the brain, nito knockdown in D. melanogaster CCAP/buriscon neurons reduced axon outgrowth during the transition from larval to adult form"
      explanation: >-
        Cited to record that the neural question is open rather than answered.
        The fly neuronal knockdown result is the closest thing to a neural
        phenotype for this gene family and it concerns axon outgrowth in an
        insect, not cortical development.
- name: Unopposed SRSF1 and SRSF2 Splicing Activity
  biological_scale: MOLECULAR
  description: >-
    NSRP1 binds SRSF1 and SRSF2 through its RS-like region and reverses their
    effect on splice-site choice, and its first RS-like subregion is also needed
    to keep both NSRP1 and the SR proteins positioned in speckles. Without
    NSRP1 that opposition is absent. How much this contributes is genuinely
    unsettled: the 2011 study found no change in SR-protein splicing activity
    when it knocked NSrp70 down, where the 2016 study, using deletion
    constructs, reports the opposition. Both results are recorded, and the
    disagreement is carried as a discussion.
  biological_processes:

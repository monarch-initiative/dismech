name: Neurodevelopmental Disorder With Spasticity, Seizures, And Brain Abnormalities
creation_date: "2026-11-20T15:00:00Z"
category: Mendelian
parents:
- Neurodevelopmental disorder
- Developmental and epileptic encephalopathy
synonyms:
- NEDSSBA
- NSRP1-related neurodevelopmental disorder
- NSRP1-associated neurodevelopmental disorder
description: >-
  An autosomal recessive neurodevelopmental disorder caused by biallelic
  loss-of-function variants in NSRP1, the gene for Nuclear Speckle Splicing
  Regulatory Protein 1, a nuclear-speckle splicing factor that binds the
  serine/arginine-rich splicing factors SRSF1 and SRSF2 and opposes their
  alternative splice-site selection. Seven molecularly confirmed individuals
  from four unrelated families have been published, six of them in the 2021
  report that established the gene-disease relationship and one in a 2024 case
  report that extended the spectrum to a milder end. The severe presentation
  comprises global developmental delay, infantile-onset and often drug-resistant
  epilepsy, hypotonia with appendicular spasticity amounting to a spastic
  cerebral palsy, variable microcephaly, dysphagia and dysmorphic facies, with
  brain imaging showing a simplified gyral pattern, under-opercularization and
  cerebellar vermian hypoplasia. Four of the five reported alleles converge on a
  single molecular consequence: loss or substitution of the C-terminal nuclear
  localization signal, which strands NSRP1 in the cytosol and so removes it from
  the compartment where it acts. The course is static rather than degenerative,
  which is why the authors raise NSRP1 as a candidate cerebral palsy gene. What
  no study has yet shown is which NSRP1-dependent splicing targets produce the
  brain phenotype; the chain from splicing failure to malformed cortex is
  recorded here as unestablished rather than as mechanism.

- name: Disrupted Brain Development
  biological_scale: TISSUE
  description: >-
    What is observed in patients is a malformation of cortical development
    rather than a destructive or degenerative lesion: a simplified gyral
    pattern, failure of the operculum to close over the insula, cerebellar
    vermian hypoplasia, and in single patients callosal dysgenesis and a thin
    brainstem, with microcephaly in five of six. The findings are bilateral and
    were more striking on infant than on later childhood scans. Nothing
    connects NSRP1 to a particular developmental step; this node records the
    developmental nature of the lesion, which is what the imaging supports.

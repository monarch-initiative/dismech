progression:
- phase: Prenatal and neonatal
  description: >-
    The structural brain findings are malformations of development rather than
    acquired lesions, and hypotonia is present from early infancy. The imaging
    abnormalities are most conspicuous on scans taken in infancy.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "These abnormalities were more striking in individuals who underwent imaging in infancy rather than later in childhood. This may represent an early delay in brain maturation which subsequently improves with age"
    explanation: >-
      Records both the infantile predominance of the imaging findings and that
      the authors' maturational reading of it is a proposal, not a result.
- phase: Infantile
  description: >-
    Seizures begin in infancy and are drug-resistant in half the founding
    cohort. Appendicular spasticity is present in all six.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Seizures began in infancy and were often drug-resistant (3/6)."
    explanation: Dates seizure onset and records the drug-resistant fraction.
- phase: Childhood and adolescence
  description: >-
    The syndrome is static. No neurodegenerative course has been documented,
    and the oldest reported patient was assessed at fourteen years. Two of the
    six patients in the founding cohort died early of an unexplained cause.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "There is presently little evidence for a neurodegenerative course in NSRP1-related disease."
    explanation: >-
      The authors' own statement that the available evidence does not support
      degeneration. Note this is an absence of evidence, not evidence of a
      wholly static course over a full lifespan, which nobody has observed.
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The cause of early death, seen in two of the six patients and an additional affected sibling who was not genotyped, is unclear."
    explanation: >-
      Records the deaths and that the paper does not attribute them to a
      mechanism.
pathophysiology:
- name: Biallelic NSRP1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Five variant alleles across four families: two final-exon frameshifts
    (c.1359_1362delAAAG, p.Glu455AlafsTer20; c.1272dupG, p.Lys425GlufsTer5), an
    exon 2 nonsense allele (c.52C>T, p.Gln18Ter), a canonical splice-donor
    allele (c.114+2T>G) and a missense allele inside the nuclear localization
    signal (c.1595T>A, p.Val532Glu). The three homozygous alleles were found in
    families from Egypt, Iran and Pakistan; the splice-donor and missense
    alleles were compound heterozygous in the 2024 case. The alleles split by
    molecular route rather than by severity alone: the two frameshifts and the
    missense allele act on the nuclear localization signal, while the nonsense
    and splice-donor alleles deplete transcript.
  genes:
  - preferred_term: NSRP1
    term:
      id: hgnc:25305
      label: NSRP1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Zygosity is deliberately not set at node level because it differs between
      families: homozygous in the three families of the founding cohort and
      compound heterozygous in the 2024 case. Per-allele detail is on the
      genetic record's variants.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Molecular analysis identified three pathogenic NSRP1 predicted loss-of-function variant alleles: c.1359_1362delAAAG (p.Glu455AlafsTer20), c.1272dupG (p.Lys425GlufsTer5), and c.52C>T (p.Gln18Ter)"
    explanation: Names the three alleles of the founding cohort.
  - reference: PMID:38808951
    reference_title: "A milder form of NSRP1-associated neurodevelopmental disorder, caused by a missense variant in the nuclear localization signal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Whole-genome sequencing revealed the compound heterozygous NSRP1 variants c.114 + 2T > G and c.1595T > A (p.Val532Glu)"
    explanation: Names the two alleles of the 2024 compound heterozygous case.
  downstream:
  - target: Loss of the C-Terminal Nuclear Localization Signal
    causal_link_type: DIRECT
    description: >-
      Both final-exon frameshifts and the p.Val532Glu missense substitution act
      on the nuclear localization signal at residues 531 to 540.
    evidence:
    - reference: PMID:34385670
      reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The two frameshift variants result in a premature termination codon in the last exon, and the mutant transcripts are predicted to escape nonsense mediated decay and cause loss of a C-terminal nuclear localization signal required for NSRP1 function"
      explanation: >-
        States the escape from decay and the consequent loss of the signal.
        Both are the authors' predictions from the variant positions rather than
        measurements in patient cells.
  - target: Transcript Depletion by Nonsense-Mediated Decay and Splice-Donor Disruption
    causal_link_type: DIRECT
    description: >-
      The exon 2 nonsense allele and the canonical splice-donor allele act by
      removing transcript rather than by stranding protein.
    evidence:
    - reference: PMID:34385670
      reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "c.52C>T results in a PTC in exon 2, and the mutant mRNA transcript is predicted to be unstable and subject to NMD"
      explanation: >-
        The decay route for the exon 2 allele, again as a prediction from
        position rather than a measured transcript level.
- name: Loss of the C-Terminal Nuclear Localization Signal
  biological_scale: MOLECULAR
  description: >-
    Residues 531 to 540 of NSRP1 are a nuclear localization signal lying inside
    the C-terminal RS-like region, and the signal is required both for nuclear
    localization and for splicing activity. Deleting it had already been shown
    to send the protein to the cytoplasm and abolish its splicing activity
    before any patient was described, which is what let the 2021 authors read
    the two frameshift alleles as loss of function without assaying them.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "a C-terminal nuclear localization signal (AA 531-540) lies within the RS-like domain and is required for nuclear localization and splicing activity"
    explanation: >-
      Locates the signal and states its two requirements. Graded BACKGROUND
      because this 2021 clinical paper is restating the 2011 mapping result
      rather than reporting its own.
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The C-terminal 10 amino acids (531-540), including (536)RD(537), were identified as a novel nuclear localization signal, and the region spanning 290-471 amino acids was critical for speckle localization and binding to SC35 and ASF/SF2"
    explanation: >-
      The primary mapping of the signal, in transfected cells. Note it also
      shows speckle targeting depends on a separate, more N-terminal region.
  downstream:
  - target: Cytoplasmic Mislocalization of NSRP1 and Depletion from Nuclear Speckles
    causal_link_type: DIRECT
    description: >-
      Disrupting the signal, by deletion or by the p.Val532Glu substitution,
      leaves NSRP1 in the cytosol.
    evidence:
    - reference: PMID:38808951
      reference_title: "A milder form of NSRP1-associated neurodevelopmental disorder, caused by a missense variant in the nuclear localization signal."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Functional validation using HEK293T cells transfected with either wild-type or mutated GFP-tagged Nsrp1 suggests that the Val532Glu variant interferes with the function of the nuclear localization signal, and leads to mislocalization of NSRP1 in the cytosol"
      explanation: >-
        The only patient allele for which mislocalization has actually been
        measured rather than predicted, in a transfected cell line.
- name: Transcript Depletion by Nonsense-Mediated Decay and Splice-Donor Disruption
  biological_scale: MOLECULAR
  description: >-
    The exon 2 nonsense allele is predicted to make an unstable transcript
    subject to nonsense-mediated decay, and the c.114+2T>G allele disrupts a
    canonical splice donor. Neither prediction has been checked against patient
    transcript levels. One qualification matters for the exon 2 allele: NSRP1
    has a major alternative transcript in which the same position is non-coding,
    so the allele may not abolish all NSRP1 protein, and the family carrying it
    is the mildest of the three homozygous families.
  biological_processes:
  - preferred_term: nonsense-mediated decay of the exon 2 premature-termination transcript
    modifier: INCREASED
    term:
      id: GO:0000184
      label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "c.52C>T results in a PTC in exon 2, and the mutant mRNA transcript is predicted to be unstable and subject to NMD"
    explanation: The predicted decay route for the exon 2 allele.
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the phenotype of Family 3 with the c.52C>T variant allele is slightly milder"
    explanation: >-
      The milder phenotype the authors connect to this allele's position in the
      alternative transcript.
  downstream:
  - target: Loss of NSRP1-Dependent Alternative Splice Site Selection
    causal_link_type: DIRECT
    description: >-
      Less NSRP1 protein means less of the splice-site selection activity it
      carries, whatever the allele's route to depletion.
    evidence:
    - reference: PMID:21296756
      reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "using CD44, Tra2β1 and Fas constructs as splicing reporter minigenes, we found that NSrp70 modulated alternative splice site selection in vivo"
      explanation: >-
        Establishes that the protein carries the activity, so removing the
        protein removes the activity. The quantitative dependence has not been
        measured.
- name: Cytoplasmic Mislocalization of NSRP1 and Depletion from Nuclear Speckles
  biological_scale: CELLULAR
  description: >-
    NSRP1 normally sits in nuclear speckles, the subnuclear compartment holding
    the splicing machinery, where it colocalizes and physically interacts with
    SC35 (SRSF2) and ASF/SF2 (SRSF1). A protein without a working nuclear
    localization signal cannot reach that compartment. The 2024 case supplies
    the direct observation for one patient allele; for the two frameshift
    alleles the step rests on the earlier deletion work rather than on patient
    material.
  cellular_components:
  - preferred_term: nuclear speckle
    modifier: DECREASED
    term:
      id: GO:0016607
      label: nuclear speck
  biological_processes:
  - preferred_term: nuclear import of NSRP1
    modifier: DECREASED
    term:
      id: GO:0034504
      label: protein localization to nucleus
  evidence:
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "NSrp70 was colocalized and physically interacted with SC35 and ASF/SF2 in speckles"
    explanation: Establishes the compartment the mutant protein fails to reach.
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Prior studies of human NSRP1 demonstrated this signal's deletion results in abnormal cytoplasmic localization and loss of alternative splicing activity"
    explanation: >-
      The 2021 paper's summary of the earlier deletion experiments, which is the
      basis on which it calls the frameshift alleles loss of function.
  downstream:
  - target: Loss of NSRP1-Dependent Alternative Splice Site Selection
    causal_link_type: DIRECT
    description: >-
      A splicing regulator held outside the nucleus cannot act on nuclear
      pre-mRNA. The deletion experiments show the two go together.
    evidence:
    - reference: PMID:34385670
      reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Prior studies of human NSRP1 demonstrated this signal's deletion results in abnormal cytoplasmic localization and loss of alternative splicing activity"
      explanation: >-
        The same sentence couples the mislocalization and the loss of activity,
        which is what makes this edge rather than two separate claims.
- name: Loss of NSRP1-Dependent Alternative Splice Site Selection
  biological_scale: MOLECULAR
  description: >-
    NSRP1 selects alternative splice sites on target pre-mRNA, shown with CD44,
    Tra2β1 and Fas minigene reporters, and its first RS-like subregion is
    required both for binding target RNA and for the splicing effect. This is
    the activity the disease removes, by either of the two allelic routes. The
    molecular function bound here is NSRP1's engagement of target pre-mRNA; no
    study has measured that binding in patient cells, so the decrease is
    inferred from the protein's exclusion from the nucleus rather than observed.
  genes:
  - preferred_term: NSRP1
    term:
      id: hgnc:25305
      label: NSRP1
  molecular_functions:
  - preferred_term: NSRP1 engagement of target pre-mRNA in the nucleus
    modifier: DECREASED
    term:
      id: GO:0036002
      label: pre-mRNA binding
  biological_processes:
  - preferred_term: NSRP1-dependent alternative splice site selection
    modifier: DECREASED
    term:
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:26797131
    reference_title: "Nuclear Speckle-related Protein 70 Binds to Serine/Arginine-rich Splicing Factors 1 and 2 via an Arginine/Serine-like Region and Counteracts Their Alternative Splicing Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Deletion of the first arginine/serine-rich-like region (RS1) completely abrogated binding to the SR proteins and to target mRNA and also failed to induce splicing of CD44 exon v5"
    explanation: >-
      The binding to target RNA that the molecular function names, and its
      coupling to the splicing outcome. The region deleted here is not the
      region the patient alleles affect, so this grounds the activity, not the
      patients' loss of it.
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "using CD44, Tra2β1 and Fas constructs as splicing reporter minigenes, we found that NSrp70 modulated alternative splice site selection in vivo"
    explanation: The splice-site selection activity itself, on three reporters.
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "Prior studies of human NSRP1 demonstrated this signal's deletion results in abnormal cytoplasmic localization and loss of alternative splicing activity"
    explanation: >-
      Supports the loss in the patients' case by one inference step: the alleles
      disrupt the same signal whose deletion abolished the activity.
  downstream:
  - target: Unopposed SRSF1 and SRSF2 Splicing Activity
    causal_link_type: DIRECT
    description: >-
      NSRP1 opposes SRSF1 and SRSF2; removing it removes that opposition. Note
      the two primary papers do not agree on how much this matters, which is
      recorded as a discussion on the downstream node.
    evidence:
    - reference: PMID:26797131
      reference_title: "Nuclear Speckle-related Protein 70 Binds to Serine/Arginine-rich Splicing Factors 1 and 2 via an Arginine/Serine-like Region and Counteracts Their Alternative Splicing Activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "we demonstrated that NSrp70 interacts physically with two SR proteins, SRSF1 and SRSF2, and reverses their splicing activity in terms of CD44 exon v5 as exon exclusion"
      explanation: >-
        The reversal of SR-protein splicing activity whose loss this edge

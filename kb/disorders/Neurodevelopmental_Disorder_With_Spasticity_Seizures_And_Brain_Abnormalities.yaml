genetic:
- name: NSRP1
  gene_term:
    preferred_term: NSRP1
    term:
      id: hgnc:25305
      label: NSRP1
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  association: >-
    Defining gene of the disorder, and MONDO's causal gene for MONDO:0859275.
    ClinGen's Cerebral Palsy Gene Curation Expert Panel classifies the
    autosomal recessive NSRP1 relationship as Moderate.
  notes: >-
    relationship_type is UNKNOWN rather than CAUSATIVE because the schema
    reserves CAUSATIVE for ClinGen Definitive or Strong validity, and ClinGen
    rates this pair Moderate (Cerebral Palsy Gene Curation Expert Panel,
    16 December 2024, SOP11). The direction of the relationship is not in doubt
    in the published literature: every reported patient is biallelic for an
    NSRP1 variant, the nuclear-localization mechanism is shared by four of the
    five alleles, and ClinGen records no contradictory evidence. The tier
    reflects how few probands exist, which is four by ClinGen's count.
    NSRP1 was formerly called CCDC55, and its protein is widely called NSrp70
    in the mechanistic literature; both names appear in the cited papers.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance

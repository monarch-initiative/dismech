animal_models:
- name: Nsrp70 gene-trap null mouse
  species: Mouse
  genotype: NSrp70GT/GT (gene-trap insertion in intron 1 of mouse Nsrp1), homozygous
  publication: PMID:21296756
  description: >-
    A gene-trap allele of mouse Nsrp1. No homozygous animal was recovered among
    more than 95 offspring of heterozygous intercrosses, and no homozygous
    embryo was found between embryonic days 6.5 and 19.5, placing the lethality
    shortly after implantation. Heterozygotes were indistinguishable from
    wild-type in body weight, protein level, interleukin-2 response and T-cell
    migration. The model is the strongest evidence that the gene is essential,
    and it is also why nobody has been able to study NSRP1 in a mouse brain.
  genes:
  - preferred_term: Nsrp1
    term:
      id: MGI:2144305
      label: Nsrp1
  evidence:
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Among more than 95 offspring investigated, only NSrp70+/GT (~80%) and NSrp70+/+ (~20%) mice, but not viable NSrp70GT/GT mice, were detected"
    explanation: The absence of homozygotes among the offspring.
  - reference: PMID:21296756
    reference_title: "NSrp70 is a novel nuclear speckle-related protein that modulates alternative pre-mRNA splicing in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "no homozygous embryo was observed (data not shown), suggesting that homozygous mutation leads to embryonic lethality shortly after implantation"
    explanation: >-
      Dates the lethality. Note the embryo genotyping itself is reported as data
      not shown.
  modeled_mechanisms:
  - target: Loss of NSRP1-Dependent Alternative Splice Site Selection
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete loss of the mouse gene is lethal shortly after implantation, so
      the model cannot show the human phenotype at all. It is included because
      that failure is informative: it is the main reason the authors suspect the
      human alleles are hypomorphic rather than null.
    limitations: >-
      The animal dies before the brain exists, so no neurodevelopmental,
      motor or electrographic phenotype can be observed. It is also a complete
      null, where every reported human allele retains some function or some
      transcript, so it does not model any patient genotype.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: INVALIDATING
      description: >-
        The model's observable window closes shortly after implantation.
        Cortical folding, opercularization and cerebellar vermis formation, the
        processes the human phenotype implicates, all occur long afterwards and
        are therefore outside the model entirely.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is survival to genotyping. The node's quantity is
        alternative splice-site selection, which this model never assays.
- name: Nsrp1 conditional knockout mouse (CD4-Cre)
  species: Mouse
  genotype: Nsrp1 conditional knockout, CD4-Cre driver (NSrp70-cKO)
  publication: PMID:34037780
  description: >-
    Deleting Nsrp1 in the T-cell lineage escapes the embryonic lethality and
    gives the only global splicing readout of NSRP1 loss in any tissue. Loss of
    NSrp70 changed the alternative processing of several RNA splicing factors,
    SRSF1 among them, and the thymocytes failed to mature, with insufficient
    T-cell receptor signalling and uncontrolled growth and death; the mice were
    severely lymphopenic. None of this is a feature of the human disease, in
    which no immunodeficiency has been reported, and the driver confines the
    deletion to a lineage the human phenotype does not involve.
  genes:
  - preferred_term: Nsrp1
    term:
      id: MGI:2144305
      label: Nsrp1
  evidence:
  - reference: PMID:34037780
    reference_title: "NSrp70 is a lymphocyte-essential splicing factor that controls thymocyte development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "A conditional-knockout of Nsrp1 (NSrp70-cKO) using CD4Cre developed severe defects in T cell maturation to single-positive thymocytes, due to insufficient T cell receptor (TCR) signaling and uncontrolled cell growth and death"
    explanation: The model and its lineage phenotype.
  modeled_mechanisms:
  - target: Mis-splicing of Splicing-Factor and Cell-Cycle Transcripts
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      The model removes NSRP1 from one lineage and measures what happens to
      splicing genome-wide. That measurement is the only direct evidence that
      losing NSRP1 shifts isoform ratios of other splicing factors and of
      cell-cycle transcripts.
    limitations: >-
      The deleted lineage is the T cell, which the human disease does not
      involve; no patient has reported immunodeficiency. Whether the transcripts
      identified here are the ones that matter in a neural progenitor is
      untested, so the model grounds the existence of the splicing consequence
      and not its identity in the brain.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The CD4-Cre driver restricts deletion to the T-cell lineage, so neural
        progenitors, cortex, cerebellum and brainstem are all outside the
        model's boundary. The claim that NSRP1 loss dysregulates splicing holds;
        the claim that it does so in the cells that produce the disease does
        not follow from this model.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The cell population assayed is the developing thymocyte, chosen because
        Nsrp1 is most highly expressed there. The disease population is the
        developing neuron and its progenitors, in which NSRP1-dependent splicing
        has never been profiled.
    readouts:
    - name: Alternative processing of RNA splicing factor transcripts, including Srsf1
      target: Mis-splicing of Splicing-Factor and Cell-Cycle Transcripts
      direction: ALTERED
      interpretation: >-
        The genome-wide splicing shift that defines this node, measured in
        thymocytes.
      evidence:
      - reference: PMID:34037780
        reference_title: "NSrp70 is a lymphocyte-essential splicing factor that controls thymocyte development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Global splicing and transcriptional profiling revealed that NSrp70 regulates the cell cycle and survival of thymocytes by controlling the alternative processing of various RNA splicing factors, including the oncogenic splicing factor SRSF1"
        explanation: The profiling result behind this readout.
- name: Caenorhabditis elegans ccdc-55 null and knockdown
  species: Caenorhabditis elegans
  genotype: ccdc-55(ok2851) homozygous (probable null); separately, ccdc-55 RNAi
  publication: PMID:22285439
  description: >-
    The nematode ortholog of NSRP1 is ccdc-55. Animals homozygous for the
    probable null allele arrest in early larval development, which is the
    invertebrate counterpart of the mouse lethality. RNAi depletion is milder
    and lets development proceed, and in that background the distal tip cell
    fails to stop migrating at the end of larval morphogenesis. That graded
    severity, lethal null against viable partial loss, is the model system's
    contribution to the argument that the human alleles are hypomorphic.
  genes:
  - preferred_term: ccdc-55
    term:
      id: WB:WBGene00007627
      label: ccdc-55
  evidence:
  - reference: PMID:22285439
    reference_title: "CCDC-55 is required for larval development and distal tip cell migration in Caenorhabditis elegans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Although animals homozygous for a probable null allele, ccdc-55(ok2851), display an early larval arrest, RNAi depletion experiments allow the analysis of later phenotypes and suggest that CCDC-55 is needed within the DTC for migration to cease at the end of larval morphogenesis"
    explanation: >-
      Both halves: the null arrests early, and partial depletion is viable and
      shows a cell-migration phenotype.
  modeled_mechanisms:
  - target: Loss of NSRP1-Dependent Alternative Splice Site Selection
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Removing the ortholog establishes that the gene is required for
      development in a third lineage of animals, and the null-versus-RNAi
      contrast is the clearest demonstration anywhere that partial loss is
      tolerated where complete loss is not.
    limitations: >-
      Splicing was never measured in this model, so the link to the node's
      activity is by orthology rather than by assay. The phenotype scored is
      cell migration in a gonadal leader cell, and the nematode has no cortex,
      no corpus callosum and no cerebellum.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantities are larval survival and the timing of distal tip
        cell migration. The node's quantity is alternative splice-site
        selection, which this study does not assay at all.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Caenorhabditis elegans has none of the structures whose malformation
        defines the human disease, so no amount of further work in this model
        could produce the patients' phenotype.
diagnosis:
- name: Exome sequencing
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    The diagnosis is molecular. The founding cohort was identified by exome
    sequencing with family-based rare-variant analysis, with the three families
    connected through GeneMatcher. There is no biochemical marker and no facial
    gestalt to recognise, so sequencing is the only route.
  evidence:
  - reference: PMID:34385670
    reference_title: "Biallelic loss-of-function variants in the splicing regulator NSRP1 cause a severe neurodevelopmental disorder with spastic cerebral palsy and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Exome sequencing and rare variant family-based genomics was performed as a part of the Baylor-Hopkins Center for Mendelian Genomics Initiative. Additional families were identified via GeneMatcher."
    explanation: The method by which the founding cohort was assembled.
  notes: >-
    A second, non-obvious diagnostic point from the founding paper: calculated
    inbreeding coefficients and absence-of-heterozygosity blocks from exome data
    identified consanguinity that the families' own history did not report.
    Family 3, third cousins by history, had coefficients near those of an
    uncle-niece union. The authors argue from this that autozygosity should be
    computed from sequence rather than taken from the pedigree when a recessive
    disorder is suspected.

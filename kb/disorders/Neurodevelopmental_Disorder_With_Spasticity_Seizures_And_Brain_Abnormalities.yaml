    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we demonstrated that NSrp70 interacts physically with two SR proteins, SRSF1 and SRSF2, and reverses their splicing activity in terms of CD44 exon v5 as exon exclusion"
    explanation: The opposition this node says is lost.
  - reference: PMID:26797131
    reference_title: "Nuclear Speckle-related Protein 70 Binds to Serine/Arginine-rich Splicing Factors 1 and 2 via an Arginine/Serine-like Region and Counteracts Their Alternative Splicing Activity."
    supports: SUPPORT

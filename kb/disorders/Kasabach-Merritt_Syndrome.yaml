name: Kasabach-Merritt Syndrome
creation_date: '2026-09-05T17:15:00Z'
description: >-
  A life-threatening consumptive coagulopathy that arises inside a vascular
  tumour and nowhere else. Profound thrombocytopenia, hypofibrinogenemia and a
  rising D-dimer appear in an infant with an enlarging purpuric mass, and the
  platelets are not being destroyed in the circulation but trapped and consumed
  within the lesion itself. The tumour is kaposiform hemangioendothelioma, or
  less often tufted angioma, and the two are regarded as one neoplastic
  spectrum. Ordinary infantile hemangioma does not do this. The modern
  literature prefers "Kasabach-Merritt phenomenon" precisely because the entity
  is a complication of a specific tumour rather than an independent inherited
  syndrome; the name kept here is the MONDO label. The initiating lesion of the
  tumour is unknown in most cases, so this pathograph begins at the abnormal
  vascular bed and follows the platelet.
categories:
- Vascular Tumour Complication
- Consumptive Coagulopathy
- Paediatric Vascular Anomaly
parents:
- blood coagulation disease
- vascular neoplasm
synonyms:
- Kasabach-Merritt phenomenon
- KMP
- Kasabach-Merritt coagulopathy
- thrombocytopenic coagulopathy of kaposiform hemangioendothelioma
prevalence:
- population: Children, Massachusetts
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.071
  notes: >-
    Incidence of the underlying tumour, kaposiform hemangioendothelioma, not of
    the coagulopathy. The source states that the true figure is probably higher
    because small asymptomatic lesions go unreported.
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In Massachusetts, the annual prevalence and incidence have been estimated at
      0.91 and 0.071 per 100,000 children, respectively'
    explanation: Gives the incidence figure and the population it was measured in.
- population: Children with kaposiform hemangioendothelioma, single Chinese centre, 2017-2022
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    The fraction of the underlying tumour that goes on to the coagulopathy. This
    is a surgical referral cohort of 70 patients, so it sits at the high end;
    reviews give a wider range across series.
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Of the total cohort, 78% developed KMP; the median age at which thrombocytopenia
      occurred was 27.8 days.'
    explanation: Gives the proportion of the tumour cohort developing the coagulopathy and the
      age at which it declares itself.
pathophysiology:
- name: Abnormal Angiogenic and Lymphangiogenic Tumour Vasculature
  biological_scale: TISSUE
  description: >-
    The lesion is built of infiltrating nodules of spindled endothelial cells
    forming slit-like blood channels and malformed lymphatic channels. Abnormal
    angiogenesis and lymphangiogenesis are its defining pathological features.
    What starts the process is not known, and the review that is the main source
    for this entry says so plainly. A somatic activating GNA14 variant is found
    in a minority of specimens and is not required.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: lymphatic endothelial cell
    term:
      id: CL:0002138
      label: endothelial cell of lymphatic vessel
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  - preferred_term: lymphangiogenesis
    modifier: INCREASED
    term:
      id: GO:0001946
      label: lymphangiogenesis
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The main pathological features of KHE are abnormal angiogenesis and lymphangiogenesis.
    explanation: States the two processes that define the lesion this node describes.
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initiating mechanism during the pathogenesis of KHE has yet to be discovered.
    explanation: Records the honest state of knowledge upstream of this node, which is why the
      pathograph starts here rather than at a genetic lesion.
  downstream:
  - target: Intralesional Platelet Trapping and Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The abnormal channels trap platelets. Podoplanin on the lesional
      endothelium and CLEC-2 on the platelet are the best characterised route,
      with exposed matrix a second proposed one.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The C-type lectin-like receptor-2 (CLEC-2) expressed on platelets is an endogenous
        receptor of podoplanin, which in turn is widely expressed in ECs within the KHE lesions
      explanation: Names the receptor-ligand pair that connects the abnormal endothelium of the
        upstream node to the platelet trapping of the downstream one.
- name: Podoplanin-CLEC-2 Platelet Adhesion Signalling
  biological_scale: MOLECULAR
  description: >-
    Podoplanin is widely expressed on the endothelium inside the lesion. It
    binds platelet CLEC-2, and the signal runs through Src family kinases to
    activate the platelet. The pathway is credible and incomplete: podoplanin is
    also highly expressed in lymphatic malformations, and those lesions do not
    aggregate platelets. Something further about the architecture or the flow is
    required.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Binding of podoplanin to CLEC-2 can transmit platelet activation signals via Src
      family kinases, which may account for platelet aggregation in KHE
    explanation: States the signalling route this node asserts, and its own hedge.
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Podoplanin is highly expressed in dysmorphic vessels within the lymphatic malformations,
      but no obvious platelet aggregation occurs in these lesions
    explanation: The negative comparison that keeps this node from being written as sufficient.
      Podoplanin expression alone does not produce the phenomenon.
  - reference: PMID:37307200
    reference_title: Platelet functional abnormalities in pediatric patients with kaposiform
      hemangioendothelioma/Kasabach-Merritt phenomenon.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In KHE/KMP, platelet responses induced by CLEC-2 or GPVI activation are impaired
      because of the diminished number of receptors on the platelet surface. This impairment
      correlates with the severity of the disease and resolves as the patient recovers.'
    explanation: Measures the receptor on circulating platelets in patients and finds it depleted
      in proportion to disease severity, recovering with treatment. That is what chronic
      engagement of CLEC-2 inside the lesion would be expected to do, and it ties this node to
      the clinical course.
  downstream:
  - target: Intralesional Platelet Trapping and Activation
    causal_link_type: DIRECT
    description: Receptor engagement is the proximal activating signal for the trapped platelet.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Binding of podoplanin to CLEC-2 can transmit platelet activation signals via Src
        family kinases, which may account for platelet aggregation in KHE
      explanation: Connects the receptor pair directly to platelet aggregation within the lesion.
- name: Intralesional Platelet Trapping and Activation
  biological_scale: CELLULAR
  description: >-
    Platelets are held inside the tumour vasculature, activated, and aggregated.
    This is the pivot of the whole disease. Trapping alone is not the disease:
    it is seen histologically in lesions that never develop the coagulopathy, so
    it is necessary and not sufficient.
  cell_types:
  - preferred_term: platelet
    term:
      id: CL:0000233
      label: platelet
  biological_processes:
  - preferred_term: platelet aggregation
    modifier: INCREASED
    term:
      id: GO:0070527
      label: platelet aggregation
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Intralesional platelet trapping is followed by the activation and aggregation of
      platelets, which then results in activation of the coagulation cascade with subsequent
      consumption of clotting factors.'
    explanation: States the node and the step that follows it.
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Platelet trapping has been revealed histologically in KHE with or without KMP
    explanation: Establishes that trapping occurs in tumours that never produce the coagulopathy,
      which is why this node is described as necessary rather than sufficient.
  downstream:
  - target: Shear-Driven Amplification Loop
    causal_link_type: DIRECT
    description: Microvascular thrombi obstruct flow, and the disturbed flow activates more platelets.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In KHE, the thrombi in the microvasculature cause vessel occlusion and prevent
        normal blood flow, all of which can lead to elevated shear stress.'
      explanation: States the step from thrombus to elevated shear that this edge asserts.
  - target: Consumptive Coagulopathy
    causal_link_type: DIRECT
    description: Aggregation activates the coagulation cascade and consumes clotting factors.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Intralesional platelet trapping is followed by the activation and aggregation of
        platelets, which then results in activation of the coagulation cascade with subsequent
        consumption of clotting factors.'
      explanation: The sentence states this exact causal step.
- name: Shear-Driven Amplification Loop
  biological_scale: TISSUE
  description: >-
    Thrombi obstruct the small convoluted vessels of the lesion, flow becomes
    turbulent, shear rises, and high shear activates further platelets through
    von Willebrand factor and its platelet binding sites. The disease feeds
    itself, and this is why the active phase escalates over days.
  biological_processes:
  - preferred_term: platelet activation
    modifier: INCREASED
    term:
      id: GO:0030168
      label: platelet activation
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'With regard to KHE, platelets in circulating blood may become exposed to turbulent
      blood flow and high shear stress that results from the architecture of the small, convoluted
      and thrombus-obstructed vessels within the KHE lesions. This process in turn causes further
      platelet trapping and activation during the active phase of KHE.'
    explanation: States the loop, including that it drives further trapping, which is the claim
      of this node.
  downstream:
  - target: Intralesional Platelet Trapping and Activation
    causal_link_type: DIRECT
    description: >-
      The returning arm of the loop. High shear drives further trapping and
      activation, which is what makes the active phase self-amplifying.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: This process in turn causes further platelet trapping and activation during the
        active phase of KHE.
      explanation: The source states the feedback direction explicitly.
- name: Consumptive Coagulopathy
  biological_scale: ORGANISM
  description: >-
    Profound thrombocytopenia, falling fibrinogen and a rising D-dimer, produced
    by consumption rather than by marrow failure or immune destruction. Unlike
    disseminated intravascular coagulation, the driving consumption is localised
    to the tumour.
  biological_processes:
  - preferred_term: blood coagulation
    modifier: INCREASED
    term:
      id: GO:0007596
      label: blood coagulation
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'KHE may develop into the Kasabach-Merritt phenomenon (KMP), which is characterized
      by thrombocytopenia and consumptive coagulopathy.'
    explanation: Defines the node in the terms used here.
  downstream:
  - target: Intralesional Haemorrhage and Tumour Engorgement
    causal_link_type: DIRECT
    description: >-
      Continued aggregation with hypofibrinogenemia and raised D-dimer ends in
      bleeding into the lesion, which is what makes the mass purpuric, warm,
      painful and rapidly larger.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Continued platelet aggregation, together with coagulopathy and hypofibrinogenemia
        with elevated D-dimer (coagulation markers), eventually result in intralesional hemorrhage,
        which clinically manifests as very purpuric, warm, painful, and rapidly enlarged tumor
        lesion'
      explanation: States the step from coagulopathy to intralesional haemorrhage and names the
        clinical result.
- name: Intralesional Haemorrhage and Tumour Engorgement
  biological_scale: TISSUE
  description: >-
    Bleeding into the tumour. The mass turns deep purple, becomes hot and
    tender, and enlarges over days. Anaemia follows from sequestration, from
    bleeding and from microangiopathic destruction of red cells in the abnormal
    vessels.
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Continued platelet aggregation, together with coagulopathy and hypofibrinogenemia
      with elevated D-dimer (coagulation markers), eventually result in intralesional hemorrhage,
      which clinically manifests as very purpuric, warm, painful, and rapidly enlarged tumor
      lesion'
    explanation: Describes this node and its clinical appearance.
  downstream:
  - target: Local Infiltrative Tissue Destruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Expansion during the active phase adds to the infiltrative damage the
      tumour is already doing to muscle, joint and bone.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The progressive expansion of the mass during the active phase of KMP can further
        compromise the vital structures.
      explanation: States that active-phase expansion worsens damage to surrounding structures.
- name: Local Infiltrative Tissue Destruction
  biological_scale: TISSUE
  description: >-
    The tumour infiltrates rather than displaces. Muscle and connective tissue
    are remodelled, joints are eroded, bone is destroyed, and the survivors of
    the acute coagulopathy are left with contracture, scoliosis, chronic pain
    and lymphedema. This arm runs in tumours that never develop the
    coagulopathy at all.
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In some cases, residual KHEs will continue to infiltrate surrounding tissues, erode
      bone and destroy joints.'
    explanation: States the tissue destruction this node describes.
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Even in patients without KMP, musculoskeletal disorders are frequently seen in cases
      involving the extremities, with a majority of these lesions located on or adjacent to joints'
    explanation: Establishes that this arm is not downstream of the coagulopathy alone, which is
      why it is drawn as a separate consequence of the lesion.
phenotypes:
- category: Hematologic
  name: Profound Thrombocytopenia
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    The defining laboratory finding. Median platelet count 24,000 per microlitre
    in a 70-patient cohort, with severe disease usually taken as below 30 x 10^9
    per litre. It begins in the neonatal period, at a median of 27.8 days in
    that series.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median platelet count of patients who were associated with KMP was 24,000/µL in
      our cohort.
    explanation: Gives the platelet count in the cohort, supporting both the phenotype and its
      severity.
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Common clinical characteristics included associated coagulation disorder (100%),
      locally aggressive cutaneous blue-purple mass (89%), thrombocytopenia (78%), and local pain
      or joint dysfunction (20%).'
    explanation: Gives the 78% figure in the cohort, which is the basis for the VERY_FREQUENT band
      as applied to the tumour population this entry describes.
- category: Hematologic
  name: Hypofibrinogenemia
  description: >-
    Fibrinogen falls as it is consumed in the lesion. With the platelet count
    and the D-dimer it forms the laboratory triad used to call the phenomenon.
  phenotype_term:
    preferred_term: Hypofibrinogenemia
    term:
      id: HP:0011900
      label: Hypofibrinogenemia
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Currently, KMP is defined as profound thrombocytopenia, together with consumptive
      coagulopathy and hypofibrinogenemia associated only with the vascular tumors, KHE and tufted
      angioma'
    explanation: Places hypofibrinogenemia in the definition of the entity.
- category: Hematologic
  name: Microangiopathic Hemolytic Anemia
  description: >-
    Red cells are destroyed passing through the abnormal, thrombus-obstructed
    vessels of the lesion, adding to the anaemia produced by sequestration and
    intralesional bleeding.
  phenotype_term:
    preferred_term: Microangiopathic hemolytic anemia
    term:
      id: HP:0001937
      label: Microangiopathic hemolytic anemia
  evidence:
  - reference: PMID:34106442
    reference_title: Kaposiform Hemangioendothelioma with Kasabach-Merritt Phenomenon.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The child was moribund with microangiopathic hemolytic anemia, thrombocytopenia,
      and consumptive coagulopathy without sepsis.'
    explanation: Documents the finding alongside the thrombocytopenia and coagulopathy in a case
      of this disease.
- category: Cutaneous
  name: Locally Aggressive Blue-Purple Cutaneous Mass
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    An enlarging, indurated, blue-purple or purpuric mass, most often on a limb
    or the trunk. It becomes warm, swollen and painful as the coagulopathy
    declares itself. Around one lesion in eight has no cutaneous component at
    all, which is why unexplained neonatal thrombocytopenia warrants imaging of
    the chest and abdomen.
  phenotype_term:
    preferred_term: Vascular neoplasm
    term:
      id: HP:0100742
      label: Vascular neoplasm
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Common clinical characteristics included associated coagulation disorder (100%),
      locally aggressive cutaneous blue-purple mass (89%), thrombocytopenia (78%), and local pain
      or joint dysfunction (20%).'
    explanation: Gives the lesion description and its 89% frequency in the cohort, which supports
      the VERY_FREQUENT band.
- category: Hematologic
  name: Bruising and Bleeding
  description: >-
    Purpura, ecchymoses and, in severe disease, clinically important
    haemorrhage. Bleeding is the usual mode of acute death.
  phenotype_term:
    preferred_term: Bruising susceptibility
    term:
      id: HP:0000978
      label: Bruising susceptibility
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'KHE lesions with KMP have progressive engorgement and purpura. KMP can lead to
      significant pain and secondary bleeding.'
    explanation: Names purpura and secondary bleeding as features of the phenomenon, which is
      what this phenotype records.
- category: Musculoskeletal
  name: Pain and Joint Dysfunction
  frequency: OCCASIONAL
  description: >-
    Pain at the tumour site during the active phase, and restricted joint
    movement where the lesion sits on or beside a joint. Reported in 20% of a
    70-patient cohort.
  phenotype_term:
    preferred_term: Limitation of joint mobility
    term:
      id: HP:0001376
      label: Limitation of joint mobility
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Common clinical characteristics included associated coagulation disorder (100%),
      locally aggressive cutaneous blue-purple mass (89%), thrombocytopenia (78%), and local pain
      or joint dysfunction (20%).'
    explanation: Gives the 20% figure that supports both the phenotype and the OCCASIONAL band.
- category: Lymphatic
  name: Lymphedema
  description: >-
    A late consequence, mostly of lesions on the proximal limb near the inguinal
    or axillary nodes. Mechanical obstruction of lymphatic flow during the acute
    phase is the proposed route.
  phenotype_term:
    preferred_term: Lymphedema
    term:
      id: HP:0001004
      label: Lymphedema
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In this scenario, it is hypothesized that the mechanical obstruction of the lymphatic
      flow during the acute phase of KMP may eventually lead to lymphedema'
    explanation: States the phenotype and, as a hypothesis, its proposed mechanism. The hedge is
      the source's own.
genetic:
- name: GNA14
  gene_term:
    preferred_term: GNA14
    term:
      id: hgnc:4382
      label: GNA14
  relationship_type: SOMATIC_DRIVER
  notes: >-
    A somatic activating c.614A>T (p.Gln205Leu) variant reported in about a
    third of tumour specimens. It is a tumour-level mosaic change, not a
    germline disease allele, and it is neither necessary nor sufficient: a later
    series of seven tumours found none. Nothing about it predicts the
    coagulopathy.
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: mutation was found in 1/3 of KHE specimens and in 1/4 of TA specimens, although these
      studies were weakened by small sample size
    explanation: Gives the frequency of the variant and the source's own caveat about sample size.
  - reference: PMID:31887709
    reference_title: Kaposiform hemangioendothelioma and tufted angioma - (epi)genetic analysis including
      genome-wide methylation profiling.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Using next generation sequencing, heterogeneous mutations were found in a subset of
      cases (2/7) without the presence of GNA14 mutations, previously reported in KHE and TA.'
    explanation: A negative series. Tagged REFUTE against any reading of the variant as a constant
      feature of the tumour, which is why the notes above call it neither necessary nor sufficient.

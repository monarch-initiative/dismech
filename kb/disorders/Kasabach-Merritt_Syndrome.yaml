    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: clinicaltrials:NCT04775173
    reference_title: "Efficacy and Safety of High- vs Low-Dose Sirolimus in Patients With Kaposiform Hemangioendothelioma: A Trial Protocol"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The purpose of this study is to compare the efficacy and safety of different concentration gradients of sirolimus in the treatment of Kaposiform hemangioendothelioma."
    explanation: "States the trial as a comparison between sirolimus concentrations, which is what places it as a dose-finding rather than efficacy study."
- name: NCT04077515
  phase: PHASE_IV
  status: COMPLETED

differential_diagnoses:
- name: Infantile hemangioma
  description: >-
    The commonest misdiagnosis and the most consequential. Infantile hemangioma
    is GLUT1-positive and does not produce the coagulopathy. Historic reports
    attributing Kasabach-Merritt to it were wrong.
  distinguishing_features:
  - GLUT1 positive on immunohistochemistry
  - Does not cause consumptive coagulopathy
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Currently, KMP is defined as profound thrombocytopenia, together with consumptive
      coagulopathy and hypofibrinogenemia associated only with the vascular tumors, KHE and tufted
      angioma'
    explanation: The word "only" is the discriminating claim. The phenomenon belongs to these two
      tumours and not to infantile hemangioma.
- name: Kaposiform lymphangiomatosis
  description: >-
    Multifocal thoracic and osseous lymphatic disease. It carries a somatic NRAS
    p.Q61R variant that is absent from kaposiform hemangioendothelioma, which
    gives a molecular means of separating them, and it does worse.
  distinguishing_features:
  - Somatic NRAS p.Q61R present
  - Multifocal thoracic and osseous involvement
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: variant (c.182 A > G, p. Q61R) was recently identified in patients with KLA but was
      absent in KHE samples, thus providing a molecular means to further differentiate these two
      entities
    explanation: States the molecular discriminator between the two entities.
treatments:
- name: Sirolimus
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An mTOR inhibitor, and the drug that changed the outlook for this disease.
    It acts on the tumour rather than on the platelet, which is the right place:
    the coagulopathy stops when the lesion stops. A prospective multicentre
    phase II trial in 126 children with complicated vascular anomalies found
    77.8% objective response, with rates above 80% in the kaposiform
    hemangioendothelioma subgroup. Serious adverse events occurred, including
    grade 4 pneumonitis, and two patients in a separate surgical cohort stopped
    the drug for severe pneumonia.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Abnormal Angiogenic and Lymphangiogenic Tumour Vasculature
    treatment_effect: INHIBITS
    description: >-
      mTOR sits downstream of the VEGF-C/VEGFR-3 and Ang-2/Tie-2 signalling that
      drives the lesion's lymphangiogenesis, so inhibiting it acts on the
      abnormal vascular bed itself.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The binding of VEGF-C can stimulate the activation of VEGFR-3 and induce downstream
        PI3K/Akt/mTOR signaling, which mediates lymphangiogenesis.'
      explanation: Places mTOR in the pathway that produces the abnormal vasculature, which is why
        the drug is drawn as inhibiting this node.
  evidence:
  - reference: PMID:34082006
    reference_title: A prospective multicenter study of sirolimus for complicated vascular anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Of 126 patients enrolled on an intention-to-treat basis, 98 (77.8%) had had an
      objective response to sirolimus, with a ≥20% decrease in lesion volume.'
    explanation: The prospective trial result behind this treatment.
  - reference: PMID:34082006
    reference_title: A prospective multicenter study of sirolimus for complicated vascular anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'More serious adverse events included reversible grade 4 pneumonitis in 3 patients
      and grade 4 upper respiratory infection in 1 patient.'
    explanation: Records the toxicity of the drug from the same trial, which is what makes the
      pneumonia deaths reported elsewhere credible rather than incidental.
- name: Corticosteroid Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    High-dose corticosteroid, commonly methylprednisolone 5 to 6 mg/kg daily,
    used first or alongside sirolimus. Response is partial and unreliable: 36%
    of 55 patients with the coagulopathy in one cohort were steroid-sensitive.
    That is why it is not used alone in severe disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Consumptive Coagulopathy
    treatment_effect: MODULATES
    description: >-
      Steroid is given to bring the platelet count up in the acute phase. The
      mechanism by which it does so in this disease is not established, and the
      response rate is low, so the edge is graded as modulating rather than
      inhibiting.
    evidence:
    - reference: PMID:38903724
      reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'In 55 patients with KMP, 36% were sensitive to high-dose corticosteroid therapy.'
      explanation: Gives the response rate in patients with the coagulopathy, which is the claim
        this edge makes and the reason it is not graded as inhibition.
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Ninety-two percent of patients were given surgery treatment and 89% of these patients
      were given high-dose methylprednisolone (5-6 mg/kg daily) before surgery.'
    explanation: Documents the agent, the dose and its use before surgery in this cohort.
- name: Vincristine
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    A vinca alkaloid, long recommended with corticosteroid by the 2013 consensus
    statement and still used where sirolimus fails or is not tolerated. The
    recommendation rests on expert opinion, not on trials, and the review that
    reports it says so.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vincristine
      term:
        id: CHEBI:28445
        label: vincristine
  target_mechanisms:
  - target: Abnormal Angiogenic and Lymphangiogenic Tumour Vasculature
    treatment_effect: INHIBITS
    description: Cytotoxic action against the proliferating tumour.
    evidence:
    - reference: PMID:32014025
      reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Medical treatments with corticosteroids and/or vincristine have been recommended
        for the management of KHE.
      explanation: Establishes the drug's place in management of the tumour, which is the node
        this edge points at.
  evidence:
  - reference: PMID:32014025
    reference_title: 'Kaposiform hemangioendothelioma: current knowledge and future perspectives.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'However, these recommendations are based on expert opinion rather than rigorous
      clinical studies.'
    explanation: The source's own grading of the evidence behind the corticosteroid and vincristine
      recommendations. Recorded here so the entry does not overstate them.
- name: Surgical Resection
  therapeutic_modality: SURGERY
  description: >-
    Complete resection can cure a localised lesion. In one cohort all eight
    low-risk patients who were operated on recovered without recurrence over up
    to five years of follow-up. Active severe coagulopathy makes surgery
    hazardous, so it is usually preceded by medical control.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Abnormal Angiogenic and Lymphangiogenic Tumour Vasculature
    treatment_effect: INHIBITS
    description: Removes the vascular bed in which platelets are trapped.
    evidence:
    - reference: PMID:38903724
      reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Patients from the low-risk group (eight cases) underwent operation, all of whom
        recovered without recurrence after a maximum follow-up of 5 years.'
      explanation: Removing the lesion resolved the disease in this group, which is what this edge
        asserts.
  evidence:
  - reference: PMID:38903724
    reference_title: Treatment experience for different risk groups of Kaposiform hemangioendothelioma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our study describes the largest assessment of high-risk patients with KHE who have
      undergone an operation to date, with 5 years of follow-up to track recovery'
    explanation: Establishes the surgical cohort this treatment entry draws on.

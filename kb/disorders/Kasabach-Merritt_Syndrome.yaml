review_notes: >-
  Dataset discovery was run and returned one candidate, geo:GSE124760, matched
  only through the synonym "hemangioma-thrombocytopenia syndrome". It is a
  four-sample mouse study of endothelial p53 in stress-induced vascular
  malignancy, not a study of this disease, and it was not curated.


  Trials. All five trials the deep research surfaced are curated. Their phase,
  status and enrolment were taken from the ClinicalTrials.gov record rather
  than from the research report, which is why NCT02110069 carries
  status TERMINATED although its registry summary text does not mention the
  termination; the summary is what the evidence snippet quotes, and the
  structured status carries the fact. Enrolment counts are not modelled because
  the schema has no slot for them, so they appear in the descriptions.


  Diagnostics. Imaging and biopsy are now modelled. The immunophenotype is
  curated as one evidence item quoting the full marker panel rather than split
  per marker, because the source states it as a single sentence and splitting
  would quote fragments that assert nothing on their own.


  Histopathology terms are left unbound. NCIT was searched for the two
  findings; it has no term for infiltrating spindle-endothelial nodules or for
  slit-like channels carrying platelet thrombi, and the nearest candidate,
  NCIT:C35990 Hemosiderin Deposition, names one component of a finding that is
  about the channels, the thrombi and the hemosiderin together. Binding it
  would assert something narrower than the finding, so both carry a free-text
  preferred_term only.


  Still not modelled, deliberately. Sequencing has no diagnostic role here and
  the research says so, so no molecular assessment is curated. Response
  thresholds used as trial endpoints (platelets above 100,000 per microlitre,
  or twice baseline with fibrinogen above 150 mg/dL) are trial definitions
  rather than clinical reference intervals, and are not curated as
  reference_ranges.
notes: >-
  Terminology. The current literature calls this the Kasabach-Merritt
  phenomenon and reserves "syndrome" for the historical usage, on the grounds
  that it is a complication of a defined tumour rather than a disease in its own
  right. The entry keeps the MONDO label as its name and records the modern term
  as a synonym.

    explanation: "States the discontinuation-versus-maintenance question, which is the stopping decision no other trial here covers."
progression:
- phase: Lesion present at or soon after birth
  age_range: Birth to first year
  notes: >-
    The tumour is congenital or near-congenital in most cases. The
    coagulopathy is not present from the outset; it develops within the
    lesion afterwards.
  evidence:
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 50% of cutaneous lesions are visible or detectable at birth"
    explanation: "Puts half of cutaneous lesions at birth, establishing this as the starting phase."
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distribution of age at onset has one peak within the first year of life when approximately 90% of KHE are evident."
    explanation: "Bounds the onset window for the tumour as a whole."
- phase: Active Kasabach-Merritt phase
  age_range: First days to months of life
  notes: >-
    The phase the pathograph models. The lesion enlarges and becomes engorged
    and purpuric as platelets are trapped, which is the visible correlate of
    the trapping and haemorrhage nodes rather than growth of tumour bulk.
  evidence:
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KHE tumors that develop KMP will appear to ‘grow’ and become engorged and purpuric in the first days/weeks/months of life"
    explanation: "Describes the enlargement and purpuric change as the presentation of the phenomenon, and places it in the first days to months."
- phase: Chronic residual phase
  notes: >-
    Survival of the acute phase does not end the disease. Residual tumour
    continues to infiltrate, and fibrosis is the pathological end state, which
    is what links the infiltrative-destruction arm of the pathograph to the
    lasting musculoskeletal and lymphatic morbidity.
  evidence:
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some cases, residual KHEs will continue to infiltrate surrounding tissues, erode bone and destroy joints."
    explanation: "States that residual lesions keep infiltrating and destroying bone and joint after the acute phase."
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathologically, untreated KHE lesions are characterized by progressive fibrosis"
    explanation: "Names fibrosis as the pathological end state of untreated lesions."
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lymphedema may be a potential sequela of KHE, particularly tumor involving the legs"
    explanation: "Records lymphedema as a chronic sequela, matching the phenotype already curated."
histopathology:
- name: Infiltrating nodules of spindle endothelial cells
  description: >-
    The architectural hallmark. The nodules are infiltrative rather than
    encapsulated, which is the histological form of the invasive growth the
    first pathophysiology node describes.
  finding_term:
    preferred_term: infiltrating nodules of spindle endothelial cells
  evidence:
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The histologic hallmark of KHE is infiltrating, defined, rounded and confluent nodules, which are composed of spindle endothelial cells."
    explanation: "States the hallmark and its cellular composition."
- name: Slit-like channels with platelet thrombi and hemosiderin
  description: >-
    The microscopic counterpart of the trapping node: platelet thrombi are
    visible inside the lesion, and the hemosiderin records bleeding that has
    already occurred there.
  finding_term:
    preferred_term: slit-like vascular lumina with intralesional platelet thrombi
  evidence:
  - reference: PMID:32014025
    reference_title: "Kaposiform hemangioendothelioma: current knowledge and future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These spindle endothelial cells align to form malformed lymphatic channels and slit-like vascular lumina containing erythrocytes, along with platelet thrombi, eosinophilic hyaline bodies and the extravasation of hemosiderin deposits."
    explanation: "Names the platelet thrombi and hemosiderin within the malformed channels, which is the histological evidence for intralesional trapping and haemorrhage."

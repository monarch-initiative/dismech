disease_term:
  preferred_term: Kasabach-Merritt syndrome
  term:
    id: MONDO:0007708
    label: Kasabach-Merritt syndrome
review_notes: >-
  Dataset discovery was run and returned one candidate, geo:GSE124760, matched
  only through the synonym "hemangioma-thrombocytopenia syndrome". It is a
  four-sample mouse study of endothelial p53 in stress-induced vascular
  malignancy, not a study of this disease, and it was not curated.
notes: >-
  Terminology. The current literature calls this the Kasabach-Merritt
  phenomenon and reserves "syndrome" for the historical usage, on the grounds
  that it is a complication of a defined tumour rather than a disease in its own
  right. The entry keeps the MONDO label as its name and records the modern term
  as a synonym.

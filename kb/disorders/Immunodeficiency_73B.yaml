phenotypes:
- name: Combined Immunodeficiency
  category: Immunological
  description: >-
    The defining laboratory picture, with both lymphoid and myeloid compartments
    affected. In several reported patients it presented in later childhood
    rather than as a congenital neutrophil disease, which is what distinguishes
    this arm clinically from the dominant-negative one.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Combined immunodeficiency
    term:
      id: HP:0005387
      label: Combined immunodeficiency
  evidence:
  - reference: PMID:31071452
    reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings broaden the clinical picture of RAC2 dysfunction, showing that some individuals can present with a combined immunodeficiency later in childhood rather than a congenital neutrophil disease."
    explanation: States both the combined character and the later presentation that separates this arm.

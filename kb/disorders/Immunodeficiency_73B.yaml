inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous dominant-activating RAC2 allele is sufficient.
    Reported variants are private missense changes, frequently de novo, and
    vertical transmission from an affected parent has been documented.
  de_novo_rate: Frequently de novo; vertical transmission also documented
  evidence:
  - reference: PMID:30723080
    reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations resulting in severe T- and B-cell lymphopenia, myeloid dysfunction, and recurrent respiratory infections"
    explanation: Three unrelated de novo heterozygous cases establish the dominant, single-allele mechanism.
genetic:
- name: RAC2
  gene_term:
    preferred_term: RAC2
    term:
      id: hgnc:9802
      label: RAC2
  association: >-
    RAC2 encodes a haematopoietic-restricted Rho-family GTPase. Heterozygous
    dominant-activating missense variants cause IMD73B; other biochemical
    classes of RAC2 allele cause different diseases.
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:38194689
    reference_title: "Clinical and functional spectrum of RAC2-related immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease correlated to RAC2 activity: constitutively active RAS-like mutations caused neonatal SCID, dominant-negative mutations caused LAD-like disease, whereas dominant-activating mutations caused CID."
    explanation: The largest compiled cohort maps the dominant-activating allele class specifically onto combined immunodeficiency, which is this entry.
  - reference: PMID:11278678
    reference_title: "Biochemical and biological characterization of a human Rac2 GTPase mutant associated with phagocytic immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Rho GTPase, Rac2, is expressed only in hematopoietic cell lineages, suggesting a specific cellular function in these cells."
    explanation: The haematopoietic-restricted expression is what confines the disease to the immune compartment and is the rationale for transplant being curative.
  variants:
  - name: RAC2 p.Glu62Lys (E62K)
    description: >-
      The best-characterised dominant-activating allele. It retains intrinsic
      GTP hydrolysis but is not accelerated by GTPase-activating protein, so it
      dwells in the active GTP-bound state.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30723080
      reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "retains intrinsic GTP hydrolysis; however, GTPase-activating protein failed to accelerate hydrolysis resulting in prolonged active GTP-bound RAC2."
      explanation: Defines the biochemical lesion precisely, as failure of GAP-accelerated hydrolysis rather than loss of the intrinsic reaction.
  - name: RAC2 p.Asn92Thr (N92T)
    description: >-
      A dominant-activating allele in a child who presented with combined
      immunodeficiency at 10 years rather than with a congenital neutrophil
      disease.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:31071452
      reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "displayed characteristics of active GTP-bound RAC2 including enhanced NADPH oxidase-derived superoxide production both at rest and in response to PMA."
      explanation: Transfection assay showing the allele behaves as constitutively GTP-bound.
  - name: RAC2 p.Pro29Arg (P29R)
    description: >-
      A de novo dominant-activating allele in the highly conserved Switch I
      domain, reported with raised ROS, elevated F-actin and increased RAC2
      protein expression.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35596857
      reference_title: "Combined Immunodeficiency Caused by a Novel De Novo Gain-of-Function RAC2 Mutation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutation resulted in enhanced reactive oxygen species production, elevated F-actin content, and increased RAC2 protein expression in neutrophils, as well as increased cytokine production and a dysregulated phenotype in T lymphocytes."
      explanation: The functional signature of a dominant-activating allele in patient neutrophils and T cells.
  - name: RAC2 p.Arg68Trp (R68W), homozygous
    description: >-
      A rare variant that produces the dominant-activating phenotype only in the
      homozygous state. Protein expression is markedly reduced yet effector
      signalling is increased, so expression level and functional direction
      point opposite ways in the same patient.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:41685306
      reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite significantly reduced RAC2 protein expression, patient-derived cells exhibited increased effector signaling in the homozygous state, producing a phenotype that phenocopies dominant gain-of-function RAC2 variants."
      explanation: Establishes that this allele reaches the same functional endpoint as the heterozygous dominant-activating alleles.
    - reference: PMID:41685306
      reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Functional hyperactivation was not observed in heterozygous cells, supporting a dosage-dependent mechanism."
      explanation: The dose dependence is why this is a homozygous-only phenocopy rather than a further dominant allele.
pathophysiology:
- name: RAC2 Dominant-Activating Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous germline missense change, typically in a switch region or the
    nucleotide-binding pocket, that shifts RAC2 toward its active state. For
    E62K the defect is specific and measurable, in that intrinsic hydrolysis is
    preserved but GTPase-activating protein no longer accelerates it.
  gene:
    preferred_term: RAC2
    modifier: GAIN_OF_FUNCTION
    term:
      id: hgnc:9802
      label: RAC2
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: DECREASED
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:30723080
    reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "retains intrinsic GTP hydrolysis; however, GTPase-activating protein failed to accelerate hydrolysis resulting in prolonged active GTP-bound RAC2."
    explanation: The measured biochemical lesion behind this node.
  downstream:
  - target: Constitutive GTP-Loading of RAC2
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31071452
      reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "displayed characteristics of active GTP-bound RAC2 including enhanced NADPH oxidase-derived superoxide production both at rest and in response to PMA."
      explanation: Expressing the patient allele is sufficient to produce the active GTP-bound state, which is the step this edge asserts.
- name: Constitutive GTP-Loading of RAC2
  biological_scale: MOLECULAR
  description: >-
    RAC2 is a molecular switch whose function depends on cycling, not on being
    on. Holding it in the GTP-bound state engages its effector modules at rest.
    Because superoxide production and chemotaxis run through separable effector
    pathways, the lesion branches here rather than producing a single graded
    output.
  molecular_functions:
  - preferred_term: GTPase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:35596857
    reference_title: "Combined Immunodeficiency Caused by a Novel De Novo Gain-of-Function RAC2 Mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RAC2 undergoes a tightly regulated GTP-binding/GTP-hydrolysis cycle, enabling it to function as a molecular switch."
    explanation: States the switch behaviour that constitutive GTP-loading subverts.
  - reference: PMID:15814684
    reference_title: "Rac2 regulates neutrophil chemotaxis, superoxide production, and myeloid colony formation through multiple distinct effector pathways."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we demonstrate that Rac2 controls chemotaxis and superoxide production via distinct pathways and is critical for development of myeloid colonies in vitro."
    explanation: The separability of the two effector arms is what makes this node a branch point rather than a single downstream chain.
  downstream:
  - target: Excessive NADPH Oxidase Superoxide Production
    causal_link_type: DIRECT
    description: >-
      The oxidase arm, engaged through p67phox.
    evidence:
    - reference: PMID:30723080
      reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients exhibited excessive superoxide production, impaired fMLF-directed chemotaxis, and abnormal macropinocytosis"
      explanation: Patient neutrophils show the raised superoxide this edge asserts.
  - target: Dysregulated F-Actin Assembly and Loss of Polarization
    causal_link_type: DIRECT
    description: >-
      The cytoskeletal arm, engaged through PAK1 and POR1/Arfaptin 2.
    evidence:
    - reference: PMID:35596857
      reference_title: "Combined Immunodeficiency Caused by a Novel De Novo Gain-of-Function RAC2 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the dominant activating RAC2 mutation led to accelerated apoptosis with augmented intracellular active caspase 3, impaired actin polarization in lymphocytes and neutrophils, and diminished RAC2 polarization in neutrophils"
      explanation: Patient cells show loss of actin polarization, which is the cytoskeletal consequence this edge asserts.
  - target: Accelerated Lymphocyte and Neutrophil Apoptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35596857
      reference_title: "Combined Immunodeficiency Caused by a Novel De Novo Gain-of-Function RAC2 Mutation."

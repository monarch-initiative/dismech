notes: >-
  Deep-research provenance and two corrections. This entry was curated against an
  OpenScientist report (research/Immunodeficiency_73B-deep-research-openscientist.md).
  Two of its claims were not carried across.

  First, the report lists the G15D allele (PMID:36459342) among the
  dominant-activating variants. The paper itself classifies it as
  loss-of-function inactivating and says so in terms, describing it as the first
  LoF-I RAC2 mutation affecting lymphocyte function. It causes a combined
  immunodeficiency but through the opposite biochemical direction, so it is not
  curated as an IMD73B allele here.

  Second, the report's limitations section states that no knock-in mouse carries
  a human dominant-activating allele. One does: the Rac2+/E62K heterozygous
  knock-in reported in PMID:30723080, which is curated above as the entry's
  primary animal model.

  Reference validation. The report's validator listed PMID:15814684 as
  unresolved with a confabulation rate of 0.083. That identifier was re-checked
  directly against NCBI during curation and resolves to Carstanjen et al. 2005 in
  J Immunol, with the title the report attributed to it, so the failure was in
  the lookup rather than in the citation. It is cached and cited here on that
  basis.

  PMID:31382036 has no abstract available in PubMed, so it carries no evidence
  item and appears in the reference block only.

  Classifications. No IUIS category is asserted here. RAC2 appears in three
  tables of the IUIS 2022 classification and the KB's IUIS campaign
  (monarch-initiative/dismech#10106, #10477) is assigning those systematically;
  both of those pull requests deliberately left the RAC2 entry unclassified for
  the same reason. Adding a category here would pre-empt that work.

name: Immunodeficiency 73B
creation_date: "2026-09-05T10:00:00Z"
category: Mendelian
synonyms:
- IMD73B
- immunodeficiency 73b with defective neutrophil chemotaxis and lymphopenia
- RAC2 dominant-activating combined immunodeficiency
- RAC2 gain-of-function combined immunodeficiency
description: >-
  Immunodeficiency 73B is the combined immunodeficiency produced by heterozygous
  dominant-activating missense variants in RAC2, a Rho-family GTPase expressed
  only in haematopoietic cells. Patients present later than in infancy with
  recurrent upper and lower respiratory infections, bronchiectasis, persistent
  viral disease, T- and B-cell lymphopenia and hypogammaglobulinaemia, together
  with a neutrophil compartment that cannot chemotax.

  The counterintuitive part is that a gain of GTPase activity produces a loss of
  coordinated cell function. RAC2 works as a switch that must cycle between a
  GDP-bound and a GTP-bound state, and its two principal outputs, NADPH-oxidase
  superoxide production and actin-cytoskeleton remodelling for migration, run
  through separable effector modules. An allele that holds the switch on
  therefore does not amplify both outputs usefully: superoxide rises at rest and
  on stimulation, while F-actin is assembled without polarity and directed
  migration fails outright.

  RAC2 disease is an allele-class spectrum in which biochemistry, not gene
  identity, predicts the syndrome. Constitutively active RAS-like alleles cause
  neonatal SCID, dominant-negative alleles cause a leukocyte-adhesion-deficiency
  mimic, biallelic null alleles cause CVID-like disease, and dominant-activating
  alleles cause the combined immunodeficiency catalogued here.

  SCOPE. This entry covers the dominant-activating (CID) arm only. The
  dominant-negative arm is curated separately as Neutrophil Immunodeficiency
  Syndrome (IMD73A, MONDO:0011988), whose own scope note names the
  dominant-activating alleles as a different disease with a different graph. The
  neonatal-SCID and recessive loss-of-function arms are not curated here either.

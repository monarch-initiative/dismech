animal_models:
- name: Rac2 E62K heterozygous knock-in mouse
  species: Mouse
  genotype: Rac2+/E62K
  publication: PMID:30723080
  description: >-
    An allele-matched heterozygous knock-in carrying the human dominant-activating
    E62K change. It reproduces the lymphoid and the myeloid halves of the human
    phenotype in one animal, which is unusual for this disease class.
  modeled_mechanisms:
  - target: T and B Lymphopenia with Impaired Lymphocyte Output
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knock-in reproduces the T- and B-cell lymphopenia seen in patients
      carrying the same allele.
    limitations: >-
      The report establishes that the lymphopenia is reproduced but does not
      demonstrate the intervening mechanism, so the model shares the human
      entry's uncertainty about how RAC2 signalling reaches thymic and marrow
      output rather than resolving it.
    readouts:
    - name: Peripheral T- and B-cell counts in Rac2+/E62K mice
      target: T and B Lymphopenia with Impaired Lymphocyte Output
      direction: DECREASED
      interpretation: >-
        The lymphoid arm of the human phenotype is allele-driven and reproducible
        in a mouse carrying only that change.
      evidence:
      - reference: PMID:30723080
        reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Rac2+/E62K mice phenocopy the T- and B-cell lymphopenia, increased neutrophil F-actin, and excessive superoxide production seen in patients."
        explanation: The lymphopenia readout in the knock-in.
  - target: Dysregulated F-Actin Assembly and Loss of Polarization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Neutrophil F-actin is increased in the knock-in, matching the patient
      finding.
    limitations: >-
      The mouse readout reported is F-actin content rather than polarization, so
      it supports the assembly half of this node more directly than the loss of
      polarity.
    readouts:
    - name: Neutrophil F-actin content in Rac2+/E62K mice
      target: Dysregulated F-Actin Assembly and Loss of Polarization
      direction: INCREASED
      interpretation: >-
        Raised F-actin in the mouse matches the raised F-actin in patient
        neutrophils.
      evidence:
      - reference: PMID:30723080
        reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "increased neutrophil F-actin, and excessive superoxide production seen in patients"
        explanation: The F-actin readout in the knock-in.
  evidence:
  - reference: PMID:30723080
    reference_title: "Dominant activating RAC2 mutation with lymphopenia, immunodeficiency, and cytoskeletal defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rac2+/E62K mice phenocopy the T- and B-cell lymphopenia, increased neutrophil F-actin, and excessive superoxide production seen in patients."
    explanation: A same-allele knock-in that phenocopies three separate patient findings is strong grounds for treating this model as informative.
- name: Rac2-null mouse
  species: Mouse
  genotype: Rac2 knockout
  publication: PMID:15528331
  description: >-
    The loss-of-function counterpart. It is the model that established RAC2 as
    non-redundant with the ubiquitous RAC1 and that mapped the two effector arms,
    but it models the wrong direction of the human lesion.
  modeled_mechanisms:
  - target: Constitutive GTP-Loading of RAC2
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The null mouse cannot model constitutive activation, and is cited here for
      the separability of the two effector arms rather than for the disease
      state.
    limitations: >-
      The lesion is inverted. The human disease is constitutive activation and
      the model is absence of the protein, so any shared phenotype is convergent
      rather than mechanistically matched. What the model does establish is that
      the two outputs are separable and that neither is redundant with RAC1.
    evidence:
    - reference: PMID:15814684
      reference_title: "Rac2 regulates neutrophil chemotaxis, superoxide production, and myeloid colony formation through multiple distinct effector pathways."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "These findings suggest that binding to any single effector is not sufficient to rescue the distinct cellular phenotypes of Rac2-/- PMN, implicating multiple, distinct, and potentially parallel effector pathways."
      explanation: Effector-rescue experiments in null neutrophils establish the parallel-pathway architecture the human branch point depends on. It is indirect because it is a loss-of-function system reasoning about a gain-of-function disease.
  evidence:
  - reference: PMID:15528331
    reference_title: "Rac2-deficient murine macrophages have selective defects in superoxide production and phagocytosis of opsonized particles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice deficient in hemopoietic-specific Rac2 exhibited agonist-specific defects in neutrophil functions including chemoattractant-stimulated filamentous actin polymerization and chemotaxis, and superoxide production elicited by phorbol ester, fMLP, or IgG-coated particles, despite expression of the highly homologous Rac1 isoform."
    explanation: Establishes the non-redundancy of RAC2 against RAC1, which is why a single RAC2 allele can produce disease at all.
treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Replaces the missing humoral arm. It improves the bacterial respiratory
    infection burden but does not correct the cellular defect, and in the
    longest-followed patient the viral disease progressed despite it.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  evidence:
  - reference: PMID:41685306
    reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent bacterial respiratory infections and early bronchiectasis that initially responded to immunoglobulin replacement therapy"
    explanation: Documents the response, and by saying initially, also its limits.
  target_mechanisms:
  - target: Hypogammaglobulinemia
    description: >-
      Substitutes for the immunoglobulin the failed B-cell compartment does not
      produce.
- name: Allogeneic Hematopoietic Cell Transplantation
  description: >-
    The only definitive therapy, and mechanistically rational because RAC2 is
    expressed only in haematopoietic cells, so replacing that compartment
    replaces the entire diseased tissue. It carries real transplant-related
    mortality in this disease.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:41685306
    reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management included immunoglobulin therapy, and ultimately hematopoietic cell transplantation (HCT), after which he achieved sustained clinical improvement."
    explanation: A documented sustained response to transplant in this allele class.
  - reference: PMID:31071452
    reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient experienced two hematopoietic stem cell transplantations and despite full chimerism, she developed bone marrow aplasia due to adenovirus infection and died at post-transplant day 86."
    explanation: A fatal outcome despite full chimerism, which refutes any reading of transplant as reliably curative here and is the reason the description names the mortality.
  target_mechanisms:
  - target: RAC2 Dominant-Activating Missense Variant
    description: >-
      Replacing the haematopoietic compartment removes the cells that carry and
      express the mutant allele, which is the whole of the diseased tissue.
    evidence:
    - reference: PMID:11278678
      reference_title: "Biochemical and biological characterization of a human Rac2 GTPase mutant associated with phagocytic immunodeficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "The Rho GTPase, Rac2, is expressed only in hematopoietic cell lineages, suggesting a specific cellular function in these cells."
      explanation: The restricted expression is the reason a haematopoietic transplant can be curative. It is indirect because the paper establishes the expression pattern rather than testing transplant.
diagnosis:
- name: Targeted RAC2 signalling assays rather than protein expression alone
  description: >-
    Variant interpretation in RAC2 disease cannot rest on expression level. The
    homozygous R68W patients had markedly reduced RAC2 protein yet increased
    effector signalling, so an expression-based read would have called the
    variant the wrong direction.
  evidence:
  - reference: PMID:41685306
    reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From a diagnostic standpoint, reliance on expression alone may be misleading; incorporating targeted signaling assays is essential for accurate variant interpretation."
    explanation: The authors' explicit diagnostic recommendation, drawn from the discordance they measured.
- name: Functional classification of the RAC2 allele
  description: >-
    Because the allele class determines which disease the patient has, functional
    assessment is diagnostic rather than merely confirmatory. No single assay
    suffices, which is why panels combining superoxide, PAK1 binding, AKT
    activation and protein stability are used.
  evidence:
  - reference: PMID:38194689
    reference_title: "Clinical and functional spectrum of RAC2-related immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All tested RAC2 mutant proteins exhibited aberrant function; no single assay was sufficient to determine functional consequence."
    explanation: States directly that a single functional readout cannot classify a RAC2 variant.
- name: Flow cytometric neutrophil chemotaxis to fMLP
  description: >-
    The functional test that demonstrates the migration defect the disease is
    named for.
  evidence:
  - reference: PMID:31071452
    reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometric investigation of neutrophil migration demonstrated an absence of chemotaxis to fMLP."
    explanation: The assay and its result in a molecularly confirmed patient.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 54 RAC2 patients from 37 families across all four allelic classes
    had been compiled worldwide by 2024, and only 44 of those were in the
    combined-immunodeficiency group that corresponds to this entry. No
    population prevalence or incidence estimate exists, and causal variants are
    private, so a rate cannot be normalized.
  evidence:
  - reference: PMID:38194689
    reference_title: "Clinical and functional spectrum of RAC2-related immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated 54 patients (23 previously reported) from 37 families yielding 15 novel RAC2 missense mutations, including one present only in homozygosity."
    explanation: The published denominator, which spans all allelic classes and therefore over-counts this entry.
differential_diagnoses:
- name: Neutrophil Immunodeficiency Syndrome (RAC2 dominant-negative, IMD73A)
  description: >-
    Same gene, opposite biochemistry, different disease. The dominant-negative
    D57N allele gives a leukocyte-adhesion-deficiency mimic with neutrophilia and
    absent pus rather than a combined immunodeficiency with lymphopenia. The
    distinction is made functionally, not by gene panel.
  evidence:
  - reference: PMID:38194689
    reference_title: "Clinical and functional spectrum of RAC2-related immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "constitutively active RAS-like mutations caused neonatal SCID, dominant-negative mutations caused LAD-like disease, whereas dominant-activating mutations caused CID"
    explanation: The allele-class map that separates this entry from its two nearest neighbours in the same gene.
- name: Common variable immunodeficiency
  description: >-
    The clinical route by which several of these patients were first labelled.
    Hypogammaglobulinaemia with recurrent sinopulmonary infection and
    bronchiectasis in an adult is treated as CVID until a RAC2 variant is found,
    and one reported patient carried that label for years.
  evidence:
  - reference: PMID:41685306
    reference_title: "Case Report: Characterization of a RAC2 R68W homozygous activating mutation causing combined immune deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with intravenous immunoglobulins for presumed common variable immunodeficiency (CVID)."
    explanation: Documents the misattribution this differential exists to prevent.
discussions:
- discussion_id: imd73b_lymphopenia_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does constitutive RAC2 activation in the cytoskeletal and
    oxidase arms produce reduced thymic and bone-marrow lymphocyte output?
  attaches_to:
  - pathophysiology#T and B Lymphopenia with Impaired Lymphocyte Output
  rationale: >-
    Low TRECs and KRECs establish that output is reduced rather than that
    peripheral cells are being consumed, and accelerated caspase-3-positive
    apoptosis is measured in patient lymphocytes. What is missing is the step
    between them, since no patient thymus or marrow study demonstrates where in
    development the loss occurs. This entry therefore types the edge from
    apoptosis to lymphopenia as having unknown intermediates rather than
    asserting a pathway.
  evidence:
  - reference: PMID:31071452
    reference_title: "Heterozygous activating mutation in RAC2 causes infantile-onset combined immunodeficiency with susceptibility to viral infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunologic investigation revealed low numbers of TRECs/KRECs, a severe reduction of memory B cells, absence of isohemagglutinins, and low IgG levels."
    explanation: Establishes that output is reduced, which is the observation the missing mechanism has to explain.
- discussion_id: imd73b_allele_class_boundary
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where exactly is the boundary between the dominant-activating alleles that
    cause IMD73B and the constitutively active RAS-like alleles that cause
    neonatal SCID?
  attaches_to:
  - genetic#RAC2
  rationale: >-
    The cohort framework treats activity level as a continuum that maps onto
    discrete syndromes, but individual reports do not always sort cleanly. The
    G12R allele is described biochemically as gain of function while its three
    reported newborns presented with profound leukopenia and a severe
    autosomal-dominant SCID picture rather than the later-onset combined
    immunodeficiency of this entry. Until functional thresholds are standardized,
    assigning a new activating allele to IMD73B rather than to the SCID arm is a
    clinical judgement, not a measurement.
  evidence:
  - reference: PMID:31919089
    reference_title: "A gain-of-function RAC2 mutation is associated with bone-marrow hypoplasia and an autosomal dominant form of severe combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three newborns presenting with frequent infections and profound leukopenia, we identified a private, heterozygous mutation in the RAC2 gene (p.G12R)."
    explanation: A gain-of-function allele presenting at the SCID end rather than as later-onset CID, which is the boundary problem this gap records.
  - reference: PMID:38194689
    reference_title: "Clinical and functional spectrum of RAC2-related immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All tested RAC2 mutant proteins exhibited aberrant function; no single assay was sufficient to determine functional consequence."
    explanation: Confirms that no single functional measurement settles the class of a new allele.

name: "Myopia 24, Autosomal Dominant"
creation_date: "2026-10-22T20:30:00Z"
category: Mendelian
synonyms:
- MYP24
- SLC39A5-related high myopia
description: >-
  Nonsyndromic early-onset high myopia inherited as an autosomal dominant trait
  and caused by heterozygous loss-of-function variants in SLC39A5, which
  encodes the zinc transporter ZIP5. The founding family carried a nonsense
  variant and showed myopia before 10 years of age, refractive errors down to
  -25 diopters, axial lengths above 26 mm and myopic fundus changes. Later
  Chinese high myopia cohorts found further rare truncating and missense
  SLC39A5 variants in a small fraction of probands. Cell studies suggest that
  loss of ZIP5 lowers intracellular zinc, destabilizes Smad proteins and reduces
  TGF-beta-driven extracellular matrix synthesis, a plausible route to scleral
  weakening and axial elongation, but no animal model of the eye phenotype has
  been reported.
disease_term:
  preferred_term: myopia 24, autosomal dominant
  term:
    id: MONDO:0014411
    label: myopia 24, autosomal dominant
parents:
- High Myopia
notes: >-
  OMIM 615946 (MONDO cross-reference). Scope is the dominant high myopia
  phenotype of SLC39A5. ZIP5 is otherwise studied for intestinal and pancreatic
  zinc excretion and in several cancers; those roles are not part of this
  entry. All published families and variant carriers are Chinese, so the
  phenotype spectrum and penetrance outside that population are unknown. No
  GeneReviews chapter, Orphanet record or ClinGen gene-disease validity
  assertion for SLC39A5 and high myopia was found.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous SLC39A5 variants segregate with high myopia across three
    generations in the founding family and in a second family carrying a
    missense variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study reveals that loss-of-function mutations of SLC39A5 are associated with the autosome dominant non-syndromic high myopia"
    explanation: The gene-defining study assigns autosomal dominant inheritance from family segregation.
  - reference: PMID:30245926
    reference_title: Exome sequencing study of 20 patients with high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient R0020 had a clear molecular diagnosis with one missense variant rs756666376 in gene SLC39A5 (MYP24, autosomal dominant inheritance)."
    explanation: An independent exome study records MYP24 as autosomal dominant and finds a heterozygous carrier.
pathophysiology:
- name: SLC39A5 Loss of Function
  description: >-
    Disease alleles are heterozygous nonsense, frameshift and missense variants.
    The founding nonsense variant p.Y47* left normal SLC39A5 mRNA levels in
    patient lymphocytes but reduced protein, consistent with a truncated product,
    and neither p.Y47* nor p.M304T reproduced the effect of wild-type ZIP5 on
    Smad1 expression in transfected cells. ZIP5 is a zinc-selective uptake
    transporter, so loss of one functional copy is expected to reduce cellular
    zinc import.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLC39A5
    term:
      id: hgnc:20502
      label: SLC39A5
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: zinc ion transmembrane transporter activity
    term:
      id: GO:0005385
      label: zinc ion transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The protein level in the patients’ lymphocyte cell lines was decreased compared to the normal controls as demonstrated by immunoblot, but the mRNA expression level was not different between cases and controls"
    explanation: Patient-derived cells carrying p.Y47* have reduced ZIP5 protein, supporting a loss-of-function allele.
  - reference: PMID:15322118
    reference_title: The mammalian Zip5 protein is a zinc transporter that localizes to the basolateral surface of polarized cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we present evidence that mouse Zip5 is a zinc uptake transporter that is specific for Zn(II) over other potential metal ion substrates."
    explanation: Establishes the normal molecular function that the disease alleles lose.
  downstream:
  - target: Reduced Intracellular Zinc
    causal_link_type: DIRECT
    description: Loss of ZIP5 zinc import lowers intracellular zinc.
    evidence:
    - reference: PMID:34302427
      reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that SLC39A5 played a key role in maintaining intracellular zinc homeostasis."
      explanation: SLC39A5 knockout in HEK293 cells disturbed intracellular zinc homeostasis.
- name: Reduced Intracellular Zinc
  description: >-
    SLC39A5 knockout cells are zinc deficient. Zinc is needed to stabilize Smad
    proteins, so the deficit is the proposed link between the transporter defect
    and impaired TGF-beta signalling. This has been shown only in a non-ocular
    human cell line.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: zinc ion import across plasma membrane
    term:
      id: GO:0071578
      label: zinc ion import across plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, the SLC39A5 depletion-induced zinc deficiency destabilized Smad proteins, which inhibited the TGF-β signalling and downstream ECM synthesis, thus contributing to the pathogenesis of high myopia."
    explanation: SLC39A5 depletion produces intracellular zinc deficiency in cultured cells.
  downstream:
  - target: Impaired TGF-beta Smad Signaling
    causal_link_type: DIRECT
    description: Low zinc destabilizes Smad proteins and blunts R-Smad activation.
    evidence:
    - reference: PMID:34302427
      reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Finally, we determined that insufficient zinc chelation destabilized Smad proteins, which naturally inhibited TGF-β signalling."
      explanation: Directly links the zinc deficit to Smad instability and reduced TGF-beta signalling.
- name: Impaired TGF-beta Smad Signaling
  description: >-
    In SLC39A5 knockout cells, receptor Smad phosphorylation was largely blocked
    and TGF-beta signalling was inhibited; re-expression of SLC39A5 restored it.
    The founding study instead reported that wild-type, but not mutant, ZIP5
    suppressed Smad1 expression, so patient cells had higher Smad1. Both studies
    place the defect in BMP/TGF-beta Smad signalling, but they disagree on its
    direction (see the controversy discussion).
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TGF-beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further, we demonstrated that TGF-β signalling, the regulator of ECM, was inhibited in SLC39A5 depletion situation, wherein the activation of receptor Smads (R-Smads) via phosphorylation was greatly blocked."
    explanation: Knockout cells show reduced R-Smad phosphorylation and inhibited TGF-beta signalling.
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SLC39A5 re-expression reversed the phenotype of TGF-β signalling and ECM synthesis in the KO cells."
    explanation: Rescue by re-expression attributes the signalling defect to SLC39A5 loss.
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we found that wild-type, but not disease-associated SLC39A5 inhibited the expression of Smadl, a key phosphate protein in the downstream of the BMP/TGF-β (bone morphogenic protein/transforming growth factor-β) pathway."
    explanation: >-
      Disease alleles lose an effect of wild-type ZIP5 on a BMP/TGF-beta Smad,
      which places the defect in this pathway. The direction reported here
      (higher Smad1) differs from the later knockout study, so this supports
      pathway involvement rather than the DECREASED modifier.
  downstream:
  - target: Reduced Extracellular Matrix Synthesis
    causal_link_type: DIRECT
    description: Reduced TGF-beta signalling lowers transcription of collagen and other matrix genes.
    evidence:
    - reference: PMID:34302427
      reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overall, the SLC39A5 depletion-induced zinc deficiency destabilized Smad proteins, which inhibited the TGF-β signalling and downstream ECM synthesis, thus contributing to the pathogenesis of high myopia."
      explanation: States the signalling defect as upstream of reduced matrix synthesis.
- name: Reduced Extracellular Matrix Synthesis
  description: >-
    SLC39A5 knockout cells transcribe less COL1A1, COL2A1, COL4A1, FN1 and LAMA1
    and show injury of extracellular matrix constituents. Type I collagen is the
    main structural protein of the sclera, so a similar deficit in scleral
    fibroblasts would be expected to weaken the scleral wall; that step has not
    been tested in ocular tissue.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNA-seq and qRT-PCR revealed the transcription decrease in COL1A1, COL2A1, COL4A1, FN1 and LAMA1 in the KO cells."
    explanation: Matrix gene transcription falls when SLC39A5 is knocked out.
  downstream:
  - target: Scleral Extracellular Matrix Weakening
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - scleral_ecm_weakening
    description: >-
      Proposed step: reduced matrix synthesis in the sclera, where SLC39A5 is
      expressed, would weaken the scleral wall. Not yet tested in eye tissue.
- name: Scleral Extracellular Matrix Weakening
  description: >-
    Proposed tissue-level mechanism. SLC39A5 is expressed in the sclera and
    retina throughout mouse eye development, and remodelling of scleral
    extracellular matrix is a recurring finding in animal myopia models. A
    sclera with less collagen would be expected to stretch, lengthening the eye.
    No study has measured scleral matrix in SLC39A5 carriers or in an Slc39a5
    animal model.
  biological_scale: TISSUE
  locations:
  - preferred_term: sclera
    term:
      id: UBERON:0001773
      label: sclera
  evidence:
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "SLC39A5 was abundantly expressed in the sclera and retina across different stages of eye development."
    explanation: >-
      Mouse eye immunostaining places ZIP5 in the sclera, the tissue whose
      matrix is proposed to be affected. Expression alone does not show the
      matrix deficit.
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "Recently, scleral extracellular matrix (ECM) synthesis or remodelling has been proposed as an underlying cause of high myopia."
    explanation: >-
      Background framing from the knockout study that motivates the scleral
      matrix step. The sentence does not say what kind of evidence it
      summarizes, and it is not a result about SLC39A5.
  downstream:
  - target: Increased Axial Length of the Globe
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - scleral_ecm_weakening
    description: A weakened sclera is proposed to allow excess axial elongation of the eye.
    evidence:
    - reference: PMID:31560770
      reference_title: "Expanding the Phenotypic and Genotypic Landscape of Nonsyndromic High Myopia: A Cross-Sectional Study in 731 Chinese Patients."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Finally, SLC39A5, CCDC111, BSG, and P4HA2 were more relevant to eye elongation, while ZNF644, SCO2, and LEPREL1 appeared more relevant to refracting media."
      explanation: >-
        Genotype-phenotype analysis ties SLC39A5 variants to eye elongation
        rather than to the refracting media, consistent with a scleral or
        axial mechanism.
    - reference: PMID:42309346
      reference_title: "Scleral remodeling in myopia: mechanisms and therapeutic approaches."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "this review highlights the sclera as both a key driver of myopia pathology and a promising therapeutic target."
      explanation: >-
        A review of scleral biology in myopia in general treats the sclera as a
        driver of myopia. It says nothing about SLC39A5, so it supports only the
        general scleral step.
mechanistic_hypotheses:
- hypothesis_group_id: scleral_ecm_weakening
  hypothesis_label: Zinc-dependent scleral matrix deficit drives axial elongation
  status: EMERGING
  description: >-
    Reduced ZIP5 zinc import destabilizes Smad proteins, lowers TGF-beta-driven
    collagen synthesis and weakens the sclera, allowing the eye to elongate. The
    cellular steps rest on one HEK293 knockout study; the scleral and axial steps
    are inferred from SLC39A5 expression in mouse sclera and from
    genotype-phenotype data in human cohorts.
  evidence:
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, the SLC39A5 depletion-induced zinc deficiency destabilized Smad proteins, which inhibited the TGF-β signalling and downstream ECM synthesis, thus contributing to the pathogenesis of high myopia."
    explanation: The knockout study proposes this chain as the disease mechanism.

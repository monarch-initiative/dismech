experimental_models:
- name: SLC39A5 knockout HEK293 cells
  description: >-
    Human embryonic kidney cells with SLC39A5 knocked out, used to trace the
    zinc, Smad and extracellular matrix steps of the proposed mechanism.
  experimental_model_type: CELL_LINE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:34302427
  modeled_mechanisms:
  - target: Impaired TGF-beta Smad Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Knockout cells show blocked R-Smad phosphorylation that is rescued by SLC39A5 re-expression.
    limitations: >-
      A complete knockout in a kidney-derived line, not a heterozygous variant in
      scleral fibroblasts.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        HEK293 cells carry none of the scleral fibroblast context, mechanical
        load or ocular growth signals in which the human mechanism is proposed
        to act.
    - divergence_type: STRUCTURAL_IDEALIZATION
      materiality: QUALIFYING
      description: >-
        Patients are heterozygous for one loss-of-function allele, while the
        model removes SLC39A5 entirely, so the dosage of the zinc deficit is
        exaggerated.
    evidence:
    - reference: PMID:34302427
      reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Further, we demonstrated that TGF-β signalling, the regulator of ECM, was inhibited in SLC39A5 depletion situation, wherein the activation of receptor Smads (R-Smads) via phosphorylation was greatly blocked."
      explanation: The model reports the signalling defect it is linked to.
  - target: Reduced Extracellular Matrix Synthesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Knockout cells transcribe less collagen, fibronectin and laminin.
    limitations: >-
      Matrix gene transcription was measured in kidney-derived cells; scleral
      collagen content was not measured.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model measures matrix gene transcription in HEK293 cells, which stands
        in for collagen deposition by scleral fibroblasts, the quantity the
        mechanism needs.
    evidence:
    - reference: PMID:34302427
      reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "RNA-seq and qRT-PCR revealed the transcription decrease in COL1A1, COL2A1, COL4A1, FN1 and LAMA1 in the KO cells."
      explanation: The model reports the matrix transcription deficit it is linked to.
discussions:
- discussion_id: smad_direction_conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: Does SLC39A5 loss increase or decrease BMP/TGF-beta Smad signalling?
  attaches_to:
  - pathophysiology#Impaired TGF-beta Smad Signaling
  rationale: >-
    The founding study found that wild-type ZIP5 suppresses Smad1 and that the
    disease alleles do not, giving higher Smad1 in patient lymphocytes. The later
    knockout study found destabilized Smad proteins and reduced R-Smad
    phosphorylation. The two used different cells, readouts and Smads (Smad1
    versus receptor Smads generally), and neither measured signalling in
    scleral cells, so the direction of the pathway change in the eye is unknown.
  evidence:
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we found that wild-type, but not disease-associated SLC39A5 inhibited the expression of Smadl, a key phosphate protein in the downstream of the BMP/TGF-β (bone morphogenic protein/transforming growth factor-β) pathway."
    explanation: Reports increased Smad1 when ZIP5 function is lost.
  - reference: PMID:34302427
    reference_title: SLC39A5 dysfunction impairs extracellular matrix synthesis in high myopia pathogenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, we determined that insufficient zinc chelation destabilized Smad proteins, which naturally inhibited TGF-β signalling."
    explanation: Reports decreased Smad stability and TGF-beta signalling when ZIP5 is lost.
- discussion_id: no_ocular_animal_model
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does loss of Slc39a5 cause axial elongation or scleral matrix change in an animal eye?
  attaches_to:
  - pathophysiology#Scleral Extracellular Matrix Weakening
  - phenotypes#Increased Axial Length of the Globe
  rationale: >-
    Slc39a5 knockout mice exist and are viable, but they were characterized only
    for intestinal and pancreatic zinc handling. No study has measured refraction,
    axial length or scleral collagen in them, so the scleral and axial steps of
    the mechanism rest on expression data and on cell-line results.
  evidence:
  - reference: PMID:24303081
    reference_title: The zinc transporter Zip5 (Slc39a5) regulates intestinal zinc excretion and protects the pancreas against zinc toxicity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that ZIP5 is not essential for growth and viability but total knockout of ZIP5 led to increased zinc in the liver in mice fed a zinc-adequate (ZnA) diet"
    explanation: A viable knockout mouse exists that could be examined for an eye phenotype.

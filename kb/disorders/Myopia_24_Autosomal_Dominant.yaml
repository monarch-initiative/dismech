      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "One individual (HG00701) from the Chinese population in the 1000 genome project carried this variant. Since there is no phenotype record in the 1000 genome samples, it is unclear whether the individual has the myopia phenotype or not."
      explanation: >-
        A population carrier of p.Y47* with unknown phenotype, so the
        penetrance of this allele is not established.
  - name: c.911T>C (p.M304T)
    description: >-
      Missense variant in a transmembrane domain (the founding paper places it
      in the third in its results and in the fourth in its discussion) that
      co-segregated in a three-member family and was absent from 1276 controls.
      It did not change ZIP5 localization but failed to suppress Smad1 expression.
    evidence:
    - reference: PMID:24891338
      reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a missense mutation (c.911T>C:p.M304T) was identified and co-segregated in another family by screening additional cases"
      explanation: Second segregating allele in an independent family.

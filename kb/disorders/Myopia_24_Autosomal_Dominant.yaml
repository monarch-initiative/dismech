genetic:
- name: SLC39A5
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SLC39A5
    term:
      id: hgnc:20502
      label: SLC39A5
  notes: >-
    Reported heterozygous variants include the nonsense p.Y47* (founding family
    and an unrelated sporadic case), missense p.M304T (a second family),
    p.Gly293Arg, p.Pro287Leu, p.Arg319Thr, p.G413A, frameshifts p.Arg243fs*140,
    p.V451Cfs*76 and p.P342Tfs*41, and missense c.577G>A. Each later cohort finds
    SLC39A5 variants in a few percent or less of Chinese high myopia probands,
    and several missense variants were classified on prediction and absence from
    controls rather than on functional testing. Penetrance has not been
    measured: the founding p.Y47* allele is also carried by one 1000 Genomes
    individual (HG00701) with no phenotype record. No external gene-disease
    validity classification was found, so none is recorded.
  evidence:
  - reference: PMID:24891338
    reference_title: SLC39A5 mutations interfering with the BMP/TGF-β pathway in non-syndromic high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a nonsense mutation (c.141C>G:p.Y47*) in SLC39A5 co-segregating with the phenotype in a non-syndromic severe high myopia family."
    explanation: Primary gene-disease report from linkage and exome sequencing.
  - reference: PMID:32215939
    reference_title: Mutation screening of 17 candidate genes in a cohort of 67 probands with early-onset high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one novel frameshift mutation (c.726dupA, p.Arg243fs*140) in SLC39A5"
    explanation: A truncating SLC39A5 variant in an independent Tujia Chinese early-onset high myopia cohort.
  - reference: PMID:35002215
    reference_title: "Mutational screening of AGRN, SLC39A5, SCO2, P4HA2, BSG, ZNF644, and CPSF1 in a Chinese cohort of 103 patients with nonsyndromic high myopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "c.1350delC, p.V451Cfs*76 and c.1023_1024insA, p.P342Tfs*41 in SLC39A5"
    explanation: Two further frameshift variants in sporadic high myopia patients.
  - reference: PMID:28442722
    reference_title: "Mutational screening of SLC39A5, LEPREL1 and LRPAP1 in a cohort of 187 high myopia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three novel missense mutations, c.860C > T, p.Pro287Leu and c.956G > C, p.Arg319Thr in SLC39A5"
    explanation: Further candidate missense variants in an adult Chinese high myopia cohort.
  - reference: PMID:40920702
    reference_title: 18 individual genes underwent variant screening in a northwest Chinese group comprised 83 probands diagnosed with early-onset high myopia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings support the hypothesis that the variants observed in TNFRSF21, CPSF1, ZNF644, and SLC39A5 are the causative genes of eo-HM"
    explanation: A co-segregating SLC39A5 missense variant in a northwest Chinese cohort.
  - reference: PMID:25525168
    reference_title: "Detection of mutations in LRPAP1, CTSH, LEPREL1, ZNF644, SLC39A5, and SCO2 in 298 families with early-onset high myopia by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SLC39A5 gene showed a heterozygous missense variant (c.1238G>C, p.G413A) in a sporadic individual."
    explanation: >-
      Only one candidate variant in 298 probands, and the authors leave its
      pathogenicity open, which shows how rare SLC39A5 disease is in this
      population.
  variants:
  - name: c.141C>G (p.Y47*)
    description: >-
      Nonsense variant in the amino-terminal domain. Co-segregated in the

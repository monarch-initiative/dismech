      id: GO:0038187
      label: pattern recognition receptor activity
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular and biochemical assays indicate that these mutations confer gain of function such that mutant IFIH1 binds RNA more avidly, leading to increased baseline and ligand-induced interferon signaling."
    explanation: Biochemical demonstration of gain of function.
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified mutations cluster close to the ATP binding region of the protein."
    explanation: Location of the disease variants in the protein.
  downstream:

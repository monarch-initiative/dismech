biochemical:
- name: Interferon-stimulated gene expression
  presence: INCREASED
  notes: >-
    The blood interferon signature is raised in nearly all carriers,
    including clinically unaffected ones, so it supports the diagnosis but
    does not predict disease. As a treatment marker it is unreliable: it fell
    with clinical benefit in some patients on a JAK inhibitor, but skin
    disease improved on tofacitinib with no fall in the signature, and one
    patient stayed clinically stable on baricitinib with a persistently
    raised score.
  evidence:
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were associated with enhanced type I interferon signaling, including six variants (22%) which were predicted as benign according to multiple in silico pathogenicity programs."
    explanation: Interferon signaling is raised with every variant.
  - reference: PMID:25620204
    reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon signature genes were upregulated in SMS individuals' blood and dental cells."
    explanation: Raised interferon signature in SMS patients.
  readouts:
  - target: JAK1-STAT1 Signal Transduction and Interferon-Stimulated Gene Induction
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A raised score shows that interferon-stimulated genes are being induced.
      It is present in clinically unaffected carriers too, so it marks the
      genotype's activity and not clinical disease.
    evidence:
    - reference: PMID:31898846
      reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data confirm variable expression and nonpenetrance as important characteristics of the IFIH1 genotype, a consistent association with enhanced type I interferon signaling, and a common mutational mechanism involving increased RNA binding affinity or decreased efficiency of ATP hydrolysis and filament disassembly rate."
      explanation: Enhanced interferon signaling is consistent across carriers, including nonpenetrant ones.
  - target: JAK1-STAT1 Signal Transduction and Interferon-Stimulated Gene Induction
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: PHARMACODYNAMIC
    interpretation: >-
      The score can fall on a JAK inhibitor, but the fall does not track
      clinical response reliably in this disease.
    evidence:
    - reference: PMID:32042913
      reference_title: "Aicardi-Goutières syndrome due to a paternal mosaic IFIH1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Both children responded with a significant reduction of the IFN signature"
      explanation: The signature fell on ruxolitinib in two brothers.
    - reference: PMID:40176112
      reference_title: "Tofacitinib treatment for psoriatic skin lesions associated with Aicardi-Goutières syndrome 7/Singleton-Merten syndrome 1."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Within one month of starting tofacitinib, psoriatic rashes and ulcerative skin lesions markedly improved, in the absence of a reduction in the IFN-stimulated gene signature or CD169 expression on monocytes."
      explanation: Clinical improvement without a fall in the signature, against its use as a response marker.
    - reference: PMID:42033272
      reference_title: "Movement Disorders in Aicardi-Goutières Syndrome and Response to Immunomodulation."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "Patient 2 (IFIH1‐related AGS) remained clinically stable despite a persistently elevated interferon score."
      explanation: Clinical stability on baricitinib with no fall in the score, against its use as a response marker.

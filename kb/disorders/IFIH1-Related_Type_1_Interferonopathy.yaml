  biological_scale: CELLULAR
  description: >-
    Regulatory T cells from mice with constitutively active MDA5 fail to
    suppress colitis on transfer, and regain that function when the interferon
    receptor is deleted. The authors propose this as one route to autoimmunity
    in interferonopathies. Shown in mice only.

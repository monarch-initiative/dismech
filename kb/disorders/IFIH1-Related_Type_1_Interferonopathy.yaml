genetic:
- name: IFIH1
  gene_term:
    preferred_term: IFIH1
    term:
      id: hgnc:18873
      label: IFIH1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    IFIH1 (2q24.2) encodes MDA5, a RIG-I-like receptor that senses cytosolic
    double-stranded RNA and signals through MAVS to induce type I interferon.
    Heterozygous gain-of-function variants cause this disease. Common IFIH1
    polymorphisms that modify autoimmune risk, and loss-of-function variants
    that predispose to viral infection, are different mechanisms and are not
    part of this entry. The variant is usually germline, but one AGS7 patient
    with lupus-like disease carried a somatic gain-of-function variant
    (PMID:40043752).
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that heterozygous mutations in the cytosolic double-stranded RNA receptor gene IFIH1 (also called MDA5) cause a spectrum of neuroimmunological features consistently associated with an enhanced interferon state."
    explanation: Discovery of heterozygous IFIH1 variants as the cause.
  variants:
  - name: NM_022168:c.2465G>A (p.Arg822Gln)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: Recurrent Singleton-Merten allele.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified a common missense mutation, c.2465G>A (p.Arg822Gln), in interferon induced with helicase C domain 1"
      explanation: The allele in five SMS patients from three families.
  - name: NM_022168:c.2336G>A (p.Arg779His)
    type: MISSENSE
    description: >-
      Inherited by two brothers with spastic paraplegia from their
      asymptomatic father, who was mosaic.
    evidence:
    - reference: PMID:32042913
      reference_title: "Aicardi-Goutières syndrome due to a paternal mosaic IFIH1 mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Thus, both children inherited the R779H mutation through a germline mosaic from the father."
      explanation: Paternal germline mosaicism for the allele.
treatments:
- name: Ruxolitinib
  description: >-
    The JAK1/2 inhibitor ruxolitinib, which blocks signaling from the type I
    interferon receptor, has been given off label to three patients in two
    reports. In a child with SMS1, psoriasis cleared and the interferon
    signature normalized within days, and weakness, osteopenia and growth
    improved. Two brothers with AGS7 presenting as spastic paraplegia had a
    significant fall in the interferon signature, better quality of life, and
    maintained or slightly improved motor function.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: JAK inhibitor pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_mechanisms:
  - target: Chronic Type I Interferon Signaling in Tissues
    description: Blocks JAK signaling downstream of the interferon receptor.
  evidence:
  - reference: PMID:35410415
    reference_title: "Precision treatment of Singleton Merten syndrome with ruxolitinib: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within days of treatment, psoriatic skin lesions resolved completely and the IFN signature normalized."
    explanation: Rapid response of skin disease and interferon signature.
  - reference: PMID:35410415
    reference_title: "Precision treatment of Singleton Merten syndrome with ruxolitinib: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutic efficacy was sustained and over the course muscular weakness, osteopenia and growth also improved."
    explanation: Sustained benefit on systemic features.
  - reference: PMID:32042913
    reference_title: "Aicardi-Goutières syndrome due to a paternal mosaic IFIH1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children responded with a significant reduction of the IFN signature"
    explanation: Interferon signature response in two brothers with AGS7.
  - reference: PMID:32042913
    reference_title: "Aicardi-Goutières syndrome due to a paternal mosaic IFIH1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both children were able to maintain and even moderately improve their motor abilities, with a progress more noticeable in the younger brother, whose gait using orthoses improved by 40% after 8 months of treatment"
    explanation: Clinical benefit on motor function in the same two patients.

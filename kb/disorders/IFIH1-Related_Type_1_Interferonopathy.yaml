    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of IFIH1 mutation-positive probands (F102, F163, F259_1, F376 and F647) demonstrated a clinical picture typical of neonatal AGS (Supplementary Note, Supplementary Table 2)."

      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  evidence:
  - reference: PMID:36685504
    reference_title: "Case report: Pneumocystis jirovecii pneumonia in a severe case of Aicardi-Goutières syndrome with an IFIH1 gain-of-function mutation mimicking combined immunodeficiency."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this case, therapy with baricitinib effectively blocked IFN-α activation and reduced STAT1 signaling but had no effect on the progression of the neurological disease."
    explanation: >-
      A JAK inhibitor lowered STAT1 signaling in an infant with an IFIH1
      variant, which shows the pathway is active and drug-sensitive in the
      disease. The inference from drug response to mechanism is indirect.
  - reference: PMID:25620204
    reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interferon signature genes were upregulated in SMS individuals' blood and dental cells."
    explanation: Interferon-stimulated genes are raised in patient blood and dental cells.
  downstream:
  - target: Chronic Type I Interferon Signaling in Tissues
    causal_link_type: DIRECT
    description: Continuous interferon-stimulated gene expression in every tissue the interferon reaches.
    evidence:
    - reference: PMID:24686847
      reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found that heterozygous mutations in the cytosolic double-stranded RNA receptor gene IFIH1 (also called MDA5) cause a spectrum of neuroimmunological features consistently associated with an enhanced interferon state."
      explanation: An enhanced interferon state accompanies the whole clinical spectrum.
- name: Chronic Type I Interferon Signaling in Tissues
  biological_scale: ORGANISM
  description: >-
    Sustained interferon receptor signaling in brain, vessels, bone, teeth and
    skin. Why one carrier develops encephalopathy and another vascular and
    dental calcification is not known; modifying genes and environmental
    triggers are both proposed.
  notes: >-
    Deliberately not conformed to cgas_sting_pathway_activation. MDA5 is a
    cytosolic double-stranded RNA sensor that signals through MAVS rather than
    cGAS or STING, and that module admits a conforming node only on evidence of
    STING dependence, naming the MDA5/IFIH1 interferonopathies as outside it.
    No current module carries a sensor-agnostic interferonopathy endpoint for
    this node to conform to.

    About half the phenotypes have no incoming causal edge, because no cached
    source connects them to a mechanism. Which ones changes as the entry
    grows, so they are not listed here: `just list-disconnected-phenotypes`
    on this file names them.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that heterozygous mutations in the cytosolic double-stranded RNA receptor gene IFIH1 (also called MDA5) cause a spectrum of neuroimmunological features consistently associated with an enhanced interferon state."
    explanation: An enhanced interferon state underlies the whole spectrum.
  downstream:
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: DIRECT
    description: Interferon expands and activates microglia in the brain.
    evidence:
    - reference: PMID:33165593
      reference_title: "Aicardi-Goutières syndrome-like encephalitis in mutant mice with constitutively active MDA5."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Increases in the number of microglia were observed in MDA5/MAVS signaling- and IFN-I-dependent manners."
      explanation: Microglial expansion in the mouse depends on MAVS and on type I interferon.
  - target: Suppressed Bone Turnover
    causal_link_type: DIRECT
    description: Interferon lowers osteoclast number and bone formation.
    evidence:
    - reference: PMID:31366715
      reference_title: "Singleton-Merten Syndrome-like Skeletal Abnormalities in Mice with Constitutively Activated MDA5."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "indicating the critical role of type I IFNs induced by MDA5/MAVS-dependent signaling in the bone pathogenesis of Ifih1gs/+ mice, affecting bone turnover."
      explanation: The bone abnormalities of the mouse are absent when Mavs or the interferon receptor is deleted.
  - target: Regulatory T Cell Dysfunction
    causal_link_type: DIRECT

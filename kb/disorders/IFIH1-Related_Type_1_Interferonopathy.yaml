pathophysiology:
- name: Heterozygous IFIH1 Gain-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense variants, and at least one in-frame deletion, cluster near the
    ATP-binding region of the MDA5 helicase. The mutant protein binds
    double-stranded RNA more avidly, hydrolyzes ATP less efficiently and
    disassembles its filaments more slowly.
  genes:
  - preferred_term: IFIH1
    term:
      id: hgnc:18873
      label: IFIH1
  molecular_functions:
  - preferred_term: double-stranded RNA binding
    term:
      id: GO:0003725
      label: double-stranded RNA binding
    modifier: INCREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular and biochemical assays indicate that these mutations confer gain of function such that mutant IFIH1 binds RNA more avidly, leading to increased baseline and ligand-induced interferon signaling."
    explanation: Biochemical demonstration of gain of function.
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified mutations cluster close to the ATP binding region of the protein."
    explanation: Location of the disease variants in the protein.
  downstream:
  - target: Loss of MDA5 Tolerance to Endogenous Double-Stranded RNA
    causal_link_type: DIRECT
    description: >-
      The variant receptor tolerates the mismatches and bulges of cellular RNA
      duplexes that keep the wild-type receptor from assembling on them.
    evidence:
    - reference: PMID:29395326
      reference_title: "Breaching Self-Tolerance to Alu Duplex RNA Underlies MDA5-Mediated Inflammation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "While wild-type MDA5 cannot efficiently recognize Alu-dsRNAs because of its limited filament formation on imperfect duplexes, AGS variants of MDA5 display reduced sensitivity to duplex structural irregularities, assembling signaling-competent filaments on Alu-dsRNAs."
      explanation: Disease variants assemble filaments on cellular Alu duplexes that the wild-type receptor ignores.
- name: Loss of MDA5 Tolerance to Endogenous Double-Stranded RNA
  biological_scale: MOLECULAR
  description: >-
    Mutant MDA5 forms signaling-competent filaments on the cell's own
    double-stranded RNA, chiefly duplexes formed by inverted Alu
    retroelements, so the receptor is activated without a virus.
  genes:
  - preferred_term: IFIH1
    term:
      id: hgnc:18873
      label: IFIH1
  molecular_functions:
  - preferred_term: pattern recognition receptor activity
    term:
      id: GO:0038187
      label: pattern recognition receptor activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:29395326
    reference_title: "Breaching Self-Tolerance to Alu Duplex RNA Underlies MDA5-Mediated Inflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a newly developed RNase-protection/RNA-seq approach, we demonstrate here that constitutive activation of MDA5 in AGS results from the loss of tolerance to cellular dsRNAs formed by Alu retroelements."
    explanation: Identifies Alu duplex RNA as the self ligand of the disease variants.
  downstream:
  - target: Constitutive MDA5-MAVS Signaling
    causal_link_type: DIRECT
    description: >-
      Filaments assembled on self RNA signal to the adaptor MAVS. In cells,
      the baseline signaling of the mutants was lost when RNA binding,
      filament formation or the signaling domain was disabled.
    evidence:
    - reference: PMID:24686847
      reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the basal, and induced, signaling activity of the six mutants was significantly diminished upon the introduction of additional mutations into the RNA binding site (His927Ala), the filament protein:protein interface (Ile841Arg/Glu842Arg), and the 2CARD (Arg21Ala/Lys23Ala)(Fig. 3b)13, suggesting that the basal signaling activity of these mutants is induced by as-yet undefined endogenous dsRNA."
      explanation: Baseline signaling of the mutants depends on RNA binding, filament formation and the MAVS-activating domain.
- name: Constitutive MDA5-MAVS Signaling
  biological_scale: CELLULAR
  description: >-
    Activated MDA5 signals through the mitochondrial adaptor MAVS. In mice
    carrying a constitutively active MDA5, deleting Mavs removes the
    inflammatory disease, which places every later step downstream of this
    adaptor. No drug in clinical use acts at this level.
  genes:
  - preferred_term: MAVS
    term:
      id: hgnc:29233
      label: MAVS
  molecular_functions:
  - preferred_term: signaling adaptor activity
    term:
      id: GO:0035591
      label: signaling adaptor activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: MDA-5 signaling pathway
    term:
      id: GO:0039530
      label: MDA-5 signaling pathway
    modifier: INCREASED
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "IFIH1 belongs to the RIG-I-like family of cytoplasmic DExD/H box RNA receptors and activates type I interferon signaling through an adaptor molecule, MAVS (mitochondrial antiviral signaling protein)."
    explanation: Background statement that MDA5 signals through MAVS.
  - reference: PMID:24530055
    reference_title: "Autoimmune disorders associated with gain of function of the intracellular sensor MDA5."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inflammation was dependent on an adaptor molecule, MAVS indicating the importance of MDA5-signaling."
    explanation: Disease in the constitutively active MDA5 mouse requires MAVS.
  - reference: PMID:35168003
    reference_title: "Intracellular virus sensor MDA5 mutation develops autoimmune myocarditis and nephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "R779H Tg Mavs-/- and R779H Tg Ifnar-/- showed no phenotypes, indicating direct MDA5-signaling pathway involvement."
    explanation: Mice expressing the human R779H variant are rescued by deleting Mavs.
  downstream:
  - target: Type I Interferon Overproduction
    causal_link_type: DIRECT
    description: MAVS signaling induces type I interferon genes.
    evidence:
    - reference: PMID:24995871
      reference_title: "Aicardi-Goutières syndrome is caused by IFIH1 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro functional analysis revealed that IFIH1 mutations increased type I interferon production, and the transcription of interferon-stimulated genes were elevated."
      explanation: Disease variants raise type I interferon production in cells.
  - target: Interleukin-6 Overproduction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In mice carrying the human R822Q variant, a double-stranded RNA
      challenge produced lethal hypercytokinemia dominated by interleukin-6,
      which deleting Mavs or the interferon receptor alleviated. Whether
      interleukin-6 rises this way in patients without such a trigger is not
      established.
    evidence:
    - reference: PMID:36426976
      reference_title: "Double-Stranded RNA Induces Mortality in an MDA5-Mediated Type I Interferonopathy Model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Poly(I:C)-injected hM-R822Q Tg mice also developed lethal hypercytokinemia marked by massive IL-6 levels in the serum."
      explanation: >-
        Interleukin-6 release after a double-stranded RNA challenge in mice
        with the Singleton-Merten variant. A provoked mouse response, so
        indirect for the unprovoked human state.
- name: Type I Interferon Overproduction
  biological_scale: CELLULAR
  description: >-
    Mutant MDA5 triggers type I interferon production without infection.
    Every variant tested in the largest cohort raised interferon signaling,
    including variants that prediction tools called benign, and serum
    interferon-alpha is raised in patients.
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were associated with enhanced type I interferon signaling, including six variants (22%) which were predicted as benign according to multiple in silico pathogenicity programs."
    explanation: Enhanced interferon signaling is common to all variants.
  - reference: PMID:25777993
    reference_title: "Brief Report: IFIH1 Mutation Causes Systemic Lupus Erythematosus With Selective IgA Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite systemic immunosuppressive treatment, disease activity persisted in the patient and was associated with elevated serum levels of IFNα and up-regulation of IFIH1 itself."
    explanation: Raised serum interferon-alpha in a patient with the R779H variant.
  downstream:
  - target: Type I Interferon Receptor Engagement
    causal_link_type: DIRECT
    description: Secreted interferon acts on its receptor throughout the body.
    evidence:
    - reference: PMID:24530055
      reference_title: "Autoimmune disorders associated with gain of function of the intracellular sensor MDA5."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, intercrossing the mutant mice with type I IFN receptor-deficient mice ameliorated clinical manifestations."
      explanation: Removing the interferon receptor ameliorates disease in the constitutively active MDA5 mouse.
- name: Type I Interferon Receptor Engagement
  biological_scale: CELLULAR
  description: >-
    Type I interferons bind the IFNAR1/IFNAR2 receptor. In three mouse models
    of constitutively active MDA5, deleting the receptor prevents the lupus-like,
    cardiac and bone disease, so the receptor is a required step. It is the
    target of receptor-blocking antibodies, none of which has been reported in
    a patient with an IFIH1 variant.
  genes:
  - preferred_term: IFNAR1
    term:
      id: hgnc:5432
      label: IFNAR1
  - preferred_term: IFNAR2
    term:
      id: hgnc:5433
      label: IFNAR2
  molecular_functions:
  - preferred_term: type I interferon receptor activity
    term:
      id: GO:0004905
      label: type I interferon receptor activity
    modifier: INCREASED
  evidence:
  - reference: PMID:35168003
    reference_title: "Intracellular virus sensor MDA5 mutation develops autoimmune myocarditis and nephritis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "R779H Tg Mavs-/- and R779H Tg Ifnar-/- showed no phenotypes, indicating direct MDA5-signaling pathway involvement."
    explanation: Mice expressing the human R779H variant are rescued by deleting the interferon receptor.
  - reference: PMID:36426976
    reference_title: "Double-Stranded RNA Induces Mortality in an MDA5-Mediated Type I Interferonopathy Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interrupting the IFN signaling through mitochondrial antiviral signaling protein or IFN-α/β receptor alleviated hM-R822Q-induced inflammation."
    explanation: Deleting the interferon receptor alleviates inflammation in mice with the Singleton-Merten variant.
  downstream:
  - target: JAK1-STAT1 Signal Transduction and Interferon-Stimulated Gene Induction
    causal_link_type: DIRECT
    description: The occupied receptor signals through receptor-associated Janus kinases to STAT transcription factors.
    evidence:
    - reference: PMID:36685504
      reference_title: "Case report: Pneumocystis jirovecii pneumonia in a severe case of Aicardi-Goutières syndrome with an IFIH1 gain-of-function mutation mimicking combined immunodeficiency."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "A gain-of-function (GOF) mutation in the IFIH1 gene is associated with robust production of type I IFN and activation of the Janus kinase (JAK) signal transducer and activator of the transcription (STAT) pathway, which can cause AGS type 7."
      explanation: Background statement that interferon from IFIH1 gain of function activates JAK-STAT signaling.
- name: JAK1-STAT1 Signal Transduction and Interferon-Stimulated Gene Induction
  biological_scale: CELLULAR
  description: >-
    Janus kinases at the interferon receptor phosphorylate STAT1, which
    drives transcription of interferon-stimulated genes. This is the step the
    JAK inhibitors ruxolitinib, baricitinib and tofacitinib block, and the
    blood interferon signature is its readout.
  genes:
  - preferred_term: JAK1

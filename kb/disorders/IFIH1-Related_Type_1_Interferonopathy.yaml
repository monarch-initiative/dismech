    evidence_source: MODEL_ORGANISM
    snippet: "We found that experimental colitis induced by adoptive transfer of naïve T cells in Rag2-/- mice was rescued by simultaneous transfer of Tregs from wild-type but not from the MDA5 mutant mice."

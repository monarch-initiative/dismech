- name: Baricitinib
  description: >-
    The JAK1/2 inhibitor baricitinib was given in an open-label expanded-access
    study of 35 patients with genetically confirmed Aicardi-Goutieres
    syndrome. The interferon signature fell, symptom diaries improved and many
    children gained new developmental milestones. The cohort mixed AGS
    genotypes and the cached report does not give results by gene, so the
    evidence applies to AGS7 only as part of AGS.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE

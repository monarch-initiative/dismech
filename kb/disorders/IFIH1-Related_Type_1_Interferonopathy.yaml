discussions:
- discussion_id: ifih1_jaki_cns_penetration
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can blocking interferon signaling in the periphery protect the brain in
    IFIH1-related disease, or does the central nervous system need a drug
    that reaches it?
  attaches_to:
  - pathophysiology#Microglial Activation and Neuroinflammation
  - pathophysiology#JAK1-STAT1 Signal Transduction and Interferon-Stimulated Gene Induction
  - treatments#Baricitinib
  rationale: >-
    Every reported neurological outcome on a JAK inhibitor in an IFIH1
    carrier is stabilization at best, never recovery, and in one infant the
    neurological disease progressed while interferon and STAT1 signaling were
    demonstrably suppressed. A post-mortem study of an AGS patient treated
    with baricitinib from two months of age found severe atrophy and
    abundant calcification despite that early start, and its authors call for
    agents with better central nervous system availability. A multicentre
    comparison found neuroradiological change in untreated patients equal to
    or greater than in treated ones. Against that, plasma neurofilament light
    chain and glial fibrillary acidic protein fall on treatment while the
    interferon score does not move, which suggests some central effect that
    the usual biomarker cannot see. Whether the limit is drug exposure in the
    brain, irreversible injury already present at diagnosis, or a
    JAK-independent arm of the disease is unresolved, and the three answers
    imply different drugs.
  evidence:
  - reference: PMID:38381212
    reference_title: "Neuropathologic Impacts of JAK Inhibitor Treatment in Aicardi-Goutières Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study showed profound central nervous system (CNS) sequelae despite early initiation of treatment."
    explanation: >-
      Severe neuropathology despite four years of baricitinib from two months
      of age. The patient's gene is not stated in the abstract, so this is
      AGS in general.
  - reference: PMID:36685504
    reference_title: "Case report: Pneumocystis jirovecii pneumonia in a severe case of Aicardi-Goutières syndrome with an IFIH1 gain-of-function mutation mimicking combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this case, therapy with baricitinib effectively blocked IFN-α activation and reduced STAT1 signaling but had no effect on the progression of the neurological disease."
    explanation: Pathway suppression without neurological benefit in a patient with an IFIH1 variant.
  - reference: PMID:41871482
    reference_title: "Efficacy of JAK1/2 inhibitors in AGS genes-related interferonopathies: A multicenter retrospective observational study with treated vs untreated comparison."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroroimaging analyses in untreated patients showed radiological improvements equal to or greater than those treated, raising doubts about the true impact of JAK 1/2 inhibitors on the neuroradiological course."
    explanation: Imaging course in treated and untreated patients with AGS-gene interferonopathies.
  - reference: PMID:42064048
    reference_title: "Beyond the interferon score: neurofilament light chain and glial fibrillary acidic protein capture immune-mediated neuroinjury and response to JAK inhibition in Aicardi-Goutières syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Longitudinal within-patient analyses demonstrated significant declines in pNfL and pGFAP following initiation of JAK inhibitor therapy, whereas the IFN score remained unchanged."
    explanation: >-
      Markers of neuroaxonal and astroglial injury fall on treatment, against
      the view that JAK inhibition does nothing centrally. The cohort of 55
      AGS patients is of mixed genotype.
- discussion_id: ifih1_targeted_therapy_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    No approved or trial therapy acts upstream of the interferon receptor in
    IFIH1-related disease, and the trials that do target upstream steps
    exclude IFIH1. What would a mechanism-matched therapy look like?
  attaches_to:
  - pathophysiology#Loss of MDA5 Tolerance to Endogenous Double-Stranded RNA
  - pathophysiology#Constitutive MDA5-MAVS Signaling
  - pathophysiology#Type I Interferon Receptor Engagement
  rationale: >-
    The mouse genetics place the whole disease downstream of MAVS and of the
    interferon receptor, and the self ligand is known to be Alu duplex RNA.
    Yet no drug targets the receptor, the sensor or the ligand in a patient
    with an IFIH1 variant. Receptor blockade with anifrolumab has been used
    in other type I interferonopathies and in AGS due to other genes, but no
    IFIH1 case is reported. The reverse transcriptase inhibitor trials and
    the IMSB301 phase 1b study restrict entry to the nucleic-acid metabolism
    genotypes and explicitly exclude the remaining AGS subtypes, which is
    mechanistically coherent, since blocking retroelement reverse
    transcription addresses a DNA-sensing route rather than the RNA-sensing
    one, but it leaves IFIH1 carriers with JAK inhibitors as the only
    pathway-directed option.
  evidence:
  - reference: PMID:39441221
    reference_title: "Normalized Interferon Signatures and Clinical Improvements by IFNAR1 Blocking Antibody (Anifrolumab) in Patients with Type I Interferonopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show in four patients with SAVI and one patient with CANDLE syndrome that blockade of the IFNAR1 receptor (Anifrolumab) exerts an additive effect over JAK-inhibitor alone."
    explanation: >-
      Receptor blockade adds to JAK inhibition in other type I
      interferonopathies. None of these patients had an IFIH1 variant.
  - reference: clinicaltrials:NCT04731103
    reference_title: "Inhibition of Reverse Transcription in Type I Interferon Mediated Neuropathology"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Investigators wish to treat AGS patients with drugs called reverse transcriptase inhibitors (RTIs), used to fight the HIV-1 virus that causes AIDS."
    explanation: >-
      The approach this trial tests. Its genotype restriction is in the
      registry's eligibility section, which the cached record does not carry,
      so that part is recorded in the entry notes rather than quoted here.
  - reference: PMID:29395326
    reference_title: "Breaching Self-Tolerance to Alu Duplex RNA Underlies MDA5-Mediated Inflammation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, our work demonstrates that the increased efficiency of MDA5 in recognizing dsRNA comes at a cost of self-recognition and implicates a unique role of Alu-dsRNAs as virus-like elements that shape the primate immune system."
    explanation: Identifies the self ligand, a target no current drug addresses.

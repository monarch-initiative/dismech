pathophysiology:
- name: Heterozygous IFIH1 Gain-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense variants, and at least one in-frame deletion, cluster near the
    ATP-binding region of the MDA5 helicase. The mutant protein binds
    double-stranded RNA more avidly, hydrolyzes ATP less efficiently and
    disassembles its filaments more slowly.

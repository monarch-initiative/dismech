      snippet: "In contrast, two patients (F237 and F626) were developmentally normal until the second year of life, at which point they experienced rapid neuro-regression."
      explanation: Rapid neuroregression after normal early development.
  - target: Spastic paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Corticospinal involvement presents as spastic paraparesis.
    evidence:
    - reference: PMID:25243380
      reference_title: "Mutations in ADAR1, IFIH1, and RNASEH2B presenting as spastic paraplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patients with ADAR1 and IFIH1-related disease showed a robust interferon signature."
      explanation: The IFIH1 spastic paraplegia patient had a robust interferon signature.
  - target: Calcification of the aorta
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Interferon-driven vascular calcification in Singleton-Merten syndrome.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data identify a gain-of-function IFIH1 mutation as causing SMS and leading to early arterial calcification and dental inflammation and resorption."
      explanation: Links IFIH1 gain of function to early arterial calcification.
  - target: Periodontitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dental inflammation and root resorption in Singleton-Merten syndrome.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data identify a gain-of-function IFIH1 mutation as causing SMS and leading to early arterial calcification and dental inflammation and resorption."
      explanation: Links IFIH1 gain of function to dental inflammation and resorption.
  - target: Psoriasiform dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Interferon-driven skin inflammation; psoriasis cleared within days of
      starting a JAK inhibitor in one patient.
    evidence:
    - reference: PMID:35410415
      reference_title: "Precision treatment of Singleton Merten syndrome with ruxolitinib: a case report."
      supports: SUPPORT

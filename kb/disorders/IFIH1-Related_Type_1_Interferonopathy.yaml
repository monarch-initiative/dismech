  description: >-
    The JAK1/2 inhibitor ruxolitinib, which blocks signaling from the type I
    interferon receptor, was given to a child with SMS1. Psoriasis cleared and
    the interferon signature normalized within days, and weakness, osteopenia
    and growth improved. Single case; off label.

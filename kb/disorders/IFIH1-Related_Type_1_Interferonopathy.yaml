      label: ifih1
  publication: PMID:38077314
  description: >-
    Zebrafish line overexpressing ifih1 with the residue equivalent to the
    human R779H variant. Larvae mount systemic inflammation and an interferon
    signature after a sub-threshold poly(I:C) stimulus; the response is
    abolished by knocking down mavs or ikbke, and reduced by baricitinib.

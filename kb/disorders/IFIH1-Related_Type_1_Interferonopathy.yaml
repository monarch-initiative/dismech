- name: Baricitinib
  description: >-
    The JAK1/2 inhibitor baricitinib is the most studied drug in
    Aicardi-Goutieres syndrome. In an open-label expanded-access study of 35
    patients with genetically confirmed AGS the interferon signature fell,
    symptom diaries improved and many children gained developmental
    milestones; results were not given by gene. In patients known to carry
    IFIH1 variants the picture is mixed. Refractory chilblains and skin
    ulcers healed, with a fall in interferon-stimulated gene expression, in a
    patient with overlapping AGS and SMS features. An infant with severe AGS7
    had interferon and STAT1 signaling suppressed but continued to
    deteriorate neurologically. A girl with the R779H variant stayed
    clinically stable with a persistently raised interferon score. A
    retrospective Italian comparison of 12 treated and 20 untreated patients
    with AGS-gene interferonopathies found benefit for immunological and skin
    symptoms and a limited, variable effect on neurological ones. Baricitinib
    also lowered interferon-stimulated gene expression in a zebrafish model
    of the R779H variant.

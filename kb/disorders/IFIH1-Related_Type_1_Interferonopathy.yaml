name: IFIH1-Related Type 1 Interferonopathy
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  IFIH1-related type 1 interferonopathy is an autosomal dominant
  autoinflammatory disease caused by heterozygous gain-of-function variants in
  IFIH1, which encodes MDA5, the cytosolic sensor of double-stranded RNA. The
  mutant receptor binds RNA more avidly and is slower to disassemble, so it
  signals without a viral trigger and drives constitutive type I interferon
  production. Nearly every carrier has a raised interferon signature in blood,
  but the clinical picture varies widely, even within one family. At one end
  is Aicardi-Goutieres syndrome type 7, an infantile encephalopathy, or a later
  rapid neuroregression or isolated spastic paraparesis. At the other is
  Singleton-Merten syndrome type 1, with early calcification of the aorta and
  heart valves, dental root resorption and tooth loss, osteopenia and
  acro-osteolysis, sometimes with psoriasis and glaucoma. Lupus-like disease
  also occurs, and about one carrier in eight is clinically unaffected. JAK
  inhibitors, which block signalling downstream of the interferon receptor,
  have been used off label with reported benefit in individual patients.
notes: >-
  The entry is anchored on MONDO:0700262 and IFIH1 (hgnc:18873). It is a
  gene-level disease whose two named phenotypes are recorded as subtypes:
  Aicardi-Goutieres syndrome 7 (MONDO:0014367) and Singleton-Merten syndrome 1
  (MONDO:0024535). AGS7 is also a subtype row on the Aicardi_Goutieres_Syndrome
  entry, which groups the AGS series by phenotype across nine genes. The two
  entries cut the same patients along different axes, by gene here and by
  clinical syndrome there, and are not in conflict.

  The deep-research report suggested several HPO identifiers that name other
  findings: HP:0001171 (Split hand) for acro-osteolysis, HP:0032155 (Abdominal
  cramps) for the interferon signature, and HP:0004382 (Mitral valve
  calcification) for aortic valve calcification. None was used. HPO has no
  generic acro-osteolysis term; OLS searches of HP for "acroosteolysis",
  "acro-osteolysis" and "osteolysis" return only site-specific terms (foot,
  clavicle, phalanges of one digit or of the hand), so the source's
  distal-limb osteolysis is bound to HP:0002797 Osteolysis.

  No frequency bands are recorded. The largest cohort (PMID:31898846) is
  cached as abstract only and gives counts only for nonpenetrance.

  No GeneReviews chapter covers this disease; just check-genereviews reports
  NO_CHAPTER against the 2026-09-10 Bookshelf index.

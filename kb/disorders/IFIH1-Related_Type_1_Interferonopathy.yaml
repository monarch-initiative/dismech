  publication: PMID:36426976
  description: >-
    Mouse expressing human MDA5 with the Singleton-Merten variant. It
    develops heart fibrosis, aortic valve enlargement and aortic
    calcification with a systemic interferon signature, and dies of
    hypercytokinemia after a double-stranded RNA challenge unless Mavs or the
    interferon receptor is deleted or a JAK inhibitor is given.
  modeled_mechanisms:
  - target: Type I Interferon Receptor Engagement
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Interferon-receptor-dependent inflammation with cardiovascular calcification.
    limitations: >-
      A human transgene expressed alongside the endogenous mouse gene, so
      expression level and tissue distribution may not match a heterozygous
      patient. Dental and skeletal features are not reported in the abstract.
    evidence:
    - reference: PMID:36426976
      reference_title: "Double-Stranded RNA Induces Mortality in an MDA5-Mediated Type I Interferonopathy Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interrupting the IFN signaling through mitochondrial antiviral signaling protein or IFN-α/β receptor alleviated hM-R822Q-induced inflammation."
      explanation: Inflammation in the model depends on MAVS and the interferon receptor.
  - target: Interleukin-6 Overproduction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Very high serum interleukin-6 after a double-stranded RNA challenge,
      with intestinal inflammation.
    limitations: >-
      The interleukin-6 response required an injected viral RNA mimic, while
      the one patient with very high interleukin-6 had no such trigger, so
      the model shows a provoked state rather than the spontaneous human one.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The cytokine burst is driven by injected poly(I:C), an exogenous
        double-stranded RNA mimic. The human node is driven by endogenous
        Alu duplex RNA, which the model does not isolate.

pathophysiology:
- name: Heterozygous IFIH1 Gain-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Missense variants, and at least one in-frame deletion, cluster near the
    ATP-binding region of the MDA5 helicase. The mutant protein binds
    double-stranded RNA more avidly, hydrolyzes ATP less efficiently and
    disassembles its filaments more slowly.
  genes:
  - preferred_term: IFIH1
    term:
      id: hgnc:18873
      label: IFIH1
  molecular_functions:
  - preferred_term: double-stranded RNA binding
    term:
      id: GO:0003725
      label: double-stranded RNA binding
    modifier: INCREASED
  - preferred_term: pattern recognition receptor activity
    term:
      id: GO:0038187
      label: pattern recognition receptor activity
    modifier: GAIN_OF_FUNCTION
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cellular and biochemical assays indicate that these mutations confer gain of function such that mutant IFIH1 binds RNA more avidly, leading to increased baseline and ligand-induced interferon signaling."
    explanation: Biochemical demonstration of gain of function.
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified mutations cluster close to the ATP binding region of the protein."
    explanation: Location of the disease variants in the protein.
  downstream:
  - target: Constitutive MDA5 Signaling and Type I Interferon Overproduction
    causal_link_type: DIRECT
    description: >-
      The overactive sensor signals in response to endogenous RNA that does
      not activate the wild-type receptor.
    evidence:
    - reference: PMID:24686847
      reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cellular and biochemical assays indicate that these mutations confer gain of function such that mutant IFIH1 binds RNA more avidly, leading to increased baseline and ligand-induced interferon signaling."
      explanation: Increased baseline signaling follows from tighter RNA binding.
- name: Constitutive MDA5 Signaling and Type I Interferon Overproduction
  biological_scale: CELLULAR
  description: >-
    Mutant MDA5 triggers type I interferon production without infection, so
    interferon-stimulated genes are expressed constantly. Every variant tested
    in the largest cohort raised interferon signaling, including variants that
    prediction tools called benign.
  biological_processes:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: INCREASED
  evidence:
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All mutations were associated with enhanced type I interferon signaling, including six variants (22%) which were predicted as benign according to multiple in silico pathogenicity programs."
    explanation: Enhanced interferon signaling is common to all variants.
  downstream:
  - target: Chronic Type I Interferon Signaling in Tissues
    causal_link_type: DIRECT
    description: Excess interferon acts on its receptor throughout the body.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interferon signature genes were upregulated in SMS individuals' blood and dental cells."
      explanation: Interferon-stimulated genes are raised in patient blood and dental cells.
- name: Chronic Type I Interferon Signaling in Tissues
  conforms_to: "cgas_sting_pathway_activation#Chronic Type I Interferon-Driven Tissue Inflammation"
  biological_scale: ORGANISM
  description: >-
    Sustained interferon receptor signaling in brain, vessels, bone, teeth and
    skin. Why one carrier develops encephalopathy and another vascular and
    dental calcification is not known; modifying genes and environmental
    triggers are both proposed.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:24686847
    reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that heterozygous mutations in the cytosolic double-stranded RNA receptor gene IFIH1 (also called MDA5) cause a spectrum of neuroimmunological features consistently associated with an enhanced interferon state."
    explanation: An enhanced interferon state underlies the whole spectrum.
  downstream:
  - target: Developmental regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Interferon-driven neuroinflammation causes neurological regression.
    evidence:
    - reference: PMID:24686847
      reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In contrast, two patients (F237 and F626) were developmentally normal until the second year of life, at which point they experienced rapid neuro-regression."
      explanation: Rapid neuroregression after normal early development.
  - target: Spastic paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Corticospinal involvement presents as spastic paraparesis.
    evidence:
    - reference: PMID:25243380
      reference_title: "Mutations in ADAR1, IFIH1, and RNASEH2B presenting as spastic paraplegia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The patients with ADAR1 and IFIH1-related disease showed a robust interferon signature."
      explanation: >-
        The IFIH1 spastic paraplegia patient had a robust interferon signature.
        This shows the two occur together, not that one causes the other.
  - target: Calcification of the aorta
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Interferon-driven vascular calcification in Singleton-Merten syndrome.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data identify a gain-of-function IFIH1 mutation as causing SMS and leading to early arterial calcification and dental inflammation and resorption."
      explanation: Links IFIH1 gain of function to early arterial calcification.
  - target: Periodontitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dental inflammation and root resorption in Singleton-Merten syndrome.
    evidence:
    - reference: PMID:25620204
      reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data identify a gain-of-function IFIH1 mutation as causing SMS and leading to early arterial calcification and dental inflammation and resorption."
      explanation: Links IFIH1 gain of function to dental inflammation and resorption.
  - target: Psoriasiform dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Interferon-driven skin inflammation; psoriasis cleared within days of
      starting a JAK inhibitor in one patient.
    evidence:
    - reference: PMID:35410415
      reference_title: "Precision treatment of Singleton Merten syndrome with ruxolitinib: a case report."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Within days of treatment, psoriatic skin lesions resolved completely and the IFN signature normalized."
      explanation: >-
        Psoriasis resolved together with the interferon signature when
        interferon signaling was blocked, which supports interferon driving
        the skin disease.
  - target: Systemic lupus erythematosus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A minority of carriers develop lupus-like autoimmunity.
    evidence:
    - reference: PMID:24686847
      reference_title: "Gain-of-function mutations in IFIH1 cause a spectrum of human disease phenotypes associated with upregulated type I interferon signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In keeping with this, two patients in our cohort (F376 and F524_1) experienced significant immunological disturbance consistent with lupus."
      explanation: Lupus-like disease in two patients.

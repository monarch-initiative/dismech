treatments:
- name: Ruxolitinib
  description: >-
    The JAK1/2 inhibitor ruxolitinib has been given off label to at least
    four patients in three reports, starting at 0.5 mg/kg per day and rising
    to 0.7 to 0.75 mg/kg. In a child with SMS1, psoriasis cleared and the
    interferon signature normalized within days, and weakness, osteopenia and
    growth improved. Two brothers with AGS7 presenting as spastic paraplegia
    had a significant fall in the interferon signature, better quality of
    life, and maintained or slightly improved motor function. A boy with AGS7
    treated for about four years, with steroids and thalidomide, had better
    skin, blood counts and liver tests but persistent systemic inflammation.
    No controlled trial exists and none of these reports shows reversal of
    established brain injury.

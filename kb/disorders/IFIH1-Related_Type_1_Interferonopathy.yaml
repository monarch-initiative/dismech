- name: SMS1
  display_name: Singleton-Merten syndrome 1
  subtype_term:
    preferred_term: Singleton-Merten syndrome 1
    term:
      id: MONDO:0024535
      label: Singleton-Merten syndrome 1
  description: >-
    Calcific, dental and skeletal presentation: aortic and valvular
    calcification, early periodontitis and root resorption, osteopenia and
    acro-osteolysis.
  evidence:
  - reference: PMID:25620204
    reference_title: "A specific IFIH1 gain-of-function mutation causes Singleton-Merten syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data identify a gain-of-function IFIH1 mutation as causing SMS and leading to early arterial calcification and dental inflammation and resorption."
    explanation: Establishes IFIH1 gain of function as the cause of SMS.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Heterozygous variants, often de novo. Penetrance is incomplete and
    expressivity varies within families. Parental germline mosaicism has been
    documented.
  evidence:
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten adult individuals, 13.5% of all mutation carriers, were clinically asymptomatic (with seven of these aged over 50 years)."
    explanation: About one carrier in eight is unaffected, so penetrance is incomplete.
  - reference: PMID:31898846
    reference_title: "Genetic and phenotypic spectrum associated with IFIH1 gain-of-function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm variable expression and nonpenetrance as important characteristics of the IFIH1 genotype, a consistent association with enhanced type I interferon signaling, and a common mutational mechanism involving increased RNA binding affinity or decreased efficiency of ATP hydrolysis and filament disassembly rate."
    explanation: Variable expression and nonpenetrance across the cohort.
  - reference: PMID:32042913
    reference_title: "Aicardi-Goutières syndrome due to a paternal mosaic IFIH1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, both children inherited the R779H mutation through a germline mosaic from the father."
    explanation: Parental germline mosaicism raises recurrence risk above the de novo baseline.

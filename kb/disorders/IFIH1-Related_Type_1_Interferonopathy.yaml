    - reference: PMID:36426976
      reference_title: "Double-Stranded RNA Induces Mortality in an MDA5-Mediated Type I Interferonopathy Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings demonstrate that the MDA5 R822Q mutant introduces a critical risk factor for uncontrollable inflammation on viral infection or vaccination."
      explanation: The authors frame the interleukin-6 burst as a response to an infectious or vaccine trigger.

- name: Tofacitinib
  description: >-
    Tofacitinib, described by its users as a JAK1/3 inhibitor, has been used
    in two patients. With oral methylprednisolone it controlled disease
    activity for about a year in a young woman with a somatic IFIH1 variant
    and lupus-like disease. In a patient with features of both AGS7 and SMS1
    it markedly improved psoriatic and ulcerative skin lesions within a
    month, with relapse on stopping and improvement on restarting, yet with
    no fall in the interferon signature. In mice carrying the human R822Q
    variant, tofacitinib reduced cytokine production and prevented death
    after a double-stranded RNA challenge. Off label; no data on neurological
    outcomes.

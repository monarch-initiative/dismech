- name: Tocilizumab
  description: >-
    Tocilizumab, a monoclonal antibody that blocks interleukin-6 signaling,
    was added in one boy with AGS7 whose sedimentation rate stayed high after
    years of ruxolitinib, steroids and thalidomide. It was started at 160 mg
    intravenously every 2 weeks and the sedimentation rate quickly
    normalized. Liver and cardiac enzymes then rose and the dose was halved.
    The chilblain-like rash later recurred despite the combination. Single
    case; off label.

      pathogenic variant identified by molecular genetic testing.
    explanation: >-
      The GeneReviews chapter defines the molecular-genetic-testing basis for
      establishing the diagnosis.
- name: EEG and Seizure Phenotyping
  description: >-
    EEG documents the encephalopathic background and epilepsy syndrome —
    burst-suppression in Ohtahara syndrome, hypsarrhythmia in West syndrome, or
    multifocal epileptiform activity — and guides antiseizure treatment.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: MAXO:0000932
      label: electroencephalography
  results: A burst-suppression or hypsarrhythmic pattern supports the epileptic encephalopathy.
  evidence:
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early infantile epileptic encephalopathy with suppression-burst (EIEE), also
      known as Ohtahara syndrome, is one of the most severe and earliest forms of
      epilepsy.
    explanation: >-
      The suppression-burst EEG pattern is the defining electrophysiologic feature
      of the Ohtahara presentation.
- name: Brain MRI
  description: >-
    Brain MRI is used to exclude structural and metabolic causes of neonatal or
    infantile epileptic encephalopathy; findings in STXBP1 encephalopathy are
    frequently normal or nonspecific.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: MAXO:0000424
      label: magnetic resonance imaging procedure
  results: Usually normal or nonspecific; used mainly to exclude structural causes.
differential_diagnoses:
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Developmental and epileptic encephalopathies caused by other synaptic vesicle
    cycle / SNARE-machinery genes (e.g. UNC13A, SNAP25, STX1B, VAMP2, SYT1, DNM1)
    overlap through early-onset epilepsy, hypotonia, and developmental impairment
    and are distinguished by molecular testing.
  distinguishing_features:
  - A de novo heterozygous STXBP1 loss-of-function variant favors this disorder.
  - A variant in a different vesicle-cycle gene favors the corresponding SNAREopathy.
  evidence:
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human pathogenic mutations have now been reported for all eight core
      components, but patients are diagnosed with very different neurodevelopmental
      syndromes.
    explanation: >-
      Establishes the family of SNAREopathies that constitutes the molecular
      differential diagnosis.
- name: Other early-onset developmental and epileptic encephalopathies
  description: >-
    DEEs from ion-channel and other genes (e.g. KCNQ2, SCN2A, CDKL5, ARX) can
    present with Ohtahara or West syndrome and are distinguished by genetic testing.
  distinguishing_features:
  - A pathogenic STXBP1 variant favors this disorder.
  - A causal variant in another DEE gene favors that diagnosis.
animal_models:
- species: Mouse (Mus musculus)
  genotype: Munc18-1 (Stxbp1) knockout
  description: >-
    Munc18-1 null mice show a complete loss of neurotransmitter secretion from
    synaptic vesicles throughout development; the brain assembles morphologically
    but neurons subsequently undergo apoptosis with widespread neurodegeneration,
    demonstrating that Munc18-1 is essential for synaptic transmission and for
    maintenance of established synapses.
  evidence:
  - reference: PMID:10657302
    reference_title: "Synaptic assembly of the brain in the absence of neurotransmitter secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of a single protein, Munc18-1, in mice leads to a complete loss of
      neurotransmitter secretion from synaptic vesicles throughout development.
    explanation: >-
      The Munc18-1 knockout establishes the presynaptic release requirement whose
      partial loss (haploinsufficiency) underlies human STXBP1 encephalopathy.
progression:
- phase: Infancy
  notes: >-
    Onset is typically in the first months of life with epileptic encephalopathy
    (often Ohtahara or West syndrome) and evolving severe developmental impairment.
  evidence:
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early infantile epileptic encephalopathy with suppression-burst (EIEE), also
      known as Ohtahara syndrome, is one of the most severe and earliest forms of
      epilepsy.
    explanation: >-
      Documents the early-infantile onset of the epileptic encephalopathy.
- phase: Childhood to Adulthood
  notes: >-
    Seizures may evolve in type and, in some patients, become less prominent, while
    severe-to-profound intellectual disability persists and movement disorders,
    including prominent extrapyramidal features in some adults, become apparent.
  evidence:
  - reference: PMID:26865513
    reference_title: "STXBP1 encephalopathy: A neurodevelopmental disorder including epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report 2 previously unreported adult patients with prominent
      extrapyramidal features.
    explanation: >-
      Documents persistence into adulthood with prominent extrapyramidal movement
      features.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications; response is variable and
    often incomplete. Agents used for the associated epilepsy syndromes include
    levetiracetam and, for epileptic/infantile spasms, vigabatrin. No agent
    corrects the underlying Munc18-1 deficiency.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  evidence:
  - reference: PMID:27905812
    reference_title: "STXBP1 Encephalopathy with Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly used anti-seizure medications (ASMs) are phenobarbital,
      valproic acid, and vigabatrin. About 20% of individuals require more than
      one ASM and approximately 25% are refractory to ASM therapy.
    explanation: >-
      The GeneReviews management section documents first-line ASM choices and the
      substantial rate of pharmacoresistance in STXBP1 encephalopathy.
- name: Supportive and Developmental Care
  description: >-
    Multidisciplinary supportive care — developmental therapies, feeding and
    respiratory support, and management of movement disorders — is the mainstay
    given the severe neurodevelopmental impairment.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the de novo dominant mechanism and the generally
    low recurrence risk, with attention to the rare possibility of parental
    mosaicism.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
discussions:
- discussion_id: gap_stxbp1_haploinsufficiency_vs_dominant_negative
  prompt: >-
    Is STXBP1 encephalopathy a pure loss-of-dose (haploinsufficiency) disorder,
    or do destabilized missense variants act dominant-negatively by aggregating
    and co-depleting wild-type Munc18-1, and does the answer differ by variant
    class with direct consequences for therapy (gene/dosage restoration versus
    chemical-chaperone/proteostasis approaches)?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
  - pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
  rationale: >-
    The entry models both truncating and missense variants as converging on
    Munc18-1 haploinsufficiency, and an allelic-series mouse study concludes that
    impaired protein stability plus haploinsufficiency explain the disease. A
    competing biochemical model finds that missense mutants aggregate and
    sequester wild-type Munc18-1 below hemizygous levels, i.e. an additional
    dominant-negative effect. The two models are not merely academic: pure
    haploinsufficiency motivates gene-dosage or expression-restoration
    strategies, whereas a dominant-negative aggregation mechanism motivates
    chemical-chaperone/proteostasis rescue and possibly allele-specific
    knockdown. Which mechanism dominates, and whether it is variant-dependent,
    remains unresolved.
  evidence:
  - reference: PMID:30266908
    reference_title: "Mechanism-based rescue of Munc18-1 dysfunction in varied encephalopathies by chemical chaperones."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Aggregates of mutant Munc18-1 incorporate wild-type Munc18-1, depleting
      functional Munc18-1 levels beyond hemizygous levels.
    explanation: >-
      Provides the biochemical basis for a dominant-negative (aggregation and
      wild-type co-depletion) mechanism, the alternative to pure
      haploinsufficiency.
  - reference: PMID:29538625
    reference_title: "Protein instability, haploinsufficiency, and cortical hyper-excitability underlie STXBP1 encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      impaired protein stability and STXBP1 haploinsufficiency explain
      STXBP1-encephalopathy and that, therefore, Stxbp1+/- mice provide a valid
      mouse model.
    explanation: >-
      Supports the competing haploinsufficiency-only interpretation, in which
      Stxbp1+/- (loss-of-dose) alone reproduces the disease.
  proposed_experiments:
  - experiment_id: exp_stxbp1_lof_vs_dn_allelic_series
    name: STXBP1 loss-of-function versus dominant-negative allelic-series test
    description: >-
      In a shared neuronal background, express an allelic series of STXBP1
      variants (truncating, deletion, and multiple missense) on both null and
      heterozygous (wild-type-present) backgrounds and measure whether the
      variant lowers functional Munc18-1 below the hemizygous level and whether
      chemical chaperones (4-phenylbutyrate, trehalose) restore protein level
      and release. A variant that depletes wild-type Munc18-1 and impairs release
      below hemizygous levels indicates a dominant-negative component.
    experiment_type:
      preferred_term: allelic-series gain/loss-of-function experiment
    perturbations:
    - name: STXBP1 variant expression on null versus heterozygous background
      target: pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
      genes:
      - preferred_term: STXBP1
        term:
          id: hgnc:11444
          label: STXBP1
      description: >-
        Introduce each STXBP1 variant on a Munc18-1 null background (isolated
        variant function) and on a wild-type-present background (test for
        wild-type co-depletion), with and without chemical-chaperone treatment.
    readouts:
    - name: Munc18-1 protein level and synaptic vesicle release
      target: pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      - preferred_term: neurotransmitter secretion
        term:
          id: GO:0007269
          label: neurotransmitter secretion
        modifier: DECREASED
      assays:
      - preferred_term: immunoblot assay
      - preferred_term: patch-clamp recording
      direction: NEGATIVE
    controls:
    - name: Wild-type STXBP1
      description: Wild-type Munc18-1 expressed on the same backgrounds.
    - name: Vehicle versus chemical chaperone
      description: Matched untreated versus chemical-chaperone-treated conditions.
    decision_criterion: >-
      A dominant-negative component is supported if a variant reduces functional
      Munc18-1 and release below hemizygous levels on a wild-type-present
      background and is rescued by chemical chaperones; pure haploinsufficiency
      is supported if variants have no effect beyond loss of dose.
    would_support:
    - pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
    - pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion

- discussion_id: gap_stxbp1_genotype_phenotype_modifiers
  prompt: >-
    Why do STXBP1 variants produce a phenotypic spectrum ranging from classic
    early-onset epileptic encephalopathy to intellectual disability without
    epilepsy to a movement-disorder-predominant picture, and what genetic,
    variant-level, or network modifiers determine which arm dominates in a given
    patient?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
  - pathophysiology#Impaired Synaptic Network Development
  rationale: >-
    The entry already notes that cognitive impairment and seizures are partly
    independent, and cohort data find no correlation between seizure severity and
    the degree of intellectual disability. This dissociation implies that the
    epilepsy arm and the developmental/cognitive (and movement-disorder) arms are
    separably modifiable, yet no variant-class, residual-protein-level, cell-type
    (excitatory versus inhibitory), or modifier-gene predictor reliably explains
    why one arm dominates. Resolving this is prerequisite to prognostic
    counseling and to arm-specific therapy.
  evidence:
  - reference: PMID:26865513
    reference_title: "STXBP1 encephalopathy: A neurodevelopmental disorder including epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found no correlation between severity of seizures and severity of ID
    explanation: >-
      Documents the clinical dissociation between the seizure arm and the
      cognitive arm that the modifier question seeks to explain.
  proposed_experiments:
  - experiment_id: exp_stxbp1_genotype_phenotype_stratification
    name: STXBP1 genotype-phenotype and modifier stratification study
    description: >-
      In a deeply phenotyped STXBP1 cohort, stratify patients by variant class
      (truncating, deletion, missense) and estimated residual Munc18-1 level and
      test whether these, together with polygenic background and candidate
      modifier loci, predict the dominant phenotypic arm (epilepsy-predominant,
      intellectual-disability-without-epilepsy, or movement-disorder-predominant).
    experiment_type:
      preferred_term: genotype-phenotype correlation study
    perturbations:
    - name: Variant-class and residual-dose stratification
      target: pathophysiology#Impaired Synaptic Network Development
      genes:
      - preferred_term: STXBP1
        term:
          id: hgnc:11444
          label: STXBP1
      description: >-
        Group patients by STXBP1 variant class and modeled residual protein dose
        rather than introducing a perturbation, as an observational human study.
    readouts:
    - name: Dominant phenotypic arm and network phenotype
      target: pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
      assays:
      - preferred_term: electroencephalography
      direction: POSITIVE
    controls:
    - name: Variant-class comparison groups
      description: Truncating, deletion, and missense groups compared against one another.
    decision_criterion: >-
      A modifier is supported if variant class, residual protein level, or a
      modifier locus significantly predicts the dominant phenotypic arm across
      the cohort after correction for multiple testing.
    would_support:
    - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
    - pathophysiology#Impaired Synaptic Network Development

- discussion_id: gap_stxbp1_mouse_model_fidelity
  prompt: >-
    Does the Stxbp1+/- mouse, which reproduces spike-wave/spasm EEG activity and
    mild cognitive changes, capture the severity and developmental trajectory of
    human STXBP1 encephalopathy — in particular the severe-to-profound
    intellectual disability and Ohtahara/West-syndrome-level epileptic
    encephalopathy — or does it under-represent the human disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
  - pathophysiology#Impaired Synaptic Network Development
  rationale: >-
    Model evidence clearly exists: Stxbp1+/- mice recapitulate the seizure/spasm
    EEG phenotype and show impaired cognition, hyperactivity, and anxiety-like
    behaviour, and the seizures respond to levetiracetam. The open question is
    translational fidelity — human patients almost universally have severe-to-
    profound intellectual disability and early catastrophic epileptic
    encephalopathy (Ohtahara/West syndrome), a severity that the comparatively
    mild murine cognitive and behavioural phenotype may not fully reproduce.
    Whether the mouse captures the human developmental trajectory, or whether
    human-specific cortical biology is required, gates its use for preclinical
    therapeutic testing.
  evidence:
  - reference: PMID:29538625
    reference_title: "Protein instability, haploinsufficiency, and cortical hyper-excitability underlie STXBP1 encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stxbp1+/- mice with different genomic backgrounds recapitulate the
      seizure/spasm phenotype observed in humans, characterized by myoclonic
      jerks and spike-wave discharges that were suppressed by the antiepileptic
      drug levetiracetam.
    explanation: >-
      Establishes that the mouse model reproduces the seizure component,
      confirming model evidence exists for the mismatch question.
  - reference: PMID:26865513
    reference_title: "STXBP1 encephalopathy: A neurodevelopmental disorder including epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients have intellectual disability (ID), which is mostly severe to
      profound (88%).
    explanation: >-
      Documents the severe-to-profound human cognitive phenotype whose murine
      fidelity is the open translational question.
  proposed_experiments:
  - experiment_id: exp_stxbp1_mouse_human_trajectory_comparison
    name: STXBP1 mouse-to-human developmental-trajectory comparison
    description: >-
      Longitudinally phenotype Stxbp1+/- mice across postnatal development for
      EEG severity, learning/memory, and motor phenotypes, and compare the
      developmental trajectory and severity against matched human natural-history
      data and STXBP1 patient iPSC-derived cortical neuron/organoid synaptic
      readouts, to quantify where the mouse under-represents human severity.
    experiment_type:
      preferred_term: cross-species developmental phenotyping experiment
    perturbations:
    - name: Stxbp1 heterozygous loss of function
      target: pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
      genes:
      - preferred_term: STXBP1
        term:
          id: hgnc:11444
          label: STXBP1
      description: >-
        Stxbp1+/- mice and STXBP1 patient-variant human iPSC-derived neurons
        compared against wild-type and isogenic-corrected controls.
    readouts:
    - name: Synaptic transmission and network activity across development
      target: pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: ABNORMAL
      - preferred_term: neurotransmitter secretion
        term:
          id: GO:0007269
          label: neurotransmitter secretion
        modifier: DECREASED
      assays:
      - preferred_term: multielectrode array recording
      - preferred_term: electroencephalography
      direction: NEGATIVE
    controls:
    - name: Wild-type littermate mice
      description: Age-matched wild-type littermates across the same developmental windows.
    - name: Isogenic-corrected human neurons
      description: Patient iPSC lines in which the STXBP1 variant is corrected.
    decision_criterion: >-
      The mouse is a faithful model if its developmental severity trajectory
      matches human natural history and iPSC readouts; a mismatch is supported if
      murine phenotypes are substantially milder or follow a divergent trajectory
      despite equivalent loss of dose.
    would_support:
    - pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
    - pathophysiology#Impaired Synaptic Network Development

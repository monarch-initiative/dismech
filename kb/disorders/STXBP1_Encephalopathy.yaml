differential_diagnoses:
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Developmental and epileptic encephalopathies caused by other synaptic vesicle
    cycle / SNARE-machinery genes (e.g. UNC13A, SNAP25, STX1B, VAMP2, SYT1, DNM1)
    overlap through early-onset epilepsy, hypotonia, and developmental impairment
    and are distinguished by molecular testing.
  distinguishing_features:
  - A de novo heterozygous STXBP1 loss-of-function variant favors this disorder.
  - A variant in a different vesicle-cycle gene favors the corresponding SNAREopathy.
  evidence:
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Human pathogenic mutations have now been reported for all eight core
      components, but patients are diagnosed with very different neurodevelopmental
      syndromes.
    explanation: >-
      Establishes the family of SNAREopathies that constitutes the molecular
      differential diagnosis.
- name: Other early-onset developmental and epileptic encephalopathies
  description: >-
    DEEs from ion-channel and other genes (e.g. KCNQ2, SCN2A, CDKL5, ARX) can
    present with Ohtahara or West syndrome and are distinguished by genetic testing.
  distinguishing_features:
  - A pathogenic STXBP1 variant favors this disorder.
  - A causal variant in another DEE gene favors that diagnosis.

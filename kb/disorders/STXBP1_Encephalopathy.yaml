- name: Cortical Excitation-Inhibition Imbalance and Seizures
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Reduced and imbalanced neurotransmitter release destabilizes cortical
    excitatory/inhibitory balance, producing neuronal hyperexcitability and
    hypersynchronous discharges. Clinically this manifests as early-onset epilepsy,
    frequently as Ohtahara syndrome with a burst-suppression EEG or as West
    syndrome with epileptic spasms, and as a nonsyndromic early-onset epileptic
    encephalopathy with epileptic spasms or tonic seizures.

- name: Impaired Synaptic Network Development
  description: >-
    Reduced activity-dependent synaptic transmission during a critical
    developmental window impairs maturation of cortical networks, producing severe
    global developmental delay, intellectual disability, absent or limited speech,
    autistic features, and movement disorders. In STXBP1 disease the cognitive
    impairment is largely independent of seizure burden. In the Munc18-1 null
    model, synapses initially assemble but neurons subsequently degenerate,
    indicating a maintenance/neurodegenerative component in the extreme
    loss-of-function state.
  role: effector
  cell_types:

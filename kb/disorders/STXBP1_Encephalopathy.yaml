    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients have intellectual disability (ID), which is mostly severe to
      profound (88%).
    explanation: >-
      Establishes severe-to-profound intellectual disability as a universal outcome
      of the impaired synaptic-network development.
  - reference: PMID:26865513
    reference_title: "STXBP1 encephalopathy: A neurodevelopmental disorder including epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found no correlation between severity of seizures and severity of ID
    explanation: >-
      Supports the partial independence of the developmental/cognitive impairment
      from the seizure burden.
  - reference: PMID:10657302
    reference_title: "Synaptic assembly of the brain in the absence of neurotransmitter secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      After assembly is completed, neurons undergo apoptosis, leading to widespread
      neurodegeneration.
    explanation: >-
      The Munc18-1 null model shows a neurodegenerative/maintenance component when
      neurotransmitter secretion is lost, relevant to the severe developmental
      outcome.
  downstream:

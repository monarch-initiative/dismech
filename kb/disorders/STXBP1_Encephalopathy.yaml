      large patient cohort.
pathophysiology:
- name: STXBP1 Haploinsufficiency and Munc18-1 Deficiency
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    De novo heterozygous loss-of-function variants (nonsense, frameshift,
    splice-site, whole-gene/partial deletions) and destabilizing missense variants
    in STXBP1 reduce the functional dose of Munc18-1, an evolutionarily conserved
    Sec1/Munc18 protein essential for synaptic vesicle release. Missense variants
    render the protein thermolabile and prone to aggregation/degradation, so both
    truncating and missense mechanisms converge on haploinsufficiency of Munc18-1
    at presynaptic terminals.
  role: trigger
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

    explanation: >-
      Shows a disease variant impairs Munc18-1 binding to syntaxin-1, the
      interaction that licenses SNARE-mediated fusion.
  - reference: PMID:10657302
    reference_title: "Synaptic assembly of the brain in the absence of neurotransmitter secretion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of a single protein, Munc18-1, in mice leads to a complete loss of
      neurotransmitter secretion from synaptic vesicles throughout development.
    explanation: >-
      The Munc18-1 null mouse demonstrates that Munc18-1 is required for the
      vesicle-fusion/neurotransmitter-release step this node models.
  downstream:
  - target: Reduced Neurotransmitter Release and Synaptic Transmission Deficit
    causal_link_type: DIRECT
- name: Reduced Neurotransmitter Release and Synaptic Transmission Deficit
  conforms_to: "synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission Deficit"
  description: >-
    Impaired SNARE-mediated fusion reduces Ca2+-evoked neurotransmitter release and
    disturbs chemical synaptic transmission across cortical circuits. Because
    Munc18-1 is required at both excitatory and inhibitory synapses, the net effect
    is a disturbance of cortical excitatory/inhibitory balance that both drives
    seizures and impairs the activity-dependent synaptic signaling needed for
    normal neurodevelopment.
  role: effector

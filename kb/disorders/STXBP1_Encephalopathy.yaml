  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      STXBP1 (also known as MUNC18-1) is an evolutionally conserved neuronal
      Sec1/Munc-18 (SM) protein that is essential in synaptic vesicle release in
      several species.
    explanation: >-
      Establishes STXBP1/Munc18-1 as a synaptic-vesicle-release protein, the
      vesicle-cycle component whose deficiency defines this disorder.
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that haploinsufficiency of STXBP1 causes EIEE.
    explanation: >-
      Identifies haploinsufficiency as the disease mechanism, the trigger modeled
      by this node.
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Circular dichroism melting experiments revealed that a mutant form of the
      protein was significantly thermolabile compared to wild type.
    explanation: >-
      Demonstrates that a disease missense variant destabilizes Munc18-1,
      supporting protein instability as a route to haploinsufficiency.
  downstream:
  - target: Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
    causal_link_type: DIRECT
  - target: Reduced Neurotransmitter Release and Synaptic Transmission Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Impaired SNARE-mediated synaptic vesicle fusion.
- name: Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    Munc18-1 binds syntaxin-1 and templates assembly of the neuronal SNARE complex
    (syntaxin-1, SNAP-25, synaptobrevin-2/VAMP2) that mediates Ca2+-triggered
    synaptic vesicle fusion. Reduced Munc18-1 dose, and disease variants with
    impaired syntaxin binding, compromise SNARE-complex assembly and the vesicle
    fusion step. In the Munc18-1 null model, loss of this protein abolishes
    neurotransmitter secretion, demonstrating that Munc18-1 is indispensable for
    the fusion reaction.
  role: central_effector
  cell_types:

name: STXBP1 Encephalopathy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A developmental and epileptic encephalopathy caused by de novo heterozygous
  loss-of-function variants in STXBP1, which encodes Munc18-1 (syntaxin-binding
  protein 1), a Sec1/Munc18 protein essential for synaptic vesicle release.
  Munc18-1 chaperones syntaxin-1 and templates assembly of the neuronal SNARE
  complex that drives Ca2+-triggered synaptic vesicle fusion, so its
  haploinsufficiency reduces neurotransmitter release across cortical synapses.
  Affected individuals present in infancy with epilepsy — frequently Ohtahara
  syndrome (early infantile epileptic encephalopathy with burst-suppression) or
  West syndrome, or a nonsyndromic early-onset epileptic encephalopathy — together
  with severe-to-profound intellectual disability. Movement disorders (tremor,
  dystonia, ataxia) and autistic features are common, and STXBP1 encephalopathy is
  now understood as a complex neurodevelopmental disorder in which cognitive
  impairment and seizures are partly independent, rather than a primary epileptic
  encephalopathy. It is one of the SNAREopathies and one of the synaptic vesicle
  cycle disorders.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy

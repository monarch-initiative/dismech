      a candidate gene.
    explanation: >-
      Documents the mapping that identified SCN5A as the causal gene for this
      dilated cardiomyopathy entity.
  - reference: PMID:15671429
    reference_title: "Sodium channel mutations and susceptibility to heart failure and atrial fibrillation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation scans identified a missense mutation (D1275N) that cosegregated with
      an age-dependent, variably expressed phenotype of DCM, atrial fibrillation,
      impaired automaticity, and conduction delay.
    explanation: >-
      Names the founding SCN5A dilated cardiomyopathy allele and the composite
      structural-plus-electrical phenotype it produces.
  - reference: PMID:21596231
    reference_title: "SCN5A mutations associate with arrhythmic dilated cardiomyopathy and commonly localize to the voltage-sensing mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two-thirds (6 of 9) of all reported DCM mutations in SCN5A localize to the
      highly conserved homologous S3 and S4 transmembrane segments, suggesting a
      shared mechanism of disruption of the voltage-sensing mechanism of this
      channel leading to DCM.
    explanation: >-
      Demonstrates hot-spot clustering of DCM-associated SCN5A missense variants
      within the S3/S4 voltage-sensing segments of Nav1.5.
  downstream:
  - target: Altered Sodium Current with Conduction and Automaticity Impairment
    causal_link_type: DIRECT
    description: >-
      The variant channel reduces cardiac Nav1.5 protein abundance and peak
      depolarizing sodium current in both heterozygous (DN/H) and homozygous
      (DN/DN) cardiomyocytes, impairing impulse conduction and automaticity;
      increased persistent late sodium current and slower inactivation were
      additionally observed in homozygous (DN/DN) cardiomyocytes.
    evidence:
    - reference: PMID:21824921
      reference_title: "Striking In vivo phenotype of a disease-associated human SCN5A mutation producing minimal changes in vitro."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        By contrast, in ventricular cardiomyocytes, peak sodium current amplitude
        was markedly reduced in DN/H and DN/DN mice compared to that observed in
        H/H littermates (Figure 5A and 5B, Table 3).
      explanation: >-
        Humanized SCN5A-D1275N knock-in mice show markedly reduced peak sodium
        current in heterozygous DN/H (as well as homozygous DN/DN) ventricular
        cardiomyocytes, modeling the heterozygous state of autosomal dominant
        human CMD1E.
    - reference: PMID:21824921
      reference_title: "Striking In vivo phenotype of a disease-associated human SCN5A mutation producing minimal changes in vitro."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, late sodium current was increased in DN/DN mice compared to
        that in DN/H and H/H littermates (Figure 5C).
      explanation: >-
        Increased persistent late sodium current was observed only in homozygous
        DN/DN cardiomyocytes and not in heterozygous DN/H cardiomyocytes,
        whereas human CMD1E is autosomal dominant (heterozygous).
- name: Altered Sodium Current with Conduction and Automaticity Impairment
  biological_scale: CELLULAR
  role: effector
  description: >-
    Mutant Nav1.5 channels perturb voltage-sensing gating and sodium current in
    cardiomyocytes: in humanized D1275N knock-in mice, Nav1.5 protein abundance,
    peak depolarizing sodium current, and cardiac conduction velocity are
    reduced in a gene-dose-dependent manner in both heterozygous (DN/H) and
    homozygous (DN/DN) animals, whereas increased persistent late sodium current
    and spontaneous arrhythmias were observed only in homozygous (DN/DN) mice.
    Clinically in heterozygous human carriers, channel dysfunction manifests as
    conduction delay, sinus node dysfunction / bradycardia, atrial fibrillation,
    and ventricular tachycardia in over 90% of mutation carriers, accompanying
    or preceding ventricular dilation.

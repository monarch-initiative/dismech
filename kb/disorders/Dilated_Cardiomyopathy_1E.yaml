  - reference: PMID:21596231
    reference_title: "SCN5A mutations associate with arrhythmic dilated cardiomyopathy and commonly localize to the voltage-sensing mechanism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 15 SCN5A mutation carriers in our study, 14 (93%) manifested arrhythmia:
      supraventricular arrhythmia (13 of 15), including sick sinus syndrome (5 of
      15) and atrial fibrillation (9 of 15), ventricular tachycardia (5 of 15), and
      conduction disease (9 of 15).
    explanation: >-
      Multicenter DCM cohort showing 93% arrhythmia penetrance across sinus node,
      atrial, conduction, and ventricular compartments in SCN5A carriers.
  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sodium-channel gating dysfunction, reduced peak sodium current, and
      electromechanical dyssynchrony or altered intracellular sodium/calcium
      homeostasis lead to gene-dose-dependent ventricular chamber dilation and
      contractile failure, though the exact molecular coupling between Nav1.5
      current perturbation and structural remodeling remains incompletely
      resolved.
    evidence:
    - reference: PMID:21824921
      reference_title: "Striking In vivo phenotype of a disease-associated human SCN5A mutation producing minimal changes in vitro."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        There was consistent and statistically significant end-diastolic and
        end-systolic left ventricular dilatation and calculated left ventricular
        fractional shortening reduction in a gene-dose-dependent fashion (Figure
        3A, Table 2).
      explanation: >-
        Demonstrates gene-dose-dependent left ventricular dilatation and reduced
        fractional shortening across heterozygous (DN/H) and homozygous (DN/DN)
        humanized SCN5A-D1275N knock-in mice.
    - reference: PMID:21824921
      reference_title: "Striking In vivo phenotype of a disease-associated human SCN5A mutation producing minimal changes in vitro."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice carrying the DN allele displayed slow conduction, heart block, atrial
        fibrillation, ventricular tachycardia, and a dilated cardiomyopathy
        phenotype, with no significant fibrosis or myocyte disarray on histological
        examination.
      explanation: >-
        Summarizes the in vivo conduction-slowing and non-fibrotic dilated
        cardiomyopathy phenotype driven by the D1275N allele; graded indirect
        because spontaneous heart block, atrial fibrillation, and ventricular
        tachycardia in this model occurred only in homozygous DN/DN mice rather
        than heterozygous DN/H mice.

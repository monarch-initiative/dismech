  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Carriers develop the defining structural remodeling of dilated cardiomyopathy -
    left ventricular chamber enlargement with impaired systolic function - with
    characteristically early onset. That an ion-channel defect produces structural
    remodeling at all is the notable feature of this entity; a comparable
    channel-to-structure progression is documented in SCN5A-linked progressive
    cardiac conduction disease, where the sodium-channel deficit drives myocardial
    fibrosis with age.

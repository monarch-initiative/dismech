name: Dilated Cardiomyopathy 1E
creation_date: "2026-08-23T00:00:00Z"
synonyms:
- CMD1E
- SCN5A familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1E
- cardiomyopathy, dilated, 1E
- SCN5A dilated cardiomyopathy with conduction disease
description: >-
  Dilated cardiomyopathy 1E (CMD1E) is the SCN5A-related form of familial isolated
  dilated cardiomyopathy, and the member of the series that most challenges the
  boundary between electrical and structural heart disease. SCN5A encodes Nav1.5,
  the pore-forming subunit of the cardiac voltage-gated sodium channel - a protein
  with no structural role in the sarcomere, whose other disease alleles cause the
  primary channelopathies Brugada syndrome, LQT3 and progressive cardiac conduction
  disease. In CMD1E the same gene instead produces a structural cardiomyopathy
  accompanied by rhythm disturbance: Olson and colleagues mapped the locus and
  identified the missense allele Asp1275Asn, which cosegregated with an
  age-dependent, variably expressed phenotype combining dilated cardiomyopathy,
  atrial fibrillation, impaired automaticity and conduction delay. The striking
  observation from that work, and the reason the entity is curated with an explicit
  caveat, is that similar or even identical SCN5A mutations may lead to heart
  failure, arrhythmia, or both - so genotype does not cleanly predict which arm
  dominates. ClinGen classifies the SCN5A-dilated cardiomyopathy relationship as
  Definitive with autosomal dominant inheritance.

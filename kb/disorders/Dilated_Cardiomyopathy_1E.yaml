pathophysiology:
- name: SCN5A Missense Variant in the Cardiac Sodium Channel
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  genetic_context:
    variant_origin: GERMLINE
  description: >-
    The initiating lesion in CMD1E is a heterozygous variant in SCN5A,
    encoding the alpha subunit of the cardiac voltage-gated sodium channel Nav1.5.
    The founding allele is Asp1275Asn (D1275N), identified after refined locus
    mapping in a family with dilated cardiomyopathy and rhythm disturbance, and
    two-thirds of reported DCM-associated SCN5A missense variants cluster in the
    highly conserved S3 and S4 voltage-sensing transmembrane segments (e.g.,
    R222Q). Unlike sarcomeric or cytoskeletal DCM genes, Nav1.5 is an ion
    channel whose other alleles cause the primary channelopathies Brugada
    syndrome, LQT3, and progressive cardiac conduction disease.

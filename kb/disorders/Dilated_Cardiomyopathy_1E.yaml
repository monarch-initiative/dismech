references:
- reference: PMID:20301486
  title: Dilated Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  CMD1E is the SCN5A member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity on parent dilated
  cardiomyopathy (MONDO:0005021). It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  It is the mechanistic outlier of the series and is curated as such. Whereas
  most DCM genes encode sarcomeric, cytoskeletal, desmosomal, or nuclear
  envelope proteins, SCN5A encodes the cardiac voltage-gated sodium channel
  Nav1.5, whose other alleles cause Brugada syndrome, LQT3, and progressive
  cardiac conduction disease. Two-thirds of DCM-associated SCN5A missense
  mutations localize to the conserved S3/S4 voltage-sensing segments
  (PMID:21596231).

  Two caveats are preserved on the pathograph. (1) The exact molecular cascade
  linking sodium-channel gating perturbation to chamber dilation remains
  incompletely resolved and is curated as INDIRECT_UNKNOWN_INTERMEDIATES: in
  humanized SCN5A-D1275N knock-in mice (PMID:21824921), reduced Nav1.5 protein
  abundance, reduced peak sodium current, conduction slowing, and left
  ventricular dilatation with reduced fractional shortening occur in a
  gene-dose-dependent manner across heterozygous (DN/H) and homozygous (DN/DN)
  mice without significant histological fibrosis at 12 weeks, whereas increased
  persistent late sodium current and spontaneous tachy-/bradyarrhythmias were
  observed only in homozygous (DN/DN) mice; conversely, interstitial fibrosis
  is present on human cardiac biopsy in T220I and R814W carriers
  (PMID:15671429) and in aged Scn5a conduction-disease mice (PMID:15809371).
  (2) The founding study's caution is curated on the endpoint node — similar or
  even identical SCN5A mutations may lead to heart failure, arrhythmia, or both
  (PMID:15671429) — so genotype alone does not predict which arm dominates.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary SCN5A cohort and pedigree literature
  cited throughout, principally PMID:15671429 and PMID:21596231.

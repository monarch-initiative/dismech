notes: >-
  CMD1E is the SCN5A member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  It is the mechanistic outlier of the series and is curated as such. Every other
  member's causal protein has a structural, regulatory or maintenance role in the
  cardiomyocyte; SCN5A encodes an ion channel, and its other alleles cause the
  primary channelopathies curated elsewhere here - Brugada syndrome and Progressive
  Cardiac Conduction Disease. The entity therefore sits at the boundary between
  electrical and structural heart disease.

  Two caveats preserved rather than smoothed over. (1) The link from the channel
  defect to ventricular dilation is curated as
  INDIRECT_UNKNOWN_INTERMEDIATES: the association is well established but the
  intervening mechanism is not, and the supporting evidence that a monogenic channel
  defect can drive structural change comes from a model of the *conduction-disease*
  phenotype, so it is marked PARTIAL. (2) The founding study's own caution is
  curated on the endpoint node - similar or even identical SCN5A mutations may lead
  to heart failure, arrhythmia, or both - so this entry does not claim that genotype
  predicts which arm dominates.

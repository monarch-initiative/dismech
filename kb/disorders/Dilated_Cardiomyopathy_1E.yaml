- name: Ventricular Dilation and Systolic Dysfunction
  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Carriers develop the defining structural remodeling of dilated cardiomyopathy -
    left ventricular chamber enlargement with impaired systolic function - with
    characteristically early onset. Myocardial interstitial fibrosis is
    heterogeneous across CMD1E alleles and disease stages: human endomyocardial
    biopsies from SCN5A T220I and R814W carriers show myocyte hypertrophy with
    mild-to-marked interstitial fibrosis and aged heterozygous Scn5a-deficient
    mice develop myocardial fibrosis, whereas D1275N and 2550-2551insTG human
    biopsies and 12-week-old humanized D1275N knock-in mice (which show
    gene-dose-dependent left ventricular dilatation and fractional-shortening
    reduction across DN/H heterozygotes and DN/DN homozygotes) lack significant
    histological fibrosis, indicating that ionic and electromechanical
    dysfunction can initiate chamber dilation before or without extensive
    fibrotic replacement.

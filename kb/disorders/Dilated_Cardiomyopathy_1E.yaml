- name: Altered Sodium Current with Conduction and Automaticity Impairment
  biological_scale: CELLULAR
  role: effector
  description: >-
    The mutant Nav1.5 channel disturbs the depolarizing sodium current that drives
    the action potential upstroke and propagates the impulse. Clinically this
    manifests as conduction delay, impaired automaticity, and a high burden of
    atrial fibrillation, which in this entity accompany rather than follow the
    ventricular disease. This node is the electrical arm of the phenotype and is the
    point of contact with the primary SCN5A channelopathies; how the same current
    disturbance also produces ventricular dilation is the entity's open mechanistic
    question.

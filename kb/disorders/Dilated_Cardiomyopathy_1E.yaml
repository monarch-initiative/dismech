pathophysiology:
- name: SCN5A Missense Variant in the Cardiac Sodium Channel
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    The initiating lesion in CMD1E is a heterozygous missense variant in SCN5A,
    encoding the alpha subunit of the cardiac voltage-gated sodium channel Nav1.5.
    The founding allele is Asp1275Asn (D1275N), identified after refined locus
    mapping in a family with dilated cardiomyopathy and rhythm disturbance. Unlike
    every other gene in this series, the affected protein has no structural role in
    the contractile apparatus - it is an ion channel, and the same gene's other
    alleles cause the primary channelopathies curated elsewhere in the knowledge
    base (Brugada syndrome, progressive cardiac conduction disease).

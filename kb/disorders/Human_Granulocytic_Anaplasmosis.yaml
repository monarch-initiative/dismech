name: Human Granulocytic Anaplasmosis
creation_date: "2026-09-25T09:44:24Z"
category: Infectious Disease
parents:
- Tick-borne disease
- Anaplasmataceae infectious disease
synonyms:
- HGA
- Human granulocytic ehrlichiosis
- Human granulocytotropic anaplasmosis
- Anaplasmosis
description: >-
  Human granulocytic anaplasmosis is an acute Ixodes tick-borne bacterial
  infection caused by the obligate intracellular bacterium Anaplasma
  phagocytophilum. The organism enters neutrophils, remodels host antimicrobial
  and survival programs with type IV secretion effectors, and produces a
  nonspecific febrile illness often accompanied by leukopenia, thrombocytopenia,
  and abnormal hepatic injury tests.
disease_term:
  preferred_term: human granulocytic anaplasmosis
  term:
    id: MONDO:0005118
    label: human granulocytic anaplasmosis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:39102427
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
        bacterial infection caused by Anaplasma phagocytophilum.
      explanation: >-
        The systematic review defines HGA as a tick-borne bacterial infection,
        supporting placement under Harrison's infectious-diseases part.
pathophysiology:
- name: Ixodes-Borne Anaplasma Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infected Ixodes ticks inoculate A. phagocytophilum and initiate the
    granulocytic intracellular infection that defines HGA.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: PSGL-1-Mediated Neutrophil Entry
    causal_link_type: DIRECT
    description: >-
      Tick inoculation delivers organisms that then bind granulocyte receptors
      and enter neutrophils.
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
      bacterial infection caused by Anaplasma phagocytophilum.
    explanation: >-
      Establishes tick-borne A. phagocytophilum infection as the initiating
      exposure for HGA.

- name: PSGL-1-Mediated Neutrophil Entry
  biological_scale: CELLULAR
  description: >-
    A. phagocytophilum engages granulocyte receptors including PSGL-1 and its
    sialyl Lewis x cap to enter neutrophils and deliver effector cargo.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Anaplasma-Occupied Granulocyte Inclusion
    causal_link_type: DIRECT
    description: >-
      Receptor-dependent entry seeds the intracellular inclusion in which the
      bacterium can survive.
  evidence:
  - reference: PMID:18485118
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      P-selectin glycoprotein ligand-1 (PSGL-1) and the tetrasaccharide sialyl
      Lewis x (sLe(x)), which caps the PSGL-1 N-terminus, are confirmed A.
      phagocytophilum receptors.
    explanation: >-
      Identifies PSGL-1 and sialyl Lewis x as host receptors used by A.
      phagocytophilum during granulocytic infection.

- name: Anaplasma-Occupied Granulocyte Inclusion
  biological_scale: CELLULAR
  description: >-
    The bacterium multiplies in granulocytes inside a protected inclusion, a
    niche that separates the organism from extracellular immune effectors and
    underlies the need for cell-penetrant therapy.
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: AnkA-Driven NADPH Oxidase Silencing
    causal_link_type: DIRECT
    description: >-
      Intracellular organisms use a type IV secretion system to deliver AnkA
      into the host nucleus.
  - target: Ats-1 Anti-Apoptosis and Autophagy Hijacking
    causal_link_type: DIRECT
    description: >-
      Intracellular organisms deliver Ats-1 to mitochondria and autophagy
      initiation machinery.
  - target: Anaplasma Ribosomal Translation (Doxycycline Target)
    description: >-
      Intracellular Anaplasma remains dependent on its bacterial ribosome for
      protein synthesis.
  evidence:
  - reference: PMID:17275372
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anaplasma phagocytophilum, the causative agent of tick-borne fever (TBF)
      in sheep and cattle and human granulocytic anaplasmosis, has the unique
      ability to infect and multiply within neutrophils, eosinophils and
      monocytes, cells at the frontline of the immune system.
    explanation: >-
      Review evidence establishing multiplication of A. phagocytophilum in
      granulocytic host cells. Evidence source is OTHER because this is a review.

- name: AnkA-Driven NADPH Oxidase Silencing
  biological_scale: MOLECULAR
  description: >-
    The type IV secretion effector AnkA traffics into the granulocyte nucleus,
    binds AT-rich DNA at antimicrobial defense genes, recruits HDAC1 at the CYBB
    promoter, and represses NADPH oxidase expression, reducing respiratory-burst
    killing.
  biological_processes:
  - preferred_term: negative regulation of respiratory burst
    modifier: INCREASED
    term:
      id: GO:0060268
      label: negative regulation of respiratory burst
  downstream:
  - target: Granulocytic Anaplasma Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Silencing CYBB suppresses the NADPH-oxidase component of neutrophil
      oxidative killing and helps intracellular organisms avoid bactericidal
      attack.
  evidence:
  - reference: PMID:25996657
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ankyrin A (AnkA), an A. phagocytophilum type IV secretion system
      effector, enters the granulocyte nucleus, binds stretches of AT-rich DNA
      and alters transcription of antimicrobial defence genes, including
      down-regulation of CYBB.
    explanation: >-
      Establishes the nuclear AnkA effector and its repression of the CYBB
      NADPH-oxidase gene in granulocytes.
  - reference: PMID:25996657
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, a direct interaction between AnkA and HDAC1 was detected at
      the CYBB promoter, and was critical for AnkA-mediated CYBB repression.
    explanation: >-
      Links AnkA recruitment of HDAC1 at the CYBB promoter to the silencing of
      the neutrophil oxidative-burst gene.

- name: Ats-1 Anti-Apoptosis and Autophagy Hijacking
  biological_scale: CELLULAR
  description: >-
    The A. phagocytophilum Ats-1 effector enters host mitochondria to suppress
    intrinsic apoptosis and also binds Beclin 1/Atg14L to nucleate autophagosomes
    that support the Anaplasma inclusion.
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  - preferred_term: autophagosome assembly
    modifier: INCREASED
    term:
      id: GO:0000045
      label: autophagosome assembly
  downstream:
  - target: Granulocytic Anaplasma Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Blocking host-cell apoptosis and redirecting Beclin 1-dependent autophagy
      help infected cells remain permissive for intracellular bacterial growth.
  evidence:
  - reference: PMID:20174550
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ats-1 inhibited etoposide-induced cytochrome c release from mitochondria,
      PARP cleavage, and apoptosis in mammalian cells, as well as Bax-induced
      yeast apoptosis.
    explanation: >-
      Shows that Ats-1 suppresses mitochondria-mediated apoptotic execution.
  - reference: PMID:23197835
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, Anaplasma actively induces autophagy by secreting Ats-1 that
      hijacks the Beclin 1-Atg14L autophagy initiation pathway likely to acquire
      host nutrients for its growth.
    explanation: >-
      Establishes Ats-1-driven Beclin 1/Atg14L autophagy induction as a growth
      support pathway for the intracellular organism.

- name: Granulocytic Anaplasma Immune Evasion
  biological_scale: CELLULAR
  description: >-
    Effector-mediated suppression of phagolysosome fusion, respiratory burst,
    and neutrophil apoptosis lets Anaplasma organisms persist and amplify in the
    otherwise bactericidal granulocyte.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: IFN-gamma-STAT1 Immunopathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained infection elicits cytokine responses that converge on
      IFN-gamma-associated STAT1 signaling and inflammatory injury.
  - target: Acute Febrile Cytopenic HGA
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Replicating intracellular infection produces the characteristic acute
      febrile illness with leukopenia, thrombocytopenia, and abnormal hepatic
      injury tests.
  evidence:
  - reference: PMID:17275372
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These include its ability to inhibit phagosome-lysosome fusion, to
      suppress respiratory burst and to delay the apoptotic death of
      neutrophils.
    explanation: >-
      Summarizes the neutrophil-killing pathways that A. phagocytophilum
      subverts during intracellular survival. Evidence source is OTHER because
      this is a review.

- name: IFN-gamma-STAT1 Immunopathology
  biological_scale: CELLULAR
  description: >-
    A. phagocytophilum infection drives IFN-gamma-associated STAT1 signaling;
    phosphorylated STAT1 tracks with inflammatory tissue injury, implicating
    host cytokine signaling rather than simple bacterial biomass as a driver of
    severe lesions.
  biological_processes:
  - preferred_term: IFN-gamma-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
  - preferred_term: response to IFN-gamma
    modifier: INCREASED
    term:
      id: GO:0034341
      label: response to type II interferon
  downstream:
  - target: Acute Febrile Cytopenic HGA
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      IFN-gamma-STAT1 signaling contributes to the immunopathologic inflammatory
      lesion arm of HGA.
  evidence:
  - reference: PMID:23278812
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This increase in phosphorylated Stat1 (pStat1) correlated significantly
      with IFN-gamma production and inflammatory tissue injury.
    explanation: >-
      Mouse infection data link IFN-gamma production, STAT1 phosphorylation, and
      inflammatory tissue injury during A. phagocytophilum infection.

- name: Acute Febrile Cytopenic HGA
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The organism-level acute syndrome presents as an undifferentiated fever with
    cytopenias and biochemical liver injury; a minority of reported patients
    develop life-threatening complications such as ARDS or secondary HLH.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acute Respiratory Distress Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      Pooled human literature review identifying the febrile, cytopenic, and
      hepatic-laboratory syndrome that characterizes HGA.

- name: Anaplasma Ribosomal Translation (Doxycycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  description: >-
    A. phagocytophilum depends on 70S-ribosome translation; doxycycline exploits
    this vulnerability by binding the 30S ribosomal subunit and arresting
    bacterial protein synthesis.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence for the bacterial ribosome as an antibiotic target,
      supporting this conserved therapeutic-vulnerability node.

- name: Cell-Penetrant Antimicrobial Requirement
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    intracellular_pathogen_persistence#Requirement for Cell-Penetrant
    Antimicrobials
  description: >-
    Because A. phagocytophilum replicates inside granulocytes, treatment must
    use agents that achieve intracellular concentrations rather than poorly
    cell-penetrant antibiotics.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Review evidence establishing intracellular drug accumulation as the
      pharmacologic requirement this HGA node conforms to.
phenotypes:
- name: Fever
  description: >-
    Fever is the dominant presentation of HGA, reported in 88.5% of reviewed
    cases.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      The systematic review found fever in 88.5% of HGA cases, supporting a
      very-frequent fever phenotype.

- name: Thrombocytopenia
  description: >-
    Thrombocytopenia is a frequent hematologic abnormality in HGA and was
    present in 71.8% of reviewed cases.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      The systematic review found thrombocytopenia in 71.8% of HGA cases,
      within the 30-79% frequent band.

- name: Leukopenia
  description: >-
    Leukopenia is frequent in HGA and was reported in 49.8% of reviewed cases.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Leukopenia
    term:
      id: HP:0001882
      label: Decreased total leukocyte count
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      The systematic review found leukopenia in 49.8% of HGA cases, within the
      30-79% frequent band.

- name: Elevated Hepatic Transaminases
  description: >-
    Abnormal hepatic injury tests are frequent in HGA; the HPO binding captures
    the common elevated-transaminase manifestation of this laboratory
    abnormality.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Elevated hepatic transaminases
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      The systematic review found abnormal liver injury tests in 66.7% of HGA
      cases; elevated circulating hepatic transaminases are the HPO-bound
      laboratory abnormality represented by that clinical phrasing.

- name: Acute Respiratory Distress Syndrome
  description: >-
    ARDS is an occasional severe complication of HGA, reported in 6.3% of the
    reviewed cases.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although we found complications reported in a total of 40.5% of the
      reviewed cases and severe and even life-threatening complications are not
      infrequent (e.g. acute renal failure 9.8%, multi organ failure 7.5%, ARDS
      6.3%, a.o.), sequelae are rare (2.1% of the cases) and lethality is low
      (3.0% of the cases).
    explanation: >-
      The systematic review found ARDS in 6.3% of HGA cases, within the 5-29%
      occasional band.

- name: Hemophagocytosis
  description: >-
    Severe HGA can trigger secondary hemophagocytic lymphohistiocytosis.
  phenotype_term:
    preferred_term: Hemophagocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:32723647
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two cases of severe anaplasmosis that progressed to secondary
      hemophagocytic lymphohistiocytosis (HLH).
    explanation: >-
      Case-series evidence documents severe anaplasmosis progressing to
      secondary HLH, whose defining histologic process is hemophagocytosis.
infectious_agent:
- name: Anaplasma phagocytophilum
  description: >-
    Obligate intracellular Anaplasmataceae bacterium with tropism for human
    granulocytes.
  infectious_agent_term:
    preferred_term: Anaplasma phagocytophilum
    term:
      id: NCBITaxon:948
      label: Anaplasma phagocytophilum
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
      bacterial infection caused by Anaplasma phagocytophilum.
    explanation: >-
      Establishes A. phagocytophilum as the bacterial agent of human HGA.
transmission:
- name: Ixodes Tick Bite Transmission
  description: >-
    HGA is transmitted through the bite of infected Ixodes ticks, including I.
    scapularis and I. pacificus in the United States.
  evidence:
  - reference: PMID:20077398
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These agents are transmitted through the bite of infected tick. In the
      United States, the vectors are Amblyomma americanum, Ixodes scapularis and
      Ixodes pacificus ticks.
    explanation: >-
      Review evidence identifies infected tick bites as the route and names I.
      scapularis and I. pacificus among United States Anaplasmataceae vectors.

- name: Transfusion-Associated Transmission
  description: >-
    Blood transfusion is a rare non-vector route of A. phagocytophilum
    acquisition.
  evidence:
  - reference: PMID:25385549
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although usually transmitted via tick bite, HGA may rarely also be
      acquired through transfusion.
    explanation: >-
      Case-report evidence documents transfusion-associated HGA as a rare
      acquisition route.

- name: Perinatal Transmission
  description: >-
    Perinatal transmission can occur but is rare.
  evidence:
  - reference: PMID:17682993
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perinatal transmission was documented in 1 neonate, who responded well to
      treatment.
    explanation: >-
      Case-series evidence documents perinatal HGA transmission in one neonate.
diagnosis:
- name: Blood PCR and Indirect Immunofluorescence
  description: >-
    HGA diagnosis commonly combines acute whole-blood PCR or smear review with
    indirect immunofluorescence serology.
  evidence:
  - reference: PMID:20077398
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The laboratory diagnosis is most frequently serological--evidence of
      antibody by indirect immunofluorescence assay (IFA) and detection of DNA
      by polymerase chain reaction (PCR), or microscopy evidence--Giemsa stain
      of blood smears (morulae in granulocytes or monocytes).
    explanation: >-
      Review evidence identifies IFA serology, PCR, and Giemsa smear detection
      of morulae as common HGA diagnostic routes.
treatments:
- name: Doxycycline
  description: >-
    First-line tetracycline pharmacotherapy for suspected or confirmed HGA.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Anaplasma Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits the Anaplasma 30S ribosomal subunit, shutting down
      bacterial protein synthesis.
  - target: Cell-Penetrant Antimicrobial Requirement
    treatment_effect: BYPASSES
    description: >-
      Doxycycline satisfies the cell-penetrant-drug requirement for an organism
      that replicates inside granulocytes.
    evidence:
    - reference: PMID:27172113
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Doxycycline is the drug of choice for treatment of all tickborne
        rickettsial diseases in patients of all ages, including children aged <8
        years
      explanation: >-
        National recommendations for tickborne rickettsial diseases,
        ehrlichioses, and anaplasmosis establish doxycycline as first-line
        cell-penetrant therapy. Evidence source is OTHER as this is a national
        recommendations report.
  evidence:
  - reference: PMID:39102427
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with doxycycline shows a rapid response, with the fever
      subsiding in the majority of patients within one day of starting
      treatment.
    explanation: >-
      Systematic-review evidence supports doxycycline as an effective HGA
      pharmacotherapy.

- name: Rifampin During Pregnancy
  description: >-
    Rifampin is a reported alternative pharmacotherapy for HGA in pregnancy when
    tetracycline exposure is avoided.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampin
      term:
        id: CHEBI:28077
        label: rifampicin
  evidence:
  - reference: PMID:17682993
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytic ehrlichiosis did not seem to present in a fulminant
      fashion, and all treated patients had excellent responses to rifampin or
      doxycycline therapy.
    explanation: >-
      Pregnancy case-series evidence supports rifampin or doxycycline response
      in treated pregnant patients with the disease historically called human
      granulocytic ehrlichiosis.

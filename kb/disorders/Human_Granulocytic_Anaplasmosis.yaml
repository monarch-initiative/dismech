    explanation: The systematic review reports multi-organ failure in 7.5% of HGA cases; no HPO term exists for this outcome, so no term is bound.
- name: Hemophagocytosis
  description: >-
    Severe HGA can trigger secondary hemophagocytic lymphohistiocytosis.
  frequency: RARE
  phenotype_term:
    preferred_term: Hemophagocytosis
    term:
      id: HP:0012156
      label: Hemophagocytosis
  evidence:
  - reference: PMID:32723647
    reference_title: "Severe anaplasmosis represents a treatable cause of secondary hemophagocytic lymphohistiocytosis: Two cases and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present two cases of severe anaplasmosis that progressed to secondary
      hemophagocytic lymphohistiocytosis (HLH).
    explanation: >-
      Case-series evidence documents severe anaplasmosis progressing to
      secondary HLH, whose defining histologic process is hemophagocytosis.
infectious_agent:
- name: Anaplasma phagocytophilum
  description: >-
    Obligate intracellular Anaplasmataceae bacterium with tropism for human
    granulocytes.
  infectious_agent_term:
    preferred_term: Anaplasma phagocytophilum
    term:
      id: NCBITaxon:948
      label: Anaplasma phagocytophilum
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
      bacterial infection caused by Anaplasma phagocytophilum.
    explanation: >-
      Establishes A. phagocytophilum as the bacterial agent of human HGA.
transmission:
- name: Ixodes Tick Bite Transmission
  description: >-
    HGA is transmitted through the bite of infected Ixodes ticks, including I.
    scapularis and I. pacificus in the United States.
  evidence:
  - reference: PMID:20077398
    reference_title: "[Ehrlichiosis/Anaplasmosis]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These agents are transmitted through the bite of infected tick. In the
      United States, the vectors are Amblyomma americanum, Ixodes scapularis and
      Ixodes pacificus ticks.
    explanation: >-
      Review synthesis identifying infected tick bites as the route and naming I.
      scapularis and I. pacificus among United States Anaplasmataceae vectors.

- name: Transfusion-Associated Transmission
  description: >-
    Blood transfusion is a rare non-vector route of A. phagocytophilum
    acquisition.
  evidence:
  - reference: PMID:25385549
    reference_title: "Transfusion-associated Anaplasma phagocytophilum infection in a pregnant patient with thalassemia trait: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although usually transmitted via tick bite, HGA may rarely also be
      acquired through transfusion.
    explanation: >-
      Case-report evidence documents transfusion-associated HGA as a rare
      acquisition route.

- name: Perinatal Transmission
  description: >-
    Perinatal transmission can occur but is rare.
  evidence:
  - reference: PMID:17682993
    reference_title: "Human granulocytic anaplasmosis during pregnancy: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perinatal transmission was documented in 1 neonate, who responded well to
      treatment.
    explanation: >-
      Case-series evidence documents perinatal HGA transmission in one neonate.
diagnosis:
- name: Blood PCR and Indirect Immunofluorescence
  description: >-
    HGA diagnosis commonly combines acute whole-blood PCR or smear review with
    indirect immunofluorescence serology.
  evidence:
  - reference: PMID:20077398
    reference_title: "[Ehrlichiosis/Anaplasmosis]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The laboratory diagnosis is most frequently serological--evidence of
      antibody by indirect immunofluorescence assay (IFA) and detection of DNA
      by polymerase chain reaction (PCR), or microscopy evidence--Giemsa stain
      of blood smears (morulae in granulocytes or monocytes).
    explanation: >-
      Review synthesis identifying IFA serology, PCR, and Giemsa smear detection
      of morulae as common HGA diagnostic routes.
prevalence:
- population: United States (national surveillance, 2008-2012)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.727
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    A calculated US incidence of 7.27 cases per million population per year for
    2008-2012, a fivefold increase over 2000-2007.
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a calculated incidence rate of 7.27 cases per million population was reported"
    explanation: US surveillance incidence of HGA for 2008-2012, cases per million population per year.
treatments:
- name: Doxycycline
  description: >-
    First-line tetracycline pharmacotherapy for suspected or confirmed HGA.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Anaplasma Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits the Anaplasma 30S ribosomal subunit, shutting down
      bacterial protein synthesis.
  - target: Cell-Penetrant Antimicrobial Requirement
    treatment_effect: BYPASSES
    description: >-
      Doxycycline satisfies the cell-penetrant-drug requirement for an organism
      that replicates inside granulocytes.
    evidence:
    - reference: PMID:27172113
      reference_title: "Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis - United States."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Doxycycline is the drug of choice for treatment of all tickborne
        rickettsial diseases in patients of all ages, including children aged <8
        years
      explanation: >-
        National recommendations for tickborne rickettsial diseases,
        ehrlichioses, and anaplasmosis establish doxycycline as first-line
        cell-penetrant therapy. Evidence source is OTHER as this is a national
        recommendations report.
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with doxycycline shows a rapid response, with the fever
      subsiding in the majority of patients within one day of starting
      treatment.
    explanation: >-
      Systematic-review evidence supports doxycycline as an effective HGA
      pharmacotherapy.

- name: Rifampin During Pregnancy
  description: >-
    Rifampin is a reported alternative pharmacotherapy for HGA in pregnancy when
    tetracycline exposure is avoided.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampin
      term:
        id: CHEBI:28077
        label: rifampicin
  evidence:
  - reference: PMID:17682993
    reference_title: "Human granulocytic anaplasmosis during pregnancy: case series and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytic ehrlichiosis did not seem to present in a fulminant
      fashion, and all treated patients had excellent responses to rifampin or
      doxycycline therapy.
    explanation: >-
      Pregnancy case-series evidence supports rifampin or doxycycline response
      in treated pregnant patients with the disease historically called human
      granulocytic ehrlichiosis.

name: Human Granulocytic Anaplasmosis
creation_date: "2026-09-25T09:44:24Z"
category: Infectious Disease
parents:
- Tick-borne disease
- Anaplasmataceae infectious disease
synonyms:
- HGA
- Human granulocytic ehrlichiosis
- Human granulocytotropic anaplasmosis
description: >-
  Human granulocytic anaplasmosis is an acute Ixodes tick-borne bacterial
  infection caused by the obligate intracellular bacterium Anaplasma
  phagocytophilum. The organism enters neutrophils, remodels host antimicrobial
  and survival programs with type IV secretion effectors, and produces a
  nonspecific febrile illness often accompanied by leukopenia, thrombocytopenia,
  and abnormal hepatic injury tests.
disease_term:
  preferred_term: human granulocytic anaplasmosis
  term:
    id: MONDO:0005118
    label: human granulocytic anaplasmosis
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:39102427
      reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
        bacterial infection caused by Anaplasma phagocytophilum.
      explanation: >-
        The systematic review defines HGA as a tick-borne bacterial infection,
        supporting placement under Harrison's infectious-diseases part.
pathophysiology:
- name: Ixodes-Borne Anaplasma Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infected Ixodes ticks inoculate A. phagocytophilum and initiate the
    granulocytic intracellular infection that defines HGA.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: PSGL-1-Mediated Neutrophil Entry
    causal_link_type: DIRECT
    description: >-
      Tick inoculation delivers organisms that then bind granulocyte receptors
      and enter neutrophils.
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Human granulocytotropic anaplasmosis (HGA) is a zoonotic tick-borne
      bacterial infection caused by Anaplasma phagocytophilum.
    explanation: >-
      Establishes tick-borne A. phagocytophilum infection as the initiating
      exposure for HGA.

- name: PSGL-1-Mediated Neutrophil Entry
  biological_scale: CELLULAR
  description: >-
    A. phagocytophilum engages granulocyte receptors including PSGL-1 and its
    sialyl Lewis x cap to enter neutrophils and deliver effector cargo.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: symbiont entry into host cell
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Anaplasma-Occupied Granulocyte Inclusion
    causal_link_type: DIRECT
    description: >-
      Receptor-dependent entry seeds the intracellular inclusion in which the
      bacterium can survive.
  evidence:
  - reference: PMID:18485118
    reference_title: "Anaplasma phagocytophilum PSGL-1-independent infection does not require Syk and leads to less efficient AnkA delivery."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      P-selectin glycoprotein ligand-1 (PSGL-1) and the tetrasaccharide sialyl
      Lewis x (sLe(x)), which caps the PSGL-1 N-terminus, are confirmed A.
      phagocytophilum receptors.
    explanation: >-
      Identifies PSGL-1 and sialyl Lewis x as host receptors used by A.
      phagocytophilum during granulocytic infection.

- name: Anaplasma-Occupied Granulocyte Inclusion
  biological_scale: CELLULAR
  description: >-
    The bacterium multiplies in granulocytes inside a protected inclusion, a
    niche that separates the organism from extracellular immune effectors and
    underlies the need for cell-penetrant therapy.
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: AnkA-Driven NADPH Oxidase Silencing
    causal_link_type: DIRECT
    description: >-
      Intracellular organisms use a type IV secretion system to deliver AnkA
      into the host nucleus.
  - target: Ats-1 Anti-Apoptosis and Autophagy Hijacking
    causal_link_type: DIRECT
    description: >-
      Intracellular organisms deliver Ats-1 to mitochondria and autophagy
      initiation machinery.
  - target: Anaplasma Ribosomal Translation (Doxycycline Target)
    description: >-
      Intracellular Anaplasma remains dependent on its bacterial ribosome for
      protein synthesis.
  - target: Msp2(p44) Antigenic Variation
    causal_link_type: DIRECT
    description: >-
      Persistent intracellular organisms shuffle msp2(p44) pseudogenes to vary
      their major surface antigen.
  evidence:
  - reference: PMID:17275372
    reference_title: "Immune evasion and immunosuppression by Anaplasma phagocytophilum, the causative agent of tick-borne fever of ruminants and human granulocytic anaplasmosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anaplasma phagocytophilum, the causative agent of tick-borne fever (TBF)
      in sheep and cattle and human granulocytic anaplasmosis, has the unique
      ability to infect and multiply within neutrophils, eosinophils and
      monocytes, cells at the frontline of the immune system.
    explanation: >-
      Review synthesis establishing multiplication of A. phagocytophilum in
      granulocytic host cells.

- name: AnkA-Driven NADPH Oxidase Silencing
  biological_scale: MOLECULAR
  description: >-
    The type IV secretion effector AnkA traffics into the granulocyte nucleus,
    binds AT-rich DNA at antimicrobial defense genes, recruits HDAC1 at the CYBB
    promoter, and represses NADPH oxidase expression, reducing respiratory-burst
    killing.
  biological_processes:
  - preferred_term: negative regulation of respiratory burst
    modifier: INCREASED
    term:
      id: GO:0060268
      label: negative regulation of respiratory burst
  downstream:
  - target: Granulocytic Anaplasma Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Silencing CYBB suppresses the NADPH-oxidase component of neutrophil
      oxidative killing and helps intracellular organisms avoid bactericidal
      attack.
  evidence:
  - reference: PMID:25996657
    reference_title: "Chromatin-bound bacterial effector ankyrin A recruits histone deacetylase 1 and modifies host gene expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ankyrin A (AnkA), an A. phagocytophilum type IV secretion system
      effector, enters the granulocyte nucleus, binds stretches of AT-rich DNA
      and alters transcription of antimicrobial defence genes, including
      down-regulation of CYBB.
    explanation: >-
      Establishes the nuclear AnkA effector and its repression of the CYBB
      NADPH-oxidase gene in granulocytes.
  - reference: PMID:25996657
    reference_title: "Chromatin-bound bacterial effector ankyrin A recruits histone deacetylase 1 and modifies host gene expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, a direct interaction between AnkA and HDAC1 was detected at
      the CYBB promoter, and was critical for AnkA-mediated CYBB repression.
    explanation: >-
      Links AnkA recruitment of HDAC1 at the CYBB promoter to the silencing of
      the neutrophil oxidative-burst gene.

- name: Ats-1 Anti-Apoptosis and Autophagy Hijacking
  biological_scale: CELLULAR
  description: >-
    The A. phagocytophilum Ats-1 effector enters host mitochondria to suppress
    intrinsic apoptosis and also binds Beclin 1/Atg14L to nucleate autophagosomes
    that support the Anaplasma inclusion.
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  - preferred_term: autophagosome assembly
    modifier: INCREASED
    term:
      id: GO:0000045
      label: autophagosome assembly
  downstream:
  - target: Granulocytic Anaplasma Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Blocking host-cell apoptosis and redirecting Beclin 1-dependent autophagy
      help infected cells remain permissive for intracellular bacterial growth.
  evidence:
  - reference: PMID:20174550
    reference_title: "Anaplasma phagocytophilum Ats-1 is imported into host cell mitochondria and interferes with apoptosis induction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ats-1 inhibited etoposide-induced cytochrome c release from mitochondria,
      PARP cleavage, and apoptosis in mammalian cells, as well as Bax-induced
      yeast apoptosis.
    explanation: >-
      Shows that Ats-1 suppresses mitochondria-mediated apoptotic execution.
  - reference: PMID:23197835
    reference_title: "Autophagosomes induced by a bacterial Beclin 1 binding protein facilitate obligatory intracellular infection."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, Anaplasma actively induces autophagy by secreting Ats-1 that
      hijacks the Beclin 1-Atg14L autophagy initiation pathway likely to acquire
      host nutrients for its growth.
    explanation: >-
      Establishes Ats-1-driven Beclin 1/Atg14L autophagy induction as a growth
      support pathway for the intracellular organism.

- name: Msp2(p44) Antigenic Variation
  biological_scale: MOLECULAR
  description: >-
    During chronic infection A. phagocytophilum uses gene conversion to shuffle
    ~100 msp2(p44) pseudogenes into a single expression cassette, continually
    varying its major surface antigen Msp2 and evading the antibody response.
  biological_processes:
  - preferred_term: DNA recombination
    modifier: INCREASED
    term:
      id: GO:0006310
      label: DNA recombination
  - preferred_term: antigenic variation
    modifier: INCREASED
    term:
      id: GO:0020033
      label: antigenic variation
  downstream:
  - target: Granulocytic Anaplasma Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Continual surface-antigen variation lets the organism escape the
      serotype-specific antibody response and persist.
  evidence:
  - reference: PMID:22859615
    reference_title: Antigen variability in Anaplasma phagocytophilum during chronic infection of a reservoir host.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A. phagocytophilum utilizes gene conversion to shuffle approximately 100 functional pseudogenes into a single expression cassette of the msp2(p44) gene, which encodes the major surface antigen, major surface protein 2 (Msp2)."
    explanation: >-
      The woodrat reservoir study establishes msp2(p44) gene-conversion antigenic
      variation as the surface-antigen switching mechanism.
- name: Granulocytic Anaplasma Immune Evasion
  biological_scale: CELLULAR
  description: >-
    Effector-mediated suppression of phagolysosome fusion, respiratory burst,
    and neutrophil apoptosis lets Anaplasma organisms persist and amplify in the
    otherwise bactericidal granulocyte.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: IFN-gamma-STAT1 Immunopathology
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained infection elicits cytokine responses that converge on
      IFN-gamma-associated STAT1 signaling and inflammatory injury.
  - target: Acute Febrile Cytopenic HGA
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Replicating intracellular infection produces the characteristic acute
      febrile illness with leukopenia, thrombocytopenia, and abnormal hepatic
      injury tests.
  evidence:
  - reference: PMID:17275372
    reference_title: "Immune evasion and immunosuppression by Anaplasma phagocytophilum, the causative agent of tick-borne fever of ruminants and human granulocytic anaplasmosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These include its ability to inhibit phagosome-lysosome fusion, to
      suppress respiratory burst and to delay the apoptotic death of
      neutrophils.
    explanation: >-
      Review synthesis of the neutrophil-killing pathways that A. phagocytophilum
      subverts during intracellular survival.

- name: IFN-gamma-STAT1 Immunopathology
  biological_scale: CELLULAR
  description: >-
    A. phagocytophilum infection drives IFN-gamma-associated STAT1 signaling;
    phosphorylated STAT1 tracks with inflammatory tissue injury, implicating
    host cytokine signaling rather than simple bacterial biomass as a driver of
    severe lesions.
  biological_processes:
  - preferred_term: IFN-gamma-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
  - preferred_term: response to IFN-gamma
    modifier: INCREASED
    term:
      id: GO:0034341
      label: response to type II interferon
  downstream:
  - target: Acute Febrile Cytopenic HGA
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      IFN-gamma-STAT1 signaling contributes to the immunopathologic inflammatory
      lesion arm of HGA.
  evidence:
  - reference: PMID:23278812
    reference_title: "Anaplasma phagocytophilum, interferon gamma production and Stat1 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This increase in phosphorylated Stat1 (pStat1) correlated significantly
      with IFN-gamma production and inflammatory tissue injury.
    explanation: >-
      Mouse infection data link IFN-gamma production, STAT1 phosphorylation, and
      inflammatory tissue injury during A. phagocytophilum infection.

- name: Acute Febrile Cytopenic HGA
  biological_scale: ORGANISM
  role: outcome
  description: >-
    The organism-level acute syndrome presents as an undifferentiated fever with
    cytopenias and biochemical liver injury; a minority of reported patients
    develop life-threatening complications such as ARDS or secondary HLH.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Leukopenia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myalgia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Chills
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Malaise
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acute Respiratory Distress Syndrome
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Acute kidney injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Multi-organ failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hemophagocytosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HGA primarily presents as an unspecific febrile illness (88.5% of the
      cases) often accompanied by thrombocytopenia (71.8% of the cases),
      abnormal liver injury tests (66.7% of the cases), and leukopenia (49.8%
      of the cases).
    explanation: >-
      Pooled human literature review identifying the febrile, cytopenic, and
      hepatic-laboratory syndrome that characterizes HGA.

- name: Anaplasma Ribosomal Translation (Doxycycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the
    Ribosome
  description: >-
    A. phagocytophilum depends on 70S-ribosome translation; doxycycline exploits
    this vulnerability by binding the 30S ribosomal subunit and arresting
    bacterial protein synthesis.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: "Ribosome-targeting antibiotics and mechanisms of bacterial resistance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review synthesis of the bacterial ribosome as an antibiotic target,
      supporting this conserved therapeutic-vulnerability node.

- name: Cell-Penetrant Antimicrobial Requirement
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  conforms_to: >-
    intracellular_pathogen_persistence#Requirement for Cell-Penetrant
    Antimicrobials
  description: >-
    Because A. phagocytophilum replicates inside granulocytes, treatment must
    use agents that achieve intracellular concentrations rather than poorly
    cell-penetrant antibiotics.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated
      mainly with the intracellular concentrations achieved by the different
      antimicrobial agents.
    explanation: >-
      Review synthesis establishing intracellular drug accumulation as the
      pharmacologic requirement this HGA node conforms to.

- name: Acute Respiratory Distress Syndrome
  description: >-
    ARDS is an occasional severe complication of HGA, reported in 6.3% of the
    reviewed cases.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
  evidence:
  - reference: PMID:39102427
    reference_title: "Human granulocytotropic anaplasmosis-A systematic review and analysis of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although we found complications reported in a total of 40.5% of the
      reviewed cases and severe and even life-threatening complications are not
      infrequent (e.g. acute renal failure 9.8%, multi organ failure 7.5%, ARDS

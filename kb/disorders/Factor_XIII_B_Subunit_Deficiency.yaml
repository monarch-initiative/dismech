treatments:
- name: Plasma-Derived Factor XIII Concentrate
  description: >-
    Plasma-derived FXIII concentrate contains both subunits and is the
    replacement product for B-subunit deficiency. Because the phenotype is
    mild, patients may need it only on demand for bleeding or before surgery
    rather than as routine prophylaxis. Recombinant FXIII-A2 (catridecacog),
    the prophylactic product used for A-subunit deficiency, is not appropriate
    here, because it supplies no FXIII-B. Repeated concentrate infusion led to
    anti-FXIII-B alloantibodies in one patient with complete absence of
    FXIII-B, after which replacement became less effective.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human factor XIII concentrate
      term:
        id: NCIT:C200601
        label: Human Factor XIII Concentrate
  target_mechanisms:
  - target: Reduced Plasma FXIII Transglutaminase Activity
    treatment_effect: RESTORES
    description: Supplies both subunits, restoring plasma FXIII activity temporarily.
    evidence:
    - reference: PMID:23407795
      reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When he suddenly developed spontaneous intramuscular haematoma, the bleeding was arrested by infusing FXIII concentrates."
      explanation: Concentrate stopped an acute bleed.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "recombinant FXIII-A2 is appropriate for F13A1 defects but not patients with F13B variants."
    explanation: Why plasma-derived concentrate, not recombinant FXIII-A2, is used.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with severe FXIII-B deficiency may only require on-demand therapy, while heterozygotes are generally asymptomatic."
    explanation: On-demand rather than prophylactic replacement.
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repeated infusions of exogenous FXIII for hemostasis increased anti-FXIII-B alloantibodies that resisted FXIII substitution."
    explanation: Alloantibody complication of replacement in complete deficiency.
diagnosis:
- name: FXIII activity assay with subunit antigen measurement
  description: >-
    A quantitative FXIII activity assay detects the deficiency; separate
    FXIII-A and FXIII-B antigen measurement and F13A1/F13B sequencing then
    identify which subunit is responsible, which determines the replacement
    product.
  evidence:
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Routine coagulation screening tests are normal and diagnosis relies on quantitative FXIII activity assays with or without antigenic phenotyping and, when indicated, inhibitor testing and molecular confirmation."
    explanation: Diagnostic sequence.
  - reference: PMID:24286209
    reference_title: "Severe congenital factor XIII deficiency caused by novel W187X and G273V mutations in the F13A gene; diagnosis and classification according to the ISTH/SSC guidelines."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four immunological assays detected essentially no FXIII protein, FXIII-A antigen, and A2 B2 antigen, but normal FXIII-B antigen. Accordingly, he was diagnosed as a 'severe' FXIII-A deficiency case."
    explanation: >-
      The subunit antigen panel doing the discrimination this entry depends
      on, worked through under the ISTH/SSC scheme. INDIRECT because the
      patient is the mirror image, an A-subunit case: normal FXIII-B antigen
      is what ruled B-subunit deficiency out. The same panel with the opposite
      result is what rules it in.
animal_models:
- name: FXIII-B knockout mouse (F13b-/-)
  species: Mouse
  genotype: F13b homozygous targeted disruption
  publication: PMID:18224415
  description: >-
    Gene-targeted mice lacking FXIII-B are viable and fertile, have prolonged
    bleeding times, and show markedly reduced but detectable plasma
    cross-linking activity. Infusing recombinant human FXIII-B raises their
    plasma FXIII-A. Older male knockouts develop mild cardiac fibrosis with
    haemosiderin deposits, without the fatal cardiac haemorrhage seen in
    FXIII-A knockout males.
  modeled_mechanisms:
  - target: Accelerated Plasma Clearance of FXIII-A
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Low plasma FXIII-A that is corrected by restoring FXIII-B, reproducing
      the secondary A-subunit deficiency.
    evidence:
    - reference: PMID:18224415
      reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When rFXIII-B was injected into FXIII-B-deficient mice, FXIII-A levels, fibrin crosslinking, and amine-incorporation activities increased in their plasma, indicating that FXIII-B assisted the maintenance of FXIII-A levels in the circulation."
      explanation: Rescue of plasma FXIII-A by FXIII-B infusion.
    readouts:
    - name: Plasma FXIII-A after recombinant FXIII-B infusion
      target: Accelerated Plasma Clearance of FXIII-A
      direction: RESTORED
      interpretation: Restoring the carrier raises plasma FXIII-A.
      evidence:
      - reference: PMID:18224415
        reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "When rFXIII-B was injected into FXIII-B-deficient mice, FXIII-A levels, fibrin crosslinking, and amine-incorporation activities increased in their plasma"
        explanation: The rescue measurement.
  - target: Impaired Fibrin Cross-Linking
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reduced plasma cross-linking and prolonged bleeding time.
    limitations: >-
      Bleeding time in mice is a tail-transection measure and does not map
      directly onto the provoked mucosal and soft-tissue bleeding reported in
      patients.
    evidence:
    - reference: PMID:18224415
      reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "homozygous mice of either FXIII-A- or FXIII-B-deficiency did have prolonged bleeding times."
      explanation: Bleeding phenotype in knockout mice.
    readouts:
    - name: Plasma fibrin cross-linking
      target: Impaired Fibrin Cross-Linking
      direction: DECREASED
      interpretation: Reduced, not absent, cross-linking without FXIII-B.
      evidence:
      - reference: PMID:18224415
        reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "thrombin-dependent amine incorporation and fibrin-crosslinking in plasma were undetectable in the FXIII-A-deficient mice and markedly reduced in the FXIII-B-deficient mice"
        explanation: Direct cross-linking measurement.
  - target: Abnormal bleeding
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Aged male knockouts develop mild cardiac fibrosis with haemosiderin
      deposits, which the authors read as delayed repair of small bleeds into
      the myocardium. It is carried as a separate link because it is a tissue
      consequence of bleeding rather than a measurement of cross-linking.
    limitations: >-
      Sex-specific, found only in aged males, and not reported in patients
      with B-subunit deficiency. The corresponding FXIII-A knockout males died
      of intrathoracic haemorrhage, so this is the mild end of a phenotype
      whose severe form belongs to the other subunit. Whether anything
      equivalent occurs in human B-subunit deficiency is unknown.
    evidence:
    - reference: PMID:18278192
      reference_title: Male-specific cardiac pathologies in mice lacking either the A or B subunit of factor XIII.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mild fibrosis together with haemosiderin deposits were only found in the hearts of the sacrificed FXIII-B(-/-) males."
      explanation: >-
        The cardiac finding in FXIII-B knockout males, which is the bleeding
        consequence this link reads out.
    readouts:
    - name: Cardiac fibrosis with haemosiderin deposits in males
      target: Abnormal bleeding
      direction: INCREASED
      interpretation: >-
        A tissue correlate of repeated small haemorrhages, not a cross-linking
        measurement. Not reported in patients.
      evidence:
      - reference: PMID:18278192
        reference_title: Male-specific cardiac pathologies in mice lacking either the A or B subunit of factor XIII.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mild fibrosis together with haemosiderin deposits were only found in the hearts of the sacrificed FXIII-B(-/-) males."
        explanation: The measured readout.
discussions:
- discussion_id: f13b_phenotype_extrapolation_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the risk of intracranial haemorrhage, umbilical stump bleeding,
    impaired wound healing and recurrent pregnancy loss in biallelic F13B
    deficiency specifically?
  rationale: >-
    These are the phenotypes that define severe congenital FXIII deficiency,
    and the cohort data behind every published frequency for them is dominated
    by A-subunit disease, which is about 95% of cases. This entry therefore
    does not carry them, and that omission is a deliberate scoping decision
    rather than an oversight: the reviews describe B-subunit disease as milder
    and as often needing only on-demand therapy, so importing A-subunit
    frequencies would assert a risk profile nobody has measured in this
    disease. Recorded here so that a later curator does not read the absence
    as an accident and fill it from the A-subunit literature. Closing it needs
    a B-subunit-specific case series, which with roughly eleven reported
    patients does not yet exist.
  attaches_to:
  - phenotypes#
  evidence:
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with severe FXIII-B deficiency present with a milder phenotype."
    explanation: >-
      The basis for not importing the A-subunit phenotype set: the one
      statement the reviews do make about B-subunit severity is that it is
      milder, which is not a frequency for any specific phenotype.
differential_diagnoses:
- name: Factor XIII A subunit deficiency
  description: >-
    The far commoner form, about 95% of congenital FXIII deficiency, caused by
    biallelic F13A1 variants. It is separated by measuring both subunit
    antigens, and the two patterns are not mirror images: in A-subunit
    deficiency FXIII-A antigen is absent while FXIII-B antigen is normal,
    whereas here FXIII-B antigen is absent and FXIII-A antigen is secondarily
    reduced rather than normal. The distinction decides treatment, because
    recombinant FXIII-A2 works for A-subunit disease and not for this one.
    Curated as Factor_XIII_A_Subunit_Deficiency.
- name: Acquired factor XIII deficiency
  description: >-
    Reduced FXIII activity from autoantibodies, or from consumption or reduced
    synthesis in critical illness, surgery or malignancy. Distinguished by age
    and tempo of onset, by a mixing study and inhibitor titration, and by
    F13A1/F13B sequencing being normal. Worth keeping in view in this disease
    specifically, because the one well-described patient developed
    anti-FXIII-B alloantibodies after replacement and so carried an acquired
    inhibitor on top of a congenital deficiency.
references:
- reference: PMID:41583548
  title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
- reference: PMID:39613144
  title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
notes: >-
  Lump/split decision: DISEASE, as a sibling of
  Factor_XIII_A_Subunit_Deficiency rather than a subtype of it. The two share
  the downstream clot-stabilisation defect but differ in the gene, the cell
  that makes the missing protein, the mechanism that lowers plasma FXIII
  (secretion failure plus loss of a carrier, against loss of the catalytic
  subunit), severity, and the replacement product, and the A-subunit entry
  already scopes B-subunit disease out. No GeneReviews chapter covers factor
  XIII deficiency (PubMed genereviews[book] search on "factor XIII" in the
  title returned no chapter).

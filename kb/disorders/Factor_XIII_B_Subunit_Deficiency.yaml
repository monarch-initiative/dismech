name: Factor XIII B Subunit Deficiency
creation_date: "2026-10-15T07:30:00Z"
category: Mendelian
parents:
- Bleeding Disorder
- Coagulation Disorder
- Rare Bleeding Disorder
disease_term:
  preferred_term: Factor XIII B subunit deficiency
  term:
    id: MONDO:0013190
    label: factor XIII, b subunit, deficiency of
synonyms:
- factor XIIIB deficiency
- FXIII-B deficiency
- congenital factor XIII B subunit deficiency
- former type I factor XIII deficiency
description: >-
  Congenital deficiency of the non-catalytic B subunit of coagulation factor
  XIII, caused by biallelic pathogenic variants in F13B. Plasma factor XIII
  circulates as the heterotetramer FXIII-A2B2: the catalytic A subunit is made
  by cells of haematopoietic origin and the B subunit by hepatocytes, and the two
  meet only in plasma. FXIII-B carries and protects FXIII-A, so when the B
  subunit is missing the A subunit is cleared from the circulation quickly and a
  secondary FXIII-A deficiency follows even though F13A1 is intact. FXIII-B also
  binds fibrinogen and speeds thrombin activation of FXIII-A on the clot, so its
  loss slows fibrin cross-linking by a second route.

  The clinical picture is a milder version of A-subunit disease. Plasma FXIII
  activity is low but usually not absent, and bleeding tends to be provoked or
  late-presenting rather than the umbilical-stump and intracranial haemorrhage
  of infancy that defines severe A-subunit deficiency. Routine screening tests
  (prothrombin time, activated partial thromboplastin time, thrombin time) are
  normal, so diagnosis requires a FXIII activity assay followed by separate A and
  B subunit antigen measurement and F13B sequencing. The distinction matters for
  treatment: recombinant FXIII-A2 cannot replace the missing carrier and is not
  appropriate, whereas plasma-derived concentrate supplies both subunits. Severe
  B-subunit deficiency is much rarer than A-subunit deficiency; heterozygous F13B
  variants are commoner and cause mild or no bleeding.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population prevalence estimate exists for severe FXIII-B deficiency. It
    is a minority of congenital FXIII deficiency, which itself affects about one
    in two million people, and A-subunit deficiency accounts for about 95% of
    that total. In 2013 the authors of the alloantibody case report counted ten
    previously reported cases of congenital FXIII-B deficiency; the source does
    not qualify those ten by severity, so neither does this record.
  evidence:
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital FXIII-A deficiency is a rare bleeding disorder, and congenital FXIII-B deficiency is even rarer."
    explanation: States the relative rarity of B-subunit deficiency.
  - reference: PMID:20331752
    reference_title: "Mutations affecting disulphide bonds contribute to a fairly common prevalence of F13B gene defects: results of a genetic study in 14 families with factor XIII B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Severe factor XIII (FXIII) deficiency is a rare autosomal recessive coagulation disorder affecting one in two million individuals."
    explanation: >-
      Frequency of severe congenital FXIII deficiency as a whole, of which
      B-subunit deficiency is a small part. Cited for the denominator only.
  - reference: PMID:41583548
    reference_title: "Factor XIII Deficiency: A Review of Biology, Testing, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Deficiency of the FXIII-A subunit is responsible for the majority (~95%) of cases of congenital FXIII deficiency"
    explanation: >-
      The 95% share quoted in this record's notes, which is what makes
      B-subunit deficiency the small remainder.
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "none of the remaining 10 reported cases of congenital FXIII-B deficiency developed alloantibodies"
    explanation: >-
      The ten previously reported cases, counted in 2013. Quoted because it is
      the only published count, and note the sentence attaches no severity
      qualifier to them.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Severe deficiency requires two F13B pathogenic alleles, homozygous or
    compound heterozygous. Heterozygous F13B variants are found more often than
    biallelic ones and are associated with mild FXIII deficiency; the reviews
    describe such heterozygotes as generally asymptomatic. Whether their
    bleeding is specifically provoked by trauma or surgery is stated for
    heterozygous FXIII deficiency in general rather than for F13B
    heterozygotes, so it is not asserted here.
  evidence:
  - reference: PMID:8639893
    reference_title: "Type I factor XIII deficiency is caused by a genetic defect of its b subunit: insertion of triplet AAC in exon III leads to premature termination in the second Sushi domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Restriction digestion of amplified DNAs confirmed that the proband and her sister were homozygotes, and their family members were heterozygotes of this mutant allele."
    explanation: >-
      Affected sisters homozygous for the F13B allele with heterozygous
      relatives, the segregation pattern of recessive inheritance.
  - reference: PMID:26247044
    reference_title: Structural and functional influences of coagulation factor XIII subunit B heterozygous missense mutants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Defects in the F13B gene (Factor XIIIB subunit) occur more frequently in mild FXIII deficiency patients than in severe FXIII deficiency."
    explanation: >-
      Supports the statement that F13B variants are mostly found as
      heterozygous, mild deficiency rather than as severe biallelic disease.
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with severe FXIII-B deficiency may only require on-demand therapy, while heterozygotes are generally asymptomatic."
    explanation: >-
      The heterozygote statement this description now makes, in the review's
      own words. It says asymptomatic, not provoked-bleeding-only, which is
      why the description was narrowed to match.
pathophysiology:
- name: Biallelic F13B Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous pathogenic variants in F13B, which
    encodes the B subunit of factor XIII, a protein built from ten sushi
    domains held together by disulphide bonds. Reported variants include
    premature-termination alleles (the AAC insertion at Tyr-80 that is a
    founder allele in Italian families, and a splice-boundary deletion that is a
    founder allele in Japanese families), frameshifts, and missense variants
    that remove or sit next to a structural disulphide bond. Most of them reduce
    the amount of FXIII-B that leaves the cell rather than producing a secreted
    but inactive protein.
  genes:
  - preferred_term: F13B
    term:
      id: hgnc:3534
      label: F13B
  molecular_functions:
  - preferred_term: fibrinogen binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0070051
      label: fibrinogen binding
  evidence:
  - reference: PMID:8639893
    reference_title: "Type I factor XIII deficiency is caused by a genetic defect of its b subunit: insertion of triplet AAC in exon III leads to premature termination in the second Sushi domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequence analysis showed that a nucleotide triplet (AAC) was inserted within the codon for Tyr-80 in exon III of the gene for a female proband's b subunit, resulting in the creation of a stop codon."
    explanation: First F13B lesion shown to cause the disease.
  - reference: PMID:20331752
    reference_title: "Mutations affecting disulphide bonds contribute to a fairly common prevalence of F13B gene defects: results of a genetic study in 14 families with factor XIII B deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the missense mutations (Cys5Arg, Cys316Phe) eliminated disulphide bonds (Cys5-Cys56, Cys316-Cys358)."
    explanation: >-
      Shows that missense variants removing a structural disulphide bond are a
      recurring class of F13B lesion.
  - reference: PMID:20880254
    reference_title: "Factor XIII: novel structural and functional aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FXIII-B is a glycoprotein consisting of 10 repetitive sushi domains each held together by two internal disulfide bonds."
    explanation: >-
      The domain architecture this node describes, and the reason a single
      disulphide-disrupting substitution is enough to destabilise the
      protein.
  downstream:
  - target: Impaired FXIII-B Secretion from Hepatocytes
    causal_link_type: DIRECT
    description: >-
      Truncated and disulphide-disrupted FXIII-B is retained in the secretory
      pathway instead of being released.
    evidence:
    - reference: PMID:11313256
      reference_title: Truncated mutant B subunit for factor XIII causes its deficiency due to impaired intracellular transportation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pulse-chase experiments showed that a resultant truncated XIIIB remained inside the cells and could not be secreted into the culture medium."
      explanation: >-
        Expression of a patient frameshift allele shows the truncated protein
        is made but not secreted.
    - reference: PMID:31013569
      reference_title: Disruption of Structural Disulfides of Coagulation FXIII-B Subunit; Functional Implications for a Rare Bleeding Disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All 20 FXIII-B were found to be important for the secretion and stability of the protein since ablation of any of these led to a secretion deficit."
      explanation: >-
        Removing any one of the 20 structural disulphide bonds reduced
        secretion, which links the disulphide-disrupting missense class to the
        secretion defect.
- name: Impaired FXIII-B Secretion from Hepatocytes
  biological_scale: CELLULAR
  description: >-
    FXIII-B is synthesised by hepatocytes. Mutant FXIII-B is held in the
    endoplasmic reticulum or fails to reach the Golgi apparatus, so little or
    none is released into plasma. Secretion deficits were found for every
    patient-derived missense variant tested in one cell expression study,
    though a follow-up study found that several of those variants act mainly by
    reducing protein stability or binding to FXIII-A.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence:
  - reference: PMID:37883802
    reference_title: Reciprocal stabilization of coagulation factor XIII-A and -B subunits is a determinant of plasma FXIII concentration.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma FXIII is composed of A and B subunit dimers synthesized in cells of hematopoietic origin and hepatocytes, respectively."
    explanation: Identifies the hepatocyte as the cell that makes FXIII-B.
    quote_role: BACKGROUND
  - reference: PMID:23913518
    reference_title: "In vitro secretion deficits are common among human coagulation factor XIII subunit B missense mutants: correlations with patient phenotypes and molecular models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro expression of FXIII B subunit (FXIIIB) missense variants in HEK293T cells revealed impaired secretion for all seven variants studied."
    explanation: Secretion defect is shared by all tested patient missense variants.
  - reference: PMID:11313256
    reference_title: Truncated mutant B subunit for factor XIII causes its deficiency due to impaired intracellular transportation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "immunocytochemical examinations by epifluorescence, confocal, and electron microscopes indicated impaired intracellular transportation of the truncated XIIIB from the endoplasmic reticulum to the Golgi apparatus."
    explanation: Places the block at the endoplasmic reticulum to Golgi step.
  - reference: PMID:26247044
    reference_title: Structural and functional influences of coagulation factor XIII subunit B heterozygous missense mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Cys5Arg mutation was the only mutation to show a direct secretion-based defect since the mutated protein was observed to accumulate in the endoplasmic reticulum."
    explanation: >-
      Refines the earlier result: in this follow-up only Cys5Arg was retained
      in the endoplasmic reticulum, while other variants acted mainly through
      reduced antigenic stability or reduced binding to FXIII-A.
  downstream:
  - target: Absent Circulating FXIII-B Carrier Subunit
    causal_link_type: DIRECT
    description: Little or no FXIII-B reaches plasma.
- name: Absent Circulating FXIII-B Carrier Subunit
  biological_scale: ORGANISM
  description: >-
    Plasma FXIII-B is undetectable or severely reduced, so FXIII-A2 cannot
    form the stable A2B2 heterotetramer.
  evidence:
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 74, ELISA and western blotting assay unexpectedly revealed complete absence of FXIII-B in the patient's plasma."
    explanation: Direct measurement of absent plasma FXIII-B in a homozygous patient.
  - reference: PMID:8639893
    reference_title: "Type I factor XIII deficiency is caused by a genetic defect of its b subunit: insertion of triplet AAC in exon III leads to premature termination in the second Sushi domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there were normal amounts of the mutant mRNA, but no b subunit was detected in these patients."
    explanation: Absent plasma FXIII-B despite normal F13B transcript levels.
  downstream:
  - target: Accelerated Plasma Clearance of FXIII-A
    causal_link_type: DIRECT
    description: >-
      Without its carrier, FXIII-A2 is removed from the circulation faster,
      producing a secondary A-subunit deficiency.
    evidence:
    - reference: PMID:23407795
      reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FXIII-B prevents the fast clearance of FXIII-A from the circulation."
      explanation: States the carrier function whose loss drives this edge.
      quote_role: BACKGROUND
    - reference: PMID:18224415
      reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When rFXIII-B was injected into FXIII-B-deficient mice, FXIII-A levels, fibrin crosslinking, and amine-incorporation activities increased in their plasma, indicating that FXIII-B assisted the maintenance of FXIII-A levels in the circulation."
      explanation: >-
        Restoring FXIII-B in knockout mice raised plasma FXIII-A, the
        rescue experiment that shows the edge is causal.
  - target: Impaired Thrombin Activation of FXIII-A on Fibrin
    causal_link_type: DIRECT
    description: >-
      FXIII-B also links the FXIII zymogen to fibrinogen, so its absence slows
      activation of whatever FXIII-A remains.
    evidence:
    - reference: PMID:25809477
      reference_title: The Non-catalytic B Subunit of Coagulation Factor XIII Accelerates Fibrin Cross-linking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Depletion of FXIII-B from normal plasma supplemented with a physiological level of recombinant FXIII-A resulted in delayed fibrin cross-linking, reduced incorporation of FXIII-A into fibrin clots, and impaired activation peptide cleavage by thrombin"
      explanation: >-
        With FXIII-A held at a normal level, removing FXIII-B alone still slowed
        activation and cross-linking, which separates this edge from the
        clearance edge.
- name: Accelerated Plasma Clearance of FXIII-A
  biological_scale: ORGANISM
  description: >-
    Secondary FXIII-A deficiency. F13A1 and platelet FXIII-A are normal, but
    plasma FXIII-A falls because the uncomplexed A2 dimer has a shorter
    circulating life than the A2B2 heterotetramer. The subunits stabilise each
    other: free FXIII-B2 is also cleared faster than complexed FXIII-B2.
  evidence:
  - reference: PMID:8639893
    reference_title: "Type I factor XIII deficiency is caused by a genetic defect of its b subunit: insertion of triplet AAC in exon III leads to premature termination in the second Sushi domain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The a subunit deficiency of these patients must be a secondary to the b subunit deficiency, as their gene for the a subunit was intact, and the a subunit in their platelets was present within normal levels."
    explanation: Establishes that the low plasma FXIII-A is secondary.
  - reference: PMID:37883802
    reference_title: Reciprocal stabilization of coagulation factor XIII-A and -B subunits is a determinant of plasma FXIII concentration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "comparison of free FXIII-B2 vs FXIII-A2-complexed FXIII-B2 (FXIII-A2B2) infused into mice revealed faster clearance of free FXIII-B2."
    explanation: >-
      The reciprocal half of the relationship, measured in mice: each subunit
      survives longer in plasma when complexed with the other.
  downstream:
  - target: Reduced Plasma FXIII Transglutaminase Activity
    causal_link_type: DIRECT
    description: Less FXIII-A in plasma means less activatable transglutaminase.
- name: Impaired Thrombin Activation of FXIII-A on Fibrin
  biological_scale: MOLECULAR
  description: >-
    FXIII-B binds fibrinogen and brings proenzyme FXIII, fibrinogen and
    thrombin together. Without it, thrombin cleavage of the FXIII-A activation
    peptide and FXIII-A incorporation into the clot are both slower.
  biological_processes:
  - preferred_term: blood coagulation, fibrin clot formation
    modifier: DECREASED
    term:
      id: GO:0072378
      label: blood coagulation, fibrin clot formation
  evidence:
  - reference: PMID:25809477
    reference_title: The Non-catalytic B Subunit of Coagulation Factor XIII Accelerates Fibrin Cross-linking.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoprecipitation with an anti-fibrinogen antibody revealed an interaction between the FXIII heterotetramer and fibrinogen mediated by FXIII-B and not FXIII-A."
    explanation: FXIII-B, not FXIII-A, binds fibrinogen.
  - reference: PMID:20880254
    reference_title: "Factor XIII: novel structural and functional aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the circulation pFXIII is bound to the fibrinogen γ'-chain through its B subunit."
    explanation: >-
      Independent statement that the B subunit is what tethers the zymogen to
      fibrinogen, which is the function lost here.
  - reference: PMID:20880254
    reference_title: "Factor XIII: novel structural and functional aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the process of pFXIII activation first thrombin cleaves off the activation peptide from FXIII-A, then in the presence of Ca(2+) FXIII-B dissociates and FXIII-A becomes transformed into an active transglutaminase (FXIIIa). The activation is highly accelerated by the presence of fibrin(ogen)."
    explanation: >-
      The normal activation sequence, which is what makes the loss of the
      fibrinogen tether a rate problem: activation is accelerated by
      fibrin(ogen), and the B subunit is what brings the zymogen there.
  downstream:
  - target: Impaired Fibrin Cross-Linking
    causal_link_type: DIRECT
    description: Slower activation delays cross-linking of the fibrin clot.
- name: Reduced Plasma FXIII Transglutaminase Activity
  biological_scale: ORGANISM
  description: >-
    Plasma FXIII activity is reduced, to about ten percent of normal in the
    best-described severe case, rather than being absent as in severe
    A-subunit deficiency. The residual activity is one likely reason the
    bleeding phenotype is milder.
  molecular_functions:
  - preferred_term: plasma transglutaminase activity
    modifier: DECREASED
    term:
      id: GO:0003810
      label: protein-glutamine gamma-glutamyltransferase activity
  evidence:
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "his FXIII activity was as low as 10% of the normal."
    explanation: Plasma FXIII activity in a homozygous patient.
  downstream:
  - target: Impaired Fibrin Cross-Linking
    causal_link_type: DIRECT
    description: Less transglutaminase activity means less fibrin cross-linking.
  - target: Impaired Alpha-2-Antiplasmin Ligation to Fibrin
    causal_link_type: DIRECT
    description: >-
      The same loss of transglutaminase activity also leaves less
      alpha-2-antiplasmin covalently ligated into the clot, which is a
      separate substrate from the fibrin chains themselves.
- name: Impaired Alpha-2-Antiplasmin Ligation to Fibrin
  biological_scale: MOLECULAR
  description: >-
    Alpha-2-antiplasmin is the other principal haemostatic substrate of
    activated FXIII, and cross-linking it into fibrin is the main way a clot
    resists plasmin. With less transglutaminase activity, less inhibitor is
    ligated. This arm is modelled because it follows from the reduced FXIIIa
    activity this entry already asserts, not from anything A-subunit specific;
    it has not been measured in a B-subunit-deficient patient.
  biological_processes:
  - preferred_term: negative regulation of fibrinolysis
    modifier: DECREASED
    term:
      id: GO:0051918
      label: negative regulation of fibrinolysis
  evidence:
  - reference: PMID:25652913
    reference_title: "Coagulation factor XIII: a multifunctional transglutaminase with clinical potential in a range of conditions."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These include antifibrinolytic proteins, with cross-linking of α2-antiplasmin to fibrin, and potentially fibrinogen, being the principal mechanism(s) whereby plasmin-mediated clot degradation is minimised"
    explanation: >-
      Establishes that alpha-2-antiplasmin cross-linking is the principal
      antifibrinolytic mechanism of FXIII, which is what is lost when
      transglutaminase activity falls.
  downstream:
  - target: Accelerated Fibrinolysis of the Formed Clot
    causal_link_type: DIRECT
    description: >-
      A clot carrying less covalently bound inhibitor is lysed sooner.
- name: Accelerated Fibrinolysis of the Formed Clot
  biological_scale: ORGANISM
  description: >-
    Premature plasmin-mediated dissolution of a clot that formed normally.
    This is the second route to the bleeding phenotype and is mechanistically
    distinct from the mechanically weak clot: here the clot is lysed too soon
    rather than being too fragile. It is an inference from the substrate
    biology rather than a measurement in this disease, and is recorded as such.
  biological_processes:
  - preferred_term: fibrinolysis
    modifier: INCREASED
    term:
      id: GO:0042730
      label: fibrinolysis
  evidence:
  - reference: PMID:25652913
    reference_title: "Coagulation factor XIII: a multifunctional transglutaminase with clinical potential in a range of conditions."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "being the principal mechanism(s) whereby plasmin-mediated clot degradation is minimised"
    explanation: >-
      The consequence of losing that cross-linking is more plasmin-mediated
      degradation. INDIRECT because the review states the normal mechanism and
      the inference to accelerated lysis in B-subunit deficiency is ours; no
      fibrinolysis measurement in such a patient was found.
  downstream:
  - target: Abnormal bleeding
    causal_link_type: DIRECT
    description: Premature lysis of an adequate clot produces delayed bleeding.
- name: Impaired Fibrin Cross-Linking
  biological_scale: MOLECULAR
  description: >-
    Fibrin gamma- and alpha-chain isopeptide cross-linking is slower and less
    complete, giving a mechanically weaker clot. Both upstream routes, loss of
    FXIII-A by clearance and slower activation of what remains, converge here.
  biological_processes:
  - preferred_term: fibrin gamma- and alpha-chain isopeptide cross-linking
    modifier: DECREASED
    term:
      id: GO:0018149
      label: peptide cross-linking
  evidence:
  - reference: PMID:18224415
    reference_title: Administration of factor XIII B subunit increased plasma factor XIII A subunit levels in factor XIII B subunit knock-out mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "thrombin-dependent amine incorporation and fibrin-crosslinking in plasma were undetectable in the FXIII-A-deficient mice and markedly reduced in the FXIII-B-deficient mice"
    explanation: >-
      Cross-linking is reduced but not abolished without FXIII-B, in contrast
      with FXIII-A loss.
  - reference: PMID:25809477
    reference_title: The Non-catalytic B Subunit of Coagulation Factor XIII Accelerates Fibrin Cross-linking.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "congenital or acquired FXIII-B deficiency may result in increased bleeding tendency through impaired fibrin stabilization due to decreased FXIII-A activation by thrombin and secondary FXIII-A deficiency arising from enhanced circulatory clearance."
    explanation: >-
      The authors' conclusion on how the two routes converge on fibrin
      stabilisation and bleeding, drawn from plasma experiments and stated as a
      proposal ("may result").
  downstream:
  - target: Abnormal bleeding
    causal_link_type: DIRECT
    description: An unstable clot gives a bleeding tendency.
  - target: Intramuscular hematoma
    causal_link_type: DIRECT
    description: Deep soft-tissue bleeding is the reported spontaneous bleed.
  - target: Gingival bleeding
    causal_link_type: DIRECT
    description: Mucosal bleeding is reported in the same patient.
phenotypes:

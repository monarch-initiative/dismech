  category: Hematological
  description: >-
    A bleeding tendency that is milder than in A-subunit deficiency and can
    be brought out by an acquired condition. Some individuals come to
    attention only in adulthood.
  phenotype_term:
    preferred_term: mild bleeding tendency
    term:
      id: HP:0001892
      label: Abnormal bleeding
  evidence:
  - reference: PMID:39613144
    reference_title: "Factor XIII Deficiency: Laboratory, Molecular, and Clinical Aspects."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "patients with severe FXIII-B deficiency present with a milder phenotype."
    explanation: >-
      Contrasts B-subunit with A-subunit disease severity. OTHER to match how
      this entry grades every other quote from this review: the sentence is
      the authors' synthesis of the clinical literature, not a study they ran.
  - reference: PMID:23407795
    reference_title: Alloantibodies against the B subunit of plasma factor XIII developed in its congenital deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An originally mild bleeding phenotype of severe congenital FXIII-B deficiency can be exaggerated by additional acquired conditions."
    explanation: Mild baseline phenotype that can worsen with acquired factors.
- name: Intramuscular hematoma
  category: Hematological
  description: Spontaneous intramuscular haematoma, reported in an older adult with severe deficiency.
  phenotype_term:

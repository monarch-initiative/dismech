name: Bart-Pumphrey Syndrome
creation_date: "2026-09-28T12:50:16Z"
description: >-
  Bart-Pumphrey syndrome is a rare autosomal dominant genodermatosis characterized by knuckle pads, leukonychia,
  palmoplantar keratoderma and hearing loss, usually sensorineural. Features vary within families; neither all
  four features nor a fixed hearing severity is obligatory. Heterozygous GJB2 missense variants p.Asn54Lys and
  p.Gly59Ser are reported, with overlap between Bart-Pumphrey and other dominant connexin 26 skin-hearing disorders.
  Experimental p.Asn54Lys shows trafficking defects and dominant or transdominant inhibition of connexin channel
  function, with effects that depend on the cell system and coexpressed connexin. The steps connecting these cell
  defects to patient skin and cochlear disease remain incompletely established.
category: Mendelian
disease_term:
  preferred_term: Bart-Pumphrey syndrome
  term:
    id: MONDO:0007866
    label: Bart-Pumphrey syndrome
synonyms:
- knuckle pads, leukonychia, and sensorineural deafness
- knuckle pads-leukonychia-sensorineural deafness-palmoplantar keratoderma syndrome
- knuckle pads-leukonychia-sensorineural deafness-palmoplantar hyperkeratosis syndrome
parents:
- Hereditary Palmoplantar Keratoderma
- Connexin Disorders
notes: >-
  The combination of skin, nail and auditory findings is more informative than any individual feature. Several
  clinically diagnosed families lack molecular confirmation, so their variable features should not be treated
  as allele-specific effects or used to estimate penetrance. Bart-Pumphrey syndrome is distinct from Bart syndrome
  associated with congenital skin absence and epidermolysis bullosa.

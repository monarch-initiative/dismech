pathophysiology:
- name: Heterozygous GJB2 First Extracellular Loop Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a heterozygous missense substitution in the
    evolutionarily conserved first extracellular loop of connexin 26, the
    domain that mediates hemichannel docking and voltage gating. p.Asn54Lys
    segregated with BPS in the family in which the gene was identified;
    p.Gly59Ser has been reported in BPS and in classic Vohwinkel syndrome.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  genetic_context:
    genes:
    - preferred_term: GJB2
      term:
        id: hgnc:4284
        label: GJB2
    variant_type: single nucleotide variant
    allele_type: missense
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      The dominant-negative (transdominant) category rests on p.Asn54Lys
      expressed in HeLa cells and rat epidermal keratinocytes; p.Gly59Ser has
      not been functionally characterized in a BPS context.
  evidence:
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a novel GJB2 mutation N54K segregating in a family with BPS, which was not detected in 110 control individuals of Northern European ancestry."
    explanation: Segregation of the heterozygous N54K variant with BPS in the index family.
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This non-conservative missense mutation lies within a cluster of pathogenic GJB2 mutations affecting the evolutionary conserved first extracellular loop of Cx26 important for docking of connexin hemichannels and voltage gating."
    explanation: Places the BPS allele in the first extracellular loop and names the domain's function.
  downstream:
  - target: Connexin 26 Intracellular Retention
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28428247
      reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The N54K mutant was retained primarily within intracellular compartments and displayed dominant or transdominant properties on wild-type Cx26 and coexpressed Cx30 and Cx43."
      explanation: Expression of the BPS allele in gap junction-deficient HeLa cells shows the mutant protein fails to reach the plasma membrane.
  - target: Leukonychia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The nail phenotype segregates with the GJB2 lesion, but the step from
      connexin dysfunction to abnormal nail plate keratinization has not been
      studied.
    evidence:
    - reference: PMID:15482471
      reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results emphasize that pleiotropic GJB2 mutations are responsible for at least 5 overlapping dermatological disorders associated with syndromic hearing loss and cover a wide range of severity and organ involvement."
      explanation: Attributes the multi-organ BPS phenotype, including the nail finding, to the GJB2 lesion without resolving the intermediate steps.
- name: Connexin 26 Intracellular Retention
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The p.Asn54Lys connexin 26 is retained in an endoplasmic reticulum-like
    intracellular compartment and forms few gap junction plaques, so channels
    capable of dye transfer are essentially absent in cells expressing the
    mutant alone. In lesional palmar and knuckle skin of the index BPS family,
    connexin 26 immunostaining was weak or absent.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  molecular_functions:
  - preferred_term: gap junction channel activity
    modifier: DECREASED
    term:
      id: GO:0005243
      label: gap junction channel activity
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  cellular_components:
  - preferred_term: connexin complex
    term:
      id: GO:0005922
      label: connexin complex
  evidence:
  - reference: PMID:28428247
    reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cells expressing either the N54K or S183F mutants were essentially unable to establish gap junction channels capable of dye transfer"
    explanation: Direct functional readout in HeLa cells expressing the BPS mutant alone.
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunostaining of Cx26 in lesional palmar and knuckle skin was weak or absent, although its adnexal expression appeared normal and the punctate membrane staining of Cx26 and other epidermal connexins was not altered."
    explanation: Patient skin biopsy shows reduced connexin 26 in lesional epidermis, consistent with the cell-culture retention phenotype.
  - reference: PMID:32300592
    reference_title: "GJB2 Mutations Linked to Hearing Loss Exhibit Differential Trafficking and Functional Defects as Revealed in Cochlear-Relevant Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The dominant syndromic Cx26 mutant N54K had trafficking defects and did not fully prevent wild-type Cx26 gap junction plaque formation but surprisingly formed gap junctions when co-expressed with Cx30."
    explanation: Replicates the trafficking defect in a second, cochlear-derived cell line from the same laboratory, while showing the defect is partly rescued by Cx30.
  downstream:
  - target: Transdominant Inhibition of Co-expressed Epidermal Connexins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28428247
      reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Interestingly, we found that the N54K mutant impaired Cx30 trafficking and dye transfer, suggesting that epidermal Cx30 compensation may act to overcome a transdominant hindrance of Cx26:Cx30 heteromeric gap junction formation between keratinocytes."
      explanation: The retained mutant drags co-expressed Cx30 with it, linking retention to the transdominant effect.
  - target: Cochlear Gap Junction Network Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from cochlear-derived cell culture only; no BPS inner ear
      tissue or animal model has been examined.
    evidence:
    - reference: PMID:32300592
      reference_title: "GJB2 Mutations Linked to Hearing Loss Exhibit Differential Trafficking and Functional Defects as Revealed in Cochlear-Relevant Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We conclude from our studies in cochlear-relevant cells that the selected Cx26 mutants likely evoke hearing loss via three unique connexin defects that are independent of Cx43 status."
      explanation: The authors extend the N54K trafficking defect in HEI-OC1 cells to a hearing-loss mechanism, as an inference.
- name: Transdominant Inhibition of Co-expressed Epidermal Connexins
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    The p.Asn54Lys mutant increases intracellular retention of co-expressed
    wild-type connexin 26, connexin 30 and connexin 43 and reduces their dye
    coupling. In the index family's skin, connexin 30 staining spread through
    the spinous layers, read as compensatory overexpression.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:28428247
    reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N54K mutant exhibits transdominant inhibition of endogenous Cx43 in REKs."
    explanation: Transdominant effect on the endogenous keratinocyte connexin in rat epidermal keratinocytes.
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the widespread immunostaining of Cx30 throughout the spinous cell layers suggested a compensatory overexpression."
    explanation: Patient-skin observation of altered Cx30 distribution, the in vivo counterpart of the Cx30 interaction seen in culture.
  - reference: PMID:22796187
    reference_title: "The role of connexins in ear and skin physiology - functional insights from disease-associated mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Consistent with the clustering of the different skin syndromes into similar groupings, Cx26 mutations which cause VS-BPS-PPK syndromes show significant overlap, and all have been found to have a transdominant effect on other connexins expressed in the epidermis."
    explanation: Review placing BPS alleles with the Vohwinkel and PPK-deafness alleles that act transdominantly in epidermis.
  downstream:
  - target: Keratinocyte Gap Junctional Communication Deficit
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28428247
      reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that only REKs expressing the N54K mutant had reduced dye transfer."
      explanation: Of the mutants tested, only the BPS allele reduced coupling in keratinocytes carrying endogenous Cx43.

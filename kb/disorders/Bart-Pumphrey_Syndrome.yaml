- name: Cochlear Gap Junction Network Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Disrupted connexin signaling among cochlear supporting cells is a proposed explanation for BPS hearing loss.
    General connexin studies support candidate roles in potassium buffering/recycling, nutrient transfer and intercellular
    signaling, without establishing which is causal for BPS. N54K trafficking was studied in immortalized HEI-OC1
    cells, not mature supporting cells or patient cochlear tissue. Cx30 restored plaque localization there without
    a demonstrated N54K functional rescue. BPS-specific potassium dysregulation, oxidative injury and hair-cell
    death have not been demonstrated by these studies.

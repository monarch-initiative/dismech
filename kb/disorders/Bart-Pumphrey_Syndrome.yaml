    explanation: First-line symptomatic keratoderma care for hereditary PPK generally; applied to BPS by inference from the class.
  - reference: PMID:31334055
    reference_title: "Hereditary Palmoplantar Keratoderma: A Practical Approach to the Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

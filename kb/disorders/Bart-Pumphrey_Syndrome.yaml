diagnosis:
- name: Clinical dermatologic and audiologic assessment
  diagnosis_term:
    preferred_term: audiometric testing
    term:
      id: NCIT:C38036
      label: Audiometric Test
  description: >-
    Diagnosis rests on recognizing the combination of knuckle pads,
    leukonychia, palmoplantar keratoderma and sensorineural hearing loss in the
    patient or relatives, with audiometry to document the hearing loss. Because
    individual features can be mild or absent, family members should be
    examined.
  evidence:
  - reference: PMID:22421650
    reference_title: "A family of Bart-Pumphrey syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We want to emphasize that dermatogists must be alert during the evaluation of these findings because some findings of this disorder may be vague or absent."
    explanation: Warns that incomplete presentations make clinical recognition difficult.
- name: GJB2 molecular testing
  diagnosis_term:
    preferred_term: GJB2 sequencing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequencing of GJB2 confirms the diagnosis; a first extracellular loop
    missense allele such as p.Asn54Lys or p.Gly59Ser is expected.
  evidence:
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a novel GJB2 mutation N54K segregating in a family with BPS, which was not detected in 110 control individuals of Northern European ancestry."
    explanation: GJB2 sequencing identified the causal allele in the index family.
- name: Differential diagnosis among connexin keratoderma-deafness disorders
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    BPS overlaps clinically with classic Vohwinkel syndrome and
    keratitis-ichthyosis-deafness syndrome, both also caused by dominant GJB2
    variants.
  evidence:
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features partially overlap with Vohwinkel syndrome and Keratitis-Ichthyosis-Deafness syndrome, both disorders caused by dominant mutations in the GJB2 gene encoding the gap junction protein connexin-26, suggesting an etiological relationship."
    explanation: Names the two principal allelic differential diagnoses.
treatments:
- name: Keratolytic and systemic retinoid therapy for keratoderma
  description: >-
    Symptomatic management of the keratoderma with mechanical debridement and
    topical keratolytics, and systemic retinoids such as acitretin for more
    severe hyperkeratosis. The supporting source addresses hereditary
    palmoplantar keratodermas as a class; no BPS-specific treatment outcome
    with a quotable abstract or full text was found.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

pathophysiology:
- name: Heterozygous GJB2 First Extracellular Loop Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion is a heterozygous missense substitution in the
    evolutionarily conserved first extracellular loop of connexin 26, the
    domain that mediates hemichannel docking and voltage gating. p.Asn54Lys
    segregated with BPS in the family in which the gene was identified;
    p.Gly59Ser has been reported in BPS and in classic Vohwinkel syndrome.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  genetic_context:
    genes:
    - preferred_term: GJB2
      term:
        id: hgnc:4284
        label: GJB2
    variant_type: single nucleotide variant
    allele_type: missense
    zygosity: HETEROZYGOUS
    notes: >-
      The N54K allele has dominant-negative effects on wild-type Cx26 and transdominant effects on other connexins
      in selected cell systems. G59S channel and trafficking effects are unresolved; N54K results do not establish
      a uniform functional category for all BPS alleles.
  evidence:
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here a novel GJB2 mutation N54K segregating in a family with BPS, which was not detected in 110 control individuals of Northern European ancestry."
    explanation: Segregation of the heterozygous N54K variant with BPS in the index family.
  - reference: PMID:15482471
    reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This non-conservative missense mutation lies within a cluster of pathogenic GJB2 mutations affecting the evolutionary conserved first extracellular loop of Cx26 important for docking of connexin hemichannels and voltage gating."
    explanation: Places the BPS allele in the first extracellular loop and names the domain's function.
  downstream:
  - target: Connexin 26 Intracellular Retention
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28428247
      reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The N54K mutant was retained primarily within intracellular compartments and displayed dominant or transdominant properties on wild-type Cx26 and coexpressed Cx30 and Cx43."
      explanation: N54K is predominantly intracellular in HeLa cells; some membrane plaques can form depending on the coexpressed connexin and cell system.
    description: >-
      Demonstrated for p.Asn54Lys in transfected cell systems; not established for every BPS-associated allele.
  - target: Leukonychia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The nail phenotype segregates with the GJB2 lesion, but the step from
      connexin dysfunction to abnormal nail plate keratinization has not been
      studied.
    evidence:
    - reference: PMID:15482471
      reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
      supports: SUPPORT

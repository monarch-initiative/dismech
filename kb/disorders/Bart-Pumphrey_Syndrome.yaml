name: Bart-Pumphrey Syndrome
creation_date: "2026-09-28T12:50:16Z"
description: >-
  Bart-Pumphrey syndrome is a rare autosomal dominant genodermatosis combining
  knuckle pads, leukonychia, palmoplantar keratoderma and sensorineural hearing
  loss, with considerable variability in which features an affected relative
  shows. It is one of the dominant connexin 26 (GJB2) disorders of skin and
  hearing: the molecularly confirmed families carry heterozygous missense
  variants in the first extracellular loop of connexin 26 (p.Asn54Lys, and
  p.Gly59Ser, an allele also reported in classic Vohwinkel syndrome). In
  cultured cells the p.Asn54Lys protein is retained intracellularly and acts
  transdominantly on co-expressed connexins, which is the current mechanistic
  explanation for the skin phenotype; the cochlear mechanism has not been
  studied in patient tissue.
category: Mendelian
disease_term:
  preferred_term: Bart-Pumphrey syndrome
  term:
    id: MONDO:0007866
    label: Bart-Pumphrey syndrome
synonyms:
- knuckle pads, leukonychia, and sensorineural deafness
- knuckle pads-leukonychia-sensorineural deafness-palmoplantar keratoderma syndrome
- knuckle pads-leukonychia-sensorineural deafness-palmoplantar hyperkeratosis syndrome
parents:
- Hereditary Palmoplantar Keratoderma
- Connexin Disorders
notes: >-
  No GeneReviews chapter covers Bart-Pumphrey syndrome; the clinical baseline
  here is the primary family reports. The original 1967 description (Bart and
  Pumphrey, PMID:6015974), the G59S case report (PMID:15952212), the 2020 JAMA
  Dermatology image report (PMID:32745176) and the 2023 cholesteatoma report
  (PMID:36331160) have no PubMed abstract and no open full text, so they are not
  quoted as evidence. p.Asn54Lys and p.Gly59Ser are the two alleles reported in
  molecularly confirmed BPS patients in the literature reviewed. Several
  clinically diagnosed BPS families (PMID:8151643, PMID:20418990,
  PMID:22421650) had no reported molecular test.

    explanation: Systemic retinoid benefit across hereditary PPKs; not a BPS-specific outcome.
discussions:
- discussion_id: controversy_bps_gain_vs_transdominant_loss
  prompt: >-
    Do the BPS GJB2 alleles cause skin disease through transdominant loss of
    epidermal gap junction function, or through an alteration or gain of
    connexin 26 function?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Transdominant Inhibition of Co-expressed Epidermal Connexins
  - pathophysiology#Keratinocyte Gap Junctional Communication Deficit
  rationale: >-
    One review argues that because null GJB2 alleles cause deafness without
    skin disease, the syndromic missense alleles must alter or gain function.
    Another groups the Vohwinkel, BPS and PPK-deafness alleles as
    loss-of-function mutants with trafficking defects and transdominant
    effects. The only BPS-allele data (p.Asn54Lys, in HeLa cells and rat
    keratinocytes) show retention and transdominance, with highly variable
    hemichannel dye uptake, so neither reading is excluded for BPS.
  evidence:
  - reference: PMID:19939300
    reference_title: "Connexin-26 mutations in deafness and skin disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since nonsyndromic deafness is predominantly a loss-of-function disorder, it follows that the syndromic mutants must show an alteration, or gain, of function to cause skin disease."
    explanation: States the altered/gain-of-function position for syndromic GJB2 alleles, including BPS.
  - reference: PMID:22796187
    reference_title: "The role of connexins in ear and skin physiology - functional insights from disease-associated mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As summarized in Table I, all of these mutations that have been characterized are loss of function mutations with problems in trafficking, or the formation of functional gap junction channels."
    explanation: States the transdominant loss-of-function position for the Vohwinkel-BPS-PPK allele group.

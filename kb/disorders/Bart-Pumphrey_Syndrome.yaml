- name: Connexin 26 Intracellular Retention
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    N54K connexin 26 is predominantly intracellular, partially colocalizing with an endoplasmic-reticulum marker
    in HeLa cells and forming few plaques. This is cell-context dependent: Cx30 coexpression recruited N54K into
    membrane plaques in HEI-OC1 cochlear-derived cells. That study measured localization, not restoration of N54K
    channel function. Patient skin immunostaining is a separate observation and does not demonstrate intracellular
    retention.

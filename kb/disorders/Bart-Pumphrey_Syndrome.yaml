- name: Isolated or trauma-associated knuckle pads
  description: >-
    Knuckle pads can occur without the syndromic nail, palmoplantar or auditory findings. A careful examination
    distinguishes them from warts and friction-related callosities.
  distinguishing_features:
  - Isolated familial knuckle pads lack the accompanying BPS findings.
  - Trauma-associated pseudo-knuckle pads have a relevant mechanical history.
  evidence:

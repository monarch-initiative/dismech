- name: Cochlear Gap Junction Network Dysfunction
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Connexin 26 gap junctions among cochlear supporting cells are required for
    potassium removal and recycling. Dominant BPS alleles are presumed to impair
    this network, but the only BPS-specific data come from cochlear-derived
    HEI-OC1 cells, in which p.Asn54Lys showed trafficking defects yet still
    formed gap junctions with connexin 30. This node does not declare
    conforms_to on sensorineural_hair_cell_loss because that module's ionic
    homeostasis node also asserts increased oxidative stress and a hair-cell
    death step for which there is no BPS evidence.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  biological_processes:
  - preferred_term: gap junction-mediated intercellular transport
    modifier: DECREASED
    term:
      id: GO:1990349
      label: gap junction-mediated intercellular transport
  evidence:
  - reference: PMID:22796187
    reference_title: "The role of connexins in ear and skin physiology - functional insights from disease-associated mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "These approaches have provided evidence supporting a role of gap junctions and hemichannels in K(+) removal and recycling in the ear, as well as possible roles for nutrient passage, in the cochlea."
    explanation: General connexin physiology of the cochlea; not BPS-specific.
  - reference: PMID:32300592
    reference_title: "GJB2 Mutations Linked to Hearing Loss Exhibit Differential Trafficking and Functional Defects as Revealed in Cochlear-Relevant Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "GJB2 gene (that encodes Cx26) mutations are causal of hearing loss highlighting the importance of Cx26-based channel signaling amongst the supporting cells in the organ of Corti."
    explanation: Places the relevant connexin 26 network in organ of Corti supporting cells.
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

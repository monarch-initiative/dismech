genetic:
- name: GJB2
  gene_term:
    preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous dominant missense alleles in the first extracellular loop are reported. N54K and G59S are representative
    BPS-associated variants, not a complete inventory of dominant GJB2 skin-hearing alleles. G59S also occurs
    in classic Vohwinkel syndrome, so genotype alone does not separate these overlapping clinical diagnoses. No
    modifier gene or reliable numerical penetrance estimate is established by the cited families.
  variants:
  - name: p.Asn54Lys (N54K)
    description: >-
      Heterozygous first-loop missense variant segregating in the original molecularly studied BPS family. Its
      trafficking, dominant-negative Cx26 and transdominant partner effects have been tested in cell systems;
      the Cx30 interaction differs between HeLa and HEI-OC1 models.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:15482471
      reference_title: "Expanding the phenotypic spectrum of Cx26 disorders: Bart-Pumphrey syndrome is caused by a novel missense mutation in GJB2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report here a novel GJB2 mutation N54K segregating in a family with BPS, which was not detected in 110 control individuals of Northern European ancestry."
      explanation: Segregation in one family plus absence from 110 controls.
  - name: p.Gly59Ser (G59S)
    description: >-
      c.175G>A, p.Gly59Ser is reported in BPS and classic Vohwinkel syndrome. Its trafficking and channel mechanism
      cannot be inferred directly from N54K assays.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:30565282
      reference_title: "G59S mutation in the GJB2 gene in a Chinese family with classic Vohwinkel syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "This identical missense mutation (G59S) has also been reported in a patient with Bart-Pumphrey syndrome."
      explanation: Records the earlier BPS report of G59S alongside its occurrence in Vohwinkel syndrome.
    - reference: PMID:38827992
      reference_title: "Connexins in epidermal health and diseases: insights into their mutations, implications, and therapeutic solutions."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Although the effect of Cx26-G59S mutation on connexin biogenesis and channel function remain unclear

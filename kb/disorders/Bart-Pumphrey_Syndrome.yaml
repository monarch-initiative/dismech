      snippet: "We report here a novel GJB2 mutation N54K segregating in a family with BPS, which was not detected in 110 control individuals of Northern European ancestry."
      explanation: N54K segregates with the variable BPS phenotype, including leukonychia; this does not identify the intermediate nail mechanism.
      directness: INDIRECT
  - target: Mutant Connexin 26 Gap Junction Channel Dysfunction

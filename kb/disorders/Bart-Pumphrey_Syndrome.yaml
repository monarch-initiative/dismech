- name: N54K trafficking in HEI-OC1 cells
  experimental_model_type: CELL_LINE
  cell_source: Immortalized mouse cochlear progenitor-derived HEI-OC1 cells, with and without CRISPR ablation of Gja1/Cx43.
  description: >-
    The cells lack endogenous Cx26/Cx30 and abundantly express Cx43. N54K is predominantly intracellular; Cx30
    recruits it into plaques. The cultures do not fully differentiate into mature hair cells or supporting-cell
    networks.
  modeled_mechanisms:
  - target: Connexin 26 Intracellular Retention
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: >-
      Plaque localization rescue is not demonstrated N54K functional rescue. FRAP measured wild-type Cx26 and
      S183F, not N54K/Cx30; cell context differs from the HeLa model and mature human cochlea.
    evidence:
    - reference: PMID:32300592
      reference_title: "GJB2 Mutations Linked to Hearing Loss Exhibit Differential Trafficking and Functional Defects as Revealed in Cochlear-Relevant Cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The dominant syndromic Cx26 mutant N54K had trafficking defects and did not fully prevent wild-type Cx26 gap junction plaque formation but surprisingly formed gap junctions when co-expressed with Cx30."
      explanation: N54K plaque localization improved with Cx30 in HEI-OC1 cells. The functional FRAP experiments tested S183F, not N54K/Cx30, so functional rescue was not shown.
  evidence:

discussions:
- discussion_id: gap_bps_cell_context_to_patient_mechanism
  prompt: How do the cell-context-dependent effects of N54K and the unresolved G59S mechanism produce the variable skin, nail and hearing findings in patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Transdominant Inhibition of Co-expressed Epidermal Connexins
  - pathophysiology#Cochlear Gap Junction Network Dysfunction
  rationale: >-
    Reduced gap-junction coupling and acquisition of abnormal connexin-partner interactions are compatible functional
    observations, not mutually exclusive loss-versus-gain explanations. N54K/Cx30 trafficking differs between
    HeLa and HEI-OC1 cells, and plaque restoration has not established functional rescue. The clinical contribution
    of these effects and the G59S mechanism remain unresolved.
  evidence:
  - reference: PMID:28428247
    reference_title: Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It is important to note that a transdominant interaction with a non-traditional binding partner, such as Cx43, should be considered a gain-of-function property
    explanation: Authors distinguish acquisition of an abnormal interaction from its inhibitory effect on coupling.
    directness: INDIRECT
  - reference: PMID:32300592
    reference_title: "GJB2 Mutations Linked to Hearing Loss Exhibit Differential Trafficking and Functional Defects as Revealed in Cochlear-Relevant Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The dominant syndromic Cx26 mutant N54K had trafficking defects and did not fully prevent wild-type Cx26 gap junction plaque formation but surprisingly formed gap junctions when co-expressed with Cx30."
    explanation: N54K plaque localization improved with Cx30 in HEI-OC1 cells. The functional FRAP experiments tested S183F, not N54K/Cx30, so functional rescue was not shown.
  - reference: PMID:38827992
    reference_title: "Connexins in epidermal health and diseases: insights into their mutations, implications, and therapeutic solutions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Although the effect of Cx26-G59S mutation on connexin biogenesis and channel function remain unclear
    explanation: The 2024 review identifies the allele-specific functional gap.
    quote_role: REVIEW_SYNTHESIS

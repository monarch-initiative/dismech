- name: Transdominant Inhibition of Co-expressed Epidermal Connexins
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In HeLa cells, N54K increases intracellular wild-type Cx26 and Cx30 and reduces their dye coupling. In rat
    epidermal keratinocytes, intracellular Cx43 signal increases and dye transfer decreases modestly, without
    reducing Cx43 plaque number. An abnormal interaction with a non-traditional partner can be termed a gain of
    function while reducing the partner network's communication; these are compatible descriptions. Patient epidermal
    Cx30 upregulation is only a proposed compensation, not proof that this interaction occurs in vivo.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:28428247
    reference_title: "Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N54K mutant exhibits transdominant inhibition of endogenous Cx43 in REKs."
    explanation: Transdominant effect on the endogenous keratinocyte connexin in rat epidermal keratinocytes.
  - reference: PMID:28428247
    reference_title: Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Only cells expressing the N54K mutant exhibited a significant decrease in detectable dye transfer, suggesting that the N54K mutant had a modest transdominant-negative effect on endogenous Cx43
    explanation: Functional effect in rat epidermal keratinocytes; plaque abundance itself was not reduced.
  - reference: PMID:28428247
    reference_title: Induction of cell death and gain-of-function properties of connexin26 mutants predict severity of skin disorders and hearing loss.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: It is important to note that a transdominant interaction with a non-traditional binding partner, such as Cx43, should be considered a gain-of-function property
    explanation: Authors distinguish acquisition of an abnormal interaction from its inhibitory effect on coupling.
    directness: INDIRECT
  downstream:
  - target: Keratinocyte Gap Junctional Communication Deficit
    causal_link_type: DIRECT
    evidence:

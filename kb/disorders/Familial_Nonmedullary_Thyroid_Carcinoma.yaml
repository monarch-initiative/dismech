    explanation: >-
      A bounding counterexample rather than a confirmation - a familial kindred
      whose tumors carried none of the common sporadic drivers. Tagged PARTIAL
      because it constrains, rather than supports, the claim that the familial
      and sporadic driver landscapes are identical, and is the reason
      mechanism_confidence here is PROVISIONAL.
  downstream:
  - target: Multifocal Follicular Cell Transformation
    description: Constitutive mitogenic signaling drives clonal expansion and transformation.
    causal_link_type: DIRECT
- name: Multifocal Follicular Cell Transformation
  description: >-
    Transformation occurs against a field of inherited susceptibility, so it is
    characteristically multicentric and bilateral, frequently accompanied by
    benign follicular adenoma and multinodular goiter in the same gland and in
    unaffected relatives. Tumors then follow the ordinary differentiated
    thyroid-cancer natural history - intrathyroidal growth, extrathyroidal
    extension, cervical nodal spread and, less often, distant metastasis - with
    familial series showing a more aggressive presentation at diagnosis but not a
    worse outcome after appropriate treatment.

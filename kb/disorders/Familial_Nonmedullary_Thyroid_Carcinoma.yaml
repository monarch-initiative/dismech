  - name: p.A248G
    description: Rare germline FOXE1 missense variant (c.743C>G) segregating with disease in one FNMTC family.
  evidence:
  - reference: PMID:19198613
    reference_title: Common variants on 9q22.33 and 14q13.3 predispose to thyroid cancer in European populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, the strongest association signals were observed for rs965513 on 9q22.33 (OR = 1.75; P = 1.7 x 10(-27)) and rs944289 on 14q13.3 (OR = 1.37; P = 2.0 x 10(-9))."
    explanation: Genome-wide association evidence for the FOXE1-proximal 9q22.33 common risk allele, the most consistently replicated thyroid cancer susceptibility signal.
  - reference: PMID:19198613
    reference_title: Common variants on 9q22.33 and 14q13.3 predispose to thyroid cancer in European populations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene nearest to the 9q22.33 locus is FOXE1 (TTF2) and NKX2-1 (TTF1) is among the genes located at the 14q13.3 locus. Both variants contribute to an increased risk of both papillary and follicular thyroid cancer."
    explanation: Assigns the 9q22.33 and 14q13.3 signals to FOXE1 and NKX2-1 respectively, for both papillary and follicular histology.
  - reference: PMID:25381600
    reference_title: Identification of a novel germline FOXE1 variant in patients with familial non-medullary thyroid carcinoma (FNMTC).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study represents the first evidence of involvement of a germline FOXE1 rare variant in FNMTC etiology and suggests that mutations in MAPK pathway-related genes may contribute to tumor development in these familial cases."
    explanation: Extends FOXE1 from a common-variant risk locus to a rare germline variant segregating in an FNMTC family.

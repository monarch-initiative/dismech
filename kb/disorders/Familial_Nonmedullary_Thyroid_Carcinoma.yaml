    snippet: "From whole exome data, pathogenic mutations were not identified in HABP2, SRGAP1, NKX2-1, SRRM2 or FOXE1."
    explanation: Exome sequencing of 59 participants from 20 independent Australian FNMTC kindreds found no pathogenic SRGAP1 variants, arguing against a general role.

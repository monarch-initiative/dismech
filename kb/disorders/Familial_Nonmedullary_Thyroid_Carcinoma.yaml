  - reference: PMID:37438605
    reference_title: Pathogenesis of cancers derived from thyroid follicular cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Essentially, the main oncoproteins in thyroid cancer activate nodes in the receptor tyrosine kinase-RAS-BRAF pathway, which constitutively induces MAPK signalling to varying degrees consistent with their specific biochemical mechanisms of action."
    explanation: >-
      Authoritative review establishing that the follicular-cell thyroid cancer
      drivers converge on constitutive MAPK signalling - the mechanistic anchor

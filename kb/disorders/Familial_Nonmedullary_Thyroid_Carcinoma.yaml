- name: Kinase Inhibitor Therapy for Radioiodine-Refractory Disease
  description: >-
    Advanced radioiodine-refractory familial tumors are treated with molecularly
    selected kinase inhibition on the same rules as sporadic differentiated thyroid
    cancer - RET or NTRK inhibitors for the corresponding fusions, BRAF/MEK-directed

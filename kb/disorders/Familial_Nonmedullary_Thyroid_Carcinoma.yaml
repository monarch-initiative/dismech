has_subtypes:
- name: Non-Syndromic FNMTC
  display_name: Non-Syndromic (Isolated) Familial Non-Medullary Thyroid Carcinoma
  description: >-
    The default form and the main subject of this entry - follicular-cell thyroid
    cancer in two or more first-degree relatives with no recognised
    tumour-predisposition syndrome and no identified environmental cause. No
    validated major susceptibility gene exists and the working model is
    polygenic. The subtypes below are the named linkage loci and the one
    molecularly defined subset carved out of this group; the recognised
    syndromic causes are modelled as differential diagnoses rather than
    subtypes, per this entry's scoping decision - with the single principled
    exception of the long-telomere shelterin subtype, which is syndromic in
    tumour spectrum but is not recognisable before testing and was carved
    directly out of non-syndromic-ascertained cohorts. No `subtype_term` is
    bound on this root subtype: the entry's own `disease_term`, MONDO:0017896,
    is itself defined as the non-syndromic form, so binding the same term here
    would be circular rather than informative.
  evidence:
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonsyndromic familial nonmedullary thyroid cancer accounts for more than 95% of all cases of familial nonmedullary thyroid cancer."
    explanation: Establishes the non-syndromic form as the numerically dominant one.
- name: TCO
  display_name: TCO - Thyroid Tumours with Cell Oxyphilia (19p13.2)
  description: >-
    A non-syndromic FNMTC entity defined in a French pedigree with multinodular
    goitre and non-medullary thyroid carcinoma in which both benign and malignant
    thyroid tumours show oxyphilic (Hurthle/oncocytic) cell change. Mapped by
    linkage to 19p13.2 and named TCO; the causal gene has not been identified.
  subtype_term:
    preferred_term: thyroid carcinoma, nonmedullary, with or without cell oxyphilia
    term:
      id: MONDO:0011312
      label: thyroid carcinoma, nonmedullary, with or without cell oxyphilia
  evidence:
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TCO was mapped to chromosome 19p13.2 by linkage analysis with a whole-genome panel of microsatellite markers."
    explanation: Establishes the TCO locus assignment.
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, both the benign and malignant thyroid tumors in this family exhibit some extent of cell oxyphilia, which, until now, had not been described in the FNMTC."
    explanation: Defines the oxyphilic histologic signature distinguishing this subtype.
- name: fPTC-PRN
  display_name: fPTC/PRN - Familial Papillary Thyroid Carcinoma with Papillary Renal Neoplasia (1q21)
  description: >-
    A distinct heritable tumour syndrome characterised by the familial
    association of papillary thyroid carcinoma, nodular thyroid disease and
    papillary renal neoplasia, mapped by linkage to 1q21 in a large
    three-generation kindred. MET, the gene of isolated familial papillary renal
    neoplasia, was excluded by both linkage and sequencing.
  subtype_term:
    preferred_term: familial papillary thyroid carcinoma with renal papillary neoplasia
    term:
      id: MONDO:0011578
      label: familial papillary thyroid carcinoma with renal papillary neoplasia
  evidence:
  - reference: PMID:10843148
    reference_title: "Papillary thyroid carcinoma associated with papillary renal neoplasia: genetic linkage analysis of a distinct heritable tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct inherited tumor syndrome has been characterized as the familial association of papillary thyroid cancer, nodular thyroid disease, and papillary renal neoplasia."
    explanation: Defines the fPTC/PRN phenotype.
  - reference: PMID:10843148
    reference_title: "Papillary thyroid carcinoma associated with papillary renal neoplasia: genetic linkage analysis of a distinct heritable tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genome-wide screening and an investigation of specific candidate genes demonstrated that the fPTC/PRN phenotype was linked to 1q21."
    explanation: Establishes the 1q21 locus assignment.
- name: NMTC1
  display_name: NMTC1 - Familial Non-Medullary Thyroid Carcinoma Susceptibility Locus (2q21)
  description: >-
    A susceptibility locus mapped to 2q21, first through a shared haplotype in a
    large Tasmanian papillary thyroid carcinoma pedigree and then replicated by
    linkage in 80 independent pedigrees. The signal strengthened markedly when
    pedigrees were stratified for the follicular variant of papillary thyroid
    carcinoma, suggesting NMTC1 predisposes specifically to follicular-patterned
    tumours. The causal gene has not been identified.
  subtype_term:
    preferred_term: thyroid cancer, nonmedullary, 1
    term:
      id: MONDO:0008567
      label: thyroid cancer, nonmedullary, 1
  evidence:
  - reference: PMID:11438887
    reference_title: Localization of a susceptibility gene for familial nonmedullary thyroid carcinoma to chromosome 2q21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results indicate the existence of a susceptibility locus for familial NMTC on chromosome 2q21."
    explanation: Establishes the NMTC1 locus assignment.
  - reference: PMID:11438887
    reference_title: Localization of a susceptibility gene for familial nonmedullary thyroid carcinoma to chromosome 2q21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stratification based on the presence of at least one case of the follicular variant of PTC, the phenotype observed in the Tas1 family, identified 17 such pedigrees, yielding a maximal HLOD score of 4.17 (alpha=0.80) and NPL=4.99 (P=.00002) at markers AFMa272zg9 and D2S2271, respectively."
    explanation: Documents the follicular-variant stratification that sharpens the 2q21 signal.
- name: Long Telomere Syndrome PTC
  display_name: Telomere-Lengthening (POT1/TINF2/ACD) Syndromic Papillary Thyroid Cancer
  description: >-
    The one molecularly defined subset so far carved out of non-syndromic FNMTC -
    germline shelterin (POT1, TINF2, ACD) variants producing ultra-long telomeres
    and predisposing to papillary thyroid cancer alongside melanoma, lymphoma and
    sarcoma. Found in 4.5% of familial cases, and in 22% of individuals with both
    papillary thyroid cancer and melanoma, which makes the combination clinically
    recognisable. Directionally opposite to the telomere-shortening/fragility
    model in the pathograph above; both are curated so the tension is visible,
    and both are now separable at the pathograph level under the
    `telomere_length_predisposition` hypothesis group rather than only in prose.
    Note the apparent tension with the scoping rule stated on Non-Syndromic
    FNMTC: this subtype IS syndromic in its tumour spectrum, but unlike FAP,
    Cowden, Carney, Werner and DICER1 it is not recognisable before testing and
    was carved directly out of cohorts ascertained as non-syndromic FNMTC, so it
    belongs here as a subtype rather than as a differential. No `subtype_term`
    is bound: MONDO has no generic term for the long-telomere / shelterin
    papillary thyroid cancer syndrome, only gene-specific terms (e.g.
    MONDO:0100570 for POT1 tumour predisposition) that would under-represent a
    three-gene entity. Left deliberately unbound rather than mis-bound; a
    candidate MONDO NTR.
  genes:
  - preferred_term: POT1
    term:
      id: hgnc:17284
      label: POT1
  - preferred_term: TINF2
    term:
      id: hgnc:11824
      label: TINF2
  - preferred_term: ACD
    term:
      id: hgnc:25070
      label: ACD
  evidence:
  - reference: PMID:38688277
    reference_title: Telomere-lengthening germline variants predispose to a syndromic papillary thyroid cancer subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among individuals with PTC and melanoma, 22% carried a deleterious germline variant, suggesting that a long telomere syndrome might be clinically recognizable."
    explanation: Gives the clinically actionable PTC-plus-melanoma recognition rule.
  - reference: PMID:38688277
    reference_title: Telomere-lengthening germline variants predispose to a syndromic papillary thyroid cancer subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals harboring these variants had ultra-long telomere length, and 15 of 18 (83%) developed other cancers, of which melanoma, lymphoma, and sarcoma were most common."
    explanation: Establishes the ultra-long-telomere phenotype and associated tumour spectrum.
prevalence:
- population: >-
    Patients with non-medullary (follicular-cell-derived) thyroid carcinoma,
    worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    FNMTC occurrence is reported in the literature as a fraction of non-medullary
    thyroid carcinoma cases, not as a population rate, and the reported fraction
    varies with the case definition (two versus three affected first-degree
    relatives): 3-9% in older reviews using the two-relative definition, 5-15% in
    recent reviews, and approximately 5% in series using a stricter definition. No
    reliable FNMTC-specific incidence or point prevalence per 100,000 has been
    established, so no rate_per_100000 is asserted here. MONDO places
    MONDO:0017896 in the `rare` subset.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial non-medullary thyroid cancer (FNMTC) constitutes 3-9% of all thyroid cancers."
    explanation: The lower published estimate of the FNMTC case fraction.
  - reference: PMID:35255942
    reference_title: Genetic susceptibility to hereditary non-medullary thyroid cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the increasing incidence of NMTC in recent years, the familial form of the disease has also become more common than previously reported, accounting for 5-15% of NMTC cases."
    explanation: The contemporary upper estimate of the FNMTC case fraction.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the familial form of the disease has also become more common than previously reported and constitutes nearly 10% of all thyroid cancers"
    explanation: Independent estimate of roughly 10% supporting the mid-range of the reported band.
- population: >-
    Familial non-medullary thyroid carcinoma kindreds (syndromic subset)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Within familial disease, roughly 5% of cases are syndromic (a recognized tumor
    predisposition syndrome) and the remaining ~95% are non-syndromic. This is a
    within-disease composition figure rather than a population rate.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The susceptibility chromosomal loci and genes of 95% of FNMTC cases remain to be characterized."
    explanation: Establishes the ~95% non-syndromic / ~5% syndromic split.
treatments:
- name: Thyroidectomy
  description: >-
    Surgery is the definitive treatment and follows standard differentiated
    thyroid-cancer risk stratification - lobectomy or total thyroidectomy according
    to tumor size, multifocality and bilaterality, nodal disease and patient
    preference. Because familial tumors are more often multicentric and bilateral,
    total thyroidectomy is used frequently in referral series, but current guidance
    does not mandate a more aggressive operation on the basis of family history
    alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Thyroidectomy
    term:
      id: NCIT:C51648
      label: Thyroidectomy
  target_mechanisms:
  - target: Multifocal Follicular Cell Transformation
    treatment_effect: INHIBITS
    description: >-
      Removing both lobes eliminates the multicentric and contralateral disease
      that field predisposition produces, which is the mechanistic rationale for
      favouring total over partial thyroidectomy in familial kindreds.
  evidence:
  - reference: PMID:26191611
    reference_title: Clinicopathological features and prognosis of familial papillary thyroid carcinoma--a large-scale, matched, case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, the available data are not sufficient to support a more aggressive approach for FPTC."
    explanation: Directly supports the statement that family history alone does not justify escalating the initial operation.
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the more aggressive presentation of familial cases, an appropriate treatment leads to an outcome similar to that observed for sporadic cases."
    explanation: Supports treating FNMTC by standard differentiated thyroid-cancer principles rather than a familial-specific escalation.
  - reference: PMID:40392709
    reference_title: Comparison of Progression-Free Survival in Familial Non-Medullary Thyroid Cancer and Sporadic Differentiated Thyroid Cancer Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, the management of FNMTC should align with the standard of care for DTC to avoid overtreatment of FNMTC."
    explanation: >-
      Explicit recommendation against escalating surgery on the basis of
      familial status alone, and the source of the overtreatment concern.
- name: Thyroid Lobectomy
  description: >-
    Lobectomy remains appropriate for selected small, unifocal, low-risk
    familial tumours - notably screen-detected cancers, where hemithyroidectomy
    was used in 23.5% of screen-detected FNMTC versus 0% of clinically
    presenting cases. The choice between lobectomy and total thyroidectomy
    should follow standard differentiated-thyroid-cancer risk stratification
    rather than family history alone, and is the operative counterweight to the
    reflex-total-thyroidectomy tendency in familial disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Thyroid Lobectomy
    term:
      id: NCIT:C51649
      label: Thyroid Lobectomy
  evidence:
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "less extensive surgery (hemithyroidectomy 23.5% vs. 0%; p = 0.002)"
    explanation: >-
      Quantifies the use of hemithyroidectomy for screen-detected, low-risk
      familial disease versus clinically presenting disease.
  - reference: PMID:26191611
    reference_title: Clinicopathological features and prognosis of familial papillary thyroid carcinoma--a large-scale, matched, case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At present, the available data are not sufficient to support a more aggressive approach for FPTC."
    explanation: >-
      Supports retaining lobectomy as an option - family history alone does not
      justify mandating the more extensive operation.
- name: Cervical Lymph Node Dissection
  description: >-
    Therapeutic compartment-oriented neck dissection is performed for proven nodal
    metastasis, following standard differentiated thyroid-cancer indications.
    Familial series report higher nodal metastasis rates than sporadic disease,
    but screen-detected familial cancers have a substantially lower central-node
    metastasis rate (17.6% versus 51.1%), so nodal management should be driven
    by imaging and cytology findings rather than by familial status.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Neck Dissection
    term:
      id: NCIT:C15643
      label: Neck Dissection
  target_mechanisms:
  - target: Multifocal Follicular Cell Transformation
    treatment_effect: INHIBITS
    description: >-
      Compartment-oriented dissection removes the regional nodal disease that
      the transformed, frequently multicentric gland has seeded.
  evidence:
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a lower rate of central neck lymph node metastases (17.6% vs. 51.1%; p = 0.02)"
    explanation: >-
      Quantifies central nodal involvement in screen-detected versus clinically
      detected familial disease - the reason nodal surgery is findings-driven
      rather than familial-status-driven.
  - reference: PMID:18832444

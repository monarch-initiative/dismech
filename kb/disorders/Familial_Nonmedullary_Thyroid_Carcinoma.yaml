    mapping_source: MONDO (manual curation)
    mapping_justification: >-
      MONDO:0017895 ("familial papillary or follicular thyroid carcinoma", exact
      synonyms FNMTC and "familial nonmedullary thyroid gland carcinoma") is a
      direct child of MONDO:0017896 that it effectively duplicates, and MONDO
      itself tags it with `subset: obsoletion_candidate`. This entry therefore
      anchors `disease_term` on the parent MONDO:0017896 and records
      MONDO:0017895 as a close match rather than as a separate disease identity.
      The distinction MONDO:0017895 nominally adds - restricting to papillary or
      follicular histology - is not a real narrowing, because papillary and
      follicular carcinoma together constitute essentially all non-medullary
      thyroid carcinoma in familial series.
inheritance:
- name: Polygenic Susceptibility
  description: >-
    Non-syndromic FNMTC is most commonly modeled as a polygenic trait in which
    multiple low- to moderate-penetrance susceptibility alleles combine to raise
    thyroid carcinoma risk, rather than as a single high-penetrance Mendelian
    locus. The best-replicated contributors are common GWAS risk alleles near
    FOXE1 (9q22.33) and NKX2-1 (14q13.3), each of modest individual effect. This
    inheritance model is why no validated predictive gene panel exists for
    isolated non-syndromic kindreds. Family-specific oligogenic combinations of
    rare alleles are a plausible alternative model for individual pedigrees but
    are not established as a general mechanism; see the open discussion on
    genetic architecture below.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FNMTC is described as a polygenic disorder associated with multiple low- to moderate-penetrance susceptibility genes and incomplete penetrance."
    explanation: Directly supports the polygenic, low-to-moderate-penetrance model with incomplete penetrance.
  - reference: PMID:35295987
    reference_title: "Susceptibility Genes and Chromosomal Regions Associated With Non-Syndromic Familial Non-Medullary Thyroid Carcinoma: Some Pathogenetic and Diagnostic Keys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Non-syndromic familial non-medullary carcinoma has a complex and heterogeneous genetic basis involving several genes and loci with a monogenic or polygenic inheritance model."
    explanation: Supports genetic heterogeneity with a polygenic (as well as monogenic) inheritance model.
- name: Autosomal Dominant Susceptibility With Reduced Penetrance
  description: >-
    Many individual kindreds segregate apparent autosomal-dominant susceptibility
    with reduced, age-dependent penetrance and variable expressivity. This
    pedigree-level pattern coexists with, rather than contradicts, the polygenic
    model: it is what a small number of rare moderate-penetrance alleles on a
    polygenic background looks like in a single large family, and it is the model
    under which the classic linkage loci (TCO, fPTC-PRN, NMTC1) were mapped.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "show an autosomal dominant pattern of inheritance with incomplete penetrance and variable expressivity"
    explanation: States the autosomal-dominant-with-incomplete-penetrance model for FNMTC kindreds.
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The transmission of susceptibility to FNMTC is compatible with autosomal dominant inheritance with reduced penetrance, or with complex inheritance."
    explanation: The linkage study that mapped TCO states the dominant-with-reduced-penetrance (or complex) transmission model.
pathophysiology:
- name: Inherited Non-Syndromic Susceptibility in Thyroid Follicular Cells
  description: >-
    The upstream lesion in non-syndromic FNMTC is a constitutional (germline)
    susceptibility state in the thyroid follicular cell lineage, carried by a
    family-specific combination of common risk alleles and rare candidate
    variants rather than by one recurrent high-penetrance driver. Reported
    contributors include common risk variants near FOXE1 (9q22.33) and NKX2-1
    (14q13.3), rare segregating variants in SRGAP1, NKX2-1, FOXE1, SRRM2 and
    DUOX2, and susceptibility intervals mapped by linkage (TCO/19p13.2,
    fPTC-PRN/1q21, NMTC1/2q21, MNG1/14q32, FTEN/8p23.1-p22, 6q22, 8q24). Because
    each family tends to carry its own candidate lesion, this node is defined by
    the shared consequence - an inherited increase in follicular-cell cancer
    risk - rather than by a shared gene.

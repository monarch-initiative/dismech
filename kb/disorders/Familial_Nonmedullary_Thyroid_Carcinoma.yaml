- name: Genetic Counseling and Family Risk Assessment
  description: >-
    Counseling covers a three-generation pedigree, recognition of syndromic
    features that would redirect testing to APC, PTEN, PRKAR1A, WRN or DICER1, and
    an explicit explanation that no validated predictive gene panel exists for
    isolated non-syndromic kindreds. Current major-society guidance does not
    recommend routine screening of first-degree relatives of patients with
    differentiated thyroid cancer, so surveillance decisions are individualized -
    with a lower threshold in families with three or more affected members,
    unusually young onset, or aggressive disease.

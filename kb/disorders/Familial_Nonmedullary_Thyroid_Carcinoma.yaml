    explanation: Supports phenotype-directed recognition of syndromic forms as the core counseling task.
diagnosis:
- name: Pedigree-Based Clinical Definition
  description: >-
    FNMTC is a clinical diagnosis of exclusion made from the pedigree: two or more
    first-degree relatives with non-medullary thyroid carcinoma, with no recognized
    tumor-predisposition syndrome and no shared predisposing environmental exposure
    (notably childhood neck irradiation). Three or more affected relatives is the
    more specific research definition, because two-case families are substantially
    contaminated by coincidental clustering of a common sporadic cancer. There is
    no diagnostic laboratory test, biomarker, or histologic feature that
    distinguishes a familial from a sporadic tumor.
  evidence:
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial non-medullary thyroid carcinoma (FNMTC), mainly of papillary histotype (FPTC), is defined by the presence of the disease in two or more first-degree relatives in the absence of other known familial syndromes."
    explanation: The conventional two-first-degree-relative definition, with syndrome exclusion.
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The term familial non-medullary thyroid cancers (FNMTCs) is used to indicate thyroid tumors, arising from follicular cells, which are observed in two or more first-degree relatives in the absence of predisposing environmental factors."
    explanation: Adds the explicit exclusion of predisposing environmental factors (notably radiation exposure) to the definition.
  - reference: PMID:31247975
    reference_title: Current Knowledge of Germline Genetic Risk Factors for the Development of Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 5%-15% of NMTC cases are thought to be of familial origin (FNMTC), which is defined as the occurrence of the disease in three or more first-degree relatives of the patient."
    explanation: Documents the competing stricter three-relative definition and the case fraction that accompanies it.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "According to his mathematical simulation, 62–69% of 2-hit families are sporadic occurrences and thus, only families with 3 or more affected first-degree relatives should be considered for clinical and genetic investigations of FNMTC."
    explanation: >-
      The Charkes probability argument quantifying how much of the two-relative
      definition is coincidental clustering; PARTIAL because the same review
      goes on to argue that two-case families should not be excluded outright.
      See the fnmtc-two-relative-definition discussion.
- name: Neck Ultrasound With Ultrasound-Guided Fine-Needle Aspiration
  description: >-
    Evaluation of a detected nodule follows standard differentiated-thyroid-cancer
    practice and is not modified by family history: serum TSH plus high-resolution
    thyroid and cervical-node ultrasound, then ultrasound-guided fine-needle
    aspiration according to sonographic risk pattern and nodule size, reported with
    Bethesda cytology. This is the diagnostic workup of an index nodule, and is
    distinct from the separate question of whether to run surveillance ultrasound
    on unaffected relatives at all (next entry). FNMTC screening cohorts have used
    a lower biopsy threshold than routine practice - nodules greater than 0.5 cm.
  diagnosis_term:
    preferred_term: Ultrasound-Guided Fine-Needle Aspiration
    term:
      id: NCIT:C137833
      label: Ultrasound-Guided Fine-Needle Aspiration
  evidence:
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A prospective cohort study was performed with yearly screening using neck ultrasound and fine-needle aspiration biopsy of thyroid nodule(s) >0.5 cm in at-risk individuals whose relatives were diagnosed with familial non-medullary thyroid cancer (FNMTC)."
    explanation: >-
      Documents the ultrasound-plus-FNA protocol and the 0.5 cm biopsy size
      threshold used in the reference FNMTC cohort.
- name: Germline Genetic Testing
  description: >-
    Testing is phenotype-directed. When syndromic features are present, targeted
    germline testing of APC, PTEN, DICER1, PRKAR1A or WRN (or a multigene
    hereditary-cancer panel) is appropriate and actionable. For apparently isolated
    non-syndromic kindreds there is no validated predictive panel; exome or genome
    sequencing of multiple affected and unaffected relatives with segregation
    analysis is a research-grade approach best reserved for families with three or
    more affected members.
  evidence:
  - reference: PMID:35255942
    reference_title: Genetic susceptibility to hereditary non-medullary thyroid cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although syndromic NMTC has well-known genetic risk factors, the gene(s) responsible for the vast majority of non-syndromic FNMTC cases are yet to be identified."
    explanation: Supports the split between actionable syndromic testing and the absence of a validated non-syndromic panel.
  - reference: PMID:31247975
    reference_title: Current Knowledge of Germline Genetic Risk Factors for the Development of Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Research carried out to date identifies fourteen genes (DICER1, FOXE1, PTCSC2, MYH9, SRGAP1, HABP2, BRCA1, CHEK2, ATM, RASAL1, SRRM2, XRCC1, TITF-1/NKX2.1, PTCSC3) associated with vulnerability to FNMTC that are not related to hereditary syndromes."
    explanation: Enumerates the non-syndromic candidate gene list, none of which constitutes a validated clinical predictive test.
- name: Surveillance Ultrasound of At-Risk First-Degree Relatives
  description: >-
    Because no germline test is available for non-syndromic FNMTC, imaging
    surveillance of unaffected first-degree relatives is the only screening
    option - and whether to offer it is genuinely unresolved, with the yield
    depending sharply on family size. In a prospective NIH cohort, yearly neck
    ultrasound with fine-needle aspiration of nodules greater than 0.5 cm
    detected thyroid cancer in 4.6% of at-risk members of two-affected-member
    families (close to the background nodule-derived detection rate) versus
    22.7% in families with three or more affected members; screen-detected
    cancers were smaller, less often node-positive, and required less extensive
    surgery and less radioiodine. Conversely, a prospective study of 72 children
    and adolescents with a single affected parent found no cancers over five
    years and concluded screening was unwarranted in that setting. The
    defensible synthesis is individualised surveillance after counselling for
    kindreds with three or more affected relatives, and shared decision-making
    rather than routine screening for two-case families, with overdiagnosis as
    the principal harm.
  diagnosis_term:
    preferred_term: Cancer Screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thyroid cancer was detected by screening in 4.6% (2/43) of at-risk individuals from families with two members affected, and in 22.7% (15/66) of at-risk members from families with three or more patients affected (p = 0.01)."
    explanation: >-
      Quantifies the screening-yield gradient by number of affected relatives -
      the empirical basis for restricting surveillance to larger kindreds.
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening of at-risk family members resulted in earlier detection of low-risk FNMTC and was associated with a less aggressive initial treatment."
    explanation: The benefit claim for surveillance in at-risk relatives.
  - reference: PMID:36124950
    reference_title: Ultrasonography screening in children and adolescents who have one parent with familial non-medullary thyroid carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The present results suggest that US screening is not necessary in children or adolescents when one parent has a diagnosis of FNMTC"
    explanation: >-
      Prospective paediatric evidence against routine ultrasound screening in
      two-relative families - the direct counterweight to the NIH result.
clinical_trials:
- name: NCT01109420
  description: >-
    The NIH prospective natural-history and screening cohort in familial
    non-medullary thyroid cancer, and the trial datum behind the central
    management question in this entry - whether to screen unaffected
    first-degree relatives. It enrols individuals aged 7 and over with two
    affected first-degree relatives, re-screens non-cancer participants yearly
    with non-invasive imaging, and is the source of the 4.6% versus 22.7%
    screening-yield gradient by pedigree size reported in PMID:28657510 and
    curated on the Surveillance Ultrasound diagnosis entry. Its stated
    objectives - natural history, best screening strategy, and susceptibility
    gene identification - map onto the three largest open questions in this
    entry.
  target_phenotypes:
  - preferred_term: Non-medullary thyroid carcinoma
    term:
      id: HP:0040198
      label: Non-medullary thyroid carcinoma
  - preferred_term: Thyroid nodule
    term:
      id: HP:0025388
      label: Thyroid nodule
  evidence:
  - reference: clinicaltrials:NCT01109420
    reference_title: "Clinical and Genetic Studies in Familial Non-Medullary Thyroid Cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To determine the best screening strategy for FNMTC."
    explanation: >-
      The trial's own statement that relative-screening strategy is an
      unresolved question being studied prospectively - the registry-level
      counterpart to the unresolved screening recommendation curated here.
  - reference: clinicaltrials:NCT01109420
    reference_title: "Clinical and Genetic Studies in Familial Non-Medullary Thyroid Cancer"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals at least 7 years of age who have two first-degree relatives (e.g., parents, children, siblings) who have or have had non-medullary thyroid cancer or a documented diagnosis of non-medullary thyroid cancer and one living relative with documented non-medullary thyroid cancer."
    explanation: >-
      Documents that the cohort is assembled under the two-first-degree-relative
      definition, which is exactly the criterion questioned in the
      fnmtc-two-relative-definition discussion - so its yield estimates inherit
      that dilution.
differential_diagnoses:
- name: Classic familial adenomatous polyposis
  description: >-
    Germline APC variants cause familial adenomatous polyposis / Gardner syndrome,
    in which thyroid carcinoma - characteristically the cribriform-morular pattern,
    in young women - occurs alongside colorectal adenomatous polyposis. Identifying
    APC moves the family out of non-syndromic FNMTC and into a syndrome with its
    own colorectal surveillance and prophylactic colectomy pathway. See the
    Classic Familial Adenomatous Polyposis entry in this knowledge base.
  disease_term:
    preferred_term: classic familial adenomatous polyposis
    term:
      id: MONDO:0021055
      label: classic familial adenomatous polyposis
  distinguishing_features:
  - Colorectal adenomatous polyposis, often with congenital hypertrophy of the retinal pigment epithelium, desmoid tumors and osteomas.
  - Cribriform-morular thyroid carcinoma histology, strongly female-predominant and young-onset.
  - A pathogenic germline APC variant is identifiable, unlike in non-syndromic FNMTC.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These associated syndromes include Cowden syndrome, familial adenomatous polyposis, Gardner syndrome, Carney complex type 1, Werner syndrome and DICER1 syndrome."
    explanation: Lists familial adenomatous polyposis among the syndromes that must be recognized and excluded.
- name: Cowden syndrome
  description: >-
    Germline PTEN variants cause Cowden syndrome / PTEN hamartoma tumor syndrome,
    in which follicular and papillary thyroid carcinoma occur together with
    macrocephaly, mucocutaneous hamartomas, breast carcinoma and endometrial
    carcinoma. See the Cowden Syndrome and PTEN Hamartoma Tumor Syndrome entries,
    which already curate non-medullary thyroid carcinoma as a component phenotype.
  disease_term:
    preferred_term: Cowden syndrome
    term:
      id: MONDO:0016063
      label: Cowden disease
  distinguishing_features:
  - Macrocephaly, trichilemmomas and other mucocutaneous hamartomas.
  - Multi-organ tumor spectrum including breast and endometrial carcinoma.
  - A pathogenic germline PTEN variant is identifiable.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These associated syndromes include Cowden syndrome, familial adenomatous polyposis, Gardner syndrome, Carney complex type 1, Werner syndrome and DICER1 syndrome."
    explanation: Lists Cowden syndrome among the syndromes that must be excluded before diagnosing non-syndromic FNMTC.
- name: Carney complex
  description: >-
    Germline PRKAR1A variants cause Carney complex, in which thyroid follicular
    neoplasia occurs with lentigines, cardiac myxomas, primary pigmented nodular
    adrenocortical disease and other endocrine tumors.
  disease_term:
    preferred_term: Carney complex
    term:
      id: MONDO:0015285
      label: Carney complex
  distinguishing_features:
  - Spotty skin pigmentation (lentigines) and cardiac or cutaneous myxomas.
  - Primary pigmented nodular adrenocortical disease with Cushing syndrome.
  - A pathogenic germline PRKAR1A variant is identifiable.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These associated syndromes include Cowden syndrome, familial adenomatous polyposis, Gardner syndrome, Carney complex type 1, Werner syndrome and DICER1 syndrome."
    explanation: Lists Carney complex type 1 among the syndromes that must be excluded.
- name: Werner syndrome
  description: >-
    Biallelic germline WRN variants cause Werner syndrome, a segmental progeroid
    RecQ-helicase disorder with a characteristic neoplasm spectrum that includes
    thyroid carcinoma.
  disease_term:
    preferred_term: Werner syndrome
    term:
      id: MONDO:0010196
      label: Werner syndrome
  distinguishing_features:
  - Premature ageing phenotype with scleroderma-like skin, cataracts, short stature and early atherosclerosis.
  - Autosomal recessive rather than dominant transmission.
  - Biallelic pathogenic WRN variants are identifiable.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These associated syndromes include Cowden syndrome, familial adenomatous polyposis, Gardner syndrome, Carney complex type 1, Werner syndrome and DICER1 syndrome."
    explanation: Lists Werner syndrome among the syndromes that must be excluded.
- name: DICER1-related tumor predisposition
  description: >-
    Germline DICER1 variants cause a tumor predisposition syndrome in which
    multinodular goiter and differentiated thyroid carcinoma occur alongside
    pleuropulmonary blastoma, ovarian Sertoli-Leydig cell tumor and cystic nephroma.
  disease_term:
    preferred_term: DICER1-related tumor predisposition
    term:
      id: MONDO:0100216
      label: DICER1-related tumor predisposition
  distinguishing_features:
  - Pleuropulmonary blastoma, cystic nephroma or ovarian Sertoli-Leydig cell tumor in the pedigree.
  - Early-onset multinodular goiter, often before the carcinoma.
  - A pathogenic germline DICER1 variant is identifiable.
  evidence:
  - reference: PMID:27807061
    reference_title: "Familial non-medullary thyroid cancer: unraveling the genetic maze."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These associated syndromes include Cowden syndrome, familial adenomatous polyposis, Gardner syndrome, Carney complex type 1, Werner syndrome and DICER1 syndrome."
    explanation: Lists DICER1 syndrome among the syndromes that must be excluded.
- name: Medullary thyroid carcinoma
  description: >-
    Medullary thyroid carcinoma arises from calcitonin-producing parafollicular C
    cells, not from follicular cells, and its familial form (MEN2A, MEN2B, familial
    medullary thyroid carcinoma) is caused by germline RET variants with a
    well-defined genotype-directed prophylactic thyroidectomy pathway. It is
    excluded by definition from FNMTC and is curated separately in the
    Medullary Thyroid Carcinoma entry. Confusing the two is the principal named-entity
    hazard in this disease area.
  disease_term:
    preferred_term: medullary thyroid gland carcinoma
    term:
      id: MONDO:0015277
      label: medullary thyroid gland carcinoma
  distinguishing_features:
  - Parafollicular C cell rather than follicular cell origin.
  - Elevated serum calcitonin and carcinoembryonic antigen.
  - Germline RET variants with established genotype-risk-directed prophylactic thyroidectomy, unlike non-syndromic FNMTC where no such pathway exists.
  evidence:
  - reference: PMID:31247975
    reference_title: Current Knowledge of Germline Genetic Risk Factors for the Development of Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Medullary thyroid carcinoma (MTC) develops from neuroendocrine C cells, and can occur sporadically or as a familial condition."
    explanation: Establishes the C-cell origin that distinguishes medullary from non-medullary familial thyroid cancer.
- name: Radiation-associated thyroid carcinoma
  description: >-
    Shared childhood neck irradiation within a family can produce apparent
    aggregation of thyroid carcinoma without inherited susceptibility. Excluding a
    common environmental exposure is part of the FNMTC definition.
  distinguishing_features:
  - A documented history of therapeutic or accidental neck irradiation, typically in childhood, shared by affected relatives.
  - Aggregation follows the exposure rather than the pedigree structure.
  evidence:
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which are observed in two or more first-degree relatives in the absence of predisposing environmental factors"
    explanation: The definitional requirement to exclude a shared predisposing environmental exposure such as radiation.
- name: Coincidental familial clustering of sporadic differentiated thyroid carcinoma
  description: >-
    Chance co-occurrence of sporadic papillary or follicular thyroid carcinoma
    within a family is the single most common alternative explanation for a
    two-affected-relative pedigree, and is the reason the two-relative
    definition is contested. Thyroid cancer is common and its detected incidence
    has risen sharply with ultrasound use, so a substantial fraction of two-case
    families do not represent inherited disease at all. Unlike the syndromic
    differentials this one cannot be excluded by a test - it is excluded
    probabilistically, by pedigree size.
  disease_term:
    preferred_term: differentiated thyroid carcinoma
    term:
      id: MONDO:0015447
      label: differentiated thyroid carcinoma
  distinguishing_features:
  - Exactly two affected first-degree relatives, with no third case and no unusually young onset.
  - Both cases detected incidentally during the ultrasound era rather than presenting clinically.
  - No excess of benign nodular thyroid disease among unaffected relatives.
  evidence:
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the presence of only two affected members in kindreds may represent a fortuitous association of the disease"
    explanation: States the coincidental-clustering differential explicitly.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to his mathematical simulation, 62–69% of 2-hit families are sporadic occurrences and thus, only families with 3 or more affected first-degree relatives should be considered for clinical and genetic investigations of FNMTC."
    explanation: >-
      Quantifies how large this differential is - on the Charkes simulation the
      majority of two-case families fall into it.
- name: Familial multinodular goiter
  description: >-
    Autosomal dominant familial multinodular goitre is common, especially in
    iodine-deficient regions, and can be mistaken for or coexist with FNMTC.
    Because benign nodular thyroid disease is itself enriched in FNMTC kindreds,
    a family with many nodular relatives and one or two carcinomas is genuinely
    ambiguous. Susceptibility to multinodular goitre and to non-medullary
    thyroid carcinoma may in fact be partly shared, so this is a boundary case
    rather than a clean exclusion.
  disease_term:
    preferred_term: multinodular goiter
    term:
      id: MONDO:0000334
      label: multinodular goiter
  distinguishing_features:
  - Nodular disease without histologically confirmed carcinoma in the affected relatives.
  - High background goitre prevalence in the population of origin (iodine deficiency).
  - Aggregation of goitre rather than of carcinoma across the pedigree.
  evidence:
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In areas with iodine deficiency MNG is common and, although the population incidence of MNG far exceeds that of thyroid cancer, there is also evidence that genetic susceptibility to MNG and to NMTC may be related"
    explanation: >-
      Documents both the confounding and the possibility of genuinely shared
      susceptibility, which is why this is curated as a boundary case.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In fact, families segregating an autosomal dominant trait for MNG often include cases of NMTC."
    explanation: >-
      States the co-segregation of multinodular goitre and non-medullary thyroid
      cancer within kindreds directly.
discussions:
- discussion_id: fnmtc-habp2-controversy
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#HABP2
  prompt: >-
    Does germline HABP2 p.G534E confer susceptibility to familial nonmedullary
    thyroid carcinoma in any subset of kindreds, or should the association be
    considered refuted outright?
  rationale: >-
    The 2015 New England Journal of Medicine report of germline HABP2 p.G534E
    cosegregating in a large FNMTC kindred, supported by loss-of-function assays,
    was the highest-profile candidate-gene claim in this field. It was contradicted
    within a year on two independent grounds: failure of cosegregation in other
    kindreds carrying the allele, and an allele frequency of 7-9% in unselected
    populations, which is incompatible with a highly penetrant dominant cancer
    allele. Independent European series are likewise negative. The dismech entry
    therefore types HABP2 as DISPUTED and carries both the original SUPPORT
    evidence and the REFUTE evidence, so downstream consumers see the controversy
    rather than a one-sided assertion. The residual open question is whether the
    variant could act as a very-low-penetrance modifier in some ancestries - a
    hypothesis that current data neither establish nor formally exclude - not
    whether it is a clinically actionable predisposition allele, which it is not.
  proposed_experiments:
  - name: Ancestry-matched case-control association testing of HABP2 p.G534E
    experiment_id: fnmtc-exp-habp2-casecontrol
    description: Ancestry-matched case-control association testing of HABP2 p.G534E at sufficient power to detect an odds ratio below 1.3.
  - name: Formal cosegregation meta-analysis across all published FNMTC
    experiment_id: fnmtc-exp-habp2-cosegregation
    description: Formal cosegregation meta-analysis across all published FNMTC kindreds carrying the allele.
- discussion_id: fnmtc-genetic-architecture
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Inherited Non-Syndromic Susceptibility in Thyroid Follicular Cells
  prompt: >-
    What is the genetic architecture of non-syndromic FNMTC - polygenic
    accumulation of common low-effect alleles, family-specific oligogenic
    combinations of rare alleles, or a set of as-yet-unidentified moderate-penetrance
    monogenic causes?
  rationale: >-
    The susceptibility genes for roughly 95% of FNMTC cases remain uncharacterized
    despite three decades of linkage, GWAS and exome/genome sequencing. Reviews
    describe the trait as polygenic with multiple low- to moderate-penetrance
    genes, yet individual kindreds segregate apparent autosomal dominance and each
    family tends to carry its own candidate lesion. These three models are not
    mutually exclusive and cannot currently be distinguished, which is why no
    predictive gene panel exists for isolated kindreds. This entry asserts the
    polygenic and autosomal-dominant-with-reduced-penetrance models, for which
    quotable evidence exists, and deliberately does NOT bind an oligogenic
    inheritance term (HP:0010983), because no cited source demonstrates
    joint transmission of two or more specified loci in an FNMTC pedigree.
  proposed_experiments:
  - name: Polygenic risk score construction from thyroid cancer
    experiment_id: fnmtc-exp-prs-multiplex
    description: Polygenic risk score construction from thyroid cancer GWAS loci, tested for enrichment in multiplex FNMTC kindreds versus matched sporadic cases.
  - name: Large-scale trio and multiplex-family whole-genome sequencing with
    experiment_id: fnmtc-exp-wgs-multiplex
    description: Large-scale trio and multiplex-family whole-genome sequencing with joint linkage and rare-variant burden analysis across ancestries.
  - name: Systematic testing for two-locus joint transmission in
    experiment_id: fnmtc-exp-two-locus-transmission
    description: Systematic testing for two-locus joint transmission in kindreds carrying more than one candidate rare allele, which would be required before an oligogenic inheritance term could be asserted.
- discussion_id: fnmtc-aggressiveness-ascertainment
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - phenotype#Earlier Age at Onset in Successive Generations
  prompt: >-
    Is the reported clinical anticipation and increased aggressiveness of familial
    tumors a biological property of FNMTC, or an artefact of ascertainment and
    intensified surveillance of known families?
  rationale: >-
    Multiple independent series report earlier onset, more multifocality and
    bilaterality, and higher nodal metastasis rates in second-generation affected
    relatives, and matched case-control studies find increased biological
    aggressiveness. But once a family is identified, its younger members are
    imaged more intensively and earlier, which by itself produces earlier apparent
    age at diagnosis and smaller detected tumors. No repeat-expansion or other
    molecular anticipation mechanism has been demonstrated. Critically, the largest
    contemporary series finds a more aggressive presentation that does not
    translate into a worse outcome - the pattern one expects from detection bias
    plus effective treatment, and the reason major guidelines have not endorsed
    escalating surgery or universal relative screening on the basis of family
    history alone.
  proposed_experiments:
  - name: Prospective screening-protocol-matched comparison of familial and sporadic
    experiment_id: fnmtc-exp-screening-matched-cohort
    description: Prospective screening-protocol-matched comparison of familial and sporadic cohorts, with lead-time and length-time bias correction.
  - name: Registry-based analysis of familial versus sporadic outcomes
    experiment_id: fnmtc-exp-registry-detection-mode
    description: Registry-based analysis of familial versus sporadic outcomes stratified by whether the index case was detected by family screening or by symptoms.
    decision_criterion: >-
      Attenuation of the familial-versus-sporadic difference within the
      symptom-detected stratum would indicate the effect is substantially a
      product of detection mode rather than of tumour biology.
  - name: Prospective parent-offspring germline telomere-length measurement
    experiment_id: fnmtc-exp-parent-offspring-telomere-length
    description: >-
      Measure germline leukocyte telomere length prospectively in
      parent-offspring pairs within the same FNMTC kindreds, to test the one
      proposed molecular substrate for anticipation directly and to reconcile
      the telomere-shortening and telomere-lengthening literatures collected
      under the telomere_length_predisposition hypothesis group.
    decision_criterion: >-
      A systematic intergenerational change in telomere length that tracks age
      at diagnosis would supply the missing molecular substrate and move the
      clinical_anticipation hypothesis off ALTERNATIVE; no such gradient would
      leave ascertainment as the parsimonious explanation.
  evidence:
  - reference: PMID:25637073
    reference_title: "Endocrine tumours: familial nonmedullary thyroid carcinoma is a more aggressive disease: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FNMTC possessed more aggressive biological behaviors, characterized by younger age at diagnosis (SMD=-0.91, 95% CI: -1.59 to -0.22), higher risk of multifocal (OR=1.50, 95% CI: 1.32 to 1.71), bilateral (OR=1.29, 95% CI: 1.00 to 1.66), extrathyroidal invasion (OR=1.20, 95% CI: 1.02 to 1.41), and lymph node metastasis (OR=1.18, 95% CI: 1.01 to 1.38)."
    explanation: >-
      Pooled effect sizes for the "more aggressive presentation" side of the
      controversy, across 12 studies and 12,741 participants.
  - reference: PMID:25637073
    reference_title: "Endocrine tumours: familial nonmedullary thyroid carcinoma is a more aggressive disease: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FNMTC patients had an increased rate of recurrence (OR=1.72, 95% CI: 1.34 to 2.20) and decreased disease-free survival (DFS) (HR=1.83, 95% CI: 1.34 to 2.52) in comparison with SNMTC patients."
    explanation: >-
      The strongest quantitative claim that the presentation difference does
      translate into a worse outcome - the counter to the detection-bias reading.
  - reference: PMID:40908394
    reference_title: "Relationship between affected family members and clinical aggressiveness in Familial non-medullary thyroid carcinoma: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical aggressiveness of FNMTC escalates with increasing numbers of affected family members."
    explanation: >-
      2025 meta-analysis of 3,036 FNMTC and 10,497 sporadic patients showing a
      dose-response with pedigree size. A dose-response is harder to explain by
      detection bias alone and is the strongest argument for a real biological
      component.
  - reference: PMID:40908394
    reference_title: "Relationship between affected family members and clinical aggressiveness in Familial non-medullary thyroid carcinoma: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distant metastasis (OR: 2.43 and 3.93)"
    explanation: >-
      Distant metastasis carries the largest familial-versus-sporadic effect of
      any feature - and, unlike tumour size or nodal status, is the least
      plausible product of earlier detection.
  - reference: PMID:40392709
    reference_title: Comparison of Progression-Free Survival in Familial Non-Medullary Thyroid Cancer and Sporadic Differentiated Thyroid Cancer Patients.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No difference in PFS between FNMTC and sDTC patients suggests comparable responsiveness to standard therapy."
    explanation: >-
      Matched cohort finding no progression-free-survival penalty. Note the
      important caveat that it matched 100% on ATA recurrence risk, i.e. it
      conditions on the aggressiveness variable in dispute, so it argues more
      directly that familial tumours respond normally to therapy than that they
      are biologically equivalent.
  - reference: PMID:28942234
    reference_title: "Second generation of familial nonmedullary thyroid carcinoma: A meta-analysis on the clinicopathologic features and prognosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There was significant difference between the first and second generation of parent/offspring type FNMTC in the age of onset (SMD = -1.20, 95% CI: -2.38, -0.03, p = 0.045), gender distribution (OR = 0.48, 95% CI: 0.25, 0.90, p = 0.022) and lymph node metastasis (OR = 1.84, 95%CI: 1.16, 2.92, p = 0.01), while no significant difference in other variables."
    explanation: >-
      Delimits, rather than refutes, the generational claim. In this six-study
      424-subject meta-analysis three variables reached significance - age of
      onset, gender distribution, and lymph node metastasis (OR 1.84) - and the
      authors conclude the second generation is at higher risk. Tagged PARTIAL
      because that is a narrow and partly non-aggressiveness set of variables on
      a small pooled sample, and because a generational difference in nodal
      metastasis is exactly what intensified surveillance of known families
      would NOT predict, so it cuts against the pure-ascertainment reading
      rather than supporting it. An earlier version of this item quoted only the
      bare trailing clause and described significance as limited to age and sex,
      omitting the lymph node result; that misread the source and is corrected
      here.
- discussion_id: fnmtc-mondo-granularity
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Which MONDO term should host FNMTC, and should the entity that hosts it
    include the syndromic forms or only the non-syndromic (pure) form?
  rationale: >-
    Neither available MONDO term is a clean fit, and the mismatch is worth
    recording rather than papering over. MONDO:0017895 ("familial papillary or
    follicular thyroid carcinoma") carries `subset: obsoletion_candidate`, is a
    direct child of MONDO:0017896 that it effectively duplicates, and takes the
    Orphanet synonym "familial pure nonmedullary thyroid carcinoma", which reads
    as the non-syndromic form specifically. The obvious fallback does NOT
    resolve the mismatch either: MONDO:0017896 is itself defined as "a rare
    non-syndromic form of thyroid cancer" and carries `subset: disease_grouping`
    / `subset: ordo_group_of_disorders`, so anchoring there still excludes the
    syndromic forms and additionally anchors a Disease entry on a grouping term.
    This entry takes option (b) below: it anchors `disease_term` on
    MONDO:0017896, scopes itself to the non-syndromic form, keeps MONDO:0017895
    as a skos:closeMatch, and models the recognised syndromic causes (APC, PTEN,
    PRKAR1A, WRN, DICER1) as differential_diagnoses plus typed `genetic`
    entries that point at their own full dismech entries, rather than as
    has_subtypes of this one. The genuine options are (a) treat this entry as a
    clinical umbrella carrying both non-syndromic loci and syndromic forms as
    has_subtypes, matching how the clinical literature partitions FNMTC but
    contradicting both MONDO definitions; (b) the scoping used here; or (c)
    model the clinical umbrella as a dismech Grouping over the existing
    syndromic disease entries plus this non-syndromic Disease entry, which is
    exactly what the Grouping class exists for. Option (c) is probably the right
    long-term answer but is a lump-versus-split judgement that should be made
    once, deliberately, for the whole hereditary-cancer area rather than
    unilaterally here - flagging for human adjudication by @cmungall.
- discussion_id: fnmtc-two-relative-definition
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - diagnosis#Pedigree-Based Clinical Definition
  prompt: >-
    Is the conventional two-affected-first-degree-relative definition of FNMTC
    fit for purpose, or should the threshold be three?
  rationale: >-
    This is not a terminological quibble - it silently determines every
    statistic in this entry, because a cohort assembled under the two-relative
    rule is diluted with coincidental clusters and will understate any true
    familial effect. For raising the threshold: a probability argument (Charkes)
    concludes that 62-69% of two-case families are coincidental sporadic
    clustering; prospective screening yield tracks the same gradient, at 4.6%
    cancer detection in two-case families versus 22.7% in families with three or
    more affected members; and a 2025 meta-analysis finds that clinical
    aggressiveness escalates with the number of affected relatives, proposing
    that three-or-more-case families be treated as a distinct high-risk
    subgroup. Against raising it: population-registry data show that more than
    90% of familial cancer clusters contain only two affected members, so a
    three-relative rule would exclude most genuinely low-penetrance familial
    disease - precisely the disease that the polygenic model predicts should
    dominate. The definition used in this entry remains two or more first-degree
    relatives, matching the clinical literature, with the dilution caveat
    carried explicitly here and in the Pedigree-Based Clinical Definition
    diagnosis entry.
  proposed_experiments:
  - name: Pedigree-size-stratified reanalysis of pooled FNMTC cohorts
    experiment_id: fnmtc-exp-pedigree-size-stratified-reanalysis
    description: >-
      Reanalyse pooled familial cohorts with every outcome reported separately
      for two-case and three-or-more-case kindreds, rather than pooling them
      under a single FNMTC label.
    decision_criterion: >-
      If effect estimates in two-case families collapse toward the sporadic
      null while three-or-more-case families retain them, the two-relative
      definition is diluting the entity and the threshold should be raised for
      research use even if retained clinically.
  evidence:
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to his mathematical simulation, 62–69% of 2-hit families are sporadic occurrences and thus, only families with 3 or more affected first-degree relatives should be considered for clinical and genetic investigations of FNMTC."
    explanation: The probability argument for raising the threshold to three relatives.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "more than 90% of familial cancers were in families with two affected members"
    explanation: >-
      The counterargument - a three-relative rule would exclude the great
      majority of familial clusters, i.e. most of the low-penetrance disease the
      polygenic model predicts.
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thyroid cancer was detected by screening in 4.6% (2/43) of at-risk individuals from families with two members affected, and in 22.7% (15/66) of at-risk members from families with three or more patients affected (p = 0.01)."
    explanation: Empirical screening-yield gradient supporting stratification by pedigree size.
  - reference: PMID:40908394
    reference_title: "Relationship between affected family members and clinical aggressiveness in Familial non-medullary thyroid carcinoma: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical aggressiveness of FNMTC escalates with increasing numbers of affected family members."
    explanation: >-
      2025 meta-analytic support for treating pedigree size as a graded risk
      variable rather than a binary inclusion criterion.
notes: >-
  Scope and relationship to sibling entries. FNMTC is the familial *predisposition*
  entity; the tumors it predisposes to are histologically and molecularly the
  sporadic entities already curated in this knowledge base -
  Papillary_Thyroid_Carcinoma, Thyroid_Follicular_Carcinoma,
  BRAF_Mutant_Thyroid_Cancer and RET_Fusion_Thyroid_Cancer. Their somatic-driver
  content (BRAF V600E, RAS, RET/PTC and NTRK fusions, TERT promoter mutation) is
  deliberately NOT duplicated here; this entry models only the germline
  susceptibility layer and the way it changes tumor multiplicity, age at
  presentation, and family management. Likewise the syndromic differentials are
  cross-referenced under differential_diagnoses rather than re-curated:
  Classic_Familial_Adenomatous_Polyposis, Cowden_Syndrome,
  PTEN_Hamartoma_Tumor_Syndrome and Medullary_Thyroid_Carcinoma already exist.

  Ontology anchoring. `disease_term` is bound to MONDO:0017896 rather than to
  MONDO:0017895, the term named in the originating issue, because MONDO tags
  MONDO:0017895 with `subset: obsoletion_candidate` and places it as a direct
  child of MONDO:0017896 that it effectively duplicates. MONDO:0017895 is retained
  under `mappings.mondo_mappings` as a skos:closeMatch. Neither term is a clean
  fit for a syndromic-inclusive umbrella - MONDO:0017896 is itself defined as
  "a rare non-syndromic form of thyroid cancer" and carries
  `subset: disease_grouping` - which is why this entry scopes to the
  non-syndromic form and treats the syndromic causes as differentials. The open
  lump-versus-split question, including whether a dismech Grouping would model
  the clinical umbrella better, is tracked in the `fnmtc-mondo-granularity`
  discussion and flagged for human adjudication.

  Mechanistic hypothesis groups. Three explanatory models are declared under
  `mechanistic_hypotheses` and wired to the causal edges that belong to them, so
  that consumers can filter the pathograph by which model they accept:
  `habp2_g534e_susceptibility` (DEPRECATED - the refuted HABP2 branch, retained
  deliberately rather than deleted), `telomere_length_predisposition` (EMERGING -
  carries the directionally opposite telomere-shortening and telomere-lengthening
  arms together, because they may describe different subgroups), and
  `clinical_anticipation` (ALTERNATIVE, never CANONICAL - the observation is
  real but its interpretation as true anticipation is not established).

  Evidence limitations. Three limitations should be carried forward by any
  consumer of this entry. First, two-case families are substantially contaminated
  by coincidental clustering of a common sporadic cancer, so any statistic
  computed over two-case kindreds overstates the inherited component. Second, most
  candidate-gene reports are single-family or underpowered and lack independent
  replication - the HABP2 episode is the cautionary case, and SRRM2, MAP2K5 and
  DUOX2 are in the same category. Third, screening intensity within known families
  systematically distorts apparent age at onset, tumor size, and aggressiveness.
  A dedicated Orphanet-sourced epidemiology record could not be added because the
  local Orphadata snapshot is unavailable in this working tree.

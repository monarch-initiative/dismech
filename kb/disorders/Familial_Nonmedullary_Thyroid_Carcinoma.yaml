    explanation: >-
      Establishes the burden of surgically confirmed nodal metastasis that neck
      dissection addresses; the abstract does not itself evaluate the operation, so
      support for the intervention is indirect.
- name: Radioactive Iodine Therapy
  description: >-
    Adjuvant radioiodine (I-131) is selected after surgery according to recurrence
    risk and radioiodine avidity, exactly as for sporadic differentiated thyroid
    cancer. Family history is not itself an indication.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radioactive Iodine Therapy

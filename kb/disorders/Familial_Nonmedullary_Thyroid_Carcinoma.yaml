name: Familial Nonmedullary Thyroid Carcinoma
creation_date: '2026-07-31T18:30:00Z'
description: >-
  Familial nonmedullary thyroid carcinoma (FNMTC) is the inherited predisposition
  to thyroid carcinoma arising from thyroid follicular cells (non-medullary,
  predominantly papillary histology). It is defined clinically by the occurrence
  of non-medullary thyroid carcinoma in two or more first-degree relatives in the
  absence of a recognized predisposing tumor syndrome and in the absence of shared
  antecedent ionizing-radiation exposure, and accounts for roughly 3-15% of
  non-medullary thyroid carcinoma depending on the case definition used. About 5%
  of familial cases are syndromic (familial adenomatous polyposis, Cowden/PTEN
  hamartoma tumor syndrome, Carney complex, Werner syndrome, DICER1 syndrome); the
  remaining ~95% are non-syndromic and are the subject of this entry. Non-syndromic
  FNMTC is not a single-gene Mendelian disease: it is markedly genetically
  heterogeneous, most often modeled as a polygenic trait built from multiple low-
  to moderate-penetrance susceptibility alleles, or as autosomal-dominant
  susceptibility with reduced, age-dependent penetrance and variable expressivity.
  Numerous candidate genes (FOXE1, SRGAP1, NKX2-1/TITF-1, SRRM2, MAP2K5, DUOX2,
  HABP2) and linkage loci (TCO/19p13.2, fPTC-PRN/1q21, NMTC1/2q21, MNG1/14q32,
  FTEN/8p23.1-p22, 6q22, 8q24) have been reported, but no single gene explains the
  majority of families and several reported associations have failed replication.
  Familial tumors are histologically indistinguishable from sporadic papillary and
  follicular carcinoma and carry the same somatic drivers, so FNMTC is best modeled
  as the familial predisposition layer sitting above the sporadic molecular
  entities rather than as a distinct tumor type.
synonyms:
- FNMTC
- Familial non-medullary thyroid cancer
- Familial nonmedullary thyroid gland carcinoma
- Familial papillary thyroid carcinoma
- Familial pure nonmedullary thyroid carcinoma
- Thyroid cancer, nonmedullary

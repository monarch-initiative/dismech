- name: Perturbed Thyroid Transcription Factor and Growth-Regulatory Signaling
  description: >-
    Functionally characterized FNMTC candidate variants converge on loss of normal
    restraint over follicular-cell proliferation and differentiation. The germline
    NKX2-1/TITF-1 A339V variant increases proliferation and thyrotropin-independent
    growth while impairing transcription of the thyroid-differentiation genes Tg,
    TSH-R and Pax-8; a germline FOXE1 p.A248G variant promotes proliferation and
    migration; SRGAP1 variants abolish the protein's ability to inactivate CDC42,
    a Rho-family GTPase controlling cytoskeletal and growth signaling; and an
    SRRM2 splicing-factor variant shifts alternative splicing of downstream
    targets. Individually these are low-penetrance or family-specific effects, but
    they share the outcome of a follicular cell that is more permissive to
    transformation.

- name: HABP2
  association: Disputed - the p.G534E variant was proposed as a dominant susceptibility allele but failed replication and is common in the general population
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HABP2
    term:
      id: hgnc:4798
      label: HABP2
  variants:
  - name: p.G534E
    description: >-
      HABP2 c.1601G>A (p.G534E, rs7080536) at 10q25.3, within the serine
      protease trypsin domain, originally proposed as an FNMTC susceptibility
      allele; present in 7-9% of unselected populations and failing
      cosegregation in independent kindreds.
    type: MISSENSE
    clinical_significance: BENIGN
    gene:
      preferred_term: HABP2
      term:
        id: hgnc:4798
        label: HABP2
    evidence:
    - reference: PMID:27530615
      reference_title: HABP2 germline variants are uncommon in familial nonmedullary thyroid cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The G534E variant in HABP2 does not account for the familial nature of NMTC in Australian kindreds, and is common in the general population."
      explanation: >-
        Supports the BENIGN classification - a variant this common in the
        general population that fails to explain familial disease cannot be a
        penetrant predisposition allele.
    - reference: PMID:26745718
      reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant was found to be present in 6.1% familial cases, 8.0% sporadic cases (2 individuals were homozygous for the variant) and 8.7% controls."
      explanation: >-
        Independent case-control frequencies, including homozygotes among
        sporadic cases, corroborating the BENIGN classification.
  notes: >-
    This is the most instructive controversy in FNMTC genetics and is curated with
    both the original report and its refutations. The 2015 report of germline
    HABP2 p.G534E in an FNMTC kindred was rapidly followed by multiple independent
    studies that failed to reproduce cosegregation and found the allele at 7-9%
    frequency in unselected populations - far too common for a highly penetrant
    dominant cancer allele. HABP2 p.G534E should not be treated as a pathogenic
    FNMTC variant or used for predictive testing of relatives.
  evidence:
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a germline variant of HABP2 in seven affected members of a kindred with familial nonmedullary thyroid cancer and in 4.7% of 423 patients with thyroid cancer."
    explanation: The original report proposing germline HABP2 as an FNMTC susceptibility gene.
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies showed that HABP2 has a tumor-suppressive effect, whereas the G534E variant results in loss of function."
    explanation: The functional argument offered in support of the original claim.
  - reference: PMID:27530615
    reference_title: HABP2 germline variants are uncommon in familial nonmedullary thyroid cancer.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for the G534E variant in HABP2 was found in 1 of 37 probands (2.7 %), but did not cosegregate with disease in this kindred, being absent in the proband's affected sister."
    explanation: Direct refutation - the variant failed to cosegregate with disease in the one kindred in which it was found.
  - reference: PMID:27530615
    reference_title: HABP2 germline variants are uncommon in familial nonmedullary thyroid cancer.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for the G534E variant in HABP2 was present in 7.6 % of Busselton Health Study participants (N = 4634, unknown disease status) and 9.3 % of TwinsUK participants (N = 1195, no history of thyroid cancer)."
    explanation: Population-frequency refutation - the allele is far too common to be a highly penetrant dominant cancer-predisposing variant.
  - reference: PMID:27530615
    reference_title: HABP2 germline variants are uncommon in familial nonmedullary thyroid cancer.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The G534E variant in HABP2 does not account for the familial nature of NMTC in Australian kindreds, and is common in the general population."
    explanation: The authors' explicit conclusion rejecting HABP2 p.G534E as the explanation for FNMTC.
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our families are negative for variants reported as likely causative, namely those lying in the HABP2, MAP2K5 and DUOX2 genes."
    explanation: Independent Italian series of 33 unrelated FNMTC families is negative for the HABP2 variant, further refuting a general role.
  - reference: PMID:26832773
    reference_title: HABP2 G534E Mutation in Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results are consistent with HABP2 G534E being a susceptibility gene in a subgroup of FNMTC, providing important diagnostic implications for this hereditary thyroid cancer."
    explanation: >-
      The one substantial independent report favouring a susceptibility role,
      carried so the DISPUTED typing rests on both sides of the literature.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant did not segregate with PTC in one large and 6 smaller families in which it occurred."
    explanation: Segregation failure across seven independent carrier families.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In keeping with data from the literature and databases the expression of HABP2 was highest in the liver, much lower in 3 other tested tissues (breast, kidney, brain) but not found in thyroid."
    explanation: >-
      Absence of HABP2 expression in thyroid is an independent biological
      argument against a thyroid-autonomous tumour-suppressor role.
  - reference: PMID:26906432
    reference_title: HABP2 Gene Mutations Do Not Cause Familial or Sporadic Non-Medullary Thyroid Cancer in a Highly Inbred Middle Eastern Population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the familial NMTC carried HABP2 mutations. Of 509 sporadic NMTC, only one case (0.2%) harbored the G534E variant."
    explanation: >-
      Non-replication in a large, highly consanguineous Middle Eastern series,
      extending the refutation beyond European and Australian cohorts.

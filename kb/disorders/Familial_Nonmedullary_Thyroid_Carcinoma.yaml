    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrate that fPTC patients have a significant increase in spontaneous telomeric associations and telomeric fusions compared with healthy subjects and sporadic cases in the frame of an otherwise common spontaneous chromosome fragility pattern."
    explanation: Supports measurable constitutional chromosomal instability in familial cases, the basis for the genome_instability_mutation conformance.
  downstream:
  - target: Acquisition of Somatic MAPK-Activating Driver Alterations
    description: >-
      Constitutional telomeric instability plausibly raises the rate at which
      follicular cells acquire and fix oncogenic somatic alterations.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Acquisition of Somatic MAPK-Activating Driver Alterations
  description: >-
    Familial and sporadic non-medullary thyroid carcinoma share the same
    morphology and the same somatic driver landscape - BRAF V600E, RAS-family
    mutations, RET/PTC and NTRK fusions - so the germline susceptibility layer
    does not create a distinct tumor genotype; it raises the probability that a
    follicular cell acquires one of the ordinary MAPK-activating drivers, and it
    does so in many cells at once, which is the mechanistic basis for the excess
    multifocality and bilaterality of familial tumors. Somatic BRAF V600E has been
    documented in the tumors of family members carrying a segregating germline
    FOXE1 variant, directly illustrating the germline-plus-somatic two-layer model.
    The somatic driver biology itself is curated in the sporadic entries
    (Papillary Thyroid Carcinoma, Thyroid Follicular Carcinoma,
    BRAF Mutant Thyroid Cancer, RET Fusion Thyroid Cancer) and is not duplicated
    here.

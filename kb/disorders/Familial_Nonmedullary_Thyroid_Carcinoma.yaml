mechanistic_hypotheses:
- hypothesis_group_id: habp2_g534e_susceptibility
  hypothesis_label: HABP2 p.G534E as an FNMTC susceptibility allele
  status: DEPRECATED
  description: >-
    Proposed in 2015 on the basis of cosegregation in a single kindred,
    enrichment in TCGA papillary thyroid cancers (4.7% versus 0.7%), and
    dominant-negative functional assays; supported in one independent kindred
    series. Contradicted by at least four independent replication studies on
    three grounds: failure of cosegregation within families carrying the
    variant, population carrier frequencies of 7.6-9.3% incompatible with a
    high-penetrance allele, and absence of HABP2 expression in thyroid tissue.
    Marked DEPRECATED because the weight of replication is against a causal
    role and contemporary reviews treat G534E as a common polymorphism or a
    private variation rather than an FNMTC gene. Retained explicitly rather
    than deleted, because the controversy is itself instructive and the
    supporting reports remain in the literature. The narrow residual question -
    whether the allele could act as a very-low-penetrance modifier in some
    ancestries - is tracked in the fnmtc-habp2-controversy discussion.
  evidence:
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that HABP2 is a susceptibility gene for thyroid cancer of follicular-cell origin."
    explanation: The originating claim.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Given these results showing lack of any involvement we suggest that the putative role of variant HABP2 in PTC should be carefully scrutinized."
    explanation: The most-cited refutation.
  - reference: PMID:26906432
    reference_title: HABP2 Gene Mutations Do Not Cause Familial or Sporadic Non-Medullary Thyroid Cancer in a Highly Inbred Middle Eastern Population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, HABP2 mutations were not found in familial NMTC, and the G534E variant is not the underlying genetic defect in a large sample of sporadic NMTC from the Middle East."
    explanation: Independent non-replication in a large familial and sporadic series.
- hypothesis_group_id: telomere_length_predisposition
  hypothesis_label: Germline telomere-length dysregulation as an FNMTC predisposition mechanism
  status: EMERGING
  description: >-
    Two directionally opposite versions of a telomere hypothesis coexist in
    this entry and are deliberately both curated. The older version holds that
    familial papillary thyroid cancer patients carry SHORTER germline and
    somatic telomeres with hTERT amplification and excess spontaneous telomeric
    associations and fusions - the constitutional chromosome-fragility arm
    modelled by the Telomere-Telomerase Imbalance and Chromosome Fragility
    node; support is inconsistent, with at least one study finding no
    difference between familial and sporadic cases. The newer and
    better-powered version holds that germline LENGTHENING variants in the
    shelterin proteins POT1, TINF2 and ACD define a syndromic long-telomere
    papillary thyroid cancer subtype present in 4.5% of familial cases, with
    the mechanism being an expanded replicative reserve. The two point in
    opposite directions but are not strictly incompatible: shelterin variants
    account for only a small minority of familial cases, so the two literatures
    may simply describe different subgroups. Status EMERGING because the
    relationship is unresolved.
  evidence:
  - reference: PMID:38688277
    reference_title: Telomere-lengthening germline variants predispose to a syndromic papillary thyroid cancer subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We tested whether variants in POT1 and four other telomere-maintenance genes associated with familial cancer underlie PTC susceptibility."
    explanation: The telomere-lengthening arm of the hypothesis.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Some studies have demonstrated that FNMTC patients have shorter germline and somatic telomere length suggesting the role of telomere shortening in the development of FNMTC"
    explanation: >-
      Records the older telomere-SHORTENING arm, which reports the opposite
      direction of effect from the shelterin literature.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, another study did not shown any differences in telomere length and telomerase activity between familial and sporadic PTC cases"
    explanation: Records the inconsistency within the telomere-shortening arm itself.
- hypothesis_group_id: clinical_anticipation
  hypothesis_label: Genetic anticipation in FNMTC across generations
  status: ALTERNATIVE
  description: >-
    Several series report that the second generation of parent-child FNMTC
    kindreds presents at an earlier age, with more multifocal and bilateral
    tumours, more nodal metastases and worse outcome than the first generation,
    and a six-study meta-analysis confirms a younger age of onset in the second
    generation. No repeat expansion or other molecular anticipation mechanism
    has been demonstrated; the one candidate substrate is progressive
    intergenerational telomere lengthening in shelterin-variant kindreds, which
    applies to only a small minority of families. The competing explanation is
    structural: once a parent is diagnosed, offspring enter surveillance and are
    therefore diagnosed earlier and at smaller size by construction, and
    prospective screening data confirm that this mechanism operates. Curated as
    ALTERNATIVE and never CANONICAL - the observation is real, but its
    interpretation as true genetic anticipation is not established.
  evidence:
  - reference: PMID:18832444
    reference_title: Familial non-medullary thyroid carcinoma displays the features of clinical anticipation suggestive of a distinct biological entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, FNMTC displays the features of clinical 'anticipation' with the second generation acquiring the disease at an earlier age and having more advanced disease at presentation."
    explanation: The originating observation of clinical anticipation in FNMTC.
  - reference: PMID:28942234
    reference_title: "Second generation of familial nonmedullary thyroid carcinoma: A meta-analysis on the clinicopathologic features and prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus we conclude that the second generation of parent/offspring type FNMTC patients is in higher risk than their first generation counterpart."
    explanation: Meta-analytic confirmation of the generational difference.
  - reference: PMID:38688277
    reference_title: Telomere-lengthening germline variants predispose to a syndromic papillary thyroid cancer subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Successive generations had longer telomere length than their parents and, at times, developed more cancers at younger ages."
    explanation: >-
      The only reported molecular substrate that could make anticipation genuine
      in a subset of families - progressive intergenerational telomere
      lengthening, distinct from a repeat expansion.
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "FNMTC detected by screening was characterized by a smaller tumor size"
    explanation: >-
      Demonstrates the ascertainment mechanism that can generate apparent
      anticipation - surveillance shifts detection earlier and to smaller
      tumours independently of any change in biology. Tagged PARTIAL, not
      REFUTE, because the study is a screening-yield analysis and never
      addresses anticipation directly.
phenotypes:
- category: Neoplasm
  name: Non-Medullary Thyroid Carcinoma
  description: >-
    The defining phenotype of the entity - thyroid carcinoma arising from
    follicular cells. Medullary thyroid carcinoma of parafollicular C-cell
    origin is explicitly excluded, which is why this HPO term rather than the
    generic thyroid-carcinoma parent is used as the disease-defining descriptor.
  frequency: OBLIGATE
  diagnostic: true
  phenotype_term:
    preferred_term: Non-medullary thyroid carcinoma
    term:
      id: HP:0040198
      label: Non-medullary thyroid carcinoma
  evidence:
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thyroid cancers of follicular-cell origin account for more than 95% of all cases of thyroid cancer, with the remaining cancers originating from parafollicular cells (medullary thyroid cancer)."
    explanation: >-
      Defines the follicular-cell versus parafollicular-cell boundary that makes
      "non-medullary" the operative disease-defining phenotype.
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The term familial non-medullary thyroid cancers (FNMTCs) is used to indicate thyroid tumors, arising from follicular cells, which are observed in two or more first-degree relatives in the absence of predisposing environmental factors."
    explanation: >-
      Confirms follicular-cell origin as definitional, supporting the OBLIGATE
      frequency band.
- category: Neoplasm
  name: Papillary Thyroid Carcinoma
  description: >-
    Papillary carcinoma is the dominant histology in familial kindreds, in classic
    and follicular-variant forms, and is morphologically indistinguishable from
    sporadic papillary thyroid carcinoma.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Papillary thyroid carcinoma
    term:
      id: HP:0002895
      label: Papillary thyroid carcinoma
  evidence:
  - reference: PMID:35295987
    reference_title: "Susceptibility Genes and Chromosomal Regions Associated With Non-Syndromic Familial Non-Medullary Thyroid Carcinoma: Some Pathogenetic and Diagnostic Keys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases are papillary thyroid carcinoma (classic and follicular variant), usually accompanied by benign thyroid nodules (follicular thyroid adenoma and/or multinodular goiter)."
    explanation: Supports papillary carcinoma as the predominant (very frequent) histology of non-syndromic FNMTC.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial non-medullary thyroid carcinoma (FNMTC), mainly of papillary histotype (FPTC), is defined by the presence of the disease in two or more first-degree relatives in the absence of other known familial syndromes."
    explanation: Confirms the papillary histotype predominance that justifies the VERY_FREQUENT band.
- category: Neoplasm
  name: Follicular Thyroid Carcinoma
  description: >-
    A minority of familial non-medullary tumors are follicular carcinoma; oncocytic
    (Hurthle cell) carcinoma is rarer still and defines the TCO branch of the
    linkage literature, in which thyroid tumors show cell oxyphilia.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Follicular thyroid carcinoma
    term:
      id: HP:0006731
      label: Follicular thyroid carcinoma
  evidence:
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, both the benign and malignant thyroid tumors in this family exhibit some extent of cell oxyphilia, which, until now, had not been described in the FNMTC."
    explanation: Documents non-papillary (oxyphilic follicular) malignant histology within an FNMTC kindred.
- category: Neoplasm
  name: Multifocal and Bilateral Thyroid Carcinoma
  description: >-
    Familial tumors are more often multicentric and bilateral than matched sporadic
    papillary carcinoma, consistent with transformation arising in a field of
    inherited susceptibility rather than from a single clone.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Multifocal thyroid carcinoma
    term:
      id: HP:0002890
      label: Thyroid carcinoma
  evidence:
  - reference: PMID:26191611
    reference_title: Clinicopathological features and prognosis of familial papillary thyroid carcinoma--a large-scale, matched, case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with sporadic PTC, patients with FPTC were more likely to present tumour multicentricity, bilateral growth and a concomitant nodular goitre"
    explanation: Matched case-control study of 372 familial versus 372 sporadic papillary carcinomas supports excess multicentricity and bilaterality.
  - reference: PMID:18832444
    reference_title: Familial non-medullary thyroid carcinoma displays the features of clinical anticipation suggestive of a distinct biological entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant difference between sporadic PTC and FNMTC patients included more frequent tumor multifocality (P=0.001) and worse final outcome in FNMTC patients (P=0.001)."
    explanation: Independent cohort comparison supporting excess multifocality in familial versus sporadic disease.
  - reference: PMID:11438887
    reference_title: Localization of a susceptibility gene for familial nonmedullary thyroid carcinoma to chromosome 2q21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The familial form of nonmedullary thyroid carcinoma (NMTC) is a complex genetic disorder characterized by multifocal neoplasia and a higher degree of aggressiveness than its sporadic counterpart."
    explanation: Independently characterizes multifocal neoplasia as a defining clinical feature of familial NMTC.
- category: Neoplasm
  name: Benign Thyroid Nodules and Multinodular Goiter
  description: >-
    Benign follicular adenoma and multinodular goiter frequently accompany the
    malignant tumor in the same gland and are also enriched among unaffected
    relatives, which is why nodule detection - rather than a symptom - is the usual
    presentation.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Multinodular goiter
    term:
      id: HP:0005987
      label: Multinodular goiter
  evidence:
  - reference: PMID:35295987
    reference_title: "Susceptibility Genes and Chromosomal Regions Associated With Non-Syndromic Familial Non-Medullary Thyroid Carcinoma: Some Pathogenetic and Diagnostic Keys."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "usually accompanied by benign thyroid nodules (follicular thyroid adenoma and/or multinodular goiter)"

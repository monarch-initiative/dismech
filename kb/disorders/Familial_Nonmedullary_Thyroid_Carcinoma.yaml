    snippet: "Significant difference between sporadic PTC and FNMTC patients included more frequent tumor multifocality (P=0.001) and worse final outcome in FNMTC patients (P=0.001)."
    explanation: Independent cohort comparison supporting excess multifocality in familial versus sporadic disease.
  - reference: PMID:11438887
    reference_title: Localization of a susceptibility gene for familial nonmedullary thyroid carcinoma to chromosome 2q21.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The familial form of nonmedullary thyroid carcinoma (NMTC) is a complex genetic disorder characterized by multifocal neoplasia and a higher degree of aggressiveness than its sporadic counterpart."
    explanation: Independently characterizes multifocal neoplasia as a defining clinical feature of familial NMTC.

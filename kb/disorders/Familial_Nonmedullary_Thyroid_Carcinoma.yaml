- category: Neoplasm
  name: Thyroid Nodule
  description: >-
    The usual clinical presentation is an asymptomatic thyroid nodule found on
    palpation or, increasingly, on ultrasound performed because of family
    history. Split out from the bundled benign-nodule/goiter phenotype above so
    that the discrete nodule - the actual index lesion, and the object of the
    0.5 cm biopsy threshold used in FNMTC screening cohorts - is separately
    queryable from diffuse multinodular goiter. Nodules are also common in
    unaffected relatives, which is what makes screening yield hard to interpret.
    No frequency band is asserted: the cited evidence describes a screening
    protocol rather than quantifying nodule prevalence in FNMTC.
  phenotype_term:
    preferred_term: Thyroid nodule
    term:
      id: HP:0025388
      label: Thyroid nodule
  evidence:
  - reference: PMID:28657510
    reference_title: Results of Screening in Familial Non-Medullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A prospective cohort study was performed with yearly screening using neck ultrasound and fine-needle aspiration biopsy of thyroid nodule(s) >0.5 cm in at-risk individuals whose relatives were diagnosed with familial non-medullary thyroid cancer (FNMTC)."
    explanation: >-
      Documents the thyroid nodule as the screening target and index lesion in
      at-risk FNMTC relatives, and the size threshold applied to it.
- category: Systemic
  name: Cervical Lymphadenopathy
  description: >-
    Regional cervical nodal metastasis is common at presentation and is reported
    more often in second-generation than first-generation affected family members.
  phenotype_term:
    preferred_term: Cervical lymphadenopathy
    term:
      id: HP:0025289
      label: Cervical lymphadenopathy
  evidence:
  - reference: PMID:18832444
    reference_title: Familial non-medullary thyroid carcinoma displays the features of clinical anticipation suggestive of a distinct biological entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "their tumors were more frequently multifocal (P=0.003) and bilateral (P=0.01), had higher rate of lymph node metastases at surgery (P=0.02) and worse outcome (P=0.04) when compared with the first generation"
    explanation: Documents cervical nodal metastasis in familial kindreds and its generational gradient.
- category: Neoplasm
  name: Extrathyroidal Extension
  description: >-
    Locally invasive growth beyond the thyroid capsule is part of the more
    aggressive presentation reported for familial tumors at diagnosis; it does not
    translate into worse disease-specific outcome once treated appropriately.
  phenotype_term:
    preferred_term: Neoplasm of the thyroid gland
    term:
      id: HP:0100031
      label: Neoplasm of the thyroid gland
  notes: >-
    HPO has no term for extrathyroidal extension specifically, so the descriptor is
    bound to the nearest available thyroid-neoplasm parent and the invasive
    behaviour is carried by preferred_term and description.
  evidence:
  - reference: PMID:33488516
    reference_title: Clinical and Genetic Features of a Large Monocentric Series of Familial Non-Medullary Thyroid Cancers.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that familial tumors had a statistically significant more aggressive presentation at diagnosis, though not resulting in a worst outcome."
    explanation: >-
      Supports the aggressive local presentation of which extrathyroidal extension
      is a component; the abstract does not itself break out the extension rate, so
      support is partial.
- category: Neoplasm
  name: Pulmonary Metastasis
  description: >-
    Distant metastasis, most often pulmonary, occurs in a minority of familial
    cases and follows the ordinary differentiated thyroid-cancer pattern. It is
    uncommon in absolute terms but carries the largest familial-versus-sporadic
    effect size of any feature in FNMTC, and - unlike tumour size or nodal
    status - is the least plausible product of earlier detection, so it is the
    strongest single argument that some of the familial aggressiveness signal is
    real biology rather than surveillance artefact.
  notes: >-
    No `frequency:` band is asserted. The available quantitative source
    (PMID:40908394) reports a relative measure - pooled odds ratios versus
    sporadic disease - not an absolute rate, and no cached abstract gives a
    per-patient distant-metastasis frequency in familial cohorts. A band was
    previously asserted here on a methods sentence that carried no frequency
    information; that is corrected rather than re-sourced.
  phenotype_term:
    preferred_term: Neoplasm of the lung
    term:
      id: HP:0100526
      label: Neoplasm of the lung
  evidence:
  - reference: PMID:40908394
    reference_title: "Relationship between affected family members and clinical aggressiveness in Familial non-medullary thyroid carcinoma: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distant metastasis (OR: 2.43 and 3.93)"
    explanation: >-
      Pooled odds ratios for distant metastasis in two-relative and
      three-or-more-relative familial disease versus sporadic non-medullary
      thyroid carcinoma - the largest familial effect size in this entry's
      evidence base, and a relative rather than absolute measure, which is why
      no frequency band is derived from it.
  - reference: PMID:25637073
    reference_title: "Endocrine tumours: familial nonmedullary thyroid carcinoma is a more aggressive disease: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "FNMTC patients had an increased rate of recurrence (OR=1.72, 95% CI: 1.34 to 2.20) and decreased disease-free survival (DFS) (HR=1.83, 95% CI: 1.34 to 2.52) in comparison with SNMTC patients."
    explanation: >-
      Supports the adverse-outcome dimension of which distant metastasis is the
      most severe component; PARTIAL because the pooled estimate is for
      recurrence and disease-free survival rather than for distant metastasis
      specifically.
- category: Systemic
  name: Earlier Age at Onset in Successive Generations
  description: >-
    Second-generation affected family members present at an earlier age and with
    more advanced disease than the first generation, a pattern described as
    clinical anticipation. Whether this reflects a biological anticipation
    mechanism or ascertainment plus intensified surveillance of known families is
    unresolved; no repeat-expansion mechanism has been demonstrated. The
    interpretation is tracked as the ALTERNATIVE `clinical_anticipation`
    hypothesis group, never as a canonical mechanism.
  notes: >-
    Deliberately left without a `phenotype_term`. HPO's only anticipation
    concept, HP:0003743 "Genetic anticipation", is NOT a phenotypic
    abnormality: `runoak -i sqlite:obo:hp ancestors -p i HP:0003743` returns
    only HP:0000001, HP:0000005 (Mode of inheritance) and HP:0034335
    (Inheritance qualifier), so it is not reachable from HP:0000118 and cannot
    validate against the PhenotypeTerm dynamic enum, whose source nodes are
    HP:0000118 and MONDO:0000001. Its definition ("A type of autosomal dominant
    inheritance involving a gene that exhibits anticipation...") also asserts an
    inheritance mechanism, which would over-commit this entry to the ALTERNATIVE
    anticipation hypothesis rather than merely recording the observation. The
    previous binding to HP:0100031 "Neoplasm of the thyroid gland" was a genuine
    term-claim mismatch and has been removed rather than replaced. An NTR for a
    phenotypic-abnormality term expressing "earlier age at onset in successive
    generations" would be the clean resolution.
  evidence:
  - reference: PMID:18832444
    reference_title: Familial non-medullary thyroid carcinoma displays the features of clinical anticipation suggestive of a distinct biological entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 47 FNMTC with parent-child relationship, we found an earlier age at disease presentation (P<0.0001), diagnosis (P<0.0001), and disease onset (P=0.04) in the second generation when compared with the first generation."
    explanation: Primary quantitative evidence for earlier onset in the second generation.
  - reference: PMID:26191611
    reference_title: Clinicopathological features and prognosis of familial papillary thyroid carcinoma--a large-scale, matched, case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of familial history in PTC indicates an increase in biological aggressiveness, and patients in the second generation may exhibit the 'genetic anticipation' phenomenon."
    explanation: Independent matched case-control replication of the anticipation observation.
- category: Neoplasm
  name: Hurthle Cell Thyroid Adenoma
  subtype: TCO
  description: >-
    Oxyphilic (Hurthle-cell / oncocytic) change in both benign and malignant
    thyroid tumours is the defining histologic signature of the TCO (19p13.2)
    subtype and is not a general feature of FNMTC.
  phenotype_term:
    preferred_term: Hurthle cell thyroid adenoma
    term:
      id: HP:0006781
      label: Hurthle cell thyroid adenoma
  evidence:
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, both the benign and malignant thyroid tumors in this family exhibit some extent of cell oxyphilia, which, until now, had not been described in the FNMTC."
    explanation: >-
      Establishes oxyphilic change in the benign as well as the malignant
      tumours of the TCO kindred, which is what binds this descriptor to the
      adenoma rather than the carcinoma term.
- category: Neoplasm
  name: Papillary Renal Neoplasia
  subtype: fPTC-PRN
  description: >-
    Papillary renal neoplasia occurring together with papillary thyroid
    carcinoma and nodular thyroid disease defines the fPTC/PRN (1q21) subtype.
    It is a subtype-restricted feature, not a feature of FNMTC generally, and is
    the extra-thyroidal finding that should prompt renal imaging in such a
    kindred.
  phenotype_term:
    preferred_term: Papillary renal cell carcinoma
    term:
      id: HP:0006766
      label: Papillary renal cell carcinoma
  evidence:
  - reference: PMID:10843148
    reference_title: "Papillary thyroid carcinoma associated with papillary renal neoplasia: genetic linkage analysis of a distinct heritable tumor syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to the known association of fPTC with nodular thyroid disease, we observed the otherwise rare entity of papillary renal neoplasia (PRN) in two kindred members, one affected with PTC and the other an obligate carrier."
    explanation: >-
      Documents papillary renal neoplasia in the index fPTC/PRN kindred,
      including in an obligate carrier.
- category: Systemic
  name: Hashimoto Thyroiditis
  description: >-
    Coexisting Hashimoto thyroiditis was reported more frequently in the second
    generation of familial papillary thyroid carcinoma kindreds than in the
    first in a large matched case-control study, suggesting an autoimmune
    thyroid component in some families. No frequency band is asserted - the
    cited study reports a between-generation contrast rather than a prevalence.
  phenotype_term:
    preferred_term: Hashimoto thyroiditis
    term:
      id: HP:0000872
      label: Hashimoto thyroiditis
  evidence:
  - reference: PMID:26191611
    reference_title: Clinicopathological features and prognosis of familial papillary thyroid carcinoma--a large-scale, matched, case-control study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients with FPTC in the second generation showed an earlier age of onset, more frequent Hashimoto's thyroiditis and a higher recurrence rate than the first generation"
    explanation: Reports excess Hashimoto thyroiditis in second-generation familial papillary thyroid carcinoma.
histopathology:
- name: Multifocality
  description: >-
    More than one discrete tumour focus within the thyroid, frequently
    bilateral. Reported at higher frequency in familial than in matched sporadic
    disease in independent meta-analyses and is the histopathologic correlate of
    the field-predisposition model.
  frequency: FREQUENT
  notes: >-
    No finding_term is bound. NCIT has no generic "multifocal" morphologic
    finding reachable from the HistopathologyFindingTerm roots - NCIT:C25253
    (Multifocal) is a general qualifier, NCIT:C36180 (Multifocal Lesion) sits
    under Finding / Lesion by Focality, and the reachable multifocal terms are
    all organ-specific tumour classes. Left deliberately unbound rather than
    mis-bound; a candidate NCIT gap.
  evidence:
  - reference: PMID:25637073
    reference_title: "Endocrine tumours: familial nonmedullary thyroid carcinoma is a more aggressive disease: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "higher risk of multifocal (OR=1.50, 95% CI: 1.32 to 1.71), bilateral (OR=1.29, 95% CI: 1.00 to 1.66)"
    explanation: Pooled odds ratios for multifocality and bilaterality across 12 studies.
- name: Oxyphilic (Hurthle) Cell Change
  subtype: TCO
  description: >-
    Oncocytic / oxyphilic cytoplasmic change affecting both benign and malignant
    thyroid tumours within the same kindred. Diagnostic of the TCO (19p13.2)
    subtype rather than of FNMTC generally.
  diagnostic: true
  notes: >-
    No finding_term is bound. The reachable NCIT candidates (NCIT:C7072
    Oncocytic Neoplasm, NCIT:C3759 Oncocytic Adenoma) are neoplasm classes
    rather than the cytologic change being described, and NCIT:C35567 Hurthle
    Cell Metaplasia is a retired concept. Left deliberately unbound rather than
    mis-bound, consistent with the Multifocality entry above; a candidate NCIT
    gap.
  evidence:
  - reference: PMID:9837827
    reference_title: A gene predisposing to familial thyroid tumors with cell oxyphilia maps to chromosome 19p13.2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, both the benign and malignant thyroid tumors in this family exhibit some extent of cell oxyphilia, which, until now, had not been described in the FNMTC."
    explanation: Defines the oxyphilic histopathologic signature of the TCO subtype.
genetic:
- name: FOXE1

    explanation: >-
      Matched-cohort evidence that administered radioiodine activity does not
      differ by familial status, supporting risk-adapted rather than
      familial-status-adapted dosing.
- name: Levothyroxine Replacement and TSH Suppression
  description: >-
    Thyroid hormone replacement is mandatory after total thyroidectomy, with
    risk-adapted TSH suppression as part of standard differentiated thyroid-cancer

- name: HABP2 G534E Loss of Tumor-Suppressor Function
  description: >-
    CONTESTED - retained as a modelled but refuted branch, not part of the
    canonical FNMTC mechanism. In 2015 a germline HABP2 c.1601G>A (p.G534E)
    variant was reported to segregate with disease in all seven affected members
    of one FNMTC kindred, to be present in 4.7% of 423 TCGA papillary thyroid
    cancers, and to behave as a dominant-negative loss of a tumor-suppressive
    function in colony-formation, foci and migration assays performed in
    NIH-3T3 fibroblasts rather than in thyroid cells. One independent kindred
    series supported a susceptibility role in a subgroup. Multiple independent
    replication studies then contradicted causality on three separate grounds:
    failure of cosegregation within carrier families, population carrier
    frequencies of 7.6-9.3% that are incompatible with a highly penetrant
    dominant allele, and absence of HABP2 expression in thyroid tissue. This
    node exists so that the DEPRECATED habp2_g534e_susceptibility hypothesis
    group is wired to real causal edges and the controversy stays auditable
    rather than being silently deleted.
  biological_scale: MOLECULAR
  role: Disputed Branch
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  genes:
  - preferred_term: HABP2
    term:
      id: hgnc:4798
      label: HABP2
  evidence:
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Since we did not find alterations in the other HABP2 allele in the tumor tissue and our functional studies suggested that HABP2 has a tumor-suppressive effect, we cotransfected equal amounts of the wild-type and G534E mutant constructs into NIH-3T3 cells."
    explanation: >-
      The original functional claim - a dominant-negative effect on a
      tumor-suppressive HABP2 function, demonstrated in fibroblasts rather than
      in thyroid cells.
  - reference: PMID:26222560
    reference_title: Germline HABP2 Mutation Causing Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, analysis of TCGA data in 423 patients with papillary thyroid cancer showed that 4.7% carried the HABP2 G534E variant, as compared with 0.7% of persons with unknown disease status in multiethnic population databases (P<0.001)."
    explanation: The case-control frequency argument offered in the original report.
  - reference: PMID:26832773
    reference_title: HABP2 G534E Mutation in Familial Nonmedullary Thyroid Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results are consistent with HABP2 G534E being a susceptibility gene in a subgroup of FNMTC, providing important diagnostic implications for this hereditary thyroid cancer."
    explanation: >-
      The principal independent report favouring a susceptibility role, so both
      sides of the controversy are represented rather than only the refutations.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant did not segregate with PTC in one large and 6 smaller families in which it occurred."
    explanation: >-
      Segregation failure across seven families - the core genetic argument
      against causality.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was found to be present in 6.1% familial cases, 8.0% sporadic cases (2 individuals were homozygous for the variant) and 8.7% controls."
    explanation: >-
      Case and control frequencies are indistinguishable, contradicting the
      enrichment reported in the original study.
  - reference: PMID:26745718
    reference_title: HABP2 G534E Variant in Papillary Thyroid Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In keeping with data from the literature and databases the expression of HABP2 was highest in the liver, much lower in 3 other tested tissues (breast, kidney, brain) but not found in thyroid."
    explanation: >-
      HABP2 is not expressed in thyroid, a strong biological argument against
      any thyroid-autonomous tumour-suppressor role.
  - reference: PMID:26906432
    reference_title: HABP2 Gene Mutations Do Not Cause Familial or Sporadic Non-Medullary Thyroid Cancer in a Highly Inbred Middle Eastern Population.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the familial NMTC carried HABP2 mutations. Of 509 sporadic NMTC, only one case (0.2%) harbored the G534E variant."
    explanation: Complete failure to replicate in familial cases and in 509 sporadic cancers.
  - reference: PMID:33025555
    reference_title: "Familial non-medullary thyroid cancer: a critical review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "All these studies failed in detecting the p.G534E mutation in FNMTC suggesting that Gara et al. identified a private variation"
    explanation: Review-level synthesis reaching the private-variant conclusion.
  downstream:

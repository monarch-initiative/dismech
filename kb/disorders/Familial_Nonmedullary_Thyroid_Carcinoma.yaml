    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Telomere-Telomerase Imbalance and Chromosome Fragility
  description: >-
    Patients with familial papillary thyroid carcinoma show a constitutional
    imbalance of the telomere-telomerase complex in peripheral blood - shorter
    relative telomere length than sporadic cases, unaffected siblings and healthy
    controls, together with hTERT/TERT gene amplification and increased telomerase
    activity. The same familial cohorts show a significant excess of spontaneous
    telomeric associations and telomeric fusions, i.e. measurable constitutional
    chromosome instability. This arm is a candidate constitutional mechanism of
    predisposition, distinct from the tumor-intrinsic telomere-maintenance
    reactivation (TERT promoter mutation) seen in advanced sporadic thyroid cancer.
  biological_scale: CELLULAR
  role: Intermediate
  mechanism_confidence: HYPOTHETICAL
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  notes: >-
    Conformance to genome_instability_mutation#Mutator Phenotype and Chromosomal
    Instability is declared on the strength of the directly measured
    constitutional chromosomal instability in familial cases (excess spontaneous
    telomeric associations and fusions), which is the "chromosomal instability
    with structural rearrangements" manifestation the module node describes. The
    conformance is deliberately partial: the module's upstream arm posits a
    genome-maintenance/DNA-repair defect (GO:0006281 DNA repair, DECREASED), and
    no such repair defect has been demonstrated in non-syndromic FNMTC, so that
    process is not asserted here. The instability is instead approached through
    the telomere-telomerase axis, and mechanism_confidence is set to HYPOTHETICAL
    to reflect that its causal role in predisposition is proposed rather than
    established.

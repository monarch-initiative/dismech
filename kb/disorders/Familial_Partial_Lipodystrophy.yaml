- name: ADRA2A
  display_name: ADRA2A-related partial lipodystrophy (FPLD8)
  subtype_term:
    preferred_term: FPLD8 (ADRA2A-related)
    term:
      id: MONDO:0958022
      label: lipodystrophy, familial partial, type 8
  genes:
  - preferred_term: ADRA2A
    term:
      id: hgnc:281
      label: ADRA2A
  description: >-
    Atypical autosomal dominant partial lipodystrophy reported in a single
    African-American pedigree with a heterozygous ADRA2A p.Leu68Phe variant.
    ADRA2A encodes the presynaptic inhibitory alpha-2A adrenergic receptor;
    activation normally suppresses adipocyte cAMP and lipolysis, and the mutant
    receptor loses that restraint, so the proposed mechanism is excessive
    depot-selective lipolysis rather than failed adipogenesis.
  review_notes: >-
    subtype_term added 2026-09-19. MONDO:0958022 "lipodystrophy, familial
    partial, type 8" is a direct child of this entry's disease term
    MONDO:0020088 (checked via the OLS MONDO parents endpoint) and
    cross-references OMIM:620679, which NCBI's mim2gene_medgen table maps to
    GeneID 150 (ADRA2A). The row previously carried neither a term nor a gene.
  evidence:
  - reference: PMID:27376152
    reference_title: Whole-exome sequencing identifies ADRA2A mutation in atypical familial partial lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous g.112837956C>T mutation on chromosome 10 (c.202C>T, p.Leu68Phe) affecting a highly conserved residue in adrenoceptor alpha 2A (ADRA2A) was found in all affected subjects but not in unaffected relatives.
    explanation: >-
      Segregation of the ADRA2A p.Leu68Phe variant with the lipodystrophy
      phenotype in the founding pedigree is the genetic basis of this subtype.

datasets:
- accession: massive:MSV000096235
  title: NOTCH3 missense variants cause familial partial lipodystrophy
  description: Molecular defects in some ultra-rare subtypes of familial lipodystrophies remain unidentified. We identified novel NOTCH3 heterozygous variants in familial partial lipodystrophy (FPL) pedigrees. All variants were clustered in the heterodimerization domain of the negative regulatory region of NOTCH3. Proteomics of skin fibroblasts revealed significantly higher RNA expression of NOTCH3 and activation of widespread senescence pathways in the FPL patients versus controls.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Familial Partial Lipodystrophy"). Retrieved 2026-08-02.

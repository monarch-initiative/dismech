    term:
      id: GO:0141193
      label: nuclear receptor-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:39398333
    reference_title: "Familial partial lipodystrophy resulting from loss-of-function PPARγ pathogenic variants: phenotypic, clinical, and genetic features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPARγ plays an essential role in adipogenesis, stimulating the
      differentiation of preadipocytes into adipocytes. Loss-of-function
      pathogenic variants in PPARG reduce the activity of the PPARγ receptor and
      can lead to severe metabolic consequences associated with familial partial
      lipodystrophy type 3 (FPLD3).
    explanation: >-
      States both the adipogenic role of PPARgamma and the reduction of receptor
      activity by loss-of-function PPARG variants that this node asserts.
  downstream:
  - target: Impaired adipocyte differentiation and adipose storage capacity
    description: >-
      Reduced PPARgamma transcriptional output blocks preadipocyte
      differentiation, limiting the subcutaneous adipose compartment that can be
      built and maintained.
- name: PLAAT3 loss and phospholipid remodeling of white adipose tissue
  biological_scale: MOLECULAR
  description: >-
    PLAAT3 is a phospholipid-modifying enzyme expressed in neural tissue and
    white adipose tissue. Biallelic loss of function enriches white adipose
    membranes in arachidonic-acid-containing phospholipids and strongly lowers
    PPARgamma signaling, so the lesion is upstream of the adipogenic
    transcriptional program rather than in it. This is the FPLD9 route.
  genes:
  - preferred_term: PLAAT3
    term:
      id: hgnc:17825
      label: PLAAT3
  cell_types:
  - preferred_term: Adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:
  - preferred_term: membrane phospholipid metabolic process
    term:
      id: GO:0006644
      label: phospholipid metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37919452
    reference_title: Loss of phospholipase PLAAT3 causes a mixed lipodystrophic and neurological syndrome due to impaired PPARγ signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multi-omics analysis of mouse Plaat3-/- and patient-derived WAT showed enrichment of arachidonic acid-containing membrane phospholipids and a strong decrease in the signaling of peroxisome proliferator-activated receptor gamma (PPARγ), the master regulator of adipocyte differentiation.
    explanation: >-
      Patient-derived white adipose tissue shows both the phospholipid
      remodeling and the fall in PPARgamma signaling that this node and its
      downstream edge assert.
  - reference: PMID:37919452
    reference_title: Loss of phospholipase PLAAT3 causes a mixed lipodystrophic and neurological syndrome due to impaired PPARγ signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CRISPR-Cas9-mediated PLAAT3 inactivation in human adipose stem cells induced insulin resistance, altered adipocyte differentiation with decreased lipid droplet formation and reduced the expression of adipogenic and mature adipocyte markers, including PPARγ.
    explanation: >-
      Directed inactivation in human adipose stem cells reproduces the
      differentiation defect, establishing the direction of the link rather than
      only its correlation.
  downstream:
  - target: Loss of PPARgamma-driven adipogenic transcription
    description: >-
      Phospholipid remodeling of white adipose membranes lowers PPARgamma
      signaling, joining the FPLD3 route at the adipogenic transcription node.
- name: Adipocyte lipid-droplet formation defect
  biological_scale: CELLULAR
  description: >-
    CIDEC and PLIN1 act at the adipocyte lipid droplet itself. CIDEC is required
    to fuse nascent droplets into the single large unilocular droplet that makes
    white adipocytes efficient triglyceride stores; biallelic CIDEC loss leaves
    multiloculated adipocytes (FPLD5). PLIN1 coats the mature droplet, and the
    FPLD4 frameshift alleles extend its C-terminus and act dominant-negatively
    rather than by haploinsufficiency.
  genes:
  - preferred_term: CIDEC
    term:
      id: hgnc:24229
      label: CIDEC

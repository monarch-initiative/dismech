  evidence:
  - reference: PMID:20049731
    reference_title: Partial lipodystrophy and insulin resistant diabetes in a patient with a homozygous nonsense mutation in CIDEC.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to describing a novel autosomal recessive form of familial partial lipodystrophy, these observations also suggest that CIDEC is required for unilocular lipid droplet formation and optimal energy storage in human fat.
    explanation: >-
      Establishes the unilocular-droplet requirement whose failure is the CIDEC
      arm of this node.
  - reference: CGGV:assertion_dcba327c-dc89-4e78-ae7b-84b23db5429e-2025-09-10T160000.000Z
    reference_title: "PLIN1 / PLIN1-related familial partial lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mechanistic studies suggest that subcutaneous patients’ adipose tissues show reduced full-length perilipin-1 and an extended perilipin-1 form compatible with the predicted elongated C-terminal tail of the mutant proteins
    explanation: >-
      ClinGen's mechanistic review records the altered perilipin-1 protein on the
      droplet in patient adipose tissue, which is the PLIN1 arm of this node.
  downstream:
  - target: Impaired adipocyte differentiation and adipose storage capacity
    description: >-
      Adipocytes that cannot build or coat a normal unilocular droplet store
      triglyceride inefficiently, reducing safe subcutaneous storage capacity.
  - target: Dysregulated adipocyte triglyceride lipolysis
    description: >-
      The same droplet-coat defect removes the perilipin-1 brake on lipase
      access to stored triglyceride.
- name: Dysregulated adipocyte triglyceride lipolysis
  biological_scale: CELLULAR
  description: >-
    Three curated genes disturb the release of stored triglyceride from the
    adipocyte droplet, in opposite directions, which is why the node is tagged
    abnormal rather than increased or decreased. PLIN1 frameshift mutants fail to
    hold ABHD5, so adipose triglyceride lipase is constitutively activated and
    basal lipolysis runs unchecked (FPLD4). The reported ADRA2A variant removes
    the presynaptic alpha-2A adrenergic brake on adipocyte cAMP, again raising
    lipolysis, and is proposed to do so only in some depots (FPLD8). LIPE encodes
    hormone-sensitive lipase itself, so biallelic loss instead impairs
    triglyceride mobilization (FPLD6).
  genes:
  - preferred_term: PLIN1
    term:
      id: hgnc:9076
      label: PLIN1
  - preferred_term: LIPE
    term:

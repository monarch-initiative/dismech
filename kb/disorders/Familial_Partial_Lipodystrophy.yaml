  - reference: CGGV:assertion_dcba327c-dc89-4e78-ae7b-84b23db5429e-2025-09-10T160000.000Z
    reference_title: "PLIN1 / PLIN1-related familial partial lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the p.(Val398Glyfs) and p.(Leu404Alafs) mutants fail to interact with ABHD5, leading to constitutive activation of adipocyte triglyceride lipase
    explanation: >-
      Gives the molecular route from the FPLD4 perilipin-1 alleles to unchecked
      lipolysis asserted in this node.
  - reference: PMID:27376152
    reference_title: Whole-exome sequencing identifies ADRA2A mutation in atypical familial partial lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADRA2A is the main presynaptic inhibitory feedback G protein-coupled receptor regulating norepinephrine release. Activation of ADRA2A inhibits cAMP production and reduces lipolysis in adipocytes.
    explanation: >-
      States the normal restraining role of ADRA2A on adipocyte lipolysis that
      the reported loss-of-function variant removes.
  - reference: PMID:27376152
    reference_title: Whole-exome sequencing identifies ADRA2A mutation in atypical familial partial lipodystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the mutant ADRA2A produced more cAMP and glycerol, which were resistant to the effects of the α2-adrenergic receptor agonist clonidine and the α2-adrenergic receptor antagonist yohimbine, suggesting loss of function.
    explanation: >-
      Cell assays show the mutant receptor raises cAMP and glycerol release,
      the functional signature of increased lipolysis in this node.
  downstream:
  - target: Ectopic lipid deposition and systemic insulin resistance
    description: >-
      Triglyceride that cannot be retained in, or mobilized from, subcutaneous
      adipocytes reaches ectopic depots.
- name: Impaired adipose insulin and PI3K-AKT signaling
  biological_scale: MOLECULAR
  description: >-
    AKT2 is the adipose- and muscle-predominant AKT isoform through which the
    insulin receptor drives glucose uptake, lipogenesis and adipocyte
    differentiation. The reported FPLD allele has little or no kinase activity
    and is dominant-negative, so insulin signaling fails in the adipocyte itself
    rather than downstream of an adipose deficit.

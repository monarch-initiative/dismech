- name: NOTCH3 gain-of-function variants
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  notes: >-
    Heterozygous missense variants clustered in the heterodimerization domain of
    the NOTCH3 negative regulatory region were reported in three unrelated
    families with familial partial lipodystrophy, with patient fibroblasts
    showing raised NOTCH3 expression and activation of senescence pathways. No
    subtype is assigned. OMIM has folded this gene-disease relationship into
    phenotype MIM 608600 (familial partial lipodystrophy type 1, the Koebberling
    type), and MONDO therefore records NOTCH3 as the causal gene of
    MONDO:0012072; the source report instead describes its families as a novel
    subtype of FPL and does not call them Koebberling, so this entry curates the
    gene without asserting that equivalence (see the review_notes on the FPLD1
    subtype). relationship_type is UNKNOWN: the evidence is a single 2025
    publication, the ClinGen validity table committed in this repository has no
    NOTCH3 row for any lipodystrophy (its only NOTCH3 row is a Disputed
    pulmonary arterial hypertension curation), and that publication carries an
    erratum (PMID:41147879) whose content could not be retrieved - see the
    FPLD1 review_notes.
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  inheritance:
  - name: Autosomal dominant
  evidence:
  - reference: PMID:39652711
    reference_title: Gain of Function NOTCH3 Variants Cause Familial Partial Lipodystrophy Due to Activation of Senescence Pathways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analysis of WES data of 222 patients with unexplained FPL identified two unrelated patients with FPL with novel heterozygous (p.Cys1600Tyr and p.Gln1552Pro) NOTCH3 variants.
    explanation: >-
      Two further unrelated probands beyond the index pedigree are the human
      genetic evidence for this gene-disease relationship, and also show how
      narrow it still is.
  - reference: PMID:39652711
    reference_title: Gain of Function NOTCH3 Variants Cause Familial Partial Lipodystrophy Due to Activation of Senescence Pathways.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that gain-of-function missense variants in the negative regulatory region of NOTCH3 cause a novel subtype of FPL by activation of senescence pathways.
    explanation: >-
      The authors' own conclusion, which describes the entity as a novel subtype
      of familial partial lipodystrophy rather than as the Koebberling type that
      OMIM and MONDO attach the gene to.
- name: PLAAT3 biallelic loss-of-function variants (FPLD9)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: FPLD9
  notes: >-
    Homozygous loss-of-function PLAAT3 variants were identified in seven
    patients from four unrelated consanguineous families with a lipodystrophy
    syndrome, with variable neurological involvement. The ClinGen validity table
    committed in this repository contains no PLAAT3 row, so the CAUSATIVE
    relationship_type rests on the primary report - multiple unrelated
    consanguineous families, a concordant mouse knockout, and CRISPR
    inactivation in human adipose stem cells - together with OMIM and MONDO
    recognition of the locus as FPLD9.
  gene_term:
    preferred_term: PLAAT3
    term:
      id: hgnc:17825
      label: PLAAT3
  inheritance:
  - name: Autosomal recessive
  evidence:
  - reference: PMID:37919452
    reference_title: Loss of phospholipase PLAAT3 causes a mixed lipodystrophic and neurological syndrome due to impaired PPARγ signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings establish PLAAT3 deficiency as a hereditary lipodystrophy syndrome with neurological manifestations, caused by a PPARγ-dependent defect in WAT differentiation and function.
    explanation: >-
      The report's own conclusion establishing the gene-disease relationship and
      naming the PPARgamma-dependent mechanism wired on the pathophysiology

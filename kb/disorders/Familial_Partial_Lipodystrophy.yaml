- name: ADRA2A variants (FPLD8)
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  subtype: ADRA2A
  notes: >-
    A heterozygous ADRA2A p.Leu68Phe variant segregated with atypical familial
    partial lipodystrophy in a single African-American pedigree; functional work
    in the same report showed the mutant receptor produced more cAMP and
    glycerol and was resistant to alpha-2 agonist and antagonist, consistent
    with loss of the receptor's normal restraint on adipocyte lipolysis. OMIM
    numbers this FPLD8 (620679) and MONDO carries it as MONDO:0958022.
    relationship_type is UNKNOWN: the evidence is one pedigree, the ClinGen
    validity table committed in this repository contains no ADRA2A row, and the
    European Consortium for Lipodystrophies consensus warns specifically about
    proliferating single-report gene-disease claims in this field.
  gene_term:
    preferred_term: ADRA2A
    term:
      id: hgnc:281
      label: ADRA2A
  evidence:
  - reference: PMID:27376152
    reference_title: Whole-exome sequencing identifies ADRA2A mutation in atypical familial partial lipodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that heterozygous p.Leu68Phe ADRA2A mutation causes a rare atypical FPLD, most likely by inducing excessive lipolysis in some adipose tissue depots.
    explanation: >-
      The founding report's own conclusion, giving both the allele and the
      proposed excessive-lipolysis mechanism curated on the pathophysiology node.
  - reference: PMID:42681552
    reference_title: European Consortium for Lipodystrophies consensus definition and classification framework for monogenic lipodystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Conversely, increasing use of next-generation sequencing has led to proliferation of proposed new genetic causes of lipodystrophy with variable supporting evidence.
    explanation: >-
      The ECLip consensus states the field-level reason this single-pedigree
      association is recorded with an UNKNOWN relationship_type rather than as
      causative.

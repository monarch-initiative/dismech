notes: >-
  FPLD is typically autosomal dominant for the common forms (LMNA, PPARG), while
  CIDEC (FPLD5) and LIPE (FPLD6) are autosomal recessive. FPLD1 (Köbberling) is
  defined clinically with no consistently identified gene. Partial lipodystrophy
  prevalence is estimated at roughly 1.7-2.8 per million, and diagnostic delay is
  substantial (median ~10.5 years for FPLD2 in a French reference-center cohort).
  An adipocyte-specific Lmna-knockout mouse recapitulates adipocyte loss,
  supporting a cell-autonomous role for lamin A/C. This entry is distinct from
  acquired partial lipodystrophy (Barraquer-Simons syndrome, MONDO:0012104),
  which is immune/complement-mediated rather than Mendelian. Note: no dedicated
  GeneReviews chapter exists for familial partial lipodystrophy (PubMed has no
  GeneReviews[Book] record for this condition as of 2026-06); the Fernandez-Pombo
  et al. 2023 systematic review is used as the authoritative baseline reference
  instead.

  GeneReviews, rechecked 2026-09-19. The absence claim above is now checkable
  offline: the committed Bookshelf index (cache/bookshelf/genereviews.csv,
  snapshot 2026-09-10, 958 chapters) contains no chapter for familial partial
  lipodystrophy, and `just check-genereviews` on this file reports NO_CHAPTER.
  The nearest chapters in that index are LMNA-Related Dilated Cardiomyopathy,
  INSR-Related Severe Insulin Resistance Syndrome, and a retired
  Berardinelli-Seip Congenital Lipodystrophy chapter, none of which covers this
  disease.

  Gene scope and dispositions, 2026-09-19. Every gene-defined has_subtypes row
  now carries a genes list, and every genetic record now carries a subtype
  foreign key except the two that deliberately have none: NOTCH3 (see the
  FPLD1 review_notes) and MFN2 (see below). Two MONDO leaf classes that were missing were added as subtype rows:
  MONDO:0958022 (FPLD8), bound to the pre-existing ADRA2A row, and
  MONDO:0958034 (FPLD9, PLAAT3), added new. Both are direct children of this
  entry's disease term MONDO:0020088. FPLD9 is syndromic - fat loss with
  variable demyelinating neuropathy and intellectual disability - and is kept
  here because MONDO places it under this term, with the caveat recorded on the
  row rather than dropped.

  MFN2 is kept in the genetic list but is not a subtype of this disease.
  ClinGen curates MFN2 against autosomal recessive multiple symmetric
  lipomatosis with partial lipodystrophy (MONDO:1060153, OMIM 151800), a
  distinct entity with a different inheritance pattern in which every reported
  patient carries at least one p.Arg707Trp allele. It is a candidate for a
  separate dismech entry.

  CAV1 has no pathophysiology node. ClinGen's Limited curation for the
  autosomal dominant CAV1 partial-lipodystrophy relationship records that no
  experimental data are available for it, so there is no mechanism to cite, and
  a node was not invented. The gene remains curated with its subtype row and
  its ClinGen evidence.

  Unverified legacy prose. The prevalence figure (roughly 1.7-2.8 per million)
  and the diagnostic-delay figure (median about 10.5 years for FPLD2 in a
  French reference-center cohort) in the first paragraph predate this pass and
  carry no citation anywhere in the entry. They were not re-derived here and
  should be sourced or removed.

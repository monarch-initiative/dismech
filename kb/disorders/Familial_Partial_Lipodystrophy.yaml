  - preferred_term: PLAAT3
    term:
      id: hgnc:17825
      label: PLAAT3
  description: >-
    Autosomal recessive lipodystrophy caused by homozygous loss-of-function
    variants in PLAAT3, a phospholipid-modifying enzyme expressed in neural
    tissue and white adipose tissue. Fat loss ranges from partial to
    generalized and is accompanied by variable neurological features
    (demyelinating neuropathy, intellectual disability), so the entity is
    broader than a purely adipose disorder; OMIM and MONDO nonetheless number
    it within the familial partial lipodystrophy series.
  review_notes: >-
    Added 2026-09-19. MONDO:0958034 is a direct child of MONDO:0020088 (OLS
    MONDO parents endpoint) and cross-references OMIM:620683, which NCBI's
    mim2gene_medgen maps to GeneID 11145 (PLAAT3). The neurological component
    means this row is a syndromic member of the series rather than an isolated
    partial lipodystrophy; it is kept here because MONDO places it under this
    entry's disease term, and the caveat is recorded in the description rather
    than being silently dropped.
  evidence:
  - reference: PMID:37919452
    reference_title: Loss of phospholipase PLAAT3 causes a mixed lipodystrophic and neurological syndrome due to impaired PPARγ signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven patients from four unrelated consanguineous families, with homozygous loss-of-function variants in PLAAT3, who presented with a lipodystrophy syndrome with loss of fat varying from partial to generalized and associated with metabolic complications, as well as variable neurological features including demyelinating neuropathy and intellectual disability.
    explanation: >-
      Establishes biallelic PLAAT3 loss of function as a cause of a lipodystrophy
      syndrome and records the partial-to-generalized fat loss and the
      neurological features this row describes.
pathophysiology:
- name: Impaired adipocyte differentiation and adipose storage capacity
  description: >-
    The unifying defect across FPLD subtypes is failure of subcutaneous adipose
    tissue to develop and/or store triglycerides normally, owing to disruption of
    adipogenesis, lipid-droplet biology, or adipocyte maintenance. This produces
    selective loss of subcutaneous fat from the limbs and gluteal region.
  cell_types:

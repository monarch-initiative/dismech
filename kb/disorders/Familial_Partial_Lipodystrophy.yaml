    reference_title: "MFN2 / multiple symmetric lipomatosis with partial lipodystrophy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      One specific MFN2 variant, p.Arg707Trp, has been reported in all multiple symmetric lipomatosis with partial lipodystrophy cases to date.
    explanation: >-
      The single recurrent allele behind every reported case is part of what

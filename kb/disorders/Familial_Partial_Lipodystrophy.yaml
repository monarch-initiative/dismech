    snippet: "MFN2 | HGNC:16877 | multiple symmetric lipomatosis with partial lipodystrophy | MONDO:1060153 | AR | Definitive"
    explanation: >-
      ClinGen curates MFN2 against a separate autosomal recessive disease term,
      not against a familial partial lipodystrophy term, which is the basis for

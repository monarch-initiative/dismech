- partial lipodystrophy, familial
has_subtypes:
- name: FPLD1
  display_name: FPLD1 (Köbberling type)
  description: >-
    Köbberling-type familial partial lipodystrophy with subcutaneous fat loss
    confined predominantly to the limbs and sparing of the trunk; defined
    clinically, with no consistently identified causal gene to date. Associated
    with insulin resistance and metabolic complications.
  subtype_term:
    preferred_term: FPLD1 (Köbberling type)
    term:
      id: MONDO:0012072
      label: familial partial lipodystrophy, Kobberling type
  review_notes: >-
    No genes list is attached to this row, and that is a deliberate
    disagreement with MONDO. MONDO records NOTCH3 (hgnc:7883) as the causal
    gene of MONDO:0012072 via RO:0004003. That assignment traces to OMIM:
    MONDO:0012072 cross-references OMIM:608600, and NCBI's mim2gene_medgen
    table (retrieved 2026-09-19) maps phenotype MIM 608600 to GeneID 4854
    (NOTCH3) through OMIM's GeneMap. The primary report behind that mapping,
    Garg et al. Diabetes 2025 (PMID:39652711), describes its gain-of-function
    NOTCH3 variants as causing "a novel subtype of FPL" and nowhere equates
    the affected families with the Koebberling phenotype. MONDO's own text
    definition of this class still reads "of unknown etiology". Koebberling-type
    FPLD1 is a clinical description (limb-confined lipoatrophy with normal or
    increased truncal fat), so this entry keeps the row clinical and curates
    NOTCH3 separately in the genetic list rather than asserting that the two
    are the same disorder. Note also that PMID:39652711 carries a published
    erratum (PMID:41147879) whose content could not be retrieved: PubMed
    returns the erratum record with no abstract text, and Crossref returns no
    abstract for its DOI 10.2337/db26-er01a (both checked 2026-09-19). What the
    erratum corrects is therefore unknown here, and no reference cache for it
    is committed.
- name: FPLD2
  display_name: FPLD2 (Dunnigan type, LMNA)
  description: >-
    The most common genetic form, caused by autosomal dominant pathogenic
    variants in LMNA (commonly missense variants at codon 482, e.g., R482W/R482Q).
    Progressive loss of subcutaneous fat from limbs, buttocks, and trunk with
    relative accumulation in the face, neck, and intra-abdominal depots; muscular
    appearance and prominent veins are characteristic.

discussions:
- discussion_id: yhfs_downstream_mechanism
  prompt: >-
    Which TELO2-dependent cellular defects connect TTT-complex destabilization
    to impaired human brain growth and neurodevelopment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TELO2/TTT complex destabilization
  rationale: >-
    TELO2 is required for TTT-complex stability, but the original patient
    fibroblasts retained normal tested PIKK functions. A proximate human
    neurodevelopmental mechanism has not been demonstrated.
  proposed_experiments:
  - experiment_id: exp_yhfs_patient_neural_models
    name: Isogenic patient-allele neural-model study
    description: >-
      Compare representative TELO2 patient alleles with corrected isogenic
      controls in human neural progenitors and brain organoids, measuring TTT
      stability, individual PIKK abundance and activity, cell-cycle checkpoints,
      proliferation, differentiation, and rescue by wild-type TELO2.
  evidence:
  - reference: PMID:27132593
    reference_title: A Syndromic Intellectual Disability Disorder Caused by Variants in TELO2, a Gene Encoding a Component of the TTT Complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although their fibroblasts showed reduced steady-state levels of TELO2 and
      the other components of the TTT complex, PIKK functions were normal in
      cellular assays.
    explanation: >-
      This discordance defines the unresolved step between TTT destabilization
      and disease.
  - reference: PMID:28944240
    reference_title: Novel compound heterozygous mutations in TELO2 in a patient with severe expression of You-Hoover-Fong syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The underlying molecular pathogenesis of YHFS is still not completely understood.
    explanation: The clinical expansion explicitly identifies the mechanism as unresolved.
- discussion_id: yhfs_cancer_susceptibility
  prompt: >-
    Does YHFS confer increased cancer susceptibility, or was the reported
    hepatoblastoma coincidental?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TELO2/TTT complex destabilization
  rationale: >-
    One child with YHFS developed hepatoblastoma, while prior reported
    individuals had no tumors. A single observation cannot establish excess
    risk or justify syndrome-specific tumor surveillance.
  proposed_experiments:
  - experiment_id: exp_yhfs_longitudinal_cancer_registry
    name: Longitudinal YHFS cancer registry
    description: >-
      Follow an international molecularly confirmed cohort with age, genotype,
      person-time, tumor diagnoses, and comparison with age-specific population
      incidence before defining any surveillance recommendation.
  evidence:
  - reference: PMID:39704248
    reference_title: Expansion of the Phenotype of You-Hoover-Fong Syndrome and Possible Increased Risk of Cancer.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the development of hepatoblastoma might be coincidental, given
      the role of TELO2 in cell cycle, we suspect YHFS might be associated with
      an increased cancer susceptibility. Further cases are needed to confirm
      whether YHFS is associated with an increased risk of cancer.
    explanation: >-
      The authors explicitly frame the association as a hypothesis requiring
      additional cases, not an established syndrome feature.
notes: >-
  The original cellular study supports destabilization of TELO2 and the other
  TTT-complex components but found normal PIKK functions in the assays performed.
  Cancer susceptibility remains a hypothesis rather than an established
  clinical feature. No GeneReviews chapter or population-based prevalence study
  was identified during this review.

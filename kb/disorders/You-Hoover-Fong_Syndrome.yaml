name: You-Hoover-Fong Syndrome
creation_date: '2025-12-19T01:18:09Z'
description: >-
  You-Hoover-Fong syndrome (YHFS) is a rare autosomal recessive
  neurodevelopmental disorder caused by biallelic pathogenic variants in TELO2.
  Global developmental delay, intellectual disability, and microcephaly are the
  recurrent core features. Dysmorphic facial features, ocular abnormalities,
  movement and tone abnormalities, impaired balance or ataxia, sleep disturbance,
  poor growth, hearing impairment, and congenital anomalies are variably present.
  TELO2 is a component of the TELO2-TTI1-TTI2 (TTT) co-chaperone complex, but the
  cellular steps connecting destabilization of this complex to the human
  neurodevelopmental phenotype remain unresolved.
category: Mendelian
synonyms:
- YHFS
- TELO2-related syndrome
- TELO2-related intellectual disability-neurodevelopmental disorder

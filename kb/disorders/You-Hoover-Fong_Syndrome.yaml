  evidence:
  - reference: PMID:27132593
    reference_title: A Syndromic Intellectual Disability Disorder Caused by Variants in TELO2, a Gene Encoding a Component of the TTT Complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report six affected individuals from four families with
      intellectual disability (ID) and neurological and other congenital
      abnormalities associated with compound heterozygous variants in TELO2.
    explanation: >-
      The discovery cohort establishes recessive disease associated with two
      TELO2 variants in affected individuals from multiple families.
  - reference: PMID:38421525
    reference_title: "The first Iranian patient with You-Hoover-Fong syndrome and a review of the literature on 27 cases: expanding the genotypic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using WES, a novel homozygous missense variant, c.1799A > G (p.
      Tyr600Cys), was identified in the TELO2 gene in a 4-year-old Iranian male
      patient.
    explanation: >-
      A homozygous affected genotype complements the compound-heterozygous
      families in the discovery cohort.

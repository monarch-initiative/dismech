pathophysiology:
- name: TELO2/TTT complex destabilization
  biological_scale: MOLECULAR
  description: >-
    TELO2, TTI1, and TTI2 form the TTT co-chaperone complex involved in PIKK
    maturation. In the discovery cohort, patient fibroblasts had reduced
    steady-state TELO2, TTI1, and TTI2, supporting destabilization of the
    complex. The tested PIKK functions were normal, so this entry does not infer
    generalized ATM, ATR, DNA-PKcs, mTOR, SMG1, or TRRAP deficiency from the
    variants.
  genes:
  - preferred_term: TELO2
    term:
      id: hgnc:29099
      label: TELO2
  biological_processes:
  - preferred_term: protein stabilization
    term:
      id: GO:0050821
      label: protein stabilization
    modifier: DECREASED
  evidence:
  - reference: PMID:27132593
    reference_title: A Syndromic Intellectual Disability Disorder Caused by Variants in TELO2, a Gene Encoding a Component of the TTT Complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although their fibroblasts showed reduced steady-state levels of TELO2 and
      the other components of the TTT complex, PIKK functions were normal in
      cellular assays.
    explanation: >-
      Patient-fibroblast experiments directly support TTT-complex destabilization
      while also setting the boundary against claiming demonstrable PIKK
      dysfunction in those assays.
  downstream:
  - target: Intellectual disability
    description: >-
      TELO2/TTT-complex destabilization is associated with intellectual
      disability through unresolved intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27132593
      reference_title: A Syndromic Intellectual Disability Disorder Caused by Variants in TELO2, a Gene Encoding a Component of the TTT Complex.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our results suggest that these TELO2 missense variants result in loss of
        function, perturb TTT complex stability, and cause an autosomal-recessive
        syndromic form of ID.
      explanation: >-
        The study links TTT-complex destabilization to syndromic intellectual
        disability without establishing a complete molecular chain.
  - target: Microcephaly
    description: >-
      Microcephaly is a recurrent component of the TELO2-related syndrome, but
      the path from TTT-complex destabilization to impaired brain growth is not
      established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38421525
      reference_title: "The first Iranian patient with You-Hoover-Fong syndrome and a review of the literature on 27 cases: expanding the genotypic and phenotypic spectrum."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the most common features were microcephaly and intellectual impairment.
      explanation: >-
        The case review supports the recurring phenotype but does not establish
        the intervening mechanism.

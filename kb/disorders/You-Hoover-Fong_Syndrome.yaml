genetic:
- name: Biallelic pathogenic TELO2 variants
  gene_term:
    preferred_term: TELO2
    term:
      id: hgnc:29099
      label: TELO2
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic genotypes include homozygous and compound-heterozygous alleles.
    Missense variants predominate in the published spectrum. Variant
    interpretation should incorporate segregation and phenotype. Two sisters
    homozygous for p.Arg609His had a milder presentation, but the same allele
    had previously occurred in a more severely affected compound heterozygote;
    an allele-severity relationship is therefore suggestive, not established.
  evidence:
  - reference: PMID:27132593
    reference_title: A Syndromic Intellectual Disability Disorder Caused by Variants in TELO2, a Gene Encoding a Component of the TTT Complex.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest that these TELO2 missense variants result in loss of
      function, perturb TTT complex stability, and cause an autosomal-recessive
      syndromic form of ID.
    explanation: The discovery cohort establishes the causal TELO2 relationship.
  - reference: PMID:38421525
    reference_title: "The first Iranian patient with You-Hoover-Fong syndrome and a review of the literature on 27 cases: expanding the genotypic and phenotypic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Missense pathogenic variants were the most common type of pathogenic variant
    explanation: The 27-case review supports the predominance of missense alleles.
  - reference: PMID:33307281
    reference_title: Milder presentation of TELO2-related syndrome in two sisters homozygous for the p.Arg609His pathogenic variant.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the case of two sisters, carrying the homozygous p. Arg609His
      variant of the gene, who present a milder phenotype of TELO2-related
      syndrome. Such variant has been reported once in a more severely affected
      patient, in compound heterozygous state associated with the p. Pro260Leu
      variant, suggesting a possible role of the p. Arg609His variant in
      determining milder phenotypes.
    explanation: >-
      The two sisters support a mild presentation associated with homozygous
      p.Arg609His, while the contrasting compound-heterozygous case means the
      proposed allele-severity relationship remains suggestive rather than
      established.
  - reference: CGGV:assertion_6995e858-919b-4a08-be40-54a56371a408-2022-06-01T160000.000Z
    reference_title: "TELO2 / TELO2-related intellectual disability-neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TELO2 | HGNC:29099 | TELO2-related intellectual disability-neurodevelopmental disorder | MONDO:0014848 | AR | Definitive"
    explanation: >-
      ClinGen classifies the autosomal recessive TELO2 gene-disease relationship
      as definitive.
differential_diagnoses:
- name: TTI1-related neurodevelopmental disorder with microcephaly
  description: >-
    Biallelic TTI1 disease affects another component of the TTT complex and
    overlaps with YHFS in intellectual disability, microcephaly, short stature,
    and movement disorder.
  distinguishing_features:
  - Molecular testing identifies biallelic TTI1 variants rather than TELO2 variants.
  - Clinical overlap is substantial, so the causal gene is the reliable discriminator.
  evidence:
  - reference: PMID:36724785
    reference_title: Bi-allelic TTI1 variants cause an autosomal-recessive neurodevelopmental disorder with microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present clinical, genomic, and functional data from 11 individuals in 9
      unrelated families with bi-allelic variants in TTI1. All present with ID,
      and most with microcephaly, short stature, and a movement disorder.
    explanation: >-
      The TTI1 cohort documents the shared neurodevelopmental and growth phenotype.
- name: TTI2-related autosomal recessive intellectual disability
  description: >-
    Biallelic TTI2 disease affects the third TTT-complex component and overlaps
    with YHFS in severe cognitive impairment, microcephaly, short stature,
    skeletal anomalies, and facial dysmorphism.
  distinguishing_features:
  - Molecular testing identifies biallelic TTI2 variants rather than TELO2 variants.
  - TTI2 patient cells may show reduced PIKK levels, a finding not demonstrated in the original TELO2 patient-cell assays.
  evidence:
  - reference: PMID:23956177
    reference_title: Mutation in TTI2 reveals a role for triple T complex in human brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a missense c.1307T>A/p.I436N mutation in TTI2 causes a human autosomal
      recessive condition characterized by severe cognitive impairment,
      microcephaly, behavioral troubles, short stature, skeletal anomalies, and
      facial dysmorphic features.
    explanation: The TTI2 family establishes the overlapping recessive phenotype.
  - reference: PMID:23956177
    reference_title: Mutation in TTI2 reveals a role for triple T complex in human brain development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistently, a drastically reduced steady-state level of all PIKKs tested
      was also observed in the patient cells.
    explanation: >-
      This patient-cell finding contrasts with normal tested PIKK functions in
      the original TELO2 cohort and may help frame mechanistic comparison.

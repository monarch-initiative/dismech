name: Bronchiectasis and Nasal Polyposis
category: Mendelian
creation_date: "2026-09-01T17:10:00Z"
description: >-
  Autosomal recessive chronic destructive airway disease caused by biallelic
  loss-of-function variants in WFDC2, which encodes the secreted WAP
  four-disulfide core domain protein 2 (also called HE4). Affected individuals
  have bronchiectasis, severe chronic rhinosinusitis with nasal polyposis, and
  chronic airway infection, frequently with Pseudomonas aeruginosa. The
  presentation closely mimics cystic fibrosis and primary ciliary dyskinesia, and
  was first defined as a distinct Mendelian entity in 2024.

  What makes the entry mechanistically interesting is a negative result. WFDC2 is
  made by airway secretory cells and is absent from the airway surface liquid,
  saliva and serum of affected individuals, so the obvious hypothesis is failed
  mucociliary clearance. That hypothesis was tested and did not hold: ciliary beat
  frequency, ciliary length, epithelial composition and mucus viscosity are all
  normal, and patient cultures generate directed mucociliary transport. The step
  connecting loss of a secreted airway protein to airway destruction is therefore
  not yet established, and this entry models that gap explicitly rather than
  asserting a clearance defect the source data refute.
disease_term:
  preferred_term: bronchiectasis and nasal polyposis
  term:
    id: MONDO:0975835
    label: bronchiectasis and nasal polyposis
synonyms:
- WFDC2 deficiency
- HE4 deficiency

notes: >-
  Scope. This entry is the monogenic WFDC2-deficiency disease, not bronchiectasis
  as a radiological sign. Bronchiectasis is the common endpoint of many
  conditions, several of which the KB already covers separately (cystic fibrosis,
  primary ciliary dyskinesia, alpha-1 antitrypsin deficiency); what is curated
  here is the specific causal chain from biallelic WFDC2 loss.

  Ontology note. The glycosylation defect underlying the p.Cys49Arg founder
  variant is described in prose rather than bound to a GO term: GO:0006486
  (protein glycosylation), the obvious candidate, is obsolete, and the remaining
  glycosylation classes are either regulatory or linkage-specific and would
  overstate what the source shows. The secretion failure, which is the
  load-bearing claim, is bound to GO:0009306.

  Deep-research divergence. The committed OpenScientist report reproduces this
  entry's chain for the first five steps independently, but its lower-airway
  branch asserts impaired mucociliary clearance as a step toward bronchiectasis.
  That is imported from the generic bronchiectasis literature and is contradicted
  by the primary source for this disease, which measured clearance in patient
  cultures and found it within the normal range. The report labels those
  downstream steps inferred, which is the honest flag, but the inference is wrong
  here specifically. This entry follows the measurement, not the report.


  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Here, we describe a novel Mendelian disorder of chronic destructive airway disease characterized by bronchiectasis, chronic infection of the airways, pronounced CRS, and nasal polyposis due to autosomal recessive inheritance of pathogenic WFDC2 variants."
    explanation: Names nasal polyposis as a defining feature of the disorder.
- category: Otolaryngologic

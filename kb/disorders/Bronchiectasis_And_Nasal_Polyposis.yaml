inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic WFDC2 variants, identified across 10 unrelated families
    from four continents in the founding cohort. Reported patients are homozygous
    or compound heterozygous, with founder alleles in East Asian populations.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We identified biallelic pathogenic variants in WAP four-disulfide core domain 2 (WFDC2) in 11 individuals from 10 unrelated families originating from the United States, Europe, Asia, and Africa."
    explanation: Establishes recessive inheritance across an internationally distributed founding cohort.

pathophysiology:
- name: Biallelic Loss of Function in WFDC2
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. WFDC2 encodes a small secreted whey-acidic-protein
    family member expressed by airway secretory cells. Reported disease alleles
    include nonsense, frameshift and missense changes; the recurrent p.Cys49Arg
    founder variant acts by disrupting a disulfide-forming cysteine rather than by
    truncating the protein.
  genes:
  - preferred_term: WFDC2
    term:
      id: hgnc:15939
      label: WFDC2
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "WFDC2 dysfunction defines a novel molecular etiology of bronchiectasis characterized by the deficiency of a secreted component of the airways."
    explanation: "States the causal claim: WFDC2 loss is a distinct molecular cause of bronchiectasis."
  - reference: PMID:40114242
    reference_title: "Two novel genetic variants in the WFDC2 gene from patients with bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Therefore, we aimed to identify two novel variants of the WFDC2 gene, known as antiprotease, from patients with bronchiectasis and/or related phenotypes using trio-based whole-genome sequencing analysis."
    explanation: Independent replication of WFDC2 variants in bronchiectasis patients, and names the protein's antiprotease identity.
  downstream:
  - target: Failure of WFDC2 Secretion
    causal_link_type: DIRECT

- name: Failure of WFDC2 Secretion
  biological_scale: MOLECULAR
  description: >-
    The proximate consequence. For the p.Cys49Arg founder allele the mechanism is
    specific and was modelled directly: the substitution structurally hampers
    glycosylation, and the immature protein is not secreted. The result for the
    airway is the same whichever allele is involved - no mature WFDC2 reaches the
    extracellular space.
  biological_processes:
  - preferred_term: protein secretion
    term:
      id: GO:0009306
      label: protein secretion
    modifier: DECREASED
  cell_types:
  - preferred_term: Airway secretory cell
    term:
      id: CL:4052031
      label: respiratory airway secretory cell
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Computer simulations and deglycosylation assays indicate that the disease-causing founder variant p.Cys49Arg structurally hampers glycosylation and, thus, secretion of mature WFDC2."
    explanation: Identifies impaired glycosylation as the mechanism blocking secretion of the founder-variant protein.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Expression of WFDC2 was detected predominantly in secretory cells of control airway epithelium and also in submucosal glands."
    explanation: Localizes WFDC2 production to airway secretory cells and submucosal glands, the source of the missing secreted protein.
  downstream:
  - target: Depletion of WFDC2 from Airway Surface Liquid and Secretions
    causal_link_type: DIRECT

- name: Depletion of WFDC2 from Airway Surface Liquid and Secretions
  biological_scale: TISSUE
  description: >-
    The measurable deficiency state. WFDC2 is below the limit of detection in
    serum and barely detectable in saliva, seminal fluid and airway surface liquid
    from affected individuals. The contrast with the disease controls is
    informative: patients with CF and PCD have detectable, indeed elevated, WFDC2,
    so this is not a nonspecific consequence of chronic airway disease. It is also
    what makes a commercially available serum assay usable diagnostically.
  cellular_components:
  - preferred_term: extracellular region
    term:
      id: GO:0005576
      label: extracellular region
    modifier: DECREASED
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We demonstrate that WFDC2 is below the limit of detection in blood serum and hardly detectable in samples of saliva, seminal fluid, and airway surface liquid from WFDC2-deficient individuals."
    explanation: Directly measures the deficiency across the relevant compartments, including airway surface liquid.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This represents the first description of WFDC2 deficiency as a cause of chronic destructive airway disease, in contrast to PCD and CF, which show elevated expression of WFDC2."
    explanation: The opposite direction in CF and PCD shows the depletion is specific to this disorder rather than secondary to airway disease generally.
  downstream:
  - target: Altered Airway Antiprotease Milieu
    causal_link_type: DIRECT
  - target: Chronic Airway Infection and Rhinosinusitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Altered Airway Antiprotease Milieu
  biological_scale: TISSUE
  description: >-
    A candidate, partially supported consequence. WFDC family members are protease
    inhibitors, and comparative proteomics of saliva found the serine protease
    inhibitor SPINK5 significantly reduced in WFDC2-deficient individuals relative
    to both healthy controls and airway-disease controls. SLPI, the other WFDC
    protein highly expressed in airway epithelium, was not significantly altered.

    The claim carried here is deliberately narrow. The SPINK5 finding is real and
    controlled against disease as well as healthy comparators, but it is measured
    in saliva rather than in the airway, in three patients, and it establishes an
    association rather than a route to tissue destruction. It is modelled as a
    node because the protease-antiprotease balance is the mechanism the protein
    family's known biology predicts, not because the pathway to bronchiectasis has
    been demonstrated.
  molecular_functions:
  - preferred_term: serine-type endopeptidase inhibitor activity
    term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We also analyzed SPINK5 by WB and observed reduced expression of a proteolytically cleaved species (28) in individuals with WFDC2 mutations compared with healthy control and respiratory disease control groups"
    explanation: Reduced SPINK5 in patients relative to both healthy and airway-disease controls, which is what makes it specific rather than a chronic-disease effect.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Other members of the WFDC protein family, such as SLPI (WFDC4) (20) and Elafin (WFDC14) (21), exhibit protease inhibitor activity and play an important role in the innate immune system."
    explanation: Family-level protease-inhibitor biology motivating an antiprotease role for WFDC2; inference from paralogues, not a measurement of WFDC2 itself.
  downstream:
  - target: Chronic Airway Infection and Rhinosinusitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Chronic Airway Infection and Rhinosinusitis
  biological_scale: ORGANISM
  description: >-
    Chronic infection of the upper and lower airways, with Pseudomonas aeruginosa
    prominent, together with pronounced chronic rhinosinusitis. This is the step at
    which the disorder becomes clinically indistinguishable from cystic fibrosis
    and inborn errors of immunity, and it is a persistent state rather than
    recurrent discrete episodes.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Here we identify disease-causing variants in WFDC2 that underlie a unique and severe respiratory disorder characterized by bronchiectasis in all lung fields, chronic rhinosinusitis, and lung infection by Pseudomonas aeruginosa resembling the clinical phenotype of cystic fibrosis, primary ciliary dyskinesia, and inborn errors of immunity."
    explanation: Establishes chronic Pseudomonas infection and rhinosinusitis as core features and names the diseases it mimics.
  downstream:
  - target: Airway Wall Destruction and Nasal Polyp Formation
    causal_link_type: DIRECT

- name: Airway Wall Destruction and Nasal Polyp Formation
  biological_scale: TISSUE
  description: >-
    The structural endpoint: irreversible bronchial dilatation and nasal polyposis.
    The general route from repeated airway insult to bronchiectasis is the vicious
    cycle of infection, inflammation, damage and abnormal remodelling that is
    common to bronchiectasis of any cause; what is specific to this disorder is
    what initiates the cycle. Distribution is a useful discriminator - disease in
    all lobes, mimicking CF and inborn errors of immunity, rather than the middle
    and lower lobe predominance of PCD.
  evidence:
  - reference: PMID:38717359
    reference_title: "Deciphering Idiopathic Bronchiectasis One Gene at a Time."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Bronchiectasis often results from repeated insults to the airways, leading to a vicious cycle of damage and repair and ultimately abnormal remodeling and loss of airway integrity (1)."
    explanation: The general damage-and-repair route to bronchiectasis; applied to this disorder by inference rather than demonstrated in it.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Bronchiectasis in WFDC2 deficiency more closely mimics CF and IEI (all lobes) than PCD (predominantly middle and lower lobes)."
    explanation: Gives the lobar distribution that distinguishes this disorder radiologically from PCD.

- name: Preserved Mucociliary Clearance
  biological_scale: CELLULAR
  description: >-
    Recorded as an explicitly excluded step rather than omitted. Because WFDC2 is a
    secreted airway protein, impaired mucociliary clearance is the natural
    hypothesis, and it is the mechanism by which both diseases this disorder mimics
    - cystic fibrosis and primary ciliary dyskinesia - cause bronchiectasis. It was
    tested and did not hold. In patient-derived cultures at air-liquid interface,
    ciliary beat frequency was normal, ciliary length was unchanged, epithelial
    morphology and cilia and centrosome composition were comparable to controls,
    mucus viscosity was no different, and the cultures generated directed
    mucociliary transport. Transport speed was low relative to controls, but the
    authors' own conclusion is that clearance is within the normal range.

    This node carries no downstream edge on purpose: the point is that the expected
    link to airway destruction is absent. The residual transport-speed observation
    is the loose end, and it is captured as a knowledge gap rather than promoted to
    a mechanism.
  biological_processes:
  - preferred_term: mucociliary clearance
    term:
      id: GO:0120197
      label: mucociliary clearance
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Taken together, our results suggest that WFDC2-deficient respiratory epithelia likely have a level of mucociliary clearance that is within the normal range."
    explanation: The authors' own conclusion, and the basis for naming this node as a preserved function rather than an impaired one.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Cultures from both individuals with WFDC2 mutations were capable of generating MCT in a directed fashion, with cells from UNC 186 II2 generating complete circular transport when cultured in an MCT device (27) (Video E15)."
    explanation: Patient cultures generate directed transport, which is the functional demonstration that clearance is preserved.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "Interestingly, the speed of MCT was low relative to the control cultures (Figures E7C and E7D), but the epithelial morphology and composition of cilia and centrosomes were comparable between healthy control subjects and OP-2032 II1 (Figure E8)."
    explanation: >-
      The one measurement cutting against preservation, kept because it is the
      residual the knowledge gap is about. Graded REFUTE against this node's claim
      rather than SUPPORT: it is the only result inconsistent with wholly normal
      transport, even though the authors judged the overall level to be within the
      normal range.

phenotypes:
- category: Respiratory
  name: Bronchiectasis
  description: >-
    Irreversible bronchial dilatation, in 9 of 11 individuals in the founding
    cohort. Not obligate despite naming the disease: one child presented with
    nasal polyposis and no bronchiectasis at age 7, so its absence does not
    exclude the diagnosis and may reflect age at assessment. Distribution mimics
    cystic fibrosis rather than PCD, though reports differ on whether it is
    pan-lobar or upper-lobe predominant, which is unsurprising given the small
    numbers.
  phenotype_term:
    preferred_term: Bronchiectasis
    term:
      id: HP:0002110
      label: Bronchiectasis
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Despite low nasal nitric oxide levels, the radiologic features resembled those of cystic fibrosis, characterized by bronchiectasis predominantly in the upper lobes."
    explanation: Independent case series describing CF-like radiology with upper-lobe predominance.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "All individuals with biallelic WFDC2 variants presented with marked chronic respiratory symptoms affecting the upper and lower airways, and 9 of 11 individuals showed bronchiectasis by CT imaging (Figures 2A-2D and Table 1)."
    explanation: Gives the cohort frequency, 9 of 11, which is why this is VERY_FREQUENT rather than obligate.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This search was broadened to newly available exomes and identified WFDC2 variants in OP-4474 II1, who presented with nasal polyposis but not bronchiectasis at 7 years of age."
    explanation: A molecularly confirmed patient without bronchiectasis, which directly refutes treating it as obligate.

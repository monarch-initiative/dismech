    explanation: Pseudomonas infection was part of the presenting phenotype used to define the cohort.

genetic:
- name: WFDC2
  gene_term:
    preferred_term: WFDC2
    term:
      id: hgnc:15939
      label: WFDC2
  relationship_type: CAUSATIVE
  notes: >-
    20q13.12; encodes the secreted WAP four-disulfide core domain protein 2 (HE4).
    The recurrent p.Cys49Arg founder variant acts by hampering glycosylation and
    hence secretion. Founder alleles have been proposed in East Asian populations,
    and independent patients have since been reported from Korea, Japan and
    Vietnam, so the gene warrants inclusion in sinopulmonary diagnostic panels
    rather than being treated as a single-cohort finding.
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Considering the possibility of founder mutations, WFDC2 variants should be included in diagnostic panels for patients with sinopulmonary disease in Asian populations."
    explanation: Argues for founder alleles and panel inclusion on the basis of three independent Japanese cases.

diagnosis:
- name: Serum or saliva WFDC2 (HE4) measurement
  description: >-
    An unusually direct biochemical test for a Mendelian disorder: the causal gene
    product is a secreted protein already measured by a commercial
    electrochemiluminescence immunoassay, developed as an ovarian cancer
    biomarker. In affected individuals serum WFDC2 is below the limit of
    detection. The comparison that makes it discriminating is that CF and PCD
    patients have elevated, not reduced, WFDC2, so the test separates this
    disorder from its main mimics rather than merely flagging airway disease.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The diagnosis can be suspected based on measurement of serum or saliva WFDC2/HE4 concentrations and confirmed by genetic testing."
    explanation: States the two-step diagnostic strategy of biochemical suspicion plus genetic confirmation.
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Using a commercial electrochemiluminescence immunoassay, we measured serum concentrations of WFDC2 in individuals with biallelic WFDC2 variants and compared this to serum concentrations of WFDC2 in individuals with PCD and CF (Figure 4K)."
    explanation: Establishes that an already-commercial assay was used and benchmarked against the two main mimics.
- name: Low nasal nitric oxide as a misleading result
  description: >-
    A diagnostic trap worth stating plainly. Nasal nitric oxide is low in these
    patients, and low nasal NO is the standard screening test for primary ciliary
    dyskinesia. Patients are therefore liable to be labelled probable PCD -
    explicitly what happened in the Japanese series, in a setting where CF is rare
    - and the label can stand for years because the airway phenotype is compatible
    with it. The founding cohort recommends considering WFDC2 deficiency precisely
    when nasal NO is very low.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "We recommend including WFDC2 deficiency in the differential diagnosis with CRS, CF, and PCD when nasal nitric oxide measurements are very low."
    explanation: The authors' explicit recommendation to consider this disorder when the PCD screening test is positive.
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "these cases often present low levels of nasal nitric oxide (nNO) and are preliminarily diagnosed as probable PCD in Japanese settings where CF is rare"
    explanation: Documents the misdiagnosis actually occurring, which is what makes this a practical trap rather than a theoretical one.
- name: Genetic confirmation
  description: >-
    Biallelic WFDC2 variants on next-generation or targeted Sanger sequencing.
    WFDC2 is not on all sinopulmonary panels, so a negative CF and PCD panel does
    not exclude it.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Methods: DNA was analyzed by next-generation or targeted Sanger sequencing."
    explanation: The sequencing approach used to establish the diagnosis in the founding cohort.

differential_diagnoses:
- name: Cystic fibrosis
  description: >-
    The closest mimic radiologically and clinically - chronic Pseudomonas
    infection, sinus disease, bronchiectasis in all lobes. Separated by CFTR
    genetics, sweat testing, and, distinctively, by WFDC2 level, which is elevated
    in CF and undetectable here.
- name: Primary ciliary dyskinesia
  description: >-
    Shares low nasal nitric oxide, chronic rhinosinusitis and bronchiectasis, and
    is the label these patients most often receive first. Separated by normal
    ciliary beat pattern and frequency on high-speed video microscopy, by lobar
    distribution, and by WFDC2 level.
- name: Inborn errors of immunity
  description: >-
    Also produce pan-lobar bronchiectasis with chronic infection. Separated by
    immunological work-up; WFDC2-deficient individuals are not described as
    broadly immunodeficient.

treatments:
- name: Airway Clearance and Long-Term Macrolide Therapy
  description: >-
    Standard bronchiectasis management. Worth recording that it is inadequate
    here - all three Japanese patients had frequent exacerbations and respiratory
    dysfunction despite long-term macrolides.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "All patients experienced frequent exacerbations and respiratory dysfunction, even with long-term macrolide therapy."
    explanation: Refutes adequacy of standard macrolide therapy for controlling this disorder.
- name: Lung Transplantation
  description: >-
    The endpoint for advanced disease; two of the three reported Japanese patients
    required it, in their twenties or earlier.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Consequently, two of the three patients required lung transplantation."
    explanation: Documents transplantation as the outcome in two of three reported patients.
- name: WFDC2 Protein Replacement
  description: >-
    Proposed but not tested. The rationale is unusually clean for a Mendelian
    disorder - the missing gene product is small and acts extracellularly, so it
    need not be delivered into cells - which is why it is recorded here despite
    being hypothetical. No preclinical or clinical data exist.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Depletion of WFDC2 from Airway Surface Liquid and Secretions
    description: >-
      Would act by restoring the missing secreted protein to the extracellular
      compartment it is absent from. Entirely prospective.
  evidence:
  - reference: PMID:38626355
    reference_title: "Recessively Inherited Deficiency of Secreted WFDC2 (HE4) Causes Nasal Polyposis and Bronchiectasis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Because of the relatively small size of WFDC2 and its function in extracellular spaces, replacement therapy may be a potential option."
    explanation: The authors' stated rationale for replacement therapy; a proposal rather than a result.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists. The disease was defined in 2024 from 11
    individuals in 10 families, with small numbers added since from Korea, Japan
    and Vietnam. Because the presentation is indistinguishable from CF and PCD and
    WFDC2 is absent from many diagnostic panels, the reported count is a floor
    rather than an estimate.

progression:
- phase: Childhood chronic rhinosinusitis
  notes: >-
    Upper airway disease is present from childhood and precedes recognition of the
    bronchiectasis, in the reported series by roughly a decade.
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The ages at diagnosis of bronchiectasis were 18, 24, and 16 years, and all patients had a history of chronic sinusitis since childhood."
    explanation: Gives both the childhood onset of sinus disease and the age at which bronchiectasis was diagnosed.
- phase: Progressive bronchiectasis to respiratory failure
  notes: >-
    Progressive despite standard therapy, reaching transplantation in two of three
    patients in the one series reporting outcomes.
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Consequently, two of the three patients required lung transplantation."
    explanation: Documents progression to end-stage lung disease.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong progressive suppurative airway disease with chronic Pseudomonas
    infection, poorly controlled by the standard therapy, reaching lung
    transplantation in two of three patients in the only series reporting
    outcomes, at ages in the teens and twenties. Compounded by severe chronic
    rhinosinusitis from childhood and by diagnostic delay, since the disorder is
    routinely mislabelled as probable PCD.
  evidence:
  - reference: PMID:40401042
    reference_title: "Severe bronchiectasis and chronic rhinosinusitis due to homozygous WFDC2 Variants: The first three cases reported from Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "All patients experienced frequent exacerbations and respiratory dysfunction, even with long-term macrolide therapy."
    explanation: Supports a high burden assessment through refractoriness to standard treatment.

discussions:
- discussion_id: wfdc2_mechanism_to_bronchiectasis_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Depletion of WFDC2 from Airway Surface Liquid and Secretions
  - pathophysiology#Mucociliary Clearance
  prompt: >-
    By what route does loss of a secreted airway protein cause bronchiectasis when
    mucociliary clearance, mucus viscosity and ciliary function are all normal?
  rationale: >-
    This is the central open question of the disorder, and it is open because the
    obvious answer was tested and failed. Both diseases that WFDC2 deficiency
    clinically mimics cause bronchiectasis through defective clearance - CF
    through mucus properties, PCD through ciliary function - and in WFDC2
    deficiency neither is abnormal. Ciliary beat frequency and length, epithelial
    and centrosome composition, and mucus viscosity all match controls, and
    patient cultures generate directed transport.

    What remains is an association: reduced SPINK5 on saliva proteomics in three
    patients, and the protease-inhibitor identity of the WFDC family. Neither
    establishes a route to airway wall destruction. The one loose measurement is
    that mucociliary transport speed was low relative to controls even though the
    authors judged clearance to be within the normal range; whether that is a
    subtle real defect or assay variation at n=2 is unresolved and is worth
    settling before it is either promoted to a mechanism or dismissed.

    The answer matters for treatment. Protein replacement is proposed on the
    reasoning that the missing product acts extracellularly, but without knowing
    what it does there, neither the target tissue, the therapeutic window, nor a
    pharmacodynamic readout can be specified.
  proposed_experiments:
  - experiment_id: wfdc2_asl_antiprotease_activity
    name: Direct protease-antiprotease measurement in patient airway surface liquid
    description: >-
      Measure neutrophil elastase and other protease activity, and antiprotease
      capacity, in airway surface liquid and sputum from WFDC2-deficient
      individuals against CF, PCD and healthy controls, rather than inferring the
      antiprotease role from saliva proteomics and family homology.
    would_support:
    - pathophysiology#Altered Airway Antiprotease Milieu
    supporting_outcome:
    - >-
      Unopposed protease activity in patient airway surface liquid exceeding that
      of airway-disease controls with comparable infection burden, which would
      separate the antiprotease deficit from the effects of chronic infection.
    would_refute:
    - pathophysiology#Altered Airway Antiprotease Milieu
    refuting_outcome:
    - >-
      Protease-antiprotease balance comparable to CF and PCD controls, indicating
      that the SPINK5 finding does not translate into an airway antiprotease
      deficit and that the mechanism lies elsewhere.
  - experiment_id: wfdc2_bacterial_handling_ali
    name: Bacterial handling in WFDC2-deficient air-liquid interface cultures
    description: >-
      Challenge patient-derived and WFDC2-knockout airway cultures with
      Pseudomonas aeruginosa and quantify adherence, killing and epithelial
      barrier integrity, testing host defense rather than clearance as the
      affected function.
    would_support:
    - pathophysiology#Chronic Airway Infection and Rhinosinusitis
    supporting_outcome:
    - >-
      Impaired bacterial killing or increased adherence and barrier disruption in
      WFDC2-deficient cultures, rescued by recombinant WFDC2, which would supply
      the missing causal step and simultaneously provide the pharmacodynamic
      readout that replacement therapy currently lacks.
    would_refute:
    - pathophysiology#Chronic Airway Infection and Rhinosinusitis
    refuting_outcome:
    - >-
      Bacterial handling indistinguishable from controls, which would push the
      mechanism toward inflammation or repair rather than defense and would make
      the infection a consequence of established bronchiectasis rather than its
      cause.

- discussion_id: wfdc2_ascertainment_and_panel_coverage
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Worldwide
  - genetic#WFDC2
  prompt: >-
    How much WFDC2 deficiency is currently being counted as idiopathic
    bronchiectasis or probable PCD?
  rationale: >-
    Every reported patient was found by sequencing beyond the standard panels,
    and the disorder has a specific reason to be systematically missed rather
    than merely rare: low nasal nitric oxide gives these patients a positive
    result on the PCD screening test, so the workup terminates at a plausible
    wrong answer instead of continuing. Cases have accumulated from Korea, Japan
    and Vietnam within two years of the founding report, and founder alleles have
    been proposed, which is not the pattern of a genuinely ultra-rare disease.

    This is tractable without new discovery work: serum WFDC2 can be measured
    with an existing commercial assay, so an idiopathic-bronchiectasis or
    probable-PCD cohort could be screened biochemically before any sequencing.
    Until that is done, the prevalence field here is a count of reports rather
    than an estimate.
  evidence:
  - reference: PMID:41094464
    reference_title: "Genetic investigation of sinopulmonary diseases in Vietnam: seeking specific causes from non-specific symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "However, the spectrum varies across ethnicities, and specifically, while considered rare in Southeast Asia, the current status in this region remains largely unknown."
    explanation: Supports the ascertainment concern by documenting that the genetic spectrum of sinopulmonary disease is unmapped in a large population.

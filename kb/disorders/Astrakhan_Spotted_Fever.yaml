name: Astrakhan spotted fever
creation_date: "2026-09-28T10:35:48Z"
category: Infectious Disease
description: >-
  Astrakhan spotted fever is an acute tick-borne spotted-fever-group
  rickettsiosis caused by Rickettsia conorii subsp. caspia. Rhipicephalus
  pumilio or Rhipicephalus sanguineus ticks inoculate the obligately
  intracellular bacterium into skin, and the resulting illness combines fever,
  conjunctivitis, regional lymphadenitis, hepatomegaly, hypotension, and a
  papular-hemorrhagic exanthem.

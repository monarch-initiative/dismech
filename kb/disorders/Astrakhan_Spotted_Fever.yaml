        multi-locus sequence typing and an emended description of Rickettsia
        conorii.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rickettsiae closely related to the Malish strain, the reference
        Rickettsia conorii strain, include Indian tick typhus rickettsia (ITTR),
        Israeli spotted fever rickettsia (ISFR), and Astrakhan fever
        rickettsia (AFR).
      explanation: >-
        The taxonomic study identifies Astrakhan fever rickettsia as a member
        of the bacterial R. conorii complex.


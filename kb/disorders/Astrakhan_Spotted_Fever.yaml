transmission:
- name: Rhipicephalus tick bite transmission
  description: >-
    Humans acquire Astrakhan spotted fever when infected Rhipicephalus ticks,
    including R. pumilio in the Astrakhan focus and R. sanguineus in Kosovo,
    inoculate R. conorii subsp. caspia during blood feeding.
  evidence:
  - reference: PMID:12860620
    reference_title: Detection of Astrakhan fever rickettsia from ticks in Kosovo.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Its agent is a spotted fever group rickettsia, member of the Rickettsia
      conorii complex, transmitted to humans by Rhipicephalus sanguineus and
      Rhipicephalus pumilio ticks.
    explanation: >-
      The Kosovo molecular survey names the two Rhipicephalus vectors known
      for Astrakhan fever rickettsia.
  - reference: PMID:7985764
    reference_title: "Astrakhan fever rickettsiae: antigenic and genotypic analysis of isolates obtained from human and Rhipicephalus pumilio ticks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two spotted fever group rickettsia strains, A-108 and A-167, were
      isolated from the hemolymph of Rhipicephalus pumilio ticks collected in
      the Astrakhan region of Russia, which is area endemic for Astrakhan fever.
    explanation: >-
      The 1994 Astrakhan study recovered the fever agent from R. pumilio ticks
      collected in the endemic Russian focus.

pathophysiology:
- name: Rhipicephalus-Mediated Rickettsia conorii subsp. caspia Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    An infected R. pumilio or R. sanguineus tick bites human skin and delivers
    R. conorii subsp. caspia into the dermis, seeding the local and systemic
    spotted-fever-group infection.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Obligate Intracytosolic Rickettsial Niche
    causal_link_type: DIRECT
    description: >-
      Tick inoculation delivers the obligately intracellular rickettsia to
      host cells.
  evidence:
  - reference: PMID:12860620
    reference_title: Detection of Astrakhan fever rickettsia from ticks in Kosovo.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Its agent is a spotted fever group rickettsia, member of the Rickettsia
      conorii complex, transmitted to humans by Rhipicephalus sanguineus and
      Rhipicephalus pumilio ticks.
    explanation: >-
      The molecular survey states that the Astrakhan fever agent is transmitted
      to humans by Rhipicephalus ticks, supporting tick-mediated inoculation as
      the initiating exposure.

- name: Obligate Intracytosolic Rickettsial Niche
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  biological_scale: CELLULAR
  description: >-
    Rickettsia species replicate inside host cells, especially mammalian
    microvascular endothelial cells; this shared cytosolic niche is inferred
    for R. conorii subsp. caspia from its membership in the spotted-fever
    Rickettsia lineage.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Rhipicephalus Bite-Site Primary Reaction
    causal_link_type: DIRECT
    description: >-
      The initial dermal rickettsial niche gives rise to the bite-site reaction.
  evidence:
  - reference: PMID:24059918
    reference_title: Recent molecular insights into rickettsial pathogenesis and immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The unique lifestyle features of rickettsiae include obligate
      intracellular parasitism, intracytoplasmic niche within the host cell,
      predilection for infection of microvascular endothelium in mammalian
      hosts, association with arthropods and the tendency for genomic
      reduction.
    explanation: >-
      The rickettsial review establishes the shared cytosolic and endothelial
      tropism inferred for the Astrakhan fever agent.

- name: Rhipicephalus Bite-Site Primary Reaction
  role: local_inflammatory_lesion
  biological_scale: TISSUE
  description: >-
    R. conorii subsp. caspia infection after an R. pumilio bite produces a
    primary reaction at the inoculation site, with regional lymph-node drainage
    before or alongside disseminated Astrakhan fever.
  downstream:
  - target: Regional lymphadenitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Local bite-site infection can drain to and inflame regional lymph nodes.
  - target: Astrakhan Fever Microvascular Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Local rickettsial infection can progress to the disseminated cutaneous and
      systemic inflammatory syndrome.
  evidence:
  - reference: PMID:9324803
    reference_title: "[The primary effect and characteristics of the course of a new tick-borne rickettsiosis--Astrakhan fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinicomorphological characteristics are given of primary reaction at the
      site of tick (Rhipicephalus pumilio) bite in new rickettsiosis spreading
      in Astrakhan Province--Astrakhan fever.
    explanation: >-
      The Astrakhan fever clinical-morphologic report centers the primary
      bite-site reaction after R. pumilio exposure.

- name: Astrakhan Fever Microvascular Inflammation
  role: vascular_response
  biological_scale: TISSUE
  description: >-
    Local and disseminated rickettsial infection inflames small cutaneous and
    systemic vessels, producing the fever, conjunctival, lymph-node, hepatic,
    rash, and hemodynamic manifestations reported in Astrakhan fever.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  downstream:
  - target: Febrile Astrakhan Fever Exanthem
    causal_link_type: DIRECT
    description: >-
      Cutaneous microvascular injury creates the papular-hemorrhagic rash and
      systemic febrile syndrome.
  - target: Astrakhan Fever Cellular Immune Perturbation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Acute rickettsial infection is accompanied by transient shifts in T- and
      B-cell compartments.
  evidence:
  - reference: PMID:9324803
    reference_title: "[The primary effect and characteristics of the course of a new tick-borne rickettsiosis--Astrakhan fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease presented with long-term fever (body temperature 39-40
      degrees C), intoxication, conjunctivitis, hepatomegaly, regional
      lymphadenitis, disseminated roseolous papular-hemorrhagic rash, arterial
      hypotension.
    explanation: >-
      The primary-lesion report ties Astrakhan fever to a disseminated
      inflammatory clinical syndrome after an R. pumilio bite-site reaction.
  - reference: PMID:12459842
    reference_title: "Cytokins in the pathogenesis of astrakhan spotted Fever and North Asian scrub typhus: problems of immunocorrection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Comparative study of interleukin-1 and tumor necrosis factor production
      under conditions of experimental rickettsial infection caused by agents
      of Astrakhan spotted fever and North Asian scrub typhus showed that
      therapy with galavit reduced manifestations of the disease, decreased
      mortality of experimental animals, and decreased the concentrations of
      interleukin-1 and tumor necrosis factor to normal values.
    explanation: >-
      Experimental Astrakhan fever infection engaged the inflammatory cytokines
      IL-1 and TNF in an animal model.

- name: Febrile Astrakhan Fever Exanthem
  role: clinical_manifestation
  biological_scale: ORGANISM
  description: >-
    Astrakhan fever manifests as a 39-40 degrees C febrile illness with a
    disseminated roseolous papular-hemorrhagic rash and conjunctival, hepatic,
    lymph-node, and blood-pressure involvement.
  evidence:
  - reference: PMID:9324803
    reference_title: "[The primary effect and characteristics of the course of a new tick-borne rickettsiosis--Astrakhan fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease presented with long-term fever (body temperature 39-40
      degrees C), intoxication, conjunctivitis, hepatomegaly, regional
      lymphadenitis, disseminated roseolous papular-hemorrhagic rash, arterial
      hypotension.
    explanation: >-
      The clinical abstract enumerates the fever, rash, ocular, hepatic,
      lymph-node, and vascular features of Astrakhan fever.

- name: Astrakhan Fever Cellular Immune Perturbation
  role: immune_response
  biological_scale: CELLULAR
  description: >-
    Moderate Astrakhan fever suppresses measured T- and B-cell immunity for
    about two weeks, while severe disease prolongs that suppression to about
    three weeks.
  evidence:
  - reference: PMID:12498120
    reference_title: "[Status of cellular immunity in patients with Astrakhan fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examination of immunocompetent cells has revealed suppression of T- and
      B-immunity for 2 weeks in moderate AF and 3 weeks in severe AF.
    explanation: >-
      The 75-patient cellular-immunity study reports a transient Astrakhan
      fever-associated suppression of T- and B-cell compartments.


diagnosis:
- name: Combined IgM and IgA serology
  description: >-
    Enzyme-linked immunosorbent assay serology can support Astrakhan rickettsial
    fever diagnosis, and measurement of both IgM and IgA increased serologic
    confirmation compared with IgM alone in a 185-patient Astrakhan-region
    cohort.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Combined IgM and IgA antibody detection confirms more cases than IgM
    detection alone.
  evidence:
  - reference: PMID:35467375
    reference_title: >-
      Diagnostic Value of IgA Antibody Measurement in Tick-Borne Spotted Fever
      (Astrakhan Rickettsial Fever).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated the diagnostic value of IgA antibody determination using
      patient sera collected in the Astrakhan region of Russia, where an
      isolated site of Astrakhan rickettsial fever (ARF) caused by Rickettsia
      conorii subsp. caspia is located.
    explanation: >-
      The diagnostic cohort studied Astrakhan rickettsial fever from the endemic
      Russian focus.
  - reference: PMID:35467375
    reference_title: >-
      Diagnostic Value of IgA Antibody Measurement in Tick-Borne Spotted Fever
      (Astrakhan Rickettsial Fever).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The obtained data show that the determination of IgM alone allows for
      serological confirmation of diagnosis in only 46.5% of cases but that the
      determination of both IgM and IgA increases this rate to 66.5%.
    explanation: >-
      The Astrakhan-region study quantifies the gain from adding IgA to IgM
      serology.

- name: Microimmunofluorescence and immunoblot serology
  description: >-
    Microimmunofluorescence and western immunoblotting detect IgG and IgM
    responses in Astrakhan fever sera, but patient responses to the Astrakhan
    strain and an Israelian spotted-fever-group isolate can be similar,
    requiring care when interpreting isolate-level serology.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    IgG and IgM antibodies to spotted-fever-group rickettsiae support
    retrospective serologic identification with isolate-level cross-reactivity.
  evidence:
  - reference: PMID:8549703
    reference_title: >-
      Serologic response to rickettsial antigens in patients with Astrakhan
      fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sera of patients with Astrakhan fever have been examined by
      microimmunofluorescence and western immunoblotting to determine the
      serologic responses to the Astrakhan strain and to R. conorii M-1 strain
      and the Israelian isolate of SFG rickettsiae.
    explanation: >-
      The serologic study applied microimmunofluorescence and immunoblotting to
      Astrakhan fever patient sera against related spotted-fever-group isolates.
  - reference: PMID:8549703
    reference_title: >-
      Serologic response to rickettsial antigens in patients with Astrakhan
      fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The serologic response to specific rickettsial agent and to Israelian
      isolate has been found to be similar, but was different of that to R.
      conorii.
    explanation: >-
      Similar reactivity to the Astrakhan agent and the Israelian isolate
      establishes a diagnostic cross-reaction that must be interpreted at
      isolate level.

treatments:
- name: Empiric doxycycline therapy
  description: >-
    Doxycycline is the recommended treatment for tick-borne rickettsioses, and
    an Astrakhan fever series reported better clinical efficiency for
    doxycycline than for rifampicin.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Obligate Intracytosolic Rickettsial Niche
    treatment_effect: INHIBITS
    description: >-
      Doxycycline reaches the intracellular rickettsial niche and inhibits
      bacterial protein synthesis in the susceptible pathogen.
  evidence:
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Doxycycline is the recommended treatment for tick-borne rickettsioses and
      prevention is based on personal protective measures against tick bites
      when travelling in endemic areas.
    explanation: >-
      The international-travel review states the group-level recommended
      therapy for tick-borne rickettsioses.
  - reference: PMID:12498120
    reference_title: "[Status of cellular immunity in patients with Astrakhan fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Doxicycline efficiency was higher than that of rifampicin."
    explanation: >-
      Despite the transliterated spelling in the abstract, the treatment series
      directly compared doxycycline with rifampicin in Astrakhan fever and
      favored doxycycline.

notes: >-
  MONDO defines Astrakhan spotted fever by infection with Rickettsia conorii
  subsp. caspia; this entry therefore binds the exact subspecies
  NCBITaxon:302011 rather than the broader NCBITaxon:781 R. conorii parent used
  in the older spotted-fever-group root entry.

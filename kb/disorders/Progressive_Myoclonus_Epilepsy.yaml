notes: >
  This is the root grouping entry for the progressive myoclonus epilepsies. MERRF
  (mitochondrial tRNA-Lys, m.8344A>G) is described in the genetic and
  pathophysiology prose but is not represented in the `genetic:` gene list because
  its causal locus is a mitochondrial tRNA gene (MT-TK) rather than a nuclear HGNC
  gene with a standard term binding. Dentatorubral-pallidoluysian atrophy (DRPLA)
  and Gaucher disease type 3 can also present with a PME phenotype and are curated
  in their own entries; additional rarer PME genes (e.g., GOSR2, KCNC1, SCARB2,
  PRICKLE1, CARS2, SEMA6B) are intentionally out of scope for this root grouping.
discussions:
- discussion_id: gap_pme_convergent_final_common_pathway
  prompt: >-
    Why do genetically and biochemically divergent primary defects
    (cystatin B loss, laforin-malin glycogen mishandling, mitochondrial
    translation failure, lysosomal storage) converge on the same cortical
    (reflex) myoclonus plus progressive cerebellar-ataxia and cognitive-decline
    triad? What is the shared final common pathway, and why are cortical
    sensorimotor circuits and cerebellar Purkinje/granule neurons selectively
    vulnerable across such different lesions?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration
  rationale: >-
    The PME grouping is defined by phenotypic convergence despite etiologic
    heterogeneity, but the entry asserts the shared cortical/cerebellar
    endpoint without specifying the mechanism that unifies protease
    dysregulation, glycogen storage, energy failure, and lysosomal storage.
    Candidate convergence points (chronic neuroinflammation, oxidative stress,
    impaired autophagic-lysosomal or proteostatic clearance, GABAergic
    interneuron dysfunction, and selective cerebellar/cortical circuit
    vulnerability) are each plausible but none is established as the common
    driver. Resolving this is central to whether a single mechanism-directed
    therapy could benefit multiple PME subtypes.
  evidence:
  - reference: PMID:15778103
    reference_title: "Progressive myoclonic epilepsies: a review of genetic and therapeutic aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The progressive myoclonic epilepsies (PMEs) are a group of symptomatic generalised epilepsies caused by rare disorders, most of which have a genetic component, a debilitating course, and a poor outcome."
    explanation: >-
      Frames PME as a phenotypically convergent group arising from
      heterogeneous rare disorders, motivating the open question of a shared
      final common pathway.
  proposed_experiments:
  - experiment_id: exp_pme_cross_etiology_convergence_screen
    name: Cross-etiology PME neuronal-vulnerability convergence screen
    description: >-
      Generate patient-derived cortical and cerebellar neurons (iPSC-derived,
      including Purkinje-like and GABAergic interneuron populations) representing
      several PME etiologies (EPM1/CSTB, EPM2/laforin-malin, MERRF, an NCL, and
      sialidosis), then apply matched multi-omic and functional profiling
      (transcriptomics, proteostasis/autophagy flux, oxidative-stress and
      neuroinflammatory markers, network excitability) to test whether the
      distinct primary lesions converge on a shared cell-type-selective
      dysfunction signature.
    experiment_type:
      preferred_term: cross-etiology convergence screen
    readouts:
    - name: Shared neurodegeneration and hyperexcitability signature
      target: pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration
      biological_processes:
      - preferred_term: neuron apoptotic process
        term:
          id: GO:0051402
          label: neuron apoptotic process
        modifier: INCREASED
      assays:
      - preferred_term: RNA sequencing assay
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Non-PME iPSC-derived neurons
      description: Neurons from unaffected donors and non-PME epilepsy controls.
    decision_criterion: >-
      A convergent final common pathway is supported if independent PME
      etiologies reproducibly share a cortical/cerebellar-selective molecular
      and functional dysfunction signature that is absent in non-PME controls.
    would_support:
    - pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration

- discussion_id: gap_pme_lafora_body_driver_versus_bystander
  prompt: >-
    Are Lafora bodies (polyglucosan inclusions) the causal driver of
    neurodegeneration in EPM2, or a downstream biomarker of the underlying
    glycogen-handling defect? Does reducing brain glycogen synthesis prevent the
    disease because it removes the inclusions, or because it corrects the
    upstream metabolic abnormality independent of visible aggregates?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Glycogen Handling and Lafora Body Formation (EPM2)
  rationale: >-
    The entry states that Lafora bodies are a principal driver of
    neurodegeneration, but whether the inclusions themselves are pathogenic or
    are a marker of the underlying poorly branched, hyperphosphorylated glycogen
    remains genuinely contested. Glycogen-synthesis-reduction strategies
    (e.g., glycogen synthase downregulation) that both eliminate Lafora bodies
    and rescue the phenotype cannot on their own separate the two hypotheses,
    because they remove the aggregate and the upstream metabolic defect
    simultaneously. Distinguishing driver from bystander determines whether
    aggregate clearance or metabolic normalization is the correct therapeutic
    target.
  evidence:
  - reference: PMID:30143794
    reference_title: "Lafora disease - from pathogenesis to treatment strategies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Evidence from Lafora disease genetic mouse models indicates that these intracellular inclusions are a principal driver of neurodegeneration and neurological disease."
    explanation: >-
      States the mouse-model-based case that the inclusions drive disease,
      the assertion whose driver-versus-bystander status is the open question.
  - reference: PMID:30143794
    reference_title: "Lafora disease - from pathogenesis to treatment strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "as well as exciting therapeutic advances based on the downregulation of brain glycogen synthesis and disease gene replacement."
    explanation: >-
      Identifies glycogen-synthesis downregulation as the therapeutic strategy
      whose mechanism of benefit (aggregate removal vs upstream correction)
      the experiment must disentangle.
  proposed_experiments:
  - experiment_id: exp_pme_lafora_body_uncoupling
    name: Uncoupling Lafora body burden from glycogen-metabolic defect
    description: >-
      In Lafora disease mouse models, use graded glycogen synthase (Gys1)
      reduction and alternative interventions that dissociate inclusion burden
      from upstream glycogen abnormality, then correlate quantitative Lafora
      body load, glycogen phosphorylation/branching, neuroinflammation, and

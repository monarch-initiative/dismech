    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Ultrasound revealed homogeneous, well-circumscribed, regular hypoechoic nodules.
    explanation: What the lesion looks like on ultrasound in the cited series.
differential_diagnoses:
- name: Langerhans cell histiocytosis
  disease_term:
    preferred_term: Langerhans cell histiocytosis
    term:
      id: MONDO:0018310
      label: Langerhans cell histiocytosis
  description: >-
    The one differential in this section that a marker settles. Both are childhood histiocytoses that
    involve the skin, but Langerhans cell histiocytosis requires CD1a and langerin positivity for its
    diagnosis, and this entry's own histopathology records lesional cells that are CD1a-negative.
  distinguishing_features:
  - >-
      CD1a and CD207 (langerin) positivity is required for a diagnosis of Langerhans cell
      histiocytosis; juvenile xanthogranuloma is CD1a-negative. The two cited sources differ on the
      conjunction - a review says CD1a and CD207, the paediatric consensus guideline says CD1a
      and/or CD207 - and both are quoted below.
  - >-
      Factor XIIIa is positive in 99 percent of juvenile xanthogranuloma in the Kiel series this
      entry cites. Neither cited Langerhans cell histiocytosis source names it among the markers it
      requires, which is an absence of mention rather than a stated exclusion.
  evidence:
  - reference: PMID:29754886
    reference_title: >-
      Langerhans cell histiocytosis in children: Diagnosis, differential diagnosis, treatment,
      sequelae, and standardized follow-up.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Positive immunohistochemistry staining for CD1a and CD207 (langerin) are required for a
      definitive diagnosis.
    explanation: >-
      The marker requirement for the differential, from a review of its diagnosis.
  - reference: PMID:23109216
    reference_title: >-
      Langerhans cell histiocytosis (LCH): guidelines for diagnosis, clinical work-up, and treatment
      for patients till the age of 18 years.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      positive CD1a and/or CD207 (Langerin) staining of the lesional cells is required for a
      definitive diagnosis
    explanation: >-
      The same requirement in the paediatric consensus guideline, which is the document that
      governs the diagnosis in the age group this entry is about.
- name: Erdheim-Chester disease
  disease_term:
    preferred_term: Erdheim-Chester disease
    term:
      id: MONDO:0018153
      label: Erdheim-Chester disease
  description: >-
    A non-Langerhans histiocytosis of foamy histiocytes that shares this entry's immunophenotype
    almost exactly, so the markers do not separate them. What does is the clinical picture: a
    characteristic skeletal and radiological pattern that this entry records nowhere for juvenile
    xanthogranuloma. Its MAPK mutation rate is recorded below as a fact about Erdheim-Chester
    disease and not as a contrast, because no cited source gives the corresponding rate for
    cutaneous juvenile xanthogranuloma - this entry's own description says that question is
    unsettled, and the one cached study of solitary lesions used a copy-number assay, which cannot
    see point mutations. One cited source does argue that the intracranial and cranial form of this
    disease belongs with Erdheim-Chester disease rather than with the cutaneous form.
  distinguishing_features:
  - >-
      The immunophenotype does not discriminate - Erdheim-Chester disease is also CD68-positive and
      CD1a-negative.
  - >-
      Long bone involvement in 80 to 95 percent, with hairy kidney, coated aorta and right atrial
      infiltration on imaging, is the pattern that separates them.
  - >-
      MAPK-activating mutations are found in more than 80 percent of Erdheim-Chester disease, with
      BRAF V600E in 57 to 70 percent. No cited source gives the corresponding rate for cutaneous
      juvenile xanthogranuloma, so this is not a comparison.
  evidence:
  - reference: PMID:32107533
    reference_title: Erdheim-Chester disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Erdheim-Chester disease (ECD) is characterized by the infiltration of tissues by foamy
      CD68+CD1a- histiocytes, with 1500 known cases since 1930.
    explanation: >-
      The shared immunophenotype, quoted so the row records that these markers are not the
      discriminator rather than implying that they are.
  - reference: PMID:32107533
    reference_title: Erdheim-Chester disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Some of the most striking signs of ECD are the long bone involvement (80%-95%), as well as the
      hairy kidney appearance on computed tomography scan (63%), the coated aorta (40%), and the
      right atrium pseudo-tumoral infiltration (36%).
    explanation: >-
      The clinical and radiological pattern that does separate them, with its frequencies.
  - reference: PMID:32107533
    reference_title: Erdheim-Chester disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Mutations activating the MAPK pathway are found in more than 80% of patients with ECD, mainly
      the BRAFV600E activating mutation in 57% to 70% of cases, followed by MAP2K1 in close to 20%.
    explanation: >-
      The mutation rate in Erdheim-Chester disease, recorded as a property of that disease rather
      than as a contrast.
  - reference: PMID:28504206
    reference_title: >-
      BRAF V600E mutation in pediatric intracranial and cranial juvenile xanthogranuloma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It may be more appropriate to classify intracranial/cranial JXG in the same group as
      Langerhans cell histiocytosis and Erdheim-Chester disease, which also have a BRAF V600E
      mutation.
    explanation: >-
      The authors' own argument that the intracranial form of this disease sits closer to
      Erdheim-Chester disease than to the cutaneous form, which is why this differential is
      sharpest for cutaneous lesions and weakest for intracranial ones. INDIRECT because it is a
      classification proposal rather than a measured distinction.
- name: Rosai-Dorfman disease
  disease_term:
    preferred_term: sinus histiocytosis with massive lymphadenopathy
    term:
      id: MONDO:0006412
      label: sinus histiocytosis with massive lymphadenopathy
  description: >-
    Another non-Langerhans histiocytosis whose cutaneous form competes directly with this one. Its
    histiocytes are strongly S100-positive and show emperipolesis, where this entry's are typically
    S100-negative - typically rather than always, because the two sources it rests on say "generally
    negative" and scope their negative result to extracutaneous lesions. The other half of the
    contrast is not absolute either: the cited series reports emperipolesis as much less obvious at
    extranodal sites, which is where the cutaneous form sits.
  distinguishing_features:
  - >-
      Strong S100 positivity in all cases assessed, which the authors say facilitated identifying
      emperipolesis, against the typically S100-negative histiocytes of juvenile xanthogranuloma.
  - >-
      Emperipolesis, the engulfment of intact leukocytes by histiocytes, is the morphological
      hallmark - though the same series reports it as much less obvious outside lymph nodes.
  - >-
      CD68 positivity and CD1a negativity are shared and do not discriminate. Note the series
      stained a subset: CD68 in six cases and CD1a in nineteen, of twenty-one.
  evidence:
  - reference: PMID:28664935
    reference_title: >-
      Mutually exclusive recurrent KRAS and MAP2K1 mutations in Rosai-Dorfman disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemical studies showed that the histiocytes were strongly positive for S-100
      protein in all cases, which facilitated the identification of emperipolesis.
    explanation: >-
      The S100 result and its link to emperipolesis, in one sentence, over a whole series.
  - reference: PMID:28664935
    reference_title: >-
      Mutually exclusive recurrent KRAS and MAP2K1 mutations in Rosai-Dorfman disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The histiocytes were positive for CD68 (n=6) and CD163 (n=5), and were negative for CD1a
      (n=19), CD3 (n=9) and CD20 (n=9) in all cases assessed.
    explanation: >-
      The shared markers, quoted so the row says plainly that CD68 and CD1a do not separate these
      two diseases.
  - reference: PMID:36358690
    reference_title: Rosai-Dorfman Disease between Proliferation and Neoplasia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Rosai-Dorfman disease (RDD) is a rare myeloproliferative disorder of histiocytes with a broad
      spectrum of clinical manifestations and peculiar morphologic features (accumulation of
      histiocytes with emperipolesis).
    explanation: >-
      Emperipolesis as the defining morphological feature, from a review.
  - reference: PMID:28664935
    reference_title: >-
      Mutually exclusive recurrent KRAS and MAP2K1 mutations in Rosai-Dorfman disease.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In every case there was emperipolesis in a subset of the histiocytes, although emperipolesis
      was much less obvious in extranodal sites.
    explanation: >-
      The caveat this row turns on. Cutaneous Rosai-Dorfman disease is the extranodal setting, so
      the hallmark is least conspicuous exactly where this differential is live.
- name: Cutaneous mastocytoma
  disease_term:
    preferred_term: cutaneous mastocytoma
    term:
      id: MONDO:0019314
      label: cutaneous mastocytoma
  description: >-
    A cutaneous mast cell lesion that competes with this entry's commonest presentation, a solitary
    skin nodule. It is usually separated clinically by a positive Darier's sign rather than
    histologically - but the consensus the row cites says that in young children with a typical
    mastocytoma the sign is often not tested at all, because of the risk of provoking a systemic
    reaction, so a negative is not available to lean on in exactly the population this differential
    is about. There is also a reported variant that morphology does not separate: a histiocyte-rich
    pleomorphic mastocytoma containing xanthomatous histiocytes and Touton-type giant cells, which
    its authors describe as mimicking juvenile xanthogranuloma.
  distinguishing_features:
  - >-
      A positive Darier's sign is part of the clinical definition of cutaneous mastocytosis in
      children. No cited source records it in juvenile xanthogranuloma, which is an absence of
      mention rather than a tested negative.
  - >-
      In young children with a typical mastocytoma the sign is often not tested, so its absence from
      a record does not mean it was sought.
  - >-
      CD117 and mast cell tryptase identify the mast cell lineage.
  - >-
      Touton-type giant cells do not discriminate - a reported mastocytoma variant contains them.
  evidence:
  - reference: PMID:34901755
    reference_title: >-
      Updated Diagnostic Criteria and Classification of Mast Cell Disorders: A Consensus Proposal.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In children, CM is defined by typical skin lesions, a positive Darier's sign, and the absence
      of clinical signs of systemic involvement
    explanation: >-
      The clinical definition in children, which is where the Darier's sign sits in the diagnosis
      rather than being an incidental finding.
  - reference: PMID:34901755
    reference_title: >-
      Updated Diagnostic Criteria and Classification of Mast Cell Disorders: A Consensus Proposal.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      In young children with typical mastocytoma, testing for the Darier's sign is often avoided
      because of the risk to provoke systemic reactions.
    explanation: >-
      The caveat the same consensus carries, in the population this row is about. It is what stops
      the Darier's sign reading as a test that is always available.
  - reference: PMID:19602070
    reference_title: >-
      Histiocyte-rich pleomorphic mastocytoma: an uncommon variant mimicking juvenile
      xanthogranuloma and Langerhans cell histiocytosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By immunohistochemistry, the cells expressed CD117 (C-Kit), mast cell tryptase, CD68, and
      CD25, and were negative for CD163, CD1a, and S-100, confirming the diagnosis of mastocytoma.
    explanation: >-
      The markers that settle it, in the one reported case that morphology did not settle. Note the
      lesion is CD68-positive and CD1a-negative, so those two carry nothing here either.
  - reference: PMID:19602070
    reference_title: >-
      Histiocyte-rich pleomorphic mastocytoma: an uncommon variant mimicking juvenile
      xanthogranuloma and Langerhans cell histiocytosis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Equally prominent was an admixed infiltrate of CD68 and CD163-positive xanthomatous
      histiocytes that included Touton-type giant cells.
    explanation: >-
      Touton-type giant cells in a mastocytoma, which is why this row does not offer them as a
      discriminator.
- name: Papular xanthoma
  disease_term:
    preferred_term: papular xanthoma
    term:
      id: MONDO:0015536
      label: papular xanthoma
  description: >-
    The closest histological mimic in this section. It is a normolipaemic non-Langerhans
    histiocytosis whose lesions contain xanthomatised macrophages and numerous Touton giant cells -
    the Touton cells are this entry's own histopathology row, and the lipid-laden macrophages are
    its lipid-accumulation pathophysiology node. Factor XIIIa is what separates them, and it runs
    the other way from the usual marker logic: papular xanthoma is factor XIIIa-negative where
    juvenile xanthogranuloma is positive in nearly every case.
  distinguishing_features:
  - >-
      Factor XIIIa is negative in papular xanthoma and positive in 99 percent of juvenile
      xanthogranuloma in the Kiel series this entry already cites.
  - >-
      Touton giant cells are present in both and do not separate them.
  evidence:
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Staining for factor XIIIa and CD1a were negative.
    explanation: >-
      The negative that separates the two. The same sentence is cited from the papular xanthoma
      entry's own reciprocal row, with the same supports and evidence_source; that row records no
      directness or quote_role, which this item adds.
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histology showed moderately well circumscribed exoendophytic papules with a regular epidermis
      and a dense infiltration of xanthomatized macrophages interspersed by numerous Touton type
      giant cells.
    explanation: >-
      The shared histology, including the Touton giant cells, which is why this differential cannot
      be settled on morphology.
  - reference: PMID:12028152
    reference_title: "Papular xanthoma: a clinicopathological study of 10 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Papular xanthoma (PX) is one of several clinicopathologic variants of normolipemic cutaneous
      non-Langerhans cell histiocytoses (n-LCH).
    explanation: >-
      Places papular xanthoma in the same family as this disease, which is why the two look alike.
      BACKGROUND because it opens the abstract as a definition rather than reporting the series'
      own finding.
- name: Spitz nevus
  disease_term:
    preferred_term: spitz nevus
    term:
      id: MONDO:0044793
      label: spitz nevus
  description: >-
    A clinical and dermoscopic differential rather than a histological one. This entry's diagnosis
    section already records the orange-yellow dermoscopic background as the most characteristic
    finding; the cited case report is where the name "setting sun" comes from. A reported ulcerated
    atypical Spitz naevus produced the same appearance, from serous crusting rather than from
    histiocytic infiltration. Spitz naevus is also named among the clinical differentials of a
    solitary juvenile xanthogranuloma.
  distinguishing_features:
  - >-
      The orange-yellow dermoscopic background is not specific - in an ulcerated Spitz naevus it
      came from serous crusting rather than from a histiocytic infiltrate.
  - >-
      The cited report describes polymorphous vascular structures under dermoscopy as unique to
      atypical Spitz naevi, stated generally rather than for its own case alone.
  evidence:
  - reference: PMID:25441121
    reference_title: Ulcerated Spitz nevus masquerading as a juvenile xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This yellow to orange appearance was due to serous crusting and not histiocytic infiltration,
      which is seen in JXG.
    explanation: >-
      Why the dermoscopic sign this entry records does not by itself exclude a Spitz naevus, and
      what produced it instead in the reported case.
  - reference: PMID:29165834
    reference_title: >-
      Juvenile xanthogranuloma with angiomatous appearance and a peculiar immunophenotype.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical differential diagnosis of a solitary juvenile xanthogranuloma includes molluscum
      contagiosum, Spitz nevus, and melanoma.
    explanation: >-
      Names Spitz naevus among the clinical differentials of the solitary lesion. BACKGROUND and
      HUMAN_CLINICAL rather than REVIEW_SYNTHESIS and OTHER: the paper is a single case report, and
      this is its introduction restating established clinical knowledge. The same sentence names
      molluscum contagiosum and melanoma, which this section does not yet carry.
treatments:
- name: Observation of a cutaneous lesion
  description: >-
    Most cutaneous lesions resolve without treatment, so doing nothing is the usual management. The kinase
    series makes the same point from the molecular side: regression happened in tumours carrying a driver.
  evidence:
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions,
      advanced cases may show more complexity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile xanthogranuloma is generally considered to be a benign disorder; most lesions are solitary
      cutaneous nodules that resolve spontaneously without treatment.
    explanation: That most lesions resolve without treatment, which is the ground for observing them.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most were treated surgically, although spontaneous regression occurred in 1 of 6 with CLTC::SYK
      and 2 of 7 with CSF1R mutations, underscoring that treatment is not always necessary.
    explanation: >-
      Regression in driver-positive tumours, which the authors read as showing treatment is not always
      necessary.
  notes: >-
    No treatment_term is bound. Watchful waiting has no NCIT label at all - neither l~watchful nor a synonym
    search returns one. NCIT:C25598 Observation Activity is inside the enum, but it sits under Diagnostic
    Procedure, so binding it to a treatment row would assert an investigation rather than the decision
    not to treat.
- name: Excision of a cutaneous lesion
  description: Simple excision, where a lesion is symptomatic or the diagnosis is in doubt.
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:15613853
    reference_title: >-
      Juvenile xanthogranuloma in childhood and adolescence: a clinicopathologic study of 129 patients
      from the kiel pediatric tumor registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Simple tumor excision is the therapy for choice except in the very rare systemic JXG, in which multimodal
      chemotherapy is indicated.
    explanation: Excision as the usual therapy, with chemotherapy reserved for systemic disease.
- name: Topical or periocular corticosteroid for iris disease
  description: >-
    Iris disease is treated medically, and the cited series reports stabilisation or improvement of vision
    and intraocular pressure. The same series treated non-iris ocular disease differently - excisional
    biopsy in 5 of 9 - so this row is scoped to the iris, which is where the disease preferentially sits.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:26189188
    reference_title: >-
      Juvenile Xanthogranuloma Involving the Eye and Ocular Adnexa: Tumor Control, Visual Outcomes, and
      Globe Salvage in 30 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Iris JXG responds to topical or periocular corticosteroids, often with stabilization or improvement
      of vision and IOP.
    explanation: The response, as the series states it.
  notes: >-
    The cited series names topical and periocular corticosteroid without naming an agent, so the class
    term is bound rather than a representative molecule.
- name: Langerhans-cell-histiocytosis chemotherapy protocol for systemic disease
  description: >-
    Systemic disease is treated on LCH-derived regimens - vindesine with prednisone first line, cytarabine
    with vindesine and dexamethasone, with or without cladribine, second line.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: vindesine
      term:
        id: CHEBI:36373
        label: vindesine
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: cladribine
      term:
        id: CHEBI:567361
        label: cladribine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34178890
    reference_title: >-
      Clinical Analysis of Pediatric Systemic Juvenile Xanthogranulomas: A Retrospective Single-Center
      Study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were treated with vindesine + prednisone as the first-line treatment and cytarabine + vindesine
      + dexamethasone ± cladribine as the second-line treatment
    explanation: The regimens used, first and second line.
  - reference: PMID:34178890
    reference_title: >-
      Clinical Analysis of Pediatric Systemic Juvenile Xanthogranulomas: A Retrospective Single-Center
      Study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The chemotherapy protocol for Langerhans cell histiocytosis (LCH) may be effective for patients
      with systemic JXG.
    explanation: The authors' own conclusion, stated with their hedge.
  notes: >-
    Vindesine is the regimen's backbone and is named by the source. It had no row in the committed CHEBI
    cache, which is silence rather than a negative answer, so the term was looked up in CHEBI and bound;
    validation writes the cache row.
- name: BRAF inhibition in BRAF V600E disease
  target_mechanisms:
  - target: Kinase Pathway Activation in Lesional Histiocytes
    treatment_effect: INHIBITS
    description: >-
      The link is drawn from the cited clinical response: a BRAF inhibitor given to BRAF V600E
      patients acts at the pathway step this node records rather than on the lesion it produces. It
      is scoped to the BRAF V600E subset, as the treatment row is. Nothing cited here measures
      pathway activity before and after treatment.
    evidence:
    - reference: PMID:39177799
      reference_title: >-
        Clinical features and outcomes of 17 children with systemic juvenile xanthogranuloma (sJXG)
        including five complicated with hemophagocytic lymphohistiocytosis (HLH).
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with BRAF V600E mutation showed a response to dabrafenib.
      explanation: >-
        The clinical response that licenses the link. INDIRECT because a response to a BRAF inhibitor
        implies the pathway is the target without measuring pathway activity before and after.
  description: Both patients with a BRAF V600E CNS lesion in the cited series responded to BRAF inhibition.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dabrafenib
      term:
        id: CHEBI:75045
        label: dabrafenib
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRAFV600E was detected in 1 child and 1 adult with CNS-xanthogranulomas; both responded to BRAF
      inhibition.
    explanation: The two patients and their response.
  - reference: PMID:39177799
    reference_title: >-
      Clinical features and outcomes of 17 children with systemic juvenile xanthogranuloma (sJXG) including
      five complicated with hemophagocytic lymphohistiocytosis (HLH).
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with BRAF V600E mutation showed a response to dabrafenib.
    explanation: The agent, named in a second cohort.

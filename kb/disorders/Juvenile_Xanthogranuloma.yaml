    reference_title: >-
      NTRK expression is common in xanthogranuloma and is associated with the solitary variant.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found 23 cases of JXG or AXG with overexpression of NTRK by immunostain, and these cases were

    treated; among ocular sites the iris is the one most often involved. Unilateral glaucoma is one
    of the patterns of intraocular disease in infants, and case reports describe it in infants of 2,
    4 and 7 months, the latter two with spontaneous hyphema. In the ocular series, intraocular
    pressure in eyes with iris disease ranged from 11 to 30 mmHg, and at follow-up it was controlled
    long-term without medication in 14 of 21 patients.

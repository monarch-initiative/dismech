    explanation: >-
      The index case's fusion, found by sequencing, then the retrospective set of 34 histiocytoses,
      with its 20 lesions of the juvenile xanthogranuloma family, and the five further fusions among
      them. Together with the conclusion quoted above, these are the 6 of 21.

    reference_title: >-
      Juvenile xanthogranulomas in the first two decades of life: a clinicopathologic study of 174 cases
      with cutaneous and extracutaneous manifestations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL

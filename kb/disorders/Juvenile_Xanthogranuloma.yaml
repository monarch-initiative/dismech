progression:
- phase: Course of the skin lesions
  notes: >-
    The skin lesions appear in infancy, mature and in most patients regress without treatment. In a
    series of 147 Asian children spontaneous resolution was documented in 57.7% of patients, a share
    the abstract does not tie to a count, after a mean of 18.8 months, and its proportion and speed
    did not differ between children with one lesion and those with several. A case report's
    introduction gives a tendency to resolve by the age of 3 to 6 years. The Kiel registry's relapse
    rate, across all its patients including five with systemic disease, was low (7.0%), and lesions
    involuted completely even after incomplete resection. A dermoscopy series placed its 11 patients
    in an early evolutionary, a fully developed or a late regressive stage, and an introduction
    describes older, regressing lesions as fibrotic or sometimes made up mainly of spindle cells. A
    review of 221 fetuses and neonates with histiocytic lesions suggests that spontaneous regression
    of certain histiocytic lesions is more frequent in neonates than in older individuals, with the
    cutaneous forms of this disease and of Langerhans cell histiocytosis regressing most often. One
    case series' introduction says the skin lesions involute without sequelae; no cited source
    describes scarring or a change in pigment after it.
  evidence:
  - reference: PMID:34820973
    reference_title: >-
      Juvenile xanthogranulomas in Asian children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous resolution was documented in 57.7% of our patients with mean duration to
      resolution of 18.8 months. The proportion and speed of resolution did not differ in children
      with single or multiple lesions.
    explanation: >-
      How often and how fast the lesions resolved in a cohort that followed them, and that the
      number of lesions made no difference; the abstract gives no denominator for the share.
      Documented resolution is not a rate adjusted for follow-up.

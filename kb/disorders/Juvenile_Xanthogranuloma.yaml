  description: >-
    Disease outside the skin. The series differ in how they were assembled, and in which sites are
    commonest: subcutaneous soft tissue, then the central nervous system and the liver or spleen, in
    36 children, two of the authors' own and 34 from earlier reports, fewer than half of whom had
    skin lesions; the central nervous system, liver, lung and eye in a systematic review of 159
    published patients; and the central nervous system, lung and bone in ten children at one
    hospital. In a pathology series of 174 cases, 16% had a solitary subcutaneous or deep
    soft-tissue mass, 5% a solitary extracutaneous lesion outside soft tissue and 5% multiple
    cutaneous and visceral-systemic lesions. A subset develops haemophagocytic lymphohistiocytosis,
    with fever, rash, hepatosplenomegaly and cytopenia.

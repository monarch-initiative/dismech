    reference_title: >-
      Juvenile xanthogranuloma in childhood and adolescence: a clinicopathologic study of 129 patients
      from the kiel pediatric tumor registry.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, CJXG was most frequent (47.2%), followed by EJXG (27.1%) and TJXG (16.0%). A
      total of 9.7% of the lesions represented combined JXG.
    explanation: >-
      The shares in the Kiel registry, which studied 148 biopsy specimens from 129 patients; the
      abstract does not say which denominator the shares use.
  - reference: PMID:35378409
    reference_title: >-
      Juvenile and adult xanthogranuloma: A 30-year single-center experience and review of the
      disorder and its relationship to other histiocytoses.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL

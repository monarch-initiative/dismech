- name: 'Histological patterns: early, classic and transitional'
  description: >-
    Lesions are classified into an early pattern (also called early classic), a classic pattern and a
    transitional pattern, with some lesions showing more than one. A separate study describes how
    lesions change as they mature: young lesions show small macrophages scattered in the dermis close
    to the epidermis; as the lesion matures, foamy macrophages and Touton cells increase; regressing
    lesions show spindle cells in a storiform arrangement, interstitial fibrosis, and few foamy or
    Touton cells. The cited sources do not map the named patterns onto these stages one to one. The
    shares differ between series: classic 47.2%, early 27.1% and transitional 16.0%, with 9.7%
    combined, in the Kiel paediatric tumour registry, against early 14.2%, classic 45.3% and
    transitional 40.5% in one centre's archive; neither abstract gives the denominator of its shares.

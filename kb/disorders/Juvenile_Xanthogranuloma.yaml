discussions:
- discussion_id: jxg_cltc_syk_entity_status
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#mTOR Activation and Cyclin D1 Expression in CLTC::SYK Fusion Lesions
  prompt: >-
    Are the CLTC::SYK fusion-positive soft-tissue lesions a form of juvenile xanthogranuloma, or a
    genetically and histologically distinct histiocytoma that resembles it?
  rationale: >-
    The entry carries the fusion as one of this disease's driver alterations, on a series that found
    it in six children and reported concordant methylation profiles with other features of the
    disease. A three-case series describing the same fusion reaches the opposite conclusion: its
    lesions lacked Touton giant cells, and a separate cohort of classic juvenile xanthogranuloma
    profiled by fluorescence in situ hybridization carried no fusion, which its authors read as
    suggesting fusion-positive histiocytoma is a distinct entity. The two are not straightforwardly
    reconcilable, and the first series notes the same Touton-cell absence without drawing the same
    conclusion from it. Nothing cited here settles it, so the fusion content in this entry is scoped
    to fusion-positive lesions rather than asserted of the disease as a whole.
  evidence:
  - reference: PMID:37522373
    reference_title: >-
      Expanding Our Knowledge of Molecular Pathogenesis in Histiocytoses: Solitary Soft Tissue
      Histiocytomas in Children With a Novel CLTC::SYK Fusion.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A separate cohort of classic JXG cases subsequently profiled by fluorescence in situ
      hybridization were negative for the presence of a CLTC::SYK fusion suggesting that CLTC::SYK
      fusion-positive histiocytoma is genetically and histologically distinct from JXG.
    explanation: >-
      The distinctness claim and the negative result it rests on.
  - reference: PMID:37522373
    reference_title: >-
      Expanding Our Knowledge of Molecular Pathogenesis in Histiocytoses: Solitary Soft Tissue
      Histiocytomas in Children With a Novel CLTC::SYK Fusion.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Morphologically, all 3 neoplasms were composed of sheets of cells with round-oval nuclei and
      vacuolated eosinophilic cytoplasm but, in contrast to classic juvenile xanthogranuloma (JXG),
      Touton giant cells were absent.
    explanation: >-
      The morphological half of the argument, which this entry's own Touton node already records from
      the other series without drawing the same conclusion.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumors with CLTC::SYK fusions generally lacked Touton giant cells but exhibited many other
      histologic features of JXG and concordant methylation profiles.
    explanation: >-
      The other side. The same morphological observation, read as a variant of the disease rather
      than a separate entity, with methylation offered as the reason.
- discussion_id: jxg_braf_lesion_site_entity_status
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#BRAF V600E
  prompt: >-
    Are the intracranial and cranial lesions that carry BRAF V600E a form of juvenile
    xanthogranuloma, or a BRAF-mutant histiocytosis that resembles it and belongs with Langerhans
    cell histiocytosis and Erdheim-Chester disease?
  rationale: >-
    The entry carries BRAF V600E as one of this disease's somatic drivers, on two series that
    between them report five cases, and neither places a case outside the central nervous system or
    the cranium, though they do not say it the same way: the three-case report says intracranial and
    cranial where the extracutaneous series says only CNS. The report of
    three of those cases reaches the opposite conclusion about what they are:
    its authors argue that the intracranial and cranial lesions likely differ from cutaneous
    juvenile xanthogranuloma in clinical features and in BRAF status, and propose classifying them
    with Langerhans cell histiocytosis and Erdheim-Chester disease, which carry the same variant.
    The other series reports its two cases as CNS-xanthogranulomas, one a child inside its
    extracutaneous juvenile xanthogranuloma arm and one an adult in its separate adult
    xanthogranuloma arm, which is the opposite reading of the same lesions. Neither settles it,
    and the third cited source that reports BRAF V600E patients, the systemic series behind the
    dabrafenib response, gives no lesion site for them at all. This is the second entity question in
    this entry, beside the one the CLTC::SYK controversy records, and it is recorded rather than
    resolved for the same reason.
  evidence:
  - reference: PMID:28504206
    reference_title: >-
      BRAF V600E mutation in pediatric intracranial and cranial juvenile xanthogranuloma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although these intracranial/cranial lesions have been referred to as JXG, they likely differ
      from cutaneous JXG in both the clinical features and BRAF status.
    explanation: >-
      The distinctness claim, from the authors of the three-case report. INDIRECT because it is
      their reading of their own cases rather than a measured distinction, which is how this entry
      already grades the next sentence of the same abstract on the Erdheim-Chester differential row.
  - reference: PMID:28504206
    reference_title: >-
      BRAF V600E mutation in pediatric intracranial and cranial juvenile xanthogranuloma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It may be more appropriate to classify intracranial/cranial JXG in the same group as
      Langerhans cell histiocytosis and Erdheim-Chester disease, which also have a BRAF V600E
      mutation.
    explanation: >-
      Where the same authors would put these lesions instead, which is what makes the question a
      nosological one rather than only a caveat on the variant.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRAFV600E was detected in 1 child and 1 adult with CNS-xanthogranulomas; both responded to BRAF
      inhibition.
    explanation: >-
      The other reading of the same kind of lesion. This series names its two BRAF V600E cases
      xanthogranulomas, in a paper titled for juvenile xanthogranuloma, which cuts against the
      distinctness claim; one is a child in its extracutaneous arm and one an adult in its separate
      adult arm, so the cohort is not uniformly juvenile. INDIRECT because treating them as this
      disease is the series' framing rather than a result it reports.
- discussion_id: jxg_mek_inhibition_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Does MEK inhibition work in juvenile xanthogranuloma? A phase II trial of the MEK inhibitor
    cobimetinib in histiocytic neoplasms reported responses across histiocytosis subtypes and
    tumour genotypes, but no patient it enrolled had this disease.
  rationale: >-
    The trial bears on this disease only by inference. Its 18 patients had Erdheim-Chester disease
    (12), Langerhans cell histiocytosis (2), Rosai-Dorfman disease (2) or mixed histiocytosis (2),
    and eligibility required an age of 16 or older. No reference this entry cites reports MEK
    inhibition in a patient with this disease.
  evidence:
  - reference: PMID:30867592
    reference_title: Efficacy of MEK inhibition in patients with histiocytic neoplasms.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the 18 patients that we treated, the overall response rate was 89% (90% confidence
      interval of 73-100).
    explanation: >-
      The trial's primary result. It reaches this disease only by inference, because its patients
      had other histiocytic neoplasms.
  - reference: PMID:30867592
    reference_title: Efficacy of MEK inhibition in patients with histiocytic neoplasms.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Responses to cobimetinib were observed across histiocytosis subtypes and tumor genotypes,
      although consistent with the expectations for a study mandating adult patients to have either
      refractory or multiorgan disease, ECD constituted the majority (67%) of treated patients.
      Therefore, some caution is warranted when applying these findings to all patients with
      histiocytosis.
    explanation: >-
      The authors' own limit on how far the result reaches: responses across subtypes and genotypes,
      from a cohort of adults that was mostly Erdheim-Chester disease, with caution about applying
      it to every histiocytosis.
notes: >-
  The association with neurofibromatosis type 1 and juvenile myelomonocytic leukaemia is carried by the
  germline NF1 genetic record, where each figure sits next to the source that states it. The sources
  there disagree, and the disagreement is the point: a 1995 world literature review puts the three-way
  association well above chance and estimates a leukaemia risk among children who have both
  conditions, a 2023 systematic review argues for leukaemia surveillance in a defined subgroup, and a
  739-patient case-control study found the xanthogranulomas conferred no increased malignancy risk.
  What is not in dispute is the direction this entry's row records, that the two conditions go
  together: the 2023 systematic review opens by stating that a subset of patients with neurofibromatosis type 1
  develop juvenile xanthogranulomas. The 1995 review's 30-fold to 40-fold excess is not a second
  statement of that, and is not used as one here: its figure is for the triple association with
  juvenile chronic myelogenous leukaemia, as the paragraph above and the record's own notes both
  say. The 2021 international consensus adds only weak corroboration, having evaluated the lesion as
  a candidate diagnostic criterion and then not incorporated it. A 2025 case
  report found the same somatic PTPN11 variant in a skin lesion and in blood, which is the only cached
  evidence that the two diseases are clonally related, and it is cited on the PTPN11 row.


  Langerin/CD207 negativity is not asserted anywhere in this entry. It is widely stated for this disease,
  but no source cached here carries it, and the CD1a and S-100 negativity that is cited from two independent
  series does the same discriminating work. Where the word does appear - the histopathology description and
  the Langerhans cell histiocytosis differential row - it names what that other disease is positive for, which
  the differential row cites to two sources of its own.


  Copy-number change is recorded as not being the driver, on the cited series' own conclusion. The individual
  chromosomal gains and losses that series reports are deliberately left out.


  MEK inhibition is not among this entry's treatments. Whether it applies here is recorded as a
  knowledge gap in `discussions`, on a phase II trial of cobimetinib in histiocytic neoplasms that
  enrolled no patient with this disease. A search of the other references this entry cites, for
  trametinib, cobimetinib, selumetinib, binimetinib, MEK inhibit, MEK-inhibit and MEK inhibitor,
  finds three, and none is about this disease: the Rosai-Dorfman mutation paper, whose discussion
  reports two Erdheim-Chester patients treated by another group; the Erdheim-Chester review; and
  the neurofibromatosis type 1 diagnostic criteria, where selumetinib is named for plexiform
  neurofibroma. Citing any of them on a treatment row here would assert a cross-disease transfer
  none of them makes. The search covers only what this entry cites, so it is not a finding about
  the literature. The only ClinicalTrials.gov identifier in the references this entry cites is the
  cobimetinib trial's own, NCT02649972.
review_notes: >-
  Every ontology identifier here was read from the local HGNC or NCIT build, or from the committed CL,
  GO, HP and CHEBI caches, in the step the line was written.


  Three things the deep-research report claimed that no cached reference supports, and that are therefore
  absent from this entry: a 5 to 10 percent mortality for systemic disease; an estimated incidence of
  about one per million; and placement in group C of the 2016 Histiocyte Society classification, whose
  cached abstract names the five groups but never names this disease or the xanthogranuloma family. The
  report also presents as a verbatim quotation from PMID:12717244 a sentence that is not in that cache
  - the real sentence is the one this entry quotes in histopathology, without the clause about supporting
  a dendritic-cell classification.


  PMID:37736360 and DOI:10.18632/oncotarget.17521 have no cache file, so neither is citable and
  neither is cited here. PMID:34820973 is cached as an abstract and is cited three times; only its
  Wiley DOI record, which the deep-research report also gives, is uncached.
  PMID:37422708 is not among them: it is cached with its full text and is cited twice on the germline
  NF1 record. Any statistic the deep-research report attributes to it still has to be checked
  against that cache sentence by sentence before it is written here, which is a different thing from
  the reference being uncitable.

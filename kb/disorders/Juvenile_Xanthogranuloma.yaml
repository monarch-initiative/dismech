- name: Central nervous system symptoms
  category: Neurologic
  description: >-
    CNS xanthogranuloma produces no single syndrome. A dedicated imaging series reports headache,
    seizure, ataxia, strabismus, hearing loss, facial paresis and diabetes insipidus, and the
    discussion of a head-and-neck imaging series adds neurological deficits, growth retardation,
    ocular disturbance, developmental delay, behavioural and memory disorders and raised
    intracranial pressure. Intracranial lesions can be found with the skin lesions or months to
    years after them. A systematic review of systemic disease found that the permanent sequelae were
    mainly symptoms of the nervous system and of the eye. Central diabetes insipidus has its own
    row.

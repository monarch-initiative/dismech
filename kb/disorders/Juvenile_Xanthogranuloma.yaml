- name: Avidly enhancing intra-axial lesion of the central nervous system on MRI
  modality: MRI
  description: >-
    In 14 children with central nervous system disease, in most cases the lesions were
    small-to-medium intra-axial masses, isointense to cortical grey matter on T1-weighted images and
    iso- or hyperintense on T2-weighted images, with restricted diffusion and perilesional oedema,
    and almost all enhanced avidly. Large or non-enhancing lesions and leptomeningeal disease were
    less common. Five patients had a single focus and nine had several, one of them with
    intracranial and spinal leptomeningeal disease. The authors conclude that the appearances may be
    heterogeneous and may mimic primary brain tumours, metastases, lymphoma and leukaemia, other
    histiocytic disorders, infections and granulomatous disease. The T2 signal differs from the
    mostly T2-hypointense lesions of the head and neck series, whose discussion sets this series
    against earlier reports of an iso- to hypointense T2 signal. The same discussion calls
    dural-based lesions common in intracranial disease, so an intra-axial mass is this series'
    commonest pattern and not the only one reported.
  imaging_finding_term:
    preferred_term: avidly enhancing intra-axial mass
    term:
      id: NCIT:C113842
      label: Enhancing Lesion
  located_in:

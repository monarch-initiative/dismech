- name: Enhancing T2-hypointense lesion of the head and neck on MRI
  modality: MRI
  description: >-
    In a series of 11 patients with head and neck lesions in various locations, 10 had MRI. The
    lesions were mildly hyperintense or isointense on T1-weighted images in 8 of 9 patients,
    hypointense on T2-weighted images in 7 of 10, with low ADC in 7 of 9, and enhanced in all 7
    patients imaged after gadolinium injection, homogeneously in 5. The authors propose seven
    features as criteria suggesting the diagnosis of an extracutaneous lesion: age under one year, a
    well-defined lesion, mild T1 hyperintensity, T2 hypointensity, low ADC, enhancement and possible
    involvement of adjacent bone. Their discussion adds that an iso- or hypointense T2 signal is not
    pathognomonic, being found in fibroblastic and myofibroblastic tumours too.
  imaging_finding_term:
    preferred_term: enhancing lesion, hypointense on T2-weighted images, with low ADC
    term:
      id: NCIT:C28746
      label: Gadolinium-Enhancing Lesion
  located_in:
    preferred_term: head and neck
    term:
      id: UBERON:0007811
      label: craniocervical region
  diagnostic: false
  notes: >-
    The paper does not agree with itself on how many patients had an ADC map. Its abstract and
    results give low ADC in 7 of 9; its methods give ADC mapping in 8 of 10 patients; and its second
    table lists an ADC value for eight patients, seven of them low. Its figure legends also differ
    from its second table for single patients: the ADC of patient 10, and the enhancement of
    patients 6 and 7. The counts in the description are those of the paper's abstract and results
    text.

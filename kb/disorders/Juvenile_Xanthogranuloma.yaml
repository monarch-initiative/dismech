    not about PTPN11 generally: a cached but uncited report describes juvenile xanthogranulomas in
    Noonan syndrome with a germline PTPN11 variant, which would be a predisposition through the same
    pathway rather than a driver event in the lesion, and which this entry does not curate. It is recorded because it is the only cached
    evidence bearing on whether the leukaemia association is clonal, and not as a frequency claim.

name: Juvenile Xanthogranuloma
creation_date: '2026-11-11T19:45:00Z'
categories:
- Histiocytic Disorder
- Pediatric Skin Disorder
parents:
- histiocytosis
disease_term:
  preferred_term: juvenile xanthogranuloma
  term:
    id: MONDO:0015534
    label: juvenile xanthogranuloma
description: >-
  The commonest non-Langerhans-cell histiocytosis, and in most children a solitary yellow-orange cutaneous
  papule or nodule that appears in infancy and resolves on its own. It is nevertheless a clonal myeloid
  neoplasm. Where it has been looked for hardest - in the rare extracutaneous form - a targetable kinase
  alteration was found in every one of 16 children sequenced, most often a CLTC::SYK fusion or a CSF1R
  mutation, with BRAF V600E in one child and a TPM3::NTRK1 fusion or a MAP2K1 deletion in two. How far
  that generalises to the common solitary cutaneous lesion is not settled by anything cited here: one
  cached study of solitary lesions used a copy-number assay and found a clonal alteration in two of
  nineteen, and another found NTRK overexpression on immunostaining in about half of localised lesions.
  Extracutaneous and systemic disease, where the central nervous system, liver, lung and eye
  are the usual sites, carries real mortality.
synonyms:
- JXG
- nevoxanthoendothelioma
- juvenile xanthoendothelioma
pathophysiology:
- name: Somatic Kinase Alteration in a Myeloid Precursor
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  description: >-
    The initiating lesion is a somatic alteration in a kinase gene, in a cell of the
    macrophage/dendritic lineage. The series that establishes this is scoped to the rare extracutaneous
    form: it found a targetable kinase alteration in 16 of 16 children with extracutaneous disease,
    CLTC::SYK fusion and CSF1R mutation commonest, with NTRK1 fusion, BRAF V600E and MAP2K1 deletion
    also represented, and an MRC1::PDGFRB fusion beside the CSF1R mutation in one child. For this
    disease's own alterations, the cited sources as read for this entry support an activating effect for
    the CLTC::SYK fusion and for BRAF V600E, and do not characterise the effect of the CSF1R mutations,
    the MAP2K1 deletion, the NTRK1 fusions or the MRC1::PDGFRB fusion; the notes say how far that
    reading goes. The lesion's clonality has been shown; which cell it arises in has not been settled,
    and the entry records that as the open question it is.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: activated kinase activity of the driver gene
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004672
      label: protein kinase activity
  cell_types:

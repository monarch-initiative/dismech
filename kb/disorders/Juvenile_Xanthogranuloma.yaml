- name: NF1 (germline, in the neurofibromatosis type 1 association)
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34012067
    reference_title: >-
      Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international
      consensus recommendation.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the clinical features considered were presence of characteristic tumors such as
      neurofibromas or gliomas; presence of cutaneous findings including CALMs, skinfold freckling,
      juvenile xanthogranulomas, 23 and nevus anemicus;
    explanation: >-
      The 2021 international consensus steering committee evaluated juvenile xanthogranulomas as a
      candidate cutaneous diagnostic criterion for neurofibromatosis type 1, alongside cafe-au-lait
      macules, skinfold freckling and nevus anemicus. That an international NF committee assessed
      the lesion as a candidate marker of the disease is the support this row takes from the paper.
      INDIRECT because the sentence records what was considered, not a measured risk, and the row's
      claim follows only by the inference that a finding unrelated to NF1 would not have been a
      candidate. What the committee then decided is quoted from the same paper on this row, and the two must be read
      together.
  - reference: PMID:34012067
    reference_title: >-
      Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international
      consensus recommendation.
    supports: NO_EVIDENCE
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some possible diagnostic criteria were not incorporated into the revised criteria because of
      insufficient data on specificity and/or sensitivity or other reasons. These criteria include
      FASI detected by MRI (given concerns about their specificity and their disappearance over time
      in some patients, the potential complications of anesthesia in children in scans done for
      diagnostic evaluation), nevus anemicus, and juvenile xanthogranuloma (Supplementary Fig. 5;
      both features difficult to diagnose clinically for nondermatologists and xanthogranuloma only
      present transiently).
    explanation: >-
      The committee's own statement of what it left out: juvenile xanthogranuloma was not incorporated
      into the revised criteria, for insufficient data on specificity or sensitivity and because the
      feature is hard to diagnose clinically outside dermatology and is present only transiently.
      Graded NO_EVIDENCE rather than SUPPORT or REFUTE because every stated reason is about how the feature performs as a diagnostic criterion rather than about
      whether germline NF1 raises the risk of the lesion, which is this record's claim. The closest
      the sentence comes is its reference to insufficient sensitivity data, and insufficient data is
      not evidence in either direction. It is cited so the row cannot be
      read as resting on a criterion that does not exist. Note the trap in the paper: an earlier
      paragraph reports high consensus in the first Delphi round for adding juvenile
      xanthogranulomas, and lifted out of the Delphi process that sentence reads exactly like the
      final decision. It is an intermediate ballot. Of the three features it names, only choroidal
      abnormalities reached the published criteria table. The
      committee's own summary of what was left out is this sentence.
  - reference: PMID:37422708
    reference_title: >-
      The association between juvenile xanthogranulomas in neurofibromatosis type 1 patients and the development of leukaemia: A systematic review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A subset of patients with neurofibromatosis type 1 (NF1) develop juvenile xanthogranulomas
      (JXG), the most common non-Langerhans cell histiocytosis, and some patients also develop
      juvenile myelomonocytic leukemia (JMML), a rare, and frequently lethal
      myeloproliferative-myelodysplastic disorder of childhood.
    explanation: >-
      That patients with neurofibromatosis type 1 develop this lesion, stated directly, which is what
      a gene-to-this-disease risk row needs. The leukaemia half of the same sentence is the third element of the association and is evidenced
      separately, by the 1995 world literature review cited on this record.
  - reference: PMID:7632061
    reference_title: >-
      Juvenile xanthogranuloma, neurofibromatosis, and juvenile chronic myelogenous leukemia. World statistical analysis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The observed frequency of the triple association is 30-fold to 40-fold higher than that expected.
    explanation: >-
      The magnitude of the three-way association, from a systematic review of the world literature.
      Indirect for this row because an excess of the triple co-occurrence over what independence
      predicts bears on an NF1-to-xanthogranuloma risk only through an inference step; it is a
      statement about all three conditions together.
  - reference: PMID:7632061
    reference_title: >-
      Juvenile xanthogranuloma, neurofibromatosis, and juvenile chronic myelogenous leukemia. World statistical analysis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is estimated that children with NF and JXG have a 20-fold to 32-fold higher risk for JCML
      than do patients with NF who do not have JXG.
    explanation: >-
      A between-stratum risk ratio, and the figure most often quoted for this association - but note
      what it measures: a leukaemia risk among children who already have both conditions, not a risk
      of developing the xanthogranuloma. Indirect for that reason. The authors write JCML, the older
      name for juvenile myelomonocytic leukaemia; reading the two as one disease is an editorial step
      rather than the source's own.
  - reference: PMID:37422708
    reference_title: >-
      The association between juvenile xanthogranulomas in neurofibromatosis type 1 patients and the development of leukaemia: A systematic review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, based on our results, increased surveillance of JMML may be advisable in NF1 patients
      that have familial NF1, are male, or develop large JXGs in infancy.
    explanation: >-
      The 2023 systematic review's own clinical conclusion, quoted rather than the guidelines sentence
      that precedes it: the review does not rest on current guidelines, it argues past them for a
      defined subgroup, and large xanthogranulomas in infancy are one of the three features it names.
      Indirect for this row because it is a surveillance recommendation about leukaemia.
  - reference: PMID:28189268
    reference_title: >-
      The relationship between neurofibromatosis type 1, juvenile xanthogranuloma, and malignancy: A retrospective case-control study.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile xanthogranulomas do not appear to confer an increased risk for malignancy in children
      with NF-1.
    explanation: >-
      The dissenting result, cited rather than described. A case-control study of 739 children with
      neurofibromatosis type 1 found no increased malignancy risk associated with the
      xanthogranulomas. Read precisely: it refutes the claim that the lesion marks malignancy risk,
      which is what the 1995 fold-figures assert, and it says nothing against this row's own claim
      that neurofibromatosis type 1 raises the risk of the lesion.
  notes: >-
    A risk factor, not a cause: the germline NF1 lesion is a predisposition shared with
    neurofibromatosis type 1, and the somatic kinase lesions in the rows above are what this entry
    models as driving the xanthogranuloma itself. The row's own claim - that neurofibromatosis type 1 raises the risk of this lesion - rests on the
    2023 review's opening statement and, more weakly, on the 2021 consensus having evaluated the
    lesion as a candidate diagnostic criterion. It does not rest on a criterion: that consensus considered juvenile xanthogranuloma and did not
    incorporate it, giving as its reasons that the feature is difficult to diagnose clinically for
    nondermatologists and is present only transiently. The 1995 figures are about something adjacent and are graded indirect for that
    reason: the first is an observed-against-expected comparison for the three-way association, and
    the second is a between-stratum leukaemia risk among children who already have both conditions.
    Neither is a cohort incidence. The sources disagree about what the lesion predicts: the 2023
    review argues for surveillance of a defined subgroup, while a 739-patient case-control study found
    no increased malignancy risk, and both are cited so a reader meets the disagreement here.

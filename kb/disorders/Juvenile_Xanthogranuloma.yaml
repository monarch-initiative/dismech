notes: >-
  The association with neurofibromatosis type 1 and juvenile myelomonocytic leukaemia is carried by the
  germline NF1 genetic record, where each figure sits next to the source that states it. The sources
  there disagree, and the disagreement is the point: a 1995 world literature review puts the three-way
  association well above chance and estimates a leukaemia risk among children who have both
  conditions, a 2023 systematic review argues for leukaemia surveillance in a defined subgroup, and a
  739-patient case-control study found the xanthogranulomas conferred no increased malignancy risk.
  What is not in dispute is the direction this entry's row records, that the two conditions go
  together: the 2023 systematic review opens by stating that a subset of patients with neurofibromatosis type 1
  develop juvenile xanthogranulomas. The 1995 review's 30-fold to 40-fold excess is not a second
  statement of that, and is not used as one here: its figure is for the triple association with
  juvenile chronic myelogenous leukaemia, as the paragraph above and the record's own notes both
  say. The 2021 international consensus adds only weak corroboration, having evaluated the lesion as
  a candidate diagnostic criterion and then not incorporated it. A 2025 case
  report found the same somatic PTPN11 variant in a skin lesion and in blood, which is the only cached
  evidence that the two diseases are clonally related, and it is cited on the PTPN11 row.


  Langerin/CD207 negativity is not asserted anywhere in this entry. It is widely stated for this disease,
  but no source cached here carries it, and the CD1a and S-100 negativity that is cited from two independent
  series does the same discriminating work. The word appears once in the entry, in a histopathology description
  naming what Langerhans cell histiocytosis is positive for; that is a statement about the other disease
  and is not cited to any cache either.


  Copy-number change is recorded as not being the driver, on the cited series' own conclusion. The individual
  chromosomal gains and losses that series reports are deliberately left out.
review_notes: >-
  Every ontology identifier here was read from the local HGNC or NCIT build, or from the committed CL,
  GO, HP and CHEBI caches, in the step the line was written.


  Three things the deep-research report claimed that no cached reference supports, and that are therefore
  absent from this entry: a 5 to 10 percent mortality for systemic disease; an estimated incidence of
  about one per million; and placement in group C of the 2016 Histiocyte Society classification, whose
  cached abstract names the five groups but never names this disease or the xanthogranuloma family. The
  report also presents as a verbatim quotation from PMID:12717244 a sentence that is not in that cache
  - the real sentence is the one this entry quotes in histopathology, without the clause about supporting
  a dendritic-cell classification.


  Three references the report cites are cached with an empty body and cannot support anything:
  PMID:37736360, DOI:10.18632/oncotarget.17521 and the duplicate DOI record of PMID:34820973.
  PMID:37422708 is not among them: it is cached with its full text and is cited twice on the germline
  NF1 record. Any statistic the deep-research report attributes to it still has to be checked
  against that cache sentence by sentence before it is written here, which is a different thing from
  the reference being uncitable.

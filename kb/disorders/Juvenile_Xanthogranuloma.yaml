- phase: Outcome in systemic disease
  notes: >-
    The series differ in how they were assembled, so their figures are not pooled. A systematic
    review of 159 published patients with systemic disease found 10 dead of disease, and patients
    with splenic involvement had a higher risk of death. Two of 36 children in an earlier series of
    two cases and literature reports died of disease. One of ten children at one hospital died, of
    respiratory failure caused by a pulmonary infection. A pathology series of 174 cases names three
    deaths of disease: two neonates with systemic disease and hepatic failure, and a 3-month-old
    with a retroperitoneal and pelvic lesion whose severe hypercalcaemia could not be controlled. In
    the Kiel registry's 129 patients, one of five with widespread congenital systemic disease died,
    after 34 days. In 17 children at one haematology centre, survival did not differ significantly
    with or without haemophagocytic lymphohistiocytosis. The ten-child series and the 17-child
    cohort both come from Beijing Children's Hospital, over overlapping years (2012 to 2019 and 2016
    to 2021), so some children may be in both.

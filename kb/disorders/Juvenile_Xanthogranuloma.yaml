- name: NTRK overexpression on pan-NTRK immunostaining
  description: >-
    Found in about half of localised lesions and in none of the disseminated ones, in a 50-case series
    of juvenile and adult xanthogranuloma screened with a pan-NTRK immunostain: 23 of 43 localised
    cases and none of 7 disseminated. Two index cases carried an NTRK1 fusion found by sequencing, and
    the authors say additional genetic studies are needed. The localised-only result is this series'
    own: the entry records a TPM3::NTRK1 fusion in systemic disease from other sources. A separate
    series, cited on the genetic row NTRK1 fusions, found NTRK1 fusions in 6 of 21 cases: a congenital
    case whose fusion was found by sequencing, and 20 lesions of the juvenile xanthogranuloma family
    among 34 histiocytoses analysed retrospectively, including adult xanthogranuloma and benign cephalic
    histiocytosis, which the authors count as clinical subtypes of this disease.
  diagnostic: false
  evidence:

discussions:
- discussion_id: jxg_skin_regression_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Course of the skin lesions
  - phenotypes#Cutaneous xanthogranuloma
  - pathophysiology#Histiocytic Proliferation and Tissue Infiltration
  prompt: >-
    Why do the skin lesions regress? One introduction calls the disease a clonal myeloid neoplasm
    and another says it is not considered neoplastic, while most cutaneous lesions involute without
    treatment and lesions carrying a kinase alteration have regressed too.
  rationale: >-
    No cited source establishes the cause of the regression. A study of macrophage subsets suggests
    in its introduction that the lesions may arise as a reaction to a nonspecific injury, and a case
    report's introduction that the disease may represent a reactive process. In that study's skin
    biopsies, M1 macrophages were denser in young lesions, and M2 macrophages predominated as
    lesions matured and clustered against the epidermis, except in the two regressing lesions; older
    regressing lesions are described as fibrotic or spindle-celled; and only two of 19 solitary
    lesions in a copy-number study had abnormal genomic profiles. Lesions with a kinase alteration
    have regressed without treatment, but in the one cited report these were soft-tissue tumours and
    systemic disease: one of six soft-tissue lesions with a CLTC::SYK fusion (whether those lesions
    are this disease is itself disputed, in its own discussion), two of seven with a CSF1R mutation,
    and two children with systemic disease carrying a TPM3::NTRK1 fusion or a MAP2K1 deletion, about
    whose skin the abstract says nothing. No cited source reports the driver of a regressing skin
    lesion, gives clinical criteria for when a skin lesion has regressed, or describes an animal or
    cell model of the disease in which regression could be studied. Whether lesions with and without
    a driver regress alike is therefore open. Whether some intracranial and cranial BRAF V600E
    lesions belong with Langerhans cell histiocytosis and Erdheim-Chester disease is a separate
    question, recorded in its own discussion.
  proposed_experiments:
  - experiment_id: exp_jxg_driver_and_course_of_biopsied_skin_lesions
    experiment_design: HUMAN_OBSERVATIONAL
    name: Driver alterations in biopsied skin lesions set against their later course
    description: >-
      In children whose skin lesion was sampled for diagnosis by a partial (punch or incisional)
      biopsy and then observed, profile the driver alterations this entry models for the disease at
      large (the CSF1R mutations, the kinase fusions, BRAF V600E and the MAP2K1 deletion) in the
      archived biopsy, and compare how often lesions with and without a detectable driver went on to
      regress. Lesions are reported to involute even after incomplete resection, so the comparison
      is between biopsied lesions, not against untouched ones. Record each lesion's histological
      pattern at biopsy (early, classic or transitional) and score its macrophage subsets, since the
      subsets shift as a lesion matures, so that composition can be read against course.
    supporting_outcome:
    - >-
        Lesions with and without a detectable driver regress at different rates, which would tie
        regression to the lesion's genetics.
    refuting_outcome:
    - >-
        Lesions with and without a detectable driver regress alike, which would point away from the
        detected drivers and leave the host or the lesion's cellular make-up, which the macrophage
        scoring addresses.
  evidence:
  - reference: PMID:36265894
    reference_title: >-
      Neuroimaging in Pediatric Patients with Juvenile Xanthogranuloma of the CNS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile xanthogranuloma is a rare clonal, myeloid, neoplastic disorder. Typically, juvenile
      xanthogranuloma is a self-limited disorder of infancy, often presenting as a solitary
      red-brown or yellow skin papule/nodule.
    explanation: >-
      The tension the question rests on, in one introduction: a clonal neoplasm that is usually
      self-limited.
  - reference: PMID:35435864
    reference_title: >-
      What is the Role of Different Macrophage Subsets in the Evolution of Juvenile
      Xanthogranulomas?
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its pathogenesis is not well understood, but it is not considered a neoplastic entity. JXGs
      possibly appear as a reaction to a nonspecific injury such as trauma or viral infection,
      although a genetic predisposition has been suggested in some cases.
    explanation: >-
      The reactive view, in the introduction of the macrophage study cited next: the lesions as a
      response to injury rather than a neoplasm.
  - reference: PMID:29450403
    reference_title: >-
      Iris juvenile xanthogranuloma in an infant - spontaneous hyphema and secondary glaucoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The etiology is unknown, although it may represent a reactive process (physical or infectious)
    explanation: >-
      The same view in a case report's introduction.
  - reference: PMID:35435864
    reference_title: >-
      What is the Role of Different Macrophage Subsets in the Evolution of Juvenile
      Xanthogranulomas?
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with mature and regressing JXGs, younger lesions had a higher density of M1
      macrophages, stained with MAC387.
    explanation: >-
      The macrophage composition of young lesions against mature and regressing ones.
  - reference: PMID:35435864
    reference_title: >-
      What is the Role of Different Macrophage Subsets in the Evolution of Juvenile
      Xanthogranulomas?
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As the lesions matured, there was an overwhelming predominance of M2 macrophages. These cells
      tended to cluster against the epidermis, except in the 2 cases in phase of regression.
    explanation: >-
      The shift towards M2 macrophages as lesions mature, and their clustering against the
      epidermis, which the two regressing lesions lacked. It describes the cells of a regressing
      lesion and does not explain the regression.
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary
      lesions, advanced cases may show more complexity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only two of 19 solitary juvenile xanthogranulomas showed abnormal genomic profiles
    explanation: >-
      How rarely solitary lesions carried a detectable genomic change in one study, which assessed
      copy-number alterations and copy-neutral loss of heterozygosity, changes of a different kind
      from the point mutations and fusions named elsewhere in this entry.
  - reference: PMID:39316650
    reference_title: >-
      Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations included CLTC::SYK fusions in 6 children and CSF1R mutations in 7 others; all
      below 2 years of age with soft tissue tumors.
    explanation: >-
      Where the lesions with targetable kinase alterations in that series were: soft-tissue tumours
      in children under 2 years of age.
  - reference: PMID:39316650
    reference_title: >-
      Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most were treated surgically, although spontaneous regression occurred in 1 of 6 with
      CLTC::SYK and 2 of 7 with CSF1R mutations, underscoring that treatment is not always
      necessary.
    explanation: >-
      Regression in lesions carrying a kinase alteration.
  - reference: PMID:39316650
    reference_title: >-
      Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, a TPM3::NTRK1 fusion or MAP2K1 deletion was detected in 2 children with systemic JXG

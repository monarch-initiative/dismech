    explanation: >-
      The fusion confirmed in two cases only, with the authors' own caveat on the rest.
  - reference: PMID:40235191
    reference_title: NTRK1 Gene Fusions Are Frequent in Juvenile Xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: In conclusion, NTRK1 gene fusions are moderately common in JXG (6/21; 28.6% in our series).
    explanation: >-
      The fusion rate in the separate series the genetic row cites, set beside this row's staining
      result: it counts fusions, not staining.
  - reference: PMID:40235191
    reference_title: NTRK1 Gene Fusions Are Frequent in Juvenile Xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing of tissue from a subdermal infiltrate revealed a tropomyosin
      3::neurotrophic tyrosine kinase receptor ( TPM3 :: NTRK1 ) gene fusion. Therefore, a
      retrospective analysis of 34 additional non-Langerhans cell histiocytoses (16 JXG, 3 adult
      xanthogranuloma and 1 benign cephalic histiocytosis, both clinical subtypes of JXG, as well as

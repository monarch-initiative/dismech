epidemiology:
- name: Age distribution
  description: >-
    The Kiel registry study calls the lesion a tumour of infancy, and the median ages in the six of
    this row's seven series that report one run from 5 months to 2.45 years. In the Kiel Paediatric
    Tumour Registry series (148 biopsy specimens from 129 patients) the median age was 5 months
    (mean 22.4 months, range 0 to 244 months); 34.5% of the cases were congenital, and 71.0% of the
    lesions were diagnosed within the first year of life. In 174 cases presenting from the neonatal
    period to 20 years of age the mean age was 3.3 years and the median 1 year. In a series of 147
    Asian children the median age at onset was 15.5 months, and 69.4% presented before 2 years of
    age. A systematic review of systemic disease gives a median age at onset of 9 months, and a
    series of 10 patients with systemic disease a median age at onset of 1.95 years and at diagnosis
    of 2.45 years. In an ocular series the mean age at presentation was 51 months (median 15 months,
    range 1 to 443 months), and the 14 children of a central nervous system imaging series had a
    mean age of 84 months.
  notes: >-
    The figures are not pooled. They come from a tumour registry, a clinicopathologic review, one
    hospital's series, a systematic review of published cases, a series of systemic disease, an
    ocular series and an imaging series, and they do not measure the same thing: the patients' age,
    not further defined, for the Kiel mean and median; age at presentation in the 174-case series
    and the ocular series; age at onset in the series of 147 children, the systematic review and the
    systemic series, which also gives age at diagnosis; and the mean age of the patients included in
    the central nervous system series. The systematic review pooled published cases, so it may count
    patients of the other series. Five of the seven series were confined to patients up to about 20
    years of age, so their figures say nothing about older patients; the ocular series included
    patients up to 443 months old.
  evidence:
  - reference: PMID:15613853
    reference_title: >-
      Juvenile xanthogranuloma in childhood and adolescence: a clinicopathologic study of 129 patients
      from the kiel pediatric tumor registry.
    supports: SUPPORT

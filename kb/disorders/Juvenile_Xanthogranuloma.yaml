imaging_findings:
- name: Hypoechoic skin nodule on ultrasound
  modality: ULTRASOUND
  description: >-
    On ultrasound the skin lesion is mostly a homogeneous, well-circumscribed, regular hypoechoic
    nodule; contrast-enhanced ultrasound shows slight homogeneous enhancement, and on shear-wave
    elastography the lesion appears relatively hard. That is the picture in a series of 14 patients
    with pathologically confirmed lesions, aged 2 months to 48 years, most of them one year old or
    younger, whose lesions were predominantly on the head and face. The pattern is mixed
    beneath the skin. In a head and neck series the five patients examined by ultrasound had lesions
    in subcutaneous fat, deeper soft tissue or the skull: three were hypoechoic and two hyperechoic,
    and vascularisation was seen in two of the four examined by Doppler. Its authors still count the
    well-defined hypoechoic nodule among the suggestive, not pathognomonic, clues they found in their
    series. They call ultrasound useful for superficial lesions without its establishing the
    diagnosis, and say the diagnosis of the cutaneous lesion is strongly suggested by clinical
    examination and does not require imaging.
  imaging_finding_term:
    preferred_term: well-circumscribed hypoechoic nodule
    term:
      id: NCIT:C208181
      label: Hypoechoic
  located_in:
    preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  diagnostic: false
  evidence:
  - reference: PMID:41899058
    reference_title: A Retrospective Study of the Ultrasound Imaging Characteristics of Juvenile Xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ultrasound manifestations are mostly hypoechoic masses with clear boundaries and regular
      shapes. Contrast-enhanced ultrasound shows a slight homogeneous enhancement, and on shear wave
      elastography, it appears to be relatively hard.
    explanation: >-
      The series' ultrasound, contrast-enhanced ultrasound and elastography findings.
  - reference: PMID:41899058
    reference_title: A Retrospective Study of the Ultrasound Imaging Characteristics of Juvenile Xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      JXGs are more common in infants or young children and present with yellowish-orange, cutaneous
      lesions. Ultrasound revealed homogeneous, well-circumscribed, regular hypoechoic nodules.
    explanation: >-
      The series' conclusion: the lesions are cutaneous, and on ultrasound they are homogeneous,
      well-circumscribed, regular hypoechoic nodules.

name: Juvenile Xanthogranuloma
creation_date: '2026-11-11T19:45:00Z'
categories:
- Histiocytic Disorder
- Pediatric Skin Disorder
parents:
- histiocytosis
disease_term:
  preferred_term: juvenile xanthogranuloma
  term:
    id: MONDO:0015534
    label: juvenile xanthogranuloma
description: >-
  The commonest non-Langerhans-cell histiocytosis, and in most children a solitary yellow-orange cutaneous
  papule or nodule that appears in infancy and resolves on its own. It is nevertheless a clonal myeloid
  neoplasm. Where it has been looked for hardest - in the rare extracutaneous form - a targetable kinase
  alteration was found in every one of 16 children sequenced, most often a CLTC::SYK fusion or a CSF1R
  mutation, with NTRK1 fusions, BRAF V600E and MAP2K1 lesions accounting for much of the rest. How far
  that generalises to the common solitary cutaneous lesion is not settled by anything cited here; the
  one cached study of solitary lesions used a copy-number assay and found a clonal alteration in two of
  nineteen. Extracutaneous and systemic disease, where the central nervous system, liver, lung and eye
  are the usual sites, carries real mortality.
synonyms:
- JXG
- nevoxanthoendothelioma
- juvenile xanthoendothelioma
pathophysiology:
- name: Somatic Kinase Alteration in a Myeloid Precursor
  description: >-
    The initiating lesion is a somatic, activating alteration in a kinase gene, in a cell of the macrophage/dendritic
    lineage. The series that establishes this is scoped to the rare extracutaneous form: it found a targetable
    kinase alteration in 16 of 16 children with extracutaneous disease, CLTC::SYK fusion and CSF1R mutation
    commonest, with NTRK1 fusion, BRAF V600E and MAP2K1 deletion also represented. The lesion's clonality
    has been shown; which cell it arises in has not been settled, and the entry records that as the open
    question it is.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  molecular_functions:
  - preferred_term: activated kinase activity of the driver gene
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004672
      label: protein kinase activity
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dermal dendritic cell
    term:
      id: CL:0001006
      label: dermal dendritic cell
  genes:
  - preferred_term: SYK
    term:
      id: hgnc:11491
      label: SYK
  - preferred_term: CSF1R
    term:
      id: hgnc:2433
      label: CSF1R
  - preferred_term: NTRK1
    term:
      id: hgnc:8031
      label: NTRK1
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  - preferred_term: MAP2K1
    term:
      id: hgnc:6840
      label: MAP2K1
  downstream:
  - target: Kinase Pathway Activation in Lesional Histiocytes
    description: >-
      The altered kinase switches its downstream pathway on. The series that localised the activated kinase
      did so inside the lesional histiocytes themselves.
    evidence:
    - reference: PMID:39316650
      reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of
        soft tissue.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Using multispectral immunofluorescence, phosphorylated-spleen tyrosine kinase expression was localized
        to CD163+ histiocytes; tumors with CLTC::SYK fusions also demonstrated mTOR activation, cyclin
        D1 expression, and variable phosphorylated-extracellular signal-regulated kinase expression.
      explanation: >-
        Puts the phosphorylated kinase in a named lesional cell population and names three downstream
        readouts in the fusion-positive tumours, which is this edge.
  evidence:
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Targetable kinase alterations were detected in 16 of 16 children and 1 of 5 adults.
    explanation: >-
      How often a driver is found when it is looked for, in the 16 children with extracutaneous disease
      and the 5 adults with central-nervous-system or soft-tissue xanthogranuloma that this series covers.
      It is not a figure for the common solitary cutaneous lesion.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations included CLTC::SYK fusions in 6 children and CSF1R mutations in 7 others; all below
      2 years of age with soft tissue tumors.
    explanation: The two commonest drivers and the age group they were found in.
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions,
      advanced cases may show more complexity.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Though molecular studies have provided evidence of clonality in juvenile xanthogranuloma, in support
      of a neoplastic process, little is known about the genetic profile of juvenile xanthogranuloma.
    explanation: >-
      That the process is clonal and so neoplastic, stated together with how little was known of its genetics
      - which is why the driver series above matters.
  - reference: PMID:28504206
    reference_title: BRAF V600E mutation in pediatric intracranial and cranial juvenile xanthogranuloma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: The lesion is presumed to originate from either macrophages or dermal dendritic cells.
    explanation: >-
      The source of the two cell-type bindings on this node, and of the hedge: the paper says presumed,
      and names two candidates rather than one.
  - reference: PMID:12717244
    reference_title: >-
      Juvenile xanthogranulomas in the first two decades of life: a clinicopathologic study of 174 cases
      with cutaneous and extracutaneous manifestations.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is widely held that JXG is a proliferative disorder of dendrocytes, possibly dermal dendrocytes;
      thus, its clinical and pathologic similarities to Langerhans cell histiocytosis are not entirely
      unexpected in light of the most recently proposed international classification of histiocytic disorders,
      which includes JXG and Langerhans cell histiocytosis together as "dendritic cell-related" histiocytoses.
    explanation: >-
      The dendritic-lineage reading, given by its own authors as what is widely held rather than as their
      finding.
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions, advanced cases may show more complexity.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of non-recurrent copy number alterations in a subset of samples implies that copy
      number changes are unlikely driving pathogenesis in juvenile xanthogranuloma, but may be
      acquired during disease progression.
    explanation: >-
      The source for this entry's scoping decision to model a kinase lesion rather than a copy-number
      one. Indirect because the study tests copy number and stops there - it names no kinase and no
      driver gene, so reaching the kinase hypothesis from it is this entry's inference, not the
      study's conclusion.
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions, advanced cases may show more complexity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only two of 19 solitary juvenile xanthogranulomas showed abnormal genomic profiles
    explanation: >-
      The count behind the two-of-nineteen figure this entry's description and this node's notes both
      use. The quote stops before the sentence lists the individual chromosomal gains and losses,
      which this entry deliberately does not carry.
  notes: >-
    The cell of origin is not established, and the two cell-type bindings record that rather than resolving
    it: the cached sources say presumed and name macrophages or dermal dendritic cells as alternatives.
    Deriving two cells of origin here is therefore the honest state of the literature, not a lump that
    needs splitting. The driver series is scoped to extracutaneous disease by its own title and abstract,
    and the entry does not read its 16 of 16 as a figure for the disease at large. The one cached study
    of solitary cutaneous lesions used a copy-number assay only and found a clonal alteration in two of
    nineteen, which is a different question rather than a contradiction.


    One caveat on the gene list. The node is framed as an activating somatic alteration, which the
    cached sources support for the kinase fusions and for BRAF V600E. They do not support it for
    MAP2K1: the entry's own genetic row is a MAP2K1 deletion, and the only cached sentence about it
    reports that a deletion was detected in two children without characterising its effect. The gene
    is listed here because it is one of the drivers this entry records, not because any cached source
    calls it activating.
- name: Kinase Pathway Activation in Lesional Histiocytes
  description: >-
    The driver alterations converge on three pathways - MAP kinase, PI3K and JAK/STAT - and the fusion-positive
    tumours additionally show mTOR activation and cyclin D1 expression.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: PI3K/AKT signalling
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  downstream:
  - target: Histiocytic Proliferation and Tissue Infiltration
    description: The activated pathways drive the histiocytic accumulation that forms the lesion.
    evidence:
    - reference: PMID:28752840
      reference_title: >-
        Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary
        lesions, advanced cases may show more complexity.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Juvenile xanthogranuloma is a rare histiocytic proliferation primarily affecting infants and young
        children, characterized by aberrant infiltration of histiocyte-derived cells in the skin, soft
        tissues and more rarely, visceral organs.
      explanation: >-
        Names the proliferation and the infiltration this edge produces. Indirect for the edge: the sentence
        describes the lesion without attributing it to pathway activation.
  evidence:
  - reference: PMID:40235191
    reference_title: NTRK1 Gene Fusions Are Frequent in Juvenile Xanthogranuloma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common known gene mutations affect the mitogen-activated protein (MAP) kinase, phosphoinositide
      3-kinase (PI3K), and Janus kinase/signal transducer and activator of transcription ( JAK / STAT
      ) signaling pathways.
    explanation: >-
      The three pathways the known driver mutations act on, stated as the second sentence of a case report's
      abstract - framing rather than that paper's own result, which is its NTRK1 series.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using multispectral immunofluorescence, phosphorylated-spleen tyrosine kinase expression was localized
      to CD163+ histiocytes; tumors with CLTC::SYK fusions also demonstrated mTOR activation, cyclin D1
      expression, and variable phosphorylated-extracellular signal-regulated kinase expression.
    explanation: The additional readouts in the CLTC::SYK tumours, measured in the lesion.
- name: Histiocytic Proliferation and Tissue Infiltration
  description: >-
    Histiocyte-derived cells accumulate, usually in the skin and sometimes in soft tissue or viscera.
    This is the lesion itself.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: lesional histiocyte
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Lipid Accumulation and Touton Giant Cell Formation
    description: The accumulating histiocytes become lipid-laden and fuse into Touton giant cells.
    evidence:
    - reference: PMID:12717244
      reference_title: >-
        Juvenile xanthogranulomas in the first two decades of life: a clinicopathologic study of 174 cases
        with cutaneous and extracutaneous manifestations.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The characteristic Touton giant cell in variable numbers was a consistent feature of the cutaneous
        lesions; however, these cells were either absent or present in reduced numbers in the various
        extracutaneous lesions when compared with JXG in the skin.
      explanation: >-
        The giant cell as a consistent feature of the cutaneous lesion, with the authors' own qualification
        that it is reduced or absent outside the skin.
  - target: Cutaneous xanthogranuloma
    description: In most patients the infiltrate is confined to the skin as a single lesion.
    evidence:
    - reference: PMID:34820973
      reference_title: Juvenile xanthogranulomas in Asian children.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: The most frequently involved site was the head and neck region (44.2%).
      explanation: Where the cutaneous lesion sits, in the cohort that reports it.
    - reference: PMID:34820973
      reference_title: Juvenile xanthogranulomas in Asian children.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: The majority of patients (76.2%) presented with a solitary lesion.
      explanation: How often the lesion is solitary, which the edge's description also claims.
  - target: Extracutaneous and systemic involvement
    description: A minority of lesions involve soft tissue or viscera instead of, or as well as, skin.
    evidence:
    - reference: PMID:36779547
      reference_title: 'Systemic juvenile xanthogranuloma: A systematic review.'
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most commonly involved site was the central nervous system (CNS) (40.9%), followed by the
        liver (31.4%), the lung (18.9%), and the eye (18.2%).
      explanation: The organ distribution when the disease is systemic.
  - target: Ocular involvement with hyphema
    causal_link_type: DIRECT
    description: >-
      The same infiltration reaching the eye, where the iris lesion bleeds. The eye is the fourth
      commonest site in the cached systematic review.
    evidence:
    - reference: PMID:36779547
      reference_title: >-
        Systemic juvenile xanthogranuloma: A systematic review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most commonly involved site was the central nervous system (CNS) (40.9%), followed by the
        liver (31.4%), the lung (18.9%), and the eye (18.2%).
      explanation: >-
        That the eye is among the organs this disease infiltrates, with its share of the series. It is
        the organ-distribution evidence for drawing the edge; indirect because a site frequency does
        not by itself demonstrate that the infiltration is what produces the ocular findings.
    - reference: PMID:26189188
      reference_title: >-
        Juvenile Xanthogranuloma Involving the Eye and Ocular Adnexa: Tumor Control, Visual Outcomes, and Globe Salvage in 30 Patients.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: Eye redness (12/30, 40%) and hyphema (4/30, 13%) were the most common presenting symptoms.
      explanation: >-
        The hyphema this target names, with its frequency in the cached ocular series - which is what
        makes the phenotype row specific rather than generic ocular involvement.
  - target: Central nervous system symptoms
    causal_link_type: DIRECT
    description: >-
      The same infiltration reaching the central nervous system, which the cached systematic review
      reports as the commonest extracutaneous site.
    evidence:
    - reference: PMID:36779547
      reference_title: >-
        Systemic juvenile xanthogranuloma: A systematic review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most commonly involved site was the central nervous system (CNS) (40.9%), followed by the
        liver (31.4%), the lung (18.9%), and the eye (18.2%).
      explanation: >-
        The central nervous system as the commonest involved site in that series. Indirect for the
        same reason as the ocular edge: the figure establishes involvement, not the mechanism of it.
    - reference: PMID:36265894
      reference_title: >-
        Neuroimaging in Pediatric Patients with Juvenile Xanthogranuloma of the CNS.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Juvenile xanthogranuloma lesions were identified in a number of different sites, including
        supra- and infratentorial as well as intracranial and spinal leptomeningeal.
      explanation: >-
        Lesions demonstrated in the nervous system itself, across compartments, which is the direct
        evidence that the infiltration reaches it rather than the symptoms arising some other way.
  evidence:
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions,
      advanced cases may show more complexity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile xanthogranuloma is a rare histiocytic proliferation primarily affecting infants and young
      children, characterized by aberrant infiltration of histiocyte-derived cells in the skin, soft tissues
      and more rarely, visceral organs.
    explanation: The lesion, its age group and the tissues it occupies.
- name: Lipid Accumulation and Touton Giant Cell Formation
  description: >-
    The lesional histiocytes accumulate lipid and form the wreath-of-nuclei Touton giant cell that gives
    the lesion its name and its yellow colour. It is not obligate: tumours carrying a CLTC::SYK fusion
    generally lack Touton cells while otherwise looking like this disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: xanthomatised (foamy) histiocyte
    term:
      id: CL:0000517
      label: macrophage derived foam cell
  biological_processes:
  - preferred_term: lipid storage
    modifier: INCREASED
    term:
      id: GO:0019915
      label: lipid storage
  evidence:
  - reference: PMID:12717244
    reference_title: >-
      Juvenile xanthogranulomas in the first two decades of life: a clinicopathologic study of 174 cases
      with cutaneous and extracutaneous manifestations.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The characteristic Touton giant cell in variable numbers was a consistent feature of the cutaneous
      lesions; however, these cells were either absent or present in reduced numbers in the various extracutaneous
      lesions when compared with JXG in the skin.
    explanation: The giant cell in the cutaneous lesion, and its reduction outside the skin.
  - reference: PMID:39316650
    reference_title: Recurrent CLTC::SYK fusions and CSF1R mutations in juvenile xanthogranuloma of soft
      tissue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumors with CLTC::SYK fusions generally lacked Touton giant cells but exhibited many other histologic
      features of JXG and concordant methylation profiles.
    explanation: 'Why this node is not presented as obligate: a defined molecular subset lacks the feature.'
phenotypes:
- name: Cutaneous xanthogranuloma
  category: Dermatologic
  description: >-
    A solitary yellow-orange papule or nodule, most often on the head and neck, appearing in infancy.
    It resolves without treatment in most patients.
  phenotype_term:
    preferred_term: yellow-orange cutaneous nodule
    term:
      id: HP:0200036
      label: Skin nodule
  evidence:
  - reference: PMID:28752840
    reference_title: >-
      Genetic evaluation of juvenile xanthogranuloma: genomic abnormalities are uncommon in solitary lesions,
      advanced cases may show more complexity.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile xanthogranuloma is generally considered to be a benign disorder; most lesions are solitary
      cutaneous nodules that resolve spontaneously without treatment.
    explanation: The lesion and its usual course.
  - reference: PMID:34820973
    reference_title: Juvenile xanthogranulomas in Asian children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spontaneous resolution was documented in 57.7% of our patients with mean duration to resolution
      of 18.8 months.
    explanation: How often it resolved, and over what period, in a cohort that followed it.
  notes: >-
    Bound to Skin nodule rather than to Papule. HPO makes the two siblings under Localized skin lesion,
    not a general and a specific form of one thing, so a binding cannot span both and the preferred_term
    names the nodule alone. HPO has no xanthogranuloma term; Histiocytoma sits under Fibrous tissue neoplasm
    and is a worse fit. The colour is in the preferred_term and the description rather than in the binding
    because neither cited snippet states it.
- name: Extracutaneous and systemic involvement
  category: Systemic
  description: >-
    Disease outside the skin, most often in the central nervous system, liver, lung or eye. A subset develops
    haemophagocytic lymphohistiocytosis, with fever, rash, hepatosplenomegaly and cytopenia.
  phenotype_term:
    preferred_term: hepatosplenomegaly in systemic disease
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:36779547
    reference_title: 'Systemic juvenile xanthogranuloma: A systematic review.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most commonly involved site was the central nervous system (CNS) (40.9%), followed by the liver
      (31.4%), the lung (18.9%), and the eye (18.2%).
    explanation: The organ distribution in a systematic review of systemic disease.
  - reference: PMID:39177799
    reference_title: >-
      Clinical features and outcomes of 17 children with systemic juvenile xanthogranuloma (sJXG) including
      five complicated with hemophagocytic lymphohistiocytosis (HLH).
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All sJXG-HLH patients had intermittent fever, rash, hepatosplenomegaly, cytopenia and high levels
      of soluble CD25, but interferon-γ was almost normal.
    explanation: The features of the haemophagocytic subset, including the hepatosplenomegaly this row
      binds.
- name: Ocular involvement with hyphema
  category: Ophthalmologic
  description: >-
    Ocular disease preferentially affects the iris and is often isolated, without any skin lesion. Redness
    and hyphema are the most common presenting signs, at 40 and 13 per cent of a 30-patient series.
  phenotype_term:
    preferred_term: hyphema
    term:
      id: HP:0011886
      label: Hyphema
  evidence:
  - reference: PMID:26189188
    reference_title: >-
      Juvenile Xanthogranuloma Involving the Eye and Ocular Adnexa: Tumor Control, Visual Outcomes, and
      Globe Salvage in 30 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Eye redness (12/30, 40%) and hyphema (4/30, 13%) were the most common presenting symptoms.
    explanation: The presenting signs and their frequency.
  - reference: PMID:26189188
    reference_title: >-
      Juvenile Xanthogranuloma Involving the Eye and Ocular Adnexa: Tumor Control, Visual Outcomes, and
      Globe Salvage in 30 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Ocular JXG preferentially affects the iris and is often isolated without cutaneous involvement.
    explanation: >-
      That ocular disease is usually isolated, which is why it is not assumed to follow a skin lesion.
- name: Central nervous system symptoms
  category: Neurologic
  description: >-
    CNS xanthogranuloma produces no single syndrome. A dedicated series reports headache, seizure, ataxia,
    strabismus, hearing loss, facial paresis and diabetes insipidus.
  phenotype_term:
    preferred_term: central nervous system involvement
    term:
      id: HP:0000707
      label: Abnormality of the nervous system
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:36265894
    reference_title: Neuroimaging in Pediatric Patients with Juvenile Xanthogranuloma of the CNS.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients presented with a wide variety of different symptoms, including headache, seizure, ataxia,
      strabismus, hearing loss, facial paresis, and diabetes insipidus.
    explanation: >-
      The symptom list, from the CNS series. The binding takes one of the listed features; the rest are
      in the description because the source gives no frequency for any of them.
  notes: >-
    Coarsely bound on purpose. The cited series reports seven different features - headache, seizure,
    ataxia, strabismus, hearing loss, facial paresis and diabetes insipidus - and gives no frequency for
    any of them, so no one of them is the phenotype of this disease. An earlier version bound Seizure,
    which named one of the seven on a row labelled for all seven and would have put that label on the
    pathograph node.

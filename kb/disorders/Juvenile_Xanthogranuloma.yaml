- discussion_id: jxg_eye_screening
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - diagnosis#Eye examination
  prompt: >-
    Should children with cutaneous juvenile xanthogranuloma have routine eye screening - all of
    them, or only those at higher risk - or an eye examination only when there are ocular or visual
    symptoms?
  rationale: >-
    Eye involvement can lead to glaucoma and blindness. A 1996 survey of 431 dermatologists and 438
    ophthalmologists found that most believed screening was important, but that referral and
    surveillance practices varied widely. It put ocular complications at about 0.3% of patients with
    cutaneous disease (0.4% in the literature), and recommended screening targeted at the children
    at highest risk. A 2018 study found no eye involvement in 76 children, put the incidence of
    ocular manifestations across published series at 0.24%, and judged a routine examination of low
    yield and probably not warranted in children with no ocular or visual symptoms. A series of 147
    Asian children found no ophthalmologic complications, and its authors do not support routine
    screening unless clinically indicated, even with multiple skin lesions. Two case reports give a
    range of 0.3% to 10% for ocular involvement, citing earlier work, and a third gives about 10% in
    its abstract. No cited source argues that every child should be examined; the nearest is the
    surveyed clinicians' belief that screening was important. Nothing cited here settles the
    question.
  evidence:
  - reference: PMID:8609257
    reference_title: >-
      The risk intraocular juvenile xanthogranuloma: survey of current practices and assessment of
      risk.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-

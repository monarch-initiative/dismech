    explanation: >-
      The shares in one centre's 30-year archive of 525 patients with 547 lesions, whose abstract does
      not give their denominator, and where the giant cells sit. The transitional share is far higher
      than in the Kiel registry, and neither abstract says why.
- name: 'Immunophenotype in the largest series: CD68, CD163, CD4 and CD11c positive, S-100 in a third'
  description: >-
    In the largest series cited, 525 patients with juvenile or adult xanthogranuloma from one
    centre's archive, the lesional cells were positive for CD68 (200 of 201 tested), CD163 (15 of
    15), CD4 (82 of 84), CD11c (75 of 77) and factor XIIIa (192 of 204), and CD1a was positive in 1
    of 110. S-100 was positive in 48 of 152, about a third, which is more than the Kiel registry's
    generally negative result suggests. The phenotype did not vary with age at diagnosis or with
    histological pattern. A study of 77 cases, apparently from the same archive, reports CD11c and
    CD4 as sensitive markers with promising results compared with factor XIIIa, and found S-100 in 4
    of 23 lesions tested and CD1a in none of 18.

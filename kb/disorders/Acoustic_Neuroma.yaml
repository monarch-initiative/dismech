    explanation: Cohort evidence supports continued surveillance in carefully selected patients.
- name: Microsurgical Resection
  description: >-
    Microsurgery removes or decompresses tumor when size, mass effect,
    progression, symptoms, hearing goals, or patient factors favor operative
    treatment. Approach and extent must balance tumor control against hearing
    and facial-nerve morbidity.

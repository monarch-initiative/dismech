pathophysiology:
- name: Biallelic NF2 Inactivation and Merlin Loss
  role: trigger
  description: >-
    In the predominant sporadic form, pathogenic NF2 alterations and/or loss
    of the second NF2 allele occur in tumor tissue and eliminate merlin
    tumor-suppressor activity. Germline NF2 predisposition followed by a
    somatic second hit produces the analogous lesion in NF2-related tumors.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  genes:
  - preferred_term: NF2
    term:
      id: hgnc:7773
      label: NF2
  evidence:
  - reference: PMID:39941762
    reference_title: Genetic Alterations in Patients with NF2-Related Schwannomatosis and Sporadic Vestibular Schwannomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic NF2 inactivation primarily drives vestibular schwannoma tumorigenesis."
    explanation: Paired lymphocyte and tumor-DNA analysis directly supports biallelic NF2 inactivation in both sporadic unilateral and NF2-related tumors.
  - reference: PMID:40295009
    reference_title: Pathogenic Variants and Allele Loss of the NF2 and LZTR1 Gene in Sporadic Vestibular Schwannoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants and allele-loss of the NF2 gene with Merlin loss as consequence is the driving genetic event for vestibular schwannoma development."
    explanation: Sequencing of sporadic tumors identifies NF2 alteration or allele loss as the principal genetic event.
  - reference: PMID:28710469
    reference_title: Differential NF2 Gene Status in Sporadic Vestibular Schwannomas and its Prognostic Impact on Tumour Growth Patterns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The great majority of sporadic vestibular schwannomas (VSs) are due to the inactivation of the NF2 gene."
    explanation: Human sporadic-tumor data support NF2 inactivation as the upstream lesion.
  downstream:
  - target: Loss of Merlin-Dependent Contact Inhibition and Receptor Control
    causal_link_type: DIRECT
    description: >-
      Merlin loss removes contact-dependent restriction of growth-factor
      receptor delivery and mitogenic signaling in Schwann cells.
    evidence:
    - reference: PMID:19029950
      reference_title: Merlin regulates transmembrane receptor accumulation and signaling at the plasma membrane in primary mouse Schwann cells and in human schwannomas.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "loss of merlin activity is associated with elevated levels of ErbB receptors in primary SCs."
      explanation: Loss of merlin directly disrupts receptor control in primary Schwann cells.
  - target: YAP/TAZ-TEAD-Dependent Mitogenic Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hippo-pathway kinase regulation
    description: >-
      NF2-null schwannoma cells acquire dependence on YAP/TAZ-driven TEAD
      transcriptional output through the Hippo pathway.
    evidence:
    - reference: PMID:36148553
      reference_title: Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "driven by the TAZ protein in human and mouse NF2-null schwannoma cells"
      explanation: TAZ activity in NF2-null schwannoma cells supports the downstream relationship, while the intervening merlin-to-Hippo steps are not represented in this graph.
- name: Loss of Merlin-Dependent Contact Inhibition and Receptor Control
  role: central_effector
  description: >-
    Merlin normally limits delivery of growth-factor receptors to the
    Schwann-cell surface at cell-cell contact and restrains downstream AKT and MAPK
    signaling. Merlin loss weakens contact inhibition and permits excess
    mitogenic receptor signaling.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: contact inhibition
    modifier: DECREASED
    term:
      id: GO:0060242
      label: contact inhibition
  evidence:
  - reference: PMID:19029950
    reference_title: Merlin regulates transmembrane receptor accumulation and signaling at the plasma membrane in primary mouse Schwann cells and in human schwannomas.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "merlin regulates contact inhibition of proliferation by limiting the delivery of several growth factor receptors at the plasma membrane of primary SCs."
    explanation: Primary Schwann-cell experiments directly define merlin's contact-dependent receptor-control function.
  downstream:
  - target: Vestibular Schwannoma Formation and Tumor Growth
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - ErbB/AKT and MAPK mitogenic signaling
    description: Loss of contact-dependent restraint permits neoplastic Schwann-cell proliferation.
    evidence:
    - reference: PMID:19029950
      reference_title: Merlin regulates transmembrane receptor accumulation and signaling at the plasma membrane in primary mouse Schwann cells and in human schwannomas.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "We also observed accumulation of growth factor receptors such as ErbB2 and 3, insulin-like growth factor 1 receptor and platelet-derived growth factor receptor in peripheral nerves of Nf2-mutant mice"
      explanation: Nf2-mutant mouse nerves show receptor accumulation, supporting this candidate route without isolating the intervening mitogenic steps.
    - reference: PMID:19029950
      reference_title: Merlin regulates transmembrane receptor accumulation and signaling at the plasma membrane in primary mouse Schwann cells and in human schwannomas.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "in human NF2 schwannomas, suggesting that this mechanism could play an important role in tumorigenesis."
      explanation: Human NF2 schwannomas provide corroborating tumor evidence, while the source explicitly frames the mechanistic interpretation as suggestive.
- name: YAP/TAZ-TEAD-Dependent Mitogenic Signaling
  role: central_effector
  description: >-
    NF2-null schwannoma cells depend on YAP/TAZ-driven TEAD transcriptional
    activity. Genetic YAP/TAZ ablation or pharmacologic TEAD inhibition blocks
    and can regress schwannoma growth in primary-cell and mouse models, making
    this a preclinical rather than approved clinical target.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: positive regulation of Schwann cell proliferation
    modifier: INCREASED
    term:
      id: GO:0010625
      label: positive regulation of Schwann cell proliferation
  evidence:
  - reference: PMID:36148553
    reference_title: Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hippo signalling may be successfully targeted in vitro"
    explanation: In-vitro perturbation directly supports YAP/TAZ-TEAD dependence in schwannoma cells.
  - reference: PMID:36148553
    reference_title: Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "successful use of TEAD palmitoylation inhibitors in a preclinical mouse model of schwannoma points to their potential future clinical use."
    explanation: A preclinical mouse model independently supports in-vivo targetability of TEAD activity.
  downstream:
  - target: Vestibular Schwannoma Formation and Tumor Growth
    causal_link_type: DIRECT
    description: YAP/TAZ-driven TEAD transcription sustains NF2-null schwannoma growth.
    evidence:
    - reference: PMID:36148553
      reference_title: Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "successful use of TEAD palmitoylation inhibitors in a preclinical mouse model of schwannoma points to their potential future clinical use."
      explanation: In-vivo TEAD inhibition suppresses schwannoma growth, supporting the causal link while remaining preclinical.
- name: Vestibular Schwannoma Formation and Tumor Growth
  role: pathological_process
  description: >-
    Proliferating neoplastic Schwann cells form a benign tumor on a vestibular
    division of cranial nerve VIII. Tumors may remain intrameatal or extend into
    the cerebellopontine angle; growth rate and clinical effects vary widely.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  locations:
  - preferred_term: vestibulocochlear nerve
    term:
      id: UBERON:0001648
      label: vestibulocochlear nerve
  - preferred_term: internal acoustic meatus
    term:
      id: UBERON:0011859
      label: internal acoustic meatus
  biological_processes:
  - preferred_term: positive regulation of Schwann cell proliferation
    modifier: INCREASED
    term:
      id: GO:0010625
      label: positive regulation of Schwann cell proliferation
  evidence:
  - reference: PMID:28710469
    reference_title: Differential NF2 Gene Status in Sporadic Vestibular Schwannomas and its Prognostic Impact on Tumour Growth Patterns.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Following the loss of NF2 expression, schwannoma cultures demonstrated increased proliferation rates."
    explanation: NF2 loss increases proliferation in human sporadic schwannoma cultures.
  downstream:
  - target: Vestibular Schwannoma Secretome and Cochlear Injury
    causal_link_type: DIRECT
    description: Tumor-derived soluble factors can damage cochlear hair cells and neurites independently of a simple compression-only model.
    evidence:
    - reference: PMID:26690506
      reference_title: Secreted Factors from Human Vestibular Schwannomas Can Cause Cochlear Damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our results are the first to demonstrate that secreted factors from VSs can lead to cochlear damage."
      explanation: Human tumor-conditioned media directly damaged cochlear explants.
  - target: Eighth-Nerve Auditory and Vestibular Dysfunction
    causal_link_type: DIRECT
    description: Tumor involvement of cranial nerve VIII disrupts auditory and vestibular function.
    evidence:
    - reference: PMID:25794859
      reference_title: Prevalence of vestibular dysfunction in patients with vestibular schwannoma using video head-impulses and vestibular-evoked potentials.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The sensitivity of the 5-item battery increased with tumour size and all patients with medium to large (>14 mm) schwannoma had at least two abnormal vestibular test result."
      explanation: Objective vestibular abnormalities increase with tumor size, supporting a clinical tumor-to-nerve dysfunction link without proving a single molecular intermediary.
  - target: Cerebellopontine-Angle Expansion and Advanced Mass Effect
    causal_link_type: DIRECT
    description: Extrameatal growth can compress adjacent cranial nerves and the brainstem.
    evidence:
    - reference: PMID:8971818
      reference_title: "Management of 1000 vestibular schwannomas (acoustic neuromas): clinical presentation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Key symptoms of various tumor extension classes precipitated the diagnosis, such as trigeminal disturbances in large tumors with brain stem compression or tinnitus in small neuromas."
      explanation: The large clinical series links advanced tumor extension and brainstem compression to adjacent-nerve symptoms.
- name: Vestibular Schwannoma Secretome and Cochlear Injury
  role: consequence
  description: >-
    Soluble factors released by vestibular schwannomas can injure cochlear hair
    cells and neuronal fibers. Human temporal-bone pathology corroborates
    ipsilateral cochlear degeneration, although the relative contributions of
    secreted factors and retrocochlear injury remain uncertain.
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  evidence:
  - reference: PMID:26690506
    reference_title: Secreted Factors from Human Vestibular Schwannomas Can Cause Cochlear Damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Secretions from tumours associated with most substantial SNHL resulted in most significant hair cell loss and neuronal fibre disorganization."
    explanation: Conditioned-media experiments link human tumor secretions to cochlear cellular injury.
  - reference: PMID:22377650
    reference_title: "Dysfunction of the cochlea contributing to hearing loss in acoustic neuromas: an underappreciated entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "VS caused significantly more inner and outer hair cell loss, cochlear neuronal loss, precipitate in endolymph and perilymph, and decreased pure tone average, when compared with the opposite ear."
    explanation: Human temporal-bone histology corroborates ipsilateral cochlear degeneration.
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
    description: Cochlear hair-cell and neuronal degeneration contributes to sensorineural hearing loss.
    evidence:
    - reference: PMID:22377650
      reference_title: "Dysfunction of the cochlea contributing to hearing loss in acoustic neuromas: an underappreciated entity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cochlear dysfunction may be an important contributor to the hearing loss caused by VS and can explain certain clinically observed phenomena in patients with VS."
      explanation: Human pathology directly supports cochlear dysfunction as a contributor to hearing loss.
- name: Eighth-Nerve Auditory and Vestibular Dysfunction
  role: consequence
  description: >-
    Vestibular schwannoma disrupts cranial-nerve VIII function, producing
    auditory symptoms and objective dysfunction of superior and inferior
    vestibular divisions. Central compensation helps explain why objective
    vestibular deficits and perceived vertigo do not always align.
  locations:
  - preferred_term: vestibulocochlear nerve
    term:
      id: UBERON:0001648
      label: vestibulocochlear nerve
  evidence:
  - reference: PMID:25794859
    reference_title: Prevalence of vestibular dysfunction in patients with vestibular schwannoma using video head-impulses and vestibular-evoked potentials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that dysfunction of the superior and inferior vestibular nerve evolves in parallel for most patients with schwannoma."
    explanation: Objective human testing documents dysfunction of both vestibular nerve divisions.
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Retrocochlear auditory-nerve dysfunction is one contributor to sensorineural hearing impairment, alongside the parallel cochlear-injury branch.
    evidence:
    - reference: PMID:22377650
      reference_title: "Dysfunction of the cochlea contributing to hearing loss in acoustic neuromas: an underappreciated entity."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical and histologic observations have suggested that the hearing loss may be caused by both retrocochlear and cochlear mechanisms."
      explanation: Human observations suggest a retrocochlear contribution in parallel with cochlear injury but do not isolate a single nerve-to-hearing-loss route.
  - target: Tinnitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Vestibular schwannoma-associated auditory-pathway dysfunction can present with tinnitus, but the exact causal intermediary is unresolved.
    evidence:
    - reference: PMID:8971818
      reference_title: "Management of 1000 vestibular schwannomas (acoustic neuromas): clinical presentation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Key symptoms of various tumor extension classes precipitated the diagnosis, such as trigeminal disturbances in large tumors with brain stem compression or tinnitus in small neuromas."
      explanation: The clinical series links tinnitus to small vestibular schwannomas but does not establish a single causal pathway.
  - target: Abnormal Vestibular Function
    causal_link_type: DIRECT
    description: Superior and inferior vestibular nerve dysfunction produces abnormal vestibular testing and may manifest as disequilibrium or vertigo.
    evidence:
    - reference: PMID:25794859
      reference_title: Prevalence of vestibular dysfunction in patients with vestibular schwannoma using video head-impulses and vestibular-evoked potentials.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The percentage of abnormalities for each of the five tests for the entire sample ranged between 36.2-61.7%."

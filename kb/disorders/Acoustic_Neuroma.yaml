discussions:
- discussion_id: mismatch_acoustic_preclinical_models_and_human_function
  prompt: >-
    How faithfully do Nf2-null mouse tumors, isolated human primary cells, and
    murine cochlear explants reproduce the human eighth-nerve anatomy, immune
    and vascular microenvironment, hearing loss, tinnitus, and vestibular
    natural history of sporadic vestibular schwannoma?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#YAP/TAZ-TEAD-Dependent Mitogenic Signaling
  - pathophysiology#Vestibular Schwannoma Secretome and Cochlear Injury
  rationale: >-
    The YAP/TAZ study establishes tumor-growth dependence in primary cells and
    mouse models, but not human auditory outcomes. The secretome experiment
    applies human tumor products to murine cochlear explants, establishing
    plausibility but not the in-vivo fraction of human hearing loss caused by
    soluble factors. A human multicellular model preserving tumor, nerve,
    cochlear, immune, and vascular interactions is needed to bridge these gaps.
  proposed_experiments:
  - experiment_id: exp_acoustic_human_tumor_nerve_cochlea_coculture
    name: Patient-derived vestibular schwannoma, auditory-neuron, and cochlear co-culture
    description: >-
      Compare patient-derived NF2-null tumor cells and isogenic NF2-restored
      controls in a human multicellular co-culture containing auditory neurons
      and cochlear sensory cells; perturb TEAD and neutralize candidate
      secreted factors while measuring tumor growth, neurite integrity,
      hair-cell survival, and electrophysiologic function.
    experiment_type:
      preferred_term: human multicellular tumor-neural co-culture perturbation assay
    model_systems:
    - name: Human vestibular schwannoma-auditory pathway co-culture
      description: Human patient-derived tumor cells combined with auditory-neural and cochlear sensory-cell compartments.
      experimental_model_type: CO_CULTURE
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  evidence:
  - reference: PMID:36148553
    reference_title: Inhibition of YAP/TAZ-driven TEAD activity prevents growth of NF2-null schwannoma and meningioma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "successful use of TEAD palmitoylation inhibitors in a preclinical mouse model of schwannoma points to their potential future clinical use."
    explanation: The explicitly preclinical framing motivates a human translational bridge.
  - reference: PMID:26690506
    reference_title: Secreted Factors from Human Vestibular Schwannomas Can Cause Cochlear Damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "murine cochlear explant cultures were treated with human tumour secretions from thirteen different unilateral, sporadic VSs"
    explanation: The cross-species design defines the fidelity question for cochlear injury.
- discussion_id: interpretation_acoustic_hearing_not_size_only
  prompt: >-
    What proportions of vestibular-schwannoma-associated hearing loss arise
    from retrocochlear nerve effects, mechanical compression, cochlear
    degeneration, or tumor-secreted factors, and why can hearing severity
    diverge from tumor size?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Vestibular Schwannoma Formation and Tumor Growth
  - pathophysiology#Vestibular Schwannoma Secretome and Cochlear Injury
  rationale: >-
    Human temporal-bone data show cochlear degeneration, while tumor size and
    distance from the cochlea did not correlate with structural cochlear change
    or hearing threshold. A compression-only graph would therefore overstate
    what is known; the entry retains parallel local-nerve and secretome/cochlear
    branches.
  evidence:
  - reference: PMID:22377650
    reference_title: "Dysfunction of the cochlea contributing to hearing loss in acoustic neuromas: an underappreciated entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tumor size, distance from the cochlea, and nerve of origin did not correlate with structural changes in the cochlea or the hearing threshold."
    explanation: Human pathology supports a mechanism more complex than tumor size or proximity alone.
- discussion_id: interpretation_acoustic_treatment_comparisons
  prompt: >-
    How should observation, radiosurgery, fractionated radiotherapy, and
    microsurgery be compared when tumor size, symptoms, hearing, age, and other
    selection factors differ across mostly nonrandomized studies?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - treatments#Observation with Serial MRI and Audiometry
  - treatments#Microsurgical Resection
  - treatments#Stereotactic Radiosurgery or Fractionated Radiotherapy
  rationale: >-
    Guidelines emphasize individualized selection and explicitly characterize
    the evidence base as low. Network rankings are heavily influenced by
    observational cohorts and should not be read as causal head-to-head
    superiority for every patient.
  evidence:
  - reference: PMID:31504802
    reference_title: EANO guideline on the diagnosis and treatment of vestibular schwannoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The level of evidence to provide treatment recommendations for vestibular schwannoma is low compared with other intracranial neoplasms."
    explanation: EANO explicitly identifies the limited comparative evidence base.
  - reference: PMID:39627752
    reference_title: "Treatment options for unilateral vestibular schwannoma: a network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "34 non-RCTs and 1 RCT that included 6 interventions were analyzed."
    explanation: The network meta-analysis is overwhelmingly based on nonrandomized studies.

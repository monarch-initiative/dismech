    treatment_effect: INHIBITS
    description: Resection removes or decompresses advanced local tumor burden; INHIBITS is the closest available treatment-effect category for that reduction.
    evidence:
    - reference: PMID:31504802
      reference_title: EANO guideline on the diagnosis and treatment of vestibular schwannoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In small tumors, observation has to be weighed against radiosurgery, in large tumors surgical decompression is mandatory, potentially followed by fractionated radiotherapy or radiosurgery."
      explanation: The guideline directly supports surgical decompression as the tumor-burden intervention for large lesions.
  evidence:

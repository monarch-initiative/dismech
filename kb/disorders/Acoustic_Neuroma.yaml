disease_term:
  preferred_term: acoustic neuroma
  term:
    id: MONDO:0001569
    label: acoustic neuroma
description: >-
  Acoustic neuroma, anatomically termed vestibular schwannoma, is a benign
  Schwann-cell tumor arising from a vestibular division of cranial nerve VIII.
  Most tumors are sporadic and unilateral, whereas bilateral vestibular
  schwannomas are a hallmark of NF2-related schwannomatosis. The core tumor
  mechanism is biallelic NF2 inactivation with merlin loss, followed by loss of
  contact-dependent growth restraint and YAP/TAZ-TEAD-dependent proliferative
  signaling. Hearing and balance morbidity can reflect both local
  eighth-nerve effects and cochlear injury; larger cerebellopontine-angle tumors
  can affect adjacent cranial nerves and the brainstem.
definitions:
- name: Vestibular schwannoma disease definition
  definition_type: OTHER
  description: >-
    A benign tumor formed by neoplastic Schwann cells on the eighth cranial
    nerve, usually arising from a vestibular nerve division.
  scope: Lesion-level definition; NF2-related schwannomatosis remains a separate tumor-predisposition syndrome.
  evidence:
  - reference: PMID:38892775
    reference_title: "Vestibular Schwannoma and Tinnitus: A Systematic Review of Microsurgery Compared to Gamma Knife Radiosurgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular schwannoma (VS) is a benign tumor of the eighth cranial nerve formed from neoplastic Schwann cells."
    explanation: The review provides a concise lesion-level definition.
has_subtypes:
- name: Sporadic Unilateral
  display_name: Sporadic Unilateral Vestibular Schwannoma
  classification: etiologic_context
  description: >-
    The usual presentation is a unilateral sporadic tumor with somatic NF2
    inactivation in tumor tissue and no inherited NF2 syndrome.
  evidence:
  - reference: PMID:28710469
    reference_title: Differential NF2 Gene Status in Sporadic Vestibular Schwannomas and its Prognostic Impact on Tumour Growth Patterns.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority (95%) of VSs are unilateral and sporadic schwannomas, which occur predominantly in the 4th to 6th decades of life"
    explanation: This human tumor study distinguishes the predominant unilateral sporadic context.
- name: NF2-Related
  display_name: NF2-Related Vestibular Schwannoma
  classification: etiologic_context
  description: >-
    Vestibular schwannomas arising in NF2-related schwannomatosis are often
    bilateral and occur within a germline tumor-predisposition syndrome. This
    context does not make the syndrome itself a subtype of the tumor.
  evidence:
  - reference: PMID:20301380
    reference_title: NF2-Related Schwannomatosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NF2-related schwannomatosis (NF2) is characterized by bilateral vestibular schwannomas with associated symptoms of tinnitus, hearing loss, and balance dysfunction."
    explanation: GeneReviews identifies bilateral vestibular schwannomas as the defining NF2-related tumor context.
prevalence:
- subtype: Sporadic Unilateral
  population: Modern population-based studies in Denmark, the Netherlands, Taiwan, and the United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 3.0
  rate_high: 5.2
  notes: Range of recent all-age incidence estimates for sporadic vestibular schwannoma.
  evidence:
  - reference: PMID:34464224
    reference_title: "Global Incidence of Sporadic Vestibular Schwannoma: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most recent incidence rates of among all ages ranged between 3.0 and 5.2 per 100,000 person-years."
    explanation: The systematic review reports a modern international annual-incidence range.
- subtype: Sporadic Unilateral
  population: Olmsted County, Minnesota residents on January 1, 2017
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 42.0
  notes: Point prevalence of confirmed sporadic vestibular schwannoma in a population-linked medical-record cohort.
  evidence:
  - reference: PMID:30688755
    reference_title: "Prevalence of Sporadic Vestibular Schwannoma: Reconciling Temporal Bone, Radiologic, and Population-based Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-seven persons from a population of nearly 160,000 were living with VS on January 1, 2017, resulting in a point prevalence of 42.0 per 100,000 persons."
    explanation: The population-based cohort supplies the date-specific point-prevalence estimate.
progression:
- phase: Variable growth during imaging observation
  subtype: Sporadic Unilateral
  notes: >-
    Growth is not uniform. In a prospective national cohort, most detected
    growth occurred in the first five years, and extrameatal tumors grew more
    often than intrameatal tumors. Continued observation can remain reasonable
    in selected patients, even after limited initial growth.
  evidence:
  - reference: PMID:33068429
    reference_title: The natural history of vestibular schwannoma growth-prospective 40-year data from an unselected national cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5 years after diagnosis, 21% of the intrameatal tumors exhibited growth
      during observation, whereas 37% of extrameatal tumors had grown,
      increasing to 25% intrameatal and 42% extrameatal after 10 years.
    explanation: Prospective national data quantify the variable natural history by tumor location.
  - reference: PMID:34121081
    reference_title: "Natural History of Growing Sporadic Vestibular Schwannomas During Observation: An International Multi-Institutional Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth detected during observation does not necessarily portend future growth, especially for slowly growing tumors."
    explanation: This multi-institutional cohort supports individualized surveillance rather than assuming continuous growth.

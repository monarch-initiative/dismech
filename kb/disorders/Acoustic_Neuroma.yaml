treatments:
- name: Observation with Serial MRI and Audiometry
  description: >-
    Observation is appropriate for selected patients based on tumor size,
    symptoms, hearing, documented growth, age, comorbidity, and preference.
    Limited initial growth does not invariably require immediate intervention.
  action_category: MONITORING
  treatment_term:
    preferred_term: observation
    term:
      id: NCIT:C25598
      label: Observation Activity
  evidence:

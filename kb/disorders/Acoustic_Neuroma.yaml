phenotypes:
- name: Sensorineural Hearing Impairment
  description: >-
    Usually asymmetric or unilateral sensorineural hearing impairment is the
    dominant functional manifestation. Both retrocochlear eighth-nerve effects
    and ipsilateral cochlear degeneration may contribute.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:22377650
    reference_title: "Dysfunction of the cochlea contributing to hearing loss in acoustic neuromas: an underappreciated entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss is a common symptom in patients with cochleovestibular schwannoma."
    explanation: Human clinicopathologic data directly support hearing loss as a common manifestation.
- name: Tinnitus
  description: >-
    Tinnitus may occur even with a small tumor and can be a major source of
    quality-of-life impairment; its relationship to tumor size and hearing
    status is heterogeneous.
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:38892775
    reference_title: "Vestibular Schwannoma and Tinnitus: A Systematic Review of Microsurgery Compared to Gamma Knife Radiosurgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although VS can cause a variety of symptoms, tinnitus is one of the most distressing symptoms for patients and can greatly impact quality of life."
    explanation: The systematic review supports tinnitus as a clinically important manifestation.

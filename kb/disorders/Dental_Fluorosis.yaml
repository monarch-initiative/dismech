- name: COL1A2
  gene_term:
    preferred_term: COL1A2
    term:
      id: hgnc:2198
      label: COL1A2
  association: Susceptibility polymorphism (rs412777)
  relationship_type: SUSCEPTIBILITY
  notes: >-
    In a Tunisian case-control study, the COL1A2 rs412777 C allele and CC
    genotype were significantly associated with increased dental fluorosis risk
    under both codominant (P = 0.002) and dominant (P < 0.001) models, whereas
    A-allele carriers were protected (OR = 0.375, 95% CI 0.207-0.672, P = 0.001).
  evidence:
  - reference: DOI:10.1186/s12903-024-04086-z
    reference_title: "The association between Dental Fluorosis and COL1A2 gene polymorphism among a Tunisian Population"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of allelic distribution revealed that A allele carriers were significantly protected against (DF) when compared to those with the C allele (C vs. A, p = 0.001; OR = 0.375 (0.207–0.672)). This suggests a strong correlation between the presence of the C allele and the risk of developing DF. Additionally, significant association between the CC genotype of rs412777 and an increased risk of DF was found under both codominant and dominant genetic models (P = 0.002 and P < 0.001 respectively)."
    explanation: >-
      Case-control study demonstrating a significant association between the
      COL1A2 rs412777 polymorphism and dental fluorosis susceptibility.

environmental:
- name: Excessive drinking water fluoride exposure
  description: >-
    Chronic consumption of drinking water with elevated fluoride concentrations
    above the optimal caries-preventive range (0.5 to 1.0 mg/L) or above drinking
    water standards (1.5 mg/L) is the primary global driver of endemic dental
    fluorosis.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  environment_context:
    preferred_term: drinking water
    term:
      id: ENVO:00003064
      label: drinking water
  chemicals:
  - fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41466045
      reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
      explanation: >-
        The exposure-response relationship between water fluoride concentration
        and dental fluorosis risk supports drinking water as a source of the
        developmental fluoride overexposure.
  evidence:
  - reference: PMID:41466045
    reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
    explanation: >-
      Quantifies the steep exposure-response relationship between drinking water
      fluoride concentration and dental fluorosis risk.
  - reference: PMID:33333408
    reference_title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With water improvement, water fluoride levels decreased from 2.72 mg/L to 0.54 mg/L (95% confidence intervals: -2.75, -1.58), which was below the standard for drinking water (1.5 mg/L). Additionally, after water improvement, the prevalence of dental fluorosis decreased from 54.5% to 36.2%"
    explanation: >-
      Demonstrates that high drinking water fluoride levels drive endemic childhood
      dental fluorosis and that lowering water fluoride reduces prevalence.

- name: Brick tea fluoride exposure
  description: >-
    High intake of fluoride-rich brick tea infusion or buttered brick tea causes
    brick tea-type endemic dental fluorosis in Tibetan and western Chinese
    populations even where drinking water fluoride levels are low.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  chemicals:

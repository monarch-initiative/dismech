differential_diagnoses:
- name: Amelogenesis imperfecta
  description: >-
    Hereditary developmental enamel defect caused by pathogenic variants in
    enamel matrix or protease genes (including AMELX, ENAM, MMP20, KLK4, WDR72,
    and FAM83H) that can present with generalized hypomineralized or hypoplastic
    enamel.
  disease_term:
    preferred_term: amelogenesis imperfecta
    term:
      id: MONDO:0019507
      label: amelogenesis imperfecta
  distinguishing_features:
  - Family history consistent with Mendelian inheritance and pathogenic variants in AMELX, ENAM, MMP20, KLK4, WDR72, or FAM83H
  - Generalized involvement across dentitions without an environmental fluoride exposure history
  evidence:
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lastly, AI, an inherited condition, encompasses diverse phenotypes in enamel development. AI phenotypes, whether hypoplastic or hypomineralised, entail mutations in genes, such as AMELX, ENAM, MMP20, KLK4, WDR72, FAM83H, C4ORF26, amelotin, GPR68, and ACPT. Diagnosing AI involves considering family history and clinical observation."
    explanation: >-
      Distinguishes hereditary amelogenesis imperfecta from environmental dental
      fluorosis by family history and causative gene mutations.

- name: Molar-incisor hypomineralization and enamel hypoplasia
  description: >-
    Non-fluoride developmental defects of enamel including molar-incisor
    hypomineralization (a qualitative demarcation defect of first permanent
    molars and incisors) and quantitative enamel hypoplasia.
  distinguishing_features:
  - Molar-incisor hypomineralization is restricted to first permanent molars and variably permanent incisors with demarcated rather than diffuse homologous opacities
  - Enamel hypoplasia is a quantitative secretory-stage defect of reduced enamel thickness rather than diffuse subsurface hypomineralization from chronic fluoride intake
  evidence:
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MIH, a qualitative enamel defect, occurs during the mineralisation and maturation phases, affecting first permanent molars and eventually incisors."
    explanation: >-
      Characterizes molar-incisor hypomineralization as a key developmental
      enamel defect in the differential diagnosis of dental fluorosis.
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Enamel hypoplasia, a quantitative defect, manifests in any tooth during enamel matrix secretion."
    explanation: >-
      Distinguishes quantitative enamel hypoplasia from qualitative fluorotic
      hypomineralization.

- name: Celiac disease-related enamel defects
  description: >-
    Symmetric developmental enamel defects (hypomineralization or pitting)
    secondary to malabsorption and immune-mediated disruption during tooth
    development in children with celiac disease.
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  distinguishing_features:
  - Associated with celiac serology, gastrointestinal or extraintestinal malabsorption features, and absence of excess fluoride exposure
  evidence:
  - reference: PMID:38592254
    reference_title: "Celiac Disease-Related Enamel Defects: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other differential diagnoses of DED include enamel hypoplasia, fluorosis, amelogenesis imperfecta, and localized trauma/infection."
    explanation: >-
      Explicitly places dental fluorosis in the differential diagnosis of celiac
      disease-related developmental enamel defects.

prevalence:
- population: Brazil meta-analysis
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 18300.0
  evidence:
  - reference: PMID:41779336
    reference_title: "Prevalence of developmental defects of enamel in Brazil: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pooled prevalence was 15.6% (95% CI: 13.2%-18.4%; I2 = 95.6%) for MIH, 12.5% (95% CI: 8.5%-18%; I2 = 96.2%) for HSPM, 4.5% (95% CI: 2.3%-8.7%; I2 = 95.7%) for enamel hypoplasia and 18.3% (95% CI: 9.9%-31.3%; I2 = 98.2%) for dental fluorosis"
    explanation: >-
      Provides a pooled prevalence estimate and shows a higher burden in
      permanent dentition.
- population: Primary dentition twin cohort
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 23000.0
  notes: Moderate heritability was reported, but environmental exposure remained the dominant driver.
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of DF was 23%. Coincidence regarding the presence of DF was considered very strong among MZ twins (rMZ = .92) and strong among DZ twins (rDZ = .76) (P < .001). Observed H2 was moderate (H2 = 66.5%)."
    explanation: >-
      Supports measurable burden in an early-life cohort and suggests host
      susceptibility modifies an environmentally driven phenotype.
- population: Tibet Autonomous Region brick tea-drinking districts
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 33570.0

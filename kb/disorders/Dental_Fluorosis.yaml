references:
- reference: DOI:10.1186/s12903-024-04086-z
  title: "The association between Dental Fluorosis and COL1A2 gene polymorphism among a Tunisian Population"
  findings:
  - statement: The COL1A2 rs412777 C allele and CC genotype are significantly associated with increased dental fluorosis susceptibility, whereas A-allele carriers are protected.
    supporting_text: "The results of allelic distribution revealed that A allele carriers were significantly protected against (DF) when compared to those with the C allele (C vs. A, p = 0.001; OR = 0.375 (0.207–0.672)). This suggests a strong correlation between the presence of the C allele and the risk of developing DF. Additionally, significant association between the CC genotype of rs412777 and an increased risk of DF was found under both codominant and dominant genetic models (P = 0.002 and P < 0.001 respectively)."
- reference: DOI:10.3389/fcell.2023.1168215
  title: "Advances in epidemiological status and pathogenesis of dental fluorosis"
  findings:
  - statement: Excessive fluoride exposure during enamel development induces endoplasmic reticulum stress, oxidative stress, mitochondrial damage, DNA damage, and caspase-mediated ameloblast apoptosis.
    supporting_text: "This results in the abnormal development of enamel, which involves physiological processes such as endoplasmic reticulum stress, oxidative stress, mitochondrial damage, DNA damage, and apoptosis."
  - statement: Fluoride-induced cellular damage activates autophagy and induces ameloblast apoptosis via the caspase pathway.
    supporting_text: "To mitigate this damage, autophagy is activated, initiating an adaptive defense response, and inducing ameloblast apoptosis by activating the caspase pathway ( Suzuki et al., 2015)."
- reference: clinicaltrials:NCT01733888
  title: "Evaluating the Effect of Resin Infiltration and Resin Infiltration With Bleaching in Improving the Esthetics for Non Pitted Fluorosis Stains in Indian Population"
  findings:
  - statement: Clinical trial evaluating resin infiltration alone and combined with bleaching for esthetically improving non-pitted fluorosis stains in children.
    supporting_text: "Therefore, the following trial will be conducted to assess the esthetic improvement of fluorosed permanent anterior teeth after resin infiltration and compare it with standard bleaching procedure and a combination of bleaching and Resin infiltration therapy in children with fluorosed teeth."
- reference: clinicaltrials:NCT05051748
  title: "Clinical Evaluation of Different Minimal Invasive Treatment Modalities of Mild to Moderate Dental Fluorosis Using A Visual Analog Scale"
  findings:
  - statement: Randomized clinical trial evaluating minimally invasive microabrasion, bleaching, and CPP-ACFP remineralization protocols for mild-to-moderate dental fluorosis using a visual analog scale.
    supporting_text: "This study was conducted for clinical evaluation of the quality of different minimal-invasive treatment modalities and combination treatments in esthetics improvement of mild to moderate fluorosed teeth using two different evaluation methods."
- reference: clinicaltrials:NCT05204277
  title: "Clinical Evaluation of Different Minimal Invasive Treatment Modalities of Mild to Moderate Dental Fluorosis Using an Intra-oral Spectrophotometer"
  findings:
  - statement: Eight-arm randomized controlled trial evaluating spectrophotometer color change across bleaching, enamel microabrasion, and CPP-ACFP remineralization protocols in mild-to-moderate dental fluorosis.
    supporting_text: "Participants were randomly allocated in eight treatment protocols with twenty teeth (n=20) included in each protocol. (P1) Opalescence boost PF 40%. (P2) Opalustre. (P3) MI-Paste Plus. In (P4) teeth were treated with Opalustre + Opalescence boost PF 40%. In (P5) Opalescence boost PF 40% + MI-Paste Plus, while in (P6) Opalustre +MI-Paste Plus. Whereas (P7) Opalustre + Opalescence boost PF 40% + MI-Paste Plus. (P8) control."
- reference: PMID:20041010
  title: "Child skeletal fluorosis from indoor burning of coal in southwestern China."
  findings:
  - statement: Indoor coal-burning fluoride exposure in endemic southwestern China resulted in a 97% prevalence of dental fluorosis among high-risk children.
    supporting_text: "In addition, about 97% of 370 high-risk children were identified with dental fluorosis."
- reference: PMID:26499132
  title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
  findings:
  - statement: Excessive daily fluoride intake from brick tea in seven Tibetan districts resulted in a 33.57% prevalence of dental fluorosis.
    supporting_text: "The average daily fluoride intake from drinking brick tea in all seven districts in Tibet was much higher than the national standard. The prevalence of dental fluorosis was 33.57%"
- reference: PMID:31329045
  title: "Disrupted Iron Storage in Dental Fluorosis."
  findings:
  - statement: Fluoride targets ferritin heavy chain in maturation-stage ameloblasts, depleting enamel iron oxides and impairing enamel mechanical and ultrastructural integrity.
    supporting_text: "Iron storage was drastically reduced by fluoride. Among the proteins involved in iron metabolism, ferritin heavy chain (Fth), in charge of iron storage, appeared as the preferential target of fluoride"
- reference: PMID:33057951
  title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
  findings:
  - statement: Replacing high-fluoride drinking water and supplementing calcium and vitamin D alleviated dental and skeletal fluorosis in mice.
    supporting_text: "Substitution of NaF-containing water with normal drinking water reduced the severity of fluorosis but supplementation of calcium and vitamin D effectively alleviated dental and skeletal fluorosis"
- reference: PMID:33333408
  title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
  findings:
  - statement: Water improvement and defluoridation in endemic areas of China reduced water fluoride from 2.72 mg/L to 0.54 mg/L and lowered childhood dental fluorosis prevalence from 54.5% to 36.2%.
    supporting_text: "With water improvement, water fluoride levels decreased from 2.72 mg/L to 0.54 mg/L (95% confidence intervals: -2.75, -1.58), which was below the standard for drinking water (1.5 mg/L). Additionally, after water improvement, the prevalence of dental fluorosis decreased from 54.5% to 36.2%"
- reference: PMID:36583212
  title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
  findings:
  - statement: Excess fluoride increases amelogenin binding and organic matrix retention during the secretory phase and disrupts ameloblast modulation during the maturation phase prior to age 12 years.
    supporting_text: "Excessive fluoride binds more enamel amelogenin and increases enamel organic substances in the secretory phase of enamel formation, thereby leading to hypomineralization and DF"
  - statement: Candidate susceptibility genes investigated in brick tea-type fluorosis include GSTP1, VDR (FokI), PRL (-1149), MMP2, FRZB (FRZB1), KL, BMP2, and ALOX15.
    supporting_text: "We found that many studies in China have analyzed the genetic diversity of BTF in Tibetan populations and evaluated the susceptibility to BTF caused by different genes in Tibetan, Kazak, Mongolian, and Han populations. GSTP1, vitamin D receptor-FokI, prolactin promoter at -1,149, MMP2, FRZB1, serum soluble Klotho, BMP2, and ALOX15 and their related genes are thought to be involved (38, 49–55). However, the exact correlation between BTF and genetics needs further research."
- reference: PMID:38135514
  title: "Prevalence of Skeletal Fluorosis in Northern Tanzania: A Follow-Up Study."
  findings:
  - statement: Endemic dental fluorosis affected 82.5% of screened residents in a northern Tanzania village, was present in all skeletal fluorosis cases at higher TFI grades, and caused marked enamel pitting and discoloration.
    supporting_text: "TFI grades were ascertained for 750 (55.2%) of those screened. DF was endemic in the village, seen in 619 (82.5%; 95% CI=79.8, 85.3) individuals. DF was present in all cases with SF and of a higher grade in comparison to the rest of the population (Figure 2)."
- reference: PMID:38592254
  title: "Celiac Disease-Related Enamel Defects: A Systematic Review."
  findings:
  - statement: Dental fluorosis is a primary differential diagnosis for developmental enamel defects alongside celiac disease, enamel hypoplasia, and amelogenesis imperfecta.
    supporting_text: "Other differential diagnoses of DED include enamel hypoplasia, fluorosis, amelogenesis imperfecta, and localized trauma/infection."
- reference: PMID:39321764
  title: "Developmental Defects of Enamel."
  findings:
  - statement: Dental fluorosis compromises crystal growth in homologous teeth during amelogenesis and must be differentiated from amelogenesis imperfecta, molar-incisor hypomineralization, and enamel hypoplasia.
    supporting_text: "Dental fluorosis, a toxicological concern from chronic and excessive fluoride exposure, affects ameloblasts and compromises crystal growth of the homologous teeth during enamel development."
- reference: PMID:39839572
  title: "Roles of calcium in ameloblasts during tooth development: A scoping review."
  findings:
  - statement: Fluoride exposure and calcium transport pathways (including TRPM7, STIM proteins, and SOCE) regulate amelogenesis.
    supporting_text: "Calcium deficiency, nutritional supplements, fluoride exposure, TRPM7, STIM proteins, and the SOCE pathway were found to influence amelogenesis."
- reference: PMID:39876909
  title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
  findings:
  - statement: Urinary fluoride levels and circulating BALP, MMP-2, and MMP-9 positively correlate with dental fluorosis severity in children, whereas serum osteocalcin and parathyroid hormone decrease with increasing fluorosis severity.
    supporting_text: "As the urinary fluoride level and the extent of dental fluorosis increased, there was a gradual elevation in serum BALP, MMP-2, and MMP-9 levels in children, while OC and PTH levels gradually decreased (P<0.05)."
- reference: PMID:40672984
  title: "Characterization of Temporal and Spatial Changes of Endemic Fluorosis Due to Coal-Burning Pollution - China, 2009-2023."
  findings:
  - statement: Indoor coal-burning pollution is a major environmental source of endemic fluorosis in rural China.
    supporting_text: "Coal-burning pollution type of endemic fluorosis poses a serious health threat to rural inhabitants in certain regions of China."
- reference: PMID:41294875
  title: "Enamel Maturation as a Systems Physiology: Ion Transport and Pi Flux."
  findings:
  - statement: Disrupted phosphate and ion transport during enamel maturation reduces enamel mineral content and causes opacities and post-eruptive breakdown.
    supporting_text: "Disruption of phosphate handling reduces crystal growth and final mineral content of enamel, and produces hypomineralized or hypomature enamel with opacities, post-eruptive breakdown, and greater caries susceptibility."
- reference: PMID:41361113
  title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice."
  findings:
  - statement: Adolescent mice have lower fluoride clearance and greater susceptibility to ameloblast disruption, KLK4 suppression, and chalky hypomineralized enamel than mature mice.
    supporting_text: "Histological analysis revealed disrupted ameloblast morphology, reduced KLK4 expression, and aprismatic enamel, with more severe effects in adolescents."
- reference: PMID:41466045
  title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
  findings:
  - statement: Each 1 mg/L increase in drinking water fluoride sharply increases dental fluorosis risk, with 0.5 to 1.0 mg/L optimal for balancing caries prevention and fluorosis control.
    supporting_text: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
- reference: PMID:41623091
  title: "Minimally Invasive Treatments for Dental Fluorosis: A Network Meta-Analysis of Esthetic Masking Efficacy."
  findings:
  - statement: Combined enamel microabrasion with in-office bleaching and standalone resin infiltration provide the strongest conservative esthetic masking of dental fluorosis.
    supporting_text: "Multimodal protocols combining microabrasion with in-office bleaching achieved the highest esthetic performance across immediate, three-month, and 6-month evaluations."
- reference: PMID:41779336
  title: "Prevalence of developmental defects of enamel in Brazil: a systematic review and meta-analysis."
  findings:
  - statement: Pooled prevalence of dental fluorosis in Brazil was 18.3%.
    supporting_text: "the pooled prevalence was 15.6% (95% CI: 13.2%-18.4%; I2 = 95.6%) for MIH, 12.5% (95% CI: 8.5%-18%; I2 = 96.2%) for HSPM, 4.5% (95% CI: 2.3%-8.7%; I2 = 95.7%) for enamel hypoplasia and 18.3% (95% CI: 9.9%-31.3%; I2 = 98.2%) for dental fluorosis"
- reference: PMID:42029364
  title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
  findings:
  - statement: Dental fluorosis prevalence in the primary dentition twin cohort was 23%, with early-life fluoridated toothpaste use and shorter exclusive breastfeeding acting as significant environmental predictors alongside twin concordance.
    supporting_text: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."

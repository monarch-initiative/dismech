biochemical:
- name: Urinary fluoride
  presence: Elevated
  context: Endemic and chronic fluoride exposure monitoring
  notes: >-
    Measured by fluoride ion-selective electrode; positively correlates with the
    clinical extent of dental fluorosis.
  evidence:
  - reference: PMID:39876909
    reference_title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on Spearman correlation analysis, a positive correlation was identified between the urinary fluoride level, the extent of dental fluorosis, and indicators such as BALP, MMP-2, and MMP-9."
    explanation: >-
      Confirms elevated urinary fluoride correlates positively with dental
      fluorosis severity.
  - reference: PMID:39876909
    reference_title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The urine fluoride levels, BALP, MMP-2, and MMP9 of the children in the fluorosis group were higher than fluoride-free group, and the mother's educational level, per capita annual household income, OC, and PTH were lower than fluoride-free group (P<0.05)."
    explanation: >-
      Demonstrates significantly higher urinary fluoride levels in children with
      dental fluorosis compared with controls.

- name: Bone-specific alkaline phosphatase (BALP)
  presence: Elevated
  context: Serum in children with dental fluorosis
  notes: >-
    Serum BALP is significantly higher in children with dental fluorosis than in
    fluoride-free controls and increases progressively with urinary fluoride
    concentration and dental fluorosis severity.
  evidence:

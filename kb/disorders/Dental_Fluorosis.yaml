genetic:
- name: GSTP1
  gene_term:
    preferred_term: GSTP1
    term:
      id: hgnc:4638
      label: GSTP1
  association: Candidate susceptibility polymorphism
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Evaluated as a candidate genetic susceptibility modifier of brick tea-type
    fluorosis across Tibetan, Kazak, Mongolian, and Han populations, though exact
    genetic correlations require further confirmation.
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We found that many studies in China have analyzed the genetic diversity of BTF in Tibetan populations and evaluated the susceptibility to BTF caused by different genes in Tibetan, Kazak, Mongolian, and Han populations. GSTP1, vitamin D receptor-FokI, prolactin promoter at -1,149, MMP2, FRZB1, serum soluble Klotho, BMP2, and ALOX15 and their related genes are thought to be involved (38, 49–55). However, the exact correlation between BTF and genetics needs further research."
    explanation: >-
      Identifies GSTP1 among candidate genes implicated in host susceptibility to
      brick tea-type fluorosis while noting that definitive genetic correlations
      require further research.


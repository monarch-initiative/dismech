  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36583212
      reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Brick tea-type fluorosis (BTF) due to a high intake of brick tea is possible in Tibetan populations, and dental fluorosis (DF) and skeletal fluorosis (SF) are its primary manifestations."
      explanation: >-
        Attributes brick tea-type fluorosis, with dental fluorosis as a primary
        manifestation, to high brick tea intake.
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Brick tea-type fluorosis (BTF) due to a high intake of brick tea is possible in Tibetan populations, and dental fluorosis (DF) and skeletal fluorosis (SF) are its primary manifestations."
    explanation: >-
      Identifies high brick tea intake as a major dietary cause of endemic
      dental fluorosis.
  - reference: PMID:26499132
    reference_title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average daily fluoride intake from drinking brick tea in all seven districts in Tibet was much higher than the national standard. The prevalence of dental fluorosis was 33.57%"
    explanation: >-
      Documents excessive daily fluoride intake from brick tea and the resulting
      33.57% dental fluorosis prevalence across seven Tibetan districts.


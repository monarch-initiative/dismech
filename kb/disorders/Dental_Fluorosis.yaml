    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological analysis revealed disrupted ameloblast morphology, reduced KLK4 expression, and aprismatic enamel, with more severe effects in adolescents."
    explanation: >-
      Directly supports fluoride-mediated ameloblast disruption together with
      reduced KLK4 and abnormal enamel structure.
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Later, in the maturation period, the regulation of ameloblast modulation is disrupted by superfluous fluoride, and the mineralization of the enamel is disrupted, leading to hypomineralization and DF"
    explanation: >-
      Supports disruption of maturation-stage ameloblast modulation and enamel
      mineralization by excess fluoride.

- name: Ion transport dysregulation during enamel maturation
  description: >-
    Fluoride exposure and altered ameloblast calcium handling (including TRPM7,
    STIM proteins, and store-operated calcium entry) disrupt maturation-stage
    ameloblast modulation and mineralization. In general amelogenesis physiology,
    impaired maturation-stage phosphate and ion flux across ameloblasts reduces
    crystal growth and final mineral content, consistent with the hypomineralized
    enamel seen in dental fluorosis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:

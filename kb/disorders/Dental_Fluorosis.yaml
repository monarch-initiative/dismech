- name: Exposure optimization in drinking water
  description: >-
    Prevention and population management depend on maintaining fluoride exposure
    within a range that preserves caries prevention while limiting fluorosis
    risk during tooth development.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventative therapy
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
  evidence:
  - reference: PMID:41466045
    reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that establishing a fluoride concentration range of 0.5 to 1.0 mg/L is optimal for balancing the prevention of dental caries and the control of dental fluorosis."
    explanation: >-
      Supports prevention-focused exposure optimization as a practical public
      health management strategy for fluorosis risk.

- name: Drinking water defluoridation and water source improvement
  description: >-
    Engineering and public-health water improvement projects that replace
    high-fluoride water sources or defluoridate drinking water below 1.5 mg/L
    markedly reduce the incidence and severity of endemic dental fluorosis in
    children.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: preventative therapy
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  target_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
  evidence:
  - reference: PMID:33333408
    reference_title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With water improvement, water fluoride levels decreased from 2.72 mg/L to 0.54 mg/L (95% confidence intervals: -2.75, -1.58), which was below the standard for drinking water (1.5 mg/L). Additionally, after water improvement, the prevalence of dental fluorosis decreased from 54.5% to 36.2%"
    explanation: >-
      Meta-analysis demonstrating that water improvement and defluoridation
      markedly reduce drinking water fluoride levels and childhood dental
      fluorosis prevalence.

- name: Calcium and vitamin D supplementation
  description: >-
    Dietary supplementation with calcium and vitamin D in conjunction with
    replacing high-fluoride drinking water restores elemental homeostasis and
    alleviates dental fluorosis severity in preclinical fluorosis models.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: calcium(2+)
      term:
        id: CHEBI:29108
        label: calcium(2+)
    - preferred_term: vitamin D
      term:
        id: CHEBI:27300
        label: vitamin D
  target_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
  notes: >-
    Supported by preclinical mouse evidence showing that calcium and vitamin D
    supplementation alongside removal of high-fluoride water more effectively
    alleviates dental and skeletal fluorosis than water substitution alone.
  evidence:
  - reference: PMID:33057951
    reference_title: "Calcium and Vitamin D Supplementation Effectively Alleviates Dental and Skeletal Fluorosis and Retain Elemental Homeostasis in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Substitution of NaF-containing water with normal drinking water reduced the severity of fluorosis but supplementation of calcium and vitamin D effectively alleviated dental and skeletal fluorosis"
    explanation: >-
      Preclinical evidence that dietary calcium and vitamin D supplementation
      combined with cessation of high-fluoride water intake alleviates dental
      fluorosis severity.


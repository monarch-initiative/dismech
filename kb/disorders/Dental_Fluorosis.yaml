name: Dental Fluorosis
creation_date: "2026-05-18T00:00:00Z"
category: Complex
disease_term:
  preferred_term: Dental Fluorosis
  term:
    id: MONDO:0006722
    label: dental fluorosis
parents:
- Oral Cavity Disease

classifications:
  harrisons_chapter:
  - classification_value: ENVIRONMENTAL_EXPOSURES
description: >-
  Dental fluorosis is a developmental enamel disorder caused by chronic excess
  fluoride exposure during tooth formation, producing dose-dependent enamel
  hypomineralization with white striations, opacity, staining, and in severe
  cases pitting and surface breakdown.

notes: >-
  This curation covers secretory- and maturation-stage developmental enamel
  mechanisms (amelogenin retention, KLK4 suppression, ion transport disruption,
  and ferritin heavy-chain iron storage targeting), environmental fluoride
  sources (drinking water, brick tea, indoor coal-burning pollution, early-life
  fluoridated toothpaste), clinical grading and urinary biomarker diagnosis,
  differential diagnosis of developmental enamel defects, and preventive as well
  as conservative esthetic management.

progression:
- phase: Childhood amelogenesis susceptibility window
  age_range: Birth to 12 years
  notes: >-
    Systemic fluoride overexposure causes dental fluorosis only when it occurs
    during active ameloblast development and tooth mineralization; individuals
    exposed only after age 12 years generally do not develop dental fluorosis
    because dental germ ameloblast development is complete.
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Such patients may also have DF, whereas those exposed to excess fluoride after 12 years of age may not have DF since the development of ameloblasts in the dental germ is finished by that age."
    explanation: >-
      Establishes the developmental window of susceptibility prior to age 12
      years when dental germ amelogenesis is active.

pathophysiology:
- name: Developmental fluoride overexposure during amelogenesis
  description: >-
    Dental fluorosis arises when systemic fluoride exposure exceeds the narrow
    developmental tolerance of enamel-forming teeth during amelogenesis,
    especially during childhood tooth formation. Higher fluoride in drinking
    water is associated with sharply increased fluorosis risk, and children in
    actively growing developmental stages appear more vulnerable to retention of
    systemic fluoride in mineralizing tissues.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: biomineral tissue development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: ABNORMAL
  downstream:
  - target: Secretory-stage amelogenin retention and delayed enamel mineralization
    causal_link_type: DIRECT
  - target: Maturation-stage ameloblast dysfunction with KLK4 suppression
    causal_link_type: DIRECT
  - target: Ion transport dysregulation during enamel maturation
    causal_link_type: DIRECT
  - target: Ferritin heavy-chain targeting and impaired ameloblast iron storage
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41466045
    reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
    explanation: >-
      Supports an exposure-response relationship between higher fluoride in
      drinking water and dental fluorosis risk in children.
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings demonstrate that younger mice are more vulnerable to fluoride-induced enamel defects due to lower clearance than mature mice."
    explanation: >-
      Supports developmental-stage vulnerability to fluoride toxicity during
      active enamel formation.

- name: Secretory-stage amelogenin retention and delayed enamel mineralization
  description: >-
    During the secretory phase of amelogenesis, excessive fluoride increases
    binding to enamel amelogenin and elevates retained organic matrix substances
    in developing enamel, compromising hydroxyapatite crystal growth in
    homologous teeth and contributing to enamel hypomineralization.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: ABNORMAL
  - preferred_term: enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Excessive fluoride binds more enamel amelogenin and increases enamel organic substances in the secretory phase of enamel formation, thereby leading to hypomineralization and DF"
    explanation: >-
      Supports fluoride-enhanced amelogenin binding and organic matrix retention
      during the secretory stage of enamel development.
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dental fluorosis, a toxicological concern from chronic and excessive fluoride exposure, affects ameloblasts and compromises crystal growth of the homologous teeth during enamel development."
    explanation: >-
      Confirms that chronic fluoride exposure compromises ameloblast-mediated
      enamel crystal growth in homologous developing teeth.

- name: Maturation-stage ameloblast dysfunction with KLK4 suppression
  description: >-
    Excess fluoride disrupts ameloblast structure and cyclic modulation during
    enamel maturation and suppresses KLK4 expression in maturation-stage
    ameloblasts. Reduced KLK4 impairs enamel matrix protein clearance, causing
    retention of protein within developing enamel and formation of aprismatic,
    hypomineralized enamel.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: tooth mineralization
    term:
      id: GO:0034505
      label: tooth mineralization
    modifier: DECREASED
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological analysis revealed disrupted ameloblast morphology, reduced KLK4 expression, and aprismatic enamel, with more severe effects in adolescents."
    explanation: >-
      Directly supports fluoride-mediated ameloblast disruption together with
      reduced KLK4 and abnormal enamel structure.
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Later, in the maturation period, the regulation of ameloblast modulation is disrupted by superfluous fluoride, and the mineralization of the enamel is disrupted, leading to hypomineralization and DF"
    explanation: >-
      Supports disruption of maturation-stage ameloblast modulation and enamel
      mineralization by excess fluoride.

- name: Ion transport dysregulation during enamel maturation
  description: >-
    Fluoride-associated dental fluorosis converges on disturbed ion transport
    during enamel maturation, including calcium, phosphate, and bicarbonate or
    chloride-linked transport processes required for normal crystal growth and
    hardening. Disruption of these transport systems produces hypomineralized or
    hypomature enamel with visible opacities and post-eruptive fragility.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: calcium ion transport
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: ABNORMAL
  - preferred_term: phosphate ion transport
    term:
      id: GO:0006817
      label: phosphate ion transport
    modifier: ABNORMAL
  - preferred_term: chloride transport
    term:
      id: GO:0006821
      label: chloride transport
    modifier: ABNORMAL
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39839572
    reference_title: "Roles of calcium in ameloblasts during tooth development: A scoping review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Calcium deficiency, nutritional supplements, fluoride exposure, TRPM7, STIM proteins, and the SOCE pathway were found to influence amelogenesis."
    explanation: >-
      Supports the role of altered calcium transport and ameloblast ion-handling
      pathways in fluorosis-related enamel defects.
  - reference: PMID:41294875
    reference_title: "Enamel Maturation as a Systems Physiology: Ion Transport and Pi Flux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Disruption of phosphate handling reduces crystal growth and final mineral content of enamel, and produces hypomineralized or hypomature enamel with opacities, post-eruptive breakdown, and greater caries susceptibility."
    explanation: >-
      Supports a transport-centered mechanism linking maturation-stage ion flux
      defects to the canonical structural fluorosis phenotype.

- name: Ferritin heavy-chain targeting and impaired ameloblast iron storage
  description: >-
    Fluoride disrupts iron handling in maturation-stage ameloblasts, with ferritin
    heavy chain emerging as a preferential molecular target. Loss of normal iron
    storage is associated with reduced iron oxides in enamel and altered enamel
    ultrastructure and mechanical properties.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: intracellular iron ion homeostasis
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
    modifier: ABNORMAL
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31329045
    reference_title: "Disrupted Iron Storage in Dental Fluorosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Iron storage was drastically reduced by fluoride. Among the proteins involved in iron metabolism, ferritin heavy chain (Fth), in charge of iron storage, appeared as the preferential target of fluoride"
    explanation: >-
      Directly supports fluoride-mediated disruption of ameloblast iron storage
      and implicates ferritin heavy chain as a mechanistic target.
  - reference: PMID:31329045
    reference_title: "Disrupted Iron Storage in Dental Fluorosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Fluorotic enamel presented a decreased quantity of iron oxides attested by electron spin resonance technique, altered mechanical properties measured by nanoindentation, and ultrastructural defects analyzed by scanning electron microscopy"
    explanation: >-
      Links impaired iron handling to downstream enamel structural abnormality.

- name: Enamel hypomineralization and opacity
  description: >-
    The downstream structural consequence of fluoride toxicity is incompletely
    mineralized enamel with chalky white opacity, altered hardness, and, in more
    severe cases, surface breakdown after eruption.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: tooth mineralization
    term:
      id: GO:0034505
      label: tooth mineralization
    modifier: DECREASED
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization
    causal_link_type: DIRECT
  - target: Tooth discoloration and enamel opacity
    causal_link_type: DIRECT
  - target: Post-eruptive enamel surface breakdown
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adolescent mice developed pronounced dental fluorosis, characterized by chalky white incisors, elevated Quantitative Light-induced Fluorescence (QLF) values, reduced enamel microhardness, and lower enamel mineral density (EMD)."
    explanation: >-
      Supports the characteristic structural fluorosis phenotype of opaque,
      softer, less mineralized enamel.

phenotypes:
- name: Enamel hypomineralization
  category: Dental
  description: >-
    Fluorosed enamel is incompletely mineralized, softer than normal enamel, and
    clinically presents with white opacity or chalky change across homologous
    teeth that mineralized during the period of excess fluoride intake.
  phenotype_term:
    preferred_term: Enamel hypomineralization
    term:
      id: HP:0006285
      label: Enamel hypomineralization
  evidence:
  - reference: PMID:41294875
    reference_title: "Enamel Maturation as a Systems Physiology: Ion Transport and Pi Flux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Disruption of phosphate handling reduces crystal growth and final mineral content of enamel, and produces hypomineralized or hypomature enamel with opacities, post-eruptive breakdown, and greater caries susceptibility."
    explanation: >-
      Directly supports enamel hypomineralization as a core phenotype of the
      disrupted maturation process.
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dental fluorosis, a toxicological concern from chronic and excessive fluoride exposure, affects ameloblasts and compromises crystal growth of the homologous teeth during enamel development."
    explanation: >-
      Supports symmetric compromise of enamel crystal growth across homologous
      teeth in human dental fluorosis.

- name: Tooth discoloration and enamel opacity
  category: Dental
  description: >-
    Affected teeth commonly show chalky white opacity, white spots or striations,
    and may progress to yellow-brown discoloration in more severe disease.
  phenotype_term:
    preferred_term: tooth discoloration and enamel opacity
    term:
      id: HP:0000682
      label: Abnormal dental enamel morphology
  evidence:
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adolescent mice developed pronounced dental fluorosis, characterized by chalky white incisors"
    explanation: >-
      Supports enamel opacity and visible color change as salient clinical
      manifestations of fluorosis.

- name: Post-eruptive enamel surface breakdown
  category: Dental
  description: >-
    Severe fluorosis can progress from subsurface mineralization defects to
    mechanical surface loss, pitting, and post-eruptive breakdown.
  phenotype_term:
    preferred_term: post-eruptive enamel pitting and surface breakdown
    term:
      id: HP:0009722
      label: Dental enamel pits
  evidence:
  - reference: PMID:41294875
    reference_title: "Enamel Maturation as a Systems Physiology: Ion Transport and Pi Flux."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Disruption of phosphate handling reduces crystal growth and final mineral content of enamel, and produces hypomineralized or hypomature enamel with opacities, post-eruptive breakdown, and greater caries susceptibility."
    explanation: >-
      Supports surface breakdown as a downstream structural phenotype of severe
      enamel maturation failure.

environmental:
- name: Excessive drinking water fluoride exposure
  description: >-
    Chronic consumption of drinking water with elevated fluoride concentrations
    above the optimal caries-preventive range (0.5 to 1.0 mg/L) or above drinking
    water standards (1.5 mg/L) is the primary global driver of endemic dental
    fluorosis.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  environment_context:
    preferred_term: drinking water
    term:
      id: ENVO:00003064
      label: drinking water
  chemicals:
  - fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41466045
    reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
    explanation: >-
      Quantifies the steep exposure-response relationship between drinking water
      fluoride concentration and dental fluorosis risk.
  - reference: PMID:33333408
    reference_title: "Effects of water improvement and defluoridation on fluorosis-endemic areas in China: A meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With water improvement, water fluoride levels decreased from 2.72 mg/L to 0.54 mg/L (95% confidence intervals: -2.75, -1.58), which was below the standard for drinking water (1.5 mg/L). Additionally, after water improvement, the prevalence of dental fluorosis decreased from 54.5% to 36.2%"
    explanation: >-
      Demonstrates that high drinking water fluoride levels drive endemic childhood
      dental fluorosis and that lowering water fluoride reduces prevalence.

- name: Brick tea fluoride exposure
  description: >-
    High intake of fluoride-rich brick tea infusion or buttered brick tea causes
    brick tea-type endemic dental fluorosis in Tibetan and western Chinese
    populations even where drinking water fluoride levels are low.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  chemicals:
  - fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Brick tea-type fluorosis (BTF) due to a high intake of brick tea is possible in Tibetan populations, and dental fluorosis (DF) and skeletal fluorosis (SF) are its primary manifestations."
    explanation: >-
      Identifies high brick tea intake as a major dietary cause of endemic
      dental fluorosis.
  - reference: PMID:26499132
    reference_title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average daily fluoride intake from drinking brick tea in all seven districts in Tibet was much higher than the national standard. The prevalence of dental fluorosis was 33.57%"
    explanation: >-
      Documents excessive daily fluoride intake from brick tea and the resulting
      33.57% dental fluorosis prevalence across seven Tibetan districts.

- name: Indoor coal-burning fluoride pollution
  description: >-
    Indoor combustion of high-fluoride coal without adequate ventilation or
    stoves contaminates indoor air and drying foodstuffs (such as corn and
    chili peppers), driving coal-burning endemic dental fluorosis in rural China.
  exposure_term:
    preferred_term: exposure to coal
    term:
      id: ECTO:7000004
      label: exposure to coal
  chemicals:
  - fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40672984
    reference_title: "Characterization of Temporal and Spatial Changes of Endemic Fluorosis Due to Coal-Burning Pollution - China, 2009-2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coal-burning pollution type of endemic fluorosis poses a serious health threat to rural inhabitants in certain regions of China."
    explanation: >-
      Documents coal-burning pollution as a major environmental exposure pathway
      for endemic fluorosis.
  - reference: PMID:20041010
    reference_title: "Child skeletal fluorosis from indoor burning of coal in southwestern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, about 97% of 370 high-risk children were identified with dental fluorosis."
    explanation: >-
      Demonstrates near-universal dental fluorosis prevalence (97%) among high-risk
      children exposed to indoor coal burning in endemic southwestern China.

- name: Early-life fluoridated toothpaste ingestion and short exclusive breastfeeding
  description: >-
    Early-life toothbrushing with fluoridated toothpaste and exclusive
    breastfeeding for less than 6 months are independent early-childhood risk
    factors for dental fluorosis in the primary dentition.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  chemicals:
  - sodium fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."
    explanation: >-
      Identifies early-life fluoridated toothpaste use and shorter exclusive
      breastfeeding as predictors of dental fluorosis in a twin cohort.

diagnosis:
- name: Clinical dental examination with Thylstrup-Fejerskov or Dean's Fluorosis Index
  description: >-
    Diagnosis and severity grading of dental fluorosis rely on visual inspection
    of cleaned, dried teeth to assess symmetric enamel opacities, striations,
    staining, and pitting across homologous teeth using validated clinical scales
    such as the Thylstrup-Fejerskov index (0 to 9) or Dean's Fluorosis Index.
  diagnosis_term:
    preferred_term: dental examination
    term:
      id: NCIT:C158323
      label: Dental Examination
  results: >-
    Bilateral symmetric diffuse white striations, chalky opacity, yellow-brown
    staining, or surface pitting scored on the Thylstrup-Fejerskov (0-9) or
    Dean's index.
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DF was diagnosed using the Thylstrup-Fejerskov index"
    explanation: >-
      Supports clinical diagnosis and severity scoring of dental fluorosis using
      the Thylstrup-Fejerskov index.
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dean’s DF index was used in most studies (36, 46, 47), and the Chinese national standard of DF was used in one study"
    explanation: >-
      Supports clinical grading of dental fluorosis using Dean's Fluorosis Index.

- name: Urinary fluoride concentration measurement
  description: >-
    Measurement of urinary fluoride concentration (typically via a fluoride
    ion-selective electrode) provides an objective biomarker of recent and
    chronic systemic fluoride exposure that correlates with dental fluorosis
    prevalence and severity.
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  results: >-
    Elevated urinary fluoride concentration positively correlated with the
    presence and severity of dental fluorosis.
  markers: urinary fluoride
  evidence:
  - reference: PMID:26499132
    reference_title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Samples of drinking water, brick tea, brick tea infusion (or buttered tea), and urine were collected and measured for fluoride concentrations by the fluoride ion selective electrode method."
    explanation: >-
      Supports measurement of urinary fluoride by ion-selective electrode in
      epidemiologic and clinical evaluation of fluorosis.
  - reference: PMID:39876909
    reference_title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on Spearman correlation analysis, a positive correlation was identified between the urinary fluoride level, the extent of dental fluorosis, and indicators such as BALP, MMP-2, and MMP-9."
    explanation: >-
      Demonstrates that urinary fluoride levels correlate positively with the
      extent of dental fluorosis in children.


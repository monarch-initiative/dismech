- name: Early-life fluoridated toothpaste ingestion
  description: >-
    Early-life toothbrushing with fluoridated toothpaste during infancy and
    early childhood is an independent risk factor for dental fluorosis due to
    swallowing of toothpaste during active enamel formation.
  exposure_term:
    preferred_term: exposure to fluoride
    term:
      id: ECTO:9000423
      label: exposure to fluoride
  chemicals:
  - fluoride
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42029364
      reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."
      explanation: >-
        Early-life toothbrushing with fluoridated toothpaste (OR 1.97, P = .019)
        predicted dental fluorosis in the primary dentition.
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."
    explanation: >-
      Identifies early-life toothbrushing with fluoridated toothpaste (OR 1.97,
      P = .019) as a significant predictor of dental fluorosis in a twin cohort.

- name: Short exclusive breastfeeding duration (<6 months)
  description: >-
    Exclusive breastfeeding for less than 6 months is an independent early-life
    dietary and infant-feeding risk factor associated with increased risk of
    dental fluorosis in the primary dentition.
  notes: >-
    Shorter exclusive breastfeeding duration (OR 2.51, P = .015) is a
    behavioral/nutritional feeding exposure rather than a direct chemical agent,
    modifying early-life systemic fluoride intake during infant amelogenesis
    (for example through earlier introduction of water-reconstituted infant
    formula and weaning foods).
  influences_mechanisms:
  - target: Developmental fluoride overexposure during amelogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:42029364
      reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."
      explanation: >-
        Exclusive breastfeeding for less than 6 months (OR 2.51, P = .015)
        predicted dental fluorosis in the primary dentition. Feeding duration is
        not itself a fluoride source, so the link is recorded as predisposing
        rather than triggering.
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Attending a private school (odds ratio [OR], 5.17; P < .001), exclusive breastfeeding for less than 6 months (OR, 2.51; P = .015), and early-life toothbrushing with fluoridated toothpaste (OR, 1.97; P = .019) were predictors of the condition."
    explanation: >-
      Identifies exclusive breastfeeding for less than 6 months (OR 2.51, P =
      .015) as an independent predictor of dental fluorosis in the primary
      dentition.

diagnosis:
- name: Clinical dental examination with Thylstrup-Fejerskov or Dean's Fluorosis Index
  description: >-
    Diagnosis and severity grading of dental fluorosis rely on visual inspection
    of cleaned, dried teeth to assess symmetric enamel opacities, striations,
    staining, and pitting across homologous teeth using validated clinical scales
    such as the Thylstrup-Fejerskov index (0 to 9) or Dean's Fluorosis Index.
  diagnosis_term:
    preferred_term: dental examination
    term:
      id: NCIT:C158323
      label: Dental Examination
  results: >-
    Bilateral symmetric diffuse white striations, chalky opacity, yellow-brown
    staining, or surface pitting scored on the Thylstrup-Fejerskov (0-9) or
    Dean's index.
  evidence:
  - reference: PMID:42029364
    reference_title: "Genetic and environmental contributions to dental fluorosis in the primary dentition: A census-based twin study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DF was diagnosed using the Thylstrup-Fejerskov index"
    explanation: >-
      Supports clinical diagnosis and severity scoring of dental fluorosis using
      the Thylstrup-Fejerskov index.
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dean’s DF index was used in most studies (36, 46, 47), and the Chinese national standard of DF was used in one study"
    explanation: >-
      Supports clinical grading of dental fluorosis using Dean's Fluorosis Index.

- name: Urinary fluoride concentration measurement
  description: >-
    Measurement of urinary fluoride concentration (typically via a fluoride
    ion-selective electrode) provides an objective biomarker of recent and
    chronic systemic fluoride exposure that correlates with dental fluorosis
    prevalence and severity.
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  results: >-
    Elevated urinary fluoride concentration positively correlated with the
    presence and severity of dental fluorosis.
  markers: urinary fluoride
  evidence:
  - reference: PMID:26499132
    reference_title: "Prevalence of Brick Tea-Type Fluorosis in the Tibet Autonomous Region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Samples of drinking water, brick tea, brick tea infusion (or buttered tea), and urine were collected and measured for fluoride concentrations by the fluoride ion selective electrode method."
    explanation: >-
      Supports measurement of urinary fluoride by ion-selective electrode in
      epidemiologic and clinical evaluation of fluorosis.
  - reference: PMID:39876909
    reference_title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on Spearman correlation analysis, a positive correlation was identified between the urinary fluoride level, the extent of dental fluorosis, and indicators such as BALP, MMP-2, and MMP-9."
    explanation: >-
      Demonstrates that urinary fluoride levels correlate positively with the
      extent of dental fluorosis in children.

differential_diagnoses:
- name: Amelogenesis imperfecta
  description: >-
    Hereditary developmental enamel defect caused by pathogenic variants in
    enamel matrix or protease genes (including AMELX, ENAM, MMP20, KLK4, WDR72,
    and FAM83H) that can present with generalized hypomineralized or hypoplastic
    enamel.
  disease_term:
    preferred_term: amelogenesis imperfecta
    term:
      id: MONDO:0019507
      label: amelogenesis imperfecta
  distinguishing_features:
  - Family history consistent with Mendelian inheritance and pathogenic variants in AMELX, ENAM, MMP20, KLK4, WDR72, or FAM83H
  - Generalized involvement across dentitions without an environmental fluoride exposure history
  evidence:
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lastly, AI, an inherited condition, encompasses diverse phenotypes in enamel development. AI phenotypes, whether hypoplastic or hypomineralised, entail mutations in genes, such as AMELX, ENAM, MMP20, KLK4, WDR72, FAM83H, C4ORF26, amelotin, GPR68, and ACPT. Diagnosing AI involves considering family history and clinical observation."
    explanation: >-
      Distinguishes hereditary amelogenesis imperfecta from environmental dental
      fluorosis by family history and causative gene mutations.

- name: Molar-incisor hypomineralization and enamel hypoplasia
  description: >-
    Non-fluoride developmental defects of enamel including molar-incisor
    hypomineralization (a qualitative demarcation defect of first permanent
    molars and incisors) and quantitative enamel hypoplasia.
  distinguishing_features:
  - Molar-incisor hypomineralization is restricted to first permanent molars and variably permanent incisors with demarcated rather than diffuse homologous opacities
  - Enamel hypoplasia is a quantitative secretory-stage defect of reduced enamel thickness rather than diffuse subsurface hypomineralization from chronic fluoride intake
  evidence:
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MIH, a qualitative enamel defect, occurs during the mineralisation and maturation phases, affecting first permanent molars and eventually incisors."
    explanation: >-
      Characterizes molar-incisor hypomineralization as a key developmental
      enamel defect in the differential diagnosis of dental fluorosis.
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Enamel hypoplasia, a quantitative defect, manifests in any tooth during enamel matrix secretion."
    explanation: >-
      Distinguishes quantitative enamel hypoplasia from qualitative fluorotic
      hypomineralization.

- name: Celiac disease-related enamel defects
  description: >-
    Symmetric developmental enamel defects (hypomineralization or pitting)
    secondary to malabsorption and immune-mediated disruption during tooth
    development in children with celiac disease.
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  distinguishing_features:
  - Associated with celiac serology, gastrointestinal or extraintestinal malabsorption features, and absence of excess fluoride exposure
  evidence:
  - reference: PMID:38592254
    reference_title: "Celiac Disease-Related Enamel Defects: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other differential diagnoses of DED include enamel hypoplasia, fluorosis, amelogenesis imperfecta, and localized trauma/infection."
    explanation: >-
      Explicitly places dental fluorosis in the differential diagnosis of celiac
      disease-related developmental enamel defects.


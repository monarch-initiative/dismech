  - target: Enamel hypomineralization and opacity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: DOI:10.3389/fcell.2023.1168215
    reference_title: "Advances in epidemiological status and pathogenesis of dental fluorosis"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This results in the abnormal development of enamel, which involves physiological processes such as endoplasmic reticulum stress, oxidative stress, mitochondrial damage, DNA damage, and apoptosis."
    explanation: >-
      Synthesizes the cellular stress pathways—endoplasmic reticulum stress,
      oxidative stress, mitochondrial damage, and DNA damage—through which
      excess fluoride disrupts ameloblast-mediated enamel development.

- name: Ameloblast apoptosis
  description: >-
    Sustained fluoride-induced cellular stress and adaptive autophagy signaling
    activate the caspase cascade in ameloblasts, driving ameloblast apoptosis
    and depleting the functional enamel-forming cell population during
    amelogenesis.
  biological_scale: CELLULAR
  cell_types:

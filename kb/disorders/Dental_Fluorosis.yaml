classifications:
  harrisons_chapter:
  - classification_value: ENVIRONMENTAL_EXPOSURES
description: >-
  Dental fluorosis is a developmental enamel disorder caused by chronic excess
  fluoride exposure during tooth formation, producing dose-dependent enamel
  hypomineralization with white striations, opacity, staining, and in severe
  cases pitting and surface breakdown.

notes: >-
  This curation covers secretory- and maturation-stage developmental enamel
  mechanisms (amelogenin retention, KLK4 suppression, ion transport disruption,
  and ameloblast iron storage and ferritin deficiency), host genetic
  susceptibility modifiers alongside environmental fluoride sources (drinking
  water, brick tea, indoor coal-burning pollution, early-life fluoridated
  toothpaste ingestion, and short exclusive breastfeeding duration), clinical
  grading and urinary/serum biomarker evaluation, differential diagnosis of
  developmental enamel defects, and preventive, dietary, and conservative
  esthetic management. In endemic water-borne, brick tea, and coal-burning
  fluorosis settings, dental fluorosis frequently co-occurs with skeletal
  fluorosis (see kb/disorders/Skeletal_Fluorosis.yaml, MONDO:0018229); in the
  northern Tanzania endemic cohort (PMID:38135514), dental fluorosis was
  present in all individuals with skeletal fluorosis and at higher
  Thylstrup-Fejerskov Index grades than in the general population.

progression:
- phase: Childhood amelogenesis susceptibility window
  age_range: Birth to 12 years
  notes: >-
    Systemic fluoride overexposure causes dental fluorosis only when it occurs
    during active ameloblast development and tooth mineralization; individuals
    exposed only after age 12 years generally do not develop dental fluorosis
    because dental germ ameloblast development is complete.
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Such patients may also have DF, whereas those exposed to excess fluoride after 12 years of age may not have DF since the development of ameloblasts in the dental germ is finished by that age."
    explanation: >-
      Establishes the developmental window of susceptibility prior to age 12
      years when dental germ amelogenesis is active.

pathophysiology:
- name: Developmental fluoride overexposure during amelogenesis
  description: >-
    Dental fluorosis arises when systemic fluoride exposure exceeds the narrow
    developmental tolerance of enamel-forming teeth during amelogenesis,
    especially during childhood tooth formation. Higher fluoride in drinking
    water is associated with sharply increased fluorosis risk, and children in
    actively growing developmental stages appear more vulnerable to retention of
    systemic fluoride in mineralizing tissues.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: biomineral tissue development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: ABNORMAL
  downstream:
  - target: Secretory-stage amelogenin retention and delayed enamel mineralization
    causal_link_type: DIRECT
  - target: Maturation-stage ameloblast dysfunction with KLK4 suppression
    causal_link_type: DIRECT
  - target: Ion transport dysregulation during enamel maturation
    causal_link_type: DIRECT
  - target: Ameloblast iron storage and ferritin deficiency
    causal_link_type: DIRECT
  - target: Ameloblast endoplasmic reticulum stress and oxidative stress
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41466045
    reference_title: "Optimal fluoride concentration in drinking water for balancing dental caries prevention and fluorosis control in Jinan, China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each 1 mg/L increase in fluoride concentration was associated with a 1,246% (OR: 13.46, 95%CI: 8.30, 21.84) increase in the risk of dental fluorosis"
    explanation: >-
      Supports an exposure-response relationship between higher fluoride in
      drinking water and dental fluorosis risk in children.
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings demonstrate that younger mice are more vulnerable to fluoride-induced enamel defects due to lower clearance than mature mice."
    explanation: >-
      Supports developmental-stage vulnerability to fluoride toxicity during
      active enamel formation.

- name: Secretory-stage amelogenin retention and delayed enamel mineralization
  description: >-
    During the secretory phase of amelogenesis, excessive fluoride increases
    binding to enamel amelogenin and elevates retained organic matrix substances
    in developing enamel, compromising hydroxyapatite crystal growth in
    homologous teeth and contributing to enamel hypomineralization.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:

    reference_title: "Correlation between dental fluorosis risk and bone-specific alkaline phosphatase, osteocalcin, matrix metalloproteinase and parathyroid hormone in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the urinary fluoride level and the extent of dental fluorosis increased, there was a gradual elevation in serum BALP, MMP-2, and MMP-9 levels in children, while OC and PTH levels gradually decreased (P<0.05)."
    explanation: >-
      Shows progressive serum BALP elevation with increasing urinary fluoride
      and dental fluorosis severity in children.

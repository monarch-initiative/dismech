    snippet: "Later, in the maturation period, the regulation of ameloblast modulation is disrupted by superfluous fluoride, and the mineralization of the enamel is disrupted, leading to hypomineralization and DF"
    explanation: >-
      Directly links excess fluoride during the maturation stage to disrupted
      ameloblast modulation and impaired enamel mineralization in dental
      fluorosis.
  - reference: PMID:41294875
    reference_title: "Enamel Maturation as a Systems Physiology: Ion Transport and Pi Flux."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disruption of phosphate handling reduces crystal growth and final mineral content of enamel, and produces hypomineralized or hypomature enamel with opacities, post-eruptive breakdown, and greater caries susceptibility."
    explanation: >-
      Provides general systems-physiology background on how disrupted
      maturation-stage phosphate and ion flux impairs enamel crystal growth and
      mineral content, contextualizing the maturation-stage mineralization
      defect in dental fluorosis.

- name: Ameloblast iron storage and ferritin deficiency
  description: >-
    Fluoride disrupts iron handling in maturation-stage ameloblasts, with ferritin
    heavy chain emerging as a preferential molecular target. Reduced iron storage
    is associated with reduced iron oxides in enamel and
    altered enamel ultrastructure and mechanical properties.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  genes:

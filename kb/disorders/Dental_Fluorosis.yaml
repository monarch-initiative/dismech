      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: DIRECT
  evidence:
  - reference: DOI:10.3389/fcell.2023.1168215
    reference_title: "Advances in epidemiological status and pathogenesis of dental fluorosis"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To mitigate this damage, autophagy is activated, initiating an adaptive defense response, and inducing ameloblast apoptosis by activating the caspase pathway ( Suzuki et al., 2015)."
    explanation: >-
      Documents caspase-pathway-mediated ameloblast apoptosis in response to
      fluoride-induced cellular stress during enamel development.
  - reference: DOI:10.3389/fcell.2023.1168215
    reference_title: "Advances in epidemiological status and pathogenesis of dental fluorosis"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This results in the abnormal development of enamel, which involves physiological processes such as endoplasmic reticulum stress, oxidative stress, mitochondrial damage, DNA damage, and apoptosis."
    explanation: >-
      Links ameloblast apoptosis directly to abnormal enamel development in
      dental fluorosis.

- name: Enamel hypomineralization and opacity
  description: >-
    The downstream structural consequence of fluoride toxicity is incompletely
    mineralized enamel with chalky white opacity, yellow-brown discoloration,
    altered hardness, and, in more severe cases, surface pitting and breakdown
    after eruption.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: tooth mineralization
    term:
      id: GO:0034505
      label: tooth mineralization
    modifier: DECREASED
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization
    causal_link_type: DIRECT
  - target: Yellow-brown tooth discoloration
    causal_link_type: DIRECT
  - target: Post-eruptive enamel surface breakdown
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The typical histological feature of DF is the low mineralization rate of the enamel, which becomes fragile, easily eroded, and exfoliated."
    explanation: >-
      Directly establishes reduced enamel mineralization and resulting enamel
      fragility and erosion as the core histological feature of human dental
      fluorosis.
  - reference: PMID:41623091
    reference_title: "Minimally Invasive Treatments for Dental Fluorosis: A Network Meta-Analysis of Esthetic Masking Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dental fluorosis produces enamel opacities and discolorations that compromise esthetics and often require minimally invasive treatments."
    explanation: >-
      Confirms in human clinical studies that dental fluorosis produces enamel
      opacities and discolorations.
  - reference: PMID:38135514
    reference_title: "Prevalence of Skeletal Fluorosis in Northern Tanzania: A Follow-Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DF causes marked pitting1 and discoloration8 of the teeth. Although changes are largely cosmetic, the teeth become brittle and mastication difficulties may arise.18"
    explanation: >-
      Human epidemiological evidence confirming enamel discoloration, pitting,
      and brittleness in endemic dental fluorosis.
  - reference: PMID:41361113
    reference_title: "Developmental vulnerability to fluoride toxicity: enamel and clearance differences in adolescent versus mature mice"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adolescent mice developed pronounced dental fluorosis, characterized by chalky white incisors, elevated Quantitative Light-induced Fluorescence (QLF) values, reduced enamel microhardness, and lower enamel mineral density (EMD)."
    explanation: >-
      Corroborates the structural fluorosis phenotype of opaque, softer, lower
      mineral-density enamel in an adolescent mouse model.

phenotypes:
- name: Enamel hypomineralization
  category: Dental
  description: >-
    Fluorosed enamel is incompletely mineralized, softer than normal enamel, and
    clinically presents with cloudy white or chalky lines, spots, or diffuse
    opacity across homologous teeth that mineralized during the period of excess
    fluoride intake.
  phenotype_term:
    preferred_term: Enamel hypomineralization
    term:
      id: HP:0006285
      label: Enamel hypomineralization
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The typical histological feature of DF is the low mineralization rate of the enamel, which becomes fragile, easily eroded, and exfoliated."
    explanation: >-
      Directly establishes reduced enamel mineralization as the defining
      histological feature of human dental fluorosis.
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms of DF include cloudy white or chalky lines, spots, or marks on teeth, yellow or brown discoloration, surface irregularities, and visible pits in tooth enamel."
    explanation: >-
      Captures the characteristic cloudy white or chalky enamel lines, spots,
      and opacities produced by hypomineralized fluorotic enamel.
  - reference: PMID:41623091
    reference_title: "Minimally Invasive Treatments for Dental Fluorosis: A Network Meta-Analysis of Esthetic Masking Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

      id: GO:0097186
      label: amelogenesis
    modifier: ABNORMAL
  - preferred_term: enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  locations:
  - preferred_term: enamel
    term:
      id: UBERON:0001752
      label: enamel
  downstream:
  - target: Enamel hypomineralization and opacity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36583212
    reference_title: "Brick tea consumption and its relationship with fluorosis in Tibetan areas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Excessive fluoride binds more enamel amelogenin and increases enamel organic substances in the secretory phase of enamel formation, thereby leading to hypomineralization and DF"
    explanation: >-
      Supports fluoride-enhanced amelogenin binding and organic matrix retention
      during the secretory stage of enamel development.
  - reference: PMID:39321764
    reference_title: "Developmental Defects of Enamel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dental fluorosis, a toxicological concern from chronic and excessive fluoride exposure, affects ameloblasts and compromises crystal growth of the homologous teeth during enamel development."
    explanation: >-
      Confirms that chronic fluoride exposure compromises ameloblast-mediated
      enamel crystal growth in homologous developing teeth.

- name: Maturation-stage ameloblast dysfunction with KLK4 suppression
  description: >-
    Excess fluoride disrupts ameloblast structure and cyclic modulation during
    enamel maturation and suppresses KLK4 expression in maturation-stage
    ameloblasts. Reduced KLK4 is consistent with impaired enamel matrix protein
    clearance and retention of protein within developing enamel, contributing
    to aprismatic, hypomineralized enamel.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ameloblast
    term:
      id: CL:0000059
      label: ameloblast

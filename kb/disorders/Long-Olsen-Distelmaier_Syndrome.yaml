    snippet: "Our study establishes de novo missense variants in RRAGC as cause of an early-onset mTORopathy with unfavorable prognosis."
    explanation: Three unrelated infants with heterozygous de novo RRAGC variants.
  - reference: PMID:27234373
    reference_title: "De novo RRAGC mutation activates mTORC1 signaling in syndromic fetal dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An unreported de novo S75Y mutation was discovered in RRAGC, encoding Ras-related GTP binding C, an essential GTPase in nutrient-activated mechanistic target of rapamycin complex 1 (mTORC1) signaling."
    explanation: Index case, de novo heterozygous variant found by trio exome sequencing.
pathophysiology:
- name: RagC Gain-of-Function Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous de novo missense substitutions in the RagC nucleotide-binding
    domain (p.Ser75Tyr in the P-loop, p.Thr90Asn, p.Trp115Arg, p.Pro118Leu).
    Modelling of p.Ser75Tyr predicts disrupted nucleotide contacts and a shift
    toward the GDP-bound (active) RagC state. The same residues are somatic
    gain-of-function hotspots in follicular lymphoma.

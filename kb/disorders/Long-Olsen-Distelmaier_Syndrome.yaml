- name: Amino-Acid-Insensitive mTORC1 Signaling
  biological_scale: CELLULAR
  conforms_to: "mtorc1_hyperactivation#Constitutive mTORC1 Hyperactivation"
  description: >-
    mTORC1 remains partly active and lysosome-associated after amino-acid
    withdrawal, with increased p70S6K and S6 phosphorylation. Unlike the
    module's canonical lesions, the driver here is an activated positive
    regulator (RagC) rather than loss of a negative regulator, and the gain in
    S6K signalling in patient fibroblasts is modest.
  genes:

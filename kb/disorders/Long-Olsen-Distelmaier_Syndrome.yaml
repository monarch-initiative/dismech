discussions:
- discussion_id: extracardiac_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Abnormal Forebrain Development
  - phenotypes#Hepatopathy
  - phenotypes#Bilateral congenital cataract
  prompt: >-
    Do the brain, liver and lens features arise through the same TFEB
    retention that drives the cardiomyopathy, through mTORC1 kinase
    activation, or secondarily to heart failure?
  rationale: >-
    Mechanistic work on RRAGC variants covers fibroblasts, HEK293 cells and
    cardiomyocytes only. Hepatopathy could be primary or congestive, and no
    neural progenitor or lens study exists, so the extracardiac edges in this
    entry carry clinical association evidence only.
notes: >-
  Five patients with germline RRAGC variants are described in the cited
  literature (the Long et al. index case, three in Reijnders et al., and a 2026
  case report); no prevalence estimate exists. Death in infancy from
  refractory heart failure is the usual outcome. The 2026 p.Trp115Arg case
  also had a small ventricular septal defect, patent ductus arteriosus and
  bicuspid aortic valve, not recorded as phenotypes because they are reported
  in a single child of consanguineous parents. Gain-of-function RRAGD
  variants cause a separate disorder with hypomagnesemia and cardiomyopathy
  that is curated separately.

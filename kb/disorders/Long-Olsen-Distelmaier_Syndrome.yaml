    modifier: DECREASED
  evidence:
  - reference: PMID:37057673
    reference_title: "De novo missense variants in RRAGC lead to a fatal mTORopathy of early childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, subcellular localization of mTOR was decoupled from metabolic state."
    explanation: Patient fibroblasts (p.Thr90Asn) and HEK293 cells expressing each variant.
  - reference: PMID:37057673
    reference_title: "De novo missense variants in RRAGC lead to a fatal mTORopathy of early childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The above results are in line with a constitutive overactivation of the mTORC1 pathway."
    explanation: Authors' conclusion from the fibroblast and HEK293 studies.
  - reference: PMID:34071043
    reference_title: "TFEB Overexpression, Not mTOR Inhibition, Ameliorates RagC(S75Y) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with the GOF hypothesis of the S75Y variant, we found hyperactive mTORC1 signaling as indicated by significantly higher phosphorylation levels of p70S6 kinase (P-p70S6K) and ribosomal protein S6 (P-S6) in S75Y-overexpressed NRVCMs when compared to GFP-infected control cells"
    explanation: Same effect in neonatal rat ventricular cardiomyocytes.
  downstream:
  - target: Cellular Hypertrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Increased cell size accompanies mTORC1 activation, but in cardiomyocytes
      mTOR inhibition did not normalize cell size, so this branch is contested.
    evidence:
    - reference: PMID:37057673
      reference_title: "De novo missense variants in RRAGC lead to a fatal mTORopathy of early childhood."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Studies of patient-derived fibroblasts carrying the p.(Thr90Asn) variant revealed increased cell size, as well as dysregulation of mTOR-related p70S6K (ribosomal protein S6 kinase 1) and transcription factor EB signaling."
      explanation: Co-occurrence of larger cells and altered mTORC1 output; causation not tested.
    - reference: PMID:34071043
      reference_title: "TFEB Overexpression, Not mTOR Inhibition, Ameliorates RagC(S75Y) Cardiomyopathy."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: "Surprisingly, we found 24-hour treatment with mTOR inhibitors, including rapamycin and torin, failed to normalize the enlarged cell size in S75Y NRVCMs, despite drastic inhibition of mTORC1 activity as indicated by P-S6 expression"
      explanation: Suppressing mTORC1 output did not reverse the cardiomyocyte hypertrophy.
- name: TFEB Cytosolic Retention
  biological_scale: CELLULAR
  description: >-
    TFEB, whose mTORC1-dependent phosphorylation specifically requires
    GDP-loaded RagC/D, stays cytosolic in fed and starved mutant cells, and
    TFEB target transcripts fall. In cardiomyocytes this persists under
    rapamycin because mutant RagC binds TFEB directly.

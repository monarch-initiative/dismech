      snippet: "The KI fish manifested cardiomyopathy-like phenotypes and poor survival."
      explanation: Cardiac phenotype of the knock-in.
  - target: Impaired Autophagy-Lysosomal Clearance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Downregulated TFEB-controlled lysosomal genes, reduced LC3-II and glycogen deposition in mutant hearts.
    evidence:
    - reference: PMID:34071043
      reference_title: "TFEB Overexpression, Not mTOR Inhibition, Ameliorates RagC(S75Y) Cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to the cell culture studies, transcript levels of several TFEB-controlled lysosome genes were downregulated in the rragc KI fish hearts (Figure 5A), suggesting a reduced TFEB activity."

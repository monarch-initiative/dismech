  - reference: PMID:37057673
    reference_title: "De novo missense variants in RRAGC lead to a fatal mTORopathy of early childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 de novo missense variants in RRAGC (NM_022157.4: c.269C>A, p.(Thr90Asn), c.353C>T, p.(Pro118Leu), and c.343T>C, p.(Trp115Arg)), which were previously reported as occurring somatically in follicular lymphoma."
    explanation: The three variants of the defining cohort and their overlap with lymphoma hotspots.
  - reference: PMID:27234373
    reference_title: "De novo RRAGC mutation activates mTORC1 signaling in syndromic fetal dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "In silico protein modeling and molecular dynamics simulation predicted the mutation to disrupt ligand interactions and increase the GDP-bound state."
    explanation: Structural prediction for p.Ser75Tyr; not measured biochemically.
  - reference: PMID:38987251
    reference_title: "Ragopathies and the rising influence of RagGTPases on human diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "More recently, an extensive study based on genomic sequencing in children with dilated cardiomyopathy identified several germline mutations in the RRAGC gene affecting amino acids Ser75, Thr90, Tyr115, and Pro118, which are located within the nucleotide-binding domain."
    explanation: Review placing the germline variants in the nucleotide-binding domain. The review writes Tyr115; the primary report gives p.Trp115Arg.
  downstream:

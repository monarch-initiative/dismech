- name: RagC T89N and S74C knock-in mice
  species: Mus musculus
  genotype: Rragc T89N/+ or S74C/+ (corresponding to human T90N and S75C)
  publication: PMID:31579886
  modeled_mechanisms:
  - target: Amino-Acid-Insensitive mTORC1 Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Endogenous-locus knock-in at the residue mutated in the p.Thr90Asn
      patient (mouse T89N) gives partial mTORC1 resistance to amino-acid
      withdrawal in B cells, and partially penetrant lethality before weaning.
    limitations: >-
      Built to study follicular lymphoma; signalling was measured in B cells
      and no cardiac, brain, liver or lens characterization of the
      heterozygous animals is reported.
    evidence:
    - reference: PMID:31579886
      reference_title: "Oncogenic Rag GTPase signaling enhances B cell activation and drives follicular lymphoma sensitive to pharmacological inhibition of mTOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RagCS74C/+ and RagCT89N/+ mice were obtained with sub-Mendelian ratios (Supplementary Figure 1c and 1d), suggesting that partially penetrant lethality occurs before weaning."
      explanation: Germline heterozygous knock-in at the same residue causes partial pre-weaning lethality.
    - reference: PMID:31579886
      reference_title: "Oncogenic Rag GTPase signaling enhances B cell activation and drives follicular lymphoma sensitive to pharmacological inhibition of mTOR."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "RRAGC mutations, targeted to the endogenous locus in mice, confer a partial insensitivity to nutrient deprivation, but strongly exacerbate B cell responses and accelerate lymphomagenesis, while creating a selective vulnerability to pharmacological inhibition of mTORC1."
      explanation: Signalling effect of the knock-in alleles.

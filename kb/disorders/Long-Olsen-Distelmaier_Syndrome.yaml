    snippet: "Similarly, haploinsufficiency of mtor failed to exert therapeutic effect on the rragc KI model, as indicated by persistent cardiac pump dysfunction, unchanged cardiomyopathy marker expression, impaired growth, and reduced survival in double mutants"
    explanation: Genetic mTOR reduction did not rescue the fish cardiomyopathy.
- name: TFEB activation (preclinical)
  description: >-
    Cardiomyocyte-specific TFEB overexpression restored nuclear TFEB,
    autophagic flux, ejection fraction and survival in the zebrafish model.
    The rescue was a germline cardiomyocyte transgene in fish, not an
    administered therapy, and no pharmacological TFEB activator has been
    tested.
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: TFEB Cytosolic Retention
    description: Supplies excess TFEB so that some reaches the nucleus despite RagC binding.
    evidence:
    - reference: PMID:34071043
      reference_title: "TFEB Overexpression, Not mTOR Inhibition, Ameliorates RagC(S75Y) Cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Importantly, TFEB overexpression resulted in more nuclear TFEB and rescued cardiomyopathy phenotypes."
      explanation: Transgenic rescue in fish.
  evidence:
  - reference: PMID:34071043
    reference_title: "TFEB Overexpression, Not mTOR Inhibition, Ameliorates RagC(S75Y) Cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The overall survival of rragc KI;Tg(tfeb) fish was significantly improved compared to rragc KI mutants (Figure 7F), despite marginal effect on bodyweight (Figure S5B)."
    explanation: Survival benefit in the model only.
- name: Genetic counseling
  description: >-
    All reported cases with parental testing arose de novo, which bears on
    recurrence counselling for parents.
  therapeutic_modality: BEHAVIORAL

genetic:
- name: RRAGC
  gene_term:
    preferred_term: RRAGC
    term:
      id: hgnc:19902
      label: RRAGC
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  notes: >-
    Reported germline alleles (NM_022157.4) are c.224C>A p.(Ser75Tyr),
    c.269C>A p.(Thr90Asn), c.343T>C p.(Trp115Arg) (in two unrelated infants)
    and c.353C>T p.(Pro118Leu), all heterozygous missense changes in the
    nucleotide-binding domain. Thr90Asn, Trp115Arg and Pro118Leu were
    previously reported as somatic follicular lymphoma variants; RRAGC is
    mutated in 9-17% of follicular lymphomas. No ClinGen gene-disease
    validity record for RRAGC was found in the local cache.
  variants:
  - name: c.224C>A p.(Ser75Tyr)
    description: De novo P-loop variant in the index fetus with syndromic DCM, bilateral cataracts and facial dysmorphism.
    evidence:
    - reference: PMID:27234373
      reference_title: "De novo RRAGC mutation activates mTORC1 signaling in syndromic fetal dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An unreported de novo S75Y mutation was discovered in RRAGC, encoding Ras-related GTP binding C, an essential GTPase in nutrient-activated mechanistic target of rapamycin complex 1 (mTORC1) signaling."
      explanation: Variant discovery.
  - name: c.343T>C p.(Trp115Arg)
    description: >-
      De novo in the Reijnders cohort; reported again in a male infant of
      consanguineous parents with fatal DCM at two months (parental testing not
      documented), classified likely pathogenic by the diagnostic laboratory.
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:42793000
      reference_title: "Rapidly Progressive Infantile Dilated Cardiomyopathy in Long-Olsen-Distelmaier Syndrome Associated with RRAGC NM_022157.4:c.343T>C, p.(Trp115Arg): A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Accordingly, the contemporaneous clinical WES record documented a heterozygous RRAGC c.343T>C, p.(Trp115Arg) variant, reported by the diagnostic laboratory as likely pathogenic."
      explanation: Second independent report of the allele.
  evidence:
  - reference: PMID:37057673
    reference_title: "De novo missense variants in RRAGC lead to a fatal mTORopathy of early childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 3 de novo missense variants in RRAGC (NM_022157.4: c.269C>A, p.(Thr90Asn), c.353C>T, p.(Pro118Leu), and c.343T>C, p.(Trp115Arg)), which were previously reported as occurring somatically in follicular lymphoma."
    explanation: Defining cohort.
  - reference: PMID:38987251
    reference_title: "Ragopathies and the rising influence of RagGTPases on human diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Somatic mutations in RRAGC have been identified in 9 to 17% of patients with follicular lymphoma"
    explanation: Somatic frequency of RRAGC mutation in follicular lymphoma, for the shared-hotspot note.
animal_models:
- name: rragc S56Y knock-in zebrafish
  species: Danio rerio
  genotype: rragc S56Y (orthologous to human RagC S75Y) TALEN knock-in
  publication: PMID:34071043
  modeled_mechanisms:
  - target: Ventricular Dilation and Systolic Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced ejection fraction, ventricular remodeling and reduced survival in adult fish.

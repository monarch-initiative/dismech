name: Long-Olsen-Distelmaier Syndrome
creation_date: "2026-10-15T12:30:00Z"
category: Mendelian
synonyms:
- LNGODS
- RRAGC-related mTORopathy
- RRAGC-related syndromic dilated cardiomyopathy
description: >-
  Ultra-rare, early-lethal multisystem disorder caused by heterozygous de novo
  missense variants in RRAGC, which encodes the Rag GTPase RagC. Fetal or
  infantile dilated cardiomyopathy is the defining and usually fatal feature;
  reported children also have hepatopathy, malformations of cortical
  development (pachygyria, polymicrogyria) and septo-optic dysplasia, bilateral
  congenital cataracts, mild facial dysmorphism and, in one case, hypocalcemia
  with hyperphosphatemia. The variants (p.Ser75Tyr, p.Thr90Asn, p.Trp115Arg,
  p.Pro118Leu) sit in the RagC nucleotide-binding domain at residues also
  mutated somatically in follicular lymphoma. They act as gain-of-function
  alleles: mTORC1 signalling becomes partly insensitive to amino-acid
  withdrawal, and RagC binds TFEB more tightly, retaining it in the cytosol and
  reducing TFEB-driven lysosomal and autophagy gene expression. In a zebrafish
  knock-in model the cardiomyopathy is rescued by TFEB overexpression but not
  by mTOR inhibition. The related RRAGD disorder (hypomagnesemia 7 with
  cardiomyopathy) is a separate entity.

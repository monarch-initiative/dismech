differential_diagnoses:
- name: Gordon Syndrome (Distal Arthrogryposis Type 3)
  disease_term:
    preferred_term: Gordon syndrome
    term:
      id: MONDO:0007252
      label: Gordon syndrome
  description: >-
    Autosomal-dominant allelic disorder caused by heterozygous gain-of-function
    PIEZO2 variants (especially p.Arg2686His), sharing camptodactyly, clubfoot,
    and cleft palate with Marden-Walker syndrome as part of a continuous
    clinical spectrum.
  distinguishing_features:
  - Normal intelligence in Gordon syndrome vs. psychomotor retardation / global developmental delay in Marden-Walker syndrome
  - Absence of the classic immobile mask-like facies with pronounced blepharophimosis and Dandy-Walker / posterior fossa malformations typical of MWS
  evidence:
  - reference: PMID:24726473
    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of GS overlaps with distal arthrogryposis type 5 (DA5) and Marden-Walker syndrome (MWS)."
    explanation: >-
      Demonstrates that Gordon syndrome, DA5, and MWS are allelic dominant
      PIEZO2 disorders with overlapping phenotypes.
  - reference: PMID:36588752
    reference_title: "Further Evidence of a Continuum in the Clinical Spectrum of Dominant PIEZO2-Related Disorders and Implications in Cerebellar Anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the PIEZO family member 2 (PIEZO2) gene are known to cause Gordon syndrome (GS), Marden-Walker syndrome (MWS), and distal arthrogryposis type 5 (DA5). Out of these, MWS has a recognizable phenotype that can be discerned easily, but the distinction between GS and DA5 is less evident."
    explanation: >-
      Highlights that MWS is clinically distinguishable from Gordon syndrome and
      DA5 within the dominant PIEZO2 continuum.
- name: Distal Arthrogryposis Type 5
  disease_term:
    preferred_term: Distal arthrogryposis type 5
    term:
      id: MONDO:0007158
      label: arthrogryposis- oculomotor limitation-electroretinal anomalies syndrome
  description: >-
    Autosomal-dominant allelic PIEZO2 gain-of-function disorder characterized by
    distal congenital contractures, ophthalmoplegia/oculomotor limitation,
    ptosis, blepharophimosis, and restrictive lung disease.
  distinguishing_features:
  - Prominent extraocular movement limitation (ophthalmoplegia) and generally preserved cognitive development in DA5
  - Global psychomotor disability, mask-like facies, micrognathia, cleft palate, and frequent central nervous system anomalies in MWS
  evidence:
  - reference: PMID:24726473
    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, although GS, DA5, and MWS have traditionally been considered separate disorders, our findings indicate that they are etiologically related and perhaps represent variable expressivity of the same condition."
    explanation: >-
      Establishes DA5 as a key allelic differential diagnosis in the dominant
      PIEZO2 spectrum alongside Gordon syndrome and MWS.
- name: Distal Arthrogryposis with Impaired Proprioception and Touch (Recessive PIEZO2 Deficiency)
  disease_term:
    preferred_term: arthrogryposis, distal, with impaired proprioception and touch
    term:
      id: MONDO:0014941
      label: arthrogryposis, distal, with impaired proprioception and touch
  description: >-
    Autosomal-recessive disorder caused by biallelic loss-of-function variants
    in PIEZO2, presenting with congenital contractures, perinatal respiratory
    distress, distal lower-limb muscular atrophy, scoliosis, and impaired
    proprioception.
  distinguishing_features:
  - Autosomal-recessive biallelic N-terminal/central truncating loss-of-function PIEZO2 variants rather than heterozygous C-terminal gain-of-function missense variants
  - Absent proprioception and mild distal sensory involvement without the mask-like blepharophimosis-micrognathia-cleft palate gestalt of MWS
  evidence:
  - reference: PMID:27843126
    reference_title: "Biallelic Loss of Proprioception-Related PIEZO2 Causes Muscular Atrophy with Perinatal Respiratory Distress, Arthrogryposis, and Scoliosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a recessively inherited PIEZO2-related disease and demonstrate that depending on the type of mutation and the mode of inheritance, PIEZO2 causes clinically distinguishable phenotypes."
    explanation: >-
      Demonstrates that recessive loss-of-function PIEZO2 deficiency produces a
      clinically distinguishable arthrogryposis phenotype from dominant MWS.

      interpretation: >-
        Dietary supplementation with the omega-3 polyunsaturated fatty acid
        eicosapentaenoic acid (EPA) partially prevents joint malformations in
        gain-of-function Piezo2 mice.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT

      label: sensory neuron
  evidence:
  - reference: PMID:23487782
    reference_title: "Gain-of-function mutations in the mechanically activated ion channel PIEZO2 cause a subtype of Distal Arthrogryposis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "both E2727del and I802F mutations cause the PIEZO2-dependent, mechanically activated currents to recover faster from inactivation, while E2727del also causes a slowing of inactivation."
    explanation: >-
      Coste et al. show by patch-clamp electrophysiology that the
      disease-causing PIEZO2 variants alter channel inactivation kinetics, the
      proximate molecular defect.
  - reference: PMID:23487782
    reference_title: "Gain-of-function mutations in the mechanically activated ion channel PIEZO2 cause a subtype of Distal Arthrogryposis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further show that overexpression of mutated PIEZO2 cDNAs does not cause constitutive activity or toxicity to cells, indicating that the observed phenotype is likely due to a mechanotransduction defect."
    explanation: >-
      The same study establishes that the mechanism is altered mechanotransduction
      gain rather than constitutive channel opening or cytotoxicity.
  - reference: PMID:30988732
    reference_title: "Mutations in PIEZO2 contribute to Gordon syndrome, Marden-Walker syndrome and distal arthrogryposis: A bioinformatics analysis of mechanisms."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Piezo type mechanosensitive ion channel component 2 (PIEZO2) is a mechanically activated ion channel. Mutations in PIEZO2 may cause distal arthrogryposis 3 (DA3)/Gordon syndrome (GS), DA5, Marden-Walker syndrome (MWS) and associated diseases."
    explanation: >-
      Confirms the molecular identity of PIEZO2 as the mechanically activated
      ion channel whose gain-of-function variants underlie MWS.
  - reference: PMID:36634173
    reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that expression of a gain-of-function PIEZO2 mutation in proprioceptive sensory neurons that mainly innervate muscle spindles and tendons is sufficient to induce DA5-like phenotypes in mice. Overactive PIEZO2 causes anatomical defects through increased activity within the peripheral nervous system during postnatal development."
    explanation: >-
      Demonstrates in vivo that excessive PIEZO2 mechanotransduction in
      proprioceptive sensory neurons drives anatomical contracture defects.
  downstream:
  - target: Fetal Akinesia and Congenital Joint Contractures
    description: >-
      Altered PIEZO2 mechanotransduction during development impairs
      movement-dependent musculoskeletal and connective-tissue patterning,
      producing reduced fetal movement and multiple congenital contractures.
    evidence:
    - reference: PMID:23487782
      reference_title: "Gain-of-function mutations in the mechanically activated ion channel PIEZO2 cause a subtype of Distal Arthrogryposis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our studies identify a type of channelopathy and link the dysfunction of mechanically activated ion channels to developmental malformations and joint contractures."
      explanation: >-
        Directly links mechanically activated PIEZO2 ion-channel dysfunction to
        developmental malformations and congenital joint contractures.
  - target: Central Nervous System and Hindbrain Maldevelopment
    description: >-
      Pathogenic PIEZO2 variants and MWS developmental pathology are associated
      with neuronal migration anomalies and posterior cranial fossa structural
      malformations.
    evidence:
    - reference: PMID:36588752
      reference_title: "Further Evidence of a Continuum in the Clinical Spectrum of Dominant PIEZO2-Related Disorders and Implications in Cerebellar Anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The brain MRI of the 2 patients showed Dandy-Walker malformation (DWM). Diffusion tensor imaging visualized anteroposterior and downward aligned thin middle cerebellar peduncle. The association of DWM with arthrogryposis in the presence of PIEZO2 variants remains quite interesting and provides more evidence that PIEZO2 plays a role in the development of hindbrain although the underlying mechanism remains unclear."
      explanation: >-
        Implicates pathogenic PIEZO2 variants in hindbrain development and
        Dandy-Walker malformation in the presence of arthrogryposis.
  - target: Areflexia
    description: >-
      Aberrant proprioceptive and mechanosensory neuron signaling in MWS is
      associated with absent deep tendon reflexes on neurological examination.
    evidence:
    - reference: PMID:7506965
      reference_title: "Marden-Walker syndrome: a case report and a critical review of the literature."

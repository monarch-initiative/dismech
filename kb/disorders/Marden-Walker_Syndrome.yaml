progression:
- phase: Onset
  age_range: Prenatal / Congenital (in utero fetal hypokinesia and congenital malformations present at birth)
  notes: >-
    In reported clinical cases, manifestations can begin prenatally with feeble
    fetal movements and polyhydramnios within the fetal akinesia/hypokinesia
    deformation sequence, presenting at birth with multiple congenital joint
    contractures, mask-like facies, blepharophimosis, micrognathia, cleft or
    high-arched palate, and central nervous system anomalies, followed in
    infancy and childhood by postnatal growth retardation and psychomotor delay.
  evidence:
  - reference: PMID:8370150
    reference_title: "Marden-Walker syndrome: case report, literature review and nosologic discussion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During pregnancy, there were feeble fetal movements and polyhydramnios."
    explanation: >-
      Documents prenatal clinical onset with feeble fetal movements and
      polyhydramnios during pregnancy.
  - reference: PMID:8370150
    reference_title: "Marden-Walker syndrome: case report, literature review and nosologic discussion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that Marden-Walker syndrome is one of the etiologic possibilities in children with the heterogeneous fetal a(hypo)kinesia deformation sequence (FADS)."
    explanation: >-
      Documents prenatal onset in utero as part of the heterogeneous fetal
      akinesia/hypokinesia deformation sequence.
  - reference: PMID:7506965
    reference_title: "Marden-Walker syndrome: a case report and a critical review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a patient with blepharophimosis, joint contractures, immobile facies, decreased muscular bulk, postnatal growth retardation, developmental delay, micrognathia, cleft palate, camptodactyly, arachnodactyly, pectus, kyphoscoliosis, hypospadias, and absent deep tendon reflexes."
    explanation: >-
      Documents congenital structural features accompanied by postnatal growth
      retardation and developmental delay.
genetic:
- name: PIEZO2 gain-of-function variants
  association: Causative
  gene_term:
    preferred_term: PIEZO2
    term:
      id: hgnc:26270
      label: PIEZO2
  notes: >-
    PIEZO2 encodes a large mechanically activated (mechanosensitive)
    non-selective cation channel. Heterozygous gain-of-function variants
    (clustered toward the C-terminal pore module, e.g., the recurrent
    p.Arg2686His and the in-vitro-characterized E2727del and I802F) underlie a
    spectrum that includes Gordon syndrome (distal arthrogryposis type 3),
    distal arthrogryposis type 5, and Marden-Walker syndrome. PIEZO2 is found in
    only a subset of MWS families, consistent with genetic heterogeneity.
  evidence:
  - reference: PMID:24726473
    reference_title: "Mutations in PIEZO2 cause Gordon syndrome, Marden-Walker syndrome, and distal arthrogryposis type 5."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using molecular inversion probes for targeted sequencing to screen PIEZO2, we found mutations in 24/29 (82%) DA5-affected families and one of two MWS-affected families."
    explanation: >-
      McMillin et al. establish PIEZO2 (piezo-type mechanosensitive ion channel
      component 2) as the causal gene in a subset of MWS families within the
      Gordon syndrome / DA5 / MWS spectrum.
  - reference: PMID:23487782
    reference_title: "Gain-of-function mutations in the mechanically activated ion channel PIEZO2 cause a subtype of Distal Arthrogryposis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Both types of changes in kinetics result in increased channel activity in response to a given mechanical stimulus, suggesting that Distal Arthrogryposis Type 5 can be caused by gain-of-function mutations in PIEZO2."
    explanation: >-
      Coste et al. demonstrate electrophysiologically that dominant
      disease-causing PIEZO2 variants act by a gain-of-function mechanism
      (increased mechanically activated channel activity), the molecular basis
      shared across the DA3/DA5/MWS spectrum.
  - reference: PMID:41572728
    reference_title: "Expanding the Genotype-Phenotype Correlation of Marden-Walker Syndrome due to PIEZO2 Gene Variants: A Case Report From Brazil."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Marden-Walker syndrome (MWS; OMIM 248700) is an extremely rare congenital disorder characterized by multiple joint contractures, craniofacial dysmorphism, neurological abnormalities, and multisystem involvement. Although historically diagnosed on clinical grounds, only a few cases have been molecularly confirmed. Here, we describe a Brazilian female infant with classic manifestations of MWS, carrying a heterozygous pathogenic variant in the PIEZO2 gene not previously reported in MWS."
    explanation: >-
      Confirms that Marden-Walker syndrome and its classic constellation of
      arthrogryposis and craniofacial anomalies are caused by heterozygous
      pathogenic variants in PIEZO2 in molecularly resolved cases.
pathophysiology:
- name: PIEZO2 Gain-of-Function and Mechanotransduction Defect
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    PIEZO2 is a mechanically activated, non-selective cation channel that
    transduces mechanical force into ionic current in proprioceptive and
    somatosensory neurons. The disease-associated heterozygous variants in the
    dominant PIEZO2 spectrum are gain-of-function: in cellular
    electrophysiology of distal arthrogryposis type 5 alleles (E2727del and
    I802F), PIEZO2-dependent mechanically activated currents recover faster from
    inactivation (with E2727del also slowing inactivation), producing increased
    channel activity in response to a given mechanical stimulus. The effect is
    not constitutive channel opening or cytotoxicity but an altered
    mechanotransduction gain. The node name is shared with the Gordon syndrome
    entry because the molecular lesion is the same.

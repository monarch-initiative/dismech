animal_models:
- name: Gain-of-function Piezo2 E2799del knock-in mouse
  species: Mouse
  genotype: Piezo2 E2799del (equivalent of human PIEZO2 E2727del), Cre-dependent knock-in, heterozygous
  publication: PMID:36634173
  description: >-
    Mouse carrying the mouse equivalent of the human distal arthrogryposis
    type 5 variant E2727del, expressed constitutively or restricted by Cre
    driver to proprioceptive neurons (Pvalb), all sensory neurons (Advillin,
    inducible), or limb mesenchyme (Prrx1). Constitutive and
    proprioceptor-restricted mice develop hindlimb contractures and shortened
    tendons during a postnatal developmental window (between P7 and P21)
    without skeletal muscle histological abnormalities or altered muscle fiber
    diameters, whereas mesenchyme-restricted mice do not. Intramuscular
    botulinum toxin injected into the hindlimb at postnatal days 7 to 10, or a
    maternal/postnatal diet enriched in eicosapentaenoic acid (EPA), which
    accelerates PIEZO2 inactivation, reduced the tendon and joint defects.
  modeled_mechanisms:
  - target: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows that gain-of-function PIEZO2 acting in proprioceptive sensory
      neurons, and not in Prrx1-Cre limb mesenchyme, is sufficient to induce
      shortened tendons and joint contractures via local efferent exocytosis at
      sensory nerve endings.
    limitations: >-
      Models a distal arthrogryposis type 5 allele (E2727del) within the shared
      dominant PIEZO2 spectrum, and the critical developmental window is
      postnatal days 7 to 21 in the mouse, whereas human MWS contractures are
      congenital and MWS is genetically heterogeneous.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The engineered allele is the DA5 variant E2727del (mouse E2799del),
        used as a model of the dominant PIEZO2 gain-of-function arthrogryposis
        spectrum that includes MWS.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The critical window identified is postnatal (P7 to P21) in mice,
        whereas human MWS contractures are congenital and present at birth.
    evidence:
    - reference: PMID:36634173
      reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data suggest that overactive PIEZO2 in sensory neurons, but not in mesenchyme, is sufficient to induce DA5-like phenotypes in vivo."
      explanation: >-
        Cell-type-restricted expression localizes the pathogenic mechanism to
        proprioceptive sensory neurons rather than limb mesenchyme.
  - target: Tendon Shortening and Disrupted Musculoskeletal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces hindlimb tendon shortening without causing skeletal muscle
      histological abnormalities or changes in muscle fiber diameter.
    limitations: >-
      Measured in mouse hindlimbs during postnatal development; tendon length
      has not been directly measured in human MWS patients in the cited
      sources.
    readouts:
    - name: Hindlimb tendon length
      target: Tendon Shortening and Disrupted Musculoskeletal Development
      direction: DECREASED
      interpretation: >-
        Average hindlimb tendon length is significantly reduced in
        gain-of-function Piezo2 mice compared to wild-type littermates.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we observed that the average length of tendons was significantly reduced in GOFconst. mice compared to wild type"
        explanation: >-
          Direct measurement of shortened hindlimb tendons in gain-of-function
          Piezo2 knock-in mice.
  - target: Multiple congenital joint contractures (arthrogryposis)
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces hindlimb joint contractures and demonstrates that local
      intramuscular botulinum toxin injection during the postnatal critical
      window (P7-P10) or maternal/postnatal dietary eicosapentaenoic acid (EPA)
      supplementation rescues or partially prevents the joint and tendon
      defects.
    limitations: >-
      Contractures arise postnatally in the mouse (becoming severe after P21),
      and craniofacial, palatal, and central nervous system malformations of
      human MWS are not among the reported mouse readouts.
    readouts:
    - name: Hindlimb phalange-metacarpal joint angle
      target: Multiple congenital joint contractures (arthrogryposis)
      direction: DECREASED
      interpretation: >-
        Decreased phalange-metacarpal joint angles in hindlimbs quantify the
        joint contracture phenotype.
      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "phalange-metacarpal angles in hindlimbs of GOFconst. mice were significantly decreased compared to wild type mice"
        explanation: >-
          Quantitative joint-angle measurement demonstrating hindlimb
          contractures in gain-of-function Piezo2 mice.
    - name: Joint and tendon defects after intramuscular botulinum toxin
      target: Multiple congenital joint contractures (arthrogryposis)
      direction: RESTORED
      interpretation: >-
        A single intramuscular injection of botulinum toxin (Botox) at

      evidence:
      - reference: PMID:36634173
        reference_title: "Excessive mechanotransduction in sensory neurons causes joint contractures."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Meanwhile, it rescued joint and tendon defects in the hindlimb that received the treatment in GOF Piezo2 mice compared to hindlimb injected with vehicle control"
        explanation: >-
          Demonstrates postnatal rescue of joint and tendon defects by local
          botulinum toxin blockade of sensory-ending exocytosis.
    - name: Joint malformation after maternal dietary eicosapentaenoic acid
      target: Multiple congenital joint contractures (arthrogryposis)

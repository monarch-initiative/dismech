- name: Tendon Shortening and Disrupted Musculoskeletal Development
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    In gain-of-function Piezo2 knock-in mice, average hindlimb tendon length is
    significantly reduced compared to wild-type littermates, and the authors
    propose that shortened tendons drive the joint contractures. Proprioceptive
    nerve-ending morphology in muscle spindles and Golgi tendon organs is intact
    and skeletal muscle fiber diameters are unchanged, indicating that
    overactive PIEZO2 impairs tendon and joint development rather than causing
    primary histological muscle abnormalities. In the mouse model, inducible
    sensory-neuron expression defines a critical postnatal developmental period
    between days 7 and 21 during which excessive mechanotransduction causes
    limb malformation, whereas human MWS contractures are congenital.

biochemical:
- name: Serum alkaline phosphatase
  biomarker_term:
    preferred_term: serum alkaline phosphatase
  notes: >-
    Serum ALP is a useful biomarker across the inherited GPI deficiencies but is
    direction-dependent by branch: markedly elevated (hyperphosphatasia) in the HPMRS
    subgroup, whereas in MCAHS it is typically normal or, in the PIGT/MCAHS3 subtype,
    low. A normal ALP therefore does not exclude a GPI-anchor defect.
  evidence:
  - reference: PMID:39081219
    reference_title: "Inherited glycosylphosphatidylinositol deficiency: a review from molecular and clinical perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the serum level of alkaline phosphatase (ALP) serves as another biomarker and clinical evidence for IGD"
    explanation: Establishes serum ALP as a biomarker of inherited GPI deficiency.

diagnosis:
- name: Flow-cytometric GPI-anchored protein assay
  description: >-
    Beyond molecular genetic confirmation, the GPI defect is validated functionally by
    flow cytometry of cell-surface GPI-anchored proteins (commonly CD55, CD59, and CD16,
    plus pan-specific FLAER) on blood cells or skin fibroblasts. Some variants reduce
    only a subset of GPI-anchored proteins (e.g., transamidase-stage PIGT lowers
    granulocyte CD16 while sparing CD55/CD59), and standard serum-transferrin CDG
    screening does not detect GPI-anchor defects.
  evidence:
  - reference: PMID:39081219
    reference_title: "Inherited glycosylphosphatidylinositol deficiency: a review from molecular and clinical perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Flow cytometry analysis can detect the levels of certain GPI-APs on the cell surface, which is typically performed on blood cells and skin fibroblasts."
    explanation: Establishes flow cytometry of surface GPI-anchored proteins as the functional confirmatory assay.
  - reference: PMID:39081219
    reference_title: "Inherited glycosylphosphatidylinositol deficiency: a review from molecular and clinical perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In cases with dysfunctional PIGS, PIGT, and PIGU, there is a decrease in cell-surface CD16 on granulocytes, whereas CD55 and CD59 remain unaffected"
    explanation: Documents the variant-specific GPI-AP pattern (PIGT lowers granulocyte CD16 while sparing CD55/CD59) relevant to test interpretation.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Individually ultra-rare disorders; the largest single multinational cohort of
    inherited GPI deficiencies to date comprised 83 individuals from 75 families.
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we systematically analyse the molecular spectrum, phenotypic characteristics and natural history of 83 individuals from 75 unique families with IGDs, including 70 newly reported individuals; the largest single cohort to date"
    explanation: Establishes the rarity and scale of the largest reported inherited GPI-deficiency cohort.

differential_diagnoses:
- name: Hyperphosphatasia with intellectual disability syndrome (Mabry syndrome/HPMRS)
  description: >-
    The other major branch of inherited GPI deficiency (genes PIGV, PIGO, PGAP2,
    PGAP3, PIGW, PIGY). HPMRS shares developmental delay, seizures, hypotonia and
    dysmorphism but is defined by persistently elevated serum alkaline phosphatase
    (hyperphosphatasia), which is characteristically absent in MCAHS.
  distinguishing_features:
  - Persistently elevated serum alkaline phosphatase (normal in MCAHS; low in the PIGT/MCAHS3 subtype).
- name: Other early-infantile developmental and epileptic encephalopathies
  description: >-
    Non-GPI genetic epileptic encephalopathies (e.g., channelopathies and synaptic-gene
    DEEs) overlap in the seizure and developmental phenotype but lack a GPI-anchor
    biosynthesis defect and the associated reduction of surface GPI-anchored proteins
    on flow cytometry.
  distinguishing_features:
  - Normal cell-surface expression of GPI-anchored proteins (reduced in MCAHS).

treatments:
- name: Antiseizure medication
  description: >-
    Symptomatic management of the frequently drug-resistant epilepsy; the most commonly
    used agents in reported cohorts are valproic acid, levetiracetam, and topiramate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  evidence:
  - reference: PMID:35058872
    reference_title: "Spectrum of Neurological Symptoms in Glycosylphosphatidylinositol Biosynthesis Defects: Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most commonly applied anti-epileptic drugs (AEDs) were valproic acid (N = 60), levetiracetam (N = 50), and topiramate (N = 30)."
    explanation: Documents the antiseizure medications most commonly used across the pooled GPI-deficiency cohort.
- name: Ketogenic diet
  description: >-
    A ketogenic (ketone) diet has been reported effective for seizure control in some
    children with PIGA-related disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic Diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  evidence:
  - reference: PMID:35058872
    reference_title: "Spectrum of Neurological Symptoms in Glycosylphosphatidylinositol Biosynthesis Defects: Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on some case reports, ketone diet is effective in children with a PIGA gene mutation"
    explanation: Reports ketogenic-diet efficacy for seizures in PIGA/MCAHS2.
- name: Folinic acid
  description: >-
    Folinic acid (5-formyltetrahydrofolate) may be considered when a cerebral folate
    disturbance is demonstrated or strongly suspected, given that the folate receptor
    (FOLR1) is a GPI-anchored protein; MCAHS-specific response rates are not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Reduced Surface Folate Receptor and Cerebral Folate Delivery
    treatment_effect: MODULATES
    description: >-
      Folinic acid supplementation may compensate for reduced FOLR1-mediated cerebral
      folate delivery; the benefit in MCAHS specifically remains unproven.
- name: Vitamin B6 (pyridoxine) supplementation
  description: >-
    High-dose vitamin B6 (pyridoxine, typically 20-30 mg/kg) has shown efficacy in
    reducing seizure activity in a subset of individuals with inherited GPI deficiency,
    consistent with the impaired TNAP-dependent PLP/vitamin B6 activation mechanism.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Impaired TNAP-Dependent Vitamin B6 Activation
    treatment_effect: MODULATES
    description: >-
      Exogenous vitamin B6 raises substrate availability to compensate for reduced
      TNAP-mediated PLP processing, restoring PLP-dependent enzyme activity.
    evidence:
    - reference: PMID:39081219
      reference_title: "Inherited glycosylphosphatidylinositol deficiency: a review from molecular and clinical perspectives."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Studies have demonstrated that vitamin B6 supplementation significantly improves outcomes in IGD by reducing seizure activity."
      explanation: Supports vitamin B6 as a mechanism-directed therapy acting on the TNAP/PLP pathway.
- name: Supportive and multidisciplinary care
  description: >-
    Supportive care including nutritional support/tube feeding, physiotherapy, and
    management of congenital malformations.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care


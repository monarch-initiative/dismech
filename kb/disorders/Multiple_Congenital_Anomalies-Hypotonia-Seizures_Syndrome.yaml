name: Multiple Congenital Anomalies-Hypotonia-Seizures Syndrome
creation_date: "2026-08-14T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: multiple congenital anomalies-hypotonia-seizures syndrome
  term:
    id: MONDO:0100247
    label: multiple congenital anomalies-hypotonia-seizures syndrome
synonyms:
- MCAHS
- inherited GPI deficiency
- glycosylphosphatidylinositol biosynthesis defect
- GPI anchor deficiency
description: >-
  Multiple congenital anomalies-hypotonia-seizures syndrome (MCAHS) is a genetically
  heterogeneous group of severe, early-onset neurodevelopmental disorders caused by
  inherited defects in the biosynthesis of the glycosylphosphatidylinositol (GPI)
  anchor, the glycolipid moiety that tethers more than 150 different proteins to the
  outer face of the plasma membrane. The three classically delineated subtypes are
  defined by the affected GPI-pathway gene: MCAHS1 (PIGN), MCAHS2 (PIGA), and MCAHS3
  (PIGT). All share a stereotyped clinical core of multiple congenital anomalies,
  profound neonatal/infantile hypotonia, early-onset drug-resistant seizures that
  frequently evolve into a developmental and epileptic encephalopathy, severe-to-profound
  global developmental delay/intellectual disability, dysmorphic features, and a high
  early-childhood mortality. MCAHS sits within the broader family of inherited GPI
  deficiencies (GPIBD) alongside the hyperphosphatasia-intellectual disability
  syndromes (Mabry syndrome/HPMRS); MCAHS is distinguished clinically by the
  predominance of congenital malformations and epileptic encephalopathy and by the
  absence of the persistent hyperphosphatasia that defines HPMRS (serum alkaline
  phosphatase in MCAHS is typically normal or, in the PIGT subtype, low). Because
  complete loss of GPI-anchor biosynthesis is embryonic-lethal, viable patients retain
  partial pathway activity from hypomorphic alleles.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    MCAHS1 (PIGN) and MCAHS3 (PIGT) are inherited in an autosomal recessive manner
    from biallelic hypomorphic (partial loss-of-function) variants; recurrence risk
    is 25% per pregnancy.
  evidence:
  - reference: PMID:21493957
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reports on a hitherto undescribed autosomal recessive syndrome characterised by dysmorphic features and multiple congenital anomalies together with severe neurological impairment, chorea and seizures leading to early death"
    explanation: Establishes MCAHS1 (PIGN) as an autosomal recessive multiple-congenital-anomaly syndrome.
  - reference: PMID:23636107
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in PIGT as the cause of a novel autosomal recessive intellectual disability syndrome."
    explanation: Establishes MCAHS3 (PIGT) as an autosomal recessive syndrome.
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    MCAHS2 is caused by hemizygous variants in PIGA, which lies on the X chromosome
    (Xp22.2); affected individuals are predominantly males inheriting a hypomorphic
    allele from a carrier mother.
  evidence:
  - reference: PMID:22305531
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a family with an X-linked lethal disorder involving cleft palate, neonatal seizures, contractures, central nervous system (CNS) structural malformations, and other anomalies."
    explanation: Establishes the X-linked inheritance and germline-PIGA basis of MCAHS2.

has_subtypes:
- name: MCAHS1
  display_name: MCAHS1 (PIGN)
  description: >-
    Autosomal recessive subtype caused by biallelic PIGN variants. PIGN encodes the
    ethanolamine-phosphate transferase 1 (GPI-EtNP transferase) that adds the first
    ethanolamine phosphate to the first mannose of the GPI glycan in the endoplasmic
    reticulum. Presentations range from a lethal neonatal multiple-congenital-anomaly
    phenotype (including diaphragmatic hernia and cardiac and anorectal malformations)
    to a milder epileptic-encephalopathy phenotype with longer survival.
  subtype_term:
    preferred_term: multiple congenital anomalies-hypotonia-seizures syndrome 1
    term:
      id: MONDO:0013563
      label: multiple congenital anomalies-hypotonia-seizures syndrome 1
  genes:
  - preferred_term: PIGN
    term:
      id: hgnc:8967
      label: PIGN
- name: MCAHS2
  display_name: MCAHS2 (PIGA)
  description: >-
    X-linked recessive subtype caused by hemizygous PIGA variants (also designated
    developmental and epileptic encephalopathy 20, DEE20, and GPI biosynthesis defect
    4, GPIBD4). PIGA encodes the catalytic subunit of the GPI-N-acetylglucosaminyl
    transferase complex that catalyzes the very first, committed step of GPI-anchor
    assembly. The phenotype spans a severe/lethal neonatal form with structural brain
    anomalies to an early-infantile epileptic encephalopathy; germline PIGA loss is
    mechanistically distinct from the somatic PIGA mutation that causes paroxysmal
    nocturnal hemoglobinuria.
  subtype_term:
    preferred_term: multiple congenital anomalies-hypotonia-seizures syndrome 2
    term:
      id: MONDO:0010466
      label: multiple congenital anomalies-hypotonia-seizures syndrome 2
  genes:
  - preferred_term: PIGA
    term:
      id: hgnc:8957
      label: PIGA
- name: MCAHS3
  display_name: MCAHS3 (PIGT)
  description: >-
    Autosomal recessive subtype caused by biallelic PIGT variants. PIGT encodes a
    subunit of the GPI transamidase complex that attaches the preassembled GPI anchor
    to the C-terminus of target proteins. MCAHS3 is characterized by neonatal
    hypotonia, infantile-onset seizures, progressive cerebral and cerebellar atrophy,
    skeletal abnormalities, and characteristically low (rather than elevated) serum
    alkaline phosphatase; some PIGT variants additionally produce an autoinflammatory
    phenotype.
  subtype_term:
    preferred_term: multiple congenital anomalies-hypotonia-seizures syndrome 3
    term:
      id: MONDO:0014165
      label: multiple congenital anomalies-hypotonia-seizures syndrome 3
  genes:
  - preferred_term: PIGT
    term:
      id: hgnc:14938
      label: PIGT

pathophysiology:
- name: GPI Anchor Biosynthesis Defect
  biological_scale: MOLECULAR
  description: >-
    Hypomorphic variants in a GPI-pathway gene (PIGA at the initiating
    GlcNAc-transferase step, PIGN at ethanolamine-phosphate transfer, or PIGT at the
    transamidase attachment step) impair the stepwise endoplasmic-reticulum assembly
    and protein attachment of the GPI anchor. Because the complete pathway is
    essential, viable disease results from partial (not total) loss of function.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
  evidence:
  - reference: PMID:22305531
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phosphatidylinositol glycan class A (PIGA) is involved in the first step of glycosylphosphatidylinositol (GPI) biosynthesis."
    explanation: PIGA (MCAHS2) acts at the initiating, committed step of GPI-anchor biosynthesis.
  - reference: PMID:21493957
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in PIGN, which encodes glycosylphosphatidylinositol (GPI) ethanolamine phosphate transferase 1, a protein involved in GPI-anchor biosynthesis"
    explanation: PIGN (MCAHS1) encodes an ethanolamine-phosphate transferase in the GPI-anchor pathway.
  - reference: PMID:23636107
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIGT encodes phosphatidylinositol-glycan biosynthesis class T (PIG-T) protein, which is a subunit of the transamidase complex that catalyses the attachment of proteins to GPI."
    explanation: PIGT (MCAHS3) is part of the transamidase that attaches the GPI anchor to protein.
  downstream:
  - target: Deficient Cell-Surface GPI-Anchored Protein Expression
- name: Deficient Cell-Surface GPI-Anchored Protein Expression
  biological_scale: CELLULAR
  description: >-
    Reduced GPI-anchor availability lowers the cell-surface expression of the >150
    GPI-anchored proteins, including folate receptor, CD59, CD16, CD24, and
    GPI-anchored alkaline phosphatase. Loss of these surface proteins across many cell
    lineages underlies the multisystem, neurodevelopmental phenotype; flow-cytometric
    reduction of surface GPI-anchored proteins on blood cells is a diagnostic
    biomarker of the pathway defect.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:21493957
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of GPI linked protein CD59 on fibroblasts from patients as compared to that in a control individual showed a 10-fold reduction in expression, confirming the pathogenic consequences of the mutation on GPI dependent protein expression."
    explanation: Demonstrates reduced surface GPI-anchored protein (CD59) as the cellular consequence of the pathway defect in MCAHS1.
  - reference: PMID:23636107
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "granulocytes from the patients had reduced levels of the GPI anchored protein CD16b, supporting pathogenicity of the mutation."
    explanation: Reduced surface GPI-anchored protein (CD16b) confirms the same cellular defect in MCAHS3.
  - reference: PMID:22305531
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection of a mutant p.Arg412(∗) PIGA construct into PIGA-null cells showed partial restoration of GPI-anchored proteins."
    explanation: Functional rescue assay shows the MCAHS2 PIGA allele retains partial GPI-anchor biosynthesis, reducing surface GPI-anchored proteins rather than abolishing them.
  downstream:
  - target: Neuronal Dysfunction and Epileptic Encephalopathy
  - target: Multisystem Developmental Disruption
- name: Neuronal Dysfunction and Epileptic Encephalopathy
  biological_scale: CELLULAR
  description: >-
    Deficiency of GPI-anchored proteins critical to neuronal development and synaptic
    function produces cortical network hyperexcitability, drug-resistant early-onset
    seizures, and a developmental and epileptic encephalopathy that drives the severe
    cognitive impairment.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with variants in synthesis stage genes of the GPI-AP exhibited a significantly shorter time to seizure onset than individuals with variants in transamidase and remodelling stage genes of the GPI-AP"
    explanation: Genotype-phenotype correlation tying the position of the defect in the GPI pathway to seizure-onset timing.
- name: Multisystem Developmental Disruption
  biological_scale: ORGANISM
  description: >-
    Deficient GPI-anchored protein function during embryogenesis and postnatal life
    produces the multiple congenital anomalies, dysmorphic features, hypotonia,
    visceral and skeletal malformations, and failure to thrive that complete the MCAHS
    phenotype.
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixty-one individuals had multisystem involvement including gastrointestinal (66%), cardiac (19%) and renal (14%) anomalies."
    explanation: Documents the multisystem congenital-anomaly burden across organ systems.
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though dysmorphic features were appreciated in 82%, no single dysmorphic feature had a prevalence >30%, indicating substantial phenotypic heterogeneity."
    explanation: Supports the frequent but nonspecific dysmorphism of the syndrome.

phenotypes:
- name: Neonatal hypotonia
  description: Profound central hypotonia presenting in the neonatal period.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Neonatal hypotonia
    term:
      id: HP:0001319
      label: Neonatal hypotonia
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Core clinical features were developmental delay or intellectual disability (DD/ID, 90%), seizures (83%), hypotonia (72%) and motor symptoms (64%)."
    explanation: Hypotonia was present in 72% of the largest inherited GPI-deficiency cohort (maps to FREQUENT).
- name: Seizures
  description: >-
    Early-onset, frequently drug-resistant seizures (median onset ~6 months),
    including epileptic spasms and tonic seizures, that often evolve into a
    developmental and epileptic encephalopathy.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Core clinical features were developmental delay or intellectual disability (DD/ID, 90%), seizures (83%), hypotonia (72%) and motor symptoms (64%)."
    explanation: Seizures occurred in 83% of the largest inherited GPI-deficiency cohort (maps to VERY_FREQUENT).
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at seizure onset was 6 months."
    explanation: Documents the early-infantile median seizure onset.
  - reference: PMID:22305531
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a family with an X-linked lethal disorder involving cleft palate, neonatal seizures, contractures, central nervous system (CNS) structural malformations, and other anomalies."
    explanation: Neonatal seizures are a core feature of MCAHS2.
  - reference: PMID:23636107
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterised by distinct facial features, intellectual disability, hypotonia and seizures, in combination with abnormal skeletal, endocrine, and ophthalmologic findings"
    explanation: Seizures are a defining feature of MCAHS3.
- name: Epileptic encephalopathy
  description: >-
    Developmental and epileptic encephalopathy in which frequent epileptiform activity
    contributes to progressive cognitive and behavioral impairment.
  phenotype_term:
    preferred_term: Epileptic encephalopathy
    term:
      id: HP:0200134
      label: Epileptic encephalopathy
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with a developmental epileptic encephalopathy (51%) were at greater risk of intractable epilepsy (P = 0.003), non-ambulance (P = 0.035), ongoing enteral feeds (P < 0.001) and cortical visual impairment (P = 0.007)."
    explanation: About half of the cohort had a developmental and epileptic encephalopathy, which predicted worse outcomes.
- name: Epileptic spasms
  description: Infantile/epileptic spasms are a common seizure type, particularly in MCAHS2.
  phenotype_term:
    preferred_term: Epileptic spasm
    term:
      id: HP:0011097
      label: Epileptic spasm
- name: Profound global developmental delay
  description: Severe-to-profound global developmental delay in surviving children.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Profound global developmental delay
    term:
      id: HP:0012736
      label: Profound global developmental delay
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Core clinical features were developmental delay or intellectual disability (DD/ID, 90%), seizures (83%), hypotonia (72%) and motor symptoms (64%)."
    explanation: Developmental delay/intellectual disability was the most common feature (90%) in the largest inherited GPI-deficiency cohort.
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of individuals experienced delayed or absent speech (95%), motor delay with non-ambulance (64%), and severe-to-profound DD/ID (59%)."
    explanation: Most affected individuals had severe-to-profound developmental impairment.
- name: Intellectual disability
  description: Severe-to-profound intellectual disability.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:23636107
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterised by distinct facial features, intellectual disability, hypotonia and seizures, in combination with abnormal skeletal, endocrine, and ophthalmologic findings"
    explanation: Intellectual disability is a defining feature of the GPI-deficiency (MCAHS3) phenotype.
- name: Facial dysmorphism
  description: A recognizable but nonspecific dysmorphic facial gestalt.
  phenotype_term:
    preferred_term: Abnormal facial shape
    term:
      id: HP:0001999
      label: Abnormal facial shape
- name: Cerebral atrophy
  description: >-
    Progressive cerebral (and frequently cerebellar) atrophy on serial neuroimaging,
    indicating a neurodegenerative process.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Cerebral atrophy
    clinical_course: PROGRESSIVE
    term:
      id: HP:0002059
      label: Cerebral atrophy
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognostic and biologically significant neuroimaging features included cerebral atrophy (75%), cerebellar atrophy (60%), callosal anomalies (57%) and symmetric restricted diffusion of the central tegmental tracts (60%)."
    explanation: Cerebral atrophy (75%) and cerebellar atrophy (60%) were common neuroimaging findings.
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serial neuroimaging showed progressive cerebral volume loss in 87.5% and progressive cerebellar atrophy in 70.8%, indicating a neurodegenerative process."
    explanation: Establishes the progressive/neurodegenerative course of the atrophy.
- name: Cortical visual impairment
  description: >-
    Cerebral (cortical) visual impairment, associated with the developmental and
    epileptic encephalopathy subgroup.
  phenotype_term:
    preferred_term: Cerebral visual impairment
    term:
      id: HP:0100704
      label: Cerebral visual impairment
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with a developmental epileptic encephalopathy (51%) were at greater risk of intractable epilepsy (P = 0.003), non-ambulance (P = 0.035), ongoing enteral feeds (P < 0.001) and cortical visual impairment (P = 0.007)."
    explanation: Cortical visual impairment is enriched in the developmental-and-epileptic-encephalopathy subgroup.
- name: Feeding difficulties
  description: Poor sucking and feeding difficulties, often requiring enteral (tube) feeding.
  phenotype_term:
    preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with a developmental epileptic encephalopathy (51%) were at greater risk of intractable epilepsy (P = 0.003), non-ambulance (P = 0.035), ongoing enteral feeds (P < 0.001) and cortical visual impairment (P = 0.007)."
    explanation: Ongoing enteral feeding requirement (a marker of severe feeding difficulty) was significantly associated with the encephalopathy subgroup.


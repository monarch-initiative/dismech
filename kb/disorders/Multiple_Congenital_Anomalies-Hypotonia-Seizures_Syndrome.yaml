prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Individually ultra-rare disorders; the largest single multinational cohort of
    inherited GPI deficiencies to date comprised 83 individuals from 75 families.
  evidence:
  - reference: PMID:38456468
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we systematically analyse the molecular spectrum, phenotypic characteristics and natural history of 83 individuals from 75 unique families with IGDs, including 70 newly reported individuals; the largest single cohort to date"
    explanation: Establishes the rarity and scale of the largest reported inherited GPI-deficiency cohort.

differential_diagnoses:
- name: Hyperphosphatasia with intellectual disability syndrome (Mabry syndrome/HPMRS)
  description: >-
    The other major branch of inherited GPI deficiency (genes PIGV, PIGO, PGAP2,
    PGAP3, PIGW, PIGY). HPMRS shares developmental delay, seizures, hypotonia and
    dysmorphism but is defined by persistently elevated serum alkaline phosphatase
    (hyperphosphatasia), which is characteristically absent in MCAHS.
  distinguishing_features:
  - Persistently elevated serum alkaline phosphatase (normal in MCAHS; low in the PIGT/MCAHS3 subtype).
- name: Other early-infantile developmental and epileptic encephalopathies
  description: >-
    Non-GPI genetic epileptic encephalopathies (e.g., channelopathies and synaptic-gene
    DEEs) overlap in the seizure and developmental phenotype but lack a GPI-anchor
    biosynthesis defect and the associated reduction of surface GPI-anchored proteins
    on flow cytometry.
  distinguishing_features:
  - Normal cell-surface expression of GPI-anchored proteins (reduced in MCAHS).

treatments:
- name: Antiseizure medication
  description: >-
    Symptomatic management of the drug-resistant epilepsy; pyridoxine has been reported
    to benefit some individuals with inherited GPI deficiencies.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Supportive and multidisciplinary care
  description: >-
    Supportive care including nutritional support/tube feeding, physiotherapy, and
    management of congenital malformations.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

references:

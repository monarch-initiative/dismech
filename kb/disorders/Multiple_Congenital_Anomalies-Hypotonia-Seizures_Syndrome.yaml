    evidence_source: HUMAN_CLINICAL
    snippet: "An X chromosome exome next-generation sequencing screen identified a single nonsense PIGA mutation, c.1234C>T, which predicts p.Arg412(∗)."
    explanation: Identifies germline PIGA as the cause of the X-linked MCAHS2 phenotype.
- name: PIGN
  gene_term:
    preferred_term: PIGN
    term:

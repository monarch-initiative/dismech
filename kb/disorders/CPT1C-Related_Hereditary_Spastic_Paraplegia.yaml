name: CPT1C-Related Hereditary Spastic Paraplegia
creation_date: "2026-07-07T00:00:00Z"
description: >-
  CPT1C-related hereditary spastic paraplegia (SPG73) is a rare, pure autosomal
  dominant form of hereditary spastic paraplegia caused by a heterozygous variant
  in CPT1C, the gene encoding the neuronal (brain-specific) isoform of carnitine
  palmitoyltransferase 1. Unlike the liver (CPT1A) and muscle (CPT1B) isozymes,
  CPT1C localizes to the endoplasmic reticulum rather than the mitochondrion, is
  expressed predominantly in neurons, and has little or no enzymatic activity in
  fatty acid oxidation; it instead participates in the ER protein-interaction
  network (including atlastin-1/ATL1, the SPG3A protein) that shapes the tubular
  ER and regulates neuronal lipid-droplet biogenesis. The disease was first
  defined in a three-generation southern Italian family carrying the c.109C>T
  (p.Arg37Cys) substitution, which strictly cosegregated with disease and impairs
  lipid-droplet formation, apparently through a dominant-negative mechanism.
  Clinically it presents as slowly progressive, adult-onset, pure spastic
  paraparesis of the lower limbs (spasticity, hyperreflexia, extensor plantar
  responses, mild weakness) with normal cognition and normal peripheral nerve
  conduction, reflecting a length-dependent distal axonopathy of the corticospinal
  tract. Because the disease is placed within the carnitine-cycle/fatty-acid
  metabolism family by gene homology (a CPT1 isoform) but manifests as a
  neurodegenerative corticospinal disorder rather than a systemic fatty-acid
  oxidation defect, it is curated here as a distinct entry rather than folded into
  the hepatic/muscle carnitine palmitoyltransferase deficiencies.

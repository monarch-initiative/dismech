      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: knockdown of CPT1C resulted in a similar GluA1 retention pattern at the TGN.
      explanation: CPT1C knockdown causes GluA1 retention at the TGN in cortical neuronal cultures.
- name: GluA1 Retention at the Trans-Golgi Network
  description: >-
    Knockdown or knockout reduces GluA1 surface abundance and promotes retention at the TGN. Acute metabolic
    inhibition has little additional effect in depleted cells. The tested M589S and C-terminal deletion
    are engineered probes, not reported HSP alleles; this pathway is not established as the cause of seizures
    or intellectual disability in candidate clinical cases.

    reference_title: Uncomplicated (Pure) Hereditary Spastic Paraplegia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic counseling and risk assessment depend on determination of the specific genetic cause of

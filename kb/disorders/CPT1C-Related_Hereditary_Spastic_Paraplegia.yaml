experimental_models:
- name: R37C COS7 lipid-droplet assay
  experimental_model_type: CELL_LINE
  cell_source: COS7 cells expressing wild-type or R37C CPT1C
  description: >-
    Overexpression reduces lipid-droplet number and area; coimmunoprecipitation shows preserved atlastin-1
    binding.
  modeled_mechanisms:
  - target: Reduced Lipid Droplet Formation
    relationship: MEASURES
    description: Lipid-droplet number and area after R37C expression.
    fidelity: UNKNOWN
    limitations: Non-neuronal overexpression; no demonstrated human axon loss.
    evidence:
    - reference: PMID:25751282
      reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We showed that mutant CPT1C markedly reduces the number and size of LDs in transfected cells.
      explanation: >-
        p.Arg37Cys overexpression reduces lipid droplets in COS7 cells; this is not a measurement in patient
        motor neurons.
    - reference: PMID:25751282
      reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The Arg37Cys mutation did not affect the ability of CPT1C to bind atlastin-1
      explanation: >-
        The specific atlastin-binding assay was negative for disruption; a generic disrupted ER interaction
        network is not established.
- name: Cpt1c-null embryonic cortical neurons
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary cortical cultures from Cpt1c-null mouse embryos
  description: >-
    Cultures support lipid-droplet and axon-growth phenotypes. Wild-type re-expression restores growth;
    R37C and engineered M589S fail.
  modeled_mechanisms:
  - target: Reduced Lipid Droplet Formation
    relationship: MEASURES
    description: Reduced lipid-droplet number.
    fidelity: UNKNOWN
    limitations: Embryonic culture, not an adult in-vivo HSP phenotype.
    evidence:
    - reference: PMID:25751282
      reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also observed a reduction of LDs in primary cortical neurons isolated from Cpt1c−/− mice as
        compared with wild-type mice.
      explanation: >-
        Embryo-derived knockout cortical cultures show fewer lipid droplets. This phenocopy alone does
        not prove dominant-negative action.
  - target: Reduced Axon Extension in Cortical Cultures
    relationship: MEASURES
    description: Axon length and allelic complementation.
    fidelity: UNKNOWN
    limitations: R37C failure to rescue is not a demonstration of dominant-negative action in a heterozygote.
    evidence:
    - reference: PMID:31868590
      reference_title: Sensing of nutrients by CPT1C regulates late endosome/lysosome anterograde transport and axon growth.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Axon length was rescued by CPT1C re-expression but not by CPT1CR37C or CPT1CM589S
      explanation: The HSP-associated R37C construct failed to rescue axon growth in mouse cortical cultures.
- name: p.Gln76Ter HEK293T expression system
  experimental_model_type: CELL_LINE
  cell_source: Engineered GFP-CPT1C constructs in HEK293T cells
  description: >-
    The mutant construct produces much less transcript and no detectable full-length or truncated protein;
    cycloheximide restores transcript abundance.
  modeled_mechanisms:
  - target: CPT1C Protein Depletion in Experimental Systems
    relationship: MEASURES
    description: Transcript decay and protein abundance.
    fidelity: UNKNOWN
    limitations: Not patient-derived cells; does not establish clinical haploinsufficiency.
    evidence:
    - reference: PMID:30911584
      reference_title: A novel CPT1C variant causes pure hereditary spastic paraplegia with benign clinical course.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        293T cells carrying the p.Q76X variant indeed contained only about 5% CPT1C mRNA transcript compared
        to that of wild‐type cells
      explanation: Engineered HEK293T constructs support transcript loss; this does not resolve clinical causality.
    - reference: PMID:30911584
      reference_title: A novel CPT1C variant causes pure hereditary spastic paraplegia with benign clinical course.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: No full‐length or truncated CPT1C proteins were detected by immunoblot in the 293T cell homogenates
      explanation: The engineered p.Gln76Ter construct lacked detectable protein in HEK293T cells.
- name: CPT1C protrudin transport assays
  experimental_model_type: CELL_LINE
  cell_source: HeLa and HEK293 cells with CPT1C, protrudin and FYCO1 manipulations
  description: >-
    Biochemical interactions, live vesicle tracking and lysosome positioning support nutrient-sensitive
    kinesin transfer.
  modeled_mechanisms:
  - target: Reduced Anterograde Late Endosome and Lysosome Transport
    relationship: MEASURES
    description: Peripheral lysosome distribution and anterograde transport.
    fidelity: UNKNOWN
    limitations: R37C-specific motor transfer is not directly assayed; engineered M589S is a mechanistic probe.
    evidence:
    - reference: PMID:31868590
      reference_title: Sensing of nutrients by CPT1C regulates late endosome/lysosome anterograde transport and axon growth.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CPT1C will sense intracellular malonyl-CoA levels and promote the plus-end transport of LE/Lys
        through the enhancement of protrudin function.
      explanation: >-
        The combined cell experiments support nutrient-dependent lysosomal transport; R37C-specific motor
        transfer was not directly measured.
- name: CPT1C SAC1 GluA1 trafficking assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Mouse cortical neurons, with complementary engineered HEK293 and HeLa assays
  description: >-
    Knockdown/knockout and rescue experiments interrogate SAC1, PI4P and GluA1 localization. Engineered
    ER-TGN contacts provide complementary pathway perturbation.
  modeled_mechanisms:
  - target: Increased SAC1 Phosphatase Activity
    relationship: MEASURES
    description: CPT1C-dependent SAC1 activity.
    fidelity: UNKNOWN
    limitations: Normal gene function; patient HSP alleles were not directly tested.
    evidence:
    - reference: PMID:32931550
      reference_title: Sensing of nutrients by CPT1C controls SAC1 activity to regulate AMPA receptor trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: CPT1C expression decreased SAC1 activity
      explanation: Cell assays show negative regulation of SAC1.
  - target: Reduced Trans-Golgi PI4P
    relationship: MEASURES
    description: TGN PI4P level.
    fidelity: UNKNOWN
    limitations: No established causal connection to complex clinical features.
    evidence:
    - reference: PMID:32931550
      reference_title: Sensing of nutrients by CPT1C controls SAC1 activity to regulate AMPA receptor trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        both knocking down CPT1C or treatment with TOFA resulted in a significant decrease of PI(4)P levels
        at the TGN.
      explanation: >-
        Cortical neuronal experiments link CPT1C deficiency or inhibition of malonyl-CoA synthesis to
        lower TGN PI4P.
  - target: GluA1 Retention at the Trans-Golgi Network
    relationship: MEASURES
    description: TGN retention and surface GluA1.
    fidelity: UNKNOWN
    limitations: Nutrient challenges and engineered mutants are not treatments or patient variants.
    evidence:
    - reference: PMID:32931550
      reference_title: Sensing of nutrients by CPT1C controls SAC1 activity to regulate AMPA receptor trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: knockdown of CPT1C resulted in a similar GluA1 retention pattern at the TGN.
      explanation: CPT1C knockdown causes GluA1 retention at the TGN in cortical neuronal cultures.

genetic:
- name: CPT1C pathogenic variant
  gene_term:
    preferred_term: CPT1C
    term:
      id: hgnc:18540
      label: CPT1C
  association: Causative
  notes: >-
    Heterozygous CPT1C c.109C>T (p.Arg37Cys) in exon 3 was identified by
    whole-exome sequencing with linkage in a three-generation family; the variant
    was absent from control databases and 712 additional control exomes, strictly
    cosegregated with disease, and was predicted damaging. CPT1C encodes the
    neuronal ER-localized isoform of carnitine palmitoyltransferase 1.
  evidence:
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we showed that the mutation Arg37Cys in the ER protein CPT1C causes a pure form of AD-HSP (SPG73)."
    explanation: Identifies the causal CPT1C p.Arg37Cys variant for SPG73.

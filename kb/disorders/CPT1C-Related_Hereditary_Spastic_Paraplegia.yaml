- name: Corticospinal Tract Dysfunction
  description: >-
    Prolonged central motor conduction in the original family supports corticospinal tract dysfunction
    despite normal peripheral conduction. How the observed lipid-droplet and axon-growth defects produce
    this clinical lesion remains unresolved; direct human pathology proving distal axon degeneration is
    absent.
  evidence:

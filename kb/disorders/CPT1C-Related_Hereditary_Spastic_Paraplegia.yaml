inheritance:
- name: Autosomal dominant
  description: >-
    An autosomal dominant pedigree supports the original p.Arg37Cys association. Other reported alleles
    were inherited from parents with mild or absent symptoms; the pathogenicity of heterozygous loss-of-function
    variants is challenged by subsequent cohort data. Penetrance cannot be quantified from these small,
    differently ascertained reports.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also absent in the other unaffected participants (III-1, IV-2, and IV-3), thus
      strictly cosegregating with the disease phenotype.
    explanation: >-
      Segregation supports the original p.Arg37Cys association; it does not establish all CPT1C variants
      as causal.
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Our study does not support a causal role for CPT1C LOF variants in HSP.
    explanation: >-
      The population/cohort study challenges heterozygous loss-of-function as a cause of HSP. It does
      not directly test the original missense-specific mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1509/
    reference_title: Uncomplicated (Pure) Hereditary Spastic Paraplegia Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: uncomplicated HSP is at a 50% risk of inheriting the HSP-related
    explanation: >-
      This is the conditional allele-transmission rule for a confirmed dominant diagnosis, not a penetrance
      estimate for disputed CPT1C alleles.
pathophysiology:
- name: Arg37Cys Regulatory-Domain Destabilization
  description: >-
    NMR of the isolated N-terminal regulatory domain shows destabilization by p.Arg37Cys. Altered coupling
    to other domains and dominant-negative activity remain proposed interpretations. Atlastin-1 binding
    and ER localization are retained in the tested cells.
  evidence:
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The NMR studies indicated that the mutation altered the protein conformation
    explanation: NMR examined the isolated regulatory domain, not patient full-length protein activity.
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The Arg37Cys mutation did not affect the ability of CPT1C to bind atlastin-1
    explanation: >-
      The specific atlastin-binding assay was negative for disruption; a generic disrupted ER interaction
      network is not established.
  role: trigger
  genetic_context:

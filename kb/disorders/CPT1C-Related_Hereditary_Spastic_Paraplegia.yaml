  evidence:
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that CPT1C is expressed in motor neurons and interacts with atlastin-1, the protein encoded by the ATL1 gene."
    explanation: CPT1C interacts with the ER-shaping protein atlastin-1 (SPG3A), placing it in the HSP ER-network.
  downstream:
  - target: Impaired Neuronal Lipid Droplet Biogenesis
    description: >-
      Disruption of the CPT1C/atlastin-1 ER network impairs neuronal lipid-droplet
      formation.
- name: Impaired Neuronal Lipid Droplet Biogenesis
  description: >-
    Mutant CPT1C markedly reduces the number and size of lipid droplets in
    transfected cells, and Cpt1c-null cortical neurons show reduced lipid droplets,
    supporting a dominant-negative effect on lipid-droplet formation and altered
    lipid-mediated signaling in neurons.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: lipid droplet formation
    term:
      id: GO:0140042
      label: lipid droplet formation
    modifier: DECREASED
  evidence:
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We showed that mutant CPT1C markedly reduces the number and size of LDs in transfected cells."
    explanation: Mutant CPT1C impairs lipid-droplet biogenesis in a cellular model.
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "cortical neurons derived from Cpt1c−/− mice23,27 similarly exhibited a marked reduction in the number of LDs, suggesting a dominant negative mechanism for the Arg37Cys mutation"
    explanation: Cpt1c-null mouse cortical neurons recapitulate the lipid-droplet reduction, supporting a dominant-negative mechanism.
  downstream:
  - target: Corticospinal Tract Axonal Degeneration
    description: >-
      Impaired neuronal lipid-droplet metabolism is proposed to compromise the
      integrity of long corticospinal axons.
- name: Corticospinal Tract Axonal Degeneration
  conforms_to: "corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons"
  description: >-
    Convergent ER/lipid dysfunction in corticospinal motor neurons is proposed to
    compromise the integrity of their long axons, producing the length-dependent
    distal corticospinal-tract axonopathy that underlies the spastic paraparesis of
    hereditary spastic paraplegia. Neurophysiology in affected individuals showed
    prolonged central motor conduction with normal peripheral nerve conduction,
    localizing the lesion to the corticospinal tract (and dorsal columns).
  cell_types:
  - preferred_term: upper motor neuron
    term:
      id: CL:0008048
      label: upper motor neuron
  evidence:
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "indicating abnormalities of the corticospinal tract and the dorsal column. Peripheral nerve conduction velocities were normal in all participants examined"
    explanation: Neurophysiology localizes the SPG73 lesion to the corticospinal tract with intact peripheral nerves, consistent with a central distal axonopathy.

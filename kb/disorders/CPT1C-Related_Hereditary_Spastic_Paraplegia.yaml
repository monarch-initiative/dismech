- name: Genetic counseling
  description: >-
    Counseling depends on establishing the causal diagnosis and interpreting family segregation. A heterozygous
    allele has a 50% transmission probability, but this must not be presented as 50% HSP risk for a disputed
    CPT1C loss-of-function finding. Reproductive testing requires a well-supported familial pathogenic
    variant.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic counseling and risk assessment depend on determination of the specific genetic cause of
      uncomplicated HSP in an individual.
    explanation: General HSP counseling principle is especially relevant to the CPT1C loss-of-function controversy.

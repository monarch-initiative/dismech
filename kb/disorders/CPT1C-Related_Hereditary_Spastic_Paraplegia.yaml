- discussion_id: cpt1c-cell-to-tract-mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Which CPT1C cellular defect explains the central tract dysfunction of the original family?
  attaches_to:
  - pathophysiology#Arg37Cys Regulatory-Domain Destabilization
  - pathophysiology#Reduced Lipid Droplet Formation
  - pathophysiology#Reduced Anterograde Late Endosome and Lysosome Transport
  - pathophysiology#Reduced Axon Extension in Cortical Cultures
  - pathophysiology#Corticospinal Tract Dysfunction
  rationale: >-
    R37C changes an isolated regulatory domain, reduces lipid droplets in COS7 cells and fails cortical
    axon-growth rescue. These findings do not establish dominant-negative action, disruption of atlastin
    binding, or adult human distal axon degeneration. Nutrient-sensitive lysosome and AMPA-receptor pathways
    offer testable mechanisms but do not yet connect the clinical phenotype through a fully demonstrated
    causal chain.

name: CPT1C-Related Hereditary Spastic Paraplegia
creation_date: '2026-07-07T00:00:00Z'
description: >-
  CPT1C-associated hereditary spastic paraplegia (SPG73) was defined in a three-generation family with
  adult-onset pure spastic paraparesis and the heterozygous p.Arg37Cys variant. CPT1C is a neuronal endoplasmic-reticulum
  protein involved in lipid-droplet homeostasis, nutrient-sensitive organelle transport and AMPA-receptor
  trafficking, rather than a conventional mitochondrial fatty-acid-oxidation enzyme. Later reports attributed
  childhood-onset pure or complex HSP to truncating and splice variants, but a 2026 population/cohort
  study found no support for loss-of-function variants as a cause of HSP. The original missense-specific
  association and the disputed loss-of-function model therefore require separate interpretation. Reported
  phenotypes span mild or improving childhood motor impairment to progressive spasticity, with additional
  cognitive, seizure and behavioral findings in individual candidate cases; these do not establish a uniform
  CPT1C loss-of-function syndrome.
synonyms:
- SPG73
- Hereditary spastic paraplegia 73
- CPT1C-related autosomal dominant pure spastic paraplegia
- Autosomal dominant spastic paraplegia type 73
category: Mendelian

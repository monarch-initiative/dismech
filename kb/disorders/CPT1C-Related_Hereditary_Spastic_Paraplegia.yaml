diagnosis:
- name: Clinical and neurophysiologic assessment
  description: >-
    Document the distribution and course of spasticity and weakness, pyramidal signs, sensory findings
    and urinary symptoms. Central motor/sensory evoked potentials may be abnormal despite normal peripheral
    conduction. Normal brain or spinal MRI does not exclude the reported pure presentations.
  evidence:
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      indicating abnormalities of the corticospinal tract and the dorsal column. Peripheral nerve conduction
      velocities were normal in all participants examined
    explanation: >-
      Human neurophysiology supports central tract dysfunction; distal axon degeneration was not demonstrated
      histologically.
  - reference: PMID:30911584
    reference_title: A novel CPT1C variant causes pure hereditary spastic paraplegia with benign clinical course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cerebral and spinal MRI were normal.
    explanation: Normal structural imaging in the reported Q76Ter family.
- name: Genetic testing and causal reassessment
  description: >-
    Use an HSP-focused panel or broader genomic testing with appropriate copy-number analysis and family
    segregation. A CPT1C finding should not end the search for an established HSP cause, particularly
    for heterozygous truncating/splice alleles. Reassess variant-level evidence and alternative diagnoses
    rather than equating predicted loss-of-function with confirmed SPG73.
  evidence:
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study does not support a causal role for CPT1C LOF variants in HSP.
    explanation: >-
      The population/cohort study challenges heterozygous loss-of-function as a cause of HSP. It does
      not directly test the original missense-specific mechanism.
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: all three also carry pathogenic variants in established HSP‐associated genes.
    explanation: >-
      All three GENESIS participants with HSP and CPT1C loss-of-function variants had an alternative established
      HSP-associated genotype.
  - reference: PMID:30911584
    reference_title: A novel CPT1C variant causes pure hereditary spastic paraplegia with benign clinical course.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No copy number variation in exons was found in the SPAST, REEP1, or ATL1 gene.
    explanation: >-
      The case report investigated selected alternative HSP genes; a negative limited workup does not
      exclude every alternative.

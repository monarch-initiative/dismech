        at the TGN.
      explanation: >-
        Cortical neuronal experiments link CPT1C deficiency or inhibition of malonyl-CoA synthesis to
        lower TGN PI4P.
- name: Reduced Trans-Golgi PI4P
  description: >-
    CPT1C-deficient cortical neurons have reduced PI4P at the trans-Golgi network. Nutrient stress recruits
    CPT1C/SAC1 to ER-TGN contact sites rather than demonstrating SAC1 entry into the TGN. Wild-type CPT1C,
    but not engineered M589S or a C-terminal deletion, restores the lipid pool.
  evidence:

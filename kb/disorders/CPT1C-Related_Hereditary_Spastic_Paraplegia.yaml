pathophysiology:
- name: CPT1C Dysfunction (Neuronal ER Isoform)
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  description: >-
    A heterozygous CPT1C variant (p.Arg37Cys) alters the neuronal, ER-localized
    isoform of carnitine palmitoyltransferase 1. CPT1C differs from the mitochondrial
    CPT1A/CPT1B isozymes: it localizes to the endoplasmic reticulum, is expressed
    mainly in neurons, and has little or no fatty-acid-oxidation activity, so the
    lesion is a neuronal ER-protein defect rather than a classic carnitine-cycle
    fatty-acid oxidation block.
  gene:
    preferred_term: CPT1C
    term:
      id: hgnc:18540
      label: CPT1C
  evidence:
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a mutation in the neuronal isoform of the carnitine palmitoyl-transferase (CPT1C) gene as the genetic cause of a pure AD-HSP, termed hereditary spastic paraplegia type 73 (SPG73)"
    explanation: A CPT1C mutation is the genetic cause of SPG73.
  - reference: PMID:25751282
    reference_title: "Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It localizes to the ER and not to the mitochondria11 and has little or no enzymatic activity in fatty acid oxidation."
    explanation: Establishes that CPT1C is ER-localized and lacks fatty-acid-oxidation activity, distinguishing it from CPT1A/CPT1B.
  downstream:
  - target: Disrupted ER Protein-Interaction Network
    description: >-
      Altered CPT1C perturbs the ER protein-interaction network that shapes the
      tubular endoplasmic reticulum in neurons.
- name: Disrupted ER Protein-Interaction Network
  description: >-
    CPT1C is part of the endoplasmic reticulum protein-interaction network that
    shapes the tubular ER; it interacts with atlastin-1 (ATL1, the SPG3A protein),
    linking CPT1C to the same ER-morphogenesis machinery implicated in other pure
    hereditary spastic paraplegias. Perturbation of this network is a recurrent
    HSP pathogenic theme.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: endoplasmic reticulum organization
    term:
      id: GO:0007029
      label: endoplasmic reticulum organization

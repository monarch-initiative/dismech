discussions:
- discussion_id: cpt1c-loss-of-function-causality
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do heterozygous CPT1C loss-of-function variants cause HSP, and how does their interpretation differ
    from p.Arg37Cys?
  attaches_to:
  - genetic#CPT1C reported HSP association
  rationale: >-
    Case reports and engineered transcript-decay assays were interpreted as evidence of haploinsufficiency.
    Subsequent UK Biobank, Canadian HSP and GENESIS analyses did not support this model. Population phenotype
    ascertainment can miss subtle signs, and modifiers or incomplete penetrance remain possible, but predicted
    loss-of-function alone is not sufficient to assign the diagnosis. The R37C missense association has
    distinct segregation and functional evidence and was not directly refuted by this loss-of-function
    study.
  evidence:
  - reference: PMID:30911584
    reference_title: A novel CPT1C variant causes pure hereditary spastic paraplegia with benign clinical course.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      293T cells carrying the p.Q76X variant indeed contained only about 5% CPT1C mRNA transcript compared
      to that of wild‐type cells
    explanation: Engineered HEK293T constructs support transcript loss; this does not resolve clinical causality.
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Our study does not support a causal role for CPT1C LOF variants in HSP.
    explanation: >-
      The population/cohort study challenges heterozygous loss-of-function as a cause of HSP. It does

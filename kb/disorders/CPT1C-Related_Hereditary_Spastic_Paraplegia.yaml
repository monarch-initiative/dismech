- name: Reduced Anterograde Late Endosome and Lysosome Transport
  description: >-
    In cellular models, CPT1C promotes protrudin-dependent transfer of kinesin-1 to FYCO1-positive late
    endosomes/lysosomes under nutrient-replete conditions. CPT1C deficiency or low malonyl-CoA impairs
    peripheral organelle delivery. CPT1C-protrudin binding persists under stress, and CPT1C does not create
    the ER-lysosome contacts themselves. R37C-specific motor-transfer impairment remains inferred.
  evidence:
  - reference: PMID:31868590
    reference_title: Sensing of nutrients by CPT1C regulates late endosome/lysosome anterograde transport and axon growth.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CPT1C will sense intracellular malonyl-CoA levels and promote the plus-end transport of LE/Lys through
      the enhancement of protrudin function.
    explanation: >-
      The combined cell experiments support nutrient-dependent lysosomal transport; R37C-specific motor
      transfer was not directly measured.

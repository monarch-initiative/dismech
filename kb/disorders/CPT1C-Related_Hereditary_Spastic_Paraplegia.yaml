notes: >-
  Reported childhood loss-of-function phenotypes are included as observations with unresolved genotype
  attribution, not validated SPG73 subtypes. The general GeneReviews HSP chapter informs examination,
  testing, supportive care and conditional genetic counseling; its generic frequencies and prognosis are
  not transferred to CPT1C. Brooks et al. additionally summarize Wang et al. children with severe motor
  delay, visual impairment, cortical dysplasia or callosal/periventricular abnormalities; those details
  are secondary summaries rather than independently replicated genotype–phenotype associations. These
  isolated complex presentations do not establish a characteristic loss-of-function syndrome.

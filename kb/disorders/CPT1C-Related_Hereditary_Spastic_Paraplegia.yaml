- name: CPT1C reported HSP association
  gene_term:
    preferred_term: CPT1C
    term:
      id: hgnc:18540
      label: CPT1C
  association: Allele-dependent association; heterozygous loss-of-function causality challenged
  notes: >-
    The original missense pedigree and cellular complementation differ from the later truncating/splice
    case reports. UK Biobank and HSP cohort analyses did not support a causal loss-of-function model;
    alternative established HSP genotypes explained all three GENESIS HSP cases carrying CPT1C loss-of-function
    alleles. Mild phenotypes, modifiers or incomplete penetrance are not excluded. A functional loss in
    a model is insufficient to establish a variant as the explanation for a patient’s HSP. No curator-assigned
    gene-validity tier is asserted.
  evidence:
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was also absent in the other unaffected participants (III-1, IV-2, and IV-3), thus
      strictly cosegregating with the disease phenotype.
    explanation: >-
      Segregation supports the original p.Arg37Cys association; it does not establish all CPT1C variants
      as causal.
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Our study does not support a causal role for CPT1C LOF variants in HSP.
    explanation: >-
      The population/cohort study challenges heterozygous loss-of-function as a cause of HSP. It does
      not directly test the original missense-specific mechanism.
  - reference: DOI:10.1002/mds.70144
    reference_title: "Loss‐of‐Function Variants in\n                    <scp>\n                      <i>CPT1C</i>\n                    </scp>\n                    : No Support for a Causal Role in Hereditary Spastic Paraplegia"

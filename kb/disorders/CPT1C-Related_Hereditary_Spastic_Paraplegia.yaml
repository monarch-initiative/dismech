      preferred_term: CPT1C
      term:
        id: hgnc:18540
        label: CPT1C
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact: Regulatory-domain conformational change; dominant-negative mechanism proposed, not established.
  downstream:
  - target: Reduced Lipid Droplet Formation
    description: >-
      The same R37C allele reduces lipid-droplet number and area in a separate overexpression assay; the
      intervening molecular mechanism is unresolved.
    evidence:
    - reference: PMID:25751282
      reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We showed that mutant CPT1C markedly reduces the number and size of LDs in transfected cells.
      explanation: >-
        p.Arg37Cys overexpression reduces lipid droplets in COS7 cells; this is not a measurement in patient
        motor neurons.
  - target: Reduced Axon Extension in Cortical Cultures
    description: >-
      R37C fails to restore axon extension in knockout cortical cultures. This is a functional complementation
      result, not direct proof of human distal axon loss.
    evidence:
    - reference: PMID:31868590
      reference_title: Sensing of nutrients by CPT1C regulates late endosome/lysosome anterograde transport and axon growth.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Axon length was rescued by CPT1C re-expression but not by CPT1CR37C or CPT1CM589S
      explanation: The HSP-associated R37C construct failed to rescue axon growth in mouse cortical cultures.
- name: Reduced Lipid Droplet Formation
  description: >-
    R37C overexpression reduces lipid-droplet number and area in COS7 cells. Primary Cpt1c-null cortical
    cultures have fewer lipid droplets. These observations support altered lipid-droplet homeostasis,
    without demonstrating disrupted atlastin binding or identifying how the lipid change produces human
    HSP.
  evidence:
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We showed that mutant CPT1C markedly reduces the number and size of LDs in transfected cells.
    explanation: >-
      p.Arg37Cys overexpression reduces lipid droplets in COS7 cells; this is not a measurement in patient
      motor neurons.
  - reference: PMID:25751282
    reference_title: Mutation in CPT1C Associated With Pure Autosomal Dominant Spastic Paraplegia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also observed a reduction of LDs in primary cortical neurons isolated from Cpt1c−/− mice as compared
      with wild-type mice.
    explanation: >-
      Embryo-derived knockout cortical cultures show fewer lipid droplets. This phenocopy alone does not
      prove dominant-negative action.

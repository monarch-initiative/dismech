- name: Evaluation of complex features
  description: >-
    When seizures, developmental/cognitive impairment, behavioral problems or structural brain changes
    coexist, characterize these individually and evaluate alternative or additional diagnoses. These findings
    in candidate CPT1C cases do not yet establish a validated complex loss-of-function subtype.

- name: Increased SAC1 Phosphatase Activity
  description: >-
    CPT1C normally inhibits the PI4P phosphatase SAC1 in a nutrient-dependent manner. Knockout brain extracts
    have increased SAC1 activity. Cell assays show that malonyl-CoA depletion releases this inhibition;
    CPT1C-SAC1 binding itself is retained. These are gene-function findings, without direct testing of
    patient HSP alleles.
  evidence:
  - reference: PMID:32931550
    reference_title: Sensing of nutrients by CPT1C controls SAC1 activity to regulate AMPA receptor trafficking.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

      explanation: Malonyl-CoA supplementation partially restored axon growth after metabolic stress in wild-type cultures.
- name: Reduced Axon Extension in Cortical Cultures
  description: >-
    Cpt1c-null embryonic cortical cultures grow shorter axons. Wild-type CPT1C restores growth, whereas
    R37C and engineered malonyl-CoA-insensitive M589S do not. Reduced dendritic arborization is also observed,
    but its mechanism may be independent of protrudin. These developmental culture readouts do not demonstrate
    adult human axon degeneration.
  evidence:
  - reference: PMID:31868590
    reference_title: Sensing of nutrients by CPT1C regulates late endosome/lysosome anterograde transport and axon growth.
    supports: SUPPORT
    evidence_source: IN_VITRO

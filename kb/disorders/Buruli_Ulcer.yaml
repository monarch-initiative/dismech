datasets:
- accession: geo:GSE157350
  title: Transcriptomics in whole-blood cells of Buruli ulcer patients identifies a signature of inflammation
  description: Mycolactone, a lipid-like toxin, is the major virulence factor of Mycobacterium ulcerans, the etiological agent of Buruli ulcer. Its involvement in lesions development has been widely described in early stages of the disease, through its cytotoxic and immunosuppressive activities, but less is known about later stages. Here, we revisit the role of mycolactone in disease outcome and provide the first demonstration of the pro-inflammatory potential of this toxin. We found that the mycolactone-containing mycobacterial extracellular vesicles produced by M. ulcerans induced the production of IL-1β, a potent pro-inflammatory cytokine, in a TLR2-dependent manner, targeting NLRP3/1 inflammasomes.
  organism:
    preferred_term: human

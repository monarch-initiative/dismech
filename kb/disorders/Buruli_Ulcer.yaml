- accession: geo:GSE157956
  title: RNA-seq strategy to study Mycobacterium ulcerans adaptation within our original mouse model of spontaneous healing.
  description: Mycobacterium ulcerans is the causal agent of Buruli ulcer, a chronic infectious disease and the third most common mycobacterial disease worldwide. Without early treatment, M. ulcerans provokes massive skin ulcers, caused by the mycolactone toxin, its main virulence factor. However, spontaneous healing may occur in Buruli ulcer patients several months or years after the disease onset. We have shown, in an original mouse model, that bacterial load remains high and viable in spontaneously healed tissues, suggesting that M. ulcerans switches to low levels of mycolactone production, adapting its strategy to survive in such a hostile environment.
  data_type: BULK_RNA_SEQ

pathophysiology:
- name: Mycobacterial RNA Polymerase (Rifampicin Target)
  description: >-
    Mycobacterium ulcerans depends on DNA-dependent RNA polymerase for
    transcription. Rifampicin, the backbone of WHO-recommended antimycobacterial
    therapy with clarithromycin, binds the RpoB beta subunit and
    blocks RNA elongation; because single rpoB mutations confer high-level
    resistance, it is given in combination.
  role: therapeutic_vulnerability
  conforms_to: "bacterial_rna_polymerase_inhibition#Bacterial RNA Polymerase (Rifamycin Target)"
  biological_processes:
  - preferred_term: DNA-Templated Transcription
    term:
      id: GO:0006351
      label: DNA-templated transcription
  evidence:
  - reference: PMID:32342856
    reference_title: "Inhibition of RNA Polymerase by Rifampicin and Rifamycin-Like Molecules."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The most clinically important and extensively studied class of antibiotics
      known to inhibit bacterial RNAP are the rifamycins.
    explanation: >-
      Establishes bacterial RNA polymerase as the rifampicin target, the step this
      node represents. Evidence source is OTHER as this is a review article.
- name: Mycolactone-mediated tissue destruction
  description: Mycolactone toxin leads to subcutaneous tissue destruction and immunosuppression, producing deep ulcers.

mechanistic_hypotheses:
- hypothesis_group_id: glutamate_deficiency
  hypothesis_label: Glutamate Deficiency (Loss-of-Function) Model
  status: ALTERNATIVE
  description: >
    Because glutaminase produces glutamate — the principal excitatory
    neurotransmitter and the precursor of GABA — from astrocyte-derived
    glutamine, complete glutaminase deficiency is proposed to deprive neurons of
    glutamate and so disturb excitatory and inhibitory neurotransmission,
    producing the refractory seizures and the failure of central respiratory
    regulation. This was the framing of the original report. Its weakness is that
    it does not readily account for the cerebral edema and the cystic brain
    lesions.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We theorize that the potential reduction of glutamate and the excess of glutamine were a probable cause of the described physiological and structural abnormalities of the central nervous system."
    explanation: >
      The original authors advance reduced glutamate as a probable cause, but
      explicitly as a theory and jointly with glutamine excess — so it supports
      the model only partially.
- hypothesis_group_id: glutamine_neurotoxicity
  hypothesis_label: Glutamine Accumulation Neurotoxicity Model
  status: EMERGING
  description: >
    The alternative model holds that accumulated glutamine is itself the
    neurotoxic species, by the astrocytic-osmolyte route established in hepatic
    encephalopathy and urea cycle defects. In this entity it is supported by
    elevated cerebrospinal-fluid glutamine, a urea-cycle-like amino acid profile
    with normal ammonia, and brain MRI cystic lesions resembling those of urea
    cycle defects. It accounts for the cerebral edema that the
    glutamate-deficiency model does not. The two models are not mutually
    exclusive, and the original report invoked both.
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical and clinical findings in our patients support a key role for elevated glutamine in the neuropathogenesis"
    explanation: >
      Directly supports elevated glutamine as a key driver of the
      neuropathogenesis.

discussions:
- discussion_id: neonatal-vs-gdpag-lump-split
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should the neonatal-onset lethal form of GLS glutaminase deficiency be a
    separate Disease entry from the milder repeat-expansion form (Global
    Developmental Delay, Progressive Ataxia, and Elevated Glutamine)?
  rationale: >-
    Recent literature frames GLS glutaminase deficiency as a single disorder with
    a broad phenotypic spectrum, from early-onset global developmental delay to
    lethal early neonatal encephalopathy. Against that, the two ends carry
    distinct OMIM and MONDO identities (618328 / MONDO:0032678 versus 618412 /
    MONDO:0032733) and mechanistically distinct lesions: biallelic coding
    loss-of-function producing complete enzymatic deficiency (this entry) versus
    a noncoding 5' untranslated region GCA-repeat expansion producing only a
    partial deficiency.
  resolution_note: >-
    Curator decision: keep split, mirroring the decision already recorded on the
    repeat-expansion entry (raised by ai4c-reviewer on PR #7138). This entry is
    scoped to the biallelic coding loss-of-function form. The shared upstream
    mechanism is captured by both entries citing the same enzymatic chain, and
    the MONDO grouping class glutaminase deficiency (MONDO:0600001) is the
    natural anchor for a future dismech Grouping over the GLS entities.
  posed_by: curator
  resolved_date: "2026-08-07T00:00:00Z"
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glutaminase deficiency has recently been identified as a novel inherited metabolic disorder with a broad phenotypic spectrum ranging from early-onset global developmental delay to lethal early neonatal encephalopathy"
    explanation: >-
      Documents the spectrum framing that motivates the lump/split question; the
      curator resolution keeps the neonatal form as a distinct entry aligned to
      its own OMIM/MONDO identity.

- discussion_id: mondo-dee71-label-vs-mechanism
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Is "developmental and epileptic encephalopathy, 71" an appropriate primary
    label for this entity, given that the disorder is a metabolic glutaminase
    deficiency rather than a primary channelopathy-style DEE?
  rationale: >-
    MONDO:0032678 carries the OMIM DEE-series label, which places the entity in a
    numbered epilepsy series and makes the metabolic mechanism invisible in the
    name. Orphanet:557064 instead calls it "neonatal epileptic encephalopathy due
    to glutaminase deficiency", which is mechanistically transparent; MONDO
    retains that as an exact synonym and classifies the term under both
    MONDO:0100062 (genetic developmental and epileptic encephalopathy) and
    MONDO:0600001 (glutaminase deficiency). This dismech entry uses the Orphanet
    phrasing as its name and preferred_term while binding term.label to the
    canonical MONDO label, per the repository convention that preferred_term may
    be more informative than the ontology label.
  posed_by: curator

notes: >
  Terminology: this entity appears in the literature and in ontologies under
  several names — "developmental and epileptic encephalopathy, 71" (DEE71,
  EIEE71; OMIM 618328, MONDO:0032678), "neonatal epileptic encephalopathy due to
  glutaminase deficiency" (Orphanet:557064), and descriptively as the severe or
  lethal neonatal end of the glutaminase-deficiency spectrum. It is one of three
  distinct GLS disease entities in MONDO, alongside MONDO:0032733 (the
  repeat-expansion form) and MONDO:0032685 (the gain-of-function form).

  Ontology observation: MONDO places this entity and MONDO:0034146 (spastic
  ataxia-dysarthria due to glutaminase deficiency) under the grouping class
  MONDO:0600001 (glutaminase deficiency), but does not place MONDO:0032733 there,
  even though the repeat-expansion form is also mechanistically a glutaminase
  deficiency. That looks like an incompleteness in the MONDO hierarchy rather
  than a deliberate exclusion, and is worth reporting upstream. The
  gain-of-function entity MONDO:0032685 is correctly outside the grouping, being
  the opposite direction of effect.

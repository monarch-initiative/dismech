definitions:
- name: Biochemical-plus-genetic diagnosis of neonatal glutaminase deficiency
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Suspect this entity in a neonate with therapy-refractory seizures on a
    burst-suppression EEG and respiratory insufficiency whose plasma and
    cerebrospinal-fluid amino acids show elevated glutamine (with increased
    serum alanine) but a normal ammonia — a urea-cycle-like profile without
    hyperammonemia — particularly when brain MRI shows cystic lesions or a
    simplified gyral pattern. Confirmation is by demonstrating biallelic
    loss-of-function GLS variants. Unlike the repeat-expansion form, the coding
    lesions of this entity are detectable by exome sequencing.
  scope: GLS glutaminase deficiency (biallelic coding loss-of-function form)
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biochemical features characteristic of urea cycle disorders, while ammonia levels remained within the normal range"
    explanation: >
      Establishes the discriminating biochemical signature — urea-cycle-like
      amino acids with normal ammonia — on which the diagnostic suspicion rests.
  - reference: PMID:39559284
    reference_title: "Neonatal Encephalopathy due to Glutaminase Deficiency in a Neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "access to exome sequencing is a significant advantage in developing countries"
    explanation: >
      Confirms that exome sequencing is the diagnostic modality for this coding
      form, in contrast to the repeat-expansion form that exome misses.

genetic:
- name: GLS
  gene_term:
    preferred_term: GLS
    term:
      id: hgnc:4331
      label: GLS
  relationship_type: CAUSATIVE
  notes: >
    Biallelic coding loss-of-function lesions in GLS cause this entity. Reported
    alleles are the homozygous frameshift p.(Asp232Glufs*2); compound
    heterozygous p.(Gln81*) and p.(Arg272Lys); and the homozygous missense
    variants p.(Gly392Arg) (NM_014905.5:c.1174G>A) and p.(Leu344Pro)
    (NM_014905.5:c.1031T>C). GLS encodes phosphate-activated (kidney-type)
    glutaminase, EC 3.5.1.2. Contrast the milder allelic entity Global
    Developmental Delay, Progressive Ataxia, and Elevated Glutamine, caused by a
    noncoding 5' untranslated region GCA-repeat expansion producing only a
    partial deficiency.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous frameshift variant p.(Asp232Glufs*2) in GLS in the first family, as well as compound heterozygous variants p.(Gln81*) and p.(Arg272Lys) in GLS in the second family."
    explanation: >
      Identifies the causal biallelic GLS lesions in the two original families.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "p.Gly392Arg) in both siblings from family 1, and a novel homozygous missense variant"
    explanation: >
      Identifies two further causal homozygous GLS missense alleles.
  - reference: PMID:31603991
    reference_title: "Inborn errors of enzymes in glutamate metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GLS; GLS; EC 3.5.1.2 n = 9 bi‐allelic, AR"
    explanation: >
      Classifies GLS glutaminase deficiency as a bi-allelic, autosomal recessive
      inborn error of glutamate metabolism.


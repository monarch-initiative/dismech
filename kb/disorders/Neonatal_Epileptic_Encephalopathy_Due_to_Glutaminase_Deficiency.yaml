name: Neonatal Epileptic Encephalopathy Due to Glutaminase Deficiency
creation_date: "2026-08-07T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neonatal epileptic encephalopathy due to glutaminase deficiency
  term:
    id: MONDO:0032678
    label: developmental and epileptic encephalopathy, 71
parents:
- hereditary disease
- inborn error of metabolism
- Epileptic Encephalopathy
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  icimd_category:
  - classification_value: glu_gln_and_asp_asn
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      glutamate/glutamine and aspartate/asparagine metabolism" under category
      "Disorders of amino acid metabolism". GLS glutaminase deficiency is a
      disorder of glutamine catabolism.
description: >
  The severe, neonatal-onset end of the GLS glutaminase-deficiency spectrum: an
  autosomal recessive inborn error of amino acid metabolism caused by biallelic
  loss-of-function variants in GLS, the gene encoding phosphate-activated
  glutaminase. Because glutaminase hydrolyzes glutamine to glutamate, complete
  enzyme deficiency both blocks glutamine catabolism — so glutamine accumulates
  in blood and cerebrospinal fluid — and removes the neuronal route to glutamate,
  the principal excitatory neurotransmitter of the central nervous system.
  Affected neonates present in the first days of life with therapy-refractory
  seizures and status epilepticus on a burst-suppression EEG, respiratory
  insufficiency requiring ventilation, and structural brain abnormalities
  (simplified gyral pattern, diffuse volume loss, cerebral edema, and cystic
  lesions resembling those of urea cycle defects). Outcome is usually death in
  the neonatal period or progression to a persistent vegetative state, though at
  least one reported patient survived to age six.

  Named "developmental and epileptic encephalopathy, 71" (DEE71) in OMIM/MONDO
  and "neonatal epileptic encephalopathy due to glutaminase deficiency" in
  Orphanet, this entity sits under the MONDO grouping class glutaminase
  deficiency (MONDO:0600001) alongside spastic ataxia-dysarthria due to
  glutaminase deficiency (MONDO:0034146). It is allelic to, but clinically and
  mechanistically distinct from, the milder repeat-expansion form Global
  Developmental Delay, Progressive Ataxia, and Elevated Glutamine
  (MONDO:0032733 / OMIM 618412), and from the mechanistically opposite de novo
  gain-of-function (hypermorphic) GLS disorder characterized by glutamate excess
  (MONDO:0032685 / OMIM 618339).
references:
- reference: PMID:30575854
  title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
- reference: PMID:41865506
  title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
- reference: PMID:31603991
  title: "Inborn errors of enzymes in glutamate metabolism."

pathophysiology:
- name: Biallelic GLS Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >
    The primary genomic lesion is a biallelic (homozygous or compound
    heterozygous) coding loss-of-function lesion in GLS. Reported alleles include
    the frameshift p.(Asp232Glufs*2), the nonsense p.(Gln81*), the missense
    p.(Arg272Lys), and the homozygous missense variants p.(Gly392Arg) and
    p.(Leu344Pro). Unlike the noncoding 5' untranslated region GCA-repeat
    expansion that causes the milder repeat-expansion form, these coding lesions
    are detectable by exome sequencing.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous frameshift variant p.(Asp232Glufs*2) in GLS in the first family, as well as compound heterozygous variants p.(Gln81*) and p.(Arg272Lys) in GLS in the second family."
    explanation: >
      Documents the causal biallelic coding GLS lesions in the two originally
      reported families.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a homozygous, unreported missense variant in GLS"
    explanation: >
      Documents two further homozygous missense GLS lesions in a second cohort
      of neonatal-onset patients.
  downstream:
  - target: Complete Phosphate-Activated Glutaminase Deficiency
    description: Biallelic loss-of-function alleles abolish glutaminase activity.
    causal_link_type: DIRECT

- name: Complete Phosphate-Activated Glutaminase Deficiency
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function alleles produce a complete deficiency of
    phosphate-activated glutaminase, the mitochondrial enzyme (EC 3.5.1.2) that
    hydrolyzes glutamine to glutamate and ammonia. This is the primary enzymatic
    defect. The completeness of the enzymatic block distinguishes this entity
    from the partial/relative deficiency of the repeat-expansion form and is the
    proximate reason for the far more severe, neonatal-onset phenotype.
  molecular_functions:
  - preferred_term: glutaminase activity
    term:
      id: GO:0004359
      label: glutaminase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 3 variants probably lead to a loss of function and thus glutaminase deficiency."
    explanation: >
      Establishes loss of glutaminase function as the enzymatic consequence of
      the identified GLS variants.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies of patient fibroblasts and recombinantly expressed mutant glutaminase protein, demonstrated a complete glutaminase deficiency."
    explanation: >
      Confirms by direct functional assay in patient fibroblasts and recombinant
      protein that the enzymatic deficiency is complete, not partial.
  downstream:
  - target: Impaired Glutamine Catabolism and Glutamine Accumulation
    description: Loss of glutaminase activity blocks hydrolysis of glutamine to glutamate.
    causal_link_type: DIRECT
  - target: Organelle Stress and Mitochondrial Bioenergetic Failure
    description: >-
      Loss of the glutaminase-supplied anaplerotic route into the TCA cycle is
      associated with organelle stress and impaired mitochondrial respiration in
      patient fibroblasts.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Impaired Glutamine Catabolism and Glutamine Accumulation
  biological_scale: MOLECULAR
  description: >
    With glutaminase activity abolished, hydrolysis of glutamine to glutamate
    fails, so glutamine accumulates in blood and cerebrospinal fluid while the
    glutaminase-dependent route to glutamate is lost. The biochemical profile —
    elevated glutamine and alanine with normal ammonia — mimics that of a urea
    cycle disorder and is the diagnostic clue.
  biological_processes:
  - preferred_term: L-glutamine catabolic process
    term:
      id: GO:0006543
      label: L-glutamine catabolic process
    modifier: DECREASED
  - preferred_term: L-glutamate biosynthetic process
    term:
      id: GO:0097054
      label: L-glutamate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, glutamine was increased in affected children"
    explanation: >
      Documents glutamine accumulation as the direct biochemical consequence of
      the glutaminase block.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "elevated glutamine concentrations in cerebrospinal fluid and increased serum alanine and glutamine levels, biochemical features characteristic of urea cycle disorders, while ammonia levels remained within the normal range"
    explanation: >
      Documents the urea-cycle-like biochemical signature (high glutamine and
      alanine, normal ammonia) produced by the glutaminase block.
  downstream:
  - target: Glutamine Neurotoxicity
    description: Accumulated glutamine exerts a direct neurotoxic effect.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamine_neurotoxicity
  - target: Impaired Glutamatergic Neurotransmission
    description: Loss of neuronal glutamate synthesis impairs glutamatergic signaling.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency

- name: Glutamine Neurotoxicity
  biological_scale: CELLULAR
  description: >
    Accumulated glutamine is held to be directly neurotoxic, by the same route
    that operates in hepatic encephalopathy and urea cycle defects, where
    glutamine taken up by astrocytes acts as an osmolyte and drives astrocytic
    swelling and cerebral edema. In glutaminase deficiency this model is
    supported by elevated cerebrospinal-fluid glutamine together with brain MRI
    cystic lesions that resemble those of urea cycle defects — and it explains
    the cerebral edema, which a pure glutamate-deficiency model does not.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support a key role for elevated glutamine in the neuropathogenesis of both glutaminase-deficient patients and individuals with hepatic encephalopathy and/or urea cycle defects"
    explanation: >
      Directly supports glutamine accumulation as a driver of the
      neuropathology, linking it to the established glutamine-mediated injury of
      hepatic encephalopathy and urea cycle defects.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brain magnetic resonance imaging revealed cystic lesions resembling the neuroimaging findings typically observed in patients with urea cycle defects"
    explanation: >
      The urea-cycle-defect-like neuroimaging phenotype is the structural
      correlate predicted by a glutamine-osmolyte mechanism.
  downstream:
  - target: Structural Brain Injury
    description: Glutamine-driven osmotic stress contributes to cerebral edema and volume loss.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamine_neurotoxicity

- name: Impaired Glutamatergic Neurotransmission
  biological_scale: CELLULAR
  description: >
    Neuronal glutaminase supplies glutamate — the principal excitatory
    neurotransmitter of the central nervous system and the precursor of GABA —
    from astrocyte-derived glutamine via the glutamate-glutamine cycle. Complete
    glutaminase deficiency is proposed to deprive neurons of this route,
    disturbing excitatory and downstream inhibitory neurotransmission and
    contributing to the refractory seizures and to the failure of central
    respiratory regulation.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: glutamate secretion, neurotransmission
    term:
      id: GO:0061535
      label: glutamate secretion, neurotransmission
    modifier: DECREASED
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The GLS gene encodes glutaminase (Enzyme Commission 3.5.1.2), which plays a major role in the conversion of glutamine into glutamate, the main excitatory neurotransmitter of the central nervous system."
    explanation: >
      Establishes the enzymatic role of GLS in supplying glutamate, the
      neurotransmitter whose loss underpins this arm of the model.
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We theorize that the potential reduction of glutamate and the excess of glutamine were a probable cause of the described physiological and structural abnormalities of the central nervous system."
    explanation: >
      The authors advance reduced glutamate as a probable contributor, but
      explicitly frame it as a theory rather than a demonstrated mechanism —
      hence PARTIAL.
  downstream:
  - target: Neonatal Epileptic Encephalopathy
    description: Disturbed excitatory/inhibitory balance contributes to refractory seizures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency
  - target: Central Respiratory Failure
    description: >-
      Loss of glutamatergic signaling in brainstem respiratory networks is
      proposed to underlie the respiratory insufficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - glutamate_deficiency

- name: Organelle Stress and Mitochondrial Bioenergetic Failure
  biological_scale: CELLULAR
  description: >
    Patient-derived fibroblasts show a broad cell-biological phenotype beyond the
    amino acid disturbance: nuclear dysmorphism, lysosomal dysfunction with
    glycogen accumulation, endoplasmic reticulum stress, Golgi disruption, and
    mitochondrial fragmentation, accompanied by impaired mitochondrial
    respiratory function. This is consistent with loss of the glutaminase-derived
    anaplerotic supply of glutamate to alpha-ketoglutarate and the TCA cycle, and
    adds a bioenergetic dimension to the neurotransmitter-centred models.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  - preferred_term: mitochondrial fission
    term:
      id: GO:0000266
      label: mitochondrial fission
    modifier: INCREASED
  evidence:
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "patient-derived fibroblasts exhibited pronounced ultrastructural abnormalities, including nuclear dysmorphisms, lysosomal dysfunction with glycogen accumulation, ER stress, Golgi disruption, and mitochondrial fragmentation, along with altered cellular bioenergetics characterized by impaired mitochondrial respiratory function"
    explanation: >
      Documents the organelle-stress and bioenergetic phenotype in patient
      fibroblasts.
  downstream:
  - target: Structural Brain Injury
    description: >-
      Bioenergetic failure is proposed to compound the neuronal injury, though
      the fibroblast findings are not themselves a measurement in brain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Neonatal Epileptic Encephalopathy
  biological_scale: ORGANISM
  description: >
    Therapy-refractory seizures beginning in the first days of life, with status
    epilepticus and a burst-suppression EEG pattern — the defining clinical
    syndrome of this entity.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lethal, therapy-refractory early neonatal seizures with status epilepticus and suppression bursts"
    explanation: >
      Documents the refractory neonatal seizure phenotype with status
      epilepticus and burst suppression.
  downstream:
  - target: Neonatal Death or Persistent Vegetative State
    description: The encephalopathy is usually lethal in the neonatal period.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Central Respiratory Failure
  biological_scale: ORGANISM
  description: >
    Respiratory insufficiency requiring ventilatory support, with apnea, is a
    cardinal and often terminal feature. The original report singles out
    respiratory regulation as one of the physiological functions for which GLS
    is required.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This inborn error of metabolism underlines the importance of GLS for appropriate glutamine homeostasis and respiratory regulation, signal transduction, and survival."
    explanation: >
      Identifies respiratory regulation as a GLS-dependent physiological
      function that fails in this disorder.
  downstream:
  - target: Neonatal Death or Persistent Vegetative State
    description: Respiratory failure is a proximate cause of neonatal death.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Structural Brain Injury
  biological_scale: TISSUE
  description: >
    Structural brain abnormalities comprise a simplified gyral pattern, diffuse
    volume loss, cerebral edema, and cystic lesions resembling those seen in urea
    cycle defects. The simplified gyral pattern implies a prenatal, developmental
    component to the injury, not purely postnatal seizure-related damage.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "simplified gyral structures, diffuse volume loss of the brain, and cerebral edema"
    explanation: >
      Documents the structural brain abnormalities of the disorder.
  downstream:
  - target: Neonatal Death or Persistent Vegetative State
    description: Severe structural brain injury underlies the poor neurological outcome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Neonatal Death or Persistent Vegetative State
  biological_scale: ORGANISM
  description: >
    Outcome is death within the neonatal period in the originally reported
    families, or progression to a persistent vegetative state; survival beyond
    infancy is exceptional but documented.
  evidence:
  - reference: PMID:30575854
    reference_title: "Identification of a Loss-of-Function Mutation in the Context of Glutaminase Deficiency and Neonatal Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 4 infants from 2 unrelated families, each of whom died less than 40 days after birth, were included."
    explanation: >
      Documents the lethal neonatal outcome in all four originally reported
      infants.
  - reference: PMID:41865506
    reference_title: "Glutaminase deficiency provides insight to the role of glutamine accumulation and neurotoxicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressing to either a persistent vegetative state or early death"
    explanation: >
      Documents the two outcome trajectories in a second cohort.


  evidence:
  - reference: PMID:38744992
    reference_title: >-
      Structural deviations of the posterior fossa and the cerebellum and their
      cognitive links in a neurodevelopmental deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29Del has a prevalence of ~1 in 30,000 and usually arises de novo due to the
      hemizygous deletion of a 1.6-Mb locus, spanning 21 protein-coding genes
    explanation: >-
      Source of both the prevalence estimate and the de novo characterization.
  - reference: PMID:32321479
    reference_title: >-
      Comprehensive phenotyping of neuropsychiatric traits in a multiplex 3q29
      deletion family: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of these unaffected or mildly affected individuals suggests there
      may be an ascertainment bias for severely affected cases of 3q29 deletion
      syndrome, thus the more deleterious consequence of the 3q29 deletion may be
      overestimated.
    explanation: >-
      An important caveat on every frequency in this entry: cohorts are assembled
      from ascertained probands, so mildly affected carriers are systematically
      under-counted and the severity figures here should be read as upper bounds.
pathophysiology:
- name: Non-Allelic Homologous Recombination at 3q29 Low-Copy Repeats
  biological_scale: MOLECULAR
  description: >-
    The initiating event, and the reason the deletion is recurrent rather than
    private. Two nearly identical low-copy repeats flank the interval; misalignment
    between them during meiosis and unequal crossing-over excises the intervening
    sequence, producing near-identical breakpoints in unrelated patients. The
    reciprocal product of the same event is the 3q29 microduplication, which is a
    distinct and generally milder disorder.
  biological_processes:
  - preferred_term: recombinational repair
    term:
      id: GO:0000725
      label: recombinational repair
    modifier: ABNORMAL
  downstream:
  - target: Combinatorial Haploinsufficiency Across the 3q29 Interval
    causal_link_type: DIRECT
    description: >-
      The excision leaves one functional copy of every gene in the interval.
  evidence:
  - reference: PMID:15918153
    reference_title: >-
      3q29 microdeletion syndrome: clinical and molecular characterization of a new
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of two nearly identical low-copy repeat sequences in BAC clones
      on each side of the deletion breakpoint suggests that nonallelic homologous
      recombination is the likely mechanism of disease causation in this syndrome.
    explanation: >-
      Original identification of the recombination mechanism.
  - reference: PMID:15918153
    reference_title: >-
      3q29 microdeletion syndrome: clinical and molecular characterization of a new
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The microdeletion is approximately 1.5 Mb in length, with molecular boundaries
      mapping within the same or adjacent bacterial artificial chromosome (BAC)
      clones at either end of the deletion in all patients.
    explanation: >-
      Documents the near-identical breakpoints that make the deletion recurrent.
- name: Combinatorial Haploinsufficiency Across the 3q29 Interval
  biological_scale: MOLECULAR
  description: >-
    Hemizygosity for the ~21 protein-coding genes in the interval. The
    load-bearing curatorial point is negative: no single gene has been shown to be
    necessary and sufficient for the syndrome, and this node deliberately does not
    nominate one. The leading candidates are DLG1 and PAK2, autosomal paralogues of
    the X-linked intellectual disability genes DLG3 and PAK3, and NCBP2, which
    behaves as a broad enhancer of the other genes' phenotypes rather than as a
    driver in its own right. A pairwise interaction screen across 314 combinations
    of 14 homologs found dozens of interactions and traced the NCBP2 effect to
    increased apoptosis, which was rescued by apoptosis inhibitors — evidence that
    the mechanism is interaction between genes in the interval, not the failure of
    any one of them.
  genes:
  - preferred_term: DLG1
    term:
      id: hgnc:2900
      label: DLG1
  - preferred_term: PAK2
    term:
      id: hgnc:8591
      label: PAK2
  - preferred_term: NCBP2
    term:
      id: hgnc:7659
      label: NCBP2
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Mitochondrial and Energy-Metabolism Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced dosage across the interval, with a demonstrated PAK2 contribution,
      converges on mitochondrial function and metabolic flexibility.
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced gene dosage produces cortical hyperactivity and reduced
      parvalbumin-interneuron marker expression in the mouse model; the steps
      between are not established.
  - target: Posterior Fossa and Cerebellar Maldevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cerebellum and posterior fossa are disproportionately affected, but no
      specific gene in the interval has been tied to that regional vulnerability.
  evidence:
  - reference: PMID:15918153
    reference_title: >-
      3q29 microdeletion syndrome: clinical and molecular characterization of a new
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletion encompasses 22 genes, including PAK2 and DLG1, which are
      autosomal homologues of two known X-linked mental retardation genes, PAK3 and
      DLG3.
    explanation: >-
      Identifies the two original candidate genes and the paralogy argument for
      them.
  - reference: PMID:32053595
    reference_title: >-
      NCBP2 modulates neurodevelopmental defects of the 3q29 deletion in Drosophila
      and Xenopus laevis models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, NCBP2 homologs in Drosophila (Cbp20) and X. laevis (ncbp2)
      enhanced the phenotypes of homologs of the other 3q29 genes, leading to
      significant increases in apoptosis that disrupted cellular organization and
      brain morphology.
    explanation: >-
      The enhancer role of NCBP2 and its apoptotic readout, which is why this node
      is combinatorial rather than single-gene.
  - reference: PMID:32053595
    reference_title: >-
      NCBP2 modulates neurodevelopmental defects of the 3q29 deletion in Drosophila
      and Xenopus laevis models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Overall, our study suggests that NCBP2-mediated genetic interactions within
      the 3q29 region disrupt apoptosis and cell cycle mechanisms during
      development.
    explanation: >-
      States the interaction-based mechanism this node encodes.
  - reference: PMID:34131099
    reference_title: >-
      Convergent and distributed effects of the 3q29 deletion on the human neural
      transcriptome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The 21 protein-coding genes located in the interval segregated into seven
      clusters of highly co-expressed genes, demonstrating both convergent and
      distributed effects of 3q29Del across the interrogated transcriptomic
      landscape.
    explanation: >-
      Human cortical network analysis showing the interval's genes are neither one
      functional unit nor 21 unrelated ones, which is what "combinatorial" means
      here.
  - reference: PMID:34131099
    reference_title: >-
      Convergent and distributed effects of the 3q29 deletion on the human neural
      transcriptome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      However, no single gene in this interval is definitively associated with
      disease, prompting the hypothesis that neuropsychiatric sequelae emerge upon
      loss of multiple functionally-connected genes.
    explanation: >-
      States the multi-gene hypothesis this node is built on.
- name: Mitochondrial and Energy-Metabolism Dysregulation
  biological_scale: CELLULAR
  description: >-
    The best-supported molecular consequence, and notable for how it was
    established: single-cell transcriptomes from isogenic human cortical organoids
    and from mouse isocortex converged independently on mitochondrial function and
    energy metabolism, and the signature was then confirmed at the level of
    oxidative-phosphorylation complex protein expression and functional assays. The
    functional deficit is described as a lack of metabolic flexibility rather than a
    flat loss of respiratory capacity, and PAK2 is identified as a contributor. The
    cross-species convergence is what raises this above a single transcriptomic
    observation.
  genes:
  - preferred_term: PAK2
    term:
      id: hgnc:8591
      label: PAK2
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DYSREGULATED
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  downstream:
  - target: Neurodevelopmental and Neuropsychiatric Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Metabolic constraint on developing cortical neurons is proposed to contribute
      to the neurodevelopmental outcome; the connecting steps are not established.
  evidence:
  - reference: PMID:37585521
    reference_title: >-
      Cross-species analysis identifies mitochondrial dysregulation as a functional
      consequence of the schizophrenia-associated 3q29 deletion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Systematic pathway analysis implicated dysregulation of mitochondrial function
      and energy metabolism.
    explanation: >-
      The transcriptomic finding in isogenic organoids and mouse isocortex.
  - reference: PMID:37585521
    reference_title: >-
      Cross-species analysis identifies mitochondrial dysregulation as a functional
      consequence of the schizophrenia-associated 3q29 deletion.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These molecular signatures were supported by analysis of oxidative
      phosphorylation protein complex expression in mouse brain and assays of
      mitochondrial function in engineered cell lines, which revealed a lack of
      metabolic flexibility and a contribution of the 3q29 gene PAK2.
    explanation: >-
      Orthogonal protein-level and functional confirmation, and the PAK2
      attribution.
- name: Cortical Excitation-Inhibition Imbalance
  biological_scale: TISSUE
  description: >-
    In the syntenic mouse model, whole-brain imaging after a behavioural task showed
    neuronal hyperactivation that was strikingly exaggerated but spatially
    restricted rather than global, accompanied by reduced parvalbumin expression in
    cortex. That combination — excess excitatory activity with reduced inhibitory
    interneuron marker expression — is the standard shape of an excitation-inhibition
    imbalance, and it is the cellular phenotype the mouse work offers for the
    psychiatric arm of the syndrome. It is a model-organism finding; no equivalent
    human cortical measurement exists.
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DYSREGULATED
  locations:
  - preferred_term: neocortex
    term:
      id: UBERON:0001950
      label: neocortex
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Neurodevelopmental and Neuropsychiatric Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cortical circuit imbalance is the proposed substrate for the psychiatric
      phenotype, on the strength of model-organism evidence only.
  evidence:
  - reference: PMID:31216562
    reference_title: >-
      Psychiatric-disorder-related behavioral phenotypes and cortical hyperactivity
      in a mouse model of 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We further elucidated the cellular phenotypes of neuronal hyperactivation and
      the reduction of parvalbumin expression in the cortex of Df/+ mice.
    explanation: >-
      The two cellular measurements that constitute this node.
  - reference: PMID:31216562
    reference_title: >-
      Psychiatric-disorder-related behavioral phenotypes and cortical hyperactivity
      in a mouse model of 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unbiased whole-brain imaging revealed that neuronal hyperactivation after a
      behavioral task was strikingly exaggerated in a restricted region of the
      cortex of Df/+ mice.
    explanation: >-
      Establishes that the hyperactivation is regionally restricted rather than
      global.
- name: Posterior Fossa and Cerebellar Maldevelopment
  biological_scale: TISSUE
  description: >-
    A structural signature specific enough to be a candidate biomarker. Quantitative
    MRI shows smaller cerebellar cortex volumes and, in the opposite direction,
    larger cerebellar white matter volumes, together with elevated rates of
    posterior fossa arachnoid cysts and mega cisterna magna. The dissociation within
    that list matters: cerebellar grey and white matter volumes track visual
    perception, visual-motor integration and IQ, whereas the cystic malformations —
    the findings most likely to be flagged on a clinical read — showed no behavioural
    association at all. Reporting the cyst without the volumetrics would therefore be
    reporting the part that does not predict anything.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:38744992
    reference_title: >-
      Structural deviations of the posterior fossa and the cerebellum and their
      cognitive links in a neurodevelopmental deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29Del participants had smaller cerebellar cortex volumes than controls,
      before and after correction for intracranial volume (ICV).
    explanation: >-
      The primary volumetric finding.
  - reference: PMID:38744992
    reference_title: >-
      Structural deviations of the posterior fossa and the cerebellum and their
      cognitive links in a neurodevelopmental deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29Del participants also had larger cerebellar white matter volumes than
      controls following ICV-correction and displayed elevated rates of posterior
      fossa arachnoid cysts and mega cisterna magna findings independent of
      cerebellar volume.
    explanation: >-
      The white-matter and cystic findings, and their independence from cerebellar
      volume.
  - reference: PMID:38744992
    reference_title: >-
      Structural deviations of the posterior fossa and the cerebellum and their
      cognitive links in a neurodevelopmental deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar white matter and subregional gray matter volumes were associated
      with visual-perception and visual-motor integration skills as well as IQ,
      while cystic/cyst-like malformations yielded no behavioral link.
    explanation: >-
      The dissociation between the volumetric findings, which predict function, and
      the cystic findings, which do not.
- name: Neurodevelopmental and Neuropsychiatric Phenotype
  biological_scale: ORGANISM
  description: >-
    The clinical output. Neurodevelopmental burden dominates — intellectual
    disability, autism spectrum disorder, executive-function deficits and graphomotor
    weakness — and psychiatric illness accumulates across the lifespan, with anxiety
    and ADHD common in childhood and psychosis emerging later, at an age that can
    precede the usual population onset. The cognitive profile has a specific shape
    rather than being uniformly depressed: verbal ability typically exceeds
    non-verbal, which can mask the non-verbal deficit and lead to overestimation of
    overall ability.
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  evidence:
  - reference: PMID:33564151
    reference_title: >-
      Deep phenotyping in 3q29 deletion syndrome: recommendations for clinical care.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental phenotypes represent a significant burden and include
      intellectual disability (34%), autism spectrum disorder (38%), executive
      function deficits (46%), and graphomotor weakness (78%).
    explanation: >-
      Quantifies the neurodevelopmental component from a systematic phenotyping
      protocol.
  - reference: PMID:33564151
    reference_title: >-
      Deep phenotyping in 3q29 deletion syndrome: recommendations for clinical care.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Psychiatric illness manifests across the lifespan with psychosis prodrome
      (15%), psychosis (20%), anxiety disorders (40%), and attention
      deficit-hyperactivity disorder (ADHD) (63%).
    explanation: >-
      Quantifies the psychiatric component across the lifespan.
  - reference: PMID:35297118
    reference_title: A distinct cognitive profile in individuals with 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two-thirds of individuals with the deletion will exhibit significant strength
      in verbal ability; this may mask deficits in non-verbal reasoning, leading to
      an overestimation of overall ability.
    explanation: >-
      Establishes the verbal-over-non-verbal profile and its clinical consequence.
phenotypes:
- category: Neurologic
  name: Global Developmental Delay
  description: >-
    Developmental delay is usually what brings a child with this deletion to genetic
    testing, and the deep-research report puts it at 70-90%. No frequency band is
    asserted, because that figure is not quotable from any reference cited here: the
    GeneReviews abstract names developmental delay only through "speech delays", and
    the deep-phenotyping cohort reports intellectual disability, autism,
    executive-function and graphomotor figures without a separate delay rate. Banding
    it would mean asserting a number this entry cannot show, and the 70-90% range
    straddles the FREQUENT/VERY_FREQUENT boundary in any case. The qualitative
    association is well supported and is what the evidence below carries.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: DOI:10.3389/frcha.2026.1823061
    reference_title: >-
      Case Report: Early-onset psychosis as a sentinel manifestation of 3q29 deletion
      syndrome in an adolescent with neurodevelopmental disorders
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29 deletion syndrome is a rare genomic disorder characterized by a broad
      spectrum of neurodevelopmental and psychiatric manifestations, including
      developmental delay (DD), intellectual disability (ID), autism spectrum
      disorder (ASD), attention-deficit/hyperactivity disorder (ADHD), and a markedly
      increased lifetime risk of psychosis and schizophrenia.
    explanation: >-
      Names developmental delay explicitly as a characteristic manifestation. Supports
      the association, not a rate.
  - reference: PMID:27656750
    reference_title: 3q29 Recurrent Deletion.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29 recurrent deletion is characterized by neurodevelopmental and/or
      psychiatric manifestations including mild-to-moderate intellectual disability
      (ID), autism spectrum disorder (ASD), anxiety disorders,
      attention-deficit/hyperactivity disorder (ADHD), executive function deficits,
      graphomotor weakness, and psychosis/schizophrenia.
    explanation: >-
      GeneReviews frames the disorder as defined by its neurodevelopmental
      manifestations. PARTIAL because the list names intellectual disability and the
      specific cognitive deficits rather than global developmental delay as such.
- category: Neurologic
  name: Executive Function Deficits
  frequency: FREQUENT
  description: >-
    Clinically significant executive-function deficits affect roughly half of
    individuals, and they matter independently of IQ: they relate to functional,
    clinical and neuroimaging outcomes rather than simply tracking general ability.
    No HPO term is bound because the closest candidate (HP:0031466, impairment in
    personality function) does not mean this; per the no-term-beats-a-bad-one rule
    the entry is curated with a descriptive name and left unbound.
  evidence:
  - reference: PMID:33564151
    reference_title: >-
      Deep phenotyping in 3q29 deletion syndrome: recommendations for clinical care.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental phenotypes represent a significant burden and include
      intellectual disability (34%), autism spectrum disorder (38%), executive
      function deficits (46%), and graphomotor weakness (78%).
    explanation: >-
      Gives the 46% figure underlying the FREQUENT band.
  - reference: PMID:39365000
    reference_title: >-
      Beyond IQ: executive function deficits and their relation to functional,
      clinical, and neuroimaging outcomes in 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prior work by our team identified clinically significant executive function
      (EF) deficits in 47% of individuals with 3q29del; however, the nuances of EF in
      this population have not been described.
    explanation: >-
      Independent confirmation of the rate, from the study dedicated to the domain.
- category: Neurologic
  name: Graphomotor Weakness
  frequency: FREQUENT
  description: >-
    Graphomotor weakness is the single most frequent neurodevelopmental finding on
    systematic evaluation, present in about four-fifths of individuals — more common
    than intellectual disability or autism, and more likely to be missed. Left
    unbound: HPO has no term for graphomotor weakness that is not a broader
    fine-motor or writing-ability concept.
  evidence:
  - reference: PMID:33564151
    reference_title: >-
      Deep phenotyping in 3q29 deletion syndrome: recommendations for clinical care.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental phenotypes represent a significant burden and include
      intellectual disability (34%), autism spectrum disorder (38%), executive
      function deficits (46%), and graphomotor weakness (78%).
    explanation: >-
      Gives the 78% figure underlying the FREQUENT band.

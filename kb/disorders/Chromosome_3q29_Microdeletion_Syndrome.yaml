differential_diagnoses:
- name: 3q29 microduplication syndrome
  description: >-
    The reciprocal product of the same non-allelic homologous recombination event at
    the same locus. It shares the mechanism and the interval but is a distinct,
    generally milder disorder — a useful natural dosage comparator rather than a
    diagnostic trap, since microarray distinguishes them unambiguously.
  distinguishing_features:
  - Copy-number gain rather than loss at the same interval
  - Generally milder and more variable phenotype
  evidence:
  - reference: PMID:32874693
    reference_title: Phenotype Heterogeneity in 3q29 Microduplication Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29 microduplication syndrome is characterized by widely variable clinical
      presentation, but generally mild features.
    explanation: >-
      Characterizes the reciprocal disorder as milder and more variable, which is the
      distinction this entry draws.
- name: 22q11.2 deletion syndrome
  description: >-
    The other recurrent CNV strongly associated with schizophrenia, and the one this
    syndrome is most often compared with mechanistically — mitochondrial phenotypes
    have been reported for both, raising the possibility of convergent biology
    downstream of distinct CNVs.
  distinguishing_features:
  - Different locus, resolved by microarray
  - Conotruncal cardiac defects, hypoparathyroidism and immunodeficiency are
    characteristic of 22q11.2 and not of this syndrome
animal_models:
- name: 3q29 deletion (Df/+) mouse
  species: Mouse
  genotype: Chromosome-engineered deletion syntenic to the human 3q29 interval
  publication: PMID:31216562
  description: >-
    A chromosome-engineered mouse carrying the syntenic deletion, offering
    construct validity by design and, as it turned out, elements of face and
    predictive validity too.
  modeled_mechanisms:
  - target: Cortical Excitation-Inhibition Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Regionally restricted cortical neuronal hyperactivation with reduced
      parvalbumin expression, plus impaired prepulse inhibition that is reversed by
      antipsychotics.
    limitations: >-
      Prepulse inhibition is a sensorimotor gating proxy, not psychosis; a mouse
      cannot model the syndrome's defining psychiatric outcome, and its reversal by
      antipsychotics demonstrates pharmacological responsiveness of the proxy rather
      than of the human illness. Reduced parvalbumin expression is a marker
      measurement, not a demonstration of interneuron loss.
    evidence:
    - reference: PMID:31216562
      reference_title: >-
        Psychiatric-disorder-related behavioral phenotypes and cortical hyperactivity
        in a mouse model of 3q29 deletion syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, the schizophrenia-related impaired prepulse inhibition was
        reversed by administration of antipsychotics.
      explanation: >-
        The predictive-validity observation, recorded together with its limitation.
  evidence:
  - reference: PMID:31216562
    reference_title: >-
      Psychiatric-disorder-related behavioral phenotypes and cortical hyperactivity
      in a mouse model of 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      3q29 deletion (Df/+) mice showed reduced body weight and brain volume and,
      more importantly, impaired social interaction and prepulse inhibition.
    explanation: >-
      Establishes the model's phenotypic repertoire, including the growth and brain
      volume correlates of the human syndrome.
- name: CRISPR-engineered 3q29 deletion mouse
  species: Mouse
  genotype: B6.Del16+/Bdh1-Tfrc, CRISPR-engineered syntenic 3q29 deletion
  publication: PMID:30976085
  description: >-
    An independently generated model of the same deletion, used as the in vivo arm of
    the cross-species transcriptomic analysis.
  modeled_mechanisms:
  - target: Mitochondrial and Energy-Metabolism Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Perinatal isocortex from this model contributed the mouse half of the
      cross-species convergence on mitochondrial and energy-metabolism pathways.
    limitations: >-
      The convergent signature was derived at a single perinatal timepoint in mouse
      and at two timepoints in organoids; neither addresses adult cortex, and the
      metabolic deficit has not been measured in tissue from affected individuals.
    evidence:
    - reference: PMID:37585521
      reference_title: >-
        Cross-species analysis identifies mitochondrial dysregulation as a functional
        consequence of the schizophrenia-associated 3q29 deletion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We profiled transcriptomes from isogenic cortical organoids that were aged
        for 2 and 12 months, as well as perinatal mouse isocortex, all at single-cell
        resolution.
      explanation: >-
        Identifies the mouse tissue and timepoint contributing to the convergence.
- name: Drosophila and Xenopus 3q29 homolog knockdown panel
  species: Drosophila melanogaster and Xenopus laevis
  genotype: Tissue-specific individual and pairwise knockdown of 14 homologs of 3q29 genes
  publication: PMID:32053595
  description: >-
    Not a model of the deletion but a dissection of it: a 314-combination pairwise
    knockdown screen designed to ask which genes in the interval interact, which is
    the question a syntenic deletion model cannot answer.
  modeled_mechanisms:
  - target: Combinatorial Haploinsufficiency Across the 3q29 Interval
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Systematic pairwise perturbation identified 44 interactions between 3q29 gene
      homolog pairs and 34 with other neurodevelopmental genes, with NCBP2 emerging
      as a broad enhancer acting through apoptosis.
    limitations: >-
      Invertebrate and amphibian homolog knockdown is a screen for interaction
      structure, not a model of human haploinsufficiency; knockdown is not
      hemizygosity, and the eye and brain readouts are not the human phenotypes. The
      finding earns its place because it answers a combinatorial question no
      mammalian deletion model addresses, not because it recapitulates the disease.
    evidence:
    - reference: PMID:32053595
      reference_title: >-
        NCBP2 modulates neurodevelopmental defects of the 3q29 deletion in Drosophila
        and Xenopus laevis models.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using the fly eye, we screened for 314 pairwise knockdowns of homologs of
        3q29 genes and identified 44 interactions between pairs of homologs and 34
        interactions with other neurodevelopmental genes.
      explanation: >-
        The scale and result of the interaction screen.
experimental_models:
- name: Isogenic 3q29 deletion human cortical organoids
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: CRISPR-engineered isogenic induced pluripotent stem cell lines
  publication: PMID:37585521
  description: >-
    Human cortical organoids carrying the full 1.6 Mb deletion introduced by
    CRISPR-Cas9 into a neurotypical iPSC background, profiled by single-cell RNA
    sequencing at 2 and 12 months. The isogenic design is what makes them
    informative: it removes the genetic-background variability that otherwise
    confounds patient-derived comparisons for a variably expressive CNV.
  modeled_mechanisms:
  - target: Mitochondrial and Energy-Metabolism Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The human half of the cross-species convergence on mitochondrial function and
      energy metabolism in developing cortical tissue.
    limitations: >-
      Organoids model early cortical development and lack vasculature, microglia and
      mature circuit activity, so they cannot address the adolescent-to-adult window
      in which psychosis emerges — the phenotype the finding is ultimately being used
      to explain.
    evidence:
    - reference: PMID:37585521
      reference_title: >-
        Cross-species analysis identifies mitochondrial dysregulation as a functional
        consequence of the schizophrenia-associated 3q29 deletion.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We interrogated the developing neural transcriptome in two experimental model
        systems with complementary advantages: isogenic human cortical organoids and
        isocortex from the 3q29Del mouse model.
      explanation: >-
        Identifies the organoid system and its role in the cross-species design.
discussions:
- discussion_id: q3q29_driver_gene_attribution
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which gene or combination of genes in the 3q29 interval is responsible for the
    neurodevelopmental and psychiatric phenotype?
  attaches_to:
  - pathophysiology#Combinatorial Haploinsufficiency Across the 3q29 Interval
  rationale: >-
    Two decades after the syndrome was described, no gene in the interval has been
    shown to be necessary and sufficient, and single-gene knockouts of the leading
    candidates do not reproduce it. The evidence points instead at combinatorial
    haploinsufficiency, with NCBP2 acting as an enhancer of other genes' effects and
    PAK2 contributing to a measured metabolic deficit. This gap is what stops the
    entry nominating a driver, and it is not merely academic: a therapeutic strategy
    aimed at one gene presupposes an answer that does not exist. Note also that the
    interval's genes are functionally heterogeneous — synaptic scaffolding, actin
    regulation, mRNA cap binding, ubiquitination and SUMOylation — so "combinatorial"
    here does not yet mean "converging on one pathway".
  proposed_experiments:
  - experiment_id: q3q29_single_gene_rescue_in_isogenic_organoids
    name: Single-gene dosage restoration in isogenic 3q29 deletion organoids
    description: >-
      Restore each interval gene individually and in defined combinations in the
      isogenic deletion organoid background, and test which restorations rescue the
      mitochondrial and transcriptomic phenotypes. A single-gene rescue would
      identify a driver; a requirement for combinations would confirm the
      combinatorial model directly rather than by inference from knockdown screens.
  evidence:
  - reference: PMID:32053595
    reference_title: >-
      NCBP2 modulates neurodevelopmental defects of the 3q29 deletion in Drosophila
      and Xenopus laevis models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite its importance towards neurodevelopment, the role of individual genes,
      genetic interactions, and disrupted biological mechanisms underlying the
      deletion have not been thoroughly characterized.
    explanation: >-
      States the gap directly.
  - reference: DOI:10.1186/s11689-026-09696-y
    reference_title: >-
      Driver or passenger? A new assessment of genes in the schizophrenia-associated
      3q29 deletion locus for contribution to neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hemizygosity of this set of 22 protein-coding genes significantly increases
      risk for schizophrenia and autism spectrum disorders among other
      neurodevelopmental conditions, but it is not known which genes in this CNV
      interval are responsible for these phenotypes.
    explanation: >-
      A review dedicated to exactly this question, stating that it remains open.
  - reference: DOI:10.1186/s11689-026-09696-y
    reference_title: >-
      Driver or passenger? A new assessment of genes in the schizophrenia-associated
      3q29 deletion locus for contribution to neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Our analysis reveals that ubiquitination/SUMOylation stands out among processes
      potentially compromised due to compound haploinsufficiency of four 3q29Del
      genes
    explanation: >-
      Nominates a candidate converging pathway, which is the most concrete current
      answer to the gap and is recorded as such rather than adopted as the mechanism.
- discussion_id: q3q29_psychosis_model_gap
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does antipsychotic-reversible prepulse-inhibition impairment in the syntenic
    mouse tell us anything about the psychosis risk that defines this syndrome in
    humans?
  attaches_to:
  - pathophysiology#Cortical Excitation-Inhibition Imbalance
  rationale: >-
    The mouse work is genuinely strong on its own terms — construct validity by
    design, a restricted cortical hyperactivation phenotype, reduced parvalbumin
    expression, and a behavioural deficit that antipsychotics reverse. But prepulse
    inhibition is a sensorimotor gating measure, not psychosis, and the drug reversal
    demonstrates that the proxy is pharmacologically responsive rather than that the
    model captures the human illness. The mismatch matters here more than usual
    because the >40-fold schizophrenia risk is the syndrome's signature finding, so
    the phenotype we most want a model for is precisely the one no rodent can carry.
    The cortical excitation-inhibition node is curated at PROVISIONAL confidence for
    this reason.
  proposed_experiments:
  - experiment_id: q3q29_human_cortical_circuit_measures
    name: Human cortical excitation-inhibition measures in deletion carriers
    description: >-
      Apply non-invasive measures of cortical excitation-inhibition balance — for
      example magnetic resonance spectroscopy of GABA and glutamate, or
      TMS-EEG-derived cortical inhibition — in deletion carriers with and without
      psychotic symptoms, to test whether the imbalance the mouse shows has a human
      correlate that tracks psychiatric outcome.
  evidence:
  - reference: PMID:31216562
    reference_title: >-
      Psychiatric-disorder-related behavioral phenotypes and cortical hyperactivity
      in a mouse model of 3q29 deletion syndrome.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings are reminiscent of the growth defects and neuropsychiatric
      behavioral phenotypes in patients with 3q29 deletion syndrome and exemplify
      that the mouse model achieves some part of face validity and predictive
      validity.
    explanation: >-
      The authors' own hedged validity claim, quoted because the hedge is the point.
notes: >-
  Why no driver gene is nominated. The temptation with a contiguous-gene syndrome is
  to pick the most neurologically plausible gene in the interval and treat it as the
  cause. This entry does not, because the functional literature does not support it:
  single-gene knockouts of DLG1 and PAK2 do not reproduce the syndrome, and the one
  gene with a systematic functional result attached (NCBP2) turns out to act as an
  enhancer of the others rather than as a driver. The `genetic` block therefore binds
  DLG1 nominally, purely so the record has a gene handle, with a note saying so, and
  the mechanistic weight sits on a combinatorial node.

  Ontology suggestions from the deep-research report that were wrong and were not
  used. Four, all caught against the local term caches rather than by the report's own
  reference validation, which checks citations only: `hgnc:2905` was given for DLG1
  (correct id `hgnc:2900`), `hgnc:7647` for NCBP2 (correct id `hgnc:7659`),
  `HP:0002571` for retrocerebellar cyst (that identifier is Achalasia), and
  `HP:0031466` for executive-function deficits (offered by the report itself as an
  approximation). Executive-function deficit and graphomotor weakness are curated in
  prose rather than bound to an approximate HPO term.

  References fetched but not cited. Two cached records were dropped rather than left
  stranded in the commit. `DOI:10.1126/sciadv.adh0558` is the same paper as
  `PMID:37585521`, which the entry cites. `PMID:33819264` is a two-hit functional
  study of the **16p12.1** deletion, not this locus; the deep-research report cited it
  as a methodological follow-on, but curating it here would attach a different
  disorder's evidence to this one. `PMID:29884173` is the study protocol for the
  cohort whose results are cited via `PMID:33564151`, and is retained in the cache
  without a citation as provenance for that cohort.

  Scope. The reciprocal 3q29 microduplication is a distinct disorder and is recorded
  here only as a differential, not as a subtype. No `datasets:` block is included:
  relevance triage for accessions is a manual step that was not performed, and it
  would be particularly error-prone here, since the interval's gene names retrieve
  large volumes of unrelated cell-biology data.

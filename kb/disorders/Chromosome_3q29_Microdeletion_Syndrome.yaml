    explanation: >-
      Establishes the enhancer/modifier role.
diagnosis:
- name: Chromosomal Microarray
  description: >-
    The deletion is submicroscopic and invisible on conventional karyotype, so
    detection requires chromosomal microarray or a targeted copy-number method (FISH,
    MLPA, qPCR). Diagnosis is by identification of the heterozygous 1.6 Mb deletion
    at the recurrent coordinates.
  evidence:
  - reference: PMID:27656750
    reference_title: 3q29 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of the 3q29 recurrent deletion is established by identification
      of a heterozygous 1.6-Mb deletion at the approximate position of
      chr3:195998129-197623129 in the reference genome (NCBI Build 38).
    explanation: >-
      States the diagnostic standard and the coordinates.
- name: Psychiatric and Neurodevelopmental Assessment
  description: >-
    Formal assessment is recommended for every individual with the deletion, not only
    those who look impaired — a point with real consequences, because cognitive
    ability does not predict psychiatric burden here. Someone with an IQ in the
    normal range carries the same requirement for behavioural evaluation as anyone
    else with the deletion. Autism evaluation in particular is argued to be standard
    of care, since autistic features are present in many individuals who do not carry
    an autism diagnosis.
  evidence:
  - reference: PMID:35297118
    reference_title: A distinct cognitive profile in individuals with 3q29 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognitive ability is not a strong indicator of other neurodevelopmental or
      psychiatric impairment; thus, individuals with 3q29 deletion syndrome who
      exhibit IQ scores within the normal range should receive all recommended
      behavioural evaluations.
    explanation: >-
      The explicit recommendation, and the reason for it.
  - reference: PMID:31346402
    reference_title: >-
      Neuropsychiatric phenotypes and a distinct constellation of ASD features in
      3q29 deletion syndrome: results from the 3q29 registry.
    supports: SUPPORT

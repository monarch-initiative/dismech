name: Chromosome 3q29 Microdeletion Syndrome
creation_date: "2026-08-15T00:00:00Z"
category: Genetic
parents:
- Chromosomal deletion syndrome
- Neurodevelopmental disorder
synonyms:
- 3q29 deletion syndrome
- 3q29 microdeletion syndrome
- 3q29 recurrent deletion
- 3q subtelomere deletion syndrome
- 3qter deletion
disease_term:
  preferred_term: Chromosome 3q29 Microdeletion Syndrome
  term:
    id: MONDO:0012269
    label: chromosome 3q29 microdeletion syndrome
description: >-
  3q29 deletion syndrome is a recurrent ~1.6 Mb subtelomeric copy-number disorder,
  generated by non-allelic homologous recombination between the low-copy repeats
  that flank the interval and usually arising de novo. Hemizygous loss of the ~21
  protein-coding genes inside it produces a broad neurodevelopmental and
  neuropsychiatric phenotype — mild-to-moderate intellectual disability, autism
  spectrum disorder, ADHD, anxiety, executive-function and graphomotor deficits —
  together with a systemic burden that is easy to underweight: gastrointestinal
  symptoms are actually the commonest manifestation, and congenital heart defects
  the most severe.

  Two things make this entry worth curating carefully rather than filing as
  "another recurrent CNV". First, the schizophrenia risk is exceptional. The
  deletion carries at least a 40-fold increase in risk, one of the largest effect
  sizes known anywhere in the genetics of schizophrenia, and psychosis can begin
  earlier than in the general population. Second, no single gene in the interval
  has been shown to be necessary and sufficient. Single-gene knockouts of the
  leading candidates do not reproduce the syndrome; what the functional work
  supports instead is combinatorial haploinsufficiency, with NCBP2 acting as a
  broad enhancer of the other genes' phenotypes and PAK2 contributing to a
  mitochondrial-metabolic deficit conserved from human organoids to mouse cortex.
  The entry models that as a genuine multi-gene node rather than nominating a
  driver the evidence does not support.
inheritance:
- name: Autosomal dominant, typically de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The deletion is dominant in transmission but usually arises de novo, so most
    probands are simplex. Sibling recurrence risk is low but not zero because of
    possible parental mosaicism; an affected individual transmits the deletion to
    half their offspring.
  evidence:
  - reference: PMID:27656750
    reference_title: 3q29 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3q29 recurrent deletion is an autosomal dominant disorder typically caused by
      a de novo deletion.
    explanation: >-
      GeneReviews states the mode of inheritance and its usual de novo origin.
  - reference: PMID:27656750
    reference_title: 3q29 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the proband represents a simplex case (i.e., a single affected family
      member) and neither parent has the 3q29 recurrent deletion or a balanced
      chromosome rearrangement, the recurrence risk to sibs is low (presumed to be
      <1%) but greater than that of the general population because of the
      possibility of parental mosaicism for the deletion.
    explanation: >-
      Source of the recurrence-risk statement, including the mosaicism caveat.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.3
  notes: >-

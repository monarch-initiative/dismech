genetic:
- name: 3q29 recurrent 1.6 Mb deletion
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: DLG1
    term:
      id: hgnc:2900
      label: DLG1
  inheritance:
  - name: Autosomal dominant, typically de novo
  notes: >-
    The causal lesion is the copy-number variant itself, not a point mutation in any
    gene. The gene binding here is nominal — DLG1 is the historical lead candidate
    and lies within the interval — and should not be read as a claim that DLG1 alone
    causes the syndrome. See the discussion on driver-gene attribution.
  evidence:
  - reference: PMID:27656750
    reference_title: 3q29 Recurrent Deletion.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of the 3q29 recurrent deletion is established by identification
      of a heterozygous 1.6-Mb deletion at the approximate position of
      chr3:195998129-197623129 in the reference genome (NCBI Build 38).
    explanation: >-
      Defines the deletion by coordinates, which is what the diagnosis rests on.
- name: PAK2
  association: Disease-associated
  relationship_type: COOPERATING
  gene_term:
    preferred_term: PAK2
    term:
      id: hgnc:8591
      label: PAK2
  notes: >-

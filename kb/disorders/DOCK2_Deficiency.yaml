    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Until recently, only 16 DOCK2-deficient patients have been reported in the
      literature, and all had a severe phenotype characterized by early-onset of
      recurrent, invasive viral, and bacterial infections associated with T and B
      cell lymphopenia
    explanation: >-
      Gives an explicit worldwide case count. Graded HUMAN_CLINICAL for the
      clinical picture it describes, with quote_role BACKGROUND because the sentence
      sits in this paper's introduction summarizing others' cases rather than
      reporting its own.
genetic:
- name: DOCK2
  gene_term:
    preferred_term: DOCK2
    term:
      id: hgnc:2988
      label: DOCK2
  presence: Positive
  association: Biallelic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Seven distinct rare DOCK2 variants were identified in the five index patients -
    four leading to premature termination and three predicted-deleterious missense
    changes at conserved residues. Further novel alleles have been reported since.
    Genotypes include homozygous dinucleotide insertions causing frameshift,
    homozygous missense, and compound heterozygous missense/nonsense.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, we identified seven distinct DOCK2 rare mutations in five
      patients of different ethnic origin, four of which lead to premature
      termination, and three of which were predicted deleterious missense mutations
      affecting conserved residues of DOCK2
    explanation: >-
      Documents the allelic spectrum stated in the notes.
- name: DOCK2 (heterozygous ELMO1-binding-domain variants)
  subtype: Heterozygous DOCK2-ELMO1 hypomorph
  gene_term:
    preferred_term: DOCK2
    term:
      id: hgnc:2988
      label: DOCK2
  presence: Positive
  association: Heterozygous ELMO1-Binding-Domain Hypomorphic Variants
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >-
    Three distinct heterozygous variants, all inside the DOCK2 region that binds and
    stabilizes ELMO1, carried by six individuals from three unrelated families.
    Each reduces DOCK2 protein level, ELMO1 binding and RAC1 activation, so the
    mechanism is hypomorphic destabilization rather than the null or truncating
    alleles of the recessive form, and it converges on the same RAC1 step.
    relationship_type is SUSCEPTIBILITY because the phenotype is severe illness on
    encountering particular viruses rather than a constitutive immunodeficiency.
    Note that the enum's own description for that value is written for polygenic
    GWAS loci; this is a monogenic susceptibility trait, and the value is used for
    its plain meaning. CAUSATIVE would assert a constitutive disease these carriers
    do not have.
  evidence:
  - reference: PMID:41654261
    reference_title: "Heterozygous variants in DOCK2 leading to susceptibility to viral illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All variants reside within the DOCK2 domain that binds and stabilizes ELMO1.
      Each variant reduced DOCK2 protein expression, ELMO1 binding, and DOCK2
      function, as shown by diminished Rac1 activation and selective defects in
      Toll-like receptor signaling.
    explanation: >-
      Establishes the allelic class and its hypomorphic mechanism, which is what
      distinguishes this record from the biallelic loss-of-function one above.
  - reference: PMID:38857861
    reference_title: "RhoG facilitates a conformational transition in the guanine nucleotide exchange factor complex DOCK5/ELMO1 to an open state."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Recent cryo-EM structures of the DOCK2/ELMO1 and DOCK2/ELMO1/Rac1 complexes
      have identified closed and open conformations that are key to understanding
      the autoinhibition mechanism.
    explanation: >-
      Supplies the structural reason a variant in the ELMO1-binding region is
      pathogenic at all: ELMO1 binding is what releases DOCK2 autoinhibition. The
      sentence is this paper's framing of the DOCK2 structures rather than its own
      result, which is about DOCK5, hence quote_role BACKGROUND and directness
      INDIRECT.
diagnosis:
- name: Molecular and Functional Diagnosis of DOCK2 Deficiency
  description: >-
    The diagnosis is genetic: biallelic DOCK2 variants on a primary-immunodeficiency
    panel or exome sequencing in a child with early-onset invasive infection and
    lymphopenia. Supporting functional assays, where available, are RAC1 activation
    after CD3 stimulation, chemokine-induced actin polymerization and chemotaxis,
    and NK-cell degranulation. Low TRECs on newborn screening can be the first
    signal.
  notes: >-
    The diagnosis is easy to miss. In one reported case it was made 18 years after
    the patient had already been transplanted for a presumed combined
    immunodeficiency of unknown cause, and in another the transplant was performed
    before the genetic diagnosis was available. Anyone transplanted for undefined
    CID is a candidate for retrospective genetic diagnosis, which matters because
    the non-haematopoietic arm of the disease is not corrected by the transplant.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with clinical features of combined immunodeficiencies, especially
      with early-onset, invasive infections, may have this condition.
    explanation: >-
      The authors' own statement of who should be tested.
  - reference: PMID:35023658
    reference_title: "Hematopoietic stem cell transplantation complicated with EBV associated hemophagocytic lymphohistiocytosis in a patient with DOCK2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent HSCT without conditioning regimen before the genetic diagnosis
    explanation: >-
      Documents a case transplanted before the genetic diagnosis was made,
      supporting the retrospective-diagnosis point in the notes.
  - reference: PMID:34418894
    reference_title: "Investigating the Variation of TREC/KREC in Combined Immunodeficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Very low to zero amounts of TREC and/or KREC were detected in 14 out of 23
      cases of common variable immunodeficiency (CVID), 14 out of 17 cases of AT, 8
      out of 20 cases of WAS, 6 out of 7 cases of DOCK8-deficiency patients, 4 out
      of 8 cases of HIES with unknown genetic defects and all patients with defects
      in DOCK2, PNP, and RAG1.
    explanation: >-
      The measured basis for the TREC claim in the description. Note the DOCK2 arm
      of this series is a single patient, so it establishes that the assay is
      abnormal in DOCK2 deficiency rather than how sensitive it is.
  - reference: PMID:34872585
    reference_title: "First patient in the Iranian Registry with novel DOCK2 gene mutation, presenting with skeletal tuberculosis, and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also recommended that DOCK2-deficient patients might benefit from T-cell
      receptor excision circle (TREC) assay as part of the routine newborn
      screening program.
    explanation: >-
      The authors' own recommendation that newborn TREC screening should pick these
      patients up, which is the clinical claim the description makes.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment. Three of the five index patients were transplanted
    and had normalization of T-cell function and clinical improvement, one of them
    still well 17.5 years later. Transplantation replaces the haematopoietic
    compartment and therefore addresses the lymphocyte and NK arms; it does not
    obviously address the fibroblast-intrinsic antiviral defect, which is a reason
    to follow transplanted patients for viral disease rather than assume cure.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: T Cell Lymphopenia
    description: >-
      Replaces the DOCK2-deficient haematopoietic compartment with donor cells that
      can activate RAC1 normally, restoring thymic output from a donor-derived
      progenitor pool.
  - target: Impaired T Cell Activation and Antibody Response
    description: >-
      Donor lymphocytes activate RAC1 normally, so the proliferative and antibody
      responses that fail in patient cells are reconstituted.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients died early in childhood; after allogeneic hematopoietic
      stem-cell transplantation, the other three had normalization of T-cell
      function and clinical improvement.
    explanation: >-
      Reports the outcome of transplantation in the index cohort, including the
      normalization of T-cell function.
  - reference: PMID:40860338
    reference_title: "Clinical and molecular findings in actin-related inborn errors of immunity: the middle East and North Africa registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hematopoietic stem cell transplantation (HSCT) was conducted on 24.0% of
      patients, which significantly improved survival in patients with defects in
      WAS, DOCK8 and DOCK2.
    explanation: >-
      A 503-patient multi-country registry reporting a survival benefit from
      transplantation that names DOCK2 specifically, which is the largest denominator
      behind the curative claim this treatment makes.
  notes: >-
    Transplant complications are reported: EBV-associated haemophagocytic
    lymphohistiocytosis after HSCT performed without a conditioning regimen.
- name: Interferon Alfa Therapy for Viral Complications
  description: >-
    Interferon alfa is the one mechanistically grounded adjunct short of transplant.
    It corrects the fibroblast antiviral defect in vitro, and weekly interferon-alfa
    completely resolved refractory warts in one patient with a heterozygous
    ELMO1-binding-domain variant. The source says only "IFN-alpha" and does not name
    the product, so the bound agent is the general recombinant interferon alfa term;
    the modality is OTHER rather than PROTEIN_REPLACEMENT because this is an
    immunomodulatory cytokine given pharmacologically, not replacement of a protein
    the patient lacks. This is a single-patient observation in the
    hypomorphic form, not a trial and not evidence in the recessive form; it is
    curated here because it is the direct clinical counterpart of the in vitro
    rescue this entry already records.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon alfa
      term:
        id: NCIT:C225
        label: Recombinant Interferon Alfa
  target_mechanisms:
  - target: Increased Viral Replication in Non-Haematopoietic Cells
    description: >-
      Supplies the interferon signal that DOCK2-deficient cells fail to produce,
      restoring the antiviral state in cells that remain genetically deficient.
  evidence:
  - reference: PMID:41654261
    reference_title: "Heterozygous variants in DOCK2 leading to susceptibility to viral illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Weekly IFN-α therapy led to complete resolution of refractory warts in 1
      patient, highlighting a potential therapeutic approach for DOCK2-associated
      immunodeficiency.
    explanation: >-
      The single clinical observation behind this treatment, quoted with its own
      hedging intact.
- name: Immunoglobulin Replacement
  description: >-
    Intravenous immunoglobulin while awaiting transplantation, or where
    transplantation is not undertaken. It supplies the specific antibody the
    T-dependent response fails to make; it does not touch the cellular arm, so it
    is partial and palliative.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Impaired T Cell Activation and Antibody Response
    description: >-
      Substitutes pooled donor antibody for the specific antibody response that
      fails in these patients despite normal total IgG and IgM.
  evidence:
  - reference: PMID:36947335
    reference_title: "Multiple Immune Defects in Two Patients with Novel DOCK2 Mutations Result in Recurrent Multiple Infection Including Live Attenuated Virus Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's condition was partially alleviated by symptomatic treatment or
      intravenous immunoglobulin.
    explanation: >-
      Documents partial benefit from immunoglobulin, and its limits.
- name: Anti-Infective Prophylaxis and Symptomatic Care
  description: >-
    Antimicrobial prophylaxis and symptomatic treatment of intercurrent infection,
    alongside immunoglobulin, while awaiting transplantation. Split from the
    immunoglobulin record above because the two are different modalities and the
    combined record could not answer what kind of intervention it was.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    No source cited here names a specific prophylactic agent or regimen in a DOCK2
    patient, so no `therapeutic_agent` is bound. The quoted evidence covers
    symptomatic treatment generically.
  evidence:
  - reference: PMID:36947335
    reference_title: "Multiple Immune Defects in Two Patients with Novel DOCK2 Mutations Result in Recurrent Multiple Infection Including Live Attenuated Virus Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's condition was partially alleviated by symptomatic treatment or
      intravenous immunoglobulin.
    explanation: >-
      Documents partial benefit from symptomatic treatment, and its limits.
animal_models:
- name: DOCK2-deficient mouse (HSV-1 challenge)
  species: Mouse
  genotype: Dock2-deficient
  publication: PMID:38366567
  description: >-
    A mouse model developed specifically to separate DOCK2's own contribution to
    antiviral immunity from the treatments and comorbid infections that confound
    interpretation in patients.
  modeled_mechanisms:
  - target: Impaired T Cell Activation and Antibody Response
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Identifies a cell-intrinsic DOCK2 requirement for the initial expansion of
      antiviral CD8+ T cells, a step that is not visible in the human data because
      early activation markers look normal.
    limitations: >-
      The human node covers failed proliferation to mitogen and defective
      T-dependent antibody responses; the mouse result speaks only to
      antigen-specific CD8+ expansion after priming. The mouse also shows that DOCK2-deficient CD8+
      cells are protective once primed in vitro, a rescue with no human counterpart,
      so the model bears on the mechanism of the T-cell defect rather than on its
      clinical severity.
    readouts:
    - name: Antiviral CD8+ T-cell expansion after HSV-1 priming
      target: Impaired T Cell Activation and Antibody Response
      direction: DECREASED
      interpretation: >-
        The expansion deficit is the functional correlate of the human T-cell
        activation defect.
      evidence:
      - reference: PMID:38366567
        reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We also uncovered a critical, cell-intrinsic role of DOCK2 in the priming
          of antiviral CD8+ T cells and in particular their initial expansion,
          despite apparently normal early activation of these cells.
        explanation: >-
          Reports the measured expansion defect and its cell-intrinsic nature.
    evidence:
    - reference: PMID:38366567
      reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results shed light on a cellular deficiency that is likely to impact
        antiviral immunity in DOCK2-deficient patients.
      explanation: >-
        The authors' own statement of the model's intended relevance to the human
        disease.
  - target: Recurrent invasive viral infections
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Delayed clearance of herpes simplex virus type 1, an organism-level antiviral
      phenotype matching the herpesvirus susceptibility seen in patients.
    limitations: >-
      Delayed clearance of a single experimentally administered virus is a much
      milder phenotype than the fatal disseminated varicella and vaccine-strain
      disease reported in patients, so the model reproduces the direction of the
      defect but not its clinical magnitude.
    evidence:
    - reference: PMID:38366567
      reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We developed a mouse model of DOCK2 immunodeficiency and herein demonstrate
        that these mice have delayed clearance of herpes simplex virus type 1
        (HSV-1) infections.
      explanation: >-
        Reports the organism-level viral clearance defect in the model.

discussions:
- discussion_id: hsct_does_not_correct_stromal_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased Viral Replication in Non-Haematopoietic Cells
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
  prompt: >-
    Does haematopoietic stem cell transplantation correct the non-haematopoietic,
    fibroblast-intrinsic antiviral defect in DOCK2 deficiency, and if not, what is
    the long-term viral risk in transplanted patients?
  rationale: >-
    The index report establishes two separable arms: a haematopoietic defect that
    transplantation demonstrably corrects, and a cell-intrinsic antiviral defect in
    fibroblasts that transplantation has no obvious mechanism to touch, since the
    recipient's stromal cells remain DOCK2-deficient. Transplanted patients are
    reported as "alive and well", but the longest follow-up reported is 17.5 years
    in one patient and the others are measured in months, and no study has asked
    whether stromal viral susceptibility persists. If it does, the standard framing
    of HSCT as curative for this disorder is incomplete, and interferon alfa-2b -
    which corrects the fibroblast phenotype in vitro - would be worth evaluating as
    an adjunct rather than only as a mechanistic probe.
- discussion_id: rac1_to_interferon_link
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Diminished Type I and Type III Interferon Production
  prompt: >-
    By what route does loss of DOCK2-dependent RAC1 activation reduce type I and
    type III interferon production?
  rationale: >-
    The entry draws this edge as INDIRECT_UNKNOWN_INTERMEDIATES because no
    intermediate is established. RAC1 activation downstream of antigen and chemokine
    receptors is a cytoskeletal signal, and the canonical antiviral interferon
    induction pathways run through RIG-I/MDA5 and TLR sensing, not through DOCK2.
    Whether the interferon defect is a direct signalling consequence, a consequence
    of impaired endosomal trafficking of nucleic acid sensors, or simply a knock-on
    of the reduced and abnormal plasmacytoid dendritic cell compartment has not been
    resolved. The answer determines whether interferon supplementation is treating
    the lesion or bypassing it.
notes: >-
  Not curated: the detailed NK receptor-by-receptor degranulation data (CD16,
  NKp30, NKp44, NKp46, NKG2D) and the MEK/ERK phosphorylation findings from
  PMID:26083206. They are real and support the "shared downstream step" argument in
  the NK node, but curating each receptor as its own node would multiply the
  pathograph without adding a distinct mechanistic claim.

  PMID:33928462 ("DOCK2 Deficiency Diagnosed 18 Years After Hematopoietic Stem Cell
  Transplantation") is cited nowhere in this entry although it is directly relevant
  to the late-diagnosis point in `diagnosis.notes`. The reference fetcher returns
  content type "unavailable" for it - neither abstract nor full text is
  retrievable - so there is no quotable text, and this repository does not permit
  hand-writing a cache file. The late-diagnosis claim is instead supported from
  PMID:35023658, which is cached and makes the weaker but quotable version of the
  same point.

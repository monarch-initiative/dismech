inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic DOCK2 variants with complete penetrance. Reported genotypes include
    homozygous frameshift, homozygous missense, and compound heterozygous
    missense/nonsense combinations.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intra-familial segregation was consistent with autosomal recessive
      inheritance with complete penetrance
    explanation: >-
      Direct statement of the segregation pattern across the five index families.
- name: Heterozygous Hypomorphic (ELMO1-Binding Domain)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A separately described form in which a single heterozygous variant in the
    DOCK2 region that binds and stabilizes ELMO1 reduces DOCK2 protein level and
    function. Six individuals from three unrelated families, aged 3 months to 50
    years, presented with severe HPV, RSV or SARS-CoV-2 infection rather than with
    the infantile combined immunodeficiency of the recessive form.
  evidence:
  - reference: PMID:41654261
    reference_title: "Heterozygous variants in DOCK2 leading to susceptibility to viral illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six individuals from 3 unrelated families, aged 3 months to 50 years, carried
      1 of 3 heterozygous variants in DOCK2 and experienced severe infections with
      human papilloma virus, respiratory syncytial virus, or severe acute
      respiratory syndrome coronavirus 2.
    explanation: >-
      Documents the heterozygous carriers and their virus-restricted clinical
      phenotype, the basis for a second, dominant inheritance mode.
  - reference: PMID:41654261
    reference_title: "Heterozygous variants in DOCK2 leading to susceptibility to viral illnesses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All variants reside within the DOCK2 domain that binds and stabilizes ELMO1.
      Each variant reduced DOCK2 protein expression, ELMO1 binding, and DOCK2
      function, as shown by diminished Rac1 activation and selective defects in
      Toll-like receptor signaling.
    explanation: >-
      Establishes the molecular mechanism of the heterozygous form: destabilization
      through loss of ELMO1 binding, converging on the same reduced RAC1 activation.
has_subtypes:
- name: AR DOCK2 deficiency
  display_name: Autosomal recessive DOCK2 deficiency (biallelic loss of function)
  description: >-
    The classical form. Biallelic frameshift, nonsense, splice-site or missense
    variants abolishing or truncating DOCK2. Early-onset combined immunodeficiency
    with lymphopenia, invasive bacterial and viral infection, and a leaky SCID or
    Omenn presentation in some kindreds. Fatal without transplantation in a
    substantial proportion.
- name: Heterozygous DOCK2-ELMO1 hypomorph
  display_name: Heterozygous DOCK2 ELMO1-binding-domain variants (viral susceptibility)
  description: >-
    Single heterozygous variants in the ELMO1-binding region. Reduced DOCK2 protein
    stability with preserved T-cell function, presenting across a wide age range as
    selective severe viral illness (HPV, RSV, SARS-CoV-2) rather than as combined
    immunodeficiency.
pathophysiology:
- name: DOCK2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    DOCK2 is an atypical guanine nucleotide exchange factor expressed almost
    exclusively in haematopoietic and lymphoid tissue. Its DHR2 domain is what
    catalyses nucleotide exchange on RAC. Disease alleles either abolish the
    protein - frameshift and nonsense variants leave absent or trace amounts on
    immunoblot - or truncate it short of DHR2, which removes the catalytic function
    while leaving a protein product. Missense alleles hit evolutionarily conserved
    residues.
  genetic_context:
    gene:
      preferred_term: DOCK2
      term:
        id: hgnc:2988
        label: DOCK2
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RAC guanine nucleotide exchange factor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  downstream:
  - target: Failure of Receptor-Driven RAC1 Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoblot analysis revealed absent or trace amounts of DOCK2 protein
      expression in T cell lines from P1 and P2, respectively, and markedly reduced
      levels of protein were detected in P3 EBV-B cells
    explanation: >-
      Demonstrates loss of DOCK2 protein in patient cells across three genotypes.
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      overexpression of Strep-HA-tagged DOCK2 bearing the p.F744Cfs*27 mutation
      (present in P4) shows expression of a truncated DOCK2 protein (Fig.S4B) which
      lacks the DHR2 domain critical for the DOCK2 GEF function
    explanation: >-
      Supports the second route stated in the description: a protein product is made
      but lacks the catalytic DHR2 domain.
- name: Failure of Receptor-Driven RAC1 Activation
  biological_scale: MOLECULAR
  description: >-
    DOCK2 is the exchange factor that loads GTP onto RAC1 downstream of the T-cell
    receptor and of chemokine receptors. In patient T cells, engaging CD3 fails to
    produce GTP-bound RAC1 at all, while control cells and a heterozygous carrier
    parent's cells do. This is the single molecular switch from which every
    downstream defect in this entry follows.
  biological_processes:
  - preferred_term: RAC1 signalling downstream of antigen and chemokine receptors
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016601
      label: Rac protein signal transduction
  downstream:
  - target: Defective Actin Polymerization and Leukocyte Chemotaxis
    causal_link_type: DIRECT
  - target: Impaired Neutrophil Respiratory Burst
    causal_link_type: DIRECT
  - target: Impaired NK Cell Degranulation
    causal_link_type: DIRECT
  - target: Diminished Type I and Type III Interferon Production
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon activation of polyclonal human T-cell lines with anti-CD3 mAb, GTP-bound
      RAC1 was clearly detected in T cells from the healthy control and from P2's
      mother, but not from P1 and P2
    explanation: >-
      Direct measurement of the failed RAC1 activation step in patient T cells, with
      a carrier control that shows heterozygosity is sufficient.
- name: Defective Actin Polymerization and Leukocyte Chemotaxis
  biological_scale: CELLULAR
  description: >-
    Without RAC1 activation, chemokine receptors cannot drive actin polymerization,
    so lymphocytes fail to migrate. Both the stimulated and the resting cytoskeleton
    are affected: CXCL12-induced actin polymerization is impaired and delayed, and
    baseline F-actin is reduced even before stimulation. Neutrophils are affected
    too, which is why DOCK2 deficiency is classified as a combined immunodeficiency
    with neutrophil abnormalities rather than a purely lymphoid defect.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: DECREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  - preferred_term: leukocyte chemotaxis
    modifier: DECREASED
    term:
      id: GO:0030595
      label: leukocyte chemotaxis
  downstream:
  - target: T Cell Lymphopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Impaired T Cell Activation and Antibody Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Chronic diarrhea and colitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The colitis biopsy shows a paucity of B and plasma cells in the lamina
      propria, which is the mucosal counterpart of the trafficking defect this node
      names. The route from failed chemotaxis to mucosal inflammation is not
      established in DOCK2 deficiency, so the edge is drawn with unknown
      intermediates rather than as a demonstrated mechanism.
  - target: Recurrent invasive bacterial infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, CXCL12-induced actin polymerization in T and B lymphocytes from
      P1 and P2 was impaired and delayed
    explanation: >-
      Measures the chemokine-driven actin defect in patient T and B cells.
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, baseline levels of polymerized actin (F-actin) were also
      reduced in DOCK2-deficient lymphocytes from P1 and P2
    explanation: >-
      Supports the specific claim that the resting cytoskeleton, not only the
      stimulated response, is affected.
  - reference: PMID:36947335
    reference_title: "Multiple Immune Defects in Two Patients with Novel DOCK2 Mutations Result in Recurrent Multiple Infection Including Live Attenuated Virus Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we noted neutrophil defects, the weakening of actin
      polymerization, and BCR internalization under TCR/BCR activation.
    explanation: >-
      Extends the actin defect to neutrophils, supporting the combined-with-neutrophil
      -abnormalities framing.
  - reference: PMID:30838481
    reference_title: "Human DOCK2 Deficiency: Report of a Novel Mutation and Evidence for Neutrophil Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, both cytoskeletal rearrangement and reactive oxygen species
      production are partially impaired in DOCK2-deficient neutrophils.
    explanation: >-
      First direct assessment of primary human DOCK2-deficient neutrophils,
      establishing both the cytoskeletal and the respiratory-burst defect.
- name: Impaired Neutrophil Respiratory Burst
  biological_scale: CELLULAR
  description: >-
    Primary DOCK2-deficient neutrophils generate reactive oxygen species poorly.
    This is a separate arm from the cytoskeletal defect and is not a consequence of
    it: RAC is a required component of the phagocyte NADPH oxidase complex as well
    as a cytoskeletal regulator, so a failure of RAC activation removes both. The
    reported impairment is partial, which is consistent with the disorder not
    behaving as a chronic granulomatous disease phenocopy.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: respiratory burst
    modifier: DECREASED
    term:
      id: GO:0045730
      label: respiratory burst
  downstream:
  - target: Recurrent invasive bacterial infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A partial respiratory-burst defect is one of several contributors to bacterial
      susceptibility here, alongside the T-cell and chemotaxis arms. No study
      apportions the contribution, so the edge is drawn with unknown intermediates.
  evidence:
  - reference: PMID:30838481
    reference_title: "Human DOCK2 Deficiency: Report of a Novel Mutation and Evidence for Neutrophil Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, both cytoskeletal rearrangement and reactive oxygen species
      production are partially impaired in DOCK2-deficient neutrophils.
    explanation: >-
      The direct measurement in primary human DOCK2-deficient neutrophils. The same
      sentence carries the cytoskeletal defect, which is curated on the chemotaxis
      node; this node takes the reactive-oxygen-species half.
- name: Impaired NK Cell Degranulation
  biological_scale: CELLULAR
  description: >-
    NK cells are present in normal numbers with a normal immunophenotype, but they
    do not degranulate on target engagement. The defect is receptor-general rather
    than adaptor-specific: it appears through CD16, NKp30, NKp46 (which signal via
    CD3-zeta and FcERI-gamma), NKp44 (DAP12) and NKG2D (DAP10) alike, which is what
    one expects if the shared downstream step - actin polymerization - is what is
    broken. Severity tracks residual DOCK2 protein.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell degranulation
    modifier: DECREASED
    term:
      id: GO:0043320
      label: natural killer cell degranulation
  downstream:
  - target: Recurrent invasive viral infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, NK cells from P1 and P2 showed impaired degranulation upon
      stimulation with the human erythroleukemia cell line K562
    explanation: >-
      Measures the degranulation failure in patient NK cells despite normal NK
      numbers.
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      observed severely impaired degranulation in P1 (Fig.3B), and moderately
      impaired in P2, likely corresponding to residual amounts of DOCK2 protein in
      P2's hematopoietic cells
    explanation: >-
      Supports the genotype-severity relationship: degranulation loss scales with
      residual protein.
- name: Diminished Type I and Type III Interferon Production
  biological_scale: CELLULAR
  description: >-
    Peripheral blood mononuclear cells from DOCK2-deficient patients make less
    interferon-alpha and interferon-lambda after viral exposure. This is a separate
    antiviral arm from the NK-cell one, and together with the fibroblast defect
    below it explains why invasive viral disease - including disease from live
    attenuated vaccine strains - is so prominent in this disorder.
  biological_processes:
  - preferred_term: type I interferon production
    modifier: DECREASED
    term:
      id: GO:0032606
      label: type I interferon production
  - preferred_term: type III interferon production
    modifier: DECREASED
    term:
      id: GO:0034343
      label: type III interferon production
  downstream:
  - target: Increased Viral Replication in Non-Haematopoietic Cells
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Recurrent invasive viral infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interferon-α and interferon-λ production by peripheral-blood mononuclear cells
      was diminished after viral infection.
    explanation: >-
      States the interferon production defect in patient PBMCs.
- name: Increased Viral Replication in Non-Haematopoietic Cells
  biological_scale: CELLULAR
  description: >-
    The cell-intrinsic defect that takes DOCK2 deficiency outside the usual
    boundaries of a combined immunodeficiency. Patient fibroblasts - which are not
    haematopoietic and do not express the immune receptors above - support increased
    viral replication and die more readily on infection. Both abnormalities are
    corrected by interferon alfa-2b or by re-expressing wild-type DOCK2, which
    establishes them as consequences of the DOCK2 lesion rather than incidental.
    This node is the reason HSCT is not expected to fully correct the phenotype.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: defense response to virus
    modifier: DECREASED
    term:
      id: GO:0051607
      label: defense response to virus
  downstream:
  - target: Recurrent invasive viral infections
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, in DOCK2-deficient fibroblasts, viral replication was increased and
      virus-induced cell death was enhanced; these conditions were normalized by
      treatment with interferon alfa-2b or after expression of wild-type DOCK2.
    explanation: >-
      Establishes the non-haematopoietic antiviral defect and its rescue, which is
      what makes it attributable to DOCK2 rather than to the immunodeficiency.
- name: T Cell Lymphopenia
  biological_scale: ORGANISM
  description: >-
    A quantitative T-cell deficit present in every reported patient. The naive
    compartment is depleted and the effector-memory compartment expanded, and
    T-cell receptor excision circles - a marker of thymic output - are already low
    on newborn dried blood spots, so the deficit is developmental rather than
    purely a consequence of infection. B cells are variably reduced. This is a
    cell-count claim and is kept separate from the functional activation defect
    below, which is measured differently and is not simply its consequence.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Decreased total T cell count
    causal_link_type: DIRECT
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all five patients, T-cell lymphopenia and impaired in vitro T-cell
      activation in response to PHA were documented
    explanation: >-
      Records the lymphopenia in the full index cohort. The same sentence carries
      the activation defect, which is curated on the separate node below.
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      levels of T-cell receptor excision circles (TRECs), a marker of active
      thymopoiesis, were markedly reduced in dried blood spots collected at birth in
      P2 and P4
    explanation: >-
      Supports the claim that thymic output is already reduced at birth, making the
      deficit developmental.
- name: Impaired T Cell Activation and Antibody Response
  biological_scale: CELLULAR
  description: >-
    A functional defect distinct from the cell count above: patient T cells
    proliferate poorly to phytohaemagglutinin, and antibody responses to
    T-dependent immunization antigens are defective even when total IgG and IgM are
    normal. Normal immunoglobulin levels with failed specific responses is the
    combination that makes a quantitative assay alone miss this disease.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Combined immunodeficiency
    causal_link_type: DIRECT
  - target: Recurrent invasive bacterial infections
    causal_link_type: DIRECT
  - target: Granulomatous inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Granulomatous lesions in this disorder are reported with mycobacteria in
      them, the organism class whose containment depends on T-cell help. The route
      is the general one for a T-cell defect rather than anything established in
      DOCK2 deficiency, so the edge is drawn with unknown intermediates.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all five patients, T-cell lymphopenia and impaired in vitro T-cell
      activation in response to PHA were documented
    explanation: >-
      Records the activation defect in the full index cohort. The same sentence
      carries the lymphopenia, which is curated on the separate node above.
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite normal IgG and IgM serum levels, P2, P4 and P5 showed defective
      antibody production to T-dependent immunization antigens
    explanation: >-
      Supports the specific claim that functional antibody responses fail even with
      normal total immunoglobulin.

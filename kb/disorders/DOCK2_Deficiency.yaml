name: DOCK2 Deficiency
creation_date: "2026-09-16T21:25:00Z"
description: >
  DOCK2 deficiency is an autosomal recessive combined immunodeficiency caused by
  biallelic loss-of-function variants in DOCK2, which encodes a haematopoietic
  atypical guanine nucleotide exchange factor for the small GTPase RAC1. Without
  DOCK2, antigen and chemokine receptors can no longer activate RAC1, so the actin
  polymerization that every downstream response depends on fails: T, B and NK
  cells cannot migrate towards chemokine, cannot build the cytoskeletal structures
  that receptor engagement requires, and NK cells cannot degranulate. The result
  is early-onset, invasive bacterial and viral infection with lymphopenia and
  defective T-, B- and NK-cell function. What makes the disorder mechanistically
  distinctive among the combined immunodeficiencies is that it is not confined to
  haematopoietic cells: DOCK2-deficient patients also have diminished type I and
  type III interferon production, and DOCK2-deficient fibroblasts support
  increased viral replication and enhanced virus-induced cell death - a
  cell-intrinsic, non-haematopoietic antiviral defect that is corrected by
  interferon alfa-2b. Allogeneic haematopoietic stem-cell transplantation
  normalizes T-cell function and is the only curative treatment, but it addresses
  only the haematopoietic half of the defect. The disease is no longer purely
  recessive: heterozygous variants in the ELMO1-binding region destabilize DOCK2
  and produce a milder, later-onset, virus-selective susceptibility in otherwise
  healthy people, so DOCK2-related immunodeficiency is better read as a
  dose-dependent continuum than a binary recessive condition.
category: Mendelian

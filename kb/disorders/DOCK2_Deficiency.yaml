prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Sixteen patients reported in the literature as of the 2023 review, all with a
    severe early-onset phenotype. No prevalence estimate exists.
  evidence:
  - reference: PMID:36947335
    reference_title: "Multiple Immune Defects in Two Patients with Novel DOCK2 Mutations Result in Recurrent Multiple Infection Including Live Attenuated Virus Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Until recently, only 16 DOCK2-deficient patients have been reported in the
      literature, and all had a severe phenotype characterized by early-onset of
      recurrent, invasive viral, and bacterial infections associated with T and B
      cell lymphopenia
    explanation: >-
      Gives an explicit worldwide case count. Graded HUMAN_CLINICAL for the
      clinical picture it describes, with quote_role BACKGROUND because the sentence
      sits in this paper's introduction summarizing others' cases rather than
      reporting its own.
genetic:
- name: DOCK2
  gene_term:
    preferred_term: DOCK2
    term:
      id: hgnc:2988
      label: DOCK2
  presence: Positive
  association: Biallelic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Seven distinct rare DOCK2 variants were identified in the five index patients -
    four leading to premature termination and three predicted-deleterious missense
    changes at conserved residues. Further novel alleles have been reported since.
    Genotypes include homozygous dinucleotide insertions causing frameshift,
    homozygous missense, and compound heterozygous missense/nonsense.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, we identified seven distinct DOCK2 rare mutations in five
      patients of different ethnic origin, four of which lead to premature
      termination, and three of which were predicted deleterious missense mutations
      affecting conserved residues of DOCK2
    explanation: >-
      Documents the allelic spectrum stated in the notes.
diagnosis:
- name: Molecular and Functional Diagnosis of DOCK2 Deficiency
  description: >-
    The diagnosis is genetic: biallelic DOCK2 variants on a primary-immunodeficiency
    panel or exome sequencing in a child with early-onset invasive infection and
    lymphopenia. Supporting functional assays, where available, are RAC1 activation
    after CD3 stimulation, chemokine-induced actin polymerization and chemotaxis,
    and NK-cell degranulation. Low TRECs on newborn screening can be the first
    signal.
  notes: >-
    The diagnosis is easy to miss. In one reported case it was made 18 years after
    the patient had already been transplanted for a presumed combined
    immunodeficiency of unknown cause, and in another the transplant was performed
    before the genetic diagnosis was available. Anyone transplanted for undefined
    CID is a candidate for retrospective genetic diagnosis, which matters because
    the non-haematopoietic arm of the disease is not corrected by the transplant.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with clinical features of combined immunodeficiencies, especially
      with early-onset, invasive infections, may have this condition.
    explanation: >-
      The authors' own statement of who should be tested.
  - reference: PMID:35023658
    reference_title: "Hematopoietic stem cell transplantation complicated with EBV associated hemophagocytic lymphohistiocytosis in a patient with DOCK2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent HSCT without conditioning regimen before the genetic diagnosis
    explanation: >-
      Documents a case transplanted before the genetic diagnosis was made,
      supporting the retrospective-diagnosis point in the notes.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only curative treatment. Three of the five index patients were transplanted
    and had normalization of T-cell function and clinical improvement, one of them
    still well 17.5 years later. Transplantation replaces the haematopoietic
    compartment and therefore addresses the lymphocyte and NK arms; it does not
    obviously address the fibroblast-intrinsic antiviral defect, which is a reason
    to follow transplanted patients for viral disease rather than assume cure.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Lymphopenia and Impaired T Cell Activation
    description: >-
      Replaces the DOCK2-deficient haematopoietic compartment with donor cells that
      can activate RAC1 normally.
  evidence:
  - reference: PMID:26083206
    reference_title: "Inherited DOCK2 Deficiency in Patients with Early-Onset Invasive Infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients died early in childhood; after allogeneic hematopoietic
      stem-cell transplantation, the other three had normalization of T-cell
      function and clinical improvement.
    explanation: >-
      Reports the outcome of transplantation in the index cohort, including the
      normalization of T-cell function.
  notes: >-
    Transplant complications are reported: EBV-associated haemophagocytic
    lymphohistiocytosis after HSCT performed without a conditioning regimen.
- name: Interferon Alfa Therapy for Viral Complications
  description: >-
    Interferon alfa is the one mechanistically grounded adjunct short of transplant.
    It corrects the fibroblast antiviral defect in vitro, and weekly interferon-alfa
    completely resolved refractory warts in one patient with a heterozygous
    ELMO1-binding-domain variant. This is a single-patient observation in the
    hypomorphic form, not a trial and not evidence in the recessive form; it is
    curated here because it is the direct clinical counterpart of the in vitro
    rescue this entry already records.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Increased Viral Replication in Non-Haematopoietic Cells
    description: >-
      Supplies the interferon signal that DOCK2-deficient cells fail to produce,
      restoring the antiviral state in cells that remain genetically deficient.
  evidence:
  - reference: PMID:41654261
    reference_title: "Heterozygous variants in DOCK2 leading to susceptibility to viral illnesses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Weekly IFN-α therapy led to complete resolution of refractory warts in 1
      patient, highlighting a potential therapeutic approach for DOCK2-associated
      immunodeficiency.
    explanation: >-
      The single clinical observation behind this treatment, quoted with its own
      hedging intact.
- name: Immunoglobulin Replacement and Anti-Infective Supportive Care
  description: >-
    Intravenous immunoglobulin and antimicrobial prophylaxis while awaiting
    transplantation, or where transplantation is not undertaken. Partial and
    palliative only.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36947335
    reference_title: "Multiple Immune Defects in Two Patients with Novel DOCK2 Mutations Result in Recurrent Multiple Infection Including Live Attenuated Virus Vaccine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient's condition was partially alleviated by symptomatic treatment or
      intravenous immunoglobulin.
    explanation: >-
      Documents partial benefit from immunoglobulin and symptomatic care, and its
      limits.
animal_models:
- name: DOCK2-deficient mouse (HSV-1 challenge)
  species: Mouse
  genotype: Dock2-deficient
  publication: PMID:38366567
  description: >-
    A mouse model developed specifically to separate DOCK2's own contribution to
    antiviral immunity from the treatments and comorbid infections that confound
    interpretation in patients.
  modeled_mechanisms:
  - target: Lymphopenia and Impaired T Cell Activation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Identifies a cell-intrinsic DOCK2 requirement for the initial expansion of
      antiviral CD8+ T cells, a step that is not visible in the human data because
      early activation markers look normal.
    limitations: >-
      The human node covers T-cell lymphopenia, reduced thymic output and failed
      proliferation to mitogen; the mouse result speaks only to antigen-specific
      CD8+ expansion after priming. The mouse also shows that DOCK2-deficient CD8+
      cells are protective once primed in vitro, a rescue with no human counterpart,
      so the model bears on the mechanism of the T-cell defect rather than on its
      clinical severity.
    readouts:
    - name: Antiviral CD8+ T-cell expansion after HSV-1 priming
      target: Lymphopenia and Impaired T Cell Activation
      direction: DECREASED
      interpretation: >-
        The expansion deficit is the functional correlate of the human T-cell
        activation defect.
      evidence:
      - reference: PMID:38366567
        reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We also uncovered a critical, cell-intrinsic role of DOCK2 in the priming
          of antiviral CD8+ T cells and in particular their initial expansion,
          despite apparently normal early activation of these cells.
        explanation: >-
          Reports the measured expansion defect and its cell-intrinsic nature.
    evidence:
    - reference: PMID:38366567
      reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results shed light on a cellular deficiency that is likely to impact
        antiviral immunity in DOCK2-deficient patients.
      explanation: >-
        The authors' own statement of the model's intended relevance to the human
        disease.
  - target: Recurrent invasive viral infections
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Delayed clearance of herpes simplex virus type 1, an organism-level antiviral
      phenotype matching the herpesvirus susceptibility seen in patients.
    limitations: >-
      Delayed clearance of a single experimentally administered virus is a much
      milder phenotype than the fatal disseminated varicella and vaccine-strain
      disease reported in patients, so the model reproduces the direction of the
      defect but not its clinical magnitude.
    evidence:
    - reference: PMID:38366567
      reference_title: "DOCK2 Deficiency Causes Defects in Antiviral T-Cell Responses and Impaired Control of Herpes Simplex Virus Infection."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We developed a mouse model of DOCK2 immunodeficiency and herein demonstrate
        that these mice have delayed clearance of herpes simplex virus type 1
        (HSV-1) infections.
      explanation: >-
        Reports the organism-level viral clearance defect in the model.
discussions:
- discussion_id: hsct_does_not_correct_stromal_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased Viral Replication in Non-Haematopoietic Cells
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
  prompt: >-
    Does haematopoietic stem cell transplantation correct the non-haematopoietic,
    fibroblast-intrinsic antiviral defect in DOCK2 deficiency, and if not, what is
    the long-term viral risk in transplanted patients?
  rationale: >-
    The index report establishes two separable arms: a haematopoietic defect that
    transplantation demonstrably corrects, and a cell-intrinsic antiviral defect in
    fibroblasts that transplantation has no obvious mechanism to touch, since the
    recipient's stromal cells remain DOCK2-deficient. Transplanted patients are
    reported as "alive and well", but the longest follow-up reported is 17.5 years
    in one patient and the others are measured in months, and no study has asked
    whether stromal viral susceptibility persists. If it does, the standard framing
    of HSCT as curative for this disorder is incomplete, and interferon alfa-2b -
    which corrects the fibroblast phenotype in vitro - would be worth evaluating as
    an adjunct rather than only as a mechanistic probe.
- discussion_id: rac1_to_interferon_link
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Diminished Type I and Type III Interferon Production
  prompt: >-
    By what route does loss of DOCK2-dependent RAC1 activation reduce type I and
    type III interferon production?
  rationale: >-
    The entry draws this edge as INDIRECT_UNKNOWN_INTERMEDIATES because no
    intermediate is established. RAC1 activation downstream of antigen and chemokine
    receptors is a cytoskeletal signal, and the canonical antiviral interferon
    induction pathways run through RIG-I/MDA5 and TLR sensing, not through DOCK2.
    Whether the interferon defect is a direct signalling consequence, a consequence
    of impaired endosomal trafficking of nucleic acid sensors, or simply a knock-on
    of the reduced and abnormal plasmacytoid dendritic cell compartment has not been
    resolved. The answer determines whether interferon supplementation is treating
    the lesion or bypassing it.
notes: >-
  Not curated: the detailed NK receptor-by-receptor degranulation data (CD16,
  NKp30, NKp44, NKp46, NKG2D) and the MEK/ERK phosphorylation findings from
  PMID:26083206. They are real and support the "shared downstream step" argument in
  the NK node, but curating each receptor as its own node would multiply the
  pathograph without adding a distinct mechanistic claim.

  PMID:33928462 ("DOCK2 Deficiency Diagnosed 18 Years After Hematopoietic Stem Cell
  Transplantation") is cited nowhere in this entry although it is directly relevant
  to the late-diagnosis point in `diagnosis.notes`. The reference fetcher returns
  content type "unavailable" for it - neither abstract nor full text is
  retrievable - so there is no quotable text, and this repository does not permit
  hand-writing a cache file. The late-diagnosis claim is instead supported from
  PMID:35023658, which is cached and makes the weaker but quotable version of the
  same point.

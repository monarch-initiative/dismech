treatments:
- name: Dopamine Agonist Therapy
  description: >-
    Cabergoline or quinagolide normalised prolactin in heterozygous carriers.
    Because the receptor itself is defective, lowering prolactin treats the
    laboratory value; whether it improves fertility in this disorder has not
    been shown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

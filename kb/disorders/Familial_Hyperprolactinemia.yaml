  evidence:
  - reference: PMID:30575453
    reference_title: "Variant Prolactin Receptor in Agalactia and Hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a 35-year-old woman who presented with idiopathic hyperprolactinemia that was associated with a complete lack of lactation after each of her two deliveries."
    explanation: Agalactia in the compound heterozygous patient.
diagnosis:
- name: Exclusion of pituitary and secondary causes, then PRLR sequencing
  description: >-
    Familial hyperprolactinemia is diagnosed after confirming persistent true
    hyperprolactinemia (macroprolactin negative), finding a normal pituitary
    MRI, excluding drugs and other secondary causes, and identifying a
    pathogenic germline PRLR variant. MEN1 and AIP testing was negative in the
    discovery kindred.
  diagnosis_term:
    preferred_term: PRLR molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA sequence analysis did not identify any mutations of MEN1 or the aryl hydrocarbon–interacting protein gene (AIP), which is associated with the familial isolated pituitary adenoma syndrome."
    explanation: Pituitary tumour predisposition genes were excluded before the PRLR variant was found.
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Results of MRI of the pituitary gland | Normal | Normal | Normal"
    explanation: All three affected sisters had a normal pituitary MRI.
treatments:
- name: Dopamine Agonist Therapy
  description: >-
    Cabergoline normalised prolactin in the proband and quinagolide in one
    sister; the third sister was untreated. Because the receptor itself is defective, lowering prolactin treats the
    laboratory value; whether it improves fertility in this disorder has not
    been shown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cabergoline
      term:
        id: CHEBI:3286
        label: cabergoline
    - preferred_term: quinagolide
      term:
        id: CHEBI:135627
        label: quinagolide
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolactin level normalized with cabergoline, 0.5 mg/wk"
    explanation: Cabergoline normalised prolactin in the proband.
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolactin level normalized with quinagolide, 75 μg/day"
    explanation: Quinagolide normalised prolactin in one sister.

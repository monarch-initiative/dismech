discussions:
- discussion_id: fhp_pituitary_tumour_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why do Prlr-null mice develop lactotroph hyperplasia and prolactinomas when
    patients with PRLR loss of function have normal pituitary MRI?
  attaches_to:
  - pathophysiology#Lactotroph Disinhibition and Prolactin Hypersecretion
  rationale: >-
    The mouse model reproduces the hyperprolactinemia but adds pituitary
    tumours. In humans, the heterozygous sisters were in their thirties and
    forties and the biallelic patient also had no visible adenoma, so it is
    unknown whether the difference is age, gene dosage or species.
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of abnormal findings on MRI of the pituitary gland in the sisters reported here contrasts with findings in female Prlr-null mice, which had pituitary hyperplasia by 6 months of age and large tumors by late adulthood"
    explanation: States the mismatch directly.
  - reference: PMID:36744975
    reference_title: "[Prolactin and its receptor: From animal models to pituitary pathophysiology]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "since the only patient with biallelic PRLR loss-of-function mutation leading to complete prolactin resistance that has been described so far did not have pituitary adenoma visible on MRI."
    explanation: The mismatch also holds for complete (biallelic) receptor loss.
- discussion_id: fhp_reproductive_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does PRLR loss of function cause oligomenorrhea and infertility?
  attaches_to:
  - phenotypes#Oligomenorrhea
  - phenotypes#Female infertility
  rationale: >-
    Acquired hyperprolactinemia suppresses the gonadal axis through prolactin
    acting on its receptor in the hypothalamus, which a non-signalling receptor
    should not do. The discovery paper offers age-related rises in prolactin,
    luteal or peri-implantation roles of prolactin, and mixed mutant/wild-type
    receptor dimers as possibilities, without testing any. The reproductive
    phenotypes are therefore left unconnected to a mechanism.
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the balance among the normal prolactin-receptor homodimers, mutant homodimers, and heterodimers within cells of the hypothalamic–pituitary–gonadal axis may also contribute to these phenotypic variations."
    explanation: The authors frame the reproductive mechanism as unresolved.

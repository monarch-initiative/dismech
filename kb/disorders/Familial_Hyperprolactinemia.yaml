    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report data from three sisters with hyperprolactinemia, two of whom presented with oligomenorrhea and one with infertility."
    explanation: Two of three affected sisters presented with oligomenorrhea.
- name: Menorrhagia
  category: Reproductive
  description: Heavy menstrual bleeding alongside oligomenorrhea in the proband.
  phenotype_term:
    preferred_term: Menorrhagia
    term:
      id: HP:0000132
      label: Menorrhagia
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2-year history of oligomenorrhea and menorrhagia"
    explanation: Menorrhagia in the heterozygous proband.
- name: Female infertility
  category: Reproductive
  description: Primary infertility, reported in one sister despite normal ovulatory cycles.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the 38-year-old sister described here had infertility but normal ovulatory cycles, thereby implicating another role for prolactin and the prolactin receptor in regulating fertility."
    explanation: Infertility in a heterozygous carrier with ovulatory cycles.
- name: Galactorrhea
  category: Reproductive
  description: >-
    Persistent postpartum galactorrhea after weaning in a heterozygous carrier,
    requiring a dopamine agonist to stop. In a prolactin-resistant carrier this
    is paradoxical; residual wild-type receptor signalling at high prolactin is
    one possible explanation, but it has not been tested.
  phenotype_term:
    preferred_term: Persistent postpartum galactorrhea
    term:
      id: HP:0100829
      label: Galactorrhea
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after the cessation of breast-feeding after each pregnancy, she had required dopamine agonist therapy to terminate persistent galactorrhea."
    explanation: Galactorrhea in the heterozygous proband.
  - reference: PMID:30575453
    reference_title: "Variant Prolactin Receptor in Agalactia and Hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "A loss-of-function variant in the gene encoding the prolactin receptor ( PRLR) was reported previously in a woman with persistent postpartum galactorrhea; however, this paradoxical phenotype is not completely understood."
    explanation: Later authors flag the galactorrhea as paradoxical for a receptor loss-of-function carrier.
- name: Agalactia
  category: Reproductive
  description: Complete absence of lactation after delivery in a woman with biallelic PRLR loss of function.
  phenotype_term:

name: Familial Hyperprolactinemia
creation_date: "2026-10-25T00:00:00Z"
category: Genetic
categories:
- Endocrine Disorder
parents:
- hyperprolactinemia
disease_term:
  preferred_term: familial hyperprolactinemia
  term:
    id: MONDO:0014250
    label: familial hyperprolactinemia
synonyms:
- familial isolated prolactin receptor deficiency
- hereditary hyperprolactinemia
- familial idiopathic hyperprolactinemia
- prolactin insensitivity
description: >-
  Familial hyperprolactinemia is a rare inherited form of persistent
  hyperprolactinemia without a pituitary tumour, caused by germline
  loss-of-function variants in the prolactin receptor gene PRLR. The defective
  receptor fails to activate JAK2-STAT5 signalling, so target tissues are
  insensitive to prolactin and the feedback by which prolactin restrains its own
  secretion is weakened. Circulating prolactin rises after puberty. A
  heterozygous extracellular-domain variant (His188Arg) segregated with
  hyperprolactinemia, oligomenorrhea and infertility in one kindred, and a
  compound heterozygous woman with complete prolactin resistance had
  hyperprolactinemia with absent lactation after delivery.
notes: >-
  No GeneReviews chapter covers this disorder (just check-genereviews, Bookshelf
  index 2026-09-10 plus a live PubMed title search: NO_CHAPTER). The published
  human evidence is two families: the His188Arg kindred (PMID:24195502) and the
  Arg171Ter/Pro269Leu compound heterozygote (PMID:30575453). Despite the
  proposed immune roles of prolactin, affected members of the His188Arg kindred
  had no immunological abnormalities, which the authors relate to Prlr-null mice
  showing prolactin is not an obligate lymphopoietic hormone.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A heterozygous PRLR His188Arg variant co-segregated with hyperprolactinemia
    in a three-generation kindred; a prepubertal carrier had normal prolactin,
    consistent with age-related penetrance.
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Family members with normal prolactin levels were homozygous for nonmutant alleles, where-as affected family members were heterozygous, with 1 nonmutant allele and 1 mutant allele, which is consistent with an autosomal dominant inheritance for the disease."
    explanation: Co-segregation of the heterozygous variant with hyperprolactinemia in the discovery kindred.
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A mutation carrier (Family Member III.3), who was 13 years of age and prepubertal at the time of testing, did not have hyperprolactinemia, probably owing to an age-related penetrance for the disease"
    explanation: A prepubertal carrier had normal prolactin, the basis for age-related penetrance.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic (compound heterozygous) PRLR loss-of-function variants caused
    complete prolactin resistance with hyperprolactinemia and agalactia in a
    woman whose heterozygous parents were unaffected.
  evidence:
  - reference: PMID:30575453
    reference_title: "Variant Prolactin Receptor in Agalactia and Hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She is a compound heterozygote for loss-of-function variants of PRLR. Her unaffected parents are heterozygotes."
    explanation: Biallelic inheritance with unaffected heterozygous parents.
genetic:
- name: PRLR
  gene_term:
    preferred_term: PRLR
    term:
      id: hgnc:9446
      label: PRLR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    Germline loss-of-function PRLR variants: heterozygous His188Arg in the
    high-affinity ligand-binding interface, and compound heterozygous
    Arg171Ter/Pro269Leu.
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the familial hyperprolactinemia appears to be due to a germline, loss-of-function mutation in PRLR, resulting in prolactin insensitivity."
    explanation: Discovery paper identifying PRLR loss of function as the cause.
  - reference: PMID:36445946
    reference_title: "Identification of prolactin receptor variants with diverse effects on receptor signalling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast, an inactivating germline heterozygous PRLR variant (His188Arg) was reported in a kindred with hyperprolactinaemia, while an inactivating compound heterozygous PRLR variant (Pro269Leu/Arg171Stop) was identified in an individual with hyperprolactinaemia and agalactia."
    explanation: Summarises both reported loss-of-function genotypes; the citing paper is an in vitro variant study restating the human reports.
pathophysiology:
- name: PRLR Loss of Function
  description: >-
    Germline PRLR variants abolish prolactin-receptor signalling. His188Arg
    removes a histidine at the high-affinity binding site 1 interface; the
    mutant receptor is expressed and localised normally but does not signal.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: PRLR
    term:
      id: hgnc:9446
      label: PRLR
  molecular_functions:
  - preferred_term: prolactin receptor activity
    term:
      id: GO:0004925
      label: prolactin receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This substitution disrupted the high-affinity ligand-binding interface of the prolactin receptor, resulting in a loss of downstream signaling by Janus kinase 2 (JAK2) and signal transducer and activator of transcription 5 (STAT5)."
    explanation: Structural modelling and HEK293 transfection show the variant disrupts ligand binding and abolishes receptor signalling.
  downstream:
  - target: Impaired JAK2-STAT5 Prolactin Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24195502
      reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, nonmutant His188, but not mutant Arg188 or Ala188, prolactin receptors showed a significant increase in phosphorylated JAK2 and STAT5A when treated with prolactin"
      explanation: In transfected HEK293 cells the mutant receptor fails to activate JAK2-STAT5 on prolactin stimulation.
- name: Impaired JAK2-STAT5 Prolactin Signaling
  description: >-
    Prolactin no longer activates JAK2 and STAT5 through the mutant receptor,
    and STAT5-dependent gene expression is lost. Co-expression of mutant and
    wild-type receptors also reduces signalling, consistent with
    haploinsufficiency or a dominant-negative effect in heterozygotes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: prolactin signaling pathway
    term:
      id: GO:0038161
      label: prolactin signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cotransfection with non-mutant His188 and mutant Arg188 PRLR constructs resulted in a reduction of CISH reporter expression, which is consistent with a loss of function and a probable dominant-negative action of the mutant prolactin receptor"
    explanation: Loss of STAT5-dependent transcription, including when mutant and wild-type receptors are co-expressed as in heterozygous patients.
  downstream:
  - target: Loss of Short-Loop Dopaminergic Feedback
    evidence:
    - reference: PMID:24195502
      reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hyperprolactinemia in these women responded to dopamine agonist therapy, thereby indicating preservation of dopamine D2–recep-tor signaling; this is consistent with the findings in mice null for the prolactin receptor gene, which had reduced hypothalamic dopaminergic tone, indicating a probable loss of negative feedback."
      explanation: Preserved dopamine-agonist response in carriers locates the defect upstream of the lactotroph D2 receptor, consistent with lost feedback; an inference from treatment response, not a measurement of hypothalamic dopamine.
  - target: Lactotroph Disinhibition and Prolactin Hypersecretion
    evidence:
    - reference: PMID:12370275
      reference_title: "Lack of prolactin receptor signaling in mice results in lactotroph proliferation and prolactinomas by dopamine-dependent and -independent mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that PRL inhibits lactotrophs by two distinct mechanisms: (a) indirectly by activation of hypothalamic dopamine neurons and (b) directly within the pituitary in a dopamine-independent fashion."
      explanation: Supports a direct, dopamine-independent pituitary arm of prolactin self-restraint that is lost with the receptor.
  - target: Mammary Prolactin Resistance
  - target: Reproductive Tract Prolactin Resistance
- name: Loss of Short-Loop Dopaminergic Feedback
  description: >-
    Prolactin normally acts on PRLR in hypothalamic tuberoinfundibular dopamine
    neurons to increase dopamine release onto lactotrophs. Without receptor
    signalling, dopamine tone on the pituitary falls.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: tuberoinfundibular dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:12370275
    reference_title: "Lack of prolactin receptor signaling in mice results in lactotroph proliferation and prolactinomas by dopamine-dependent and -independent mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Pharmacologic studies in Prlr(-/-) mice with D2R agonists and antagonists demonstrated a significant loss of endogenous dopamine tone, i.e., constitutive inhibitory signaling by the D2R, in the pituitary."
    explanation: Prlr-null mice lose dopaminergic inhibition of the pituitary.
  - reference: PMID:30759390
    reference_title: "Elevated Prolactin during Pregnancy Drives a Phenotypic Switch in Mouse Hypothalamic Dopaminergic Neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "These neurons normally release dopamine to inhibit prolactin secretion and are activated by prolactin in a short-loop feedback manner."
    explanation: States the normal short-loop circuit whose prolactin-receptor arm is lost in this disorder.
  downstream:
  - target: Lactotroph Disinhibition and Prolactin Hypersecretion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27581458
      reference_title: "Conditional Deletion of the Prolactin Receptor Reveals Functional Subpopulations of Dopamine Neurons in the Arcuate Nucleus of the Hypothalamus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, Prlr deletion from all dopamine neurons resulted in profound hyperprolactinemia."
      explanation: Removing PRLR only from dopamine neurons is sufficient to produce hyperprolactinemia.
- name: Lactotroph Disinhibition and Prolactin Hypersecretion
  description: >-
    With reduced dopaminergic inhibition and loss of direct autocrine/paracrine
    restraint, pituitary lactotrophs secrete excess prolactin. Patients have no
    pituitary lesion on MRI, unlike Prlr-null mice, which develop lactotroph
    hyperplasia and prolactinomas.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: lactotroph
    term:
      id: CL:0000439
      label: prolactin secreting cell
  biological_processes:
  - preferred_term: prolactin secretion
    term:
      id: GO:0070459
      label: prolactin secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:12370275
    reference_title: "Lack of prolactin receptor signaling in mice results in lactotroph proliferation and prolactinomas by dopamine-dependent and -independent mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The absence of either receptor induced hyperprolactinemia and large prolactinomas in females."
    explanation: Loss of the prolactin receptor produces hyperprolactinemia in mice.
  downstream:
  - target: Hyperprolactinemia
- name: Mammary Prolactin Resistance
  description: >-
    Mammary epithelium cannot respond to prolactin, so lactation fails despite
    high prolactin. In humans this is reported with biallelic loss; a
    heterozygous His188Arg carrier lactated after each of four pregnancies.
    Heterozygous Prlr-knockout mice show a dosage effect, failing to lactate
    after a first pregnancy but not after later ones.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: mammary luminal epithelial cell
    term:
      id: CL:0002326
      label: luminal epithelial cell of mammary gland
  biological_processes:
  - preferred_term: lactation
    term:
      id: GO:0007595
      label: lactation
    modifier: DECREASED
  evidence:
  - reference: PMID:30575453
    reference_title: "Variant Prolactin Receptor in Agalactia and Hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complete lack of lactation after each of her two deliveries. She is a compound heterozygote for loss-of-function variants of PRLR."
    explanation: Absent lactation in a woman with biallelic PRLR loss of function.
  - reference: PMID:9009200
    reference_title: "Null mutation of the prolactin receptor gene produces multiple reproductive defects in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Heterozygous females showed almost complete failure of lactation attributable to greatly reduced mammary gland development after their first, but not subsequent, pregnancies."
    explanation: Halving receptor dosage is enough to impair mammary development and lactation in mice.
  downstream:
  - target: Agalactia
- name: Reproductive Tract Prolactin Resistance
  description: >-
    In rodents prolactin is luteotrophic and its receptor is required for
    embryonic implantation; in humans the corpus luteum is LH-dependent, and
    prolactin's reproductive-tract role is less defined. Loss of receptor
    signalling is proposed to impair fertility independently of ovulation: one
    heterozygous carrier was infertile with normal ovulatory cycles, and
    Prlr-null female mice are sterile from implantation failure. The human step
    is inferred, not demonstrated.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Indeed, prolactin and the prolactin receptor have been reported to have roles in the luteal phase and peri-implantation period, and abnormalities of circulating prolactin have been associated with early pregnancy loss."
    explanation: The authors' proposed explanation for infertility with normal ovulation in a carrier; a hypothesis, not a measurement in the patient.
  - reference: PMID:9009200
    reference_title: "Null mutation of the prolactin receptor gene produces multiple reproductive defects in the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous females were sterile owing to a complete failure of embryonic implantation."
    explanation: Complete receptor loss abolishes implantation in mice.
  downstream:
  - target: Female infertility
phenotypes:
- name: Hyperprolactinemia
  category: Endocrine
  description: >-
    Persistent elevation of serum prolactin without a pituitary lesion,
    macroprolactin negative. It appears after puberty and is higher in women
    than in men.
  phenotype_term:
    preferred_term: Hyperprolactinemia
    term:
      id: HP:0000870
      label: Increased circulating prolactin concentration
  evidence:
  - reference: PMID:24195502
    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The hyperprolactinemia in this pedigree was found only in postpubertal family members, and the serum prolactin concentrations were higher in women than in men"
    explanation: Hyperprolactinemia in carriers, with postpubertal onset and higher levels in women.
  - reference: PMID:30575453
    reference_title: "Variant Prolactin Receptor in Agalactia and Hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a 35-year-old woman who presented with idiopathic hyperprolactinemia that was associated with a complete lack of lactation after each of her two deliveries."
    explanation: Hyperprolactinemia in the biallelic patient.
- name: Oligomenorrhea

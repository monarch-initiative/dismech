    reference_title: "Mutant prolactin receptor and familial hyperprolactinemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolactin level normalized with cabergoline, 0.5 mg/wk"
    explanation: Cabergoline normalised prolactin in the proband.

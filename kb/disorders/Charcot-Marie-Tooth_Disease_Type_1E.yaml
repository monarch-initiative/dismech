- category: Electrophysiologic
  name: Decreased motor nerve conduction velocity
  description: >-
    Uniformly slowed motor conduction is the electrophysiological signature of
    demyelinating CMT1 and the finding that directs genetic testing toward PMP22.
  phenotype_term:

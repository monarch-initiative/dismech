- category: Respiratory
  name: Respiratory insufficiency
  description: >-
    Respiratory involvement is recognized in neuropathic patients and has now been
    characterized in the Trembler-J CMT1E model, where phrenic myelin defects are
    accompanied by diaphragm remodelling. Recorded as an uncommon feature rather than a
    core one.
  phenotype_term:
    preferred_term: Respiratory insufficiency
    term:
      id: HP:0002093
      label: Respiratory insufficiency
  evidence:
  - reference: PMID:42105803
    reference_title: "Diaphragm hypertrophy and spinal stress response accompany phrenic myelin defects in a murine model of Charcot-Marie-Tooth Disease Type 1E."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Respiratory problems are known to impact neuropathic patients, yet existing studies have not characterized this pathophysiology in corresponding animal models."
    explanation: >-
      A mouse study of CMT1E, quoted for the human clinical premise stated in its
      opening sentence - hence HUMAN_CLINICAL with quote_role BACKGROUND, which is
      exactly the pairing CLAUDE.md documents this combination for. Graded INDIRECT

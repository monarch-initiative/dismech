  - target: Pes cavus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Hammertoe
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same intermediates as pes cavus: chronic denervation imbalance between the
      intrinsic foot muscles and the long extrinsic flexors and extensors. The two
      deformities are reported together and at the same frequency tier.
  - target: Distal amyotrophy
    causal_link_type: DIRECT
    description: >-
      Wasting is the structural counterpart of the weakness node, from denervation of
      the same distal muscles rather than from a separate process.
  - target: Sensorineural hearing impairment
    causal_link_type: UNKNOWN
    description: >-
      Drawn as UNKNOWN deliberately. Hearing loss is strongly associated with CMT1E
      and is the feature that distinguishes it, but none of the sources here shows the
      cochlear or auditory-nerve lesion that produces it, so whether it follows from
      the same demyelination or from a separate PMP22 role in the auditory system is
      not established by this entry's evidence.
  evidence:

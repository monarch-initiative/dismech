    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: myelination in peripheral nervous system
    modifier: DECREASED
    term:
      id: GO:0022011
      label: myelination in peripheral nervous system
  downstream:
  - target: Demyelination of Peripheral Nerve
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17701891
    reference_title: "Oral curcumin mitigates the clinical and neuropathologic phenotype of the Trembler-J mouse: a potential therapy for inherited neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Administration of curcumin significantly decreases the percentage of apoptotic Schwann cells and results in increased number and size of myelinated axons"
    explanation: >-
      A rescue result cited as validation of the mechanism it targets, which is an
      inference step: reducing apoptosis improves myelination, so apoptosis is
      upstream of the myelination failure. Graded INDIRECT for that reason, and
      MODEL_ORGANISM because the quoted measurement is in the Trembler-J mouse.
- name: Altered Store-Operated Calcium Handling
  description: >-
    A third consequence of the mutant protein, on a different axis from proteostasis
    and lipid trafficking. PMP22 modulates store-operated calcium channel activity:
    heterologous expression increases currents resembling those carried by
    store-operated channels, particularly TRPC1. A PMP22 whose amount or sequence is
    abnormal therefore changes Schwann-cell calcium handling as well as its own
    disposal and its lipid environment.

    Marked PROVISIONAL and drawn as an INDIRECT edge. The measurement is in a
    heterologous expression system, and it is about PMP22 rather than about a CMT1E
    allele specifically, so its weight for this disease is inferential.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  downstream:
  - target: Schwann Cell Apoptosis and Failure of Myelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31213528
    reference_title: "Peripheral myelin protein 22 modulates store-operated calcium channel activity, providing insights into Charcot-Marie-Tooth disease etiology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "heterologous PMP22 expression increases the amplitude of currents similar to those ascribed to store-operated calcium (SOC) channels, particularly those involving transient receptor canonical channel 1 (TrpC1)."
    explanation: >-
      The electrophysiological measurement. Graded INDIRECT because it establishes that
      PMP22 modulates these currents, not that a CMT1E allele's effect on them causes
      disease; the authors' own framing is that the role of PMP22 in Schwann cell
      physiology is not well understood.
- name: Extracellular Matrix Remodelling With Macrophage-Derived Metalloproteinases
  description: >-
    The inflammatory arm, and the only route in this entry to a cellular participant
    other than the Schwann cell. In Trembler-J nerve the basement membrane is
    remodelled - laminin modestly increased, full-length collagen IV and fibronectin
    decreased - with MMP-2 and MMP-9 detectable and gelatinolytic activity up. The
    paper attributes a significant share of both enzymes to infiltrating macrophages.

    This matters because the rest of the pathograph is Schwann-cell-autonomous, so
    without this node the entry would imply that nothing else participates in the nerve
    pathology.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: infiltrating macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: extracellular matrix disassembly
    modifier: INCREASED
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
  downstream:
  - target: Demyelination of Peripheral Nerve
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:12421361
    reference_title: "Matrix metalloproteinase mediated degradation of basement membrane proteins in Trembler J neuropathy nerves."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In TrJ nerves, laminin is modestly increased while full-length forms of collagen IV and fibronectin are decreased."
    explanation: >-
      The measured basement-membrane changes, which is what "remodelling" means here
      rather than a general inflammatory description.
  - reference: PMID:12421361
    reference_title: "Matrix metalloproteinase mediated degradation of basement membrane proteins in Trembler J neuropathy nerves."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "macrophages are a significant source of both MMP-2 and MMP-9."
    explanation: >-
      Attributes the enzymes to infiltrating macrophages, which is the basis for binding
      a macrophage cell type on this node rather than treating the remodelling as
      Schwann-cell-autonomous.
- name: Demyelination of Peripheral Nerve
  description: >-
    Dysmyelination and demyelination of peripheral nerve in a bilateral, symmetric,
    length-dependent distribution, with uniformly slowed motor conduction and
    secondary axonal loss. The axonal loss is what the clinical impairment tracks.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

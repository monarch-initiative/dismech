    causal_link_type: DIRECT
  - target: Cholesterol Sequestration in the Golgi
    causal_link_type: DIRECT
    description: >-
      The second arm. The same retained protein traps cholesterol with it, so one
      trafficking failure has two separable consequences.
  evidence:

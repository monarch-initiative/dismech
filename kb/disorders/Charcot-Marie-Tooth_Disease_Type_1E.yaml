    reference_title: "Tetraspan myelin protein PMP22 and demyelinating peripheral neuropathies: new facts and hypotheses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "disease-related missense mutations within transmembrane domains of PMP22 disturb intracellular protein trafficking leading to accumulation of the mutant protein in the endoplasmic reticulum/Golgi compartment"
    explanation: >-
      States the trafficking lesion and locates it to the transmembrane domains. This
      paper's own subject is the PMP22-integrin complex and the basal lamina; the
      quoted sentence is its framing of established PMP22 mutation biology, so it is
      graded BACKGROUND rather than PRIMARY_RESULT.
- name: Aggresome Formation and Proteostatic Burden
  description: >-
    Retained PMP22 has an extended half-life and forms aggresome-like structures
    surrounded by molecular chaperones and lysosomes. Clearance depends on autophagy:
    it is enhanced when autophagy is activated and largely prevented when autophagy is
    inhibited. The Schwann cell is therefore holding the mutant protein under a
    disposal system that can be saturated.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell

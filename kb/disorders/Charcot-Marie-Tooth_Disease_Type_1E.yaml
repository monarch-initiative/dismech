variants:
- name: PMP22 p.Gly150Asp (Trembler)
  description: >-
    The classic Trembler substitution. In humans it produces the severe end of the
    PMP22 point-mutation spectrum: Dejerine-Sottas syndrome with hearing loss and
    cognitive impairment, reported in a mother and son.
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:35974257
    reference_title: "Expanding the phenotypic spectrum of Dejerine-Sottas syndrome caused by the trembler mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two cases of DSS in a mother and son with the Trembler mutation, with associated findings of hearing loss and cognitive impairment"
    explanation: >-
      The severe pole of the allelic series, and the one that carries the phenotype
      beyond the peripheral nerve.
- name: PMP22 p.Trp28Cys
  description: >-
    The mild pole. A Portuguese family with this allele ranged from asymptomatic to
    mild distal numbness and gait difficulty, with onset anywhere from the mid-twenties
    to the late sixties, and no disability or hearing loss.
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:34332267
    reference_title: "Characterization of a Portuguese family with Charcot-Marie-Tooth disease type 1E due to a novel point mutation in the PMP22 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "from asymptomatic to mild complaints of distal limb numbness and gait difficulties, with the age of onset of symptoms ranging from mid-twenties to late-sixties"
    explanation: >-
      Documents the width of expressivity within one family and one allele, which is
      the counterweight to the cohort-level severity claim.
animal_models:
- name: Trembler-J mouse
  species: Mouse
  genotype: Pmp22 Leu16Pro (TrJ), spontaneous
  publication: PMID:14627652
  description: >-
    A spontaneous mouse mutant carrying a PMP22 substitution that also occurs in human
    CMT1E families, which is an unusually direct correspondence for a model - the
    allele was not engineered to match, it already matched.
  modeled_mechanisms:
  - target: Aggresome Formation and Proteostatic Burden
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The aggresome, chaperone and lysosome findings, and the autophagy dependence of
      clearance, are all measured in this model.
    readouts:
    - name: Aggresome-like structures in nerve
      target: Aggresome Formation and Proteostatic Burden
      direction: INCREASED
      interpretation: >-
        Retained PMP22 forms aggresomes under chaperone and lysosomal surveillance.
      evidence:
      - reference: PMID:14627652
        reference_title: "Emerging role for autophagy in the removal of aggresomes in Schwann cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PMP22 has an extended half-life and forms aggresome-like structures that are surrounded by molecular chaperones and lysosomes"
        explanation: >-
          The measured aggregate phenotype.
  - target: Cholesterol Sequestration in the Golgi
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Schwann cells from homozygous TrJ mice show the Golgi cholesterol retention and
      the reciprocal plasma-membrane reduction.
    limitations: >-
      The cholesterol measurements were made in cells from HOMOZYGOUS TrJ mice, while
      human CMT1E is heterozygous. A homozygous mutant Schwann cell has no wild-type
      PMP22 competing for the trafficking pathway, so the magnitude of Golgi retention
      is not the magnitude a patient's Schwann cell experiences, and the direction of
      the effect is better supported than its size.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The genotype measured is homozygous TrJ; the human disease state is a
        heterozygote carrying one mutant and one wild-type PMP22 allele. The model
        population is therefore not the disease population at the allele level.
    readouts:
    - name: Golgi and plasma-membrane cholesterol distribution
      target: Cholesterol Sequestration in the Golgi
      direction: ALTERED
      interpretation: >-
        Cholesterol accumulates in the Golgi with the mutant protein and falls at the
        plasma membrane.
      evidence:
      - reference: PMID:32511821
        reference_title: "Subcellular diversion of cholesterol by gain- and loss-of-function mutations in PMP22."
        supports: SUPPORT
        evidence_source: IN_VITRO

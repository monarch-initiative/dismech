    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High frequencies of de novo mutations were observed, and the mutation sites of c.68C>G and c.215C>T were suggested as the mutational hotspots"
    explanation: >-
      Records both the de novo rate and the recurrent sites in a cohort of 850 CMT
      families.
genetic:
- name: PMP22
  notes: >-
    PMP22 encodes peripheral myelin protein 22, a tetraspan membrane protein of
    compact PNS myelin. Three distinct diseases arise from it: duplication gives
    CMT1A, deletion gives HNPP, and coding point mutations give CMT1E. Most CMT1E
    mutations localize to the conserved transmembrane domains.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PMP22
    term:
      id: hgnc:9118
      label: PMP22
  evidence:
  - reference: PMID:34332267
    reference_title: "Characterization of a Portuguese family with Charcot-Marie-Tooth disease type 1E due to a novel point mutation in the PMP22 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Point mutations in the Peripheral Myelin Protein 22 (PMP22) gene comprise less than 5% of the Charcot-Marie-Tooth (CMT) type 1 cases"
    explanation: >-
      Establishes that the point-mutation mechanism is a small minority of CMT1 and so
      that CMT1E is rare relative to the dosage diseases of the same gene.
pathophysiology:
- name: PMP22 Transmembrane-Domain Missense Mutation
  description: >-
    A heterozygous coding point mutation or small indel, usually in one of the
    conserved transmembrane domains, produces an abnormal PMP22 protein. This is the
    point of departure from CMT1A and HNPP, both of which alter the amount of a
    normal protein rather than its sequence.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: PMP22
    term:
      id: hgnc:9118
      label: PMP22
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Recorded as DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION because the disease
      is more severe than the heterozygous deletion state, HNPP, which is the
      comparison a true loss-of-function reading would have to survive. The mutant
      protein is retained and aggregates rather than simply being absent.
  downstream:
  - target: ER and Golgi Retention of Misfolded PMP22
    causal_link_type: DIRECT
  evidence:

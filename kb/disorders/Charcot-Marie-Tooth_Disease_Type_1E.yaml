inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous PMP22 point mutations. De novo mutations are frequent, and two
    recurrent sites have been proposed as mutational hotspots, so a negative family
    history does not argue against the diagnosis.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:

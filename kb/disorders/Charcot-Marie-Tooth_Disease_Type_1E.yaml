  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Recorded as DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION because the disease
      is more severe than the heterozygous deletion state, HNPP, which is the
      comparison a true loss-of-function reading would have to survive. The mutant
      protein is retained and aggregates rather than simply being absent.

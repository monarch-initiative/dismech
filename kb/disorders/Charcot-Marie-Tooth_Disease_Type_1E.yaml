    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17701891
    reference_title: "Oral curcumin mitigates the clinical and neuropathologic phenotype of the Trembler-J mouse: a potential therapy for inherited neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Administration of curcumin significantly decreases the percentage of apoptotic Schwann cells and results in increased number and size of myelinated axons"
    explanation: >-
      A rescue result cited as validation of the mechanism it targets, which is an
      inference step: reducing apoptosis improves myelination, so apoptosis is
      upstream of the myelination failure. Graded INDIRECT for that reason, and
      MODEL_ORGANISM because the quoted measurement is in the Trembler-J mouse.
- name: Demyelination of Peripheral Nerve
  description: >-
    Dysmyelination and demyelination of peripheral nerve in a bilateral, symmetric,
    length-dependent distribution, with uniformly slowed motor conduction and
    secondary axonal loss. The axonal loss is what the clinical impairment tracks.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High frequencies of de novo mutations were observed"
    explanation: >-
      The de novo rate is what makes a negative family history uninformative here.
discussions:
- discussion_id: cmt1e_hearing_loss_lesion_site
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where in the auditory system does CMT1E hearing loss arise, and is it the same
    demyelinating lesion as the peripheral neuropathy?
  attaches_to:
  - pathophysiology#Demyelination of Peripheral Nerve
  - phenotypes#Sensorineural hearing impairment
  rationale: >-
    Hearing loss is the feature that distinguishes CMT1E from CMT1A, occurs in more
    than 40 percent of a large cohort, and has no mechanism in this entry. The causal
    edge to it is drawn UNKNOWN for that reason.

    Two readings are live and they are not equivalent. If the lesion is demyelination
    of the cochlear nerve, the hearing loss is auditory neuropathy and would show
    preserved otoacoustic emissions with absent or grossly abnormal auditory brainstem
    responses - and it belongs on the same causal chain as the limb neuropathy. If
    PMP22 has a separate role in the cochlea, it is a sensory lesion arising in
    parallel, and severity need not track neuropathy severity.

    The variant dependence is what makes this more than a labelling question. An entire
    family with p.Trp28Cys had no hearing loss, while p.Gly150Asp produced deafness
    with cognitive impairment. A mechanism that explained why the auditory system is
    spared by some alleles and not others would be a genuine advance, and the
    audiological phenotyping needed to distinguish the two readings is routine.
  proposed_experiments:
  - experiment_id: cmt1e_auditory_neuropathy_phenotyping
    name: Otoacoustic emission and auditory brainstem response phenotyping in CMT1E
    description: >-
      Otoacoustic emissions with auditory brainstem responses in genotyped CMT1E
      patients across the allelic series, with peripheral nerve conduction measured in
      the same sitting.
    readouts:
    - name: Otoacoustic emissions with concurrent auditory brainstem response
      target: phenotypes#Sensorineural hearing impairment
      direction: ALTERED
      interpretation: >-
        Preserved emissions with abnormal brainstem responses indicates auditory
        neuropathy and places the lesion on the demyelination chain; loss of emissions
        indicates a cochlear sensory lesion arising separately.
    would_support:
    - pathophysiology#Demyelination of Peripheral Nerve
    supporting_outcome:
    - >-
      Preserved otoacoustic emissions with absent or desynchronized auditory brainstem
      responses, and severity correlating with peripheral conduction slowing.
    refuting_outcome:
    - >-
      Absent otoacoustic emissions indicating outer hair cell loss, with hearing
      severity uncorrelated with peripheral nerve conduction.
notes: >-
  Deep-research provenance. This entry was curated from an OpenScientist deep-research
  report, `research/Charcot-Marie-Tooth_Disease_Type_1E-deep-research-openscientist.md`,
  committed alongside it. The report supplied the causal chain and the reference set;
  every snippet used here was re-fetched into `references_cache/` and verified against
  the cached record rather than taken from the report.

  Two corrections were made to the report's ontology suggestions and are recorded here
  because the report is committed and a reader will see them.

  First, the report gives "myelinating Schwann cell (CL:0002573)". CL:0002573 is
  `Schwann cell`; `myelinating Schwann cell` is CL:0000218. The two are used correctly
  here - CL:0000218 on the nodes where the source specifies myelinating cells, CL:0002573
  on the cholesterol node, where the source says "Schwann cells from homozygous Trembler
  J mice" without specifying. This is the failure mode CLAUDE.md describes for gene
  bindings, landing on a cell type: the CURIE resolves, the label is a real label, and
  the pairing is wrong.

  Second, the report's own Term Validation section reports ten terms "named as a
  different term". Those are benign - the report had put a table column value such as
  "Symptom" or "Clinical sign" where the validator expected a term name, so the CURIEs
  are right and the names are category labels. That is worth distinguishing from the
  CL:0002573 case above, which the validator could not catch because the report never
  stated a name for it.

  No GO term for "compact myelin" exists in cache/go/terms.csv; searched "compact
  myelin" and "Schwann cell development", both returning no rows. GO:0022011
  myelination in peripheral nervous system and GO:0042552 myelination are bound instead.

  The GeneReviews baseline is PMID:20301532 Charcot-Marie-Tooth Hereditary Neuropathy
  Overview, tagged in `references:`. Note that the chapter-level "Charcot-Marie-Tooth
  Neuropathy Type 1" chapter, PMID:20301384, is a RETIRED chapter per
  cache/bookshelf/genereviews.csv and is deliberately not cited.
review_notes: >-
  Lump/split. CMT1E is curated as its own Disease entry rather than as a subtype row on
  a PMP22 or CMT1 parent. The argument is mechanistic and it is the point of the entry:
  CMT1A and HNPP are gene-dosage diseases of a normal protein, CMT1E is a
  protein-misfolding disease, and PMID:15755691 shows the three mouse genotypes have
  distinct expression profiles rather than graded ones. The therapeutic consequence
  follows: the ascorbic acid failure is what a dosage-derived therapy does in a disease
  that is not about dosage. Folding CMT1E into a dosage parent would lose exactly the
  claim that makes it worth curating.

  Two evidence items are graded REFUTE on purpose, and neither refutes the entry.
  PMID:34332267 refutes the claim that hearing loss is constant in CMT1E; PMID:21393063
  refutes ascorbic acid as a treatment. Both are recorded as REFUTE rather than omitted
  because a reader should be able to see the counter-evidence without leaving the entry.

  The Pes cavus phenotype is the weakest item here. Its snippet says "musculoskeletal
  deformity" and does not name pes cavus, so the binding to HP:0001761 is the curator's
  inference from standard CMT. The explanation says so. If a reviewer wants it cut or
  re-sourced, that is fair.

  The edge from Demyelination of Peripheral Nerve to Sensorineural hearing impairment
  carries causal_link_type UNKNOWN, and the accompanying discussion says why. This is a
  deliberate refusal to draw a mechanism the evidence does not supply, for the most
  clinically distinctive feature of the disease.

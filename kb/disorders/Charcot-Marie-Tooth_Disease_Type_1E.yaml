  description: >-
    Toe deformity accompanying pes cavus in long-standing CMT, and reported alongside it
    at comparable frequency. An earlier draft left this node uncited on the claim that no
    cached reference named hammertoes; that claim was false, and the sentence below was
    in the full text of a reference the entry already cites - see review_notes.
  phenotype_term:
    preferred_term: Hammertoe

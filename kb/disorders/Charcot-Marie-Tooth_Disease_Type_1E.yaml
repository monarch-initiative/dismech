name: Charcot-Marie-Tooth Disease Type 1E
category: Mendelian
creation_date: "2026-09-22T13:35:00Z"
synonyms:
- CMT1E
- Charcot-Marie-Tooth disease, demyelinating, type 1E
- Charcot-Marie-Tooth disease and deafness
- autosomal dominant Charcot-Marie-Tooth neuropathy and deafness
description: >-
  CMT1E is demyelinating Charcot-Marie-Tooth neuropathy caused by coding point
  mutations and small indels in PMP22, frequently accompanied by sensorineural
  hearing loss. It is the third of three PMP22 diseases, and the one that is not
  about gene dosage.

  **The lesion is a misfolded protein, not a dose.** CMT1A arises from duplication
  of the 1.4 Mb region containing PMP22 and HNPP from its deletion; both are dosage
  diseases of a wild-type protein. CMT1E instead produces an abnormal protein.
  Disease-related missense mutations in the PMP22 transmembrane domains disturb
  intracellular trafficking, so the mutant accumulates in the endoplasmic reticulum
  and Golgi rather than reaching the Schwann cell surface. In Trembler-J nerve the
  retained protein has an extended half-life and forms aggresome-like structures
  ringed by chaperones and lysosomes, cleared by autophagy and accumulating when
  autophagy is blocked.

  **There is a second arm through lipid handling.** Cholesterol is an essential
  structural lipid of compact myelin. In Trembler-J Schwann cells, cholesterol is
  retained with the mutant protein in the Golgi and its plasma-membrane level falls
  correspondingly. So the same mis-trafficking event that creates the proteostatic
  burden also diverts a myelin building block, and the two arms converge on the
  failure to make and maintain myelin.

  **This distinction is not academic - it predicts therapy failure.** Expression
  profiling across Pmp22-null, Pmp22-overexpressing and Trembler mice found three
  distinct profiles, which is the direct evidence that dosage and point-mutation
  disease are different mechanisms rather than points on one severity scale. And the
  clinical history bears it out: ascorbic acid, which worked in the CMT1A transgenic
  dosage model, had no benefit across three one-year human trials. Extrapolating a
  CMT1A-directed therapy to CMT1E is therefore not conservative, it is unsupported.

  **The phenotype sits at the severe end, and deafness is the distinguishing
  feature.** In a Korean cohort of 850 duplication-negative CMT families, more than
  40 percent of CMT1E patients had hearing loss, and both physical and
  electrophysiological severity exceeded CMT1A. But expressivity is wide: one
  Portuguese family carrying p.Trp28Cys ranged from asymptomatic to mild numbness
  with onset from the mid-twenties to the late sixties and no hearing loss at all,
  while the classic Trembler p.Gly150Asp substitution produces Dejerine-Sottas
  syndrome with deafness and cognitive impairment. Which variant, and where it sits
  in the protein, is a major determinant of severity.

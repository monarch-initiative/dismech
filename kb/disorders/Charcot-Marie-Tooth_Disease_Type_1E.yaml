    reference_title: "Emerging role for autophagy in the removal of aggresomes in Schwann cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PMP22 has an extended half-life and forms aggresome-like structures that are surrounded by molecular chaperones and lysosomes"
    explanation: >-
      The observation in Trembler-J nerve that defines this node: not merely retained
      protein but an organized aggresome under chaperone and lysosomal surveillance.
- name: Cholesterol Sequestration in the Golgi
  description: >-
    Cholesterol is retained with the mutant protein in the Golgi, and plasma-membrane
    cholesterol falls correspondingly. Because cholesterol is a structural lipid of
    compact myelin, this diverts a myelin building block away from the membrane where
    it is needed.

    Note the source paper contrasts this directly with the CMT1A mechanism in the same
    experiments: PMP22 overexpression sequesters cholesterol to lysosomes instead. The
    two PMP22 diseases therefore mis-route the same lipid to different compartments,
    which is a sharper statement of "different mechanism" than a severity comparison
    would be.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

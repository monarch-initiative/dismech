- name: Rehabilitation, orthoses and surgical correction
  description: >-
    No disease-modifying therapy exists for any form of CMT. Management is muscle
    strength training, orthotic devices, surgery, symptom relief and anticipatory
    monitoring for complications.
  treatment_term:

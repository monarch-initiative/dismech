    reference_title: "Charcot-Marie-Tooth disease and related neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disease-modifying therapies are not yet available for any form of CMT. Management includes rehabilitative approaches such as muscle strength training and orthotic devices, surgical interventions, symptom relief and anticipatory monitoring of associated complications"
    explanation: >-
      States both the absence of disease-modifying therapy and the content of

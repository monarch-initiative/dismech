- name: Ascorbic acid
  description: >-
    Recorded as a NEGATIVE result rather than as an available treatment. Ascorbic acid
    corrected the phenotype in the CMT1A transgenic mouse, which is a gene-dosage
    model, and failed in humans across three one-year trials. It is listed here because
    the failure is mechanistically informative for CMT1E: a therapy aimed at the dosage
    mechanism has no reason to help a protein-misfolding disease, and the expression
    profiling makes that prediction independently.
  treatment_term:
    preferred_term: ascorbic acid
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ascorbic acid
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:21393063
    reference_title: "Ascorbic acid in Charcot-Marie-Tooth disease type 1A (CMT-TRIAAL and CMT-TRAUK): a double-blind randomised trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "in three 1-year trials, ascorbic acid had no benefit in human beings"
    explanation: >-
      A REFUTE item against ascorbic acid as a treatment. The quoted sentence is the
      trial report's framing of the prior literature rather than its own result, hence
      BACKGROUND. Note also that these trials were in CMT1A, not CMT1E, so this is
      evidence against a therapy being carried across to this disease rather than a
      trial in it.
- name: Genetic counselling
  description: >-
    Autosomal dominant with a 50 percent recurrence risk, but frequent de novo
    mutations mean an apparently sporadic case is common and does not argue against the
    diagnosis. Variant identity is a major determinant of severity, so the counselling
    conversation is allele-specific rather than disease-specific.
  treatment_term:
    preferred_term: genetic counselling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

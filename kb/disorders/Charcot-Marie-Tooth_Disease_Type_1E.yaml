    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All forms of CMT result in length-dependent, progressive axonal loss that correlates with clinical impairments such as distal upper and lower limb weakness, musculoskeletal deformity, absent deep tendon reflexes and distal sensory deficits"
    explanation: >-
      The link from nerve pathology to the clinical picture, stated across CMT as a
      class. Graded REVIEW_SYNTHESIS because the source is a review synthesizing work
      it did not perform, and because the claim is about CMT generally rather than
      about CMT1E specifically.

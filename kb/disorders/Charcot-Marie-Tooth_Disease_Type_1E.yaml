      id: GO:0030301
      label: cholesterol transport
  downstream:
  - target: Schwann Cell Apoptosis and Failure of Myelination
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32511821
    reference_title: "Subcellular diversion of cholesterol by gain- and loss-of-function mutations in PMP22."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In Schwann cells from homozygous Trembler J (TrJ) mice carrying a Leu16Pro mutation, cholesterol was retained with TrJ-PMP22 in the Golgi, alongside a corresponding reduction in its plasma membrane level."
    explanation: >-
      The measured cholesterol mis-localization in a cell model of the human Leu16Pro
      allele, with the reciprocal fall at the plasma membrane.
  - reference: PMID:32511821
    reference_title: "Subcellular diversion of cholesterol by gain- and loss-of-function mutations in PMP22."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PMP22 overexpression, which models CMT1A caused by gene duplication, triggered cholesterol sequestration to lysosomes, and reduced ATP-binding cassette transporter-dependent cholesterol efflux."
    explanation: >-
      The CMT1A comparison from the same study. Quoted here because it is what makes
      the Golgi localization specific to the point-mutation disease rather than a
      generic PMP22 phenomenon.
- name: Schwann Cell Apoptosis and Failure of Myelination
  description: >-
    Proteostatic burden and diverted myelin lipid converge on the myelinating Schwann
    cell, which undergoes apoptosis and fails to make and maintain normal compact
    myelin. That apoptosis is the convergence point is supported by the curcumin
    result, where reducing ER-retention-associated apoptosis increased the number and
    size of myelinated axons.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:

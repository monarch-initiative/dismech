    The mutant protein does not traffic to the Schwann cell plasma membrane. It
    accumulates in the endoplasmic reticulum and Golgi compartment instead, and the
    trafficking defect is attributable specifically to mutations within the
    transmembrane domains.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

      id: HP:0001765
      label: Hammertoe
  evidence:
  - reference: PMID:42563944
    reference_title: "Charcot-Marie-Tooth disease in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pes cavus and hammer toes are common, while pes planus is less frequent."
    explanation: >-
      Names hammertoes directly and puts them at the same frequency tier as pes cavus. A
      review of CMT in children rather than a CMT1E series, hence REVIEW_SYNTHESIS.
- category: Neurologic

    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations or small insertions and deletions (indels) usually cause CMT type 1E (CMT1E) or HNPP"
    explanation: >-
      Defines the CMT1E lesion class as point mutations and indels, separating it from
      the duplication that causes CMT1A.
- name: ER and Golgi Retention of Misfolded PMP22
  description: >-
    The mutant protein does not traffic to the Schwann cell plasma membrane. It
    accumulates in the endoplasmic reticulum and Golgi compartment instead, and the
    trafficking defect is attributable specifically to mutations within the
    transmembrane domains.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

variants:
- name: PMP22 p.Gly150Asp (Trembler)
  description: >-
    The classic Trembler substitution. In humans it produces the severe end of the
    PMP22 point-mutation spectrum: Dejerine-Sottas syndrome with hearing loss and
    cognitive impairment, reported in a mother and son.
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:35974257
    reference_title: "Expanding the phenotypic spectrum of Dejerine-Sottas syndrome caused by the trembler mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two cases of DSS in a mother and son with the Trembler mutation, with associated findings of hearing loss and cognitive impairment"
    explanation: >-
      The severe pole of the allelic series, and the one that carries the phenotype
      beyond the peripheral nerve.
- name: PMP22 p.Trp28Cys
  description: >-
    The mild pole. A Portuguese family with this allele ranged from asymptomatic to
    mild distal numbness and gait difficulty, with onset anywhere from the mid-twenties
    to the late sixties, and no disability or hearing loss.
  variant_type: single nucleotide variant
  clinical_significance: PATHOGENIC
  evidence:
  - reference: PMID:34332267
    reference_title: "Characterization of a Portuguese family with Charcot-Marie-Tooth disease type 1E due to a novel point mutation in the PMP22 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "from asymptomatic to mild complaints of distal limb numbness and gait difficulties, with the age of onset of symptoms ranging from mid-twenties to late-sixties"
    explanation: >-
      Documents the width of expressivity within one family and one allele, which is
      the counterweight to the cohort-level severity claim.
animal_models:
- name: Trembler-J mouse
  species: Mouse
  genotype: Pmp22 Leu16Pro (TrJ), spontaneous
  publication: PMID:14627652
  description: >-
    A spontaneous mouse mutant carrying a PMP22 substitution that also occurs in human
    CMT1E families, which is an unusually direct correspondence for a model - the
    allele was not engineered to match, it already matched.
  modeled_mechanisms:
  - target: Aggresome Formation and Proteostatic Burden
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The aggresome, chaperone and lysosome findings, and the autophagy dependence of
      clearance, are all measured in this model.
    readouts:
    - name: Aggresome-like structures in nerve
      target: Aggresome Formation and Proteostatic Burden
      direction: INCREASED
      interpretation: >-
        Retained PMP22 forms aggresomes under chaperone and lysosomal surveillance.
      evidence:
      - reference: PMID:14627652
        reference_title: "Emerging role for autophagy in the removal of aggresomes in Schwann cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PMP22 has an extended half-life and forms aggresome-like structures that are surrounded by molecular chaperones and lysosomes"
        explanation: >-
          The measured aggregate phenotype.
  - target: Cholesterol Sequestration in the Golgi
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Schwann cells from homozygous TrJ mice show the Golgi cholesterol retention and
      the reciprocal plasma-membrane reduction.
    limitations: >-
      The cholesterol measurements were made in cells from HOMOZYGOUS TrJ mice, while
      human CMT1E is heterozygous. A homozygous mutant Schwann cell has no wild-type
      PMP22 competing for the trafficking pathway, so the magnitude of Golgi retention
      is not the magnitude a patient's Schwann cell experiences, and the direction of
      the effect is better supported than its size.
    divergences:
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        The genotype measured is homozygous TrJ; the human disease state is a
        heterozygote carrying one mutant and one wild-type PMP22 allele. The model
        population is therefore not the disease population at the allele level.
    readouts:
    - name: Golgi and plasma-membrane cholesterol distribution
      target: Cholesterol Sequestration in the Golgi
      direction: ALTERED
      interpretation: >-
        Cholesterol accumulates in the Golgi with the mutant protein and falls at the
        plasma membrane.
      evidence:
      - reference: PMID:32511821
        reference_title: "Subcellular diversion of cholesterol by gain- and loss-of-function mutations in PMP22."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "cholesterol was retained with TrJ-PMP22 in the Golgi, alongside a corresponding reduction in its plasma membrane level"
        explanation: >-
          The measurement, in Schwann cells from the TrJ mouse.
  evidence:
  - reference: PMID:15755691
    reference_title: "Distinct disease mechanisms in peripheral neuropathies due to altered peripheral myelin protein 22 gene dosage or a Pmp22 point mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the three Pmp22 mutants exhibited distinct profiles of gene expression, suggesting different disease mechanisms"
    explanation: >-
      The evidence that this model is the right one for CMT1E specifically: a
      point-mutation mouse is transcriptionally distinct from null and overexpressing
      mice, so a dosage model cannot stand in for it.
treatments:
- name: Rehabilitation, orthoses and surgical correction
  description: >-
    No disease-modifying therapy exists for any form of CMT. Management is muscle
    strength training, orthotic devices, surgery, symptom relief and anticipatory
    monitoring for complications.
  treatment_term:
    preferred_term: rehabilitation and orthotic management
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:41571707
    reference_title: "Charcot-Marie-Tooth disease and related neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Disease-modifying therapies are not yet available for any form of CMT. Management includes rehabilitative approaches such as muscle strength training and orthotic devices, surgical interventions, symptom relief and anticipatory monitoring of associated complications"
    explanation: >-
      States both the absence of disease-modifying therapy and the content of
      supportive management, from a review.
- name: Ascorbic acid
  description: >-
    Recorded as a NEGATIVE result rather than as an available treatment. Ascorbic acid
    corrected the phenotype in the CMT1A transgenic mouse, which is a gene-dosage
    model, and failed in humans across three one-year trials. It is listed here because
    the failure is mechanistically informative for CMT1E: a therapy aimed at the dosage
    mechanism has no reason to help a protein-misfolding disease, and the expression
    profiling makes that prediction independently.
  treatment_term:
    preferred_term: ascorbic acid
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ascorbic acid
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:21393063
    reference_title: "Ascorbic acid in Charcot-Marie-Tooth disease type 1A (CMT-TRIAAL and CMT-TRAUK): a double-blind randomised trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "in three 1-year trials, ascorbic acid had no benefit in human beings"
    explanation: >-
      A REFUTE item against ascorbic acid as a treatment. The quoted sentence is the
      trial report's framing of the prior literature rather than its own result, hence
      BACKGROUND. Note also that these trials were in CMT1A, not CMT1E, so this is
      evidence against a therapy being carried across to this disease rather than a
      trial in it.
- name: Curcumin
  description: >-
    The mechanism-matched preclinical lead, and the reason it belongs in this entry
    rather than in a general CMT one: it targets the ER-retention and
    aggregation-induced apoptosis that six of this entry's nodes are about, which is
    the arm of PMP22 biology that CMT1A does not share.

    Oral curcumin partially mitigates the Trembler-J phenotype in a dose-dependent
    manner, decreasing apoptotic Schwann cells and increasing the number and size of
    myelinated axons. That is a mouse result with no human trial behind it, and the
    entry says so rather than implying an available therapy.
  treatment_term:
    preferred_term: curcumin
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: curcumin
      term:
        id: CHEBI:3962
        label: curcumin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:17701891
    reference_title: "Oral curcumin mitigates the clinical and neuropathologic phenotype of the Trembler-J mouse: a potential therapy for inherited neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "oral administration of curcumin partially mitigates the severe neuropathy phenotype of the Trembler-J mouse model in a dose-dependent manner."
    explanation: >-
      The in vivo result, with the authors' own qualifier "partially". Model organism
      only - there is no human trial of curcumin in CMT1E, and this record should not be
      read as an available treatment.
  - reference: PMID:17701891
    reference_title: "Oral curcumin mitigates the clinical and neuropathologic phenotype of the Trembler-J mouse: a potential therapy for inherited neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Administration of curcumin significantly decreases the percentage of apoptotic Schwann cells and results in increased number and size of myelinated axons"
    explanation: >-
      The mechanistic readout that makes this a mechanism-matched lead rather than a
      symptomatic one: the effect is on the apoptosis node this entry models, and the
      myelination improvement follows it.
- name: Genetic counselling
  description: >-
    Autosomal dominant with a 50 percent recurrence risk, but frequent de novo
    mutations mean an apparently sporadic case is common and does not argue against the
    diagnosis. Variant identity is a major determinant of severity, so the counselling
    conversation is allele-specific rather than disease-specific.
  treatment_term:
    preferred_term: genetic counselling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35886002
    reference_title: "Peripheral Myelin Protein 22 Gene Mutations in Charcot-Marie-Tooth Disease Type 1E Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High frequencies of de novo mutations were observed"
    explanation: >-
      The de novo rate is what makes a negative family history uninformative here.
diagnosis:
- name: Nerve conduction studies
  description: >-
    Uniformly slowed motor conduction places a patient in the demyelinating CMT1 group
    and is what directs testing toward PMP22 in the first place. It does not
    distinguish CMT1E from CMT1A; it establishes which gene to look at.
  diagnosis_term:
    preferred_term: nerve conduction velocity study
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  evidence:
  - reference: PMID:42563944
    reference_title: "Charcot-Marie-Tooth disease in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Demyelinating neuropathies are characterized by severe nerve conduction velocity (NCV) slowing, typically below 38 m/s in upper limb motor nerves."
    explanation: >-
      The conduction threshold that assigns a patient to the demyelinating group. This
      replaces a snippet about axonal loss and clinical impairments that named no
      conduction finding at all - it bore on nothing the node claims, which makes it
      NO_EVIDENCE for this claim rather than SUPPORT.
  - reference: PMID:42563944
    reference_title: "Charcot-Marie-Tooth disease in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NCV slowing is uniform and diffuse in CMT due to widespread myelin and Schwann cell dysfunction."
    explanation: >-
      The word the node leans on: uniform. Uniform diffuse slowing is what separates an
      inherited demyelinating neuropathy from an acquired one, where slowing is patchy.
  - reference: PMID:35886002
    reference_title: "Peripheral Myelin Protein 22 Gene Mutations in Charcot-Marie-Tooth Disease Type 1E Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean median motor nerve conduction velocity (MNCV) was measured to be 11.5 ± 13.0 m/s in CMT1E patients."
    explanation: >-
      The measured value in a CMT1E cohort specifically, well inside the demyelinating
      range the review defines. The only conduction figure in this entry that is about
      CMT1E rather than about CMT.
- name: Audiologic assessment
  description: >-
    Hearing loss is the feature that separates CMT1E from CMT1A, so hearing status is
    assessed rather than assumed. The Korean CMT1E series diagnosed it in 40.6 percent
    of patients, which is the yield that justifies testing every patient rather than
    only those who report a hearing complaint. No cached source names which audiometric
    test was used, so the binding is the general NCIT:C38036 Audiometric Test rather
    than the NCIT:C85857 Evoked Response Audiometry offered on review - see review_notes.
  diagnosis_term:
    preferred_term: audiometric assessment
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:35886002
    reference_title: "Peripheral Myelin Protein 22 Gene Mutations in Charcot-Marie-Tooth Disease Type 1E Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "hearing loss was diagnosed in 40.6% of the patients (13 of 32)"
    explanation: >-
      Reports the yield of hearing assessment in a CMT1E cohort rather than recommending
      a test, so the recommendation follows by one inference step - a 40.6 percent yield
      is the argument for assessing everyone. Graded INDIRECT for that step.
- name: Exclude the PMP22 duplication before sequencing
  description: >-
    The testing ORDER is the practical consequence of this entry's whole argument.
    CMT1A is the common PMP22 disease and is a copy-number change, so it is found by
    dosage analysis, not by sequencing; CMT1E is a coding change and is found by
    sequencing, not by dosage analysis. A laboratory that sequences first will call a
    CMT1A patient negative, and one that stops at MLPA will call a CMT1E patient
    negative. The reported combined strategy is dosage analysis of PMP22 with sequencing
    of the common CMT1 genes.

    This is also why CMT1E cohorts are assembled from duplication-negative families: the
    Korean series that supplies most of this entry's clinical data screened 850 families
    that had already tested negative for the 17p12 duplication.
  diagnosis_term:
    preferred_term: PMP22 dosage analysis with sequencing of the common CMT1 genes
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32506583
    reference_title: "Diagnostic yield of targeted sequential and massive panel approaches for inherited neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the diagnostic yield of the combined strategy of Multiplex-ligation-dependent-probe-amplification (MLPA) of PMP22/GJB1/MPZ and GJB1/MPZ/PMP22 Sanger sequencing was 63."
    explanation: >-
      Documents the two-step strategy - dosage analysis alongside sequencing of the same
      genes - and its yield in an unselected CMT cohort. The percentage is truncated in
      the cached abstract at the sentence boundary; the point quoted here is the
      strategy, not the figure.
  - reference: PMID:35886002
    reference_title: "Peripheral Myelin Protein 22 Gene Mutations in Charcot-Marie-Tooth Disease Type 1E Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations or small insertions and deletions (indels) usually cause CMT type 1E (CMT1E) or HNPP"
    explanation: >-
      The allele class that sequencing finds, as distinct from the duplication that
      dosage analysis finds. Together with the row above this is the argument for the
      testing order.
prevalence:
- population: Children, reported range across studies
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 45.85
  rate_low: 9.7
  rate_high: 82.0
  notes: >-
    This is the prevalence of CHARCOT-MARIE-TOOTH DISEASE AS A WHOLE in children, not of
    CMT1E. It is recorded here because no CMT1E-specific prevalence exists and because
    the figure is needed to make the entry's own rarity statement meaningful: CMT1E is
    caused by point mutations comprising less than 5 percent of CMT1, and CMT1 is about
    two thirds of CMT. The wide range reflects differences between the source studies
    rather than a measured spread in one population.
  evidence:
  - reference: PMID:42563944
    reference_title: "Charcot-Marie-Tooth disease in children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "an estimated prevalence ranging from 9.7 to 82 cases per 100,000 individuals"
    explanation: >-
      The reported range for CMT overall in children, from a review synthesizing
      published estimates rather than measuring one. Graded REVIEW_SYNTHESIS for that
      reason, and the population field says explicitly that this is CMT and not CMT1E.
discussions:
- discussion_id: cmt1e_hearing_loss_lesion_site
  kind: KNOWLEDGE_GAP
  prompt: >-
    Where in the auditory system does CMT1E hearing loss arise, and is it the same
    demyelinating lesion as the peripheral neuropathy?
  attaches_to:
  - pathophysiology#Demyelination of Peripheral Nerve
  - phenotypes#Sensorineural hearing impairment
  rationale: >-
    Hearing loss is the feature that distinguishes CMT1E from CMT1A, occurs in more
    than 40 percent of a large cohort, and has no mechanism in this entry. The causal
    edge to it is drawn UNKNOWN for that reason.

    Two readings are live and they are not equivalent. If the lesion is demyelination
    of the cochlear nerve, the hearing loss is auditory neuropathy and would show
    preserved otoacoustic emissions with absent or grossly abnormal auditory brainstem
    responses - and it belongs on the same causal chain as the limb neuropathy. If
    PMP22 has a separate role in the cochlea, it is a sensory lesion arising in
    parallel, and severity need not track neuropathy severity.

    The variant dependence is what makes this more than a labelling question. An entire
    family with p.Trp28Cys had no hearing loss, while p.Gly150Asp produced deafness
    with cognitive impairment. A mechanism that explained why the auditory system is
    spared by some alleles and not others would be a genuine advance, and the
    audiological phenotyping needed to distinguish the two readings is routine.
  proposed_experiments:
  - experiment_id: cmt1e_auditory_neuropathy_phenotyping
    name: Otoacoustic emission and auditory brainstem response phenotyping in CMT1E
    description: >-
      Otoacoustic emissions with auditory brainstem responses in genotyped CMT1E
      patients across the allelic series, with peripheral nerve conduction measured in
      the same sitting.
    readouts:
    - name: Otoacoustic emissions with concurrent auditory brainstem response
      target: phenotypes#Sensorineural hearing impairment
      direction: ALTERED
      interpretation: >-
        Preserved emissions with abnormal brainstem responses indicates auditory
        neuropathy and places the lesion on the demyelination chain; loss of emissions
        indicates a cochlear sensory lesion arising separately.
    would_support:
    - pathophysiology#Demyelination of Peripheral Nerve
    supporting_outcome:
    - >-
      Preserved otoacoustic emissions with absent or desynchronized auditory brainstem
      responses, and severity correlating with peripheral conduction slowing.
    refuting_outcome:
    - >-
      Absent otoacoustic emissions indicating outer hair cell loss, with hearing
      severity uncorrelated with peripheral nerve conduction.
notes: >-
  Deep-research provenance. This entry was curated from an OpenScientist deep-research
  report, `research/Charcot-Marie-Tooth_Disease_Type_1E-deep-research-openscientist.md`,
  committed alongside it. The report supplied the causal chain and the reference set;
  every snippet used here was re-fetched into `references_cache/` and verified against
  the cached record rather than taken from the report.

  Two corrections were made to the report's ontology suggestions and are recorded here
  because the report is committed and a reader will see them.

  First, the report gives "myelinating Schwann cell (CL:0002573)". CL:0002573 is
  `Schwann cell`; `myelinating Schwann cell` is CL:0000218. The two are used correctly
  here - CL:0000218 on the nodes where the source specifies myelinating cells, CL:0002573
  on the cholesterol node, where the source says "Schwann cells from homozygous Trembler
  J mice" without specifying. This is the failure mode CLAUDE.md describes for gene
  bindings, landing on a cell type: the CURIE resolves, the label is a real label, and
  the pairing is wrong.

  Second, the report's own Term Validation section reports ten terms "named as a
  different term". Those are benign - the report had put a table column value such as
  "Symptom" or "Clinical sign" where the validator expected a term name, so the CURIEs
  are right and the names are category labels. That is worth distinguishing from the
  CL:0002573 case above, which the validator could not catch because the report never
  stated a name for it.

  Reference screening. This PR commits more reference caches than the entry cites,
  because the committed deep-research report's own citation validation fetched every
  PMID it names. Of those not cited here: PMID:25522693 (a Chinese Han CMT1 cohort with
  no point mutations found) and PMID:37170966 (the Italian CMT registry) are
  epidemiological and were superseded for the prevalence record by PMID:42563944, which
  gives a paediatric range rather than a registry composition; PMID:26662471 is the
  Cochrane review of ascorbic acid in CMT1A and is redundant with the trial already
  cited as REFUTE; PMID:30685714, PMID:11002284 and PMID:9004143 are PMP22 background;
  PMID:19588347 is a foot-drop rehabilitation review and PMID:38784904 a telecoaching
  study, neither specific to CMT1E; PMID:40270660 (oesophageal dysmotility) and
  PMID:23847051, PMID:25014022, PMID:22528185, PMID:31993930 were screened and not used
  because nothing in their cached text bears on a claim this entry makes.

  No GO term for "compact myelin" exists in cache/go/terms.csv; searched "compact
  myelin" and "Schwann cell development", both returning no rows. GO:0022011
  myelination in peripheral nervous system and GO:0042552 myelination are bound instead.

  The GeneReviews baseline is PMID:20301532 Charcot-Marie-Tooth Hereditary Neuropathy
  Overview, tagged in `references:`. Note that the chapter-level "Charcot-Marie-Tooth
  Neuropathy Type 1" chapter, PMID:20301384, is a RETIRED chapter per
  cache/bookshelf/genereviews.csv and is deliberately not cited.
review_notes: >-
  Lump/split. CMT1E is curated as its own Disease entry rather than as a subtype row on
  a PMP22 or CMT1 parent. The argument is mechanistic and it is the point of the entry:
  CMT1A and HNPP are gene-dosage diseases of a normal protein, CMT1E is a
  protein-misfolding disease, and PMID:15755691 shows the three mouse genotypes have
  distinct expression profiles rather than graded ones. The therapeutic consequence
  follows: the ascorbic acid failure is what a dosage-derived therapy does in a disease
  that is not about dosage. Folding CMT1E into a dosage parent would lose exactly the
  claim that makes it worth curating.

  Two evidence items are graded REFUTE on purpose, and neither refutes the entry.
  PMID:34332267 refutes the claim that hearing loss is constant in CMT1E; PMID:21393063
  refutes ascorbic acid as a treatment. Both are recorded as REFUTE rather than omitted
  because a reader should be able to see the counter-evidence without leaving the entry.

  Two nodes were re-sourced on review and one uncited node was cited, and both changes
  came from the same mistake. Pes cavus originally quoted a sentence saying only
  "musculoskeletal deformity"; hammertoe was left uncited with a note claiming no cached
  reference named hammertoes. Neither claim survived a search of the full text of
  PMID:42563944, which the entry already cited: it names pes cavus in its abstract and
  says "Pes cavus and hammer toes are common" in its clinical section. I had searched the
  abstract and written the negative claim as though I had searched the reference. That is
  the exact failure CLAUDE.md's rule about negative-existence claims describes, and it is
  the second instance of it in this entry after the GO term note, so it is recorded here
  rather than quietly fixed.

  Two CURIEs offered on review were checked rather than pasted, and one was declined.
  NCIT:C88502 Nerve Conduction Velocity Test and NCIT:C15709 Genetic Testing both
  resolve as labelled and are in the treatmentactionterm enum cache, and both are bound.
  NCIT:C85857 Evoked Response Audiometry also resolves as labelled, and is still the
  wrong binding here: no cached source says which audiometric test was used, and evoked
  response audiometry is one particular modality. The audiologic entry binds NCIT:C38036
  Audiometric Test instead, which is the generality the source supports.

  The prevalence rate_per_100000 was the bottom of the reported range rather than a
  point estimate. It is now the midpoint of 9.7-82.0, with both bounds kept; the band is
  unchanged and the population scope note still says this is CMT as a whole in children,
  not CMT1E.

  The edge from Demyelination of Peripheral Nerve to Sensorineural hearing impairment
  carries causal_link_type UNKNOWN, and the accompanying discussion says why. This is a
  deliberate refusal to draw a mechanism the evidence does not supply, for the most
  clinically distinctive feature of the disease.

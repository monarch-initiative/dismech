- name: Vestibular and oculomotor examination
  description: Bedside and video head-impulse testing, caloric or rotational-chair testing assess bilateral vestibular loss. Impaired visually enhanced vestibuloocular reflex suggests combined vestibular and cerebellar involvement.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable

    - repeat_structural_toxicity
  - target: Repeat RNA G-Quadruplex Formation
    description: AAGGG RNA forms G-quadruplexes in defined short-repeat assays; their formation in vulnerable patient neurons is unresolved.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - repeat_structural_toxicity
  - target: RFC1 Intron 2 Retention
    description: The founding study detected increased intronic RNA, but later cell assays did not consistently reproduce retention.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - intron2_retention_rna_processing
  - target: Context-Dependent Reduction of RFC1 Transcript Abundance
    description: In the unreviewed 2025 preprint, isogenic deletion of the repeat-containing region increased transcript abundance in sensory and motor neurons; preserved-expression studies limit generalization.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - rfc1_loss_of_function
  - target: Repeat RNA Foci
    description: Two genetically confirmed autopsies contained repeat RNA foci, whereas earlier patient brains and later cell assays were negative.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - repeat_rna_peptide_effects
  - target: Repeat-Associated Poly-KGREG Production
    description: Short-repeat reporter constructs can produce poly-KGREG; this does not establish toxic peptide accumulation from the endogenous expanded alleles.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - repeat_rna_peptide_effects
  - target: Impaired Neuronal Synaptic Signaling
    description: Monoallelic deletion of the Alu-repeat region partially rescued synaptic readouts in one patient-derived neuronal line; the intervening molecular mechanism remains unresolved.
    causal_link_type: UNKNOWN
  - target: Dorsal Root Ganglion Sensory Neuronopathy
    description: Sensory neuronopathy is a defining manifestation of genetically confirmed RFC1 disease; the repeat-dependent route to ganglion injury remains unknown.
    causal_link_type: UNKNOWN
  - target: Cranial Sensory Ganglionopathy
    description: Vestibular failure in genetically confirmed disease is consistent with cranial ganglion pathology in historical clinical CANVAS, although those temporal-bone cases were not genotyped.
    causal_link_type: UNKNOWN
  - target: Cerebellar Purkinje Cell Loss
    description: A genetically confirmed CANVAS autopsy showed Purkinje depletion and Bergmann gliosis; the repeat-to-cell-death intermediates remain unresolved.
    causal_link_type: UNKNOWN
  - target: Autonomic Nervous System Dysfunction
    causal_link_type: UNKNOWN
    description: Autonomic testing documents sympathetic and parasympathetic dysfunction in RFC1 disease; the route from the repeat genotype to autonomic injury and its anatomical site remain unresolved.
  - target: Cough Reflex Hypersensitivity
    causal_link_type: UNKNOWN
    description: Heightened capsaicin sensitivity is documented in a small group of biallelic carriers with refractory cough; the repeat-dependent process causing reflex sensitization has not been demonstrated.
  - target: Motor Circuit Dysfunction
    causal_link_type: UNKNOWN
    description: Upper and lower motor signs in genetically confirmed cases suggest additional motor-circuit involvement, with axonal and glial abnormalities documented in one autopsy; the repeat-dependent mechanism remains unknown.
  - target: Cognitive Network Dysfunction
    causal_link_type: UNKNOWN
    description: Genetically confirmed CANVAS cohorts show cognitive deficits; the route from the repeat genotype to cerebellar or extra-cerebellar cognitive-network dysfunction remains unresolved.
- name: RFC1 Nonsense Allele in Trans with a Repeat Expansion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Rare patients carry a coding nonsense allele in trans with an expanded RFC1 repeat. Two siblings with c.1267C>T (p.Arg423Ter) showed mutant-transcript depletion and reduced full-length protein in fibroblasts. The coding single-nucleotide change and its measured consequences are distinct from the intronic repeat alteration.
  evidence:
  - reference: PMID:36289003
    reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Together, the findings suggest that the transcript containing truncating variants in RFC1 undergo nonsense-mediated decay leading to RNA degradation.
    explanation: Patient fibroblast studies characterize the truncating allele in the compound genotype.

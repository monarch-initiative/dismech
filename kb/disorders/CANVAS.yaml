    explanation: Documents the ACAGG pathogenic motif in Asia-Pacific families.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:36289003
    reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the finding of truncating variants associated with CANVAS indicate that full RFC1 sequencing is recommended in cases affected by typical CANVAS and carrying monoallelic (AAGGG)n expansions.
    explanation: Defines the rare second-allele diagnostic route.
  - reference: PMID:37450567
    reference_title: 'Normal and pathogenic variation of RFC1 repeat expansions: implications for clinical diagnosis.'

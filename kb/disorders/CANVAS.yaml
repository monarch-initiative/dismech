- phase: Repeat size and modifying factors
  notes: Larger expansions, particularly the smaller allele, correlate with earlier onset and more complex or faster-progressing disease. Repeat size explained at most 6% of onset variation. Most measured transmissions changed by less than 10%; these results do not establish genetic anticipation.

progression:
- phase: Adult neurological onset
  age_range: 25–80 years in the 392-person cohort
  notes: Median neurological onset was 54 years; cough was excluded from this definition and can begin decades earlier. An atypical Māori patient with childhood onset was reported, but the authors could not exclude a second condition.
  evidence:
  - reference: PMID:38193360
    reference_title: Role of the repeat expansion size in predicting age of onset and severity in RFC1 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Median age at onset of neurological symptoms (cough excluded) was 54 years (IQR = 49–61), ranging from 25 to 80 years.
    explanation: Defines the cohort and onset endpoint.
  - reference: PMID:32851396
    reference_title: A Māori specific RFC1 pathogenic repeat configuration in CANVAS, likely due to a founder allele.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT

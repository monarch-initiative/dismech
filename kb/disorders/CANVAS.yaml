- name: RFC1 Intron 2 Retention
  biological_scale: MOLECULAR
  description: >-
    Increased retention of intron 2 — the repeat-hosting intron — in RFC1
    pre-mRNA, observed across lymphoblasts, muscle, cerebellum, and frontal
    cortex, without evidence of sense or antisense RNA foci. This mirrors
    intron retention at other disease-causing GC-rich repeat expansions
    (myotonic dystrophy type 2, C9orf72-ALS/FTD), where retained,
    repeat-containing pre-mRNA can alter nuclear export and availability to
    the translation machinery, offering a route to pathogenicity distinct
    from bulk loss of RFC1 expression or from the G-quadruplex
    structural-toxicity arm.

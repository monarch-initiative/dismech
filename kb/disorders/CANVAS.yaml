    evidence_source: HUMAN_CLINICAL
    snippet: "assessment of pre-mRNA expression by qRT-PCR showed a consistent increase of intron 2 retention in patient lymphoblasts (n = 2), muscle (n = 7) (P = 0.0077), cerebellum, and frontal cortex (n = 1), as compared to healthy controls"
    explanation: Quantifies the intron 2 retention finding across multiple patient tissues.

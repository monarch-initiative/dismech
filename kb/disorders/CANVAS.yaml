    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Individual M2 III:4 had a normal brain MRI 3 years after symptom onset, but subsequent CT head scans showed cerebellar atrophy.
    explanation: Shows that imaging can lag clinical onset.
  - reference: PMID:40908706
    reference_title: Longitudinal Evaluation of Ataxia and Brain Structural Changes in RFC1-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic RFC1 repeat expansions are required. Because the carrier
    frequency of the pathogenic allele is unusually high for a recessive disorder,
    pseudodominance (apparent transmission across generations) is well documented
    and should not be mistaken for autosomal dominant inheritance.
  evidence:
  - reference: PMID:33237689
    reference_title: "RFC1 CANVAS / Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "RFC1 CANVAS / spectrum disorder is inherited in an autosomal recessive manner."
    explanation: GeneReviews establishes autosomal recessive inheritance.
  - reference: PMID:40481300
    reference_title: "Comprehensive Characterisation of the RFC1 Repeat in an Australian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The carrier frequency of the pathogenic AAGGG(n) expansion was approximately 1 in 16 in controls, highlighting the potential for pseudodominant inheritance and the likelihood that RFC1-related disease is underdiagnosed."
    explanation: High carrier frequency underlies the documented pseudodominance.
genetic:
- name: RFC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: RFC1
    term:
      id: hgnc:9969
      label: RFC1
  notes: >-
    RFC1 encodes the large subunit of the replication factor C clamp-loader complex,
    which loads PCNA onto DNA. The pathogenic lesion is predominantly not a coding
    mutation but a biallelic expansion of a pentanucleotide repeat in intron 2,
    within the poly(A) tail of an AluSx3 element; truncating RFC1 point variants in
    trans with an expanded allele have also been reported, so the allelic spectrum
    is not purely repeat-based. Multiple pathogenic motifs exist and are
    population-structured: (AAGGG)n predominates in European populations, (ACAGG)n
    in Asia-Pacific populations, and a compound (AAAGG)10-25(AAGGG)exp configuration
    is a founder allele in New Zealand Maori and Cook Island Maori individuals. This
    motif heterogeneity has direct diagnostic consequences, because a repeat-primed
    PCR assay designed only for AAGGG will miss the other configurations.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used non-parametric linkage analysis and genome sequencing to identify a biallelic intronic AAGGG repeat expansion in the replication factor C subunit 1 (RFC1) gene as the cause of familial CANVAS and a frequent cause of late-onset ataxia, particularly if sensory neuronopathy and bilateral vestibular areflexia coexist."
    explanation: Identifies biallelic intronic RFC1 AAGGG expansion as the cause of CANVAS.
  - reference: PMID:31230722
    reference_title: "Bioinformatics-Based Identification of Expanded Repeats: A Non-reference Intronic Pentamer Expansion in RFC1 Causes CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a recessively inherited, ancient RE located in intron 2 of RFC1 is the predominant cause of CANVAS"
    explanation: Independent confirmation that the intron 2 repeat expansion is the predominant cause.
  - reference: PMID:32851396
    reference_title: "A Maori specific RFC1 pathogenic repeat configuration in CANVAS, likely due to a founder allele."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show a novel, possibly population-specific CANVAS configuration (AAAGG)10-25(AAGGG)exp, which was the cause of CANVAS in all patients."
    explanation: Documents a population-specific founder repeat configuration.
  - reference: PMID:33103729
    reference_title: "A novel RFC1 repeat motif (ACAGG) in two Asia-Pacific CANVAS families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened an Asian-Pacific cohort for CANVAS and identified a novel RFC1 repeat expansion motif, (ACAGG)exp, in three affected individuals."
    explanation: Documents the ACAGG pathogenic motif in Asia-Pacific families.
mechanistic_hypotheses:
- hypothesis_group_id: rfc1_loss_of_function
  hypothesis_label: RFC1 loss of function
  status: ALTERNATIVE
  description: >-
    The intuitive model — that the expansion reduces RFC1 protein and impairs
    replication-factor-C function — is not supported by the original patient-tissue
    data, which found RFC1 expression unaffected in both peripheral and brain
    tissue. This hypothesis is retained as a named alternative rather than
    discarded, because later work reports tissue-specific transcript reduction, so
    the question of a partial or cell-type-restricted loss of function is not
    formally closed.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "does not affect RFC1 expression in patient peripheral and brain tissue, suggesting no overt loss of function"
    explanation: Directly argues against an overt loss-of-function mechanism.
- hypothesis_group_id: repeat_structural_toxicity
  hypothesis_label: Repeat-intrinsic G-quadruplex structural toxicity
  status: EMERGING
  description: >-
    The pathogenic repeat motifs, but not the benign reference motif, fold into
    parallel G-quadruplex structures in both DNA and RNA. These structures stall
    DNA replication and impair gene expression in a repeat-length-dependent manner,
    offering a mechanism that is intrinsic to the expanded nucleic acid rather than
    dependent on loss of RFC1 protein. This would also explain why the disorder is
    not a classical misfolding or polyglutamine repeat disease.
  evidence:
  - reference: PMID:38266156
    reference_title: "Structural investigation of pathogenic RFC1 AAGGG pentanucleotide repeats reveals a role of G-quadruplex formation in repeat instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The pathogenic AAGGG repeats, but not the nonpathogenic AAAAG repeats, form G4 structures to stall DNA replication and reduce gene expression via impairing the translation process in a repeat-length-dependent manner."
    explanation: Structural and functional evidence for a repeat-intrinsic G-quadruplex mechanism.
- hypothesis_group_id: intron2_retention_rna_processing
  hypothesis_label: RFC1 intron 2 retention and aberrant pre-mRNA processing
  status: EMERGING
  description: >-
    qRT-PCR in patient tissue shows a consistent increase in
    retention of intron 2 — the repeat-hosting intron — in RFC1 pre-mRNA,
    without evidence of sense or antisense RNA foci. Intron retention at a
    GC-rich repeat-hosting intron is a mechanism shared with other
    disease-causing GC-rich intronic expansions (myotonic dystrophy type 2,
    C9orf72-ALS/FTD), distinct from both the loss-of-function and the
    G-quadruplex structural-toxicity hypotheses, and offers a route to a
    transcript-specific, tissue-variable effect that bulk mRNA/protein
    quantification would miss.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we detected a consistent increase across different tissues of the retention of intron 2 in RFC1 pre-mRNA"
    explanation: Establishes increased intron 2 retention in RFC1 pre-mRNA as a distinct molecular consequence of the expansion.
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retention of the repeat-hosting intron was recently identified as a common event associated with other disease-causing guanine-cytosine-rich intronic expansions, such as in myotonic dystrophy type 2 and C9orf72-amyotrophic lateral sclerosis/FTD but not AT-rich repeat expansions such as in FRDA"
    explanation: Frames intron retention as a mechanism shared with other GC-rich repeat-expansion disorders, distinguishing it from AT-rich expansions such as FRDA.
pathophysiology:
- name: Biallelic RFC1 Intronic Repeat Expansion
  biological_scale: MOLECULAR
  description: >-
    A biallelic expansion of a pentanucleotide repeat in intron 2 of RFC1, sitting
    in the poly(A) tail of an AluSx3 element. The expanded motif differs from the
    reference (AAAAG)11 allele in both length and sequence. Because the pathogenic
    repeat is absent from the reference genome and lies within an intron, it is
    invisible to exome sequencing and to sequence-based gene panels.
  genes:
  - preferred_term: RFC1
    term:
      id: hgnc:9969
      label: RFC1
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expansion, which occurs in the poly(A) tail of an AluSx3 element and differs in both size and nucleotide sequence from the reference (AAAAG)11 allele, does not affect RFC1 expression in patient peripheral and brain tissue, suggesting no overt loss of function."
    explanation: Establishes the molecular lesion and its location in the AluSx3 poly(A) tail.
  downstream:
  - target: Repeat-Intrinsic Nucleic Acid Structural Toxicity
    description: >-
      The expanded repeat adopts non-B-DNA/RNA secondary structure, the leading
      candidate for how the lesion becomes pathogenic without reducing RFC1 protein.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - repeat_structural_toxicity
    evidence:
    - reference: PMID:38266156
      reference_title: "Structural investigation of pathogenic RFC1 AAGGG pentanucleotide repeats reveals a role of G-quadruplex formation in repeat instability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we report that the pathogenic RFC1 AAGGG repeats form DNA and RNA parallel G-quadruplex (G4) structures that play a role in impairing biological processes"
      explanation: Links the expansion to formation of G-quadruplex structures.
  - target: RFC1 Intron 2 Retention
    description: >-
      The expanded repeat is independently associated with increased
      retention of the repeat-hosting intron 2 in RFC1 pre-mRNA, a distinct
      molecular consequence from the G-quadruplex structural-toxicity arm.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - intron2_retention_rna_processing
    evidence:
    - reference: PMID:30926972
      reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we detected a consistent increase across different tissues of the retention of intron 2 in RFC1 pre-mRNA"
      explanation: Links the biallelic expansion to increased intron 2 retention in RFC1 pre-mRNA.
- name: Repeat-Intrinsic Nucleic Acid Structural Toxicity
  biological_scale: MOLECULAR
  description: >-
    The pathogenic repeat folds into parallel G-quadruplex structures in DNA and
    RNA, stalling DNA replication and impairing gene expression in a
    repeat-length-dependent manner. The benign reference repeat does not form these
    structures, making the structural difference — rather than a change in RFC1
    protein level — the candidate proximate cause.
  evidence:
  - reference: PMID:38266156
    reference_title: "Structural investigation of pathogenic RFC1 AAGGG pentanucleotide repeats reveals a role of G-quadruplex formation in repeat instability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The pathogenic AAGGG repeats, but not the nonpathogenic AAAAG repeats, form G4 structures to stall DNA replication and reduce gene expression via impairing the translation process in a repeat-length-dependent manner."
    explanation: Pathogenic-versus-benign motif comparison supports a structural mechanism.
  downstream:

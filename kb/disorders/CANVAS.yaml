histopathology:
- name: Sensory ganglion neuronal loss
  description: Loss of dorsal root ganglion sensory neurons produces peripheral sensory deafferentation and secondary posterior-column degeneration. Historical autopsies predated RFC1 genotyping, while later genetically confirmed cases show concordant sensory and posterior-column pathology. The primary ganglion lesion does not require a uniformly non-length-dependent clinical distribution. Five temporal bones from four clinically defined, ungenotyped CANVAS patients showed severe vestibular ganglion neuronal loss, with relative preservation of spiral ganglia, sensory hair cells and vestibular nuclei. Trigeminal and geniculate ganglia were also affected. Ganglionic Nageotte nodules reflect glial replacement of lost neurons; they are not psammoma bodies. Relative auditory sparing does not exclude coincident presbycusis or another cause of hearing loss.
  evidence:
  - reference: PMID:24682971
    reference_title: Dorsal root ganglionopathy is responsible for the sensory impairment in CANVAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Spinal cord pathology demonstrated a marked dorsal root ganglionopathy with secondary tract degeneration.
    explanation: Direct neuropathology in clinically defined CANVAS predating molecular diagnosis.
  - reference: PMID:33492056
    reference_title: The Pathology of the Vestibular System in CANVAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: In CANVAS there is a severe cranial sensory ganglionopathy neuronopathy (ganglionopathy) involving the vestibular, facial, and trigeminal ganglia but sparing the auditory ganglia.
    explanation: Historical pathology localizes vestibular failure primarily to ganglion neurons; these donors were not RFC1-genotyped.
- name: Cerebellar Purkinje cell depletion
  description: Purkinje-cell depletion, often greatest in the vermis, and Bergmann gliosis are documented in clinical CANVAS autopsies and a genetically confirmed 2019 case. This lesion contributes to cerebellar gait, limb, speech and oculomotor dysfunction. Molecular intermediates connecting the repeat genotype to selective adult Purkinje degeneration remain unresolved.
  evidence:
  - reference: PMID:24682971
    reference_title: Dorsal root ganglionopathy is responsible for the sensory impairment in CANVAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Cerebellar pathology showed loss of Purkinje cells, predominantly in the vermis.
    explanation: Documents selective cerebellar pathology in historical clinical CANVAS.
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient with CANVAS showed severe, widespread depletion of Purkinje cells with associated prominent Bergmann gliosis, while cell density in the granule cell layer was well preserved.
    explanation: The 2019 study documents this pathology in a genetically confirmed CANVAS case.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Spinal axonal swelling and astrocytic gliosis
  description: Upper and lower motor signs occur in a subset of RFC1 cases. One genetically confirmed autopsy showed anterior-horn astrocytic gliosis and axonal swelling around motor-neuron somata, with preserved anterior-horn neurons and corticospinal tracts. Synaptic dysfunction is proposed; generalized motor-neuron death is not established by this case. The same individual also had Lewy body pathology consistent with coexisting Parkinson disease.
  evidence:
  - reference: PMID:34927205
    reference_title: Motor neuron pathology in CANVAS due to RFC1 expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed marked astrocytic gliosis and axonal swelling of the synapse between first and second motor neurons in the anterior horn at the lumbar level.
    explanation: The pathology supports circuit-level abnormality in one patient.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10141005/1/awab449%20%281%29.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10141005/1/awab449%20%281%29.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Although the second motor neurons in the anterior and lateral horns were preserved
    explanation: Preserved neuronal somata are part of the reported histological finding, not evidence against the described axonal and glial changes.
diagnosis:
- name: RFC1 repeat genotyping and second-allele sequencing
  description: Use motif-aware flanking and repeat-primed PCR, with Southern blotting, long-read sequencing or optical genome mapping when needed to resolve size and configuration. Specialized whole-genome pipelines can screen repeats; routine exome sequencing cannot reliably exclude them. If only one expansion is found in a typical phenotype, sequence RFC1 for a coding or splice second allele. Ambiguous motifs require cautious interpretation.
  evidence:
  - reference: PMID:36289003
    reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: full RFC1 sequencing is recommended in cases affected by typical CANVAS and carrying monoallelic (AAGGG)n expansions.
    explanation: Supports the complementary role of coding sequencing.
  - reference: PMID:41964406
    reference_title: Homozygous RFC1 AAGGG Repeat Expansions Are Common in Idiopathic Peripheral Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Both WGS and PCR methods face challenges in precisely quantifying repeat number, particularly in the presence of multiple repeat motifs.
    explanation: Recognizes platform and motif limitations.
  - reference: PMID:40481300
    reference_title: Comprehensive Characterisation of the RFC1 Repeat in an Australian Cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We also demonstrate the utility of targeted long-read sequencing in resolving complex alleles.
    explanation: Supports long-read resolution in an Australian clinical series.

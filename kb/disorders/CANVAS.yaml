      label: RFC1
  notes: RFC1 encodes the large subunit of the canonical replication factor C complex that loads PCNA during DNA replication and repair. The usual disease allele is a nonreference intronic short tandem repeat expansion overlapping the AluSx3 poly(A) tail. AAGGG predominates; ACAGG, AGGGC and the Māori AAAGG-flanked AAGGG configuration also occur. Very large AAAGG alleles can be pathogenic, with uncertain penetrance; motif and size must be interpreted together. The September 2026 GeneReviews update still classifies AAGGC and AGAGG configurations as uncertain, despite the pathogenic interpretation proposed in a 2023 series. Rare expansion/truncating, splice or deletion genotypes broaden the allelic spectrum. Reduced expression is directly established for tested truncating alleles; the functional consequence of repeat-only genotypes is context-dependent and unresolved. Monoallelic enrichment in the 2026 neuropathy cohort was nonsignificant after adjustment; that study does not establish dominant RFC1 neuropathy.
  evidence:
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We used non-parametric linkage analysis and genome sequencing to identify a biallelic intronic AAGGG repeat expansion in the replication factor C subunit 1 (RFC1) gene as the cause of familial CANVAS and a frequent cause of late-onset ataxia, particularly if sensory neuronopathy and bilateral vestibular areflexia coexist.
    explanation: Identifies biallelic intronic RFC1 AAGGG expansion as the cause of CANVAS.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31230722
    reference_title: 'Bioinformatics-Based Identification of Expanded Repeats: A Non-reference Intronic Pentamer Expansion in RFC1 Causes CANVAS.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a recessively inherited, ancient RE located in intron 2 of RFC1 is the predominant cause of CANVAS
    explanation: Independent confirmation that the intron 2 repeat expansion is the predominant cause.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:32851396
    reference_title: A Māori specific RFC1 pathogenic repeat configuration in CANVAS, likely due to a founder allele.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We show a novel, possibly population-specific CANVAS configuration (AAAGG)10-25(AAGGG)exp, which was the cause of CANVAS in all patients.
    explanation: Documents a population-specific founder repeat configuration.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:33103729
    reference_title: A novel RFC1 repeat motif (ACAGG) in two Asia-Pacific CANVAS families.
    supports: SUPPORT

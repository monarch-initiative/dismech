    explanation: Cerebellar histopathology.
diagnosis:
- name: Targeted RFC1 repeat expansion testing
  description: >-
    Molecular diagnosis requires testing specifically targeted to the intronic
    repeat, such as repeat-primed and flanking PCR or long-read sequencing. This is
    the single most important diagnostic point in the disorder: the expansion is
    intronic and absent from the reference genome, so exome sequencing and
    sequence-based gene panels do not detect it, and a negative panel does not
    exclude the diagnosis. Assay design must also account for motif heterogeneity,
    because an assay built only for AAGGG will miss ACAGG and the Maori
    configuration.
  evidence:
  - reference: PMID:33237689
    reference_title: "RFC1 CANVAS / Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Note that pathogenic RFC1 AAGGG repeat expansions cannot be detected by sequence-based multigene panels or exome sequencing."
    explanation: Establishes that standard sequencing approaches miss the expansion.
  - reference: PMID:40481300
    reference_title: "Comprehensive Characterisation of the RFC1 Repeat in an Australian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrate the utility of targeted long-read sequencing in resolving complex alleles."
    explanation: Supports long-read sequencing for resolving complex repeat alleles.
- name: Nerve conduction studies
  description: >-
    Sensory nerve action potentials are reduced or absent in a non-length-dependent
    distribution, consistent with a ganglionopathy rather than a dying-back
    axonopathy.
  evidence:
  - reference: PMID:39811557
    reference_title: "Repeat expansions in RFC1 gene in refractory chronic cough."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RFC1++ participants had impaired sensory action potentials, and one had cerebellar atrophy."
    explanation: Documents impaired sensory action potentials in biallelic carriers.
- name: Vestibular function testing
  description: >-
    Bilateral vestibular hypofunction is demonstrated by an abnormal vestibulo-ocular
    reflex, with preserved audiometric function — a dissociation that reflects the
    sparing of the auditory ganglion. At the bedside the visually enhanced VOR
    (VVOR) is the most useful manoeuvre, because it tests vestibular, visual, and
    cerebellar contributions to gaze stabilisation together and is therefore
    abnormal in CANVAS when a single-system test might not be. Head-impulse testing
    and oculomotor examination for nystagmus complete the assessment.
  evidence:
  - reference: PMID:33492056
    reference_title: "The Pathology of the Vestibular System in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar, somatosensory, and selective vestibular impairment with normal hearing"
    explanation: Establishes the vestibular-loss-with-normal-hearing dissociation.
prevalence:
- population: Worldwide (birth prevalence of the recessive trait)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  notes: >-
    Estimated birth prevalence of the biallelic (recessive) genotype, derived from
    the observed carrier frequency. This is the population figure; the two records
    below are diagnostic yields in ascertained clinical cohorts and are not
    comparable to it.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with an estimated prevalence at birth of the recessive trait of approximately 1 in 20,000"
    explanation: Population birth prevalence of the recessive genotype, i.e. 5 per 100,000.
- population: Australian adult-onset ataxia cohort
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Among individuals presenting with adult-onset ataxia, biallelic pathogenic RFC1
    variants accounted for 34.1% of cases — a diagnostic yield, not a population
    prevalence. RFC1 expansion is among the most common identified genetic causes of
    late-onset ataxia.
  evidence:
  - reference: PMID:40481300
    reference_title: "Comprehensive Characterisation of the RFC1 Repeat in an Australian Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic pathogenic RFC1 variants were identified in 34.1% of affected individuals."
    explanation: Diagnostic yield of RFC1 testing in an adult-onset ataxia cohort.
- population: European general population (carrier frequency)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 700.0
  notes: >-
    Heterozygous carrier frequency of the pathogenic AAGGG expansion was estimated
    at 0.7% in Europeans in the original report, and at approximately 1 in 16 in
    Australian controls. This is unusually high for a recessive disorder and
    underlies both pseudodominant inheritance and the likelihood of underdiagnosis.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an expansion carrier frequency of 0.7% in Europeans"
    explanation: Original carrier-frequency estimate in Europeans.
- population: US idiopathic peripheral neuropathy cohort
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Biallelic RFC1 expansions were found in 2.3% of patients with idiopathic
    peripheral neuropathy versus 1 of 778 controls, rising to 6.9% in the pure
    sensory subgroup. This is a diagnostic yield in an ascertained cohort, so no
    rate_per_100000 or numeric population band is asserted — quoting one would
    invite exactly the population-rate reading the UNKNOWN measure_type guards
    against. The population figure is the birth-prevalence record above.
  evidence:
  - reference: PMID:41964406
    reference_title: "Homozygous RFC1 AAGGG Repeat Expansions Are Common in Idiopathic Peripheral Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic RFC1 expansions were present in only 1 out of 778 controls but present in 18 out of 788 (2.3%) patients with iPN"
    explanation: Case-control comparison of biallelic expansion frequency in idiopathic neuropathy.

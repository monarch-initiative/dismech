    explanation: Documents variability rather than an obligatory examination sign.
- name: Autonomic dysfunction
  category: Neurological
  description: Blood-pressure, bladder, bowel, sexual and sudomotor symptoms vary widely across cohorts and are usually mild, with occasional severe dysautonomia.
  phenotype_term:
    preferred_term: Abnormal autonomic nervous system physiology
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable

differential_diagnoses:
- name: GAA-FGF14-related ataxia
  disease_term:
    preferred_term: spinocerebellar ataxia 27B, late-onset
    term:
      id: MONDO:0859340
      label: spinocerebellar ataxia 27B, late-onset
  description: Late-onset cerebellar ataxia with oscillopsia and sometimes abnormal vestibular testing.
  distinguishing_features:
  - Episodic onset or exercise/alcohol-triggered symptoms favor SCA27B.
  - Neuropathy is usually absent or mild sensorimotor; prominent sensory neuronopathy and chronic cough favor RFC1 disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Episodic ataxic features (may be triggered by exercise, alcohol intake, or caffeine) are common at disease onset.
    explanation: The differential table distinguishes GAA-FGF14 ataxia.
- name: Friedreich ataxia
  disease_term:
    preferred_term: Friedreich ataxia
    term:
      id: MONDO:0100339
      label: Friedreich ataxia
  description: Sensory ataxia and possible vestibular impairment overlap with CANVAS.
  distinguishing_features:
  - Usually earlier onset, although late-onset cases exist.
  - Cardiomyopathy, diabetes, pyramidal signs and skeletal deformities may help distinguish the phenotype.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Muscle weakness, pyramidal involvement (Babinski signs), ... skeletal deformities (pes cavus, scoliosis) are frequent features.
    explanation: Current differential table identifies useful clinical contrasts.
- name: Multiple system atrophy
  disease_term:
    preferred_term: multiple system atrophy
    term:
      id: MONDO:0007803
      label: multiple system atrophy
  description: Cerebellar ataxia and autonomic failure can resemble CANVAS.
  distinguishing_features:
  - More rapid progression and severe early autonomic failure favor MSA.
  - Prominent sensory neuronopathy and bilateral vestibular failure favor RFC1 disease; MRI pattern can help.
  - REM sleep behavior disorder and parkinsonism can occur in RFC1 disease and are not absolute exclusions.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Multisystem atrophy (MSA) is a rapidly progressive neurodegenerative disease that can present with a wide range of clinical manifestations, including cerebellar ataxia and autonomic failure
    explanation: Highlights tempo and autonomic overlap.

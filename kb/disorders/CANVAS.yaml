name: CANVAS
category: Mendelian
creation_date: '2026-07-30T20:10:00Z'
synonyms:
- Cerebellar ataxia, neuropathy, and vestibular areflexia syndrome
- RFC1 CANVAS spectrum disorder
- Cerebellar ataxia with bilateral vestibulopathy syndrome
- CABV syndrome
- RFC1-related disorders
description: 'CANVAS is an autosomal recessive RFC1-related neurodegenerative disorder characterized by sensory neuronopathy, cerebellar dysfunction and bilateral vestibular hypofunction. This entry includes the broader RFC1 spectrum, in which sensory neuropathy with or without cough may precede or remain unaccompanied by the complete triad. Neurological onset is usually in adulthood; a large cohort spanned ages 25–80 years. Chronic cough can precede imbalance by decades. Most affected individuals carry biallelic intronic repeat expansions, commonly AAGGG; rare individuals carry an expansion in trans with a truncating, splice or deletion allele. Sensory ganglion neuronal loss and Purkinje cell depletion are established pathological features. Clinical sensory loss may be length-dependent or non-length-dependent, and unrelated hearing loss can coexist. The molecular mechanism remains unresolved: structural-repeat effects, altered RNA processing, repeat-derived products, synaptic dysfunction and context-dependent RFC1 reduction have different levels of experimental support. Dedicated repeat testing is needed; coding sequencing can identify a second allele when only one expansion is found.'

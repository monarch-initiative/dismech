    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: Recurrence risks for genetic counseling.
discussions:
- discussion_id: canvas_mechanism_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does a biallelic intronic repeat expansion cause selective degeneration of
    sensory ganglion and Purkinje neurons when it does not reduce RFC1 expression?
  attaches_to:
  - "pathophysiology#Repeat-Intrinsic Nucleic Acid Structural Toxicity"
  rationale: >-
    This is the central unresolved question of the disorder. The original
    patient-tissue work found RFC1 expression unaffected in peripheral and brain
    tissue, which removes the obvious loss-of-function explanation. In vitro
    structural work shows the pathogenic motif forms G-quadruplexes that stall
    replication, but it is not obvious why a replication-associated mechanism would
    selectively kill post-mitotic neurons, nor why it targets sensory ganglia and
    Purkinje cells specifically while sparing the adjacent auditory ganglion. The
    exquisite selectivity of the cell loss is itself the strongest constraint on any
    candidate mechanism.
  proposed_experiments:
  - experiment_id: canvas_ganglion_resolved_rfc1_expression
    name: Ganglion-resolved RFC1 expression comparison
    description: >-
      Compare RFC1 transcript and protein levels directly in affected dorsal root
      and vestibular ganglion neurons versus the spared auditory ganglion from the
      same donors, to test whether a cell-type-restricted loss of function explains
      the selectivity that bulk-tissue measurement missed.
    decision_criterion: >-
      A reduction confined to affected ganglia would revive a loss-of-function
      model; equal levels across affected and spared ganglia would further favour a
      repeat-intrinsic mechanism.
  - experiment_id: canvas_g4_modulation_sensory_neurons
    name: G-quadruplex modulation in patient-derived sensory neurons
    description: >-
      Test whether G-quadruplex-stabilising or -resolving interventions modify
      neuronal phenotypes in patient-derived sensory neurons.
    decision_criterion: >-
      Phenotype rescue by G4 resolution would support the structural-toxicity
      hypothesis and nominate a druggable target.
  - experiment_id: canvas_replication_independent_toxicity
    name: Replication-independent repeat toxicity assay
    description: >-
      Determine whether the repeat produces R-loops in post-mitotic neurons, which
      would provide a route to toxicity that does not require DNA replication. The
      RNA-foci arm of this question is deliberately excluded: Cortese et al. already
      looked for sense and antisense repeat foci in patient brain and did not find
      them, which narrows the search rather than leaving it open.
    decision_criterion: >-
      Detection of R-loops in non-dividing neurons would resolve the paradox of a
      replication-associated gene causing post-mitotic neuronal death; their absence
      would, together with the published negative foci result, argue against the
      whole class of RNA-mediated toxicity models.
    evidence:
    - reference: PMID:30926972
      reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We did not observe in patient brains the presence of RNA foci of either the sense or antisense repeated unit."
      explanation: >-
        Published negative result for repeat RNA foci in patient brain, which is why
        this experiment is scoped to R-loops only.
  evidence:
  - reference: PMID:30926972
    reference_title: "Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "does not affect RFC1 expression in patient peripheral and brain tissue, suggesting no overt loss of function"
    explanation: Establishes the gap by ruling out the obvious loss-of-function mechanism.
- discussion_id: canvas_ganglionopathy_not_axonopathy
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should the peripheral lesion of CANVAS be modeled as a ganglionopathy rather
    than conforming to the length-dependent peripheral axonal degeneration module?
  attaches_to:
  - "pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy"
  rationale: >-
    The dismech module `peripheral_axonal_degeneration` explicitly models
    length-dependent, distal-to-proximal dying-back degeneration producing a
    glove-and-stocking gradient. CANVAS is mechanistically the opposite: the primary
    event is loss of the sensory neuron cell body in the ganglion, with tract
    degeneration secondary, and the resulting sensory loss is not length-dependent.
    This entry therefore deliberately does not declare conformance to that module,
    even though CANVAS would superficially match on the phenotype of peripheral
    sensory loss. Conformance is declared only to
    `cerebellar_purkinje_degeneration`, where the mechanism genuinely matches. A
    future ganglionopathy/sensory-neuronopathy module would be the correct home for
    this pattern, which is shared with paraneoplastic sensory neuronopathy, Sjogren
    ganglionopathy, and pyridoxine toxicity.
  notes: >-
    Flagged as a candidate new mechanism module rather than forcing a conformance
    that would misrepresent the mechanism.
notes: >-
  Curated from the RFC1 CANVAS / Spectrum Disorder GeneReviews chapter plus primary
  neuropathology, genetics, and structural-biology literature. The deep-research
  report additionally described psammoma bodies and satellite glial cell
  proliferation in affected ganglia, basal ganglia atrophy, and iPSC-neuron findings
  in which phenotypes were rescued by repeat correction but not by RFC1
  re-expression. Those claims were not curated here because they could not be tied
  to a verified quotable abstract at curation time; they are strong candidates for a
  follow-up pass. Motor neuron involvement (fasciculations, mild wasting) and
  parkinsonism are likewise real features of the spectrum but are deliberately not
  curated here: none of the cached CANVAS references states a quotable frequency for
  them, so asserting one would violate the frequency-evidence SOP. The intron 2
  retention arm reported by Cortese et al. is a further mechanism thread deferred to
  its own follow-up, since it warrants a node and edges rather than a note.

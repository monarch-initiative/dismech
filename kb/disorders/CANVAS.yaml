inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Most cases carry two pathogenic repeat expansions; rare cases are compound heterozygous for an expansion and another pathogenic RFC1 allele. Pseudodominant pedigrees reflect frequent carrier alleles and do not establish dominant inheritance. Penetrance and presentation depend on age, repeat configuration and incompletely understood modifiers.
  evidence:
  - reference: PMID:39230846
    reference_title: Pseudodominance in RFC1-Spectrum Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We describe pseudodominance in two families affected with RFC1 disorder (10 affected, 5 oligo/asymptomatic individuals).
    explanation: Documents actual multigenerational families, including oligo/asymptomatic biallelic relatives.
  - reference: PMID:36289003
    reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We identified 7 patients from 5 unrelated families with clinically defined CANVAS carrying a heterozygous (AAGGG)n expansion together with a second truncating variant in trans in RFC1
    explanation: Establishes compound heterozygous expansion/truncating genotypes.

- name: Multidisciplinary Supportive Care
  description: >-
    No disease-modifying therapy exists. Management is supportive and coordinated
    across neurology, physical and occupational therapy, physiatry, and — as needed
    — speech therapy, respiratory therapy, nutrition, and gastroenterology, with the
    goals of maximising function and reducing complications. Surveillance covers
    progression of neurological findings, mobility and self-help skills,
    communication needs, and aspiration risk.

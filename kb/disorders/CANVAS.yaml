    explanation: Documents differential sensory modalities.
- name: Sensory neuropathy
  category: Neurological
  description: The characteristic clinical and electrophysiological sensory neuropathy reflects a predominant neuronopathy. Sensory action potentials are reduced or absent; clinical distribution may be length-dependent or non-length-dependent. All evaluated patients in the selected 392-person cohort had sensory impairment, but this is not a penetrance estimate.
  phenotype_term:
    preferred_term: Sensory neuropathy
    term:
      id: HP:0000763
      label: Sensory neuropathy
  evidence:
  - reference: PMID:38193360
    reference_title: Role of the repeat expansion size in predicting age of onset and severity in RFC1 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: All cases had signs and/or symptoms of sensory neuropathy, when investigated.
    explanation: Sensory involvement was constant in this ascertained cohort.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable

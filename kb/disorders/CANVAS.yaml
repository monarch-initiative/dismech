mechanistic_hypotheses:
- hypothesis_group_id: rfc1_loss_of_function
  hypothesis_label: Context-dependent RFC1 loss of function
  status: EMERGING
  description: Tested truncating alleles reduce RNA and protein. A 2025 preprint proposes smaller tissue-specific transcript reductions in repeat-only disease, whereas published cortical-like cell models and earlier tissue studies found preserved expression. A general protein-loss mechanism and the identity of vulnerable-cell intermediates remain unproven.
  evidence:
  - reference: url:https://www.biorxiv.org/content/early/2025/11/18/2025.11.18.688292.source.xml
    reference_title: ABSTRACT
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: expression could only be detected when comparing CANVAS lines with their isogenic corrected counterpart, but not when comparing CANVAS lines with non-isogenic controls
    explanation: Unreviewed November 2025 preprint (Currò et al.; DOI:10.1101/2025.11.18.688292). Motor-neuron qPCR showed about 23% lower expression versus isogenic controls; sensory-neuron reduction was about 15%.
  - reference: url:https://www.biorxiv.org/content/early/2025/11/18/2025.11.18.688292.source.xml
    reference_title: ABSTRACT
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we were unable to demonstrate a significant effect of the repeat expansion on RFC1 protein.
    explanation: Unreviewed November 2025 preprint (Currò et al.; DOI:10.1101/2025.11.18.688292). The preprint does not establish reduced protein abundance.
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: does not affect RFC1 expression in patient peripheral and brain tissue, suggesting no overt loss of function
    explanation: Original bulk-tissue results argue against a universal expression-loss model.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we observed no changes in RFC1 mRNA or RFC1 protein levels between 6-week-old control (n = 3) and CANVAS (n = 3) patient iPSC–derived neurons
    explanation: Published patient-cell observations differ from the later preprint.
- hypothesis_group_id: repeat_structural_toxicity
  hypothesis_label: Repeat-intrinsic DNA and RNA structural effects
  status: EMERGING
  description: G-quadruplex and triplex formation, replication stalling and reporter translation effects are experimentally observed in defined systems. Their contribution at the endogenous locus in postmitotic vulnerable neurons remains hypothetical.
  evidence:
  - reference: PMID:38266156
    reference_title: Structural investigation of pathogenic RFC1 AAGGG pentanucleotide repeats reveals a role of G-quadruplex in dysregulated gene expression in CANVAS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we report that the pathogenic RFC1 AAGGG repeats form DNA and RNA parallel G-quadruplex (G4) structures that play a role in impairing biological processes
    explanation: Biophysical assays establish folding capacity of short repeats.
  - reference: PMID:38381906
    reference_title: Pathogenic CANVAS (AAGGG)n repeats stall DNA replication due to the formation of alternative DNA structures.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The observed DNA polymerase stalling at the center of the (A2G3)10 strand strongly implicates H-r DNA triplex formation
    explanation: A competing structural explanation is supported under other assay conditions.
- hypothesis_group_id: intron2_retention_rna_processing
  hypothesis_label: Context-dependent intron retention
  status: ALTERNATIVE
  description: The original pre-mRNA retention finding has not been consistently reproduced. Altered RNA processing remains a candidate rather than an established obligatory mechanism.
  evidence:
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we detected a consistent increase across different tissues of the retention of intron 2 in RFC1 pre-mRNA
    explanation: Original observation in limited tissue samples.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: no back-spliced reads were identified to map to RFC1 intron 2 or across the RFC1 transcript
    explanation: No detectable circular intronic RNA was found in this study.
- hypothesis_group_id: repeat_rna_peptide_effects
  hypothesis_label: Repeat RNA and pentapeptide effects
  status: EMERGING
  description: RNA foci and poly-KGREG signals occur in some tissues and reporters, but negative and incompletely specific findings constrain their interpretation. Production of a repeat-associated product does not demonstrate that it causes neuronal death.
  evidence:
  - reference: PMID:38062616
    reference_title: RNA Foci in Two bi-Allelic RFC1 Expansion Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: RNA fluorescence in situ hybridization of the 2 patients revealed CCTGT- and CCCTT-containing RNA foci, respectively, in neuronal nuclei of tissues with neuronal loss.
    explanation: Autopsy findings support foci formation in two cases; toxicity remains unproven.
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We did not observe in patient brains the presence of RNA foci of either the sense or antisense repeated unit.
    explanation: Preserves the earlier negative finding.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the overall abundance of foci was low, and the specificity was imperfect, with 8.94% of control neurons and 11.3% of CANVAS neurons showing antisense CCCTT RNA foci
    explanation: Patient-neuron signal was small and incompletely specific.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These data suggest that pentapeptide KGREG repeat proteins may be produced from AAGGG repeats in patients with CANVAS in a cell type–specific manner.
    explanation: Postmortem immunoreactivity is suggestive but not perfectly genotype-specific.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: AAGGG repeats are translated into pentapeptide repeat proteins
    explanation: Reporter assays demonstrate translation.
pathophysiology:
- name: Biallelic RFC1 Intronic Repeat Expansion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: The usual genotype contains two expanded nonreference pentanucleotide tracts within RFC1 intron 2, overlapping the poly(A) tail of AluSx3. AAGGG is written on the opposite strand to the RFC1 transcript (CCCTT). Motif, interruptions and length affect interpretation; neither intronic location nor repeat size alone proves regulatory loss of function.
  evidence:
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We used non-parametric linkage analysis and genome sequencing to identify a biallelic intronic AAGGG repeat expansion in the replication factor C subunit 1 (RFC1) gene as the cause of familial CANVAS and a frequent cause of late-onset ataxia, particularly if sensory neuronopathy and bilateral vestibular areflexia coexist.
    explanation: Identifies biallelic intronic RFC1 AAGGG expansion as the cause of CANVAS.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31230722
    reference_title: 'Bioinformatics-Based Identification of Expanded Repeats: A Non-reference Intronic Pentamer Expansion in RFC1 Causes CANVAS.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: a recessively inherited, ancient RE located in intron 2 of RFC1 is the predominant cause of CANVAS
    explanation: Independent confirmation that the intron 2 repeat expansion is the predominant cause.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

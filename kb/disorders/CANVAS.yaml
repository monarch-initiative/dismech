- name: Dorsal Root Ganglion Sensory Neuronopathy
  biological_scale: CELLULAR
  description: >-
    Loss of sensory neuron cell bodies within the dorsal root ganglia, with
    secondary degeneration of the central posterior column tracts. This is a
    ganglionopathy (neuronopathy), not a length-dependent dying-back axonopathy —
    a distinction that explains the non-length-dependent, often asymmetric sensory
    loss and the absence of a glove-and-stocking gradient.

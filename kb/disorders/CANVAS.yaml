- name: Progressive cerebellar ataxia
  category: Neurological
  description: Cerebellar gait and limb incoordination develops variably during the disease course. The 84% rate of cerebellar signs at repeat examination in the 392-person cohort is a composite and is not assigned to this individual phenotype.
  phenotype_term:
    preferred_term: Progressive cerebellar ataxia
    term:
      id: HP:0002073
      label: Progressive cerebellar ataxia
    clinical_course: PROGRESSIVE
  evidence:

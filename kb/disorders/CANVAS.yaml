experimental_models:
- name: Expansion/truncating-allele patient fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: Fibroblasts from two p.Arg423Ter siblings and one p.Pro959GlnfsTer24 carrier were compared with repeat-only cases, controls and an unaffected sibling. Protein data directly characterize the two p.Arg423Ter siblings.
  publication: PMID:36289003
  modeled_mechanisms:
  - target: Decay of Truncating RFC1 Transcripts
    description: Allele-specific RNA depletion supports nonsense-mediated decay.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    evidence:
    - reference: PMID:36289003
      reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Together, the findings suggest that the transcript containing truncating variants in RFC1 undergo nonsense-mediated decay leading to RNA degradation.
      explanation: Patient fibroblast studies characterize the truncating allele in the compound genotype.
  - target: Reduced RFC1 Protein in Truncating-Allele Carriers
    description: Full-length RFC1 protein is reduced in tested compound heterozygotes.
    relationship: PARTIALLY_RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    evidence:
    - reference: PMID:36289003
      reference_title: Truncating Variants in RFC1 in Cerebellar Ataxia, Neuropathy, and Vestibular Areflexia Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: immunoblotting showed a concordant reduction of the 140 KD full-length RFC1 protein in fibroblasts from affected individuals
      explanation: Protein reduction accompanies allele-specific RNA decay.
    limitations: Peripheral fibroblasts do not reproduce neuronal vulnerability, and protein reduction was not shown for every coding allele.
- name: Patient-derived glutamatergic forebrain neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  description: Four patient and three control iPSC lines were generated; key functional comparisons used three per group. These predominantly cortical-like neurons are immature and do not directly represent sensory ganglia or Purkinje cells. One patient line supplied a monoallelic Alu-repeat deletion comparator.

- name: Cranial Sensory Ganglionopathy
  biological_scale: CELLULAR
  description: >-
    Severe loss of vestibular ganglion neurons with atrophy of the vestibular
    nerves, while vestibular hair cells and vestibular nuclei are preserved — the
    lesion is the first-order neuron, not the end organ or the central relay. The
    trigeminal and geniculate ganglia degenerate too, whereas the auditory ganglion
    is relatively spared, which is the anatomical basis for the clinically
    characteristic combination of destroyed vestibular function with normal hearing.
  cell_types:
  - preferred_term: vestibular ganglion neuron
    term:
      id: CL:0000101
      label: sensory neuron
    modifier: DECREASED
  evidence:
  - reference: PMID:33492056
    reference_title: "The Pathology of the Vestibular System in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five temporal bones showed severe loss of vestibular ganglion cells (cell counts 3-16% of normal), and atrophy of the vestibular nerves, whereas vestibular receptor hair cells and the vestibular nuclei were preserved."
    explanation: Localizes the vestibular lesion to the ganglion with sparing of hair cells and nuclei.
  - reference: PMID:33492056
    reference_title: "The Pathology of the Vestibular System in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, auditory receptor hair cells, the auditory ganglia (cell counts 51-100% of normal), and the auditory nerves were relatively preserved."
    explanation: Documents auditory sparing, explaining preserved hearing.
  downstream:
  - target: Vestibular areflexia
    description: Loss of vestibular first-order neurons abolishes the vestibulo-ocular reflex bilaterally.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33492056

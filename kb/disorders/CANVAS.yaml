    explanation: Avoids equating ganglion pathology with one mandatory clinical distribution.
- name: Areflexia
  category: Neurological
  description: Reflexes may be abolished, particularly at the ankles; preserved or brisk reflexes elsewhere do not exclude RFC1 disease.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:

    causal_link_type: UNKNOWN
    description: Impaired sudomotor control can reduce sweating.
  - target: Hyperhidrosis
    causal_link_type: UNKNOWN
    description: Abnormal sudomotor regulation can increase sweating in some patients.
- name: Cough Reflex Hypersensitivity
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: Biallelic RFC1 carriers with refractory cough show heightened capsaicin sensitivity relative to historical healthy controls, broadly comparable to other refractory-cough cohorts. The mechanism may involve peripheral or central sensitization or loss of inhibitory sensory inputs. Direct demonstration of a general vagal-afferent degenerative lesion causing the cough is lacking.
  evidence:
  - reference: PMID:39811557
    reference_title: Repeat expansions in RFC1 gene in refractory chronic cough.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: cough reflex sensitivity was heightened compared to historical healthy controls
    explanation: Four biallelic participants underwent cough-reflex testing; this is not a contemporaneous controlled comparison.
  downstream:
  - target: Chronic cough
    description: Heightened cough-reflex sensitivity accompanies refractory cough in studied carriers; the observational data do not identify its cause.
    causal_link_type: UNKNOWN
- name: Motor Circuit Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: Upper and lower motor signs suggest dysfunction of descending motor control and motor-unit circuits in a subset of RFC1 cases. Their lesion-level basis remains uncertain. One genetically confirmed autopsy showed anterior-horn astrocytic gliosis and axonal swelling around motor-neuron somata, with preserved anterior-horn neurons and corticospinal tracts. This supports a possible synaptic component but does not establish generalized motor-neuron death or identify the lesion responsible for upper motor signs.
  evidence:
  - reference: PMID:34927205
    reference_title: Motor neuron pathology in CANVAS due to RFC1 expansions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed marked astrocytic gliosis and axonal swelling of the synapse between first and second motor neurons in the anterior horn at the lumbar level.
    explanation: The pathology supports circuit-level abnormality in one patient.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10141005/1/awab449%20%281%29.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10141005/1/awab449%20%281%29.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Although the second motor neurons in the anterior and lateral horns were preserved
    explanation: Preserved neuronal somata are part of the reported histological finding, not evidence against the described axonal and glial changes.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Brisk reflexes, particularly in the upper limbs and at the knees, are commonly observed. Other signs of upper and lower motor neuron involvement, including spasticity and/or Babinski sign, muscle atrophy, fasciculations, and weakness, are uncommon.
    explanation: Current synthesis explicitly includes these features.
  downstream:
  - target: Hyperreflexia
    causal_link_type: UNKNOWN
    description: Altered descending control of spinal reflexes is a possible explanation for brisk reflexes; the single autopsy does not establish the responsible upper motor lesion.
  - target: Spasticity
    causal_link_type: UNKNOWN
    description: Impaired descending regulation of muscle tone is inferred from the reported upper motor signs; it has not been localized to the anterior-horn changes seen at autopsy.
  - target: Babinski sign
    causal_link_type: UNKNOWN
    description: An extensor plantar response indicates abnormal descending motor control, but a corresponding corticospinal lesion has not been demonstrated in the available autopsy.
  - target: Fasciculations
    causal_link_type: UNKNOWN
    description: Motor-unit dysfunction can produce fasciculations; the limited pathology permits a synaptic or axonal mechanism without requiring loss of motor-neuron somata.
  - target: Skeletal muscle atrophy
    causal_link_type: UNKNOWN
    description: Impaired motor-unit innervation can contribute to muscle wasting; this is a provisional explanation rather than evidence of generalized motor-neuron degeneration.
  - target: Muscle weakness
    causal_link_type: UNKNOWN
    description: Motor-circuit or motor-unit dysfunction can reduce force generation; sensory impairment and disuse may also contribute in individual patients.
- name: Cognitive Network Dysfunction
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: Executive, attention and working-memory abnormalities have been documented, sometimes meeting cerebellar cognitive affective syndrome criteria. Cerebellar and extra-cerebellar network contributions are plausible, but the responsible anatomical and molecular pathways are unresolved. Dementia is not a typical universal outcome.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Deficits most frequently involve executive functions and attention ... working memory.
    explanation: Current clinical synthesis identifies the affected domains.
  - reference: PMID:38480525
    reference_title: Cognitive Impairment Is Part of the Phenotype of Cerebellar Ataxia, Neuropathy, Vestibular Areflexia Syndrome (CANVAS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Twenty-one patients underwent a complete assessment, including 71% scoring lower than the cutoff at the Montreal Cognitive assessment
    explanation: A small systematically tested cohort demonstrates impairment, not a population frequency.
  downstream:
  - target: Cognitive impairment
    causal_link_type: UNKNOWN
    description: The observed impairment of attention, working memory and executive performance is the clinical expression of the proposed cognitive-network dysfunction.
  - target: Impaired executive functioning
    causal_link_type: UNKNOWN
    description: Executive deficits are a specifically measured component of the cognitive phenotype; their cerebellar and extra-cerebellar substrates remain unresolved.
- name: Multisensory Balance Failure
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: Sensory, vestibular and cerebellar deficits contribute variably to progressive imbalance. Their convergence reduces compensation between balance systems, but the full triad is not required at every stage. In a 392-person cohort, only half were classified as complete CANVAS at last follow-up.
  evidence:
  - reference: PMID:38193360
    reference_title: Role of the repeat expansion size in predicting age of onset and severity in RFC1 disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Overall, 195 patients (50%) had complete CANVAS, 131 (33%) had a complex neuropathy, while 54 (14%) still showed an isolated sensory neuropathy.
    explanation: Defines the spectrum rather than universal progression to the triad.
  downstream:
  - target: Progressive gait imbalance and falls
    description: Combined sensory, vestibular and cerebellar deficits reduce postural stability.
    causal_link_type: UNKNOWN

    explanation: The unusual childhood presentation should not redefine the usual onset distribution.
- phase: Variable progression of multisystem involvement
  notes: At last follow-up, half of the 392-person cohort had complete CANVAS, one third complex neuropathy and 14% isolated sensory neuropathy. Walking aids were required by 54% after a median ten years and a wheelchair by 17% after fourteen years. These are retrospective cohort observations, not individual prognoses.
  evidence:

discussions:
- discussion_id: canvas_mechanism_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which repeat-dependent processes mediate selective neuronal dysfunction, and how much depends on RFC1 expression in each vulnerable lineage?
  attaches_to:
  - pathophysiology#Context-Dependent Reduction of RFC1 Transcript Abundance
  - pathophysiology#Repeat DNA Secondary Structures
  - pathophysiology#RFC1 Intron 2 Retention
  - pathophysiology#Repeat RNA Foci
  - pathophysiology#Repeat-Associated Poly-KGREG Production
  - pathophysiology#Impaired Neuronal Synaptic Signaling
  - pathophysiology#Delayed Repair of Platinum-Induced DNA Damage
  rationale: Published 2024 cortical-like neurons show synaptic dysfunction and partial rescue after monoallelic Alu-repeat deletion, despite preserved RFC1 expression and normal UV-damage recovery. An unreviewed 2025 study of sensory/motor neurons reports modest isogenic-relative transcript reduction and rescue of platinum sensitivity by biallelic deletion. The same deletion can alter expression, repeat products and Alu regulatory functions, so neither result identifies a unique mediator. Foci findings conflict across tissue and assay contexts; positive autopsies keep RNA-mediated hypotheses open. Short-repeat negative toxicity assays cannot exclude longer or endogenous-context effects. Selective vulnerability and relative auditory preservation remain unexplained.
  proposed_experiments:
  - experiment_id: canvas_ganglion_resolved_rfc1_expression
    name: Ganglion-resolved RFC1 expression comparison
    description: Compare matched patient and corrected sensory, vestibular, auditory and Purkinje-lineage cultures using allele-resolved RNA, validated protein quantification and standardized maturation. Test RFC1 replacement independently of repeat deletion and quantify both synaptic and DNA-damage phenotypes.
    decision_criterion: Concordant lineage-specific protein reduction plus rescue by expression restoration would support an expression-mediated mechanism. Preserved protein or failure of adequately controlled replacement would constrain that model without excluding repeat-dependent processes.
  - experiment_id: canvas_g4_modulation_sensory_neurons
    name: G-quadruplex modulation in patient-derived sensory neurons
    description: Measure endogenous repeat DNA and RNA structures with orthogonal, strand-specific methods and perturb G-quadruplex versus triplex formation separately in isogenic neurons.
    decision_criterion: A structure-selective intervention must change the proposed structure and rescue a neuronal endpoint without merely changing RFC1 abundance or causing nonspecific toxicity.
  - experiment_id: canvas_replication_independent_toxicity
    name: Replication-independent repeat toxicity assay
    description: Reassess repeat RNA foci, R-loops and poly-KGREG with validated specificity controls across genotypes, repeat motifs, cell types and ages. Compare published negative short-repeat assays with native-locus and longer-repeat systems.
    decision_criterion: Reproducible genotype-associated products plus selective depletion and neuronal rescue would support toxicity. Product detection alone, or a negative result in one short-term model, would not settle the mechanism.
    evidence:
    - reference: PMID:38062616
      reference_title: RNA Foci in Two bi-Allelic RFC1 Expansion Carriers.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: RNA fluorescence in situ hybridization of the 2 patients revealed CCTGT- and CCCTT-containing RNA foci, respectively, in neuronal nuclei of tissues with neuronal loss.
      explanation: Autopsy findings support foci formation in two cases; toxicity remains unproven.
    - reference: PMID:30926972
      reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We did not observe in patient brains the presence of RNA foci of either the sense or antisense repeated unit.
      explanation: Preserves the earlier negative finding.
    - reference: PMID:39231235
      reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the overall abundance of foci was low, and the specificity was imperfect, with 8.94% of control neurons and 11.3% of CANVAS neurons showing antisense CCCTT RNA foci
      explanation: Patient-neuron signal was small and incompletely specific.
  evidence:
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Gene Ontology (GO) analysis indicated a significant overrepresentation of neuronal signaling processes including synaptic signaling and processes that regulate synaptic signaling
    explanation: Transcriptomic changes converge on neuronal signaling.
  - reference: PMID:39231235
    reference_title: AAGGG repeat expansions trigger RFC1-independent synaptic dysregulation in human CANVAS neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: CANVAS patient iPSC–derived neurons remained devoid of detectable synchronous firing even between 7 and 11 weeks after differentiation
    explanation: Patient neurons had impaired network synchrony.
  - reference: url:https://www.biorxiv.org/content/early/2025/11/18/2025.11.18.688292.source.xml
    reference_title: ABSTRACT
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: expression could only be detected when comparing CANVAS lines with their isogenic corrected counterpart, but not when comparing CANVAS lines with non-isogenic controls
    explanation: Unreviewed November 2025 preprint (Currò et al.; DOI:10.1101/2025.11.18.688292). Motor-neuron qPCR showed about 23% lower expression versus isogenic controls; sensory-neuron reduction was about 15%.
  - reference: url:https://www.biorxiv.org/content/early/2025/11/18/2025.11.18.688292.source.xml
    reference_title: ABSTRACT
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we were unable to demonstrate a significant effect of the repeat expansion on RFC1 protein.
    explanation: Unreviewed November 2025 preprint (Currò et al.; DOI:10.1101/2025.11.18.688292). The preprint does not establish reduced protein abundance.
  - reference: PMID:38062616
    reference_title: RNA Foci in Two bi-Allelic RFC1 Expansion Carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: RNA fluorescence in situ hybridization of the 2 patients revealed CCTGT- and CCCTT-containing RNA foci, respectively, in neuronal nuclei of tissues with neuronal loss.
    explanation: Autopsy findings support foci formation in two cases; toxicity remains unproven.
  - reference: PMID:30926972
    reference_title: Biallelic expansion of an intronic repeat in RFC1 is a common cause of late-onset ataxia.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We did not observe in patient brains the presence of RNA foci of either the sense or antisense repeated unit.
    explanation: Preserves the earlier negative finding.
- discussion_id: canvas_ganglionopathy_not_axonopathy
  kind: INTERPRETATION
  status: OPEN
  prompt: Should the peripheral lesion of CANVAS be modeled as a ganglionopathy rather than conforming to the length-dependent peripheral axonal degeneration module?
  attaches_to:
  - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
  rationale: Neuropathology localizes the predominant peripheral lesion to sensory ganglion neuronal bodies, with secondary tract degeneration. Clinical sensory loss can nevertheless show a distal-to-proximal gradient, so a length-dependent examination pattern does not refute the ganglion lesion. The existing peripheral_axonal_degeneration module specifies a primary dying-back process that is not established here. Purkinje-cell loss supports the existing cerebellar_purkinje_degeneration conformance. A future ganglionopathy module could capture the primary lesion without forcing every clinical case into one sensory distribution.
  notes: Retains the module-conformance question while removing the false claim that all CANVAS sensory loss is non-length-dependent.
  evidence:
  - reference: PMID:24682971
    reference_title: Dorsal root ganglionopathy is responsible for the sensory impairment in CANVAS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Spinal cord pathology demonstrated a marked dorsal root ganglionopathy with secondary tract degeneration.
    explanation: Direct neuropathology in clinically defined CANVAS predating molecular diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable
    reference_title: RFC1-Related Disorders - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Altered sensation in all limbs in either a length-dependent (distal extremities worse) or non-length-dependent pattern.
    explanation: Clinical distribution does not by itself determine the site of the primary lesion.
- discussion_id: canvas_penetrance_modifiers
  kind: INTERPRETATION
  status: OPEN
  prompt: Do DNA-repair pathway variants modify penetrance of biallelic RFC1 expansions?
  attaches_to:
  - genetic#RFC1
  rationale: A 2026 study associated DNA mismatch-repair polygenic scores and rs245100 upstream of MSH3 with clinically affected biallelic carriers across discovery and replication cohorts. This is candidate modifier evidence, not proof that rs245100 regulates MSH3 or that altered somatic expansion mediates RFC1 disease. Clinical-record ascertainment, repeat configuration and age complicate classification of apparently unaffected carriers. A separate unreviewed platinum-neuropathy association in heterozygotes does not establish dominant CANVAS or a clinical pharmacogenetic recommendation.
  evidence:
  - reference: PMID:42473260
    reference_title: DNA Repair Pathway Variants Are Enriched in Individuals with Biallelic AAGGG CANVAS and RFC1-Related Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The variant rs245100, upstream MSH3, was the biggest contributor to this elevated risk
    explanation: Association nominates a locus; it does not establish a regulatory target or causal mechanism.
- discussion_id: canvas_ortholog_loss_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: How closely do ortholog-depletion models represent the human intronic-repeat disorder?
  attaches_to:
  - pathophysiology#Context-Dependent Reduction of RFC1 Transcript Abundance
  - pathophysiology#Cerebellar Purkinje Cell Loss
  rationale: The zebrafish model is a complete rfc1 knockout with early cerebellar progenitor loss and death by 10 days; the fly preprint uses neuronal ortholog knockdown. Neither organism model carries the human intronic expansion. Human repeat-only neurons can preserve RFC1 protein, and clinical disease is usually late onset. The models support a requirement for RFC1 but cannot establish that expansion-mediated disease is equivalent to complete or partial gene depletion.
  evidence:
  - reference: PMID:40595562
    reference_title: RFC1 regulates the expansion of neural progenitors in the developing zebrafish cerebellum.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the loss of RFC1 jeopardizes the genomic integrity of these progenitor cells
    explanation: Complete knockout disrupts developing progenitor populations.
notes: 'RFC1-related disease includes both the complete CANVAS triad and less extensive sensory-predominant presentations. Historical ungenotyped neuropathology and genetically confirmed observations are distinguished because clinical CANVAS can have other genetic causes. The November 2025 Currò study (DOI:10.1101/2025.11.18.688292) remains a preprint; its sensory/motor-neuron and fly findings require independent confirmation. Experimental repeat-region deletion is a mechanistic intervention, not an established clinical therapy. The bioRxiv source XML is the full text of the Currò et al. preprint, CANVAS causing AAGGG repeat expansions cause tissue-specific reduction in RFC1 expression and increase sensitivity to DNA damage (DOI:10.1101/2025.11.18.688292). The UCL awab449 PDF is the accepted manuscript of PMID:34927205, Motor neuron pathology in CANVAS due to RFC1 expansions. Parkinsonism and REM sleep behavior disorder are recorded as observed associations without a causal graph connection: their basal-ganglia or brainstem substrates are not explained by the anterior-horn lesion, and coexisting Lewy pathology in one autopsy limits attribution to RFC1. Motor phenotype links represent
  provisional circuit-level explanations; preserved corticospinal tracts and motor-neuron somata in the available autopsy prevent localization of all motor signs to that lesion.'

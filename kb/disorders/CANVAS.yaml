- name: Multisensory Balance Failure
  biological_scale: ORGANISM
  description: >-
    The clinically defining feature of CANVAS is that all three systems used to
    stabilise posture and gaze — proprioception, vestibular input, and cerebellar
    processing — fail together. Because each system normally compensates for loss of
    the others, their simultaneous failure produces imbalance disproportionate to
    any single deficit. This triple-deafferentation is why CANVAS causes greater
    disability than an isolated sensory neuronopathy, isolated vestibulopathy, or
    isolated cerebellar degeneration of comparable individual severity.
  evidence:
  - reference: PMID:33492056
    reference_title: "The Pathology of the Vestibular System in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by progressive imbalance due to a combination of cerebellar, somatosensory, and selective vestibular impairment with normal hearing"
    explanation: >-
      States explicitly that the imbalance arises from the combination of the three
      impairments.
  downstream:
  - target: Progressive gait imbalance and falls
    description: >-
      Loss of all three balance channels produces progressive unsteadiness and a
      high falls risk, the dominant source of disability.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33492056
      reference_title: "The Pathology of the Vestibular System in CANVAS."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "an adult-onset recessively-inherited ataxia, characterized by progressive imbalance"
      explanation: Documents progressive imbalance as the clinical consequence.

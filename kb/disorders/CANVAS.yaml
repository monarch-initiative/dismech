- name: Avoidance of Neurotoxic Agents
  description: >-
    A specific and actionable management point: agents toxic to the peripheral
    nerves (neurotoxic chemotherapy, pyridoxine), the cerebellum (phenytoin), or the
    vestibular system (aminoglycosides) should be avoided, as should chronic alcohol
    consumption. Each of these targets a system already compromised in CANVAS, so
    exposure risks compounding an existing deficit.
  therapeutic_modality: BEHAVIORAL

histopathology:
- name: Sensory ganglion neuronal loss
  description: >-
    Marked neuronal loss in the dorsal root ganglia with secondary degeneration of
    the posterior column tracts, and severe depletion of vestibular ganglion cells
    (3-16% of normal counts) with preserved vestibular hair cells and nuclei. The
    trigeminal and geniculate ganglia are also affected while the auditory ganglion
    is relatively preserved.
  evidence:
  - reference: PMID:33492056
    reference_title: "The Pathology of the Vestibular System in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All five temporal bones showed severe loss of vestibular ganglion cells (cell counts 3-16% of normal), and atrophy of the vestibular nerves, whereas vestibular receptor hair cells and the vestibular nuclei were preserved."
    explanation: Quantitative histopathology of the vestibular ganglionopathy.
  - reference: PMID:24682971
    reference_title: "Dorsal root ganglionopathy is responsible for the sensory impairment in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spinal cord pathology demonstrated a marked dorsal root ganglionopathy with secondary tract degeneration."
    explanation: Spinal histopathology of the dorsal root ganglionopathy.
- name: Cerebellar Purkinje cell depletion
  description: Loss of Purkinje cells with a vermis predominance.
  evidence:
  - reference: PMID:24682971
    reference_title: "Dorsal root ganglionopathy is responsible for the sensory impairment in CANVAS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

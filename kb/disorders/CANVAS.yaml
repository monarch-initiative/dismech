  description: >-
    Physical and occupational therapy for gait, balance, and falls prevention.
    Rehabilitation is constrained in CANVAS in a way that is mechanistically
    informative: standard vestibular rehabilitation relies on substituting
    proprioceptive and visual cues for lost vestibular input, but proprioception is
    also lost here, which limits the usual compensation strategy.

    directness: DIRECT
    snippet: Examination reveals oculomotor signs (including gaze-evoked nystagmus, downbeat nystagmus, saccadic pursuit, and dysmetric saccades) and gait and limb ataxia.
    explanation: Documents cerebellar manifestations.
- name: Vestibular areflexia

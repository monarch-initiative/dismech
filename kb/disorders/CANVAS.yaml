    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Signs and symptoms including postural hypotension, erectile dysfunction, chronic constipation, urinary dysfunction, and altered sweating are relatively common but rarely disabling.
    explanation: Defines the autonomic spectrum without a single cross-cohort frequency.
- name: Dysphagia
  category: Gastrointestinal
  description: Swallowing difficulty can arise later, increasing aspiration and nutritional risk. A published 51% combined dysarthria/dysphagia endpoint is not a dysphagia-specific rate.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK564656/?report=printable

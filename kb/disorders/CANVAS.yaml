- name: Cerebellar atrophy
  category: Neurological
  description: MRI often shows vermian and variable hemispheric atrophy, but a normal early MRI does not exclude RFC1 disease. A small 2025 longitudinal cohort found progression in brainstem, thalamus, hippocampus and upper spinal cord without significant cerebellar or white-matter microstructural change over two years.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy

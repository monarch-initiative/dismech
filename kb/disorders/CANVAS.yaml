- name: Genetic Counseling
  description: >-
    Autosomal recessive counseling with a 25% sibling recurrence risk when both
    parents are carriers. Counseling must address pseudodominance, since the high
    carrier frequency means affected individuals can appear in consecutive
    generations and be mistaken for dominant transmission.
  therapeutic_modality: BEHAVIORAL

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "To describe the site of lesion responsible for the severe, bilateral, symmetrical, selective loss of vestibular function"
      explanation: Identifies the ganglionic lesion as the site responsible for vestibular loss.
  - target: Oscillopsia
    description: >-
      Failure of the vestibulo-ocular reflex prevents gaze stabilization during head
      motion, producing apparent movement of the visual scene.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

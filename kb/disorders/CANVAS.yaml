name: CANVAS
category: Mendelian
creation_date: "2026-07-30T20:10:00Z"
synonyms:
- Cerebellar ataxia, neuropathy, and vestibular areflexia syndrome
- RFC1 CANVAS spectrum disorder
- Cerebellar ataxia with bilateral vestibulopathy syndrome
- CABV syndrome
description: >-
  CANVAS is a late-onset, autosomal recessive neurodegenerative disorder caused by
  a biallelic intronic pentanucleotide repeat expansion in RFC1, most commonly
  (AAGGG)n replacing the reference (AAAAG)n within the poly(A) tail of an AluSx3
  element in intron 2. It is defined by the convergence of three independent
  balance-control deficits — cerebellar degeneration, bilateral vestibular
  areflexia, and a sensory neuronopathy — producing a triple-deafferentation
  syndrome whose imbalance exceeds what any single deficit would cause. The
  peripheral lesion is mechanistically a ganglionopathy (loss of sensory neuron
  cell bodies in the dorsal root and cranial sensory ganglia), not a
  length-dependent dying-back axonopathy, and the same ganglionopathy spares the
  auditory ganglion, which is why hearing is preserved while vestibular function
  is destroyed. Chronic dry cough frequently precedes neurological onset by years
  to decades and is the most common early clue. The disorder is a leading
  identified cause of late-onset ataxia, and its pathogenic mechanism remains
  genuinely unresolved: the expansion does not reduce RFC1 expression in patient
  tissue, so an overt loss-of-function model is not supported. Because the
  expansion lies in an intron and is absent from the reference sequence, it is not
  detectable by exome sequencing or sequence-based gene panels, and requires
  targeted repeat testing.

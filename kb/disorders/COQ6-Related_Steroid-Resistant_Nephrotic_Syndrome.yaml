genetic:
- name: COQ6
  gene_term:
    preferred_term: COQ6
    term:
      id: hgnc:20233
      label: COQ6
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants on chromosome 14q24.3. Missense alleles predominate in the
    classic oto-renal presentation; the two nonsense alleles reported in a Chinese
    family (p.Tyr83Ter and p.Gln461Ter) segregated with death in early infancy,
    consistent with residual activity setting position on the severity spectrum.
    Audiological response to CoQ10 appears genotype-specific.
  evidence:
  - reference: PMID:35111204
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two rare recessive nonsense mutations in the COQ6 gene segregating
      with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T
      (p.Gln461Ter), resulting in two truncated protein products
    explanation: Identifies the truncating alleles found at the severe end.


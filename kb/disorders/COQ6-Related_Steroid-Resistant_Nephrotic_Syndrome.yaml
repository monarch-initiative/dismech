genetic:
- name: COQ6
  gene_term:
    preferred_term: COQ6
    term:
      id: hgnc:20233
      label: COQ6
  relationship_type: CAUSATIVE
  variants:
  - name: c.249C>G (p.Tyr83Ter)
    description: >-
      Nonsense allele producing a truncated protein. Reported in trans with
      p.Gln461Ter in two Chinese siblings who presented with severe metabolic acidosis
      and died in early infancy.
    functional_effects:
    - function: ubiquinone biosynthesis monooxygenase activity
      type: loss-of-function
      description: >-
        A stop codon at residue 83 truncates the protein before the FAD-binding
        monooxygenase domain, so no residual hydroxylase activity is expected. Recorded
        as a structured effect rather than left in prose because the entry's whole
        genotype-phenotype argument is that position on the severity spectrum tracks
        residual activity - which is only queryable if the alleles with none say so.
    evidence:
    - reference: PMID:35111204
      reference_title: "A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified two rare recessive nonsense mutations in the COQ6 gene segregating
        with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T
        (p.Gln461Ter), resulting in two truncated protein products
      explanation: Identifies the allele and its truncating consequence.
  - name: c.1381C>T (p.Gln461Ter)
    description: >-
      The second nonsense allele in the same family, in trans with p.Tyr83Ter.
    functional_effects:
    - function: ubiquinone biosynthesis monooxygenase activity
      type: loss-of-function
      description: >-
        The later of the two stop codons, and the reason the sibling pair is a
        compound-heterozygous null rather than a hypomorph. With no functional allele
        on either chromosome the phenotype was lethal in infancy, which is the extreme
        this entry's severity spectrum is anchored against.
    evidence:
    - reference: PMID:35111204
      reference_title: "A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we identified two rare recessive nonsense mutations in the COQ6 gene segregating
        with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T
        (p.Gln461Ter), resulting in two truncated protein products
      explanation: Identifies the allele and its truncating consequence.
  notes: >-
    Biallelic variants on chromosome 14q24.3. Missense alleles predominate in the
    classic oto-renal presentation; the two nonsense alleles above segregated with
    death in early infancy, consistent with residual activity setting position on the
    severity spectrum. Audiological response to CoQ10 appears genotype-specific.
  evidence:
  - reference: PMID:35111204
    reference_title: "A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified two rare recessive nonsense mutations in the COQ6 gene segregating
      with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T
      (p.Gln461Ter), resulting in two truncated protein products
    explanation: Identifies the truncating alleles found at the severe end.


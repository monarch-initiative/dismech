treatments:
- name: Oral Coenzyme Q10 Replacement
  description: Early specialist-directed supplementation supplies CoQ10 despite the biosynthetic defect. The international study reported >50% proteinuria reduction in 10/15 informative pre-ESKD COQ6 patients and complete remission in 7/12. Eight matched treated children preserved kidney function, but only three reached five years of follow-up. These observational results support benefit without guaranteeing response. In the Korean hearing series, 3/7 longitudinally assessed patients had stability or improvement; hearing can worsen or first appear during therapy. Published doses and formulations vary.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

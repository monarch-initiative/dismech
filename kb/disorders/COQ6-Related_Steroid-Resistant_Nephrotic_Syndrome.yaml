  modeled_mechanisms:
  - target: Podocyte Cytoskeletal Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reduced nephrin/F-actin and disorganized actin after knockdown.
    limitations: No time-resolved causal order among oxidation, cytoskeletal changes and death was established.
    evidence:
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the expression levels of both proteins were significantly lower in the si-RNA-COQ6 group than in the control group
      explanation: The measured proteins were nephrin and F-actin in mouse podocytes.
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: F-actin immunofluorescence in the si-COQ6 group was irregularly distributed
      explanation: Actin organization was disturbed after knockdown; timing relative to ROS and apoptosis was not resolved.
  - target: Altered Cellular Redox State
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: MitoSOX signal increased after knockdown.
    limitations: This assay does not establish a universal redox phenotype in all cells or tissues.
    evidence:
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ROS levels were increased when the MPCs were incubated with si-COQ6 compared to the normal group.
      explanation: Mouse podocyte knockdown increased mitochondrial MitoSOX signal; the patient variant claim in this paper is not used as clinical genetic evidence.
- name: COQ6-Delta25 HEK293 Cells
  experimental_model_type: CELL_LINE
  publication: PMID:31379988
  description: CRISPR editing removed 25 amino acids from a FAD-binding region. Immunoblotting detected no residual protein; endogenous CoQ synthesis, II+III activity, ATP and coupled respiration fell. Vanillic acid restored biochemical function.
  modeled_mechanisms:
  - target: Coenzyme Q10 Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Models impaired endogenous synthesis and vanillic-acid bypass rescue.
    limitations: Engineered in-frame deletion; protein below detection and off-target effects were not excluded. Cells are not patient podocytes.
    evidence:
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Incorporation of 14C-labelled 4-HB was virtually undetectable
      explanation: COQ6-delta25 HEK293 cells showed virtually absent endogenous CoQ10 synthesis despite residual CoQ10 acquired from culture medium.
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Treatment with VA can recover CoQ biosynthesis and ATP production.
      explanation: Rescue in edited human HEK293 cells, not a human clinical trial.
  - target: Cellular ATP Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: ATP deficiency was reversed with vanillic acid.
    limitations: Cellular rescue is not evidence of clinical efficacy or safety.
    evidence:
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ATP levels were markedly reduced in COQ6∆25 cells, but after VA supplementation, they were virtually normal
      explanation: Cellular ATP deficiency and bypass rescue were measured in the HEK293 model, not in patient organs.
animal_models:
- name: coq6 Morpholino Zebrafish
  species: Zebrafish
  genotype: Transient coq6 morpholino knockdown
  publication: PMID:21540551
  description: Translation- and splice-blocking morpholinos increased apoptosis in embryonic heads and trunks at 28 hours after fertilization. No CoQ10 rescue condition or podocyte-specific renal phenotype was demonstrated.
  modeled_mechanisms:
  - target: Podocyte Apoptosis
    relationship: RECAPITULATES
    fidelity: LOW
    description: Supports a conserved association between COQ6 depletion and apoptosis in a whole vertebrate.
    limitations: The measured head/trunk apoptosis is not renal or podocyte-specific, so fidelity to the human kidney lesion is low. No treatment rescue was tested.
    evidence:
    - reference: PMID:21540551
      reference_title: COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: coq6 knockdown in zebrafish embryos 28 hours after fertilization increases apoptosis
      explanation: Figure 5D-F reports the zebrafish knockdown phenotype.
- name: Yeast coq6 Deletion Complemented with Human Alleles
  species: Saccharomyces cerevisiae
  genotype: coq6 deletion with wild-type or mutant human COQ6 constructs
  publication: PMID:24140869
  description: Respiratory growth and CoQ content characterize residual activity of human variants and the effects of vanillic acid or 3,4-dihydroxybenzoate. Expression system and promoter strength influence complementation.
  modeled_mechanisms:
  - target: Deficient C5-Ring Hydroxylation in CoQ10 Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Tests allele function and precursor bypass.
    limitations: Yeast CoQ-complex stability requirements differ from the human-cell model; residual activity is assay-dependent and does not establish patient severity.
    evidence:
    - reference: PMID:24140869
      reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These data suggest that the human G255R, A353D, Y412C and Q461sf478X mutations are hypomorphic since the corresponding yeast Coq6 mutants display residual activity.
      explanation: Improved yeast complementation assays detect residual activity missed by the initial assay; these results cannot define every patient allele.
    - reference: PMID:24140869
      reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We detected a partial rescue of the phenotype in the presence of the analogues in all cases. VA seemed more efficient than 3,4 diHB, with effects already evident at 0.1 mM
      explanation: Yeast carrying the tested human COQ6 mutant alleles responded to ring-precursor analogues.
discussions:
- discussion_id: coq6_isoform_variant_interpretation
  kind: INTERPRETATION
  prompt: Does the reported p.Trp14* variant establish COQ6-related nephropathy?
  attaches_to:
  - genetic#COQ6
  - diagnosis#Molecular genetic testing in steroid-resistant nephrotic syndrome
  rationale: The 2018 FSGS paper reported a heterozygous NM_182480:c.41G>A p.Trp14* variant. The 2019 study found that this transcript encodes inactive isoform c and noted the variant in apparently healthy homozygotes. These observations undermine attribution of that patient's FSGS to this variant, while leaving the independently performed COQ6-knockdown experiments informative.
  evidence:
  - reference: PMID:31379988
    reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Overall, these observations indicate that COQ6 isoforms b and c are not essential and are not involved in CoQ deficiency.
    explanation: The isoform study explains why a premature stop in the alternative first exon need not disrupt the active enzyme.
- discussion_id: coq6_organ_selectivity
  kind: KNOWLEDGE_GAP
  prompt: Which cochlear and optic cell lesions determine the sensory phenotype?
  attaches_to:
  - pathophysiology#Cochlear Dysfunction
  - pathophysiology#Optic Nerve Involvement
  rationale: The cited rat study localizes COQ6 to several cochlear compartments but does not demonstrate which fails first. Podocyte rescue and nonspecific zebrafish embryonic apoptosis cannot establish the sensory mechanism. Clinical hearing and visual outcomes therefore should not be explained solely by tissue expression or transferred from renal models.
- discussion_id: coq6_treatment_response_variability
  kind: KNOWLEDGE_GAP
  prompt: How do genotype, treatment timing and concurrent therapy influence response?
  attaches_to:
  - treatments#Oral Coenzyme Q10 Replacement
  - genetic#COQ8B candidate modifier
  rationale: The small hearing cohort reported a poorer trajectory with p.Gln229Pro, while apparent benefits for p.Lys64del and p.Pro261Leu were not statistically significant. Historical renal comparisons favor CoQ10 but are not randomized, and concomitant therapies complicate attribution. COQ8B modifier observations remain unconfirmed. These findings do not support delaying treatment based on a predicted poor-response genotype.
notes: This entry covers the variable biallelic COQ6-deficiency spectrum under its established oto-renal disease name. Hearing loss and complete nephrotic syndrome are not obligatory at every age. Cohort counts describe ascertained patients and are not population prevalence estimates. Clinical management and experimental rescue evidence are distinguished.

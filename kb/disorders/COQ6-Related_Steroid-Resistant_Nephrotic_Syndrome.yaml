name: COQ6-Related Steroid-Resistant Nephrotic Syndrome with Sensorineural Deafness
description: >-
  Biallelic variants in COQ6, a FAD-dependent monooxygenase that performs C5-ring
  hydroxylation during coenzyme Q10 biosynthesis, cause a primary CoQ10 deficiency
  (COQ10D6) presenting as steroid-resistant nephrotic syndrome with sensorineural
  hearing loss. The tissue selectivity follows the protein's expression: COQ6 is found
  in glomerular podocytes and in the stria vascularis of the inner ear, and those are
  the two structures that fail. "Steroid-resistant" here is a mechanistic prediction
  rather than an empirical label - the lesion is a biosynthetic deficiency, not an
  immune one, so immunosuppression has nothing to act on. The corresponding prediction
  is that the disease should respond to the missing metabolite, and oral CoQ10 does
  induce remission of proteinuria, with benefit depending strongly on how much
  irreversible damage has already accrued.
disease_term:
  preferred_term: familial steroid-resistant nephrotic syndrome with sensorineural deafness
  term:
    id: MONDO:0013836
    label: familial steroid-resistant nephrotic syndrome with sensorineural deafness

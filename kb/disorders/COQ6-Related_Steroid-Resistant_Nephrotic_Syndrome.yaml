  relationship_type: CAUSATIVE
  variants:
  - name: c.249C>G (p.Tyr83Ter)
    description: Reported on NM_182476.3 in trans with the other nonsense allele in two severely affected infants. Truncation or nonsense-mediated decay was predicted; patient enzyme activity and CoQ10 content were not measured.
    evidence:
    - reference: PMID:35111204
      reference_title: A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'we identified two rare recessive nonsense mutations in the COQ6 gene segregating with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T (p.Gln461Ter), resulting in two truncated protein products'
      explanation: The family study establishes segregation and predicted sequence consequences, not a measured complete loss of enzyme function.
  - name: c.1381C>T (p.Gln461Ter)
    description: NM_182476.3:c.1381C>T is predicted to remove seven C-terminal residues. It segregated in trans with p.Tyr83Ter in two severely affected infants, but residual function was not measured; it is not a demonstrated null allele.
    evidence:
    - reference: PMID:35111204
      reference_title: A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'we identified two rare recessive nonsense mutations in the COQ6 gene segregating with disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T (p.Gln461Ter), resulting in two truncated protein products'
      explanation: The family study establishes segregation and predicted sequence consequences, not a measured complete loss of enzyme function.
  - name: p.Gly255Arg and p.Ala353Asp
    description: Recurrent homozygous missense alleles in the founding families. Improved yeast assays support residual function. Cohort associations with earlier p.Gly255Arg and later p.Ala353Asp onset are probabilistic.
    evidence:
    - *id004
  - name: p.Gln461fsTer478 and p.Trp447Ter
    description: The founding compound-heterozygous pair includes a frameshift with residual activity in improved yeast assays. p.Trp447Ter can retain a structural contribution sufficient for vanillic-acid rescue in yeast.
    evidence:
    - reference: PMID:24140869
      reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Interestingly this was observed also with the W447X truncating mutation, indicating that this should not be considered a null allele.
      explanation: Bypass rescue indicates retained structural contribution even though catalytic complementation was absent.
  - name: Korean cohort alleles
    description: NM_182476.3 alleles include an in-frame deletion, nonsense and missense variants. The small hearing series does not establish a general clinical treatment-selection rule.
    evidence:
    - reference: PMID:36124066
      reference_title: Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Four different causative COQ6 variants were identified either homozygous or compound heterozygous: c.189_191delGAA (p.Lys64del), c.484C>T (p.Arg162∗), c.686A>C (p.Gln229Pro), and c.782C>T (p.Pro261Leu).'
      explanation: These alleles were identified in twelve children and segregated with the familial phenotype.
  notes: Disease-associated variants include missense, in-frame deletion, nonsense, and frameshift alleles. Functional residual activity is allele- and assay-dependent; a truncating label alone does not prove a null allele. The same homozygous p.Ala353Asp genotype can produce different renal phenotypes within a family. Reported genotype-course associations are not deterministic predictors.

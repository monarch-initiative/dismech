  - target: Optic Nerve Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Optic neuropathy is documented clinically; its cellular route from CoQ deficiency remains unresolved.
    evidence:
    - reference: PMID:32685349
      reference_title: COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy.

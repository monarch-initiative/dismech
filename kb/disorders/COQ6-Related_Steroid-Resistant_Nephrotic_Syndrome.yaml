name: COQ6-Related Steroid-Resistant Nephrotic Syndrome with Sensorineural Deafness
description: Biallelic pathogenic COQ6 variants impair coenzyme Q10 biosynthesis and cause primary coenzyme Q10 deficiency-6. Steroid-resistant nephrotic syndrome and sensorineural hearing loss are characteristic, but isolated proteinuria, hearing loss without renal involvement, and additional neurologic, ocular, or severe infantile manifestations occur. Renal and auditory courses vary, including within families. Early oral CoQ10 supplementation can reduce proteinuria and preserve kidney function; hearing benefit is less consistent. Steroid resistance describes an observed treatment response and does not imply that all antiproteinuric therapies are ineffective.
disease_term:
  preferred_term: familial steroid-resistant nephrotic syndrome with sensorineural deafness
  term:
    id: MONDO:0013836
    label: familial steroid-resistant nephrotic syndrome with sensorineural deafness
creation_date: '2026-08-27T18:45:00Z'
pathophysiology:
- name: Biallelic COQ6 Dysfunction
  biological_scale: MOLECULAR
  description: Biallelic pathogenic variants reduce COQ6 function. Missense, in-frame deletion, nonsense, and frameshift alleles have been reported. Residual activity varies; truncating sequence changes do not automatically establish complete functional null alleles.
  evidence:
  - &id005
    reference: PMID:21540551
    reference_title: COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All 11 affected individuals of the 5 families with 2 recessive COQ6 mutations had SRNS.
    explanation: The founding series included 11 affected individuals in five families with biallelic variants; two additional single-heterozygous cases were not molecularly resolved.
  - &id004
    reference: PMID:24140869
    reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These data suggest that the human G255R, A353D, Y412C and Q461sf478X mutations are hypomorphic since the corresponding yeast Coq6 mutants display residual activity.
    explanation: Improved yeast complementation assays detect residual activity missed by the initial assay; these results cannot define every patient allele.
  downstream:
  - target: Deficient C5-Ring Hydroxylation in CoQ10 Biosynthesis
    causal_link_type: DIRECT
    description: Reduced enzyme function impairs the C5 modification required for CoQ synthesis.
    evidence:
    - reference: PMID:24140869
      reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These data suggest that the human G255R, A353D, Y412C and Q461sf478X mutations are hypomorphic since the corresponding yeast Coq6 mutants display residual activity.
      explanation: Improved yeast complementation assays detect residual activity missed by the initial assay; these results cannot define every patient allele.
- name: Deficient C5-Ring Hydroxylation in CoQ10 Biosynthesis
  biological_scale: MOLECULAR
  description: COQ6 is a FAD-dependent monooxygenase required for C5 hydroxylation of the CoQ ring. Yeast modeling supports impaired substrate access for the G248R counterpart of human p.Gly255Arg; engineered L382E and double-mutant results do not establish a universal mechanism for human missense alleles.
  evidence:
  - reference: PMID:24140869
    reference_title: Effect of vanillic acid on COQ6 mutants identified in patients with coenzyme Q10 deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Human COQ6 encodes a monooxygenase which is responsible for the C5-hydroxylation of the quinone ring of coenzyme Q (CoQ).
    explanation: Background functional assignment supported by complementation and bypass experiments.
    quote_role: BACKGROUND
  - reference: PMID:26808124
    reference_title: 'Coenzyme Q Biosynthesis: Evidence for a Substrate Access Channel in the FAD-Dependent Monooxygenase Coq6.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show here through biochemical studies that Coq6 is a flavoprotein using FAD as a cofactor.
    explanation: Biochemical characterization of recombinant yeast Coq6 establishes FAD binding; this is not a patient enzyme assay.
  - reference: PMID:26808124
    reference_title: 'Coenzyme Q Biosynthesis: Evidence for a Substrate Access Channel in the FAD-Dependent Monooxygenase Coq6.'
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: We identify a putative access channel for Coq6 in a wild type model and propose in silico mutations positioned at its entrance capable of partially (G248R and L382E single mutations) or completely (a G248R-L382E double-mutation) blocking access to the channel for the substrate.
    explanation: Homology models of yeast Coq6 predict channel narrowing. G248R corresponds to human G255R; L382E and the double mutant were engineered tests.

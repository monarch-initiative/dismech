      explanation: COQ6-delta25 HEK293 cells showed virtually absent endogenous CoQ10 synthesis despite residual CoQ10 acquired from culture medium.
- name: Coenzyme Q10 Deficiency
  biological_scale: MOLECULAR
  description: Reduced endogenous cellular CoQ10 compromises its electron-carrier and antioxidant functions. The magnitude and tissue distribution of deficiency vary.
  evidence:
  - reference: PMID:31379988
    reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Incorporation of 14C-labelled 4-HB was virtually undetectable
    explanation: COQ6-delta25 HEK293 cells showed virtually absent endogenous CoQ10 synthesis despite residual CoQ10 acquired from culture medium.
  downstream:
  - target: Deficient CoQ-Dependent Electron Transfer
    causal_link_type: DIRECT
    description: Loss of CoQ limits coupled electron transfer between respiratory complexes.
    evidence:
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Activities of individual respiratory chain enzymes were normal; however, combined activity of complexes II and III was markedly reduced in these cells, consistent with severe CoQ10 deficiency
      explanation: CoQ-dependent combined respiratory-chain activity was deficient in edited HEK293 cells; individual complex activities were normal.
  - target: Altered Cellular Redox State
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Oxidant accumulation varies with cell model and assay; a single mitochondrial ROS pattern is not established.
    evidence:
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: ROS levels were increased when the MPCs were incubated with si-COQ6 compared to the normal group.
      explanation: Mouse podocyte knockdown increased mitochondrial MitoSOX signal; the patient variant claim in this paper is not used as clinical genetic evidence.
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: we did not detect a significant increase of mitochondrial ROS production using mitochondrially targeted ro-GFP
      explanation: The HEK293 model did not reproduce increased mitochondrial oxidation on this assay; increased total cellular oxidant signal should not be equated with a universal mitochondrial ROS increase.
    - reference: PMID:31379988
      reference_title: Vanillic Acid Restores Coenzyme Q Biosynthesis and ATP Production in Human Cells Lacking COQ6.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: we found increased levels in the COQ6∆25 cells. VA treatment was able to decrease ROS to basal levels, while CoQ supplementation was only partially effective
      explanation: Total cellular CM-H2DCFDA signal increased in the HEK293 model and responded differently to VA versus exogenous CoQ.
  - target: Podocyte Cytoskeletal Disorganization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: COQ6 knockdown reduces nephrin/F-actin and disrupts actin organization; intermediates are unresolved.
    evidence:
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the expression levels of both proteins were significantly lower in the si-RNA-COQ6 group than in the control group
      explanation: The measured proteins were nephrin and F-actin in mouse podocytes.
    - reference: PMID:30425193
      reference_title: New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: F-actin immunofluorescence in the si-COQ6 group was irregularly distributed
      explanation: Actin organization was disturbed after knockdown; timing relative to ROS and apoptosis was not resolved.
  - target: Podocyte Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Knockdown-associated apoptosis is partly reversed by CoQ10 supplementation.
    evidence:
    - reference: PMID:21540551

treatments:
- name: Oral Coenzyme Q10 Replacement
  description: >-
    Supplies the missing end product, bypassing the biosynthetic block rather than
    correcting it. Benefit is strongly dependent on how early it is started, because it
    cannot reverse established glomerular scarring or lost cochlear function.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Coenzyme Q10 Deficiency
    treatment_effect: BYPASSES
    description: >-
      Exogenous CoQ10 supplies the product the blocked pathway cannot make. This is the
      node the treatment acts on; every downstream benefit follows from it.
    evidence:
    - reference: PMID:21540551
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused
        apoptosis that was partially reversed by coenzyme Q10 treatment
      explanation: >-
        Demonstrates rescue at the cellular level, which is the mechanistic basis for
        the clinical use.
  - target: Steroid-Resistant Nephrotic Syndrome
    treatment_effect: RESTORES
    description: >-
      Complete and sustained remission of proteinuria has been reported, including
      after failure of a calcineurin inhibitor.
    evidence:
    - reference: PMID:30232548
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After 12 months of CoQ10 therapy, the child remains in full remission, her
        physical development accelerated, frequent respiratory airways diseases
        subsided.
      explanation: Documents durable remission on treatment.
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: MODULATES
    description: >-
      Partial and genotype-dependent: in a 12-patient series just under half showed no
      further loss or improvement.
    evidence:
    - reference: PMID:36124066
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The response rate (no further hearing loss or improvement) was 42.9%; CoQ10
        replacement therapy may thus limit and even improve hearing loss.
      explanation: >-
        Quantifies the audiological response. Graded PARTIAL because fewer than half
        responded and the endpoint combines stabilization with improvement.
  evidence:
  - reference: PMID:35111204
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nevertheless, patients may not benefit from CoQ10 therapy when severe renal and
      neurological damage is established.
    explanation: >-
      States the limit on efficacy that makes timing the decisive variable; graded
      OTHER as a review statement in the paper's introduction rather than its own
      result.

- name: Cochlear Implantation
  description: >-
    For hearing not preserved by early CoQ10, with outcomes reported as generally
    favourable and sustained.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: MODULATES
    description: >-
      Bypasses the failed cochlear transduction rather than treating the metabolic
      lesion.
  evidence:
  - reference: PMID:36124066
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of cochlear implantation were generally favorable, and the effects
      were sustained over time.
    explanation: Reports the outcome of implantation in this patient group.

discussions:
- discussion_id: coq6_steroid_resistance_is_predicted
  kind: INTERPRETATION
  prompt: >-
    Is steroid resistance in this disease an empirical finding or a prediction of the
    mechanism?
  attaches_to:
  - pathophysiology#Steroid-Resistant Nephrotic Syndrome
  - treatments#Oral Coenzyme Q10 Replacement
  rationale: >-
    The phrase "steroid-resistant" entered this entity's name from nephrology, where it
    classifies nephrotic syndrome by observed response. But once the lesion is known to
    be a defect of coenzyme Q10 biosynthesis in podocytes, resistance to
    immunosuppression is what the mechanism predicts: there is no immune process for a
    steroid or a calcineurin inhibitor to suppress. The reported case in which
    calcineurin inhibition failed and CoQ10 produced complete remission is the clean
    demonstration. The practical consequence is that in a child with SRNS, resistance
    to immunosuppression should prompt a genetic and metabolic question rather than an
    escalation of immunosuppression - which is why the entry models the resistance as
    part of the causal chain instead of recording it as an adjective.

- discussion_id: coq6_timing_determines_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the variation in CoQ10 response is genotype and how much is timing?
  attaches_to:
  - treatments#Oral Coenzyme Q10 Replacement
  - pathophysiology#Focal Segmental Glomerulosclerosis
  rationale: >-
    Two explanations are offered for why some patients respond and others do not, and
    the available reports do not separate them. The audiological series attributes the
    42.9% response rate to genotype, noting the benefit appeared genotype-specific.
    Other reports attribute non-response to established damage, stating patients may not
    benefit once severe renal and neurological damage is present. These are not
    mutually exclusive and would be distinguished by treating patients of the same
    genotype at different stages, which no reported series does. The distinction
    matters because it determines whether genotype should modify the urgency of
    starting treatment or only the expectation of benefit.

notes: >-
  Relationship to existing entries. kb/disorders/Primary_Coenzyme_Q10_Deficiency.yaml
  curates the umbrella and already carries COQ6 in its has_subtypes list. A standalone
  entry alongside that umbrella follows the precedent already set by
  kb/disorders/COQ4-Related_Neonatal_Encephalomyopathy.yaml, which likewise exists both
  as its own entry and as a subtype there. This entry should be read as the detailed
  treatment of the COQ6 form, not as a competing definition.

  Naming. MONDO's label for this entity leads with the clinical description
  ("familial steroid-resistant nephrotic syndrome with sensorineural deafness"). The
  entry name leads with the gene, following the KB's prevailing convention for
  gene-defined entities and matching the COQ4 sibling. The MONDO label is preserved in
  disease_term.

  On the claim's expectation about hearing. The claim issue for this disease predicted
  that the deafness would generally not reverse. The Korean series reports a 42.9%
  audiological response rate, with stabilization or improvement, and describes the
  benefit as genotype-specific. The entry follows the source rather than the prior
  expectation, and grades the treatment link PARTIAL rather than asserting either
  outcome.

  Evidence splitting. PMID:26808124 is cited twice on the same node with different
  evidence_source values, because one quoted sentence reports a biochemical result
  (IN_VITRO) and the other reports molecular dynamics and docking (COMPUTATIONAL).
  These are separate items rather than one, per the rule that a paper mixing evidence
  types should have its evidence split.

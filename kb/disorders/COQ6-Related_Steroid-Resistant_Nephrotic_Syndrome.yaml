- name: Glomerular Filtration Barrier Injury
  biological_scale: TISSUE
  description: Podocyte foot-process effacement and glomerular injury accompany COQ6 nephropathy. Protein leakage may occur before extensive sclerosis and need not include all features of nephrotic syndrome.

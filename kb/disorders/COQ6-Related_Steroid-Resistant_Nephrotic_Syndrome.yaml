progression:
- phase: Variable Renal and Extrarenal Course
  notes: Kidney disease often starts in infancy or childhood, but progression is not inevitable in every observed patient. The international cohort included 27/48 patients with ESKD at last observation and one with isolated hearing loss without renal symptoms through age seventeen. Treatment and ascertainment influence these estimates. Hearing may precede or follow renal disease and may progress despite CoQ10; later optic or neurologic manifestations warrant follow-up. Among those who reached ESKD in the international cohort, median age at ESKD was 3.4 years (interquartile range 1.7–6.3).

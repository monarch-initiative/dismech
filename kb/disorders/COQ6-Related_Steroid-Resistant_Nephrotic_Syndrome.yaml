pathophysiology:
- name: Biallelic COQ6 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous COQ6 variants. Missense alleles impair the
    enzyme's substrate access channel; nonsense alleles truncate the protein and are
    associated with the lethal infantile end of the spectrum.
  evidence:
  - reference: PMID:21540551
    reference_title: "COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we have identified 6 different mutations in coenzyme Q10 biosynthesis
      monooxygenase 6 (COQ6) in 13 individuals from 7 families by homozygosity mapping.
    explanation: The original gene identification across seven families.
  downstream:
  - target: Deficient C5-Ring Hydroxylation in CoQ10 Biosynthesis
    causal_link_type: DIRECT
    description: The variants reduce activity of the monooxygenase.

- name: Deficient C5-Ring Hydroxylation in CoQ10 Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    COQ6 is a flavoprotein using FAD as cofactor that hydroxylates the benzene ring of
    the ubiquinone precursor at position C5. Structural work identifies a substrate
    access channel, and blocking it computationally predicted the loss of activity that
    was then confirmed in vivo.
  molecular_functions:
  - preferred_term: FAD-dependent monooxygenase activity
    modifier: DECREASED
    term:
      id: GO:0004497
      label: monooxygenase activity
  - preferred_term: FAD binding
    term:
      id: GO:0071949
      label: FAD binding
  biological_processes:
  - preferred_term: ubiquinone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
  evidence:
  - reference: PMID:26808124
    reference_title: "Coenzyme Q Biosynthesis: Evidence for a Substrate Access Channel in the FAD-Dependent Monooxygenase Coq6."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show here through biochemical studies that Coq6 is a flavoprotein using FAD as
      a cofactor.
    explanation: Establishes the cofactor and enzyme class biochemically.
  - reference: PMID:26808124
    reference_title: "Coenzyme Q Biosynthesis: Evidence for a Substrate Access Channel in the FAD-Dependent Monooxygenase Coq6."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We identify a putative access channel for Coq6 in a wild type model and propose
      in silico mutations positioned at its entrance capable of partially (G248R and
      L382E single mutations) or completely (a G248R-L382E double-mutation) blocking
      access to the channel for the substrate.
    explanation: >-
      The structural prediction, split from the biochemical item above because the two
      sentences report different kinds of evidence in the same paper.
  downstream:
  - target: Coenzyme Q10 Deficiency
    causal_link_type: DIRECT
    description: The biosynthetic pathway cannot complete.

- name: Coenzyme Q10 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced cellular coenzyme Q10, the polyisoprenylated benzoquinone lipid that
    carries electrons in the mitochondrial respiratory chain. This is the node the
    treatment acts on, by supplying the end product exogenously.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:26808124
    reference_title: "Coenzyme Q Biosynthesis: Evidence for a Substrate Access Channel in the FAD-Dependent Monooxygenase Coq6."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Coq6 is an enzyme involved in the biosynthesis of coenzyme Q, a polyisoprenylated
      benzoquinone lipid essential to the function of the mitochondrial respiratory
      chain.
    explanation: >-
      Background statement of the product's role; graded OTHER because it is a
      definitional sentence rather than a result of this study.
  downstream:
  - target: Podocyte Injury and Apoptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Podocytes are among the cells expressing COQ6 and are the first renal cell type to
      fail. The route is partly characterized: respiratory-chain compromise raises
      reactive oxygen species, the actin cytoskeleton is disrupted, and the cells
      undergo caspase-3-dependent apoptosis.
  - target: Stria Vascularis Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cochlear structure in which COQ6 is expressed, and the presumed site of the
      hearing lesion.
  - target: Optic Nerve Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A third arm, recognized later than the oto-renal core. Its response to a CoQ10
      analogue is what marks it as a distinct, and partially reversible, target.

- name: Podocyte Injury and Apoptosis
  biological_scale: CELLULAR
  description: >-
    Podocyte apoptosis is the demonstrated cellular consequence, and it is partially
    reversible by coenzyme Q10 in both podocyte cell lines and zebrafish - which is the
    experiment that links the deficiency causally to the cell death rather than merely
    correlating them. Knockdown work fills in part of the route: loss of COQ6 raises
    reactive oxygen species and disorganizes the F-actin cytoskeleton before apoptosis,
    which matters because podocyte function depends on maintaining that cytoskeletal
    architecture at the filtration slit.
  cell_types:
  - preferred_term: podocyte
    term:
      id: CL:0000653
      label: podocyte
  evidence:
  - reference: PMID:21540551
    reference_title: "COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused
      apoptosis that was partially reversed by coenzyme Q10 treatment
    explanation: >-
      Establishes both the cell-death phenotype and its rescue, which together make the
      causal claim.
  - reference: PMID:30425193
    reference_title: "New Mutation of Coenzyme Q(10) Monooxygenase 6 Causing Podocyte Injury in a Focal Segmental Glomerulosclerosis Patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Flow cytometry showed significantly increased in apoptotic podocytes, and Western
      blotting showed increases in active caspase-3 in si-COQ6 podocytes. Meanwhile,
      reactive oxygen species (ROS) levels were increased and F-actin immunofluorescence
      was irregularly distributed in the si-COQ6 group.
    explanation: >-
      Measures the intermediate steps rather than only the endpoint: raised ROS and a
      disorganized actin cytoskeleton alongside caspase-3 activation in COQ6-knockdown
      podocytes.
  downstream:
  - target: Focal Segmental Glomerulosclerosis
    causal_link_type: DIRECT
    description: Podocyte loss produces the characteristic glomerular lesion.

- name: Stria Vascularis Dysfunction
  biological_scale: TISSUE
  description: >-
    COQ6 is expressed in stria vascularis cells of the inner ear. The co-occurrence of
    renal and cochlear disease is not coincidental but follows the expression pattern of
    the enzyme.
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  evidence:
  - reference: PMID:21540551
    reference_title: "COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In rats, COQ6 was located within cell processes and the Golgi apparatus of renal
      glomerular podocytes and in stria vascularis cells of the inner ear, consistent
      with an oto-renal disease phenotype.
    explanation: >-
      The localization result that explains why these two organs and not others,
      obtained in rat tissue.
  downstream:
  - target: Progressive Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: Strial dysfunction produces the cochlear deficit.

- name: Optic Nerve Involvement
  biological_scale: TISSUE
  description: >-
    Optic atrophy with visual impairment, reported in a subset and added to the
    recognized phenotype after the oto-renal core. Unlike the hearing arm, it responded
    to a hydrophilic CoQ10 analogue.
  evidence:
  - reference: PMID:32685349
    reference_title: "COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study reports the case of two Turkish siblings with renal impairment,
      sensorineural deafness, and optic atrophy exhibiting COQ6 mutation.
    explanation: Establishes optic atrophy as part of the COQ6 phenotype.

- name: Focal Segmental Glomerulosclerosis
  biological_scale: TISSUE
  description: >-
    The histological lesion underlying the nephrotic syndrome, and the reason it
    progresses rather than remitting.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, SRNS presents principally as focal segmental glomerulosclerosis
      (FSGS) inevitably leading to chronic kidney disease (CKD)
    explanation: Names the lesion and its trajectory.
  downstream:
  - target: Steroid-Resistant Nephrotic Syndrome
    causal_link_type: DIRECT
    description: Glomerular scarring produces proteinuria unresponsive to immunosuppression.

- name: Steroid-Resistant Nephrotic Syndrome
  biological_scale: ORGANISM
  description: >-
    Proteinuria, hypoalbuminemia and oedema that do not respond to corticosteroids, and
    in a reported case did not respond to a calcineurin inhibitor either, before
    remitting completely on coenzyme Q10.
  evidence:
  - reference: PMID:30232548
    reference_title: "CoQ10-related sustained remission of proteinuria in a child with COQ6 glomerulopathy-a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease did not respond for second-line therapy with calcineurin inhibitor,
      but it remitted completely after oral treatment with 30 mg/kg/d of coenzyme Q10
      (CoQ10).
    explanation: >-
      The clearest single demonstration that the resistance is to immunosuppression
      specifically, not to treatment in general.

- name: Progressive Sensorineural Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Generally documented after the renal diagnosis, and progressive. Partially
    responsive to CoQ10 in a genotype-dependent way.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A diagnosis of SRNS generally precedes SNHL documentation. COQ10D6 is associated
      with progressive SNHL.
    explanation: Establishes the sequence and the progressive course.


- name: Genetic Counseling and Family Testing
  description: For parents carrying pathogenic COQ6 variants, each pregnancy has a 25% probability of an affected child, 50% of a carrier and 25% of a child inheriting neither familial variant. Testing at-risk siblings can identify disease before further organ injury. Once familial variants are known, carrier testing and prenatal or preimplantation testing can be discussed.

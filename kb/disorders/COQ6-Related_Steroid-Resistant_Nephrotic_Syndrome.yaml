    reference_title: COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Transmission electron microscopy for F1082 showed effacement of podocyte foot processes, resulting in a continuous electron-dense layer
    explanation: Human renal ultrastructure demonstrates foot-process effacement.
  downstream:

treatments:
- name: Oral Coenzyme Q10 Replacement
  description: >-
    Supplies the missing end product, bypassing the biosynthetic block rather than
    correcting it. Benefit is strongly dependent on how early it is started, because it
    cannot reverse established glomerular scarring or lost cochlear function.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Coenzyme Q10 Deficiency
    treatment_effect: BYPASSES
    description: >-
      Exogenous CoQ10 supplies the product the blocked pathway cannot make. This is the
      node the treatment acts on; every downstream benefit follows from it.
    evidence:
    - reference: PMID:21540551
      reference_title: "COQ6 mutations in human patients produce nephrotic syndrome with sensorineural deafness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused
        apoptosis that was partially reversed by coenzyme Q10 treatment
      explanation: >-
        Demonstrates rescue at the cellular level, which is the mechanistic basis for
        the clinical use.
  - target: Steroid-Resistant Nephrotic Syndrome
    treatment_effect: RESTORES
    description: >-
      Complete and sustained remission of proteinuria has been reported, including
      after failure of a calcineurin inhibitor.
    evidence:
    - reference: PMID:30232548
      reference_title: "CoQ10-related sustained remission of proteinuria in a child with COQ6 glomerulopathy-a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After 12 months of CoQ10 therapy, the child remains in full remission, her
        physical development accelerated, frequent respiratory airways diseases
        subsided.
      explanation: Documents durable remission on treatment.
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: MODULATES
    description: >-
      Partial and genotype-dependent: in a 12-patient series just under half showed no
      further loss or improvement.
    evidence:
    - reference: PMID:36124066
      reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The response rate (no further hearing loss or improvement) was 42.9%; CoQ10
        replacement therapy may thus limit and even improve hearing loss.
      explanation: >-
        Quantifies the audiological response. Graded PARTIAL because fewer than half
        responded and the endpoint combines stabilization with improvement.
  evidence:
  - reference: PMID:28125198
    reference_title: "Primary Coenzyme Q(10) Deficiency Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Review management of primary CoQ10 deficiency, including targeted pharmacologic
      treatment with high-dose oral CoQ10 supplementation and supportive treatment.
    explanation: >-
      The GeneReviews overview names high-dose oral CoQ10 as the targeted pharmacologic
      treatment for primary CoQ10 deficiency as a family. Graded OTHER, and cited at
      family level only: this is an overview article rather than a COQ6 chapter, and its
      cached record does not mention COQ6.
  - reference: PMID:35111204
    reference_title: "A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nevertheless, patients may not benefit from CoQ10 therapy when severe renal and
      neurological damage is established.
    explanation: >-
      States the limit on efficacy that makes timing the decisive variable; graded
      OTHER as a review statement in the paper's introduction rather than its own
      result.

- name: Cochlear Implantation
  description: >-
    For hearing not preserved by early CoQ10, with outcomes reported as generally
    favourable and sustained.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: DEVICE
  notes: >-
    Bound to the generic surgical-procedure term because NCIT:C157820 "Cochlear
    Implant" names the device rather than the clinical action, and so is not reachable
    from NCIT:C25218 (Clinical Intervention or Procedure) where TreatmentTerm is
    rooted. The specificity is carried by preferred_term, which is the documented
    pattern for exactly this case. NCIT:C15747 (Supportive Care) was the previous
    binding; implantation is a surgical procedure, and NCIT:C15329 is what the other
    twenty cochlear-implantation treatments across kb/disorders use.
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: MODULATES
    description: >-
      Bypasses the failed cochlear transduction rather than treating the metabolic
      lesion.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of cochlear implantation were generally favorable, and the effects
      were sustained over time.
    explanation: Reports the outcome of implantation in this patient group.

- name: Dialysis and Kidney Transplantation
  description: >-
    The endpoint the rest of the treatment plan exists to avoid. Because the renal arm
    progresses to kidney failure when CoQ10 is started late or not at all, renal
    replacement is where a substantial fraction of reported patients end up - one
    reported child went onto peritoneal dialysis at diagnosis and was transplanted at
    six. It is worth curating for a reason beyond completeness: post-transplant
    recurrence of nephrotic syndrome is low in monogenic SRNS, because the lesion is in
    the podocyte genome and the graft podocytes are someone else's. That is a
    mechanistic prediction the entry can make from its own pathophysiology, and it is
    what makes transplantation definitive here in a way it is not for immune-mediated
    nephrotic syndrome.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Steroid-Resistant Nephrotic Syndrome
    treatment_effect: BYPASSES
    description: >-
      Replaces the organ in which the podocyte lesion manifests. It does nothing for
      the biosynthetic defect, which is why the auditory and any neurological arms
      continue after a successful graft.
  evidence:
  - reference: PMID:32685349
    reference_title: "COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient started peritoneal dialysis immediately following diagnosis and
      underwent successful renal transplantation
    explanation: >-
      Documents both modalities in one reported patient, and the sequence in which they
      were used.

- name: Idebenone
  description: >-
    A hydrophilic short-chain coenzyme Q10 analogue. Its interest here is that it acts
    on the arm oral CoQ10 does not reach: optical symptoms improved on it, while hearing
    loss did not - a clean per-arm dissociation within a single drug in the same
    patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  target_mechanisms:
  - target: Optic Nerve Involvement
    treatment_effect: RESTORES
    description: >-
      Visual impairment improved on treatment in the reported sibling, started three
      months after symptom onset.
    evidence:
    - reference: PMID:32685349
      reference_title: "COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Idebenone treatment appeared to be effective in resolving optical impairment.
      explanation: Reports the ocular response in the treated patient.
  - target: Progressive Sensorineural Hearing Loss
    description: >-
      The arm idebenone did not reach, in the same patient and over the same treatment
      course as the ocular response above. This link deliberately carries no
      treatment_effect: every available value asserts that the drug acts on the node,
      and the finding is that it did not. Recording the arm as targeted-and-negative is
      more informative than omitting it, because the contrast with the optic response
      is the observation - a per-arm dissociation within one drug in one patient, which
      is what makes idebenone interesting here at all.
    evidence:
    - reference: PMID:32685349
      reference_title: "COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: Idebenone treatment did not, however, improve the hearing loss.
      explanation: >-
        Refutes an effect of idebenone on the auditory arm specifically. Held here
        rather than at treatment level, where the same sentence read as a refutation of
        idebenone as such - which the optic response in the line above contradicts.
  evidence:
  - reference: PMID:32685349
    reference_title: "COQ6 mutation in patients with nephrotic syndrome, sensorineural deafness, and optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supplement treatment with Idebenone (hydrophilic short‐chain coenzyme Q 10
      analogue) was started 3 months after the onset of optical symptoms.
    explanation: Identifies the agent's class and the timing of treatment.

diagnosis:
- name: Molecular genetic testing in steroid-resistant nephrotic syndrome
  description: >-
    The diagnosis is molecular. There is no biochemical screen that identifies COQ6
    specifically - plasma and urine findings are those of nephrotic syndrome from any
    cause - so the route in is sequencing, either whole-exome or an SRNS/FSGS gene
    panel. The clinical trigger that should prompt it is the combination the disease is
    named for: steroid resistance plus sensorineural deafness, in a child. Making the
    diagnosis is not academic here, because it changes management immediately -
    monogenic CoQ10 deficiency is one of the few forms of SRNS with a targeted therapy,
    and the therapy's benefit depends on how early it starts.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 12 underwent medical review, auditory phenotyping, and molecular genetic
      testing
    explanation: >-
      Establishes molecular testing as the diagnostic route applied uniformly across the
      reported cohort.
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the remaining three patients, targeted exome sequencing (TES) covering 57 genes
      known to be associated with SRNS or FSGS at that time was performed, because our
      strategy for mutational screening of patients with SRNS changed during the course
      of the study from Sanger sequencing to TES (as a first-tier test)
    explanation: >-
      Names the specific testing strategy and records that a targeted SRNS/FSGS panel
      became the first-tier test, which is the practical form of the recommendation.
  - reference: PMID:35111204
    reference_title: "A Family Segregating Lethal Primary Coenzyme Q10 Deficiency Due to Two Novel COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole-exome sequencing and Sanger sequencing, we identified two rare
      recessive nonsense mutations in the COQ6 gene segregating with disease in affected
      family members
    explanation: >-
      The other route, used where no panel fits the presentation - these siblings
      presented with metabolic acidosis rather than the classic oto-renal picture.

- name: Renal biopsy showing focal segmental glomerulosclerosis
  description: >-
    Biopsy does not make the diagnosis, and the entry should not imply that it does.
    FSGS is what COQ6 disease looks like histologically, but it is the common final
    appearance of podocyte injury from many causes, so it identifies the lesion and not
    its cause. Its diagnostic value is directional: an FSGS pattern in a steroid-
    resistant child is what should send the workup to sequencing.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, SRNS presents principally as focal segmental glomerulosclerosis
      (FSGS) inevitably leading to chronic kidney disease (CKD) that is the second-most
      common cause of kidney failure in the first two decades of life
    explanation: >-
      Gives the histological pattern and its renal trajectory in one sentence.

progression:
- phase: Steroid-resistant nephrotic syndrome to kidney failure
  notes: >-
    The renal arm is progressive and, untreated, terminal for the kidney: the source
    describes progression to kidney failure as inevitable. The word is the authors' and
    is worth preserving, because it is what makes the timing of CoQ10 the single
    decisive variable in this disease - the drug can prevent glomerular scarring and
    cannot reverse it. The two arms come apart here: renal function can be rescued to
    normal if treatment starts early enough, while hearing responds in fewer than half
    of patients and not at all once lost.
  evidence:
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cardinal phenotypes are steroid-resistant nephrotic syndrome (SRNS), which
      inevitably progresses to kidney failure, and sensorineural hearing loss (SNHL)
    explanation: >-
      States the renal trajectory in the authors' own terms, as a property of the
      disease rather than of a particular cohort.
  - reference: PMID:36124066
    reference_title: "Effects of CoQ10 Replacement Therapy on the Audiological Characteristics of Pediatric Patients with COQ6 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SRNS of patients with COQ10D6 may respond to CoQ10 replacement therapy that
      decreases proteinuria and restores normal renal function, particularly if
      treatment commences before the kidney pathological findings progress
    explanation: >-
      The modifier on that trajectory, and the reason this entry treats treatment timing
      rather than treatment choice as the decisive variable.

experimental_models:
- name: COQ6-knockdown podocyte cell line
  experimental_model_type: CELL_LINE
  description: >-
    The system in which podocyte apoptosis and its CoQ10 rescue were demonstrated, and
    in which the ROS and cytoskeletal intermediates were measured.
  publication: PMID:21540551
  modeled_mechanisms:
  - target: Podocyte Injury and Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cell-death phenotype and, critically, its partial reversal by
      coenzyme Q10 - which is the experiment the treatment's BYPASSES link rests on.
    limitations: >-
      A knockdown in cultured podocytes models neither the hypomorphic alleles patients
      carry nor the glomerular architecture in which the lesion produces proteinuria.
    evidence:
    - reference: PMID:21540551
      reference_title: >-
        COQ6 mutations in human patients produce nephrotic syndrome with sensorineural
        deafness.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused
        apoptosis that was partially reversed by coenzyme Q10 treatment
      explanation: >-
        The rescue result that makes this model informative for the treatment claim
        rather than only for the phenotype.

animal_models:
- name: coq6 morpholino zebrafish
  species: Zebrafish
  genotype: coq6 morpholino knockdown
  publication: PMID:21540551
  description: >-
    The whole-organism half of the same experiment. It shows apoptosis on coq6
    knockdown; it does not test CoQ10 rescue.
  modeled_mechanisms:
  - target: Podocyte Injury and Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces apoptosis on coq6 knockdown in a vertebrate, establishing that the
      cell-death phenotype is not an artefact of cultured cells.
    limitations: >-
      Morpholino knockdown is transient and not allele-specific. Critically, the
      zebrafish arm carries no coenzyme Q10 treatment condition - the rescue was
      demonstrated in cultured podocytes (Figure 5, A-C), while the zebrafish panels
      (D-F) test knockdown against mismatch and uninjected controls only. So this model
      supports the phenotype, not the treatment response. And no cochlear or
      optic-nerve model exists in any species, so the hearing and vision arms of this
      disease rest on mechanistic analogy rather than on a model.
    evidence:
    - reference: PMID:21540551
      reference_title: >-
        COQ6 mutations in human patients produce nephrotic syndrome with sensorineural
        deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        coq6 knockdown in zebrafish embryos 28 hours after fertilization increases
        apoptosis
      explanation: >-
        A zebrafish-only result, quoted rather than the abstract's combined
        cell-line-and-zebrafish sentence, so this item cites the finding it actually
        rests on and carries a single evidence type.

discussions:
- discussion_id: coq6_steroid_resistance_is_predicted
  kind: INTERPRETATION
  prompt: >-
    Is steroid resistance in this disease an empirical finding or a prediction of the
    mechanism?
  attaches_to:
  - pathophysiology#Steroid-Resistant Nephrotic Syndrome
  - treatments#Oral Coenzyme Q10 Replacement
  rationale: >-
    The phrase "steroid-resistant" entered this entity's name from nephrology, where it
    classifies nephrotic syndrome by observed response. But once the lesion is known to
    be a defect of coenzyme Q10 biosynthesis in podocytes, resistance to
    immunosuppression is what the mechanism predicts: there is no immune process for a
    steroid or a calcineurin inhibitor to suppress. The reported case in which
    calcineurin inhibition failed and CoQ10 produced complete remission is the clean
    demonstration. The practical consequence is that in a child with SRNS, resistance
    to immunosuppression should prompt a genetic and metabolic question rather than an
    escalation of immunosuppression - which is why the entry models the resistance as
    part of the causal chain instead of recording it as an adjective.

- discussion_id: coq6_no_model_for_the_sensory_arms
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The renal arm has models that reproduce it and respond to CoQ10. What supports the
    hearing and vision arms?
  attaches_to:
  - pathophysiology#Stria Vascularis Dysfunction
  - pathophysiology#Optic Nerve Involvement
  rationale: >-
    The podocyte and zebrafish models both reproduce the renal cell-death phenotype,
    and the podocyte model additionally shows its CoQ10 responsiveness, so the claim
    that supplying the missing metabolite rescues podocytes is directly supported at
    the cellular level. It is worth being precise that the rescue was not tested in the
    whole organism: the abstract summarizes both experiments in one sentence, but the
    zebrafish panels carry no CoQ10 condition. No cochlear or optic-nerve model of COQ6 deficiency is
    reported in the sources used here. Those two arms therefore rest on a localization
    result - COQ6 protein in stria vascularis cells - plus mechanistic analogy to the
    renal arm, and on the clinical observation that they respond differently to
    treatment: idebenone improved vision and did not improve hearing in the same
    patients. That dissociation is exactly what a model would be needed to explain, and
    there is none. Recorded as a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap
    because the issue is not that evidence is absent but that the evidence which exists
    covers one arm and is being extended to two others.

- discussion_id: coq6_timing_determines_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the variation in CoQ10 response is genotype and how much is timing?
  attaches_to:
  - treatments#Oral Coenzyme Q10 Replacement
  - pathophysiology#Focal Segmental Glomerulosclerosis
  rationale: >-
    Two explanations are offered for why some patients respond and others do not, and
    the available reports do not separate them. The audiological series attributes the
    42.9% response rate to genotype, noting the benefit appeared genotype-specific.
    Other reports attribute non-response to established damage, stating patients may not
    benefit once severe renal and neurological damage is present. These are not
    mutually exclusive and would be distinguished by treating patients of the same
    genotype at different stages, which no reported series does. The distinction
    matters because it determines whether genotype should modify the urgency of
    starting treatment or only the expectation of benefit.

notes: >-
  Identifiers. OMIM:614650; ORPHA:280406. Both are xrefs of the curated disease_term
  MONDO:0013836, alongside DOID:0070243, GARD:0017295, MEDGEN:766263 and
  UMLS:C3553349. They are recorded here rather than under mappings: because the
  mappings block has slots for ICD-10-CM, ICD-11, MONDO and NCIT only, and MONDO
  already carries these two - re-asserting an ontology's own xrefs is the thing the
  design register tells curators not to do. OMIM names the disease Coenzyme Q10
  deficiency, primary, 6 (COQ10D6), which is the label most of the primary literature
  cited here uses.

  GeneReviews. PMID:28125198 is the primary CoQ10 deficiency Overview, not a
  COQ6-specific chapter. Its cached record is the article's six-point purpose statement
  and does not mention COQ6 at all, so there are no Clinical Characteristics,
  Diagnosis/Testing, Management or Genetic Counseling sections to mine here. It is cited
  once for the family-level statement that high-dose oral CoQ10 is the targeted
  pharmacological treatment, and the evidence explanation says so. An earlier version of
  this entry declared and tagged it without citing it at all, which review caught on a
  sibling pull request.

  Relationship to existing entries. kb/disorders/Primary_Coenzyme_Q10_Deficiency.yaml
  curates the umbrella and already carries COQ6 in its has_subtypes list. A standalone
  entry alongside that umbrella follows the precedent already set by
  kb/disorders/COQ4-Related_Neonatal_Encephalomyopathy.yaml, which likewise exists both
  as its own entry and as a subtype there. This entry should be read as the detailed
  treatment of the COQ6 form, not as a competing definition.

  Naming. MONDO's label for this entity leads with the clinical description
  ("familial steroid-resistant nephrotic syndrome with sensorineural deafness"). The
  entry name leads with the gene, following the KB's prevailing convention for
  gene-defined entities and matching the COQ4 sibling. The MONDO label is preserved in
  disease_term.

  On the claim's expectation about hearing. The claim issue for this disease predicted
  that the deafness would generally not reverse. The Korean series reports a 42.9%
  audiological response rate, with stabilization or improvement, and describes the
  benefit as genotype-specific. The entry follows the source rather than the prior
  expectation, and grades the treatment link PARTIAL rather than asserting either
  outcome.

  Evidence splitting. PMID:26808124 is cited twice on the same node with different
  evidence_source values, because one quoted sentence reports a biochemical result
  (IN_VITRO) and the other reports molecular dynamics and docking (COMPUTATIONAL).
  These are separate items rather than one, per the rule that a paper mixing evidence
  types should have its evidence split.

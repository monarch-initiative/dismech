name: Reynolds Syndrome
creation_date: '2026-09-07T00:00:00Z'
category: Autoimmune
synonyms:
- PBC-SSc overlap syndrome
- SSc-PBC overlap syndrome
- primary biliary cirrhosis and systemic scleroderma
- primary biliary cholangitis with CREST syndrome
parents:
- Autoimmune Disease
- Connective Tissue Disease
- Liver Disease
disease_term:
  preferred_term: Reynolds syndrome
  term:
    id: MONDO:0013276
    label: Reynolds syndrome
description: >-
  Reynolds syndrome is the co-occurrence of primary biliary cholangitis (PBC)
  with limited cutaneous systemic sclerosis, described by Telfer Reynolds in
  1971. It is curated here as a disease entry rather than as an incidental
  comorbidity because the overlap is not simply two independent diagnoses in
  one patient: a 2026 systematic review of case-control studies concluded that
  it "represents a distinct clinical and immunological entity", with higher
  anticentromere and antimitochondrial antibody positivity than either isolated
  disease, a predominance of the limited cutaneous rather than diffuse
  cutaneous SSc subset, and more extrahepatic autoimmunity. The other half of
  that distinctness is clinical: visceral involvement is milder than in SSc
  alone -- less interstitial lung disease, reflux and musculoskeletal disease --
  without that amounting to a better prognosis, since SSc-related mortality and
  oesophageal varices run higher in some cohorts.

  The pathograph is deliberately modelled as two autoimmune arms sharing a
  common host predisposition rather than as one linear chain, because that is
  what the evidence supports. The hepatic arm runs from loss of tolerance to
  the pyruvate dehydrogenase complex E2 subunit through immune destruction of
  small intrahepatic bile ducts to cholestasis and biliary cirrhosis. The
  sclerodermatous arm runs from loss of tolerance to centromere protein B
  through microvascular endothelial injury and dermal fibroblast activation to
  the CREST features. What ties the arms together is serological rather than
  mechanistic: the two autoantibody systems co-occur far more often than chance
  would predict, and no shared downstream effector has been demonstrated. That
  gap is recorded as a knowledge gap rather than papered over with a
  speculative shared node.

  One point of caution about this entity's identity. MONDO gives Reynolds
  syndrome two parents -- "hereditary disease" and "autoimmune disease" -- and
  attributes a causal gene, LBR (hgnc:6518), while OMIM assigns it MIM#613471.
  This entry follows the autoimmune parent and not the hereditary one, because
  the genetic attribution rests on a single patient reported in 2010 with a
  single heterozygous LBR missense variant, whose own authors concluded only
  that "LBR mutations might thus be associated with Reynolds syndrome". A
  commentary published the same year asked directly whether the syndrome is a
  genetic laminopathy and answered that the case was not yet made, and no
  replication has been reported since. The clinical and serological literature
  treats the syndrome as autoimmune. So the LBR hypothesis is recorded as an
  open question in `discussions`, with the genetic association typed as a
  susceptibility hypothesis rather than as a causal mechanism.
mechanistic_hypotheses:
- hypothesis_group_id: autoimmune_overlap_model
  hypothesis_label: Shared autoimmune predisposition model
  status: CANONICAL
  description: >-
    Reynolds syndrome arises from a host predisposition to epithelial and
    endothelial autoimmunity that manifests concurrently in the biliary tree
    and in the skin microvasculature, evidenced by the co-occurrence of AMA and
    ACA and by the excess of other extrahepatic autoimmune disease in overlap
    patients.
- hypothesis_group_id: lbr_laminopathy_model
  hypothesis_label: LBR laminopathy model
  status: EMERGING
  description: >-
    An alternative reading in which Reynolds syndrome is a nuclear-envelope
    disorder caused by LBR variants acting in a tissue-specific dominant
    negative fashion. Supported by one patient to date; the confirmatory
    experiments proposed by contemporaneous commentary have not been reported.
pathophysiology:
- name: Loss of Immune Tolerance to Pyruvate Dehydrogenase Complex E2
  biological_scale: MOLECULAR
  description: >-
    Aberrant exposure of the mitochondrial autoantigen PDC-E2, released from
    apoptotic biliary epithelial cells, breaks tolerance and drives the
    antimitochondrial antibody response that defines the hepatic arm of this
    overlap.
  downstream:
  - target: Autoimmune Destruction of Small Intrahepatic Bile Ducts
    causal_link_type: DIRECT
    description: >-
      Broken tolerance to PDC-E2 licenses the innate and adaptive attack on
      the biliary epithelium.
    hypothesis_groups:
    - autoimmune_overlap_model
    evidence:
    - reference: PMID:41112296
      reference_title: "Innate immunity of bile and cholangiocytes in primary biliary cholangitis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "These DAMPs encompass autoantigens such as the mitochondrial Antigen Pyruvate Dehydrogenase Complex- E2 (PDC-E2), whose aberrant exposure disrupts normal immune tolerance"
      explanation: >-
        Identifies aberrant PDC-E2 exposure as the tolerance-breaking event
        upstream of the biliary attack.
  evidence:
  - reference: PMID:41112296
    reference_title: "Innate immunity of bile and cholangiocytes in primary biliary cholangitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "apoptosis of biliary epithelial cells releases antigens (e.g., PDC-E2), triggering aberrant innate and adaptive immune responses"
    explanation: >-
      Establishes the source of the PDC-E2 autoantigen and the immune response
      it provokes.
- name: Autoimmune Destruction of Small Intrahepatic Bile Ducts
  biological_scale: TISSUE
  description: >-
    Immune-mediated injury of cholangiocytes lining the small intrahepatic
    bile ducts, the lesion shared with isolated primary biliary cholangitis.
  cell_types:
  - preferred_term: cholangiocyte
    term:
      id: CL:1000488
      label: cholangiocyte
  downstream:
  - target: Intrahepatic Cholestasis
    causal_link_type: DIRECT
    description: >-
      Progressive loss of small bile ducts obstructs bile flow.
    hypothesis_groups:
    - autoimmune_overlap_model
    evidence:
    - reference: PMID:42499963
      reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Primary biliary cholangitis (PBC) is a chronic, progressive cholestatic liver disease marked by immune‐mediated destruction of intrahepatic bile ducts, eventually leading to fibrosis and cirrhosis"
      explanation: >-
        States the causal sequence from duct destruction through cholestasis to
        fibrosis and cirrhosis.
  evidence:
  - reference: PMID:41112296
    reference_title: "Innate immunity of bile and cholangiocytes in primary biliary cholangitis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "collectively initiating autoimmune targeting of biliary epithelial cells"
    explanation: >-
      Identifies the biliary epithelium as the target of the autoimmune attack.
- name: Intrahepatic Cholestasis
  biological_scale: ORGANISM
  description: >-
    Impaired bile flow following duct loss, detected biochemically as a
    cholestatic liver enzyme pattern and clinically as pruritus. Persistent
    cholestatic enzymes in a CREST patient are the trigger for considering
    this diagnosis.
  downstream:
  - target: Pruritus
    causal_link_type: DIRECT
    description: Retained biliary constituents drive cholestatic itch.
  - target: Elevated circulating alkaline phosphatase concentration
    causal_link_type: DIRECT
    description: The cholestatic enzyme pattern that flags the hepatic arm.
  - target: Biliary cirrhosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained cholestasis and periportal injury progress to biliary
      fibrosis and cirrhosis.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reynolds Syndrome should be suspected in CREST patients with persistent cholestatic liver enzymes, since delayed diagnosis allows portal hypertension and variceal bleeding to develop."
    explanation: >-
      Ties the cholestatic biochemical picture to this diagnosis and to the
      consequences of missing it.
- name: Loss of Immune Tolerance to Centromere Protein B
  biological_scale: MOLECULAR
  description: >-
    The anticentromere response that marks the limited cutaneous
    sclerodermatous arm. Strong anti-CENP-B reactivity is itself enriched for
    AMA-M2 positivity and for cirrhosis, which is the serological link between
    the two arms of this syndrome.
  downstream:
  - target: Microvascular Endothelial Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The ACA-defined limited cutaneous subset is the one in which obliterative
      microvasculopathy dominates.
    hypothesis_groups:
    - autoimmune_overlap_model
  - target: Dermal Fibroblast Activation and Skin Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Immune dysregulation in this subset drives the stromal programme
      responsible for skin thickening.
    hypothesis_groups:
    - autoimmune_overlap_model
  - target: Dysphagia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Oesophageal dysmotility belongs to the same limited cutaneous subset, but
      the intermediates between the autoantibody response and visceral smooth
      muscle involvement are not modelled here.
    hypothesis_groups:
    - autoimmune_overlap_model
  evidence:
  - reference: PMID:42618734
    reference_title: "Anti-centromere antibody positivity: a spectrum of clinical diagnoses and immunological patterns in a large patient cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "strong anti-CENP-B reactivity was associated with enrichment of centromere ANA patterns (64.05%), AMA-M2 positivity (31.44%), and liver cirrhosis (11.76%)"
    explanation: >-
      In a 1736-patient ACA-positive cohort, strong anti-CENP-B reactivity
      travels with AMA-M2 and with cirrhosis, which is the serological
      co-occurrence this syndrome is built on.
- name: Microvascular Endothelial Injury
  biological_scale: TISSUE
  description: >-
    Widespread injury of the cutaneous and digital microvasculature, producing
    cold-triggered vasospasm, visible telangiectasia, and in severe cases
    digital ischemia and tissue loss.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  downstream:
  - target: Raynaud phenomenon
    causal_link_type: DIRECT
    description: Vasospastic digital colour change on cold or stress exposure.
  - target: Telangiectasia
    causal_link_type: DIRECT
    description: Dilated superficial vessels on face and hands.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SSc is a connective tissue disorder with widespread microvascular injury, immune dysregulation, and excessive collagen deposition, affecting the skin and internal organs"
    explanation: >-
      Names microvascular injury as a core lesion of the sclerodermatous arm.
- name: Dermal Fibroblast Activation and Skin Fibrosis
  biological_scale: CELLULAR
  description: >-
    Activation of dermal fibroblasts with excess collagen deposition,
    producing the distal skin thickening and joint restriction of the limited
    cutaneous subset.
  cell_types:
  - preferred_term: fibroblast of dermis
    term:
      id: CL:0002551
      label: fibroblast of dermis
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  downstream:
  - target: Sclerodactyly
    causal_link_type: DIRECT
    description: Fibrotic thickening of the skin of the digits.
  - target: Calcinosis cutis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dystrophic calcification within chronically injured dermis.
  evidence:
  - reference: PMID:41974602
    reference_title: "Cellular and molecular mechanisms of systemic sclerosis: Translation to targeted therapies and clinical practice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We highlight emerging cellular- and molecular-level insights into vasculopathy, immune dysregulation, and fibroblast activation in SSc."
    explanation: >-
      Places fibroblast activation alongside vasculopathy and immune
      dysregulation as the core compartments of SSc pathogenesis.
discussions:
- discussion_id: lbr_causality_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - genetic#LBR
  - mechanistic_hypotheses#lbr_laminopathy_model
  prompt: >-
    Is Reynolds syndrome a genetic laminopathy caused by LBR variants, or an
    autoimmune overlap in which the reported LBR variant is incidental?
  rationale: >-
    MONDO classifies Reynolds syndrome as a hereditary disease and OMIM
    (MIM#613471) attributes it to LBR, but the entire genetic claim rests on
    one patient with one heterozygous missense variant. The functional work in
    that report was done on patient fibroblasts and lymphoblastoid lines, not
    on the affected liver, and contemporaneous commentary in the same year
    stated explicitly that the pathogenicity claim remained to be demonstrated
    and that larger PBC and SSc series were needed. No replication has been
    reported. This matters for curation because it decides whether the entry's
    root cause is a nuclear-envelope defect or a break in immune tolerance.
  evidence:
  - reference: PMID:20800400
    reference_title: "Is Reynolds syndrome a genetic laminopathy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It remains to be shown, however, that this is really the case by testing directly the liver and skin fibroblasts of the patient."
    explanation: >-
      Contemporaneous commentary stating that the pathogenicity of the LBR
      variant was not established by the original report.
- discussion_id: shared_upstream_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of Immune Tolerance to Pyruvate Dehydrogenase Complex E2
  - pathophysiology#Loss of Immune Tolerance to Centromere Protein B
  prompt: >-
    What shared upstream mechanism causes anti-PDC-E2 and anti-CENP-B
    autoimmunity to co-occur so much more often than chance?
  rationale: >-
    Candidate shared mechanisms exist and none is established as causal for
    the overlap. Shared HLA alleles (HLA-DQB1, HLA-DRB1, HLA-DQA1) and the
    non-HLA loci IRF5 and STAT4 are reported in both diseases, both are marked
    by elevated TGF-beta and IL-6, and antibodies in the overlap preferentially
    recognise CENP-C rather than CENP-B alone. But the HLA associations are
    explicitly not exclusive to either disease, and none of these has been
    shown to explain why the two diseases co-occur rather than simply being
    features each has separately. The pathograph therefore stops at two
    parallel arms rather than asserting a common upstream node. Establishing
    one is the main thing that would distinguish this entity from the
    coincidence of two common autoimmune diseases in a predisposed host.
  evidence:
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overlap group predominantly included patients with limited cutaneous SSc and had a higher prevalence of extrahepatic autoimmune diseases, particularly Sjögren's syndrome and Hashimoto's thyroiditis."
    explanation: >-
      Documents the broader autoimmune excess that a shared upstream mechanism
      would need to account for.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "non-HLA susceptibility genes IRF5 and STAT4 have been identified in both PBC and SSc"
    explanation: >-
      A named shared-susceptibility candidate. Cited as a candidate rather than
      as an explanation, since the same review notes these loci are not
      exclusive to either disease.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both diseases are marked by elevated TGF-β (transforming growth factor-beta) and IL-6 (Interleukin-6)"
    explanation: >-
      A shared profibrotic cytokine signature, the closest thing to a common
      effector, still not shown to drive the co-occurrence itself.

diagnosis:
- name: Antimitochondrial antibody screening in a CREST patient with cholestasis
  description: >-
    The practical diagnostic route to this entity. A patient already carrying a
    CREST or limited cutaneous SSc diagnosis who develops a cholestatic liver
    enzyme pattern should be tested for antimitochondrial antibodies rather
    than observed, because the delay is what allows portal hypertension and
    variceal bleeding to develop.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reynolds Syndrome should be suspected in CREST patients with persistent cholestatic liver enzymes, since delayed diagnosis allows portal hypertension and variceal bleeding to develop."
    explanation: >-
      States the trigger for suspecting the diagnosis and the cost of missing it.
histopathology:
- name: Compartment-specific fibrosis
  description: >-
    The two arms produce fibrosis in different compartments, which is what a
    biopsy distinguishes: periportal in the hepatic arm, perivascular or
    interstitial in the sclerodermatous arm.
  evidence:
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The shared immunological environment ultimately leads to characteristic fibrotic histology: predominantly around the periportal region in PBC and perivascular or interstitial region in SSc."
    explanation: >-
      Gives the compartment-level localisation that separates the two arms
      histologically despite their shared profibrotic drivers.

  rate_per_100000: 3000.0
  rate_low: 2000.0
  rate_high: 3000.0
  rate_denominator: POPULATION
  notes: >-
    Frequency of the overlap within an SSc population, not a general-population
    prevalence. Reported as 2-3% of SSc patients, and separately as a weighted
    prevalence of 3.0%.

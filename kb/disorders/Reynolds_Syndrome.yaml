    snippet: "prevalence studies have demonstrated that 2–3% of patients with SSc have overlapping PBC, whereas the prevalence of SSc in PBC has been estimated to be around 8%."
    explanation: >-
      Gives the frequency of the overlap in both directions.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT

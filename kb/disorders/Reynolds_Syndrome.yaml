        label: ursodeoxycholic acid
  target_mechanisms:
  - target: Intrahepatic Cholestasis
    description: Improves bile flow and the cholestatic biochemical profile.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early anti-mitochondrial antibody screening and prompt ursodeoxycholic acid therapy improve outcomes, and these patients need multidisciplinary follow-up for lung and thyroid disease."
    explanation: >-
      States the therapeutic strategy for the hepatic arm and the rationale for
      early serological screening.
- name: Cyclophosphamide
  description: >-
    Used for severe systemic sclerosis complications, notably interstitial
    lung disease, in the sclerodermatous arm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

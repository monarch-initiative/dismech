      term:
        id: CHEBI:4027
        label: cyclophosphamide
  target_mechanisms:
  - target: Interstitial lung disease
    description: >-
      Immunosuppression aimed at the interstitial lung disease of the
      sclerodermatous arm.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."

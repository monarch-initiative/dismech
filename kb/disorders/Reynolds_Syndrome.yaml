    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "she had a history of amputation of her right‐hand index finger due to severe digital ischemia and gangrene"
    explanation: >-
      Documents the severe ischemic end of the digital vascular phenotype in a
      patient with this syndrome.
- category: Cutaneous
  name: Telangiectasia
  description: Dilated superficial cutaneous vessels, typically on face and hands.
  phenotype_term:
    preferred_term: Telangiectasia
    term:
      id: HP:0001009
      label: Telangiectasia
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical examination revealed sclerodactyly with digital ulcers on her fingers, telangiectasias on her face and hands, and limited range of motion in her fingers and wrists."
    explanation: Records telangiectasia on examination in this syndrome.

biochemical:
- name: Antimitochondrial antibody
  notes: >-
    The serological hallmark of the hepatic arm. AMA are considerably more
    frequent in SSc than routine practice assumes, which is the basis for
    screening CREST patients rather than waiting for symptomatic liver disease.

    No biomarker_term is bound. NCIT and the biomarker enum caches were
    searched for an autoantibody-analyte term covering AMA/AMA-M2 and nothing
    matching the analyte was found; left unbound rather than bound to a
    broader immunology term that would not identify the analyte.
  evidence:
  - reference: PMID:41715235
    reference_title: "Prevalence and clinical relevance of systematically tested antimitochondrial antibodies in systemic sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 165 SSc patients (20% diffuse cutaneous disease, 33% interstitial lung disease, 7.3% pulmonary arterial hypertension; 51% positive for anticentromere antibodies, 29% anti-topoisomerase I, 12% anti-RNA polymerase III), 37 (22%) were AMA-positive."
    explanation: >-
      In a systematically screened SSc cohort, 22% were AMA-positive, which
      supports proactive screening for the hepatic arm.
- name: Anticentromere antibody
  notes: >-
    The serological marker of the limited cutaneous sclerodermatous arm,
    present with a centromere ANA pattern.

    No biomarker_term is bound, for the same reason recorded on the
    antimitochondrial antibody entry.
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests showed positive antinuclear antibodies (ANA) with a centromere pattern."
    explanation: Records the centromere ANA pattern in a patient with this syndrome.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sera from patients with PBC–SSc more frequently reacted with (CENP-C) compared with sera from patients with SSc alone"
    explanation: >-
      CENP-C reactivity is the most overlap-specific serological finding
      available: it separates the overlap from isolated SSc, rather than
      merely marking the limited cutaneous subset.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT4 has been associated with ACA positivity in PBC, an autoantibody already present in over 50% of patients with limited cutaneous SSc (lcSSc)."
    explanation: >-
      Links the anticentromere response to a shared non-HLA susceptibility
      locus reported in both diseases.
genetic:
- name: LBR
  notes: >-
    Reported in a single patient with Reynolds syndrome as a heterozygous
    missense variant with a proposed tissue-specific dominant negative effect.
    Recorded here as an unreplicated hypothesis, not as an established cause
    of this syndrome; see the LBR knowledge gap in `discussions`. LBR is
    otherwise the gene of Pelger-Huet anomaly and Greenberg dysplasia.
  gene_term:
    preferred_term: LBR
    term:
      id: hgnc:6518
      label: LBR
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:20522425
    reference_title: "LBR mutation and nuclear envelope defects in a patient affected with Reynolds syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "revealing a single heterozygous missense mutation in LBR exon 9 (c.1114C/T; p.R372C). This variant was absent in 400 control chromosomes."
    explanation: >-
      Reports the variant and its absence from 400 control chromosomes, the
      whole of the genetic evidence for this association.
  - reference: PMID:20522425
    reference_title: "LBR mutation and nuclear envelope defects in a patient affected with Reynolds syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The fibroblast specific abnormalities observed suggest that this particular LBR mutation might have dominant negative deleterious effects in a tissue specific fashion"
    explanation: >-
      The proposed mechanism, from patient-derived fibroblasts rather than
      affected liver tissue.
  - reference: PMID:20800400
    reference_title: "Is Reynolds syndrome a genetic laminopathy?"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "the new mutation has been found neither in a group of 27 other patients with SSc"
    explanation: >-
      Cited against a general causal role: the variant was not found in any
      other SSc patient tested, so it cannot account for the syndrome broadly.

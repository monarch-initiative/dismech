- category: Respiratory
  name: Interstitial lung disease
  description: >-
    Occurs in this syndrome and is the indication for immunosuppression when it
    does, but its frequency sits between the two isolated diseases rather than
    above them: lower than in SSc alone, higher than in PBC alone. That
    direction matters, because the overlap's milder visceral phenotype is half
    of what makes it a distinct entity.

    Do not read a whole-SSc ILD frequency as this syndrome's. The 33% figure in
    the AMA-screening cohort cited under the antimitochondrial antibody
    biomarker is that cohort's overall SSc rate, not an overlap-specific one.
  phenotype_term:
    preferred_term: Interstitial lung disease
    term:
      id: HP:0006530
      label: Abnormal pulmonary interstitial morphology
  evidence:
  - reference: PMID:42499963
    reference_title: "Overlap of Primary Biliary Cholangitis and Systemic Sclerosis: A Case of Reynolds Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "computed tomography (HRCT) chest was suggestive of interstitial lung disease (ILD)"
    explanation: >-
      HRCT-confirmed interstitial lung disease in a patient with this syndrome,
      establishing that it occurs.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, patients with overlap disease demonstrate milder systemic involvement than SSc-only patients, with lower occurrence of interstitial lung disease, gastro-oesophageal reflux and musculoskeletal involvement."
    explanation: >-
      The comparison against isolated SSc: ILD is less frequent in the overlap,
      part of a broader milder visceral profile.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with PBC-only, overlap patients have higher rates of renal complications, interstitial lung disease and extrahepatic autoimmune diseases such as SjS and Hashimoto’s thyroiditis."
    explanation: >-
      The comparison in the other direction: ILD is more frequent than in
      isolated PBC. Together with the item above this is why the frequency is
      stated as intermediate rather than high or low.
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overlap group also had fewer digital ulcers and a lower frequency of interstitial lung disease (ILD)."
    explanation: >-
      The Lepri multinational cohort, an independent cohort-level report of the
      same direction against isolated SSc.
- category: Constitutional
  name: Milder systemic involvement than isolated systemic sclerosis
  description: >-
    Taken as a profile rather than a single finding: interstitial lung disease,
    digital ulcers, gastro-oesophageal reflux and musculoskeletal involvement
    are all less frequent than in SSc alone. This is not the same as a better
    prognosis -- some cohorts report more SSc-related mortality and more
    oesophageal varices -- so it is curated as an organ-involvement profile,
    not as a severity or outcome claim.
  evidence:
  - reference: PMID:42256626
    reference_title: "Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control studies comparing isolated and overlapping disease phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations such as ILD, digital ulcers, GERD and musculoskeletal involvement were less common in overlap patients compared with patients with SSc, supporting the notion of a milder systemic phenotype."
    explanation: >-
      The review's cross-study synthesis of the milder systemic phenotype,
      naming the four manifestations it rests on.

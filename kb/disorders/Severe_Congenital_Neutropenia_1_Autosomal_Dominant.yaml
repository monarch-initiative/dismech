- name: Acquisition of Somatic CSF3R Mutations
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Somatic nonsense mutations in CSF3R truncate the cytoplasmic tail of the
    G-CSF receptor, removing one to all four tyrosine residues that carry its
    differentiation signal while leaving the proliferative signal intact. The
    resulting clone proliferates under G-CSF without maturing. This is recorded
    as provisional rather than established: the mutations are highly predictive
    of transformation and appear early, but they are explicitly not a necessary
    condition, and the authors who described them state that cooperating events
    remain to be defined.
  genes:
  - preferred_term: CSF3R
    term:
      id: hgnc:2439
      label: CSF3R
  biological_processes:
  - preferred_term: granulocyte colony-stimulating factor signaling pathway
    modifier: DYSREGULATED
    term:
      id: GO:0038158
      label: granulocyte colony-stimulating factor signaling pathway
  genetic_context:
    gene:
      preferred_term: CSF3R
      term:
        id: hgnc:2439
        label: CSF3R
    variant_origin: SOMATIC
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Truncating mutations remove the receptor's differentiation-signalling
      tyrosines while preserving proliferative signalling, so the functional
      consequence is partial and selective rather than a complete loss of
      receptor function.
  evidence:
  - reference: PMID:16985178
    reference_title: "Incidence of CSF3R mutations in severe congenital neutropenia and relevance for leukemogenesis: Results of a long-term survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected CSF3R nonsense mutations at 17 different nucleotide positions
      (thereof 10 new mutations) which lead to a loss of 1 to all 4 tyrosine
      residues in the intracellular domain of the receptor.
    explanation: >-
      Describes the molecular lesion annotated on this node: truncation of the
      receptor's intracellular signalling domain.
  - reference: PMID:16985178
    reference_title: "Incidence of CSF3R mutations in severe congenital neutropenia and relevance for leukemogenesis: Results of a long-term survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 23 patients with CN with signs of malignant transformation, 18 (78%)
      were shown to harbor a CSF3R mutation, indicating that these mutations,
      although not a necessary condition, are highly predictive for malignant
      transformation even if detected in a low percentage of transcripts.
    explanation: >-
      Gives both the strength of the association and the reason this node is
      marked provisional: the mutation is highly predictive but not necessary.
  - reference: PMID:16985178
    reference_title: "Incidence of CSF3R mutations in severe congenital neutropenia and relevance for leukemogenesis: Results of a long-term survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results strongly suggest that acquisition of a CSF3R mutation is an
      early event in leukemogenesis that has to be accompanied by cooperating
      molecular events, which remain to be defined.
    explanation: >-
      Places the event early in the sequence and states explicitly that it is
      insufficient alone, which is what the PROVISIONAL confidence records.
  downstream:
  - target: Clonal Evolution to Myelodysplasia and Acute Myeloid Leukaemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The CSF3R-mutant clone acquires further leukaemia-associated mutations,
      RUNX1 most often, and the combination confers G-CSF-driven proliferation
      with blocked myeloid differentiation. Single-cell work places the two
      mutations in the same clone, and sequential sampling places RUNX1 late.
    evidence:
    - reference: PMID:24523240
      reference_title: "Cooperativity of RUNX1 and CSF3R mutations in severe congenital neutropenia: a unique pathway in myeloid leukemogenesis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Functional studies demonstrated elevated granulocyte colony-stimulating
        factor (G-CSF)-induced proliferation with diminished myeloid
        differentiation of hematopoietic CD34(+) cells coexpressing mutated
        forms of RUNX1 and CSF3R.
      explanation: >-
        Demonstrates the functional consequence of the two-hit combination,
        which is the mechanism this edge asserts rather than a mere
        co-occurrence.
    - reference: PMID:22371884
      reference_title: Sequential gain of mutations in severe congenital neutropenia progressing to acute myeloid leukemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The sequential gain of 2 CSF3R mutations implicates abnormal G-CSF
        signaling as a driver of leukemic transformation in this case of SCN.
      explanation: >-
        Longitudinal single-patient sequencing implicating aberrant G-CSF
        receptor signalling as the driver of the transition. It is one case, so
        it supports the edge without establishing its generality.
- name: Clonal Evolution to Myelodysplasia and Acute Myeloid Leukaemia
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Severe congenital neutropenia is a preleukaemic bone marrow failure
    syndrome. A clone bearing a truncated G-CSF receptor expands, acquires
    RUNX1 mutations and other leukaemia-associated lesions including ASXL1 and
    chromatin remodellers, and the marrow progresses to myelodysplasia or acute
    myeloid leukaemia. RUNX1 mutation is far commoner here than in de novo
    paediatric AML, which is what marks this out as a distinct leukaemogenic
    route rather than ordinary AML arising in a neutropenic patient.

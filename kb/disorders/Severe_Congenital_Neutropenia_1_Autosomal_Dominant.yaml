discussions:
- discussion_id: scn1_csf3r_cooperating_events
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Acquisition of Somatic CSF3R Mutations
  prompt: >-
    What are the cooperating events that convert a CSF3R-mutant clone into
    myelodysplasia or acute myeloid leukaemia, and can they be detected early
    enough to guide transplantation?
  rationale: >-
    CSF3R mutation is highly predictive of transformation yet explicitly not
    necessary, is detectable years in advance, and highly clonal haematopoiesis
    does not always progress quickly. RUNX1 mutation is the commonest
    cooperating lesion but arrives late. The clinical question that follows is
    which surveillance finding should trigger transplantation, and that is not
    currently answerable: the same finding is compatible with rapid
    transformation and with years of stability.
notes: >-
  Scope and naming. Curated as the autosomal dominant ELANE form, matching
  MONDO:0042490 and OMIM 202700. The recessive HAX1 form (Kostmann disease,
  SCN3) and the other congenital neutropenias in IUIS Table 5 are separate
  diseases and are not covered here; G6PC3 deficiency (SCN4) is already curated
  separately. Note that "Kostmann syndrome" in the older literature refers to
  the Swedish recessive kindred, not to this entity, so the name is
  deliberately absent from the synonyms.

  The allelic boundary with cyclic neutropenia. ELANE causes both diseases and
  they overlap genetically: the mutation spectra differ in tendency, with
  cyclic alleles clustering near the active site, but severity distributions
  overlap and one S97L allele on a shared paternal haplotype has produced both
  phenotypes in a single kindred. IUIS merged cyclic neutropenia into the
  elastase-deficiency row in its 2022 update. dismech nevertheless keeps them
  as two entries, because the consequence that dominates management diverges
  completely: this disease is preleukaemic and cyclic neutropenia is not. The
  boundary is documented in the description, in the ELANE genetic notes, and in
  the IUIS classification note. Cyclic neutropenia is curated at
  Cyclic_Hematopoiesis (MONDO:0008090) and is not modelled here as a subtype.

  Mechanism confidence. The misfolding and unfolded protein response chain is
  well supported and, unusually for a mechanism of this kind, has been measured
  in primary granulocytic precursors from patients rather than only in
  expression systems, with the magnitude of activation tracking allele
  severity. It is not unchallenged; the Cyclic_Hematopoiesis entry records a
  study in which a severe congenital neutropenia allele impaired granulocytic
  differentiation without eliciting a detectable unfolded protein response, and
  a transgenic mouse carrying a human SCN allele that does not become
  neutropenic. Those results bear on this disease too and are the reason the
  chain here is stated as the prevailing model rather than as settled.

  The clonal-evolution arm is marked PROVISIONAL at the CSF3R node and
  ESTABLISHED at the transformation node, which is deliberate. That
  transformation happens, and that it involves CSF3R and RUNX1 mutations in a
  majority of patients, is not in doubt. What is provisional is the causal role
  of the CSF3R mutation itself: it is highly predictive but not necessary, and
  the group that characterised it says the cooperating events remain to be
  defined.

  Prevalence. Recorded from registry ascertainment for congenital neutropenia
  as a whole, because no cleanly quotable ELANE-specific rate was found in the
  cached sources. The commonly repeated figure of one in 200,000 to 250,000
  births is not recorded here: it did not appear in any cached reference in a
  form that could be quoted, and a curated number without a verifiable quote is
  worse than none. The two registry rows differ by nearly tenfold, which is
  ascertainment rather than biology, and both should be read as floors.

  Ontology notes. HPO distinguishes persistent from cyclic neutropenia
  (HP:0410252 versus HP:0040289), so the two allelic entries bind different
  defining phenotypes, and HP:0033607 gives the promyelocyte-stage marrow
  arrest exactly. Filgrastim has no CHEBI term, so the therapeutic agent binds
  to NCIT. Trimethoprim-sulfamethoxazole binds to the CHEBI combination term
  co-trimoxazole rather than to either component.

  A quoting note. Two snippets are drawn from the cached full text of
  PMID:20456363 and PMID:21595885 rather than from abstracts, and in both cases
  the quoted span stops short of a numeric unit that the cached rendering
  breaks across a line (an inline superscript in the first, a broken exponent
  in the second). The explanations say so rather than silently truncating.

  Known extension points: clinical_trials, for which no SCN1-specific
  registered trial was screened in this pass; computational_models, given the
  substantial mathematical modelling literature on granulopoiesis in this
  disease and its cyclic partner; animal_models, where the G193X Elane mouse is
  already recorded on the Cyclic_Hematopoiesis entry and would need
  SCN-specific framing rather than a copied link; and histopathology of the
  marrow beyond the maturation-arrest phenotype.

  Provenance. Curated directly from PubMed and the cached reference set rather
  than from a deep-research report. Every snippet was fetched with
  just fetch-reference and verified as an exact substring of the cached text.

      explanation: >-
        Directly tests the edge: expressing the mutant protein, and not the
        wild-type one, is what induces the stress response.
- name: Endoplasmic Reticulum Stress and Unfolded Protein Response
  biological_scale: CELLULAR
  description: >-
    Accumulated mutant elastase activates the unfolded protein response in
    granulocytic precursors, with induction of BiP/GRP78, XBP1 splicing and
    CHOP. The magnitude of activation tracks the clinical severity of the
    causal allele, which is the strongest argument that this branch is on the
    disease path rather than beside it. The response has also been measured in
    primary granulocytic precursors taken from patients, not only in expression
    systems.

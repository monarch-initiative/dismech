    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most strikingly, UPR activation and decreased NE protein expression were
      detected in primary granulocytic precursors from SCN patients.
    explanation: >-
      Measures the unfolded protein response in patient precursors, which is
      what grounds this node in human disease rather than in an expression
      system alone.
  - reference: PMID:17761833
    reference_title: Mutations of the ELA2 gene found in patients with severe congenital neutropenia induce the unfolded protein response and cellular apoptosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The magnitude of UPR activation by a specific ELA2 mutation correlated
      with its associated clinical phenotype.
    explanation: >-
      A genotype-to-mechanism dose relationship, which is the evidence that
      distinguishes a causal branch from an incidental stress response.
  - reference: PMID:16551967
    reference_title: Mutations in neutrophil elastase causing congenital neutropenia lead to cytoplasmic protein accumulation and induction of the unfolded protein response.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, cells expressing mutant HNE protein exhibited a significant

inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous ELANE variants, transmitted dominantly or arising de novo. One
    parent of a proband is usually affected, and each child of an affected
    individual has a 50% chance of inheriting the variant. Apparently sporadic
    families can recur through parental gonadal mosaicism, which is documented
    for ELANE in the kindred reported by Newburger and colleagues.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ELANE-related neutropenia is inherited in an autosomal dominant manner.
      One parent of a proband is usually affected. De novo pathogenic variants
      have been identified; their frequency is unknown.
    explanation: >-
      States the inheritance mode and records that de novo variants occur at an
      unknown rate, which is the counselling-relevant qualifier.
  - reference: PMID:28593997
    reference_title: Severe congenital neutropenias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent pathogenic defects are autosomal dominant mutations in
      ELANE, which encodes neutrophil elastase, and autosomal recessive
      mutations in HAX1, whose product contributes to the activation of the
      granulocyte colony-stimulating factor (G-CSF) signalling pathway.
    explanation: >-
      Independently confirms that the ELANE form of severe congenital
      neutropenia is the autosomal dominant one, and distinguishes it from the
      recessive HAX1 form that is not curated here.
pathophysiology:
- name: ELANE Mutation and Neutrophil Elastase Misfolding
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A heterozygous ELANE mutation yields a neutrophil
    elastase that fails to fold and traffic correctly. Instead of reaching
    azurophil granules the mutant protein accumulates in the cytoplasm as a
    nonfunctional species, and both the regulated and the constitutive
    secretory routes are impaired. The consequences fall on the granulocytic
    lineage because elastase is synthesised in neutrophil precursors during
    primary granule formation. Note that the consequence is not a simple loss
    of enzyme: cellular elastase activity is reduced in patient neutrophils
    irrespective of mutation status, while the mutant protein itself is
    pathogenic through its mislocalisation and the stress response it provokes.
  genes:
  - preferred_term: ELANE
    term:
      id: hgnc:3309
      label: ELANE
  molecular_functions:
  - preferred_term: neutrophil elastase activity
    modifier: DECREASED
    term:
      id: GO:0004252
      label: serine-type endopeptidase activity
  cell_types:
  - preferred_term: promyelocyte
    term:
      id: CL:0000836
      label: promyelocyte
  genetic_context:
    gene:
      preferred_term: ELANE
      term:
        id: hgnc:3309
        label: ELANE
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      Recorded as DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION because the
      phenotype does not follow from absent enzyme. The mutant allele acts
      through the misfolded protein it produces: a nonfunctional species
      accumulating in the cytoplasm that activates the unfolded protein
      response and kills the precursor, in a protease-independent fashion. A
      heterozygous null would not be expected to do this, and the mechanism is
      one of proteotoxicity rather than haploinsufficiency.
  evidence:
  - reference: PMID:11001877
    reference_title: Mutations in the gene encoding neutrophil elastase in congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-two of 25 patients with congenital neutropenia had 18 different
      heterozygous mutations.
    explanation: >-
      The original demonstration that heterozygous ELANE mutations underlie
      congenital neutropenia, with the mutational heterogeneity that
      characterises the gene.
  - reference: PMID:16551967
    reference_title: Mutations in neutrophil elastase causing congenital neutropenia lead to cytoplasmic protein accumulation and induction of the unfolded protein response.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This disruption resulted in cytoplasmic accumulation of a nonfunctional
      protein, thereby preventing its physiologic transport to azurophil
      granules.
    explanation: >-
      Establishes the mislocalisation that defines this node: the mutant
      protein neither folds nor reaches its granule destination.
  - reference: PMID:16551967
    reference_title: Mutations in neutrophil elastase causing congenital neutropenia lead to cytoplasmic protein accumulation and induction of the unfolded protein response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through analysis of primary granulocytes from SCN patients carrying ELA2
      mutations, we found an identical pattern of intracellular accumulation of
      mutant HNE protein in the cytoplasm.
    explanation: >-
      Confirms in patient cells the accumulation pattern first shown in the
      inducible expression system, so the node is not an artefact of
      overexpression.
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cellular elastase activity was reduced in neutrophils from CN/CyN
      patients, irrespective of the mutation status.
    explanation: >-
      Supports the reduced enzymatic activity annotated on this node, and is
      the observation that argues against reading the disease as a simple
      enzyme deficiency, since activity falls even without a detected ELANE
      mutation.
  downstream:
  - target: Endoplasmic Reticulum Stress and Unfolded Protein Response
    causal_link_type: DIRECT
    description: >-
      Misfolded elastase accumulating in the secretory pathway triggers the
      endoplasmic reticulum stress response in granulocytic precursors.
    evidence:
    - reference: PMID:17761833

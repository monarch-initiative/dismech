genetic:
- name: ELANE
  gene_term:
    preferred_term: ELANE
    term:
      id: hgnc:3309
      label: ELANE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: the most common cause of severe congenital neutropenia
  case_fractions:
  - population: Congenital neutropenia patients screened in the Hannover/SCNIR cohort
    case_fraction_percent: 41.0
    cohort_size: 395
    notes: >-
      Detection rate in a referred, screened cohort. The same screen found 55%
      in cyclic neutropenia, so the ELANE yield is lower in this disease than
      in its allelic partner.
    evidence:
    - reference: PMID:23463630
      reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found 116 different mutations in 162 (41%) CN patients and 26 in 51
        (55%) CyN patients, 69 of them were novel.
      explanation: >-
        Gives the congenital-neutropenia detection rate and its denominator,
        alongside the cyclic comparison.
    - reference: PMID:23463630
      reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We screened CN (n = 395) or CyN (n = 92) patients for ELANE mutations
        and investigated the impact of mutations on mRNA expression, protein
        expression, and activity.
      explanation: >-
        Establishes the cohort size recorded here.
  notes: >-
    Heterozygous ELANE variants, predominantly missense, are the commonest
    cause of severe congenital neutropenia. Detection rate depends on the
    cohort: a screen of 395 referred congenital neutropenia patients found
    mutations in 41%, and a French registry-based review puts ELANE behind
    about half of congenital neutropenias that have no extra-haematopoietic
    features and normal adaptive immunity.

    Genotype does not cleanly predict which ELANE phenotype appears. The
    congenital and cyclic mutation spectra differ in tendency, with cyclic
    mutations clustering near the active site and congenital ones on the
    opposite face, but the severity distributions overlap, and one S97L allele
    on a shared paternal haplotype has produced both phenotypes within a single
    kindred. Leukaemic risk correlates with disease severity rather than with
    the presence of an ELANE mutation as such, which is why no specific allele
    is treated here as a leukaemia predictor.
  evidence:
  - reference: PMID:11001877
    reference_title: Mutations in the gene encoding neutrophil elastase in congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study indicates that mutations of the gene encoding neutrophil
      elastase are probably the most common cause for severe congenital
      neutropenia as well as the cause for sporadic and autosomal dominant
      cyclic neutropenia.
    explanation: >-
      Establishes ELANE as the leading cause of severe congenital neutropenia,
      and in the same sentence states the allelic relationship with cyclic
      neutropenia.
  - reference: PMID:11001877
    reference_title: Mutations in the gene encoding neutrophil elastase in congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cyclic neutropenia, the mutations appeared to cluster near the active
      site of the molecule, whereas the opposite face was predominantly affected
      by the mutations found in congenital neutropenia.
    explanation: >-
      Documents the partial structural separation of the two mutation spectra,
      which is the strongest genotype-level statement the allelic boundary
      supports.
  - reference: PMID:10581030
    reference_title: "Mutations in ELA2, encoding neutrophil elastase, define a 21-day biological clock in cyclic haematopoiesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 7 different single-base substitutions in the gene (ELA2)
      encoding neutrophil elastase
    explanation: >-
      The original identification of the gene, made in cyclic haematopoiesis a
      year before the same gene was implicated in congenital neutropenia. Cited
      here because it is the origin of the allelic relationship this entry has
      to delimit.
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About half the forms of congenital neutropenia with no extra-hematopoietic
      manifestations and normal adaptive immunity are due to neutrophil elastase
      (ELANE) mutations.
    explanation: >-
      A registry-based estimate of the ELANE share among non-syndromic
      congenital neutropenias, which is the population this entry covers.
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specific ELANE mutations have limited predictive value for leukemogenesis;
      the risk for leukemia was correlated with disease severity rather than
      with occurrence of an ELANE mutation.
    explanation: >-
      Supports the note that no allele is treated as a leukaemia predictor, and
      locates the risk in disease severity instead.
  - reference: PMID:23463630
    reference_title: The spectrum of ELANE mutations and their implications in severe congenital and cyclic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of acquired CSF3R mutations, malignant transformation, and
      the need for hematopoietic stem cell transplantation was significantly
      higher in CN patients with ELANE mutation than in ELANE mutation negative
      patients.
    explanation: >-
      Records that within congenital neutropenia the ELANE-mutant group is the
      higher-risk one, which is relevant to how aggressively this entry's
      population is monitored.
- name: CSF3R
  gene_term:
    preferred_term: CSF3R
    term:
      id: hgnc:2439
      label: CSF3R
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Acquired nonsense mutations truncating the intracellular domain of the
    G-CSF receptor. They are not part of the germline disease; they arise in
    haematopoietic clones during its course and mark the beginning of leukaemic
    evolution. They are detectable in a minority of transcripts long before
    overt transformation, and highly clonal haematopoiesis does not inevitably
    progress quickly.
  evidence:
  - reference: PMID:16985178
    reference_title: "Incidence of CSF3R mutations in severe congenital neutropenia and relevance for leukemogenesis: Results of a long-term survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 23 patients with CN with signs of malignant transformation, 18 (78%)
      were shown to harbor a CSF3R mutation, indicating that these mutations,
      although not a necessary condition, are highly predictive for malignant
      transformation even if detected in a low percentage of transcripts.
    explanation: >-
      Gives both the frequency among transforming patients and the caveat that
      the mutation is predictive rather than necessary.
  - reference: PMID:16985178
    reference_title: "Incidence of CSF3R mutations in severe congenital neutropenia and relevance for leukemogenesis: Results of a long-term survey."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We could demonstrate that even a highly clonal hematopoiesis did not
      inevitably show a rapid progression to leukemia.
    explanation: >-
      The observation that keeps this from being read as a deterministic
      progression, and that matters clinically when a mutation is found on
      surveillance.
- name: RUNX1
  gene_term:
    preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    Acquired RUNX1 mutations are the commonest cooperating lesion, found in
    about two thirds of patients who transform, usually in the same clone as a
    CSF3R mutation and arriving late in the sequence.
  evidence:
  - reference: PMID:24523240
    reference_title: "Cooperativity of RUNX1 and CSF3R mutations in severe congenital neutropenia: a unique pathway in myeloid leukemogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sequential analysis at stages prior to overt leukemia revealed RUNX1
      mutations to be late events in leukemic transformation.
    explanation: >-
      Places RUNX1 late in the clonal sequence, which is what distinguishes it
      from the early CSF3R event.
  - reference: PMID:24523240
    reference_title: "Cooperativity of RUNX1 and CSF3R mutations in severe congenital neutropenia: a unique pathway in myeloid leukemogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Single-cell analyses in 2 patients showed that RUNX1 and CSF3R mutations
      were present in the same malignant clone.
    explanation: >-
      Establishes that the two lesions are in one clone rather than in parallel
      populations, which is what makes the cooperativity claim meaningful.
prevalence:
- population: Worldwide (International Neutropenia Registry catchment, approximately 700 million people)
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.07
  notes: >-
    Registry-ascertained prevalence of congenital neutropenia as a whole, not of
    the ELANE form alone; 0.7 per million rising to 1 per million when
    idiopathic neutropenia is counted. ELANE accounts for roughly half of
    non-syndromic congenital neutropenia, so the SCN1 figure is lower again.
    Registry ascertainment is incomplete, so treat this as a floor.
  evidence:
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence was 0.7 per million inhabitants or 1 per million inhabitants
      when idiopathic neutropenia was included.
    explanation: >-
      The registry-derived prevalence figure recorded here, with its
      idiopathic-inclusive variant.
- population: France (French Severe Chronic Neutropenia Registry)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.62
  notes: >-
    A dedicated national registry finds nearly ten times the prevalence of the
    Iranian survey of comparable population size, which the review reports as
    approximately 6.2 per million and takes as the best available floor for
    congenital neutropenia generally. The quoted span starts mid-sentence and
    stops before that number because the cached PDF extraction mangles the
    words "In the French" and renders the exponent broken. Of the French
    registry patients, 30% had ELANE-related neutropenia, split roughly 20%
    severe congenital and 10% cyclic.
  evidence:
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      registry-based study of a population of comparable size, 374 cases had been
      recorded in December 2006, giving a prevalence nearly 10 times higher
    explanation: >-
      Establishes that dedicated national ascertainment yields a much higher
      prevalence than general immunodeficiency surveys, which is why the
      registry figure is preferred as the floor.
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the French registry, 30% of patients had ELANE neutropenia
    explanation: >-
      Gives the ELANE share of a national congenital-neutropenia registry, which
      is what converts a congenital-neutropenia prevalence into an approximate
      figure for this entry.
progression:
- phase: Neonatal period and infancy
  notes: >-
    Presentation is early. Omphalitis in the days after birth may be the first
    sign, followed in untreated children by diarrhoea, pneumonia and deep
    abscesses during the first year. In the original Swedish description most
    affected infants died of bacterial infection before their first birthday.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In congenital neutropenia, omphalitis immediately after birth may be the
      first sign; in untreated children diarrhea, pneumonia, and deep abscesses
      in the liver, lungs, and subcutaneous tissues are common in the first year
      of life.
    explanation: >-
      Describes the sequence of events that characterises this phase.
- phase: Childhood and adult life on G-CSF
  notes: >-
    With daily subcutaneous G-CSF the neutrophil count rises, infections fall
    and quality of life improves substantially. Sepsis mortality does not reach
    zero: it runs at roughly 0.8 to 0.9% per year in the international registry
    cohort. Oral and periodontal disease continues to need attention.
  evidence:
  - reference: PMID:28593997
    reference_title: Severe congenital neutropenias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Daily subcutaneous G-CSF administration is the treatment of choice and
      leads to a substantial increase in blood neutrophil count, reduction of
      infections and drastic improvement of quality of life.
    explanation: >-
      States the change in trajectory that defines this phase.
  - reference: PMID:16497969
    reference_title: The incidence of leukemia and mortality from sepsis in patients with severe congenital neutropenia receiving long-term G-CSF therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In SCN, sepsis mortality was stable at 0.9% per year.
    explanation: >-
      Quantifies the residual mortality that persists through this phase despite
      treatment.
- phase: Long-term outcome and malignant transformation
  notes: >-
    The axis on which this disease diverges completely from its allelic
    partner. The hazard of myelodysplasia or acute myeloid leukaemia rises over
    the first decade on G-CSF and then plateaus at about 2.3% per year, giving a
    cumulative incidence of roughly 22% at fifteen years; GeneReviews puts the
    fifteen-year risk at 15 to 25%. Cyclic neutropenia carries no recognised
    risk at all. The earlier and much higher estimate of 8% per year after
    twelve years was a small-numbers artefact and was corrected by longer
    follow-up of the same cohort, which is worth stating because the older
    figure still circulates.
  evidence:
  - reference: PMID:20456363
    reference_title: Stable long-term risk of leukaemia in patients with severe congenital neutropenia maintained on G-CSF therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term, the annual risk of MDS/AML attained a plateau (2.3%/year after
      10 years).
    explanation: >-
      The corrected long-term hazard, from extended follow-up of the registry
      cohort.
  - reference: PMID:16497969
    reference_title: The incidence of leukemia and mortality from sepsis in patients with severe congenital neutropenia receiving long-term G-CSF therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hazard of MDS/AML increased significantly over time, from 2.9% per
      year after 6 years to 8.0% per year after 12 years on G-CSF.
    explanation: >-
      The earlier estimate that the 2010 update revised downwards. Recorded so
      the correction is visible rather than silently applied.
  - reference: PMID:15642668
    reference_title: "Analysis of risk factors for myelodysplasias, leukemias and death from infection among patients with congenital neutropenia. Experience of the French Severe Chronic Neutropenia Study Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative incidence of MDS/AL was 2.7% (SD 1.3%) at 10 years and 8.1%
      (SD 2.7%) at 20 years.
    explanation: >-
      An independent national registry's cumulative incidence, lower than the
      international registry's; the two cohorts differ in case mix, since the
      French figure covers all forms of severe chronic neutropenia.
diagnosis:
- name: Absolute neutrophil count
  presence: PRESENT
  description: >-
    A persistently low count below 0.5 x 10^9/L is the entry criterion.
    Repeated counts distinguish this disease from cyclic neutropenia, where the
    count oscillates; a single low count establishes neither.
  evidence:
  - reference: PMID:20456363
    reference_title: Stable long-term risk of leukaemia in patients with severe congenital neutropenia maintained on G-CSF therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is diagnosed clinically on the basis of absolute neutrophil counts (ANC)
      persistently below the threshold of 0.5
    explanation: >-
      States the clinical diagnostic basis and its threshold.
- name: Bone marrow examination
  presence: PRESENT
  description: >-
    Marrow aspirate shows arrest of granulocytic maturation at the promyelocyte
    stage, often with eosinophilia and monocytosis, establishing a production
    defect rather than peripheral destruction.
  evidence:
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bone marrow examination is often necessary to rule out malignant
      hemopathies, determine cellularity, assess myeloid maturation
    explanation: >-
      States the diagnostic purposes of marrow examination in congenital
      neutropenia.
- name: ELANE molecular genetic testing
  presence: PRESENT
  description: >-
    A heterozygous pathogenic ELANE variant confirms the diagnosis. A negative
    result does not exclude severe congenital neutropenia, since ELANE
    mutations are found in roughly 40 to 50% of cases and several other genes
    produce the same phenotype.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ELANE-related neutropenia is established in a proband
      with suggestive clinical findings and the identification of a heterozygous
      pathogenic variant in ELANE through molecular genetic testing.
    explanation: >-
      States the molecular diagnostic criterion.
- name: Annual bone marrow surveillance with cytogenetics
  presence: PRESENT
  description: >-
    Yearly marrow examination with cytogenetics, looking for monosomy 7 and
    trisomy 21 and for somatic CSF3R and RUNX1 mutations. Listed under
    diagnosis because it is a monitoring investigation rather than a therapy,
    and it is required for every patient not transplanted.
  evidence:
  - reference: PMID:28593997
    reference_title: Severe congenital neutropenias.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Regular clinical assessments (including yearly bone marrow examinations) to
      monitor treatment course and detect chromosomal abnormalities (for example,
      monosomy 7 and trisomy 21) as well as somatic pre-leukaemic mutations are
      recommended.
    explanation: >-
      States the surveillance schedule and exactly what it is looking for.
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those with congenital neutropenia not undergoing HSCT require surveillance
      for malignant transformation to MDS/AML.
    explanation: >-
      Establishes who needs surveillance and why, and by implication that
      transplanted patients leave this pathway.
treatments:
- name: Granulocyte Colony-Stimulating Factor
  description: >-
    The treatment of choice and the intervention that changed the natural
    history of this disease. Daily subcutaneous filgrastim raises the neutrophil
    count, roughly halves infection-related events and shortens antibiotic use.
    It drives residual granulopoiesis harder rather than correcting the
    misfolding lesion, so patients remain on it indefinitely, and severe
    patients need large doses. Common adverse effects are bone pain, headache,
    rash and asymptomatic splenomegaly; long-term treatment at high dose is
    associated with the leukaemic risk recorded under progression.
  treatment_term:
    preferred_term: colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy
    therapeutic_agent:
    - preferred_term: filgrastim
      term:
        id: NCIT:C1474
        label: Filgrastim
  target_phenotypes:
  - preferred_term: Persistently decreased total neutrophil count
    term:
      id: HP:0410252
      label: Persistently decreased total neutrophil count
  - preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  target_mechanisms:
  - target: Profound Persistent Neutropenia
    treatment_effect: RESTORES
    description: >-
      Pharmacological G-CSF drives the surviving granulocytic compartment to
      proliferate and mature, raising the circulating count into a protective
      range in most patients and increasing the proportion of maturing
      neutrophils in the marrow.
    evidence:
    - reference: PMID:8490166
      reference_title: A randomized controlled phase III trial of recombinant human granulocyte colony-stimulating factor (filgrastim) for treatment of severe chronic neutropenia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Examination of BM aspirates showed increased proportions of maturing
        neutrophils.
      explanation: >-
        Shows the drug acting on the marrow compartment that this node
        describes, not merely on the peripheral count.
  evidence:
  - reference: PMID:8490166
    reference_title: A randomized controlled phase III trial of recombinant human granulocyte colony-stimulating factor (filgrastim) for treatment of severe chronic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 123 patients enrolled, 120 received filgrastim. On therapy, 108
      patients had a median absolute neutrophil count of > or = 1.5 x 10(9)/L.
    explanation: >-
      The randomised trial response rate: 108 of 120 treated patients reached a
      protective median count.
  - reference: PMID:8490166
    reference_title: A randomized controlled phase III trial of recombinant human granulocyte colony-stimulating factor (filgrastim) for treatment of severe chronic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infection-related events were significantly decreased (P < .05) with
      approximately 50% reduction in the incidence and duration of
      infection-related events and almost 70% reduction in duration of
      antibiotic use.
    explanation: >-
      Quantifies the clinical benefit, which is the outcome that matters rather
      than the count itself.
  - reference: PMID:8490166
    reference_title: A randomized controlled phase III trial of recombinant human granulocyte colony-stimulating factor (filgrastim) for treatment of severe chronic neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Asymptomatic splenic enlargement occurred frequently; adverse events
      frequently reported were bone pain, headache, and rash, which were
      generally mild and easily manageable.
    explanation: >-
      The adverse-effect profile from the pivotal trial.
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is usually well tolerated, but potential adverse effects include
      thrombocytopenia, glomerulonephritis, vasculitis and osteoporosis.
    explanation: >-
      Records the less common long-term toxicities that the short trial did not
      capture.
  notes: >-
    The leukaemia association is real but should not be read as simple
    causation. Risk tracks the dose required and the response achieved, so the
    patients at highest risk are those whose disease is most severe, and
    severity is itself a risk factor for transformation independently of
    treatment. The 2010 registry update revised the long-term hazard sharply
    downwards and found it comparable with Fanconi anaemia and dyskeratosis
    congenita rather than higher. What follows clinically is surveillance and
    consideration of early transplantation in poor responders, not withholding
    G-CSF.
- name: Allogeneic Haematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The only curative option, and the standard route for patients refractory to
    high-dose G-CSF or who have transformed. Donor haematopoiesis replaces the
    ELANE-mutant clone outright. Outcomes are acceptable but not benign:
    three-year overall survival of 82% with 17% transplant-related mortality in
    the European series, better in children under ten and with matched donors.
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: ELANE Mutation and Neutrophil Elastase Misfolding
    treatment_effect: BYPASSES
    description: >-
      Transplantation does not correct the mutant allele; it replaces the
      haematopoietic compartment that expresses it with donor cells, so the
      whole downstream chain is bypassed rather than interrupted at any one
      step.
    evidence:
    - reference: PMID:26185129
      reference_title: "Stem cell transplantation in severe congenital neutropenia: an analysis from the European Society for Blood and Marrow Transplantation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Allogeneic hematopoietic stem cell transplantation (HSCT) is the only
        curative treatment of severe congenital neutropenia (SCN), but data on
        outcome are scarce.
      explanation: >-
        States that transplantation is curative, which is the claim that
        distinguishes bypassing the lesion from treating its output.
  evidence:
  - reference: PMID:26185129
    reference_title: "Stem cell transplantation in severe congenital neutropenia: an analysis from the European Society for Blood and Marrow Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 3-year overall survival (OS) was 82%, and transplant-related mortality
      (TRM) was 17%.
    explanation: >-
      The outcome figures that set the risk-benefit balance against continued
      G-CSF.
  - reference: PMID:26185129
    reference_title: "Stem cell transplantation in severe congenital neutropenia: an analysis from the European Society for Blood and Marrow Transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariate analysis, transplants performed under the age of 10 years,
      in recent years, and from HLA-matched related or unrelated donors were
      associated with a significantly better OS.
    explanation: >-
      Identifies the factors that determine outcome, which is what makes early
      referral of poor responders a live question.
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSCT is the only alternative therapy for individuals with congenital
      neutropenia who are refractory to high-dose G-CSF or who undergo malignant
      transformation.
    explanation: >-
      States the two indications curated here.
  - reference: PMID:16497969
    reference_title: The incidence of leukemia and mortality from sepsis in patients with severe congenital neutropenia receiving long-term G-CSF therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In less-responsive SCN patients, early hematopoietic stem cell
      transplantation may be a rational option.
    explanation: >-
      The registry authors' own conclusion about which patients should be
      considered for transplantation, based on the risk gradient they measured.
- name: Antimicrobial Prophylaxis and Prompt Treatment of Infection
  description: >-
    Prophylaxis, usually with trimethoprim-sulfamethoxazole, plus immediate
    broad-spectrum treatment of any febrile episode. Symptomatic rather than
    disease-modifying: it addresses the infectious consequences of the
    neutropenia without touching the granulopoietic defect. Abdominal pain in a
    neutropenic patient needs assessment for peritonitis and bacteraemia.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: CHEBI:3770
        label: co-trimoxazole
  target_mechanisms:
  - target: Impaired Innate Defence and Recurrent Bacterial Infection
    treatment_effect: INHIBITS
    description: >-
      Reduces the bacterial burden the absent neutrophils would otherwise fail
      to control, and treats established infection before it becomes
      life-threatening.
    evidence:
    - reference: PMID:21595885
      reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment of severe chronic neutropenia should focus on prevention of
        infections. It includes antimicrobial prophylaxis, generally with
        trimethoprim-sulfamethoxazole, and also
        granulocyte-colony-stimulating factor (G-CSF).
      explanation: >-
        States that prophylaxis targets the infectious consequence of the
        neutropenia, and names the agent used.
  evidence:
  - reference: PMID:20301705
    reference_title: ELANE-Related Neutropenia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immediate treatment with granulocyte colony-stimulating factor (G-CSF) and
      broad-spectrum antibiotics is important, even lifesaving, when an affected
      individual has signs of serious infection, which may be caused by both
      aerobic and anaerobic pathogens.
    explanation: >-
      States the urgency and the spectrum required when infection is suspected.
  - reference: PMID:21595885
    reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of severe chronic neutropenia should focus on prevention of
      infections. It includes antimicrobial prophylaxis, generally with
      trimethoprim-sulfamethoxazole, and also granulocyte-colony-stimulating
      factor (G-CSF).
    explanation: >-
      Places antimicrobial prophylaxis alongside G-CSF as standard management.
- name: Dental Hygiene and Periodontal Care
  therapeutic_modality: BEHAVIORAL
  description: >-
    Good dental hygiene with routine immunisations. Curated separately rather
    than folded into supportive care because gingivitis and periodontitis are
    modelled here as phenotypes, and this is the intervention that addresses
    them.
  target_mechanisms:
  - target: Impaired Innate Defence and Recurrent Bacterial Infection
    treatment_effect: INHIBITS
    description: >-
      Lowers the oral bacterial burden that the neutropenia would otherwise
      allow to produce gingival and periodontal destruction.
    evidence:
    - reference: PMID:21595885
      reference_title: "Congenital neutropenia: diagnosis, molecular bases and patient management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neutropenia can lead to life-threatening pyogenic infections, acute
        gingivostomatitis and chronic parodontal disease, and each successive
        infection may leave permanent sequelae.
      explanation: >-

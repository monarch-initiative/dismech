      Disorders of granulocytes: a congenital bone marrow failure syndrome with
      granulopoietic maturation arrest, and a recognised preleukaemic state
      evolving to myelodysplasia or acute myeloid leukaemia.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

name: Severe Congenital Neutropenia 1, Autosomal Dominant
category: Mendelian
creation_date: '2026-09-14T03:20:43Z'
synonyms:
- SCN1
- ELANE-related severe congenital neutropenia
- Elastase deficiency
- Autosomal dominant severe congenital neutropenia
- Congenital neutropenia due to ELANE mutation
description: >-
  An autosomal dominant disorder of granulopoiesis caused by heterozygous ELANE
  mutations, most of them missense. The mutant neutrophil elastase misfolds,
  accumulates in the cytoplasm instead of reaching azurophil granules, and
  provokes endoplasmic reticulum stress with an unfolded protein response in
  granulocytic precursors. Those precursors die, granulopoiesis arrests at the
  promyelocyte stage, and the absolute neutrophil count sits below 0.5 x 10^9/L
  from the first weeks of life. Untreated children present with omphalitis in
  the newborn period and then with pneumonia, deep abscesses and oral
  ulceration; before granulocyte colony-stimulating factor most died of
  bacterial infection in infancy. G-CSF transformed that prognosis and is the
  treatment of choice, but it did not remove the disease's second axis: severe
  congenital neutropenia is a preleukaemic bone marrow failure syndrome, and a
  substantial minority of patients evolve to myelodysplasia or acute myeloid
  leukaemia. The molecular route is somatic acquisition of truncating CSF3R
  mutations in the G-CSF receptor, usually followed by RUNX1 mutations, so
  annual marrow surveillance with cytogenetics is part of care and allogeneic
  transplantation is the option for G-CSF-refractory or transformed disease.

  The same gene causes cyclic neutropenia, curated separately as Cyclic
  Hematopoiesis. That boundary is allelic and imperfect: the two mutation
  spectra differ in tendency but overlap, one S97L allele on a shared paternal
  haplotype has produced both phenotypes in one kindred, and the clinical
  divergence that matters most is not genetic at all. Cyclic neutropenia
  carries no recognised leukaemic risk; this disease does.

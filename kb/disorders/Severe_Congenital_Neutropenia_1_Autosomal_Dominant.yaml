        apoptosis in a protease-independent fashion.
      explanation: >-
        States the edge and, in the protease-independent qualifier, rules out
        the competing account in which mutant enzyme activity kills the cell.
- name: Apoptosis of Granulocytic Precursors
  biological_scale: CELLULAR
  description: >-
    Accelerated death of promyelocytes and their descendants. This is the step
    that converts a protein-folding defect into a blood count: granulopoiesis
    becomes ineffective, precursors are consumed rather than matured, and the
    marrow shows the arrest that follows.

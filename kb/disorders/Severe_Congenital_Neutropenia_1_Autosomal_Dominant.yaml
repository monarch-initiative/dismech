  evidence:
  - reference: PMID:24523240
    reference_title: "Cooperativity of RUNX1 and CSF3R mutations in severe congenital neutropenia: a unique pathway in myeloid leukemogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty (64.5%) of the 31 patients had mutations in RUNX1. A majority of
      patients with RUNX1 mutations (80.5%) also had acquired CSF3R mutations.
    explanation: >-
      Quantifies the two mutations and their co-occurrence in patients who
      actually transformed, which is the genetic content of this node.
  - reference: PMID:24523240
    reference_title: "Cooperativity of RUNX1 and CSF3R mutations in severe congenital neutropenia: a unique pathway in myeloid leukemogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to their high frequency in CN patients who developed leukemia
      or MDS, RUNX1 mutations were found in only 9 of 307 (2.9%) patients with
      de novo pediatric acute myeloid leukemia.
    explanation: >-
      The contrast with de novo paediatric AML is what supports treating this as
      a disease-specific route rather than coincidental leukaemia.
  - reference: PMID:22371884
    reference_title: Sequential gain of mutations in severe congenital neutropenia progressing to acute myeloid leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that progression from SCN to AML is a multistep process, with

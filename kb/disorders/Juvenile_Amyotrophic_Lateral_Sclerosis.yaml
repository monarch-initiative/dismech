name: Juvenile Amyotrophic Lateral Sclerosis
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >
  Juvenile amyotrophic lateral sclerosis (JALS) is a rare, genetically
  heterogeneous motor neuron disease defined by onset of combined upper and
  lower motor neuron degeneration before age 25, presenting with facial
  spasticity, dysarthria, pyramidal signs and gait disorder. It is not simply
  an early-onset presentation of adult ALS: roughly 40% of cases have an
  identifiable monogenic basis distributed across more than 20 loci, and the
  recurrent genes (ALS2/alsin, SETX, SPG11/spatacsin, SIGMAR1, SPTLC1, and
  FUS) are largely disjoint from the C9orf72/SOD1/TARDBP spectrum that
  dominates adult ALS. Autosomal recessive inheritance predominates for ALS2,
  SPG11 and SIGMAR1; SETX, FUS and SPTLC1 act dominantly, the latter two
  usually as de novo variants. Prognosis is subtype-determined rather than
  uniform — upper motor neuron-dominant forms follow an indolent course with
  survival into adulthood, whereas lower motor neuron-dominant forms with
  early bulbar involvement (paradigmatically FUS p.P525L) are rapidly fatal.
  This entry is deliberately a thin root: it records what is shared across
  JALS and what distinguishes it from adult ALS, and defers subtype-specific
  mechanism to the per-subtype entries.
disease_term:
  preferred_term: juvenile amyotrophic lateral sclerosis
  term:
    id: MONDO:0017593
    label: juvenile amyotrophic lateral sclerosis
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
parents:
- Amyotrophic Lateral Sclerosis
- Motor Neuron Disease
- Neurodegenerative Disease
notes: >
  Scope and provenance. Curated from primary literature only; no deep-research
  provider pass was run for this entry (issue #8891). Orphanet ORPHA:300605 is
  the source of the MONDO:0017593 definition but could not be cited as
  structured evidence here: the Orphadata bulk XML that
  `just structured-rebuild-orphanet` reads is gitignored and
  `just refresh-orphadata` currently fails a pinned sha256 check against
  data/orphadata/MANIFEST.yaml, so no references_cache/ORPHA_300605.md exists.

  Cross-references rather than duplication. Adult-onset mechanism is curated in
  Amyotrophic_Lateral_Sclerosis.yaml and is deliberately not re-derived here.
  SPTLC1-related JALS (ALS27) is being curated as its own entry
  (Amyotrophic_Lateral_Sclerosis_27_Juvenile.yaml, PR #9067); the ALS27 subtype
  and genetic records below are intentionally summary-level and point at it.
  SIGMAR1 is also curated in
  Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive.yaml as HMNR2/dSMA2,
  the allelic lower-motor-neuron-only phenotype; ALS16 is retained here as a
  JALS subtype because MONDO parents MONDO:0013715 directly under
  MONDO:0017593.

  Named Entity Confusion guard. JALS sits in a numbered series (ALS1-ALS27+)
  and shares eponyms (Charcot, Lou Gehrig) with adult ALS, so every cited
  abstract was read to confirm it concerns juvenile-onset disease and the
  specific locus claimed. `just preflight-dr` was not applicable — no DR report
  was used, and MONDO:0017593 records no single causal gene, so the automated
  gene-frequency check would return SKIP; the manual gene/OMIM/synonym checks
  were done against `runoak -i sqlite:obo:mondo info` output instead.

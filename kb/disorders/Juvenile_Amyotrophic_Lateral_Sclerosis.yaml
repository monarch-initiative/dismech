      notes: >-
        Onset before age 25 years is the criterion separating JALS from adult
        ALS. HP:0003621 (Juvenile onset) is a clinical-modifier term outside
        the PhenotypeTerm dynamic enum, so the criterion is recorded here as a
        structured onset qualifier rather than as a phenotype of its own.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER

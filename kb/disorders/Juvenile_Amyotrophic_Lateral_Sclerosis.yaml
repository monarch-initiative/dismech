- name: FUS Cytoplasmic Mislocalization and Basophilic Inclusion Formation
  biological_scale: CELLULAR
  role: Trigger
  description: >
    C-terminal nuclear-localisation-signal variants in FUS, paradigmatically
    p.P525L, drive the FUS protein out of the nucleus into the cytoplasm of
    motor neurons, where it forms basophilic inclusions containing abnormal FUS
    aggregates and disorganised organelles. These inclusions are strongly
    FUS-immunoreactive and negative for TDP-43, and are found in spinal motor
    neurons, in layers IV-V of cerebral cortex and in brainstem nuclei — a
    distribution matching the combined upper and lower motor neuron lesion.
  genes:
  - preferred_term: FUS
    term:
      id: hgnc:4010

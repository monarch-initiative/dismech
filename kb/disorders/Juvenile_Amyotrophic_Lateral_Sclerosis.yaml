    snippet: "JALS is inherited in an autosomal-recessive pattern involving ALS2, SPG11, and SIGMAR1, while the SETX, UBQLN2, and FUS mutations are described as an underlying cause of an autosomal-dominant form of JALS"
    explanation: >-
      Assigns the recessive/dominant split across the JALS genes, supporting
      the inheritance annotations on this and the following genetic records.
- name: SETX
  gene_term:
    preferred_term: SETX
    term:
      id: hgnc:445
      label: SETX
  relationship_type: CAUSATIVE
  subtype: ALS4
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Heterozygous SETX missense variants; ALS4 is the one JALS form in which
      dominant inheritance was established from a large multigenerational
      pedigree rather than from de novo cases.
  notes: >
    SETX is allelic between two mechanistically distinct diseases with opposite
    inheritance: dominant missense variants cause ALS4 (juvenile ALS), whereas
    biallelic pathogenic variants cause ataxia with oculomotor apraxia type 2
    (AOA2). This is the SETX counterpart of the SPTLC1/HSAN1A contrast — one
    gene, two failure modes, two diseases.
  evidence:
  - reference: PMID:34946884
    reference_title: "Juvenile Amyotrophic Lateral Sclerosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In familial cases, the gene mutations are mostly inherited in an autosomal recessive pattern and mutations in SETX are inherited in an autosomal dominant fashion."
    explanation: >-
      Establishes SETX as the dominant exception within a predominantly
      recessive familial JALS gene set.
  - reference: PMID:9497266
    reference_title: "The gene for a novel form of amyotrophic lateral sclerosis maps to chromosome 9q34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed genetic mapping studies of an 11-generation pedigree with an autosomal dominant, juvenile-onset motor-systems disease."
    explanation: >-
      The linkage study that established ALS4 as a dominant juvenile-onset
      motor neuron disease, before SETX was identified.
  - reference: PMID:20301333
    reference_title: "Ataxia with Oculomotor Apraxia Type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of biallelic pathogenic variants in SETX by molecular genetic testing confirms the diagnosis."
    explanation: >-
      Cited for the AOA2 half of the SETX allelic contrast ONLY - this
      GeneReviews chapter is about AOA2, not about ALS4 or JALS. It establishes
      that AOA2 requires biallelic SETX variants, which together with
      PMID:15106121 (dominant missense in ALS4) supports the two-failure-modes
      note above.
- name: SPG11
  gene_term:
    preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  relationship_type: CAUSATIVE
  subtype: ALS5
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: Biallelic SPG11 sequence alterations co-segregating in recessive pedigrees.
  case_fractions:
  - population: 25 families with autosomal recessive juvenile ALS and long-term survival
    cohort_size: 25
    notes: >-
      10 of 25 ascertained pedigrees carried SPG11 alterations. Note the cohort

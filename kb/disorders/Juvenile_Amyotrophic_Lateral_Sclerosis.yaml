    - reference: PMID:20668261
      reference_title: "Juvenile ALS with basophilic inclusions is a FUS proteinopathy with FUS mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Juvenile ALS with basophilic inclusions is a FUS proteinopathy and should be classified as ALS-FUS."
      explanation: >-
        Establishes the FUS proteinopathy as the defining molecular pathology
        of this juvenile ALS form.
- name: Serine Palmitoyltransferase Escape from ORMDL Inhibition
  biological_scale: MOLECULAR
  role: Trigger
  description: >
    De novo SPTLC1 variants located within a single membrane-spanning domain
    impede the interaction of the serine palmitoyltransferase complex with its
    regulatory ORMDL subunit. Because ORMDL proteins mediate the homeostatic
    feedback that restrains SPT, the result is increased SPT activity and
    increased de novo sphingolipid synthesis — a gain of function, and the
    mechanistic mirror image of HSAN1A, where SPTLC1 variants near the active
    site instead redirect substrate selectivity toward neurotoxic
    deoxysphingoid bases.
  genes:
  - preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  molecular_functions:
  - preferred_term: serine C-palmitoyltransferase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004758
      label: serine C-palmitoyltransferase activity
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
  genetic_context:
    gene:
      preferred_term: SPTLC1
      term:
        id: hgnc:11277
        label: SPTLC1
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
    allele_type: missense
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Heterozygous de novo SPTLC1 missense variants in the transmembrane
      domain (p.Ala20Ser, p.Ser331Tyr, p.Leu38Arg; also the in-frame
      p.Leu39del).
  notes: >
    `modifier: GAIN_OF_FUNCTION` rather than `INCREASED` on the molecular
    function is deliberate and qualitative: the enzyme is not merely running
    faster but has escaped its ORMDL regulatory constraint. The downstream
    biosynthetic process is quantitative and therefore takes `INCREASED`.
    Detailed mechanism is curated in
    Amyotrophic_Lateral_Sclerosis_27_Juvenile.yaml.
  evidence:
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All SPTLC1-ALS mutations including the SPTLC1 p.L38R are located within a single membrane-spanning domain of the protein and impede the interaction with the regulatory ORMDL subunit of SPT."
    explanation: >-
      Establishes the shared structural location of SPTLC1-ALS variants and the
      loss of ORMDL-mediated restraint that defines this node.
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An increased SPT activity and SL de novo synthesis was confirmed in p.L38R expressing HEK293 cells."
    explanation: >-
      Direct functional confirmation of increased enzyme activity and increased
      sphingolipid synthesis, supporting the GAIN_OF_FUNCTION assignment.
  - reference: PMID:38788085
    reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In general, variants that cluster near the active site (PLP binding site), in SPTLC1 or SPTLC2, are usually associated with HSAN1 whereas those variants that affect the transmembrane domains of SPTLC1 or SPTSSA or intermembrane domain of SPTLC2 are more likely to cause jALS or cHSP."
    explanation: >-
      Establishes the position-dependent genotype-phenotype split between
      HSAN1 and juvenile ALS within the same gene — the two-failure-modes
      contrast this node records.
  downstream:
  - target: Combined Upper and Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SPT dysregulation in this direction produces a motor neuron disease
      affecting both upper and lower motor neurons while sparing sensory
      neurons; the steps between excess sphingolipid synthesis and selective
      motor neuron loss are not established.
    evidence:
    - reference: PMID:38788085
      reference_title: "Serine Palmitoyltransferase (SPT)-related Neurodegenerative and Neurodevelopmental Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "juvenile amyotrophic lateral sclerosis affecting the upper and lower motor neurons with sparing of sensory neurons"
      explanation: >-
        Links the SPT lesion to combined upper and lower motor neuron
        involvement with sensory sparing.
- name: Combined Upper and Lower Motor Neuron Degeneration
  biological_scale: CELLULAR
  role: Convergent effector
  description: >
    The shared distal node of JALS and the feature that defines it clinically:
    degeneration of both corticospinal upper motor neurons and brainstem and
    spinal lower motor neurons, producing simultaneous pyramidal signs
    (spasticity, hyperreflexia, extensor plantar responses) and lower motor
    neuron signs (amyotrophy, weakness, fasciculation). Each of the upstream
    genetic arms converges here, but the balance between the two limbs of the
    lesion is subtype-determined and is what sets the rate of progression.
  cell_types:
  - preferred_term: Betz upper motor neuron
    term:
      id: CL:4023052
      label: Betz upper motor neuron
  - preferred_term: alpha motor neuron
    term:
      id: CL:0008038
      label: alpha motor neuron
  biological_processes:
  - preferred_term: motor neuron apoptotic process
    modifier: INCREASED
    term:
      id: GO:0097049
      label: motor neuron apoptotic process
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical picture in typical JALS presentation is dominated by symmetric or asymmetric upper and lower motor neuron signs with variable rates of motor progression and bulbar compromise."
    explanation: >-
      Establishes combined upper and lower motor neuron involvement as the
      defining clinical expression of this convergent node.
  - reference: PMID:34946884
    reference_title: "Juvenile Amyotrophic Lateral Sclerosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "patients presenting with combined upper and lower motor neuron disorders before age 25 should be carefully examined for genetic mutations"
    explanation: >-
      Confirms that the combined upper and lower motor neuron lesion before age
      25 is the operational definition of the JALS presentation.
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical manifestation reflects the degeneration of both upper motor neurons and lower motor neurons causing weakness of the lower limbs, spasticity of facial muscles, uncontrolled laughter, dysarthria, bladder dysfunction, sensory disturbances"
    explanation: >-
      Ties the combined degeneration directly to the JALS clinical signs
      recorded as phenotypes below.
  downstream:
  - target: Progressive Motor Handicap and Respiratory Failure
    causal_link_type: DIRECT
    description: >-
      Progressive loss of motor units leads to loss of ambulation, bulbar
      failure and ultimately ventilatory failure; the rate is subtype-dependent.
    evidence:
    - reference: PMID:38540369
      reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "certain subtypes with lower motor neuron-dominant features and early bulbar compromise lead to rapidly progressive motor handicap"
      explanation: >-
        Establishes progression to motor handicap as the organism-level
        consequence, and that the rate depends on which limb of the lesion
        dominates.
- name: Progressive Motor Handicap and Respiratory Failure
  biological_scale: ORGANISM
  role: Outcome
  description: >
    The organism-level endpoint. In lower motor neuron-dominant and
    bulbar-onset forms, death from respiratory failure follows within months to
    a few years of onset; in upper motor neuron-dominant forms, motor handicap
    accumulates over decades with survival into adulthood and, for ALS4,
    a normal life span. There is no single JALS prognosis.
  evidence:
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Death usually occurs from respiratory failure between 7 and 84 months after onset"
    explanation: >-
      PARTIAL: gives the fatal endpoint and its typical interval, but the
      figures are drawn from the reviewed JALS case literature and do not apply
      to the indolent upper motor neuron-dominant subtypes recorded in
      `progression`.
  - reference: PMID:34946884
    reference_title: "Juvenile Amyotrophic Lateral Sclerosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Disease prognosis varies from rapidly progressive to an indolent course."
    explanation: >-
      Supports the explicit refusal to state a single disease-level prognosis
      for JALS.

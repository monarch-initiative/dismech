      term:
        id: hgnc:4010
        label: FUS
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
    allele_type: missense
    description: >-
      Heterozygous, usually de novo C-terminal FUS variants disrupting the
      nuclear localisation signal (p.P525L; also the frameshifting

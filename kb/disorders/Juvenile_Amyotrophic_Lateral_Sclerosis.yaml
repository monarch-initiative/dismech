      generalisable to unselected JALS.
    evidence:
    - reference: PMID:20110243
      reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "12 sequence alterations in the spatacsin gene (one of which is novel, IVS30 + 1 G > A) were identified in 10 unrelated pedigrees with autosomal recessive juvenile amyotrophic lateral sclerosis and long-term survival"
      explanation: >-
        Reports 10 SPG11-positive pedigrees within the 25-family ascertained
        cohort described in the same abstract.
  evidence:
  - reference: PMID:20110243
    reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants seemed to be pathogenic since they co-segregated with the disease in all pedigrees"
    explanation: Co-segregation evidence for pathogenicity of the SPG11 alterations.
- name: SIGMAR1
  gene_term:
    preferred_term: SIGMAR1
    term:
      id: hgnc:8157
      label: SIGMAR1
  relationship_type: CAUSATIVE
  subtype: ALS16
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: Homozygous SIGMAR1 variant in a consanguineous pedigree.
  notes: >
    SIGMAR1 is allelic with autosomal recessive distal hereditary motor
    neuronopathy (HMNR2/dSMA2), which is curated in
    Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive.yaml. The dHMN
    phenotype is lower-motor-neuron-only; ALS16 adds the upper motor neuron
    lesion. The evidence base for ALS16 is a single consanguineous family.
  evidence:
  - reference: PMID:21842496
    reference_title: "A mutation in sigma-1 receptor causes juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a shared homozygosity region in affected individuals that spans ~120 kbp on chromosome 9p13.3 containing 9 RefSeq genes. Sequencing the SIGMAR1 gene revealed a mutation affecting a highly conserved amino acid located in the transmembrane domain of the encoded protein, sigma-1 receptor."
    explanation: >-
      The mapping and sequencing result establishing SIGMAR1 as the ALS16 gene.
- name: FUS
  gene_term:
    preferred_term: FUS
    term:
      id: hgnc:4010
      label: FUS
  relationship_type: CAUSATIVE
  subtype: ALS6-JALS
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Heterozygous dominant FUS variants, most arising de novo, so that
      apparently sporadic juvenile presentations are the rule.
  notes: >
    The juvenile phenotype is variant-level, not gene-level: FUS-ALS as a whole
    is mostly adult-onset, and it is specifically the C-terminal
    nuclear-localisation-signal variants (p.P525L and the frameshifting
    c.1554_1557delACAG) that produce the severe juvenile form. This is why the
    ALS6-JALS subtype above is left unbound to MONDO:0011951.
  evidence:
  - reference: PMID:21907581
    reference_title: "P525L FUS mutation is consistently associated with a severe form of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some FUS mutations have been observed in patients with the juvenile form of Amyotrophic Lateral Sclerosis starting before 25 years."
    explanation: >-
      Establishes that only some FUS variants produce the juvenile form,
      supporting the variant-level rather than gene-level treatment.
  - reference: PMID:20668261
    reference_title: "Juvenile ALS with basophilic inclusions is a FUS proteinopathy with FUS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FUS c.1574C>T (P525L) and c.1554_1557delACAG mutations are associated with this distinct phenotype."
    explanation: >-
      Names the two specific C-terminal FUS variants associated with the
      juvenile basophilic-inclusion phenotype.
  - reference: PMID:36801857
    reference_title: "Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in FUS were described as the most common cause of the autosomal dominant form in JALS, and the majority was de novo."
    explanation: >-
      Corroborates both the dominant inheritance and the de novo predominance
      recorded on this genetic record.
- name: SPTLC1
  gene_term:
    preferred_term: SPTLC1
    term:
      id: hgnc:11277
      label: SPTLC1
  relationship_type: CAUSATIVE
  subtype: ALS27
  variant_origin: DE_NOVO
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: Heterozygous de novo SPTLC1 variants; no family history in reported probands.
  notes: >
    SPTLC1 causes two different diseases by two different molecular routes:
    transmembrane-domain variants escape ORMDL feedback and increase canonical
    sphingolipid synthesis, causing juvenile ALS (ALS27), while active-site
    variants alter substrate selectivity to generate deoxysphingoid bases,
    causing HSAN1A (MONDO:0008086). The juvenile ALS route is the
    gain-of-function one. Detail is curated in
    Amyotrophic_Lateral_Sclerosis_27_Juvenile.yaml.
  evidence:
  - reference: PMID:37348646
    reference_title: "SPTLC1 p.Leu38Arg, a novel mutation associated with childhood ALS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, several gain-of-function mutations in SPTLC1 were associated with juvenile ALS."
    explanation: >-
      States the gain-of-function direction that distinguishes SPTLC1-JALS from
      the HSAN1A mechanism.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in this gene have been previously shown to be associated with autosomal-dominant hereditary sensory autonomic neuropathy, type 1A, by disrupting an essential enzyme complex in the sphingolipid synthesis pathway."
    explanation: >-
      Records the HSAN1A allelism from which the juvenile ALS phenotype was
      distinguished.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.008
  notes: >-
    European multicentre estimate across 46 specialised ALS centres, restricted
    to onset before age 18, i.e. narrower than the age-25 JALS definition, so
    this understates JALS prevalence as defined here. Recorded as the only
    formal population estimate available.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "A rare multicentric European study including data from 46 specialized ALS centers estimated a prevalence of 0.008 cases per 100,000 inhabitants with onset of symptoms before age 18, representing less than 0.1% of all ALS cases"
    explanation: >-
      PARTIAL because the cited estimate uses an age-18 cutoff rather than the
      age-25 JALS definition.
- population: United States, National ALS Registry 2015-2018, age-adjusted
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.24
  rate_low: 0.21
  rate_high: 0.24
  notes: >-
    Registry-based, and an undercount by construction: the Registry does not
    enrol patients under 18, and defines cases by age at diagnosis rather than
    age at symptom onset.
  evidence:
  - reference: PMID:37789566
    reference_title: "A brief report on juvenile amyotrophic lateral sclerosis cases in the United States National ALS Registry: 2010-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The crude and age adjusted prevalence rates remained steady from 2015 to 2018 with a slight increase in the age-adjusted prevalence from 0.21 to 0.24 per 100,000 persons during the interval"
    explanation: Source of the registry-based age-adjusted prevalence range.
epidemiology:
- name: Demographic distribution in the US National ALS Registry
  description: >
    Among 44 confirmed or likely juvenile ALS cases ascertained between 2010
    and 2018, 79.5% were male and 54.5% were nonwhite — an inversion of the
    predominantly non-Hispanic White demographic of the Registry as a whole.
  notes: >-
    The authors flag this as unexpected and unexplained, and note that the
    cohort excludes patients under 18 and lacks genetic testing, so the
    demographic signal should not be over-read.
  evidence:
  - reference: PMID:37789566
    reference_title: "A brief report on juvenile amyotrophic lateral sclerosis cases in the United States National ALS Registry: 2010-2018."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 44 identified patients, 37.8% were diagnosed at age 24, were more likely to be nonwhite (54.5%), male (79.5%), and live in the Midwest or Northeast regions (54.5%) of the US."
    explanation: Source of the sex and race distribution of registry-ascertained juvenile ALS.
- name: Proportion with an identifiable monogenic basis
  description: >
    Approximately 40% of JALS cases have an identifiable monogenic cause,
    distributed across more than 20 genetic loci. A negative genetic test does
    not exclude the diagnosis.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 20 different genetic loci have been associated with both sporadic and familial juvenile Amyotrophic Lateral Sclerosis. Currently, almost 40% of cases have an identifiable monogenic basis"
    explanation: Source of the 40% monogenic yield and the >20-locus figure.
  - reference: PMID:34946884
    reference_title: "Juvenile Amyotrophic Lateral Sclerosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Juvenile amyotrophic lateral sclerosis (JALS) is a rare group of motor neuron disorders with gene association in 40% of cases."
    explanation: Independent statement of the same 40% figure from a separate review.
progression:
- phase: Indolent upper motor neuron-dominant course
  subtype: ALS4
  notes: >-
    ALS4/SETX is the extreme of the indolent branch: slow progression with a
    normal life span. Recorded as a subtype-specific course, not a
    disease-level prognosis.
  evidence:
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with ALS4 usually have an onset of symptoms at age <25 years, a slow rate of progression, and a normal life span."
    explanation: The defining paper's statement of the ALS4 course.
- phase: Long-term survival with recessive SPG11 disease
  subtype: ALS5
  notes: >-
    The SPG11 JALS pedigrees were explicitly ascertained for long-term
    survival, so this describes the ascertained population and may not
    generalise to all SPG11 juvenile ALS.
  evidence:
  - reference: PMID:20110243
    reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "motivated us to investigate 25 families with autosomal recessive juvenile amyotrophic lateral sclerosis and long-term survival for mutations in the spatascin gene"
    explanation: >-
      PARTIAL: establishes long-term survival as the ascertainment criterion
      rather than as a demonstrated property of all SPG11 juvenile ALS.
- phase: Decades-long course with SPTLC1 disease
  subtype: ALS27
  age_range: 22-52 years, single case with 30-year follow-up
  notes: >-
    Single-patient natural history; the longest documented follow-up of
    SPTLC1-related JALS.
  evidence:
  - reference: PMID:37497262
    reference_title: "Thirty-Year Follow-Up of Early Onset Amyotrophic Lateral Sclerosis with a Pathogenic Variant in SPTLC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She lost independent ambulation at age 45 years."
    explanation: >-
      Anchors the decades-long course: independent ambulation was retained for
      23 years after presentation at age 22.
  - reference: PMID:37497262
    reference_title: "Thirty-Year Follow-Up of Early Onset Amyotrophic Lateral Sclerosis with a Pathogenic Variant in SPTLC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "are a recently identified cause of juvenile amyotrophic lateral sclerosis (JALS) with slow progression"
    explanation: States the slow-progression character of SPTLC1-related JALS.
- phase: Rapidly progressive lower motor neuron-dominant or bulbar-onset course
  subtype: ALS6-JALS
  notes: >-
    The opposite pole from the indolent branch. In the index p.P525L case,
    tracheostomy was reached 14 months from onset in an 11-year-old.
  evidence:
  - reference: PMID:21907581
    reference_title: "P525L FUS mutation is consistently associated with a severe form of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an 11-year-old girl affected by sporadic juvenile ALS with a rapid course resulting in tracheostomy after 14 months from the onset."
    explanation: The case-level anchor for the rapidly fatal branch of JALS progression.
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rapidly progressive clinical course is more commonly observed in patients with specific pathogenic variants in FUS and SOD1 genes"
    explanation: >-
      Attributes the rapid course to specific FUS and SOD1 variants rather than
      to JALS generally.
histopathology:
- name: FUS-immunoreactive, TDP-43-negative basophilic inclusions
  description: >-
    The defining neuropathology of FUS-related juvenile ALS. Remaining spinal
    motor neurons contain basophilic cytoplasmic inclusions that are strongly
    immunoreactive for FUS protein and negative for TDP-43. This is what
    separates juvenile from adult ALS at the level of pathology rather than
    genetics, and it is the evidential basis for the
    `jals_not_tdp43_proteinopathy` discussion: adult ALS is a TDP-43
    proteinopathy in the great majority of cases, whereas these juvenile
    inclusions are not.
  context: Postmortem spinal cord; two autopsy cases with FUS mutations.
  subtype: ALS6-JALS
  evidence:
  - reference: PMID:20668261
    reference_title: >-
      A juvenile-onset amyotrophic lateral sclerosis case with mutations in FUS
      gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Basophilic inclusions were strongly positive for FUS protein but negative for TAR DNA binding protein 43 (TDP-43)."
    explanation: >-
      The immunohistochemical result itself - FUS-positive, TDP-43-negative -
      recorded here as a primary histopathological finding rather than only as
      support for a mechanistic node.
  - reference: PMID:20579074
    reference_title: >-
      Juvenile amyotrophic lateral sclerosis with basophilic inclusions is a
      FUS proteinopathy with FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem examination in both cases revealed severe loss of spinal motor neurons with remaining neurons showing basophilic inclusions that contain abnormal aggregates of FUS proteins and disorganized intracellular organelles, including mitochondria and endoplasmic reticulum."
    explanation: >-
      Autopsy description pairing the inclusion pathology with severe spinal
      motor neuron loss and organelle disorganization in the surviving neurons.
  - reference: PMID:20579074
    reference_title: >-
      Juvenile amyotrophic lateral sclerosis with basophilic inclusions is a
      FUS proteinopathy with FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, spinal motor neurons in patients with late-onset sporadic ALS showed no evidence of abnormal accumulation of FUS protein."
    explanation: >-
      The reciprocal control observation within the same study: the FUS
      accumulation is absent from late-onset sporadic ALS, which is what makes
      this a juvenile-specific pathological signature rather than a shared one.
  notes: >-
    Scoped to FUS-related juvenile ALS, and deliberately not generalized. The
    other subtypes have no comparably characterized aggregate pathology - the
    ALS2, SETX, SPG11, SIGMAR1 and SPTLC1 mechanisms are trafficking,
    RNA-processing, lysosomal, ER-stress and sphingolipid lesions respectively,
    and none has an established inclusion phenotype curated here. Do not read
    this section as the neuropathology of JALS as a whole. Evidence base is two
    autopsy cases.
- name: Extramotor FUS pathology in cerebral cortex and brainstem
  description: >-
    The same FUS-positive inclusions are found beyond the spinal cord, in
    layers IV-V of cerebral cortex and in several brainstem nuclei. The
    anatomical distribution matches the combined upper and lower motor neuron
    phenotype that defines the disease clinically.
  context: Postmortem cerebral cortex and brainstem; same two autopsy cases.
  subtype: ALS6-JALS
  evidence:
  - reference: PMID:20579074
    reference_title: >-
      Juvenile amyotrophic lateral sclerosis with basophilic inclusions is a
      FUS proteinopathy with FUS mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, the FUS-positive inclusions were also detected in neurons in layers IV-V of cerebral cortex and several brainstem nuclei."
    explanation: >-
      Establishes the extramotor and upper-motor-neuron distribution of the FUS
      pathology, corroborating the combined UMN/LMN clinical picture.
diagnosis:
- name: Molecular genetic testing for a causal JALS gene
  description: >-
    Whole-exome sequencing or a large next-generation-sequencing panel is
    recommended in both sporadic and familial juvenile-onset disease. Because
    JALS is genetically heterogeneous and the overall diagnostic yield is
    incomplete, a negative result does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of a causal variant assigns the genotypic subtype, which is
    what determines prognosis and trial eligibility in this entry.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Genetic testing is routinely recommended in JALS, both in sporadic and familial cases."
    explanation: >-
      Establishes molecular testing as a routine diagnostic step in JALS rather
      than a purely counseling activity.
- name: Biallelic SPG11 confirmation in the ALS5 subtype
  description: >-
    Scoped to the ALS5 (SPG11) subtype. The molecular diagnosis at this locus
    rests on biallelic pathogenic variants together with the characteristic
    clinical and MRI findings - notably a thin corpus callosum, which is also
    the imaging feature that separates the allelic HSP presentation from ALS.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Two pathogenic SPG11 alleles in a proband with compatible clinical and MRI
    findings establish the diagnosis at this locus.
  evidence:
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of SPG11 is established in a proband with characteristic
      clinical and MRI findings and biallelic pathogenic variants in SPG11
      identified on molecular genetic testing.
    explanation: >-
      GeneReviews DIAGNOSIS/TESTING. Defines the molecular-confirmation
      criterion for the SPG11 locus underlying ALS5.
  notes: >-
    This section is a starting point, not a complete diagnostic workup for
    JALS. The clinical diagnostic criteria (El Escorial / Awaji), EMG, and the
    broader testing strategy are not yet curated here.
treatments:
- name: Multidisciplinary Supportive Care
  description: >
    Coordinated non-pharmacological care by physical, speech and occupational
    therapists, nutritionists, psychologists and nurses. This is the core
    therapy for JALS; symptomatic management improves quality of life in more
    advanced disease.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Non-pharmacological treatment based on a specialized multidisciplinary team approach, involving physical, speech, and occupational therapists, nutritionists, psychologists, and nurses, represents the core therapy of patients with JALS."
    explanation: Establishes multidisciplinary supportive care as the core JALS therapy.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Care by a multidisciplinary team; physiotherapy to stretch spastic
      muscles; antispastic drugs such as baclofen; botulin toxin and intrathecal
      baclofen for severe and disabling spasticity when oral drugs are
      ineffective.
    explanation: >-
      GeneReviews MANAGEMENT. Corroborates the multidisciplinary model and
      specifies the spasticity-directed measures for the SPG11 locus underlying
      the ALS5 subtype. PARTIAL because the recommendation is written for
      allelic SPG11-HSP, not for JALS as a whole.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: Evaluation every six months to adjust physiotherapy and
      medications.
    explanation: >-
      GeneReviews MANAGEMENT (surveillance). Supplies the review interval for
      ongoing supportive care at this locus; PARTIAL for the same
      allelic-entity reason.
- name: Genetic Counseling
  description: >
    Counseling of the proband and at-risk relatives once a causal variant is
    known: recurrence-risk discussion appropriate to the subtype's inheritance
    mode, cascade carrier testing of relatives, and reproductive options
    including prenatal testing. The recurrence risk differs sharply across this
    entry's subtypes - 25% per pregnancy for the autosomal recessive loci
    (ALS2, SPG11, SIGMAR1) against a dominant or, for most FUS-related and
    SPTLC1 juvenile disease, de novo mechanism - so counseling is downstream of
    the molecular diagnosis rather than parallel to it. The testing strategy
    itself is curated under `diagnosis:`, not here.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk family members and prenatal testing for
      at-risk pregnancies are possible once the pathogenic variants in a family
      are known.
    explanation: >-
      GeneReviews GENETIC COUNSELING. Establishes the two counseling actions
      that follow a molecular diagnosis - cascade carrier testing and prenatal
      testing - for the SPG11 locus underlying the ALS5 subtype. PARTIAL
      because the chapter is written for allelic SPG11-HSP rather than for JALS
      as a whole, and because the recurrence-risk arithmetic it states applies
      only to the recessive subtypes.
- name: Oral L-Serine Supplementation
  description: >
    Substrate-based therapy proposed for SPTLC1-related JALS. Subtype-restricted;
    there is no evidence base for its use in other JALS forms.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: Serine Palmitoyltransferase Escape from ORMDL Inhibition
    treatment_effect: INHIBITS
    description: >-
      Aimed at the SPTLC1 gain-of-function node. The review names it as a
      therapeutic option for SPTLC1-related JALS without reporting trial
      outcome data, so the target link is recorded as PARTIAL.
    evidence:
    - reference: PMID:38540369
      reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Other monogenic forms of therapeutic interest include SPTLC1-related JALS which is amenable to oral L-serine supplementation therapy"
      explanation: >-
        PARTIAL: names L-serine as applicable to the SPTLC1 subtype but reports
        no efficacy data, and does not itself describe the molecular action on
        the SPT complex.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "There are still very limited specific data regarding disease-modifying therapies for JALS."
    explanation: >-
      Records the general absence of disease-modifying evidence in JALS, the
      context in which this subtype-restricted option sits.
  - reference: PMID:34946884
    reference_title: >-
      Juvenile amyotrophic lateral sclerosis: a review.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "although the utility of this approach is uncertain and may potentially worsen the overproduction of spingolipids"
    explanation: >-
      A direct caution against the therapeutic rationale above, and a
      mechanistically pointed one: the SPTLC1 lesion curated in this entry is a
      gain-of-function escape from ORMDL inhibition causing excess canonical
      sphingolipid synthesis, so supplying more substrate to an already
      unrestrained enzyme could plausibly aggravate the primary defect rather
      than correct it. Recorded as PARTIAL because the source raises the
      concern without resolving it. The source's own spelling

    snippet: "Postmortem examination in both cases revealed severe loss of spinal motor neurons with remaining neurons showing basophilic inclusions that contain abnormal aggregates of FUS proteins and disorganized intracellular organelles, including mitochondria and endoplasmic reticulum."
    explanation: >-
      Human autopsy evidence for FUS aggregation in basophilic inclusions in
      juvenile ALS spinal motor neurons.
  - reference: PMID:20579074
    reference_title: "Extensive FUS-immunoreactive pathology in juvenile amyotrophic lateral sclerosis with basophilic inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, the FUS-positive inclusions were also detected in neurons in layers IV-V of cerebral cortex and several brainstem nuclei."
    explanation: >-

    The evidence here is a single reported patient who gained weight, set
    against an explicit published concern that the approach may worsen the
    underlying sphingolipid overproduction. This is a proposed option under
    active question, not an established therapy, and it should not be
    presented as one.
differential_diagnoses:
- name: Hereditary Spastic Paraplegia
  description: >
    Upper motor neuron-dominant JALS, particularly the ALS2 and SPG11 forms,
    mimics HSP; SPG11 is literally the same gene as AR-HSP with thin corpus
    callosum. Distinguishing features favouring HSP include a thin corpus
    callosum on imaging and a pure corticospinal phenotype with little
    clinically symptomatic motor neuronopathy.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Almost pure upper motor neuron compromise may also be observed, presenting with marked spasticity, brisk tendon reflexes, clonus, and extensor plantar responses"
    explanation: >-
      Establishes the near-pure upper motor neuron presentation that creates
      the HSP differential.
- name: Spinal Muscular Atrophy
  description: >
    Lower motor neuron-dominant JALS mimics 5q and non-5q SMA and progressive
    muscular atrophy. In the 30-year SPTLC1 case the initial working diagnosis
    was late-onset SMA.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pure lower motor neuron involvement may also be identified, presenting with amyotrophy, weakness, fasciculation, hypotonia, and reduced or absent tendon reflexes"
    explanation: >-
      Establishes the pure lower motor neuron presentation behind the SMA
      differential.
  - reference: PMID:37497262
    reference_title: "Thirty-Year Follow-Up of Early Onset Amyotrophic Lateral Sclerosis with a Pathogenic Variant in SPTLC1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on these findings, she was given the presumptive diagnosis of late onset spinal muscular atrophy (SMA)."
    explanation: A documented instance of JALS being misdiagnosed as SMA.
discussions:
- discussion_id: jals_not_tdp43_proteinopathy
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should juvenile ALS be modelled as a TDP-43 proteinopathy, as adult ALS is?
  attaches_to:
  - pathophysiology#FUS Cytoplasmic Mislocalization and Basophilic Inclusion Formation
  - pathophysiology#Combined Upper and Lower Motor Neuron Degeneration
  rationale: >
    The dismech entry for adult Amyotrophic Lateral Sclerosis carries a
    CANONICAL hypothesis in which TDP-43 cytoplasmic mislocalization and
    aggregation in the great majority of cases is the unifying pathology.
    Carrying that framing over to JALS would be wrong, and the error would be
    invisible because it would take the form of an omission rather than a
    false statement. The best-characterised JALS neuropathology is the
    basophilic-inclusion form seen with C-terminal FUS variants, and those
    inclusions are strongly FUS-positive and explicitly TDP-43 NEGATIVE; the
    authors conclude it should be classified as ALS-FUS. Reciprocally, spinal
    motor neurons in late-onset sporadic ALS show no abnormal FUS accumulation.
    The two entities therefore have different defining proteinopathies, not one
    shared one at different ages. This entry consequently declares no
    disease-level proteinopathy hypothesis: the FUS arm is a FUS proteinopathy,
    and the other genetic arms (endosomal, RNA-processing, lysosomal,
    ER-stress, sphingolipid) have no established aggregate pathology at all.
    Recorded as an explicit curated position rather than left implicit.
  evidence:
  - reference: PMID:20668261
    reference_title: "Juvenile ALS with basophilic inclusions is a FUS proteinopathy with FUS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Basophilic inclusions were strongly positive for FUS protein but negative for TAR DNA binding protein 43 (TDP-43)."
    explanation: >-
      The direct immunohistochemical demonstration that the characteristic JALS
      inclusions are not TDP-43 pathology.
  - reference: PMID:20579074
    reference_title: "Extensive FUS-immunoreactive pathology in juvenile amyotrophic lateral sclerosis with basophilic inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, spinal motor neurons in patients with late-onset sporadic ALS showed no evidence of abnormal accumulation of FUS protein."
    explanation: >-
      The reciprocal observation: the juvenile proteinopathy is absent from
      adult sporadic ALS, so the two are distinct rather than age variants of
      one pathology.
  notes: >-
    No claim is made here about the frequency of TDP-43 pathology in JALS
    generally — the point is that it has not been established as the unifying
    JALS pathology, not that it never occurs.
- discussion_id: jals_mondo_hierarchy_gaps
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Two juvenile-onset ALS concepts are not parented under MONDO:0017593;
    should MONDO add the is_a edges, and how should dismech model them
    meanwhile?
  rationale: >
    Verified against the local MONDO build on 2026-08-20. MONDO:0017593
    (juvenile amyotrophic lateral sclerosis) has exactly four asserted
    children: MONDO:0008780 (ALS2), MONDO:0011196 (ALS5/SPG11),
    MONDO:0013715 (ALS16/SIGMAR1) and MONDO:0008781 (JALS with dementia).
    Two further concepts belong there on their own definitions but are
    parented only under MONDO:0005144 (familial ALS).

    Gap 1 - MONDO:0011223, amyotrophic lateral sclerosis type 4 (SETX). The
    defining publication states that ALS4 onset is usually below 25 years,
    which is the JALS criterion, and titles the disorder a form of juvenile
    ALS. This looks like a genuine missing is_a edge. This entry lists ALS4 as
    a subtype and binds MONDO:0011223 anyway, recording the divergence here
    rather than silently following the hierarchy.

    Gap 2 - MONDO:0859529, amyotrophic lateral sclerosis 27, juvenile
    (SPTLC1). Its own label contains the word juvenile and every reported case
    is juvenile-onset, yet it too hangs only off familial ALS. Note this partly
    resolves a stale claim in the triage of issue #8891 that no MONDO term
    existed for SPTLC1-juvenile ALS: the term does exist and is bound above.
    What is NOT resolved is the placement.

    Deliberately NOT proposed as a gap: MONDO:0011951 (ALS type 6, FUS). Its
    absence from the JALS hierarchy is arguably correct, because FUS-ALS is
    predominantly adult-onset and only specific C-terminal variants produce the
    juvenile phenotype. Equating ALS6 with juvenile ALS would be a
    gene-level-for-variant-level substitution. The FUS subtype above is
    therefore left unbound with that rationale stated on the subtype itself.
  evidence:
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with ALS4 usually have an onset of symptoms at age <25 years, a slow rate of progression, and a normal life span."
    explanation: >-
      The onset criterion that makes ALS4 definitionally juvenile and supports
      Gap 1.
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data broaden the phenotype associated with SPTLC1 and suggest that patients presenting with juvenile ALS should be screened for variants in this gene."
    explanation: >-
      Establishes SPTLC1-related disease as a juvenile ALS entity, supporting
      Gap 2.
  - reference: PMID:21907581
    reference_title: "P525L FUS mutation is consistently associated with a severe form of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some FUS mutations have been observed in patients with the juvenile form of Amyotrophic Lateral Sclerosis starting before 25 years."
    explanation: >-
      Supports treating juvenile FUS-ALS as variant-level, i.e. the reason ALS6
      is NOT proposed as a third MONDO gap.
- discussion_id: jals_peripheral_axonal_degeneration_conformance
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should any JALS pathophysiology node declare conformance to the
    peripheral_axonal_degeneration module?
  attaches_to:
  - pathophysiology#Combined Upper and Lower Motor Neuron Degeneration
  rationale: >
    Decision taken for this entry: NO conformance is declared at the root, and
    none is declared at subtype level either.

    The peripheral_axonal_degeneration module models a length-dependent distal
    axonopathy of peripheral neurons and Schwann cells converging on distal
    axonal degeneration and demyelination. JALS is defined by COMBINED upper
    and lower motor neuron degeneration — the upper motor neuron limb is a
    corticospinal central-tract lesion, which the module does not model at
    all. Conforming the convergent node would therefore assert a shape the
    disease does not have, and would misrepresent the entry to any tooling that
    reads conformance.

    Two subtype-level exceptions were considered and rejected for now.
    First, ALS4/SETX presents with distal weakness and normal sensation, which
    reads like the distal hereditary motor neuronopathy space — but the same
    defining sentence records pyramidal signs, so the corticospinal lesion is
    present and the phenotype is not a pure distal axonopathy.
    Second, for ALS2/alsin: infantile-onset ascending hereditary spastic
    paralysis, an ALS2 allelic disorder, shows elevated plasma neurofilament
    light suggesting axonal degeneration. That is evidence about IAHSP, not
    about ALS2-related JALS, and NfL elevation is a non-specific marker of
    axonal injury including central axonal injury; it does not establish a
    length-dependent peripheral axonopathy. Revisit if direct nerve-conduction
    or pathological evidence of a length-dependent distal axonopathy is
    published for a specific JALS subtype.
  evidence:
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by distal muscle weakness and atrophy, normal sensation, and pyramidal signs"
    explanation: >-
      REFUTE with respect to the proposal to conform ALS4: the same sentence
      that supplies the distal-axonopathy resemblance also records pyramidal
      signs, i.e. a corticospinal lesion the module does not cover.
  - reference: PMID:40439044
    reference_title: "Elevated Plasma Neurofilament Light Chain Levels in Children with Infantile-Onset Ascending Hereditary Spastic Paralysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma NfL levels are elevated in IAHSP, suggesting axonal degeneration."
    explanation: >-
      PARTIAL and about IAHSP, not JALS. Cited as the strongest available
      argument FOR an axonopathy framing of ALS2-related disease, and recorded
      here precisely so the decision against conformance can be re-examined
      against it.

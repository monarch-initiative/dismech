      recessive juvenile ALS. Quoted verbatim including the source's
      "spatascin" spelling.
  downstream:
  - target: Combined Upper and Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SPG11 alterations co-segregate with clinically definite ALS by revised
      El Escorial criteria and, in one pedigree with available CNS tissue, with
      ALS neuropathology.
    evidence:
    - reference: PMID:20110243

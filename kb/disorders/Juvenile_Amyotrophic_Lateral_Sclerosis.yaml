has_subtypes:
- name: ALS2
  display_name: ALS2 / juvenile ALS type 2 (ALS2, alsin; autosomal recessive)
  subtype_term:
    preferred_term: amyotrophic lateral sclerosis type 2, juvenile
    term:
      id: MONDO:0008780
      label: amyotrophic lateral sclerosis type 2, juvenile
  description: >
    Autosomal recessive juvenile ALS caused by biallelic loss-of-function
    variants in ALS2, encoding alsin — a multidomain guanine nucleotide
    exchange factor for the Rab5 GTPase family. ALS2 sits at one end of an
    allelic spectrum with infantile-onset ascending hereditary spastic
    paralysis (IAHSP) and juvenile primary lateral sclerosis (JPLS), which
    share the upper motor neuron lesion but lack (JPLS) or differ in the
    timing of (IAHSP) lower motor neuron involvement. Onset is typically later
    and the course slower than in other JALS forms.
  evidence:
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recessive mutations in the ALS2 gene are responsible for distinct MND conditions, namely Infantile-onset ascending hereditary spastic paralysis (IAHSP, OMIM:607225), Juvenile Primary Lateral Sclerosis (JPLS, OMIM:606353), and Juvenile Amyotrophic Lateral Sclerosis (JALS OMIM:205100)"
    explanation: >-
      Establishes the recessive ALS2 allelic spectrum and confirms that JALS
      (OMIM 205100, the OMIM xref of MONDO:0008780) is one of its three
      conditions.
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "symptoms generally appear later for ALS2-induced JALS patients (median age 4, 5 years), and the clinical course is slower"
    explanation: >-
      Supports the later onset and slower course that distinguish ALS2-related
      JALS from the other genetic subtypes.
- name: ALS4
  display_name: ALS4 (SETX, senataxin; autosomal dominant)
  subtype_term:
    preferred_term: amyotrophic lateral sclerosis type 4
    term:
      id: MONDO:0011223
      label: amyotrophic lateral sclerosis type 4
  description: >
    Autosomal dominant juvenile ALS caused by missense variants in SETX,
    encoding senataxin, a DNA/RNA helicase implicated in R-loop resolution and
    RNA processing. Distal muscle weakness and atrophy with pyramidal signs
    and normal sensation, onset usually before 25 years, slow progression and
    a normal life span. Included here on the strength of the defining paper's
    explicit designation of ALS4 as a juvenile ALS with onset below 25 years,
    despite MONDO parenting MONDO:0011223 only under familial ALS
    (MONDO:0005144) — see the MONDO-gap discussion below.
  evidence:
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile amyotrophic lateral sclerosis (ALS4) is a rare autosomal dominant form of juvenile amyotrophic lateral sclerosis (ALS) characterized by distal muscle weakness and atrophy, normal sensation, and pyramidal signs."
    explanation: >-
      Defines ALS4 as a dominant juvenile ALS and gives its distinguishing
      clinical triad.
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with ALS4 usually have an onset of symptoms at age <25 years, a slow rate of progression, and a normal life span."
    explanation: >-
      Establishes that ALS4 onset is definitionally within the juvenile window
      and that its course is indolent — the basis for listing it as a JALS
      subtype and for the slow-progression branch of `progression`.
- name: ALS5
  display_name: ALS5 (SPG11, spatacsin; autosomal recessive)
  subtype_term:
    preferred_term: amyotrophic lateral sclerosis type 5
    term:
      id: MONDO:0011196
      label: amyotrophic lateral sclerosis type 5
  description: >
    Autosomal recessive juvenile ALS caused by biallelic loss-of-function
    variants in SPG11, encoding spatacsin — the same gene whose loss causes
    autosomal recessive hereditary spastic paraplegia with thin corpus
    callosum. Ascertained in pedigrees selected for long-term survival, and
    associated with pseudobulbar affect and with chronic sensory axonal
    polyneuropathy on nerve conduction studies.
  evidence:
  - reference: PMID:20110243
    reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "12 sequence alterations in the spatacsin gene (one of which is novel, IVS30 + 1 G > A) were identified in 10 unrelated pedigrees with autosomal recessive juvenile amyotrophic lateral sclerosis and long-term survival"
    explanation: >-
      The paper's own quantitative result establishing biallelic SPG11
      alterations as a cause of recessive juvenile ALS, and recording that the
      pedigrees were ascertained for long-term survival.
  - reference: PMID:20110243
    reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation of the spatacsin gene is the single most common cause of autosomal recessive hereditary spastic paraplegia with thin corpus callosum."
    explanation: >-
      Establishes the allelic relationship with AR-HSP/thin corpus callosum
      that makes SPG11 a shared locus rather than an ALS-specific one.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Onset occurs mainly during infancy or adolescence (range: age 1-31 years)
      and in rare cases as late as age 60 years.
    explanation: >-
      GeneReviews CLINICAL CHARACTERISTICS. PARTIAL because the chapter
      describes the allelic SPG11-HSP phenotype rather than ALS5 itself; it
      supports the juvenile-onset window of SPG11-related disease, which is
      what places this locus in a juvenile-onset entry, but is not a direct
      observation of the ALS5 presentation.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild intellectual disability with learning difficulties in childhood
      and/or progressive cognitive decline; peripheral neuropathy; pseudobulbar
      involvement; and increased reflexes in the upper limbs
    explanation: >-
      GeneReviews CLINICAL CHARACTERISTICS. Independently corroborates the two
      features this subtype's description singles out - pseudobulbar
      involvement and peripheral neuropathy - as part of the SPG11 spectrum.
      PARTIAL for the same allelic-entity reason as above.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: SPG11 is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews GENETIC COUNSELING. Authoritative-source confirmation of the
      autosomal recessive transmission asserted in this subtype's display_name
      and description.
  - reference: PMID:20301389
    reference_title: Spastic Paraplegia 11.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Carrier testing for at-risk family members and prenatal testing for
      at-risk pregnancies are possible once the pathogenic variants in a family
      are known.
    explanation: >-
      GeneReviews GENETIC COUNSELING. States the reproductive-counseling
      consequence of the biallelic SPG11 mechanism at this locus.
- name: ALS16
  display_name: ALS16 (SIGMAR1, sigma-1 receptor; autosomal recessive)
  subtype_term:
    preferred_term: amyotrophic lateral sclerosis type 16
    term:
      id: MONDO:0013715
      label: amyotrophic lateral sclerosis type 16
  description: >
    Autosomal recessive juvenile ALS caused by a homozygous SIGMAR1 variant in
    the transmembrane domain of the sigma-1 receptor, an endoplasmic reticulum
    chaperone. Described in a single consanguineous family; the mutant protein
    shows aberrant subcellular distribution and reduced resistance to
    ER-stress-induced apoptosis in a motor neuron-like cell line. SIGMAR1 is
    allelic with autosomal recessive distal hereditary motor neuronopathy
    (HMNR2), curated separately in
    Distal_Hereditary_Motor_Neuronopathy_Autosomal_Recessive.yaml.
  evidence:
  - reference: PMID:21842496
    reference_title: "A mutation in sigma-1 receptor causes juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a consanguineous family segregating juvenile ALS in an autosomal recessive pattern and describe the genetic variant responsible for the disorder."
    explanation: >-
      Establishes the recessive juvenile ALS pedigree from which ALS16 was
      defined, and the single-family evidence base for this subtype.
- name: ALS6-JALS
  display_name: FUS-related juvenile ALS (variant-level within ALS6; autosomal dominant, mostly de novo)
  description: >
    FUS-related juvenile ALS. Deliberately NOT bound to MONDO:0011951
    (amyotrophic lateral sclerosis type 6): ALS6 is a gene-level concept
    covering FUS-ALS at any age, most of which is adult-onset, and MONDO
    parents it under familial ALS and FTD-MND rather than under JALS. The
    juvenile presentation is a variant-level phenomenon — the C-terminal
    nuclear-localisation-signal variants, paradigmatically p.P525L, are the
    ones consistently associated with juvenile onset, a severe rapidly
    progressive course, and a high proportion of de novo occurrence. This is
    the most prevalent monogenic JALS form globally, and its neuropathology
    (FUS-immunoreactive basophilic inclusions, TDP-43 negative) is what
    separates JALS pathology from the adult TDP-43 proteinopathy paradigm.
  evidence:
  - reference: PMID:21907581
    reference_title: "P525L FUS mutation is consistently associated with a severe form of juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this mutation is consistently associated with a specific phenotype characterized by juvenile onset, severe course and high proportion of de novo mutations in sporadic cases"
    explanation: >-
      States the variant-level (p.P525L), not gene-level, basis for treating
      FUS-JALS as a distinct juvenile entity, and supports keeping this
      subtype unbound to the gene-level MONDO:0011951.
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, almost 40% of cases have an identifiable monogenic basis; type 6, associated with FUS gene variants, is the most prevalent globally."
    explanation: >-
      Establishes FUS-related disease as the most prevalent monogenic JALS
      subtype worldwide.
- name: ALS27
  display_name: ALS27 (SPTLC1, serine palmitoyltransferase; autosomal dominant, de novo)
  subtype_term:
    preferred_term: amyotrophic lateral sclerosis 27, juvenile
    term:
      id: MONDO:0859529
      label: amyotrophic lateral sclerosis 27, juvenile
  description: >
    Juvenile ALS caused by de novo, gain-of-function SPTLC1 variants in the
    transmembrane domain that escape ORMDL-mediated feedback inhibition of
    serine palmitoyltransferase, raising rather than lowering de novo
    sphingolipid synthesis. Distinguished from the other JALS subtypes by very
    early onset with failure to thrive, sparing of bulbar onset, and an
    exceptionally long course. Mechanism is curated in depth in the dedicated
    entry (Amyotrophic_Lateral_Sclerosis_27_Juvenile.yaml, PR #9067) and is
    summarised, not duplicated, here.
  evidence:
  - reference: PMID:34459874
    reference_title: "Association of Variants in the SPTLC1 Gene With Juvenile Amyotrophic Lateral Sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo variants in SPTLC1 (p.Ala20Ser in 2 patients and p.Ser331Tyr in 1 patient) were identified in 3 unrelated patients diagnosed with juvenile ALS and failure to thrive."
    explanation: >-
      The trio-exome result establishing de novo SPTLC1 variants as a juvenile
      ALS cause, together with the failure-to-thrive feature that flags this
      subtype clinically.
  - reference: PMID:36801857
    reference_title: "Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, mutations in SPTLC1 occurred de novo in ten out of 16 JALS patients carrying SPTLC1 mutations,"
    explanation: >-
      Quantifies the de novo predominance of SPTLC1 variants across the
      reported JALS series, supporting the de novo characterisation of this
      subtype.
  - reference: PMID:36801857
    reference_title: "Clinical feature difference between juvenile amyotrophic lateral sclerosis with SPTLC1 and FUS mutations."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Recently, SPTLC1 was identified as a disease-causative gene for JALS, and its mutations promoted enzymic activity, resulting in an increase in standard products."
    explanation: >-
      States the gain-of-function direction of SPTLC1-JALS variants - increased
      enzyme activity producing more of the canonical sphingolipid products,
      as opposed to the altered substrate selectivity seen in HSAN1A.
- name: JALS with dementia
  display_name: Juvenile amyotrophic lateral sclerosis with dementia
  subtype_term:
    preferred_term: juvenile amyotrophic lateral sclerosis with dementia
    term:
      id: MONDO:0008781
      label: juvenile amyotrophic lateral sclerosis with dementia
  description: >
    A MONDO-asserted child of juvenile ALS (OMIM 205200) characterised as
    slowly progressive juvenile ALS with concomitantly progressive dementia.
    Listed for completeness of the MONDO hierarchy; no causal gene is recorded
    and the concept sits uneasily against the contemporary review position
    that cognitive compromise is not a hallmark of JALS and that FTD has not
    been directly correlated with it. Curated at name level only — no
    mechanism, phenotype or genetic claim is made here.
  evidence:
  - reference: PMID:38540369
    reference_title: "Clinical and Genetic Aspects of Juvenile Amyotrophic Lateral Sclerosis: A Promising Era Emerges."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Significant cognitive compromise and autonomic disturbances are rare, and Frontotemporal Dementia (FTD) has not been directly correlated with JALS."
    explanation: >-
      Cited as PARTIAL because it does not support the subtype; it records the
      contemporary review position that qualifies it, and is the reason this
      subtype is curated at name level only.
pathophysiology:
- name: Alsin Loss of Function and Rab5 Endosomal Trafficking Failure
  biological_scale: MOLECULAR
  role: Trigger
  description: >
    Biallelic ALS2 loss-of-function variants abolish or destabilise alsin, a
    1657-residue multidomain protein whose MORN/VPS9 module acts as a guanine
    nucleotide exchange factor for the Rab5 GTPase family, and whose
    self-oligomerisation is required for that GEF activity. Disease-associated
    changes alter the native oligomeric state or the protein's capacity to
    interact with partners, disrupting Rab5-dependent endosome formation and
    endocytic trafficking in motor neurons.
  genes:
  - preferred_term: ALS2
    term:
      id: hgnc:443
      label: ALS2
  molecular_functions:
  - preferred_term: Rab5 guanine nucleotide exchange factor activity
    modifier: DECREASED
    term:
      id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
  biological_processes:
  - preferred_term: endosomal transport
    modifier: DECREASED
    term:
      id: GO:0016197
      label: endosomal transport
  cellular_components:
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  genetic_context:
    gene:
      preferred_term: ALS2
      term:
        id: hgnc:443
        label: ALS2
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) loss-of-function ALS2
      variants; nonsense and frameshift changes predominate in reported
      pedigrees.
  evidence:
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Previous studies have demonstrated that Alsin preferentially targets the Rab5 GTPase family, which is involved in signal transduction, trafficking, and vesicle formation, suggesting that Alsin may play a key role in endocytosis and cytoskeletal reorganization in mammalian neuronal cells"
    explanation: >-
      Establishes alsin as a Rab5-directed GEF acting on endocytosis, the
      molecular function this node asserts is lost.
  - reference: PMID:35053075
    reference_title: "Structural and Clinical Aspects of ALS2-Related Motor Neuron Diseases: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "mutations within Alsin's structured domains may be responsible for the alteration of Alsin's native oligomerization state or Alsin's propensity to interact with protein partners"
    explanation: >-
      Supports disruption of oligomerisation and partner interaction as the
      proximal consequence of ALS2 mutation.
  - reference: PMID:39424348
    reference_title: "Clinical and Genotype Profile of Children with ALS2 Gene-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Alsin Rho Guanine Nucleotide Exchange Factor (ALS2) gene encodes a protein alsin that functions as a guanine nucleotide exchange factor."
    explanation: Confirms the GEF function of the ALS2 gene product in a clinical cohort report.
  downstream:
  - target: Combined Upper and Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ALS2 variation leads to degeneration of the corticospinal upper motor
      neurons; the steps connecting endosomal GEF failure to selective motor
      neuron loss are not established.
    evidence:
    - reference: PMID:39424348
      reference_title: "Clinical and Genotype Profile of Children with ALS2 Gene-Related Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variations in ALS2 gene leads to degeneration of upper motor neurons of the corticospinal tract."
      explanation: >-
        Links the ALS2 lesion to corticospinal upper motor neuron degeneration.
        Supports the upper motor neuron half of the target node only; the lower
        motor neuron contribution in ALS2-related JALS is asserted from
        PMID:35053075 on the target node itself.
- name: Senataxin Helicase Dysfunction and RNA Processing Defect
  biological_scale: MOLECULAR
  role: Trigger
  description: >
    Heterozygous missense variants in SETX alter senataxin, a 302.8-kD protein
    carrying a DNA/RNA helicase domain homologous to RENT1 and IGHMBP2. The
    proposed mechanism is neuronal degeneration through dysfunction of helicase
    activity or of other steps in RNA processing — including resolution of
    R-loops, the co-transcriptional RNA:DNA hybrids senataxin acts on.
  genes:
  - preferred_term: SETX
    term:
      id: hgnc:445
      label: SETX
  molecular_functions:
  - preferred_term: RNA helicase activity
    modifier: DECREASED
    term:
      id: GO:0003724
      label: RNA helicase activity
  biological_processes:
  - preferred_term: R-loop processing
    modifier: DECREASED
    term:
      id: GO:0062176
      label: R-loop processing
  genetic_context:
    gene:
      preferred_term: SETX
      term:
        id: hgnc:445
        label: SETX
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    allele_type: missense
    description: >-
      Heterozygous missense SETX variants segregating in a dominant pedigree
      (T3I, L389S, R2136H in the defining study).
  notes: >
    The R-loop processing annotation reflects senataxin's established
    molecular role; the cited ALS4 paper predates that characterisation and
    speaks instead of helicase activity or other steps in RNA processing.
    Replace with directly cited R-loop evidence if this node is elaborated.
  evidence:
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we tested 19 genes within the ALS4 interval and detected missense mutations (T3I, L389S, and R2136H) in the Senataxin gene (SETX)"
    explanation: Identifies the dominant missense SETX variants underlying ALS4.
  - reference: PMID:15106121
    reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SETX contains a DNA/RNA helicase domain with strong homology to human RENT1 and IGHMBP2, two genes encoding proteins known to have roles in RNA processing."
    explanation: >-
      Establishes the helicase/RNA-processing molecular function this node
      asserts is impaired.
  downstream:
  - target: Combined Upper and Lower Motor Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed route from helicase/RNA-processing dysfunction to motor neuron
      degeneration; the defining paper frames this as a suggestion, not a
      demonstrated chain.
    evidence:
    - reference: PMID:15106121
      reference_title: "DNA/RNA helicase gene mutations in a form of juvenile amyotrophic lateral sclerosis (ALS4)."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations of ALS4 suggest that mutations in SETX may cause neuronal degeneration through dysfunction of the helicase activity or other steps in RNA processing."
      explanation: >-
        PARTIAL because the source explicitly hedges - "suggest", "may cause";
        the edge is recorded as a proposed rather than established mechanism.
- name: Spatacsin Loss of Function and Lysosomal-Autophagic Dysfunction
  biological_scale: MOLECULAR
  role: Trigger
  description: >
    Biallelic loss-of-function alterations in SPG11 remove spatacsin, whose
    loss is the single most common cause of autosomal recessive hereditary
    spastic paraplegia with thin corpus callosum and which functions in
    lysosome biogenesis and autophagic-lysosome reformation. The same lesion
    can produce a recessive juvenile ALS phenotype with long-term survival,
    making SPG11 a shared HSP/ALS locus rather than an ALS-specific one.
  genes:
  - preferred_term: SPG11
    term:
      id: hgnc:11226
      label: SPG11
  biological_processes:
  - preferred_term: lysosome organization
    modifier: DECREASED
    term:
      id: GO:0007040
      label: lysosome organization
  - preferred_term: autophagy
    modifier: DECREASED
    term:
      id: GO:0006914
      label: autophagy
  genetic_context:
    gene:
      preferred_term: SPG11
      term:
        id: hgnc:11226
        label: SPG11
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic SPG11 sequence alterations co-segregating with disease in
      consanguineous and non-consanguineous recessive JALS pedigrees.
  notes: >
    The GO annotations on this node describe spatacsin's established cellular
    role in lysosome/autophagy biology; they are not directly evidenced by the
    cited JALS papers, which establish the genetic lesion and the allelic HSP
    relationship. The lysosomal-autophagic mechanism is inferred from the
    SPG11-HSP literature and should be replaced with directly cited evidence
    if this node is elaborated.
  evidence:
  - reference: PMID:20110243
    reference_title: "Mutations in the spatacsin gene cause autosomal recessive juvenile amyotrophic lateral sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study indicates that mutations in the spatascin gene could cause a much wider spectrum of clinical features than previously recognized, including autosomal recessive juvenile amyotrophic lateral sclerosis."
    explanation: >-

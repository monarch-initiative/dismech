- name: Functional Assessment of Complex IV
  description: Respiratory-chain enzyme assays, blue-native electrophoresis and mitochondrial translation studies can clarify an uncertain genetic result. The founding fibroblasts retained complex IV activity despite a fatal neonatal phenotype; fibroblast activity is not a direct prognostic scale.

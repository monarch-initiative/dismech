discussions:
- discussion_id: cox14-human-model-correspondence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Does ROS-dependent mitochondrial RNA release contribute to human COX14 disease?
  rationale: The knock-in mouse provides a mechanistic inflammatory pathway and ex vivo antioxidant rescue, but the human index child died neonatally and had no reported assessment of liver inflammation or retinal pathology. Survival and brain findings also differ. These observations support further investigation rather than clinical antioxidant efficacy claims.
  evidence:
  - reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: It is difficult to directly compare the mice phenotype to the patient pathology, as the death of the patient occurred already 24 hours after birth.
    explanation: The authors explicitly limit direct human-model comparison.
- discussion_id: cox14-residual-activity-severity
  kind: INTERPRETATION
  status: OPEN
  prompt: Why does residual fibroblast complex IV activity coexist with a severe neonatal phenotype?
  rationale: The founding fibroblasts retain measurable complex IV activity. The mouse model demonstrates tissue-dependent protein stability and respiratory defects, but does not identify a human modifier gene or a quantitative prognostic threshold.
  evidence:
  - *id003
  - reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: despite the systemic defect in COX14 function, the impact on protein stability, COX1 synthesis and concomitantly amounts of complex IV differed significantly between tissues.
    explanation: Tissue variation in the animal model may inform the clinical-biochemical discrepancy, without proving the human explanation.

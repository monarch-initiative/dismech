diagnosis:
- name: Molecular Genetic Diagnosis
  description: Evaluate severe congenital lactic acidosis with multisystem abnormalities using mitochondrial/nuclear gene testing, including COX14. Urgent trio exome or genome sequencing may be appropriate. Assess segregation and variant pathogenicity; a COX14 VUS alone does not establish this diagnosis.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1224/
    reference_title: Primary Mitochondrial Disorders Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Molecular genetic testing is used to establish the diagnosis.

    snippet: An autopsy revealed brain hypertrophy, diffuse alteration of the white-matter myelination, and numerous cavities in the parieto-occipital region, brainstem, and cerebellum, as well as hepatomegaly, hypertrophic cardiomyopathy, renal hypoplasia, and adrenal-gland hyperplasia.

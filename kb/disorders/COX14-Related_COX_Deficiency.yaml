    supports: SUPPORT
    evidence_source: OTHER
    snippet: For urgent paediatric referrals where samples from a parent–child trio can be obtained, gene-agnostic WES or WGS, where data is analysed with no gene panels or other preconceptions about where variants associated with a condition are located, is an appropriate testing strategy.
    explanation: Consensus guidance supports rapid broad testing in critically ill infants, without claiming COX14-specific diagnostic yield.
    quote_role: BACKGROUND

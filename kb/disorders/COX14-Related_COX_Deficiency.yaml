pathophysiology:
- name: COX14 Functional Deficiency
  biological_scale: MOLECULAR
  description: The Met19Ile allele destabilizes COX14 and reduces its capacity to regulate COX1 translation. Residual function is possible even when the protein is undetectable by immunoblotting.
  genes:
  - &id007
    preferred_term: COX14
    term:
      id: hgnc:28216
      label: COX14
  molecular_functions:
  - preferred_term: translation regulator activity
    term:
      id: GO:0045182
      label: translation regulator activity
    modifier: DECREASED
  evidence:
  - &id009
    reference: PMID:22243966
    reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C12orf62 was not detectable by immunoblot analysis in subject fibroblasts, and retroviral expression of the wild-type C12orf62 cDNA rescued the biochemical phenotype.
    explanation: Loss of detectable COX14 and complementation support deficiency of the protein rather than a structural COX-subunit mutation.
  - reference: PMID:22243966
    reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the same knockdown exacerbated the biochemical phenotype, implying that the mutant protein, although not detectable by immunoblot analysis, retained some residual function.
    explanation: Additional depletion worsened the patient-cell defect, arguing against a complete functional null.
  - reference: PMID:27693358
    reference_title: Mitochondrial Protein Synthesis Adapts to Influx of Nuclear-Encoded Protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C12ORF62 acts upstream of MITRAC12 and associates with COX1 in a ribosome nascent chain complex.
    explanation: Human-cell interaction and translation experiments position COX14 in early cotranslational assembly.
  downstream:
  - target: Reduced COX1 Translation
    causal_link_type: DIRECT
    description: Deficiency of the translation-regulating factor reduces production of COX1.
    evidence:
    - &id001
      reference: PMID:27693358
      reference_title: Mitochondrial Protein Synthesis Adapts to Influx of Nuclear-Encoded Protein.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the decreased level of newly synthesized COX1 observed upon C12ORF62 knockdown is apparently not a result of increased turnover but rather of reduced translation.
      explanation: C12ORF62 depletion reduces COX1 synthesis; protease depletion did not explain the deficit.
- name: Reduced COX1 Translation
  biological_scale: MOLECULAR
  description: COX1 synthesis is selectively reduced. In patient fibroblasts this occurs without reduced mitochondrial COX mRNA abundance; it should not be described as generalized mitochondrial transcription failure.
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  evidence:
  - *id001
  - reference: PMID:22243966
    reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The levels of the COX mRNAs in the subject were not reduced relative to those of the controls when they were normalized to the rRNA levels
    explanation: Normal transcript abundance distinguishes this defect from depletion of COX mRNA.
  - reference: PMID:22243966
    reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the subject cells, although COX I was synthesized at ∼25% of control levels, the newly synthesized protein was completely stable.
    explanation: In the reported pulse-chase experiment, lower COX1 synthesis coexisted with stable newly synthesized COX1.
  downstream:
  - target: Deficient Complex IV Assembly
    causal_link_type: DIRECT
    description: Reduced COX1 supply and defective coordination of early assembly restrict mature complex IV formation.
    evidence:
    - &id002
      reference: PMID:22243966
      reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Blue native polyacrylamide gel electrophoresis (BN-PAGE) analysis11 showed that the reduced activity was associated with a specific reduction in the amount of fully assembled COX, but did not identify subassemblies of the COX complex
      explanation: Patient fibroblasts directly demonstrate deficient mature complex IV assembly.
- name: Deficient Complex IV Assembly
  biological_scale: MOLECULAR
  conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
  description: The amount of mature complex IV is reduced. COX2 and COX3 incorporation into nascent complexes is inefficient, with increased turnover of these subunits in patient fibroblasts.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex IV assembly
    term:
      id: GO:0033617
      label: mitochondrial respiratory chain complex IV assembly
    modifier: DECREASED
  evidence:
  - *id002
  - reference: PMID:22243966
    reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: newly synthesized COX II and III were less efficiently incorporated into the COX complex, and they were rapidly turned over after a long chase.
    explanation: The assembly defect includes instability of incompletely assembled COX2 and COX3, rather than universal instability of newly synthesized COX1.
  downstream:
  - target: Reduced Complex IV Respiratory Capacity
    causal_link_type: DIRECT
    description: Deficient holoenzyme abundance reduces complex IV catalytic capacity.
    evidence:
    - &id003
      reference: PMID:22243966
      reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX activity in immortalized subject fibroblasts was reduced to 30%-40% of that in control fibroblasts.
      explanation: Residual complex IV activity is substantial in this cell system, despite the severe clinical course.
- name: Reduced Complex IV Respiratory Capacity
  biological_scale: CELLULAR
  description: Reduced complex IV activity limits terminal electron transfer and respiratory capacity. The magnitude varies by tissue and experimental system. Neither complete abolition of oxidative phosphorylation nor uniform depletion of total cellular ATP has been established.
  biological_processes:
  - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
    term:
      id: GO:0006123
      label: mitochondrial electron transport, cytochrome c to oxygen
    modifier: DECREASED
  evidence:
  - *id003
  - reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: COX14M19I liver mitochondria displayed a significant reduction in respiration
    explanation: The knock-in mouse provides a tissue-level respiratory measurement.
  downstream:
  - target: Lactic acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired oxidative metabolism is a plausible contributor to the severe lactic acidosis, but the intermediate flux changes were not directly measured in the infant.
    evidence:
    - reference: PMID:22243966
      reference_title: Mutations in C12orf62, a factor that couples COX I synthesis with cytochrome c oxidase assembly, cause fatal neonatal lactic acidosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: severe congenital lactic acidosis and dysmorphic features associated with a cytochrome c oxidase (COX)-assembly defect
      explanation: Clinical-biochemical association supports the link without a measured ATP or glycolytic-flux result.
      directness: INDIRECT
  - target: Hypertrophic cardiomyopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cardiac mitochondrial dysfunction provides a mechanistic explanation for the reported cardiomyopathy; the intervening developmental and metabolic steps remain unresolved.
  - target: Abnormal CNS myelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Respiratory dysfunction may contribute to the observed white-matter injury, but its cellular sequence is unresolved.
  - target: Increased Hepatocyte Mitochondrial ROS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The COX14 knock-in mouse links respiratory deficiency to increased oxidant production in hepatocytes; this branch has not been demonstrated in patients.
    evidence:
    - &id004
      reference: PMID:39134548
      reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: COX14M19I hepatocytes elicited markedly increased mitochondrial ROS
      explanation: Primary hepatocytes isolated from mutant mice show increased mitochondrial oxidant production.
- name: Increased Hepatocyte Mitochondrial ROS
  biological_scale: CELLULAR
  description: In the Met19Ile mouse model, cultured primary hepatocytes have increased mitochondrial ROS and reduced membrane potential. This is an experimental mechanism, not a documented human COX14 phenotype.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
    modifier: INCREASED
  evidence:
  - *id004
  downstream:
  - target: Cytosolic Mitochondrial RNA Release
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Antioxidant rescue supports ROS-dependent mitochondrial RNA release. The specific membrane pore or transport route has not been resolved.
    evidence:
    - &id005
      reference: PMID:39134548
      reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: treatment with NAC prevented the release of mtRNAs in hepatocytes and subsequent upregulation of ISGs at the protein level
      explanation: Antioxidant intervention in cultured mouse hepatocytes supports ROS-dependent mitochondrial RNA release.
  mechanism_confidence: PROVISIONAL
- name: Cytosolic Mitochondrial RNA Release
  biological_scale: CELLULAR
  description: Mitochondrial RNA accumulates in the cytosol of mutant mouse liver cells. Mitochondrial DNA is also released, but the observed inflammatory response preferentially implicates RNA sensing. No human COX14 tissue data establish this pathway.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We detected both mitochondrial RNA (mtRNA) and mitochondrial DNA (mtDNA) by qPCR in significant amounts in cytoplasmic fractions of liver cells
    explanation: Tissue fractionation and qPCR directly detect misplaced mitochondrial nucleic acids.
  - *id005
  downstream:
  - target: Type I Interferon Response
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Cytosolic mitochondrial RNA is implicated in RIG-I/MDA5-associated inflammatory signaling in mutant mouse liver.
    evidence:
    - &id006
      reference: PMID:39134548
      reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We found that RNA sensors such RIG-1 and MDA5 were significantly more abundant in liver cells than DNA sensors such as STING
      explanation: Sensor abundance supports an RNA-sensing response in the mutant liver; it does not identify the RNA-release pore.
  mechanism_confidence: PROVISIONAL
- name: Type I Interferon Response
  biological_scale: CELLULAR
  description: Interferon-stimulated transcripts and proteins are elevated in COX14 mutant mouse liver, with increased RNA-sensor abundance. This sterile experimental response does not imply a viral cause of the genetic disease.
  biological_processes:
  - preferred_term: response to type I interferon
    term:
      id: GO:0034340
      label: response to type I interferon
    modifier: INCREASED
  evidence:
  - *id006
  - reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: COX14M19I liver showed a significant expression of ISGs both at RNA and protein levels
    explanation: The inflammatory response was measured at both transcript and protein levels in mouse liver.
  downstream:
  - target: Experimental Hepatic Inflammatory Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Persistent innate signaling is implicated in liver injury in the mouse model; contribution to the human neonatal course remains untested.
    evidence:
    - reference: PMID:39134548
      reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Sensing of the “foreign“ mitochondrial RNAs in the cytoplasm instigated the inflammation and subsequent liver pathology.
      explanation: The authors interpret the experimental pathway as a contributor to hepatic pathology.
      directness: INDIRECT
  mechanism_confidence: PROVISIONAL
- name: Experimental Hepatic Inflammatory Injury
  biological_scale: TISSUE
  description: Focal hepatic necrosis and mononuclear infiltrates occur in the COX14 knock-in mouse. Hepatomegaly was reported in the human index child, but hepatic inflammation was not assessed, so the experimental lesion is not asserted as the cause of the human finding.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - &id015
    reference: PMID:39134548
    reference_title: Defective mitochondrial COX1 translation due to loss of COX14 function triggers ROS-induced inflammation in mouse liver.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Liver sections displayed spots of focal necrosis demarcated by mononuclear cell infiltrate.
    explanation: Liver histology in COX14 Met19Ile mice demonstrates inflammatory injury.
  mechanism_confidence: PROVISIONAL

    evidence_source: OTHER
    snippet: In many individuals in whom ... molecular genetic testing ... does not yield or confirm a diagnosis, further investigation of suspected mitochondrial disease can involve a range of different clinical tests, including muscle biopsy for respiratory chain function.
    explanation: Functional studies complement inconclusive molecular testing; biopsy is not required before sequencing.
    quote_role: BACKGROUND
- name: Metabolic and Multisystem Assessment
  description: Assess lactate and acid-base status, respiratory function and cardiac, neurologic, hepatic and renal involvement. Organ assessment should be driven by the presentation; the founding case had abnormalities across these systems.

- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Two families in total. Three affected individuals in the founding Italian family, and one
    proband in the second, Iranian family - whose own authors state that the HSP-GJC2
    correlation had been reported only once before them. No population prevalence estimate for
    SPG44 has been published, and none is asserted here.
  evidence:
  - reference: PMID:37915394
    reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to now, correlation between HSP and GJC2 variants has been reported once. Here, the second case of SPG44 was identified that emphasizes on GJC2 as a HSP-causing gene."
    explanation: >-
      Establishes the published-case count directly: one prior report, this being the second.
progression:
- phase: Onset
  age_range: late onset, after normal or near-normal psychomotor development
  notes: >-
    Unlike PMLD1, which presents in infancy with nystagmus and psychomotor delay, SPG44 begins
    after development has proceeded normally or near-normally. The onset difference is as much
    a discriminator as the severity difference.
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three had a late-onset, slowly progressive, complicated spastic paraplegia, with normal or near-normal psychomotor development, preserved walking capability through adulthood, and no nystagmus."
    explanation: States the late onset and the preserved early development.
- phase: Established disease
  notes: >-
    Slowly progressive, with walking capability preserved through adulthood in all three
    individuals of the founding family. No published SPG44 patient has lost ambulation, but with
    two families and no longitudinal cohort this is an absence of reported progression rather
    than a demonstrated plateau.
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "slowly progressive, complicated spastic paraplegia, with normal or near-normal psychomotor development, preserved walking capability through adulthood"
    explanation: The course and the functional outcome, as far as the founding report records them.
diagnosis:
- name: GJC2 Sequencing Prompted by Hypomyelinating MRI
  description: >-
    The productive diagnostic route is an HSP or HSP-like presentation whose brain MRI shows
    hypomyelination, followed by GJC2 sequencing. This is the recommendation the second family's
    authors make explicitly, and it matters because a patient labelled HSP will not usually have
    a leukodystrophy gene tested.
  evidence:
  - reference: PMID:37915394
    reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the screening of GJC2 in patients with HSP or HSP-like phenotypes especially with hypomyelination in their brain MRI is recommended"
    explanation: The authors' explicit testing recommendation.
  - reference: PMID:31431325
    reference_title: "Late-onset phenotype associated with a homozygous GJC2 missense mutation in a Turkish family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed hyperintense signal in T2-weighted images in the internal capsule and subcortical and periventricular white matter, consistent with hypomyelination."
    explanation: >-
      Describes the imaging pattern concretely, in an independent late-onset GJC2 family, which
      is what makes the MRI-first strategy actionable.
- name: Brainstem Auditory Evoked Potentials to Separate GJC2 from PLP1 Disease
  description: >-
    GJC2 disease and PLP1-related Pelizaeus-Merzbacher disease are described as almost
    indistinguishable clinically and radiologically, and both can present as a hypomyelinating
    leukoencephalopathy with spasticity. Brainstem auditory evoked potentials separate them:
    waves III-V were absent in every PLP1 patient studied and clearly recordable in most GJC2
    patients. In a patient whose pedigree is compatible with either, this is a cheap test that
    points at the right gene first.

    The same series found nerve conduction studies normal in all PLP1 patients and indicating
    mild peripheral neuropathy in 2 of 10 GJC2 patients - worth knowing when interpreting a
    mildly abnormal NCS, though those patients carried the severe PMLD alleles rather than the
    SPG44 ones and no peripheral neuropathy is reported in either published SPG44 family.
  evidence:
  - reference: PMID:20513814
    reference_title: "Clinical neurophysiology in GJA12-related hypomyelination vs Pelizaeus-Merzbacher disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In brainstem auditory EP, waves III-V were absent in all patients with PMD, but clearly recordable in 11 of 13 investigations in 8 patients with PMLD."
    explanation: >-
      The discriminating result. INDIRECT for SPG44 because the GJC2 patients studied had PMLD
      rather than SPG44; the inference is that a test separating GJC2 from PLP1 disease does so
      by the gene, not by the severity, and the entry says so rather than implying the study
      included SPG44 patients.
  - reference: PMID:20513814
    reference_title: "Clinical neurophysiology in GJA12-related hypomyelination vs Pelizaeus-Merzbacher disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "NCS were normal in all patients with PMD and indicated mild peripheral neuropathy in only 2 of 10 patients with PMLD."
    explanation: >-
      The peripheral-nerve finding, at the frequency the study reports. INDIRECT for the same
      reason: these are PMLD patients, and no SPG44 patient has been reported with neuropathy.
treatments:
- name: Genetic Counseling
  description: >-
    Both published families are homozygous for private missense variants, so recurrence-risk
    counselling and carrier testing are directly indicated. The second family gives counselling
    an unusually concrete content: siblings homozygous for the same variant had markedly
    different phenotypes, so a recurrence cannot be predicted to be mild.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37915394
    reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical evaluation of all patients showed two distinct GJC2-related phenotypes in this family; the proband presented a complicated form of HSP, whereas both his affected sisters presented a HLD2 phenotype."
    explanation: >-
      The intrafamilial discordance that makes prognostic counselling on genotype alone
      unsupportable in this disorder.
- name: Symptomatic Management of Spasticity
  description: >-
    No disease-modifying therapy exists. Care follows general hereditary spastic paraplegia
    practice - physiotherapy, mobility support, antispastic measures. Recorded with no specific
    agent bound, because neither cited source makes a drug recommendation for SPG44.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
    description: >-
      Addresses the functional consequence only. Nothing available acts on the coupling defect
      upstream of it.
  notes: >-
    Deliberately thin, and the thinness is the finding. Both SPG44 reports are gene-discovery
    and mechanism papers with no management section, and no GeneReviews chapter covers SPG44.
    This entry does not import management text from the general HSP literature.
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "preserved walking capability through adulthood"
    explanation: >-
      Establishes the ambulatory status that supportive care is aimed at maintaining. INDIRECT
      because no cited source states a management recommendation for this disorder; the claim
      that supportive care is what is available follows from the absence of anything else, not
      from this sentence.
- name: Oligodendrocyte-Targeted AAV-GJC2 Gene Therapy (preclinical only)
  description: >-
    NOT A TREATMENT FOR PATIENTS. A single intracerebral injection of AAV.MBP.Cx47myc - the
    GJC2 coding sequence under the myelin basic protein promoter, so expression is restricted to
    oligodendrocytes - at postnatal day 10 improved motor performance and coordination and
    prolonged survival in Cx32/Cx47 double-knockout mice, with improvement in demyelination,
    oligodendrocyte apoptosis, inflammation and astrogliosis, and re-established gap-junctional
    dye transfer between oligodendrocytes.

    The mechanistic rationale is unusually direct for SPG44 in particular. The disease node this
    acts on is loss of channel function, and the SPG44 allele has been shown not to carry the
    ER-retention and proteotoxic arm that the severe alleles do - so there is no misfolded
    species to clear before a replacement connexin can work. A replacement strategy is matched
    to a clean loss of function in a way it would not be to a toxic gain of function.

    Two things keep this firmly preclinical. No human has been treated and no trial exists. And
    the model treated is the Cx32/Cx47 double knockout, which corresponds to severe PMLD1, not
    to the mild SPG44 course - so the rescue is demonstrated against a disease severity that
    SPG44 patients do not have.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    description: >-
      Restores oligodendrocyte gap-junctional connectivity directly, which is the node one step
      below the genetic lesion. Dye transfer between oligodendrocytes was re-established in
      treated animals, so the intended molecular effect was measured rather than assumed.
  evidence:
  - reference: PMID:28100454
    reference_title: "Gene therapy targeting oligodendrocytes provides therapeutic benefit in a leukodystrophy model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Application of this oligodendrocyte-targeted somatic gene therapy at postnatal Day 10 in groups of double knockout mice, a well characterized model of hypomyelinating leukodystrophy-2, resulted in significant improvement in motor performance and coordination at 1 month of age in treated compared to mock-treated mice, as well as prolonged survival."
    explanation: >-
      The preclinical rescue result, in mouse, with the treatment age stated. Graded
      MODEL_ORGANISM because it is entirely a mouse result and the entry does not represent it
      as anything else.
  - reference: PMID:25524707
    reference_title: "Transgenic replacement of Cx32 in gap junction-deficient oligodendrocytes rescues the phenotype of a hypomyelinating leukodystrophy model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study confirms that loss of oligodendrocyte GJs has cell autonomous effects and that re-establishment of GJ connectivity by replacement of least one GJ protein provides correction of the leukodystrophy phenotype."
    explanation: >-
      The genetic proof of principle that preceded the vector work, and the reason to think the
      target is correct: restoring gap-junctional connectivity by any oligodendrocytic connexin
      corrects the phenotype, so the defect is the coupling rather than Cx47 itself.
animal_models:
- name: Cx47-null mouse (Gjc2 single knockout)
  species: Mouse
  genotype: Cx47-null (Gjc2 coding DNA replaced by EGFP reporter)
  publication: PMID:12805295
  description: >-
    Germline replacement of the Cx47 coding sequence with EGFP under the endogenous promoter.
    The reporter also settled where Cx47 is expressed - predominantly oligodendrocytes in highly
    myelinated CNS tissue, correcting an earlier claim of neuronal expression.
  modeled_mechanisms:
  - target: CNS Hypomyelination and Myelin Instability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the myelin lesion at the ultrastructural level - conspicuous vacuolation of
      nerve fibres in CNS white matter, maximal in the optic nerve.
    limitations: >-
      The lesion is subclinical. It is visible by electron microscopy in an animal with no
      overt phenotype, so the model captures the myelin abnormality without the disease.
    readouts:
    - name: Myelinated fibre vacuolation on electron microscopy
      target: CNS Hypomyelination and Myelin Instability
      direction: INCREASED
      interpretation: Ultrastructural correlate of the myelin node, attributable to Cx47 loss alone.
      evidence:
      - reference: PMID:12805295
        reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Electron microscopic analysis of CNS white matter in Cx47-deficient mice revealed a conspicuous vacuolation of nerve fibers, particularly at the site of the optic nerve where axons are first contacted by oligodendrocytes and myelination starts."
        explanation: Reports the histological measurement behind this readout.
    evidence:
    - reference: PMID:12805295
      reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cx47 protein was detected by Western blot analysis after immunoprecipitation in CNS tissues of wild-type mice but not in heart or Cx47-deficient tissues."
      explanation: >-
        Supports treating this model as informative for the myelin node by establishing that it
        is a genuine protein null rather than a knockdown, which is the precondition for reading
        its myelin lesion as a Cx47 loss-of-function phenotype.
  - target: Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Cx47-null mice are fertile and show no obvious morphological or behavioural abnormality.
      The single knockout does not produce the human motor disease.
    limitations: >-
      This is a species-level difference in connexin redundancy, not a technical failure of the
      model. Mouse oligodendrocytes retain Cx32 and mouse astrocytes retain Cx30 and Cx43, and
      removing a second connexin alongside Cx47 does produce overt disease - action tremor and
      death by around 51 days in Cx32/Cx47 double nulls. Any inference from a single-connexin
      mouse to a human GJC2 patient therefore has to account for a redundancy the human does not
      obviously share, and this entry does not use the single knockout as evidence for or
      against the human motor phenotype.
    readouts:
    - name: Overt morphological and behavioural phenotype
      target: Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
      direction: UNCHANGED
      interpretation: >-
        No detectable phenotype in the single knockout - a real negative result, and the reason
        the fidelity here is LOW.
      evidence:
      - reference: PMID:12805295
        reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Homozygous mutant mice were fertile and showed no obvious morphological or behavioral abnormalities."
        explanation: >-
          Refutes the proposition that Cx47 loss alone reproduces the human motor phenotype in
          the mouse.
    evidence:
    - reference: PMID:12805295
      reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous mutant mice were fertile and showed no obvious morphological or behavioral abnormalities."
      explanation: >-
        The substantiating negative result required for a FAILS_TO_RECAPITULATE link: the model
        is not informative for the clinical motor node.
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The EGFP reporter knock-in localised Cx47 expression to oligodendrocytes in highly
      myelinated CNS tissue, which is what licenses treating an oligodendrocyte gap-junction
      defect as the cell of origin in the human disease.
    limitations: >-
      An expression measurement, not a disease measurement. It establishes where the protein is,
      not what its loss does.
    readouts:
    - name: Cell-type localisation of Cx47 expression by EGFP reporter
      target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
      interpretation: >-
        Places Cx47 in oligodendrocytes rather than neurons. `direction` is deliberately
        omitted: the measurement was made, but it is a localisation rather than an increase or
        decrease, and ModelReadoutDirectionEnum has no value for a non-directional result.
      evidence:
      - reference: PMID:12805295
        reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cx47 was mainly expressed in oligodendrocytes in highly myelinated CNS tissues and in few calcium-binding protein S100beta subunit-positive cells but not in neurons or peripheral sciatic nerve."
        explanation: Reports the expression measurement behind this readout.
    evidence:
    - reference: PMID:12805295
      reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This corrects our previous conclusion that Cx47 mRNA is expressed in brain and spinal cord neurons (Teubner et al., 2001)."
      explanation: >-
        Worth quoting for provenance: the same group is retracting its own earlier localisation,
        which is why this measurement rather than the older one should be relied on.
- name: Cx32/Cx47 double-null mouse
  species: Mouse
  genotype: Gjb1-null; Gjc2-null (Cx32/Cx47 double-deficient)
  publication: PMID:12805295
  description: >-
    Removing the second oligodendrocytic connexin alongside Cx47 converts the subclinical
    single-knockout lesion into overt, lethal white-matter disease.
  modeled_mechanisms:
  - target: CNS Hypomyelination and Myelin Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Action tremor with death at a mean of 51 days and much more abundant white-matter
      vacuolation than the single knockout.
    limitations: >-
      Two genes are removed, and the human disease involves one. The model demonstrates that
      oligodendrocytic gap-junctional coupling is what matters, but its severity and lethality
      are not the SPG44 course, which is late-onset and compatible with adult ambulation.
    readouts:
    - name: White-matter fibre vacuolation relative to single knockout
      target: CNS Hypomyelination and Myelin Instability
      direction: INCREASED
      interpretation: Dose-dependence of the myelin lesion on total oligodendrocytic connexin loss.
      evidence:
      - reference: PMID:12805295
        reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The central white matter of these double-deficient mice exhibited much more abundant vacuolation in nerve fibers than mice deficient only in Cx47."
        explanation: Reports the comparative histological measurement behind this readout.
    evidence:
    - reference: PMID:12805295
      reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Initial analyses of Cx32/Cx47-double-deficient mice showed that these mice developed an action tremor and died on average at 51 d after birth."
      explanation: Supports treating this model as informative for the myelin node, with an overt phenotype.
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The same model is the platform on which restoring gap-junctional coupling has been shown
      to correct the disease - twice, by two different routes. Transgenic oligodendrocytic
      expression of human Cx32 rescued the severe demyelinating phenotype and prevented early
      mortality; an AAV vector delivering Cx47 under the myelin basic protein promoter,
      injected once at postnatal day 10, improved motor performance and survival and
      re-established dye transfer between oligodendrocytes.
    limitations: >-
      Both rescues are in the double knockout, which is a model of severe PMLD1 rather than of
      SPG44, and both intervene at postnatal day 10 or earlier - before the human disease would
      be diagnosed. What they establish for SPG44 is that the coupling defect is correctable in
      principle and that the target is the coupling rather than Cx47 protein identity; they do
      not establish a therapeutic window for a late-onset human disease.
    readouts:
    - name: Oligodendrocyte gap-junctional dye transfer after AAV-Cx47
      target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
      direction: RESTORED
      interpretation: >-
        Direct confirmation that the intended molecular effect was achieved, not just a
        behavioural improvement.
      evidence:
      - reference: PMID:28100454
        reference_title: "Gene therapy targeting oligodendrocytes provides therapeutic benefit in a leukodystrophy model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Functional dye transfer analysis confirmed the re-establishment of oligodendrocyte gap junctional connectivity in treated as opposed to untreated mice."
        explanation: Reports the coupling measurement behind this readout.
    - name: Survival and motor performance after transgenic Cx32 replacement
      target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
      direction: RESTORED
      interpretation: >-
        Genetic rather than vector-delivered rescue, and by a different connexin - which is what
        makes the target the coupling rather than Cx47 specifically.
      evidence:
      - reference: PMID:25524707
        reference_title: "Transgenic replacement of Cx32 in gap junction-deficient oligodendrocytes rescues the phenotype of a hypomyelinating leukodystrophy model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "transgenic expression of hCx32 rescued the severe early phenotype of CNS demyelination in Cx32/Cx47dKO mice, resulting in marked improvement of behavioral abnormalities at 1 month of age, and preventing the early mortality"
        explanation: Reports the survival and behavioural rescue behind this readout.
    evidence:
    - reference: PMID:25524707
      reference_title: "Transgenic replacement of Cx32 in gap junction-deficient oligodendrocytes rescues the phenotype of a hypomyelinating leukodystrophy model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study confirms that loss of oligodendrocyte GJs has cell autonomous effects and that re-establishment of GJ connectivity by replacement of least one GJ protein provides correction of the leukodystrophy phenotype."
      explanation: >-
        Supports treating this model as informative for the coupling node in the rescue
        direction, and states the cell-autonomy conclusion that the gene-therapy strategy rests on.
- name: Cx30/Cx47 double-null mouse
  species: Mouse
  genotype: Gjb6-null; Gjc2-null (Cx30/Cx47 double-deficient)
  publication: PMID:22649229
  description: >-
    Removes the astrocytic partner connexin instead of the second oligodendrocytic one, and so
    isolates the oligodendrocyte-to-astrocyte arm of panglial coupling specifically. This is the
    closest experimental analogue of the coupling defect inferred in SPG44.
  modeled_mechanisms:
  - target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Oligodendrocyte-to-astrocyte coupling is completely disrupted while
      oligodendrocyte-to-oligodendrocyte coupling is maintained - the precise selectivity this
      node asserts for the human allele.
    limitations: >-
      A double knockout of two connexins, one of them astrocytic, standing in for a human
      hypomorphic missense allele in the oligodendrocytic connexin alone. The coupling defect is
      the shared feature; the genetic architecture is not.
    readouts:
    - name: Oligodendrocyte-to-astrocyte biocytin coupling
      target: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
      direction: ABOLISHED
      interpretation: >-
        Direct measurement of the coupling loss, with the oligodendrocyte-oligodendrocyte arm
        preserved as an internal control.
      evidence:
      - reference: PMID:22649229
        reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Biocytin injections revealed complete disruption of oligodendrocyte-to-astrocyte coupling in the white matter of 10- to 15-d-old Cx30/Cx47 double-deficient mice, while oligodendrocyte-to-oligodendrocyte coupling was maintained."
        explanation: Reports the dye-coupling measurement behind this readout.
    evidence:
    - reference: PMID:22649229
      reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "show that both connexins are required for maintenance of myelin"
      explanation: Supports treating this model as informative for the coupling node.
  - target: CNS Hypomyelination and Myelin Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Severe vacuolation and myelination defects in all CNS white-matter tracts, with reduced
      oligodendrocyte numbers, astrogliosis and microglial activation, plus motor impairment and
      early death in about 40% of animals.
    limitations: >-
      Far more severe than SPG44 and closer to PMLD1 in course. Useful as evidence that coupling
      loss causes myelin failure, not as a model of the SPG44 severity.
    readouts:
    - name: White-matter vacuolation and myelination defects
      target: CNS Hypomyelination and Myelin Instability
      direction: INCREASED
      interpretation: The myelin consequence of severed panglial coupling.
      evidence:
      - reference: PMID:22649229
        reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological and ultrastructural analyses revealed severe vacuolization and myelination defects in all white matter tracts of the CNS."
        explanation: Reports the histological measurement behind this readout.
    - name: Myelin sheath thickness in surviving adults
      target: CNS Hypomyelination and Myelin Instability
      direction: DECREASED
      interpretation: >-
        The lesion persists rather than resolving in animals that survive, which is what makes
        it a maintenance failure rather than a developmental delay.
      evidence:
      - reference: PMID:22649229
        reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Vacuole formation and thinner myelin sheaths were evident also with adult surviving double-KO mice."
        explanation: Reports the adult ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:22649229
      reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observed early onset myelin pathology, and ∼40% of Cx30/Cx47 double-deficient animals died within 42 to 90 d after birth, accompanied by severe motor impairments."
      explanation: Supports treating this model as informative for the myelin node.
discussions:
- discussion_id: spg44_same_genotype_two_diagnoses
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    One homozygous GJC2 variant produced complicated hereditary spastic paraplegia in a proband
    and full hypomyelinating leukodystrophy 2 in both of his sisters. If allele class does not
    determine which GJC2 disease a patient gets, what does?
  attaches_to:
  - genetic#GJC2
  - pathophysiology#Connexin-47 Channel Loss of Function
  - disease#Hereditary Spastic Paraplegia 44
  rationale: >-
    The tidy account of GJC2 disease is a severity ladder set by allele class: ER-retained,
    UPR-activating alleles give infantile PMLD1/HLD2; a trafficking-competent but channel-dead
    allele gives late-onset SPG44. The functional work supports that ladder well - p.I33M shows
    wild-type-like distribution and no UPR or apoptotic activation, where p.P87S, p.Y269D and
    p.M283T show ER retention and both.

    The second SPG44 family breaks it. All three affected siblings are homozygous for the same
    novel c.14G>T (p.S5I) variant, and the proband has complicated HSP while both sisters have
    HLD2. Within one sibship, one genotype, two diagnoses. Their own authors read this as
    evidence for a shared pathophysiology across the GJC2 spectrum rather than as a challenge to
    the ladder, and both readings are available from the same observation.

    This is filed as an OPEN_QUESTION rather than a KNOWLEDGE_GAP because the relevant
    measurement has not merely been omitted - it is not clear what the measurement would be.
    Modifier alleles, differences in the astrocytic connexin partners, and stochastic
    developmental factors are all live candidates, and no source cited here distinguishes them.

    A practical consequence follows, and it is recorded in the counselling treatment entry: a
    recurrence in a family with a known "mild" GJC2 allele cannot be counselled as mild.
  evidence:
  - reference: PMID:37915394
    reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical evaluation of all patients showed two distinct GJC2-related phenotypes in this family; the proband presented a complicated form of HSP, whereas both his affected sisters presented a HLD2 phenotype."
    explanation: The discordance this discussion is about, within one sibship and one genotype.
  - reference: PMID:37915394
    reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Such intrafamilial phenotypic heterogeneity for GJC2 can emphasize on the shared pathophysiology of these disorders."
    explanation: >-
      The authors' own reading of the same fact, recorded because this entry does not adjudicate
      between it and the allele-ladder reading.
  - reference: PMID:35276347
    reference_title: "Activation of the unfolded protein response by Connexin47 mutations associated with Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "three PMLD1 associated mutants (p.P87S, p.Y269D and p.M283T) show ER retention of Cx47 and evidence of activation of the cellular stress (unfolded protein response, UPR) and apoptotic pathways"
    explanation: The allele-class ladder that the intrafamilial discordance has to be reconciled with.
- discussion_id: spg44_single_connexin_mouse_redundancy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Cx47-null mice have vacuolated myelin but no overt phenotype, while humans homozygous for a
    channel-dead GJC2 allele develop progressive spastic paraplegia. Is the difference mouse
    connexin redundancy, or does the human allele do something a null does not?
  attaches_to:
  - animal_models#Cx47-null mouse (Gjc2 single knockout)
  - pathophysiology#Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
  - pathophysiology#Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
  rationale: >-
    Evidence exists in the model; what is uncertain is whether it transfers.

    Established in mouse: deleting Cx47 alone leaves animals fertile and behaviourally normal
    with a purely ultrastructural myelin lesion. Deleting Cx47 together with the second
    oligodendrocytic connexin Cx32 gives action tremor and death at around 51 days. Deleting it
    together with the astrocytic Cx30 abolishes oligodendrocyte-to-astrocyte coupling, causes
    severe vacuolation in all white-matter tracts, and kills about 40% of animals within 42-90
    days. The mouse therefore needs two connexins removed to become ill.

    Established in human: two families homozygous for GJC2 missense alleles develop
    hypomyelinating leukoencephalopathy with progressive spastic paraplegia, from a single
    connexin lesion.

    Two readings are open and this entry does not choose. Either mouse oligodendrocytes are
    protected by a Cx32 redundancy that human oligodendrocytes do not have to the same degree -
    in which case the single-knockout null result says nothing about the human disease - or the
    human missense alleles are not simple nulls and exert an effect a null cannot. The second
    reading is specifically not excluded for SPG44 by the UPR work, which ruled out the
    ER-retention and apoptosis arm but not every possible non-channel function: the founding
    report ends by saying it is not known whether I33M retains a Cx47 function unrelated to
    forming functional channels.

    Filed as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the model data exist and are
    good; the open question is their translational validity.
  evidence:
  - reference: PMID:12805295
    reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous mutant mice were fertile and showed no obvious morphological or behavioral abnormalities."
    explanation: The mismatch itself - a single-connexin null mouse with no disease.
  - reference: PMID:22649229
    reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "probably caused by the upregulation of oligodendrocytic Cx32 in Cx30/Cx47 double-deficient mice"
    explanation: >-
      Names the compensating connexin explicitly, which is what makes the redundancy reading

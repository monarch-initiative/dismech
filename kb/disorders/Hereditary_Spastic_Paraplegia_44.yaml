    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI and MR spectroscopy imaging were consistent with a hypomyelinating leukoencephalopathy."
    explanation: The human tissue-level finding, from imaging in the index family.
  - reference: PMID:12805295
    reference_title: "Connexin 47 (Cx47)-deficient mice with enhanced green fluorescent protein reporter gene reveal predominant oligodendrocytic expression of Cx47 and display vacuolized myelin in the CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Electron microscopic analysis of CNS white matter in Cx47-deficient mice revealed a conspicuous vacuolation of nerve fibers, particularly at the site of the optic nerve where axons are first contacted by oligodendrocytes and myelination starts."
    explanation: >-
      Ultrastructural myelin pathology attributable to Cx47 loss alone, in the compartment this
      node names.
- name: Corticospinal Tract Dysfunction and Progressive Spastic Paraparesis
  description: >-
    The clinical endpoint. Deficient myelination of long descending motor tracts produces a
    late-onset, slowly progressive complicated spastic paraplegia. What distinguishes it from
    the PMLD1 course is what is preserved: psychomotor development is normal or near-normal,
    walking is retained through adulthood, and nystagmus - a cardinal PMLD1 sign - is absent.
  biological_scale: ORGANISM
  downstream:
  - target: phenotypes#Progressive Spastic Paraplegia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three had a late-onset, slowly progressive, complicated spastic paraplegia, with normal or near-normal psychomotor development, preserved walking capability through adulthood, and no nystagmus."
    explanation: >-
      The complete clinical description of the founding family, including the three preserved
      features that separate SPG44 from PMLD1 at the bedside.

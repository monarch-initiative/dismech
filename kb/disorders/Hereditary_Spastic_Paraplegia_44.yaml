  proposed_experiments:
  - experiment_id: exp_spg44_knockin_vs_null_mouse
    name: Knock-in of the human SPG44 allele versus Cx47 null, on a matched background
    description: >-
      Generate a Gjc2 p.I33M knock-in mouse and compare it directly with the existing Cx47 null
      for oligodendrocyte-astrocyte biocytin coupling, myelin ultrastructure, and motor
      behaviour. A knock-in that is worse than the null would show the human allele is not a
      simple loss of function; a knock-in indistinguishable from the null would leave species
      redundancy as the explanation for the mouse-human gap.
    would_support:
    - pathophysiology#Connexin-47 Channel Loss of Function
    supporting_outcome:
    - >-
      The p.I33M knock-in phenocopies the null, with coupling loss and subclinical myelin
      vacuolation only, supporting a pure loss-of-conductance mechanism whose mildness in mouse
      reflects Cx32 redundancy.
    refuting_outcome:
    - >-
      The p.I33M knock-in is more severely affected than the null, indicating the missense
      protein exerts an effect beyond loss of channel function and that the mechanism curated
      here is incomplete.

name: Hereditary Spastic Paraplegia 44
category: Mendelian
creation_date: "2026-08-30T21:10:00Z"
synonyms:
- SPG44
- Spastic paraplegia 44, autosomal recessive
- GJC2-related hereditary spastic paraplegia
- Autosomal recessive complex spastic paraplegia caused by mutation in GJC2
- Connexin-47-related hereditary spastic paraplegia
description: >-
  SPG44 is an autosomal recessive complex hereditary spastic paraplegia caused by biallelic
  hypomorphic missense variants in GJC2, the gene encoding connexin-47 (Cx47), the gap-junction
  protein that couples oligodendrocytes to each other and to astrocytes. It was delineated in a
  single Italian family carrying homozygous p.I33M and has since been reported in a second,
  Iranian family.

  What makes this entry worth curating separately from Pelizaeus-Merzbacher-like disease 1
  (PMLD1), the severe infantile hypomyelinating leukodystrophy caused by the same gene, is that
  the two are not simply "more" and "less" of one lesion. The molecular difference has been
  measured. PMLD1 alleles such as p.P87S are retained in the endoplasmic reticulum and, in
  primary oligodendrocytes, activate the unfolded protein response and apoptotic pathways - a
  toxic gain of function on top of the channel loss. The SPG44 allele p.I33M does neither: it
  traffics normally, forms gap junction plaques at cell borders like wild-type Cx47, and shows
  no UPR or apoptotic activation. What it does lose is channel function - it fails to form
  functional homotypic channels, and the heterotypic I33M/Cx43 channels it does form open only
  under a large transjunctional voltage difference that is unlikely to occur physiologically.

  So the mechanism curated here is a comparatively clean loss of panglial coupling without the
  proteotoxic arm, and the clinical result is correspondingly milder: late onset, slowly
  progressive complicated spastic paraplegia with normal or near-normal psychomotor development,
  walking preserved into adulthood, and - diagnostically important - no nystagmus, which is a
  cardinal PMLD1 sign.

  The genotype-phenotype relationship is nevertheless not clean, and the entry says so rather
  than tidying it. In the second reported family a single homozygous GJC2 variant produced a
  complicated HSP in the proband and a full HLD2 phenotype in both of his sisters. One genotype,
  two diagnoses, one sibship. Any account of SPG44 as "the mild GJC2 allele class" has to
  survive that observation, and at present nothing explains it.

- Hereditary Spastic Paraplegia
notes: >-
  Size of the evidence base, stated plainly. Two published families. The founding report
  (PMID:19056803) describes three affected individuals from one Italian family with homozygous
  p.I33M, and pairs the clinical description with scrape-loading and dual whole-cell patch-clamp
  assays of the mutant channel - so the genetic observation is small but the functional
  characterisation is direct. The second family (PMID:37915394) is Iranian, carries a different
  homozygous variant, and is explicitly described by its authors as "the second case of SPG44".
  A third report (PMID:31431325) extends the late-onset GJC2 spectrum to ataxia, pyramidal signs
  and parkinsonism without using the SPG44 label; it is cited here as spectrum evidence, not as
  a third SPG44 family.

  Allelic relationship. SPG44 and PMLD1/HLD2 are the same gene and, on current evidence, the
  same cell-biological lesion at different severity, plus a proteotoxic arm that SPG44 lacks.
  This entry is curated as a separate disease rather than a `has_subtypes` entry on a GJC2
  parent because the KB carries numbered SPG loci as individual entries and because MONDO
  assigns SPG44 a leaf term of its own; the allelic relationship is recorded in `genetic` and in
  the discussion rather than by merging the two.

  Nomenclature correction worth recording. `kb/modules/corticospinal_tract_axonopathy.yaml`
  states that myelin-formation HSPs "SPG2/PLP1, SPG42/GJC2" belong to `cns_myelin_failure`. The
  routing is right and this entry follows it, but the locus number is wrong: GJC2 is SPG44, not
  SPG42 (SPG42 is SLC33A1). Reported separately rather than fixed inside a curation PR.

  What is deliberately not here. There is no prevalence figure, because none has been published
  for SPG44 specifically and the only honest statement is a published-case count. There is no
  treatment beyond supportive care and counselling, because neither cited source makes a
  management recommendation for this disorder, and importing general HSP management would
  attribute to SPG44 guidance written for a heterogeneous group.

  Deep research: an OpenScientist report was generated for this disease and is committed
  alongside the entry. It was used as a lead source only - every snippet below is anchored to a
  PMID fetched into `references_cache/` and read directly. Its citation record was clean (18/18
  references resolved, zero confabulation) but its *ontology* record was not: of 20 term labels
  checked, 7 named a different term than the identifier resolves to, including
  `NCIT:C61725` given as "Baclofen" when it is Diltiazem, `NCIT:C1027` as "Botulinum Toxin"
  when it is Budesonide, `NCIT:C15342` as "Physical Therapy" when it is Transplantation, and
  `UBERON:0002718` as "corticospinal / pyramidal tracts" when it is the solitary tract. None of
  those identifiers is used in this entry. The report was nonetheless materially useful: the
  preclinical gene-therapy work and the brainstem-auditory-evoked-potential discriminator below
  came from it as leads and were then verified against the primary papers.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous GJC2 missense variants in consanguineous or geographically isolated families.
    Heterozygous carriers are unaffected in both published families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe three patients from one family with a novel recessively inherited mutation, 99C>G (predicted to cause an Ile>Met amino acid substitution; I33M) that causes a milder phenotype."
    explanation: States the recessive inheritance and the founding allele in the index family.
  - reference: PMID:37915394

    snippet: "The mutant protein forms gap junction plaques at cell borders similar to wild-type (WT) Cx47 in transfected cells, but fails to form functional homotypic channels in scrape-loading and dual whole-cell patch clamp assays."
    explanation: >-
      Two orthogonal assays establish that trafficking is preserved while conductance is lost -
      the precise shape of this node's claim.
  - reference: PMID:35276347
    reference_title: "Activation of the unfolded protein response by Connexin47 mutations associated with Pelizaeus-Merzbacher-like disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the milder SPG44 associated mutation p.I33M shows a wild-type-like subcellular distribution and no activation of the UPR or apoptotic pathways"
    explanation: >-
      Supports confining this node to channel loss of function, by ruling out in primary
      oligodendrocytes the ER-retention and proteotoxic arm that the PMLD1 alleles show.
      Recorded as INDIRECT because the result is an exclusion - it establishes what the SPG44
      allele does not do, from which the narrower mechanism follows.
- name: Disrupted Oligodendrocyte-Astrocyte Panglial Coupling
  description: >-
    Cx47 is the oligodendrocyte partner in the panglial network: Cx47/Cx43 channels join
    oligodendrocytes to astrocytes, and Cx47 also contributes to oligodendrocyte-oligodendrocyte
    coupling. The SPG44 allele does form overlapping plaques and channels with Cx43, but those
    channels open only when a large voltage difference is applied across the paired cells - a
    condition the founding authors judge unlikely to be met physiologically. The functional
    result is therefore the same disruption of astrocyte-oligodendrocyte coupling that the
    ER-retained PMLD1 mutants cause, reached by a different molecular route.

    That this coupling is what matters, rather than Cx47 protein presence, is what the mouse
    genetics show: removing Cx47 alone leaves the animal essentially well, while removing Cx47
    together with the astrocytic or the second oligodendrocytic connexin abolishes
    oligodendrocyte-to-astrocyte coupling and produces overt myelin disease.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  molecular_functions:
  - preferred_term: heterotypic Cx47/Cx43 gap junction channel activity
    modifier: DECREASED
    term:
      id: GO:0005243
      label: gap junction channel activity
  downstream:
  - target: CNS Hypomyelination and Myelin Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These channels probably do not function under physiological conditions, suggesting that Cx47/Cx43 channels between astrocytes and oligodendrocytes are disrupted, similar to the loss-of-function endoplasmic reticulum-retained Cx47 mutants that cause PMLD."
    explanation: >-
      The authors' own inference from the electrophysiology, with their hedges ("probably",
      "suggesting") kept inside the quote because they carry the strength of the claim.
  - reference: PMID:22649229
    reference_title: "Panglial gap junctional communication is essential for maintenance of myelin in the CNS."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Biocytin injections revealed complete disruption of oligodendrocyte-to-astrocyte coupling in the white matter of 10- to 15-d-old Cx30/Cx47 double-deficient mice, while oligodendrocyte-to-oligodendrocyte coupling was maintained."
    explanation: >-
      Demonstrates directly that losing Cx47 in combination severs the oligodendrocyte-astrocyte
      arm specifically. INDIRECT because the mouse genotype is a double knockout, not the human
      hypomorphic missense state.
- name: CNS Hypomyelination and Myelin Instability
  description: >-
    Loss of panglial coupling leaves the CNS myelin sheath deficient. In the SPG44 family, brain
    MRI and MR spectroscopy were consistent with a hypomyelinating leukoencephalopathy - the
    same imaging class as PMLD1, at lower severity. In mice, the corresponding lesion is
    vacuolation of myelinated fibres, most conspicuous in the optic nerve where oligodendrocytes
    first contact axons, and it worsens sharply when a second connexin is removed.
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: central nervous system myelination
    modifier: DECREASED
    term:
      id: GO:0022010
      label: central nervous system myelination
  downstream:

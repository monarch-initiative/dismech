genetic:
- name: GJC2
  notes: >-
    Encodes connexin-47 (Cx47), the oligodendrocyte gap-junction protein that pairs with
    astrocytic Cx43 and contributes to oligodendrocyte-oligodendrocyte coupling. The gene is
    also written GJA12 in the older literature, including in the title of the founding SPG44
    report.

    The allelic series is the point of interest and is unusually well characterised at the
    protein level. Severe PMLD1/HLD2 alleles (p.P87S, p.Y269D, p.M283T) are retained in the ER
    and trigger the UPR and apoptosis in primary oligodendrocytes. The SPG44 allele p.I33M
    traffics normally and triggers neither, losing only channel function. Two different failure
    modes of one protein, with the milder disease corresponding to the allele that lacks the
    proteotoxic arm.

    That correspondence is real but not deterministic. In the second SPG44 family, one
    homozygous variant produced complicated HSP in the proband and HLD2 in both sisters, so
    allele class alone does not fix the phenotype.

    One further allelic association is worth flagging so a reader searching the gene does not
    conflate it with this disease: separate GJC2 variants are associated with autosomal
    dominant hereditary lymphedema, acting on lymphatic endothelium rather than
    oligodendrocytes. That is a different inheritance pattern, a different tissue and a
    different mechanism, and it is not part of the SPG44 phenotype. It is recorded as a
    curator's note rather than as an evidence-backed claim, because no source cited in this
    entry establishes it.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GJC2
    term:
      id: hgnc:17494
      label: GJC2
  evidence:
  - reference: PMID:19056803
    reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, GJA12/GJC2 mutations can result in a milder phenotype than previously appreciated"
    explanation: >-
      The authors' own summary of the gene-disease relationship. Deliberately cut at the comma:
      the rest of that sentence is an in-vitro statement about what the I33M protein may still
      do, which is a different claim with a different evidence source, and it is quoted
      separately in the model-mismatch discussion.
  variants:
  - name: c.99C>G (p.I33M)
    description: >-
      Homozygous missense variant in the founding Italian family. Traffics and forms plaques
      like wild-type Cx47 but is channel-dead as a homotypic channel; heterotypic I33M/Cx43
      channels open only at large transjunctional voltages.
    evidence:
    - reference: PMID:19056803
      reference_title: "Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "I33M forms overlapping gap junction plaques and functional channels with Cx43, however, I33M/Cx43 channels open only when a large voltage difference is applied to paired cells."
      explanation: The electrophysiological characterisation of the founding allele.
  - name: c.14G>T (p.S5I)
    description: >-
      Novel homozygous missense variant in the second, Iranian family, co-segregating with
      disease. The proband had complicated HSP; two sisters homozygous for the same variant had
      HLD2.
    evidence:
    - reference: PMID:37915394
      reference_title: "Description of Phenotypic Heterogeneity in a GJC2-Related Family and Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel homozygous variant, c.G14T:p.Ser5Ile, in the GJC2 gene was identified. The variant was co-segregated with the disease status in the family members."
      explanation: Identifies the second family's allele and its co-segregation.

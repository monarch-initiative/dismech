- name: AAV-Delivered Adenine Base Editing
  therapeutic_modality: GENE_EDITING
  description: 'Preclinical adenine base editing of p.Arg75Trp restored neurobiotin transfer in an engineered HeLa model and improved gap-junction plaque morphology in mouse cochlear supporting cells. The study used P0 cochlear explants and intracochlear delivery to adult transgenic mice aged 9–30 weeks, with morphology assessed two weeks later. In HeLa cells, 46.8% on-target editing included bystander changes; 28.03% reads were corrected without bystanders. Adult plaque improvement does not establish auditory rescue: baseline ABR characterized the model, but no post-treatment hearing-rescue result was reported. Functional treatment windows, durability, delivery and editing safety remain unresolved.'
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Dominant-Negative Impairment of Connexin 26 Channels
    description: Correction of the human p.Arg75Trp transgene improved plaque architecture in supporting cells. This does not demonstrate restored cochlear conductance or hearing.
    evidence:
    - reference: PMID:40059830
      reference_title: AAV-mediated base editing restores cochlear gap junction in GJB2 dominant-negative mutation-associated syndromic hearing loss model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: In a transgenic mouse model with the GJB2 R75W mutation, AAV-mediated base editing also restored the fragmented GJPs to orderly outlines in cochlear supporting cells.
      explanation: Plaque morphology is structural evidence; channel function was tested in HeLa cells, not directly in the treated cochlea.
      directness: INDIRECT
      quote_role: PRIMARY_RESULT

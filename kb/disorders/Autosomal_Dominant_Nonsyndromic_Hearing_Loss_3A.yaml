    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, W44C dramatically inhibited intercellular conductance of HCx26wt when
      co-expressed in an equal ratio, and the low levels of residual conductance
      displayed altered gating properties.
    explanation: >-
      The primary experimental result: a dominant allele degrades wild-type channel
      function when the two are co-expressed.
  - reference: PMID:12064630
    reference_title: Functional analysis of a dominant mutation of human connexin26 associated with nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A nonfunctional recessive mutation (W77R) did not inhibit the ability of HCx26wt
      to form functional channels when co-injected in the same oocyte pairs, nor did it
      alter HCx26wt gating.
    explanation: >-
      The specificity control. Without it the W44C result would be consistent with any
      nonfunctional allele being dominant; with it, dominance is a property of the
      particular allele rather than of losing function.
  - reference: PMID:16009703
    reference_title: Mechanism of the defect in gap-junctional communication by expression of a connexin 26 mutant associated with dominant deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that Cx26 R75W forms gap-junctional hemichannels that display
      altered voltage dependency and reduced permeability, and which cannot form
      functional gap-junctional channels between neighboring cells.
    explanation: >-
      Locates the defect at the docking step: hemichannels form, junctions do not.
  - reference: PMID:16009703
    reference_title: Mechanism of the defect in gap-junctional communication by expression of a connexin 26 mutant associated with dominant deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The R75W phenotype is dominant at the gap-junction channel but not at the
      hemichannel level.
    explanation: >-
      States the dissociation explicitly, which is what separates this mechanism from
      the hyperactive-hemichannel mechanism of the syndromic connexin 26 disorders.
  - reference: PMID:22547955
    reference_title: GJB2 Gene Mutations in Syndromic Skin Diseases with Sensorineural Hearing Loss.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Nonsyndromic deafness is caused prevalently by a loss-of-function, while
      literature evidences suggest for syndromic deafness a mechanism based on
      gain-of-function.
    explanation: >-
      The review's statement of the same dichotomy at the level of the whole locus.
      INDIRECT because it is an expert summary of the literature rather than a result,
      and because "loss of function" is a coarser description than the docking defect
      the primary work localises.

name: Autosomal Dominant Nonsyndromic Hearing Loss 3A
creation_date: "2026-08-29T17:50:00Z"
category: Mendelian
description: >-
  Autosomal dominant nonsyndromic hearing loss 3A (DFNA3A) is sensorineural hearing
  loss caused by a heterozygous variant in GJB2, the gene encoding the gap-junction
  protein connexin 26. It is the dominant counterpart of DFNB1, the recessive
  GJB2-related hearing loss that is the single commonest genetic cause of congenital
  deafness worldwide - and the contrast between the two is the whole point of curating
  it separately.

  DFNB1 is a dosage disease: two loss-of-function alleles leave too little functional
  connexin 26 and the channel simply is not made. DFNA3A is not. A single mutant
  allele produces a subunit that is still made and still assembles, and connexin 26
  hexamerises into a connexon before that connexon docks with its partner on the
  neighbouring cell - so one mutant subunit is incorporated into channels that also
  contain wild-type subunits and degrades them. The founding functional study
  demonstrated this directly and, importantly, included the control that makes the
  claim specific: a nonfunctional *recessive* allele co-expressed the same way left
  wild-type channels untouched. Loss of function and dominant negative are therefore
  different mechanisms at the same locus, not two descriptions of one.

  Connexin 26 is expressed at high levels in the supporting cells of the human
  cochlea, where the gap-junction network is understood to recycle potassium away from
  hair cells back toward the stria vascularis. Degrading that network - by a net loss
  of coupling, by altered channel gating, or both - is what produces the hearing loss.

  Two cautions are curated explicitly rather than left implicit. First, GJB2 alleles
  reported as dominant have been retracted on re-examination: the M34T (101T>C) allele
  was described as a DFNA3 allele and then shown not to be sufficient to cause hearing
  loss, and that refutation is curated as a REFUTE evidence item rather than omitted.
  Second, dominant GJB2 variants more often cause *syndromic* disease - keratitis-
  ichthyosis-deafness syndrome, Vohwinkel syndrome, palmoplantar keratoderma with
  deafness - and this entry is the nonsyndromic form only. A dominant GJB2 pedigree
  with skin involvement is a different entry.

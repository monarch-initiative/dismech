- name: Loss of Cochlear Supporting-Cell Coupling
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Connexin 26 is expressed at high levels in the human cochlea, where the non-sensory
    supporting cells of the organ of Corti are coupled into a gap-junction network.
    Degrading the channels degrades that network.

    What is transmitted through it is not only current. A knock-in mouse carrying the
    deafness-associated connexin 30 T5M mutation - a paralogue of connexin 26 that
    co-assembles with it in the same cells - separates the two kinds of coupling
    cleanly: electrical coupling measured by dual patch clamp was normal, while
    transfer of a fluorescent tracer and intercellular calcium signalling were both
    reduced, and the mice were deaf. Biochemical coupling can therefore fail on its own
    and produce hearing loss. The classic account of connexin deafness as a potassium
    recycling problem is at best incomplete.

    PROVISIONAL rather than ESTABLISHED because the dominant-negative demonstrations
    are in heterologous cells and the biochemical-coupling result is in a different
    gene's mouse; no coupling measurement has been made in a DFNA3A cochlea.

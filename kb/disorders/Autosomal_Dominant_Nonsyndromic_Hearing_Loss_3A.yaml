inheritance:
- name: Autosomal dominant
  description: 'Specific pathogenic heterozygous GJB2 alleles cause dominant hearing loss. A single arbitrary GJB2 variant does not establish DFNA3A: recessive carrier alleles and variants of uncertain significance require different interpretation. De novo cases occur. A heterozygous affected parent has a 50% chance of transmitting the dominant allele; parental testing and phenotype assessment inform recurrence counseling.'

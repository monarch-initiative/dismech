- name: Abnormal Organ of Corti Maturation
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: Human p.Arg75Trp transgenic mice show supporting-cell deformation, absent tunnel of Corti and Nuel space, reduced inner-pillar-cell microtubules and severe-to-profound hearing loss. The original report established two independent transgenic lines; later studies extend this allele/model system rather than establish the lesion in human DFNA3A. Sensory-cell development was preserved at P5–P12, and isolated outer hair cells retained nonlinear capacitance despite absent otoacoustic emissions. This supports a contribution from the supporting-cell environment, without proving that every dominant human allele causes the same developmental defect.
  cell_types:
  - preferred_term: organ of Corti supporting cell
    term:
      id: CL:0002490
      label: organ of Corti supporting cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We established two lines of transgenic mice that showed severe to profound hearing loss, deformity of supporting cells, failure in the formation of the tunnel of Corti and degeneration of sensory hair cells.
    explanation: The founding in vivo result for this node, in a mouse carrying a human dominant-negative allele.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:18793701
    reference_title: Postnatal development of the organ of Corti in dominant-negative Gjb2 transgenic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Histological observations at postnatal days (P) 5-14 were characterized by i) absence of tunnel of Corti, Nuel's space, or spaces surrounding the outer hair cells
    explanation: Times the defect to postnatal development and specifies the architectural failure.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:18793701
    reference_title: Postnatal development of the organ of Corti in dominant-negative Gjb2 transgenic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: On the other hand, the development of the sensory hair cells, at least from P5 to P12, was not affected.
    explanation: Time-bounded preservation of sensory-cell development at P5–P12 supports temporal ordering in this mouse model, not lifelong normality or human histopathology.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:19712724
    reference_title: Cochlear outer hair cells in a dominant-negative connexin26 mutant mouse preserve non-linear capacitance in spite of impaired distortion product otoacoustic emission.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The present study indicates that normal development of the supporting cells is indispensable for proper cellular function of the OHC.
    explanation: 'States the dependency this node asserts: intact hair cells cannot function inside a malformed scaffold.'
    quote_role: PRIMARY_RESULT
    directness: DIRECT

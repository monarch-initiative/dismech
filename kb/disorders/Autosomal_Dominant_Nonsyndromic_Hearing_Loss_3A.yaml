      levels of expression.
    explanation: >-
      Places the protein in the tissue the disease affects, in human material.
  - reference: PMID:20858605
    reference_title: The human deafness-associated connexin 30 T5M mutation causes mild hearing loss and reduces biochemical coupling among cochlear non-sensory cells in knock-in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the developing cochlea, electrical coupling, probed by dual patch-clamp
      recordings, was normal. However, transfer of the fluorescent tracer calcein
      between cochlear non-sensory cells was reduced, as was intercellular Ca(2+)
      signalling due to spontaneous ATP release from connexin hemichannels.
    explanation: >-
      Dissociates biochemical from electrical coupling and shows the biochemical arm is
      sufficient for hearing loss. INDIRECT: the mutation is in connexin 30, not
      connexin 26, so the inference to DFNA3A rests on the two proteins sharing the same
      cells and channels.
  - reference: PMID:25625422
    reference_title: "Keratitis-ichthyosis-deafness syndrome-associated Cx26 mutants produce nonfunctional gap junctions but hyperactive hemichannels when co-expressed with wild type Cx43."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Gap junction channels (GJCs) allow metabolic and electrical coupling between
      adjacent cells and are formed by the oligomerization of connexin (Cx) protein
      subunits.
    explanation: >-
      States what the network being lost actually carries - metabolic as well as
      electrical coupling. INDIRECT: general connexin biology from a paper about
      syndromic mutants.

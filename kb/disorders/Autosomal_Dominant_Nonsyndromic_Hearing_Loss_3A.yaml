    reference_title: Functional analysis of a dominant mutation of human connexin26 associated with nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Moreover, W44C dramatically inhibited intercellular conductance of HCx26wt when co-expressed in an equal ratio, and the low levels of residual conductance displayed altered gating properties.
    explanation: Direct co-expression evidence of functional dominant inhibition by p.Trp44Cys; protein degradation was not measured.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:12064630
    reference_title: Functional analysis of a dominant mutation of human connexin26 associated with nonsyndromic deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: A nonfunctional recessive mutation (W77R) did not inhibit the ability of HCx26wt to form functional channels when co-injected in the same oocyte pairs, nor did it alter HCx26wt gating.
    explanation: The specificity control. Without it the W44C result would be consistent with any nonfunctional allele being dominant; with it, dominance is a property of the particular allele rather than of losing function.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:16009703
    reference_title: Mechanism of the defect in gap-junctional communication by expression of a connexin 26 mutant associated with dominant deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here, we show that Cx26 R75W forms gap-junctional hemichannels that display altered voltage dependency and reduced permeability, and which cannot form functional gap-junctional channels between neighboring cells.
    explanation: Hemichannel formation persists while functional intercellular channels fail. The result supports a junctional defect but does not uniquely distinguish physical docking from all gating or permeability mechanisms.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:16009703
    reference_title: Mechanism of the defect in gap-junctional communication by expression of a connexin 26 mutant associated with dominant deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The R75W phenotype is dominant at the gap-junction channel but not at the hemichannel level.
    explanation: The dominant effect differs between hemichannels and intercellular channels for p.Arg75Trp; this is not a universal distinction between all syndromic and nonsyndromic variants.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

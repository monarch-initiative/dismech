- name: Impaired Cochlear Supporting-Cell Coupling
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: Reduced gap-junction communication in cochlear supporting cells is a proposed tissue consequence of allele-specific connexin 26 dysfunction. Human cochlear expression supplies anatomical context, while dominant inhibition is measured mainly in heterologous cells. A separate Gjb6/Cx30 T5M homozygous knock-in model had approximately 15-dB hearing loss, normal electrical coupling in developing cochlea and reduced calcein transfer and calcium signaling. Connexin 26 and 30 abundance was also reduced, so that model does not isolate biochemical coupling as the sole cause or directly establish the DFNA3A mechanism.

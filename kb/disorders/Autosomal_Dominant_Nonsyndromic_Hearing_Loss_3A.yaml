  title: curation results for Gene-Disease Validity
notes: 'DFNA3A retains its MONDO-defined nonsyndromic scope; DFNA3B denotes GJB6 and DFNB1A denotes recessive GJB2 disease. Dominant GJB2 validity and individual variant interpretation are distinct: ClinGen lumps dominant hearing loss with or without skin disease, whereas this entry describes the nonsyndromic presentation. The p.Met34Thr founding dominant attribution is not used as positive clinical evidence. Published family audiograms and progression observations exist, but do not yield population prevalence or penetrance estimates.

  ClinicalTrials.gov was checked on 2026-09-23. Human GJB2 gene therapy is no longer absent: SONIX (NCT07627971), a recruiting phase 1/2 SKY-GJB2 study, requires biallelic pathogenic/likely pathogenic variants and explicitly excludes autosomal dominant nonsyndromic GJB2 hearing loss. The DFNB1A/DFNB9 natural-history study NCT05402813 is also scoped to recessive disease in its title. Neither is represented here as a DFNA3A treatment or trial opportunity. The reviewed sources did not identify a DFNA3A-specific clinical intervention trial.'
mechanistic_hypotheses:
- hypothesis_group_id: dfna3a_cortilymph_hypothesis
  description: Impaired supporting-cell coupling may disturb cortilymph potassium and contribute to hair-cell injury. Neither cortilymph potassium nor the complete causal sequence was measured directly.
differential_diagnoses:
- name: GJB2-related autosomal recessive nonsyndromic hearing loss
  description: Biallelic pathogenic GJB2 variants support DFNB1A. An isolated recessive carrier allele or VUS does not diagnose DFNA3A. p.Met34Thr and p.Val37Ile require recessive interpretation; their penetrance is incomplete.
  evidence:
  - reference: PMID:31160754
    reference_title: Consensus interpretation of the p.Met34Thr and p.Val37Ile variants in GJB2 by the ClinGen Hearing Loss Expert Panel.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We concluded that p.Met34Thr and p.Val37Ile variants in GJB2 are pathogenic for autosomal recessive nonsyndromic hearing loss with variable expressivity and incomplete penetrance.
    explanation: Current expert-panel interpretation resolves the earlier dominant attribution. This does not refute GJB2 as a gene for dominant hearing loss.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: https://www.ncbi.nlm.nih.gov/sites/books/NBK1272/?report=reader
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NSHL is established in a proband with suggestive findings and biallelic ... pathogenic variants identified by molecular genetic testing.
    explanation: Recessive diagnostic criterion, not the dominant criterion.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
- name: Dominant GJB2 disorders with skin involvement
  description: Assess skin, nails and eyes for palmoplantar keratoderma, Vohwinkel, Bart-Pumphrey or KID-spectrum disease. Allelic overlap explains syndromic and nonsyndromic p.Arg75Trp reports without requiring that one report be wrong. p.Met34Lys trafficking experiments concern syndromic disease; a proposed trans c.35delG severity effect is not an established DFNA3A modifier.
  evidence:
  - reference: PMID:11354642
    reference_title: De novo mutation of the connexin 26 gene associated with dominant non-syndromic sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: R75 W has been previously observed in association with hearing impairment and keratoderma in one family and is thus thought to cause both syndromic and non-syndromic hearing loss.
    explanation: Human allelic overlap supports clinical assessment beyond hearing.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:33443819
    reference_title: Palmoplantar keratoderma with deafness phenotypic variability in a patient with an inherited GJB2 frameshift variant and novel missense variant.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Additionally, the Met34Lys mutant acted dominantly to wildtype Cx26, restricting its delivery to the cell surface.
    explanation: Rat epidermal keratinocyte trafficking result in a syndromic case with a second truncating allele; not evidence for a universal DFNA3A mechanism.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT

- name: Cortilymph Potassium Homeostasis Disruption
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Where the potassium story actually lives in this disease, and it is not where the
    textbook account puts it. The dominant-negative mouse sustains a normal endolymphatic
    resting potential and has a structurally normal stria vascularis, so the lesion is
    not a failure to generate the endocochlear potential. What the authors propose
    instead is disturbed homeostasis of cortilymph, the extracellular space immediately
    around the hair cells, from impaired potassium transport by the supporting cells
    themselves.

    This entry originally modelled the step as endolymphatic potassium recycling, which
    is the standard account of GJB2 deafness; the mouse data say that compartment is
    intact. The node is kept PROVISIONAL because the cortilymph account is the
    authors' inference from a preserved endocochlear potential plus a degenerating
    organ of Corti, not a direct measurement of cortilymph potassium.
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that the GJB2 mutation disturbs homeostasis of cortilymph,
      an extracellular space surrounding the sensory hair cells, due to impaired K(+)
      transport by supporting cells, resulting in degradation of the organ of Corti,
      rather than affecting endolymph homeostasis in mice and probably in humans.
    explanation: >-
      The authors' own localisation of the potassium defect to cortilymph and away from
      endolymph.
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The high resting potential in cochlear endolymph essential for hair cell
      excitation was normally sustained.
    explanation: >-
      Curated as REFUTE against the claim that this disease works by failure of the
      endocochlear potential. The measurement is a normal result, and it is the reason
      this node is about cortilymph rather than endolymph.

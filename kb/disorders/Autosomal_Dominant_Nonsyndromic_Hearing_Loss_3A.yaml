      recessive form of non-syndromic hearing loss (NSHL) at the DFNB1 locus and
      autosomal dominant NSHL at the DFNA3 locus.
    explanation: >-
      States both inheritance modes at the locus, which is what makes DFNA3A a distinct
      entity rather than a description of DFNB1.
pathophysiology:
- name: Heterozygous GJB2 Variant Producing an Assembly-Competent Mutant Subunit
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining lesion. A single GJB2 allele carries a variant whose product is still
    synthesised and still able to enter connexon assembly. That is the necessary
    condition for dominance at this locus: an allele that produced nothing would leave
    the wild-type allele's channels alone and give an unaffected carrier, which is what
    the great majority of GJB2 alleles do. The alleles this entry curates - W44C, D46N,
    R75W - all sit in or near the first extracellular loop, and the Vohwinkel D66H
    allele cited below is in the same domain, whose authors propose it acts on
    oligomerisation, docking or gating. Whether dominant alleles cluster there as a
    general rule is asserted in the secondary literature but is not curated here: the
    deep-research report's lead citation for that claim is the one reference its own
    relevance check flagged as off topic, and no better source was found.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  genetic_context:
    genes:
    - preferred_term: GJB2
      term:
        id: hgnc:4284
        label: GJB2
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      Recorded as DOMINANT_NEGATIVE on the strength of the co-expression experiments
      curated on the next node. Not every dominant GJB2 allele need act by the same
      route - the 299-300delAT allele truncates the protein, and M34K acts by being
      retained in the endoplasmic reticulum and holding wild-type connexin 26 back with
      it, which is dominance by a trafficking mechanism rather than by poisoning an
      assembled channel. The category is asserted for the mechanism that has been
      demonstrated, not for every allele in the entry.
  evidence:
  - reference: PMID:9139825
    reference_title: Connexin 26 mutations in hereditary non-syndromic sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we study a pedigree containing cases of autosomal dominant deafness and have
      identified a mutation in the gene encoding the gap-junction protein connexin 26
      (Cx26) that segregates with the profound deafness in the family.
    explanation: >-
      Establishes the gene and the heterozygous state in the founding pedigree.
  - reference: PMID:21484990
    reference_title: Two Iranian families with a novel mutation in GJB2 causing autosomal dominant nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the over 100 described GJB2 mutations cause ARNSHL. Only a minority has
      been associated with autosomal dominant hearing loss.
    explanation: >-
      Quantifies how unusual dominance is at this locus, which is the point of the
      assembly-competence requirement this node states.
  - reference: PMID:12768774
    reference_title: "[Mutations in the connexin 26 gene in patients with nonsyndromic hearing impairment]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous deletion AT at position 299-300 of Cx26 cDNA, which results in
      premature chain termination, was found in a pedigree with autosomal dominant
      hereditary nonsyndromic hearing loss.
    explanation: >-
      An independent dominant pedigree at the same locus, and the reason the
      genetic_context note above is hedged: this allele is a truncation, not a missense.
  - reference: PMID:33443819
    reference_title: Palmoplantar keratoderma with deafness phenotypic variability in a patient with an inherited GJB2 frameshift variant and novel missense variant.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, the Met34Lys mutant acted dominantly to wildtype Cx26, restricting
      its delivery to the cell surface.
    explanation: >-
      Documents a second, distinct route to dominance at this locus - endoplasmic
      reticulum retention that drags the wild-type protein with it. INDIRECT because
      the allele was found in a syndromic patient, so it bears on the mechanism
      available to dominant GJB2 alleles rather than on DFNA3A itself.
  downstream:
  - target: Dominant-Negative Degradation of Connexin 26 Channels
    causal_link_type: DIRECT
    description: >-
      Because connexin 26 hexamerises into a connexon before that connexon docks with
      its partner, a mutant subunit that is made and can oligomerise ends up inside
      channels built largely of wild-type subunits.
- name: Dominant-Negative Degradation of Connexin 26 Channels
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Co-expression of the dominant W44C mutant with wild-type connexin 26 at an equal
    ratio dramatically reduced intercellular conductance, and what conductance remained
    gated abnormally. The control is what makes this a mechanism rather than an
    observation: a nonfunctional *recessive* allele, W77R, co-expressed the same way,
    neither reduced wild-type channel formation nor altered gating. So the recessive
    allele is inert toward its wild-type partner and the dominant one is not, at the
    same locus and in the same assay.

    Work on a second dominant allele, R75W, localises the defect more precisely, and
    the result is not what a naive poison-subunit model predicts. R75W subunits do form
    hemichannels - with altered voltage dependence and reduced permeability - but those
    hemichannels cannot dock into functional gap-junction channels with the cell next
    door. The dominance is therefore a property of the docking step, not of hemichannel
    assembly. That distinction matters for therapy: it separates this disease from the
    syndromic connexin 26 disorders, where the pathology is attributed to hemichannels
    that are too active rather than to junctions that fail to form.

- name: Proposed Cortilymph Potassium Homeostasis Disruption
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: Impaired supporting-cell potassium handling could disturb the extracellular cortilymph surrounding hair cells. This was proposed from p.Arg75Trp mouse findings, not measured directly. Normal endolymphatic resting potential and preserved strial structure constrain an endocochlear-potential-loss account but neither measure cortilymph potassium nor establish that every aspect of endolymph homeostasis is normal.
  biological_processes:
  - preferred_term: potassium ion transmembrane transport
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  evidence:
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These results suggest that the GJB2 mutation disturbs homeostasis of cortilymph, an extracellular space surrounding the sensory hair cells, due to impaired K(+) transport by supporting cells, resulting in degradation of the organ of Corti, rather than affecting endolymph homeostasis in mice and probably in humans.
    explanation: The authors propose impaired cortilymph potassium homeostasis. This inference is retained as a hypothesis, not a potassium measurement.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: The high resting potential in cochlear endolymph essential for hair cell excitation was normally sustained.
    explanation: Normal endolymphatic potential does not directly support or refute cortilymph potassium disturbance. The two compartments and measurements are distinct.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  downstream:
  - target: Secondary Sensory Hair Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - dfna3a_cortilymph_hypothesis

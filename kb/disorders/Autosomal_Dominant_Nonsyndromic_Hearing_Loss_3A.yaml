    evidence_source: IN_VITRO
    snippet: >-
      Cx26 has been implicated in dominant (DFNA3) and recessive (DFNB1) forms of
      nonsyndromic sensorineural deafness.
    explanation: >-
      Names the phenotype and its dominant form. The item is graded IN_VITRO because
      the paper is a functional study; the sentence is its framing of the clinical
      entity rather than a clinical observation of its own, which is why it is not the
      only support for this phenotype.
  - reference: PMID:21484990
    reference_title: Two Iranian families with a novel mutation in GJB2 causing autosomal dominant nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we present two families with autosomal dominant nonsyndromic
      hearing loss caused by a novel mutation in GJB2 (p.Asp46Asn).
    explanation: >-
      Human observation of the defining phenotype in two independent dominant families.
  - reference: PMID:9139825
    reference_title: Connexin 26 mutations in hereditary non-syndromic sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we study a pedigree containing cases of autosomal dominant deafness and have
      identified a mutation in the gene encoding the gap-junction protein connexin 26
      (Cx26) that segregates with the profound deafness in the family.
    explanation: >-
      The founding human pedigree, cited here so the disease-defining phenotype does not
      rest on a functional paper's background sentence.
- category: Auditory
  name: Profound Hearing Loss in the Founding Pedigree
  frequency: OCCASIONAL
  description: >-
    The pedigree in which dominant GJB2 deafness was first identified had profound
    hearing loss. Recorded as OCCASIONAL rather than as the typical severity because a
    single founding pedigree cannot establish the distribution, and other dominant GJB2
    families are reported as less severe.
  phenotype_term:
    preferred_term: Profound sensorineural hearing impairment
    term:
      id: HP:0011476
      label: Profound sensorineural hearing impairment
  evidence:
  - reference: PMID:9139825
    reference_title: Connexin 26 mutations in hereditary non-syndromic sensorineural deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified a mutation in the gene encoding the gap-junction protein connexin 26
      (Cx26) that segregates with the profound deafness in the family
    explanation: >-
      Records the severity in that specific family, which is all this item claims.
- category: Constitutional
  name: Absence of Systemic or Cutaneous Features
  frequency: OBLIGATE
  description: >-
    Nonsyndromic by definition. This is a curation-relevant negative rather than a
    finding: dominant GJB2 variants more often produce syndromic disease - keratitis-
    ichthyosis-deafness syndrome, Vohwinkel syndrome, palmoplantar keratoderma with
    deafness - and skin, eye or nail involvement moves the patient out of this entry
    and into one of those.
  evidence:
  - reference: PMID:10369869
    reference_title: A missense mutation in connexin26, D66H, causes mutilating keratoderma with sensorineural deafness (Vohwinkel's syndrome) in three unrelated families.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results provide evidence that a specific mutation in Cx26 can impair
      epidermal differentiation, as well as inner ear function.
    explanation: >-
      Establishes the syndromic alternative that this entry is being distinguished
      from. INDIRECT because it supports the boundary of the entry rather than a
      feature within it.
genetic:
- name: GJB2
  gene_term:
    preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  relationship_type: CAUSATIVE
  notes: >-
    One gene, two diseases, two mechanisms. The same locus carries DFNB1 (biallelic
    loss of function, common) and DFNA3A (a single dominant-acting allele, rare), and
    it also carries the dominant syndromic connexin 26 disorders. Which entry a
    GJB2-positive patient belongs to is decided by zygosity and by the presence or
    absence of extra-auditory features, not by the gene.

    Two named alleles are worth knowing. W44C is the allele in which the
    dominant-negative mechanism was demonstrated. M34T (101T>C) is the cautionary one:
    reported as a DFNA3 allele and subsequently shown not to be sufficient to cause
    hearing loss, with the refutation curated below.
  evidence:
  - reference: PMID:12522692
    reference_title: "Connexin26 gene ( GJB2): prevalence of mutations in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The connexin26 gene ( GJB2) has been shown to be responsible for DFNB1 and DFNA3
      (Autosomal Recessive Hereditary Nonsyndromic Deafness Locus 1 and Autosomal
      Dominant Hereditary Nonsyndromic Deafness Locus 3).
    explanation: >-
      States the two-locus, one-gene relationship that the entry's boundary rests on.
  - reference: PMID:21484990
    reference_title: Two Iranian families with a novel mutation in GJB2 causing autosomal dominant nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both families were ascertained from the same village in northern Iran consistent
      with a founder effect.
    explanation: >-
      Records that regional founder alleles occur even within this rare dominant subset,
      which bears on how a testing strategy should be scoped geographically.
  - reference: PMID:9529365
    reference_title: Novel mutations in the connexin 26 gene (GJB2) that cause autosomal recessive (DFNB1) hearing loss.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that 101T-->C is not sufficient to cause hearing loss.
    explanation: >-
      Refutes the assignment of the M34T allele to DFNA3A. Curated as REFUTE rather
      than omitted because the claim it refutes is in the literature and a curator
      matching a patient's M34T result to this entry would otherwise repeat the error.
  - reference: PMID:9529365
    reference_title: Novel mutations in the connexin 26 gene (GJB2) that cause autosomal recessive (DFNB1) hearing loss.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This allele was found in a recessive family segregating independently from the
      hearing-loss phenotype and in 3 of 192 control chromosomes.
    explanation: >-
      The observation behind the refutation: the allele fails to segregate and appears
      in controls.
- name: GJB2 c.35delG in trans
  gene_term:
    preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  relationship_type: MODIFIER
  notes: >-
    A loss-of-function GJB2 allele inherited in trans with a dominant-acting one is not
    a second cause but a severity modifier, and it is worth knowing about because it
    breaks the tidy zygosity rule that otherwise separates this entry from DFNB1: the
    patient is heterozygous for the dominant allele and simultaneously a compound
    heterozygote at the locus. Reported for a syndromic dominant allele rather than a
    DFNA3A one, so this entry records the mechanism rather than asserting it happens
    here.
  evidence:
  - reference: PMID:33443819
    reference_title: Palmoplantar keratoderma with deafness phenotypic variability in a patient with an inherited GJB2 frameshift variant and novel missense variant.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of a loss a function variant on the other allele creates a more
      severe clinical phenotype, with some features reminiscent of KID syndrome.
    explanation: >-
      Documents a trans loss-of-function allele worsening a dominant GJB2 phenotype.
      INDIRECT because the reported patient has syndromic disease, not DFNA3A.
diagnosis:
- name: Audiometry
  description: >-
    Pure-tone audiometry establishes the sensorineural hearing loss and its severity.
    It cannot distinguish DFNA3A from DFNB1 or from any other nonsyndromic cause; that
    requires the pedigree and the genotype.
  diagnosis_term:
    preferred_term: audiometric test
    term:
      id: NCIT:C38036
      label: Audiometric Test
  evidence:
  - reference: PMID:20301449
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      In countries where available, newborn hearing screening (NBHS) typically
      identifies severe-to-profound hearing loss.
    explanation: >-
      Describes how GJB2-related hearing loss reaches medical attention. INDIRECT: the
      GeneReviews chapter covers the recessive form, and is cited here for the
      audiological pathway the two forms share.
- name: Molecular Genetic Testing of GJB2
  description: >-
    GJB2 sequencing is already the first-line genetic test for nonsyndromic hearing
    loss. What assigns DFNA3A is not finding a GJB2 variant but finding a single one
    that segregates dominantly - so the interpretation, not the assay, is what
    distinguishes this entry, and a heterozygous GJB2 variant in a sporadic case is far
    more likely to be carrier status for DFNB1.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22695344
    reference_title: The spectrum of GJB2 mutations in the Iranian population with non-syndromic hearing loss--a twelve year study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 2322 deaf probands presenting the ethnically diverse Iranian
      population were screened for variants in GJB2.
    explanation: >-
      Shows GJB2 screening as the routine first-line test in deaf probands, which is the
      context in which a dominant allele is found.
treatments:
- name: Hearing Aid Amplification
  therapeutic_modality: DEVICE
  description: >-
    Amplification for mild-to-moderate loss, the first-line intervention where residual
    hearing can be usefully amplified. Split from cochlear implantation because they are
    different devices for different degrees of loss, and DFNA3A spans both. Both are
    bound to the generic Therapeutic Procedure action term: NCIT:C183182 Hearing Aid and
    NCIT:C157820 Cochlear Implant name the *devices* and are not reachable from
    NCIT:C25218 Clinical Intervention or Procedure, so they fail the TreatmentActionTerm
    dynamic enum. The device distinction is carried by therapeutic_modality and by the
    treatment names instead.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:20301449
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Children with mild-to-moderate hearing loss can be treated with hearing aids
      customized to the child's age and severity of hearing loss.
    explanation: >-
      Gives the indication for amplification in GJB2-related hearing loss. INDIRECT: the
      chapter covers the recessive form, and the recommendation is carried over on the
      basis that the cochlear lesion is the same.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  description: >-
    Management is auditory habilitation, as for nonsyndromic hearing loss generally:
    hearing aids for mild-to-moderate loss, cochlear implantation for severe-to-profound
    loss. Nothing addresses the connexin defect. Outcomes in GJB2-related hearing loss
    are good because the lesion is cochlear and the auditory nerve is intact.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:20301449
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Because children with severe-to-profound hearing loss who are candidates for
      cochlear implantation can attain levels of social functioning and education
      indistinguishable from those of normal-hearing peers, cochlear implantation
      should be performed as soon as possible.
    explanation: >-
      Gives the management standard for GJB2-related hearing loss. INDIRECT: the
      chapter addresses the recessive form, and the recommendation is carried over on
      the basis that the cochlear lesion and the implant candidacy are the same.
- name: AAV-Delivered Adenine Base Editing
  therapeutic_modality: GENE_EDITING
  description: >-
    The most advanced experimental approach aimed at the actual lesion, and the one
    whose logic fits this disease best. R75W is a single C-to-T substitution, so an
    adenine base editor can revert it; an all-in-one AAV carrying a compact editor and
    a guide corrected the mutation and restored the fragmented gap-junction plaques to
    orderly outlines in cochlear supporting cells of a R75W transgenic mouse.

    Two limits on reading this as a therapy for DFNA3A. It is preclinical - no human
    GJB2 gene-therapy trial exists - and the mouse it was tested in is described by
    that paper as a model of *syndromic* R75W disease with palmoplantar keratoderma,
    while the paper that created the same allele's mouse describes the human family as
    nonsyndromic. Restoring plaque morphology is also not the same as restoring
    hearing, and the timing problem is unaddressed: the lesion here is a developmental
    failure of the organ of Corti, so an editor delivered after that window may find
    nothing left to rescue.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Dominant-Negative Degradation of Connexin 26 Channels
    description: >-
      Reverting the mutant base removes the poison subunit, so channels assembled from
      the remaining wild-type protein can dock normally again.
    evidence:
    - reference: PMID:40059830
      reference_title: AAV-mediated base editing restores cochlear gap junction in GJB2 dominant-negative mutation-associated syndromic hearing loss model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In a transgenic mouse model with the GJB2 R75W mutation, AAV-mediated base
        editing also restored the fragmented GJPs to orderly outlines in cochlear
        supporting cells.
      explanation: >-
        Shows the intervention acts on the structure this link targets - the gap
        junction plaques in the supporting cells.
  evidence:
  - reference: PMID:40059830
    reference_title: AAV-mediated base editing restores cochlear gap junction in GJB2 dominant-negative mutation-associated syndromic hearing loss model.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings suggest that an ABE-based base-editing strategy could be an optimal
      treatment for the dominant form of GJB2-related hearing loss, GJB2-related skin
      diseases, and other deafness-related mutations, especially single-base
      substitutions.
    explanation: >-
      The authors' own framing of the approach's scope. INDIRECT because it is a
      forward-looking claim about a preclinical result, and because the model is
      described there as syndromic.
- name: Allele-Specific Small Interfering RNA
  therapeutic_modality: SIRNA
  description: >-
    Curated as an emerging strategy with a mechanistic rationale specific to this class
    of disease, not as an available treatment. A dominant-negative allele is the ideal
    target for allele-selective silencing, because removing the mutant transcript
    restores the wild-type allele's channels rather than merely halving an already
    reduced dose - which is precisely why this approach would not help DFNB1. Proof of
    concept exists in patient keratinocytes for the dominant GJB2 allele that causes
    keratitis-ichthyosis-deafness syndrome. It has not been attempted for a DFNA3A
    allele, and delivery to the cochlear supporting-cell network is unaddressed.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31705875
    reference_title: Allele-Specific Small Interfering RNA Corrects Aberrant Cellular Phenotype in Keratitis-Ichthyosis-Deafness Syndrome Keratinocytes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro treatment with allele-specific small interfering RNA led to robust
      inhibition of the mutant GJB2 allele without altering expression of the wild-type
      allele.
    explanation: >-
      Demonstrates selective knockdown of a mutant GJB2 allele, which is the mechanism
      this treatment entry proposes. INDIRECT on two counts: the allele is a syndromic
      one and the cells are keratinocytes, not cochlear.
animal_models:
- name: R75W dominant-negative connexin 26 transgenic mouse
  species: Mouse
  genotype: Transgenic for human GJB2 carrying the R75W dominant-negative allele
  publication: PMID:12700168
  description: >-
    The workhorse model for dominant GJB2 disease, created because Gjb2 knockout mice
    are embryonic lethal and so cannot be used to study hearing. Two independent lines
    were established. Note that later work on the same allele describes it as causing
    syndromic disease with palmoplantar keratoderma, while the founding paper describes
    the human family as nonsyndromic - so its status as a DFNA3A model rests on the
    original clinical description.
  modeled_mechanisms:
  - target: Failure of Organ of Corti Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces the developmental supporting-cell lesion in detail - absent
      tunnel of Corti and Nuel's space, too few microtubules in inner pillar cells, a
      short organ of Corti - and profound deafness from birth.
    limitations: >-
      A transgene expressing the mutant allele from a non-native promoter is not the
      same as one mutant allele expressed from its own locus alongside a wild-type
      partner, so the mutant-to-wild-type ratio is not physiological. The human disease
      is also not uniformly congenital and profound, whereas the mouse never shows an
      auditory brainstem response at any age.
    readouts:
    - name: Organ of Corti architecture at P5-P14
      target: Failure of Organ of Corti Maturation
      direction: ALTERED
      interpretation: >-
        Absent tunnel of Corti, Nuel's space and peri-outer-hair-cell spaces on
        postnatal histology.
      evidence:
      - reference: PMID:18793701
        reference_title: Postnatal development of the organ of Corti in dominant-negative Gjb2 transgenic mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Histological observations at postnatal days (P) 5-14 were characterized by i)
          absence of tunnel of Corti, Nuel's space, or spaces surrounding the outer hair
          cells
        explanation: >-
          The histological measurement behind this readout.
    - name: Distortion product otoacoustic emissions
      target: Failure of Organ of Corti Maturation
      direction: ABOLISHED
      interpretation: >-
        Outer hair cell function is absent in vivo despite structurally and
        electromotively normal outer hair cells, which is the functional signature of
        scaffold failure rather than of hair cell disease.
      evidence:
      - reference: PMID:19712724
        reference_title: Cochlear outer hair cells in a dominant-negative connexin26 mutant mouse preserve non-linear capacitance in spite of impaired distortion product otoacoustic emission.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          No detectable distortion product otoacoustic emissions were observed at any
          frequencies in R75W transgenic mice throughout development.
        explanation: >-
          Reports the absent emissions across development.
    evidence:
    - reference: PMID:12700168
      reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We established two lines of transgenic mice that showed severe to profound
        hearing loss, deformity of supporting cells, failure in the formation of the
        tunnel of Corti and degeneration of sensory hair cells.
      explanation: >-
        Supports treating this mouse as informative for the organ of Corti maturation
        node.
  - target: Cortilymph Potassium Homeostasis Disruption
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      Recorded as a failure to recapitulate the *endolymphatic* potassium lesion that
      the standard account of GJB2 deafness predicts. The mouse sustains a normal
      endocochlear potential and has a structurally normal stria vascularis, so it does
      not reproduce that mechanism - which is precisely its value, since it is what
      relocated the potassium defect to cortilymph.
    limitations: >-
      The negative is a mouse negative. Species differences in cochlear connexin
      expression are real, and the authors themselves hedge the extrapolation to
      humans. The cortilymph account that replaces it was not measured directly either;
      it is inferred from a preserved endocochlear potential together with a
      degenerating organ of Corti.
    readouts:
    - name: Endocochlear resting potential
      target: Cortilymph Potassium Homeostasis Disruption
      direction: UNCHANGED
      interpretation: >-
        Normal endolymphatic resting potential, so the endocochlear potential is not the
        failing step.
      evidence:
      - reference: PMID:12700168
        reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The high resting potential in cochlear endolymph essential for hair cell
          excitation was normally sustained.
        explanation: >-
          The measurement itself, reported as normal.
    evidence:
    - reference: PMID:12700168
      reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Despite robust expression of the transgene, no obvious structural change was
        observed in the stria vascularis or spiral ligament that is rich in connexin26
        and generates the endolymph.
      explanation: >-
        Supports the negative claim: the compartment that generates endolymph is
        structurally spared despite the transgene being expressed there.
discussions:
- discussion_id: dfna3a_dominant_allele_mechanism_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do all DFNA3A alleles act by dominant negative interference, or do some act by
    another route?
  attaches_to:
  - pathophysiology#Heterozygous GJB2 Variant Producing an Assembly-Competent Mutant Subunit
  - pathophysiology#Dominant-Negative Degradation of Connexin 26 Channels
  rationale: >-
    The dominant-negative mechanism is demonstrated for W44C and assumed for the rest.
    That assumption is uncomfortable for at least one reported dominant allele: the
    299-300delAT frameshift truncates the protein, and a truncated subunit is a poor
    candidate for poisoning a hexamer it may never join. Alternative routes are
    available in principle - haploinsufficiency at a dosage-sensitive step, or aberrant
    hemichannel activity of the kind demonstrated for the syndromic alleles. The
    distinction is not academic: allele-selective silencing, curated above as a
    treatment, works only against a dominant-negative or gain-of-function allele and
    would make a haploinsufficiency allele worse.
- discussion_id: dfna3a_coupling_never_measured_in_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is loss of supporting-cell coupling the step that fails in DFNA3A, given that
    coupling has never been measured in a cochlea carrying a DFNA3A allele?
  attaches_to:
  - pathophysiology#Loss of Cochlear Supporting-Cell Coupling
  - pathophysiology#Cortilymph Potassium Homeostasis Disruption
  rationale: >-
    Three model systems each supply a different piece and none supplies the whole. The
    dominant-negative effect is measured in Xenopus oocytes and HeLa cells at
    experimenter-chosen expression ratios, in a system containing only connexin 26 -
    whereas cochlear supporting cells co-express connexin 30, with which connexin 26
    forms heteromeric channels. The dissociation of biochemical from electrical
    coupling is measured in a connexin 30 knock-in mouse, a different gene. The
    developmental scaffold failure is measured in a connexin 26 transgenic mouse that
    over-expresses the mutant from a non-native promoter. So coupling itself has never
    been measured in a system carrying a DFNA3A genotype at native stoichiometry.

    This is a mismatch rather than an absence of evidence: each result is clean, and
    each was generated in a system that omits the feature the next one shows to matter.
  proposed_experiments:
  - experiment_id: dfna3a_cx26_cx30_coexpression
    name: Dominant allele co-expressed with connexin 30 at native ratios
    description: >-
      Repeat the co-expression conductance and dye-transfer assays with wild-type
      connexin 26, a DFNA3A allele, and connexin 30 together, at expression ratios
      measured from cochlear supporting cells rather than chosen by the experimenter,
      and read out biochemical as well as electrical coupling.
    would_support:
    - pathophysiology#Loss of Cochlear Supporting-Cell Coupling
    supporting_outcome:
    - >-
      Coupling is still substantially reduced when connexin 30 is present at native
      ratios, so the effect survives the condition that most plausibly rescues it.
    would_refute:
    - pathophysiology#Loss of Cochlear Supporting-Cell Coupling
    refuting_outcome:
    - >-
      Connexin 30 compensates and coupling is near normal, in which case the deafness
      requires a mechanism other than lost coupling - most likely the altered docking
      and gating already visible in the R75W hemichannel work.
- discussion_id: dfna3a_developmental_window_for_therapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is there a post-natal window in which correcting the GJB2 allele could still
    restore hearing, or is the organ of Corti already malformed by then?
  attaches_to:
  - pathophysiology#Failure of Organ of Corti Maturation
  - treatments#AAV-Delivered Adenine Base Editing
  rationale: >-
    The base-editing result restores gap junction plaque morphology in supporting
    cells, but the lesion this entry models is a failure of the organ of Corti to form
    in the first place - absent tunnel of Corti, absent Nuel's space - which is
    complete by around P14 in the mouse. Restoring the protein after the scaffold has
    failed to develop may restore the junctions without restoring hearing, and no
    hearing outcome has been reported for the edited animals. The gap is the single
    most consequential unknown for whether this class of therapy can work in this
    disease, and it is a different question from whether the editing is efficient.

  notes: Interpret GJB2 at the allele level. Dominant nonsyndromic cases include p.Trp44Cys, p.Arg75Trp and p.Asp46Asn; the latter families share a founder haplotype and are not independent variant observations. p.Arg75Trp and p.Arg75Gln can present with or without cutaneous manifestations. p.Met34Thr is pathogenic for recessive hearing loss with variable expressivity and incomplete penetrance, not an established DFNA3A allele. A historical dominant-family report of c.299_300delAT does not by itself establish dominant causation or haploinsufficiency for a truncating allele.
  evidence:
  - reference: PMID:21484990
    reference_title: Two Iranian families with a novel mutation in GJB2 causing autosomal dominant nonsyndromic hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, we present two families with autosomal dominant nonsyndromic hearing loss caused by a novel mutation in GJB2 (p.Asp46Asn).
    explanation: Segregation evidence from founder-related families; this does not measure oligomerization or dominant inhibition.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:11354642
    reference_title: De novo mutation of the connexin 26 gene associated with dominant non-syndromic sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We have identified the first de novo mutation of the Cx26 gene, R75 W, in a sporadic case of isolated profound hearing loss.
    explanation: A reported de novo p.Arg75Trp case supports dominant isolated hearing loss. The same allele can occur with skin disease.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

animal_models:
- name: R75W dominant-negative connexin 26 transgenic mouse
  species: Mouse
  genotype: Transgenic for human GJB2 carrying the R75W dominant-negative allele
  publication: PMID:12700168
  description: Two p.Arg75Trp transgenic lines in the original report developed severe-to-profound hearing loss with supporting-cell abnormalities and hair-cell degeneration. Later studies characterized postnatal development and outer-hair-cell physiology. The allele occurs in both syndromic and nonsyndromic human disease. Endolymphatic resting potential was preserved, but cortilymph potassium was not directly measured.
  modeled_mechanisms:
  - target: Abnormal Organ of Corti Maturation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reproduces supporting-cell abnormalities and early auditory dysfunction in a human-variant transgenic mouse.
    limitations: Species, non-native promoter, unestablished physiological mutant-to-wild-type ratio and allele specificity limit transfer to human DFNA3A. The clinical spectrum is not uniformly congenital or profound; auditory absence at every possible age is not established.
    readouts:
    - name: Organ of Corti architecture at P5-P14
      target: Abnormal Organ of Corti Maturation
      direction: ALTERED
      interpretation: Absent tunnel of Corti, Nuel's space and peri-outer-hair-cell spaces on postnatal histology.
      evidence:
      - reference: PMID:18793701
        reference_title: Postnatal development of the organ of Corti in dominant-negative Gjb2 transgenic mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Histological observations at postnatal days (P) 5-14 were characterized by i) absence of tunnel of Corti, Nuel's space, or spaces surrounding the outer hair cells
        explanation: The histological measurement behind this readout.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    - name: Distortion product otoacoustic emissions
      target: Abnormal Organ of Corti Maturation
      direction: ABOLISHED
      interpretation: Absent emissions indicate impaired cochlear amplification in vivo; they are not a direct assay of hair-cell death or a unique marker of supporting-cell scaffold failure.
      evidence:
      - reference: PMID:19712724
        reference_title: Cochlear outer hair cells in a dominant-negative connexin26 mutant mouse preserve non-linear capacitance in spite of impaired distortion product otoacoustic emission.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: No detectable distortion product otoacoustic emissions were observed at any frequencies in R75W transgenic mice throughout development.
        explanation: Reports the absent emissions across development.
        quote_role: PRIMARY_RESULT
        directness: DIRECT
    evidence:
    - reference: PMID:12700168
      reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We established two lines of transgenic mice that showed severe to profound hearing loss, deformity of supporting cells, failure in the formation of the tunnel of Corti and degeneration of sensory hair cells.
      explanation: Supports treating this mouse as informative for the organ of Corti maturation node.
      quote_role: PRIMARY_RESULT
      directness: DIRECT
  evidence:
  - reference: PMID:12700168
    reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The high resting potential in cochlear endolymph essential for hair cell excitation was normally sustained.
    explanation: A measured feature of this model is normal endolymphatic resting potential. It does not directly measure cortilymph potassium.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
discussions:
- discussion_id: dfna3a_dominant_allele_mechanism_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: Do all DFNA3A alleles act by dominant negative interference, or do some act by another route?
  attaches_to:
  - pathophysiology#Heterozygous Dominant-Acting GJB2 Variant
  - pathophysiology#Dominant-Negative Impairment of Connexin 26 Channels
  rationale: Dominant inhibition is demonstrated for p.Trp44Cys and p.Arg75Trp; p.Asp46Asn has segregation evidence without a functional assay in the original report. A historical c.299_300delAT dominant-family observation does not establish a truncation-based dominant mechanism. Syndromic p.Met34Lys trafficking and KID hemichannel results show allelic diversity but cannot be imported as proven DFNA3A routes.
- discussion_id: dfna3a_coupling_never_measured_in_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: How do variant-specific channel defects translate into human cochlear dysfunction?
  attaches_to:
  - pathophysiology#Impaired Cochlear Supporting-Cell Coupling
  - pathophysiology#Proposed Cortilymph Potassium Homeostasis Disruption
  rationale: Heterologous conductance assays, Gjb6 T5M biochemical-coupling data and p.Arg75Trp transgenic developmental histology describe different systems. None supplies direct human DFNA3A supporting-cell coupling or cortilymph potassium measurements. The 2025 editing study measures functional rescue in HeLa cells and plaque morphology in cochlea, which should be kept distinct.
  proposed_experiments:
  - experiment_id: dfna3a_cx26_cx30_coexpression
    name: Dominant allele co-expressed with connexin 30 at native ratios
    description: Repeat the co-expression conductance and dye-transfer assays with wild-type connexin 26, a DFNA3A allele, and connexin 30 together, at expression ratios measured from cochlear supporting cells rather than chosen by the experimenter, and read out biochemical as well as electrical coupling.
    would_support:
    - pathophysiology#Impaired Cochlear Supporting-Cell Coupling
    supporting_outcome:
    - Coupling is still substantially reduced when connexin 30 is present at native ratios, so the effect survives the condition that most plausibly rescues it.
    would_refute:
    - pathophysiology#Impaired Cochlear Supporting-Cell Coupling
    refuting_outcome:
    - Normal electrical and biochemical coupling for a tested allele would weaken this specific coupling hypothesis; it would not exclude defects in development, unmeasured channel selectivity or other alleles.
- discussion_id: dfna3a_developmental_window_for_therapy
  kind: KNOWLEDGE_GAP
  prompt: Is there a post-natal window in which correcting the GJB2 allele could still restore hearing, or is the organ of Corti already malformed by then?
  attaches_to:
  - pathophysiology#Abnormal Organ of Corti Maturation
  - treatments#AAV-Delivered Adenine Base Editing
  rationale: Base editing improved adult mouse plaque morphology but did not report post-treatment auditory rescue. A much earlier siRNA experiment prevented acute plasmid-induced hearing impairment in adult mice. Neither result establishes the timing, durability or reversibility of the inherited developmental lesion. Longitudinal auditory and structural outcomes are needed in clinically relevant allele models.

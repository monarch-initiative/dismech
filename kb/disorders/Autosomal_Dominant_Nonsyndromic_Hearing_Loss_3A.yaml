- name: Experimental GJB2 Transcript Silencing
  therapeutic_modality: SIRNA
  description: An early proof-of-concept co-delivered human GJB2 p.Arg75Trp plasmid and siRNA to adult mouse round windows, reduced transgene RNA by more than 70% and attenuated the acute ABR threshold shift at 72 hours. Selectivity exploited two human–mouse sequence mismatches; the siRNA also silenced endogenous human GJB2 in cultured cells. This was transient prevention of experimentally induced hearing loss, not reversal of an established inherited lesion or demonstrated mutant-versus-wild-type discrimination in humans. Separately, p.Asp50Asn-selective siRNA improved channel phenotypes in patient-derived KID keratinocytes; that is a different allele and tissue. Durable cochlear delivery, human allele selectivity and safety require further study.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:15857852
    reference_title: In vitro and in vivo suppression of GJB2 expression by RNA interference.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: In a mouse model, this siRNA duplex selectively suppressed GJB2(R75W) expression by >70% of control levels, thereby preventing hearing loss.
    explanation: Full-paper methods and discussion show acute co-delivery and human–mouse sequence discrimination. This is not established human allele-specific therapy.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:31705875
    reference_title: Allele-Specific Small Interfering RNA Corrects Aberrant Cellular Phenotype in Keratitis-Ichthyosis-Deafness Syndrome Keratinocytes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: In vitro treatment with allele-specific small interfering RNA led to robust inhibition of the mutant GJB2 allele without altering expression of the wild-type allele.
    explanation: 'Demonstrates selective knockdown of a mutant GJB2 allele, which is the mechanism this treatment entry proposes. INDIRECT on two counts: the allele is a syndromic one and the cells are keratinocytes, not cochlear.'
    quote_role: PRIMARY_RESULT

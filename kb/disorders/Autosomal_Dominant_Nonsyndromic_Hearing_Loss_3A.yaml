    reference_title: Connexin 26 mutations in hereditary non-syndromic sensorineural deafness.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: Immunohistochemical staining of human cochlear cells for Cx26 demonstrated high levels of expression.
    explanation: Human cochlear expression is anatomical context; it does not demonstrate reduced coupling in DFNA3A.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:20858605
    reference_title: The human deafness-associated connexin 30 T5M mutation causes mild hearing loss and reduces biochemical coupling among cochlear non-sensory cells in knock-in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: In the developing cochlea, electrical coupling, probed by dual patch-clamp recordings, was normal. However, transfer of the fluorescent tracer calcein between cochlear non-sensory cells was reduced, as was intercellular Ca(2+) signalling due to spontaneous ATP release from connexin hemichannels.
    explanation: Indirect context from homozygous Gjb6 T5M mice with mild hearing loss and reduced connexin expression. Normal electrical coupling in developing tissue does not prove biochemical coupling is the sole causal defect.
    quote_role: PRIMARY_RESULT
  - reference: PMID:25625422
    reference_title: Keratitis-ichthyosis-deafness syndrome-associated Cx26 mutants produce nonfunctional gap junctions but hyperactive hemichannels when co-expressed with wild type Cx43.
    supports: NO_EVIDENCE
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: Gap junction channels (GJCs) allow metabolic and electrical coupling between adjacent cells and are formed by the oligomerization of connexin (Cx) protein subunits.
    explanation: General channel biology from a KID-syndrome study; not evidence of impaired coupling in DFNA3A.
    quote_role: BACKGROUND

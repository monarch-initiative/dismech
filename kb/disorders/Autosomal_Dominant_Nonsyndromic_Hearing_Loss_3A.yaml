- name: Failure of Organ of Corti Maturation
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    The step this entry would have missed without the mouse. Transgenic mice expressing
    the dominant-negative R75W connexin 26 allele are severely to profoundly deaf, and
    the lesion is a *developmental* failure of the supporting-cell scaffold: the tunnel
    of Corti, Nuel's space and the spaces around the outer hair cells never form, inner
    pillar cells have too few microtubules, and the organ of Corti is short and its
    cells are enlarged in cross-section.

    Graded PROVISIONAL rather than ESTABLISHED despite three converging papers, because
    those three papers share authorship, one transgenic line and one allele, at an
    expression ratio the model's own limitations concede is non-physiological, with no
    human histopathology anywhere. Convergent within a lab is not independent.

    Two negatives make this the primary lesion rather than a consequence. The outer
    hair cells themselves develop normally, keep their subsurface cisternae and their
    prestin, and show normal electromotility in isolation - yet distortion-product
    otoacoustic emissions are absent at every frequency, because the compressed
    supporting-cell architecture will not let them work in situ. And the stria
    vascularis is structurally normal.

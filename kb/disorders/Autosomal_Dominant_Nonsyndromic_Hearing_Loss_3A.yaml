notes: >-
  Lump/split decision. DFNA3A is curated as its own Disease entry rather than as a
  has_subtypes entry on a GJB2 or nonsyndromic-hearing-loss parent. It holds its own
  MONDO term, and the mechanism is genuinely different from the recessive form at the
  same locus rather than a milder or more severe version of it: DFNB1 is biallelic loss
  of function, DFNA3A is a single allele acting on its wild-type partner. The KB already
  curates the dominant *syndromic* connexin 26 disorders separately
  (Keratoderma_Hereditarium_Mutilans) and carries GJB2-GJB6_Digenic_Nonsyndromic_Hearing_Loss;
  this entry completes the set with the dominant nonsyndromic form.

  Naming. MONDO's label is "autosomal dominant nonsyndromic hearing loss 3A" and the
  entry uses it. DFNA3 was later split into DFNA3A (GJB2) and DFNA3B (GJB6); older
  literature says only "DFNA3" and the reader has to infer the gene. Every source cited
  here that says DFNA3 is doing so about GJB2, which is why the synonyms retain the
  unsuffixed forms.

  A correction worth recording, because the first draft of this entry had it wrong. The
  standard account of GJB2 deafness is failure of endolymphatic potassium recycling and
  the endocochlear potential, and this entry was originally modelled that way. The
  dominant-negative mouse says otherwise: the endocochlear potential is normally
  sustained and the stria vascularis is structurally intact, while the organ of Corti
  fails to form its tunnel and its extracellular spaces. The potassium node was
  therefore relocated to cortilymph - the space immediately around the hair cells - and
  the normal endocochlear potential is curated as a REFUTE item against the endolymph
  account rather than quietly dropped. The primary lesion in this entry is now a
  developmental failure of the supporting-cell scaffold, with hair cell loss downstream
  of it.

  Evidence base and its limits, stated plainly. There is no DFNA3A cohort, no
  audiological series, no natural history and no prevalence estimate - so there is no
  prevalence block, and the frequency values on the phenotypes are structural (OBLIGATE
  for the defining feature) rather than measured. The human evidence is a handful of
  pedigrees. Everything mechanistic is model-system evidence, and the three systems do
  not overlap: heterologous expression for the channel defect, a connexin 30 knock-in
  mouse for the biochemical-coupling dissociation, and a connexin 26 transgenic mouse
  for the developmental lesion. The two nodes where no measurement exists at a DFNA3A
  genotype are PROVISIONAL, and the mismatch is filed as a discussion rather than
  papered over. Several items are graded IN_VITRO or MODEL_ORGANISM where a reader might
  expect HUMAN_CLINICAL: that is deliberate and follows the KB rule that evidence_source
  describes the cited study.

  A disagreement in the literature, left standing rather than resolved. The R75W allele
  is the one most of the mechanistic work in this entry uses. Kudo and colleagues
  identified it in a family with autosomal dominant *nonsyndromic* deafness and titled
  their paper accordingly; the 2025 base-editing paper working on the same allele calls
  it a cause of *syndromic* hearing loss with palmoplantar keratoderma. Both statements
  are curated where they appear rather than one being suppressed, and the animal model's
  description says so, because the disagreement bears directly on whether the R75W mouse
  is a model of this entry or of a neighbouring one.

  Named-entity-confusion check. Four traps at this locus. DFNA3A (GJB2) is not DFNA3B
  (GJB6). DFNA3A is not DFNB1, though the gene is the same. Dominant GJB2 disease is
  more often syndromic than not, so a dominant GJB2 pedigree is not automatically
  DFNA3A. And M34T/101T>C appears in the literature as a DFNA3 allele but was shown not
  to be sufficient to cause hearing loss; that refutation is curated rather than
  silently dropped, precisely so the retracted assignment is not re-imported by a future
  curator reading the older paper.

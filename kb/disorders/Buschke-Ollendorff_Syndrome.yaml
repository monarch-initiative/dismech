classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: DERMATOLOGY
  mechanistic_category:
  - classification_value: laminopathy
    notes: >-
      LEMD3/MAN1 is an integral protein of the inner nuclear membrane rather than a
      lamin itself, but MONDO classifies Buschke-Ollendorff syndrome under
      MONDO:0021106 laminopathy on the strength of the nuclear-envelope lesion, and
      the disorder is discussed with the nuclear envelopathies in the laminopathy
      literature.
  isds_skeletal_category:
  - classification_value: osteosclerotic_disorders
    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2023 revision
      (Unger et al., PMID:36779427), group 25 "Osteosclerotic disorders", which
      covers non-osteopetrotic increased bone mass and lists osteopoikilosis and
      melorheostosis (LEMD3, MAP2K1). Assigned by the enum key rather than the group
      number, which is not stable across revisions.
inheritance:
- name: Autosomal Dominant
  description: >-
    A single heterozygous loss-of-function LEMD3 allele is sufficient. Transmission
    is vertical, family history is the rule, and each child of an affected person has
    a 50% risk of inheriting the variant. Penetrance of the *syndrome* is hard to
    call complete because the two components are ascertained differently: a carrier
    with radiographically silent skin and no reason for an x-ray may look unaffected.
    Expressivity within a family is emphatically variable - relatives carrying the
    identical variant may have nevi alone, osteopoikilosis alone, or both - and no
    genotype-phenotype correlation has been established.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant OPK and BOS feature widespread foci of osteosclerotic trabeculae without or with skin lesions, respectively."
    explanation: States the autosomal dominant inheritance of both osteopoikilosis and Buschke-Ollendorff syndrome.
  - reference: PMID:19438932
    reference_title: "Novel and recurrent germline LEMD3 mutations causing Buschke-Ollendorff syndrome and osteopoikilosis but not isolated melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results further expand the LEMD3 mutation repertoire, corroborate the extreme interfamilial and intrafamilial clinical variability of LEMD3 mutations, and underline the lack of a clear phenotype-genotype correlation in BOS."
    explanation: Directly supports variable expressivity within and between families and the absence of a genotype-phenotype correlation.
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the fathers of probands 2 and 6 and the mother of proband 1, who all carry the same mutation as their offspring, did not present with BOS-related skin lesions upon physical examination."
    explanation: >-
      Three obligate carriers in this series carried the proband's LEMD3 variant with
      no cutaneous manifestation, which is the clearest available demonstration that
      the skin component is not fully penetrant within a family.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  notes: >-
    The frequently repeated figure is approximately 1 in 20,000, i.e. 5 per 100,000.
    It is recorded here as measure_type UNKNOWN rather than as an incidence or a point
    prevalence: the source states it as an "estimated incidence" but supplies neither a
    denominator population nor an observation period, and it traces back through the
    case-series literature rather than to a registry. Ascertainment is certainly
    incomplete in both directions - osteopoikilosis is asymptomatic and found
    incidentally, and the cutaneous nevi are easily dismissed as unremarkable papules -
    so the true figure could lie either side. No population-based BOS prevalence study
    was identified.
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "initially described by Buschke and Ollendorff in 1928, is a rare autosomal dominant genetic disease with an estimated incidence of 1 in 20,000"
    explanation: >-
      Source of the 1-in-20,000 figure. The paper cites it to earlier literature rather
      than deriving it, which is why the measure type is left UNKNOWN here.
- population: Published Buschke-Ollendorff syndrome case reports (systematic review of 164 cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2016 systematic review recovered 164 reported cases from 48 publications with no
    date or language restriction, which bounds the size of the published literature
    rather than the size of the affected population.
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 594 reports were discovered, of which 546 (92%) were excluded. The remaining 48 accounted for 164 cases."
    explanation: Quantifies the entire published case literature for this disorder as of 2016.
has_subtypes:
- name: Complete BOS
  display_name: Complete Buschke-Ollendorff syndrome (nevi plus osteopoikilosis)
  description: >-
    The full syndromic presentation: connective tissue nevi together with radiographic
    osteopoikilosis in the same individual. This was just over half of the cases in the
    2016 systematic review.
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin lesions were noted in 24% of cases and bony lesions in 20%, while 54% of patients had both."
    explanation: >-
      Partitions reported BOS cases into skin-only, bone-only, and complete forms, and
      is the quantitative basis for treating the three as recognised presentations of
      one allelic disorder rather than as distinct diseases.
- name: Skin-Limited BOS
  display_name: Skin-limited Buschke-Ollendorff syndrome (connective tissue nevi without osteopoikilosis)
  description: >-
    Connective tissue nevi in a member of an LEMD3 kindred with no osteopoikilosis on
    radiographs. Some of this is genuine tissue-restricted expression and some is
    age-related: osteopoikilotic foci may not be radiographically apparent in early
    childhood, so a negative film in a young child does not settle the question.
  evidence:
  - reference: PMID:11298556
    reference_title: "The Buschke-Ollendorff syndrome presenting as familial elastic tissue naevi."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a family with Buschke-Ollendorff syndrome presenting as elastic tissue naevi without evidence of osteopoikilosis."
    explanation: A whole family expressing the cutaneous component with no radiographic bone component.
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proband 3 and proband 5 had an X-ray examination of pelvis but did not exhibit any signs of OPK."
    explanation: Two LEMD3-variant probands with cutaneous disease and negative pelvic radiographs.
- name: Bone-Limited BOS
  display_name: Bone-limited expression (isolated osteopoikilosis in an LEMD3 kindred)
  subtype_term:
    preferred_term: isolated osteopoikilosis
    term:
      id: MONDO:0015634
      label: isolated osteopoikilosis
  description: >-
    Radiographic osteopoikilosis with no connective tissue nevus, in a carrier of the
    family's LEMD3 variant. This is the same allelic disorder expressed in one tissue
    only, and it is how most silent carriers come to attention. The MONDO binding names
    the concept accurately but is a cross-reference rather than a claim that BOS
    subsumes sporadic isolated osteopoikilosis as an independent entity: MONDO places
    MONDO:0015634 under osteopoikilosis, not under Buschke-Ollendorff syndrome.
  genes:
  - preferred_term: LEMD3
    term:
      id: hgnc:28887
      label: LEMD3
  evidence:
  - reference: PMID:16470551
    reference_title: "Germline LEMD3 mutations are rare in sporadic patients with isolated melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that loss-of-function mutations in the LEMD3 gene can result in either osteopoikilosis or BOS."
    explanation: >-
      States that the same class of LEMD3 loss-of-function allele produces either the
      bone-only phenotype or the full syndrome, which is what makes bone-limited
      expression a subtype rather than a separate disease.
- name: BOS with Melorheostosis
  display_name: Buschke-Ollendorff syndrome with melorheostosis-like segmental hyperostosis
  subtype_term:
    preferred_term: melorheostosis with osteopoikilosis
    term:
      id: MONDO:0015995
      label: melorheostosis with osteopoikilosis
  description: >-
    A minority of LEMD3 kindreds contain an individual with a large asymmetric area of
    dense cortical bone read as melorheostosis, superimposed on the symmetric
    osteopoikilotic foci. What converts one segment is unknown: no somatic second hit
    in LEMD3 has ever been demonstrated in such lesions. Distinguish this from sporadic
    isolated melorheostosis, which is a different disease - see the discussion entry
    "melorheostosis_attribution".
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In some OPK and BOS families, an individual may have relatively large, asymmetric areas of dense cortical bone interpreted as melorheostosis (MEL)."
    explanation: Describes melorheostosis-like segmental hyperostosis as an occasional within-family manifestation of OPK/BOS.
  - reference: PMID:17622481
    reference_title: "A novel LEMD3 mutation common to patients with osteopoikilosis with and without melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LEMD3 mutation reported was clearly the cause of osteopoikilosis in the two families but its relationship to melorheostosis in one of the family members is still unclear."
    explanation: >-
      One family, one LEMD3 allele, and melorheostosis in only one member - the
      cleanest statement that the LEMD3 genotype alone does not determine the
      segmental lesion.
pathophysiology:
- name: LEMD3 Haploinsufficiency
  description: >-
    A heterozygous germline loss-of-function variant in LEMD3 - nonsense, frameshift,
    splice-disrupting, or whole-gene deletion - halves the functional dose of MAN1, a
    roughly 100-kDa integral protein of the inner nuclear membrane. Truncating alleles
    remove the C-terminal nucleoplasmic region that carries the SMAD-interacting
    module, so the residual protein cannot perform the function the wild-type allele
    is losing. No obligate somatic second hit has been found in lesional tissue, so
    the disorder is modelled as true haploinsufficiency rather than as a two-hit
    mosaic condition.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: LEMD3
    term:
      id: hgnc:28887
      label: LEMD3
  cellular_components:
  - preferred_term: inner nuclear membrane
    term:
      id: GO:0005637
      label: nuclear inner membrane
  genetic_context:
    gene:
      preferred_term: LEMD3
      term:
        id: hgnc:28887
        label: LEMD3
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline truncating and deletion alleles across the LEMD3 coding
      sequence; reported examples include p.Y441X, p.L478X, p.R655X, p.W621X and
      p.Y871X, plus the frameshift c.332_333insTC.
  downstream:
  - target: Loss of Nuclear Envelope R-SMAD Antagonism
    causal_link_type: DIRECT
    description: >-
      Reduced MAN1 dose at the inner nuclear membrane means fewer binding sites for
      receptor-activated SMADs, so less of the pathway-terminating activity MAN1
      provides.
    evidence:
    - reference: PMID:15489854
      reference_title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In this study, LEMD3 interacted with BMP and activin-TGFbeta receptor-activated Smads and antagonized both signaling pathways in human cells."
      explanation: >-
        Establishes in human cells that the protein lost by haploinsufficiency is the
        one that antagonises R-SMAD signalling, which is the step this edge asserts.
  evidence:
  - reference: PMID:15489854
    reference_title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the affected individuals that we investigated were heterozygous with respect to a loss-of-function mutation in LEMD3 (also called MAN1), which encodes an inner nuclear membrane protein."
    explanation: The gene-discovery study identifying heterozygous LEMD3 loss of function as the lesion, and MAN1 as an inner nuclear membrane protein.
  - reference: PMID:15489854
    reference_title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A somatic mutation in the second allele of LEMD3 could not be identified in fibroblasts from affected skin of an individual with BOS and an individual with melorheostosis."
    explanation: >-
      Negative search for a somatic second hit in lesional fibroblasts, which is why
      this node is modelled as haploinsufficiency rather than biallelic inactivation.
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the two BOS families, a heterozygous nonsense mutation (exon 1, c.1323C>A, p.Y441X) and a heterozygous frame-shift mutation (exon 1, c.332_333insTC) were identified."
    explanation: Two independent BOS families with heterozygous truncating LEMD3 alleles, illustrating the variant classes involved.
- name: Loss of Nuclear Envelope R-SMAD Antagonism
  description: >-
    MAN1's C-terminal nucleoplasmic region binds the MAD homology 2 (MH2) domain of
    receptor-regulated SMADs at the inner nuclear membrane, in a ligand-independent
    manner and without binding the common mediator SMAD4. The interaction sequesters
    R-SMADs at the nuclear periphery and facilitates their dephosphorylation, so that
    the pathway is terminated rather than merely attenuated. Losing half of this
    capacity removes a brake, not a signal: nothing upstream of the receptor is
    altered, and the defect is in how quickly an activated SMAD is switched off.
    Recent work adds that the LEMD3-SMAD2/3 interaction is mechanosensitive, weakening
    as extracellular matrix stiffness rises, which offers one route by which a
    uniformly halved gene dose could produce focal rather than uniform lesions.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: R-SMAD binding
    term:
      id: GO:0070412
      label: R-SMAD binding
  biological_processes:
  - preferred_term: negative regulation of BMP signaling pathway
    modifier: DECREASED
    term:
      id: GO:0030514
      label: negative regulation of BMP signaling pathway
  - preferred_term: negative regulation of TGF-beta receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0030512
      label: negative regulation of transforming growth factor beta receptor signaling pathway
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
  cellular_components:
  - preferred_term: inner nuclear membrane
    term:
      id: GO:0005637
      label: nuclear inner membrane
  downstream:
  - target: Increased BMP-SMAD1/5/8 Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      MAN1 binds SMAD1, SMAD5 and SMAD8; removing that binding leaves BMP-activated
      R-SMADs phosphorylated and transcriptionally competent for longer.
    evidence:
    - reference: PMID:12642484
      reference_title: "XMAN1, an inner nuclear membrane protein, antagonizes BMP signaling by interacting with Smad1 in Xenopus embryos."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion mutant analyses reveal that the neuralizing and BMP-antagonizing activities of XMAN1 reside in the C-terminal region, and that the C-terminal region binds to Smad1, Smad5 and Smad8, which are intracellular mediators of the BMP pathway."
      explanation: >-
        Maps the BMP-antagonising activity of the MAN1 orthologue to the same
        C-terminal region that binds the BMP R-SMADs - the region truncating LEMD3
        alleles delete - so losing it releases BMP-SMAD signalling.
  - target: Increased TGF-beta-SMAD2/3 Transcriptional Output
    causal_link_type: DIRECT
    description: >-
      The same C-terminal module binds SMAD2 and SMAD3, so MAN1 loss equally releases
      the TGF-beta and activin arm.
    evidence:
    - reference: PMID:15647271
      reference_title: "The integral inner nuclear membrane protein MAN1 physically interacts with the R-Smad proteins to repress signaling by the transforming growth factor-beta superfamily of cytokines."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Overexpression of MAN1 results in inhibition of R-Smad phosphorylation, heterodimerization with Smad4 and nuclear translocation, and repression of transcriptional activation of the TGFbeta, BMP2, and activin-responsive promoters."
      explanation: >-
        Gain-of-MAN1 suppresses TGF-beta-, BMP- and activin-responsive transcription;
        loss of MAN1 is the inverse manipulation, so this supports the direction of
        the edge through an inverted experiment.
      directness: INDIRECT
  evidence:
  - reference: PMID:15647271
    reference_title: "The integral inner nuclear membrane protein MAN1 physically interacts with the R-Smad proteins to repress signaling by the transforming growth factor-beta superfamily of cytokines."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MAN1, through the RNA recognition motif, associates with R-Smads but not Smad4 at the inner nuclear membrane in a ligand-independent manner."
    explanation: Defines the physical interaction - R-SMADs but not SMAD4, at the inner nuclear membrane - that this node says is lost.
  - reference: PMID:30321401
    reference_title: "Structural basis for receptor-regulated SMAD recognition by MAN1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MAN1 interacts with MAD homology 2 (MH2) domains of R-SMAD proteins using its C-terminal U2AF homology motif (UHM) domain and UHM ligand motif (ULM) and facilitates R-SMAD dephosphorylation."
    explanation: >-
      Structural account of the interaction and of the terminating step -
      dephosphorylation of the R-SMAD - that MAN1 facilitates.
  - reference: PMID:30108174
    reference_title: "LEM domain-containing protein 3 antagonizes TGFβ-SMAD2/3 signaling in a stiffness-dependent manner in both the nucleus and cytosol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We confirmed that a consensus C-terminal LEMD3 fragment binds SMAD2/3 in a stiffness-dependent manner throughout the cell and is sufficient for antagonizing SMAD2/3 signaling."
    explanation: >-
      Shows the antagonism is modulated by matrix stiffness, the observation behind the
      note in this node's description that a uniform gene-dose defect might still act
      focally.
- name: Increased BMP-SMAD1/5/8 Transcriptional Output
  description: >-
    With MAN1 antagonism halved, BMP receptor activation yields more, and more
    prolonged, SMAD1/5/8-driven transcription. BMP signalling is the principal
    osteogenic input to the osteoblast lineage, so this is the arm that carries the
    skeletal phenotype. The direct measurement in human BOS tissue is still missing:
    the pathway effect is established in cell systems and in orthologue models, and its
    operation in patient osteoblasts is inferred.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: BMP signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030509
      label: BMP signaling pathway
  - preferred_term: positive regulation of ossification
    modifier: INCREASED
    term:
      id: GO:0045778
      label: positive regulation of ossification
  downstream:
  - target: Bone Lining Cell Activation and Modeling-Based Bone Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Excess BMP-SMAD output in the osteoblast lineage is the proposed driver of the
      focal osteogenic response. The intermediate steps between a halved MAN1 dose and
      the recruitment of a particular patch of bone lining cells are not known, which
      is why the link type is INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT.
    evidence:
    - reference: PMID:32151766
      reference_title: "Modeling-based bone formation transforms trabeculae to cortical bone in the sclerotic areas in Buschke-Ollendorff syndrome. A case study of two females with LEMD3 variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These observations indicate that LEMD3 may be important for the activation of bone lining cells leading to modeling-based bone formation."
      explanation: >-
        The authors connect LEMD3 function to bone lining cell activation, which is the
        step this edge asserts. They do not measure BMP-SMAD output itself, so the edge
        remains inferential on the signalling side.
      directness: INDIRECT
  evidence:
  - reference: PMID:15489854
    reference_title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteopoikilosis, Buschke-Ollendorff syndrome (BOS) and melorheostosis are disorders characterized by increased bone density."
    explanation: >-
      Frames the shared consequence of the LEMD3 lesion as increased bone density,
      the organism-level readout of this signalling arm.
  - reference: PMID:12642484
    reference_title: "XMAN1, an inner nuclear membrane protein, antagonizes BMP signaling by interacting with Smad1 in Xenopus embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, XMAN1 antagonizes bone morphogenetic protein (BMP) signaling downstream of its receptor Alk3, as judged by animal cap assays, in which XMAN1 blocks expression of downstream targets of BMP signaling (Xhox3 and Msx1), and by luciferase reporter assays, in which XMAN1 suppresses BMP-dependent activation of the Xvent2 promoter."
    explanation: >-
      Demonstrates in vivo that MAN1 restrains BMP target-gene expression downstream of
      the receptor; its loss therefore raises BMP transcriptional output.
    directness: INDIRECT
- name: Increased TGF-beta-SMAD2/3 Transcriptional Output
  description: >-
    The TGF-beta and activin arm is released in parallel. In dermal fibroblasts,
    TGF-beta is the dominant transcriptional stimulus for tropoelastin and fibrillar
    collagen, so this arm carries the cutaneous phenotype. The clearest human evidence
    is functional rather than transcriptional: fibroblasts cultured from BOS skin
    produce several-fold excess tropoelastin and carry elevated elastin mRNA, exactly
    the profile expected from unopposed TGF-beta drive.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  - preferred_term: extracellular matrix organization
    modifier: DYSREGULATED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Dermal Fibroblast Elastin and Collagen Overproduction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      TGF-beta1 is an established transcriptional inducer of tropoelastin in dermal
      fibroblasts, so unopposed SMAD2/3 output raises elastin and collagen synthesis.
    evidence:
    - reference: PMID:1629625
      reference_title: "Buschke-Ollendorff syndrome associated with elevated elastin production by affected skin fibroblasts in culture."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transforming growth factor-beta 1 (TGF beta 1), a powerful stimulus for elastin production, brought about similar relative increases in normal and BOS strains."
      explanation: >-
        Identifies TGF-beta1 as the stimulus that drives elastin production in these
        fibroblasts, which is the intermediate this edge relies on. Note the same paper
        found BOS strains still respond normally to exogenous TGF-beta1, so the defect
        looks like a raised basal set-point rather than receptor hypersensitivity.
  - target: Bone Lining Cell Activation and Modeling-Based Bone Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      TGF-beta acts on the osteoblast lineage as well, so the skeletal lesion is not
      attributed to the BMP arm alone. The relative contribution of the two arms to the
      bone phenotype has not been separated in human tissue.

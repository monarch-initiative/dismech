    explanation: Quantifies collagenoma-only and mixed lesions across the reported literature.
- name: Melorheostosis
  category: Skeletal
  frequency: OCCASIONAL
  description: >-
    Segmental flowing cortical hyperostosis - the dripping-candle-wax radiographic
    appearance - affecting one limb segment asymmetrically, superimposed on the
    symmetric osteopoikilotic foci. Uncommon within LEMD3 kindreds but clinically the
    most consequential skeletal manifestation, since unlike osteopoikilosis it can
    cause pain, deformity and restricted joint motion. Recurrence within a family has
    not been described.
  phenotype_term:
    preferred_term: Melorheostosis
    term:
      id: HP:6000817
      label: Melorheostosis
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Occasionally, a larger area of dense bone in OPK or BOS resembles MEL, a sporadic sclerosing disorder primarily involving cortical bone."
    explanation: Establishes melorheostosis-like cortical disease as an occasional finding in OPK and BOS.

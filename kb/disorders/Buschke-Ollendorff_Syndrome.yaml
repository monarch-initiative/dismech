phenotypes:
- name: Connective Tissue Nevi
  category: Dermatological
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Non-tender, flesh-coloured to yellowish or reddish papules and nodules, often
    coalescing into cobblestone-like plaques, asymmetrically distributed and favouring
    the trunk, abdomen, buttocks and thighs. Onset is usually congenital, infantile or
    in childhood, though presentations as late as the fifth decade are recorded. In the
    2016 systematic review, 78% of reported cases (24% skin only plus 54% with both)
    had cutaneous lesions; that is a literature frequency, not a penetrance estimate,
    since dermatological journals over-report the skin component.
  phenotype_term:
    preferred_term: Connective tissue nevi
    term:
      id: HP:0100898
      label: Connective tissue nevi
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BOS commonly presents with nontender connective tissue naevi and sclerotic bony lesions (osteopoikilosis [OPK])."
    explanation: Establishes connective tissue nevi as one of the two cardinal presenting features.
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, all 6 probands presented with multiple yellowish to red papules and nodules, some of which coalesced into cobblestone-like nevoid plaques (Fig. 1A)."
    explanation: Describes the morphology and coalescence pattern of the nevi in a genetically confirmed series.
- name: Osteopoikilosis
  category: Skeletal
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Multiple small (roughly 1-10 mm), round to ovoid, well-defined sclerotic foci
    distributed broadly symmetrically in periarticular cancellous bone - epiphyses and
    metaphyses of long bones, pelvis, carpus and tarsus. Asymptomatic, non-progressive,
    and almost always an incidental radiographic finding. 74% of reported BOS cases in
    the 2016 systematic review (20% bone only plus 54% with both) had osteopoikilosis;
    as with the skin figure this reflects who gets radiographed rather than true
    penetrance. Foci may be absent on radiographs taken in early childhood.
  phenotype_term:
    preferred_term: Osteopoikilosis
    term:
      id: HP:0010739
      label: Osteopoikilosis
  sequelae:
  - target: Arthralgia
    description: >-
      A minority of individuals with osteopoikilosis report joint pain or effusion,
      of unclear relation to the periarticular foci.
    evidence:
    - reference: PMID:25352085
      reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this study, we report a 17-year-old boy who suffers from low back pain and has a mother with similar involvement."
      explanation: >-
        A reported case in which osteopoikilosis presented with pain in both an affected
        child and his affected mother. Note this supports co-occurrence, not causation -
        the review itself does not establish that the foci generate the pain.
      directness: INDIRECT
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BOS combines OPK with connective tissue nevi comprised of collagen and elastin."
    explanation: Defines osteopoikilosis as the skeletal half of the syndrome.
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPK is another defining characteristic of BOS; a summary of OPK locations revealed that the pelvis is the most commonly affected site."
    explanation: Supports the distribution claim, with the pelvis as the commonest site across reported cases.

    Joint pain, sometimes with effusion, reported in 15-20% of people with
    osteopoikilosis. The relationship to the periarticular sclerotic foci is not
    established and the association may be partly coincidental, since arthralgia is
    common in the general population and osteopoikilosis is typically discovered on a
    film ordered for joint pain.

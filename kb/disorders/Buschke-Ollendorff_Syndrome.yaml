- name: Focal Trabecular Osteosclerotic Nodule Formation
  description: >-
    The end-organ lesion of the bone arm: discrete, stellate to round nodules of
    compact lamellar bone, a few millimetres across, sitting within the trabecular
    cavity and on the endocortex, concentrated in epiphyses and metaphyses of long
    bones and in the pelvis, carpus and tarsus. They are metabolically quiet, do not
    remodel abnormally, and do not compromise the bone. Their broadly symmetric
    distribution is what distinguishes them radiographically from metastatic deposits.

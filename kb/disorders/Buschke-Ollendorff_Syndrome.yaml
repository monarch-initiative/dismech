discussions:
- discussion_id: melorheostosis_attribution
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is melorheostosis a manifestation of LEMD3 loss of function, or a separate disease
    that happens to look similar and occasionally co-occurs?
  attaches_to:
  - pathophysiology#Segmental Cortical Hyperostosis
  - phenotypes#Melorheostosis
  - has_subtypes#BOS with Melorheostosis
  rationale: >-
    The 2004 gene-discovery paper put melorheostosis in its title alongside
    osteopoikilosis and BOS, and that framing persisted for years. It was wrong as a
    general claim, and the correction matters both nosologically and therapeutically.

    What is settled: (i) some individuals in LEMD3 kindreds do develop segmental
    cortical hyperostosis read as melorheostosis, and they carry the family's germline
    LEMD3 allele; (ii) patients with sporadic isolated melorheostosis - no
    osteopoikilosis, no family history - repeatedly test negative for germline LEMD3
    variants, and negative for LEMD3 somatic mosaicism in lesional bone and skin; and
    (iii) most such patients instead carry a post-zygotic activating MAP2K1 variant
    confined to the affected bone, with mutant allele fractions of 1-34% and absent
    from contralateral unaffected bone and from blood. So sporadic melorheostosis is a
    somatic MEK1 mosaic disorder and is not BOS.

    What is not settled is the LEMD3-associated form. Within a kindred the germline
    allele is shared by everyone, yet only one member develops the segmental lesion, so
    the genotype alone cannot be the explanation. The long-standing hypothesis is a
    somatic second hit at LEMD3 in the affected segment, but that has been looked for
    and not found. Whether the LEMD3-associated segmental lesion is mechanistically the
    same entity as MAP2K1 melorheostosis, or a distinct lesion that resembles it
    radiographically, is unresolved - the two are convergent at the level of "excess
    cortical bone in an asymmetric focal pattern" and have not been compared
    histologically within one study.

    Curation consequence: this entry models the segmental hyperostosis as a
    within-syndrome node of hypothetical mechanism, keeps sporadic melorheostosis in
    differential_diagnoses rather than in the pathograph, and does not assert that
    LEMD3 causes melorheostosis in general.
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that OPK and BOS individuals, including those with MEL-like lesions, have heterozygous, deactivating, germline LEMD3 mutations. However, MEL remains of unknown etiology."
    explanation: The study that separated the two claims - LEMD3 explains OPK/BOS including their MEL-like lesions, but not melorheostosis as an entity.
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, no LEMD3 mutation was found for any other patient, including all four with sporadic MEL."
    explanation: >-
      Refutes the proposition that LEMD3 loss of function explains sporadic
      melorheostosis - the claim carried in the 2004 paper's title.
  - reference: PMID:19438932
    reference_title: "Novel and recurrent germline LEMD3 mutations causing Buschke-Ollendorff syndrome and osteopoikilosis but not isolated melorheostosis."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study supports the general conclusion that LEMD3 mutations do not contribute to isolated sporadic melorheostosis."
    explanation: Independent replication of the negative LEMD3 result in isolated melorheostosis.
  - reference: PMID:29643386
    reference_title: "Somatic activating mutations in MAP2K1 cause melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The activating mutations (Q56P, K57E and K57N) cluster tightly in the MEK1 negative regulatory domain."
    explanation: Identifies the actual somatic driver of sporadic melorheostosis, in a gene unrelated to LEMD3.
  - reference: PMID:30989250
    reference_title: "Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies of melorheostosis lesional tissue indicate that most cases arise from somatic MAP2K1 mutations although a small number may arise from other genes in related pathways, such as KRAS."
    explanation: >-
      Contemporary review position, and the qualification that MAP2K1 does not account
      for every case either.
  - reference: PMID:17622481
    reference_title: "A novel LEMD3 mutation common to patients with osteopoikilosis with and without melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nature of the additional genetic and/or environmental influences required for the development of melorheostosis in those with osteopoikilosis requires further investigation."
    explanation: States the residual open question about the LEMD3-associated segmental lesion that this discussion records as unresolved.
- discussion_id: lemd3_tissue_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    LEMD3 is expressed in essentially every nucleated cell and the loss-of-function
    allele is present in every cell. Why are the lesions confined to bone and dermis,
    and why are they focal within those tissues rather than uniform?
  attaches_to:
  - pathophysiology#Increased BMP-SMAD1/5/8 Transcriptional Output
  - pathophysiology#Dermal Fibroblast Elastin and Collagen Overproduction
  rationale: >-
    This is the central unexplained feature of the disease and it has two parts.

    Tissue selectivity: a ubiquitous 50% reduction produces disease only where BMP and
    TGF-beta signalling sets matrix output - osteoblast lineage and dermal fibroblast.
    A plausible reading is that these are simply the tissues whose phenotype is most
    sensitive to SMAD dose, but that has not been tested; no BOS-specific
    transcriptomic, proteomic or single-cell dataset exists in any tissue.

    Focality within a tissue: this is the harder half. Cultured fibroblasts from
    clinically uninvolved BOS skin already overproduce tropoelastin more than
    three-fold, so the cellular defect is present where there is no lesion, and
    something else decides where a nevus forms. The same puzzle applies in bone, where
    the sclerotic nodules occupy a small fraction of a uniformly haploinsufficient
    skeleton. Two candidate explanations are on the table and neither has been tested
    in BOS tissue: a somatic second event confined to the lesion (searched for in
    LEMD3 and not found), or a local modifier such as matrix stiffness - the
    LEMD3-SMAD2/3 interaction weakens as stiffness rises, which would make the
    haploinsufficient cell progressively less able to restrain TGF-beta in exactly the
    stiffening matrix it is building, a plausible focal positive-feedback loop.
  evidence:
  - reference: PMID:1629625
    reference_title: "Buschke-Ollendorff syndrome associated with elevated elastin production by affected skin fibroblasts in culture."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a second patient, whose involvement was nearly complete, elastin production was high in involved areas and less so in completely involved skin."
    explanation: >-
      Reports elastin production varying between skin sites within one patient, which
      is the observation the focality question rests on.
  - reference: PMID:30108174
    reference_title: "LEM domain-containing protein 3 antagonizes TGFβ-SMAD2/3 signaling in a stiffness-dependent manner in both the nucleus and cytosol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using human lung biopsies, we observed that these nuclear and cytosolic interactions are also present in tissue and found that fibrotic tissues exhibit locally diminished and cytoplasmically shifted LEMD3-SMAD2/3 interactions, as noted in vitro"
    explanation: >-
      Shows locally diminished LEMD3-SMAD2/3 interaction in stiffened human tissue,
      the basis for the matrix-stiffness hypothesis offered here as one candidate
      explanation for focality.
- discussion_id: lemd3_negative_bos_families
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What causes Buschke-Ollendorff syndrome in families with an unambiguous
    osteocutaneous phenotype and no detectable LEMD3 coding variant?
  attaches_to:
  - genetic#LEMD3
  rationale: >-
    At least one family with textbook BOS - father and son with nevus elasticus plus
    radiographic osteopoikilosis - has been sequenced across all LEMD3 exons and splice
    sites with no variant found. Candidate explanations that have not been excluded
    include a deep intronic or regulatory variant, a copy-number change missed by
    sequencing (deletion/duplication analysis was not routine at the time), and locus
    heterogeneity involving another component of the nuclear-envelope SMAD-terminating
    machinery. The practical consequence is already established: a negative LEMD3 test
    does not overturn a convincing phenotype.
  evidence:
  - reference: PMID:20083694
    reference_title: "Buschke-Ollendorff syndrome: absence of LEMD3 mutation in an affected family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the clinical findings are diagnostic of Buschke-Ollendorf syndrome, analysis of the LEMD3 gene showed no exonic mutations."
    explanation: The mutation-negative family that defines this gap.
- discussion_id: bos_no_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Heterozygous Lemd3 mice have the same allelic state as human patients and show no
    skeletal phenotype at all. Is murine bone genuinely insensitive to Lemd3 dosage, or
    was the phenotype missed?
  attaches_to:
  - pathophysiology#Focal Trabecular Osteosclerotic Nodule Formation
  - animal_models#Mouse
  rationale: >-
    Human LEMD3 haploinsufficiency reliably produces osteopoikilosis. The heterozygous
    Lemd3 gene-trap mouse, examined by radiography, quantitative micro-CT
    histomorphometry across eight structural parameters, and conventional histology,
    showed nothing. The mismatch is not evidence-absent - the experiment was done and
    was negative - it is a translational validity problem, and it is the reason no
    animal model of the human bone phenotype exists. Alternatives that would
    discriminate: whether murine bone simply tolerates a halved dose (a real species
    difference in SMAD dose sensitivity), whether the murine lesion requires a longer
    lifespan or a mechanical challenge to appear, or whether the gene-trap allele is
    hypomorphic rather than null and the effective dose reduction was smaller than in
    patients. Until this is resolved, mechanistic and therapeutic hypotheses about the
    human lesion cannot be tested in vivo; a conditional or knock-in allele in the
    osteoblast lineage, or a patient-derived iPSC osteoblast system, is the obvious
    next step.
  proposed_experiments:
  - experiment_id: conditional_lemd3_osteoblast_lineage
    name: Osteoblast-lineage conditional Lemd3 inactivation
    description: >-
      Inactivate Lemd3 conditionally in the osteoblast/bone-lining lineage and age the
      animals, testing whether tissue-restricted and more complete loss produces focal
      sclerotic nodules that the germline heterozygote does not.
    would_support:
    - pathophysiology#Bone Lining Cell Activation and Modeling-Based Bone Formation
    supporting_outcome:
    - >-
      Discrete lamellar sclerotic nodules appear within trabecular bone on micro-CT,
      with modeling-based apposition and normal remodelling rate on dynamic
      histomorphometry, mirroring the human lesion.
    refuting_outcome:
    - >-
      No focal sclerosis develops even with complete lineage-restricted loss and
      ageing, which would move the explanation away from osteoblast-autonomous SMAD
      dose and toward a systemic or developmental requirement.
  evidence:
  - reference: PMID:19862465
    reference_title: "The heterozygous Lemd3 +/GT mouse is not a murine model for osteopoikilosis in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate whether the heterozygous gene-trapped mouse is a good model for osteopoikilosis in humans, we studied these mice radiologically with high-resolution micro-computed tomography (microCT) and histologically."
    explanation: Describes the study design, establishing that the negative result comes from a purpose-built and adequately powered comparison rather than an incidental observation.
- discussion_id: bos_cognitive_delay_association
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is cognitive delay part of Buschke-Ollendorff syndrome, or an artefact of
    ascertainment and of contiguous 12q14 deletions being counted as BOS?
  attaches_to:
  - phenotypes#Short Stature
  - genetic#LEMD3
  rationale: >-
    A 2016 systematic review reported cognitive delays in 50% of its own single-centre
    cohort and in 17% of literature cases published from 2007 onwards, with none
    reported before 2007. That temporal pattern is the problem: it is exactly what
    reporting bias looks like, and 2007 is also roughly when microarray testing became
    routine, so cases with a contiguous 12q14 deletion - which removes HMGA2 and other
    neighbours and does cause developmental delay and short stature - would have begun
    entering the BOS literature. A single-child 2024 preprint describing intellectual
    disability adds nothing decisive. No cognitive phenotype is deliberately curated in
    this entry's phenotypes block on this evidence. Resolving it needs
    neurodevelopmental assessment of a molecularly defined cohort with contiguous
    deletions excluded by array.
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, 50% of the cohort from HSC had cognitive delays, and only cases from 2007 onwards reported cognitive delays (the prevalence was 17% among those cases)."
    explanation: >-
      The observation itself, including the post-2007 restriction that is the main
      reason to treat it as an ascertainment artefact rather than a syndrome feature.
references:
- reference: PMID:15489854
  title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
  findings:
  - statement: >-
      Gene-discovery study. Heterozygous LEMD3 loss-of-function variants in osteopoikilosis
      and BOS families; LEMD3 interacts with BMP- and activin/TGF-beta-activated SMADs and
      antagonises both pathways in human cells. Its title also attributes melorheostosis to
      LEMD3, a claim later refuted for the sporadic form - see the
      "melorheostosis_attribution" discussion.
- reference: PMID:17087626
  title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
  findings:
  - statement: >-
      Sequenced 11 individuals with sclerosing bone disorders. Germline LEMD3 mutations in
      OPK and BOS families including one with MEL-like lesions, and in none of the four
      with sporadic melorheostosis.
- reference: PMID:29643386
  title: "Somatic activating mutations in MAP2K1 cause melorheostosis."
  findings:
  - statement: >-
      Paired affected/unaffected bone exome sequencing in 15 melorheostosis patients found
      somatic mosaic activating MAP2K1 (MEK1) variants in eight, absent from unaffected
      bone and blood. Establishes the aetiology of sporadic melorheostosis as distinct
      from LEMD3.
- reference: PMID:26708699
  title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
  findings:
  - statement: >-
      Systematic review of 164 reported cases plus a Toronto cohort. Skin lesions 24%, bone
      lesions 20%, both 54%; family history 92%; short stature 7% and spinal stenosis 2%,
      both only in patients with osteopoikilosis; contested cognitive-delay association.
- reference: PMID:40195882
  title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
  findings:
  - statement: >-
      Six LEMD3-variant probands with pooled literature analysis. Elastoma, collagenoma,
      mixed lesions and interstitial dermal mucin; post-incisional scarring in four of six;
      non-penetrant carrier parents; pelvis the commonest osteopoikilosis site.
- reference: PMID:32151766
  title: "Modeling-based bone formation transforms trabeculae to cortical bone in the sclerotic areas in Buschke-Ollendorff syndrome. A case study of two females with LEMD3 variants."
  findings:
  - statement: >-
      The only human bone-tissue study of BOS. Normal bone turnover markers and remodelling
      rate; sclerotic nodules of compact lamellar bone formed by modeling-based apposition
      with no woven bone, implicating bone lining cell activation.
- reference: PMID:1629625
  title: "Buschke-Ollendorff syndrome associated with elevated elastin production by affected skin fibroblasts in culture."
  findings:
  - statement: >-
      BOS skin fibroblasts produce 2-8 times normal tropoelastin with elevated elastin mRNA;
      apparently uninvolved skin is also elevated more than three-fold. The mechanistic
      basis for the cutaneous arm and for the focality problem.
- reference: PMID:19862465
  title: "The heterozygous Lemd3 +/GT mouse is not a murine model for osteopoikilosis in humans."
  findings:
  - statement: >-
      Radiography, quantitative micro-CT histomorphometry and histology of heterozygous
      Lemd3 gene-trap mice found no osteopoikilosis-like lesion and no structural
      difference from wild type. There is currently no animal model of the human bone
      phenotype.
- reference: PMID:15647271
  title: "The integral inner nuclear membrane protein MAN1 physically interacts with the R-Smad proteins to repress signaling by the transforming growth factor-beta superfamily of cytokines."
  findings:
  - statement: >-
      MAN1 binds R-SMADs but not SMAD4 at the inner nuclear membrane, ligand-independently,
      and inhibits R-SMAD phosphorylation, SMAD4 heterodimerisation, nuclear translocation
      and TGF-beta/BMP2/activin-responsive transcription.
- reference: PMID:30321401
  title: "Structural basis for receptor-regulated SMAD recognition by MAN1."
  findings:
  - statement: >-
      Crystal structures of SMAD1-MAN1 and SMAD2-MAN1 complexes; MAN1's C-terminal UHM
      domain and ULM form the surface that engages the R-SMAD MH2 domain and facilitates
      dephosphorylation.
- reference: PMID:30989250
  title: "Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis."
  findings:
  - statement: >-
      Review of both entities and their molecular separation, with management guidance;
      melorheostosis affects fewer than 1 in a million and only about a third show the
      classic dripping-candle-wax pattern.
notes: >-
  **Relation to the other LEMD3 entries in this knowledge base.** A separate entry,
  `Dacryocystitis-Osteopoikilosis_Syndrome` (MONDO:0008158), covers a distinct MONDO
  concept in which recurrent dacryocystitis from nasolacrimal duct stenosis accompanies
  osteopoikilosis. That entry attributes its skeletal component to the same LEMD3
  mechanism modelled here, though LEMD3 has never been sequenced in the single reported
  pedigree. The two entries deliberately overlap on the osteopoikilosis pathophysiology
  and diverge on everything else; neither is a subtype of the other, and this entry does
  not model lacrimal or fibroproliferative manifestations.

  **No GeneReviews chapter exists.** PubMed and NCBI Bookshelf searches for
  GeneReviews coverage of Buschke-Ollendorff syndrome, osteopoikilosis, LEMD3 and
  melorheostosis all returned zero results (searched 2026-09-05). The mandatory
  GeneReviews phenotype baseline therefore could not be applied. The phenotype block was
  instead cross-checked against the largest available systematic review (PMID:26708699,
  164 cases) and the most recent genetically confirmed case series (PMID:40195882).

  **No mechanism module fits.** `kb/modules/` was searched for a conformance target.
  `fibrotic_response` is the closest candidate and is wrong: BOS connective tissue nevi
  are hamartomatous developmental overproduction of normal matrix, not a myofibroblast
  wound-healing programme, and there is no injury, no inflammatory phase and no
  contractile myofibroblast in the lesion. `aortopathy_tgfbeta_dysregulation` shares the
  TGF-beta axis but is scoped to the aortic wall.
  `defective_skeletal_mineralization` and `osteoporosis_bone_resorption` both run in the
  opposite direction. No `conforms_to` was declared rather than forcing one. A future
  "nuclear envelope SMAD termination failure" or "focal osteosclerosis" module would be
  the natural home.

  **Deep research provenance.** Two providers were run. `falcon` (Edison) produced a
  substantial, well-organised report that is the source of several framing points here,
  including the contiguous-12q14-deletion caveat and the ascertainment warning on the
  1-in-20,000 figure; it also mis-cited Mumm et al. 2007 as PMID:17223882 (that PMID is a
  different paper, Br J Dermatol, "Familial cutaneous collagenomas resulting from a novel
  mutation in LEMD3") and proposed two HP CURIEs that resolve to unrelated terms -
  HP:0005681 for "Osteopoikilosis" is in fact *Juvenile idiopathic arthritis*, and
  HP:0005781 for "Melorheostosis" is *Contractures of the large joints*. Neither was
  used; the bindings here (HP:0010739, HP:6000817) were verified against OLS. `asta`
  returned 20 papers of which none concerned this disease - the retrieval failed
  completely for this query - and nothing from it was used.

  **What is not curated here and why.** No `biochemical:` block: bone turnover markers
  and routine chemistry are normal in BOS and there is no biomarker. No `datasets:`
  block: no BOS-specific transcriptomic, proteomic or single-cell dataset was identified,
  in GEO or elsewhere. No `clinical_trials:` block: no interventional trial for BOS
  exists, and the melorheostosis MEK-inhibitor interest raised in PMID:29643386 concerns
  the MAP2K1-driven disease, not this one. No `environmental:` block: no exposure has
  any demonstrated role in a germline Mendelian disorder, and trauma prompting the
  radiograph that finds the lesion is ascertainment, not aetiology. No cognitive
  phenotype is curated, for the reasons in the "bos_cognitive_delay_association"
  discussion.

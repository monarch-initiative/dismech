- species: Mouse
  genotype: Man1 (Lemd3) homozygous deletion of the Smad-interacting domain
  category: Genetically engineered
  description: >-
    Embryos lacking the MAN1 Smad-interacting domain, used to show what unopposed
    Smad2/3 signalling does in vivo. They die at midgestation from a failure of
    vascular remodelling: the primary capillary plexus forms but is not remodelled,
    mural cell recruitment fails, Tgfb1 expression rises and Smad2/3 signalling is
    abnormally activated, with increased extracellular matrix deposition. The tissue is
    vascular rather than dermal or skeletal and the genotype is homozygous rather than
    heterozygous, so this is evidence about the pathway, not about the human disease.
  genes:
  - preferred_term: Lemd3
    term:
      id: hgnc:28887
      label: LEMD3
  publication: PMID:16943282
  modeled_mechanisms:
  - target: Increased TGF-beta-SMAD2/3 Transcriptional Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Loss of the Smad-interacting domain activates Smad2/3 signalling in vivo and
      increases extracellular matrix deposition, which is the molecular claim this
      pathophysiology node makes.
    limitations: >-
      Homozygous rather than the heterozygous state that causes human disease, and
      embryonic-lethal, so it says nothing about the postnatal, focal, tissue-restricted
      lesions of BOS. The phenotype observed is vascular; neither bone nor dermis was
      examined.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Bone and dermis, the two tissues in which the human lesion appears, are outside
        the model's boundary; only the embryonic vasculature was studied.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The animal dies at midgestation, so the model covers only embryogenesis, while
        osteopoikilotic foci and connective tissue nevi accumulate postnatally over
        years.
    evidence:
    - reference: PMID:16943282
      reference_title: "Man1, an inner nuclear membrane protein, regulates vascular remodeling by modulating transforming growth factor beta signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Man1-deficient embryos die at midgestation because of defects in embryonic vasculature; the primary capillary plexus forms, but subsequent remodeling is perturbed."
      explanation: Establishes what the model actually shows, and the lethality that bounds what it can be used for.
  evidence:
  - reference: PMID:16943282
    reference_title: "Man1, an inner nuclear membrane protein, regulates vascular remodeling by modulating transforming growth factor beta signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that Man1 regulates vascular remodeling by analyzing Man1-deficient embryos lacking the Smad interacting domain."
    explanation: >-
      Defines the allele - deletion of the Smad-interacting domain specifically - which
      is what makes this animal informative about the SMAD-antagonism arm of the human
      mechanism rather than about MAN1 in general.
- species: African clawed frog
  genotype: XMAN1 overexpression and antisense morpholino knockdown in Xenopus laevis embryos
  category: Genetically engineered
  description: >-
    The developmental system in which MAN1's BMP-antagonising function was first
    demonstrated. Overexpressed XMAN1 blocks BMP target genes and suppresses a
    BMP-responsive promoter; morpholino knockdown of endogenous XMAN1 reduces anterior
    neuroectoderm. Deletion analysis localises both the neuralising and BMP-antagonising
    activities to the C-terminal region that binds Smad1, Smad5 and Smad8 - the region
    human truncating LEMD3 alleles delete.
  genes:
  - preferred_term: LEMD3
    term:
      id: hgnc:28887
      label: LEMD3
  publication: PMID:12642484
  modeled_mechanisms:
  - target: Loss of Nuclear Envelope R-SMAD Antagonism
    relationship: PERTURBS
    fidelity: MODERATE

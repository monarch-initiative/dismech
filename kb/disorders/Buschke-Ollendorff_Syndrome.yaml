  category: Dermatological
  frequency: OCCASIONAL
  description: >-
    The collagen-predominant form of the connective tissue nevus, in which dense
    hypocellular collagen rather than excess elastic tissue makes up the lesion. In the
    2025 pooled analysis 8% of reported cases had collagenoma alone and 23% a mixed
    collagenoma-plus-elastoma phenotype, so a collagen-only biopsy is fully compatible
    with BOS.

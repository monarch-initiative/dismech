  category: Skeletal
  frequency: VERY_RARE
  description: >-
    Narrowing of the spinal canal reported in about 2% of BOS cases, all of them with
    osteopoikilosis. Rare enough that it should prompt a search for an alternative
    explanation before being attributed to the syndrome.
  phenotype_term:
    preferred_term: Spinal canal stenosis
    term:
      id: HP:0003416
      label: Spinal canal stenosis
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with spinal stenosis (2%) or shortened status (7%) had OPK."
    explanation: Source of the 2% spinal stenosis figure among reported BOS cases.
- name: Yellow Papule
  category: Dermatological
  frequency: FREQUENT
  description: >-
    The individual element of the connective tissue nevus as it is usually first seen
    clinically: a small, firm, asymptomatic yellowish papule, appearing in crops that
    may coalesce. Lesions are commonly present for years before the diagnosis is made.
  phenotype_term:
    preferred_term: Yellow papule
    term:
      id: HP:0025507
      label: Yellow papule
  evidence:
  - reference: PMID:20083694
    reference_title: "Buschke-Ollendorff syndrome: absence of LEMD3 mutation in an affected family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a father and son with multiple yellowish papules and nodules coalescing into cobblestone nevoid plaques consistent with nevus elasticus."
    explanation: Describes the yellowish papular morphology and its coalescence into nevoid plaques.
  - reference: PMID:18986450
    reference_title: "Buschke-Ollendorff syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physical examination of the patient showed multiple asymptomatic nodules on both thighs, present since the age of 20 years, which had increased in size and number."
    explanation: Illustrates the asymptomatic, slowly accumulating course of the cutaneous lesions.
histopathology:
- name: Dermal Elastoma
  finding_term:
    preferred_term: elastoma (elastin-rich connective tissue nevus)
  frequency: FREQUENT
  diagnostic: true
  description: >-
    The classical BOS dermal lesion. Elastic-tissue stains (Victoria blue, Verhoeff-van
    Gieson, orcein) show markedly increased, thickened, broad and irregularly arranged
    elastic fibres filling the reticular dermis. No term in the NCIT histopathology
    branch or under HP Abnormal cell morphology names this lesion, so finding_term
    carries a free-text preferred_term only; the corresponding HP phenotype
    (HP:0025164) is bound in the phenotypes block instead.
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histologically, elastoma is traditionally regarded as the predominant feature of BOS."
    explanation: States the primacy of the elastoma pattern among BOS dermal biopsies.
- name: Dermal Collagenoma
  finding_term:
    preferred_term: collagenoma (collagen-rich connective tissue nevus)
  frequency: OCCASIONAL
  description: >-
    Dense, hypocellular, haphazardly interlacing collagen bundles expanding the dermis
    with normal or reduced elastic tissue, demonstrated on Masson trichrome. May be the
    only pattern present, and may coexist with elastoma in the same patient at
    different sites.
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Masson's trichrome staining indicated collagenoma in probands 3 (foot) and 4 (Fig. S1A)."
    explanation: Documents collagenoma by trichrome staining in two genetically confirmed probands.
- name: Interstitial Dermal Mucin Deposition
  finding_term:
    preferred_term: interstitial dermal mucin deposition
  frequency: FREQUENT
  description: >-
    Increased interstitial mucin between the dermal collagen and elastic fibres,
    demonstrated on Alcian blue. Under-recognised: it was present in every proband of
    the 2025 series, and in at least one reported child it was the only abnormality on
    an otherwise unremarkable biopsy. Its mechanistic relation to LEMD3 loss is unknown.
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alcian blue staining demonstrated increased interstitial mucin in the reticular dermis of all probands (Fig. S1A)."
    explanation: Establishes dermal mucin as a consistent finding in this series.
  - reference: PMID:32206820
    reference_title: "Buschke-Ollendorff syndrome in a 6-year-old patient: clinical and histopathological aspects of a rare disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A skin biopsy was performed and did not show striking alterations in the number or dimension of the extracellular matrix fibers, but it showed mucin deposition between them, which is compatible with a CTN."
    explanation: >-
      A case in which mucin was the only histological abnormality, supporting the
      warning that a fibre-normal biopsy does not exclude a connective tissue nevus.
- name: Compact Lamellar Sclerotic Bone Nodule
  finding_term:
    preferred_term: osteosclerotic nodule of compact lamellar bone
    term:
      id: NCIT:C69309
      label: Sclerosis
  diagnostic: true
  description: >-
    On undecalcified bone histology and micro-CT the osteopoikilotic focus is a
    stellate nodule of compact lamellar bone within the marrow cavity or on the
    endocortex, formed by modeling-based apposition. Remodelling rate is normal and
    woven bone is absent. The NCIT binding is the generic morphologic finding
    "Sclerosis"; NCIT has no term for this specific lesion.
  evidence:
  - reference: PMID:32151766
    reference_title: "Modeling-based bone formation transforms trabeculae to cortical bone in the sclerotic areas in Buschke-Ollendorff syndrome. A case study of two females with LEMD3 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both biopsies, μCT showed trabecular structure comparable to that of controls with stellate shaped sclerotic noduli within the cavity and on the endocortex."
    explanation: Describes the stellate sclerotic nodules and their position within otherwise normal trabecular bone.
imaging_findings:
- name: Multiple Symmetric Periarticular Sclerotic Foci
  modality: XRAY
  spatial_extent: MULTIFOCAL
  diagnostic: true
  description: >-
    The diagnostic plain-film appearance: numerous small, well-defined, homogeneous
    round or ovoid densities clustered around joints and distributed broadly
    symmetrically. Pelvis, hands and wrists, knees and ankles are the highest-yield
    films. Their uniformity and symmetry are what separate them from osteoblastic
    metastatic deposits, which are irregular, asymmetric and axially predominant.
  imaging_finding_term:
    preferred_term: Osteopoikilosis
    term:
      id: HP:0010739
      label: Osteopoikilosis
  evidence:
  - reference: PMID:25352085
    reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPK must be in differential diagnosis when multiple, small, well-defined, symmetric bone lesions are identified on plain radiograph to avoid alarming the patient with more serious disease and misdiagnosis."
    explanation: Describes the radiographic pattern and states the clinical reason it matters.
- name: Normal Bone Scintigraphy Over Osteopoikilotic Foci
  modality: OTHER
  description: >-
    Radionuclide bone scanning is normal over osteopoikilotic foci, consistent with the
    histological finding of normal remodelling rate, and this is the single most useful
    discriminator from osteoblastic metastases, which are avid. Note the contrast with
    the melorheostotic lesion, which is metabolically active and does show uptake.
  imaging_finding_term:
    preferred_term: normal radionuclide bone scan over sclerotic foci
  evidence:
  - reference: PMID:25352085
    reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone scintigraphy is normal and useful for differential diagnosis."
    explanation: Establishes normal scintigraphy as the discriminating investigation.
- name: Flowing Cortical Hyperostosis
  modality: XRAY
  spatial_extent: SEGMENTAL
  description: >-
    Where melorheostosis accompanies BOS, radiographs show dense, irregular, eccentric
    hyperostosis of the cortex in a segmental distribution, classically likened to
    dripping candle wax, with sharp demarcation between affected and unaffected bone.
  imaging_finding_term:
    preferred_term: Melorheostosis
    term:
      id: HP:6000817
      label: Melorheostosis
  evidence:
  - reference: PMID:30138550
    reference_title: "Distinct Clinical and Pathological Features of Melorheostosis Associated With Somatic MAP2K1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Melorheostosis is a rare hyperostotic disease of the long bones classically characterized by a \"dripping candle-wax\" radiographic appearance."
    explanation: Defines the radiographic appearance this finding records.
genetic:
- name: LEMD3
  gene_term:
    preferred_term: LEMD3
    term:
      id: hgnc:28887
      label: LEMD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causative; heterozygous germline loss of function
  frequency: >-
    Identified in the large majority of clinically diagnosed BOS families, but a
    minority of convincing families have no coding-region variant.
  notes: >-
    LEMD3 (also MAN1) lies at 12q14 and encodes an integral protein of the inner
    nuclear membrane. Reported pathogenic alleles are nonsense, frameshift,
    splice-disrupting or whole-gene deletions distributed across the coding sequence,
    all predicted to remove the C-terminal R-SMAD-interacting region. The CURIE is
    written in the lowercase form this repository uses. Contemporary testing should
    add deletion/duplication analysis to sequencing, and chromosomal microarray is
    warranted when short stature, developmental delay or dysmorphism raises the
    possibility of a contiguous 12q14 deletion rather than an isolated LEMD3 lesion.
  evidence:
  - reference: PMID:15489854
    reference_title: "Loss-of-function mutations in LEMD3 result in osteopoikilosis, Buschke-Ollendorff syndrome and melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genome-wide linkage analysis in these families, followed by the identification of a microdeletion in an unrelated individual with these diseases, allowed us to map the gene that is mutated in osteopoikilosis."
    explanation: The mapping and gene-identification step that established LEMD3 as causative.
  - reference: PMID:27382493
    reference_title: "Mutation in LEMD3 (Man1) Associated with Osteopoikilosis and Late-Onset Generalized Morphea: A New Buschke-Ollendorf Syndrome Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two additional family members were found to have osteopoikilosis and carry the same LEMD3 mutation."
    explanation: Cosegregation of an LEMD3 nonsense allele with osteopoikilosis across a family.
  - reference: PMID:26694706
    reference_title: "Identification of a novel LEMD3 Y871X mutation in a three-generation family with osteopoikilosis and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation co-segregates with the osteopoikilosis phenotype and was not found in 100 ethnically matched controls."
    explanation: Cosegregation across three generations with control screening, supporting causality of truncating LEMD3 alleles.
  - reference: PMID:20083694
    reference_title: "Buschke-Ollendorff syndrome: absence of LEMD3 mutation in an affected family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Absence of LEMD3 mutation in the exons and splice sites of a family with BOS suggests that there is genetic heterogeneity for this disorder."
    explanation: >-
      A clinically unambiguous BOS family with no LEMD3 coding variant, supporting the
      qualification that LEMD3 does not account for every case.
diagnosis:
- name: Clinical and Radiographic Diagnosis
  description: >-
    BOS is diagnosed from the combination of connective tissue nevi and radiographic
    osteopoikilosis, usually with a supporting family history. Plain radiographs of the
    pelvis, hands and wrists, knees and ankles are the highest-yield screen; CT adds
    little in typical disease and PET/MRI is unnecessary. Because expressivity is
    variable, a first-degree relative with only one component still warrants
    consideration, and a negative childhood radiograph does not exclude osteopoikilosis
    that appears later.
  diagnosis_term:
    preferred_term: plain radiography
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:26708699
    reference_title: "Buschke-Ollendorff syndrome: a novel case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family history was noted in 92% of cases."
    explanation: Supports the weight given to family history in recognising the syndrome.
  - reference: PMID:18986450
    reference_title: "Buschke-Ollendorff syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a minor trauma, radiologic examination of the left ankle of a 39-year-old woman revealed features of osteopoikilosis."
    explanation: Illustrates the typical route to diagnosis - an incidental radiograph taken for an unrelated reason.
- name: Bone Scintigraphy to Exclude Osteoblastic Metastasis
  description: >-
    The clinically consequential mistake in this disease is reading the sclerotic foci
    as osteoblastic metastases and launching an oncological workup. Radionuclide bone
    scanning resolves it: osteopoikilotic foci are cold, metastatic deposits are avid.
    This is the highest-value single investigation when the radiographic finding is
    encountered without a known diagnosis.
  diagnosis_term:
    preferred_term: radionuclide bone scan
    term:
      id: NCIT:C17646
      label: Bone Scan
  evidence:
  - reference: PMID:25352085
    reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It may be confused with other conditions, such as osteoblastic metastases."
    explanation: Names the differential this investigation exists to settle.
  - reference: PMID:27267960
    reference_title: "The Buschke-Ollendorff syndrome: a case report of simultaneous osteo-cutaneous malformations in the hand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A correct diagnosis of Buschke-Ollendorff syndrome is necessary to spare patients from expensive investigations and to provide reassurance about the benign nature of the disease."
    explanation: States the clinical value of arriving at the diagnosis - avoiding unnecessary investigation.
- name: Skin Biopsy with Elastic-Fiber and Mucin Staining
  description: >-
    Reserved for atypical or diagnostically uncertain lesions. Request elastic-tissue
    staining (Victoria blue, Verhoeff-van Gieson or orcein), trichrome and Alcian blue
    alongside routine histology: routine haematoxylin and eosin alone can look
    unremarkable, and the pattern may be elastoma, collagenoma, mixed, or mucin-rich.
    A non-classic biopsy therefore does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results underscore the pathological heterogeneity of BOS."
    explanation: Supports ordering the full panel of stains rather than relying on a single classic pattern.
- name: LEMD3 Molecular Genetic Testing
  description: >-
    Sequencing of the LEMD3 coding exons and splice boundaries confirms the diagnosis
    and enables cascade testing of relatives; deletion/duplication analysis should be
    added, since whole-gene deletions occur. A negative result does not overturn a
    convincing osteocutaneous phenotype - genetically unexplained BOS families are
    documented. Screening is specifically recommended in atypical presentations that
    combine fibrotic skin lesions with a spotted radiographic pattern.
  diagnosis_term:
    preferred_term: LEMD3 sequence analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:27267960
    reference_title: "The Buschke-Ollendorff syndrome: a case report of simultaneous osteo-cutaneous malformations in the hand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In atypical cases of simultaneous occurrence of fibrotic skin lesions and a spotted pattern in the X-ray we recommend the genetic screening of the LEMD3 gene."
    explanation: Explicit recommendation for LEMD3 screening in the presentation this entry describes.
differential_diagnoses:
- name: Osteoblastic Bone Metastases
  description: >-
    The differential that matters. Metastatic osteoblastic deposits are irregular,
    asymmetric, axially predominant and scintigraphically avid; osteopoikilotic foci
    are uniform, periarticular, broadly symmetric and cold on bone scan.
  distinguishing_features:
  - Symmetric periarticular distribution versus irregular axial distribution
  - Normal bone scintigraphy versus increased radiotracer uptake
  - Stable over decades versus progressive
  - Family history of the same radiographic pattern
  evidence:
  - reference: PMID:25352085
    reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is usually made incidentally according to radiographs."
    explanation: Supports the framing that this differential is typically encountered on an incidentally obtained film.
- name: Sporadic Isolated Melorheostosis
  description: >-
    Melorheostosis without osteopoikilosis, occurring sporadically without familial
    clustering. This is a genetically distinct disease driven by post-zygotic
    activating MAP2K1 mutation restricted to the affected bone, not a forme fruste of
    BOS. Repeated LEMD3 sequencing of such patients - including of lesional bone and
    skin - has been negative.
  distinguishing_features:
  - No connective tissue nevi and no osteopoikilotic foci elsewhere in the skeleton
  - Sporadic occurrence with no family history
  - Somatic mosaic MAP2K1 variant in affected but not unaffected bone
  - Germline LEMD3 sequencing negative
  evidence:
  - reference: PMID:29643386
    reference_title: "Somatic activating mutations in MAP2K1 cause melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected, but not unaffected, bone of eight unrelated patients with melorheostosis."
    explanation: Establishes the distinct somatic MAP2K1 aetiology of sporadic melorheostosis.
  - reference: PMID:16470551
    reference_title: "Germline LEMD3 mutations are rare in sporadic patients with isolated melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Somatic mosaicism for a LEMD3 mutation in the latter group was also not observed, and therefore we must conclude that the genetic defect in the majority of sporadic and isolated melorheostosis remains unknown."
    explanation: >-
      The negative LEMD3 result, germline and somatic, in sporadic isolated
      melorheostosis - written before MAP2K1 was found, and the reason the field went
      looking.
- name: 12q14 Microdeletion Syndrome
  description: >-
    A contiguous-gene deletion spanning LEMD3 and its neighbours (including HMGA2),
    producing osteopoikilosis together with primordial short stature and developmental
    delay. Suspect it when a patient with osteopoikilosis also has growth failure or
    cognitive impairment, and investigate with chromosomal microarray rather than
    LEMD3 sequencing alone.
  distinguishing_features:
  - Proportionate short stature and developmental delay accompanying the bone findings
  - Deletion detectable on chromosomal microarray, not on LEMD3 sequencing
  - Connective tissue nevi not a consistent feature
  evidence:
  - reference: PMID:19277063
    reference_title: "Refinement of the 12q14 microdeletion syndrome: primordial dwarfism and developmental delay with or without osteopoikilosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In their studies on the molecular basis of osteopoikilosis, Menten et al have identified three individuals with microdeletions on chromosome 12q14.4, which removed several genes including LEMD3, the osteopoikilosis gene. In addition to osteopoikilosis, affected individuals had growth retardation and developmental delay."
    explanation: >-
      Establishes the contiguous-deletion entity in which osteopoikilosis arrives with
      growth retardation and developmental delay, which is why those features should
      prompt an array rather than being attributed to Buschke-Ollendorff syndrome.
  - reference: PMID:19277063
    reference_title: "Refinement of the 12q14 microdeletion syndrome: primordial dwarfism and developmental delay with or without osteopoikilosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 12q14 deletion did not include LEMD3, and no signs of osteopoikilosis were observed on skeletal radiographs."
    explanation: >-
      Shows the deletion boundary determines whether osteopoikilosis is present,
      confirming that the skeletal component tracks LEMD3 while the growth and
      developmental features track neighbouring genes.
treatments:
- name: Observation and Reassurance
  description: >-
    For the great majority of patients this is the whole of management. Osteopoikilotic
    foci are benign, non-progressive and asymptomatic and require no intervention, and
    most connective tissue nevi need none either. The active work is explaining the
    radiographic findings so that neither the patient nor a future clinician mistakes
    them for malignancy, and documenting the diagnosis where it will be found again.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:17087626
    reference_title: "Deactivating germline mutations in LEMD3 cause osteopoikilosis and Buschke-Ollendorff syndrome, but not sporadic melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OPK is an autosomal dominant, usually benign, skeletal dysplasia featuring multiple, small, especially metaphyseal, oval or round, dense trabecular foci distributed symmetrically throughout the skeleton."
    explanation: Establishes the benign nature of the skeletal lesions that justifies observation over intervention.
- name: Genetic Counselling and Cascade Evaluation
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk per pregnancy, but
    counselling must convey that the phenotype in an inheriting child cannot be
    predicted from the parent's: the same allele produces skin-only, bone-only, full
    and clinically silent presentations within one family. Cascade radiographic and
    dermatological evaluation of relatives is useful mainly to spare them an
    oncological workup later.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19438932
    reference_title: "Novel and recurrent germline LEMD3 mutations causing Buschke-Ollendorff syndrome and osteopoikilosis but not isolated melorheostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We investigated LEMD3 in a two-generation BOS family showing an extremely variable expression of the disease, in a sporadic patient with skin features of BOS, and in an additional subject with isolated melorheostosis."
    explanation: Documents the extreme within-family variability that counselling has to convey.
- name: Analgesic Therapy for Musculoskeletal Pain
  description: >-
    Simple analgesics or anti-inflammatory agents for the minority who have joint pain
    or effusion, or pain from a melorheostotic segment. Symptomatic only; no agent
    modifies the underlying bone lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: analgesic agent
      term:
        id: NCIT:C241
        label: Analgesic Agent
  target_phenotypes:
  - preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: PMID:25352085
    reference_title: "Osteopoikilosis: report of a familial case and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although it is usually asymptomatic, effusion and joint pain can be found in 15-20 % of patients."
    explanation: >-
      Establishes the minority with joint symptoms who need analgesia; the paper does
      not specify a regimen.
- name: Surgical Excision of Symptomatic Connective Tissue Nevi
  description: >-
    Excision may be considered for a nevus that is painful, mechanically limiting
    (hand and plantar lesions in particular) or cosmetically distressing. Counsel about
    scarring first: hypertrophic scarring after skin incision was recorded in four of
    six probands in the 2025 series, and in one reported case the excision itself
    produced a disabling contracture. Outcome evidence is limited to case reports.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  evidence:
  - reference: PMID:40195882
    reference_title: "Clinical and Histopathological Characteristics of Buschke-Ollendorff Syndrome: A Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, 4 probands developed scars after skin incisions (Fig. 1A)."
    explanation: The scarring risk that has to be weighed before excising a benign lesion.
  - reference: PMID:27267960
    reference_title: "The Buschke-Ollendorff syndrome: a case report of simultaneous osteo-cutaneous malformations in the hand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two sclerotic skin lesions had been excised 7 years before because of consecutive skin contracture."
    explanation: A reported case in which excision was undertaken for contracture, illustrating both the indication and the sequela.
- name: Corrective Orthopaedic Surgery
  description: >-
    Reserved for substantial fixed deformity, joint impingement or nerve entrapment,
    which in practice means the melorheostotic rather than the osteopoikilotic
    skeleton. Reported interventions include corrective osteotomy for a digital
    deformity. Contracture recurrence after soft-tissue surgery in extensive
    melorheostosis is a recognised problem.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopaedic surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:27267960
    reference_title: "The Buschke-Ollendorff syndrome: a case report of simultaneous osteo-cutaneous malformations in the hand."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A corrective osteotomy of the thumb was carried out due to the patients discomfort."
    explanation: A reported corrective osteotomy in a genetically confirmed BOS patient.
  - reference: PMID:30989250
    reference_title: "Melorheostosis and Osteopoikilosis: A Review of Clinical Features and Pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical intervention may be required for those with large bone growths, nerve entrapments, joint impingement syndromes or major limb deformities."
    explanation: Sets out the indications for surgery in the melorheostotic subset.
- name: Bisphosphonate Therapy for Symptomatic Melorheostosis
  description: >-
    Used for pain in symptomatic melorheostosis, on weak evidence. Not indicated for
    osteopoikilosis or for the cutaneous lesions, and there is no reason to expect
    benefit there - the osteopoikilotic nodule has a normal remodelling rate, so an
    antiresorptive has no obvious target. Included because it is the one pharmacological
    option that appears in the sclerosing-bone-disease literature; it is not BOS therapy.

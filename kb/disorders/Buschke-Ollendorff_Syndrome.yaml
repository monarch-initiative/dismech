- name: Dermal Connective Tissue Nevus Formation
  description: >-
    Accumulated matrix forms a hamartomatous dermal nodule. Histology is
    heterogeneous and this is the practically important point: the classic lesion is an
    elastoma, with large, thickened, haphazardly arrayed elastic fibres visible on
    Victoria blue or other elastic stains, but a substantial minority are collagenomas
    of dense hypocellular collagen with normal elastic tissue, some are mixed, and
    increased interstitial dermal mucin is common and easily missed. A biopsy read as
    unremarkable on routine haematoxylin and eosin therefore does not exclude BOS, and
    two lesions from the same patient at different body sites can look different.

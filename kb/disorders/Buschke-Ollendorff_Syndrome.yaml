name: Buschke-Ollendorff Syndrome
creation_date: "2026-09-05T00:00:00Z"
description: >-
  Buschke-Ollendorff syndrome (BOS) is a rare autosomal dominant disorder of bone
  and dermal connective tissue caused by heterozygous loss-of-function variants in
  LEMD3, which encodes MAN1, an integral protein of the inner nuclear membrane.
  MAN1 binds receptor-regulated SMADs at the nuclear envelope and terminates BMP
  (SMAD1/5/8) and TGF-beta/activin (SMAD2/3) signalling; haploinsufficiency
  therefore de-represses SMAD-driven transcription. The same lesion produces two
  cardinal manifestations in two tissues. In bone it drives focal modeling-based
  formation of compact lamellar nodules within trabecular bone, seen radiographically
  as osteopoikilosis - multiple small, round, broadly symmetric periarticular
  sclerotic foci that are clinically silent and usually discovered incidentally. In
  skin it drives fibroblast overproduction of elastin and collagen, producing
  connective tissue nevi (elastomas, collagenomas, or mixed lesions, historically
  dermatofibrosis lenticularis disseminata). Expressivity is strikingly variable
  within a single family, so a carrier may show nevi alone, osteopoikilosis alone,
  or both. Segmental cortical hyperostosis resembling melorheostosis occurs in a
  minority of LEMD3 kindreds, but sporadic isolated melorheostosis is a genetically
  distinct condition driven by somatic MAP2K1 mutation and is not part of BOS. The
  main clinical value of recognising BOS is avoiding misdiagnosis of the sclerotic
  bone foci as osteoblastic metastases.
category: Mendelian
parents:
- Musculoskeletal Disease
- Skin Disease
- Genetic Disease

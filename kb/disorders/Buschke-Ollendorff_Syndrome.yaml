- name: Bone Lining Cell Activation and Modeling-Based Bone Formation
  description: >-
    Human bone biopsies from two women with LEMD3 variants show what the skeletal
    lesion actually is at the tissue level, and it is not accelerated remodelling.
    Overall bone turnover markers and remodelling rate were normal; instead, discrete
    areas of trabecular bone had been replaced by compact lamellar bone laid down by
    modeling-based formation - apposition on a quiescent surface, without a preceding
    resorption cavity - which implicates activation of bone lining cells. Woven bone
    was absent, so this is orderly lamellar deposition rather than a reactive or
    repair response.

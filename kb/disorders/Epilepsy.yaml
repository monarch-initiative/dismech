datasets:
- accession: geo:GSE334405
  title: cGAS-mediated IFN-I signaling contributes to disease progression in drug-refractory epilepsy
  description: Epilepsy is a prevalent neurological disease with a third of patients becoming non-responsive to antiepileptic drugs and developing drug-refractory epilepsy (DRE). Here we report that DRE disease progression is contributed by overactive cyclic GMP-AMP synthase (cGAS), a double-stranded DNA sensor that induces type I interferon (IFN-I) signaling. In human DRE microglia, we observe a robust IFN-I signature and the activation of upstream cGAS-STING signaling. Further, in mouse models of Dravet syndrome, a genetic form of DRE, we observe the activation of the cGAS pathway. We show that microglial cGAS can be activated by DNA released from hyperexcitable neurons.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 44
  notes: Identified by GEO DataSets index search for Epilepsy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE326007
  title: Genome-wide analysis of histone H3K18 lactylation in a kainic acid-induced epilepsy model
  description: Metabolic reprogramming has been increasingly linked to epilepsy, but the epigenetic mechanisms connecting altered glucose metabolism to seizure susceptibility remain incompletely understood. In this study, we aimed to investigate whether lactate-associated histone modification contributes to epileptogenesis and to define its downstream transcriptional targets. Using a kainic acid (KA)-induced temporal lobe epilepsy model, we examined genome-wide chromatin occupancy of histone H3 lysine 18 lactylation (H3K18la) in control and epileptic mouse hippocampal tissues by ChIP-seq.
  organism:
    preferred_term: mouse

discussions:
- discussion_id: ncc_related_epilepsy_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Network Hyperexcitability
  - disease#Epilepsy
  prompt: >-
    Beyond hippocampal injury in mesial temporal lobe epilepsy, what mechanism links
    neurocysticercosis to epileptogenesis, and does that mechanism account for the share
    of epilepsy attributed to NCC?
  rationale: >-
    Hippocampal injury with hippocampal sclerosis is the proposed route from NCC to
    epilepsy, but a recent review concludes it alone cannot explain the large proportion
    of epilepsy cases attributed to NCC. Part of that attribution rests on cohorts that
    did not separate epilepsy from acute symptomatic seizures, so the causal share itself
    is uncertain.
  evidence:
  - reference: PMID:42809503
    reference_title: "The Relationship Between Epilepsy and Neurocysticercosis: Evidence and Myths."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Nevertheless, this mechanism alone cannot explain the large proportion of epilepsy cases attributed to NCC in the literature"
    explanation: Review statement that hippocampal injury alone does not account for the epilepsy attributed to NCC, leaving the mechanism open.

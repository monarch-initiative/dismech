- name: GABAergic Interneuron Dysfunction
  description: >
    SYNGAP1 is expressed in GABAergic inhibitory interneurons as well as
    glutamatergic pyramidal neurons. Haploinsufficiency in medial ganglionic
    eminence-derived parvalbumin and somatostatin interneurons impairs inhibitory
    circuit development and produces abnormal cortical oscillatory dynamics,
    reducing effective inhibitory tone and contributing to the excitatory/inhibitory
    imbalance that drives network hyperexcitability in SRD.
  cell_types:
  - preferred_term: GABAergic Interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
  biological_processes:
  - preferred_term: GABAergic synaptic transmission
    term:
      id: GO:0051932
      label: synaptic transmission, GABAergic
    modifier: DECREASED
  downstream:
  - target: Neuronal Hyperexcitability
    description: Reduced interneuron-mediated inhibition shifts the cortical excitatory/inhibitory balance toward hyperexcitability and seizure susceptibility.
  evidence:
  - reference: PMID:37558489
    reference_title: "Interneuron-Targeted Disruption of SYNGAP1 Alters Sensory Representations in the Neocortex and Impairs Sensory Learning."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SynGAP plays a critical role in the function of GABAergic inhibitory interneurons as well as glutamatergic pyramidal neurons in the neocortex"
    explanation: Mouse study establishing that SynGAP function in inhibitory interneurons contributes to cortical circuit function, supporting an inhibitory-side mechanism distinct from the glutamatergic arm.
  - reference: PMID:39406516
    reference_title: "Developmental Syngap1 Haploinsufficiency in Medial Ganglionic Eminence-Derived Interneurons Impairs Auditory Cortex Activity, Social Behavior, and Extinction of Fear Memory."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice with prenatal-onset Syngap1 haploinsufficiency restricted to Nkx2.1-expressing neurons show abnormal cortical oscillations and increased entrainment induced by 40 Hz auditory stimulation but lack stimulus-specific adaptation"
    explanation: Mouse study showing Syngap1 haploinsufficiency restricted to MGE-derived (Nkx2.1-expressing) interneurons produces abnormal cortical oscillations, linking interneuron dysfunction to network-level alterations in SRD.
- name: Complement System Activation and Dysregulation
  description: >
    Aberrant activation of the complement cascade (C1q, C3, C5) leads to dysregulated
    complement-mediated signaling, driving both neuroinflammation and synaptic remodeling
    that directly contribute to seizure development and disease progression. Complement
    dysregulation is not merely an epiphenomenon of neuroinflammation but a potential
    driver of epileptogenesis.
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Complement Activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  - preferred_term: Regulation of Complement Activation
    term:
      id: GO:0030449
      label: regulation of complement activation
  downstream:
  - target: Neuroinflammation and Gliosis
    description: Complement dysregulation drives microglial C3 deposition and inflammatory mediator release, contributing to the neuroinflammatory cascade.
  - target: Synaptic Reorganization
    description: Complement-mediated C3b deposition and microglial-synaptic pruning alter synaptic structure, connectivity, and plasticity.
  evidence:
  - reference: PMID:42269875
    reference_title: "Complement System-Mediated Immunomodulation in Epilepsy: From Pathogenesis to Therapeutic Opportunities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Accumulating preclinical evidence indicates that abnormal complement activation contributes to epileptogenesis"
    explanation: Review synthesis establishing complement activation as a key driver of epileptogenesis, with focus on neuroinflammation, synaptic remodeling, and glial proliferation mechanisms.
- name: Post-Traumatic Transcriptomic Dysregulation
  description: >
    Traumatic brain injury (TBI) induces transcriptomic changes that create a pathological
    continuum toward post-traumatic epilepsy (PTE). Shared molecular signatures between TBI
    and PTE include dysregulation of immediate-early genes and MAPK signaling components,
    reflecting a common pathological trajectory from acute brain injury to chronic
    epileptogenesis. DUSP1 and EGR1 emerge as hub genes linking TBI and PTE, functioning
    at the intersection of neuroprotective and epileptogenic processes.
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Gene Expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: DYSREGULATED
  - preferred_term: MAPK Signaling
    term:
      id: GO:0000165
      label: MAPK cascade
  downstream:
  - target: DUSP1-Mediated MAPK Negative Regulation
    description: Trauma-induced DUSP1 upregulation suppresses excessive MAPK signaling and downstream inflammatory cascades.
  - target: EGR1-Mediated Neuroplasticity and Network Remodeling
    description: EGR1 transcriptional regulation drives both neuroprotective responses and paradoxically promotes epileptogenic circuit reorganization.
  evidence:
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Integrated bioinformatics analyses revealed significant transcriptomic similarities between TBI and PTE, highlighting shared molecular pathways and regulatory networks involved in disease progression. Among the identified hub genes, DUSP1 and EGR1 emerged as pivotal regulators, exhibiting significant differential expression across both TBI and PTE datasets."
    explanation: Preprint demonstrates shared gene expression signatures and molecular pathways linking TBI and PTE, identifying DUSP1 and EGR1 as key hub genes.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Experimental validation in the CCI-induced TBI mouse model further confirmed the dysregulated expression of these genes."
    explanation: Mouse CCI (controlled cortical impact) model validates DUSP1 and EGR1 dysregulation following traumatic brain injury.
- name: DUSP1-Mediated MAPK Negative Regulation
  description: >
    Dual-specificity phosphatase 1 (DUSP1) functions as a negative regulator of mitogen-activated protein
    kinase (MAPK) signaling through dephosphorylation of phosphorylated MAPK substrates. Following TBI,
    DUSP1 expression is significantly elevated, promoting neuroprotection by attenuating excessive MAPK
    pathway activation. DUSP1-mediated MAPK suppression reduces pro-inflammatory cytokine production,
    inhibits microglial and astrocytic activation, and mitigates secondary neuronal injury, thereby limiting
    the pathological cascade that contributes to post-traumatic epileptogenesis.
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: MAPK Cascades
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: DECREASED
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  downstream:
  - target: Neuroinflammation and Gliosis
    description: DUSP1-mediated MAPK suppression reduces glial activation and pro-inflammatory mediator release.
  evidence:
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DUSP1 functions as a negative regulator of mitogen-activated protein kinase (MAPK) signaling and has been shown to attenuate neuroinflammatory responses and promote neuroprotection following TBI"
    explanation: Preprint establishes DUSP1 as a negative MAPK regulator with neuroprotective role in TBI and potential PTE prevention.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By suppressing excessive inflammatory activation, DUSP1 may reduce secondary neuronal injury and potentially influence the development of PTE."
    explanation: Preprint documents DUSP1's role in limiting the pathological cascade from TBI to PTE.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "single-cell analysis of the CTD dataset revealed that both genes were predominantly expressed in microglia. This observation was further validated by immunofluorescence staining in a murine TBI model, which demonstrated significant cortical upregulation of DUSP1 and EGR1 accompanied by marked co-localization with IBA1-positive microglia."
    explanation: Demonstrates that DUSP1 is primarily expressed in microglia following TBI, supporting its role in microglial-mediated neuroprotection.
- name: EGR1-Mediated Neuroplasticity and Network Remodeling
  description: >
    Early growth response 1 (EGR1) is an immediate-early transcription factor that plays dual roles in
    post-traumatic brain pathophysiology. Following TBI, EGR1 expression is rapidly induced and promotes
    neuroprotection by regulating neurotrophic factor expression supporting neuronal survival, repair, and
    circuit reconstruction. However, excessive or sustained EGR1 activation also contributes to maladaptive
    synaptic reorganization, promoting neuronal hyperexcitability and epileptogenic network remodeling. This
    dual role positions EGR1 at the critical juncture between post-traumatic recovery and epileptogenesis,
    where dysregulation can shift the balance toward pathological outcomes.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Transcriptional Regulation
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  - preferred_term: Synaptic Plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
  - preferred_term: Neuronal Development
    term:
      id: GO:0048666
      label: neuron development
  downstream:
  - target: Synaptic Reorganization
    description: Aberrant EGR1-driven transcriptional remodeling promotes maladaptive synaptic reorganization and neuronal hyperexcitability.
  - target: Neuronal Hyperexcitability
    description: Sustained EGR1 activation reduces seizure thresholds and facilitates development of hyperexcitable neuronal circuits.
  evidence:
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "EGR1, an immediate-early transcription factor involved in neuronal activity-dependent gene regulation, plays a crucial role in neuronal plasticity, injury responses, and neural circuit remodeling"
    explanation: Preprint describes EGR1's central role in neuronal plasticity and circuit remodeling following injury.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TBI and contributes to neurorepair through the regulation of neurotrophic signaling pathways"
    explanation: Preprint establishes EGR1's role in neuroprotective repair mechanisms via neurotrophic signaling.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nevertheless, aberrant or sustained EGR1 activation may alter neuronal excitability and facilitate epileptogenic network remodeling, thereby promoting seizure susceptibility"
    explanation: Preprint identifies the dual role of EGR1 in both neuroprotection and epileptogenesis, positioning it at the critical juncture of recovery versus disease progression.
  - reference: PPR:PPR1261411
    reference_title: "Exploring the pathogenesis of traumatic brain injury and traumatic epilepsy based on bioinformatics analysis"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DUSP1 and EGR1 may represent key molecular nodes at the intersection of post-traumatic recovery and epileptogenesis."
    explanation: Preprint synthesis positioning DUSP1 and EGR1 at the critical juncture between neuroprotection and pathological epileptogenesis.

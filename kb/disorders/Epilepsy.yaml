      id: NCBITaxon:10090
      label: Mus musculus
  data_type: CHIP_SEQ
  sample_count: 12
  publication: PMID:42210782
  notes: Identified by GEO DataSets index search for Epilepsy (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001003922
  title: Meisal temporal lobe epilepsy sequencing study
  description: Our understanding of mesial temporal lobe epilepsy (MTLE) is one of the most common forms of drug-resistant epilepsy in humans. Using RNA- and small RNA-sequencing in parallel, we explored differentially expressed genes in the hippocampus and cortex of MTLE patients who had undergone surgical resection and non-epileptic controls. We found significant enrichment for astrocytic and microglial genes amongst up-regulated genes and down-regulation of neuron-specific genes in the hippocampus of MTLE patients. The transcriptome profile of the small RNAs reflected disease state more robustly than mRNAs, even across brain regions which show very little pathology.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Epilepsy"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001004012
  title: Familial adult myoclonic epilepsy in Sri Lankan and Indian families
  description: Familial adult myoclonic epilepsy 1 (FAME1), first recognised in Japanese families, was recently shown to be caused by a TTTCA repeat insertion in intron 4 of SAMD12 on chromosome 8. We performed whole genome sequencing on two families with FAME, one of Sri Lankan origin and the other of Indian origin, and identified a TTTCA repeat insertion in SAMD12 in both families. Haplotype analysis revealed that both families shared the same core ancestral haplotype reported in Japanese and Chinese families with FAME1. Mutation dating, based on the length of shared haplotypes, estimated the age of the ancestral haplotype to be approximately 670 generations, or 17,000 years old.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Epilepsy"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000091370
  title: Localized Proteomic Differences in Choroid Plexus of Alzheimers Disease and Epilepsy Patients
  description: Alzheimers disease and epilepsy are reciprocally related. Among sporadic AD patients, seizures occur in 10-22 percent, and subclinical epileptiform abnormalities occur in 22-5 percent. Cognitive deficits, with prominent short-term memory impairments, occur in most epilepsy patients. Common neurophysiological and molecular mechanisms occur in AD and epilepsy. Emerging evidence identifies choroid plexus pathological changes in aging, AD, and epilepsy.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Epilepsy"). Retrieved 2026-08-02.

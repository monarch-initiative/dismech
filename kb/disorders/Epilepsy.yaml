computational_models:
- name: Virtual Epilepsy Patient Cohort brain twins
  description: >-
    A cohort of 30 patient-specific whole-brain network models for drug-resistant
    epilepsy. Each twin combines T1 and diffusion MRI, reconstructed SEEG
    electrodes, structural connectivity, a regional Epileptor neural-mass model,
    and a patient-specific epileptogenic-zone hypothesis to generate spontaneous,
    stimulation-induced, and interictal brain activity.
  model_type: DIGITAL_TWIN
  repository_url: https://github.com/BalanceKey/virtual_epilepsy_patient_cohort
  model_id: GitHub:BalanceKey/virtual_epilepsy_patient_cohort@a99c88354015f4c961d49a92c076ed0b675c740b
  model_software: Python; The Virtual Brain; Epileptor; MNE-Python; NumPy; SciPy
  model_format: Python scripts with an external iEEG-BIDS virtual-patient dataset
  publication: PMID:40215461
  modeled_mechanisms:
  - target: Network Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Patient-specific regional excitability and structural coupling generate
      synthetic seizure-onset and propagation patterns that can be projected to
      each patient's reconstructed SEEG electrodes.
    limitations: >-
      Validation is retrospective and feature-level rather than a prospective
      demonstration that the model improves treatment decisions. SEEG only
      samples implanted regions, the Epileptor is a reduced neural-mass model,
      and the virtual cohort uses inferred epileptogenic-zone parameters as its
      synthetic ground truth.
    readouts:
    - name: Spatiotemporal spontaneous-seizure similarity
      target: Network Hyperexcitability
      direction: ALTERED
      interpretation: >-
        Correlation, channel overlap, and seizure-onset/propagation similarity
        compare each synthetic SEEG seizure with its empirical counterpart.
      evidence:
      - reference: PMID:40215461
        reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "We performed a permutation test for each metric (H0 : mean(VEC)  ≤  mean(RC), H1 : mean(VEC) > mean(RC)). The virtual epileptic cohort performs significantly better than the randomized cohort (p<0.0001)."
        explanation: Reports that patient-specific virtual seizures matched empirical spatiotemporal features better than twins assigned another patient's epileptogenic-zone hypothesis.
    - name: Interictal spike-count distribution
      target: Network Hyperexcitability
      direction: ALTERED
      interpretation: >-
        The fraction of detected spikes at each SEEG electrode tests whether the
        model reproduces the patient's spatial distribution of interictal activity.
      evidence:
      - reference: PMID:40215461
        reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "Permutation testing showed a significant difference between the two groups (H0: mean(VEC)  ≤  mean(RC); p<0.001)."
        explanation: Reports superior interictal spike-count agreement for patient-specific twins relative to randomized epileptogenic-zone controls.
    evidence:
    - reference: PMID:40215461
      reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Simulated signals based on patient-specific EZ captured spatio-temporal seizure generation and propagation."
      explanation: Directly supports using the virtual cohort to represent patient-specific seizure-network recruitment and spread.
  - target: Neuronal Hyperexcitability
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Bayesian inversion of spontaneous SEEG assigns each brain region an
      excitability parameter that determines whether it can autonomously generate
      seizures or is recruited through structural coupling.
    limitations: >-
      Regional excitability is a latent model parameter, not a direct cellular
      electrophysiology measurement, and different cellular mechanisms can map
      to the same inferred Epileptor value.
    readouts:
    - name: Regional Epileptor excitability parameter
      target: Neuronal Hyperexcitability
      direction: INCREASED
      interpretation: Regions above the model's critical excitability value are treated as autonomous seizure generators.
      evidence:
      - reference: PMID:40215461
        reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "For any given region, if x0>x0c the region can autonomously generate seizures, otherwise it remains in the normal state."
        explanation: Defines the direction and mechanistic interpretation of the regional excitability readout.
    evidence:
    - reference: PMID:40215461
      reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Based on the EZ hypothesis, we parametrized the model’s excitability for each region."
      explanation: Establishes that regional excitability is explicitly personalized from the epileptogenic-zone hypothesis.
  variables:
  - name: Regional excitability
    dataset_identifier: x0
    description: Epileptor excitability assigned to each parcellated brain region; the approximate critical value is -2.0.
    unit: dimensionless
  - name: Structural connectivity
    dataset_identifier: weights
    description: Patient-specific region-to-region coupling derived from diffusion-MRI tractography.
    unit: relative streamline weight
  - name: SEEG source-to-sensor gain
    dataset_identifier: gain
    description: Projection from simulated regional activity to reconstructed intracranial electrode contacts.
    unit: relative
  - name: Stimulation amplitude
    dataset_identifier: Iext
    description: Applied intracranial stimulation amplitude used in stimulated-seizure simulations.
    unit: mA
  findings:
  - statement: Patient-specific virtual seizures reproduced empirical spontaneous-seizure features better than randomized epileptogenic-zone assignments across the tested spatiotemporal metrics.
    evidence:
    - reference: PMID:40215461
      reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The virtual epileptic cohort performs significantly better than the randomized cohort (p<0.0001)."
      explanation: Summarizes the permutation-test result for spontaneous-seizure comparisons.
  - statement: For stimulated seizures, the patient-specific cohort outperformed randomized twins on most metrics, but seizure-propagation similarity was not significantly different.
    evidence:
    - reference: PMID:40215461
      reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The results demonstrate a significantly better performance for the virtual epileptic cohort compared to the randomized cohort, as shown in Fig 5A. However, here the seizure propagation metric (SP) showed no significant differences between the two cohorts."
      explanation: Preserves the reported negative result rather than treating all stimulated-seizure features as improved by personalization.
  - statement: In an independent retrospective VEP evaluation, predicted epileptogenic-zone precision was 64% and recall was 44% relative to the clinical definition; precision was higher in seizure-free patients.
    evidence:
    - reference: PMID:35604575
      reference_title: "Virtual epileptic patient brain modeling: Relationships with seizure onset and surgical outcome."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "VEP showed a precision of 64% and a recall of 44% for EZVEP detection compared to EZC . There was a better concordance of VEP predictions with clinical results, with higher precision (77%) in seizure-free compared to non-seizure-free patients."
      explanation: Provides an external clinical-cohort calibration of VEP epileptogenic-zone localization, including its limited recall.
  evidence:
  - reference: PMID:40215461
    reference_title: "Virtual epilepsy patient cohort: generation and evaluation."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "To address this, we generated and evaluated a cohort of 30 virtual epilepsy patients, using patient-specific anatomical and functional data from 30 real drug-resistant epilepsy patients."
    explanation: Establishes the cohort size, disease context, and patient-specific digital-twin design.
  notes: >-
    Repository inspected at commit a99c88354015f4c961d49a92c076ed0b675c740b
    (2025-04-24). Python byte-compilation succeeds, with two non-fatal
    invalid-escape SyntaxWarnings. End-to-end execution was not attempted because the
    repository has no dependency manifest or license, does not bundle the EBRAINS
    patient dataset, and relies on local data paths and The Virtual Brain. The
    README also names one interictal-generation script that is not present under
    that exact filename. These limitations constrain reproducibility despite the
    public source and separately deposited virtual cohort.
environmental:
- name: Traumatic Brain Injury
  notes: Major cause of acquired epilepsy
  evidence:
  - reference: PMID:38903174
    reference_title: "Risk of epilepsy after traumatic brain injury: a nationwide Norwegian matched cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cumulative incidence of epilepsy in the TBI group was 3.1%"
    explanation: "Nationwide matched cohort of 8,660 TBI patients against 84,024 controls; 5-year cumulative incidence was 4.0% versus 0.5% in controls, rising to 13.2% after severe TBI."
- name: CNS Infections
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  notes: Meningitis, encephalitis
  evidence:
  - reference: PMID:32989110
    reference_title: "Epilepsy after brain infection in adults: A register-based population-wide study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 10-year risk of epilepsy was 5.9%"
    explanation: "Population-wide matched cohort (12,101 exposed) giving a 10-year epilepsy risk of 5.9% versus 1.2% in controls, with per-infection rates of 4.1% after bacterial meningitis and 26.0% after herpes simplex encephalitis -- the two infections this annotation names."
- name: Stroke
  notes: Leading cause in older adults
  evidence:
  - reference: PMID:33619704
    reference_title: "Seizures and Epilepsy After Stroke: Epidemiology, Biomarkers and Management"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Stroke is the leading cause of seizures and epilepsy in older adults"
    explanation: "States the epidemiologic claim this annotation records. Graded OTHER because the quoted sentence is a review's summary of the field rather than a reported measurement."
- name: Brain Tumors
  notes: Can cause focal epilepsy
  evidence:
  - reference: PMID:28041673
    reference_title: "Epilepsy-related brain tumors"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tumor-related seizures are focal seizures with or without secondary generalization"
    explanation: "Supports the focal semiology this annotation specifies; the same review notes brain tumors are the second most common cause of focal intractable epilepsy in surgical series."
- name: Perinatal Injury
  notes: Hypoxic-ischemic encephalopathy
  evidence:
  - reference: PMID:30642234
    reference_title: "Pattern of Brain Injury Predicts Long-Term Epilepsy Following Neonatal Encephalopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the predominant pattern of Watershed and Basal Nuclei injury are valuable predictors for development of epilepsy in later childhood"
    explanation: "Cohort of 181 term newborns with hypoxic-ischemic encephalopathy, 17% of whom developed childhood epilepsy -- the specific perinatal injury this annotation names."
treatments:
- name: Antiseizure Medications
  description: First-line treatment - levetiracetam, lamotrigine, valproate, carbamazepine.
  evidence:
  - reference: PMID:30587993
    reference_title: "Levetiracetam for epilepsy: an evidence map of efficacy, safety and economic profiles."
    supports: SUPPORT
    snippet: "Meta-analysis of the included RCTs indicated that LEV was as effective as carbamazepine (CBZ; treatment for 6 months: 58.9% vs 64.8%, OR=0.76, 95% CI: 0.50-1.16; 12 months: 54.9% vs 55.5%, OR=1.24, 95% CI: 0.79-1.93), oxcarbazepine (57.7% vs 59.8%, OR=1.34, 95% CI: 0.34-5.23), phenobarbital (50.0% vs 50.9%, OR=1.20, 95% CI: 0.51-2.82) and lamotrigine (LTG; 61.5% vs 57.7%, OR=1.22, 95% CI: 0.90-1.66)."
    explanation: Meta-analysis demonstrates comparable efficacy of levetiracetam with other first-line antiseizure medications.
  - reference: PMID:41270420
    reference_title: "Clinical practice guidelines for the administration of third-generation anti-seizure medications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This guideline provides a detailed evaluation of the current evidence and treatment recommendations regarding third-generation ASMs."
    explanation: This clinical practice guideline provides current treatment recommendations for third-generation antiseizure medications in epilepsy management.
- name: Ketogenic Diet
  description: High-fat, low-carbohydrate diet effective for drug-resistant epilepsy.
  evidence:
  - reference: PMID:18456557
    reference_title: "The ketogenic diet for the treatment of childhood epilepsy: a randomised controlled trial."
    supports: SUPPORT
    snippet: "28 children (38%) in the diet group had greater than 50% seizure reduction compared with four (6%) controls (p<0.0001), and five children (7%) in the diet group had greater than 90% seizure reduction compared with no controls"
    explanation: Landmark RCT demonstrating significant seizure reduction with ketogenic diet in drug-resistant childhood epilepsy.
- name: Vagus Nerve Stimulation
  description: Implanted device for drug-resistant epilepsy.
  evidence:
  - reference: PMID:21838505
    reference_title: "Vagus nerve stimulation for epilepsy: a meta-analysis of efficacy and predictors of response."
    supports: SUPPORT
    snippet: "After VNS, seizure frequency was reduced by an average of 45%, with a 36% reduction in seizures at 3-12 months after surgery and a 51% reduction after > 1 year of therapy."
    explanation: Meta-analysis of 74 studies with 3321 patients demonstrates VNS efficacy in medically refractory epilepsy.
- name: Epilepsy Surgery
  description: Resection of seizure focus for drug-resistant focal epilepsy.
  evidence:
  - reference: PMID:11484687
    reference_title: "A randomized, controlled trial of surgery for temporal-lobe epilepsy."
    supports: SUPPORT
    snippet: "At one year, the cumulative proportion of patients who were free of seizures impairing awareness was 58 percent in the surgical group and 8 percent in the medical group (P<0.001)."
    explanation: Landmark RCT in NEJM demonstrating surgery is superior to prolonged medical therapy for temporal-lobe epilepsy.
- name: Responsive Neurostimulation
  description: Closed-loop brain stimulation for focal epilepsy.
  evidence:
  - reference: PMID:32690786
    reference_title: "Nine-year prospective efficacy and safety of brain-responsive neurostimulation for focal epilepsy."
    supports: SUPPORT
    snippet: "At 9 years, the median percent reduction in seizure frequency was 75% (p < 0.0001, Wilcoxon signed rank), responder rate was 73%, and 35% had a ≥90% reduction in seizure frequency."
    explanation: Nine-year prospective study demonstrates sustained efficacy and safety of brain-responsive neurostimulation.
- name: Deep Brain Stimulation
  description: Anterior thalamic stimulation for drug-resistant epilepsy.
  evidence:
  - reference: PMID:25663221
    reference_title: "Long-term efficacy and safety of thalamic stimulation for drug-resistant partial epilepsy."
    supports: SUPPORT
    snippet: "The median percent seizure reduction from baseline at 1 year was 41%, and 69% at 5 years. The responder rate (≥50% reduction in seizure frequency) at 1 year was 43%, and 68% at 5 years."
    explanation: SANTE trial 5-year follow-up demonstrates sustained efficacy of anterior thalamic deep brain stimulation.
- name: SYNGAP1 Allele-Upregulating Antisense Oligonucleotide
  description: >
    Allele-upregulating antisense oligonucleotides aim to compensate for SYNGAP1
    haploinsufficiency by increasing translation from the intact wild-type allele,
    rather than replacing or correcting the mutant transcript. ASO programs
    targeting SRD are in preclinical and early translational development as part
    of the SRD precision-therapy pipeline.
  treatment_term:
    preferred_term: antisense oligonucleotide therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antisense oligonucleotide
      term:
        id: NCIT:C1291
        label: Antisense Oligonucleotides
  target_mechanisms:
  - target: SYNGAP1 Haploinsufficiency
    treatment_effect: RESTORES
    description: >
      Allele-upregulating ASOs increase translation from the intact SYNGAP1 allele,
      partially compensating for the haploinsufficient lesion that drives downstream
      SynGAP loss.
    evidence:
    - reference: PMID:42161154
      reference_title: "SYNGAP1-related disorder: pathophysiology, epilepsy, cognitive and behavioral phenotypes, and precision therapeutic approaches."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "antisense oligonucleotides to upregulate the intact allele"
      explanation: Samanta 2026 review identifies allele-upregulating ASOs as a precision-therapy approach in development for SRD.
- name: AAV-Based SYNGAP1 Gene Replacement
  description: >
    Adeno-associated virus (AAV)-mediated delivery of a functional SYNGAP1
    transgene aims to restore SynGAP protein expression in target neurons.
    AAV gene replacement is a precision-therapy strategy in preclinical
    development for SRD.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: AAV gene replacement therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: SYNGAP1 Haploinsufficiency
    treatment_effect: RESTORES
    description: >
      AAV-delivered SYNGAP1 transgene restores SynGAP protein levels in target
      neurons, directly addressing the haploinsufficient molecular lesion.
    evidence:
    - reference: PMID:42161154
      reference_title: "SYNGAP1-related disorder: pathophysiology, epilepsy, cognitive and behavioral phenotypes, and precision therapeutic approaches."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "AAV-based gene replacement"
      explanation: Samanta 2026 review identifies AAV-based gene replacement among precision-therapy strategies in development for SRD.
- name: CRISPR-Mediated SYNGAP1 Transcriptional Activation
  description: >
    CRISPR activation (CRISPRa) using a catalytically inactive Cas9 fused to
    transcriptional activators is being developed to upregulate the intact
    SYNGAP1 allele in neurons. This complements ASO-based allele upregulation
    by acting at the transcriptional rather than translational level.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: CRISPR transcriptional activation therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: SYNGAP1 Haploinsufficiency
    treatment_effect: RESTORES
    description: >
      CRISPRa machinery recruits transcriptional activators to the wild-type
      SYNGAP1 locus, boosting transcription of the intact allele to compensate
      for haploinsufficiency.
    evidence:
    - reference: PMID:42161154
      reference_title: "SYNGAP1-related disorder: pathophysiology, epilepsy, cognitive and behavioral phenotypes, and precision therapeutic approaches."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CRISPR-mediated transcriptional activation"
      explanation: Samanta 2026 review identifies CRISPR-mediated transcriptional activation as a precision-therapy strategy under development for SRD.

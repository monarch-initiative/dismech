discussions:
- discussion_id: lds1_sex_specific_aortic_risk
  kind: KNOWLEDGE_GAP
  status: RESOLVED
  prompt: >-
    Is aortic risk in TGFBR1-related Loeys-Dietz syndrome sex-dependent, and
    in which direction?
  attaches_to:
  - pathophysiology#Aortic and Arterial Dissection
  rationale: >-
    Reviews cited a family study reporting that in TGFBR1 families men are
    more likely than women to develop aneurysm and dissection and die younger,
    whereas in TGFBR2 disease the documented higher-risk group is women of
    small body size, which is what the 2022 ACC/AHA guideline encodes as a
    high-risk feature for TGFBR2 only. A sex effect bears on whether male
    TGFBR1 carriers warrant the lower 4.0 cm threshold.
  resolved_date: "2026-10-14T00:00:00Z"
  resolution_note: >-
    Two independent primary cohorts agree on the direction. The family study
    (30 TGFBR1 versus 77 TGFBR2 carriers) found sex differences in
    presentation and survival in TGFBR1 but not TGFBR2 families, with men
    dying younger. The Montalcino Aortic Consortium registry (176 TGFBR1, 265
    TGFBR2 carriers) found more type A dissection (30% vs 12%) and more aortic
    events (52% vs 30%) in male than female TGFBR1 carriers, and no sex effect
    in TGFBR2. The registry found no dissection at or below 45 mm in TGFBR1
    carriers of either sex, so the sex effect concerns event frequency rather
    than a lower dissection diameter, and the registry authors suggested a
    less aggressive strategy may be pursued in women with TGFBR1 variants.
    Both studies are retrospective; the registry describes its analyses as
    exploratory, and neither tested a sex-specific surgical threshold.
  evidence:
  - reference: PMID:19542084
    reference_title: "Analysis of multigenerational families with thoracic aortic aneurysms and dissections due to TGFBR1 or TGFBR2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Significant differences were identified in clinical presentation and
      survival based on gender in TGFBR1 families but not in TGFBR2 families.
    explanation: >-
      Primary family study establishing a TGFBR1-specific sex effect.
  - reference: PMID:27879313
    reference_title: "International Registry of Patients Carrying TGFBR1 or TGFBR2 Mutations: Results of the MAC (Montalcino Aortic Consortium)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, TGFBR1 males had a greater aortic risk than females, whereas
      TGFBR2 males and females had a similar aortic risk.
    explanation: >-
      Registry replication of the male-biased aortic risk in TGFBR1 carriers.
  - reference: PMID:27879313
    reference_title: "International Registry of Patients Carrying TGFBR1 or TGFBR2 Mutations: Results of the MAC (Montalcino Aortic Consortium)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A less aggressive surgical management strategy could be pursued in the
      absence of any familial event or rapid increase in aortic diameter,
      especially in women harboring TGFBR1 mutations.
    explanation: >-
      The registry authors' management inference from the sex effect; a
      proposal, not a tested threshold.
  - reference: PMID:23856125
    reference_title: "Molecular mechanisms of thoracic aortic dissection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In familial cases of TAAD that involve TGFBR1 mutations, men appear more
      likely to develop aortic aneurysms and dissections than women, and men
      tend to die younger than women
    explanation: >-
      Review statement of a male-biased aortic risk in TGFBR1 families.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The freedom from aortic dissection (AD) after the initial surgery was
      also lower in female patients with TGFBR2 mutation than in other patients
      (p = 0.025).
    explanation: >-
      In this surgical series the higher-risk women carried TGFBR2, not TGFBR1,
      variants, consistent with the registry contrast.
  - reference: PMID:40482834
    reference_title: "Sex-based differences in patients with Loeys-Dietz syndrome: An analysis of arteriopathies and surgical interventions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Type A and B aortic dissections were also more common in males (21.3 %
      vs. 6.4 %, p = 0.036).
    explanation: >-
      A single-centre series of 94 patients pooled across all Loeys-Dietz
      genes also found a male excess of dissection; it is not split by gene.

      Reducing haemodynamic stress is intended to slow aortic dilation.
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To lessen hemodynamic stress on the aorta, beta blockers are used.
    explanation: >-
      Guideline rationale for beta blockade in Loeys-Dietz syndrome.
- name: Prophylactic Aortic Root Replacement
  description: >-
    Elective (preferably valve-sparing) replacement of the aortic root and
    ascending aorta before dissection. The 2022 ACC/AHA guideline gives a
    TGFBR1-specific threshold: an aortic diameter of 4.5 cm or more without
    high-risk features (class 1), or 4.0 cm or more when high-risk features
    are present (class 2b) - high-risk features being severe extra-aortic
    features (craniosynostosis, cleft palate, hypertelorism, bifid uvula,
    marked tortuosity, widened scars, translucent skin), certain variants,
    family history of dissection, or growth above 0.3 cm per year. The earlier
    primer recommended 4.0 cm for adults with LDS1 or LDS2. Replacement of the
    intact arch, descending or abdominal aorta at 4.5 cm may be considered.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    located_in:
      preferred_term: aorta
      term:
        id: UBERON:0000947
        label: aorta
  target_mechanisms:
  - target: Aortic and Arterial Dissection
    treatment_effect: INHIBITS
    description: >-
      Replacing the dilated segment removes the aorta at risk of dissection.
    evidence:
    - reference: PMID:36322642
      reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In patients with Loeys-Dietz syndrome, prophylactic aortic root
        replacement for aneurysm disease prevents type A aortic dissection and
        improves outcomes.
      explanation: >-
        Guideline statement that prophylactic root replacement prevents type A
        dissection.
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "1 | C-LD2 | TGFBR1 | No | ≥4.5"
    explanation: >-
      Table 11 row: for TGFBR1 without high-risk features, surgery at an aortic
      diameter of 4.5 cm or more (class 1, level C-LD).
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "2b | C-EO2 | TGFBR1 | Yes | ≥4.0"
    explanation: >-
      Table 11 row: for TGFBR1 with high-risk features, surgery at 4.0 cm or
      more (class 2b, expert opinion).
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aortic surgery may be recommended at smaller aortic diameters in
      Loeys-Dietz syndrome attributable to TGFBR1 and TGFBR2 pathogenic
      variants when there are features that associate with a higher risk of
      aortic dissection
    explanation: >-
      Table 11 footnote defining when the lower threshold applies.
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Loeys-Dietz syndrome attributable to a pathogenic variant
      in TGFBR1, TGFBR2, or SMAD3, surgery to replace the intact aortic arch,
      descending aorta, or abdominal aorta at a diameter of ≥4.5 cm may be
      considered
    explanation: >-
      Distal-aorta threshold naming TGFBR1.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For adults with LDS 1 or 2, this includes surgical repair of the aortic
      root once the maximal dimension of the aortic root reaches 4.0 cm.
    explanation: >-

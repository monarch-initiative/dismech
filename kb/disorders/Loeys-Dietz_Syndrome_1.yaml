genetic:
- name: TGFBR1
  gene_term:
    preferred_term: TGFBR1
    term:
      id: hgnc:11772
      label: TGFBR1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    TGFBR1 (9q22.33) encodes the type I TGF-beta receptor. TGFBR1 accounts for
    roughly 20-25% of Loeys-Dietz syndrome overall. LDS alleles are
    heterozygous, mostly missense, concentrated in the serine/threonine kinase
    domain. ClinGen classifies TGFBR1 as Definitive for autosomal dominant
    Loeys-Dietz syndrome, but that assertion is recorded against the umbrella
    MONDO:0018954, not against MONDO:0012212, so no gene_disease_validity tier
    is copied onto this entry; no LDS1-specific ClinGen curation is in the
    cache. ClinGen separately classifies TGFBR1 for multiple self-healing
    squamous epithelioma (MONDO:0007566), a distinct disorder caused by
    truncating alleles.
  variants:
  - name: M318R
    description: >-
      Kinase-domain missense allele from the founding report; modelled by the
      Tgfbr1 M318R/+ knock-in mouse.
  - name: A230T
    description: >-
      Missense allele modelled in patient-derived and gene-edited human iPSC
      vascular grafts, which dilated in vivo.
  evidence:
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced all exons of TGFBR1 and found a unique missense mutation in
      each family (families 7–10) that affected evolutionarily conserved
      residues
    explanation: >-
      Founding identification of TGFBR1 mutations in Loeys-Dietz families.
  - reference: PMID:29270370
    reference_title: "Differences in manifestations of Marfan syndrome, Ehlers-Danlos syndrome, and Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "LDS type 1 TGFBR1 20–25%"
    explanation: >-
      Review subtype table giving the TGFBR1 share of Loeys-Dietz syndrome.
  - reference: PMID:31569402
    reference_title: "Genotypic Categorization of Loeys-Dietz Syndrome Based on 24 Novel Families and Literature Data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of variants affected the TGFBR1 (9/24) and TGFBR2 (10/24)
      genes
    explanation: >-
      Independent cohort: TGFBR1 in 9 of 24 LDS families.
  - reference: CGGV:assertion_8a546ce2-432c-4c8a-90e5-97293d7938be-2019-03-27T160000.000Z
    reference_title: "TGFBR1 / Loeys-Dietz syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TGFBR1 | HGNC:11772 | Loeys-Dietz syndrome | MONDO:0018954 | AD | Definitive"
    explanation: >-
      ClinGen Definitive classification for TGFBR1 in autosomal dominant
      Loeys-Dietz syndrome. The record's disease is the umbrella
      MONDO:0018954, so it supports the gene-disease relationship but its tier
      is not copied into gene_disease_validity for MONDO:0012212.
differential_diagnoses:
- name: Marfan syndrome
  disease_term:
    preferred_term: Marfan syndrome
    term:
      id: MONDO:0007947
      label: Marfan syndrome
  description: >-
    FBN1-related Marfan syndrome shares aortic root aneurysm and marfanoid
    skeletal features, and TGFBR1 disease was historically grouped with it.
  distinguishing_features:
  - >-
    Hypertelorism, bifid uvula or cleft palate, craniosynostosis and
    generalized arterial tortuosity point to Loeys-Dietz syndrome.
  - >-
    Dissection occurs at smaller aortic diameters and younger ages in TGFBR1
    disease, so the distinction changes surgical thresholds.
  - >-
    Molecular testing is definitive (FBN1 versus TGFBR1).
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      aortic dissection can occur at smaller aortic diameters and at younger
      ages than observed in Marfan syndrome
    explanation: >-
      The management-relevant difference from Marfan syndrome.
- name: Loeys-Dietz syndrome 2
  disease_term:
    preferred_term: Loeys-Dietz syndrome 2
    term:
      id: MONDO:0012427
      label: Loeys-Dietz syndrome 2
  description: >-
    TGFBR2-related Loeys-Dietz syndrome is the closest sibling and clinically
    overlapping; craniofacial features, tortuosity and skeletal features are
    similar in paediatric genotype comparisons.
  distinguishing_features:
  - >-
    Molecular testing is required; the genes are distinguished only by
    sequencing.
  - >-
    TGFBR2 carriers show larger paediatric aortic z-scores, uniformly grade III
    cystic medial necrosis and more type B dissection; women with TGFBR2
    variants and small body size are a recognised high-risk group.
  evidence:
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of arterial tortuosity, craniofacial features, pectus
      deformities, dural ectasia, and scoliosis was similar between the groups
    explanation: >-
      Extra-aortic features do not separate the TGFBR1 and TGFBR2 groups.
  - reference: PMID:33408307
    reference_title: "Surgical Outcome and Histological Differences between Individuals with TGFBR1 and TGFBR2 Mutations in Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS patients with TGFBR2 mutations had higher grade of CMN than those of
      TGFBR1 mutations.
    explanation: >-
      Histological difference between the two subtypes.
- name: Multiple self-healing squamous epithelioma
  disease_term:
    preferred_term: multiple self-healing squamous epithelioma
    term:
      id: MONDO:0007566
      label: multiple self-healing squamous epithelioma
  description: >-
    An autosomal dominant skin-cancer predisposition also caused by germline
    TGFBR1 variants. It is distinguished by allele class: truncating alleles
    cause it, whereas LDS alleles are non-truncating, and the vascular
    TGFBR1 disorders do not confer its cancer risk. A positive TGFBR1 result
    therefore has to be interpreted by variant class.
  distinguishing_features:
  - >-
    Truncating (nonsense, frameshift) TGFBR1 alleles versus missense or
    in-frame alleles in Loeys-Dietz syndrome.
  - >-
    Self-healing cutaneous squamous epitheliomas rather than aortopathy.
  evidence:
  - reference: PMID:40612107
    reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Interestingly, while MSSE predisposes to skin cancer, these vascular
      conditions do not appear to confer cancer risk.
    explanation: >-
      States the clinical divergence between MSSE and the vascular TGFBR1
      disorders.
treatments:
- name: Angiotensin Receptor Blocker Therapy
  description: >-
    An angiotensin receptor blocker, alone or with a beta blocker, at
    maximally tolerated doses is reasonable in Loeys-Dietz syndrome (ACC/AHA
    class 2a). Beyond lowering haemodynamic stress, the TGFBR1 knock-in mouse
    provides a pathway rationale: losartan's efficacy tracked suppression of
    aortic SMAD2 phosphorylation and TGF-beta1 expression, and second heart
    field-derived smooth muscle cells of the Tgfbr1 mouse up-regulate the
    angiotensin II type 1 receptor. There are no randomised trials in
    Loeys-Dietz syndrome. Angiotensin receptor blockers are contraindicated in
    pregnancy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Paradoxical Aortic-Wall TGF-beta Signaling Upregulation
    treatment_effect: INHIBITS
    description: >-
      Losartan suppresses aortic-wall SMAD2 phosphorylation and TGF-beta1
      expression in the LDS knock-in mice.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, suppression of Smad2 phosphorylation and TGF-β1 expression
        correlated with the therapeutic efficacy of the angiotensin II type 1
        receptor antagonist losartan.
      explanation: >-
        Links losartan's benefit to inhibition of the paradoxical signalling
        node in the Tgfbr1/Tgfbr2 knock-in mice.
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Loeys-Dietz syndrome, treatment with a beta blocker or an
      ARB (unless contraindicated), or both, in maximally tolerated doses, is
      reasonable.
    explanation: >-
      Guideline medical-therapy recommendation for Loeys-Dietz syndrome.
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are no randomized trials of medications to reduce aortic growth or
      the risk of aortic dissection in patients with Loeys-Dietz syndrome.
    explanation: >-
      Records the evidence limitation behind the recommendation.
- name: Beta-Blocker Therapy
  description: >-
    Beta-adrenergic blockade to lessen haemodynamic stress on the aorta, alone
    or combined with an angiotensin receptor blocker.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Progressive Aortic and Arterial Dilation

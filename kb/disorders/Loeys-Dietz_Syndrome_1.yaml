- name: Aortic Medial Degeneration and Wall Weakening
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening"
  description: >-
    LDS aortas show a diffuse medial degeneration - subtle diffuse elastic
    fibre fragmentation, extracellular matrix deposition and increased medial
    collagen - rather than the cystic pattern typical of Marfan syndrome. The
    lesion is graded milder in TGFBR1 than in TGFBR2 carriers: in a surgical
    series 67% of TGFBR1 specimens showed cystic medial necrosis and only one
    reached grade III, against grade III in every TGFBR2 specimen. In a human
    iPSC vascular-graft model the TGFBR1 A230T allele produced defective
    extracellular matrix formation and decreased collagen hydroxylation, a
    collagen-maturation defect that complements the signalling account.
  biological_processes:
  - preferred_term: elastic fiber assembly
    term:
      id: GO:0048251
      label: elastic fiber assembly
    modifier: DECREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198

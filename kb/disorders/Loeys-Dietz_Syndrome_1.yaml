definitions:
- name: Molecular and clinical diagnosis
  definition_type: DIAGNOSTIC_CRITERIA
  description: >-
    Loeys-Dietz syndrome is diagnosed either clinically, in a proband with
    characteristic findings, or by a heterozygous pathogenic variant in one of
    the autosomal dominant LDS genes found in a proband with aortic root
    enlargement, type A dissection, other characteristic features or a family
    history of LDS. A heterozygous pathogenic TGFBR1 variant defines subtype 1.
    The revised nosology proposed by MacCarrick et al. treats an LDS-gene
    mutation together with documented aortic root enlargement or dissection as
    diagnostic irrespective of the severity of systemic features.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of LDS is established in (1) a proband with characteristic
      clinical findings or (2) by the identification of a heterozygous
      pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, or TGFBR2 or
      biallelic pathogenic variants in IPO8 in a proband with aortic root
      enlargement, type A dissection, other characteristic clinical features of
      LDS, or a family history of an established diagnosis of LDS.
    explanation: >-
      GeneReviews names TGFBR1 among the genes whose heterozygous pathogenic
      variants establish the molecular diagnosis, conditional on the clinical
      context quoted.
  - reference: PMID:24577266
    reference_title: "Loeys-Dietz syndrome: a primer for diagnosis and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given that vascular disease is the major concern for this patient group,
      and that patients with mutations in TGFBR1, TGFBR2, SMAD3, or TGFB2 show
      more widespread and/or aggressive vascular disease when compared with
      Marfan syndrome or thoracic aortic aneurysm and dissection, irrespective
      of the severity of systemic features, we propose a revised nosology
    explanation: >-
      Source of the gene-based revised nosology in which a TGFBR1 mutation with
      vascular disease suffices, regardless of the craniofacial or cutaneous
      severity that defined the older clinical types.

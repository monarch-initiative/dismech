- name: Whole-Arterial-Tree Imaging Surveillance
  description: >-
    Baseline MRI or CT from head to pelvis, echocardiography of the aortic root
    and ascending aorta at least annually, and repeat angiographic imaging of
    the arterial tree, because aneurysm and dissection in TGFBR1 disease are not
    confined to the root.
  action_category: MONITORING
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with Loeys-Dietz syndrome, a baseline MRI or CT from head to
      pelvis is recommended to evaluate the entire aorta and its branches for
      aneurysm, dissection, and tortuosity.
    explanation: >-
      Guideline baseline-imaging recommendation.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiography to monitor the status of the aortic root and ascending
      aorta (at least annually) and magnetic resonance angiography or
      computerized tomography angiography to assess the entire arterial tree
      (at least every other year)
    explanation: >-
      GeneReviews surveillance intervals.
- name: Pregnancy Counselling and Pre-Conception Aortic Surgery
  description: >-
    Pregnancy and the postpartum period raise the risk of aortic dissection;
    in series of women with TGFBR1 or TGFBR2 variants, dissection complicated
    0-19% of pregnancies. For TGFBR1 carriers with an aortic diameter of 4.0
    cm or more, surgery before pregnancy may be considered, and aortic imaging
    is intensified during pregnancy and after delivery.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the Loeys-Dietz syndrome is attributable to pathogenic variants in
      TGFBR1, TGFBR2, or SMAD3, and the aortic diameter is ≥4.0 cm, surgery
      before pregnancy may be considered.
    explanation: >-
      TGFBR1-specific pre-conception surgical recommendation.
  - reference: PMID:36322642
    reference_title: "2022 ACC/AHA Guideline for the Diagnosis and Management of Aortic Disease: A Report of the American Heart Association/American College of Cardiology Joint Committee on Clinical Practice Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In series of women with TGFBR1 or TGFBR2 pathogenic variants, aortic
      dissection was reported in 0% to 19% of pregnancies.
    explanation: >-
      Pregnancy dissection risk in TGFBR1/TGFBR2 carriers.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Increased frequency of aortic imaging is recommended, both during
      pregnancy and in the weeks following delivery.
    explanation: >-
      GeneReviews peripartum imaging recommendation.
- name: Activity Restriction and Avoidance of Cardiovascular Stimulants
  description: >-
    Avoidance of contact and competitive sports, isometric exercise and agents

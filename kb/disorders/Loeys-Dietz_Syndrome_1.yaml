name: Loeys-Dietz Syndrome 1
creation_date: "2026-10-14T16:50:48Z"
category: Mendelian
description: >-
  Loeys-Dietz syndrome 1 (LDS1) is the TGFBR1-related subtype of Loeys-Dietz
  syndrome, an autosomal dominant heritable connective tissue disorder of the
  TGF-beta signalling pathway. TGFBR1 encodes the type I TGF-beta receptor, the
  serine/threonine kinase that phosphorylates SMAD2 and SMAD3 once the ligand
  has assembled a receptor complex. LDS-associated TGFBR1 alleles are mostly
  heterozygous missense variants, clustered in the intracellular kinase domain,
  that inactivate canonical signalling in reporter assays and confer a modest
  dominant-negative effect on the wild-type receptor; truncating TGFBR1 alleles
  are instead associated with a different disorder, multiple self-healing
  squamous epithelioma. Despite this loss-of-function genetics, aortic wall
  tissue shows paradoxically increased TGF-beta signalling (nuclear
  phosphorylated SMAD2, collagen and CTGF excess), and a Tgfbr1 M318R knock-in
  mouse reproduces both the paradox and the aortic root aneurysm. Clinically
  LDS1 combines aggressive aortic root aneurysm with dissection at smaller
  diameters and younger ages than in Marfan syndrome, widespread arterial
  tortuosity and extra-aortic arterial aneurysm, the craniofacial triad
  (hypertelorism, bifid uvula or cleft palate) with craniosynostosis,
  marfanoid skeletal features and cervical spine instability, and an allergic
  and inflammatory predisposition. Gene-based severity rankings place LDS1 with
  LDS2 at the severe end of the Loeys-Dietz spectrum, but direct
  TGFBR1-versus-TGFBR2 comparisons find somewhat milder aortic disease in TGFBR1 carriers -
  smaller paediatric aortic z-scores, less high-grade cystic medial necrosis,
  fewer type B dissections - and the 2022 ACC/AHA guideline sets a
  TGFBR1-specific root-replacement threshold of 4.5 cm, lowered to 4.0 cm when
  high-risk features are present. Aortic risk in TGFBR1 carriers is
  sex-dependent: in a multigenerational family study and in a 441-patient
  international registry, men had more aortic events and dissections than
  women, a difference not seen in TGFBR2 carriers, while overall survival did
  not differ between the two genes. This entry curates the TGFBR1 subtype; the
  shared Loeys-Dietz picture is curated in the umbrella entry Loeys-Dietz
  Syndrome and the conserved aortopathy mechanism in the
  `aortopathy_tgfbeta_dysregulation` module.

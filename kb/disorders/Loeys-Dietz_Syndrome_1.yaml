progression:
- phase: Childhood aortic disease
  age_range: Childhood to adolescence
  notes: >-
    In a paediatric genotype comparison, aortic surgery in TGFBR1 carriers was
    concentrated in late childhood, whereas age at surgery in TGFBR2 carriers
    was more variable; fewer TGFBR1 children had undergone aortic surgery (12%
    vs 47%).
  evidence:
  - reference: PMID:38774681
    reference_title: "Impact of Genotype-Phenotype Interactions on Cardiovascular Function in Paediatric Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with TGFBR1 were more likely to undergo aortic surgery in late
      childhood, whereas the age at aortic surgery in patients with TGFBR2 was
      more variable (IQR: 12.3-14.7 years vs 2.3-12.0 years, respectively).
    explanation: >-
      TGFBR1-specific timing of aortic surgery in childhood.
- phase: Adult aortic disease
  age_range: Adolescence to adulthood
  notes: >-
    In the international registry, survival of TGFBR1 carriers did not differ
    from that of TGFBR2 carriers (about 80% survival at 60 years); 19 of 176
    TGFBR1 carriers had died, at a median age of 28.4 years. Survival is
    better than in the first, severity-selected Loeys-Dietz series.
  evidence:
  - reference: PMID:27879313
    reference_title: "International Registry of Patients Carrying TGFBR1 or TGFBR2 Mutations: Results of the MAC (Montalcino Aortic Consortium)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients harboring a TGFBR1 mutation have similar survival rates (80%
      survival at 60 years)
    explanation: >-
      Registry survival estimate for TGFBR1 carriers.
  - reference: PMID:27879313
    reference_title: "International Registry of Patients Carrying TGFBR1 or TGFBR2 Mutations: Results of the MAC (Montalcino Aortic Consortium)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age of death was 28.4 years for TGFBR1 mutation patients and 34.8
      years for TGFBR2 (p=0.2).
    explanation: >-
      Median age at death among TGFBR1 carriers who died.
  - reference: PMID:27879313
    reference_title: "International Registry of Patients Carrying TGFBR1 or TGFBR2 Mutations: Results of the MAC (Montalcino Aortic Consortium)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The second striking observation in our cohort is that the observed
      survival is much better than was initially reported
    explanation: >-
      Pooled TGFBR1 and TGFBR2 comparison with the earlier series; attributed
      by the authors to ascertainment bias and improved care.
animal_models:
- name: Tgfbr1 M318R/+ knock-in mouse
  species: Mouse
  genotype: Tgfbr1 M318R/+ (heterozygous kinase-inactivating missense knock-in)
  publication: PMID:24355923
  modeled_mechanisms:
  - target: Paradoxical Aortic-Wall TGF-beta Signaling Upregulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Carries the human LDS1 founding allele and reproduces the progressive
      in vivo rise of aortic SMAD2 phosphorylation despite a reduced response
      of mutant cells to exogenous ligand.
    limitations: >-
      Models a single kinase-domain allele. The signalling readouts were
      reported jointly for the Tgfbr1 and Tgfbr2 knock-in strains, and the
      paradox is lineage-dependent within the aortic root, so a bulk aortic
      readout averages opposite changes in two smooth muscle lineages.
    readouts:
    - name: Aortic-wall Smad2 phosphorylation and TGF-beta target gene output
      target: Paradoxical Aortic-Wall TGF-beta Signaling Upregulation
      direction: INCREASED
      interpretation: >-
        Rising aortic pSmad2 and target-gene output track aneurysm severity.
      evidence:
      - reference: PMID:24355923
        reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Analysis of TGF-β signaling in the aortic wall in vivo revealed
          progressive upregulation of Smad2 phosphorylation and TGF-β target
          gene output, which paralleled worsening of aneurysm pathology
        explanation: >-
          Direct measurement of the readout in the knock-in aorta.
    evidence:
    - reference: PMID:24355923
      reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Knockin and transgenic mice, but not haploinsufficient animals,
        recapitulated the LDS phenotype.
      explanation: >-
        The knock-in, unlike simple haploinsufficiency, models LDS.
  - target: Progressive Aortic and Arterial Dilation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Develops aortic root dilation, which is rescued by deleting Smad2 from
      cardiac neural crest-derived smooth muscle cells.
    limitations: >-
      Extra-aortic arterial aneurysm and dissection, which drive human
      outcomes, are not the reported endpoints.
    evidence:
    - reference: PMID:30614814
      reference_title: "Lineage-specific events underlie aortic root aneurysm pathogenesis in Loeys-Dietz syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CNC-, but not SHF-specific, deletion of Smad2 preserved aortic wall
        architecture and reduced aortic dilation in this mouse model of LDS.
      explanation: >-
        Aortic dilation is a measured phenotype of the Tgfbr1 M318R/+ mouse.
experimental_models:
- name: hiPSC-derived bioengineered vascular graft, TGFBR1 A230T
  description: >-
    Bioengineered vascular grafts built from isogenic control, CRISPR-edited
    TGFBR1 A230T/+ and patient-derived (with gene-corrected control) hiPSC
    vascular smooth muscle cells, implanted into nude rat carotid arteries,
    where the variant grafts dilated over time.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: >-
    hiPSC-derived vascular smooth muscle cells, gene-edited (TGFBR1 A230T/+)
    and patient-derived with an isogenic corrected control
  culture_system: Bioengineered vascular graft implanted into nude rat carotid arteries
  publication: PMID:38718134
  modeled_mechanisms:
  - target: Aortic Medial Degeneration and Wall Weakening
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Variant grafts show defective extracellular matrix formation, decreased
      collagen hydroxylation and weaker mechanics, reproducing the wall
      weakening of this node.
    limitations: >-
      An engineered graft in a rat carotid, not a native aortic root, and a
      single allele. The mechanism it isolates is reduced collagen-modifying
      enzyme activity, not the excess TGF-beta signalling upstream of this node
      in the human aorta, so it does not test the paradox.
    readouts:
    - name: Graft burst pressure and suture retention strength
      target: Aortic Medial Degeneration and Wall Weakening
      direction: DECREASED
      interpretation: >-
        Mechanical weakening of the variant grafts.
      evidence:
      - reference: PMID:38718134
        reference_title: "Bioengineered vascular grafts with a pathogenic TGFBR1 variant model aneurysm formation in vivo and reveal underlying collagen defects."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The TGFBR1A230T variant led to impaired mechanical properties of BVGs,
          resulting in lower burst pressure and suture retention strength.
        explanation: >-
          Direct measurement of the mechanical readout.
    evidence:
    - reference: PMID:38718134
      reference_title: "Bioengineered vascular grafts with a pathogenic TGFBR1 variant model aneurysm formation in vivo and reveal underlying collagen defects."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        BVGs carrying the variant dilated over time in vivo, resembling human
        TAA formation.
      explanation: >-
        The variant graft dilates in vivo, supporting its relevance to the
        aortic wall weakening node.
notes: >-
  Nosology: "Loeys-Dietz syndrome type 1" has two senses. In Loeys et al. 2006
  (PMID:16928994) types I and II were clinical categories defined by
  craniofacial versus cutaneous severity, and probands of both types carried
  TGFBR1 or TGFBR2 mutations. In the later gene-based series used by MONDO,
  OMIM and this entry, LDS1 means TGFBR1-related disease. Figures reported for
  the clinical type I cohort (for example mean ages at surgery and death) are
  therefore not TGFBR1-specific and are not curated here. Most phenotype
  evidence for this subtype pools TGFBR1 and TGFBR2 carriers; such items are
  marked directness INDIRECT. No population prevalence specific to LDS1 was
  found: the PubMed query "TGFBR1 Loeys-Dietz prevalence" returned case
  series, reviews and registry analyses but no population estimate. Within
  the international registry TGFBR2 variants were about 50% more frequent
  than TGFBR1 variants, a relative frequency in referral centres rather than
  a prevalence.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    TGFBR1-related Loeys-Dietz syndrome is autosomal dominant. In the founding
    report three of four TGFBR1 families carried de novo mutations and the
    fourth showed segregation of R487P with disease; across Loeys-Dietz
    syndrome about three quarters of probands have a de novo variant, and each
    child of an affected individual has a 50% recurrence risk.
  evidence:
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDS caused by a pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1,
      or TGFBR2 is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states autosomal dominant inheritance for TGFBR1-related LDS.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations in families 7–9 occurred de novo, whereas mutation R487P
      segregated with disease in family 10 and was absent in 100 control
      chromosomes
    explanation: >-
      Families 7-10 of the founding report are the TGFBR1 families; the
      sentence documents both de novo occurrence and familial segregation of a
      TGFBR1 allele.
  - reference: PMID:20301312
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Approximately 75% of probands diagnosed with LDS have the disorder as the
      result of a de novo pathogenic variant; approximately 25% of individuals
      diagnosed with LDS have an affected parent.
    explanation: >-
      De novo fraction for the autosomal dominant LDS genes pooled; no
      TGFBR1-specific figure is given, hence INDIRECT.
pathophysiology:
- name: Heterozygous TGFBR1 Kinase-Domain Variant
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a heterozygous germline TGFBR1 variant. In
    Loeys-Dietz syndrome these are non-truncating - mostly missense or in-frame
    changes - concentrated in the serine/threonine kinase domain (the founding
    M318R and D400G alleles lie in it, T200I at the junction with the
    glycine-serine-rich domain, R487P just C-terminal to it). Tested LDS alleles
    inactivate canonical TGF-beta signalling and exert a modest
    dominant-negative effect on co-expressed wild-type receptor. The
    non-truncating spectrum is what separates LDS1 from multiple self-healing
    squamous epithelioma, which is caused by truncating TGFBR1 alleles.
  genes:
  - preferred_term: TGFBR1
    term:
      id: hgnc:11772
      label: TGFBR1
  molecular_functions:
  - preferred_term: TGF-beta type I receptor kinase activity
    term:
      id: GO:0004675
      label: transmembrane receptor protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced all exons of TGFBR1 and found a unique missense mutation in
      each family (families 7–10) that affected evolutionarily conserved
      residues
    explanation: >-
      The founding TGFBR1 families each carried a unique missense mutation at a
      conserved residue.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two missense mutations (M318R and D400G) occurred in the kinase domain
    explanation: >-
      Places the founding TGFBR1 alleles in the kinase domain.
  - reference: PMID:22414221
    reference_title: "TGFBR1 mutations associated with Loeys-Dietz syndrome are inactivating."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All of the mutations were found to be inactivating for canonical TGF-β
      signaling.
    explanation: >-
      Seven LDS-associated TGFBR1 substitutions tested in HEK293 reporter assays
      were all loss-of-function for canonical signalling, supporting the
      DECREASED kinase-activity modifier.
  - reference: PMID:22414221
    reference_title: "TGFBR1 mutations associated with Loeys-Dietz syndrome are inactivating."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In co-transfection experiments with equal amounts wild-type receptor, the
      LDS mutations were found to confer a modest dominant negative effect.
    explanation: >-
      The same alleles interfere modestly with wild-type receptor, so the
      lesion is not simple haploinsufficiency.
  - reference: PMID:40612107
    reference_title: "Decoding clinical diversity in monogenic TGFBR1 and TGFBR2 mutations: insights into the interplay of molecular mechanisms and hypomorphicity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      By contrast, MFS-related TGFBR1 mutations are not truncating, but rather
      consist mostly of missense mutations or in-frame deletions/duplications.
    explanation: >-
      The review contrasts the non-truncating TGFBR1 spectrum of the
      Marfan-related aortopathies, which it uses to include LDS, with the
      truncating alleles of multiple self-healing squamous epithelioma.
  downstream:
  - target: Impaired Cell-Autonomous TGF-beta Receptor Signaling
    description: >-
      Kinase-inactivating, mildly dominant-negative receptors reduce the
      ligand-evoked SMAD2/3 response of the cell that carries them.
  - target: Disrupted TGF-beta-Dependent Craniofacial, Skeletal and Cardiac Development
    description: >-
      The same receptor lesion perturbs TGF-beta-dependent morphogenesis,
      producing the developmental (craniofacial, skeletal, congenital heart)
      arm of the syndrome.
    evidence:
    - reference: PMID:15731757
      reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data definitively implicate perturbation of TGFbeta signaling in
        many common human phenotypes, including craniosynostosis, cleft palate,
        arterial aneurysms, congenital heart disease and mental retardation
      explanation: >-
        The founding TGFBR1/TGFBR2 report attributes the developmental
        phenotypes to perturbed TGF-beta receptor signalling.
  - target: TGF-beta Pathway Immune Dysregulation
    description: >-
      The receptor lesion is linked to an allergic, IgE-elevated immune
      phenotype, the basis of TGFBR1 deficiency's IUIS placement among the
      hyper-IgE syndromes.
- name: Impaired Cell-Autonomous TGF-beta Receptor Signaling
  biological_scale: CELLULAR
  description: >-
    Cells heterozygous for an LDS TGFBR1 allele respond less to exogenous
    TGF-beta in vitro, yet keep normal steady-state SMAD2 phosphorylation,
    which the knock-in study reads as chronic compensation. In the Tgfbr1
    M318R/+ mouse the defect is lineage-dependent: aortic root smooth muscle
    cells derived from the second heart field show impaired SMAD2/3 activation
    together with higher angiotensin II type 1 receptor expression and higher
    TGF-beta ligand expression, whereas neighbouring cardiac neural
    crest-derived cells retain signalling potential. This cell-level deficit
    and its compensations are what set up the tissue-level paradox.
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  cell_types:
  - preferred_term: second heart field-derived aortic smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  evidence:
  - reference: PMID:24355923
    reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While heterozygous mutant cells had diminished signaling in response to
      exogenous TGF-β in vitro, they maintained normal levels of Smad2
      phosphorylation under steady-state culture conditions, suggesting a
      chronic compensation.
    explanation: >-
      Cells from the Tgfbr1 and Tgfbr2 knock-in mice show the reduced
      ligand response with compensated steady-state signalling.
  - reference: PMID:30614814
    reference_title: "Lineage-specific events underlie aortic root aneurysm pathogenesis in Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Secondary heart field-derived (SHF-derived), but not neighboring cardiac
      neural crest-derived (CNC-derived), VSMCs showed impaired Smad2/3
      activation in response to TGF-β, increased expression of angiotensin II
      (AngII) type 1 receptor (Agtr1a), enhanced responsiveness to AngII, and
      higher expression of TGF-β ligands.
    explanation: >-
      In the Tgfbr1 kinase-inactivating (M318R) mouse the signalling deficit is
      confined to second heart field-derived smooth muscle cells, which also
      up-regulate the angiotensin II receptor and TGF-beta ligands.
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite evidence that receptors derived from selected mutated alleles
      cannot support TGFbeta signal propagation, cells derived from individuals
      heterozygous with respect to these mutations did not show altered
      kinetics of the acute phase response to administered ligand.
    explanation: >-
      Patient-derived heterozygous cells did not show an overt acute signalling
      defect, which is the human counterpart of the compensation described in
      the mouse.
  downstream:
  - target: Paradoxical Aortic-Wall TGF-beta Signaling Upregulation
    description: >-
      Compensatory ligand and angiotensin II receptor up-regulation, acting on
      cells that retain signalling potential, overshoots into excess aortic
      TGF-beta signalling.
    evidence:
    - reference: PMID:30614814
      reference_title: "Lineage-specific events underlie aortic root aneurysm pathogenesis in Loeys-Dietz syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        aortic root aneurysm predisposition in this LDS mouse model depends both
        on defective Smad signaling in SHF-derived VSMCs and excessive Smad
        signaling in CNC-derived VSMCs
      explanation: >-
        Links the cell-level deficit in one lineage to excessive signalling in
        the neighbouring lineage in the Tgfbr1 mouse.
- name: Paradoxical Aortic-Wall TGF-beta Signaling Upregulation
  biological_scale: TISSUE
  conforms_to: "aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation"
  description: >-
    Aortic tissue from TGFBR1/TGFBR2 patients shows nuclear enrichment of
    phosphorylated SMAD2 with excess collagen and connective tissue growth
    factor, and pSMAD2 immunostaining is increased in LDS ascending aortas. In
    Tgfbr1 knock-in mice, aortic-wall SMAD2 phosphorylation and TGF-beta target
    gene output rise progressively with aneurysm severity, coincide with
    TGF-beta1 up-regulation, and are suppressed by losartan in proportion to its
    efficacy; deleting Smad2 in the cardiac neural crest lineage preserves the
    aortic wall. The excess signalling is therefore placed upstream of the
    medial lesion. Most of the human tissue evidence pools TGFBR1 and TGFBR2
    patients.
  biological_processes:
  - preferred_term: SMAD protein signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: INCREASED
  - preferred_term: transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  cell_types:
  - preferred_term: cardiac neural crest-derived aortic smooth muscle cell
    term:
      id: CL:0000359
      label: vascular associated smooth muscle cell
  locations:
  - preferred_term: aorta
    term:
      id: UBERON:0000947
      label: aorta
  evidence:
  - reference: PMID:15731757
    reference_title: "A syndrome of altered cardiovascular, craniofacial, neurocognitive and skeletal development caused by mutations in TGFBR1 or TGFBR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      tissues derived from affected individuals showed increased expression of
      both collagen and connective tissue growth factor, as well as nuclear
      enrichment of phosphorylated Smad2, indicative of increased TGFbeta
      signaling
    explanation: >-
      Patient tissue in the founding TGFBR1/TGFBR2 cohort shows the
      high-TGF-beta signature; INDIRECT because the two genes are pooled.
  - reference: PMID:18852674
    reference_title: "Histopathologic findings in ascending aortas from individuals with Loeys-Dietz syndrome (LDS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      an immunohistochemical stain for pSmad2, a marker of TGFbeta activity, was
      significantly increased in LDS patients compared with controls
    explanation: >-
      Increased pSMAD2 in surgical LDS aortic root tissue from a TGFBR1/TGFBR2
      cohort; INDIRECT because results are not split by gene.
  - reference: PMID:24355923
    reference_title: "Angiotensin II-dependent TGF-β signaling contributes to Loeys-Dietz syndrome vascular pathogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Analysis of TGF-β signaling in the aortic wall in vivo revealed
      progressive upregulation of Smad2 phosphorylation and TGF-β target gene
      output, which paralleled worsening of aneurysm pathology and coincided
      with upregulation of TGF-β1 ligand expression.
    explanation: >-
      In vivo measurement of the paradox in LDS knock-in mice, including the
      Tgfbr1 strain.
  - reference: PMID:30614814
    reference_title: "Lineage-specific events underlie aortic root aneurysm pathogenesis in Loeys-Dietz syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CNC-, but not SHF-specific, deletion of Smad2 preserved aortic wall
      architecture and reduced aortic dilation in this mouse model of LDS.
    explanation: >-
      Removing Smad2 from the lineage with excess signalling rescues the aorta
      of Tgfbr1 M318R/+ mice, placing the excess signalling causally upstream.
  - reference: PMID:34807423
    reference_title: "Loeys-Dietz Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite the loss of function nature of these mutations, the
      patient-derived aortic tissues show evidence of increased (rather than
      decreased) TGFβ signalling.
    explanation: >-
      Review co-authored by Loeys and Dietz summarising the paradox across the
      LDS genes including TGFBR1.
  downstream:
  - target: Aortic Medial Degeneration and Wall Weakening
    description: >-
      Sustained excess TGF-beta signalling in the media drives the matrix
      remodelling, elastic fibre fragmentation and collagen deposition of the
      LDS aortic wall.
- name: Disrupted TGF-beta-Dependent Craniofacial, Skeletal and Cardiac Development
  biological_scale: ORGANISM
  description: >-
    TGF-beta receptor signalling is required for cranial suture, palatal,
    skeletal and cardiovascular morphogenesis. The founding TGFBR1 families
    showed hypertelorism, exotropia, micrognathia and retrognathia,
    craniosynostosis and marked aortic and carotid tortuosity; across LDS1 and
    LDS2, cleft palate and craniosynostosis, cervical spine malformation and
    instability, skeletal fragility, enamel defects and congenital heart
    defects (bicuspid aortic valve, atrial septal defect, patent ductus
    arteriosus) are more frequent than in the general population. Whether
    skeletal fragility and the dental phenotype are developmental or acquired
    is not established; they are placed on this node because both sources
    present them as part of the TGF-beta developmental phenotype.
  biological_processes:
  - preferred_term: cranial suture morphogenesis

- name: Genetic Counseling and Cascade Testing
  description: >-
    Each child of an affected individual has a 50% risk of inheriting the
    TGFBR1 variant; once it is known, at-risk relatives can be tested so that
    carriers enter cardiovascular surveillance.
  action_category: COUNSELING_INFORMATIONAL

    snippet: >-
      He had fever again at the 22nd day after the onset of illness
    explanation: Illustrates the delayed onset of the neurological form.
treatments:
- name: Supportive care
  description: >-
    There is no licensed specific antiviral therapy for human RVF. Management is
    supportive, with fluid and electrolyte management, management of bleeding
    and organ failure, and care in an appropriate isolation setting for
    hemorrhagic cases.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

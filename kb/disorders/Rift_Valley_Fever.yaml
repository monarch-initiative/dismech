name: Rift Valley Fever
creation_date: "2026-11-04T00:00:00Z"
category: Infectious
description: >-
  Rift Valley fever (RVF) is a mosquito-borne, zoonotic viral disease caused by
  Rift Valley fever virus (RVFV), a tri-segmented negative-sense RNA
  phlebovirus of the family Phenuiviridae, order Bunyavirales. It is a disease
  primarily of domestic ruminants in Africa and the Arabian Peninsula, in which
  it causes abortion storms and high neonatal mortality; humans are infected as
  an epizootic spillover, chiefly by bites of infected mosquitoes (notably
  floodwater Aedes, which maintain the virus transovarially, and Culex, which
  amplify epidemics) and by direct contact with the blood, tissues and aborted
  materials of viraemic livestock. The great majority of human infections are a
  self-limiting febrile illness, but a minority progress to one of three severe
  syndromes - a viral hemorrhagic fever with hepatic necrosis, a delayed
  retinitis that can cause permanent visual loss, and a meningoencephalitis.
  Large outbreaks follow periods of heavy rainfall and flooding that expand
  mosquito populations, which links RVF epidemiology to climate and makes it a
  recognised emerging and re-emerging arboviral threat. The severe hemorrhagic
  form converges on the shared vascular and hemostatic lesion of the viral
  hemorrhagic fevers.
disease_term:
  preferred_term: Rift Valley fever
  term:
    id: MONDO:0017880
    label: Rift valley fever
parents:
- Viral hemorrhagic fever
synonyms:
- RVF
- Rift valley fever
notes: >-
  No GeneReviews chapter exists for Rift Valley fever; it is a zoonotic
  arboviral infection rather than a Mendelian disorder, so the GeneReviews
  phenotype baseline does not apply. StatPearls covers it for orientation only.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The great majority of human infections are a self-limiting febrile illness,
    but a minority progress to a severe syndrome - hemorrhagic/hepatic disease,
    delayed sight-threatening retinitis, or meningoencephalitis - that carries a
    high case-fatality rate. In a large Kenyan outbreak cohort, about a quarter
    of acute infections were severe, defined by hemorrhagic manifestations or
    death.
  evidence:
  - reference: PMID:20682901
    reference_title: "Risk factors for severe Rift Valley fever infection in Kenya, 2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, 52 (26%) had severe RVF disease characterized by hemorrhagic manifestations or death
    explanation: >-
      Quantifies the severe-disease fraction among acute infections, the basis
      of the variable burden assessment.
infectious_agent:
- name: Rift Valley fever virus (RVFV)
  description: >-
    The etiological agent is Rift Valley fever virus (RVFV), an enveloped,
    tri-segmented, negative-sense RNA virus of the genus Phlebovirus, family
    Phenuiviridae, order Bunyavirales. Its three genome segments (L, M, S) are
    organised in an ambisense/negative-sense arrangement; the S segment encodes
    the nucleoprotein and the non-structural protein NSs, the principal
    virulence factor, which antagonises the host type I interferon response by
    suppressing host transcription - sequestering the p44 subunit of the
    transcription factor TFIIH and promoting proteasomal degradation of PKR.
  infectious_agent_term:
    preferred_term: Rift Valley fever virus
    term:
      id: NCBITaxon:11588
      label: Rift Valley fever virus
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The S-segment encodes N and NSs genes in an ambisense manner, the M-segment. NSm (NSm2), 78 kD (NSm1), Gn and Gc genes, and the L-segment, the RNA-dependent RNA polymerase (L) gene
    explanation: >-
      Establishes the tri-segmented (L, M, S) genome organisation of RVFV and
      the ambisense coding of the S segment.
transmission:
- name: Bite of infected mosquitoes
  description: >-
    Humans and livestock acquire RVFV principally through the bite of infected
    mosquitoes. Floodwater Aedes mosquitoes serve as both vector and reservoir,
    transmitting the virus transovarially so that infected eggs survive dry
    periods and hatch after heavy rains; Culex and other secondary vectors then
    amplify transmission during epizootics.
  evidence:
  - reference: PMID:36618346
    reference_title: Arm race between Rift Valley fever virus and host.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmitted by Aedes and Culex mosquitoes, RVFV spreads in larger geographic ranges due to climate change
    explanation: >-
      Identifies Aedes and Culex mosquitoes as the vectors and ties range
      expansion to climate, the basis of RVF's emerging status.
- name: Contact with blood and tissues of viraemic livestock
  description: >-
    Direct contact with the blood, body fluids, tissues and aborted fetal
    material of infected animals, principally during slaughter, butchering,
    birthing and handling of sick livestock, is a major route of human
    infection; herders, abattoir workers and veterinarians are at highest risk.
    Aerosol exposure in the laboratory and during slaughter is also documented.
  evidence:
  - reference: PMID:20682901
    reference_title: "Risk factors for severe Rift Valley fever infection in Kenya, 2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Independent risk factors for acute RVF infection were consuming or handling products from sick animals
    explanation: >-
      Identifies contact with products of sick animals as an independent risk
      factor for human RVF infection in a large outbreak cohort.
  - reference: PMID:20682901
    reference_title: "Risk factors for severe Rift Valley fever infection in Kenya, 2007."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Touching an aborted animal fetus was associated with severe RVF disease
    explanation: >-
      Links handling aborted animal material specifically to severe human
      disease, a route distinctive to this zoonosis.
  - reference: PMID:36618346
    reference_title: Arm race between Rift Valley fever virus and host.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Instead of mosquito bites, most human cases are caused by contact with infected animal fluids or tissues
    explanation: >-
      Supports direct animal-tissue contact as the predominant route of human
      infection.
agent_life_cycle:
  description: >-
    RVFV is maintained in an enzootic/epizootic cycle between mosquitoes and
    vertebrate amplifying hosts. Floodwater Aedes mosquitoes are the reservoir,
    carrying the virus transovarially through desiccation-resistant eggs; after
    heavy rainfall these hatch and the emerging infected mosquitoes feed on
    ruminants, which develop high-titre viraemia and amplify the virus,
    recruiting secondary (Culex) vectors into an explosive epizootic. Domestic
    ruminants (sheep, cattle, goats) are the principal amplifying hosts and the
    main source of human exposure; humans are incidental, dead-end hosts that do
    not maintain the cycle.
  hosts:
  - preferred_term: Domestic ruminant amplifying host (sheep, cattle, goats)
    role: amplifying host
    term:
      id: NCBITaxon:9895
      label: Bovidae
  - preferred_term: Human (incidental dead-end host)
    role: incidental (dead-end) host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  vectors:
  - Floodwater Aedes mosquitoes (vector and transovarial reservoir)
  - Culex mosquitoes (epidemic amplifying vector)
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      characterized as a high rate of abortion in pregnant ewes and high mortality of newborn lambs
    explanation: >-
      Documents domestic ruminants (sheep) as the severely affected amplifying
      hosts in which epizootics are recognised.
  - reference: PMID:36618346
    reference_title: Arm race between Rift Valley fever virus and host.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Transmitted by Aedes and Culex mosquitoes
    explanation: Confirms the mosquito vectors that maintain and amplify the cycle.
pathophysiology:
- name: RVFV Replication and NSs-Mediated Interferon Antagonism
  description: >-
    After inoculation RVFV replicates in cells at the site of infection and in
    the liver and spleen. Its non-structural protein NSs is the principal
    virulence factor: it suppresses host general transcription and blocks
    induction of type I interferon, allowing unchecked early viral replication
    and the high viraemia that drives severe disease.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: viral genome replication
    term:
      id: GO:0019079
      label: viral genome replication
  - preferred_term: NSs-mediated suppression of type I interferon induction
    modifier: DECREASED
    term:
      id: GO:0032480
      label: negative regulation of type I interferon production
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NSs is known to be a major virulence factor of RVFV
    explanation: Identifies NSs as the principal virulence factor of the virus.
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NSs induces the shut-down of host transcription, including transcription of both type-I IFN and ISGs mRNAs, to prevent antiviral responses. NSs also induces the degradation of PKR to prevent eIF2α-mediated host and viral translational shut-off
    explanation: >-
      Supports NSs-mediated suppression of type I interferon induction and the
      block of interferon-stimulated antiviral responses.
  downstream:
  - target: High Viremia and Hepatotropic Spread
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21666766
      reference_title: The pathogenesis of Rift Valley fever.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        the delayed IFN response was preceded by viremia in two of the three lethally-infected monkeys
      explanation: >-
        Links impaired/early-evaded interferon response to the high viraemia
        seen in lethal infection, supporting this causal step.
- name: High Viremia and Hepatotropic Spread
  description: >-
    Interferon antagonism permits rapid systemic dissemination with high-titre
    viraemia and preferential infection of the liver, the major target organ,
    where RVFV replicates chiefly in hepatocytes. The magnitude of viraemia
    correlates with progression to severe disease.
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  conforms_to: "viral_hemorrhagic_fever_syndrome#High Viremia and Vascular Target Infection"
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The liver is the major target organ of RVFV
    explanation: Establishes the liver as the principal target organ in RVFV infection.
  downstream:
  - target: Hepatocellular Necrosis
    causal_link_type: DIRECT
  - target: Endothelial Activation and Vascular Leak
    causal_link_type: DIRECT
  - target: Hepatitis
    causal_link_type: DIRECT
- name: Hepatocellular Necrosis
  description: >-
    Direct viral cytopathology and apoptosis of infected hepatocytes produce
    the midzonal to massive hepatic necrosis that is the pathological hallmark
    of fatal RVF, releasing transaminases and impairing synthesis of coagulation
    factors.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: hepatocyte apoptotic process
    modifier: INCREASED
    term:
      id: GO:0097284
      label: hepatocyte apoptotic process
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Postmortem examination shows diffuse necrosis of hepatocytes which more greatly affect the centrilobular area than the portal area
    explanation: >-
      Documents the hepatocellular necrosis with centrilobular predominance
      that is the pathological hallmark of fatal human RVF.
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      indicating that RVFV replication induces apoptosis in hepatocytes
    explanation: >-
      Supports hepatocyte apoptosis as a mechanism of the hepatic necrosis,
      shown by TUNEL staining in the mouse model.
  downstream:
  - target: Coagulopathy and Disseminated Intravascular Coagulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired hepatic synthesis of clotting factors
  - target: Jaundice
    causal_link_type: DIRECT
  - target: Elevated hepatic transaminases
    causal_link_type: DIRECT
- name: Endothelial Activation and Vascular Leak
  description: >-
    Systemic infection and the attendant cytokine response activate and damage
    the microvascular endothelium, increasing vascular permeability. This is the
    rate-limiting lesion shared with the other viral hemorrhagic fevers and the
    node through which the hemorrhagic form of RVF converges on that syndrome.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  conforms_to: "viral_hemorrhagic_fever_syndrome#Increased Vascular Permeability"
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      hemorrhage was induced by a combination of vascular endothelial damage and an inability to clot blood in response to the damage
    explanation: >-
      Supports vascular endothelial damage as a contributor to the bleeding
      diathesis, shown in experimentally infected sheep.
  downstream:
  - target: Coagulopathy and Disseminated Intravascular Coagulation
    causal_link_type: DIRECT
  - target: Hemorrhage
    causal_link_type: DIRECT
- name: Coagulopathy and Disseminated Intravascular Coagulation
  description: >-
    The combination of endothelial injury, impaired hepatic factor synthesis
    and platelet consumption produces a consumptive coagulopathy and
    disseminated intravascular coagulation, with falling platelet counts and
    deranged clotting that drive bleeding and multi-organ failure in severe RVF.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      die from renal failure or disseminated intravascular coagulation (DIC) accompanied by an elevation of ALT, AST, LDH or D-Dimer, or a decrease in platelet count
    explanation: >-
      Documents disseminated intravascular coagulation with raised D-dimer and
      falling platelets as a fatal pathway in severe human RVF.
  downstream:
  - target: Hemorrhage
    causal_link_type: DIRECT
  - target: Thrombocytopenia
    causal_link_type: DIRECT
  - target: Disseminated intravascular coagulation
    causal_link_type: DIRECT
- name: Delayed Retinitis
  description: >-
    One to three weeks after the acute febrile illness a minority of patients
    develop a macular and paramacular retinitis with retinal haemorrhage,
    vasculitis and oedema. It follows rather than accompanies the viraemia and
    is thought to be largely immune-mediated; macular involvement can leave a
    permanent central scotoma.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the affected eyes had macular edema with exudates containing a white mass covering the macular area with or without retinal hemorrhage, vasculitis
    explanation: >-
      Describes the macular retinitis with retinal haemorrhage and vasculitis
      that characterises the delayed ocular form.
  - reference: PMID:12539063
    reference_title: "Epidemic Rift Valley fever in Saudi Arabia: a clinical study of severe illness in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen patients had retinitis and 7 patients had meningoencephalitis as late complications in the course of the disease
    explanation: >-
      Documents retinitis as a late complication in a prospective cohort of
      severe human RVF, quantifying this delayed ocular form.
  downstream:
  - target: Retinal hemorrhage
    causal_link_type: DIRECT
  - target: Vision loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - macular and paramacular chorioretinal scarring
    evidence:
    - reference: PMID:21666766
      reference_title: The pathogenesis of Rift Valley fever.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In many cases, a complete recovery of vision does not occur, and chorioretinal scarring can remain in macular and paramacular areas
      explanation: >-
        Supports permanent visual loss resulting from residual macular
        chorioretinal scarring after the retinitis.
- name: Meningoencephalitis
  description: >-
    A separate delayed severe syndrome is a meningoencephalitis, appearing days
    to weeks after the acute phase, with neuronal infection and inflammation
    presenting as encephalitis with headache, confusion and focal deficits.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A group of RVF patients who died from typical hemorrhagic fever also had encephalitis in addition to hepatic and gastro-intestinal necroses
    explanation: >-
      Documents meningoencephalitis as a severe neuroinvasive form of human
      RVF, here co-occurring with the hemorrhagic form.
  - reference: PMID:12539063
    reference_title: "Epidemic Rift Valley fever in Saudi Arabia: a clinical study of severe illness in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen patients had retinitis and 7 patients had meningoencephalitis as late complications in the course of the disease
    explanation: >-
      Documents meningoencephalitis as a late complication in a prospective
      cohort of severe human RVF.
  downstream:
  - target: Encephalitis
    causal_link_type: DIRECT

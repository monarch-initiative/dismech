diagnosis:
- name: Serologic and molecular confirmation
  description: >-
    Human RVF is confirmed in the laboratory by serology and by molecular
    detection. IgM-capture ELISA detects the acute antibody response (with
    IgG for later or past infection), while reverse-transcription PCR detects
    viral RNA in serum during the short viraemic phase; virus isolation is also
    possible. In outbreak settings a case definition plus serologic confirmation
    is the usual basis of diagnosis.
  presence: Positive RVFV IgM/IgG serology or RVFV RNA by RT-PCR
  evidence:
  - reference: PMID:12539063
    reference_title: "Epidemic Rift Valley fever in Saudi Arabia: a clinical study of severe illness in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all were identified according to a strict case definition, were confirmed to have RVF by serologic testing
    explanation: >-
      Documents serologic testing as the confirmatory diagnostic basis in a
      prospective human RVF cohort.
progression:
- phase: Acute febrile illness
  notes: >-
    After a short incubation the illness begins abruptly with fever and
    constitutional symptoms. In the great majority of infections it is
    self-limiting and resolves without progressing to a severe syndrome.
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the illness starts suddenly, and the patients experience fever, rigor, nausea, vomiting, headache
    explanation: Describes the acute febrile onset that opens the clinical course.
- phase: Hemorrhagic/hepatic form
  notes: >-
    A minority progress within days to the hemorrhagic form with hepatic
    necrosis and coagulopathy; when fatal, death typically occurs within the
    first week of symptoms.
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In many cases, death occurs in 3 to 6 days after patients become symptomatic
    explanation: Gives the tempo of the fatal hemorrhagic/hepatic form.
- phase: Delayed ocular form (retinitis)
  notes: >-
    A delayed retinitis can appear from around disease onset up to weeks or
    months later, following rather than accompanying the acute viraemia, and may
    leave permanent visual loss.
  evidence:
  - reference: PMID:21666766
    reference_title: The pathogenesis of Rift Valley fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      occurring at various times after infection; e.g., from immediately after the disease onset to several weeks or months later
    explanation: Establishes the delayed, variable timing of the ocular form.
- phase: Delayed encephalitic form
  notes: >-
    A meningoencephalitic form appears days to weeks after the acute phase; in
    one described case neurological signs recurred around three weeks after
    onset.
  evidence:

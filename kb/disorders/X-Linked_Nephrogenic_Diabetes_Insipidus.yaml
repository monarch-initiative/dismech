      - reference: PMID:40102322
        reference_title: Construction of arginine vasopressin receptor 2-deficient rats by the rGONAD method.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Although they exhibited hydronephrosis-like kidneys, no glomerular or tubular damage
          was observed.
        explanation: The histological readout behind this link.

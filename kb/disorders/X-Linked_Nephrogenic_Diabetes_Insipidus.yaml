  downstream:
  - target: Failure of Medullary Countercurrent Urine Concentration
    causal_link_type: DIRECT
    description: >-
      The medullary osmotic gradient is still built, but an impermeable duct cannot
      equilibrate with it, so the gradient cannot be used to concentrate urine.
    evidence:
    - reference: PMID:34055061
      reference_title: Nephrogenic diabetes insipidus in children (Review).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Nephrogenic diabetes insipidus (NDI) is characterized by impaired urinary

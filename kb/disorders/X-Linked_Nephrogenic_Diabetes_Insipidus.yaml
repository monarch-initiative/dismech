    reference_title: Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nephrogenic diabetes insipidus (NDI) results from the inability of the late
      distal tubules and collecting ducts to respond to vasopressin.
    explanation: Locates the functional lesion at the late distal tubule and collecting duct.
- name: Failure of Medullary Countercurrent Urine Concentration
  description: >-
    Urine concentration depends on two things: a corticomedullary osmotic gradient
    built by countercurrent multiplication in the loops of Henle, and a collecting
    duct able to equilibrate with it. XNDI breaks only the second. This is worth
    stating explicitly because it is the reason XNDI is a pure water-handling disease
    with normal solute excretion, and the reason the washout of the gradient by very
    high tubular flow is a secondary aggravation rather than the primary defect.
  biological_scale: TISSUE
  locations:
  - preferred_term: renal medulla
    term:
      id: UBERON:0000362
      label: renal medulla
  biological_processes:
  - preferred_term: renal water homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0003091
      label: renal water homeostasis
  - preferred_term: transepithelial water transport in the medullary collecting duct
    modifier: DECREASED
    term:
      id: GO:0035377
      label: transepithelial water transport
  downstream:
  - target: Obligatory Hypotonic Free Water Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301356
      reference_title: Hereditary Nephrogenic Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Hereditary nephrogenic diabetes insipidus (NDI) is characterized by inability to
        concentrate the urine, which results in polyuria (excessive urine production) and
        polydipsia (excessive thirst).
      explanation: >-
        States that the inability to concentrate is what produces the excess urine
        production, which is the content of this edge.
  evidence:
  - reference: PMID:29797052
    reference_title: "Mammalian urine concentration: a review of renal medullary architecture and membrane transporters."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Central to this process of urine concentration is an osmotic gradient that
      increases from the corticomedullary boundary to the inner medullary tip.
    explanation: >-
      Establishes the gradient that the impermeable collecting duct is unable to
      exploit. Cited for the normal physiology of the step, not for any claim about
      XNDI.
- name: Obligatory Hypotonic Free Water Loss
  description: >-
    The organism-level consequence: a fixed, large output of dilute urine that
    continues irrespective of plasma osmolality or volume status. Because it is
    obligatory rather than regulated, thirst is the only defence, and an affected
    person is dependent on continuous access to water. Adolescents and adults may void
    10 to 15 litres a day.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: renal free water excretion
    modifier: INCREASED
    term:
      id: GO:0007588
      label: excretion
  downstream:
  - target: Polyuria
    causal_link_type: DIRECT
  - target: Hyposthenuria
    causal_link_type: DIRECT
  - target: Polydipsia
    causal_link_type: DIRECT
    description: Thirst is the compensatory response to the water deficit, not an independent lesion.
  - target: Hypernatremia
    causal_link_type: DIRECT
    description: >-
      Free water is lost in excess of solute, so plasma sodium rises whenever intake
      fails to keep pace - which in an infant depends entirely on a carer.
  - target: Dehydration
    causal_link_type: DIRECT
  - target: Nocturnal enuresis
    causal_link_type: DIRECT
    description: >-
      The obligatory output does not pause overnight, so nocturia and bed-wetting follow
      directly from it rather than from any behavioural or bladder-capacity problem.
  - target: Failure to thrive
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded with unknown intermediates deliberately. The association is well
      documented, but the route is not: a stomach filled with water displacing calories,
      anorexia and vomiting, and the metabolic cost of the water turnover are all
      plausible contributors and the cited sources do not apportion between them.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Same caveat. The height deficit persists after weight has recovered, which is
      itself an argument that it is not simply a caloric deficit, and no source cited
      here explains the difference.
  - target: Sustained High Urinary Tract Flow
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20301356
      reference_title: Hereditary Nephrogenic Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Short stature and secondary dilatation of the ureters and bladder from the high
        urine volume is common in untreated individuals.
      explanation: >-
        Attributes the tract consequences to the urine volume itself, which is what this
        edge asserts.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary nephrogenic diabetes insipidus (NDI) is characterized by inability to
      concentrate the urine, which results in polyuria (excessive urine production) and
      polydipsia (excessive thirst).
    explanation: >-
      States that the concentrating failure is what produces the polyuria and the
      compensatory polydipsia, which is the causal content of this node's outgoing
      edges.
- name: Sustained High Urinary Tract Flow
  description: >-
    A mechanical consequence of the urine output, and the one most specific to
    long-standing untreated disease. Decades of very high flow through an anatomically
    normal urinary tract dilate it: the bladder becomes large and trabeculated, the
    ureters dilate, and the renal pelvis follows, all without any obstruction at the
    bladder outlet. The dilatation is not harmless - poor drainage of a huge compliant
    bladder raises residual volume, predisposes to infection, and can itself impair
    renal function.
  biological_scale: ORGANISM
  downstream:
  - target: Megacystis
    causal_link_type: DIRECT
  - target: Bladder trabeculation
    causal_link_type: DIRECT
  - target: Hydroureter
    causal_link_type: DIRECT
  - target: Hydronephrosis
    causal_link_type: DIRECT
  - target: Chronic kidney disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Through the dilated, poorly draining tract rather than directly: the intermediate
      is obstructive-type uropathy with raised residual volume. Recorded with known
      intermediates because those steps are named in the cited series, not because the
      quantitative relationship is established.
    evidence:
    - reference: PMID:22498392
      reference_title: Nonobstructive urinary tract dilatation in children with diabetes insipidus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Urodynamics have shown the bladder itself to be compliant, but drainage is poor
        leading to further renal impairment and overflow incontinence.
      explanation: >-
        Names poor drainage as the step between the dilated tract and the renal
        impairment, which is the intermediate this edge claims.
  evidence:
  - reference: PMID:22498392
    reference_title: Nonobstructive urinary tract dilatation in children with diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high flow states caused the bladder to become trabeculated in the absence of
      infravesical obstruction. Urodynamics have shown the bladder itself to be
      compliant, but drainage is poor leading to further renal impairment and overflow
      incontinence.
    explanation: >-
      States the causal attribution to flow rather than obstruction, and the
      consequence for renal function, in the series that made the point.
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Short stature and secondary dilatation of the ureters and bladder from the high
      urine volume is common in untreated individuals.
    explanation: >-
      Attributes the ureteric and bladder dilatation specifically to the urine volume,
      and records that it is common rather than exceptional.
  - reference: PMID:27258490
    reference_title: "Congenital Nephrogenic Diabetes Insipidus Presented With Bilateral Hydronephrosis and Urinary Infection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographic examination revealed severe dilatation of bilateral renal pelvis,
      ureter, and bladder.
    explanation: >-
      Shows the full extent the dilatation can reach in untreated disease, involving
      the renal pelvis as well as the lower tract.
phenotypes:
- category: Renal
  name: Polyuria
  frequency: VERY_FREQUENT
  description: >-
    The cardinal manifestation and the one that defines the disease, present from
    birth. In an infant it is easy to miss because the nappy volume is not measured;
    in an older child or adult the output can reach 10 to 15 litres a day.
  phenotype_term:
    preferred_term: Polyuria
    term:
      id: HP:0000103
      label: Polyuria
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary nephrogenic diabetes insipidus (NDI) is characterized by inability to
      concentrate the urine, which results in polyuria (excessive urine production) and
      polydipsia (excessive thirst).
    explanation: GeneReviews names polyuria as a defining feature of the disease.
- category: Renal
  name: Polydipsia
  frequency: VERY_FREQUENT
  description: >-
    The compensatory response, and in an untreated patient the only thing standing
    between the obligatory water loss and hypernatraemic dehydration. A preverbal
    infant cannot act on it, which is why the infantile presentation is dehydration
    rather than thirst.
  phenotype_term:
    preferred_term: Polydipsia
    term:
      id: HP:0001959
      label: Polydipsia
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary nephrogenic diabetes insipidus (NDI) is characterized by inability to
      concentrate the urine, which results in polyuria (excessive urine production) and
      polydipsia (excessive thirst).
    explanation: GeneReviews names polydipsia as a defining feature.
- category: Renal
  name: Hyposthenuria
  frequency: VERY_FREQUENT
  description: >-
    Persistently dilute urine that does not concentrate on water deprivation and does
    not respond to desmopressin. The failure to respond to desmopressin is what
    separates nephrogenic from central diabetes insipidus at the bedside.
  diagnostic: true
  phenotype_term:
    preferred_term: Hyposthenuria
    term:
      id: HP:0003158
      label: Hyposthenuria
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nephrogenic diabetes insipidus (NDI) is characterized by impaired urinary
      concentrating ability, despite normal or elevated plasma concentrations of the
      antidiuretic hormone, arginine vasopressin (AVP).
    explanation: >-
      States the concentrating failure that hyposthenuria is the measurement of, and
      pairs it with the intact hormone level that makes the finding diagnostic of a
      nephrogenic rather than a central defect.
  - reference: PMID:7607658
    reference_title: Clinical phenotype of nephrogenic diabetes insipidus in females heterozygous for a vasopressin type 2 receptor mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximal urine osmolality in three female patients did not exceed 200 mosmol/kg and
      the absence of extra-renal responses to 1-desamino-8-D-arginine vasopressin was
      demonstrated in two of them.
    explanation: >-
      Puts a number on the concentrating ceiling. Measured in symptomatic female
      heterozygotes rather than in hemizygous males, which is a limitation of this
      particular figure.
- category: Metabolic
  name: Hypernatremia
  frequency: FREQUENT
  description: >-
    Hypernatraemia is the dangerous consequence, not the polyuria itself. It appears
    whenever intake cannot keep pace with the obligatory loss, which in practice means
    during any intercurrent illness, in hot weather, when water is withheld, or when
    an infant is nil by mouth for a procedure. Repeated episodes are the reason
    treatment of this disease is urgent rather than merely symptomatic.
  phenotype_term:
    preferred_term: Hypernatremia
    term:
      id: HP:0003228
      label: Hypernatremia
  sequelae:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neurodevelopmental consequence is attributed to the electrolyte disturbance
      itself. The intermediate steps between a hypernatraemic episode and permanent
      cognitive deficit are not established in this disease, and the cited review
      asserts the attribution without demonstrating the mechanism or quantifying the
      exposure needed.
    evidence:
    - reference: PMID:34055061
      reference_title: Nephrogenic diabetes insipidus in children (Review).
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Irreversible brain damage and cognitive deficit secondary to electrolyte
        imbalances may be present.
      explanation: >-
        This is the sentence that makes the causal claim, and it is hedged in the
        source ("may be present"), which is why the edge is recorded with unknown
        intermediates.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evaluation of at-risk infants as early as possible to allow for prompt diagnosis
      and treatment to reduce morbidity from hypernatremia, dehydration, and dilatation
      of the urinary tract.
    explanation: >-
      GeneReviews names hypernatraemia as a source of morbidity that early diagnosis
      exists to reduce.
- category: Constitutional
  name: Dehydration
  frequency: FREQUENT
  description: >-
    Rapid-onset severe dehydration, characteristically precipitated rather than
    spontaneous. GeneReviews names the three precipitants explicitly: illness, a hot
    environment, and the withholding of water.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected untreated infants usually have poor feeding and failure to thrive, and
      rapid onset of severe dehydration with illness, hot environment, or the
      withholding of water.
    explanation: >-
      Gives both the pediatric context and the specific precipitants, which is the
      clinically actionable part of this phenotype.
- category: Constitutional
  name: Vomiting
  frequency: FREQUENT
  description: >-
    Vomiting and anorexia were the leading presenting complaints in a 30-patient

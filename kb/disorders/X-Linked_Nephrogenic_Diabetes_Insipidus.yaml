- name: Indomethacin or Other NSAID
  description: >-
    A prostaglandin synthesis inhibitor used as the alternative third agent. It works -
    and is prescribed by 55 per cent of surveyed providers - but it is the contested
    part of the regimen: 43 per cent of providers who avoid it cite gastrointestinal and
    renal side effects, which in a child with an already compromised urinary tract is
    not a trivial concern. The rationale is that renal prostaglandins oppose the
    concentrating mechanism, so removing them helps; that rationale is not independently
    cited in this entry.

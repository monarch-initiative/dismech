- name: Avpr2-deficient rat (rGONAD)
  species: Rat
  genotype: Avpr2 knockout, generated by rat Genome-editing via Oviductal Nucleic Acid Delivery
  description: >-
    The model that supplies what the mouse could not. Unlike the constitutive Avpr2-null
    mouse, these rats survive weaning under normal rearing, so the chronic consequences
    are observable: polydipsia, polyuria, growth retardation, and hydronephrosis-like
    kidneys. Two of its findings bear directly on this entry's pathograph. First,
    aquaporin-2 was retained in the cytoplasm of collecting duct cells with its
    phosphorylation suppressed - a direct measurement of the node about trafficking and
    phosphorylation, which the mouse study could only address as preserved abundance. Second, the hydronephrosis-like kidneys showed no glomerular or tubular
    damage, which is the experimental version of the clinical claim that the tract
    dilatation is mechanical rather than a primary nephropathy. Hydrochlorothiazide
    reduced urine volume and improved urine osmolality in the model, so it also
    reproduces the therapeutic response.
  publication: PMID:40102322
  modeled_mechanisms:
  - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Directly measures both halves of this node in collecting duct cells - aquaporin-2
      held in the cytoplasm, and its phosphorylation suppressed.
    limitations: >-
      A whole-gene knockout rather than a human misfolding allele, so it models the
      consequence of absent receptor function and not the ER-retention route that produces
      it in most patients. Phosphorylation was reported as suppressed without the
      site-level detail that would tie it to Ser256 specifically.
    evidence:
    - reference: PMID:40102322
      reference_title: Construction of arginine vasopressin receptor 2-deficient rats by the rGONAD method.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Aquaporin-2 was retained in the cytoplasm of collecting duct cells, and its
        phosphorylation was suppressed.
      explanation: >-
        The measurement of this node in an animal, which no other model cited here provides.
    readouts:
    - name: Subcellular localization and phosphorylation of aquaporin-2 in collecting duct cells
      target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
      direction: DECREASED
      interpretation: >-
        Apical delivery and phosphorylation both reduced, with the channel held in the
        cytoplasm - the node's claim, measured.
      evidence:
      - reference: PMID:40102322
        reference_title: Construction of arginine vasopressin receptor 2-deficient rats by the rGONAD method.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Aquaporin-2 was retained in the cytoplasm of collecting duct cells, and its

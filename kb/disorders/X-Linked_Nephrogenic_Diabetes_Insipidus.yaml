- category: Renal
  name: Megacystis
  frequency: OCCASIONAL
  description: >-
    A greatly enlarged bladder. Urodynamic study shows it remains compliant, so the
    problem is not a stiff bladder but a very large one that empties badly, leaving
    significant post-void residuals. Management is to reduce urine output, void on a
    schedule, and catheterise when residuals are significant.
  phenotype_term:
    preferred_term: Megacystis
    term:
      id: HP:0000021
      label: Megacystis
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Without treatment, most patients fail to grow normally, and present with
      associated constipation, urological complication, megacystis, trabeculated
      bladder, hydroureter, hydronephrosis, and mental retardation.
    explanation: Lists megacystis among the urological complications.
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      treat hydronephrosis, hydroureter, and megacystis with medical management to
      reduce urine output and continuous or intermittent bladder catheterization when
      post-void urinary bladder residuals are significant
    explanation: >-
      The management recommendation, which also establishes that significant post-void
      residual is the clinical problem megacystis creates.
- category: Renal
  name: Bladder trabeculation
  frequency: OCCASIONAL
  description: >-
    Trabeculation of the bladder wall in the absence of any infravesical obstruction -
    the radiological appearance of obstruction produced by flow instead. Recognising
    this matters, because the reflex response to a trabeculated bladder is to look for
    a posterior urethral valve that is not there.
  phenotype_term:
    preferred_term: Bladder trabeculation
    term:
      id: HP:0032465
      label: Bladder trabeculation
  evidence:
  - reference: PMID:22498392
    reference_title: Nonobstructive urinary tract dilatation in children with diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high flow states caused the bladder to become trabeculated in the absence of
      infravesical obstruction.
    explanation: >-
      States that the trabeculation is flow-driven and that obstruction is absent,

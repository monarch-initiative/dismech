  - reference: PMID:10477148
    reference_title: Clinical presentation and follow-up of 30 patients with congenital nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients were on hydrochlorothiazide-amiloride treatment without significant

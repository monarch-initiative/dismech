  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of first treatment, 70 and 71% of children were below -2 standard

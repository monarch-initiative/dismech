- name: Genetic Counselling and Testing of At-Risk Relatives
  description: >-
    Counselling follows ordinary X-linked logic, with the caveat that a heterozygous
    female is not reliably unaffected. The substantive clinical point is that
    identifying an at-risk infant early is itself a treatment: GeneReviews frames early
    evaluation of at-risk infants as the way to reduce morbidity from hypernatraemia,
    dehydration and tract dilatation, all three of which are cumulative and partly
    preventable.
  therapeutic_modality: BEHAVIORAL

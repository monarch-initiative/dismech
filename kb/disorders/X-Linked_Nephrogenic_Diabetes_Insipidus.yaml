    investigated for reflux, pyloric stenosis or infection long before anyone measures
    urine osmolality.
  phenotype_term:
    preferred_term: Vomiting
    term:
      id: HP:0002013
      label: Vomiting
  evidence:
  - reference: PMID:10477148
    reference_title: Clinical presentation and follow-up of 30 patients with congenital nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main symptoms at clinical presentation were vomiting and anorexia, failure to
      thrive, fever, and constipation.
    explanation: >-
      The presenting-symptom list from the largest well-characterised clinical series,

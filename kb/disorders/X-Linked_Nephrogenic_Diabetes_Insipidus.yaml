- name: X-NDI mouse treated with a beta-3 adrenergic agonist
  species: Mouse
  genotype: mouse model of X-linked nephrogenic diabetes insipidus (AVPR2-inactivated)
  description: >-
    A rescue experiment rather than a disease model, and included because of what the
    rescue demonstrates about the mechanism. The hypothesis was that a different Gs-coupled
    receptor on the same cells could be used to raise cAMP without the V2 receptor. A
    single injection of the beta-3 adrenergic agonist BRL37344 worked for only three hours,
    but repeated dosing over 24 hours - imitating a slow-release preparation - cut 24-hour
    urine output by 27 per cent, raised urine osmolarity by 25 per cent and reduced water
    intake by 20 per cent. The molecular readout is the point: the drug increased
    phosphorylation of AQP2 (along with NKCC2 and NCC) in the renal cell membrane. Raising
    AQP2 phosphorylation from outside the V2 receptor restores water handling, which is
    direct support for the entry's claim that the AQP2 step is where the cascade failure is
    cashed out.
  publication: PMID:38652212
  modeled_mechanisms:
  - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Pharmacological rescue of the node by a V2-receptor-independent route, with both the
      molecular step (AQP2 phosphorylation) and the whole-animal consequence measured.
    limitations: >-
      A mouse, and a pharmacological rescue with a three-hour duration of action that had to
      be worked around by repeated injection; the effect is partial (27 per cent of urine
      output) rather than corrective, and BRL37344 is a rodent-selective beta-3 agonist
      whose translation to human beta-3 pharmacology is not demonstrated here.
    evidence:
    - reference: PMID:38652212
      reference_title: The β3-AR agonist BRL37344 ameliorates the main symptoms of X-linked nephrogenic diabetes insipidus in the mouse model of the disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the molecular level, we show that BRL37344 acted by increasing the phosphorylation
        of NKCC2, NCC and AQP2 in the renal cell membrane, thereby increasing electrolytes
        and water reabsorption in the kidney tubule of X-NDI mice.
      explanation: >-
        Names AQP2 phosphorylation as the step the rescue acts through, which is what makes
        this a rescue of this node rather than a general antidiuretic effect.
    readouts:
    - name: 24-hour urine output, urine osmolarity and water intake after repeated BRL37344
      target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
      direction: RESTORED
      interpretation: >-
        Partial restoration of water handling, quantified in three directions at once. Read as
        partial: a 27 per cent reduction in output is a real effect and not a correction.
      evidence:
      - reference: PMID:38652212
        reference_title: The β3-AR agonist BRL37344 ameliorates the main symptoms of X-linked nephrogenic diabetes insipidus in the mouse model of the disease.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          repeated administrations in the 24 h, mimicking the effect of a slow-release
          preparation, promoted a sustained antidiuretic effect, reducing the 24 h urine output
          by 27%, increasing urine osmolarity by 25% and reducing the water intake by 20%.
        explanation: The three measured outcomes and the dosing schedule needed to obtain them.
  evidence:
  - reference: PMID:38652212
    reference_title: The β3-AR agonist BRL37344 ameliorates the main symptoms of X-linked nephrogenic diabetes insipidus in the mouse model of the disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The disease, which still lacks a cure, could benefit from the pharmacologic
      stimulation of other GPCRs, activating the cAMP-intracellular pathway in the kidney
      cells expressing the AVPR2.
    explanation: >-
      The design rationale, which is also the mechanistic claim the experiment tests: the
      cascade below the receptor is intact and reachable from another receptor.
experimental_models:
- name: Polarized MDCK cells stably expressing V2 receptor mutants
  experimental_model_type: CELL_LINE
  description: >-
    The system in which the pharmacochaperone idea was tested properly. Nine different
    disease-causing V2 receptor mutants were stably expressed in polarized MDCK cells -
    which matters, because a receptor's destination is the basolateral membrane and an
    unpolarized cell cannot report on that. Four cell-permeable non-peptide antagonists
    rescued maturation and basolateral expression of eight of the nine mutants. The
    study's real contribution is the constraint it found: rescue at concentrations a
    patient could actually receive required high-affinity antagonists, because the
    low-affinity one needed concentrations that were not clinically feasible even though
    it was easier for vasopressin to displace.
  publication: PMID:16926443
  notes: >-
    No cell_types binding. MDCK is a canine kidney epithelial line, and binding it to
    the human collecting-duct principal cell term would overstate what the system is;
    CL does not represent cell lines, and no CLO binding is available in this schema.
    The polarization of the line, which is the property that makes it informative about
    basolateral delivery, is described above instead.
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Cell-permeable non-peptide antagonists restored membrane expression and function of
      ER-retained mutants, which is the experimental demonstration that retention, not
      intrinsic receptor failure, is the rate-limiting lesion.
    limitations: >-
      A canine kidney cell line overexpressing a transfected human receptor, not a human
      principal cell in situ; rescue was shown for eight of nine mutants tested, so it is
      allele-dependent; and no clinical benefit in patients is demonstrated by this work.
    evidence:
    - reference: PMID:16926443
      reference_title: "Functional rescue of vasopressin V2 receptor mutants in MDCK cells by pharmacochaperones: relevance to therapy of nephrogenic diabetes insipidus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Intracellular retention of a functional vasopressin V2 receptor (V2R) is a major
        cause of congenital nephrogenic diabetes insipidus (NDI) and rescue of V2R mutants
        by nonpeptide antagonists may restore their basolateral membrane (BM) localization
        and function.
      explanation: >-
        States that the lesion this model manipulates is the one this node describes, which
        is what makes the model informative for it.
    readouts:
    - name: Basolateral membrane expression of mutant V2 receptor after antagonist exposure
      target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
      direction: RESTORED
      interpretation: >-
        Restored surface delivery of a receptor that ER quality control had been holding
        back.
      evidence:
      - reference: PMID:16926443
        reference_title: "Functional rescue of vasopressin V2 receptor mutants in MDCK cells by pharmacochaperones: relevance to therapy of nephrogenic diabetes insipidus."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found that the four nonpeptide antagonists SR49059, OPC31260, OPC41061, and
          SR121463B induced maturation and rescued the BM expression of eight of nine
          different V2R mutants, stably expressed in physiologically relevant polarized
          cells.
        explanation: >-
          The measurement itself, with the denominator: eight of nine mutants, in polarized
          cells.
  evidence:
  - reference: PMID:16926443
    reference_title: "Functional rescue of vasopressin V2 receptor mutants in MDCK cells by pharmacochaperones: relevance to therapy of nephrogenic diabetes insipidus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      At clinically feasible antagonist concentrations, however, only the high-affinity
      antagonists OPC31260 and OPC41061 induced functional rescue, as at these
      concentrations the extent of BM expression became limited.
    explanation: >-
      The constraint that makes this model informative about therapy rather than only
      about cell biology, and the reason it is cited here rather than a simpler
      transfection study.
- name: HEK293 cells expressing the S127F V2 receptor mutant
  experimental_model_type: CELL_LINE
  description: >-
    A patient-derived variant taken through the whole argument in one system. S127F was
    found in an NDI patient; in HEK293 cells the mutant receptor sits almost exclusively
    in the endoplasmic reticulum with very few molecules at the surface, and generates
    negligible cAMP in response to vasopressin. Pretreatment with either tolvaptan - an
    established V2 receptor inverse agonist - or MCF14, a cell-permeable high-affinity
    agonist, partially restored cAMP generation. The result that matters for the
    therapeutic question is that both an agonist and an antagonist worked as
    pharmacochaperones, so the chaperone property is not tied to the ligand's
    signalling direction.
  publication: PMID:35153784
  modeled_mechanisms:
  - target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Establishes the ER localization and the functional consequence for one patient
      variant, then partially reverses both with two chemically and pharmacologically
      different chaperones.
    limitations: >-
      HEK293 is a non-renal, unpolarized line overexpressing a transfected receptor, so it
      cannot report on basolateral targeting in a principal cell; the rescue is explicitly
      partial; and the result is for a single allele, which the authors themselves frame as
      a starting point for patients carrying S127F rather than for the disease generally.
    evidence:
    - reference: PMID:35153784
      reference_title: Functional Rescue of a Nephrogenic Diabetes Insipidus Causing Mutation in the V2 Vasopressin Receptor by Specific Antagonist and Agonist Pharmacochaperones.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Based on our data, the S127F-V2R mutant is almost exclusively located
        intracellularly in the endoplasmic reticulum (ER), and very few receptors were
        detected at the cell surface, where the receptor can bind to AVP.
      explanation: >-
        Establishes that this model is about the ER-retention node, and states the reason
        retention matters - the surface is where the hormone can reach the receptor.
    readouts:
    - name: Vasopressin-stimulated cAMP generation after pharmacochaperone pretreatment
      target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
      direction: RESTORED
      interpretation: >-
        Partial functional rescue by two different ligand classes. Read as partial, and as
        allele-specific.
      evidence:
      - reference: PMID:35153784
        reference_title: Functional Rescue of a Nephrogenic Diabetes Insipidus Causing Mutation in the V2 Vasopressin Receptor by Specific Antagonist and Agonist Pharmacochaperones.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found that pretreatment with both tolvaptan (an established V2R inverse agonist)
          and MCF14 compound (a cell-permeable high-affinity agonist for the V2R) were
          capable of partially restoring the cAMP generating function of the receptor in
          response to vasopressin stimulation.
        explanation: The measured rescue, with both compounds named and the effect called partial.
  evidence:
  - reference: PMID:35153784
    reference_title: Functional Rescue of a Nephrogenic Diabetes Insipidus Causing Mutation in the V2 Vasopressin Receptor by Specific Antagonist and Agonist Pharmacochaperones.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The overexpressed S127F-V2R mutant receptor has negligible cAMP generation capability
      compared to the wild-type receptor in response to AVP stimulation.
    explanation: >-
      The functional baseline the rescue is measured against, and the link between the
      localization defect and the signalling failure in one system.
clinical_trials:
- name: NCT07525960
  phase: PHASE_I
  status: RECRUITING
  description: >-
    The only interventional trial identified for this disease, and the first to test a
    treatment aimed at the mechanism rather than at the urine volume. NDI-5001 is given as
    a capsule in daily oral doses to adult males with X-linked congenital nephrogenic
    diabetes insipidus due to V2 receptor mutations, with safety, pharmacokinetics and
    pharmacodynamics as the endpoints. Note what the registration does and does not say:
    it specifies the population by genotype, which is unusual and useful, but a Phase 1b
    safety and pharmacodynamic study establishes nothing about clinical benefit. The
    trial's own record does not name the drug's mechanism, so none is asserted here.
  target_phenotypes:
  - preferred_term: Polyuria
    term:
      id: HP:0000103
      label: Polyuria
  evidence:
  - reference: clinicaltrials:NCT07525960
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The primary purpose of this trial is to evaluate the safety, tolerability,
      pharmacokinetics (PK), and pharmacodynamics (PD) of NDI-5001 administered as a
      capsule following daily oral dosing in adult males with X-linked congenital
      nephrogenic diabetes insipidus (NDI) due to vasopressin receptor Type 2 (V2R)
      mutations.
    explanation: >-
      The registration record, which establishes the trial's existence, its phase, its
      genotype-defined population and its endpoints - and nothing about efficacy.
discussions:
- discussion_id: xndi_neurocognitive_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the cognitive impairment reported in untreated X-linked nephrogenic diabetes
    insipidus caused by repeated hypernatraemic episodes, and if so what exposure is
    required?
  attaches_to:
  - phenotypes#Intellectual disability
  - phenotypes#Hypernatremia
  rationale: >-
    There is a live contradiction here, not just a gap. GeneReviews holds that
    intelligence is usually normal with early diagnosis and treatment; a 2025 cohort
    followed for a median of 16.9 years found neurodevelopmental disorders in six of eight
    patients who were all on hydrochlorothiazide and amiloride with normalised serum
    sodium. Treatment status therefore does not reconcile the two. Three explanations are
    open and the cited literature does not choose between them: ascertainment in a small
    referral series, residual subclinical hypernatraemic episodes that a normalised
    steady-state sodium does not capture, or a contribution from something other than
    sodium -
    chronic undernutrition severe enough to leave a permanent height deficit is the
    obvious candidate. The attribution to electrolyte disturbance is stated in review form
    and hedged there, and no cited source anchors it to a measured exposure-response
    relationship. Note also that the 66-child multicentre cohort, which is the largest
    series here and reported growth, urological and renal outcomes in detail, did not
    report cognitive outcome at all - so the best-powered study is silent on precisely this
    question. This matters practically: if the relationship is dose-dependent in episodes,
    the value of early diagnosis becomes quantifiable and the sodium surveillance interval
    becomes an evidence question rather than a convention.
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Irreversible brain damage and cognitive deficit secondary to electrolyte
      imbalances may be present.
    explanation: >-
      The claim whose evidential basis the gap is about. The hedge is the source's own.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental disorders were identified in six patients, including intellectual
      disability, autism spectrum disorder, language delay, and learning difficulties.
    explanation: >-
      The observation that creates the contradiction, in patients who were treated.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Serum sodium normalized in all cases.
    explanation: >-
      Establishes that the cohort above was not simply undertreated at steady state, which
      is what rules out the easiest reconciliation of the two positions and leaves the
      question open.
- discussion_id: xndi_pharmacochaperone_translation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why has pharmacochaperone rescue of ER-retained V2 receptor mutants not translated
    into a human treatment, two decades after the cell-based proof of principle?
  attaches_to:
  - pathophysiology#Endoplasmic Reticulum Retention of Misfolded V2 Receptor
  - treatments#Thiazide Diuretic
  rationale: >-
    The mechanistic argument is unusually clean: most pathogenic AVPR2 variants retain a
    functional receptor in the wrong compartment, cell-permeable non-peptide ligands
    restore its membrane delivery in polarized cells, and the pharmacology even
    discriminates which ligands could work at achievable concentrations. Two distinct
    obstacles appear in the cited work rather than one. First, a pharmacochaperone that
    is an antagonist must be displaced by vasopressin to be useful, so affinity has to be
    high enough to chaperone and low enough to release - a narrow window. The non-peptide
    agonist route was proposed to escape that, but the same ligand also desensitizes the
    rescued receptor, and whether the chaperone effect outlasts the desensitization is a
    speculation in the source, not a result. The current proposal is a biased agonist that
    chaperones the receptor and then signals only through Gs without recruiting arrestin,
    which would sidestep the desensitization problem - but that too is offered as a
    potential treatment rather than a demonstrated one. Second, and more simply, the review of
    pharmacological strategies concludes that nothing has yet been established as
    causally improving symptoms or quality of life in patients, which is a statement about
    the whole field including these agents. The entry therefore records the thiazide
    regimen as the treatment and pharmacochaperones as mechanism, not therapy.
  evidence:
  - reference: PMID:32924547
    reference_title: A mini-review of pharmacological strategies used to ameliorate polyuria associated with X-linked nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is concluded that there is currently no established intervention that causally
      improves symptoms or quality of life in patients with NDI.
    explanation: >-
      The field-level negative conclusion, which is what keeps every causal strategy in
      this entry out of the treatments section.
  - reference: PMID:27601473
    reference_title: "Analysis of the V2 Vasopressin Receptor (V2R) Mutations Causing Partial Nephrogenic Diabetes Insipidus Highlights a Sustainable Signaling by a Non-peptide V2R Agonist."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We speculated that the canceling of the desensitization effect of OPC51803 by the
      pharmacochaperone effect after long-term treatment may produce sustainable
      signaling, and thus pharmacochaperone agonists such as OPC51803 may serve as
      promising therapeutics for NDI caused by misfolded V2R mutants.
    explanation: >-
      Quoted because the authors' own verb is "speculated". The agonist route's central
      premise is explicitly a speculation, which is the content of this gap.
  - reference: PMID:31928727
    reference_title: "Misfolding of vasopressin receptors: biased agonist pharmacochaperones as potential therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These compounds, particularly small-molecule biased agonists which elicit the
      V2-induced Gs protein-dependent signaling pathway, but not V2-related
      arrestin-dependent cell responses, represent a potential therapeutic treatment of
      this X-linked genetic pathology.
    explanation: >-
      The current form of the proposal - a biased agonist that chaperones and signals
      through Gs without recruiting arrestin, so the desensitization problem above does
      not arise. Note the verb is "represent a potential", so this is a proposal and not
      a result.
references:
- reference: PMID:20301356
  title: Hereditary Nephrogenic Diabetes Insipidus.
  tags:
  - GeneReviews
notes: >-
  Lump/split: curated as a single DISEASE. One gene (AVPR2), one receptor, one conserved
  mechanistic chain from misfolded receptor to hypotonic polyuria. There is no defensible
  subtype axis: the allelic spectrum is broad but genotype does not predict phenotype
  beyond one hedged exception, the partial-NDI variants differ in degree rather than in
  mechanism, and symptomatic female heterozygotes are the same disease modified by
  X-inactivation, not a separate entity. No has_subtypes block was created.

  Boundary with Neurohypophyseal_Diabetes_Insipidus: these are two diseases at two levels
  of one axis and must not be conflated. That entry is the central (AVP) form - the lesion
  is in the hormone, the pathograph runs through misfolding of prepro-vasopressin in
  magnocellular hypothalamic neurons, and the endpoint is vasopressin deficiency. This
  entry starts where hormone supply is normal or high and the receptor cannot receive it.
  The two share downstream phenotypes (polyuria, polydipsia, hyposthenuria, hypernatraemic
  dehydration) and nothing upstream of them, and the discriminating test is the response to
  desmopressin: present in the central form, absent here. Note the superficial similarity
  that could invite a false merge - both entries have an ER-retention node - but they are
  different proteins retained in different cell types with different consequences: a
  secreted prohormone aggregating in a neuron and progressively destroying it, versus a
  membrane receptor held back from the surface of a renal epithelial cell with no
  proteotoxicity recorded. The pathographs were built independently; nothing was copied
  between them.

  Boundary with AQP2-related nephrogenic diabetes insipidus: the AQP2 form is a separate
  locus and a separate disease (autosomal recessive, rarely dominant), not a subtype of
  this entry, and dismech has no AQP2 entry at the time of writing. The two are clinically
  indistinguishable, which is exactly why they must be kept apart in the knowledge base: the
  inheritance, the counselling, the recurrence risk and the mechanism at the level of the
  water channel all differ. The mechanistic distinction is load-bearing here, because in
  XNDI aquaporin-2 is intact - the V2 receptor knock-in mouse shows normal basal AQP2
  abundance - so every experimental therapeutic strategy for XNDI is framed as reaching
  AQP2 without the receptor, which makes no sense for the AQP2 form. A kb/groupings/
  Grouping over nephrogenic diabetes insipidus (MONDO:0016383) would be the right vehicle
  for the relationship once an AQP2 entry exists; it is deliberately not created here,
  since a grouping with one member is not a union.

  No conforms_to. Three candidate modules were read in full before concluding that none
  fits. er_protein_storage_disease scopes itself to hepatocellular storage of a secretory
  protein with proteotoxic gain of function and stellate-cell fibrosis, and its own notes
  assign the loss-of-secretion consequence to disorder entries rather than to the module -
  XNDI is purely that loss-of-delivery arm, in a renal epithelium, with no storage
  pathology. loss_of_proteostasis is an aging hallmark built on age-related decline of the
  proteostasis network leading to aggregation and neurodegeneration; here a single variant
  protein is recognised by an intact quality-control system, which is the opposite
  situation. renal_cystogenesis does contain a vasopressin-V2R-cAMP node, but in the
  direction of overstimulation driving cystogenesis, so conforming to it would invert the
  mechanism. A module for GPCR ER-retention trafficking disease would be a legitimate future
  proposal - the cited literature explicitly generalises the mechanism to other
  ER-retained GPCRs - but it does not exist yet and was not created in this PR.

  Deep research. falcon was requested and returned HTTP 402 on two consecutive attempts -
  the Edison account is out of credits. The second attempt was re-issued with --fallback,
  which escalated to openscientist; that job (55dbaa47-e508-4202-898f-a85d997f02b6) timed
  out after 3600 s and was cancelled, ending the fallback chain with no report. The
  provider of record is therefore claude_code, run directly, and the report's own
  frontmatter says so. Its reference validation resolved 14 of 14 identifiers with a
  confabulation rate of 0.0; needs_review is true on the strength of one reference flagged
  as possibly off topic (PMC:PMC11095762, "Therapeutic potentials of nonpeptidic V2R
  agonists for partial cNDI-causing V2R mutants"), which on reading is squarely on topic -
  a vocabulary-overlap false positive, not a bad citation. Term validation resolved 17 of
  18 CURIEs with 5 of 5 labels correct and none naming a different term; no CURIE from the
  report was bound without an independent lookup in any case. just preflight-dr returns a
  WARN because AQP2 is mentioned 35 times against AVPR2's 55 and the report carries
  OMIM 125800 alongside 304800. That is expected here rather than a Named Entity Confusion
  finding: the report discusses AQP2 as the contrasting locus, which is the same boundary
  this entry draws explicitly above, and no AQP2 content was curated as AVPR2 disease.

  Three figures the report gives are not supported by the abstracts they are attributed
  to, and are deliberately absent from this entry: a 36 per cent gastrostomy rate ascribed
  to PMID:32039113, and - ascribed to PMID:39644399 - a 58-year-old patient with an eGFR of
  25 mL/min/1.73m2, a 3.1 L post-void residual and secondary hyperparathyroidism. That
  paper's abstract describes a 6-month-old proband and an untreated maternal grandfather
  without naming his age or any of those values. The qualitative contrast it does support
  is curated; the numbers are not. This is recorded because the report reads fluently and
  those figures would have been easy to transcribe.

  Slot choice on the lesion node. The lesion node carries both
  genetic_context.functional_impact_category: LOSS_OF_FUNCTION and
  modifier: LOSS_OF_FUNCTION on its vasopressin-receptor-activity descriptor. CLAUDE.md
  records that these two slots may legitimately co-occur on a mutation-driven node
  because they make different claims - the variant's consequence and the resulting
  activity state. CLAUDE.md adds that no KB entry did so at the time of writing, but that
  sentence is stale: measured against origin/main at the time this entry was curated, 200
  pathophysiology nodes already pair the two slots, 80 of them with a GAIN_OF_FUNCTION or
  LOSS_OF_FUNCTION modifier (Autosomal_Recessive_Robinow_Syndrome and
  Autosomal_Dominant_Hypocalcemia_1 among them). So the pattern here is well precedented
  rather than novel, and is recorded for that reason rather than as a flag. The modifier is qualitative
  rather than quantitative on purpose: the receptor's activity is abolished, not running
  below normal, which is the distinction CLAUDE.md draws between
  LOSS_OF_FUNCTION and DECREASED. Downstream nodes use DECREASED and ABSENT, since the
  cascade and the trafficking steps are intact machinery deprived of an input.

  Phenotypes deliberately left unwired to the pathograph: Vomiting, Fever and
  Constipation. All three are well documented as presenting features and all three have
  an obvious hand-waving explanation (dehydration, water deficit), but no cited source
  here states the causal step, so an edge would be invented rather than curated. Failure
  to thrive and Short stature are wired with INDIRECT_UNKNOWN_INTERMEDIATES for the
  weaker version of the same reason - the association is documented, the route is not.
  Intellectual disability reaches the graph through a sequela edge from Hypernatremia
  rather than from a pathophysiology node, because the only causal statement available
  attributes it to the electrolyte disturbance and not to a mechanism.

  Omitted deliberately. The biochemical block carries urine osmolality and serum sodium but
  no reference_ranges: no citable record in this round gave a reference interval for either,
  and the only numeric figure available (a maximal urine osmolality not exceeding
  200 mosmol/kg in three patients) is a reported ceiling in affected people, not a normal
  interval, so inventing one was declined. The clinical_trials block carries exactly one
  trial, NCT07525960, because it is the only interventional study identified for this
  disease; the 2020 pharmacological review's conclusion that nothing is yet established as
  causally improving symptoms or quality of life stands alongside it, and the trial's
  registration record does not name the drug's mechanism so none is asserted. No datasets
  block: no GEO or other repository accession specific to
  AVPR2 nephrogenic diabetes insipidus was verified, and a gene-name search would have
  returned accessions about other AVPR2 biology. No environmental block: the precipitants
  of decompensation (intercurrent illness, heat, water withholding) are recorded in the
  progression and phenotype descriptions, because they act on an already-established disease
  rather than contributing to its causation, and an ECTO binding for "withholding of water"
  was not sought. No prevalence figure beyond the Quebec birth-incidence estimate; the
  numerically higher Maritime rate is noted as a founder effect rather than curated as a
  second population record.

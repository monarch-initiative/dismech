      label: protein localization to plasma membrane
  - preferred_term: regulation of aquaporin-2 water channel activity
    modifier: DECREASED
    term:
      id: GO:1902427
      label: regulation of water channel activity
  downstream:
  - target: Collecting Duct Water Impermeability
    causal_link_type: DIRECT
    description: >-
      With no aquaporin-2 in the apical membrane the luminal surface of the duct is
      effectively impermeable to water.
    evidence:
    - reference: PMID:32924547
      reference_title: A mini-review of pharmacological strategies used to ameliorate polyuria associated with X-linked nephrogenic diabetes insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        AVP facilitates reabsorption of water through increased abundance and
        insertion of AQP2 in the apical membrane of principal cells in the collecting
        ducts. In X-linked NDI, V2R is dysfunctional, which leads to impaired water
        reabsorption.
      explanation: >-
        States both halves of the edge in one place: apical AQP2 insertion is what
        permits reabsorption, and in XNDI reabsorption is impaired because the
        receptor is dysfunctional.
  evidence:
  - reference: PMID:7537730
    reference_title: cAMP-dependent phosphorylation stimulates water permeability of aquaporin-collecting duct water channel protein expressed in Xenopus oocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest that cAMP stimulates water permeability of AQP-CD by
      phosphorylation. This process may contribute to the vasopressin-regulated water
      permeability of collecting duct in addition to the apical insertion of AQP-CD by
      exocytosis.
    explanation: >-
      The Xenopus oocyte experiment establishing cAMP-dependent phosphorylation as a
      mechanism by which the channel's water permeability is switched on, alongside
      apical exocytosis.
  - reference: PMID:32924547
    reference_title: A mini-review of pharmacological strategies used to ameliorate polyuria associated with X-linked nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These patients have functional AQP2, and thus the challenge is to achieve AQP2
      membrane insertion independently of V2R.
    explanation: >-
      States that AQP2 is intact in XNDI, which is the claim that makes this node a
      regulatory failure rather than a channel defect.
- name: Collecting Duct Water Impermeability
  description: >-
    The collecting duct is the final site at which the kidney can return water to the
    body, and its water permeability is not constitutive - it exists only while
    aquaporin-2 is in the apical membrane. An XNDI collecting duct is therefore
    permanently in its dilute-urine configuration regardless of how dehydrated the
    patient is.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: renal collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell

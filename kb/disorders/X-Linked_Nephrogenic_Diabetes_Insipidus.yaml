animal_models:
- name: V2R Glu242stop knock-in mouse
  species: Mouse
  genotype: Avpr2 Glu242stop (nonsense allele knocked in by targeted mutagenesis in ES cells)
  description: >-
    The defining animal model, and deliberately constructed as a disease model rather
    than a convenience knockout: the allele introduced is a nonsense variant known to
    cause XNDI in humans. Hemizygous males reproduce the severe human infantile
    phenotype closely - low basal urine osmolality, inability to concentrate,
    enlargement of the renal pelvic space, failure to thrive, and death in the first
    postnatal week from hypernatraemic dehydration - which is what an untreated human
    infant is at risk of. Heterozygous females are the second useful result: they grow
    normally but have reduced concentrating ability with polyuria and polydipsia, the
    murine counterpart of the symptomatic human heterozygote. The model also provides
    the cleanest available evidence that aquaporin-2 is not the problem in this
    disease: basal AQP2 expression was unaffected by loss of functional V2 receptors.
  publication: PMID:11104789
  modeled_mechanisms:
  - target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      A human XNDI nonsense allele at the orthologous position, producing the expected
      receptor-level loss of function in the intact animal.
    limitations: >-
      The model observes the whole organism, so the receptor-level signalling failure
      itself is inferred from the physiology rather than measured in this report; cAMP
      and PKA were not assayed here.
    evidence:
    - reference: PMID:11104789
      reference_title: Generation and phenotype of mice harboring a nonsense mutation in the V2 vasopressin receptor gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, we introduced a nonsense mutation known to cause X-linked
        nephrogenic diabetes insipidus (XNDI) in humans (Glu242stop) into the mouse
        genome.
      explanation: >-
        The allele is a human disease variant placed at the orthologous position, which
        is what makes this model informative for the human receptor-level lesion rather
        than for V2 receptor biology in general.
    readouts:
    - name: Basal urine osmolality
      target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
      direction: DECREASED
      interpretation: >-
        The functional consequence of the absent receptor signal, measured at the level
        of the organism's urine.
      evidence:
      - reference: PMID:11104789
        reference_title: Generation and phenotype of mice harboring a nonsense mutation in the V2 vasopressin receptor gene.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          V2R-deficient hemizygous male pups showed a decrease in basal urine osmolalities
          and were unable to concentrate their urine.
        explanation: The measured concentrating defect in the hemizygous animals.
  - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Supports the node in its important negative sense - that AQP2 abundance is not
      reduced, so the lesion is regulatory - without demonstrating the positive claim
      about phosphorylation and apical trafficking.
    limitations: >-
      Only basal AQP2 expression levels were assessed. Phosphorylation state and
      subcellular redistribution after a vasopressin stimulus, which are the actual
      content of this node, were not measured, so the model speaks to abundance rather
      than to trafficking.
    evidence:
    - reference: PMID:11104789
      reference_title: Generation and phenotype of mice harboring a nonsense mutation in the V2 vasopressin receptor gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Western blot analysis and immunoelectron microscopic studies showed that the loss
        of functional V2Rs had no significant effect on the basal expression levels of
        aquaporin-2 and the bumetanide-sensitive Na-K-2Cl cotransporter (BSC-1).
      explanation: >-
        Establishes that this model bears on the AQP2 node at all, and bears on it in the
        negative direction - abundance preserved - which is the only part of the node it
        can speak to.
    readouts:
    - name: Basal aquaporin-2 protein abundance
      target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
      direction: UNCHANGED
      interpretation: >-
        A genuine negative result, and the one that matters: the water channel is present
        in normal amounts, so the defect is in its regulation.
      evidence:
      - reference: PMID:11104789
        reference_title: Generation and phenotype of mice harboring a nonsense mutation in the V2 vasopressin receptor gene.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Western blot analysis and immunoelectron microscopic studies showed that the loss
          of functional V2Rs had no significant effect on the basal expression levels of
          aquaporin-2 and the bumetanide-sensitive Na-K-2Cl cotransporter (BSC-1).
        explanation: >-
          The measurement establishing that AQP2 abundance is preserved when the receptor

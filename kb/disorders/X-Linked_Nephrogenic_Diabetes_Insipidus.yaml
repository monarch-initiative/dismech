- category: Neurologic
  name: Intellectual disability
  frequency: OCCASIONAL
  description: >-
    This is where the literature contradicts itself, and the contradiction matters
    clinically. GeneReviews and the older teaching hold that intelligence is usually
    normal when the disease is diagnosed and treated early. A 2025 single-centre cohort
    followed for a median of 16.9 years found neurodevelopmental disorders - intellectual
    disability, autism spectrum disorder, language delay, learning difficulties - in six
    of its eight patients, all of whom were on hydrochlorothiazide and amiloride and all
    of whom had normalised serum sodium. Eight patients is a small and probably
    referral-selected denominator, so this is not a population risk estimate. But it is
    not reconcilable with "usually normal" by appeal to treatment status either, because
    these patients were treated. The attribution to electrolyte disturbance is stated in
    review form and hedged there; nothing cited here establishes the intermediate steps,
    quantifies the exposure, or separates repeated hypernatraemia from chronic
    undernutrition. See the attached knowledge gap.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Without treatment, most patients fail to grow normally, and present with
      associated constipation, urological complication, megacystis, trabeculated
      bladder, hydroureter, hydronephrosis, and mental retardation.
    explanation: >-
      The review lists this among the consequences of untreated disease.
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Irreversible brain damage and cognitive deficit secondary to electrolyte
      imbalances may be present.
    explanation: >-
      The review's own causal statement, quoted with its hedge intact. It is the basis
      for the sequela edge from Hypernatremia and for the knowledge gap attached to
      this phenotype.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurodevelopmental disorders were identified in six patients, including intellectual
      disability, autism spectrum disorder, language delay, and learning difficulties.
    explanation: >-
      The numerator and the range of diagnoses, in a cohort of eight followed for a median
      of 16.9 years. This is the observation that makes the "usually normal with early
      treatment" teaching hard to sustain unexamined.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although rare, NDI can significantly impact growth and neurodevelopment.
    explanation: >-
      The authors' own conclusion, which is what they take their cohort to show. Quoted
      separately from the numerator because it is a different claim - a general one about
      the disease rather than a count in this series.
- category: Renal
  name: Chronic kidney disease
  frequency: OCCASIONAL
  description: >-
    A late, largely preventable complication, and the strongest argument for treating
    this disease early rather than symptomatically. In a 66-child multicentre cohort,
    23 per cent had reached CKD stage 2 or higher by a median age of six years. The
    clearest illustration is a single family reported in 2024: the 6-month-old proband
    started on hydrochlorothiazide did well, while his maternal grandfather, who carried
    the same M272R variant and was never diagnosed or treated, had chronic kidney
    disease, severe bilateral hydronephrosis, hypertension and severe bladder
    dysfunction. Note that the one long-term cohort with nearly 17 years of follow-up on
    treatment reported renal function stable throughout, so this is an outcome of
    undertreated disease rather than an inevitability.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
  evidence:
  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse outcomes included inpatient hospitalizations (61%), urologic complications
      (37%), and chronic kidney disease (CKD) stage 2 or higher in 23%.
    explanation: >-
      The cohort figure, and the source for the hospitalisation and urologic-complication
      rates quoted elsewhere in this entry.
  - reference: PMID:39644399
    reference_title: The natural history of untreated X-linked nephrogenic diabetes insipidus with mutation in the vasopressin V2 receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, this mutation was also identified in the patient's maternal
      grandfather, who had never been diagnosed or treated for NDI despite a history of
      polydipsia, polyuria, and evidence of chronic kidney disease (CKD), severe bilateral
      hydronephrosis, hypertension, and severe bladder dysfunction.
    explanation: >-
      The within-family treated-versus-untreated contrast, which is as close to a natural
      history experiment as this disease offers.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal function, serum sodium, and imaging findings remained stable throughout
      follow-up.
    explanation: >-
      Cuts against CKD being an expected outcome of this disease as such. Over a median
      16.9 years on hydrochlorothiazide and amiloride, renal function did not decline in
      this cohort - which is why the phenotype is framed as a consequence of undertreated
      disease.
- category: Renal
  name: Nocturnal enuresis
  frequency: OCCASIONAL
  description: >-
    Bed-wetting is often what brings an older child to attention, and in a child
    already known to have the disease it is an expected consequence of an obligatory
    night-time urine output rather than a behavioural problem. The frequency band is
    not taken from a cohort: the cited review names enuresis as a feature and as a
    complication of untreated disease but reports no proportion, so OCCASIONAL is the
    coarsest honest placement and should not be read as a measured figure.
  phenotype_term:
    preferred_term: Enuresis
    term:
      id: HP:0000805
      label: Enuresis
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      excessive urination during the night (nocturia), or bedwetting at night
      (nocturnal enuresis)
    explanation: >-
      Names nocturia and nocturnal enuresis among the presenting features of the
      disease in children.
biochemical:
- name: Urine osmolality
  presence: Decreased
  context: >-
    The measurement that defines the disease and the one that does not move when
    desmopressin is given. In symptomatic AVPR2 heterozygous females maximal urine
    osmolality did not exceed 200 mosmol/kg, against a normal maximum several times that,
    and the same non-response was demonstrable outside the kidney in two of them. No
    reference interval is curated here: no citable record in this round gave one, and the
    200 mosmol/kg figure is a reported ceiling in three patients, not an interval.
  biomarker_term:
    preferred_term: urine osmolality
    term:
      id: NCIT:C74801
      label: Osmolality Measurement
  readouts:
  - target: Failure of Medullary Countercurrent Urine Concentration
    relationship: READOUT_OF
    direction: THRESHOLD_DEPENDENT
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Directly reports the concentrating failure this node describes, and is
      threshold-dependent rather than simply low because the diagnostic question is the
      maximum achievable after water deprivation or desmopressin, not a single value.
    evidence:
    - reference: PMID:7607658
      reference_title: Clinical phenotype of nephrogenic diabetes insipidus in females heterozygous for a vasopressin type 2 receptor mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Maximal urine osmolality in three female patients did not exceed 200 mosmol/kg and
        the absence of extra-renal responses to 1-desamino-8-D-arginine vasopressin was
        demonstrated in two of them.
      explanation: >-
        Gives the measured ceiling in affected patients. Measured in symptomatic female
        heterozygotes, which is a limitation of this particular figure rather than of the
        readout.
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nephrogenic diabetes insipidus (NDI) is characterized by impaired urinary
      concentrating ability, despite normal or elevated plasma concentrations of the
      antidiuretic hormone, arginine vasopressin (AVP).
    explanation: >-
      Establishes impaired urinary concentrating ability as the defining abnormality this
      marker measures, alongside an intact hormone level.
- name: Serum sodium
  presence: Increased
  context: >-
    The marker of decompensation rather than of the disease, and the one on a surveillance
    schedule: three-monthly in infants, six-monthly in older children, annually or as
    needed in adults. The reason it is monitored rather than measured only when someone
    looks unwell is that hyperosmolality and early dehydration can be present without
    being recognised clinically.
  biomarker_term:
    preferred_term: serum sodium concentration
    term:
      id: NCIT:C61029
      label: Serum Sodium Measurement
  readouts:
  - target: Hypernatremia
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      The measurement the phenotype is defined by, used here as the monitoring marker for
      unrecognised water deficit rather than as a diagnostic test for the disease.
    evidence:
    - reference: PMID:20301356
      reference_title: Hereditary Nephrogenic Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        measurement of serum sodium concentration to identify unrecognized hyperosmolality
        and early dehydration at least every three months in infants, at least every six
        months in older children, and annually in adults or only as needed
      explanation: >-
        States the monitoring purpose and the schedule, which is what makes this a
        MONITORING rather than DIAGNOSTIC readout.
genetic:
- name: AVPR2
  gene_term:
    preferred_term: AVPR2
    term:
      id: hgnc:897
      label: AVPR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: accounts for about 90 per cent of hereditary nephrogenic diabetes insipidus
  notes: >-
    AVPR2 at Xq28 is the sole gene for this entry, and it accounts for the large
    majority of hereditary nephrogenic diabetes insipidus overall: about 90 per cent,
    against roughly 9 per cent autosomal recessive and 1 per cent autosomal dominant
    AQP2 disease. The allelic spectrum is broad and mostly private - 82 distinct
    variants across 117 families - and the recurrences are independent events rather
    than a founder effect, so a new family generally means a new variant. Genotype
    does not predict phenotype usefully: the 30-patient clinical series found no clear
    clinical-genetic relationship beyond a possibly milder course with one variant.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary NDI is most commonly inherited in an X-linked manner (~90% of
      individuals). Hereditary NDI can also be inherited in an autosomal recessive
      manner (~9% of individuals) or in an autosomal dominant manner (~1% of
      individuals).
    explanation: >-
      Gives the share of hereditary NDI attributable to the X-linked AVPR2 form and the
      shares of the two autosomal AQP2 forms, which is what locates this entry within
      the group.
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of hereditary NDI is established in a male proband with NDI by
      identification of a hemizygous pathogenic variant in AVPR2 or identification of a
      compound heterozygous or homozygous pathogenic variant in AQP2 by molecular
      genetic testing.
    explanation: >-
      Establishes hemizygous AVPR2 variation as the diagnostic criterion in a male
      proband, and names the AQP2 alternative that has to be excluded.
  - reference: PMID:10477148
    reference_title: Clinical presentation and follow-up of 30 patients with congenital nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Except for a possibly milder phenotype in patients with a G185C mutation, no clear
      relationship between clinical and genetic data could be found.
    explanation: >-
      The basis for not asserting genotype-phenotype correlation, and for the single
      hedged exception.
inheritance:
- name: X-linked recessive
  description: >-
    Affected males are hemizygous. The inheritance is conventionally called recessive
    because hemizygous males carry the full phenotype and most heterozygous females do
    not, but the female side is more interesting than "carrier" suggests: a
    heterozygous female can be as severely affected as a male, and the explanation
    offered for that is skewed X-inactivation against the normal allele. In a review of
    23 families with at least one affected female, every female in whom X-inactivation
    was studied showed extreme or slight skewing, and all six with severe disease carried
    complete loss-of-function alleles. In a Chinese family, skewing of the normal allele
    was present in four symptomatic heterozygotes and absent in an asymptomatic one.
    Two limits on that claim are worth stating rather than glossing. The inactivation
    pattern in all of these studies was measured in accessible somatic tissue, not in the
    collecting duct where the receptor has to work, so the inference to the relevant
    tissue is an inference. And the association is consistent rather than demonstrated
    sufficient: no cited study shows that skewing alone produces the phenotype. The
    practical consequence stands regardless - an AVPR2 heterozygote cannot be reassured
    on the basis of her sex, and a female with nephrogenic diabetes insipidus needs AVPR2
    considered alongside AQP2.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  de_novo_rate: about 20 per cent of isolated cases, arising during maternal oogenesis
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Hereditary NDI is most commonly inherited in an X-linked manner (~90% of individuals).
    explanation: States the mode and its share of hereditary NDI.
  - reference: PMID:7607658
    reference_title: Clinical phenotype of nephrogenic diabetes insipidus in females heterozygous for a vasopressin type 2 receptor mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skewed X-inactivation is the most likely explanation for the clinical
      manifestation of NDI in female carriers of an AVPR2 mutation.
    explanation: >-
      The original clinical description of symptomatic female heterozygotes and the
      proposed explanation. Quoted with its hedge - the authors say "most likely",
      not that they demonstrated it in these families.
  - reference: PMID:32073219
    reference_title: "A female with X-linked Nephrogenic diabetes insipidus in a family with inherited central diabetes Insipidus: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The review underlines that XL-NDI in female AVPR2 heterozygotes is always
      accompanied by skewed X-inactivation, emphasizing a need for X-inactivation
      studies in these females.
    explanation: >-
      The strongest available statement of the association, from a review of 23 families
      with affected females. Note it is an association in every studied case, not a
      demonstration that skewing is sufficient.
  - reference: PMID:35865667
    reference_title: "A Novel Missense Mutation of Arginine Vasopressin Receptor 2 in a Chinese Family with Congenital Nephrogenic Diabetes Insipidus: X-Chromosome Inactivation in Female CNDI Patients with Heterozygote 814A>G Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Skewed X-chromosome inactivation patterns of the normal X allele were observed in
      4 females with the AVPR2 gene mutation and symptoms of diabetes insipidus, but not
      in an asymptomatic female with the AVPR2 gene mutation.
    explanation: >-
      The within-family contrast - skewed in the symptomatic heterozygotes, not skewed
      in the asymptomatic one - which is the closest thing the cited literature offers
      to a controlled comparison.
  - reference: PMID:10820168
    reference_title: Report of 33 novel AVPR2 mutations and analysis of 117 families with X-linked nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A de novo mutation arose during oogenesis in the mother in 20% of isolated cases.
    explanation: The source for the de novo rate and for its parental origin.
progression:
- phase: Neonatal period and infancy
  notes: >-
    This is where the disease is dangerous and where it is missed. The presentation is
    not polyuria and thirst; it is a vomiting, anorexic, poorly growing infant with
    unexplained fever who dehydrates rapidly with any intercurrent illness, hot
    weather, or withholding of water. Most patients - 87 per cent in the largest series
    - are diagnosed within the first two and a half years, which is another way of
    saying that a substantial minority are not. Because the infant cannot drink to
    thirst unaided, carer-dependent water supply is the only thing preventing
    hypernatraemia, and being nil by mouth for a procedure is a specific hazard.
  evidence:
  - reference: PMID:10477148
    reference_title: Clinical presentation and follow-up of 30 patients with congenital nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of patients (87%) were diagnosed within the first 2.5 yr of life.
      Main symptoms at clinical presentation were vomiting and anorexia, failure to
      thrive, fever, and constipation.
    explanation: Gives both the timing of diagnosis and the presenting symptom set.
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected untreated infants usually have poor feeding and failure to thrive, and
      rapid onset of severe dehydration with illness, hot environment, or the
      withholding of water.
    explanation: Names the precipitants of decompensation in infancy.
  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at diagnosis was 4.2 months interquartile range (IQR 1.1, 9.8).
    explanation: >-
      The best available figure for age at diagnosis, from 66 children across 16 centres.
      Note the upper quartile: a quarter were diagnosed after ten months.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median age at diagnosis was 7.5 months (interquartile range (IQR): 6.0-9.0).
    explanation: >-
      A second, later median from a different centre. Recorded alongside the first rather
      than averaged - these are two cohorts, not one estimate.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At diagnosis, the median serum sodium level was 160.5 mmol/L (IQR: 139-168), and the
      urine/plasma osmolality ratio was 0.41 (IQR: 0.26-0.49).
    explanation: >-
      Puts numbers on how decompensated these infants are when they are found: a median
      sodium of 160.5 mmol/L at diagnosis, with urine more dilute than plasma.
- phase: Childhood
  notes: >-
    Once water is freely available and drug therapy started, the acute danger recedes
    and the problem becomes chronic: polyuria, polydipsia, nocturia and bed-wetting,
    weight that eventually catches up, and height that largely does not. Growth and
    electrolyte surveillance is recommended three-monthly in infants and six-monthly in
    older children, with annual renal ultrasound for the urinary tract.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monitor growth and development at least every three months in infants and at least
      every six months in older children; measurement of serum sodium concentration to
      identify unrecognized hyperosmolality and early dehydration at least every three
      months in infants, at least every six months in older children, and annually in
      adults or only as needed; annual kidney ultrasound examination to monitor for
      hydronephrosis and megacystis.
    explanation: >-
      The surveillance schedule, which is also an implicit statement of what the expected
      complications are at each age.
  - reference: PMID:10477148
    reference_title: Clinical presentation and follow-up of 30 patients with congenital nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Height SD scores for age remained below the 50th percentile in the majority of
      patients, whereas weight for height SD scores showed a catch-up after several
      years of underweight.
    explanation: The long-term growth trajectory, distinguishing height from weight.
- phase: Adolescence and adulthood
  notes: >-
    The urinary tract consequences dominate late. Dilatation accumulates silently over
    years of high flow and can reach severe hydronephrosis with megacystis, poor
    bladder drainage, recurrent infection and impaired renal function; one reported
    adolescent was voiding 10 to 15 litres daily with dilatation of pelvis, ureter and
    bladder. One review also notes an apparent loss of efficacy of medical treatment
    during school age, which if real is a reason not to assume a stable regimen lasts.
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Some authors note a generally favorable long-term outcome and an apparent loss of
      efficacy of medical treatment during school age.
    explanation: >-
      Records both halves as the review states them: a generally favourable outcome, and
      an apparent waning of treatment effect. Attributed to "some authors" in the source,
      and reproduced with that attribution rather than asserted.
  - reference: PMID:22498392
    reference_title: Nonobstructive urinary tract dilatation in children with diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urodynamics have shown the bladder itself to be compliant, but drainage is poor
      leading to further renal impairment and overflow incontinence.
    explanation: >-
      States the late renal consequence of the dilated tract and the urodynamic finding
      that distinguishes it from an obstructive or non-compliant bladder.
  - reference: PMID:39644399
    reference_title: The natural history of untreated X-linked nephrogenic diabetes insipidus with mutation in the vasopressin V2 receptor gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The untreated grandfather's case highlights the potential severity of untreated NDI
      and the benefits of timely therapeutic intervention.
    explanation: >-
      The authors' reading of their own two-generation comparison, which is the closest
      approach to untreated natural history the literature offers for this disease.
diagnosis:
- name: Molecular genetic testing of AVPR2
  presence: PRESENT
  description: >-
    The diagnostic test. A hemizygous pathogenic AVPR2 variant establishes the
    diagnosis in a male proband; a heterozygous one does so in a female proband, in whom
    an X-inactivation study is then informative about why she is symptomatic. The
    alternative to exclude is biallelic AQP2 variation, which gives a clinically
    indistinguishable phenotype with different inheritance and different counselling.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of hereditary NDI is usually established in a female proband with
      NDI by identification of a heterozygous pathogenic variant in AVPR2 or
      identification of a compound heterozygous or homozygous pathogenic variant in AQP2
      by molecular genetic testing.
    explanation: >-
      The diagnostic criterion in a female proband, which is the half of this that is
      easy to get wrong.
  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic testing or a known family history was present in 70% of the patients; out of
      those genetically tested, 89 and 11% had mutations in AVPR2 and AQP2, respectively.
    explanation: >-
      A real-world check on the textbook 90:10 split, and a reminder that 30 per cent of a
      contemporary cohort had neither genetic testing nor a family history.
- name: Failure to concentrate urine after desmopressin
  presence: PRESENT
  description: >-
    The physiological discriminator between nephrogenic and central diabetes insipidus.
    A nephrogenic kidney does not concentrate urine when given exogenous vasopressin or
    desmopressin, because the defect is downstream of the hormone. Note that in the
    AVPR2 form the absence of response is not confined to the kidney: extrarenal V2
    receptor responses to desmopressin, such as the rise in coagulation factors, are
    also absent, and that was used as confirmatory evidence in symptomatic female
    heterozygotes.
  evidence:
  - reference: PMID:7607658
    reference_title: Clinical phenotype of nephrogenic diabetes insipidus in females heterozygous for a vasopressin type 2 receptor mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximal urine osmolality in three female patients did not exceed 200 mosmol/kg and
      the absence of extra-renal responses to 1-desamino-8-D-arginine vasopressin was
      demonstrated in two of them.
    explanation: >-
      Gives both the renal non-response with a numeric ceiling and the extrarenal
      non-response specific to a receptor-level lesion.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All desmopressin tests were negative.
    explanation: >-
      Every patient in the cohort failed to respond, which is the consistency that makes a
      negative desmopressin test useful rather than merely suggestive.
  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A desmopressin acetate loading test was administered to 46% of children at a median
      age of 4.8 months (IQR 2.8, 7.6); only 15% had a water restriction test.
    explanation: >-
      Shows what is actually done: fewer than half had a desmopressin test and only 15 per
      cent a water restriction test, so in practice the diagnosis is often made without
      either.
treatments:
- name: Free Access to Water
  description: >-
    The foundation of management and the one intervention that is non-negotiable.
    Because the water loss is obligatory, thirst-driven intake is the only
    compensation, so restricting water - including the routine nil-by-mouth before a
    procedure - converts a manageable chronic condition into acute hypernatraemia.
    GeneReviews lists water restriction explicitly under agents and circumstances to
    avoid, and specifies that a patient who must be nil by mouth receives their usual
    oral water intake intravenously as 5 per cent dextrose rather than saline.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: free access to drinking water and toilet facilities
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Obligatory Hypotonic Free Water Loss
    treatment_effect: MODULATES
    description: >-
      It does not reduce the water loss at all; it replaces it. Recorded as MODULATES
      rather than INHIBITS for that reason.
    evidence:
    - reference: PMID:20301356
      reference_title: Hereditary Nephrogenic Diabetes Insipidus.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: free access to drinking water and to toilet facilities
      explanation: >-
        The management measure itself, as GeneReviews words it. It is the replacement of
        the loss, not its reduction, which is why the effect is MODULATES.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Water intake must not be restricted.
    explanation: >-
      The GeneReviews agents-to-avoid statement. Short, but it is the complete
      proposition and it is the single most important management instruction in the
      disease.
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      when "NPO" (nothing per ora), individuals with NDI must have intravenous
      replacement of their usual oral intake of water as 5% dextrose in water
    explanation: >-
      The specific peri-procedural instruction, including the fluid to use, which is
      where this goes wrong in practice.
- name: Thiazide Diuretic
  description: >-
    The counterintuitive mainstay: a diuretic given to reduce urine output. Used with
    a low-sodium diet it reduces polyuria by up to 50 per cent without causing
    hypernatraemia, and it is the one drug on which paediatric nephrologists agree -
    93 per cent of surveyed providers prescribe a thiazide. The mechanism is indirect
    and does not involve the collecting duct at all: the thiazide causes natriuresis,
    sodium depletion follows, and the resulting fall in effective renal plasma flow
    and glomerular filtration rate reduces distal delivery. Work in Brattleboro rats
    showed the antidiuresis disappears when sodium depletion is prevented, and that
    under those conditions urine volume actually rises - evidence that the antidiuretic
    effect is entirely secondary to volume contraction, with an additional suggestion
    of reduced proximal fluid reabsorption. Note the model caveat: those experiments
    used the hypothalamic (central) form of the disease, not a receptor-level one. On
    efficacy: serum sodium normalised in every patient of one long-term cohort on
    hydrochlorothiazide plus amiloride, but polyuria and polydipsia persisted in all of
    them throughout a median of 16.9 years - which is the honest summary of what this
    regimen achieves. It protects against hypernatraemia; it does not fix the water loss.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrochlorothiazide
      term:
        id: CHEBI:5778
        label: hydrochlorothiazide
  target_mechanisms:
  - target: Obligatory Hypotonic Free Water Loss
    treatment_effect: MODULATES
    description: >-
      Reduces the volume of the obligatory loss by reducing distal delivery, through
      volume contraction. It does not restore collecting duct water permeability and
      does not touch the receptor defect.
    evidence:
    - reference: PMID:630797
      reference_title: The role of sodium depletion in hydrochlorothiazide-induced antidiuresis in Brattleboro rats with diabetes insipidus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        The results indicate that the antidiuresis caused by hydrochlorothiazide in
        diabetes insipidus results, at least in part, from falls in effective renal
        plasma flow and glomerular filtration rate. These in turn seem to be entirely
        secondary to the drug-induced sodium depletion.
      explanation: >-
        Establishes the mechanism of the antidiuresis, in the only experiment cited here
        that manipulated sodium balance to test it. Marked INDIRECT because the model is
        the hypothalamic form of diabetes insipidus, so the finding transfers to XNDI by
        the argument that the drug acts upstream of the collecting duct rather than by
        direct demonstration in a V2 receptor-deficient animal.
  evidence:
  - reference: PMID:20301356
    reference_title: Hereditary Nephrogenic Diabetes Insipidus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      reduction of polyuria (and thus polydipsia) up to 50% without inducing
      hypernatremia by use of a thiazide diuretic (e.g., hydrochlorothiazide,
      chlorothiazide) often used in combination with either amiloride (a
      potassium-sparing diuretic) or indomethacin; dietary restriction of sodium
    explanation: >-
      Quantifies the achievable benefit, names the agents, and records that the thiazide
      is normally combined with amiloride or indomethacin and paired with sodium
      restriction.
  - reference: PMID:40922895
    reference_title: "Nephrogenic Diabetes Insipidus: Three Decades of Clinical Reality."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over a median follow-up period of 16.9 years (IQR: 8.4-17.4), growth improved, but all
      patients continued to exhibit polyuria and polydipsia.
    explanation: >-
      The ceiling on what the regimen does: growth improves, the polyuria does not go away.
      This is the sentence that keeps the treatment framed as symptomatic.
  - reference: PMID:29162216
    reference_title: "Treatment regimens by pediatric nephrologists in children with congenital nephrogenic diabetes insipidus: A MWPNC study ."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results suggest consensus on the use of thiazides, while the use of
      indomethacin is limited by GI and renal side effect profile.
    explanation: >-
      Establishes the thiazide as the point of consensus and locates the disagreement at
      indomethacin.
  - reference: PMID:32039113
    reference_title: "Diagnosis, Treatment, and Outcomes in Children With Congenital Nephrogenic Diabetes Insipidus: A Pediatric Nephrology Research Consortium Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common treatments were thiazide diuretics (74%), potassium-sparing diuretics
      (67%) and non-steroidal anti-inflammatory drugs (42%).
    explanation: >-
      What was actually prescribed to 66 children, rather than what providers say they
      prescribe. It is the source for the prescribing proportions on this treatment, on
      Amiloride and on Indomethacin or Other NSAID.
- name: Amiloride
  description: >-
    A potassium-sparing diuretic added to a thiazide, prescribed by 62 per cent of
    surveyed paediatric nephrologists. Two reasons are given in the literature for
    preferring it as the partner drug: it offsets the thiazide's potassium loss, and it
    avoids the gastrointestinal and renal toxicity that limits indomethacin. The
    combination was the maintenance regimen for most patients in the 30-patient series,
    reportedly without significant side effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

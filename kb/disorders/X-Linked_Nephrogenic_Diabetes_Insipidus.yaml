    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of NDI consist of sufficient water intake, low-sodium diet, diuretic
      thiazide, sometimes in combination with a cyclooxygenase (COX) inhibitor
      (indomethacin) or nonsteroidal anti-inflammatory drugs (NSAIDs), or
      hydrochlorothiazide in combination with amiloride.
    explanation: >-
      The full regimen as the review states it, and the source for indomethacin being a
      cyclooxygenase inhibitor used as an optional addition rather than a mainstay.
- name: Low-Solute, Sodium-Restricted Diet
  description: >-
    A dietary rather than pharmacological intervention, and a necessary partner to the
    thiazide: because the obligatory urine volume is set by the solute load that has to
    be excreted, reducing dietary solute - principally sodium - reduces the volume
    directly. This is the correct slot for the diet, not a drug with an agent binding.
    The accompanying nutritional problem pulls the other way, since an infant with
    failure to thrive needs calories, which is why dietitian involvement is standard
    and why a gastrostomy is often how both requirements are met at once.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: low-solute, sodium-restricted diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
    dietary_modifications:
    - action: RESTRICT
      description: >-
        Dietary restriction of sodium, to reduce the osmolar load that must be excreted
        and so the obligatory urine volume.
    - action: RESTRICT
      description: >-
        Reduction of total dietary solute load, the broader version of the same
        principle.
  target_mechanisms:
  - target: Obligatory Hypotonic Free Water Loss
    treatment_effect: MODULATES
    description: >-
      Lowers the solute load whose excretion obliges the water loss, reducing its volume
      without affecting the collecting duct defect.

    modifier: ABSENT
    term:
      id: GO:0017046
      label: peptide hormone binding
  - preferred_term: arginine vasopressin V2 receptor activity
    modifier: ABSENT
    term:
      id: GO:0005000
      label: vasopressin receptor activity
  downstream:
  - target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
    causal_link_type: DIRECT
    description: >-
      A surface receptor that cannot bind hormone or activate Gs leaves the cascade
      just as silent as an absent one.
    evidence:
    - reference: PMID:11389590
      reference_title: Association of calnexin with wild type and mutant AVPR2 that causes nephrogenic diabetes insipidus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The S315R was properly processed through the Golgi and targeted to the plasma
        membrane but lacked any detectable AVP binding or signaling.
      explanation: >-
        The measurement that establishes this edge: a correctly localised receptor with no
        detectable signalling, so surface delivery alone does not rescue the cascade.
  evidence:
  - reference: PMID:11389590
    reference_title: Association of calnexin with wild type and mutant AVPR2 that causes nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, this mutation induces a conformational change that is compatible with
      endoplasmic reticulum (ER) export but dramatically affects hormone recognition.
    explanation: >-
      States the defining property of this class: ER export is intact and hormone
      recognition is not.
- name: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
  description: >-
    Vasopressin normally acts on the principal cell through a single linear cascade:
    V2 receptor occupancy activates the stimulatory G protein Gs, Gs activates adenylyl
    cyclase, cAMP rises, and cAMP activates protein kinase A. With no functional
    receptor at the membrane the cascade has no input. Note what is intact: the
    hormone, the G protein, the cyclase and PKA itself are all normal, which is the
    reason every experimental strategy for XNDI has aimed at re-entering the cascade
    below the receptor.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: renal collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  biological_processes:
  - preferred_term: vasopressin-stimulated adenylyl cyclase signalling
    modifier: ABSENT
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  - preferred_term: cAMP generation in the principal cell
    modifier: DECREASED
    term:
      id: GO:0006171
      label: cAMP biosynthetic process
  - preferred_term: cellular response to vasopressin
    modifier: ABSENT
    term:
      id: GO:1904117
      label: cellular response to vasopressin
  molecular_functions:
  - preferred_term: protein kinase A activity downstream of the V2 receptor
    modifier: DECREASED
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  pdb_structures:
  - pdb_id: 7KH0
    description: >-
      Cryo-EM structure of the agonist-bound AVP-V2 receptor-Gs ternary complex - the
      assembly that fails to form in this disease. A wild-type complex, so it is an image
      of the normal coupling step and not of any mutant receptor; its value here is that
      it shows what the receptor has to do and that V2R is the only vasopressin or
      oxytocin receptor that activates Gs.
    method: cryo-EM
    ligand: arginine vasopressin
    target_protein: vasopressin V2 receptor (AVPR2) in complex with heterotrimeric Gs
    publication: PMID:33664408
  downstream:
  - target: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
    causal_link_type: DIRECT
    description: >-
      PKA activation is the step that couples the cascade to aquaporin-2; without it
      the water channel is neither phosphorylated nor redistributed.
    evidence:
    - reference: PMID:32245905
      reference_title: Phosphoproteomic Identification of Vasopressin/cAMP/Protein Kinase A-Dependent Signaling in Kidney.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Vasopressin signaling is initiated by binding to a G-protein-coupled receptor
        called V2R, which signals through heterotrimeric G-protein subunit Gs α,
        adenylyl cyclase 6, and activation of the cAMP-regulated protein kinase (PKA).
      explanation: >-
        Names the cascade in order, establishing PKA as the receptor's downstream
        effector and so the step that fails when the receptor is absent.
  evidence:
  - reference: PMID:34055061
    reference_title: Nephrogenic diabetes insipidus in children (Review).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Nephrogenic diabetes insipidus (NDI) is characterized by impaired urinary
      concentrating ability, despite normal or elevated plasma concentrations of the
      antidiuretic hormone, arginine vasopressin (AVP).
    explanation: >-
      Establishes that hormone supply is intact, which is what locates the lesion in
      the cell's response rather than in the signal.
  - reference: PMID:33664408
    reference_title: Cryo-EM structure of the AVP-vasopressin receptor 2-G(s) signaling complex.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among all AVP and OT receptors, V2R is the only one that activates the heterotrimeric
      Gsfamily to induce cAMP accumulation
    explanation: >-
      Establishes that no other vasopressin or oxytocin receptor can substitute for V2R on
      this cascade, which is why losing it silences cAMP generation outright rather than
      reducing it. Quoted as the cached text renders it, with the subscript of "Gs" run
      together with the following word.
- name: Failure of Aquaporin-2 Phosphorylation and Apical Insertion
  description: >-
    Aquaporin-2 is the vasopressin-regulated water channel of the principal cell, and
    it is regulated by being moved. PKA phosphorylates AQP2 at Ser256 and the channel
    is redistributed from intracellular vesicles into the apical membrane, where it
    makes the luminal surface water-permeable. In XNDI the AQP2 protein itself is
    normal - that is the defining feature separating this disease from the autosomal
    AQP2-mutation form - and the failure is purely one of regulation. It is also the
    reason the whole therapeutic literature is framed as "reach AQP2 without the
    receptor".
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: renal collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  cellular_components:
  - preferred_term: apical plasma membrane of the principal cell
    term:
      id: GO:0016324
      label: apical plasma membrane
  biological_processes:

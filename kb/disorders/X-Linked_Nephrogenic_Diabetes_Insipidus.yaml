name: X-Linked Nephrogenic Diabetes Insipidus
creation_date: "2026-09-10T00:00:00Z"
description: >-
  X-linked nephrogenic diabetes insipidus (XNDI) is the receptor-level form of
  hereditary nephrogenic diabetes insipidus. Loss-of-function variants in AVPR2,
  which encodes the arginine vasopressin V2 receptor of the renal collecting duct,
  leave the kidney unable to respond to circulating vasopressin. Hormone supply is
  intact - plasma vasopressin is normal or high - so the lesion is entirely distal
  to the hormone, in the principal cell's own signalling apparatus. Most pathogenic
  AVPR2 missense and small in-frame variants do not destroy ligand binding; they
  misfold the receptor, and the endoplasmic reticulum quality-control machinery
  retains it inside the cell so that it never reaches the membrane where vasopressin
  could find it. Without a surface receptor there is no Gs/adenylyl cyclase/cAMP/PKA
  signal, aquaporin-2 is not phosphorylated or shuttled to the apical membrane, the
  collecting duct stays water-impermeable, and the medullary countercurrent
  concentrating mechanism cannot be exploited. The result is obligatory hypotonic
  polyuria from birth. The presentation is a pediatric one: affected male infants
  come to attention with vomiting, poor feeding, failure to thrive, unexplained
  fever and hypernatraemic dehydration rather than with the polyuria-polydipsia of
  the adult textbook description, and the chronically high urine flow deforms a
  structurally normal urinary tract into hydronephrosis, hydroureter and megacystis.
categories:
- Mendelian
- Renal Tubular Disorder
- Receptor Trafficking Disorder
synonyms:
- nephrogenic diabetes insipidus type 1
- congenital nephrogenic diabetes insipidus, X-linked
- AVPR2-related nephrogenic diabetes insipidus
- X-linked vasopressin-resistant diabetes insipidus

pathophysiology:
- name: AVPR2 Loss-of-Function Variant
  description: >-
    A hemizygous pathogenic variant in AVPR2 on Xq28, the gene encoding the arginine
    vasopressin V2 receptor. The allelic spectrum is wide and largely private: 82
    different putative disease-causing variants were found among 117 families, and
    haplotype analysis indicates that recurrences of the same variant in apparently
    unrelated families arose independently rather than from a shared founder. Roughly
    a fifth of isolated cases are de novo, arising during oogenesis in the mother.
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: AVPR2
      term:
        id: hgnc:897
        label: AVPR2
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Hemizygous in affected males. Heterozygous females are affected only when
      X-inactivation is skewed against the normal allele.
  molecular_functions:
  - preferred_term: arginine vasopressin V2 receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005000
      label: vasopressin receptor activity
  downstream:
  - target: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
    causal_link_type: DIRECT
    description: >-
      The majority route. A misfolding missense or small in-frame variant is
      recognised by ER quality control and the receptor never reaches the membrane.
    evidence:
    - reference: PMID:17516711
      reference_title: "Pharmacological chaperones in nephrogenic diabetes insipidus: possibilities for clinical application."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro V2R expression studies revealed that the function of most of these
        receptors is not disturbed, but due to their misfolding, the quality control
        mechanism of the endoplasmic reticulum (ER) retains these receptors inside
        the cell, thereby preventing their functioning at the plasma membrane.
      explanation: >-
        States the causal step directly, and states that it is the mechanism for most
        variants - which is why this is the main edge out of the lesion node rather
        than one of several equal alternatives.
  - target: Signalling-Incompetent Cell-Surface V2 Receptor
    causal_link_type: DIRECT
    description: >-
      The minority route, for variants that fold well enough to pass ER quality
      control but cannot bind vasopressin or couple to Gs at the membrane.
    evidence:
    - reference: PMID:11389590
      reference_title: Association of calnexin with wild type and mutant AVPR2 that causes nephrogenic diabetes insipidus.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The S315R was properly processed through the Golgi and targeted to the plasma
        membrane but lacked any detectable AVP binding or signaling.
      explanation: >-
        A worked example of a variant that reaches the surface and still fails, which
        is what distinguishes this edge from the ER-retention edge.
  evidence:
  - reference: PMID:10820168
    reference_title: Report of 33 novel AVPR2 mutations and analysis of 117 families with X-linked nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 117 families, there were 82 different putative disease-causing mutations.
      Based on haplotype analysis, it can be inferred that when the same AVPR2
      mutation is identified in different families that were not known to be related,
      the mutations most likely arose independently.
    explanation: Establishes the breadth and independence of the allelic spectrum.
  - reference: PMID:10820168
    reference_title: Report of 33 novel AVPR2 mutations and analysis of 117 families with X-linked nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A de novo mutation arose during oogenesis in the mother in 20% of isolated cases.
    explanation: Quantifies the de novo contribution in isolated male cases.
- name: Endoplasmic Reticulum Retention of Misfolded V2 Receptor
  description: >-
    The pathognomonic cell-biological lesion of XNDI, and the reason the disease is a
    trafficking disorder rather than a ligand-recognition disorder. A misfolded V2
    receptor is held in the endoplasmic reticulum by the same chaperone-based quality
    control that polices any nascent membrane protein; calnexin associates with the
    ER-retained receptor for longer than with the wild-type one. The receptor is often
    intrinsically capable of signalling - it is simply in the wrong compartment. That
    distinction is what makes pharmacochaperone rescue conceivable at all, and it is
    why a cell-permeable non-peptide ligand can restore membrane expression of a
    mutant receptor that a membrane-impermeant peptide agonist could never reach.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: renal collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: delivery of the V2 receptor to the plasma membrane
    modifier: DECREASED
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
  - preferred_term: protein folding in the endoplasmic reticulum
    modifier: ABNORMAL
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
  downstream:
  - target: Loss of Vasopressin-Stimulated cAMP and PKA Signalling
    causal_link_type: DIRECT
    description: >-
      A receptor held inside the cell cannot be occupied by circulating vasopressin,
      so the Gs-adenylyl cyclase cascade is never engaged.
    evidence:
    - reference: PMID:16926443
      reference_title: "Functional rescue of vasopressin V2 receptor mutants in MDCK cells by pharmacochaperones: relevance to therapy of nephrogenic diabetes insipidus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Intracellular retention of a functional vasopressin V2 receptor (V2R) is a
        major cause of congenital nephrogenic diabetes insipidus (NDI) and rescue of
        V2R mutants by nonpeptide antagonists may restore their basolateral membrane
        (BM) localization and function.
      explanation: >-
        States that intracellular retention of an otherwise functional receptor is the
        causative defect, and that restoring its localisation restores its function -
        the experimental demonstration that localisation is the rate-limiting step.
  evidence:
  - reference: PMID:11389590
    reference_title: Association of calnexin with wild type and mutant AVPR2 that causes nephrogenic diabetes insipidus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, its association with the ER-retained R337X mutant was found to be
      longer than with the WT receptor suggesting that this molecular chaperone also
      plays a role in quality control and ER retention of misfolded G protein-coupled
      receptors.
    explanation: >-
      Identifies calnexin-dependent ER quality control as the machinery doing the
      retaining, rather than leaving the retention unexplained.
  - reference: PMID:31928727
    reference_title: "Misfolding of vasopressin receptors: biased agonist pharmacochaperones as potential therapeutics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In most of the cases, it is associated to inactivating mutations of the renal
      arginine-vasopressin V2 receptor leading to misfolding and intracellular retention
      of the receptor, causing the inability of patients to concentrate their urine in
      response to the antidiuretic hormone.
    explanation: >-
      A review-level statement of the whole chain in one sentence - misfolding, retention,
      and the concentrating failure - and of the fact that this is the route in most
      cases. Cited as a synthesis claim rather than for any single experiment.
  - reference: PMID:32138955
    reference_title: V2 vasopressin receptor mutations.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanisms underlying a V2R loss-of-function can be theoretically classified
      as either protein expression, localization (ER retention) or functional
      disorders. Functional analyses have revealed however that these mechanisms are
      likely to be complex.
    explanation: >-
      Places ER retention as one of three recognised loss-of-function classes, and
      records the reviewers' own caveat that the classes are not clean - which is why
      this entry keeps a separate surface-expressed node rather than collapsing them.
- name: Signalling-Incompetent Cell-Surface V2 Receptor
  description: >-
    The minority class of AVPR2 variants, in which the receptor folds well enough to
    be exported from the ER and delivered to the basolateral membrane of the principal
    cell but cannot transduce a vasopressin signal from there - either because
    hormone recognition is destroyed, or because coupling to Gs is. This node is kept
    separate from the ER-retention node because it carries a different therapeutic
    implication: a pharmacochaperone has nothing to correct.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: renal collecting duct principal cell
    term:

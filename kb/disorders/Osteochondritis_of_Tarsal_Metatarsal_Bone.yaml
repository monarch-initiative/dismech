environmental:
- name: Mechanical and Vascular Susceptibility
  presence: Possible
  description: >
    The immediate cause is not established. Reviews of osteochondrosis describe
    possible contributions from mechanical factors, repetitive trauma, and
    vascular abnormalities; these remain mechanistic hypotheses rather than
    confirmed single causes for Kohler disease.
  evidence:
  - reference: PMID:31083875
    reference_title: "Apophysitis and Osteochondrosis: Common Causes of Pain in Growing Bones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple possible etiologies have been explored, including genetic causes, hormonal imbalances, mechanical factors, repetitive trauma, and vascular abnormalities."
    explanation: >
      Summarizes proposed mechanical, traumatic, and vascular etiologic factors
      across pediatric osteochondroses without establishing a single cause
      specific to Kohler disease.
treatments:
- name: Relative Rest and Offloading
  description: >
    Relative rest, reduction of painful midfoot loading, and clinical monitoring
    are conservative first-line approaches for pediatric osteochondrosis
    including Kohler disease, instantiating mechanical unloading of the necrotic
    segment during spontaneous remodeling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Navicular Structural Collapse and Fragmentation
    treatment_effect: INHIBITS
    description: >
      Reducing weight-bearing stress across the medial longitudinal arch unloads
      the weakened osteonecrotic navicular during the resorptive and remodeling
      phase, corresponding to the ischemic bone necrosis module's mechanical
      unloading pattern.
  target_phenotypes:
  - preferred_term: Foot pain
    term:
      id: HP:0025238
      label: Foot pain
  evidence:
  - reference: PMID:31083875
    reference_title: "Apophysitis and Osteochondrosis: Common Causes of Pain in Growing Bones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteochondrosis generally resolves with relative rest, but close monitoring is needed to ensure resolution."
    explanation: >
      This supports relative rest and monitoring as conservative management for
      osteochondrosis.
- name: Short-Leg Walking Cast Immobilization
  description: >
    Short-leg walking cast immobilization provides external mechanical unloading
    of the midfoot and shortens symptom duration in symptomatic children while
    long-term navicular reconstitution remains favorable.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: short-leg walking cast immobilization
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Navicular Structural Collapse and Fragmentation
    treatment_effect: INHIBITS
    description: >
      External cast immobilization offloads mechanical forces across the necrotic
      tarsal navicular (matching the ischemic bone necrosis module's mechanical
      unloading and containment pattern), shortening painful morbidity while
      spontaneous reconstitution proceeds.
  target_phenotypes:
  - preferred_term: Foot pain
    term:
      id: HP:0025238
      label: Foot pain
  - preferred_term: Painful limping and weight-bearing difficulty
    term:
      id: HP:0001288
      label: Gait disturbance
  evidence:
  - reference: PMID:30685015
    reference_title: "Köhler Disease: Avascular Necrosis in the Child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term outcomes for Köhler disease are favorable regardless of the type of treatment, although a short period of immobilization with a short leg walking cast may reduce the duration of symptoms."
    explanation: >
      This review supports cast immobilization as a symptom-duration-reducing
      conservative option.
  - reference: PMID:7273526
    reference_title: "Köhler's disease of the tarsal navicular."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whereas patients who were not treated in a short-leg cast had symptoms for an average duration of 15 months, treated patients had symptoms for less than three months."
    explanation: >
      This clinical series directly reports shorter symptom duration with a
      short-leg cast.
- name: Navicular Decompression and Micro-Circulation Reconstruction
  description: >
    Surgery is not routine for Kohler disease, but a small refractory pediatric
    series reported navicular decompression with micro-circulation reconstruction
    after unsuccessful conservative treatment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Disturbed Navicular Ossification and Circulation
    treatment_effect: MODULATES
    description: >
      Microsurgical decompression and vascular reconstruction aim to restore
      local perfusion to the ischemic tarsal navicular.
  - target: Ischemic Navicular Osteonecrosis
    treatment_effect: MODULATES
    description: >
      Decompression of the osteonecrotic navicular aims to relieve intraosseous
      ischemia in refractory pediatric cases.
  target_phenotypes:
  - preferred_term: Foot pain
    term:
      id: HP:0025238
      label: Foot pain
  evidence:
  - reference: PMID:38491143
    reference_title: "Clinical report of microsurgical treatment of Kohler's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From October 2013 to July 2015, 3 children with Kohler's disease underwent navicular decompression and micro-circulation reconstruction surgery in our hospital."
    explanation: >
      Documents a microsurgical decompression and revascularization procedure in
      three children with refractory Kohler disease.
  - reference: PMID:38491143
    reference_title: "Clinical report of microsurgical treatment of Kohler's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Navicular decompression and micro-circulation reconstruction surgery may quickly improve the ischemic status of navicular bone, alleviate pain symptom and enable patients to resume normal activity as soon as possible."
    explanation: >
      Suggests potential improvement in navicular ischemia and pain relief in
      refractory cases based on an uncontrolled three-patient case series.
notes: >
  MONDO:0016086 specifically defines childhood osteochondrosis and avascular
  necrosis of the tarsal navicular (Kohler disease), which is nosologically
  distinct from metatarsal-head osteochondrosis (Freiberg disease) and
  adult-onset spontaneous tarsal navicular osteonecrosis (Muller-Weiss disease).
  Within the ischemic_bone_necrosis_and_repair module, Kohler disease anchors to
  Bone Vascular Supply Interruption, Ischemic Osteocyte and Marrow Cell Death,
  Structural Failure of Necrotic Bone under Mechanical Load, and
  Resorption-Dominant Revascularization and Creeping Substitution; it omits
  Epiphyseal Cartilage-Canal Ischemic Chondronecrosis and Growth Plate Injury and
  Delayed Endochondral Ossification because the tarsal navicular is a primary
  tarsal ossification center rather than a long-bone epiphysis/physis and
  reconstitutes without physeal growth-plate arrest. For Short-Leg Walking Cast
  Immobilization, OAK searches of NCIT (`l~immobilization`, `l~splint`,
  `l~orthopedic`) showed that NCIT:C142778 (Immobilization) sits under
  NCIT:C158344 (Physical Restraint), NCIT:C157808 (Casts and Splints) sits under
  NCIT:C16830 (Medical Device), and NCIT:C52008 (Orthopedic Stabilization) sits
  under NCIT:C16186 (Orthopedic Surgical Procedure), so none provides a
  non-surgical cast-immobilization term under NCIT:C25218 (Clinical Intervention
  or Procedure); NCIT:C49236 (Therapeutic Procedure) is used with
  preferred_term: short-leg walking cast immobilization, matching the module's
  Mechanical Unloading and Containment of the Necrotic Segment pattern.

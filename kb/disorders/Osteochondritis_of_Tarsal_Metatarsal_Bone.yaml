  downstream:
  - target: Navicular Avascular Necrosis
    description: >
      Focal ischemic bone death manifests clinically and pathologically as
      avascular necrosis of the tarsal navicular.
    causal_link_type: DIRECT
  - target: Navicular Structural Collapse and Fragmentation
    description: >
      Necrotic navicular trabeculae lose mechanical integrity under midfoot
      weight-bearing loads, leading to sclerosis, flattening, and fragmentation.
    causal_link_type: DIRECT
  - target: Spontaneous Revascularization and Navicular Reconstitution
    description: >
      Ischemic necrosis in the growing pediatric navicular triggers subsequent
      revascularization, bone remodeling, and eventual structural reconstitution.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Navicular Structural Collapse and Fragmentation
  conforms_to: "ischemic_bone_necrosis_and_repair#Structural Failure of Necrotic Bone under Mechanical Load"
  biological_scale: TISSUE
  description: >
    Under mechanical midfoot loading, the necrotic tarsal navicular develops
    increased radiographic density/sclerosis, anteroposterior flattening,
    fragmentation, and irregular rarefaction, provoking localized medial midfoot
    pain, soft-tissue swelling, and antalgic limping.
  cell_types:
  - preferred_term: Osteocyte
    term:
      id: CL:0000137
      label: osteocyte

  conforms_to: "ischemic_bone_necrosis_and_repair#Resorption-Dominant Revascularization and Creeping Substitution"
  biological_scale: TISSUE
  description: >
    Because the pediatric tarsal navicular retains robust vascular and
    osteogenic repair capacity, the necrotic center undergoes spontaneous
    revascularization, bone remodeling, and complete radiographic and functional
    reconstitution over months to years.

progression:
- phase: Outcome in adult and mixed-age WHO-defined cohorts
  evidence:
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall median survival was 18 months and 37% of patients are alive at 5
      years. Age, Ph(+), and AML therapy were predictors for poor outcome
    explanation: >-
      Provides overall survival and adverse prognostic factors in a
      predominantly adult WHO-defined MPAL cohort.
  notes: >-
    MPAL is a poor-risk acute leukemia; older age, Philadelphia positivity in
    the pre-TKI era, and AML-directed induction were adverse in this series.
- phase: Outcome after allogeneic transplantation in adults
  age_range: adult
  evidence:
  - reference: PMID:36959485
    reference_title: "Multicenter retrospective analysis of clinical outcome of adult patients with mixed-phenotype acute leukemia treated with acute myeloid leukemia-like or acute lymphoblastic leukemia-like chemotherapy and impact of allogeneic stem cell transplantation: a Campus ALL study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An AlloSCT was performed in 50 patients (65%). The 5-year OS of
      transplanted patients was 54%. The OS post-AlloSCT was better in patients
      who were minimal residual disease (MRD)-negative prior to transplant
      (75.8% vs 45.2%, P = 0.06).
    explanation: >-
      Adult transplant outcomes and the dependence of post-transplant survival
      on pre-transplant measurable residual disease status.
  notes: >-
    Adult outcomes have improved relative to older series (median overall
    survival 41.9 months in this cohort), and pre-transplant MRD status is the
    dominant modifier of post-transplant survival.
- phase: Outcome in centrally reviewed pediatric cohorts
  age_range: pediatric
  evidence:
  - reference: PMID:31661160
    reference_title: "Mixed-phenotype acute leukemia: A cohort and consensus research strategy from the Children's Oncology Group Acute Leukemia of Ambiguous Lineage Task Force."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EFS and OS were 75% ± 13% and
      84% ± 11%, respectively, for those receiving ALL chemotherapy alone without HSCT
    explanation: >-
      Children treated with ALL chemotherapy alone had favourable 5-year
      event-free and overall survival, markedly better than historical adult
      MPAL outcomes.
  notes: >-
    Pediatric MPAL treated on ALL regimens has substantially better outcomes
    than adult disease; selection bias limits causal interpretation of the
    no-transplant subgroup.
- phase: Measurable residual disease response after induction
  evidence:
  - reference: PMID:32060402
    reference_title: "Significance of minimal residual disease in pediatric mixed phenotype acute leukemia: a multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALL induction therapy achieved an EOI MRD negative (<0.01%) remission in
      most patients (70%). EOI MRD positivity was predictive of 5-year EFS
      (HR = 6.00, p < 0.001) and OS (HR = 9.57, p = 0.003).
    explanation: >-
      End-of-induction measurable residual disease is the dominant early
      prognostic variable in pediatric MPAL.
  notes: >-
    Earlier MRD clearance is associated with better survival; MRD is the
    principal proposed variable for therapy adaptation.
- phase: Outcome in acute undifferentiated leukemia
  subtype: Acute undifferentiated leukemia
  evidence:
  - reference: PMID:31982153
    reference_title: "Acute undifferentiated leukemia: data on incidence and outcomes from a large population-based database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among adults, AUL patients had the worst prognosis, with a median overall
      survival (OS) of 9 months, compared to 27 months in ALL and 13 months in
      AML.
    explanation: >-
      AUL has the worst adult survival among the acute leukemias in
      population-based data.
pathophysiology:
- name: Transformation of an Immature Multipotent Hematopoietic Progenitor
  biological_scale: CELLULAR
  description: >-
    MPAL originates in a hematopoietic stem or multipotent progenitor cell
    that has not yet committed to a single lineage. Because the cell of origin
    sits upstream of the myeloid/lymphoid branch point, the founding clone
    retains access to more than one differentiation program, which is the
    structural precondition for the ambiguous phenotype that defines the
    disease.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic multipotent progenitor cell
    term:
      id: CL:0000837
      label: hematopoietic multipotent progenitor cell
  biological_processes:
  - preferred_term: hematopoietic progenitor cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0002244
      label: hematopoietic progenitor cell differentiation
  evidence:
  - reference: PMID:30209392
    reference_title: The genetic basis and cell of origin of mixed phenotype acute leukaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that the intratumoral immunophenotypic heterogeneity
      characteristic of MPAL is independent of somatic genetic variation, that
      founding lesions arise in primitive haematopoietic progenitors, and that
      individual phenotypic subpopulations can reconstitute the immunophenotypic
      diversity in vivo.
    explanation: >-
      Localizes the founding lesions of MPAL to primitive hematopoietic
      progenitors rather than to lineage-committed cells.
  - reference: PMID:35247902
    reference_title: ZNF384 Fusion Oncoproteins Drive Lineage Aberrancy in Acute Leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of ZNF384 FO early in hematopoiesis results in binding and
      deregulation of key hematopoietic regulators, skewing of hematopoiesis,
      and priming for leukemic transformation. These results reveal the
      interplay between cell of origin and expression of ZNF384 FO to mediate
      lineage ambiguity and leukemia development.
    explanation: >-
      Functional mouse and human HSPC modelling shows the cell of origin is a
      required co-determinant of lineage ambiguity, supporting the causal role
      this node assigns to the progenitor compartment.
  downstream:
  - target: Failure of Lineage Commitment
    causal_link_type: DIRECT
    description: >-
      Transformation of a cell upstream of lineage commitment leaves the
      normal lineage-specification machinery operating in an uncommitted
      state.
  - target: BCR-ABL1 Kinase-Driven Proliferative Signaling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - acquisition of t(9;22) in the multipotent progenitor compartment
    description: >-
      When BCR::ABL1 is acquired in a multipotent rather than a
      lineage-committed progenitor, the resulting leukemia is ambiguous
      rather than purely lymphoid or myeloid.
  - target: KMT2A Rearrangement and Aberrant HOXA Transcriptional Program
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - acquisition of an 11q23.3 KMT2A fusion in an immature progenitor
    description: >-
      KMT2A fusions arising in an immature progenitor produce leukemias with
      stem-like and mixed-lineage programs.
- name: Failure of Lineage Commitment
  biological_scale: CELLULAR
  description: >-
    Normal hematopoietic lineage choice is enforced by mutually antagonistic
    transcription factor networks (PU.1/SPI1 and CEBPA for myeloid, EBF1 and
    PAX5 for B, NOTCH1 and BCL11B for T). In MPAL these networks are
    disrupted or incompletely resolved, so no single program is consolidated
    and lineage-restricting feedback loops fail to close. The blast is left in
    a promiscuous, multi-lineage-primed transcriptional state.
  genes:
  - preferred_term: SPI1
    term:
      id: hgnc:11241
      label: SPI1
  - preferred_term: PAX5
    term:
      id: hgnc:8619
      label: PAX5
  - preferred_term: EBF1
    term:
      id: hgnc:3126
      label: EBF1
  - preferred_term: BCL11B
    term:
      id: hgnc:13222
      label: BCL11B
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  - preferred_term: RUNX1
    term:
      id: hgnc:10471
      label: RUNX1
  cell_types:
  - preferred_term: hematopoietic multipotent progenitor cell
    term:
      id: CL:0000837
      label: hematopoietic multipotent progenitor cell
  biological_processes:
  - preferred_term: regulation of myeloid cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0045637
      label: regulation of myeloid cell differentiation
  - preferred_term: B cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030183
      label: B cell differentiation
  - preferred_term: T cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030217
      label: T cell differentiation
  evidence:
  - reference: PMID:30209392
    reference_title: The genetic basis and cell of origin of mixed phenotype acute leukaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that the cell of origin and founding lesions,
      rather than an accumulation of distinct genomic alterations, prime tumour
      cells for lineage promiscuity.
    explanation: >-
      States explicitly that lineage promiscuity in MPAL is a property of the
      cell of origin and founding lesion rather than of accumulated mutations,
      which is the failure-of-commitment model captured by this node.
  - reference: PMID:31792411
    reference_title: Single-cell multiomic analysis identifies regulatory programs in mixed-phenotype acute leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite widespread epigenetic heterogeneity within the patient cohort, we

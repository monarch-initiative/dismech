- name: Lineage Plasticity and Therapy Escape
  biological_scale: CELLULAR
  description: >-
    Because alternative lineage programs remain transcriptionally accessible,
    MPAL clones can shift immunophenotype under therapeutic pressure. This is
    seen as spontaneous lymphoid-to-myeloid switching at relapse, and as
    antigen-loss or lineage-switch escape from lineage-directed immunotherapy
    such as CD19-targeted CAR T cells and blinatumomab. Plasticity is a major
    reason MPAL responds poorly to single-lineage-directed strategies and a
    principal driver of its inferior outcome relative to ALL.
  cell_types:
  - preferred_term: hematopoietic multipotent progenitor cell
    term:
      id: CL:0000837
      label: hematopoietic multipotent progenitor cell
  biological_processes:
  - preferred_term: hematopoietic progenitor cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0002244
      label: hematopoietic progenitor cell differentiation
  evidence:
  - reference: PMID:39813682
    reference_title: Defining 2 biologically and clinically distinct groups in acute leukemia with a mixed phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, AML-MP rarely switches to a lymphoid
      immunophenotype after treatment, in contrast to MPAL ... 10/28 35.7%;
      P = .0003
    explanation: >-
      Quantifies post-treatment immunophenotypic (lineage) switching in MPAL at
      roughly one third of cases (10/28, 35.7%) against 2.5% in AML with a
      mixed phenotype, directly supporting therapy-associated lineage
      plasticity. The quotation is elided at the AML-MP arm of the comparison;
      the square brackets the journal places around the percentage are dropped
      because the validator treats bracketed spans as editorial insertions.
  - reference: PMID:37474833
    reference_title: Clonal origin of KMT2A wild-type lineage-switch leukemia following CAR-T cell and blinatumomab therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole genome sequencing unambiguously revealed the AML derived from the
      initial ALL, with distinct driver mutations that were detectable before
      emergence. Extensive prior diversification and subsequent clonal
      selection underpins this fatal lineage switch.
    explanation: >-
      Whole-genome phylogeny shows a lymphoid-to-myeloid lineage switch under
      anti-CD19 pressure arises by selection of a pre-existing subclone, the
      escape mechanism this node describes.
  - reference: PMID:41063702
    reference_title: "Acute leukemia of ambiguous lineage: the known and the uncertain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The use of lineage-specific targeted approaches may result in therapeutic
      pressure and lineage switch in patients with acute leukemia with
      multi-phenotypic potential.
    explanation: >-
      A 2025 review states the general principle that lineage-directed therapy
      selects for lineage switch in multi-phenotypic acute leukemia.
  downstream:
  - target: Clonal Blast Expansion and Bone Marrow Replacement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - selection of a phenotypically switched, therapy-resistant subclone
    description: >-
      A lineage-switched subclone escapes lineage-directed therapy and
      re-expands, producing refractory or relapsed disease.

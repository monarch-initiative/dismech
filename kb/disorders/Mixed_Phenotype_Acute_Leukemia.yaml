    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with acute lymphoblastic leukemia (ALL) undergoing anti-CD19
      therapy occasionally develop acute myeloid leukemia (AML).
    explanation: >-
      Establishes that anti-CD19 cellular therapy is given in this setting
      while documenting its lineage-switch failure mode; PARTIAL because the
      report addresses escape rather than efficacy in MPAL.
  - reference: PMID:41063702
    reference_title: "Acute leukemia of ambiguous lineage: the known and the uncertain."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The use of lineage-specific targeted approaches may result in therapeutic
      pressure and lineage switch in patients with acute leukemia with
      multi-phenotypic potential.
    explanation: >-
      A 2025 review of ambiguous-lineage leukemia frames lineage-directed
      cellular and antibody therapy as usable but escape-prone; PARTIAL
      because it states the liability rather than establishing efficacy.
- name: BCL-2 Inhibition with Venetoclax
  description: >-
    Investigational in MPAL. Venetoclax combined with a hypomethylating agent
    is a lineage-agnostic, BCL-2-directed regimen now being tested
    prospectively in newly diagnosed MPAL, with treatment stratified by
    B/myeloid versus T/myeloid immunophenotype. No randomized efficacy data
    exist in MPAL and use outside trials is extrapolated from AML.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
    - preferred_term: azacitidine
      term:
        id: CHEBI:2038
        label: 5-azacytidine
  target_mechanisms:
  - target: Clonal Blast Expansion and Bone Marrow Replacement
    treatment_effect: INHIBITS
    description: >-
      BCL-2 inhibition restores the apoptotic threshold of the
      maturation-arrested blast, a lineage-agnostic target that does not
      depend on which lineage the blast is expressing.
  evidence:
  - reference: clinicaltrials:NCT07573670
    reference_title: A Prospective, Open-Label, Single-Arm, Two-Cohort Phase 2 Clinical Study to Evaluate the Efficacy and Safety of Bcl-2 Inhibitor Combined With Azacitidine in the Treatment of Newly Diagnosed Mixed Phenotype Acute Leukemia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eligible subjects are divided into two cohorts based on immunophenotype:
      Cohort A (T/Myeloid MPAL) receives Bcl-2 Inhibitor + azacitidine, and
      Cohort B (B/Myeloid MPAL) receives Bcl-2 Inhibitor + azacitidine +
      blinatumomab.
    explanation: >-
      A prospective MPAL-specific phase 2 study of BCL-2 inhibition plus
      azacitidine; PARTIAL because the trial is ongoing and no efficacy
      results are yet reported, and because the registration record names
      only "Bcl-2 Inhibitor" rather than a specific agent, so this record
      alone does not source the venetoclax identity of the CHEBI binding.
  - reference: PMID:41540127
    reference_title: "Efficacy and safety of mini-cvd combined with venetoclax and azacitidine in philadelphia chromosome-negative acute leukemia of ambiguous lineage: a single-center retrospective study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who received induction therapy with the mini-CVD regimen
      (cyclophosphamide, vincristine, dexamethasone) combined with venetoclax
      and azacitidine ... Among this cohort, 92.3% of patients (12/13)
      achieved complete remission (CR).
    explanation: >-
      Names venetoclax and azacitidine explicitly as the BCL-2-directed
      combination actually given in acute leukemia of ambiguous lineage,
      which is what sources the CHEBI:133021 / CHEBI:2038 agent bindings that
      the trial record leaves as a generic drug class. PARTIAL rather than
      SUPPORT: this is a single-center retrospective series of 13
      Philadelphia-negative ALAL patients, venetoclax and azacitidine were
      given on a mini-CVD backbone rather than as the doublet the trial is
      testing, and the cohort is ALAL rather than MPAL-restricted, so it
      establishes the agent identity and clinical plausibility but not
      efficacy of the regimen in MPAL.
- name: FLT3 Inhibition in ZNF384-Rearranged Disease
  description: >-
    Investigational only. Preclinical work in ZNF384-rearranged leukemia
    identified FLT3 as a dependency, with in vivo response of a
    ZNF384-rearranged xenograft to FLT3 inhibition. No clinical efficacy has
    been established in MPAL.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gilteritinib
      term:
        id: NCIT:C116722
        label: Gilteritinib
  target_mechanisms:
  - target: ZNF384 Rearrangement and B/Myeloid Programming
    treatment_effect: INHIBITS
    description: >-
      Targets the FLT3 dependency created by the ZNF384 fusion transcriptional
      program.
  evidence:
  - reference: PMID:35247902
    reference_title: ZNF384 Fusion Oncoproteins Drive Lineage Aberrancy in Acute Leukemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mouse HSPCs, concomitant lesions, such as NRASG12D, were required for
      fully penetrant leukemia, whereas in human HSPCs, expression of ZNF384 FO
      drove B/myeloid leukemia, with sensitivity of a ZNF384-rearranged
      xenograft to FLT3 inhibition in vivo.
    explanation: >-
      Xenograft evidence for FLT3 inhibitor sensitivity in ZNF384-rearranged
      leukemia; preclinical only, and it does not establish clinical benefit
      in MPAL.

- name: ALAL BCL11B
  display_name: Acute leukemia of ambiguous lineage with BCL11B rearrangement
  classification: genetically defined
  description: >-
    Ambiguous-lineage acute leukemia carrying a structural rearrangement that
    hijacks an enhancer to BCL11B at 14q32.2. WHO-HAEM5 and the ICC name it as
    a defined ambiguous-lineage genetic group alongside ZNF384-rearranged
    disease. It is curated at subtype level rather than folded into the
    T/myeloid NOS group because the entity spans acute undifferentiated
    leukemia and T/myeloid MPAL, and reaches into ETP-ALL and AML with minimal
    differentiation, so it cuts across the immunophenotypically defined
    subtypes rather than sitting inside one. No MONDO term exists for this
    entity yet, so no subtype_term is bound.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The other subtype is ALAL with BCL11B rearrangement, which has a more
      heterogenous immunophenotype ... in acute undifferentiated
      leukaemia (AUL) and ~20-30% of T/myeloid MPAL.
    explanation: >-
      WHO-HAEM5 names ALAL with BCL11B rearrangement as a defined
      ambiguous-lineage subtype and gives its 20-30% share of T/myeloid MPAL
      and its overlap with acute undifferentiated leukemia.
  - reference: PMID:41477275
    reference_title: Mixed phenotype acute leukemia, the dissection of an enigmatic disease in the era of novel therapies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      with specific subcategories characterized by
      BCR::ABL1, KMT2A, ZNF384, or BCL11B rearrangements.
    explanation: >-
      A 2025 review lists BCL11B rearrangement among the four genetic
      subcategories of MPAL, alongside BCR::ABL1, KMT2A and ZNF384.
- name: Acute undifferentiated leukemia
  display_name: Acute undifferentiated leukemia (AUL)
  classification: related ambiguous-lineage entity
  description: >-
    An acute leukemia of ambiguous lineage in which blasts express no
    lineage-defining marker at all (no myeloperoxidase, no cytoplasmic CD3, no
    B-lineage marker combination) and typically carry only immaturity markers
    such as CD34, HLA-DR and TdT. AUL is not strictly MPAL, since no lineage
    is assigned rather than more than one, but it sits in the same
    ambiguous-lineage category and shares the immature-progenitor cell of
    origin, so it is curated here as a related subtype.
  subtype_term:
    preferred_term: acute undifferentiated leukemia
    term:
      id: MONDO:0020321
      label: acute undifferentiated leukemia
  evidence:
  - reference: PMID:31982153
    reference_title: "Acute undifferentiated leukemia: data on incidence and outcomes from a large population-based database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute undifferentiated leukemia (AUL) is rare and defined by the absence
      of bona fide myeloid and lymphoid markers.
    explanation: >-
      Defines AUL by absence of lineage-defining markers, contrasting with
      MPAL where more than one lineage is assigned.
epidemiology:
- name: Share of acute leukemias
  description: >-
    MPAL is a small minority of acute leukemias. Reported shares range from
    about 1% to 5% and vary with the classification criteria used (EGIL,
    WHO2008, WHO2016, WHO-HAEM5/ICC), since successive revisions have
    tightened the marker requirements and moved some formerly biphenotypic
    cases into other entities.
  minimum_value: 1.0
  maximum_value: 5.0
  unit: percent of acute leukemias
  evidence:
  - reference: PMID:28422191
    reference_title: "Mixed-phenotype acute leukemia: state-of-the-art of the diagnosis, classification and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Historically, various names and classifications were used for this rare
      entity accounting for 2-5% of all acute leukemias depending on the
      diagnostic criterias used.
    explanation: >-
      Gives the 2-5% share and explicitly attributes the range to differing
      diagnostic criteria.
  - reference: PMID:31661160
    reference_title: "Mixed-phenotype acute leukemia: A cohort and consensus research strategy from the Children's Oncology Group Acute Leukemia of Ambiguous Lineage Task Force."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mixed phenotype acute leukemia (MPAL) is uncommon, comprising 1–5% of
      newly diagnosed acute leukemia.
    explanation: >-
      The Children's Oncology Group task force cites the wider 1-5% range,
      which is the interval recorded here.
  - reference: PMID:29991687
    reference_title: Integrative genomic analysis of adult mixed phenotype acute leukemia delineates lineage associated molecular subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such types of acute leukemia are classified as mixed phenotype acute
      leukemia (MPAL), which accounts for 1–3% of acute leukemias in adults
    explanation: >-
      Reports the narrower adult-specific share, showing the estimate is
      age-group dependent.
- name: Immunophenotypic subtype distribution
  description: >-
    Across WHO-defined cohorts B/myeloid is the most common combination,
    followed by T/myeloid; B/T and trilineage cases are rare.
  evidence:
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunophenotyping disclosed B + myeloid (59%), T + myeloid (35%), B + T
      (4%), or trilineage (2%) combinations.
    explanation: >-
      Gives the subtype distribution in a 100-patient WHO-criteria cohort.
  - reference: PMID:37116143
    reference_title: Clinical and Molecular Characteristics of Patients with Mixed Phenotype Acute Leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children represented 49.3% of MPAL patients. The main phenotype was
      B-lymphoid/myeloid (80%).
    explanation: >-
      An independent 75-patient prospective series confirms B/myeloid as the
      predominant immunophenotype.
- name: Age distribution
  description: >-
    MPAL occurs across the age range, with a majority of cases in adults in
    referral series. Acute undifferentiated leukemia by contrast is a disease
    of older adults.
  evidence:
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were 62 men and 38 women; 68% were adults.
    explanation: >-
      Documents adult predominance and male excess in a WHO-defined MPAL
      series.
  - reference: PMID:31982153
    reference_title: "Acute undifferentiated leukemia: data on incidence and outcomes from a large population-based database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to other acute leukemias, patients with AUL have the highest
      median age (74 years); in contrast to acute myeloid leukemia (AML, 65)
      and acute lymphoblastic leukemia (ALL, 12).
    explanation: >-
      Establishes the markedly older age distribution of acute undifferentiated
      leukemia relative to AML and ALL.
prevalence:
- subtype: Acute undifferentiated leukemia

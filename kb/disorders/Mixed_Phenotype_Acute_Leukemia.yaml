- name: Cross-Lineage Antigen Co-expression
  biological_scale: CELLULAR
  description: >-
    The defining, diagnostically operationalized event: blasts express
    lineage-assigning antigens of more than one lineage, either within a single
    population (biphenotypic) or as two coexisting populations (bilineal).
    WHO/ICC criteria assign myeloid lineage on myeloperoxidase expression or
    monocytic differentiation, T lineage on cytoplasmic or surface CD3, and B
    lineage on strong CD19 with at least one of CD79a, cytoplasmic CD22 or
    CD10, or weak CD19 with at least two of these. In acute undifferentiated
    leukemia the same machinery fails in the opposite direction and no lineage
    marker is expressed at all.

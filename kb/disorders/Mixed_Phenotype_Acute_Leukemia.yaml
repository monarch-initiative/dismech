    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On multivariate analyses and after adjustment for age, year of diagnosis
      and chemotherapy status, Ph+ MPAL patients had reduced risk of death in
      comparison to Ph(-) MPAL patients
    explanation: >-
      SEER registry analysis establishes BCR::ABL1/Philadelphia-chromosome
      status as a prognostically decisive somatic driver in MPAL.

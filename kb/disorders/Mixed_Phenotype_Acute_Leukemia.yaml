name: Mixed Phenotype Acute Leukemia
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Mixed phenotype acute leukemia (MPAL) is an acute leukemia of ambiguous
  lineage in which the blast population cannot be assigned to a single
  hematopoietic lineage. Blasts either co-express lineage-defining myeloid
  and lymphoid (B or T) antigens within one population (the historical
  "biphenotypic" pattern) or form two separate lineage-committed populations
  (the "bilineal" pattern). MPAL accounts for a small minority of acute
  leukemias, arises from transformation of an immature multipotent
  hematopoietic progenitor that retains lineage plasticity, and is defined
  operationally by WHO/ICC immunophenotypic lineage-assignment criteria
  (myeloperoxidase or monocytic markers for myeloid lineage, cytoplasmic
  CD3 for T lineage, and CD19-anchored marker combinations for B lineage).
  Current classifications recognize genetically defined subtypes (BCR::ABL1,
  KMT2A rearrangement), immunophenotypically defined not-otherwise-specified
  subtypes (B/myeloid, T/myeloid), and the related fully undifferentiated
  entity acute undifferentiated leukemia.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Acute Leukemia of Ambiguous Lineage
parents:
- acute leukemia of ambiguous lineage
disease_term:
  preferred_term: mixed phenotype acute leukemia
  term:
    id: MONDO:0020743
    label: mixed phenotype acute leukemia
synonyms:
- MPAL
- acute biphenotypic leukemia
- acute bilineal leukemia
- acute leukemia of ambiguous lineage
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0020322
      label: acute biphenotypic leukemia
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0020322 (acute biphenotypic leukemia) is the narrower WHO-2001-era
      term for the single-blast-population co-expression pattern and is a
      subclass of MONDO:0020743. Issue #7468 cited MONDO:0020322, but this
      entry is scoped to the full WHO/ICC mixed phenotype acute leukemia
      family, which also includes the bilineal (two separate blast
      populations) pattern, so MONDO:0020743 is used as the primary term.
  - term:
      id: MONDO:0019460
      label: acute leukemia of ambiguous lineage
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The parent category that additionally contains acute undifferentiated
      leukemia, which is curated here as a related ambiguous-lineage subtype.
has_subtypes:
- name: MPAL BCR-ABL1
  display_name: Mixed phenotype acute leukemia with BCR::ABL1 fusion
  classification: genetically defined
  description: >-
    MPAL carrying t(9;22)(q34.1;q11.2) / BCR::ABL1. Recognized as a distinct
    WHO/ICC entity because the fusion kinase supplies a targetable signaling
    dependency, and tyrosine kinase inhibitors are added to the treatment
    backbone.
  subtype_term:
    preferred_term: mixed phenotype acute leukemia with BCR-ABL1
    term:
      id: MONDO:0850449
      label: mixed phenotype acute leukemia with BCR-ABL1
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mixed-phenotype acute leukaemia with BCR::ABL1 fusion
      Mixed-phenotype acute leukaemia with KMT2A rearrangement
    explanation: >-
      WHO-HAEM5 lists MPAL with BCR::ABL1 fusion as one of the two
      genetically defined ambiguous-lineage entities.
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetics evidenced t(9;22)/(Ph(+)) (20%), 11q23/MLL rearrangements
      (8%), complex (32%), aberrant (27%), or normal (13%) karyotypes.
    explanation: >-
      In a 100-patient WHO-defined MPAL series t(9;22) was the single most
      common recurrent lesion, supporting it as a defined subtype.
- name: MPAL KMT2A
  display_name: Mixed phenotype acute leukemia with KMT2A rearrangement
  classification: genetically defined
  description: >-
    MPAL carrying a rearrangement of KMT2A (MLL) at 11q23.3, most often with a
    B/myeloid immunophenotype. KMT2A fusions enforce an aberrant HOXA/MEIS1
    transcriptional program in an immature progenitor, and this subtype is
    over-represented in infants.
  subtype_term:
    preferred_term: mixed phenotype acute leukemia with MLL rearranged
    term:
      id: MONDO:0850450
      label: mixed phenotype acute leukemia with MLL rearranged
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mixed-phenotype acute leukaemia with BCR::ABL1 fusion
      Mixed-phenotype acute leukaemia with KMT2A rearrangement
    explanation: >-
      WHO-HAEM5 lists MPAL with KMT2A rearrangement as the second genetically
      defined ambiguous-lineage entity.
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetics evidenced t(9;22)/(Ph(+)) (20%), 11q23/MLL rearrangements
      (8%), complex (32%), aberrant (27%), or normal (13%) karyotypes.
    explanation: >-
      11q23/KMT2A rearrangements were the second most common recurrent
      cytogenetic lesion in this WHO-defined MPAL series.
- name: MPAL B/myeloid NOS
  display_name: Mixed phenotype acute leukemia, B/myeloid, not otherwise specified
  classification: immunophenotypically defined
  description: >-
    MPAL meeting WHO/ICC criteria for both B and myeloid lineage assignment
    without a defining BCR::ABL1 or KMT2A lesion. ZNF384 rearrangements are
    the most characteristic recurrent alteration in this group.
  subtype_term:
    preferred_term: mixed phenotype acute leukemia, B/myeloid
    term:
      id: MONDO:0850451
      label: mixed phenotype acute leukemia, B/myeloid
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mixed-phenotype acute leukaemia, B/myeloid
      Mixed-phenotype acute leukaemia, T/myeloid
      Mixed-phenotype acute leukaemia, rare types
    explanation: >-
      WHO-HAEM5 defines B/myeloid MPAL as one of the immunophenotypically
      defined ambiguous-lineage entities.
  - reference: PMID:30209392
    reference_title: The genetic basis and cell of origin of mixed phenotype acute leukaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rearrangement of ZNF384 is common in B/M MPAL, and biallelic WT1
      alterations are common in T/M MPAL, which shares genomic features with
      early T-cell precursor acute lymphoblastic leukaemia.
    explanation: >-
      Genomic profiling establishes ZNF384 rearrangement as the recurrent
      lesion characteristic of B/myeloid MPAL.
- name: MPAL T/myeloid NOS
  display_name: Mixed phenotype acute leukemia, T/myeloid, not otherwise specified
  classification: immunophenotypically defined
  description: >-
    MPAL meeting WHO/ICC criteria for both T and myeloid lineage assignment
    without a defining genetic lesion. Genomically it overlaps substantially
    with early T-cell precursor ALL, with recurrent WT1, PHF6, RUNX1, ETV6 and

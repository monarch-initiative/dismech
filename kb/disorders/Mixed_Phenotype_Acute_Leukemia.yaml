- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Consolidation with allogeneic transplant in first complete remission is
    widely used in MPAL given its inferior outcome relative to ALL, although
    the benefit is derived from retrospective series rather than randomized
    trials.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Clonal Blast Expansion and Bone Marrow Replacement
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:28099272
    reference_title: "Mixed-phenotype acute leukemia: current challenges in diagnosis and therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Allogeneic transplantation in first remission may be associated with
      improved survival compared with consolidation chemotherapy.
    explanation: >-
      Supports allogeneic transplant in first remission as a consolidation
      strategy in MPAL.
  - reference: PMID:25605373
    reference_title: How I treat mixed-phenotype acute leukemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The limited available data suggest that an "acute lymphoblastic
      leukemia-like" regimen followed by allogeneic stem-cell transplant may be
      advisable
    explanation: >-
      Expert guidance places allogeneic transplant after ALL-type induction in
      adult MPAL.
  - reference: PMID:32060402
    reference_title: "Significance of minimal residual disease in pediatric mixed phenotype acute leukemia: a multicenter cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to adults with MPAL, ALL therapy without transplantation was
      adequate to treat most pediatric patients.
    explanation: >-
      Qualifies the transplant recommendation: in children who clear MRD,
      transplantation was not required, so this evidence partially refutes a
      universal transplant-in-CR1 policy while supporting it for adults.
  - reference: PMID:36959485
    reference_title: "Multicenter retrospective analysis of clinical outcome of adult patients with mixed-phenotype acute leukemia treated with acute myeloid leukemia-like or acute lymphoblastic leukemia-like chemotherapy and impact of allogeneic stem cell transplantation: a Campus ALL study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study shows that MPAL patients respond better to an ALL-like
      induction therapy; that consolidation therapy should include, whenever
      possible, an AlloSCT and that MRD negativity should be a primary endpoint
      of treatment.
    explanation: >-
      Adult multicenter data supporting allogeneic transplant as consolidation
      and measurable residual disease negativity as the treatment goal.

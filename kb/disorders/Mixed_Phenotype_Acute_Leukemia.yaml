discussions:
- discussion_id: mpal_no_prospective_randomized_therapy_data
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does ALL-directed induction actually outperform AML-directed or hybrid
    induction in mixed phenotype acute leukemia when tested prospectively, and
    for which genetic subgroups?
  attaches_to:
  - treatments#ALL-Type Induction Chemotherapy
  rationale: >-
    Every current recommendation to prefer ALL-type induction derives from
    retrospective series, registry data and meta-analysis of those series. No
    prospective controlled trial has compared induction strategies in MPAL, so
    confounding by indication, era and center cannot be excluded, and the
    optimal approach for genetically defined subgroups is unknown.
  proposed_experiments:
  - experiment_id: exp_mpal_prospective_induction_backbone
    name: Prospective cooperative-group induction-backbone study in centrally reviewed MPAL
    description: >-
      Enrol centrally reviewed WHO/ICC MPAL into a cooperative-group protocol
      that randomizes or risk-stratifies the induction backbone (ALL-type
      versus AML-type versus hybrid), using end-of-induction measurable
      residual disease as the primary early endpoint and event-free survival
      as the confirmatory endpoint.
    decision_criterion: >-
      A prespecified difference in end-of-induction MRD negativity between
      induction backbones, confirmed by event-free survival.
    would_support:
    - >-
        Prospective confirmation that ALL-directed induction is superior would
        convert the current retrospective recommendation into controlled
        evidence.
    would_refute:
    - >-
        Equivalent MRD and survival across backbones would show the retrospective
        signal reflects confounding by indication, era and center.
  - experiment_id: exp_mpal_genetic_subgroup_induction_analysis
    name: Prespecified genetic-subgroup analysis of induction response
    description: >-
      Within the same prospective cohort, analyse induction response separately
      by BCR::ABL1, KMT2A, ZNF384 and BCL11B status and by AML-like versus
      ALL-like methylation class.
    decision_criterion: >-
      A subgroup-by-backbone interaction that survives prespecified
      multiplicity control.
    would_support:
    - >-
        Evidence that induction choice should be genetically rather than
        immunophenotypically guided.
    would_refute:
    - >-
        Absence of interaction would support a single uniform backbone for all
        MPAL.
  evidence:
  - reference: PMID:25605373
    reference_title: How I treat mixed-phenotype acute leukemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      No prospective, controlled trials exist to guide therapy.
    explanation: >-
      States the absence of prospective controlled evidence directly.
  - reference: PMID:28099272
    reference_title: "Mixed-phenotype acute leukemia: current challenges in diagnosis and therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most data that inform therapy are based on retrospective, uncontrolled
      studies; prospective trials that incorporate targeted approaches based on
      genetics and immunophenotype are needed.
    explanation: >-
      Confirms the evidence base is retrospective and identifies the trial
      design needed to close the gap.
- discussion_id: mpal_aul_optimal_therapy_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the optimal induction strategy for acute undifferentiated leukemia,
    where no lineage is assigned and therefore no lineage-directed regimen is
    indicated by phenotype?
  attaches_to:
  - has_subtypes#Acute undifferentiated leukemia
  rationale: >-
    The therapeutic logic used in MPAL is to pick the regimen matching an
    assignable lineage. In AUL no lineage is assignable, so that logic gives no
    guidance, and population-based data show most AUL patients receive no
    chemotherapy at all and have the worst adult survival of any acute
    leukemia.
  proposed_experiments:
  - experiment_id: exp_aul_molecular_class_registry
    name: Molecular-class-stratified registry study of acute undifferentiated leukemia
    description: >-
      Assemble a prospective registry of centrally reviewed AUL and stratify by
      DNA methylation and transcriptomic class rather than by immunophenotype,
      which by definition provides no lineage information in this entity.
    decision_criterion: >-
      Identification of molecular classes with reproducibly different
      treatment response or survival.
    would_support:
    - >-
        A molecular basis for assigning induction therapy in a phenotypically
        uninformative leukemia.
    would_refute:
    - >-
        Absence of class-associated outcome differences would argue AUL should be
        treated as a single high-risk group.
  - experiment_id: exp_aul_lineage_agnostic_regimen_trial
    name: Trial of lineage-agnostic regimens in prospectively identified AUL
    description: >-
      Evaluate BCL2-directed and other lineage-agnostic regimens in
      prospectively identified AUL, given that most AUL patients currently
      receive no chemotherapy at all.
    decision_criterion: >-
      Response rate and overall survival compared with the population-based
      untreated and chemotherapy-treated AUL benchmarks.
    would_support:
    - >-
        A deliverable standard of care for a group with the worst adult acute
        leukemia survival.
    would_refute:
    - >-
        Lack of activity would redirect effort toward transplant-directed or
        supportive strategies.
  evidence:
  - reference: PMID:41063702
    reference_title: "Acute leukemia of ambiguous lineage: the known and the uncertain."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For AUL the optimal therapeutic
      approach is uncertain.
    explanation: >-
      A 2025 review states directly that optimal AUL therapy is undetermined.
  - reference: PMID:31982153
    reference_title: "Acute undifferentiated leukemia: data on incidence and outcomes from a large population-based database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only 35% of AUL patients had received chemotherapy. Comparatively, 94% of
      ALL and 71% of AML cases received chemotherapy.
    explanation: >-
      Shows the practical consequence of the gap: most AUL patients are not
      treated with chemotherapy at all.
- discussion_id: mpal_immunophenotype_does_not_track_genotype
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    If neither genotype nor transcriptome reliably predicts MPAL
    immunophenotype, should MPAL be classified and treated by immunophenotype
    at all, or by epigenetic/transcriptional lineage class?
  attaches_to:
  - pathophysiology#Stem-like Transcriptional State and Epigenetic Lineage Programming
  rationale: >-
    Multiomic single-cell data show immunophenotype is decoupled from genetic
    and transcriptional profile, while methylation-defined AML-like versus
    ALL-like classes predict response to lineage-matched therapy. This
    challenges the immunophenotypic basis of the current WHO/ICC definition
    and of therapy selection.
  proposed_experiments:
  - experiment_id: exp_mpal_methylation_vs_immunophenotype_assignment
    name: Methylation-class-guided versus immunophenotype-guided therapy assignment
    description: >-
      Prospectively assign induction therapy either by the current
      immunophenotypic lineage call or by AML-like versus ALL-like methylation
      class, and compare remission and survival.
    decision_criterion: >-
      Superior complete response or survival in the methylation-guided arm.
    would_support:
    - >-
        Replacing or supplementing the immunophenotypic definition of MPAL with
        an epigenetic one for therapeutic purposes.
    would_refute:
    - >-
        Equivalence would justify retaining immunophenotype as the operational
        basis of classification and therapy.
  - experiment_id: exp_mpal95_independent_validation
    name: Independent validation of the MPAL95 stemness score
    description: >-
      Validate the 95-gene MPAL95 stemness score as a risk stratifier in an
      independent prospective MPAL cohort, modelled jointly with
      end-of-induction measurable residual disease.
    decision_criterion: >-
      MPAL95 retains independent prognostic value after adjustment for MRD and
      established clinical covariates.
    would_support:
    - >-
        Adding a transcriptional stemness axis to MPAL risk stratification.
    would_refute:
    - >-
        Loss of significance after MRD adjustment would show the score is
        captured by existing response-based measures.
  evidence:
  - reference: PMID:39294124
    reference_title: Multiomic single cell sequencing identifies stemlike nature of mixed phenotype acute leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that neither genetic profile nor transcriptome reliably correlate
      with specific MPAL immunophenotypes.
    explanation: >-
      Establishes the decoupling of immunophenotype from underlying molecular
      state that motivates the question.
  - reference: PMID:29991687
    reference_title: Integrative genomic analysis of adult mixed phenotype acute leukemia delineates lineage associated molecular subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide methylation comparison among MPAL, AML, B-ALL, and T-ALL
      sub-classifies MPAL into AML-type and ALL-type MPAL, which is associated
      with better clinical response when lineage-matched therapy is given.
    explanation: >-
      Provides the alternative epigenetic classification whose clinical value
      the question asks to test prospectively.

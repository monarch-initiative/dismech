diagnosis:
- name: Multiparameter flow cytometric immunophenotyping
  description: >-
    The definitive diagnostic modality. WHO/ICC lineage-assignment criteria are
    applied to blast populations: myeloid lineage on myeloperoxidase or
    monocytic differentiation markers, T lineage on cytoplasmic or surface CD3,
    B lineage on CD19-anchored marker combinations. MPAL is diagnosed when more
    than one lineage is assigned, either in one blast population or across two.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Myeloperoxidase Intensity in part exceeds 50% of mature neutrophil level
    explanation: >-
      The WHO-HAEM5 lineage-assignment table specifies the quantitative flow
      cytometric intensity thresholds on which the diagnosis rests.
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myeloid and T-lineage features were demonstrated by cytoplasmic
      myeloperoxidase and CD3; B-lineage features were demonstrated by at least
      2 B-lymphoid markers.
    explanation: >-
      Describes application of the marker-based lineage-assignment rules in
      practice.
- name: Cytogenetics and molecular testing
  description: >-
    Karyotype, FISH and molecular assays identify BCR::ABL1 and KMT2A
    rearrangements, which define the genetic subtypes and change therapy.
    Sequencing additionally detects ZNF384 fusions and the WT1/PHF6/RUNX1/
    NOTCH1 lesions characteristic of T/myeloid disease.
  evidence:
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cytogenetics evidenced t(9;22)/(Ph(+)) (20%), 11q23/MLL rearrangements
      (8%), complex (32%), aberrant (27%), or normal (13%) karyotypes.
    explanation: >-
      Demonstrates the diagnostic yield of karyotype and FISH in WHO-defined
      MPAL.
  - reference: PMID:29991687
    reference_title: Integrative genomic analysis of adult mixed phenotype acute leukemia delineates lineage associated molecular subtypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with the mixed immunophenotype, both AML-type and ALL-type
      mutations are detected in MPAL.
    explanation: >-
      Supports broad sequencing rather than a lineage-restricted panel, since
      both myeloid- and lymphoid-typical mutations occur.
- name: Bone marrow aspirate and biopsy
  description: >-
    Establishes blast percentage, marrow cellularity and degree of normal
    hematopoietic displacement, and provides material for immunophenotyping
    and genomics.
- name: Cerebrospinal fluid examination
  description: >-
    Lumbar puncture with cytology and flow cytometry assesses central nervous
    system involvement and is combined with intrathecal prophylaxis.
  evidence:
  - reference: PMID:28422191
    reference_title: "Mixed-phenotype acute leukemia: state-of-the-art of the diagnosis, classification and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The involvement of the CNS at presentation was noted in 5
      (18.5%) cases among 27 children with MPAL diagnosed
      according to the EGIL criteria and in 2 (18.2%) out of 11
      children meeting the 2008 WHO criteria
    explanation: >-
      Documents a clinically meaningful frequency of CNS involvement at
      presentation, justifying routine CSF assessment.
- name: Measurable residual disease monitoring
  description: >-
    Flow cytometric (and where available molecular) measurable residual disease
    assessment at end of induction and end of consolidation. MRD must be
    designed at diagnosis to track every abnormal blast compartment, because
    MPAL clones can shift phenotype. End-of-induction MRD is the strongest
    early prognostic variable in pediatric MPAL and is the proposed basis for
    therapy adaptation, including the decision to proceed to transplant.
  evidence:
  - reference: PMID:32060402
    reference_title: "Significance of minimal residual disease in pediatric mixed phenotype acute leukemia: a multicenter cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALL induction therapy achieved an EOI MRD negative (<0.01%) remission in
      most patients (70%). EOI MRD positivity was predictive of 5-year EFS
      (HR = 6.00, p < 0.001) and OS (HR = 9.57, p = 0.003).
    explanation: >-
      Quantifies the prognostic weight of end-of-induction MRD in a
      centrally reviewed pediatric MPAL cohort.
differential_diagnoses:
- name: Acute myeloid leukemia with aberrant lymphoid antigen expression
  disease_term:
    preferred_term: acute myeloid leukemia with aberrant lymphoid antigen expression
    term:
      id: MONDO:0018874
      label: acute myeloid leukemia
  description: >-
    AML blasts frequently express individual lymphoid antigens such as CD7 or
    CD19 without meeting formal lineage-assignment thresholds; this is
    aberrant antigen expression, not MPAL.
  distinguishing_features:
  - MPAL requires formal WHO/ICC lineage-assignment criteria for two lineages
  - single aberrant antigens without cytoplasmic CD3 or CD19-anchored
    combinations do not assign a second lineage
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Myeloperoxidase Intensity in part exceeds 50% of mature neutrophil level
    explanation: >-
      WHO-HAEM5 sets a quantitative intensity threshold for lineage
      assignment, which is what separates true MPAL from AML carrying
      sub-threshold aberrant lymphoid antigens; PARTIAL because the quoted row
      gives the myeloid threshold rather than the full rule set.
- name: Early T-cell precursor acute lymphoblastic leukemia
  disease_term:
    preferred_term: early T-cell precursor acute lymphoblastic leukemia
    term:
      id: MONDO:0100291
      label: early T cell progenitor acute lymphoblastic leukemia
  description: >-
    ETP-ALL shares an immature immunophenotype, myeloid/stem antigen
    expression and much of its genomic landscape with T/myeloid MPAL.
  distinguishing_features:
  - ETP-ALL is myeloperoxidase-negative by definition
  - T/myeloid MPAL satisfies myeloid lineage assignment, usually via
    myeloperoxidase
  evidence:
  - reference: PMID:37845689
    reference_title: Single-cell RNA sequencing distinctly characterizes the wide heterogeneity in pediatric mixed phenotype acute leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis comparing T/My MPAL to ETP, near-ETP, and non-ETP T-ALL, showed
      that T/My MPAL had greater overlap with ETP-ALL cases.
    explanation: >-
      Quantifies the transcriptional proximity of T/myeloid MPAL to ETP-ALL,
      which is why ETP-ALL is the principal differential for this subtype.
- name: Acute undifferentiated leukemia
  disease_term:
    preferred_term: acute undifferentiated leukemia
    term:
      id: MONDO:0020321
      label: acute undifferentiated leukemia
  description: >-
    AUL blasts express no lineage-defining marker at all rather than more than
    one.
  distinguishing_features:
  - AUL assigns no lineage; MPAL assigns two or more
  evidence:
  - reference: PMID:31982153
    reference_title: "Acute undifferentiated leukemia: data on incidence and outcomes from a large population-based database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute undifferentiated leukemia (AUL) is rare and defined by the absence
      of bona fide myeloid and lymphoid markers.
    explanation: >-
      Defines AUL by absence of lineage-defining markers, the exact inverse of
      the MPAL requirement that two or more lineages be assigned.
- name: Acute lymphoblastic leukemia
  disease_term:
    preferred_term: acute lymphoblastic leukemia
    term:
      id: MONDO:0004967
      label: acute lymphoblastic leukemia
  description: >-
    Lineage-committed B-ALL or T-ALL without qualifying cross-lineage myeloid
    antigen expression.
  distinguishing_features:
  - absence of myeloperoxidase or monocytic differentiation markers
- name: Blastic plasmacytoid dendritic cell neoplasm
  disease_term:
    preferred_term: blastic plasmacytoid dendritic cell neoplasm
    term:
      id: MONDO:0019467
      label: CD4+/CD56+ hematodermic neoplasm
  description: >-
    An immature CD4+/CD56+/CD123+ neoplasm that can mimic ambiguous-lineage
    leukemia.
  distinguishing_features:
  - characteristic CD123/TCL1/CD303 profile without myeloid or lymphoid
    lineage assignment
- name: Acute myeloid leukemia with a mixed phenotype
  disease_term:
    preferred_term: acute myeloid leukemia with a mixed phenotype (AML-MP)
    term:
      id: MONDO:0018874
      label: acute myeloid leukemia
  description: >-
    Acute myeloid leukemia that displays a mixed immunophenotype but is
    biologically and clinically distinct from de novo MPAL, with more frequent
    RUNX1 and TP53 mutations, inferior response, and little capacity for
    post-treatment lineage switch. Recognizing it matters because it responds
    poorly to the ALL-directed induction that benefits true MPAL.
  distinguishing_features:
  - enrichment for RUNX1 and TP53 driver mutations
  - inferior response to induction
  - rarely switches to a lymphoid immunophenotype after treatment
  evidence:
  - reference: PMID:39813682
    reference_title: Defining 2 biologically and clinically distinct groups in acute leukemia with a mixed phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and TP53 mutations as a driver
      are virtually absent in MPAL. Transcriptionally, AML-MP shows enrichment
      for stemness signatures and a relative deficit of transcription factors
      critical for myeloid and lymphoid differentiation.
    explanation: >-
      Genomic and transcriptomic separation of AML with mixed phenotype from
      MPAL, the basis for treating them as distinct diagnoses.
  - reference: PMID:39813682
    reference_title: Defining 2 biologically and clinically distinct groups in acute leukemia with a mixed phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AML-MP has inferior responses (hazard ratio, 12.5; 95% confidence
      interval, 2.72-57.8; P = .001), whereas MPAL has better responses to
      ALL-directed treatment.
    explanation: >-
      Establishes the clinical consequence of the distinction: ALL-directed
      therapy benefits MPAL but not AML with a mixed phenotype.
- name: Acute myeloid leukemia with defining recurrent genetic abnormalities
  disease_term:
    preferred_term: acute myeloid leukemia with defining recurrent genetic abnormalities
    term:
      id: MONDO:0018874
      label: acute myeloid leukemia
  description: >-
    A leukemia carrying an AML-defining lesion such as t(8;21)/RUNX1::RUNX1T1,
    inv(16)/CBFB::MYH11 or t(15;17)/PML::RARA is classified as that AML entity
    even if the blasts show a mixed immunophenotype, and is excluded from MPAL
    by WHO and ICC convention. Note that MONDO's umbrella term for this WHO
    grouping (MONDO:0020078, "acute myeloid leukemia with recurrent genetic
    anomaly") is obsolete and the individual lesion-specific children are too
    narrow to stand for the grouping, so the differential is anchored on the
    parent MONDO:0018874 with a more specific preferred_term.
  distinguishing_features:
  - presence of an AML-defining recurrent genetic abnormality overrides the
    mixed immunophenotype
treatments:
- name: ALL-Type Induction Chemotherapy
  description: >-
    Multi-agent lymphoid-type induction (vincristine, corticosteroid,
    anthracycline, asparaginase backbone) is the preferred initial regimen for
    most MPAL, with retrospective and registry data favouring ALL-directed over
    AML-directed induction for remission rates.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:

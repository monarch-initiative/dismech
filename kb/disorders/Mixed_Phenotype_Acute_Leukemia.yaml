    snippet: >-
      Mixed-phenotype acute leukaemia, B/myeloid
      Mixed-phenotype acute leukaemia, T/myeloid
      Mixed-phenotype acute leukaemia, rare types
    explanation: >-
      WHO-HAEM5 defines T/myeloid MPAL as an immunophenotypically defined

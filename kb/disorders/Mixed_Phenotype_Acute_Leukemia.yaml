      term:
        id: CHEBI:28445
        label: vincristine
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
    - preferred_term: daunorubicin
      term:
        id: CHEBI:41977
        label: daunorubicin
    - preferred_term: asparaginase
      term:
        id: NCIT:C286
        label: Asparaginase
  target_mechanisms:
  - target: Clonal Blast Expansion and Bone Marrow Replacement
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:29550836
    reference_title: "Therapy for children and adults with mixed phenotype acute leukemia: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using either definition of MPAL, ALL-therapy is associated with higher
      initial remission rates for MPAL and is at least equivalent to more
      intensive AML therapy for long-term survival.
    explanation: >-
      Systematic review and meta-analysis of 1,499 patients supports ALL-type
      induction as the preferred initial regimen.
  - reference: PMID:21228332
    reference_title: "Mixed-phenotype acute leukemia: clinical and laboratory features and outcome in 100 patients defined according to the WHO 2008 classification."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALL treatment induced a response in 85%, AML therapy in 41%; 3 of 5
      patients responded to the combination therapy.
    explanation: >-
      Direct comparison in a WHO-defined cohort shows markedly higher response
      to ALL-type than AML-type induction.
  - reference: PMID:31661160
    reference_title: "Mixed-phenotype acute leukemia: A cohort and consensus research strategy from the Children's Oncology Group Acute Leukemia of Ambiguous Lineage Task Force."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of the COG MPAL cohort and a literature review suggest
      that ALL chemotherapy without HSCT may be the preferred initial therapy.
    explanation: >-
      The Children's Oncology Group task force concludes ALL-type chemotherapy
      is the preferred initial approach in pediatric MPAL.
  - reference: PMID:36959485
    reference_title: "Multicenter retrospective analysis of clinical outcome of adult patients with mixed-phenotype acute leukemia treated with acute myeloid leukemia-like or acute lymphoblastic leukemia-like chemotherapy and impact of allogeneic stem cell transplantation: a Campus ALL study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complete remission (CR) rate was 67.6% and an ALL-like therapy was
      associated with a better CR rate (P = 0.048).
    explanation: >-
      A 77-patient adult multicenter series independently confirms the higher
      complete remission rate with ALL-like induction.
  - reference: PMID:33544265
    reference_title: "Mixed Phenotype Acute Leukemia: Current Approaches to Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The preponderance of retrospective data supports beginning therapy with
      ALL directed regimens.
    explanation: >-
      Review conclusion that the retrospective evidence base favours ALL-directed
      initial therapy, while flagging its retrospective nature.

notes: >-
  Scope note: this entry covers the WHO/ICC mixed phenotype acute leukemia
  family (MONDO:0020743) rather than only the narrower legacy term
  "acute biphenotypic leukemia" (MONDO:0020322) cited in issue #7468; the
  latter is retained as a narrowMatch mapping. Acute undifferentiated
  leukemia is curated as a related ambiguous-lineage subtype because it
  shares the immature-progenitor cell of origin and the same diagnostic
  lineage-assignment framework, while assigning no lineage rather than two.

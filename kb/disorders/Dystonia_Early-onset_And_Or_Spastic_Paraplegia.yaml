pathophysiology:
- name: Heterozygous ATP5MC3 Subunit c Missense Variants
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    Subunit c forms the membrane rotor ring; protons passing at its interface
    with subunit a drive rotation of the ring and the central stalk. Two of the
    three variants sit next to a loop that mediates the contact between the Fo
    and F1 parts, and the third at an interhelical contact within the
    membrane. Whether the mutant subunit, incorporated into rings alongside
    the products of the two paralogous genes, acts as a dominant negative has
    not been tested, so the functional impact is recorded as unknown.
  genes:
  - preferred_term: ATP5MC3
    term:
      id: hgnc:843
      label: ATP5MC3
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: Inherited in the original family and de novo in three unrelated patients.
  molecular_functions:
  - preferred_term: c-ring proton translocation
    term:
      id: GO:0015078
      label: proton transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:24564666
    reference_title: "Nuclear genetic defects of mitochondrial ATP synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "As the protons pass at the interface of the subunit a and c-oligomer, the proton gradient powers rotation of the c-ring and the central stalk thus induces cyclic conformational changes in α 3β3 hexamer."
    explanation: The normal role of the c-ring in proton-driven rotation.
  - reference: PMID:33917760
    reference_title: "The ATP Synthase Deficiency in Human Diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The membrane-bound rotor consists of eight identical c subunits (c- ring) in close association with a single a (or ATP6) subunit"
    explanation: Subunit c makes up the membrane rotor.
  - reference: PMID:34954817
    reference_title: "Variants in Mitochondrial ATP Synthase Cause Variable Neurologic Phenotypes."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "From three-dimensional analyses, we observed that p.Gly79Val was positioned at an interhelical contact side, while the other modeled variants were situated in immediate vicinity of a loop structure essentially involved in the interaction between the FO and F1 subcomplexes (Figure 5d)."
    explanation: Structural positions of the variants.
  downstream:

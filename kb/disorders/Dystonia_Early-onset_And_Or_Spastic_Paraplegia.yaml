name: Dystonia, Early-Onset, and/or Spastic Paraplegia
creation_date: "2026-11-27T14:39:20Z"
category: Mendelian
disease_term:
  preferred_term: Dystonia, early-onset, and/or spastic paraplegia
  term:
    id: MONDO:0859215
    label: dystonia, early-onset, and/or spastic paraplegia
description: >-
  Dystonia, early-onset, and/or spastic paraplegia is the dominant movement
  disorder caused by heterozygous missense variants in ATP5MC3, one of three
  nuclear genes encoding subunit c of mitochondrial ATP synthase. Eight c
  subunits form the membrane rotor ring, through whose interface with subunit a
  protons pass to drive rotation of the central stalk and ATP synthesis in the
  F1 head.

  The disorder was defined in a large family with autosomal dominant spastic
  paraplegia or dystonia, previously linked to chromosome 2q24-2q31, in which
  p.Asn106Lys cosegregated with disease. The phenotype in that family depends
  on age at onset: early-childhood onset gives severe progressive generalised
  dystonia, later childhood onset segmental dystonia or spasmodic dysphonia,
  and adult onset a predominantly uncomplicated, slowly progressive spastic
  paraplegia; successive generations developed earlier and more severe
  disease. The same variant arose de novo in a boy with isolated upper-limb
  dystonia, and two further de novo variants were found in a girl with
  milestone delay, pyramidal signs and generalised dystonia (p.Pro107Ala) and
  in a boy with delayed development, lower-limb spasticity and raised lactate
  (p.Gly79Val).

  Patient fibroblasts have reduced complex V activity, ATP generation and
  oxygen consumption, with reduced complex V content in the p.Gly79Val line,
  and Drosophila carrying orthologous mutations have impaired mitochondrial
  function and reduced mobility. How a heterozygous variant in one of three
  subunit c genes acts dominantly is not resolved. The disease name is the
  MONDO and OMIM label; it describes a phenotype that other genes also cause,
  but no gene-specific name for it is established.

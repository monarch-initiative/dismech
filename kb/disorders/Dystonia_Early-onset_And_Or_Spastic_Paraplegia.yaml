genetic:
- name: ATP5MC3
  notes: >-
    ATP5MC3 (2q31.1; previous symbol ATP5G3) is one of three genes (with
    ATP5MC1 and ATP5MC2) encoding subunit c of ATP synthase. Reported
    heterozygous missense variants: c.318C>G (p.Asn106Lys), segregating in a
    large family and de novo in an unrelated patient; c.319C>G (p.Pro107Ala),
    de novo; c.236G>T (p.Gly79Val), de novo. ClinGen classifies ATP5MC3 as
    Limited (autosomal dominant) for the lumped concept mitochondrial disease
    (MONDO:0044970, 2026), which is not this entry's MONDO:0859215, so no tier
    is recorded under gene_disease_validity. relationship_type is UNKNOWN
    because of that Limited classification, although segregation in one large
    family, recurrence of the same variant de novo, and fibroblast and
    Drosophila studies support the association.
  gene_term:
    preferred_term: ATP5MC3
    term:
      id: hgnc:843
      label: ATP5MC3
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  inheritance:

    snippet: "Patient fibroblast studies showed impaired complex V activity, ATP generation, and oxygen consumption."
    explanation: The fibroblast findings.
differential_diagnoses:
- name: Hereditary spastic paraplegias and genetic dystonias
  description: >-
    The adult-onset presentation resembles uncomplicated hereditary spastic
    paraplegia, and the childhood-onset presentations resemble isolated or
    generalised genetic dystonias.
  distinguishing_features:
  - Heterozygous ATP5MC3 variant
  - Reduced complex V activity in fibroblasts
- name: ATP5F1A- and ATP5F1B-related dominant movement disorders
  description: >-
    Dominant variants in the alpha and beta subunits also cause dystonia and
    spastic paraplegia with reduced complex V activity.
  distinguishing_features:
  - Variant in ATP5F1A or ATP5F1B rather than ATP5MC3
notes: >-
  Naming: the MONDO and OMIM label describes a phenotype that other genes
  also cause, so it is broader than this single-gene entry. No gene-specific
  name is established (a literature search for ATP5MC3-related or
  ATP5MC3-associated names returned only the founding report's title), so the
  label is kept, following design decision 18. Clinical detail on the original
  family's onset-dependent phenotype and anticipation comes from the 2024
  systematic review (PMID:39016153); the founding report is cached as abstract
  only (PMID:34636445). No GeneReviews chapter covers ATP5MC3.

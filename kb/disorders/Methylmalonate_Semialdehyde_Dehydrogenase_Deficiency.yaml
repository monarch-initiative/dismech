pathophysiology:
- name: ALDH6A1-dependent methylmalonate semialdehyde dehydrogenase deficiency
  conforms_to: metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic ALDH6A1 variants reduce or abolish the activity of mitochondrial
    methylmalonate semialdehyde dehydrogenase. Six missense alleles affecting
    residues conserved across mammals have been reported. Direct enzymatic
    confirmation was historically impossible because the substrate is too
    unstable to assay; the first successful fibroblast assay was reported in
    2013, and reduced protein has separately been shown by Western blot.

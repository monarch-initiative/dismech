  description: >-
    Reported patients are homozygous or compound heterozygous for ALDH6A1
    missense variants, several of them ascertained through consanguineous
    unions. Biallelic variants establish the biochemical phenotype, but do not
    predict clinical outcome: the index patient of the original 1985 report was
    developing normally at four years of age, while other biallelic patients
    have had severe developmental delay or died in early childhood. No
    segregation evidence is available in any published family.

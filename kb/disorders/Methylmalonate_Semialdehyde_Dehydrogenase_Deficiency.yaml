name: Methylmalonate Semialdehyde Dehydrogenase Deficiency
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
synonyms:
- MMSDH deficiency
- MMSDD
- MMSDHD
- ALDH6A1 deficiency
- Methylmalonic semialdehyde dehydrogenase deficiency
- Developmental delay due to methylmalonate semialdehyde dehydrogenase deficiency
description: >-
  Methylmalonate semialdehyde dehydrogenase (MMSDH) deficiency is an ultra-rare
  autosomal recessive inborn error caused by biallelic variants in ALDH6A1. The
  enzyme sits at the point where two otherwise separate catabolic routes
  converge: valine degradation yields (S)-methylmalonate semialdehyde and
  thymine degradation yields the (R)-enantiomer, and MMSDH oxidatively
  decarboxylates both to propionyl-CoA. Loss of the enzyme therefore blocks a
  single shared step of valine and pyrimidine catabolism and produces a
  characteristic but strikingly inconsistent urinary profile: 3-hydroxyisobutyric
  acid, 3-hydroxypropionic acid, 3-aminoisobutyric acid, beta-alanine and - in
  some patients only, and only transiently - methylmalonic acid.

  The established disorder is biochemical. The clinical picture is not: reported
  patients range from an entirely healthy newborn-screening ascertainment to
  severe developmental delay with abnormal myelination, and to death from
  hepatoencephalopathy after a febrile illness. Fewer than a dozen molecularly
  confirmed patients have been published, none with segregation data, and the
  ClinGen Aminoacidopathy Gene Curation Expert Panel classifies the
  ALDH6A1-disease relationship as Limited. This entry therefore models the
  enzymatic block and its metabolite consequences as established, and keeps the
  neurological, hepatic and mitochondrial findings on deliberately detached,
  low-confidence branches.

  Not to be confused with HIBADH deficiency, the other primary cause of
  3-hydroxyisobutyric aciduria, which blocks the immediately upstream step of
  the same valine pathway.

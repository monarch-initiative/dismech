- name: Convergent block of valine and thymine catabolism
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    MMSDH is the convergence point of two independent catabolic routes. Valine
    degradation produces (S)-3-hydroxyisobutyric acid, which 3-hydroxyisobutyrate
    dehydrogenase oxidizes to (S)-methylmalonate semialdehyde; thymine
    degradation produces (R)-3-aminoisobutyric acid, which is deaminated to the
    (R)-enantiomer. MMSDH oxidatively decarboxylates both enantiomers to
    propionyl-CoA, and both are affected by the deficiency. Because one enzyme
    serves two pathways, the disorder is simultaneously an aminoacidopathy and a
    pyrimidine-catabolism defect - which is why the urine profile mixes
    valine-derived and thymine-derived metabolites.
  biological_processes:
  - preferred_term: L-valine catabolic process
    term:
      id: GO:0006574
      label: L-valine catabolic process
    modifier: DECREASED
  - preferred_term: thymine catabolic process
    term:
      id: GO:0006210
      label: thymine catabolic process
    modifier: DECREASED

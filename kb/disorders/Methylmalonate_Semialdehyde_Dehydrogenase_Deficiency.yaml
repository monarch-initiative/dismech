  evidence:
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      varied metabolite abnormalities, including accumulation of
      3-hydroxyisobutyric, 3-hydroxypropionic, 3-aminoisobutyric and
      methylmalonic acids, as well as β-alanine
    explanation: Enumerates the accumulating metabolites and flags their variability.
  - reference: PMID:10947204
    reference_title: Molecular characterization of methylmalonate semialdehyde dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The urine metabolic pattern was strikingly different in all, including
      beta-alanine, 3-hydroxypropionic acid, both isomers of 3-amino- and
      3-hydroxyisobutyric acids in one and 3-hydroxyisobutyric and lactic acids
      in a second, and mild methylmalonic aciduria in a third patient.
    explanation: >-
      Documents the disparate urinary profiles of the three earliest reported
      patients. Read narrowly: the same report found MMSDH coding-region
      alterations in the first patient only, so the second and third patients
      are not molecularly confirmed and their profiles cannot be attributed to
      this enzyme block. Cited for the first patient's composite profile, not
      as a measure of within-disease variability; see PMID:23835272 and
      PMID:32151545 for variability among confirmed cases.
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine organic acid assessment identified excess 3-hydroxyisobutyrate and
      3-hydroxypropionate, while urine amino acid analysis identified elevated
      concentrations of β-aminoisobutyrate and β-alanine.
    explanation: Independent confirmation of the composite organic-acid and amino-acid pattern.
  downstream:
  - target: Elevated urinary 3-hydroxyisobutyric acid
    description: >-
      3-Hydroxyisobutyric aciduria is the most consistent biochemical expression
      of the block and the finding that has prompted diagnosis in every reported

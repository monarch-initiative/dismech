- name: Accumulation of upstream valine- and thymine-pathway metabolites
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    The block produces a composite organic aciduria and aminoaciduria drawing on
    both feeder pathways: 3-hydroxyisobutyric and 3-hydroxypropionic acids,
    3-aminoisobutyric acid and beta-alanine. Methylmalonic acid is elevated in
    some patients only, and in the one patient in whom it was followed
    longitudinally it was transient rather than persistent. The single most
    important curation caveat for this disorder is that the metabolite pattern
    has differed in essentially every reported patient, so no fixed profile can
    be treated as diagnostic. Whether any of these metabolites is toxic is
    unknown, which is why this node is not linked to a toxic-metabolite or
    energy-deficit mechanism.
  chemical_entities:
  - preferred_term: 3-hydroxyisobutyric acid
    term:
      id: CHEBI:18064

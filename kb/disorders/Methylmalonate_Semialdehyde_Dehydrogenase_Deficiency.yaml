genetic:
- name: Biallelic ALDH6A1 missense variants
  gene_term:
    preferred_term: ALDH6A1
    term:
      id: hgnc:7179
      label: ALDH6A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    All reported disease alleles are missense and affect residues conserved
    across mammals: c.1336G>A (p.Gly446Arg), c.785C>A (p.Ser262Tyr), c.184C>T
    (p.Pro62Ser), c.514T>C (p.Tyr172His), c.1603C>T (p.Arg535Cys) and c.1261C>T
    (p.Pro421Ser). Most patients are homozygous, several through consanguinity;
    one is compound heterozygous. The disease mechanism is biallelic loss of
    function. Two caveats matter for variant interpretation: p.Pro62Ser was also
    seen once in 530 control chromosomes, and p.Pro421Ser was reported as a
    variant of uncertain significance whose pathogenicity rests on the
    accompanying protein and metabolite data rather than on the sequence change
    alone.
  evidence:
  - reference: PMID:10947204
    reference_title: Molecular characterization of methylmalonate semialdehyde dehydrogenase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      revealing homozygosity for a 1336G > A transversion, which leads to
      substitution of arginine for highly conserved glycine at amino acid 446
    explanation: The first molecularly characterized allele.
  - reference: PMID:21863277
    reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggested homozygosity for the missense mutation c.785 C > A (S262Y) in
      exon 7 which was not found in 210 control alleles
    explanation: Second reported allele, with control-cohort screening.
  - reference: PMID:21863277
    reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a different missense mutation, c.184 C > T (P62S), which was also
      identified in 1/530 control chromosomes
    explanation: Records the control-chromosome observation that tempers the pathogenicity claim for this allele.
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      within exon 6 (c.514 T > C; p. Tyr172His) and exon 12 (c.1603C > T; p.
      Arg535Cys) of ALDH6A1
    explanation: The only reported compound-heterozygous genotype.
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALDH6A1 gene sequencing identified a homozygous variant of uncertain
      significance, c.1261C > T (p.Pro421Ser).
    explanation: Documents the sixth allele and its VUS classification.
  - reference: CGGV:assertion_57ca1521-9336-4769-bc55-240089dab917-2026-01-09T170000.000Z
    reference_title: ALDH6A1 / methylmalonate semialdehyde dehydrogenase deficiency (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: At least six unique missense variants have been reported in humans.
    explanation: Confirms that the reported allelic spectrum is entirely missense.
diagnosis:
- name: Urine organic acid and amino acid analysis
  diagnosis_term:
    preferred_term: urine organic acid analysis
  description: >-
    The entry point to diagnosis. Urine organic acids show 3-hydroxyisobutyrate
    with variable 3-hydroxypropionate and methylmalonate; urine and plasma amino
    acids show beta-aminoisobutyrate and beta-alanine. Because the profile
    differs between patients and elevations can be mild in a stable patient, a
    normal-looking screen does not exclude the diagnosis.
  results: >-
    Composite organic aciduria with beta-aminoisobutyrate and beta-alanine; the
    pattern is variable between patients and over time.
  evidence:
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine organic acid assessment identified excess 3-hydroxyisobutyrate and
      3-hydroxypropionate, while urine amino acid analysis identified elevated
      concentrations of β-aminoisobutyrate and β-alanine.
    explanation: Describes the biochemical work-up that identified the disorder.
- name: ALDH6A1 sequencing
  diagnosis_term:
    preferred_term: molecular genetic testing
  description: >-
    Sequencing ALDH6A1 is the practical confirmatory test, and for three decades
    it was the only one available, because the substrate instability made the
    enzyme assay impracticable. Exome sequencing has been the route to diagnosis
    where the biochemical picture was ambiguous.
  results: Biallelic ALDH6A1 missense variants.
  evidence:
  - reference: PMID:21863277
    reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis in the ALDH6A1 gene can reveal a cause of
      3-hydroxyisobutyric aciduria
    explanation: Establishes gene sequencing as the diagnostic route.
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compound heterozygous mutations were identified by exome sequencing and
      confirmed by Sanger sequencing
    explanation: Documents exome sequencing as the diagnostic modality in a clinically ambiguous case.
- name: MMSDH enzyme assay in cultured fibroblasts
  diagnosis_term:
    preferred_term: enzyme activity assay
  description: >-
    Available only in specialist laboratories. Long considered impossible
    because methylmalonate semialdehyde is too unstable; a working fibroblast
    assay was first reported in 2013 and showed activity 2.5 standard deviations
    below the mean, which is a reduction rather than an absence.
  results: Reduced MMSDH activity in cultured fibroblasts.
  evidence:
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, this is the first report to demonstrate a corresponding
      reduction in MMSDH enzyme activity.
    explanation: Establishes the enzyme assay as a confirmatory test and dates its first successful use.
differential_diagnoses:
- name: HIBADH deficiency
  description: >-
    The other primary cause of 3-hydroxyisobutyric aciduria. HIBADH catalyses
    the immediately upstream step of the same valine pathway, so the two
    disorders produce overlapping urinary 3-hydroxyisobutyrate. The
    discriminators are that HIBADH deficiency does not affect thymine catabolism
    (so beta-aminoisobutyrate and beta-alanine should not be raised) and that
    HIBADH enzyme activity is normal in MMSDH deficiency. Measuring HIBADH
    activity is exactly how MMSDH deficiency was established in two of the
    reported patients.
  evidence:
  - reference: PMID:35174513
    reference_title: "3-Hydroxyisobutyric acid dehydrogenase deficiency: Expanding the clinical spectrum and quantitation of D- and L-3-Hydroxyisobutyric acid by an LC-MS/MS method."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the only previously recognized primary cause had been a deficiency of
      methylmalonic semialdehyde dehydrogenase, the enzyme that is immediately
      downstream of HIBADH in the valine catabolic pathway and is encoded by the
      ALDH6A1 gene
    explanation: States the precise pathway relationship between the two differential diagnoses.
  - reference: PMID:21863277
    reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      included tests of the HIBADH enzyme in fibroblast homogenates, which
      yielded normal activities
    explanation: Documents the enzymatic discrimination between the two disorders.
- name: Other causes of 3-hydroxyisobutyric aciduria
  description: >-
    3-Hydroxyisobutyric aciduria is a biochemical finding with several
    mechanisms, not a disease. Respiratory-chain defects are an established
    alternative cause, so an isolated 3-hydroxyisobutyrate elevation should not
    be equated with an ALDH6A1 defect.
  evidence:
  - reference: PMID:21863277
    reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      individuals with 3-hydroxyisobutyryic aciduria represent a heterogeneous
      group with different underlying mechanisms, including respiratory chain
      defects or deficiency of methylmalonate semialdehyde dehydrogenase
    explanation: Establishes the heterogeneous causation of the presenting biochemical finding.
- name: Classical methylmalonic acidemia
  description: >-
    Patients with the methylmalonic-aciduria variant of the MMSDH phenotype can
    be mistaken for methylmalonyl-CoA mutase or cobalamin-pathway disorders. In
    MMSDH deficiency the methylmalonate elevation is mild and may be transient,
    and it is accompanied by 3-hydroxyisobutyrate and beta-aminoisobutyrate,
    which the classical methylmalonic acidemias do not produce.
  evidence:
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      transient/variable elevations in lactate, methylmalonic acid,
      3-hydroxyisobutyric and 3-aminoisobutyric acids
    explanation: Shows the co-occurring metabolites that separate this disorder from classical methylmalonic acidemia.
treatments:
- name: Valine-restricted diet
  description: >-
    Restriction of dietary valine reduces substrate flux into the blocked
    pathway. In the one patient in whom it has been reported in detail it
    reduced the abnormal analytes and was accompanied by improved growth and
    reduced reflux. This is a single uncontrolled observation, not demonstrated
    efficacy, and there is no evidence at all bearing on whether it alters
    neurological outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Accumulation of upstream valine- and thymine-pathway metabolites
    treatment_effect: MODULATES
    description: >-
      Limiting valine intake reduces flux into the valine-derived arm of the
      block and lowers the accumulating metabolites. It cannot address the
      thymine-derived arm.
    evidence:
    - reference: PMID:32151545
      reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Management with valine restriction led to reduced concentration of
        abnormal analytes in blood and urine
      explanation: Single-patient evidence that the intervention lowers the target metabolites.
  evidence:
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      improved growth, and reduced gastroesophageal reflux
    explanation: The accompanying clinical improvement, uncontrolled and in one patient only.

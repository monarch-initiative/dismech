    explanation: Establishes that the single enzyme block affects both valine and pyrimidine catabolism.
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Metabolism of valine produces the intermediate (S)-3-hydroxyisobutyric
      acid (HIBA), which is oxidized to (S)-methylmalonic semialdehyde
    explanation: States the valine-derived arm feeding the blocked reaction.
  - reference: PMID:3939535
    reference_title: Excessive excretion of beta-alanine and of 3-hydroxypropionic, R- and S-3-aminoisobutyric, R- and S-3-hydroxyisobutyric and S-2-(hydroxymethyl)butyric acids probably due to a defect in the metabolism of the corresponding malonic semialdehydes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: both R- and S-methylmalonic semialdehydes seem to be equally affected
    explanation: Supports that the deficiency affects both enantiomeric substrates, i.e. both feeder pathways.

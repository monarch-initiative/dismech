discussions:
- discussion_id: gap_mmsdh_clinical_causality
  prompt: >-
    Do the neurological, hepatic and growth findings reported in ALDH6A1
    patients arise from the enzyme deficiency, or are they ascertainment
    artefacts of investigating children who were referred for those problems?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reported neurological association of uncertain causality
  - phenotypes#Global developmental delay
  - phenotypes#Abnormal myelination
  - phenotypes#Hepatic encephalopathy
  rationale: >-
    Every reported patient bar one was ascertained because of a clinical
    problem, and the exception - the 1985 index patient, found through newborn
    screening for an unrelated reason - was developing normally at four years.
    With fewer than ten molecularly confirmed patients, no segregation data and
    no population screening, the disorder's clinical penetrance is not estimable
    and the direction of the association cannot be resolved. ClinGen's Limited
    classification rests on exactly this ambiguity.
  evidence:
  - reference: CGGV:assertion_57ca1521-9336-4769-bc55-240089dab917-2026-01-09T170000.000Z
    reference_title: ALDH6A1 / methylmalonate semialdehyde dehydrogenase deficiency (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In summary, there is limited evidence to support this gene-disease relationship.
    explanation: The expert-panel classification that frames this gap.
  - reference: CGGV:assertion_57ca1521-9336-4769-bc55-240089dab917-2026-01-09T170000.000Z
    reference_title: ALDH6A1 / methylmalonate semialdehyde dehydrogenase deficiency (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although more evidence, genetic and experimental, is needed to support a
      causal role, no convincing evidence has emerged that contradicts the
      gene-disease relationship.
    explanation: States precisely that the causal role is unestablished rather than refuted.
  proposed_experiments:
  - experiment_id: exp_mmsdh_unbiased_ascertainment
    name: Unbiased ascertainment through untargeted metabolomic screening
    description: >-
      Identify ALDH6A1 biallelic individuals from large unselected biobank and
      newborn-screening metabolomic datasets rather than from clinical referral,
      then phenotype them with standardized developmental, hepatic and
      neuroimaging assessments against variant-negative relatives. This is the
      only design that can separate the disorder's true clinical spectrum from
      referral bias.
- discussion_id: gap_mmsdh_metabolite_variability
  prompt: >-
    Why does a single, well-defined enzymatic block produce a different
    metabolite profile in every reported patient, and what determines which
    metabolites accumulate in a given individual?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of upstream valine- and thymine-pathway metabolites
  - phenotypes#Methylmalonic aciduria
  rationale: >-
    Among molecularly confirmed patients the clinical and biochemical phenotype
    is highly variable: methylmalonic acid has been persistent in some,
    transient in another, and absent in others, and the fifth reported case
    diverges clinically from the earlier ones. Residual enzyme activity,
    relative valine versus thymine flux, and the observed dissociation between
    plasma and urinary beta-alanine are all candidate explanations, none tested.
    The three earliest reported patients also had essentially non-overlapping
    urinary profiles, but only the first of those was confirmed at the cDNA
    level, so that particular contrast is at least as consistent with three
    different disorders as with variability within this one and is not the basis
    of this gap. The practical consequence is that the disorder has no reliable
    biochemical screening signature.
  evidence:
  - reference: PMID:23835272
    reference_title: Mutations in ALDH6A1 encoding methylmalonate semialdehyde dehydrogenase are associated with dysmyelination and transient methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: highly variable clinical and biochemical phenotype
    explanation: >-
      States the variability directly, in a report whose own case is confirmed
      by biallelic ALDH6A1 variants and reduced MMSDH enzyme activity.
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: clinical phenotypes diverge from prior cases
    explanation: A second molecularly confirmed case whose phenotype diverges from the earlier ones.
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma amino acids showed an elevated concentration of β-aminoisobutyrate
      with undetectable β-alanine.
    explanation: Documents a plasma/urine dissociation that any explanation of the variability must account for.
  proposed_experiments:
  - experiment_id: exp_mmsdh_flux_genotype_correlation
    name: Residual-activity and stable-isotope flux correlation across genotypes
    description: >-
      Express each reported ALDH6A1 missense allele, measure residual activity
      against both (R)- and (S)-methylmalonate semialdehyde, and pair this with
      stable-isotope valine and thymine flux studies in patient fibroblasts.
      Testing whether allele-specific enantiomer preference predicts the
      individual metabolite profile would convert an unexplained heterogeneity
      into a genotype-phenotype rule.
notes: >-
  New entry curated for the WP-001 metabolic worklist row 1.2.17.01 (ALDH6A1,
  MONDO:0013579, OMIM:614105, ORPHA:289307). Note that the worklist row cites
  OMIM 603178, which is the ALDH6A1 *gene* MIM; the phenotype MIM is 614105, and
  MONDO:0013579 carries the latter as its xref.

  Curation stance: the enzymatic block and its metabolite consequences are
  curated as ESTABLISHED; every clinical finding is kept on PROVISIONAL or
  HYPOTHETICAL nodes with no causal edge from the biochemical chain, because
  ClinGen classifies the gene-disease relationship as Limited and explicitly
  leaves open whether the extra-biochemical symptoms belong to the disorder. No
  phenotype `frequency:` bands are assigned - with fewer than ten published
  patients and clinical ascertainment throughout, any band would be fabricated.
  Only the enzyme node declares `conforms_to`
  (`metabolic_intoxication_decompensation#Enzymatic Block in Intermediary
  Metabolism`); the module's toxic-metabolite, decompensation and encephalopathy
  nodes are deliberately NOT claimed, since metabolite toxicity and acute
  decompensation are not evidenced for this disorder.

  NEC note: "3-hydroxyisobutyric aciduria" names a biochemical finding with at
  least three causes - ALDH6A1 deficiency, HIBADH deficiency (a separate WP-001
  row, 1.2.25.01) and respiratory-chain defects. Literature retrieved under that
  phrase must be checked for which enzyme it concerns before use. Curated
  against the ALDH6A1 identity anchors (MONDO RO:0004003 -> HGNC:7179,
  OMIM:614105, Orphanet:289307), all three of which agree.

  Deferred to a second pass: Orphanet provenance (ORPHA:289307 is not in
  references_cache and needs an Orphadata refresh), imaging_findings for the
  single abnormal-myelination case, and prevalence beyond the literature count.

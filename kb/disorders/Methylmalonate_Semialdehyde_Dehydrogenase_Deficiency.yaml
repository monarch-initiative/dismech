- name: Semialdehyde shunting toward beta-alanine and malonyl-CoA
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Metabolomic profiling of fibroblasts from one patient found an
    over-representation of fatty acids and acylcarnitines. The authors proposed
    that blocked methylmalonate semialdehyde is diverted to beta-alanine and
    then to malonyl-CoA, increasing fatty acid synthesis. This is an inference
    from a metabolite pattern in a single patient's cells, not a demonstrated
    flux, so the node is provisional and is not used to explain any clinical
    finding.
  chemical_entities:
  - preferred_term: malonyl-CoA
    term:
      id: CHEBI:15531
      label: malonyl-CoA
    modifier: INCREASED
  - preferred_term: beta-alanine
    term:
      id: CHEBI:16958
      label: beta-alanine
    modifier: INCREASED
  evidence:
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Metabolomic profiles from patient fibroblasts demonstrated
      over-representation of fatty acids and fatty acylcarnitines
    explanation: The observed metabolomic finding; the shunt itself is an interpretation the authors hedge as presumptive.
- name: Fibroblast mitochondrial dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Fibroblasts from one patient showed increased superoxide production, reduced
    oxygen consumption and reduced ATP production. The authors note this as a
    finding worth checking in future patients rather than an established
    component of the disease. It is one plausible bridge between the enzymatic
    block and the neurological findings, but nothing links the two directly, so
    no causal edge to the clinical arm is asserted here.
  evidence:
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Patient cells displayed compromised mitochondrial function with increased
      superoxide production, reduced oxygen consumption, and reduced ATP
      production.
    explanation: Single-patient in vitro observation of mitochondrial dysfunction.
  - reference: PMID:32151545
    reference_title: "Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate semialdehyde dehydrogenase deficiency: Report of a fifth case."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recognition of mitochondrial dysfunction and novel metabolites in this
      patient provide the opportunity to assess future patients for secondary
      changes that may influence clinical outcome.
    explanation: The authors themselves frame the finding as a hypothesis to be tested in future patients.
- name: Reported neurological association of uncertain causality
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Developmental delay and, in one patient, abnormal myelination on brain MRI
    have been reported in molecularly confirmed patients. No mechanism connects
    the accumulating metabolites to neuronal or myelin injury, and other
    biallelic patients have been neurologically normal - the first reported
    patient was developing normally at four years, and the fifth had a normal
    brain MRI. ClinGen explicitly leaves open whether the extra-biochemical
    symptoms belong to the disorder. This node is deliberately detached from the
    established biochemical chain and must not be read as a mechanism.
  locations:

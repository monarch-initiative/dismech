  icimd_category:
  - classification_value: organic_acidurias
    notes: >-
      MONDO places methylmalonate semialdehyde dehydrogenase deficiency under
      inborn organic aciduria, and the presenting abnormality is an organic
      aciduria on urine organic-acid analysis.
    evidence:
    - reference: PMID:21863277
      reference_title: 3-Hydroxyisobutyrate aciduria and mutations in the ALDH6A1 gene coding for methylmalonate semialdehyde dehydrogenase.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 3-hydroxyisobutyric aciduria is an organic aciduria with a poorly understood biochemical basis.
      explanation: Classifies the presenting biochemical abnormality as an organic aciduria.
  - classification_value: branched_chain_amino_acids
    notes: >-
      The enzyme block is on the L-valine catabolic pathway, placing the
      disorder among the branched-chain amino acid disorders as well.
    evidence:
    - reference: PMID:10947204
      reference_title: Molecular characterization of methylmalonate semialdehyde dehydrogenase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data provide the first molecular characterization of an inborn
        error of metabolism specific to the L-valine catabolic pathway.
      explanation: Places the disorder specifically in branched-chain (valine) amino acid catabolism.

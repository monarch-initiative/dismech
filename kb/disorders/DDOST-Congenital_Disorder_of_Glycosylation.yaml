- name: Impaired Oligosaccharyltransferase Function
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  locations:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  protein_complexes:
  - preferred_term: oligosaccharyltransferase complex
    term:
      id: GO:0008250
      label: oligosaccharyltransferase complex
  molecular_functions:
  - preferred_term: oligosaccharyltransferase activity
    term:
      id: GO:0004579
      label: dolichyl-diphosphooligosaccharide-protein glycotransferase activity
    modifier: DECREASED
  description: >-
    The OST complex transfers the lipid-linked glycan en bloc to asparagine in
    nascent polypeptides in the ER lumen. The yeast orthologue of OST48, WBP1,
    is required for this transfer activity. Reduced OST48 is therefore
    expected to lower OST activity. How OST48 loss affects the assembly or
    stability of the human complex, and whether OST-A and OST-B are affected
    equally, has not been measured in patient cells; the step is inferred from
    the yeast data and from the hypoglycosylation that follows.
  evidence:
  - reference: PMID:37848450
    reference_title: "Functional classification of DDOST variants of uncertain clinical
      significance in congenital disorders of glycosylation."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: "OST48 is a non-catalytic component of the oligosaccharyltransferase
      (OST) complex, which transfers glycans to substrate proteins."
    explanation: States OST48's place in the OST complex; restates established biochemistry
      in an assay paper.
  - reference: PMID:1600939
    reference_title: "The yeast WBP1 is essential for oligosaccharyl transferase activity
      in vivo and in vitro."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In this report we show that the essential yeast protein WBP1 (te Heesen
      et al., 1991) is required for N-oligosaccharyl transferase in vivo and in vitro."
    explanation: The yeast orthologue of OST48 is required for OST activity; extrapolation
      to the human complex is an inference step.
  downstream:
  - target: Protein Hypoglycosylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1600939
      reference_title: "The yeast WBP1 is essential for oligosaccharyl transferase
        activity in vivo and in vitro."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Depletion of WBP1 correlates with a defect in transferring core oligosaccharides
        to carboxypeptidase Y and proteinase A in vivo."
      explanation: Depleting the OST48 orthologue in yeast reduces glycan transfer
        to glycoproteins.

    term:
      id: GO:0004579
      label: dolichyl-diphosphooligosaccharide-protein glycotransferase activity
    modifier: DECREASED
  description: >-
    Less OST48 is present in patient fibroblasts. OST48 is a non-catalytic
    subunit; the catalytic subunits of the complex are STT3A and STT3B. The
    molecular function bound here is the activity of the complex OST48 belongs
    to, which it contributes to rather than catalyses.

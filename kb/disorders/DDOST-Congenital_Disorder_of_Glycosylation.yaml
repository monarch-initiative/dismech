notes: >-
  No GeneReviews chapter covers DDOST-CDG (just check-genereviews --online
  returned NO_CHAPTER against the Bookshelf index snapshot of 2026-09-10 and a
  live PubMed title search). Phenotype frequencies are omitted throughout
  because every feature comes from one to four case reports; the Orphanet
  phenotype annotation assigns frequency classes such as "Very frequent" that
  rest on the index case, and those classes are not reproduced. A 2023 letter
  reporting humoral immune deficiency with a DDOST variant (PMID:36631682)
  has no abstract and its text could not be fetched into the reference cache,
  so the immune phenotype is not curated. None of the cited case reports
  describes a disease-specific treatment, so no treatments are recorded. The
  IMPC Ddost knockout mouse mentioned in the deep-research report (recorded
  there as embryonic lethal) is not cited because it has no publication to
  quote.

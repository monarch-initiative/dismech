    explanation: Abnormal transferrin glycosylation in the first two patients.
- name: Plasma N-Glycan Profile
  notes: >-
    Plasma N-glycan profiling in one patient showed mildly increased small
    high-mannose glycans (Man0-5GlcNAc2), a pattern the authors note is also
    reported with defects in other OST subunits.

discussions:
- discussion_id: ddost_patient_count_and_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How many distinct individuals with DDOST-CDG have been published, and what
    is the actual frequency of each feature beyond developmental delay,
    hypotonia and the type I transferrin pattern?
  attaches_to:
  - prevalence#Worldwide
  - phenotypes#Decreased liver function
  rationale: >-
    The literature consists of single case reports. A 2026 report counted
    three prior patients, while ClinGen's curation counts four probands
    including a 65-year-old woman from a CDG liver natural history cohort,
    and a further patient with humoral immune deficiency was reported in a
    2023 letter whose text is not available for quotation here. Whether these
    reports describe overlapping individuals is not stated. With so few
    patients, features such as situs inversus, lactose intolerance and the
    progressive movement disorder cannot yet be distinguished from chance
    co-occurrence or genotype-specific effects, and the immune phenotype is not
    curated in this entry for lack of a quotable source.
- discussion_id: ddost_tissue_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of the non-catalytic OST48 subunit lower OST activity in
    human cells, and which client glycoproteins account for the neurological
    and hepatic features?
  attaches_to:
  - pathophysiology#Impaired Oligosaccharyltransferase Function
  - pathophysiology#Multisystem Glycoprotein Dysfunction
  rationale: >-
    The evidence that OST48 is needed for OST activity comes from the yeast
    orthologue WBP1, and the human evidence is limited to reduced glycosylation
    of a few marker proteins in patient fibroblasts. No study has measured OST
    complex assembly or STT3A- versus STT3B-dependent site occupancy in
    DDOST-deficient human cells, and none of the cited sources describes an
    animal or iPSC-derived neural model of DDOST-CDG, so the step from hypoglycosylation
    to the tissue phenotypes is general CDG-I reasoning.

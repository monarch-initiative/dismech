    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic DDOST variants, either homozygous or
    compound heterozygous with each allele inherited from a parent.
    Heterozygous carriers are reported to be unaffected.
  evidence:
  - reference: PMID:41392699
    reference_title: "DDOST-Congenital Disorder of Glycosylation: Defining the Clinical
      Spectrum and First Report of a Structural Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both were absent from population databases and classified as pathogenic
      or likely pathogenic, consistent with autosomal recessive inheritance."
    explanation: Compound heterozygous variants inherited one from each parent, consistent
      with recessive inheritance.
  - reference: CGGV:assertion_e0605b51-70c5-42ee-81b5-d45bb0b1fdab-2023-11-15T170000.000Z
    reference_title: "DDOST / DDOST-congenital disorder of glycosylation (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The disease mechanism appears to be biallelic loss of function. Heterozygous
      carriers are reportedly unaffected."
    explanation: ClinGen expert panel summary stating the biallelic mechanism and
      unaffected carriers.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 report described its patient as the fourth, counting three earlier
    published patients. The ClinGen curation counts four probands across four
    publications, one of whom (a 65-year-old woman in a CDG liver natural
    history cohort) is not among the three counted in 2026, and a further
    patient with humoral immune deficiency was reported in 2023. Whether these
    reports overlap is not stated in the available text, so the total is
    roughly five to six published individuals. No population prevalence has
    been measured.
  evidence:
  - reference: PMID:41392699
    reference_title: "DDOST-Congenital Disorder of Glycosylation: Defining the Clinical
      Spectrum and First Report of a Structural Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in the DDOST gene, encoding a non-catalytic subunit
      of the oligosaccharyltransferase (OST) complex, underlie an ultra-rare CDG subtype
      with only three patients reported to date"
    explanation: States the published case count before this report.
  - reference: CGGV:assertion_e0605b51-70c5-42ee-81b5-d45bb0b1fdab-2023-11-15T170000.000Z
    reference_title: "DDOST / DDOST-congenital disorder of glycosylation (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in this gene have been reported in at least 4 probands from
      4 publications (PMIDs 22305527, 33413482, 34462534, 36214423)."
    explanation: ClinGen proband count, which includes a patient from a CDG liver
      cohort not counted in the 2026 review.
- population: Worldwide

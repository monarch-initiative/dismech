name: DDOST-Congenital Disorder of Glycosylation
creation_date: "2026-11-16T14:25:26Z"
category: Mendelian
description: >-
  DDOST-congenital disorder of glycosylation (DDOST-CDG, CDG-Ir) is an
  ultra-rare autosomal recessive type I congenital disorder of N-linked
  glycosylation caused by biallelic pathogenic variants in DDOST. DDOST
  encodes OST48, a non-catalytic core subunit of the endoplasmic reticulum
  oligosaccharyltransferase (OST) complex, which transfers the preassembled
  dolichol-linked oligosaccharide onto asparagine residues of nascent
  polypeptides. Loss of OST48 function leaves N-glycosylation sites
  unoccupied, giving a type I serum transferrin pattern and reduced
  glycosylation of cellular glycoproteins in patient fibroblasts, which is
  restored by wild-type DDOST cDNA. Only a handful of patients have been
  published. The reported picture is a multisystem disorder with
  developmental delay, hypotonia, failure to thrive and feeding difficulty,
  strabismus and other eye findings, and variable hepatic dysfunction,
  ranging to a milder adolescent presentation dominated by a progressive
  movement disorder (opsoclonus, myoclonus, ataxia, tremor and dystonia).
  None of the cited reports describes a disease-specific therapy.

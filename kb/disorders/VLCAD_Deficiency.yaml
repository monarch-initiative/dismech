name: Very Long-Chain Acyl-CoA Dehydrogenase Deficiency
category: Mendelian
creation_date: '2026-02-23T23:04:38Z'
synonyms:
- VLCAD deficiency
- VLCADD
- ACADVL deficiency
- Very long-chain acyl-coenzyme A dehydrogenase deficiency
description: 'Very long-chain acyl-CoA dehydrogenase deficiency (VLCADD) is an autosomal recessive inborn error of mitochondrial long-chain fatty acid beta-oxidation caused by biallelic pathogenic variants in ACADVL. VLCAD catalyzes the first dehydrogenation step in the beta-oxidation spiral for long-chain acyl-CoAs (C12-C20). Deficient oxidation leads to energy failure during fasting or catabolic stress, accumulation of long-chain acylcarnitines, and impaired ketogenesis, with clinical manifestations ranging from severe neonatal cardiomyopathy and multiorgan failure to childhood hypoketotic hypoglycemia to later-onset exercise-induced rhabdomyolysis. A 2025 review estimates that VLCADD affects 1 to 2 individuals per 100,000.

  '

progression:
- notes: 'Catabolic triggers increase reliance on fatty-acid oxidation. Clinical presentations range from severe early cardiac and multiorgan disease to childhood hepatic/hypoketotic episodes and later episodic myopathy. The reviewed sources separately establish the primary FAO block, abnormal metabolites, secondary OXPHOS effects, and stress-dependent cellular phenotypes; they do not establish a single evidenced causal chain from each cellular branch to every clinical manifestation.'
notes: 'Genotype-phenotype prediction in VLCAD deficiency is imperfect. Functional testing (residual enzyme activity) and the C14:1 newborn-screening value can aid stratification and initial management. With expanded newborn screening, milder phenotypes are increasingly detected, so biochemical and molecular confirmation remains important.

  '
discussions:
- discussion_id: gap_vlcad_cellular_branches_to_clinical_subtypes
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How much do secondary OXPHOS dysfunction, oxidative stress, abnormal lipid
    handling, and attenuated TLR4 responses contribute to the cardiac, hepatic,
    and myopathic VLCAD presentations in humans?
  attaches_to:
  - pathophysiology#Secondary mitochondrial dysfunction and OXPHOS impairment
  - pathophysiology#Oxidative stress and glutathione vulnerability
  - pathophysiology#Long-chain lipid metabolite accumulation
  - pathophysiology#Attenuated TLR4 inflammatory response
  rationale: >-
    The primary ACADVL/FAO defect and three clinical presentations are
    established, but the secondary branches are supported by reviews, patient
    fibroblasts, targeted cell perturbation, metabolomics, and mouse work rather
    than direct causal tests in affected human heart, liver, or skeletal muscle.
  proposed_experiments:
  - experiment_id: exp_vlcad_isogenic_multilineage_rescue
    name: Isogenic ACADVL rescue across cardiac, hepatic, and skeletal-muscle models
    description: >-
      Compare patient-derived and corrected iPSC cardiomyocytes, hepatocytes,
      and myotubes under matched catabolic stress, measuring FAO flux, OXPHOS,
      lipid species, glutathione, cytokine responses, and cell injury.
  - experiment_id: exp_vlcad_branch_specific_perturbation
    name: Branch-specific rescue of VLCAD cellular phenotypes
    description: >-
      Rescue lipid balance, redox capacity, or OXPHOS independently to determine
      which interventions prevent lineage-specific injury without restoring
      ACADVL itself.
  evidence:
  - reference: PMID:40149952
    reference_title: "The Pathogenesis of Very Long-Chain Acyl-CoA Dehydrogenase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is growing evidence that other aspects of mitochondrial function are
      also affected in VLCADD, including secondary defects in OXPHOS function.
    explanation: Frames the secondary mitochondrial branch as growing rather than definitive evidence.
review_notes: >-
  The 2026 review removed disease-wide phenotype frequency bands that were
  inferred from subtype prose, an adult FAOD cohort, or single cases rather than
  measured for VLCAD deficiency as a whole. The causal graph now contains only
  evidence-backed edges: the ACADVL enzyme defect connects to the primary FAO
  block, secondary OXPHOS, oxidative-stress, and immunometabolic findings, while
  six defining clinical manifestations connect through explicitly unknown
  intermediates. Rare or case-level phenotypes remain observational rather than
  being forced downstream of a generic energy-deficit node. Pure diagnostic
  readouts remain in the biochemical `readouts` structure instead of duplicate
  causal arrows. Newborn screening was moved from treatments into a three-step
  diagnosis section; the unsupported “more than 400 variants” and mRNA-therapy
  claims were removed; prevalence was replaced with an evidence-backed 1–2 per
  100,000 range; and triheptanoin wording was narrowed to the retained human
  review and knockout-mouse evidence. Patient-fibroblast, targeted ACADVL-loss,
  and VLCAD-knockout mouse models are now structured explicitly. No new
  reference cache was created or edited.
  No differential diagnosis or disease-specific dataset was added because the
  retained cached sources do not provide a precise, directly quotable basis for
  either section.

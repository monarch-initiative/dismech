treatments:
- name: Long-chain-triglyceride-restricted, medium-chain-triglyceride-supplemented diet
  description: >
    Restricting long-chain triglycerides reduces the substrate load on the
    blocked CPT1-dependent import step, while medium-chain triglycerides bypass
    CPT1 and provide mitochondrial acetyl-CoA directly. This dietary
    combination is the mainstay of management and has been shown to improve
    left ventricular function; deterioration on reducing MCT intake and
    recovery on reinstating it provide within-patient support for the
    mechanism.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Malonyl-CoA-Mediated Inhibition of Mitochondrial Fatty Acid Oxidation
    treatment_effect: BYPASSES
    description: >-
      Medium-chain fatty acids enter mitochondria independently of the
      CPT1-dependent step that accumulated malonyl-CoA blocks, restoring
      mitochondrial acetyl-CoA supply.
  evidence:
  - reference: PMID:20549361
    reference_title: "Use of a long-chain triglyceride-restricted/medium-chain triglyceride-supplemented diet in a case of malonyl-CoA decarboxylase deficiency with cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case of malonic aciduria with cardiomyopathy demonstrates improvement in cardiac function attributable to LCT-restricted/MCT-supplemented diet."
    explanation: Direct clinical evidence that the LCT-restricted/MCT-supplemented diet improves cardiac function.
  - reference: PMID:20549361
    reference_title: "Use of a long-chain triglyceride-restricted/medium-chain triglyceride-supplemented diet in a case of malonyl-CoA decarboxylase deficiency with cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During a period of low MCT intake, her cardiac function was noted to deteriorate."
    explanation: Within-patient withdrawal and reinstatement supports a causal dietary effect on cardiac function.
  - reference: PMID:22778304
    reference_title: "Malonyl coenzyme A decarboxylase deficiency: early dietary restriction and time course of cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Left ventricular noncompaction development was not prevented by dietary interventions."
    explanation: >-
      Qualifies the dietary benefit — diet improved echocardiographic findings
      but did not prevent development of left ventricular non-compaction in
      this newborn-screened infant.
- name: Levocarnitine supplementation
  description: >
    L-carnitine is given alongside the modified diet, both to support
    conjugation and excretion of accumulated malonyl-CoA as malonylcarnitine
    and to correct secondary carnitine depletion. The combination of modified
    diet plus levocarnitine improved left ventricular systolic function in most
    reviewed patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levocarnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
  target_mechanisms:
  - target: Malonyl-CoA Accumulation
    treatment_effect: INHIBITS
    description: >-
      Carnitine supports formation and excretion of malonylcarnitine, providing
      an alternative disposal route for accumulated malonyl groups without
      correcting the primary enzyme defect.
  evidence:
  - reference: PMID:37979716
    reference_title: "Cardiovascular involvement in later-onset malonyl-CoA decarboxylase deficiency: Case studies and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A modified diet combined with levocarnitine supplementation resulted in the improvement of LV systolic function in most cases."
    explanation: Systematic-review evidence that diet plus levocarnitine improves left ventricular systolic function.
  - reference: PMID:39069445
    reference_title: "Clinical, biochemical and genetic characteristics and long-term follow-up of five patients with malonyl-CoA decarboxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A high-medium-chain triglyceride and low-long-chain triglyceride diet supplemented with L-carnitine was effective in most patients and may improve cardiomyopathy and muscle weakness."
    explanation: Cohort follow-up supporting the diet-plus-carnitine regimen for cardiomyopathy and muscle weakness.
- name: ACE inhibitor therapy for cardiomyopathy
  description: >
    Standard heart-failure pharmacotherapy is added when ventricular function
    deteriorates. Angiotensin-converting enzyme inhibition, combined with
    further dietary adjustment, improved echocardiographic findings in reported
    patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
  target_mechanisms:
  - target: Cardiomyopathy and Ventricular Dysfunction

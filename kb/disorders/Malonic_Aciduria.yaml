      snippet: "Cells with increased lysine malonylation displayed impaired mitochondrial function and fatty acid oxidation, suggesting that lysine malonylation plays a role in pathophysiology of malonic aciduria."
      explanation: Supports a feed-forward contribution of protein malonylation to the fatty-acid-oxidation defect.

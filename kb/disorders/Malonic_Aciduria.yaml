- name: Malonyl-CoA-Mediated Inhibition of Mitochondrial Fatty Acid Oxidation
  biological_scale: CELLULAR
  description: >
    Accumulated cytosolic malonyl-CoA inhibits carnitine palmitoyltransferase 1
    at the outer mitochondrial membrane, restricting entry of long-chain
    acyl-CoA into the mitochondrion and suppressing beta-oxidation. The
    resulting bioenergetic deficit is most consequential in cardiac and
    skeletal muscle, which express MLYCD most highly and derive much of their
    ATP from fatty-acid oxidation, and it explains why malonic aciduria
    phenocopies several features of the classical fatty-acid oxidation
    disorders.
  molecular_functions:
  - preferred_term: carnitine O-palmitoyltransferase activity
    term:
      id: GO:0004095
      label: carnitine O-palmitoyltransferase activity
    modifier: DECREASED

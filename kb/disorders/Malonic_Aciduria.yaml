mechanistic_hypotheses:
- hypothesis_group_id: lysine_malonylation_arm
  hypothesis_label: Protein lysine malonylation as a pathogenic amplifier
  status: EMERGING
  description: >
    Beyond CPT1 inhibition, accumulating malonyl-CoA malonylates lysine
    residues on mitochondrial and metabolic proteins. The hypothesis holds that
    this post-translational modification is itself pathogenic, further
    impairing mitochondrial function and fatty-acid oxidation and thereby
    amplifying the primary block. Support is currently limited to proteomic and
    functional work in MCD-deficient fibroblasts; the modification has not been
    shown to drive disease in patient heart or brain tissue.
  evidence:
  - reference: PMID:26320211
    reference_title: "Proteomic and Biochemical Studies of Lysine Malonylation Suggest Its Malonic Aciduria-associated Regulatory Role in Mitochondrial Function and Fatty Acid Oxidation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our study establishes an association between Kmal and a genetic disease and offers a rich resource for elucidating the contribution of the Kmal pathway and malonyl-CoA to cellular physiology and human diseases."
    explanation: The authors frame the lysine-malonylation link to malonic aciduria as an association requiring further elucidation, matching an EMERGING status.
discussions:
- discussion_id: mlycd_malonylation_model_fidelity
  prompt: >-
    Does the lysine-malonylation arm demonstrated in MCD-deficient fibroblasts
    operate in the human tissues that actually fail in malonic aciduria — heart
    and brain?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Protein Lysine Malonylation
  rationale: >-
    The proteomic and functional evidence for pathogenic lysine malonylation
    comes entirely from cultured MCD-deficient fibroblasts, a cell type that is
    not clinically affected and that relies little on fatty-acid oxidation. The
    disease burden falls on cardiomyocytes and the developing brain, where
    malonyl-CoA concentrations, demalonylase (SIRT5) activity, and the relevant
    substrate proteome may differ substantially. Whether malonylation is a
    driver or an epiphenomenon of the fibroblast model therefore remains open,
    and it matters therapeutically: a demalonylation-directed strategy only
    makes sense if the modification is pathogenic in the target organs.
  proposed_experiments:
  - experiment_id: mlycd_kmal_target_tissue_proteomics
    name: Lysine-malonylome of MLYCD-deficient heart and brain
    description: >-
      Quantify the lysine-malonylome of myocardium and, where available,
      post-mortem brain from MLYCD-deficient patients or an MLYCD-null animal
      model, and compare site occupancy with the published fibroblast data.
    decision_criterion: >-
      Substantial overlap of hyper-malonylated mitochondrial fatty-acid
      oxidation enzymes between target tissue and fibroblasts would support
      translational validity; a largely non-overlapping profile would argue the
      fibroblast result is model-specific.
  - experiment_id: mlycd_sirt5_rescue_cardiomyocytes
    name: SIRT5 rescue in MLYCD-null cardiomyocytes
    description: >-
      Test whether restoring demalonylation capacity (e.g. SIRT5
      overexpression) rescues fatty-acid oxidation and contractile function in
      MLYCD-null iPSC-derived cardiomyocytes, separating the malonylation arm
      from direct malonyl-CoA inhibition of CPT1.
    decision_criterion: >-
      Functional rescue without lowering malonyl-CoA would establish
      malonylation as an independent pathogenic arm; absence of rescue would
      place the burden of causation on CPT1 inhibition alone.
  evidence:
  - reference: PMID:26320211
    reference_title: "Proteomic and Biochemical Studies of Lysine Malonylation Suggest Its Malonic Aciduria-associated Regulatory Role in Mitochondrial Function and Fatty Acid Oxidation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified 461 Kmal sites showing more than a 2-fold increase in response to MCD deficiency as well as 1452 Kmal sites detected only in MCD-/- fibroblast but not MCD+/+ cells, suggesting a pathogenic role of Kmal in MCD deficiency."
    explanation: The malonylation evidence base is entirely fibroblast-derived, which is precisely the translational mismatch this discussion records.

  Newborn screening and the biochemical and molecular confirmation pathway are
  modelled under diagnosis. The reported case of maternal uniparental
  isodisomy of the telomeric end of chromosome 16
  (PMID:17535268) is a notable genetic mechanism but that abstract was not
  fetched in this pass, so it is not cited. PMID:31395333 (nine-patient cohort,

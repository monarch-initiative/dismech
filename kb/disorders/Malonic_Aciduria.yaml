    conjugated to the diagnostic derivatives malonic acid and malonylcarnitine.
    The accumulating thioester is not merely a marker: it is the physiological
    regulator whose excess produces the downstream disease, both by inhibiting
    mitochondrial fatty-acid uptake and by driving protein lysine malonylation.

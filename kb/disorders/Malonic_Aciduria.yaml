pathophysiology:
- name: Malonyl-CoA Decarboxylase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  description: >
    Biallelic loss-of-function MLYCD variants — nonsense, frameshift,
    splice-altering, whole-exon deletion, and missense alleles — abolish or
    severely reduce malonyl-CoA decarboxylase activity. MCD normally catalyses
    the conversion of malonyl-CoA to acetyl-CoA and CO2 in the cytosol,
    peroxisome, and mitochondrion, so its loss removes the principal route of
    malonyl-CoA disposal.

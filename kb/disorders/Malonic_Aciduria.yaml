  WP-001 (IEMbase metabolic) new-entry increment for issue 5556, row 1.2.23.01
  (MLYCD / OMIM:248360 / ORPHA:943), following Carbonic_Anhydrase_VA_Deficiency
  (row 1.1.09.01) and 3-Methylglutaconic_Aciduria_Type_I (row 1.2.12.01). The
  WP-001 seed table short-alias-matched MLYCD to Migraine_with_Aura; that match
  was confirmed to be a false positive (an unrelated channelopathy entry) and
  discarded, so this is a genuinely new entry rather than an edit.

  NEC preflight passed: MONDO:0009556 "malonic aciduria" names malonyl-CoA
  decarboxylase in its Orphanet-sourced definition, carries OMIM:248360 and
  Orphanet:943 xrefs matching the seed row, lists "malonyl-CoA decarboxylase
  deficiency" as an exact synonym, and asserts RO:0004003 to HGNC:7150 (MLYCD)

name: Malonic Aciduria
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- Malonyl-CoA decarboxylase deficiency
- MLYCD deficiency
- MCD deficiency
- MLYCDD
- Malonic acidemia
description: >
  Malonic aciduria is an ultra-rare autosomal recessive organic aciduria caused
  by biallelic loss-of-function variants in MLYCD, which encodes malonyl-CoA
  decarboxylase (MCD). MCD catalyses the conversion of malonyl-CoA to
  acetyl-CoA and CO2, and its loss allows malonyl-CoA to accumulate. Because
  cytosolic malonyl-CoA is the physiological inhibitor of carnitine
  palmitoyltransferase 1, its accumulation restricts mitochondrial long-chain
  fatty-acid uptake and beta-oxidation, so the disorder behaves biochemically
  like a hybrid of an organic aciduria and a fatty-acid oxidation defect. A
  second, non-canonical arm has been proposed in which excess malonyl-CoA
  drives protein lysine malonylation, itself impairing mitochondrial function
  and fatty-acid oxidation. Heart and skeletal muscle, which depend heavily on
  fatty-acid oxidation and express MLYCD most highly, are the principal
  targets: cardiomyopathy (most often dilated) is the leading cause of
  morbidity and mortality. Most patients present in the first months of life
  with developmental delay, hypotonia, seizures, metabolic acidosis,
  hypoglycaemia, and failure to thrive; a later-onset phenotype limited to
  cardiomyopathy has been described in adults. Elevated urinary malonic acid
  and plasma malonylcarnitine are the constant biochemical markers. A
  long-chain-triglyceride-restricted, medium-chain-triglyceride-supplemented
  diet with levocarnitine supplementation is the mainstay of treatment and can
  improve left ventricular function.
classifications:
  icimd_category:
  - classification_value: organic_acidurias
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Organic acidurias"
      under category "Disorders of amino acid metabolism". MONDO:0009556 is
      classified is_a MONDO:0000688 "inborn organic aciduria". The disorder
      also has substantial mechanistic overlap with the ICIMD group
      "Mitochondrial fatty acid oxidation" because accumulating malonyl-CoA
      inhibits carnitine palmitoyltransferase 1; only the primary
      organic-aciduria assignment is recorded here.

      explanation: States the autosomal recessive inheritance of MCD deficiency.
  relationship_type: CAUSATIVE
  features: >
    Reported pathogenic MLYCD alleles span nonsense (S148X, p.Gln116*,
    p.Arg310*), frameshift (c.947-948delTT, c.60delG), splice-altering
    (IVS4-14A>G, creating a novel splice acceptor), start-loss (p.M1K),
    missense (p.H152N, p.Ser241Pro, p.Trp431Cys), and multi-exon deletion
    (exons 4-5) changes. Genotype-phenotype correlation is poor, and the same
    homozygous genotype has produced markedly different clinical courses within
    a single consanguineous family.

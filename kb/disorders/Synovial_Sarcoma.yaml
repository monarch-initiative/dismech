genetic:
- name: SS18
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: SS18
    term:
      id: hgnc:11340
      label: SS18
  notes: >-
    The 5-prime partner of the t(X;18) translocation, formerly named SYT. SS18
    encodes a subunit of the BAF (SWI/SNF) chromatin remodelling complex, and it
    is through that subunit slot that the fusion protein enters the complex.
  evidence:
  - reference: PMID:15208645
    reference_title: "A novel FISH assay for SS18-SSX fusion type in synovial sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It produces three types of fusion gene formed in part by SS18 from chromosome 18 and by SSX1, SSX2 or, rarely, SSX4 from the X chromosome."
    explanation: >-
      Names SS18 as a partner of the defining translocation.
- name: SSX1
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: SSX1
    term:
      id: hgnc:11335
      label: SSX1
  notes: >-
    The most frequent 3' partner. In the largest series reporting the split, SYT-SSX1 was found in 147 of 243 tumours (61%) and SYT-SSX2 in 91 (37%); the same series found a strong association of fusion type with morphology, almost all biphasic tumours carrying SYT-SSX1.
  evidence:
  - reference: PMID:15208645
    reference_title: "A novel FISH assay for SS18-SSX fusion type in synovial sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It produces three types of fusion gene formed in part by SS18 from chromosome 18 and by SSX1, SSX2 or, rarely, SSX4 from the X chromosome."
    explanation: >-
      Names SSX1 as a partner of the defining translocation.
  - reference: PMID:11782370
    reference_title: >-
      Impact of SYT-SSX fusion type on the clinical behavior of synovial
      sarcoma: a multi-institutional retrospective study of 243 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SYT-SSX1 and SYT-SSX2 fusions were detected in 147 tumors (61%) and 91
      tumors (37%), respectively.
    explanation: >-
      The largest series reporting the partner split, and the source of the
      figures quoted in the fusion notes below.
  - reference: PMID:11782370
    reference_title: >-
      Impact of SYT-SSX fusion type on the clinical behavior of synovial
      sarcoma: a multi-institutional retrospective study of 243 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among other comparisons, there was a strong association of fusion type and
      morphology (P < 0.001), with almost all of the SYT-SSX2 tumors showing
      absence of glandular differentiation (monophasic histology) and almost all
      of the biphasic tumors containing SYT-SSX1.
    explanation: >-
      Sources the fusion-type/histology association stated in the notes on this
      record and on the SSX2 record.
- name: SSX2
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: SSX2
    term:
      id: hgnc:11336
      label: SSX2
  notes: >-
    The second 3-prime partner, found in 91 of 243 tumours (37%) in the largest
    series reporting the split, where it was associated with monophasic
    histology and with better overall survival. The survival association is
    contested and both sides are cited on this record: a meta-analysis of ten
    studies and 902 patients found no difference by fusion partner in either
    overall survival or disease-specific survival. The histology association is
    the better-replicated of the two.
  evidence:
  - reference: PMID:15208645
    reference_title: "A novel FISH assay for SS18-SSX fusion type in synovial sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It produces three types of fusion gene formed in part by SS18 from chromosome 18 and by SSX1, SSX2 or, rarely, SSX4 from the X chromosome."
    explanation: >-
      Names SSX2 as a partner of the defining translocation.
  - reference: PMID:11782370
    reference_title: >-
      Impact of SYT-SSX fusion type on the clinical behavior of synovial
      sarcoma: a multi-institutional retrospective study of 243 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall survival was significantly better among SYT-SSX2 cases (P = 0.03),
      among cases localized at diagnosis (P < 0.0001), and among patients with
      primary tumors < 5 cm in greatest dimension (P = 0.01).
    explanation: >-
      The single-series survival association stated in the note on this record.
  - reference: PMID:26217552
    reference_title: >-
      Prognostic value of SS18-SSX fusion type in synovial sarcoma; systematic
      review and meta-analysis.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled HR for eight eligible studies evaluating for OS or DSS was 1.28
      (95% confidence interval: 0.81-2.00), suggesting no significant difference
      between SS18-SSX1 and SS18-SSX2 (P = 0.29).
    explanation: >-
      A meta-analysis of 10 studies and 902 patients finds no overall-survival
      difference by fusion partner, contradicting the single-series survival
      association quoted above. Both are recorded so the contest is visible.
  - reference: PMID:26217552
    reference_title: >-
      Prognostic value of SS18-SSX fusion type in synovial sarcoma; systematic
      review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SS18-SSX (formerly called SYT-SSX) fusion gene has been established
      clinically as a molecular diagnostic test for synovial sarcoma, but the
      prognostic value of the fusion gene variant for survival is controversial.
    explanation: >-
      Sources both the SYT-SSX naming history recorded on the SS18 record and
      the statement that the prognostic claim is controversial.

stages:
- name: Localized Synovial Sarcoma
  description: >-
    Primary disease confined to the local soft tissue compartment without
    distant metastasis at presentation, managed primarily with wide surgical
    resection and perioperative radiotherapy.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1123464
    reference_title: Emerging targeted and cellular therapies in the treatment of advanced and metastatic synovial sarcoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Epidemiologic studies have found that most patients are diagnosed with local disease while 10-13% of patients initially present with metastatic disease"
    explanation: Establishes localized presentation as the predominant initial stage.
  - reference: DOI:10.3389/fonc.2023.1123464
    reference_title: Emerging targeted and cellular therapies in the treatment of advanced and metastatic synovial sarcoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For localized cases of SYN, initial therapy is most commonly surgical resection with or without radiation therapy."
    explanation: Defines standard multimodal local management for localized disease.
- name: Advanced or Metastatic Synovial Sarcoma
  description: >-
    Locally unresectable or distantly metastatic disease, most frequently
    involving the lungs, associated with poor long-term survival and managed
    with systemic anthracycline-based chemotherapy, pazopanib, or antigen-targeted
    cellular therapy.
  evidence:
  - reference: DOI:10.3389/fonc.2023.1123464
    reference_title: Emerging targeted and cellular therapies in the treatment of advanced and metastatic synovial sarcoma
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Currently, standard treatment of advanced and metastatic synovial sarcoma is anthracycline-based chemotherapy. While advanced synovial sarcoma is more responsive to chemotherapy compared to other soft tissue sarcomas, survival rates are poor, with a median survival time of less than 18 months."
    explanation: Characterizes the clinical course and systemic management of advanced and metastatic synovial sarcoma.
has_subtypes:
- name: Biphasic Synovial Sarcoma
  description: >-
    Contains both epithelial and spindle cell components with distinct glandular
    or epithelial differentiation. Accounts for approximately 20-30% of cases.
- name: Monophasic Synovial Sarcoma
  description: >-
    Composed predominantly of spindle cells without obvious epithelial component.
    The most common subtype, accounting for 50-60% of cases. Can be more difficult
    to diagnose histologically.
- name: Poorly Differentiated Synovial Sarcoma
  description: >-
    High-grade variant with round cell or epithelioid morphology. Associated
    with more aggressive behavior and worse prognosis.
pathophysiology:
- name: SS18-SSX Fusion Oncogene
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    The t(X;18)(p11;q11) translocation fuses the SS18 gene on chromosome 18 to
    one of three SSX genes (SSX1, SSX2, or rarely SSX4) on the X chromosome in
    a permissive mesenchymal progenitor population. The SS18-SSX fusion protein
    disrupts the BAF (SWI/SNF) chromatin remodeling complex, leading to aberrant
    transcriptional regulation and epigenetic reprogramming.
  cell_types:
  - preferred_term: mesenchymal stem/progenitor cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  evidence:
  - reference: PMID:32092619
    reference_title: "An evidence-based guideline on the application of molecular testing in the diagnosis, prediction of prognosis, and selection of therapy in non-GIST soft tissue sarcomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SS18 (SYT) break-apart by FISH or SS18-SSX (SYT-SSX) fusion by reverse transcription-polymerase chain reaction is recommended as a sensitive and specific test to differentiate patients with synovial sarcoma from other sarcomas."
    explanation: "Supports the presence of SS18-SSX fusions as a defining feature of synovial sarcoma."
  - reference: PMID:31681608
    reference_title: "Epigenetic Targets in Synovial Sarcoma: A Mini-Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is characterized by the recurrent pathognomonic chromosomal translocation t(X;18)(p11.2;q11.2) that most frequently fuses SSX1 or SSX2 genes with SS18."
    explanation: "Confirms the SS18-SSX fusion as the pathognomonic translocation defining synovial sarcoma."
  - reference: PMID:31681608
    reference_title: "Epigenetic Targets in Synovial Sarcoma: A Mini-Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "SS18 functions as a co-activator of transcription, however the SSX proteins have been shown to moderate repression, allowing the oncoprotein the ability to activate and repress gene expression."
    explanation: "Supports the transcription coregulator activity of the SS18 and SSX fusion partners."
  - reference: DOI:10.1038/s41388-025-03547-1
    reference_title: "Molecular and epigenetic oncogenesis in synovial sarcoma: implications for cancer biology, diagnosis and treatment"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hill et al. provide evidence supporting a mesenchymal stromal cell progenitor for SS"
    explanation: "Summarizes mouse-model evidence supporting a mesenchymal stromal/progenitor cell of origin for SS18-SSX transformation."
  notes: >-
    The exact cell of origin of synovial sarcoma remains debated in the
    literature: mouse lineage-tracing models support mesenchymal stromal/stem
    progenitors (such as Hic1+/Pdgfra+ fibroblastic progenitors, bound here via
    CL:0000134), whereas other experimental and immunohistochemical studies have
    proposed Myf5-lineage myoblasts or multipotent progenitors with epithelial
    and neural differentiation potential.

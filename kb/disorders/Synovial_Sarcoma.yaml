- name: BCL2- and MCL1-Mediated Apoptosis Resistance
  biological_scale: CELLULAR
  conforms_to: resisting_cell_death#Impaired Apoptotic Execution and Cell Survival
  description: >-
    Synovial sarcoma cells characteristically express high levels of the
    antiapoptotic protein BCL-2 alongside cooperative MCL-1 survival protection,
    blunting intrinsic mitochondrial apoptosis; whereas BCL-2 inhibition with
    venetoclax alone is insufficient because of MCL-1 compensation, co-targeting
    MCL-1 sensitizes synovial sarcoma cells to apoptotic cell death.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process

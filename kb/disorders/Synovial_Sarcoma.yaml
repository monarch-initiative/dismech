- accession: ega:EGAS00001004158
  title: Molecular determinants for sensitivity to pazopanib in leiomyosarcoma, synovial sarcoma, and angiosarcoma.
  description: Pazopanib is a tyrosine kinase inhibitor with highest activity against VEGFR1 (FLT1) and VEGFR2 (KDR) along with other targets including VEGFR3, PDGFRa, PDGFRb, cKIT, FGFR1, FGFR3, FGFR4, FAK, ABL1, JNK1, Tie-2, Met, IGF1R, and EGFR (Lee, Jones, and Huang Signal Transduct Target Ther 2019; 4:16). Its initial activity in soft tissue sarcoma (STS) was described by Sleijfer et al. (2009) where a high proportion of leiomyosarcoma (LMS) (44%) and synovial sarcoma (49%) patients remained without progression at 12 weeks.

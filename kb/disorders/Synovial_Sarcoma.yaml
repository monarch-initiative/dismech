datasets:
- accession: ega:EGAS00001002637
  title: HDAC inhibitors in synovial sarcoma cells
  description: Histone deacetylase (HDAC) inhibition has been shown in previous studies to disrupt the synovial sarcoma oncoprotein complex, resulting in apoptosis. To understand the molecular effects of HDAC inhibition, RNA-Seq transcriptome analysis was undertaken in six human synovial sarcoma cell lines. HDAC inhibition induced pathways of cell cycle arrest, neuronal differentiation and response to oxygen-containing species, effects also observed in other cancers treated with this class of drugs. More specific to synovial sarcoma, polycomb-group targets were reactivated including tumor suppressor CDKN2A, and pro-apoptotic transcriptional patterns were induced.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Synovial Sarcoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001002920
  title: SS18-SSX-mediated hijacking of BAF complexes drives synovial sarcoma
  description: 'Synovial sarcoma (SS) is defined by a recurrent t(x;18) chromosomal translocation, which produces the hallmark SS18-SSX oncogenic fusion. Incorporation of SS18-SSX into BAF complexes renders BAF complexes aberrant in two distinct manners: the addition of 78aa of SSX onto SS18, and concomitant loss of BAF47 assembly. However, the importance and functional contributions of each of these perturbations on BAF complex targeting and gene expression regulation remain unclear. Here we use an integrative set of genomic approaches in human cancer cell lines and primary tumor samples to define the mechanistic consequences of the SS18-SSX fusion oncoprotein.'

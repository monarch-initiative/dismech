- accession: ega:EGAS50000000973
  title: Multi-omics bulk and single-cell profiling of epithelioid sarcoma
  description: 'Epithelioid sarcoma (EpS) is an aggressive sarcoma, characterized by the loss of SMARCB1 expression. EpS is traditionally classified as distal or proximal according to clinicopathological features, but its molecular characteristics remain largely unknown. To establish an EpS molecular classification and uncover determinants of inter- and intra-patient heterogeneity in EpS, we used multi-omics profiling and integrated the genomic, transcriptional and methylome landscapes with single-cell RNA sequencing on fresh samples as well as spatial transcriptomics. We identified two molecular subtypes of EpS: “distal-like” and “proximal-like”, which were distinct from the histological subtypes.'

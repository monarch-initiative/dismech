name: Epithelioid Sarcoma
creation_date: '2026-06-17T00:00:00Z'
updated_date: '2026-11-12T00:00:00Z'
category: Neoplastic
description: >-
  Epithelioid sarcoma is an ultra-rare, aggressive soft-tissue sarcoma of uncertain
  differentiation characterized by epithelioid and spindled tumor cells co-expressing
  epithelial (cytokeratin, EMA) and mesenchymal markers. The defining molecular lesion
  in over 90% of cases is biallelic somatic inactivation of the SWI/SNF (cBAF/PBAF)
  core subunit SMARCB1 (INI1/BAF47), producing the diagnostic loss of nuclear INI1
  immunostaining and an oncogenic dependency on unopposed EZH2/PRC2 H3K27
  methyltransferase activity. Two clinicopathologic forms are recognized: the more
  common classic (distal) type, which typically arises in the distal extremities of
  adolescents and young adults as indolent dermal or subcutaneous nodules that often
  ulcerate, and the proximal (large-cell) type, which arises in deep axial, pelvic,
  and perineal soft tissues, frequently displays rhabdoid cytomorphology, and carries
  a worse prognosis. Unlike most soft-tissue sarcomas, epithelioid sarcoma exhibits a
  high propensity for regional lymph node metastasis alongside pulmonary spread. The
  selective oral EZH2 inhibitor tazemetostat is FDA-approved for advanced
  INI1-deficient epithelioid sarcoma.
synonyms:
- epithelioid cell sarcoma
- EpS
- INI1-deficient epithelioid sarcoma
- SMARCB1-deficient epithelioid sarcoma
categories:
- Soft Tissue Sarcoma
- Molecularly Defined Tumor
- SWI/SNF-Deficient Tumor
parents:
- Sarcoma
has_subtypes:
- name: Classic
  display_name: Classic (Distal) Type
  description: >-
    The classic or distal type is the more common form, typically arising in the
    distal upper extremity (hand, forearm) of adolescents and young adults as slowly
    growing dermal or subcutaneous nodules that may ulcerate and mimic a benign
    process or chronic ulcer.
  evidence:
  - reference: PMID:4014539
    reference_title: "Epithelioid sarcoma. Diagnosis, prognostic indicators, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A retrospective review of 241 cases of epithelioid sarcoma reaffirmed the propensity of this tumor to occur in the distal extremities of young adults."
    explanation: The Chase & Enzinger series confirms the classic (distal) type's predilection for the distal extremities of young adults.
- name: Proximal
  display_name: Proximal (Large-Cell) Type
  description: >-
    The proximal-type (large-cell) variant arises in deep axial soft tissues of the
    pelvis, perineum, genital tract, and trunk in older adults. It is composed of
    large epithelioid cells with prominent nucleoli and frequent rhabdoid features,
    behaves more aggressively, and carries a worse prognosis than the classic type.
  evidence:
  - reference: PMID:9042279
    reference_title: '"Proximal-type" epithelioid sarcoma, a distinctive aggressive neoplasm showing rhabdoid features. Clinicopathologic, immunohistochemical, and ultrastructural study of a series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to the conventional, \"distal-type\" epithelioid sarcoma, the proximal variant is characterized by a predominantly large-cell, epithelioid cytomorphology, marked cytologic atypia, frequent occurrence of rhabdoid features, and lack of a granuloma-like pattern in most cases. It appears to be somewhat more aggressive (or at least metastasizes earlier) than usual epithelioid sarcoma."
    explanation: The original clinicopathologic series defining proximal-type epithelioid sarcoma documents its large-cell epithelioid cytomorphology, rhabdoid features, and more aggressive behavior than the conventional distal type.
prevalence:
- population: United States (SEER)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_low: 0.03
  rate_high: 0.05
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    SEER registry data report a crude annual incidence rate of 0.03 to 0.05 per
    100,000 per year (0.3 to 0.5 per 1,000,000), concordant with Orphanet's US and
    European annual incidence estimate below 1 per 1,000,000.
  evidence:
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "EpS is an ultra-rare soft tissue sarcoma (prevalence of <2 per 100,000), with a crude incidence rate (IR) ranging from 0.03/100,000 to 0.05/100,000. According to the SEER database of almost 1,000 cases, EpS mostly affects the adult population, with a peak in the fifth decade of life (mean age at diagnosis: 46 years)( 10 )."
    explanation: Consensus review summarizing SEER population-based registry data (~1,000 cases) showing an annual crude incidence of 0.03 to 0.05 per 100,000 (<1 per 1,000,000).
  - reference: ORPHA:293202
    reference_title: "Epithelioid sarcoma"
    supports: SUPPORT

- name: Tazemetostat (EZH2 Inhibitor)
  description: >-
    Tazemetostat is an oral selective EZH2 methyltransferase inhibitor FDA-approved
    for adults and adolescents aged 16 years and older with metastatic or locally
    advanced INI1-deficient (SMARCB1-deficient) epithelioid sarcoma not eligible for
    complete resection, targeting the synthetic-lethal EZH2 dependency created by
    SMARCB1 loss.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tazemetostat
      term:
        id: CHEBI:231598
        label: tazemetostat
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: EZH2/PRC2 Dependency and H3K27 Hypermethylation
    treatment_effect: INHIBITS
    description: >-
      Tazemetostat selectively inhibits EZH2 catalytic methyltransferase activity,
      blocking the unopposed H3K27 trimethylation dependency that SMARCB1-deficient
      epithelioid sarcomas acquire when SWI/SNF antagonism of PRC2 is lost.
    evidence:
    - reference: PMID:33035459
      reference_title: "Tazemetostat in advanced epithelioid sarcoma with loss of INI1/SMARCB1: an international, open-label, phase 2 basket study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Over 90% of tumours have lost INI1 expression, leading to oncogenic dependence on the transcriptional repressor EZH2. In this study, we report the clinical activity and safety of tazemetostat, an oral selective EZH2 inhibitor, in patients with epithelioid sarcoma."
      explanation: Directly links oral selective EZH2 inhibition by tazemetostat to the oncogenic EZH2 dependency driven by INI1/SMARCB1 loss in epithelioid sarcoma.
  evidence:
  - reference: PMID:33035459
    reference_title: "Tazemetostat in advanced epithelioid sarcoma with loss of INI1/SMARCB1: an international, open-label, phase 2 basket study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the clinical activity and safety of tazemetostat, an oral selective EZH2 inhibitor, in patients with epithelioid sarcoma."
    explanation: This phase 2 basket study reports the clinical activity of the oral selective EZH2 inhibitor tazemetostat in INI1-negative epithelioid sarcoma, the basis for its FDA approval.
  - reference: PMID:33035459
    reference_title: "Tazemetostat in advanced epithelioid sarcoma with loss of INI1/SMARCB1: an international, open-label, phase 2 basket study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine (15% [95% CI 7-26]) of 62 patients had an objective response at data cutoff (Sept 17, 2018). At a median follow-up of 13·8 months (IQR 7·8-19·0), median duration of response was not reached (95% CI 9·2-not estimable)."
    explanation: Quantifies the 15% objective response rate and durable responses (median duration of response not reached) achieved with tazemetostat monotherapy in 62 patients with INI1-negative advanced epithelioid sarcoma.
- name: Doxorubicin-Based Systemic Chemotherapy
  description: >-
    Anthracycline-based cytotoxic chemotherapy (doxorubicin alone or in combination
    with ifosfamide or tazemetostat) is used as front-line systemic therapy for
    locally advanced unresectable or metastatic epithelioid sarcoma.
  notes: >-

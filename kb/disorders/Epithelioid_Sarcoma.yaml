progression:
- phase: Primary presentation and diagnostic delay
  age_range: Adolescents and adults (peak 20-50 years; mean age 35-46 years)
  notes: >-
    Distal-type tumors often grow slowly as painless superficial nodules or ulcers
    mistaken for benign inflammatory or infectious lesions, leading to diagnostic
    delays of up to 36 months; proximal-type tumors present as larger deep axial or
    perineal masses.
  evidence:
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Furthermore, due to frequent challenges in diagnosis, patients may experience long delays of up to 36 months until effective treatments can be administered, thus further lowering eventual treatment success( 3 , 4 )."
    explanation: Documents prolonged diagnostic delays up to 36 months following initial primary tumor presentation.
- phase: Local recurrence and regional nodal or pulmonary metastasis
  notes: >-
    Characterized by frequent local recurrence along fascial planes and tendon
    sheaths (up to 77% in historical surgical series) and metastatic dissemination
    (45%) preferentially involving regional lymph nodes (48%) and lungs (25%), with
    an overall 5-year relative survival of approximately 50% and potential for late
    relapse years after resection.
  evidence:
  - reference: PMID:4014539
    reference_title: "Epithelioid sarcoma. Diagnosis, prognostic indicators, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up data, available in 202 cases (84%), showed a 77% recurrence and a 45% metastatic rate. The most common initial sites of metastasis were lymph nodes (48%) and lungs (25%)."
    explanation: Quantifies local recurrence (77%) and metastatic progression (45%) to regional lymph nodes and lungs in 202 patients with follow-up.
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Overall, the prognosis of patients with EpS is poor, with a 5-year relative survival of 50% ( 5 , 8 , 12 )."
    explanation: Summarizes overall 5-year relative survival across clinical cohorts at 50%.
pathophysiology:
- name: SMARCB1 (INI1) Loss
  biological_scale: MOLECULAR
  node_class: PROTEIN_ABUNDANCE_LOSS
  gene:
    preferred_term: SMARCB1
    term:
      id: hgnc:11103
      label: SMARCB1
  genetic_context:
    variant_origin: SOMATIC
    allelic_hit_role: BIALLELIC_INACTIVATION
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Biallelic somatic inactivation of SMARCB1 (INI1/BAF47/SNF5), most commonly via
    homozygous 22q11.2 deletions, disables a core subunit of the canonical BAF (cBAF)
    and polybromo-associated BAF (PBAF) SWI/SNF chromatin-remodeling complexes. This
    is the defining molecular event in over 90% of both classic and proximal-type
    epithelioid sarcomas and produces the diagnostic loss of nuclear INI1
    immunostaining.
  notes: >-
    Epithelioid sarcoma is classified as a mesenchymal neoplasm of uncertain
    differentiation; its precise normal cell of origin and histogenesis remain
    unsettled beyond mesenchymal lineage (PMID:37916971), so cell_types binds
    generic mesenchymal cell (CL:0008019) rather than a committed progenitor or
    stem cell.
  cell_types:
  - preferred_term: mesenchymal cell of uncertain differentiation
    term:
      id: CL:0008019
      label: mesenchymal cell
  protein_complexes:
  - preferred_term: BAF complex
    term:
      id: GO:0016514
      label: SWI/SNF complex
  molecular_functions:
  - preferred_term: chromatin binding
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003682
      label: chromatin binding
  - preferred_term: transcription coregulator activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0003712
      label: transcription coregulator activity
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: ABNORMAL
    term:
      id: GO:0006338
      label: chromatin remodeling
  downstream:
  - target: EZH2/PRC2 Dependency and H3K27 Hypermethylation
    description: >-
      Loss of SWI/SNF antagonism of PRC2 leaves EZH2-driven H3K27 methylation
      unopposed, creating an oncogenic dependency.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:19033866
    reference_title: "Loss of INI1 expression is characteristic of both conventional and proximal-type epithelioid sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "similar to MRT of infancy, loss of INI1 expression is characteristic of both conventional and proximal-type ES, being detected in >90% of cases."
    explanation: Immunohistochemical study of 136 epithelioid sarcomas shows loss of INI1 (SMARCB1) expression in over 90% of both conventional and proximal-type cases, establishing SMARCB1 inactivation as the defining molecular lesion.
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SMARCB1 biallelic inactivation drives the pathogenesis of virtually all EpS. SMARCB1 encodes a subunit of two of the three SWI/SNF chromatin-remodeling complexes (canonical BAF (cBAF), polybromo-associated BAF (PBAF), but not non-canonical BAF (ncBAF)), which regulates gene transcription through nucleosomes modifications( 14 )."
    explanation: Consensus review establishes biallelic SMARCB1 inactivation and resulting loss of cBAF/PBAF nucleosome-remodeling transcriptional regulation as the central pathogenic driver of epithelioid sarcoma.
- name: EZH2/PRC2 Dependency and H3K27 Hypermethylation
  biological_scale: MOLECULAR
  node_class: EPIGENETIC
  description: >-
    SWI/SNF normally opposes Polycomb repressive complex 2 (PRC2) at enhancers and
    bivalent promoters. When SMARCB1 is lost, PRC2/EZH2 catalytic activity is
    unopposed, increasing trimethylation of histone H3 at lysine 27 (H3K27me3) and
    epigenetically repressing differentiation and tumor-suppressor genes.
    SMARCB1-deficient tumors acquire a synthetic-lethal dependency on EZH2 activity,
    forming the mechanistic basis for therapeutic EZH2 inhibition.
  molecular_functions:
  - preferred_term: histone H3K27 methyltransferase activity
    modifier: INCREASED
    term:
      id: GO:0046976
      label: histone H3K27 methyltransferase activity
  biological_processes:
  - preferred_term: negative regulation of gene expression, epigenetic
    modifier: INCREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  downstream:
  - target: Aberrant Proliferation and Blocked Differentiation
    description: >-
      Unopposed PRC2 repression and reduced enhancer occupancy by residual SWI/SNF
      complexes silence differentiation and tumor-suppressor programs, sustaining an
      undifferentiated proliferative tumor state.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33035459
    reference_title: "Tazemetostat in advanced epithelioid sarcoma with loss of INI1/SMARCB1: an international, open-label, phase 2 basket study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Over 90% of tumours have lost INI1 expression, leading to oncogenic dependence on the transcriptional repressor EZH2."
    explanation: Clinical trial background summarizes the mechanistic link between INI1 loss in over 90% of epithelioid sarcomas and oncogenic dependence on the EZH2 transcriptional repressor.
  - reference: PMID:20951942
    reference_title: "Epigenetic antagonism between polycomb and SWI/SNF complexes during oncogenic transformation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mechanistically, we show that loss of the SNF5 tumor suppressor leads to elevated expression of the Polycomb gene EZH2 and that Polycomb targets are broadly H3K27-trimethylated and repressed in SNF5-deficient fibroblasts and cancers."
    explanation: Demonstrates epigenetic antagonism between SWI/SNF (SNF5/SMARCB1) and PRC2/EZH2, showing that SNF5 loss elevates EZH2 expression and increases broad H3K27 trimethylation and epigenetic repression of Polycomb target genes in SNF5-deficient cancers.
- name: Aberrant Proliferation and Blocked Differentiation
  biological_scale: CELLULAR
  node_class: PROLIFERATION_EXPANSION
  description: >-
    Loss of SMARCB1 reduces mSWI/SNF affinity and occupancy at tissue-specific
    enhancers and bivalent promoters while unopposed PRC2 represses differentiation
    and tumor-suppressor genes, driving sustained tumor cell proliferation in a
    poorly differentiated epithelial-mesenchymal hybrid state and producing locally
    expansile soft-tissue tumor nodules.
  cell_types:
  - preferred_term: mesenchymal cell of uncertain differentiation
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030154
      label: cell differentiation
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: hypodermis
    term:
      id: UBERON:0002072
      label: hypodermis
  downstream:
  - target: Local Invasion and Metastatic Dissemination
    description: >-
      The proliferative, infiltrative tumor invades local soft tissues and
      disseminates, with a characteristic propensity for regional lymph node and
      pulmonary spread.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Soft Tissue Mass
    description: >-
      Proliferative growth of epithelioid and spindle tumor cells produces the
      clinically apparent soft-tissue or dermal mass.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In the context of MRT, the loss of SMARCB1 lowers the affinities of mSWI/SNF complexes for chromatin, significantly reducing the occupancy of aberrant mSWI/SNF complexes on enhancers and bivalent gene promoters; these changes lead to the repression of key genes involved in cell differentiation and tumor suppression( 14 )."
    explanation: Explains how loss of SMARCB1 impairs mSWI/SNF occupancy at enhancers and bivalent promoters to repress cell differentiation and tumor-suppressor gene programs in SMARCB1-deficient tumors.
- name: Local Invasion and Metastatic Dissemination
  biological_scale: TISSUE
  node_class: NEOPLASTIC_INVASION_AND_METASTASIS
  conforms_to: invasion_and_metastasis#Local Invasion and Intravasation
  description: >-
    Epithelioid sarcoma infiltrates locally along fascial planes, aponeuroses, and
    tendon sheaths, remodeling extracellular matrix in part via tumor-derived CD147
    microvesicles that stimulate fibroblast matrix metalloproteinase production, and
    disseminates via lymphatic and hematogenous routes with an unusually high rate
    of regional lymph node and pulmonary metastasis.
  biological_processes:
  - preferred_term: tumor cell migration and invasion
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Skin Ulceration
    description: >-
      Superficial distal tumor invasion can break down overlying skin and
      present as a non-healing ulcer.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Regional Lymph Node Involvement
    description: >-
      Metastatic dissemination from the primary tumor commonly involves regional
      lymph nodes.
    causal_link_type: DIRECT
  - target: Pulmonary Metastasis
    description: >-
      Hematogenous dissemination of invasive epithelioid sarcoma cells frequently
      seeds the lungs, the second leading site of initial metastasis after regional
      lymph nodes.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:4014539
    reference_title: "Epithelioid sarcoma. Diagnosis, prognostic indicators, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up data, available in 202 cases (84%), showed a 77% recurrence and a 45% metastatic rate. The most common initial sites of metastasis were lymph nodes (48%) and lungs (25%)."
    explanation: The Chase & Enzinger series quantifies the high recurrence and metastatic rates and identifies lymph nodes and lungs as the leading metastatic sites.
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Using an EpS cell line model, Aoki and colleagues found that sarcoma cells promote invasion and metastasis by releasing CD147 as microvesicles, which stimulates the production of matrix metalloproteinases (MMPs) by fibroblasts in the TME( 110 )."
    explanation: Summarizes experimental EpS cell-line evidence showing microvesicle-associated CD147 induces stromal fibroblast MMP production to drive extracellular matrix invasion and metastasis.
histopathology:
- name: Pseudogranulomatous Nodular Pattern
  subtype: Classic
  finding_term:
    preferred_term: granuloma-like growth pattern
    term:
      id: NCIT:C36059
      label: Granuloma-Like Growth Pattern
  description: >-
    Classic distal-type epithelioid sarcoma forms nodules of epithelioid and spindle
    cells with central necrosis, producing a pseudogranulomatous appearance that can
    mimic a necrotizing granuloma or rheumatoid nodule.
  evidence:
  - reference: PMID:9042279
    reference_title: '"Proximal-type" epithelioid sarcoma, a distinctive aggressive neoplasm showing rhabdoid features. Clinicopathologic, immunohistochemical, and ultrastructural study of a series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A granuloma-like pattern reminiscent of that observed in classic epithelioid sarcoma was observed in only two cases."
    explanation: The defining proximal-type series notes the granuloma-like (pseudogranulomatous) pattern as a feature characteristic of classic epithelioid sarcoma, contrasting it with the proximal variant.
- name: Spindle Cell Component
  subtype: Classic
  finding_term:
    preferred_term: spindle cell pattern
    term:
      id: NCIT:C53643
      label: Spindle Cell Pattern
  description: >-
    A spindle cell component blending with the epithelioid cells is characteristic of
    classic distal-type lesions, contributing to the epithelial-mesenchymal hybrid
    histologic phenotype.
  evidence:
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "As stated above, the two clinical types show distinct histology in most cases, with the distal-type having a pseudo-granulomatous growth, with a mixture of relatively bland spindle and epithelioid cells, while the proximal-type is composed of solid sheets or nests of large epithelioid cells with densely eosinophilic cytoplasm and rhabdoid phenotype( 11 )."
    explanation: Documents the characteristic admixture of spindle and epithelioid cells in distal-type epithelioid sarcoma in contrast to the solid sheets of large rhabdoid/epithelioid cells in proximal-type tumors.
- name: Tumor Cell Necrosis
  finding_term:
    preferred_term: tumor cell necrosis
    term:
      id: NCIT:C35957
      label: Tumor Cell Necrosis
  description: >-
    Central (geographic) necrosis within tumor nodules is common, especially in the
    classic type, contributing to the pseudogranulomatous pattern.
  evidence:
  - reference: PMID:9042279
    reference_title: '"Proximal-type" epithelioid sarcoma, a distinctive aggressive neoplasm showing rhabdoid features. Clinicopathologic, immunohistochemical, and ultrastructural study of a series.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Areas of necrosis were often seen."
    explanation: The proximal-type series documents frequent tumor necrosis, a recurrent histologic feature across epithelioid sarcoma.
phenotypes:
- category: Musculoskeletal

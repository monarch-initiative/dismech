    classification_value: Sarcoma
    notes: >-
      Derived from this entry's disease term MONDO:0017387 (epithelioid sarcoma),
      which carries the cross-reference ICDO:8804/3 and whose NCIT
      cross-reference NCIT:C3714 (Epithelioid Sarcoma) is a descendant of
      NCIT:C9118 (Sarcoma), the term this enum value is bound to. The epithelioid
      cytomorphology and the keratin/EMA immunophenotype that give the tumour its
      name are not a carcinoma signal — the ICD-O morphology axis records
      histogenesis, and epithelioid sarcoma is a soft-tissue sarcoma of
      mesenchymal origin.

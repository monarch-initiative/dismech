  evidence:
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In most cases molecular testing is not required, as loss of SMARCB1 expression by immunohistochemistry is sufficient to support the diagnosis of EpS in the appropriate clinicopathologic context (anatomic location, cytokeratin positivity, epithelioid/rhabdoid phenotype)."
    explanation: Consensus guideline confirming that INI1/SMARCB1 immunohistochemistry on biopsy tissue suffices to establish the diagnosis in the appropriate clinicopathologic setting.

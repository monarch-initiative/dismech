    snippet: "In total, 127 of 136 (93%) ES cases showed complete absence of INI1 expression, including 58 (91%) conventional ES, 61 (95%) proximal-type ES, and all 8 (100%) hybrid ES."
    explanation: Primary immunohistochemical cohort demonstrating complete loss of INI1 (SMARCB1) expression in 93% of 136 human epithelioid sarcomas across subtypes.
  - reference: PMID:37916971
    reference_title: "Translational Aspects of Epithelioid Sarcoma: Current Consensus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Most EpS harbor homozygous deletions, while in a smaller subset only heterozygous SMARCB1 loss-of-function (LOF) alterations are detected( 7 , 8 , 15 , 16 )."
    explanation: Summarizes tumor genomic studies showing homozygous SMARCB1 deletions as the predominant somatic mechanism of inactivation in epithelioid sarcoma.
biochemical:

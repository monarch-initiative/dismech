treatments:
- name: Wide Surgical Excision
  description: >-
    Complete wide local excision (or radical resection when required for clear
    margins) is the primary curative-intent treatment for localized disease;
    regional lymph node evaluation is considered given the propensity for nodal
    spread.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Local Invasion and Metastatic Dissemination
    treatment_effect: INHIBITS
    description: >-
      Wide margin-negative surgical resection removes locally infiltrative tumor
      tissue along fascial planes and tendon sheaths to prevent local recurrence and
      subsequent dissemination.
    evidence:
    - reference: PMID:30422506
      reference_title: "Epithelioid Sarcoma."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Complete surgical resection is curative in early-stage disease. However, local recurrence and late distant metastases may occur many years after initial treatment, necessitating long-term surveillance."
      explanation: Establishes complete surgical resection as curative in localized early-stage epithelioid sarcoma by eradicating the primary invasive lesion.
  evidence:
  - reference: PMID:4014539
    reference_title: "Epithelioid sarcoma. Diagnosis, prognostic indicators, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radical excision or amputation still appears to be the initial treatment of choice, though adjunctive high-dose radiotherapy to the excision site may prove to be of additional value."
    explanation: Supports wide/radical surgical excision as the primary initial treatment for localized epithelioid sarcoma.
  - reference: PMID:30422506
    reference_title: "Epithelioid Sarcoma."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Complete surgical resection is curative in early-stage disease. However, local recurrence and late distant metastases may occur many years after initial treatment, necessitating long-term surveillance."
    explanation: Confirms complete surgical resection as the cornerstone curative modality in early-stage disease.
- name: Adjunctive Radiotherapy
  description: >-
    Perioperative high-dose radiotherapy to the tumor bed is used adjunctively with
    limb-sparing surgery to reduce local recurrence, and may provide local palliation
    in unresectable or advanced disease.

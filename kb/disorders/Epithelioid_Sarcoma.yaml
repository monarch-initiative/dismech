  presence: Absent nuclear staining in >90% of tumors
  specificity: Characteristic of SMARCB1-deficient neoplasms (>90% sensitivity in EpS)
  notes: >-
    Complete loss of nuclear INI1/BAF47 staining in tumor cells (with retained
    staining in non-neoplastic endothelial and inflammatory cells as internal
    control) is the canonical diagnostic biomarker of biallelic SMARCB1 inactivation
    and distinguishes epithelioid sarcoma from carcinoma and melanoma mimics.

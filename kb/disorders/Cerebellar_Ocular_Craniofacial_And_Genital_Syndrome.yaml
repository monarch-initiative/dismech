    explanation: The first reported patient was homozygous for a MAB21L1 frameshift.
pathophysiology:
- name: MAB21L1 Biallelic Loss of Function
  description: >-
    Homozygous frameshift and nonsense variants, plus one missense variant
    (p.Gln233Pro) predicted to disrupt an alpha helix, are expected to abolish
    MAB21L1 function. MAB21L1 has the nucleotidyltransferase fold of cGAS, but
    no nucleotidyltransferase activity has been demonstrated, so the lost
    function is thought to be non-catalytic; the protein associates with the
    PAX6 regulators MEIS1, MEIS2 and PBX1. Loss of these interactions in
    patients is proposed but has not been measured. All coding variants lie
    in the single coding exon.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MAB21L1
    term:
      id: hgnc:6757
      label: MAB21L1
  molecular_functions:

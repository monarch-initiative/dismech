    snippet: "The mutations in MAB21L1 identified in this study as well as the previously identified variant in an additional family with a similar phenotype are frameshift/nonsense variants except one missense allele, most likely leading to complete loss of function of the protein, including loss of interactions with potential partner proteins."
    explanation: The patient alleles are predicted to cause complete loss of MAB21L1 function.

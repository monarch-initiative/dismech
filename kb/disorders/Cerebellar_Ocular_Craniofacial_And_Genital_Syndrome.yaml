      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ES on individual 1_VI:5 identified a novel homozygous truncating variant in MAB21L1 (NM_005584.4, c.841delG, p.Glu281Aspfs*20) located within a region of homozygosity"
      explanation: Identifies the family 1 variant.
  - name: c.698A>C (p.Gln233Pro)
    description: >-
      The only missense allele, homozygous in an Iranian boy (family 2);
      predicted to disrupt an alpha helix. Its equivalence to null alleles has
      not been tested functionally.
    evidence:
    - reference: PMID:30487245
      reference_title: "MAB21L1 loss of function causes a syndromic neurodevelopmental disorder with distinctive cerebellar, ocular, craniofacial and genital features (COFG syndrome)."

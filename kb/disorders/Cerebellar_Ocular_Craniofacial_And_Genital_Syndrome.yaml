animal_models:
- name: Mab21l1-null mouse
  species: Mouse
  genotype: Mab21l1-/-
  publication: PMID:12642482
  description: >-
    Mab21l1-deficient mice have a rudimentary lens with microphthalmia,
    hypoplastic preputial glands and an unclosed fontanelle, matching the
    ocular, genital and craniofacial branches of COFG. Cerebellar and
    cognitive phenotypes have not been reported.
  modeled_mechanisms:
  - target: Rudimentary Lens Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The null mouse fails to form a normal lens and is microphthalmic.
    limitations: >-
      The mouse eye defect is more severe than the corneal-predominant eye
      disease of patients, who are not reported to be microphthalmic.
    evidence:
    - reference: PMID:12642482
      reference_title: "Cell-autonomous involvement of Mab21l1 is essential for lens placode development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We describe the generation of Mab21l1-deficient mice with defects in eye and preputial gland formation."
      explanation: The knockout has eye and preputial gland defects.
  - target: Genital Mesenchyme Hypoplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced scrotum, vulva and preputial and clitoral gland size with depleted mesenchyme.
    limitations: >-
      The preputial gland is rodent-specific; it models the human scrotal fold
      only as its developmental derivative.
    evidence:
    - reference: PMID:37750449
      reference_title: "External genitalia phenotypes of a Mab21l1-null mouse model for cerebellar, ocular, craniofacial, and genital (COFG) syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A COFG mouse model with Mab21l1-null mutation causes severe microphthalmia and fontanelle dysosteogenesis, similar to the symptoms in human patients."
      explanation: The null mouse is used as a model of COFG.
  - target: Impaired Craniofacial Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Unclosed fontanelle from impaired calvarial bone development.
    limitations: >-
      Patients are not reported to have an open fontanelle; the facial
      gestalt features of COFG have no described mouse counterpart.
    evidence:
    - reference: PMID:29156428
      reference_title: "Involvement of the Mab21l1 gene in calvarial osteogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we observed that mice lacking Mab21l1 displayed an unclosed fontanelle, suggesting impaired calvarial bone development."
      explanation: Shows the calvarial defect in the null mouse.

  evidence:
  - reference: PMID:30487245
    reference_title: "MAB21L1 loss of function causes a syndromic neurodevelopmental disorder with distinctive cerebellar, ocular, craniofacial and genital features (COFG syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease follows an autosomal recessive mode of inheritance in all families."
    explanation: All five consanguineous families segregate the disease as an autosomal recessive trait.
  - reference: PMID:27103078

- name: Impaired Craniofacial Morphogenesis
  description: >-
    Patients share a facial gestalt with a short forehead, medially sparse or
    flared and laterally extending eyebrows, synophrys, low anterior hairline,
    anteverted nares and a long, tented philtrum. Mab21l1-null mice have an
    unclosed fontanelle from impaired calvarial bone formation. How the
    mouse calvarial defect relates to the human facial features is not
    established.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: calvarial intramembranous ossification
    term:
      id: GO:0001957
      label: intramembranous ossification
    modifier: DECREASED
  evidence:
  - reference: PMID:29156428
    reference_title: "Involvement of the Mab21l1 gene in calvarial osteogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this study, we observed that mice lacking Mab21l1 displayed an unclosed fontanelle, suggesting impaired calvarial bone development."
    explanation: Mab21l1-null mice have impaired calvarial bone development.
  - reference: PMID:30487245
    reference_title: "MAB21L1 loss of function causes a syndromic neurodevelopmental disorder with distinctive cerebellar, ocular, craniofacial and genital features (COFG syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All presented with similar craniofacial dysmorphism with coarse facies, medially sparse/flared and laterally extending eyebrows, synophrys, buphthalmos, anteverted nares, a long and tented philtrum, flat nasal bridge, low anterior hairline and hirsutism."
    explanation: Affected individuals in the index family share the same craniofacial dysmorphism.
  downstream:
  - target: Small forehead
  - target: Medial flaring of the eyebrow
  - target: Laterally extended eyebrow
  - target: Synophrys
  - target: Low anterior hairline
  - target: Anteverted nares
  - target: Long philtrum
- name: Genital Mesenchyme Hypoplasia
  description: >-
    In neonatal mice MAB21L1 is expressed in two mesenchymal populations of
    the external genitalia, beneath the scrotal and labial skin and around the
    preputial and clitoral glands. Mab21l1-null pups have a smaller scrotum,
    vulva and preputial and clitoral glands, with reduced mesenchymal cell
    density, proliferation and extracellular matrix. The preputial gland is a
    rodent derivative of the cranial scrotal fold, so this models the absent
    labioscrotal folds of patients.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: external genital mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: mesenchymal cell proliferation
    term:
      id: GO:0010463
      label: mesenchymal cell proliferation
    modifier: DECREASED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DECREASED
  evidence:
  - reference: PMID:37750449
    reference_title: "External genitalia phenotypes of a Mab21l1-null mouse model for cerebellar, ocular, craniofacial, and genital (COFG) syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that, at the neonatal stage, MAB21L1 expression in the external genitalia was restricted to two mesenchymal cell populations-underneath the scrotal and labial skin and around the preputial and clitoral glands (PG/CG)."
    explanation: Places MAB21L1 in the external genital mesenchyme.
  - reference: PMID:37750449
    reference_title: "External genitalia phenotypes of a Mab21l1-null mouse model for cerebellar, ocular, craniofacial, and genital (COFG) syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Morphometric analyses of the Mab21l1-/- pups revealed a significant reduction in the external size of the scrotum, vulva, and CG, as well as PG."
    explanation: Mab21l1-null pups have hypoplastic external genital structures.
  downstream:
  - target: Absent scrotum
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37750449
      reference_title: "External genitalia phenotypes of a Mab21l1-null mouse model for cerebellar, ocular, craniofacial, and genital (COFG) syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "One of the typical symptoms is scrotal agenesis in male infants, while male Mab21l1-null mice show hypoplastic preputial glands, a rodent-specific derivative of the cranial scrotal fold."
      explanation: >-
        The mouse preputial gland defect is the rodent counterpart of human
        scrotal agenesis.
  - target: Absence of labia majora
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

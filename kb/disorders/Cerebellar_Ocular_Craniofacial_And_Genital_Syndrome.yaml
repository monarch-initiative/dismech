genetic:
- name: MAB21L1
  gene_term:
    preferred_term: MAB21L1
    term:
      id: hgnc:6757
      label: MAB21L1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Homozygous frameshift, nonsense and missense variants in the single coding
    exon. Heterozygous carriers are unaffected; monoallelic Arg51 missense
    variants cause a different, dominant eye-only disorder.
  gene_disease_validity:
  - validity_classification: STRONG
    classified_by: CLINGEN
    external_id: CGGV:assertion_8fae9544-f1fa-4155-8ff4-7719efb37d1a-2024-04-19T160000.000Z
    evidence:
    - reference: CGGV:assertion_8fae9544-f1fa-4155-8ff4-7719efb37d1a-2024-04-19T160000.000Z
      reference_title: "MAB21L1 / cerebellar, ocular, craniofacial, and genital syndrome (Strong)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MAB21L1 | HGNC:6757 | cerebellar, ocular, craniofacial, and genital syndrome | MONDO:0032774 | AR | Strong"
      explanation: ClinGen classifies MAB21L1 as Strong for this disease, autosomal recessive.
  evidence:
  - reference: PMID:30487245
    reference_title: "MAB21L1 loss of function causes a syndromic neurodevelopmental disorder with distinctive cerebellar, ocular, craniofacial and genital features (COFG syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified four homozygous MAB21L1 loss of function variants (p.Glu281fs*20, p.Arg287Glufs*14 p.Tyr280* and p.Ser93Serfs*48) and one missense variant (p.Gln233Pro) in 10 affected individuals from 5 consanguineous families with a distinctive autosomal recessive neurodevelopmental syndrome."
    explanation: Homozygous MAB21L1 variants in ten patients from five families define the syndrome.
  - reference: PMID:27103078
    reference_title: "Autosomal recessive truncating MAB21L1 mutation associated with a syndromic scrotal agenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The reported patient was carrying a homozygous frameshift in MAB21L1 detected by whole-exome sequencing, considered as the most likely disease-causing variant."
    explanation: First patient reported with a homozygous MAB21L1 frameshift.
  variants:
  - name: c.841delG (p.Glu281Aspfs*20)
    description: Homozygous frameshift in four affected members of an Iranian family (family 1).
    evidence:
    - reference: PMID:30487245

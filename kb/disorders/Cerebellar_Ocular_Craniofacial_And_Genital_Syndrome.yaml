differential_diagnoses:
- name: MAB21L1-related autosomal dominant microphthalmia and aniridia
  description: >-
    Heterozygous missense variants at MAB21L1 codon Arg51, often de novo,
    cause an eye-restricted disorder (microphthalmia, aniridia, or
    blepharophimosis with anterior segment and macular dysgenesis) without
    the cerebellar, craniofacial, genital or cognitive features of COFG.
  distinguishing_features:
  - Monoallelic Arg51 missense variants rather than biallelic loss of function.
  - Autosomal dominant or de novo rather than recessive.
  - Ocular anomalies only.
  evidence:
  - reference: PMID:36892533
    reference_title: "Missense Mutations in MAB21L1: Causation of Novel Autosomal Dominant Ocular BAMD Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous pathogenic variants in MAB21L1 account for a new AD BAMD syndrome, which is completely different from COFG caused by homozygous variants in MAB21L1."
    explanation: The dominant ocular disorder is distinct from COFG.
  - reference: PMID:39016008
    reference_title: "Monoallelic missense variants in MAB21L1 cause a novel autosomal dominant microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis revealed that patients with a single allele missense variant in MAB21L1 exhibited solely eye abnormalities."
    explanation: Monoallelic missense carriers have eye abnormalities only.

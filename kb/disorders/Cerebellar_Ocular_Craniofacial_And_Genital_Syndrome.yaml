name: Cerebellar, Ocular, Craniofacial, and Genital Syndrome
creation_date: "2026-11-05T00:47:29Z"
category: Mendelian
synonyms:
- COFG syndrome
- Cerebello-Oculo-Facio-Genital syndrome
description: >-
  An ultrarare autosomal recessive neurodevelopmental malformation syndrome
  caused by biallelic loss-of-function variants in MAB21L1, a member of the
  conserved male abnormal 21 (MAB21) family with a cGAS-like
  nucleotidyltransferase fold but no demonstrated catalytic activity. Affected
  children have cerebellar and vermian hypoplasia (often with pontine
  involvement or a Dandy-Walker malformation) with ataxia, moderate to severe
  developmental delay and intellectual disability, bilateral corneal dystrophy
  with nystagmus and strabismus, a recognisable facial gestalt (short forehead,
  medially sparse or flared and laterally extending eyebrows, low anterior
  hairline), absent or underdeveloped labioscrotal folds (scrotal agenesis in
  males, absent labia majora in females), and hypoplastic, widely spaced
  nipples with tufts of hair from the lactiferous ducts. Microcephaly is
  variable.
notes: >-
  Kept the MONDO/OMIM label (OMIM 618479) as the name. It is already specific
  to MAB21L1, and no gene-qualified name for this scope is established.
  Heterozygous missense variants at MAB21L1 codon Arg51 cause a separate,
  autosomal dominant eye-only disorder (microphthalmia and aniridia, also
  described as BAMD syndrome); that disorder is not part of this entry and its
  ocular features (microphthalmia, aniridia) are not curated here as human
  phenotypes. Microphthalmia appears in this entry only through the
  Mab21l1-null mouse. Karyotype and SNP-array analysis were normal in the
  index family, and serum testosterone, 17-OH progesterone and cortisol were
  normal in a male with complete scrotal agenesis (PMID:30487245), so the
  genital anomaly is not explained by a hormonal defect. No GeneReviews
  chapter covers this disease.

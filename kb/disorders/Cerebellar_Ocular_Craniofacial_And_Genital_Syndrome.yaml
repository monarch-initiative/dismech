- name: Lens Placode Gene Expression Dysregulation
  description: >-
    In the mouse lens placode, Mab21l1 acts downstream of PAX6. Its loss
    reduces Foxe3 expression and, at single-cell resolution, alters 279 genes,
    including the lens-formation genes Pitx3, Maf and Sfrp2 and housekeeping
    genes of DNA and nucleotide metabolism, before the cells die. The
    authors propose that MAB21L1 acts as a nuclear factor modulating these
    programmes.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: lens placode formation
    term:
      id: GO:0001743
      label: lens placode formation
    modifier: DECREASED
  evidence:
  - reference: PMID:34779479
    reference_title: "MAB21L1 modulates gene expression and DNA metabolic processes in the lens placode."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We successfully identified 21 lens-specific genes that were downregulated in Mab21l1-null cells, including three key genes involved in lens formation: Pitx3, Maf and Sfrp2."
    explanation: Single-cell RNA sequencing of Mab21l1-null lens ectoderm shows loss of lens-formation gene expression.
  - reference: PMID:34779479
    reference_title: "MAB21L1 modulates gene expression and DNA metabolic processes in the lens placode."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, gene ontology analysis of the 279 differentially expressed genes indicated enrichment in housekeeping genes associated with DNA/nucleotide metabolism prior to cell death."
    explanation: The transcriptional change also affects DNA and nucleotide metabolism genes before cell death.

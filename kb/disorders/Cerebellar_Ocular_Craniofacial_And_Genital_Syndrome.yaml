- name: Rudimentary Lens Formation
  description: >-
    In Mab21l1-null mice the lens placode fails to proliferate and invaginate
    properly, leaving a rudimentary lens and severe microphthalmia. The
    surface ectoderm that forms the lens placode also gives rise to the cornea
    and iris. Patients with biallelic loss of function have a milder eye
    phenotype, dominated by bilateral corneal dystrophy and opacity; one
    patient also needed cataract extraction. The step from the mouse lens
    defect to the human corneal phenotype is inferred.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: lens development in camera-type eye
    term:
      id: GO:0002088
      label: lens development in camera-type eye
    modifier: DECREASED
  evidence:
  - reference: PMID:12642482
    reference_title: "Cell-autonomous involvement of Mab21l1 is essential for lens placode development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant mouse eye has a rudimentary lens resulting from insufficient invagination of the lens placode caused by deficient proliferation."
    explanation: Mab21l1-null mice form only a rudimentary lens.
  - reference: PMID:36413568
    reference_title: "Monoallelic variants resulting in substitutions of MAB21L1 Arg51 Cause Aniridia and microphthalmia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Given that biallelic loss-of-function variants in MAB21L1 result in a milder eye phenotype"
    explanation: >-
      The eye phenotype of biallelic loss of function in humans is milder than
      that caused by dominant Arg51 variants.
  downstream:
  - target: Corneal dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34779479
      reference_title: "MAB21L1 modulates gene expression and DNA metabolic processes in the lens placode."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "The invagination and proliferation of lens placode cells give rise to lens vesicles, whereas the remaining surface ectoderm cells contribute to cornea and iris formation, becoming the anterior elements of the eye."
      explanation: >-
        The lens placode and the corneal ectoderm share an origin, which links
        the lens ectoderm defect to the human corneal phenotype by inference.
  - target: Corneal opacity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Cerebellar Development
  description: >-
    Patients have generalised cerebellar and vermian hypoplasia, often with
    pontine involvement, and some have a Dandy-Walker malformation. Mab21
    family transcripts are most abundant in the developing cerebellum and
    hindbrain in mice, but the cellular mechanism of the cerebellar defect has
    not been studied.

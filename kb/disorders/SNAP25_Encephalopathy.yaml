    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals harboring heterozygous missense or loss-of-function variants in
      SNAP25 were assembled through collaboration with international colleagues,
      matchmaking platforms, and literature review.
    explanation: >-
      Defines the heterozygous missense and loss-of-function variant spectrum.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a dominant de novo variant, p.Ile67Asn, in SNAP25B, a SNARE protein essential for exocytosis of synaptic vesicles from nerve terminals and of dense-core vesicles from endocrine cells."
    explanation: Founding report identifying SNAP25 as the CMS18 gene.
  - reference: PMID:36379720

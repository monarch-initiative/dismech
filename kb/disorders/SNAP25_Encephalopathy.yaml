    snippet: "we performed rapid whole-genome sequencing (rWGS) on a critically ill newborn leading to the discovery of an unreported pathogenic de novo SNAP25 c.529C > T; p.Gln177Ter variant."
    explanation: Documents a second, nonsense CMS18 allele identified by rapid genome sequencing.
diagnosis:
- name: SNAP25 Molecular Diagnosis
  description: >-
    Diagnosis is established by identifying a de novo heterozygous pathogenic
    SNAP25 variant in a child with early-onset epilepsy and intellectual
    disability, or with a presynaptic congenital myasthenic syndrome. In the
    myasthenic presentation, clinical and electrophysiological features cannot
    discriminate between congenital myasthenic syndrome genes, so the molecular
    result is what assigns the subtype; the index p.Ile67Asn was found by
    whole-exome sequencing with Sanger confirmation of de novo status.

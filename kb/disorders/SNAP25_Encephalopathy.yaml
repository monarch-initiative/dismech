    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the mutation in the patient and its absence in her parents."
    explanation: Documents Sanger confirmation of the de novo status of the index CMS18 SNAP25 variant.
- name: Repetitive nerve stimulation and single-fiber EMG
  description: >-
    The entry-level electrodiagnostic test. A decremental compound muscle
    action potential response to low-frequency repetitive nerve stimulation,
    or abnormal jitter/blocking on single-fiber EMG, establishes a defect of
    neuromuscular transmission and, with onset at birth to early childhood and
    fatigable cranial weakness, supports a generic CMS diagnosis. It does not
    discriminate CMS18 from other CMS subtypes.
  diagnosis_term:
    preferred_term: repetitive nerve stimulation electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  results: >-
    A decremental CMAP response on low-frequency repetitive nerve stimulation,
    or abnormal single-fiber EMG, indicates impaired neuromuscular
    transmission.
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A generic diagnosis of a CMS can be made on the basis of onset at birth to early childhood, fatigable weakness affecting especially the ocular and other cranial muscles, a positive family history, and a decremental EMG response or an abnormal single-fiber EMG."
    explanation: Defines the clinical-plus-electrodiagnostic basis on which a generic CMS diagnosis rests.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Measurement of compound muscle action potentials elicited by repetitive
      nerve stimulation is required to diagnose CMS.
    explanation: Establishes repetitive nerve stimulation as a required diagnostic measurement in CMS.
- name: Rapid whole-genome sequencing in the critically ill neonate
  description: >-
    In a critically ill newborn, rapid
    whole-genome sequencing was the test that made the diagnosis, on a
    timescale relevant to intensive-care management. This matters in CMS
    because subtype-specific therapy differs and some drugs worsen other
    subtypes.
  diagnosis_term:
    preferred_term: rapid whole-genome sequencing
    term:
      id: NCIT:C101294
      label: Whole Genome Sequencing
  evidence:
  - reference: PMID:36379720
    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed rapid whole-genome sequencing (rWGS) on a critically ill newborn leading to the discovery of an unreported pathogenic de novo SNAP25 c.529C > T; p.Gln177Ter variant."
    explanation: Documents rapid genome sequencing as the diagnostic modality in the critically ill neonatal CMS18 case.
- name: Electroencephalography
  description: >-
    EEG documents the central SNARE-dependent component of CMS18, which is not
    detectable by neuromuscular electrodiagnosis. In the index patient it
    showed generalized atypical polyspike and wave discharges with diffuse
    background slowing, corresponding to the episodes of unresponsiveness.
  diagnosis_term:
    preferred_term: electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalography (EEG) revealed generalized atypical polyspike and wave discharges with diffuse slowing of the background rhythm."
    explanation: Documents the EEG abnormality in the index CMS18 patient.
- name: In vitro microelectrode study of the intercostal muscle endplate
  description: >-
    The definitive mechanistic diagnostic, available at only a few centers. In
    vitro microelectrode recording from an intercostal muscle endplate biopsy
    localizes the defect to presynaptic quantal release rather than to
    postsynaptic acetylcholine receptor number or endplate structure, and is
    what established the CMS18 mechanism in the index patient.
  diagnosis_term:
    preferred_term: in vitro endplate microelectrode electrophysiology
    term:
      id: NCIT:C38056
      label: Electromyography
  results: >-
    Reduced quantal content and reduced numbers of readily releasable quanta
    with a normal endplate acetylcholine receptor complement indicate a
    presynaptic release defect.
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intercostal muscle EP electrophysiology studies showed a slightly reduced MEPP amplitude, but the number of AChRs per EP was normal."
    explanation: Documents the in vitro endplate study and its key discriminating result - a normal postsynaptic receptor complement.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuromuscular transmission at patient endplates was compromised by reduced evoked quantal release."
    explanation: The in vitro microelectrode result that localizes the CMS18 defect to evoked quantal release.
- name: Brain MRI
  description: >-
    Brain MRI was normal in the index myasthenic patient despite intellectual
    disability, ataxia, and epileptiform EEG. A normal MRI therefore does not
    argue against the diagnosis, although brain atrophy is a recurrent finding
    in the encephalopathy cohort (see the Cerebral Atrophy phenotype).
  presence: NORMAL
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The brain magnetic resonance imaging (MRI) was normal."
    explanation: Documents normal brain imaging in the index myasthenic patient.
differential_diagnoses:
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Other SNARE-machinery and synaptic vesicle cycle disorders (STXBP1, STX1B,
    VAMP2, UNC13A) share early-onset epilepsy and developmental impairment and are
    distinguished by molecular testing.
  distinguishing_features:
  - A de novo SNAP25 variant favors this disorder.
  - A variant in another SNARE/vesicle-cycle gene favors the corresponding SNAREopathy.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These core symptoms and additional recurrent phenotypes show an overlap to
      genes encoding other components or associated proteins of the SNARE complex
      such as STX1B, STXBP1, or VAMP2.
    explanation: >-
      Establishes the overlapping SNAREopathy differential diagnosis.
- name: Autoimmune Myasthenia Gravis
  description: >-
    The acquired autoimmune disorder of neuromuscular transmission, and the
    first differential a clinician must exclude in a child with fatigable
    weakness and ptosis. It is historically the entity against which the CMS
    were defined as distinct: the congenital syndromes were separated out only
    once the autoimmune origin of myasthenia gravis was established. The
    distinction is made serologically, and antibody negativity is what
    redirects the workup toward a genetic cause.
  distinguishing_features:
  - Autoimmune myasthenia gravis is antibody-mediated and acquired, whereas CMS18 is a de novo germline SNAP25 disorder present from birth
  - Anti-AChR and anti-MuSK antibody testing is indicated in sporadic patients over 1 year of age and in arthrogrypotic infants; antibody negativity is essential before attributing the phenotype to a congenital myasthenic syndrome
  - Myasthenia gravis is postsynaptic, whereas CMS18 is a presynaptic quantal-release defect, and it responds to immunotherapy rather than to 3,4-diaminopyridine
  disease_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  evidence:
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tests for anti-AChR and anti-MuSK antibodies are indicated in sporadic patients after the age of 1 year and in arthrogrypotic infants even if the mother has no myasthenic symptoms."
    explanation: Establishes serological exclusion of autoimmune myasthenia gravis as an indicated step in the CMS workup.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CMS have been recognized as distinct clinical entities since the 1970s, after the autoimmune origin of myasthenia gravis and of the Lambert-Eaton myasthenic syndromes had been established."
    explanation: Documents that the congenital myasthenic syndromes are nosologically defined against autoimmune myasthenia gravis and LEMS.
- name: Lambert-Eaton Myasthenic Syndrome
  description: >-
    The acquired autoimmune presynaptic disorder, in which autoantibodies
    against presynaptic voltage-gated calcium channels reduce evoked quantal
    release. This is the closest mechanistic mimic of CMS18: both act
    presynaptically on quantal release, both produce post-tetanic facilitation
    of the compound muscle action potential, and both respond to
    3,4-diaminopyridine - which is why CMS18 is classified within the
    LEMS-like group of congenital myasthenic syndromes. The separation is
    aetiological rather than physiological.
  distinguishing_features:
  - LEMS is antibody-mediated and typically adult-onset and paraneoplastic (commonly small cell lung cancer), whereas CMS18 is a de novo germline SNAP25 disorder presenting from birth or early childhood
  - CMS18 additionally carries a central SNARE phenotype - epileptiform EEG, ataxia, and intellectual disability - that LEMS does not
  - The shared 3,4-diaminopyridine response reflects a shared presynaptic release defect and is therefore not discriminating
  disease_term:
    preferred_term: Lambert-Eaton myasthenic syndrome
    term:
      id: MONDO:0018556
      label: Lambert-Eaton myasthenic syndrome
  evidence:
  - reference: PMID:40533459
    reference_title: "Review of 40 genes causing congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "9 Lambert-Eaton myasthenic syndrome (LEMS)-like CMS SYT2, SNAP25, VAMP1, UNC13A, RPH3A, LAMA5"
    explanation: Classifies SNAP25-CMS by name within the Lambert-Eaton-like group, establishing LEMS as the phenotypic mimic that must be distinguished.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The CMS have been recognized as distinct clinical entities since the 1970s, after the autoimmune origin of myasthenia gravis and of the Lambert-Eaton myasthenic syndromes had been established."
    explanation: Documents that the congenital myasthenic syndromes were delineated as distinct from the Lambert-Eaton myasthenic syndromes.
- name: Other Presynaptic Congenital Myasthenic Syndromes
  description: >-
    CMS caused by defects in the other presynaptic release-machinery and
    acetylcholine-supply proteins - SYT2, VAMP1, UNC13A, RPH3A (LEMS-like
    release defects) and CHAT, SLC5A7, SLC18A3 (acetylcholine synthesis,
    transport, and packaging). These share fatigable weakness but differ in
    inheritance, endplate electrophysiological signature, and drug response,
    and clinical and electrophysiological features alone are insufficient to
    discriminate them.
  distinguishing_features:
  - Most other presynaptic CMS are autosomal recessive loss-of-function disorders, whereas CMS18 is autosomal dominant de novo with a dominant-negative mechanism
  - Prominent cortical hyperexcitability, ataxia, and intellectual disability point toward the SNARE-complex subtypes rather than the acetylcholine-supply subtypes
  - Genetic testing is required for definitive subtype assignment
  disease_term:
    preferred_term: Presynaptic congenital myasthenic syndrome
    term:
      id: MONDO:0700466
      label: presynaptic congenital myasthenic syndrome
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clinical and electrophysiological features are not sufficient to identify a defective molecule, and genetic studies are always required for accurate diagnosis."
    explanation: Establishes that genetic testing, not clinical or electrophysiological phenotype, is required to distinguish CMS subtypes from one another.
progression:
- phase: Infancy to Early Childhood
  notes: >-
    Onset is typically before age two with early-onset epilepsy and evolving
    intellectual disability; movement disorders, cerebral visual impairment, and
    brain atrophy are recurrent.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intellectual disability and early-onset epilepsy mostly occurring before the
      age of two years.
    explanation: >-
      Documents onset before age two.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with antiseizure medications; response is variable and
    can be severely refractory, with reported failure of more than eight agents
    in combination alongside ketogenic diet and steroid trials. No agent
    corrects the underlying SNARE-assembly defect, and no SNAP25-specific
    treatment has been established. The index myasthenic patient received
    levetiracetam to prevent seizures alongside 3,4-diaminopyridine, which
    shows antiseizure therapy may be needed in parallel with
    myasthenia-directed therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  target_mechanisms:
  - target: Central Synaptic Dysfunction
    treatment_effect: MODULATES
    description: >-
      Levetiracetam acts on the synaptic vesicle protein SV2A to dampen the
      cortical hyperexcitability arising from central synaptic dysfunction; it
      does not correct the underlying SNARE defect.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Intellectual disability and early-onset epilepsy were identified as the core symptoms of SNAP25-DEE, with recurrent findings of movement disorders, cerebral visual impairment, and brain atrophy."
    explanation: >-
      Establishes early-onset epilepsy as a core, near-universal feature of
      SNAP25-DEE, which is what antiseizure medication is directed at.
  - reference: PMID:25003006
    reference_title: "Mutation in SNAP25 as a novel genetic cause of epilepsy and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Seizures remain refractory to more than eight antiepileptic drugs in up to three drug combinations, as well as a ketogenic diet and intravenous methylprednisolone trials."
    explanation: >-
      Documents the severe end of the response range in the index SNAP25 case:
      failure of eight antiseizure drugs, ketogenic diet, and steroids.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy with 3,4-diaminopyridine, along with levetiracetam to prevent seizures, improved the patient’s strength but not her ataxia."
    explanation: Documents concurrent levetiracetam seizure prophylaxis in the management of the index CMS18 patient.
- name: Supportive and Developmental Care
  description: >-
    Multidisciplinary supportive care, including developmental therapies,
    nutritional and enteral feeding support, and vision support for cerebral
    visual impairment, is the mainstay.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Intellectual disability and early-onset epilepsy were identified as the core symptoms of SNAP25-DEE, with recurrent findings of movement disorders, cerebral visual impairment, and brain atrophy."
    explanation: >-
      Names the domains this supportive care covers - developmental impairment,
      movement disorder, and the cerebral visual impairment that vision support
      is directed at - as recurrent findings in the cohort.
  - reference: PMID:25003006
    reference_title: "Mutation in SNAP25 as a novel genetic cause of epilepsy and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "To optimize nutrition and increase her caloric intake, nasogastric feeds were started at 1 y of age followed shortly thereafter with gastrostomy tube placement."
    explanation: >-
      Illustrates the non-neurological supportive burden in a SNAP25 case:
      feeding failure requiring enteral and then gastrostomy feeding.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the de novo dominant mechanism: recurrence
    risk for the parents of an affected child is low but not zero (germline
    mosaicism cannot be excluded), while an affected individual would carry a
    50% transmission risk. Molecular subtype identification is itself
    therapeutically consequential in the congenital myasthenic syndromes,
    because a drug that helps one subtype can worsen another.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cohort comprises 23 individuals with pathogenic or likely pathogenic de novo variants in SNAP25."
    explanation: >-
      Every variant in the defining cohort arose de novo, which is the basis for
      counseling a low sibling recurrence risk.
  - reference: PMID:25003006
    reference_title: "Mutation in SNAP25 as a novel genetic cause of epilepsy and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Confirmatory sequencing and co-segregation analysis using automated fluorescence dideoxy sequencing revealed that the alteration was absent in the mother and father, establishing a de novo origin of the alteration."
    explanation: >-
      Shows the parental testing that establishes de novo origin in an
      individual family, which is the step counseling depends on.
  - reference: PMID:36379720
    reference_title: "Rapid genome sequencing identifies a novel de novo SNAP25 variant for neonatal congenital myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Precise diagnosis and molecular subtype identification are critical for treatment as medication for one subtype may exacerbate disease in another"
    explanation: Establishes why molecular subtype identification (and the genetic counseling that accompanies it) is clinically consequential in the congenital myasthenic syndromes.
- name: Amifampridine (3,4-Diaminopyridine)
  description: >-
    Amifampridine (3,4-diaminopyridine) is the mechanistically rational
    therapy for the myasthenic presentation. It blocks presynaptic voltage-gated potassium channels,
    prolonging the nerve terminal action potential and increasing calcium
    entry, which raises the number of acetylcholine quanta released per
    impulse and so directly counteracts the reduced release probability caused
    by the defective SNARE complex. In the index patient it improved strength,
    but it did not improve the ataxia - an important expectation-setting point,
    since the central nervous system components of the disorder are not corrected by
    a drug acting on presynaptic release at the neuromuscular junction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amifampridine
      term:
        id: CHEBI:135948
        label: amifampridine
  target_mechanisms:
  - target: Reduced Evoked Quantal Release at the Motor Endplate
    treatment_effect: RESTORES
    description: >-
      Potassium-channel blockade prolongs the presynaptic action potential and
      increases calcium influx, partially restoring the number of acetylcholine
      quanta released per nerve impulse.
  evidence:
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapy with 3,4-diaminopyridine, along with levetiracetam to prevent seizures, improved the patient’s strength but not her ataxia."
    explanation: Documents the observed benefit of 3,4-diaminopyridine on strength in CMS18, and its failure to improve the cerebellar ataxia.
  - reference: PMID:25792100
    reference_title: "Congenital myasthenic syndromes: pathogenesis, diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "3,4-diaminopyridine (3,4-DAP), a potassium channel blocker that enhances quantal release by prolonging the duration of the presynaptic action potential, and hence Ca2+ entry into the nerve terminal."
    explanation: Establishes the pharmacological mechanism by which 3,4-diaminopyridine enhances quantal release, the deficit that defines CMS18.

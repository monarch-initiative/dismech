name: SNAP25-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A developmental and epileptic encephalopathy caused by de novo variants in
  SNAP25, which encodes SNAP-25 (synaptosomal-associated protein 25), a core
  plasma-membrane (t-)SNARE that assembles with syntaxin-1 and synaptobrevin-2 to
  drive calcium-triggered synaptic vesicle fusion. Pathogenic missense and
  loss-of-function variants impair SNARE-complex function, reducing evoked
  neurotransmitter release. The core phenotype is intellectual disability and
  early-onset epilepsy (usually before age two), with recurrent movement
  disorders, cerebral visual impairment, and brain atrophy. It is one of the
  SNAREopathies and a synaptic vesicle cycle disorder, representing — with STXBP1,
  STX1B, and VAMP2 — the fusion-machinery arm of the cycle.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy
synonyms:
- SNAP25-DEE
- developmental and epileptic encephalopathy 117
- DEE117
- congenital myasthenic syndrome 18 (formerly)
- CMS18 (formerly)
disease_term:
  preferred_term: SNAP25-related developmental and epileptic encephalopathy
  term:
    id: MONDO:0014590
    label: congenital myasthenic syndrome 18
notes: >-
  The disease_term label reads "congenital myasthenic syndrome 18" only because
  that is MONDO:0014590's current canonical label, which term validation requires
  be reproduced verbatim. It is NOT a mis-binding: OMIM:616330 (to which
  MONDO:0014590 is equivalent) has been retitled "developmental and epileptic
  encephalopathy-117 (DEE117)", with "myasthenic syndrome, congenital, 18"
  retained only as a former title, and its OMIM definition is now the DEE
  description drawn from Klockner et al. 2021 (PMID:33299146) — the same cohort
  this entry curates. OMIM models one MIM number as one phenotype concept, so
  the myasthenic presentation is a variant-associated feature of this spectrum
  rather than a separate disease. MONDO triage concluded the two titles denote
  one concept, and a rename and re-parent of MONDO:0014590 has been proposed but
  not yet made (monarch-initiative/mondo#10532, still open); update this label if
  and when that lands. Do not "correct" the binding by moving it to
  MONDO:0032678, which is the unrelated GLS/glutaminase entity.

  Scope: because MONDO:0014590 denotes the whole OMIM:616330 concept, this entry
  formally spans the myasthenic presentation as well, but deliberately curates
  only the developmental and epileptic encephalopathy arm — the 23-patient
  Klockner cohort, in which most individuals had no prominent neuromuscular
  symptoms. The presynaptic myasthenic arm, described in the original SNAP25B
  p.Ile67Asn index case, is under-curated here and is not represented in the
  phenotypes below.

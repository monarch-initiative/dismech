      interactions, the molecular lesion of this node.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We attribute the deleterious effects of the mutation to disruption of the hydrophobic α-helical coiled-coil structure of the SNARE complex by replacement of a highly hydrophobic isoleucine by a strongly hydrophilic asparagine."
    explanation: Defines the molecular lesion as disruption of the hydrophobic coiled-coil packing of the SNARE complex.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "depolarization of bovine chromaffin cells transfected with mutant SNAP25B or with mutant plus wild-type SNAP25B markedly reduced depolarization-evoked exocytosis compared with wild-type transfected cells."
    explanation: Co-transfection of mutant with wild-type SNAP25B still impairs evoked exocytosis, demonstrating the dominant-negative mechanism.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, cells cotransfected with both wild-type and mutant SNAP25B exocytosed vesicles at the same reduced rate as cells transfected with only the mutant SNAP25B, indicating that the I67N mutation has a dominant-negative effect."
    explanation: Explicitly names the dominant-negative effect of the I67N allele on exocytosis.
  downstream:
  - target: Impaired SNARE-Mediated Vesicle Fusion
    causal_link_type: DIRECT
    description: >-
      A SNARE complex that cannot zipper into a stable coiled-coil cannot
      deliver the mechanical force required to fuse the synaptic vesicle with
      the presynaptic membrane on calcium entry.
    evidence:
    - reference: PMID:32559416
      reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Neuronal SNAREs and their key regulators together drive synaptic vesicle
        exocytosis and synaptic transmission as a single integrated membrane fusion
        machine.
      explanation: >-
        SNAP-25 is a core subunit of that single integrated fusion machine, so a
        SNAP-25 assembly defect degrades SNARE-mediated fusion directly.
    - reference: PMID:38411501
      reference_title: "SNAP25 disease mutations change the energy landscape for synaptic exocytosis due to aberrant SNARE interactions."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, the I67N mutant decreased mEPSC frequency and evoked EPSC amplitudes due to an increase in the height of the energy barrier for fusion, whereas the RRP size was unaffected."
      explanation: >-
        Links the structural destabilization of the SNARE complex directly to a
        raised energy barrier for fusion and reduced release, the immediate
        downstream consequence.
- name: Impaired SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  biological_scale: CELLULAR
  description: >-
    SNAP-25 is one of the three core SNAREs whose zippering, triggered by the
    calcium sensor synaptotagmin-1, fuses the synaptic vesicle with the presynaptic
    membrane. Impaired SNAP-25 function degrades SNARE-complex assembly and reduces
    calcium-triggered neurotransmitter release. This is the module's key conformance
    target — the fusion-machinery arm. With a defective SNAP-25B moiety, fusion
    is hindered even in a reconstituted liposome system, and
    depolarization-evoked release from dense-core vesicles in chromaffin cells
    is markedly reduced. The same defect operates at cholinergic motor nerve
    terminals and at central synapses, which is why the disorder can combine a
    neuromuscular transmission defect with its CNS phenotype.

      label: brain
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

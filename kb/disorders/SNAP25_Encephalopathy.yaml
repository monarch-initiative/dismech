        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:33299146
      reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The cohort comprises 23 individuals with pathogenic or likely
        pathogenic de novo variants in SNAP25.
      explanation: >-
        Every affected individual carried a de novo heterozygous variant, which
        is what establishes the dominant de novo mode of inheritance at this locus.
  notes: >-
    De novo heterozygous missense and loss-of-function variants in SNAP25 impair
    SNAP-25 function or its interaction with the other SNARE-complex components.
    SNAP25 (20p11.2) encodes synaptosomal-associated protein 25; the
    neuron-specific SNAP-25B splice isoform, which predominates in mature brain
    and at the motor nerve terminal, is the relevant transcript. The alleles
    reported with a myasthenic presentation are the index missense p.Ile67Asn
    in the coiled-coil interface and a nonsense c.529C>T (p.Gln177Ter) allele
    in a critically ill newborn.

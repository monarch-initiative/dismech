    causal_link_type: DIRECT
- name: Impaired SNARE-Mediated Vesicle Fusion
  conforms_to: "synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion"
  description: >-
    SNAP-25 is one of the three core SNAREs whose zippering, triggered by the
    calcium sensor synaptotagmin-1, fuses the synaptic vesicle with the presynaptic
    membrane. Impaired SNAP-25 function degrades SNARE-complex assembly and reduces
    calcium-triggered neurotransmitter release. This is the module's key conformance
    target — the fusion-machinery arm.
  role: central_effector
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: calcium-dependent activation of synaptic vesicle fusion
    term:
      id: GO:0099502
      label: calcium-dependent activation of synaptic vesicle fusion
    modifier: DECREASED
  - preferred_term: synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuronal SNAREs and their key regulators together drive synaptic vesicle
      exocytosis and synaptic transmission as a single integrated membrane fusion
      machine.
    explanation: >-
      Establishes SNAP-25 (a core SNARE) as part of the integrated fusion machine
      impaired in this disorder.
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Structural modeling for all variants predicted possible functional defects
      concerning SNAP25 or impaired interaction with other components of the SNARE
      complex.
    explanation: >-
      Links the disease variants specifically to impaired SNARE-complex function,
      the fusion step.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance and Seizures
    causal_link_type: DIRECT
- name: Cortical Excitation-Inhibition Imbalance and Seizures
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Reduced and imbalanced neurotransmitter release disturbs cortical
    excitatory/inhibitory balance, producing neuronal hyperexcitability and an
    early-onset epilepsy, together with impaired activity-dependent neurodevelopment
    manifesting as intellectual disability.
  role: effector

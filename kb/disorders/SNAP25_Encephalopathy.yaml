inheritance:
- name: Autosomal Dominant (De Novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The disorder arises from de novo heterozygous SNAP25 missense or
    loss-of-function variants, with unaffected parents. For the index
    myasthenic allele p.Ile67Asn the dominant behaviour is attributed to a
    dominant-negative effect of the mutant SNAP-25B subunit incorporated into
    SNARE complexes; whether other variants act by haploinsufficiency or
    dominant interference is unresolved (see gap_snap25_direction_of_effect).
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cohort comprises 23 individuals with pathogenic or likely pathogenic de
      novo variants in SNAP25.
    explanation: >-
      Establishes the de novo dominant genetic basis across a patient cohort.
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing identified a dominant de novo variant, p.Ile67Asn, in SNAP25B, a SNARE protein essential for exocytosis of synaptic vesicles from nerve terminals and of dense-core vesicles from endocrine cells."
    explanation: Establishes the dominant, de novo mode of inheritance of the index CMS18 allele.
pathophysiology:
- name: SNAP-25 SNARE Assembly Defect
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  biological_scale: MOLECULAR
  description: >-
    De novo missense and loss-of-function variants in SNAP25 impair SNAP-25, a core
    t-SNARE of the neuronal fusion machine. Structural modeling of disease variants
    predicts defects in SNAP-25 itself or in its interaction with the other SNARE
    components (syntaxin-1, synaptobrevin-2), degrading assembly of the SNARE
    complex that executes vesicle fusion. In the index myasthenic allele
    p.Ile67Asn, a highly hydrophobic isoleucine in the coiled-coil interface is
    replaced by a strongly hydrophilic asparagine, disrupting the hydrophobic
    packing of the four-helix SNARE bundle; because the mutant subunit is
    incorporated into complexes alongside wild-type SNAP-25B, co-expression of
    mutant with wild-type protein still markedly impairs evoked exocytosis, a
    dominant-negative effect. The same lesion acts at central synapses and at
    the motor nerve terminal.

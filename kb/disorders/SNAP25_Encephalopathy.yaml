name: SNAP25-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-06T00:00:00Z"
description: >-
  A disorder caused by de novo heterozygous variants in SNAP25, which encodes
  SNAP-25 (synaptosomal-associated protein 25), a core plasma-membrane
  (t-)SNARE that assembles with syntaxin-1 and synaptobrevin-2 into the
  coiled-coil SNARE complex that drives calcium-triggered synaptic vesicle
  fusion. Pathogenic missense and loss-of-function variants impair
  SNARE-complex function and reduce evoked neurotransmitter release. The core
  phenotype is intellectual disability and early-onset epilepsy (usually
  before age two), with recurrent movement disorders, cerebral visual
  impairment, and brain atrophy. Because SNAP-25 also operates at the motor
  nerve terminal, some patients have a presynaptic congenital myasthenic
  presentation (formerly congenital myasthenic syndrome 18, CMS18): the index
  p.Ile67Asn patient had fatigable weakness and ptosis together with cortical
  hyperexcitability, cerebellar ataxia, and intellectual disability, and
  endplate studies showed reduced evoked quantal release with normal endplate
  structure, a Lambert-Eaton-like release failure that responded to
  3,4-diaminopyridine. The reported range extends to a critically ill newborn
  with a de novo nonsense allele. OMIM now treats the encephalopathy and the
  myasthenic presentation as one phenotype (OMIM:616330, developmental and
  epileptic encephalopathy 117). The disorder is one of the SNAREopathies and
  a synaptic vesicle cycle disorder, representing, with STXBP1, STX1B, and
  VAMP2, the fusion-machinery arm of the cycle.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Epileptic Encephalopathy
- Congenital Myasthenic Syndrome
synonyms:
- SNAP25-DEE
- developmental and epileptic encephalopathy 117
- DEE117
- Congenital Myasthenic Syndrome 18

differential_diagnoses:
- name: Other SNAREopathies and synaptic vesicle cycle disorders
  description: >-
    Other SNARE-machinery and synaptic vesicle cycle disorders (STXBP1, STX1B,
    VAMP2, UNC13A) share early-onset epilepsy and developmental impairment and are
    distinguished by molecular testing.
  distinguishing_features:
  - A de novo SNAP25 variant favors this disorder.
  - A variant in another SNARE/vesicle-cycle gene favors the corresponding SNAREopathy.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These core symptoms and additional recurrent phenotypes show an overlap to
      genes encoding other components or associated proteins of the SNARE complex
      such as STX1B, STXBP1, or VAMP2.
    explanation: >-
      Establishes the overlapping SNAREopathy differential diagnosis.

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014590
      label: congenital myasthenic syndrome 18
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0014590 is equivalent to OMIM:616330, which OMIM has retitled
      developmental and epileptic encephalopathy 117 (DEE117), keeping
      myasthenic syndrome, congenital, 18 only as a former title. MONDO still
      labels the class congenital myasthenic syndrome 18 but carries SNAP25-DEE
      as a synonym, so the one class covers both the encephalopathy and the
      myasthenic presentation curated in this entry.
notes: >-
  The disease_term label reads "congenital myasthenic syndrome 18" only because
  that is MONDO:0014590's current canonical label, which term validation requires
  be reproduced verbatim. It is NOT a mis-binding: OMIM:616330 (to which
  MONDO:0014590 is equivalent) has been retitled "developmental and epileptic
  encephalopathy-117 (DEE117)", with "myasthenic syndrome, congenital, 18"
  retained only as a former title, and its OMIM definition is now the DEE
  description drawn from Klockner et al. 2021 (PMID:33299146). OMIM models one
  MIM number as one phenotype concept, so the myasthenic presentation is curated
  here as a variant-associated feature of this spectrum rather than as a
  separate disease. A rename and re-parent of MONDO:0014590 has been requested
  (monarch-initiative/mondo#10532, still open); update this label if and when
  that lands. Do not "correct" the binding by moving it to MONDO:0032678, which
  is the unrelated GLS/glutaminase entity.

  Scope limits. (1) The second reported myasthenic patient (Reynolds 2022,
  PMID:36379720, de novo p.Gln177Ter) is described in the source as a
  critically ill newborn, and the full text reports a neonatal course with
  respiratory failure. Only the abstract is cacheable through just
  fetch-reference - both the PMID and the DOI (10.1101/mcs.a006242) resolve to
  abstract_only, and the abstract states neither respiratory failure nor the
  outcome - so no respiratory phenotype is curated rather than quoting an
  unverifiable claim. This should be revisited if the PMC9808558 full text
  becomes cacheable. (2) No disease-specific prevalence figure exists; the
  ORPHA and UK rows bound the congenital myasthenic syndrome family and are
  graded INDIRECT. (3) No decremental-response phenotype is curated: the index
  patient's transmission defect was demonstrated by in vitro microelectrode
  studies, and neither primary report on the myasthenic presentation documents
  a decrement on repetitive nerve stimulation. (4) The cached Klockner cohort
  report does not describe neuromuscular findings, so how often the myasthenic
  component occurs across the encephalopathy cohort is unknown; see
  gap_cms18_dee_nosological_boundary.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; precise population prevalence not established. The defining
    international encephalopathy cohort, assembled through collaboration,
    matchmaking platforms, and literature review, comprised 23 individuals,
    and only a small number of individually reported patients have a
    documented myasthenic phenotype. Congenital myasthenic syndromes as a
    family sit in the Orphanet 1-9 per 1,000,000 point-prevalence band - a
    contemporary UK national cohort of genetically confirmed cases put it at
    6.5 per million overall - and SNAP25-CMS is one of the rarest subtypes
    within that family, dwarfed by CHRNE, DOK7, and RAPSN.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cohort comprises 23 individuals with pathogenic or likely
      pathogenic de novo variants in SNAP25.
    explanation: >-
      Gives the case count behind the ultra-rare classification: 23 individuals
      assembled worldwide through international matchmaking and literature review.
  - reference: ORPHA:590
    reference_title: "Congenital myasthenic syndrome"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "1-9 / 1 000 000 | Europe | Point prevalence | EXPERT"
    explanation: >-
      Orphanet point-prevalence class for congenital myasthenic syndrome as a
      whole. Indirect because no subtype-specific prevalence figure for
      CMS18 has been reported; the CMS-family figure is an upper bound and CMS18
      is one of the rarest subtypes within it.
  - reference: PMID:41251564
    reference_title: "Prevalence and Geographical Distribution of Patients With Congenital Myasthenic Syndromes in the United Kingdom."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The UK prevalence was 6.5 cases per million overall and 8.5 cases per million in the pediatric population."
    explanation: >-
      Contemporary genetically confirmed UK prevalence for congenital myasthenic
      syndromes as a whole, from a 442-patient national cohort in which CHRNE,
      DOK7, and RAPSN were the commonest subtypes. Indirect for the same
      reason as the Orphanet row: it bounds, but does not measure, the CMS18
      subtype rate.

pathophysiology:
- name: SNAP-25 SNARE Assembly Defect
  conforms_to: "synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency"
  description: >-
    De novo missense and loss-of-function variants in SNAP25 impair SNAP-25, a core
    t-SNARE of the neuronal fusion machine. Structural modeling of disease variants
    predicts defects in SNAP-25 itself or in its interaction with the other SNARE
    components (syntaxin-1, synaptobrevin-2), degrading assembly of the SNARE
    complex that executes vesicle fusion.
  role: trigger

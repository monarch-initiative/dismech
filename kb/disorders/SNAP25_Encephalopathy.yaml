      explanation: >-
        Documents the clinical fluctuating (fatigable) weakness that results from the
        impaired neuromuscular transmission in the index CMS18 patient.
- name: Central Synaptic Dysfunction
  biological_scale: CELLULAR
  description: >-
    SNAP-25B is the dominant SNAP-25 isoform in the mature brain, so the same
    exocytosis defect operates at central synapses. Impaired
    calcium-triggered release at cortical, cerebellar, and other CNS synapses
    produces the central components seen alongside the myasthenia in the index
    myasthenic patient - cerebral cortical hyperexcitability, cerebellar
    ataxia, and intellectual disability - which are not features of most other
    presynaptic congenital myasthenic syndromes. This node carries the
    cerebellar and cognitive outcomes and the cortical hyperexcitability seen
    on EEG in the index patient; clinical epilepsy is carried by the cortical
    excitation-inhibition node.
  cell_types:
  - preferred_term: Central nervous system neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Synaptic vesicle exocytosis
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:25381298
    reference_title: "Mutant SNAP25B causes myasthenia, cortical hyperexcitability, ataxia, and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis."
    explanation: >-
      States the study's conclusion that the SNAP25B p.Ile67Asn variant acts by
      inhibiting synaptic vesicle exocytosis - the release defect this node
      applies at central synapses, where SNAP-25B is the dominant isoform. The
      CNS manifestations themselves are carried by the companion item below.
  - reference: PMID:29355968
    reference_title: "The unfolding landscape of the congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because synaptic proteins subserving exocytosis are also present in the brain, some affected patients also show abnormal cortical electrical activity and impaired cognitive development."
    explanation: States the mechanistic reason the presynaptic release machinery defect produces CNS as well as neuromuscular manifestations.
  downstream:
  - target: Cerebral Cortical Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      Impaired regulation of transmitter release in cortical circuits produces
      the epileptiform cortical activity seen in CMS18.
    evidence:

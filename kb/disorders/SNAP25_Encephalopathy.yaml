discussions:
- discussion_id: gap_snap25_direction_of_effect
  prompt: >-
    For a given pathogenic SNAP25 variant, what determines whether it acts by
    simple loss of function (haploinsufficiency, reduced evoked release) versus a
    dominant-negative or gain-of-function mechanism (altered SNARE zippering or
    increased complex-binding affinity), and does the direction of effect predict
    the clinical subphenotype (DEE versus milder intellectual disability versus
    ataxic or myasthenic features)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SNAP-25 SNARE Assembly Defect
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  rationale: >-
    SNAP25-DEE is caused by a mix of missense and loss-of-function de novo
    variants, but structural modeling in the defining cohort could only predict
    "possible functional defects" without resolving whether release is reduced by
    haploinsufficiency or by a dominant-negative variant that is incorporated into
    the SNARE complex and poisons it. The blind-drunk mouse shows that a SNAP-25
    missense change can act paradoxically by *increasing* SNARE-complex binding
    affinity rather than abolishing it, so direction of effect cannot be assumed
    from the variant class alone. This matters therapeutically: allele-silencing
    or protein-replacement strategies help only true loss of function, whereas a
    dominant-negative allele may need selective knockdown of the mutant transcript.
  evidence:
  - reference: PMID:33299146
    reference_title: "De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Structural modeling for all variants predicted possible functional defects
      concerning SNAP25 or impaired interaction with other components of the SNARE
      complex.
    explanation: >-
      Shows that the human cohort establishes disruption of SNAP-25 or its SNARE
      interactions but does not resolve the direction of effect (loss versus
      dominant-negative) for individual variants.
  - reference: PMID:17283335
    reference_title: "A dominant mutation in Snap25 causes impaired vesicle trafficking, sensorimotor gating, and ataxia in the blind-drunk mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The causative I67T missense mutation results in increased binding affinities
      within the SNARE complex, impaired exocytotic vesicle recycling and granule
      exocytosis in pancreatic beta-cells, and a reduction in the amplitude of
      evoked cortical excitatory postsynaptic potentials.
    explanation: >-
      Demonstrates that a SNAP-25 missense variant can act by increasing, not
      abolishing, SNARE-complex binding affinity, showing the direction of effect
      is not predictable from variant class and motivating the gap.
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We argue that disease severity generally scales with functional redundancy
    explanation: >-
      Frames the SNAREopathy expectation that mechanism and severity vary with
      redundancy, supporting the need to resolve per-variant direction of effect.
  proposed_experiments:
  - experiment_id: exp_snap25_variant_direction_release_panel
    name: SNAP25 variant direction-of-effect release panel
    description: >-
      Express representative SNAP25 DEE variants (missense and loss-of-function) in
      Snap25-null neurons alone and co-expressed with wild-type SNAP-25 in an
      isogenic background, then measure evoked release and SNARE-complex assembly
      to classify each variant as loss-of-function versus dominant-negative.
    experiment_type:
      preferred_term: variant functional-classification and rescue experiment
    perturbations:
    - name: SNAP25 variant expression on null background
      target: pathophysiology#SNAP-25 SNARE Assembly Defect
      genes:
      - preferred_term: SNAP25
        term:
          id: hgnc:11132
          label: SNAP25
      description: >-
        Introduce each DEE variant into Snap25-null neurons, with and without
        co-expressed wild-type SNAP-25, to test for haploinsufficiency versus
        dominant interference.
    readouts:
    - name: Evoked release and SNARE assembly
      target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: calcium-dependent activation of synaptic vesicle fusion
        term:
          id: GO:0099502
          label: calcium-dependent activation of synaptic vesicle fusion
        modifier: DECREASED
      - preferred_term: synaptic vesicle exocytosis
        term:
          id: GO:0016079
          label: synaptic vesicle exocytosis
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology assay
      - preferred_term: co-immunoprecipitation assay
      direction: NEGATIVE
    controls:
    - name: Wild-type SNAP-25 rescue
      description: Snap25-null neurons rescued with wild-type human SNAP-25.
    - name: Null baseline
      description: Snap25-null neurons without rescue as the loss-of-function floor.
    decision_criterion: >-
      A variant is loss-of-function if it fails to restore evoked release on the
      null background and does not depress wild-type-mediated release when
      co-expressed; it is dominant-negative if co-expression with wild-type
      SNAP-25 reduces release below the wild-type-only level.
    would_support:
    - pathophysiology#SNAP-25 SNARE Assembly Defect
    - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion

- discussion_id: gap_snap25_channel_modulation_vs_release_failure
  prompt: >-
    How much of the cortical hyperexcitability and seizure phenotype in
    SNAP25-DEE arises from impaired calcium-triggered vesicle fusion (release
    failure) versus SNAP-25's separable, non-fusion modulation of presynaptic
    voltage-gated calcium and potassium channels (a channelopathy-like change in
    intrinsic excitability)?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
  - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
  rationale: >-
    The curated causal chain routes the phenotype through reduced SNARE-mediated
    release, but SNAP-25 has well-described roles beyond exocytosis, including
    negative modulation of voltage-gated calcium channels and interactions that
    tune neuronal excitability. Because DEE variants sit in the same protein that
    performs both jobs, the seizure phenotype could reflect a release deficit, a
    channelopathy-like intrinsic-excitability shift, or both — and the balance may
    differ by variant and neuron type. Distinguishing these arms is needed before
    excitability-targeted therapy is rationalized, and it is not resolved by the
    current release-centric evidence.
  evidence:
  - reference: PMID:17283335
    reference_title: "A dominant mutation in Snap25 causes impaired vesicle trafficking, sensorimotor gating, and ataxia in the blind-drunk mouse."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The causative I67T missense mutation results in increased binding affinities
      within the SNARE complex, impaired exocytotic vesicle recycling and granule
      exocytosis in pancreatic beta-cells, and a reduction in the amplitude of
      evoked cortical excitatory postsynaptic potentials.
    explanation: >-
      Documents that a SNAP-25 variant reduces evoked cortical release (the fusion
      arm) but does not measure the channel-modulation contribution to
      excitability, leaving the relative weighting open.
  - reference: PMID:32559416
    reference_title: "SNAREopathies: Diversity in Mechanisms and Symptoms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      subtle differences in components being rate limiting in different types of
      neurons helps to explain the main symptoms.
    explanation: >-
      Supports the expectation that SNARE-component effects are neuron-type
      dependent, consistent with a mixed release-plus-excitability contribution
      that must be disentangled.
  proposed_experiments:
  - experiment_id: exp_snap25_release_vs_intrinsic_excitability
    name: SNAP25 release versus intrinsic-excitability dissection
    description: >-
      In neurons expressing SNAP25 DEE variants, separately quantify evoked
      synaptic release and cell-autonomous intrinsic excitability (voltage-gated
      calcium and potassium current density, action-potential threshold and
      firing) to apportion the excitability change between fusion failure and
      channel modulation.
    experiment_type:
      preferred_term: electrophysiological mechanism-dissection experiment
    perturbations:
    - name: SNAP25 DEE variant expression
      target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      genes:
      - preferred_term: SNAP25
        term:
          id: hgnc:11132
          label: SNAP25
      description: >-
        Express DEE variants in neurons and compare against wild-type SNAP-25 and
        null controls.
    readouts:
    - name: Evoked synaptic transmission
      target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      biological_processes:
      - preferred_term: chemical synaptic transmission
        term:
          id: GO:0007268
          label: chemical synaptic transmission
        modifier: DECREASED
      assays:
      - preferred_term: patch-clamp electrophysiology assay
      direction: NEGATIVE
    - name: Intrinsic excitability and channel currents
      target: pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
      assays:
      - preferred_term: voltage-clamp current-density assay
      - preferred_term: current-clamp firing assay
      direction: POSITIVE
    controls:
    - name: Wild-type SNAP-25
      description: Neurons expressing wild-type SNAP-25.
    - name: Snap25-null
      description: Null neurons isolating the loss-of-function reference.
    decision_criterion: >-
      The channel-modulation arm is supported if DEE variants shift intrinsic
      excitability (altered calcium or potassium current density, firing, or
      threshold) beyond what is accounted for by the measured reduction in evoked
      release; otherwise the phenotype is release-dominated.
    would_support:
    - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
    - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures

- discussion_id: gap_snap25_mouse_model_human_dee_fidelity
  prompt: >-
    Do existing Snap25 point-mutant mouse models, which reproduce ataxia,
    sensorimotor-gating deficits, and reduced cortical release, faithfully model
    the human SNAP25-DEE trajectory of before-age-two epileptic encephalopathy

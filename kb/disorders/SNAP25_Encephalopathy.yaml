  rationale: >-
    The strongest mechanistic in vivo evidence for SNAP-25 dysfunction comes from
    the blind-drunk I67T mouse, whose overt phenotype is ataxia and impaired
    sensorimotor gating with reduced evoked cortical release — features linked to
    psychiatric rather than epileptic disease. Human SNAP25-DEE, by contrast, is
    defined by early-onset epilepsy and intellectual disability with onset mostly
    before age two. Whether the mouse recapitulates the human epileptic
    encephalopathy trajectory, or only the synaptic and motor substrate, is the
    open translational question; this determines whether the model is a valid
    platform for testing DEE-directed therapies.

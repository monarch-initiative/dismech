    explanation: Links variant instability to reduced enzyme content and reduced ATP production.
  - reference: PMID:30111548
    reference_title: Level of residual enzyme activity modulates the phenotype in phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case series study of PGK1 deficiency suggests that the level of
      impaired glycolysis in PGK deficiency is a major determinant of phenotype.
    explanation: Human data place impaired glycolysis at the center of the phenotype.
  downstream:
  - target: Erythrocyte ATP Depletion and 2,3-BPG Accumulation

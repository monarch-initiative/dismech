- name: Rightward Shift of the Oxygen-Hemoglobin Dissociation Curve
  description: >-
    The 2,3-bisphosphoglycerate excess lowers hemoglobin oxygen affinity, so
    oxygen is released to tissues at higher tension. Outside hemolytic crises
    this offsets much of the loss of oxygen-carrying capacity from the anemia.
  role: compensation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:

      lactate increase (Figure B), while NH3 showed a normal increase.
    explanation: Functional evidence of a muscle glycolytic block with preserved ammonia response.
  - reference: PMID:30111548
    reference_title: Level of residual enzyme activity modulates the phenotype in phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

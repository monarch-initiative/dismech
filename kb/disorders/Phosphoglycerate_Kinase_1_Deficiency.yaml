- name: Neuronal Energy Failure
  description: >-
    The neurological syndrome is attributed to inadequate glycolytic ATP supply
    in the central nervous system, possibly because neural tissue does not
    replace the unstable enzyme quickly enough. This is supported by a
    Drosophila PGK mutant with reduced brain ATP, seizures and a later loss of
    synaptic transmission. Brain ATP has not been measured in patients, and
    neurological disease is associated with unstable variants that are only
    mildly impaired catalytically.

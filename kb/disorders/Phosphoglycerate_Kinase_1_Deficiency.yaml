discussions:
- discussion_id: gap_pgk1_tissue_selectivity
  prompt: >-
    Why do variants in a ubiquitously expressed enzyme produce hemolysis alone,
    myopathy alone, or central nervous system disease in different patients,
    and why does the same variant (p.Thr378Pro) cause isolated myopathy in one
    man and myopathy with parkinsonism in another?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Glycolytic ATP Generation
  - pathophysiology#Neuronal Energy Failure
  - mechanistic_hypotheses#pgk1_residual_glycolytic_capacity_model
  rationale: >-
    Molecular stability and catalytic data correlate with tissue pattern for
    some variant classes but not others, and the authors of the largest study
    point to environmental, genetic and epigenetic modifiers. A co-inherited
    NUBPL disruption worsened one PGK1 phenotype, which shows that modifiers
    exist. Resolving this decides whether a patient's neurological prognosis
    can be predicted from genotype.
  evidence:
  - reference: PMID:17222195
    reference_title: PGK deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The reason for different clinical manifestations of mutations of the same
      gene remains unknown.
    explanation: States the gap directly.
  - reference: PMID:22348148
    reference_title: Molecular insights on pathogenic effects of mutations causing phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Different (environmental, metabolic, genetic and/or epigenetic)
      intervening factors can contribute toward the expression of PGK deficient
      clinical phenotypes.
    explanation: Names candidate modifier classes.
  - reference: PMID:25814383
    reference_title: "Clinical Severity of PGK1 Deficiency Due To a Novel p.E120K Substitution Is Exacerbated by Co-inheritance of a Subclinical Translocation t(3;14)(q26.33;q12), Disrupting NUBPL Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, its co-inheritance presumably exacerbates PGK1-deficient
      phenotype, most likely due to a synergistic interaction of the affected
      genes both involved in cell energy supply.
    explanation: A worked example of a genetic modifier of severity.
- discussion_id: gap_pgk1_heterozygote_parkinson_susceptibility
  prompt: >-
    Do heterozygous PGK1 variants increase susceptibility to early-onset or
    sporadic Parkinson disease, given parkinsonism in one heterozygous mother
    with normal red-cell activity and the location of PGK1 within the PARK12
    linkage interval?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Dysfunction
  rationale: >-
    The evidence is one pedigree and a linkage-region coincidence. Sequencing
    PGK1 in early-onset Parkinson disease cohorts, as both reporting groups
    propose, would settle it.

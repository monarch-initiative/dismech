mechanistic_hypotheses:
- hypothesis_group_id: pgk1_residual_glycolytic_capacity_model
  hypothesis_label: Residual glycolytic capacity determines tissue involvement
  status: EMERGING
  description: >-
    The degree to which glycolytic flux is lost, set by the combined effect of
    a variant on catalytic efficiency and on protein stability, determines
    which tissues fail. In a case series, the lowest residual activity
    accompanied multisystem disease and the smallest ischemic lactate rise. The
    model does not account for every genotype: some variants with mild
    molecular defects produce broad phenotypes, and one recurrent variant has
    produced both isolated myopathy and myopathy with parkinsonism.
  evidence:
  - reference: PMID:30111548
    reference_title: Level of residual enzyme activity modulates the phenotype in phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower glycolytic capacity in PGK1 deficiency seems to result in
      multisystem involvement and increased susceptibility to exertional
      rhabdomyolysis.
    explanation: >-
      Human exercise physiology relates lower residual glycolytic capacity to
      multisystem rather than purely myopathic disease.
  - reference: PMID:22348148
    reference_title: Molecular insights on pathogenic effects of mutations causing phosphoglycerate kinase deficiency.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: >-
      However, the clinical symptoms can not be understood only on the bases of
      molecular properties of the mutant enzyme.
    explanation: >-
      The largest recombinant-enzyme study finds that molecular properties
      alone do not predict the tissue pattern, so the model is incomplete.
- hypothesis_group_id: pgk1_2_3_bpg_hemolysis_model
  hypothesis_label: 2,3-bisphosphoglycerate excess as the proximate cause of hemolysis
  status: ALTERNATIVE
  description: >-
    Rather than ATP shortfall alone, hemolysis may follow from intracellular
    acidification and inhibition of other glycolytic enzymes by the raised
    erythrocyte 2,3-bisphosphoglycerate concentration. This is offered as a
    suggestion in the source rather than a demonstrated mechanism.
  evidence:
  - reference: PMID:22348148
    reference_title: Molecular insights on pathogenic effects of mutations causing phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      that the true cause of the hemolysis is better ascribable to an increase of acidity or
      inhibition of several glycolytic enzymes (such as hexokinase,
      phosphofructo kinase, and pyruvate kinase) as a consequence of an increased
      intracellular concentration of 2,3-BPG
    explanation: >-
      States the alternative hemolysis mechanism, in explicitly conjectural
      language.
pathophysiology:
- name: PGK1 Enzyme Instability and Catalytic Deficiency
  description: >-
    Hemizygous PGK1 variants in males reduce phosphoglycerate kinase activity,
    most often by lowering the kinetic stability of the enzyme so that it
    denatures quickly at body temperature, and to a variable extent by impairing
    catalysis. Residual activity is retained in every reported patient;
    complete loss-of-function alleles have not been observed, which suggests
    that some PGK1 function is needed for male viability.
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  genes:
  - preferred_term: PGK1
    term:
      id: hgnc:8896
      label: PGK1
  molecular_functions:
  - preferred_term: phosphoglycerate kinase activity
    term:
      id: GO:0004618
      label: phosphoglycerate kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30887539
    reference_title: "Phosphoglycerate kinase deficiency: A nationwide multicenter retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphoglycerate kinase (PGK) deficiency is a rare X-linked metabolic
      disorder caused by mutations in the PGK1 gene.
    explanation: Establishes PGK1 as the causal gene and X-linked transmission.
  - reference: PMID:22348148
    reference_title: Molecular insights on pathogenic effects of mutations causing phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Most mutations heavily affect thermal stability and to a different extent
      catalytic efficiency, in line with the remarkably low PGK activity
      clinically observed in the patients.
    explanation: >-
      Recombinant characterization of 16 disease variants shows that instability
      and catalytic impairment together account for the low enzyme activity.
  - reference: PMID:23336698
    reference_title: Structural and energetic basis of protein kinetic destabilization in human phosphoglycerate kinase 1 deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Kinetic analysis of differential scanning calorimetry profiles shows that
      the disease-causing mutations decrease PGK1 kinetic stability from ~5-fold
      (E252A) to ~100000-fold (L89P) compared to that of wild-type PGK1, and in
      some cases, mutant enzymes are denatured on a time scale of a few minutes
      at physiological temperature.
    explanation: Quantifies the kinetic destabilization of disease variants.
  - reference: PMID:30570712
    reference_title: A Hemizygous Deletion Within the PGK1 Gene in Males with PGK1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete loss-of-function variants have not been reported in this gene,
      indicating that residual enzyme function is critical for viability in
      males.
    explanation: Supports modelling the trigger as a partial rather than complete loss of function.
  downstream:
  - target: Reduced Glycolytic ATP Generation
    causal_link_type: DIRECT
    description: >-
      PGK1 catalyzes the first ATP-yielding step of glycolysis, so loss of its
      activity reduces glycolytic ATP production.
- name: Reduced Glycolytic ATP Generation
  description: >-
    Reduced PGK1 activity lowers flux through the lower half of glycolysis and
    the ATP it yields. Tissues differ in how much this matters: mature
    erythrocytes have no mitochondria and depend on glycolysis entirely,
    skeletal muscle depends on it during brief intense or ischemic exertion,
    and neurons may fail to replace unstable enzyme fast enough. How severe the
    loss of flux is in a given patient is associated with which tissues are
    affected.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: DECREASED

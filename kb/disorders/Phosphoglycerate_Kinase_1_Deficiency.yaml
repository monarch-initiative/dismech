- name: Skeletal Muscle Glycolytic Failure During Exertion
  description: >-
    During brief intense or ischemic exercise, skeletal muscle with low PGK1
    activity cannot raise glycolytic flux. Lactate output on forearm testing is
    blunted, while ammonia rises normally, and the energy shortfall precipitates
    cramps, myalgia and fiber breakdown. Most reported myopathy-only variants
    impair both stability and catalysis.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

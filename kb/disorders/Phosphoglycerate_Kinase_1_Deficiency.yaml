name: Phosphoglycerate Kinase 1 Deficiency
category: Mendelian
creation_date: "2026-10-01T00:00:00Z"
synonyms:
- PGK deficiency
- PGK1 deficiency
- Phosphoglycerate kinase deficiency
- Phosphoglycerate kinase 1 deficiency, X-linked recessive
- Glycogen storage disease due to phosphoglycerate kinase 1 deficiency
- GSD due to phosphoglycerate kinase 1 deficiency
- PGK1 glycogen storage disease
description: >-
  Phosphoglycerate kinase 1 deficiency is an X-linked recessive glycolytic
  disorder caused by hemizygous pathogenic variants in PGK1. PGK1 catalyzes the
  first ATP-generating step of glycolysis, the transfer of phosphate from
  1,3-bisphosphoglycerate to ADP, and is expressed in all somatic tissues.
  Affected males show variable combinations of three tissue syndromes, and rarely
  all three: chronic nonspherocytic hemolytic anemia; a metabolic myopathy with
  exercise intolerance, cramps and exertional rhabdomyolysis with myoglobinuria;
  and central nervous system involvement including intellectual disability,
  seizures, stroke-like and encephalopathic episodes, retinal dystrophy and
  early-onset levodopa-responsive parkinsonism. Most pathogenic variants reduce
  the kinetic stability of the enzyme as well as, to different degrees, its
  catalytic efficiency, and complete loss-of-function alleles have not been
  observed. Which tissue is affected is not fully explained by the molecular
  properties of the mutant enzyme, although lower residual glycolytic capacity
  is associated with multisystem disease. Red cells accumulate
  2,3-bisphosphoglycerate, which right-shifts the oxygen-hemoglobin
  dissociation curve and partly offsets the anemia. Some heterozygous women
  are affected, through reduced red-cell activity or, in one reported mother,
  parkinsonism. There is no disease-specific therapy; management is supportive
  (transfusion, levodopa for parkinsonism, avoidance of strenuous exercise), and
  hematopoietic cell transplantation has been attempted in a few children.

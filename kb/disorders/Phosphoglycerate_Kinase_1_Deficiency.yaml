    reference_title: Molecular insights on pathogenic effects of mutations causing phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, an increased degradation rate of such variants leads to a decreased
      PGK1 content which primarily accounts for the enzyme deficiency and in

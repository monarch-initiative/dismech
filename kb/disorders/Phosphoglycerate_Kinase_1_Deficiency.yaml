genetic:
- name: PGK1
  gene_term:
    preferred_term: PGK1
    term:
      id: hgnc:8896
      label: PGK1
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
    evidence:
    - reference: PMID:30887539
      reference_title: "Phosphoglycerate kinase deficiency: A nationwide multicenter retrospective study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Phosphoglycerate kinase (PGK) deficiency is a rare X-linked metabolic
        disorder caused by mutations in the PGK1 gene.
      explanation: X-linked PGK1 causation.
  features: >-
    Mostly missense variants, with splice-site, in-frame deletion and one
    3' UTR polyadenylation-site deletion also reported. The recurrent
    c.491A>T (p.Asp164Val; PGK Amiens/New York) arose independently in
    several families and is associated with hemolysis, epilepsy and
    parkinsonism. p.Thr378Pro has been reported both as isolated myopathy and
    as myopathy with parkinsonism.
  evidence:
  - reference: PMID:16740138
    reference_title: The identification of a recurrent phosphoglycerate kinase mutation associated with chronic haemolytic anaemia and neurological dysfunction in a family from USA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis of the c. 91A --> T mutation indicated that this was a
      recurrent mutation.
    explanation: Establishes p.Asp164Val as a recurrent rather than founder allele.
  - reference: PMID:30570712
    reference_title: A Hemizygous Deletion Within the PGK1 Gene in Males with PGK1 Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first deletion reported in the PGK1 gene and is the first
      pathogenic variant involving the 3'UTR polyadenylation site of this gene.
    explanation: Documents a noncoding structural variant reducing PGK1 transcript.
  - reference: PMID:20151463
    reference_title: Myopathy and parkinsonism in phosphoglycerate kinase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      molecular analysis of the PGK1 gene identified the p.T378P mutation that
      was recently reported in a patient with isolated myopathy
    explanation: The same variant gives isolated myopathy in one patient and myopathy with parkinsonism in another.

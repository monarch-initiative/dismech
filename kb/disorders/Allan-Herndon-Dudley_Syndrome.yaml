    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment with anti-seizure medication by an experienced

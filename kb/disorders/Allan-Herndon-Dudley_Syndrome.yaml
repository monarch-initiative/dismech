name: Allan-Herndon-Dudley Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- MCT8 deficiency
- monocarboxylate transporter 8 deficiency
- MCT8-specific thyroid hormone cell membrane transporter deficiency
- AHDS
description: >-
  An X-linked disorder of thyroid hormone cell-membrane transport caused by
  loss-of-function variants in SLC16A2, which encodes monocarboxylate
  transporter 8 (MCT8). Because MCT8 is the rate-limiting route for
  triiodothyronine (T3) entry across the blood-brain barrier and into
  MCT8-dependent neurons, but is dispensable in liver, heart, and skeletal
  muscle, a single transporter defect produces two opposite hormonal states at
  once: cerebral hypothyroidism (severe intellectual disability, hypotonia
  evolving to spastic quadriplegia, dystonia, absent speech, delayed
  myelination) alongside peripheral thyrotoxicosis (hypermetabolism, failure to
  thrive, muscle wasting, tachycardia). The signature serum pattern is high T3
  with low or low-normal free T4 and a normal or only mildly elevated TSH.
disease_term:
  preferred_term: Allan-Herndon-Dudley syndrome
  term:
    id: MONDO:0010354
    label: Allan-Herndon-Dudley syndrome
parents:
- X-linked intellectual disability
- Thyroid hormone transport defect
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      AHDS is a genetic disorder of thyroid hormone transport with a
      pathognomonic thyroid function test pattern (high T3, low free T4,
      non-suppressed TSH), placing it in the endocrinology and metabolism
      domain.
  - classification_value: NEUROLOGIC
    notes: >-
      The dominant clinical burden is neurological - severe intellectual
      disability, hypotonia evolving to spastic tetraplegia, extrapyramidal
      movement disorder, and hypomyelination - so the disorder is also curated
      under the neurologic chapter.
notes: >-
  Module conformance is deliberately partial. Only the cerebral arm of AHDS
  declares conforms_to against
  hypothyroidism_thyroid_hormone_deficiency#Reduced Thyroid Hormone Action at
  Peripheral Sites, because that is the one conserved step AHDS genuinely
  reproduces: a target tissue receives an inadequate thyroid hormone stimulus
  and its thyroid-hormone-dependent developmental program fails. AHDS does NOT
  conform to the module's other four nodes, and asserting that it did would be
  wrong. Thyroid hormone synthesis is normal (there is no gland lesion);
  circulating hormone is not deficient (serum T3 is elevated, so the module's
  "Thyroid Hormone Insufficiency" node is inverted); and the systemic state is
  hypermetabolic rather than hypometabolic, inverting both "Decreased Metabolic
  Rate" and "Systemic Hypometabolic State". AHDS is therefore a transport
  defect producing tissue-selective, not systemic, hormone deficiency, and the
  peripheral arm of this entry is the mechanistic opposite of the module.
  This partial fit is the clinically important teaching point and the reason
  levothyroxine replacement fails: it treats the module's chain, not the
  transport lesion.

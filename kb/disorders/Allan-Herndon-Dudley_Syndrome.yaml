diagnosis:
- name: Serum thyroid function testing (T3, free T4, TSH)
  description: >-
    The diagnostic entry point is a serum thyroid panel that INCLUDES T3. After
    about four months of age the profile is a characteristic fingerprint:
    elevated free or total T3, low or low-normal free T4, and a normal or only
    slightly elevated TSH. Because T3 is not part of routine paediatric thyroid
    testing, the single most common obstacle to diagnosis outside the newborn
    period is simply that serum T3 is never measured. Only resistance to thyroid
    hormone alpha produces a similar pattern, so the biochemistry narrows the
    differential to two disorders before any sequencing is done.
  diagnosis_term:
    preferred_term: thyroid function testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Elevated T3 with low or low-normal free T4 and a normal or mildly elevated
    TSH, giving an increased T3/T4 ratio. An elevated T3 in a boy with
    unexplained developmental delay should trigger confirmatory SLC16A2
    sequencing.
  markers: T3, free T4, TSH, T3/T4 ratio, reverse T3, SHBG
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      elevated T3 with low FT4 and normal or slightly elevated TSH
    explanation: >-
      States the characteristic thyroid hormone profile on which the clinical
      diagnosis rests.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Outside of the newborn period, the most common obstacle to diagnosis is
      the infrequent assessment of serum T3
    explanation: >-
      Identifies failure to measure serum T3 as the dominant cause of diagnostic
      delay, which is why this test is listed first.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tri-iodothyronine concentrations were above the age-specific upper limit
      in 96 (95%) of 101 patients and free thyroxine concentrations were below
      the age-specific lower limit in 94 (89%) of 106 patients.
    explanation: >-
      Quantifies the sensitivity of the biochemical pattern in the largest
      genetically confirmed cohort, and shows the comparison must be against
      age-specific limits.
  - reference: PMID:38963712
    reference_title: "2024 European Thyroid Association Guidelines on diagnosis and management of genetic disorders of thyroid hormone transport, metabolism and action."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      challenges include ruling out other causes of biochemical discordance
    explanation: >-
      The 2024 ETA guideline frames the diagnostic task as excluding other
      causes of discordant thyroid function tests before attributing the pattern
      to a transport defect.
- name: Molecular genetic testing of SLC16A2
  description: >-
    Molecular confirmation is required. In a male proband with suggestive
    findings the diagnosis is established by a hemizygous SLC16A2 pathogenic
    variant; in a female proband by a heterozygous variant. Testing may be
    gene-targeted (single-gene testing or a multigene panel) or comprehensive
    (exome or genome sequencing); when a panel or comprehensive test is ordered
    it is essential to verify that SLC16A2 is actually sequenced and reported.
    Because the variant spectrum is still expanding, previously non-diagnostic
    sequencing should be periodically reanalysed.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A hemizygous (male) or heterozygous (female) pathogenic SLC16A2 variant
    establishes the diagnosis.
  evidence:
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of AHDS is established in a male proband with suggestive
      findings and a hemizygous SLC16A2 pathogenic variant identified by
      molecular genetic testing, and in a female proband by identification of a
      heterozygous pathogenic variant in SLC16A2.
    explanation: >-
      GeneReviews DIAGNOSIS/TESTING statement defining how the diagnosis is
      established in each sex.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The strategy for genetic testing can be gene-targeted (single-gene testing
      or multigene panels, including custom-designed panels) or comprehensive
      (whole exome sequencing, exome array, or whole genome sequencing)
    explanation: Documents the tiered testing strategy.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      sequencing test results that previously did not lead to a diagnosis should
      be periodically reanalyzed and updated to provide accurate diagnoses
    explanation: >-
      Supports periodic reanalysis of non-diagnostic sequencing, which matters
      because the SLC16A2 variant spectrum is still growing.
  - reference: PMID:38963712
    reference_title: "2024 European Thyroid Association Guidelines on diagnosis and management of genetic disorders of thyroid hormone transport, metabolism and action."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      making a diagnosis using clinical features together with the
      identification of pathogenic variants in causal genes
    explanation: >-
      The 2024 ETA guideline states that diagnosis of these disorders combines
      clinical features with identification of a pathogenic variant in the
      causal gene.
- name: Brain MRI for myelination
  description: >-
    Brain MRI complements the biochemistry. Children under five years show
    diffusely abnormal white matter indicating severely delayed myelination or
    hypomyelination, most marked in the deep anterior white matter; a global
    delay in myelination was present in every patient imaged in the
    international cohort. Myelination improves partially with age, so a
    near-normal MRI in an older patient does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Diffusely abnormal white matter with delayed myelination or hypomyelination,
    partially improving with age.
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      neurological evaluation with MRI to assess brain myelination may be
      informative
    explanation: Recommends brain MRI as part of the diagnostic evaluation.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      have shown diffusely abnormal white matter indicative of severely delayed
      myelination or hypomyelination, particularly in the deep anterior white
      matter
    explanation: Describes the expected MRI appearance and its distribution.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most consistent MRI finding was a global delay in myelination, which
      occurred in 13 (100%) of 13 patients.
    explanation: >-
      Quantifies the consistency of the MRI finding in the genetically confirmed
      cohort.
- name: Reverse T3 in the newborn period
  description: >-
    AHDS is missed by newborn screening. Current TSH/T4-based screening exists
    to detect congenital hypothyroidism and does not measure T3, and newborns
    with MCT8 deficiency have TSH and T4 that are normal for gestational age
    because the pathognomonic T3 rise does not appear until roughly four months
    of age. Adding T3 to the screening panel would not by itself separate MCT8
    deficiency from other thyroid disorders. The only characteristic alteration
    present in the newborn period is a low reverse T3, but this assay is not
    widely available and is rarely performed - a recognised screening gap rather
    than a current recommendation.
  diagnosis_term:
    preferred_term: reverse T3 measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    A low reverse T3 is the only characteristic MCT8-related alteration
    detectable in the newborn period.
  notes: >-
    Recorded as a diagnostic gap, not an established pathway: no newborn
    screening programme currently detects AHDS, and reverse T3 assays are not
    routinely available.
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current newborn screening (NBS) was established to help identify
      congenital hypothyroidism and does not include serum T3 levels
    explanation: >-
      States why standard newborn screening cannot detect MCT8 deficiency.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The only characteristic MCT8-related thyroid hormone alteration that is
      present within the newborn period is a low reverse T3 (rT3), however, this
      test may not be readily available and is infrequently performed
    explanation: >-
      Identifies reverse T3 as the only neonatal-period marker and states the
      practical barrier to using it.
differential_diagnoses:
- name: Resistance to thyroid hormone alpha (THRA)
  description: >-
    RTH-alpha is the closest biochemical mimic: it also presents with
    neurodevelopmental impairment and a discordant thyroid profile. It is
    distinguished by a low or low-normal T4 with a HIGH-NORMAL or only modestly
    raised T3 and a lower T3/T4 ratio, and by the absence of the marked
    peripheral thyrotoxic features (resting tachycardia, progressive weight
    loss, muscle wasting) that dominate AHDS. The lesion is in the receptor
    (THRA), not the transporter, so hormone reaches cells normally.
  disease_term:
    preferred_term: resistance to thyroid hormone due to a mutation in thyroid hormone receptor alpha
    term:
      id: MONDO:0034216
      label: resistance to thyroid hormone due to a mutation in thyroid hormone receptor alpha
  distinguishing_features:
  - >-
    AHDS has markedly elevated T3, an elevated T3/T4 ratio, low reverse T3, and
    prominent tachycardia and failure to thrive. RTH-alpha lacks the peripheral
    thyrotoxic signature. Definitive separation is by sequencing SLC16A2 versus
    THRA.
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      only resistance to thyroid hormone α (RTH-α) has a similar pattern to MCT8
      de ﬁciency
    explanation: >-
      Identifies RTH-alpha as the thyroid laboratory-pattern mimic. The
      distinguishing phenotype and genetic tests in this entry provide the
      required separation without claiming the disorders are equivalent.
- name: Pelizaeus-Merzbacher disease
  description: >-
    A leading differential for the hypomyelination seen on MRI. Both present in
    male infants with hypotonia, nystagmus, and delayed myelination, but PMD is
    caused by PLP1 dosage abnormalities and has an entirely normal thyroid
    profile. Checking a T3 in any boy with unexplained hypomyelination is the
    cheap discriminator.
  disease_term:
    preferred_term: Pelizaeus-Merzbacher disease, classic form
    term:
      id: MONDO:0017222
      label: Pelizaeus-Merzbacher disease, classic form
  distinguishing_features:
  - >-
    Normal thyroid function tests in PMD versus the high-T3, low-free-T4,
    normal-TSH triad in AHDS; PLP1 duplication or point mutation rather than
    SLC16A2 loss of function.
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with MCT8 de ﬁciency, the broad differential diagnoses
      include cerebral palsy, Pelizaeus-Merzbacher (like) disease, MECP2
      duplication syndrome
    explanation: >-
      Explicitly identifies Pelizaeus-Merzbacher disease as a disease-specific
      differential; the thyroid and molecular distinctions are curated above.
- name: Cerebral palsy
  description: >-
    Because AHDS presents with non-progressive-appearing hypotonia evolving to
    spastic quadriplegia in a child with normal birth history, it is frequently
    misdiagnosed as cerebral palsy, which is a major driver of the reported
    diagnostic delay.
  disease_term:
    preferred_term: cerebral palsy
    term:
      id: MONDO:0006497
      label: cerebral palsy
  distinguishing_features:
  - >-
    Absence of a perinatal insult, the pathognomonic thyroid profile, and a
    positive family history on the maternal side favour AHDS.
  evidence:
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with MCT8 de ﬁciency, the broad differential diagnoses
      include cerebral palsy, Pelizaeus-Merzbacher (like) disease, MECP2
      duplication syndrome
    explanation: >-
      Explicitly identifies cerebral palsy as a disease-specific differential,
      rather than merely documenting nonspecific diagnostic delay.
discussions:
- discussion_id: ahds-mouse-model-mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - Cerebral Thyroid Hormone Deprivation
  prompt: >-
    Does the Mct8 single-knockout mouse model the human cerebral phenotype of
    AHDS closely enough for its neurological readouts to be translated, given
    that it reproduces the human serum thyroid profile but develops without
    overt neurological deficits?
  rationale: >-
    This is a genuine translational mismatch rather than a gap in evidence.
    Mct8-null mice reproduce the human biochemical signature almost exactly
    (high T3, low T4, increased hepatic D1) and show reduced brain T3 uptake and
    a locally hypothyroid brain, yet they are neurologically near-normal and
    their cerebellar Purkinje cells develop normally. The accepted explanation
    is species difference in brain thyroid hormone transporter redundancy: mice
    express OATP1C1 at the blood-brain barrier as an alternative T4 route that
    humans rely on much less. Consequently the Mct8/Oatp1c1 double knockout, not
    the single knockout, is the appropriate model, and human iPSC-derived
    cerebral organoids are the strongest human-specific system. Any mouse-derived
    conclusion about the severity, reversibility, or therapeutic window of the
    human cerebral phenotype must be qualified accordingly.
  proposed_experiments:
  - experiment_id: ahds-cross-model-cerebral-deficit
    name: Cross-model comparison of the cerebral deficit
    description: >-
      Compare T3-responsive gene induction, oligodendrocyte maturation, and
      cortical unit thickness across Mct8 single-knockout mouse, Mct8/Oatp1c1
      double-knockout mouse, and patient-derived human cerebral organoids under
      matched analogue treatment, to quantify how much of the human deficit each
      model captures.
    decision_criterion: >-
      If the double-knockout mouse and human organoid converge on comparable
      deficits while the single knockout does not, the single knockout should be
      retired as a model of the human cerebral phenotype.
  - experiment_id: ahds-organoid-therapeutic-window
    name: Therapeutic window mapping in human cerebral organoids
    description: >-
      Apply Triac or DITPA to patient-derived cerebral organoids at staged
      developmental time points to define how late the MCT8-bypass strategy can
      still restore T3-responsive gene programs and cortical unit thickness.
    decision_criterion: >-
      Identification of a developmental stage after which analogue treatment no
      longer restores T3-responsive gene induction would define the human
      therapeutic window and set the target age for early treatment.
  evidence:
  - reference: PMID:17318265
    reference_title: "Abnormal thyroid hormone metabolism in mice lacking the monocarboxylate transporter 8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In conclusion, the circulating thyroid hormone levels of MCT8-null mice
      closely resemble those of humans with MCT8 mutations, yet in the mice, CNS
      development is only partially affected.
    explanation: >-
      States the mismatch explicitly: the mouse reproduces the human serum
      pattern but not the human CNS phenotype.
  - reference: PMID:38376950
    reference_title: "Impaired T3 uptake and action in MCT8-deficient cerebral organoids underlie Allan-Herndon-Dudley syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Given species differences in brain TH transporters and the limitations of
      studies in mice, we generated cerebral organoids (COs) using human induced
      pluripotent stem cells (iPSCs) from MCT8-deficient patients.
    explanation: >-
      Names species differences in brain thyroid hormone transporters and the
      limitations of mouse studies as the explicit motivation for building a
      human model, confirming the mismatch is recognised in the field.

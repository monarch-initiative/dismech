    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is a double-blind, randomized phase 3 multicenter placebo-controlled
      study in at least 16 evaluable male participants diagnosed with MCT8
      deficiency.
    explanation: >-
      Establishes the phase 3, randomised, placebo-controlled design and the
      target population.
  - reference: clinicaltrials:NCT05579327
    reference_title: "Withdrawal of Tiratricol Treatment in Males With Monocarboxylate Transporter 8 Deficiency (MCT8 Deficiency): A Double-blind, Randomized, Placebo-controlled Study"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The research hypothesis to be tested is that, for participants in the

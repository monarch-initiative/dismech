prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    AHDS is a rare X-linked disorder. Systematic prevalence estimates are not
    available; the largest genetically confirmed series assembled 151 patients
    from 47 hospitals across 22 countries over 17 years, which is the best
    available proxy for rarity. The prevalence_class is therefore an inference
    from cohort size and geographic spread rather than a measured rate, and no
    rate_per_100000 is asserted.
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between Oct 14, 2014, and Jan 17, 2020, we enrolled 151 patients with 73
      different MCT8 (SLC16A2) mutations.
    explanation: >-
      Marked PARTIAL because the study reports a case series, not a population
      prevalence. It bounds rarity: an international 22-country effort over
      years assembled only 151 genetically confirmed patients.
progression:
- phase: Infancy
  notes: >-
    Presentation is with truncal hypotonia, poor head control, and feeding
    difficulties, usually in the first year. Median age at diagnosis in the
    international cohort was 24 months.
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at diagnosis was 24·0 months (IQR 12·0-60·0, range 0·0-744·0).
    explanation: Documents the typical age at diagnosis and its wide range.
- phase: Childhood and adult life
  notes: >-
    Hypotonia is superseded by pyramidal signs and spastic quadriplegia;
    extrapyramidal features and, in some, seizures emerge. Cognitive and motor
    abilities plateau and do not improve with age. Progressive weight loss and
    muscle wasting from chronic peripheral thyrotoxicosis dominate systemic
    morbidity.
  evidence:
  - reference: PMID:15889350
    reference_title: "Allan-Herndon-Dudley syndrome and the monocarboxylate transporter 8 (MCT8) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia gives way in adult life to spasticity.
    explanation: Documents the hypotonia-to-spasticity transition over the disease course.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few motor and cognitive abilities of patients did not improve with
      age
    explanation: Documents the developmental plateau.
- phase: Survival
  notes: >-
    Median overall survival is 35 years. About one in five patients died in the
    international cohort, most commonly from pulmonary infection or sudden
    death. Failure to attain head control by 18 months and being underweight at
    ages 1-3 years are both independent predictors of mortality, which is the
    prognostic argument for treating the peripheral thyrotoxic arm.
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median overall survival was 35·0 years (95% CI 8·3-61·7).
    explanation: Provides the median overall survival in the largest cohort assembled.

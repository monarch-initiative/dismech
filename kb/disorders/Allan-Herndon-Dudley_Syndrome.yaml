      id: LOINC:3016-3
      label: Thyrotropin [Units/volume] in Serum or Plasma
    lower_bound: 0.4
    upper_bound: 4.0
    unit: mU/L
    population: Adults; conventional clinical laboratory interval, assay- and age-dependent.
    notes: >-
      As for free T4, this is a conventional adult clinical laboratory interval
      with no single citable primary source and is recorded here rather than
      attributed to a fabricated citation. The sourced AHDS anchor is the trial
      baseline mean TSH of 2.91 mU/L, which is normal despite grossly elevated
      T3.

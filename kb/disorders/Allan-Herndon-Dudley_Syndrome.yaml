        reference interval; the baseline mean of 2.91 mU/L demonstrates the
        inappropriately normal TSH.
    interpretation_bands:
    - name: Inappropriately normal TSH in the presence of high T3
      lower_bound: 0.4
      upper_bound: 4.0

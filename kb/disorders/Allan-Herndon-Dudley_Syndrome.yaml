inheritance:
- name: X-linked recessive inheritance
  description: >-
    AHDS is inherited in an X-linked manner. Hemizygous males carrying a
    pathogenic SLC16A2 variant are affected. Heterozygous females are usually
    not clinically affected but may show minor thyroid test abnormalities, with
    variability attributable to skewed X-inactivation.

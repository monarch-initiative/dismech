genetic:
- name: SLC16A2
  association: Loss-of-function variants
  relationship_type: CAUSATIVE
  notes: >-
    SLC16A2 (MCT8) at Xq13.2 encodes a thyroid hormone-specific plasma membrane
    transporter. Pathogenic variants span whole-gene and partial deletions,
    nonsense and frameshift variants, and missense variants that impair
    trafficking or transport. Genotype-phenotype correlation is imperfect, but
    variants retaining partial residual transport activity are associated with
    milder presentations.
  gene_term:
    preferred_term: SLC16A2
    term:
      id: hgnc:10923
      label: SLC16A2
  evidence:
  - reference: PMID:15889350
    reference_title: "Allan-Herndon-Dudley syndrome and the monocarboxylate transporter 8 (MCT8) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six large families with the syndrome have been identified, and linkage
      studies have placed the gene locus in Xq13.2. Mutations in the
      monocarboxylate transporter 8 gene (MCT8) have been found in each of the
      six families.
    explanation: >-
      Establishes SLC16A2/MCT8 at Xq13.2 as the cause in every historically
      defined Allan-Herndon-Dudley family.
  - reference: PMID:14661163
    reference_title: "A novel syndrome combining thyroid and neurological abnormalities is associated with mutations in a monocarboxylate transporter gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings establish the physiological importance of MCT8 as a thyroid
      hormone transporter.
    explanation: Original gene-discovery paper establishing MCT8 as the disease gene.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we enrolled 151 patients with 73 different MCT8 (SLC16A2) mutations
    explanation: >-
      Demonstrates the wide allelic heterogeneity, with 73 distinct variants
      across 151 genetically confirmed patients.
  - reference: PMID:39699593
    reference_title: "Clinical and genetic characteristics of patients with monocarboxylate transporter-8 deficiency: a multicentre retrospective study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 21 patients, 17 different variants were detected in the SLC16A2 gene.
      Eleven of these variants (c.1456delC, c.439G > T, c.949C > A,
      c.1392dupC, c.1612C > T, c.407dup, c.781del, c.589C > A, c.712G > A,
      c.311 T > A, c.1461del) have not been previously reported.
    explanation: >-
      Updates allelic heterogeneity with an independent 2024 multicentre series
      that identified 17 variants, including 11 reported as novel.
  - reference: PMID:15488219
    reference_title: "Association between mutations in a thyroid hormone transporter and severe X-linked psychomotor retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two patients, gene deletions of 2.4 kb and 24 kb were recorded and in
      three patients missense mutations Ala150Val, Arg171 stop, and Leu397Pro
      were identified.
    explanation: >-
      Documents the variant classes asserted in the notes - whole-gene and
      partial deletions, nonsense, and missense substitutions - in the original
      cohort.
  - reference: PMID:27977298
    reference_title: "The Chemical Chaperone Phenylbutyrate Rescues MCT8 Mutations Associated With Milder Phenotypes in Patients With Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Some MCT8-deficient patients (e.g., those carrying MCT8delF501) will not
      be as severely affected as most others. We have shown that the MCT8delF501
      protein has decreased protein stability but important residual function
      once it reaches the plasma membrane.
    explanation: >-
      Sources the genotype-phenotype statement in the notes: variants retaining
      residual transport function are associated with milder presentations. Also
      identifies the misfolding/destabilisation variant class that is rescuable
      by chemical chaperones in vitro.
  - reference: PMID:27977298
    reference_title: "The Chemical Chaperone Phenylbutyrate Rescues MCT8 Mutations Associated With Milder Phenotypes in Patients With Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Kinetic analyses revealed that the Michaelis constants of the mutants
      toward the primary substrate 3,3',5-triiodothyronine were not much
      different from the wild-type value, suggesting that these mutants are not
      impaired in their interaction with substrate but rather destabilized by
      the mutation and degraded.
    explanation: >-
      Establishes the molecular basis of the milder missense class: normal
      substrate affinity with reduced protein stability, rather than an
      intrinsically dead transporter.
treatments:
- name: Tiratricol (Triac)
  description: >-
    Triac (3,3',5-triiodothyroacetic acid, tiratricol) is a T3 analogue that
    binds the same thyroid hormone receptors as T3 but enters cells
    independently of MCT8. It is the rational therapy for AHDS: it suppresses
    the pituitary, lowering the elevated serum T3 and thereby relieving
    peripheral thyrotoxicosis, and can in principle reach MCT8-dependent tissues
    that T3 cannot. In the international phase 2 Triac Trial (46 patients),
    serum T3 fell from 4.97 to 1.82 nmol/L over 12 months with only transient
    adverse effects; a real-life cohort of 67 patients treated up to 6 years
    confirmed sustained benefit with gains in body weight, reductions in heart
    rate, and falling SHBG. Evidence that Triac reverses the cerebral
    hypothyroidism is much weaker than the evidence for peripheral benefit, and
    is the question Triac Trial II was designed to answer by treating boys aged
    30 months or younger. Tiratricol received European Union approval in 2025
    specifically for peripheral thyrotoxicosis in MCT8 deficiency from birth;
    this approval does not establish neurological efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tiratricol
      term:
        id: CHEBI:40021
        label: tiratricol
  target_mechanisms:
  - target: Peripheral Thyrotoxicosis in MCT8-Independent Tissues
    treatment_effect: INHIBITS
    description: >-
      By suppressing TSH and lowering circulating T3, Triac removes the excess
      hormone driving MCT8-independent tissues, which is the arm of the disease
      it demonstrably improves.
  - target: Cerebral Thyroid Hormone Deprivation
    treatment_effect: INHIBITS
    description: >-
      Triac enters cells without MCT8 and can therefore in principle substitute
      for T3 in MCT8-dependent brain tissue. This is the therapeutic rationale
      but remains the less well demonstrated of the two effects.
  target_phenotypes:
  - preferred_term: Elevated serum T3
    term:
      id: HP:0011788
      label: Increased circulating free T3
  - preferred_term: Failure to thrive / underweight
    term:
      id: HP:0001508
      label: Failure to thrive
  - preferred_term: Resting tachycardia
    term:
      id: HP:0001649
      label: Tachycardia
  evidence:
  - reference: clinicaltrials:NCT02060474
    reference_title: "Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation Caused by Mutations in the MCT8 Thyroid Hormone Transporter: The Triac Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cellular uptake of Triac does not depend on functional MCT8.
    explanation: >-
      States the pharmacological property that makes Triac rational in a
      transport-defect disease.
  - reference: PMID:31377265
    reference_title: "Effectiveness and safety of the tri-iodothyronine analogue Triac in children and adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key features of peripheral thyrotoxicosis were alleviated in paediatric
      and adult patients with MCT8 deficiency who were treated with Triac. Triac
      seems a reasonable treatment strategy to ameliorate the consequences of
      untreated peripheral thyrotoxicosis in patients with MCT8 deficiency.
    explanation: >-
      Primary trial conclusion: Triac alleviates peripheral thyrotoxicosis. Note
      the deliberately limited claim, confined to the peripheral arm.
  - reference: PMID:34679181
    reference_title: "Long-Term Efficacy of T3 Analogue Triac in Children and Adults With MCT8 Deficiency: A Real-Life Retrospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key features were sustainably alleviated in patients with MCT8 deficiency
      across all ages, highlighting the real-life potential of Triac for MCT8
      deficiency.
    explanation: >-
      Long-term real-life cohort confirming durability of benefit over up to six
      years.
  - reference: PMID:40549098
    reference_title: "Tiratricol: First Approval."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tiratricol received its first approval on 12 February 2025 in the European
      Union, for the treatment of peripheral thyrotoxicosis in patients with
      MCT8 deficiency (Allan-Herndon-Dudley Syndrome), from birth.
    explanation: >-
      Establishes the date, jurisdiction, age scope, and narrowly peripheral
      indication of the first regulatory approval without implying proven
      neurological benefit.
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main objective, normalization of the free T3 blood level, was
      achieved. Other favorable findings were increased body weight; decreased
      heart rate, systolic blood pressure, and hypertension; and improved
      development in seven children
    explanation: >-
      GeneReviews summary of the Triac evidence, including the developmental
      signal in a small subgroup of early-treated children.
  - reference: PMID:38376950
    reference_title: "Impaired T3 uptake and action in MCT8-deficient cerebral organoids underlie Allan-Herndon-Dudley syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the TH analogs 3,5-diiodothyropropionic acid and
      3,3',5-triiodothyroacetic acid triggered normal responses
      (induction/repression of T3-responsive genes) in MCT8-deficient COs,
      constituting proof of concept that lack of T3 transport underlies the
      pathophysiology of AHDS and demonstrating the clinical potential for TH
      analogs to be used in treating patients with AHDS.
    explanation: >-
      Human patient-derived cerebral organoids show that Triac (and DITPA)
      restore normal T3-responsive gene regulation where T3 itself cannot,
      giving direct human-tissue proof of concept for the MCT8-bypass strategy
      in the brain.
- name: Levodopa/carbidopa for childhood parkinsonism
  description: >-
    Levodopa/carbidopa is a newly reported symptomatic option for the
    parkinsonian movement disorder in AHDS. In a longitudinal registry cohort,
    seven of eight treated patients responded favorably and no adverse drug
    reactions were observed. This small uncontrolled cohort supports a
    disorder-specific treatment option but not an established population-wide
    efficacy estimate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: carbidopa-levodopa
      term:
        id: CHEBI:3396
        label: Carbidopa-levodopa
  target_mechanisms:
  - target: Dopamine Pathway Impairment
    treatment_effect: RESTORES
    description: >-
      Dopamine replacement compensates symptomatically for reduced dopamine
      pathway output; it does not correct the upstream MCT8 transport defect.
  target_phenotypes:
  - preferred_term: Childhood parkinsonism responsive to levodopa/carbidopa
    term:
      id: HP:0002548
      label: Parkinsonism with favorable response to dopaminergic medication
  evidence:
  - reference: PMID:40088079
    reference_title: "Patients with Allan-Herndon-Dudley Syndrome (MCT8 Deficiency) Display Symptoms of Parkinsonism in Childhood and Respond to Levodopa/Carbidopa Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven out of 8 patients responded favorably to l-dopa/carbidopa
      supplementation and we did not observe any adverse drug reactions.
    explanation: >-
      Directly reports the treatment response and observed safety in the eight
      treated patients, while the description preserves the uncontrolled,
      small-cohort scope.
- name: Glycerol phenylbutyrate (experimental)
  description: >-
    Glycerol phenylbutyrate is an experimental chemical-chaperone strategy for
    selected missense MCT8 variants whose residual transport activity is limited
    by protein instability or trafficking. In-vitro rescue motivated a phase 2
    study, but clinical efficacy has not been established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glycerol phenylbutyrate
      term:
        id: CHEBI:134745
        label: glycerol phenylbutyrate
  target_mechanisms:
  - target: MCT8 Thyroid Hormone Transport Failure
    treatment_effect: RESTORES
    description: >-
      Chemical chaperoning may increase cell-surface expression and residual T3
      transport for amenable destabilized variants; it is not expected to
      rescue null alleles.
  evidence:
  - reference: PMID:27977298
    reference_title: "The Chemical Chaperone Phenylbutyrate Rescues MCT8 Mutations Associated With Milder Phenotypes in Patients With Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Some MCT8-deficient patients (e.g., those carrying MCT8delF501) will not
      be as severely affected as most others. We have shown that the MCT8delF501
      protein has decreased protein stability but important residual function
      once it reaches the plasma membrane.
    explanation: >-
      Defines the variant-restricted biological rationale: residual function is
      present when an unstable mutant transporter reaches the membrane.
- name: Diiodothyropropionic acid (DITPA)
  description: >-
    DITPA is a second MCT8-independent thyroid hormone analogue. In four
    children treated on compassionate grounds for 26-40 months, DITPA
    normalized elevated serum T3 and TSH, raised T4 and reverse T3 into the low
    normal range, and reduced SHBG and heart rate without adverse effects.
    Evidence is far more limited than for Triac and DITPA is not in routine use,
    but it establishes that the MCT8-bypass strategy generalizes beyond a single
    compound.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diiodothyropropionic acid
      term:
        id: CHEBI:134267
        label: 3,5-diiodothyropropionic acid
  target_mechanisms:
  - target: Peripheral Thyrotoxicosis in MCT8-Independent Tissues
    treatment_effect: INHIBITS
    description: >-
      DITPA lowers circulating T3 and reduces markers of peripheral
      hypermetabolism such as SHBG and heart rate.
  evidence:
  - reference: PMID:22993035
    reference_title: "Diiodothyropropionic acid (DITPA) in the treatment of MCT8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DITPA (1-2 mg/kg · d) almost completely normalizes thyroid tests and
      reduces the hypermetabolism and the tendency for weight loss.
    explanation: >-
      Conclusion of the compassionate-use series in four children, supporting
      DITPA as an alternative MCT8-independent analogue.
  - reference: PMID:22993035
    reference_title: "Diiodothyropropionic acid (DITPA) in the treatment of MCT8 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Mct8-deficient mice, the thyroid hormone analog, diiodothyropropionic
      acid (DITPA), does not require MCT8 to enter tissues and could be an
      effective alternative to thyroid hormone treatment in humans.
    explanation: >-
      States the preclinical MCT8-independence rationale established in
      Mct8-deficient mice.
- name: Thyroid hormone replacement (levothyroxine or liothyronine) - contraindicated as monotherapy
  description: >-
    Standard thyroid hormone replacement fails in AHDS and is harmful.
    Levothyroxine or liothyronine cannot cross into MCT8-dependent brain
    tissue, so the cerebral hypothyroidism is not corrected, while the
    additional hormone is fully available to MCT8-independent peripheral tissues
    and therefore aggravates the existing thyrotoxicosis and hypermetabolism.
    GeneReviews lists administration of L-T4 or L-T3 alone under agents and
    circumstances to avoid. This is the single most important management point
    in the disease and the reason the correct diagnosis matters: a boy with
    developmental delay and a low free T4 will otherwise be given levothyroxine.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levothyroxine
      term:
        id: CHEBI:30660
        label: thyroxine
  evidence:
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Administration of L-T4 or L-T3 alone can
      exacerbate the high serum T3 levels and the resulting hypermetabolism.
    explanation: >-
      GeneReviews drug-safety warning naming L-T4 and L-T3 monotherapy as agents
      to avoid.
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thyroid hormone replacement therapy during childhood has no beneficial
      effect and could be dangerous by worsening dysthyroidism.
    explanation: >-
      States both the lack of benefit and the potential harm of conventional
      replacement.
  - reference: PMID:22993035
    reference_title: "Diiodothyropropionic acid (DITPA) in the treatment of MCT8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with thyroid hormone is ineffective.
    explanation: Independent confirmation that conventional thyroid hormone is ineffective.
- name: Multidisciplinary supportive and rehabilitative care
  description: >-
    There is no disease-modifying therapy for the neurological phenotype, so
    management is supportive: physiotherapy and positioning for hypotonia and
    spasticity, management of extrapyramidal movement disorders, nutritional
    support (including gastrostomy where feeding difficulty and weight loss
    demand it), and surveillance for scoliosis and hip dislocation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary team to provide standard care for hypotonia, poor
      feeding, DD/ID, spasticity, and extrapyramidal movement disorders.
    explanation: GeneReviews management recommendation for multidisciplinary supportive care.
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: In children, assess the following every six months until age
      four years, then once a year: developmental progress & educational needs;
      neurologic examination for new manifestations
    explanation: Documents the recommended surveillance schedule.
- name: Anti-seizure medication
  description: >-
    Seizures are managed with standard anti-seizure medication under an
    experienced neurologist, but drug resistance is common.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

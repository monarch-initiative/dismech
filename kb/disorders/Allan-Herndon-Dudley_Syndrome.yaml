    snippet: >-
      free thyroxine concentrations were below the age-specific lower limit in
      94 (89%) of 106 patients
    explanation: Establishes low free T4 in 89% of genetically confirmed patients.
- name: Serum thyroid-stimulating hormone (TSH)
  notes: >-
    TSH is normal or only mildly elevated, which is inappropriate for the
    markedly elevated T3. Mean baseline TSH in the Triac Trial cohort was
    2.91 mU/L, squarely within the normal interval despite a T3 roughly twice
    the upper limit of normal. This non-suppression is the third leg of the
    triad and reflects partial MCT8 dependence of hypothalamic-pituitary
    hormone sensing.
  presence: NORMAL
  reference_ranges:

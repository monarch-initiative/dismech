      label: central nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few motor and cognitive abilities of patients did not improve with
      age, as evidenced by the absence of significant correlations between
      biological age and scores on the Gross Motor Function Measure-88 and
      Bayley Scales of Infant Development III.
    explanation: >-
      Documents the fixed developmental ceiling but only partially supports
      this cellular node because it does not resolve the neuronal program that
      produces the clinical outcome.
  - reference: PMID:38376950
    reference_title: "Impaired T3 uptake and action in MCT8-deficient cerebral organoids underlie Allan-Herndon-Dudley syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MCT8-deficient COs exhibited (i) altered early neurodevelopment, resulting
      in smaller neural rosettes with thinner cortical units, (ii) impaired
      triiodothyronine (T3) transport in developing neural cells, as assessed
      through deiodinase-3-mediated T3 catabolism, (iii) reduced expression of
      genes involved in cerebral cortex development, and (iv) reduced T3
      inducibility of TH-regulated genes.
    explanation: >-
      Directly demonstrates altered early cortical development in a
      patient-derived human model through altered neural-rosette and cortical-unit

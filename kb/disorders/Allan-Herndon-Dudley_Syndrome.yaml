    explanation: GeneReviews management recommendation for the seizure phenotype.
- name: Genetic counseling and carrier testing
  description: >-
    Because AHDS is X-linked, carrier testing of at-risk female relatives,
    prenatal testing, and preimplantation genetic testing become available once
    the familial SLC16A2 variant is known. A carrier mother has a 50% chance of
    transmitting the variant in each pregnancy.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the SLC16A2 pathogenic variant has been identified in an affected
      family member, carrier testing of at-risk female relatives, prenatal
      testing for a pregnancy at increased risk, and preimplantation genetic
      testing are possible.
    explanation: GeneReviews genetic counseling guidance.
  - reference: PMID:20301789
    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If the mother of a proband has an SLC16A2 pathogenic variant, the chance
      of transmitting it in each pregnancy is 50%.
    explanation: >-
      GeneReviews states the 50% per-pregnancy transmission risk verbatim,
      sourcing the figure asserted in this treatment description.
  - reference: PMID:39132310
    reference_title: "Unmet patient needs in monocarboxylate transporter 8 (MCT8) deficiency: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is a 50% chance that male children will be affected if their mother
      is a carrier of a pathogenic SLC16A2 mutation
    explanation: >-
      Independently states the sex-specific consequence of the 50% transmission
      risk in this X-linked disorder.
clinical_trials:
- name: NCT02060474
  phase: PHASE_II
  status: COMPLETED
  description: >-
    The Triac Trial: an investigator-initiated, international, open-label,
    single-arm phase 2 trial of oral Triac (tiratricol) in male paediatric and
    adult patients with MCT8 deficiency, testing whether an MCT8-independent T3
    analogue can reduce the toxic effects of high serum T3 and restore local
    thyroid hormone availability in brain. 46 patients enrolled; serum T3 fell
    from 4.97 to 1.82 nmol/L at 12 months.
  target_phenotypes:
  - preferred_term: Elevated serum T3
    term:
      id: HP:0011788
      label: Increased circulating free T3
  - preferred_term: Failure to thrive / underweight

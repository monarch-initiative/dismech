    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Signature Serum Iodothyronine Pattern
  description: >-
    The diagnostic biochemical triad is high serum T3 with low or low-normal
    free T4 and a normal or only mildly elevated TSH, giving an increased
    T3/T4 ratio and low reverse T3. This pattern arises because tissues that
    retain hormone uptake (notably liver) increase type 1 deiodinase activity,
    converting T4 to T3, while the pituitary and hypothalamus receive a mixed
    signal, so TSH is not suppressed to the degree the elevated T3 would
    predict. The combination is what distinguishes AHDS from ordinary primary
    hypothyroidism (low T3 and T4 with high TSH) and from thyroid hormone
    resistance syndromes, and it is the diagnostic key.
  role: biomarker
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Thyroid Hormone Metabolic Process
    term:
      id: GO:0042403
      label: thyroid hormone metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: clinicaltrials:NCT02060474
    reference_title: "Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation Caused by Mutations in the MCT8 Thyroid Hormone Transporter: The Triac Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, TH serum parameters are highly abnormal in AHDS: high T3, low
      T4 and normal TSH levels.
    explanation: States the signature triad explicitly.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tri-iodothyronine concentrations were above the age-specific upper limit
      in 96 (95%) of 101 patients and free thyroxine concentrations were below
      the age-specific lower limit in 94 (89%) of 106 patients.
    explanation: >-
      Quantifies the penetrance of the high-T3, low-free-T4 pattern in the
      largest genetically confirmed cohort assembled.
  - reference: PMID:15889350
    reference_title: "Allan-Herndon-Dudley syndrome and the monocarboxylate transporter 8 (MCT8) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal transporter function is reflected in elevated free
      triiodothyronine and lowered free thyroxine levels in the blood.
    explanation: Links the serum pattern directly to the transporter defect.
  - reference: PMID:17318265
    reference_title: "Abnormal thyroid hormone metabolism in mice lacking the monocarboxylate transporter 8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The MCT8-null mice described here, however, developed without overt
      deficits but also exhibited distorted 3,5,3'-triiodothyronine (T3) and
      thyroxine (T4) serum levels, resulting in increased hepatic activity of
      type 1 deiodinase (D1).
    explanation: >-
      Identifies the increased hepatic type 1 deiodinase activity that mechanistically
      generates the elevated serum T3, and confirms the mouse reproduces the human
      serum pattern even though its CNS phenotype is milder.
  downstream:
  - target: Peripheral Thyrotoxicosis in MCT8-Independent Tissues
    description: >-
      The elevated circulating T3 is freely taken up by tissues that do not
      depend on MCT8, over-stimulating them.
    causal_link_type: DIRECT
  - target: Increased circulating free T3
    description: The serum pattern is measured directly as elevated free and total T3.
    causal_link_type: DIRECT
  - target: Decreased circulating free T4 concentration
    description: Enhanced T4-to-T3 conversion lowers circulating free thyroxine.
    causal_link_type: DIRECT
  - target: Inappropriately normal thyroid-stimulating hormone level
    description: >-
      TSH fails to fall as the elevated T3 would predict, because pituitary
      hormone sensing is itself partly MCT8-dependent.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Increased T3/T4 ratio
    description: The divergence of T3 and T4 raises the T3/T4 ratio, a derived diagnostic index.
    causal_link_type: DIRECT
- name: Peripheral Thyrotoxicosis in MCT8-Independent Tissues
  description: >-
    Liver, heart, kidney, and skeletal muscle import T3 through MCT10, OATP, and
    other non-MCT8 routes, so they are fully exposed to the elevated circulating
    T3. These tissues are therefore chronically thyrotoxic while the brain is
    hypothyroid. This is the mechanistic reason why levothyroxine or
    liothyronine replacement is harmful in AHDS: extra hormone cannot reach the
    brain but does reach and further over-stimulate the periphery.
  role: effector
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: Response to Thyroid Hormone
    term:
      id: GO:0097066
      label: response to thyroid hormone
    modifier: INCREASED
  evidence:
  - reference: clinicaltrials:NCT02060474
    reference_title: "Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation Caused by Mutations in the MCT8 Thyroid Hormone Transporter: The Triac Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The high serum T3 levels cause local hyperthyroidism in tissues that do
      not depend on MCT8 for cellular transport of TH, resulting in a low body
      weight and reduced muscle mass.
    explanation: >-
      States the peripheral-thyrotoxicosis arm and its anthropometric
      consequences, in explicit contrast to the hypothyroid brain.
  - reference: PMID:31377265
    reference_title: "Effectiveness and safety of the tri-iodothyronine analogue Triac in children and adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This chronic thyrotoxicosis leads to progressive deterioration in
      bodyweight, tachycardia, and muscle wasting, predisposing affected
      individuals to substantial morbidity and mortality.
    explanation: >-
      Establishes chronic peripheral thyrotoxicosis as the driver of the
      systemic morbidity and of excess mortality.
  downstream:
  - target: Hypermetabolism and Muscle Wasting
    description: >-
      Excess T3 action in peripheral tissues raises metabolic rate and drives
      catabolism.
    causal_link_type: DIRECT
- name: Hypermetabolism and Muscle Wasting
  description: >-
    Sustained peripheral T3 excess raises basal metabolic rate, increases
    resting heart rate and systolic blood pressure, elevates sex hormone-binding
    globulin, lowers serum creatinine from reduced muscle mass, and produces a
    progressive negative energy balance that manifests as failure to thrive and
    muscle wasting. Being underweight in early childhood is an independent
    predictor of mortality, so this arm is not merely cosmetic.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: Regulation of Metabolic Process
    term:
      id: GO:0019222
      label: regulation of metabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:22993035
    reference_title: "Diiodothyropropionic acid (DITPA) in the treatment of MCT8 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The great majority of affected children cannot walk or talk, and all have
      elevated serum T(3) levels, causing peripheral tissue hypermetabolism and
      inability to maintain weight.
    explanation: >-
      Links elevated serum T3 causally to peripheral hypermetabolism and the
      inability to maintain weight.
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who were underweight during age 1-3 years had an increased risk
      for death compared with patients who were of normal bodyweight at this age
      (HR 4·71, 95% CI 1·26-17·58, p=0·021).
    explanation: >-
      Shows the hypermetabolic-catabolic arm is prognostically important, not
      incidental, which is the rationale for treating peripheral thyrotoxicosis.
  - reference: PMID:34679181
    reference_title: "Long-Term Efficacy of T3 Analogue Triac in Children and Adults With MCT8 Deficiency: A Real-Life Retrospective Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with mutations in thyroid hormone transporter MCT8 have
      developmental delay and chronic thyrotoxicosis associated with being
      underweight and having cardiovascular dysfunction.
    explanation: >-
      Associates chronic thyrotoxicosis with the underweight state and
      cardiovascular dysfunction that define this node.
  downstream:
  - target: Failure to thrive
    description: Negative energy balance from hypermetabolism produces poor weight gain.
    causal_link_type: DIRECT
  - target: Decreased muscle mass
    description: Catabolic T3 excess in skeletal muscle drives muscle wasting.
    causal_link_type: DIRECT
  - target: Tachycardia
    description: Excess T3 action on MCT8-independent cardiac tissue raises resting heart rate.
    causal_link_type: DIRECT

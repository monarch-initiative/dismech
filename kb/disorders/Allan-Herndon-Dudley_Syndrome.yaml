- name: NCT05579327
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ReTRIACt: a double-blind, randomised, placebo-controlled phase 3
    withdrawal study in males aged 4 years and over with MCT8 deficiency already
    stable on tiratricol. Participants were randomised to continue tiratricol or
    switch to placebo for 30 days or until serum total T3 rose above the upper
    limit of normal (the rescue criterion). This randomised-withdrawal design is
    the most rigorous registered design for tiratricol in AHDS, because the
    earlier Triac trials were single-arm and open-label. No results are asserted
    here from the completed registration.
  target_phenotypes:
  - preferred_term: Elevated serum T3
    term:

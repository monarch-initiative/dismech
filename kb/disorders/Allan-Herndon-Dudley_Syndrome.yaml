biochemical:
- name: Serum total triiodothyronine (T3)
  notes: >-
    Serum T3 is elevated in essentially all affected males and is the entry
    point to the diagnosis. In the Triac Trial cohort, mean baseline T3 was
    4.97 nmol/L against a normal target range of 1.4-2.5 nmol/L, roughly double
    the upper limit of normal.
  presence: INCREASED
  reference_ranges:
  - loinc_term:
      id: LOINC:14930-2
      label: Triiodothyronine (T3) [Moles/volume] in Serum or Plasma
    lower_bound: 1.4
    upper_bound: 2.5
    unit: nmol/L
    population: >-
      Reference target range used in the international Triac Trial for
      paediatric and adult males with MCT8 deficiency.
    evidence:
    - reference: PMID:31377265
      reference_title: "Effectiveness and safety of the tri-iodothyronine analogue Triac in children and adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the goal of attaining serum total T3 concentrations within the target
        range of 1·4-2·5 nmol/L
      explanation: >-
        Source of the 1.4-2.5 nmol/L normal interval adopted as the treatment
        target in the pivotal Triac trial.
    - reference: PMID:31377265
      reference_title: "Effectiveness and safety of the tri-iodothyronine analogue Triac in children and adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Serum T3 concentration decreased from 4·97 nmol/L (SD 1·55) at baseline
        to 1·82 nmol/L (0·69) at month 12
      explanation: >-
        Documents the untreated AHDS baseline (mean 4.97 nmol/L) that anchors
        the abnormal bands, and its normalization on Triac.
    notes: >-
      The trial reports values in nmol/L, so the molar LOINC code is used.
      Age-specific paediatric intervals differ; the cohort study assessed T3
      against age-specific upper limits rather than a single adult cut-off.
    interpretation_bands:
    - name: Normal
      lower_bound: 1.4
      upper_bound: 2.5
      unit: nmol/L
      abnormal_flag: NORMAL
      interpretation: >-
        Within the target range used in the Triac trials. Untreated AHDS
        essentially never falls here; a normal T3 on treatment is the
        therapeutic goal.
    - name: Elevated T3 typical of untreated MCT8 deficiency
      lower_bound: 2.5
      unit: nmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Elevated serum T3
        term:
          id: HP:0011788
          label: Increased circulating free T3
      interpretation: >-
        An elevated T3 in a boy with severe developmental delay and hypotonia
        should prompt free T4, TSH, and SLC16A2 sequencing. Untreated AHDS
        averages about 4.97 nmol/L, roughly twice the upper limit of normal.
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tri-iodothyronine concentrations were above the age-specific upper limit
      in 96 (95%) of 101 patients
    explanation: Establishes near-universal T3 elevation in genetically confirmed patients.
- name: Serum free thyroxine (free T4)
  notes: >-
    Free T4 is low or low-normal, the opposite direction to T3. Mean baseline
    free T4 in the Triac Trial cohort was 9.5 pmol/L, at or below the lower end
    of the usual adult interval.
  presence: DECREASED
  reference_ranges:
  - loinc_term:
      id: LOINC:14920-3
      label: Thyroxine (T4) free [Moles/volume] in Serum or Plasma
    lower_bound: 10.0
    upper_bound: 25.0
    unit: pmol/L
    population: >-
      Adults; conventional clinical laboratory interval, assay- and
      age-dependent.
    notes: >-
      This interval is a conventional adult clinical laboratory range with no
      single citable primary source, so it is recorded here rather than
      attributed to a fabricated citation; individual laboratories and
      paediatric age bands differ, and the international cohort study assessed
      free T4 against age-specific lower limits rather than a fixed cut-off. The
      AHDS-relevant anchor that IS sourced is the trial baseline mean of
      9.5 pmol/L.
    evidence:
    - reference: PMID:31377265
      reference_title: "Effectiveness and safety of the tri-iodothyronine analogue Triac in children and adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        serum free T4 concentrations decreased from 9·5 pmol/L (SD 2·5) to 3·4
      explanation: >-
        Marked PARTIAL because it does not state the reference interval itself;
        it supplies the untreated AHDS baseline free T4 (mean 9.5 pmol/L) that
        sits at or below the lower limit, and shows that Triac lowers it
        further.
    interpretation_bands:
    - name: Low free T4, typical of untreated MCT8 deficiency

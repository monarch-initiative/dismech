  - target: Severe intellectual disability
    description: Failure of T3-dependent cortical development produces severe cognitive impairment.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Axial hypotonia
    description: >-
      Immature central motor control presents in infancy as truncal hypotonia
      and absent head control.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Dystonia
    description: >-
      Altered neuronal development contributes to extrapyramidal movement
      abnormalities, but the responsible circuit and intermediate steps have

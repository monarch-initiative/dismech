    explanation: >-
      Establishes the thyroid-hormone dependence of the OPC-to-oligodendrocyte
      transition that fails when brain hormone supply is lost.
  - reference: PMID:37307933
    reference_title: "Thyroid hormone transporter Mct8/Oatp1c1 deficiency compromises proper oligodendrocyte maturation in the mouse CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dko mice exhibited at all analysed time points an increased portion of
      OPCs and a reduced number of mature oligodendrocytes both in white and
      grey matter regions indicating a differentiation blockage in the absence
      of Mct8/Oatp1c1.
    explanation: >-
      Demonstrates the specific cellular lesion, an oligodendrocyte
      differentiation block, in the Mct8/Oatp1c1 double-knockout model of human

pathophysiology:
- name: SLC16A2 Loss of Function
  description: >-
    Loss-of-function variants in SLC16A2 at Xq13.2 (deletions, nonsense,
    frameshift, and missense variants that misfold or mistraffic the protein)
    abolish or severely reduce the activity of monocarboxylate transporter 8
    (MCT8), a 12-transmembrane-domain thyroid hormone-specific plasma membrane
    transporter. Because males are hemizygous, a single variant allele removes
    all functional transporter.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SLC16A2
    term:
      id: hgnc:10923
      label: SLC16A2
  evidence:
  - reference: PMID:14661163
    reference_title: "A novel syndrome combining thyroid and neurological abnormalities is associated with mutations in a monocarboxylate transporter gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We now report, for the first time, mutations in the monocarboxylate
      transporter 8 (MCT8) gene, located on the X chromosome, that encodes a
      613-amino acid protein with 12 predicted transmembrane domains.
    explanation: >-
      Establishes SLC16A2/MCT8 as the mutated gene and describes the encoded
      12-transmembrane-domain transporter.
  - reference: PMID:15889350
    reference_title: "Allan-Herndon-Dudley syndrome and the monocarboxylate transporter 8 (MCT8) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      linkage studies have placed the gene locus in Xq13.2. Mutations in the
      monocarboxylate transporter 8 gene (MCT8) have been found in each of the
      six families.
    explanation: >-
      Confirms that the historically defined Allan-Herndon-Dudley families all
      carry MCT8 mutations at Xq13.2, anchoring disease identity to SLC16A2.
  - reference: PMID:15488219
    reference_title: "Association between mutations in a thyroid hormone transporter and severe X-linked psychomotor retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two patients, gene deletions of 2.4 kb and 24 kb were recorded and in
      three patients missense mutations Ala150Val, Arg171 stop, and Leu397Pro
      were identified.
    explanation: >-
      Documents the allelic spectrum, spanning whole-gene deletions through
      missense substitutions, all producing loss of function.
  downstream:
  - target: MCT8 Thyroid Hormone Transport Failure
    description: >-
      Absence of functional transporter protein directly abolishes
      MCT8-mediated cellular uptake of thyroid hormone.
    causal_link_type: DIRECT
- name: MCT8 Thyroid Hormone Transport Failure
  description: >-
    MCT8 is a thyroid hormone-specific transporter that carries T3 and T4 across
    the plasma membrane. Its loss does not affect hormone synthesis or receptor
    function; it blocks hormone entry into cells. Critically, MCT8 dependence is
    tissue-selective. Brain barriers and many neurons rely on MCT8 as the
    rate-limiting import route, whereas liver, heart, and skeletal muscle import
    T3 through alternative transporters (MCT10, OATP family). This single lesion
    therefore partitions the body into hormone-deprived and
    hormone-overexposed compartments.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Thyroid Hormone Transport
    term:
      id: GO:0070327
      label: thyroid hormone transport
    modifier: DECREASED
  evidence:
  - reference: PMID:15488219
    reference_title: "Association between mutations in a thyroid hormone transporter and severe X-linked psychomotor retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest that this novel syndrome of X-linked psychomotor retardation is
      due to a defect in T3 entry into neurons through MCT8, resulting in
      impaired T3 action and metabolism.
    explanation: >-
      States the core mechanism: failure of T3 entry into neurons through MCT8
      rather than any defect of hormone production or receptor action.
  - reference: PMID:15889350
    reference_title: "Allan-Herndon-Dudley syndrome and the monocarboxylate transporter 8 (MCT8) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One essential function of the protein encoded by this gene appears to be
      the transport of triiodothyronine into neurons.
    explanation: >-
      Identifies neuronal T3 import as the essential MCT8 function that is lost.
  - reference: clinicaltrials:NCT02060474
    reference_title: "Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation Caused by Mutations in the MCT8 Thyroid Hormone Transporter: The Triac Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MCT8 is a thyroid hormone (TH) transporter which is crucial for the
      transport of TH from the blood into different tissues. Dysfunction of MCT8
      results in a lack of TH (hypothyroidism) in tissues that depend on MCT8
      for TH uptake.
    explanation: >-
      States the tissue-selective logic of MCT8 dependence that underlies the
      simultaneous two-compartment phenotype.
  downstream:
  - target: Cerebral Thyroid Hormone Deprivation
    description: >-
      Loss of MCT8-mediated transport across brain barriers and into neurons
      starves the CNS of thyroid hormone.
    causal_link_type: DIRECT
  - target: Signature Serum Iodothyronine Pattern
    description: >-
      Blocked cellular uptake and altered peripheral deiodinase handling shift
      circulating iodothyronines toward high T3 with low free T4.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Cerebral Thyroid Hormone Deprivation
  description: >-
    Brain thyroid hormone content falls despite normal or elevated circulating
    T3, because MCT8 is the rate-limiting import step at the blood-brain barrier
    and in MCT8-dependent neurons. The CNS therefore behaves as a hypothyroid
    tissue: T3-responsive gene programs are under-driven, and compensatory
    deiodinase changes (increased DIO2, decreased DIO3) fail to restore local
    hormone supply. This is the one conserved step AHDS shares with classical
    hypothyroidism, and the only node here that declares module conformance.
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "hypothyroidism_thyroid_hormone_deficiency#Reduced Thyroid Hormone Action at Peripheral Sites"
  biological_processes:
  - preferred_term: Response to Thyroid Hormone
    term:
      id: GO:0097066
      label: response to thyroid hormone
    modifier: DECREASED
  evidence:
  - reference: PMID:32559475
    reference_title: "Disease characteristics of MCT8 deficiency: an international, retrospective, multicentre cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disordered thyroid hormone transport, due to mutations in the SLC16A2 gene
      encoding monocarboxylate transporter 8 (MCT8), is characterised by
      intellectual and motor disability resulting from cerebral hypothyroidism
      and chronic peripheral thyrotoxicosis.
    explanation: >-
      Names cerebral hypothyroidism as the direct cause of the intellectual and
      motor disability, alongside the simultaneous peripheral thyrotoxicosis.
  - reference: clinicaltrials:NCT02060474
    reference_title: "Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation Caused by Mutations in the MCT8 Thyroid Hormone Transporter: The Triac Trial."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This local hypothyroidism in the brain of these patients causes severe
      psychomotor retardation.
    explanation: >-
      States the causal link from local (brain-restricted) hypothyroidism to the
      severe neurodevelopmental phenotype.
  - reference: PMID:17318265
    reference_title: "Abnormal thyroid hormone metabolism in mice lacking the monocarboxylate transporter 8."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the mutants' brains, entry of T4 was not affected, but uptake of T3 was
      diminished. Moreover, the T4 and T3 content in the brain of MCT8-null mice
      was decreased, the activity of D2 was increased, and D3 activity was
      decreased, indicating the hypothyroid state of this tissue.
    explanation: >-
      Direct experimental demonstration in Mct8-null mice that brain T3 uptake
      and brain hormone content fall, with the deiodinase shifts that define a
      locally hypothyroid tissue. Mouse evidence; the murine CNS phenotype is
      milder than the human one.
  - reference: PMID:38376950
    reference_title: "Impaired T3 uptake and action in MCT8-deficient cerebral organoids underlie Allan-Herndon-Dudley syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MCT8-deficient COs exhibited (i) altered early neurodevelopment, resulting
      in smaller neural rosettes with thinner cortical units, (ii) impaired
      triiodothyronine (T3) transport in developing neural cells, as assessed
      through deiodinase-3-mediated T3 catabolism, (iii) reduced expression of
      genes involved in cerebral cortex development, and (iv) reduced T3
      inducibility of TH-regulated genes.
    explanation: >-
      Patient-derived human cerebral organoids demonstrate the full chain within
      human neural tissue: impaired T3 transport, blunted T3-responsive gene
      induction, and disrupted cortical development. This is the strongest
      human-specific evidence for the cerebral arm and sidesteps the species
      differences that limit mouse models.
  downstream:
  - target: Impaired Oligodendrocyte Maturation and Hypomyelination
    description: >-
      Thyroid hormone is the timing signal for oligodendrocyte precursor
      differentiation; without it, myelination is delayed.
    causal_link_type: DIRECT
  - target: Disrupted Neuronal and Cerebellar Development
    description: >-
      T3-dependent programs governing GABAergic interneuron, cortical, and
      cerebellar maturation are under-driven.
    causal_link_type: DIRECT
- name: Impaired Oligodendrocyte Maturation and Hypomyelination
  description: >-
    Thyroid hormone provides the temporal cue that drives oligodendrocyte
    precursor cells to exit the progenitor state and become mature, myelinating
    oligodendrocytes. In MCT8 deficiency the precursor pool expands while mature
    oligodendrocyte numbers fall, a differentiation block that produces reduced
    myelin content, a shift toward small-caliber myelinated axons, and the
    global delay in myelination seen on MRI in essentially every patient.
  role: effector
  biological_scale: CELLULAR
  cell_types:

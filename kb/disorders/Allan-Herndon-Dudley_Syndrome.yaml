    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Increased T3/T4 ratio
    description: The divergence of T3 and T4 raises the T3/T4 ratio, a derived diagnostic index.
    causal_link_type: DIRECT
  - target: Decreased circulating reverse T3 concentration
    description: >-

      Combined hypomyelination of motor pathways and central motor
      under-development leaves most affected males unable to walk independently.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Disrupted Neuronal and Cerebellar Development
  description: >-
    Beyond myelin, thyroid hormone drives neuronal migration, dendritic
    arborization, GABAergic interneuron maturation, and cerebellar granule and
    Purkinje cell development. Loss of brain hormone supply during the critical
    developmental window leaves these programs incomplete and irreversible,
    which is why the few motor and cognitive abilities patients acquire do not
    improve with age.

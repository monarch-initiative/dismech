biochemical:
- name: Serum total triiodothyronine (T3)
  notes: >-
    Serum T3 is elevated in essentially all affected males and is the entry
    point to the diagnosis. In the Triac Trial cohort, mean baseline T3 was
    4.97 nmol/L against a normal target range of 1.4-2.5 nmol/L, roughly double
    the upper limit of normal.

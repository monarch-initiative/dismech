    modifier: DECREASED
  evidence:
  - reference: PMID:37307933
    reference_title: "Thyroid hormone transporter Mct8/Oatp1c1 deficiency compromises proper oligodendrocyte maturation in the mouse CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Proper CNS myelination depends on the timed availability of thyroid
      hormone (TH) that induces differentiation of oligodendrocyte precursor
      cells (OPCs) to mature, myelinating oligodendrocytes.
    explanation: >-
      Establishes the thyroid-hormone dependence of the OPC-to-oligodendrocyte
      transition that fails when brain hormone supply is lost.
  - reference: PMID:37307933
    reference_title: "Thyroid hormone transporter Mct8/Oatp1c1 deficiency compromises proper oligodendrocyte maturation in the mouse CNS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Dko mice exhibited at all analysed time points an increased portion of
      OPCs and a reduced number of mature oligodendrocytes both in white and
      grey matter regions indicating a differentiation blockage in the absence
      of Mct8/Oatp1c1.
    explanation: >-
      Demonstrates the specific cellular lesion, an oligodendrocyte
      differentiation block, in the Mct8/Oatp1c1 double-knockout model of human
      MCT8 deficiency.
  - reference: PMID:34838669
    reference_title: "Deficient thyroid hormone transport to the brain leads to impairments in axonal caliber and oligodendroglial development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the MCT8-deficient subject presents severely reduced myelin lipid and
      protein staining and increased proportion of small-caliber myelinated
      axons in detriment of large-caliber ones
    explanation: >-
      Human post-mortem brain histology confirms that the myelin deficit and
      axonal caliber shift are real features of MCT8-deficient human brain, not
      only of the mouse model.
  downstream:
  - target: Delayed myelination
    description: >-
      The oligodendrocyte differentiation block manifests radiologically as a
      global delay in myelination.
    causal_link_type: DIRECT
  - target: Spastic tetraplegia
    description: >-
      Deficient myelination of corticospinal projections contributes to the
      pyramidal signs that supersede infantile hypotonia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Inability to walk
    description: >-
      Combined hypomyelination of motor pathways and central motor
      under-development leaves most affected males unable to walk independently.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Disrupted Neuronal Development
  description: >-
    Beyond myelin, thyroid hormone drives neural-progenitor expansion,
    neuronal migration, and cortical maturation. Patient-derived cerebral
    organoids show that MCT8 deficiency disrupts these programs early in human
    development, producing smaller neural rosettes, thinner cortical units, and
    reduced expression of cortex-development genes. The long-term cohort shows
    a very low developmental ceiling, but does not by itself establish which
    neuronal subprogram accounts for each clinical manifestation.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: Central Nervous System Development
    term:

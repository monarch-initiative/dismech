    reference_title: "Allan-Herndon-Dudley Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary team to provide standard care for hypotonia, poor
      feeding, DD/ID, spasticity, and extrapyramidal movement disorders.
    explanation: GeneReviews management recommendation for multidisciplinary supportive care.
  - reference: PMID:20301789

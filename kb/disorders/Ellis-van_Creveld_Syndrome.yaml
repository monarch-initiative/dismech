pathophysiology:
- name: Primary Cilium Dysfunction
  description: >
    EVC and EVC2 form an interdependent complex that localizes to the EvC zone
    at the base of primary cilia, where it is anchored by the EFCAB7-IQCE
    tethering module and associates with Smoothened (SMO). Loss-of-function
    variants in EVC or EVC2 lose or mislocalize this ciliary-base complex. The
    defect is in complex localization within the cilium rather than in building
    the cilium; the downstream Hedgehog signalling consequences are described
    on the Hedgehog Signaling Disruption node.

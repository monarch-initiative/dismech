- name: Hedgehog Signaling Disruption
  description: >
    EVC and EVC2 form a complex at the base of the primary cilium that is
    required for transduction of Indian Hedgehog (IHH) and Sonic Hedgehog (SHH)
    signaling. The complex interacts with Smoothened (SMO) and regulates GLI
    transcription factor processing. Loss of function of either protein impairs
    Hh-dependent processes including skeletal patterning, endochondral
    ossification in growth plate chondrocytes, and cardiac septation.

diagnosis:
- name: Clinical, Radiographic, and Molecular Diagnosis
  description: >-
    Ellis-van Creveld syndrome is diagnosed from characteristic clinical and
    radiographic findings (disproportionate short stature, postaxial
    polydactyly, chondrodysplasia, and the EvC-zone dental/oral findings) and
    confirmed by molecular genetic testing of the EVC/EVC2 ciliary Hedgehog
    genes and other short-rib/ciliopathy loci. Early echocardiography is a
    diagnostic priority because of the high frequency of common atrium /
    atrioventricular canal defects.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:37903214
    reference_title: "Ellis-van Creveld Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of EVC syndrome is established in a proband with characteristic clinical and radiographic findings and biallelic pathogenic variants in DYNC2H1, DYNC2LI1, EVC, EVC2, GLI, SMO, or WDR35 or a heterozygous pathogenic variant in PRKACA or PRKACB identified by molecular genetic testing."
    explanation: >-
      GeneReviews defines the combined clinical/radiographic and molecular
      diagnostic criteria for EvC syndrome across its ciliary Hedgehog genes.
- name: Echocardiography and Prenatal Ultrasound
  description: >-
    Transthoracic or fetal echocardiography and prenatal ultrasound detect
    cardiac defects, narrow thorax, shortening of long bones, and hexadactyly.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal abnormalities (that may be detected by ultrasound examination) include narrow thorax, shortening of long bones, hexadactyly and cardiac defects."
    explanation: >-
      Establishes prenatal ultrasound and cardiac evaluation as diagnostic
      modalities for detecting thoracic, skeletal, and cardiac malformations in EvC.
  - reference: PMID:37903214
    reference_title: "Ellis-van Creveld Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "monitor for dental eruption, overcrowding, and dental morphology annually throughout childhood; echocardiogram as needed"
    explanation: >-
      GeneReviews surveillance recommendations include echocardiography as
      needed, backing the postnatal echocardiography half of this row.
treatments:
- name: Cardiac Surgery
  description: >
    Surgical repair and standard medical management of congenital heart
    defects, particularly common atrium repair and atrioventricular septal
    defect closure.
  treatment_term:

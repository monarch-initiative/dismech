      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive inheritance for the forms caused by biallelic variants
    in EVC, EVC2, DYNC2H1, DYNC2LI1, GLI, SMO, or WDR35; each sib of two
    heterozygous parents has a 25% risk of being affected. High prevalence in
    the Old Order Amish community due to a founder mutation.
  evidence:

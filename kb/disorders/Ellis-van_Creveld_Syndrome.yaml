  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    snippet: >-
      Management during the neonatal period is mostly symptomatic,
      involving treatment of the respiratory distress due to narrow
      chest and heart failure.
    explanation: >-
      Neonatal respiratory support is a key early management priority.
  - reference: PMID:37903214
    reference_title: "Ellis-van Creveld Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mechanical ventilation may be required in the neonatal period in those with severe restrictive lung disease"
    explanation: >-
      GeneReviews notes that neonatal mechanical ventilation may be needed
      for severe restrictive lung disease.
- name: Growth and Developmental Surveillance
  description: >
    Growth is monitored at least annually through childhood, and developmental

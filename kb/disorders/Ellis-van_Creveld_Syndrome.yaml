progression:
- phase: Prenatal and Neonatal Onset
  age_range: Prenatal to early infancy
  notes: >-
    Skeletal shortening, narrow thorax, postaxial polydactyly, and cardiac
    malformations are detectable on prenatal ultrasound and present at birth.
    Early mortality and morbidity are driven by thoracic insufficiency and
    congenital heart disease during the first months of life; survivors have
    normal cognitive development and progressive orthopedic and dental needs
    into adulthood.
  evidence:
  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prognosis is linked to the respiratory difficulties in the first months of
      life due to thoracic narrowness and possible heart defects. Prognosis of
      the final body height is difficult to predict.
    explanation: >-
      Summarizes the early-infancy cardiorespiratory prognostic bottleneck and
      long-term stature course in EvC.
differential_diagnoses:
- name: Weyers acrodental dysostosis
  disease_term:
    preferred_term: Weyers acrodental dysostosis
    term:
      id: MONDO:0008673
      label: acrofacial dysostosis, Weyers type
  description: >-
    Autosomal dominant allelic ciliopathy caused by heterozygous pathogenic
    variants in EVC or EVC2; shares postaxial polydactyly, nail dysplasia, and
    dental anomalies with EvC but lacks congenital heart defects, thoracic
    narrowing, and severe disproportionate dwarfism.
  evidence:
  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatally, the essential differential diagnoses include Jeune
      dystrophy, McKusick-Kaufman syndrome and Weyers syndrome.
    explanation: >-
      Identifies Weyers syndrome as one of the essential postnatal differential
      diagnoses for Ellis-van Creveld syndrome.
- name: Jeune syndrome
  disease_term:
    preferred_term: Jeune syndrome
    term:
      id: MONDO:0018770
      label: Jeune syndrome
  description: >-
    Asphyxiating thoracic dystrophy (ATD) overlapping with EvC in narrow
    thorax, short ribs, acromesomelic limb shortening, and polydactyly, but
    typically lacking characteristic EvC common atrium, multiple labiogingival
    frenula, and nail/dental dysplasia.
  evidence:
  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatally, the essential differential diagnoses include Jeune
      dystrophy, McKusick-Kaufman syndrome and Weyers syndrome.
    explanation: >-
      Identifies Jeune dystrophy as a core postnatal differential diagnosis of
      Ellis-van Creveld syndrome.
- name: McKusick-Kaufman syndrome
  disease_term:
    preferred_term: McKusick-Kaufman syndrome
    term:
      id: MONDO:0009367
      label: McKusick-Kaufman syndrome
  description: >-
    Autosomal recessive MKKS-related ciliopathy enriched in the Old Order Amish
    that shares postaxial polydactyly and congenital heart defects with EvC,
    but presents with hydrometrocolpos and lacks chondrodysplasia and
    ectodermal (nail/dental) dysplasia.
  evidence:
  - reference: PMID:17547743
    reference_title: "Ellis-van Creveld syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postnatally, the essential differential diagnoses include Jeune
      dystrophy, McKusick-Kaufman syndrome and Weyers syndrome.
    explanation: >-
      Identifies McKusick-Kaufman syndrome as a key postnatal differential
      diagnosis of Ellis-van Creveld syndrome.
datasets: []
references:
- reference: PMID:37903214
  title: "Ellis-van Creveld Syndrome."
  tags:
  - GeneReviews
  findings:
  - statement: >-
      Ellis-van Creveld syndrome is a skeletal ciliopathy characterized by
      postaxial polydactyly, disproportionate short-limb short stature, nail
      and dental dysplasia, and congenital heart disease.
    supporting_text: >-
      Ellis-van Creveld (EVC) syndrome is characterized by postaxial
      polydactyly of the hands, disproportionate short stature with short
      limbs, dystrophic and/or hypoplastic nails, dental and oral
      manifestations, congenital heart disease, and radiologic abnormalities
  - statement: >-
      Diagnosis is established by characteristic clinical and radiographic
      findings combined with biallelic pathogenic variants in EVC, EVC2, WDR35,
      DYNC2H1, DYNC2LI1, GLI, or SMO or heterozygous variants in PRKACA or
      PRKACB.

    snippet: "EVC syndrome caused by pathogenic variants in DYNC2H1, DYNC2LI1, EVC, EVC2, GLI, SMO, or WDR35 is inherited in an autosomal recessive manner."
    explanation: >-
      GeneReviews states the autosomal recessive mode of inheritance for the
      EVC/EVC2 and other recessive loci.
  - reference: PMID:37903214
    reference_title: "Ellis-van Creveld Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for an EVC syndrome-related pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected"
    explanation: >-

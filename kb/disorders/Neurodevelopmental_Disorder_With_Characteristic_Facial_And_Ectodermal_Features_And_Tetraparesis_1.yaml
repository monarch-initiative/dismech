name: Neurodevelopmental Disorder With Characteristic Facial And Ectodermal Features And Tetraparesis 1
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
synonyms:
- NEDFET1
- GTPBP1-related neurodevelopmental disorder
- GTPBP1/2-related ectodermal neurodevelopmental syndrome
- GREND syndrome
description: >-
  Neurodevelopmental disorder with characteristic facial and ectodermal
  features and tetraparesis 1 (NEDFET1) is an autosomal recessive syndrome
  caused by biallelic loss-of-function variants in GTPBP1, a translational
  GTPase related to the elongation factor eEF1A that acts in ribosome quality
  control. GTPBP1 deficiency produces the same syndrome as deficiency of its
  paralog GTPBP2 (Jaberi-Elahi syndrome), and the two are described together
  as GTPBP1/2-related ectodermal neurodevelopmental (GREND) syndrome.
  Affected children have profound developmental impairment with absent motor
  milestones and speech, microcephaly, refractory seizures beginning in the
  first year, progressive spastic tetraparesis, choreoathetoid and myoclonic
  movements, hearing and visual impairment, and brain atrophy that mainly
  affects the cerebellum. Characteristic facial features (high frontal
  hairline, sparse eyebrows and hair, prominent nasal bridge, full lips and
  cheeks) occur with ectodermal defects of hair, teeth, nails, skin
  pigmentation and sweat glands. In mice lacking Gtpbp1 on a strain with a
  brain tRNA deficiency, ribosomes pause at the affected codons and neurons
  die, which is the proposed mechanism; no translation defect was found in
  patient fibroblasts.
disease_term:
  preferred_term: neurodevelopmental disorder with characteristic facial and ectodermal features and tetraparesis 1
  term:
    id: MONDO:0975745
    label: neurodevelopmental disorder with characteristic facial and ectodermal features and tetraparesis 1
parents:
- Mendelian Neurodevelopmental Disorder
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 620888. The only published
  human cohort (PMID:38118446) pools individuals with GTPBP1 and GTPBP2
  variants and reports most phenotype counts for the pooled cohort, so this
  entry records the phenotypes the authors describe as shared without
  frequencies. The GTPBP2 disease is the separate MONDO term Jaberi-Elahi
  syndrome (MONDO:0060711), still an open stub; the two are kept apart here
  because MONDO keeps them apart. The ribosome-pausing mechanism is shown only
  in mice that also carry a brain-specific tRNA mutation, and ribosome
  profiling of patient fibroblasts (from GTPBP2 cases) found no stalling.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals carry homozygous GTPBP1 variants (two nonsense, one
    missense), mostly in consanguineous families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, bi-allelic GTPBP1 and GTPBP2 LoF variants cause an identical, distinct neurodevelopmental syndrome."
    explanation: Biallelic loss-of-function variants cause the disease.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nonsense (n = 2) and missense (n = 1) homozygous variants in GTPBP1 (GenBank: NM_004286)"
    explanation: All GTPBP1 variants were homozygous.
pathophysiology:
- name: Loss of GTPBP1 Function
  description: >-
    Homozygous nonsense and missense variants reduce GTPBP1 mRNA and protein
    in patient fibroblasts. GTPBP1 is a cytoplasmic translational GTPase that,
    like eEF1A, delivers aminoacyl-tRNA to the ribosomal A site, but releases
    it slowly, which suits it to a surveillance role rather than to bulk
    elongation. It also stimulates exosomal degradation of mRNA in elongation
    complexes.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GTPBP1
    term:
      id: hgnc:4669
      label: GTPBP1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: translation elongation factor activity
    modifier: DECREASED
    term:
      id: GO:0003746
      label: translation elongation factor activity
  downstream:
  - target: Unresolved Ribosome Pausing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33186095
      reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that loss of the homologous protein GTPBP1 during tRNA deficiency in the mouse brain also leads to codon-specific ribosome pausing and neurodegeneration"
      explanation: Loss of Gtpbp1 causes codon-specific ribosome pausing in mouse brain.
  evidence:
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "available fibroblast cell lines from affected individuals were used to perform semi-qPCR and western blot analyses, which identified significant reduction of both mRNA and protein levels, respectively, suggesting a LoF mechanism of the variants"
    explanation: Patient fibroblasts show reduced mRNA and protein, consistent with loss of function.
  - reference: PMID:30108131
    reference_title: "Functions of unconventional mammalian translational GTPases GTPBP1 and GTPBP2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we demonstrate that GTPBP1 possesses eEF1A-like elongation activity, delivering cognate aminoacyl-transfer RNA (aa-tRNA) to the ribosomal A site in a GTP-dependent manner. It also stimulates exosomal degradation of mRNAs in elongation complexes."
    explanation: Biochemical activities of GTPBP1 that are lost in the disease.
  - reference: PMID:41350250
    reference_title: "Structural mechanism of mRNA decoding by mammalian GTPase GTPBP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similarly to eEF1A, GTPBP1 delivers aminoacyl-tRNA to the ribosome, but the ensuing GTPBP1-mediated elongation is slow."
    explanation: Structural work confirms slow GTPBP1-mediated elongation, consistent with a quality control role.
- name: Unresolved Ribosome Pausing
  description: >-
    Without GTPBP1, ribosomes that pause at codons whose tRNA is scarce are
    not rescued. In Gtpbp1 knockout mice on the C57BL/6J background, which
    carries a processing mutation in the brain-specific arginine tRNA gene
    n-Tr20, ribosome occupancy rises at AGA codons in the cerebellum. GTPBP1
    and its paralog GTPBP2 are thought to act non-redundantly in the same
    rescue pathway. Whether the same pausing occurs in human neurons is not
    known; it was not seen in fibroblasts from GTPBP2-deficient patients.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: rescue of stalled cytosolic ribosome
    modifier: DECREASED
    term:
      id: GO:0072344
      label: rescue of stalled cytosolic ribosome
  downstream:
  - target: Integrated Stress Response Activation
    causal_link_type: DIRECT
  - target: Reduced mTORC1 Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Neuronal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Note that ribosome occupancy increased only at AGA codons in P21 B6J.Gtpbp1-/- mice."
    explanation: Codon-specific ribosome pausing in the Gtpbp1 knockout brain.
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that both GTPBP1 and GTPBP2 function as ribosome-rescue factors and are essential genes in many neurons when n-Tr20 levels are diminished."
    explanation: GTPBP1 acts as a ribosome rescue factor in neurons.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Taken together, we did not observe a significant translation defect in fibroblast cell lines from affected individuals."
    explanation: >-
      Ribosome profiling of patient fibroblasts found no stalling. The cells
      came from GTPBP2-deficient individuals, and the authors note that
      stalling may be specific to neurons or to stress conditions.
- name: Integrated Stress Response Activation
  description: >-
    Paused ribosomes activate the kinase GCN2, which phosphorylates eIF2alpha
    and induces ATF4 target genes in the Gtpbp1 knockout brain. This response
    is protective: deleting Gcn2 accelerates and widens neuron loss.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: integrated stress response signaling
    modifier: INCREASED
    term:
      id: GO:0140467
      label: integrated stress response signaling
  role: Compensatory
  evidence:
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As observed in Gtpbp2-/- mice (Ishimura et al., 2016), GCN2-mediated activation of the integrated stress response (ISR) was apparent in the Gtpbp1-/- brain. We observed decreased mTORC1 signaling which increased neuronal death, whereas ISR activation was neuroprotective."
    explanation: ISR activation is neuroprotective, while reduced mTORC1 signaling increases neuron death.
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In 5-week-old B6J.Gtpbp1-/-; Gcn2-/- mice, 65% of these neurons had degenerated compared to 37% in B6J.Gtpbp1-/- mice"
    explanation: Removing the stress response worsens granule cell loss.
- name: Reduced mTORC1 Signaling
  description: >-
    In the Gtpbp1 knockout hippocampus, mTORC1 activity (read out as S6
    phosphorylation) falls sharply, most of all in the dentate gyrus granule
    cells that go on to degenerate. Inhibiting mTOR with rapamycin speeds up
    neuron death, so the fall in mTORC1 signaling worsens degeneration
    rather than protecting against it.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: TOR signaling
    modifier: DECREASED
    term:
      id: GO:0031929
      label: TOR signaling
  downstream:
  - target: Neuronal Degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33186095
      reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Examination of the cerebellum from P28 B6J.Gtpbp1-/- and B6J-Gtpbp2-/- cerebellum revealed that rapamycin treatment increased granule cell loss by 30% (lobule VI) and 40% (lobule IX) compared to mutant mice treated with vehicle"
      explanation: Further inhibiting mTOR accelerates neuron loss in the knockout.
  evidence:
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to the cerebellum, p-S6240/244 levels were decreased by about 90% in the hippocampus of 3-week-old B6J.Gtpbp1-/- and B6J-Gtpbp2-/- mice relative to wild type"
    explanation: mTORC1 readout is sharply reduced in the knockout hippocampus.
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As observed in Gtpbp2-/- mice (Ishimura et al., 2016), GCN2-mediated activation of the integrated stress response (ISR) was apparent in the Gtpbp1-/- brain. We observed decreased mTORC1 signaling which increased neuronal death, whereas ISR activation was neuroprotective."
    explanation: The authors' summary that reduced mTORC1 signaling increases neuron death.
- name: Neuronal Degeneration
  description: >-
    In Gtpbp1-deficient mice, cerebellar granule cells, dentate gyrus granule
    cells, cortical layer IV neurons and retinal neurons die from about four
    weeks of age, the mice become ataxic by six weeks and die by eight weeks.
    Reduced mTORC1 signaling in the vulnerable neurons accelerates this
    death. Patients show progressive brain atrophy that mainly affects the
    cerebellum, with the progressive spasticity and movement disorder of a
    neurodegenerative course.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cerebellar granule cell
    term:
      id: CL:0001031
      label: cerebellar granule cell
  downstream:
  - target: Cerebral atrophy
  - target: Cerebellar atrophy
  - target: Spastic tetraparesis
  - target: Choreoathetosis
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Seizures begin in the first year, before the atrophy progresses, so a
      developmental cause is at least as likely as neuron loss. The edge is
      kept as a proposed link.
  evidence:
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Like B6J-Gtpbp2-/- mice, B6J.Gtpbp1-/- mice were indistinguishable from littermate controls at 3 weeks of age, developed overt ataxia by 6 weeks, and died by 8 weeks of age."
    explanation: Progressive neurological disease in the knockout mouse.
  - reference: PMID:33186095
    reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As previously observed in B6J-Gtpbp2-/- mice, granule cells in the DG, layer IV cortical neurons and multiple neurons in the retina degenerated in B6J.Gtpbp1-/- mice"
    explanation: The neuronal populations that degenerate without Gtpbp1.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical syndrome associated with bi-allelic GTPBP1 or GTPBP2 variants can be defined as a complex syndromic neurodevelopmental disorder associated with severe neurodegeneration, epilepsy, choreiform movement disorder, and ectodermal abnormalities, with pathognomonic craniofacial features."
    explanation: Neurodegeneration is part of the human syndrome.

  notes: >-
    Reported alleles are homozygous: two nonsense variants, including
    p.Tyr509Ter in family 1, and one missense variant (NM_004286). No ClinGen
    gene-disease validity assertion for GTPBP1 is in the cached ClinGen
    export, so no validity tier is recorded.
  evidence:
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe individuals carrying bi-allelic GTPBP1 variants that display an identical phenotype with GTPBP2 and characterize the overall spectrum of GTP-binding protein (1/2)-related disorders."
    explanation: First report of GTPBP1 as a disease gene.
  - reference: PMID:38118446
    reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nonsense (n = 2) and missense (n = 1) homozygous variants in GTPBP1 (GenBank: NM_004286)"
    explanation: The GTPBP1 alleles found.
animal_models:
- name: B6J.Gtpbp1-/- mouse
  species: Mouse
  genotype: Gtpbp1 -/- on C57BL/6J, homozygous for the n-Tr20 tRNA processing mutation
  publication: PMID:33186095
  description: >-
    Congenic Gtpbp1 knockout mice on the C57BL/6J background develop ataxia
    by six weeks and die by eight weeks, with degeneration of cerebellar,
    dentate gyrus, cortical layer IV and retinal neurons. Gtpbp1 knockouts on
    a mixed background have no overt phenotype, so the disease depends on the
    strain's tRNA deficiency.
  modeled_mechanisms:
  - target: Unresolved Ribosome Pausing
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    description: Ribosome profiling shows AGA codon-specific pausing in the knockout cerebellum.
    limitations: >-
      Pausing and neuron death need the strain's n-Tr20 tRNA mutation, which
      patients do not carry, and pausing has not been examined in patient
      neurons.
    evidence:
    - reference: PMID:33186095
      reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Note that ribosome occupancy increased only at AGA codons in P21 B6J.Gtpbp1-/- mice."
      explanation: Codon-specific pausing in the model.
  - target: Neuronal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The mice show progressive, region-specific neuron loss.
    limitations: >-
      The model is a juvenile-onset degeneration that depends on a second,
      strain-specific tRNA mutation. It does not show the developmental,
      craniofacial or ectodermal features of the human syndrome.
    evidence:
    - reference: PMID:33186095
      reference_title: "GTPBP1 resolves paused ribosomes to maintain neuronal homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, here we demonstrate that loss of Gtpbp1 in mice with the B6J-associated mutation in n-Tr20 causes neurodegeneration identical to that observed in B6J-Gtpbp2-/- mice."
      explanation: Neurodegeneration requires the n-Tr20 background.
- name: Drosophila CG2017 hypomorph and knockdown
  species: Fruit fly
  genotype: piggyBac insertions in CG2017, or pan-neuronal CG2017 shRNA
  publication: PMID:38118446
  description: >-
    Reduced expression of CG2017, the fly ortholog of GTPBP1 and GTPBP2,
    reduces locomotor responses.
  modeled_mechanisms:
  - target: Spastic tetraparesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: The flies have a motor defect, matching the severe motor impairment of patients.
    limitations: >-
      CG2017 is closer to GTPBP2 than to GTPBP1, and a fly paralog that is
      closer to GTPBP1 was not studied. A locomotor defect in flies is not
      spasticity.
    evidence:
    - reference: PMID:38118446
      reference_title: "Bi-allelic genetic variants in the translational GTPases GTPBP1 and GTPBP2 cause a distinct identical neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these data demonstrate a conserved role for GTPBP1/2 and CG2017 in promoting normal movements and suggest a key role for these proteins in neurons."
      explanation: The authors' conclusion from the fly experiments.

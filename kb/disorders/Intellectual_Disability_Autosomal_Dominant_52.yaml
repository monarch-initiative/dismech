      label: Autosomal dominant inheritance
  description: The disorder is autosomal dominant with variable expressivity. Many established truncating
    variants are de novo, but maternal transmission of p.Lys827* with mild cognitive findings has been
    reported. Haploinsufficiency is a supported mechanism; reported missense alleles are not all proven
    to act by it.
  penetrance: UNKNOWN
  expressivity: VARIABLE

    reference_title: ASH1L mutation caused seizures and intellectual disability in twin sisters.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we present twin sisters exhibiting mild intellectual disability and seizures.
    explanation: The ASH1L twin report establishes mild intellectual disability independently of the combined
      ID/DD tally.
  - reference: PMID:28394464
    reference_title: Novel MCA/ID syndrome with ASH1L mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a novel mutation in ASH1L in a patient with severe intellectual disability,
      growth failure, microcephaly, facial dysmorphism, myelination delay, and skeletal abnormalities.
    explanation: Severe ID was reported in the p.Ala2786Pro missense case; its mechanism is not assumed
      to match truncating alleles.
  notes: The 2024 summary reports ID or developmental delay in 15/16 assessed probands; this combined
    denominator does not establish an intellectual-disability-only frequency. Borderline test scores in
    some reports are not equated with a formal ID diagnosis.

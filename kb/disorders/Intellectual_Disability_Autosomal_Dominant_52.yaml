      Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Heterozygous pathogenic variants in ASHL1 have been implicated in an autosomal dominant neurodevelopmental
      disorder (NDD).
    explanation: States the autosomal dominant, heterozygous inheritance mode. The gene symbol is misspelled
      "ASHL1" in the source sentence and is quoted as printed.
  - reference: PMID:38674358
    reference_title: Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental
      Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: haploinsufficiency is believed to be at least one disease mechanism
    explanation: The source supports haploinsufficiency as at least one mechanism. Variable clinical expression
      and unknown penetrance are separate observations, not consequences encoded by this quote.
  - reference: PMID:39902220
    reference_title: Novel heterozygous ASH1L nonsense variant involved in mild intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cosegregation analysis revealed that the variant was passed down from the mother (Figure
      1A). Sanger sequencing verified the presence or absence of this mutation in the family members (Figure
      1B).
    explanation: The report states maternal transmission of p.Lys827*; the mother had similar cognitive
      symptoms. The full trio was not exome-sequenced.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Provisional clinical translation of the heterozygous gene-trap rescue experiment. PFC
      inhibition improved social behavior and abolished absence-like seizures; this does not demonstrate
      a single circuit for all human seizure semiologies.

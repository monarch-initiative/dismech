- name: Synaptic Pruning Failure
  description: Developmental synapse elimination fails and excess synapses persist. In haploinsufficient
    mice this is traced to loss of Eph receptor A7 expression through EZH2-mediated H3K27me3 accumulation
    in its gene body, and restoring EphA7 signalling with its ligand ephrin-A5 restores pruning. This
    node captures the single concept of the pruning deficit.

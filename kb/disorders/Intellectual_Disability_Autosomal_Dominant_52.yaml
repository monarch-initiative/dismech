- name: Disrupted Cortical Neuron Specification and Lamination
  description: >-
    ASH1L is required during corticogenesis to specify projection neuron identity
    and place neurons in the correct layer. In its absence, SATB2-expressing
    neurons increase in number, are distributed through the cortical plate instead
    of being confined to upper layers, and follow an altered differentiation
    trajectory. This node captures the single concept of the cortical patterning
    defect.

      and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Whole-cell patch-clamp recordings showed that Ash1l haploinsufficiency increased the excitability
      of pyramidal neurons in the PFC by altering intrinsic neuronal properties, enhancing glutamatergic
      synaptic transmission, and diminishing GABAergic synaptic inhibition.
    explanation: Establishes pyramidal hyperexcitability in the model that matches the human heterozygous
      genotype, and separates the intrinsic from the synaptic contribution.
  downstream:

discussions:
- discussion_id: gap_mrd52_which_histone_mark_carries_the_disease
  prompt: >-
    Which histone mark deposited by ASH1L - H3K36 or H3K4 - is the one whose loss
    causes the neurodevelopmental phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced ASH1L Histone Methyltransferase Activity
  - pathophysiology#Loss of Activating Chromatin Marks at Neurodevelopmental Gene Promoters
  rationale: >-
    The clinical literature routinely describes ASH1L as an H3K36 methyltransferase,
    and the only human variant-interpretation paper to reason about mechanism
    attributes the defect to reduced H3K36 methylation. But the one study that
    actually measured chromatin in brain reports reduced H3K4me3 - in autism
    postmortem prefrontal cortex, and at the promoters of the downregulated genes
    in the mouse knockdown. Both marks are curated on the enzyme node because the
    sources support both, but they imply different downstream biology: H3K36
    methylation is deposited across gene bodies of transcribed genes, whereas
    H3K4me3 is a promoter mark. Nothing in the published work resolves whether the
    H3K4me3 change is a direct catalytic product of ASH1L or an indirect
    consequence.
  proposed_experiments:
  - experiment_id: exp_mrd52_separation_of_function_ash1l_alleles
    name: Separation-of-function ASH1L alleles in neurons
    description: >-
      Compare catalytically dead ASH1L, and alleles selectively impaired for one
      mark, in the same neuronal system, measuring H3K36 and H3K4 methylation
      genome-wide alongside expression of the affected risk-gene set, to determine
      which mark's loss is sufficient for the transcriptional phenotype.
  evidence:
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These downregulated genes are enriched in excitatory and inhibitory
      synaptic function and have decreased H3K4me3 occupancy at their promoters.
    explanation: >-
      The measurement that puts H3K4me3, not H3K36 methylation, at the affected
      promoters.
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ASH1L, located at chromosomal band 1q22, encodes a histone
      methyltransferase that catalyzes histone H3K36 methylation
    explanation: >-
      The clinical literature's H3K36 characterization, which is the other side of
      the discrepancy.
- discussion_id: gap_mrd52_missense_versus_truncating_severity
  prompt: >-
    Are ASH1L missense variants genuinely associated with a more severe and more
    autism-weighted phenotype than truncating variants, and if so does that mean
    they act by something other than simple haploinsufficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Heterozygous ASH1L Loss of Function
  - pathophysiology#Reduced ASH1L Histone Methyltransferase Activity
  rationale: >-
    A 2021 review of published cases reported that missense-variant patients had
    more severe phenotypes and more autism than truncating-variant patients. If
    real, that is mechanistically important: a missense allele more damaging than a
    null implies a dominant-negative or gain-of-function effect rather than
    haploinsufficiency, which is the mechanism the field otherwise assumes. But the
    2024 Brain Gene Registry review takes the opposite editorial position, treating
    the reported missense alleles as still requiring functional work and excluding
    the registry's own missense-variant participants from its phenotype tabulation
    on those grounds. No functional assay has been published for any human missense
    allele.
  proposed_experiments:
  - experiment_id: exp_mrd52_missense_allele_functional_assay
    name: Functional assay of reported ASH1L missense alleles
    description: >-
      Express reported missense alleles alongside wild type and null in a neuronal
      system, and test both catalytic output and whether the missense protein
      interferes with the wild-type allele, to distinguish haploinsufficiency from
      a dominant-negative effect.
  evidence:
  - reference: PMID:34373061
    reference_title: "ASH1L mutation caused seizures and intellectual disability in twin sisters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that patients with missense mutations in ASH1L appeared to present
      with more severe phenotypes and a higher likelihood of ASD than those with
      truncating mutations.
    explanation: States the genotype-phenotype claim this gap is about.
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haploinsufficiency is believed to be at least one disease mechanism
    explanation: >-
      The hedged wording - "at least one" mechanism - is the counterweight: the
      2024 review holds the missense mechanism open rather than accepting the
      severity claim.
- discussion_id: mismatch_mrd52_model_genotype_and_seizure_semiology
  prompt: >-
    Do the Ash1l mouse models inform human ASH1L-related epilepsy, given that the
    strongest excitation-inhibition data come from a severe knockdown rather than
    haploinsufficiency, and the haploinsufficient model's spontaneous seizures are
    absence-like rather than the focal and myoclonic types reported in patients?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cortical Excitation-Inhibition Imbalance
  - pathophysiology#Seizures
  rationale: >-
    Two different manipulations underlie the excitability story and they are not
    interchangeable. The mechanistic detail - which genes lose H3K4me3, which
    synaptic currents change, that diazepam plus chemogenetic silencing rescues
    seizures - comes from a prefrontal knockdown described by its own authors as
    severe deficiency, causing early mortality that human patients do not have. The
    genotype-matched heterozygous gene-trap model reproduces hyperexcitability but
    its spontaneous seizures are absence-like, and convulsive seizures appear only
    on pentylenetetrazole challenge, whereas reported patients have febrile, focal
    motor and myoclonic seizures. Reading the knockdown's rescue result as a
    therapeutic lead for patients therefore crosses two gaps at once: dose and
    semiology.
  proposed_experiments:
  - experiment_id: exp_mrd52_heterozygous_model_seizure_characterization
    name: Longitudinal seizure phenotyping of genotype-matched Ash1l heterozygotes
    description: >-
      Perform long-term video-EEG across development in heterozygous Ash1l mice on
      more than one genetic background, classifying seizure types against the human
      semiologies, and test whether the GABA-enhancing rescue that works in the
      severe knockdown also works at heterozygous dose.
  evidence:
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Chemogenetic inhibition of PFC pyramidal neuronal activity, combined with
      the administration of GABA enhancer diazepam, rescues PFC synaptic imbalance
      and seizures, but not autistic social deficits or anxiety-like behaviors.
    explanation: >-
      The rescue result, and its own limit - the same intervention does not touch
      the social or anxiety phenotype, so even within the model it addresses one
      arm only.
  - reference: PMID:39766886
    reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Epileptiform discharges were found on electroencephalograms (EEGs) of
      Ash1l+/GT mice, indicating absence-like seizures.
    explanation: >-
      Establishes the semiology of the genotype-matched model, which is the half
      of the mismatch that dose-matching does not fix.

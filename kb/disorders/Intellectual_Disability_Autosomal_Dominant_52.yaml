    modifier: DECREASED
  evidence:
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knockdown of Ash1L in PFC of juvenile mice induces the downregulation of
      risk genes associated with ASD, intellectual disability (ID) and epilepsy.
    explanation: >-
      Establishes that the transcriptional consequence of ASH1L loss falls
      specifically on autism, intellectual-disability and epilepsy risk genes.
  - reference: PMID:34145365
    reference_title: "Loss of histone methyltransferase ASH1L in the developing mouse brain causes autistic-like behaviors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gene expression analyses uncover critical roles of ASH1L in regulating gene
      expression during neural cell development.
    explanation: >-
      Independent model-organism support for ASH1L acting through transcriptional
      regulation during neural development.
  downstream:
  - target: Synaptic Pruning Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In haploinsufficient mice the route runs through silencing of the Eph
      receptor A7 gene by EZH2-deposited H3K27me3.
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      The downregulated gene set is enriched for both excitatory and inhibitory
      synaptic function, and the net measured effect is loss of inhibition with
      enhanced excitation.
  - target: Disrupted Cortical Neuron Specification and Lamination
    causal_link_type: DIRECT
    description: >-
      The same transcriptional dependence operates during corticogenesis, when
      ASH1L is required to specify upper-layer projection neuron identity.
  - target: Extraneural Developmental Anomalies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      ASH1L is required for gene expression across organ systems, but the
      transcriptional programmes linking its loss to the genital, skeletal and
      craniofacial findings have not been identified.
- name: Synaptic Pruning Failure
  description: >-
    Developmental synapse elimination fails and excess synapses persist. In
    haploinsufficient mice this is traced to loss of Eph receptor A7 expression
    through EZH2-mediated H3K27me3 accumulation in its gene body, and restoring
    EphA7 signalling with its ligand ephrin-A5 restores pruning. This node
    captures the single concept of the pruning deficit.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: synapse pruning
    term:
      id: GO:0098883
      label: synapse pruning
    modifier: DECREASED
  evidence:
  - reference: PMID:35081333
    reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistically, deletion of Ash1l in neurons induces excessive synapses
      due to the synapse pruning deficits, especially during the post-learning
      period.
    explanation: >-
      Establishes failed synapse pruning as the cellular mechanism in
      Ash1l-deficient neurons.
  - reference: PMID:35081333
    reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Specifically, Eph receptor A7 is downregulated in Ash1l+/- mice through
      accumulating EZH2-mediated H3K27me3 in its gene body.
    explanation: >-
      Identifies the specific gene, and the repressive-mark mechanism, connecting
      ASH1L haploinsufficiency to the pruning deficit.
  downstream:
  - target: Autistic and Behavioral Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Persisting excess synapses are proposed as the substrate of the autistic
      phenotype; the steps from altered connectivity to behaviour are not
      established.
- name: Cortical Excitation-Inhibition Imbalance
  description: >-
    Loss of the ASH1L-dependent synaptic gene programme leaves cortical circuits
    with diminished GABAergic inhibition and enhanced glutamatergic transmission.
    This node captures the single concept of the excitation-inhibition imbalance
    and conforms to the shared epilepsy final common pathway.
  role: mediator
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic neuron

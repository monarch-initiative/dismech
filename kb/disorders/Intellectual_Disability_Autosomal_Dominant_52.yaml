inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Affected individuals are heterozygous for a loss-of-function ASH1L variant,
    most often de novo. The disease mechanism is haploinsufficiency rather than a
    dominant-negative effect.
  penetrance: UNKNOWN
  expressivity: VARIABLE
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants in ASHL1 have been implicated in an
      autosomal dominant neurodevelopmental disorder (NDD).
    explanation: >-
      States the autosomal dominant, heterozygous inheritance mode. The gene
      symbol is misspelled "ASHL1" in the source sentence and is quoted as
      printed.
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haploinsufficiency is believed to be at least one disease mechanism
    explanation: >-
      Identifies haploinsufficiency as the dominant mechanism, which is what
      `expressivity: VARIABLE` with `penetrance: UNKNOWN` is recording - no
      penetrance estimate has been published, and the reported phenotypes range
      from average measured cognition to moderate intellectual disability.
pathophysiology:
- name: Heterozygous ASH1L Loss of Function
  description: >-
    A heterozygous loss-of-function variant in ASH1L - nonsense, frameshift or
    whole-gene deletion - is the initiating lesion. This node captures the single
    concept of the genetic lesion.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: ASH1L
    term:
      id: hgnc:19088
      label: ASH1L
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants in ASHL1 have been implicated in an
      autosomal dominant neurodevelopmental disorder (NDD).
    explanation: >-
      Establishes heterozygous ASH1L variants as the cause. The gene symbol is
      misspelled in the source sentence and is quoted as printed.
  - reference: PMID:28191889
    reference_title: "Targeted sequencing identifies 91 neurodevelopmental-disorder risk genes with autism and developmental-disability biases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical follow-up for NAA15, KMT5B, and ASH1L highlighted new syndromic
      and nonsyndromic forms of disease.
    explanation: >-
      The large targeted-sequencing study that delineated ASH1L as a
      neurodevelopmental-disorder gene with a syndromic presentation.
  downstream:
  - target: Reduced ASH1L Histone Methyltransferase Activity
    causal_link_type: DIRECT
    description: >-
      One functional allele does not supply enough enzyme; ASH1L is among the
      most loss-of-function intolerant genes in the genome.
- name: Reduced ASH1L Histone Methyltransferase Activity
  description: >-
    ASH1L is the human Trithorax-group homolog of Drosophila Ash1 and deposits
    activating histone methylation. Sources differ on which mark carries the
    disease: the gene is most often described as an H3K36 methyltransferase, while
    the study that measured chromatin in brain reports H3K4 methylation as the
    affected mark. Both are recorded and the discrepancy is carried as an open
    gap. This node captures the single concept of reduced methyltransferase
    activity.
  role: mediator
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: histone H3K36 methyltransferase activity
    term:
      id: GO:0046975
      label: histone H3K36 methyltransferase activity
    modifier: DECREASED
  - preferred_term: histone H3K4 methyltransferase activity
    term:
      id: GO:0042800
      label: histone H3K4 methyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is a histone methyltransferase catalyzing H3K4 and H3K36 methylation, which
      plays an important role in chromatin modification and gene transcription
    explanation: >-
      Assigns both marks to ASH1L. Evidence source is OTHER because this is the
      paper's introductory characterization of the enzyme rather than its own
      measurement.
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      ASH1L, located at chromosomal band 1q22, encodes a histone
      methyltransferase that catalyzes histone H3K36 methylation
    explanation: >-
      Names H3K36 as the catalysed mark. Support is PARTIAL because this source
      names only H3K36 while the brain chromatin study measures H3K4; that
      disagreement is the subject of a curated knowledge gap.
  downstream:
  - target: Loss of Activating Chromatin Marks at Neurodevelopmental Gene Promoters
    causal_link_type: DIRECT
    description: >-
      Reduced enzyme activity leaves promoters of ASH1L-dependent genes with less
      activating methylation.
- name: Loss of Activating Chromatin Marks at Neurodevelopmental Gene Promoters
  description: >-
    Genes that depend on ASH1L lose activating histone methylation at their
    promoters. In prefrontal cortex the affected set is enriched for genes with
    synaptic function and is dominated by established risk genes for autism,
    intellectual disability and epilepsy - so the epigenetic lesion is not diffuse
    but falls on the same gene set that other neurodevelopmental disorders
    converge on. This node captures the single concept of the promoter chromatin
    defect.
  role: mediator
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These downregulated genes are enriched in excitatory and inhibitory
      synaptic function and have decreased H3K4me3 occupancy at their promoters.
    explanation: >-
      Directly links reduced promoter H3K4me3 occupancy to the downregulated
      synaptic gene set, in mouse prefrontal cortex.
  downstream:
  - target: Downregulation of Synaptic and Neurodevelopmental Gene Programs
    causal_link_type: DIRECT
    description: >-
      Loss of activating marks translates into reduced transcription of the
      affected genes.
- name: Downregulation of Synaptic and Neurodevelopmental Gene Programs
  description: >-
    Transcription of ASH1L-dependent synaptic and neurodevelopmental genes falls.
    This node is the branch point of the disorder: from here the phenotype
    separates into a synaptic-pruning arm, an excitability arm, and a
    cortical-patterning arm. This node captures the single concept of the
    transcriptional deficit.
  role: central_effector
  biological_scale: CELLULAR
  cell_types:

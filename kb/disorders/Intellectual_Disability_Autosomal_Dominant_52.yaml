      contribution.
  downstream:
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      Hyperexcitable cortical networks generate epileptiform discharge and
      clinical seizures.
- name: Seizures
  description: >-
    Seizures occur in roughly half of reported patients and span febrile, focal
    motor, absence and myoclonic semiologies; at least one reported proband's
    epilepsy was drug-resistant. This node captures the single concept of the
    clinical seizure endpoint and conforms to the shared epilepsy final common
    pathway.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"

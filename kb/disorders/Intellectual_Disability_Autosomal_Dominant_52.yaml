name: Intellectual Disability Autosomal Dominant 52
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: intellectual disability, autosomal dominant 52
  term:
    id: MONDO:0030918
    label: intellectual disability, autosomal dominant 52
synonyms:
- MRD52
- mental retardation, autosomal dominant 52
- autosomal dominant mental retardation 52
- autosomal dominant intellectual disability 52
- ASH1L-related syndromic complex neurodevelopmental disorder
- ASH1L-related neurodevelopmental disorder
description: >-
  Intellectual disability, autosomal dominant 52 (MRD52) is the OMIM/MONDO name
  for the neurodevelopmental disorder caused by heterozygous loss-of-function
  variants in ASH1L. The name understates the entity. ASH1L encodes a
  Trithorax-group histone methyltransferase, and the phenotype curated by the
  ClinGen Intellectual Disability and Autism Gene Curation Expert Panel - and
  classified Definitive - is a syndromic complex neurodevelopmental disorder:
  intellectual disability and developmental delay in nearly every reported
  proband, but also autism, ADHD, compulsive behaviours, seizures, sleep and
  gastrointestinal disturbance, genital malformations, and variable skeletal and
  ocular findings. This entry curates that broader phenotype under the MONDO
  identifier the stub queue supplied, and records the naming mismatch here rather
  than silently narrowing the disease to its cognitive component.

  The mechanism is epigenetic. ASH1L deposits activating histone methylation
  (H3K36, and H3K4 in the reports that measure it) and is required to keep
  neurodevelopmental and synaptic gene programmes transcriptionally available.
  One functional copy is not enough - ASH1L is among the most loss-of-function
  intolerant genes in the genome - so haploinsufficiency leaves a broad,
  low-amplitude failure of gene activation rather than the loss of any single
  protein. The consequences curated here fan out from that one node in three
  directions: a synaptic arm (failed developmental synapse pruning, traced in
  mice to EPHA7 silencing), an excitability arm (downregulated inhibitory and
  excitatory synaptic genes producing a cortical excitation-inhibition imbalance
  and seizures, conforming to the shared epilepsy module), and a
  cortical-patterning arm (misspecified and ectopically placed cortical
  projection neurons).

  Two caveats are curated rather than smoothed over. First, essentially all
  mechanistic detail comes from mice, and the models are not equivalent to the
  human genotype: the strongest excitation-inhibition and seizure data come from
  a severe prefrontal knockdown, while the model that actually matches human
  heterozygous loss produces absence-like epileptiform discharge rather than the
  focal, myoclonic and febrile seizures reported in patients. Second, a
  genotype-phenotype claim is unsettled: one review reports missense variants as
  more severe and more autism-associated than truncating ones, while the ClinGen
  and Brain Gene Registry review treats the missense alleles as still needing
  functional work and excludes them from its phenotype tabulation.

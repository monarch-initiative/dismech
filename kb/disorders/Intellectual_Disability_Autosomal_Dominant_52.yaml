synonyms:
- MRD52
- mental retardation, autosomal dominant 52
- autosomal dominant mental retardation 52
- autosomal dominant intellectual disability 52
- ASH1L-related syndromic complex neurodevelopmental disorder
- ASH1L-related neurodevelopmental disorder
description: |-
  ASH1L-related neurodevelopmental disorder (MRD52) is caused by heterozygous pathogenic ASH1L variants, particularly loss-of-function alleles. Intellectual disability, autism, speech and motor delays, behavioral differences and seizures occur variably, with ocular, genital, skeletal, gastrointestinal and sleep findings in some individuals. Average cognition in a registry participant and mild inherited disease demonstrate that the historical intellectual-disability name does not describe every presentation. Missense pathogenicity and mechanism require variant-specific assessment.

  ASH1L directly methylates H3K36. Experimental loss also changes transcription and, in severe mouse prefrontal knockdown, promoter H3K4me3. These observations do not establish direct H3K4 catalysis. Proposed routes include EphA7-dependent synaptic pruning, altered cortical excitation-inhibition, developmental-gene dysregulation and reduced neuronal arborization. Clinical translation is qualified because acute human-neuron knockdown, heterozygous gene-trap mice, severe focal mouse knockdown and homozygous developmental deletions are distinct systems. Their causal findings are preserved without assigning every human manifestation to a common developmental intermediate.
parents:
- Neurodevelopmental Disorder
- Epilepsy

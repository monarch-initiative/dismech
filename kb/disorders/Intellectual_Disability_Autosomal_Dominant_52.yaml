genetic:
- name: ASH1L
  gene_term:
    preferred_term: ASH1L
    term:
      id: hgnc:19088
      label: ASH1L
  relationship_type: CAUSATIVE
  notes: >-
    ASH1L (1q22) encodes a Trithorax-group histone methyltransferase. Pathogenic
    alleles reported with detailed phenotyping are predominantly loss-of-function
    (nonsense, frameshift, deletion); missense alleles have also been reported but
    their disease mechanism is unresolved. ClinGen's Intellectual Disability and
    Autism Gene Curation Expert Panel classified the gene-disease relationship as
    Definitive.
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      relationship to syndromic complex neurodevelopmental disorder was
      classified as Definitive.
    explanation: >-
      Records the ClinGen Definitive gene-disease validity classification for
      ASH1L.
  - reference: PMID:39902220
    reference_title: "Novel heterozygous ASH1L nonsense variant involved in mild intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A review of reported ASH1L nonsense mutations to explore genotype-phenotype
      correlations suggested that these variants typically result in a loss of
      function.
    explanation: >-
      Supports loss of function as the mechanism of the nonsense allele class.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    The diagnosis is molecular: identification of a heterozygous loss-of-function
    ASH1L variant, usually de novo, on trio exome or genome sequencing performed
    for developmental delay, autism or epilepsy. There is no biochemical or
    imaging marker. Interpretation is complicated in practice by the frequency
    with which additional variants of uncertain significance are found alongside
    the ASH1L variant.
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ASH1L variants were first implicated in human disease in 2012 through a
      large sequencing study in persons with severe ID.
    explanation: >-
      Establishes sequencing as the route by which the disorder is identified.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are managed with standard antiseizure medication. No agent has been
    shown to be preferentially effective in this disorder, and at least one
    reported proband's epilepsy was resistant to clonazepam, so treatment is
    empirical.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ASD, mild bilateral sensorineural hearing loss, and epilepsy (absence,
      focal motor, and myoclonic seizures); this proband
    explanation: >-
      Documents the epilepsy that requires treatment and, in the continuation of
      the same sentence, its drug resistance. Support is PARTIAL because no
      disease-specific efficacy data exist for any antiseizure medication here.
- name: Developmental and Behavioral Support
  description: >-
    Management is otherwise supportive and multidisciplinary: developmental,
    speech and language, and behavioural intervention for the intellectual
    disability, autism, ADHD and compulsive behaviours, together with surveillance
    for the sleep, gastrointestinal, ocular, hearing and musculoskeletal features
    that make up the syndromic phenotype. This is standard neurodevelopmental care
    rather than a disease-specific protocol.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
animal_models:
- name: Ash1l gene-trap haploinsufficient mouse
  species: Mouse
  genotype: Ash1l+/GT (targeted gene-trap knockout, heterozygous)
  publication: PMID:39766886
  description: >-
    A heterozygous gene-trap knockout, and the model whose genotype most closely
    matches human patients. It shows social deficits, increased self-grooming and
    cognitive impairment, absence-like epileptiform discharge on EEG, increased
    susceptibility to chemically provoked convulsive seizures, and prefrontal
    pyramidal hyperexcitability.
  evidence:
  - reference: PMID:39766886
    reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ash1l+/GT mice displayed social deficits, increased self-grooming, and
      cognitive impairments.
    explanation: >-
      Establishes the behavioural phenotype of the haploinsufficient model.
  modeled_mechanisms:
  - target: Pyramidal Neuron Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Whole-cell recording in prefrontal cortex demonstrates increased pyramidal
      excitability arising from intrinsic property changes plus enhanced
      glutamatergic and diminished GABAergic transmission, in a heterozygous
      animal matching the human genotype.
    limitations: >-
      Measured only in prefrontal cortex; the human seizure semiologies include
      focal motor and myoclonic seizures whose generators are not necessarily
      prefrontal, and no human electrophysiological or tissue correlate exists.
    readouts:
    - name: Prefrontal pyramidal neuron excitability
      target: Pyramidal Neuron Hyperexcitability
      description: >-
        Whole-cell patch-clamp recording of prefrontal pyramidal neurons in
        Ash1l+/GT versus wild-type mice.
      direction: INCREASED
      interpretation: >-
        Increased excitability with the excitatory-inhibitory shift is the direct
        electrophysiological correlate of this node.
      evidence:
      - reference: PMID:39766886
        reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Whole-cell patch-clamp recordings showed that Ash1l haploinsufficiency
          increased the excitability of pyramidal neurons in the PFC by altering
          intrinsic neuronal properties, enhancing glutamatergic synaptic
          transmission, and diminishing GABAergic synaptic inhibition.
        explanation: Reports the electrophysiological measurement behind this readout.
    evidence:
    - reference: PMID:39766886
      reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Chemogenetic inhibition of pyramidal neurons in the PFC of Ash1l+/GT mice
        ameliorated autism-like social deficits and abolished absence-like
        seizures.
      explanation: >-
        Reversing the excitability abnormality abolishes the seizure phenotype,
        which is what makes this model informative for the node rather than
        merely correlated with it.
  - target: Seizures
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The model has an electrographic seizure phenotype and increased
      susceptibility to provoked convulsive seizures.
    limitations: >-
      The spontaneous phenotype is absence-like epileptiform discharge, whereas
      the reported human semiologies are febrile, focal motor, absence and
      myoclonic seizures; convulsive seizures in the model appear only on
      pentylenetetrazole challenge. The model therefore reproduces a seizure
      tendency, not the human epilepsy.
    readouts:
    - name: Electroencephalographic epileptiform discharge
      target: Seizures
      description: >-
        EEG recording in Ash1l+/GT versus wild-type mice.
      direction: INCREASED
      interpretation: >-
        Spontaneous epileptiform discharge establishes an unprovoked seizure
        phenotype, of absence type.
      evidence:
      - reference: PMID:39766886
        reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Epileptiform discharges were found on electroencephalograms (EEGs) of
          Ash1l+/GT mice, indicating absence-like seizures.
        explanation: Reports the EEG measurement behind this readout.
    evidence:
    - reference: PMID:39766886
      reference_title: "Chemogenetic Inhibition of Prefrontal Cortex Ameliorates Autism-Like Social Deficits and Absence-Like Seizures in a Gene-Trap Ash1l Haploinsufficiency Mouse Model."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Epileptiform discharges were found on electroencephalograms (EEGs) of
        Ash1l+/GT mice, indicating absence-like seizures.
      explanation: >-
        Supports the model as informative for a seizure tendency while naming the
        semiology mismatch that limits it.
- name: Ash1l heterozygous knockout mouse (EphA7 pruning model)
  species: Mouse
  genotype: Ash1l+/- germline heterozygous knockout, and neuron-specific Ash1l deletion
  publication: PMID:35081333
  description: >-
    Haploinsufficient mice show anxiety, repetitive behaviour and altered social
    behaviour with intact learning but impaired discrimination. Neuronal Ash1l
    deletion produces excess synapses through a pruning deficit, traced to
    silencing of Eph receptor A7 by EZH2-deposited H3K27me3; supplying the EphA7
    ligand ephrin-A5 restores pruning and rescues the discrimination deficit.
  evidence:
  - reference: PMID:35081333
    reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results suggest that Ash1l haploinsufficiency is a highly penetrant
      risk factor for ASD, resulting from synapse pruning deficits.
    explanation: >-
      States the model's central conclusion connecting haploinsufficiency to the
      pruning mechanism.
  modeled_mechanisms:
  - target: Synaptic Pruning Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Excess synapses persist because developmental pruning fails, and the
      responsible gene, Eph receptor A7, is identified together with the
      repressive-mark mechanism silencing it.
    limitations: >-
      Synapse counts and pruning have not been measured in human ASH1L patients or
      tissue, and the pruning defect is most evident post-learning in a specific
      paradigm; the EPHA7 route is one identified mechanism, not necessarily the
      only one.
    readouts:
    - name: Synapse number after learning
      target: Synaptic Pruning Failure
      description: >-
        Synapse quantification in Ash1l-deleted neurons, particularly in the
        post-learning period.
      direction: INCREASED
      interpretation: >-
        Excess synapses are the direct cellular readout of the pruning failure.
      evidence:
      - reference: PMID:35081333
        reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mechanistically, deletion of Ash1l in neurons induces excessive
          synapses due to the synapse pruning deficits, especially during the
          post-learning period.
        explanation: Reports the synapse-number measurement behind this readout.
    - name: Discrimination performance after ephrin-A5 supplementation
      target: Synaptic Pruning Failure
      description: >-
        Behavioural discrimination testing in Ash1l+/- mice given the EphA7 ligand
        ephrin-A5, against untreated mutants.
      direction: RESTORED
      interpretation: >-
        Rescue by reactivating the specific downstream receptor is what makes the
        EPHA7 route causal rather than correlative.
      evidence:
      - reference: PMID:35081333
        reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Importantly, increasing activation of EphA7 in Ash1l+/- mice by
          supplying its ligand, ephrin-A5, strongly promotes synapse pruning and
          rescues discrimination deficits.
        explanation: Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:35081333
      reference_title: "ASH1L haploinsufficiency results in autistic-like phenotypes in mice and links Eph receptor gene to autism spectrum disorder."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Specifically, Eph receptor A7 is downregulated in Ash1l+/- mice through
        accumulating EZH2-mediated H3K27me3 in its gene body.
      explanation: >-
        Supports treating this model as informative for the pruning node by
        naming the responsible gene and chromatin mechanism.
- name: Cortex-specific Ash1l conditional knockout mouse
  species: Mouse
  genotype: Ash1l exon 4 conditional deletion (p.V1693Afs*2), Emx1-Cre-ERT2 induced at E10.5;
    and Ash1l germline null
  publication: PMID:38943682
  description: >-
    Tamoxifen-induced cortical deletion from E10.5 misspecifies cortical
    projection neurons: SATB2-expressing neurons increase in number, spread through
    the cortical plate, and appear ectopically in deep layers, with an altered
    differentiation trajectory on single-cell RNA sequencing. The germline null is
    present at expected proportions at E18.5 but absent at birth, and has shortened
    nasal bones.
  evidence:
  - reference: PMID:38943682
    reference_title: "Ash1l loss-of-function results in structural birth defects and altered cortical development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cortical-specific knockout model, SATB2 neurons showed increased
      numbers (n = 6/genotype, P = 0.0001) and were distributed through the
      cortical plate.
    explanation: >-
      Establishes the cortical patterning phenotype that makes this model
      informative.
  modeled_mechanisms:
  - target: Disrupted Cortical Neuron Specification and Lamination
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Cortical Ash1l deletion produces excess and ectopically placed
      SATB2-expressing projection neurons with an altered differentiation
      trajectory, establishing a requirement for ASH1L in projection neuron
      specification.
    limitations: >-
      This is a homozygous conditional deletion in cortex, not the heterozygous
      loss patients carry, so the severity is not transferable; and no
      corresponding cortical malformation has been described in human ASH1L
      patients, whose reported neuroimaging is largely unremarkable.
    readouts:
    - name: Laminar distribution of SATB2-expressing neurons
      target: Disrupted Cortical Neuron Specification and Lamination
      description: >-
        Immunohistochemistry for SATB2 with EdU birthdating in conditional
        knockout versus control cortex.
      direction: ALTERED
      interpretation: >-
        Deep-layer neurons ectopically expressing an upper-layer marker are the
        structural readout of misspecification.
      evidence:
      - reference: PMID:38943682
        reference_title: "Ash1l loss-of-function results in structural birth defects and altered cortical development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Birthdating revealed generation of ectopically placed deep layer
          neurons that express SATB2
        explanation: Reports the birthdating measurement behind this readout.
    evidence:
    - reference: PMID:38943682
      reference_title: "Ash1l loss-of-function results in structural birth defects and altered cortical development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In the cortical-specific knockout model, SATB2 neurons showed increased
        numbers (n = 6/genotype, P = 0.0001) and were distributed through the
        cortical plate.
      explanation: >-
        Supports treating this model as informative for the cortical patterning
        node.
  - target: Extraneural Developmental Anomalies
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The germline null dies perinatally and has shortened nasal bones,
      demonstrating a requirement for Ash1l in craniofacial development outside
      the brain.
    limitations: >-
      The mouse finding is a specific craniofacial measurement in homozygous
      nulls; the human extraneural phenotype is dominated by genital and
      musculoskeletal anomalies with no consistent facial gestalt, and human
      heterozygotes survive. The two do not correspond feature for feature.
    readouts:
    - name: Nasal bone length
      target: Extraneural Developmental Anomalies
      description: >-
        Skeletal measurement in Ash1l germline null embryos versus controls.
      direction: DECREASED
      interpretation: >-
        A quantified craniofacial skeletal defect outside the nervous system.
      evidence:
      - reference: PMID:38943682
        reference_title: "Ash1l loss-of-function results in structural birth defects and altered cortical development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Notably, Ash1l-/- exhibited shortened nasal bones (n = 31, P = 0.017).
        explanation: Reports the craniofacial measurement behind this readout.
    evidence:
    - reference: PMID:38943682
      reference_title: "Ash1l loss-of-function results in structural birth defects and altered cortical development."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This study underscores the essential role of Ash1l in postnatal survival
        and normal craniofacial development.
      explanation: >-
        Supports an extraneural developmental requirement while the specific
        features differ from the human phenotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Only sixteen probands had been reported with detailed phenotyping at the time
    of the 2024 review, although over a hundred loss-of-function ASH1L variants
    have been catalogued in autism sequencing cohorts without individual clinical
    description. No population rate has been estimated, and the gap between the
    two counts is itself the reason a rate cannot be inferred.
  evidence:
  - reference: PMID:38674358
    reference_title: "Expansion of the Genotypic and Phenotypic Spectrum of ASH1L-Related Syndromic Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ID/DD is the most frequent phenotype (15/16, 94%)
    explanation: >-
      The denominator of sixteen is the deeply phenotyped literature cohort; no
      normalized population rate is asserted.
  - reference: PMID:34782621
    reference_title: "Deficiency of autism risk factor ASH1L in prefrontal cortex induces epigenetic aberrations and seizures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Over 100 loss-of-function (LOF) mutations in the coding regions of ASH1L
      have been discovered
    explanation: >-
      Establishes the much larger variant count from sequencing cohorts, against
      which the small clinically described cohort should be read. Evidence source
      is OTHER because this is the paper's summary of the genetic literature.

- name: Disrupted Cortical Neuron Specification and Lamination
  description: Homozygous germline or cortex-specific Ash1l deletion alters cortical neuron specification
    and lamination in mice. SATB2-positive projection neurons are ectopically placed and show altered
    differentiation trajectories. This is an experimental developmental mechanism, not an observed lesion
    in human ASH1L patients.
  role: mediator
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cortical projection neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38943682
    reference_title: Ash1l loss-of-function results in structural birth defects and altered cortical development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Birthdating revealed generation of ectopically placed deep layer neurons that express SATB2
    explanation: Demonstrates misspecified, ectopically positioned cortical projection neurons after cortical
      Ash1l deletion.
  mechanism_confidence: PROVISIONAL
- name: Impaired Craniofacial Development
  description: Ash1l-null embryos and neural-lineage conditional knockout mice have shortened nasal bones.
    The neural conditional study proposes abnormal development of NESTIN-positive neural-crest derivatives
    as a cause. This experimental route does not establish the causes of the heterogeneous human genital,
    skeletal and facial findings.
  role: mediator
  biological_scale: TISSUE
  evidence:
  - reference: PMID:38943682
    reference_title: Ash1l loss-of-function results in structural birth defects and altered cortical development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Notably, Ash1l-/- exhibited shortened nasal bones (n = 31, P = 0.017).
    explanation: A specific craniofacial phenotype in the germline-null mouse; other human organ anomalies
      are not inferred.
  mechanism_confidence: PROVISIONAL
- name: Reduced Neuronal Arborization
  description: Acute ASH1L knockdown in stem-cell-derived human cortical excitatory neurons reduces neurite
    length and branching. Reduced NTRK2 expression and antagonistic PRC2 activity are implicated; EZH2
    inhibition partially rescues morphogenesis, while added BDNF does not. These are engineered immature
    neurons, not clinical neuropathology.
  role: mediator
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:35210569
    reference_title: Counteracting epigenetic mechanisms regulate the structural development of neuronal
      circuitry in human neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Depletion of ASH1L decreases neurite outgrowth and decreases expression of the gene encoding
      the neurotrophin receptor TrkB whose signaling pathway is linked to neuronal morphogenesis.
    explanation: Direct experimental finding after acute knockdown in human stem-cell-derived neurons.
  downstream:
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Provisional hypothesis that impaired neurite development compromises connectivity and
      contributes to autism in ASH1L patients; functional synapses were not yet mature in the experimental
      cultures.
    evidence:
    - reference: PMID:35210569
      reference_title: Counteracting epigenetic mechanisms regulate the structural development of neuronal
        circuitry in human neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Defects in neuronal morphogenesis could potentially impair the establishment of neuronal
        connections which could contribute to the neurodevelopmental pathogenesis associated with ASD
        in patients with ASH1L mutations.
      explanation: This is the source’s explicitly qualified clinical hypothesis, not demonstrated human
        neuropathology.
      directness: INDIRECT
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Provisional arborization hypothesis for the reported postnatal microcephaly. The clinical
      report concerns a missense allele whereas the cellular experiment uses acute knockdown; gliogenesis
      and other explanations remain possible.
    evidence:
    - reference: PMID:35210569
      reference_title: Counteracting epigenetic mechanisms regulate the structural development of neuronal
        circuitry in human neurons.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Postnatal microcephaly could arise as a result of impaired neuronal arborization and/or
        a defect in the generation, proliferation or survival of glial cells or their precursor cells
        39, 84.
      explanation: The authors discuss this hypothesis in the context of the ASH1L microcephaly case;
        it is not a proof that this patient’s allele reduces arborization.
      directness: INDIRECT
- name: Proposed Hypothalamic Circuit Dysfunction
  description: The neural Ash1l-null mouse study proposes that impaired development of hypothalamic circuits
    could disturb feeding behavior and early postnatal growth. This hypothesis was motivated by neonatal
    survival and growth findings; hypothalamic pathology and a corresponding human lesion were not demonstrated.
  role: mediator
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:34145365
    reference_title: Loss of histone methyltransferase ASH1L in the developing mouse brain causes autistic-like
      behaviors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: suggest that Ash1L might also play important roles in establishing neural circuits in the
      developing hypothalamus, which is critical for normal feeding behaviors and early postnatal growth
      28.
    explanation: The authors propose a hypothalamic-development route, explicitly requiring further testing
      in patients.
    directness: INDIRECT
  downstream:
  - target: Feeding Difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The authors propose hypothalamic dysfunction as a possible explanation for feeding behavior
      and postnatal growth; no patient-specific causal attribution is established. Human growth delay
      was reported in a missense case, further limiting dosage and allele translation.
    evidence:
    - reference: PMID:34145365
      reference_title: Loss of histone methyltransferase ASH1L in the developing mouse brain causes autistic-like
        behaviors.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: It will be interesting to examine whether ASH1L mutations could cause hypothalamus dysfunctions
        that affect normal feeding behaviors and postnatal growth in human patients.
      explanation: This is an explicitly proposed human-disease hypothesis from the model discussion,
        not a demonstrated patient mechanism.
      directness: INDIRECT

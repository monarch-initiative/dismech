    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, Ash1L deficiency in PFC causes the diminished GABAergic
      inhibition, enhanced glutamatergic transmission, and elevated PFC pyramidal
      neuronal excitability, which is associated with severe seizures and early
      mortality.
    explanation: >-
      Direct electrophysiological demonstration of the imbalance and its link to
      seizures, in a prefrontal knockdown model.
  downstream:
  - target: Pyramidal Neuron Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      The imbalance raises the intrinsic and synaptic excitability of cortical
      pyramidal neurons.
- name: Pyramidal Neuron Hyperexcitability
  description: >-
    Cortical pyramidal neurons become hyperexcitable through altered intrinsic
    properties as well as the synaptic shift. This node captures the single
    concept of network hyperexcitability and conforms to the shared epilepsy final
    common pathway.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  biological_processes:

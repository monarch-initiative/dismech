name: Chronic Pyelonephritis
creation_date: "2026-11-27T23:09:56Z"
description: >-
  Chronic pyelonephritis is a chronic tubulointerstitial kidney disease in
  which coarse corticomedullary scars overlie blunted, dilated (clubbed)
  calyces. It arises in two settings. The commoner is vesicoureteral reflux with
  intrarenal reflux and recurrent upper urinary tract infection in early
  childhood, now usually called reflux nephropathy. The other is chronic
  obstruction or stasis of urine from stones, strictures or neurogenic bladder.
  Interstitial inflammation and fibrosis with thyroidization-type tubular
  atrophy destroy nephrons. Loss of nephron mass then leads to hypertension,
  proteinuria with secondary glomerulosclerosis, and in some patients
  progressive chronic kidney disease and kidney failure.
category: Infectious Disease
disease_term:
  preferred_term: chronic pyelonephritis
  term:
    id: MONDO:0001110
    label: chronic pyelonephritis
parents:
- Pyelonephritis
- Chronic kidney disease
synonyms:
- Pyelonephritis, chronic
- Persistent pyelonephritis
- Reflux nephropathy
- Chronic atrophic pyelonephritis
- Chronic obstructive pyelonephritis
notes: >-
  Scope and boundaries. This entry covers the scarred kidney of chronic
  pyelonephritis (MONDO:0001110) of either origin, reflux-associated or
  obstructive. MONDO has no separate reflux nephropathy class, so reflux
  nephropathy is handled as the reflux-associated subtype rather than its own
  entry. Acute_Pyelonephritis covers the acute ascending parenchymal infection
  (MONDO:0003529); here it appears only as the repeated episodes that lead to
  scarring. Familial_Vesicoureteral_Reflux covers the inherited ureterovesical
  junction defect and its own scarring chain; this entry does not repeat its
  genetics. Xanthogranulomatous_Pyelonephritis (MONDO:0007022, a MONDO child of
  this term) is a distinct granulomatous, foam-cell form with its own
  presentation as a mass lesion and its own surgical treatment, so it is kept
  here only as a pointer subtype. The role of infection is debated, and the
  entry says so where it applies. The disease was renamed from chronic
  pyelonephritis to reflux nephropathy because scarring is not always
  post-infectious: congenital reflux nephropathy, mostly in boys, is found with
  no prior urinary tract infection. Mouse data indicate that sterile reflux
  alone does not produce reflux nephropathy, and a clinical review states that
  low-pressure sterile reflux is not a cause. The acquired scar is therefore
  modelled as infection-driven, and congenital dysplastic damage is left to
  Familial_Vesicoureteral_Reflux. Phenotype frequencies are deliberately not
  set. Most quantitative figures come from adult reflux nephropathy follow-up
  cohorts, pediatric nephrectomy series, or a single Nigerian hospital series
  with a high nephrectomy rate. Their figures disagree; for example,
  hypertension is 38% in one series and 16.3% in another. They are given in the
  phenotype descriptions instead. No GeneReviews chapter exists for this
  acquired disease. The StatPearls Reflux Nephropathy chapter (PMID:30252311)
  is cited for orientation only. A claude_code deep-research run
  (research/Chronic_Pyelonephritis-deep-research-claude_code.md) was used as a
  source of leads only. Every claim here was re-verified against cached
  abstracts or full texts.
review_notes: >-
  Deliberately lumped. Escherichia coli is the only organism bound here,
  because it is the only uropathogen that the cached renal-scarring literature
  names as the commonest cause. Other Enterobacterales and Proteus species are
  recognized causes of upper-tract infection, but no source cached for this
  entry states their share in chronic pyelonephritis, or shows a difference in
  scarring, presentation or treatment by organism. Proteus-associated
  stone-forming obstructive infection is curated on
  Xanthogranulomatous_Pyelonephritis.
infectious_agent:
- name: Escherichia coli
  description: >-
    Uropathogenic E. coli, often P-fimbriated, is the commonest organism in the
    recurrent upper-tract infections that produce acquired pyelonephritic
    scarring. Strains recovered from children who scar carry pap adhesin genes
    less often than strains from children who do not, which points to host
    factors rather than bacterial virulence as the determinant of scarring.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:2880464
    reference_title: P-fimbriated Escherichia coli in adults with renal scarring and pyelonephritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The commonest organism in urinary tract infections (UTI) is Escherichia
      coli.
    explanation: >-
      Opening statement of a clinical study of women with renal scarring,
      naming E. coli as the commonest urinary pathogen.
  - reference: PMID:1672231
    reference_title: "Escherichia coli in patients with renal scarring: genotype and phenotype of Gal alpha 1-4Gal beta-, Forssman- and mannose-specific adhesins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The frequency of pap was 79% in the strains isolated from the nonscarring
      group compared with 39% in the strains from the scarring group (P less
      than 0.001).
    explanation: >-
      E. coli strains from children with recurrent pyelonephritis, compared
      between those who did and did not scar.
transmission:
- name: Ascending bladder-to-kidney spread with intrarenal reflux
  description: >-
    Uropathogens ascend from the bladder to the renal pelvis, by
    vesicoureteral reflux or above an obstruction, and enter the parenchyma
    through refluxing compound papillae at the renal poles.
  evidence:
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Renal scarring due to intrarenal reflux occurs mostly at the renal poles
      because the presence of extensively fused (compound) renal papillae, which
      are associated with reflux.
    explanation: >-
      Review explaining that intrarenal reflux through compound papillae sets
      the polar distribution of the scars.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: INFECTIOUS_DISEASES
has_subtypes:
- name: Reflux-associated
  display_name: Reflux-associated chronic pyelonephritis (reflux nephropathy)
  description: >-
    Scarring from vesicoureteral reflux with intrarenal reflux and febrile
    urinary tract infection in infancy and early childhood. This is the commonest
    form. It is usually acquired after a febrile infection and is commoner in
    girls. A congenital form, commoner in boys, is found during follow-up of
    antenatal hydronephrosis with no prior infection.
  evidence:
  - reference: PMID:30252311
    reference_title: Reflux Nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reflux nephropathy was previously called chronic pyelonephritis because it
      was believed to result from recurrent childhood urinary tract infections
      (UTIs).
    explanation: >-
      Links the reflux nephropathy name to chronic pyelonephritis and records
      why the older name was used.
  - reference: PMID:30252311
    reference_title: Reflux Nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acquired reflux nephropathy is more common among girls and is diagnosed
      mostly after a febrile UTI. In contrast, congenital reflux nephropathy is
      diagnosed antenatally or during hydronephrosis follow-up, with no prior
      UTI, and is more common in boys.
    explanation: >-
      Distinguishes acquired from congenital reflux nephropathy by sex and by
      whether infection preceded the scar.
  - reference: PMID:739156
    reference_title: "Reflux nephropathy and chronic atrophic pyelonephritis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Chronic atrophic pyelonephritis is associated with vesicoureteric reflux in
      infancy.
    explanation: >-
      Review stating the association of the atrophic scarred kidney with
      reflux in infancy.
- name: Obstructive
  display_name: Obstructive chronic pyelonephritis
  description: >-
    Chronic pyelonephritis on a background of urinary tract obstruction or
    stasis, including calculi and neurogenic bladder. It presents more often in
    adults, and scarring can keep progressing while stones remain. It is managed
    by relieving the obstruction or bladder dysfunction rather than by
    anti-reflux measures.
  evidence:
  - reference: PMID:32003360
    reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Urinary tract obstruction, poorly treated UTI, HIV infection and
      polycystic kidney disease were the risk factors in 21 (49%), 15 (35%), 6
      (14%) and 1 (2%) cases, respectively.
    explanation: >-
      Obstruction was the commonest risk factor in a hospital series of 43
      chronic pyelonephritis cases.
  - reference: PMID:4089553
    reference_title: Long-term follow-up in chronic non-obstructive pyelonephritis. A retrospective radiological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among the adults, progressive scarring was found in 3 patients with renal
      calculi, the others remaining unchanged during the follow-up period.
    explanation: >-
      In adults, scarring progressed only where stones were present.
- name: Xanthogranulomatous Pyelonephritis
  curated_in: Xanthogranulomatous_Pyelonephritis
  subtype_term:
    preferred_term: xanthogranulomatous pyelonephritis
    term:
      id: MONDO:0007022
      label: xanthogranulomatous pyelonephritis
  description: >-
    A rare destructive granulomatous form of chronic pyelonephritis with
    lipid-laden foam macrophages, usually on an obstructed, stone-bearing
    kidney. It presents as an enlarged mass-like kidney and is usually treated
    by nephrectomy. It is curated as its own entry.
  evidence:
  - reference: PMID:37610600
    reference_title: Nephrectomy for xanthogranulomatous pyelonephritis-a not-so-simple solution.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Xanthogranulomatous pyelonephritis (XGP) is a rare form of chronic
      pyelonephritis first described by Schlagenhaufer et al. in 1916.
    explanation: >-
      Introduction of a nephrectomy case series classing XGP as a form of
      chronic pyelonephritis.
progression:
- phase: Childhood febrile infection and scar formation
  age_range: Infancy and early childhood
  notes: >-
    Scars form after febrile upper-tract infection. A single episode can scar a
    young child's kidney ("big bang"), or scarring can accumulate over years.
    About 15% of children have a scar on follow-up DMSA after a first infection.
  evidence:
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The scarring may result from a single episode of pyelonephritis,
      especially in young children, also called “big bang effect” 3 or the
      process may take several years.
    explanation: >-
      Describes single-episode and cumulative scar formation in childhood.
  - reference: PMID:21059720
    reference_title: "Risk of renal scarring in children with a first urinary tract infection: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      57% (95% confidence interval [CI]: 50-64) had changes consistent with
      acute pyelonephritis on the acute-phase DMSA renal scan and 15% (95% CI:
      11-18) had evidence of renal scarring on the follow-up DMSA scan.
    explanation: >-
      Pooled DMSA data on how often a first childhood infection leaves a scar.
- phase: Established scarring
  age_range: Late childhood to adulthood
  notes: >-
    Calyceal clubbing and scarring mostly develop in childhood. In adults they
    seldom progress unless something else, such as stone formation, is added.
  evidence:
  - reference: PMID:4089553
    reference_title: Long-term follow-up in chronic non-obstructive pyelonephritis. A retrospective radiological study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      calyceal clubbing and parenchyma scarring occur during childhood and
      seldom progress without the intrusion of superimposing factors, such as
      renal stone formation.
    explanation: >-
      A 25-year radiological follow-up showing that scars form in childhood
      and then usually stabilize.
  - reference: PMID:11442458
    reference_title: Long-term follow-up of reflux nephropathy in adults with vesicoureteral reflux--radiological and pathoanatomical analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No renal damage developed during the follow-up in 45 previously undamaged
      kidneys and progression of renal damage was rare (4 of 120 previously
      damaged kidneys), despite persisting reflux in half of the cases and
      episodes of acute pyelonephritis during follow-up.
    explanation: >-
      In adults with reflux, scars rarely progressed over a median 14-year
      urographic interval.
- phase: Late hypertensive and renal-functional complications
  age_range: Adolescence to adulthood
  notes: >-
    Hypertension, proteinuria and declining renal function appear years to
    decades after the scars form. Kidney failure occurs mainly with extensive
    bilateral scarring or scarring of a solitary kidney.
  evidence:
  - reference: PMID:12411757
    reference_title: Long-term effects of reflux nephropathy on blood pressure and renal function in adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hypertension in adult patients with reflux nephropathy occurs with any
      grade of renal damage, whereas deterioration of renal function was
      strongly associated with extensive bilateral renal damage or damage in a
      solitary kidney.
    explanation: >-
      Conclusion of a 16-year adult follow-up on when the late complications
      occur.
pathophysiology:
- name: Vesicoureteral and Intrarenal Reflux
  role: trigger
  biological_scale: TISSUE
  subtypes:
  - Reflux-associated
  description: >-
    Incompetent ureterovesical junctions let bladder urine reflux to the renal
    pelvis. Compound papillae at the renal poles let it pass on into the
    collecting ducts. Reflux is the structural predisposition, and higher
    reflux grades carry more risk of scarring.
  locations:
  - preferred_term: ureter
    term:
      id: UBERON:0000056
      label: ureter
  - preferred_term: renal papilla
    term:
      id: UBERON:0001228
      label: renal papilla
  evidence:
  - reference: PMID:21059720
    reference_title: "Risk of renal scarring in children with a first urinary tract infection: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Children with vesicoureteral reflux (VUR) were significantly more likely
      to develop pyelonephritis (relative risk [RR]: 1.5 [95% CI: 1.1-1.9]) and
      renal scarring (RR: 2.6 [95% CI: 1.7-3.9]) compared with children with no
      VUR.
    explanation: >-
      Pooled data showing reflux raises the risk of both pyelonephritis and
      scarring.
  - reference: PMID:26555605
    reference_title: Renal Scarring in the Randomized Intervention for Children with Vesicoureteral Reflux (RIVUR) Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The proportion of new scars in renal units with grade 4 VUR was
      significantly higher than in units with no VUR (OR, 24.2; 95% CI, 6.4 to
      91.2).
    explanation: >-
      Trial data showing new scars concentrate in kidneys with high-grade reflux.
  downstream:
  - target: Recurrent Ascending Upper-Tract Infection
    causal_link_type: DIRECT
    description: >-
      Reflux carries bacteria from the bladder into the renal pelvis and
      parenchyma. Reflux and sustained kidney infection together, not sterile
      reflux, produce reflux nephropathy.
    evidence:
    - reference: PMID:23519031
      reference_title: Interplay between vesicoureteric reflux and kidney infection in the development of reflux nephropathy in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        We find that VUR in combination with sustained kidney infection is
        crucial to the development of reflux nephropathy, whereas sterile reflux
        alone fails to induce reflux nephropathy.
      explanation: >-
        In refluxing C3H mice, reflux scarred the kidney only together with
        sustained kidney infection.
    - reference: PMID:20483150
      reference_title: "Vesicoureteral reflux associated renal damage: congenital reflux nephropathy and acquired renal scarring."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Low pressure sterile reflux is not a cause of reflux nephropathy.
      explanation: >-
        Clinical review stating that sterile low-pressure reflux does not cause
        the acquired lesion.
- name: Urinary Tract Obstruction and Stasis
  role: trigger
  biological_scale: TISSUE
  subtypes:
  - Obstructive
  description: >-
    Obstruction by calculi or strictures, or a high-pressure neurogenic
    bladder, causes urinary stasis. Stasis predisposes the upper tract to
    persistent and recurrent infection and to scarring.
  locations:
  - preferred_term: renal pelvis
    term:
      id: UBERON:0001224
      label: renal pelvis
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  evidence:
  - reference: PMID:42758919
    reference_title: Morphologic and urodynamic predictors of renal scarring in pediatric neurogenic bladder A cross-sectional study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Renal scarring was identified in 55.6% of patients.
    explanation: >-
      DMSA scarring in more than half of 133 children with neurogenic bladder
      due to spinal dysraphism.
  downstream:
  - target: Recurrent Ascending Upper-Tract Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Stasis above an obstruction lets uropathogens persist and recur in the
      upper tract.
    evidence:
    - reference: PMID:32003360
      reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Urinary tract obstruction, poorly treated UTI, HIV infection and
        polycystic kidney disease were the risk factors in 21 (49%), 15 (35%),
        6 (14%) and 1 (2%) cases, respectively.
      explanation: >-
        Obstruction was the leading risk factor in this chronic pyelonephritis
        series.
  - target: Corticomedullary Scarring and Tubular Atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Stones keep scarring progressing in adults, in whom scarring otherwise
      usually stabilizes.
    evidence:
    - reference: PMID:4089553
      reference_title: Long-term follow-up in chronic non-obstructive pyelonephritis. A retrospective radiological study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Among the adults, progressive scarring was found in 3 patients with
        renal calculi, the others remaining unchanged during the follow-up
        period.
      explanation: >-
        In adults, progressive scarring occurred only with renal calculi.
- name: Recurrent Ascending Upper-Tract Infection
  role: trigger
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Tissue Injury"
  description: >-
    Repeated febrile infections of the renal pelvis and parenchyma, mostly by
    uropathogenic E. coli, injure the tubulointerstitium of the refluxing or
    obstructed segments. This injury is the trigger of the scarring cascade.
    Whether the host's inflammatory response, rather than bacterial virulence,
    determines who scars is still open.
  cell_types:
  - preferred_term: kidney epithelial cell
    term:
      id: CL:0002518
      label: kidney epithelial cell
  locations:
  - preferred_term: cortex of kidney
    term:
      id: UBERON:0001225
      label: cortex of kidney
  biological_processes:
  - preferred_term: response to bacterium
    modifier: INCREASED
    term:
      id: GO:0009617
      label: response to bacterium
  - preferred_term: wound healing
    modifier: DYSREGULATED
    term:
      id: GO:0042060
      label: wound healing
  evidence:
  - reference: PMID:739156
    reference_title: "Reflux nephropathy and chronic atrophic pyelonephritis: a review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Infection is the likely cause of progressive scarring in females.
    explanation: >-
      Review naming infection as the probable driver of progressive scarring.
  - reference: PMID:2880464
    reference_title: P-fimbriated Escherichia coli in adults with renal scarring and pyelonephritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fifty-three per cent of the patients had altogether 65 episodes of
      symptomatic UTI during the three-year follow-up (0.036 infections per
      month).
    explanation: >-
      Women with renal scarring had frequent recurrent infections over 3 years.
  downstream:
  - target: Renal Tubulointerstitial Inflammation
    causal_link_type: DIRECT
    description: >-
      Ascending uropathogenic infection produces tubulointerstitial nephritis
      and recruits leukocytes into the infected segment.
    evidence:
    - reference: PMID:27760770
      reference_title: Inflammation drives renal scarring in experimental pyelonephritis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Transurethral inoculation of uropathogenic Escherichia coli in
        C3H/HeOuJ mice leads to renal mucosal injury, tubulointerstitial
        nephritis, and cortical fibrosis.
      explanation: >-
        In a refluxing mouse strain, ascending E. coli infection produces
        tubulointerstitial nephritis.
  - target: Recurrent urinary tract infections
    causal_link_type: DIRECT
    description: >-
      The predisposing reflux or obstruction persists, so infections recur.
  - target: Recurrent pyelonephritis
    causal_link_type: DIRECT
    description: >-
      Recurrences reach the kidney as febrile pyelonephritis.
- name: Renal Tubulointerstitial Inflammation
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  description: >-
    Neutrophils and macrophages are recruited into the infected
    tubulointerstitium in proportion to bacterial burden. The extent of this
    inflammation, more than the infection itself, predicts the later fibrosis.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  locations:
  - preferred_term: kidney interstitium
    term:
      id: UBERON:0005215
      label: kidney interstitium
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:
      id: GO:0050900
      label: leukocyte migration
  evidence:
  - reference: PMID:27760770
    reference_title: Inflammation drives renal scarring in experimental pyelonephritis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The extent of fibrosis correlates most significantly with inflammation at
      7 and 28 days postinfection. The recruitment of neutrophils and
      inflammatory macrophages to infected kidneys is proportional to renal
      bacterial burden.
    explanation: >-
      Ties leukocyte recruitment to the extent of later renal fibrosis in mice.
  downstream:
  - target: Interstitial Myofibroblast Activation
    causal_link_type: DIRECT
    description: >-
      Macrophage-dominated inflammation drives the fibrotic response that
      leaves a scar.
    evidence:
    - reference: PMID:33148615
      reference_title: Neutrophil-Macrophage Imbalance Drives the Development of Renal Scarring during Experimental Pyelonephritis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Exacerbated macrophage-mediated inflammatory responses promoted renal
        scarring and compromised renal function, as indicated by elevated
        serum creatinine, BUN, and potassium.
      explanation: >-
        Experimental evidence that the macrophage arm of the inflammation
        causes scarring.
- name: Interstitial Myofibroblast Activation

discussions:
- discussion_id: cpn_infection_necessity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much human reflux-associated scarring is post-infectious, and how much
    is congenital dysplasia or damage from sterile high-pressure reflux?
  attaches_to:
  - pathophysiology#Vesicoureteral and Intrarenal Reflux
  - pathophysiology#Recurrent Ascending Upper-Tract Infection
  rationale: >-
    Congenital reflux nephropathy is found in infants with no prior infection,
    and imaging cannot reliably tell a congenital dysplastic kidney from an
    acquired scar. Mouse data show that sterile reflux alone does not scar, and
    a clinical review excludes low-pressure sterile reflux. Whether high-pressure
    sterile reflux damages the human kidney is not settled by the sources here.
    The split matters because antibiotic prophylaxis, which prevents infection,
    did not reduce scarring in RIVUR.

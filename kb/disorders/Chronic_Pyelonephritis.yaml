    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The relationship between renal scarring and hypertension was first
      demonstrated in 1937 when the removal of a small scarred kidney cured
      hypertension in a 10 year old female with recurrent UTI and hypertension
    explanation: >-
      Review recounting that removing a scarred kidney cured hypertension.
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The plasma rennin activity (PRA) may increase in some children with renal

  evidence:
  - reference: PMID:19861314
    reference_title: Functional polymorphisms in transforming growth factor-beta-1 (TGFbeta-1) and vascular endothelial growth factor (VEGF) genes modify risk of renal parenchymal scarring following childhood urinary tract infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Multiple logistic regression testing identified the presence of VUR (odds

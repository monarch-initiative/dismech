    snippet: >-
      Cases with associated chronic pyelonephritis were characterised by
      periglomerular fibrosis, tubular atrophy, thyroidization, and
      interstitial fibrosis.
    explanation: >-
      Histology of chronic pyelonephritis in nephrectomy specimens from a
      tropical pathology series.
  - reference: PMID:32003360
    reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Scarring, reported in 79.0% of patients, was the most common pathological
      finding, followed by pus casts in 48.8% and focal segmental
      glomerulosclerosis in 27.9%.
    explanation: >-
      Frequency of scarring, pus casts and FSGS in chronic pyelonephritis
      specimens.
  - reference: PMID:11442458
    reference_title: Long-term follow-up of reflux nephropathy in adults with vesicoureteral reflux--radiological and pathoanatomical analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histological examination showed "chronic pyelonephritis" in all 23 cases
      and co-existing renal dysplasia in 1 case.
    explanation: >-
      Renal histology in adult reflux nephropathy is chronic pyelonephritis.
environmental:
- name: Delayed treatment of febrile urinary tract infection
  description: >-
    Delayed antibiotic treatment of a febrile urinary tract infection has been
    linked to more renal injury, but a trial found no rise in scarring with
    delay. The effect is uncertain.
  evidence:
  - reference: PMID:20483150
    reference_title: "Vesicoureteral reflux associated renal damage: congenital reflux nephropathy and acquired renal scarring."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Specific risk factors for acute pyelonephritis and renal scarring in
      patients with vesicoureteral reflux include higher reflux grade,
      dysfunctional voiding/elimination, recurrent pyelonephritic episodes and
      delayed initiation of antibiotic therapy.
    explanation: >-
      Review listing delayed antibiotics among scarring risk factors.
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, the Italian Renal Infection Study Trials reported that the
      progressive delay in antibiotic treatment of acute pyelonephritis from <1
      to > 5 days after the onset of fever was not associated with any
      significant increase in the risk of scarring on Dimercaptosuccinic acid
      (DMSA) renal scans obtained 1 year later.
    explanation: >-
      A trial reported in the review found no increase in scarring with delay.
  influences_mechanisms:
  - target: Renal Tubulointerstitial Inflammation
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Untreated infection prolongs parenchymal inflammation.
    evidence:
    - reference: PMID:21896376
      reference_title: Vesicoureteral reflux and reflux nephropathy.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        A delay in the treatment of febrile UTI is associated with increased
        risk of renal injury
      explanation: >-
        Links delayed treatment to renal injury.
- name: HIV infection
  description: >-
    HIV infection was a risk factor in 14% of cases in a Nigerian hospital
    series.
  evidence:
  - reference: PMID:32003360
    reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Urinary tract obstruction, poorly treated UTI, and HIV infection were
      major risk factors seen in this environment.
    explanation: >-
      HIV infection was a major risk factor in this series.
  influences_mechanisms:
  - target: Recurrent Ascending Upper-Tract Infection
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Immunosuppression predisposes to persistent upper-tract infection; the
      intermediate steps were not studied.
    evidence:
    - reference: PMID:32003360
      reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Urinary tract obstruction, poorly treated UTI, HIV infection and
        polycystic kidney disease were the risk factors in 21 (49%), 15 (35%),
        6 (14%) and 1 (2%) cases, respectively.
      explanation: >-
        HIV infection was the risk factor in 6 of 43 cases.
prevalence:
- population: Children (global estimate)
  measure_type: UNKNOWN
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 1000.0
  rate_high: 3000.0
  notes: >-
    StatPearls estimates that reflux nephropathy occurs in 1-3% of children,
    without saying whether this is a point or lifetime figure, hence
    measure_type UNKNOWN. The same chapter attributes up to 10% of adult ESKD
    to reflux nephropathy. A review attributes 12-21% of childhood chronic
    renal failure to it. These are etiologic fractions of kidney failure, not
    prevalences, and are recorded under clinical_burden.
  evidence:
  - reference: PMID:30252311
    reference_title: Reflux Nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reflux nephropathy occurs in approximately 1% to 3% of children
    explanation: >-
      Clinical reference estimate of reflux nephropathy in children.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Most scarred kidneys keep adequate function for decades, but reflux
    nephropathy is a leading cause of childhood chronic renal failure. It
    accounts for up to a tenth of adult kidney failure, so it contributes a
    meaningful share of dialysis and transplantation. US incidence of pediatric
    and young-adult kidney failure from reflux nephropathy fell between 2002
    and 2021.
  evidence:
  - reference: PMID:30252311
    reference_title: Reflux Nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Reflux nephropathy may account for up to 10% of ESKD etiologies in adult
      patients.
    explanation: >-
      Share of adult kidney failure due to reflux nephropathy.
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RN is responsible for 12% to 21% of all children with chronic renal
      failure
    explanation: >-
      Share of childhood chronic renal failure due to reflux nephropathy.
  - reference: PMID:41582309
    reference_title: Trends in End-Stage Kidney Disease Due to Reflux Nephropathy in Children and Young Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The all-cause incidence of ESKD decreased (AAPC of -1.0%; 95% CI, -1.4%
      to -0.7%) as did the incidence of ESKD owing to RN (AAPC of -4.4%; 95%
      CI, -5.8% to -3.0%).
    explanation: >-
      USRDS data showing a fall in kidney failure due to reflux nephropathy
      in people aged 24 and under.
diagnosis:
- name: DMSA renal cortical scintigraphy
  description: >-
    Technetium-99m dimercaptosuccinic acid (DMSA) scintigraphy is the reference
    test for renal scars. It shows decreased uptake with loss of contour or
    cortical thinning. Scans taken during an acute infection show reversible
    defects, so scarring is judged on a scan taken months later.
  diagnosis_term:
    preferred_term: technetium-99m DMSA renal scintigraphy
    term:
      id: NCIT:C62667
      label: Radionuclide Imaging
  evidence:
  - reference: PMID:32004557
    reference_title: Accuracy of Ultrasound in Identifying Renal Scarring as Compared to DMSA Scan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sensitivity and specificity of RUS in identifying RS were calculated
      using DMSA scan as the gold standard.
    explanation: >-
      Uses DMSA as the reference standard for renal scarring.
  - reference: PMID:26555605
    reference_title: Renal Scarring in the Randomized Intervention for Children with Vesicoureteral Reflux (RIVUR) Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Renal scarring was evaluated by baseline and follow-up (99m)technetium
      dimercaptosuccinic acid (DMSA) renal scans that were reviewed
      independently by two blinded reference radiologists.
    explanation: >-
      DMSA scans as the scarring outcome measure in a randomized trial.
- name: Renal ultrasound
  description: >-
    Ultrasound is the usual first imaging and monitors renal growth, but it
    detects scars poorly. It missed most DMSA-proven scars, so a normal
    ultrasound does not rule out scarring.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:32004557
    reference_title: Accuracy of Ultrasound in Identifying Renal Scarring as Compared to DMSA Scan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The sensitivity of RUS for RS was 35.8% and the specificity was 89.8%,
      leading to an accuracy of 54.2%
    explanation: >-
      Ultrasound is insensitive for scars compared with DMSA.
- name: Contrast-enhanced CT
  description: >-
    CT shows focal polar scars over distorted calyces, global atrophy and
    compensatory hypertrophy. These scars must be told apart from lobar
    infarcts, which they can mimic.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:32445022
    reference_title: "CT imaging of acute and chronic pyelonephritis: a practical guide for emergency radiologists."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Chronic pyelonephritis-which appears as focal polar scars with underlying
      calyceal distortion, global atrophy, and hypertrophy of residual
      tissue-may mimic at imaging lobar infarcts.
    explanation: >-
      CT features and the lobar-infarct differential.
- name: Voiding cystourethrography
  description: >-
    Voiding cystourethrography detects and grades the vesicoureteral reflux
    behind the reflux-associated subtype.
  diagnosis_term:
    preferred_term: voiding cystourethrography
    term:
      id: NCIT:C38049
      label: Cystography
  evidence:
  - reference: PMID:33085409
    reference_title: Vesicoureteral Reflux.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the gold standard for evaluating VUR is direct cystography with voiding
      cystourethrogram (VCUG)
    explanation: >-
      VCUG is the reference test for reflux.
- name: Urinalysis, blood pressure and renal function follow-up
  description: >-
    Patients with reflux nephropathy who have proteinuria, hypertension or
    renal insufficiency need regular follow-up of urine protein, blood
    pressure and renal function.
  diagnosis_term:
    preferred_term: urinalysis for proteinuria
    term:
      id: NCIT:C17241
      label: Urinalysis
  evidence:
  - reference: PMID:7761049
    reference_title: A long term follow up of adults with reflux nephropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All patients with reflux nephropathy who have proteinuria, hypertension
      or renal insufficiency should be under regular follow up.
    explanation: >-
      Recommends surveillance of proteinuria, blood pressure and function.
- name: Histopathology of resected or biopsied kidney
  description: >-
    Histology confirms chronic pyelonephritis in nephrectomy or biopsy
    specimens. It shows scarring, thyroidization and interstitial fibrosis, and
    separates xanthogranulomatous pyelonephritis and malignancy, which can
    mimic it.
  diagnosis_term:
    preferred_term: kidney biopsy or nephrectomy histopathology
    term:
      id: NCIT:C51699
      label: Kidney Biopsy
  evidence:
  - reference: PMID:41250779
    reference_title: Xanthogranulomatous Pyelonephritis in the Tropics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cases with associated chronic pyelonephritis were characterised by
      periglomerular fibrosis, tubular atrophy, thyroidization, and
      interstitial fibrosis.
    explanation: >-
      The histological features used to recognise chronic pyelonephritis in
      nephrectomy specimens.
treatments:
- name: Continuous antibiotic prophylaxis
  description: >-
    Daily low-dose trimethoprim-sulfamethoxazole in children with reflux after
    a first or second febrile infection. In the RIVUR trial it halved
    recurrences but did not reduce renal scarring. It increased
    trimethoprim-sulfamethoxazole resistance in breakthrough E. coli (63% vs
    19%). Its use is now selective, with most benefit for high-grade reflux and
    bladder and bowel dysfunction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: NCIT:C909
        label: Trimethoprim-Sulfamethoxazole
  target_mechanisms:
  - target: Recurrent Ascending Upper-Tract Infection
    description: >-
      Suppresses bacteriuria and so prevents recurrent infection; it does not
      act on the established scar.
  evidence:
  - reference: PMID:24795142
    reference_title: Antimicrobial prophylaxis for children with vesicoureteral reflux.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among children with vesicoureteral reflux after urinary tract infection,
      antimicrobial prophylaxis was associated with a substantially reduced risk
      of recurrence but not of renal scarring.
    explanation: >-
      RIVUR conclusion: fewer recurrences, no reduction in scarring.
  - reference: PMID:24795142
    reference_title: Antimicrobial prophylaxis for children with vesicoureteral reflux.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among 87 children with a first recurrence caused by Escherichia coli, the
      proportion of isolates that were resistant to
      trimethoprim-sulfamethoxazole was 63% in the prophylaxis group and 19% in
      the placebo group.
    explanation: >-
      The resistance cost of prophylaxis.
  - reference: PMID:26555605
    reference_title: Renal Scarring in the Randomized Intervention for Children with Vesicoureteral Reflux (RIVUR) Trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Antimicrobial prophylaxis did not decrease the risk of renal scarring.
    explanation: >-
      The secondary scarring analysis of RIVUR confirms no effect on scars.
  - reference: PMID:33085409
    reference_title: Vesicoureteral Reflux.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      patients with grade IV or V reflux, as well as those with combined
      bladder or bowel dysfunction along with any grade of reflux, received the
      most benefit from continuous prophylaxis as they have the highest risk.
    explanation: >-
      Identifies the children most likely to benefit.
- name: Surgical or endoscopic correction of reflux
  description: >-
    Ureteral reimplantation or endoscopic subureteric injection corrects
    reflux. Trials have not shown surgery to be better than prophylaxis at
    preventing recurrent infection or scarring. It is generally reserved for
    high-grade reflux or failure of prophylaxis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: ureteral reimplantation
    term:
      id: NCIT:C101242
      label: Reimplantation
  target_mechanisms:
  - target: Vesicoureteral and Intrarenal Reflux
    description: >-
      Restores ureterovesical competence so that bladder urine no longer
      refluxes.
  evidence:
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical treatment in spite of offering the quickest possible correction
      of the VUR has not been shown to be superior to antimicrobial prophylaxis
      as for as recurrence of UTI or renal scarring are concerned.
    explanation: >-
      Review of the reflux trials comparing surgery with prophylaxis.
  - reference: PMID:33085409
    reference_title: Vesicoureteral Reflux.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      endoscopic treatment does not offer significant advantages over
      antibiotic prophylaxis in preventing new UTIs or renal scarring in most
      patients.
    explanation: >-
      Caveat that endoscopic correction has no advantage for most patients.
- name: Proactive bladder management for neurogenic bladder
  description: >-
    In neurogenic bladder, starting clean intermittent catheterization and/or
    anticholinergics early relieves high-pressure stasis. In observational
    studies this was associated with less secondary reflux, infection and renal
    deterioration. The evidence carries a high risk of bias.
  therapeutic_modality: OTHER
  notes: >-
    Bound to the generic NCIT Therapeutic Procedure action. NCIT:C38045
    Catheterization exists, but term validation rejected it as outside the
    TreatmentActionTerm enum.
  treatment_term:
    preferred_term: clean intermittent catheterization
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Urinary Tract Obstruction and Stasis
    description: >-
      Regular bladder emptying lowers bladder pressure and stasis.
  evidence:
  - reference: PMID:37726188
    reference_title: Systematic review and meta-analysis to study the outcomes of proactive versus delayed management in children with a congenital neurogenic bladder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Delayed management of NB potentially has 3 times higher risks of
      secondary VUR, non-febrile UTI, and renal deterioration.
    explanation: >-
      Pooled observational data on early bladder management.
  - reference: PMID:37726188
    reference_title: Systematic review and meta-analysis to study the outcomes of proactive versus delayed management in children with a congenital neurogenic bladder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, the evidence is limited by the high risk of bias due to lack of
      randomization and standardized reporting in observational studies.
    explanation: >-
      The authors' own caveat on the strength of the evidence.
- name: Blood pressure control and RAAS blockade
  description: >-
    Hypertension and proteinuria are the complications that most affect
    long-term renal outcome, and both can be treated medically. ACE inhibitors
    or angiotensin receptor blockers are used for proteinuria. In children with
    congenital kidney and urinary tract anomalies, which include reflux
    nephropathy, their benefit is unproven. A 6-12 month trial is suggested,
    stopping the drug if proteinuria does not improve.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antihypertensive therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: angiotensin receptor blocker
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
  target_mechanisms:
  - target: Scar-Associated Renal Hypertension
    description: >-
      Lowers systemic blood pressure.
  - target: Nephron Loss and Remnant Glomerular Overload
    description: >-
      RAAS blockade is used to reduce glomerular proteinuria in the remnant
      kidney.
  evidence:
  - reference: PMID:21896376
    reference_title: Vesicoureteral reflux and reflux nephropathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Of these, hypertension and proteinuria are the commonest ones that have a
      significant bearing on long-term renal outcome and both are amenable to
      medical intervention.
    explanation: >-
      Hypertension and proteinuria are treatable targets.
  - reference: PMID:37577983
    reference_title: "Renin angiotensin aldosterone inhibitors in the treatment of proteinuria in children with congenital anomalies of the kidney and urinary tract: more evidence needed."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RAASi are effective in reducing proteinuria and slowing CKD progression in
      many renal conditions; however, the efficacy of these drugs in patients
      affected by CAKUT with proteinuria is still unknown.
    explanation: >-
      Caveat that benefit in the congenital urinary-tract group is unproven.
  - reference: PMID:37577983
    reference_title: "Renin angiotensin aldosterone inhibitors in the treatment of proteinuria in children with congenital anomalies of the kidney and urinary tract: more evidence needed."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      a 6-12-month trial with RAASi with gradual increase to the maximal
      tolerated dose should be considered. If no improvement of proteinuria is
      obtained, the RAASi should be discontinued.
    explanation: >-
      The suggested trial-and-stop approach.
- name: Nephrectomy for a nonfunctioning kidney
  description: >-
    Removal of a unilateral poorly functioning or nonfunctioning scarred kidney
    normalized blood pressure in 6 of 8 hypertensive children with reflux
    nephropathy. It did not help when the other kidney was also scarred.
    Nephrectomy is also done for pus-filled, nonfunctioning kidneys.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  target_mechanisms:
  - target: Scar-Associated Renal Hypertension
    description: >-
      Removes the scarred kidney that drives the hypertension.
  evidence:
  - reference: PMID:21527219
    reference_title: "Nephrectomy for hypertension in pediatric patients with a unilateral poorly functioning kidney: a contemporary cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seven of 11 with MCDK were normotensive postoperatively compared to 6/8
      patients with reflux nephropathy, and 1/2 patients with UPJ obstruction.
    explanation: >-
      Blood pressure normalized after nephrectomy in most children with reflux
      nephropathy.
  - reference: PMID:21527219
    reference_title: "Nephrectomy for hypertension in pediatric patients with a unilateral poorly functioning kidney: a contemporary cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were 2 patients with contralateral renal scarring, both of which
      remained hypertensive postoperatively.
    explanation: >-
      The limit: a scarred contralateral kidney predicts persistent
      hypertension.
  - reference: PMID:32003360
    reference_title: "Clinical, morphologic and histological features of chronic pyelonephritis: An 8-year review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Nephrectomy was done in 17 (39.5%) of the 43 CPN cases, indications for
      surgery were pus-filled, non-functioning kidneys.
    explanation: >-
      Nephrectomy for infected nonfunctioning kidneys.
- name: Kidney transplantation
  description: >-
    Kidney failure from reflux nephropathy is treated with dialysis and
    transplantation. It accounts for about 5% of pediatric kidney transplants.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  evidence:
  - reference: PMID:33085409
    reference_title: Vesicoureteral Reflux.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      End-stage renal failure in children due to reflux nephropathy accounts
      for about 5% of all pediatric renal transplants.
    explanation: >-
      Transplantation is the treatment for kidney failure from reflux
      nephropathy.
clinical_trials:
- name: NCT00405704
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Randomized Intervention for Children with Vesicoureteral Reflux (RIVUR): a
    2-year, placebo-controlled trial of trimethoprim-sulfamethoxazole
    prophylaxis in 607 children with reflux after a first or second febrile or
    symptomatic urinary tract infection. Renal scarring was a secondary outcome.
  target_phenotypes:
  - preferred_term: Recurrent urinary tract infections
    term:
      id: HP:0000010
      label: Recurrent urinary tract infections
  - preferred_term: Renal cortical scarring
    term:
      id: HP:0002048
      label: Renal cortical atrophy
  evidence:
  - reference: clinicaltrials:NCT00405704
    reference_title: Randomized Intervention for Children With Vesicoureteral Reflux (RIVUR)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Secondary outcomes were renal scarring, treatment failure (a composite of
      recurrences and scarring), and antimicrobial resistance.
    explanation: >-
      The registered trial tested prophylaxis against recurrence and scarring.
animal_models:
- name: Refluxing C3H mouse with ascending UPEC infection
  species: Mouse
  genotype: C3H/HeN and Tlr4-defective C3H/HeJ (inherent vesicoureteral reflux), transurethral UPEC inoculation
  publication: PMID:23519031
  description: >-
    C3H mice reflux in every case. In them, reflux plus sustained kidney
    infection produces reflux nephropathy, whereas sterile reflux or a single
    infection without reflux does not. Innate-immune-defective HeJ mice develop
    more inflammation and more nephropathy.
  modeled_mechanisms:
  - target: Recurrent Ascending Upper-Tract Infection
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the need for both reflux and sustained infection for the
      acquired scar.
    limitations: >-
      The mouse reflux is a strain trait rather than human primary reflux. The
      disease course is compressed into weeks, and hypertension and late renal
      failure are not assessed.
    evidence:
    - reference: PMID:23519031
      reference_title: Interplay between vesicoureteric reflux and kidney infection in the development of reflux nephropathy in mice.
      supports: SUPPORT

- name: Nephron Loss and Remnant Glomerular Overload
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  description: >-
    Loss of nephron mass overloads the surviving glomeruli, which enlarge and
    sclerose. This produces proteinuria and a progressive fall in GFR, which is
    steepest with extensive bilateral scarring. Secondary focal segmental
    glomerulosclerosis is reported in some series but was very rare in another.
  locations:
  - preferred_term: renal glomerulus
    term:
      id: UBERON:0000074
      label: renal glomerulus
  evidence:
  - reference: PMID:7957472
    reference_title: Renal pathology in patients with reflux nephropathy. The turning point in irreversible renal disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These clinicopathological changes thus suggest that hemodynamic changes
      or overloading in the functional remnant nephrons possibly start in stage
      c-a.
    explanation: >-
      Biopsy series linking glomerular enlargement and sclerosis to overload of
      the remnant nephrons as scarring advances.
  downstream:
  - target: Focal segmental glomerulosclerosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Remnant-nephron overload is followed by secondary segmental
      glomerulosclerosis in some kidneys.
    evidence:
    - reference: PMID:21896376
      reference_title: Vesicoureteral reflux and reflux nephropathy.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The pathogenesis for FSGS in RN is not clear and has been attributed to
        glomerular hyperfiltration, deposition of antigen-antibody complexes,
        failure of mesangium to clear macromolecules, and glomerular injury due
        to circulating immune complexes.
      explanation: >-
        States hyperfiltration as one proposed mechanism of FSGS in reflux
        nephropathy, and that the cause is unclear.
  - target: Proteinuria
    causal_link_type: DIRECT
    description: >-
      Glomerular damage in the remnant kidney leaks protein.
    evidence:
    - reference: PMID:21896376
      reference_title: Vesicoureteral reflux and reflux nephropathy.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        It results from glomerular and/or tubulointerstitial damage caused by
        immunologic injury, macromolecular trapping and mesangial dysfunction,
        hypertension, and glomerular hyperfiltration
      explanation: >-
        Gives glomerular hyperfiltration and hypertension among the causes of

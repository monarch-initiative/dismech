- name: Scar-Associated Renal Hypertension
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Scarred kidneys raise systemic blood pressure. Removing a small scarred
    kidney can cure the hypertension. Plasma renin activity does not correlate
    with blood pressure or with the degree of scarring, so the mechanism is not
    settled.

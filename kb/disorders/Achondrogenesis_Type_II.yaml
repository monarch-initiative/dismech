treatments:
- name: Case-Based Neonatal Respiratory Support
  description: >-
    Intensive ventilatory support may be attempted in a liveborn infant, and
    nitric oxide was used after pulmonary hypertension was found in one case.
    Evidence documents use, not reversal of pulmonary hypoplasia or a survival
    benefit.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had severe respiratory distress, and follow-up was continued
      with high frequency oscillation ventilation (HFOV), as conventional
      mechanical ventilator settings failed to achieve the target saturation
      level.
    explanation: Documents intensive respiratory support in one molecularly confirmed liveborn case.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An echocardiography performed on postnatal day 4 revealed pulmonary
      hypertension and the patient was administered nitric oxide
    explanation: Documents nitric oxide administration after case-level pulmonary hypertension was found.
- name: Genetic Counseling and Mosaicism-Aware Recurrence Assessment
  description: >-
    Counseling should address dominant inheritance, the usual new-variant
    presentation, parental testing, and residual recurrence from gonadal or
    somatogonadal mosaicism.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although, we could not evaluate the presence of this mutation in the first
      fetus, we strongly believe that our data are in favor of germline mosaicism
      as the most likely explanation for the recurrence of type II
      achondrogenesis in both sibs.
    explanation: Supports mosaicism-aware recurrence counseling.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The family was provided genetic counseling related to the high suspicion
      of lethal skeletal dysplasia.
    explanation: Documents prenatal genetic counseling in a suspected lethal skeletal dysplasia pregnancy.


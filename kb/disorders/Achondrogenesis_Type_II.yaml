name: Achondrogenesis Type II
creation_date: '2026-02-06T03:25:37Z'
category: Mendelian
synonyms:
- ACG2
- Achondrogenesis type 2
- Achondrogenesis, Langer-Saldino type
- COL2A1-related achondrogenesis
description: >-
  COL2A1-related achondrogenesis, historically called achondrogenesis type II
  or Langer-Saldino achondrogenesis, is the perinatal-lethal end of the type II
  collagen disorder spectrum. Heterozygous COL2A1 variants disrupt cartilage
  matrix organization and endochondral ossification, producing profound fetal
  skeletal underdevelopment, a narrow thorax with pulmonary hypoplasia, and
  fetal or neonatal death. Hypochondrogenesis is a closely related but distinct
  diagnosis on a continuous severity spectrum.

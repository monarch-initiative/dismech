histopathology:
- name: Disorganized Growth Plate Cartilage
  description: >-
    Epiphyseal and growth-plate cartilage is replaced by heterogeneous,
    hypervascular tissue containing fibrous canals and abnormally enlarged
    chondrocytes.
  diagnostic: true
  evidence:
  - reference: PMID:3309860
    reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune and lectin histochemical and microchemical methods were employed to study growth
      cartilage from seven cases of achondrogenesis type II (Langer-Saldino). The normal
      architecture of the epiphyseal and growth plate cartilage was replaced by a morphologically
      heterogeneous tissue. Some areas were comprised of vascular canals surrounded by extensive
      fibrous tissue and enlarged cells that had the appearance and histochemical characteristics of
      hypertrophic chondrocytes.
    explanation: >-
      Identifies the seven achondrogenesis type II cases and preserves the connected findings of
      disorganized cartilage, vascular/fibrous canals and enlarged hypertrophic chondrocytes.
- name: Dilated Rough Endoplasmic Reticulum in Chondrocytes
  description: >-
    Electron microscopy of severe-spectrum cartilage shows a sparse matrix and
    chondrocytes with dilated rough endoplasmic reticulum, consistent with
    retention of mutant procollagen. It is documented in a molecularly
    confirmed ACG2 case, in an achondrogenesis-hypochondrogenesis case with
    intracellular type II collagen accumulations, and in perinatal-lethal
    hypochondrogenesis.
  diagnostic: false
  evidence:
  - reference: PMID:7757081
    reference_title: A radiographic, morphologic, biochemical and molecular analysis of a case of achondrogenesis type II resulting from substitution for a glycine residue (Gly691-->Arg) in the type II collagen trimer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron micrographs showed inclusion bodies of dilated rough
      endoplasmic reticulum in the chondrocytes and the presence of sparse
      collagen fibers in the cartilage matrix.
    explanation: >-
      A molecularly confirmed ACG2 case (Gly691Arg) shows dilated rough ER
      inclusion bodies in chondrocytes.
  - reference: PMID:3057886
    reference_title: 'Type II achondrogenesis-hypochondrogenesis: morphologic and immunohistopathologic studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ultrastructural studies revealed prominently dilated rough endoplasmic
      reticulum containing a fine granular material with occasional fibrils in
      all chondrocytes.
    explanation: Dilated rough ER in every chondrocyte of a case at the milder end of the ACG2-hypochondrogenesis spectrum.
  - reference: PMID:3057886
    reference_title: 'Type II achondrogenesis-hypochondrogenesis: morphologic and immunohistopathologic studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More striking, however, were intense focal accumulations of type II
      collagen within small rounded perinuclear structures of most chondrocytes
      but not other cell types.
    explanation: Immunohistology localizes the retained type II collagen inside chondrocytes.
  - reference: PMID:1429602
    reference_title: An amino acid substitution (Gly853-->Glu) in the collagen alpha 1(II) chain produces hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Electron micrographs of the diseased cartilage showed a sparse
      extracellular matrix and chondrocytes containing dilated rough
      endoplasmic reticulum, which suggested impaired assembly and secretion of
      the mutant protein.
    explanation: Ultrastructural finding in a perinatal-lethal hypochondrogenesis case.

imaging_findings:
- name: Prenatal ultrasound pattern of lethal skeletal underdevelopment
  modality: ULTRASOUND
  description: >-
    Prenatal ultrasound can detect severe long-bone shortening or micromelia,
    a small thorax, edema or hydrops, and polyhydramnios. These findings support
    suspicion of a lethal skeletal dysplasia but do not by themselves establish
    the molecular subtype.
  diagnostic: false
  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Documents prenatal sonographic detection of classic ACG2 findings.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a detailed sonography scan revealed short long bones (<1st percentile for
      all long bones, including femur, tibia, fibula, humerus, radius and ulna)
      with a small thorax and polihydroamnios.
    explanation: A molecularly confirmed case documents the composite ultrasound pattern.
- name: Skeletal radiographic pattern of ACG2
  modality: XRAY
  description: >-
    Radiographs show short tubular bones with widened metaphyses, short usually
    unfractured ribs, a narrow bell-shaped thorax, and markedly deficient
    vertebral and pelvic ossification, with iliac ossification limited to the
    upper part (paraglider-like ilia). Relative preservation of skull
    ossification can help distinguish classic ACG2, but defective skull
    ossification has been reported in molecularly confirmed cases.
  diagnostic: true
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographical findings: short tubular bone with widened metaphyses and
      non ossified cervical vertebrae, short unfractured ribs, narrow bell-shaped
      chest, lack of ossification in pelvis and normal ossification of the skull.
    explanation: A molecularly confirmed case documents the discriminating radiographic pattern.
  - reference: PMID:31392067
    reference_title: 'Diagnosis of Prenatal-Onset Achondrogenesis Type II by a Multidisciplinary Assessment: A Retrospective Study of 2 Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The postnatal radiographic examination of the two cases revealed fetal
      severely short long bones; defective skull ossification; vertebral bodies
      unossified; short, cupped ribs without fractures; and iliac bone
      ossification limited to the upper part, giving a paraglider-like
      appearance (Figure 2).
    explanation: >-
      Two molecularly confirmed fetuses show the typical pattern, including
      the paraglider-like ilia, but with defective skull ossification, so
      skull preservation is not invariant.


progression:
- phase: Prenatal presentation
  age_range: First to second trimester onward
  notes: >-
    Severe limb shortening, edema, hydrops, or cystic hygroma may be detected
    prenatally, with the timing and combination varying among pregnancies.
  evidence:
  - reference: PMID:17994563
    reference_title: 'A familial case of achondrogenesis type II caused by a dominant COL2A1 mutation and "patchy" expression in the mosaic father.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The couple had a fourth pregnancy, and at 11 weeks fetal hydrops with a
      septated cystic hygroma were obvious.
    explanation: Demonstrates first-trimester detection in a molecularly confirmed family.
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Demonstrates a classic second-trimester presentation.
- phase: Fetal or neonatal lethal course
  age_range: Fetal period through early neonatal life
  notes: >-
    Death commonly occurs in utero or early after birth. A liveborn infant in
    one molecularly confirmed report survived 25 days with intensive
    respiratory support, so the timing is not framed as uniformly immediate.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Death occurs mostly in utero or during the early neonatal period [11].
    explanation: The report summarizes the usual fetal or early-neonatal lethal course.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient died of respiratory insufficiency on postnatal day 25.
    explanation: Documents a liveborn course extending to 25 days.

pathophysiology:
- name: Heterozygous Pathogenic COL2A1 Variant
  description: >-
    Definitive autosomal-dominant disease-causing COL2A1 variation initiates
    ACG2. Obligatory glycine substitutions are the predominant variant class in
    studied ACG2/hypochondrogenesis cohorts, while splice-site and in-frame
    deletion variants are also reported.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  evidence:
  - reference: CGGV:assertion_14640c06-c66e-4dc7-86ea-9b0850e51474-2020-10-05T040000.000Z
    reference_title: COL2A1 / achondrogenesis type II (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      COL2A1 | HGNC:2200 | achondrogenesis type II | MONDO:0008702 | AD |
      Definitive | SOP7 | Skeletal Disorders Gene Curation Expert Panel |
      2020-10-05T04:00:00.000Z
    explanation: ClinGen establishes the definitive dominant COL2A1 relationship.
  - reference: PMID:10797431
    reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the COL2A1 gene were found in all 12 patients. Ten of the
      mutations were single base substitutions that converted a codon for an
      obligate glycine to a codon for an amino acid with a bulkier side chain.
    explanation: A 12-patient series supports COL2A1 variation and the common glycine-substitution class.
  downstream:
  - target: Type II Collagen Triple-Helix Destabilization
    causal_link_type: DIRECT
    description: >-
      Glycine substitutions in the Gly-X-Y repeat disrupt the collagen triple
      helix; this is a common, not universal, molecular route in ACG2.
    evidence:
    - reference: PMID:26443184
      reference_title: Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        One-third of the mutations are dominant-negative mutations that affect
        the glycine residue in the G-X-Y repeats of the alpha 1 chain. These
        mutations disrupt the collagen triple helix and are common in
        achondrogenesis type II and hypochondrogenesis.
      explanation: A large variant review directly supports this common dominant-negative route.

- name: Type II Collagen Triple-Helix Destabilization
  description: >-
    In the common glycine-substitution route, replacement of an obligatory
    glycine destabilizes the type II procollagen triple helix. The graph does
    not assert this precise step for every splice or in-frame deletion allele.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:7829510
    reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A transition of G2853 to A in exon 41 produced a substitution of Gly769 by
      Ser within the triple helical domain of the alpha 1(II) chain of type II
      collagen, interrupting the mandatory Gly-X-Y triplet sequence required for
      the normal formation of stable triple helical type II collagen molecules
    explanation: Direct biochemical evidence from one ACG2 fetus supports triple-helix disruption.
  downstream:
  - target: Chondrocyte Type II Collagen Retention and Poor Secretion
    causal_link_type: DIRECT
    description: >-
      Unstable abnormal type II collagen can be retained within chondrocytes and
      poorly secreted; this branch is based on specific studied cases rather
      than asserted for every ACG2 allele.
    evidence:
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A transition of G2853 to A in exon 41 produced a substitution of Gly769 by
        Ser within the triple helical domain of the alpha 1(II) chain of type II
        collagen, interrupting the mandatory Gly-X-Y triplet sequence required for
        the normal formation of stable triple helical type II collagen molecules
      explanation: Identifies the triple-helix-disrupting Gly769Ser variant in the studied fetus.
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, cultured chondrocytes produced a trace amount of type II
        collagen, which was retained within the cells and not secreted.
      explanation: Cultured chondrocytes from the same case directly showed retention and failed secretion.

- name: Chondrocyte Type II Collagen Retention and Poor Secretion
  description: >-
    Some severe COL2A1 variants produce intracellular retention or reduced
    secretion of type II collagen. The magnitude of this defect is
    variant-specific and is not treated as universal.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:7829510
    reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, cultured chondrocytes produced a trace amount of type II
      collagen, which was retained within the cells and not secreted.
    explanation: Directly documents retention and failure of secretion for one Gly769Ser case.
  - reference: PMID:3057886
    reference_title: 'Type II achondrogenesis-hypochondrogenesis: morphologic and immunohistopathologic studies.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results strongly suggest intracellular retention of type II
      collagen within vacuolar structures, probably within the dilated rough
      endoplasmic reticulum observed in all chondrocytes by electron microscopy
      (EM), and imply the presence of an abnormal, poorly secreted type II
      collagen molecule.
    explanation: Immunohistology and EM in fetal cartilage support intracellular retention and poor secretion.
  downstream:
  - target: Chondrocyte Endoplasmic Reticulum Stress
    causal_link_type: DIRECT
    description: >-
      Mutant procollagen that cannot assemble or be secreted accumulates in a
      distended rough endoplasmic reticulum. In human severe-spectrum cartilage
      including ACG2 this is shown ultrastructurally; the downstream stress
      response is shown in Col2a1 mouse models.
    evidence:
    - reference: PMID:7757081
      reference_title: A radiographic, morphologic, biochemical and molecular analysis of a case of achondrogenesis type II resulting from substitution for a glycine residue (Gly691-->Arg) in the type II collagen trimer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Electron micrographs showed inclusion bodies of dilated rough
        endoplasmic reticulum in the chondrocytes and the presence of sparse
        collagen fibers in the cartilage matrix.
      explanation: >-
        A molecularly confirmed ACG2 case (Gly691Arg) shows dilated rough ER
        inclusion bodies in chondrocytes.
    - reference: PMID:1429602
      reference_title: An amino acid substitution (Gly853-->Glu) in the collagen alpha 1(II) chain produces hypochondrogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Electron micrographs of the diseased cartilage showed a sparse
        extracellular matrix and chondrocytes containing dilated rough
        endoplasmic reticulum, which suggested impaired assembly and secretion
        of the mutant protein.
      explanation: >-
        A perinatal-lethal hypochondrogenesis case on the same COL2A1 severity
        continuum shows retention-associated dilation of the rough ER; it is
        indirect for ACG2 because the case is classified as hypochondrogenesis.
    - reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Misfolded procollagen was largely synthesized and retained in dilated
        endoplasmic reticulum and the endoplasmic reticulum stress (ERS)-unfolded
        protein response (UPR)-apoptosis cascade was activated.
      explanation: >-
        A Col2a1 glycine-substitution knock-in mouse links procollagen retention
        to ER stress and UPR activation; mouse evidence, homozygous genotype.
  - target: Abnormal Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Reduced secretion and incorporation of normal type II collagen alters the
      cartilage extracellular matrix; the exact collagen composition varies by
      allele and clinical severity.
    evidence:
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Type I and III collagens were the major species found in cartilage tissue
      explanation: Human cartilage tissue showed variant-specific replacement of type II collagen.

- name: Chondrocyte Endoplasmic Reticulum Stress
  description: >-
    Retained misfolded type II procollagen distends the rough endoplasmic
    reticulum of chondrocytes and activates the unfolded protein response.
    Dilated rough ER is documented in human ACG2 and hypochondrogenesis
    cartilage; UPR activation and its downstream consequences are documented in Col2a1 mutant
    mice rather than measured directly in ACG2 fetuses.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  evidence:
  - reference: PMID:7757081
    reference_title: A radiographic, morphologic, biochemical and molecular analysis of a case of achondrogenesis type II resulting from substitution for a glycine residue (Gly691-->Arg) in the type II collagen trimer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron micrographs showed inclusion bodies of dilated rough
      endoplasmic reticulum in the chondrocytes and the presence of sparse
      collagen fibers in the cartilage matrix.
    explanation: >-
      A molecularly confirmed ACG2 case (Gly691Arg) shows dilated rough ER
      inclusion bodies in chondrocytes.
  - reference: PMID:1429602
    reference_title: An amino acid substitution (Gly853-->Glu) in the collagen alpha 1(II) chain produces hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Electron micrographs of the diseased cartilage showed a sparse
      extracellular matrix and chondrocytes containing dilated rough
      endoplasmic reticulum, which suggested impaired assembly and secretion of
      the mutant protein.
    explanation: >-
      Human severe-spectrum (hypochondrogenesis) cartilage shows dilated rough
      ER in chondrocytes.
  - reference: PMID:1946380
    reference_title: Reduced amounts of cartilage collagen fibrils and growth plate anomalies in transgenic mice harboring a glycine-to-cysteine mutation in the mouse type II procollagen alpha 1-chain gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Electron microscopic analysis showed a pronounced decrease in the number
      of typical thin cartilage collagen fibrils, distension of the rough
      endoplasmic reticulum of chondrocytes, and the presence of abnormally
      large banded collagen fibril bundles.
    explanation: A Col2a1 glycine-substitution transgenic mouse shows the same rough-ER distension.
  - reference: PMID:24475193
    reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Misfolded procollagen was largely synthesized and retained in dilated
      endoplasmic reticulum and the endoplasmic reticulum stress (ERS)-unfolded
      protein response (UPR)-apoptosis cascade was activated.
    explanation: Directly documents ER stress and UPR activation in a Col2a1 mutant mouse.
  downstream:
  - target: ER Stress-Associated Chondrocyte Apoptosis
    causal_link_type: DIRECT
    description: >-
      In the Col2a1 p.Gly1170Ser mouse, sustained ER stress is followed by
      premature chondrocyte apoptosis; this step has not been measured in human
      ACG2 tissue.
    evidence:
    - reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Our results suggest that earlier chondrocyte death was related to the
        ERS-UPR-apoptosis cascade and that this was the chief cause of
        chondrodysplaia.
      explanation: Mouse evidence linking ER stress to chondrocyte death; indirect for human ACG2.

- name: ER Stress-Associated Chondrocyte Apoptosis
  description: >-
    Premature apoptosis of growth-plate chondrocytes before hypertrophy,
    attributed to the ER stress-UPR cascade in a Col2a1 glycine-substitution
    mouse model. Included as a model-supported hypothesis for the human growth
    plate disorganization, not as a measured human finding.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  biological_processes:
  - preferred_term: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0070059
      label: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
  evidence:
  - reference: PMID:24475193
    reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Apoptosis occurred prior to hypertrophy, prevented the formation of a
      hypertrophic zone, disrupted normal chondrogenic signaling pathways, and
      eventually caused chondrodysplasia.
    explanation: Documents premature chondrocyte apoptosis in the Col2a1 mutant mouse.
  downstream:
  - target: Growth-Plate Architectural Disorganization
    causal_link_type: DIRECT
    description: >-
      Loss of chondrocytes before hypertrophy prevents formation of an orderly
      hypertrophic zone in the mouse model.
    evidence:
    - reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Apoptosis occurred prior to hypertrophy, prevented the formation of a
        hypertrophic zone, disrupted normal chondrogenic signaling pathways, and
        eventually caused chondrodysplasia.
      explanation: Mouse evidence that premature apoptosis disrupts growth-plate zonation.

- name: Abnormal Cartilage Extracellular Matrix
  description: >-
    ACG2 cartilage has abnormal matrix abundance, composition, and
    organization. Complete type II collagen loss with type I/III replacement
    occurs in some severe alleles, whereas other cases retain expressed type II
    collagen; the node therefore represents matrix dysfunction rather than
    universal collagen absence.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: cartilage collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  evidence:
  - reference: PMID:1946380
    reference_title: Reduced amounts of cartilage collagen fibrils and growth plate anomalies in transgenic mice harboring a glycine-to-cysteine mutation in the mouse type II procollagen alpha 1-chain gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that the principal consequence of the mutation is a
      considerable reduction in density of the typical thin cartilage collagen
      fibrils and that this phenomenon causes the severe disorganization of the
      growth plate.
    explanation: >-
      A Col2a1 glycine-substitution mouse shows depletion of thin cartilage
      collagen fibrils, the fibrillar counterpart of the human matrix defect.
  - reference: PMID:3309860
    reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The extracellular matrix in the latter areas was more abundant and had
      characteristics of both precartilage mesenchymal matrix and typical
      cartilage matrix; it contained types I and II collagen, cartilage
      proteoglycan, fibronectin, and peanut agglutinin binding glycoconjugate(s).
    explanation: Seven ACG2 cases showed a mixed, heterogeneous cartilage matrix.
  - reference: PMID:1515761
    reference_title: 'Collagen type II in Langer-Saldino achondrogenesis: absence of major abnormalities in a less severe case.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen II was present, although heterogenously distributed throughout
      the cartilaginous matrix.
    explanation: This milder case prevents overgeneralizing complete type II collagen absence.
  downstream:
  - target: Growth-Plate Architectural Disorganization
    causal_link_type: UNKNOWN
    description: >-
      Abnormal matrix and architectural disorganization co-occur in affected
      cartilage; the available histology does not establish their directionality.
    evidence:
    - reference: PMID:3309860
      reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The normal architecture of the epiphyseal and growth plate cartilage was
        replaced by a morphologically heterogeneous tissue.
      explanation: Histology documents co-occurring abnormal matrix and architectural disorganization.
    - reference: PMID:1946380
      reference_title: Reduced amounts of cartilage collagen fibrils and growth plate anomalies in transgenic mice harboring a glycine-to-cysteine mutation in the mouse type II procollagen alpha 1-chain gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        We propose that the principal consequence of the mutation is a
        considerable reduction in density of the typical thin cartilage collagen
        fibrils and that this phenomenon causes the severe disorganization of
        the growth plate.
      explanation: >-
        The authors of a Col2a1 mouse model propose that matrix fibril
        depletion drives growth-plate disorganization; a proposed direction,
        not a demonstrated human one.
  - target: Disproportionate Craniofacial Cartilage Growth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective cartilage matrix in the cranial base and midline facial
      cartilages limits their growth, producing the craniofacial phenotype.
    evidence:
    - reference: PMID:8227287
      reference_title: Abnormal craniofacial morphology and cartilage structure in transgenic mice harboring a Gly --> Cys mutation in the cartilage-specific type II collagen gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        The observations indicate that defective cartilage production causes
        disproportionate craniofacial growth.
      explanation: Mouse evidence that the cartilage defect drives craniofacial growth disproportion.

- name: Disproportionate Craniofacial Cartilage Growth
  description: >-
    Cartilage-template structures of the face and skull base (cranial base
    synchondroses, nasal and midline cartilages, Meckel cartilage) grow
    poorly, giving a short midface and mandible, a relatively domed cranial
    vault, and palatal clefting. The cartilage-to-face link is established in
    Col2a1 transgenic mice; human ACG2 sources document the resulting facial
    features but not the growth mechanism.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:8227287
    reference_title: Abnormal craniofacial morphology and cartilage structure in transgenic mice harboring a Gly --> Cys mutation in the cartilage-specific type II collagen gene.
    supports: SUPPORT

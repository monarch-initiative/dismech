treatments:
- name: Case-Based Neonatal Respiratory Support
  description: >-
    Intensive ventilatory support may be attempted in a liveborn infant, and
    nitric oxide was used after pulmonary hypertension was found in one case.
    Evidence documents use, not reversal of pulmonary hypoplasia or a survival
    benefit.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Neonatal respiratory distress
    term:
      id: HP:0002643
      label: Neonatal respiratory distress
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had severe respiratory distress, and follow-up was continued
      with high frequency oscillation ventilation (HFOV), as conventional
      mechanical ventilator settings failed to achieve the target saturation
      level.
    explanation: Documents intensive respiratory support in one molecularly confirmed liveborn case.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An echocardiography performed on postnatal day 4 revealed pulmonary
      hypertension and the patient was administered nitric oxide
    explanation: Documents nitric oxide administration after case-level pulmonary hypertension was found.
- name: Genetic Counseling and Mosaicism-Aware Recurrence Assessment
  description: >-
    Counseling should address dominant inheritance, the usual new-variant
    presentation, parental testing, and residual recurrence from gonadal or
    somatogonadal mosaicism.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although, we could not evaluate the presence of this mutation in the first
      fetus, we strongly believe that our data are in favor of germline mosaicism
      as the most likely explanation for the recurrence of type II
      achondrogenesis in both sibs.
    explanation: Supports mosaicism-aware recurrence counseling.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The family was provided genetic counseling related to the high suspicion
      of lethal skeletal dysplasia.
    explanation: Documents prenatal genetic counseling in a suspected lethal skeletal dysplasia pregnancy.

diagnosis:
- name: Prenatal Ultrasound Detection
  description: >-
    Ultrasound can identify a lethal skeletal dysplasia pattern, including
    severe micromelia or long-bone shortening, a small thorax, and fetal edema.
  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Supports prenatal ultrasound detection.
  - reference: PMID:20387359
    reference_title: Antenatal diagnosis of achondrogenesis type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Routine ultrasound screening made early detection and timely management
      possible.
    explanation: Supports ultrasound as an early detection method.
- name: Skeletal Radiographic Evaluation
  description: >-
    Fetal or neonatal radiographs characterize the pattern of short tubular
    bones, short unfractured ribs, narrow bell-shaped thorax, and deficient
    vertebral and pelvic ossification, helping distinguish ACG2 from other lethal
    skeletal dysplasias.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographical findings: short tubular bone with widened metaphyses and
      non ossified cervical vertebrae, short unfractured ribs, narrow bell-shaped
      chest, lack of ossification in pelvis and normal ossification of the skull.
    explanation: Documents the discriminating skeletal radiographic pattern.
- name: COL2A1 Molecular Genetic Testing
  description: >-
    Identification of a pathogenic heterozygous COL2A1 variant confirms the
    molecular diagnosis and enables targeted testing in a subsequent pregnancy
    when a familial variant is known.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:10797431
    reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the COL2A1 gene were found in all 12 patients.
    explanation: Supports high diagnostic yield in this ACG2/hypochondrogenesis series.
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis of genomic DNA extracted from amniotic cells of the
      second fetus revealed heterozygosity for a 1340G > A missense mutation
      (G316D) in the COL2A1 gene.
    explanation: Demonstrates prenatal molecular confirmation from amniotic cells.

animal_models:
- name: Col2a1 Gly85Cys transgenic mouse
  species: Mouse
  genotype: Mouse Col2a1 transgene carrying a Gly-to-Cys substitution at triple-helical residue 85, on a wild-type background
  publication: PMID:1946380
  description: >-
    Transgenic mice expressing a glycine-substituted mouse type II procollagen
    develop a severe, neonatal-lethal chondrodysplasia with short limbs and
    trunk, craniofacial anomalies, cleft palate and failure to inflate the
    lungs.
  genes:
  - preferred_term: Col2a1
    term:
      id: hgnc:2200
      label: COL2A1
  modeled_mechanisms:
  - target: Abnormal Cartilage Extracellular Matrix
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Depletion of thin cartilage collagen fibrils and reduced matrix density.
    limitations: >-
      Multicopy transgene added to two normal endogenous alleles, so the
      mutant-to-normal chain ratio differs from a heterozygous human fetus; the
      residue is not a reported human ACG2 allele.
    evidence:
    - reference: PMID:1946380
      reference_title: Reduced amounts of cartilage collagen fibrils and growth plate anomalies in transgenic mice harboring a glycine-to-cysteine mutation in the mouse type II procollagen alpha 1-chain gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Light microscopic examination indicated a decrease in cartilage matrix
        density, a severe disorganization of growth plate architecture, and the
        presence of streaks of fibrillar material in the cartilage matrix.
      explanation: Matrix and growth-plate histology in the transgenic mice.
  - target: Growth-Plate Architectural Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Severe disorganization of growth-plate architecture.
    limitations: >-
      Transgene dosage differs from the human heterozygous state; mouse growth
      plate timing is not equivalent to human fetal development.
    evidence:

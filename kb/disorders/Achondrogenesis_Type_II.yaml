  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Supports prenatal ultrasound detection.
  - reference: PMID:20387359
    reference_title: Antenatal diagnosis of achondrogenesis type II.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Routine ultrasound screening made early detection and timely management
      possible.
    explanation: Supports ultrasound as an early detection method.
- name: Skeletal Radiographic Evaluation
  description: >-
    Fetal or neonatal radiographs characterize the pattern of short tubular
    bones, short unfractured ribs, narrow bell-shaped thorax, and deficient
    vertebral and pelvic ossification, helping distinguish ACG2 from other lethal
    skeletal dysplasias.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographical findings: short tubular bone with widened metaphyses and
      non ossified cervical vertebrae, short unfractured ribs, narrow bell-shaped
      chest, lack of ossification in pelvis and normal ossification of the skull.
    explanation: Documents the discriminating skeletal radiographic pattern.
- name: COL2A1 Molecular Genetic Testing
  description: >-
    Identification of a pathogenic heterozygous COL2A1 variant confirms the
    molecular diagnosis and enables targeted testing in a subsequent pregnancy
    when a familial variant is known.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:10797431
    reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Mutations in the COL2A1 gene were found in all 12 patients.
    explanation: Supports high diagnostic yield in this ACG2/hypochondrogenesis series.
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular analysis of genomic DNA extracted from amniotic cells of the
      second fetus revealed heterozygosity for a 1340G > A missense mutation
      (G316D) in the COL2A1 gene.
    explanation: Demonstrates prenatal molecular confirmation from amniotic cells.

differential_diagnoses:
- name: Achondrogenesis type IA
  description: >-
    Achondrogenesis IA overlaps through profound fetal skeletal shortening and
    severe ossification defects.
  distinguishing_features:
  - Skull ossification is poor in type IA but relatively preserved in classic ACG2.
  - Rib fractures favor type IA; ACG2 classically has short unfractured ribs.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The skull is not ossified in ACG1A, whereas there are mildly low ossified
      areas in ACG1B. Skull ossification is normal in ACG2, alongside decreased
      ossification in the pelvis and spine. Rib fractures are common in ACG1A,
      whereas short ribs are often without fractures in ACG2 [2, 4, 13].
    explanation: Provides the principal radiographic distinctions from type IA.
- name: Achondrogenesis type IB
  description: >-
    Achondrogenesis IB shares a severe fetal skeletal presentation.
  distinguishing_features:
  - Skull ossification is mildly reduced in type IB but relatively preserved in classic ACG2.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The skull is not ossified in ACG1A, whereas there are mildly low ossified
      areas in ACG1B. Skull ossification is normal in ACG2, alongside decreased
      ossification in the pelvis and spine.
    explanation: Provides the principal radiographic distinction from type IB.
- name: Hypochondrogenesis
  disease_term:
    preferred_term: hypochondrogenesis
    term:
      id: MONDO:0019669
      label: hypochondrogenesis
  description: >-
    Hypochondrogenesis occupies the less severe end of a lethal skeletal
    dysplasia spectrum with substantial radiographic and histologic overlap.
  distinguishing_features:
  - The ACG2-hypochondrogenesis boundary is continuous and may not be cleanly resolved.
  evidence:
  - reference: PMID:3717210
    reference_title: 'Achondrogenesis II-hypochondrogenesis: variability versus heterogeneity.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that hypochondrogenesis and achondrogenesis type II
      represent a spectrum with marked phenotypic variability.
    explanation: A 24-case study supports a continuous ACG2-hypochondrogenesis spectrum.

notes: >-
  Ocular and hearing phenotypes that occur across the broader type II collagen
  disorder spectrum are intentionally not assigned to this perinatal-lethal
  subtype without ACG2-specific ascertainment. Intracellular retention and
  collagen I/III replacement are modeled as variant-specific routes rather than
  universal ACG2 biology.


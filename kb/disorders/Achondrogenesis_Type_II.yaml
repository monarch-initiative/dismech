inheritance:
- name: Autosomal dominant, usually arising as a new variant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ACG2 is autosomal dominant. Most reported affected fetuses have a new
    heterozygous COL2A1 variant, but parental gonadal or somatogonadal mosaicism
    can cause sibling recurrence; no fixed de novo or residual-recurrence
    percentage is assigned.
  evidence:
  - reference: ORPHA:93296
    reference_title: Achondrogenesis type 2
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Autosomal dominant
    explanation: Orphanet records autosomal-dominant inheritance for ACG2.
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Achondrogenesis type II is a lethal skeletal dysplasia caused by new
      dominant mutations within the type II collagen gene (COL2A1).
    explanation: >-
      This family report supports the usual new-dominant presentation without
      quantifying its proportion.
  - reference: PMID:17994563
    reference_title: 'A familial case of achondrogenesis type II caused by a dominant COL2A1 mutation and "patchy" expression in the mosaic father.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This mutation was also found in the father, as a mosaic.
    explanation: >-
      A clinically mild mosaic parent transmitted ACG2, demonstrating that
      parental mosaicism must be considered in recurrence counseling.


      reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Typical radiological findings of ACG2 include short long bones, short
        ribs without fractures, decreased ossification of the pelvis and spine,
        and normal mineralization in the iliac and calvarial bones [3].
      explanation: A clinical report summarizes the characteristic short long bones.

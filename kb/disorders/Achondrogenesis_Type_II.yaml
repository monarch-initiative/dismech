progression:
- phase: Prenatal presentation
  age_range: First to second trimester onward
  notes: >-
    Severe limb shortening, edema, hydrops, or cystic hygroma may be detected
    prenatally, with the timing and combination varying among pregnancies.
  evidence:
  - reference: PMID:17994563
    reference_title: 'A familial case of achondrogenesis type II caused by a dominant COL2A1 mutation and "patchy" expression in the mosaic father.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The couple had a fourth pregnancy, and at 11 weeks fetal hydrops with a
      septated cystic hygroma were obvious.
    explanation: Demonstrates first-trimester detection in a molecularly confirmed family.
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Demonstrates a classic second-trimester presentation.
- phase: Fetal or neonatal lethal course
  age_range: Fetal period through early neonatal life
  notes: >-
    Death commonly occurs in utero or early after birth. A liveborn infant in
    one molecularly confirmed report survived 25 days with intensive
    respiratory support, so the timing is not framed as uniformly immediate.
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Death occurs mostly in utero or during the early neonatal period [11].
    explanation: The report summarizes the usual fetal or early-neonatal lethal course.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The patient died of respiratory insufficiency on postnatal day 25.
    explanation: Documents a liveborn course extending to 25 days.

pathophysiology:
- name: Heterozygous Pathogenic COL2A1 Variant
  description: >-
    Definitive autosomal-dominant disease-causing COL2A1 variation initiates
    ACG2. Obligatory glycine substitutions are the predominant variant class in
    studied ACG2/hypochondrogenesis cohorts, while splice-site and in-frame
    deletion variants are also reported.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
  evidence:
  - reference: CGGV:assertion_14640c06-c66e-4dc7-86ea-9b0850e51474-2020-10-05T040000.000Z
    reference_title: COL2A1 / achondrogenesis type II (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      COL2A1 | HGNC:2200 | achondrogenesis type II | MONDO:0008702 | AD |
      Definitive | SOP7 | Skeletal Disorders Gene Curation Expert Panel |
      2020-10-05T04:00:00.000Z
    explanation: ClinGen establishes the definitive dominant COL2A1 relationship.
  - reference: PMID:10797431
    reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the COL2A1 gene were found in all 12 patients. Ten of the
      mutations were single base substitutions that converted a codon for an
      obligate glycine to a codon for an amino acid with a bulkier side chain.
    explanation: A 12-patient series supports COL2A1 variation and the common glycine-substitution class.
  downstream:
  - target: Type II Collagen Triple-Helix Destabilization
    causal_link_type: DIRECT
    description: >-
      Glycine substitutions in the Gly-X-Y repeat disrupt the collagen triple
      helix; this is a common, not universal, molecular route in ACG2.
    evidence:
    - reference: PMID:26443184
      reference_title: Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        One-third of the mutations are dominant-negative mutations that affect
        the glycine residue in the G-X-Y repeats of the alpha 1 chain. These
        mutations disrupt the collagen triple helix and are common in
        achondrogenesis type II and hypochondrogenesis.
      explanation: A large variant review directly supports this common dominant-negative route.

- name: Type II Collagen Triple-Helix Destabilization
  description: >-
    In the common glycine-substitution route, replacement of an obligatory
    glycine destabilizes the type II procollagen triple helix. The graph does
    not assert this precise step for every splice or in-frame deletion allele.
  biological_processes:
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:7829510
    reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A transition of G2853 to A in exon 41 produced a substitution of Gly769 by
      Ser within the triple helical domain of the alpha 1(II) chain of type II
      collagen, interrupting the mandatory Gly-X-Y triplet sequence required for
      the normal formation of stable triple helical type II collagen molecules
    explanation: Direct biochemical evidence from one ACG2 fetus supports triple-helix disruption.
  downstream:
  - target: Chondrocyte Type II Collagen Retention and Poor Secretion
    causal_link_type: DIRECT
    description: >-
      Unstable abnormal type II collagen can be retained within chondrocytes and
      poorly secreted; this branch is based on specific studied cases rather
      than asserted for every ACG2 allele.
    evidence:
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A transition of G2853 to A in exon 41 produced a substitution of Gly769 by
        Ser within the triple helical domain of the alpha 1(II) chain of type II
        collagen, interrupting the mandatory Gly-X-Y triplet sequence required for
        the normal formation of stable triple helical type II collagen molecules
      explanation: Identifies the triple-helix-disrupting Gly769Ser variant in the studied fetus.
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, cultured chondrocytes produced a trace amount of type II
        collagen, which was retained within the cells and not secreted.
      explanation: Cultured chondrocytes from the same case directly showed retention and failed secretion.

- name: Chondrocyte Type II Collagen Retention and Poor Secretion
  description: >-
    Some severe COL2A1 variants produce intracellular retention or reduced
    secretion of type II collagen. The magnitude of this defect is
    variant-specific and is not treated as universal.
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:7829510
    reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, cultured chondrocytes produced a trace amount of type II
      collagen, which was retained within the cells and not secreted.
    explanation: Directly documents retention and failure of secretion for one Gly769Ser case.
  downstream:
  - target: Abnormal Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Reduced secretion and incorporation of normal type II collagen alters the
      cartilage extracellular matrix; the exact collagen composition varies by
      allele and clinical severity.
    evidence:
    - reference: PMID:7829510
      reference_title: A COL2A1 mutation in achondrogenesis type II results in the replacement of type II collagen by type I and III collagens in cartilage.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Type I and III collagens were the major species found in cartilage tissue
      explanation: Human cartilage tissue showed variant-specific replacement of type II collagen.

- name: Abnormal Cartilage Extracellular Matrix
  description: >-
    ACG2 cartilage has abnormal matrix abundance, composition, and
    organization. Complete type II collagen loss with type I/III replacement
    occurs in some severe alleles, whereas other cases retain expressed type II
    collagen; the node therefore represents matrix dysfunction rather than
    universal collagen absence.
  biological_processes:
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:3309860
    reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The extracellular matrix in the latter areas was more abundant and had
      characteristics of both precartilage mesenchymal matrix and typical
      cartilage matrix; it contained types I and II collagen, cartilage
      proteoglycan, fibronectin, and peanut agglutinin binding glycoconjugate(s).
    explanation: Seven ACG2 cases showed a mixed, heterogeneous cartilage matrix.
  - reference: PMID:1515761
    reference_title: 'Collagen type II in Langer-Saldino achondrogenesis: absence of major abnormalities in a less severe case.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collagen II was present, although heterogenously distributed throughout
      the cartilaginous matrix.
    explanation: This milder case prevents overgeneralizing complete type II collagen absence.
  downstream:
  - target: Growth-Plate Architectural Disorganization
    causal_link_type: UNKNOWN
    description: >-
      Abnormal matrix and architectural disorganization co-occur in affected
      cartilage; the available histology does not establish their directionality.
    evidence:
    - reference: PMID:3309860
      reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The normal architecture of the epiphyseal and growth plate cartilage was
        replaced by a morphologically heterogeneous tissue.
      explanation: Histology documents co-occurring abnormal matrix and architectural disorganization.

- name: Growth-Plate Architectural Disorganization
  description: >-
    Epiphyseal and growth-plate cartilage is hypercellular, hypervascular, and
    structurally disorganized, with fibrous vascular canals and abnormal
    chondrocyte maturation patterns.
  cell_types:
  - preferred_term: growth plate cartilage chondrocyte
    term:
      id: CL:1000217
      label: growth plate cartilage chondrocyte
  evidence:
  - reference: PMID:3309860
    reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some areas were comprised of vascular canals surrounded by extensive
      fibrous tissue and enlarged cells that had the appearance and
      histochemical characteristics of hypertrophic chondrocytes.
    explanation: Describes the disorganized ACG2 growth-plate architecture.
  downstream:
  - target: Impaired Endochondral Ossification
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Failure of the cartilage growth-plate template to support normal bone formation
    description: >-
      Disorganized cartilage compromises the template through which
      endochondral bone develops.
    evidence:
    - reference: PMID:22859705
      reference_title: Hypertrophic chondrocytes have a limited capacity to cope with increases in endoplasmic reticulum stress without triggering the unfolded protein response.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Longitudinal bone growth is dependent on the strict temporal regulation
        and control of chondrocyte differentiation, proliferation, hypertrophy,
        apoptosis, and vascular invasion within the growth plate. Disturbances
        to this coordinated process cause a large number of skeletal growth disorders.
      explanation: Mouse-study background biology supports this general intervening mechanism, not ACG2-specific human causation.

- name: Impaired Endochondral Ossification
  description: >-
    Failure of endochondral bone development produces profound appendicular,
    axial, pelvic, and craniofacial skeletal underdevelopment.
  biological_processes:
  - preferred_term: cartilage development involved in endochondral bone morphogenesis
    term:

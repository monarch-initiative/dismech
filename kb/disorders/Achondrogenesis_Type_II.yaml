      snippet: >-
        The newborn transgenic mice had a short snout and mandible, a protruding
        tongue, a cleft of the secondary palate with the tongue situated between
        the shelves, and a doming cranial vault.
      explanation: Craniofacial phenotype of the Gly85 transgenic lines.

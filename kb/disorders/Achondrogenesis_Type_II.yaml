    - reference: PMID:10797431
      reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ten of the mutations were single base substitutions that converted a
        codon for an obligate glycine to a codon for an amino acid with a
        bulkier side chain.
      explanation: Ten of 12 patients in this severe-spectrum series had glycine substitutions.
  - name: Splice-site and in-frame deletion variants
    description: >-
      Less common severe-spectrum variants alter a consensus splice site or
      delete coding sequence in frame.
    evidence:
    - reference: PMID:10797431
      reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One of the mutations was a change in a consensus RNA splice site.
        Another was an 18-base pair deletion of coding sequences.
      explanation: The same series documents these non-glycine-substitution classes.
  - name: c.1267-2_1269del (exon 21 skipping, p.Gly423_Thr455del)
    description: >-
      A de novo splice-region deletion that causes in-frame skipping of exon 21
      in a minigene assay. COL2A1 in-frame deletions usually cause milder
      phenotypes such as Kniest dysplasia, so this allele shows that deletion
      size and position can also produce ACG2.
    evidence:
    - reference: PMID:34573377
      reference_title: 'A Novel Splicing Variant of COL2A1 in a Fetus with Achondrogenesis Type II: Interpretation of Pathogenicity of In-Frame Deletions.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The minigene expression resulted in the synthesis of a COL2A1 messenger
        RNA lacking exon 21, which generated a predicted in-frame deleted
        protein.
      explanation: Establishes the exon-skipping consequence of the fetal variant.
    - reference: PMID:34573377
      reference_title: 'A Novel Splicing Variant of COL2A1 in a Fetus with Achondrogenesis Type II: Interpretation of Pathogenicity of In-Frame Deletions.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The c.1267-2_1269del variant of COL2A1 was confirmed in the fetus and
        excluded in the parents.
      explanation: Documents the de novo origin of the variant.
  - name: C-propeptide variants
    description: >-
      Variants in the carboxyl-terminal propeptide, outside the triple helix,
      can also cause ACG2.
    evidence:
    - reference: PMID:31392067
      reference_title: 'Diagnosis of Prenatal-Onset Achondrogenesis Type II by a Multidisciplinary Assessment: A Retrospective Study of 2 Cases.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The COL2A1 mutation of case 2 was in the collagen triple helix, but
        mutation of case 1 was in the carboxyl terminal propeptide region; the
        two causative mutations in COL2A1 have not been previously reported.
      explanation: One of two molecularly confirmed ACG2 fetuses carried a C-propeptide variant.

- name: Col2a1 p.Gly1170Ser knock-in mouse
  species: Mouse
  genotype: Col2a1 p.Gly1170Ser knock-in; chondrodysplasia in homozygotes, heterozygotes phenotypically normal
  publication: PMID:24475193
  description: >-
    A knock-in triple-helical glycine substitution that shows retention of
    misfolded procollagen in a dilated ER, UPR activation and premature
    chondrocyte apoptosis in homozygous mice.
  genes:
  - preferred_term: Col2a1
    term:
      id: hgnc:2200
      label: COL2A1
  modeled_mechanisms:
  - target: Chondrocyte Endoplasmic Reticulum Stress
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Procollagen retention in dilated ER with ER stress-UPR activation.
    limitations: >-
      The phenotype is seen only in homozygotes; heterozygotes, the genotype
      that corresponds to human ACG2, had normal phenotypes and limited ER
      stress.
    evidence:
    - reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygotes had normal phenotypes and endoplasmic reticulum stress
        intensity was limited with no abnormal apoptosis detected.
      explanation: States the zygosity limitation of the model.
  - target: ER Stress-Associated Chondrocyte Apoptosis
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Chondrocyte apoptosis before hypertrophy in homozygous mutants.
    limitations: >-
      Homozygous-only phenotype; human ACG2 is heterozygous, and premature
      chondrocyte apoptosis has not been measured in ACG2 fetal cartilage.
    evidence:
    - reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Apoptosis occurred prior to hypertrophy, prevented the formation of a
        hypertrophic zone, disrupted normal chondrogenic signaling pathways, and
        eventually caused chondrodysplasia.
      explanation: Premature apoptosis in the knock-in mouse.
- name: Col2a1 human minigene (in-frame deletion) transgenic mouse
  species: Mouse
  genotype: Transgenic human COL2A1 minigene lacking 12 central exons, on a wild-type mouse background
  publication: PMID:1881905
  description: >-
    Shortened human pro-alpha1(II) chains associate with normal mouse chains
    and deplete endogenous type II procollagen ("procollagen suicide"),
    producing dwarfism, cleft palate, delayed mineralization and perinatal
    death in some mice.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  modeled_mechanisms:
  - target: Abnormal Cartilage Extracellular Matrix
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Decreased density and organization of cartilage collagen fibrils.
    limitations: >-
      Models a large in-frame deletion acting through procollagen suicide, not
      the predominant glycine-substitution class of ACG2 alleles, and the
      phenotype is milder than ACG2 in most mice.
    evidence:
    - reference: PMID:1881905
      reference_title: Expression of a partially deleted gene of human type II procollagen (COL2A1) in transgenic mice produces a chondrodysplasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Microscopic examination of cartilage revealed decreased density and
        organization of collagen fibrils.
      explanation: Matrix fibril defect in the minigene mice.
- name: Col2a1 null mouse
  species: Mouse
  genotype: Col2a1 targeted inactivation (homozygous null); heterozygotes have a minimal phenotype
  publication: PMID:7590256
  description: >-
    Homozygous loss of collagen II gives perinatally lethal fetuses lacking
    endochondral bone and growth plates, while heterozygous loss is nearly
    silent, which is consistent with the dominant-negative rather than
    haploinsufficient basis of ACG2.
  genes:
  - preferred_term: Col2a1
    term:
      id: hgnc:2200
      label: COL2A1
  modeled_mechanisms:
  - target: Impaired Endochondral Ossification
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Absence of endochondral bone and epiphyseal growth plates in homozygous null fetuses.
    limitations: >-
      Biallelic null genotype, whereas ACG2 is caused by a single dominant
      allele; heterozygous null mice have a minimal phenotype, so the model
      shows the consequence of absent collagen II rather than the human
      dominant-negative mechanism.
    evidence:
    - reference: PMID:7590256
      reference_title: Transgenic mice with targeted inactivation of the Col2 alpha 1 gene for collagen II develop a skeleton with membranous and periosteal bone but no endochondral bone.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: There was no endochondrial bone or epiphyseal growth plate in long bones.
      explanation: Endochondral ossification fails completely without collagen II.
  evidence:
  - reference: PMID:7590256
    reference_title: Transgenic mice with targeted inactivation of the Col2 alpha 1 gene for collagen II develop a skeleton with membranous and periosteal bone but no endochondral bone.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Heterozygous mice had a minimal phenotype.
    explanation: Heterozygous loss of Col2a1 is nearly silent in mice.


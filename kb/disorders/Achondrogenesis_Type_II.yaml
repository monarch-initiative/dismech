      label: cartilage development involved in endochondral bone morphogenesis
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
  evidence:
  - reference: ORPHA:932
    reference_title: Achondrogenesis
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare group of lethal skeletal dysplasias characterized by an
      endochondral ossification deficiency that leads to dwarfism with extreme
      micromelia, a small thorax, a prominent abdomen, anasarca and
      polyhydramnios.
    explanation: Supports deficient endochondral ossification as the central skeletal process.
  downstream:

    notes: >-
      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 2 "Type 2 collagen
      group"; listed as "Achondrogenesis type 2 (Langer-Saldino)".

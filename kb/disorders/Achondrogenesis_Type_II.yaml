histopathology:
- name: Disorganized Growth Plate Cartilage
  description: >-
    Epiphyseal and growth-plate cartilage is replaced by heterogeneous,
    hypervascular tissue containing fibrous canals and abnormally enlarged
    chondrocytes.
  diagnostic: true
  evidence:
  - reference: PMID:3309860
    reference_title: Achondrogenesis type II, abnormalities of extracellular matrix.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The normal architecture of the epiphyseal and growth plate cartilage was
      replaced by a morphologically heterogeneous tissue.
    explanation: Seven ACG2 cases showed the characteristic cartilage disorganization.

imaging_findings:
- name: Prenatal ultrasound pattern of lethal skeletal underdevelopment
  modality: ULTRASOUND
  description: >-
    Prenatal ultrasound can detect severe long-bone shortening or micromelia,
    a small thorax, edema or hydrops, and polyhydramnios. These findings support
    suspicion of a lethal skeletal dysplasia but do not by themselves establish
    the molecular subtype.
  diagnostic: false
  evidence:
  - reference: PMID:15054848
    reference_title: 'Recurrence of achondrogenesis type II within the same family: evidence for germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first pregnancy, severe micromelia and generalized edema were noted
      on ultrasound at 21 weeks' gestation.
    explanation: Documents prenatal sonographic detection of classic ACG2 findings.
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a detailed sonography scan revealed short long bones (<1st percentile for
      all long bones, including femur, tibia, fibula, humerus, radius and ulna)
      with a small thorax and polihydroamnios.
    explanation: A molecularly confirmed case documents the composite ultrasound pattern.
- name: Skeletal radiographic pattern of ACG2
  modality: XRAY
  description: >-
    Radiographs show short tubular bones with widened metaphyses, short usually
    unfractured ribs, a narrow bell-shaped thorax, and markedly deficient
    vertebral and pelvic ossification. Relative preservation of skull
    ossification can help distinguish classic ACG2, but it is not stated as
    invariant.
  diagnostic: true
  evidence:
  - reference: PMID:31523626
    reference_title: Achondrogenesis Type 2 in a Newborn with a Novel Mutation on the COL2A1 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiographical findings: short tubular bone with widened metaphyses and
      non ossified cervical vertebrae, short unfractured ribs, narrow bell-shaped
      chest, lack of ossification in pelvis and normal ossification of the skull.
    explanation: A molecularly confirmed case documents the discriminating radiographic pattern.

genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Affected fetuses carry constitutional heterozygous COL2A1 variants. Many are
    new in the fetus, while transmission from a gonadal or somatogonadal mosaic
    parent is documented.
  variants:
  - name: Triple-helical glycine substitutions
    description: >-
      The predominant studied class replaces an obligatory glycine in the
      COL2A1 Gly-X-Y repeat with an amino acid having a bulkier side chain.
    evidence:
    - reference: PMID:10797431
      reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ten of the mutations were single base substitutions that converted a
        codon for an obligate glycine to a codon for an amino acid with a
        bulkier side chain.
      explanation: Ten of 12 patients in this severe-spectrum series had glycine substitutions.
  - name: Splice-site and in-frame deletion variants
    description: >-
      Less common severe-spectrum variants alter a consensus splice site or
      delete coding sequence in frame.
    evidence:
    - reference: PMID:10797431
      reference_title: Widely distributed mutations in the COL2A1 gene produce achondrogenesis type II/hypochondrogenesis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        One of the mutations was a change in a consensus RNA splice site.
        Another was an 18-base pair deletion of coding sequences.
      explanation: The same series documents these non-glycine-substitution classes.
  evidence:
  - reference: CGGV:assertion_14640c06-c66e-4dc7-86ea-9b0850e51474-2020-10-05T040000.000Z
    reference_title: COL2A1 / achondrogenesis type II (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      COL2A1 | HGNC:2200 | achondrogenesis type II | MONDO:0008702 | AD |
      Definitive | SOP7 | Skeletal Disorders Gene Curation Expert Panel |
      2020-10-05T04:00:00.000Z
    explanation: ClinGen classifies the COL2A1 relationship as definitive.


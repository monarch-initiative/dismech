diagnosis:
- name: Fragile X (FMR1) repeat testing
  description: >-
    Sizing of the FMR1 CGG trinucleotide repeat, performed before or alongside
    sequencing. It is separated from the sequencing entry below because it is a
    mechanically distinct assay: a repeat expansion is not reliably called by
    exome or panel sequencing, so a normal sequencing result does not exclude
    fragile X syndrome. Fragile X is the most common single XLID entity, and
    excluding it is the conventional first step in a male with intellectual
    disability and a suggestive X-linked family history - in the Basque
    targeted-panel cohort, every one of the 61 patients had already been
    referred for FMR1 testing and shown a normal repeat number before
    enrolment.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Over 150 syndromes, the most common of which is the fragile X syndrome,
      have been described.
    explanation: >-
      Establishes fragile X syndrome as the most common of the XLID syndromes,
      which is why its exclusion is the conventional first diagnostic step in
      this population. Tagged OTHER: the source is a historical review and the
      sentence summarises the field rather than reporting a clinical series.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents FMR1 testing as the referral-level first step preceding
      sequencing in a suggestive non-syndromic XLID cohort.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 61 patients had normal G-banded karyotype and showed normal FMR1
      trinucleotide repeat numbers.
    explanation: >-
      Documents that a normal FMR1 repeat number was, in this cohort, already
      established before enrolment - so fragile X exclusion preceded the
      non-syndromic XLID workup rather than running alongside it. The
      generalisation to practice is the entry's own inference from the
      referral pattern, not a claim of the quoted sentence.
- name: Molecular genetic testing (exome or genome sequencing)
  description: >-
    Because affected individuals have no distinguishing clinical features, a
    specific diagnosis cannot be reached by examination and requires parallel
    molecular testing of all known intellectual-disability genes. The
    contemporary workup is clinical evaluation with a family pedigree,
    fragile X (FMR1) testing (recorded as its own entry above), chromosomal
    microarray, and exome or genome sequencing with segregation analysis; of
    these, only fragile X exclusion and panel sequencing with segregation are
    covered by the evidence cited here, the remainder - chromosomal microarray
    in particular - reflecting standard practice. Targeted XLID panels
    retain a role in pedigrees with suggestive X-linked family history: in one
    cohort of 61 unrelated males with suggestive non-syndromic XLID and
    negative fragile X testing, an 82-gene panel identified 17 candidate
    variants in 16 patients.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this family not only broadens the spectrum of GDI1 mutations but
      also emphasizes the need for parallel testing of all known genes
      associated with ID in patients with an unspecific phenotype.
    explanation: >-
      States the diagnostic strategy the class requires and the reason for it.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have performed targeted next-generation sequencing of 82 XLID genes
      on 61 non-related male patients with suggestive non-syndromic XLID.
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents the cohort design and the position of targeted panels after
      fragile X exclusion in this population.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing data analysis identified 17 candidate variants in 16
      patients.
    explanation: >-
      Quantifies the diagnostic yield of a targeted panel in a suggestive
      non-syndromic XLID cohort.
- name: Brain MRI
  description: >-
    Characteristically unremarkable. Its role here is exclusionary - normal
    imaging supports a non-syndromic, non-malformative diagnosis and argues
    against the malformative X-linked entities (for example ARX-related
    lissencephaly) that enter the differential.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI analysis showed no gross defects in brain development.
    explanation: >-
      Documents the normal imaging expected in this class.
- name: X-chromosome inactivation studies in female relatives
  description: >-
    Assessment of X-inactivation skewing in mothers and female relatives.
    Extreme skewing supports an X-linked cause and, in cohorts of females with
    idiopathic intellectual disability, enriches for pathogenic findings on
    subsequent sequencing - 11 of 136 informative women showed at least 90%
    skewing, and exome sequencing found pathogenic variants in 8 of those 11.
    Note that those variants were dominant and included autosomal genes, so
    skewing is an ascertainment aid toward a genetic diagnosis generally, not
    a diagnostic criterion for this class.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and 14 male patients with ID and affected brothers whose mothers show
      skewed X-inactivation
    explanation: >-
      Documents maternal X-inactivation skewing used as an ascertainment
      criterion for suspected X-linked intellectual disability.
  - reference: PMID:36943625
    reference_title: "Skewed X-chromosome Inactivation in Women with Idiopathic Intellectual Disability is Indicative of Pathogenic Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 136 patients who were informative, 11 (8%) presented with
      extreme or total XCI skewing (>= 90%), which was significantly higher
      than expected by chance.
    explanation: >-
      Quantifies the enrichment of extreme X-inactivation skewing in women
      with idiopathic intellectual disability.
  - reference: PMID:36943625
    reference_title: "Skewed X-chromosome Inactivation in Women with Idiopathic Intellectual Disability is Indicative of Pathogenic Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants were mapped to ID-related genes with dominant phenotypes:
      four variants in the X-linked genes DDX3X (an XCI escape gene; two
      cases), WDR45, and PDHA1, and four variants in the autosomal genes
      KCNB1, CTNNB1, YY1, and ANKRD11.
    explanation: >-
      Important qualification, and the reason this is PARTIAL for this entry:
      half the variants recovered by the skewing-guided strategy were
      autosomal, so the yield is not specific to X-linked - let alone
      non-syndromic X-linked - intellectual disability.

treatments:
- name: Genetic Counseling
  description: >-
    Establishing a molecular diagnosis enables carrier detection in female
    relatives and informs recurrence-risk counselling and reproductive
    options, including prenatal diagnosis and preimplantation genetic testing
    where a familial pathogenic variant is known. Because the mode of
    inheritance is X-linked, carrier females have a 50% chance of transmitting
    the allele to each child, and the counselling yield is high in the large
    multiplex pedigrees characteristic of this class.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the same time, it has improved the clinical diagnosis of XLID and
      allowed for carrier detection and prevention strategies through gamete
      donation, prenatal diagnosis, and genetic counseling.
    explanation: >-
      Documents genetic counselling and carrier detection as the established
      clinical payoff of molecular diagnosis in this class.
- name: Supportive Care
  description: >-
    No disease-modifying therapy is established for this class. Management is
    supportive and individualised: developmental, educational, speech-language,
    occupational, physical, and behavioural interventions, with psychiatric and
    antiseizure treatment where indicated. This entry carries the umbrella
    claim and the evidence that care is supportive only; the two most
    consistently named allied-health modalities are additionally recorded as
    their own NCIT-coded entries below, for queryability. Because management is
    phenotype- and gene-specific, the evidence base is largely extrapolated
    from broader neurodevelopmental care rather than generated for this class.
    Gene therapy, selective X-reactivation, and synapse- or circuit-directed
    interventions remain experimental and are mostly not specific to this
    class.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here, we review a few selected X-linked forms of ID that predominantly
      affect heterozygous females and the current obstacles for developing
      effective therapies for such disorders.
    explanation: >-
      Documents that effective disease-modifying therapies for X-linked
      intellectual disability remain obstructed and under development, which
      is why care is supportive. Tagged OTHER for the same reason as the
      hemizygous-expression node: the sentence states the scope of a review
      rather than reporting a clinical observation.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progress in identifying genetic and genomic alterations associated
      with XLID has not been matched with insights that improve the
      clinician's ability to form differential diagnoses, that bring into view
      the possibility of curative therapies for patients
    explanation: >-
      States explicitly that gene discovery in this class has not yet
      translated into curative therapy, grounding the supportive-care-only
      position.
- name: Speech and Language Therapy
  description: >-
    Speech-language intervention, including augmentative and alternative
    communication where speech is absent or limited, is a standard component of
    multidisciplinary care and is tied to the group rather than to any single
    causal gene. No evidence block is attached, and this is deliberate: none
    of the references cached for this entry mentions speech-language therapy
    at all - including the two the deep-research report attributed the
    modality list to, one of which is cached as full text - so there is no
    quotable source, and the DR report over-attributed the enumeration.
    Recorded as a queryable NCIT-coded entry under the supportive-care
    umbrella above, not as an evidenced claim.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
- name: Occupational Therapy
  description: >-
    Occupational therapy addressing adaptive, motor, and daily-living skills,
    likewise tied to the group rather than to a specific gene. As with speech
    and language therapy, no evidence block is attached because no cached
    reference for this entry mentions the modality; the entry exists to make
    it queryable rather than to assert a class-specific evidence base.
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  therapeutic_modality: BEHAVIORAL

differential_diagnoses:
- name: Syndromic X-linked intellectual disability (MRXS)
  description: >-
    The primary differential. MRXS entities share X-linked inheritance and
    intellectual disability but add distinguishing physical, neurological, or
    biochemical features. The boundary is explicitly regarded as blurred and
    sometimes arbitrary: 28 of the numbered non-syndromal (IDX) genes are also
    associated with XLID syndromes. Separately curated dismech entries in this
    family (Claes-Jensen, Siderius, Shashi, Turner type) are deliberately not
    modelled as subtypes here.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can be categorized into syndromic (MRXS) and nonspecific (MRX)
      forms. In MRX forms, affected patients have no distinctive clinical or
      biochemical features.
    explanation: >-
      States the criterion that separates the two classes.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-eight of the “IDX genes” in Figure 3 have also been associated
      with XLID syndromes.
    explanation: >-
      Quantifies the overlap between the two classes at the gene level,
      showing the differential is often not resolvable by gene identity alone.
- name: Fragile X syndrome
  description: >-
    The most common syndromic XLID entity and the standard exclusion before
    this diagnosis is entertained - patients in non-syndromic XLID cohorts are
    typically referred after negative FMR1 testing. Distinguished by the
    characteristic somatic features and the FMR1 CGG expansion.
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents fragile X exclusion as the standard first step before
      non-syndromic XLID is pursued.
- name: Autosomal recessive non-syndromic intellectual disability
  description: >-
    Clinically indistinguishable in an isolated male. Distinguished by
    pedigree structure (affected siblings of both sexes, parental
    consanguinity, no X-linked segregation) and ultimately by molecular
    testing.
- name: Autosomal dominant non-syndromic intellectual disability
  description: >-
    The dominant class, in which sporadic de novo heterozygous variants in
    constraint-intolerant autosomal genes predominate. In a sporadic male with
    no family history this is now a more likely explanation than a novel
    X-linked cause, a reversal of the pre-exome-era prior.

discussions:
- discussion_id: questioned_xlid_gene_assignments
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the genes historically assigned to non-syndromic X-linked
    intellectual disability are genuinely causal, given that many were
    nominated from small families before large population control sets were
    available?
  attaches_to:
  - pathophysiology#X-Linked Gene Disruption
  rationale: >-
    Gene lists for this class carry an unusual historical liability. Genes
    were nominated by linkage in individual families at a time when systematic
    sequencing of control X chromosomes was not possible, so rare
    non-disease-causing variants could not be excluded. When 106 proposed XLID
    genes were reassessed against 10,563 control X chromosomes from the NHLBI
    Exome Sequencing Project, ten were specifically questioned because
    truncating or previously published variants occurred at appreciable
    frequency in controls, and a further fifteen were flagged as requiring
    replication. The 2017 authoritative update revisited those 25 challenged
    genes: none of the five highly questionable assignments has been
    confirmed, only ATP6AP2 of the five questionable ones has been confirmed,
    and additional cases have been published for seven of the fifteen needing
    replication - leaving 17 of the 25 still unresolved. This directly affects
    curation of this entry: AGTR2 in particular is frequently cited in older
    reviews as a non-syndromic XLID gene and is among the questioned set, so
    it is deliberately not modelled as a subtype here. Any gene list for this
    class drawn from literature predating the reassessment should be treated
    as provisional.
  proposed_experiments:
  - experiment_id: reassess_questioned_xlid_genes_gnomad
    name: Re-evaluation of questioned XLID genes against contemporary population databases
    description: >-
      Repeat the control-frequency reassessment against gnomAD-scale
      population data, which offers far more X chromosomes than the NHLBI
      cohort, and combine with independent replication cohorts and functional
      assays for the genes still flagged as requiring replication.
  evidence:
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used this NHLBI cohort to systematically reassess the implication of
      106 genes proposed to be involved in monogenic forms of XLID. We
      particularly question the implication in XLID of ten of them (AGTR2,
      MAGT1, ZNF674, SRPX2, ATP6AP2, ARHGEF6, NXF5, ZCCHC12, ZNF41, and
      ZNF81), in which truncating variants or previously published mutations
      are observed at a relatively high frequency within this cohort.
    explanation: >-
      Names the specific genes whose causal role in this class is in doubt,
      including AGTR2, ZNF41, and ARHGEF6, which appear in older MRX gene
      lists.
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonetheless, the boundary between true mutations and rare
      non-disease-causing variants often remains elusive. The sequencing of a
      large number of control X chromosomes, required for avoiding
      false-positive results, was not systematically possible in the past.
    explanation: >-
      Explains the methodological reason this class accumulated
      false-positive gene assignments.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 15 assignments in need of replication, additional cases with
      MAOA, HCFC1, CCDC22, CNKSR2, KIAA2022, NAA10 and SHROOM4 sequence
      variants have now been published, leaving 17 of the 25 challenged genes
      unresolved.
    explanation: >-
      Gives the current resolution status of the challenged genes - the direct
      measure of how much of this gap remains open.
  - reference: PMID:19377476
    reference_title: "A systematic, large-scale resequencing screen of X-chromosome coding exons in mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study has, however, also highlighted issues confronting whole-genome
      sequencing screens, including the observation that loss of function of
      1% or more of X-chromosome genes is compatible with apparently normal
      existence.
    explanation: >-
      Provides the independent, orthogonal reason gene attribution is hard in
      this class: X-chromosome loss-of-function is tolerated more often than
      assumed, so a truncating variant is not self-evidently causal.
- discussion_id: syndromic_nonsyndromic_boundary_stability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is "non-syndromic" a stable property of a gene, or an artefact of limited
    phenotyping and allele sampling?
  attaches_to:
  - pathophysiology#Static Cognitive Impairment Without Structural Brain Malformation
  rationale: >-
    The class boundary moves in both directions and is explicitly described in
    the authoritative update as blurred, sometimes arbitrary, and difficult to
    defend biologically - retained mainly for historical continuity. IL1RAPL1
    was reported as causing cognitive impairment only, but later families
    showed behavioural problems and mild dysmorphism. ARX shows the converse
    within a single gene: polyalanine expansions give a non-syndromic
    phenotype across nine numbered IDX families while other alleles cause
    lissencephaly with abnormal genitalia, Partington, West, and Ohtahara
    syndromes. Twenty-eight IDX genes are also associated with XLID syndromes.
    Whether a given gene stays in this class therefore depends on how many
    patients have been phenotyped, how deeply, and which alleles they carry -
    not on a fixed biological property. This matters for the KB because
    membership of this entry is provisional for several subtypes, and it is
    the reason FGD1, ZDHHC9, and OPHN1, which are named in older non-syndromic
    gene lists but map to explicitly syndromic MONDO entities, are excluded
    here.
  evidence:
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even though the line dividing the two classes is blurred, sometimes
      arbitrary and difficult to defend from a biological standpoint, it has
      by now acquired quasi-historical value and deserves to be retained.
    explanation: >-
      The authoritative statement that the syndromic/non-syndromic distinction
      is retained for historical rather than biological reasons - the core of
      this knowledge gap.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, new advances on the study of these entities have showed
      that this classification is not always clear-cut because distinct
      variants in several of these XLID genes can result in S-XLID as well as
      in NS-XLID.
    explanation: >-
      States the allele-level mechanism behind the unstable boundary directly:
      it is the variant, not the gene, that determines which class a case
      falls into. This is the evidential basis for admitting only the
      non-syndromic arm of the ARX allelic series.
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our clinical findings better delineate the phenotypic spectrum
      associated with IL1RAPL1 mutations.
    explanation: >-
      Demonstrates phenotypic expansion of a subtype originally described as
      purely non-syndromic.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is not the case for ARX variants, which have been found in the
      disparate phenotypes of Partington syndrome, West syndrome, X-linked
      lissencephaly with abnormal genitalia, hydranencephaly with abnormal
      genitalia, Proud syndrome, Ohtahara syndrome as well as nonsyndromal
      XLID (IDX 29, 32, 33, 36, 38, 43, 54, 76, 87).
    explanation: >-
      Documents the allelic heterogeneity within ARX that places non-syndromic
      and severely syndromic phenotypes in the same gene.
- discussion_id: nonsyndromic_xlid_group_level_prevalence
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the population prevalence of non-syndromic X-linked intellectual
    disability as distinct from X-linked intellectual disability as a whole?
  attaches_to:
  - pathophysiology#X-Linked Gene Disruption
  rationale: >-
    The prevalence figures recorded on this entry - approximately 1 in 600
    males, and 5-10% of intellectual disability in males - are for X-linked
    intellectual disability overall, syndromic and non-syndromic combined. No
    robust population prevalence or incidence exists for the non-syndromic
    class alone, because it aggregates many individually rare gene-defined
    disorders whose ascertainment has historically depended on the
    availability of large multiplex pedigrees. This is a genuine measurement
    gap rather than a curation omission, and the recorded rates should not be
    presented as if MONDO:0019181 were a uniform entity with its own
    prevalence.
  proposed_experiments:
  - experiment_id: population_scale_nsxlid_prevalence
    name: Population-scale sequencing estimate of non-syndromic XLID prevalence
    description: >-
      Estimate class prevalence from unselected population-scale exome or
      genome cohorts with linked phenotype data, ascertaining on validated
      causal variants in confirmed non-syndromic XLID genes rather than on
      pedigree structure, which avoids the multiplex-family ascertainment bias
      that inflates familial forms.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked forms of mental retardation (MR) affect approximately 1 in 600
      males and are likely to be highly heterogeneous.
    explanation: >-
      The available rate is explicitly for X-linked forms as a whole, not the
      non-syndromic class, which is the substance of this gap.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As to the families with nonsyndromal XLID which have received IDX
      numbers, their total is currently 105 (Figure 3). For 67 of these
      families, the genes have been cloned, 33 have been mapped but the genes
      have not been identified and 5 have reserved IDX numbers (IDX8, 50, 69,
      83 and 86) but have not been published.
    explanation: >-
      Shows the class is enumerated by ascertained families rather than by
      population sampling, which is why no population prevalence exists for
      it.


notes: >-
  Scope decisions for this entry, recorded so they are auditable.

  Included as subtypes: IL1RAPL1 (MRX21), PAK3 (MRX30), GDI1 (MRX41), TSPAN7
  (MRX58), FTSJ1 (MRX9), ACSL4 (MRX63), AFF2 (FRAXE), and the non-syndromic
  arm of the ARX allelic series. Each maps to a MONDO term that is a
  descendant of MONDO:0019181 and each has a primary publication describing a
  non-syndromic presentation.

  Deliberately excluded: FGD1 (maps to Aarskog-Scott syndrome,
  MONDO:0010589 - classic syndromic facial/skeletal/genital dysmorphism),
  ZDHHC9 (maps to syndromic X-linked intellectual disability, Raymond type,
  MONDO:0010427 - "syndromic" appears in the MONDO label itself), and OPHN1
  (maps to X-linked intellectual disability-cerebellar hypoplasia syndrome,
  MONDO:0010337). All three appear in older non-syndromic gene lists but
  resolve to syndromic MONDO entities, and the curation issue for this entry
  specifies that syndromic X-linked entries stay separate. RLIM/MRX61 is also
  excluded: although MONDO:0010506 sits under this root, the 2018 clinical
  series (PMID:29728705) describes it as a syndromic X-linked intellectual
  disability and behaviour disorder. Re-verified for dismech#12227 and now
  settled rather than unresolved - MONDO:0010506 carries "Tonne-Kalscheuer
  syndrome" among its exact synonyms, and its OMIM xref OMIM:300978 is titled
  "TONNE-KALSCHEUER SYNDROME; TOKAS" (NCBI OMIM record read 2026-09-23), so
  the concept MONDO still files under this non-syndromic root has been renamed
  upstream to a named syndrome. It belongs in its own entry.

  AGTR2 is excluded on evidence grounds rather than scope grounds - it is one
  of the ten genes whose involvement in XLID was specifically questioned
  against 10,563 control X chromosomes, and it remains among the unresolved
  set as of the 2017 update (see the questioned_xlid_gene_assignments
  discussion).

  CORRECTION (dismech#12227). An earlier version of this note said that no
  MONDO descendant of MONDO:0019181 had been confirmed for SLC9A7, and kept
  the gene under `genetic:` for that reason. The term exists:
  MONDO:0026723, whose primary label is "intellectual developmental disorder,
  X-linked 108" and which carries "MRX108" only as a related synonym and no
  mention of SLC9A7 in its label. It is a direct subclass of MONDO:0019181,
  xrefs OMIM:301024, and carries an RO:0004003 causal-gene edge to
  hgnc:17123. A label-shaped search for the gene name therefore misses it,
  which is how the earlier claim arose. SLC9A7 is now the MRX108 subtype row.
  Searches run to re-verify: OLS4 term lookup on each of the twenty MONDO
  terms in the reconciliation checklist, with their exact and related
  synonyms and OMIM xrefs read from the same response.

  MONDO lists many descendants of MONDO:0019181, most of them numbered MRX
  entries whose causal gene is not recorded in MONDO. The subtypes modelled
  here are the well-characterised, gene-anchored members; the entry still does
  not attempt the full numbered series. For orientation, the 2017 update
  counts 105 non-syndromal families with IDX numbers, 67 of them with a cloned
  gene, against 141 XLID genes overall.

  SUBTYPE ENUMERATION PASS (dismech#12227). Twenty gene-anchored MONDO
  descendants of this entry's own term were worked through in one pass.
  Fourteen were admitted as `has_subtypes` rows, each with its MONDO term, its
  causal gene, and exact-quote evidence from the primary report: MRX1
  (IQSEC2), MRX19 (RPS6KA3), MRX50 (SYN1), MRX72 (RAB39B), MRX90 (DLG3),
  MRX96 (SYP), MRX97 (ZNF711), MRX101 (MID2), MRX103 (KLHL15), MRX104
  (FRMPD4), MRX105 (USP27X), MRX108 (SLC9A7), IDX110 (FGF13) and IDX112
  (ZMYM3). Every `genetic:` entry in this file now carries the reciprocal
  `subtype:` foreign key, and every causal gene is bound on the Convergent
  Disruption of Neuronal Function node, which previously reached only eight of
  the nine genes then curated.

  Six of the twenty were declined, each for a stated reason:

  - MONDO:0010506 (MRX61, RLIM) - now Tonne-Kalscheuer syndrome upstream; see
    the paragraph above. Belongs in its own entry.
  - MONDO:0010393 (MRX93, BRWD3) - the largest series (PMID:31714006, 17
    males) titles the entity "an X-linked syndrome of mild-moderate
    intellectual disability, macrocephaly, and obesity" and reports shared
    facial features, and MONDO itself carries "mental retardation, X-linked,
    with macrocephaly" as a related synonym. A reproducible extra feature is
    exactly what this class excludes. A stub already exists at
    stubs/Intellectual_Disability_X-linked_93.yaml; it should become a
    standalone entry.
  - MONDO:0030907 (MRX106, OGT) - the field has reclassified this entity as
    OGT-CDG, "a new syndromic form of ID, which we propose to classify as a
    novel Congenital Disorder of Glycosylation" (PMID:32080367). dismech
    already carries a large family of standalone entries for congenital
    disorders of glycosylation, which is where it belongs; a stub exists at
    stubs/Intellectual_Disability_X-linked_106.yaml.
  - MONDO:0975828 (IDX114, SRPK3) - the defining report (PMID:39073169) states
    that the eight postnatally ascertained patients shared intellectual
    disability, agenesis of the corpus callosum, abnormal eye movement and
    ataxia, and concludes for a role "in the pathogenesis of syndromic
    X-linked intellectual disability". A feature set shared across the whole
    postnatal cohort is what this class excludes, so it is declined as
    syndromic. See the MONDO disagreement note below.
  - MONDO:0957203 (IDX111, SLITRK2) - declined on evidence grounds, the same
    basis as the AGTR2 exclusion above rather than on scope. The two reports
    are a single patient (PMID:38283150) and a variant series whose own
    conclusion is hedged - "these data suggest that SLITRK2 is involved in
    X-linked neurodevelopmental disorders" (PMID:35840571) - and neither
    asserts a non-syndromic entity. Revisit if a replicating family series
    appears.
  - MONDO:0010487 (MRX99, USP9X) - the male USP9X entity. Declined here
    because PMID:31443933 defines a characteristic phenotype spanning white
    matter disturbance, thin corpus callosum, widened ventricles, hypotonia,
    joint hypermobility, visual defects and dysmorphic features, and concludes
    for "a distinctive neurodevelopmental and behavioral syndrome in male
    subjects". dismech's USP9X_Female-Restricted_Syndromic_Intellectual_Disability
    entry already treats it as a separate disease entry and carries it as a
    differential diagnosis; it should get its own entry rather than a subtype
    row here. See the MONDO disagreement note below.

  MONDO DISAGREEMENTS worth reporting upstream (not filed by this curation).
  Two terms are direct subclasses of MONDO:0019181, "non-syndromic X-linked
  intellectual disability", whose defining publications describe syndromic
  entities: MONDO:0975828 (IDX114, SRPK3) and MONDO:0010487 (MRX99, USP9X).
  MONDO:0010506 (MRX61, RLIM) is a third instance where the upstream source
  has moved - OMIM now titles it Tonne-Kalscheuer syndrome - and MONDO:0030907
  (MRX106, OGT) is a fourth, the field having reclassified it as OGT-CDG.
  In all four cases the placement follows OMIM's historical MRX numbering
  rather than the current phenotype description; the numbering is not itself
  wrong, but the parent class is.

  GENE-TERM SPOT CHECK (dismech#12227). All twenty MONDO terms in the
  reconciliation checklist were checked against an independent source before
  any was used: each term's RO:0004003 causal-gene edge, read from OLS4, was
  compared with the gene that NCBI MedGen links to the same concept
  (medgen-to-gene elink, run 2026-09-23). All twenty agreed. Each HGNC CURIE
  was separately resolved to its symbol through the HGNC REST service or the
  committed term cache in the same step it was written. No mis-bound term was
  found.

  CLINGEN CONTEXT, AND WHY IT IS NOT CITED. ClinGen gene-disease validity
  classifications were consulted for all twenty genes and are quoted in
  several subtype descriptions, but from the live ClinGen download read on
  2026-09-24, not from a CGGV cache record: `just clingen-refresh` fails on a
  drifted upstream pin (dismech#10426), and re-pinning was out of scope for
  this change. Those statements should be converted to cited CGGV evidence
  once the pin is repaired. What ClinGen holds, in brief: DLG3 (Definitive)
  and SYP (Moderate) are curated against this entry's own MONDO term;
  FRMPD4, SYN1, ZNF711 and IQSEC2 (all Definitive), USP27X (Moderate) and
  SLITRK2 (Limited) against the lumped "X-linked complex neurodevelopmental
  disorder"; RPS6KA3 against Coffin-Lowry syndrome, BRWD3 and USP9X against
  X-linked syndromic intellectual disability, RAB39B against the
  early-onset parkinsonism-intellectual disability syndrome, and OGT against
  MRX106 by the Syndromic Disorders expert panel. FGF13, KLHL15, MID2, RLIM,
  SLC9A7, SRPK3 and ZMYM3 have no ClinGen gene-disease validity record.

  ANCHOR CHECK (dismech#12227). This entry's `disease_term`, MONDO:0019181,
  was re-verified against OLS4 and is correct for what the entry models: its
  definition reads "In contrast to syndromic or specific X-linked
  intellectual deficiencies (MRXS), which also present with associated
  physical, neurological and/or psychiatric manifestations, intellectual
  deficiency is the only symptom of MRX." It is a class term, not a
  gene-defined leaf standing in for an umbrella, and all twenty concepts
  enumerated in this pass are direct subclasses of it, so they are here
  because MONDO places them here and not because of an over-broad anchor.

  This entry completes the non-syndromic intellectual-disability trio with
  Autosomal_Dominant_Non-Syndromic_Intellectual_Disability and
  Autosomal_Recessive_Non-Syndromic_Intellectual_Disability. A Grouping
  uniting the three would be a reasonable follow-up.

  No GeneReviews chapter exists for the umbrella non-syndromic X-linked
  intellectual disability class; GeneReviews coverage in this space is
  organised per syndromic gene (searched 2026-08-12), so the GeneReviews
  phenotype baseline does not apply to this entry. Re-confirmed offline for
  dismech#12227 with `just check-genereviews` against the committed Bookshelf
  index (snapshot 2026-09-10): NO_CHAPTER for both GeneReviews and
  StatPearls.

  Deep research was run with Edison (falcon). The NEC preflight returned SKIP
  because MONDO records no causal gene for this umbrella term; the manual
  fallback check was performed - the report's most-discussed genes (SLC9A7,
  IQSEC2, SLC6A8, FMR1, HCFC1) are all genuine X-linked
  intellectual-disability genes and the report is unambiguously about this
  entity, so no Named Entity Confusion was found. Every PMID and snippet used
  from the report was independently fetched and verified against the cached
  reference record before use. Most of those records are abstracts; four
  snippets from PMID:31906484 quote its body text, which is present because
  that record is cached as full text.

  No `clinical_trials:` block is recorded because the search returns nothing
  for this class. A ClinicalTrials.gov query on the condition "X-linked
  intellectual disability" (API v2, run 2026-08-12) returns trials in other
  entities - predominantly syndromic ones such as Rett syndrome, fragile X
  syndrome and the mucopolysaccharidoses, alongside unrelated hits - and no
  disease-modifying interventional trial in non-syndromic XLID, which matches
  the deep-research report's own negative finding. The two studies that do
  name this population are phenotyping and natural-history research rather
  than treatment: NCT02854956 (clinical phenotyping and characterisation of
  neural networks in X-linked mental retardation - registered as
  INTERVENTIONAL, but the intervention is the phenotyping protocol, not a
  therapy; status UNKNOWN) and NCT06500260 (CNKSR2 natural-history study,
  observational). Both were verified against the registry. Listing either as a treatment would
  misrepresent them, so the negative result is recorded here instead.

  Two DR-surfaced phenotypes are deliberately not modelled. Hypotonia
  (HP:0001252) and muscle weakness (HP:0001324) are reported in the SLC9A7
  families, but only in that paper's full text - the cached record for
  PMID:30335141 is abstract-only, so no snippet can support them and the
  claim would be unverifiable. They should be added if an abstract-level
  source is found. Autistic features and seizures, by contrast, WERE added,
  because the Basque cohort paper (PMID:31906484) quantifies both at group
  level in text that is present in the cached record.

  Two of Edison's citation keys resolve to distinct papers by the same Basque
  group, and are cited here under their separately verified identities:
  "tejada2020non-syndromicxlinked" is the dedicated NS-XLID review (Tejada &
  Ibarluzea 2020, Clin Genet, PMID:31898314), and
  "ibarluzea2020targetednextgenerationsequencing" is the 82-gene panel cohort
  study (Ibarluzea et al. 2020, Genes, PMID:31906484). The DOI-to-PMID
  converter returns no PMID for the review's DOI (10.1111/cge.13698), so it
  was recovered by title search; a first pass of this curation conflated the
  two keys, and the review is the source of the class definition, the
  not-clear-cut boundary statement, and the 141-gene count recorded here.

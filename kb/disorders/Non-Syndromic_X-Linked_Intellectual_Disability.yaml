    snippet: >-
      RNA in situ hybridization showed that TM4SF2 is highly expressed in the
      central nervous system, including the cerebral cortex and hippocampus.
    explanation: >-
      Independent confirmation that causal genes in this class are enriched in
      the same learning-and-memory circuits. Tagged IN_VITRO: an in situ
      hybridisation tissue-expression assay rather than a clinical
      observation.
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that both functional and developmental alterations in
      the neuron may account for the severe impairment of learning abilities
      as a consequence of mutations in GDI1, emphasizing its critical role in
      development of human intellectual and learning abilities.
    explanation: >-
      Links the vesicle-recycling lesion to impaired learning through both
      functional and developmental neuronal alterations.
  downstream:
  - target: Static Cognitive Impairment Without Structural Brain Malformation
    causal_link_type: DIRECT
    description: >-
      Degraded plasticity in an anatomically normal brain manifests as
      non-progressive intellectual disability.

- name: Static Cognitive Impairment Without Structural Brain Malformation
  biological_scale: ORGANISM
  description: >-
    The endpoint of the class: non-progressive impairment of intellectual
    functioning and adaptive behaviour in a brain that is structurally normal
    on imaging and free of any consistently reproducible dysmorphic,
    metabolic, or systemic sign. This is a mis-tuned rather than a mis-built
    or damaged circuit, which is why brain MRI is characteristically
    unremarkable and why - in the absence of any distinguishing feature -
    molecular testing rather than clinical recognition is the only route to a
    specific diagnosis. The class is conventionally described as static and
    non-progressive, with developmental regression arguing against the
    diagnosis; note that none of the evidence cited on this node speaks to
    temporal course, so the staticity claim rests on clinical convention
    rather than on a source quoted here.

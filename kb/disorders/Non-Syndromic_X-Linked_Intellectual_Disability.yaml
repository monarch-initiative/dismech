inheritance:
- name: X-linked
  description: >-
    Causal variants lie on the X chromosome. Hemizygous males carry a single
    copy of the mutant allele with no second copy to compensate and are fully
    affected; heterozygous females are usually unaffected or only mildly
    affected, because random X-chromosome inactivation makes them mosaic for
    expression of the mutant allele. In several subtypes carrier females show
    completely skewed X-inactivation that silences the mutant X and confers
    additional protection. There is no male-to-male transmission. Large
    multiplex pedigrees showing this segregation pattern were the substrate
    for the linkage studies that defined the numbered MRX/IDX series, and the
    relative ease of ascertaining such families is why X-linked intellectual
    disability was delineated far ahead of its autosomal counterparts.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is because most genes on the X chromosome are subject to random X
      chromosome inactivation (XCI) during early embryonic development, which
      results in a mosaic pattern of gene expression for a given X-linked
      mutant allele.
    explanation: >-
      Establishes the mosaic-expression mechanism that makes heterozygous
      females variably and usually mildly affected relative to hemizygous
      males.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All carrier females with either point mutations or genomic deletions in
      FACL4 showed a completely skewed X-inactivation, suggesting that the
      gene influences survival advantage.
    explanation: >-
      Documents the completely skewed X-inactivation that spares carrier
      females, using the ACSL4/FACL4 subtype as the worked example.
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progress in delineating XLID has far outpaced the efforts to understand
      the genetic basis for autosomal intellectual disability. In large
      measure, this has been because of the relative ease of identifying
      families with XLID and finding the responsible mutations
    explanation: >-
      Explains why this class was characterised ahead of its autosomal
      counterparts: X-linked segregation makes multiplex families
      straightforward to ascertain.

prevalence:
- population: Males, worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 166.7
  notes: >-
    Estimate for X-linked intellectual disability as a whole (syndromic plus
    non-syndromic), given in the source as approximately 1 in 600 males. The
    non-syndromic class is a subset of this figure; no robust population
    prevalence exists for the non-syndromic class alone, because it aggregates
    many individually rare gene-defined disorders.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked forms of mental retardation (MR) affect approximately 1 in 600
      males and are likely to be highly heterogeneous.
    explanation: >-
      Provides the population rate for X-linked intellectual disability as a
      whole. Marked PARTIAL because the figure covers syndromic and
      non-syndromic forms together, not the non-syndromic class this entry
      describes.
- population: Males with intellectual disability
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    X-linked intellectual disability (syndromic and non-syndromic combined)
    accounts for 5-10% of intellectual disability in males, and is the
    classical explanation for the male excess observed among people with
    intellectual disability. `measure_type: UNKNOWN` is deliberate: this is a
    case fraction within an already-affected population rather than a
    population rate, and no source defines a time interval, so none of the
    prevalence/incidence measure types applies.
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-Linked intellectual disability (XLID) accounts for 5%-10% of
      intellectual disability in males.
    explanation: >-
      Quantifies the fraction of male intellectual disability attributable to
      X-linked causes.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked intellectual disability (XLID) is known to contribute up to 10%
      of intellectual disability (ID) in males and could explain the increased
      ratio of affected males observed in patients with ID.
    explanation: >-
      Independent confirmation of the 10% upper bound and explicit statement
      that it explains the male excess.

has_subtypes:
- name: MRX21
  display_name: Intellectual disability, X-linked 21 (IL1RAPL1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 21
    term:
      id: MONDO:0010256
      label: intellectual disability, X-linked 21
  genes:
  - preferred_term: IL1RAPL1
    term:
      id: hgnc:5996
      label: IL1RAPL1
  description: >-
    Deletions and loss-of-function point variants in IL1RAPL1 at Xp22.1-21.3,
    encoding an interleukin-1 receptor accessory protein family member highly
    expressed in postnatal hippocampus. The founding report explicitly describes
    patients with cognitive impairment only, one of the clearest original
    descriptions in the class - though see the caveat below on later
    families. IL1RAPL1 is understood to act in excitatory synapse
    formation, though the cited primary report establishes only its
    hippocampal expression and infers a role in memory and learning. Later series identified
    behavioural problems and mild dysmorphism in some families, illustrating
    the instability of the non-syndromic label.
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-overlapping deletions and a nonsense mutation in this gene were
      identified in patients with cognitive impairment only.
    explanation: >-
      Establishes the IL1RAPL1 subtype and, critically, its purely
      non-syndromic presentation - cognitive impairment as the sole feature.
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its high level of expression in post-natal brain structures involved in
      the hippocampal memory system suggests a specialized role for this new
      gene in the physiological processes underlying memory and learning
      abilities.
    explanation: >-
      Links the subtype to hippocampal learning circuitry, the anatomical
      substrate shared across the class. Tagged MODEL_ORGANISM: the expression
      analysis is animal tissue work (the paper's MeSH terms include Mice),
      and the role in memory and learning is the authors' inference from that
      expression pattern rather than a demonstrated function.
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified an additional two families with deletions of a
      portion of the gene that give rise to cognitive impairment, as well as
      some behavioral problems and mild dysmorphism.
    explanation: >-
      Documents phenotypic expansion beyond pure cognitive impairment,
      supporting the subtype while qualifying the strictness of its
      non-syndromic classification.
- name: MRX30
  display_name: Intellectual disability, X-linked 30 (PAK3)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 30
    term:
      id: MONDO:0010361
      label: intellectual disability, X-linked 30
  genes:
  - preferred_term: PAK3
    term:
      id: hgnc:8592
      label: PAK3
  description: >-
    Truncating variants in PAK3 (p21-activated kinase) at Xq22, identified in
    the multiplex MRX30 pedigree. PAK3 couples Rho family GTPases to actin
    cytoskeletal reorganisation in postmitotic cortical and hippocampal
    neurons, and this subtype anchors the Rho GTPase theme that recurs across
    the class. MRI was normal in affected individuals - the imaging correlate
    of a functional rather than structural lesion.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals in a multiplex pedigree with MRX (MRX30),
      previously mapped to Xq22, show a point mutation in the PAK3
      (p21-activated kinase) gene, which encodes a serine-threonine kinase.
    explanation: >-
      Establishes the PAK3 lesion defining the MRX30 subtype.
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI analysis showed no gross defects in brain development.
    explanation: >-
      Documents the absence of structural brain malformation that
      distinguishes non-syndromic from malformative X-linked intellectual
      disability.
- name: MRX41
  display_name: Intellectual disability, X-linked 41 (GDI1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 41
    term:
      id: MONDO:0010451
      label: intellectual disability, X-linked 41
  genes:
  - preferred_term: GDI1
    term:
      id: hgnc:4226
      label: GDI1
  description: >-
    Missense and null variants in GDI1, encoding alpha-GDI (Rab GDP
    dissociation inhibitor), which recycles Rab GTPases for synaptic vesicle
    traffic; the L92P allele reduces RAB3A binding and recycling. One of the
    purest non-syndromic exemplars in the class - a large German multiplex
    family had neither abnormal body measurements nor any other significant
    clinical problem, and the authors concluded that a clinical diagnosis of
    GDI1-associated disease is impossible.
  evidence:
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have found mutations in the GDI1 gene (which encodes uGDI) in two
      families affected with X-linked non-specific mental retardation. One of
      the mutations caused a non-conservative substitution (L92P) which
      reduced binding and recycling of RAB3A, the second was a null mutation.
    explanation: >-
      Establishes the GDI1 subtype and its Rab-recycling mechanism.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected male family members had nonsyndromic intellectual
      disability, that is, they had neither abnormal body measurements nor any
      other significant clinical problems
    explanation: >-
      Confirms the strictly non-syndromic presentation of this subtype in an
      independent multiplex family.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present family supports the lack of additional phenotypic features
      in patients with GDI1 mutations, rendering a clinical diagnosis of
      GDI1-associated XLID impossible.
    explanation: >-
      States the diagnostic consequence that defines the whole class - with no
      distinguishing features, molecular testing rather than clinical
      recognition is the only route to diagnosis.
- name: MRX58
  display_name: Intellectual disability, X-linked 58 (TSPAN7/TM4SF2)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 58
    term:
      id: MONDO:0010266
      label: intellectual disability, X-linked 58
  genes:
  - preferred_term: TSPAN7
    term:
      id: hgnc:11854
      label: TSPAN7
  description: >-
    TSPAN7 (formerly TM4SF2) at Xp11.4, first implicated through an X;2
    balanced translocation that disrupted the gene, then confirmed by point
    variants in MRX families. Encodes a tetraspanin that complexes with
    beta-1 integrins and is implicated in the control of neurite outgrowth,
    contributing to the synapse-formation theme.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that the gene TM4SF2 at Xp11.4 is inactivated by the X
      breakpoint of an X;2 balanced translocation in a patient with MR.
      Further investigation led to identification of TM4SF2 mutations in 2 of
      33 other MRX families.
    explanation: >-
      Establishes the TSPAN7/TM4SF2 subtype through two independent lines of
      genetic evidence.
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TM4SF2 encodes a member of the tetraspanin family of proteins, which are
      known to contribute in molecular complexes including beta-1 integrins.
      We speculate that through this interaction, TM4SF2 might have a role in
      the control of neurite outgrowth.
    explanation: >-
      Assigns the subtype to the neurite-outgrowth/synapse-formation theme;
      marked PARTIAL because the source explicitly frames the mechanism as
      speculation.
- name: MRX9
  display_name: Intellectual disability, X-linked 9 (FTSJ1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 9
    term:
      id: MONDO:0010660
      label: intellectual disability, X-linked 9
  genes:
  - preferred_term: FTSJ1
    term:
      id: hgnc:13254
      label: FTSJ1
  description: >-
    Loss-of-function variants in FTSJ1, the human TRM7 homolog, which
    2'-O-methylates positions C32 and G34 of the tRNA anticodon loop. Patient
    cell lines almost completely lack Cm32 and Gm34 on tRNA-Phe. Places
    translational fidelity - rather than synaptic structure - in the
    mechanistic theme set for this class, and provides a directly measurable
    molecular readout, unusual for non-syndromic intellectual disability.
  evidence:
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in human FTSJ1, the likely TRM7 homolog, cause nonsyndromic
      X-linked intellectual disability (NSXLID), but the role of FTSJ1 in tRNA
      modification is unknown.
    explanation: >-
      Establishes FTSJ1 as a non-syndromic X-linked intellectual disability
      gene.
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we report that tRNA(Phe) from two genetically independent cell lines of
      NSXLID patients with loss-of-function FTSJ1 mutations nearly completely
      lacks Cm32 and Gm34 , and has reduced peroxywybutosine (o2yW37 )
    explanation: >-
      Provides the direct biochemical consequence of FTSJ1 loss in patient
      cells, grounding the tRNA-modification mechanism.
- name: MRX63
  display_name: Intellectual disability, X-linked 63 (ACSL4/FACL4)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 63
    term:
      id: MONDO:0010313
      label: intellectual disability, X-linked 63
  genes:
  - preferred_term: ACSL4
    term:
      id: hgnc:3571
      label: ACSL4
  description: >-
    Null variants in ACSL4 (FACL4), encoding fatty acid-CoA ligase 4, mapped
    to Xq22.3 by comparing deletion extents between contiguous-gene ATS-MR
    patients and Alport-only patients. The first gene to link non-syndromic
    intellectual disability to fatty-acid metabolism, and the subtype in which
    complete X-inactivation skewing in carrier females is best documented.
  evidence:
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the identification of two point mutations, one missense
      and one splice-site change, in the gene FACL4 in two families with
      nonspecific mental retardation.
    explanation: >-
      Establishes the ACSL4/FACL4 subtype in non-specific (non-syndromic)
      X-linked intellectual disability.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FACL4 is the first gene shown to be involved in nonspecific mental
      retardation and fatty-acid metabolism.
    explanation: >-
      Places lipid metabolism in the mechanistic theme set for this class.
- name: FRAXE
  display_name: FRAXE intellectual disability (AFF2/FMR2)
  classification: molecular
  subtype_term:
    preferred_term: FRAXE intellectual disability
    term:
      id: MONDO:0010659
      label: FRAXE intellectual disability
  genes:
  - preferred_term: AFF2
    term:
      id: hgnc:3776
      label: AFF2
  description: >-
    CCG repeat expansion and consequent methylation-mediated silencing of AFF2
    (FMR2) at the FRAXE folate-sensitive fragile site in Xq28. Mechanistically
    the repeat-expansion member of the class and the closest non-syndromic
    counterpart to fragile X syndrome, from which it is distinguished by a
    milder cognitive phenotype without the fragile X somatic features. AFF2 is
    among the genes found in non-syndromal families that were never assigned
    an IDX number.
  evidence:
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild mental retardation without consistent physical findings has been
      found associated with expanded CCG repeats at FRAXE.
    explanation: >-
      Establishes both defining properties of this subtype in one statement:
      the repeat-expansion mechanism, and the non-syndromic phenotype
      (mild impairment WITHOUT consistent physical findings), which is what
      qualifies it for this entry.
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a large gene (FMR2) transcribed distally from the CpG
      island at FRAXE, and down-regulated by repeat expansion and methylation.
    explanation: >-
      Provides the methylation-mediated silencing mechanism asserted in this
      subtype's description, which the sequence-variant evidence cited
      elsewhere does not cover.
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FRAXA expansion results in fragile X syndrome due to down regulation of
      expression of the FMR1 gene
    explanation: >-
      Grounds the contrast with fragile X syndrome drawn in this subtype's
      description - the two are parallel folate-sensitive fragile-site
      expansions with different genes and different phenotypic severity.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence variants in 11 genes (KLF8, AFF2, SLC6A8, NDUFA1, ALG13, SRPX2,
      ATRX, NLGN3, FGDY, CDKL5, and NLGN4) have been found in families with
      IDX but in whom IDX numbers were never assigned.
    explanation: >-
      Places AFF2 among the genes causing non-syndromal (IDX) X-linked
      intellectual disability; marked PARTIAL because this passage concerns
      sequence variants, a different mutational class from the repeat
      expansion that defines the FRAXE subtype.
- name: ARX-related
  display_name: Intellectual disability, X-linked, with or without seizures (ARX)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked, with or without seizures, ARX-related
    term:
      id: MONDO:0010317
      label: intellectual disability, X-linked, with or without seizures, ARX-related
  genes:
  - preferred_term: ARX
    term:
      id: hgnc:18060
      label: ARX
  description: >-
    The non-syndromic end of the ARX allelic series. ARX encodes an
    Aristaless-related homeobox transcription factor expressed specifically in
    telencephalon and ventral thalamus. Polyalanine-tract expansions and
    certain missense alleles produce intellectual disability with or without
    seizures and no detectable brain malformation, and account for nine
    separately numbered nonsyndromal IDX families. Other alleles in the same
    gene cause distinct syndromic entities (X-linked lissencephaly with
    abnormal genitalia, Partington syndrome, West and Ohtahara syndromes,
    Proud syndrome) that are deliberately NOT modelled here. This subtype is
    therefore the worked example of why the syndromic/non-syndromic boundary
    in this class is a property of the allele rather than of the gene.
  evidence:
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited and de novo ARX mutations, including missense mutations and in
      frame duplications/insertions leading to expansions of polyalanine
      tracts in ARX, were found in nine familial and one sporadic case of MR.
    explanation: >-
      Establishes the ARX allelic spectrum, including the polyalanine
      expansions associated with the milder non-syndromic end of the series.
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of detectable brain malformations in patients suggests that
      ARX may have an essential role, in mature neurons, required for the
      development of cognitive abilities.
    explanation: >-
      Confirms the non-syndromic, non-malformative presentation of these ARX
      alleles, distinguishing them from the lissencephaly-causing alleles in
      the same gene.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is not the case for ARX variants, which have been found in the
      disparate phenotypes of Partington syndrome, West syndrome, X-linked
      lissencephaly with abnormal genitalia, hydranencephaly with abnormal
      genitalia, Proud syndrome, Ohtahara syndrome as well as nonsyndromal
      XLID (IDX 29, 32, 33, 36, 38, 43, 54, 76, 87).
    explanation: >-
      Documents that ARX spans both syndromic entities and nine separately
      numbered nonsyndromal IDX families, which is the basis for modelling
      only the nonsyndromal arm here.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this classification is not always clear-cut because distinct variants in
      several of these XLID genes can result in S-XLID as well as in NS-XLID
    explanation: >-
      Provides the general principle that licenses admitting one allelic arm
      of a gene to this class while leaving its syndromic alleles to separate
      entities - the reasoning applied to ARX here.

- name: MRX1
  display_name: Intellectual disability, X-linked 1 (IQSEC2)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 1
    term:
      id: MONDO:0010656
      label: intellectual disability, X-linked 1
  genes:
  - preferred_term: IQSEC2
    term:
      id: hgnc:29059
      label: IQSEC2
  description: >-
    The founding entity of the whole numbered series: MRX1 is the family
    mapped in 1988 that gave the series its first number, and its causal gene
    was not identified until X-chromosome exome resequencing reached it in
    2010. IQSEC2 encodes a guanine nucleotide exchange factor for the
    ADP-ribosylation factor family of small GTPases, placing this subtype in
    the same small-GTPase-signalling theme as PAK3 and RAB39B rather than in a
    pathway of its own. Three further X-linked intellectual disability
    families carried IQSEC2 variants in the same study. Two cautions apply to
    this row. First, MONDO merges the former MRX78 into this term and carries
    "IQSEC2-related syndromic intellectual disability" among its exact
    synonyms, so the label under which a given patient is reported varies.
    Second, the allelic spectrum reaches well beyond pure intellectual
    disability - the ClinGen Intellectual Disability and Autism Gene Curation
    Expert Panel curates IQSEC2 against "X-linked complex neurodevelopmental
    disorder" rather than against this class. This row records the
    non-syndromic arm that OMIM and MONDO still number as XLID1, exactly as
    the ARX row records one arm of a wider allelic series.
  evidence:
  - reference: PMID:20473311
    reference_title: Mutations in the guanine nucleotide exchange factor gene IQSEC2 cause nonsyndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first family identified as having a nonsyndromic intellectual
      disability was mapped in 1988. Here we show that a mutation of IQSEC2,
      encoding a guanine nucleotide exchange factor for the ADP-ribosylation
      factor family of small GTPases, caused this disorder.
    explanation: >-
      Establishes IQSEC2 as the causal gene of the index MRX1 family and
      states the non-syndromic presentation and the GEF function on which this
      row rests.
  - reference: PMID:20473311
    reference_title: Mutations in the guanine nucleotide exchange factor gene IQSEC2 cause nonsyndromic intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to MRX1, IQSEC2 mutations were identified in three other
      families with X-linked intellectual disability.
    explanation: >-
      Provides the independent families beyond the index pedigree, which is
      what distinguishes a gene assignment from a single-family observation in
      this class.
- name: MRX19
  display_name: Intellectual disability, X-linked 19 (RPS6KA3)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 19
    term:
      id: MONDO:0010447
      label: intellectual disability, X-linked 19
  genes:
  - preferred_term: RPS6KA3
    term:
      id: hgnc:10432
      label: RPS6KA3
  description: >-
    The attenuated, non-syndromic arm of the RPS6KA3 (RSK2) allelic series,
    whose severe arm is Coffin-Lowry syndrome - curated separately in dismech
    as Coffin-Lowry_Syndrome (MONDO:0010561). RSK2 is a serine-threonine
    kinase, and the variants reported in this arm are single-amino-acid
    deletions and a missense change in the protein's proximal domain, similar
    in kind to Coffin-Lowry alleles; two of the three reported families had
    been given a non-syndromic clinical diagnosis, and in the third
    Coffin-Lowry had been suspected but the features were atypical and the
    intellectual disability much milder than expected. The clinically
    important consequence, and the reason the row is worth modelling
    separately, is diagnostic: the reporting authors conclude that strict
    reliance on classical clinical criteria for mutation testing may result in
    a missed diagnosis. ClinGen's Intellectual Disability and Autism Gene
    Curation Expert Panel curates RPS6KA3 only against Coffin-Lowry syndrome,
    so this arm has no separate expert-panel classification.
  evidence:
  - reference: PMID:17100996
    reference_title: Mutations in the RSK2(RPS6KA3) gene cause Coffin-Lowry syndrome and nonsyndromic X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three families with X-linked mental retardation, two with a
      deletion of a single amino acid and one with a missense mutation in the
      proximal domain of the RSK2(RPS6KA3) (ribosomal protein S6 kinase, 90
      kDa, polypeptide 3) protein similar to mutations found in Coffin-Lowry
      syndrome (CLS).
    explanation: >-
      Establishes the allele class of this arm and its relation to the
      Coffin-Lowry allele spectrum in the same gene.
  - reference: PMID:17100996
    reference_title: Mutations in the RSK2(RPS6KA3) gene cause Coffin-Lowry syndrome and nonsyndromic X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two families, the clinical diagnosis had been nonsyndromic X-linked
      mental retardation.
    explanation: >-
      States the non-syndromic clinical assignment that places this arm in
      this class rather than under Coffin-Lowry syndrome.
- name: MRX50
  display_name: Intellectual disability, X-linked 50 (SYN1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 50
    term:
      id: MONDO:0010251
      label: intellectual disability, X-linked 50
  genes:
  - preferred_term: SYN1
    term:
      id: hgnc:11494
      label: SYN1
  description: >-
    A missense variant in SYN1, encoding the presynaptic phosphoprotein
    synapsin I, segregating in the MRX50 family, in which intellectual
    disability is the sole clinical manifestation in every affected member -
    which makes this one of the strictest non-syndromic rows in the entry.
    SYN1 regulates neurotransmitter release and neuronal development, so the
    subtype belongs to the synaptic-vesicle theme alongside GDI1 and TSPAN7.
    It is a distinct allelic entity from the SYN1 epilepsy/autism disorder
    (MONDO:0010339), which dismech curates separately as SYN1-Related_Disorder:
    the authors of this report make exactly that point, noting that distinct
    SYN1 mutations may lead to distinct brain pathologies. ClinGen's
    Intellectual Disability and Autism Gene Curation Expert Panel lumps SYN1
    under "X-linked complex neurodevelopmental disorder" and does not curate
    this arm separately.
  evidence:
  - reference: PMID:28973667
    reference_title: "A novel SYN1 missense mutation in non-syndromic X-linked intellectual disability affects synaptic vesicle life cycle, clustering and mobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a missense mutation (c.236 C > G; p.S79W) in the SYN1 gene
      coding for synapsin I in the MRX50 family, affected by non-syndromic
      X-linked intellectual disability.
    explanation: >-
      Ties the causal gene and allele directly to the numbered MRX50 family
      and to the non-syndromic designation this row carries.
  - reference: PMID:28973667
    reference_title: "A novel SYN1 missense mutation in non-syndromic X-linked intellectual disability affects synaptic vesicle life cycle, clustering and mobility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The S79W mutation segregates with the disease in the MRX50 family and
      all affected members display intellectual disability as sole clinical
      manifestation.
    explanation: >-
      The explicit statement of sole-feature presentation, which is the
      defining criterion for membership of this class.
- name: MRX72
  display_name: Intellectual disability, X-linked 72 (RAB39B)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 72
    term:
      id: MONDO:0010289
      label: intellectual disability, X-linked 72
  genes:
  - preferred_term: RAB39B
    term:
      id: hgnc:16499
      label: RAB39B
  description: >-
    Null alleles of RAB39B, a neuronal-specific small GTPase of the Golgi
    compartment, identified in two male patients - one of them in the MRX72
    family, where a 5' splice-site change abolished normal splicing. Its
    downregulation alters neurite growth cone number and morphology and
    reduces presynaptic boutons, placing the subtype in the vesicular
    trafficking theme. Intellectual disability was accompanied by autism
    spectrum disorder, epileptic seizures and macrocephaly in some, not all,
    affected family members, which is the variable-comorbidity pattern this
    class tolerates rather than a reproducible syndromic signature. The row
    carries a live caveat: the ClinGen Intellectual Disability and Autism
    Gene Curation Expert Panel curates RAB39B as Definitive against an
    early-onset parkinsonism-intellectual disability syndrome
    (MONDO:0010709), a separate MONDO term with no dismech entry, rather than
    against this one. Parkinsonism is not reported in the founding MRX72
    publication, so the two entities are separated here by phenotype and age
    of onset rather than by allele, and this row should not be read as
    covering the parkinsonism entity.
  evidence:
  - reference: PMID:20159109
    reference_title: "Mutations in the small GTPase gene RAB39B are responsible for X-linked mental retardation associated with autism, epilepsy, and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second mutation, in the MRX72 family, altered the 5' splice site
      (c.215+1G > A) and normal splicing.
    explanation: >-
      Ties RAB39B to the numbered MRX72 family that this subtype term denotes,
      and states the allele class.
  - reference: PMID:20159109
    reference_title: "Mutations in the small GTPase gene RAB39B are responsible for X-linked mental retardation associated with autism, epilepsy, and macrocephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations segregate with the disease in the families, and in some family
      members intellectual disabilities were associated with autism spectrum
      disorder, epileptic seizures, and macrocephaly.
    explanation: >-
      Documents the associated features and, critically for the scope call,
      that they occur in only some family members rather than reproducibly.
  - reference: PMID:20159109
    reference_title: "Mutations in the small GTPase gene RAB39B are responsible for X-linked mental retardation associated with autism, epilepsy, and macrocephaly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Its downregulation leads to an alteration in the number and morphology
      of neurite growth cones and a significant reduction in presynaptic
      buttons, suggesting that RAB39B is required for synapse formation and
      maintenance.
    explanation: >-
      Supplies the cellular mechanism linking this gene to the entry's shared
      synaptic endpoint.
- name: MRX90
  display_name: Intellectual disability, X-linked 90 (DLG3)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 90
    term:
      id: MONDO:0010452
      label: intellectual disability, X-linked 90
  genes:
  - preferred_term: DLG3
    term:
      id: hgnc:2902
      label: DLG3
  description: >-
    Truncating variants in DLG3, which encodes synapse-associated protein 102
    (SAP102), found in 4 of 329 families screened for moderate to severe
    X-linked intellectual disability - among the higher per-gene yields in the
    class. SAP102 is a membrane-associated guanylate kinase localised to the
    postsynaptic density of excitatory synapses, whose PDZ domains bind the
    NR2 subunits of the NMDA receptor. Every reported allele truncates within
    or before the third PDZ domain, so the proposed mechanism is loss of NMDA
    receptor targeting and downstream signalling, which is the most direct
    molecular route to the impaired synaptic plasticity this entry models as
    the shared endpoint. Together with SYP this is one of only two genes in
    the whole checklist that the ClinGen Intellectual Disability and Autism
    Gene Curation Expert Panel curates against this entry's own MONDO term
    rather than against a broader neurodevelopmental anchor, and it holds the
    Definitive classification.
  evidence:
  - reference: PMID:15185169
    reference_title: Mutations in the DLG3 gene cause nonsyndromic X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified truncating mutations in the human DLG3
      (neuroendocrine dlg) gene in 4 of 329 families with moderate to severe
      X-linked mental retardation.
    explanation: >-
      Establishes the gene assignment and gives the per-cohort yield quoted in
      this row's description.
  - reference: PMID:15185169
    reference_title: Mutations in the DLG3 gene cause nonsyndromic X-linked mental retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations identified in this study all introduce premature stop
      codons within or before the third PDZ domain, and it is likely that this
      impairs the ability of SAP102 to interact with the NMDA receptor and/or
      other proteins involved in downstream NMDA receptor signaling pathways.
    explanation: >-
      Supplies the allele class and the proposed loss-of-function mechanism at
      the NMDA receptor, stated by the authors as a likelihood rather than a
      demonstration.
- name: MRX96
  display_name: Intellectual disability, X-linked 96 (SYP)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 96
    term:
      id: MONDO:0010429
      label: intellectual disability, X-linked 96
  genes:
  - preferred_term: SYP
    term:
      id: hgnc:11506
      label: SYP
  description: >-
    SYP, encoding synaptophysin, was one of nine genes implicated in X-linked
    intellectual disability by the systematic resequencing of X-chromosome
    coding exons in 208 families. Synaptophysin is an integral
    synaptic vesicle protein accounting for roughly a tenth of total synaptic
    vesicle protein cargo; four separate SYP variants were found in affected
    families. Functional follow-up in synaptophysin-knockout mouse neurons
    showed that the patient variants fail to support efficient retrieval of
    synaptobrevin II, giving this subtype a defined lesion in the synaptic
    vesicle cycle. The ClinGen Intellectual Disability and Autism Gene
    Curation Expert Panel curates SYP against this entry's own MONDO term and
    classifies the relationship as Moderate, so the gene assignment is
    supported but not yet definitive.
  evidence:
  - reference: PMID:19377476
    reference_title: "A systematic, large-scale resequencing screen of X-chromosome coding exons in mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The screen has discovered nine genes implicated in XLMR, including SYP,
      ZNF711 and CASK reported here, confirming the power of this strategy.
    explanation: >-
      The primary gene-discovery statement for both this row and the ZNF711
      row, from the screen that reported them.
  - reference: PMID:23966691
    reference_title: X-linked intellectual disability-associated mutations in synaptophysin disrupt synaptobrevin II retrieval.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Synaptophysin has been implicated in X-linked intellectual disability,
      with a recent study identifying four separate synaptophysin gene
      mutations in families affected by the disorder.
    explanation: >-
      Independent restatement of the human genetic finding, giving the number
      of variant families. Graded HUMAN_CLINICAL for the evidence the sentence
      describes with quote_role BACKGROUND because the citing paper is a
      mouse-neuron functional study restating somebody else's human genetics
      in its introduction.
  - reference: PMID:23966691
    reference_title: X-linked intellectual disability-associated mutations in synaptophysin disrupt synaptobrevin II retrieval.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two distinct truncating mutants were mislocalized throughout the axon
      and phenocopied the arrest of sybII retrieval in synaptophysin knock-out
      cultures.
    explanation: >-
      Functional consequence of the patient alleles in cultured neurons,
      supplying the mechanism this row attributes to the subtype.
- name: MRX97
  display_name: Intellectual disability, X-linked 97 (ZNF711)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 97
    term:
      id: MONDO:0010430
      label: intellectual disability, X-linked 97
  genes:
  - preferred_term: ZNF711
    term:
      id: hgnc:13128
      label: ZNF711
  description: >-
    ZNF711 was implicated by the same 208-family X-chromosome resequencing
    screen that reported SYP, and was subsequently confirmed in two large
    four-generation pedigrees with eleven affected males, bringing the total
    to four families. The consistent picture is mild to moderate intellectual
    disability with poor speech; autistic features and mild facial
    dysmorphisms occur in some patients but not reproducibly, which is why the
    reporting authors themselves conclude the phenotype is non-syndromic. Note
    that this subtype is distinct from contiguous-gene deletions at Xq21 that
    remove ZNF711 along with neighbouring genes, which dismech models
    elsewhere as Choroideremia-Deafness-Obesity_Syndrome.
  evidence:
  - reference: PMID:27993705
    reference_title: Mutations in two large pedigrees highlight the role of ZNF711 in X-linked intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present two large four-generation families with a total of 11
      males affected with ID caused by mutations in ZNF711, thereby expanding
      the total number of families with ID and a ZNF711 mutation to four.
    explanation: >-
      Gives the replication that carries this gene assignment beyond its
      single discovery screen, and the family count quoted in the description.
  - reference: PMID:27993705
    reference_title: Mutations in two large pedigrees highlight the role of ZNF711 in X-linked intellectual disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with mutations in ZNF711 all present with mild to moderate ID
      and poor speech accompanied by additional features in some patients,
      including autistic features and mild facial dysmorphisms, suggesting
      that ZNF711 mutations cause non-syndromic ID.
    explanation: >-
      The authors' own non-syndromic assignment, together with the qualifier
      that additional features appear only in some patients - the exact
      distinction this class turns on.
- name: MRX101
  display_name: Intellectual disability, X-linked 101 (MID2)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 101
    term:
      id: MONDO:0010489
      label: intellectual disability, X-linked 101
  genes:
  - preferred_term: MID2
    term:
      id: hgnc:7096
      label: MID2
  description: >-
    A missense variant in MID2, encoding an E3 ubiquitin ligase, reported as
    the likely cause of X-linked intellectual disability in one large Indian
    kindred, where it was present in all affected males and obligate carriers
    and absent from unaffected males and from 200 population controls. The
    variant abolishes the function of the protein's COS domain, and the mutant
    protein accumulates in the cytoplasm instead of binding the cytoskeleton.
    This row rests on a single large pedigree plus one further variant found
    by screening 480 unrelated individuals, and MID2 has no ClinGen
    gene-disease validity curation, so the assignment is thinner than most in
    this entry and is recorded with that caveat. It is the ubiquitin-pathway
    theme's entry point in the class, and the authors emphasise that the MID2
    phenotype differs from that reported for its paralogue MID1.
  evidence:
  - reference: PMID:24115387
    reference_title: Targeted deep resequencing identifies MID2 mutation for X-linked intellectual disability with varied disease severity in a large kindred from India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a novel missense mutation (c.1040G>A, p.Arg347Gln) in MID2,
      which encodes ubiquitin ligase E3, as the likely cause of X-linked
      mental retardation in a large kindred.
    explanation: >-
      The gene assignment, stated by the authors themselves as a likelihood
      rather than a certainty - the hedge this row preserves.
  - reference: PMID:24115387
    reference_title: Targeted deep resequencing identifies MID2 mutation for X-linked intellectual disability with varied disease severity in a large kindred from India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was observed in all affected and obligate carriers but not
      in any unaffected males of the family or in population controls (n =
      200).
    explanation: >-
      The segregation and control data that constitute the evidence base for
      this subtype, and the control count quoted in the description.
- name: MRX103
  display_name: Intellectual disability, X-linked 103 (KLHL15)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 103
    term:
      id: MONDO:0010508
      label: intellectual disability, X-linked 103
  genes:
  - preferred_term: KLHL15
    term:
      id: hgnc:29347
      label: KLHL15
  description: >-
    KLHL15 was one of seven novel and validated X-linked intellectual
    disability genes identified by X-exome sequencing of 405 unresolved
    families - the study that also delivered FRMPD4 and USP27X in this entry.
    A protein-truncating variant was found in a large family, with further
    support from an unrelated family carrying a partial KLHL15 deletion.
    KLHL15 is a kelch-like protein that acts as a substrate adaptor for
    Cul3-based E3 ubiquitin ligases, targeting a brain-specific regulatory
    subunit of protein phosphatase 2A for proteasomal degradation, so like
    MID2 and USP27X it belongs to the ubiquitin-proteasome theme. The
    phenotype is not uniformly pure: the same report notes a KLHL15 partial
    deletion described in a proband with severe intellectual disability,
    epilepsy and cortical developmental anomalies, and KLHL15 has no ClinGen
    gene-disease validity curation.
  evidence:
  - reference: PMID:25644381
    reference_title: X-exome sequencing of 405 unresolved families identifies seven novel intellectual disability genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 19 families, we detected likely causative protein truncating and
      missense variants in 7 novel and validated XLID genes (CLCN4, CNKSR2,
      FRMPD4, KLHL15, LAS1L, RLIM and USP27X)
    explanation: >-
      The gene-discovery statement underlying this row and the USP27X row, and
      one of the two independent lines behind the FRMPD4 row.
  - reference: PMID:25644381
    reference_title: X-exome sequencing of 405 unresolved families identifies seven novel intellectual disability genes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further support for KLHL15 being implicated in XLID comes from an
      unrelated XLID family, which carries a small deletion that removes part
      of KLHL15
    explanation: >-
      The second, independent family that carries this gene assignment past a
      single observation.
- name: MRX104
  display_name: Intellectual disability, X-linked 104 (FRMPD4)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 104
    term:
      id: MONDO:0010509
      label: intellectual disability, X-linked 104
  genes:
  - preferred_term: FRMPD4
    term:
      id: hgnc:29007
      label: FRMPD4
  description: >-
    Deleterious FRMPD4 variants - an exon deletion, a nonsense change, a
    frameshift and a conserved-residue missense - in ten affected males from
    four unrelated families. FRMPD4 is a neural scaffolding protein that binds
    PSD-95 to promote dendritic spine morphogenesis and regulates mGluR1/5
    signalling through Homer, so this subtype sits at the postsynaptic
    scaffold alongside DLG3. The frameshift allele disrupts binding to both
    PSD-95 and HOMER1 and fails to increase spine density in transfected
    hippocampal neurons, and knockout mice show hippocampus-dependent spatial
    learning deficits. Two qualifications belong on this row: the reporting
    authors describe the entity as a new X-linked intellectual disability
    syndrome, with language delay, seizures and behavioural or psychiatric
    disturbance alongside moderate-to-severe intellectual disability, and the
    ClinGen Intellectual Disability and Autism Gene Curation Expert Panel
    curates FRMPD4 as Definitive against "X-linked complex neurodevelopmental
    disorder" rather than against this class. OMIM and MONDO nonetheless
    number the entity within the non-syndromic series, and it is recorded here
    on that basis with the comorbidity stated rather than suppressed. A third
    point matters for the evidence audit this entry runs on itself: of the
    fourteen genes admitted in this enumeration pass, FRMPD4 is the only one
    named in either list that the 2013 reassessment against 10,563 control X
    chromosomes singles out, and it falls in the fifteen for which replication
    studies were warranted rather than in the ten whose involvement was
    questioned. Both reports cited on this row postdate that flag and supply
    the independent families it asked for.
  evidence:
  - reference: PMID:29267967

  - preferred_term: FTSJ1
    term:
      id: hgnc:13254
      label: FTSJ1
  publication: PMID:36720500
  notes: >-
    Human lymphoblastoid material from patients with FTSJ1 loss of function,
    supporting the MRX9 subtype and the tRNA-modification arm of the
    convergence node. Selected by relevance triage from the dataset-discovery
    candidates as the only DIRECT (disease-named, human, primary-material)

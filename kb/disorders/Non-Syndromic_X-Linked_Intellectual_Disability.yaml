      label: IL1RAPL1
  relationship_type: CAUSATIVE
  subtype: MRX21
  notes: >-
    Interleukin-1 receptor accessory protein-like 1 at Xp22.1-21.3. Deletions
    and nonsense variants cause non-syndromic X-linked intellectual
    disability; the protein is highly expressed in postnatal hippocampus and
    organises excitatory synapse formation.
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thorough investigation of an MRX critical region in Xp22.1-21.3 enabled
      us to identify a new gene expressed in brain that is responsible for a
      non-specific form of X-linked mental retardation.
    explanation: >-
      Establishes IL1RAPL1 as causal for the non-specific (non-syndromic)
      form.
- name: PAK3
  gene_term:
    preferred_term: PAK3
    term:
      id: hgnc:8592
      label: PAK3
  relationship_type: CAUSATIVE
  subtype: MRX30
  notes: >-
    p21-activated serine-threonine kinase at Xq22. Truncating variants disrupt
    kinase function and abolish Rho GTPase-to-cytoskeleton signalling in
    postmitotic cortical and hippocampal neurons.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation produces premature termination, disrupting kinase function.
    explanation: >-
      Establishes the loss-of-function mechanism of the causal PAK3 allele.
- name: GDI1
  gene_term:
    preferred_term: GDI1

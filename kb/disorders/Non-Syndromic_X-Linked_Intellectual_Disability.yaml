  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PAK proteins are crucial effectors linking Rho GTPases to cytoskeletal
      reorganization and to nuclear signalling.
    explanation: >-
      Establishes the Rho GTPase-to-cytoskeleton arm of the convergence.
      Tagged OTHER: this is a background statement of established protein
      function, not a result generated by the cited study.
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Signal transduction through Rho GTPases and PAK3 may be critical for
      human cognitive function.
    explanation: >-
      Connects the Rho GTPase theme directly to the cognitive endpoint.
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rab GDP-dissociation inhibitors (GDI) are evolutionarily conserved
      proteins that play an essential role in the recycling of Rab GTPases
      required for vesicular transport through the secretory pathway.
    explanation: >-
      Establishes the vesicle-trafficking arm of the convergence. Tagged
      OTHER: a background statement of established protein function rather
      than a result of the cited study.
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      tRNA modifications are crucial for efficient and accurate protein
      synthesis, and modification defects are frequently associated with
      disease.
    explanation: >-
      Establishes the translational-fidelity arm of the convergence, which is
      mechanistically distinct from the synaptic-structural arms. Tagged
      OTHER: a general statement about tRNA biology rather than a result of
      the cited study.
  - reference: PMID:30335141
    reference_title: "A recurrent missense variant in SLC9A7 causes nonsyndromic X-linked intellectual disability with alteration of Golgi acidification and aberrant glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data implicate a crucial role for SLC9A7 in the regulation of
      TGN/post-Golgi pH homeostasis and glycosylation of exported cargo, which
      may underlie the cellular pathophysiology and neurodevelopmental
      deficits associated with this particular nonsyndromic form of X-linked
      ID.
    explanation: >-
      Establishes the Golgi-pH/glycosylation arm of the convergence, the most
      recently characterised theme in this class.
  - reference: PMID:11355014
    reference_title: "Fragile XE-associated familial mental retardation protein 2 (FMR2) acts as a potent transcription activator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that FMR2 is a potent transcription activator and that
      its function is conserved.
    explanation: >-
      Establishes the transcriptional arm of the convergence and the molecular
      function lost when the FRAXE expansion silences AFF2/FMR2. Tagged
      IN_VITRO: the activation was measured in yeast and mammalian cell
      reporter assays. GO:0045893 (positive regulation of DNA-templated
      transcription) is used rather than the RNA-polymerase-II-specific term
      because the reporter assays demonstrate transcription activation without
      resolving promoter class.
  - reference: PMID:11355014
    reference_title: "Fragile XE-associated familial mental retardation protein 2 (FMR2) acts as a potent transcription activator."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Expansion of the FRAXE CCG repeat to a full mutation is associated with
      methylation and transcriptional silencing of the FMR2 gene, and as a
      consequence, mild-to-borderline mental retardation.
    explanation: >-
      Connects the loss of that transcriptional activity to the cognitive
      endpoint, which is what places this arm on the convergence node rather
      than leaving it as isolated protein biochemistry. Tagged OTHER rather
      than HUMAN_CLINICAL: this is the abstract's opening background sentence,
      and the study itself reports no human clinical data (its MeSH terms are
      HeLa cells and Saccharomyces cerevisiae).

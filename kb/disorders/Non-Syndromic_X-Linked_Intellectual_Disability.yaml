    term:
      id: hgnc:3670
      label: FGF13
  description: >-
    A single-nucleotide variant in the 5' untranslated region of FGF13,
    shared by three male children with severe intellectual disability in a
    screen of Chinese Han children. The mechanism is translational rather than
    coding: the variant reduces FGF13 translation by weakening the interaction
    between the 5' UTR and polypyrimidine-tract-binding protein 2, and FGF13

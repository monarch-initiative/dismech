inheritance:
- name: X-linked
  description: >-
    Causal variants lie on the X chromosome. Hemizygous males carry a single
    copy of the mutant allele with no second copy to compensate and are fully
    affected; heterozygous females are usually unaffected or only mildly
    affected, because random X-chromosome inactivation makes them mosaic for
    expression of the mutant allele. In several subtypes carrier females show
    completely skewed X-inactivation that silences the mutant X and confers
    additional protection. There is no male-to-male transmission. Large
    multiplex pedigrees showing this segregation pattern were the substrate
    for the linkage studies that defined the numbered MRX/IDX series, and the
    relative ease of ascertaining such families is why X-linked intellectual
    disability was delineated far ahead of its autosomal counterparts.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is because most genes on the X chromosome are subject to random X
      chromosome inactivation (XCI) during early embryonic development, which
      results in a mosaic pattern of gene expression for a given X-linked
      mutant allele.
    explanation: >-
      Establishes the mosaic-expression mechanism that makes heterozygous
      females variably and usually mildly affected relative to hemizygous
      males.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All carrier females with either point mutations or genomic deletions in
      FACL4 showed a completely skewed X-inactivation, suggesting that the
      gene influences survival advantage.
    explanation: >-
      Documents the completely skewed X-inactivation that spares carrier
      females, using the ACSL4/FACL4 subtype as the worked example.
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progress in delineating XLID has far outpaced the efforts to understand
      the genetic basis for autosomal intellectual disability. In large
      measure, this has been because of the relative ease of identifying
      families with XLID and finding the responsible mutations
    explanation: >-
      Explains why this class was characterised ahead of its autosomal
      counterparts: X-linked segregation makes multiplex families
      straightforward to ascertain.

prevalence:
- population: Males, worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 166.7
  notes: >-
    Estimate for X-linked intellectual disability as a whole (syndromic plus
    non-syndromic), given in the source as approximately 1 in 600 males. The
    non-syndromic class is a subset of this figure; no robust population
    prevalence exists for the non-syndromic class alone, because it aggregates
    many individually rare gene-defined disorders.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked forms of mental retardation (MR) affect approximately 1 in 600
      males and are likely to be highly heterogeneous.
    explanation: >-
      Provides the population rate for X-linked intellectual disability as a
      whole. Marked PARTIAL because the figure covers syndromic and
      non-syndromic forms together, not the non-syndromic class this entry
      describes.
- population: Males with intellectual disability
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    X-linked intellectual disability (syndromic and non-syndromic combined)
    accounts for 5-10% of intellectual disability in males, and is the
    classical explanation for the male excess observed among people with
    intellectual disability. `measure_type: UNKNOWN` is deliberate: this is a
    case fraction within an already-affected population rather than a
    population rate, and no source defines a time interval, so none of the
    prevalence/incidence measure types applies.
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-Linked intellectual disability (XLID) accounts for 5%-10% of
      intellectual disability in males.
    explanation: >-
      Quantifies the fraction of male intellectual disability attributable to
      X-linked causes.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked intellectual disability (XLID) is known to contribute up to 10%
      of intellectual disability (ID) in males and could explain the increased
      ratio of affected males observed in patients with ID.
    explanation: >-
      Independent confirmation of the 10% upper bound and explicit statement
      that it explains the male excess.

has_subtypes:
- name: MRX21
  display_name: Intellectual disability, X-linked 21 (IL1RAPL1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 21
    term:
      id: MONDO:0010256
      label: intellectual disability, X-linked 21
  genes:
  - preferred_term: IL1RAPL1
    term:
      id: hgnc:5996
      label: IL1RAPL1
  description: >-
    Deletions and loss-of-function point variants in IL1RAPL1 at Xp22.1-21.3,
    encoding an interleukin-1 receptor accessory protein family member highly
    expressed in postnatal hippocampus. The founding report explicitly describes
    patients with cognitive impairment only, one of the clearest original
    descriptions in the class - though see the caveat below on later
    families. IL1RAPL1 is understood to act in excitatory synapse
    formation, though the cited primary report establishes only its
    hippocampal expression and infers a role in memory and learning. Later series identified
    behavioural problems and mild dysmorphism in some families, illustrating
    the instability of the non-syndromic label.
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-overlapping deletions and a nonsense mutation in this gene were
      identified in patients with cognitive impairment only.
    explanation: >-
      Establishes the IL1RAPL1 subtype and, critically, its purely
      non-syndromic presentation - cognitive impairment as the sole feature.
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Its high level of expression in post-natal brain structures involved in
      the hippocampal memory system suggests a specialized role for this new
      gene in the physiological processes underlying memory and learning
      abilities.
    explanation: >-
      Links the subtype to hippocampal learning circuitry, the anatomical
      substrate shared across the class. Tagged MODEL_ORGANISM: the expression
      analysis is animal tissue work (the paper's MeSH terms include Mice),
      and the role in memory and learning is the authors' inference from that
      expression pattern rather than a demonstrated function.
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified an additional two families with deletions of a
      portion of the gene that give rise to cognitive impairment, as well as
      some behavioral problems and mild dysmorphism.
    explanation: >-
      Documents phenotypic expansion beyond pure cognitive impairment,
      supporting the subtype while qualifying the strictness of its
      non-syndromic classification.
- name: MRX30
  display_name: Intellectual disability, X-linked 30 (PAK3)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 30
    term:
      id: MONDO:0010361
      label: intellectual disability, X-linked 30
  genes:
  - preferred_term: PAK3
    term:
      id: hgnc:8592
      label: PAK3
  description: >-
    Truncating variants in PAK3 (p21-activated kinase) at Xq22, identified in
    the multiplex MRX30 pedigree. PAK3 couples Rho family GTPases to actin
    cytoskeletal reorganisation in postmitotic cortical and hippocampal
    neurons, and this subtype anchors the Rho GTPase theme that recurs across
    the class. MRI was normal in affected individuals - the imaging correlate
    of a functional rather than structural lesion.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals in a multiplex pedigree with MRX (MRX30),
      previously mapped to Xq22, show a point mutation in the PAK3
      (p21-activated kinase) gene, which encodes a serine-threonine kinase.
    explanation: >-
      Establishes the PAK3 lesion defining the MRX30 subtype.
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI analysis showed no gross defects in brain development.
    explanation: >-
      Documents the absence of structural brain malformation that
      distinguishes non-syndromic from malformative X-linked intellectual
      disability.
- name: MRX41
  display_name: Intellectual disability, X-linked 41 (GDI1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 41
    term:
      id: MONDO:0010451
      label: intellectual disability, X-linked 41
  genes:
  - preferred_term: GDI1
    term:
      id: hgnc:4226
      label: GDI1
  description: >-
    Missense and null variants in GDI1, encoding alpha-GDI (Rab GDP
    dissociation inhibitor), which recycles Rab GTPases for synaptic vesicle
    traffic; the L92P allele reduces RAB3A binding and recycling. One of the
    purest non-syndromic exemplars in the class - a large German multiplex
    family had neither abnormal body measurements nor any other significant
    clinical problem, and the authors concluded that a clinical diagnosis of
    GDI1-associated disease is impossible.
  evidence:
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have found mutations in the GDI1 gene (which encodes uGDI) in two
      families affected with X-linked non-specific mental retardation. One of
      the mutations caused a non-conservative substitution (L92P) which
      reduced binding and recycling of RAB3A, the second was a null mutation.
    explanation: >-
      Establishes the GDI1 subtype and its Rab-recycling mechanism.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected male family members had nonsyndromic intellectual
      disability, that is, they had neither abnormal body measurements nor any
      other significant clinical problems
    explanation: >-
      Confirms the strictly non-syndromic presentation of this subtype in an
      independent multiplex family.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present family supports the lack of additional phenotypic features
      in patients with GDI1 mutations, rendering a clinical diagnosis of
      GDI1-associated XLID impossible.
    explanation: >-
      States the diagnostic consequence that defines the whole class - with no
      distinguishing features, molecular testing rather than clinical
      recognition is the only route to diagnosis.
- name: MRX58
  display_name: Intellectual disability, X-linked 58 (TSPAN7/TM4SF2)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 58
    term:
      id: MONDO:0010266
      label: intellectual disability, X-linked 58
  genes:
  - preferred_term: TSPAN7
    term:
      id: hgnc:11854
      label: TSPAN7
  description: >-
    TSPAN7 (formerly TM4SF2) at Xp11.4, first implicated through an X;2
    balanced translocation that disrupted the gene, then confirmed by point
    variants in MRX families. Encodes a tetraspanin that complexes with
    beta-1 integrins and is implicated in the control of neurite outgrowth,
    contributing to the synapse-formation theme.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we show that the gene TM4SF2 at Xp11.4 is inactivated by the X
      breakpoint of an X;2 balanced translocation in a patient with MR.
      Further investigation led to identification of TM4SF2 mutations in 2 of
      33 other MRX families.
    explanation: >-
      Establishes the TSPAN7/TM4SF2 subtype through two independent lines of
      genetic evidence.
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      TM4SF2 encodes a member of the tetraspanin family of proteins, which are
      known to contribute in molecular complexes including beta-1 integrins.
      We speculate that through this interaction, TM4SF2 might have a role in
      the control of neurite outgrowth.
    explanation: >-
      Assigns the subtype to the neurite-outgrowth/synapse-formation theme;
      marked PARTIAL because the source explicitly frames the mechanism as
      speculation.
- name: MRX9
  display_name: Intellectual disability, X-linked 9 (FTSJ1)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 9
    term:
      id: MONDO:0010660
      label: intellectual disability, X-linked 9
  genes:
  - preferred_term: FTSJ1
    term:
      id: hgnc:13254
      label: FTSJ1
  description: >-
    Loss-of-function variants in FTSJ1, the human TRM7 homolog, which
    2'-O-methylates positions C32 and G34 of the tRNA anticodon loop. Patient
    cell lines almost completely lack Cm32 and Gm34 on tRNA-Phe. Places
    translational fidelity - rather than synaptic structure - in the
    mechanistic theme set for this class, and provides a directly measurable
    molecular readout, unusual for non-syndromic intellectual disability.
  evidence:
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations in human FTSJ1, the likely TRM7 homolog, cause nonsyndromic
      X-linked intellectual disability (NSXLID), but the role of FTSJ1 in tRNA
      modification is unknown.
    explanation: >-
      Establishes FTSJ1 as a non-syndromic X-linked intellectual disability
      gene.
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we report that tRNA(Phe) from two genetically independent cell lines of
      NSXLID patients with loss-of-function FTSJ1 mutations nearly completely
      lacks Cm32 and Gm34 , and has reduced peroxywybutosine (o2yW37 )
    explanation: >-
      Provides the direct biochemical consequence of FTSJ1 loss in patient
      cells, grounding the tRNA-modification mechanism.
- name: MRX63
  display_name: Intellectual disability, X-linked 63 (ACSL4/FACL4)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked 63
    term:
      id: MONDO:0010313
      label: intellectual disability, X-linked 63
  genes:
  - preferred_term: ACSL4
    term:
      id: hgnc:3571
      label: ACSL4
  description: >-
    Null variants in ACSL4 (FACL4), encoding fatty acid-CoA ligase 4, mapped
    to Xq22.3 by comparing deletion extents between contiguous-gene ATS-MR
    patients and Alport-only patients. The first gene to link non-syndromic
    intellectual disability to fatty-acid metabolism, and the subtype in which
    complete X-inactivation skewing in carrier females is best documented.
  evidence:
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the identification of two point mutations, one missense
      and one splice-site change, in the gene FACL4 in two families with
      nonspecific mental retardation.
    explanation: >-
      Establishes the ACSL4/FACL4 subtype in non-specific (non-syndromic)
      X-linked intellectual disability.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FACL4 is the first gene shown to be involved in nonspecific mental
      retardation and fatty-acid metabolism.
    explanation: >-
      Places lipid metabolism in the mechanistic theme set for this class.
- name: FRAXE
  display_name: FRAXE intellectual disability (AFF2/FMR2)
  classification: molecular
  subtype_term:
    preferred_term: FRAXE intellectual disability
    term:
      id: MONDO:0010659
      label: FRAXE intellectual disability
  genes:
  - preferred_term: AFF2
    term:
      id: hgnc:3776
      label: AFF2
  description: >-
    CCG repeat expansion and consequent methylation-mediated silencing of AFF2
    (FMR2) at the FRAXE folate-sensitive fragile site in Xq28. Mechanistically
    the repeat-expansion member of the class and the closest non-syndromic
    counterpart to fragile X syndrome, from which it is distinguished by a
    milder cognitive phenotype without the fragile X somatic features. AFF2 is
    among the genes found in non-syndromal families that were never assigned
    an IDX number.
  evidence:
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild mental retardation without consistent physical findings has been
      found associated with expanded CCG repeats at FRAXE.
    explanation: >-
      Establishes both defining properties of this subtype in one statement:
      the repeat-expansion mechanism, and the non-syndromic phenotype
      (mild impairment WITHOUT consistent physical findings), which is what
      qualifies it for this entry.
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a large gene (FMR2) transcribed distally from the CpG
      island at FRAXE, and down-regulated by repeat expansion and methylation.
    explanation: >-
      Provides the methylation-mediated silencing mechanism asserted in this
      subtype's description, which the sequence-variant evidence cited
      elsewhere does not cover.
  - reference: PMID:8673086
    reference_title: "Identification of FMR2, a novel gene associated with the FRAXE CCG repeat and CpG island."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FRAXA expansion results in fragile X syndrome due to down regulation of
      expression of the FMR1 gene
    explanation: >-
      Grounds the contrast with fragile X syndrome drawn in this subtype's
      description - the two are parallel folate-sensitive fragile-site
      expansions with different genes and different phenotypic severity.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence variants in 11 genes (KLF8, AFF2, SLC6A8, NDUFA1, ALG13, SRPX2,
      ATRX, NLGN3, FGDY, CDKL5, and NLGN4) have been found in families with
      IDX but in whom IDX numbers were never assigned.
    explanation: >-
      Places AFF2 among the genes causing non-syndromal (IDX) X-linked
      intellectual disability; marked PARTIAL because this passage concerns
      sequence variants, a different mutational class from the repeat
      expansion that defines the FRAXE subtype.
- name: ARX-related
  display_name: Intellectual disability, X-linked, with or without seizures (ARX)
  classification: molecular
  subtype_term:
    preferred_term: intellectual disability, X-linked, with or without seizures, ARX-related
    term:
      id: MONDO:0010317
      label: intellectual disability, X-linked, with or without seizures, ARX-related
  genes:
  - preferred_term: ARX
    term:
      id: hgnc:18060
      label: ARX
  description: >-
    The non-syndromic end of the ARX allelic series. ARX encodes an
    Aristaless-related homeobox transcription factor expressed specifically in
    telencephalon and ventral thalamus. Polyalanine-tract expansions and
    certain missense alleles produce intellectual disability with or without
    seizures and no detectable brain malformation, and account for nine
    separately numbered nonsyndromal IDX families. Other alleles in the same
    gene cause distinct syndromic entities (X-linked lissencephaly with
    abnormal genitalia, Partington syndrome, West and Ohtahara syndromes,
    Proud syndrome) that are deliberately NOT modelled here. This subtype is
    therefore the worked example of why the syndromic/non-syndromic boundary
    in this class is a property of the allele rather than of the gene.
  evidence:
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited and de novo ARX mutations, including missense mutations and in
      frame duplications/insertions leading to expansions of polyalanine
      tracts in ARX, were found in nine familial and one sporadic case of MR.
    explanation: >-
      Establishes the ARX allelic spectrum, including the polyalanine
      expansions associated with the milder non-syndromic end of the series.
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of detectable brain malformations in patients suggests that
      ARX may have an essential role, in mature neurons, required for the
      development of cognitive abilities.
    explanation: >-
      Confirms the non-syndromic, non-malformative presentation of these ARX
      alleles, distinguishing them from the lissencephaly-causing alleles in
      the same gene.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is not the case for ARX variants, which have been found in the
      disparate phenotypes of Partington syndrome, West syndrome, X-linked
      lissencephaly with abnormal genitalia, hydranencephaly with abnormal
      genitalia, Proud syndrome, Ohtahara syndrome as well as nonsyndromal
      XLID (IDX 29, 32, 33, 36, 38, 43, 54, 76, 87).
    explanation: >-
      Documents that ARX spans both syndromic entities and nine separately
      numbered nonsyndromal IDX families, which is the basis for modelling
      only the nonsyndromal arm here.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this classification is not always clear-cut because distinct variants in
      several of these XLID genes can result in S-XLID as well as in NS-XLID
    explanation: >-
      Provides the general principle that licenses admitting one allelic arm
      of a gene to this class while leaving its syndromic alleles to separate
      entities - the reasoning applied to ARX here.

pathophysiology:
- name: X-Linked Gene Disruption
  biological_scale: MOLECULAR
  description: >-
    Rare germline loss-of-function, hypomorphic, repeat-expansion, or
    copy-number variants in any one of a large set of genes on the X
    chromosome remove or reduce the activity of the encoded product in the
    developing and mature brain. The class is clinically homogeneous but
    genetically heterogeneous: variants at many different loci converge on the
    same single clinical outcome, and each individual gene accounts for only a
    small fraction of cases. The X chromosome is disproportionately
    represented among intellectual-disability genes relative to its size.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsyndromic X-linked mental retardation (MRX) syndromes are clinically
      homogeneous but genetically heterogeneous disorders, whose genetic bases
      are largely unknown.
    explanation: >-
      States the defining architecture of the class - one phenotype, many
      loci - which is why the numbered MRX series was defined by linkage
      rather than by clinical features.
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least five MRX genes have been identified by positional cloning, but
      each accounts for only 0.5%-1.0% of MRX cases.
    explanation: >-
      Quantifies the per-gene contribution, establishing that no single gene
      dominates this class.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-chromosome comprises only about 5% of the human genome but
      accounts for about 15% of the genes currently known to be associated
      with intellectual disability.
    explanation: >-
      Quantifies the disproportionate contribution of the X chromosome to
      intellectual-disability genetics, the observation that motivated the
      field.
  downstream:
  - target: Hemizygous Male Expression of the Mutant Allele
    causal_link_type: DIRECT
    description: >-
      A variant on the single male X chromosome is expressed without a
      compensating allele. Note this edge encodes a dosage/conditioning
      relationship (hemizygosity is a property of male karyotype, not an event
      caused by the variant) rather than a downstream biochemical step;
      `DIRECT` is used because CausalLinkTypeEnum offers no conditioning
      value.

- name: Hemizygous Male Expression of the Mutant Allele
  biological_scale: CELLULAR
  description: >-
    Males carry one X chromosome, so a loss-of-function allele is expressed in
    every cell with no second copy to buffer it. Heterozygous females are
    mosaic, because random X-chromosome
    inactivation silences one X per cell, so the mutant allele is expressed in
    only a subset of cells; such carriers are typically unaffected or mildly
    affected, and in several subtypes completely skewed X-inactivation
    silences the mutant X entirely. This dosage asymmetry is the mechanistic
    basis of the male excess observed among people with intellectual
    disability, and the mosaicism is the principal obstacle to studying the
    circuit pathophysiology in females.
  evidence:
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the unbalanced sex ratio (1.3-1.4 to 1) observed in
      intellectual disability (ID) and the identification of large ID-affected
      families showing X-linked segregation, much attention has been focused
      on the genetics of X-linked ID (XLID).
    explanation: >-
      Quantifies the male excess that hemizygous expression explains and that
      motivated the field's focus on the X chromosome.
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This mosaic expression produces substantial complexity, especially when
      attempting to study the already complicated neural circuits that underly
      behavior, thus impeding the understanding of disease-related
      pathophysiology and the development of therapeutics.
    explanation: >-
      Establishes the consequence of female mosaicism for mechanistic study
      and therapeutic development in this class. Tagged OTHER: the quoted
      sentence is a methodological statement about the difficulty of studying
      mosaic neural circuits, not a human clinical observation.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All carrier females with either point mutations or genomic deletions in
      FACL4 showed a completely skewed X-inactivation, suggesting that the
      gene influences survival advantage.
    explanation: >-
      Demonstrates the complete X-inactivation skewing that spares carrier
      females in this class.
  downstream:
  - target: Convergent Disruption of Neuronal Function
    causal_link_type: DIRECT
    description: >-
      Loss of the gene product in neurons impairs the synaptic processes it
      supports.

- name: Convergent Disruption of Neuronal Function
  biological_scale: CELLULAR
  description: >-
    Although the causal genes do not share a single pathway, their products
    fall repeatedly into a limited set of themes that converge on the same
    functional endpoint: Rho GTPase signalling to the actin cytoskeleton
    (PAK3), Rab-dependent synaptic vesicle recycling (GDI1), proposed roles in excitatory synapse
    formation and neurite outgrowth (IL1RAPL1, TSPAN7 - both inferred rather
    than directly demonstrated in the cited reports), tRNA anticodon-loop modification and translational fidelity
    (FTSJ1), fatty-acid metabolism (ACSL4), Golgi/trans-Golgi-network pH
    regulation and glycosylation (SLC9A7), transcriptional activation (AFF2,
    silenced by the FRAXE repeat expansion), and telencephalic transcriptional
    control (ARX). Most of these arms act on synapse formation, maintenance,
    and plasticity, and synaptic convergence is the field's dominant framing
    of the class. It is not, however, established for all of them: the
    tRNA-modification (FTSJ1), fatty-acid (ACSL4), Golgi-pH (SLC9A7), and
    transcriptional (AFF2) arms have documented molecular and cellular
    consequences but no cited evidence of a synaptic endpoint, so the node is
    deliberately named for neuronal rather than synaptic function. What is shared across every arm is that
    convergence happens at the level of neuronal cell biology rather than
    through a common molecular pathway - which is why no single
    pathway-directed therapy addresses the class.

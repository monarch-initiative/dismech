    reference_title: "Fragile XE-associated familial mental retardation protein 2 (FMR2) acts as a potent transcription activator."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results show that FMR2 is a potent transcription activator and that
      its function is conserved.
    explanation: >-
      Establishes the transcriptional arm of the convergence and the molecular
      function lost when the FRAXE expansion silences AFF2/FMR2. Tagged
      IN_VITRO: the activation was measured in yeast and mammalian cell
      reporter assays. GO:0045893 (positive regulation of DNA-templated
      transcription) is used rather than the RNA-polymerase-II-specific term
      because the reporter assays demonstrate transcription activation without
      resolving promoter class.
  - reference: PMID:11355014
    reference_title: "Fragile XE-associated familial mental retardation protein 2 (FMR2) acts as a potent transcription activator."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Expansion of the FRAXE CCG repeat to a full mutation is associated with
      methylation and transcriptional silencing of the FMR2 gene, and as a
      consequence, mild-to-borderline mental retardation.
    explanation: >-
      Connects the loss of that transcriptional activity to the cognitive
      endpoint, which is what places this arm on the convergence node rather
      than leaving it as isolated protein biochemistry. Tagged OTHER rather
      than HUMAN_CLINICAL: this is the abstract's opening background sentence,
      and the study itself reports no human clinical data (its MeSH terms are
      HeLa cells and Saccharomyces cerevisiae).
  downstream:
  - target: Impaired Synaptic Plasticity in Learning and Memory Circuits
    causal_link_type: DIRECT
    description: >-
      Disrupted synapse formation, transmission, and recycling degrade
      activity-dependent plasticity.

- name: Impaired Synaptic Plasticity in Learning and Memory Circuits
  biological_scale: TISSUE
  description: >-
    The convergent synaptic lesion degrades activity-dependent plasticity in
    the hippocampal and cortical circuits that support learning and memory.
    Several causal genes are selectively or highly expressed in exactly these
    structures - IL1RAPL1 in the postnatal hippocampal memory system, PAK3 in
    postmitotic neurons of developing and postnatal cerebral cortex and
    hippocampus, TSPAN7 in cerebral cortex and hippocampus - which is the
    anatomical reason a diffuse molecular lesion produces a circumscribed
    cognitive phenotype.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  - preferred_term: hippocampus
    term:
      id: UBERON:0002421
      label: hippocampal formation
  biological_processes:
  - preferred_term: regulation of synaptic plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
    modifier: DECREASED
  - preferred_term: dendritic spine morphogenesis
    term:
      id: GO:0060997
      label: dendritic spine morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence analysis showed that PAK3 protein is highly expressed
      in postmitotic neurons of the developing and postnatal cerebral cortex
      and hippocampus.
    explanation: >-
      Localises a causal gene product to the cortical and hippocampal circuits
      that carry the cognitive phenotype. Tagged MODEL_ORGANISM: the
      immunofluorescence was performed in animal tissue (the paper's MeSH
      terms include Mice and Rats), not in patients.
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RNA in situ hybridization showed that TM4SF2 is highly expressed in the
      central nervous system, including the cerebral cortex and hippocampus.
    explanation: >-
      Independent confirmation that causal genes in this class are enriched in
      the same learning-and-memory circuits. Tagged IN_VITRO: an in situ
      hybridisation tissue-expression assay rather than a clinical
      observation.
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that both functional and developmental alterations in
      the neuron may account for the severe impairment of learning abilities
      as a consequence of mutations in GDI1, emphasizing its critical role in
      development of human intellectual and learning abilities.
    explanation: >-
      Links the vesicle-recycling lesion to impaired learning through both
      functional and developmental neuronal alterations.
  downstream:
  - target: Static Cognitive Impairment Without Structural Brain Malformation
    causal_link_type: DIRECT
    description: >-
      Degraded plasticity in an anatomically normal brain manifests as
      non-progressive intellectual disability.

- name: Static Cognitive Impairment Without Structural Brain Malformation
  biological_scale: ORGANISM
  description: >-
    The endpoint of the class: non-progressive impairment of intellectual
    functioning and adaptive behaviour in a brain that is structurally normal
    on imaging and free of any consistently reproducible dysmorphic,
    metabolic, or systemic sign. This is a mis-tuned rather than a mis-built
    or damaged circuit, which is why brain MRI is characteristically
    unremarkable and why - in the absence of any distinguishing feature -
    molecular testing rather than clinical recognition is the only route to a
    specific diagnosis. The class is conventionally described as static and
    non-progressive, with developmental regression arguing against the
    diagnosis; note that none of the evidence cited on this node speaks to
    temporal course, so the staticity claim rests on clinical convention
    rather than on a source quoted here.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI analysis showed no gross defects in brain development.
    explanation: >-
      Documents the structurally normal brain that defines the non-syndromic
      endpoint.
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of detectable brain malformations in patients suggests that
      ARX may have an essential role, in mature neurons, required for the
      development of cognitive abilities.
    explanation: >-
      Independent confirmation, in a second subtype, that the lesion is
      functional rather than malformative.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present family supports the lack of additional phenotypic features
      in patients with GDI1 mutations, rendering a clinical diagnosis of
      GDI1-associated XLID impossible.
    explanation: >-
      States the diagnostic consequence of a phenotype with no distinguishing
      features.
  downstream:
  - target: Intellectual disability
    causal_link_type: DIRECT
    description: >-
      The clinical expression of this endpoint node. Impaired intellectual
      functioning is what the class is defined by, and in the strictest
      members of the series it is the only feature present, so the terminal
      mechanism node and this phenotype stand in a direct relation with no
      intervening step. The remaining phenotypes in this entry - global
      developmental delay, speech and language delay, behavioural and autistic
      features, and seizures - are deliberately left unwired: they appear in
      some subtypes and not others, and assigning each to a mechanism node
      requires per-subtype evidence this pass did not gather.
    evidence:
    - reference: PMID:10471494
      reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Non-overlapping deletions and a nonsense mutation in this gene were
        identified in patients with cognitive impairment only.
      explanation: >-
        Cognitive impairment as the sole clinical consequence of the molecular
        lesion, which is the claim this edge makes.
    - reference: PMID:22002931
      reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the affected male family members had nonsyndromic intellectual
        disability, that is, they had neither abnormal body measurements nor
        any other significant clinical problems
      explanation: >-
        Independent confirmation in a second subtype that the endpoint
        presents as intellectual disability with nothing else attached.

phenotypes:
- category: Neurologic
  name: Intellectual disability
  description: >-
    Impaired intellectual functioning and adaptive behaviour, present as the
    only consistent shared feature of the class. Severity spans mild to severe
    depending on the gene and allele. Because the class aggregates many
    individually rare gene-defined disorders, severity cannot be meaningfully
    quantified at the group level.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-overlapping deletions and a nonsense mutation in this gene were
      identified in patients with cognitive impairment only.
    explanation: >-
      Documents cognitive impairment as the sole clinical feature, which is
      the definition of the non-syndromic class. The VERY_FREQUENT band
      follows from the phenotype being definitional rather than variable.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected male family members had nonsyndromic intellectual
      disability, that is, they had neither abnormal body measurements nor any
      other significant clinical problems
    explanation: >-
      Independent confirmation that intellectual disability is the isolated
      finding in a second subtype.
- category: Neurologic
  name: Absence of distinctive clinical or biochemical features
  description: >-
    The defining negative finding of the class. Affected males have no
    distinctive dysmorphic, malformative, or biochemical abnormality that is
    reproducible across families, which is why the historical MRX families
    were numbered by linkage interval rather than named for a phenotype, and
    why molecular testing is the only route to a specific diagnosis. This is a
    statement about consistency across cases, not about every individual
    patient having isolated intellectual disability. No `phenotype_term` is
    bound: this is a meta-statement about the ABSENCE of consistent
    additional features, so binding it to HP:0001249 would both double-count
    intellectual disability in graph export and assert the opposite of what
    the entry means. HPO has no term for "no consistent additional feature".
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can be categorized into syndromic (MRXS) and nonspecific (MRX)
      forms. In MRX forms, affected patients have no distinctive clinical or
      biochemical features.
    explanation: >-
      States the defining negative criterion separating this class from the
      syndromic (MRXS) forms.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classically, XLID has been subdivided in syndromic intellectual
      disability (S-XLID)-where intellectual disability (ID) is always
      associated with other recognizable physical and/or neurological
      features-and non-specific or non-syndromic intellectual disability
      (NS-XLID) where the only common feature is ID.
    explanation: >-
      The dedicated NS-XLID review's definition of the class, stating
      precisely that the defining property is ID being the only COMMON
      feature - a statement about consistency across cases rather than about
      isolation in each patient.
- category: Neurologic
  name: Global developmental delay
  description: >-
    Delay across developmental domains in early childhood, the presentation
    that precedes a formal diagnosis of intellectual disability before an IQ
    can reliably be measured. More typical of paediatric case series; adult
    historical families are usually described in terms of intellectual
    disability directly. No evidence item is attached: none of the cited
    sources reports a formal developmental-delay ascertainment in this class,
    so the phenotype is recorded as clinical context only, per the evidence
    SOP's option to keep the description without an evidence block rather
    than attach a snippet that does not make the claim.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
- category: Neurologic
  name: Delayed speech and language development
  description: >-
    Speech and language delay is common in several gene-defined forms,
    including SLC9A7-related disease, but is strongly gene-dependent and not
    universal across the class. No frequency band is recorded: the class
    aggregates many gene-defined disorders and no source quantifies the
    proportion affected at group level. No evidence item is attached either -
    the speech phenotype in the SLC9A7 families is reported in the paper's full
    text rather than its abstract, and the cached record for PMID:30335141 is
    abstract-only, so there is no verifiable snippet to quote. Recorded as
    clinical context pending a quotable source.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
- category: Behavioral
  name: Atypical behavior
  description: >-
    Behavioural problems and psychiatric features are reported in subsets of
    families, most clearly documented in IL1RAPL1 deletion families. Their
    presence marks the point at which a nominally non-syndromic subtype begins
    to acquire additional features, and is one reason the class boundary is
    regarded as blurred. No frequency band is recorded: the source reports two
    families without a denominator, which does not support a quantitative
    band. Autistic features are deliberately NOT claimed here even though they
    fall under this term: they are recorded separately below under the child
    term HP:0000729, on independent cohort evidence with its own denominator.
    The parent and child entries are both retained because they rest on
    different sources and make different claims - not to state the same
    finding twice.
  phenotype_term:
    preferred_term: Atypical behavior
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified an additional two families with deletions of a
      portion of the gene that give rise to cognitive impairment, as well as
      some behavioral problems and mild dysmorphism.
    explanation: >-
      Documents behavioural problems in a subset of IL1RAPL1 families. No
      frequency is asserted: this is a subset finding within two reported
      families, not a quantified class-wide feature.
- category: Behavioral
  name: Autistic behavior
  description: >-
    Autism spectrum features are reported in a substantial minority of
    patients ascertained as suggestive non-syndromic XLID: nearly 30% of the
    61 males in the Basque targeted-panel cohort, in a group explicitly
    characterised in the same sentence as showing an unspecific (that is,
    non-syndromic) phenotype. Read the denominator carefully - those 61 males
    are a REFERRAL population selected on X-linked family history and normal
    FMR1 testing, and only 16 of them received a candidate variant, so most of
    the denominator carries no molecular XLID diagnosis. The figure therefore
    describes the population in which this class is looked for, not a
    genetically confirmed case series. This is the more specific sibling of
    the `Atypical behavior` entry above, which carries the parent HPO term and
    the independent IL1RAPL1-family evidence.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the selected patients did not have relevant dysmorphic features,
      confirming that they show an unspecific phenotype. However, autism
      spectrum disorders were present in nearly 30% of them.
    explanation: >-
      Quantifies autistic features in a cohort selected for suggestive
      non-syndromic XLID, in the same sentence in which the authors
      characterise that cohort as phenotypically unspecific - so the figure is
      drawn from the non-syndromic population this entry is about, though the
      authors write "most", not all, of the patients lacked relevant
      dysmorphic features. OCCASIONAL (5-29%) is the conservative reading of
      "nearly 30%", which sits exactly on the OCCASIONAL/FREQUENT boundary;
      the band would be FREQUENT if the true value were at or above 30%.
- category: Neurologic
  name: Seizure
  description: >-
    Seizures occur in a minority of affected males - almost 15% of the
    X-linked group in the Basque suggestive non-syndromic XLID cohort, that
    group being the roughly 47 probands ascertained on X-linked family history
    rather than the full 61-patient cohort - and are a designated variable
    feature of the ARX-related subtype, which is named "with or without
    seizures". The same referral-population caveat recorded on the
    `Autistic behavior` entry applies. They are not a defining feature of the
    class. When prominent and early, they should prompt consideration of the
    syndromic ARX entities (West syndrome, Ohtahara syndrome) instead. Note
    that the ARX-specific literature quote available here enumerates those
    SYNDROMIC ARX entities, which this entry deliberately excludes, so it is
    not attached: the frequency band rests on the cohort figure below, and the
    ARX designation rests on the MONDO subtype label itself
    ("intellectual disability, X-linked, with or without seizures,
    ARX-related", MONDO:0010317). The entry is therefore recorded at class
    level rather than scoped to the ARX subtype, because the quantitative
    evidence is a class-level cohort figure.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  phenotype_contexts:
  - subtype: ARX-related
    notes: >-
      Seizures are a designated variable feature of this subtype, whose MONDO
      label is "intellectual disability, X-linked, with or without seizures,
      ARX-related" (MONDO:0010317). No frequency is recorded for the context:
      the label establishes that seizures vary within the subtype without
      quantifying them, and the only ARX-specific seizure quote available
      enumerates the syndromic ARX entities this entry excludes. The context
      exists so the subtype association survives structurally now that the
      phenotype itself is recorded at class level on cohort evidence.
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost 15% of the patients in the X-linked group also reported having
      epilepsy.
    explanation: >-
      Quantifies epilepsy in the X-linked-family arm of a cohort selected for
      suggestive non-syndromic XLID, supporting the OCCASIONAL band (5-29%).

genetic:
- name: IL1RAPL1
  gene_term:
    preferred_term: IL1RAPL1
    term:

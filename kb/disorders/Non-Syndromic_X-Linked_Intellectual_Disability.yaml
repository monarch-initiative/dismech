  evidence:
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to other genes involved in XLMR, ARX expression is specific
      to the telencephalon and ventral thalamus.
    explanation: >-
      Characterises the restricted expression domain that distinguishes ARX

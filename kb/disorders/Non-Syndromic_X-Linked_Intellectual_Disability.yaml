      States the diagnostic consequence of a phenotype with no distinguishing
      features.

phenotypes:
- category: Neurologic
  name: Intellectual disability
  description: >-
    Impaired intellectual functioning and adaptive behaviour, present as the
    only consistent shared feature of the class. Severity spans mild to severe
    depending on the gene and allele. Because the class aggregates many
    individually rare gene-defined disorders, severity cannot be meaningfully
    quantified at the group level.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-overlapping deletions and a nonsense mutation in this gene were
      identified in patients with cognitive impairment only.
    explanation: >-
      Documents cognitive impairment as the sole clinical feature, which is
      the definition of the non-syndromic class. The VERY_FREQUENT band
      follows from the phenotype being definitional rather than variable.
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the affected male family members had nonsyndromic intellectual
      disability, that is, they had neither abnormal body measurements nor any
      other significant clinical problems
    explanation: >-
      Independent confirmation that intellectual disability is the isolated
      finding in a second subtype.
- category: Neurologic
  name: Absence of distinctive clinical or biochemical features
  description: >-
    The defining negative finding of the class. Affected males have no
    distinctive dysmorphic, malformative, or biochemical abnormality that is
    reproducible across families, which is why the historical MRX families
    were numbered by linkage interval rather than named for a phenotype, and
    why molecular testing is the only route to a specific diagnosis. This is a
    statement about consistency across cases, not about every individual
    patient having isolated intellectual disability. No `phenotype_term` is
    bound: this is a meta-statement about the ABSENCE of consistent
    additional features, so binding it to HP:0001249 would both double-count
    intellectual disability in graph export and assert the opposite of what
    the entry means. HPO has no term for "no consistent additional feature".
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can be categorized into syndromic (MRXS) and nonspecific (MRX)
      forms. In MRX forms, affected patients have no distinctive clinical or
      biochemical features.
    explanation: >-
      States the defining negative criterion separating this class from the
      syndromic (MRXS) forms.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classically, XLID has been subdivided in syndromic intellectual
      disability (S-XLID)-where intellectual disability (ID) is always
      associated with other recognizable physical and/or neurological
      features-and non-specific or non-syndromic intellectual disability
      (NS-XLID) where the only common feature is ID.
    explanation: >-
      The dedicated NS-XLID review's definition of the class, stating
      precisely that the defining property is ID being the only COMMON
      feature - a statement about consistency across cases rather than about
      isolation in each patient.
- category: Neurologic
  name: Global developmental delay
  description: >-
    Delay across developmental domains in early childhood, the presentation
    that precedes a formal diagnosis of intellectual disability before an IQ
    can reliably be measured. More typical of paediatric case series; adult
    historical families are usually described in terms of intellectual
    disability directly. No evidence item is attached: none of the cited
    sources reports a formal developmental-delay ascertainment in this class,
    so the phenotype is recorded as clinical context only, per the evidence
    SOP's option to keep the description without an evidence block rather
    than attach a snippet that does not make the claim.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
- category: Neurologic
  name: Delayed speech and language development
  description: >-
    Speech and language delay is common in several gene-defined forms,
    including SLC9A7-related disease, but is strongly gene-dependent and not
    universal across the class. No frequency band is recorded: the class
    aggregates many gene-defined disorders and no source quantifies the
    proportion affected at group level. No evidence item is attached either -
    the speech phenotype in the SLC9A7 families is reported in the paper's full
    text rather than its abstract, and the cached record for PMID:30335141 is
    abstract-only, so there is no verifiable snippet to quote. Recorded as
    clinical context pending a quotable source.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
- category: Behavioral
  name: Atypical behavior
  description: >-
    Behavioural problems and psychiatric features are reported in subsets of
    families, most clearly documented in IL1RAPL1 deletion families. Their
    presence marks the point at which a nominally non-syndromic subtype begins
    to acquire additional features, and is one reason the class boundary is
    regarded as blurred. No frequency band is recorded: the source reports two
    families without a denominator, which does not support a quantitative
    band. Autistic features are deliberately NOT claimed here even though they
    fall under this term: they are recorded separately below under the child
    term HP:0000729, on independent cohort evidence with its own denominator.
    The parent and child entries are both retained because they rest on
    different sources and make different claims - not to state the same
    finding twice.
  phenotype_term:
    preferred_term: Atypical behavior
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified an additional two families with deletions of a
      portion of the gene that give rise to cognitive impairment, as well as
      some behavioral problems and mild dysmorphism.
    explanation: >-
      Documents behavioural problems in a subset of IL1RAPL1 families. No
      frequency is asserted: this is a subset finding within two reported
      families, not a quantified class-wide feature.
- category: Behavioral
  name: Autistic behavior
  description: >-
    Autism spectrum features are reported in a substantial minority of
    patients ascertained as suggestive non-syndromic XLID: nearly 30% of the
    61 males in the Basque targeted-panel cohort, in a group explicitly
    characterised in the same sentence as showing an unspecific (that is,
    non-syndromic) phenotype. Read the denominator carefully - those 61 males
    are a REFERRAL population selected on X-linked family history and normal
    FMR1 testing, and only 16 of them received a candidate variant, so most of
    the denominator carries no molecular XLID diagnosis. The figure therefore
    describes the population in which this class is looked for, not a
    genetically confirmed case series. This is the more specific sibling of
    the `Atypical behavior` entry above, which carries the parent HPO term and
    the independent IL1RAPL1-family evidence.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the selected patients did not have relevant dysmorphic features,
      confirming that they show an unspecific phenotype. However, autism
      spectrum disorders were present in nearly 30% of them.
    explanation: >-
      Quantifies autistic features in a cohort selected for suggestive
      non-syndromic XLID, in the same sentence in which the authors
      characterise that cohort as phenotypically unspecific - so the figure is
      drawn from the non-syndromic population this entry is about, though the
      authors write "most", not all, of the patients lacked relevant
      dysmorphic features. OCCASIONAL (5-29%) is the conservative reading of
      "nearly 30%", which sits exactly on the OCCASIONAL/FREQUENT boundary;
      the band would be FREQUENT if the true value were at or above 30%.
- category: Neurologic
  name: Seizure
  description: >-
    Seizures occur in a minority of affected males - almost 15% of the
    X-linked group in the Basque suggestive non-syndromic XLID cohort, that
    group being the roughly 47 probands ascertained on X-linked family history
    rather than the full 61-patient cohort - and are a designated variable
    feature of the ARX-related subtype, which is named "with or without
    seizures". The same referral-population caveat recorded on the
    `Autistic behavior` entry applies. They are not a defining feature of the
    class. When prominent and early, they should prompt consideration of the
    syndromic ARX entities (West syndrome, Ohtahara syndrome) instead. Note
    that the ARX-specific literature quote available here enumerates those
    SYNDROMIC ARX entities, which this entry deliberately excludes, so it is
    not attached: the frequency band rests on the cohort figure below, and the
    ARX designation rests on the MONDO subtype label itself
    ("intellectual disability, X-linked, with or without seizures,
    ARX-related", MONDO:0010317). The entry is therefore recorded at class
    level rather than scoped to the ARX subtype, because the quantitative
    evidence is a class-level cohort figure.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  phenotype_contexts:
  - subtype: ARX-related
    notes: >-
      Seizures are a designated variable feature of this subtype, whose MONDO
      label is "intellectual disability, X-linked, with or without seizures,
      ARX-related" (MONDO:0010317). No frequency is recorded for the context:
      the label establishes that seizures vary within the subtype without
      quantifying them, and the only ARX-specific seizure quote available
      enumerates the syndromic ARX entities this entry excludes. The context
      exists so the subtype association survives structurally now that the
      phenotype itself is recorded at class level on cohort evidence.
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost 15% of the patients in the X-linked group also reported having
      epilepsy.
    explanation: >-
      Quantifies epilepsy in the X-linked-family arm of a cohort selected for
      suggestive non-syndromic XLID, supporting the OCCASIONAL band (5-29%).

genetic:
- name: IL1RAPL1
  gene_term:
    preferred_term: IL1RAPL1
    term:
      id: hgnc:5996
      label: IL1RAPL1
  relationship_type: CAUSATIVE
  notes: >-
    Interleukin-1 receptor accessory protein-like 1 at Xp22.1-21.3. Deletions
    and nonsense variants cause non-syndromic X-linked intellectual
    disability; the protein is highly expressed in postnatal hippocampus and
    organises excitatory synapse formation.
  evidence:
  - reference: PMID:10471494
    reference_title: "A new member of the IL-1 receptor family highly expressed in hippocampus and involved in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thorough investigation of an MRX critical region in Xp22.1-21.3 enabled
      us to identify a new gene expressed in brain that is responsible for a
      non-specific form of X-linked mental retardation.
    explanation: >-
      Establishes IL1RAPL1 as causal for the non-specific (non-syndromic)
      form.
- name: PAK3
  gene_term:
    preferred_term: PAK3
    term:
      id: hgnc:8592
      label: PAK3
  relationship_type: CAUSATIVE
  notes: >-
    p21-activated serine-threonine kinase at Xq22. Truncating variants disrupt
    kinase function and abolish Rho GTPase-to-cytoskeleton signalling in
    postmitotic cortical and hippocampal neurons.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation produces premature termination, disrupting kinase function.
    explanation: >-
      Establishes the loss-of-function mechanism of the causal PAK3 allele.
- name: GDI1
  gene_term:
    preferred_term: GDI1
    term:
      id: hgnc:4226
      label: GDI1
  relationship_type: CAUSATIVE
  notes: >-
    Rab GDP-dissociation inhibitor alpha. Missense (L92P) and null alleles
    impair recycling of RAB3A and synaptic vesicle traffic. Associated with a
    strictly non-syndromic phenotype across independent families.
  evidence:
  - reference: PMID:9620768
    reference_title: "Mutations in GDI1 are responsible for X-linked non-specific mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of the mutations caused a non-conservative substitution (L92P) which
      reduced binding and recycling of RAB3A, the second was a null mutation.
    explanation: >-
      Characterises both the missense and null mechanisms at this locus.
- name: TSPAN7
  gene_term:
    preferred_term: TSPAN7
    term:
      id: hgnc:11854
      label: TSPAN7
  relationship_type: CAUSATIVE
  notes: >-
    Tetraspanin 7 (formerly TM4SF2) at Xp11.4, implicated by a disrupting X;2
    translocation breakpoint and by point variants in MRX families.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further investigation led to identification of TM4SF2 mutations in 2 of
      33 other MRX families.
    explanation: >-
      Provides the independent point-variant evidence beyond the index
      translocation.
- name: FTSJ1
  gene_term:
    preferred_term: FTSJ1
    term:
      id: hgnc:13254
      label: FTSJ1
  relationship_type: CAUSATIVE
  notes: >-
    tRNA 2'-O-methyltransferase, the human TRM7 homolog. Loss-of-function
    alleles abolish Cm32 and Gm34 modification of the tRNA anticodon loop; a
    p.A26P missense allele produces a selective Gm34 defect, giving an
    allele-specific biochemical readout.
  evidence:
  - reference: PMID:26310293
    reference_title: "Defects in tRNA Anticodon Loop 2'-O-Methylation Are Implicated in Nonsyndromic X-Linked Intellectual Disability due to Mutations in FTSJ1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally, tRNA(Phe) from an NSXLID patient with a novel
      FTSJ1-p.A26P missense allele specifically lacks Gm34 , but has normal
      levels of Cm32 and o2yW37 .
    explanation: >-
      Demonstrates allele-specific biochemical consequences at this locus.
- name: ACSL4
  gene_term:
    preferred_term: ACSL4
    term:
      id: hgnc:3571
      label: ACSL4
  relationship_type: CAUSATIVE
  notes: >-
    Fatty acid-CoA ligase 4 (FACL4) at Xq22.3. Missense and splice-site null
    alleles reduce enzymatic activity in patient lymphoblastoid lines. Mapped
    by narrowing the ATS-MR contiguous-gene deletion interval to roughly
    380 kb.
  evidence:
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Analysis of enzymatic activity in lymphoblastoid cell lines from
      affected individuals of both families revealed low levels compared with
      normal cells, indicating that both mutations are null mutations.
    explanation: >-
      Provides the functional confirmation that both alleles are null.
- name: ARX
  gene_term:
    preferred_term: ARX
    term:
      id: hgnc:18060
      label: ARX
  relationship_type: CAUSATIVE
  notes: >-
    Aristaless-related homeobox transcription factor with telencephalon- and
    ventral-thalamus-restricted expression. Polyalanine expansions and certain
    missense alleles give the non-syndromic phenotype modelled here; other
    alleles in the same gene cause distinct syndromic entities.
  evidence:
  - reference: PMID:11971879
    reference_title: "ARX, a novel Prd-class-homeobox gene highly expressed in the telencephalon, is mutated in X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to other genes involved in XLMR, ARX expression is specific
      to the telencephalon and ventral thalamus.
    explanation: >-
      Characterises the restricted expression domain that distinguishes ARX
      from the broadly expressed genes in this class.
- name: AFF2
  gene_term:
    preferred_term: AFF2
    term:
      id: hgnc:3776
      label: AFF2
  relationship_type: CAUSATIVE
  notes: >-
    AF4/FMR2 family member 2 at the FRAXE folate-sensitive fragile site in
    Xq28. Silenced by CCG repeat expansion and methylation, giving the
    repeat-expansion route into this class. Found in non-syndromal (IDX)
    families that were never assigned an IDX number.
  evidence:
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence variants in 11 genes (KLF8, AFF2, SLC6A8, NDUFA1, ALG13, SRPX2,
      ATRX, NLGN3, FGDY, CDKL5, and NLGN4) have been found in families with
      IDX but in whom IDX numbers were never assigned.
    explanation: >-
      Places AFF2 among the genes causing non-syndromal X-linked intellectual
      disability.
- name: SLC9A7
  gene_term:
    preferred_term: SLC9A7
    term:
      id: hgnc:17123
      label: SLC9A7
  relationship_type: CAUSATIVE
  notes: >-
    Alkali cation/proton exchanger (NHE7) at Xp11.3, resident in the
    trans-Golgi network and post-Golgi vesicles. A recurrent p.Leu515Phe
    missense variant in two unrelated multigenerational families alkalinises
    the TGN and impairs N-glycosylation of exported cargo, with an abnormal
    serum transferrin glycosylation profile in patients. The most recently
    characterised mechanistic theme in this class; not curated as a formal
    subtype here because a corresponding MONDO descendant term was not
    confirmed.
  evidence:
  - reference: PMID:30335141
    reference_title: "A recurrent missense variant in SLC9A7 causes nonsyndromic X-linked intellectual disability with alteration of Golgi acidification and aberrant glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two unrelated families with multigenerational nonsyndromic
      intellectual disability (ID) segregating with a recurrent de novo
      missense variant (c.1543C>T:p.Leu515Phe) in the alkali cation/proton
      exchanger gene SLC9A7 (also commonly referred to as NHE7).
    explanation: >-
      Establishes SLC9A7 as causal for a non-syndromic form in two independent
      families.
  - reference: PMID:30335141
    reference_title: "A recurrent missense variant in SLC9A7 causes nonsyndromic X-linked intellectual disability with alteration of Golgi acidification and aberrant glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectrometry analysis of patient sera also revealed an abnormal
      N-glycosylation profile for transferrin, a clinical diagnostic marker
      for congenital disorders of glycosylation.
    explanation: >-
      Provides a measurable biochemical readout for this form, unusual in a
      class defined by the absence of biochemical features.

diagnosis:
- name: Fragile X (FMR1) repeat testing
  description: >-
    Sizing of the FMR1 CGG trinucleotide repeat, performed before or alongside
    sequencing. It is separated from the sequencing entry below because it is a
    mechanically distinct assay: a repeat expansion is not reliably called by
    exome or panel sequencing, so a normal sequencing result does not exclude
    fragile X syndrome. Fragile X is the most common single XLID entity, and
    excluding it is the conventional first step in a male with intellectual
    disability and a suggestive X-linked family history - in the Basque
    targeted-panel cohort, every one of the 61 patients had already been
    referred for FMR1 testing and shown a normal repeat number before
    enrolment.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Over 150 syndromes, the most common of which is the fragile X syndrome,
      have been described.
    explanation: >-
      Establishes fragile X syndrome as the most common of the XLID syndromes,
      which is why its exclusion is the conventional first diagnostic step in
      this population. Tagged OTHER: the source is a historical review and the
      sentence summarises the field rather than reporting a clinical series.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents FMR1 testing as the referral-level first step preceding
      sequencing in a suggestive non-syndromic XLID cohort.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 61 patients had normal G-banded karyotype and showed normal FMR1
      trinucleotide repeat numbers.
    explanation: >-
      Documents that a normal FMR1 repeat number was, in this cohort, already
      established before enrolment - so fragile X exclusion preceded the
      non-syndromic XLID workup rather than running alongside it. The
      generalisation to practice is the entry's own inference from the
      referral pattern, not a claim of the quoted sentence.
- name: Molecular genetic testing (exome or genome sequencing)
  description: >-
    Because affected individuals have no distinguishing clinical features, a
    specific diagnosis cannot be reached by examination and requires parallel
    molecular testing of all known intellectual-disability genes. The
    contemporary workup is clinical evaluation with a family pedigree,
    fragile X (FMR1) testing (recorded as its own entry above), chromosomal
    microarray, and exome or genome sequencing with segregation analysis; of
    these, only fragile X exclusion and panel sequencing with segregation are
    covered by the evidence cited here, the remainder - chromosomal microarray
    in particular - reflecting standard practice. Targeted XLID panels
    retain a role in pedigrees with suggestive X-linked family history: in one
    cohort of 61 unrelated males with suggestive non-syndromic XLID and
    negative fragile X testing, an 82-gene panel identified 17 candidate
    variants in 16 patients.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22002931
    reference_title: "Novel GDI1 mutation in a large family with nonsyndromic X-linked intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this family not only broadens the spectrum of GDI1 mutations but
      also emphasizes the need for parallel testing of all known genes
      associated with ID in patients with an unspecific phenotype.
    explanation: >-
      States the diagnostic strategy the class requires and the reason for it.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have performed targeted next-generation sequencing of 82 XLID genes
      on 61 non-related male patients with suggestive non-syndromic XLID.
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents the cohort design and the position of targeted panels after
      fragile X exclusion in this population.
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing data analysis identified 17 candidate variants in 16
      patients.
    explanation: >-
      Quantifies the diagnostic yield of a targeted panel in a suggestive
      non-syndromic XLID cohort.
- name: Brain MRI
  description: >-
    Characteristically unremarkable. Its role here is exclusionary - normal
    imaging supports a non-syndromic, non-malformative diagnosis and argues
    against the malformative X-linked entities (for example ARX-related
    lissencephaly) that enter the differential.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI analysis showed no gross defects in brain development.
    explanation: >-
      Documents the normal imaging expected in this class.
- name: X-chromosome inactivation studies in female relatives
  description: >-
    Assessment of X-inactivation skewing in mothers and female relatives.
    Extreme skewing supports an X-linked cause and, in cohorts of females with
    idiopathic intellectual disability, enriches for pathogenic findings on
    subsequent sequencing - 11 of 136 informative women showed at least 90%
    skewing, and exome sequencing found pathogenic variants in 8 of those 11.
    Note that those variants were dominant and included autosomal genes, so
    skewing is an ascertainment aid toward a genetic diagnosis generally, not
    a diagnostic criterion for this class.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and 14 male patients with ID and affected brothers whose mothers show
      skewed X-inactivation
    explanation: >-
      Documents maternal X-inactivation skewing used as an ascertainment
      criterion for suspected X-linked intellectual disability.
  - reference: PMID:36943625
    reference_title: "Skewed X-chromosome Inactivation in Women with Idiopathic Intellectual Disability is Indicative of Pathogenic Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 136 patients who were informative, 11 (8%) presented with
      extreme or total XCI skewing (>= 90%), which was significantly higher
      than expected by chance.
    explanation: >-
      Quantifies the enrichment of extreme X-inactivation skewing in women
      with idiopathic intellectual disability.
  - reference: PMID:36943625
    reference_title: "Skewed X-chromosome Inactivation in Women with Idiopathic Intellectual Disability is Indicative of Pathogenic Variants."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants were mapped to ID-related genes with dominant phenotypes:
      four variants in the X-linked genes DDX3X (an XCI escape gene; two
      cases), WDR45, and PDHA1, and four variants in the autosomal genes
      KCNB1, CTNNB1, YY1, and ANKRD11.
    explanation: >-
      Important qualification, and the reason this is PARTIAL for this entry:
      half the variants recovered by the skewing-guided strategy were
      autosomal, so the yield is not specific to X-linked - let alone
      non-syndromic X-linked - intellectual disability.

treatments:
- name: Genetic Counseling
  description: >-
    Establishing a molecular diagnosis enables carrier detection in female
    relatives and informs recurrence-risk counselling and reproductive
    options, including prenatal diagnosis and preimplantation genetic testing
    where a familial pathogenic variant is known. Because the mode of
    inheritance is X-linked, carrier females have a 50% chance of transmitting
    the allele to each child, and the counselling yield is high in the large
    multiplex pedigrees characteristic of this class.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:22482801
    reference_title: "Fragile X and X-linked intellectual disability: four decades of discovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the same time, it has improved the clinical diagnosis of XLID and
      allowed for carrier detection and prevention strategies through gamete
      donation, prenatal diagnosis, and genetic counseling.
    explanation: >-
      Documents genetic counselling and carrier detection as the established
      clinical payoff of molecular diagnosis in this class.
- name: Supportive Care
  description: >-
    No disease-modifying therapy is established for this class. Management is
    supportive and individualised: developmental, educational, speech-language,
    occupational, physical, and behavioural interventions, with psychiatric and
    antiseizure treatment where indicated. This entry carries the umbrella
    claim and the evidence that care is supportive only; the two most
    consistently named allied-health modalities are additionally recorded as
    their own NCIT-coded entries below, for queryability. Because management is
    phenotype- and gene-specific, the evidence base is largely extrapolated
    from broader neurodevelopmental care rather than generated for this class.
    Gene therapy, selective X-reactivation, and synapse- or circuit-directed
    interventions remain experimental and are mostly not specific to this
    class.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Here, we review a few selected X-linked forms of ID that predominantly
      affect heterozygous females and the current obstacles for developing
      effective therapies for such disorders.
    explanation: >-
      Documents that effective disease-modifying therapies for X-linked
      intellectual disability remain obstructed and under development, which
      is why care is supportive. Tagged OTHER for the same reason as the
      hemizygous-expression node: the sentence states the scope of a review
      rather than reporting a clinical observation.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The progress in identifying genetic and genomic alterations associated
      with XLID has not been matched with insights that improve the
      clinician's ability to form differential diagnoses, that bring into view
      the possibility of curative therapies for patients
    explanation: >-
      States explicitly that gene discovery in this class has not yet
      translated into curative therapy, grounding the supportive-care-only
      position.
- name: Speech and Language Therapy
  description: >-
    Speech-language intervention, including augmentative and alternative
    communication where speech is absent or limited, is a standard component of
    multidisciplinary care and is tied to the group rather than to any single
    causal gene. No evidence block is attached, and this is deliberate: none
    of the references cached for this entry mentions speech-language therapy
    at all - including the two the deep-research report attributed the
    modality list to, one of which is cached as full text - so there is no
    quotable source, and the DR report over-attributed the enumeration.
    Recorded as a queryable NCIT-coded entry under the supportive-care
    umbrella above, not as an evidenced claim.
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
- name: Occupational Therapy
  description: >-
    Occupational therapy addressing adaptive, motor, and daily-living skills,
    likewise tied to the group rather than to a specific gene. As with speech
    and language therapy, no evidence block is attached because no cached
    reference for this entry mentions the modality; the entry exists to make
    it queryable rather than to assert a class-specific evidence base.
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  therapeutic_modality: BEHAVIORAL

differential_diagnoses:
- name: Syndromic X-linked intellectual disability (MRXS)
  description: >-
    The primary differential. MRXS entities share X-linked inheritance and
    intellectual disability but add distinguishing physical, neurological, or
    biochemical features. The boundary is explicitly regarded as blurred and
    sometimes arbitrary: 28 of the numbered non-syndromal (IDX) genes are also
    associated with XLID syndromes. Separately curated dismech entries in this
    family (Claes-Jensen, Siderius, Shashi, Turner type) are deliberately not
    modelled as subtypes here.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can be categorized into syndromic (MRXS) and nonspecific (MRX)
      forms. In MRX forms, affected patients have no distinctive clinical or
      biochemical features.
    explanation: >-
      States the criterion that separates the two classes.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-eight of the “IDX genes” in Figure 3 have also been associated
      with XLID syndromes.
    explanation: >-
      Quantifies the overlap between the two classes at the gene level,
      showing the differential is often not resolvable by gene identity alone.
- name: Fragile X syndrome
  description: >-
    The most common syndromic XLID entity and the standard exclusion before
    this diagnosis is entertained - patients in non-syndromic XLID cohorts are
    typically referred after negative FMR1 testing. Distinguished by the
    characteristic somatic features and the FMR1 CGG expansion.
  evidence:
  - reference: PMID:31906484
    reference_title: "Targeted Next-Generation Sequencing in Patients with Suggestive X-Linked Intellectual Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients were initially referred to the molecular genetics
      laboratory to exclude Fragile X Syndrome.
    explanation: >-
      Documents fragile X exclusion as the standard first step before
      non-syndromic XLID is pursued.
- name: Autosomal recessive non-syndromic intellectual disability
  description: >-
    Clinically indistinguishable in an isolated male. Distinguished by
    pedigree structure (affected siblings of both sexes, parental
    consanguinity, no X-linked segregation) and ultimately by molecular
    testing.
- name: Autosomal dominant non-syndromic intellectual disability
  description: >-
    The dominant class, in which sporadic de novo heterozygous variants in
    constraint-intolerant autosomal genes predominate. In a sporadic male with
    no family history this is now a more likely explanation than a novel
    X-linked cause, a reversal of the pre-exome-era prior.

discussions:
- discussion_id: questioned_xlid_gene_assignments
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the genes historically assigned to non-syndromic X-linked
    intellectual disability are genuinely causal, given that many were
    nominated from small families before large population control sets were
    available?
  attaches_to:
  - pathophysiology#X-Linked Gene Disruption
  rationale: >-
    Gene lists for this class carry an unusual historical liability. Genes
    were nominated by linkage in individual families at a time when systematic
    sequencing of control X chromosomes was not possible, so rare
    non-disease-causing variants could not be excluded. When 106 proposed XLID
    genes were reassessed against 10,563 control X chromosomes from the NHLBI
    Exome Sequencing Project, ten were specifically questioned because
    truncating or previously published variants occurred at appreciable
    frequency in controls, and a further fifteen were flagged as requiring
    replication. The 2017 authoritative update revisited those 25 challenged
    genes: none of the five highly questionable assignments has been
    confirmed, only ATP6AP2 of the five questionable ones has been confirmed,
    and additional cases have been published for seven of the fifteen needing
    replication - leaving 17 of the 25 still unresolved. This directly affects
    curation of this entry: AGTR2 in particular is frequently cited in older
    reviews as a non-syndromic XLID gene and is among the questioned set, so
    it is deliberately not modelled as a subtype here. Any gene list for this
    class drawn from literature predating the reassessment should be treated
    as provisional.
  proposed_experiments:
  - experiment_id: reassess_questioned_xlid_genes_gnomad
    name: Re-evaluation of questioned XLID genes against contemporary population databases
    description: >-
      Repeat the control-frequency reassessment against gnomAD-scale
      population data, which offers far more X chromosomes than the NHLBI
      cohort, and combine with independent replication cohorts and functional
      assays for the genes still flagged as requiring replication.
  evidence:
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used this NHLBI cohort to systematically reassess the implication of
      106 genes proposed to be involved in monogenic forms of XLID. We
      particularly question the implication in XLID of ten of them (AGTR2,
      MAGT1, ZNF674, SRPX2, ATP6AP2, ARHGEF6, NXF5, ZCCHC12, ZNF41, and
      ZNF81), in which truncating variants or previously published mutations
      are observed at a relatively high frequency within this cohort.
    explanation: >-
      Names the specific genes whose causal role in this class is in doubt,
      including AGTR2, ZNF41, and ARHGEF6, which appear in older MRX gene
      lists.
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonetheless, the boundary between true mutations and rare
      non-disease-causing variants often remains elusive. The sequencing of a
      large number of control X chromosomes, required for avoiding
      false-positive results, was not systematically possible in the past.
    explanation: >-
      Explains the methodological reason this class accumulated
      false-positive gene assignments.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 15 assignments in need of replication, additional cases with
      MAOA, HCFC1, CCDC22, CNKSR2, KIAA2022, NAA10 and SHROOM4 sequence
      variants have now been published, leaving 17 of the 25 challenged genes
      unresolved.
    explanation: >-
      Gives the current resolution status of the challenged genes - the direct
      measure of how much of this gap remains open.
  - reference: PMID:19377476
    reference_title: "A systematic, large-scale resequencing screen of X-chromosome coding exons in mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study has, however, also highlighted issues confronting whole-genome
      sequencing screens, including the observation that loss of function of
      1% or more of X-chromosome genes is compatible with apparently normal
      existence.
    explanation: >-
      Provides the independent, orthogonal reason gene attribution is hard in
      this class: X-chromosome loss-of-function is tolerated more often than
      assumed, so a truncating variant is not self-evidently causal.
- discussion_id: syndromic_nonsyndromic_boundary_stability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is "non-syndromic" a stable property of a gene, or an artefact of limited
    phenotyping and allele sampling?
  attaches_to:
  - pathophysiology#Static Cognitive Impairment Without Structural Brain Malformation
  rationale: >-
    The class boundary moves in both directions and is explicitly described in
    the authoritative update as blurred, sometimes arbitrary, and difficult to
    defend biologically - retained mainly for historical continuity. IL1RAPL1
    was reported as causing cognitive impairment only, but later families
    showed behavioural problems and mild dysmorphism. ARX shows the converse
    within a single gene: polyalanine expansions give a non-syndromic
    phenotype across nine numbered IDX families while other alleles cause
    lissencephaly with abnormal genitalia, Partington, West, and Ohtahara
    syndromes. Twenty-eight IDX genes are also associated with XLID syndromes.
    Whether a given gene stays in this class therefore depends on how many
    patients have been phenotyped, how deeply, and which alleles they carry -
    not on a fixed biological property. This matters for the KB because
    membership of this entry is provisional for several subtypes, and it is
    the reason FGD1, ZDHHC9, and OPHN1, which are named in older non-syndromic
    gene lists but map to explicitly syndromic MONDO entities, are excluded
    here.
  evidence:
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even though the line dividing the two classes is blurred, sometimes
      arbitrary and difficult to defend from a biological standpoint, it has
      by now acquired quasi-historical value and deserves to be retained.
    explanation: >-
      The authoritative statement that the syndromic/non-syndromic distinction
      is retained for historical rather than biological reasons - the core of
      this knowledge gap.
  - reference: PMID:31898314
    reference_title: "Non-syndromic X linked intellectual disability: Current knowledge in light of the recent advances in molecular and functional studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, new advances on the study of these entities have showed
      that this classification is not always clear-cut because distinct
      variants in several of these XLID genes can result in S-XLID as well as
      in NS-XLID.
    explanation: >-
      States the allele-level mechanism behind the unstable boundary directly:
      it is the variant, not the gene, that determines which class a case
      falls into. This is the evidential basis for admitting only the
      non-syndromic arm of the ARX allelic series.
  - reference: PMID:21484992
    reference_title: "Deletion of the immunoglobulin domain of IL1RAPL1 results in nonsyndromic X-linked intellectual disability associated with behavioral problems and mild dysmorphism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our clinical findings better delineate the phenotypic spectrum
      associated with IL1RAPL1 mutations.
    explanation: >-
      Demonstrates phenotypic expansion of a subtype originally described as
      purely non-syndromic.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is not the case for ARX variants, which have been found in the
      disparate phenotypes of Partington syndrome, West syndrome, X-linked
      lissencephaly with abnormal genitalia, hydranencephaly with abnormal
      genitalia, Proud syndrome, Ohtahara syndrome as well as nonsyndromal
      XLID (IDX 29, 32, 33, 36, 38, 43, 54, 76, 87).
    explanation: >-
      Documents the allelic heterogeneity within ARX that places non-syndromic
      and severely syndromic phenotypes in the same gene.
- discussion_id: nonsyndromic_xlid_group_level_prevalence
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the population prevalence of non-syndromic X-linked intellectual
    disability as distinct from X-linked intellectual disability as a whole?
  attaches_to:
  - pathophysiology#X-Linked Gene Disruption
  rationale: >-
    The prevalence figures recorded on this entry - approximately 1 in 600
    males, and 5-10% of intellectual disability in males - are for X-linked
    intellectual disability overall, syndromic and non-syndromic combined. No
    robust population prevalence or incidence exists for the non-syndromic
    class alone, because it aggregates many individually rare gene-defined
    disorders whose ascertainment has historically depended on the
    availability of large multiplex pedigrees. This is a genuine measurement
    gap rather than a curation omission, and the recorded rates should not be
    presented as if MONDO:0019181 were a uniform entity with its own
    prevalence.
  proposed_experiments:
  - experiment_id: population_scale_nsxlid_prevalence
    name: Population-scale sequencing estimate of non-syndromic XLID prevalence
    description: >-
      Estimate class prevalence from unselected population-scale exome or
      genome cohorts with linked phenotype data, ascertaining on validated
      causal variants in confirmed non-syndromic XLID genes rather than on
      pedigree structure, which avoids the multiplex-family ascertainment bias
      that inflates familial forms.
  evidence:
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked forms of mental retardation (MR) affect approximately 1 in 600
      males and are likely to be highly heterogeneous.
    explanation: >-
      The available rate is explicitly for X-linked forms as a whole, not the
      non-syndromic class, which is the substance of this gap.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As to the families with nonsyndromal XLID which have received IDX
      numbers, their total is currently 105 (Figure 3). For 67 of these
      families, the genes have been cloned, 33 have been mapped but the genes
      have not been identified and 5 have reserved IDX numbers (IDX8, 50, 69,
      83 and 86) but have not been published.
    explanation: >-
      Shows the class is enumerated by ascertained families rather than by
      population sampling, which is why no population prevalence exists for
      it.

datasets:
- accession: geo:GSE179384
  title: The ribose methylation enzyme FTSJ1 has a conserved role in neuron morphology and learning performance
  data_type: BULK_RNA_SEQ
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  sample_count: 9
  genes:
  - preferred_term: FTSJ1
    term:
      id: hgnc:13254
      label: FTSJ1
  publication: PMID:36720500
  notes: >-
    Human lymphoblastoid material from patients with FTSJ1 loss of function,
    supporting the MRX9 subtype and the tRNA-modification arm of the
    convergence node. Selected by relevance triage from the dataset-discovery
    candidates as the only DIRECT (disease-named, human, primary-material)
    hit; the remaining candidates were GENE_ONLY matches whose biology is
    unrelated to this disease (for example TSPAN7 in pancreatic beta-cell
    exocytosis, GDI1 in yeast Ypt1 trafficking) and were rejected. No
    evidence block is attached, per the dataset-curation SOP.

notes: >-
  Scope decisions for this entry, recorded so they are auditable.

  Included as subtypes: IL1RAPL1 (MRX21), PAK3 (MRX30), GDI1 (MRX41), TSPAN7
  (MRX58), FTSJ1 (MRX9), ACSL4 (MRX63), AFF2 (FRAXE), and the non-syndromic
  arm of the ARX allelic series. Each maps to a MONDO term that is a
  descendant of MONDO:0019181 and each has a primary publication describing a
  non-syndromic presentation.

  Deliberately excluded: FGD1 (maps to Aarskog-Scott syndrome,
  MONDO:0010589 - classic syndromic facial/skeletal/genital dysmorphism),
  ZDHHC9 (maps to syndromic X-linked intellectual disability, Raymond type,
  MONDO:0010427 - "syndromic" appears in the MONDO label itself), and OPHN1
  (maps to X-linked intellectual disability-cerebellar hypoplasia syndrome,
  MONDO:0010337). All three appear in older non-syndromic gene lists but
  resolve to syndromic MONDO entities, and the curation issue for this entry
  specifies that syndromic X-linked entries stay separate. RLIM/MRX61 is also
  excluded: although MONDO:0010506 sits under this root, the 2018 clinical
  series (PMID:29728705) describes it as a syndromic X-linked intellectual
  disability and behaviour disorder, so its placement is unresolved.

  AGTR2 is excluded on evidence grounds rather than scope grounds - it is one
  of the ten genes whose involvement in XLID was specifically questioned
  against 10,563 control X chromosomes, and it remains among the unresolved
  set as of the 2017 update (see the questioned_xlid_gene_assignments
  discussion).

  SLC9A7 is curated under `genetic:` rather than as a formal subtype: the
  evidence for a non-syndromic presentation is strong (PMID:30335141), but a
  corresponding MONDO descendant term of MONDO:0019181 was not confirmed
  during curation. It should be promoted to a subtype if one is identified.

  MONDO lists over 50 descendants of MONDO:0019181, most of them numbered MRX
  entries whose causal gene is not recorded in MONDO. The subtypes modelled
  here are the well-characterised, gene-anchored members; the entry is not
  intended to enumerate the full numbered series. For orientation, the 2017
  update counts 105 non-syndromal families with IDX numbers, 67 of them with a
  cloned gene, against 141 XLID genes overall.

  This entry completes the non-syndromic intellectual-disability trio with
  Autosomal_Dominant_Non-Syndromic_Intellectual_Disability and
  Autosomal_Recessive_Non-Syndromic_Intellectual_Disability. A Grouping
  uniting the three would be a reasonable follow-up.

  No GeneReviews chapter exists for the umbrella non-syndromic X-linked
  intellectual disability class; GeneReviews coverage in this space is
  organised per syndromic gene (searched 2026-08-12), so the GeneReviews
  phenotype baseline does not apply to this entry.

  Deep research was run with Edison (falcon). The NEC preflight returned SKIP
  because MONDO records no causal gene for this umbrella term; the manual
  fallback check was performed - the report's most-discussed genes (SLC9A7,
  IQSEC2, SLC6A8, FMR1, HCFC1) are all genuine X-linked
  intellectual-disability genes and the report is unambiguously about this
  entity, so no Named Entity Confusion was found. Every PMID and snippet used
  from the report was independently fetched and verified against the cached
  reference record before use. Most of those records are abstracts; four
  snippets from PMID:31906484 quote its body text, which is present because
  that record is cached as full text.

  No `clinical_trials:` block is recorded because the search returns nothing
  for this class. A ClinicalTrials.gov query on the condition "X-linked
  intellectual disability" (API v2, run 2026-08-12) returns trials in other
  entities - predominantly syndromic ones such as Rett syndrome, fragile X
  syndrome and the mucopolysaccharidoses, alongside unrelated hits - and no
  disease-modifying interventional trial in non-syndromic XLID, which matches
  the deep-research report's own negative finding. The two studies that do
  name this population are phenotyping and natural-history research rather
  than treatment: NCT02854956 (clinical phenotyping and characterisation of
  neural networks in X-linked mental retardation - registered as
  INTERVENTIONAL, but the intervention is the phenotyping protocol, not a
  therapy; status UNKNOWN) and NCT06500260 (CNKSR2 natural-history study,
  observational). Both were verified against the registry. Listing either as a treatment would
  misrepresent them, so the negative result is recorded here instead.

  Two DR-surfaced phenotypes are deliberately not modelled. Hypotonia
  (HP:0001252) and muscle weakness (HP:0001324) are reported in the SLC9A7
  families, but only in that paper's full text - the cached record for
  PMID:30335141 is abstract-only, so no snippet can support them and the
  claim would be unverifiable. They should be added if an abstract-level
  source is found. Autistic features and seizures, by contrast, WERE added,
  because the Basque cohort paper (PMID:31906484) quantifies both at group
  level in text that is present in the cached record.

  Two of Edison's citation keys resolve to distinct papers by the same Basque
  group, and are cited here under their separately verified identities:
  "tejada2020non-syndromicxlinked" is the dedicated NS-XLID review (Tejada &
  Ibarluzea 2020, Clin Genet, PMID:31898314), and
  "ibarluzea2020targetednextgenerationsequencing" is the 82-gene panel cohort
  study (Ibarluzea et al. 2020, Genes, PMID:31906484). The DOI-to-PMID
  converter returns no PMID for the review's DOI (10.1111/cge.13698), so it
  was recovered by title search; a first pass of this curation conflated the
  two keys, and the review is the source of the class definition, the
  not-clear-cut boundary statement, and the 141-gene count recorded here.

pathophysiology:
- name: X-Linked Gene Disruption
  biological_scale: MOLECULAR
  description: >-
    Rare germline loss-of-function, hypomorphic, repeat-expansion, or
    copy-number variants in any one of a large set of genes on the X
    chromosome remove or reduce the activity of the encoded product in the
    developing and mature brain. The class is clinically homogeneous but
    genetically heterogeneous: variants at many different loci converge on the
    same single clinical outcome, and each individual gene accounts for only a
    small fraction of cases. The X chromosome is disproportionately
    represented among intellectual-disability genes relative to its size.
  evidence:
  - reference: PMID:9731525
    reference_title: "PAK3 mutation in nonsyndromic X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nonsyndromic X-linked mental retardation (MRX) syndromes are clinically
      homogeneous but genetically heterogeneous disorders, whose genetic bases
      are largely unknown.
    explanation: >-
      States the defining architecture of the class - one phenotype, many
      loci - which is why the numbered MRX series was defined by linkage
      rather than by clinical features.
  - reference: PMID:10655063
    reference_title: "A new gene involved in X-linked mental retardation identified by analysis of an X;2 balanced translocation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least five MRX genes have been identified by positional cloning, but
      each accounts for only 0.5%-1.0% of MRX cases.
    explanation: >-
      Quantifies the per-gene contribution, establishing that no single gene
      dominates this class.
  - reference: PMID:29696803
    reference_title: "X-linked intellectual disability update 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The X-chromosome comprises only about 5% of the human genome but
      accounts for about 15% of the genes currently known to be associated
      with intellectual disability.
    explanation: >-
      Quantifies the disproportionate contribution of the X chromosome to
      intellectual-disability genetics, the observation that motivated the
      field.
  downstream:
  - target: Hemizygous Male Expression of the Mutant Allele
    causal_link_type: DIRECT
    description: >-
      A variant on the single male X chromosome is expressed without a
      compensating allele. Note this edge encodes a dosage/conditioning
      relationship (hemizygosity is a property of male karyotype, not an event
      caused by the variant) rather than a downstream biochemical step;
      `DIRECT` is used because CausalLinkTypeEnum offers no conditioning
      value.

- name: Hemizygous Male Expression of the Mutant Allele
  biological_scale: CELLULAR
  description: >-
    Males carry one X chromosome, so a loss-of-function allele is expressed in
    every cell with no second copy to buffer it. Heterozygous females are
    mosaic, because random X-chromosome
    inactivation silences one X per cell, so the mutant allele is expressed in
    only a subset of cells; such carriers are typically unaffected or mildly
    affected, and in several subtypes completely skewed X-inactivation
    silences the mutant X entirely. This dosage asymmetry is the mechanistic
    basis of the male excess observed among people with intellectual
    disability, and the mosaicism is the principal obstacle to studying the
    circuit pathophysiology in females.
  evidence:
  - reference: PMID:23871722
    reference_title: "XLID-causing mutations and associated genes challenged in light of data from large-scale human exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the unbalanced sex ratio (1.3-1.4 to 1) observed in
      intellectual disability (ID) and the identification of large ID-affected
      families showing X-linked segregation, much attention has been focused
      on the genetics of X-linked ID (XLID).
    explanation: >-
      Quantifies the male excess that hemizygous expression explains and that
      motivated the field's focus on the X chromosome.
  - reference: PMID:38424476
    reference_title: "Overcoming genetic and cellular complexity to study the pathophysiology of X-linked intellectual disabilities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This mosaic expression produces substantial complexity, especially when
      attempting to study the already complicated neural circuits that underly
      behavior, thus impeding the understanding of disease-related
      pathophysiology and the development of therapeutics.
    explanation: >-
      Establishes the consequence of female mosaicism for mechanistic study
      and therapeutic development in this class. Tagged OTHER: the quoted
      sentence is a methodological statement about the difficulty of studying
      mosaic neural circuits, not a human clinical observation.
  - reference: PMID:11889465
    reference_title: "FACL4, encoding fatty acid-CoA ligase 4, is mutated in nonspecific X-linked mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All carrier females with either point mutations or genomic deletions in
      FACL4 showed a completely skewed X-inactivation, suggesting that the
      gene influences survival advantage.
    explanation: >-
      Demonstrates the complete X-inactivation skewing that spares carrier
      females in this class.
  downstream:
  - target: Convergent Disruption of Neuronal Function
    causal_link_type: DIRECT
    description: >-
      Loss of the gene product in neurons impairs the synaptic processes it
      supports.


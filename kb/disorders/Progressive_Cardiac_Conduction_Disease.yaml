    causal_link_type: DIRECT
- name: Progressive Atrioventricular and Bundle-Branch Block
  biological_scale: ORGANISM
  role: effector
  description: >-
    Conduction slowing, amplified by fibrosis, progresses over years to
    higher-grade block: right or left bundle-branch block, hemiblock, and
    increasing degrees of atrioventricular block up to complete heart block. The
    hallmark of the disease is that this block aggravates with aging, often
    culminating in the need for a permanent pacemaker.
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:

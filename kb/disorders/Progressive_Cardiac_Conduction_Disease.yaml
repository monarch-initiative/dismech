    term:
      id: GO:0005248
      label: voltage-gated sodium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16643399
    reference_title: "Progressive cardiac conduction defect is the prevailing phenotype in carriers of a Brugada syndrome SCN5A mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in the SCN5A gene encoding the cardiac sodium channel are responsible for Brugada syndrome (BS) and also for progressive cardiac conduction disease (inherited Lenègre disease)"
    explanation: >-
      Identifies SCN5A loss of function as the causal lesion of PCCD.
  - reference: PMID:12747584
    reference_title: "Cardiac sodium channel diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is now appropriate to consider the "sodium channel syndrome" as a unique
      clinical entity that may manifest itself with a spectrum of possible
      phenotypes.
    explanation: >-
      Places PCCD (Lev-Lenègre) within the SCN5A sodium-channel-disease spectrum
      alongside Brugada syndrome and LQT3. Evidence source is OTHER because this is
      a review.
  downstream:
  - target: Reduced Sodium Current and Conduction Slowing
    causal_link_type: DIRECT
    description: >-
      Reduced Nav1.5 current slows the upstroke of the action potential and thereby
      impulse conduction through the His-Purkinje and AV conduction tissue.
- name: Reduced Sodium Current and Conduction Slowing
  biological_scale: CELLULAR
  role: effector
  description: >-
    Reduced Nav1.5 sodium current slows the rate of rise of the cardiac action
    potential, which slows impulse propagation through the His-Purkinje system and
    atrioventricular node. On the surface ECG this manifests as progressive
    lengthening of the P-wave and the PR and QRS intervals, the electrocardiographic
    signature of conduction slowing.
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Cardiac Conduction
    term:
      id: GO:0061337
      label: cardiac conduction
    modifier: DECREASED
  evidence:
  - reference: PMID:15809371
    reference_title: "Mouse model of SCN5A-linked hereditary Lenègre's disease: age-related conduction slowing and myocardial fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scn5a+/- mice showed extensive fibrosis of their ventricular myocardium"
    explanation: >-
      The Scn5a heterozygous-knockout Lenègre model, which recapitulates
      age-related conduction slowing (P/PR/QRS lengthening) and myocardial fibrosis
      driven by the sodium-channel deficit.
  downstream:
  - target: Age-Related Conduction-System Fibrosis
    causal_link_type: DIRECT
    description: >-
      The chronic sodium-channel deficit is accompanied by progressive fibrotic
      remodeling of the conduction system and myocardium with aging.
  - target: Progressive Atrioventricular and Bundle-Branch Block
    causal_link_type: DIRECT
    description: >-
      Conduction slowing progresses to frank block in the AV node and bundle
      branches.
- name: Age-Related Conduction-System Fibrosis
  biological_scale: TISSUE
  role: amplifier
  description: >-
    A distinctive feature of SCN5A-linked PCCD is that a monogenic ion-channel
    defect progressively produces structural change: with aging the ventricular
    myocardium and conduction system develop extensive fibrosis, which further
    degrades conduction and accounts for the relentless, age-dependent progression
    of block. This was the first demonstration that a primary channelopathy can
    drive myocardial structural anomalies.
  cell_types:
  - preferred_term: Cardiac Fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: Extracellular Matrix Organization

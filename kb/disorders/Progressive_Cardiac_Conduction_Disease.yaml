inheritance:
- name: Autosomal dominant
  description: >-
    PCCD is inherited as an autosomal dominant trait; a single loss-of-function
    SCN5A allele produces disease in affected families, with conduction impairment
    that progresses with age. Allelic overlap with Brugada syndrome means the same
    SCN5A variant can produce either or both phenotypes within a family.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:16643399
    reference_title: "Progressive cardiac conduction defect is the prevailing phenotype in carriers of a Brugada syndrome SCN5A mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function mutations in the SCN5A gene encoding the cardiac sodium channel are responsible for Brugada syndrome (BS) and also for progressive cardiac conduction disease (inherited Lenègre disease)"
    explanation: >-
      Establishes SCN5A loss of function as the Mendelian cause of PCCD (inherited
      Lenègre disease) and its allelic overlap with Brugada syndrome, in a family
      carrier cohort.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No precise population rate is established for the inherited (SCN5A) form of
    progressive cardiac conduction disease; acquired age-related conduction disease
    is common, but the monogenic form is rare.
pathophysiology:
- name: SCN5A Loss-of-Function Variant in the Cardiac Sodium Channel
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  description: >-
    The prototypical initiating lesion in PCCD is a loss-of-function variant in
    SCN5A, encoding the alpha subunit of the cardiac voltage-gated sodium channel
    Nav1.5 that carries the depolarizing sodium current (INa) responsible for rapid
    impulse conduction. The same loss-of-function SCN5A alleles underlie Brugada
    syndrome, so PCCD sits within the sodium-channel-disease spectrum; other PCCD
    genes include TRPM4.

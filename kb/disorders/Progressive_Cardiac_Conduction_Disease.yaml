treatments:
- name: Permanent Pacemaker Implantation
  description: >-
    Permanent pacemaker implantation is the definitive treatment for symptomatic
    high-grade atrioventricular or bundle-branch block, restoring adequate
    ventricular rate and preventing syncope and asystolic death.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: pacemaker placement
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
notes: >-
  Scope. This entry fills the gap of a dedicated progressive cardiac conduction
  disease (Lenègre-Lev) entity; previously the KB represented conduction disease
  only piecemeal (Mobitz type I AV block, sinoatrial block, atrial standstill, and
  secondarily via LMNA/Emery-Dreifuss). It is curated as the SCN5A-prototypical
  inherited form. Only the trigger node conforms to the
  cardiac_ion_channel_repolarization module (at its "Cardiac Ion-Channel or
  Calcium-Handling Variant" node): PCCD is a bona fide cardiac sodium channelopathy,
  but its downstream phenotype is His-Purkinje/AV conduction block rather than the
  module's sinoatrial-automaticity or ventricular-tachyarrhythmia branches, so the
  disease-specific conduction chain is modeled here rather than mapped onto those
  branches. Allelic overlap with Brugada syndrome (shared SCN5A loss of function) is
  recorded; TRPM4 and, in overlap syndromes, SCN1B are additional genes.

  GeneReviews scope. GeneReviews has no chapter for progressive cardiac
  conduction disease itself, and none is tagged in `references`. The nearest
  cached SCN5A resource is the Brugada Syndrome chapter (PMID:20301690), which
  covers a distinct allelic entity rather than this one and is content_type
  abstract_only in any case, so no clinical section could be mined from it. The
  clinical-characteristics baseline for this entry is therefore built entirely
  from the primary literature cited throughout, principally PMID:16643399,
  PMID:15809371.

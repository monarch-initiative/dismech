- name: Syncope, Pacemaker Dependence and Sudden Death Risk
  biological_scale: ORGANISM
  role: consequence
  description: >-
    High-grade atrioventricular block and bradyarrhythmia reduce cerebral and
    systemic perfusion, producing syncope (Stokes-Adams attacks) and, if untreated,
    a risk of sudden death from asystole. Definitive treatment of symptomatic
    high-grade block is permanent pacemaker implantation, on which affected
    individuals become dependent.
  cell_types:

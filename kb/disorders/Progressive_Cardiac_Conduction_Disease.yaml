      label: extracellular matrix organization
    modifier: INCREASED
  evidence:
  - reference: PMID:15809371
    reference_title: "Mouse model of SCN5A-linked hereditary Lenègre's disease: age-related conduction slowing and myocardial fibrosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a monogenic ion channel defect can progressively lead to myocardial structural anomalies"
    explanation: >-
      Establishes that the SCN5A channel defect drives progressive myocardial
      fibrosis/structural remodeling, the amplifier of age-related conduction
      failure.
  downstream:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "conduction defect progressively aggravated with aging leading in five occasions to pacemaker implantations"
    explanation: >-
      Documents the defining age-related progression of conduction block to
      pacemaker requirement in SCN5A carriers.
  downstream:

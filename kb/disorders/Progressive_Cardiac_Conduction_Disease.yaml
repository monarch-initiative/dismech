name: Progressive Cardiac Conduction Disease
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- PCCD
- progressive familial heart block
- hereditary Lenegre disease
- Lenegre-Lev disease
- progressive cardiac conduction defect
- hereditary bundle branch system defect
description: >-
  Progressive cardiac conduction disease (PCCD), historically Lenègre-Lev disease,
  is the inherited, progressive impairment of impulse propagation through the
  cardiac conduction system (His-Purkinje network and atrioventricular node) in the
  absence of a primary structural cardiomyopathy. Its prototypical Mendelian cause
  is a loss-of-function variant in SCN5A, the gene encoding the main pore-forming
  subunit of the cardiac voltage-gated sodium channel Nav1.5; reduced sodium current
  slows conduction, and the deficit worsens with age as the conduction system
  fibroses, producing progressive PR and QRS prolongation, bundle-branch and
  atrioventricular block, syncope, pacemaker dependence, and a risk of sudden death.
  PCCD is one phenotype of the SCN5A "sodium channel disease" spectrum and overlaps
  allelically with Brugada syndrome (which shares SCN5A loss of function); other
  genes include TRPM4 and, in overlap syndromes, SCN1B and TRPM4. Inheritance is
  autosomal dominant.

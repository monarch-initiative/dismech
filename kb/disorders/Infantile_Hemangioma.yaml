phenotypes:
- category: Dermatologic
  name: Cutaneous Hemangioma
  description: >-
    The tumor of the skin. A precursor mark was present at birth in 65 per
    cent of a series of 30 infants with tumors of the face, and every tumor
    had appeared by three months in the cohort followed from birth. A
    superficial tumor is bright red; a deep one lies under skin of normal or
    bluish color and is soft enough to compress; a mixed one is both. Growth
    is fastest between five and a half and seven and a half weeks of age. The
    tumor reaches 80 per cent of its final size at about three months and has
    stopped growing by about five months in most children, although deep and
    segmental tumors grow for longer. In a review, 60 per cent of tumors are
    on the head and neck; in the cohort followed from birth most were on the
    trunk, and a fifth were small flat lesions that hardly grew.
  phenotype_term:
    preferred_term: infantile hemangioma of the skin
    term:
      id: HP:0005306
      label: Capillary hemangioma

- name: Neuroblastoma
  description: >-
    A malignant tumor that has been mistaken for hemangiomas. Neuroblastoma
    can spread to the liver and, rarely, to the skin, where it forms blue
    nodules; these are the two places where hemangiomas are also multiple. In
    one report a girl of four months who had a known hemangioma developed new
    nodules and a large liver and spleen, which were first put down to
    hemangioma and proved to be metastatic neuroblastoma. In another, a boy of
    nine months with nodules taken for deep hemangiomas had been started on
    propranolol before ultrasound showed nodules without increased blood flow
    and an adrenal mass. In an imaging series of liver lesions in infants of
    up to 100 days, one of the ten lesions that were not hemangiomas was a
    metastasis of neuroblastoma. It is curated separately as Neuroblastoma.
  distinguishing_features:
  - Firm nodules that cannot be compressed, where a deep hemangioma is soft and compressible
  - No increased blood flow in the nodules on Doppler ultrasound
  - New lesions that appear after the first months of life
  - An adrenal mass on abdominal ultrasound, and neuroblastoma on biopsy of a nodule
  disease_term:
    preferred_term: neuroblastoma
    term:
      id: MONDO:0005072
      label: neuroblastoma

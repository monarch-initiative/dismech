diagnosis:
- name: Clinical Examination
  description: >-
    Most hemangiomas are diagnosed from the history and the look of the
    lesion: a mark that was absent or faint at birth, grew in the first weeks,
    and is soft. Features that do not fit call for imaging or a biopsy. They
    include a mass that is fully formed at birth, a firm mass that cannot be
    compressed, and new lesions after the first months of life.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Most IHs can be diagnosed clinically through history taking and physical examinations."
    explanation: >-
      A 2021 review: most are diagnosed clinically.
  - reference: PMID:39640139
    reference_title: "Metastatic Neuroblastoma Mimicking Multiple Infantile Hemangiomas Diagnosed With Ultrasound."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our report demonstrates that atypical features include lesions that are noncompressible or appear after the first few months of a child’s life."
    explanation: >-
      A case report of neuroblastoma taken for hemangiomas names the atypical
      features: lesions that cannot be compressed or that appear after the
      first few months.
  - reference: PMID:27910123
    reference_title: "Congenital infantile fibrosarcoma mimicking a cutaneous vascular lesion: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinically, these tumors differ from hemangiomas in the time of onset, morphology, and growth pattern and must be evaluated histologically for definitive diagnosis."
    explanation: >-
      A case report and review of infantile fibrosarcoma: it differs from
      hemangioma in time of onset, shape and growth, and needs histology.
- name: Doppler Ultrasonography
  description: >-
    The first imaging test. It is advised when the diagnosis is uncertain,
    when the tumor grows explosively or for too long, when there are five or
    more tumors of the skin, and when an associated anomaly is suspected. A
    hemangioma is a well-defined solid mass with high blood flow and no
    arteriovenous shunting. In a reported case, nodules that had been taken
    for deep hemangiomas showed no increase in blood flow, and the examination
    went on to find an adrenal mass.
  diagnosis_term:
    preferred_term: Doppler ultrasonography
    term:
      id: NCIT:C62781
      label: Doppler Ultrasound
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "US with Doppler is the imaging modality of choice for IH assessment and is recommended when the diagnosis of IH is uncertain, when IHs show explosive or prolonged growth without involution, to differentiate IHs from malignant vascular tumors or vascular malformations, when there are 5 or more cutaneous IHs, or when the association with anatomic abnormalities such as PHACE syndrome or LUMBAR syndrome is suspected"
    explanation: >-
      A 2021 review: Doppler ultrasound is the imaging method of choice, with
      its indications.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "On US with Doppler, IHs appear as well-defined solid masses with high-flow vascularity but without arteriovenous shunting"
    explanation: >-
      The appearance of a hemangioma on Doppler ultrasound.
  - reference: PMID:39640139
    reference_title: "Metastatic Neuroblastoma Mimicking Multiple Infantile Hemangiomas Diagnosed With Ultrasound."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ultrasound revealed a lack of increased vascularity of the masses and an adrenal mass, leading to a biopsy and diagnosis of a neuroblastoma involving the adrenal gland, liver, and skin."
    explanation: >-
      The case report: no increased vascularity in the nodules, and an adrenal
      mass.
- name: GLUT1 Immunohistochemistry
  description: >-
    A biopsy is seldom needed. When one is taken, staining of the endothelium
    for GLUT1 identifies infantile hemangioma at any stage, in the skin and in
    the liver, and separates it from congenital hemangioma, vascular
    malformations and pyogenic granuloma. The stain is not specific in an
    absolute sense: 3 of 12 angiosarcomas showed focal staining in the same
    study.
  diagnosis_term:
    preferred_term: GLUT1 immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:10665907
    reference_title: "GLUT1: a newly discovered immunohistochemical marker for juvenile hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings establish GLUT1 immunoreactivity as a highly selective and diagnostically useful marker for juvenile hemangiomas."
    explanation: >-
      The study that introduced the stain: a highly selective and
      diagnostically useful marker.
  - reference: PMID:10665907
    reference_title: "GLUT1: a newly discovered immunohistochemical marker for juvenile hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a retrospective study, we found intense endothelial GLUT1 immunoreactivity, involving more than 50% of lesional microvessels, in 97% (139 of 143) of juvenile hemangiomas from patients aged 1 month to 11 years."
    explanation: >-
      Positive in 139 of 143 hemangiomas.
  - reference: PMID:10665907
    reference_title: "GLUT1: a newly discovered immunohistochemical marker for juvenile hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "No endothelial GLUT1 immunoreactivity was found in any of 66 vascular malformations (17 arteriovenous, 33 venous, 11 lymphatic, and 5 port-wine) from patients aged 5 days to 75 years, or in any of 20 pyogenic granulomas or 7 granulation tissue specimens."
    explanation: >-
      Negative in all 66 vascular malformations and all 20 pyogenic
      granulomas.
  - reference: PMID:10665907
    reference_title: "GLUT1: a newly discovered immunohistochemical marker for juvenile hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Focal GLUT1 immunoreactivity was found in 3 of 12 angiosarcomas, but not in any of 5 hemangioendotheliomas (epithelioid or infantile kaposiform)."
    explanation: >-
      Focal staining in 3 of 12 angiosarcomas; none in 5
      hemangioendotheliomas.
  - reference: PMID:14991538
    reference_title: "GLUT1 endothelial reactivity distinguishes hepatic infantile hemangioma from congenital hepatic vascular malformation with associated capillary proliferation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that there are two fundamentally different hepatic vascular lesions in infants and young children: GLUT1-positive hepatic infantile hemangioma (HIH) and GLUT1-negative hepatic vascular malformation with capillary proliferation (HVMCP)."
    explanation: >-
      In the liver, GLUT1 separates infantile hemangioma from a vascular
      malformation with capillary proliferation.
- name: MRI and MRA for Associated Anomalies
  description: >-
    A segmental hemangioma, or one larger than 5 cm, on the face or scalp can
    be part of PHACE syndrome, in which the hemangioma comes with anomalies of
    the brain, the arteries of the head and neck, the heart and aorta, and the
    eyes. In a prospective study of 108 infants with large facial hemangiomas,
    33 had the syndrome; anomalies of the arteries of the brain were found in
    91 per cent of them and of the heart in 67 per cent. Magnetic resonance
    imaging and angiography of the head and neck, with echocardiography, look
    for them. A segmental hemangioma over the lower spine or pelvis calls for
    imaging of the spine, because it can be part of LUMBAR syndrome.
  diagnosis_term:
    preferred_term: magnetic resonance imaging and angiography
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:19858157
    reference_title: "Consensus Statement on Diagnostic Criteria for PHACE Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "A subgroup of patients with infantile hemangiomas have associated structural anomalies of the brain, cerebral vasculature, eyes, sternum, and/or aorta in the neurocutaneous disorder known as PHACE syndrome."
    explanation: >-
      The opening of the 2009 consensus statement: a subgroup of patients have
      the associated anomalies.
  - reference: PMID:19858157
    reference_title: "Consensus Statement on Diagnostic Criteria for PHACE Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Definite PHACE requires the presence of a characteristic segmental hemangioma or hemangioma >5 cm on the face or scalp plus 1 major criterion or 2 minor criteria."
    explanation: >-
      The consensus criteria: definite PHACE needs a segmental hemangioma, or
      one larger than 5 cm, on the face or scalp plus one major or two minor
      criteria.
  - reference: PMID:20643720
    reference_title: "Risk for PHACE syndrome in infants with large facial hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-three (31%) of 108 had PHACE."
    explanation: >-
      The prospective study: 33 of 108 infants with large facial hemangiomas.
  - reference: PMID:20643720
    reference_title: "Risk for PHACE syndrome in infants with large facial hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common extracutaneous anomalies observed in infants with PHACE were of the arteries of the cerebrovasculature (91%) and cardiac anomalies (67%)."
    explanation: >-
      The commonest anomalies in those 33: cerebrovascular arteries and the
      heart.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants with a large (>5 cm in diameter) segmentally patterned facial or scalp IHs are at risk for PHACE syndrome, and MRI and/or MRA of the head and neck (including the aortic arch and brachiocephalic origin) and echocardiography are recommended for further evaluation"
    explanation: >-
      A 2021 review: MRI or MRA of the head and neck and echocardiography for
      a large segmental hemangioma of the face or scalp.
  - reference: PMID:38759778
    reference_title: "Delphi Consensus on Diagnostic Criteria for LUMBAR Syndrome."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of LUMBAR requires the presence of a segmental, or patterned, infantile hemangioma of the lumbosacral, sacrococcygeal, or pelvic cutaneous regions plus one additional criterion of the urogenital, spinal, bony, anorectal, arterial, or renal organ systems."
    explanation: >-
      The 2024 consensus criteria for LUMBAR syndrome.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants with large segmental IHs on the lower half of the body are at risk for LUMBAR syndrome, for which spine MRI is recommended, especially in the presence of sacral dimples, skin appendages, hair tufts, or lipomas."
    explanation: >-
      The review: spine MRI for large segmental hemangiomas of the lower half
      of the body.
- name: Ultrasound Screening of the Liver
  description: >-
    Infants with many hemangiomas of the skin are screened for hemangiomas of
    the liver by abdominal ultrasound. A prospective study of 1,656 infants
    found that five skin tumors was the best cut-off and recommends screening
    infants younger than nine months who have five or more.
  diagnosis_term:
    preferred_term: abdominal ultrasonography
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:33285272
    reference_title: "Screening for infantile hepatic hemangioma in patients with cutaneous infantile hemangioma: A multicenter prospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 676 patients with at least 3 cutaneous IHs and 980 patients with 1 or 2 focal cutaneous IHs were enrolled. Thirty-one patients were found to have IHH."
    explanation: >-
      The study: 31 hepatic hemangiomas among 1,656 infants.
  - reference: PMID:33285272
    reference_title: "Screening for infantile hepatic hemangioma in patients with cutaneous infantile hemangioma: A multicenter prospective study."

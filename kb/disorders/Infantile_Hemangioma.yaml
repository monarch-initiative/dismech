  preferred_term: infantile hemangioma
  term:
    id: MONDO:0011191
    label: capillary infantile hemangioma
has_subtypes:
- name: Hepatic
  display_name: Infantile hepatic hemangioma
  description: >-
    Infantile hemangioma of the liver. Its endothelium is GLUT1-positive, like
    that of the tumor in the skin. It is usually multifocal or diffuse; a
    single liver lesion present at birth is usually a congenital hemangioma.
    Most multifocal lesions cause no symptoms. The complications are heart
    failure from blood shunted through the tumors, hypothyroidism from an
    enzyme made by the tumor and, in diffuse disease, a liver large enough to
    compress the abdomen. In a prospective screening study, five or more
    hemangiomas of the skin was the best cut-off for examining the liver by
    ultrasound. The older name hepatic hemangioendothelioma should no longer
    be used for it.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  mappings:
    ncit_mappings:
    - term:
        id: NCIT:C96840
        label: Liver Infantile Hemangioma
      mapping_predicate: skos:exactMatch
      mapping_source: NCIT
      mapping_justification: NCIT concept for infantile hemangioma of the liver.
  evidence:
  - reference: PMID:14991538
    reference_title: "GLUT1 endothelial reactivity distinguishes hepatic infantile hemangioma from congenital hepatic vascular malformation with associated capillary proliferation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results indicate that there are two fundamentally different hepatic vascular lesions in infants and young children: GLUT1-positive hepatic infantile hemangioma (HIH) and GLUT1-negative hepatic vascular malformation with capillary proliferation (HVMCP)."
    explanation: >-
      A pathology review of 19 liver vascular lesions of infants and young
      children: the infantile hemangioma of the liver is GLUT1-positive, and
      the lesion it was confused with, a vascular malformation with capillary
      proliferation, is GLUT1-negative.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatic IHs usually present as a multifocal or diffuse hepatic distribution, whereas congenital hepatic hemangiomas present as a focal hepatic lesion"
    explanation: >-
      A 2021 review: infantile hemangiomas of the liver are usually multifocal
      or diffuse, and congenital ones focal.
  - reference: PMID:17208542
    reference_title: "Hepatic hemangiomas: subtype classification and development of a clinical practice algorithm and registry."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that hepatic hemangiomas do not represent a single entity but, rather, 3 principle categories of lesions: focal, multifocal, and diffuse."
    explanation: >-
      The classification proposed in 2007 from radiology and pathology
      studies: focal, multifocal and diffuse lesions.
  - reference: PMID:17208542
    reference_title: "Hepatic hemangiomas: subtype classification and development of a clinical practice algorithm and registry."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations range from asymptomatic self-limiting lesions to congestive heart failure associated with high-volume vascular shunting to fulminant hepatic failure with hypothyroidism, abdominal compartment syndrome, and death."
    explanation: >-
      The same paper gives the range of presentations, from no symptoms to
      heart failure, liver failure with hypothyroidism, abdominal compartment
      syndrome and death.
  - reference: PMID:33285272
    reference_title: "Screening for infantile hepatic hemangioma in patients with cutaneous infantile hemangioma: A multicenter prospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 676 patients with at least 3 cutaneous IHs and 980 patients with 1 or 2 focal cutaneous IHs were enrolled. Thirty-one patients were found to have IHH."
    explanation: >-
      A prospective screening study of 1,656 infants with hemangiomas of the
      skin: 31 had a hemangioma of the liver.
  - reference: PMID:33285272
    reference_title: "Screening for infantile hepatic hemangioma in patients with cutaneous infantile hemangioma: A multicenter prospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Receiver operating characteristic curve analysis showed that 5 cutaneous IHs was the optimal cutoff point to screen for IHH, with an area under the curve of 0.872"
    explanation: >-
      The same study: five hemangiomas of the skin was the best cut-off for
      screening the liver.
  - reference: PMID:30244993
    reference_title: "Guidance Document for Hepatic Hemangioma (Infantile and Congenital) Evaluation and Monitoring."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend against using the term \"hemangioma\" for any vascular malformations affecting the liver or any hypervascular tumors that are not characterized by the approved definitions. We recommend against using the term \"hemangioendothelioma\" for infantile or congenital hemangioma."
    explanation: >-
      A consensus document of 2018 on naming: hemangioma is not to be used for
      vascular malformations of the liver, and hemangioendothelioma is not to
      be used for infantile or congenital hemangioma.
prevalence:
- population: Infants born at one hospital in San Diego, California, and followed from birth to nine months
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4500.0
  notes: >-
    27 of 594 infants had an infantile hemangioma, which the authors report as
    an incidence of 4.5 per cent. It is the proportion of a birth cohort that
    had the tumor at any time in the first nine months of life, so it is
    recorded as a period prevalence. Every tumor had appeared by three months.
    Follow-up at three months was available for 83 per cent of the infants, so
    the figure may be too low. A second paper reports the same cohort. A
    clinical practice guideline gives as many as 5 per cent of infants.
  evidence:
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated 594 infants: 34 haemangiomas ... were identified in 29 infants, yielding an incidence of 4·5% for IH (27 infants)"
    explanation: >-
      The birth cohort: 594 infants, of whom 27 had an infantile hemangioma
      (4.5 per cent). The words left out are a bracketed gloss that says the
      34 lesions were infantile or congenital.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up data at three months was available for 83% of infants."
    explanation: >-
      The same study: follow-up at three months was available for 83 per cent
      of the infants.
  - reference: PMID:22497908
    reference_title: "A prospective study of cutaneous findings in newborns in the United States: correlation with race, ethnicity, and gestational status using updated classification and nomenclature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common vascular lesion was nevus simplex (83%), followed by infantile hemangioma (4.5% by age 3 months), capillary malformation (0.3%), and rapidly involuting congenital hemangioma (0.3%)."
    explanation: >-
      An earlier report of the same cohort of 594 infants: infantile
      hemangioma in 4.5 per cent by the age of three months.
  - reference: PMID:30584062
    reference_title: "Clinical Practice Guideline for the Management of Infantile Hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Infantile hemangiomas (IHs) occur in as many as 5% of infants, making them the most common benign tumor of infancy. Most IHs are small, innocuous, self-resolving, and require no treatment."
    explanation: >-
      The 2019 guideline of the American Academy of Pediatrics: as many as 5
      per cent of infants.
epidemiology:
- name: Sex and ethnicity
  description: >-
    More girls than boys are affected. The excess is large in children
    referred to clinics or treated and small in children followed from birth.
    In a referral cohort of 1,058 children, those with hemangiomas were more
    often female and more often white non-Hispanic than births in general. In
    a cohort of twins the ratio of girls to boys among those with a hemangioma
    was 1.9 to 1, and 76 per cent of the 377 infants in a treatment trial were
    girls. In the cohort followed from birth, 53 per cent of the lesions were
    in girls, and no link with white race was found.
  evidence:
  - reference: PMID:17307549
    reference_title: "Prospective study of infantile hemangiomas: demographic, prenatal, and perinatal characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison with the 2002 United States National Vital Statistics System birth data, we found that infants with hemangiomas were more likely to be female, white non-Hispanic, premature (P < .0001) and the product of a multiple gestation (10.6% versus 3.1%; P < .001)."
    explanation: >-
      The referral cohort compared with United States birth data of 2002:
      children with hemangiomas were more likely to be female and white
      non-Hispanic.
  - reference: PMID:26863906
    reference_title: "Infantile Hemangiomas in Twins: A Prospective Cohort Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The female-to-male ratio was 1.7:1 in the entire cohort and 1.9:1 in those with IH."
    explanation: >-
      A prospective cohort of 202 sets of twins: 1.9 girls for each boy among
      those with a hemangioma.
  - reference: PMID:33856430
    reference_title: "Efficacy and Safety of Propranolol vs Atenolol in Infants With Problematic Infantile Hemangiomas: A Randomized Clinical Trial."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 377 participants, 287 (76.1%) were female"
    explanation: >-
      A randomized trial of treatment in China: 287 of 377 infants were girls.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A majority (53%) of lesions occurred in females, but not at the extreme F:M ratio of 4:1 that has been previously cited"
    explanation: >-
      The cohort followed from birth: 53 per cent of the lesions were in
      girls, a smaller excess than the ratio of 4 to 1 quoted before it.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not note a significant association with Caucasian race."
    explanation: >-
      The same cohort found no significant link with white race.
- name: Prematurity and low birth weight
  description: >-
    The earlier and the smaller a child is born, the higher the risk. In the
    cohort followed from birth, 3.9 per cent of infants born at term had a
    hemangioma and 14.3 per cent of those born at 32 weeks or earlier. Among
    64 pairs of twins whose weights differed by 10 per cent or more and of
    whom only one had a hemangioma, the smaller twin was the affected one in
    62.5 per cent.
  evidence:
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 3.9% of term infants were affected, while the incidence increased to 14.3% for extremely premature infants (Table 2), confirming the importance of gestational age as a risk factor for IH."
    explanation: >-
      The birth cohort: 3.9 per cent of term infants and 14.3 per cent of
      extremely premature infants.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Very low birth weight (p=0.028) and extreme prematurity (p=0.016) were found to be significant risk factors for the development of infantile hemangiomas."
    explanation: >-
      The same cohort: very low birth weight and extreme prematurity were
      significant risk factors.
  - reference: PMID:17307549
    reference_title: "Prospective study of infantile hemangiomas: demographic, prenatal, and perinatal characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison with the 2002 United States National Vital Statistics System birth data, we found that infants with hemangiomas were more likely to be female, white non-Hispanic, premature (P < .0001) and the product of a multiple gestation (10.6% versus 3.1%; P < .001)."
    explanation: >-
      The referral cohort: children with hemangiomas were more likely to have
      been born prematurely.
  - reference: PMID:26863906
    reference_title: "Infantile Hemangiomas in Twins: A Prospective Cohort Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "of the 64 sets of twins with 10% or greater difference in weight, the smaller twin had IH in 62.5% (n = 40) of cases, versus 37.5% (n = 24) of cases in which the higher-birthweight twin was affected"
    explanation: >-
      Twins whose weights differed by 10 per cent or more: the smaller twin
      was affected in 40 of 64 pairs and the larger in 24.
- name: Twin and multiple births
  description: >-
    Twins are over-represented among children with hemangiomas: 10.6 per cent
    of the referral cohort came from a multiple pregnancy against 3.1 per cent
    of births in general. In the cohort followed from birth, 11 per cent of
    twins had a hemangioma, but the excess was not significant, and the
    authors put it down to the prematurity and low birth weight of twins.
  evidence:
  - reference: PMID:17307549
    reference_title: "Prospective study of infantile hemangiomas: demographic, prenatal, and perinatal characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison with the 2002 United States National Vital Statistics System birth data, we found that infants with hemangiomas were more likely to be female, white non-Hispanic, premature (P < .0001) and the product of a multiple gestation (10.6% versus 3.1%; P < .001)."
    explanation: >-
      The referral cohort: 10.6 per cent from a multiple gestation against 3.1
      per cent of births.
  - reference: PMID:26863906
    reference_title: "Infantile Hemangiomas in Twins: A Prospective Cohort Study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Twins have a higher-than-expected risk of infantile hemangiomas (IHs), but the exact reasons for this association are not clear."
    explanation: >-
      The opening of the twin study states that twins have a higher risk than
      expected and that the reason is not clear.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 11% of infants from twin gestations developed IH, statistical significance was not achieved due to confounding factors of prematurity and low birth weight in twins."
    explanation: >-
      The birth cohort: 11 per cent of twins were affected, without
      statistical significance, which the authors attribute to confounding by
      prematurity and low birth weight.
- name: Placental abnormalities and chorionic villus sampling
  description: >-
    Abnormalities of the placenta are about twice as common in pregnancies
    that lead to a child with a hemangioma: 10 of 29 placentas in the birth
    cohort, against 16.9 per cent of the others. The commonest were
    pre-eclampsia and placenta previa, which were also more common in the
    referral cohort than in births in general. In a cohort of 375 children
    whose mothers had a prenatal test, a hemangioma was found in 27.2 per cent
    after transcervical chorionic villus sampling and in 9.4 per cent after
    amniocentesis.
  evidence:
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten of 29 placentas (34.5%) from pregnancies with affected infants exhibited a placental or cord abnormality associated with abnormal placental perfusion."
    explanation: >-
      The birth cohort: 10 of 29 placentas of affected infants had an
      abnormality of the placenta or cord.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Placental anomalies were noted in almost 35% of haemangioma-related pregnancies, approximately twice the incidence noted in pregnancies with unaffected infants"
    explanation: >-
      The abstract of the same study: about twice the rate seen in pregnancies
      with unaffected infants.
  - reference: PMID:17307549
    reference_title: "Prospective study of infantile hemangiomas: demographic, prenatal, and perinatal characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal age was significantly higher (P < .0001), and placenta previa (3.1%) and pre-eclampsia (11.8%) were more common."
    explanation: >-
      The referral cohort: older mothers, and more placenta previa and
      pre-eclampsia, than in births in general.
  - reference: PMID:20824891
    reference_title: "Hemangioma in the newborn: increased incidence after chorionic villus sampling."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "One or more hemangiomas were present in 53 of 195 (27.2%) children in the CVS group versus 17 of 180 (9.4%) children in the amniocentesis group (odds ratio 3.6, 95% CI: 2.0-6.5)."
    explanation: >-
      A cohort study of 500 consecutive prenatal procedures: hemangiomas in 53
      of 195 children after chorionic villus sampling and in 17 of 180 after
      amniocentesis.
- name: Share of hemangiomas that need treatment
  description: >-
    The share depends on who is counted. In the cohort followed from birth,
    one of the 32 infantile hemangiomas needed treatment. Reviews and a
    consensus report put the share at about 10 to 12 per cent. In the referral
    cohort, 24 per cent of children had a complication and 38 per cent were
    treated, and segmental hemangiomas were 11 times more likely to have a
    complication than localized ones.
  evidence:
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, 20% of identified IHs were abortive or telangiectatic in nature, small focal lesions that did not proliferate beyond 3 months of age. Only one IH required intervention."
    explanation: >-
      The birth cohort: only one hemangioma required intervention. A fifth
      were abortive or telangiectatic lesions that did not grow beyond three
      months.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the spontaneous involution, most IHs do not require treatment, but about 10% of cases require early treatment due to size, location, and complications"
    explanation: >-
      A 2021 review: about 10 per cent of cases need early treatment.
  - reference: PMID:23266923
    reference_title: "Initiation and use of propranolol for infantile hemangioma: report of a consensus conference."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most are not worrisome, ∼12% of IHs are significantly complex, requiring referral to specialists for consideration of treatment."
    explanation: >-
      The introduction of a 2013 consensus report: about 12 per cent are
      complex enough to be referred.
  - reference: PMID:16950977
    reference_title: "Prospective study of infantile hemangiomas: clinical characteristics predicting complications and treatment."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-four percent of patients experienced complications related to their hemangioma(s), and 38% of our patients received some form of treatment during the study period."
    explanation: >-
      The referral cohort of 1,058 children: complications in 24 per cent and
      treatment in 38 per cent.
  - reference: PMID:16950977
    reference_title: "Prospective study of infantile hemangiomas: clinical characteristics predicting complications and treatment."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segmental hemangiomas were 11 times more likely to experience complications and 8 times more likely to receive treatment than localized hemangiomas, even when controlled for size."
    explanation: >-
      The same cohort: segmental hemangiomas had 11 times the complications
      and 8 times the treatment of localized ones.
inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Most hemangiomas occur in a child with no affected relative. In a study of
    202 sets of twins, identical twins were not more often both affected than
    non-identical twins (18 of 42 pairs against 52 of 146), which argues
    against a strong inherited cause. The authors conclude that the origin is
    multifactorial.
  evidence:
  - reference: PMID:9916848
    reference_title: "Genetic mapping of a novel familial form of infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Although most hemangiomas occur sporadically and as single lesions, or in conjunction with pleiotropic genetic syndromes, we have previously identified six kindreds where hemangiomas appear to segregate as an autosomal dominant trait with high penetrance."
    explanation: >-
      The introduction of a linkage study: most hemangiomas occur
      sporadically.
  - reference: PMID:26863906
    reference_title: "Infantile Hemangiomas in Twins: A Prospective Cohort Study."
    supports: SUPPORT

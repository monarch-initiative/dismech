animal_models:
- name: Hemangioma stem cell implant in nude mice
  species: Mouse
  genotype: nu/nu (immunodeficient)
  publication: PMID:18535669
  description: >-
    Stem cells selected from human proliferating hemangiomas by the marker
    CD133, and grown from single cells, are suspended in Matrigel and injected
    under the skin of immunodeficient nu/nu mice. Within seven days they form
    human blood vessels that carry GLUT1; after two months the vessels thin
    out and human fat cells appear. The authors describe it as the first
    animal model of the tumor.
  evidence:
  - reference: PMID:18535669
    reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "We tested to determine whether HemSCs would form hemangiomas in immunodeficient nu/nu mice."
    explanation: >-
      The test: would the stem cells form hemangiomas in immunodeficient nu/nu
      mice.
  - reference: PMID:18535669
    reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Clonally expanded HemSCs or normal control cells were resuspended in Matrigel, a solubilized basement membrane preparation that has been shown to support angiogenesis and vasculogenesis"
    explanation: >-
      The cells were implanted in Matrigel.
  - reference: PMID:18535669
    reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, this study identifies a stem cell as the cellular origin of infantile hemangioma and describes for what we believe is the first time an animal model for this common tumor of infancy."
    explanation: >-
      The authors describe it as the first animal model of the tumor.
  modeled_mechanisms:
  - target: Hemangioma Stem Cell Vasculogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Human hemangioma stem cells form GLUT1-positive human vessels in the
      implant.
    limitations: >-
      The host is an immunodeficient mouse and the cells are carried in
      Matrigel, so the implant lacks the skin, the immune system and the age
      of the infant in whom the tumor grows. What sets the stem cells off in a
      child is not modelled.
    evidence:
    - reference: PMID:18535669
      reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "The CD133-selected cells generated human blood vessels 7 days after implantation in immunodeficient mice."
      explanation: >-
        Human blood vessels seven days after implantation.
    - reference: PMID:18535669
      reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "The human vessels expressed GLUT-1 and merosin, immunodiagnostic markers for infantile hemangioma."
      explanation: >-
        The vessels carried GLUT1 and merosin.
  - target: Involution with Fibrofatty Replacement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The vessels of the implant diminish and human fat cells appear, as in
      the involuting tumor.
    limitations: >-
      The change takes two months in the implant and about three and a half
      years in a child, and the fibrous part of the residuum is not reported
      in the abstract. The limits of the host named for the first link apply
      here as well.
    evidence:
    - reference: PMID:18535669
      reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "Two months after implantation, the number of blood vessels diminished and human adipocytes became evident."
      explanation: >-
        Two months after implantation, fewer vessels and human fat cells.
    - reference: PMID:18535669
      reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, when transplanted into immunodeficient mice, hemangioma-derived cells recapitulated the unique evolution of infantile hemangioma"
      explanation: >-

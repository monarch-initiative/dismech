- name: Involution with Fibrofatty Replacement
  description: >-
    After the growing phase the vessels regress and the tumor is slowly
    replaced by fat and fibrous tissue. Two studies put the end of this
    process at about three and a half years: a median of 36 months in one,
    with 92 per cent of tumors finished by 48 months, and a mean of 3.5 years
    in the other. In mice, the vessels formed by implanted hemangioma stem
    cells thinned out after two months and human fat cells appeared in their
    place. What starts the regression is not known.
  biological_scale: TISSUE

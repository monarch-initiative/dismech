  - reference: PMID:33285272
    reference_title: "Screening for infantile hepatic hemangioma in patients with cutaneous infantile hemangioma: A multicenter prospective study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for IHH is recommended in patients younger than 9 months who present with 5 or more cutaneous IHs."
    explanation: >-
      The recommendation.
- name: Thyroid Function Testing
  description: >-
    Infants with multifocal or diffuse hemangiomas of the liver have their
    thyroid function tested, because the tumor can destroy thyroid hormone.
  notes: >-
    No diagnosis term is bound. A label search of the local NCIT build on 11
    November 2026 for Thyroid Function returned 15 terms, all of them grades
    of adverse events. NCIT:C64813 Thyrotropin Measurement and NCIT:C81295
    Thyroid Stimulating Hormone Measurement name one analyte each and are
    narrower than the test meant here.
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In cases of multiple or diffuse hepatic IHs, hypothyroidism can occur due to inactivation of the thyroid hormones by type 3 iodothyronine deiodinase in the IH tissue; therefore, thyroid function testing is required"
    explanation: >-
      A 2021 review: thyroid function testing is required in multiple or
      diffuse hepatic hemangiomas.
  - reference: PMID:32508067
    reference_title: "A Case of Consumptive Hypothyroidism in a 1-Month-Old Boy with Diffuse Infantile Hepatic Hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the case of severe consumptive hypothyroidism in a 1-month-old boy with infantile hepatic hemangiomas who presented with cardiac failure and cholestasis."
    explanation: >-
      A case in which screening of thyroid function found severe
      hypothyroidism.
differential_diagnoses:
- name: Congenital Hemangioma
  description: >-
    A rarer vascular tumor that forms before birth and is fully grown at
    delivery. It does not grow afterwards: it shrinks within the first year or
    so (the rapidly involuting kind) or it stays (the non-involuting kind).
    The two tumors overlap in the clinic and under the microscope, and the
    authors of one pathology series suggested that they might be variations of
    one entity. The GLUT1 stain separates them, and congenital hemangiomas
    carry mutations of GNAQ or GNA11.
  distinguishing_features:
  - Present and fully formed at birth, with no growth afterwards, where infantile hemangioma appears or grows after birth
  - GLUT1-negative endothelium, with one exception in a series of rapidly involuting congenital hemangiomas, where infantile hemangioma is GLUT1-positive
  - Somatic GNAQ or GNA11 mutations, found in all eight congenital hemangiomas sequenced in one study and in 4 of 8 archival ones (the study did not test infantile hemangiomas)
  - A single lesion when it is in the liver, where infantile hemangioma is usually multifocal or diffuse
  disease_term:
    preferred_term: congenital hemangioma
    term:
      id: MONDO:0018715
      label: congenital hemangioma
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "CHs are rare benign vascular tumors that differ from IHs, are characteristically present at birth as fully developed hemangioma, do not show a proliferative phase or growth after birth, and are pathologically GLUT-1–negative"
    explanation: >-
      A 2021 review: present at birth and fully developed, no growth after
      birth, GLUT1-negative.
  - reference: PMID:27058448
    reference_title: "Somatic Activating Mutations in GNAQ and GNA11 Are Associated with Congenital Hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, congenital hemangiomas are GLUT1 negative and display one of two clinical patterns"
    explanation: >-
      The introduction of a genetic study: congenital hemangiomas are
      GLUT1-negative.
  - reference: PMID:15018449
    reference_title: "Rapidly involuting congenital hemangioma: clinical and histopathologic features."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "With one exception, endothelial cells in RICH (as in NICH) did not express glucose transporter-1 protein, as does common infantile hemangioma."
    explanation: >-
      A pathology series of rapidly involuting congenital hemangiomas: with
      one exception the endothelium did not express GLUT1.
  - reference: PMID:15018449
    reference_title: "Rapidly involuting congenital hemangioma: clinical and histopathologic features."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that RICH, NICH, and common infantile hemangioma have overlapping clinical and pathologic features."
    explanation: >-
      The same series: the congenital tumors and infantile hemangioma overlap
      clinically and pathologically.
  - reference: PMID:27058448
    reference_title: "Somatic Activating Mutations in GNAQ and GNA11 Are Associated with Congenital Hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hypothesized that congenital hemangiomas arise due to somatic mutation and performed massively parallel mRNA sequencing on affected tissue from eight participants."
    explanation: >-
      The genetic study sequenced tissue from eight participants.
  - reference: PMID:27058448
    reference_title: "Somatic Activating Mutations in GNAQ and GNA11 Are Associated with Congenital Hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutually exclusive, mosaic missense mutations that alter glutamine at amino acid 209 (Glu209) in GNAQ or GNA11 in all tested samples, at variant allele frequencies (VAF) ranging from 3% to 33%."
    explanation: >-
      Mosaic GNAQ or GNA11 mutations in all the samples tested.
  - reference: PMID:27058448
    reference_title: "Somatic Activating Mutations in GNAQ and GNA11 Are Associated with Congenital Hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "When we screened additional archival formalin-fixed paraffin-embedded (FFPE) congenital cutaneous and hepatic hemangiomas, 4/8 had GNAQ or GNA11 Glu209 variants."
    explanation: >-
      Four of eight archival congenital hemangiomas of the skin and liver
      carried one.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Hepatic IHs usually present as a multifocal or diffuse hepatic distribution, whereas congenital hepatic hemangiomas present as a focal hepatic lesion"
    explanation: >-
      In the liver, congenital hemangiomas are focal and infantile ones
      multifocal or diffuse.
- name: Kaposiform Hemangioendothelioma
  description: >-
    A locally aggressive vascular tumor. It, and the related tufted angioma,
    cause the Kasabach-Merritt phenomenon, a life-threatening fall in
    platelets with consumption of clotting factors. Infantile hemangioma does
    not. The phenomenon is curated separately as Kasabach-Merritt Syndrome.
  distinguishing_features:
  - The Kasabach-Merritt phenomenon (thrombocytopenia with consumptive coagulopathy), which infantile hemangioma does not cause
  - No endothelial GLUT1 staining in the five hemangioendotheliomas of one study, which were of the epithelioid or the kaposiform kind
  disease_term:
    preferred_term: kaposiform hemangioendothelioma
    term:
      id: MONDO:0016236
      label: kaposiform hemangioendothelioma
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT

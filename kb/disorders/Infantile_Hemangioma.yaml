discussions:
- discussion_id: ih_origin_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What starts an infantile hemangioma: a stem cell that has gone wrong,
    cells from the placenta, a lack of oxygen, or a combination?
  attaches_to:
  - mechanistic_hypotheses#stem_cell_origin
  - mechanistic_hypotheses#placental_origin
  - mechanistic_hypotheses#hypoxia_trigger
  - pathophysiology#Hemangioma Stem Cell Vasculogenesis
  rationale: >-
    The three hypotheses answer different questions and are not exclusive. The
    stem cell work shows which cell can build the tumor, in mice, and not why
    it starts to. The placental and hypoxia hypotheses rest on shared markers
    and on associations with events of pregnancy. No study cited follows a
    tumor from its first cell in a child, and none identifies a genetic change
    in the tumor. Until one of these is done, the first step of the disease
    cannot be drawn.
  evidence:
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of IH has not yet been completely defined, and current studies support several hypotheses."
    explanation: >-
      A 2021 review: the pathogenesis is not completely defined.
  - reference: PMID:16365311
    reference_title: "Evidence by molecular profiling for a placental origin of infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The origin of the pathogenic endothelial cells in common infantile hemangioma is unknown."
    explanation: >-
      The opening of the 2005 transcriptome study: the origin of the
      endothelial cells is unknown.
  - reference: PMID:11254674
    reference_title: "Clonality and altered behavior of endothelial cells from hemangiomas."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemangioma, the most common tumor of infancy, is a benign vascular neoplasm of unknown etiology."
    explanation: >-
      The opening of the 2001 clonality study: a neoplasm of unknown etiology.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Many mechanisms have been proposed to explain the pathogenesis of infantile hemangiomas, but the exact etiology of these lesions remains unclear. Significant evidence suggests that they are derived from endothelial stem or progenitor cells"
    explanation: >-
      The discussion of the 2014 birth-cohort study: the exact etiology
      remains unclear.
- discussion_id: ih_propranolol_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does propranolol shrink an infantile hemangioma: by blocking
    beta-adrenergic receptors, by inhibiting the transcription factor SOX18,
    or both?
  attaches_to:
  - treatments#Oral Propranolol
  - pathophysiology#Hemangioma Stem Cell Vasculogenesis
  rationale: >-
    The effect of the drug on hemangiomas was noticed in infants treated for a
    heart condition, and it was adopted before its action was understood. A
    review lists five proposed actions. A laboratory study found that the R
    enantiomer, which has little beta-blocking activity, stops hemangioma stem
    cells from becoming endothelial cells as well as the mixture does, and
    attributes this to SOX18. If that is the action that matters in children,
    the R enantiomer alone might treat the tumor without the harms of
    beta-blockade, which the authors propose. Atenolol, which blocks beta-1
    receptors selectively, worked as well as propranolol in a trial, which any
    account has to explain.
  evidence:
  - reference: PMID:31358114
    reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Propranolol use in obstructive hypertrophic cardiomyopathy revealed its beneficial effects in infantile hemangioma"
    explanation: >-
      The 2019 study recalls how the effect was found: in the use of
      propranolol for obstructive hypertrophic cardiomyopathy.
  - reference: PMID:31358114
    reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite the clinical benefit of propranolol therapy in hemangioma, the mechanistic understanding of what drives this outcome is limited."
    explanation: >-
      The same study: the mechanism behind the clinical benefit is poorly
      understood.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The mechanism of action of propranolol on IHs is unclear; however, the hypothesized mechanisms are the induction of vasoconstriction, angiogenesis inhibition by decreased VEGF and bFGF levels, induction of endothelial cell apoptosis, inhibition of nitric oxide production, and suppression of the renin-angiotensin system"
    explanation: >-
      A 2021 review: the mechanism is unclear, with the hypothesized actions
      listed.
  - reference: PMID:31358114
    reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "Dissection of the molecular mechanism identified the R(+)-propranolol enantiomer as a small molecule inhibitor of the SOX18 transcription factor, independent of any anti-adrenergic effect."
    explanation: >-
      The R enantiomer inhibits SOX18 independently of any anti-adrenergic
      effect.
  - reference: PMID:31358114
    reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "These results are consistent with a SOX18-dependent, β-adrenergic receptor independent blockade of hemangioma endothelial differentiation, which strongly suggests that blockade of SOX18 activity is the main mode of action of propranolol in this setting."
    explanation: >-
      The authors' reading of the experiments on hemangioma stem cells.
  - reference: PMID:33856430
    reference_title: "Efficacy and Safety of Propranolol vs Atenolol in Infants With Problematic Infantile Hemangiomas: A Randomized Clinical Trial."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 6 months of treatment, in the propranolol and atenolol groups, the overall response rates were 93.7% and 92.5%, respectively (difference, 1.2%; 95% CI, -4.1% to 6.6%)."
    explanation: >-
      Atenolol and propranolol gave the same response rate at six months in a
      randomized trial.

- name: Type 3 Iodothyronine Deiodinase Activity in Tumor Tissue
  description: >-
    Hemangioma tissue can make large amounts of type 3 iodothyronine
    deiodinase, the enzyme that inactivates thyroid hormone. When there is
    much tumor, as in multifocal or diffuse disease of the liver, the hormone
    is broken down faster than the thyroid gland can replace it. The condition
    is called consumptive hypothyroidism.
  biological_scale: MOLECULAR

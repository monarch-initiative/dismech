- name: Suppressed NFAT-Dependent VEGFR1 Expression
  description: >-
    Endothelial cells cultured from the hemangiomas of nine patients make
    little VEGFR1, the receptor that binds the growth factor VEGF without
    passing on a growth signal: its protein level was 10 to 20 per cent of
    that in control cells. The gene for VEGFR1 (FLT1) is switched on by the
    transcription factor NFAT, and NFAT is underactive in these cells because
    a pathway through beta-1 integrin, the integrin-like receptor TEM8
    (ANTXR1) and VEGFR2 is underactive. Hemangioma tissue in the proliferating
    phase showed the same low ratio of VEGFR1 to VEGFR2 transcripts;
    involuting tissue did not.

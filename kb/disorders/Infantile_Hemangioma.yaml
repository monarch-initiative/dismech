  phase: PHASE_III
  status: COMPLETED
  description: >-
    The trial that established oral propranolol: a randomized, double-blind
    comparison of four regimens of propranolol with placebo in infants with a
    proliferating hemangioma that needed systemic treatment. It was registered
    as an adaptive phase II/III study; the phase field holds one value, and
    the later phase is recorded. Its results are quoted under Oral
    Propranolol.
  target_phenotypes:
  - preferred_term: infantile hemangioma
    term:
      id: HP:0005306
      label: Capillary hemangioma
  evidence:
  - reference: clinicaltrials:NCT01056341
    reference_title: "A Randomised, Controlled, Multidose, Multicentre, Adaptive Phase II/III Study in Infants With Proliferating Infantile Hemangiomas (IHs) Requiring Systemic Therapy to Compare 4 Regimens of Propranolol (1 or 3 mg/kg/Day for 3 or 6 Months) to Placebo (Double Blind)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study has been designed to confirm efficacy of propranolol in severe IH by demonstrating superiority over placebo and to document the safety profile of propranolol in this indication."
    explanation: >-
      The registry record states the aim of the trial.
  - reference: PMID:25693013
    reference_title: "A randomized, controlled trial of oral propranolol in infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT

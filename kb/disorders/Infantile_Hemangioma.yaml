- name: Proliferating GLUT1-Positive Endothelium
  description: >-
    In its growing phase the tumor is a dense mass of dividing endothelial
    cells that form capillaries. Endothelial cells cultured from growing
    hemangiomas are clonal, and they divide and move faster than normal
    endothelial cells. The endothelium stains strongly for the glucose
    transporter GLUT1 in every phase of the tumor, growing or shrinking: in a
    pathology study 139 of 143 hemangiomas were positive and none of 66
    vascular malformations. GLUT1 is otherwise found in endothelium that forms
    a barrier between blood and tissue, as in the brain and the placenta, and
    the hemangioma shares three further markers with the vessels of the
    placenta.

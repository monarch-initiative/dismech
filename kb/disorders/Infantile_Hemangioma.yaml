    evidence_source: HUMAN_CLINICAL
    snippet: "Consumptive hypothyroidism is a rare paraneoplastic syndrome characterized by excessive inactivation of the thyroid hormones due to increased type 3 iodothyronine deiodinase activity of tumors."
    explanation: >-

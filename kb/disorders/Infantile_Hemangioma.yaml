- category: Respiratory
  name: Subglottic Hemangioma
  description: >-
    A hemangioma in the airway, typically below the vocal cords. It is rare:
    13 of 761 children with hemangiomas at one vascular anomaly center had a
    subglottic one, and 1.6 per cent of 798 at another had a hemangioma of the
    airway. It is diagnosed at about four months, with noisy breathing in and
    out, a barking cough and breathlessness, and can be taken for croup. A
    segmental hemangioma of the lower face and neck, the beard area, is the
    warning sign: a third of the children who had one in the second series had
    a tumor of the airway. But in the first series more than half of the
    children with a subglottic tumor had no hemangioma of the skin at all.

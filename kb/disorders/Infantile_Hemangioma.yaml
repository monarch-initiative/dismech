mechanistic_hypotheses:
- hypothesis_group_id: stem_cell_origin
  hypothesis_label: The tumor grows from a multipotent stem cell that forms its vessels and later its fat
  status: ALTERNATIVE
  description: >-
    Proposed in 2008. In favour: stem cells from the tumor form GLUT1-positive
    human vessels in mice and later fat, which is the course the tumor takes
    in a child; and the endothelial cells of the tumor are clonal, as cells
    that descend from one cell would be. Against a settled answer: the
    experiments were done with cultured cells and with implants in
    immunodeficient mice, the studies cited identify no mutation that would
    make such a cell grow, and the hypothesis does not say what sets the cell
    off. Reviews list it beside the placental and hypoxia hypotheses, which
    are not exclusive of it, so none of the three is marked CANONICAL. Its two
    edges run from Hemangioma Stem Cell Vasculogenesis to Proliferating
    GLUT1-Positive Endothelium and to Involution with Fibrofatty Replacement.
  evidence:
  - reference: PMID:18535669
    reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, this study identifies a stem cell as the cellular origin of infantile hemangioma and describes for what we believe is the first time an animal model for this common tumor of infancy."
    explanation: >-
      The authors' conclusion: a stem cell is the cell of origin. An inference
      from cultured cells and from implants in mice.
  - reference: PMID:18535669
    reference_title: "Multipotential stem cells recapitulate human infantile hemangioma in immunodeficient mice."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, when transplanted into immunodeficient mice, hemangioma-derived cells recapitulated the unique evolution of infantile hemangioma"
    explanation: >-
      The implanted cells went through the course of the tumor, vessels first
      and fat later.
  - reference: PMID:11254674
    reference_title: "Clonality and altered behavior of endothelial cells from hemangiomas."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "We conclude that hemangiomas constitute clonal expansions of endothelial cells. This is consistent with the possibility that these tumors are caused by somatic mutations in one or more genes regulating endothelial cell proliferation."
    explanation: >-
      The 2001 clonality study: hemangiomas are clonal expansions of
      endothelial cells, which the authors call consistent with a somatic
      mutation. No mutation was shown.
  - reference: PMID:24641194
    reference_title: "Prospective study of infantile haemangiomas: incidence, clinical characteristics and association with placental anomalies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Many mechanisms have been proposed to explain the pathogenesis of infantile hemangiomas, but the exact etiology of these lesions remains unclear. Significant evidence suggests that they are derived from endothelial stem or progenitor cells"
    explanation: >-
      The discussion of the birth-cohort paper: the cause is unclear, and much
      evidence points to endothelial stem or progenitor cells.
  - reference: PMID:34044479
    reference_title: "Update on infantile hemangioma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenesis of IH has not yet been completely defined, and current studies support several hypotheses."
    explanation: >-
      A 2021 review: the pathogenesis is not fully defined and several
      hypotheses are supported. This is why the hypothesis is not marked
      CANONICAL.
- hypothesis_group_id: placental_origin
  hypothesis_label: The tumor cells come from the placenta or are programmed like placental vessels
  status: ALTERNATIVE
  description: >-
    Proposed in 2001, when the endothelium of the tumor was found to share
    four markers with the vessels of the placenta that the vessels of normal
    skin lack. In favour: the pattern of gene expression of the tumor is
    closer to that of the placenta than to that of any other tissue compared;
    abnormalities of the placenta are about twice as common in affected
    pregnancies; and hemangiomas were about three times as common after
    chorionic villus sampling, which disturbs the placenta, as after
    amniocentesis. The hypothesis exists in two forms, cells carried from the
    placenta to the child and cells of the child that take on a placental
    program, and the evidence does not separate them. No edge of the graph
    belongs to it, because no step of it has been observed.

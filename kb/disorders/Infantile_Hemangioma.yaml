- name: KDR
  association: Germline missense variant C482R of VEGFR2
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KDR
    term:
      id: hgnc:6307
      label: KDR
  notes: >-
    KDR encodes VEGFR2. One study found the variant in the cultured tumor
    cells of two of nine patients and then in blood: 10 of 114 people with a
    history of hemangioma carried it, against 12 of 295 controls (P = 0.02).
    The authors call it a risk-factor mutation and a relatively common
    variant. The controls included people with hemangioma at the population
    frequency, the variant did not change the expression of the receptor or
    its phosphorylation by VEGF in a cell line, and the sources cited contain
    no replication. No gene-disease validity assertion is recorded.

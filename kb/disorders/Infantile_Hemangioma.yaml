- hypothesis_group_id: hypoxia_trigger
  hypothesis_label: Low oxygen in the tissue starts or drives the growth of the tumor
  status: ALTERNATIVE
  description: >-
    Low oxygen makes tissues release signals that call in and expand
    vessel-forming progenitor cells. In favour: these signals were raised in
    the blood and the tumors of ten children with growing hemangiomas; low
    oxygen and estrogen together made hemangioma endothelial cells divide
    faster in culture; and the conditions that raise the risk, among them
    prematurity, low birth weight, pre-eclampsia and placenta previa, are ones
    in which the fetus or the placenta is short of oxygen. The evidence is of
    association. The hypothesis can be combined with either of the other two.
    No edge of the graph belongs to it.

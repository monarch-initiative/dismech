treatments:
- name: Active Observation
  description: >-
    Most hemangiomas are left to run their course. The family is told what to
    expect, and the child is seen often in the first weeks and months, which
    is when a tumor that will cause trouble shows itself. In a randomized
    trial of 121 infants with early uncomplicated hemangiomas, those who were
    only observed did as well at one year as those treated with a pulsed dye
    laser.
  action_category: MONITORING
  treatment_term:
    preferred_term: active observation
    term:
      id: NCIT:C25598
      label: Observation Activity
  evidence:

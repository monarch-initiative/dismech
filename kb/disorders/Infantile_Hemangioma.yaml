- name: Hemangioma Stem Cell Vasculogenesis
  description: >-
    The tumor contains multipotent stem cells, about 0.2 per cent of its
    cells, picked out by the marker CD133. Populations grown from single such
    cells formed human blood vessels within seven days of being implanted
    under the skin of immunodeficient mice, and the vessels carried GLUT1 and
    merosin, the markers of infantile hemangioma. The authors conclude that a
    stem cell, and not a mature endothelial cell, is the cell the tumor comes
    from. In culture, propranolol and its R enantiomer blocked the change of
    these stem cells into endothelial cells.

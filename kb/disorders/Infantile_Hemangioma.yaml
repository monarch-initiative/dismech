- name: Oral Propranolol
  description: >-
    A beta-blocker taken by mouth, and the first-line treatment for a
    hemangioma that needs one. In the randomized trial of 456 infants, 3 mg
    per kg per day for six months cleared or nearly cleared the tumor in 60
    per cent, against 4 per cent on placebo, and 88 per cent had improved by
    the fifth week. One in ten of those who responded needed treatment again.
    A meta-analysis of 18 studies estimated clearance at 95 per cent with
    propranolol, 43 per cent with oral corticosteroids and 6 per cent without
    treatment. The guideline dose is 2 to 3 mg per kg per day for at least six
    months. Low blood sugar, low blood pressure, a slow heart rate and
    bronchospasm are the known harms; in the trial they were infrequent. How
    the drug works is not settled (see the discussions).
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: propranolol
      term:
        id: CHEBI:8499
        label: propranolol
  target_phenotypes:
  - preferred_term: infantile hemangioma
    term:
      id: HP:0005306
      label: Capillary hemangioma
  target_mechanisms:
  - target: Hemangioma Stem Cell Vasculogenesis
    treatment_effect: INHIBITS
    description: >-
      In culture, propranolol stops hemangioma stem cells from turning into
      endothelial cells. The R enantiomer, which has little beta-blocking
      activity, does the same, and the authors attribute the effect to
      inhibition of the transcription factor SOX18. Whether this is how the
      drug shrinks a tumor in a child is not known.
    evidence:
    - reference: PMID:31358114
      reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "Propranolol significantly decreased VEGF-B induced expression of all five endothelial markers in HemSC to levels also achieved by Sm4 as compared to controls"
      explanation: >-
        Propranolol reduced the endothelial markers induced in hemangioma stem
        cells, as did an inhibitor of SOX18.
    - reference: PMID:31358114
      reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "The R(+) enantiomer recapitulated propranolol and Sm4-induced inhibition on all markers, whereas the S(-) enantiomer showed only weak or no inhibition on hemangioma markers"
      explanation: >-
        The R enantiomer had the effect and the S enantiomer little or none.
    - reference: PMID:31358114
      reference_title: "R-propranolol is a small molecule inhibitor of the SOX18 transcription factor in a rare vascular syndrome and hemangioma."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: "These results are consistent with a SOX18-dependent, β-adrenergic receptor independent blockade of hemangioma endothelial differentiation, which strongly suggests that blockade of SOX18 activity is the main mode of action of propranolol in this setting."
      explanation: >-
        The authors' reading: a blockade of endothelial differentiation that
        depends on SOX18 and not on the beta-adrenergic receptor. An inference
        from cultured cells.

    evidence_source: HUMAN_CLINICAL
    snippet: "We performed a multicenter, randomized, double-blind, adaptive, phase 2-3 trial assessing the efficacy and safety of a pediatric-specific oral propranolol solution in infants 1 to 5 months of age with proliferating infantile hemangioma requiring systemic therapy."

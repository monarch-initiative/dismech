name: Infantile Hemangioma
creation_date: '2026-11-11T02:55:07Z'
description: >-
  Infantile hemangioma is a benign tumor of the cells that line blood vessels
  and the most common tumor of infancy. A study that followed 594 newborns
  found one in 4.5 per cent of them by the age of three months. The tumor is
  absent or barely visible at birth, grows fast in the first weeks of life,
  reaches most of its final size by about three months and then shrinks
  slowly, until about three and a half years of age, often leaving changed
  skin behind. Its endothelial cells stain for the glucose transporter GLUT1
  at every stage, which separates it from congenital hemangioma, from other
  vascular tumors and from vascular malformations. Most lesions are small and
  need no treatment. A minority threaten the airway, the eye, the liver or the
  heart, ulcerate, or will disfigure, and for these oral propranolol is the
  first-line treatment, supported by a randomized trial of 456 infants. A
  large segmental hemangioma of the face can be part of PHACE syndrome, and
  one of the lower body part of LUMBAR syndrome. What starts the tumor is not
  known: stem cells isolated from it form GLUT1-positive vessels and later fat
  in mice, its endothelium shares markers and gene expression with the
  placenta, and prematurity, low birth weight and placental abnormalities go
  with a higher risk. Because the tumor is so common, rarer tumors of infancy
  that look like it have at first been diagnosed as hemangiomas, among them
  metastatic neuroblastoma and infantile fibrosarcoma.
categories:
- Vascular Tumor
- Benign Neoplasm
- Paediatric Vascular Anomaly
synonyms:
- capillary infantile hemangioma
- infantile haemangioma
- hemangioma of infancy
- juvenile hemangioma
- IH
parents:
- capillary hemangioma
notes: >-
  Name. The entry uses the name of the clinical literature and of the NCI
  Thesaurus (NCIT:C6645, Infantile Hemangioma). MONDO labels the term
  capillary infantile hemangioma. MONDO:0002407 capillary hemangioma carries
  infantile hemangioma as a synonym, though not as an exact one; it is the
  broader class and is not used.

  Heredity. MONDO places the term under hereditary disease, cross-references
  OMIM:602089 and lists hereditary capillary infantile hemangioma as a synonym
  (read through OLS on 11 November 2026). Most hemangiomas are sporadic. The
  families in which they run are recorded in the inheritance section.

  Scope. The entry covers infantile hemangioma of the skin and of the internal
  organs, of which the liver and the airway matter most. Congenital
  hemangioma, which is fully grown at birth and GLUT1-negative, is a different
  tumor and appears only as a differential diagnosis. PHACE syndrome
  (MONDO:0011676) and LUMBAR syndrome are the syndromes in which a segmental
  hemangioma comes with structural anomalies. They are not curated here beyond
  the imaging that looks for them.

  Subtypes. The hepatic form is the one subtype row. It has no MONDO term of
  its own: OLS searches of MONDO on 11 November 2026 for infantile hepatic
  hemangioma, hepatic infantile hemangioma and liver infantile hemangioma
  returned nothing, and MONDO:0002404 liver hemangioma covers every hemangioma
  of the liver at any age. The clinical classes by depth (superficial, deep,
  mixed) and by pattern (focal, segmental, indeterminate, multifocal) are
  described in the text and are not subtype rows.

  Sources. Many figures come from one prospective cohort of 1,058 to 1,096
  children seen at seven pediatric dermatology clinics in the United States
  (the Hemangioma Investigator Group). Children referred to such clinics have
  larger and more complicated tumors than children in general, so its rates of
  ulceration, complications and treatment are likely to be upper bounds. A
  cohort of 594 infants followed from birth gives the figures for unselected
  children. The studies of mechanism used cells cultured from the tumors of a
  few patients and implants in mice. The 2008 letter that reported propranolol
  for severe hemangiomas (PMID:18550886) and a 2000 report of hypothyroidism
  caused by the enzyme in the tumor (PMID:10900278) are not quoted, because no
  abstract or full text could be retrieved for either.

- phase: Proliferative phase
  age_range: From the first weeks to about five months, up to nine months
  notes: >-
    The tumor grows fastest between five and a half and seven and a half
    weeks, reaches 80 per cent of its size at about three months and has
    stopped growing by five months in most children and by nine months in all
    of the cohort followed from birth. Deep tumors grow later and longer, and
    segmental tumors go on growing after three months. Ulceration, obstruction
    of the airway or of vision, and heart failure belong to this phase.
  evidence:

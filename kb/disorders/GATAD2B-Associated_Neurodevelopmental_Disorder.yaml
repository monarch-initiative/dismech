    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Subjects had clinical findings that included macrocephaly, hypotonia, intellectual disability, neonatal feeding issues, polyhydramnios, apraxia of speech, epilepsy, and bicuspid aortic valves."

- name: GATAD2B
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GATAD2B
    term:
      id: hgnc:30778
      label: GATAD2B
  relationship_type: CAUSATIVE
  notes: >-
    Two allele classes, both loss of function. Truncating variants - nonsense,
    frameshift, splice-site and intragenic or focal 1q21.3 deletions - are the
    large majority. Missense variants are a minority and are restricted to the
    CR1 and CR2 conserved regions, where they leave the protein intact but
    unable to bind its NuRD partners. That restriction is what makes a GATAD2B
    missense variant outside CR1/CR2 hard to call. In the 50-patient cohort the
    classes break down as nonsense 34%, truncating frameshift 32%, splice-site
    14%, deletions 6% and missense 14%.

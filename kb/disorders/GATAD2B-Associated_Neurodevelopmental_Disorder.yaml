- name: Misexpression of Corticogenesis Regulators
  biological_scale: CELLULAR
  description: >-
    Single-cell transcriptomics of embryonic cortex in Gatad2b mutant mice
    identifies misexpression of Bcl11b, Nfia, H3f3b and Sox5, all regulators of
    cortical identity and all themselves associated with neurodevelopmental
    syndromes.

    The binding here reads the lesion as loss of repression, since NuRD's role
    at these promoters is to damp transcription. Misexpression in the source
    goes in both directions, so that reading is a simplification of what was
    measured. The cell-type binding is likewise a generalisation: the
    sequencing was of whole embryonic cortex, which contains progenitors as
    well as neurons, so "neuron" is the broadest honest label rather than a
    demonstrated cell of action.

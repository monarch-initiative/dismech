diagnosis:
- name: Exome or genome sequencing
  description: >-
    The disorder has no biochemical marker and no imaging signature, so
    diagnosis is molecular. Most cases have been found by trio exome
    sequencing; chromosomal microarray detects the focal 1q21.3 deletions.
    Because pathogenic missense variants are restricted to CR1 and CR2, the
    position of a missense variant carries interpretive weight.
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Seven subjects were identified with missense variants that localized within two conserved region domains (CR1 or CR2) of the GATAD2B protein."
    explanation: The domain restriction that makes variant position informative in this gene.
treatments:
- name: Speech and Language Therapy
  description: >-
    The speech impairment is disproportionate to the cognitive delay and
    plateaus after the first words, so communication support, including
    augmentative and alternative communication for those who remain non-verbal,
    is the intervention with the most to offer. No trial of any intervention
    has been conducted in this disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  evidence:
  - reference: PMID:32688057
    reference_title: "Clinical and molecular description of 19 patients with GATAD2B-Associated Neurodevelopmental Disorder (GAND)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "GATAD2B variant carriers showed very little subsequent speech progress, two patients over 30 years of age remaining non-verbal."
    explanation: >-
      Establishes the communication need this intervention addresses. No study
      of speech therapy in this disorder has been published.
  target_mechanisms:
  - target: Speech apraxia
    description: Supports function; it does not act on the chromatin lesion.
  - target: Delayed speech and language development
    description: Supports communication, including by augmentative and alternative means.
- name: Antiseizure Medication
  description: >-
    Class-selected by seizure type where epilepsy is present. Most epileptic
    patients are well controlled: 75% (8 of 12) in the 50-patient cohort. The
    published developmental and epileptic encephalopathy with drug-resistant
    atypical absences is the exception rather than the expectation, so control
    is usual but not assured.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseizure medication
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  evidence:
  - reference: PMID:39976362
    reference_title: "GATAD2B-related developmental and epileptic encephalopathy (DEE): Extending the epilepsy phenotype and a literature appraisal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "She presents a developmental and epileptic encephalopathy (DEE) with drug-resistant atypical absences"
    explanation: >-
      The exception: a single published case of drug-resistant epilepsy, which
      is why control is described as usual rather than assured.
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Most epileptic subjects were well-controlled with anti-seizure medication (75%; 8/12)"
    explanation: The response rate in the largest cohort, which is the main evidence for this treatment.
  target_mechanisms:
  - target: Seizure
    description: Suppresses seizures; it does not act on the underlying lesion.
- name: Multidisciplinary Surveillance at Diagnosis
  description: >-
    The 50-patient cohort recommends that any child diagnosed with GAND be seen
    by cardiology, ophthalmology, neurology and developmental specialists, with
    speech, physical and occupational therapy consultations added. With no
    GeneReviews chapter for this disorder, that paragraph is the closest thing
    to a management baseline.

    The frequencies in this entry are what make each referral worth making
    rather than routine: bicuspid aortic valve in 10% with 4% needing cardiac
    intervention, refractive error and strabismus in the great majority,
    abnormal brain MRI in 60%, and a wide-based gait in 91% with 61% using
    orthotics.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary specialist evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Therefore, we recommend any child who is genetically diagnosed with GAND undergo consultations with specialists in these fields."
    explanation: The cohort's own recommendation, which is the management baseline this row records.
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Additional evaluations should include speech, physical, and occupational therapy consultations"
    explanation: The therapy referrals the same recommendation adds.
  target_mechanisms:
  - target: Bicuspid aortic valve
    description: Detects the cardiac lesion rather than acting on a mechanism.
  - target: Strabismus
    description: Detects and allows correction of the ocular findings.
  - target: Astigmatism
    description: Refractive error is common and is found by assessment rather than reported.
  - target: Hypermetropia
    description: Refractive error is common and is found by assessment rather than reported.
  - target: Myopia
    description: Refractive error is common and is found by assessment rather than reported.
- name: Physical and Occupational Therapy
  description: >-
    Gait and motor support: a wide-based unsteady gait is present in 91% of
    patients and 61% use orthotics, so mobility support is the rule rather than
    the exception. Recommended by the cohort alongside speech therapy.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Additional evaluations should include speech, physical, and occupational therapy consultations"
    explanation: The recommendation for physical and occupational therapy.
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "| Wide-based Gait | 41/45 (91.1) |"
    explanation: The gait frequency that makes this a near-universal need rather than an occasional one.
  target_mechanisms:
  - target: Broad-based gait
    description: Supports mobility; it does not act on the chromatin lesion.
animal_models:
- name: Gatad2b haploinsufficient mouse
  species: Mouse
  genotype: Gatad2b heterozygous mutant
  publication: PMID:38238293
  genes:
  - preferred_term: Gatad2b
    term:
      id: MGI:2443225
      label: Gatad2b
  description: >-
    The haploinsufficient mouse matches the human genotype and shows
    behavioural abnormalities resembling the disorder, with single-cell
    transcriptomics of embryonic cortex identifying the misexpressed
    corticogenesis regulators. Homozygous mutants die perinatally, which marks
    the dosage boundary.
  modeled_mechanisms:
  - target: Misexpression of Corticogenesis Regulators
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The transcriptional lesion is measured directly in this model, in the
      tissue and at the stage where the human disorder originates.
    readouts:
    - name: Embryonic cortex single-cell transcriptome
      target: Misexpression of Corticogenesis Regulators
      direction: ALTERED
      interpretation: Names the specific regulators whose misexpression carries this node.
      evidence:
      - reference: PMID:38238293
        reference_title: "Gatad2b, associated with the neurodevelopmental syndrome GAND, plays a critical role in neurodevelopment and cortical patterning."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "indicated misexpression of genes key for corticogenesis and associated with neurodevelopmental syndromes such as Bcl11b, Nfia and H3f3b and Sox5"
        explanation: The measured misexpression behind this readout.
  - target: Impaired Learning and Behavioural Abnormality
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The heterozygous genotype, which is the human one, produces behavioural
      abnormalities resembling the clinical features.
    limitations: >-
      The mouse has no counterpart for the speech impairment, which is the
      feature that most limits affected people, so the model cannot report on
      the disorder's dominant disability.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Speech apraxia and language impairment have no murine counterpart that
        could be scored, so the behavioural phenotype reported here covers
        learning and behaviour but not the communication deficit.
    evidence:
    - reference: PMID:38238293
      reference_title: "Gatad2b, associated with the neurodevelopmental syndrome GAND, plays a critical role in neurodevelopment and cortical patterning."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "haploinsufficient Gatad2b mice exhibit behavioral abnormalities resembling the clinical features of GAND patients"
      explanation: The behavioural recapitulation in the matching genotype.
- name: simj neuronal knockdown fly
  species: Drosophila melanogaster
  genotype: neuronal RNAi knockdown of simj (GATAD2B orthologue)
  publication: PMID:23644463
  genes:
  - preferred_term: simj
    term:
      id: FB:FBgn0010762
      label: simj
  description: >-
    Knockdown restricted to neurons, which is what establishes that the gene is
    required within neurons rather than in surrounding tissue.
  modeled_mechanisms:
  - target: Synaptic Undergrowth and Altered Synapse Morphology
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Altered synapse morphology with synaptic undergrowth at the neuromuscular
      junction, together with impaired learning in the same animals.
    limitations: >-
      An invertebrate neuromuscular junction is a long way from the human
      cortical synapse, and the fly has no cortex in which the patterning
      defect could be observed.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Drosophila has no cerebral cortex, so the corticogenesis step that the
        mouse reports is structurally unavailable in this organism and the
        model can only speak to the synaptic and learning end of the chain.
    evidence:
    - reference: PMID:23644463
      reference_title: "GATAD2B loss-of-function mutations cause a recognisable syndrome with intellectual disability and are associated with learning deficits and synaptic undergrowth in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Neuronal knockdown of Drosophila GATAD2B orthologue, simj, resulted in impaired learning and altered synapse morphology."
      explanation: The synaptic and learning phenotype measured in the fly.
differential_diagnoses:
- name: Snijders Blok-Campeau syndrome
  description: >-
    The CHD3-related NuRDopathy, and the closest differential. It shares
    macrocephaly, intellectual disability, hypotonia and childhood apraxia of
    speech, and is separated by molecular testing rather than by examination.
    Inguinal hernia and an overfriendly behavioural profile are reported as
    distinguishing it.
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "GAND's clinical phenotype had substantial clinical overlap with other disorders associated with the NuRD complex that involve CHD3 and CHD4, with clinical features of hypotonia, intellectual disability, cardiac defects, childhood apraxia of speech, and macrocephaly."
    explanation: The overlap with the CHD3 and CHD4 disorders, stated by the cohort that defined GAND.
- name: Sifrim-Hitz-Weiss syndrome
  description: >-
    The CHD4-related NuRDopathy. It shares macrocephaly and intellectual
    disability, and is distinguished by hearing loss, skeletal fusions, palatal
    abnormality and cardiac defects.
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "GAND's clinical phenotype had substantial clinical overlap with other disorders associated with the NuRD complex that involve CHD3 and CHD4, with clinical features of hypotonia, intellectual disability, cardiac defects, childhood apraxia of speech, and macrocephaly."
    explanation: The overlap with the CHD4 disorder, from the same source.

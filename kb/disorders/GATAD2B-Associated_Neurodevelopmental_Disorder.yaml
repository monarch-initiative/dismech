- name: Cardiac Outflow Tract Patterning Defect
  biological_scale: TISSUE
  description: >-
    Bicuspid aortic valve occurs in 10% of patients against roughly 2% in the
    general population, and 4% of the cohort required cardiac intervention.
    Cardiac defects are one of the features GAND shares with the CHD4-related
    NuRDopathy, which is the basis for treating this as a consequence of the
    same chromatin lesion rather than a coincidence. No cardiac developmental
    mechanism has been demonstrated for this gene, so the edge in is marked
    INDIRECT_UNKNOWN_INTERMEDIATES.
  evidence:
  - reference: PMID:31949314
    reference_title: "GATAD2B-associated neurodevelopmental disorder (GAND): clinical and molecular insights into a NuRD-related disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: "GAND's clinical phenotype had substantial clinical overlap with other disorders associated with the NuRD complex that involve CHD3 and CHD4, with clinical features of hypotonia, intellectual disability, cardiac defects, childhood apraxia of speech, and macrocephaly."
    explanation: >-
      Cardiac defects named as a shared NuRD-class feature. The developmental
      route from the chromatin lesion to the valve is not demonstrated.
  downstream:
  - target: Bicuspid aortic valve
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Infantile Hypotonia
  biological_scale: ORGANISM
  description: >-
    Central hypotonia from birth or early infancy, universal in the 50-patient
    cohort and improving with age. It is usually what brings the child to
    attention, before the developmental delay is apparent, and it carries the
    oromotor consequences with it: neonatal feeding difficulty in 82%,
    persistent drooling, and plausibly the maternal polyhydramnios that
    precedes them. How the chromatin lesion produces hypotonia is not
    established, so the edge into this node is marked
    INDIRECT_UNKNOWN_INTERMEDIATES.
  evidence:
  - reference: PMID:23644463
    reference_title: "GATAD2B loss-of-function mutations cause a recognisable syndrome with intellectual disability and are associated with learning deficits and synaptic undergrowth in Drosophila."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Detailed clinical description showed that all four individuals with a GATAD2B aberration had a distinctive phenotype with childhood hypotonia, severe intellectual disability, limited speech, tubular shaped nose with broad nasal tip, short philtrum, sparse hair and strabismus."
    explanation: Hypotonia in all four of the original patients.
  downstream:
  - target: Floppy infant
    causal_link_type: DIRECT
  - target: Feeding difficulties
    causal_link_type: DIRECT
  - target: Drooling
    causal_link_type: DIRECT
  - target: Polyhydramnios
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

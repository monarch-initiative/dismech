    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "GATAD2B variant carriers showed very little subsequent speech progress, two patients over 30 years of age remaining non-verbal."
    explanation: The plateau and its persistence into adulthood.

- category: Neurologic

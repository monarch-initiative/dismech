notes: >-
  Entry name. The MONDO label is a string of clinical features rather than a
  name the field uses. GAND, which MONDO carries as an exact synonym and which
  ClinGen's own curation gives as an alternative name for the disorder, is the
  established name, so the entry takes the GATAD2B-associated form and keeps
  the MONDO label and the MRD18 serial designations in synonyms.

  Phenotype frequencies come from the cohort papers, not from the HPO
  annotation. The HPO annotation of OMIM:615074 derives entirely from the
  original four-patient 2013 report, so every frequency-bearing term there
  reads 4/4, and the two features that most distinguish this disorder are
  missing from it altogether: macrocephaly, which the 50-patient cohort puts at
  91.8% by assessment and 60.4% at birth, and seizure at 24%. Those 4/4 figures
  are an artifact of a stale annotation and are not imported. The frequencies
  in this entry are quoted from Table 1 of the 50-patient cohort and from the
  19-patient cohort, with the table row itself as the snippet.

  Two features carry no frequency because the cohorts did not score them:
  sparse hair, from the original four-patient report, and deeply set eyes, from
  the 19-patient cohort's description of the gestalt.

  Long fingers is not curated as a phenotype, although it appears in the MONDO
  label for this term and in the OMIM title it derives from. No cached source
  for this entry supports it: the string "long finger", "long toe",
  "arachnodactyly" and "digit" appear in none of PMID:23644463, PMID:31949314,
  PMID:32688057, PMID:28077840, PMID:38238293 or PMID:39976362, and the 2013
  founding report is cached as abstract only, so if its tables score the feature
  they are not reachable from here. The 50-patient and 19-patient cohorts both
  scored dysmorphology in detail and neither lists it. It is left out rather
  than bound to a label-derived claim with no quotable support; a curator with
  the 2013 full text can add it.

  No GeneReviews chapter covers this disorder or GATAD2B.

  GATAD2B is also a `genetic:` row inside the broad
  Autosomal_Dominant_Non-Syndromic_Intellectual_Disability entry. That is not a
  duplicate of this one: GAND is syndromic, with macrocephaly and a recognisable
  facial gestalt, and that entry covers non-syndromic intellectual disability
  across many genes.

  The deep-research report proposed two further pathway branches that are not
  curated here: MTA3 relocation activating Wnt, demonstrated only in a
  non-neuronal stem cell under near-complete knockdown, and Sufu-mediated
  recruitment of p66-beta to Gli targets, whose relevance to this disorder is
  untested. Its NCIT:C38120 binding for anticonvulsant agent names an unrelated
  tumour-infiltrating-lymphocyte concept; every term here was re-derived from
  OLS.

- name: Macrocephaly Development
  biological_scale: ORGANISM
  description: >-
    Macrocephaly is the most discriminating physical sign and the feature that
    places this disorder with the other NuRD-associated neurodevelopmental
    syndromes. It is partly postnatal: present at birth in 60.4% and by
    assessment in 91.8%. Its mechanism is not established, and the edge into
    this node from the cortical patterning defect is marked
    INDIRECT_UNKNOWN_INTERMEDIATES for that reason; it is recorded as a node
    because it is the shared feature of the NuRD class, not because a pathway
    to it has been demonstrated.

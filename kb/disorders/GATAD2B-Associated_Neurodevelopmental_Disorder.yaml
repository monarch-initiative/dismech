    recognisable facial gestalt - broad forehead, deeply set eyes,
    hypertelorism, wide nasal base, short philtrum and pointed chin - together
    with strabismus. That this arises from the chromatin lesion rather than
    from a separate cause is an inference from the gestalt's consistency across
    cohorts and from its overlap with the CHD3 and CHD4 NuRDopathies, which
    share facial features; no craniofacial mechanism has been demonstrated for
    this gene, and the Gatad2b mouse work reported cortex rather than face.

- name: Failure of NuRD Bridging by p66-beta
  biological_scale: MOLECULAR
  description: >-
    p66-beta is the bridge inside NuRD: CR1 contacts MBD2 and MBD3, and CR2 is
    the surface CHD3 and CHD4 require in order to join the rest of the complex.
    Correct subnuclear distribution of p66 depends on that MBD2 contact, so a
    CR1 variant mislocalises the protein even with CR2 intact.

- category: Neurologic
  name: Delayed speech and language development
  description: >-
    Speech impairment out of proportion to the cognitive delay, and the feature
    families report as most limiting. Progress plateaus after the first words: 20%
    of those over four years old remained non-verbal in the 50-patient cohort, and
    two patients over 30 years of age were non-verbal in the 19-patient cohort.
  phenotype_term:
    preferred_term: Delayed speech and language development
    term:
      id: HP:0000750
      label: Delayed speech and language development
  frequency: VERY_FREQUENT
  evidence:

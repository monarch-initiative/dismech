- name: Diaphragm Pacing by Phrenic Nerve Stimulation
  description: >-
    Bilateral phrenic nerve pacing drives the diaphragm directly, and is used
    principally to give ambulatory daytime support to patients who also
    hypoventilate awake - freeing them from a portable ventilator rather than
    replacing nocturnal support. Like positive-pressure ventilation it acts on
    the hypoventilation node and does nothing for the chemoreflex; unlike it, it
    requires an intact phrenic nerve and diaphragm, which the disorder spares.

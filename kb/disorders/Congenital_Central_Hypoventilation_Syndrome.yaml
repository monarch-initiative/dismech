    evidence:
    - reference: PMID:28674118
      reference_title: Retinoblastoma and Neuroblastoma Predisposition and Surveillance.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The risk for a neural crest tumor for individuals with NPARMs is about
        45%, whereas the risk for individuals with PARMs is about 1% to 2%, and
        essentially all of those with tumors had large PARMs (30-33 repeats;
        ref. 84).
      explanation: >-
        The 2017 AACR predisposition workshop review gives the risk of a neural
        crest tumour for carriers of PHOX2B non-polyalanine repeat mutations
        (NPARMs) as about 45%, inside the FREQUENT band (30-79%). The same
        paragraph names the tumours concerned as neuroblastoma or related
        tumours, including ganglioneuroblastoma and ganglioneuroma, all of which
        HPO's definition of neuroblastic tumour includes, so the figure supports
        this context's frequency. The sentence cites one CCHS study (its ref.
        84).
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        an invasive tumor (neuroblastoma) was diagnosed in 6 (46%) of 13
        patients harboring either a missense or a frameshift mutation
      explanation: >-
        In this series of 188 CCHS probands, 6 of the 13 carriers of a PHOX2B
        missense or frameshift mutation (non-polyalanine repeat mutations) were
        diagnosed with a tumour, which the authors group as invasive
        (neuroblastoma). Across the series the paper classes the ten tumours as
        seven neuroblastomas, one ganglioneuroblastoma and two ganglioneuromas,
        so neuroblastic tumour is the safe umbrella term for the six. The 13
        carriers are the paper's own cohort (10 frameshift and 3 missense, so
        nonsense mutations are not represented), which makes the quote a primary
        result although it sits in the Discussion. 6 of 13 (46%) falls in the
        FREQUENT band (30-79%) on a small denominator, as a count in one series
        rather than a lifetime risk estimate.
  - genetic_context:
      gene:
        preferred_term: PHOX2B
        term:
          id: hgnc:9143
          label: PHOX2B
      allele_type: polyalanine repeat expansion mutation (PARM)
      variant_type: duplication
      description: >-
        Heterozygous in-frame duplication that expands the 20-residue
        polyalanine tract of PHOX2B; the commonest genotype in CCHS.
    frequency: VERY_RARE
    notes: >-
      About 1-2% risk of a neural crest (neuroblastic) tumour in the 2017 AACR
      predisposition summary, which adds that in the series it cites essentially
      all expansion carriers with a tumour had large expansions (30-33 repeats);
      its own table of predisposing alterations lists PARM-28-33+. In a
      188-proband series the only tumours among 161 expansion carriers were two
      ganglioneuromas, in carriers of +9 and +13 alanine expansions, but the
      tumours of expansion carriers are not all benign: a high-risk
      neuroblastoma has been reported in a child with a 20/33 expansion. The
      2020 European guideline's follow-up table lists 20/28 to 20/33 expansions
      for neural crest tumour screening.
    evidence:
    - reference: PMID:28674118
      reference_title: Retinoblastoma and Neuroblastoma Predisposition and Surveillance.
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        The risk for a neural crest tumor for individuals with NPARMs is about
        45%, whereas the risk for individuals with PARMs is about 1% to 2%, and
        essentially all of those with tumors had large PARMs (30-33 repeats;
        ref. 84).
      explanation: >-
        The 2017 AACR predisposition workshop review gives the risk of a neural
        crest tumour for carriers of PHOX2B polyalanine repeat expansions
        (PARMs) as about 1-2%, inside the VERY_RARE band (<5%). It adds that
        essentially all PARM carriers with tumours had large expansions (30-33
        repeats), citing one CCHS study (its ref. 84); the review's own Table 2
        lists PARM-28-33+ among the predisposing alterations, so 30-33 describes
        the tumour cases in that study rather than a sharp risk threshold. The
        paragraph ties larger expansions to neuroblastoma or related tumours,
        including maturing ganglioneuroblastoma and ganglioneuroma, so the
        figure is a neural crest (neuroblastic) tumour risk and not a risk for
        neuroblastoma alone.
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        a differentiated tumor (ganglioneuroma) was diagnosed in only 2 (1.24%)
        of 161 patients harboring an in-frame duplication leading to an
        expansion of +9 alanines in one and +13 in the other
      explanation: >-
        In this series of 188 CCHS probands, only 2 of the 161 carriers of a
        PHOX2B polyalanine repeat expansion (an in-frame duplication adding 5 to
        13 alanines) were diagnosed with a tumour. Both were differentiated
        ganglioneuromas, which HPO's definition of neuroblastic tumour includes,
        in carriers of +9 and +13 alanine expansions. The paper reports +5 to +7
        expansions as by far the most frequent in its series, so the figure
        pools all expansion lengths. 2 of 161 (1.24%) falls in the VERY_RARE
        band (<5%), as the paper's own cohort count rather than a lifetime risk
        estimate.
- category: Cardiovascular
  name: Autonomic Cardiac Dysregulation
  description: >-
    Reduced heart rate variability and prolonged sinus pauses, which may be
    asymptomatic until they cause syncope or sudden death - the reason
    surveillance Holter monitoring is recommended.
  phenotype_term:
    preferred_term: Decreased heart rate variability
    term:
      id: HP:0031861
      label: Decreased heart rate variability
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      evaluation of ANS dysregulation across all organ systems affected by the ANS
    explanation: >-
      Supports systematic autonomic dysregulation as a curated feature requiring
      evaluation; no frequency band is asserted, as the statement does not
      quantify the cardiac arm.
genetic:
- name: PHOX2B
  notes: >-
    Paired-like homeobox transcription factor and master regulator of visceral
    reflex circuits. Heterozygous de novo mutation causes essentially all
    congenital central hypoventilation syndrome. Most mutations are expansions of
    5-9 alanines within a 20-residue polyalanine tract; expansion length
    correlates with severity closely enough to guide clinical anticipation.
    Non-polyalanine repeat mutations (frameshift, missense) produce more severe
    disease with greater neural-crest tumour risk. Parents should be tested,
    since mosaicism and mildly affected carriers occur.
  gene_term:
    preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  relationship_type: CAUSATIVE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_07133a39-00fb-43c4-a7e2-a465c3c0c4ca-2021-06-15T152906.892Z
    subtype: Haddad Syndrome
    evidence:
    - reference: CGGV:assertion_07133a39-00fb-43c4-a7e2-a465c3c0c4ca-2021-06-15T152906.892Z
      reference_title: "PHOX2B / Haddad syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PHOX2B | HGNC:9143 | Haddad syndrome | MONDO:0020493 | AD | Definitive"
      explanation: >-
        The ClinGen Hereditary Cancer Gene Curation Expert Panel classifies the
        autosomal dominant PHOX2B-Haddad syndrome relationship as Definitive
        (SOP8, 2021-06-15); MONDO:0020493 is this entry's Haddad Syndrome
        subtype. ClinGen scopes the curation to PHOX2B non-polyalanine repeat
        mutations, while the subtype follows MONDO's clinical definition (CCHS
        with Hirschsprung disease); the subtype's description records the
        difference.
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data support an essential role of PHOX2B in the normal patterning of
      the autonomous ventilation system and, more generally, of the ANS in humans.
    explanation: >-
      States the gene's causal role in both the respiratory and the wider
      autonomic arms of the phenotype.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Parents of patients with CCHS should be tested for PHOX2B mutations.
    explanation: >-
      Supports the parental testing recommendation noted here, which follows
      from mosaicism and mild carrier states.
inheritance:
- name: Autosomal dominant, usually de novo
  description: >-
    Heterozygous mutation, dominant in effect, arising de novo in most cases -
    though "typically" rather than exclusively dominant: biallelic
    reduced-penetrance PHOX2B variants have been reported in two families.
    Somatic and germline mosaicism is present in 5-25% of asymptomatic parents,
    which has a counselling consequence that is easy to get wrong: a fetus must
    be considered at risk even when neither parent carries the proband's
    variant. Where a parent is a known heterozygote, sib risk is 50%. Once the
    familial variant is known, prenatal testing and preimplantation genetic
    testing are available.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found heterozygous de novo mutations in PHOX2B in 18 of 29 individuals
      with CCHS.
    explanation: >-
      Establishes the heterozygous, de novo pattern in the majority of cases.
  - reference: PMID:23692929
    reference_title: Congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases are sporadic and caused by de novo PHOX2B gene mutations, which
      are usually polyalanine repeat expansions.
    explanation: >-
      Independently confirms the sporadic, de novo pattern and the dominant
      mutation class.
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CCHS is typically inherited in an autosomal dominant manner (CCHS caused by
      biallelic reduced penetrance PHOX2B pathogenic variants has been reported
      in two families).
    explanation: >-
      Cited as PARTIAL because it qualifies the dominant claim rather than simply
      supporting it: a biallelic reduced-penetrance route exists, reported in two
      families, so "autosomal dominant" is typical rather than exclusive.
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Somatic/germline mosaicism is present in 5%-25% of asymptomatic parents.
    explanation: >-
      Quantifies parental mosaicism, which is the reason parental testing is
      recommended and the reason a negative parental test does not reduce fetal
      risk to background - see the recurrence-risk note in this block.
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      because of the high frequency of parental mosaicism in CCHS, a fetus should
      be considered at risk for CCHS even if the PHOX2B pathogenic variant
      detected in the proband was not identified in either parent
    explanation: >-
      The counselling consequence of the mosaicism rate, and the single most
      consequential statement in this block: a reassuring parental result does
      not make a subsequent pregnancy low-risk.
diagnosis:
- name: PHOX2B mutation testing
  description: >-
    The confirmatory diagnostic test, and required for the diagnosis. Testing
    should include both the polyalanine repeat screen and sequencing for
    non-polyalanine mutations, since the latter carry different severity and
    tumour risk. Genotype also directs subsequent surveillance intensity.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A PHOX2B mutation is required to confirm the diagnosis of CCHS.
    explanation: >-
      States the diagnostic requirement directly.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maintaining a high index of suspicion in cases of unexplained alveolar
      hypoventilation will likely identify a higher incidence of milder cases of
      CCHS.
    explanation: >-
      Records that the phenotypic boundary is testing-dependent and expanding,
      which is why historical severity and prevalence figures describe the severe
      end of the spectrum.
- name: Scheduled multisystem surveillance
  description: >-
    Assessment every six months for the first three years, then annually. The
    schedule is multisystem because the disorder is, and several of its
    components look at things a respiratory follow-up would not: haemoglobin,
    haematocrit and reticulocyte count for polycythemia (the marrow's response
    to chronic hypoxaemia, and an index of whether ventilation is actually
    adequate); 72-hour Holter for abrupt prolonged asystoles; echocardiography
    for right ventricular hypertrophy and cor pulmonale; neurocognitive and
    educational assessment; and comprehensive age-appropriate non-invasive
    autonomic testing. Polycythemia and RVH are the two findings that reveal
    silently inadequate ventilation in a patient who cannot report dyspnoea.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      hemoglobin/hematocrit and reticulocyte count for polycythemia; (3) 72-hour
      Holter recording for abrupt, prolonged asystoles; (4) echocardiogram changes
      consistent with right ventricular hypertrophy and cor pulmonale; (5)
      neurocognitive assessment/educational needs; and (6) comprehensive
      age-appropriate noninvasive autonomic testing
    explanation: >-
      Enumerates the surveillance components beyond the respiratory assessment,
      which is what this diagnostic entry records.
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Assess every six months for the first three years, then annually thereafter
    explanation: >-
      Gives the surveillance cadence.
- name: Genotype-directed neural crest tumour screening
  description: >-
    Screening for neural crest tumours is targeted by PHOX2B genotype rather
    than applied to every patient. The 2010 ATS statement recommends imaging
    for neural crest tumours in individuals at greatest risk based on PHOX2B
    mutation. The 2020 European guideline recommends regular screening of
    carriers of longer polyalanine expansions and of non-polyalanine repeat
    mutations, especially during childhood. Its follow-up table names carriers
    of 20/28 to 20/33 expansions and of non-polyalanine repeat mutations, and
    sets the interval at every 6 months under 2 years of age, annually or
    bi-annually from 2 to 7 years, and by local oncology protocols after 7
    years, using chest and abdominal imaging and KUB (kidney, ureter and
    bladder) ultrasound, with total body MRI if needed.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      (2) barium enema or manometry and/or full thickness rectal biopsy for
      patients with a history of constipation; and (3) imaging for neural crest
      tumors in individuals at greatest risk based on PHOX2B mutation.
    explanation: >-
      The third of the management options the 2010 ATS policy statement
      recommends is imaging for neural crest tumours in the individuals at
      greatest risk based on their PHOX2B mutation, so tumour imaging is
      directed by genotype rather than applied universally. The second option,
      for constipation, is part of the same sentence and is not used here.
  - reference: PMID:32958024
    reference_title: Guidelines for diagnosis and management of congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Patients carrying longer PARMs or NPARMs need regularly screening for
      neural crest tumours, especially during childhood (Table 2).
    explanation: >-
      The 2020 guideline from the Guideline Development Group of the European
      CCHS Consortium Project recommends neural crest tumour screening by
      genotype: carriers of longer polyalanine repeat mutations (PARMs) or of
      non-polyalanine repeat mutations (NPARMs) need regular screening,
      especially during childhood. The sentence is the guideline's own
      recommendation and reports no data; it points to Table 2, quoted in the
      next item for the subjects, schedule and tests.
  - reference: PMID:32958024
    reference_title: Guidelines for diagnosis and management of congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      Neural crests tumours | -20/28-20/33 PARMs -NPARMs | <2yo: Every 6
      months 2-7yo: Annually or bi-annually >7yo: according to local
      oncologist protocols | -Chest and abdominal imaging, KUB ultrasound -Total
      body MRI if needed | Detect neural crests tumours
    explanation: >-
      The neural crest tumour row of the guideline's Table 2 (Follow up
      programme). It names the subjects as carriers of 20/28 to 20/33 PARMs and
      of NPARMs, which gives the range behind 'longer PARMs' in the
      recommendation above, and sets the interval: every 6 months under 2
      years, annually or bi-annually from 2 to 7 years, and according to local
      oncology protocols after 7 years. The tests are chest and abdominal
      imaging and KUB (kidney, ureter and bladder) ultrasound, with total body
      MRI if needed. 'Bi-annually' is ambiguous between twice a year and every
      two years, and the table does not say which.
- name: State- and activity-resolved physiological assessment
  description: >-
    Comprehensive in-hospital evaluation of ventilatory needs and responsiveness
    across wakefulness and all sleep stages, at varying activity and
    concentration levels, both spontaneously breathing and ventilated. Repeated
    biannually then annually. This is not a one-off titration: because the
    deficit is state-dependent, adequacy of support in one state says nothing
    about another.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      biannual then annual in-hospital comprehensive evaluation
    explanation: >-
      Establishes the recommended assessment cadence, which underlies the
      repeated-evaluation point this diagnostic entry makes.
differential_diagnoses:
- name: ROHHAD
  description: >-
    Rapid-onset obesity with hypothalamic dysfunction, hypoventilation and
    autonomic dysregulation (ROHHAD) resembles later-onset CCHS: both combine
    alveolar hypoventilation with autonomic dysregulation, and the children in
    the cohort that named ROHHAD had been referred with late-onset central
    hypoventilation with hypothalamic dysfunction. In ROHHAD the
    hypoventilation typically comes late, after rapid-onset obesity in early
    childhood; in the cohort that named the syndrome, the obesity was followed
    by hypothalamic dysfunction and then autonomic dysregulation, with alveolar
    hypoventilation last. The 2020 European CCHS guideline describes ROHHAD
    among the other primary central hypoventilation syndromes that specialist
    review and some basic investigations usually help exclude. The study that
    named ROHHAD distinguished it from CCHS by PHOX2B status: PHOX2B
    sequencing was negative, and the authors concluded that ROHHAD is an
    entity distinct from CCHS. The 2010 ATS statement requires a PHOX2B
    mutation to confirm the diagnosis of CCHS, but the 2020 European guideline
    notes that a subset of patients with a CCHS phenotype has no PHOX2B
    mutation, so a negative PHOX2B result does not by itself exclude CCHS.
  distinguishing_features:
  - >-
    Rapid-onset obesity, typically the first manifestation of ROHHAD, beginning
    in early childhood (median onset 3 years in the cohort that named it) and
    preceding the alveolar hypoventilation (median onset 6.2 years in that
    cohort).
  - >-
    Hypothalamic dysfunction, which in the cohort that named ROHHAD followed
    the obesity, and endocrinopathies such as water imbalance and precocious
    puberty, which the 2020 European guideline lists among the features of
    ROHHAD that develop after the obesity.
  - >-
    PHOX2B status: PHOX2B sequencing was negative in the cohort that named
    ROHHAD, whose authors concluded from it that ROHHAD is distinct from CCHS.
    The 2010 ATS statement requires a PHOX2B mutation to confirm the diagnosis
    of CCHS, but the 2020 European guideline notes that a subset of patients
    with a CCHS phenotype has no PHOX2B mutation, so a negative result does
    not by itself exclude CCHS.
  disease_term:
    preferred_term: ROHHAD (rapid-onset obesity with hypothalamic dysfunction, hypoventilation and autonomic dysregulation)
    term:
      id: MONDO:0017408
      label: rapid-onset childhood obesity-hypothalamic dysfunction-hypoventilation-autonomic dysregulation syndrome
  evidence:
  - reference: PMID:17606542
    reference_title: Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Negative PHOX2B sequencing results demonstrate that this entity is distinct
      from congenital central hypoventilation syndrome.
    explanation: >-
      Ize-Ludlow et al. 2007 is the study that named ROHHAD. Its 23 children had
      been referred with late-onset central hypoventilation with hypothalamic
      dysfunction; blood for genetic testing was available for 15, and the
      abstract reports that candidate-gene testing, PHOX2B included, found no
      mutations or rare variants. In the quoted conclusion 'this entity' is
      ROHHAD, named in the sentence before it, and the authors read the
      negative PHOX2B sequencing as showing that it is distinct from CCHS. That
      is a conclusion about the entity from one referral cohort, not a rule that
      PHOX2B testing classifies every patient. A subset of patients with a CCHS
      phenotype has no PHOX2B mutation (2020 European CCHS guideline,
      PMID:32958024, quoted below), so a negative result does not by itself
      exclude CCHS. And a patient with this presentation can carry a PHOX2B
      mutation: the Heide et al. 2016 series (PMID:26375764), restricted to
      patients with a neuroblastic tumour and a PHOX2B non-polyalanine repeat
      mutation, includes one patient who also had late-onset hypoventilation
      with hypothalamic dysfunction (LO-CHS/HD), the presentation this cohort
      was recruited on, though that abstract does not call the patient's
      condition ROHHAD.
  - reference: PMID:17606542
    reference_title: Rapid-onset obesity with hypothalamic dysfunction, hypoventilation, and autonomic dysregulation presenting in childhood.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The most characteristic manifestations were the presentation of
      rapid-onset obesity in the first 10 years of life (median age at onset: 3
      years), followed by hypothalamic dysfunction and then onset of symptoms of
      autonomic dysregulation (median age at onset: 3.6 years) with later onset
      of alveolar hypoventilation (median age at onset: 6.2 years).
    explanation: >-
      Results of the chart review in which Ize-Ludlow and colleagues named
      ROHHAD. The sentence gives what the authors call the most characteristic
      manifestations in their series, in order of onset: rapid-onset obesity
      within the first 10 years of life (median onset 3 years), then
      hypothalamic dysfunction, then autonomic dysregulation (median onset 3.6
      years), and later alveolar hypoventilation (median onset 6.2 years).
      Because the authors call these the most characteristic manifestations,
      this is the typical sequence, not an invariable one, and the order of the
      last two features rests on this series' medians. The abstract gives no
      median for hypothalamic dysfunction and does not say whether the medians
      come from all 23 children identified or from the 15 with full charts. The
      sentence does not mention CCHS: the comparison in this row is drawn
      against the entry's Later-onset CCHS subtype, defined there by alveolar
      hypoventilation during sleep with attenuated autonomic manifestations,
      and rests on that subtype's own evidence.
  - reference: PMID:32958024
    reference_title: Guidelines for diagnosis and management of congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      ROHHAD, a very rare condition, stands for Rapid Onset Obesity,
      Hypoventilation, Hypothalamic and Autonomic Disorder. Affected subjects
      typically present with rapid onset of obesity during early childhood;
      other key features develop later and include hypoventilation,
      endocrinopathies (water imbalance, precocious puberty), autonomic
      dysregulation (strabismus and disorders of temperature control) and
      sudden cardio-respiratory arrest. Specialist review and some basic
      investigations usually help exclude these other conditions.
    explanation: >-
      The 2020 European CCHS guideline describes ROHHAD in its diagnostic text
      for alveolar hypoventilation, in a paragraph that places it among the
      primary central hypoventilation syndromes still to be completely
      characterized. The quote ends with that paragraph's last sentence, which
      says that specialist review and some basic investigations usually help
      exclude these other conditions, ROHHAD among them, so the guideline
      treats ROHHAD as a condition to exclude when diagnosing CCHS. The first
      quoted sentence names ROHHAD and expands the acronym with
      'Hypothalamic'. The second puts rapid onset of obesity in early childhood
      first and lists hypoventilation, endocrinopathies (water imbalance,
      precocious puberty), autonomic dysregulation (strabismus and disorders of
      temperature control) and sudden cardio-respiratory arrest as features
      that develop later. It does not order the later features among
      themselves, gives no ages, does not itself call the endocrinopathies
      hypothalamic, and does not say which features ROHHAD shares with CCHS;
      the order after obesity and the median ages come from PMID:17606542.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A PHOX2B mutation is required to confirm the diagnosis of CCHS.
    explanation: >-
      The 2010 ATS policy statement makes a PHOX2B mutation a requirement for
      confirming the diagnosis of CCHS. That is the CCHS side of the PHOX2B
      distinguishing feature; the ROHHAD side is the negative PHOX2B sequencing
      in the cohort that named ROHHAD, quoted above. The 2020 European
      guideline qualifies the requirement, as the next item quotes.
  - reference: PMID:32958024
    reference_title: Guidelines for diagnosis and management of congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      In addition, a subset of patients with a CCHS phenotype has no mutation
      in PHOX2B.
    explanation: >-
      In its introductory text, the 2020 European CCHS guideline states that a
      subset of patients with a CCHS phenotype has no PHOX2B mutation; its next
      sentence names MYO1H and LBX1 as genes found mutated in consanguineous
      CCHS families. That qualifies the 2010 ATS requirement quoted in the item
      above, and it is why the PHOX2B distinguishing feature carries a caveat:
      a negative PHOX2B result does not by itself exclude CCHS, so the negative
      sequencing in the cohort that named ROHHAD distinguishes the two entities
      without classifying every individual patient. The sentence gives no size
      for the subset.
treatments:
- name: Lifelong Assisted Ventilation During Sleep
  description: >-
    The mainstay, and it is supportive rather than corrective: nothing addresses
    the chemoreceptive lesion, so ventilation is substituted for the absent
    automatic drive for life. Delivered by positive-pressure ventilation through
    tracheostomy (the standard in infancy and in severe disease) or by mask in
    older and milder patients. It acts on the hypoventilation node, downstream of
    the chemoreflex failure, which is why it restores gas exchange without
    restoring the sensation of air hunger or the ability to self-correct.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Sleep-Dependent Alveolar Hypoventilation
    treatment_effect: INHIBITS
    description: >-
      Mechanically substitutes for the absent automatic ventilatory drive during
      sleep, correcting the gas-exchange consequence without acting on the
      chemoreceptive lesion.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      to assess ventilatory needs during varying levels of activity and
      concentration, in all stages of sleep, with spontaneous breathing, and with
      artificial ventilation
    explanation: >-
      Establishes artificial ventilation as the assumed standard of care around
      which the entire management protocol is built.
- name: Diaphragm Pacing by Phrenic Nerve Stimulation
  description: >-
    Bilateral phrenic nerve pacing drives the diaphragm directly, and is used
    principally to give ambulatory daytime support to patients who also
    hypoventilate awake - freeing them from a portable ventilator rather than
    replacing nocturnal support. Like positive-pressure ventilation it acts on
    the hypoventilation node and does nothing for the chemoreflex; unlike it, it
    requires an intact phrenic nerve and diaphragm, which the disorder spares.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Sleep-Dependent Alveolar Hypoventilation
    treatment_effect: INHIBITS
    description: >-
      Electrically driven diaphragmatic contraction substitutes for absent
      automatic drive, principally to enable daytime mobility.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recommended management options aimed toward maximizing safety and
      optimizing neurocognitive outcome include
    explanation: >-
      Cited as PARTIAL: the policy statement's abstract frames management around
      safety and neurocognitive outcome but does not enumerate diaphragm pacing
      among the listed recommendations, so this treatment is curated as an
      established option without abstract-level guideline endorsement.
- name: Cardiac Pacemaker for Prolonged Asystole
  description: >-
    The autonomic arm of this disorder can kill independently of the respiratory
    arm. Prolonged transient asystoles - presenting as syncope or staring spells,
    and of significant duration (3.0 seconds or longer) - may warrant a cardiac
    pacemaker. This is why 72-hour Holter recording is scheduled surveillance
    rather than a response to symptoms: the threshold is a recorded pause
    duration, and the events are easily mistaken for seizures or dismissed as
    behavioural.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Generalised Autonomic Dysregulation and Neural Crest Complications
    treatment_effect: BYPASSES
    description: >-
      Paces through the sinus pauses produced by autonomic dysregulation,
      supplying the impulse the failed reflex does not. It works around the
      lesion rather than blocking or decreasing it, which is why the effect is
      BYPASSES rather than INHIBITS.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Prolonged transient asystoles that may present as syncope and/or staring
      spells and are of significant duration (≥3.0 seconds) may warrant placement
      of a cardiac pacemaker
    explanation: >-
      Gives both the indication and the duration threshold, which is what makes
      the Holter surveillance actionable.
- name: Protective Eyewear
  description: >-
    Abnormal pupillary reactivity is part of the autonomic phenotype, and it has
    a practical consequence that is easy to overlook: with impaired pupillary
    constriction, ordinary daily light exposure - LED lighting, screens in
    school and work settings, mobile devices - is not attenuated normally, so
    protective eyewear may be needed. Curated because it is a genuine management
    item that follows from the autonomic node rather than the respiratory one.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Generalised Autonomic Dysregulation and Neural Crest Complications
    treatment_effect: BYPASSES
    description: >-
      Attenuates incident light externally, standing in for the pupillary
      constriction the failed reflex does not provide. It does not restore or
      decrease the underlying dysregulation, so the effect is BYPASSES.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      abnormal pupillary reactivity may necessitate protective eye wear given the
      amount of light exposure in daily life from LED lights, and screen time in
      educational settings, computer-based work environments, and mobile devices
    explanation: >-
      States the indication and the everyday exposures that make it necessary.

name: Congenital Central Hypoventilation Syndrome
creation_date: "2026-08-24T00:00:00Z"
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
- Congenital Disorder
disease_term:
  preferred_term: congenital central hypoventilation syndrome
  term:
    id: MONDO:0800031
    label: central hypoventilation syndrome, congenital
description: >-
  Congenital central hypoventilation syndrome (historically Ondine's curse) is a
  rare disorder of autonomic control in which the automatic drive to breathe
  fails during sleep. The lesion is not in the lung, the chest wall, the airway,
  or the respiratory muscles: it is the loss of central chemoreception, so
  rising carbon dioxide and falling oxygen no longer generate a corrective
  ventilatory response, and breathing during sleep - which depends entirely on
  that automatic loop - becomes inadequate or ceases. Wakeful, cortically driven
  breathing is comparatively preserved, which is why affected infants can appear
  normal when awake and hypoventilate every time they fall asleep. Almost all
  cases are caused by de novo heterozygous mutation of PHOX2B, usually an
  expansion of a 20-residue polyalanine tract, and in mouse models the specific
  neuronal casualty is the retrotrapezoid nucleus - the principal central
  chemoreceptor site - with no other identified neuronal loss. Because PHOX2B is
  a master regulator of visceral reflex circuits generally, the disorder extends
  beyond breathing to a wider autonomic dysregulation, and to neural-crest
  derived complications: Hirschsprung disease and neuroblastic tumours. There is
  no treatment for the chemoreceptive lesion; management is lifelong assisted
  ventilation during sleep.
notes: >-
  RELATIONSHIP TO sleep_disordered_breathing_intermittent_hypoxia, AND WHY THIS
  ENTRY CONFORMS ONLY IN PART. The entry conforms at the module's control-arm
  trigger, which explicitly covers the hyporesponsive (failed chemoreception)
  case as distinct from the unstable (high-loop-gain) case. It deliberately does
  NOT conform at the module's central node, #Chronic Intermittent Hypoxia and
  Reoxygenation: the gas-exchange lesion here is sustained nocturnal
  hypoventilation with hypercapnia, not cyclical desaturation followed by
  reoxygenation, and the module's notes name this disorder as the case that
  boundary exists for. The distinction is not pedantic - the reoxygenation phase
  is what generates the oxidative-inflammatory vascular arm in obstructive
  disease, and its absence here means the systemic consequences differ in kind,
  not merely in degree.

  DIAGNOSIS IS GENETIC, NOT PHYSIOLOGICAL. A PHOX2B mutation is required to
  confirm the diagnosis. This matters for curation because the phenotype's
  boundaries have moved: milder and later-onset cases are recognised as PHOX2B
  testing spreads, so historical prevalence and severity figures describe the
  severe end of a spectrum.
has_subtypes:
- name: Neonatal-onset CCHS
  display_name: Neonatal-onset congenital central hypoventilation syndrome
  description: >-
    Recognised in the first 30 days of life, and the more severe presentation.
    Hypoventilation with monotonous respiratory rates and shallow breathing,
    during sleep only or awake as well as asleep, together with the fuller
    autonomic picture: reduced heart-rate beat-to-beat variability, sinus
    pauses, altered thermoregulation, and altered pupillary light response.
    Neural-crest complications (Hirschsprung disease, oesophageal dysmotility,
    severe constipation, neuroblastic tumours) cluster here.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neonatal-onset CCHS is characterized by apparent hypoventilation with
      monotonous respiratory rates and shallow breathing either during sleep only
      or while awake as well as asleep; ANSD including decreased heart rate
      beat-to-beat variability and sinus pauses; altered temperature regulation;
      and altered pupillary response to light.
    explanation: >-
      Defines the neonatal-onset presentation and its autonomic features, which
      is what separates it from the later-onset subtype below.
- name: Later-onset CCHS
  display_name: Later-onset congenital central hypoventilation syndrome
  description: >-
    Less common, recognised from one month of age to adulthood, and attenuated:
    alveolar hypoventilation during sleep with milder autonomic manifestations.
    The subtype whose recognition depends on maintaining suspicion in
    unexplained hypoventilation, and the reason the phenotypic boundary of this
    disorder is still moving as PHOX2B testing spreads.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Later-onset CCHS is characterized by alveolar hypoventilation during sleep
      and attenuated manifestations of ANSD.
    explanation: >-
      Defines the later-onset subtype and its attenuated autonomic involvement.
- name: Haddad Syndrome
  display_name: Haddad syndrome (CCHS with Hirschsprung disease)
  subtype_term:
    preferred_term: Haddad syndrome
    term:
      id: MONDO:0020493
      label: Haddad syndrome
  description: >-
    Congenital central hypoventilation syndrome occurring together with
    Hirschsprung disease. The subtype is defined clinically, by the presence of
    Hirschsprung disease, and not by age at onset or by genotype. Hirschsprung
    disease is more prevalent in CCHS caused by PHOX2B non-polyalanine repeat
    mutations than in CCHS caused by polyalanine repeat expansions, but it is
    not confined to those mutations: in a large genotyped series, expansion
    carriers with CCHS and Hirschsprung disease tended to carry longer
    expansions than patients with isolated CCHS, yet the commonest expansion
    (+7 alanines) was the same in both groups, so expansion length does not
    accurately predict which carriers have Hirschsprung disease. That overlap is
    why the subtype is kept on its clinical definition rather than redefined by
    genotype. ClinGen classifies PHOX2B as definitively associated with
    autosomal dominant Haddad syndrome in a curation scoped to non-polyalanine
    repeat mutations; that genotype framing is ClinGen's, and this subtype
    follows the clinical definition.
  evidence:
  - reference: PMID:15657873
    reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      The association of CCHS and HSCR is known as "Haddad syndrome" (MIM 209880).
    explanation: >-
      In the Introduction of their cohort study of 188 CCHS probands, Trochet et
      al. state the established name: the association of CCHS with Hirschsprung
      disease (HSCR; both abbreviations are defined earlier in the same
      paragraph) is known as Haddad syndrome. That is the definition this
      subtype uses. The sentence restates naming rather than reporting a result
      of the study, hence BACKGROUND. The MIM number in the quote is the one the
      same paragraph gives for CCHS itself.
  - reference: PMID:16888290
    reference_title: "Congenital central hypoventilation syndrome: PHOX2B mutations and phenotype."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Increased prevalence of continuous ventilatory dependence, HSCR, and neural
      crest tumors was seen in the nonpolyalanine repeat group compared to those
      with polyalanine repeat mutations.
    explanation: >-
      Berry-Kravis et al. compared the clinical features of CCHS by PHOX2B
      mutation class; the abstract's OBJECTIVES set this up as cases with
      nonpolyalanine repeat mutations against those with polyalanine expansion
      mutations. The first RESULTS sentence gives the cohort: 14
      non-polyalanine repeat mutations, including missense, nonsense and
      frameshift mutations, and 170 polyalanine repeat mutations identified in
      184 CCHS probands. The quoted sentence, the last in RESULTS, reports an
      increased prevalence of HSCR, the abstract's abbreviation for Hirschsprung
      disease, in the non-polyalanine repeat group compared with the
      polyalanine repeat group. Only the Hirschsprung part of the sentence is
      used; the continuous ventilatory dependence and neural crest tumour parts
      are not. The abstract gives no per-group Hirschsprung rates and reports
      no test of the difference, so this item supports the direction of the
      difference, not its size.
  - reference: PMID:15657873
    reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Although patients with CCHS + HSCR tend to harbor a longer alanine
      expansion, in comparison with that of patients with isolated CCHS (fig. 1),
      one cannot predict the accurate phenotype from the genotype, since the
      +7-alanine mutation is the most frequent expansion in both the group of
      patients with isolated CCHS and the group with CCHS + HSCR.
    explanation: >-
      In their series of 188 CCHS probands, Trochet et al. compare the PHOX2B
      genotypes of their clinical subgroups (their fig. 1). Expansion carriers
      with CCHS and Hirschsprung disease tend to carry a longer polyalanine
      expansion than patients with isolated CCHS, but the +7-alanine expansion
      is the most frequent in both groups, so the authors conclude that the
      accurate phenotype cannot be predicted from the genotype. The sentence
      therefore states three things directly: Hirschsprung disease in CCHS
      occurs with polyalanine repeat expansions; it tends to go with longer
      expansions; and expansion length does not reliably separate CCHS with
      Hirschsprung disease from isolated CCHS. Its scope is expansion length
      and Hirschsprung disease only. Mutation class does carry information: in
      the same series most missense or frameshift carriers presented with
      Hirschsprung disease, and the paper's title finding is that genotype
      allows prediction of tumour risk. Recording the Haddad subtype by its
      clinical definition rather than by genotype is this entry's reading; the
      paper does not discuss how subtypes should be defined.
  - reference: CGGV:assertion_07133a39-00fb-43c4-a7e2-a465c3c0c4ca-2021-06-15T152906.892Z
    reference_title: "PHOX2B / Haddad syndrome (Definitive)"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    directness: DIRECT
    snippet: >-
      In summary, PHOX2B-NPARM is definitively associated with autosomal dominant
      Haddad syndrome (neuroblastoma, Hirschsprung disease in CCHS syndrome,
      susceptibility to).
    explanation: >-
      The concluding sentence of the curation by ClinGen's Hereditary Cancer
      Gene Curation Expert Panel, which classifies PHOX2B for Haddad syndrome
      as Definitive, autosomal dominant; the record's validity table keys the
      classification to MONDO:0020493, the term this subtype is bound to.
      NPARM is the record's own abbreviation, defined earlier in the same
      evidence summary, for PHOX2B nonpolyalanine repeat mutations (missense,
      nonsense and frameshift). On differences in molecular mechanism and in
      phenotype, the summary splits ClinGen's PHOX2B curations into PHOX2B
      PARMs-CCHS and PHOX2B NPARMs-Haddad syndrome, and this record is the
      NPARM curation. MONDO:0020493 is defined clinically instead, as CCHS
      occurring together with Hirschsprung disease, and names no mutation
      class; this subtype follows that clinical definition. ClinGen's longer
      name for the curated entity adds a neuroblastoma-susceptibility
      parenthetical, and the summary gives more frequent neuroblastoma with
      NPARMs as one reason for the split, but the classification is recorded
      against MONDO:0020493 Haddad syndrome alone, so it is not a ClinGen
      classification of PHOX2B for neuroblastoma susceptibility as a disease of
      its own. In this entry the neuroblastic tumour risk of non-polyalanine
      repeat mutation carriers is curated on the Neuroblastic Tumour phenotype.
pathophysiology:
- name: PHOX2B Polyalanine Expansion or Frameshift Mutation
  description: >-
    The trigger. PHOX2B encodes a paired-like homeobox transcription factor that
    is a master regulator of visceral reflex circuit development. Heterozygous de
    novo mutation causes the disorder, and the mutation class is unusual: most
    are expansions of 5-9 alanines within a normal 20-residue polyalanine tract,
    probably arising by non-homologous recombination rather than by point
    mutation. The expansion length predicts phenotype severity closely enough
    that genotype guides clinical anticipation, which is why testing is
    diagnostic rather than confirmatory. A minority carry non-polyalanine
    repeat mutations - frameshift and missense - which produce more severe
    disease and a higher risk of the neural-crest tumour complications.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found heterozygous de novo mutations in PHOX2B in 18 of 29 individuals
      with CCHS.
    explanation: >-
      The gene-discovery finding establishing PHOX2B mutation as the cause and
      its de novo, heterozygous character.
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most mutations consisted of 5-9 alanine expansions within a 20-residue
      polyalanine tract probably resulting from non-homologous recombination.
    explanation: >-
      Defines the characteristic mutation class and its likely origin, which is
      what makes the genotype an interpretable severity predictor.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A PHOX2B mutation is required to confirm the diagnosis of CCHS. Knowledge
      of the specific PHOX2B mutation aids in anticipating the CCHS phenotype
      severity.
    explanation: >-
      Establishes both the diagnostic requirement and the genotype-phenotype
      correlation on which clinical anticipation rests.
  downstream:
  - target: Failed Development of Retrotrapezoid Nucleus Chemoreceptor Neurons
    description: >-
      Mutant PHOX2B protein fails to support the development or survival of the
      retrotrapezoid nucleus neuronal population it normally specifies.
    causal_link_type: DIRECT
  - target: Generalised Autonomic Dysregulation and Neural Crest Complications
    description: >-
      PHOX2B is required for visceral reflex circuits and enteric and
      sympathoadrenal neural crest derivatives generally, so its disruption
      affects systems beyond respiratory control.
    causal_link_type: DIRECT

- name: Failed Development of Retrotrapezoid Nucleus Chemoreceptor Neurons
  description: >-
    The mechanistically decisive step, and the reason this disorder is so
    informative about normal physiology. In mice carrying the commonest
    CCHS-causing mutation, the retrotrapezoid nucleus / parafacial respiratory
    group is severely depleted, and NO OTHER neuronal loss can be identified -
    an extraordinarily selective lesion for a transcription factor expressed
    throughout the visceral reflex circuitry. Those neurons are necessary for
    central chemoreception and for generating a normal respiratory rhythm at
    birth. The selectivity is itself unexplained: why this particular population
    should be uniquely vulnerable to mutant PHOX2B remains unknown, and it is
    the central open question of the disorder's cell biology.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retrotrapezoid nucleus chemoreceptor neuron
    term:
      id: CL:1000001
      label: retrotrapezoid nucleus neuron
    modifier: DECREASED
  locations:
  - preferred_term: retrotrapezoid nucleus
    term:
      id: UBERON:0009918
      label: retrotrapezoid nucleus
  evidence:
  - reference: PMID:19712905
    reference_title: "PHOX2B in respiratory control: lessons from congenital central hypoventilation syndrome and its mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neurons of the retrotrapezoïd nucleus/parafacial respiratory group
      (RTN/pFRG) were found severely depleted in these mice and no other neuronal
      loss could be identified.
    explanation: >-
      Establishes both the identity of the lost population and the selectivity of
      the loss, which is what makes this node a specific lesion rather than a
      general developmental failure.
  - reference: PMID:19712905
    reference_title: "PHOX2B in respiratory control: lessons from congenital central hypoventilation syndrome and its mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Physiological experiments show that RTN/pFRG neurons are crucial to driving
      proper breathing at birth and are necessary for central chemoreception and
      the generation of a normal respiratory rhythm.
    explanation: >-
      Establishes the functional necessity of the lost population, which is what
      links this node to the chemoreflex failure below it.
  - reference: PMID:19712905
    reference_title: "PHOX2B in respiratory control: lessons from congenital central hypoventilation syndrome and its mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To date, the reason for the selective vulnerability of RTN/pFRG neurons to
      PHOX2B protein dysfunction remains unexplained.
    explanation: >-
      Cited as PARTIAL because it records the limit of the mechanism rather than
      supporting it: the selectivity is observed and unexplained, which is the
      open question named in the node description.
  downstream:
  - target: Loss of Central Chemoreflex Response to Hypercapnia and Hypoxaemia
    description: >-
      Loss of the principal central chemoreceptor population abolishes the
      ventilatory response to rising carbon dioxide.
    causal_link_type: DIRECT

- name: Loss of Central Chemoreflex Response to Hypercapnia and Hypoxaemia
  description: >-
    The central, disorder-defining physiological abnormality: rising arterial
    carbon dioxide and falling oxygen fail to produce the corrective increase in
    ventilation that they produce in everyone else. The defect is in the sensing
    and reflex limb, not in the effector - the lungs, chest wall, and respiratory
    muscles are normal and can be driven perfectly well, which is why mechanical
    ventilation works and why the disorder is compatible with normal life
    expectancy given adequate support. Patients characteristically do not
    experience dyspnoea during hypoventilation, because the sensation of air
    hunger depends on the same chemoreceptive input that is missing - a feature
    that makes the condition dangerous rather than merely limiting.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "sleep_disordered_breathing_intermittent_hypoxia#Ventilatory Control Instability or Chemoreflex Failure"
  biological_processes:
  - preferred_term: nervous system control of respiratory gas exchange
    term:
      id: GO:0002087
      label: regulation of respiratory gaseous exchange by nervous system process
    modifier: DECREASED
  - preferred_term: chemoreflex response to carbon dioxide
    term:
      id: GO:0010037
      label: response to carbon dioxide
    modifier: DECREASED
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS or Ondine's curse; OMIM
      209880) is a life-threatening disorder involving an impaired ventilatory
      response to hypercarbia and hypoxemia.
    explanation: >-
      Defines the disorder by exactly the failure this node encodes - an
      impaired ventilatory response to both chemical stimuli.
  - reference: PMID:23692929
    reference_title: Congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS) is characterized by
      hypoventilation during sleep and impaired ventilatory responses to
      hypercapnia and hypoxemia.
    explanation: >-
      Independently states the chemoreflex failure and pairs it with its
      state-dependent expression, which is the link to the node below.
  downstream:
  - target: Sleep-Dependent Alveolar Hypoventilation
    description: >-
      With the automatic chemoreflex lost, breathing during sleep - which depends
      on it - becomes inadequate, while wakeful cortically driven breathing is
      comparatively preserved.
    causal_link_type: DIRECT

- name: Sleep-Dependent Alveolar Hypoventilation
  description: >-
    The state dependence is the disorder's clinical signature and follows
    directly from how breathing is controlled. Wakefulness supplies a behavioural
    and cortical drive to breathe that is independent of chemoreception; sleep
    withdraws it, leaving the automatic chemoreflex loop alone in charge. Where
    that loop is absent, sleep produces progressive hypoventilation with
    hypercapnia and hypoxaemia, most severely in non-REM sleep, when
    chemoreceptive control normally dominates most completely. Severe cases
    hypoventilate when awake as well. Untreated, the consequence is cor
    pulmonale, hypoxic neurological injury, and death - the historical natural
    history that gave the disorder its Ondine's-curse name.
  role: effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: respiratory system process
    term:
      id: GO:0003016
      label: respiratory system process
    modifier: DECREASED
  - preferred_term: sleep
    term:
      id: GO:0030431
      label: sleep
  evidence:
  - reference: PMID:19712905
    reference_title: "PHOX2B in respiratory control: lessons from congenital central hypoventilation syndrome and its mouse models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a rare disease defined by the lack of CO(2) responsiveness and of breathing
      automaticity in sleep
    explanation: >-
      States the state dependence explicitly - loss of breathing automaticity
      specifically in sleep - which is what this node encodes.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS) is characterized by
      alveolar hypoventilation and autonomic dysregulation.
    explanation: >-
      Pairs the alveolar hypoventilation of this node with the autonomic arm
      curated separately, which is how the policy statement frames the disorder.
  downstream:
  - target: Ventilator Dependence and Neurocognitive Risk
    description: >-
      Hypoventilation that cannot be corrected physiologically must be corrected
      mechanically, for life; residual and intermittent inadequacy of support
      threatens neurocognitive outcome.
    causal_link_type: DIRECT

- name: Generalised Autonomic Dysregulation and Neural Crest Complications
  description: >-
    A parallel arm arising directly from PHOX2B's broader role, and the reason
    this is a syndrome rather than a respiratory disease. Autonomic dysregulation
    affects multiple organ systems - cardiac rhythm with prolonged sinus pauses,
    thermoregulation, pupillary responses, oesophageal motility, sweating. Two
    neural-crest complications carry particular weight because they are
    genotype-linked and require active surveillance: Hirschsprung disease from
    failed enteric neural crest colonisation, and neuroblastic tumours
    (ganglioneuroma, neuroblastoma) from the sympathoadrenal lineage. The
    cardiac arm is the one that kills without warning, which is why 72-hour
    Holter monitoring is recommended as routine surveillance rather than as
    investigation of symptoms.
  role: effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This core phenotype is associated with lower-penetrance anomalies of the
      autonomic nervous system (ANS) including Hirschsprung disease and tumors of
      neural-crest derivatives such as ganglioneuromas and neuroblastomas.
    explanation: >-
      Names the autonomic and neural-crest complications and records their lower
      penetrance relative to the respiratory core phenotype.
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that PHOX2B is expressed in both the central and the peripheral ANS
      during human embryonic development.
    explanation: >-
      Establishes the developmental expression pattern that explains why one
      transcription-factor mutation produces both the central respiratory and the
      peripheral autonomic arms.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      (2) barium enema or manometry and/or full thickness rectal biopsy for
      patients with a history of constipation; and (3) imaging for neural crest
      tumors in individuals at greatest risk based on PHOX2B mutation.
    explanation: >-
      Records the guideline's scheduled surveillance for the two neural-crest
      complications curated at this node, and that tumour imaging is directed by
      genotype rather than applied universally.
  downstream:
  - target: Ventilator Dependence and Neurocognitive Risk
    description: >-
      Autonomic complications add to the overall burden of management and to the
      risk of sudden deterioration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Neuroblastic Tumour
    description: >-
      Disrupted PHOX2B-dependent development of the sympathoadrenal neural crest
      lineage can lead to tumours of that lineage, from ganglioneuroma to
      neuroblastoma, in a minority of patients, with the highest risk in
      carriers of non-polyalanine repeat mutations. The steps between the
      developmental lesion and tumour formation are not curated here.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        We have subsequently shown that heterozygous mutations of PHOX2B may
        account for several combined or isolated disorders of autonomic
        nervous-system development--namely, tumors of the sympathetic nervous
        system (TSNS), such as neuroblastoma and late-onset central
        hypoventilation syndrome.
      explanation: >-
        A background sentence in the abstract, restating the authors' earlier
        human genetic finding ('We have subsequently shown that'). It says
        heterozygous PHOX2B mutation may account for tumours of the sympathetic
        nervous system, such as neuroblastoma, and counts them among disorders
        of autonomic nervous-system development, which places these tumours
        within the PHOX2B-dependent autonomic and neural crest development
        curated at this node. The sentence names the mutation rather than this
        node, so the edge is an inference, and the source hedges it ('may
        account for'). It does not distinguish genotypes; the same abstract
        reports analysis supporting the contention that CCHS patients who
        develop malignant tumours of this kind carry missense or frameshift
        mutations.
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        We propose that such tumor predisposition may be a direct consequence of
        the PHOX2B germline heterozygous mutation.
      explanation: >-
        The authors' own proposal in the Discussion. 'Such tumor predisposition'
        is the high, often multifocal predisposition to tumours of the
        sympathetic nervous system in CCHS described in the preceding sentences,
        which put its incidence about 500-fold above that of the general
        population, citing earlier work. The authors propose that it may be a
        direct consequence of the germline heterozygous PHOX2B mutation and
        support this in the next sentence with PHOX2B mutations reported in
        familial and sporadic neuroblastoma without CCHS, not with this cohort's
        data. The proposal is hedged and names the mutation rather than the
        autonomic and neural crest arm, so linking it to this node is an
        inference. The sentences that follow qualify it by genotype: frameshift
        and missense mutations, as opposed to polyalanine expansions, may
        predispose to neuroblastoma. That split comes from this cohort's few
        tumours; the phenotype records the later exceptions to it.

- name: Ventilator Dependence and Neurocognitive Risk
  description: >-
    The clinical endpoint. There is no therapy for the chemoreceptive lesion, so
    management is lifelong mechanical support of ventilation during sleep -
    positive-pressure ventilation via tracheostomy or mask, or bilateral phrenic
    nerve pacing for daytime support in those who also hypoventilate awake. The
    principal modifiable outcome is neurocognitive, and it depends on the
    adequacy of ventilation across all states and activities, which is why
    guideline management centres on repeated physiological assessment during
    every sleep stage and activity level rather than on a single titration.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recommended management options aimed toward maximizing safety and
      optimizing neurocognitive outcome
    explanation: >-
      States the two objectives of management, and specifically that
      neurocognitive outcome - not survival alone - is the target, which is what
      this node records.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      physiologic studies during awake and asleep states to assess ventilatory
      needs during varying levels of activity and concentration, in all stages of
      sleep, with spontaneous breathing, and with artificial ventilation
    explanation: >-
      Specifies the state- and activity-dependent assessment the guideline
      requires, which is the operational consequence of the disorder's state
      dependence.
environmental:
- name: Sedative, anaesthetic and other respiratory-depressant medications
  description: >-
    Prescription and non-prescription sedatives and anaesthetics, and
    recreational drugs, depress ventilation in a patient who has no chemoreflex
    with which to compensate. In an unaffected person a respiratory depressant is
    opposed by rising carbon dioxide driving increased ventilation; here that
    correction does not exist, so the depression is uncorrected and additive to
    an already inadequate baseline. This is the reason anaesthesia in this
    disorder is a planned event with ventilatory support arranged in advance
    rather than a routine one. Curated separately from the asphyxial
    circumstances below because the mechanism differs: this arm depresses
    respiratory drive, that one removes the opportunity for gas exchange.
  exposure_term:
    preferred_term: exposure to sedative
    term:
      id: ECTO:9001748
      label: exposure to sedative
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      alcohol (respiratory depression), recreational drugs (varied effects
      including death), and prescription as well as non-prescription
      medications/sedatives/anesthetics that could induce respiratory depression
    explanation: >-
      Names the agents and the mechanism (respiratory depression) by which they
      act, which is what distinguishes this arm from the asphyxial one.
  influences_mechanisms:
  - target: Sleep-Dependent Alveolar Hypoventilation
    environmental_effect: EXACERBATES
    description: >-
      Pharmacological depression of respiratory drive adds to a deficit the
      patient cannot correct, because the chemoreflex that would normally oppose
      it is absent.
    evidence:
    - reference: PMID:20301600
      reference_title: Congenital Central Hypoventilation Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        medications/sedatives/anesthetics that could induce respiratory depression
      explanation: >-
        States the respiratory-depressant mechanism by which this exposure acts
        on the hypoventilation node.
- name: Ethanol Exposure
  description: >-
    Called out separately in the GeneReviews avoid-list, and curated as its own
    exposure so the bound term matches what is claimed. Alcohol depresses
    respiration by the same route as the sedatives above, but it differs in
    exposure context: it is socially normal, self-administered, and typically
    taken without the medical supervision that surrounds an anaesthetic - which
    makes it the more likely of the two to be encountered unplanned by an
    adolescent or adult patient.
  notes: >-
    Named and bound for the chemical (ECTO:9000027, which involves CHEBI ethanol)
    rather than the drinking behaviour (ECTO:0001082) because the mechanism curated
    here is respiratory depression by ethanol acting on a brainstem with no
    chemoreflex to oppose it. Renamed from "Alcohol" so the binding is derivable
    from the entry's own name, following Esophageal_Carcinoma,
    HPV_Negative_Head_and_Neck_Cancer and Oral_Cavity_Squamous_Cell_Carcinoma.
    `just environmental-term-audit` suggests the behaviour term, because it matches
    on curator-written names rather than on the curated mechanism; that suggestion
    is advisory and is declined here for the same reason it was in those entries.
  exposure_term:
    preferred_term: exposure to ethanol
    term:
      id: ECTO:9000027
      label: exposure to ethanol
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      alcohol (respiratory depression), recreational drugs (varied effects
      including death)
    explanation: >-
      Names alcohol and its mechanism (respiratory depression) in the source's
      own avoid-list. The quote runs on into recreational drugs because that is
      where the source's sentence ends; those are curated on the sedative entry
      above, not here.
  influences_mechanisms:
  - target: Sleep-Dependent Alveolar Hypoventilation
    environmental_effect: EXACERBATES
    description: >-
      Alcohol depresses respiratory drive in a patient with no chemoreflex to
      oppose it, so the depression is uncorrected.
    evidence:
    - reference: PMID:20301600
      reference_title: Congenital Central Hypoventilation Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        alcohol (respiratory depression), recreational drugs (varied effects
        including death)
      explanation: >-
        The source attributes respiratory depression to alcohol directly, which
        is the mechanism this link asserts.
- name: Asphyxial circumstances (swimming, breath-holding contests)
  description: >-
    Swimming and breath-holding contests carry a risk of asphyxia and death, and
    the reason is specific to this disorder rather than general water safety:
    voluntary or immersion-imposed apnoea normally terminates when rising carbon
    dioxide produces an overwhelming urge to breathe. That urge is a chemoreflex
    percept, and these patients do not have it - so the protective endpoint that
    stops everyone else is missing, and breath-holding can continue to
    unconsciousness. Curated as its own exposure because it removes gas-exchange
    opportunity rather than depressing drive.
  evidence:
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Swimming and breath-holding contests (risk
      of asphyxia, death)
    explanation: >-
      Names the circumstances and the stated consequence; the mechanistic reading
      in the description follows from the absent chemoreflex curated upstream.
  notes: >-
    No ECTO binding: the ontology has no term for voluntary breath-holding or for
    immersion-related asphyxial risk. ECTO was searched; left unbound rather than
    bound to an inaccurate near-match, per the no-term-beats-a-bad-one rule.
  influences_mechanisms:
  - target: Sleep-Dependent Alveolar Hypoventilation
    environmental_effect: EXACERBATES
    description: >-
      Voluntary or immersion-imposed apnoea removes gas exchange in a patient
      with no chemoreflex-driven urge to breathe to terminate it.
    evidence:
    - reference: PMID:20301600
      reference_title: Congenital Central Hypoventilation Syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Swimming and breath-holding contests (risk of asphyxia, death)
      explanation: >-
        Establishes the exposure and its consequence in the source's own terms.
phenotypes:
- category: Respiratory
  name: Central Hypoventilation
  description: >-
    Inadequate alveolar ventilation from absent central respiratory drive rather
    than from any mechanical or pulmonary limitation, with hypercapnia and
    hypoxaemia and characteristically without dyspnoea.
  phenotype_term:
    preferred_term: Central hypoventilation
    term:
      id: HP:0007110
      label: Central hypoventilation
  frequency: OBLIGATE
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS) is characterized by
      alveolar hypoventilation and autonomic dysregulation.
    explanation: >-
      OBLIGATE by definition: alveolar hypoventilation is the defining feature of
      the syndrome.
- category: Respiratory
  name: Nocturnal Hypoventilation
  description: >-
    Hypoventilation that is present or markedly worse during sleep, reflecting
    withdrawal of the wakefulness drive to breathe and leaving the absent
    chemoreflex in sole control.
  phenotype_term:
    preferred_term: Nocturnal hypoventilation
    term:
      id: HP:0002877
      label: Nocturnal hypoventilation
    temporality: NOCTURNAL
  frequency: OBLIGATE
  evidence:
  - reference: PMID:23692929
    reference_title: Congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital central hypoventilation syndrome (CCHS) is characterized by
      hypoventilation during sleep and impaired ventilatory responses to
      hypercapnia and hypoxemia.
    explanation: >-
      OBLIGATE by definition: sleep-related hypoventilation is a defining
      criterion of the disorder.
- category: Gastrointestinal
  name: Hirschsprung Disease
  description: >-
    Aganglionic megacolon from failed enteric neural crest colonisation,
    occurring in a minority (the CCHS-Hirschsprung combination is also called
    Haddad syndrome) and more common with non-polyalanine repeat mutations.
  phenotype_term:
    preferred_term: Aganglionic megacolon
    term:
      id: HP:0002251
      label: Aganglionic megacolon
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This core phenotype is associated with lower-penetrance anomalies of the
      autonomic nervous system (ANS) including Hirschsprung disease
    explanation: >-
      The source describes these as lower-penetrance anomalies relative to the
      obligate respiratory core, which maps to the OCCASIONAL band; no exact
      percentage is quoted, so a tighter band is not asserted.
- category: Oncological
  name: Neuroblastic Tumour
  description: >-
    Tumours of sympathoadrenal neural crest derivatives (ganglioneuroma,
    ganglioneuroblastoma and neuroblastoma) occurring in a minority of patients:
    in 10 of 188 probands (5.3%) in one genotyped series, and in an estimated
    3-5% of patients according to the 2020 European guideline. The risk depends
    strongly on PHOX2B genotype. The 2017 AACR predisposition summary gives
    about 45% for non-polyalanine repeat mutations (missense, nonsense or
    frameshift) and about 1-2% for polyalanine repeat expansions; both are
    stated as risks of any neural crest (neuroblastic) tumour, not as
    neuroblastoma risks, and in the series that summary cites essentially all
    expansion carriers with a tumour had large expansions. In a
    genotype-phenotype analysis of 188 probands, the mutation carriers who
    developed malignant tumours of the sympathetic nervous system carried
    missense or frameshift mutations rather than polyalanine expansions. Later
    sources qualify that split: a high-risk neuroblastoma has since been
    reported in a child carrying a 20/33 polyalanine expansion, and the 2020
    European guideline lists neuroblastomas among the tumours at high
    prevalence in carriers of longer expansions as well as of non-polyalanine
    repeat mutations. In a separate series of 13 non-polyalanine repeat
    mutation carriers selected for having a tumour, only six of whom also had
    CCHS and/or Hirschsprung disease, nine of the 13 tumours were
    differentiated, but four were poorly differentiated and four patients had
    stage 3 or 4 disease. Because the risk follows genotype, tumour screening is
    directed by genotype rather than applied to every patient.
  phenotype_term:
    preferred_term: Neuroblastic tumor
    term:
      id: HP:0004376
      label: Neuroblastic tumor
  frequency: OCCASIONAL
  notes: >-
    OCCASIONAL is a borderline call at the lower edge of the band. It rests
    on whole-cohort figures, which average over a sharp genotype split and so
    move with the share of non-polyalanine repeat mutation carriers in a
    series and with which tumours are counted: 10 of 188 probands (5.3%) in
    the series cited in the pooled context below, and 3-5% in the
    2020 European guideline, a range whose lower part falls in VERY_RARE. The
    genotype-specific bands are in the two PHOX2B contexts: FREQUENT for
    non-polyalanine repeat mutations (about 45%) and VERY_RARE for
    polyalanine repeat expansions (about 1-2%).
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tumors of neural-crest derivatives such as ganglioneuromas and
      neuroblastomas
    explanation: >-
      Named among the lower-penetrance associated anomalies, supporting the
      OCCASIONAL band on the same basis as Hirschsprung disease.
  - reference: PMID:20301600
    reference_title: Congenital Central Hypoventilation Syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Some children have altered development of neural crest-derived structures
      (i.e., Hirschsprung disease, altered esophageal motility/dysphagia, and
      severe constipation even in the absence of Hirschsprung disease) and/or
      tumors of neural crest origin (neuroblastoma, ganglioneuroma, and
      ganglioneuroblastoma).
    explanation: >-
      The GeneReviews chapter's summary of clinical characteristics names
      tumours of neural crest origin among the features seen in some children
      with CCHS and lists them as neuroblastoma, ganglioneuroma and
      ganglioneuroblastoma, the three tumour types that HPO's definition of
      Neuroblastic tumor (HP:0004376) groups together. Counting ganglioneuroma
      and ganglioneuroblastoma under this phenotype therefore rests on a
      clinical source as well as on the HPO definition. 'Some children' places
      the phenotype in a minority of patients but gives no frequency, so the
      band is set by the cohort figures in the contexts below.
  - reference: PMID:15657873
    reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      analysis of genotype-phenotype interactions strongly supports the
      contention that patients with CCHS who develop malignant TSNS will harbor
      either a missense or a frameshift heterozygous mutation of the PHOX2B
      gene.
    explanation: >-
      In a cohort of 188 CCHS probands, the authors state that their
      genotype-phenotype analysis strongly supports the contention that patients
      with CCHS who develop malignant tumours of the sympathetic nervous system
      (TSNS) carry a heterozygous missense or frameshift PHOX2B mutation, that
      is, a mutation other than a polyalanine repeat expansion. This is a hedged
      conclusion resting on few events, and it describes mutation carriers: the
      same cohort included two patients with CCHS and a tumour in whom no PHOX2B
      mutation was detected. It concerns malignant tumours only, does not say
      that differentiated tumours such as ganglioneuroma are confined to these
      genotypes, and gives no risk estimate. The contention has a published
      exception, quoted in the next item.
  - reference: PMID:26011159
    reference_title: "Treatment of neuroblastoma in congenital central hypoventilation syndrome with a PHOX2B polyalanine repeat expansion mutation: New twist on a neurocristopathy syndrome."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      To the best of our knowledge, we report the first case of a child with
      CCHS and Hirschsprung disease who had a PHOX2B polyalanine-repeat-expansion
      mutation (PARM) (genotype 20/33) and developed high-risk neuroblastoma.
    explanation: >-
      A single case report: a child with CCHS and Hirschsprung disease who
      carried a 20/33 PHOX2B polyalanine repeat expansion, at the upper end of
      the expansion range, and developed high-risk neuroblastoma. The abstract
      presents it as the first such case, neuroblastoma in CCHS having until
      then been associated only with non-polyalanine repeat mutations, so it is
      the published exception to the 2005 contention quoted above that
      malignant tumours in CCHS arise in missense or frameshift carriers. One
      case gives no frequency: it shows which genotypes can develop a malignant
      tumour and does not bear on either genotype's band.
  - reference: PMID:26375764
    reference_title: Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine Repeat Expansion Mutations.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Thirteen patients were identified, six of whom also had CCHS and/or HSCR,
      one also had late-onset hypoventilation with hypothalamic dysfunction
      (LO-CHS/HD), and six had no other neurocristopathy. Four tumours were
      "poorly differentiated," and nine were differentiated, including five
      ganglioneuromas, three ganglioneuroblastomas, and one differentiating
      neuroblastoma, hence illustrating that PHOX2B NPARM are predominantly
      associated with differentiating tumors.
    explanation: >-
      Per the abstract's Methods, the series comprised patients with both a
      peripheral neuroblastic tumour and a PHOX2B non-polyalanine repeat
      mutation (NPARM). The first quoted sentence gives its make-up: 13
      patients, of whom six also had CCHS and/or Hirschsprung disease, one
      had late-onset hypoventilation with hypothalamic dysfunction and six
      had no other neurocristopathy. The second gives the histology: nine
      tumours were differentiated (five ganglioneuromas, three
      ganglioneuroblastomas, one differentiating neuroblastoma) and four
      poorly differentiated, so in this series the tumours ranged from poorly
      differentiated tumours to ganglioneuroma and were mostly
      differentiated. Indirect for CCHS: the series was restricted to
      patients with both a tumour and an NPARM, and at most six of the 13 had
      CCHS, so this is the tumour spectrum of tumour-bearing NPARM carriers,
      not of CCHS patients. For the same reason it is not directly comparable
      with the CCHS cohort in which 6 of 13 NPARM carriers were diagnosed
      with a tumour (PMID:15657873); that study counted which CCHS patients
      developed a tumour, while this one classified the tumours of patients
      selected because they had one.
  - reference: PMID:26375764
    reference_title: Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine Repeat Expansion Mutations.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Nevertheless, three patients had stage 4 and one patient had stage 3
      disease.
    explanation: >-
      The sentence follows the histology quoted in the item above and qualifies
      it: in the same series of 13 patients with a peripheral neuroblastic
      tumour and a PHOX2B non-polyalanine repeat mutation, four had advanced
      disease, three at stage 4 and one at stage 3, and the abstract also
      reports one death from tumour progression. The predominance of
      differentiated tumours in this series therefore does not make the
      tumours of non-polyalanine repeat mutation carriers uniformly benign.
      Indirect for CCHS for the reason given on the item above: the series was
      selected for having a tumour, and at most six of the 13 had CCHS.
  - reference: PMID:32958024
    reference_title: Guidelines for diagnosis and management of congenital central hypoventilation syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      These tumours may occur in 3-5% of patients with CCHS. Neuroblastomas,
      ganglioblastomas, and ganglioneuromas are at high prevalence in PARMs with
      longer expansions and in non-PARMs
    explanation: >-
      The 2020 European CCHS guideline gives both halves of the claim in
      consecutive sentences. 'These tumours' are the neural crest tumours
      that the second sentence names; 'ganglioblastomas' is quoted as printed
      and, in this list of the three neuroblastic tumour types, stands for
      ganglioneuroblastomas.
      PARMs are polyalanine repeat mutations and non-PARMs (NPARMs) the
      other PHOX2B mutations. The 3-5% figure is hedged ('may occur'),
      carries no citation and straddles the VERY_RARE (<5%) and OCCASIONAL
      (5-29%) bands, so on its own it does not settle this phenotype's
      band. The genotype sentence cites a single series of tumour-bearing
      NPARM carriers (Heide et al. 2016, PMID:26375764, also cited on this
      phenotype), so the longer-expansion half rests on the guideline's own
      synthesis and the two items are not independent.
  phenotype_contexts:
  - frequency: OCCASIONAL
    notes: >-
      Pooled across PHOX2B genotypes: tumours of the sympathetic nervous system
      were observed in 10 (5.3%) of 188 CCHS probands included on clinical
      criteria, a cohort that includes 14 probands with no PHOX2B mutation
      found. That is inside the OCCASIONAL band (5-29%), at its lower edge. It
      is a whole-cohort figure, not the risk for any one genotype.
    evidence:
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: >-
        HSCR and tumors of the sympathetic nervous system (TSNS) were observed
        in 45 (24%) and 10 (5.3%) of the cases, respectively.
      explanation: >-
        Trochet et al. report the clinical findings of their series of 188 CCHS
        probands: tumours of the sympathetic nervous system were observed in 10
        (5.3%) of the cases. This is the whole-cohort figure, pooled across
        PHOX2B genotypes, and 5.3% lies inside the OCCASIONAL band (5-29%), at
        its lower edge. The percentages are taken over all 188 probands,
        although full clinical data were available for 178; either denominator
        keeps the figure inside OCCASIONAL. The call is marginal: the cohort was
        included on clinical criteria and contains 14 probands with no PHOX2B
        mutation found, two of whom had tumours, and among the 174 with an
        identified mutation the paper's genotype counts (6 of 13 missense or
        frameshift carriers, 2 of 161 expansion carriers) give 8 tumours, just
        under 5%. The Hirschsprung figure in the same sentence (45 cases, 24%)
        is not used here.
    - reference: PMID:15657873
      reference_title: PHOX2B genotype allows for prediction of tumor risk in congenital central hypoventilation syndrome.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        Cases of TSNS had various degrees of differentiation and were classified
        as neuroblastoma (MIM 256700), ganglioneuroblastoma, or ganglioneuroma
        in seven, one, and two cases, respectively; these were either isolated
        or multifocal (table 1).
      explanation: >-
        The paper classifies the ten tumours of the sympathetic nervous system
        in this cohort as seven neuroblastomas, one ganglioneuroblastoma and two
        ganglioneuromas, of various degrees of differentiation, isolated or
        multifocal. HPO's definition of Neuroblastic tumor (HP:0004376) names
        neuroblastomas, ganglioneuromas and ganglioneuroblastomas together, so
        all ten count towards the phenotype bound here, although HPO's hierarchy
        places Ganglioneuroma (HP:0003005) under Neoplasm of the autonomic
        nervous system rather than under this term. The band depends on counting
        the two ganglioneuromas: the eight neuroblastomas and
        ganglioneuroblastomas alone would fall below 5%. The sentence gives
        counts but no denominator, so it supports the OCCASIONAL band only
        together with the 10 (5.3%) sentence.
  - genetic_context:
      gene:
        preferred_term: PHOX2B
        term:
          id: hgnc:9143
          label: PHOX2B
      allele_type: non-polyalanine repeat mutation (NPARM)
      description: >-
        Heterozygous PHOX2B missense, nonsense or frameshift mutation, outside
        the polyalanine repeat expansion class; the minority genotype in CCHS.
    frequency: FREQUENT
    notes: >-
      About 45% risk of a neural crest (neuroblastic) tumour in the 2017 AACR
      predisposition summary, stated for any neural crest tumour rather than for
      neuroblastoma specifically. Primary series are small: in one 188-proband
      series, 6 of the 13 missense or frameshift carriers were diagnosed with a

genetic:
- name: PHOX2B
  notes: >-
    Paired-like homeobox transcription factor and master regulator of visceral
    reflex circuits. Heterozygous de novo mutation causes essentially all
    congenital central hypoventilation syndrome. Most mutations are expansions of
    5-9 alanines within a 20-residue polyalanine tract; expansion length
    correlates with severity closely enough to guide clinical anticipation.
    Non-polyalanine repeat mutations (frameshift, missense) produce more severe
    disease with greater neural-crest tumour risk. Parents should be tested,
    since mosaicism and mildly affected carriers occur.
  gene_term:
    preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data support an essential role of PHOX2B in the normal patterning of
      the autonomous ventilation system and, more generally, of the ANS in humans.
    explanation: >-
      States the gene's causal role in both the respiratory and the wider
      autonomic arms of the phenotype.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Parents of patients with CCHS should be tested for PHOX2B mutations.
    explanation: >-
      Supports the parental testing recommendation noted here, which follows
      from mosaicism and mild carrier states.
inheritance:
- name: Autosomal dominant, usually de novo
  description: >-
    Heterozygous mutation, dominant in effect, arising de novo in most cases.
    Transmission from a mildly affected or mosaic parent occurs, which is why
    parental testing is recommended before counselling recurrence risk as
    negligible.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:12640453
    reference_title: Polyalanine expansion and frameshift mutations of the paired-like homeobox gene PHOX2B in congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found heterozygous de novo mutations in PHOX2B in 18 of 29 individuals
      with CCHS.
    explanation: >-
      Establishes the heterozygous, de novo pattern in the majority of cases.
  - reference: PMID:23692929
    reference_title: Congenital central hypoventilation syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases are sporadic and caused by de novo PHOX2B gene mutations, which
      are usually polyalanine repeat expansions.
    explanation: >-
      Independently confirms the sporadic, de novo pattern and the dominant
      mutation class.
diagnosis:
- name: PHOX2B mutation testing
  description: >-
    The confirmatory diagnostic test, and required for the diagnosis. Testing
    should include both the polyalanine repeat screen and sequencing for
    non-polyalanine mutations, since the latter carry different severity and
    tumour risk. Genotype also directs subsequent surveillance intensity.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A PHOX2B mutation is required to confirm the diagnosis of CCHS.
    explanation: >-
      States the diagnostic requirement directly.
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Maintaining a high index of suspicion in cases of unexplained alveolar
      hypoventilation will likely identify a higher incidence of milder cases of
      CCHS.
    explanation: >-
      Records that the phenotypic boundary is testing-dependent and expanding,
      which is why historical severity and prevalence figures describe the severe
      end of the spectrum.
- name: State- and activity-resolved physiological assessment
  description: >-
    Comprehensive in-hospital evaluation of ventilatory needs and responsiveness
    across wakefulness and all sleep stages, at varying activity and
    concentration levels, both spontaneously breathing and ventilated. Repeated
    biannually then annually. This is not a one-off titration: because the
    deficit is state-dependent, adequacy of support in one state says nothing
    about another.
  evidence:
  - reference: PMID:20208042
    reference_title: "An official ATS clinical policy statement: Congenital central hypoventilation syndrome: genetic basis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      biannual then annual in-hospital comprehensive evaluation
    explanation: >-
      Establishes the recommended assessment cadence, which underlies the
      repeated-evaluation point this diagnostic entry makes.
treatments:
- name: Lifelong Assisted Ventilation During Sleep
  description: >-
    The mainstay, and it is supportive rather than corrective: nothing addresses
    the chemoreceptive lesion, so ventilation is substituted for the absent
    automatic drive for life. Delivered by positive-pressure ventilation through
    tracheostomy (the standard in infancy and in severe disease) or by mask in
    older and milder patients. It acts on the hypoventilation node, downstream of
    the chemoreflex failure, which is why it restores gas exchange without
    restoring the sensation of air hunger or the ability to self-correct.

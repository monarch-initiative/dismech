discussions:
- discussion_id: gap_rtn_selective_vulnerability
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why are retrotrapezoid nucleus neurons uniquely vulnerable to mutant PHOX2B
    when the protein is required throughout the visceral reflex circuitry?
  attaches_to:
  - pathophysiology#Failed Development of Retrotrapezoid Nucleus Chemoreceptor Neurons
  rationale: >-
    This is the disorder's central unexplained fact and is stated as such in the
    primary literature. PHOX2B is expressed across the central and peripheral
    autonomic nervous system, yet in the mouse model carrying the commonest human
    mutation the retrotrapezoid nucleus is severely depleted and no other
    neuronal loss is detectable. Any account of the disorder that does not
    explain the selectivity is incomplete, and the question is not academic: the
    mutant protein is thought to act through polyalanine aggregation, and whether
    a therapy could rescue the vulnerable population depends on whether its
    vulnerability reflects a cell-intrinsic dependence on PHOX2B dosage, a
    developmental timing window, or a difference in aggregate handling.
  proposed_experiments:
  - experiment_id: exp_rtn_vulnerability_single_cell
    name: Comparative single-cell profiling of vulnerable and spared PHOX2B lineages
    description: >-
      Single-cell transcriptomic and proteomic comparison of retrotrapezoid
      nucleus neurons against spared PHOX2B-dependent populations in
      Phox2b(27Ala/+) and wild-type mice across the developmental window,
      quantifying PHOX2B target-gene dosage dependence and mutant-protein
      aggregate burden per lineage.
- discussion_id: gap_no_therapy_for_chemoreflex
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can central chemoreception be restored pharmacologically, rather than only
    substituted for mechanically?
  attaches_to:
  - pathophysiology#Loss of Central Chemoreflex Response to Hypercapnia and Hypoxaemia
  rationale: >-
    Every treatment curated in this entry acts downstream of the lesion, on
    ventilation rather than on chemoreception, and none is disease-modifying.
    Two lines have been proposed and neither is settled: desogestrel, a
    progestin observed to increase the ventilatory response in isolated cases and
    taken into clinical evaluation, and pharmacological approaches directed at
    the toxic effects of polyalanine-expanded PHOX2B aggregates. Both are
    curated here as open rather than as treatments, because the entry should not
    present investigational agents as options; the reason to record the gap is
    that a partial chemoreflex response would change the disorder's management
    fundamentally, and the conditional mouse model shows partial responses can
    develop.
  proposed_experiments:
  - experiment_id: exp_desogestrel_controlled_ventilatory_response
    name: Controlled assessment of progestin effect on the ventilatory response
    description: >-
      Blinded, placebo-controlled crossover assessment of the hypercapnic
      ventilatory response in adults with congenital central hypoventilation
      syndrome under desogestrel, with genotype stratification, since the
      published observations are uncontrolled and inconsistent across patients.

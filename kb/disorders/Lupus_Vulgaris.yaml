    - reference: PMID:41598640
      reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "Chronic LV lesions create a milieu of persistent inflammation, tissue damage, and scarring that can predispose to neoplastic transformation."
      explanation: >-
        A review's mechanistic hypothesis linking chronic inflammation and
        scarring to carcinoma; the authors call these pathways

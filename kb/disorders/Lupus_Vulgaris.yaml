  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The plaque grows peripherally, with serpiginous or verrucous borders, often reaching over 10cm in diameter with central discoloration and atrophy."
    explanation: Describes peripheral extension with central atrophy.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated, LV lesions persist for years, gradually growing in size up to tens of centimeters and leading to significant aesthetic alterations, with ulcerations and tissue destruction."
    explanation: Describes chronic growth, ulceration and tissue destruction.
- name: Chronic Inflammation-Associated Squamous Carcinogenesis
  role: consequence
  biological_scale: TISSUE
  description: >-
    Squamous cell carcinoma, and less often basal cell carcinoma, arises in
    long-standing lupus vulgaris, usually after decades of untreated disease
    and often on the head and neck. Proposed contributors are oxidative DNA
    damage in keratinocytes from prolonged granulomatous inflammation, chronic
    scarring analogous to Marjolin ulcer, and ultraviolet exposure; these
    mechanisms are hypotheses drawn from case series and general tumour
    biology.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  downstream:
  - target: Squamous cell carcinoma of the skin
    causal_link_type: DIRECT
    description: Malignant transformation produces squamous cell carcinoma.
  - target: Basal cell carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Basal cell carcinoma is reported less often.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incidence of malignant transformation into squamous cell carcinoma in LV plates ranged from 0.5 to 10.5% and it usually occurs after 25-30 years of untreated disease."
    explanation: Rate and latency of malignant transformation.
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "Prolonged granulomatous inflammation generates reactive oxygen species and other free radicals that can induce DNA damage in adjacent epithelial cells."
    explanation: Proposed oxidative DNA-damage mechanism, stated by the review as a hypothesis.
phenotypes:
- name: Apple-jelly papules and nodules
  category: Clinical
  description: >-
    Soft reddish-brown papules and nodules (lupomas) that show an apple-jelly
    yellow-brown colour when blanched by diascopy.
  phenotype_term:
    preferred_term: Skin nodule
    term:
      id: HP:0200036
      label: Skin nodule
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Besides, the classic appearance is described as “apple jelly nodules” observed on diascopy"
    explanation: Describes the characteristic apple-jelly nodules.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Diascopy of non-keratotic areas reveals an \"apple jelly\" aspect."
    explanation: The apple-jelly sign on diascopy.
- name: Skin plaque
  category: Clinical
  description: >-
    Well-demarcated reddish-brown plaques, the most common presentation, often on
    the face and neck and, in tropical series, on the limbs and buttocks.
  phenotype_term:
    preferred_term: Skin plaque
    term:
      id: HP:0200035
      label: Skin plaque
  evidence:
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All but one patient had plaque-type lesions."
    explanation: Plaque-type lesions in 18 of 19 patients.
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Clinically, it presents as slowly enlarging, erythematous to brownish-red plaques with central atrophy, most often localized to the head and neck region."
    explanation: Describes the plaques and their usual head-and-neck location.
- name: Hyperkeratosis
  category: Clinical
  description: Hyperkeratotic or verrucous surface in hypertrophic and verrucous variants.
  phenotype_term:
    preferred_term: Hyperkeratosis
    term:
      id: HP:0000962
      label: Hyperkeratosis
  evidence:
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histopathologically, LV is defined by well-formed tuberculoid granulomas, with or without caseation necrosis, accompanied by a variable degree of epidermal hyperkeratosis or atrophy"
    explanation: Epidermal hyperkeratosis is a variable accompaniment.
  - reference: PMID:36304654
    reference_title: A Rare Case of Multidrug-Resistant Lupus Vulgaris with a Mixed Pattern of Resistance - A Long Journey to Diagnosis and Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "An 18-year-old male presented with a single round to oval well-defined irregular erythematous plaque 10 cm × 6 cm, with a verrucous surface, central atrophy, and crusting at the periphery on the right knee of one-year duration."
    explanation: A verrucous lupus vulgaris plaque with central atrophy.
- name: Atrophic scars
  category: Clinical
  description: Central atrophy and scarring of plaques, and the scar left after treatment.
  phenotype_term:
    preferred_term: Atrophic scars
    term:
      id: HP:0001075
      label: Atrophic scars
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The plaques grow peripherally, with serpiginous or verrucous borders, accompanied by central discoloration and atrophy"
    explanation: Central atrophy of the extending plaques.
  - reference: PMID:36304654
    reference_title: A Rare Case of Multidrug-Resistant Lupus Vulgaris with a Mixed Pattern of Resistance - A Long Journey to Diagnosis and Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patient had almost complete resolution of the lesion at four months, leaving a depigmented atrophic scar"
    explanation: A treated lesion healed with an atrophic scar.
- name: Skin ulcer
  category: Clinical
  description: Ulceration and tissue destruction in long-standing or ulcerative lesions; uncommon in plaque disease.
  phenotype_term:
    preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated, LV lesions persist for years, gradually growing in size up to tens of centimeters and leading to significant aesthetic alterations, with ulcerations and tissue destruction."
    explanation: Untreated lesions ulcerate and destroy tissue.
  - reference: PMID:22084942
    reference_title: Ulcerated lupus vulgaris at the site of Bacille Calmette-Guérin vaccination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a case of ulcerated lupus vulgaris occurring in 1.5-year-old boy at the Bacille Calmette-Guérin vaccination site within 6 months, which was diagnosed using histology and polymerase chain reaction."
    explanation: An ulcerated lupus vulgaris lesion.
- name: Squamous cell carcinoma of the skin
  category: Clinical
  description: >-
    Squamous cell carcinoma arising in a long-standing lupus vulgaris lesion,
    the principal malignant complication.
  phenotype_term:
    preferred_term: Squamous cell carcinoma of the skin
    term:
      id: HP:0006739
      label: Squamous cell carcinoma of the skin
  evidence:
  - reference: PMID:31149488
    reference_title: "Squamous cell carcinoma arising from lupus vulgaris with a >60-year history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report the case of a 71-year-old Japanese man with squamous cell carcinoma arising from lupus vulgaris on the face, >60 years after the appearance of the lupus vulgaris."
    explanation: Squamous cell carcinoma arising in lupus vulgaris after six decades.
  - reference: PMID:26794085
    reference_title: Twenty-nine cases of lupus vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "LV progressed to squamous cell carcinoma in one patient."
    explanation: Malignant transformation in 1 of 29 patients.
  - reference: PMID:31149488
    reference_title: "Squamous cell carcinoma arising from lupus vulgaris with a >60-year history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Malignant tumors are known to occur in individuals with lupus vulgaris, with a reported rate of 0.5-10.5%."
    explanation: The reported rate of malignancy in lupus vulgaris.
- name: Basal cell carcinoma
  category: Clinical
  description: Basal cell carcinoma is reported less often than squamous cell carcinoma in lupus vulgaris lesions.
  phenotype_term:
    preferred_term: Basal cell carcinoma
    term:
      id: HP:0002671
      label: Basal cell carcinoma
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The development of other malignancies, such as basal cell carcinoma has also been reported."
    explanation: Basal cell carcinoma as a reported malignancy in lupus vulgaris.
histopathology:
- name: Non-caseating tuberculoid granulomas
  description: >-
    Well-formed tuberculoid granulomas of epithelioid histiocytes with Langhans
    giant cells and a lymphocytic rim in the upper and mid dermis, usually
    without caseation; acid-fast bacilli are rarely demonstrated.
  diagnostic: true
  evidence:
  - reference: PMID:26794085
    reference_title: Twenty-nine cases of lupus vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The results of skin biopsies indicated tuberculoid granulomas without caseous necrosis."
    explanation: Non-caseating tuberculoid granulomas in a 29-patient series.
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "On histopathology, all showed a tuberculoid granuloma with no demonstration of acid-fast bacilli with Ziehl-Neelsen staining."
    explanation: Tuberculoid granulomas without acid-fast bacilli in all 19 cases.
- name: Epidermal hyperplasia or atrophy
  description: >-
    The overlying epidermis is atrophic or hypertrophic, with acanthosis,
    papillomatosis or pseudoepitheliomatous hyperplasia.
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "epidermis may be atrophic or hypertrophic, featuring acanthosis, papillomatosis and even pseudo-epitheliomatous hyperplasia."
    explanation: Describes the epidermal changes over lupus vulgaris granulomas.
diagnosis:
- name: Skin biopsy with histopathology
  description: >-
    Biopsy showing tuberculoid granulomas is the mainstay of diagnosis; acid-fast
    staining is usually negative.
  diagnosis_term:
    preferred_term: skin biopsy
    term:
      id: NCIT:C51692
      label: Skin Biopsy
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histopathology will show epithelioid granulomas in the superficial dermis and acid-fast bacilli rarely demonstrable within the granulomas."
    explanation: States the histopathological basis of diagnosis.
- name: Tuberculin skin test
  description: The tuberculin skin test is typically strongly positive, reflecting the sensitized host.
  diagnosis_term:
    preferred_term: tuberculin skin test
    term:
      id: NCIT:C85994
      label: Tuberculin Skin Test
  presence: Positive
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Tuberculin test is strongly positive."
    explanation: A strongly positive tuberculin test in lupus vulgaris.
  - reference: PMID:19094126
    reference_title: "Lupus vulgaris at the site of BCG vaccination: report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All three cases had a single BCG vaccination, with a LV lesion at or in the vicinity of the vaccination site, a strong positive Mantoux test, noncaseating granuloma histologically, and two of the patients had a positive PCR result for mycobacterial complex."
    explanation: Strongly positive Mantoux tests, non-caseating granulomas and PCR positivity in BCG-site lupus vulgaris.
- name: Mycobacterial culture and PCR of lesional tissue
  description: >-
    Culture is the reference standard but often negative in this paucibacillary
    form; PCR on lesional tissue detects M. tuberculosis DNA.
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Culture is the gold standard for diagnosis, but its positivity rate is low."
    explanation: Low culture yield in lupus vulgaris.
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mycobacterium tuberculosis bacilli can be detected using polymerase chain reaction from the lesions."
    explanation: PCR as a diagnostic adjunct.
- name: Diascopy and dermoscopy
  description: >-
    Diascopy shows the apple-jelly colour; dermoscopy shows focused linear
    vessels on a yellow-orange background. Neither is specific, since sarcoidosis
    and leprosy share them.
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Dermoscopy will show focused linear vessels on a yellow to orange background."
    explanation: Dermoscopic pattern of lupus vulgaris.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "This feature is also seen in other granulomatous diseases such as sarcoidosis and leprosy, and is rarely found in patients with black skin."
    explanation: The apple-jelly sign is not specific to lupus vulgaris.
treatments:
- name: Standard multidrug antituberculous chemotherapy
  description: >-
    Six months of oral antituberculous therapy: isoniazid, rifampicin,
    pyrazinamide and ethambutol for two months, then rifampicin and isoniazid
    for four months.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Paucibacillary Mycobacterial Persistence
    treatment_effect: INHIBITS
    description: Antituberculous drugs eradicate the persisting bacilli, so the granulomatous lesion resolves.
  evidence:
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The initial two-month phase involved a four-drug regimen comprising Isoniazid (INH), rifampicin, pyrazinamide, and ethambutol, followed by a four-month phase of rifampicin and INH."
    explanation: The regimen given to a lupus vulgaris case series.
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All the patients responded well to conventional multi-drug anti-tubercular chemotherapeutic regimens."
    explanation: All 19 patients responded to standard therapy.
  - reference: PMID:35583803
    reference_title: "Clinicoepidemiological characteristics of cutaneous tuberculosis in 1458 Indian patients: a retrospective analytical study from a tertiary care center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Treatment response to ATT was favorable in 99.2%."
    explanation: >-
      Response across all cutaneous tuberculosis variants in a series where
      lupus vulgaris was the largest group; not reported for lupus vulgaris
      alone.
- name: Susceptibility-guided antituberculous therapy
  description: >-
    Regimens chosen by drug-susceptibility testing for BCG-induced or
    drug-resistant lupus vulgaris, including second-line regimens for
    multidrug-resistant disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Paucibacillary Mycobacterial Persistence
    treatment_effect: INHIBITS
    description: Effective drugs against the resistant organism clear the infection.
  evidence:
  - reference: PMID:12395657
    reference_title: A review of cutaneous granulomas and lupus vulgaris following BCG vaccination in a skin hospital in Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The 1 case of confirmed BCG-induced lupus vulgaris was treated with rifampicin and ethambutol, as sensitivity testing revealed resistance to isoniazid."
    explanation: A BCG-induced case treated according to susceptibility.
  - reference: PMID:12395657
    reference_title: A review of cutaneous granulomas and lupus vulgaris following BCG vaccination in a skin hospital in Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Confirmed cases of BCG-induced lupus vulgaris should be treated based on antibiotic sensitivity profile."
    explanation: The authors' recommendation for BCG-induced disease.
  - reference: PMID:36304654
    reference_title: A Rare Case of Multidrug-Resistant Lupus Vulgaris with a Mixed Pattern of Resistance - A Long Journey to Diagnosis and Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Our patient had multidrug-resistant lupus vulgaris with a mixed pattern of resistance."
    explanation: Multidrug-resistant lupus vulgaris requiring a second-line regimen.
- name: Surgical excision of residual lesions
  description: >-
    Excision of residual or recalcitrant lesions after antituberculous therapy,
    and of squamous cell carcinoma arising in lupus vulgaris.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical excision
    term:
      id: NCIT:C15232
      label: Excision
  target_mechanisms:
  - target: Chronic Inflammation-Associated Squamous Carcinogenesis
    treatment_effect: INHIBITS
    description: Removing chronically inflamed residual tissue is proposed to prevent carcinogenesis.
  evidence:
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The patient demonstrated significant clinical improvement following standard six-month ATT; however, residual fibrotic lesions required excision for definitive management."
    explanation: Excision completed treatment after antituberculous therapy in the reported case.
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Early recognition, appropriate ATT, and surgical excision of residual or recalcitrant lesions are crucial to prevent complications, including carcinogenesis."
    explanation: The authors' recommendation of excision to prevent carcinoma.

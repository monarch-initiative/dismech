name: Lupus Vulgaris
creation_date: "2026-11-26T02:02:16Z"
description: >-
  Lupus vulgaris is a chronic, progressive, paucibacillary form of cutaneous
  tuberculosis that arises in a host already sensitized to Mycobacterium
  tuberculosis and carrying a high degree of cell-mediated immunity against it.
  Bacilli usually reach the skin endogenously, by hematogenous or lymphatic
  spread or by contiguous extension from an underlying focus, and less often by
  exogenous inoculation, including at a BCG vaccination site. A Th1-driven
  delayed-type hypersensitivity response organizes dermal tuberculoid
  granulomas that contain the few bacilli present, so acid-fast bacilli are
  rarely seen and culture is often negative while the tuberculin test is
  strongly positive. Clinically, reddish-brown papules and nodules that show an
  apple-jelly colour on diascopy coalesce into plaques that extend at the
  periphery and atrophy and scar at the centre, most often on the head and
  neck. Untreated lesions persist for years to decades and can become
  destructive and disfiguring, and squamous cell carcinoma can arise in
  long-standing lesions. Standard multidrug antituberculous chemotherapy is
  curative, with excision for residual lesions or malignant change.
category: Infectious Disease
disease_term:
  preferred_term: lupus vulgaris
  term:
    id: MONDO:0006838
    label: lupus vulgaris
parents:
- Cutaneous tuberculosis
- Tuberculosis
synonyms:
- tuberculosis luposa
- LV
notes: >-
  Seeded from research/Lupus_Vulgaris-deep-research-claude_code.md (claude_code
  provider) and from PubMed searches; every claim below carries its own evidence
  item quoting a cached abstract or open-access full text. Lupus vulgaris is an
  infection, not a Mendelian disorder, so no GeneReviews chapter applies and no
  causal human gene is recorded. It is unrelated to lupus erythematosus despite
  the shared name.
review_notes: >-
  Scoped as a standalone named clinical entity under MONDO:0021948 cutaneous
  tuberculosis rather than as a has_subtypes row of Tuberculosis, following the
  Meningeal_Tuberculosis precedent for a focal tuberculosis form. Lupus vulgaris
  is the reactivation/endogenous, paucibacillary cutaneous form of sensitized
  hosts and differs from the exogenous, multibacillary tuberculous chancre of
  tuberculin-naive hosts, which is curated separately as Primary Cutaneous
  Tuberculosis; a future cutaneous-tuberculosis Grouping would unite the
  cutaneous forms.

  Deliberately lumped. Lupus vulgaris caused by Mycobacterium tuberculosis, by
  M. bovis and by the BCG vaccine strain is kept as one entry, because the
  cited series and reviews describe the same clinical picture, histology and
  chronic course for all three, and PubMed searches for lupus vulgaris with BCG
  or M. bovis returned case reports and small series only. The one documented
  difference, that BCG-induced disease should be treated according to drug
  susceptibility, is recorded on the susceptibility-guided treatment rather than
  as a separate subtype.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The tubercle bacillus is the usual cause of lupus vulgaris, reaching the
    skin from an endogenous focus in a previously sensitized host.
  evidence:
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "It is caused by Mycobacterium tuberculosis complex, Mycobacterium bovis, and sometimes the Bacillus Calmette-Guérin (BCG) vaccine as well."
    explanation: >-
      The introduction of a lupus vulgaris case series names the M.
      tuberculosis complex as the cause of cutaneous tuberculosis.
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mycobacterium tuberculosis bacilli can be detected using polymerase chain reaction from the lesions."
    explanation: M. tuberculosis DNA is detectable in lupus vulgaris lesions.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    M. bovis is an occasional cause of cutaneous tuberculosis, including lupus
    vulgaris.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Occasionally it is also caused by M. bovis or BCG vaccine (an attenuated strain of M. bovis)."
    explanation: Names M. bovis as an occasional agent of cutaneous tuberculosis.
- name: Mycobacterium bovis BCG
  infectious_agent_term:
    preferred_term: Bacillus Calmette-Guerin vaccine strain
    term:
      id: NCBITaxon:33892
      label: Mycobacterium tuberculosis variant bovis BCG
  description: >-
    The attenuated BCG vaccine strain is a rare cause of lupus vulgaris at or
    near the vaccination site, sometimes years after vaccination.
  evidence:
  - reference: PMID:19094126
    reference_title: "Lupus vulgaris at the site of BCG vaccination: report of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report three cases of LV, developing many years later at the inoculation site of BCG vaccine."
    explanation: Case series of lupus vulgaris arising at BCG inoculation sites.
  - reference: PMID:12395657
    reference_title: A review of cutaneous granulomas and lupus vulgaris following BCG vaccination in a skin hospital in Singapore.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Of these cases, 4 were clinically suggestive of BCG-induced lupus vulgaris, but only 1 of these cases was confirmed by culture."
    explanation: Culture-confirmed BCG-induced lupus vulgaris in a hospital series.
agent_life_cycle:
  description: >-
    M. tuberculosis persists in a primary pulmonary, lymph node or other focus
    of a sensitized human host and reaches the skin by hematogenous, lymphatic
    or contiguous spread; BCG reaches it by intradermal vaccination.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Endogenous lymphohematogenous or contiguous spread
  description: >-
    Bacilli reach the skin from a pre-existing tuberculous focus by hematogenous
    or lymphatic dissemination or by contiguous extension, including from the
    drainage scar of scrofuloderma.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Endogenous infection is secondary to a preexisting primary focus and may result from contiguous (orificial tuberculosis, scrofuloderma), hematogenous (acute miliary tuberculosis, tuberculous gumma, lupus vulgaris) or lymphatic dissemination (lupus vulgaris)."
    explanation: Places lupus vulgaris among the hematogenous and lymphatic endogenous forms.
  - reference: PMID:25396129
    reference_title: "A clinico-histopathological study of lupus vulgaris: A 3 year experience at a tertiary care centre."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Lupus vulgaris is caused by hematogenous, lymphatic, or contiguous spread from elsewhere in the body."
    explanation: States the three endogenous routes.
- name: Exogenous cutaneous inoculation, including BCG vaccination
  description: >-
    Less often, bacilli are inoculated directly into the skin of a sensitized
    host; the BCG vaccination site is a recognized instance.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to the endogenous source, it may develop upon the drainage scar of scrofulodermas or rarely be acquired by exogenous Mtb inoculation."
    explanation: Records exogenous inoculation as a rare route.
  - reference: PMID:22084942
    reference_title: Ulcerated lupus vulgaris at the site of Bacille Calmette-Guérin vaccination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report a case of ulcerated lupus vulgaris occurring in 1.5-year-old boy at the Bacille Calmette-Guérin vaccination site within 6 months, which was diagnosed using histology and polymerase chain reaction."
    explanation: Lupus vulgaris at a BCG inoculation site.
prevalence:
- population: Cutaneous tuberculosis patients, tertiary centre in India (1458 patients, 22 years)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Lupus vulgaris was 40.4% of cutaneous tuberculosis cases in this series. This
    is a share of cutaneous tuberculosis rather than a population prevalence or
    incidence, so no rate_per_100000 is asserted.
  evidence:
  - reference: PMID:35583803
    reference_title: "Clinicoepidemiological characteristics of cutaneous tuberculosis in 1458 Indian patients: a retrospective analytical study from a tertiary care center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Lupus vulgaris (40.4%) was the most common clinical variant, followed by scrofuloderma (32.7%) and lichen scrofulosorum (15.2%)."
    explanation: Gives the lupus vulgaris share of cutaneous tuberculosis in a large series.
- population: Europe, India and Nepal
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Reviews describe lupus vulgaris as the most common form of cutaneous
    tuberculosis in Europe, India and Nepal; no population rate is given.
  evidence:
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lupus vulgaris is the most common form of cutaneous tuberculosis in Europe, India, and Nepal"
    explanation: States the relative frequency of lupus vulgaris among cutaneous forms.
progression:
- phase: Lupoma and plaque formation
  description: >-
    Reddish-brown papules and nodules, apple-jelly on diascopy, appear and
    coalesce into well-demarcated plaques, most often on the face and neck.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Usually there are papules and well-delimited, reddish-brown plaques in facial and cervical areas, which rarely ulcerate."
    explanation: Describes the initial papular and plaque phase.
- phase: Chronic peripheral extension with central scarring
  description: >-
    Untreated plaques persist and grow for years at the periphery while the
    centre atrophies and scars, with ulceration and tissue destruction.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated, LV lesions persist for years, gradually growing in size up to tens of centimeters and leading to significant aesthetic alterations, with ulcerations and tissue destruction."
    explanation: Describes the chronic destructive phase of untreated disease.
- phase: Malignant transformation
  duration: usually after 25 to 30 years of untreated disease
  description: >-
    Squamous cell carcinoma, and less often basal cell carcinoma, can arise in
    long-standing lesions.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The incidence of malignant transformation into squamous cell carcinoma in LV plates ranged from 0.5 to 10.5% and it usually occurs after 25-30 years of untreated disease."
    explanation: Gives the rate and latency of malignant transformation.
pathophysiology:
- name: Mycobacterial Seeding of the Skin in a Sensitized Host
  role: trigger
  biological_scale: ORGANISM
  description: >-
    M. tuberculosis complex bacilli reach the dermis of a host already sensitized
    to them, usually by hematogenous or lymphatic spread or contiguous extension
    from an endogenous focus and less often by exogenous inoculation, including
    BCG vaccination. Pre-existing high cell-mediated immunity is the defining
    host condition.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Th1 Delayed-Type Hypersensitivity Response
    causal_link_type: DIRECT
    description: >-
      Bacilli entering the dermis of a sensitized host recall the established
      Th1 memory response.
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Lupus vulgaris (LV) is a type of paucibacillary cutaneous tuberculosis that can occur due to inoculation, lymphatic, or hematogenous route."
    explanation: States the routes by which bacilli reach the skin.
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It occurs in a previously sensitized individual with high immunity to tuberculosis."
    explanation: Establishes prior sensitization with high immunity as the host condition.
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is a chronic, progressive, paucibacillary form of cutaneous tuberculosis which occurs primarily in the previously sensitized individual"
    explanation: Confirms the sensitized-host setting.
- name: Th1 Delayed-Type Hypersensitivity Response
  role: amplifier
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  description: >-
    The sensitized host mounts a Th1-polarized delayed-type hypersensitivity
    response: T-helper 1 cells activate dermal macrophages that ingest the
    bacilli. The same response underlies the strongly positive tuberculin test.
  biological_processes:
  - preferred_term: type IV hypersensitivity
    modifier: INCREASED
    term:
      id: GO:0001806
      label: type IV hypersensitivity
  - preferred_term: macrophage activation
    modifier: INCREASED
    term:
      id: GO:0042116
      label: macrophage activation
  cell_types:
  - preferred_term: T-helper 1 cell
    term:
      id: CL:0000545
      label: T-helper 1 cell
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Dermal Tuberculoid Granuloma Formation
    causal_link_type: DIRECT
    description: >-
      Persistent cytokine stimulation of macrophages drives their
      differentiation into epithelioid and giant cells that organize granulomas.
    evidence:
    - reference: PMID:24770496
      reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The chronic presence of these interleukins stimulating macrophages will ultimately cause their differentiation into epithelioid and giant cells that will organized themselves, to greater or lesser extent, into granulomas according to individual host factors."
      explanation: >-
        Describes the general tuberculosis step from macrophage stimulation to
        granuloma; applied to the skin by inference.
  evidence:
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "The immune response in tuberculosis occurs basically via Th1 pathway, with little or no involvement of Th2 pathway."
    explanation: >-
      States the Th1 basis of the anti-tuberculous response in general; the
      review applies it to cutaneous tuberculosis, but lupus-vulgaris-specific
      cytokine data are limited to case reports.
  - reference: PMID:24770496
    reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is a chronic, progressive form of CTB occurring in patients with a high degree of immunity against the bacillus"
    explanation: Ties lupus vulgaris to a high degree of anti-mycobacterial immunity.
- name: Dermal Tuberculoid Granuloma Formation
  role: central_effector
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation"
  description: >-
    Epithelioid macrophages and multinucleated Langhans-type giant cells, rimmed
    by lymphocytes, form well-organized tuberculoid granulomas in the upper and
    mid dermis, usually without caseation. The dermal granulomatous infiltrate
    produces the reddish-brown lupomas and their apple-jelly colour on diascopy.
  biological_processes:
  - preferred_term: granuloma formation
    modifier: INCREASED
    term:
      id: GO:0002432
      label: granuloma formation
  - preferred_term: syncytium formation by cell-cell fusion
    modifier: INCREASED
    term:
      id: GO:0000768
      label: syncytium formation by cell-cell fusion
  cell_types:
  - preferred_term: epithelioid macrophage
    term:
      id: CL:0002150
      label: epithelioid macrophage
  - preferred_term: Langhans giant cell
    term:
      id: CL:0000647
      label: multinucleated giant cell
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Paucibacillary Mycobacterial Persistence
    causal_link_type: DIRECT
    description: >-
      The granulomatous response contains the bacilli to a sparse population
      without eliminating them.
  - target: Epidermal Hyperplasia or Atrophy Over Granulomas
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The epidermis over the dermal granulomas becomes hyperplastic or atrophic;
      the intervening signals are not established for lupus vulgaris.
  - target: Apple-jelly papules and nodules
    causal_link_type: DIRECT
    description: The dermal granulomatous infiltrate forms the lupomas.
    evidence:
    - reference: PMID:41598640
      reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "On diascopy, these lesions exhibit a characteristic “apple-jelly” hue, attributable to granulomatous infiltration in the dermis"
      explanation: Attributes the apple-jelly appearance to dermal granulomatous infiltration.
  - target: Skin plaque
    causal_link_type: DIRECT
    description: Coalescing granulomatous papules form plaques.
  evidence:
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sixteen cases showed multi-nucleated Langhans-type giant cells."
    explanation: Langhans giant cells in 16 of 19 histologically confirmed cases.
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Caseous necrosis was absent in all the cases."
    explanation: The granulomas were non-caseating in every case of the series.
  - reference: PMID:25396129
    reference_title: "A clinico-histopathological study of lupus vulgaris: A 3 year experience at a tertiary care centre."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "histologically it is charecterised by typical tubercles with or without caseation, surrounded by epitheloid histiocytes and multinucleate giant cells in the superficial epidermis with prominent peripheral lymphocytes."
    explanation: Describes the epithelioid and giant-cell tubercles of lupus vulgaris.
- name: Paucibacillary Mycobacterial Persistence
  role: amplifier
  biological_scale: TISSUE
  description: >-
    Effective cell-mediated containment keeps the bacilli sparse, so acid-fast
    bacilli are rarely seen and culture is often negative, but containment is
    incomplete and the infection persists for years, sustaining the chronic
    granulomatous lesion.
  locations:
  - preferred_term: dermis
    term:
      id: UBERON:0002067
      label: dermis
  downstream:
  - target: Chronic Peripheral Extension with Central Scarring
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Persisting bacilli keep the granulomatous inflammation active, so untreated
      lesions extend for years.
    evidence:
    - reference: PMID:24770496
      reference_title: "Cutaneous tuberculosis: epidemiologic, etiopathogenic and clinical aspects - part I."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Untreated, LV lesions persist for years, gradually growing in size up to tens of centimeters and leading to significant aesthetic alterations, with ulcerations and tissue destruction."
      explanation: Untreated infection leads to years of extension and tissue destruction.
  evidence:
  - reference: PMID:38102852
    reference_title: "Lupus vulgaris: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histopathology will show epithelioid granulomas in the superficial dermis and acid-fast bacilli rarely demonstrable within the granulomas."
    explanation: Bacilli are rarely seen within the granulomas.
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "On histopathology, all showed a tuberculoid granuloma with no demonstration of acid-fast bacilli with Ziehl-Neelsen staining."
    explanation: No acid-fast bacilli were seen in any of 19 cases.
  - reference: PMID:30111996
    reference_title: "Cutaneous Tuberculosis: Clinicopathologic Arrays and Diagnostic Challenges."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Paucibacillary forms (bacilli being sparse) include TB verrucosa cutis, tuberculoid, and lupus vulgaris"
    explanation: Classifies lupus vulgaris as paucibacillary.
- name: Epidermal Hyperplasia or Atrophy Over Granulomas
  role: consequence
  biological_scale: TISSUE
  description: >-
    The epidermis over the granulomas becomes hypertrophic, with acanthosis,
    papillomatosis or pseudoepitheliomatous hyperplasia, or atrophic; the
    hypertrophic change gives hyperkeratotic and verrucous variants.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  locations:
  - preferred_term: epidermis
    term:
      id: UBERON:0001003
      label: skin epidermis
  downstream:
  - target: Hyperkeratosis
    causal_link_type: DIRECT
    description: Epidermal hyperplasia produces hyperkeratotic and verrucous surfaces.
  evidence:
  - reference: PMID:37575838
    reference_title: A Clinico-Histopathological Study of Lupus Vulgaris at a Tertiary Care Centre.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Histopathological examination was performed in all the cases, which demonstrated epidermal hypertrophy in 15 patients, and among these, 10 had pseudoepitheliomatous hyperplasia (Figure 1), while four had epidermal atrophy."
    explanation: Epidermal hypertrophy or atrophy in 19 of 19 cases.
  - reference: PMID:41598640
    reference_title: "Cutaneous Tuberculosis in the Modern Era: A Case of Lupus Vulgaris with Surgical Management and a Review of Clinical Spectrum, Diagnostic Challenges, and Malignant Potential."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Histopathologically, LV is defined by well-formed tuberculoid granulomas, with or without caseation necrosis, accompanied by a variable degree of epidermal hyperkeratosis or atrophy"
    explanation: Epidermal hyperkeratosis or atrophy accompanies the granulomas.
- name: Chronic Peripheral Extension with Central Scarring
  role: consequence
  biological_scale: TISSUE
  conforms_to: "granuloma_formation#Tissue Containment versus Destruction and Fibrosis"
  description: >-
    Plaques extend at the periphery with serpiginous or verrucous borders while
    the centre atrophies and scars. Untreated lesions grow for years, ulcerate
    and destroy tissue, causing disfigurement.
  biological_processes:
  - preferred_term: chronic inflammatory response
    modifier: INCREASED
    term:
      id: GO:0002544
      label: chronic inflammatory response
  downstream:
  - target: Atrophic scars
    causal_link_type: DIRECT
    description: Central healing leaves atrophic scarring.
  - target: Skin ulcer
    causal_link_type: DIRECT
    description: Long-standing lesions ulcerate.
  - target: Chronic Inflammation-Associated Squamous Carcinogenesis

genetic:
- name: TSGA10
  association: Causal
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: TSGA10
    term:
      id: hgnc:14927
      label: TSGA10
  notes: >-
    Reported alleles: homozygous c.211delG (p.Ala71Hisfs*12) (PMID:28905369);
    homozygous c.545dupT (p.Ala183Serfs*10) (PMID:32410354); c.1108-1G>T in
    trans with a de novo deletion spanning TSGA10 (PMID:34409526); homozygous
    c.1112T>C (p.Leu371Pro) (PMID:38317066). No ClinGen gene-disease validity
    assertion for TSGA10 is in the cached ClinGen export, so no validity tier
    is recorded.
  evidence:
  - reference: PMID:28905369
    reference_title: "TSGA10 is a novel candidate gene associated with acephalic spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent whole-exome sequencing analysis identified a homozygous deletion within TSGA10 (c.211delG; p.A71Hfs*12), which resulted in the production of truncated TSGA10 protein."
    explanation: First gene-disease report.
  - reference: PMID:32410354
    reference_title: "Loss-of-function mutation in TSGA10 causes acephalic spermatozoa phenotype in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous frameshift insertion mutation c.545dupT;p.Ala183Serfs*10 in exon 8 of TSGA10 (NM_001349012.1) was identified."
    explanation: Independent homozygous frameshift case.
  - reference: PMID:34409526
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by splicing mutation and de novo deletion in TSGA10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we identified a novel heterozygous splicing mutation in TSGA10 (NM_025244: c.1108-1G > T), while we confirmed that there was a de novo large deletion in the proband."
    explanation: Splice variant together with a deletion of the other allele.
  - reference: PMID:38317066
    reference_title: "A novel homozygous TSGA10 missense variant causes acephalic spermatozoa syndrome in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel missense variant in TSGA10 (c.1112T > C, p. Leu371Pro), which recessively co-segregated with the acephalic spermatozoa syndrome within this family"
    explanation: Homozygous missense variant co-segregating in a second family.
animal_models:
- name: Tsga10 heterozygous knockout mouse
  species: Mouse
  genotype: Tsga10 +/- (CRISPR/Cas9)
  publication: PMID:32790169
  description: >-
    Heterozygous male mice are infertile, with markedly reduced sperm
    motility and a disordered mitochondrial sheath.
  modeled_mechanisms:
  - target: Sperm Mitochondrial Sheath Disorganization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The mice reproduce the disordered mitochondrial sheath seen in patient sperm.
    limitations: >-
      The mouse defect appears with one null allele, while human disease is
      recessive, and the abstract does not report headless sperm, so the
      model does not show the defining acephalic phenotype.
    evidence:
    - reference: PMID:32790169
      reference_title: "Tsga10 is essential for arrangement of mitochondrial sheath and male fertility in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous Tsga10 male mice created by CRISPR/Cas9 were infertile and presented significantly reduced sperm motility because of disordered mitochondrial sheath formation."
      explanation: Mitochondrial sheath disorder and infertility in the model.
diagnosis:
- name: Semen analysis and sperm electron microscopy
  description: >-
    Routine semen analysis with stained smears shows mostly headless tails;
    transmission electron microscopy locates the break and shows the midpiece
    and axonemal defects.
  diagnosis_term:
    preferred_term: transmission electron microscopy of spermatozoa
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:28905369
    reference_title: "TSGA10 is a novel candidate gene associated with acephalic spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopic and immunofluorescence analysis suggested breakage at the midpiece of the patient's sperm cells."
    explanation: Electron microscopy localizes the TSGA10-type break.
- name: Whole-exome sequencing
  description: >-
    Each reported TSGA10 case was found by exome sequencing and confirmed by
    Sanger sequencing. A single heterozygous variant in a non-consanguineous
    patient calls for copy-number analysis of the other allele.
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:38317066
    reference_title: "A novel homozygous TSGA10 missense variant causes acephalic spermatozoa syndrome in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through whole-exome sequencing (WES) followed by Sanger sequencing, we identified a novel missense variant in TSGA10"
    explanation: Exome sequencing found the causal variant.
  - reference: PMID:34409526
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by splicing mutation and de novo deletion in TSGA10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantitative real-time polymerase chain reaction and whole genome sequencing were subjected to detect deletion."
    explanation: The deleted second allele needed copy-number methods beyond exome sequencing.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI with the few remaining heads is the only route to biological
    paternity. Outcomes in TSGA10 cases differ between reports: the first
    patient's embryos were of poor quality and no pregnancy followed, while a
    later Chinese cohort with TSGA10 or PMFBP1 variants reported good ICSI
    outcomes.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Acephalic spermatozoa
    description: Injecting a detached head into the oocyte bypasses the need for an intact sperm.
  evidence:
  - reference: PMID:34089195
    reference_title: "Patients with acephalic spermatozoa syndrome linked to novel TSGA10/PMFBP1 variants have favorable pregnancy outcomes from intracytoplasmic sperm injection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with TSGA10/PMFBP1 variations were all expected to have good prognoses with ICSI."
    explanation: Favourable ICSI outcomes in a cohort including TSGA10 patients.
  - reference: PMID:28905369
    reference_title: "TSGA10 is a novel candidate gene associated with acephalic spermatozoa."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "One cycle of in vitro fertilization-assisted reproduction was conducted, but pregnancy was not achieved after embryo transfer, possibly due to poor embryo quality."
    explanation: The first TSGA10 patient did not achieve a pregnancy after assisted reproduction.
- name: Genetic Counseling
  description: >-
    Counseling on autosomal recessive inheritance, including the possibility
    of a deletion on the second allele in non-consanguineous families.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34409526
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by splicing mutation and de novo deletion in TSGA10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also important to remind us of paying attention to the compound heterozygous deletion in patients from non-consanguineous families, so that we can provide more precise genetic counseling for patients."
    explanation: Authors recommend attention to deletions to inform counseling.

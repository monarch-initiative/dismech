name: Spermatogenic Failure 26
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
synonyms:
- SPGF26
- spermatogenic failure 26
- TSGA10-related acephalic spermatozoa syndrome
description: >-
  Spermatogenic failure 26 (SPGF26) is autosomal recessive male infertility
  caused by biallelic loss-of-function variants in TSGA10, a testis-enriched
  centrosomal protein that localizes to the sperm midpiece. Affected men are
  otherwise healthy and present with acephalic spermatozoa syndrome: the
  ejaculate contains mostly headless sperm tails and a few loose heads. In
  TSGA10 deficiency the break lies between the distal centriole and the
  midpiece, so the tails retain little or no mitochondrial sheath, and the
  remaining midpiece and axoneme are disorganized. Sperm concentration and
  progressive motility can also be very low. Reported variants are
  frameshift, splice-site and missense alleles, homozygous in consanguineous
  families or in trans with a large deletion, and each leaves the sperm with
  no detectable TSGA10 protein. Assisted reproduction by intracytoplasmic
  sperm injection (ICSI) has given both failed and successful pregnancies.
disease_term:
  preferred_term: spermatogenic failure 26
  term:
    id: MONDO:0054730
    label: spermatogenic failure 26
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references this disease as OMIM 617961 and records TSGA10 as its
  causal gene. Heterozygous Tsga10 knockout male mice are infertile
  (PMID:32790169), whereas every reported human case is biallelic and no
  phenotype has been described in heterozygous human relatives, so the mouse
  dosage result is recorded only on the animal model. GO annotates no
  molecular function for TSGA10 other than protein binding (QuickGO, UniProt
  Q9BZW7), so the TSGA10 node carries no molecular_functions term.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires two TSGA10 loss-of-function alleles: a homozygous
    frameshift in Chinese probands, a homozygous missense variant segregating
    with disease in two Pakistani brothers, and a splice variant in trans with
    a de novo large deletion in a non-consanguineous proband.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38317066
    reference_title: "A novel homozygous TSGA10 missense variant causes acephalic spermatozoa syndrome in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a novel missense variant in TSGA10 (c.1112T > C, p. Leu371Pro), which recessively co-segregated with the acephalic spermatozoa syndrome within this family"
    explanation: Recessive co-segregation of a homozygous TSGA10 variant with disease.
  - reference: PMID:34409526
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by splicing mutation and de novo deletion in TSGA10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we speculated that the splicing mutation might affect transcription and translation without the dosage compensation of a normal allele, which possesses a large deletion including intact TSGA10."
    explanation: >-
      A heterozygous splice variant causes disease because the other allele is
      deleted, the compound-heterozygous form of recessive inheritance.
pathophysiology:
- name: Loss of TSGA10 Protein
  description: >-
    Frameshift, splice-site and missense variants all leave spermatozoa
    without detectable TSGA10. The frameshift alleles truncate the protein,
    the splice variant produces a truncated protein at very low level, and the
    Leu371Pro missense variant abolishes both mRNA and protein in sperm.
    TSGA10 is normally found at the sperm midpiece. In mouse testis the
    65-kDa spermatid protein is processed to a 27-kDa fibrous sheath protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TSGA10
    term:
      id: hgnc:14927
      label: TSGA10
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Defective Sperm Head-Tail Coupling
    causal_link_type: DIRECT
  - target: Sperm Mitochondrial Sheath Disorganization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32410354
      reference_title: "Loss-of-function mutation in TSGA10 causes acephalic spermatozoa phenotype in human."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results suggest that loss of TSGA10 may impair the formation of the mitochondrial sheath."
      explanation: The authors attribute the mitochondrial sheath defect to the loss of TSGA10.
  evidence:
  - reference: PMID:28905369
    reference_title: "TSGA10 is a novel candidate gene associated with acephalic spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSGA10 is a testis-specific protein that localized to the midpiece in the spermatozoa of a normal control; however, immunostaining failed to detect TSGA10 protein in the patient's sperm. Western blot analysis also showed complete absence of TSGA10 protein in the patient."
    explanation: The homozygous frameshift abolishes TSGA10 protein in sperm.
  - reference: PMID:32410354
    reference_title: "Loss-of-function mutation in TSGA10 causes acephalic spermatozoa phenotype in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSGA10 failed to be detected in the patient's spermatozoa. However, the expression of SUN5 and PMFBP1 remained unaffected."
    explanation: A second frameshift allele also abolishes TSGA10, without loss of two other head-tail coupling proteins.
  - reference: PMID:34409526
    reference_title: "Pathogenesis of acephalic spermatozoa syndrome caused by splicing mutation and de novo deletion in TSGA10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blot and immunofluorescence demonstrated that the very low expression level of truncated TSGA10 protein led the proband to present the acephalic spermatozoa phenotype."
    explanation: The splice allele yields only trace amounts of truncated protein.
  - reference: PMID:38317066
    reference_title: "A novel homozygous TSGA10 missense variant causes acephalic spermatozoa syndrome in a Pakistani family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Real-time quantitative PCR analysis revealed almost no detectable TSAG10 mRNA and western blot analysis also failed to detect TSAG10 protein in patient's sperm samples while TSGA10 expression was clearly detected in control samples."
    explanation: The missense allele also behaves as a null in sperm.
  - reference: PMID:14585816
    reference_title: "Tsga10 encodes a 65-kilodalton protein that is processed to the 27-kilodalton fibrous sheath protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mtsga10 encodes a 65-kDa spermatid protein that appears to be processed to a 27-kDa protein of the fibrous sheath, a major sperm tail structure, in mature spermatozoa"
    explanation: Normal processing and tail localization of the protein lost in the disease.
- name: Defective Sperm Head-Tail Coupling
  description: >-
    TSGA10 is a centrosomal scaffold protein whose C-terminal fragment sits at
    the centrosome and basal body and binds ODF2, so it is thought to help
    anchor the sperm tail to the head. Without it, the flagellum separates from
    the head at a point between the distal centriole and the midpiece.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: sperm head-tail coupling apparatus
    term:
      id: GO:0120212
      label: sperm head-tail coupling apparatus
  - preferred_term: centriole
    term:
      id: GO:0005814
      label: centriole
  downstream:
  - target: Acephalic spermatozoa
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42366926
      reference_title: "Sperm Head-Tail Coupling Apparatus Diversity and Common Themes Among Species."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Impairment of the HTCA leads to a severe type of infertility called acephalic spermatozoa syndrome, where sperm heads become detached from their tails."
      explanation: Review stating that head-tail coupling failure produces acephalic spermatozoa.
  evidence:
  - reference: PMID:38317066
    reference_title: "A novel homozygous TSGA10 missense variant causes acephalic spermatozoa syndrome in a Pakistani family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "implying that the TSGA10 C-terminus is involved in centriole assembly and function, particularly in the head-tail link"
    explanation: >-
      The introduction of this clinical paper restates earlier interaction
      work that places TSGA10 at the centriole and the head-tail link.
  - reference: PMID:28905369
    reference_title: "TSGA10 is a novel candidate gene associated with acephalic spermatozoa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electron microscopic and immunofluorescence analysis suggested breakage at the midpiece of the patient's sperm cells."
    explanation: Patient sperm break at the midpiece.
  - reference: PMID:32104701
    reference_title: "Beyond Acephalic Spermatozoa: The Complexity of Intracytoplasmic Sperm Injection Outcomes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "the breakage of TSGA10 associated with AS sperms is located between the distal centriole and the midpiece"
    explanation: Review placing the TSGA10-related break between the distal centriole and the midpiece.
- name: Sperm Mitochondrial Sheath Disorganization
  description: >-
    The midpiece of the headless tails carries a misarranged or partial
    mitochondrial sheath, with reduced staining for the mitochondrial marker
    COXIV. Heterozygous Tsga10 knockout mice also form a disordered
    mitochondrial sheath and have poorly motile sperm.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: sperm mitochondrial sheath assembly
    modifier: DECREASED
    term:
      id: GO:0120317
      label: sperm mitochondrial sheath assembly
  cellular_components:
  - preferred_term: sperm mitochondrial sheath
    term:
      id: GO:0097226
      label: sperm mitochondrial sheath
  downstream:
  - target: Reduced progressive sperm motility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in Tsga10 heterozygous mice. In patients the two findings are
      reported together but not causally linked.
    evidence:
    - reference: PMID:32790169
      reference_title: "Tsga10 is essential for arrangement of mitochondrial sheath and male fertility in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous Tsga10 male mice created by CRISPR/Cas9 were infertile and presented significantly reduced sperm motility because of disordered mitochondrial sheath formation."
      explanation: The mouse study attributes the motility defect to the mitochondrial sheath defect.
  evidence:
  - reference: PMID:32410354
    reference_title: "Loss-of-function mutation in TSGA10 causes acephalic spermatozoa phenotype in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results showed misarranged mitochondrial sheath and abnormal flagellum in the patient's spermatozoa."
    explanation: Ultrastructural mitochondrial sheath defect in a patient.
  - reference: PMID:32410354
    reference_title: "Loss-of-function mutation in TSGA10 causes acephalic spermatozoa phenotype in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial sheath defects in the patient were confirmed by our immunofluorescence analysis of mitochondrial marker COXIV, which revealed reduced labeling of the patient's spermatozoa."
    explanation: Reduced mitochondrial marker staining confirms the sheath defect.
  - reference: PMID:32790169
    reference_title: "Tsga10 is essential for arrangement of mitochondrial sheath and male fertility in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "TSGA10 is involved in the correct arrangement of mitochondrial sheath in spermatozoa."
    explanation: Mouse knockout conclusion on TSGA10 function in the mitochondrial sheath.

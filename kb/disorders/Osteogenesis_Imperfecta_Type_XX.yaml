diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type XX is suspected in an infant or child with severe, progressively
    deforming recessive OI (recurrent fractures, low bone mineral density,
    deformity), particularly when oligodontia is present and COL1A1/COL1A2 and
    other recessive OI genes are negative. Diagnosis is confirmed by identifying
    biallelic MESD (MESDC2) variants by gene-panel or exome sequencing;
    whole-exome sequencing identified the gene in the original kindreds.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:33596325
    reference_title: "Compound Heterozygous Frameshift Mutations in MESD Cause a Lethal Syndrome Suggestive of Osteogenesis Imperfecta Type XX."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      whole-exome sequencing of three stillbirths in one family was performed to
      evaluate the presence of a hereditary disorder.
    explanation: >-
      Illustrates the molecular diagnostic pathway (exome sequencing) used to
      identify biallelic MESD variants establishing the OI type XX diagnosis.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates are the pharmacological mainstay of severe OI,
    increasing bone mineral density and reducing fracture frequency. They are
    antiresorptive and do not correct the underlying WNT-signaling/MESD
    chaperone defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy

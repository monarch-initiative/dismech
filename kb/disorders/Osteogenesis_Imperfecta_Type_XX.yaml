    quote_role: BACKGROUND
    snippet: >-
      To date, two reports have linked Mesoderm Development LRP Chaperone (MESD)
      to autosomal recessive OI type XX. Four different biallelic pathogenic
      variants in MESD were shown to cause a progressively deforming phenotype,
      associated with recurrent fractures and oligodontia in five individuals in
      five families.
    explanation: >-
      Summarizes the small number of reported families in the literature,
      establishing OI type XX as an ultra-rare disorder.
pathophysiology:
- name: MESD Loss Impairs ER Chaperoning and Trafficking of LRP5/LRP6
  description: >-
    MESD encodes an endoplasmic-reticulum chaperone protein for the canonical WNT
    signaling co-receptors LRP5 and LRP6, folding them and chaperoning their
    transit to the cell surface. The OI-associated MESD mutations are
    truncating/frameshift alleles located downstream of the chaperone activity
    domain but upstream of the ER-retention domain, so mutant MESD fails to be
    retained within the ER; this significantly reduces (but does not completely
    eliminate) LRP5/LRP6 trafficking, whereas proximal exon 2 frameshifts within
    the chaperone domain abolish function completely. The proximal lesion is thus
    failure of WNT co-receptor maturation rather than a defect in type I
    collagen, placing OI type XX mechanistically alongside WNT1-related OI type
    XV.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic DNA alterations were identified in 106 cases (91%); 18 (17%) in TSC1 and 88 (83%) in TSC2."
      explanation: Quantifies the TSC2 share of pathogenic variants among molecularly solved cases (the majority gene).
  - population: TOSCA international registry, molecularly tested patients (n=902)

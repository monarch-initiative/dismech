    explanation: >
      Grade 2-4 kidney cysts are identified as very rare or absent
      specifically in TSC1-related disease.
- category: Renal
  name: Renal Hemorrhage
  frequency: OCCASIONAL
  description: >
    Spontaneous haemorrhage from large angiomyolipomas (>4 cm) is the most
    serious renal complication of TSC and is a leading kidney-related cause
    of morbidity. Embolization or partial nephrectomy is reserved for
    haemorrhage unresponsive to mTOR inhibitor therapy.
  phenotype_term:
    preferred_term: Hematuria
    term:
      id: HP:0000790
      label: Hematuria
  evidence:
  - reference: PMID:38991206
    reference_title: "Tuberous Sclerosis Complex and the kidneys: what nephrologists need to know."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surgical interventions like nephrectomy and embolization being reserved primarily for complications unresponsive to clinical treatment, such as severe renal hemorrhage."
    explanation: Identifies severe renal hemorrhage as a complication of TSC kidney lesions and its management.
- category: Pulmonary
  name: Pulmonary Lymphangioleiomyomatosis
  frequency: FREQUENT
  description: >
    Pulmonary lymphangioleiomyomatosis is an mTOR inhibitor-responsive lung
    manifestation of TSC caused by proliferation of abnormal smooth-muscle-like
    cells and cystic lung remodeling.
  phenotype_term:
    preferred_term: Pulmonary lymphangioleiomyomatosis
    term:
      id: HP:0005948
      label: Multiple pulmonary cysts
  evidence:
  - reference: PMID:27226234
    reference_title: "Tuberous sclerosis complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >
      Remarkable progress in basic and translational research, in addition to
      several randomized controlled trials worldwide, has led to regulatory
      approval of the use of mTOR inhibitors for the treatment of renal
      angiomyolipomas, brain subependymal giant cell astrocytomas and pulmonary
      lymphangioleiomyomatosis
    explanation: >
      Supports pulmonary lymphangioleiomyomatosis as a TSC manifestation with
      mTOR inhibitor-responsive biology.
  - reference: PMID:23539171
    reference_title: "Lymphangioleiomyomatosis screening in women with tuberous sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-eight (47.5%) met criteria for TSC-LAM on the initial CT scan."
    explanation: >
      This female TSC clinic cohort supports a FREQUENT frequency band for LAM
      in women with TSC.
- category: Pulmonary
  name: Multifocal Micronodular Pneumocyte Hyperplasia
  description: >
    Multifocal micronodular pneumocyte hyperplasia (MMPH) is a distinct
    pulmonary manifestation of TSC characterized by multiple small nodular
    proliferations of type II pneumocytes. Unlike LAM it affects both sexes
    and is usually asymptomatic and non-progressive, but it is a recognized
    TSC lung finding separate from the cystic LAM phenotype.
  phenotype_term:
    preferred_term: Multifocal micronodular pneumocyte hyperplasia
    term:
      id: HP:0033328
      label: Type II pneumocyte hyperplasia
  evidence:
  - reference: PMID:20301399
    reference_title: "Tuberous Sclerosis Complex. GeneReviews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multifocal micronodular pneumonocyte hyperplasia"
    explanation: >
      GeneReviews lists multifocal micronodular pneumonocyte hyperplasia among
      the lung manifestations of TSC, alongside lymphangioleiomyomatosis.
- category: Cardiac
  name: Cardiac Rhabdomyoma
  frequency: FREQUENT
  description: >
    Cardiac rhabdomyomas are typically the earliest detectable lesion in TSC,
    often identified prenatally on fetal echocardiography. They occur in
    approximately 50-65% of patients overall and were the highest-incidence
    manifestation (54.8%) in a Japanese claims cohort diagnosed under 2 years
    of age. Most regress spontaneously during childhood; large or multiple
    lesions can cause hydrops fetalis or arrhythmias.
  phenotype_term:
    preferred_term: Cardiac rhabdomyoma
    term:
      id: HP:0009729
      label: Cardiac rhabdomyoma
  evidence:
  - reference: PMID:39617898
    reference_title: "Diagnostic flow analysis of tuberous sclerosis complex in Japan: a retrospective claims database study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiac rhabdomyoma had the highest incidence (54.8%) among Cohort 2 patients."
    explanation: Real-world claims data showing cardiac rhabdomyoma as the most frequent early-life (under 2 years) TSC manifestation.
  - reference: PMID:39518472
    reference_title: "Prenatal mTOR Inhibitors in Tuberous Sclerosis Complex: Current Insights and Future Directions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tuberous sclerosis complex (TSC) can present prenatally, often with cardiac rhabdomyomas, which, if large, may cause complications such as hydrops fetalis and reduced cardiac output."
    explanation: Confirms prenatal cardiac rhabdomyoma as an early TSC presentation with potential complications.
- category: Musculoskeletal
  name: Sclerotic Bone Lesions
  frequency: OCCASIONAL
  description: >
    Sclerotic bone lesions are focal areas of increased bone density in TSC
    patients, detectable on radiographs, and are a minor diagnostic criterion
    reinstated in the 2021 International TSC Consensus update. These
    osteosclerotic hamartomas are typically asymptomatic and represent
    disordered bone formation driven by mTORC1 dysregulation.
  phenotype_term:
    preferred_term: Sclerotic bone lesions
    term:
      id: HP:0005686
      label: Patchy osteosclerosis
  evidence:
  - reference: PMID:34399110
    reference_title: "Updated International Tuberous Sclerosis Complex Diagnostic Criteria and Surveillance and Management Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sclerotic bone lesions were reinstated as a minor criterion"
    explanation: >
      The 2021 International TSC Consensus reinstated sclerotic bone lesions
      as a minor diagnostic criterion for TSC, acknowledging their role as a
      recognized manifestation of the disease.
- category: Cardiac
  name: Cardiac Arrhythmia
  frequency: OCCASIONAL
  description: >
    Cardiac arrhythmias and conduction defects are recognized cardiovascular
    features of TSC, particularly in pediatric patients. The 2012 International
    TSC Consensus guidelines mandate electrocardiogram (ECG) at diagnosis in
    young children to evaluate for arrhythmia, and recommend follow-up ECG
    monitoring every 3-5 years in asymptomatic adults because conduction defects
    may persist throughout life. Arrhythmias are mechanistically linked to the
    presence of cardiac rhabdomyomas that can disrupt the conduction system.
  phenotype_term:
    preferred_term: Cardiac arrhythmia
    term:
      id: HP:0011675
      label: Arrhythmia
  evidence:
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "echocardiogram and electrocardiogram (ECG) should be obtained to evaluate for rhabdomyomas and arrhythmia, respectively"
    explanation: >
      The 2012 International TSC Consensus guidelines explicitly mandate ECG
      at diagnosis in pediatric patients to evaluate for arrhythmia, establishing
      cardiac arrhythmia as a recognized surveillance target in TSC. The snippet
      supports the disease-phenotype association but not a specific frequency band;
      the OCCASIONAL assignment is a clinical estimate (no quantitative frequency
      is reported in the guideline and no Orphanet frequency is available for this
      phenotype).
- category: Renal
  name: Hypertension
  frequency: OCCASIONAL
  description: >
    Secondary hypertension is a recognized complication of renal tuberous sclerosis
    complex manifestations, particularly from renal angiomyolipomas and cysts
    impairing normal renal architecture and renin-angiotensin regulation. The 2012
    International TSC Consensus guidelines require annual blood pressure assessment
    and recommend renin-angiotensin system inhibitors as first-line therapy when
    hypertension is identified.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  notes: >
    The 2012 International TSC Consensus carries a clinically important drug-interaction
    caveat for first-line antihypertensive choice: angiotensin-converting enzyme (ACE)
    inhibitors should be avoided in patients concurrently treated with an mTOR inhibitor
    (e.g. everolimus, sirolimus), because of an increased risk of angioedema with that
    combination. A non-ACE renin-angiotensin-aldosterone system inhibitor is preferred
    in mTOR-inhibitor-treated patients.
  evidence:
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accurate blood pressure assessment is important because of increased risk of secondary hypertension"
    explanation: >
      The 2012 International TSC Consensus guidelines identify secondary hypertension
      as an increased-risk complication warranting dedicated blood pressure assessment
      at time of TSC diagnosis.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual clinical assessment of renal function and hypertension is required"
    explanation: >
      Ongoing annual hypertension surveillance is mandated by the 2012 International
      TSC Consensus, reflecting the chronic risk of secondary hypertension from
      progressive renal disease in TSC.
- category: Renal
  name: Renal Cell Carcinoma
  frequency: VERY_RARE
  description: >
    TSC patients have an elevated risk of renal cell carcinoma (RCC) compared with
    the general population. RCC arises in the context of the broader renal involvement
    of TSC alongside angiomyolipomas and cysts, and is included as an explicit
    surveillance target in the 2012 International TSC Consensus guidelines, which
    mandate periodic renal MRI to detect RCC and other tumors.
  phenotype_term:
    preferred_term: Renal cell carcinoma
    term:
      id: HP:0005584
      label: Renal cell carcinoma
  evidence:
  - reference: PMID:38991206
    reference_title: "Tuberous Sclerosis Complex and the kidneys: what nephrologists need to know."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    reference_title: "Mutational analysis in a cohort of 224 tuberous sclerosis patients indicates increased severity of TSC2, compared with TSC1, disease in multiple organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some features (grade 2-4 kidney cysts or angiomyolipomas, forehead plaques, retinal hamartomas, and liver angiomyolipomas) were very rare or not seen at all in TSC1 patients"

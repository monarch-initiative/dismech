    snippet: "To assist in the classification of 11 TSC2 variants, we investigated the effects of these variants in an in vitro functional assay. Based on the functional results, as well as population and genetic data, we classified 8 variants as likely to be pathogenic and 3 as likely to be benign."
    explanation: >
      Demonstrates the in vitro TSC-complex functional assay as a practical
      adjunct to sequence-only ACMG/AMP classification. The 11 assayed
      variants in this study were TSC2, not TSC1; the assay platform is

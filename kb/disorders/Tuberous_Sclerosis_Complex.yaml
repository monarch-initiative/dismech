    explanation: >
      Identifies loss of kidney function as the shared downstream consequence
      of the cystic and angiomyolipomatous renal lesions of TSC.
- category: Hepatic
  name: Hepatic Cysts
  frequency: OCCASIONAL
  description: >
    Hepatic cysts and extrarenal hamartomas of the liver can occur in TSC as part
    of the generalized multisystem hamartoma phenotype. They are typically detected
    incidentally on abdominal MRI performed for renal surveillance and are usually
    asymptomatic.

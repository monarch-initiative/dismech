    snippet: "Oral fibromas should be excised surgically if symptomatic or if interfering with oral hygiene. Oral fibromas may recur once excised; therefore, periodic oral evaluation is encouraged."
    explanation: >
      The 2012 International TSC Consensus guidelines include oral fibromas

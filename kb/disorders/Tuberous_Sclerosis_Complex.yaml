- category: Renal
  name: Renal Oncocytoma
  description: >
    Renal oncocytoma is a benign renal epithelial tumour composed of
    mitochondria-rich oncocytes. It is a recognised but uncommon renal
    manifestation of TSC, distinct from the far more frequent angiomyolipomas
    and epithelial cysts, and is relevant to the differential diagnosis of a
    solid renal mass detected on TSC surveillance imaging.
  phenotype_term:
    preferred_term: Renal oncocytoma

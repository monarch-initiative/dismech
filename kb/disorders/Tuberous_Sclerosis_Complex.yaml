    snippet: "HP:0007359 | Focal-onset seizure | Frequent (79-30%)"
    explanation: >
      Orphanet's curated HPO frequency annotation classifies focal-onset
      seizure as frequent (79-30%) in tuberous sclerosis complex.
  - reference: PMID:40579409
    reference_title: "Genetic screening of tuberous sclerosis complex in Sicily with a focus on neurological manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More in detail, two patients (6.4%) presented infantile spasms, 12 (38.7%) had focal seizures (three with impaired awareness), six (19.3%) patients experienced generalized tonic clonic seizures"
    explanation: >
      Seizure-type breakdown of the 31-patient TSC1 arm of the Sicilian
      cohort: focal seizures were the single most common type (12/31, 38.7%),
      well ahead of infantile spasms (2/31) in this predominantly adult
      TSC1 group.
- category: Neurologic
  name: Cerebral Hypomyelination
  description: >
    Hypomyelination and abnormal white-matter microstructure are part of the
    TSC brain phenotype and are increasingly attributed to
    oligodendrocyte-lineage mTORC1 dysregulation rather than being a purely
    secondary consequence of tuber burden or seizures. Altered myelination is
    associated with abnormal connectivity and is one proposed substrate for
    the cognitive and autism-spectrum components of TAND.
  phenotype_term:
    preferred_term: Cerebral hypomyelination
    term:
      id: HP:0006808
      label: Cerebral hypomyelination
  evidence:
  - reference: PMID:33041976
    reference_title: "Tuberous Sclerosis Complex as Disease Model for Investigating mTOR-Related Gliopathy During Epileptogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mTOR hyperactivity promotes development of often multifocal brain lesions characterized by aberrant glioneuronal proliferation, cortical dyslamination, and hypomyelination"
    explanation: >
      Names hypomyelination as a defining component of the multifocal brain
      lesions produced by mTOR hyperactivity in TSC.
  - reference: PMID:33041976
    reference_title: "Tuberous Sclerosis Complex as Disease Model for Investigating mTOR-Related Gliopathy During Epileptogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oligodendrocyte dysfunction leads to hypomyelination and disturbed remyelination, and their proliferation is reduced."
    explanation: >
      Attributes the hypomyelination specifically to oligodendrocyte-lineage
      dysfunction, linking this phenotype to the gliopathy pathophysiology
      node rather than to neuronal dysplasia alone.
  notes: >-
    No `frequency:` band is asserted. Neither Orphanet's HPO annotation set for
    ORPHA:805 nor the cited gliopathy review states a proportion of patients
    with hypomyelination, and imaging-based white-matter abnormality rates in
    TSC vary with modality and definition. Omitted rather than estimated.

- category: Neurologic
  name: Focal-Onset Seizures
  frequency: FREQUENT
  description: >
    Focal-onset seizures are the predominant seizure type in TSC outside the
    infantile-spasms window and are the seizure class that most often becomes
    drug resistant, driving epilepsy-surgery evaluation. The 2021 diagnostic
    criteria's emphasis on multiple cortical tubers reflects the focal,
    multifocal and asymmetric nature of the epileptogenic substrate.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:

      reference_title: "Genetic screening of tuberous sclerosis complex in Sicily with a focus on neurological manifestations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic TSC2 variants were more common than pathogenic TSC1 variants (61.7% vs. 38.3%)."

  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals suspected of having TSC, regardless of age, should undergo magnetic resonance imaging (MRI) of the brain with and without gadolinium"
    explanation: >
      2012 International TSC Consensus baseline brain-MRI recommendation
      (Category 1) at the time of diagnosis to assess for tubers, subependymal
      nodules, and SEGA.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "surveillance by MRI should be performed every 1–3 years in all individuals with TSC until the age of 25 years."
    explanation: >
      Consensus SEGA surveillance schedule (Category 2A); optimal outcome is
      associated with early detection and treatment.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Annual clinical assessment of renal function and hypertension is required."
    explanation: >
      Consensus renal-surveillance recommendation (Category 1); periodic renal
      MRI monitors angiomyolipomata, which require more intervention in
      adulthood.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is imperative to continue to monitor for features of TAND and their impact on daily living through basic questioning and screening procedures at each follow-up clinic visit, with a minimum frequency of once per year."
    explanation: >
      Consensus minimum annual TAND screening at each clinic visit (Category 1),
      with comprehensive formal evaluations at scheduled developmental time
      points.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A skin survey should be performed annually, with focus on rapidly changing or symptomatic (problematic or functionally impacting) lesions"
    explanation: >
      Consensus annual dermatologic surveillance recommendation, with early
      intervention for bleeding, symptomatic, or disfiguring skin lesions.
  - reference: PMID:24053983
    reference_title: "Tuberous sclerosis complex surveillance and management: recommendations of the 2012 International Tuberous Sclerosis Complex Consensus Conference."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "follow-up echocardiogram should be performed every 1–3 years in asymptomatic patients. In addition, 12-lead ECG is recommended at minimum every 3–5 years to monitor for conduction defects."
    explanation: >
      Consensus cardiac surveillance schedule (Category 1) until rhabdomyoma

- name: Renal AML Embolization or Nephrectomy
  description: >
    Selective renal artery embolization or partial/total nephrectomy is
    reserved for complications of large angiomyolipomas (especially severe
    haemorrhage) unresponsive to mTOR inhibitor therapy. Agents/circumstances
    to avoid (GeneReviews): nephrectomy is explicitly listed among the
    circumstances to avoid in TSC — because renal lesions are typically
    bilateral and multifocal, kidney-sparing approaches (embolization,
    kidney-sparing resection, ablation) are preferred over nephrectomy to
    preserve long-term renal function. GeneReviews also lists smoking and
    estrogen use as circumstances to avoid; those two are recorded on the
    pulmonary/LAM-directed treatment rather than here.

- name: mTOR-Driven Gliopathy and Neurovascular Unit Dysfunction
  biological_scale: CELLULAR
  description: >
    Alongside the neuron-centred account of TSC brain disease, mTORC1
    hyperactivation produces a distinct, non-neuronal "gliopathy" arm.
    mTORC1 hyperactivity biases neural precursors toward gliogenesis
    (contributing to the glial excess within tubers); astrocytes become
    reactive, proliferative and proinflammatory while losing homeostatic
    ion- and neurotransmitter-handling functions; oligodendrocyte lineage
    cells mature abnormally, giving hypomyelination and impaired
    remyelination; NG2 glia and microglia are also altered. The same
    mTOR-dependent lesion extends to the neurovascular unit: a human
    iPSC-derived, microfluidic blood-brain-barrier model built from
    TSC-mutant cells is abnormally permeable, and the defect is corrected
    either by supplying wild-type astrocytes or by rapamycin, showing the
    barrier phenotype is astrocyte-dependent and mTOR-dependent rather than
    a fixed structural consequence of the mutation. This node captures the
    glial and neurovascular contribution to epileptogenesis and to the
    cognitive/behavioural comorbidities of TAND, which the dysplasia node
    above does not.

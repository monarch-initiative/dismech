notes: |
  Quantitative evidence highlights from recent literature integrated into this
  entry:
  - Adjusted prevalence: 10.2 per 100,000 in Shizuoka, Japan, 2012-2020
    (Kishida 2025; PMID:40410908).
  - Diagnostic yield of conventional sequencing: 91% (TSC2 83%, TSC1 17%);
    NMI ~10-15% likely due to mosaicism (Dufner-Almeida 2024 PMID:39596632;
    Man 2024 PMID:38540392).
  - Real-world everolimus outcomes (Cockerell 2023 PMID:38042867):
    seizure reduction ≥50% in 31% (46% under 18 years), AML response 38% with
    stabilization in 59%, SEGA volume reductions of 43-71%, AEs in 95%.
  - QoL burden in TSC-related epilepsy: EQ-5D-3L TTO 0.705, VAS 0.577;
    unemployment 60% (Lappe 2024 PMID:38812055).
  - Diagnostic delay reduced at TSC clinics: 11.5 vs 19.0 months for epilepsy
    (Okanishi 2024 PMID:39617898).
  - SUDEP, brain tumours, and respiratory complications are the leading
    causes of TSC mortality (Conte 2024 PMID:39334956).
  - Foundation care guideline integrated (clinical care guidelines registry,
    issue #4878): 2012 International TSC Consensus Conference surveillance and
    management recommendations (Krueger & Northrup 2013, PMID:24053983),
    updated by the 2021 International TSC Consensus (Northrup et al. 2021,
    PMID:34399110) — together the source of the multisystem
    surveillance/screening treatment node. The 2021 revision adds earlier EEG
    screening, enhanced TAND surveillance, and new medication approvals.

  Falcon deep-research report audit (PR #7301,
  research/Tuberous_Sclerosis_1-deep-research-falcon.md, audited 2026-08-01).
  The report is correctly scoped: subject entity is TSC1-related tuberous
  sclerosis complex (MONDO:0008612, hgnc:12362), which is the TSC1 subtype of
  this entry's MONDO:0001734; no named-entity confusion. It cites 14 literature
  sources by DOI (no PMIDs) plus 6 NCT registrations. All 11 DOIs that resolve
  to PubMed resolved to real papers matching the report's author lists, and all
  6 NCT IDs matched the described trials on ClinicalTrials.gov. Two cited
  sources have no PubMed record and were not used: a bioRxiv single-cell tuber
  preprint (doi:10.1101/2024.10.31.621014, non-peer-reviewed) and a Rutgers
  doctoral dissertation the report mislabels as "ArXiv"
  (doi:10.7282/t3-9ahy-yx47).

  Claims rejected on verification:
  - "LAM occurs in 30-40% of adult females with TSC; spontaneous pneumothorax
    in up to 70% of LAM patients", attributed to Jansen 2020 (PMID:32982929).
    That paper is the TOSCA quality-of-life substudy and contains zero
    occurrences of "lymphangioleiomyomatosis" or "pneumothorax" (searched the
    full cached text 2026-08-01). Misattribution; claim dropped. Pneumothorax
    was consequently NOT added as a phenotype: it is absent from
    references_cache for ORPHA:805, PMID:38991206, PMID:39334956,
    PMID:20301399, PMID:33041968 and PMID:38042867 as well (same search date).
  - "TAND issues affect up to ~90% across TSC literature", attributed to Singh
    2023 (PMID:37041855). No such figure appears in that abstract.
  - "TSC1 cohort: cortical tubers 67.8%, subependymal nodules 51.6%"
    (Praticò 2025, PMID:40579409). The paper says 67.8% had MORE THAN 5 tubers
    and 51.6% MORE THAN 5 subependymal nodules — a lesion-burden threshold, not
    a presence rate. Not used as a frequency.
  - Numerous quantitative claims sourced to full-text page ranges of the 2021
    consensus (Northrup, PMID:34399110) — "63-78% of infants", "11 major and 7
    minor features", "25-30% of AMLs are fat-poor", the surveillance interval
    table. The cached record for PMID:34399110 is abstract-only, so none are

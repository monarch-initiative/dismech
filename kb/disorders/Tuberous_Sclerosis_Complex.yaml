    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To evaluate for LAM, females 18 years or older should have baseline pulmonary function testing, 6-minute walk test, and high-resolution chest computed tomography (HRCT)."
    explanation: >
      Consensus baseline pulmonary evaluation for lymphangioleiomyomatosis risk

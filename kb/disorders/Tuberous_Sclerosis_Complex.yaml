  phenotype_term:
    preferred_term: Retinal hamartoma
    term:
      id: HP:0009594
      label: Retinal hamartoma
  notes: >
    Genotype-phenotype cohorts find retinal hamartomas very rare or absent in
    sporadic TSC1-related disease; this phenotype is disproportionately
    TSC2-driven.
  evidence:
  - reference: PMID:11112665
    reference_title: "Mutational analysis in a cohort of 224 tuberous sclerosis patients indicates increased severity of TSC2, compared with TSC1, disease in multiple organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sporadic patients with TSC1 mutations had, on average, milder disease in comparison with patients with TSC2 mutations, despite being of similar age. They had a lower frequency of seizures and moderate-to-severe mental retardation, fewer subependymal nodules and cortical tubers, less-severe kidney involvement, no retinal hamartomas, and less-severe facial angiofibroma."
    explanation: >
      Directly reports that sporadic TSC1 patients had no retinal
      hamartomas, in contrast to TSC2 patients.
- category: Renal
  name: Renal Angiomyolipoma
  frequency: VERY_FREQUENT
  description: >
    Renal angiomyolipomas occur in approximately 80% of TSC patients and are
    benign tumours composed of dysplastic vascular, smooth-muscle-like, and
    adipocytic components. They are a major cause of morbidity due to risk of
    haemorrhage in lesions >4 cm. Lesion shrinkage with mTOR inhibitor therapy
    is well established.
  phenotype_term:
    preferred_term: Renal angiomyolipoma
    term:
      id: HP:0006772
      label: Renal angiomyolipoma
  evidence:

- name: TSC2
  gene_term:
    preferred_term: TSC2
    term:
      id: hgnc:12363
      label: TSC2
  association: Pathogenic Mutations
  presence: Positive
  notes: >
    TSC2 on chromosome 16p13.3 encodes tuberin. Loss-of-function variants
    account for ~70-83% of molecularly solved TSC cases. TSC2 mutations are
    generally associated with more severe disease, with critical-domain
    variants correlating with the highest disease severity. Within TSC2 itself,
    variant class and location further stratify severity: protein-truncating
    variants and variants in the hamartin (TSC1)-interaction domain are
    associated with lower intellectual outcomes, whereas TSC2 missense variants
    and small in-frame deletions are associated with higher IQ/DQ.
  case_fractions:
  - population: Molecularly solved TSC cohort (Molecular and Functional Assessment study)

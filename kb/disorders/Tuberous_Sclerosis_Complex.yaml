    snippet: "kidneys (benign renal angiomyolipomas, epithelial cysts, oncocytoma, renal cell carcinoma)"
    explanation: >
      GeneReviews lists oncocytoma among the kidney manifestations of TSC
      alongside angiomyolipomas, epithelial cysts, and renal cell carcinoma.
- category: Renal
  name: Chronic Kidney Disease
  frequency: FREQUENT
  description: >
    Progressive loss of kidney function is a major long-term complication of
    TSC, arising from cumulative parenchymal replacement by angiomyolipomas
    and cysts, from haemorrhage, and from the cumulative nephron loss of
    repeated embolisation or nephrectomy. It is the reason the consensus
    surveillance schedule pairs abdominal imaging with at least annual blood
    pressure and renal-function measurement, and the reason nephron-sparing
    management is preferred over nephrectomy.
  phenotype_term:
    preferred_term: Chronic kidney disease
    term:
      id: HP:0012622
      label: Chronic kidney disease
    clinical_course: PROGRESSIVE
  evidence:

  phenotype_term:
    preferred_term: Shagreen patch
    term:
      id: HP:0009721
      label: Shagreen patch
- category: Dermatologic
  name: Fibrous Cephalic Plaque
  diagnostic: true
  description: >
    Fibrous cephalic plaques (forehead fibrous plaques) are raised, firm

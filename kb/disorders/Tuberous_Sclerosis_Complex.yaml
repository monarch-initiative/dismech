  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Tuberous Sclerosis Complex"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001004586
  title: Cerebral organoid model reveals excessive proliferation of human caudal late interneuron progenitors in Tuberous Sclerosis Complex
  description: Although the intricate and prolonged development of the human brain critically distinguishes it from other mammals, our current understanding of neurodevelopmental diseases is largely based on work using animal models. Recent studies revealed that neural progenitors in the human brain are profoundly different from those found in rodent animal models. Moreover, post-mortem studies revealed extensive migration of interneurons into the late-gestational and post-natal human prefrontal cortex that does not occur in rodents.

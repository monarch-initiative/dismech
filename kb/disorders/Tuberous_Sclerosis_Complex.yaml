- accession: massive:MSV000088551
  title: Pilot Study Evaluating Everolimus Molecular Mechanisms in Tuberous Sclerosis Complex (TSC) and Focal Cortical Dysplasia (FCD)
  description: Treatment resistant epilepsy in tuberous sclerosis complex (TSC) and some focal cortical dysplasias (FCDs) are associated with dysfunctional mammalian target of rapamycin (mTOR) signaling. This can upregulate cell growth and proliferation, with increased downstream ribosomal S6 protein phosphorylation (phospho-S6). mTOR inhibitors are used in TSC, the archetypal mTORopathy, to reduce tumor growth or seizure frequency. Preclinical studies in FCD support a potential role in suppressing seizures.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Tuberous Sclerosis Complex"). Retrieved 2026-08-02.
- accession: dbgap:phs001357
  title: The Genomic Landscape of Tuberous Sclerosis Complex (TSC)
  description:  In this study, we characterized the genomic landscape of tuberous sclerosis complex (TSC), a rare genetic disease causing multisystem growth of benign tumors and other hamartomatous lesions. We analyzed 127 human tissues, including 111 TSC-associated samples and 16 non-TSC negative controls, using multiple genomic platforms including whole exome sequencing, targeted sequencing of known disease-causative loci ( TSC1  and  TSC2 ), mRNA sequencing, high-density SNP arrays, and DNA methylation arrays.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Tuberous Sclerosis Complex"). Retrieved 2026-08-02.

genetic:
- name: TSC1
  gene_term:
    preferred_term: TSC1
    term:
      id: hgnc:12362
      label: TSC1
  association: Pathogenic Mutations
  presence: Positive
  notes: >
    TSC1 on chromosome 9q34 encodes hamartin. Loss-of-function variants account
    for ~15-20% of molecularly solved TSC cases across independent cohorts.
    Pathogenic alterations are predominantly protein-truncating (nonsense,
    frameshift, splice-site, or large intragenic deletion/duplication);
    missense variants are comparatively rare in TSC1, in contrast to TSC2
    where they cluster in functional domains. TSC1-related disease is on
    average milder than TSC2-related disease and is significantly enriched
    in familial (versus sporadic) TSC.
  case_fractions:
  - population: US/Poland TSC cohort (Dabora et al. 2001)
    case_fraction_percent: 15.1
    cohort_size: 186
    notes: >-
      28 of 186 mutation-positive index patients (out of 224 screened) had
      small TSC1 mutations.
    evidence:
    - reference: PMID:11112665
      reference_title: "Mutational analysis in a cohort of 224 tuberous sclerosis patients indicates increased severity of TSC2, compared with TSC1, disease in multiple organs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations were identified in 186 (83%) of 224 of cases, comprising 138 small TSC2 mutations, 20 large TSC2 mutations, and 28 small TSC1 mutations."
      explanation: Source cohort counts for the TSC1 case-fraction estimate.
  - population: UK/Cardiff TSC cohort (Jones et al. 1999)
    case_fraction_percent: 18.3
    cohort_size: 120
    notes: >-
      22 of 120 mutation-positive patients (out of 150 screened families) had
      TSC1 mutations.
    evidence:
    - reference: PMID:10205261
      reference_title: "Comprehensive mutation analysis of TSC1 and TSC2-and phenotypic correlations in 150 families with tuberous sclerosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations were characterized in 120 (80%) of the 150 cases, affecting TSC1 in 22 cases and TSC2 in 98 cases."
      explanation: Source cohort counts for the TSC1 case-fraction estimate.
  - population: Molecularly solved TSC cohort (Dufner-Almeida et al. 2024)
    case_fraction_percent: 17.0
    cohort_size: 106
    notes: 18 of 106 molecularly solved cases carried a TSC1 pathogenic variant.
    evidence:
    - reference: PMID:39596632
      reference_title: "Molecular and Functional Assessment of TSC1 and TSC2 in Individuals with Tuberous Sclerosis Complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pathogenic DNA alterations were identified in 106 cases (91%); 18 (17%) in TSC1 and 88 (83%) in TSC2."
      explanation: Quantifies the TSC1 share of pathogenic variants among molecularly solved cases.
  - population: TOSCA international registry, molecularly tested patients (n=902)

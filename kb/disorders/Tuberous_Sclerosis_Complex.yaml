- name: Multisystem Surveillance and Screening (2012 International TSC Consensus, updated 2021)
  description: >
    Lifelong, age-appropriate multisystem surveillance and screening per the
    evidence-based recommendations of the International TSC Consensus Group,
    first issued by the 2012 Consensus Conference (Krueger & Northrup 2013) and
    revised by the 2021 update (Northrup et al. 2021), which is the current
    authoritative standard. Core elements include serial brain MRI for
    subependymal giant cell astrocytoma, annual renal function and
    blood-pressure assessment with periodic renal MRI for angiomyolipomata,
    at-least-annual TAND (TSC-associated neuropsychiatric disorders) screening,
    an annual skin survey, periodic echocardiography and ECG until cardiac
    rhabdomyoma regression, and HRCT plus pulmonary function testing for
    lymphangioleiomyomatosis risk in females from age 18. The 2021 revision
    largely retained the 2013 schedules while adding increased emphasis on
    early screening for electroencephalographic abnormalities, enhanced TAND
    surveillance and management, and new medication approvals. Because the
    dominant pathology shifts across the lifespan, coordinated multidisciplinary
    surveillance enables early detection and treatment of complications, the
    factor most associated with optimal outcome.
  treatment_term:
    preferred_term: multisystem disease surveillance and screening
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Subependymal giant-cell astrocytoma
    term:
      id: HP:0009718
      label: Subependymal giant-cell astrocytoma
  - preferred_term: Renal angiomyolipoma
    term:
      id: HP:0006772
      label: Renal angiomyolipoma

    notes: >
      Denominator is patients who underwent molecular testing (902 of 2,093
      enrolled), not molecularly solved cases; the TSC1 19.7% + TSC2 63.3%
      shares leave the remainder as no-mutation-identified.
    evidence:
    - reference: PMID:28057044
      reference_title: "TuberOus SClerosis registry to increase disease Awareness (TOSCA) - baseline data on 2093 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TSC1 mutations were identified in 19.7% of the patients and TSC2 in 63.3%"
      explanation: Quantifies the TSC1 share among molecularly tested patients in the 2,093-patient international TOSCA registry.
  - population: Danish TSC cohort (Rosengren et al. 2020)
    case_fraction_percent: 25.0
    cohort_size: 168
    notes: >-
      42 of 168 individuals with a predicted pathogenic or likely pathogenic
      variant carried a TSC1 variant (33 distinct TSC1 variants), out of 327
      individuals screened for suspected TSC.
    evidence:
    - reference: PMID:32555378
      reference_title: "Mutational analysis of TSC1 and TSC2 in Danish patients with tuberous sclerosis complex."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A total of 137 predicted pathogenic or likely pathogenic variants were identified: 33 different TSC1 variants in 42 patients, and 104 different TSC2 variants in 126 patients."
      explanation: Source cohort counts for the TSC1 case-fraction estimate.
  - population: Sicilian TSC cohort (Praticò et al. 2025)
    case_fraction_percent: 38.3
    cohort_size: 81
    notes: >-
      31 of 81 genotyped Sicilian patients carried a pathogenic TSC1 variant.
      This is a marked regional outlier - well above the 15-25% TSC1 share
      seen in the US/UK/Brazilian/Danish cohorts and the TOSCA registry - and

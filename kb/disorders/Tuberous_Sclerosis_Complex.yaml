experimental_models:
- name: TSC patient-derived neurovascular unit (iPSC blood-brain-barrier chip)
  experimental_model_type: ORGAN_ON_CHIP
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: >-
    Patient-derived induced pluripotent stem cells carrying a heterozygous TSC2
    variant, differentiated to brain microvascular endothelial cells and
    astrocytes.
  culture_system: Microfluidic multi-compartment neurovascular-unit chip
  description: >-
    A human microphysiological blood-brain-barrier model assembled from
    TSC-patient iPSC-derived endothelium and astrocytes. It provides a
    human, lineage-resolvable readout of neurovascular dysfunction in TSC
    that neither rodent models nor two-dimensional culture supply, and it
    supports lineage-swap experiments (mutant endothelium with wild-type
    astrocytes) that separate cell-autonomous from non-cell-autonomous
    contributions to the barrier defect.
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  conditions:
  - TSC2 heterozygous mutant barrier
  - TSC2 mutant barrier with wild-type astrocytes
  - TSC2 mutant barrier treated with rapamycin
  modeled_mechanisms:
  - target: mTOR-Driven Gliopathy and Neurovascular Unit Dysfunction
    description: >-
      The chip reproduces the increased barrier permeability of the TSC
      neurovascular unit and shows it is reversible by astrocyte replacement
      or mTOR inhibition.
    evidence:
    - reference: PMID:38783199
      reference_title: "Rescue of impaired blood-brain barrier in tuberous sclerosis complex patient derived neurovascular unit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using microphysiological systems, we demonstrate that a BBB generated from TSC2 heterozygous mutant cells shows increased permeability. This can be rescued by wild type astrocytes or by treatment with rapamycin, an mTOR kinase inhibitor."
      explanation: >
        Directly demonstrates the modelled mechanism and its
        astrocyte-dependence and mTOR-dependence.
  evidence:
  - reference: PMID:38783199
    reference_title: "Rescue of impaired blood-brain barrier in tuberous sclerosis complex patient derived neurovascular unit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We generated TSC disease-specific cell models of the BBB by leveraging human induced pluripotent stem cell and microfluidic cell culture technologies."
    explanation: >
      Describes the construction of the model system - iPSC-derived cells in
      a microfluidic culture platform.
  notes: >-
    The published model uses TSC2 heterozygous patient cells. An equivalent
    TSC1-mutant neurovascular-unit model was not identified in this curation
    pass; the mechanism is expected to be shared because both proteins act
    through the same TSC complex, but that expectation is untested here.

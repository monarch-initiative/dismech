      label: tuberous sclerosis 2
  subtype_frequency: "~70-83% of molecularly solved cases"
  genes:
  - preferred_term: TSC2
    term:
      id: hgnc:12363
      label: TSC2
  description: >
    Pathogenic variants in TSC2 on chromosome 16p13.3 (encoding tuberin) account
    for ~70-83% of molecularly solved TSC cases. TSC2-related disease is
    typically more severe than TSC1-related disease, with earlier seizure onset,
    higher cortical tuber burden, and a higher risk of intellectual disability
    and renal angiomyolipomas. Variants in critical domains of the catalytic
    TSC2 subunit correlate with increased disease severity.
- name: TSC1
  display_name: TSC1-related TSC
  subtype_term:
    preferred_term: Tuberous sclerosis 1
    term:
      id: MONDO:0008612
      label: tuberous sclerosis 1
  subtype_frequency: "~15-20% of molecularly solved cases"
  description: >
    Pathogenic variants in TSC1 on chromosome 9q34 (encoding hamartin) account
    for ~15-20% of molecularly solved TSC cases across independent
    genotype-phenotype cohorts. TSC1-related disease is on average milder than
    TSC2-related disease: sporadic TSC1 patients have a lower frequency of
    seizures and moderate-to-severe intellectual disability, fewer
    subependymal nodules and cortical tubers, less-severe kidney involvement,
    and less-severe facial angiofibroma than TSC2 patients. Grade 2-4 renal
    cysts/angiomyolipomas, forehead (fibrous cephalic) plaques, and retinal
    hamartomas are very rare or not seen at all in isolated TSC1 disease.
    TSC1 pathogenic variants are almost uniformly predicted truncating
    (nonsense, frameshift, splice-site, or large deletion), in contrast to
    TSC2's broader spectrum that also includes missense variants clustered in
    functional domains, and are significantly enriched in familial versus
    sporadic TSC — consistent with a milder phenotype compatible with
    reproduction, and the main reason TSC1 accounts for a disproportionate
    share of familial (vs. de novo) TSC cases.
  genes:
  - preferred_term: TSC1
    term:
      id: hgnc:12362
      label: TSC1
  evidence:
  - reference: PMID:11112665
    reference_title: "Mutational analysis in a cohort of 224 tuberous sclerosis patients indicates increased severity of TSC2, compared with TSC1, disease in multiple organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sporadic patients with TSC1 mutations had, on average, milder disease in comparison with patients with TSC2 mutations, despite being of similar age. They had a lower frequency of seizures and moderate-to-severe mental retardation, fewer subependymal nodules and cortical tubers, less-severe kidney involvement, no retinal hamartomas, and less-severe facial angiofibroma."
    explanation: >
      Landmark 224-patient genotype-phenotype cohort establishing that
      sporadic TSC1 disease is milder than TSC2 disease across seizures,
      intellectual disability, brain lesion burden, kidney involvement,
      retinal hamartoma, and facial angiofibroma severity.
  - reference: PMID:11112665
    reference_title: "Mutational analysis in a cohort of 224 tuberous sclerosis patients indicates increased severity of TSC2, compared with TSC1, disease in multiple organs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "some features (grade 2-4 kidney cysts or angiomyolipomas, forehead plaques, retinal hamartomas, and liver angiomyolipomas) were very rare or not seen at all in TSC1 patients"
    explanation: >
      Identifies specific phenotypes that are very rare or absent in
      TSC1-related disease, distinguishing it from TSC2-related disease.
  - reference: PMID:10205261
    reference_title: "Comprehensive mutation analysis of TSC1 and TSC2-and phenotypic correlations in 150 families with tuberous sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSC1 mutations were significantly underrepresented in sporadic cases (P=. 000185)."
    explanation: >
      Establishes that TSC1 variants are significantly enriched in familial
      (versus sporadic/de novo) TSC, a key genotype-driven feature
      distinguishing TSC1 from TSC2 disease.
  - reference: PMID:10205261
    reference_title: "Comprehensive mutation analysis of TSC1 and TSC2-and phenotypic correlations in 150 families with tuberous sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, all TSC1 mutations were predicted to be truncating, consistent with a structural or adapter role for the encoded protein."
    explanation: >
      Establishes that TSC1 pathogenic variants are almost uniformly
      truncating, distinct from TSC2's broader spectrum that also includes
      missense variants clustered in functional domains.
  - reference: PMID:10205261
    reference_title: "Comprehensive mutation analysis of TSC1 and TSC2-and phenotypic correlations in 150 families with tuberous sclerosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intellectual disability was significantly more frequent in TSC2 sporadic cases than in TSC1 sporadic cases (P=.0145)."
    explanation: >
      Independent cohort corroborating lower intellectual disability
      frequency in TSC1 versus TSC2 sporadic disease.
  - reference: PMID:33041968
    reference_title: "Renal Manifestations of Tuberous Sclerosis Complex: Key Findings From the Final Analysis of the TOSCA Study Focussing Mainly on Renal Angiomyolipomas."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings confirmed that renal angiomyolipomas in subjects with TSC1 mutations develop on average at the later age, are relatively smaller in size and less likely to be growing; however, by age 40 years, no difference was observed in the percentage of patients with TSC1 and TSC2 mutations needing intervention."
    explanation: >
      The 2,211-patient TOSCA international registry confirms the milder
      average renal course of TSC1 disease (later onset, smaller, less often
      growing angiomyolipomas) but explicitly qualifies it: by age 40 the
      proportion of patients requiring intervention is indistinguishable
      between TSC1 and TSC2. Classified PARTIAL because it supports the
      "milder on average" framing while refuting any inference that a TSC1
      genotype justifies relaxed lifelong renal surveillance.
  - reference: PMID:40579409
    reference_title: "Genetic screening of tuberous sclerosis complex in Sicily with a focus on neurological manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with pathogenic TSC2 variants tended to exhibit a higher frequency of weekly seizures, a higher prevalence of infantile spasms and hypsarrhythmia compared to those with pathogenic TSC1 variants, consistent with a more severe phenotype."
    explanation: >
      Independent 81-patient Sicilian cohort (31 TSC1, 50 TSC2) reproducing
      the milder TSC1 epilepsy phenotype on seizure frequency, infantile
      spasms, and hypsarrhythmia.
  - reference: PMID:40579409
    reference_title: "Genetic screening of tuberous sclerosis complex in Sicily with a focus on neurological manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cognitive and behavioral disorders were similarly distributed, although TSC1 patients had higher rates of normal or borderline cognitive function, while TSC2 patients had more severe neuropsychiatric profiles compared to TSC1."
    explanation: >
      Corroborates the higher rate of preserved cognition in TSC1 disease
      while noting that cognitive and behavioural disorders as a class are
      similarly distributed between the two genotypes.
  - reference: PMID:40579409
    reference_title: "Genetic screening of tuberous sclerosis complex in Sicily with a focus on neurological manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, TSC1 patients exhibited a higher incidence of radial bands, while TSC2 patients harbored a larger average size of tubers and subependymal nodules."
    explanation: >
      Identifies a brain-imaging feature that runs counter to the general
      TSC1-is-milder gradient: radial migration bands were MORE frequent in
      TSC1, whereas the TSC2 advantage in lesion burden is one of tuber and
      subependymal nodule size rather than of every structural feature.
- name: TSC2-PKD1 Contiguous Deletion
  display_name: TSC2/PKD1 contiguous deletion syndrome
  description: >
    A contiguous deletion of TSC2 and the adjacent PKD1 gene on chromosome
    16p13.3 produces TSC plus severe, early-onset polycystic kidney disease.
    Affected individuals develop multiple bilateral renal cysts in infancy and
    progress to kidney failure earlier than typical TSC.
- name: No Mutation Identified
  display_name: NMI (no mutation identified)
  description: >
    Approximately 10-15% of clinically definite TSC cases have no germline
    pathogenic variant detected by conventional sequencing, frequently due to
    low-level somatic mosaicism or non-coding variants. NMI patients may have
    milder phenotypes.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >
    TSC is inherited in an autosomal dominant manner, with heterozygous
    pathogenic variants in either TSC1 or TSC2. About one third of affected
    individuals have an affected parent; the remaining two thirds result from
    a de novo pathogenic variant, and each child of an affected individual has
    a 50% chance of inheriting the variant. Penetrance is essentially complete
    but expressivity is highly variable, so clinical severity differs markedly
    even within a family carrying the same variant. Low-level somatic
    mosaicism accounts for a substantial share of cases in which no germline
    variant is identified.
  evidence:
  - reference: PMID:20301399
    reference_title: "Tuberous Sclerosis Complex. GeneReviews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSC is inherited in an autosomal dominant manner. About one third of individuals diagnosed with TSC have an affected parent; two thirds of individuals with TSC have the disorder as the result of a de novo pathogenic variant. Each child of an individual with TSC has a 50% chance of inheriting the TSC-related pathogenic variant."
    explanation: >
      GeneReviews establishes the autosomal dominant mode of inheritance, the
      one-third inherited / two-thirds de novo split, and the 50% recurrence
      risk to offspring.
  - reference: PMID:41361250
    reference_title: "Cardiac rhabdomyomas in tuberous sclerosis complex: clinical manifestations and genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Penetrance is nearly complete, but symptoms can differ significantly within families"
    explanation: Supports essentially complete penetrance alongside highly variable expressivity within families.
diagnosis:
- name: Molecular Genetic Testing for TSC1/TSC2
  description: >
    The molecular diagnosis is established by identifying a heterozygous
    pathogenic variant in TSC1 or TSC2. Because TSC2 accounts for the large
    majority of molecularly solved cases, a positive result most often
    identifies the TSC2 (tuberous sclerosis 2) subtype. Molecular testing
    complements, rather than replaces, the clinical diagnostic criteria: a
    clinical diagnosis can be established from two major features, or one
    major plus two or more minor features, and 10-15% of clinically definite
    cases have no variant identified on conventional sequencing, often
    reflecting low-level somatic mosaicism.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20301399
    reference_title: "Tuberous Sclerosis Complex. GeneReviews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis can be established in a proband with a heterozygous pathogenic variant in TSC1 or TSC2 identified by molecular genetic testing."
    explanation: >
      GeneReviews defines molecular genetic testing of TSC1/TSC2 as the basis
      of the molecular diagnosis of TSC.
  - reference: PMID:20301399
    reference_title: "Tuberous Sclerosis Complex. GeneReviews."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical diagnosis of TSC can be established in a proband based on clinical diagnostic criteria"
    explanation: >
      Confirms that a clinical diagnosis is established independently of
      molecular testing, supporting the complementary framing above.

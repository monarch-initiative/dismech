    reference_title: "Cardiac rhabdomyomas in tuberous sclerosis complex: clinical manifestations and genotype correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TSC2 mutations were associated with a higher rate (42.9%) and velocity (18.7% per year) of tumor regression compared to TSC1 mutations (25% and 12.4% per year, respectively)."
    explanation: >
      A 22-patient single-center cohort with confirmed cardiac rhabdomyomas
      found TSC2-mutant patients regressed their tumors both more often and
      faster than TSC1-mutant patients, an unusual instance where the TSC2
      genotype tracks with a more favorable course for this specific lesion
      (contrasting with the generally more severe TSC2 phenotype overall). The
      authors describe this as a trend requiring confirmation in larger
      prospective studies, not an established correlation.

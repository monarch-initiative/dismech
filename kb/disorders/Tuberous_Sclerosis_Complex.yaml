  - reference: PMID:34399110
    reference_title: "Updated International Tuberous Sclerosis Complex Diagnostic Criteria and Surveillance and Management Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in knowledge and approvals of new therapies necessitated a revision of those criteria and recommendations."
    explanation: >
      The 2021 International TSC Consensus update revises and supersedes the 2013

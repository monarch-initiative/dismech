genetic:
  - name: PIK3CA
    gene_term:
      preferred_term: PIK3CA
      term:
        id: hgnc:8975
        label: PIK3CA
    relationship_type: CAUSATIVE
    association: >-
      Somatic gain-of-function variants in PIK3CA, present in brain and absent
      from blood, are among the commonest identified causes. A recurrent
      c.1633G>A change was found independently in four patients, which is the
      pattern expected of an activating hotspot.
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A recurrent PIK3CA c.1633G>A mutation was found in four separate cases.
        explanation: >-
          Documents the recurrent activating variant in unrelated patients.
  - name: AKT3
    gene_term:
      preferred_term: AKT3
      term:
        id: hgnc:393
        label: AKT3
    relationship_type: CAUSATIVE
    association: >-
      Somatic activating variants in AKT3, the brain-enriched AKT isoform, are one
      of the three genes identified in the original brain-blood paired sequencing
      study and remain a recognized cause.
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          identified de novo somatic mutations in 30% of affected individuals in
          the PIK3CA, AKT3 and MTOR genes
        explanation: >-
          Names AKT3 among the causative genes and quantifies the overall
          diagnostic yield.
  - name: MTOR
    gene_term:
      preferred_term: MTOR
      term:
        id: hgnc:3942
        label: MTOR
    relationship_type: CAUSATIVE
    association: >-
      Somatic activating variants in MTOR itself cause the disease, which is the
      cleanest demonstration that the pathway rather than any particular upstream
      component is what matters.
    evidence:
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The spectrum of cortical dysplasia results from somatic brain mutations
          in the mTOR pathway activators AKT3, MTOR, PIK3CA, and RHEB and from
          germline and somatic mutations in mTOR pathway repressors, DEPDC5, NPRL2,
          NPRL3, TSC1 and TSC2.
        explanation: >-
          Names MTOR among the somatic activators causing this malformation
          spectrum.
  - name: RHEB and AKT1
    gene_term:
      preferred_term: RHEB
      term:
        id: hgnc:10011
        label: RHEB
    relationship_type: CAUSATIVE
    association: >-
      Two further pathway activators confirmed in this disease beyond the three
      found in the founding study. RHEB is the small GTPase that activates mTOR
      complex 1 directly, so an activating variant in it is about as proximal to
      the pathway output as a variant can be.
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          activating variants in positive regulators of the mTOR pathway in FCD and
          HME, including variants in AKT1, AKT3, MTOR, PIK3CA, and RHEB
        explanation: >-
          Names RHEB and AKT1 alongside the three genes already curated, and does
          so for hemimegalencephaly specifically rather than for the spectrum in
          general.
  - name: mTOR pathway repressors
    gene_term:
      preferred_term: DEPDC5
      term:
        id: hgnc:18423
        label: DEPDC5
    relationship_type: CAUSATIVE
    association: >-
      Loss-of-function variants in the negative regulators DEPDC5, NPRL2, NPRL3,
      PTEN, TSC1, and TSC2 are confirmed causes of hemimegalencephaly, sometimes
      through a two-hit combination of a germline variant and a somatic mosaic
      second hit in brain. DEPDC5 is named as the representative because it is a
      GATOR1 component and therefore repressor loss in the amino-acid-sensing arm
      rather than in the growth-factor arm, which may not behave identically.
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Studies have also confirmed loss-of-function variants in negative
          regulators of the mTOR pathway in FCD and HME, including in DEPDC5,
          NPRL2, NPRL3, PTEN, TSC1, and TSC2
        explanation: >-
          Enumerates the repressor genes confirmed in this disease, which is what
          this record curates.
prevalence:
  - population: Children undergoing epilepsy surgery
    measure_type: UNKNOWN
    prevalence_class: ULTRA_RARE
    notes: >-
      No population-based prevalence estimate exists. The disease is described as
      rare in the surgical literature, and the largest available synthesis pooled
      145 operated patients from 26 studies, which indicates the order of
      magnitude of the published experience rather than a rate.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Data from 145 patients were extracted from 26 studies
        explanation: >-
          Indicates the scale of the pooled published surgical experience. Marked
          PARTIAL because a case count in operated patients is not a population
          rate.
progression:
  - phase: Neonatal presentation with intractable seizures
    age_range: First months of life
    notes: >-
      The malformation is present at birth and seizures usually begin within the
      first months, frequently as infantile spasms. Antiseizure medication rarely
      controls them, and the question becomes surgical early rather than after
      years of trials.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Definitive treatment for HME-related DRE is hemispheric surgery through
          either anatomic (AH) or functional hemispherectomy (FH).
        explanation: >-
          Establishes that surgery rather than medication is the definitive
          treatment, which is what drives the early surgical timeline.
  - phase: Post-surgical seizure freedom in most, recurrence in a minority
    age_range: Months to years after surgery
    notes: >-
      Roughly four in five operated children reach seizure freedom, and the two
      surgical approaches perform comparably. The strongest predictor of
      recurrence is not which operation was done but whether the
      electroencephalogram showed bilateral ictal abnormality beforehand, which
      points to the supposedly normal hemisphere being involved.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          presence of bilateral ictal electroencephalography abnormalities (hazard
          ratio = 11.5; P = .002) was significantly associated with faster
          time-to-seizure recurrence
        explanation: >-
          Quantifies the predictor of recurrence described in this phase and
          motivates the surgical discussion in this entry.
treatments:
  - name: Hemispherectomy
    description: >-
      Removing or disconnecting the affected hemisphere is the definitive
      treatment, and it is offered in infancy because that is when the remaining
      hemisphere can still take over language and motor function. The anatomic and
      functional variants achieve comparable seizure outcomes, so the choice turns
      on operative morbidity rather than efficacy. The trade is explicit and
      permanent: a fixed hemiparesis and hemianopia in exchange for stopping
      seizures that would otherwise continue to damage the developing brain.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: hemispherectomy
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Intrinsically Epileptogenic Dysplastic Cortex
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Definitive treatment for HME-related DRE is hemispheric surgery through
          either anatomic (AH) or functional hemispherectomy (FH).
        explanation: >-
          States that hemispheric surgery is the definitive treatment.
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cohorts were similar in preoperative characteristics and at the last
          follow-up; 77% (n = 66) of the FH cohort and 81%
        explanation: >-
          Documents the comparable seizure outcomes between the two surgical
          approaches, which is why the choice is made on morbidity rather than
          efficacy.
  - name: Antiseizure medication
    description: >-
      Medication is started first but rarely controls the seizures, and its role is
      to hold the line while surgical assessment proceeds rather than to be the
      definitive answer.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Drug-Resistant Epilepsy of Infantile Onset
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Initial treatment with antiseizure medications is empiric, and
          consideration of surgery is the standard of care for eligible patients
          with medically refractory epilepsy.
        explanation: >-
          States both the empiric first-line role of medication and the escalation
          to surgery that defines its limits in this disease.
  - name: mTOR inhibition
    description: >-
      Directly inhibiting the overactive pathway is the obvious precision therapy,
      and it is already approved for refractory seizures in tuberous sclerosis,
      which reaches the same pathway state by losing a repressor. Whether it works
      in hemimegalencephaly is not yet established: clinical study here is
      described as just emerging. It is curated as a rational but unproven option
      rather than as practice, and the gap is recorded in the discussions block.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: everolimus
          term:
            id: CHEBI:68478
            label: everolimus
    target_mechanisms:
      - target: Constitutive mTOR Pathway Activation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Based on extensive pre-clinical and clinical data, the mTOR inhibitor
          everolimus is currently approved for the treatment of focal refractory
          seizures in patients with TSC.
        explanation: >-
          Establishes that pathway inhibition works for seizures in the
          repressor-loss member of this spectrum, which is the entire rationale for
          trying it here.
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Although clinical studies are just emerging for FCD and HME, we believe
          the next decade will bring significant advancements in precision
          therapies for epilepsy related to these and other MCDs.
        explanation: >-
          States plainly that the evidence in this disease does not yet exist,
          which is why this record is PARTIAL and framed as rational rather than
          established.
diagnosis:
  - name: Brain MRI
    description: >-
      Imaging makes the diagnosis. The enlarged hemisphere with thickened, poorly
      laminated cortex and blurred grey-white boundary is recognizable, and the
      abnormality stopping at the midline is what distinguishes it from a
      bilateral malformation.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Unihemispheric enlargement with cortical thickening, abnormal gyration, and
      loss of the normal grey-white junction, respecting the midline.
    evidence:
      - reference: PMID:26060899
        reference_title: Focal Cortical Dysplasia.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Most focal cortical dysplasias can be identified on neuroimaging and many
          require resective epilepsy surgery to cure refractory seizures.
        explanation: >-
          Establishes imaging identification for this malformation family, which is
          the basis of the diagnostic approach here.
  - name: Somatic variant testing on resected brain tissue
    description: >-
      Molecular diagnosis requires brain, not blood. Sequencing resected tissue
      finds a pathway variant in roughly a third of patients; a normal blood test
      excludes nothing, and even brain sequencing can miss a low-fraction variant
      in a small sample. This is the practical reason a molecular diagnosis is
      usually made after surgery rather than before it.
    diagnosis_term:
      preferred_term: Genetic Testing
      term:
        id: NCIT:C15709
        label: Genetic Testing
    results: >-
      A somatic activating variant in PIK3CA, AKT3, or MTOR in brain tissue at an
      allele fraction well below the germline expectation, absent from blood.
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Exome sequencing and mass spectrometry analysis in paired brain-blood
          samples from individuals with HME (n = 20 cases) identified de novo
          somatic mutations in 30% of affected individuals in the PIK3CA, AKT3 and
          MTOR genes.
        explanation: >-
          Documents both the paired brain-blood method and the diagnostic yield
          reported in the results field.
  - name: Electroencephalography including assessment of the contralateral hemisphere
    description: >-
      Beyond confirming the epilepsy, the electroencephalogram carries specific
      surgical prognostic weight: bilateral ictal abnormality predicts faster
      seizure recurrence after hemispherectomy by a large margin, which is
      information a family needs before consenting to the operation.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Epileptiform abnormality over the malformed hemisphere, with the presence or
      absence of independent contralateral ictal activity as the prognostically
      decisive finding.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          presence of bilateral ictal electroencephalography abnormalities (hazard
          ratio = 11.5; P = .002) was significantly associated with faster
          time-to-seizure recurrence
        explanation: >-
          Quantifies the prognostic value that makes this test decision-relevant
          rather than merely confirmatory.
differential_diagnoses:
  - name: Focal Cortical Dysplasia Type II
    disease_term:
      preferred_term: isolated focal cortical dysplasia type II
      term:
        id: MONDO:0011818
        label: isolated focal cortical dysplasia type II
    description: >-
      The same disease mechanism at a smaller scale: a somatic mTOR-pathway
      variant in a smaller or later clone, producing a focal rather than
      hemispheric malformation. The distinction is one of extent, which is
      precisely why it is a differential and not an unrelated condition.
    distinguishing_features:
      - Focal lesion amenable to targeted resection rather than hemispheric surgery.
      - No hemispheric enlargement and no macrocephaly.
      - Seizure onset often later than infancy, and hemiparesis is not expected.
    evidence:
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The 'mTORopathies' comprise a spectrum of cortical malformations that
          range from whole brain (megalencephaly) and hemispheric
          (hemimegalencephaly) abnormalities to focal abnormalities, such as focal
          cortical dysplasia type II (FCDII), which manifest with drug-resistant
          epilepsies.
        explanation: >-
          States the spectrum relationship explicitly, placing the two at different
          points on one axis of extent.
  - name: Tuberous Sclerosis Complex
    disease_term:
      preferred_term: tuberous sclerosis
      term:
        id: MONDO:0001734
        label: tuberous sclerosis
    description: >-
      Reaches the same pathway state by losing an mTOR repressor, and is the
      member of the spectrum in which pathway-directed therapy is already proven.
      The distinction is not that repressor loss is out of scope for
      hemimegalencephaly, since TSC1 and TSC2 loss of function is confirmed in
      hemimegalencephaly itself and is modeled as its own node in this entry. The
      distinction is anatomical and one of genetic architecture: germline loss
      present in every cell, producing bilateral multifocal tubers, versus a
      mosaic or two-hit lesion confined to one hemisphere.
    distinguishing_features:
      - Germline TSC1 or TSC2 variants present in every cell and detectable in blood.
      - Bilateral and multifocal cortical tubers rather than one enlarged hemisphere.
      - Systemic features including skin, renal, and cardiac lesions.
    evidence:
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The spectrum of cortical dysplasia results from somatic brain mutations
          in the mTOR pathway activators AKT3, MTOR, PIK3CA, and RHEB and from
          germline and somatic mutations in mTOR pathway repressors, DEPDC5, NPRL2,
          NPRL3, TSC1 and TSC2.
        explanation: >-
          Names the repressor-loss route that distinguishes tuberous sclerosis from
          the activator-gain route of hemimegalencephaly.
discussions:
  - discussion_id: hme_missing_causal_variants
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      A causal variant is found in only about a third of hemimegalencephaly
      brains. Where are the other two thirds, and is the shortfall a detection
      problem or a biology problem?
    attaches_to:
      - pathophysiology#Postzygotic Somatic Variant in the PI3K-AKT3-mTOR Pathway
      - pathophysiology#Mosaic Variant Gradient Within the Affected Hemisphere
    rationale: >-
      The founding study sequenced paired brain and blood and found a pathway
      variant in 30 percent of cases. That was a triumph at the time and it is
      still a majority unexplained. Two very different explanations are available
      and they have different consequences. The detection account notes that the
      variants that were found sat at allele fractions as low as eight percent, and
      that a resected fragment samples only part of a hemisphere; a clone that
      arose slightly later, or one whose densest region was not the piece sent for
      sequencing, would be invisible to bulk exome sequencing at standard depth. On
      this view the missing variants are in the same genes, and deeper or
      single-cell sequencing of multiple regions should find them. The biology
      account holds that some hemimegalencephaly is caused by something other than
      a point variant in these three genes: a variant in a different pathway
      member, a structural or copy-number event, or a non-genetic developmental
      insult producing the same endpoint. The two are distinguishable and the
      answer matters directly for the therapy question curated separately in this
      entry, because a pathway-directed drug can only help patients whose disease
      actually runs through that pathway.
    proposed_experiments:
      - experiment_id: exp_hme_deep_multiregion_sequencing
        name: Deep multi-region and single-cell sequencing of variant-negative brains
        description: >-
          Take hemispherectomy specimens from patients in whom standard exome
          sequencing found nothing, sample multiple anatomically defined regions
          including the most dysplastic tissue, and apply high-depth targeted
          sequencing of known pathway genes plus single-nucleus genome sequencing,
          with S6 phosphorylation immunostaining on adjacent sections as an
          orthogonal readout of whether the pathway is active.
        decision_criterion: >-
          Recovering pathway variants at low allele fraction in a substantial share
          of previously negative cases would identify the shortfall as a detection
          problem and would extend candidacy for pathway-directed therapy. Finding
          no variant in tissue that nonetheless shows strong S6 phosphorylation
          would point to a different route into the same pathway state; finding
          neither would suggest a genuinely different mechanism.
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Exome sequencing and mass spectrometry analysis in paired brain-blood
          samples from individuals with HME (n = 20 cases) identified de novo
          somatic mutations in 30% of affected individuals in the PIK3CA, AKT3 and
          MTOR genes.
        explanation: >-
          Establishes the 30 percent yield that defines the size of this gap.
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Identified mutations were present in 8-40% of sequenced alleles in
          various brain regions
        explanation: >-
          The low allele fractions that make the detection account plausible, and
          the between-region variation that makes sampling a real concern.
  - discussion_id: hme_why_does_hemispherectomy_fail
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      When seizures recur after an entire hemisphere has been disconnected, is the
      cause incomplete disconnection, or is the supposedly normal hemisphere
      independently abnormal, and does mosaicism predict which?
    attaches_to:
      - pathophysiology#Unihemispheric Overgrowth and Cortical Dyslamination
      - pathophysiology#Intrinsically Epileptogenic Dysplastic Cortex
    rationale: >-
      Roughly one operated child in five is not seizure-free, and the puzzle is
      sharp: if the seizure generator was the malformed hemisphere and that
      hemisphere is gone or disconnected, seizures should stop. The strongest clue
      is that bilateral ictal abnormality before surgery predicts faster recurrence
      by a hazard ratio above eleven, while the choice between anatomic and
      functional hemispherectomy predicts very little. That pattern favours the
      second reading, that the contralateral hemisphere is not truly normal. It
      sits comfortably with the mosaic model, since a variant-bearing clone that
      arose before the hemispheres separated could seed both sides, with the
      minority side too sparsely affected to look abnormal on imaging. The
      competing reading, incomplete disconnection, is not dead: functional
      hemispherectomy leaves tissue in place and depends on the completeness of the
      disconnection, and residual connections are a documented cause of failure in
      hemispheric surgery generally. What would separate them is a molecular
      question rather than a surgical one, and it has not been asked: nobody has
      systematically looked for the variant in the contralateral hemisphere. If the
      contralateral side carries it, bilateral electroencephalographic abnormality
      becomes a marker of clone distribution rather than a mysterious risk factor,
      and preoperative counselling gains a mechanism.
    proposed_experiments:
      - experiment_id: exp_hme_contralateral_variant_detection
        name: Variant detection in the contralateral hemisphere
        description: >-
          In patients undergoing hemispherectomy, seek the causal variant in
          contralateral tissue by the least invasive available route, including
          cerebrospinal fluid cell-free DNA and any contralateral tissue obtained
          for other reasons, and relate detection to preoperative bilateral
          electroencephalographic abnormality and to postoperative seizure outcome.
        decision_criterion: >-
          Detection of the variant contralaterally in patients with bilateral
          electroencephalographic abnormality and postoperative recurrence would
          establish the clone-distribution account and make cerebrospinal fluid
          testing a preoperative prognostic tool. Absence of contralateral variant
          in recurrent cases would shift the explanation back to incomplete
          disconnection and toward surgical technique. One design caution: the
          sensitivity of cerebrospinal fluid cell-free DNA for detecting these
          variants is currently poor, so a negative result would need to be
          interpreted against a measured detection floor rather than taken at face
          value, and the study is only informative if it establishes that floor
          first.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          presence of bilateral ictal electroencephalography abnormalities (hazard
          ratio = 11.5; P = .002) was significantly associated with faster
          time-to-seizure recurrence
        explanation: >-
          The central observation of this controversy, and the reason the
          contralateral hemisphere is the leading suspect.
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cohorts were similar in preoperative characteristics and at the last
          follow-up; 77% (n = 66) of the FH cohort and 81%
        explanation: >-
          Shows that the two surgical approaches perform comparably, which weakens
          the incomplete-disconnection account relative to the contralateral one,
          since the approach that leaves tissue behind does not do noticeably worse.
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Identified mutations were present in 8-40% of sequenced alleles in
          various brain regions
        explanation: >-
          Supports the plausibility of a clone distributed unevenly across regions.
          Marked PARTIAL because the regions sampled were within the affected
          hemisphere, so this does not itself demonstrate contralateral spread.
  - discussion_id: hme_can_mtor_inhibition_replace_surgery
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      mTOR inhibition is approved for refractory seizures in tuberous sclerosis,
      which reaches the same pathway state by a different route. Can it control
      seizures in hemimegalencephaly, and if so does it delay or replace
      hemispherectomy, or merely postpone a surgery that should have happened
      sooner?
    attaches_to:
      - pathophysiology#Constitutive mTOR Pathway Activation
      - pathophysiology#Drug-Resistant Epilepsy of Infantile Onset
    rationale: >-
      The rationale is unusually clean for a precision therapy: the causal lesion
      activates a pathway, a licensed drug inhibits that pathway, and the drug
      already works for seizures in the disease at the other end of the same
      spectrum. Yet clinical study in hemimegalencephaly is described as only just
      emerging, and there are specific reasons it may not transfer. Tuberous
      sclerosis involves germline repressor loss in every cell, whereas here the
      lesion is a mosaic activating variant in a minority of cells, and it is not
      obvious that systemic inhibition reaches an adequate concentration in the
      right cells. More fundamentally, much of the pathology here is structural and
      already built: a hemisphere that developed with the wrong cytoarchitecture
      does not become normally laminated when the pathway is switched off in
      infancy. Inhibition might therefore reduce seizure burden without altering
      the epileptogenic substrate. That distinction is the crux, because the real
      risk is not that the drug fails but that partial benefit defers a
      hemispherectomy past the developmental window in which the remaining
      hemisphere can still take over language and motor function. A therapy that
      buys two years of milder seizures at the cost of a worse functional outcome
      after later surgery would be a poor trade, and nothing currently
      distinguishes that scenario from the good one.
    proposed_experiments:
      - experiment_id: exp_hme_mtor_inhibitor_trial_with_surgical_timing_endpoint
        name: mTOR inhibitor trial with surgical timing and developmental co-endpoints
        description: >-
          A trial of mTOR inhibition in infants with hemimegalencephaly that takes
          seizure frequency as its primary outcome but co-registers age at
          eventual hemispherectomy and post-surgical developmental and language
          outcome, so that any deferral of surgery is measured rather than assumed
          to be a benefit.
        decision_criterion: >-
          Seizure reduction without later surgery and with preserved developmental
          outcome would establish a genuine alternative. Seizure reduction
          accompanied by later surgery and worse post-surgical developmental
          outcome would show the drug is deferring rather than replacing the
          definitive treatment, and would argue for using it only as a bridge.
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Based on extensive pre-clinical and clinical data, the mTOR inhibitor
          everolimus is currently approved for the treatment of focal refractory
          seizures in patients with TSC.
        explanation: >-
          Establishes the proof of principle in the repressor-loss member of the
          spectrum, which is what makes this a live question rather than
          speculation.
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Although clinical studies are just emerging for FCD and HME, we believe
          the next decade will bring significant advancements in precision
          therapies for epilepsy related to these and other MCDs.
        explanation: >-
          States the absence of clinical evidence in this disease specifically,
          which is the gap.
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Definitive treatment for HME-related DRE is hemispheric surgery through
          either anatomic (AH) or functional hemispherectomy (FH).
        explanation: >-
          Establishes the standard against which any drug must be judged. Marked
          PARTIAL because it speaks to current practice rather than to whether
          pathway inhibition could change it.

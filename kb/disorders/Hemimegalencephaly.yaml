name: Hemimegalencephaly
creation_date: "2026-08-05T00:00:00Z"
category: Somatic mosaic
description: >-
  Hemimegalencephaly is overgrowth of one cerebral hemisphere, present at birth,
  with a disorganized cortex that is intrinsically epileptogenic. Babies present
  in the first months of life with seizures that do not respond to medication,
  and they accrue hemiparesis, visual field loss, and developmental impairment.
  It is a mosaic disease: a variant arises in a single progenitor cell during
  brain development, in the signalling cascade that tells cells how large to grow
  and when to divide, and every descendant of that cell inherits it while the
  rest of the body does not. Because the variant is confined to brain, blood
  testing is normal and the diagnosis was molecularly invisible until surgical
  tissue could be sequenced. The definitive treatment is disconnection or removal
  of the affected hemisphere, which is as drastic as it sounds and works
  remarkably well.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - HME
  - unilateral megalencephaly
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        Presents and is managed as a drug-resistant infantile epilepsy arising
        from a structural brain malformation.
disease_term:
  preferred_term: hemimegalencephaly
  term:
    id: MONDO:0020492
    label: hemimegalencephaly
mappings:

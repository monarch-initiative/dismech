  - reference: PMID:37975663
    title: >-
      Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
      Hemispherectomy for Drug-Resistant Epilepsy.
notes: >-
  Scope note. This entry models isolated hemimegalencephaly as a somatic mosaic
  disorder of mTOR-pathway signalling. The syndromic forms, in which
  hemimegalencephaly occurs alongside epidermal nevus, hypomelanosis of Ito, or a
  segmental overgrowth syndrome, share the same pathway and often the same genes,
  and are treated here as the same mechanism expressed in a lineage that also
  populated skin or other tissues rather than as separate diseases. What differs
  between them is which progenitor acquired the variant and how early, not what
  the variant does.

  No mechanistic_category is asserted. The schema's mechanistic_category enum is
  closed and contains no value for the mTORopathies, and none of the available
  values fits, so the classifications block carries only the Harrison's chapter
  rather than a forced approximation.

  On the mosaicism. The causal variant is present in only a fraction of cells even
  within the malformed hemisphere, at reported allele fractions of roughly a tenth
  to two fifths, and is absent from blood. This is why the disease resisted
  molecular explanation for so long and why a negative blood test means nothing.
  It is also why the graph carries an explicit node for the mosaic gradient rather
  than treating the variant as if it were germline: the fraction of affected cells
  is a mechanistic variable, not a technical detail.

  Sourcing note. The entry was drafted from the founding somatic-variant study,
  the mTORopathy review, the surgical meta-analysis, and the precision-therapy
  review, then cross-checked against a deep-research report generated with the
  claude_code provider and committed here as
  research/Hemimegalencephaly-deep-research-claude_code.md. The cross-check
  confirmed the mechanism graph and sharpened one proposed experiment, by pointing
  out that cerebrospinal fluid cell-free DNA has poor sensitivity for these
  variants, so a contralateral study must establish its detection floor before a
  negative result means anything. It also surfaced four further gaps that are
  deliberately not curated as discussions in this pass, because doing so
  responsibly needs sources fetched and snippet-verified rather than taken from
  the report: that no animal model reproduces hemisphere-scale unilateral
  overgrowth, since rodents lack the outer radial glia biology that scales human
  cortex; that mouse and human data disagree on whether interneuron mTOR
  activation contributes; that prenatal but not postnatal pathway inhibition
  rescues the malformation in mice, which would sharpen the therapy gap already
  curated here; and that no validated non-invasive molecular diagnostic exists, so
  molecular diagnosis currently requires removing the hemisphere first. These are
  flagged here as the obvious next curation pass rather than asserted now.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance, at the hyperexcitability and
  recurrent-seizure nodes. The module's ion-channel trigger is not claimed,
  because the proximal lesion here is a growth-signalling one and the route from
  overgrowth to hyperexcitability runs through abnormal cytoarchitecture rather
  than through a channel defect.
inheritance:
  - name: Somatic mosaic, arising de novo after fertilization
    description: >-
      Not inherited and not heritable. The variant arises in a single neural
      progenitor during cortical development, so it is confined to that cell's
      descendants within the brain. Parents are unaffected, recurrence risk for
      siblings is essentially that of the general population, and the affected
      individual cannot transmit it, since the germline does not carry it. The
      counselling message is unusually reassuring for a severe malformation, and
      it depends on the diagnosis being understood as mosaic rather than genetic
      in the familial sense.
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Exome sequencing and mass spectrometry analysis in paired brain-blood
          samples from individuals with HME (n = 20 cases) identified de novo
          somatic mutations in 30% of affected individuals in the PIK3CA, AKT3 and
          MTOR genes.
        explanation: >-
          Establishes the de novo somatic origin using the paired brain and blood
          design that is the only way to demonstrate it.
pathophysiology:
  - name: Postzygotic Somatic Variant in the PI3K-AKT3-mTOR Pathway
    biological_scale: MOLECULAR
    description: >-
      A gain-of-function variant arises after fertilization in one neural
      progenitor, in PIK3CA, AKT3, or MTOR itself. The same recurrent PIK3CA
      change turns up independently in unrelated patients, which is the signature
      of a specific activating hotspot rather than of random damage. The variant
      is detectable in resected brain and absent from blood, so it could only be
      found once hemispherectomy tissue was available for sequencing.
    genes:
      - preferred_term: PIK3CA
        term:
          id: hgnc:8975
          label: PIK3CA
      - preferred_term: AKT3
        term:
          id: hgnc:393
          label: AKT3
      - preferred_term: MTOR
        term:
          id: hgnc:3942
          label: MTOR
    downstream:
      - target: Mosaic Variant Gradient Within the Affected Hemisphere
      - target: Constitutive mTOR Pathway Activation
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A recurrent PIK3CA c.1633G>A mutation was found in four separate cases.
        explanation: >-
          Recurrence of the identical change across unrelated patients is what
          distinguishes an activating hotspot from incidental somatic noise.
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The intractable epilepsy that is associated with HME can be relieved by
          the surgical treatment hemispherectomy, allowing sampling of diseased
          tissue.
        explanation: >-
          Explains why this molecular etiology was inaccessible until surgery
          provided brain tissue, which is the reason the disease was described as
          a mystery for decades.
  - name: Mosaic Variant Gradient Within the Affected Hemisphere
    biological_scale: CELLULAR
    description: >-
      Only a minority of cells in the malformed hemisphere carry the variant, at
      allele fractions reported between roughly eight and forty percent across
      sampled regions. That gradient is mechanistically important rather than a
      sampling artefact: the size of the affected clone, and how early in
      development it arose, set how much cortex is malformed and how sharply the
      abnormality stops at the midline. It also sets a hard floor on detection,
      since a low-fraction variant in a small resected fragment can be missed.
    biological_processes:
      - preferred_term: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        modifier: ABNORMAL
    downstream:
      - target: Dysregulated Progenitor Growth and Proliferation
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Identified mutations were present in 8-40% of sequenced alleles in
          various brain regions
        explanation: >-
          Quantifies the mosaic fraction and its variation between regions, which
          is what this node encodes.
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Thus HME is probably a genetically mosaic disease caused by gain of
          function in phosphatidylinositol 3-kinase (PI3K)-AKT3-mTOR signaling.
        explanation: >-
          States the mosaic disease model that this node and its upstream neighbour
          together represent.
  - name: Loss of Function in an mTOR Pathway Repressor
    biological_scale: MOLECULAR
    description: >-
      The second route into the same pathway state, and one this entry originally
      filed under a different disease. Loss-of-function variants in the negative
      regulators of the pathway are confirmed in hemimegalencephaly itself, not
      only in tuberous sclerosis: DEPDC5, NPRL2, NPRL3, PTEN, TSC1, and TSC2 have
      all been implicated. In some of these the mechanism is a two-hit
      combination, a germline variant in one allele plus a somatic mosaic second
      hit in brain, which is a different genetic architecture from the single
      somatic activating variant but converges on the same output. That two-hit
      shape also means the germline half is detectable in blood, which is the one
      circumstance in which a blood test is informative in this disease.
    genes:
      - preferred_term: DEPDC5
        term:
          id: hgnc:18423
          label: DEPDC5
    biological_processes:
      - preferred_term: TOR signaling
        term:
          id: GO:0031929
          label: TOR signaling
        modifier: INCREASED
    downstream:
      - target: Constitutive mTOR Pathway Activation
    evidence:
      - reference: PMID:34608615
        reference_title: Precision Therapy for Epilepsy Related to Brain Malformations.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Studies have also confirmed loss-of-function variants in negative
          regulators of the mTOR pathway in FCD and HME, including in DEPDC5,
          NPRL2, NPRL3, PTEN, TSC1, and TSC2
        explanation: >-
          States that repressor loss of function causes hemimegalencephaly itself,
          which is what licenses this node rather than leaving the repressor arm
          filed under a differential diagnosis.
  - name: Constitutive mTOR Pathway Activation
    biological_scale: MOLECULAR
    description: >-
      The variants converge on one output: the mTOR cascade is switched on when it
      should not be. This can be shown directly in patient brain as increased
      phosphorylation of the ribosomal protein S6, the standard downstream readout
      of mTOR activity, in the neurons of affected individuals. The same
      convergence is what places hemimegalencephaly in a spectrum with tuberous
      sclerosis and focal cortical dysplasia type II, which reach the same endpoint
      from the opposite direction by losing pathway repressors.
    biological_processes:
      - preferred_term: TOR signaling
        term:
          id: GO:0031929
          label: TOR signaling
        modifier: INCREASED
    downstream:
      - target: Dysregulated Progenitor Growth and Proliferation
    evidence:
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          were associated with increased neuronal S6 protein phosphorylation in the
          brains of affected individuals, indicating aberrant activation of
          mammalian target of rapamycin (mTOR) signaling
        explanation: >-
          Direct demonstration in patient brain that the variants actually activate
          the pathway, rather than merely being predicted to.
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The spectrum of cortical dysplasia results from somatic brain mutations
          in the mTOR pathway activators AKT3, MTOR, PIK3CA, and RHEB and from
          germline and somatic mutations in mTOR pathway repressors, DEPDC5, NPRL2,
          NPRL3, TSC1 and TSC2.
        explanation: >-
          Establishes the convergence that makes this node the hub of the entry:
          activator gain and repressor loss produce the same pathway state and a
          related family of malformations.
  - name: Dysregulated Progenitor Growth and Proliferation
    biological_scale: CELLULAR
    description: >-
      mTOR is the cell's decision-maker about growth, and switching it on
      constitutively during corticogenesis produces cells that are too big and too
      numerous, and that migrate and laminate badly. The cellular signature in
      tissue is the cytomegalic neuron, an enormously enlarged cell, sometimes with
      balloon cells alongside. The consequences are structural rather than purely
      metabolic, which is why the resulting cortex is permanently abnormal rather
      than transiently dysfunctional.
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    biological_processes:
      - preferred_term: cell growth
        term:
          id: GO:0016049
          label: cell growth
        modifier: INCREASED
    downstream:
      - target: Unihemispheric Overgrowth and Cortical Dyslamination
    evidence:
      - reference: PMID:26060899
        reference_title: Focal Cortical Dysplasia.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          based on the severity of cytoarchitectural disruption--tangential or
          radial dispersion, or loss of laminar structure--and the presence of
          unique cells types such as cytomegalic neurons or balloon cells
        explanation: >-
          Describes the cytoarchitectural and cellular consequences this node
          asserts, in the malformation family hemimegalencephaly belongs to.
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The mechanistic target of rapamycin (mTOR) signaling pathway is an
          essential regulator of numerous cellular activities such as metabolism,
          growth, proliferation, and survival.
        explanation: >-
          States the normal function whose dysregulation produces the growth
          phenotype, which is why an mTOR variant yields overgrowth specifically.
  - name: Unihemispheric Overgrowth and Cortical Dyslamination
    biological_scale: TISSUE
    description: >-
      The affected hemisphere is enlarged and structurally wrong, with a thickened
      and poorly laminated cortex, blurred grey-white boundary, and abnormal
      gyration. The abnormality respects the midline almost completely, which is
      the imaging signature and the anatomical fact that makes hemispheric surgery
      conceivable. The unaffected hemisphere is not entirely normal in function,
      which becomes important when surgery is considered.
    locations:
      - preferred_term: cerebral hemisphere
        term:
          id: UBERON:0001869
          label: cerebral hemisphere
    downstream:
      - target: Intrinsically Epileptogenic Dysplastic Cortex
      - target: Hemiparesis and Developmental Impairment
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hemimegalencephaly (HME) is a rare diffuse malformation of cortical
          development characterized by unihemispheric hypertrophy, drug-resistant
          epilepsy (DRE), hemiparesis, and developmental delay.
        explanation: >-
          States the unihemispheric hypertrophy that defines this node and the
          three clinical consequences that follow from it.
      - reference: PMID:22729223
        reference_title: >-
          De novo somatic mutations in components of the PI3K-AKT3-mTOR pathway
          cause hemimegalencephaly.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hemimegalencephaly (HME) is characterized by overgrowth of either one of
          the two cerebral hemispheres.
        explanation: >-
          Establishes the defining anatomical abnormality and that either side may
          be affected.
  - name: Intrinsically Epileptogenic Dysplastic Cortex
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      Dysplastic cortex does not merely sit there; it generates seizures. Loss of
      laminar organization disrupts the normal segregation of excitatory and
      inhibitory connectivity, and cytomegalic neurons have abnormal intrinsic
      excitability, so the malformed tissue is an epileptogenic generator in its
      own right. That is why the epilepsy is intractable to medication from the
      outset and why removing or disconnecting the tissue, rather than suppressing
      it pharmacologically, is what works.
    cell_types:
      - preferred_term: neuron
        term:
          id: CL:0000540
          label: neuron
    downstream:
      - target: Drug-Resistant Epilepsy of Infantile Onset
    evidence:
      - reference: PMID:26060899
        reference_title: Focal Cortical Dysplasia.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Focal cortical dysplasias are common malformations of cerebral cortical
          development and are highly associated with medically intractable
          epilepsy.
        explanation: >-
          Establishes the intrinsic epileptogenicity of dysplastic cortex in the
          malformation family this disease belongs to.
      - reference: PMID:26060899
        reference_title: Focal Cortical Dysplasia.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Most focal cortical dysplasias can be identified on neuroimaging and many
          require resective epilepsy surgery to cure refractory seizures.
        explanation: >-
          Supports the claim that the tissue itself is the generator, since
          removing it is what cures the seizures.
  - name: Drug-Resistant Epilepsy of Infantile Onset
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      Seizures typically begin in the first months of life, often as infantile
      spasms or focal seizures, and are refractory to antiseizure medication.
      Drug resistance is close to definitional and it is the reason surgery is
      considered so early, in babies, when the developing brain still has the
      plasticity to reorganize function after losing a hemisphere.
    downstream:
      - target: Hemiparesis and Developmental Impairment
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Definitive treatment for HME-related DRE is hemispheric surgery through
          either anatomic (AH) or functional hemispherectomy (FH).
        explanation: >-
          States that the drug-resistant epilepsy of this disease is treated
          surgically rather than medically, which is the practical content of drug
          resistance here.
      - reference: PMID:37149062
        reference_title: >-
          mTOR pathway: Insights into an established pathway for brain mosaicism in
          epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          which manifest with drug-resistant epilepsies
        explanation: >-
          Confirms drug resistance as the characteristic epilepsy phenotype of the
          malformation spectrum including hemimegalencephaly.
  - name: Hemiparesis and Developmental Impairment
    biological_scale: ORGANISM
    description: >-
      The clinical endpoint: weakness on the side opposite the malformed
      hemisphere, visual field loss, and global developmental impairment. Two
      processes contribute and are hard to separate, which matters for prognosis.
      Part of the deficit is structural and present from birth, the direct cost of
      having one hemisphere built wrong. Part is acquired, the cost of years of
      uncontrolled seizures in a developing brain, and it is the part surgery is
      meant to prevent.
    evidence:
      - reference: PMID:37975663
        reference_title: >-
          Hemimegalencephaly: A Systematic Comparison of Functional and Anatomic
          Hemispherectomy for Drug-Resistant Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Hemimegalencephaly (HME) is a rare diffuse malformation of cortical
          development characterized by unihemispheric hypertrophy, drug-resistant
          epilepsy (DRE), hemiparesis, and developmental delay.
        explanation: >-
          Names the hemiparesis and developmental delay that constitute this
          endpoint.

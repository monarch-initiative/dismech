discussions:
- discussion_id: bams_allelic_function
  prompt: >-
    Do all BAMS-associated SMCHD1 ATPase-domain variants act through increased
    ATPase activity or another coherent gain-of-function mechanism?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - genetic#SMCHD1 ATPase-domain missense variants
  - pathophysiology#SMCHD1 ATPase-domain chromatin regulatory alteration
  rationale: >-
    Many tested BAMS variants increase ATPase activity, whereas patient
    methylation changes overlap FSHD2 and at least one recurrent variant has
    been observed across phenotypes. A single gain-of-function label would
    therefore overstate the available allele-by-allele evidence.
  evidence:
  - reference: PMID:29748383
    reference_title: FSHD2- and BAMS-associated mutations confer opposing effects on SMCHD1 function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      whether BAMS is associated with loss- or gain-of-function mutations in SMCHD1 is unclear.
    explanation: The functional study states the unresolved allelic-mechanism question directly.
  - reference: PMID:28067909
    reference_title: SMCHD1 mutations associated with a rare muscular dystrophy can also cause isolated arhinia and Bosma arhinia microphthalmia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We discovered shared mutations and comparable DNA hypomethylation patterning between these distinct disorders.
    explanation: Shared variants and methylation effects complicate a simple disease-specific binary mechanism.
- discussion_id: bams_developmental_cell_lineages
  prompt: >-
    What are the relative and interacting contributions of neural-crest and
    cranial-placode defects to human BAMS anatomy?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Neural crest transcriptional, adhesion, and migration dysregulation
  - pathophysiology#Cranial placode differentiation and adhesion defect
  - pathophysiology#Disrupted nasal, olfactory, and midfacial development
  rationale: >-
    Independent patient-derived-cell studies support both lineages. Neither
    model yet establishes their temporal interaction, contribution to ocular
    and reproductive findings, or quantitative importance across variants.
  evidence:
  - reference: PMID:34209568
    reference_title: AKT Signaling Modifies the Balance between Cell Proliferation and Migration in Neural Crest Cells from Patients Affected with Bosma Arhinia and Microphthalmia Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "defects in neural crest migration might contribute to the craniofacial anomalies in BAMS."
    explanation: The earlier model supports a contributory neural-crest mechanism.
  - reference: PMID:41962546
    reference_title: Cranial placode differentiation defect in individuals born without a nose.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Together our research suggests that BAMS is caused by impaired differentiation to cranial placode cells and changes in cell adhesion
    explanation: The 2026 study adds a placodal mechanism that must be integrated with neural-crest evidence.
- discussion_id: bams_inherited_expressivity
  prompt: >-
    Which genetic, epigenetic, or developmental modifiers determine expression
    from isolated anosmia to complete arhinia and multisystem BAMS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - inheritance#Autosomal dominant inheritance
  - genetic#SMCHD1 ATPase-domain missense variants
  rationale: >-
    Predominantly de novo discovery cohorts coexist with an inherited pedigree
    in which an anosmic parent transmitted the same variant to offspring with
    arhinia. Recurrence counseling and prediction therefore require more than a
    de-novo-versus-inherited distinction.
  evidence:
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected patients and anosmic parent were found to have a novel SMCHD1 gene variant p.E473V."
    explanation: The pedigree directly demonstrates inherited variable expressivity.
- discussion_id: bams_lifespan_natural_history
  prompt: >-
    What are the typical longitudinal airway, visual, endocrine, reproductive,
    reconstructive, and psychosocial outcomes across the BAMS lifespan?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Childhood, puberty, and adult course
  - clinical_burden
  rationale: >-
    Available evidence is dominated by neonatal reports, cross-sectional case
    descriptions, and single-person adult narratives. It supports possible
    favorable adaptation but cannot define complication rates, treatment
    timing, or a typical longitudinal trajectory.
  evidence:
  - reference: PMID:34194860
    reference_title: "Good Outcome for an Individual with Severe Facial Anomalies and Hypogonadotropic Hypogonadism: A Consequence of His Cognitive Function, Pragmatic Approach, and Temperament."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His story and experiences with the health-care system offer insight into some factors that may be pertinent to resilience and lifelong adjustment for patients with similar conditions
    explanation: A single lifespan case is informative but cannot establish population natural history.

    Patient-derived neural crest stem cells show altered extracellular-matrix,
    cell-adhesion, PDGFR, ERBB3, integrin, and PI3K/AKT programs together with
    reduced migration. This is a plausible contributor to craniofacial
    malformation rather than a fully demonstrated in-vivo sequence.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:

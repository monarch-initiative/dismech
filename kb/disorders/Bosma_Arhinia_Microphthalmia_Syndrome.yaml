review_notes: >-
  The 2026 re-review incorporates the newly reported patient-derived
  cranial-placode differentiation defect and separates it from the earlier
  neural-crest migration model. The pathograph now contains seven evidence-graded
  nodes and 45 evidence-backed causal edges, with explicit directness and
  known-versus-unknown intermediates. All 38 represented phenotypes are
  connected, including newly added taste, high-palate, hypertelorism,
  lacrimal-duct, paranasal-sinus, and neonatal-feeding findings, and the
  previously orphaned dacryocystocele. The review distinguishes the definitive
  SMCHD1 gene-disease relationship from the still-provisional claim that every
  BAMS allele is gain of function, documents inherited variable expressivity,
  retains separate point-prevalence and literature-case estimates, and adds
  neonatal-to-adult progression, high but variable burden, a stated
  arrhinencephaly differential, six source-backed management actions, two animal
  models, GSE173251, and four open discussions. NCT02559050 is retained only as a
  one-participant congenital-arhinia device study; its registry text does not
  establish BAMS or SMCHD1, and an official ClinicalTrials.gov API query for the
  exact disease name on 2026-07-24 returned no studies. The current MONDO mapping
  follows the definitive ClinGen assertion rather than obsolete MONDO
  identifiers preserved in the two cached Orphanet records. New caches were
  generated only with just fetch-reference. No disease-modifying treatment is
  established.

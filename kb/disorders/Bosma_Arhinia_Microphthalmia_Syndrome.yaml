- name: GnRH deficiency and variable reproductive-axis development
  description: >-
    Congenital arhinia is strongly associated with absent or reduced pulsatile
    GnRH activity, especially in males, but some females retain spontaneous
    pubertal development or a normal reproductive axis. Human data therefore
    support association rather than a uniform olfactory-dependent migration
    failure.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: gonadotropin secretion
    modifier: DECREASED
    term:
      id: GO:0032274
      label: gonadotropin secretion
  evidence:
  - reference: PMID:32034419
    reference_title: Insight Into the Ontogeny of GnRH Neurons From Patients Born Without a Nose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All male patients demonstrated clinical and/or biochemical signs of GnRH deficiency, and the 5 men studied in person had no luteinizing hormone (LH) pulses, suggesting absent GnRH activity.
    explanation: Detailed phenotyping directly establishes GnRH deficiency in affected males.
  - reference: PMID:32034419
    reference_title: Insight Into the Ontogeny of GnRH Neurons From Patients Born Without a Nose.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 6 women studied in person also had apulsatile LH profiles, yet 3 had spontaneous breast development and 2 women (studied from afar) had normal breast development and menstrual cycles, suggesting a fully intact reproductive axis.
    explanation: Female findings establish clinically important reproductive-axis variability.
  downstream:
  - target: Hypogonadotropic hypogonadism
    causal_link_type: DIRECT
    evidence: &reproductive_manifestation_evidence

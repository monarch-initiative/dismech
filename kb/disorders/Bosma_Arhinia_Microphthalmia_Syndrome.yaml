    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      many BAMS mutations can result in elevated ATPase activity and decreased eye size in Xenopus
    explanation: The study directly couples variant biochemistry to an ocular phenotype in Xenopus.

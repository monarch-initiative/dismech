  evidence:
  - reference: PMID:34209568
    reference_title: AKT Signaling Modifies the Balance between Cell Proliferation and Migration in Neural Crest Cells from Patients Affected with Bosma Arhinia and Microphthalmia Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      downregulation of PDGFRα or β and ERBB3, cMET and integrins or changes in ECM composition converged toward a defect in cell–cell contacts, cell-substratum adhesion, and cell migration in BAMS NCSCs.
    explanation: The patient-derived model identifies convergent adhesion and migration defects.
  downstream:

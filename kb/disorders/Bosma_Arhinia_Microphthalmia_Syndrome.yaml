diagnosis:
- name: Clinical diagnostic criteria
  description: >-
    Clinical diagnosis integrates arhinia or severe nasal hypoplasia, midface
    hypoplasia, ocular anomalies, anosmia or hyposmia, hypogonadotropic
    hypogonadism, and normal intellectual development.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: A compatible congenital craniofacial, ocular, olfactory, and endocrine pattern supports BAMS.
  evidence:
  - reference: PMID:36968924
    reference_title: "Bosma Arhinia Microphthalmia Syndrome (BAMS): First Report from Vietnam."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Criteria for diagnosis consist of arhinia, midface hypoplasia (with a hypoplastic maxilla), hypogonadotropic hypogonadism, and normal intellectual abilities."
    explanation: This case report states core clinical diagnostic criteria.
- name: SMCHD1 molecular testing
  description: >-
    Sequencing or targeted analysis of SMCHD1, especially exons encoding the
    extended ATPase domain, can support a molecular diagnosis and clarify
    familial recurrence risk.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A heterozygous pathogenic SMCHD1 ATPase-domain missense variant supports molecular diagnosis.
  evidence:
  - reference: PMID:28067909
    reference_title: SMCHD1 mutations associated with a rare muscular dystrophy can also cause isolated arhinia and Bosma arhinia microphthalmia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of 40 people with arhinia revealed that 84% of probands harbor a missense mutation"
    explanation: Sequencing evidence supports SMCHD1 testing in arhinia/BAMS.
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted sequencing was carried out on DNA samples from the 2 affected patients, 1 anosmic and 1 healthy parent, to identify variants in exons 3 to 13 of SMCHD1"
    explanation: Targeted SMCHD1 sequencing is directly used in a congenital arhinia pedigree.
- name: Craniofacial and olfactory anatomy imaging
  description: >-
    Cross-sectional craniofacial imaging assesses the absent or hypoplastic
    nose, paranasal sinuses, nasopharynx, olfactory bulbs, orbits, and surgical
    planning anatomy.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: Absent or hypoplastic nasal, sinus, or olfactory-bulb structures support BAMS anatomy.
  evidence:
  - reference: PMID:6802865
    reference_title: "Hypoplasia of the nose and eyes, hyposmia, hypogeusia, and hypogonadotrophic hypogonadism in two males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their nasal skeleton, demonstrated by tomoradiography, had grown in early embryological form."
    explanation: The original clinical description used imaging to characterize the nasal skeleton.
  - reference: PMID:36968924
    reference_title: "Bosma Arhinia Microphthalmia Syndrome (BAMS): First Report from Vietnam."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her paranasal sinuses were ossified and underdeveloped."
    explanation: Imaging/anatomic assessment supports paranasal sinus involvement.
differential_diagnoses:
- name: Arrhinencephaly and holoprosencephaly spectrum
  description: >-
    Severe midline facial malformations can suggest arrhinencephaly or a
    holoprosencephaly-spectrum disorder. The original BAMS patients instead
    retained the medial falx attachment and had normal intelligence, supporting
    a distinct developmental pattern with potential for normal cognition.
  distinguishing_features:
  - Preserved medial structure of attachment of the falx cerebri argues against arrhinencephaly in the original syndrome.
  - Normal forebrain anatomy and preserved intellectual development favor BAMS over severe holoprosencephaly-spectrum disease.
  - Heterozygous SMCHD1 ATPase-domain variation supports BAMS when the phenotype is compatible.
  evidence:
  - reference: PMID:6802865
    reference_title: "Hypoplasia of the nose and eyes, hyposmia, hypogeusia, and hypogonadotrophic hypogonadism in two males."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients do not fall within the spectrum of arrhinencephaly because of the presence of medial structure of attachment of the falx cerebri and because of their normal intelligence.
    explanation: The original report explicitly states and anatomically explains this differential.
treatments:
- name: Neonatal airway stabilization
  action_category: THERAPEUTIC
  description: >-
    Complete nasal obstruction requires immediate individualized airway
    planning. Oral or pharyngeal airway splinting may suffice in a stable
    newborn, whereas intubation followed by tracheostomy may be required for
    respiratory distress; the evidence is limited to case-based management.
  treatment_term:
    preferred_term: airway management
  target_phenotypes:
  - preferred_term: Aplasia of the nose
    term:
      id: HP:0009927
      label: Aplasia of the nose
  - preferred_term: Choanal atresia
    term:
      id: HP:0000453
      label: Choanal atresia
  evidence:
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Airway management was achieved by splinting through a Mayo tube which was subsequently replaced by a pharyngeal endotracheal tube without signs of respiratory failure.
    explanation: A molecularly confirmed newborn was stabilized without immediate tracheostomy.
  - reference: PMID:32100546
    reference_title: "The Case of the Missing Nose: Congenital Arhinia Case Presentation and Management Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon birth, the patient was subsequently intubated, followed by tracheostomy due to complete nasal obstruction.
    explanation: A second SMCHD1-positive infant required invasive airway stabilization.
- name: Neonatal feeding adaptation
  action_category: THERAPEUTIC
  description: >-
    Early feeding difficulty can be managed with enteral access when needed,
    drinking training, and adapted feeding equipment while coordination and
    growth are assessed.
  treatment_term:
    preferred_term: feeding therapy
    term:
      id: NCIT:C156237
      label: Swallowing Therapy
  target_phenotypes:
  - preferred_term: Feeding difficulties
    term:
      id: HP:0011968
      label: Feeding difficulties
  evidence:
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An orogastric tube was placed, and drinking training and a special pacifier improved coordination and drinking performance.
    explanation: The neonatal case directly supports the described feeding measures.
- name: Staged nasal and midface reconstruction
  action_category: THERAPEUTIC
  description: >-
    Selected patients may undergo staged midface advancement, tissue expansion,
    and nasal construction to address absent nasal and midface structures.
    Timing and technique are individualized because evidence comes from very
    small case series and early surgery can affect midfacial growth.
  treatment_term:
    preferred_term: surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Aplasia of the nose
    term:
      id: HP:0009927
      label: Aplasia of the nose
  - preferred_term: Abnormal midface morphology
    term:
      id: HP:0000309
      label: Abnormal midface morphology
  evidence:
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A staged surgical approach was applied."
    explanation: This case series directly supports staged surgical reconstruction.
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "nasal construction with a forehead flap that was placed over a costochondral framework derived from rib cartilage."
    explanation: The case series describes nasal construction technique for congenital arhinia.
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the absence of respiratory problems and appropriate growth, however, there is no urgent indication for early plastic surgical treatment, given the inherent risks of sepsis and growth disorders in the midface.
    explanation: The neonatal report supports individualized timing and cautions against automatic early reconstruction.
- name: Customized postoperative nasal stenting
  action_category: THERAPEUTIC
  description: >-
    A customized three-dimensional-printed silicone stent has been used after
    nasal-passage reconstruction to reduce restenosis while mucoepithelium
    regenerates. Evidence is a single congenital-arhinia case and does not
    establish comparative efficacy or BAMS-specific generalizability.
  treatment_term:
    preferred_term: surgical repair
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Aplasia of the nose
    term:
      id: HP:0009927
      label: Aplasia of the nose
  evidence:
  - reference: PMID:30247752
    reference_title: "Nasal Reconstruction Using a Customized Three-Dimensional-Printed Stent for Congenital Arhinia: Three-Year Follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three years after stent removal, respiratory function, nasal passage structure, and external nose shape were maintained without additional medical care.
    explanation: The three-year case follow-up documents durable anatomy and respiratory function after customized stenting.
  - reference: clinicaltrials:NCT02559050
    reference_title: Nasal Reconstruction Using a Customized 3D-printed Nasal Stent for Congenital Arhinia
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 7-year-old arhinia patient receives nasal reconstruction with nasal cavity reconstruction and is aided with the application of a 3D-printed nasal stent to prevent nasal cavity constriction.
    explanation: The registry summary documents the single-participant device intervention but not a BAMS genotype or comparative outcome.
- name: Early multidisciplinary craniofacial, lacrimal, and endocrine follow-up
  action_category: MONITORING
  description: >-
    Coordinated follow-up should include genetics, plastic and craniofacial
    surgery, ophthalmic plastics, otorhinolaryngology, and endocrinology, with
    particular attention to lacrimal drainage anatomy and pubertal development.
    The best operation for complete bilateral absence of the nasal cavity
    remains uncertain.
  treatment_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:38713859
    reference_title: Dilemmas in the management of lacrimal drainage anomalies in BOSMA (congenital arhinia-microphthalmia) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A multidisciplinary team from the specialties of genetics, plastic surgery, ophthalmic plastics and reconstructive surgery, otorhinolaryngology, and endocrinology should get involved very early on for better continuity of care.
    explanation: The lacrimal-management review explicitly recommends early multidisciplinary continuity.
- name: Genetic counseling
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling addresses de novo and inherited SMCHD1 variants, autosomal
    dominant transmission, variable expressivity from anosmia to arhinia, and
    recurrence risk.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the variable expressivity ranging from anosmia to arhinia could improve clinical genetic screens for risk stratification of individuals with anosmia on passing on arhinia to their children."
    explanation: This supports genetic counseling around SMCHD1 variable expressivity and reproductive risk.
animal_models:
- species: Xenopus laevis
  genotype: Embryos assayed with BAMS-associated SMCHD1 ATPase-domain missense variants
  description: >-
    Biochemical and Xenopus assays show that many BAMS variants increase
    SMCHD1 ATPase activity and reduce eye size. This supports altered-protein
    function and an ocular-developmental effect, but it does not establish a
    universal mechanism for every allele or reproduce the full human syndrome.

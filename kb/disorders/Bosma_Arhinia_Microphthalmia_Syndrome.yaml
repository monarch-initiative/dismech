progression:
- phase: Congenital onset
  age_range: Antenatal to neonatal
  notes: >-
    Nasal, ocular, olfactory, and midfacial malformations arise prenatally and
    may be detected by fetal imaging or recognized immediately after birth.
  evidence:
  - reference: ORPHA:2250
    reference_title: "Hyposmia-nasal and ocular hypoplasia-hypogonadotropic hypogonadism syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Antenatal"
    explanation: Orphanet records antenatal onset.
  - reference: ORPHA:2250
    reference_title: "Hyposmia-nasal and ocular hypoplasia-hypogonadotropic hypogonadism syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Neonatal"
    explanation: Orphanet records neonatal onset.
- phase: Neonatal stabilization and feeding adaptation
  age_range: Birth and early infancy
  notes: >-
    Complete nasal obstruction can make airway stabilization the immediate
    priority. Feeding coordination may initially require enteral access,
    training, and adapted equipment. Need for intubation or tracheostomy varies,
    and early reconstructive surgery is not automatically indicated when
    breathing and growth are adequate.
  evidence:
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Airway management was achieved by splinting through a Mayo tube which was subsequently replaced by a pharyngeal endotracheal tube without signs of respiratory failure.
    explanation: The molecularly confirmed neonatal case documents non-tracheostomy airway stabilization.
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An orogastric tube was placed, and drinking training and a special pacifier improved coordination and drinking performance.
    explanation: The same case documents early feeding adaptation.
- phase: Childhood, puberty, and adult course
  age_range: Childhood through adulthood
  notes: >-
    Congenital structural and sensory manifestations persist. Reconstructive
    choices are individualized as the face grows; absent or delayed sexual
    maturation may become evident around puberty. Adult outcome can be favorable
    with intact cognition and individualized medical and psychosocial support,
    but systematic longitudinal cohorts are unavailable.
  evidence:
  - reference: PMID:34194860
    reference_title: "Good Outcome for an Individual with Severe Facial Anomalies and Hypogonadotropic Hypogonadism: A Consequence of His Cognitive Function, Pragmatic Approach, and Temperament."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His successful adjustment even in the face of significant early life challenges demonstrates that positive outcomes are attainable for individuals with significant developmental errors.
    explanation: A lifespan case documents favorable adult adaptation despite major congenital and endocrine manifestations.
  - reference: PMID:36968924
    reference_title: "Bosma Arhinia Microphthalmia Syndrome (BAMS): First Report from Vietnam."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is characterized by nasal and ophthalmic abnormalities, as well as disturbances in puberty and sexual development.
    explanation: The adult report supports later recognition of reproductive-axis manifestations.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Complete or severe nasal agenesis can create neonatal airway and feeding
    risk, while visual impairment, altered speech and breathing, endocrine and
    reproductive consequences, and staged craniofacial care impose substantial
    lifelong functional and multidisciplinary burden. Expression is variable:
    some carriers have anosmia alone and adults with severe anatomy can achieve
    good adaptation, so a disease-level HIGH rating does not imply uniformly
    poor outcome.
  evidence:
  - reference: PMID:33784779
    reference_title: "[A Newborn Suffering from Arhinia: Neonatologic Challenges During Primary Care of the Newborn With Bosma Arhinia Microphthalmia Syndrome (BAMS)]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial stabilization after birth is often a challenge in patients with nasal agenesis. They are often intubated immediately postpartum and electively tracheotomized.
    explanation: The neonatal report documents potentially intensive initial airway care.
  - reference: PMID:36968924
    reference_title: "Bosma Arhinia Microphthalmia Syndrome (BAMS): First Report from Vietnam."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On presentation, she was noted to have congenital arhinia, bilateral microphthalmia, vision loss, mouth-breathing, an unclear speaking voice, a high arched or cleft palate, and a hypoplastic maxilla.
    explanation: The adult case illustrates persistent multisystem functional consequences.
genetic:
- name: SMCHD1 ATPase-domain missense variants
  gene_term:
    preferred_term: SMCHD1
    term:
      id: hgnc:29090
      label: SMCHD1
  association: Heterozygous ATPase-domain missense variants, commonly de novo but sometimes inherited with variable expressivity
  relationship_type: CAUSATIVE
  notes: >-
    BAMS-associated variants cluster in the SMCHD1 extended ATPase domain and
    are phenotypically distinct from the broader FSHD2-associated SMCHD1
    spectrum. Many tested BAMS variants increase ATPase activity, but this is
    not established for every allele and shared variants or methylation effects
    complicate a universal gain-of-function model.
  evidence:
  - reference: ORPHA:2250
    reference_title: "Hyposmia-nasal and ocular hypoplasia-hypogonadotropic hypogonadism syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SMCHD1 | structural maintenance of chromosomes flexible hinge domain containing 1 | hgnc:29090 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records SMCHD1 as a disease-causing germline gene.
  - reference: PMID:28067911
    reference_title: De novo mutations in SMCHD1 cause Bosma arhinia microphthalmia syndrome and abrogate nasal development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "missense mutations in the epigenetic regulator SMCHD1 mapping to the extended ATPase domain of the encoded protein cause BAMS in all 14 cases studied."
    explanation: The discovery series directly identifies disease-causing SMCHD1 ATPase-domain missense variants.
  - reference: PMID:28067909
    reference_title: SMCHD1 mutations associated with a rare muscular dystrophy can also cause isolated arhinia and Bosma arhinia microphthalmia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of 40 people with arhinia revealed that 84% of probands harbor a missense mutation localized to a constrained region of SMCHD1 encompassing the ATPase domain."
    explanation: An independent sequencing study supports the high fraction of arhinia/BAMS probands with constrained SMCHD1 ATPase-domain missense variants.
  - reference: PMID:31243061
    reference_title: SMCHD1 mutation spectrum for facioscapulohumeral muscular dystrophy type 2 (FSHD2) and Bosma arhinia microphthalmia syndrome (BAMS) reveals disease-specific localisation of variants in the ATPase domain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in BAMS, pathogenic variants are restricted to the extended ATPase domain."
    explanation: A mutation-spectrum study supports BAMS-specific ATPase-domain localization.
  - reference: PMID:36944600
    reference_title: Nasal Construction in Congenital Arhinia Due to Novel SMCHD1 Gene Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected patients and anosmic parent were found to have a novel SMCHD1 gene variant p.E473V."
    explanation: The inherited pedigree prevents modeling every BAMS-associated variant as de novo.
  - reference: CGGV:assertion_b2f2b442-3afa-4427-8e9b-3dc2485790aa-2022-05-20T042139.263Z
    reference_title: "SMCHD1 / arhinia, choanal atresia, and microphthalmia (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SMCHD1 | HGNC:29090 | arhinia, choanal atresia, and microphthalmia | MONDO:0011323 | AD | Definitive"
    explanation: ClinGen classifies the SMCHD1-arhinia, choanal atresia, and microphthalmia gene-disease relationship as definitive with autosomal dominant inheritance.
pathophysiology:
- name: SMCHD1 ATPase-domain chromatin regulatory alteration
  description: >-
    BAMS-associated heterozygous missense variants cluster in the extended
    SMCHD1 ATPase domain and alter ATP hydrolysis, protein conformation, and
    local methylation. Many tested BAMS alleles increase ATPase activity, but
    shared alleles and incomplete functional testing make a universal
    gain-of-function label premature.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  genes:
  - preferred_term: SMCHD1
    term:
      id: hgnc:29090
      label: SMCHD1
  biological_processes:
  - preferred_term: chromatin organization
    modifier: ABNORMAL
    term:
      id: GO:0006325
      label: chromatin organization
  evidence:
  - reference: PMID:29748383
    reference_title: FSHD2- and BAMS-associated mutations confer opposing effects on SMCHD1 function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      many BAMS mutations can result in elevated ATPase activity and decreased eye size in Xenopus
    explanation: Functional testing supports increased ATPase activity for many, but not necessarily all, BAMS alleles.
  - reference: PMID:31243061
    reference_title: SMCHD1 mutation spectrum for facioscapulohumeral muscular dystrophy type 2 (FSHD2) and Bosma arhinia microphthalmia syndrome (BAMS) reveals disease-specific localisation of variants in the ATPase domain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BAMS-associated SMCHD1 variants result in quantifiable local DNA hypomethylation."
    explanation: Patient methylation analyses establish an epigenetic consequence without resolving a single allelic mechanism.
  downstream:
  - target: Neural crest transcriptional, adhesion, and migration dysregulation
    description: Altered SMCHD1 regulation changes neural-crest extracellular-matrix, receptor-signaling, and migration programs.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered transcription of extracellular-matrix, PDGFR, ERBB3, integrin, and AKT-pathway genes
    evidence:
    - reference: PMID:34209568
      reference_title: AKT Signaling Modifies the Balance between Cell Proliferation and Migration in Neural Crest Cells from Patients Affected with Bosma Arhinia and Microphthalmia Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        BAMS NCSCs are characterized by an overall decrease in the expression of a number genes required for NCSC migration
      explanation: Patient-derived neural-crest cells connect BAMS-associated SMCHD1 variation to a migration-gene program.
  - target: Cranial placode differentiation and adhesion defect
    description: Patient SMCHD1 variants are associated with impaired differentiation toward cranial-placode cells and altered adhesion programs.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered placodal transcriptome and DNA methylome
    - dysregulated cell-adhesion programs
    evidence:
    - reference: PMID:41962546
      reference_title: Cranial placode differentiation defect in individuals born without a nose.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Here, we differentiated patient-derived induced pluripotent stem cells toward the cranial placode lineage and found that they exhibited significant differentiation defects.
      explanation: The 2026 patient-derived-cell study directly supports the placodal differentiation branch.
  - target: Ocular developmental disruption
    description: SMCHD1 ATPase-domain variants are linked to ocular malformation through incompletely defined developmental intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29748383
      reference_title: FSHD2- and BAMS-associated mutations confer opposing effects on SMCHD1 function.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        many BAMS mutations can result in elevated ATPase activity and decreased eye size in Xenopus
      explanation: Xenopus eye-size effects support an ocular branch, but the human developmental intermediates remain unresolved.
  - target: GnRH deficiency and variable reproductive-axis development
    description: The route from SMCHD1 dysregulation to GnRH deficiency is unresolved and does not uniformly require absent olfactory structures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32034419
      reference_title: Insight Into the Ontogeny of GnRH Neurons From Patients Born Without a Nose.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Patients with arhinia teach us that the GnRH neuron, a key gatekeeper of the reproductive axis, is associated with but may not depend on olfactory structures for normal migration and function
      explanation: The human cohort supports a reproductive-axis branch while cautioning against a simple olfactory-dependence model.
  - target: Unresolved body-wall developmental consequences
    description: Inguinal hernia and abdominal-wall weakness are recurrent clinical associations, but their route from SMCHD1 is unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16353241
      reference_title: Bosma arhinia microphthalmia syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        severe hypoplasia of the nose and eyes, palatal abnormalities, deficient taste and smell, inguinal hernias, hypogonadotropic hypogonadism with cryptorchidism, and normal intelligence.
      explanation: The clinical association is established, but no intervening body-wall mechanism is defined.
- name: Neural crest transcriptional, adhesion, and migration dysregulation

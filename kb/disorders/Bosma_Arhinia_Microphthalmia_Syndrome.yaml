- Bosma arhinia-microphthalmia syndrome
- Bosma-Henkin-Christiansen syndrome
- Hyposmia-nasal and ocular hypoplasia-hypogonadotropic hypogonadism syndrome
- Arrhinia-choanal atresia-microphthalmia syndrome
notes: >-
  MONDO:0011323 is the current aggregate disease concept and is the identifier
  used by the definitive ClinGen SMCHD1 assertion. In the local Orphadata
  snapshot, ORPHA:2250 contains the usable structured disease record with
  definition, inheritance, SMCHD1, onset, epidemiology, and HPO phenotype rows;
  ORPHA:1135 is a sparse legacy cross-reference record only. Those cached
  Orphanet records retain obsolete exact cross-references to MONDO:0016393 and
  MONDO:0015238, respectively, so they are not used as the current MONDO mapping.

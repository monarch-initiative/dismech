    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      For control cells, the ratio between activity and amount was 1 whereas for
      the patients this ratio was below 1, indicating a defect in intrinsic
      catalytic activity of complex I in the latter cells.
    explanation: >-
      Defines the measurement, its control value, and its interpretation.
genetic:
- name: NDUFS7
  notes: >-
    NDUFS7 encodes PSST, a nuclear-encoded core subunit of the complex I Q module.
    Reported disease alleles are homozygous in every well-characterised pedigree
    and fall into a missense class (V122M, R145H, L126F, R168S, and the
    optic-atrophy alleles R75C, R100C, R105C) and a splice class (c.17-1167C>G
    generating a cryptic exon, and c.16+5G>A). Inheritance is autosomal recessive
    throughout and is recorded in the entry's `inheritance` block.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: NDUFS7

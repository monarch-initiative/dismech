name: Mitochondrial Complex I Deficiency Nuclear Type 3
category: Mendelian
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Mitochondrial complex I deficiency nuclear type 3 is an autosomal recessive
  mitochondrial disease caused by biallelic NDUFS7 variants. NDUFS7 encodes PSST,
  one of the conserved core subunits of complex I and a component of the Q module
  in the peripheral arm. Its position is the point of the whole entry: the
  subunit sits at the junction between the peripheral and membrane arms and helps
  form the coenzyme Q binding site, immediately adjacent to iron-sulfur cluster
  N2, the terminal donor of the ninety-five-angstrom relay that carries electrons
  from NADH to ubiquinone. A defect here is not a defect in an accessory shell
  protein; it is a defect at the last step of the electron path.

  The founding observation was the first missense mutation in any nuclear-encoded
  complex I subunit, reported in 1999 in two siblings with neuropathologically
  proven complex I-deficient Leigh syndrome. Subsequent reports have been
  consistently recessive and consistently Leigh: a homozygous R145H allele in a
  consanguineous family, an intronic variant creating a cryptic exon that
  truncates the protein to 41 of 213 residues, and an intronic c.16+5G>A variant
  in siblings with early basal ganglia and midbrain involvement.

  Two features make this entity worth reading rather than filing as one more
  numbered complex I deficiency.

  First, the biochemical lesion is genuinely two-sided. The truncating intronic
  allele produces a marked decrease of fully assembled complex I with the other
  complexes untouched, so NDUFS7 is needed for biogenesis of the enzyme. But
  mutations engineered into the PSST loop that faces the Q-binding tunnel cause a
  drastic loss of quinone reductase activity despite full assembly of the
  complex, and reconstructing the patient V122M allele in Yarrowia lipolytica
  halves Vmax while changing the Km for decyl-ubiquinone. Losing this subunit
  removes enzyme; mutating it in the wrong place leaves the enzyme in place and
  breaks it.

  Second, a genotype-phenotype segregation that has only recently come into view.
  A 2026 optic-neuropathy series found NDUFS7 to be the most frequently affected
  gene in its cohort, with biallelic variants causing isolated optic atrophy and
  a Leber-like recessive course in young adults rather than infantile Leigh
  syndrome - and the variants that do this sit in the N-terminal region of the
  subunit, spatially separate from the Leigh-associated variants clustered around
  cluster N2 and the CoQ site. That is a structural hypothesis with a clinical
  consequence, and it is curated here as one.

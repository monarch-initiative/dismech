    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The quinone headgroup binds at the deep end of this chamber, near
      iron-sulphur cluster N2.
    explanation: >-
      Establishes the spatial relationship between the quinone site and cluster
      N2 that makes the Q module the terminal electron-transfer step.
  - reference: PMID:23417064
    reference_title: "Crystal structure of the entire respiratory complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NADH transfers two electrons to FMN as a hydride ion and then electrons are
      transferred one by one, along the uniquely long (95 Å) chain of seven
      conserved Fe-S clusters, to the quinone-binding site at the interface with
      the membrane domain.
    explanation: >-
      Gives the whole electron path, whose final step the Q-module lesion
      interrupts.

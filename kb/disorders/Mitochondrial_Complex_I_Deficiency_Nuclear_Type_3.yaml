- name: Defective NADH-to-Ubiquinone Electron Transfer
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The measured biochemical endpoint: reduced NADH:ubiquinone oxidoreductase
    activity, with the rest of the respiratory chain intact. Reconstructing the
    patient V122M substitution in the homologous subunit of Yarrowia lipolytica
    halves Vmax, and the same experiment records altered Km for
    n-decyl-ubiquinone and altered I50 for hydrophobic complex I inhibitors -
    both quinone-site readouts. The authors take this as evidence that
    nuclear-coded subunits, not only the hydrophobic mitochondrially coded ones,
    participate in the reaction with ubiquinone, which is precisely the claim the
    upstream Q-module node makes structurally.

    The fibroblast panel that includes an NDUFS7 line adds the
    amount-versus-activity decomposition: in controls the ratio of complex I
    activity to complex I amount is one, and in patients it is below one, so the
    enzyme that does assemble is intrinsically less catalytically competent. The
    deficiency is quantitative and qualitative at once, which is what a core
    Q-module subunit defect predicts.

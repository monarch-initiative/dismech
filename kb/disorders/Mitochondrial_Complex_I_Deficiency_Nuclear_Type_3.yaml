- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic NDUFS7 variants. Every well-characterised report is homozygous: the
    1999 sibling pair, the consanguineous R145H family whose parents were
    heterozygous carriers, the consanguineous family with the cryptic-exon
    intronic allele, and the homozygous R105C families in the optic-atrophy
    series. Sibling recurrence with unaffected parents is the recurring pedigree
    shape, and it is reproduced in the canine model, where the variant
    co-segregated in a litter exactly as a monogenic recessive trait predicts.
  evidence:
  - reference: PMID:17275378
    reference_title: "A novel mutation in the human complex I NDUFS7 subunit associated with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parents were heterozygous carriers for this mutation.
    explanation: >-
      Carrier parents of a homozygous affected child, the defining segregation
      pattern of autosomal recessive inheritance.
  - reference: PMID:17604671
    reference_title: "A novel mutation of the NDUFS7 gene leads to activation of a cryptic exon and impaired assembly of mitochondrial complex I in a patient with Leigh syndrome."
    supports: SUPPORT

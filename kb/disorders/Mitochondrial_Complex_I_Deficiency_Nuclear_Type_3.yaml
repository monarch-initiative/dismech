        as the histological substrate.
      evidence:
      - reference: PMID:38316835
        reference_title: "NDUFS7 variant in dogs with Leigh syndrome and its functional validation in a Drosophila melanogaster model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Brain MRI showed characteristic bilateral symmetrical T2 hyperintense
          lesions, histologically representing encephalomalacia.
        explanation: >-
          The imaging and histological measurement behind this readout.
    - name: Mitochondrial accumulation in skeletal muscle
      target: Basal Ganglia and Brainstem Vulnerability
      direction: INCREASED
      interpretation: >-
        A tissue-level marker of mitochondrial disease, showing the lesion is not
        confined to brain even where the clinical picture is.
      evidence:
      - reference: PMID:38316835
        reference_title: "NDUFS7 variant in dogs with Leigh syndrome and its functional validation in a Drosophila melanogaster model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Muscle histopathology revealed accumulation of mitochondria.
        explanation: >-
          The muscle histopathology measurement behind this readout.
    evidence:
    - reference: PMID:38316835
      reference_title: "NDUFS7 variant in dogs with Leigh syndrome and its functional validation in a Drosophila melanogaster model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results show the potential of the fruit fly as a model for canine
        disease allele validation and establish NDUFS7:p.(Val179Met) as causative
        variant for the investigated canine Leigh syndrome.
      explanation: >-
        Establishes the variant as causative for the canine disease, which is
        what licenses treating this model as informative for the human node.
- name: Drosophila ND-20 knockdown rescued with wild-type or mutant canine NDUFS7
  species: Drosophila melanogaster
  genotype: >-
    Ubiquitous RNAi knockdown of ND-20 (fly NDUFS7 orthologue), rescued by
    overexpression of wild-type or p.Val179Met canine NDUFS7
  publication: PMID:38316835
  description: >-
    An allele-validation assay rather than a disease model. Knockdown of the fly
    NDUFS7 orthologue is lethal; overexpressing wild-type canine NDUFS7 partially
    rescues by shifting lethality to a later developmental stage, and the mutant
    protein does not. The read-out is a difference between two constructs, not a
    disease phenotype.
  modeled_mechanisms:
  - target: NDUFS7 Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Tests whether the patient-equivalent allele retains NDUFS7 function, by
      asking whether it can substitute for the endogenous orthologue.
    limitations: >-
      Neither construct fully rescued lethality, so the assay measures a
      difference in partial rescue rather than function versus no function. It
      uses overexpression of a canine protein in an invertebrate, tests the canine
      rather than a human allele, and reports developmental lethality rather than
      any neurological or bioenergetic phenotype.
    readouts:
    - name: Developmental stage at lethality following ND-20 knockdown
      target: NDUFS7 Loss of Function
      direction: RESTORED
      interpretation: >-
        Wild-type NDUFS7 delays lethality to later development; the mutant does
        not, indicating the variant impairs the subunit's function.
      evidence:
      - reference: PMID:38316835
        reference_title: "NDUFS7 variant in dogs with Leigh syndrome and its functional validation in a Drosophila melanogaster model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, a partial rescue was found upon overexpression of wildtype
          NDUFS7, where pupal lethality was moved to later developmental stages,
          which was not seen upon canine mutant overexpression, thus providing
          additional evidence for the pathogenicity of the identified variant.
        explanation: >-
          The differential-rescue measurement, with the authors' own partial
          qualifier intact.
    evidence:
    - reference: PMID:38316835
      reference_title: "NDUFS7 variant in dogs with Leigh syndrome and its functional validation in a Drosophila melanogaster model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Neither of the investigated overexpression lines completely rescued the
        lethality upon knockdown of the endogenous ND-20.
      explanation: >-
        The limitation stated by the authors themselves, which is why this link is
        PARTIALLY_RECAPITULATES with LOW fidelity rather than a clean functional
        validation.
experimental_models:
- name: Yarrowia lipolytica complex I carrying the PSST V122M patient substitution
  experimental_model_type: OTHER
  description: >-
    The patient V122M substitution reconstructed in the PSST homologue of the
    obligate aerobic yeast Yarrowia lipolytica, whose complex I can be assayed in
    isolated mitochondrial membranes. It is the cleanest available separation of
    the allele's catalytic effect from everything else about a patient cell, and
    it is what first showed that a nuclear-coded subunit participates in the
    reaction with ubiquinone.
  modeled_mechanisms:
  - target: Defective NADH-to-Ubiquinone Electron Transfer
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reconstructing the patient allele in a yeast complex I halves Vmax and
      shifts the Km for decyl-ubiquinone, isolating a quinone-reaction defect.
    limitations: >-
      A yeast enzyme carrying an engineered substitution at the homologous
      position, not the human enzyme; the residue numbering and sequence context
      differ. The measured Vmax reduction of about 50% is far milder than the
      near-complete deficiency seen in patient tissue, so the model captures the
      direction of the lesion rather than its magnitude.
    readouts:
    - name: Complex I Vmax in isolated mitochondrial membranes
      target: Defective NADH-to-Ubiquinone Electron Transfer
      direction: DECREASED
      interpretation: >-
        The catalytic capacity of the enzyme carrying the patient substitution.
      evidence:
      - reference: PMID:11004438
        reference_title: "Application of the obligate aerobic yeast Yarrowia lipolytica as a eucaryotic model to analyse Leigh syndrome mutations in the complex I core subunits PSST and TYKY."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Mitochondrial membranes from Y. lipolytica strains carrying any of the
          three point mutations exhibited similar complex I defects, with V(max)
          being reduced by about 50%.
        explanation: >-
          The kinetic measurement behind this readout.
    - name: Km for n-decyl-ubiquinone
      target: Defective NADH-to-Ubiquinone Electron Transfer
      direction: ALTERED
      interpretation: >-
        A quinone-site-specific readout, altered by a mutation in a nuclear-coded
        subunit.
      evidence:
      - reference: PMID:11004438
        reference_title: "Application of the obligate aerobic yeast Yarrowia lipolytica as a eucaryotic model to analyse Leigh syndrome mutations in the complex I core subunits PSST and TYKY."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In addition changes in the K(m) for n-decyl-ubiquinone and I(50) for
          hydrophobic complex I inhibitors were observed
        explanation: >-
          The quinone-binding measurements behind this readout.
    evidence:
    - reference: PMID:11004438
      reference_title: "Application of the obligate aerobic yeast Yarrowia lipolytica as a eucaryotic model to analyse Leigh syndrome mutations in the complex I core subunits PSST and TYKY."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We have used the obligate aerobic yeast Yarrowia lipolytica to
        reconstruct and analyse three missense mutations in the nuclear coded
        subunits homologous to bovine TYKY and PSST of mitochondrial complex I
      explanation: >-
        Establishes what the model is and that it carries the patient
        substitutions, which is what makes it informative for this node.
- name: Galactose-stressed Leigh syndrome patient fibroblasts (NDUFS7 line)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Patient fibroblasts, including a line carrying the founding NDUFS7 allele,
    cultured in a pyruvate-free medium with galactose substituted for glucose so
    that glycolytic compensation cannot mask the bioenergetic deficit. Under those
    conditions the patient cells die and control cells do not, and the rescue
    profile identifies redox rather than carbon supply as the limiting problem.
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Unmasks the bioenergetic deficit of complex I-deficient patient cells by
      removing the glycolytic escape route.
    limitations: >-
      The NDUFS7 line is one of three patient lines in a panel and the reported
      results are largely aggregated across them, so the NDUFS7-specific
      contribution is not separable from the NDUFS8 and NDUFV1 lines. Fibroblasts
      are also not the affected tissue, and galactose stress is a
      non-physiological challenge rather than a model of clinical decompensation.
    readouts:
    - name: Cell survival in galactose, pyruvate-free medium
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: DECREASED
      interpretation: >-
        Patient cells cannot survive without glycolytic compensation; control
        cells can.
      evidence:
      - reference: PMID:30429455
        reference_title: "Rescue from galactose-induced death of Leigh Syndrome patient cells by pyruvate and NAD()."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Following optimization of the cell culture protocol, LS fibroblasts
          died in the galactose medium, whereas control cells did not.
        explanation: >-
          The survival measurement behind this readout.
    - name: Rescue of galactose-induced death by NAD+-regenerating substrates
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: RESTORED
      interpretation: >-
        Substrates that restore cytosolic NAD+ regeneration rescue; others do
        not, which localises the limiting problem to redox balance.
      evidence:
      - reference: PMID:30429455
        reference_title: "Rescue from galactose-induced death of Leigh Syndrome patient cells by pyruvate and NAD()."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          LS cell death was dose-dependently inhibited by pyruvate, malate,
          oxaloacetate, α-ketoglutarate, aspartate, and exogenous NAD+ (eNAD), but
          not by lactate, succinate, α-ketobutyrate, and uridine.
        explanation: >-
          The rescue profile, including the substrates that did not work, which is
          what makes the interpretation specific.
    evidence:
    - reference: PMID:30429455
      reference_title: "Rescue from galactose-induced death of Leigh Syndrome patient cells by pyruvate and NAD()."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These cell lines harbored mutations in nuclear DNA (nDNA)-encoded CI genes
        (NDUFS7, NDUFS8, NDUFV1) and, to prevent glycolysis upregulation, were
        cultured in a pyruvate-free medium in which glucose was replaced by
        galactose.
      explanation: >-
        Confirms an NDUFS7 line is in the panel and states the design choice that
        makes the model informative.
- name: NDUFS7-mutant HEK293T cells
  experimental_model_type: CELL_LINE
  description: >-
    An engineered NDUFS7 mutation in HEK293T cells, used to ask what limits cell
    death in complex I deficiency. Loss of the subunit reduces proliferation and
    raises death and oxidative-stress susceptibility; upregulated SLC7A11 imports
    cystine and raises glutathione, and that response measurably restrains the
    death. It is the only NDUFS7-specific cellular model in the literature and the
    only one that identifies a compensatory pathway.
  modeled_mechanisms:
  - target: Isolated Complex I Deficiency and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the oxidative-stress vulnerability of NDUFS7 loss in a
      genetically defined cell background.
    limitations: >-
      HEK293T is an immortalised, transformed embryonic kidney line with a
      glycolytic metabolic phenotype and no relationship to the neurons or retinal
      ganglion cells that fail in patients. The mutation is engineered rather than
      a patient allele, and cell proliferation and death are not the clinical
      endpoints.
    readouts:
    - name: Cell death and oxidative-stress susceptibility
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: INCREASED
      interpretation: >-
        Loss of NDUFS7 alone is sufficient to raise cell death and sensitivity to
        oxidative stress.
      evidence:
      - reference: PMID:38823363
        reference_title: "SLC7A11-mediated cystine import protects against NDUFS7 deficiency-induced cell death in HEK293T cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the absence of NDUFS7 resulted in reduced cell proliferation, elevated
          cell death, and increased susceptibility to oxidative stress
        explanation: >-
          The measurement behind this readout.
    - name: Cell death after SLC7A11 upregulation
      target: Isolated Complex I Deficiency and Bioenergetic Failure
      direction: DECREASED
      interpretation: >-
        Cystine import and glutathione synthesis limit the death caused by NDUFS7
        loss, identifying an endogenous compensatory pathway.
      evidence:
      - reference: PMID:38823363
        reference_title: "SLC7A11-mediated cystine import protects against NDUFS7 deficiency-induced cell death in HEK293T cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the increased expression of SLC7A11 enhanced cystine import, which
          subsequently reduced cell death by promoting the biosynthesis of reduced
          glutathione (GSH)
        explanation: >-
          The rescue measurement and its proposed mechanism.
    evidence:
    - reference: PMID:38823363
      reference_title: "SLC7A11-mediated cystine import protects against NDUFS7 deficiency-induced cell death in HEK293T cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we introduced a mutation in NDUFS7, a crucial subunit of CI, in HEK293T
        cells
      explanation: >-
        Establishes that the model carries an NDUFS7 lesion specifically.
treatments:
- name: Idebenone and Coenzyme Q10 Analogues for Optic Atrophy
  description: >-
    Idebenone, coenzyme Q10, riboflavin and ubidecarenone were given at variable
    doses to patients in the optic-atrophy series. Curated with its outcome
    attached, which is the reason it is worth curating at all: visual improvement
    was variable and only three of thirteen patients showed any degree of response
    to idebenone. That is a real but small effect in a small, uncontrolled,
    genetically mixed series, and it should not be read as evidence that idebenone
    works in NDUFS7 disease specifically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  target_mechanisms:
  - target: Defective NADH-to-Ubiquinone Electron Transfer
    treatment_effect: MODULATES
    description: >-
      Short-chain quinone analogues are given on the rationale that they can
      shuttle electrons into complex III and bypass a defective complex I, which
      is the step this entity's lesion blocks. The rationale is mechanistic; the
      clinical result recorded below is equivocal.
  evidence:
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pharmacological treatments for OA included idebenone, CoQ10, riboflavin and
      ubidecarenone at variable dosages. Visual improvement was variable, with
      only 3 of 13 patients showing some degree of response to idebenone
      treatment
    explanation: >-
      Supports that these agents are used in practice, and records the minority
      response rate that goes with them. It is an uncontrolled series spanning
      several genes, so it does not establish efficacy in NDUFS7 disease.
diagnosis:
- name: Respiratory chain enzymology showing isolated complex I deficiency
  description: >-
    The entry point. Isolated complex I deficiency in muscle or fibroblasts, with
    the other respiratory chain complexes normal, is what identifies these
    patients as a group before any gene is named. It does not identify the gene:
    isolated complex I deficiency is the most frequent OXPHOS disorder of infancy
    and childhood and is genetically heterogeneous.
  evidence:
  - reference: PMID:15576045
    reference_title: "Clinical and molecular findings in children with complex I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Isolated complex I deficiency, the most frequent OXPHOS disorder in infants
      and children, is genetically heterogeneous.
    explanation: >-
      States both the diagnostic value of the finding and its limit - it defines a
      group, not a gene.
- name: Sequencing strategies that reach intronic NDUFS7 alleles
  description: >-
    Two of the reported NDUFS7 pedigrees carry intronic variants, one of them deep
    in the first intron (c.17-1167C>G) and acting by creating a cryptic exon. A
    coding-only analysis will not find them. The first such family was solved by
    genotyping microsatellite markers at candidate loci, before exome sequencing
    was routine; the second by whole exome sequencing that captured a variant five
    bases into an intron. The practical point stands regardless of era: a complex
    I-deficient patient with no coding variant found is not a patient in whom
    NDUFS7 has been excluded.
  evidence:
  - reference: PMID:17604671
    reference_title: "A novel mutation of the NDUFS7 gene leads to activation of a cryptic exon and impaired assembly of mitochondrial complex I in a patient with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By genotyping several putative disease loci using microsatellite markers we
      were able to describe a new NDUFS7 mutation in a consanguineous family with
      Leigh syndrome and isolated complex I deficiency.
    explanation: >-
      The approach that found the first intronic allele, in a family where
      coding-sequence analysis would not have.
  - reference: PMID:39894241
    reference_title: "Novel intronic variant in NDUFS7 gene results in mitochondrial complex I assembly defect with early basal ganglia and midbrain involvement with progressive neuroimaging findings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing was carried out to identify the causative variant.
    explanation: >-
      Records the method that identified the second, splice-region allele.
differential_diagnoses:
- name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
  description: >-
    MC1DN3 cannot be separated from its sibling entities clinically or
    biochemically - only by genotype. The differential spans 38 nuclear-encoded
    subunits plus a growing list of assembly factors, and this knowledge base
    already carries several members (NDUFS8, NDUFS2, NDUFA1, NDUFA12, NDUFB9). A
    distinction that may eventually matter for NDUFS7 specifically: it is a core
    Q-module subunit, so its lesion has a catalytic component on top of the
    reduced-amount component that accessory-subunit defects produce alone. That
    shows on a combined amount-and-activity assay and has no established clinical
    correlate.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Causative genetic defects may involve the seven mitochondrial-encoded or 38
      nuclear-encoded subunits of the enzyme, or any of an increasing number of
      assembly factors implicated in the correct biosynthesis of complex I within
      the inner mitochondrial membrane.
    explanation: >-
      Establishes the size of the differential.
- name: Mitochondrial-DNA-encoded complex I deficiency
  description: >-
    About a quarter of complex I deficiency is caused by mitochondrial DNA
    mutations, with maternal inheritance, heteroplasmy and recurrence-risk
    implications entirely different from a nuclear recessive disorder.
    Distinguishing them changes the counselling more than it changes the
    management. It matters here in a second way as well: the optic-atrophy
    presentation of NDUFS7 disease is clinically indistinguishable from
    mitochondrially inherited Leber hereditary optic neuropathy, so an
    mtDNA-negative LHON phenotype should not close the mitochondrial
    investigation.
  evidence:
  - reference: PMID:22972949
    reference_title: "Complex I deficiency: clinical features, biochemistry and molecular genetics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately 25% of cases have mitochondrial DNA mutations, while a further
      ∼25% have mutations in a nuclear subunit or in one of nine known assembly
      factors.
    explanation: >-
      Quantifies the mitochondrial-genome arm of the differential.
  - reference: PMID:41234160
    reference_title: "Recessive variants in mitochondrial complex I nuclear subunits are an underrated cause of optic atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we highlight the possibly underestimated prevalence of CI nuclear subunits
      in the molecular diagnosis of ION, prompting the inclusion of all CI-related
      genes in the standard diagnostic screening
    explanation: >-
      The authors' own recommendation, and the practical consequence of the
      nuclear-versus-mitochondrial ambiguity in an optic-neuropathy workup.
discussions:
- discussion_id: ndufs7_variant_position_needs_biochemical_test
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell and Optic Nerve Vulnerability
  - mechanistic_hypotheses#ndufs7_variant_position_determines_phenotype
  prompt: >-
    Do the NDUFS7 N-terminal variants associated with isolated optic atrophy
    produce a measurably different biochemical defect from the Leigh-associated
    variants clustered near cluster N2?
  rationale: >-
    The spatial segregation of the two variant groups is a structural observation
    supported by folding predictions, not by enzymology. Nobody has yet measured
    complex I assembly and activity side by side in cells carrying an N-terminal
    allele and a cluster-N2-adjacent allele. Until that is done, the
    position-determines-phenotype hypothesis remains a plausible reading of a
    variant map. The Yarrowia reconstruction and the PSST-loop mutagenesis system
    are both capable of the comparison.
  proposed_experiments:
  - experiment_id: ndufs7_paired_allele_biochemistry
    name: Paired biochemical characterisation of N-terminal versus Q-site NDUFS7 alleles
    description: >-
      Introduce a Leigh-associated allele (R145H) and an optic-atrophy-associated
      allele (R105C) into the same cellular background, and measure assembled
      complex I amount, complex I activity, and the activity-to-amount ratio in
      parallel.
    would_support:
    - mechanistic_hypotheses#ndufs7_variant_position_determines_phenotype
    supporting_outcome:
    - >-
      The N-terminal allele produces a milder or qualitatively different defect -
      for example reduced assembly with preserved intrinsic activity - while the
      Q-site allele reduces the activity-to-amount ratio.
    would_refute:
    - mechanistic_hypotheses#ndufs7_variant_position_determines_phenotype
    refuting_outcome:
    - >-
      The two alleles produce indistinguishable biochemical defects, which would
      place the clinical difference outside NDUFS7 and point at modifiers.
- discussion_id: ndufs7_natural_history_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#
  prompt: >-
    What is the natural history of NDUFS7-related disease across its reported
    range, and does the optic-atrophy arm ever progress to Leigh syndrome?
  rationale: >-
    The human literature is a handful of pedigrees reported one or two at a time
    across twenty-seven years, with no cohort study and no systematic follow-up.
    Age of onset, survival, and whether the optic-atrophy patients later develop
    basal ganglia disease are all unknown. The sibling entity NDUFA12 turned out
    to require visual surveillance in patients who presented with motor features
    alone; whether the reverse surveillance is needed here has not been asked.
- discussion_id: ndufs7_canine_allele_not_human
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Dog
  prompt: >-
    Does the canine p.Val179Met model represent human NDUFS7 disease, given that
    the allele has never been reported in a human patient?
  rationale: >-
    The dogs reproduce the clinical and imaging phenotype convincingly and supply
    histology no human case report offers. But the variant is canine-specific, at
    a residue position with no reported human counterpart, and its consequences
    were assessed by differential rescue in a fly rather than by measuring complex
    I in the affected animals. The model may therefore be recapitulating Leigh
    syndrome as a syndrome while diverging from the specific molecular lesion of
    human MC1DN3.
  proposed_experiments:
  - experiment_id: ndufs7_canine_respiratory_chain_enzymology
    name: Respiratory chain enzymology in NDUFS7-mutant canine tissue
    description: >-
      Measure complex I activity and assembled complex I amount in muscle or
      fibroblasts from NDUFS7 p.Val179Met homozygous dogs, and compare the
      activity-to-amount ratio with that reported in human NDUFS7 patient
      fibroblasts.
    would_support:
    - pathophysiology#Defective NADH-to-Ubiquinone Electron Transfer
    supporting_outcome:
    - >-
      An isolated complex I deficiency with an activity-to-amount ratio below one,
      matching the human biochemical signature.
    refuting_outcome:
    - >-
      Normal complex I activity, or a combined respiratory chain defect, either of
      which would mean the canine phenotype arises by a different route.
notes: >-
  Three things a reader should not over-read in this entry.

  The dog and the fly are the only whole-organism models available, and neither
  carries a human allele. No mouse model of NDUFS7 deficiency appeared in the
  literature searched for this entry, which is a real gap given how heavily the
  sibling entity NDUFS4 relies on one.

  A 2004 cohort reported a child with neonatal cardiomyopathy carrying a complex
  rearrangement in a single NDUFS7 allele, and raised the possibility of
  unconventional inheritance in complex I defects. That case is deliberately not
  curated as a phenotype of this entity: a monoallelic finding with no second hit
  identified does not establish MC1DN3, and importing the cardiomyopathy on its
  strength would attribute a phenotype to the disease that no biallelic patient
  has been reported with. It is recorded here so the next curator does not have to
  rediscover it.

  Several clinical details of the founding cases - onset between 11 and 26 months,
  dysarthria, feeding difficulty, hepatomegaly - appear in the OMIM clinical
  synopsis and in the deep-research report, but not in any abstract or full text in
  the reference cache. They are omitted rather than cited to a source that does not
  contain them. Anyone with access to the 1999 Annals of Neurology full text can
  add them properly.

  description: >-
    Cellular oxidative phosphorylation capacity falls and reactive oxygen species
    rise. Both arms of the module node are evidenced here rather than only one: an
    NDUFS7-containing fibroblast panel shows raised ROS alongside reduced complex
    I activity and amount, and an engineered NDUFS7 mutation in HEK293T cells
    produces reduced proliferation, elevated cell death and increased
    susceptibility to oxidative stress.

    Two caveats a curator should carry forward. First, cultured cells hide the
    deficit: complex I-deficient cells upregulate glycolysis to replace the lost
    mitochondrial ATP, and that adaptation masks other consequences - which is why
    the NDUFS7 line only dies when glucose is replaced by galactose in a
    pyruvate-free medium. The clinical counterpart is decompensation under
    catabolic stress. Second, the cells are not defenceless: upregulated SLC7A11
    imports cystine and raises glutathione, and that response measurably limits
    the cell death caused by NDUFS7 deficiency.

    Conformance note: the module's upstream node - age-related mitochondrial
    damage and mtDNA mutation - does not apply to a primary nuclear-gene subunit
    defect, so conformance is declared at this node alone.

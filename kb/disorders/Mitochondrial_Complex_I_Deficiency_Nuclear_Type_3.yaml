biochemical:
- name: Assembled complex I quantity on native gel electrophoresis
  notes: >-
    Blue native or native gel analysis of the respiratory chain complexes. The
    diagnostic value is in the contrast rather than in the single number: fully
    assembled complex I falls while the other complexes are unchanged, which is
    what makes the defect isolated and points the analysis at a complex I subunit
    or assembly factor rather than at a global mitochondrial problem.
  evidence:
  - reference: PMID:17604671
    reference_title: "A novel mutation of the NDUFS7 gene leads to activation of a cryptic exon and impaired assembly of mitochondrial complex I in a patient with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the assembly state of the respiratory chain complexes under
      native condition revealed a marked decrease of fully assembled complex I
      while the quantity of the other complexes was not altered.
    explanation: >-
      The measurement and its internal control - other complexes unchanged - in
      one sentence.
- name: Complex I activity relative to assembled complex I amount in fibroblasts
  notes: >-
    A ratio rather than a level, and the more informative of the two measurements.
    In control fibroblasts complex I enzymatic activity divided by complex I
    amount is one; in fibroblasts from children with nuclear complex I subunit
    defects including NDUFS7 it falls below one. Enzyme that is present is not
    fully working, which separates an intrinsic catalytic defect from a shortage
    of enzyme and is exactly what a Q-module core subunit lesion predicts.
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast

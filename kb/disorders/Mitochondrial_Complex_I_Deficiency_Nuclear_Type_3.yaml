- name: Loss of Q-Module Integrity at the Cluster N2 and CoQ Binding Site
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    What NDUFS7/PSST actually does, and the reason a missense allele here is not
    equivalent to losing an accessory subunit. Complex I transfers two electrons
    from NADH to FMN and then one at a time along a ninety-five-angstrom chain of
    seven conserved iron-sulfur clusters to a quinone-binding site at the
    interface with the membrane domain. That site is unusually long, narrow and
    enclosed, and the quinone headgroup binds at its deep end, immediately
    adjacent to cluster N2 - the cluster that donates the electrons. NDUFS7 sits
    at the junction between the peripheral and membrane arms and contributes to
    forming that site.

    The functional consequence has been isolated experimentally. Mutating
    conserved residues in the PSST loop that faces the roughly thirty-angstrom
    Q-binding tunnel causes a drastic decrease in quinone reductase activity
    despite full assembly of the complex, and molecular dynamics of the arginine
    variants shows the bound quinone being ejected from the site near N2. This is
    a catalytic lesion, separable from the assembly lesion that the truncating
    alleles produce.

    fibroblasts and skeletal muscle, and does it explain human survival?
  attaches_to:
  - "pathophysiology#Impaired Autophagosome Formation and Autophagic Flux"
  rationale: >-
    Loss of mammalian ATG7 is classically regarded as rendering cells and tissues
    autophagy-deficient, and ATG7 has no known functional paralogue. Yet autophagic
    sequestration in these patients was markedly reduced rather than abolished, with
    basal autophagy readily identified in two tissues. Whether this reflects an
    ATG7-independent (non-canonical) autophagy route, residual hypomorphic ATG7
    activity from the specific variants, or an assay limitation is unresolved, and the
    answer bears directly on whether autophagy-augmenting therapy could have a
    substrate to act on. Curators should not annotate this disorder as complete loss of
    autophagy.
  proposed_experiments:
  - experiment_id: atg7_noncanonical_flux_dissection
    name: Dissection of ATG7-independent autophagic flux in patient tissue
    description: >-
      Quantitative flux assays in patient-derived fibroblasts and myotubes under
      lysosomal inhibition, comparing complete ATG7-null backgrounds with the patient
      variants, to establish whether residual sequestration is ATG7-independent or
      reflects hypomorphic residual enzyme activity.
- discussion_id: atg7_mouse_human_survival_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do Atg7-null mice die within 24 hours of birth while humans with severe loss or
    complete absence of ATG7 survive into adulthood?
  attaches_to:
  - "pathophysiology#Loss of ATG7 E1-Like Activating Enzyme Function"
  rationale: >-
    The mouse model and the human disorder disagree on the most basic endpoint,
    viability. Systemic ablation of core ATG genes in mice causes embryonic or perinatal
    lethality, and Atg7-null mice die within 24 hours of birth; the reported patients
    include a 34-year-old and a 28-year-old. The mouse is therefore informative for the
    tissue-level consequences — conditional Atg7 ablation reproduces the brain
    abnormalities, hypotonia and muscle weakness — but is not a valid model for the
    natural history or survival of the human disease, and mouse lethality must not be
    imported as a prognostic claim. The gap is wider than the two adults above suggest:
    the authors state that patients can approach population life expectancy, with
    affected members of Family 4 reaching 68 and 71 years of age, despite severe
    attenuation of autophagic flux. This is an evidence-exists-but-may-not-translate
    situation, not an absence of evidence.
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our investigations indicate that patients with this condition can approach
      population life expectancy (affected members of Family 4 have reached 68 and 71
      years of age) despite severe attenuation of autophagic flux.
    explanation: >-
      Quantifies human survival in this disorder, sharpening the mismatch against
      Atg7-null mice that die within 24 hours of birth.
  proposed_experiments:
  - experiment_id: atg7_species_dosage_comparison
    name: Cross-species comparison of residual ATG7 function and dosage tolerance
    description: >-
      Side-by-side quantification of residual ATG7 protein and autophagic flux in
      patient cells versus Atg7-null and hypomorphic mouse tissue, to test whether human
      survival reflects residual human ATG7 activity, a species difference in dependence
      on canonical autophagy, or compensatory pathways absent in mouse.
animal_models:
- name: Conditional tissue-specific Atg7-knockout mouse
  species: Mouse
  genotype: Tissue-specific conditional Atg7 ablation (nerve, muscle)
  publication: PMID:34161705
  description: >
    Conditional Atg7 ablation in nerve and muscle produces ataxia and myopathy
    respectively, and the conditional knockouts reproduce several of the human clinical
    features. Systemic Atg7-null mice, by contrast, die within 24 hours of birth.
  modeled_mechanisms:
  - target: Cerebellar and Callosal Maldevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Conditional Atg7 knockout reproduces the brain abnormalities and the hypotonia and
      muscle weakness seen in patients.
    limitations: >-
      Systemic Atg7-null mice die within 24 hours of birth whereas the patients survive
      into adulthood, so the model does not reproduce the natural history or viability of
      the human disorder. The conditional design also bypasses the developmental context
      in which the human phenotype arises.
    evidence:
    - reference: PMID:34161705
      reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Many of the clinical features observed in these patients are recapitulated in the
        conditional Atg7-knockout mouse models, including brain abnormalities
      explanation: >-
        States the extent to which the conditional mouse recapitulates the human
        phenotype, supporting a PARTIALLY_RECAPITULATES relationship.
notes: >-
  Curated from the defining report of ATG7-related disease (PMID:34161705, Collier et al.,
  N Engl J Med 2021), which describes 12 patients from 5 families and remains the primary
  source for this disorder.

  Deliberate omissions: no `prevalence`, `progression`, or `treatments` sections. Twelve
  patients have been reported and no disease-specific therapy exists; supportive management
  is not disorder-specific enough to curate as a treatment claim here, and inventing one
  would misrepresent the evidence base.

  Two nuances are curated as discussions rather than flattened into the pathograph: the
  residual basal autophagy detected in patient tissue (so this is not a complete
  autophagy-null state), and the mouse/human viability mismatch. Both are load-bearing for
  anyone reusing this entry.

  Module conformance: the entry DOES conform to
  `disabled_macroautophagy#Failure of Cytoplasmic Quality Control` on its autophagic-flux
  node. That module node is defined by mechanism ("the central effector state that
  disease-specific autophagy lesions converge upon") rather than by age, and the module's
  own description explicitly invites an ATG-pathway mutation as the substituted lesion.
  Conformance is NOT declared to that module's trigger node, `Autophagy Machinery
  Decline`, which is framed as capacity declining "during normal and pathological aging" —
  ATG7 deficiency is a congenital enzymatic loss, not an age-associated decline.

  Two further modules were considered and deliberately NOT declared, for reasons that
  a later curator should not have to rediscover. `loss_of_proteostasis` is framed
  throughout as the age-associated collapse of proteostatic capacity, with
  `Misfolded-Protein Aggregation` as its downstream node; SCAR31 is a congenital
  monogenic disorder and the source reports no protein aggregation in patients, so the
  fit is thematic rather than mechanistic. `cerebellar_purkinje_degeneration` derives its
  `Loss of Cerebellar Cortical Output` node from Purkinje cell dysfunction and
  degeneration; the finding here is cerebellar *hypoplasia*, a developmental deficit, and
  no Purkinje degeneration is demonstrated in patients. Declaring either edge would assert
  a mechanism the evidence does not support and would silently corrupt any grouping
  criterion evaluated over `CONFORMS_TO_MODULE`.

  This entry fills a gap named explicitly in `kb/groupings/Macroautophagy_Deficiency_Disorders.yaml`,
  whose rationale records that the grouping would be sounder if narrowed to the monogenic
  autophagy-machinery disorders — EPG5, WDR45, VCP, SQSTM1, ATG7 — and that those entries
  "are not yet curated in dismech, which is the only reason the narrow version is not the
  one written here". Adding ATG7 to that grouping's members is left to a follow-up so this
  PR stays scoped to one disease.

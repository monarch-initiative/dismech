- name: Cerebellar and Callosal Maldevelopment
  biological_scale: TISSUE
  description: >
    The neurodevelopmental consequence. Every patient with available MRI had cerebellar
    hypoplasia and corpus callosum abnormality, most characteristically a thin posterior
    corpus callosum; in some the effect on brain development was more diffuse, with
    diffuse brain volume loss. Additional structural findings included bilateral
    optochiasmatic atrophy.
  downstream:
  - target: Ataxia and Neurodevelopmental Impairment
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the patients for whom MRI findings were available had cerebellar hypoplasia and
      corpus callosum abnormalities, although in some patients the effect on brain
      development was more diffuse.
    explanation: >-
      Establishes cerebellar hypoplasia and callosal abnormality as the consistent
      structural brain phenotype.
- name: p62/SQSTM1 Cargo Receptor Accumulation
  biological_scale: CELLULAR
  description: >
    p62 (SQSTM1) is the classical autophagy cargo receptor: it recruits cytoplasmic
    cargo to autophagosomes through interaction with LC3-II and is itself degraded after
    autolysosome formation. When LC3-II cannot be generated, p62 is neither consumed nor
    able to deliver cargo, and it accumulates. This is the cardinal cellular readout that
    failed lipidation has actually blocked cargo degradation, and it is the practical
    diagnostic biomarker alongside the LC3-II immunoblot.
  cell_types:
  - preferred_term: myoblast
    term:
      id: CL:0000056
      label: myoblast
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Increased levels of p62 (also known as SQSTM1), a classical autophagy receptor that
      recruits cytoplasmic cargo to autophagosomes through interaction with LC3-II and is
      subsequently degraded after autolysosome formation, were noted in myoblasts from
      Patient 2
    explanation: >-
      Reports p62/SQSTM1 accumulation in patient myoblasts and states its mechanistic
      role, establishing this node.
- name: Skeletal Muscle Dysfunction
  biological_scale: TISSUE
  description: >
    Muscle biopsy showed mild myopathic changes, and patients had proximal muscle
    weakness and hypotonia. Notably the changes are mild: no vacuoles or internalized
    nuclei were present and electron microscopy showed normal muscle-fibre organization,
    so this is not a vacuolar myopathy.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  downstream:
  - target: Ataxia and Neurodevelopmental Impairment
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the muscle-biopsy specimen showed mild myopathic changes. No vacuoles or
      internalized nuclei were present, and transmission electron micrographs showed
      normal organization of muscle fibers
    explanation: >-
      Directly evidences the muscle arm and bounds its severity, which the previous
      bundled node asserted without support.
- name: Endocrine Dysfunction
  biological_scale: TISSUE
  description: >
    Endocrine involvement included late-onset or absent puberty and, in one patient,
    hypogonadotropic hypogonadism with gynecomastia, suggesting a role for ATG7 in human
    endocrine development.
  biological_processes:
  - preferred_term: macroautophagy
    term:
      id: GO:0016236
      label: macroautophagy
    modifier: DECREASED
  downstream:
  - target: Ataxia and Neurodevelopmental Impairment
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATG7 may play a role in human endocrine development: patients from Family 2 had
      late-onset or no puberty, and Patient 5 presented with hypogonadotropic hypogonadism
      and gynecomastia.
    explanation: >-
      Documents the endocrine arm of the phenotype, stated by the authors with
      appropriate hedging ("may play a role").
- name: Ataxia and Neurodevelopmental Impairment
  biological_scale: ORGANISM
  description: >
    The clinical syndrome: mild-to-moderate intellectual disability, motor and language
    developmental delay, ataxia and tremor as common features across families, with axial
    hypotonia and spastic diplegia in some patients and psychiatric involvement in
    others.
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical course for all the surviving siblings has been similar, with
      mild-to-moderate intellectual disability, motor and language developmental delay,
      ataxia, and tremor being common features.
    explanation: >-
      Summarizes the shared clinical phenotype that defines the disorder.

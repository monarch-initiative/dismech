      label: macroautophagy
    modifier: DECREASED
  - preferred_term: autophagosome assembly
    term:
      id: GO:0000045
      label: autophagosome assembly
    modifier: DECREASED
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"

name: Spinocerebellar Ataxia, Autosomal Recessive 31
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
synonyms:
- SCAR31
- ATG7 deficiency
- ATG7-related neurodevelopmental disorder
- Hereditary ataxia due to ATG7 deficiency
description: >
  Spinocerebellar ataxia, autosomal recessive 31 is caused by biallelic deleterious
  variants in ATG7, a core autophagy-related gene encoding an E1-like activating
  enzyme that is indispensable to classical degradative macroautophagy and has no
  known functional paralogue. It is the first described human disorder of the core
  autophagy conjugation machinery.

  ATG7 drives both ubiquitin-like conjugation systems that build the autophagosome:
  it activates ATG12 before conjugation to ATG5, promoting expansion of the
  preautophagosomal phagophore, and it lipidates LC3-I with phosphatidylethanolamine
  to generate LC3-II, which coats the autophagosomal membrane and recruits cytoplasmic
  cargo. Loss of ATG7 therefore collapses autophagosome biogenesis at its committed
  step.

  Twelve patients from five families were reported in the defining 2021 study. The
  phenotype is a complex neurodevelopmental syndrome with brain, muscle and endocrine
  involvement: cerebellar hypoplasia and a thin posterior corpus callosum on
  neuroimaging, ataxia, developmental delay and intellectual disability, facial
  dysmorphism, and variable myopathy, hypogonadotropic hypogonadism, hypertrophic
  cardiomyopathy, ocular abnormality and deafness.

  Two findings complicate the simple "autophagy-null" reading of this disorder and are
  curated explicitly below. First, although autophagic sequestration was markedly
  reduced, evidence of basal autophagy remained readily identifiable in patient
  fibroblasts and skeletal muscle. Second, Atg7-null mice die within 24 hours of birth,
  whereas these patients survive into adulthood — a species discrepancy that the human
  data, not the mouse data, must anchor.

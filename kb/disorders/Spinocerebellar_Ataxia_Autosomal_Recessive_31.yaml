genetic:
- name: ATG7
  gene_term:
    preferred_term: ATG7
    term:
      id: hgnc:16935
      label: ATG7
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Distinct biallelic deleterious ATG7 variants were identified across five families,
    producing a diminishment or complete absence of ATG7 protein. Causality was
    established by complementation: introducing the patient variants into model systems
    gave poor or absent autophagic function compared with reintroduction of wild-type
    ATG7. ATG7 has no known functional paralogue, so the loss cannot be compensated by a
    related enzyme.
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve patients from five families with distinct ATG7 variants had complex
      neurodevelopmental disorders with brain, muscle, and endocrine involvement.
    explanation: >-
      Defines the reported cohort and the multisystem scope of the ATG7 phenotype.
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Complementation of different model systems by deleterious ATG7 variants resulted
      in poor or absent autophagic function as compared with the reintroduction of
      wild-type ATG7.
    explanation: >-
      Complementation testing establishes that the ATG7 variants are causal for the
      autophagy defect rather than incidental.
pathophysiology:
- name: Loss of ATG7 E1-Like Activating Enzyme Function
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: ATG7
      term:
        id: hgnc:16935
        label: ATG7
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Zygosity is deliberately left unset. The reported families carry distinct
      biallelic ATG7 variants spanning homozygous and compound-heterozygous
      configurations, and ZygosityEnum has no BIALLELIC value, so recording a single
      value would misstate the cohort.
  description: >
    Biallelic deleterious ATG7 variants diminish or abolish the ATG7 protein. ATG7 is
    the E1-like activating enzyme at the head of both ubiquitin-like conjugation systems
    that build the autophagosome, and it has no known functional paralogue, so its loss
    is not buffered.
  molecular_functions:

    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found deleterious, recessive variants in human ATG7, a core autophagy-related
      gene encoding a protein that is indispensable to classical degradative autophagy.
    explanation: >-
      Identifies the causal lesion and states that the affected protein is
      indispensable to degradative autophagy.
- name: Failure of ATG12-ATG5 Conjugation and LC3 Lipidation
  biological_scale: MOLECULAR
  description: >
    ATG7 activates ATG12 before its conjugation to ATG5, which promotes expansion of the
    preautophagosomal phagophore, and it facilitates lipidation of LC3-I with
    phosphatidylethanolamine to generate LC3-II. LC3-II sits on the inner and outer
    autophagosomal membranes and recruits cytoplasmic cargo directly or through
    selective adaptor proteins. Without ATG7 both conjugation systems fail, so the
    phagophore cannot expand and cargo cannot be marked for capture.
  biological_processes:
  - preferred_term: protein lipidation involved in autophagosome assembly
    term:
      id: GO:0061739
      label: protein lipidation involved in autophagosome assembly
    modifier: DECREASED
  downstream:
  - target: Impaired Autophagosome Formation and Autophagic Flux
  evidence:
  - reference: PMID:34161705
    reference_title: "Developmental Consequences of Defective ATG7-Mediated Autophagy in Humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ATG7 also facilitates lipidation of the protein LC3-I with phosphatidylethanolamine
      to generate LC3-II, which is found on the inner and outer autophagosomal membranes
      and recruits cytoplasmic cargo to the autophagosome either directly or through
      selective adaptor proteins
    explanation: >-
      States the biochemical step ATG7 performs, whose loss is the proximate mechanism
      of this disorder.
- name: Impaired Autophagosome Formation and Autophagic Flux
  biological_scale: CELLULAR
  description: >
    Patient cells show impaired autophagic flux and markedly reduced autophagic
    sequestration. Importantly this is a severe reduction, not a complete abolition:
    evidence of basal autophagy was readily identified in patient fibroblasts and
    skeletal muscle despite loss of ATG7. This residual activity is the likely
    explanation for human survival and is curated as an open question rather than
    asserted as a mechanism.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: myoblast
    term:
      id: CL:0000056
      label: myoblast

pathophysiology:
- name: Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    Pathogenic TUBB2A or TUBB2B variants alter beta-tubulin isotypes that pair
    with alpha-tubulin in heterodimers and co-assemble into microtubules. The
    shared molecular lesion is therefore not an MRI-defined malformation label,
    but beta-tubulin/microtubule apparatus dysfunction during cortical
    development. TUBB2B has stronger published evidence; TUBB2A is retained in
    the same entry because the available cases fit the same beta-tubulin
    heterodimer and cortical dysplasia skeleton rather than a distinct
    pathograph.
  genetic_context:
    functional_impact_category: UNKNOWN
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Disease alleles are heterozygous, predominantly de novo missense
      substitutions. What is directly evidenced for both genes is impaired
      alpha/beta-tubulin heterodimer formation - shown for two TUBB2B
      disease-associated mutations in the founding study, and modeled for the
      recurrent TUBB2A Arg391 E-site hotspot. That finding alone does not
      discriminate the mechanism class: reduced formation of functional
      heterodimers is compatible both with a dominant-negative subunit that
      poisons the polymer (the mechanism resolved for TUBA1A Arg402 and inferred
      for TUBB3) and with a mutant subunit that simply fails to contribute,
      lowering the functional heterodimer pool. UNKNOWN records that the
      question was examined and is unresolved for these two isotypes, rather
      than that it was never annotated. See the
      gap_tubb2ab_functional_impact_class discussion.

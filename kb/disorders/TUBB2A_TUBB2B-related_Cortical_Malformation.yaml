    Brain MRI characterizes the cortical dysgyria and the accompanying callosal,
    basal-ganglia, ventricular, cerebellar, and brainstem malformations. The
    coarse, irregular cortical surfaces and grey-white junction support
    tubulinopathy-associated dysgyria but are not gene-specific, so imaging
    guides rather than replaces molecular confirmation.

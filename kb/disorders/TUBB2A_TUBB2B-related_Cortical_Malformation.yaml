epidemiology:
- name: Ultra-rare prevalence estimate
  description: >-
    Orphanet estimates tubulinopathy-associated dysgyria at fewer than one
    affected person per million; this is an umbrella estimate rather than a
    separately measured TUBB2A-versus-TUBB2B population prevalence.
  unit: persons per 1,000,000 population
  evidence:
  - reference: PMID:33082561
    reference_title: Cross-sectional quantitative analysis of the natural history of TUBA1A and TUBB2B tubulinopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Orphanet estimates a prevalence of <1:1,000,000
      (tubulinopathy-associated dysgyria; Orpha: 467166).
    explanation: The natural-history paper reports the Orphanet umbrella prevalence estimate.
- name: TUBB2B infancy onset and diagnostic delay
  description: >-
    In the literature-derived TUBB2B meta-cohort, symptoms began at a mean age
    of six months but molecular diagnosis was delayed by a mean 12.3 years.
    These are cohort summaries subject to publication and ascertainment bias,
    not prospective population estimates.
  evidence:
  - reference: PMID:33082561
    reference_title: Cross-sectional quantitative analysis of the natural history of TUBA1A and TUBB2B tubulinopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TUBA1A and TUBB2B tubulinopathies usually become symptomatic in infancy
      at an average age of 4 and 6 months, respectively, but a considerable
      diagnostic delay of 4.2 and 12.3 years is observed until a genetic
      diagnosis is established.
    explanation: Quantifies TUBB2B onset and diagnostic delay in the published-case meta-cohort.
pathophysiology:
- name: Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  description: >-
    Pathogenic TUBB2A or TUBB2B variants alter beta-tubulin isotypes that pair
    with alpha-tubulin in heterodimers and co-assemble into microtubules. The
    shared molecular lesion is therefore not an MRI-defined malformation label,
    but beta-tubulin/microtubule apparatus dysfunction during cortical
    development. TUBB2B has stronger published evidence; TUBB2A is retained in
    the same entry because the available cases fit the same beta-tubulin
    heterodimer and cortical dysplasia skeleton rather than a distinct
    pathograph.

      while preserving the entry as a specific beta-tubulin cortical
      malformation mechanism.
  downstream:
  - target: Impaired Microtubule-Dependent Neuronal Migration and Organization
    description: >-
      In vivo TUBB2B depletion directly impairs neuronal migration. The same
      route is plausible but not directly demonstrated for TUBB2A, so the
      shared-entry edge preserves that isotype-specific uncertainty.
    causal_link_type: DIRECT

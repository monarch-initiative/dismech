    explanation: >-
      The first report of probable SUDEP in this disorder, and the reason the
      epilepsy here should be counselled and monitored as a mortality risk rather
      than only as a seizure burden. Note the authors' own hedge - "probable" -
      and that this is a single patient in a 15-patient cohort, so it establishes
      that the risk exists, not its magnitude.
- name: Movement Disorder
  description: >-
    Dystonia and mirror movements (bimanual synkinesia) were reported in a third
    of a 2026 multicentre tubulinopathy cohort spanning seven genes including
    TUBB2A and TUBB2B. Mirror movements are mechanistically interesting here
    because they point at the module's axon-guidance branch - failure of
    corticospinal midline decussation - rather than at the migration branch that
    accounts for the cortical malformation. The cohort figure is across all seven
    genes, so it is not a TUBB2A/TUBB2B-specific frequency and no frequency band
    is asserted.
  phenotype_term:

diagnosis:
- name: Brain MRI pattern recognition
  description: >-
    Brain MRI characterizes the cortical dysgyria and the accompanying callosal,
    basal-ganglia, ventricular, cerebellar, and brainstem malformations. The
    coarse, irregular cortical surfaces and grey-white junction support
    tubulinopathy-associated dysgyria but are not gene-specific, so imaging
    guides rather than replaces molecular confirmation.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Cortical dysgyria with a coarse irregular gyral pattern and characteristic
    extracortical malformations supports a beta-tubulin cortical malformation.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRI reveals a "coarse" appearance with a thick cortex and irregular
      surfaces on both the pial and grey-white junction sides
    explanation: GeneReviews defines the characteristic MRI appearance of tubulinopathy dysgyria.
- name: TUBB2A/TUBB2B molecular genetic testing
  description: >-
    A malformation-of-cortical-development multigene panel can test TUBB2A,
    TUBB2B, and important phenocopies; exome or genome sequencing is appropriate
    when imaging does not identify a single likely gene. Parental testing helps
    establish de novo status and informs recurrence-risk counseling.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of a heterozygous pathogenic TUBB2A or TUBB2B variant in a
    compatible cortical-malformation phenotype establishes the molecular cause.
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular genetic testing approaches can include a combination of
      gene-targeted testing (multigene panel) and comprehensive genomic testing
      (exome sequencing, genome sequencing).
    explanation: GeneReviews supports panel, exome, and genome testing as the molecular diagnostic approaches.
treatments:
- name: Anti-Seizure Medication
  description: >-
    Symptomatic anti-seizure pharmacotherapy is used when epilepsy is present.
    No disease-modifying therapy for the underlying beta-tubulin cortical
    malformation mechanism is established.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Seizures are treated with anti-seizure medications based on the specific seizure type.
    explanation: GeneReviews directly supports seizure-type-directed anti-seizure pharmacotherapy.
- name: Supportive and Rehabilitative Care
  description: >-
    Supportive developmental, physical, occupational, speech, vision, and
    feeding care is the practical management backbone for developmental delay,
    hypotonia, motor impairment, visual/ocular findings, and epilepsy-related
    morbidity.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/books/NBK350554/pdf/Bookshelf_NBK350554.pdf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Supportive management, including an individualized therapy plan that
      includes physical therapy to manage the complications of spasticity,
      occupational therapy, speech therapy, and vision therapy for oculomotor
      deficits and/or strabismus should begin at the time of diagnosis
    explanation: GeneReviews directly supports early multidisciplinary supportive and rehabilitative management.
- name: Genetic Counseling
  description: >-
    Genetic counseling should cover de novo dominant inheritance as the common
    pattern, the possibility of parental mosaicism in apparently sporadic
    disease, prenatal imaging findings, and recurrence-risk uncertainty.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

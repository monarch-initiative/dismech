discussions:
- discussion_id: gap_tubb2ab_lumping_boundary
  prompt: >-
    Should TUBB2A and TUBB2B remain a shared beta-tubulin cortical malformation
    entry, or should additional TUBB2A cases split out a distinct disease
    skeleton?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  - pathophysiology#Tubulinopathy-Associated Dysgyria and Extracortical Malformation Pattern
  rationale: >-
    The original argument for the lump was asymmetry of evidence: TUBB2B had a
    cohort-level natural-history and imaging profile while TUBB2A had only nine
    reported individuals, so a TUBB2A entry would have been a stub. Reviewed
    2026-08-20, that premise no longer holds. TUBB2A now has (i) a 28-patient
    epilepsy cohort with an explicit genotype-phenotype correlation - variants at
    or near the alpha-beta tubulin dimer interface give a higher proportion of
    severe phenotypes such as pachygyria - backed by functional testing of eight
    variants; (ii) a recurrent mutational hotspot at Arg391 in the longitudinal
    E-site heterodimer interface, found in multiple unrelated families; and (iii)
    a phenotype extending to an adult with slowly progressive ataxia and
    preserved ambulation at 40 years, far outside the range this entry curates.
    The lump is NOT thereby refuted - the two genes still share beta-tubulin
    heterodimer biology and a common cortical-dysplasia skeleton, and the
    strongest TUBB2A mechanism finding (disrupted heterodimer formation at the
    dimer interface) is the same lesion class curated for TUBB2B. What has
    changed is that the split decision must now be argued on mechanism rather
    than settled by default on TUBB2A's thin evidence base. The concrete question
    for a future curator: does the TUBB2A dimer-interface hotspot define a
    severity axis that TUBB2B does not share, and is the adult ataxia phenotype a
    TUBB2A-specific mild end or simply an under-ascertained part of both?
  evidence:
  - reference: PMID:33776625
    reference_title: "Expanding the Phenotype of TUBB2A-Related Tubulinopathy: Three Cases of a Novel, Heterozygous TUBB2A Pathogenic Variant p.Gly98Arg."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, there are 9 reported individuals with pathogenic variants
      within the TUBB2A gene
    explanation: >-
      The 2021 evidence base that originally justified the lump: only nine
      reported TUBB2A individuals.
  - reference: PMID:41872443
    reference_title: "TUBB2A related epilepsy: novel variants and genotype-phenotype correlation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical data of 5 epilepsy patients in our cohort and 23 epilepsy
      patients from published studies carrying TUBB2A variants were evaluated.
    explanation: >-
      Supersedes the nine-patient count: TUBB2A now has a 28-patient clinical
      series, so thinness of evidence can no longer carry the lump on its own.
  - reference: PMID:41872443
    reference_title: "TUBB2A related epilepsy: novel variants and genotype-phenotype correlation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Patients with TUBB2A variants that perturb tubulin dimer linkage were
      observed to have a higher proportion of severe phenotypes, such as
      pachygyria.
    explanation: >-
      A TUBB2A-specific genotype-phenotype axis - dimer-interface variants track
      with severity - which is the kind of finding that would justify a split if
      it proves not to hold for TUBB2B.
  - reference: PMID:41080462
    reference_title: A mutational hotspot in TUBB2A associated with impaired heterodimer formation and severe brain developmental disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparative analysis with previously reported TUBB2A de novo variants
      confirmed that this novel recurrent mutation affects a highly conserved
      Arg391 residue within the longitudinal E-site heterodimer interface.
    explanation: >-
      Establishes a recurrent TUBB2A hotspot at a defined structural interface,
      strengthening the TUBB2A arm independently of the shared skeleton.
  - reference: PMID:42050746
    reference_title: A Novel TUBB2A Variant Causing Ataxia With Preserved Ambulation Into Adulthood.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a newly diagnosed case of TUBB2A tubulinopathy with novel
      clinical findings of ataxia with preserved ambulation into adulthood, in
      addition to the already characteristic findings of global developmental
      delay in childhood, cortical malformations, and epilepsy.
    explanation: >-
      Extends the TUBB2A phenotype to a mild adult presentation well outside the
      severity range this entry currently curates.
- discussion_id: gap_tubb2b_uner_tan_boundary
  prompt: >-
    Should the recessive TUBB2B p.Arg390Gln entity (Uner Tan syndrome,
    MONDO:0100144) be curated inside this entry, as its own Disease entry, or
    left as an out-of-scope allele-specific concept?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  - phenotypes#Dysmorphic Basal Ganglia
  rationale: >-
    MONDO:0100144 is an is-a descendant of MONDO:0100153 tubulinopathy and is
    caused by a variant in a gene this entry curates, so on a naive gene-family
    reading it belongs here. Three features argue it does not. First,
    inheritance: it is biallelic in a consanguineous family, an unusual recessive
    mode for missense tubulinopathies, whereas every other allele in this entry
    is heterozygous and de novo. Second, phenotype: the defining finding is
    quadrupedal locomotion with severe cerebellar hypoplasia and an explicit
    ABSENCE of the basal ganglia malformations this entry curates as a core
    TUBB2B feature - the discriminating feature is a negative. Third, mechanism:
    functional analysis showed R390Q does not impair folding, heterodimer
    assembly, or incorporation into microtubule polymers, only increasing
    sensitivity to depolymerizing drugs - which is a much milder lesion than the
    impaired heterodimer formation this entry's trigger node curates for other
    TUBB2B alleles. It is therefore recorded as a relatedMatch mapping rather
    than folded in, and the mapping deliberately does not retire the MONDO
    concept from the curation queue. Note the parallel worth watching: the
    recurrent severe TUBB2A hotspot is Arg391, the structurally equivalent
    residue in the neighbouring isotype, yet it is dominant and severe. Why the
    same position gives a dominant severe phenotype in TUBB2A and a recessive
    cerebellar one in TUBB2B is unexplained and is the sharpest available test of
    this entry's isotype-specificity premise.
  evidence:
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of a consanguineous UTS family identified a biallelic TUBB2B
      mutation, resulting in a p.R390Q amino acid substitution.
    explanation: >-
      Establishes the biallelic, recessive inheritance that separates this
      entity from the heterozygous de novo alleles curated in this entry.
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None, however, displayed the basal ganglia malformations typically
      associated with TUBB2B mutations.
    explanation: >-
      Directly refutes inclusion under this entry's curated phenotype set: the
      dysmorphic basal ganglia curated here as a core TUBB2B feature are absent.
  - reference: PMID:28013290
    reference_title: Uner Tan syndrome caused by a homozygous TUBB2B mutation affecting microtubule stability.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of the R390Q substitution revealed that it did not
      affect the ability of β-tubulin to fold or become assembled into the
      α/β-heterodimer, nor did it influence the incorporation of
      mutant-containing heterodimers into microtubule polymers.
    explanation: >-
      Shows the molecular lesion differs from the impaired heterodimer formation
      curated on this entry's trigger node, supporting a separate entity.
- discussion_id: gap_tubb2ab_functional_impact_class
  prompt: >-
    Do TUBB2A and TUBB2B disease alleles act as dominant-negative subunits that
    poison the microtubule polymer, or by lowering the pool of functional
    alpha/beta heterodimers?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  rationale: >-
    This node records functional_impact_category UNKNOWN, and that value is a
    finding rather than an omission. What is directly evidenced for both genes is
    impaired alpha/beta-tubulin heterodimer formation - shown for two TUBB2B
    disease-associated mutations in the founding study, modeled for the recurrent
    TUBB2A Arg391 E-site variant, and supported functionally for eight TUBB2A
    variants that all altered spindle morphology and microtubule dynamics. That
    observation does not discriminate between the two mechanism classes. A mutant
    subunit that folds and incorporates but degrades a motor-binding surface is
    dominant-negative - the mechanism resolved for TUBA1A Arg402, where dynein
    impairment scales with mutant expression, and inferred for TUBB3, where
    folded mutant heterodimers still polymerize and a subset disrupts kinesin
    binding. A mutant subunit that simply fails to form heterodimers instead
    lowers the functional tubulin pool, which is closer to reduced dose. The
    distinction is not academic: it decides whether isotype-compensation
    strategies such as CRISPRa upregulation of an unaffected beta-tubulin should
    be expected to work for these two genes, since adding wild-type subunits
    dilutes a poisoning allele but does not remove it. Resolving it needs a
    dose-response incorporation assay of the TUBB2A and TUBB2B alleles in a
    common background, of the kind already done for TUBA1A Arg402.
  evidence:
  - reference: PMID:19465910
    reference_title: Mutations in the beta-tubulin gene TUBB2B result in asymmetrical polymicrogyria.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We also show that two disease-associated mutations lead to impaired
      formation of tubulin heterodimers.
    explanation: >-
      The TUBB2B half of what is evidenced - impaired heterodimer formation -
      which is compatible with either mechanism class.
  - reference: PMID:41080462
    reference_title: A mutational hotspot in TUBB2A associated with impaired heterodimer formation and severe brain developmental disorders.
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: >-
      Computational modeling demonstrated that the variant disrupts α/β-tubulin
      heterodimer formation, impairing binding stability at this critical
      interaction site.
    explanation: >-
      The TUBB2A half, and in silico rather than measured, which is a second
      reason the mechanism class is not yet settled.
- discussion_id: gap_tubb2ab_human_organoid_translatability
  prompt: >-
    Do human iPSC-derived cortical organoids reveal TUBB2A/TUBB2B-specific
    progenitor, outer-radial-glia, or migration defects that are not captured by
    clinical imaging, biochemical inference, or rodent/tubulinopathy models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
  - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration and Organization
  rationale: >-
    The Falcon report found human clinical and cohort evidence but no direct
    TUBB2A/TUBB2B organoid or iPSC disease model. Because human cortical
    expansion and outer radial glia are incompletely represented in
    lissencephalic rodents, a human organoid/iPSC experiment is needed to
    decide whether the beta-tubulin skeleton is purely postmitotic
    migration/organization failure or also includes human progenitor
    vulnerability.
  evidence:
  - reference: PMID:28111201
    reference_title: Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, the mouse brain is naturally lissencephalic, suggesting that
      certain aspects of cortical development may not be adequately assessed in
      mice.
    explanation: >-
      Supports treating mouse-to-human translatability as an explicit knowledge
      gap for cortical malformation mechanisms.
  - reference: PMID:28111201
    reference_title: Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly and Reveal Prolonged Mitosis of Outer Radial Glia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We saw a cell migration defect that was rescued when we corrected the MDS
      causative chromosomal deletion
    explanation: >-
      Provides precedent that human iPSC-derived cerebral organoids can detect
      and rescue a lissencephaly-relevant migration defect, motivating a
      TUBB2A/TUBB2B-specific new-approach-model test.
  proposed_experiments:
  - experiment_id: exp_tubb2ab_isogenic_cortical_organoid_migration
    name: TUBB2A/TUBB2B isogenic cortical-organoid migration experiment
    description: >-
      Engineer representative pathogenic TUBB2A and TUBB2B missense variants
      into human iPSCs, correct patient-derived variants where available, and
      compare cortical organoid radial-glial organization, outer-radial-glia
      mitosis, neuronal migration, microtubule dynamics, and cortical layer
      organization across mutant, corrected, and knock-in lines.
    experiment_type:
      preferred_term: patient-derived cortical organoid perturbation experiment
    model_systems:
    - name: TUBB2A/TUBB2B human iPSC-derived cortical organoid
      description: >-
        Three-dimensional human cortical organoid carrying a pathogenic TUBB2A
        or TUBB2B variant, with matched isogenic corrected and knock-in controls.
      experimental_model_type: ORGANOID
      namo_type: namo:Organoid
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: cerebral cortex
        term:
          id: UBERON:0000956
          label: cerebral cortex
      cell_types:
      - preferred_term: radial glial cell
        term:
          id: CL:0000681
          label: radial glial cell
      - preferred_term: migrating cortical neuron
        term:
          id: CL:0000540
          label: neuron
      conditions:
      - TUBB2A/TUBB2B-related cortical malformation
      - polymicrogyria-like cortical dysplasia
      - microtubule-dependent neuronal migration failure
      cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
      culture_system: Three-dimensional cortical organoid with live-imaging migration assays
    perturbations:
    - name: Isogenic TUBB2A/TUBB2B variant correction or knock-in
      target: pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
      description: >-
        Correct a patient variant or knock in a recurrent pathogenic variant to
        separate variant effect from donor genetic background.
    readouts:
    - name: Microtubule dynamics and tubulin heterodimer incorporation
      target: pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
      description: >-
        Quantify microtubule polymerization, stability, and mutant beta-tubulin
        incorporation in cortical progenitors and neurons.
      biological_processes:
      - preferred_term: microtubule cytoskeleton organization
        term:
          id: GO:0000226
          label: microtubule cytoskeleton organization
        modifier: DYSREGULATED
      assays:
      - preferred_term: live-cell imaging assay
      direction: NEGATIVE
    - name: Live-imaging neuronal migration and cortical organization
      target: pathophysiology#Impaired Microtubule-Dependent Neuronal Migration and Organization
      description: >-
        Track DCX-positive neuronal movement, radial-glial scaffold integrity,
        outer-radial-glia mitotic timing, and cortical layer organization.
      biological_processes:
      - preferred_term: neuron migration
        term:
          id: GO:0001764
          label: neuron migration
        modifier: DECREASED
      assays:
      - preferred_term: live-cell imaging assay
      - preferred_term: single-cell transcriptomic profiling
      direction: NEGATIVE
    controls:
    - name: Isogenic corrected organoids
      description: Matched organoids in which the candidate pathogenic variant is corrected.
    - name: Isogenic knock-in organoids
      description: Wild-type-background organoids carrying the introduced pathogenic variant.
    - name: Non-disease donor organoids
      description: Unedited control organoids differentiated and imaged in parallel.
    decision_criterion: >-
      A conserved beta-tubulin migration mechanism is supported if mutant
      organoids show reduced neuronal migration, altered microtubule dynamics,
      or abnormal radial-glial organization that is rescued by correction and
      reproduced by knock-in. A human-specific branch is supported if organoids

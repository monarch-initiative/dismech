    label: tubulinopathy-associated dysgyria
description: >-
  TUBB2A/TUBB2B-related cortical malformation is modeled as a narrow
  beta-tubulin cortical malformation entry, not as a generic tubulinopathy lump.
  The shared pathograph is heterozygous pathogenic variation in beta-tubulin
  isotypes that participate in alpha/beta tubulin heterodimers, leading to
  disturbed microtubule apparatus function during corticogenesis, impaired
  microtubule-dependent neuronal migration and organization, and a
  malformation-of-cortical-development phenotype. TUBB2B is the better
  established arm and is characterized mainly by focal perisylvian or generalized
  polymicrogyria-like cortical dysplasia, often with basal-ganglia/internal
  capsule abnormalities, ventriculomegaly, corpus callosum anomalies, and
  cerebellar or brainstem involvement. TUBB2A evidence is thinner but fits the
  same beta-tubulin cortical malformation skeleton, with reported global
  developmental delay, seizures, cortical dysplasia, dysmorphic corpus callosum,
  hypotonia, and intellectual disability. The entry is separated from TUBA1A
  because TUBA1A has a more lissencephaly/microlissencephaly-centered
  alpha-tubulin pattern, and from TUBB3 because TUBB3 has a distinct
  kinesin/axon-guidance and cranial dysinnervation branch.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014337
      label: complex cortical dysplasia with other brain malformations 5
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      CDCBM5 is MONDO's TUBB2A-specific concept and is curated here as the
      TUBB2A subtype branch of this entry. narrowMatch because this entry's
      disease_term (MONDO:0018763, tubulinopathy-associated dysgyria) spans both
      beta-tubulin genes, so CDCBM5 is one of two concepts subsumed rather than
      an equivalent term.
  - term:
      id: MONDO:0012399
      label: complex cortical dysplasia with other brain malformations 7
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      CDCBM7 is MONDO's TUBB2B-specific concept (synonym "polymicrogyria due to
      TUBB2B mutation") and is curated here as the TUBB2B subtype branch.
      narrowMatch for the same reason as CDCBM5.
  - term:
      id: MONDO:0100144
      label: Uner Tan Syndrome
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO defines Uner Tan Syndrome as a tubulinopathy with material basis in
      TUBB2B characterized by the Arg390Gln variant, quadrupedal locomotion and
      cerebellar hypoplasia WITHOUT basal ganglia malformations. It is a
      TUBB2B allele-specific concept and an is-a descendant of MONDO:0100153,
      but it is deliberately recorded as relatedMatch, not narrowMatch: the
      absence of basal ganglia malformation is the opposite of the dysmorphic
      basal ganglia this entry curates as a core feature, and no Arg390Gln case
      is curated here. relatedMatch therefore does NOT retire the concept from
      the curation queue - it records that the boundary was examined. See the
      gap_tubb2b_uner_tan_boundary discussion.

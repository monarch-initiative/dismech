datasets:
- accession: geo:GSE311549
  title: RNA sequencing for gastric-type endocervical adenocarcinoma (GAS), usual-type endocervical adenocarcinoma (UEA), and lobular endocervical glandular hyperplasia (LEGH)
  description: Cervical cancer is the fourth most common malignancy among women worldwide. While the majority of cases are human papillomavirus (HPV)-associated squamous cell carcinomas, a subset consists of adenocarcinomas. Uterine cervical adenocarcinoma is further classified into gastric-type adenocarcinoma (GAS), usual-type endocervical adenocarcinoma (UEA), and other subtypes. Lobular endocervical glandular hyperplasia (LEGH), a non-neoplastic glandular lesion, has been proposed as a potential precursor of GAS. In this study, we investigated the gene expression profiles of GAS, UEA, and LEGH using RNA sequencing.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 18
  publication: PMID:42361625
  notes: Identified by GEO DataSets index search for Cervical Adenocarcinoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

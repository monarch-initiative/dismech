    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "The KEYNOTE-A18 study has recently been published that examined the efficacy of adding pembrolizumab to standard CRT in patients with high-risk, locally advanced CC (FIGO 2014 stage IB2-IIB with node-positive disease or stage III-IVA). The results revealed an increase in PFS with a HR 0.70 (0.55–0.89, p = 0.0020)"

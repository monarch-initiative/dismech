- category: Neoplastic
  name: Lymphadenopathy
  notes: >-
    Regional pelvic and para-aortic lymph node metastasis is the principal
    locoregional spread route in cervical carcinoma and is strongly associated
    with destructive stromal invasion (such as Silva Pattern C in HPV-associated
    endocervical adenocarcinoma) and reduced survival. Bound to HP:0002716
    (Lymphadenopathy) as the closest available HPO phenotype term because HPO
    has no lymph-node-metastasis or pelvic/para-aortic lymphadenopathy term
    (uv run runoak -i ols:hp search "l~metastasis" returns no terms;
    "l~metastatic" returns only HP:0200059 Metastatic angiosarcoma;
    "l~lymphadenopathy" and "l~lymph node" return general or non-pelvic site
    terms only).
  phenotype_term:
    preferred_term: Pelvic and para-aortic lymphadenopathy from nodal metastasis
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Five-year survival is < 50% in patients with pelvic LN metastasis and < 20–30% in those with PALN metastasis."
    explanation: General cervical cancer guidelines document pelvic and para-aortic lymph node metastasis in cervical carcinoma and quantify its major adverse prognostic impact.

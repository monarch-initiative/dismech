environmental:
- name: High-Risk Human Papillomavirus Infection
  description: >-
    Persistent endocervical infection with oncogenic human papillomavirus
    types—predominantly HPV-16, HPV-18, and HPV-45—drives the HPV-associated
    majority of cervical adenocarcinomas via viral integration and E6/E7
    oncoprotein expression.
  disease_effect: TRIGGERS
  causal_role: COMPONENT_CAUSE
  exposure_term:
    preferred_term: high-risk human papillomavirus infection
    term:
      id: ECTO:2000053
      label: exposure to Human Papillomavirus Infection
  influences_mechanisms:
  - target: HPV E6/E7-Mediated Oncogenesis in Glandular Epithelium
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Persistent high-risk HPV infection of endocervical glandular cells
      introduces viral E6 and E7 oncoproteins that inactivate host p53 and RB1.
    evidence:
    - reference: PMID:39215938
      reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: OTHER
      snippet: "The HPV viral oncoproteins E6 and E7 inactivate p53 and RB1, respectively. This inactivation is associated with the integration of HPV into the host genome, resulting in genomic instability and the accumulation of somatic mutations."
      explanation: General cervical cancer guideline linking high-risk HPV infection to E6/E7-mediated p53 and RB1 inactivation in cervical carcinogenesis.
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Cervical cancer (CC) is the fourth most common cancer and the fourth leading cause of mortality in women worldwide. It is strongly associated with high-risk human papillomavirus infection."
    explanation: General cervical cancer guideline establishing high-risk HPV infection as the primary infectious trigger across HPV-driven cervical carcinomas.
  - reference: DOI:10.1111/his.13995
    reference_title: "Cervical adenocarcinoma: integration of HPV status, pattern of invasion, morphology and molecular markers into classification"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the separation of cervical adenocarcinomas into HPV‐associated (HPVA) and HPV‐independent has resulted in a transformation of the classification system for cervical adenocarcinomas"
    explanation: Confirms high-risk HPV as the etiologic driver of the HPV-associated subgroup of cervical adenocarcinoma.

  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The HPV viral oncoproteins E6 and E7 inactivate p53 and RB1,
      respectively. This inactivation is associated with the integration of HPV
      into the host genome, resulting in genomic instability and the
      accumulation of somatic mutations.
    explanation: >-
      Clinical guideline covering cervical carcinoma across histologies that
      establishes E6/E7-mediated p53 and RB1 inactivation, viral host genome
      integration, and secondary somatic mutagenesis in HPV-driven cervical
      carcinogenesis.
  - reference: DOI:10.1111/his.13995
    reference_title: "Cervical adenocarcinoma: integration of HPV status, pattern of invasion, morphology and molecular markers into classification"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It has become evident that human papillomavirus (HPV) infection does not drive all adenocarcinomas, and appropriate classification is critical for patient management, especially in the era of the HPV vaccine and HPV‐only screening."
    explanation: Park 2020 frames HPV-driven oncogenesis as the dominant but not exclusive mechanism of cervical adenocarcinoma, motivating subclassification by HPV status.

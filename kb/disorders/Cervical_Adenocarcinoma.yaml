- name: PI3K/ERBB2 Mitogenic Signaling Activation
  biological_scale: CELLULAR
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  genetic_context:
    variant_origin: SOMATIC
  description: >-
    Somatic mutations and focal amplifications in PIK3CA (25%) and ERBB2/HER2
    (12%)—identified across endocervical, gastric-type, and other cervical
    carcinoma histologies—drive constitutive PI3K/AKT/mTOR and receptor
    tyrosine kinase proliferative signaling and create actionable precision
    oncology vulnerabilities.

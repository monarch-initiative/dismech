    (NCT04221945) demonstrated that adding pembrolizumab to cisplatin-based
    chemoradiation improves progression-free survival in high-risk locally
    advanced cervical cancer, with adenocarcinoma histology included.
    Pembrolizumab is also approved for recurrent or metastatic PD-L1-positive
    cervical cancer in combination with chemotherapy or as monotherapy after
    prior platinum therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

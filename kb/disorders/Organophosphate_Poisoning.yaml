treatments:
- name: Decontamination and supportive care
  description: >-
    Removal of contaminated clothing, skin and eye decontamination, airway
    protection, oxygen, and hemodynamic support are essential first steps and
    reduce ongoing absorption.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acetylcholinesterase inhibition
    treatment_effect: INHIBITS
    description: Decontamination halts ongoing absorption and further enzyme inhibition.
  evidence:
  - reference: PMID:25455666
    reference_title: "Organophosphate and carbamate poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Decontamination, meticulous supportive care, aggressive antimuscarinic therapy, seizure control, and administration of oximes are cornerstones of management."
    explanation: Supports decontamination and supportive care as cornerstones of management.
- name: Atropine
  description: >-
    Atropine, a competitive muscarinic antagonist, is the primary antidote for
    the muscarinic features (bronchorrhea, bronchospasm, bradycardia,
    secretions), titrated to drying of secretions; it does not treat nicotinic
    (muscle) effects.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: atropine
      term:
        id: CHEBI:16684
        label: atropine
  target_mechanisms:
  - target: Muscarinic receptor overstimulation
    treatment_effect: INHIBITS
    description: Atropine competitively blocks muscarinic acetylcholine receptors, reversing muscarinic toxicity.
  evidence:
  - reference: PMID:34053713
    reference_title: "Management of Organophosphorus Poisoning: Standard Treatment and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Atropine remains the mainstay of treatment, but recently some promising therapies are in the pipeline."
    explanation: Supports atropine as the mainstay antidote.
  - reference: PMID:30230960
    reference_title: "Novel Clinical Toxicology and Pharmacology of Organophosphorus Insecticide Self-Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rapid titration of atropine during resuscitation is lifesaving and can be performed in the absence of oxygen."
    explanation: Supports rapid atropine titration as lifesaving.
- name: Pralidoxime
  description: >-
    Pralidoxime and other oximes reactivate phosphorylated acetylcholinesterase
    before it ages, targeting the nicotinic (neuromuscular) features atropine
    does not; however, clinical trial evidence for pralidoxime benefit is
    uncertain and contested.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pralidoxime
      term:
        id: CHEBI:8354
        label: pralidoxime
  target_mechanisms:
  - target: Acetylcholinesterase inhibition
    treatment_effect: INHIBITS
    description: Pralidoxime reactivates inhibited acetylcholinesterase before aging, restoring enzyme function.
  evidence:
  - reference: PMID:32257715
    reference_title: "The Efficacy of Pralidoxime in the Treatment of Organophosphate Poisoning in Humans: A Systematic Review and Meta-analysis of Randomized Trials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro experiments have consistently shown that oximes are effective reactivators of human acetylcholinesterase enzyme, inhibited by OP compounds."
    explanation: In vitro data support the mechanistic rationale that oximes reactivate inhibited acetylcholinesterase.
- name: Benzodiazepine
  description: >-
    Benzodiazepines such as diazepam control organophosphate-induced seizures and
    status epilepticus and reduce central-nervous-system injury.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
  target_mechanisms:
  - target: Central cholinergic overstimulation
    treatment_effect: INHIBITS
    description: Benzodiazepines suppress cholinergic seizure activity in the central nervous system.
  evidence:
  - reference: PMID:25455666
    reference_title: "Organophosphate and carbamate poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Decontamination, meticulous supportive care, aggressive antimuscarinic therapy, seizure control, and administration of oximes are cornerstones of management."
    explanation: Supports seizure control as a cornerstone of management, the role of benzodiazepines.
- name: Mechanical ventilation
  description: >-
    Airway management and mechanical ventilation support patients through
    respiratory failure from the cholinergic crisis and the intermediate
    syndrome.
  treatment_term:
    preferred_term: artificial respiration
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory failure
    treatment_effect: INHIBITS
    description: Ventilatory support sustains gas exchange until neuromuscular and central function recover.
  evidence:
  - reference: PMID:3029588
    reference_title: "Neurotoxic effects of organophosphorus insecticides. An intermediate syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four patients urgently required ventilatory support."
    explanation: Supports mechanical ventilation for respiratory failure in OP poisoning.
- name: Magnesium sulfate
  description: >-
    Magnesium sulfate is an investigational adjunct proposed to reduce
    acetylcholine release and calcium influx at the neuromuscular junction; it is
    among several promising but not yet established treatment alternatives.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: magnesium sulfate
      term:
        id: CHEBI:32599
        label: magnesium sulfate
  target_mechanisms:
  - target: Synaptic acetylcholine accumulation
    treatment_effect: INHIBITS
    description: Magnesium is proposed to reduce presynaptic acetylcholine release at the neuromuscular junction.
  evidence:
  - reference: PMID:34053713
    reference_title: "Management of Organophosphorus Poisoning: Standard Treatment and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Magnesium sulfate, calcium channel blockers (nimodipine), plasma alkalinizing agents, β-2 agonists, nicotinic receptor antagonists, clonidine, and lipid emulsions are promising treatment alternatives."
    explanation: Supports magnesium sulfate as a promising investigational adjunct treatment.
discussions:
- discussion_id: gap_op_oxime_efficacy
  prompt: >-
    Do oximes such as pralidoxime provide a clinical benefit in acute
    organophosphate poisoning, and if so in which patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Pralidoxime
  - pathophysiology#Acetylcholinesterase inhibition
  rationale: >-
    Oximes reactivate inhibited acetylcholinesterase in vitro and are
    mechanistically rational, and are recommended in many protocols. However,
    randomized trials and meta-analyses have not demonstrated a clinical benefit
    and have suggested possible harm, so which patients (if any) benefit, and the
    optimal agent, dose, and timing before aging, remain unresolved.
  evidence:
  - reference: PMID:32257715
    reference_title: "The Efficacy of Pralidoxime in the Treatment of Organophosphate Poisoning in Humans: A Systematic Review and Meta-analysis of Randomized Trials."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A recent meta-analysis has found that pralidoxime provides no significant improvement in outcome and rather may cause harm while increasing the economic burden in low-income communities where its use is the most prevalent."
    explanation: Provides the negative-trial evidence that motivates the open question about oxime clinical benefit.

definitions:
- name: Clinical case definition for organophosphate poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Organophosphate poisoning is a cholinergic toxic syndrome caused by
    organophosphorus compounds that inhibit acetylcholinesterase, leading to
    acetylcholine accumulation and overstimulation of muscarinic and nicotinic
    receptors, confirmed by depressed blood cholinesterase activity in a
    compatible exposure context.
  scope: Disease-level clinical framing across acute crisis and delayed syndromes
  evidence:
  - reference: PMID:37888716
    reference_title: "Mechanisms of Organophosphate Toxicity and the Role of Acetylcholinesterase Inhibition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary mechanism, common among all OPs, that initiates their toxic effects is the inhibition of acetylcholinesterase."
    explanation: Supports acetylcholinesterase inhibition as the unifying mechanism defining the disease.
parents:
- pesticide poisoning
prevalence:
- population: Worldwide (organophosphorus pesticide self-poisoning)
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    Organophosphorus pesticide self-poisoning kills an estimated 200,000 people
    per year worldwide, with case fatality generally over 15%; it is a leading
    cause of poisoning death in the developing world.
  evidence:
  - reference: PMID:17706760
    reference_title: "Management of acute organophosphorus pesticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Organophosphorus pesticide self-poisoning is an important clinical problem in rural regions of the developing world, and kills an estimated 200,000 people every year."
    explanation: Provides the global mortality burden of organophosphorus self-poisoning.
has_subtypes:
- name: Acute Cholinergic Crisis
  description: >-
    The immediate syndrome following organophosphate exposure, driven by
    acetylcholine accumulation: muscarinic features (miosis, hypersalivation,
    bronchorrhea, bradycardia, diarrhea), nicotinic features (fasciculations,
    muscle weakness), and central features (seizures, coma), with respiratory
    failure the principal cause of death.
  evidence:
  - reference: PMID:37888716
    reference_title: "Mechanisms of Organophosphate Toxicity and the Role of Acetylcholinesterase Inhibition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In acute OP exposure, the subsequent surge of acetylcholine in cholinergic synapses causes a peripheral cholinergic crisis and status epilepticus (SE), either of which can lead to death."
    explanation: Supports the acute cholinergic crisis as the immediate syndrome from acetylcholine surge.
- name: Intermediate Syndrome
  description: >-
    A syndrome of proximal limb, neck flexor, cranial nerve, and respiratory
    muscle weakness appearing roughly 24-96 hours after the cholinergic crisis,
    attributed to prolonged neuromuscular-junction dysfunction; it can
    precipitate respiratory failure after the acute crisis has resolved and does
    not respond to atropine or oximes.
  evidence:
  - reference: PMID:3029588
    reference_title: "Neurotoxic effects of organophosphorus insecticides. An intermediate syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed 10 patients who had paralysis of proximal limb muscles, neck flexors, motor cranial nerves, and respiratory muscles 24 to 96 hours after poisoning, after a well-defined cholinergic phase."
    explanation: The original description establishing the intermediate syndrome as a distinct entity 24-96 hours after the cholinergic phase.
- name: Organophosphate-Induced Delayed Polyneuropathy
  display_name: Organophosphate-Induced Delayed Polyneuropathy (OPIDN)
  description: >-
    A distal, predominantly motor sensorimotor axonopathy appearing 1-3 weeks
    after exposure to certain organophosphates, caused by inhibition and aging of
    neuropathy target esterase (NTE/PNPLA6) rather than acetylcholinesterase.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0957912
        label: organophosphate-induced delayed polyneuropathy
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: MONDO identifier for the delayed-polyneuropathy subtype.
  evidence:
  - reference: PMID:16042503
    reference_title: "Organophosphate-induced delayed polyneuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is characterised by distal degeneration of some axons of both the peripheral and central nervous systems occurring 1-4 weeks after single or short-term exposures."
    explanation: Defines OPIDN as a distal axonopathy occurring 1-4 weeks after exposure.
pathophysiology:
- name: Organophosphate exposure and absorption
  description: >-
    Organophosphorus compounds enter the body across the skin, respiratory tract,
    and gastrointestinal tract following agricultural, occupational, intentional,
    or chemical-warfare exposure, and are distributed systemically to reach their
    molecular targets; in high doses they are toxic or lethal. This shared entry
    point feeds both the acetylcholinesterase arm (via bioactivation) and the
    delayed neuropathy-target-esterase arm.
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    modifier: INCREASED
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: Organophosphate bioactivation
    description: Absorbed phosphorothioate pro-toxicants undergo hepatic activation to their oxon form.
  - target: Neuropathy target esterase inhibition
    description: Absorbed neuropathic organophosphates reach peripheral and central neurons and inhibit neuropathy target esterase.
  evidence:
  - reference: PMID:37888716
    reference_title: "Mechanisms of Organophosphate Toxicity and the Role of Acetylcholinesterase Inhibition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In high doses or chronic exposure, they can be toxic or lethal."
    explanation: Supports systemic organophosphate exposure producing toxicity, the shared upstream event.
- name: Organophosphate bioactivation
  description: >-
    Many organophosphate insecticides are phosphorothioate (P=S, "thion")
    pro-toxicants that require hepatic cytochrome P450-mediated oxidative
    desulfuration to their active oxon (P=O) form, a far more potent
    cholinesterase inhibitor. Direct-acting oxons and nerve agents skip this step,
    and the speed of activation varies between compounds.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: xenobiotic metabolic process
    modifier: INCREASED
    term:
      id: GO:0006805
      label: xenobiotic metabolic process
  downstream:
  - target: Acetylcholinesterase inhibition
    description: The activated oxon phosphorylates and inhibits acetylcholinesterase.
  evidence:
  - reference: PMID:30230960
    reference_title: "Novel Clinical Toxicology and Pharmacology of Organophosphorus Insecticide Self-Poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variability between organophosphorus insecticides-in lipophilicity, speed of activation, speed and potency of acetylcholinesterase inhibition, and in the chemical groups attached to the phosphorus-results in variable speed of poisoning onset, severity, clinical toxidrome, and case fatality."
    explanation: Supports the requirement and variability of metabolic activation among organophosphorus insecticides.
- name: Acetylcholinesterase inhibition
  description: >-
    The active organophosphate phosphorylates the serine hydroxyl in the
    catalytic site of acetylcholinesterase, covalently inactivating the enzyme
    that normally hydrolyzes acetylcholine, so acetylcholine breakdown falls.
  biological_processes:
  - preferred_term: acetylcholine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006581
      label: acetylcholine catabolic process
  downstream:
  - target: Aging of inhibited acetylcholinesterase
    description: The phosphorylated enzyme can undergo dealkylation that makes inhibition irreversible.
  - target: Synaptic acetylcholine accumulation
    description: Loss of acetylcholinesterase activity prevents breakdown of acetylcholine at synapses.
  evidence:
  - reference: PMID:24508992
    reference_title: "Acute organophosphorus poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of acetylcholinesterase enzyme is the main mechanism of toxicity of such pesticides and measurement of acetylcholinesterase activity is the commonly used laboratory diagnosis approved for the purpose."
    explanation: Supports acetylcholinesterase inhibition as the main toxic mechanism.
  - reference: PMID:17913691
    reference_title: "Red blood cell acetylcholinesterase and plasma butyrylcholinesterase status: important indicators for the treatment of patients poisoned by organophosphorus compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of acetylcholinesterase (AChE) is regarded as the primary toxic mechanism of organophosphorus compounds (OP)."
    explanation: Independently supports acetylcholinesterase inhibition as the primary toxic mechanism.
- name: Aging of inhibited acetylcholinesterase
  description: >-
    After phosphorylation, the enzyme-organophosphate adduct can lose an alkyl
    group ("aging"), converting the initially reversible inhibition into an
    irreversible bond that oxime reactivators can no longer cleave; recovery then
    requires synthesis of new enzyme. The aging rate is compound-dependent and
    sets the therapeutic window for oxime therapy.
  biological_processes:
  - preferred_term: acetylcholine catabolic process
    modifier: DECREASED
    term:
      id: GO:0006581
      label: acetylcholine catabolic process
  evidence:
  - reference: PMID:26563788
    reference_title: "Organophosphorus and carbamate insecticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "With OP insecticides (but not carbamates), \"aging\" may also occur by partial dealkylation of the serine group at the active site of AChE; recovery of AChE activity requires synthesis of new enzyme in the liver."
    explanation: Directly supports aging by dealkylation making inhibition irreversible.
- name: Synaptic acetylcholine accumulation
  description: >-
    With acetylcholinesterase inhibited, acetylcholine released at cholinergic
    synapses is not degraded and accumulates at autonomic, neuromuscular, and
    central synapses, producing sustained receptor stimulation.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Muscarinic receptor overstimulation
    description: Excess acetylcholine overstimulates muscarinic acetylcholine receptors.
  - target: Nicotinic receptor overstimulation
    description: Excess acetylcholine overstimulates nicotinic acetylcholine receptors.
  - target: Central cholinergic overstimulation
    description: Excess acetylcholine overstimulates central nervous system cholinergic pathways.
  evidence:
  - reference: PMID:26563788
    reference_title: "Organophosphorus and carbamate insecticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both organophosphorus (OP) and carbamate insecticides inhibit acetylcholinesterase (AChE), which results in accumulation of acetylcholine (ACh) at autonomic and some central synapses and at autonomic postganglionic and neuromuscular junctions."
    explanation: Supports acetylcholine accumulation across autonomic, central, and neuromuscular synapses.
- name: Muscarinic receptor overstimulation
  description: >-
    Accumulated acetylcholine overstimulates muscarinic receptors on smooth
    muscle, glands, and the heart, producing parasympathetic and secretory
    excess: miosis, lacrimation, salivation, bronchorrhea, bronchoconstriction,
    bradycardia, gastrointestinal hypermotility, sweating, and urinary
    incontinence (the SLUDGE/DUMBELS pattern).
  biological_processes:
  - preferred_term: G protein-coupled acetylcholine receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007213
      label: G protein-coupled acetylcholine receptor signaling pathway
  downstream:
  - target: Respiratory failure
    description: Bronchorrhea and bronchoconstriction impair gas exchange and contribute to respiratory failure.
  evidence:
  - reference: PMID:26563788
    reference_title: "Organophosphorus and carbamate insecticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ACh binds to, and stimulates, muscarinic and nicotinic receptors, thereby producing characteristic features."
    explanation: Supports muscarinic receptor stimulation as the source of the characteristic muscarinic features.
- name: Nicotinic receptor overstimulation
  description: >-
    Accumulated acetylcholine overstimulates nicotinic receptors at the
    neuromuscular junction and autonomic ganglia, causing fasciculations
    followed by depolarizing neuromuscular blockade and weakness, together with
    sympathetic ganglionic effects such as tachycardia and hypertension.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  downstream:
  - target: Intermediate syndrome
    description: Prolonged nicotinic overstimulation and postsynaptic neuromuscular-junction dysfunction give rise to the delayed intermediate syndrome.
  - target: Respiratory failure
    description: Neuromuscular block from nicotinic overstimulation weakens the respiratory muscles and contributes to respiratory failure.
    evidence:
    - reference: PMID:17913691
      reference_title: "Red blood cell acetylcholinesterase and plasma butyrylcholinesterase status: important indicators for the treatment of patients poisoned by organophosphorus compounds."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Reactivation is crucial within the neuromuscular synapse, where atropine is ineffective, since peripheral neuromuscular block eventually leads to respiratory failure."
      explanation: Links neuromuscular nicotinic block to respiratory failure.
  evidence:
  - reference: PMID:25455666
    reference_title: "Organophosphate and carbamate poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the setting of toxicity from either agent class, clinical syndromes result from excessive nicotinic and muscarinic neurostimulation."
    explanation: Supports nicotinic overstimulation as a source of the clinical syndrome.
- name: Central cholinergic overstimulation
  description: >-
    Acetylcholine accumulation in the central nervous system overstimulates
    central cholinergic pathways, producing anxiety, confusion, seizures and
    status epilepticus, depression of the central respiratory drive, and coma.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cholinergic synaptic transmission
    modifier: INCREASED
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  downstream:
  - target: Respiratory failure
    description: Central depression of the respiratory center contributes to respiratory failure.
  evidence:
  - reference: PMID:37888716
    reference_title: "Mechanisms of Organophosphate Toxicity and the Role of Acetylcholinesterase Inhibition."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In acute OP exposure, the subsequent surge of acetylcholine in cholinergic synapses causes a peripheral cholinergic crisis and status epilepticus (SE), either of which can lead to death."
    explanation: Supports central cholinergic overstimulation producing status epilepticus.
- name: Respiratory failure
  description: >-
    Respiratory failure is the principal cause of death in acute organophosphate
    poisoning and arises from the convergence of muscarinic bronchorrhea and
    bronchoconstriction, nicotinic respiratory-muscle weakness, and central
    depression of the respiratory drive.
  biological_processes:
  - preferred_term: respiratory gaseous exchange by respiratory system
    modifier: DECREASED
    term:
      id: GO:0007585
      label: respiratory gaseous exchange by respiratory system
  evidence:
  - reference: PMID:17913691
    reference_title: "Red blood cell acetylcholinesterase and plasma butyrylcholinesterase status: important indicators for the treatment of patients poisoned by organophosphorus compounds."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Reactivation is crucial within the neuromuscular synapse, where atropine is ineffective, since peripheral neuromuscular block eventually leads to respiratory failure."
    explanation: Supports respiratory failure from peripheral neuromuscular block.
- name: Intermediate syndrome
  description: >-
    Roughly 24-96 hours after the acute crisis, a subset of patients develop
    proximal limb, neck flexor, cranial nerve, and respiratory muscle weakness
    attributed to persistent postsynaptic neuromuscular-junction dysfunction,
    independent of ongoing muscarinic signs and unresponsive to atropine and
    oximes.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    modifier: ABNORMAL
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
  downstream:
  - target: Respiratory failure
    description: Weakness of the respiratory muscles in the intermediate syndrome can precipitate respiratory failure after the acute crisis has resolved.
  evidence:
  - reference: PMID:26563788
    reference_title: "Organophosphorus and carbamate insecticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This involves the onset of muscle paralysis affecting particularly upper-limb muscles, neck flexors, and cranial nerves some 24-96 hours after OP exposure and is often associated with the development of respiratory failure."
    explanation: Supports the intermediate syndrome as delayed neuromuscular weakness with respiratory failure.
- name: Neuropathy target esterase inhibition
  description: >-
    Certain organophosphates inhibit and then age a second serine esterase,
    neuropathy target esterase (NTE/PNPLA6), an integral membrane protein in
    neurons. This mechanism is independent of acetylcholinesterase inhibition and
    initiates the delayed neuropathy after a 1-3 week latency.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: phospholipid metabolic process
    modifier: DECREASED
    term:
      id: GO:0006644
      label: phospholipid metabolic process
  downstream:
  - target: Distal axonal degeneration
    description: Inhibition and aging of neuropathy target esterase triggers a distal, dying-back axonopathy.
  evidence:
  - reference: PMID:10585848
    reference_title: "Neuropathy target esterase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "organophosphates which react with NTE in vivo initiate unknown events which lead, after a delay of 1-3 weeks, to a neuropathy with degeneration of long axons."
    explanation: Supports NTE reaction initiating delayed neuropathy with long-axon degeneration.
  - reference: PMID:26563788
    reference_title: "Organophosphorus and carbamate insecticide poisoning."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OP-induced delayed neuropathy results from phosphorylation and subsequent aging of at least 70% of neuropathy target esterase."
    explanation: Supports phosphorylation and aging of NTE as the trigger of delayed neuropathy.
- name: Distal axonal degeneration
  description: >-
    One to four weeks after exposure, a distal dying-back degeneration of long
    axons in peripheral nerves and central tracts, with axonal degeneration and
    secondary demyelination, produces the predominantly motor sensorimotor
    polyneuropathy of OPIDN.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: axonal transport
    modifier: DECREASED
    term:
      id: GO:0098930
      label: axonal transport
  evidence:
  - reference: PMID:16042503
    reference_title: "Organophosphate-induced delayed polyneuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nerve biopsies have been performed in a few cases and showed axonal degeneration with secondary demyelination."
    explanation: Supports distal axonal degeneration with secondary demyelination as the OPIDN lesion.

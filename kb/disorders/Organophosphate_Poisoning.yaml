name: Organophosphate Poisoning
creation_date: "2026-07-10T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Pesticide Poisoning
- Environmental Health Disorder
synonyms:
- organophosphate toxicity
- organophosphorus poisoning
- OP poisoning
- anticholinesterase poisoning
description: >-
  Organophosphate poisoning is a toxic condition caused by exposure to
  organophosphorus compounds, most commonly organophosphate insecticides
  (e.g., chlorpyrifos, parathion, malathion, dimethoate) and chemical-warfare
  nerve agents (e.g., sarin, VX). It is a leading cause of fatal pesticide
  self-poisoning worldwide, particularly in agricultural regions of low- and
  middle-income countries, and also occurs through occupational and accidental
  exposure. The unifying mechanism is inhibition of acetylcholinesterase: the
  active compound phosphorylates the enzyme's catalytic serine, preventing
  hydrolysis of acetylcholine, which then accumulates at cholinergic synapses.
  Overstimulation of muscarinic receptors, nicotinic receptors, and central
  cholinergic pathways produces the acute cholinergic crisis (miosis,
  hypersalivation, bronchorrhea, bradycardia, diarrhea, fasciculations, muscle
  weakness, seizures, and respiratory failure). Over hours the phosphorylated
  enzyme can undergo irreversible "aging," and some patients develop an
  intermediate syndrome of proximal and respiratory muscle weakness or, weeks
  later, an organophosphate-induced delayed polyneuropathy. Treatment combines
  decontamination, the muscarinic antagonist atropine, the cholinesterase
  reactivator pralidoxime, benzodiazepines for seizures, and ventilatory support.

genetic:
- name: BCOR
  gene_term:
    preferred_term: BCOR
    term:
      id: hgnc:20893
      label: BCOR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    BCOR (Xp11.4) encodes the BCL-6 corepressor. OFCD-causing variants are
    null alleles — nonsense, frameshift, canonical splice-site, and partial or
    whole-gene deletions. Most are de novo; familial transmission and parental
    germline mosaicism are both documented. Truncating BCOR alleles are
    essentially absent from population databases, consistent with strong
    purifying selection given male lethality. Hypomorphic missense alleles at
    the same locus (notably c.254C>T, p.Pro85Leu) instead cause Lenz
    microphthalmia syndrome in hemizygous males.
  evidence:
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found different frameshift, deletion and nonsense mutations in BCOR in seven families affected with OFCD"
    explanation: Original gene-disease association, based on truncating variants in seven OFCD families.
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a substitution, nt 254C-->T; P85L, in BCOR (encoding BCL-6-interacting corepressor, BCOR) in affected males from the family with Lenz syndrome"
    explanation: Documents the allelic Lenz missense variant, establishing the mutation-class distinction from OFCD.

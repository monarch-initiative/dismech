      explanation: Supports the specific edge from unrestrained Notch through ESR1/HDAC1 to Pitx2 silencing and disrupted cardiac laterality.
- name: Defective Lateralization
  biological_scale: ORGANISM
  description: >-
    Loss of Pitx2-dependent left-right patterning produces defective
    lateralization at the organism scale — dextrocardia, asplenia, and
    intestinal malrotation. This is the clinical endpoint of the
    Notch/Pitx2 arm and is distinct from the septation defect, which
    concerns chamber morphogenesis rather than situs.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24440151
    reference_title: "A potential molecular pathogenesis of cardiac/laterality defects in Oculo-Facio-Cardio-Dental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defective lateralization includes dextrocardia, asplenia and intestinal malrotation."
    explanation: Enumerates the organism-scale laterality phenotypes attributed to OFCD.
- name: Hemizygous Male Embryonic Lethality
  biological_scale: ORGANISM
  description: >-
    Males hemizygous for a BCOR null allele have no BCOR-competent cell
    lineage and die in utero, which is why OFCD is observed essentially only
    in females. Mouse male chimeras hemizygous for gene-trapped Bcor null
    alleles die by embryonic day E9.5.
  evidence:
  - reference: PMID:32692983
    reference_title: "OFCD syndrome and extraembryonic defects are revealed by conditional mutation of the Polycomb-group repressive complex 1.1 (PRC1.1) gene BCOR."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "hemizygous mutations of BCOR in males cause gestational lethality"
    explanation: Confirms male hemizygous lethality as the reason OFCD manifests only in females.
  - reference: PMID:22301464
    reference_title: "A family of oculofaciocardiodental syndrome (OFCD) with a novel BCOR mutation and genomic rearrangements involving NHS."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oculofaciocardiodental syndrome (OFCD) is an X-linked dominant disorder associated with male lethality"
    explanation: Human clinical characterization of OFCD as male-lethal.
mechanistic_hypotheses:
- hypothesis_group_id: bcor_bcl6_independent_mechanism
  hypothesis_label: Pathogenesis via BCL-6-independent BCOR functions
  status: EMERGING
  description: >-
    Ng et al. showed that OFCD-mutant BCOR retains the ability to bind BCL-6
    and repress transcription in reporter assays, and concluded that OFCD must
    result from defects in BCOR functions other than BCL-6 corepression — most
    plausibly its scaffolding role in ncPRC1.1. The later periodontal-ligament
    work, however, found that mutant BCOR fails to be recruited to the
    BCL6-binding region of the ZFPM2 promoter, implicating a BCL-6-dependent
    step at least at that locus. These are not necessarily contradictory —
    generic reporter corepression and native promoter recruitment probe
    different things — but the relative contribution of ncPRC1.1 scaffolding
    versus locus-specific BCL-6-dependent recruitment to OFCD pathogenesis
    remains unresolved. Curated as an open question; the causal edges above
    are stated at the observation level rather than committing to either arm.
  evidence:
  - reference: PMID:15004558
    reference_title: "Oculofaciocardiodental and Lenz microphthalmia syndromes result from distinct classes of mutations in BCOR."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This indicates that these syndromes are likely to result from defects in alternative functions of BCOR, such as interactions with transcriptional partners other than BCL-6."
    explanation: The gene-discovery study explicitly proposes BCL-6-independent BCOR functions as the pathogenic route.
  - reference: PMID:35957990
    reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "BCOR regulates downstream genes via BCL6 as a transcriptional corepressor."
    explanation: >-
      Counterweight to the hypothesis: at the ZFPM2 locus the pathogenic
      mechanism is framed as BCL6-dependent, so the BCL-6-independent model is
      not exclusive.
- hypothesis_group_id: radiculomegaly_zfpm2_route
  hypothesis_label: Radiculomegaly via BCL6-dependent ZFPM2 derepression
  status: EMERGING
  description: >-
    Radiculomegaly results from failure of mutant BCOR to be recruited to the
    BCL6-binding region of the ZFPM2 promoter, derepressing ZFPM2 and raising
    alkaline phosphatase in periodontal ligament cells. Evidence is from
    patient PDL cells carrying a single frameshift allele (c.3668delC), with
    ZFPM2 knockdown rescuing the cellular phenotype.
  evidence:
  - reference: PMID:35957990
    reference_title: "Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockdown of ZFPM2 expression in mutant PDL cells significantly reduced cellular proliferation as well as mRNA expression of alkaline phosphatase, an important marker of odontoblasts and cementoblasts."
    explanation: Rescue-by-knockdown is the strongest evidence for the ZFPM2 route.
- hypothesis_group_id: radiculomegaly_ap2alpha_route
  hypothesis_label: Radiculomegaly via chromatin-level AP-2alpha derepression in MSCs
  status: EMERGING
  description: >-
    Radiculomegaly results from BCOR loss raising H3K4/H3K36 methylation and
    reactivating silenced targets in dental mesenchymal stem cells, with
    AP-2alpha (TFAP2A) the key derepressed factor mediating increased
    osteo-dentinogenic capacity. This account is chromatin-level and
    BCL6-independent in emphasis, whereas the ZFPM2 account is
    promoter-specific and BCL6-dependent. Both derive from patient-derived
    cells but from different cell types (MSC versus periodontal ligament), and
    no study has yet tested them head to head or established whether they are
    two views of one cascade or genuinely separate routes to the same
    endpoint. Curated as parallel EMERGING hypotheses rather than ranked.
  evidence:
  - reference: PMID:19578371
    reference_title: "BCOR regulates mesenchymal stem cell function by epigenetic mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gain- and loss-of-function assays suggest that AP-2alpha is a key factor that mediates the increased osteo-dentinogenic capacity of MSCs."
    explanation: Gain- and loss-of-function assays position AP-2alpha as the mediating factor in this route.

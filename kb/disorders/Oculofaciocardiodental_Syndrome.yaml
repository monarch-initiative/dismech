  downstream:
  - target: Defective Lateralization
    description: >-
      Pitx2 is the terminal effector of the left-right cascade, so its
      suppression in the left lateral plate mesoderm manifests as reversed or
      randomized situs across heart, spleen, and gut.
    evidence:
    - reference: PMID:24440151
      reference_title: "A potential molecular pathogenesis of cardiac/laterality defects in Oculo-Facio-Cardio-Dental syndrome."
      supports: SUPPORT
